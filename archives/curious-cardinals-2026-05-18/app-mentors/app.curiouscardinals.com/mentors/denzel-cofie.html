xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b3145116-56a7-41ec-8a05-048f6bb9c301\"}":{"__typename":"DeepDives","uuid":"b3145116-56a7-41ec-8a05-048f6bb9c301","content":"\u003cp\u003eIn my spare time, I love to cook! I grew up watching the Food Network and countless cooking shows on YouTube, and whenever I can I like to try out new recipes. In particular, I love cooking for my family and friends. Sure, it can be time-consuming, but there's just something about all that time and work turning into something I can make for others that makes it really enjoyable. I'm also a huge comic book nerd and love building legos. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f5e31b9f-5595-4225-8f0e-037860fdba29\"}":{"__typename":"DeepDives","uuid":"f5e31b9f-5595-4225-8f0e-037860fdba29","content":"\u003cp\u003eMy current passion project is a continuation of a project I made for one of my engineering classes. It's a kitchen cutting board that has a built-in bench scraper and trays to hold chopped ingredients. For the class I knew I wanted to make something practical that I would use in my daily life, and so I made the board to help organize my ingredient prep while cooking. Currently I'm refining my design and thinking through possible new additions to the board!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ad92ba17-9a62-4bbb-b9a4-8f3f7475bbd0\"}":{"__typename":"DeepDives","uuid":"ad92ba17-9a62-4bbb-b9a4-8f3f7475bbd0","content":"\u003cp\u003eI’d tell my high school self that just because something feels hard doesn’t mean you’re not smart or capable. I used to think struggling meant I wasn’t good enough, that I was somehow behind everyone else. It took me a long time to realize that struggle is a sign of learning, and helps you grow if you embrace it.\u003c/p\u003e\u003cp\u003eI wish I had known sooner how powerful a growth mindset is. But now I understand that intelligence isn’t fixed. The smartest people aren’t the ones who “get it” right away, but the ones who keep showing up when it’s hard.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c28a399c-c3ec-42be-a6d4-189eebaad9f1\"}":{"__typename":"DeepDives","uuid":"c28a399c-c3ec-42be-a6d4-189eebaad9f1","content":"\u003cp\u003eMentorship matters to me because of all the people who’ve supported me throughout my academic journey. I’ve been incredibly fortunate to learn from teachers, peers, and mentors who took the time to guide me, challenge me, and believe in me, especially during times when I doubted myself. To me, being a mentor means recognizing someone's potential, especially if that person can't see it, and helping them to grow into that potential. I also believe it’s important to pay that gift forward and show up for others the way my mentors showed up for me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"af271d85-9a27-406d-883c-bbe15a92d668\"}":{"__typename":"School","uuid":"af271d85-9a27-406d-883c-bbe15a92d668","name":"Boston College High School","city":"Boston","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02125"},"Education:{\"uuid\":\"c4403716-7bb3-4d72-b606-eff6ac142d93\"}":{"__typename":"Education","uuid":"c4403716-7bb3-4d72-b606-eff6ac142d93","school":{"__ref":"School:{\"uuid\":\"af271d85-9a27-406d-883c-bbe15a92d668\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"71768d0c-70be-49b0-b5ea-ff2662d4c95a\"}":{"__typename":"Education","uuid":"71768d0c-70be-49b0-b5ea-ff2662d4c95a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"527f1ab5-bb0a-4d9c-ac44-7ff09d1f11cc\"}":{"__typename":"MentorPublicProfile","uuid":"527f1ab5-bb0a-4d9c-ac44-7ff09d1f11cc","displayName":"Denzel C.","slug":"denzel-cofie","biography":"\u003cp\u003eHi, my name is Denzel Cofie! I’m a rising junior at Stanford University studying mechanical engineering with a strong interest in robotics, sustainability, and the ways technology can be used to improve everyday life. Ever since I started putting together and taking apart LEGO sets as a kid, I’ve always been fascinated by how things work, and how an idea can become something tangible that moves, solves problems, or helps people. That curiousity and creativity is what first drew me to mechanical engineering.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would say I’m definitely a hands-on learner. I thrive when I’m building, testing, iterating, and figuring things out through trial and error. One of my most impactful experiences so far was a mechanical design course I took during the spring of sophomore year in college, where I designed and manufactured a product from scratch. Not only did I learn so much about different kinds of machines and manual manufacturing processes, but the whole project really pushed me out of my comfort zone and reminded me that some of the most meaningful growth happens when things don’t go according to plan, and those challenges help you grow. I came out of it more confident, not just in my technical skills, but in my ability to keep going when something feels hard.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in Massachusetts, about an hour south of Boston, where my parents immigrated to from Ghana. Growing up, my parents always emphasized the value of hard work, education, and giving back. As a first-generation college student, I’ve learned to navigate challenges by leaning into persistence, community, and self-belief. My background has shaped how I approach learning: as not just as a way to succeed, but as a way to honor where I come from and open doors for others. Because of how much support I’ve received, I care deeply about mentorship and representation in STEM. I know what it’s like to feel out of place in a space and how powerful it can be when someone takes the time to guide you. I try to do that for others whenever I can, whether by helping classmates, sharing advice, or simply being someone who listens. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love cooking, collecting LEGO sets, reading comic books, and playing ultimate frisbee. I also love camping and was a Boy Scout for years before I achieved my Eagle Scout rank. Whether I’m designing something, making a meal, or diving into a story, I’m always looking for ways to stay creative and connected to the things that bring me joy.\u003c/p\u003e","teachingVideoPlaybackId":"Bj3snfVhtMcsuv6ir4DX2UwBsVXVLjpir8u4MPJWwdY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b3145116-56a7-41ec-8a05-048f6bb9c301\"}"},{"__ref":"DeepDives:{\"uuid\":\"f5e31b9f-5595-4225-8f0e-037860fdba29\"}"},{"__ref":"DeepDives:{\"uuid\":\"ad92ba17-9a62-4bbb-b9a4-8f3f7475bbd0\"}"},{"__ref":"DeepDives:{\"uuid\":\"c28a399c-c3ec-42be-a6d4-189eebaad9f1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/57837c64-1e79-4553-856c-1815a085de75/-/preview/-/format/jpg/","https://ucarecdn.com/fb4e0ce3-e4a3-4e06-bc95-6849a6481929/-/preview/-/format/jpg/","https://ucarecdn.com/be1749ac-d8f6-4e08-8054-4a2cce8d2f54/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c4403716-7bb3-4d72-b606-eff6ac142d93\"}"},{"__ref":"Education:{\"uuid\":\"71768d0c-70be-49b0-b5ea-ff2662d4c95a\"}"}],"hiredAt":"2025-07-03T16:22:27.813Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Writing","Spanish","Academic Coaching","Executive Function","Reading"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"denzel-cofie\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"527f1ab5-bb0a-4d9c-ac44-7ff09d1f11cc\"}"}}},"_sentryTraceData":"3c421791be704e2c946b4ec367440f62-b17a30114778ee94-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc
