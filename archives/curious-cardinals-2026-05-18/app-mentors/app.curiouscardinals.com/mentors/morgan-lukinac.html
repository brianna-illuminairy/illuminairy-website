xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f4f90fde-cb08-436b-989a-6cd246351c13\"}":{"__typename":"DeepDives","uuid":"f4f90fde-cb08-436b-989a-6cd246351c13","content":"\u003cp\u003eI would tell myself not to stress out too much and that everything works out the way it needs to be if I follow my passions and things that make me excited. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4c3cc5b5-b594-42ec-817e-9a82c66bf3ff\"}":{"__typename":"DeepDives","uuid":"4c3cc5b5-b594-42ec-817e-9a82c66bf3ff","content":"\u003cp\u003eI would love to teach people what I wish I knew about environmental science and swimming when I was in highschool\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"1ff4675c-8479-4c4f-ae04-e8f562412017\"}":{"__typename":"DeepDives","uuid":"1ff4675c-8479-4c4f-ae04-e8f562412017","content":"\u003cp\u003eI would spend my summers swimming and enjoying the Colorado nature, hiking, and biking around town!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"3a9ca35c-8af3-4b01-992a-9248e91813ab\"}":{"__typename":"DeepDives","uuid":"3a9ca35c-8af3-4b01-992a-9248e91813ab","content":"\u003cp\u003eI am extremely proud of passing AP Chemistry in high school because I really did not want to take that class and it was the hardest class EVER(for me haha) and I needed to get tutored so much!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"85d9b5a9-d1d4-49a5-bf8d-d00aca6a1436\"}":{"__typename":"School","uuid":"85d9b5a9-d1d4-49a5-bf8d-d00aca6a1436","name":"Fairview High School","city":"Boulder","type":"HIGH","state":"Colorado","country":"United States","zip":"80305"},"Education:{\"uuid\":\"5edd5c1f-3d2d-468b-9e81-8ec6b640903c\"}":{"__typename":"Education","uuid":"5edd5c1f-3d2d-468b-9e81-8ec6b640903c","school":{"__ref":"School:{\"uuid\":\"85d9b5a9-d1d4-49a5-bf8d-d00aca6a1436\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"86c670c0-ab87-44b5-b8df-c9757207263f\"}":{"__typename":"Education","uuid":"86c670c0-ab87-44b5-b8df-c9757207263f","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Environmental Science","degree":null},"MentorPublicProfile:{\"uuid\":\"46662668-6a5a-483e-8733-0d68765c633a\"}":{"__typename":"MentorPublicProfile","uuid":"46662668-6a5a-483e-8733-0d68765c633a","displayName":"Morgan L.","slug":"morgan-lukinac","biography":"\u003cp\u003eHi! I'm currently a student-athlete at Brown University, where I’m pursuing a degree in Environmental Justice and Health while competing on the varsity swim team. My two biggest passions—swimming and environmental science—may seem worlds apart, but both are deeply rooted in my drive to push limits, overcome challenges, and make a meaningful impact.\u003c/p\u003e\u003cp\u003eIn the pool, I’m an Olympic Trials qualifier and Ivy League champion in freestyle events. I’ve experienced both the thrill of breaking school records and the resilience required to come back from two shoulder surgeries. I know what it's like to train 20+ hours a week, balance academics and athletics, and stay motivated through ups and downs. I also have extensive knowledge of the college recruiting process and love helping younger athletes figure out their own unique path. Whether it’s setting exciting goals, refining technique, or navigating mental blocks, I’m all about helping athletes thrive both in and out of the water.\u003c/p\u003e\u003cp\u003eAcademically, I’m passionate about environmental health—specifically how pollution and climate change affect people’s well-being. I’ve worked on community-based projects tackling air pollution in local schools and tracing the environmental impact of shell waste in coastal cities. I believe environmental science is one of the most dynamic fields because it connects people, policy, and nature, and forces us to grapple with trade-offs and tough decisions. My dream is to help depollute communities and reduce health disparities, especially in under-resourced areas.\u003c/p\u003e\u003cp\u003eMentorship has played a huge role in my own journey, so I’m excited to give back and support students who are navigating similar paths. Whether you're a swimmer chasing your next time drop or a student figuring out how to connect your interests with real-world change, I’d love to be a resource and sounding board. Let’s learn and grow together!\u003c/p\u003e","teachingVideoPlaybackId":"3mT8lBBJQxIpj8wESp024ghBmvRlezLeDOOyC6s1G3LA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Environmental Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f4f90fde-cb08-436b-989a-6cd246351c13\"}"},{"__ref":"DeepDives:{\"uuid\":\"4c3cc5b5-b594-42ec-817e-9a82c66bf3ff\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ff4675c-8479-4c4f-ae04-e8f562412017\"}"},{"__ref":"DeepDives:{\"uuid\":\"3a9ca35c-8af3-4b01-992a-9248e91813ab\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/579dbc37-f934-4853-a5f0-8c0cd376b946/-/preview/-/format/jpg/","https://ucarecdn.com/ba09a4db-b5ec-49e4-8cf5-8275198780f9/-/preview/-/format/jpg/","https://ucarecdn.com/e718ac8c-2808-4877-80b8-ce25ab70290a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5edd5c1f-3d2d-468b-9e81-8ec6b640903c\"}"},{"__ref":"Education:{\"uuid\":\"86c670c0-ab87-44b5-b8df-c9757207263f\"}"}],"hiredAt":"2025-05-07T13:05:53.210Z","topics":[],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"morgan-lukinac\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"46662668-6a5a-483e-8733-0d68765c633a\"}"}}},"_sentryTraceData":"ffed9485d6734fb58cc660b5600d0682-807bcb719e8f5a0a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ffed9485d6734fb58cc660b5600d0682,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"morgan-lukinac"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"g
