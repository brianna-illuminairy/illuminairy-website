xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7f427919-2288-4889-8ebd-660205b4288a\"}":{"__typename":"DeepDives","uuid":"7f427919-2288-4889-8ebd-660205b4288a","content":"\u003cp\u003eMentorship is important because I have seen firsthand how impactful a good mentor can be, and conversely, how harmful a bad mentor can be. A good mentor is inspiring, relatable, and easy to connect with, leading to  relationships that encourage success. Mentorship is important to me because we all need mentors to succeed in life, and I believe that my experiences and insights can make a real impact on people's lives! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}":{"__typename":"School","uuid":"70146acc-a4ce-459e-8969-b791ab43dfb2","name":"Menlo School","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"04890395-6123-4f84-afa9-6c9b020c17f5\"}":{"__typename":"Education","uuid":"04890395-6123-4f84-afa9-6c9b020c17f5","school":{"__ref":"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}"},"startYear":"2016","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"7df1a7a6-7274-4689-b93d-8efbcb68afad\"}":{"__typename":"Education","uuid":"7df1a7a6-7274-4689-b93d-8efbcb68afad","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"ee02df55-9a80-4225-a718-0ae7872200c8\"}":{"__typename":"MentorPublicProfile","uuid":"ee02df55-9a80-4225-a718-0ae7872200c8","displayName":"Eric Y.","slug":"eric-young","biography":"\u003cp\u003eHi! I'm Eric, a neuroscience pre-medical student in my third year at Northwestern University. I grew up in the Bay Area in California, just outside of Stanford University. I went to Menlo School for middle and high school in Atherton, California. I received a White House Presidential Scholar’s Nomination my senior year for scoring a perfect 1600 on the SAT. I love sports and have played baseball and basketball all throughout high school, continuing onto the club baseball team at Northwestern. I also am an avid participant in Intramural sports, and am a huge NBA and MLB fan. I have always been passionate about science, and right now I do research in the Savas lab at the Feinberg School of Medicine in Chicago! I would love to discuss if anyone is interested in doing research in college. The research I currently perform is related to Alzheimer’s disease and how novel therapeutic drugs can be applied.\u0026nbsp;As I am on the pre-medical track and having just taken the medical college admissions test (MCAT), I have a very strong basis in the fundamental sciences (Biology, Chemistry, Physics, Neuroscience). I am a very social person and love studying with friends, and I think that learning with other people is an invaluable way of improving your understanding in subjects or areas that you are not as confident in. I also studied abroad at Sciences Po in Paris for the first semester of my junior year and would be happy to talk about my experiences! I studied global and public health in my time there.\u0026nbsp;As for my future plans, I intend on attending medical school after the completion of my studies at Northwestern. I plan to write a senior thesis in Neuroscience and graduate with honors, as I have received dean’s list honors every quarter so far. I am very interested in oncology and surgery and hope to pursue clinical research in these fields in the near future.\u003c/p\u003e","teachingVideoPlaybackId":"jHzazT01QHDIsnxDQy00KLiRotFCWT6KVZzAjcn87nwRs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7f427919-2288-4889-8ebd-660205b4288a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6b910a22-fa7f-49f9-9c7a-75cdb8c3bab8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"04890395-6123-4f84-afa9-6c9b020c17f5\"}"},{"__ref":"Education:{\"uuid\":\"7df1a7a6-7274-4689-b93d-8efbcb68afad\"}"}],"hiredAt":"2025-04-09T13:45:09.383Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Chemistry","Biology","Physics","6-8 Grade Science","College Essay Writing","Computer Science","Executive Function"],"communityBadges":["https://ucarecdn.com/6fbd7257-e9de-4421-8a0b-bde4a854891b/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/","https://ucarecdn.com/7e9ab2cb-d457-4e4e-9f2d-4946a44b3ea9/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"eric-young\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ee02df55-9a80-4225-a718-0ae7872200c8\"}"}}},"_sentryTraceData":"6c312a7678844440b17a253d329af626-b952dd8da9a52769-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=6c312a7678844440b17a253d329af62
