xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2790e8a2-a4d2-4b3b-b1bc-505548c8f45e\"}":{"__typename":"Favorites","uuid":"2790e8a2-a4d2-4b3b-b1bc-505548c8f45e","photoUrl":"https://ucarecdn.com/1240d071-aa20-4c23-a71f-1241f7297d2c/","title":"Paris Saint-Germain","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"7fd4d23f-78d0-4184-8402-e395ee9571e6\"}":{"__typename":"Favorites","uuid":"7fd4d23f-78d0-4184-8402-e395ee9571e6","photoUrl":"https://ucarecdn.com/29c21ec2-3081-45bf-9a3c-10624a97d109/","title":"Neymar Jr","type":"ATHLETE"},"Favorites:{\"uuid\":\"2ee21241-7cbd-45a9-8c4d-3559156f28f3\"}":{"__typename":"Favorites","uuid":"2ee21241-7cbd-45a9-8c4d-3559156f28f3","photoUrl":"https://ucarecdn.com/5990021c-92fd-4b07-b5b6-8a74cdc09c0f/","title":"Sonder Son","type":"ALBUM"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"0cc88316-d051-4857-98a1-5d4a016f3d16\"}":{"__typename":"DeepDives","uuid":"0cc88316-d051-4857-98a1-5d4a016f3d16","content":"\u003cp\u003eIn high school, I was definitely known as “the cool guy”, someone relaxed, approachable, and easy to get along with. I loved being social and involved, and I valued having a positive presence in my community. At the same time, I was very focused on my academics and goals. I took my work seriously and stayed disciplined, so I was able to balance having fun and being driven. That mix of confidence, calmness, and focus really defined my high school experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"f9fb7b1a-f57f-4eec-a3e8-b07e448a281e\"}":{"__typename":"School","uuid":"f9fb7b1a-f57f-4eec-a3e8-b07e448a281e","name":"Lycée Français Blaise Pascal Abidjan","city":"Abidjan","type":"HIGH","state":"District Autonome d'Abidjan","country":"Côte d'Ivoire","zip":"95BPabjBP"},"Education:{\"uuid\":\"e062af7a-b97e-4577-a9e4-f0c53a21185e\"}":{"__typename":"Education","uuid":"e062af7a-b97e-4577-a9e4-f0c53a21185e","school":{"__ref":"School:{\"uuid\":\"f9fb7b1a-f57f-4eec-a3e8-b07e448a281e\"}"},"startYear":"2012","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"cec21186-6678-466b-9378-bb1eb7ad641f\"}":{"__typename":"Education","uuid":"cec21186-6678-466b-9378-bb1eb7ad641f","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Global Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"5f43808c-2e56-4bf4-8efe-7437a9fbeffb\"}":{"__typename":"MentorPublicProfile","uuid":"5f43808c-2e56-4bf4-8efe-7437a9fbeffb","displayName":"Augustin T.","slug":"augustin-tanoh-1","biography":"\u003cp\u003eHi! My name is Augustin Tanoh, and I’m a student at Yale University majoring in Economics and Global Affairs. I grew up between Brazil, South Africa, Togo, Côte d’Ivoire, and the United States, and I speak French, English, Portuguese, and Spanish fluently. Coming from both French and Ivorian backgrounds and constantly moving between cultures has really shaped how I see the world. It’s what sparked my interest in understanding how societies function and how history connects to the challenges we face today.\u003c/p\u003e\u003cp\u003eAt Yale, I’ve been able to explore these interests through my coursework, but Economics and Global Affairs is just one part of who I am.\u003c/p\u003e\u003cp\u003eOutside the classroom, I’m very involved in both sports and leadership roles on campus. I play club soccer at Yale (C1 level), which has been a big part of my life and a way for me to stay grounded, competitive, and connected to a team. I also serve as Treasurer of the Yale African Students Association, where I help manage budgets and support events that celebrate African culture and community. In addition, I’m involved in Yale Model African Union (YMAU), where I contribute to organizing a large international conference that brings together students from across the world.\u003c/p\u003e\u003cp\u003eMore than anything, I’m someone who is driven by people and experiences. I really value connection, curiosity, and making the most out of everyday moments. I care a lot about building meaningful relationships and learning from others, whether that’s through travel, conversations, or shared projects.\u003c/p\u003e\u003cp\u003eAlongside my academic interests, I’ve also developed a strong curiosity for business and finance. Through my work with BLK Capital Management as an equity research analyst, I’ve gained hands-on experience analyzing companies, building investment theses, and thinking critically about markets. This experience has pushed me to better understand how businesses operate at a strategic level and how financial decisions shape broader economic outcomes. It has also deepened my interest in the intersection between global affairs, leadership, and financial markets.\u003c/p\u003e\u003cp\u003eMost importantly, I’m a new Curious Cardinals mentor and really excited to get started!! I’m looking forward to working closely with students on their academic goals and passion projects, whether that’s improving their French or building something creative like a podcast or blog, and building genuine connections along the way.\u003c/p\u003e\u003cp\u003eMy goal is for our sessions to feel like a mix of productivity and fun: a space where your child feels comfortable, supported, and excited to create something meaningful.\u003c/p\u003e\u003cp\u003eAt Curious Cardinals, I’m excited to help your child discover what excites them and support them every step of the way.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"ga2h17rA8puiaFhmzSVcixgn3KN5TkhdkhLbfkVd901w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2790e8a2-a4d2-4b3b-b1bc-505548c8f45e\"}"},{"__ref":"Favorites:{\"uuid\":\"7fd4d23f-78d0-4184-8402-e395ee9571e6\"}"},{"__ref":"Favorites:{\"uuid\":\"2ee21241-7cbd-45a9-8c4d-3559156f28f3\"}"}],"causesSupported":[],"major":"Global Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0cc88316-d051-4857-98a1-5d4a016f3d16\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6f8f8729-3ca4-4396-8eb2-e5b7cbf54417/-/preview/-/format/jpg/","https://ucarecdn.com/5c3e2737-f9bb-4acc-89f9-f9c77266602c/-/preview/-/format/jpg/","https://ucarecdn.com/131ddbcb-e018-4310-9ade-70d4f8663370/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e062af7a-b97e-4577-a9e4-f0c53a21185e\"}"},{"__ref":"Education:{\"uuid\":\"cec21186-6678-466b-9378-bb1eb7ad641f\"}"}],"hiredAt":"2026-03-26T15:45:01.103Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","6-8 Grade Science","Writing","Spanish","French","College Essay Writing","Reading","History","Economics","Academic Coaching","Computer Science","Creative Writing","Music","Fashion / Cosmetics","Sports Journalism","History Project","Video / Photography","Business / Entrepreneurship","Finance / Investing","Web Design","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"augustin-tanoh-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\
