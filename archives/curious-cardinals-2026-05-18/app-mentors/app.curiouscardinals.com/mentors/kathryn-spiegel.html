xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f119aaab-eca9-401c-be66-20801d85ce57\"}":{"__typename":"Favorites","uuid":"f119aaab-eca9-401c-be66-20801d85ce57","photoUrl":"https://ucarecdn.com/8e0c7291-3162-47ce-81d9-7a8ac38e0e8e/","title":"CTRL by SZA","type":"ALBUM"},"Favorites:{\"uuid\":\"647e4e63-3843-4c62-aa0f-5a2571c496cb\"}":{"__typename":"Favorites","uuid":"647e4e63-3843-4c62-aa0f-5a2571c496cb","photoUrl":"https://ucarecdn.com/5182d35f-a7bc-4493-950d-b218706400c8/","title":"Simone Biles","type":"ATHLETE"},"Favorites:{\"uuid\":\"aebc1512-7e40-498e-a6d9-938ea9e86743\"}":{"__typename":"Favorites","uuid":"aebc1512-7e40-498e-a6d9-938ea9e86743","photoUrl":"https://ucarecdn.com/88631f78-ee16-457a-aa84-c0e6dc82e400/","title":"Taylor Swift","type":"ARTIST"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"441909c4-9556-4c37-9dd2-6a21cf10e489\"}":{"__typename":"DeepDives","uuid":"441909c4-9556-4c37-9dd2-6a21cf10e489","content":"\u003cp\u003eGrowing up in Plymouth, MA, summers for me almost always meant seafood. Plymouth is a town where the ocean really shapes daily life, so I spent a lot of my high school summers working in that world. I spent hours pulling lobsters, cleaned fish in local shops, and later worked front-of-house as a hostess at a busy waterfront restaurant. Those jobs gave me a strong work ethic and a real appreciation for community and teamwork!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"282eaf5f-f249-4c85-9abe-6a89bf0424d7\"}":{"__typename":"DeepDives","uuid":"282eaf5f-f249-4c85-9abe-6a89bf0424d7","content":"\u003cp\u003eOne of my favorite ways to spend spare time is scrapbooking. Whenever I travel, I collect tickets, photos, and little mementos, then piece them together into pages that capture the trip. I love being able to relive moments through colors, textures, and layouts, and it helps me notice small details I might otherwise forget. Over the years, I have filled an entire closet shelf with thick, colorful scrapbooks, each one telling the story of a different place or time in my life. Flipping through them feels like opening a time capsule, and I love seeing how my style has evolved with each adventure!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"08d08b0f-4bec-4c35-a89f-e21450b2fadd\"}":{"__typename":"DeepDives","uuid":"08d08b0f-4bec-4c35-a89f-e21450b2fadd","content":"\u003cp\u003eMentorship matters to me because it’s about more than just academics - it’s about helping someone feel seen, supported, and confident in their abilities. I’ve been mentoring in some form since middle school, whether helping younger students with speaking skills, guiding younger kids in high school, or serving as a teaching assistant and college essay mentor in college. Mentorship isn’t just about sharing knowledge, it’s about building a relationship, listening, and encouraging students to believe in themselves! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"15f103a6-6c62-4c2d-a6a2-e5924a33a1e4\"}":{"__typename":"DeepDives","uuid":"15f103a6-6c62-4c2d-a6a2-e5924a33a1e4","content":"\u003cp\u003eMy greatest source of motivation is the belief that we can always learn more. Even after graduating college, I consider myself a student of the world, curious about new ideas, perspectives, and experiences. Every person I meet has something to teach, and every experience has a lesson hidden within it. That mindset keeps me excited to explore, ask questions, and grow!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"cb12fe72-ef6c-4f09-8339-4f5554e48b18\"}":{"__typename":"School","uuid":"cb12fe72-ef6c-4f09-8339-4f5554e48b18","name":"Plymouth South High School","city":"Plymouth","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02360"},"Education:{\"uuid\":\"014e583e-ae20-4770-8c8e-82bd8928a11a\"}":{"__typename":"Education","uuid":"014e583e-ae20-4770-8c8e-82bd8928a11a","school":{"__ref":"School:{\"uuid\":\"cb12fe72-ef6c-4f09-8339-4f5554e48b18\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"349a040c-44dd-4e12-8122-3211dccbdd5e\"}":{"__typename":"Education","uuid":"349a040c-44dd-4e12-8122-3211dccbdd5e","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Applied Economics and Management","degree":null},"MentorPublicProfile:{\"uuid\":\"343929c2-86c5-4950-82bf-0993f4af59c2\"}":{"__typename":"MentorPublicProfile","uuid":"343929c2-86c5-4950-82bf-0993f4af59c2","displayName":"Kathryn S.","slug":"kathryn-spiegel","biography":"\u003cp\u003eHi! I’m Kathryn, a 2025 Cornell graduate in Applied Economics \u0026amp; Management and History of Art. I love bringing together two sides of myself: the analytical problem-solver who thrives on tackling big questions, and the creative storyteller who finds inspiration in art, movement, and the world around me. In high school, I was honored to graduate as valedictorian while also tutoring classmates, babysitting, helping younger students refine essays, and coaching athletes in both lacrosse and dance. I learned how teaching is not just about explaining material but about listening and encouraging.\u003c/p\u003e\u003cp\u003e          \u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Cornell, I continued to build on that foundation. I studied abroad in Florence, surrounded by Renaissance art (and my favorite food, gelato), and interned in strategy consulting, where I discovered how much I enjoy working with teams to solve tough problems. I also served as an undergraduate TA, which gave me another chance to mentor and support students in an academic setting. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics and work, you will usually find me moving: dancing, doing gymnastics, playing lacrosse, running, or swimming in the lake I live on. I also love painting, scrapbooking, and visiting art museums to stay connected to my creative side. And when I am not doing those things, I am probably outdoors hiking, fishing, snorkeling, or planning my next travel adventure (in the photos above I'm in Iceland and South Africa!). A couple fun facts about me is that I have a talent for justifying dessert as a necessary study break, no matter the time of day, and that I can never walk past a dog without stopping to say hi (it’s a personal policy).\u003c/p\u003e\u003cp\u003e                           \u003c/p\u003e\u003cp\u003eAs a mentor, I want students to feel both encouraged and curious. I believe that learning is not just about memorizing facts, but about making connections, asking questions, and discovering the joy in new ideas. I truly believe that with the right support, every student can grow not only in skill, but in confidence. \u003cbr\u003e                             \u003c/p\u003e\u003cp\u003eI hope we can meet soon!\u003c/p\u003e\u003cp\u003e-Kathryn       \u003c/p\u003e","teachingVideoPlaybackId":"pZYu4sp7YBdQiQxxVmQbwUCwa9NaHg7nZyTXQv7Xg4k","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is graduating as valedictorian of my high school. I had the chance to give a speech to over 1,500 people, which was both nerve-wracking and very exciting. Standing up there and sharing that moment with my classmates, teachers, and family was just really cool- it felt like everything I had worked for came together in that moment!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f119aaab-eca9-401c-be66-20801d85ce57\"}"},{"__ref":"Favorites:{\"uuid\":\"647e4e63-3843-4c62-aa0f-5a2571c496cb\"}"},{"__ref":"Favorites:{\"uuid\":\"aebc1512-7e40-498e-a6d9-938ea9e86743\"}"}],"causesSupported":[],"major":"Applied Economics and Management","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"441909c4-9556-4c37-9dd2-6a21cf10e489\"}"},{"__ref":"DeepDives:{\"uuid\":\"282eaf5f-f249-4c85-9abe-6a89bf0424d7\"}"},{"__ref":"DeepDives:{\"uuid\":\"08d08b0f-4bec-4c35-a89f-e21450b2fadd\"}"},{"__ref":"DeepDives:{\"uuid\":\"15f103a6-6c62-4c2d-a6a2-e5924a33a1e4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f53253f4-1f02-449e-bfad-5d927f1a22f5/-/preview/-/format/jpg/","https://ucarecdn.com/3bdfc98d-b872-41b5-ac6a-b4b9d6a96e99/-/preview/-/format/jpg/","https://ucarecdn.com/bc8c4736-469b-4991-86fa-c3979eb383e5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","educati
