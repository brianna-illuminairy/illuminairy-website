xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"07d02bc5-57f9-47ea-831f-2771b39571f1\"}":{"__typename":"Favorites","uuid":"07d02bc5-57f9-47ea-831f-2771b39571f1","photoUrl":"https://ucarecdn.com/299288a5-581d-4eb4-ba51-d0649d7d91a4/","title":"SZA","type":"ARTIST"},"Favorites:{\"uuid\":\"c4dc2bcc-42c3-4386-b4f7-3c370937856f\"}":{"__typename":"Favorites","uuid":"c4dc2bcc-42c3-4386-b4f7-3c370937856f","photoUrl":"https://ucarecdn.com/eec08204-1930-41f0-970f-1da3a7696183/","title":"Rumors: Fleetwood Mac","type":"ALBUM"},"Favorites:{\"uuid\":\"3f7901a5-d7f8-4898-bc85-73c7dd1b06cf\"}":{"__typename":"Favorites","uuid":"3f7901a5-d7f8-4898-bc85-73c7dd1b06cf","photoUrl":"https://ucarecdn.com/d8415904-d95c-407a-aa75-09d41af10e5d/","title":"Hamilton the Musical","type":"PLAY"},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"37cd3476-1723-4469-9217-4f31087d18b3\"}":{"__typename":"DeepDives","uuid":"37cd3476-1723-4469-9217-4f31087d18b3","content":"\u003cp\u003eAlthough I am a very easygoing, energetic, and extroverted person in my daily life, when it comes to academics, pre-professional endeavors, or other serious pursuits of mine, I am very organized, efficient, and attentive. I like to prioritize prioritizing high-quality work and making sure things are well organized/planned when I’m in charge, so that I can spend more time having fun! Indulging in fun activities and relaxing feels the best after you’ve accomplished something substantial, so I always prioritize balance to make the most out of life both in and out of school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"5e1802c0-e7a6-46ea-8d00-df524de0b1ce\"}":{"__typename":"School","uuid":"5e1802c0-e7a6-46ea-8d00-df524de0b1ce","name":"Half Hollow Hills High School West","city":"Dix Hills","type":"HIGH","state":"New York","country":"United States","zip":"11746"},"Education:{\"uuid\":\"4bf023eb-b1f9-4eea-bca4-f6b9b8521535\"}":{"__typename":"Education","uuid":"4bf023eb-b1f9-4eea-bca4-f6b9b8521535","school":{"__ref":"School:{\"uuid\":\"5e1802c0-e7a6-46ea-8d00-df524de0b1ce\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"a4062f72-89dc-4434-9fba-45d321a85b29\"}":{"__typename":"Education","uuid":"a4062f72-89dc-4434-9fba-45d321a85b29","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"School of Public and International Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"8a092177-b71d-4718-b317-c23a05d8f806\"}":{"__typename":"MentorPublicProfile","uuid":"8a092177-b71d-4718-b317-c23a05d8f806","displayName":"Maya D.","slug":"maya-drame","biography":"\u003cp\u003eHey!! My name is Maya, and I am a rising Junior at Princeton University studying in the School of Public and International Affairs, focusing my studies on the international political economy and international economic development on the pre-law track. I am also particularly interested in development finance, monetary policy, and how global systems function to affect people and markets.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’ve always been drawn to big questions—how economies grow, why inequality persists, and how policy can actually make a difference—but for a long time, those interests felt abstract. At Princeton, I’ve been finding ways to turn my interests into meaningful pre-professional, academic, and personal experiences.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOver my last two years here, I’ve:\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eGained experience in capital markets and developed stock pitches with BlackGen Capital, bringing a political and policy-driven perspective to investment analysis.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eUsed MaxiFi Planner to create financial plans for underserved communities through the lens of economic optimization, the economics of uncertainty, and operations research.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as a policy research associate for a Syrian business advisory firm, tracking economic legislation and private sector developments in a post-conflict setting.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked with a financial advising company to conduct research on impact investing and create educational content to promote financial literacy in underserved communities.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eApplied my interests in the international political economy and trade to research papers in French language classes, allowing me to unify my academic interests in a way that is instructive to a future career in francophone international economic diplomacy.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCultivated a broad network of contacts and mentors in the financial, policy, and legal fields to help me better understand the sectors and bridge my interests.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as a founding officer of a pre-law society on campus.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHow I can help!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAs someone who has always engaged in a \u003cem\u003ebroad\u003c/em\u003e array of both academic and extracurricular interests -in high school I was in 6 honor societies, was student body president, a three season athlete, and an all-state vocalist + I’m pursuing a career that involves my interests in international development, economics, law, and policy- I am well suited not only to provide guidance in a diverse selection of academic and extracurricular pursuits, but to help a student overwhelmed by any diverse passions fine tune their interests into meaningful pursuits and actionable insights.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eLooking ahead…\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eThis summer, I am so grateful to be pursuing \u003cem\u003etwo\u003c/em\u003e incredible opportunities:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eU.S. International Trade Commission (Washington, D.C.)\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI will be conducting research and contributing to policy briefs, further developing my legal research and writing skills while engaging directly with trade and labor policy issues.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eUnited Nations Human Rights Advocacy SPIA Policy Task Force (Geneva, Switzerland)\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI will examine the application of international human rights law to U.S. criminal justice policy by conducting research for the United Nations on how international legal frameworks can be used to evaluate and challenge domestic systems of inequality.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eHaving been the student government President of my high school and coming to Princeton, an environment with a study body of diverse, ethnicities, socioeconomic statuses, religions, and races, I have abundant experience engaging with all sorts of students, in an advisory/leadership and peer capacity, especially considering my engagement with so many different corners of campus from the music crowd, to the sports crowd and from the SPIA students to the engineering students. My ability to provide mentorship as a team captain for the younger girls on the track and tennis teams as well as for the other students in the grades below me when it came to their college applications and in excelling in their high school pursiuits has always been a fulfilling experience.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy background reflects both strong academic performance and balance:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eScored 5s on six AP exams\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReceived the Triple A (Arts, Athletics, Academics) Senior Award\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEarned the Board of Education Award\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as a varsity captain\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eBeyond credentials, I bring:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eStrong problem solving skills\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eVery personable and charismatic\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDriven and dedicated to my pursuits\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eA genuine investment in helping students succeed\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eDepending on your goals, a session with me might include:\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTurning your interests into a real project\u003cbr\u003e\u003c/strong\u003eTaking something like “I like economics/politics/business” and shaping it into a focused research topic, initiative, or portfolio piece.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuilding a clear game plan\u003cbr\u003e\u003c/strong\u003eBreaking your project into manageable steps so you always know what to do next (and don’t feel overwhelmed).\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eConnecting concepts to the real world\u003cbr\u003e\u003c/strong\u003eMaking sense of things like markets, policy, or global events in a way that actually clicks—and sticks.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDeveloping and refining your work\u003cbr\u003e\u003c/strong\u003eWhether it’s a research paper, presentation, or idea, I’ll help you strengthen your thinking and communicate it clearly.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePreparing for applications or opportunities\u003cbr\u003e\u003c/strong\u003eTranslating your work into strong essays, resumes, or talking points that reflect your interests and growth.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy goal is for you to leave each session not just with answers, but with direction—and the confidence to keep building on your ideas independently.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eIn my free time…\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI love to sing in Princeton University’s choir, play tennis twice a week with the Princeton Club Tennis team, go on runs, play guitar/bass guitar, and spend time with my lovely friends! When I’m back in Long Island, I love to go to the beach!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eIf you’re excited to explore your interests, generate a plan to finally follow through on a lifelong dream or project of yours, want advice from someone who’s been experienced and excelled at balancing a busy extracurricular life and rigorous academic schedule, or want help finding direction/better performance academically, I would be \u003cem\u003ebeyond\u003c/em\u003e excited to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"8fzvWR97QV7AQDbt2jcm01Ek7fiZMOA5ddCV6s01K87xw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"07d02bc5-57f9-47ea-831f-2771b39571f1\"}"},{"__ref":"Favorites:{\"uuid\":\"c4dc2bcc-42c3-4386-b4f7-3c370937856f\"}"},{"__ref":"Favorites:{\"uuid\":\"3f7901a5-d7f8-4898-bc85-73c7dd1b06cf\"}"}],"causesSupported":[],"major":"School of Public and International Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"37cd3476-1723-4469-9217-4f31087d18b3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bbd9fbe2-03aa-4cec-b4a1-595be8f59194/-/preview/-/format/jpg/","https://ucarecdn.com/ccec4cd5-8ca8-46c2-bdda-9d67fd56ef25/-/preview/-/format/jpg/","https://ucarecdn.com/4ab86505-5c78-4040-90c3-784eb110bdcf/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4bf023eb-b1f9-4eea-bca4-f6b9b8521535\"}"},{"__ref":"Education:{\"uuid\":\"a4062f72-89dc-4434-9fba-45d321a85b29\"}"}],"hiredAt":"2026-04-22T21:32:32.043Z","topics":[],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/4f6b2e92-2aa8-4328-90be-11c5a7d63bc7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maya-drame\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8a092177-b71d-4718-b317-c23a05d8f806
