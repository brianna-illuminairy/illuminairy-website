xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fcca97f4-739a-4076-9b70-fab5889ceb2c\"}":{"__typename":"Favorites","uuid":"fcca97f4-739a-4076-9b70-fab5889ceb2c","photoUrl":"https://ucarecdn.com/87ced905-0cad-46da-9284-071ae762fb23/","title":"Forza Horizon 5","type":"GAME"},"Favorites:{\"uuid\":\"268db77c-b94f-41b8-8677-4dcbc2a2dd5d\"}":{"__typename":"Favorites","uuid":"268db77c-b94f-41b8-8677-4dcbc2a2dd5d","photoUrl":"https://ucarecdn.com/199763d5-6fc0-40bf-8881-3bbb5c34e1a4/","title":"Badminton","type":"SPORT"},"Favorites:{\"uuid\":\"c11bb8f9-a260-4d06-b841-5660fe1e6daa\"}":{"__typename":"Favorites","uuid":"c11bb8f9-a260-4d06-b841-5660fe1e6daa","photoUrl":"https://ucarecdn.com/87e768a4-abba-4507-99db-bb88093421d5/","title":"New York","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8c59b4a8-524a-4d94-9d55-631bb0767fd0\"}":{"__typename":"DeepDives","uuid":"8c59b4a8-524a-4d94-9d55-631bb0767fd0","content":"\u003cp\u003eMentorship matters to me because I know what it feels like to be a student who is trying to do well but doesn’t yet have the tools to get there. In high school, I cared about learning, but I didn’t always know how to study effectively, manage my time, or stay organized. I often felt like I was putting in effort without seeing the results I wanted, and I didn’t fully understand why.\u003c/p\u003e\u003cp\u003eWhat stayed with me from that time wasn’t just the academic struggle, but the feeling of trying to navigate everything alone. I didn’t always know who to ask for help or how to ask for it, and I didn’t realize how much guidance could have changed my experience. When I eventually learned how to build better habits and study in a way that worked for me, it completely shifted my confidence and the way I approached challenges.\u003c/p\u003e\u003cp\u003eThat is why mentorship feels so meaningful to me now. I know how powerful it is when someone steps in to make things clearer, calmer, and less overwhelming. Mentorship gives students something I wish I had earlier: someone who can help them understand themselves as learners, build systems that actually support them, and feel capable even when the material is difficult.\u003c/p\u003e\u003cp\u003eTo me, mentorship is not just about helping a student master a subject. It is about helping them grow into someone who trusts their own abilities, who knows how to approach challenges, and who feels supported rather than alone. That kind of growth lasts far beyond any single class, and being part of that process is one of the most meaningful things I can do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"fb8b88ce-c381-4b58-a38c-75d2f3e4c6ce\"}":{"__typename":"DeepDives","uuid":"fb8b88ce-c381-4b58-a38c-75d2f3e4c6ce","content":"\u003cp\u003eGrowing up with two parents who were teachers meant that education was woven into my everyday life. I spent my childhood watching them prepare lessons, support their students, and talk about the impact a good teacher can have. Teaching never felt like a job to me, it felt like a way of showing care, building community, and helping people grow.\u003c/p\u003e\u003cp\u003eBeing raised in that environment shaped my teaching style in a few important ways. I learned early on that patience matters, that every student learns differently, and that the best teachers meet students where they are rather than expecting everyone to fit the same mold. I also saw how much confidence can grow when a student feels understood and supported, and that has become a core part of how I work with students today.\u003c/p\u003e\u003cp\u003eBecause of my upbringing, I approach teaching with a sense of calm, empathy, and genuine investment in each student’s progress. I try to create the same kind of environment I saw my parents create, one where students feel safe asking questions, where mistakes are treated as part of the process, and where learning feels personal rather than transactional.\u003c/p\u003e\u003cp\u003eIn many ways, my identity is rooted in the idea that education is a form of care. That perspective guides everything I do as a mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"382bbd90-d918-4841-91d8-25cd6e8deefb\"}":{"__typename":"DeepDives","uuid":"382bbd90-d918-4841-91d8-25cd6e8deefb","content":"\u003cp\u003eI was a disorganized high school student who hadn’t quite figured out how to study on my own. I cared about learning and I always tried, but my approach was pretty scattered. I would jump between assignments, underestimate how long things would take, and convince myself I could “wing it” without a real plan. I didn’t have a consistent study routine, and I definitely didn’t know how to break big tasks into smaller steps.\u003c/p\u003e\u003cp\u003eBecause of that, I struggled more than I needed to. I often felt like everyone else had some secret system I hadn’t learned yet. Tests were stressful, long‑term projects felt overwhelming, and I spent a lot of time trying to catch up instead of feeling in control.\u003c/p\u003e\u003cp\u003eBut those struggles forced me to figure things out the hard way. Over time, I learned how to organize my work, how to study with intention instead of panic, and how to build habits that actually helped me succeed. I became more disciplined, more aware of how I learn, and more confident in my ability to handle challenges.\u003c/p\u003e\u003cp\u003eLooking back, I can see how much that journey shaped me. I wasn’t the naturally organized or effortlessly high‑achieving student. I was the student who had to learn how to manage myself, how to stay focused, and how to build systems that worked for me. That experience makes me deeply relatable to a lot of students today who are still figuring those things out, because I remember exactly what it felt like to be in their shoes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"86da5f0d-2926-488d-92eb-67be06868aed\"}":{"__typename":"DeepDives","uuid":"86da5f0d-2926-488d-92eb-67be06868aed","content":"\u003cp\u003eIn my spare time, I love hanging out with my friends, playing badminton, working out, and unwinding with video games. I’ve always believed that having a healthy balance outside of academics is essential for staying motivated and taking care of your mental health. For me, spending time with friends is a way to reset and laugh after a long week, and it keeps me connected to the people who matter most.\u003c/p\u003e\u003cp\u003eBadminton is my go‑to competitive outlet. I love the fast pace and the focus it demands, and it’s one of the few activities where I can completely forget about everything else and just play. Working out gives me the same sense of clarity. It’s a space where I can push myself, clear my head, and feel grounded again.\u003c/p\u003e\u003cp\u003eAnd when I want to relax, I turn to video games. Whether it’s exploring a new world or teaming up with friends online, gaming helps me unwind in a way that feels fun and stress‑free.\u003c/p\u003e\u003cp\u003eAll of these things help me stay balanced. They remind me that life isn’t just about academics or productivity. Taking time to enjoy the things you love makes you more energized, more focused, and more present in everything else you do. That balance is a big part of how I stay motivated and show up as my best self.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}":{"__typename":"School","uuid":"7f9a6683-e17a-47fa-9e6d-534e82c727e1","name":"Brooklyn Technical High School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11217"},"Education:{\"uuid\":\"e4de7cee-9da7-4a6f-bea9-e6c3385d7fc8\"}":{"__typename":"Education","uuid":"e4de7cee-9da7-4a6f-bea9-e6c3385d7fc8","school":{"__ref":"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"e9ea4f88-ca94-493a-b4f0-176b560a80d8\"}":{"__typename":"Education","uuid":"e9ea4f88-ca94-493a-b4f0-176b560a80d8","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"21d29f25-7e69-49e4-87f8-0798cb29ebdd\"}":{"__typename":"MentorPublicProfile","uuid":"21d29f25-7e69-49e4-87f8-0798cb29ebdd","displayName":"Ryan F.","slug":"ryan-fahim","biography":"\u003ch2\u003e\u003cstrong\u003eAbout Me\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eHi, I’m Ryan, a Mechanical Engineering student at Columbia University who loves helping students feel confident, capable, and curious about STEM. I grew up in Bangladesh surrounded by construction sites and constant change, which sparked my early fascination with how things work and how engineering can make everyday life safer. That curiosity eventually grew into a passion for building, problem‑solving, and supporting younger students as they learn.\u003c/p\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eWhat I Teach\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI specialize in \u003cstrong\u003eAcademic Mentorship\u003c/strong\u003e for middle and high school students. My subjects include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePre‑Algebra\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAlgebra I\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAlgebra II\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCalculus\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePhysics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eComputer Science\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCollege Essay Writing\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also help students strengthen executive functioning skills by:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking down assignments into manageable steps\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating simple, sustainable study systems\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding routines that reduce stress and increase follow‑through\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eMy Approach to Mentorship\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eMy goal is to help students grow not only as learners, but as people. I focus on:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eConfidence building\u003c/strong\u003e through small wins and clear explanations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eGrowth mindset\u003c/strong\u003e, especially for students who feel “bad at math” or overwhelmed\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eProblem‑solving skills\u003c/strong\u003e that transfer beyond the classroom\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCommunication skills\u003c/strong\u003e, especially in writing and explaining their thinking\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eIndependence\u003c/strong\u003e, so students eventually feel capable of tackling challenges on their own\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI want students to walk away not just knowing \u003cem\u003ehow\u003c/em\u003e to solve a problem, but believing they \u003cem\u003ecan\u003c/em\u003e solve problems in general.\u003c/p\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eWhy I’m Qualified\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI bring more than five years of teaching and mentorship experience, including:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTeaching Python to middle and high schoolers through Spark STEM Scholars\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLeading a fourteen‑member engineering team as the Engineering Captain of my Science Olympiad chapter\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCoaching public speaking and diplomacy as a Model UN coach\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSupporting students with different learning styles, confidence levels, and academic goals\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eMy academic and engineering work includes:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConducting rapid PCR diagnostic research that contributed to a device reducing testing time from forty‑eight hours to fifteen minutes, earning first place among more than two hundred posters at a city‑wide symposium\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePublishing a literature review on bioengineered interventions for paraplegia\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDesigning a wearable device that detects electromagnetic fields and alerts users to exposed high‑voltage wires\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelping build components for Columbia’s electric race car through the Formula SAE team\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences taught me how to explain complex ideas clearly, how to guide students through challenges, and how to make learning feel meaningful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat Sessions With Me Are Like\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eStudents can expect sessions that are:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eSupportive and structured\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFocused on understanding the “why,” not just memorizing steps\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHands‑on when possible, especially in math, physics, and coding\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDesigned to build confidence through clarity and small wins\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eA typical session might include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking down a tricky math or physics problem step by step\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConnecting concepts to real‑life examples\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a small coding project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReviewing mistakes together and turning them into learning moments\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSetting goals for the week and creating a simple plan to stay on track\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eA Bit About Me\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eOutside of academics, I love:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eExploring New York City\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePlaying badminton\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWatching engineering YouTube channels\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFinding new cafés\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSolving puzzles and tinkering with anything mechanical\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eIf you are looking for a mentor who will support your academic growth, build your confidence, and help you develop skills that last far beyond the classroom, I would love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"a4pchQTQxVbO800PIM6spL02J93Ccp00kg01w02FVRLbX00gc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the moments I’m most proud of happened during the 2026 Columbia Science Olympiad Invitational, when the juniors I had mentored throughout high school won 1st place in the engineering events I used to lead. Watching them apply the skills, habits, and problem‑solving approaches I’d spent years teaching them, and then surpass what my own team had achieved, was incredibly meaningful. It felt like seeing a legacy continue, not because of me, but because they had grown into confident, capable leaders in their own right. Knowing I played a small part in their journey is something I carry with a lot of pride.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uui
