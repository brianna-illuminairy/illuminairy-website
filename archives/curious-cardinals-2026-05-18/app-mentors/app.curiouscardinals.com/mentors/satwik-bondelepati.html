xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4dc9425b-89f2-458b-91c5-8768f3bc5722\"}":{"__typename":"DeepDives","uuid":"4dc9425b-89f2-458b-91c5-8768f3bc5722","content":"\u003cp\u003eMy dream job is to work in the space industry, whether that be as a scientist, engineer, or data scientist. I love all things encompassing space sciences and would love to work in a field which continues to spark my curiosity about the Universe and our place in it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"903ddd92-4f8e-479c-90ae-99ef46c477cb\"}":{"__typename":"DeepDives","uuid":"903ddd92-4f8e-479c-90ae-99ef46c477cb","content":"\u003cp\u003eI had a dream once where I was in space mindlessly drifting through the cosmos. I was alive for many years and as I entered the black hole in the middle of our galaxy, time sped up and I began to see the Universe age exponentially. From the rise and fall of civilizations to birth and death of stars over millennia. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"690b9859-4887-4150-8373-46bb9d62297f\"}":{"__typename":"DeepDives","uuid":"690b9859-4887-4150-8373-46bb9d62297f","content":"\u003cp\u003eI chose Astrophysics because of my keen interest in space and my natural ability to understand physics well. It was something I was good at and extremely interested so I committed to it in college. Applied Math helps me understand physics better at a fundamental level and Data Science offers me the tools and automation I need to work more efficiently.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b013f197-f4d8-4d46-9279-15d47c8e74cb\"}":{"__typename":"DeepDives","uuid":"b013f197-f4d8-4d46-9279-15d47c8e74cb","content":"\u003cp\u003eIn my spare time I really love to play and produce music of all different genres. I have been playing classical piano for about 11 years and jazz tenor saxophone all throughout high school. I have been producing and DJ'ing throughout my time in college and it really helps me stay in touch with music.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"770faabd-0f0a-4408-bbcc-60aca5bf0860\"}":{"__typename":"School","uuid":"770faabd-0f0a-4408-bbcc-60aca5bf0860","name":"Northwood High School","city":"Irvine","type":"HIGH","state":"California","country":"United States","zip":"92620"},"Education:{\"uuid\":\"35e2a51f-341f-4d80-9b0b-48d7e453946e\"}":{"__typename":"Education","uuid":"35e2a51f-341f-4d80-9b0b-48d7e453946e","school":{"__ref":"School:{\"uuid\":\"770faabd-0f0a-4408-bbcc-60aca5bf0860\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}":{"__typename":"School","uuid":"dff4a26a-20c2-4281-9c2a-b500907e0661","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"d86b1d5d-1faf-4123-a988-2131d058e24a\"}":{"__typename":"Education","uuid":"d86b1d5d-1faf-4123-a988-2131d058e24a","school":{"__ref":"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Astrophysics, Applied Math","degree":null},"MentorPublicProfile:{\"uuid\":\"8288441b-b4ac-42d2-aff2-df88f84727b0\"}":{"__typename":"MentorPublicProfile","uuid":"8288441b-b4ac-42d2-aff2-df88f84727b0","displayName":"Satwik B.","slug":"satwik-bondelepati","biography":"\u003cp\u003eHi, my name is Satwik Bond, and I’m a third-year student at the University of California, Berkeley. I’m double majoring in Astrophysics and Applied Mathematics with a minor in Data Science. My academic journey is driven by curiosity about the universe and a love for physical sciences, but equally important to me is sharing that passion with others through teaching and mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Berkeley, I’ve been part of projects ranging from gravitational wave data analysis to optical/infrared analysis, experiences that taught me how abstract theory connects to real discoveries. I also served as the Chief Scientist for my team in NASA’s L’SPACE Mission Concept Academy, where I lead the development of our Science Traceability Matrix and collaborate with engineers and programmers to design a full Martian rover system according to NASA standards. This role sharpened my ability to think critically, work across disciplines, and communicate complex ideas to a wide audience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I’ve worked on multiple CubeSat projects that simulate real satellite missions, giving me a hands-on perspective that I bring into mentoring. These experiences help me show students how what they’re learning now might one day apply to cutting-edge science and technology.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship has been one of the most rewarding parts of my journey so far. I’ve worked as a math and science tutor, helping students build confidence in everything from elementary school math to advanced physics. I also focus on executive functioning and academic coaching, supporting students with organization, time management, and study strategies. I’ve found that every student has their own way of learning, and I aim to meet them where they are — whether that means breaking down a tough calculus problem step by step, connecting geometry to real-world examples, or showing how coding can be both powerful and creative.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not studying or mentoring, I’m usually pursuing one of my other passions — music (piano, saxophone) and board sports (surfing, skateboarding, snowboarding). I’ve taught music, and I love how it combines discipline with creativity, much like math or science. Sports keep me grounded, reminding me of the importance of resilience and focus.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my goal is simple: to help students feel inspired, capable, and confident in their potential. Whether they’re preparing for a test, exploring a new subject, or just trying to find their academic confidence, I strive to make learning engaging and encouraging every step of the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI look forward to meeting with you! \u003c/p\u003e","teachingVideoPlaybackId":"wMnhS74QGfOyvjFS017VLbfPv1lmXxypgxEgnzRwGnVw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Astrophysics, Applied Math","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4dc9425b-89f2-458b-91c5-8768f3bc5722\"}"},{"__ref":"DeepDives:{\"uuid\":\"903ddd92-4f8e-479c-90ae-99ef46c477cb\"}"},{"__ref":"DeepDives:{\"uuid\":\"690b9859-4887-4150-8373-46bb9d62297f\"}"},{"__ref":"DeepDives:{\"uuid\":\"b013f197-f4d8-4d46-9279-15d47c8e74cb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f61688ff-7dde-486b-9c6b-475a806dd0f3/-/preview/-/format/jpg/","https://ucarecdn.com/0e1a2bac-9bc6-4183-9b30-4b9df8febc15/-/preview/-/format/jpg/","https://ucarecdn.com/7aca9821-0a9d-432f-afac-73b0270e5fcd/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"35e2a51f-341f-4d80-9b0b-48d7e453946e\"}"},{"__ref":"Education:{\"uuid\":\"d86b1d5d-1faf-4123-a988-2131d058e24a\"}"}],"hiredAt":"2025-09-08T18:12:58.944Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","Physics","6-8 Grade Science","Computer Science","Academic Coaching","Executive Function","College Essay Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"satwik-bondelepati\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8288441b-b4ac-42d2-aff2-df88f84727b0\"}"}}},"_sentryTraceData":"52153d1930634c9d874a7b0daf43bea3-b86cd0e5a87fff63-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=52153d1930634c9d874a7b0daf43bea3,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"satwik-bondelepati"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=t
