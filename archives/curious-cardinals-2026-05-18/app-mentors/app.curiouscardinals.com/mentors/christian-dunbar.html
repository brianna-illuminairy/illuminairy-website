xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"623b1af8-7c00-4fc9-87dd-2406f81f3711\"}":{"__typename":"DeepDives","uuid":"623b1af8-7c00-4fc9-87dd-2406f81f3711","content":"\u003cp\u003eA general manager in the NFL\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"6533ab4c-77a9-48eb-ace6-fe22cb2b5c05\"}":{"__typename":"DeepDives","uuid":"6533ab4c-77a9-48eb-ace6-fe22cb2b5c05","content":"\u003cp\u003eWhile working at Duke Football I created analytical breakdowns for each team on the schedule for the 2023 season.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e07a4efe-dbd7-46aa-88f1-df87939950cf\"}":{"__typename":"DeepDives","uuid":"e07a4efe-dbd7-46aa-88f1-df87939950cf","content":"\u003cp\u003eIf it won't matter in 5 years, don't spend more than 5 minutes worrying about it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1aca5bae-9fa2-4653-aa71-44358fefa2cf\"}":{"__typename":"DeepDives","uuid":"1aca5bae-9fa2-4653-aa71-44358fefa2cf","content":"\u003cp\u003eI actually did not pass econ 101 (somewhat ironic for someone going on to work at Goldman Sachs) and went into a tail spin. Luckily, I had a mentor who works in the school of public policy at Duke and once I took my first PubPol class, it felt like the right fit.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"1b71a073-2eaf-4df9-bf59-ba6bac16b290\"}":{"__typename":"School","uuid":"1b71a073-2eaf-4df9-bf59-ba6bac16b290","name":"Germantown Friends School","city":"Philadelphia","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19144"},"Education:{\"uuid\":\"e7d5feef-78ee-4931-8f7d-008faf076eca\"}":{"__typename":"Education","uuid":"e7d5feef-78ee-4931-8f7d-008faf076eca","school":{"__ref":"School:{\"uuid\":\"1b71a073-2eaf-4df9-bf59-ba6bac16b290\"}"},"startYear":"2009","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"e07b39d7-f912-4388-b325-c4e6b29fccba\"}":{"__typename":"Education","uuid":"e07b39d7-f912-4388-b325-c4e6b29fccba","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Public Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"3763cceb-c06e-4d44-b926-40131d3ec465\"}":{"__typename":"MentorPublicProfile","uuid":"3763cceb-c06e-4d44-b926-40131d3ec465","displayName":"Christian D.","slug":"christian-dunbar","biography":"\u003cp\u003eMy name is Christian Dunbar, and at my core, I’m a sports nerd who cares deeply about helping people become the fullest versions of themselves—academically, personally, and intellectually. I’ve always believed that education should empower students to think critically, ask meaningful questions, and understand the systems that shape their lives on and off the field. Growing up, I learned that school is only one part of a child’s education; the rest comes from their passions, their environment, and the things that make them come alive. That’s why I believe the best instructors find ways to honor a child’s interests—especially their sports interests—and use them as a structured pathway into deeper learning.\u003c/p\u003e\u003cp\u003eAcademically, I study Public Policy and Innovation \u0026amp; Entrepreneurship at Duke University. My background in policy, economics, and research influences the way I teach and mentor. I encourage students to think harder, analyze information with intention, and connect classroom concepts to real-world situations they care about. Whether it’s breaking down a sports statistic, discussing financial decision-making, or mapping out how organizations operate, I want my students to see how knowledge connects across fields. After I graduate, I will be joining Goldman Sachs as a full-time analyst, an opportunity that reflects my long-standing interests in finance, strategy, and problem-solving.\u003c/p\u003e\u003cp\u003eOutside of the classroom, I stay involved in leadership, service, and sports in pretty much every form. I co-founded and led the Duke chapter of BlackGen Capital, a student-run investment fund dedicated to expanding access to careers in finance for underrepresented students. I’ve worked for Duke Football in both the Scouting and Recruiting Departments, experiences that deepened my understanding of talent evaluation, team culture, and athlete development. I also co-created a podcast with two other Duke students that gives collegiate athletes a platform to tell their own stories—something I’m incredibly proud of. While I grew up playing every sport imaginable, baseball was the one I stuck with the longest, though football was always my first love. That passion still guides a lot of the creative work I do today.\u003c/p\u003e\u003cp\u003eMore than anything, I want students and families to know that I take teaching seriously because I take students seriously. I believe in meeting young people where they are, holding high expectations, and giving them the confidence and skills to exceed even their own assumptions about what’s possible. If your child is endlessly curious about sports—whether they analyze every play, follow their favorite teams obsessively, or simply love the energy of competition—I would love to connect, learn from them, and help them grow through the games we love.\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePlease see my sports podcast link here:\u003c/p\u003e\u003ch2\u003elinktr.ee/insidethelines \u003c/h2\u003e","teachingVideoPlaybackId":"UH00gyZ3ht6jSRc9PjoaPzjXcIHzKqsSJiyMYWpHnvbA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Public Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"623b1af8-7c00-4fc9-87dd-2406f81f3711\"}"},{"__ref":"DeepDives:{\"uuid\":\"6533ab4c-77a9-48eb-ace6-fe22cb2b5c05\"}"},{"__ref":"DeepDives:{\"uuid\":\"e07a4efe-dbd7-46aa-88f1-df87939950cf\"}"},{"__ref":"DeepDives:{\"uuid\":\"1aca5bae-9fa2-4653-aa71-44358fefa2cf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/12129135-7c62-4455-a0b6-e4849f7b3471/-/preview/-/format/jpg/","https://ucarecdn.com/c8de7620-042f-47da-8444-6fe979ec4509/-/preview/-/format/jpg/","https://ucarecdn.com/5d0c31b6-19f5-4c4d-9855-79a0ac6ba71f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e7d5feef-78ee-4931-8f7d-008faf076eca\"}"},{"__ref":"Education:{\"uuid\":\"e07b3
