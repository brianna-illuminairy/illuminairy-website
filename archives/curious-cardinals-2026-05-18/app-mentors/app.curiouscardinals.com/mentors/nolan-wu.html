xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"95e16398-4a6d-4338-8b90-56cfb18c7e16\"}":{"__typename":"Favorites","uuid":"95e16398-4a6d-4338-8b90-56cfb18c7e16","photoUrl":"https://ucarecdn.com/1943a9e6-040a-48eb-a76d-dce36f5978cd/","title":"fred again..","type":"ARTIST"},"Favorites:{\"uuid\":\"a8702a33-1f65-4d37-8ba1-1cdf60331689\"}":{"__typename":"Favorites","uuid":"a8702a33-1f65-4d37-8ba1-1cdf60331689","photoUrl":"https://ucarecdn.com/8004b540-c3a2-4d8f-9184-d56c49bd0b48/","title":"Golden State Warriors","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"0ec6a147-4514-424a-b13e-722df0f9795c\"}":{"__typename":"Favorites","uuid":"0ec6a147-4514-424a-b13e-722df0f9795c","photoUrl":"https://ucarecdn.com/1cd0a724-a87e-450e-8bf7-85bf991f8317/","title":"Interstellar","type":"MOVIE"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"cd77c9ca-9ed0-40b6-98ff-45cb1830758d\"}":{"__typename":"DeepDives","uuid":"cd77c9ca-9ed0-40b6-98ff-45cb1830758d","content":"\u003cp\u003eI would say that my two biggest role models are my mom and Steph Curry. My mom is a source of inspiration from me, she immigrated to the United States looking for a better life and was able to achieve the American Dream through hard work and grit. She is my own mentor and always guides me in the right directions. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy other role model is Steph Curry, not just because he is my favorite basketball player. I would say he is a role model of mine because he stays humble, and puts in all the work behind the scenes. Everyone wants to be the greatest shooter of all time, but no one wants to put it as many reps as Steph Curry. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"00948b3b-969d-48ae-825a-98aec84ebf48\"}":{"__typename":"DeepDives","uuid":"00948b3b-969d-48ae-825a-98aec84ebf48","content":"\u003cp\u003eI would say the biggest piece of advice would be to pick something you truly love doing and dive deep into it- whether it be starting a business around this passion, creating a blog, or gathering a portfolio. Not only will you be happier with how you are spending your time, but this will also help you stand out in the future. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c1c34f38-43de-4934-ba8a-78878d0e52a9\"}":{"__typename":"DeepDives","uuid":"c1c34f38-43de-4934-ba8a-78878d0e52a9","content":"\u003cp\u003eI spent my summers in high school doing a combination of internships and working. I interned as a lab assistant in the University of Miami for 2 summers which was a great experience because I learned what I don't like. I loved chemistry as a subject to learn about in school, and I excelled at it. However, after 2 summers working in a orgo lab, I realized that chemistry research just wasn't for me, and it's why I decided to do engineering instead. \u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b7d43d0e-dcd8-4c1f-855e-e87696ce4a26\"}":{"__typename":"DeepDives","uuid":"b7d43d0e-dcd8-4c1f-855e-e87696ce4a26","content":"\u003cp\u003eTo be my own boss and own my company.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}":{"__typename":"School","uuid":"1dc8c564-7629-4af5-851c-69ed64a8870e","name":"Ransom Everglades High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33133"},"Education:{\"uuid\":\"f43d75f4-7e73-4ab6-aef4-960392029f40\"}":{"__typename":"Education","uuid":"f43d75f4-7e73-4ab6-aef4-960392029f40","school":{"__ref":"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"3b8742a0-5cb7-4581-8d07-4cf9612c6a71\"}":{"__typename":"Education","uuid":"3b8742a0-5cb7-4581-8d07-4cf9612c6a71","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Operations Research Engineering","degree":null},"Testimonial:d14e7467-f6cd-43a3-a961-67027c01ac4e":{"__typename":"Testimonial","id":"d14e7467-f6cd-43a3-a961-67027c01ac4e","text":"Testimonial for Nolan Wu\n\nIt’s hard to put into words how grateful we are for Nolan and the role he’s played in Kal’s life. He has been so much more than just a math tutor. He’s been a mentor, a guide, and a steady, positive presence during a really important time in Kal’s growth.\n\nFrom the beginning, Nolan saw Kal for who he is. He didn’t just focus on getting the right answers. He focused on building confidence, patience, and curiosity. Math went from being a source of frustration to something Kal could approach with clarity and even excitement. Nolan celebrated every small win, and when things got tough, he offered calm reassurance and thoughtful support.\n\nThe letter Nolan wrote to Kal moved me deeply. It reflects not just the progress Kal has made, but the genuine care and attention Nolan brings to each session. He noticed the effort, the honesty, the persistence. Most importantly, he helped Kal see those things in himself.\n\nWe feel incredibly lucky to have found Nolan. The impact he has made goes far beyond academics. He has helped Kal believe in his own potential. As a parent, I couldn’t ask for more than that.\n\nSincerely,\n\nRena Macapagal","date":"2025-08-26 06:07:33.383+00","rating":5,"endorser":{"__typename":"Endorser","name":"Rena Macapagal","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"abe3acde-7fd5-4cfb-8237-2a0f09a41cfe\"}":{"__typename":"MentorPublicProfile","uuid":"abe3acde-7fd5-4cfb-8237-2a0f09a41cfe","displayName":"Nolan W.","slug":"nolan-wu","biography":"\u003cp\u003eHey, I’m Nolan. I’m a freshman at Cornell from Miami, studying Engineering with a focus in Operations Research and a minor in Business. Since I was young, I’ve had a strong curiosity for science and problem solving, which led me to pursue engineering. My dream is to one day merge my love for STEM and my entrepreneurial interests to one day start a tech company of my own.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGoing into high school, I didn’t immediately know what I was passionate about at first, but I found my path by exploring a variety of subjects and activities and seeing what I liked. Taking a course called Analytical Data Science my junior year turned out to be a pivotal moment for me, sparking my interest in data science and operations research, which is now my major. Beyond academics, I discovered a love for running when I joined the cross country team, which is where I also made some of my closest friends.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Cornell, I've recently become involved in a project team called Cornell Hyperloop which is working to create revolutionary transportation technology that would allow you to travel from San Francisco to LA in under an hour. I work on the business subteam, helping with operations, marketing, and sponsorship acquisition, bridging my engineering interests with practical business experience.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of STEM and business, I also have a deep passion for the arts. I’ve been drawing and painting since I was a kid, and I still enjoy oil painting and playing the piano. I also love traveling the world with my parents and exploring different art museums at every destination.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEarlier this year, my friend and I found ourselves having extra time on our hands and decided to channel our interests in arts and design and start a clothing line together. It was such a refreshing experience to be able to work towards a goal that I was passionate about while learning so much during the process. We basically started from not knowing what to do, and through guidance and research, we were able to learn about design, supply chain, accounting, and marketing. This venture taught me invaluable lessons that I wouldn’t have learned in school and my only regret is not having started it earlier.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I aim to guide your child towards pursuing their passions and share the valuable lessons I’ve learned along the way. Whatever your child’s goal is, I’m dedicated towards helping them achieve it. When I’m not working on physics problems or painting, you can probably find me playing poker, soccer, working out, or at the beach with my friends.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"NIQJWdGswAQhZES3v4g00ZeQLYaGZGD01RVlyZ12wz85E","teachingVideoDescription":null,"greatestAchievement":"\u003cbr\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"95e16398-4a6d-4338-8b90-56cfb18c7e16\"}"},{"__ref":"Favorites:{\"uuid\":\"a8702a33-1f65-4d37-8ba1-1cdf60331689\"}"},{"__ref":"Favorites:{\"uuid\":\"0ec6a147-4514-424a-b13e-722df0f9795c\"}"}],"causesSupported":[],"major":"Operations Research Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cd77c9ca-9ed0-40b6-98ff-45cb1830758d\"}"},{"__ref":"DeepDives:{\"uuid\":\"00948b3b-969d-48ae-825a-98aec84ebf48\"}"},{"__ref":"DeepDives:{\"uuid\":\"c1c34f38-43de-4934-ba8a-78878d0e52a9\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7d43d0e-dcd8-4c1f-855e-e87696ce4a26\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/736b3f9f-473c-4111-ab42-2dccc86ab13e/-/preview/-/format/jpg/","https://ucarecdn.com/87ce9944-1208-4b1c-b59e-99f16e570324/-/preview/-/format/jpg/","https://ucarecdn.com/e2bb6704-ade0-4c3e-ab84-04d8591be4eb/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f43d75f4-7e73-4ab6-aef4-960392029f40\"}"},{"__ref":"Education:{\"uuid\":\"3b8742a0-5cb7-4581-8d07-4cf9612c6a71\"}"}],"hiredAt":"2024-11-10T21:55:21.299Z","topics":["Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Chemistry","Physics","Academic Coaching","Economics","Executive Function","Visual Arts / Graphic Design","Business / Entrepreneurship","STEM Project","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:d14e7467-f6cd-43a3-a961-67027c01ac4e"}]},"ROOT_QUERY":{"__typename":"
