xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"53a4a068-ba87-495d-a6c7-dbff33851a4f\"}":{"__typename":"Favorites","uuid":"53a4a068-ba87-495d-a6c7-dbff33851a4f","photoUrl":"https://ucarecdn.com/5dae861b-92b1-40b2-ab7c-931f1cfd5506/","title":"Cristiano Ronaldo ","type":"ATHLETE"},"Favorites:{\"uuid\":\"2948a123-4322-406f-b951-6a7e100dd749\"}":{"__typename":"Favorites","uuid":"2948a123-4322-406f-b951-6a7e100dd749","photoUrl":"https://ucarecdn.com/956badae-61cf-49f1-ace7-049c41a85065/","title":"Paris, France ","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c88ac8c0-e638-44ac-b15f-7a52094496c9\"}":{"__typename":"DeepDives","uuid":"c88ac8c0-e638-44ac-b15f-7a52094496c9","content":"\u003cp\u003eMentorship matters to me because, as an older sibling and someone who has always set goals beyond what those around me have achieved, I've felt like I have to navigate everything first. As exciting as that is, I often feel like I'm starting behind the 8-ball--constantly playing catch-up on things like applying to top colleges, recruiting for investment banking, and competing in soccer. I frequently find myself thinking how much I would have benefited from a mentor who had already been through it all. That's exactly the kind of resource I hope to be for my students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"50ae6194-a382-486a-8b8c-9041fc4101af\"}":{"__typename":"DeepDives","uuid":"50ae6194-a382-486a-8b8c-9041fc4101af","content":null,"videoPlaybackId":"dXd01zHZTuVfVL5vdd8hjQUphdQfBjqKKv6HQo01ejEC8","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d2c8f11c-616b-4ab1-bfcd-3d5a51ec4bb6\"}":{"__typename":"DeepDives","uuid":"d2c8f11c-616b-4ab1-bfcd-3d5a51ec4bb6","content":"\u003cp\u003eI hope to be able to free myself financially. There is too much to enjoy in life for my financial worth to be confined to the number of hours I work, and I truly believe the world has created so many resources to make, save, invest, and grow financially in a way that allows you to spend less time typing at a desk and more time exploring investment strategies while traveling. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"904c52bb-bd94-4b25-9711-a0283baa059d\"}":{"__typename":"DeepDives","uuid":"904c52bb-bd94-4b25-9711-a0283baa059d","content":"\u003cp\u003eMy grandfather. He came to the U.S. from India with 63 cents, a set of sheets, and broken radio. Since then, he's built a company valued at over $40 million and remained the most inspiring man I've ever met at 80 years old. He runs 3 miles every day and is still so hungry to learn more about the world. I learn so much from every conversation with him and hope that my mind is even half as sharp as his as I age. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"a4d3382b-743a-49bf-b87b-f414212d4aad\"}":{"__typename":"School","uuid":"a4d3382b-743a-49bf-b87b-f414212d4aad","name":"Bishop O’Dowd High School","city":"Oakland","type":"HIGH","state":"California","country":"United States","zip":"94605"},"Education:{\"uuid\":\"e36cb594-b939-4f24-98c1-a2fbdf9e62cd\"}":{"__typename":"Education","uuid":"e36cb594-b939-4f24-98c1-a2fbdf9e62cd","school":{"__ref":"School:{\"uuid\":\"a4d3382b-743a-49bf-b87b-f414212d4aad\"}"},"startYear":"2022","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"2a28934a-f150-4a99-89bc-5b015f87d14b\"}":{"__typename":"Education","uuid":"2a28934a-f150-4a99-89bc-5b015f87d14b","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Business Administration, Finance","degree":null},"MentorPublicProfile:{\"uuid\":\"89411f54-f52d-4f5e-98d2-c297d4dd72f6\"}":{"__typename":"MentorPublicProfile","uuid":"89411f54-f52d-4f5e-98d2-c297d4dd72f6","displayName":"Kyal R.","slug":"kyal-raja","biography":"\u003cp\u003eHi students families! My name is Kyal (pronounced like Kyle - my parents tried to be creative), and I'm a sophomore at USC Marshall School of Business studying Finance. My love for finance started in high school - around the same time I realized none of my teachers were teaching us anything useful about money.\u003c/p\u003e\u003cp\u003eIn high school, I noticed that the smartest kids around me had no idea how credit cards worked, what a budget was, or why debt was something to actually think about before college. So I founded a financial literacy club to fill that gap. That experience stuck with me, and since then I've gone deep into the finance world: I've completed internships at venture capital firms, conducted private investment research on over 40 global companies, built financial models for healthcare startups, obtained a Wall Street Prep financial modeling certification, and developed equity  research models using Bloomberg Terminal. I also started a branch under a nonprofit called Each One Teach One while I was volunteering in New Delhi, aimed at educational access for underserved communities.\u003c/p\u003e\u003cp\u003eAdditionally, I spent a year studying abroad in Paris before coming to USC, and then walked onto the USC Men’s soccer team when I got back. I think that kind of path is what defines me as a mentor: I've had to figure a lot of things out on my own, and I love helping students navigate the hard lessons I learned the slow way.\u003c/p\u003e\u003cp\u003eI have been playing soccer since I was four and love to talk all things sports. I'm a huge fan of Manchester United, the Golden State Warriors, the 49ers, and the SF Giants (I grew up in the Bay Area if you couldn't tell). My goal is that I can establish common interests with my mentees and build our sessions around them while learning in the process. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen we work together, sessions are interactive and built around \u003cem\u003eyour\u003c/em\u003e interests. Whether you want to understand investing through the lens of sports, tech, fashion, or anything else, I'll do my best to make it click for you. The end goal is always a tangible project you can put on your college application and actually be proud of.\u003c/p\u003e\u003cp\u003eOutside of finance and soccer, I'm into cars, cooking, golf, traveling the world, snowboarding, and convincing people that financial literacy is actually cool. I promise it is.\u003c/p\u003e","teachingVideoPlaybackId":"15P6sgWA00ZP5UFuLEpw01tbc00025b1XEPL00r2vKohhzeU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"53a4a068-ba87-495d-a6c7-dbff33851a4f\"}"},{"__ref":"Favorites:{\"uuid\":\"2948a123-4322-406f-b951-6a7e100dd749\"}"}],"causesSupported":[],"major":"Business Administration, Finance","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c88ac8c0-e638-44ac-b15f-7a52094496c9\"}"},{"__ref":"DeepDives:{\"uuid\":\"50ae6194-a382-486a-8b8c-9041fc4101af\"}"},{"__ref":"DeepDives:{\"uuid\":\"d2c8f11c-616b-4ab1-bfcd-3d5a51ec4bb6\"}"},{"__ref":"DeepDives:{\"uuid\":\"904c52bb-bd94-4b25-9711-a0283baa059d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1a058dfd-b037-4e79-bae9-e1007d0b612d/-/preview/-/format/jpg/","https://ucarecdn.com/ed6c99c2-5a12-4459-8d77-1d16f0e6b0a5/-/preview/-/format/jpg/","https://ucarecdn.com/b042907f-dcc8-4494-9b6b-baac11c1be20/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e36cb594-b939-4f24-98c1-a2fbdf9e62cd\"}"},{"__ref":"Education:{\"uuid\":\"2a28934a-f150-4a99-89bc-5b015f87d14b\"}"}],"hiredAt":"2026-04-08T03:32:04.480Z","topics":["Finance / Investing","Business / Entrepreneurship","Web Design","Sports Analytics","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kyal-raja\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"89411f54-f52d-4f5e-98d2-c297d4dd72f6\"}"}}},"_sentryTraceData":"74015de1648b4eeca7a2fa15cd6545df-b67a86e206090bcb-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=74015de1648b4eeca7a2fa15cd6545df,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"kyal-raja"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallbac
