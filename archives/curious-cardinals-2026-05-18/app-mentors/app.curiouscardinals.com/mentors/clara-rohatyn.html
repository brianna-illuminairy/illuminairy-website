xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b4955cc6-d39d-42f9-8279-f602a56bbb3b\"}":{"__typename":"DeepDives","uuid":"b4955cc6-d39d-42f9-8279-f602a56bbb3b","content":"\u003cp\u003eMentorship matters to me because of the academic and other mentors I have had in my life. When I was in second grade, I was diagnosed with dyslexia, and I struggled with reading and writing. I began to feel like I had fallen behind. It took various tutors and teachers to help me explore how my brain worked and how to understand that my differences were not to my detriment but to my advantage. When I worked at a Columbia ecology lab my junior year, the professor I worked for gave me opportunities to challenge myself, try new things, and see what it would be like to be a Ph.D. or master's student at his lab. He allowed me the space and confidence to expand what I was capable of, and I hope to do that with my mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a6cd94ae-0384-4047-9190-9767b27a9017\"}":{"__typename":"DeepDives","uuid":"a6cd94ae-0384-4047-9190-9767b27a9017","content":"\u003cp\u003eI have always been a person who cannot choose a favorite subject; I like a bit of everything. After completing Spence's Eco Fellows program, I realized environmental studies was a way for me to study every subject while positively impacting the world. I chose Harvard because the Environmental Science and Public Policy concentration requires me to take history, science, math, economics, and government classes. This variety will allow me a knowledge base that spans various subjects before choosing a particular niche.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"e097449f-6077-4f66-aa59-4809617de3a9\"}":{"__typename":"DeepDives","uuid":"e097449f-6077-4f66-aa59-4809617de3a9","content":"\u003cp\u003eOrganized is the first word that comes to mind. After coming back to school from COVID, I was determined to become the best student I could be, and I did this by staying organized. I would have a schedule that allowed me to have a night off from homework, scheduled times for physical activity, and allowed me to have time to relax. It allowed me to not worry about when I would get work done because it was usually finished a few days before, giving me ample time for extracurriculars and fun. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"40d5f3f8-64c1-432e-bb50-156997d4cf24\"}":{"__typename":"DeepDives","uuid":"40d5f3f8-64c1-432e-bb50-156997d4cf24","content":"\u003cp\u003eJust do it. Even if you think you are not smart enough or an idea is too big, try anyway. The times I went out of my comfort zone became some of my most impactful experiences. Too often, we second guess ourselves, limiting what we can do before even trying. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"37cd96f7-93c8-46d0-87c7-8b145c917ca3\"}":{"__typename":"Education","uuid":"37cd96f7-93c8-46d0-87c7-8b145c917ca3","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Environmental Science and Public Policy","degree":null},"School:{\"uuid\":\"06d398e8-5a2b-437d-9ac6-994779a5da3f\"}":{"__typename":"School","uuid":"06d398e8-5a2b-437d-9ac6-994779a5da3f","name":"The Spence School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"9ac80891-e642-45e9-8ded-fd5f48c25135\"}":{"__typename":"Education","uuid":"9ac80891-e642-45e9-8ded-fd5f48c25135","school":{"__ref":"School:{\"uuid\":\"06d398e8-5a2b-437d-9ac6-994779a5da3f\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"04f0e43b-75a9-4da1-8ab8-377457758e5e\"}":{"__typename":"MentorPublicProfile","uuid":"04f0e43b-75a9-4da1-8ab8-377457758e5e","displayName":"Clara R.","slug":"clara-rohatyn","biography":"\u003cp\u003eClara is a first-year Harvard student studying Environmental Studies and Public Policy. In her first semester at Harvard, Clara has explored Computer Science, Climate History, and more.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eClara Graduated from The Spence School, an all-girls school in New York, in 2023. Clara switched to Spence for ninth grade after being in a co-ed school for most of her life. As one of the few girls in the honors math system, she felt unsupported and was discouraged from entering Spence’s accelerated math program by her middle school teachers. Over the next four years, she would learn to love math again after being encouraged to remain in the accelerated program.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eDuring her time at Spence, she was the President of the student-led acapella group and Spence Dance company. She grew up immersed in visual and performing arts, regularly joking that she “sang before talking.” Although not currently involved in the performing arts at Harvard, she intends to explore performance opportunities over the next semester.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eClara’s passion for environmental studies began at Spence when she entered the Eco Fellows program in her sophomore year. During her junior year summer, she worked at Professor Kevin Griffin’s ecology lab at Columbia, where she learned how to tackle research questions and lab procedures and worked with students and professors in their work. She has brought this interest into her college academic and extracurricular activities. She is a Harvard’s Clean Energy Group member, where she worked as a consultant for a Boston-based company in the fall of 2023. She is excited to explore more climate initiatives in and outside of school.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eClara is also a co-director and co-founder of Dear Me, a nonprofit focused on changing the mindset of students by working to counteract the epidemic of eating disorders in girls and boys alike. After co-founding the organization at the end of her junior year, Dear Me is now an official affiliate of The National Alliance For Eating Disorders, working nationwide in dozens of middle and high schools. Clara is determined to maintain her commitment to the organization throughout college.\u003c/p\u003e","teachingVideoPlaybackId":"viBcVcXlWoTOrV00qUzFhWNWXyKm2h78WZqjIyYU1cpE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Environmental Science and Public Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b4955cc6-d39d-42f9-8279-f602a56bbb3b\"}"},{"__ref":"DeepDives:{\"uuid\":\"a6cd94ae-0384-4047-9190-9767b27a9017\"}"},{"__ref":"DeepDives:{\"uuid\":\"e097449f-6077-4f66-aa59-4809617de3a9\"}"},{"__ref":"DeepDives:{\"uuid\":\"40d5f3f8-64c1-432e-bb50-156997d4cf24\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3ba374c3-f6b6-4d12-b3ba-f9e0dc7a933d/-/preview/-/format/jpg/","https://ucarecdn.com/493a64a4-331c-4b9e-b5f1-220ab5af42c2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"37cd96f7-93c8-46d0-87c7-8b145c917ca3\"}"},{"__ref":"Education:{\"uuid\":\"9ac80891-e642-45e9-8ded-fd5f48c25135\"}"}],"hiredAt":"2023-12-23T02:47:27.249Z","topics":["Pre-Algebra","Algebra I","K-5 Grade Math","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"clara-rohatyn\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"04f0e43b-75a9-4da1-8ab8-377457758e5e\"}"}}},"_sentryTraceData":"8bc900a71a574cfb966a8907992af6d5-a5d459f9dbd9a0af-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8bc900a71a574cfb966a8907992af6d5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[sl
