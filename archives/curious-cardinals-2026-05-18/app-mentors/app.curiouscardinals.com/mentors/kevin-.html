xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"266eb8fb-7b69-4250-b3f1-756fdcaa9470\"}":{"__typename":"Favorites","uuid":"266eb8fb-7b69-4250-b3f1-756fdcaa9470","photoUrl":"https://ucarecdn.com/ef8b4ddf-38f4-4179-8d49-510be3379aa6/","title":"Rory McIlroy","type":"ATHLETE"},"Favorites:{\"uuid\":\"3e9ce652-bfbe-45ad-8437-617e89f3b741\"}":{"__typename":"Favorites","uuid":"3e9ce652-bfbe-45ad-8437-617e89f3b741","photoUrl":"https://ucarecdn.com/ee4f5f39-369d-49b7-82c0-ce1e870d9bd0/","title":"Golf","type":"SPORT"},"Favorites:{\"uuid\":\"40954494-8249-44f8-828f-73f413dd9d8a\"}":{"__typename":"Favorites","uuid":"40954494-8249-44f8-828f-73f413dd9d8a","photoUrl":"https://ucarecdn.com/4cb28d41-5cc4-4a17-9502-77eee9ce29fc/","title":"Macau","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"af0c4023-7e11-432d-a735-c434ded22ea3\"}":{"__typename":"DeepDives","uuid":"af0c4023-7e11-432d-a735-c434ded22ea3","content":"\u003cp\u003eIf I could give advice to my middle or high school self, it would be to focus less on perfection and more on exploration. At the time, I was very focused on getting things “right,” whether that meant grades, activities, or following a clear path. Looking back, I think I would have benefited more from trying different things, taking risks, and not being afraid to fail or change direction.\u003c/p\u003e\u003cp\u003eI would also remind myself that confidence comes from doing, not from waiting until you feel ready. A lot of growth happens when you step outside your comfort zone, even if you’re not fully prepared. Some of the most valuable experiences I’ve had came from just starting something and figuring it out along the way.\u003c/p\u003e\u003cp\u003eFinally, I would emphasize the importance of building good habits early—like managing time, staying organized, and asking for help when needed. Those skills end up mattering just as much, if not more, than any individual class or grade.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7729986f-238f-48b7-b9df-dc0daa4b2b55\"}":{"__typename":"DeepDives","uuid":"7729986f-238f-48b7-b9df-dc0daa4b2b55","content":"\u003cp\u003eMentorship matters to me because I’ve seen how much of a difference the right guidance and support can make in a student’s confidence and growth. Throughout my own academic journey, I’ve realized that success isn’t just about understanding material—it’s about having someone who can help you think through challenges, stay motivated, and see your potential even when you might not fully see it yourself.\u003c/p\u003e\u003cp\u003eAs a teaching assistant, I’ve had the opportunity to work closely with students who were struggling with difficult concepts. What stood out to me was that once they started to feel more supported and understood, their confidence improved, and their performance followed. That experience showed me that mentorship goes beyond just explaining content—it’s about building trust, encouraging curiosity, and helping students develop the mindset and habits they need to succeed.\u003c/p\u003e\u003cp\u003eTo me, mentorship is meaningful because it allows you to make a lasting impact. It’s not just about helping someone get through a class or assignment, but about helping them grow into a more confident, independent learner who feels capable of taking on new challenges.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b68b2fba-41ab-405f-925d-ee43cd3ccd17\"}":{"__typename":"DeepDives","uuid":"b68b2fba-41ab-405f-925d-ee43cd3ccd17","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to create something that has a meaningful and lasting impact, whether that’s through technology, business, or education. I’m especially interested in how data and technology can be used to solve real-world problems and improve people’s lives, and I’d love to be part of building something that reaches and helps a large number of people.\u003c/p\u003e\u003cp\u003eAt the same time, impact to me isn’t just about scale—it’s also about the individuals you directly influence. Through mentorship, I hope to help students gain confidence, discover their interests, and realize their potential. If I can play a role in helping someone change how they see themselves and what they’re capable of, that’s something I would consider a meaningful accomplishment.\u003c/p\u003e\u003cp\u003eUltimately, I want to combine both—building something impactful at a broader level while also making a difference in the lives of individuals along the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"eaf329f3-e578-4a72-aabb-b893169a4ba5\"}":{"__typename":"DeepDives","uuid":"eaf329f3-e578-4a72-aabb-b893169a4ba5","content":"\u003cp\u003eMy dream job is one where I can work at the intersection of data, technology, and real-world impact. I’m especially interested in roles where I can use data science to solve meaningful problems, whether that’s in tech, finance, or building my own ventures. I enjoy working with data not just to analyze it, but to turn insights into decisions that create tangible value.\u003c/p\u003e\u003cp\u003eBeyond the technical side, I also care a lot about ownership and creativity. Ideally, I’d like to be in a role where I’m not just executing tasks, but thinking strategically, building projects from the ground up, and continuously learning. That’s part of why I’m also interested in entrepreneurship—I enjoy the process of identifying opportunities, experimenting, and creating something from nothing.\u003c/p\u003e\u003cp\u003eAt the same time, I don’t see my dream job as just a single role or title. I want to build a career where I can grow, take on new challenges, and have the flexibility to explore different interests over time. Ultimately, my goal is to do work that is both intellectually engaging and impactful, while also allowing me to keep learning and evolving.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"7733a6b8-8792-49de-9d04-33393cc9109c\"}":{"__typename":"School","uuid":"7733a6b8-8792-49de-9d04-33393cc9109c","name":"Syosset High School","city":"Syosset","type":"HIGH","state":"New York","country":"United States","zip":"11791"},"Education:{\"uuid\":\"c063f7a3-33e0-4228-accc-a9ab21dd02b8\"}":{"__typename":"Education","uuid":"c063f7a3-33e0-4228-accc-a9ab21dd02b8","school":{"__ref":"School:{\"uuid\":\"7733a6b8-8792-49de-9d04-33393cc9109c\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"2ec3e697-5141-4570-9948-80bd6a16a90a\"}":{"__typename":"Education","uuid":"2ec3e697-5141-4570-9948-80bd6a16a90a","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Information Science, Business","degree":null},"MentorPublicProfile:{\"uuid\":\"52741bdb-a71d-4c62-9aa4-1a4181fa7da2\"}":{"__typename":"MentorPublicProfile","uuid":"52741bdb-a71d-4c62-9aa4-1a4181fa7da2","displayName":"kevin H.","slug":"kevin-","biography":"\u003cp\u003eHi! I’m Kevin, an Information Science and Business student at Cornell University with a strong passion for helping students build confidence, curiosity, and independence in their learning.\u003c/p\u003e\u003cp\u003eAcademically, I focus on statistics, programming, and data analysis, and I enjoy applying these skills to real-world problems. I’ve also worked as a teaching assistant at Cornell, where I’ve guided students through challenging concepts, supported them on assignments, and helped them develop stronger problem-solving skills. Through this experience, I’ve learned that many students struggle not because they lack ability, but because they need the right structure, explanations, and encouragement to build confidence in themselves and their abilities.\u003c/p\u003e\u003cp\u003eOutside of the classroom, I’m interested in the intersection of technology, business, and data. I’ve worked on projects involving data analysis and enjoy exploring how data can be used to better understand patterns and make informed decisions. I also run a small business where I source products and sell them online, which has taught me a lot about initiative, adaptability, and real-world problem-solving. Managing a business has helped me develop discipline, creativity, and the ability to think critically when facing new challenges.\u003c/p\u003e\u003cp\u003eIn my free time, I enjoy working out, staying active, and exploring new ideas in tech and business. I’m someone who values continuous growth, and I enjoy pushing myself to learn new skills and improve over time. I try to bring that same mindset into my mentoring by encouraging students to step outside of their comfort zones and see challenges as opportunities to grow.\u003c/p\u003e\u003cp\u003eAs a mentor, I aim to create a supportive, engaging, and encouraging environment where students feel comfortable asking questions and thinking through problems at their own pace. I believe learning should feel interactive and meaningful, not overwhelming or discouraging. Whether a student is looking to strengthen their academic skills, improve study habits, explore a new interest, or build a project they’re proud of, I work with them step by step to help them make real progress.\u003c/p\u003e\u003cp\u003eI also place a strong emphasis on helping students develop long-term skills such as organization, time management, and independent thinking. These are just as important as mastering any specific subject, and they help students succeed both in school and beyond.\u003c/p\u003e\u003cp\u003eUltimately, my goal is to help students not only succeed in their classes, but also develop the confidence, curiosity, and independence that will support them long after our sessions. I want students to walk away not just with better grades, but with a stronger belief in their ability to learn and grow.\u003c/p\u003e","teachingVideoPlaybackId":"oNJcCDOZxpV5WKU8kQsOdeHJOmokVRxYEfU2Gwf4EFE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is the progress I’ve made as a teaching assistant at Cornell. When I first started, I wasn’t sure how effective I would be at helping other students understand complex material, especially since everyone learns differently. Over time, I learned how to break down difficult concepts into simpler steps, adjust my explanations based on the student, and create a more supportive environment where people felt comfortable asking questions.\u003c/p\u003e\u003cp\u003eWhat made this experience meaningful to me wasn’t just the role itself, but seeing the impact it had. There were students who initially struggled or felt discouraged, and over time, I could see their confidence grow as they started to understand the material and solve problems on their own. Moments like that made me realize that teaching isn’t just about knowing the content—it’s about communication, patience, and helping someone believe they’re capable.\u003c/p\u003e\u003cp\u003eI’m proud of this because it reflects growth on both sides. Not only did the students improve, but I also developed stronger communication skills, empathy, and a better understanding of how to support others effectively. It’s an experience that reinforced my interest in mentorship and is something I hope to continue building on in the future.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"266eb8fb-7b69-4250-b3f1-756fdcaa9470\"}"},{"__ref":"Favorites:{\"uuid\":\"3e9ce652-bfbe-45ad-8437-617e89f3b741\"}"},{"__ref":"Favorites:{\"uuid\":\"40954494-8249-44f8-828f-73f413dd9d8a\"}"}],"causesSupported":[],"major":"Information Science, Business","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"af0c4023-7e11-432d-a735-c434ded22ea3\"}"},{"__ref":"DeepDives:{\"uuid\":\"7729986f-238f-48b7-b9df-dc0daa4b2b55\"}"},{"__ref":"DeepDives:{\"uuid\":\"b68b2fba-41ab-405f-925d-ee43cd3ccd17\"}"},{"__ref":"DeepDives:{\"uuid\":\"eaf329f3-e578-4a72-aabb-b893169a4ba5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/562257e6-c8ee-4742-a21b-e437934cd792/-/preview/-/format/jpg/","https://ucarecdn.com/1ce47468-1a67-4d47-8fcc-c026009eff38/-/preview/-/format/jpg/","https://ucarecdn.com/c861cd1e-ba25-417e-974d-a24c1e34a33e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c063f7a3-33e0-4228-accc-a9ab21dd02b8\"}"},{"__ref":"Education:{\"uuid\":\"2
