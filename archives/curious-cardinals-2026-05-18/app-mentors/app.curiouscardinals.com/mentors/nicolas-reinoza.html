xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d9deccaf-3662-4e1e-8308-408dd38793c7\"}":{"__typename":"DeepDives","uuid":"d9deccaf-3662-4e1e-8308-408dd38793c7","content":"\u003cp\u003eIf I could give my younger self some advice it would be to trust myself! As a high school student I would have doubts on whether the goals I set for myself were unrealistic. Now I know that they aren't. No goal is too far fetched, any dream is achievable with the right amount of time and effort!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"abbedeac-d245-42d8-9029-2ee30de25f8f\"}":{"__typename":"School","uuid":"abbedeac-d245-42d8-9029-2ee30de25f8f","name":"The British School Caracas","city":"Caracas","type":"HIGH","state":"Miranda","country":"Venezuela","zip":"1070"},"Education:{\"uuid\":\"a99ff4fa-da48-4b63-bf88-94e0b2b0e948\"}":{"__typename":"Education","uuid":"a99ff4fa-da48-4b63-bf88-94e0b2b0e948","school":{"__ref":"School:{\"uuid\":\"abbedeac-d245-42d8-9029-2ee30de25f8f\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"86a80c6c-71e0-4971-89ce-9795690f0a0e\"}":{"__typename":"Education","uuid":"86a80c6c-71e0-4971-89ce-9795690f0a0e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":"Bachelor of Science"},"MentorPublicProfile:{\"uuid\":\"8187d223-bbef-48a0-b212-636a638c16fa\"}":{"__typename":"MentorPublicProfile","uuid":"8187d223-bbef-48a0-b212-636a638c16fa","displayName":"Nicolas R.","slug":"nicolas-reinoza","biography":"\u003cp\u003eHey, I'm Nico! I'm a junior at Stanford University, majoring in Computer Science. I grew up in Venezuela and a bit in Canada, studying in International Schools.  \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was a consistent medallist in the Venezuelan National Mathematics Olympiads throughout high school, allowing me to learn to solve problems creatively, since every problem and every student is unique and deserving of their own approach. At Stanford I've created award-winning projects in Virtual Reality, Artificial Intelligence, and game development, all things that I love to teach about! I also have experience with personal finance, business and economics basics and data science.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI spend lots of my free time rock climbing! The sport has given me some incredible experiences and amazing friends. It has taught me to value nature and to be adventurous. Most importantly, it taught me that no matter how stuck you feel, there’s always a way out and forward, sometimes it requires practice and focus, and sometimes it requires you to rethink the approach in a way you hadn’t considered. If I’m not climbing or hanging out with friends I’m probably playing video games or watching a movie (Yes! You can play video games and be a good student!). I like lots of different kinds of movies, from Disney classics to mind-bending films like Interstellar or Shutter Island, and I’d love to be in one some day! I love to teach because I know how good it feels to actually understand something, beyond just remembering some facts or formulas. It’s a great experience to be explaining something to someone and to see in their expression the moment when they fully understand: It’s relief and it’s excitement, it’s a Eureka moment. I strive to deliver more of those! I’m super excited to meet you! See you soon!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d9deccaf-3662-4e1e-8308-408dd38793c7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b22eb01b-f1cd-4c67-9c6e-4542614e209e/-/crop/658x658/34,163/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"a99ff4fa-da48-4b63-bf88-94e0b2b0e948\"}"},{"__ref":"Education:{\"uuid\":\"86a80c6c-71e0-4971-89ce-9795690f0a0e\"}"}],"hiredAt":"2022-10-31T19:00:17.000Z","topics":["Film / Theater","Finance / Investing","Coding / Programming","Game Design","Machine Learning / AI"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nicolas-reinoza\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8187d223-bbef-48a0-b212-636a638c16fa\"}"}}},"_sentryTraceData":"f021d2e5918640199a1182e2d675dc50-bbc3162314ab3f1e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f021d2e5918640199a1182e2d675dc50,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"nicolas-reinoza"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].p
