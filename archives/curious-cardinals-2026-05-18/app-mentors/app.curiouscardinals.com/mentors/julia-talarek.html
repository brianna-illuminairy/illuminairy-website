xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ccdfe50d-f07f-4f07-be30-2542f363661c\"}":{"__typename":"Favorites","uuid":"ccdfe50d-f07f-4f07-be30-2542f363661c","photoUrl":"https://ucarecdn.com/6d910712-efe4-43b3-8c21-8abf177b8ad5/","title":"The Art of Loving - Olivia Dean","type":"ALBUM"},"Favorites:{\"uuid\":\"7238b087-a56e-459a-8f98-6e560cd29307\"}":{"__typename":"Favorites","uuid":"7238b087-a56e-459a-8f98-6e560cd29307","photoUrl":"https://ucarecdn.com/f1fab5e3-44fb-47ea-ab75-acfda5dd5402/","title":"Pride and Prejudice - Jane Austen","type":"BOOK"},"Favorites:{\"uuid\":\"48255729-aa14-45a0-91d1-b61b83070732\"}":{"__typename":"Favorites","uuid":"48255729-aa14-45a0-91d1-b61b83070732","photoUrl":"https://ucarecdn.com/d65e1948-ae5c-4eae-ac45-91e2b02dc023/","title":"London","type":"CITY"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6cbfeb80-c458-4be8-90d7-a4f92a6f5fe6\"}":{"__typename":"DeepDives","uuid":"6cbfeb80-c458-4be8-90d7-a4f92a6f5fe6","content":"\u003cp\u003eGrowing up, I spent most of my summers visiting my family in my home country, Poland. This has also really helped me keep up my polish while living in the UK! I also love to travel and have been fortunate enough to see some beautiful place such as Bali, Montengro or the Alps!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"957c2f4a-1166-487e-8b5c-e0657335c7a8\"}":{"__typename":"DeepDives","uuid":"957c2f4a-1166-487e-8b5c-e0657335c7a8","content":"\u003cp\u003eI am probably proudest of the progress I have made academically and in building my confidence - from moving to the UK without a word of English at the age of 5 to studying at my dream university!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"008c4321-e4c7-406e-b68e-b92e7941044c\"}":{"__typename":"DeepDives","uuid":"008c4321-e4c7-406e-b68e-b92e7941044c","content":"\u003cp\u003eBiochemistry is all about learning what goes on in the body on a super small scale - more specifically in a single cell! Learning about these processes is what allows us to leverage them to create new drugs and medicines!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"1ed7671f-eee4-4844-85c3-267ad89ef4f4\"}":{"__typename":"DeepDives","uuid":"1ed7671f-eee4-4844-85c3-267ad89ef4f4","content":"\u003cp\u003eAt school, I was always curious and bright but lacked confidence in my ability. Through my own mentors, I have been able to build on this. This is why my mentorship style aims to empower other young people in their learning so they can acheive anything they put their minds to!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"4e45d111-461c-4ab1-a402-34545d6bcd65\"}":{"__typename":"School","uuid":"4e45d111-461c-4ab1-a402-34545d6bcd65","name":"North Halifax Grammar School","city":"Halifax","type":"HIGH","state":"England","country":"United Kingdom","zip":"HX2 9SU"},"Education:{\"uuid\":\"974077b7-5b49-4d08-8c19-eb8700ef4cf4\"}":{"__typename":"Education","uuid":"974077b7-5b49-4d08-8c19-eb8700ef4cf4","school":{"__ref":"School:{\"uuid\":\"4e45d111-461c-4ab1-a402-34545d6bcd65\"}"},"startYear":"2018","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518\"}":{"__typename":"School","uuid":"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518","name":"University of Oxford","city":"Oxford","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"OX1 2JD"},"Education:{\"uuid\":\"75a1b28d-3211-46b2-9c73-5474b2c7437d\"}":{"__typename":"Education","uuid":"75a1b28d-3211-46b2-9c73-5474b2c7437d","school":{"__ref":"School:{\"uuid\":\"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"MBiochem Molecular and Cellular Biochemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"4698b78d-8ca5-4757-ae38-5c0a75bb9f32\"}":{"__typename":"MentorPublicProfile","uuid":"4698b78d-8ca5-4757-ae38-5c0a75bb9f32","displayName":"Julia T.","slug":"julia-talarek","biography":"\u003cp\u003e\u003cstrong\u003e\u003cu\u003eAbout me\u003c/u\u003e\u003c/strong\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eHello!😊 My name is \u003cstrong\u003eJulia \u003c/strong\u003eand I am a \u003cstrong\u003efirst year Clinical Medicine PhD \u003c/strong\u003estudent working in \u003cstrong\u003evaccine research at the University of Oxford\u003c/strong\u003e. I recently graduated from the University of Oxford with my undergraduate \u003cstrong\u003eintegrated Master's degree in Molecular and Cellular Biochemistry\u003c/strong\u003e. \u0026nbsp;👩‍🔬🧪🔬\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m passionate about \u003cstrong\u003emaking science feel exciting and achievable\u003c/strong\u003e and I’m especially keen on\u003cstrong\u003e empowering young women in STEM\u003c/strong\u003e. Having been in your shoes not long ago, I understand both the academic pressure \u003cem\u003eand\u003c/em\u003e how to overcome it.\u0026nbsp;I am especially keen to \u003cstrong\u003ebuild confidence \u003c/strong\u003eand enthusiasm through learning and to embrace curiosity.✨\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eWhat I can Help With\u003c/u\u003e\u003c/strong\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am keen to help you with:\u0026nbsp;\u003c/p\u003e\u003cp\u003e🔬 \u003cstrong\u003eSTEM Academic Mentorship\u003c/strong\u003e\u0026nbsp;\u003cbr\u003eBiology, chemistry, medical sciences, and biochemistry - from building strong foundations to excelling in exams and coursework.\u0026nbsp;\u003c/p\u003e\u003cp\u003e🧪 \u003cstrong\u003eResearch \u0026amp; Project Mentorship\u003c/strong\u003e\u0026nbsp;\u003cbr\u003eGuidance on designing projects, analysing data, and presenting findings clearly and confidently -ideal for EPQs, research placements, and early lab work.\u0026nbsp;\u003c/p\u003e\u003cp\u003e🎤 \u003cstrong\u003ePresentation \u0026amp; Communication Skills\u003c/strong\u003e\u0026nbsp;\u003cbr\u003eHelping you speak with confidence, structure your ideas clearly, and engage any audience (yes, even examiners!).\u0026nbsp;\u003c/p\u003e\u003cp\u003e🎓 \u003cstrong\u003eOxbridge \u0026amp; UK University Admissions Support\u003c/strong\u003e\u0026nbsp;\u003cbr\u003eSupport with personal statements, interviews, and applications to help you put your best foot forward.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThese are all skills I’ve developed first-hand through my own academic journey and I’m excited to pass on what I’ve learned to you!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eMy Mentorship Style\u003c/u\u003e\u003c/strong\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eMy aim is to \u003cstrong\u003ebuild confidence, independence, and genuine understanding\u003c/strong\u003e. Learning works best when students feel supported and believe in themselves — and I tailor every session to individual goals and learning styles.\u0026nbsp;\u003c/p\u003e\u003cp\u003eWith experience teaching in \u003cstrong\u003esummer schools and tutoring settings\u003c/strong\u003e, I know how to make sessions both \u003cstrong\u003eproductive and enjoyable\u003c/strong\u003e \u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might include:\u0026nbsp;\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eMapping out a learning strategy to reach your specific goal\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConnecting scientific concepts to their real word applications\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWorking on how to write a top mark essay or personal statement\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePracticing presentation skills to ensure you're clear and engaging\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eOutside the lab\u003c/u\u003e\u003c/strong\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhen I’m not in the lab, you’ll probably find me \u003cstrong\u003edancing!\u003c/strong\u003e 💃\u0026nbsp;\u003cbr\u003eI trained in \u003cstrong\u003eballet\u003c/strong\u003e growing up and now dance \u003cstrong\u003eballroom and Latin\u003c/strong\u003e (think \u003cem\u003eDancing with the Stars\u003c/em\u003e!). I’m also a huge \u003cstrong\u003ejazz music fan\u003c/strong\u003e and am currently learning to play \u003cstrong\u003echess\u003c/strong\u003e in my spare time. ♟️\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"YlHt8Ksky02COpIsC8V6kZo5Dr1kc01vN3boi6AxzedFk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ccdfe50d-f07f-4f07-be30-2542f363661c\"}"},{"__ref":"Favorites:{\"uuid\":\"7238b087-a56e-459a-8f98-6e560cd29307\"}"},{"__ref":"Favorites:{\"uuid\":\"48255729-aa14-45a0-91d1-b61b83070732\"}"}],"causesSupported":[],"major":"MBiochem Molecular and Cellular Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6cbfeb80-c458-4be8-90d7-a4f92a6f5fe6\"}"},{"__ref":"DeepDives:{\"uuid\":\"957c2f4a-1166-487e-8b5c-e0657335c7a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"008c4321-e4c7-406e-b68e-b92e7941044c\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ed7671f-eee4-4844-85c3-267ad89ef4f4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b9cbe082-e0a4-4b73-a99b-e8eeb13b53b6/-/preview/-/format/jpg/","https://ucarecdn.com/bfbfd2ea-b3f2-4f47-bf04-63c4f00638b8/-/preview/-/format/jpg/","https://ucarecdn.com/767a322f-d928-4985-a49c-63832b43b9db/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"974077b7-5b49-4d08-8c19-eb8700ef4cf4\"}"},{"__ref":"Education:{\"uuid\":\"75a1b28d-3211-46b2-9c73-5474b2c7437d\"}"}],"hiredAt":"2025-12-10T19:15:44.525Z","topics":["6-8 Grade Science","Biology","Chemistry","Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","Medicine / Health","STEM Project","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"julia-talarek\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4698b78d-8ca5-4757-ae38-5c0a75bb9f32\"}"}}},"_sentryTraceData":"10fe73dac5e44cee96826bc43c75d170-afc6c7d3889e238a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9
