xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e213306e-48e8-42fd-9f3b-2f9e35fb66a6\"}":{"__typename":"DeepDives","uuid":"e213306e-48e8-42fd-9f3b-2f9e35fb66a6","content":"\u003cp\u003eDon't be scared to go outside your comfort zone! The younger you are, the more opportunities you have to make mistakes, so take the opportunity to try, whether you fail or succeed, while you still have the chance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"726fca81-94a4-4d22-8ed2-8ff662990227\"}":{"__typename":"DeepDives","uuid":"726fca81-94a4-4d22-8ed2-8ff662990227","content":"\u003cp\u003eCurrently, I am working on building a band-pass filter which filters out unwanted noises that may be present in a signal. This might be applicable in scenarios such as filtering out noise in an individual using a hearing aid.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"d83fdf1b-3fdb-44da-8d9e-2c99436721eb\"}":{"__typename":"DeepDives","uuid":"d83fdf1b-3fdb-44da-8d9e-2c99436721eb","content":"\u003cp\u003eOne time, I dreamt that I was in a massive movie theater, and every single celebrity that I thought about would magically appear in one of the seats of the theater. Every time this happened I would get so excited and run as fast as I could to meet them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"661a9dc6-5201-401f-9770-b207e504f786\"}":{"__typename":"School","uuid":"661a9dc6-5201-401f-9770-b207e504f786","name":"Irvine High School","city":"Irvine","type":"HIGH","state":"California","country":"United States","zip":"92604"},"Education:{\"uuid\":\"b8700f2d-d12b-46b0-984a-6d286d2b2db9\"}":{"__typename":"Education","uuid":"b8700f2d-d12b-46b0-984a-6d286d2b2db9","school":{"__ref":"School:{\"uuid\":\"661a9dc6-5201-401f-9770-b207e504f786\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"4dd91502-7d36-4c0a-b266-d7ffcf63b748\"}":{"__typename":"Education","uuid":"4dd91502-7d36-4c0a-b266-d7ffcf63b748","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"71e2724f-dc3d-4554-85ab-4327e804b8ef\"}":{"__typename":"MentorPublicProfile","uuid":"71e2724f-dc3d-4554-85ab-4327e804b8ef","displayName":"Aaron C.","slug":"aaron-chao","biography":"\u003cp\u003eHi! My name is Aaron Chao and I'm currently a sophomore studying Electrical Engineering at UCLA. Up to this point, my academic journey has been full of intriguing subjects and exciting projects. So far at UCLA, I have gained an immense amount of knowledge in subjects ranging from the history of modern medicine, to linear algebra, to semiconductor physics, and beyond. I have also been involved in projects such as a maze-solving mouse I created with UCLA's IEEE organization, conducting research on the applications of nanotechnology at UCLA, and a mmWave antenna positioner project that I completed during my internship at Movandi Co. This is, in my opinion, what I find the most fascinating about studying electrical engineering—the application of electrical engineering in so many aspects of our daily lives opens up an infinite amount of possibilities when it comes to expressing your creativity in your own, distinct way.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also love to explore my interests outside of my personal academics. I have been playing the piano for 14 years now, and have won multiple awards including the MTAC panel honors and finalist awards. Playing the piano has always been a way for me to express my creativity in a different way, whether it be playing for myself or performing for others. I also spend some of my free time tutoring students of all ages in a variety of subjects. Previously I had tutored for a company called Kumon, where I worked with students ages 5-16 in strengthening their reading and writing skills. I have also started by own private tutoring service, where I primarily work with students who feel that they need a more personal mentor to guide them through subjects they struggle with. Some other activities that I enjoy are listening to music, going to the beach, and working out.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Curious Cardinals, I hope to use my experience both inside and outside the classroom to guide my mentees to a path of success. Growing up, I never really had someone that I could rely on as a mentor, and as a result, I struggled for a long time, trying to find my passions in both academics and extracurriculars. I hope that I am able to foster a strong relationship with my mentees so that I can understand their struggles, discover their interests, and make their journey to finding their passions fun and much easier.\u003c/p\u003e","teachingVideoPlaybackId":"EVvOH3CcUOnNAnrSbkA00eB6s47y01jt43RQ181fk69IY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e213306e-48e8-42fd-9f3b-2f9e35fb66a6\"}"},{"__ref":"DeepDives:{\"uuid\":\"726fca81-94a4-4d22-8ed2-8ff662990227\"}"},{"__ref":"DeepDives:{\"uuid\":\"d83fdf1b-3fdb-44da-8d9e-2c99436721eb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a175e30b-86c1-4fd7-bb7b-dea66300c818/-/preview/-/format/jpg/","https://ucarecdn.com/15825b0b-3fa0-4783-8edc-60f7a07fc385/-/preview/-/format/jpg/","https://ucarecdn.com/b22fe98d-777d-40f6-8fd0-f39e10e4c988/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b8700f2d-d12b-46b0-984a-6d286d2b2db9\"}"},{"__ref":"Education:{\"uuid\":\"4dd91502-7d36-4c0a-b266-d7ffcf63b748\"}"}],"hiredAt":"2025-02-20T12:35:57.818Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Biology","Physics","Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","History","Computer Science","K-6 Storybook","Creative Writing","Music","History Project","Coding / Programming","Robotics / Electronics / CAD","STEM Project","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"aaron-chao\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"71e2724f-dc3d-4554-85ab-4327e804b8ef\"}"}}},"_sentryTraceData":"b915a3fef11b47cbbaaa92dd
