xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"aa9b498c-3003-4930-a2dc-2f915bd3a866\"}":{"__typename":"Favorites","uuid":"aa9b498c-3003-4930-a2dc-2f915bd3a866","photoUrl":"https://ucarecdn.com/9fb577a0-3650-4103-8d94-fd15f954b75b/","title":"San Francisco, of course!","type":"CITY"},"Favorites:{\"uuid\":\"8dc4654c-5030-407d-bbb2-0a91750fb030\"}":{"__typename":"Favorites","uuid":"8dc4654c-5030-407d-bbb2-0a91750fb030","photoUrl":"https://ucarecdn.com/8f50a8fb-f536-43d1-9725-b33abd4e91be/","title":"Bananagrams","type":"GAME"},"Favorites:{\"uuid\":\"dda5f39e-4238-4cb2-be08-052906ceef33\"}":{"__typename":"Favorites","uuid":"dda5f39e-4238-4cb2-be08-052906ceef33","photoUrl":"https://ucarecdn.com/f51efd65-de02-43a4-8d89-f8a293d4ab1a/","title":"Mission Impossible","type":"MOVIE"},"CausesSupported:{\"uuid\":\"91b64a83-55bb-4ebb-8ee9-8dcbd12709f7\"}":{"__typename":"CausesSupported","uuid":"91b64a83-55bb-4ebb-8ee9-8dcbd12709f7","name":"Peninsula Bridge","description":"\u003cp\u003eAs a tutor for Peninsula Bridge, I got to teach, and promote educational equity.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/2e64d7ba-b937-4867-9594-a2902ed46ea2/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bc961e44-b154-45b6-84e9-fe6773c2bf1f\"}":{"__typename":"DeepDives","uuid":"bc961e44-b154-45b6-84e9-fe6773c2bf1f","content":"\u003cp\u003eI chose my major (English, French, and Spanish Comparative Literature) because I knew I wanted all the things that foreign languages have to offer. I have gotten the opportunity to study grammatical structures (I am such a nerd for a good syntax!) and linguistics. More importantly, I have also gotten the chance to connect with people through their native languages, and have truly unique experiences of that connection!\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"69114cc0-7834-41a5-890c-91728073ea36\"}":{"__typename":"DeepDives","uuid":"69114cc0-7834-41a5-890c-91728073ea36","content":"\u003cp\u003eSomething about me that isn’t obvious right away is that I bake the best apple pie in the country. My very southern grandma can confirm this is true. (Pro tip, it involves an egg wash on the crust!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6c43b674-18fc-4661-aa7d-6b46deb98bf0\"}":{"__typename":"DeepDives","uuid":"6c43b674-18fc-4661-aa7d-6b46deb98bf0","content":"\u003cp\u003eIn high school, I spent my summers all over the place! I loved to do something fun and a little adventurous every summer, because school was pretty overwhelming during the school year. I’ll give you a quick summary of each summer! After freshman year, I did a two week long sea kayaking trip in the Boston Harbor. If you’re wondering, it’s not all that warm in the harbor, even in the summer. Then, after my sophomore year, I did a creative writing program at Oxford University, where I wrote lots of short stories! After junior year, I worked at my local Barnes and Noble (I have so many funny stories about working retail there, just ask!) Last but not least, after my senior year, I traveled to Spain and worked as an au pair for a family in Barcelona the whole summer!\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d8059341-454b-4d2f-add7-b78bacc7ca0b\"}":{"__typename":"DeepDives","uuid":"d8059341-454b-4d2f-add7-b78bacc7ca0b","content":"\u003cp\u003eIn my spare time, I love to bake, read, and drive to the beach (which I desperately miss as a Californian-turned-Rhode-Islander). I love to watch live music, and you can often find me playing (very basic!) guitar with my music-loving friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}":{"__typename":"School","uuid":"70146acc-a4ce-459e-8969-b791ab43dfb2","name":"Menlo School","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"8ebc6287-36b1-4cd2-8feb-5465ba340b33\"}":{"__typename":"Education","uuid":"8ebc6287-36b1-4cd2-8feb-5465ba340b33","school":{"__ref":"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"26335d6c-52d6-4aaa-ba87-d729c9129c46\"}":{"__typename":"Education","uuid":"26335d6c-52d6-4aaa-ba87-d729c9129c46","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Comparative Literature (English, French, and Spanish)","degree":null},"MentorPublicProfile:{\"uuid\":\"d623e63f-79b2-4f53-8a94-fef979a1de1d\"}":{"__typename":"MentorPublicProfile","uuid":"d623e63f-79b2-4f53-8a94-fef979a1de1d","displayName":"Mackenzie F.","slug":"mackenzie-ford","biography":"\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eMack is a senior at Brown University studying Comparative Literature in English, French, and Spanish. She grew up in the Bay Area in California and went to a school called Menlo down near Stanford. In high school, she competed in Mock Trial and as a state award-winning witness and is now at an internship with the US Attorney's Office in Southern Manhattan. Mack also \u003cem\u003eadores \u003c/em\u003etheater and is the president of her a cappella group at Brown, so if you're interested in music or performing, she can talk about it for hours!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eMack has also worked in a few publishing and magazine internships, including Pie Press Publishing, Publishing Solutions Group, and New York Moves Magazine. She loves to write creatively and has written a few books of her own, so she is very familiar with the process of long-form writing.\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIf you are looking for someone to teach anything from French or Spanish language to playwriting, songwriting, or screenwriting, to pre-law, to archival research, or how to write and publish your own book, she is your person!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, she loves to bake, read, and drive to the beach (which she desperately misses as a Californian-turned-Rhodeo-Islander). Mack loves to watch live music, and you can often find her playing (very basic!) guitar with her music-loving friends.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eMack has worked as a mentor three hours a week with various students since she was in middle school, and has taught everything from grammar to creative writing to algebra. One of her most rewarding moments was when one of her students won a prize for local creative writing on a piece they edited together!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn her mentorship, she prefers a teaching style that asks students to take ownership of their material - to really claim their education. She will bring a lot of enthusiasm to each of her sessions, and she loves to see her students match that level of energy. If you are interested in pursuing a project in any of the subjects she has studied or just want to chat about something you're passionate about, please don't hesitate to reach out! She can't wait to meet you.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy proudest moment was when I finished the first book I ever wrote. I had just finished my junior year of high school, and I wanted to do some long-form creative writing, which I'd never done before. It took almost two months, and was upwards of 80,000 words (unedited!) and I had the best time. I learned what the process of writing a novel really felt like - and there are certainly some ups and downs. But in the end, I was enormously proud of what I had accomplished.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"aa9b498c-3003-4930-a2dc-2f915bd3a866\"}"},{"__ref":"Favorites:{\"uuid\":\"8dc4654c-5030-407d-bbb2-0a91750fb030\"}"},{"__ref":"Favorites:{\"uuid\":\"dda5f39e-4238-4cb2-be08-052906ceef33\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"91b64a83-55bb-4ebb-8ee9-8dcbd12709f7\"}"}],"major":"Comparative Literature (English, French, and Spanish)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bc961e44-b154-45b6-84e9-fe6773c2bf1f\"}"},{"__ref":"DeepDiv
