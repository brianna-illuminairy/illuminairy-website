xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"87b60537-db0e-4e69-9e33-80c3b7aa3226\"}":{"__typename":"DeepDives","uuid":"87b60537-db0e-4e69-9e33-80c3b7aa3226","content":"\u003cp\u003eI'd tell my high school self to spend more time exploring different interests and working on little projects. I often felt so busy with school and extracurriculars that I didn't make time to try new things and explore passionate projects. I also would tell myself to remember to enjoy the little things like getting ice cream with my brother or watching the latest marvel movie with friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ef00fb10-2856-48fd-ad81-b95af40b3619\"}":{"__typename":"DeepDives","uuid":"ef00fb10-2856-48fd-ad81-b95af40b3619","content":"\u003cp\u003eVirgil Abloh was renowned for collaborations. He knew how to stick to his design DNA while still making things with others that became something more than just the two collaborators added together. His advice and recommendations on developing a personal design language and knowing what unique value and perspective you bring to the table really inspire me. I’ve begun writing my own design languages from his advice, and I’m excited to see it grow and evolve.\u003cbr\u003e\u003cbr\u003eI also really appreciate his nontraditional background and emphasis on the importance of doing more than just your primary work focus. He explored architecture, fashion, music and skateboarding. While things seemingly don’t overlap or cross into each other always, he believed they made someone a more well rounded person and encouraged creativity. I’ve dabbled in many things over time, and find this advice really resonates.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ec919473-667f-4225-b7c1-ba15ec364e4c\"}":{"__typename":"DeepDives","uuid":"ec919473-667f-4225-b7c1-ba15ec364e4c","content":"\u003cp\u003eI chose Computer Science because it feels like the ultimate toolset. The real limit of Computer Science is the human imagination. I wanted to be a computer scientist because I yearn to stretch my imagination while still challenging my brain to solve difficult analytical problems.\u0026nbsp;\u003cbr\u003e\u003cbr\u003eI chose footwear and accessories design because it is an extremely technical design major. Creating shoes requires many considerations for design around the foot and supporting it properly. I love the challenge of trying to making something aesthetically interesting while still respecting the constraints of needing to be able to walk around in it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"20ca937b-050d-4dd5-8a9d-80afe1f67300\"}":{"__typename":"DeepDives","uuid":"20ca937b-050d-4dd5-8a9d-80afe1f67300","content":"\u003cp\u003eI made a light up dress with arduinos and rgb lights! Fashion is an industry that is constantly changing and looking for the next big 'new thing'. I wanted to create a dress that changes so is still wearable seasons later. The light up dress can be customized over and over again with new color combos so it fits all seasons. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"33fd4991-bdc3-4d0b-9f6b-5ad1ec6da09e\"}":{"__typename":"School","uuid":"33fd4991-bdc3-4d0b-9f6b-5ad1ec6da09e","name":"Reagan High School","city":"San Antonio","type":"HIGH","state":"Texas","country":"United States","zip":"78258"},"Education:{\"uuid\":\"d5ed3e1a-0c50-4f4f-b985-0a37971a8d25\"}":{"__typename":"Education","uuid":"d5ed3e1a-0c50-4f4f-b985-0a37971a8d25","school":{"__ref":"School:{\"uuid\":\"33fd4991-bdc3-4d0b-9f6b-5ad1ec6da09e\"}"},"startYear":"2014","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"4687fcc3-bdac-43e3-85b4-b1f8bf25579c\"}":{"__typename":"Education","uuid":"4687fcc3-bdac-43e3-85b4-b1f8bf25579c","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2020","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2c2d3ff0-55a6-4466-b75c-870240971e79\"}":{"__typename":"MentorPublicProfile","uuid":"2c2d3ff0-55a6-4466-b75c-870240971e79","displayName":"Julianne L.","slug":"julianne-lefelhocz","biography":"\u003cp\u003eJulianne graduated from the Georgia Institute of Technology with a bachelor's in Computer Science and after spending a couple of years in the fintech industry, now is studying at the Fashion Institute of Technology for an associate's degree in Footwear and Accessories Design. She is passionate about the intersection of art and technology, particularly fashion and tech. She has industry-level experience coding tools for portfolio managers in various languages and frameworks, including Typescript, React, node.js, python, pandas and numpy. Throughout her career, she has also tried Swift (for iOS app development), C# and Unity (video games and VR), Arduino projects (physical electronic projects), and more. As a part of her goal to explore the combination of tech and fashion, she has self-taught many 3D modeling programs including Blender, Nomad Sculpt, Rhino, Daz3d (for avatars), Substance3d (for texturing) and Clo3d (for clothing simulations). She considers herself a dabbler in technology and is always excited to try something new. As part of her interest in fashion, she is an avid sewer, and pattern maker, and has studied art history and fashion forecasting. She explores 3D printing textiles, 3D printing on fabric, 3D printing accessories, creating interactive garments, digital fashion design, and producing generative designs from code.\u003cbr\u003e\u003cbr\u003eOutside of projects, she is passionate about DEI initiatives and mentorship. During her time in the tech industry, she was extremely involved in technical recruiting, helping to recruit diverse talent and volunteering to help them prep for technical interviews as well as conducting many normal technical interviews. She has also mentored two interns through successful work projects. She also ran a book club at work for women in software engineering and led a working group to curate inclusive discussion groups.\u003cbr\u003e\u003cbr\u003eIn her personal development, she is working on taking more risks (hence getting a new degree) and consistency. She follows a policy for her project called 'no zero days' where every day she tries to do at least one thing towards her project, even if it is as simple as writing a to-do list for what she needs to do the next day. \u003cbr\u003e\u003cbr\u003eIn her free time, she also enjoys reading science fiction books, yoga, walking around Central Park, and seeing musicals/plays.\u003c/p\u003e","teachingVideoPlaybackId":"Mef6pFjRfUCXq01B5sAAsCQTOctD3vK02EEQHT02Hhns8w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"87b60537-db0e-4e69-9e33-80c3b7aa3226\"}"},{"__ref":"DeepDives:{\"uuid\":\"ef00fb10-2856-48fd-ad81-b95af40b3619\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec919473-667f-4225-b7c1-ba15ec364e4c\"}"},{"__ref":"DeepDives:{\"uuid\":\"20ca937b-050d-4dd5-8a9d-80afe1f67300\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/85753c09-5b81-4be9-8828-d3234d9320f7/-/preview/-/format/jpg/","https://ucarecdn.com/ff785d24-2cf2-416b-a2a0-c053ad3d9c4f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d5ed3e1a-0c50-4f4f-b985-0a37971a8d25\"}"},{"__ref":"Education:{\"uuid\":\"4687fcc3-bdac-43e3-85b4-b1f8bf25579c\"}"}],"hiredAt":"2023-06-21T02:26:57.479Z","topics":["Fashion / Cosmetics","Coding / Programming","Web Design","Robotics / Electronics / CAD","Game Design"],"communityBadges":["https://ucarecdn.com/113d5871-8410-43cf-8c06-3005496319c6/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"julianne-lefelhocz\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2c2d3ff0-55a6-4466-b75c-870240971e79\"}"}}},"_sentryTraceData":"860e16d08a7f4942ae400a2f9822a443-bd83e6fd1c0d64eb-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc7
