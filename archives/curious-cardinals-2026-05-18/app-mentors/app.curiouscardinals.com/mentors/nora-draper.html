t, which provides e-readers to students, giving them access to literature at home and in school. Nora has been tutoring in various capacities since her freshman year of high school. She took a gap year for the 2020-2021 academic year and spent her time working as a financial modeling intern, doing research for the Yale School of Medicine, and tutoring. She loved her time off but is very excited to return to school in the Fall. In her free time, Nora enjoys hiking, thrift shopping, watching old movies, and playing with her two dogs. She is very enthusiastic about nature, numbers, and dogs and can’t wait to share that with her Curious students.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":null,"deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/463cab89-ac0f-4f9a-add8-20e4ee8c0fac/-/crop/692x692/70,0/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a9aa54e8-76ab-4f37-b8ba-eff5609fa518\"}"}],"hiredAt":"2021-08-02T16:25:57.000Z","topics":["Calculus","K-5 Grade Math","Algebra II","Women \u0026 Gender Studies","Pre-Algebra","Economics","Geometry","Algebra I","Precalculus / Trigonometry","Game Design","Statistics","Physics","Coding / Programming","Finance / Investing","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nora-draper\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"cbf651f9-d2dd-49ab-9e97-a45de81625b7\"}"}}},"_sentryTraceData":"26d1feafa2a44904ba6b0c6e01ccda27-acb5da784406587f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=26d1feafa2a44904ba6b0c6e01ccda27,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,
