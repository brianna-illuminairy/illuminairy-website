xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"085dc5c8-9124-4c43-a7f1-9ae617789ba3\"}":{"__typename":"Favorites","uuid":"085dc5c8-9124-4c43-a7f1-9ae617789ba3","photoUrl":"https://ucarecdn.com/0fab788e-c690-495f-877f-f1ad341c1f16/","title":"Frank Ocean","type":"ARTIST"},"Favorites:{\"uuid\":\"a6cabe37-1f69-42d8-99b7-d939b9ddc641\"}":{"__typename":"Favorites","uuid":"a6cabe37-1f69-42d8-99b7-d939b9ddc641","photoUrl":"https://ucarecdn.com/c22646c4-96c2-46ab-8ab1-d10e30369c7a/","title":"A New Earth","type":"BOOK"},"Favorites:{\"uuid\":\"cde86a68-c57e-41d7-acea-5af13f6a7e8f\"}":{"__typename":"Favorites","uuid":"cde86a68-c57e-41d7-acea-5af13f6a7e8f","photoUrl":"https://ucarecdn.com/b6f65263-a986-435e-992d-1fef08a5c9df/","title":"It Takes Two","type":"GAME"},"CausesSupported:{\"uuid\":\"887e91d4-a47e-4321-b1ea-b44e2400cfc7\"}":{"__typename":"CausesSupported","uuid":"887e91d4-a47e-4321-b1ea-b44e2400cfc7","name":"Food Bank For New York City","description":"\u003cbr\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d0665711-fd8e-41de-b867-00f5eb55cdcd\"}":{"__typename":"DeepDives","uuid":"d0665711-fd8e-41de-b867-00f5eb55cdcd","content":"\u003cp\u003eI’d tell my younger self to take a step back and appreciate how far you’ve come. It’s so easy to focus on what you don’t have or compare yourself to others, but there’s so much in your life already worth being grateful for—your friends, family, an education, even simple things like sunlight, clean water, or a pet that makes you smile. Progress isn’t always loud or flashy, and gratitude can shift everything.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"ebc87a33-3d6b-4443-a31d-c89d78f27324\"}":{"__typename":"DeepDives","uuid":"ebc87a33-3d6b-4443-a31d-c89d78f27324","content":"\u003cp\u003eWhen I was a kid, I once dreamed the entire world was made of chocolate—cars, houses, people, trees. It was like living inside a giant candy bar. Safe to say, I was definitely the kid who traded all my Halloween candy just to stock up on chocolate.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e3ddbfa2-2e4c-4c81-9b39-9b214542ce69\"}":{"__typename":"DeepDives","uuid":"e3ddbfa2-2e4c-4c81-9b39-9b214542ce69","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is helping people shift their perspective. As I work toward becoming a doctor, I truly believe that empowering others to take back the \"remote control\" of their lives is one of the most meaningful things I can do. Whether it’s riding a bike for the first time, picking up a guitar, or making healthier choices for their mind and body—I want people to believe they \u003cem\u003ecan\u003c/em\u003e do the things they dream of. Sometimes, all it takes is someone who believes in you before you believe in yourself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8b64dd55-852d-4721-958c-4e6f9a000730\"}":{"__typename":"DeepDives","uuid":"8b64dd55-852d-4721-958c-4e6f9a000730","content":"\u003cp\u003eA passion project I’m working on is my food page! I share healthy, vegetarian recipes that are easy, fun, affordable, and quick—because I truly believe that even as a busy medical student, you can still find ways to nourish your body without sacrificing time or breaking the bank. My goal is to grow this platform into a space that shows people that cooking can be both realistic and rewarding, no matter how hectic life gets.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"b43bc23c-d227-406c-9781-b155286fbfb0\"}":{"__typename":"School","uuid":"b43bc23c-d227-406c-9781-b155286fbfb0","name":"South Forsyth High School","city":"Cumming","type":"HIGH","state":"Georgia","country":"United States","zip":"30041"},"Education:{\"uuid\":\"db668189-ac58-4c41-a0bb-0bb9ea72f926\"}":{"__typename":"Education","uuid":"db668189-ac58-4c41-a0bb-0bb9ea72f926","school":{"__ref":"School:{\"uuid\":\"b43bc23c-d227-406c-9781-b155286fbfb0\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"8d371ac6-e3a4-48a0-ac69-f210d93175a2\"}":{"__typename":"School","uuid":"8d371ac6-e3a4-48a0-ac69-f210d93175a2","name":"University of California, Davis","city":"Davis","type":"COLLEGE","state":"California","country":"United States","zip":"95616"},"Education:{\"uuid\":\"d76c2fb0-d083-4755-9b68-a1403991c77e\"}":{"__typename":"Education","uuid":"d76c2fb0-d083-4755-9b68-a1403991c77e","school":{"__ref":"School:{\"uuid\":\"8d371ac6-e3a4-48a0-ac69-f210d93175a2\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Neurobiology, Physiology, Behavior","degree":null},"MentorPublicProfile:{\"uuid\":\"b579a052-3deb-49a3-bab6-c10b34d570ad\"}":{"__typename":"MentorPublicProfile","uuid":"b579a052-3deb-49a3-bab6-c10b34d570ad","displayName":"Prerana D.","slug":"prerana-dewan","biography":"\u003cp\u003eI care deeply about the dynamic relationship between the mind and body—how our mental and physical health are deeply intertwined. I think it’s so important to stay curious about ourselves, pay attention to what fuels us, and make space for the things that keep us feeling grounded and energized.\u003c/p\u003e\u003cp\u003eI’m currently a first-year medical student in New York City, drawn to the complex beauty of the brain and how it connects to the rest of the body. My academic interests lie in neuroscience and mental health, and I’m currently involved in research with an Endovascular Neurosurgeon, which has been an incredible way to learn more about applying the powers of mindfulness in an academic setting.\u003c/p\u003e\u003cp\u003eOutside of school, I balance my love of science with creativity—I’ve been a Yelp Elite member for 7 years, sharing honest food reviews. I also love cooking, which is a fun way for me to unwind, learn more about other cultures, and nourish my body.\u003c/p\u003e\u003cp\u003eWhether I’m in the lecture hall, the clinic, or the kitchen, I’m driven by a curiosity about what makes us human—our biology, our behaviors, and everything in between.\u003c/p\u003e","teachingVideoPlaybackId":"iWRL3xK3myvozT8nKPq1dtfgyuoD2E7W9rwisiPD2YA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m incredibly proud of the impact I’ve made while working as a Clinical Research Coordinator at a dermatology clinic. Being part of clinical trials for conditions like eczema, psoriasis, and hidradenitis suppurativa has given me the opportunity to directly help patients who often struggle with both the physical and emotional toll of these chronic skin diseases. It’s been deeply fulfilling to guide patients through cutting-edge treatments, witness their progress, and know that the work we’re doing contributes to long-term solutions and improved quality of life. Supporting them through their journeys has reinforced my commitment to compassionate, research-driven care.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"085dc5c8-9124-4c43-a7f1-9ae617789ba3\"}"},{"__ref":"Favorites:{\"uuid\":\"a6cabe37-1f69-42d8-99b7-d939b9ddc641\"}"},{"__ref":"Favorites:{\"uuid\":\"cde86a68-c57e-41d7-acea-5af13f6a7e8f\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"887e91d4-a47e-4321-b1ea-b44e2400cfc7\"}"}],"major":"Neurobiology, Physiology, Behavior","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d0665711-fd8e-41de-b867-00f5eb55cdcd\"}"},{"__ref":"DeepDives:{\"uuid\":\"ebc87a33-3d6b-4443-a31d-c89d78f27324\"}"},{"__ref":"DeepDives:{\"uuid\":\"e3ddbfa2-2e4c-4c81-9b39-9b214542ce69\"}"},{"__ref":"DeepDives:{\"uuid\":\"8b64dd55-852d-4721-958c-4e6f9a000730\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/387856c9-ef4c-4b61-b808-aa30c234f468/-/preview/-/format/jpg/","https://ucarecdn.com/d43b624d-becc-4a46-9e7c-975f0f149374/-/preview/-/format/jpg/","https://ucarecdn.com/34608825-75b3-4adb-a576-c06e47ba379d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"db668189-ac58-4c41-a0bb-0bb9ea72f926\"}"},{"__ref":"Education:{\"uuid\":\"d76c2fb0-d083-4755-9b68-a1403991c77e\"}"}],"hiredAt":"2025-05-24T08:40:48.289Z","topics":["Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Biology","Chemistry","Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","Creative Writing","Medicine / Health"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"prer
