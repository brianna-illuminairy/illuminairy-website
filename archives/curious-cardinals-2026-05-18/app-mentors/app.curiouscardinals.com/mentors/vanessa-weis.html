xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c3be49f0-e494-4bb3-9054-dcb2b0f6d609\"}":{"__typename":"DeepDives","uuid":"c3be49f0-e494-4bb3-9054-dcb2b0f6d609","content":"\u003cp\u003eI would tell my high school self to focus on what I enjoy doing rather than doing what \"gets you into college.\" The best way to set your college application apart is by showing passion and dedication to what YOU love! Authenticity shines through on applications! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"ac30d889-28ca-40a3-a959-6669647801ba\"}":{"__typename":"DeepDives","uuid":"ac30d889-28ca-40a3-a959-6669647801ba","content":"\u003cp\u003eMy dream job is owning and operating a private practice that provides counseling to children, adolescents, and their families suffering from trauma and mood disorders!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a8933d9a-1cce-4729-95da-cc0391794c1d\"}":{"__typename":"DeepDives","uuid":"a8933d9a-1cce-4729-95da-cc0391794c1d","content":"\u003cp\u003eI chose my majors in Cognitive Science and Child Development because I am fascinated with human behavior - specifically the relationship between our thoughts, emotions, and actions. I think examining this relationship from a developmental standpoint is critical in understanding how to best help individuals who may be struggling with mood disorders. Additionally, I hope to work with children in the future so understanding how their minds and bodies change over time is key if I want to be successful in my future career!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"273d128a-e915-434d-afa9-d665893a63e9\"}":{"__typename":"DeepDives","uuid":"273d128a-e915-434d-afa9-d665893a63e9","content":"\u003cp\u003eMy greatest source of motivation is seeing the impact I have on others! In listening to people share their experiences, I find great motivation in wanting to help them reach their goals and improve their daily life. I believe that I have been incredibly blessed in my life so far, and by listening to other people's stories I become motivated in wanting to help them in any way I can!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"9bb78447-a9c9-4e88-a1be-1aa510aaa620\"}":{"__typename":"School","uuid":"9bb78447-a9c9-4e88-a1be-1aa510aaa620","name":"Olentangy Liberty High School","city":"Powell","type":"HIGH","state":"Ohio","country":"United States","zip":"43065"},"Education:{\"uuid\":\"8c99cac4-12cd-4145-ae4d-599f8e50be2c\"}":{"__typename":"Education","uuid":"8c99cac4-12cd-4145-ae4d-599f8e50be2c","school":{"__ref":"School:{\"uuid\":\"9bb78447-a9c9-4e88-a1be-1aa510aaa620\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"7e01815a-d4fc-41a7-b52c-1f0f8e4b01e5\"}":{"__typename":"School","uuid":"7e01815a-d4fc-41a7-b52c-1f0f8e4b01e5","name":"Johns Hopkins University","city":"Baltimore","type":"COLLEGE","state":"Maryland","country":"United States","zip":"21230"},"Education:{\"uuid\":\"c4472be4-9bda-4b6d-8890-84787d315e85\"}":{"__typename":"Education","uuid":"c4472be4-9bda-4b6d-8890-84787d315e85","school":{"__ref":"School:{\"uuid\":\"7e01815a-d4fc-41a7-b52c-1f0f8e4b01e5\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Clinical Mental Health Counseling","degree":null},"MentorPublicProfile:{\"uuid\":\"8af6515d-8a80-4f13-a627-b88db75257c3\"}":{"__typename":"MentorPublicProfile","uuid":"8af6515d-8a80-4f13-a627-b88db75257c3","displayName":"Vanessa W.","slug":"vanessa-weis","biography":"\u003cp\u003eHi! My name is Vanessa and I am a master's student at Johns Hopkins University majoring in Cognitive Science in their Master's of Science in Counseling program! I plan on working with children, teenagers, and young adults in a therapeutic setting. I graduated summa cum laude this past May from Vanderbilt University where I majored in Cognitive Science, Child Development, and Child Psychology and Mental Health. I am passionate about improving children and young adults' mental health, and in helping future leaders reach their full potential!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eApart from school I love being outdoors - I spend most of my free time hiking, biking, mountain climbing, running, and skydiving! This past April I ran my first marathon and I am now training for my second. I am excited to move to Baltimore and explore the various hiking trails, concert venues, and restaurants the city has to offer. I am also passionate about working with kids - especially those from underserved backgrounds. I founded a non-profit organization in high school that provided extracurricular activities to disadvantaged schools. In college, I consulted with a beginning non-profit organization that provided mental health and literacy services to children in an underserved community in Nashville to develop their curriculum, website, and social media platforms.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Vanderbilt, I worked in a research lab and work in partnership with Vanderbilt University's Psychiatric Hospital in assessing high-risk adolescents. I am researched the relationship between mood disorders, social media, and the brain. I also had the opportunity to study abroad during my time at Vanderbilt, and I studied in both Sydney, Australia and Madrid, Spain. I love immersing myself in different cultures. If you are interested in starting a non-profit, creating educational resources, anything in the social sciences, or want to develop your own research project I would love to help! I also love working with mentees that want to develop their own website, create lesson plans for various age groups (i.e. children, the elderly), and help build fundraisers at both the school and community level. Apart from passion projects, I enjoy tutoring in the social sciences, reading and writing, as well as German (I am fluent)! Standardized test prep such as for the ACT is something I have experience in, and I love helping students figure out what universities would be the best fit for them and help them develop creative and effective college essays.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI cannot wait to share my passion for education and mental health with Curious Cardinals!\u003c/p\u003e","teachingVideoPlaybackId":"zE2ywtnOQDgagh3OYufB8J5FcMjAdqSGitdsyboyWHY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Clinical Mental Health Counseling","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c3be49f0-e494-4bb3-9054-dcb2b0f6d609\"}"},{"__ref":"DeepDives:{\"uuid\":\"a
