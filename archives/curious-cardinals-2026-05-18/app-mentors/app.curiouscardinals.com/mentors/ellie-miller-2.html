xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"54aeb646-ce94-4121-b44b-8e27aab7c63f\"}":{"__typename":"DeepDives","uuid":"54aeb646-ce94-4121-b44b-8e27aab7c63f","content":"\u003cp\u003eBranch out! It is easy in middle and high school to want to fit the mold. Make friends with people as different than you as possible. I definitely fell victim to trying way too hard to fit in. I would tell myself, explore what you are interested in. Being smart is cool :) It is a hard thing to wrap your head around, but once you do, life gets so much more fun. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3e28afae-0596-4429-82d7-1f16eef6486b\"}":{"__typename":"DeepDives","uuid":"3e28afae-0596-4429-82d7-1f16eef6486b","content":"\u003cp\u003eRecently, I have been in a huge hobby phase! I started boxing a few times a week, which I have found extremely cathartic and a killer workout. Since my high school pottery class, I have been dying to get back into it. This summer, I joined a pottery studio in St. Louis, where I do lots of hand-building and some throwing. When I am walking around campus or driving, you will be sure to find me listening to a podcast. My favorites are \u003cem\u003eFreakonomics, Revisionist History, and You're Wrong About. \u003c/em\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"ae3cf6da-a006-4a94-a11d-f62cc5bbb40e\"}":{"__typename":"DeepDives","uuid":"ae3cf6da-a006-4a94-a11d-f62cc5bbb40e","content":"\u003cp\u003eAs I mentioned in my bio, I have been passionate about teaching since high school, and I have continued teaching in college as a teaching assistant. As much as I love this role, I missed the one-on-one mentorship with younger students. Mentorship is inherently different than teaching. Mentorship is truly getting to know a student and customizing your lessons. Curious Cardinals is an amazing opportunity for students to pursue their interests in a way that isn't possible in a classroom setting. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"91702f5a-2ad8-400c-b170-f3d738a02ba8\"}":{"__typename":"DeepDives","uuid":"91702f5a-2ad8-400c-b170-f3d738a02ba8","content":"\u003cp\u003eI arrived at college with absolutely no clue what to major in. I found passion in all of my classes and could not fathom limiting my studies. Once I took my first economics course, ..... I hated it. Luckily, I gave it another shot with a different professor. Everything started to click for me. I found immense satisfaction in understanding how prices are set and how firms differentiate products. Economics allows me to use my high school love of math and finally give my father a break from the endless questions I peppered him with growing up. Supply chain caught my eye once I was in the business school. I realized optimization and data courses could allow me to find the perfect amount of product or the perfect price for items - questions I never knew could be so easily answered.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"53bed011-e9b2-40d2-aac4-9b4dd275aa59\"}":{"__typename":"School","uuid":"53bed011-e9b2-40d2-aac4-9b4dd275aa59","name":"Hopkins School","city":"New Haven","type":"HIGH","state":"Connecticut","country":"United States","zip":"06515"},"Education:{\"uuid\":\"d0ca72f5-8788-4369-86b6-d27addc16ff5\"}":{"__typename":"Education","uuid":"d0ca72f5-8788-4369-86b6-d27addc16ff5","school":{"__ref":"School:{\"uuid\":\"53bed011-e9b2-40d2-aac4-9b4dd275aa59\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"4e4ff399-1146-47ed-8a80-b9cdb8d76e4d\"}":{"__typename":"Education","uuid":"4e4ff399-1146-47ed-8a80-b9cdb8d76e4d","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics \u0026 Supply Chain","degree":null},"MentorPublicProfile:{\"uuid\":\"34b76516-101b-443a-b9d9-eaeb9d057d2b\"}":{"__typename":"MentorPublicProfile","uuid":"34b76516-101b-443a-b9d9-eaeb9d057d2b","displayName":"Ellie M.","slug":"ellie-miller-2","biography":"\u003cp\u003eHi all! My name is Ellie, and I am a senior at WashU in St. Louis. I am excited to pursue your student's interests and help them develop a passion!\u003cbr\u003e\u003cbr\u003eAt WashU, I am in Olin Business School with majors in Economics \u0026amp; Strategy and Supply Chain, Operations, and Technology. Although I came to WashU without knowing what I would study, I have found my major to be the perfect combination of math and theory. Economics has allowed me to explore how the world works, developing my passion for Game Theory. Supply Chain has given me the skills to work with datasets and satisfied my lifelong obsession with efficiency. On campus, I have explored my interests in global health as a grant writer for GlobeMed WashU. I spend lots of time outdoors while on Club Field Hockey.\u003cbr\u003e\u003cbr\u003eAfter my sophomore year, I learned all about aerospace manufacturing and supply chain at Boeing. I just completed an awesome summer in chicago at Bain \u0026amp; Company, a consulting firm. I am excited to give students a sneak peek into college-level business through Curious Cardinals. I have experience leading case competitions as explorations of different companies and teaching niche economics that interests students. \u003cbr\u003e\u003cbr\u003eThroughout high school, I was committed to teaching. I taught preschool at The Children's School in New Haven for two summers. I also worked with children ages 5 to 13 through multiple tutoring programs at my high school. In college, I have continued this passion as a teaching assistant. Last spring, I led a weekly subsection and review session for our Introduction to Business class focused on microeconomics, organizational behavior, and firm strategy. This semester, I am a teaching assistant for intermediate microeconomics. \u003cbr\u003e\u003cbr\u003eI am ready to meet students where they are at and grow together, pursuing whatever sparks their interest.\u003c/p\u003e","teachingVideoPlaybackId":"flpTgKZnDoFaVPRm7YaNaG9bN8dw4tGlz3AUUqj2m88","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics \u0026 Supply Chain","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"54aeb646-ce94-4121-b44b-8e27aab7c63f\"}"},{"__
