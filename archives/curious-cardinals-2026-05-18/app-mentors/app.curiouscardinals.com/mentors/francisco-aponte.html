xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c3d81380-15b2-4d79-90c0-5531f80778da\"}":{"__typename":"Favorites","uuid":"c3d81380-15b2-4d79-90c0-5531f80778da","photoUrl":"https://ucarecdn.com/10a6a7bf-9f0b-45d6-96ba-42c395a646a1/","title":"San Francisco 49ers","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"29b4d39a-00c9-4bd9-9f3c-8caa8bf761c5\"}":{"__typename":"Favorites","uuid":"29b4d39a-00c9-4bd9-9f3c-8caa8bf761c5","photoUrl":"https://ucarecdn.com/76b30275-c588-44ff-8ade-492fd92f610d/","title":"The Alchemist - Pablo Coehlo","type":"BOOK"},"Favorites:{\"uuid\":\"243f8422-8a70-4fe4-9a4d-6f471a086e73\"}":{"__typename":"Favorites","uuid":"243f8422-8a70-4fe4-9a4d-6f471a086e73","photoUrl":"https://ucarecdn.com/34bd9cb0-9c81-4492-955f-cfc643802722/","title":"Hamilton","type":"PLAY"},"CausesSupported:{\"uuid\":\"dd965e7e-9bdc-4411-a30b-1ae1e1df51de\"}":{"__typename":"CausesSupported","uuid":"dd965e7e-9bdc-4411-a30b-1ae1e1df51de","name":"Together by Pink","description":"\u003cp\u003eLed a team initiative to raise awareness and over $18,500 for Susan G. Komen.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/9a1f78e1-225f-48a8-b5d8-1b046563f574/"},"CausesSupported:{\"uuid\":\"3fc878d0-1534-4e0a-8bc8-7f468d2607d0\"}":{"__typename":"CausesSupported","uuid":"3fc878d0-1534-4e0a-8bc8-7f468d2607d0","name":"Scuba Dogs Society","description":"\u003cp\u003eMicroplastic research project utilized for pollution-reducing initiatives\u003c/p\u003e","photoUrl":"https://ucarecdn.com/7dbdb1fb-1f42-4734-8cec-229ebc322094/"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"c67a36af-8446-4aad-825d-fda148600626\"}":{"__typename":"DeepDives","uuid":"c67a36af-8446-4aad-825d-fda148600626","content":"\u003cp\u003eAs a Puerto Rican, my heritage has shaped my  appreciation for education and my approach to teaching. Growing up, I’ve been fortunate to receive a fantastic education, but I've also seen firsthand how many students don’t have access to the same opportunities due to government mismanagement and a struggling public school system. This reality has made me passionate about helping others learn and grow.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love teaching because I’ve seen how education can change lives. Through a scholarship preparation program, I tutored in, I spent weekends teaching younger students in Mathematics, English, and Spanish. Seeing them gain confidence and succeed in subjects they once struggled with is incredibly rewarding and solidified my belief that every student deserves patience, encouragement, and a teaching style that adapts to their needs.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy goal as a tutor is to make learning engaging and approachable. I intend to bring enthusiasm to every session, focusing on helping students build confidence in their abilities while making challenging concepts easier to understand.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8de1a496-f0b4-4459-bfe7-062bfb59fece\"}":{"__typename":"DeepDives","uuid":"8de1a496-f0b4-4459-bfe7-062bfb59fece","content":"\u003cp\u003eOne of my most exciting passion projects was my science fair experiment on harnessing compost heat to warm water in an efficient and eco-friendly way. The idea came to me during a power outage in Puerto Rico—something all too common on the island. I was about to take a cold shower when I stumbled upon a video explaining how composting is an exothermic reaction, meaning it naturally generates heat. That sparked a thought: Could I use compost to warm water sustainably?\u003c/p\u003e\u003cp\u003eI designed an experiment to test this idea, constructing an insulated compost system filled with a carefully balanced mix of organic materials like manure, fruit peels, and grass clippings. Over the course of several days, I monitored the temperature, aerated the compost, and recorded the heat transfer to a water container placed inside. The results were better than I had imagined—the water temperature rose from 77°F to 109.4°F, proving that compost could be used as a renewable heat source.\u003c/p\u003e\u003cp\u003eThis project wasn’t just about science; it was about problem-solving and innovation. It showed me that solutions to real-world issues can come from unexpected places—even a pile of decomposing food scraps. More importantly, it reinforced my passion for engineering and sustainability, pushing me to think critically about how we can repurpose natural processes to improve people’s lives.\u003c/p\u003e\u003cp\u003eThis experience taught me that great ideas often come from simple observations, and with curiosity and persistence, they can turn into something meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e2f298d2-6b32-414e-bb49-8ee44305b5f4\"}":{"__typename":"DeepDives","uuid":"e2f298d2-6b32-414e-bb49-8ee44305b5f4","content":"\u003cp\u003eThroughout high school, I dedicated my summers to a mix of academic enrichment, leadership development, and hands-on work experience. In the summer of 2023, I attended Summer@Brown Introduction to Engineering and Design. I explored various engineering disciplines and engaged in hands-on projects, including inventing, drafting, rendering in 3D, and pitching an engineering idea. This program deepened my understanding of problem-solving and design thinking.\u003c/p\u003e\u003cp\u003eIn the summer of 2022, I participated in the NSLC Business \u0026amp; Entrepreneurship program at Duke University, where I developed leadership skills through stakeholder analysis, business pitching, and marketing strategy simulations. This experience broadened my perspective on business management and entrepreneurship.\u003c/p\u003e\u003cp\u003eThat same summer, I also worked a full time job as a server in Qdoba. This job gave me firsthand experience in customer service, supply chain management, and the challenges of running a retail business. I learned the importance of efficiency, adaptability, and identifying operational weaknesses to improve workflow.\u003c/p\u003e\u003cp\u003eEach summer, I aimed to grow academically, professionally, and personally—whether by exploring my passion for engineering, refining my leadership and business insight, or gaining real-world work experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"99c4ff73-a6e5-40cb-b7da-cc1e3b87b6e7\"}":{"__typename":"DeepDives","uuid":"99c4ff73-a6e5-40cb-b7da-cc1e3b87b6e7","content":"\u003cp\u003eIn my spare time, I love surrounding myself with people. Above all, I enjoy spending time with my friends—whether we’re hanging out, playing games, or just talking for hours, that connection is what I value the most.\u003c/p\u003e\u003cp\u003eI also have a deep appreciation for music. I love discovering new songs, diving into the history of musicians, and exploring different genres. I play the guitar, which allows me to engage with music in a more personal way. Whether I’m learning a new song or just strumming for fun, music is a huge part of how I unwind.\u003c/p\u003e\u003cp\u003eWhen I'm not doing either of those things, you’ll probably find me watching football (both as a fan and a former player), playing video games, or heading to the beach to enjoy the sun and the ocean.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"59ccbe48-a6f7-4b7a-9f49-6a56f721571f\"}":{"__typename":"School","uuid":"59ccbe48-a6f7-4b7a-9f49-6a56f721571f","name":"Colegio San Ignacio de Loyola","city":"San Juan","type":"HIGH","state":"San Juan","country":"Puerto Rico","zip":"00927"},"Education:{\"uuid\":\"0be52c04-b516-40d3-b795-b94e95618c78\"}":{"__typename":"Education","uuid":"0be52c04-b516-40d3-b795-b94e95618c78","school":{"__ref":"School:{\"uuid\":\"59ccbe48-a6f7-4b7a-9f49-6a56f721571f\"}"},"startYear":"2018","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"59c0ace8-4781-4ef7-a4cb-7ff43b45f17d\"}":{"__typename":"Education","uuid":"59c0ace8-4781-4ef7-a4cb-7ff43b45f17d","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Industrial Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"9103fdb0-4fdb-4462-a5f7-925a9abe1eec\"}":{"__typename":"MentorPublicProfile","uuid":"9103fdb0-4fdb-4462-a5f7-925a9abe1eec","displayName":"Francisco A.","slug":"francisco-aponte","biography":"\u003cp\u003eHey there! I’m Francisco!\u003cbr\u003e\u003cbr\u003eI am the kind of person who never stops asking questions. If there’s a problem, I have to find a solution. Whether it’s fixing my grandfather’s coffee maker, debating how to improve traffic flow in Puerto Rico, or figuring out a better way to explain a tricky math concept, I love breaking things down and building them back up—stronger, clearer, and better than before. That’s why tutoring feels so natural to me. It’s not just about helping students understand a subject; it’s about showing them how capable they are of figuring things out. Education has always been a huge part of my life, but I know firsthand that not everyone has access to the same opportunities. In Puerto Rico, public schools struggle with underfunding, and I’ve seen how that impacts students' confidence. That’s why I’ve spent years tutoring in community programs, helping students build the skills and mindset they need to succeed. I’ve worked with kids in math, English, and Spanish, mentored my own high school peers, and even taken leadership roles like Vice President of the National Honor Society to create more academic support systems. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eNo matter who I’m working with, my goal is always the same: make learning feel less like a chore and more like a challenge they can overcome. But academics are just one piece of the puzzle. I believe confidence comes from trying new things, failing sometimes, and realizing that failure isn’t the end—it’s part of the process. In sixth grade, I convinced my school to stage its first-ever play, a production of Hamilton and played the lead role. It was a logistical nightmare—a tiny budget, zero experience, and only one performance for parents because we couldn’t afford microphones. But somehow, we pulled it off, and I saw firsthand how much people can accomplish when they work together and believe in themselves when trying new things. I believe mentoring mirrors those same principles. I also know what it’s like to hit roadblocks. I spent a whole season training with my football team, only to get injured right before the championship game. The doctor strongly advised against me playing. Instead of dwelling on what I lost, I found another way to contribute—motivating my teammates, and making sure everyone was at their best. When we won, I realized something important: success isn’t just about personal achievement. It’s about the journey, the effort, and the people around you. That’s the perspective I bring to mentoring. Struggling with a subject doesn’t mean you’re bad at it—it just means you haven’t found the right approach yet. If you’re looking for help with STEM, writing, or study strategies, I’d love to work with you. Let’s figure things out together, tackle challenges head-on, and make learning something to look forward to.\u003c/p\u003e","teachingVideoPlaybackId":"7kLyf5ze00cf6waJWprAnJSj33U1rSSCNMHJK8X01jUYM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c3d81380-15b2-4d79-90c0-5531f80778da\"}"},{"__ref":"Favorites:{\"uuid\":\"29b4d39a-00c9-4bd9-9f3c-8caa8bf761c5\"}"},{"__ref":"Favorites:{\"uuid\":\"243f8422-8a70-4fe4-9a4d-6f471a086e73\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"dd965e7e-9bdc-4411-a30b-1ae1e1df51de\"}"},{"__ref":"CausesSupported:{\"uuid\":\"3fc878d0-1534-4e0a-8bc8-7f468d2607d0\"}"}],"major":"Industrial Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c67a36af-8446-4aad-825d-fda148600626\"}"},{"__ref":"DeepDives:{\"uuid\":\"8de1a496-f0b4-4459-bfe7-062bfb59fece\"}"},{"__ref":"DeepDives:{\"uuid\":\"e2f298d2-6b32-414e-bb49-8ee44305b5f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"99c4ff73-a6e5-40cb-b7da-cc1e3b87b6e7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4abeaf61-b2d2-407b-a1ab-eba4159b13f2/-/preview/-/format/jpg/","https://ucarecdn.com/39f522a9-09d2-40d7-89f0-0e6f74d4b934/-/preview/-/format/jpg/","https://ucarec
