xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d6184800-3fc9-44d0-874f-4fc7c6ca9117\"}":{"__typename":"DeepDives","uuid":"d6184800-3fc9-44d0-874f-4fc7c6ca9117","content":"\u003cp\u003eAdvice I would give to my high school self, specifically, is that comparison is truly the thief of joy. I was constantly feeling behind my peers and convinced I wasn't doing enough, which caused me to burnout my senior year by being involved in things I wasn't truly passionate about. If I had slowed down and prioritized my mental health, I would've saved myself a significant amount of stress. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"38b4cfc3-acb4-4041-9b5d-068032c6440c\"}":{"__typename":"DeepDives","uuid":"38b4cfc3-acb4-4041-9b5d-068032c6440c","content":"\u003cp\u003eMentorship matters to me because the mentors that I have had in my life shaped me into the person I am today. I believe that people are always learning from one another. I want to share my experiences with others in hopes that they will assist in teaching them life skills. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b15c07be-bb4f-4f9c-b877-926d95b7bb88\"}":{"__typename":"DeepDives","uuid":"b15c07be-bb4f-4f9c-b877-926d95b7bb88","content":"\u003cp\u003eI chose to major in Chemistry because I am incredibly fascinated about how the world works at a molecular level. I have always had a keen interest for science, even before I started school. I would create my own experiments at home when I was disappointed about the lack of them in class, started a slime business, and watch national geographic documentaries about the newest discoveries. I find joy in solving stoichiometric equations and analyzing kinetic reaction mechanisms, and I can imagine myself continuing to find this joy in my career. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6795c377-775d-4e38-87b0-7fe0b7bfe180\"}":{"__typename":"DeepDives","uuid":"6795c377-775d-4e38-87b0-7fe0b7bfe180","content":"\u003cp\u003eIn my spare time, I love to do anything that involves music. I am involved with a cappella at Brown, specifically the Jabberwocks, and other musical theatre groups. Although I am not very good, I play guitar and piano, and have just begun to learn how to arrange music for vocals! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"fd80a9f3-03a5-4bf7-84fa-6ea1cfb94093\"}":{"__typename":"School","uuid":"fd80a9f3-03a5-4bf7-84fa-6ea1cfb94093","name":"Chelmsford High School","city":"Chelmsford","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01863"},"Education:{\"uuid\":\"dfecbcf3-32a0-442b-8f44-8733370ad8ed\"}":{"__typename":"Education","uuid":"dfecbcf3-32a0-442b-8f44-8733370ad8ed","school":{"__ref":"School:{\"uuid\":\"fd80a9f3-03a5-4bf7-84fa-6ea1cfb94093\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"860e89f6-3fc0-457e-97b7-cfbfb59b5219\"}":{"__typename":"Education","uuid":"860e89f6-3fc0-457e-97b7-cfbfb59b5219","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"d0b2534e-6c4a-48e7-b442-dbd8c4253358\"}":{"__typename":"MentorPublicProfile","uuid":"d0b2534e-6c4a-48e7-b442-dbd8c4253358","displayName":"Jocelyn P.","slug":"jocelyn-pica","biography":"\u003cp\u003eHi guys! My name is Jocelyn Pica and I am currently a freshman at Brown University. I plan to study Chemistry on the Pre-Med track, but love exploring other subjects such as music, economics, and journalism.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have been the famous “Woman in STEM” since the young age of five, constantly annoying my mom with my experiments in the kitchen. Science has always captured my interest the most in comparison to other school subjects and I am excited to pursue it at a higher level in the future. Sharing my passion for not just science, but also lifelong learning is something I have and want to continue doing.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I am also heavily involved in the performing arts, specifically music and musical theatre. In high school, my main extracurricular activities were my school’s theatre guild and treble-voiced a cappella group. Both were truly the highlight of my experience and through them, I developed critical leadership and teamwork skills that I hope to share with my mentees. Through these activities, I also gained accolades such as acting, solo, and choreography awards. I even got to perform at the International Championship of High School A Cappella Finals in New York! (Think of Pitch Perfect, it’s the same competition depicted in the movie but for high school) At Brown, the essence of the Open Curriculum allows me to continue pursuing music academically and for enjoyment. I have taken music classes, performed in student-run musicals, and joined the Jabberwocks, an all-voiced a cappella group on campus.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I try to engage in my hobbies as much as possible, as they allow me to unwind, think creatively, and continue learning about myself and the world in new ways. I greatly enjoy reading, scrapbooking, and film photography. The three of these combined have sparked my desire to travel the world during my undergraduate and post-graduate years. There is so much of the world we don’t get to see!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to bring my curiosity, creativity, and love for learning to Curious Cardinals while helping my mentees grow into confident, inquisitive learners that will change the future.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"ubzfoeriH01Wq5p2rsgWyxVNehitomO4jFIXpCzUB02hQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d6184800-3fc9-44d0-874f-4fc7c6ca9117\"}"},{"__ref":"DeepDives:{\"uuid\":\"38b4cfc3-acb4-4041-9b5d-068032c6440c\"}"},{"__ref":"DeepDives:{\"uuid\":\"b15c07be-bb4f-4f9c-b877-926d95b7bb88\"}"},{"__ref":"DeepDives:{\"uuid\":\"6795c377-775d-4e38-87b0-7fe0b7bfe180\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/adc1f324-61ce-470a-81b1-66699c46
