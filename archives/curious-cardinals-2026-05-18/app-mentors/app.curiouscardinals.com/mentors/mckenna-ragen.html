xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"326f4d41-1146-4ebd-bca4-91a9b6836469\"}":{"__typename":"Favorites","uuid":"326f4d41-1146-4ebd-bca4-91a9b6836469","photoUrl":"https://ucarecdn.com/4db03beb-355d-48f2-8a99-2c12cfc7aacd/","title":"Hozier","type":"ARTIST"},"Favorites:{\"uuid\":\"0c5a08fd-f34d-497c-a049-f5af432fa7b7\"}":{"__typename":"Favorites","uuid":"0c5a08fd-f34d-497c-a049-f5af432fa7b7","photoUrl":"https://ucarecdn.com/8c924f59-28ba-474b-80d8-afff6e9f1f3b/","title":"Seattle","type":"CITY"},"Favorites:{\"uuid\":\"fb2ce904-3e49-4cd6-8b1e-11bbe6e4357f\"}":{"__typename":"Favorites","uuid":"fb2ce904-3e49-4cd6-8b1e-11bbe6e4357f","photoUrl":"https://ucarecdn.com/06fadf8a-8782-46ee-af40-51516f3af215/","title":"Sounders","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"aa75bd8f-2eac-4843-ae44-e2746f4db3aa\"}":{"__typename":"DeepDives","uuid":"aa75bd8f-2eac-4843-ae44-e2746f4db3aa","content":"\u003cp\u003eFind a sustainable balance between hard work and self-care. That will sustain you in your work far beyond school settings. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"3ac8607a-e5ab-4b4b-a8e8-8479ae61f75a\"}":{"__typename":"DeepDives","uuid":"3ac8607a-e5ab-4b4b-a8e8-8479ae61f75a","content":"\u003cp\u003eMy parents are my greatest role models because they are both the most hardworking people I know while being such genuinely kind and thoughtful people. They walk the line of humility and accomplishment beautiful. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"518e6749-aa26-43e8-9824-e46a9f47b0ac\"}":{"__typename":"DeepDives","uuid":"518e6749-aa26-43e8-9824-e46a9f47b0ac","content":"\u003cp\u003eI am currently the photographer and videographer for the University of Michigan club pickleball team (in addition to being on it). It's been a great outlet for me to be creative amidst a busy academic schedule.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5597304b-b745-4a27-93be-9c12945bcf18\"}":{"__typename":"DeepDives","uuid":"5597304b-b745-4a27-93be-9c12945bcf18","content":"\u003cp\u003eCognitive Science is the 'interdisciplinary study of the mind'. I love that we were able to examine the human mind from different perspectives (neuroscience, linguistics, philosophy and psychology)!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"91b8fd28-0c0a-4a5a-b53c-ba56a585dd2f\"}":{"__typename":"School","uuid":"91b8fd28-0c0a-4a5a-b53c-ba56a585dd2f","name":"UPrep","city":"Seattle","type":"HIGH","state":"Washington","country":"United States","zip":"98115"},"Education:{\"uuid\":\"a2f0355f-f2f5-4453-8527-b29a0b7d4f2e\"}":{"__typename":"Education","uuid":"a2f0355f-f2f5-4453-8527-b29a0b7d4f2e","school":{"__ref":"School:{\"uuid\":\"91b8fd28-0c0a-4a5a-b53c-ba56a585dd2f\"}"},"startYear":"2016","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"c83073ed-806d-4630-80ba-8096a4df5c5c\"}":{"__typename":"Education","uuid":"c83073ed-806d-4630-80ba-8096a4df5c5c","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"80475042-59ad-4de8-bee9-9aecd66b4500\"}":{"__typename":"MentorPublicProfile","uuid":"80475042-59ad-4de8-bee9-9aecd66b4500","displayName":"McKenna R.","slug":"mckenna-ragen","biography":"\u003cp\u003eHello! My name is McKenna Ragen. I am 24 years old and am from Seattle, WA. I currently live in Ann Arbor as I am just starting my Masters in Social Work this fall at University of Michigan. I graduated from Yale in 2024 with a degree in Cognitive Science. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have always loved to learn and am passionate about making learning enjoyable and accessible. I know that learning looks different for every student, so I want to spend the first session with my students getting to know them and how they best learn. Then, we can create a plan that caters to their learning style for the following weeks! This is important to me because hopefully it can help inform students of how they can translate those strategies to their in school learning. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, I love hiking, soccer, pickleball, the outdoors, photograhy and videography. I spent the last year traveling throughout New Zealand, so I got to combine lots of passions while I worked on farms and backpacked for the year! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI became a tutor at Curious Cardinal because I am hoping to support students in passion projects, time management, and other more macro topics related to school. I am getting my Masters in Social Work because I am passionate about working with younger populations to support their mental health. This degree aknowledges the whole self and such a big part of ourselves while we grow up is in a classroom, so I am looking forward to learn with the students as we work on skills to support them in that setting and outside of the classroom as well. Whether it be creative topics like podcast making or video editing or organization skills like creating plans to be successful in classes, I can be helpful in a variety of areas! I am truly open to supporting students with whatever they foresee needing to support their schoolwork. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've had the privilege of working with a wide array of students in the past in education, extracurricular, athletic, and other settings! I ran a daycare and homeschooling program in Maui, I've taught Czech kids English in Prague, I've worked with kids with physical and mental disabilities teaching soccer and swimming, I have volunteered as a counselor at Camp Kesem - a summer camp for kids whose parents have been impacted by cancer, and have spent lots of time babysitting family and family friends. I've worked with kids from two years old to eighteen, and I would love to continue to work with students of different ages through Curious Cardinals. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am looking forward to tutoring and hope I can truly support students (and their families) with their goals! \u003c/p\u003e","teachingVideoPlaybackId":"400ZyA2RN5ZM00u00rHyUt126EcS01Sjqg7QSiLsPBy00CdE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"
