xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e2f3385a-ebf7-46e5-ab3c-1cab7d2b5187\"}":{"__typename":"Favorites","uuid":"e2f3385a-ebf7-46e5-ab3c-1cab7d2b5187","photoUrl":"https://ucarecdn.com/647746ed-c043-43c2-9410-52cbbc7808a3/","title":"The Dark Knight","type":"MOVIE"},"Favorites:{\"uuid\":\"5ad5ccc0-9729-4052-b6b0-cfd9c52ed4c8\"}":{"__typename":"Favorites","uuid":"5ad5ccc0-9729-4052-b6b0-cfd9c52ed4c8","photoUrl":"https://ucarecdn.com/267d5b67-6c32-4aba-9a8c-e02b984635a3/","title":"Brave New World","type":"BOOK"},"Favorites:{\"uuid\":\"a3a56a85-e716-482c-b82a-3f17b19ecb55\"}":{"__typename":"Favorites","uuid":"a3a56a85-e716-482c-b82a-3f17b19ecb55","photoUrl":"https://ucarecdn.com/f5a14650-8cf9-4a99-8a4e-1531f42feae1/","title":"Kyoto, Japan","type":"CITY"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"7e704e23-1309-436e-b8bf-2fc8e6100f6c\"}":{"__typename":"DeepDives","uuid":"7e704e23-1309-436e-b8bf-2fc8e6100f6c","content":"\u003cp\u003eTo run a research lab and contribute to the development of new treatments for age-related diseases.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"88d724a7-563e-410e-9136-7905430a9ee5\"}":{"__typename":"DeepDives","uuid":"88d724a7-563e-410e-9136-7905430a9ee5","content":"\u003cp\u003eParticipating in various career exploration and academic enrichment programs that solidified my interest in STEM.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"df03a68c-1e6b-43e6-9b81-d2b810442196\"}":{"__typename":"DeepDives","uuid":"df03a68c-1e6b-43e6-9b81-d2b810442196","content":"\u003cp\u003eWatching movies and musicals, being in the outdoors, and making coffee from freshly ground beans! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"651ca619-f8fe-4ade-8ffe-dc90684f07bb\"}":{"__typename":"DeepDives","uuid":"651ca619-f8fe-4ade-8ffe-dc90684f07bb","content":"\u003cp\u003eAlthough human anatomy and physiology are mostly observable to the naked eye (with the help of medical devices, in some cases), there are things happening within our bodies that we cannot see which enable our senses and ability to experience our day-to-day lives. The desire to know what happens within our bodies at the cellular and molecular level is what motivated me to pursue my undergraduate major.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"260a3ee8-6cc6-427e-84fb-6db57f3f2aad\"}":{"__typename":"School","uuid":"260a3ee8-6cc6-427e-84fb-6db57f3f2aad","name":"Arroyo High School","city":"San Lorenzo","type":"HIGH","state":"California","country":"United States","zip":"94580"},"Education:{\"uuid\":\"0c197436-707c-4c08-8ab3-b4769913394a\"}":{"__typename":"Education","uuid":"0c197436-707c-4c08-8ab3-b4769913394a","school":{"__ref":"School:{\"uuid\":\"260a3ee8-6cc6-427e-84fb-6db57f3f2aad\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"2ba3b3c7-5dfa-49b7-8841-77304f2b43d5\"}":{"__typename":"Education","uuid":"2ba3b3c7-5dfa-49b7-8841-77304f2b43d5","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Molecular, Cell, and Developmental Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"d0f97e74-5784-44f8-a5f1-c1880a1cef83\"}":{"__typename":"MentorPublicProfile","uuid":"d0f97e74-5784-44f8-a5f1-c1880a1cef83","displayName":"Vincent T.","slug":"vincent-tse","biography":"\u003cp\u003eHey there! My name is Vincent, and I’m a Neuroscience PhD candidate at Yale University. My research focuses on Alzheimer’s disease, where I use state-of-the-art neurotechnologies to identify early biomarkers and develop novel, targeted strategies to slow cognitive decline.\u003c/p\u003e\u003cp\u003eI’ve always been curious about the brain—about how its folds and grooves give rise to laughter, love, and the experiences that shape who we are. But just as importantly, I’ve wanted to understand how and why those experiences can slip out of reach as we age or face age-related disease. In pursuing these questions, I’ve had the opportunity to:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e-Lead an independent undergraduate research project that contributed to multiple publications in high-impact journals\u003c/p\u003e\u003cp\u003e-Secure a competitive scholarship to conduct summer research abroad\u0026nbsp;\u003c/p\u003e\u003cp\u003e-Receive a National Science Foundation research fellowship\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWith over 10 years of research experience, I’ve learned not only how to think critically about open scientific questions, but also how to navigate the often opaque path toward becoming a scientist. Along the way, I’ve mentored high school, undergraduate, postgraduate, and junior graduate students in applying to research programs, internships, and scholarships. I’m continually refining how I support my mentees by sharing the strategies, insights, and lessons I’ve learned firsthand.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re excited by STEM and can imagine yourself wearing a lab coat while working on meaningful, real-world problems, I’d be thrilled to help guide you. I specialize in helping students break into independent scientific projects—turning curiosity into a well-defined passion project—and in showing how to present that work in ways that clearly demonstrate readiness for advanced studies to colleges. Drawing on my prior experience as a college advisor for a \u003cem\u003eU.S. News \u0026amp; World Report\u003c/em\u003e company, I’m confident in my abilities to help you transform broad interests into standout projects worthy of recognition. In addition to developing a passion project, I am a seasoned veteran when it comes to college applications and can help you write successful personal statements and essays that can help you shoot for your top choices.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the lab, I’m always happy to chat about the latest gadgets I’m tinkering with in pursuit of the perfect espresso—or to offer my unsolicited critiques of the latest blockbuster movies. If you share similar interests, please don’t hesitate to reach out!\u003c/p\u003e","teachingVideoPlaybackId":"84voitUq27C4eMpdR34J02N102Tf6cLJHla9Yb02BHc638","teachingVideoDescription":null,"greatestAchievement":"\u0
