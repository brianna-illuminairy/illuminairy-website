xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d17711d0-bd12-4732-b69a-1493233549e3\"}":{"__typename":"DeepDives","uuid":"d17711d0-bd12-4732-b69a-1493233549e3","content":"\u003cp\u003eExplore as much as I possibly can and cast a wide net. I became interested in current events \u0026amp; politics through high school debate freshman year, but I wish that I had taken more time to learn about and become knowledgable on a wider range of subjects. I was thankfully able to do this in college due to Brown's Open Curriculum, but it would have been a good opportunity to do this earlier on with more flexibility.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"668d8128-0ad6-4808-b6e2-e97097d7ed01\"}":{"__typename":"DeepDives","uuid":"668d8128-0ad6-4808-b6e2-e97097d7ed01","content":"\u003cp\u003eI love to travel, cook, hunt around for new cafes to try, read the news, and go hiking!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f0315a41-1be1-44c2-9578-296b2ee5f029\"}":{"__typename":"DeepDives","uuid":"f0315a41-1be1-44c2-9578-296b2ee5f029","content":"\u003cp\u003eI have always been interested in global affairs and political science, which led me to concentrate in International \u0026amp; Public Affairs. Here, I am able to keep up with current events and analyze their impacts in relation to the economy, government, historical trends, and more. My additional major in Computer Science has enabled me to ground these understandings in a more technical fashion as well as learn more about the tech industry at large. From there, I've had a variety of experience from UI/UX design to coding to being a CS teaching assistant.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"c8d5d7bc-bce6-4d3c-939e-71923bf30c45\"}":{"__typename":"DeepDives","uuid":"c8d5d7bc-bce6-4d3c-939e-71923bf30c45","content":"\u003cp\u003eI have a recurring dream where I'm a character in an 8-bit video game! I have no idea why it keeps happening. It's interesting (and a bit strange) to dream in 2D, but it's also fun to be able to play video games during my sleep in a way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"2c53a311-5cff-467c-ab1d-f4d5a458dd6f\"}":{"__typename":"School","uuid":"2c53a311-5cff-467c-ab1d-f4d5a458dd6f","name":"Crystal Springs Uplands School - Upper School","city":"Hillsborough","type":"HIGH","state":"California","country":"United States","zip":"94010"},"Education:{\"uuid\":\"3e680af0-aa4c-416a-a137-8ceb78c66886\"}":{"__typename":"Education","uuid":"3e680af0-aa4c-416a-a137-8ceb78c66886","school":{"__ref":"School:{\"uuid\":\"2c53a311-5cff-467c-ab1d-f4d5a458dd6f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"22a5261d-761f-4fdf-8e16-e1eda09f09eb\"}":{"__typename":"Education","uuid":"22a5261d-761f-4fdf-8e16-e1eda09f09eb","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science and International Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"10b75ede-6140-474a-bea5-3fb55f3dbb09\"}":{"__typename":"MentorPublicProfile","uuid":"10b75ede-6140-474a-bea5-3fb55f3dbb09","displayName":"Michael M.","slug":"michael-ma","biography":"\u003cp\u003eHi there! My name is Michael, and I am an incoming Senior at Brown University studying Computer Science and International \u0026amp; Public Affairs. In my free time, I love to travel, read the news \u0026amp; stay updated on current events, try new restaurants with friends, and explore new topics to learn about!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have a variety of experiences that I would love to share, ranging from college to high school!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Brown, I am a TA for my school's Computer Science department, help run the UI/UX design team for Brown's annual hackathon, and run events for the Brown Entrepreneurship Program. In high school, I led and competed for my school's debate team at the national level, was President of my Model UN team, volunteered in non-profit organizations, and created choreography for my honors dance team! At each of these organizations, I grew from mentors that were there to guide my learning in multifaceted, nuanced ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm super excited to now be that mentor for a new generation of students -- helping to not only develop academic success, but also foster an environment of curiosity, creativity, and creation. I believe that any student has the potential to achieve their goals \u0026amp; more, and I'm passionate about helping to unlock those experiences with positive reinforcement, critical thinking skills, and nuanced guidance.\u003c/p\u003e","teachingVideoPlaybackId":"l2cRIhXr3kSbKcBtTEBGxq8ZVNba59NCq029qtrtFKys","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science and International Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d17711d0-bd12-4732-b69a-1493233549e3\"}"},{"__ref":"DeepDives:{\"uuid\":\"668d8128-0ad6-4808-b6e2-e97097d7ed01\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0315a41-1be1-44c2-9578-296b2ee5f029\"}"},{"__ref":"DeepDives:{\"uuid\":\"c8d5d7bc-bce6-4d3c-939e-71923bf30c45\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/404fc2b4-81b8-4242-93ab-7b1f072b532a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3e680af0-aa4c-416a-a137-8ceb78c66886\"}"},{"__ref":"Education:{\"uuid\":\"22a5261d-761f-4fdf-8e16-e1eda09f09eb\"}"}],"hiredAt":"2024-07-12T00:31:17.479Z","topics":["Algebra I","Algebra II","Geometry","Pre-Algebra","Writing","Academic Coaching","College Essay Writing","Reading","Creative Writing","Visual Arts / Graphic Design","Business / Entrepreneurship","Finance / Investing","Web Design","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/c278d819-50e0-435a-a1b0-1b3a8793462f/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"michael-ma\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"10b75ede-6140-474a-bea5-3fb55f3dbb09\"}"}}},"_sent
