xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"44b953bd-4ca6-474b-8e95-230cbf89bc54\"}":{"__typename":"Favorites","uuid":"44b953bd-4ca6-474b-8e95-230cbf89bc54","photoUrl":"https://ucarecdn.com/062fb706-9c62-4da2-87b3-935e74b5ec56/","title":"Lupita Nyong'o","type":"ACTOR"},"Favorites:{\"uuid\":\"7d8aead7-a028-4073-9715-3823c77bb6f1\"}":{"__typename":"Favorites","uuid":"7d8aead7-a028-4073-9715-3823c77bb6f1","photoUrl":"https://ucarecdn.com/b9ff54dc-c2c7-49aa-a2c4-f82bd6ec2445/","title":"Tennis","type":"SPORT"},"Favorites:{\"uuid\":\"858ef26e-f00c-435a-a32d-bb1fa36569e9\"}":{"__typename":"Favorites","uuid":"858ef26e-f00c-435a-a32d-bb1fa36569e9","photoUrl":"https://ucarecdn.com/c4a7b07d-50d0-4756-a45f-8d7ae47bb742/","title":"Clue","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4748860c-eb65-48d2-9c8a-c89e8a86a379\"}":{"__typename":"DeepDives","uuid":"4748860c-eb65-48d2-9c8a-c89e8a86a379","content":"\u003cp\u003eIt is ALWAYS okay to ask for help when you need it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"db2ac2c2-9ea9-4feb-b967-0b6080395d46\"}":{"__typename":"DeepDives","uuid":"db2ac2c2-9ea9-4feb-b967-0b6080395d46","content":"\u003cp\u003eI am incredibly inspired by the students I mentor, and learn a great deal from them! When I was in middle school and high school, I craved a relationship with a mentor that I could go to for advice, guidance and encouragement. It is so rewarding for me to be able to provide that for students, and to know that I am impacting their lives and their futures as they grow into adults.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"fa0ee74c-b633-41e3-9336-27f5f3383b45\"}":{"__typename":"DeepDives","uuid":"fa0ee74c-b633-41e3-9336-27f5f3383b45","content":"\u003cp\u003eBoth in my mentorship and artistic work, I am most motivated by inspiring people to experience the world in surprising new ways-- to change perspectives, build confidence, and spark curiosity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"21cd8953-852a-430c-bf62-da1e4631deec\"}":{"__typename":"DeepDives","uuid":"21cd8953-852a-430c-bf62-da1e4631deec","content":"\u003cp\u003eI am a trained puppeteer!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"377d7653-f87b-4f5e-bd37-781b2d1c44cd\"}":{"__typename":"School","uuid":"377d7653-f87b-4f5e-bd37-781b2d1c44cd","name":"Berkeley High School","city":"Berkeley","type":"HIGH","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"de123001-438d-415b-8ada-c5f27a90b666\"}":{"__typename":"Education","uuid":"de123001-438d-415b-8ada-c5f27a90b666","school":{"__ref":"School:{\"uuid\":\"377d7653-f87b-4f5e-bd37-781b2d1c44cd\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"6e7e3b3a-358e-4814-acad-32414814ba05\"}":{"__typename":"Education","uuid":"6e7e3b3a-358e-4814-acad-32414814ba05","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"theater with a cognitive science minor","degree":null},"MentorPublicProfile:{\"uuid\":\"fbd38f57-1993-4944-9c58-d608e1b4565f\"}":{"__typename":"MentorPublicProfile","uuid":"fbd38f57-1993-4944-9c58-d608e1b4565f","displayName":"Claire R.","slug":"claire-houghton","biography":"\u003cp\u003eHi! My name is Claire, and I am a teacher, mentor, and theater director from Berkeley, California. I graduated cum laude from UCLA in 2024 with a major in theater and a minor in cognitive science, and since then have taught high school and middle school while pursuing a career in theater. Now based in New York, my work has been seen in San Francisco, Los Angeles, and Edinburgh. I have always been drawn to the collective spirit of projects and the collaboration involved in working toward a shared goal. Creativity and exploration serves as the heart of everything I do, whether in academic work or a passion project.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am a skilled writer, especially passionate about creative writing and narrative essays. I love helping students with personal statements, academic papers, and storytelling. I spend my free time writing short stories, poetry, and personal essays, and much of my work involves crafting grant applications and project proposals. I also have a strong interest in science and social science, scoring highly on all AP science classes in high school and continuing to study chemistry, biology, cognitive science and neuroscience at UCLA. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI explored broadly across the arts and sciences before finding my passion, and I am incredibly grateful for my liberal arts education. I have made close friendships with young professionals in diverse fields, from law to engineering to the fine arts. I believe that every student should experiment in a wide scope of subject areas and interests to find what sparks their curiosity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI care deeply about each student I work with, excited to learn about their goals and interests. My mentorship always starts from a place of curiosity, kindness, and respect. I meet each student where they are, working with them to build confidence and craft a roadmap to meet their goals. I find this work incredibly rewarding, and love to keep in touch with all my students, becoming invested in their growth and development as learners and people.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eYou can often find me listening to an audio book with a cat on my lap, swimming in the ocean, or singing karaoke with my friends. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can't wait to meet you and get started!\u003c/p\u003e","teachingVideoPlaybackId":"YwuLJk3ZzUFftizu6ZnqsTZ9sptSI2j024Fi01x00RVfvw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"44b953bd-4ca6-474b-8e95-230cbf89bc54\"}"},{"__ref":"Favorites:{\"uuid\":\"7d8aead7-a028-4073-9715-3823c77bb6f1\"}"},{"__ref":"Favorites:{\"uuid\":\"858ef26e-f00c-435a-a32d-bb1fa36569e9\"}"}],"causesSupported":[],"major":"theater with a cognitive science minor","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4748860c-eb65-48d2-9c8a-c89e8a86a379\"}"},{"__ref":"DeepDives:{\"uuid\":\"db2ac2c2-9ea9-4feb-b967-0b6080395d46\"}"},{"__ref":"DeepDives:{\"uuid\":\"fa0ee74c-b633
