xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3142095f-edc5-4162-817b-d754a01ffb39\"}":{"__typename":"DeepDives","uuid":"3142095f-edc5-4162-817b-d754a01ffb39","content":"\u003cp\u003eOne passion project I’m currently working on is my first album as a singer-songwriter. Music has always been a meaningful way for me to express myself and tell stories, and this project has allowed me to explore creativity while building confidence and skill.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"137cbada-8761-41bf-8f74-a798acb5bb46\"}":{"__typename":"DeepDives","uuid":"137cbada-8761-41bf-8f74-a798acb5bb46","content":"\u003cp\u003eI chose to major in Ethics, Politics, and Economics because I love learning across disciplines and thinking critically about the world. The interdisciplinary nature of the major allows me to explore complex social, political, and economic issues from multiple perspectives, which fits not only my academic interests but also my broader curiosity and passion for diverse ways of learning. It challenges me to connect ideas across fields and better understand the ethical and societal implications of real-world problems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"f380911a-fe16-47cc-83d3-1414f2f175bc\"}":{"__typename":"DeepDives","uuid":"f380911a-fe16-47cc-83d3-1414f2f175bc","content":"\u003cp\u003eI choose mentorship because I’ve experienced firsthand how transformative having guidance  can be. As a student-athlete, a musician, and someone working in finance, I’ve benefited from mentors who helped me find my voice, build confidence, and pursue my interests. Mentorship allows me to pay that forward by helping students feel seen and empowered to explore their passions. I love creating a space where curiosity is celebrated, questions are encouraged, and students can grow academically, creatively, and personally.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"0b443cdb-74a4-443d-988b-c57d17013daf\"}":{"__typename":"DeepDives","uuid":"0b443cdb-74a4-443d-988b-c57d17013daf","content":"\u003cp\u003eAs a high school student, I was deeply involved in academics, arts, and athletics, and I was fortunate to be recognized for my dedication in each of these areas. I received awards for embodying strong moral character and a love of learning, for balancing excellence in academics, arts, and athletics, and for my leadership and musicianship in the Washington National Cathedral Girls’ Choir. These honors reflected not only my achievements in the classroom, on the water, and in music, but also my commitment to working hard, leading others, and pursuing my passions with curiosity and discipline.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"253be282-e9c3-41ef-b59a-ed72cac522e9\"}":{"__typename":"School","uuid":"253be282-e9c3-41ef-b59a-ed72cac522e9","name":"National Cathedral School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20016"},"Education:{\"uuid\":\"b9032338-d2b4-4fab-aa4e-a9f1f8225e2c\"}":{"__typename":"Education","uuid":"b9032338-d2b4-4fab-aa4e-a9f1f8225e2c","school":{"__ref":"School:{\"uuid\":\"253be282-e9c3-41ef-b59a-ed72cac522e9\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"874367d7-66ee-4f15-b44c-352d2df07f0d\"}":{"__typename":"Education","uuid":"874367d7-66ee-4f15-b44c-352d2df07f0d","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Ethics, Politics, and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"d3fb791d-896d-470a-8359-e7ab62c492f0\"}":{"__typename":"MentorPublicProfile","uuid":"d3fb791d-896d-470a-8359-e7ab62c492f0","displayName":"Lauren W.","slug":"lauren-walker","biography":"\u003cp\u003eHi! My name is Lauren Walker, and I am currently a student at Yale University majoring in Ethics, Politics, and Economics with a minor in Spanish. I am a former Division I rower and am originally from Washington, DC. My academic interests, athletic background, and creative pursuits have shaped who I am today and strongly influence the way I approach mentorship.\u003c/p\u003e\u003cp\u003eI attended a rigorous high school where I was recognized for academic achievement, leadership, and my ability to balance excellence in academics, arts, and athletics. These experiences reinforced the value of persistence, curiosity, and integrity, and taught me that success is not about knowing everything, but about being willing to ask questions and continue learning. Beyond school, I have gained professional experience through internships and fellowships that exposed me to real-world problem solving, mentorship, and teamwork, further shaping my sense of responsibility and adaptability.\u003c/p\u003e\u003cp\u003eBalancing academics, athletics, and creativity has taught me discipline, resilience, and the importance of curiosity. As a student-athlete, I learned how to manage demanding schedules, set goals, and stay committed even when things felt challenging. These experiences helped me develop a strong work ethic and a growth mindset, qualities I enjoy helping students build in themselves.\u003c/p\u003e\u003cp\u003eI grew up deeply involved in music and the arts. In high school, I was a chorister at the Washington National Cathedral, where I performed in weekly services, world tours, and nationally significant events. Singing in such a rigorous and collaborative environment taught me leadership, accountability, and how to work as part of a team. Music continues to be a central part of my life today. I am a singer-songwriter and am currently working on my first album, which allows me to explore creativity, express myself authentically, and connect with others. I also play violin, viola, piano, and guitar, and I love encouraging students to explore creative outlets of their own.\u003c/p\u003e\u003cp\u003eAs a mentor, my goal is to help students feel confident in their voice, abilities, and curiosity. I believe it is more than okay to not know something. Asking questions is how meaningful learning begins. I enjoy supporting students with study skills, organization, goal-setting, and exploring subjects that excite them, while helping them build confidence academically, creatively, and personally.\u003c/p\u003e\u003cp\u003eI love talking about anything and everything, including academics, music, sports, culture, or creative projects. I especially enjoy learning about students’ interests and perspectives. My approach is flexible, student-centered, and rooted in encouragement. I value building genuine connections with my mentees, putting a smile on their faces, and supporting them as they grow into confident, curious learners.\u003c/p\u003e","teachingVideoPlaybackId":"hP01OtpKKqAzr6fnjcq2t9XAWlcJgekBtUlaJUZNuaV00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Ethics, Politics, and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3142095f-edc5-4162-817b-d754a01ffb39\"}"},{"__ref":"DeepDives:{\"uuid\":\"137cbada-8761-41bf-8f74-a798acb5bb46\"}"},{"__ref":"DeepDives:{\"uuid\":\"f380911a-fe16-47cc-83d3-1414f2f175bc\"}"},{"__ref":"DeepDives:{\"uuid\":\"0b443cdb-74a4-443d-988b-c57d17013daf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9540c639-5203-4d9c-9faa-231b2cec2682/-/preview/-/format/jpg/","https://ucarecdn.com/b20216ca-5bb8-4489-ab55-5866422a2a37/-/preview/-/format/jpg/","https://ucarecdn.com/6f5d66c5-2d7f-481b-8b65-ecea21473648/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b9032338-d2b4-4fab-aa4e-a9f1f8225e2c\"}"},{"__ref":"Education:{\"uuid\":\"874367d7-66ee-4f15-b44c-352d2df07f0d\"}"}],"hiredAt":"2026-01-11T22:12:48.648Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Biology","Writing","Spanish","College Essay Writing","Economics","Reading","Executive Function","History","Academic Coaching","K-6 Storybook","Creative Writing","Music","History Project","Business / Entrepreneurship","Finance / Investing","Web Design","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f
