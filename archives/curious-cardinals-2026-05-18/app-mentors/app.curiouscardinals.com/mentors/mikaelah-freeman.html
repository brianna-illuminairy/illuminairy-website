xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bcabfde9-5dc8-4c7b-ba28-fcf4080e15d0\"}":{"__typename":"Favorites","uuid":"bcabfde9-5dc8-4c7b-ba28-fcf4080e15d0","photoUrl":"https://ucarecdn.com/3259d876-e7db-4a0d-8234-9a79db62e7c0/","title":"Butterfly by Mariah Carey","type":"ALBUM"},"Favorites:{\"uuid\":\"300e5279-2b13-44a4-baf3-ea86042d3c6a\"}":{"__typename":"Favorites","uuid":"300e5279-2b13-44a4-baf3-ea86042d3c6a","photoUrl":"https://ucarecdn.com/a1197530-76dc-47d9-9c24-c14fd7ced07f/","title":"\"aza\" by ANAVITÓRIA","type":"SONG"},"Favorites:{\"uuid\":\"6339d790-cf08-4b2c-b7df-f54b0d9c58e0\"}":{"__typename":"Favorites","uuid":"6339d790-cf08-4b2c-b7df-f54b0d9c58e0","photoUrl":"https://ucarecdn.com/9d172b50-9024-44df-b38e-eb97eccd8a94/","title":"Recife, PE, Brazil","type":"CITY"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"275f6340-e821-480a-9108-0506ec905304\"}":{"__typename":"DeepDives","uuid":"275f6340-e821-480a-9108-0506ec905304","content":"\u003cp\u003eMy summers in high school were main spent working and doing marching band camp.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI typically worked part-time (~ 20 hours per week) at local summer camps. This was always fun because I got to help younger kids with summer enrichment and recreational activities. Of the camps I worked at, my favorite was a local theatre-based camp I worked at summer of 2016 because I really enjoyed guiding young students in a creative space. I have always been an advocate for having strong arts/music/theatre programs available for young students, so I was really glad to work at a theatre-based camp that year.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy school's marching band held camp during the summer, including two weeks of \"7-to-7 camp\" in July. The 7-to-7 camp would be our band doing physical conditioning, learning music, creating and learning field shows, and learning stand routines from 7 am until 7 pm every weekday. While it was extremely strenuous, I always enjoyed the camp because of the bonding experience with my bandmates.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"93ee9a3a-6af7-4f3b-b6fc-1165fb0648d8\"}":{"__typename":"DeepDives","uuid":"93ee9a3a-6af7-4f3b-b6fc-1165fb0648d8","content":"\u003cp\u003eHonestly? My dream job would be to not have a job, lol.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut in all seriousness, my dream job and the career that I am actively on the journey of pursuing is being a tenured university professor and researcher. I have always loved doing research and, even in childhood, found myself often engaging in informal research such as spending hours in the public library going through archives or watching documentaries on YouTube.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSpecifically, my dream is to be a research professor in biological anthropology. I love forensic anthropology/osteology and molecular anthropology/forensic genetics, and as an anthropology researcher and professor I would also have the ability to create a field school(s). Field schools are short courses, typically a few weeks in the summer, where a professor conducts research in a different location and has students partake in the research as well. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf I were a tenured professor and researcher at a university, I would be able to teach while also traveling and conducting various research projects. Definitely a dream to me!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"18f7e7f7-c66a-4e8e-a963-be08bccef0c4\"}":{"__typename":"DeepDives","uuid":"18f7e7f7-c66a-4e8e-a963-be08bccef0c4","content":"\u003cp\u003eThis is a bit of a long story, but I will try my best to condense it!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI initially applied to undergrad as a perspective psychology major because I initially wanted to pursue criminology or criminal psychology. However, after taking the Intro to Psych course my first semester, I realized that I actually did not care for psychology much and decided to switch to a politics major.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I switched to the politics major, I did the American Politics track at my university and also joined the pre-law group on campus. At this point, the plan was to enter law school after completing my bachelor's degree. However, the COVID-19 pandemic happened at the end of my sophomore year and during the time of quarantine I thought a lot about what I could actually see myself doing for a career that wouldn't make me miserable. After thinking long and hard, I decided that I no longer wanted to pursue law school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile I decided to ditch pre-law, I was pretty far into the politics major at that point. So, instead of swapping majors, I kept the politics major and decided to added a second major. The second major was anthropology, and I choose to pursue the Biological Anthropology track at my university. I chose this because I have always found forensic anthropology and forensic identification of skeletal remains to be interesting.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the end, I graduated with two majors and although I went into an MS program for biological anthropology, I have also utilized my knowledge and skills from my politics major in my pursuit of a career--including in a position as a Forensic Science Policy intern with the Innocence Project.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMoral of the story? You have the freedom to change your major and/or add majors if you feel the need to! Don't be scared to choose what's most aligned with yourself!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"98b46d32-b018-4839-9bdd-4846aa060845\"}":{"__typename":"DeepDives","uuid":"98b46d32-b018-4839-9bdd-4846aa060845","content":"\u003cp\u003eI really enjoy anything involving music. This includes going to concerts, going to symphonies and operas, listening to music, or practicing my own instruments. I even like to watch music videos and live performances on YouTube!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have recently been into composing, which has primarily involved mapping melodies and harmonies out on the keyboard followed by using computer-based programs for score-notation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"ceb80136-d03b-4e30-969a-6e78929a3ed5\"}":{"__typename":"School","uuid":"ceb80136-d03b-4e30-969a-6e78929a3ed5","name":"Ramsay High School","city":"Birmingham","type":"HIGH","state":"Alabama","country":"United States","zip":"35205"},"Education:{\"uuid\":\"b5d15b93-e0a2-4567-846d-7dab455240bd\"}":{"__typename":"Education","uuid":"b5d15b93-e0a2-4567-846d-7dab455240bd","school":{"__ref":"School:{\"uuid\":\"ceb80136-d03b-4e30-969a-6e78929a3ed5\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}":{"__typename":"School","uuid":"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5","name":"New York University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10012"},"Education:{\"uuid\":\"86b7443f-48cb-4b92-8daf-4827e65a08b6\"}":{"__typename":"Education","uuid":"86b7443f-48cb-4b92-8daf-4827e65a08b6","school":{"__ref":"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Anthropology; Politics","degree":null},"MentorPublicProfile:{\"uuid\":\"c4d1575c-2070-4bea-835b-a04ff68835d0\"}":{"__typename":"MentorPublicProfile","uuid":"c4d1575c-2070-4bea-835b-a04ff68835d0","displayName":"Mikaelah F.","slug":"mikaelah-freeman","biography":"\u003cp\u003eI was born and raised in Birmingham, AL and moved to New York City upon graduating high school. I lived in New York state for nearly a decade, followed by moving to Brazil. I currently reside in São Paulo, Brazil.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI graduated with a BA in Politics and a BA in Anthropology from NYU in 2022. I also hold a MS in Biomedical Anthropology and a Graduate Certificate in Forensic Health \u0026amp; Nursing from SUNY Binghamton (graduated May 2024). I have worked in education, with a previous position with America Reads/America Counts teaching elementary students in the NYC public school system.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have experience working in forensic science policy at the Innocence Project, which is an organization focused on exonerating individuals who were wrongfully convicted of crime. In this role, I have written testimonials, case reports, and research articles on forensic identification methods and their legal, ethical, political, and privacy implications in casework.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have also worked in the forensic science sector as a Criminalist II at the NYC Office of Chief Medical Examiner (OCME). In this position, I assisted medical examiners (forensic pathologists) in the positive identification of deceased individuals throughout New York City. I also assisted in missing persons inquiries that were brought to the agency.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eRecently, I completed a research project in Vitória de Santo Antão and Recife (both in the state of Pernambuco, in northeast Brazil) as a Fulbright Grantee. My research focused on osteology, forensic anthropology, and forensic genetics. My project involved metric analyses of bones combined with analyzing genetic information from DNA taken from bones.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I am a doctoral student of Biological Sciences - Genetics at the University of São Paulo (USP). As a doctoral student, my dissertation project is expanding on the research I did with the Fulbright grant and is based on the central question/problem: What is the evolutionary relationship between skeletal morphology (primarily size), external pigmentation (i.e., skin, hair), and the presence of vitamin D deficiencies (which are indicated by the presence of skeletal lesions and decreased bone mineral density)?\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have many passions and interests in addition to forensic and biological sciences, and politics/policy. These interests include music, as I play several instruments. I play the following instruments: clarinet, piano (keyboard), violin, flute, alto and soprano saxophone, and ukulele. I am extremely passionate about music and love to attend concerts. My music taste is really diverse, but my favorite genres of music are R\u0026amp;B, MPB (música popular brasileira), American pop, hip hop, soul, opera (especially arias), and country.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy favorite subjects in school were biology and anatomy, U.S. history, statistics, pre-algebra and algebra I, language and literature. I also partook in concert band and orchestra both in high school and in college. I am excited to share my skills and knowledge in these subjects with you, as well!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf I become your mentor, I hope to help you where you need help and inspire you to pursue your passions. I also want you to know that it is perfectly okay to have multiple passions and interests! :)\u003c/p\u003e","teachingVideoPlaybackId":"xKBDqirkQ4oog1Pm02tzSPrt3IkYMwZsbTGT02YL9deeU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bcabfde9-5dc8-4c7b-ba28-fcf4080e15d0\"}"},{"__ref":"Favorites:{\"uuid\":\"300e5279-2b13-44a4-baf3-ea86042d3c6a\"}"},{"__ref":"Favorites:{\"uuid\":\"6339d790-cf08-4b2c-b7df-f54b0d9c58e0\"}"}],"causesSupported":[],"major":"Anthropology; Politics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"275f6340-e821-480a-9108-0506ec905304\"}"},{"__ref":"DeepDives:{\"uuid\":\"93ee9a3a-6af7-4f3b-b6fc-1165fb0648d8\"}"},{"__ref":"DeepDives:{\"uuid\":\"18f7e7f7-c66a-4e8e-a963-be08bccef0c4\"}"},{"__ref":"DeepDives:{\"uuid\":\"98b46d32-b018-4839-9bdd-4846aa060845\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a2484ea6-8615-49ef-ae87-262d73967ca5/-/preview/-/format/jpg/","https://ucarecdn.com/24a2e9be-c556-4f65-9b32-f2b2c77ad396/-/preview/-/format/jpg/","https://ucarecdn.com/2d6f9c9a-3cca-4b46-89b1-cc118940ae91/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b5d15b93-e0a2-4567-846d-7dab455240bd\"}"},{"__ref":"Education:{\"uuid\":\"86b7443f-48cb-4b92-8daf-4827e65a08b6\"}"}],"hiredAt":"2025-09-26T00:06:29.004Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I",
