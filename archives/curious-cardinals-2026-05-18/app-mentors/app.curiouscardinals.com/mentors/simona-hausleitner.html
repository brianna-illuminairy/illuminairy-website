xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"595ebacb-2cef-4dd2-ab71-345bdc842b73\"}":{"__typename":"Favorites","uuid":"595ebacb-2cef-4dd2-ab71-345bdc842b73","photoUrl":"https://ucarecdn.com/c5f004ea-9799-434d-b249-05bca2d4d12e/","title":"The Imitation Game","type":"MOVIE"},"Favorites:{\"uuid\":\"e0aff8e1-6c3d-445f-8a1e-abc1db0b57ff\"}":{"__typename":"Favorites","uuid":"e0aff8e1-6c3d-445f-8a1e-abc1db0b57ff","photoUrl":"https://ucarecdn.com/43ae1a43-beeb-4169-bbce-ed1dab859323/","title":"Lana del Rey","type":"ARTIST"},"Favorites:{\"uuid\":\"c9c32f80-f418-46fb-88aa-93730833e53d\"}":{"__typename":"Favorites","uuid":"c9c32f80-f418-46fb-88aa-93730833e53d","photoUrl":"https://ucarecdn.com/91883cc1-64a7-41b3-918c-2276d1b4ff77/","title":"The Phantom of the Opera","type":"PLAY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"06b67a2c-c5c6-4d56-9e52-82a87b38fb69\"}":{"__typename":"DeepDives","uuid":"06b67a2c-c5c6-4d56-9e52-82a87b38fb69","content":"\u003cp\u003eDear middle/high school me,\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFirst of all, relax. I know that right now, the biggest mystery in your life is whether pineapple should go on pizza and if you'll ever figure out how to open your locker without looking like you’re cracking a safe. Spoiler: Pineapple can stay, and you'll eventually master that locker... just in time for college.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut let me give you some advice about taking risks—no, not the \"text your crush with a thousand emojis\" type. Bigger risks. Like saying “yes” to things you’ve never done before. You’ll be tempted to stay safe in the comfort zone, but guess what? That’s where creativity goes to die. Take the weird electives, even the ones that sound like they were made up by bored teachers (who would’ve thought woodblock printing would be such a cool thing to talk about at cocktail parties?). Try out for the school play even if your acting skills are questionable (trust me, they are). The embarrassment is temporary, but the stories last forever. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlso, don't be afraid to \u003cem\u003efail\u003c/em\u003e at stuff. Spoiler alert: You might not become a professional soccer player, no matter how hard you work on that header in gym class. But you’ll find out that failure at one thing often leads to success in something else—like realizing you’d much rather \u003cem\u003ewatch\u003c/em\u003e soccer with nachos. Also, nachos (real grated cheese, no queso) are \u003cem\u003ealways\u003c/em\u003e a good idea.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd about that risky business of asking for help? Do it. Like, yesterday. I know, I know—you're worried about looking dumb. But future you will tell you (from personal experience) that nobody has it all together. Those kids who seem to be cruising? They've probably got Google (or now, more like ChatGPT) running in their heads 24/7 too. The only person who looks dumb is the one too scared to ask for directions to the bathroom during finals. You know who you are.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLastly, get comfortable with the idea of change. You know that haircut you thought would look amazing? It won’t. But you’ll rock it anyway, and in the process, you’ll realize that sometimes, it’s the bad choices that make for the best memories. (Also, buy stock in hats. Truly an underappreciated accessory.)\u003c/p\u003e\u003cp\u003eSo go ahead, take those risks. They'll bring you stories that are way more interesting than playing it safe ever could. Just maybe think twice before trying to do that backflip off the diving board.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSincerely,\u003cbr\u003eFuture You (Do it for the plot!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"f94c15a6-9341-4220-9066-0aba867ff63d\"}":{"__typename":"DeepDives","uuid":"f94c15a6-9341-4220-9066-0aba867ff63d","content":"\u003cp\u003eWhile trekking the last 120 miles of the Camino de Santiago in Spain, I met a man named André, whose quiet demeanor hid a remarkable past. Over shared meals and long stretches of the trail, he revealed that during the 1980s, he had smuggled banned books into Czechoslovakia, then under communist rule. At a time when intellectual freedom was stifled and dissent was silenced, André risked imprisonment to ensure that ideas—whether novels, philosophy, or political theory—crossed borders where they were forbidden.\u003c/p\u003e\u003cp\u003eUnder the iron fist of censorship, André built a network of knowledge from nothing but smuggled pages, scavenged texts, and a belief that education could be an act of resistance. For André, each book he delivered was a weapon against oppression. He described how he crossed borders under cover of darkness, moving works by Václav Havel, Milan Kundera, and George Orwell past the watchful eyes of the state. The books were disguised as ordinary parcels, passed through sympathetic hands in remote villages. “The state feared the transformative power of literature,” André described. A single book, he believed, could open someone’s mind, sowing the seeds of change in a society where thinking freely was dangerous.\u003c/p\u003e\u003cp\u003eWhat struck me most about André was his humility. He never saw himself as a hero, yet his actions ensured that others could envision a future beyond the regime's control. His practice of relentless hope demonstrates that leadership is not a title—it’s a quiet, stubborn insistence on making a difference where no one else will.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c90d221d-83cc-497a-90ee-26ae947ce027\"}":{"__typename":"DeepDives","uuid":"c90d221d-83cc-497a-90ee-26ae947ce027","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to help bridge the gap in health equity, especially for those most often overlooked—the refugees, the displaced, the marginalized. I want to stand in the spaces where medicine meets borders, where political lines determine life expectancy, and where people are too often reduced to statistics. I envision myself working with Doctors Without Borders at the forefront of this effort, providing care in the world's most vulnerable regions while advocating for systemic changes that lift entire communities out of cycles of poor health.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve spent much of my life fascinated by how health is intertwined with identity, geography, and circumstance. While interning at a cardiothoracic surgery ward in Austria, I witnessed how access to healthcare is not just about resources but also about trust, language, and culture. This foundation has fueled my desire to create health systems that are as inclusive as they are efficient.\u003c/p\u003e\u003cp\u003eIn my lifetime, I hope to design programs that provide not only immediate medical aid but also sustainable solutions. I imagine myself sitting with families in refugee camps, offering more than just a bandage or a prescription. I want to help build a future where the care they receive doesn’t end when I leave. Whether it’s creating clinics in remote areas, training local healthcare workers, or advocating for policies that prioritize healthcare as a human right, my goal is to leave behind structures that endure.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am not content with simply practicing medicine. I want to push its boundaries, to ensure that the child born in a war-torn country has the same shot at a healthy life as one born in a well-resourced city. In the end, what I hope to accomplish is simple but profound: to weave compassion into the very fabric of healthcare and ensure that no one, no matter where they are born, falls through the cracks.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"876f8713-e9f3-41e5-bb0d-bc0702bdaf19\"}":{"__typename":"DeepDives","uuid":"876f8713-e9f3-41e5-bb0d-bc0702bdaf19","content":"\u003cp\u003eSomething most people don’t realize about me is how much I love the quiet of art museums. On the surface, I come across as super social, always talking, always in the middle of a conversation, and I really do thrive on that energy. But there’s something about being in a space where no one expects anything from you—no talking, no reacting, just being—that I find really grounding.\u003c/p\u003e\u003cp\u003eWhen I walk through a museum, it’s like stepping into a different world. It’s quiet, but not empty. The art pulls you in, and there’s this unspoken dialogue happening between you and what’s in front of you. I’ve always appreciated how art can communicate without needing words, and how you can sit with your own thoughts while still feeling connected to something larger. It’s one of the few places where I can just slow down and think.\u003c/p\u003e\u003cp\u003eI’m drawn to those moments of silence, even though most people would never guess that about me. They see me as the extroverted one, always leading conversations and filling the space with energy. But in museums, I get to step back, take a breath, and just observe. It’s a chance to recharge in a way that feels really personal, without needing to explain anything to anyone. It’s in those quiet moments that I find a kind of clarity I can’t get anywhere else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"19b19cdc-6d37-4051-b7f3-01b57bba0f01\"}":{"__typename":"School","uuid":"19b19cdc-6d37-4051-b7f3-01b57bba0f01","name":"BASIS Phoenix","city":"Phoenix","type":"HIGH","state":"Arizona","country":"United States","zip":"85022"},"Education:{\"uuid\":\"511694c4-f45c-4fb4-8ff5-2864576956da\"}":{"__typename":"Education","uuid":"511694c4-f45c-4fb4-8ff5-2864576956da","school":{"__ref":"School:{\"uuid\":\"19b19cdc-6d37-4051-b7f3-01b57bba0f01\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"2ab71a56-b1df-43e5-a939-015c86cb2a6d\"}":{"__typename":"Education","uuid":"2ab71a56-b1df-43e5-a939-015c86cb2a6d","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience, Global Health, Human Rights","degree":null},"MentorPublicProfile:{\"uuid\":\"95a69793-0ff9-494b-abbc-6136e1c5c15d\"}":{"__typename":"MentorPublicProfile","uuid":"95a69793-0ff9-494b-abbc-6136e1c5c15d","displayName":"Simona H.","slug":"simona-hausleitner","biography":"\u003cp\u003eHello! My name is Simona Hausleitner, and I am a student at Yale University majoring in Neuroscience, with Certificates in Global Health and Human Rights.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in a bilingual household with immigrant parents, which sparked my deep interest in health equity and the barriers that prevent people from accessing quality care. This has driven me to explore healthcare systems around the world, not just from a medical perspective but through the lenses of policy, culture, and ethics. I believe that equitable healthcare is a human right, and I am determined to contribute to solutions that address global health disparities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my studies, I work closely with underserved communities. I volunteer weekly at the HAVEN Free Clinic, where I counsel low-income and uninsured patients, primarily in Spanish, about nutrition, exercise, and healthy living strategies, as well as coordinating their long-term reproductive care. In addition, I tutor refugee and immigrant students in math and English, and I am the president of Universities Allied for Essential Medicines at Yale, leading efforts to improve drug affordability and access. Additionally, I’ve dedicated myself to projects like Mobile Memory, an Alzheimer’s disease app designed to analyze speech patterns and detect early signs of neural decay before clinicians can. Working on this project allowed me to merge my interests in neuroscience and technology, tackling one of the most pressing challenges in modern medicine.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the future, I plan to work with organizations like Doctors Without Borders and the World Health Organization, with the goal of creating sustainable healthcare systems that empower communities globally. My vision is to reform healthcare by blending culturally competent care with innovative policy solutions, ensuring that no one is left behind.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI received a 1600 on the SAT, an 800 on SAT Chemistry and SAT Math, a 5 on 16 different APs, and a 524 on the MCAT. I also gained admission to Oxford, Yale, Penn, Brown (PLME program), and Cornell, so I'm more than prepared to help students with anything from standardized testing and college essay-writing to passion projects and academic tutoring! \u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"595ebacb-2cef-4dd2-ab71-345bdc842b73\"}"},{"__ref":"Favorites:{\"uuid\":\"e0aff8e1-6c3d-445f-8a1e-abc1db0b57ff\"}"},{"__ref":"Favorites:{\"uuid\":\"c9c32f80-f418-46fb-88aa-93730833e53d\"}"}],"causesSupported":[],"major":"Neuroscience, Global Health, Human Rights","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"06b67a2c-c5c6-4d56-9e52-82a87b38fb69\"}"},{"__ref":"DeepDives:{\"uuid\":\"f94c15a6-9341-4220-9066-0aba867ff63d\"}"},{"__ref":"DeepDives:{\"uuid\":\"c90d221d-83cc-497a-90ee-26ae947ce027\"}"},{"__ref":"DeepDives:{\"uuid\":\"876f8713-e9f3-41e5-bb0d-bc0702bdaf19\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/813c489e-a30c-4478-8b27-12064f66bdc7/-/preview/-/format/jpg/","https://ucarecdn.com/36c0f9d9-5c6a-4bbc-abc9-eb53b0d318d4/-/preview/-/format/jpg/","https://ucarecdn.com/ed5d44d8-ecdb-48d0-b010-3e2c75ffcc9a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"511694c4-f45c-4fb4-8ff5-2864576956da\"}"},{"__ref":"Education:{\"uuid\":\"2ab71a56-b1df-43e5-a939-015c86cb2a6d\"}"}],"hiredAt":"2024-10-10T12:00:06.522Z","topics":["Business / Entrepreneurship","Global Health","Women \u0026 Gender Studies","World Cultures","Law / Government / Policy","Debate","Public Speaking","Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Economics","Journalism","German","Writing","Reading","Biology","Chemistry","S
