peal of someday working for NASA, or even fulfilling her lifelong dream of being an astronaut. \n\nAt USC, Katherine is currently the co-president of Bloom, a sustainable fashion club, co-president of the Society for Earth Science Students, and in her free time she writes for the school’s newspaper. She also works part-time in a geochemistry lab on campus tracking radioactive isotope decay in California water samples. \n\nKatherine grew up in Fairfax Virginia, just 20 minutes outside Washington, DC. Throughout her life she was a competitive swimmer, and went on to be an assistant coach for her local swim team, Vienna Aquatic Club.\n\nWhile in high school, she was co-president of the Saints for Animal Protection club, and also had a small baking business, Cakes by Katherine LLC, where she baked and sold cakes, pastries, cookies, and more. \n\nKatherine’s interests are varied, from creative writing, to baking, to astronomy and earth sciences, but everything she takes on comes down to a fundamental love for learning and exploration. As a former coach and tutor, she loves sharing her knowledge and passions with others, and is excited to have the opportunity to do so.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Geological and Earth Sciences","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/1198abb4-1672-4241-a173-92875530321c/-/crop/653x653/163,0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"26c83ab0-e46d-4005-b181-a4f42e66be27\"}"},{"__ref":"Education:{\"uuid\":\"1f8180a7-6919-4902-900e-cba0b04b4bc8\"}"}],"hiredAt":"2022-09-28T19:12:24.000Z","topics":["Cooking","Physics","Writing","STEM Project","Chemistry","Biology","6-8 Grade Science","Literature"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mento
