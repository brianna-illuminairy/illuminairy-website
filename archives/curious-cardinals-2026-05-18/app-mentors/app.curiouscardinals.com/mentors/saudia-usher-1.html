xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"32204d74-0525-46d4-95e1-4d5185082120\"}":{"__typename":"Favorites","uuid":"32204d74-0525-46d4-95e1-4d5185082120","photoUrl":"https://ucarecdn.com/280e10a9-d1d8-4d43-94cc-aab9ff21eea0/","title":"London","type":"CITY"},"Favorites:{\"uuid\":\"5268da6d-14e9-4809-b9ee-f3feb197ad93\"}":{"__typename":"Favorites","uuid":"5268da6d-14e9-4809-b9ee-f3feb197ad93","photoUrl":"https://ucarecdn.com/d7e34c86-30b3-42cc-a102-f6d579bb562b/","title":"Hamilton ","type":"PLAY"},"Favorites:{\"uuid\":\"8e78b658-0b40-4e46-93c5-d3f8ba2252b0\"}":{"__typename":"Favorites","uuid":"8e78b658-0b40-4e46-93c5-d3f8ba2252b0","photoUrl":"https://ucarecdn.com/c5d66df8-cd66-4acf-8cb1-c385e419a516/","title":"Oh, the Places You'll Go ","type":"BOOK"},"CausesSupported:{\"uuid\":\"0505a161-fc36-4700-ab2d-4a34adb2fb3f\"}":{"__typename":"CausesSupported","uuid":"0505a161-fc36-4700-ab2d-4a34adb2fb3f","name":"LAUSD School Mental Health ","description":"\u003cp\u003eLAUSD ensures equitable education, supporting students’ academic and well-being.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/aebf6fcb-0466-441d-918e-ca2b42769589/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"266a6847-1ee7-43ea-8593-a5e3a83dffb3\"}":{"__typename":"DeepDives","uuid":"266a6847-1ee7-43ea-8593-a5e3a83dffb3","content":"\u003cp\u003eIt’s okay to fail. Growth isn’t about being perfect—it’s about learning, adapting, and pushing forward even when things don’t go as planned. Failure isn’t a reflection of your worth; it’s proof that you’re trying. The most important thing is to believe in yourself and get back up!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eP.S. If you need a boost, listen to And Still I Rise by Maya Angelou :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"0a0043f3-26e2-4cdd-9b9b-4f9ec013e21f\"}":{"__typename":"DeepDives","uuid":"0a0043f3-26e2-4cdd-9b9b-4f9ec013e21f","content":"\u003cp\u003eMy dream job is to work at the intersection of social work, education equity, and youth advocacy, ensuring that marginalized adolescents have the resources, support, and opportunities they deserve. Whether through policy reform, direct mentorship, or community-based programs, I want to create systemic change that uplifts under served students so they can thrive academically, mentally, and socially.\u003c/p\u003e\u003cp\u003eI envision a career where I can both work on the ground with students and influence larger institutional policies, bridging the gap between personal experience and structural reform. My ultimate goal is to develop programs that empower young people to find their voice, overcome barriers, and rewrite their own narratives—because every young person deserves the chance to succeed, no matter where they come from.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"f7e8a13f-cfc9-4753-b0af-e09cf5e42cb0\"}":{"__typename":"DeepDives","uuid":"f7e8a13f-cfc9-4753-b0af-e09cf5e42cb0","content":"\u003cp\u003eI am extremely proud of my journey—navigating the challenges of being a biracial, first-generation student from an underresourced background and still carving out a path in higher education and advocacy. I’m proud of the moments when I stood up for myself and others, whether through mentorship, leadership in social justice organizations, or simply refusing to let obstacles define me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"dad2d021-692d-42f6-b03a-20ff8ae9950e\"}":{"__typename":"DeepDives","uuid":"dad2d021-692d-42f6-b03a-20ff8ae9950e","content":"\u003cp\u003eMy greatest role model and mentor is my mother. As a Zimbabwean-Pakistani immigrant, she navigated immense challenges with resilience, strength, and an unwavering commitment to building a better future. She showed me what it means to persevere in the face of adversity, to embrace my identity with pride, and to fight for what I believe in.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"a85cc95a-0053-4c1a-b184-c59cd0656c70\"}":{"__typename":"School","uuid":"a85cc95a-0053-4c1a-b184-c59cd0656c70","name":"John Muir High School","city":"Pasadena","type":"HIGH","state":"California","country":"United States","zip":"91103"},"Education:{\"uuid\":\"1bebdb1d-41fc-4e40-9868-c0845d9f4f55\"}":{"__typename":"Education","uuid":"1bebdb1d-41fc-4e40-9868-c0845d9f4f55","school":{"__ref":"School:{\"uuid\":\"a85cc95a-0053-4c1a-b184-c59cd0656c70\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"0f1f0dc1-438d-40f4-b759-fddaf24b2075\"}":{"__typename":"Education","uuid":"0f1f0dc1-438d-40f4-b759-fddaf24b2075","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"c4741621-2296-4c9a-bc70-d0f4b96cc418\"}":{"__typename":"MentorPublicProfile","uuid":"c4741621-2296-4c9a-bc70-d0f4b96cc418","displayName":"Saudia U.","slug":"saudia-usher-1","biography":"\u003cp\u003eHi! I’m Saudia Usher, a recent UCLA graduate and a current Master of Social Work student pursuing a career in advocacy and therapy. My work is grounded in a deep commitment to social justice, educational equity, youth empowerment—and just as importantly, emotional well-being, healing, and self-care.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy journey as a professional has been shaped by movement—between countries, cultures, and identities. As the daughter of a Zimbabwean-Pakistani single mother, I’ve navigated spaces where I both belonged and stood apart. These experiences not only shaped my understanding of inequity, but also taught me the importance of resilience, reflection, and having access to supportive spaces. I’ve learned that access to opportunity isn’t equal—but access to care, advocacy, and support should be.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passion for advocacy began with a simple but profound question: Why do some students have access to everything, while others struggle for the bare minimum? Over time, that question expanded into a deeper understanding of how systemic barriers don’t just limit opportunities—they also impact mental health, identity development, and overall well-being. Through my internship with LAUSD’s School Mental Health program this past year, I’ve been able to witness these dynamics firsthand—supporting students as they navigate academic pressures, emotional challenges, and the broader sociopolitical and educational systems shaping their daily lives. This experience has deepened my commitment to integrating advocacy with therapeutic support, recognizing that meaningful change requires both individual care and systemic intervention across diverse communities and settings.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re searching for direction, looking to turn your experiences into impact, or simply figuring out where to start, I’m here to support you. I’ve navigated the challenges of coming from an under-resourced community, pursuing higher education, and creating a space where I could thrive—and I’m passionate about guiding young scholars in discovering and pursuing their educational paths with confidence, clarity, and a strong sense of purpose.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTogether, we can turn your questions into action—whether through advocacy, storytelling, or community-driven change. At the heart of my work is a simple belief: everyone deserves access, everyone deserves support, and every small moment of curiosity can lead to something greater when nurtured with care and intention. Let’s find yours!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Shg200xodLhOIqEUXFpPTGMh8l00uWBhcNbjPZEqig02ko","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"32204d74-0525-46d4-95e1-4d5185082120\"}"},{"__ref":"Favorites:{\"uuid\":\"5268da6d-14e9-4809-b9ee-f3feb197ad93\"}"},{"__ref":"Favorites:{\"uuid\":\"8e78b658-0b40-4e46-93c5-d3f8ba2252b0\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0505a161-fc36-4700-ab2d-4a34adb2fb3f\"}"}],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"266a6847-1ee7-43ea-8593-a5e3a83dffb3\"}"},{"__ref":"DeepDives:{\"uuid\":\"0a0043f3-26e2-4cdd-9b9b-4f9ec013e21f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7e8a13f-cfc9-
