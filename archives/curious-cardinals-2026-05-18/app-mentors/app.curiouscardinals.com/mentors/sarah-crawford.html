xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"988fb488-c16c-4b93-9720-dcfab8fdb472\"}":{"__typename":"DeepDives","uuid":"988fb488-c16c-4b93-9720-dcfab8fdb472","content":"\u003cp\u003eI would say to stay motivated and keep pursuing the things that bring you joy! This time is precious, and although it is valuable to work hard in school, it's equally as important to enjoy time with your friends and family. :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"6c77a133-ca58-49b5-9b53-5a093038f4b0\"}":{"__typename":"DeepDives","uuid":"6c77a133-ca58-49b5-9b53-5a093038f4b0","content":"\u003cp\u003eI can speak fluent Spanish! Thanks to studying abroad in Spain and working with many bilingual/primarily Spanish-speaking students, I'm grateful to have grown my ability to communicate with more people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c24689d7-22e2-42fc-adc4-c15a44afe24a\"}":{"__typename":"DeepDives","uuid":"c24689d7-22e2-42fc-adc4-c15a44afe24a","content":"\u003cp\u003eI spent a lot of time with friends in the summers, especially at a lake in my town. I worked a different job each summer, and would always babysit on the side too. I was also a member of my school’s cross-country team, so I’d spend time practicing with them. Once I got my license, I loved to take day trips to the beach too.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"1c5ff33e-b087-4053-b97b-131551d49436\"}":{"__typename":"School","uuid":"1c5ff33e-b087-4053-b97b-131551d49436","name":"Downingtown S.T.E.M. Academy","city":"Downingtown","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19335"},"Education:{\"uuid\":\"cbad597a-5456-4e88-9f13-a28bb7df8dd2\"}":{"__typename":"Education","uuid":"cbad597a-5456-4e88-9f13-a28bb7df8dd2","school":{"__ref":"School:{\"uuid\":\"1c5ff33e-b087-4053-b97b-131551d49436\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"b0aa5484-cbac-448c-95b7-34a68414507d\"}":{"__typename":"Education","uuid":"b0aa5484-cbac-448c-95b7-34a68414507d","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"5da8fefd-aa17-4937-b31e-53e55a3e83ab\"}":{"__typename":"MentorPublicProfile","uuid":"5da8fefd-aa17-4937-b31e-53e55a3e83ab","displayName":"Sarah C.","slug":"sarah-crawford","biography":"\u003cp\u003eHi! My name is Sarah, and I'm a senior at Brown University pursuing a B.A. in Psychology. I'm from Downingtown, PA, a suburb west of Philadelphia. In my free time, I love to try new foods, read, knit, dance, watch movies (particularly a thriller), and hang out with my family and friends. :-)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Brown, I work as a lab research assistant in the psych department, contribute pieces to one of Brown’s literary magazines, serve as a leader for the Psychology Departmental Undergraduate Group, and love to indulge in a nap on our campus quad. I've tutored elementary and high school students in public schools throughout my time as a student at Brown and abroad, and have loved being able to be a source of comfort and joy through learning. Although I'm technically the teacher, I've really felt like my kids have been the ones teaching me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love to help young people discover the excitement of learning. Tutoring and academic mentorship can often feel intimidating to a student -- what I want and most value is building a trusting relationship that will help students become confident learners, well-rounded people, and (most importantly) enthusiastic to learn. :-)\u003c/p\u003e","teachingVideoPlaybackId":"fcTXoaktZPwwVnrv146OYPXGwdO1SFjvkfDUGEQegAk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"988fb488-c16c-4b93-9720-dcfab8fdb472\"}"},{"__ref":"DeepDives:{\"uuid\":\"6c77a133-ca58-49b5-9b53-5a093038f4b0\"}"},{"__ref":"DeepDives:{\"uuid\":\"c24689d7-22e2-42fc-adc4-c15a44afe24a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/08aa87a5-a363-4950-9578-09528c5e40f0/-/preview/-/format/jpg/","https://ucarecdn.com/9c9bf11e-fed0-420c-9181-9651efad10c3/-/preview/-/format/jpg/","https://ucarecdn.com/f5c3fb59-f32c-4eb4-ad55-885616713aee/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cbad597a-5456-4e88-9f13-a28bb7df8dd2\"}"
