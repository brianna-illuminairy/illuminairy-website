xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ad15bf84-a840-41bb-86f4-baa456605c23\"}":{"__typename":"Favorites","uuid":"ad15bf84-a840-41bb-86f4-baa456605c23","photoUrl":"https://ucarecdn.com/73962be9-e5e8-4001-afa3-e2ad97925d36/","title":"Victoria, British Columbia","type":"CITY"},"Favorites:{\"uuid\":\"7fe12942-ffef-4639-87c9-4742c46c6e4d\"}":{"__typename":"Favorites","uuid":"7fe12942-ffef-4639-87c9-4742c46c6e4d","photoUrl":"https://ucarecdn.com/9471a202-7076-47c0-b7bd-a003aec96424/","title":"The Fellowship of the Ring","type":"BOOK"},"Favorites:{\"uuid\":\"8302afb1-6ee6-40a2-82da-493e136c1d09\"}":{"__typename":"Favorites","uuid":"8302afb1-6ee6-40a2-82da-493e136c1d09","photoUrl":"https://ucarecdn.com/46abeb34-f839-4997-bd70-10b311ef9737/","title":"California Dreamin' (Bobby Womack)","type":"SONG"},"CausesSupported:{\"uuid\":\"3188b41d-ec24-413e-9b42-5d60cd0e0091\"}":{"__typename":"CausesSupported","uuid":"3188b41d-ec24-413e-9b42-5d60cd0e0091","name":"","description":"","photoUrl":""},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"1ad0ea39-e2fa-4953-a17a-79379de382f2\"}":{"__typename":"DeepDives","uuid":"1ad0ea39-e2fa-4953-a17a-79379de382f2","content":"\u003cp\u003eI drifted off and I found myself emerge into a colorful tent, wherein I was witness to a Shih Tzu circus. Each of the performers, who were executing a highly choreographed dance (juggling and cartwheeling, often at the same time) without any human input, was a Shih Tzu in variegated jester's clothing. I looked to the audience and found only a dense throng of anthropomorphic Shih Tzus, watching intently. I was the only human. My favorite part was the trapezists; I still can't quite work out the mechanics.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1d770932-df36-4036-bf91-53a76b39eb8a\"}":{"__typename":"DeepDives","uuid":"1d770932-df36-4036-bf91-53a76b39eb8a","content":"\u003cp\u003eMy great grandparents never learned to read. Even a few decades ago, my mother lived many of her early years in a hut without running water. My grandparents' ambitions, kindled in the Zimbabwean highveld, were that I might attain higher education. I feel bound to use the opportunities I've been given and apply my learning toward the betterment of outcomes for disadvantaged people, understanding each generation's capacity to chase their positive aspirations builds on the work of the last. I'm motivated by the dream that the sum of the effort I exert across my life — medical or otherwise — is eventually tangibly reflected in a few lives. Many disadvantaged people have poorer healthcare outcomes, which is partly due to lower access to diagnostic medicine. This is a good starting point for me to work on improving for these populations!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"fc90818e-cf84-4fcc-aa52-90f0c1a99c53\"}":{"__typename":"School","uuid":"fc90818e-cf84-4fcc-aa52-90f0c1a99c53","name":"The Warren Alpert Medical School of Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02903"},"Education:{\"uuid\":\"f39cc111-ee27-4e0f-987e-caa12aadafc0\"}":{"__typename":"Education","uuid":"f39cc111-ee27-4e0f-987e-caa12aadafc0","school":{"__ref":"School:{\"uuid\":\"fc90818e-cf84-4fcc-aa52-90f0c1a99c53\"}"},"startYear":"2025","endYear":"2025","expectedGradYear":"2029","major":"MD (current), Computational Neuroscience (past)","degree":null},"School:{\"uuid\":\"da86d0a7-0b56-4eb0-8c9d-0c5ca0f555e3\"}":{"__typename":"School","uuid":"da86d0a7-0b56-4eb0-8c9d-0c5ca0f555e3","name":"Brown University.","city":"Providence","type":"HIGH","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"8c2b14cc-12dc-4f36-9610-c2cebe7f32ac\"}":{"__typename":"Education","uuid":"8c2b14cc-12dc-4f36-9610-c2cebe7f32ac","school":{"__ref":"School:{\"uuid\":\"da86d0a7-0b56-4eb0-8c9d-0c5ca0f555e3\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":"2021","major":"Neuroscience, Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"c3279581-5371-4f01-b141-178f9c2c7922\"}":{"__typename":"MentorPublicProfile","uuid":"c3279581-5371-4f01-b141-178f9c2c7922","displayName":"Mason U.","slug":"mason-usher","biography":"\u003cp\u003eWhat if the littlest questions could grow into something greater? How can I use my curiosity as a pathfinder to actualize change? How do I get started?\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm very pleased to meet you! My name is Mason Usher and I am a fourth-year student at Brown studying Neuroscience and Computer Science, with extracurricular interests in history, literature, architecture, and medical illustration. I am from Pasadena, California — although I have moved over ten times! — and I come from an immigrant family with multiple origins and a diverse heritage. I love the ocean, mountains, climbing, and all varieties of adventure.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSimple questions have tremendous potential to germinate meaningful exploration, which always leads further when motivated by fun and a sense of discovery. My academic journey in university was inspired by one such question — \"\u003cem\u003eHow does my brain really work?\u003c/em\u003e\"; everything else has sprung from this minute, and entirely random, itch. I love science and the humanities, and I integrate both into my formal study of medicine through Brown's PLME Sc.B/M.D. program. I utilize my growing computational skill set in research projects employing machine learning methods to connect faulty neural activity to symptomatic states of Parkinson's disease. I am also an EMT, oversee a residential building (for first-year students) on campus, and intern at Rhode Island Hospital's Department of Neurosurgery.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you're starting a project or are interested in applying to university and require understanding of your uncommon background, I may be able to help! I am a minority student with Zimbabwean family, from an underresourced community, and from a single-parent household. With these numerous challenges, I learned strategies to actualize my dream of pursuing higher education and a profession as a physician-scientist. My goals are to increase access to diagnostic medicine in underserved communities and to publish art and literature with the goal of expanding interest in medicine!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTogether, we'll find the questions that appeal to you, and use your branching curiosity to synthesize your learning. Even if you're uncertain where your interests lie (or unsure how to start), we will work together on developing little questions toward a project with great personal meaning to you. I relate in particular to students passionate about the humanities, interested in medicine and physiology, and those feeling displaced or lost. \u003cem\u003eI've been there before!\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWe will create a fun, understanding, and compassionate environment. In my time formally teaching Immunology to students at Brown, I have learned the unequivocally best part of teaching is the opportunity to get to know students and their interests as individuals. As a mentor, my greatest aspiration is to help you kindle your curiosity and develop your projects toward your dreams.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to meeting you, and being part of your journey to inspire change!\u003c/p\u003e","teachingVideoPlaybackId":"fNjCilUdugGlDdRQVswyMWaqet2uoDkp00Kj6dGWJcD8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhen I was twelve years old, I ate enough fettuccine alfredo to be almost 4% pasta by mass. I remember this event like a bizarre (tasty) fever dream. In second place: I was admitted to Brown's medical school at age 17; I will be attending in 2025!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ad15bf84-a840-41bb-86f4-baa456605c23\"}"},{"__ref":"Favorites:{\"uuid\":\"7fe12942-ffef-4639-87c9-4742c46c6e4d\"}"},{"__ref":"Favorites:{\"uuid\":\"8302afb1-6ee6-40a2-82da-493e136c1d09\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"3188b41d-ec24-413e-9b42-5d60cd0e0091\"}"}],"major":"MD (current), Computational Neuroscience (past)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1ad0ea39-e2fa-4953-a17a-79379de382f2\"}"},{"__ref":"DeepDives:{\"uuid\":\"1d770932-df36-4036-bf91-53a76b39eb8a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d427ee5f-6f1c-4ec3-a81c-6aeb2cc8935b/-/preview/-/format/jpg/","https://ucarecdn.com/f898c1d3-3c20-4936-95e6-8e895830334a/-/preview/-/format/jpg/","https://ucarecdn.com/0223c65f-6df0-4960-a2c1-3f34979230cf/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f39cc111-ee27-4e0f-987e-caa12aadafc0\"}"},{"__ref":"Education:{\"uuid\":\"8c2b14cc-12dc-4f36-9610-c2cebe7f32ac\"}"}],"hiredAt":"2024-05-11T11:44:41.662Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Chemistry","Biology","Writing","College Essay Writing","Reading","History","Computer Science","History Project","Creative Writing","Coding / Programming","Medicine / Health","STEM Project","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mason-usher\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c3279581-5371-4f01-b141-178f9c2c7922\"}"}}},"_sentryTraceData":"7fc4da67bafd422782a6271804e97c20-9fee52365532df75-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7fc4da67bafd422782a6271804e97c20,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"mason-usher"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
