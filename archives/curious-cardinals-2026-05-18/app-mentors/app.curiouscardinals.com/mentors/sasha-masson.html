xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"184d349a-93c0-408e-ad37-74b2eb01472d\"}":{"__typename":"DeepDives","uuid":"184d349a-93c0-408e-ad37-74b2eb01472d","content":"\u003cp\u003eThe advice that I would give myself is to take the time to explore. When you are in middle and high school, it can oftentimes feel like a rat race and you are just doing what makes sense in the moment or what is easiest to stand out. However, you are at such a unique time in your life where you can discover and explore new fields without much repercussion and find out so much about yourself. Don't waste that precious opportunity. It will even save you a lot of time in college in terms of determining what you want to do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"2deced7b-9437-42ec-a2c4-078ce71660e7\"}":{"__typename":"DeepDives","uuid":"2deced7b-9437-42ec-a2c4-078ce71660e7","content":"\u003cp\u003eMentorship is a great way for me to give back to what all the incredible mentors in my life have given me. I wouldn't have had any of my success up to this point if not for formal mentors in my life like teachers or informal mentors that have invested their time in me. Moreover, I wish I had this type of mentorship when I was in middle and high school. I had so many passions but was unsure how to. turn them into something tangible and that's exactly how CC can help you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b69cb196-3ffb-4975-ac55-eb26db65ce43\"}":{"__typename":"DeepDives","uuid":"b69cb196-3ffb-4975-ac55-eb26db65ce43","content":"\u003cp\u003eIn high school, I spent my summers doing a variety of things. I took summer classes that would allow me to take accelerated coursework during the school year. I prepared for standardized tests. I completed research programs. I also took the time to discover new interests I had and figure out how to implement them. For instance, I wanted to start a mock trial team at my high school, so I did a lot of research and outreach to figure out how to do that and what I had to do during the school year to carry it out. I also wanted to make a board game with my friend to teach children about climate change. We studied the process on how to do that over the summer, did a lot of market research, self-taught graphic design, etc. But outside of all of that, I still took the time to partake in hobbies I enjoy like tennis, going to the gym, escape rooms, hanging out with friends, cooking, and more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"43716c8c-40f0-41d7-9521-67f84a8b032d\"}":{"__typename":"DeepDives","uuid":"43716c8c-40f0-41d7-9521-67f84a8b032d","content":"\u003cp\u003eMy greatest source of motivation is my curiosity. Quite ironic as a mentor for Curious Cardinals. But my curiosity is what incentivizes me to try new fields of study or interests. I also try to find what makes me curious in everything I study so that I naturally am inclined to want to immerse myself in a subject even if it isn't my favorite. Curiosity constantly pushes me out of my comfort zone and motivates me to go above and beyond.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"65f5c42a-6d5e-4e16-9e89-af6ed991dfe1\"}":{"__typename":"School","uuid":"65f5c42a-6d5e-4e16-9e89-af6ed991dfe1","name":"The Harker School - Upper School Campus","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95129"},"Education:{\"uuid\":\"4a07efcb-7291-48a0-af70-17bb3e920d99\"}":{"__typename":"Education","uuid":"4a07efcb-7291-48a0-af70-17bb3e920d99","school":{"__ref":"School:{\"uuid\":\"65f5c42a-6d5e-4e16-9e89-af6ed991dfe1\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"97e5805e-539f-46cf-a781-90ab88966cd0\"}":{"__typename":"Education","uuid":"97e5805e-539f-46cf-a781-90ab88966cd0","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Environment \u0026 Sustainability and Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"fe327de1-ca3a-4e43-a4c5-d6a1dd99ef50\"}":{"__typename":"MentorPublicProfile","uuid":"fe327de1-ca3a-4e43-a4c5-d6a1dd99ef50","displayName":"Sasha M.","slug":"sasha-masson","biography":"\u003cp\u003eMy name is Sasha, and I'm currently a student at Cornell University studying Environment \u0026amp; Sustainability and Information Science. As seen by my two very different majors, I really enjoy exploring a variety of fields and that is shown in my background. Prior to coming to Cornell, a lot of my experience was in material science research and public speaking activities like debate, mock trial, and Model UN. I did independent research on solar panels for 7 years during which I competed at science fairs, presented at conferences, and published my own paper in IEEE while in high school. I also won second and third place grand awards at the International Science and Engineering Fair (ISEF) and 1st place at the California Science and Engineering Fair (CSEF). In debate, I was Varsity Debate Captain of my high school and competed in public forum on the national circuit where I was a quarterfinalist at the Tournament of Champions and ranked top 7% nationally. Moreover, I started a mock trial team at my high school from the ground up. I also created a board game to teach children about climate change which I launched on Kickstarter and was able to implement in 30 schools across California. \u003c/p\u003e\u003cp\u003eNow,\u0026nbsp;in college, I am interested in pursuing a career at the intersection of finance and sustainability. I'm a part of several consulting clubs, a venture capital club, and a business fraternity on campus. I completed several internships in venture capital and also have experience in recruiting for finance as I will be working in Bloomberg Intelligence this summer and in investment banking the following summer. With my diverse experiences in many fields, I can help students discover where their interests lie and give them tailored advice on a wide range of topics. I can also help them in finding unique ways to combine their interests and passion projects that support that. \u003c/p\u003e\u003cp\u003eLastly, I'm really passionate about mentoring because of the informal mentors that have been able to get me where I am today. I've tried to give back in many ways and have helped high schoolers with college applications and standardized testing tutoring. I am a debate coach for my high school's team where I get flown out to tournaments to judge rounds and help the team create evidence. I also started my own research mentoring program where I helped over 50 students design a research topic idea, carry out the project, and publish it in a journal and/or present it at science fairs. These experiences have enabled me to learn how to help students from various backgrounds and have furthered my passion for mentoring.\u003c/p\u003e","teachingVideoPlaybackId":"Fc9WQzJLmX8WLa7B01msU9S3RsAq5YkiSTl5RZ4VSoEw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Environment \u0026 Sustainability and Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"184d349a-93c0-408e-ad37-74b2eb01472d\"}"},{"__ref":"DeepDives:{\"uuid\":\"2deced7b-9437-42ec-a2c4-078ce71660e7\"}"},{"__ref":"DeepDives:{\"uuid\":\"b69cb196-3ffb-4975-ac55-eb26db65ce43\"}"},{"__ref":"DeepDives:{\"uuid\":\"43716c8c-40f0-41d7-9521-67f84a8b032d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8ca0e1ca-6907-4b8c-9e2d-f8503cbe236f/-/preview/-/format/jpg/","https://ucarecdn.com/78885ba6-72b4-47f3-94f7-a56f25b5ad48/-/preview/-/format/jpg/","https://ucarecdn.com/7db77751-52f8-47fa-a8e7-e5e6d72cbdea/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4a07efcb-7291-48a0-af70-17bb3e920d99\"}"},{"__ref":"Education:{\"uuid\":\"97e5805e-539f-46cf-a781-90ab88966cd0\"}"}],"hiredAt":"2026-03-26T15:29:40.552Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Chemistry","Biology","6-8 Grade Science","Writing","French","Academic Coaching","College Essay Writing","Reading","History","Economics","Creative Writing","Film / Theater","History Project","Business / Entrepreneurship","Finance / Investing","STEM Project","Law / Government / Policy","Sustainability","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sasha-masson\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fe327de1-ca3a-4e43-a4c5-d6a1dd99ef50\"}"}}},"_sentryTraceData":"a5bf94d7bb784921b5f5f0688bbb30ca-8e7703837cc0019e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a5bf94d7bb784921b5f5f0688bbb30ca,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sasha-masson"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
