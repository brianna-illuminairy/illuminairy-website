xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"358e55af-b564-4c97-a330-9a1a537e2a16\"}":{"__typename":"DeepDives","uuid":"358e55af-b564-4c97-a330-9a1a537e2a16","content":"\u003cp\u003eIf I could speak to my middle or high school self, I would say:\u003c/p\u003e\u003cp\u003eEmbrace the balance between precision and possibility. Like in engineering, life is shaped by deliberate choices but also by moments of uncertainty. Build with your hands, mind, and heart—true mastery comes from combining knowledge with insight.\u003c/p\u003e\u003cp\u003eRemember, failure is part of the process. Like debugging a robot, every mistake points to new paths. Stay persistent and open to learning.\u003c/p\u003e\u003cp\u003eValue collaboration as much as skill—no machine works alone. Let curiosity guide you as much as logic, and dare to imagine beyond the blueprint. This balance will shape the engineer and thinker I am becoming.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"df57456f-4dc9-4dc0-99bb-9214285aa6f7\"}":{"__typename":"DeepDives","uuid":"df57456f-4dc9-4dc0-99bb-9214285aa6f7","content":"\u003cp\u003eMentorship matters to me because it is a bridge between knowledge and growth, between experience and potential. As someone passionate about robotics and engineering, I know that no one builds mastery alone—mentors provide guidance that accelerates learning, helps me navigate challenges, and expands my perspective beyond what textbooks or solo work can offer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4c3d7de5-8066-4a87-bd18-df414432a573\"}":{"__typename":"DeepDives","uuid":"4c3d7de5-8066-4a87-bd18-df414432a573","content":"\u003cp\u003eEntrepreneur\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"f50e7aa6-e4f2-426c-b414-ae73d06db085\"}":{"__typename":"School","uuid":"f50e7aa6-e4f2-426c-b414-ae73d06db085","name":"Ahmedabad International School","city":"Ahmedabad","type":"HIGH","state":"Gujarat","country":"India","zip":"380015"},"Education:{\"uuid\":\"a705760c-e311-44aa-bd4b-0f034b16d234\"}":{"__typename":"Education","uuid":"a705760c-e311-44aa-bd4b-0f034b16d234","school":{"__ref":"School:{\"uuid\":\"f50e7aa6-e4f2-426c-b414-ae73d06db085\"}"},"startYear":"2022","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"eaae7aa3-e596-422d-a146-7ed1434aa13a\"}":{"__typename":"Education","uuid":"eaae7aa3-e596-422d-a146-7ed1434aa13a","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"7e1e04c3-08f6-40e5-904f-f3e441e130f1\"}":{"__typename":"MentorPublicProfile","uuid":"7e1e04c3-08f6-40e5-904f-f3e441e130f1","displayName":"Vihaan S.","slug":"vihaan-shah","biography":"\u003cp\u003eHi, my name is Vihaan, and I’m an undergraduate student at Columbia University, majoring in Mechanical and Aerospace Engineering with a strong focus on robotics, automation, and intelligent machine design. Throughout my academic journey, I have explored the dynamic intersection of mechanical engineering, electronics, and computer science, allowing me to develop an interdisciplinary skill set that bridges technical innovation with entrepreneurial thinking. My coursework combines mechanical design principles with programming expertise, particularly in Python and ROS2, enabling me to design, build, and experiment with advanced robotic systems. These experiences have provided me with a robust foundation in both the hardware and software aspects of robotics, while also shaping my ability to identify real-world problems and develop scalable, impactful solutions.\u003c/p\u003e\u003cp\u003eIn addition to my classes, I serve as the mechanical lead of an open-source humanoid project within Columbia’s robotics club. This role allows me to work closely with fellow students on the conception, design, and prototyping of next-generation robots aimed at addressing pressing challenges in automation and human–machine collaboration. Collaboration and leadership are central to this process—as I learn from others, manage diverse teams, and contribute my own insights to tackle problems ranging from navigation and control to robust mechanical structures. Leading mechanical projects has not only sharpened my technical expertise but also strengthened my entrepreneurial mindset—teaching me how to take ideas from concept to prototype and ultimately toward real-world application.\u003c/p\u003e\u003cp\u003eBeyond my academic and extracurricular commitments, I have actively pursued entrepreneurial and research initiatives that combine technology and social impact. One such venture, AggroAssist, is an innovative agricultural robot I developed that leverages computer vision to help farmers analyze crop quality more efficiently and affordably. This project, which led to a patented prototype, reflects my passion for creating accessible engineering solutions that empower communities and democratize advanced technology. Through this experience, I learned to navigate every stage of product development—from ideation and technical implementation to user testing and intellectual property protection—reinforcing my interest in technology-driven entrepreneurship.\u003c/p\u003e\u003cp\u003eMy professional and startup experience further extends to an internship at an early-stage company, where I contributed to software development efforts. Working in a fast-paced, innovation-driven environment strengthened my coding and debugging skills while also highlighting the value of adaptability, communication, and iterative problem-solving—core principles in both engineering and entrepreneurship. The blend of my academic background, hands-on project leadership, and practical startup exposure continues to fuel my drive to innovate in the fields of robotics and automation.\u003c/p\u003e\u003cp\u003eOutside of structured settings, I continuously seek opportunities to experiment, prototype, and learn. Whether it’s testing new hardware platforms, exploring emerging machine learning algorithms, or engaging with startup ecosystems, I stay committed to expanding my technical and entrepreneurial toolkit. Ultimately, I aspire to build ventures that merge mechanical precision with intelligent software, driving innovation in robotics that is both practical and socially meaningful. I am motivated by the potential of engineering entrepreneurship to transform industries, improve quality of life, and make advanced technologies more accessible to the world.\u003c/p\u003e","teachingVideoPlaybackId":"5UyhG2Gdq9LeCZlrQgJ97Nf2sGBOXq5Qjtj8couNOQY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"358e55af-b564-4c97-a330-9a1a537e2a16\"}"},{"__ref":"DeepDives:{\"uuid\":\"df57456f-4dc9-4dc0-99bb-9214285aa6f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"4c3d7de5-8066-4a87-bd18-df414432a573\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2c24bf43-bd5a-423b-8ab3-7753c4e1a0e1/-/preview/-/format/jpg/","https://ucarecdn.com/9564c765-03b8-44fe-928f-c5ce79567dba/-/preview/-/format/jpg/","https://ucarecdn.com/ea342da3-5bca-4cdc-8c9b-0d1dfc3e3fab/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a705760c-e311-44aa-bd4b-0f034b16d234\"}"},{"__ref":"Education:{\"uuid\":\"eaae7aa3-e596-422d-a146-7ed1434aa13a\"}"}],"hiredAt":"2025-10-10T20:23:29.102Z","topics":["Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Chemistry","Physics","Academic Coaching","Executive Function","College Essay Writing","Economics","Computer Science","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Machine Learning / AI"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"vihaan-shah\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7e1e04c3-08f6-40e5-904f-f3e441e130f1\"}"}}},"_sentryTraceData":"36fb715bad454397b29a37a8b6179971-96e09e4b30485700-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=36fb715bad454397b29a37a8b6179971,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"vihaan-shah"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"ma
