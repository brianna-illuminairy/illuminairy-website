xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"51993b57-faa4-492f-b2d4-aadcabd7a3ad\"}":{"__typename":"Favorites","uuid":"51993b57-faa4-492f-b2d4-aadcabd7a3ad","photoUrl":"https://ucarecdn.com/5f6a75d1-da52-4171-b78c-40622c5c7938/","title":"When Breathe Becomes Air","type":"BOOK"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f6b63699-c8d3-4c29-848a-85920e5e05a8\"}":{"__typename":"DeepDives","uuid":"f6b63699-c8d3-4c29-848a-85920e5e05a8","content":"\u003cp\u003ePharmaceutical gene therapy research during the day; sitting by the beach with my friends at night\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"e0e640e1-08e7-42b7-9872-812314697328\"}":{"__typename":"DeepDives","uuid":"e0e640e1-08e7-42b7-9872-812314697328","content":"\u003cp\u003eGrowing up, I had mentors who saw strengths I did not yet see in myself. I mentor to do the same, to spark belief, curiosity, and purpose in others.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"629571a4-3911-4fd3-9bac-b6d8f27257d5\"}":{"__typename":"DeepDives","uuid":"629571a4-3911-4fd3-9bac-b6d8f27257d5","content":"\u003cp\u003eSecretary of Health and Human Services\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"093ca103-4a51-4b55-bd7d-b8eddb98087e\"}":{"__typename":"DeepDives","uuid":"093ca103-4a51-4b55-bd7d-b8eddb98087e","content":"\u003cp\u003eExplore every single country in the world for at least 5 days\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"88e5b078-bfe4-46e7-b7a0-037d65d29801\"}":{"__typename":"School","uuid":"88e5b078-bfe4-46e7-b7a0-037d65d29801","name":"Scarsdale High School","city":"Scarsdale","type":"HIGH","state":"New York","country":"United States","zip":"10583"},"Education:{\"uuid\":\"4425b58f-3ac6-489d-81ed-30269ad80da1\"}":{"__typename":"Education","uuid":"4425b58f-3ac6-489d-81ed-30269ad80da1","school":{"__ref":"School:{\"uuid\":\"88e5b078-bfe4-46e7-b7a0-037d65d29801\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"70767e8b-3452-4d18-875f-7187e9e6683f\"}":{"__typename":"Education","uuid":"70767e8b-3452-4d18-875f-7187e9e6683f","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Public Health","degree":null},"MentorPublicProfile:{\"uuid\":\"82d3a623-2e08-4055-88ac-740deae63f81\"}":{"__typename":"MentorPublicProfile","uuid":"82d3a623-2e08-4055-88ac-740deae63f81","displayName":"David D.","slug":"david-duan","biography":"\u003cp\u003eI am a Public Health Concentration at \u003cstrong\u003eBrown University\u003c/strong\u003e, where I focus on how science and medicine can improve care for people often overlooked by the healthcare system. My work combines clinical experience, research, and community engagement to understand what shapes health beyond the hospital.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve cared for patients in the back of a roaring ambulance as an \u003cstrong\u003eEmergency Medical Technician\u003c/strong\u003e, where I saw how lack of insurance, nutrition, and health education can shape every medical outcome. Those conversations taught me that real care goes beyond treatment; it begins with listening, empathy, and prevention. I’ve also worked as an \u003cstrong\u003eoptometry technician\u003c/strong\u003e, assisting patients who struggled to afford basic eye care and learning how access barriers can lead to long-term health challenges. These experiences grounded my view of medicine as both a science and a service.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn research, I study \u003cstrong\u003einfectious diseases\u003c/strong\u003e using mouse models to help develop a potential \u003cstrong\u003eHepatitis C vaccine\u003c/strong\u003e. I also lead a \u003cstrong\u003ehigh-altitude neurology study\u003c/strong\u003e in California that examines how low oxygen levels affect cognitive and motor function, contributing to research on conditions such as \u003cstrong\u003eParkinson’s disease\u003c/strong\u003e. Moreover, I’m conducting \u003cstrong\u003emyopia research in China\u003c/strong\u003e using a large national dataset to study trends in early childhood vision health. Using \u003cstrong\u003eR\u003c/strong\u003e and advanced \u003cstrong\u003estatistical modeling\u003c/strong\u003e, I analyze patterns in prevalence and risk factors to inform future public health policy and vision care. Lastly, my earlier work in \u003cstrong\u003eglobal health nutrition\u003c/strong\u003e analyzed micronutrient interventions to address malnutrition, reinforcing my belief that research should guide practical, community-level solutions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI previously transfered from Cornell University, where I led the \u003cstrong\u003eEngineers in Action project team\u003c/strong\u003e, I helped design and implement sustainable infrastructure in \u003cstrong\u003eEswatini\u003c/strong\u003e, where our group built water reservoirs to improve community access to clean water. I authored and illustrated educational pamphlets on \u003cstrong\u003ewater sanitation, hygiene, and disease prevention\u003c/strong\u003e for local schools, aiming to make public health information accessible and actionable for children. This experience reminded me that improving health often starts with education and collaboration, not just technology.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics and service, I love playing baseball, basketball, and volleyball. I’ve always been a huge Yankees fan. I find that sports teach the same lessons that medicine does: communication, awareness, and the ability to adapt under pressure. I also play drum set, piano, and guitar with music being creative outlet that keeps me grounded. Whether performing in a group or practicing alone, it reminds me that rhythm, like health, depends on balance and connection.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of research, I serve as a leader in \u003cstrong\u003eCornell Votes\u003c/strong\u003e, where I help students understand how civic engagement connects to public health and collective well-being. I believe the antidote to polarization begins with informed, active communities who see participation as part of public health.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I value empathy and perspective. I enjoy working with students who want to explore how medicine and public health come together to shape people’s lives. My goal is to help them connect what they learn to real communities and leave with confidence, curiosity, and the drive to make lasting impact.\u003c/p\u003e","teachingVideoPlaybackId":"S31LX7WtufeaMT00mSFquOO24EhKv3WnyJ78NbvGPGSk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"51993b57-faa4-492f-b2d4-aadcabd7a3ad\"}"}],"causesSupported":[],"major":"Public Health","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f6b63699-c8d3-4c29-848a-85920e5e05a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"e0e640e1-08e7-42b7-9872-812314697328\"}"},{"__ref":"DeepDives:{\"uuid\":\"629571a4-3911-4fd3-9bac-b6d8f27257d5\"}"},{"__ref":"DeepDives:{\"uuid\":\"093ca103-4a51-4b55-bd7d-b8eddb98087e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3dff3253-d1c6-47b4-a8da-1b170cb345f8/-/preview/-/format/jpg/","https://ucarecdn.com/293f15c5-7a81-41ae-907e-d000a75c89e4/-/preview/-/format/jpg/","https://ucarecdn.com/36357538-86a1-44f0-88d2-b5023efd86f6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4425b58f-3ac6-489d-81ed-30269ad80da1\"}"},{"__ref":"Education:{\"uuid\":\"70767e8b-3452-4d18-875f-7187e9e6683f\"}"}],"hiredAt":"2025-10-24T04:10:25.090Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Medicine / Health","STEM Project","Law / Government / Policy","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"david-duan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"82d3a623-2e08-4055-88ac-740deae63f81\"}"}}},"_sentryTraceData":"7070d46b89c24ec4aa504f22dc1a66cd-9710d1f979b27efb-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7070d46b89c24ec4aa504f22dc1a66cd,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"david-duan"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
