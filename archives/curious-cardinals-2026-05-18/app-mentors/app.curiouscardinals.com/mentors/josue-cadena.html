xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0a88466a-df6a-44e7-a363-23addd392268\"}":{"__typename":"Favorites","uuid":"0a88466a-df6a-44e7-a363-23addd392268","photoUrl":"https://ucarecdn.com/b559aad9-7951-4594-a454-1ef1315f6cda/","title":"The Book of Isaiah ","type":"BOOK"},"Favorites:{\"uuid\":\"1fa8513e-5af0-4522-b4fb-ab4c37c36ea6\"}":{"__typename":"Favorites","uuid":"1fa8513e-5af0-4522-b4fb-ab4c37c36ea6","photoUrl":"https://ucarecdn.com/623f1287-b04b-4f45-aa2c-b3c6cdbfba21/","title":"Boxing","type":"SPORT"},"Favorites:{\"uuid\":\"51dcbf1b-4b13-451b-a963-9f4592dbcd18\"}":{"__typename":"Favorites","uuid":"51dcbf1b-4b13-451b-a963-9f4592dbcd18","photoUrl":"https://ucarecdn.com/a65ed825-d1c5-440a-9fb4-6253ecd25217/","title":"George Washington (2000)","type":"MOVIE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4ddb41be-d9c9-44e4-a660-864896048601\"}":{"__typename":"DeepDives","uuid":"4ddb41be-d9c9-44e4-a660-864896048601","content":"\u003cp\u003eMy whole life I experienced an absence of mentorship. There was a lack of older men in my community who were equipped to pour into me and serve as good role models for me to build a solid foundation for enjoying and pursuing aspirations. I have been blessed to arrive in a place filled with abundant resources and information which can now equip me to pour into a younger generation of students who have the chance to obtain things which I wish I had access to when I was their age. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c2309cd0-f876-44c8-b3b3-8656964eb960\"}":{"__typename":"DeepDives","uuid":"c2309cd0-f876-44c8-b3b3-8656964eb960","content":"\u003cp\u003eI truly believe Film and Media have a powerful effect on the way in which we view ourselves and those around us. I came under the conviction that there is a disparity between the perpetual ongoing struggles of certain communities and the representation they receive in media. I also believe the stories within modern Film and Media are failing to provide necessary narratives of hope, redemption, and reconciliation that our souls are longing for. It is my desire to create media that will push these narratives forth and make the overlooked feel seen. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b88701f5-d6a9-445a-8bf8-aa5c1bf0a7fb\"}":{"__typename":"DeepDives","uuid":"b88701f5-d6a9-445a-8bf8-aa5c1bf0a7fb","content":"\u003cp\u003eI would tell my younger self to remain elastic. To not be conformed to the world around me but instead be renewed by the circumstances that I am facing as a means to be transformed and accordingly adapt and become joyful in whichever situation I find myself in. Once you make a habit of being content in your current circumstances, you are able to fully appreciate what the future has in store with an open mind and an open heart. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3f00920e-29d6-41e2-b01a-0211542ffaaf\"}":{"__typename":"DeepDives","uuid":"3f00920e-29d6-41e2-b01a-0211542ffaaf","content":"\u003cp\u003eI am currently working on a documentary about myself, a former amateur boxer turned college student and my close friend, a starter on the Yale football team. The documentary will explore the ways our paths have crossed and formed a unique bond.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"7812500e-af82-4e76-a582-4655a373141c\"}":{"__typename":"School","uuid":"7812500e-af82-4e76-a582-4655a373141c","name":"Wallace-Rose Hill High School","city":"Teachey","type":"HIGH","state":"North Carolina","country":"United States","zip":"28464"},"Education:{\"uuid\":\"3f43fb5e-1c87-4542-8d59-82da78f3e07a\"}":{"__typename":"Education","uuid":"3f43fb5e-1c87-4542-8d59-82da78f3e07a","school":{"__ref":"School:{\"uuid\":\"7812500e-af82-4e76-a582-4655a373141c\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"28395a13-f265-407e-b5ee-467809a06cc2\"}":{"__typename":"Education","uuid":"28395a13-f265-407e-b5ee-467809a06cc2","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Film and Media Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"21b3beed-b694-470f-9e2d-673312c5ed9b\"}":{"__typename":"MentorPublicProfile","uuid":"21b3beed-b694-470f-9e2d-673312c5ed9b","displayName":"Josue C.","slug":"josue-cadena","biography":"\u003cp\u003eHello, I am Josue Cadena, a second-year student at Yale University studying Film and Media Studies. I deeply care about the stories we tell about ourselves and the stories we tell about others. We make history every day, and I want to be an integral part of the truth, love, and hope that are front and center in the stories of our time. Thus, I have focused on documentary filmmaking, screenwriting, and film theory while at Yale to deepen my understanding of how films are constructed and how they shape our societal perspectives. Interestingly, although I began learning and immersing myself in filmmaking in February of 2025, I have been telling stories my whole life. Whether it's through public speaking, poetry, or college/scholarship application essays, I have learned how to communicate stories to others, no matter their educational, racial, or economic background. Coming from a small town in rural, coastal North Carolina and a First-Generation Low-Income background, I have learned how to persevere when functioning off of scarcity. Being faithful over little allows you to become prepared to be faithful over much. I truly believe the next step for me is to mentor young students who have acknowledged that they are human, that they have weaknesses, and that they are humble enough to seek wisdom and guidance because they know they can go farther when they are with others as opposed to by themselves.\u003c/p\u003e\u003cp\u003eI earnestly desire to share with students what I have learned, and I am prepared to assist in various ways. Whether it's through planning the creation of a short film, writing a screenplay for the first time, applying to top universities, understanding scholarship applications, preparing for interviews, or even learning how to remain hopeful in the midst of failures, I am prepared to impart wisdom and knowledge that is applicable to all students. \u003c/p\u003e\u003cp\u003eI truly believe I am a living and breathing example of the fact that anyone can make it if they have faith, and that the journey does not have to be defined by solitude but instead can be defined by sharing ourselves with others, through our stories, joy, sufferings, and resilience. \u003c/p\u003e","teachingVideoPlaybackId":"nKMrQHM6dFh1tEDt3Nx01Z2WIl8yQugDxW1BUqKKrYLY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0a88466a-df6a-44e7-a363-23addd392268\"}"},{"__ref":"Favorites:{\"uuid\":\"1fa8513e-5af0-4522-b4fb-ab4c37c36ea6\"}"},{"__ref":"Favorites:{\"uuid\":\"51dcbf1b-4b13-451b-a963-9f4592dbcd18\"}"}],"causesSupported":[],"major":"Film and Media Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4ddb41be-d9c9-44e4-a660-864896048601\"}"},{"__ref":"DeepDives:{\"uuid\":\"c2309cd0-f876-44c8-b3b3-8656964eb960\"}"},{"__ref":"DeepDives:{\"uuid\":\"b88701f5-d6a9-445a-8bf8-aa5c1bf0a7fb\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f00920e-29d6-41e2-b01a-0211542ffaaf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/be03a2ea-d8b8-43b5-b753-e15d0a13f86a/-/preview/-/format/jpg/","https://ucarecdn.com/fe88fc42-602f-4138-9586-36eef5f41204/-/preview/-/format/jpg/","https://ucarecdn.com/84889ab8-b57c-48c6-b9c1-a36fc70b9e1a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3f43fb5e-1c87-4542-8d59-82da78f3e07a\"}"},{"__ref":"Education:{\"uuid\":\"28395a13-f265-407e-b5ee-467809a06cc2\"}"}],"hiredAt":"2026-01-19T18:38:02.536Z","topics":["Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","Creative Writing","Music","Film / Theater","Video / Photography","Public Speaking"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"josue-cadena\"}})":{"__ref":"MentorPublicProfile:{\"uuid\
