xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ed18240f-7635-46ae-8ab6-bac572a793ca\"}":{"__typename":"DeepDives","uuid":"ed18240f-7635-46ae-8ab6-bac572a793ca","content":"\u003cp\u003eEverything happens for a reason! I would encourage my younger self to be open to numerous outcomes. As much as I loved creating a plan and sticking to it, I learned that some of the best opportunities I came across where entirely unexpected. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ee5aea9c-a77a-48b5-bcfa-b60fdac0037b\"}":{"__typename":"DeepDives","uuid":"ee5aea9c-a77a-48b5-bcfa-b60fdac0037b","content":"\u003cp\u003eMentorship is important to me because of the support and comfort it provides while simultaneously keeping the mentee motivated and inspired. It is a unique connection and one that has helped me reach where I am now as a previous research mentee!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"96924256-e5c8-47f7-8ccf-80093f998cc6\"}":{"__typename":"DeepDives","uuid":"96924256-e5c8-47f7-8ccf-80093f998cc6","content":"\u003cp\u003eI hope to one day see all seven wonders of the world! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d6f5a5df-9ec3-46e7-9e01-b023676147ee\"}":{"__typename":"DeepDives","uuid":"d6f5a5df-9ec3-46e7-9e01-b023676147ee","content":"\u003cp\u003eI always knew I wanted to pursue medicine because I was fascinated by the intricacies of cell division and signaling required for healthy functioning. However, during my last year of college, I volunteered on the surgical floor of NY-Columbia Pres and saw first hand how policies and socioeconomic standing played a role in final treatment plans. At Penn, I was able to pursue the pre-medical path while also understanding the business of medicine in hopes of making a long lasting change on the healthcare system post grad. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"827ad056-5265-41ee-b251-7b533f39fcfc\"}":{"__typename":"School","uuid":"827ad056-5265-41ee-b251-7b533f39fcfc","name":"Bergen County Academies","city":"Hackensack","type":"HIGH","state":"New Jersey","country":"United States","zip":"07601"},"Education:{\"uuid\":\"27a6b315-1282-4e41-bcb6-7f38a4fed848\"}":{"__typename":"Education","uuid":"27a6b315-1282-4e41-bcb6-7f38a4fed848","school":{"__ref":"School:{\"uuid\":\"827ad056-5265-41ee-b251-7b533f39fcfc\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type
