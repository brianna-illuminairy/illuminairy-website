xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f7ab0946-61bf-479b-8bdc-305e19140ca0\"}":{"__typename":"DeepDives","uuid":"f7ab0946-61bf-479b-8bdc-305e19140ca0","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003eLife Project: continually improving ones life by refining empirical systems to maximize life through first principles and simplicity. Reading Malcolm Gladwell’s books (initially “Outliers”) in 10th grade triggered it with existential questions about free will, and the small, often ignored things that often have an outsized impact. In freshman year my learnings of quantum mechanics furthered my interest in the matter (whether the universe is probabilistic vs deterministic). This led me to the thought exercise I later learned was called Laplace’s Demon: if you had all the information in the universe with the ability to compute it, you could predict (or control) your future. This, combined with Tim Ferriss and introduction to the Quantified-Self movement, created an obsession with collecting as much data as possible to optimize my future. Over time, and especially within the last year, I have learned that I focused too closely on complex systems and marginal optimizations, so now look for the simplest answers. Life Project has mostly taken the form of personal no-code apps/systems, and I’m not quite sure where it will go or become, but it’s a never ending passion of mine.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"3ade81c2-9368-4a92-aef1-440f631b8395\"}":{"__typename":"DeepDives","uuid":"3ade81c2-9368-4a92-aef1-440f631b8395","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003eI wanted to be on the cast of Mythbusters. My favorite show at the time, a perfect polymathic blend resolving fact and fiction, myth with reality, without promise of a definite resolution. I enjoy public speaking and entertaining people, having and sharing fun on the way to solving interesting problems to increase humanity’s understanding. The way in which they iterated every project, starting what the simplest way to test before doing increasingly complex tests as needed, was a great initial lesson in prototyping and empirical evidence collection.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"badcbe73-3848-42df-b7a0-49f5a6cccff3\"}":{"__typename":"DeepDives","uuid":"badcbe73-3848-42df-b7a0-49f5a6cccff3","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003eI’ve had many learnings in my entrepreneurial journey over the past few years, and have always enjoyed helping others. I wished to pursue more mentorship and support from those a few steps ahead of me on the journey, so I now want to pass give that to others. Since I’ve started entrepreneurship, many friends and peers have come to me for advice in starting their own ventures, and I’ve always loved giving them guidance and advice. I’ve also always enjoyed working with those younger than me, and selfishly Richard Feynman’s quote \"If you can't explain it to a six-year-old, you don't understand it yourself” also drives my eternal desire to better understand through conveying them to others. Lastly, mentorship is always a two ways street; while I can pass on learnings from my experience and accumulated knowledge, I can learn new, fresh perspectives from a mind less hardened and scarred by the passage of time.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"434b219e-e054-4e87-9345-fedd818eb9c3\"}":{"__typename":"DeepDives","uuid":"434b219e-e054-4e87-9345-fedd818eb9c3","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003eI would pass on my list of personal principles, which could help serve as a guiding framework, with the insight that they still must be experienced and lived through to be properly learned. In that vain, I would pass on the highest-impact principle I’ve learned to date: bias to action. Especially in the modern age, with access to seemingly limitless information and seeing people do any and everything, it is easy to get analysis paralysis: What if I don’t make the right choice? What if I regret this decision? What if that person says no or I don’t like the outcome? Once you start analyzing decisions through Jeff Bezos’ frame of one-way doors vs. two-way doors (irreversible vs. reversible) decisions, you realize most decisions are not as consequential as you think, and two-way door decisions should be made with ~80% certainty. Any more and you’re wasting time you’ll never get back. So often in my life, I’ve spent enough time thinking about which decision to make that I already could have made the wrong decision, corrected it, and made a few more decisions down my life. The world is more forgiving than we often believe. Most decisions are fixable, the best lessons are learned through mistakes, and people are more willing to help than you could ever imagine. Try that experiment, talk to that girl, do that goofy dance, ask that important person the question. You’ve got one life to live, and it’s your responsibility to give it your all!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"c8eaa669-bab0-43d4-83b3-4dc54decf188\"}":{"__typename":"Education","uuid":"c8eaa669-bab0-43d4-83b3-4dc54decf188","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a580e572-edab-4996-9750-c1676b2e24bb\"}":{"__typename":"School","uuid":"a580e572-edab-4996-9750-c1676b2e24bb","name":"University of Michigan College of Engineering","city":"Ann Arbor","type":"COLLEGE","state":"Michigan","country":"United States","zip":"48109"},"Education:{\"uuid\":\"a191a012-bb8c-40c8-ae47-1f26aedbf1ab\"}":{"__typename":"Education","uuid":"a191a012-bb8c-40c8-ae47-1f26aedbf1ab","school":{"__ref":"School:{\"uuid\":\"a580e572-edab-4996-9750-c1676b2e24bb\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"1f741888-d2f5-483f-ad6a-a7cc96849897\"}":{"__typename":"MentorPublicProfile","uuid":"1f741888-d2f5-483f-ad6a-a7cc96849897","displayName":"Ian W.","slug":"ian-watts","biography":"\u003cp\u003eHowdy! I'm Ian, an engineering-oriented polymath who loves solving everyday problems, learning and sharing along the way. I relish in exploring the entire problem space, with a hands-on exploration of all aspects. I love deepening my understanding of existing skills like engineering and learning new ones like sales and marketing. I studied mechanical engineering in college, with classes/clubs/programs in entrepreneurship, for a deep and broad understanding of designing and manufacturing hardware.\u003cbr\u003e\u003cbr\u003eMy tutoring ethos is to teach a man to fish. Especially in project-based learning, there's no right answer or grades. Cheating and shortcuts reap no reward. The goal is not just to solve the problem at hand, but to equip yourself with the skills and insights to tackle similar challenges independently in the future. Build a first-principles foundation and then construct a tailored learning path. I take a principled approach to life, constantly updating and refining them. You can find a list of my principles here (https://www.icloud.com/notes/083x26TJx0FKARn_Uxexe5qCg#principles). Every time I learn and apply a new mental model, I either add it as a new entry in the list or incorporate it as another example/synonym of an existing principle.\u003cbr\u003e\u003cbr\u003eProfessionally, I have experience in end-to-end product development including CAD, CNC programming \u0026amp; milling, finishing procedures, packaging, fulfillment, branding, content, Shopify web design, patenting, taxes, and compliance. Going from idea to released product has provided a litany of lessons (with more every day). It’s been a relentless pursuit balancing new learning and continual refinement. Projects include\u003c/p\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e- My brother and I’s lightbox which fills environments with dynamic light to influence mood \u0026amp; energy, especially at night. A microcontroller with microphone, vibration, \u0026amp; movement sensors allow interactive LED strip control. Documented through buildspace (buildspace.so) and Instagram (https://www.instagram.com/watts.in.the.box/), we will be returning to this project shortly.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- I co-founded a company called FrameDaddy (https://www.instagram.com/p/ClmcS6ljrux/) (no longer going), building an AI iMessage chatbot to allow customers to seamlessly order framed photos. Initially used no-code tools before learning how to build a web app.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e- Freelance developer work for Bloody Sunday Yearbook (https://www.instagram.com/sunday/)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cbr\u003eA core focus of my tutoring will be the practice of leveraging all AI has to offer, regardless of subject matter (in fact it helped me write this). Since ChatGPT's (or “Chat” as I call it) release last November, I've leveraged AI daily to lower barriers to entry, offload cognitive work, and act as a sounding board to brainstorm, organize, and refine ideas. From morning journaling and life planning, to engineering and marketing, to any thoughts I want to explore further, I always have it ready. It's replaced Google as my default knowledge tool, and has been especially essential in my learning of web-app development and the Adobe Creative Cloud suite in recently. I use other AI-first tools for coding (Cursor) and content (Descript, Midjourney).\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"rKAJOgKWEZisdpKO00hQGUUUPoYB017wjHipKQD548FHw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f7ab0946-61bf-479b-8bdc-305e19140ca0\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ade81c2-9368-4a92-aef1-440f631b8395\"}"},{"__ref":"DeepDives:{\"uuid\":\"badcbe73-3848-42df-b7a0-49f5a6cccff3\"}"},{"__ref":"DeepDives:{\"uuid\":\"434b219e-e054-4e87-9345-fedd818eb9c3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3014a9d9-1eb8-4b9d-8e1c-d7ef169209af/-/preview/-/format/jpg/","https://ucarecdn.com/aa4f12ec-8879-4765-91e1-faeec372a6b3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c8eaa669-bab0-43d4-83b3-4dc54decf188\"}"},{"__ref":"Education:{\"uuid\":\"a191a012-bb8c-40c8-ae47-1f26aedbf1ab\"}"}],"hiredAt":"2023-09-28T00:06:23.125Z","topics":["Business / Entrepreneurship","Product Design","Robotics / Electronics / CAD","Coding / Programming","Machine Learning / AI","Web Design","Finance / Investing"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/c278d819-50e0-435a-a1b0-1b3a8793462f/","https://ucarecdn.com/bc931f8b-f00f-4064-8767-bece7541c20e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ian-watts\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1f741888-d2f5-483f-ad6a-a7cc96849897\"}"}}},"_sentryTraceData":"ad72ce48cd434eda8f48a2dd7887c44d-b815f07da12517b4-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ad72ce48cd434eda8f48a2dd7887c44d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ian-watts"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f
