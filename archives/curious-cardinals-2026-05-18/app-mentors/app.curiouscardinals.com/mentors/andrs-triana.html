xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a50ce0f1-70c7-48e1-9fa7-8bade778af34\"}":{"__typename":"DeepDives","uuid":"a50ce0f1-70c7-48e1-9fa7-8bade778af34","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to hear — and help honor — as many people’s stories as I can. I’m deeply motivated by the belief that every person carries a unique way of understanding the world, shaped by culture, memory, and lived experience. Whether through research, teaching, or everyday conversations, I want to create spaces where people feel genuinely seen and listened to. For me, collecting stories isn’t just about curiosity; it’s about building empathy, preserving knowledge, and connecting different worlds. If I can spend my life learning from others and helping their voices travel further, I’ll feel that I’ve lived with purpose.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"797bcacb-8b5b-4107-9053-3422c2667e11\"}":{"__typename":"DeepDives","uuid":"797bcacb-8b5b-4107-9053-3422c2667e11","content":"\u003cp\u003eMentorship matters because it transforms learning into a shared journey rather than a solitary challenge. A good mentor offers more than advice — they provide perspective, encouragement, and honest feedback that helps people grow with confidence. Through mentorship, knowledge becomes more accessible, mistakes become opportunities, and goals feel more achievable. It creates space for curiosity, accountability, and personal development while reminding us that growth doesn’t happen in isolation. Whether in academics, creative work, or everyday life, mentorship builds bridges between experience and potential, helping individuals discover their strengths, refine their voice, and move forward with greater clarity and purpose.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"c88cd8dc-7d2b-4d92-bac3-db4d2bf098e6\"}":{"__typename":"DeepDives","uuid":"c88cd8dc-7d2b-4d92-bac3-db4d2bf098e6","content":"\u003cp\u003eMy experience as a queer Venezuelan Latinx immigrant in Miami deeply shapes how I teach and connect with students. Moving between cultures and languages taught me that learning isn’t one-size-fits-all — people bring different histories, insecurities, and strengths into the room. Because of that, I prioritize creating a space that feels affirming, flexible, and culturally aware, where students feel safe to take risks and express themselves fully. I’m especially attentive to how identity, language, and power show up in education, so I try to meet students with empathy while still encouraging growth and accountability. My background helps me value curiosity, resilience, and creativity, and I aim to make my teaching collaborative, inclusive, and grounded in real-world experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"49db91f6-41b7-4268-8a28-a91a7b1505ce\"}":{"__typename":"DeepDives","uuid":"49db91f6-41b7-4268-8a28-a91a7b1505ce","content":"\u003cp\u003eI chose my major because I felt a growing dissatisfaction with how environmental science and sustainability were often framed purely through a technical or scientific lens, without fully engaging the human stories behind environmental change. While I value scientific knowledge, I became more interested in the cultural, social, and historical ways people build relationships with their environments — how identity, inequality, and lived experience shape what sustainability actually looks like on the ground. Studying social anthropology alongside environmental studies allowed me to bridge those worlds, asking not only \u003cem\u003ewhat\u003c/em\u003e is happening ecologically, but \u003cem\u003ehow\u003c/em\u003e people understand, negotiate, and care for their surroundings. My major reflects a desire to approach environmental issues more holistically, centering human perspectives, ethics, and community knowledge alongside science.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"98858eaa-9f11-4db1-9bf7-aa58d9aae3ec\"}":{"__typename":"School","uuid":"98858eaa-9f11-4db1-9bf7-aa58d9aae3ec","name":"Mater Lakes Academy Middle/High School","city":"Hialeah","type":"HIGH","state":"Florida","country":"Estados Unidos","zip":"33015"},"Education:{\"uuid\":\"e176dedc-4b99-412e-91b3-d2f4811406ea\"}":{"__typename":"Education","uuid":"e176dedc-4b99-412e-91b3-d2f4811406ea","school":{"__ref":"School:{\"uuid\":\"98858eaa-9f11-4db1-9bf7-aa58d9aae3ec\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9c4ee8c7-689d-45a4-a2d8-2af83c5c81b5\"}":{"__typename":"School","uuid":"9c4ee8c7-689d-45a4-a2d8-2af83c5c81b5","name":"Universidade Harvard","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"Estados Unidos","zip":"02138"},"Education:{\"uuid\":\"60a9595a-b070-4651-91b9-08ca805324f6\"}":{"__typename":"Education","uuid":"60a9595a-b070-4651-91b9-08ca805324f6","school":{"__ref":"School:{\"uuid\":\"9c4ee8c7-689d-45a4-a2d8-2af83c5c81b5\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Social Anthropology + Environmental Science \u0026 Public Policynmenta","degree":null},"MentorPublicProfile:{\"uuid\":\"729a0035-393b-4a6b-b232-7961802b3cb9\"}":{"__typename":"MentorPublicProfile","uuid":"729a0035-393b-4a6b-b232-7961802b3cb9","displayName":"Andrés T.","slug":"andrs-triana","biography":"\u003cp\u003eHi! I’m a Miami-raised, globally curious tutor currently pursuing my PhD at Yale in social anthropology and environmental studies, after graduating from Harvard in 2023 with a double background in social anthropology and environmental science. My academic path has always been driven by a fascination with how people make meaning, build communities, and relate to the environments around them — and that curiosity shapes the way I teach.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy work — and my tutoring style — is rooted in helping students connect ideas across disciplines while strengthening their own voice. Whether we’re working on language, writing, or big-picture thinking, I like to create a space where learning feels collaborative, engaging, and empowering rather than stressful or rigid. I believe students do their best when they feel supported and genuinely excited about what they’re exploring.\u003c/p\u003e\u003cp\u003eOutside of research, I’m someone who loves movement, creativity, and experimentation. You’ll probably find me outdoors, working out, trying a new recipe, or designing something visual. I have extensive experience in website design, UX/UI, and art, and I often bring that creative energy into sessions — especially when helping students organize ideas visually, approach projects in innovative ways, or build confidence presenting their work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy tutoring style is warm, outgoing, and student-centered. I see learning as a conversation: we ask questions, test ideas, make mistakes, and grow from them. I especially enjoy helping students improve communication skills, refine academic writing, brainstorm research topics, or practice speaking with more confidence and clarity. For language learners, I focus not only on accuracy but also on helping you sound natural and feel comfortable expressing who you are.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause I’ve lived and studied in diverse cultural spaces — from Miami to the Ivy League to international research environments — I bring a cross-cultural perspective that values openness, adaptability, and curiosity. I aim to meet students where they are and help them build tools that last beyond a single session.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re a “curious cardinal” 🐦 looking for a tutor who is supportive, creative, and genuinely enthusiastic about learning, you’re in the right place. Let’s build skills, share ideas, and make learning feel energizing, thoughtful, and fun — because every day is a great day to grow together.\u003c/p\u003e","teachingVideoPlaybackId":"jyLYc9p69UwtK5LD201crDLkj02d5i839N8h00kzKz7Hug","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Social Anthropology + Environmental Science \u0026 Public Policynmenta","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a50ce0f1-70c7-48e1-9fa7-8bade778af34\"}"},{"__ref":"DeepDives:{\"uuid\":\"797bcacb-8b5b-4107-9053-3422c2667e11\"}"},{"__ref":"DeepDives:{\"uuid\":\"c88cd8dc-7d2b-4d92-bac3-db4d2bf098e6\"}"},{"__ref":"DeepDives:{\"uuid\":\"49db91f6-41b7-4268-8a28-a91a7b1505ce\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5ea48468-a5f0-4bf9-9540-91f9cbf7e11b/-/preview/-/format/jpg/","https://ucarecdn.com/0938af48-5096-4bca-a73a-2f9f18c25d2e/-/preview/-/format/jpg/","https://ucarecdn.com/068247c3-952c-47f5-bdb3-a8f3f7e573bb/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e176dedc-4b99-412e-91b3-d2f4811406ea\"}"},{"__ref":"Education:{\"uuid\":\"60a9595a-b070-4651-91b9-08ca805324f6\"}"}],"hiredAt":"2026-02-07T02:56:04.990Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","History","Reading","K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","History Project","Video / Photography","Web Design","Game Design","Sustainability","Journalism","Public Speaking","Law / Government / Policy","Debate"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"andrs-triana\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"729a0035-393b-4a6b-b232-7961802b3cb9\"}"}}},"_sentryTraceData":"65123a2d8ad0418f887fdfae6d9f56e5-8b3c4ea2e257e244-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=65123a2d8ad0418f887fdfae6d9f56e5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"andrs-triana"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[
