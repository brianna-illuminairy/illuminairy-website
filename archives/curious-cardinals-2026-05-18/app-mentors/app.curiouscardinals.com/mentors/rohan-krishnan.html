xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"bf912f59-10d2-43bd-83d9-57f786ee7961\"}":{"__typename":"DeepDives","uuid":"bf912f59-10d2-43bd-83d9-57f786ee7961","content":"\u003cp\u003eMentorship is a crucial component in the journey of personal and professional development. I believe that mentorship provides individuals with the necessary guidance and support to navigate complex challenges and make informed decisions. For refugees and migrants, who often face significant cultural and systemic barriers, having a mentor can be particularly transformative. Effective mentorship empowers individuals by boosting their confidence and helping them recognize their own potential. Through my work with IRIS, I have seen firsthand how mentorship can inspire refugees to pursue their educational and career goals, despite the adversities they face.\u003c/p\u003e\u003cp\u003eMentors play a pivotal role in helping mentees develop essential skills, encompassing both professional and soft skills such as communication, time management, and problem-solving. My role in the College and Career Readiness Program at IRIS involves mentoring refugees to equip them with the skills necessary for academic and career success. Additionally, mentorship helps individuals build valuable networks and connections that can open doors to opportunities and resources. For refugees and immigrants, who may lack established networks in their new communities, mentors can provide critical connections and introductions.\u003c/p\u003e\u003cp\u003eFurthermore, mentors serve as role models, offering inspiration and a vision of what is possible. Seeing someone who has successfully navigated similar challenges can motivate mentees to strive for their own goals. My journey and achievements serve as a testament to the power of having strong mentors and the impact they can have. Mentorship is not just beneficial for the mentee but also for the mentor. Engaging in mentorship allows individuals to grow personally, gain new perspectives, and develop a deeper understanding of the issues facing refugees. This reciprocal relationship enriches both parties and fosters a supportive community. In essence, I believe that mentorship is a powerful tool for fostering resilience, growth, and success, creating a ripple effect that extends beyond the immediate relationship to impact communities and future generations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"7839f648-3029-40e9-97e1-d5464118ae24\"}":{"__typename":"School","uuid":"7839f648-3029-40e9-97e1-d5464118ae24","name":"Worcester Academy","city":"Worcester","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01604"},"Education:{\"uuid\":\"a33003d4-1e60-4de0-aec4-5ab88fd34f8a\"}":{"__typename":"Education","uuid":"a33003d4-1e60-4de0-aec4-5ab88fd34f8a","school":{"__ref":"School:{\"uuid\":\"7839f648-3029-40e9-97e1-d5464118ae24\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"d7ddbce5-39a8-4062-a0f6-a961f87a0ec1\"}":{"__typename":"Education","uuid":"d7ddbce5-39a8-4062-a0f6-a961f87a0ec1","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Global Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"3c8ce402-c928-4208-b12a-6eeead3ec776\"}":{"__typename":"MentorPublicProfile","uuid":"3c8ce402-c928-4208-b12a-6eeead3ec776","displayName":"Rohan K.","slug":"rohan-krishnan","biography":"\u003cp\u003eI am a recent graduate of Yale University, where he studied at Morse College and completed a double major in Global Affairs and Political Science. My academic journey was marked by a deep-seated passion for understanding and addressing the complex issues facing refugees and migrants, particularly in the Middle East. My interest in these issues will allow me to help students with advanced courses such as AP US History, AP World History, and AP European History.\u003c/p\u003e\u003cp\u003eMy interest in the world was fostered in high school when I was granted two separate fully-funded scholarships to travel to Morocco and Japan. Firstly, I had the opportunity to travel to Morocco and learn Arabic through a State Department funded program where I learned about Middle Eastern culture, history, and society. Then, I was also given a AIG scholarship to travel to Japan as a cultural ambassador. This experience heightened by ability to understand different cultures and enhanced my diplomatic skills. These experiences abroad will enable me to guide students on subjects such as AP US History, AP World History, and help students engage in meaningful extra-curricular activities such as Model UN.\u003c/p\u003e\u003cp\u003eFrom my freshman year, I have been a dedicated volunteer with Integrated Refugee \u0026amp; Immigrant Services (IRIS), a non-profit organization based in New Haven that provides comprehensive support to refugees and immigrants. Through my commitment to this organization, I eventually became the Director of the College Career Readiness Program. In this capacity, I have worked tirelessly to develop and implement programs that assist refugees in navigating the educational system and preparing for their future careers, demonstrating his leadership and deep empathy. Through these experiences, I have learned how to effectively facilitate community projects and foster a sense of purpose towards a shared cause.\u003c/p\u003e\u003cp\u003eMy work with IRIS and my academic excellence earned him recognition as an exceptional graduate by Yale News. This accolade highlights my significant contributions to the refugee community and his potential for future impact. My experiences at Yale and with IRIS have solidified my resolve to continue his advocacy and support for refugees on a broader scale.\u003c/p\u003e\u003cp\u003eFurthermore, at Yale, I served as a senior admissions interviewer, where I had the opportunity to interview prospective Yale applicants and coordinate the Yale Admissions team. This experience gave me a better understanding of the admissions process holistically and what types of admissions officers are looking for in community service contributions.\u003c/p\u003e\u003cp\u003eIn the future, I intend to pursue a law degree, which will equip me with the specialized skills needed to provide legal assistance to refugees. I believe that legal expertise is crucial in addressing the myriad challenges refugees face, from securing asylum to navigating the complexities of immigration law. My aspiration to become a legal advocate for refugees is driven by my commitment to justice and my desire to make a meaningful difference in their lives.\u003c/p\u003e\u003cp\u003eIn my free time, I enjoy playing poker and table tennis with friends, activities that provide him with a balance between my intense professional commitments and personal relaxation.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Rh8Cnqdf6cGF8EsLlPgeN0000dcnSs4EntnVKFjMXwwVE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Global Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bf912f59
