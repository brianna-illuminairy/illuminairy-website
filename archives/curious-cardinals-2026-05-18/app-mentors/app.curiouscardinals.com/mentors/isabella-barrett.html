xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f9b10886-3236-499d-92f1-d144b5f0f1db\"}":{"__typename":"Favorites","uuid":"f9b10886-3236-499d-92f1-d144b5f0f1db","photoUrl":"https://ucarecdn.com/e36d1ae5-e72a-4695-b799-c0cd13a0a774/","title":"New York Knicks","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"57deef22-0af5-4980-87fc-c826f8c6f578\"}":{"__typename":"Favorites","uuid":"57deef22-0af5-4980-87fc-c826f8c6f578","photoUrl":"https://ucarecdn.com/c15c70d4-abe4-4a9e-a322-9a89ab023723/","title":"Rumors by Fleetwood Mac","type":"ALBUM"},"Favorites:{\"uuid\":\"68972352-107f-4dd8-9917-f51bcb8e6b76\"}":{"__typename":"Favorites","uuid":"68972352-107f-4dd8-9917-f51bcb8e6b76","photoUrl":"https://ucarecdn.com/b54717f0-c480-47bc-a682-986d33800703/","title":"George Seraut","type":"ARTIST"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"cec4e124-cbdd-49d9-b786-6ec04131ac2b\"}":{"__typename":"DeepDives","uuid":"cec4e124-cbdd-49d9-b786-6ec04131ac2b","content":"\u003cp\u003eI’m creating a travel journal that captures the places I’ve been and hope to visit. I turn it into a collage-style scrapbook, blending film photos I take, historical notes, sketches, train tickets, and other memorabilia. It’s extra fun because I add to it as I go!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"97bf8b22-1a18-4aec-94d5-42ab22e49733\"}":{"__typename":"DeepDives","uuid":"97bf8b22-1a18-4aec-94d5-42ab22e49733","content":"\u003cp\u003eI would tell my middle or high school self to take things a little less seriously and have fun while learning. In fact, I made a guide for my sister with 100 tips on how to survive high school. Some highlights: there is no such thing as failing, you either win or learn, and eat protein for breakfast, it will make you happier.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"0d8fb704-4691-4761-bf32-8079ace75cfc\"}":{"__typename":"DeepDives","uuid":"0d8fb704-4691-4761-bf32-8079ace75cfc","content":"\u003cp\u003eMy greatest role model is Greta Gerwig. I admire how she paved the way for women to create and be more than one thing, and she did it with kindness. She inspires me to take risks in my work, embrace multiple passions, and follow my own artistic path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"e10baa30-4972-4981-a228-7040376699ff\"}":{"__typename":"School","uuid":"e10baa30-4972-4981-a228-7040376699ff","name":"LaGuardia High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10023"},"Education:{\"uuid\":\"bb801a9c-a43b-438d-96c0-3d68b168ca7c\"}":{"__typename":"Education","uuid":"bb801a9c-a43b-438d-96c0-3d68b168ca7c","school":{"__ref":"School:{\"uuid\":\"e10baa30-4972-4981-a228-7040376699ff\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}":{"__typename":"School","uuid":"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5","name":"New York University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10012"},"Education:{\"uuid\":\"eb647fba-3af6-4d05-8cf7-1b34ac03d74f\"}":{"__typename":"Education","uuid":"eb647fba-3af6-4d05-8cf7-1b34ac03d74f","school":{"__ref":"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Drama, Business ","degree":null},"MentorPublicProfile:{\"uuid\":\"1839f469-ef62-416b-8641-aee7cc9b1b81\"}":{"__typename":"MentorPublicProfile","uuid":"1839f469-ef62-416b-8641-aee7cc9b1b81","displayName":"Isabella B.","slug":"isabella-barrett","biography":"\u003cp\u003e\u003cstrong\u003eIsa Barrett\u003c/strong\u003e is an award-winning actress, producer, writer, and director born and raised in New York City. She graduates from NYU Tisch School of the Arts and LaGuardia High School of Music \u0026amp; Art and Performing Arts, and she brings the creativity, discipline, and collaboration she practices in the arts into her work as a tutor and mentor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIsa made her Off-Broadway debut at St. Ann’s Warehouse in \u003cem\u003eThe Patient Gloria\u003c/em\u003e, a \u003cem\u003eNew York Times\u003c/em\u003e Critic’s Pick. On television, she appeared in \u003cem\u003eRamy\u003c/em\u003e and \u003cem\u003eGossip Girl\u003c/em\u003e. Alongside acting, she wrote, produced, and starred in her own projects. Her short film \u003cem\u003eWisdom Teeth\u003c/em\u003e was a finalist at the BAFTA-qualifying Flickers Rhode Island Film Festival and an official selection of the SoHo International Film Festival. Her upcoming feature \u003cem\u003eQueerdos\u003c/em\u003e is selected for the 2025 Tribeca Creators Market. She also co-founded Cherubs Productions, an independent company that creates bold, genre-bending work in film and theater.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIsa has interned at leading entertainment companies, including \u003cem\u003eThe Late Show with Stephen Colbert\u003c/em\u003e, A24, Paramount, and MTV. These experiences exposed her to the inner workings of television and film production, strengthening her understanding of the industry and how to guide young creatives through their own projects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIsa first discovered her passion for education and mentorship in high school when she joined CreateHER, a free program for NYC-based girls and non-binary students who are interested in writing and producing for theater. That experience inspired her to give back, and she now works with education nonprofits to help young people grow their skills in both academics and the arts.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eShe is also the oldest of four siblings, which gives her daily experience supporting students at very different stages of learning. She helps her 19-year-old brother with résumés and job searches, guides her 16-year-old sister through college applications, and encourages her 6-year-old sister as she explores her passions. Isa understands how to connect with different kids at different ages and adapts her approach to meet them where they are.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIsa studied acting and business in entertainment at NYU, while also taking courses in media arts, comparative literature, and English. She studied abroad in Amsterdam, focusing on experimental theater, and in London, where she explored 19th-century English novels. Her thesis won the Symposium on Feminist Theater, and she received the Tisch Drama Award, the Beva Ronstein Memorial Award for Excellence in Performance and Theater History. Her interests include history, art, museums, music, movies, and theater, and she brings this curiosity and breadth of knowledge into her tutoring and mentoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of tutoring and her artistic work, Isa reads, writes, cooks, dances, practices yoga, and bikes around the city. She plays flute, piano, and guitar, sings as an alto, and trains in dialects including Southern, British RP, and New York. She holds an American Sailing Association Certification, has a black belt in taekwondo, and practices kickboxing, tai chi, and stage combat. She also trains in juggling, clown, commedia, and a wide range of dance styles including ballet, jazz, modern, contemporary, hip-hop, and musical theater.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIsa looks forward to helping students explore their interests, gain skills, and have fun learning in ways that feel meaningful to them.\u003c/p\u003e","teachingVideoPlaybackId":"L01sPgcJ00mxFcyCdqtiTbBxfBBe3Prf3tBYgCMFG3M00g","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f9b10886-3236-499d-92f1-d144b5f0f1db\"}"},{"__ref":"Favorites:{\"uuid\":\"57deef22-0af5-4980-87fc-c826f8c6f578\"}"},{"__ref":"Favorites:{\"uuid\":\"68972352-107f-4dd8-9917-f51bcb8e6b76\"}"}],"causesSupported":[],"major":"Drama, Business ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cec4e124-cbdd-49d9-b786-6ec04131ac2b\"}"},{"__ref":"DeepDives:{\"uuid\":\"97bf8b22-1a18-4aec-94d5-42ab22e49733\"}"},{"__ref":"DeepDives:{\"uuid\":\"0d8fb704-4691-4761-bf32-8079ace75cfc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d00612d0-7dd5-4973-9594-ea202dd31636/-/preview/-/format/jpg/","https://ucarecdn.com/cf8588ba-de44-498a-ad61-5e5159b33387/-/preview/-/format/jpg/","https://ucarecdn.com/34430339-d3e1-4209-8169-745c405e6a0d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"bb801a9c-a43b-438d-96c0-3d68b168ca7c\"}"},{"__ref":"Education:{\"uuid\":\"eb647fba-3af6-4d05-8cf7-1b34ac03d74f\"}"}],"hiredAt":"2025-09-11T12:40:40.724Z","topics":["Writing","College Essay Writing","Reading","Executive Function","K-6 Storybook","Creative Writing","Music","Fashion / Cosmetics","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Business / Entrepreneurship","Web Design","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isabella-barrett\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1839f469-ef62-416b-8641-aee7cc9b1b81\"}"}}},"_sentryTraceData":"7284ec617b534ee7b0242c143e4e21c2-aa1030b1053da2f1-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7284ec617b534ee7b0242c143e4e21c2,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"isabella-barrett"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
