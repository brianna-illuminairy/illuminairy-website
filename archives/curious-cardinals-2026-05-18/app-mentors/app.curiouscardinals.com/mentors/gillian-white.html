xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"4ea8343f-02c9-465a-a706-861e293fc957\"}":{"__typename":"DeepDives","uuid":"4ea8343f-02c9-465a-a706-861e293fc957","content":"\u003cp\u003eMy greatest source of motivation is being a first-generation college student. I’ve seen how hard my family has worked and how much they’ve sacrificed to give me this opportunity. That pushes me to keep going, even when things get tough. I’m also driven by my goal of becoming a dentist so I can give back to others, especially people in underserved communities who don’t always have access to good dental care. Knowing that I can make a difference keeps me focused and motivated.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8cb325e3-1efd-484f-8479-e7b7a51b8d46\"}":{"__typename":"DeepDives","uuid":"8cb325e3-1efd-484f-8479-e7b7a51b8d46","content":"\u003cp\u003eI chose my major because I’ve always been curious about how living systems work, especially at the molecular and cellular level. I wanted a path that challenged me intellectually but also had a clear impact on people’s lives. After seeing how science can explain everyday things and solve real-world problems, especially in health and medicine, I knew this was the direction I wanted to take. It’s a field where I can keep learning, ask meaningful questions, and hopefully make a difference in the long run.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"dae8c8e9-18ba-446b-a44e-9fb06f5239ce\"}":{"__typename":"DeepDives","uuid":"dae8c8e9-18ba-446b-a44e-9fb06f5239ce","content":"\u003cp\u003eMy dream job is to be a dentist. I want to help people feel confident about their smiles and improve their overall health. I am especially passionate about working in underserved and underrepresented communities where access to dental care is limited. I believe everyone deserves quality care no matter their background or income. As a dentist I hope to make a real difference by providing support education and treatment to those who need it most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"733128ea-54e9-4407-874c-b392962fdffe\"}":{"__typename":"DeepDives","uuid":"733128ea-54e9-4407-874c-b392962fdffe","content":"\u003cp\u003eI would tell my middle or high school self to work hard and keep your mind on the bigger picture. Even when things feel confusing or uncertain, trust that staying focused and putting in the effort will pay off. Don’t get too caught up in short-term stress or what other people think. Just keep moving forward and believe in where you’re headed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"3eb15176-c35a-47e2-826f-ea399e50d498\"}":{"__typename":"School","uuid":"3eb15176-c35a-47e2-826f-ea399e50d498","name":"Cranberry Junior-Senior High School","city":"Seneca","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"16346"},"Education:{\"uuid\":\"6febab5d-ad1c-4274-bf5a-2d9e9012a44b\"}":{"__typename":"Education","uuid":"6febab5d-ad1c-4274-bf5a-2d9e9012a44b","school":{"__ref":"School:{\"uuid\":\"3eb15176-c35a-47e2-826f-ea399e50d498\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"a3a40497-8ee3-48ec-9257-8cd1e2cefb42\"}":{"__typename":"Education","uuid":"a3a40497-8ee3-48ec-9257-8cd1e2cefb42","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"f77bf152-09bb-4a3c-9e5b-0420c363708d\"}":{"__typename":"MentorPublicProfile","uuid":"f77bf152-09bb-4a3c-9e5b-0420c363708d","displayName":"Gillian W.","slug":"gillian-white","biography":"\u003cp\u003eHello! My name is Gillian and I am a Biological Sciences student at Cornell University with a strong foundation in biology, chemistry, and science communication. As a pre-dental student deeply engaged in undergraduate research and writing, I’m passionate about helping students connect academic science to real-world impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I serve as Chief of Research and Development at \u003cem\u003eLet’s Talk Business\u003c/em\u003e, a student-led initiative that equips young people with tools for personal and professional growth by featuring stories from CEOs, doctors, lawyers, and more. I also write for \u003cem\u003eThe Cornell Daily Sun\u003c/em\u003e as a science journalist and lead marketing efforts as the Executive Marketing Director at Spoon University. My writing spans complex science topics, entrepreneurship, and everyday life, all with the goal of making learning accessible and inspiring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy research background includes studying oxidative stress biomarkers in avian species and supporting laboratory operations at a manufacturing company in my hometown. These experiences give me a unique ability to connect with students from a wide range of backgrounds and interests. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not in class or the lab, I’m probably journaling, hiking, or experimenting with gluten-free baking (I have celiac disease!). I love good conversations, deep questions, and spontaneous road trips. My friends describe me as warm, grounded, and relentlessly curious. I value people who are authentic and passionate about what they love. As a mentor, my mission is to help students build confidence, curiosity, and clarity. I believe in building confidence in STEM, and helping students discover how their passions can become pathways. Whether I’m explaining scientific concepts, guiding research thinking, or mentoring future students, I bring energy and empathy to every interaction. \u003c/p\u003e","teachingVideoPlaybackId":"A1a201grqGf00NhC5Ceisvnwz01kQBqsSQqe3letNvuDTU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4ea8343f-02c9-465a-a706-861e293fc957\"}"},{"__ref":"DeepDives:{\"uuid\":\"8cb325e3-1efd-484f-8479-e7b7a51b8d46\"}"},{"__ref":"DeepDives:{\"uuid\":\"dae8c8e9-18ba-446b-a44e-9fb06f5239ce\"}"},{"__ref":"DeepDives:{\"uuid\":\"733128ea-54e9-4407-874c-b392962fdffe\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2e220768-d0f0-40bd-bded-b879c3aa918e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education
