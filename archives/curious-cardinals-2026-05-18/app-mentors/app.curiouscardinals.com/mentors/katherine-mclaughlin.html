xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"57102b73-f80b-4740-aad8-840ec602d9fa\"}":{"__typename":"DeepDives","uuid":"57102b73-f80b-4740-aad8-840ec602d9fa","content":"\u003cp\u003eI am frequently and fervently seeking out local biomes that call for bare feet, swimming, and good company. I have recently discovered that my favorite spots are where forest meets rushing, rocky water and a grassy beach shore. After a long swim — and perhaps a deli sandwich — I make myself comfortable on anything, whether sand, grass, or rock, for a rejuvenating sunshine nap.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2d6a824b-15da-48cd-b4d9-5799f094bf90\"}":{"__typename":"DeepDives","uuid":"2d6a824b-15da-48cd-b4d9-5799f094bf90","content":"\u003cp\u003eSummer of 2025 I had the wondrous opportunity to work as a staff member and yoga instructor at Stanford Sierra Camp. Every Sunday, when a new set of families arrived, I would put on my glitter and my wings and run to the Guppy Lagoon to meet the youngest campers. We’d invent stretches under the aspen trees, close our eyes to take deep breaths together, and wait patiently at the shore of Witches Pond, for the world of butterflies to emerge.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn those moments, I got to share the most genuine parts of myself — my curiosity, my patience, my sense of play — and the kids met me there effortlessly, with the same openness and wonder. It reminded me of how much I believe that we all still have that part of ourselves — the one that leads with imagination and joy, that believes the world is still full of magic.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat’s what inspires me as a mentor: helping others reconnect with that childlike sense of wonder, to create and express themselves without fear or self-doubt. Because when we make space for that inner yoga fairy — that playful, fearless curiosity — we get to discover passions and build communities that feel alive, authentic, and full of possibility.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4d9dd155-c610-4bb0-85c0-59840ce32960\"}":{"__typename":"DeepDives","uuid":"4d9dd155-c610-4bb0-85c0-59840ce32960","content":"\u003cp\u003eI have been working on an ongoing print-based project where I use\u0026nbsp;Pablo Neruda’s\u0026nbsp;\u003cem\u003eThe Book\u0026nbsp;of Questions\u003c/em\u003e\u0026nbsp;as a framework for experimentation. His refusal to be corralled by the rational mind —\u0026nbsp;how\u0026nbsp;his unanswerable questions merge\u0026nbsp;a child’s wonder\u0026nbsp;with an adult’s lived experience\u0026nbsp;— resonates deeply with my own inquiry into intuition and imagination.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI began by re-structuring his book into an interactive object, one that others could break down, rebuild, and reimagine by physically engaging with the pages of the book according\u0026nbsp;to\u0026nbsp;a\u0026nbsp;Risograph\u0026nbsp;bookmark of instructions. It has since evolved into a seed project: a collection of\u0026nbsp;typewritten\u0026nbsp;questions and\u0026nbsp;linocut\u0026nbsp;compositions that test how language, image, and material can together form a shared, intuitive mode of communication.\u0026nbsp;Through this work, I explore how the\u0026nbsp;mundane\u0026nbsp;becomes\u0026nbsp;an intimate site of intuitive exchange, where the simplest gestures or fragments of language can carry meaning without reliance on a shared linguistic code.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs the project develops, I\u0026nbsp;plan to extend this material language into three-dimensional\u0026nbsp;forms\u0026nbsp;— translating\u0026nbsp;prints into sculpture installations where materials such as fabric are activated through touch and movement. Together, these\u0026nbsp;mediums will form a cohesive body of work\u0026nbsp;shaped\u0026nbsp;by the\u0026nbsp;presence and participation\u0026nbsp;of others.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"317b8c8f-f6ba-4957-8168-8c1f9fb1f1f7\"}":{"__typename":"DeepDives","uuid":"317b8c8f-f6ba-4957-8168-8c1f9fb1f1f7","content":"\u003cp\u003eI would tell my high school self: “You’re on the right track. Keep listening to your gut!”\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I was 15, my passion for dance pulled me into an unconventional path — moving away from home, living independently, enrolling in online high school, and balancing rigorous academics with pre-professional dance training in San Francisco, across the country, and eventually abroad, where my opportunities reached a professional level. It was exhilarating, lonely, and deeply formative. I often wished for someone to reassure me that taking an unusual path didn’t mean I was lost — it meant I was brave.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf I could talk to that version of myself, I’d remind her that intuition is a compass worth trusting. That dreaming big requires compromise and experimentation. That creating your own opportunities — even when they don’t exist yet — is a legitimate, powerful way to move through the world. And that the “right” path is the one you build through curiosity, self-reflection, and the courage to ask yourself \u003cem\u003ewhy\u003c/em\u003e you’re pursuing something, not just \u003cem\u003ehow\u003c/em\u003e to get there.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"c49fc110-6d18-4bc7-b4b8-98a79baf0ed1\"}":{"__typename":"School","uuid":"c49fc110-6d18-4bc7-b4b8-98a79baf0ed1","name":"Stanford Online High School","city":"Redwood City","type":"HIGH","state":"CA","country":"United States","zip":"94063"},"Education:{\"uuid\":\"ab19b856-a49b-432c-bdc5-a112e169901e\"}":{"__typename":"Education","uuid":"ab19b856-a49b-432c-bdc5-a112e169901e","school":{"__ref":"School:{\"uuid\":\"c49fc110-6d18-4bc7-b4b8-98a79baf0ed1\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7dde9a42-c7e7-42d4-a601-a36894785294\"}":{"__typename":"Education","uuid":"7dde9a42-c7e7-42d4-a601-a36894785294","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2029","major":"Design and Art Practice","degree":null},"MentorPublicProfile:{\"uuid\":\"8f44c265-fb17-4161-a47f-1784c0bf7362\"}":{"__typename":"MentorPublicProfile","uuid":"8f44c265-fb17-4161-a47f-1784c0bf7362","displayName":"Katherine M.","slug":"katherine-mclaughlin","biography":"\u003cp\u003eHello! I’m Katherine — a design and art practice student at Stanford University, currently on a leave of absence to pursue dance in Geneva, Switzerland. My path has never been linear, and that’s something I’ve grown to love. I’ve followed my curiosity in many directions: moving away from home at 15 for full-time dance training, which eventually led to professional opportunities abroad, and later stepping into new creative worlds at Stanford — from printmaking and media studies to immersive spatial design and sculpture.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, I planted my roots everywhere: in the Community Print Shop, where I rediscovered the joy of making things by hand; in the Institute for Diversity in the Arts, where I hosted office hours and developed programming to strengthen creative community; and even at the center of Lake Lag, where I found peace sitting among ducks, frogs, and the tall dry grass. Being a beginner again — curious, messy, and wide-eyed — completely reshaped how I approach creativity and mentorship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, my goal is to help students connect with the part of themselves that leads with imagination and joy — to create freely, to trust their voice, and to explore their passions without fear of imperfection or pressure to follow a “perfect” path. I am most passionate about guiding students through projects that explore storytelling, identity, and artistic voice — from zines and printmaking to community interviews, podcasts, photo-essays, art portfolios, applications, and design-based explorations. Writing is a core love of mine: in high school, I took interdisciplinary post-AP English courses that shaped my academic direction and taught me the value of great mentorship. I later became a TA, peer tutor, and writing mentor, and I now support students through the writing portions of the college process.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy mentorship centers on curiosity, purpose, and self-advocacy. I help students:\u003c/p\u003e\u003cp\u003e• build executive-functioning habits with compassion and consistency\u003c/p\u003e\u003cp\u003e• reflect on what motivates them and why\u003c/p\u003e\u003cp\u003e• transform inspiration into action — through reflective goal-setting, intentional routines, and steps that feel both doable and exciting\u003c/p\u003e\u003cp\u003e• create balance between meaningful passions and school\u003c/p\u003e\u003cp\u003e• develop courage to follow a path that feels true — even if it’s unconventional\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePathfinding is the part of mentorship I’m most passionate about. I know what it means to trust an intuition that doesn’t always align with the expected route, and I know how transformative it is when someone supports that journey rather than questions it. Above all, I believe creativity should feel alive — thoughtful, communal, intentional, and deeply human. Whether we’re writing, collaging, designing, or simply talking, I want students to feel their own spark — that gentle, fearless curiosity that makes learning joyful again. I truly can’t wait to meet whoever comes my way and I am excited to see what we create together.\u003c/p\u003e","teachingVideoPlaybackId":"WKRIMJo01Mg5vP7bWbGyj17LxM01WHmTw5F5J31Zl9IFE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Design and Art Practice","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"57102b73-f80b-4740-aad8-840ec602d9fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d6a824b-15da-48cd-b4d9-5799f094bf90\"}"},{"__ref":"DeepDives:{\"uuid\":\"4d9dd155-c610-4bb0-85c0-59840ce32960\"}"},{"__
