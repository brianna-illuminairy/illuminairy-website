xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"66226e31-96e6-4858-aa25-f18b76cd81d6\"}":{"__typename":"DeepDives","uuid":"66226e31-96e6-4858-aa25-f18b76cd81d6","content":"\u003cp\u003eMentorship matters to me because I’ve seen how much talent can be held back by circumstances. Working with students from underprivileged backgrounds completely changed how I see education, so many of them have brilliant, creative minds, but don’t always have the resources or support to match their potential. I’ve come to see education as a gift and curiosity as a blessing we should be able to fully explore, no matter where we come from. Mentorship is my way of helping level that playing field: giving students the guidance, tools, and confidence they need so that their ideas, not their situation, define what’s possible for them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"9917477d-a6f0-41bc-93cd-9ffaed60607d\"}":{"__typename":"DeepDives","uuid":"9917477d-a6f0-41bc-93cd-9ffaed60607d","content":"\u003cp\u003eSomething that isn’t obvious right away is that I was born and raised in a small country right on the equator in South America: Ecuador. It’s home to my favorite things in the world, unbelievable mountain views, food that I’m convinced is the best on the planet, and the Galápagos Islands, where I’ve gone diving with huge sea turtles and sharks. Ecuador is a magical place for me, and it shaped the way I see the world, nature, and different cultures.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"429d647f-d79e-43c5-96cd-a51755004532\"}":{"__typename":"DeepDives","uuid":"429d647f-d79e-43c5-96cd-a51755004532","content":"\u003cp\u003eIn high school, I definitely wasn’t the “perfect STEM kid” from day one. I liked school, but I wasn’t the most technical or the most studious at first. That started changing after my first year, when I had a teacher who completely re-sparked my love for learning and showed me how fun engineering and problem-solving could be. Instead of seeing physics or math as just tests and grades, I started seeing them as tools to build things and explore ideas.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat mattered most to me in high school were the people. I built really strong relationships with my teachers and classmates, and I was always trying to turn learning into something social, studying together, working on projects as a team, or just staying after class to ask big “why does this work like that?” questions.\u003cbr\u003e\u003cbr\u003eI also started getting more involved outside the classroom, helping organize initiatives and leading clubs like Tennis and Competitive Maths. Looking back, I’d describe my high school self as curious, people-oriented, and still figuring things out, but slowly turning into someone who loves both engineering \u003cem\u003eand\u003c/em\u003e building community around learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"12b4069d-2f97-4ae5-98a0-bb3e96a3d8f5\"}":{"__typename":"DeepDives","uuid":"12b4069d-2f97-4ae5-98a0-bb3e96a3d8f5","content":"\u003cp\u003eAside from wanting to change the way we interact with technology and robots, one thing I hope to accomplish in my lifetime is to help push forward how we create, share, and access knowledge. I want to build tools, technologies, and communities that make it easier for people in any corner of the world to learn, experiment, and solve problems that matter to them, no matter their background or resources. On a more personal note, I’d love to travel to at least 100 countries and experience as many cultures (and cuisines) as possible. And yes, somewhere in there, I still have a lifetime goal of eating 100 wings in one sitting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"7973fd23-ee64-4cee-b33e-ee5303715168\"}":{"__typename":"School","uuid":"7973fd23-ee64-4cee-b33e-ee5303715168","name":"Colegio Jose Engling","city":"Quito","type":"HIGH","state":"Pichicha","country":"Ecuador","zip":"EC170118"},"Education:{\"uuid\":\"48f67f8a-bfcf-47a1-af0f-09c89fef2409\"}":{"__typename":"Education","uuid":"48f67f8a-bfcf-47a1-af0f-09c89fef2409","school":{"__ref":"School:{\"uuid\":\"7973fd23-ee64-4cee-b33e-ee5303715168\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"f2c8b58f-1b95-40f9-9cf6-3ea5910b0df0\"}":{"__typename":"Education","uuid":"f2c8b58f-1b95-40f9-9cf6-3ea5910b0df0","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Robotics Engineering and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"ee8f0a13-7375-4a68-8910-e15e1c0cad0c\"}":{"__typename":"MentorPublicProfile","uuid":"ee8f0a13-7375-4a68-8910-e15e1c0cad0c","displayName":"Jose V.","slug":"jose-vergara","biography":"\u003cp\u003eHi! I’m Jose Vergara, a junior at Northwestern University studying Mechanical Engineering (robotics) and also working toward a Master’s in Computer Science. I love turning big, intimidating STEM ideas into things that feel fun, practical, and doable. If you’re curious, creative, or even a little bit unsure about math, science, or coding, you’re exactly who I like working with.\u003cbr\u003e\u003cbr\u003e🚀\u003cstrong\u003e Cool things I’ve worked on\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAt Northwestern, I’ve had the chance to work on some really exciting projects, like:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eA \u003cstrong\u003eNASA\u003c/strong\u003e-funded project in which my team designed a new type of expandable metal structure for future Moon missions. Our work won \u003cstrong\u003efirst place in a national competition\u003c/strong\u003e and a \u003cstrong\u003e$150,000 grant\u003c/strong\u003e to keep developing the idea.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLeading a \u003cstrong\u003eresearch group\u003c/strong\u003e exploring ways to monitor blood sugar \u003cstrong\u003ewithout needles\u003c/strong\u003e, using new technology and machine learning.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTrained college students\u003c/strong\u003e to use machinery and software for prototyping and manufacturing, helping them bring ideas from sketch to reality.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eAll of this has taught me how to break down complex topics and how to support someone from “I don’t understand this” to “I built this.”\u003c/p\u003e\u003cbr\u003e\u003cp\u003e📚\u003cstrong\u003e How can I help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI work best with students who want to grow their confidence and curiosity in:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eComputer Science, Robotics, and AI projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMath foundations (algebra, pre-calc, early calculus)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eChemistry and Physics fundamentals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEconomics and real-world applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePassion projects that use STEM to solve real problems\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eWe can focus on school support, building a project from scratch, or a mix of both.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e🧠\u003cstrong\u003e What our sessions feel like\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’ve been teaching since high school, working with students in under-resourced communities and later mentoring college students in design, prototyping, and software.\u003c/p\u003e\u003cp\u003eIn a typical session, we might:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eStart with a simple, fun explanation or analogy\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConnect the topic to something real in your life or the world\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWork \u003cem\u003etogether\u003c/em\u003e on problems or a project, step by step\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEnd with a quick recap so you feel proud of what you learned\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eMy goal is for you to leave every session thinking, “Wait… I want to learn more.”\u003c/p\u003e\u003cp\u003e\u003cbr\u003e🎾\u003cstrong\u003e\u0026nbsp; Off the Clock\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOutside of class and lab, I enjoy playing \u003cstrong\u003etennis and padel\u003c/strong\u003e, and I also appreciate \u003cstrong\u003ecooking for friends and family\u003c/strong\u003e. I’m also a big fan of \u003cstrong\u003eJapan and East Asian culture\u003c/strong\u003e, and I spent a semester on exchange in \u003cstrong\u003eHong Kong\u003c/strong\u003e, exploring the city and its food.\u003c/p\u003e\u003cp\u003eIf you’re a student (or a parent of one) who wants learning to be \u003cstrong\u003ecreative\u003c/strong\u003e, \u003cstrong\u003ecross-cultural\u003c/strong\u003e, and \u003cstrong\u003eexploratory rather than restrictive\u003c/strong\u003e, I’d be excited to work together and help redefine what learning can look like.\u003c/p\u003e","teachingVideoPlaybackId":"RGUnFLtsU2Kk7cvyyvI02SpRqezSt4BQn901JJrSn6pU8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Robotics Engineering and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"66226e31-96e6-4858-aa25-f18b76cd81d6\"}"},{"__ref":"DeepDives:{\"uuid\":\"9917477d-a6f0-41bc-93cd-9ffaed60607d\"}"},{"__ref":"DeepDives:{\"uuid\":\"429d647f-d79e-43c5-96cd-a51755004532\"}"},{"__ref":"DeepDives:{\"uuid\":\"12b4069d-2f97-4ae5-98a0-bb3e96a3d8f5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/48c799dd-c437-42f9-bed0-45d625f5a5e6/-/preview/-/format/jpg/","https://ucarecdn.com/491e378b-c3ab-43a4-b5b9-99e55d32c473/-/preview/-/format/jpg/","https://ucarecdn.com/8ffb99bb-96e8-4bb1-9baa-8e7ed68ad3d3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"48f67f8a-bfcf-47a1-af0f-09c89fef2409\"}"},{"__ref":"Education:{\"uuid\":\"f2c8b58f-1b95-40f9-9cf6-3ea5910b0df0\"}"}],"hiredAt":"2025-12-01T16:07:54.838Z","topics":["
