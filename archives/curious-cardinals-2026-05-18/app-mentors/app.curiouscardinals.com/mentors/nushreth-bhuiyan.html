xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"cbf1e566-12ef-4638-8156-b60fdce9a486\"}":{"__typename":"DeepDives","uuid":"cbf1e566-12ef-4638-8156-b60fdce9a486","content":"\u003cp\u003eTry your best on any assignment and never give up extra points! What do I mean by this? In high school, there will be many chances for extra credit assignments or a harder, more challenging class that may boost your GPA. Sometimes, it may feel easier to take a less challenging route. However, it is important to challenge oneself and try every way to maximize the amount of potential success you can achieve as this will not only make you an impressive candidate in the eyes of college admission officers, but these experiences will help you grow, build character, and be great material for supplemental essays since you have content to talk about that demonstrates your continuous growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"3fd349a8-118c-49f8-8ef5-bcfe19a6c02b\"}":{"__typename":"DeepDives","uuid":"3fd349a8-118c-49f8-8ef5-bcfe19a6c02b","content":"\u003cp\u003eAs a high school student I was always trying to take as many AP classes available and trying to increase the number of clubs and leadership positions I was involved in while still trying to acknowledge my interests so that ultimately when I applied to college, I could have a common theme within my activities, all while showing all the hard work I did in college. I also had an older sister who was a mentor for me since I took her advice on what classes to take which was nice since I had another perspective of a class before taking it myself. I also was very competitive and tried to ensure that at the end of the day, I did the best that I could do. This way, even if I did not perform as well on something as I initially wanted to, I at least know that I put 100% effort in and could not have done anything differently.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"94f9e433-d364-4684-9815-7434be4a29e3\"}":{"__typename":"DeepDives","uuid":"94f9e433-d364-4684-9815-7434be4a29e3","content":"\u003cp\u003eMentorship was something that I deeply seeked in high school as a student coming from a background where I was not as financially sound as some of my friends. Also, I want to ensure that students can succeed regardless of their background. I have a lot of experience with research and finding information about different programs and different methods to get into top-tier colleges. Therefore, I want to share my knowledge and experience with my students so they can also achieve their goals and get accepted into phenomenal colleges. I also know how difficult it can feel to be lost and unsure on how to improve one's application or their grades or extracurriculars. I have advice I believe high school students can greatly benefit from.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"7c598c9e-f0ac-4535-9afa-470756162f9c\"}":{"__typename":"DeepDives","uuid":"7c598c9e-f0ac-4535-9afa-470756162f9c","content":"\u003cp\u003eA passion project in the past was working with Planarian worms to see if Red Light Therapy and Aloe Ferox Concentrations affected their regeneration rate over the course of fourteen days since it takes fourteen days for a Planarian worm to regenerate after it has been cut into half. I thought this was so interesting since these organisms could already regrow after being split into half. Thus, I wanted to see if these two treatments would speed up the rate in which the body parts of the worms grew back since we could then use these treatments in hospitals to regenerate cells and increase the growth of human cells if we could figure out a way to implement these practices to humans.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"8fa51019-28cf-4f43-9a09-86a6ff6eb0d8\"}":{"__typename":"School","uuid":"8fa51019-28cf-4f43-9a09-86a6ff6eb0d8","name":"Bethel High School","city":"Bethel","type":"HIGH","state":"Connecticut","country":"United States","zip":"06801"},"Education:{\"uuid\":\"7bec3667-906e-48ed-a620-368d63e4a91f\"}":{"__typename":"Education","uuid":"7bec3667-906e-48ed-a620-368d63e4a91f","school":{"__ref":"School:{\"uuid\":\"8fa51019-28cf-4f43-9a09-86a6ff6eb0d8\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"1355c2cb-a7d6-4b01-9f3b-33424b225d0e\"}":{"__typename":"Education","uuid":"1355c2cb-a7d6-4b01-9f3b-33424b225d0e","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Medical Anthropology (pre-med)","degree":null},"MentorPublicProfile:{\"uuid\":\"d4d29538-f624-4b6a-be0b-19e452e8e2d8\"}":{"__typename":"MentorPublicProfile","uuid":"d4d29538-f624-4b6a-be0b-19e452e8e2d8","displayName":"Nushreth B.","slug":"nushreth-bhuiyan","biography":"\u003cp\u003eHello! My name is Nushreth and I am so excited to be your mentor! I am currently studying Medical Anthropology on the pre-medical track at Princeton University! In my free time, I love volunteering and working with the other children in my community. I work closely with preschoolers in the area where I teach them about their health and hygiene. Every weekend, I volunteer at Princeton Medical Center with Alzheimer's patients! I love working with third world countries and am the secretary for MSF chapter (Medicine without Borders) at my school. I also am involved in multiple healthcare organizations which will help me get accepted into medical school. Such organizations are Cornell's medicine program that helps prepare students through informational weekly meetings and experience working with patients, the PULSE program where I am matched to a pediatric anesthesiologist from Yale University with the ultimate goal of publishing research, in addition to my Princeton internship with a UPENN radiologist! Additionally, I love exercising and going to the gym! I love the incline treadmill and rock climbing! In my free time, I love exploring my surrounding area! I really enjoy day trips to New York City and going to new restaurants. Additionally, I love being involved in student associations on campus such as PUMP (which is Princeton University Mentorship Program) and MSA (Muslim Student Association). I am super excited to enter the medical field and want to get into medical school after I graduate college! I love learning new things and creating relationships with my peers. One of my favorite activities on campus is Matriculate where I also gain a lot of experience working with college students and creating helpful tricks to make the college process easier! In terms of passion, I am very invested in ensuring that people in my community have access to equal and quality healthcare! Much of my passion has been stemming from ensuring that all members of my community have access to the same treatment and level health disparities and ensuring the wellbeing of communities around the nation. I spend my time professionally working on strengthening my communication skills and improving my experience! During this upcoming summer, I get to work with an organization called Brown Girl Wellness that focuses on relieving tension from generational trauma and working to increase the number of women within their organization. Through these experiences, I gain practice talking to and working with members of the nearby community! I cannot wait to likewise work with fellow students to foster a safe space to grow!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"XkbVIsqDiibx8nLJ9vjcJBLZX4yrB5sqSU7EP00ir00cI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Medical Anthropology (pre-med)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cbf1e566-12ef-4638-8156-b60fdce9a486\"}"},{"__ref":"DeepDives:{\"uuid\":\"3fd349a8-118c-49f8-8ef5-bcfe19a6c02b\"}"},{"__ref":"DeepDives:{\"uuid\":\"94f9e433-d364-4684-9815-7434be4a29e3\"}"},{"__ref":"DeepDives:{\"uuid\":\"7c598c9e-f0ac-4535-9afa-470756162f9c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b953f361-b368-4015-b3a2-0df5b60e6abd/-/preview/-/format/jpg/","https://ucarecdn.com/339c773b-b3c8-4cc5-889e-e698340a43fa/-/preview/-/format/jpg/","https://ucarecdn.com/93a7926b-0690-46bb-8be1-3ca333842d92/-/preview/-/for
