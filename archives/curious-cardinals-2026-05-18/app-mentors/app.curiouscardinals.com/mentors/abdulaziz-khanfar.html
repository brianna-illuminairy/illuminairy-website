xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ce6f5538-19ec-4e52-a6eb-e4aa0d5491ef\"}":{"__typename":"DeepDives","uuid":"ce6f5538-19ec-4e52-a6eb-e4aa0d5491ef","content":"\u003cp\u003eI've always enjoyed economic theory, and I was in an engineering/mathematics program in high school, so this major allowed me to merge my two interests. I recently picked up the English major because I think the critical thinking and analysis skills picked up from humanities majors are incredibly overlooked.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"44c993b9-c478-4c0f-a38f-2b3ac5a25c30\"}":{"__typename":"DeepDives","uuid":"44c993b9-c478-4c0f-a38f-2b3ac5a25c30","content":"\u003cp\u003eI've done a lot of research, but my favorite research project was in a summer program led by Columbia University. I found the study of income inequality really interesting, and was allowed to develop my own project that examined perceptions of streetscape technology based on income. This was also my first project where I had to interview people for data, which was a formative experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"46015c54-0464-4e51-8b35-fadef0ef2c35\"}":{"__typename":"DeepDives","uuid":"46015c54-0464-4e51-8b35-fadef0ef2c35","content":"\u003cp\u003eI'm living in NYC right now, so on weekends we'll go and explore the city (mostly shopping and restaurants). If I'm back in Florida, I enjoy going to the beach with friends, playing Spikeball, or going on joyrides.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"0fcfd838-7066-4237-bb09-6b5859a9d8ce\"}":{"__typename":"DeepDives","uuid":"0fcfd838-7066-4237-bb09-6b5859a9d8ce","content":"\u003cp\u003eFrankly, I've been doing it for a while, just informally. In an effort to help myself get certain opportunities and get into certain schools, I've had a plethora of mentors that helped me reach my potential. For this, I want to pay it forward and help others achieve their goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"55aff62f-bcf5-4362-9ac2-9e261fcfc889\"}":{"__typename":"School","uuid":"55aff62f-bcf5-4362-9ac2-9e261fcfc889","name":"Suncoast Community High School","city":"Riviera Beach","type":"HIGH","state":"Florida","country":"United States","zip":"33404"},"Education:{\"uuid\":\"5d07de8b-2184-4f86-8388-e0d72bca6a01\"}":{"__typename":"Education","uuid":"5d07de8b-2184-4f86-8388-e0d72bca6a01","school":{"__ref":"School:{\"uuid\":\"55aff62f-bcf5-4362-9ac2-9e261fcfc889\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"f9bec8b3-949d-4f08-a44f-7703699aa049\"}":{"__typename":"Education","uuid":"f9bec8b3-949d-4f08-a44f-7703699aa049","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Economics-Mathematics \u0026 English","degree":null},"MentorPublicProfile:{\"uuid\":\"d2284e3c-7ec5-4acc-8ea5-2325487a708b\"}":{"__typename":"MentorPublicProfile","uuid":"d2284e3c-7ec5-4acc-8ea5-2325487a708b","displayName":"Abdul-Aziz K.","slug":"abdulaziz-khanfar","biography":"\u003cp\u003eHey! My name is Abdul, and I’m currently double majoring in Economics and Mathematics and English at Columbia University, where I maintain a 4.0 GPA. I’m originally from Palm Beach Gardens, Florida, and I’ve always been driven by curiosity, particularly when it comes to understanding how data, storytelling, and research can work together to solve real-world problems. Much of my experience centers around academic research, but I’ve also explored industry through internships in finance and policy, which has helped me connect classroom learning to practical applications.\u003c/p\u003e\u003cp\u003eAt Columbia, I’m a Student Fellow with The Trust Collaboratory, where I work on community-based sociology research as part of a National Science Foundation funded project to co-create a large language model with Harlem residents. I’ve also been involved in research at the Center for Smart Streetscapes and previously worked with Harvard University’s History of Punishment Project, where I analyzed historical incarceration data to explore economic inequality. Before college, I spent several years conducting economics research with the University of Louisiana at Monroe, publishing multiple papers and earning a Distinguished Research Award for my work analyzing gender pay gaps and career choice patterns. These experiences taught me how to think critically, ask strong questions, and pursue independent intellectual projects, skills that I love helping students develop.\u003c/p\u003e\u003cp\u003eBeyond research, I’ve gained professional experience as a policy analyst intern at ExcelinEd and as an intern at a private equity firm, where I worked with financial data, built Excel models, and supported acquisition research. I also spent time as a math instructor at Mathnasium, tutoring students from elementary school through Calculus II and helping high schoolers prepare for the SAT and ACT.\u003c/p\u003e\u003cp\u003eIf you’re interested in learning how to approach college applications, especially for highly selective schools, or want guidance starting a passion project, conducting research, or strengthening your academic profile, I’d love to help. \u003c/p\u003e\u003cp\u003eI’ve taken over 20 AP classes and exams and can tutor in a wide range of subjects, from math and English to test prep. My goal is to help students not just succeed, but discover what genuinely excites them and turn that into meaningful work.\u003c/p\u003e","teachingVideoPlaybackId":"ZL49007xc02uMRNkbpxjTX00S3qbp3SDGkRA8V01zcR3ljM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics-Mathematics \u0026 English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ce6f5538-19ec-4e52-a6eb-e4aa0d5491ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"44c993b9-c478-4c0f-a38f-2b3ac5a25c30\"}"},{"__ref":"DeepDives:{\"uuid\":\"46015c54-0464-4e51-8b35-fadef0ef2c35\"}"},{"__ref":"DeepDives:{\"uuid\":\"0fcfd838-7066-4237-bb09-6b5859a9d8ce\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cc51442c-8fc4-40f2-badd-1640a31ebc22/-/preview/-/format/jpg/","https://ucarecdn.com/1ffb0302-5dea-452f-b210-3e14c4549b4e/-/preview/-/format/jpg/","https://ucarecdn.com/e27d7b75-6ffc-4379-855e-4004ee9b4c27/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5d07de8b-2184-4f86-8388-e0d72bca6a01\"}"},{"__ref":"Education:{\"uuid\":\"f9bec8b3-949d-4f08-a44f-7703699aa049\"}"}],"hiredAt":"2026-02-12T21:37:45.013Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Calculus","Statistics","Physics","6-8 Grade Science","Writing","College Essay Writing","Economics","Academic Coaching","Executive Function","Finance / Investing","Law / Government / Policy","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"abdulaziz-khanfar\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d2284e3c-7ec5-4acc-8ea5-2325487a708b\"}"}}},"_sentryTraceData":"d9cac9df3e384fdab82d35a8a2a0d25a-bf205cb115ecd269-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d9cac9df3e384fdab82d35a8a2a0d25a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"abdulaziz-khanfar"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.co
