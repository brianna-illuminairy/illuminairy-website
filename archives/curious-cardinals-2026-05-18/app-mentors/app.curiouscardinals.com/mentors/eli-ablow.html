xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"57491dbb-2b0c-4ceb-9d88-f549544d1b00\"}":{"__typename":"DeepDives","uuid":"57491dbb-2b0c-4ceb-9d88-f549544d1b00","content":"\u003cp\u003eI am currently helping found a startup which focuses on the intersection between machine learning and mental health diagnostic care/therapy. Having previously worked for an AI company I have learned a lot about the area and believe application within the mental health space would be valuable. In addition, the opportunity to build on my existing experience and further develop an understanding of entrepreneurship and business innovation from a new angle is exciting to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fad8cca6-4b54-4ea0-8aa3-95d816199d82\"}":{"__typename":"DeepDives","uuid":"fad8cca6-4b54-4ea0-8aa3-95d816199d82","content":"\u003cp\u003eMentorship holds profound significance in my life as both a mentee and a mentor. I have had several very impactful mentors who have taught me a lot and helped me navigate challenges. These individuals have helped me grow not only professionally but individually as well and I am eager to help others as they have helped me. Equally important have been my experiences as a mentor for others. Mentorship is a two-way street of learning and I have found that I often learn just as much from the mentee as they learn from me. Contributing to a community that fosters growth and development is important to me. I hope that the students I mentor will eventually pay it forward and contribute to this growth-oriented community as well!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"896a88f8-8e38-46e3-8098-c1f6f1c9a276\"}":{"__typename":"DeepDives","uuid":"896a88f8-8e38-46e3-8098-c1f6f1c9a276","content":"\u003cp\u003eI have several hobbies which I enjoy in my free time! I have played the viola since I was 4 and see it and music in general as a great outlet to destress. While things can get busy, I try to find time to play and listen to music when I can. I also enjoy playing sports like basketball, tennis, and golf with friends. These are great opportunities to both exercise and spend time with people that matter deeply to me. Lastly, I like playing video and board games. I am a part of a small group that meets up once a week or so to play Settlers of Catan!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"4e95d5f1-3d16-4255-889f-23daab0ab523\"}":{"__typename":"School","uuid":"4e95d5f1-3d16-4255-889f-23daab0ab523","name":"South Eugene High School","city":"Eugene","type":"HIGH","state":"Oregon","country":"United States","zip":"97401"},"Education:{\"uuid\":\"7443b1ca-be80-43ad-8e34-36379f3e0a3c\"}":{"__typename":"Education","uuid":"7443b1ca-be80-43ad-8e34-36379f3e0a3c","school":{"__ref":"School:{\"uuid\":\"4e95d5f1-3d16-4255-889f-23daab0ab523\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"4096bdcb-5eea-4f12-8669-d05211ad3389\"}":{"__typename":"Education","uuid":"4096bdcb-5eea-4f12-8669-d05211ad3389","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"fd32aeca-8605-479f-9c2c-b56ec39fc406\"}":{"__typename":"MentorPublicProfile","uuid":"fd32aeca-8605-479f-9c2c-b56ec39fc406","displayName":"Eli A.","slug":"eli-ablow","biography":"\u003cp\u003eHi! My name is Eli and I am a senior at Yale University majoring in Economics with a focus on statistics and data science. On campus, I am involved in several organizations including Yale Undergraduate Diversified Investments and the Davenport Pops Orchestra. My experience in Yale Undergraduate Diversified Investments enabled me to learn more about the various areas of finance and business as well as develop necessary skills including excel modeling, data analysis, and project management. I further explored my interests in entrepreneurship, business, and finance off campus through several internships. On the business and entrepreneurship side, I have interned for both an established biotechnology company and a startup AI company in order to develop understanding of company fundamentals and growth at different stages. On the finance side, I have interned at and will be returning to work full time for a firm that advises and invests in companies within sports, music, technology, gaming, and entertainment. Through these various experiences, I have developed a solid understanding of the methods and tools necessary to launch a project/startup or explore an area of interest.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of these academic and professional focuses, I have several other interests which I am passionate about. Having grown up in Oregon, I love all things outdoors, including hiking, skiing, and sports. I also have played the viola my entire life including here at Yale, where I am a part of an orchestra which plays fun contemporary music including movie soundtracks and Beyonce songs. I also love working with students to explore interests of their own. I have previously tutored students on a range of subjects from launching a startup to college applications and SAT prep. Having benefited from the guidance of several important mentors in my own endeavors, I am eager to help others pursue their own ideas and passions!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"57491dbb-2b0c-4ceb-9d88-f549544d1b00\"}"},{"__ref":"DeepDives:{\"uuid\":\"fad8cca6-4b54-4ea0-8aa3-95d816199d82\"}"},{"__ref":"DeepDives:{\"uuid\":\"896a88f8-8e38-46e3-8098-c1f6f1c9a276\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d96f47b0-7f09-47b4-b5f9-94c47b339c11/-/preview/-/format/jpg/","https://ucarecdn.com/add6105e-7890-4063-96e5-c21841bf8f7f/-/preview/-/format/jpg/","https://ucarecdn.com/6d5d7916-4d76-4e70-88fb-a3293ebc5f2f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7443b1ca-be80-43ad-8e34-36379f3e0a3c\"}"},{"__ref":"Education:{\"uuid\":\"4096bdcb-5eea-4f12-8669-d05211ad3389\"}"}],"hiredAt":"2024-01-24T09:26:56.250Z","topics":["Finance / Investing","Business / Entrepreneurship","Negotiation","Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Economics","Writing","History","Executive Function","College Essay Writing","Reading","Public Speaking"],"communityBadges":
