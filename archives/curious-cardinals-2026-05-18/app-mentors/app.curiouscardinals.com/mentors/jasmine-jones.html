xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"56fd82d5-b374-424a-a4a6-e699bec8e510\"}":{"__typename":"Favorites","uuid":"56fd82d5-b374-424a-a4a6-e699bec8e510","photoUrl":"https://ucarecdn.com/28ad7ec5-158a-4f11-935b-33da6f2e16bb/","title":"Badminton","type":"SPORT"},"Favorites:{\"uuid\":\"901b8ce2-322c-4a13-8923-a83ec895c9a5\"}":{"__typename":"Favorites","uuid":"901b8ce2-322c-4a13-8923-a83ec895c9a5","photoUrl":"https://ucarecdn.com/960844a8-5952-4478-b09c-032446789198/","title":"Berlin","type":"CITY"},"CausesSupported:{\"uuid\":\"4918fc7d-e09e-46b8-9d12-0fb094ef9547\"}":{"__typename":"CausesSupported","uuid":"4918fc7d-e09e-46b8-9d12-0fb094ef9547","name":"Volunteer Income Tax Assistance (VITA) program","description":"\u003cp\u003eAdvanced tax preparer supporting low-income residents’ filings\u003c/p\u003e","photoUrl":"https://ucarecdn.com/f63a6bb8-ef9e-4687-b908-dde23786f5bb/"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"05d248fa-8d89-4d5b-8f3f-cf874e307dd9\"}":{"__typename":"DeepDives","uuid":"05d248fa-8d89-4d5b-8f3f-cf874e307dd9","content":"\u003cp\u003eI hope to spend at least a year of my career working in a foreign country. My past experiences studying and interning abroad were transformative, but I want to go deeper by contributing to a global team long-term. By immersing myself in a foreign professional environment, I hope to improve my cross-cultural communication skills and gain a truly global perspective.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"57fc46c0-1359-48ab-b4b6-95c43eb713b4\"}":{"__typename":"DeepDives","uuid":"57fc46c0-1359-48ab-b4b6-95c43eb713b4","content":"\u003cp\u003eI am working on a project that explore the economic history and wealth building tradition of Black American. I am reading various books and papers that feature historical economic analysis of Black Americans and discuss modern Black financial resilience movements. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"20ef226b-a223-45eb-a28b-9eccfa5cff4e\"}":{"__typename":"DeepDives","uuid":"20ef226b-a223-45eb-a28b-9eccfa5cff4e","content":"\u003cp\u003eI have always enjoyed helping others, and mentorship has become an essential part of my weekly routine. From babysitting and tutoring in high school to my current roles as an economics mentor and student leader, I have consistently grown my capacity to guide others over time. My own mentors have inspired me and opened my eyes to new opportunities, so it is my goal to pay that impact forward and give back to others in the same way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"f16995e0-a726-4167-9dc0-b5fe47989ba7\"}":{"__typename":"DeepDives","uuid":"f16995e0-a726-4167-9dc0-b5fe47989ba7","content":"\u003cp\u003eI am extremely proud of starting a small business in high school. Although I went back and forth on the decision for a long time, it ended up being one of the most rewarding experiences of my life. Taking that leap not only taught me about entrepreneurship but also showed me what I’m capable of when I push past my own hesitations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"c4f753cd-b28d-43ff-8c05-90cc3c0272bc\"}":{"__typename":"School","uuid":"c4f753cd-b28d-43ff-8c05-90cc3c0272bc","name":"San Diego High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92101"},"Education:{\"uuid\":\"bd989c21-ee30-4c02-9dba-c2ad2ed5e60c\"}":{"__typename":"Education","uuid":"bd989c21-ee30-4c02-9dba-c2ad2ed5e60c","school":{"__ref":"School:{\"uuid\":\"c4f753cd-b28d-43ff-8c05-90cc3c0272bc\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a37f7490-a99b-41a2-a05e-e63d86ca51dc\"}":{"__typename":"Education","uuid":"a37f7490-a99b-41a2-a05e-e63d86ca51dc","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics and Global Affairs ","degree":null},"MentorPublicProfile:{\"uuid\":\"7677c114-462a-4562-ba47-7d1ae2a6720b\"}":{"__typename":"MentorPublicProfile","uuid":"7677c114-462a-4562-ba47-7d1ae2a6720b","displayName":"Jasmine  J.","slug":"jasmine-jones","biography":"\u003cp\u003eHi! I’m Jasmine, a senior at Yale University studying Global Affairs and Economics. After graduation, I’ll be moving to New York City to begin my career in asset management on Wall Street — definitely not where I originally imagined I would end up. Because my path has been anything but linear, I love having honest conversations about career exploration, pivots, and how to reconcile your passions with practical decisions.\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI’ve always been deeply interested in socio-economic justice, responsible consumption, female entrepreneurship, and financial literacy. Growing up, leadership and global curiosity shaped much of who I am today. I served as President of my high school’s Black Student Union and participated in Youth in Government, where I began thinking critically about policy, representation, and systemic inequality.\u003c/p\u003e\u003cp\u003eLanguages and travel were also foundational parts of my upbringing. I started learning German at age four and Spanish at eight, and I later tutored students in German for several years. Cross-cultural communication and global awareness are two of my greatest passions. During COVID, I launched a small handmade resin craft business, which sparked my interest in entrepreneurship and the challenges of building something from the ground up.\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eMy college journey\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eAt Yale, I’ve explored a wide range of interests that ultimately converged in finance and economics. I interned at the Yale Farm, where I developed a deeper appreciation for food systems and sustainability, before pivoting into finance through two summers of industry experience. Along the way, I participated in professional programs with JPMorgan Chase and Goldman Sachs and was honored to receive the PIMCO Future Leaders Scholarship, which supports students from underrepresented communities pursuing careers in investment management.\u003c/p\u003e\u003cp\u003eOn campus, I’ve held multiple leadership roles in Smart Woman Securities, an all-female finance organization focused on investment education. I also serve as an economic mentor, helping peers think critically about foundational economic principles and real world applications. For my Global Affairs senior thesis, I conducted group research in Istanbul, Turkey — one of my favorite experiences at Yale that combined my academic interests with my love of travel. I’m also a member of Yale’s Double Dutch jump rope team, which keeps life fun and balanced.\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhat I do for fun\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI’m an avid trip planner (and enthusiastic Wanderlog user), always mapping out my next adventure. I love thrifting, reading books on economic history, and ranking restaurants on Beli.\u0026nbsp;\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eHow I can support you\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI’m especially excited to mentor students who are navigating big questions: How do I turn my interests into a viable career? Can I care about social impact and still work in finance? How do I build confidence in male-dominated spaces?\u003c/p\u003e\u003cp\u003eWhether you’re interested in economics, business, entrepreneurship, leadership development, or simply figuring out your next step, I’m happy to share what I’ve learned — including the missteps. My journey has taught me that you don’t have to have everything figured out to move forward strategically. If you’re curious, ambitious, and open to growth, I’d love to connect.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"NTKuj9j4WQs2hdb00Es01LJzs1KGpdcU3mIEwNnr3bg78","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI launched a small business in high school called Starmaze Studio, a venture I had long envisioned and fully committed to during the pandemic. I created handcrafted, K-pop–inspired resin crafts, which I sold online and at in-person events. The business grew to the point where I was able to leave my part-time job at an Italian restaurant and devote myself entirely to running and expanding it. This business was one of my greatest achievements in life and is something that taught me how to be creative and entrepreneurial.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"56fd82d5-b374-424a-a4a6-e699bec8e510\"}"},{"__ref":"Favorites:{\"uuid\":\"901b8ce2-322c-4a13-8923-a83ec895c9a5\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"4918fc7d-e09e-46b8-9d12-0fb094ef9547\"}"}],"major":"Economics and Global Affairs ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"05d248fa-8d89-4d5b-8f3f-cf874e307dd9\"}"},{"__ref":"DeepDives:{\"uuid\":\"57fc46c0-1359-48ab-b4b6-95c43eb713b4\"}"},{"__ref":"DeepDives:{\"uuid\":\"20ef226b-a223-45eb-a28b-9eccfa5cff4e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f16995e0-a726-4167-9dc0-b5fe47989ba7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fe860a21-d41b-4dcd-aa2b-c93895c55291/-/preview/-/format/jpg/","https://ucarecdn.com/11056907-9028-40be-b12b-7cd60f779f51/-/preview/-/format/jpg/","https://ucarecdn.com/6f21379c-c2be-49fa-a165-2c2b412f2673/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"bd989c21-ee30-4c02-9dba-c2ad2ed5e60c\"}"},{"__ref":"Education:{\"uuid\":\"a37f7490-a99b-41a2-a05e-e63d86ca51dc\"}"}],"hiredAt":"2026-02-18T18:28:07.417Z","topics":["K-5 Grade Math","Writing","Spanish","German","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","History Project","Video / Photography","Visual Arts / Graphic Design","Fashion / Cosmetics","Creative Writing","K-6 Storybook","Business / Entrepreneurship","Finance / Investing","Sustainability","Public Speaking","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"di
