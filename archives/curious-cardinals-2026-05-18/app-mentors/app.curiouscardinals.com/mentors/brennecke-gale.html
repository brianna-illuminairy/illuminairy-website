ath and science and Spanish alike. She graduated from Stanford University with a B.S. in Human Biology and a Minor in Creative Writing in 2022 and and returned to Stanford for an M.A. in Environmental Communication, graduation in 2023.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCurrently, she's excited about the capacity for wonder and curiosity within science, and how writing, communication, and education can be vessels for learning and community. Brennecke has expertise in sciences (biology, ecology, physiology, anatomy), writing and communication, creative writing (prose and poetry), environmental justice, journalism, sustainability, outdoor and experiential education, peer leadership, sports, and all things baked goods. She also is passionate about students finding meaning and achieving their full potential within the college application process.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, she played on the women's club soccer team, was a tour guide, was an RA (twice!), led Frosh 101 (a class to help freshmen adjust to college life), and worked for several years at Stanford Sierra Camp. You can find her hiking, camping, running, doing various watersports, playing board games and Bananagrams, and dressing up with her friends.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI delivered a TED Talk to my community, titled \"Why We Tell Stories.\" What was even better was the next year, when I coached the event's 12 speakers to develop their own stories and deliver their own TED Talks!\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Human Biology (B.S.) and Environmental Communication (M.A.)","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/130d16a4-71f2-48e2-bb38-543b69c6ba15/-/crop/653x653/0,50/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d2c96473
