xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e54297ee-d4e9-4293-a3e7-161b344eb69b\"}":{"__typename":"Favorites","uuid":"e54297ee-d4e9-4293-a3e7-161b344eb69b","photoUrl":"https://ucarecdn.com/0806edcb-1080-48b3-9a18-418ccc9c76ba/","title":"Project Hail Mary","type":"BOOK"},"Favorites:{\"uuid\":\"a3e8d037-8c1f-4dfc-9021-d54369158d2f\"}":{"__typename":"Favorites","uuid":"a3e8d037-8c1f-4dfc-9021-d54369158d2f","photoUrl":"https://ucarecdn.com/80e1f0a1-f58b-46f6-85bf-f8c89fab7d4c/","title":"OKC Thunder","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"55fe69e5-cd17-4220-b8bd-7d7697c9a890\"}":{"__typename":"Favorites","uuid":"55fe69e5-cd17-4220-b8bd-7d7697c9a890","photoUrl":"https://ucarecdn.com/1ef6e42e-f7ec-445d-98af-6da58564ac3f/","title":"Zermatt, Switzerland","type":"CITY"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f81beb41-c544-475a-82e1-faba8df4f9a8\"}":{"__typename":"DeepDives","uuid":"f81beb41-c544-475a-82e1-faba8df4f9a8","content":"\u003cp\u003eOne of my current passion projects is a fan engagement and data analytics initiative with the Oklahoma City Thunder. I’m working on using data and cloud-based tools to understand fan behavior and make their experience more personalized and engaging.\u003c/p\u003e\u003cp\u003eI’m also collaborating with Google on this project, leveraging their cloud and AI technologies to build scalable systems and machine learning models that can analyze and act on fan data. What excites me most is combining technology, data, and creativity to create solutions that have a real, tangible impact for fans and the organization.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e467b3e0-8833-4119-a659-c030eaedc84d\"}":{"__typename":"DeepDives","uuid":"e467b3e0-8833-4119-a659-c030eaedc84d","content":"\u003cp\u003eIf I could give advice to my high school self, I would say: don’t be afraid to step out of your comfort zone. Growth happens when you challenge yourself, try new things, and take risks, even when it feels uncomfortable or uncertain. Every experience, whether it’s success or failure, teaches you something valuable and helps you discover what you’re truly capable of. Embrace opportunities that scare you a little, because that’s exactly how you’ll grow, learn, and find your path\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8d42b4a8-d0a0-48e6-bb14-1f036dcdfae1\"}":{"__typename":"DeepDives","uuid":"8d42b4a8-d0a0-48e6-bb14-1f036dcdfae1","content":"\u003cp\u003eOne thing I would like to accomplish in my lifetime is to create a scholarship organization that supports students in different countries who lack access to educational resources but have incredible potential. I want to help provide opportunities for these students to grow, learn, and become leaders in their fields, so that their talent and ambition can reach its full impact on the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d079b7fc-fff8-40f9-82d8-2f4b1d523af3\"}":{"__typename":"DeepDives","uuid":"d079b7fc-fff8-40f9-82d8-2f4b1d523af3","content":"\u003cp\u003eShaila enjoys a mix of creative, active, and relaxing hobbies that keep her curious and energized. She loves \u003cstrong\u003epainting\u003c/strong\u003e as a way to express herself and explore new ideas, and she stays active with \u003cstrong\u003erock climbing\u003c/strong\u003e and \u003cstrong\u003ePilates\u003c/strong\u003e. She enjoys relaxing moments too, like \u003cstrong\u003edrinking matcha, cafe hopping\u003c/strong\u003e, or \u003cstrong\u003ereading books on her Kindle\u003c/strong\u003e. As a fan of the Oklahoma City Thunder, she loves \u003cstrong\u003ewatching games\u003c/strong\u003e and following the team’s journey. She also finds fulfillment in \u003cstrong\u003evolunteering\u003c/strong\u003e, mentoring, and giving back to her community, blending her love for learning and helping others with fun and meaningful activities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9f253b43-298b-4a31-beba-67fdd3ca89e5\"}":{"__typename":"School","uuid":"9f253b43-298b-4a31-beba-67fdd3ca89e5","name":"Norman High School","city":"Norman","type":"HIGH","state":"Oklahoma","country":"United States","zip":"73069"},"Education:{\"uuid\":\"52ea8da8-3a38-47d0-92aa-bf4e9aa3250d\"}":{"__typename":"Education","uuid":"52ea8da8-3a38-47d0-92aa-bf4e9aa3250d","school":{"__ref":"School:{\"uuid\":\"9f253b43-298b-4a31-beba-67fdd3ca89e5\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"541586da-7ebd-4d85-83f9-358053135e02\"}":{"__typename":"School","uuid":"541586da-7ebd-4d85-83f9-358053135e02","name":"The University of Oklahoma","city":"Norman","type":"COLLEGE","state":"Oklahoma","country":"United States","zip":"73019"},"Education:{\"uuid\":\"361d427a-d864-4388-87ff-09badef9143e\"}":{"__typename":"Education","uuid":"361d427a-d864-4388-87ff-09badef9143e","school":{"__ref":"School:{\"uuid\":\"541586da-7ebd-4d85-83f9-358053135e02\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2022","major":"Chemical Engineer - Premed","degree":null},"MentorPublicProfile:{\"uuid\":\"90ed90de-e694-478d-9529-4c6f64c2560d\"}":{"__typename":"MentorPublicProfile","uuid":"90ed90de-e694-478d-9529-4c6f64c2560d","displayName":"Shaila P.","slug":"shaila-patel","biography":"\u003cp\u003eShaila Patel is a Software Engineer, product leader, and AI startup co-founder with a multidisciplinary background spanning engineering research, enterprise technology, application development, and entrepreneurship. She holds a degree in Chemical Engineering from the University of Oklahoma, where she developed a strong analytical foundation in experimental design, data analysis, and systems thinking—skills she has since applied across software engineering, AI, and product development.\u003c/p\u003e\u003cp\u003eShaila brings formal research and development experience from Colgate-Palmolive, where she contributed to foam rheology research within a consumer products R\u0026amp;D environment. Her work focused on analyzing the flow, stability, and performance behavior of foam-based formulations, supporting product optimization through experimental testing, data interpretation, and corrective action initiatives. This experience strengthened her ability to translate experimental findings into practical engineering improvements.\u003c/p\u003e\u003cp\u003eShe also conducted advanced academic research at Columbia University, contributing to multi-organ tissue chip research designed to model complex human physiology. Her work supported interconnected organ-on-chip systems that enabled physiological communication between heart, liver, bone, and skin tissue models for improved drug safety and efficacy testing. This research bridged chemical engineering, bioengineering, and systems-level modeling.\u003c/p\u003e\u003cp\u003eProfessionally, Shaila works at Accenture as a Software Engineer and Lead Quality Engineer on a large-scale Texas Medicaid system. She leads automation and regression testing efforts, integrates DevOps practices, and collaborates with developers, business analysts, and clients to deliver reliable, cloud-based solutions. Her technical experience includes automation frameworks, Oracle SQL, SOAP UI, Azure DevOps, and test strategy development, earning her recognition through Accenture’s Top Talent Award.\u003c/p\u003e\u003cp\u003eBeyond enterprise systems, Shaila has extensive experience in application development. She has built and led the development of mobile and web applications for influencers, athletes, and public figures, managing sprint planning, feature scoping, UI development, and cross-functional delivery while maintaining strong client relationships.\u003c/p\u003e\u003cp\u003eShe is also actively working on a side project in collaboration with the Oklahoma City Thunder and Google, where she is helping build a fan engagement data analytics dashboard. This project focuses on leveraging cloud technologies and data analytics to transform fan interaction data into actionable insights, supporting strategic decision-making and enhanced fan experiences.\u003c/p\u003e\u003cp\u003eIn parallel, Shaila is the co-founder of an AI-driven startup delivering intelligent, user-centric solutions. She leads product development, UI/UX design, and AI implementation, with an AI product currently deployed at Charleston Airport in West Virginia to support customer service during low-staffed periods.\u003c/p\u003e\u003cp\u003eDriven by innovation and impact, Shaila is also deeply committed to mentorship and community service and has been recognized with honors including the Presidential Honor Award (Bronze) and Oklahoma 30 Under 30. Her career reflects a rare blend of research rigor, software engineering, app development, and data-driven product leadership.\u003c/p\u003e","teachingVideoPlaybackId":"DokmOYDDqHFzwM8ULbVVowAjsEZ55oZf56up2uwCuug","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI would say my greatest achievement is my ability to create real impact across multiple areas—technology, entrepreneurship, and community leadership. I co-founded an AI startup that is being used by real clients, including airports, to solve real-world problems, which allowed me to combine my technical skills with business vision. At the same time, I’ve led volunteering and mentorship programs that have positively affected students and communities, earning recognition like the Presidential Honor Award: Bronze and Oklahoma 30 Under 30. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e54297ee-d4e9-4293-a3e7-161b344eb69b\"}"},{"__ref":"Favorites:{\"uuid\":\"a3e8d037-8c1f-4dfc-9021-d54369158d2f\"}"},{"__ref":"Favorites:{\"uuid\":\"55fe69e5-cd17-4220-b8bd-7d7697c9a890\"}"}],"causesSupported":[],"major":"Chemical Engineer - Premed","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f81beb41-c544-475a-82e1-faba8df4f9a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"e467b3e0-8833-4119-a659-c030eaedc84d\"}"},{"__ref":"DeepDives:{\"uuid\":\"8d42b4a8-d0a0-48e6-bb14-1f036dcdfae1\"}"},{"__ref":"DeepDives:{\"uuid\":\"d079b7fc-fff8-40f9-82d8-2f4b1d523af3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/db3197b0-1ced-4dad-8b64-7db16cb56459/-/preview/-/format/jpg/","https://ucarecdn.com/2ee9b16c-cf88-418a-bcd0-9a996ddf981e/-/preview/-/format/jpg/","https://ucarecdn.com/20fddb77-5e5c-406f-ba7f-242ed8b025e4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"52ea8da8-3a38-47d0-92aa-bf4e9aa3250d\"}"},{"__ref":"Education:{\"uuid\":\"361d427a-d864-4388-87ff-09badef9143e\"
