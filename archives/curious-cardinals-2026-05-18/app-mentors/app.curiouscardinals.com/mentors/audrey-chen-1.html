xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"765aa341-4a41-494a-9bd5-02416890ce22\"}":{"__typename":"Favorites","uuid":"765aa341-4a41-494a-9bd5-02416890ce22","photoUrl":"https://ucarecdn.com/3677bc77-e46f-44ec-95b7-891d643bd3ac/","title":"The Three Body Problem","type":"BOOK"},"Favorites:{\"uuid\":\"df7ffdb4-b6c7-497b-9cfc-6a5a9c7a148f\"}":{"__typename":"Favorites","uuid":"df7ffdb4-b6c7-497b-9cfc-6a5a9c7a148f","photoUrl":"https://ucarecdn.com/a19965cc-806e-405d-9d10-7e557235ce6f/","title":"Kenshi Yonezu","type":"ARTIST"},"Favorites:{\"uuid\":\"b6a73cd6-52a4-4ac0-b68f-c39a3ddd5b92\"}":{"__typename":"Favorites","uuid":"b6a73cd6-52a4-4ac0-b68f-c39a3ddd5b92","photoUrl":"https://ucarecdn.com/4e014f3d-5f48-4f62-934e-2857e76e53a2/","title":"Love. by Kendrick Lamar","type":"SONG"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9265f626-ee1d-4f73-91cb-b99f31e64a4f\"}":{"__typename":"DeepDives","uuid":"9265f626-ee1d-4f73-91cb-b99f31e64a4f","content":"\u003cp\u003eIn my spare time, I like to practice some of the newer hobbies I have picked up. I am currently expanding my skills in dancing through hip hop classes and breaking (breakdance) practice. I grew up pretty unathletic and with little dance exposure, so this is definitely something beyond my comfort zone! However, I am motivated to continue practicing because I love the passion and unity behind dance. To move is to connect and to express yourself freely!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"05255cad-d92a-4a90-934e-b8a03e8ae3dd\"}":{"__typename":"DeepDives","uuid":"05255cad-d92a-4a90-934e-b8a03e8ae3dd","content":"\u003cp\u003eI remember when I was a high school student, I wanted to do everything. I was in DECA, FBLA, Youth and Government (YAG) club, robotics club, and Math Honor Society. Despite all of these clubs being highly interesting, I often felt like I was (barely) a jack of all trades and a master of none. I also felt my membership in some clubs was inauthentic to my real interests. As a college student, my time is much more precious. I still believe in exploring beyond my comfort zone, but now I do it with much more intentionality behind it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"fdacb4ec-3d49-4678-b0dd-c136ab2b860b\"}":{"__typename":"DeepDives","uuid":"fdacb4ec-3d49-4678-b0dd-c136ab2b860b","content":"\u003cp\u003eMy dream job is to be an Imagineer creating animatronics at Disney! Disney World alone has about 6,000 animatronics across its property. Each minute movement is carefully engineered by their talented team. As the technology continues to develop, these animatronics have become more and more lifelike over the years!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b91d1834-3597-46e0-aaad-f49ad40b8c40\"}":{"__typename":"DeepDives","uuid":"b91d1834-3597-46e0-aaad-f49ad40b8c40","content":"\u003cp\u003eMentorship is important to me because I value giving back to my community. For me, my community includes the next generation of talented thinkers and doers who are inspired by paths similar to my own. As a mentor, I am humbled by the reality that the experiences I have gathered in the classroom, workplace, and beyond can be shared with my students for their benefit. It is thus a privilege and a necessity for me to do everything I can to serve as an enriching resource for my future mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"77eea81a-8148-40a0-9d1d-5a46713becef\"}":{"__typename":"School","uuid":"77eea81a-8148-40a0-9d1d-5a46713becef","name":"Monroe Township High School","city":"Monroe Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08831"},"Education:{\"uuid\":\"215f3d23-6d6b-45e5-829c-1a532018bb0f\"}":{"__typename":"Education","uuid":"215f3d23-6d6b-45e5-829c-1a532018bb0f","school":{"__ref":"School:{\"uuid\":\"77eea81a-8148-40a0-9d1d-5a46713becef\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"e5bda7e4-79d1-4f29-aecf-3e37556785ae\"}":{"__typename":"Education","uuid":"e5bda7e4-79d1-4f29-aecf-3e37556785ae","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"e821c3cd-d9fc-4511-b761-f205716ab1ba\"}":{"__typename":"MentorPublicProfile","uuid":"e821c3cd-d9fc-4511-b761-f205716ab1ba","displayName":"Audrey C.","slug":"audrey-chen-1","biography":"\u003cp\u003eHi!\u003c/p\u003e\u003cp\u003eMy name is Audrey. I'm available to provide academic mentorship and passion project mentorship for adventurous middle schoolers and high schoolers!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm a graduate student studying mechanical engineering at Carnegie Mellon University in Pittsburgh. I am passionate about product design, theme park engineering, software/artificial intelligence, and manufacturing processes. I grew up in central NJ and attended public school there. I have two younger siblings and one bunny named Boba.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy School Activities\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI helped organize the STEM Career Fair for my college as a volunteer coordinator. Additionally, I served as the treasurer of my school’s American Society of Mechanical Engineers chapter. I am a member of my school’s Theme Park Engineering Group, with whom I worked on an animatronic Velociraptor head. I made our blinking eyeballs!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Professional Experience\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI have worked in the manufacturing industry as an operations intern for DuPont and as an assembly intern for a small firm called GasFlo Products. In the manufacturing space, operations engineers take care of maintaining the factory processes through improvement projects or repairs. At DuPont, I helped design a safety guard, update pipe labels to fit site safety code, and researched computer vision vendors for a production improvement project. At GasFlo, I helped build actuators and test them. I also modified 2D and 3D product models for our customer database.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Tutoring Experience\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI have been tutoring students since I was a freshman in high school. I started off tutoring elementary students in math and reading. In my undergraduate years, I tutored college students in physics 1 \u0026amp; 2, Python, dynamics, and numerical methods (MATLAB). Additionally, I taught introductory Python lessons to middle school students through the Society of Women Engineers (SWE).\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat Else?\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I like to write, dance, climb, play ping pong, read the Bible, crochet, and occasionally bang out a song on the piano. My favorite TV shows are Invincible, Jujutsu Kaisen, Attack on Titan, any anything with X-men (I’m a big nerd). Currently, I am reading \u003cem\u003eA History of Western Philosophy\u003c/em\u003e by Bertrand Russell. One fun fact of mine is that I used to compete in the National History Bee in middle school! In addition to hobbies and studies, I recently joined a nonprofit startup tackling food insecurity in cities such as Pittsburgh. \u003cu\u003eLiving a balanced life and helping others are both really important to me.\u003c/u\u003e\u003c/p\u003e","teachingVideoPlaybackId":"NQjTy3iqF00L3aadQ01vNCDGD150102BXvqdLP1yBX6WHAM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"765aa341-4a41-494a-9bd5-02416890ce22\"}"},{"__ref":"Favorites:{\"uuid\":\"df7ffdb4-b6c7-497b-9cfc-6a5a9c7a148f\"}"},{"__ref":"Favorites:{\"uuid\":\"b6a73cd6-52a4-4ac0-b68f-c39a3ddd5b92\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9265f626-ee1d-4f73-91cb-b99f31e64a4f\"}"},{"__ref":"DeepDives:{\"uuid\":\"05255cad-d92a-4a90-934e-b8a03e8ae3dd\"}"},{"__ref":"DeepDives:{\"uuid\":\"fdacb4ec-3d49-4678-b0dd-c136ab2b860b\"}"},{"__ref":"DeepDives:{\"uuid\":\"b91d1834-3597-46e0-aaad-f49ad40b8c40\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d2b79106-a8a4-4639-be1c-865448dd86a0/-/preview/-/format/jpg/","https://ucarecdn.com/6668a5c6-b74b-44c2-9e48-4261064b9a29/-/preview/-/format/jpg/","https://ucarecdn.com/2f81842b-ccd0-444c-831a-5bac70e84acc/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"215f3d23-6d6b-45e5-829c-1a532018bb0f\"}"},{"__ref":"Education:{\"uuid\":\"e5bda7e4-79d1-4f29-aecf-3e37556785ae\"}"}],"hiredAt":"2026-04-10T17:35:02.545Z","topics":["Algebra I","Algebra II","Calculus","K-5 Grade Math","Pre-Algebra","Physics","Writing","Academic Coaching","College Essay Writing","Computer Science","History","K-6 Storybook","Coding / Programming","Robotics / Electronics / CAD","STEM Project"],"communityBadges":["https://ucarecdn.com/754f9a3e-f5c4-4576-8cdd-2cdf8c2e4e63/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"audrey-chen-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e821c3cd-d9fc-4511-b761-f205716ab1ba\"}"}}},"_sentryTraceData":"fbda1246dc6e44fe9c9d406b4c678766-9df2a64e3952d4b5-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=fbda1246dc6e44fe9c9d406b4c678766,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"audrey-chen-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://
