8-8a74a0018529","school":{"__ref":"School:{\"uuid\":\"7720f99d-24a9-49cb-a93a-9044ffbf5954\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"History \u0026 CS","degree":null},"MentorPublicProfile:{\"uuid\":\"011cf783-81ab-4fbe-88c2-ea87e220fc01\"}":{"__typename":"MentorPublicProfile","uuid":"011cf783-81ab-4fbe-88c2-ea87e220fc01","displayName":"Quinn S.","slug":"quinn-shing","biography":"\u003cp\u003eHi, I am Quinn! This is me: a writer, multidisciplinary researcher, educator, and most importantly, a learner just like you! I have taught students from second grade to college, across subjects ranging from STEM and English as a Second Language to college application essays. My teaching journey has taken me through roles at a Boys \u0026amp; Girls Club in Canada, a Canadian elementary school, the FIFE-Penn STEM \u0026amp; CS Academy, the Netter Center at Penn, educational consulting agencies, and through self-employment. No matter the setting, the part I always love is the same: building meaningful, long-term relationships with students and helping them grow beyond what they imagined possible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have lived and studied in China, Canada, and now the United States. My international background has shaped how I view education. I know what it feels like to move between systems and expectations, and I always aim to make my students feel seen, supported, and inspired to explore. I loved the process of discovering my own passions and figuring out what truly excited me, so if you are still exploring what sparks your interest, I would love to explore alongside you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI double majored in Computer Science and History. My favorite historical period is the early twentieth century, particularly in Europe and China. I am also passionate about mobile app development in creative fields; this summer, I am working on an app for writers!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am currently a graduate student at the University of Pennsylvania studying Computer Science. My latest research focuses on the intersection of AI and creative writing; it is a blend of my love for storytelling and academic interests. I had the opportunity to present it at Brown University. Outside of school, I am an avid writer and reader. I have published several short works online in both English and Mandarin, run a Substack, and read close to a book a week. I enjoy all things creative, so if you want to talk about your favorite fictional characters or your plan to create a graphic novel, I am all ears. I also like baking, long runs, and strength training.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy core belief in education is to listen. A student just needs someone to listen to them, and it’s a bad habit to make assumptions about a student. In my lessons, I always ask, “What questions do you have?” to encourage the student’s doubts and imagination. Education isn’t just about the academics or even learning in general. It is about finding the one or few things you love and to develop the skills to eventually do them, then let this be your lifestyle and part of who you are.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether you share my passion for writing, planning a creative project, building an app, or still figuring it all out, I am here to guide you, cheer you on, and help you grow!\u003c/p\u003e","teachingVideoPlaybackId":"ZPZ8iT39MVh4fvQwMfYcoqqk00TdEgMq00D5N01mrqioCk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy creative journey began with Harry Potter fan-fiction. At the time, I had been living in an English-speaking environment for less than three years, and writing in English was still something new and challenging. But I was hooked, not just on stories, but on the act of shaping characters, building worlds, and finding my voice in a language that wasn’t yet fully mine.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, I’ve written three short novels in Chinese, and I now run a Substack where I share essays and fiction in English. Even though I only started using English daily at age 15, I’ve committed to writing in English because English is my private language.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"52e72991-11dc-4948-8880-170964386b6b\"}"},{"__ref":"Favorites:{\"uuid\":\"0a8462c4-2246-4c62-8cf8-1766e701376c\"}"},{"__ref":"Favorites:{\"uuid\":\"76453130-e08e-4c60-a12e-a66055e0a41c\"}"}],"causesSupported":[],"major":"History \u0026 CS","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1d401180-5881-4cc9-8fb0-f8d876131443\"}"},{"__ref":"DeepDives:{\"uuid\":\"d41fb692-2510-441c-9be0-7f45eaf4f1a5\"}"},{"__ref":"DeepDives:{\"uuid\":\"08313ab0-6588-4d7d-b090-cda363aba8cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"baabf392-59de-406f-b467-10810f98cd71\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c6801acb-187f-4007-a97f-7eb56df15d77/-/preview/-/format/jpg/","https://ucarecdn.com/077015d9-3e5f-4c12-bbd8-23e45f0b64ff/-/preview/-/format/jpg/","https://ucarecdn.com/f5702054-1cd8-4613-ad18-2b27746b89b1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"167a6810-2491-486d-a3e0-e1d0e262a856\"}"},{"__ref":"Education:{\"uuid\":\"228e7bac-7a65-4ea0-b5c8-8a74a0018529\"}"}],"hiredAt":"2025-05-10T14:25:48.683Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Mandarin Chinese","Academic Coaching","College Essay Writing","History","Computer Science","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Finance / Investing"],"communityBadges":["https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({
