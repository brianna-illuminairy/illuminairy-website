xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"eeffe9b4-e614-47a2-bb4e-87ebf7d8e1aa\"}":{"__typename":"DeepDives","uuid":"eeffe9b4-e614-47a2-bb4e-87ebf7d8e1aa","content":"\u003cp\u003eI am most proud of moving from Illinois to Delaware for undergrad. I was extremely nervous to start school in a place where I didn't know a single other person, but doing so has given me so much confidence to keep taking on challenges and trying new things!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"18d4f308-1d15-4b19-a346-19fff191a3c9\"}":{"__typename":"DeepDives","uuid":"18d4f308-1d15-4b19-a346-19fff191a3c9","content":"\u003cp\u003eI would tell my high school self to trust the process. Especially when it came to academics, I was easily overwhelmed by everything I didn't yet know and always worried that I didn't have the skills to learn new things or pursue daunting professional goals. Looking back on my journey to where I am now, it is really amazing to see how much I've grown both personally and professionally just by trying new things and not being afraid to ask for help!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"eb78dc56-8d59-4b3e-b61f-8fa5a7ef554d\"}":{"__typename":"DeepDives","uuid":"eb78dc56-8d59-4b3e-b61f-8fa5a7ef554d","content":"\u003cp\u003eIn my spare time, you can find me training for my next marathon or re-watching the Harry Potter movies!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"618e8e40-bb40-4d72-bebc-96ef8c4c69d1\"}":{"__typename":"DeepDives","uuid":"618e8e40-bb40-4d72-bebc-96ef8c4c69d1","content":"\u003cp\u003eMy high school physics teacher played a huge role in my choice to pursue engineering. Physics was presented to me as a puzzle with very specific rules to follow to solve it, and I really enjoyed that process. I was also always interested in medicine, so biomedical engineering seemed like a good way to combine these two subjects. I am very fortunate that I chose a major that I loved and continue to pursue in graduate school!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"4f6de666-f960-45cc-a778-9cb161b715ff\"}":{"__typename":"School","uuid":"4f6de666-f960-45cc-a778-9cb161b715ff","name":"Plainfield Central High School","city":"Plainfield","type":"HIGH","state":"Illinois","country":"United States","zip":"60544"},"Education:{\"uuid\":\"30573cf1-2745-43cb-8d5d-3e5d0abbe303\"}":{"__typename":"Education","uuid":"30573cf1-2745-43cb-8d5d-3e5d0abbe303","school":{"__ref":"School:{\"uuid\":\"4f6de666-f960-45cc-a778-9cb161b715ff\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3aeb534d-0e3f-4bb2-9dd1-2ba497eaf613\"}":{"__typename":"School","uuid":"3aeb534d-0e3f-4bb2-9dd1-2ba497eaf613","name":"University of Delaware","city":"Newark","type":"COLLEGE","state":"Delaware","country":"United States","zip":"19716"},"Education:{\"uuid\":\"434e06c5-941a-461f-8e3e-07e28928b7b6\"}":{"__typename":"Education","uuid":"434e06c5-941a-461f-8e3e-07e28928b7b6","school":{"__ref":"School:{\"uuid\":\"3aeb534d-0e3f-4bb2-9dd1-2ba497eaf613\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2022","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"88e92315-b75f-4208-837b-b59d68c96d87\"}":{"__typename":"MentorPublicProfile","uuid":"88e92315-b75f-4208-837b-b59d68c96d87","displayName":"Katy S.","slug":"katy-strand","biography":"\u003cp\u003eHi everyone, my name is Katy, and I'm passionate about al things science, engineering, and medicine! I am currently pursuing my PhD in bioengineering at the University of Pennsylvania, and earned my Bachelor's in biomedical engineering at the University of Delaware with minors in biomechanics and disability studies. My main interests are in the musculoskeletal system and human movement. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI firmly believe that if you are truly passionate about pursuing a goal, no matter how far off it may seem, you have every right to go for it. You belong where you are, and you are not an imposter when it comes to your true passions and interests. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn undergrad, I was involved in many engineering organizations focused on disability advocacy as well as uplifting women in STEM. I am also currently involved with a non-profit organization focused on empowering women and non-binary individuals to pursue careers in engineering and orthopaedic surgery. Overall, I am extremely excited about accessible STEM education and introducing underrepresented groups to these fields as early as possible. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work and academics, I enjoy reading thriller novels, playing with my cat, and staying active. I am a retired competitive figure skater, and enjoy long distance running.\u003c/p\u003e","teachingVideoPlaybackId":"xtrcCQoucUdJeYU01nhR4KVbtGUgLRTvU02n200Tm5fPF4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"eeffe9b4-e614-47a2-bb4e-87ebf7d8e1aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"18d4f308-1d15-4b19-a346-19fff191a3c9\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb78dc56-8d59-4b3e-b61f-8fa5a7ef554d\"}"},{"__ref":"DeepDives:{\"uuid\":\"618e8e40-bb40-4d72-bebc-96ef8c4c69d1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c83716bd-a03a-4d59-a9ca-d03174de1258/-/preview/-/format/jpg/","https://ucarecdn.com/4be171c2-91a3-45e4-9249-4e0846ce9d06/-/preview/-/format/jpg/","https://ucarecdn.com/0a752720-b120-4fe6-a294-0b9c0031224a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"30573cf1-2745-43cb-8d5d-3e5d0abbe303\"}"},{"__ref":"Education:{\"uuid\":\"434e06c5-941a-461f-8e3e-07e28928b7b6\"}"}],"hiredAt":"2025-05-05T23:28:22.677Z","topics":["Calculus","Precalculus / Trigonometry","Algebra I","Algebra II","Geometry","Statistics","Pre-Algebra","Biology","Physics","College Essay Writing","Academic Coaching","Executive Function"],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"katy-strand\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"88e92315-b75f-4208-837b-b59d68c96d87\"}"}}},"_sentryTraceData":"4a320c4927d74d3b8081943068782d1a-9dcdbf4cdcf243af-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cd
