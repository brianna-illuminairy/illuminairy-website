me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"cf26ac88-5189-42d4-9b6a-7e3bb22dda4c\"}":{"__typename":"School","uuid":"cf26ac88-5189-42d4-9b6a-7e3bb22dda4c","name":"Sun Valley Community School","city":"Sun Valley","type":"HIGH","state":"Idaho","country":"United States","zip":"83353"},"Education:{\"uuid\":\"215c16be-af4b-448a-8f19-6220e58221a7\"}":{"__typename":"Education","uuid":"215c16be-af4b-448a-8f19-6220e58221a7","school":{"__ref":"School:{\"uuid\":\"cf26ac88-5189-42d4-9b6a-7e3bb22dda4c\"}"},"startYear":"2021","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"0cce3804-1a23-4aec-b258-a89b41964484\"}":{"__typename":"Education","uuid":"0cce3804-1a23-4aec-b258-a89b41964484","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics and History","degree":null},"MentorPublicProfile:{\"uuid\":\"7767d8e1-342d-4222-bfb3-a5820a2aebec\"}":{"__typename":"MentorPublicProfile","uuid":"7767d8e1-342d-4222-bfb3-a5820a2aebec","displayName":"Emma S.","slug":"emma-singer-2","biography":"\u003chr\u003e\u003cp\u003eHi! I'm West Coast born and bred, originally from San Francisco, and later Sun Valley, Idaho, but I am currently embracing the concrete jungle of the East Coast. I grew up ski racing and running, spent high school slinging espresso as a barista, and running a mobile library in rural Idaho. These experiences taught me the value of community, hard work, and showing up for the people around you.\u003c/p\u003e\u003cp\u003eNow, I'm an American History major with an advanced language certificate at Yale. My academic interests center on the stories that shape who we are as a nation, and considering the past as a tool to understand the future. I'm drawn especially to political and government history, particularly the decisions, debates, and figures that have defined how power is built, challenged, and transferred across generations in America.\u003c/p\u003e\u003cp\u003eOutside of coursework, I keep pretty busy! I'm a staff writer for the Yale Herald, a producer and director of student plays, the Treasurer of the Yale Student Film Festival, and a captain of the Yale Club Nordic Ski Team. I'm also an artist manager at Yale's 1701 Student Record Label and a Hillel Worldwide Jewish Learning Fellow. On top of all that, I volunteer as a reading tutor for New Haven youth, a role that feels close to my heart given my background running a mobile library in rural Idaho.\u003c/p\u003e\u003cp\u003eMy professional experience spans a few different worlds. I've worked as a Financial Analyst at American Capital Advisory, where I supported wealth management research and rebuilt the firm's website. I've headed up Public Relations for Sister Summit, a female-led ski and snowboard event promoting women's representation in the outdoor industry. And I've coached youth cross-country skiing, interned at a domestic violence advocacy organization, and provided childcare and barista work along the way.\u003c/p\u003e\u003cp\u003eWhen I'm not reading, writing, or exploring new places, you'll find me on a long run with a podcast in my ears, or skiing somewhere in the mountain west. I love finding connections between the history I study and the world happening around me.\u003c/p\u003e\u003cp\u003eI'm excited to swap stories, share what I've learned, and help you find your own path, wherever it may lead!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics and History","deepDives":
