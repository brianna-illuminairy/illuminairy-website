xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6889f65e-0ed7-457e-a2c2-36b0ebb15ac2\"}":{"__typename":"DeepDives","uuid":"6889f65e-0ed7-457e-a2c2-36b0ebb15ac2","content":"\u003cp\u003eI’d tell my younger self to go deeper into a few passions instead of spreading energy across everything; real growth comes from curiosity and commitment. Work hard and set high standards, but don’t let stress take over, especially for things outside your control. Ask questions early, get comfortable being confused, and treat mistakes as part of learning, not failure. Confidence builds when you focus on progress, not perfection.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"75f9c06e-cf90-4749-b36a-d9ad78a993d6\"}":{"__typename":"DeepDives","uuid":"75f9c06e-cf90-4749-b36a-d9ad78a993d6","content":"\u003cp\u003eIn my spare time, I love staying active and getting outdoors, especially swimming, running, and biking. I’m drawn to endurance sports because they challenge both my body and my mindset, and I hope to complete an Ironman in the future. Whether it’s training, hiking, or going for long walks outside, movement is how I decompress, manage stress, and reset my focus outside of schoolwork.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"e429e0b0-b8a2-40b5-b1d2-327a628eabc1\"}":{"__typename":"DeepDives","uuid":"e429e0b0-b8a2-40b5-b1d2-327a628eabc1","content":"\u003cp\u003eMentorship is meaningful to me because I genuinely enjoy helping others grow and learn, both from my successes and my mistakes. After over four years of tutoring, I’ve seen how the right guidance can boost a student’s confidence and change how they view learning. Every student has a unique story and set of needs, and figuring out how to support them academically and personally is what I find most rewarding.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"6460f8ed-6700-4e1c-8565-a5f28cdf424d\"}":{"__typename":"DeepDives","uuid":"6460f8ed-6700-4e1c-8565-a5f28cdf424d","content":"\u003cp\u003eMy greatest source of motivation is giving back to my family and community. I’m driven by the support I’ve received throughout my academic journey and want to pay that forward by helping others succeed. Supporting students and families who are working hard toward their goals is what keeps me focused and inspired.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"7bc28e78-3bfa-4d13-b079-427226d9c136\"}":{"__typename":"Education","uuid":"7bc28e78-3bfa-4d13-b079-427226d9c136","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Math (Statistics), Chemistry","degree":null},"School:{\"uuid\":\"42b74ffc-d574-4009-a4da-b553145f45e5\"}":{"__typename":"School","uuid":"42b74ffc-d574-4009-a4da-b553145f45e5","name":"Arnold O. Beckman High School","city":"Irvine","type":"HIGH","state":"California","country":"United States","zip":"92602"},"Education:{\"uuid\":\"686191f2-d2fc-4ad7-b5dd-31cbe99bf107\"}":{"__typename":"Education","uuid":"686191f2-d2fc-4ad7-b5dd-31cbe99bf107","school":{"__ref":"School:{\"uuid\":\"42b74ffc-d574-4009-a4da-b553145f45e5\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"e6590020-6d03-4e80-b78a-81a5920d5d10\"}":{"__typename":"MentorPublicProfile","uuid":"e6590020-6d03-4e80-b78a-81a5920d5d10","displayName":"Isabel K.","slug":"isabel-khan","biography":"\u003cp\u003eHi! My name is Isabel, and I’m a Mathematical Sciences major with a concentration in Statistics at Carnegie Mellon University, graduating in May 2026. I’ve always loved learning \u003cem\u003ehow\u003c/em\u003e things work, whether that’s breaking down a tough math problem or understanding patterns in large datasets. Tutoring gives me the chance to combine my love for problem-solving with something I care deeply about: helping students feel confident in their abilities.\u003c/p\u003e\u003cp\u003eAcademically, I spend much of my time working with math, statistics, chemistry, and biology. I’ve taken coursework ranging from discrete mathematics and probability theory to operations research and machine learning, and I regularly apply these skills through research and internships. I currently work as a student researcher in a cardiopulmonary engineering lab, where I analyze large datasets and help design efficient experimental methods, and I’ve also worked in clinical research validating statistical methods used in FDA-aligned studies. These experiences have taught me how to explain complex ideas clearly, precisely, and patiently.\u003c/p\u003e\u003cp\u003eOutside of academics, I’m deeply involved in athletics and leadership. I served as Vice President of Carnegie Mellon’s Club Swimming team, where I helped organize large events, managed budgets, and supported teammates both in and out of the pool. I’m also an endurance sports enthusiast: I love running, swimming, and biking, have completed a half marathon, and am training toward a full marathon with the long-term goal of completing an Ironman someday. Endurance sports have shaped how I approach learning, progress takes consistency, setbacks are part of the process, and improvement comes from showing up and trying again.\u003c/p\u003e\u003cp\u003eAs a tutor, my goal is not just to help students get the right answer, but to help them \u003cem\u003eunderstand why\u003c/em\u003e an answer works and feel empowered to tackle similar problems on their own. I tailor my approach to each student’s learning style, whether that means walking through examples step-by-step, connecting material to real-world applications, or building confidence through practice and encouragement. I strive to create a supportive, low-pressure environment where questions are always welcome.\u003c/p\u003e\u003cp\u003eIf you’re looking for a tutor who is patient, enthusiastic, and genuinely invested in your growth, I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"VjxR695j0290100wF6ZAjp201zXnbFCjMyp5mVn00bIE5Sgw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Math (Statistics), Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6889f65e-0ed7-457e-a2c2-36b0ebb15ac2\"}"},{"__ref":"DeepDives:{\"uuid\":\"75f9c06e-cf90-4749-b36a-d9ad78
