xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d2497c1e-364f-4ed8-86de-8942844e692a\"}":{"__typename":"DeepDives","uuid":"d2497c1e-364f-4ed8-86de-8942844e692a","content":"\u003cp\u003eBoth my parents are teachers (my mom teaches French and my dad teaches Media Arts and Computer Science) so there was a time when every summer, whole family was either work at a summer school/camp or on a family camping roadtrip. During high school, I worked at my local farmers' market on the weekends but spent a large part of my summers working at my school's French educational summer camp. The camps were organized around different themes: from cooking and sports to countries around the world and ecology. Students at the camps had a wide range of fluency in English, French, and many other languages. The camps were particularly useful in giving students who were not as comfortable in French a space to use French for fun. However, the students were not the only ones learning to push themselves out of their comfort zones. Even though I had always view French as a classroom language, the camps taught me to see French as a language where I could lead confidently, entertain, and inspire curiosity in students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3c8e1f90-cc41-41a0-ba36-a6982123fa29\"}":{"__typename":"DeepDives","uuid":"3c8e1f90-cc41-41a0-ba36-a6982123fa29","content":"\u003cp\u003eI love to read, sketch, and go on hikes!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"07b326bf-f74e-4ece-83c7-40f6178cdf3c\"}":{"__typename":"DeepDives","uuid":"07b326bf-f74e-4ece-83c7-40f6178cdf3c","content":"\u003cp\u003eI chose to major in Architecture because I found it fascinatingly difficult to visualize 3-dimensional space and figured out early on that it is possible to close-read a building the same way I was taught in high school to close read a book. I had originally applied to university as a civil engineering student and loved how the creativity of Architecture made everything I had every learned feel related and applicable to my major.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a25704ef-dd09-437e-920e-af5ea1d2ef26\"}":{"__typename":"DeepDives","uuid":"a25704ef-dd09-437e-920e-af5ea1d2ef26","content":"\u003cp\u003eI am constantly motivated by the idea that there is no learning without some degree of discomfort and that I will never be adaptable as I am now. Through this idea, I able to see challenges and failures as opportunities and genuine growth. The value of trying new things and appreciate moments of discomfort reminds me to appreciate the present moment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"e9666d2f-6cd3-45fe-a750-91edf224a809\"}":{"__typename":"School","uuid":"e9666d2f-6cd3-45fe-a750-91edf224a809","name":"Lycee Francais de San Francisco","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94122"},"Education:{\"uuid\":\"dc790bb3-d2f9-4fd0-8ed3-9264e505088d\"}":{"__typename":"Education","uuid":"dc790bb3-d2f9-4fd0-8ed3-9264e505088d","school":{"__ref":"School:{\"uuid\":\"e9666d2f-6cd3-45fe-a750-91edf224a809\"}"},"startYear":"2012","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"cda615ee-77ca-47d9-b762-c6b006fa9d2d\"}":{"__typename":"Education","uuid":"cda615ee-77ca-47d9-b762-c6b006fa9d2d","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2025","major":"Architecture","degree":null},"MentorPublicProfile:{\"uuid\":\"6fbba58f-07e1-490a-b651-8814cf1da732\"}":{"__typename":"MentorPublicProfile","uuid":"6fbba58f-07e1-490a-b651-8814cf1da732","displayName":"Chiara V.","slug":"chiara-vs","biography":"\u003cp\u003eHello! I'm Chiara, a recent Architecture graduate from San Francisco with a career interest in Urban Design. I recently finished my thesis on the architecture of social dancing and the possibility of looking at shadow as its own environmental condition rather than a lack of light.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about all things city: I love to think about, design, and creating anything that involves strangers coming together to operate and create temporary moments of community. I am fascinated by multitude of layers (movement, housing, landscape, language, history, politics, industry, etc.) that go into the ever-evolving organization of a city.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up outside San Francisco and started attending the Lycée Français de San Francisco in 6th grade. It was a difficult academic and culture adjustment but one that I now infinitely grateful for. After all, it gave me the confidence to engage in a nine month gap-year program in Bolivia. The program consisted of longterm home stays, intensive Spanish classes, backpacking, a personal volunteer project, and consistent education on Bolivia's political, historical, and cultural environment. Through a series of local politic events, nine months quickly pivoted to two months in Bolivia followed by five months in Peru. Ultimately, we were forced to leave Peru and cancel the program early due to the COVID pandemic. My first gap year was filled with unexpected turns, new languages, fast-changing environments, and new skills I never thought I would need. I have a unique background and life experience that has shaped the way I engage with the world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I specialize in helping students build learning strategies that are unique to them. At Princeton University's Center for Learning, I worked for three years as a Life and Learning Consultant. A large part of this job consisted of working with individual students to create unique learning approaches to fit their needs. I helped students find the link between their intrinsic motivations and the skills they build in class day to day. My goal, when I mentor students, is guide them towards finding a sense of agency in their education and creating meaningful connections with the knowledge they build throughout their lives. I ask the important questions that give students the space to reflect and be honest with themselves, teaching them to see their education as a holistic experience where they learn about themselves and the  world around them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy mentorship style is caracterized by observation and listening and is guided by a genuine interest in other people's perspectives. I meet students where they are and teach them to lead the way. From the Princeton students I have mentored in different capacities, to the K-5 students I taught during French bilingual summer educational camps, to the Moroccan students of all ages that I helped build their conversational English skills, I am continuously amazed at people's ability to learn, grow, and lead when given the chance.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e","teachingVideoPlaybackId":"PfvyHPAW01Go01Li68YF023Mi4SdFYYbH297UKkVG19YLM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Architecture","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d2497c1e-364f-4ed8-86de-8942844e692a\"}"},{"__ref":"DeepDives:{\"uuid\":\"3c8e1f90-cc41-41a0-ba36-a6982123fa29\"}"},{"__ref":"DeepDives:{\"uuid\":\"07b326bf-f74e-4ece-83c7-40f6178cdf3c\"}"},{"__ref":"DeepDives:{\"uuid\":\"a25704ef-dd09-437e-920e-af5ea1d2ef26\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8b497f33-bb1e-457b-8bf6-463335faa797/-/preview/-/format/jpg/","https://ucarecdn.com/2bad7f66-6d9b-4a8a-b049-8c1db788b83f/-/preview/-/format/jpg/","https://ucarecdn.com/c88abb47-28b8-4d96-a13a-27434470a9da/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"dc790bb3-d2f9-4fd0-8ed3-9264e505088d\"}"},{"__ref":"Education:{\"uuid\":\"cda615ee-77ca-47d9-b762-c6b006fa9d2d\"}"}],"hiredAt":"2025-07-07T12:02:04.169Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","French","Latin","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","h
