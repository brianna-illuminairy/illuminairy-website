xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"66ed9101-9778-471a-9069-24ff438946a6\"}":{"__typename":"DeepDives","uuid":"66ed9101-9778-471a-9069-24ff438946a6","content":"\u003cp\u003eDon't be afraid to ask silly, absurd questions. You will find what you're looking for if you just ask. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b46ed2a6-fc19-457c-92c3-748012fcd3be\"}":{"__typename":"DeepDives","uuid":"b46ed2a6-fc19-457c-92c3-748012fcd3be","content":"\u003cp\u003eI hope to visit all the national parks in the United States in my lifetime. I love to be outside and witness the splendor of creation. I have so many fond memories of roadtrips with my family to parks and hiking great trails. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2d78f436-e479-4853-b396-7a9ffd16c39b\"}":{"__typename":"DeepDives","uuid":"2d78f436-e479-4853-b396-7a9ffd16c39b","content":"\u003cp\u003eI spent one summer working at a retirement community serving dinners to elderly residents. I also worked as a camp counselor for a STEM camp for young girls. When not outside the house, I spent many nights baking with my sister and helping my mom in her vegetable garden, and going on runs with my dad. My family also loved playing pickleball. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b8745982-e43c-4738-ac29-8949aa6f89a5\"}":{"__typename":"DeepDives","uuid":"b8745982-e43c-4738-ac29-8949aa6f89a5","content":"\u003cp\u003eI like to create short films from the small videos and clips I capture in the day to day of my life. It helps me keep a remnant of the past and convey the joys in my life to people who I'm far from. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"fe743871-4705-437b-a775-a1ce0d3ce067\"}":{"__typename":"School","uuid":"fe743871-4705-437b-a775-a1ce0d3ce067","name":"Shaker High School","city":"Latham","type":"HIGH","state":"New York","country":"United States","zip":"12110"},"Education:{\"uuid\":\"a68bef6f-778e-4b67-a369-b94bf3e40edb\"}":{"__typename":"Education","uuid":"a68bef6f-778e-4b67-a369-b94bf3e40edb","school":{"__ref":"School:{\"uuid\":\"fe743871-4705-437b-a775-a1ce0d3ce067\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"0f903b42-c5ed-4513-9de2-8f1310048b4d\"}":{"__typename":"Education","uuid":"0f903b42-c5ed-4513-9de2-8f1310048b4d","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"4efc5270-b6a8-4527-b50f-5827720b15c0\"}":{"__typename":"MentorPublicProfile","uuid":"4efc5270-b6a8-4527-b50f-5827720b15c0","displayName":"Christina C.","slug":"christina-cheng","biography":"\u003cp\u003eHi! I’m Christina. I’m a rising junior at Cornell University studying Neurobiology and Behavior on the pre-medical track. I have always had a deep curiosity about the brain, human behavior, and what it means to live authentically, which proliferated in high school through Brain Bee competitions and simple conversations with my cherished elderly friends and neighbors. In high school, a professor who didn’t previously collaborate with nonundergraduates invited me to write a neuroscience blog with him, which established the foundation for engaging with scientific communication early on. That mentorship and intellectual relationship has continued to this day, reinforcing my love for lifelong learning and thoughtful dialogue.\u003c/p\u003e\u003cp\u003eI love to embrace challenges and failures. As a teaching assistant for organic chemistry, I’ve learned how true growth often comes from reframing difficult concepts, adapting to different learning styles, and helping others discover confidence in initially overwhelming things. At Cornell, my passion for growth through challenge has expanded through both research and mentorship. In a brain computation lab, I study neural circuitry and decision-making by exploring how different brain regions interact during behaviors like foraging. I’m also part of Cornell’s synthetic biology project team, where we developed an award-winning bioreactor designed to house engineered bacteria capable of reducing toxic perchlorate chemicals in Martian soil, supporting future agricultural sustainability in extraterrestrial environments. Through interdisciplinary collaboration, experimental design, and strategic problem-solving, our team earned recognition for Best Hardware Project, and I learned how innovation often requires creativity as much as scientific rigor.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of science, creativity is central to who I am. I love writing poetry and prose for Cornell’s journal of Christian thought, where I’ve had the opportunity to attend annual conferences, engage in meaningful dialogue, and connect with professors from remarkable universities across the country. I practice calligraphy not only as an art form, but as a way to serve others. I am enthusiastic about designing signs for friends’ events, creating custom pieces, and making t-shirt designs for organizations and clubs I’m involved in. I also love baking for people, finding joy in creating small acts of care and connection through food. Similarly, music is both cathartic and tranquil simultaneously for me. I play the cello and had the incredible opportunity to perform at Carnegie Hall with my high school symphony orchestra, and I continue to share music through performances and recitals in college and believe it is important to not forsake your creative passions even when seasons in life change. Whether through writing, design, music, or mentorship, creativity is a powerful avenue for me to encourage others and foster beauty.\u003c/p\u003e\u003cp\u003eWhen I’m not studying or creating, I’m usually spending time outdoors running, hiking in national parks, or even pogo sticking. I am also a devoted edamame enthusiast, and I love trying new recipes, failing, but still trying again.\u0026nbsp;\u003c/p\u003e\u003cp\u003eMy deepest desire is to combine curiosity, compassion, and creativity. Whether through medicine, research, mentorship, or storytelling, I strive to use science, art, and intellectual thought to make a meaningful impact and foster newfound life perspectives across all backgrounds.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Tj02X00M3NCkk4iv00ERMIEDFtscwH564eFRBp1q02k01Ls00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"66ed9101-9778-471a-9069-24ff438946a6\"}"},{"__ref":"DeepDives:{\"uuid\":\"b46ed2a6-fc19-457c-92c3-748012fcd3be\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d78f436-e479-4853-b396-7a9ffd16c39b\"}"},{"__ref":"DeepDives:{\"uuid\":\"b8745982-e43c-4738-ac29-8949aa6f89a5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cfe450f7-0f7a-4a37-8265-323afb783a4a/-/preview/-/format/jpg/","https://ucarecdn.com/f603baee-d23a-4a72-9adb-079fa12a5985/-/preview/-/format/jpg/","https://ucarecdn.com/9b79cdb0-a975-490e-8d7c-e0042639857a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a68bef6f-778e-4b67-a369-b94bf3e40edb\"}"},{"__ref":"Education:{\"uuid\":\"0f903b42-c5ed-4513-9de2-8f1310048b4d\"}"}],"hiredAt":"2026-04-30T23:34:53.906Z","topics":["Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","College Essay Writing","Economics","Reading","K-6 Storybook","Creative Writing","Music","Visual Arts / Graphic Design","Medicine / Health","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"christina-cheng\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4efc5270-b6a8-4527-b50f-5827720b15c0\"}"}}},"_sentryTraceData":"0eb2612414db4421931721e031f89498-aae014552bc7c5a9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529
