xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b918de8b-93b8-4bd5-bf02-5d9668c9f501\"}":{"__typename":"DeepDives","uuid":"b918de8b-93b8-4bd5-bf02-5d9668c9f501","content":"\u003cp\u003eEach summer, I went down a different rabbit hole to come up with ideas on solutions to innovate. For example, I wanted to address my extended family's longstanding history of kidney disease, so I researched the field extensively: the disease's biology, treatment pathways, existing solutions, and computational research. Through iterative scientific processes and structured brainstorming, I created projects that would allow me to learn and solve. I submitted these projects to the annual science fairs/championships.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"3337ffcc-ede9-44c8-8a4a-e2676ad80c16\"}":{"__typename":"DeepDives","uuid":"3337ffcc-ede9-44c8-8a4a-e2676ad80c16","content":"\u003cp\u003eBrought up in an Indian immigrant family at the heart of Silicon Valley, I appreciated the importance we placed on a quality education - not just in coursework and tutoring, but in implementing academic lessons outside the class to help the community. I place a lot of emphasis on learning and impact. I value structure and communication with families. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e11fd316-f84e-4fd5-8766-ec0a72d416f0\"}":{"__typename":"DeepDives","uuid":"e11fd316-f84e-4fd5-8766-ec0a72d416f0","content":"\u003cp\u003eI hope to travel everywhere and learn the ways of all cultures around the world. Culture and tradition are important to me, and I'm fascinated by both my own from India as well as others around the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5263fcbc-7d49-4b21-b90c-576f87054244\"}":{"__typename":"DeepDives","uuid":"5263fcbc-7d49-4b21-b90c-576f87054244","content":"\u003cp\u003eI love to sing and learn languages! I've been trained in classical music since I was 3. I'm currently learning 3 languages from random youtube videos. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"7dcdda83-b382-4e45-9769-ab1f28859ebe\"}":{"__typename":"School","uuid":"7dcdda83-b382-4e45-9769-ab1f28859ebe","name":"BASIS Independent Silicon Valley Upper School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95126"},"Education:{\"uuid\":\"5ad7ac7d-e541-4696-84d0-e93a25100aea\"}":{"__typename":"Education","uuid":"5ad7ac7d-e541-4696-84d0-e93a25100aea","school":{"__ref":"School:{\"uuid\":\"7dcdda83-b382-4e45-9769-ab1f28859ebe\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"f9728ce3-f5ad-4a9a-a8bb-729ccfe5096e\"}":{"__typename":"Education","uuid":"f9728ce3-f5ad-4a9a-a8bb-729ccfe5096e","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Systems Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"d3fd47d4-9627-4a49-9a17-cf07e3c74157\"}":{"__typename":"MentorPublicProfile","uuid":"d3fd47d4-9627-4a49-9a17-cf07e3c74157","displayName":"Veda K.","slug":"veda-kamaraju","biography":"\u003cp\u003eHi! I’m Veda, an M.Eng student at Cornell University’s College of Engineering, and I help students channel their curiosities and passions into tangible impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve spent the last 5 years exploring different intersections of biomedical engineering, computer science, and innovation. In high school, I won First Place and many honorable mentions for annual science fair research projects that I created and conducted independently. My explorations taught me to research gaps in fields, find loopholes in existing solutions, become creative in ideation, and build to create impact. In addition, I tutored students from low-income families and understood the needs of our education system.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout my undergrad at Cornell, I carried these experiences to become team lead of a premier biomedical engineering / bioentrepreneurship project team, innovating award-winning computational and biomechanical products. I conducted research in computational biomedicine at Cornell and Harvard, where I learned to translate research into the real-world and communicate scientific findings.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTransforming your STEM interests into a series of projects that form a story of exploration and depth.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIdeating and innovating a project that will create impact.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eImplementing computation (computer science, data science, statistics, etc) to real-world problems.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConducting biological or public health research.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFinding pathways into tech - financial tech, health tech, product, etc.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCommunicating scientifically - blog pages, journalism, publications, presentations, etc.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIntegrating STEM work with community impact.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Priorities:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI know how it feels to be in the dark about what you are interested in, what to do with your interests, or having too many of them.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI want to help you form your story! I believe in connecting pieces of the puzzle together to form a larger picture. If we do a STEM project together, I want to help you figure out what you can do in the community that will resonate with you just as much. Or if we do a blog together, I can help you brainstorm unique angles that will attract desired audiences.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI believe in personalization, scalability, and impact. Programming an arduino to print hello world can be done quick, and curing cancer may not be a realistic objective. I hope to find a balance with channeling the student’s interests while scaling the project to create impact beyond our original scope.\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eLet’s have fun!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m a huge music fan - any genre and any Indian art form. I love speaking about music, TV shows, and films. I love organized meeting notes and structured deliverables, so expect established paperwork from me!\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m here to help turn your abstract interests into concrete pathways. If you’re curious, ready for exploration, and excited to build, I’d love to help you make it happen.\u003c/p\u003e","teachingVideoPlaybackId":"9zq9UpEFJW9czMP008lQJJvP8KVc9iGYBFKOKuSuJi1o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Systems Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b918de8b-93b8-4bd5-bf02-5d9668c9f501\"}"},{"__ref":"DeepDives:{\"uuid\":\"3337ffcc-ede9-44c8-8a4a-e2676ad80c16\"}"},{"__ref":"DeepDives:{\"uuid\":\"e11fd316-f84e-4fd5-8766-ec0a72d416f0\"}"},{"__ref":"DeepDives:{\"uuid\":\"5263fcbc-7d49-4b21-b90c-576f87054244\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/02dc0f38-c8cf-42df-88cc-791286d54a15/-/preview/-/format/jpg/","https://ucarecdn.com/3cf4b2a7-ffa0-4289-a8e1-90e88392da05/-/preview/-/format/jpg/","https://ucarecdn.com/3cd11439-7b6a-4d80-9d34-960da2355c5d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5ad7ac7d-e541-4696-84d0-e93a25100aea\"}"},{"__ref":"Education:{\"uuid\":\"f9728ce3-f5ad-4a9a-a8bb-729ccfe5096e\"}"}],"hiredAt":"2026-02-11T19:08:27.704Z","topics":["Creative Writing","Business / Entrepreneurship","Coding / Programming","Machine Learning / AI","Medicine / Health","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"veda-kamaraju\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d3fd47d4-9627-4a49-9a17-cf07e3c74157\"}"}}},"_sentryTraceData":"1453da5d56ac4a9d95953cd3ad708a23-b3a9e93ecfffe18e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1453da5d56ac4a9d95953cd3ad708a23,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"veda-kamaraju"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
