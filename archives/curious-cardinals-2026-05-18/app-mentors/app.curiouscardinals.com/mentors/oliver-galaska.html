xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c6c4dc41-4170-42b3-a9b9-e5e9790a97c2\"}":{"__typename":"Favorites","uuid":"c6c4dc41-4170-42b3-a9b9-e5e9790a97c2","photoUrl":"https://ucarecdn.com/e8184a69-8bbf-447a-a975-8b150c8aa592/","title":"Age of Empires IV","type":"GAME"},"Favorites:{\"uuid\":\"037a9bad-9134-4e1f-a5f2-70a308c66aa1\"}":{"__typename":"Favorites","uuid":"037a9bad-9134-4e1f-a5f2-70a308c66aa1","photoUrl":"https://ucarecdn.com/d7962f3d-791d-4329-b10d-189a63b530da/","title":"Dune","type":"BOOK"},"Favorites:{\"uuid\":\"bd017ae1-f221-47b9-aa0c-dbbcd8f534d1\"}":{"__typename":"Favorites","uuid":"bd017ae1-f221-47b9-aa0c-dbbcd8f534d1","photoUrl":"https://ucarecdn.com/566154ef-f80a-4873-bc6e-648db6963d4c/","title":"Lord of the Rings - The Two Towers","type":"MOVIE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"33826ee2-c172-44bf-b52b-842624ca7a8a\"}":{"__typename":"DeepDives","uuid":"33826ee2-c172-44bf-b52b-842624ca7a8a","content":"\u003cp\u003eEP\u0026amp;E has given me the ability to integrate empirical analysis, analytical reasoning, and normative reflection. I have taken these skills to not just think about modern public policy, institutions, and human behavior, but also medieval systems. I reveal in the opportunity combine philosophical argument, historical thought, political thinking, and economic logic. However, the most important attribute that I developed at college was a genuine love of learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"30dadc73-fe43-4084-86b5-e64292236a18\"}":{"__typename":"DeepDives","uuid":"30dadc73-fe43-4084-86b5-e64292236a18","content":"\u003cp\u003eDuring high school, I joined a newly established robotics club at my public school. While there was strong enthusiasm, few of us had meaningful technical experience. Early competitions exposed a stark contrast between our team and those from private schools, which often had larger budgets and mentors with formal engineering training. The disparity was not limited to resources but extended to technical guidance and institutional knowledge.\u003c/p\u003e\u003cp\u003eTo help address this gap, I started and ran a robotics summer camp for elementary school students with the support of the local county government. I organized the program, structured the activities, and led the instruction. The camp introduced younger students to robotics and foundational engineering concepts, with the aim of building familiarity and experience within our community over time.\u003c/p\u003e\u003cp\u003eIn addition to this work, I attended debate camp and was admitted to Governor’s School, where I spent part of my summers engaged in intensive academic programs.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"53909175-4c5d-460c-b0da-a9d704d241d1\"}":{"__typename":"School","uuid":"53909175-4c5d-460c-b0da-a9d704d241d1","name":"Brentwood High School","city":"Brentwood","type":"HIGH","state":"Tennessee","country":"United States","zip":"37027"},"Education:{\"uuid\":\"3ae3790f-0d6d-4a60-a722-a80d8a7682d4\"}":{"__typename":"Education","uuid":"3ae3790f-0d6d-4a60-a722-a80d8a7682d4","school":{"__ref":"School:{\"uuid\":\"53909175-4c5d-460c-b0da-a9d704d241d1\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"e44cda5e-87b0-4372-b017-2ba12ea049de\"}":{"__typename":"Education","uuid":"e44cda5e-87b0-4372-b017-2ba12ea049de","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"Ethics, Politics, and Economics | Certificate in Medieval Studies ","degree":null},"MentorPublicProfile:{\"uuid\":\"fc814df4-64fd-4ee5-867d-168b738645b1\"}":{"__typename":"MentorPublicProfile","uuid":"fc814df4-64fd-4ee5-867d-168b738645b1","displayName":"Oliver G.","slug":"oliver-galaska","biography":"\u003cp\u003eI graduated cum laude from Yale University with a degree in Ethics, Politics, and Economics (EP\u0026amp;E) and a certificate in Medieval Studies. When I entered college, I did not have a fixed sense of what I wanted to pursue. Instead, I approached my education with curiosity, exploring widely and embracing opportunities across disciplines. This openness led me to engage with a broad range of subjects and intellectual traditions. During my time at Yale, I developed a deep interest in the medieval world, a lasting engagement with ethical inquiry, and, most importantly, a genuine love of learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my time at Yale, I pursued a range of academic and research experiences that reflected my interdisciplinary foundation and my diverse passions. I participated in archaeological fieldwork in Mongolia, conducted economics researcher with the World Health Organization, spent time in Ireland for working for startup company contracted by the Irish Government.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor fun, I deliberately sought actives that I had no experience in. I joined the Yale Men’s Polo Team despite never interacting with a horse. What began as curiosity became a serious commitment, and through sustained effort and teamwork I ultimately became team captain. I read poetry in Middle English and can recite from memory the first eighteen lines of The Canterbury Tales. While in Mongolia, learned wrestling and competed in a local Naadam festival. Practice American Sign Language with my fiancée. I enjoy complex board games with friends, including Dune (1979) and John Company. I paint Warhammer miniatures in my free time. While in Ireland, I learned to play the Uilleann pipes. I also volunteer at my local church, teaching CCD among other activities. Both of my parents are immigrants. My father was born and raised in Warsaw, Poland. My mother was born in Luanda, Angola. Both came to the United States due to political and economic pressures. Their experiences have profoundly shaped my perspective, and I remain deeply grateful for the opportunities I have been afforded because of their journeys.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore Yale, I cultivated similarly broad interests in high school. I served as Captain of my school's debate club and became a national qualifier in Public Forum Debate. I competed in Science Olympiad, earning third place at the state level for my electric vehicle. Finally, I was help grow and strengthen my school’s robotics club.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy relationship with education, however, was not always straightforward. Growing up, I had a speech impediment that significantly shaped my early experience of school. Classroom participation, reading aloud, and even routine academic interactions often felt intimidating and, at times, uncomfortable. These experiences gave me a lasting appreciation for the connection between confidence and learning. My public high school was highly competitive, which further intensified the pressures students often face.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn tutoring, I hope to foster the sense of intellectual safety and encouragement that I did not always feel myself, and to help students develop not only skills and understanding, but also genuine confidence and enjoyment in the learning process.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am currently applying to law school with the long-term goal of becoming a federal judge.\u003c/p\u003e","teachingVideoPlaybackId":"qk02f4W6f7rDy3BGN1WAqzJkJ2hatSsH5E0202etO2qO9o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c6c4dc41-4170-42b3-a9b9-e5e9790a97c2\"}"},{"__ref":"Favorites:{\"uuid\":\"037a9bad-9134-4e1f-a5f2-70a308c66aa1\"}"},{"__ref":"Favorites:{\"uuid\":\"bd017ae1-f221-47b9-aa0c-dbbcd8f534d1\"}"}],"causesSupported":[],"major":"Ethics, Politics, and Economics | Certificate in Medieval Studies ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"33826ee2-c172-44bf-b52b-842624ca7a8a\"}"},{"__ref":"DeepDives:{\"uuid\":\"30dadc73-fe43-4084-86b5-e64292236a18\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4b1d72a6-2318-43ba-b07e-2aabf14d2940/-/preview/-/format/jpg/","https://ucarecdn.com/d7c5ce2e-a9e5-46f0-b0e2-004946bc5583/-/preview/-/format/jpg/","https://ucarecdn.com/aeec87f6-c58d-49dc-b5a8-95050ac59ae9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3ae3790f-0d6d-4a60-a722-a80d8a7682d4\"}"},{"__ref":"Education:{\"uuid\":\"e44cda5e-87b0-4372-b017-2ba12ea049de\"}"}],"hiredAt":"2026-02-11T23:49:02.993Z","topics":["Pre-Algebra","Algebra I","Algebra II","Calculus","Precalculus / Trigonometry","Chemistry","6-8 Grade Science","Writing","American Sign Language","College Essay Writing","Executive Function","Academic Coaching","History","Economics","History Project","Finance / Investing","Law / Government / Policy","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/9f7019f6-5b03-4f9f-a136-5aeaf2c62de6/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"oliver-galaska\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fc814df4-64fd-4ee5-867d-168b738645b1\"}"}}},"_sentryTraceData":"9a19b52f7036401ebf858fd6ed085a8d-b570518a57b8b3b8-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9a19b52f7036401ebf858fd6ed085a8d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"oliver-galaska"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
