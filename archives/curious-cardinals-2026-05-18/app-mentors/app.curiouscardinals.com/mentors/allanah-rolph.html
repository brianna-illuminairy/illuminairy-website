xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3032e7f5-e2b5-4391-b11e-87a42bdcfc8b\"}":{"__typename":"Favorites","uuid":"3032e7f5-e2b5-4391-b11e-87a42bdcfc8b","photoUrl":"https://ucarecdn.com/04ec3a96-8dcf-4b90-abf3-be8a117e9bb3/","title":"BTS","type":"ARTIST"},"Favorites:{\"uuid\":\"40ca8d52-769a-4434-aa52-6ea7fd7ca8e2\"}":{"__typename":"Favorites","uuid":"40ca8d52-769a-4434-aa52-6ea7fd7ca8e2","photoUrl":"https://ucarecdn.com/04ec3a96-8dcf-4b90-abf3-be8a117e9bb3/","title":"basketball!","type":"SPORT"},"Favorites:{\"uuid\":\"989b33f6-e000-4863-9451-43bf5339f924\"}":{"__typename":"Favorites","uuid":"989b33f6-e000-4863-9451-43bf5339f924","photoUrl":"https://ucarecdn.com/04ec3a96-8dcf-4b90-abf3-be8a117e9bb3/","title":"anything by Toni Morrison","type":"BOOK"},"CausesSupported:{\"uuid\":\"33ddf225-3f9b-492a-b948-b03ad58afb9d\"}":{"__typename":"CausesSupported","uuid":"33ddf225-3f9b-492a-b948-b03ad58afb9d","name":"Free Minds Book Club","description":"\u003cp\u003e\u003c/p\u003e","photoUrl":"https://ucarecdn.com/6625f28e-492f-40ce-b4c7-62d21d1ea88d/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"78c481e3-cddf-4d47-a6b5-732fde9ac127\"}":{"__typename":"DeepDives","uuid":"78c481e3-cddf-4d47-a6b5-732fde9ac127","content":"\u003cp\u003eI'd tell my younger self that the seemingly \"silly\" things I'm interested in are actually not silly at all! In reality, I'm going to grow up to study them seriously at multiple universities and eventually make a career out of them. When I was growing up, I was so focused on earning good grades and 'doing well' that I spent little time doing thing that actually sparked my curiosity and joy. Now, 10 years later, I have realized that it's okay - amazing, actually - to spend time developing hobbies and projects that fill me with passion.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"4e503ba4-6d60-46e7-a402-a0932025d85f\"}":{"__typename":"DeepDives","uuid":"4e503ba4-6d60-46e7-a402-a0932025d85f","content":"\u003cp\u003eIn high school, I still lived in the rural community I grew up in. I spent my summers working as a nanny for families in my area. When I wasn't working, summer was the time that I got to read the most! I would set up my hammock when summer break started and sat in the sun reading in the evenings and weekends. I also used this time to spend with my younger siblings, who were in elementary school at the time. We would play games and go on adventures because I knew it wouldn't be long before I moved out for college! When my friends and I were off work at the same time, we'd go to the lake to soak up the sun or go on road trips to go camping.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1eafc17a-a54a-4e95-9af8-5d5577ebba2e\"}":{"__typename":"DeepDives","uuid":"1eafc17a-a54a-4e95-9af8-5d5577ebba2e","content":"\u003cp\u003eOriginally, I was going to study English because of how much I love to read. However, over the lockdown of 2020 and 2021 I realized that I'd been ignoring the part of me that loved to create. When I was a child, all of my spare time was divided between three things: playing outside with my brothers, reading everything I could get my hands on, and making things. I loved making - it didn't matter what. I would draw, build, craft, design, sew, ideate, draft, construct, decorate... the list goes one! Once I got older, I felt that I needed to focus on school in order to secure a good future, so I stopped allowing myself to spend my free time so creatively. By the time I got into college, I'd almost forgotten that part of myself. However, over the most isolating part of the pandemic, I returned to who I was. I learned how to crochet, took up photography again, started writing more. I realized that I would be happiest in life if I allowed myself to pursue a creative future. Now, a few years later, I couldn't be happier. I am constantly learning new things and applying my creativity to new situations. On top of designing my own clothes and learning how to quilt, I am currently developing my own artist website and learning to cut my hair. Not a day goes by that I am not creating in one way or another! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"cb7f6395-db74-4e55-93d5-4dee80c2445b\"}":{"__typename":"DeepDives","uuid":"cb7f6395-db74-4e55-93d5-4dee80c2445b","content":"\u003cp\u003eMentorship is so important to me because I know that if I would have had a mentor in middle or high school to ask me what I wanted to do, it would have changed everything. I felt so boxed in by my educational experience. Even though I was successful on paper, I wasn't being challenged and my curiosity sat dormant. Reading was my only imaginative space. Now, looking back, I want to be the person I needed: a mentor who can help students look inside themselves and discover where their passions lie. I think exploring is one of the most important things a person can do - I want to facilitate that! \u003cbr\u003eI have 4 younger siblings. The oldest is in college now and the youngest is in 3rd grade. Being a mentor to them has been one of the most meaningful aspects of my life, and I want to provide that to my mentees, too.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"ca25a4e4-cd3d-482d-b92f-df629fbad4a5\"}":{"__typename":"School","uuid":"ca25a4e4-cd3d-482d-b92f-df629fbad4a5","name":"Harding County High School","city":"Buffalo","type":"HIGH","state":"SD","country":"United States","zip":"57720"},"Education:{\"uuid\":\"eb70d45d-e765-4e56-bad7-42a9cd62d550\"}":{"__typename":"Education","uuid":"eb70d45d-e765-4e56-bad7-42a9cd62d550","school":{"__ref":"School:{\"uuid\":\"ca25a4e4-cd3d-482d-b92f-df629fbad4a5\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"b2bf58b2-7f44-43c9-9012-74b6f4d7ad80\"}":{"__typename":"Education","uuid":"b2bf58b2-7f44-43c9-9012-74b6f4d7ad80","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Art, Film, and Visual Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"50fd7aab-676c-4b18-a47c-dfc8f832572f\"}":{"__typename":"MentorPublicProfile","uuid":"50fd7aab-676c-4b18-a47c-dfc8f832572f","displayName":"Allanah R.","slug":"allanah-rolph","biography":"\u003cp\u003eHello! I'm so happy to meet you. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eAfter graduating from Harvard in 2024, I spent a year working at Fayerweather Street School in Cambridge, MA. I loved my time there in the Extended Day program where I got to share my love of creativity with students and support them on their learning journeys. It was really special to be there for them in the in-between after school and before going home. \u003cbr\u003e\u003cbr\u003eI am a very creative person. Since I was a child, I've always loved making things of all kinds. From little crafts to pastel drawings to heavy duty construction, I have always been a maker. Now, I am a textile artist, photographer, writer, and designer. I mainly focus on fiber arts in the studio (like crochet and sewing multimedia pieces). I have done a few film projects and am learning web design as we speak. Making my own artist website has been a highlight of the semester! I love the challenge of trying a medium so different from what I'm used to. HTML and CSS have been a really interesting learning curve. \u003cbr\u003e\u003cbr\u003eWhen I'm not working on projects, I love to read and spend time outdoors. I love hiking beautiful places and going kayaking. Recently, I kayaked the only other everglades in the world outside of Florida! I also love watching movies and tv while I work on crochet projects. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have spent a lot of time working at different libraries, and while I was abroad I worked at a paint and sip studio in Brisbane!\u003cbr\u003eA fun fact about me is that I have 5 siblings! I also grew up in a tiny town of about 300 people.\u003cbr\u003e\u003cbr\u003eI decided to become a mentor because I would have loved to have the chance to explore these less traditional subjects as a younger student. I loved English and Art classes, but it wasn't until college that I really learned how passionate I am about interdisciplinary work and how expansive 'creative fields' really is. I would love to be a part of your journey to explore whatever it is that sparks curiosity - whether that's coding a website, 3D printing an art piece, learning how to knit/crochet and make your own patterns, or anything in between. I also love doing writing mentoring, so if you're interested in developing creative writing skills or want to make a short story, we could be a great fit.\u003cbr\u003e\u003cbr\u003eI believe that everyone is creative, but they just might not realize it. So many people who love science or math think that they don't have a creative mind, but how would scientists make new discoveries if they weren't creative? Is building Legos and coding games not just as creative as painting and making music? If creativity is something that you feel isn't 'for you', I urge you to reconsider this idea. By exploring your own style of creativity, you just might find out something new about yourself!\u003cbr\u003e\u003cbr\u003eAs my mentee, I will support you in exploring the topics you're interested in and push you to think about things from a new perspective. I think the most important thing to learn at this age is how to form your own ideas and opinions and then learning how to share them with the world - this can apply to anything that's important to you! My sessions are catered to the learning style and requests of each mentee. If you're more of a hands-on learner, we'll do some exercises together and think about ways you can explore your ideas until our next meeting. If you're seeking mentorship more for guidance on your learning journey, we can check in about where you are in terms of your goals and think about ways to adapt to keep you on track. If you prefer to explore ideas on your own, our sessions can be used for you to share your discoveries with me and get feedback on where you could go next. These are just a few examples, but the combinations and possibilities are endless.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3032e7f5-e2b5-4391-b11e-87a42bdcfc8b\"}"},{"__ref":"Favorites:{\"uuid\":\"40ca8d52-769a-4434-aa52-6ea7fd7ca8e2\"}"},{"__ref":"Favorites:{\"uuid\":\"989b33f6-e000-4863-9451-43bf5339f924\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"33ddf225-3f9b-492a-b948-b03ad58afb9d\"}"}],"major":"Art, Film, and Visual Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"78c481e3-cddf-4d47-a6b5-732fde9ac127\"}"},{"__ref":"DeepDives:{\"uuid\":\"4e503ba4-6d60-46e7-a402-a0932025d85f\"}"},{"__ref":"DeepDives:{\"uuid\":\"1eafc17a-a54a-4e95-9af8-5d5577ebba2e\"}"},{"__ref":"DeepDives:{\"uuid\":\"cb7f6395-db74-4e55-93d5-4dee80c2445b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/44332afc-d42e-45a8-ae37-bb5e3bb79ccf/-/preview/-/format/jpg/","https://ucarecdn.com/bc3453e0-726c-4285-9fc5-7ff95882743d/-/preview/-/format/jpg/","https://ucarecdn.com/a4e3715e-908a-47ca-b6ff-bba39955ee11/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"NON_BINARY","education":[{"__ref":"Education:{\"uuid\":\"eb70d45d-e765-4e56-bad7-42a9cd62d550\"}"},{"__ref":"Education:{\"uuid\":\"b2bf58b2-7f44-43c9-9012-74b6f4d7ad80\"}"}],"hiredAt":"2023-09-13T22:43:57.969Z","topics":["K-6 Storybook","Visual Arts / Graphic Design","Video / Photography","Web Design","Sustainability","Journalism"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"allanah-rolph\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"50fd7aab-676c-4b18-a47c-dfc8f832572f\"}"}}},"_sentryTraceData":"dd86f052c87f46e88ea9d8605650a8fa-a2071d17727943a4-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=dd86f052c87f46e88ea9d8605650a8fa,sentry-sample_r
