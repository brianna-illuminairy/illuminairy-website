xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6de28a46-3d9e-4b10-a3d4-80db0eae69f3\"}":{"__typename":"DeepDives","uuid":"6de28a46-3d9e-4b10-a3d4-80db0eae69f3","content":"\u003cp\u003eOne piece of advice I would give my middle or high school self would be to not be afraid to ask for help. In middle and high school, I was the kind of student and person who would put my head down and grind issues out until they got better. I felt that even at times when I was stressed or overworked, asking for help was a sign of weakness, an admission of defeat, and a way of pushing issues onto others rather than dealing with them myself. However, in adapting to college, I have learned that this conception of help could not be further from the truth. There is too much out there to know everything. It is not your job to know or be good at everything. Asking for help is a skill, a way to augment your ability to solve problems using the knowledge and experiences of others. Knowing how and when to ask for help is a vital part of success, no matter what you do. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"04a75e92-9990-4cc2-8eee-6ad69f6f1c04\"}":{"__typename":"DeepDives","uuid":"04a75e92-9990-4cc2-8eee-6ad69f6f1c04","content":"\u003cp\u003eI chose my majors through exploration! After I left high school, I had an interest in school and in learning, but had not yet been able to narrow that interest down into any particular fields. I loved writing, I found politics and government interesting, I always did well in Math and enjoyed problem solving, and even found a Computer Science course I took interesting. So, when I got to college, I spent my first semester exploring all these interests across a bunch of classes in different departments to find what it was that I was really passionate about. This time showed me two things. First, I absolutely love problem solving, but don't actually love Math. What I did love, though, were the logic puzzles and problem solving we did in Computer Science and programming! Also, I realized that I am not STEM or humanities, but both! I could not see myself only doing STEM, nor only humanities. Rather, I needed a balance. I needed to exercise both sides of my brain - the problem solving/numbers side and the writing/creative/analytical side. So, I landed on Computer Science and Political Science as my majors!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c84ddc0a-94f3-4107-911d-647c717b55a1\"}":{"__typename":"DeepDives","uuid":"c84ddc0a-94f3-4107-911d-647c717b55a1","content":"\u003cp\u003eMentorship stands out to me because I find it is the most direct and impactful way to help others. Both of my parents are teachers, and teaching/tutoring really runs through my blood. I have always had a knack for helping my little siblings with their homework, coaching them in sports, or helping them resolve issues they run into. I see mentoring as a way to continue this kind of work. It's not just helping with homework, but offering holistic advice based on personal connections and experiences. I have worked as a tutor and a TA, but have always felt a gap in the teaching process because of the lack of personal touch and connection between teacher and student. Mentorship bridges this gap. I am so excited to continue to use my experiences to help others, satisfying the little teacher in my heart, while also providing advice and assistance that will not just last until the next test is done, but a lifetime.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"29a0491a-b1fd-4dbe-b3fb-4a59f09361a7\"}":{"__typename":"DeepDives","uuid":"29a0491a-b1fd-4dbe-b3fb-4a59f09361a7","content":"\u003cp\u003eIn high school, my summers were spent with my family up in the Adirondack mountains of Upstate New York! My mom and dad both grew up in the region, and my mom's childhood house is still in the family. It sits right on a river and a lake, and amid a great mountain range full of beautiful hikes. So, we would spend as much time up there as possible - using our time to water ski, hike, camp, tube, and just enjoy the beautiful nature and wildlife! Moreover, my family and I are extremely close. I always shared a room with my siblings at our house growing up, so sharing a space up in the Adirondacks was not an issue at all! We did not just love doing all these great outdoorsy activities, but we loved doing them together. Now that my older brother and I are off in college, I look back on this time so grateful that I was able to have that access to nature and spend so much beautiful quality time with my family.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5\"}":{"__typename":"School","uuid":"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5","name":"Brunswick School","city":"Greenwich","type":"HIGH","state":"Connecticut","country":"United States","zip":"06830"},"Education:{\"uuid\":\"e59b1224-5db9-4389-9d69-40f269a51e3b\"}":{"__typename":"Education","uuid":"e59b1224-5db9-4389-9d69-40f269a51e3b","school":{"__ref":"School:{\"uuid\":\"b9f2b2f9-6a93-4f61-814a-b80d4a4162a5\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"5bbacfce-d028-4d65-adf9-c3308244678b\"}":{"__typename":"Education","uuid":"5bbacfce-d028-4d65-adf9-c3308244678b","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science, Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"6de1300b-0880-4085-a583-4cd6a82165bd\"}":{"__typename":"MentorPublicProfile","uuid":"6de1300b-0880-4085-a583-4cd6a82165bd","displayName":"Jackson S.","slug":"jackson-schwartz","biography":"\u003cp\u003eHey there! My name is Jackson, and I am a rising Senior at Brown University studying Computer Science and Political Science. At Brown, I have worked as a TA in the Computer Science Department, I am a tour guide at Brown, and I am the captain of one of our ultimate frisbee teams! I am from Connecticut, but also have spent lots of time in the Adirondack Mountains of Upstate New York, a special place that has facilitated a lifelong love for nature, hiking, water sports, and the outdoors. I am also a huge sports fan, a lego enthusiast, and have an insatiable thirst for finding and discovering new music. Nothing inspires me like a good song, so please reach out to me if you have any new artists I need to check out (I like all kinds of music, but have always had the softest heart for Rock)! Here at Curious Cardinals, I am looking to achieve three main goals. First, I always love meeting new people, sharing my passions with them, and hearing about their passions! So, I truly look forward to meeting curious, fun, and interesting students from across the country in a setting where those passions are the primary focus! Second, I am a lifelong learner, and have a real passion for always learning new things. As a result, I think the most important skill one can develop is to learn how to learn. I hope to help other students achieve this through sharing my knowledge, learning plans, and experiences that I have developed through my life as a student. Third, education runs through my blood. Both of my parents and many of my grandparents and extended family are teachers. I have always loved teaching and mentoring, and look forward to using this platform to continue to do what I love and to continually grow and improve! I truly believe that nothing is impossible as long as you are willing to put in the work to achieve your goals. I am the furthest thing from a \"natural\". My proudest moments, biggest achievements, and greatest skills have all been developed through failure, humility, hard work, dedication, and grit. If you are someone who has a goal that you would like to achieve, I invite you to take that journey on with me. While I will definitely help you get the information, resources, and specific skills you need to achieve that goal, I will also focus on helping you find the motivation, drive, and passion to go after it. \u003c/p\u003e","teachingVideoPlaybackId":"T8uphoJ02j8n4uwZEV01kjC9daqngskiO7dZ14QYfvyUA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science, Political Science","deepDives":[{"__ref":
