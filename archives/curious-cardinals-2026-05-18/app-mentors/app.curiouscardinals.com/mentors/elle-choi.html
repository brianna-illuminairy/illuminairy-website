xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f322a7bc-6311-489b-be7a-185e3d1a6642\"}":{"__typename":"Favorites","uuid":"f322a7bc-6311-489b-be7a-185e3d1a6642","photoUrl":"https://ucarecdn.com/fbd5fcc4-4630-464d-9413-861f87a4a9fb/","title":"Tokyo, Japan","type":"CITY"},"Favorites:{\"uuid\":\"a48ebb4b-b5e9-413d-a444-11682e731736\"}":{"__typename":"Favorites","uuid":"a48ebb4b-b5e9-413d-a444-11682e731736","photoUrl":"https://ucarecdn.com/87fc31f9-5594-4945-b732-8825b98e52c1/","title":"About Time ","type":"MOVIE"},"Favorites:{\"uuid\":\"714c2630-2412-4c6c-bb79-86fd9b89dd76\"}":{"__typename":"Favorites","uuid":"714c2630-2412-4c6c-bb79-86fd9b89dd76","photoUrl":"https://ucarecdn.com/42e5b818-c3ce-4f64-820d-67c5a537b925/","title":"Baseball","type":"SPORT"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"92d3d93d-930e-42e8-b4c6-0311f96a341e\"}":{"__typename":"DeepDives","uuid":"92d3d93d-930e-42e8-b4c6-0311f96a341e","content":"\u003cp\u003eI chose my majors because I’ve always been energized by technology and its potential to solve real problems. I also wanted to pair that technical foundation with an understanding of people, organizations, and decision-making. Studying both Computer Science and Human \u0026amp; Organizational Development allowed me to bridge those two worlds—giving me the skills to design and build solutions while also empathizing with users and addressing their pain points. For me, the most meaningful work comes from creating technology that not only works well but truly improves people’s experiences.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9fe2dfed-f579-4351-8a48-2fdbb760020f\"}":{"__typename":"DeepDives","uuid":"9fe2dfed-f579-4351-8a48-2fdbb760020f","content":"\u003chr\u003e\u003cp\u003eIf I could give advice to my middle or high school self, I would encourage myself to explore as many classes and activities as possible and not be afraid to follow my curiosity. I would also remind myself to take initiative— whether that means starting something new that excites me or stepping into leadership opportunities. The habits of pursuing my passions and learning to lead that I built during those years have stayed with me and continue to shape how I approach challenges and opportunities today. So if I could go back, I’d tell myself to start early— to try things sooner, take risks earlier, and give myself more time to grow from those experiences.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"46f0589b-8ff6-4406-9d84-dfdc881cf8cb\"}":{"__typename":"DeepDives","uuid":"46f0589b-8ff6-4406-9d84-dfdc881cf8cb","content":"\u003cp\u003eMentorship matters to me because I know how valuable it is to have someone to look up to and to learn from. I myself leaned on the guidance of mentors who not only gave me advice, but also helped me see possibilities I hadn’t considered for myself. Their encouragement and perspective made a huge difference in shaping my choices— like switching majors, finding internships, and ultimately pursuing a career path that excites me. Looking back, I realize I wouldn’t be where I am today without the support of those people who believed in me and pushed me to grow. Now I want to give back by being that person for another student, and hope that my mentee can feel supported and empowered to explore their interests and reach their potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"7855fca1-a345-4dee-8eb1-71930e4b81df\"}":{"__typename":"DeepDives","uuid":"7855fca1-a345-4dee-8eb1-71930e4b81df","content":"\u003cp\u003eOne of the accomplishments I am most proud of is co-founding \u003cstrong\u003eProduct Space\u003c/strong\u003e, a student organization I started with friends in college for students aspiring to become product managers. We began as a small group of about ten people, driven by a shared goal: to create a supportive space where students could learn, grow, and prepare for careers in product management. Over time, through dedication and collaboration, we grew Product Space into an organization of over 600 students, providing mentorship, resume reviews, interview prep, and peer support.\u003c/p\u003e\u003cp\u003eWhat made this experience especially rewarding was seeing the tangible impact on our members’ lives. There were countless moments when students we had mentored landed their dream roles, or when members expressed how Product Space had become a safe and welcoming space to seek guidance, ask questions, and support each other. Being part of a community where peers uplift one another, share resources, and celebrate each other’s wins has been deeply fulfilling.\u003c/p\u003e\u003cp\u003eBeyond the numbers and growth, I am proud of the culture we cultivated—a culture of mentorship, collaboration, and empowerment. Product Space taught me the value of building community, leading with empathy, and creating systems that help others succeed. Seeing our vision take root and knowing that we helped shape the journeys of so many aspiring product managers is an accomplishment I will always treasure.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"e7aa81c7-7cc3-4096-b35b-cffe859e8936\"}":{"__typename":"School","uuid":"e7aa81c7-7cc3-4096-b35b-cffe859e8936","name":"Miss Porter's School","city":"Farmington","type":"HIGH","state":"Connecticut","country":"United States","zip":"06032"},"Education:{\"uuid\":\"65146a72-85df-4d47-899c-bd99500df3bf\"}":{"__typename":"Education","uuid":"65146a72-85df-4d47-899c-bd99500df3bf","school":{"__ref":"School:{\"uuid\":\"e7aa81c7-7cc3-4096-b35b-cffe859e8936\"}"},"startYear":"2017","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"748f2303-a61a-4b29-bbff-994cf174a404\"}":{"__typename":"Education","uuid":"748f2303-a61a-4b29-bbff-994cf174a404","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science, Human and Organizational Development","degree":null},"MentorPublicProfile:{\"uuid\":\"599175a5-0d46-40a8-a37d-29e6c2fdc001\"}":{"__typename":"MentorPublicProfile","uuid":"599175a5-0d46-40a8-a37d-29e6c2fdc001","displayName":"Elle C.","slug":"elle-choi","biography":"\u003cp\u003eHi, I'm Elle! I graduated from Vanderbilt University in 2024, where I had the unique opportunity to study both Computer Science and Human \u0026amp; Organizational Development. This combination allowed me to explore the intersection of technology, problem-solving, and human behavior—something that has greatly influenced how I approach my work and mentorship today. After graduation, I began working as a technology consultant, where I enjoy applying analytical skills to solve complex problems, collaborate with diverse teams, and create solutions that make a real impact. In my consulting role, I have had the chance to work on a variety of projects that span both technical development and process improvement, which has strengthened not only my problem-solving skills but also my ability to communicate effectively with clients and teammates from diverse backgrounds.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I am deeply passionate about helping students succeed academically while also discovering their passions and envisioning their future paths. For me, education is not just about grades; it’s about learning to think critically, manage time effectively, and uncover what truly excites you. Whether it’s building strong study habits, improving time management, tutoring in subjects like math, computer science, or English, or guiding students through tech and business-related passion projects, I find great joy in helping students grow and gain confidence in their abilities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship has been a transformative part of my own journey. From navigating the process of switching majors to ultimately finding a career that I love, the guidance I received from mentors shaped not only my academic path but also my personal growth. I want to offer that same level of support to my students. One of my favorite moments as a mentor is seeing a student’s confidence grow— watching that shift from hesitation to excitement when they realize they can solve a problem or clearly express their ideas. I especially enjoy helping students explore potential college majors, consider future career options, and articulate their experiences and goals through college essays. For me, mentorship is a collaborative process—we work together step by step, exploring interests, addressing challenges, and celebrating achievements along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work and academics, I have a variety of hobbies that keep me energized and inspired. I am a devoted fan of the Korean Baseball League and even wake up at 5am every day to cheer for my team during the season. I also love reading, baking, and visiting art museums.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Curious Cardinals, I strive to create a mentoring environment where students feel both supported and challenged—a space where they can take risks, explore new ideas, and build confidence in themselves.\u003c/p\u003e","teachingVideoPlaybackId":"BuK2p101Ig3wJEXPVpeAP5CvWCQwgAlT7ZHGyO3MW8NI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f322a7bc-6311-489b-be7a-185e3d1a6642\"}"},{"__ref":"Favorites:{\"uuid\":\"a48ebb4b-b5e9-413d-a444-11682e731736\"}"},{"__ref":"Favorites:{\"uuid\":\"714c2630-2412-4c6c-bb79-86fd9b89dd76\"}"}],"causesSupported":[],"major":"Computer Science, Human and Organizational Development","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"92d3d93d-930e-42e8-b4c6-0311f96a341e\"}"},{"__ref":"DeepDives:{\"uuid\":\"9fe2dfed-f579-4351-8a48-2fdbb760020f\"}"},{"__ref":"DeepDives:{\"uuid\":\"46f0589b-8ff6-4406-9d84-dfdc881cf8cb\"}"},{"__ref":"DeepDives:{\"uuid\":\"7855fca1-a345-4dee-8eb1-71930e4b81df\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/384d530f-584f-40b0-994f-3922f155f87c/-/preview/-/format/jpg/","https://ucarecdn.com/97b039bc-5f26-414a-9989-7cf47168cfe7/-/preview/-/format/jpg/","https://ucarecdn.com/8d015e04-81c6-4ce2-96f5-eac32ec37043/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"65146a72-85df-4d47-899c-bd99500df3bf\"}"},{"__ref":"Education:{\"uuid\":\"748f2303-a61a-4b29-bbff-994cf174a404\"}"}],"hiredAt":"2025-09-13T02:33:24.895Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Writing","Academic Coaching","College Essay Writing","Executive Function","Business / Entrepreneurship"],"communityBadges":["https://ucarecdn.com/6fbd7257-e9de-4421-8a0b-bde4a854891b/","https://ucarecdn.com/3fe96660-66b0-4395-b48d-3044e8987993/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elle-choi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"599175a5-0d46-40a8-a37d-29e6c2fdc001\"}"}}},"_sentryTraceData":"4eb29efb011b483f86849331a0d8a6b9-883a052cd2f21d4b-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4eb29efb011b483f86849331a0d8a6b9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"elle-choi"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
