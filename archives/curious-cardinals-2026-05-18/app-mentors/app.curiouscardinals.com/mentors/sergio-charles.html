xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ba488c01-d5fc-49d7-a798-8acb12a7ca2d\"}":{"__typename":"DeepDives","uuid":"ba488c01-d5fc-49d7-a798-8acb12a7ca2d","content":null,"videoPlaybackId":"DEW6YLPAIOo7yCdR28RqYan02rYn41MXcaKnxQ7ec41w","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"42903217-0c18-4e4b-94a9-6fa14b4e3dd6\"}":{"__typename":"DeepDives","uuid":"42903217-0c18-4e4b-94a9-6fa14b4e3dd6","content":null,"videoPlaybackId":"zHe5hoTZ1hYRNUQw2hwpopF3gKplcl01ccjWf02idvJdY","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"19c5bee1-dba9-46b0-8bbc-14c6eb79fe32\"}":{"__typename":"DeepDives","uuid":"19c5bee1-dba9-46b0-8bbc-14c6eb79fe32","content":"\u003cp\u003eKnowing life is short, I want to enjoy it. For me, I love thinking about new and interesting problems. I also acknowledge that not all problems are particularly \"meaningful\". (This is actually my main gripe with the way math is taught in high school.) Fortunately, many problems in computational biology, which I am no expert in, have a geometric flavor which I am quite fond of. Simultaneously, with new technology like GPU clusters and abundant data sources at our disposal, I want to solve interesting and \u003cem\u003emeaningful\u003c/em\u003e problems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"02b3147c-8316-4517-8225-6a4c127e0fe4\"}":{"__typename":"DeepDives","uuid":"02b3147c-8316-4517-8225-6a4c127e0fe4","content":"\u003cp\u003eI would love to help cure diseases using artificial intelligence algorithms. Levinthal's paradox states that mapping a sequence of aminoacids to the geometric structure of its corresponding protein is computationally infeasible, estimating the number of possible configurations to be on the order of 10^100. However, in 2020, a team of researchers at DeepMind were able to solve the 50 year old protein folding problem, thus settling the paradox. Understanding how proteins fold has a plethora of potential applications, from manufacturing new drugs to understanding the function of cells in our body. Nonetheless, a far greater challenge lies ahead: the number of possible chemically-synthesizable drugs is estimated to be 10^60. This is a vast, combinatorial search space and I think the best path towards finding these solutions/cures is applying machine learning. This is one of my life-long goals--to help individuals using my acumen for mathematics and computer science.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"d250ffa5-3da6-402f-97e7-5e5c4f1a12ba\"}":{"__typename":"School","uuid":"d250ffa5-3da6-402f-97e7-5e5c4f1a12ba","name":"Lyford Cay Intl. School","city":"Nassau","type":"HIGH","state":"New Providence","country":"The Bahamas","zip":"0000"},"Education:{\"uuid\":\"ca16a6b8-3535-444d-b1ec-e37fe9a5da54\"}":{"__typename":"Education","uuid":"ca16a6b8-3535-444d-b1ec-e37fe9a5da54","school":{"__ref":"School:{\"uuid\":\"d250ffa5-3da6-402f-97e7-5e5c4f1a12ba\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"24297c5a-807c-496a-98d1-fc3d68eb3695\"}":{"__typename":"Education","uuid":"24297c5a-807c-496a-98d1-fc3d68eb3695","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2025","major":"Mathematics + Computer Science + Statistics","degree":null},"MentorPublicProfile:{\"uuid\":\"5aa9c2cd-81f3-4a9c-af7c-733bbdca8861\"}":{"__typename":"MentorPublicProfile","uuid":"5aa9c2cd-81f3-4a9c-af7c-733bbdca8861","displayName":"Sergio C.","slug":"sergio-charles","biography":"\u003cp\u003eI am interested in applying artificial intelligence to find cures to diseases. I am particularly fascinated by a subfield of machine learning called geometric and topological deep learning. I did my undergrad in mathematics with a minor in computer science. Mathematics is the language through which I see the world. As physicist Eugene Wigner put it, it's \"unreasonably effective\" and can be a remarkably powerful tool to solve seemingly insurmountable problems. Coupled with computer science, mathematics and statistics birthed artificial intelligence, which we can use to tackle some of the toughest challenges facing humanity. I conduct research on applying these incredible algorithms to de novo drug design, so we can hopefully one day eradicate all diseases. In my free time, I love to play squash and basketball with friends. I also picked
