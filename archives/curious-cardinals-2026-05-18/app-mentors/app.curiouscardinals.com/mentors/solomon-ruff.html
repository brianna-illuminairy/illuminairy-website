xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2460160b-15b9-451b-9131-03eac1cffb1d\"}":{"__typename":"Favorites","uuid":"2460160b-15b9-451b-9131-03eac1cffb1d","photoUrl":"https://ucarecdn.com/3b6f4be7-2726-4951-94bd-90dd30ca9f0d/","title":"Spider-Man: Across the Spider-Verse","type":"MOVIE"},"Favorites:{\"uuid\":\"d6d3dc85-9d35-47f7-abbf-6f4af82cbbc1\"}":{"__typename":"Favorites","uuid":"d6d3dc85-9d35-47f7-abbf-6f4af82cbbc1","photoUrl":"https://ucarecdn.com/72c8453d-b758-4615-8932-390b37c43342/","title":"Drake: Take Care","type":"ALBUM"},"Favorites:{\"uuid\":\"3e174e37-6ace-45ab-8fd7-da730c93f433\"}":{"__typename":"Favorites","uuid":"3e174e37-6ace-45ab-8fd7-da730c93f433","photoUrl":"https://ucarecdn.com/3e06cca7-185d-4862-a711-cb1bb0829888/","title":"Will Smith","type":"ACTOR"},"CausesSupported:{\"uuid\":\"b7a00071-74cc-4b0e-a59f-8f21810d99ae\"}":{"__typename":"CausesSupported","uuid":"b7a00071-74cc-4b0e-a59f-8f21810d99ae","name":"The K.I.N.G.S. Organization","description":"\u003cp\u003eThe nonprofit I created in 2023.\u003c/p\u003e\u003cp\u003e(https://www.thekingsorganization.com/)\u003c/p\u003e","photoUrl":"https://ucarecdn.com/d83ce5d3-96de-4fe1-838c-76026846b50e/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2d276642-00b1-4507-9d99-1ca1e08838dc\"}":{"__typename":"DeepDives","uuid":"2d276642-00b1-4507-9d99-1ca1e08838dc","content":"\u003cp\u003eI chose to study Finance at Wharton because it felt like the most natural fit for who I am. I was a history buff in high school and got 5's on all history-related APs and 100's on both the NYS US History and World History regents exams. I've also always been very creative, with a competitive side, and felt like I thrived being connected to others. I feel all of these aspects of my personality are well complemented in a finance role. Evaluating a company is all about understanding its history and predicting its future. There's also a creative aspect that comes from building your own ventures, and many financial roles are client-facing, which plays right into one of my natural strengths. Certain roles in finance also come with the thrill of competing against other firms in the market, while still requiring a collaborative team effort behind the scenes, and that's exactly what draws me to it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d7937e8c-07de-4603-b463-c5add8c5bc92\"}":{"__typename":"DeepDives","uuid":"d7937e8c-07de-4603-b463-c5add8c5bc92","content":"\u003cp\u003eMy first two summers in high school were spent working at McDonald's. I enjoyed working there, and while some days were tough, I learned a lot from the experience. My junior summer, I was a Bank of America Student Leader where I worked at the EAC Network in their Supervised Visitation and Guardianship program. I witnessed parents and children reunite who had lost custody, and for guardianship, I visited individuals who could no longer live independently, such as the elderly and those with disabilities. It was a very transformative experience. The summer going into college, I interned at Balyasny Asset Management on the Data Science and AI team, focusing on data sourcing and strategy. For my capstone project at Balyasny, I decided to create a comprehensive data analysis on McDonald's Limited Time Offers, which felt like a full circle moment, since I used to be the one at the register.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"354e7231-eda8-4b3c-9107-b15382549b9b\"}":{"__typename":"DeepDives","uuid":"354e7231-eda8-4b3c-9107-b15382549b9b","content":"\u003cp\u003eHonestly, I'm a creative. I love discovering new music artists, and I also enjoy watching television, whether it's reality TV like Survivor or Love Island, Netflix hits, or even cartoons. Content creation is a fun little hobby I sometimes indulge in. I've also been consistent about going to the gym to destress and build confidence, spending time with friends, doing community service around Philadelphia, and making time for God in my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"28ca8a6d-ca99-4fe8-a8ff-2eb808abb70f\"}":{"__typename":"DeepDives","uuid":"28ca8a6d-ca99-4fe8-a8ff-2eb808abb70f","content":"\u003cp\u003eSomething about me that isn't very obvious from how I carry myself is that despite portraying a lot of confidence and extroversion, there are sometimes moments where I may deep down question myself or even question my intelligence despite my achievements. I'd love to help anyone who struggles with that feeling and give them the confidence to keep shining and block out any self-doubt.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"637075aa-b969-49a0-8604-848dc053365e\"}":{"__typename":"School","uuid":"637075aa-b969-49a0-8604-848dc053365e","name":"Baldwin High School","city":"Baldwin","type":"HIGH","state":"New York","country":"United States","zip":"11510"},"Education:{\"uuid\":\"207dbdb6-7eb9-4fa5-8241-4d209722a960\"}":{"__typename":"Education","uuid":"207dbdb6-7eb9-4fa5-8241-4d209722a960","school":{"__ref":"School:{\"uuid\":\"637075aa-b969-49a0-8604-848dc053365e\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"14160087-1ee8-47c0-8751-656335c85f57\"}":{"__typename":"Education","uuid":"14160087-1ee8-47c0-8751-656335c85f57","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Finance","degree":null},"MentorPublicProfile:{\"uuid\":\"0a5ff024-71c1-4302-8e10-7726334bf8aa\"}":{"__typename":"MentorPublicProfile","uuid":"0a5ff024-71c1-4302-8e10-7726334bf8aa","displayName":"Solomon R.","slug":"solomon-ruff","biography":"\u003cp\u003eWhat's up! My name is Solomon. I'm from\u003cstrong\u003e Baldwin, New York\u003c/strong\u003e and I currently go to the \u003cstrong\u003eWharton School of Business \u003c/strong\u003eat the\u003cstrong\u003e University of Pennsylvania, \u003c/strong\u003eClass of 2029, where I'm a part of the Joseph Wharton Scholars Honors Program and plan on pursuing a career in finance. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, I'm very involved in my school's community as I'm a Conference Co-Chairman for the Black Wharton Undergraduate Association, VP of Marketing for the UPenn chapter of BlackGen Capital, (a minority-owned, student-led investment fund), and Marketing Chair in Penn's Students of Hip-Hop Legacy club.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy keeping myself busy with things that matter to me most, whether it's brainstorming business ideas, following market trends, finding a new song I enjoy, or serving my community through public service. In high school I founded a nonprofit focused on empowering young men personally and academically called the \u003cstrong\u003eKnowledge, Inspiration, and Nurturing, Growth for Success (K.I.N.G.S.) Organization.\u003c/strong\u003e I also had a small clothing reselling business called \u003cstrong\u003eSoloSellz\u003c/strong\u003e, where I'd thrift clothes and sell them for a slight profit. I'd definitely consider myself an entrepreneur at heart. In high school, I served as Class President, \u003cstrong\u003eDECA\u003c/strong\u003e Chapter President, and CEO of my school's \u003cstrong\u003eVirtual Enterprise\u003c/strong\u003e firm. I've been a part of many prestigious programs like \u003cstrong\u003eBank of America Student Leaders\u003c/strong\u003e, was a semifinalist for the \u003cstrong\u003eCoca-Cola Scholars Program\u003c/strong\u003e, currently an \u003cstrong\u003eATLAS Fellow\u003c/strong\u003e, and won a certificate of accomplishment from the \u003cstrong\u003ePrinceton Prize in Race Relations \u003c/strong\u003ecommittee. I've also interned at a hedge fund in 2025 and will be interning at a proprietary trading firm in 2026 to explore my keen interest in capital markets. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I stay active and go to the gym, love listening to music as my escape, and look for ways to grow wealth. I'd think of myself as a dreamer with the ambition to make meaningful change in the world. I believe in getting the opportunity to know your strengths and weaknesses, using your strengths to your advantage and finding ways to work with your weaknesses so they benefit you too. I'm also a firm believer in the Japanese philosophy of \u003cstrong\u003eKaizen\u003c/strong\u003e, \"continuous improvement,\" and I believe everyone has the ability to reach their goals. If any of the things I mentioned stand out to you, I'd love to be your mentor and help you achieve your dreams. - Solomon\u003c/p\u003e","teachingVideoPlaybackId":"LdoHwj01VyaaFw1sGJaFnXRto7RMydygOaQSz9wly2Io","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'm proud of being the founder of the Knowledge Inspiration and Nurturing Growth for Success (K.I.N.G.S.) Organization.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome of our most impressive accolades have been:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eRecruited 30+ members\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFostered a strong brotherhood\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFundraised over $5K\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGiven two $1K Scholarships\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGiven a computer scholarship away\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOffered college application, LinkedIn, and financial literacy workshops\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOrganized campus tours of Princeton and Columbia\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOffered multiple community service opportunities to members\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"2460160b-15b9-451b-9131-03eac1cffb1d\"}"},{"__ref":"Favorites:{\"uuid\":\"d6d3dc85-9d35-47f7-abbf-6f4af82cbbc1\"}"},{"__ref":"Favorites:{\"uuid\":\"3e174e37-6ace-45ab-8fd7-da730c93f433\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b7a00071-74cc-4b0e-a59f-8f21810d99ae\"}"}],"major":"Finance","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2d276642
