xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"55195482-be14-4794-b99a-c09dd563ba01\"}":{"__typename":"Favorites","uuid":"55195482-be14-4794-b99a-c09dd563ba01","photoUrl":"https://ucarecdn.com/7f6dadbe-81d4-4f4f-a49a-db1f6f38bcbe/","title":"Cat's Cradle by Kurt Vonnegut","type":"BOOK"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1e07851b-e433-4892-bbde-47d527f35d19\"}":{"__typename":"DeepDives","uuid":"1e07851b-e433-4892-bbde-47d527f35d19","content":"\u003cp\u003eOne thing that I hope to accomplish in the near future is running a half marathon!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've been running long distances since middle school, and I competed on my school's cross country and track teams. The furthest distance I've run is 10 miles, but I'm planning on training for and running the Chicago half marathon this spring!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"349758d8-ccaf-439a-80f3-732e0a65f86e\"}":{"__typename":"DeepDives","uuid":"349758d8-ccaf-439a-80f3-732e0a65f86e","content":"\u003cp\u003eI chose my major in English Literature because I absolutely love to read and write. I became fascinated with finding new ways to interpret classic novels and thinking of how I could relate their key messages to my own life. I think that learning to analyze and draw unique conclusions from familiar texts is a great practice in broadening your mind and learning to seek diverse perspectives. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"5bacff43-299c-4078-a260-d9b4f70c3886\"}":{"__typename":"DeepDives","uuid":"5bacff43-299c-4078-a260-d9b4f70c3886","content":"\u003cp\u003eMy greatest role model is my Abuelo, my mother's father.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHe immigrated to the United States when my mom was a child, entirely uprooting his life in Colombia to ensure that my mom would have a better future growing up in the states. He sacrificed everything for his family, and his courage inspires me every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"5538a945-c5f1-491a-9f77-060df1ace703\"}":{"__typename":"DeepDives","uuid":"5538a945-c5f1-491a-9f77-060df1ace703","content":"\u003cp\u003eMy dream job is to be an English professor, because I want to inspire other college students to enjoy reading and writing just as I've been inspired  throughout my time at Northwestern.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"dba40691-426f-42bc-b9e7-ece551655695\"}":{"__typename":"Education","uuid":"dba40691-426f-42bc-b9e7-ece551655695","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English Literature","degree":null},"School:{\"uuid\":\"ee79c3da-9856-412c-a973-b7d9b07456db\"}":{"__typename":"School","uuid":"ee79c3da-9856-412c-a973-b7d9b07456db","name":"Charles E Smith Jewish Day School--Annette M. and Theodore N. Lerner Family Upper School Campus","city":"Rockville","type":"HIGH","state":"Maryland","country":"United States","zip":"20852"},"Education:{\"uuid\":\"2e2b10b5-87bb-4e30-b7a5-fc33e2bcd35f\"}":{"__typename":"Education","uuid":"2e2b10b5-87bb-4e30-b7a5-fc33e2bcd35f","school":{"__ref":"School:{\"uuid\":\"ee79c3da-9856-412c-a973-b7d9b07456db\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"e56762f3-352a-45e0-b401-c03ed18a86d1\"}":{"__typename":"MentorPublicProfile","uuid":"e56762f3-352a-45e0-b401-c03ed18a86d1","displayName":"Isabelle M.","slug":"isabelle-may","biography":"\u003cp\u003eHi, I'm Isabelle! I'm about to graduate from Northwestern University with a Bachelor's degree in English Literature and Business. I am originally from the D.C. area, and am planning to move to Chicago next fall! For as long as I can remember, I have always loved reading and creative writing, and I can't wait to share my excitement and passion with new mentees.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith over six years of tutoring experience, I have worked with middle and high school students across a range of academic subjects, specializing in AP English courses. I help students refine their essay writing, strengthen reading comprehension, and develop critical thinking skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I specialize in college admissions coaching, guiding juniors and seniors through the essay-writing process—from brainstorming to final revisions. My mentees have earned admission to top universities, including Tufts, WashU, UCLA, Northwestern, and UVA. Additionally, I have experience working with students with learning differences, including ADHD and dyslexia, and tailor my approach to meet each student's unique needs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe in a collaborative and supportive tutoring experience, welcoming input from students and parents to maximize success. I'm always available for questions and quick to respond—feel free to reach out to schedule a session!\u003c/p\u003e","teachingVideoPlaybackId":"2jKEN00eUE3jHEmr4Cb026402QjCLad34dgemlo1R65EuU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"55195482-be14-4794-b99a-c09dd563ba01\"}"}],"causesSupported":[],"major":"English Literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1e07851b-e433-4892-bbde-47d527f35d19\"}"},{"__ref":"DeepDives:{\"uuid\":\"349758d8-ccaf-439a-80f3-732e0a65f86e\"}"},{"__ref":"DeepDives:{\"uuid\":\"5bacff43-299c-4078-a260-d9b4f70c3886\"}"},{"__ref":"DeepDives:{\"uuid\":\"5538a945-c5f1-491a-9f77-060df1ace703\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ef792f58-0d76-4623-83a0-67779c7b81f5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"dba40691-426f-42bc-b9e7-ece551655695\"}"},{"__ref":"Education:{\"uuid\":\"2e2b10b5-87bb-4e30-b7a5-fc33e2bcd35f\"}"}],"hiredAt":"2025-02-15T01:57:34.537Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isabelle-may\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e56762f3-
