":"48823"},"Education:{\"uuid\":\"70f0d980-3221-4784-b597-59842fddc69d\"}":{"__typename":"Education","uuid":"70f0d980-3221-4784-b597-59842fddc69d","school":{"__ref":"School:{\"uuid\":\"282d439d-2edd-468c-9fa7-b590c9aba426\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"da90219c-a35b-498b-97e6-e120a955b8c5\"}":{"__typename":"Education","uuid":"da90219c-a35b-498b-97e6-e120a955b8c5","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English-Creative Writing","degree":null},"MentorPublicProfile:{\"uuid\":\"e8fbc9ab-3611-42d3-81f5-baa942ae0b9a\"}":{"__typename":"MentorPublicProfile","uuid":"e8fbc9ab-3611-42d3-81f5-baa942ae0b9a","displayName":"Anaiis R.","slug":"anaiis-rioskasoga","biography":"\u003cp\u003eHello! My name is Anaiis Rios-Kasoga, and I’m a senior at Yale University, majoring in English with a concentration in creative writing.\u003c/p\u003e\u003cp\u003eI have a deep love for all forms of media and creative writing, and you’ll often find me with my nose in a contemporary fiction book. I’m passionate about empowering young creatives to feel confident in their pursuits. With a strong background in copywriting, I also enjoy helping students refine their work through thoughtful editing and composition support.\u003c/p\u003e\u003cp\u003eDuring my time at Yale, I've run four seasons of a radio show called \u003cem\u003eNothing New. \u003c/em\u003eI’ve had the privilege of working at BOMB Magazine, Glass Literary Agency, and Park Pictures Production. I wrote and produced an original play, \u003cem\u003eHonesty Hour\u003c/em\u003e, and currently serve as an editor for \u003cem\u003eBr!nk: A Review of Books\u003c/em\u003e. I am also the former editor-in-chief of \u003cem\u003eDOWN Magazine\u003c/em\u003e and have contributed to \u003cem\u003eThe New Journal\u003c/em\u003e, \u003cem\u003eThe Yale Herald\u003c/em\u003e, and \u003cem\u003eThe Yale Layer\u003c/em\u003e.\u003c/p\u003e\u003cp\u003eOutside of academics, I spend my time reading, writing, knitting, and capturing moments through freelance photography, a passion I’ve nurtured over the last several years. I love watching movies and I competitively danced for 8 years!\u003c/p\u003e\u003cp\u003eI come from a family of  teachers and they've embedded a ton of educational values in me. \u003c/p\u003e\u003cp\u003eI believe that every student deserves to feel heard and supported in their creative and academic endeavors. My goal as a mentor is to foster a comfortable, open dialogue to create a productive and enjoyable learning experience.\u003c/p\u003e","teachingVideoPlaybackId":"Y5HlqNq01c4UayV800J1baIQ6A7yD3HBDbTTHLoYAzg02M","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8ded7b5c-b745-4d5d-b5cc-9bb357f5a264\"}"}],"causesSupported":[],"major":"English-Creative Writing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fa1cb9f6-f2cb-4ee5-a44c-424092e23c1d\"}"},{"__ref":"DeepDives:{\"uuid\":\"243534e7-c0b5-4129-87bf-2714115e1d14\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/97022aa5-68c7-450a-afbc-d9bb53a2071d/-/preview/-/format/jpg/","https://ucarecdn.com/e65ef0d7-367a-407d-aea3-ab2883edba0a/-/preview/-/format/jpg/","https://ucarecdn.com/484b501b-518a-4afc-bdd7-bb1faef594a2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"70f0d980-3221-4784-b597-59842fddc69d\"}"},{"__ref":"Education:{\"uuid\":\"da90219c-a35b-498b-97e6-e120a955b8c5\"}"}],"hiredAt":"2025-02-12T13:25:27.244Z","topics":["Creative Writing","Fashion / Cosmetics","Film / Theater","Video
