xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"dad14def-943b-4345-bb83-330e59ee566b\"}":{"__typename":"Favorites","uuid":"dad14def-943b-4345-bb83-330e59ee566b","photoUrl":"https://ucarecdn.com/089b7b51-71e3-4aca-8baf-6a5782118534/","title":"Tha Carter III","type":"ALBUM"},"Favorites:{\"uuid\":\"dd0df2ed-c962-4e17-9bfe-a77a1a1000cb\"}":{"__typename":"Favorites","uuid":"dd0df2ed-c962-4e17-9bfe-a77a1a1000cb","photoUrl":"https://ucarecdn.com/089b7b51-71e3-4aca-8baf-6a5782118534/","title":"Serena Williams","type":"ATHLETE"},"Favorites:{\"uuid\":\"6b178a3f-cde8-4e82-bae3-173bcd832df4\"}":{"__typename":"Favorites","uuid":"6b178a3f-cde8-4e82-bae3-173bcd832df4","photoUrl":"https://ucarecdn.com/089b7b51-71e3-4aca-8baf-6a5782118534/","title":"All We Can Save","type":"BOOK"},"CausesSupported:{\"uuid\":\"a117628b-c68e-44c9-82f3-c6ec28c7d989\"}":{"__typename":"CausesSupported","uuid":"a117628b-c68e-44c9-82f3-c6ec28c7d989","name":"","description":"\u003cp\u003eI am supporting the Make A Wish Foundation to enhance young kids' lives.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"360a77e3-e41d-4d9d-9e71-eddf2fef934d\"}":{"__typename":"DeepDives","uuid":"360a77e3-e41d-4d9d-9e71-eddf2fef934d","content":"\u003cp\u003eA silly dream I once had when I was about 6 or 7 was to meet American science TV show host Danni Washington. My silly little dream came true in 2019 when I won the XPrize scholarship to go to Ocean Heroes Bootcamp in British Columbia, Vancouver where I met Danni in the flesh! Since then she had become a mentor for me and has been a role model in my professional development.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c23f6b2f-d9b2-471f-a70e-157ef67c4b3d\"}":{"__typename":"DeepDives","uuid":"c23f6b2f-d9b2-471f-a70e-157ef67c4b3d","content":"\u003cp\u003eIn my spare time, I like to engage in creative arts and reconnect with nature. This could look like going on nature trail walks, fishing, boating, dancing, writing poetry, and even attempting to draw (even though I can't but still enjoy it).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"49839314-ffb1-4563-926b-f406300b9162\"}":{"__typename":"DeepDives","uuid":"49839314-ffb1-4563-926b-f406300b9162","content":"\u003cp\u003eThis past school year, I helped create a program as a programmatic student worker with the Center for Multicultural Affairs at Duke. The program was named Armstrong Ambassadors, created to honor the legacy of Dr. Brenda Armstrong by mentoring students to create and enact their passion projects surrounding student advocacy and/or activism on various issues that mattered to them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"eaa5b1cc-1524-4abd-b6e3-93c04ce539e5\"}":{"__typename":"School","uuid":"eaa5b1cc-1524-4abd-b6e3-93c04ce539e5","name":"Spring Early College Academy","city":"Humble","type":"HIGH","state":"Texas","country":"United States","zip":"77338"},"Education:{\"uuid\":\"d0d5f3dd-4ffe-437a-9d88-2e54a6738a19\"}":{"__typename":"Education","uuid":"d0d5f3dd-4ffe-437a-9d88-2e54a6738a19","school":{"__ref":"School:{\"uuid\":\"eaa5b1cc-1524-4abd-b6e3-93c04ce539e5\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"3781ffd3-65ac-41d1-a7dd-fef9a30d235c\"}":{"__typename":"Education","uuid":"3781ffd3-65ac-41d1-a7dd-fef9a30d235c","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Marine Science and Conservation","degree":null},"MentorPublicProfile:{\"uuid\":\"31490b30-da3f-4590-9366-876d81a1334b\"}":{"__typename":"MentorPublicProfile","uuid":"31490b30-da3f-4590-9366-876d81a1334b","displayName":"Chante' D.","slug":"chante-davis","biography":"\u003cp\u003eI am a rising junior at Duke University, pursuing a major in\u003cstrong\u003e\u0026nbsp;Marine Science and Conservation\u003c/strong\u003e\u0026nbsp;with a minor in\u0026nbsp;\u003cstrong\u003eJournalism, Arts, and Media\u003c/strong\u003e. I am from New Orleans, LA, but have spent the past decade in Houston, TX.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am in the constant pursuit of my passion, which I have done through many means. I have had a plethora of defining experiences that have enriched my learning, and I seek to encourage my mentees to feel empowered to follow their passions- whether academic or personal. From organizing a climate change awareness march in 2021 my junior year of high school to producing videos and managing political campaigns to foster youth engagement to getting published and interviewed by media outlets such as Teen Vogue and Rolling Stone, I have many interests in which I have had the opportunity to engage. Additionally, as a creative and future entrepreneur, I have helped create fashion magazine publications on campus as well as an OH Wake Media + Zine with Lonely Whale and HP, and have had formal sponsorships with small sustainable businesses in which I acted as a micro-influencer for brands such as Sk*p skincare. My academic interests, too, have allowed me real-world experience in engaging audiences as a public speaker. I've been invited to speak at engagements ranging from sustainability and environmental science to race and gender studies to biology to government and policy.\u003c/p\u003e\u003cp\u003eThese experiences have equipped me with the necessary skills to empower students to become independent learners across STEM and non-STEM subjects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy hobbies include scuba diving, storytelling, hip-hop dancing, and creative writing.\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"X9O6BKsKwJvEMUAVFMBUGwDS1aUp3GWmHbfkDcKK32Y","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest award was the William J. Griffith University Global Service Award I received this year at the Duke Student Involvement and Leadership. I was truly shocked to hear that I'd won an award even though I was only a sophomore and was beginning my service in the Duke and broader Durham community, I was awarded this accolade for my service  before I was even admitted to Duke as well as for my continuation of service. This award reminded me that I can continue to make a difference through service wherever I go!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"dad14def-943b-4345-bb83-330e59ee566b\"}"},{"__ref":"Favorites:{\"uuid\":\"dd0df2ed-c962-4e17-9bfe-a77a1a1000cb\"}"},{"__ref":"Favorites:{\"uuid\":\"6b178a3f-cde8-4e82-bae3-173bcd832df4\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"a117628b-c68e-44c9-82f3-c6ec28c7d989\"}"}],"major":"Marine Sci
