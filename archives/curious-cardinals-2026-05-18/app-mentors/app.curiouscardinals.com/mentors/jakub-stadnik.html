c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"b7080687-96c6-480b-a3d9-c035206f33e7\"}":{"__typename":"DeepDives","uuid":"b7080687-96c6-480b-a3d9-c035206f33e7","content":null,"videoPlaybackId":"vnXUp26BQH9s00Eo3DqWUE00raqxOBbP7CxLew2ZHG1sg","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"16bfe78c-81d6-4061-aef4-518da7c34f67\"}":{"__typename":"DeepDives","uuid":"16bfe78c-81d6-4061-aef4-518da7c34f67","content":null,"videoPlaybackId":"PMvGdsnsxu02v3jJBD6KrdPkuQaxv4RQsnItC4Mg02rvw","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"1a210290-1276-49f1-ae6e-8780b8026e42\"}":{"__typename":"School","uuid":"1a210290-1276-49f1-ae6e-8780b8026e42","name":"Newcastle University","city":"Newcastle","type":"HIGH","state":"Tyne and Wear","country":"UK","zip":"NE1 7RU"},"Education:{\"uuid\":\"455ca6b3-2443-4520-bac8-4c0b6dbf9f50\"}":{"__typename":"Education","uuid":"455ca6b3-2443-4520-bac8-4c0b6dbf9f50","school":{"__ref":"School:{\"uuid\":\"1a210290-1276-49f1-ae6e-8780b8026e42\"}"},"startYear":"2019","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9f0f9918-0de6-493e-a70d-91333db860bc\"}":{"__typename":"School","uuid":"9f0f9918-0de6-493e-a70d-91333db860bc","name":"University Collage London (UCL)","city":"London","type":"COLLEGE","state":"Greater London","country":"UK","zip":"E14 5AA"},"Education:{\"uuid\":\"43655b38-ab36-45af-b1cc-272c071d5808\"}":{"__typename":"Education","uuid":"43655b38-ab36-45af-b1cc-272c071d5808","school":{"__ref":"School:{\"uuid\":\"9f0f9918-0de6-493e-a70d-91333db860bc\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2026","major":"MSc Entrepreneurship","degree":null},"MentorPublicProfile:{\"uuid\":\"17efc933-def2-4127-bac6-999809128dd2\"}":{"__typename":"MentorPublicProfile","uuid":"17efc933-def2-4127-bac6-999809128dd2","displayName":"Jakub S.","slug":"jakub-stadnik","biography":"\u003cp\u003e\u003cstrong\u003eHi! I’m Jakub\u003c/strong\u003e, a MSc Entrepreneurship student at University College London (UCL), founder of two businesses and I help ambitious students turn their biggest, wildest ideas into real-world startups, art exhibitions, and vibrant communities!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI’m very passionate about the word of startups, potential of our brain, creative thinking and making positive impact with our ideas. Back in school, I realized early on that by mastering effective learning strategies and understanding how our brains work, anyone can completely rewire how they think. From being an average student, I became the top of my school. Over the last few years, I’ve been busy turning my passions into reality:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFounded Table For Art:\u003c/strong\u003e A London-based startup that turns empty venue spaces into creative workshops (we are already generating real revenue!).\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eExhibited Internationally:\u003c/strong\u003e After earning my BA in Fine Art from Newcastle University, I showcased my artwork in 25 exhibitions across 6 different countries.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuilt the BFreak Project:\u003c/strong\u003e A global creative ecosystem where I hosted multiple lectures, mentored a few students and built a community of 1,400+ creatives.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI love the thrill of building something from scratch and learning new skills: whether it's a new business, a fresh art portfolio, or moving to a new country!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eProjects we can do together\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI mentor students who have a big desire for achievement and positive impact. I specialize in Passion Projects and Academic Mentorship focusing on:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLaunching a Startup:\u003c/strong\u003e We won't just talk about theory. We will test your ideas, find your ideal audience, and build a real Minimum Viable Product (MVP).\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOrganizing Events \u0026amp; Communities:\u003c/strong\u003e I’ll show you how to map out a vision, secure resources, and successfully launch creative workshops, clubs, or exhibitions.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCreative Portfolios \u0026amp; University Admissions:\u003c/strong\u003e Having served on university interview committees myself, I know exactly what top art schools look for and the common mistakes to avoid.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEffective Learning \u0026amp; Personal Growth:\u003c/strong\u003e I teach memory mastery, mind-mapping, and strategic learning to help you meet or even exceed your academic goals.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy mentorship style\u003c/strong\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI know exactly what it feels like to have a mind racing with hundreds of brilliant ideas and getting easily distracted. I likely have ADHD myself, and because of this, I bring a deeply empathetic approach to my mentorship: I view all minds as fascinating. I help highly creative students harness their neuroplasticity, prioritize their overwhelming energy, and design the best pathway to work on your dream.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside of the classroom\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;When I’m not pitching to investors at UCL or painting in my studio, I’m usually reading biographies of geniuses and leaders to figure out what makes them different. I’m also a huge fan of outdoor adventures, exploring new cities, and watching movies. (My favourite: Interstellar, The Theory of Everything, Lucy, Whiplash)\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eIf you want to step off the traditional path, follow your own original idea, and build something completely unique, let's get to work and have some fun! :)\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlaybackId":"FBf8L00fLuzoKCyg486j3JsavDWm3fMQd700ZDqSOb8GA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eFor the last few months, I've been working day and night on my startup and preparing for a Pitch Day competition, which happens every year at UCL School of Management. I had a big honour to pitch my startup in front of real investors, academic staff and other students. I was jumping with joy and smiling like never before when my startup was announced as the winner of THE BEST PITCH! :D It was a crazy night!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5cf139a0-aceb-46ac-98ac-898f4c307bd4\"}"},{"__ref":"Favorites:{\"uuid\":\"fb764cb0-a0c3-4840-a4a1-fde5c225ade3\"}"},{"__ref":"Favorites:{\"uuid\":\"2097fa05-96a7-4200-9696-08845020e416\"}"}],"causesSupported":[],"major":"MSc Entrepreneurship","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"aeccfc29-5ab2-41fc-9f1d-0ebca52ee597\"}"},{"__ref":"DeepDives:{\"uuid\":\"70982938-7495-4d60-8b31-d6760eab0d18\"}"},{"__ref":"DeepDi
