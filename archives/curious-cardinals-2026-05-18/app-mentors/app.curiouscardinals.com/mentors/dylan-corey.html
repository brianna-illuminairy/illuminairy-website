xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3f2fb000-2489-456d-8deb-a0e57c7dc2da\"}":{"__typename":"Favorites","uuid":"3f2fb000-2489-456d-8deb-a0e57c7dc2da","photoUrl":"https://ucarecdn.com/9149b5f2-86fb-42a5-825f-98bc1b4de3fb/","title":"\"I'm God\" by Clams Casino and Imogen Heap","type":"SONG"},"Favorites:{\"uuid\":\"0a829ebe-073a-44fa-aff1-53cba35c2b57\"}":{"__typename":"Favorites","uuid":"0a829ebe-073a-44fa-aff1-53cba35c2b57","photoUrl":"https://ucarecdn.com/d62da626-a983-4720-83b3-2663ebeadee4/","title":"Sekiro","type":"GAME"},"Favorites:{\"uuid\":\"dec7c741-28a6-4b13-b824-ddbb62fe5562\"}":{"__typename":"Favorites","uuid":"dec7c741-28a6-4b13-b824-ddbb62fe5562","photoUrl":"https://ucarecdn.com/5e30c2c6-c9f3-4cda-89a1-8c375204bd2b/","title":"Spirited Away","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f903302e-76f3-4f63-8420-ebc9ad321314\"}":{"__typename":"DeepDives","uuid":"f903302e-76f3-4f63-8420-ebc9ad321314","content":"\u003cp\u003eI would tell my high school self to stop worrying so much about which colleges I get admitted to. Yes, college decisions are important, and a prestigious school can provide amazing opportunities and resources for growth! However, I was so obsessed with college decisions that I often let my academic performance undermine my self-worth, and that was an extremely detrimental mindset that I have worked hard to undo over time. Do not defer your happiness until you accomplish one specific goal, because once you reach that goal, you might have another one – whether it be the next internship, research opportunity, or job offer – consuming your mind before you can even appreciate how far you have come. I promise to whoever’s reading this message, learn from me and let go a little. Work hard, but don’t beat yourself down if things don’t go exactly as planned. Give the college application process your very best effort, but don’t let it control your life for years on end. It’s rare to be truly passionate about the act of learning itself, so please, if you love learning, hold onto that passion with everything you’ve got!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b25577a7-e6ea-43ef-8517-1558fada66f9\"}":{"__typename":"DeepDives","uuid":"b25577a7-e6ea-43ef-8517-1558fada66f9","content":"\u003cp\u003eMentorship matters to me because I love teaching new things to people, and I truly understand the frustration that comes from an education system that is overgeneralized, redundant, and not tailored to every student’s individual needs. Do school systems realistically expect students to learn by passively observing monotonous lectures day after day with no time to ask questions? If any student falls behind, they simply don’t have enough time or resources to catch up with the class material. There is a chain reaction where if the student doesn’t understand one lecture, they won’t understand the following ones either, causing them to fall behind at an alarming rate. This is a problem even in college! I can personally attribute every bit of academic success in my college STEM classes to the undergraduate learning assistants who helped me learn the class material one-on-one in office hours. The K-12 curriculum has been designed to merely verify one’s knowledge rather than help students learn in the first place. I want to be a mentor to give students the chance to study, experiment, and think critically without the fear of failure or falling behind. I also want to teach them important life skills and mindsets to prepare them for a prosperous future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c1a775a8-8131-4cb5-bda3-b7f27bc980ca\"}":{"__typename":"DeepDives","uuid":"c1a775a8-8131-4cb5-bda3-b7f27bc980ca","content":"\u003cp\u003eI decided to major in Electrical Engineering and Computer Science on a random Thursday night (just kidding, but I was in a serious time crunch). I used a process of elimination to narrow down my options. I knew I wanted to major in STEM, but I didn’t enjoy pure math as much as I’d hoped after taking linear algebra, so I browsed engineering and computer science majors. Mechanical engineering had a Sisyphean amount of coursework to complete before graduation, and while I enjoy computer science, I didn’t feel strongly enough to take it as my sole major. In the end, since electrical engineering and computer science are two closely intertwined subjects, I decided to pursue them both as a joint major. The one thing I haven’t avoided, however, is the Sisyphean workload.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e8b9805e-6cb9-4eab-995f-c087fe0764c1\"}":{"__typename":"DeepDives","uuid":"e8b9805e-6cb9-4eab-995f-c087fe0764c1","content":"\u003cp\u003eIn my spare time, I love producing music with digital software, such as FL Studio. I compose whatever I feel like in the moment, whether it’s orchestral and ambient soundtracks or aggressive EDM and hip-hop beats. Composing music is one of the few things where I can sit down for hours on end without getting sidetracked at all. Aside from writing music, I love playing story-driven video games, especially notoriously difficult ones, such as Sekiro and Hollow Knight. Sekiro is a samurai game with buttery smooth combat mechanics – the best in any game I’ve ever played, period. The combat is perfect. It’s a brutal challenge that pushes you to your limits. Your weapon is the same from start to end – just a trusty katana. The best part is that when you lose a fight, it’s your fault entirely – you barely get any upgrades that make your in-game character stronger; rather, when you lose and lose again, it’s you as a player that gets better the more you try and try again. I love games that don’t hold your hand, because the reward of learning and overcoming that one challenge you once thought was impossible is the most satisfying part of all.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"df908fcb-1f22-48c5-ab0a-e2add7632966\"}":{"__typename":"School","uuid":"df908fcb-1f22-48c5-ab0a-e2add7632966","name":"Minnetonka High School","city":"Minnetonka","type":"HIGH","state":"Minnesota","country":"United States","zip":"55345"},"Education:{\"uuid\":\"91d4ecbe-2519-4052-909a-b7027a5836c2\"}":{"__typename":"Education","uuid":"91d4ecbe-2519-4052-909a-b7027a5836c2","school":{"__ref":"School:{\"uuid\":\"df908fcb-1f22-48c5-ab0a-e2add7632966\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"30481d83-fc1a-4f36-856d-765513ec393c\"}":{"__typename":"Education","uuid":"30481d83-fc1a-4f36-856d-765513ec393c","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Electrical Engineering and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"b0d28bb6-ad14-42dc-a396-7f8851eb012f\"}":{"__typename":"MentorPublicProfile","uuid":"b0d28bb6-ad14-42dc-a396-7f8851eb012f","displayName":"Dylan C.","slug":"dylan-corey","biography":"\u003cp\u003eHello! My name is Dylan, and I’m pursuing Electrical Engineering and Computer Science at Yale University. I currently work as a publicist for the Yale School of Public Health (YSPH) Alumni Affairs page, where I collaborate with prominent YSPH faculty and alumni to bring significant professional achievements, relevant public health developments, and cutting-edge public health research to a broad audience. I am also a member of Yale’s premier undergraduate video game development team called Amoriem Labs. On the team, I collaborate with programmers, artists, and writers by producing FL Studio music compositions and sound effects for the game with an interdisciplinary focus.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne essential thing I’ve learned throughout my short nineteen years of life is this: always try something new – especially if it makes you uncomfortable. I embraced this mindset early on when I plunged face-first into a Chinese Immersion program in Kindergarten. The reason? I was a late talker, and I found it challenging to express myself as other students could. Everyone else already had a head start in socializing, yet I was silent – desperately trying to catch up. I began to feel lonelier and lonelier, and it was at that moment that my parents took a big risk: they put me in a new curriculum, fully taught in Chinese. The moment I stepped into the classroom, although I didn’t understand a lick of Mandarin, I finally didn’t feel out of place. We all had to start from scratch by learning how to communicate in a completely new language. There was a sense of camaraderie, knowing that everyone else was in the same boat as me. Throughout the program, we all had to get creative, finding clever new ways to communicate with each other, often performing various gestures and motions to convey our thoughts and feelings. Ironically, by immersing myself in a completely foreign language, I finally felt the freedom to communicate after struggling for so long to do so. I fell in love with learning Chinese, and now, with over fourteen years of Chinese experience under my belt, I don’t regret that decision one bit.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSurprisingly enough, I went my entire life without a single piano phase (or instrument phase, if you exclude the mandatory band classes in middle school)! Although I had a lot of time to explore my interests outside of class, the downside was that I had absolutely zero knowledge of music theory and composition. Of course, the hobby that just so happened to catch my interest was something I’ll never put down: digital music production.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eStarting from middle school, I enrolled in a five-year program at the University of Minnesota for rigorous college-level mathematics, taught in person at the university itself. This alone was an incredible challenge in and of itself; for the first time in my life, I had to plan my schedule days ahead of time and organize times to collaborate with other classmates on homework. I had to practice immense self-discipline to stay on track with the material. Most of all, I was stressed – terribly uncomfortable – with the difficulty of the concepts taught in these classes. I was managing the workload of a college math class before I even set foot in a high school. On the car trips to there and back, there was no internet, so one day, out of pure boredom, I grabbed my school iPad and opened up a music-making app called GarageBand. With all the instruments, melody loops, and MIDI presets, I was as lost as could be, but I was immediately hooked by the total freedom I had to create whatever song I wanted. Despite my lack of music theory, I taught myself over the years how to use the program, learning which notes and instruments worked together and which ones didn’t. By the time I was in high school, I switched to FL Studio, an industry-standard program more suited to what I wanted to create. There, I founded a digital music production club to share my passion for composition with others. Being able to work one-on-one with other students reminded me of the same joy I felt the day I discovered digital music production on GarageBand. Now, I work as a soundtrack designer for Amoriem Labs, and I feel an immense sense of joy collaborating with other brilliant students who also love digital music production.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love math and music because to me, they are “universal languages” – no matter where you come from or what your background is, we can all come together to cherish these arts without any barriers. Math and music make me happy, but even more importantly, learning them sometimes makes me uncomfortable. It’s incredibly challenging to learn something with no prior knowledge, and it’s even harder to stay committed to it. Although I struggled greatly, I couldn’t imagine what my life would be like without these passions I picked up out of sheer curiosity and continued out of sheer perseverance. Over the years, I’ve learned so much about the process of learning itself. With my years of experience in various STEM subjects, Mandarin Chinese, and digital music composition, I have significant knowledge to share, but most importantly, I believe that as a mentor, I have responsibilities outside of merely tutoring academics. I fell in love with Curious Cardinals’ goal of mentoring students holistically, teaching them not just how to pass their classes, but how to grow as critical thinkers. Learning should be fun. Learning is an invaluable opportunity. I want to instill a growth mindset in students and teach them to embrace what is difficult and take the plunge into the unknown, just as I try to do every chance I get!\u003c/p\u003e","teachingVideoPlaybackId":"SYGeYLq0002FNzkOtGamV9wS7auS00gnWiXM2SvsI3eDR8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3f2fb000-2489-456d-8deb-a0e57c7dc2da\"}"},{"__ref":"Favorites:{\"uuid\":\"0a829ebe-073a-44fa-aff1-53cba35c2b57\"}"},{"__ref":"Favorites:{\"uuid\":\"dec7c741-28a6-4b13-b824-ddbb62fe5562\"}"}],"causesSupported":[],"major":"Electrical Engineering and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f903302e-76f3-4f63-8420-ebc9ad321314\"}"},{"__ref":"DeepDives:{\"uuid\":\"b25577a7-e6ea-43ef-8517-1558fada66f9\"}"},{"__ref":"DeepDives:{\"uuid\":\"c1a775a8-8131-4cb5-bda3-b7f27bc980ca\"}"},{"__ref":"DeepDives:{\"uuid\":\"e8b9805e-6cb9-4eab-995f-c087fe0764c1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/89c5cae5-0e84-4c70-8591-6cee451c4bec/-/preview/-/format/jpg/","https://ucarecdn.com/02a64e4a-5872-4e2a-8708-08a386e4fb72/-/preview/-/format/jpg/","https://ucarecdn.com/f7ae6ef2-9ffe-4a80-80c3-06a3b18cfeed/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"91d4ecbe-2519-4052-909a-b7027a5836c2\"}"},{"__ref":"Education:{\"uuid\":\"30481d83-fc1a-4f36-856d-765513ec393c\"}"}],"hiredAt":"2026-01-11T21:36:28.973Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Physics","Writing","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science","Music","Visual Arts / Graphic Design","Creative Writing","Video / Photography","Coding / Programming","Game Design","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"dylan-corey\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b0d28bb6-ad14-42dc-a396-7f8851eb012f\"}"}}},"_sentryTraceData":"61e063a5ed2a4efb8a4392fa37bd3e60-a1d6753097194c47-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=61e063a5ed2a4efb8a4392fa37bd3e60,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"dylan-corey"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
