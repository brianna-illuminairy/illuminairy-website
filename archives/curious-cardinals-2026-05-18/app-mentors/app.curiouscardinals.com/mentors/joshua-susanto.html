xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4d2f8992-13c8-4863-9c76-3640b1c80b79\"}":{"__typename":"Favorites","uuid":"4d2f8992-13c8-4863-9c76-3640b1c80b79","photoUrl":"https://ucarecdn.com/466d01e0-b3b4-4bc5-a47a-aaac5aed0b12/","title":"LA Lakers","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"6fba873f-4a4b-4778-a52c-29353870748c\"}":{"__typename":"Favorites","uuid":"6fba873f-4a4b-4778-a52c-29353870748c","photoUrl":"https://ucarecdn.com/70c3e1e5-8fa3-4a82-8fac-ec0da7222f17/","title":"Super Smash Bros.","type":"GAME"},"Favorites:{\"uuid\":\"238fa518-4c71-43d6-ba56-6de9a1f35b61\"}":{"__typename":"Favorites","uuid":"238fa518-4c71-43d6-ba56-6de9a1f35b61","photoUrl":"https://ucarecdn.com/47a7cedf-4c8a-42b8-a051-e40a82af2829/","title":"20th Century Boys","type":"BOOK"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"e6a111e2-6515-4534-b4c2-a4847cef8b8f\"}":{"__typename":"DeepDives","uuid":"e6a111e2-6515-4534-b4c2-a4847cef8b8f","content":"\u003cp\u003eMy greatest role model would definitely be my dad! He's always been so supportive and only wants the best for me. My father embraced all things about me and all of my favorited niches and phases. He provided an environment where I could be myself with no shame or judgement. He's a really goofy dude, always cracking jokes and lightening the mood. I've always looked up to him and through his mentorship I learned to be kind, to support and uplift, and not to take things to seriously!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"62049ede-1dfd-4e93-8e4c-f4943912e4e8\"}":{"__typename":"DeepDives","uuid":"62049ede-1dfd-4e93-8e4c-f4943912e4e8","content":"\u003cp\u003eI do all sorts of things I don't even know where to begin. On slow days I like to relax and play some games (really into Stardew Valley right now if you know you know) or watch shows. I love cooking and trying new recipes, staying active, and thrifting/shopping! Sometimes I'll just hit up a friend and see where the road takes us! I also really enjoy finding new things to try and experiencing new things. I'm always open for spontaneous adventures and chill times!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"306ebe76-95a8-438b-9e69-9fd75065cb2b\"}":{"__typename":"DeepDives","uuid":"306ebe76-95a8-438b-9e69-9fd75065cb2b","content":"\u003cp\u003eI've always been a math guy growing up, having a knack for numbers and an analytical approach to most things. However, most applications of math that I knew of growing up didn't interest me; that is, until I found out about data science. I learned that I could apply both my mathematical affinity and analytical mindset into this field. The idea of being able to synthesize every observable outcome imaginable and translating or interpreting these data into insights was fascinating. As a data science major, I could do what I love and apply it to other things I enjoy. They say data is the new oil, and I knew I that this skillset was something I wanted to invest in.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"46a1987d-2bb5-450b-8f23-674e9394d662\"}":{"__typename":"School","uuid":"46a1987d-2bb5-450b-8f23-674e9394d662","name":"Glen A. Wilson High School","city":"Hacienda Heights","type":"HIGH","state":"California","country":"United States","zip":"91745"},"Education:{\"uuid\":\"bec3a9b5-31af-414a-96ea-0162d075a8da\"}":{"__typename":"Education","uuid":"bec3a9b5-31af-414a-96ea-0162d075a8da","school":{"__ref":"School:{\"uuid\":\"46a1987d-2bb5-450b-8f23-674e9394d662\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"426ebdd1-18b7-4628-87bf-d3859718a694\"}":{"__typename":"Education","uuid":"426ebdd1-18b7-4628-87bf-d3859718a694","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Data Theory","degree":null},"MentorPublicProfile:{\"uuid\":\"2771e222-21fe-43fc-b5a5-b64a51dcc283\"}":{"__typename":"MentorPublicProfile","uuid":"2771e222-21fe-43fc-b5a5-b64a51dcc283","displayName":"Joshua S.","slug":"joshua-susanto","biography":"\u003cp\u003eHi! I'm Josh, a recent graduate from UCLA with a bachelor's degree in Data Theory. I'd describe myself as a laid back person who loves working out, cooking, playing video games, and fashion. I'm a curious soul at heart; I love learning and have a deep appreciation for theoretical maths, statistics, and data science. So much so that I plan to start pursuing a master's degree in Data Science in the following year! At my time in UCLA I was heavily involved in many extracurricular clubs and organizations. One of the highlights of my college career was working as the Data Journalism Chair for Bruin Sports Analytics, where I was able to mentor over 100 students in data-driven article writing as well as manage our club's prestigious Data Journalism Blog. I grew up playing a lot of sports, (particularly basketball) so it was a very fulfilling applying my skills in data analytics with my passion for sports. This is what I love about data science, you can apply it to almost any field or industry! I believe that the ability to effectively analyze data and make data-driven decisions makes you an extremely flexible individual and is an amazing skillset to learn. I was also heavily involved in the Southeast Asian Community on campus. Within this space I also served as a mentor for newly admitted students and high school students, where I gave campus tours, created workshops, and helped build a welcoming community. I love meeting and connecting with new people and look forward to embarking on this educational journey with Curious Cardinals!\u003c/p\u003e","teachingVideoPlaybackId":"4cZ5T31v5S4U7VKyxiGl1cLNGFMuBs1LZ91dANkY5FA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI graduated from UCLA with Summa Cum Laude, the highest form of Latin Honors!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"4d2f8992-13c8-4863-9c76-3640b1c80b79\"}"},{"__ref":"Favorites:{\"uuid\":\"6fba873f-4a4b-4778-a52c-29353870748c\"}"},{"__ref":"Favorites:{\"uuid\":\"238fa518-4c71-43d6-ba56-6de9a1f35b61\"}"}],"causesSupported":[],"major":"Data Theory","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e6a111e2-6515-4534-b4c2-a4847cef8b8f\"}"},{"__ref":"DeepDives:{\"uuid\":\"62049ede-1dfd-4e93-8e4c-f4943912e4e8\"}"},{"__ref":"DeepDives:{\"uuid\":\"306ebe76-95a8-438b-9e69-9fd75065cb2b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2e981489-ef14-4740-b12f-413ae75f4da0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"bec3a9b5-31af-414a-96ea-0162d075a8da\"}"},{"__ref"
