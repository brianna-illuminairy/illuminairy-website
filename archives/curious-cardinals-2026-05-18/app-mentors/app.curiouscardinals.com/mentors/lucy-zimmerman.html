xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"cc15c421-206c-43cb-9187-deb2bc3244b6\"}":{"__typename":"DeepDives","uuid":"cc15c421-206c-43cb-9187-deb2bc3244b6","content":"\u003cp\u003eBeing passionate about robotics and coding as a woman growing up was not always easy. I played a lot of sports too, and I distinctly remember almost quitting my soccer club or leaving a coding club because there were no other girls in it. I didn't feel like it was meant for me. This is why when I teach, I make sure to center encouragement and inclusivity. No matter your identity, and how skilled you are at a subject, you should feel like you belong in that area just as much as anyone else. Once you cement that internal drive and belief, you can learn and achieve anything!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"bfc105ea-a642-4bcb-8bba-2221aed8246d\"}":{"__typename":"DeepDives","uuid":"bfc105ea-a642-4bcb-8bba-2221aed8246d","content":"\u003cp\u003eThough I've grown up mostly my whole life in Australia, I have family in the bay area, and I am very familiar with the US!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a7f4397a-7c59-4ba5-9ca4-9c7bde908bdc\"}":{"__typename":"DeepDives","uuid":"a7f4397a-7c59-4ba5-9ca4-9c7bde908bdc","content":"\u003cp\u003eI love to cook! Cooking is another form of storytelling for me, just like writing. I love learning about every element of the dish I'm preparing and also preparing something special for each person I cook for. I take risks when I cook because that's how I've learned the most and I'm never afraid to go a little off book :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"0f3748a1-19ad-43cb-9e32-1a8800528715\"}":{"__typename":"Education","uuid":"0f3748a1-19ad-43cb-9e32-1a8800528715","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science + Creative Writing","degree":"BS"},"School:{\"uuid\":\"c1cb8a60-9d55-433a-879b-3eb46a3a3562\"}":{"__typename":"School","uuid":"c1cb8a60-9d55-433a-879b-3eb46a3a3562","name":"Sydney Girls High","city":"Sydney","type":"HIGH","state":"NSW","country":"Australia","zip":"2021"},"Education:{\"uuid\":\"3f4e1c18-569b-41a4-a622-6e9b60f23a56\"}":{"__typename":"Education","uuid":"3f4e1c18-569b-41a4-a622-6e9b60f23a56","school":{"__ref":"School:{\"uuid\":\"c1cb8a60-9d55-433a-879b-3eb46a3a3562\"}"},"startYear":"2014","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"5c914543-bf7a-4ae6-aa98-78de38005dbb\"}":{"__typename":"MentorPublicProfile","uuid":"5c914543-bf7a-4ae6-aa98-78de38005dbb","displayName":"Lucy Z.","slug":"lucy-zimmerman","biography":"\u003cp\u003eLucy is a senior at Stanford, getting her undergrad and masters in Computer Science, also pursuing a minor in Creative Writing. She's interested in exploring the intersection between technology and humanities, developing software that helps not harms. In 2020, she graduated from Sydney Girls High School in the top 1% of her state, while also playing competitive basketball and water polo and being part of Student Government. During high school, she developed her love for teaching, coding and robotics through founding and teaching a club for students. She has also has over 3 years experience as a tutor for high school students. At University, she has continued her love for developing and tinkering (CS project-based and design classes), and her love for the humanities (Writing workshops and history classes). She's currently building a product that uses AI to combat misinformation, and becoming a female founder.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLucy grew up in Sydney, Australia close to the beach, so outside of school, Lucy loves escaping to any source of water: swimming, surfing, or floating in fountains on campus! She also worked as a student researcher for Stanford’s Human-AI Centre and in the Stanford Human Trafficking Data Lab, organizes notoriously fun Boba Nights and Karaoke while on her Class Cabinet, and serves as a Stanford Tour Guide, which serves as an opportunity for her to continue to practice her best American accent on unsuspecting visitors!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIt's a long story but last summer, I went to a rural town in Estonia to mentor young estonians in a weeklong hackathon! I learned so much about a place I had never had any connection to and bonded with kids who sometimes didn't speak any English. My team won the competition and went on the radio and shouted me out! So I guess I'm a E-List celebrity in Estonia now :) \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Computer Science + Creative Writing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cc15c421-206c-43cb-9187-deb2bc3244b6\"}"},{"__ref":"DeepDives:{\"uuid\":\"bfc105ea-a642-4bcb-8bba-2221aed8246d\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7f4397a-7c59-4ba5-9ca4-9c7bde908bdc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d17ae027-76c1-4612-b215-dbe2c0adc94e/-/preview/-/format/jpg/","https://ucarecdn.com/cc189bb3-dca4-4f0e-8eec-a8d74c18eef7/-/preview/-/format/jpg/","https://ucarecdn.com/197a503e-5b39-455c-a530-2ead740b66ba/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"0f3748a1-19ad-43cb-9e32-1a8800528715\"}"},{"__ref":"Education:{\"uuid\":\"3f4e1c18-569b-41a4-a622-6e9b60f23a56\"}"}],"hiredAt":"2023-05-03T16:16:35.052Z","topics":["K-6 Storybook","Creative Writing","Video / Photography","History Project"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lucy-zimmerman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5c914543-bf7a-4ae6-aa98-78de38005dbb\"}"}}},"_sentryTraceData":"083f5b5b4a0a486a924f35c9a2125ec2-a0e2ce2aa8914e88-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=083f5b5b4a0a486a924f35c9a2125ec2,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"lucy-zimm
