xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"dfab6778-2304-42ef-817c-39c2dd93806b\"}":{"__typename":"DeepDives","uuid":"dfab6778-2304-42ef-817c-39c2dd93806b","content":"\u003cp\u003eI have always wanted to build. Whether its legos, robots, or race cars, I want to create and design. I chose Mechanical Engineering because it will give me the skills needed to engineer and invent products that will help people every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"571a7847-5d82-45f5-b5df-9ee847d1bdc5\"}":{"__typename":"DeepDives","uuid":"571a7847-5d82-45f5-b5df-9ee847d1bdc5","content":"\u003cp\u003eMentoring is extremely important. Having grown up with an older mentor figure myself, I know firsthand just how impactful having someone in your corner can be. I want to do more than just tutor and teach - I want to make a difference in someone's life and be a consistent, reliable resource.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"ddd296e3-d2f6-4e29-ad46-160f42c1ce37\"}":{"__typename":"DeepDives","uuid":"ddd296e3-d2f6-4e29-ad46-160f42c1ce37","content":"\u003cp\u003eIn highschool, I worked at a research lab at UCLA, taught multiple engineering classes at my local YMCA and LAUSD schools, and worked as an usher for the Hollywood Bowl!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b5168a86-7fd4-4d50-958c-7ddf863b6bef\"}":{"__typename":"DeepDives","uuid":"b5168a86-7fd4-4d50-958c-7ddf863b6bef","content":"\u003cp\u003eIn my spare time, I love playing music and working out. Playing the drums, learning the guitar, and lifting weights are all ways I decompress and manage my anxiety.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}":{"__typename":"School","uuid":"693ea7b8-def0-456d-88a4-4055bd090a62","name":"Marlborough School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90004"},"Education:{\"uuid\":\"21c546a4-51d0-4fc7-adcb-11f69585cbfb\"}":{"__typename":"Education","uuid":"21c546a4-51d0-4fc7-adcb-11f69585cbfb","school":{"__ref":"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"56bbc93f-2595-45e1-9e0f-0ea0d94bf4ed\"}":{"__typename":"Education","uuid":"56bbc93f-2595-45e1-9e0f-0ea0d94bf4ed","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering and Engineering Entrepreneurship","degree":null},"MentorPublicProfile:{\"uuid\":\"aa21bdfb-b88f-4636-a867-4f43da1e54d1\"}":{"__typename":"MentorPublicProfile","uuid":"aa21bdfb-b88f-4636-a867-4f43da1e54d1","displayName":"Max K.","slug":"max-kramer","biography":"\u003cp\u003eHi! I'm Max, a sophomore at Carnegie Mellon University in Pittsburgh Pennsylvania. As a mentor for your student, I have three main goals: build a trusting relationship, teach them skills they can use to succeed in school and the given subject, and have fun through engaging and interactive sessions!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up in Los Angeles, California, where I was one of only two trans boys at an all-girls high school. Through this unique high school experience, I chose to focus on standing out due to my interest in STEM rather than my gender. I participated in FIRST Tech Challenge for six years, cultivating my passion and interest in mechanical design and robotics. I also decided to share my passion with others, founding a non-profit organization called Build Your World which taught engineering and coding classes I wrote to students just like yours.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to working in various research labs at UCLA and CMU, I am also the Chassis Captain for my schools Formula Student Racing team, where we design and build a new car every year. And, I am also a proud member of Apex, a student organization that builds carbon fiber buggies. As part of the 100+ year tradition, we put a person inside to stear and push the buggy up and down hills at 4am on weekends (it sounds crazy, I know, but it is an extremely fun CMU tradition and community -- think soapbox races but cooler).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of engineering, I spend my free time going to the gym and playing sports, watching hockey (lets go Rangers!) and listening to and playing music. I've played the drums since I was 5 years old, and am currently teaching myself guitar!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"00TRtlO5PTX1jnuDG8czO7r4ufxdaFf8UCEIk2ybCAvc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering and Engineering Entrepreneurship","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dfab6778-2304-42ef-817c-39c2dd93806b\"}"},{"__ref":"DeepDives:{\"uuid\":\"571a7847-5d82-45f5-b5df-9ee847d1bdc5\"}"},{"__ref":"DeepDives:{\"uuid\":\"ddd296e3-d2f6-4e29-ad46-160f42c1ce37\"}"},{"__ref":"DeepDives:{\"uuid\":\"b5168a86-7fd4-4d50-958c-7ddf863b6bef\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9d9a0980-45dc-4524-a151-c40e69072064/-/preview/-/format/jpg/","https://ucarecdn.com/609080c6-d641-48bd-a5d6-d4abab20b53f/-/preview/-/format/jpg/","https://ucarecdn.com/7d37e441-3d3a-49fe-bc4b-d97a53f060bc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"21c546a4-51d0-4fc7-adcb-11f69585cbfb\"}"},{"__ref":"Education:{\"uuid\":\"56bbc93f-2595-45e1-9e0f-0ea0d94bf4ed\"}"}],"hiredAt":"2025-01-15T14:24:49.514Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Executive Function","Computer Science","Business / Entrepreneurship","Coding / Programming","Robotics / Electronics / CAD","Game Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"max-kramer\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"aa21bdfb-b88f-4636-a867-4f43da1e54d1\"}"}}},"_sentryTraceData":"9c0d58fff37b4cffa67fbb2b32fd2e2d-a0dbad3da0
