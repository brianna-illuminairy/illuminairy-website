ing I hope to accomplish is writing and publishing a novel. I've had an idea for quite some time, but I have yet to commit to sitting down and actually writing it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e3aa5cf0-7fad-459a-aa72-47cdfa00865b\"}":{"__typename":"DeepDives","uuid":"e3aa5cf0-7fad-459a-aa72-47cdfa00865b","content":"\u003cp\u003eI hope to one day be a medical lawyer or pursue something in the realm of bioethics. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2ca9756f-98ba-4d43-9700-d677d9855c31\"}":{"__typename":"DeepDives","uuid":"2ca9756f-98ba-4d43-9700-d677d9855c31","content":"\u003cp\u003eIn high school, I started a non-profit volunteering organization called Service Salute. The goal was to send thank you letters to doctors across the country to thank them for their continued commitment to their communities during the pandemic. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"140f6b3e-2d8b-4c34-a073-efae4acc5999\"}":{"__typename":"School","uuid":"140f6b3e-2d8b-4c34-a073-efae4acc5999","name":"Mater Dei High School","city":"Santa Ana","type":"HIGH","state":"California","country":"United States","zip":"92707"},"Education:{\"uuid\":\"72a44e89-7dd7-49ca-985b-6c009d351abe\"}":{"__typename":"Education","uuid":"72a44e89-7dd7-49ca-985b-6c009d351abe","school":{"__ref":"School:{\"uuid\":\"140f6b3e-2d8b-4c34-a073-efae4acc5999\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"35231b9f-f0b8-4973-8ed7-70dd6063d910\"}":{"__typename":"Education","uuid":"35231b9f-f0b8-4973-8ed7-70dd6063d910","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Neuroscience ","degree":null},"MentorPublicProfile:{\"uuid\":\"f03810d9-3544-4c1c-a197-030b60d14e54\"}":{"__typename":"MentorPublicProfile","uuid":"f03810d9-3544-4c1c-a197-030b60d14e54","displayName":"Hannah N.","slug":"hannah-nashed","biography":"\u003cp\u003eHi! My name is Hannah and I'm originally from Huntington Beach, California but I now attend Yale University in New Haven, Connecticut. Lately, my friend and I have embraced what we call our \"side-quest era,\" where we're actively seeking out new experiences beyond our usual routines. This mindset has been a part of me for a while now, as I'm constantly driven to learn and explore different fields.\u003c/p\u003e\u003cp\u003eWhile my current focus is on neuroscience, my ultimate goal is to delve into the realm of law. I'm fascinated by the intersections between these seemingly disparate areas of study, believing that it's in these intersections where true innovation and discovery occur. While most of my academic pursuits lean towards STEM, my extracurricular activities gravitate towards pre-law interests, such as my involvement with the Yale Undergraduate Legal Journal and the Yale Student Association for Small Claims.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDespite the demands of academics and my leadership roles, I strive to maintain a healthy social life. I love finding new restaurants and shops with my friends, going rock climbing, volunteering, and attending the random events you always see posted on flyers. Finding this balance between academics, extracurriculars, and social activities is admittedly one of the hardest things to do, but is nevertheless a goal I consistently strive for. \u003c/p\u003e","teachingVideoPlaybackId":"jl6SlC6iodhJwr02BzddhznDwnh9kSE4UsCnWfTPTfIs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f2f09ae9-fd70-4d02-994e-b7d6a0b8dba4\"}"},{"__ref":"Favorites:{\"uuid\":\"f74dfe13-b4a1-4f4c-8d29-eadd5fb5b8e9\"}"},{"__ref":"Favorites:{\"uuid\":\"1cdbbe96-cdd5-4044-a2e9-4275cb8bd0a0\"}"}],"causesSupported":[],"major":"Neuroscience ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e8c0fd94-2565-45cd-8cca-550bc6f97fde\"}"},{"__ref":"DeepDives:{\"uuid\":\"8bc89e3f-4440-49a3-aa4f-fb8b5fc0ac52\"}"},{"__ref":"DeepDives:{\"uuid\":\"e3aa5cf0-7fad-459a-aa72-47cdfa00865b\"}"},{"__ref":"DeepDives:{\"uuid\":\"2ca9756f-98ba-4d43-9700-d677d9855c31\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3819f636-fa7c-4cf2-ad29-e782844fd83b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"72a44e89-7dd7-49ca-985b-6c009d351abe\"}"},{"__ref":"Education:{\"uuid\":\"35231b9f-f0b8-4973-8ed7-70dd6063d910\"}"}],"hiredAt":"2024-02-15T11:38:09.293Z","topics":["Business / Entrepreneurship","6-8 Grade Science","Writing","College Essay Writing","History","Biology"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hannah-nashed\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f03810d9-3544-4c1c-a197-030b60d14e54\"}"}}},"_sentryTraceData":"301a0d1faaac433785679343349bf5e7-90cb16a37274605a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972
