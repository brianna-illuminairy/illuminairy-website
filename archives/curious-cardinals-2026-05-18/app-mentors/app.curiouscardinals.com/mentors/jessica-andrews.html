xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a9176b3c-f279-456b-a58a-db380ca6955b\"}":{"__typename":"Favorites","uuid":"a9176b3c-f279-456b-a58a-db380ca6955b","photoUrl":"https://ucarecdn.com/c041cdec-1d3d-484e-af8d-49a4528b8a4e/","title":"BTS","type":"ARTIST"},"Favorites:{\"uuid\":\"37ef2e69-506e-4942-8807-c2dd2f42bf31\"}":{"__typename":"Favorites","uuid":"37ef2e69-506e-4942-8807-c2dd2f42bf31","photoUrl":"https://ucarecdn.com/b26211e6-5b7c-42db-8857-701113a29774/","title":"BTS Love Yourself Answer","type":"ALBUM"},"Favorites:{\"uuid\":\"ee75de82-1ebc-40bc-9690-8d3a56e11663\"}":{"__typename":"Favorites","uuid":"ee75de82-1ebc-40bc-9690-8d3a56e11663","photoUrl":"https://ucarecdn.com/69f25c15-c632-40d1-ae47-11d44981e80d/","title":"How to Train Your Dragon","type":"MOVIE"},"CausesSupported:{\"uuid\":\"d9727aec-a26a-4e36-92a1-7d59e2367ae9\"}":{"__typename":"CausesSupported","uuid":"d9727aec-a26a-4e36-92a1-7d59e2367ae9","name":"","description":"","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"15159a1e-0f3b-4d31-969e-90ec77ab9aa4\"}":{"__typename":"DeepDives","uuid":"15159a1e-0f3b-4d31-969e-90ec77ab9aa4","content":"\u003cp\u003eIf I could go back and talk to my middle or high school self, I would tell myself not to be discouraged by negative outcomes and to focus instead on building specific skills and habits. We all know what it feels like to work really hard on something and still fall short of the result we hoped for, a bad grade, a rejection, or not making the team.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat I didn’t realize then is that the ability to show up, put in effort, and try again is a skill in itself. Each time you give something your full effort, you’re building perseverance, discipline, and self-trust, regardless of the outcome. Those skills compound over time and matter far more than any single win or loss.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI would remind myself that progress isn’t always visible in the moment, but consistent effort eventually creates opportunities you couldn’t see at the start.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2b2883c1-09f1-423e-aa7c-a0e6c6323837\"}":{"__typename":"DeepDives","uuid":"2b2883c1-09f1-423e-aa7c-a0e6c6323837","content":"\u003cp\u003eTo me, mentorship is more than an intentional decision, it’s also a sign of growth and confidence in what I’ve learned. Throughout my involvement in student clubs, even before I held formal leadership positions, I naturally found myself sharing feedback and encouragement with newer members as I gained experience and comfort in my craft over time. I’ve found that mentorship is also an opportunity to refresh and strengthen my foundational skills, and I believe teaching is one of the best ways to learn.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship also matters to me because I know firsthand how difficult it can be to navigate academics and career exploration without guidance. I didn’t have role models or mentors in my field of interest early on, which led me to spend a lot of time feeling uncertain and underutilizing my time in college. I want to help students avoid that experience by giving them direction, structure, and reassurance earlier on.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost importantly, I want to be the mentor I didn’t have, someone who helps students build confidence in their abilities and feel ambitious and invested in their success. I believe my journey can serve as proof that growth is possible with effort and support, and mentorship is one of the most meaningful ways I can give back.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"b259a44a-4355-4e70-99a1-8522862d9d70\"}":{"__typename":"DeepDives","uuid":"b259a44a-4355-4e70-99a1-8522862d9d70","content":"\u003cp\u003eOne thing I’m extremely proud of is my experience on my high school varsity tennis team. From my freshman year, I set a goal to earn a singles position in the starting lineup which is for the top six players on the team. At the time, this felt ambitious. I was only 4’8”, heavily involved in academics, and tennis was a sport where I was naturally at a disadvantage and where success wasn’t directly tied to my academic or career goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI started as the lowest player in the starting lineup, and watched players who joined after me improve faster and surpass me, often with more time to train or more natural athletic ability. I also lost more matches than any other player. It felt like I was in a race toward success where I was sprinting just to keep pace, while others seemed to jog past me. Still, I kept moving toward my goal at my own pace. I practiced up to 15 hours a week, even during the off-season, and focused on refining techniques and workarounds to compensate for my shorter stride.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSlowly, my position improved each year. By my senior year, I earned 4th singles in the lineup. I worked hard to maintain that spot, often playing the longest matches on the team. I ended up ranked within the top 20 players in my region for Sectionals, which was an outcome far beyond my initial goal.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEven though I haven’t picked up a racket since graduating, this experience taught me lasting lessons about perseverance and how far consistent effort can take me, even when the odds aren’t in my favor. I was proud of myself for committing fully to something that didn’t directly serve my academic or professional goals, and for proving to myself that I could follow through on ambitious goals. It showed me that in our race toward success, progress doesn’t always look the same for everyone, and that the only real way to lose is to stop moving forward altogether.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"a97d78ae-24ee-4db8-8768-0be9a61e0954\"}":{"__typename":"DeepDives","uuid":"a97d78ae-24ee-4db8-8768-0be9a61e0954","content":"\u003cp\u003eMy greatest role model is my mom. She is someone who is never afraid to try new things or put herself in uncomfortable situations in order to grow. My mom was born in India and immigrated to the United States in the early 2000s. At the time, she didn’t speak English fluently and wasn’t comfortable with a new culture, but she still worked hard and found a job as a software engineer. When my twin sister and I were born, she then put her career largely on hold for nearly 20 years to raise us.\u003c/p\u003e\u003cp\u003eWhen we left for college, my mom challenged herself to return to her career after years away from a fast-paced, demanding work environment. She joined Amazon and went from a relatively stable 9–5 schedule to 16+ hour workdays, including late nights and weekends, in a high-pressure setting. Even so, she adapted quickly, worked relentlessly, and was recently recognized as a high performer.\u003c/p\u003e\u003cp\u003eWhat inspires me most is that even after achieving this success, she continues to push herself beyond her comfort zone. Despite English being her second language, she decided she wanted to speak on a panel in front of hundreds of coworkers and executives. She took public speaking lessons and signed up, even though she was scared.\u003c/p\u003e\u003cp\u003eMy mom is not a superhero. She doesn’t have infinite bravery, skill, or confidence. She’s just my mom. The same mom who calls me during the day to ask if I’ve eaten breakfast or how to “connect her phone to the car.” But to me, that makes her even more impressive. She shows me that growth doesn’t require fearlessness, just the willingness to try and step outside your comfort zone. Time and time again, she’s taught me that there is no such thing as trying too late, and that learning and growth don’t stop at any age.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"fe743871-4705-437b-a775-a1ce0d3ce067\"}":{"__typename":"School","uuid":"fe743871-4705-437b-a775-a1ce0d3ce067","name":"Shaker High School","city":"Latham","type":"HIGH","state":"New York","country":"United States","zip":"12110"},"Education:{\"uuid\":\"a8e0db5c-7e62-4cde-9c4a-e910fe80808d\"}":{"__typename":"Education","uuid":"a8e0db5c-7e62-4cde-9c4a-e910fe80808d","school":{"__ref":"School:{\"uuid\":\"fe743871-4705-437b-a775-a1ce0d3ce067\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"6047f01e-df80-4cd9-a145-0c1e92a57e58\"}":{"__typename":"Education","uuid":"6047f01e-df80-4cd9-a145-0c1e92a57e58","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Information Science Systems and Technology","degree":null},"MentorPublicProfile:{\"uuid\":\"f1ea6149-bf72-4989-8e34-eeaf47696861\"}":{"__typename":"MentorPublicProfile","uuid":"f1ea6149-bf72-4989-8e34-eeaf47696861","displayName":"Jessica A.","slug":"jessica-andrews","biography":"\u003ch3\u003e\u003cstrong\u003eHi! I’m Jessica 👋\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m a \u003cstrong\u003eCornell University\u003c/strong\u003e student studying \u003cstrong\u003eInformation Science\u003c/strong\u003e with minors in Artificial Intelligence and Data Science, and I’m a multidisciplinary\u003cstrong\u003e product designer\u003c/strong\u003e with experience across UX, research, and front-end development. I am passionate about helping students discover their interests and talents, and turn their strengths into applicable skills, projects, and careers.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGoing into college I actually had no idea what I wanted to do, struggled with impostor syndrome, and spent a long time believing I didn't have the talent, or resources to succeed. Over time, I learned that success isn’t about being extraordinary or lucky, it’s about tactical effort, learning how you work best, and leaning into the strengths you already have. That mindset carried me through Cornell, into leadership roles across design and technology, and eventually to my dream internship at \u003cstrong\u003eCapital One\u003c/strong\u003e.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cblockquote\u003e\u003cp\u003eIf you’re someone who feels unsure about your direction or wonders whether you’re “good enough” to pursue tech or design, I’ve been there, and I might be the right mentor to help you realize and achieve your dreams!\u003c/p\u003e\u003c/blockquote\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI mentor high school students who want support with:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eProduct design passion projects\u003c/strong\u003e (apps, websites, Figma)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePortfolio building and project storytelling\u003c/strong\u003e (case studies, portfolios)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eUX Interview and Recruitment prep\u003c/strong\u003e (portfolio presentations, whiteboard challenges)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege Essay Writing \u003c/strong\u003e(ideation, storytelling, editing)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to mentor\u003c/strong\u003e\u003cbr\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eI have real 0→1 product experience.\u003cbr\u003e\u003c/strong\u003eThrough Hack4Impact, I’ve designed multiple\u003cstrong\u003e \u003c/strong\u003e0→1 products for real nonprofit clients, working from early problem definition through research, ideation, prototyping, and iteration. This means I know how to turn an idea into a scoped, achievable project, and how to guide students through that same process step by step.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eI bring industry-level experience.\u003cbr\u003e\u003c/strong\u003e I’ve completed multiple internships in product and UX, including roles as a Product Design Intern at Capital One and a UX Research Intern at Kenvue (Johnson \u0026amp; Johnson). In these roles, I worked on real enterprise products, collaborated with engineers and researchers, and learned how design decisions are made under real constraints. I help students understand not just how to design, but how design fits into the bigger picture of tech and business.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eI have leadership and mentorship experience.\u003cbr\u003e\u003c/strong\u003eAt Cornell, I’ve served as a design lead across several organizations, including Hack4Impact, CMSX (Cornell’s course management system), and Women in Computing at Cornell (WICC). In these roles, I’ve mentored underclassmen on design thinking, project execution, portfolio development, and career exploration, and I’m comfortable guiding students with different backgrounds and learning styles.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cbr\u003eA typical session\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e\u003cp\u003eA typical session with me involves turning a vague interest into a concrete project with a clear definition of success, creating a realistic step-by-step plan, and receiving thoughtful feedback across milestones.\u003c/p\u003e\u003cp\u003eMy mentorship style is supportive and collaborative, and I focus on helping students build systems and habits that set them up for success in both higher education and future careers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eOutside of mentoring\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of class, I’m deeply involved in my student organizations like Hack4Impact, and my church, and care a lot about building strong, welcoming communities within them. I love reading and watching shows, recently I’ve been into true crime podcasts and watching older Youtubers. My current favorite show is Spy x Family, and Danny Gonzalez is one of my favorite Youtubers. I also played varsity tennis in high school and am slowly getting back into it!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"8vwKTJprRBgvQ3GYRB9WaZnvvG12jWYR202yuDx6JGI00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a9176b3c-f279-456b-a58a-db380ca6955b\"}"},{"__ref":"Favorites:{\"uuid\":\"37ef2e69-506e-4942-8807-c2dd2f42bf31\"}"},{"__ref":"Favorites:{\"uuid\":\"ee75de82-1ebc-40bc-9690-8d3a56e11663\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"d9727aec-a26a-4e36-92a1-7d59e2367ae9\"}"}],"major":"Information Science Systems and Technology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"15159a1e-0f3b-4d31-969e-90ec77ab9aa4\"}"},{"__ref":"DeepDives:{\"uuid\":\"2b2883c1-09f1-423e-aa7c-a0e6c6323837\"}"},{"__ref":"DeepDives:{\"uuid\":\"b259a44a-4355-4e70-99a1-8522862d9d70\"}"},{"__ref":"DeepDives:{\"uuid\":\"a97d78ae-24ee-4db8-8768-0be9a61e0954\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cfd307ac-bec3-40a0-9690-c2161e018957/-/preview/-/format/jpg/","https://ucarecdn.com/f2109105-753a-45fb-ace6-f9dd721c7395/-/preview/-/format/jpg/","https://ucarecdn.com/4c90ffa3-1909-4f41-b789-d9469e59004b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a8e0db5c-7e62-4cde-9c4a-e910fe80808d\"}"},{"__ref":"Education:{\"uuid\":\"6047f01e-df80-4cd9-a145-0c1e92a57e58\"}"}],"hiredAt":"2025-12-11T22:33:05.831Z","topics":["College Essay Writing","Web Design"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"r
