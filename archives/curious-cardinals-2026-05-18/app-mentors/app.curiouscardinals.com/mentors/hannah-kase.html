xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1b326808-1001-4e55-ba40-dcbed92ce2af\"}":{"__typename":"DeepDives","uuid":"1b326808-1001-4e55-ba40-dcbed92ce2af","content":"\u003cp\u003eMentorship matters to me for many reasons, but one of the strongest reasons is that I know I would've benefitted so much from a Curious Cardinals mentor as a high school student. I was a perfectionist and felt a lot of academic pressure, most of which I put on myself. I know there are so many students who can relate to this, and I hope to be the mentor for them that I wish I had.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a14a34ae-510e-4971-803e-5611eb6d45ef\"}":{"__typename":"DeepDives","uuid":"a14a34ae-510e-4971-803e-5611eb6d45ef","content":"\u003cp\u003eMy greatest source of motivation is helping and supporting others! I am truly motivated by the opportunity to help others improve themselves and reach their highest potential, which makes working as a mentor a dream job for me!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"15428b08-faf1-4ff8-a064-07a20205e567\"}":{"__typename":"DeepDives","uuid":"15428b08-faf1-4ff8-a064-07a20205e567","content":"\u003cp\u003eI love spending time outside in nature! I do a lot of running, walking, and hiking. I love playing sports and even played lacrosse on Brown's club team!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"4af54130-e7e6-4c4f-b905-7d2d169ab44e\"}":{"__typename":"School","uuid":"4af54130-e7e6-4c4f-b905-7d2d169ab44e","name":"James Madison High School","city":"Vienna","type":"HIGH","state":"Virginia","country":"United States","zip":"22181"},"Education:{\"uuid\":\"b274c995-e771-4df2-9637-b33db98a5f32\"}":{"__typename":"Education","uuid":"b274c995-e771-4df2-9637-b33db98a5f32","school":{"__ref":"School:{\"uuid\":\"4af54130-e7e6-4c4f-b905-7d2d169ab44e\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"4e725eae-acff-4563-bc7d-c9ba65f577aa\"}":{"__typename":"Education","uuid":"4e725eae-acff-4563-bc7d-c9ba65f577aa","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Public Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"c0ef9afe-16cf-4546-b8a6-ab2cf42d44cc\"}":{"__typename":"MentorPublicProfile","uuid":"c0ef9afe-16cf-4546-b8a6-ab2cf42d44cc","displayName":"Hannah K.","slug":"hannah-kase","biography":"\u003cp\u003eI am passionate about helping students unlock their potential! I have experience working with students of all ages, from kindergarteners through high school seniors. I love working through challenges alongside students and providing encouragement and support that can change someone's trajectory.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI graduated from Brown University, where I studied public policy. During my time at Brown, I worked part-time as a teaching assistant and had my work published in the Brown Undergraduate Law Review. These experiences honed my analytical and writing skills, which form the foundation of much of my academic coaching expertise. I particularly love helping students craft compelling college essays that authentically capture their voice and experiences. Beyond essay writing, I have experience guiding students through their activities sheets and providing holistic support throughout the college admissions process.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy experience is not limited to high school students. I also have over two years of experience providing academic support for elementary and middle school students in math and English. Whether you're a young learner just beginning to read or a high school senior perfecting your Common App essay, I would be excited and honored to work with you. I believe that every student has unique strengths, and I tailor my approach to meet each student where they are while challenging them to grow.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI work on the Family Admissions team at Curious Cardinals, which has given me firsthand insight into the importance of finding the right mentor match. I take this responsibility seriously and am committed to being your biggest cheerleader while also providing honest, constructive feedback to help you improve your work and reach new heights. My goal is to create a supportive, encouraging environment where you feel comfortable taking risks and pushing yourself.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my work at Curious Cardinals, I love spending time outdoors, running, walking, and plunging in the San Francisco Bay. I'm very close with my family and friends and cherish the time we spend together. I also volunteer frequently to provide support for people with intellectual and developmental disabilities and for the elderly community, work that continually reminds me of the power of patience, empathy, and human connection.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to working together and helping you reach your goals!\u003c/p\u003e","teachingVideoPlaybackId":"fOZcZ200CH4GD9oRw401379E01MRvgL1dcDYMFnRUswVLA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Public Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1b326808-1001-4e55-ba40-dcbed92ce2af\"}"},{"__ref":"DeepDives:{\"uuid\":\"a14a34ae-510e-4971-803e-5611eb6d45ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"15428b08-faf1-4ff8-a064-07a20205e567\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/13bc0845-6cf2-4b32-af26-00fba316f66b/-/preview/-/format/jpg/","https://ucarecdn.com/a0be49db-7bfd-4a1e-adc9-505df38dae17/-/preview/-/format/jpg/","https://ucarecdn.com/15daf5a9-e3a7-469c-9bda-c67bef6dbb58/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b274c995-e771-4df2-9637-b33db98a5f32\"}"},{"__ref":"Education:{\"uuid\":\"4e725eae-acff-4563-bc7d-c9ba65f577aa\"}"}],"hiredAt":"2025-12-03T03:15:00.661Z","topics":["Academic Coaching","Creative Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hannah-kase\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c0ef9afe-16cf-4546-b8a6-ab2cf42d44cc\"}"}}},"_sentryTraceData":"773e5ad8edaf42e6bdba13d69af05d88-803683ff0262934e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea1
