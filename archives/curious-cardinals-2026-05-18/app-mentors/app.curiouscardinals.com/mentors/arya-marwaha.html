xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1ed630de-11ab-4971-afe8-b99207ea5747\"}":{"__typename":"Favorites","uuid":"1ed630de-11ab-4971-afe8-b99207ea5747","photoUrl":"https://ucarecdn.com/7d943257-1651-4bd7-8322-250d3c694f67/","title":"Tiger Woods","type":"ATHLETE"},"Favorites:{\"uuid\":\"9d647236-313d-4660-9a27-1e4fbe3dd913\"}":{"__typename":"Favorites","uuid":"9d647236-313d-4660-9a27-1e4fbe3dd913","photoUrl":"https://ucarecdn.com/af7ea19b-458f-4d91-a6c1-ac1555092d1e/","title":"Leonardo DiCaprio","type":"ACTOR"},"Favorites:{\"uuid\":\"6c7404c7-19b2-4f00-ac02-f37fe4d521b4\"}":{"__typename":"Favorites","uuid":"6c7404c7-19b2-4f00-ac02-f37fe4d521b4","photoUrl":"https://ucarecdn.com/5ad3757e-0439-4046-91e2-94a358389687/","title":"All The Lights We Cannot See","type":"BOOK"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e7809727-e4e6-43c9-9eaf-e4b8eeb4d946\"}":{"__typename":"DeepDives","uuid":"e7809727-e4e6-43c9-9eaf-e4b8eeb4d946","content":"\u003cp\u003eMentoring elementary school children at Boys \u0026amp; Girls Clubs, RVing in Big Sur, co-authoring a COVID-19 politicization paper, kiteboarding and whitewater rafting, serving langar at my gurdwara, bonding with Boys Staters across California, recording podcasts with my BFF, designing a Discord tutoring underserved students through YYGS, and teaching myself golf.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"902e75f2-b5fc-4d48-8c28-dcff3f3c6088\"}":{"__typename":"DeepDives","uuid":"902e75f2-b5fc-4d48-8c28-dcff3f3c6088","content":"\u003cp\u003eI founded Essential Education Enterprise, a mentoring initiative aimed at helping underserved students improve their SAT scores by over 250 points. Through engaging podcasts, insightful blog articles, and personalized one-on-one mentoring, I worked to promote education equity and empower students to achieve their academic and personal goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"41946d66-2cf4-490d-b323-bd12f4a6004a\"}":{"__typename":"DeepDives","uuid":"41946d66-2cf4-490d-b323-bd12f4a6004a","content":null,"videoPlaybackId":"QHutx8HbF6wacPENu5ymbrWekT69Opva1PT2hrRKYzs","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"3a169a4e-e3fc-4493-ad17-003c1aa29220\"}":{"__typename":"DeepDives","uuid":"3a169a4e-e3fc-4493-ad17-003c1aa29220","content":"\u003cp\u003eMy greatest role model is Steve Jobs. What inspires me most about him is his ability to create technology that feels deeply personal and accessible. He had a unique talent for blending tech and design in a way that truly enhanced people's lives. Beyond his innovation, his passion for his work and his resilience in the face of challenges are qualities I deeply admire. Jobs' dedication to making technology intuitive and human-centered guides my own approach to AI and design, and his legacy of creativity and determination continues to motivate me every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"9aead645-aa8c-49c1-b353-ef62945462fb\"}":{"__typename":"School","uuid":"9aead645-aa8c-49c1-b353-ef62945462fb","name":"Fairmont Preparatory Academy","city":"Anaheim","type":"HIGH","state":"California","country":"United States","zip":"92801"},"Education:{\"uuid\":\"bf6eefd4-165d-478b-a2a0-5e1ef338f16c\"}":{"__typename":"Education","uuid":"bf6eefd4-165d-478b-a2a0-5e1ef338f16c","school":{"__ref":"School:{\"uuid\":\"9aead645-aa8c-49c1-b353-ef62945462fb\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"36fa265e-cd7c-44f4-8a0b-e2a77987f468\"}":{"__typename":"Education","uuid":"36fa265e-cd7c-44f4-8a0b-e2a77987f468","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Symbolic Systems","degree":null},"MentorPublicProfile:{\"uuid\":\"550f864d-e122-4593-8ec2-b9ccc27e37b5\"}":{"__typename":"MentorPublicProfile","uuid":"550f864d-e122-4593-8ec2-b9ccc27e37b5","displayName":"Arya M.","slug":"arya-marwaha","biography":"\u003cp\u003eHi everyone! I'm Arya Marwaha, a rising junior at Stanford University, studying Symbolic Systems and Design. Growing up in Orange County, California, I developed a deep curiosity about how people think and how we can use technology to improve our lives, which led me to my current studies combining computer science, psychology, and philosophy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, I stay pretty busy but in the best way possible. I love being a part of the Stanford Club Golf team, where I get to unwind and enjoy the sport with friends. I'm also involved with the Stanford Marketing Group and the Stanford Pre-Business Association, working on fun projects that blend tech and marketing. Outside of school, I work part-time at startups, gaining hands-on experience in the world of entrepreneurship and innovation.\u003c/p\u003e\u003cp\u003eWhen I'm not hitting the books or working, I love traveling, weightlifting, and meeting new people. One of my favorite experiences was an 8-week internship in Latvia at a golf technology firm. I got to film some cool marketing videos on a Latvian golf course and traveled to different Eastern European countries on the weekends. This adventure gave me a broader perspective on different cultures and ways of thinking, which I find incredibly enriching.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my proudest moments was founding Essential Education Enterprise, where I mentored underserved students and saw firsthand the impact of education on their lives. It's experiences like these that fuel my passion for teaching and helping others succeed. Whether it's through tutoring, sharing my experiences, or just being a supportive mentor, I find immense joy in helping others learn and grow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm also passionate about human-centered AI and UX design. I believe technology should be designed with people in mind, making it accessible and beneficial to everyone. This philosophy guides my academic and professional pursuits and is something I'm always excited to share and discuss with others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you're considering me as a tutor, know that I'm here to support you not just academically but holistically. I aim to create a learning environment that's engaging, encouraging, and tailored to your needs. Whether you're tackling tough subjects or exploring new interests, I'm here to help you with your passion projects and building yourself as a whole person. Let's learn and grow together!\u003c/p\u003e","teachingVideoPlaybackId":"9ZBt2Gv8302jjPS2t2oYAVSPHiDmGqVP4kGsrcmbUF7A","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1ed630de-11ab-4971-afe8-b99207ea5747\"}"},{"__ref":"Favorites:{\"uuid\":\"9d647236-313d-4660-9a27-1e4fbe3dd913\"}"},{"__ref":"Favorites:{\"uuid\":\"6c7404c7-19b2-4f00-ac02-f37fe4d521b4\"}"}],"causesSupported":[],"major":"Symbolic Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e7809727-e4e6-43c9-9eaf-e4b8eeb4d946\"}"},{"__ref":"DeepDives:{\"uuid\":\"902e75f2-b5fc-4d48-8c28-dcff3f3c6088\"}"},{"__ref":"DeepDives:{\"uuid\":\"41946d66-2cf4-490d-b323-bd12f4a6004a\"}"},{"__ref":"DeepDives:{\"uuid\":\"3a169a4e-e3fc-4493-ad17-003c1aa29220\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8c8bb928-5c44-4461-944c-44a545ccfcc6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"bf6eefd4-165d-478b-a2a0-5e1ef338f16c\"}"},{"__ref":"Education:{\"uuid\":\"36fa265e-cd7c-44f4-8a0b-e2a77987f468\"}"}],"hiredAt":"2024-06-24T16:53:09.135Z","topics":["Coding / Programming","Machine Learning / AI","Web Design","Product Design","STEM Project","Business / Entrepreneurship","Finance / Investing","Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"arya-marwaha\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"550f864d-e122-4593-8ec2-b9ccc27e37b5\"}"}}},"_sentryTraceData":"fe82c29b338c40208581630b113cc41b-9a9ac1b73c3144f5-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12
