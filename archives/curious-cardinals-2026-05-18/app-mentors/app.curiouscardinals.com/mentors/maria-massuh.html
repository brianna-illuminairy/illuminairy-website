xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2efd3497-f409-4e16-9a7c-e6b5886ead56\"}":{"__typename":"Favorites","uuid":"2efd3497-f409-4e16-9a7c-e6b5886ead56","photoUrl":"https://ucarecdn.com/d4415592-9447-4a80-add7-c4b345eb1a4d/","title":"Adam Sandler","type":"ACTOR"},"Favorites:{\"uuid\":\"f92a5f2e-1ee5-4d8a-bdaf-730fbfb336c0\"}":{"__typename":"Favorites","uuid":"f92a5f2e-1ee5-4d8a-bdaf-730fbfb336c0","photoUrl":"https://ucarecdn.com/e9f33412-ba41-48d1-9431-ececd29fdc68/","title":"Mamma Mia","type":"MOVIE"},"Favorites:{\"uuid\":\"e24a8190-419c-4391-a5fd-16d347c83021\"}":{"__typename":"Favorites","uuid":"e24a8190-419c-4391-a5fd-16d347c83021","photoUrl":"https://ucarecdn.com/79d58183-0590-4a46-a0a3-eafe333494af/","title":"Dance","type":"SPORT"},"CausesSupported:{\"uuid\":\"6b88d3c8-85a1-45ce-9c68-ef7c164abda3\"}":{"__typename":"CausesSupported","uuid":"6b88d3c8-85a1-45ce-9c68-ef7c164abda3","name":"Regnum Christi","description":"\u003cp\u003eMiddle School Mentor, Missionary, Retreat Organizer, RC Youth Leader\u003c/p\u003e\u003cbr\u003e","photoUrl":"https://ucarecdn.com/aac582e4-03cc-4ac4-82da-6c3cbb274079/"},"CausesSupported:{\"uuid\":\"45fe776f-d619-4525-ac64-78f9571ed2fd\"}":{"__typename":"CausesSupported","uuid":"45fe776f-d619-4525-ac64-78f9571ed2fd","name":"National Honor Society","description":"\u003cp\u003ePresident, VP, Board Member; raised $95K+, supported 35 orgs, 8,000+ families.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/a8eec671-44ed-4621-bdbc-47d8588d4618/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0fa65e49-2109-4ecc-9779-3db4d12aebb6\"}":{"__typename":"DeepDives","uuid":"0fa65e49-2109-4ecc-9779-3db4d12aebb6","content":"\u003cp\u003eMentorship matters deeply to me because I have experienced both sides of it: first as someone who was guided, and later as someone who had the opportunity to guide others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up in ECyD (Encounters, Convictions, and Decisions), a Catholic youth organization that focuses on forming young people through friendship, mentorship, and personal growth, mentorship was a natural and constant part of my life. As a younger member, I always had older girls who accompanied me, people who took the time to listen, guide me, and help me reflect on challenges in school, friendships, and personal decisions. At that age, having someone who believed in me and cared about my growth made a huge difference in my confidence and sense of direction.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I grew older, I transitioned into mentoring younger girls within ECyD myself. That experience completely changed my perspective. I realized that mentorship is less about giving advice and more about creating a space where someone feels truly heard and supported. Many times, what younger students need most is someone who listens carefully, asks thoughtful questions, and helps them recognize their own abilities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough this experience, I have seen firsthand how powerful mentorship can be. I have watched girls grow more confident, take initiative in their communities, and overcome both academic and personal challenges simply because someone took the time to believe in them and guide them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor me, mentorship creates a cycle of growth: someone invests in you, and that investment inspires you to invest in others. My experience in ECyD showed me that mentorship is not about authority; it is about accompaniment, trust, and helping someone discover their potential and the person they are capable of becoming.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5ec3481c-9cbd-470f-a6f3-5607cb3ad701\"}":{"__typename":"DeepDives","uuid":"5ec3481c-9cbd-470f-a6f3-5607cb3ad701","content":"\u003cp\u003eI chose to study Neuroscience because I have always been fascinated by understanding how the brain shapes the way we think, feel, learn, and make decisions. The brain is the organ through which we experience the world, yet there is still so much we do not fully understand about how it works.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy interest in the brain also grew from my experiences working with others. Through mentoring younger students and leading service initiatives, I became increasingly curious about how people develop confidence, motivation, and resilience. I often found myself wondering what was happening in the brain during moments of learning, stress, or personal growth, and how understanding those processes could help people thrive. Studying neuroscience allows me to explore these questions from a scientific perspective, particularly in areas related to learning, behavior, and mental health.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside this, I chose to pursue a minor in Music Cognition. I have played the piano for most of my life, and music has always been an important part of how I express myself and connect with others. Because of this, I became fascinated by how something as abstract as sound can have such a powerful impact on our emotions, memories, and attention. Music cognition allows me to explore the science behind these experiences and understand how the brain processes and responds to music.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTogether, neuroscience and music cognition allow me to explore both the biological foundations of the mind and the creative ways the brain engages with the world. This combination reflects both my scientific curiosity and my lifelong connection to music.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6fb3d85a-37ed-412f-8250-041f2aa48869\"}":{"__typename":"DeepDives","uuid":"6fb3d85a-37ed-412f-8250-041f2aa48869","content":"\u003cp\u003eIn my spare time, I love doing things that help me connect with others and recharge creatively. Music has always been a big part of my life, I enjoy both listening to music and playing the piano, which I’ve done for most of my life. Playing music is one of the ways I relax and express myself, and it’s something that has stayed with me through different stages of my life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also spend a lot of my free time involved in community service. Giving back to my community has always been important to me, whether that’s organizing initiatives, volunteering, or working on projects that support people who may not have the same opportunities. It’s something that brings me a lot of purpose and fulfillment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I really value spending time with my friends. Whether it’s having meaningful conversations, exploring new places, or simply relaxing together, those moments help me stay balanced and connected to the people who matter most to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"5d20d88a-cdfd-4d72-a258-6a760df08dcb\"}":{"__typename":"DeepDives","uuid":"5d20d88a-cdfd-4d72-a258-6a760df08dcb","content":"\u003cp\u003eOne passion project I developed focused on researching socio-emotional learning (SEL) and how it can better support students with learning differences. I explored different educational approaches that help students build self-awareness, emotional regulation, and confidence in academic settings. My goal was not only to understand the research but to bring those ideas into my school community by promoting a more supportive learning environment where students feel seen, understood, and encouraged to grow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside this project another one that has been very meaningful to me has been my work with children with autism through Fundación Camina Conmigo, where I volunteered in therapy sessions as a youth volunteer. Through this experience, I supported children directly during activities designed to strengthen communication, social interaction, and motor skills. Being part of these sessions helped me see firsthand how patience, empathy, and individualized support can make a powerful difference in a child’s development.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBoth of these experiences reflect a common theme in my interests: understanding how people learn and grow, and finding ways to create environments where every student can feel supported and empowered.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"306e7f0e-3977-4c85-b030-1be6513e4e93\"}":{"__typename":"School","uuid":"306e7f0e-3977-4c85-b030-1be6513e4e93","name":"Colegio Menor San Francisco de Quito","city":"Quito","type":"HIGH","state":"Pichincha","country":"Ecuador","zip":"170157"},"Education:{\"uuid\":\"a23919d6-11f9-418e-a404-8ee3ad3fadc4\"}":{"__typename":"Education","uuid":"a23919d6-11f9-418e-a404-8ee3ad3fadc4","school":{"__ref":"School:{\"uuid\":\"306e7f0e-3977-4c85-b030-1be6513e4e93\"}"},"startYear":"2010","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"522ea063-e2c3-4ba9-b619-5c4353f7d73b\"}":{"__typename":"Education","uuid":"522ea063-e2c3-4ba9-b619-5c4353f7d73b","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Neurosceince","degree":null},"MentorPublicProfile:{\"uuid\":\"7f84ff6b-f648-44d5-b47d-9bedfa8779bf\"}":{"__typename":"MentorPublicProfile","uuid":"7f84ff6b-f648-44d5-b47d-9bedfa8779bf","displayName":"Maria M.","slug":"maria-massuh","biography":"\u003cp\u003eHi, my name is Maria Massuh, and I am a student at Northwestern University studying Neuroscience with minors in Psychology and Music Cognition. I am fascinated by how the brain shapes the way we think, feel, learn, and create, with a particular focus on mental health, human development, and learning. I am driven by the belief that scientific understanding can be applied to better support students and communities, transforming knowledge into meaningful action.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMusic has been one of the deepest influences in my life. I have played the piano for over sixteen years, and through it, I’ve learned discipline, patience, and the power of perseverance. Breaking complex pieces into smaller steps taught me how challenges can be approached methodically and mastered over time. Studying Music Cognition now allows me to explore the science behind this passion: how rhythm, memory, emotion, and creativity intertwine in the brain. Dancing, too, has been a vital form of expression for me, reinforcing the connection between movement, emotion, and learning, and shaping how I approach both science and mentorship: with curiosity, empathy, and joy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy identity is shaped by the intersection of my Ecuadorian and Lebanese heritage. Growing up with these cultures instilled in me a deep appreciation for diverse perspectives, adaptability, and the importance of building bridges between communities. This multicultural lens informs my leadership, communication, and mentorship, encouraging me to connect with people in authentic, inclusive ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eService and leadership have always been central to my journey. In high school, I served as President of the National Honor Society, leading initiatives that raised over $95,000 and provided essential resources to more than 1,300 families. I also founded Sumak Shunko (“Great Hearts”), supporting children and elderly individuals in underserved Indigenous communities in Ecuador through volunteer coordination and direct community engagement. Volunteering with Fundación Camina Conmigo, assisting therapy sessions for children with autism, deepened my interest in neurodiversity and inclusive education. Witnessing the transformative impact of individualized support inspired a passion project researching socio-emotional learning and strategies for schools to support diverse learners.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship has been another cornerstone of my life. Through ECyD, a Catholic youth leadership organization, I experienced firsthand the power of strong mentors and later became one myself, guiding middle and high school students to develop study systems, navigate academic challenges, and build confidence. Creating spaces where students feel heard, supported, and capable of growth has been one of the most meaningful parts of my journey.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy commitment to these values has been recognized through the Goodness, Beauty, and Truth Award, which honors students who demonstrate leadership, empathy, and integrity. Receiving this award was particularly meaningful because it reflected the principles I strive to embody: kindness, perseverance, humility, and a desire to uplift those around me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTravel and global experiences have also shaped who I am. Summers spent in academic and leadership programs in London, Switzerland, and at the National Student Leadership Conference at the University of Michigan expanded my global perspective, enhanced my communication skills, and reinforced my passion for learning from diverse communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the core of everything I do, science, music, mentorship and service, is a belief in the transformative power of education. I am dedicated to helping students realize that learning can be joyful, that challenges can become opportunities, and that guidance and encouragement can unlock potential. As a mentor, I aim to create supportive, inspiring environments where students feel empowered to explore, ask questions, and develop confidence in themselves.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I am driven by a single, guiding purpose: to understand people more deeply and to use that understanding to foster environments where others feel supported, inspired, and capable of reaching their full potential.\u003c/p\u003e","teachingVideoPlaybackId":"Z4029Bg02O01NMD6Jffj48ujP01PWV8UIzCcIP802d1Mv53Q","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I am most proud of is receiving the Goodness, Beauty, and Truth Award at my school. This award is given to a student who embodies the founding values of the institution: goodness through empathy and service to others, beauty through actions that positively impact the community, and truth through integrity, leadership, and a strong commitment to one’s principles. It recognizes not only academic excellence but also the character and influence a student has on the people around them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat made this recognition particularly meaningful to me was how my teacher described the qualities she saw in me. She spoke about the way I approach each day with enthusiasm and a genuine love for learning, and how I try to bring positivity and peace into the classroom environment. I have always believed that small actions (listening to a friend, encouraging someone who is struggling, or approaching challenges with patience) can shape the atmosphere of a community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eShe also highlighted something that has always been important to me: being honest about my convictions while still respecting others. I believe that standing for what you believe in should never mean disregarding someone else’s perspective. Instead, it should invite thoughtful conversation, mutual respect, and growth. I try to live by this idea every day: remaining true to my values while also being open to learning from those around me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eReceiving this award reminded me that leadership is not only about achievements but also about the way we treat others and the example we set. I strive to approach challenges with humility, persistence, and gratitude, always trying to support those around me and contribute positively to my community. For me, the values of goodness, beauty, and truth are not simply ideals; they are principles I hope to live by and share with others throughout my life.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"2efd3497-f409-4e16-9a7c-e6b5886ead56\"}"},{"__ref":"Favorites:{\"uuid\":\"f92a5f2e-1ee5-4d8a-bdaf-730fbfb336c0\"}"},{"__ref":"Favorites:{\"uuid\":\"e24a8190-419c-4391-a5fd-16d347c83021\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6b88d3c8-85a1-45ce-9c68-ef7c164abda3\"}"},{"__ref":"CausesSupported:{\"uuid\":\"45fe776f-d619-4525-ac64-78f9571ed2fd\"}"}],"major":"Neurosceince","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0fa65e49-2109-4ecc-9779-3db4d12aebb6\"}"},{"__ref":"DeepDives:{\"uuid\":\"5ec3481c-9cbd-470f-a6f3-5607cb3ad701\"}"},{"__ref":"DeepDives:{\"uuid\":\"6fb3d85a-37ed-412f-8250-041f2aa48869\"}"},{"__ref":"DeepDives:{\"uuid\":\"5d20d88a-cdfd-4d72-a258-6a760df08dcb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2167fce2-0d78-429b-8941-49a733beb47f/-/preview/-/format/jpg/","https://ucarecdn.com/e5889bea-5f03-4810-8921-60936fa8911f/-/preview/-/format/jpg/","https://ucarecdn.com/9adcacfd-a823-49c1-b48e-6fad25352a54/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a23919d6-11f9-418e-a404-8ee3ad3fadc4\"}"},{"__ref":"Education:{\"uuid\":\"522ea063-e2c3-4ba9-b619-5c4353f7d73b\"}"}],"hiredAt":"2026-03-01T14:54:43.255Z","topics":["Pre-Algebra","Algebra I","K-5 Grade Math","6-8 Grade Science","Chemistry","Spanish","Academic Coaching","Executive Function","Music","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maria-massuh\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7f84ff6b-f648-44d5-b47d-9bedfa8779bf\"}"}}},"_sentryTraceData":"663fa92876a5473bb306cf80c33c9863-b44b8e17ab0f360f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=663fa92876a5473bb306cf80c33c9863,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"maria-massuh"},"buildId":"ZAcrs1
