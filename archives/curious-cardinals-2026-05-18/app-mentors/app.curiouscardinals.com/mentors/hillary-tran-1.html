owering relationship that fosters open-mindedness, kindness, and empathy. For the mentor, it’s heartwarming to provide perspectives that can shape how someone navigates their life, especially those who used to be in a position you were in. For the mentee, it’s reassuring to have a trusted person to turn to for guidance, open conversation, and good ol' friendship!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"125f60a3-6219-4861-978e-98d303015573\"}":{"__typename":"DeepDives","uuid":"125f60a3-6219-4861-978e-98d303015573","content":"\u003cp\u003eA dream of mine that I hope to turn into a reality soon is to curate a uniquely themed restaurant experience, from all the physical design elements to the food and beverage offerings.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8c9e5fc3-58d1-4be1-a202-e4356a7d7afb\"}":{"__typename":"DeepDives","uuid":"8c9e5fc3-58d1-4be1-a202-e4356a7d7afb","content":"\u003cp\u003eI love to dabble! Some standout interests include cooking up a storm in the kitchen, keeping my fitness game in check via lifting and running, and engaging in diverse forms of arts, cultures, and literature.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"22ecdd1a-852a-403d-9fb4-7af5324b185e\"}":{"__typename":"School","uuid":"22ecdd1a-852a-403d-9fb4-7af5324b185e","name":"Mark Keppel High
