id\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"acf6d4dd-06f6-4d96-baa9-4a8be5392a2e\"}":{"__typename":"DeepDives","uuid":"acf6d4dd-06f6-4d96-baa9-4a8be5392a2e","content":null,"videoPlaybackId":"2VRD8eTNXm01YUNDoJ902JYUJ8tpK3Zn3VxVE0236Zdy1o","question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"82462cdc-a6d8-4082-91c0-881bc37dc2cb\"}":{"__typename":"DeepDives","uuid":"82462cdc-a6d8-4082-91c0-881bc37dc2cb","content":null,"videoPlaybackId":"RnqX6hZ2X9IK01ESQ93Nl6jKoB1xNXRa1hjdouowXlKU","question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"35e631a0-7d6f-44f6-a9a7-7aad011684e8\"}":{"__typename":"School","uuid":"35e631a0-7d6f-44f6-a9a7-7aad011684e8","name":"Parkway West High School","city":"Ballwin","type":"HIGH","state":"Missouri","country":"United States","zip":"63011"},"Education:{\"uuid\":\"7010c13d-6292-4c17-8ddf-f80e9f3f749e\"}":{"__typename":"Education","uuid":"7010c13d-6292-4c17-8ddf-f80e9f3f749e","school":{"__ref":"School:{\"uuid\":\"35e631a0-7d6f-44f6-a9a7-7aad011684e8\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"aec82aa3-376c-4492-b605-e26c9e4b3761\"}":{"__typename":"Education","uuid":"aec82aa3-376c-4492-b605-e26c9e4b3761","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"History","degree":null},"Testimonial:5c61fcf4-24f1-433e-904d-f93e81ae4ffd":{"__typename":"Testimonial","id":"5c61fcf4-24f1-433e-904d-f93e81ae4ffd","text":"My son's weekly meeting with Santi is the one activity that he never complains about attending. Santi does so much work to prepare for these conversations and ensure that the topic is engaging and interesting to my son. At the same time, he subtly encourages my son to improve on skills that he hates working on in school. Chatting with my son about what he has learned with Santi is one of the highlights of the week!","date":"2025-05-30 04:37:52.973+00","rating":5,"endorser":{"__typename":"Endorser","name":"Mary Ku","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"658d1a21-a856-4167-abcd-c89d2155272c\"}":{"__typename":"MentorPublicProfile","uuid":"658d1a21-a856-4167-abcd-c89d2155272c","displayName":"Santiago L.","slug":"santiago-lugo","biography":"\u003cp\u003e\u003cstrong\u003eAs a mentor, I bring a powerful blend of intellectual rigor and real-world experience, helping students sharpen their analytical thinking, elevate their writing, and connect their academic passion to meaningful action. I guide students in building clarity, purpose, and confidence, equipping them with the tools to think critically, express themselves persuasively, and navigate their future with intention.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeneath the stamps in my passport, my real journey has always been about understanding the world and finding my place within it. Born in Bogotá to a Colombian mother and a Mexican father, I grew up navigating multiple languages, cultures, and identities. I have called Mexico City, Budapest, St. Louis, Palm Springs, and New Haven home. Beyond the geography, I have long carried something deeper: a desire to understand the invisible structures that shape our lives. That desire led me to history.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, where I study History and Philosophy, I approach history as a way of thinking and a call to action. History reveals how the world came to look as it does, but it also resurrects the ambitions and dreams of those who dared to imagine something different. In one of my most formative courses, \u003cem\u003eThe Ends of History\u003c/em\u003e, taught by Professor Samuel Moyn, I grappled with the philosophical power of historical inquiry and how it shapes moral imagination and fuels political transformation. As a research assistant for Professor Jennifer Klein at Yale, I analyzed how coerced labor built the environmental and economic systems of Louisiana. As an intern for the  Gilder Lehrman Institute of American History's Hamilton Education Progoram, I witnessed the emotional power of education while supporting Title I students and organizing conversations between young people and \u003cem\u003eHamilton\u003c/em\u003e cast members who use creative expression as a way of reclaiming history.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile history sharpened my mind, public service grounded my commitment. In the offices of Congresswoman Rosa DeLauro and now Congressman Raul Ruiz, I worked directly with constituents, managed casework on immigration and Social Security, and supported outreach grounded in empathy and action. These experiences deepened my understanding of how power operates across legislation, community, and identity. As a Latino who grew up as one of the only Spanish-speaking students in a Missouri public school, I carry this work personally. I know how much representation and guidance matter. I bring that urgency to every student I mentor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI help students think clearly, write with purpose, and connect the dots between their passions and the world’s needs. I meet them where they are and help them develop the intellectual precision, self-understanding, and strategic tools to take their ideas further. Ultimately, the most important journey is not the one that spans continents but the one toward self-understanding. I’m here to help students along that path.\u003c/p\u003e","teachingVideoPlaybackId":"TSYpJeDKDCu7w9R9TTnaX01rRaCmsCRycH4Wb8OU6vzw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e7fcb305-817d-43f4-b4c0-1723aac809ee\"}"},{"__ref":"Favorites:{\"uuid\":\"4351ae12-e354-4a36-92b1-1acc4c5ed6c7\"}"},{"__ref":"Favorites:{\"uuid\":\"a6531902-8d9c-43ff-97b8-fc2fdb465180\"}"}],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0e83a4d6-c6ac-4838-ae56-1f7cfc6ca063\"}"},{"__ref":"DeepDives:{\"uuid\":\"f056bd1d-0dd2-49db-bb0f-147870574dba\"}"},{"__ref":"DeepDives:{\"uuid\":\"acf6d4dd-06f6-4d96-baa9-4a8be5392a2e\"}"},{"__ref":"DeepDives:{\"uuid\":\"82462cdc-a6d8-4082-91c0-881bc37dc2cb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4f108054-5b78-4b12-bdd3-e88b92c5825a/-/preview/-/format/jpg/","https://ucarecdn.com/184583fc-c9a1-406f-8a46-441e50609db7/-/preview/-/format/jpg/","https://ucarecdn.com/73f5e6d9-7258-4a7a-b43f-4c104c22a0c6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7010c13d-6292-4c17-8ddf-f80e9f3f749e\"}"},{"__ref":"Education:{\"uuid\":\"aec82aa3-376c-4492-b605-e26c9e4b3761\"}"}],"hiredAt":"2024-09-10T09:55:53.540Z","topics":["Video / Photography","History Project","Visual Arts / Graphic Design","Film / Theater","Philosophy","Race \u0026 Ethnicity","Law / Government / Policy","World Cultures","Public Speaking","Debate","Writing","College Essay Writing","History","Geography","Spanish","Journalism"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:5c61fcf4-24f1-433e-904d-f93e81ae4ffd"}]},"ROOT_QUERY":{"__typename":"Query","mento
