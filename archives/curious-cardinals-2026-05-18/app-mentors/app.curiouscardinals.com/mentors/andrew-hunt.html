xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"95f56a80-6ecd-4ed5-974d-6c3f443ebc39\"}":{"__typename":"School","uuid":"95f56a80-6ecd-4ed5-974d-6c3f443ebc39","name":"Ladue Horton Watkins High School","city":"St. Louis","type":"HIGH","state":"Missouri","country":"United States","zip":"63124"},"Education:{\"uuid\":\"4303b7ec-9c87-47ab-a1f9-19a9b2e983d8\"}":{"__typename":"Education","uuid":"4303b7ec-9c87-47ab-a1f9-19a9b2e983d8","school":{"__ref":"School:{\"uuid\":\"95f56a80-6ecd-4ed5-974d-6c3f443ebc39\"}"},"startYear":"2016","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"450f23f5-58e4-444e-96ab-1f6417903f7a\"}":{"__typename":"Education","uuid":"450f23f5-58e4-444e-96ab-1f6417903f7a","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Computer Science \u0026 Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"a870689c-8bac-4c7f-bf17-200512c43a93\"}":{"__typename":"MentorPublicProfile","uuid":"a870689c-8bac-4c7f-bf17-200512c43a93","displayName":"Andrew H.","slug":"andrew-hunt","biography":"\u003cp\u003eHi! My name is Andrew, originally from St. Louis, MO, and a recent graduate of Dartmouth College with Bachelors degrees in Computer Science and Electrical Engineering. I am an inquisitive individual who loves examining the complex systems, both natural and manmade, that dictate the way our incredible world functions. I genuinely believe that breakthrough and achievement come from a desire to investigate the way things work, and that motivation to discover and understand is vital to developing as a well rounded human being.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my time studying at Dartmouth, I was fortunate to be a part of implementing multiple complex engineering projects, including a hobby sharing software application, integrated data logging system for the Dartmouth Formula Racing team, and a digital tabletop marble maze for which we were awarded \"Best Overall Implementation\". Additionally, I am greatly appreciative of the learning opportunities I received outside of STEM classes, in which I studied the language, music, religion, and history of many cultures all over the world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile at Dartmouth, I held employment as a teaching assistant for introductory Computer Science, as well as an individual tutor for the Mathematics department. Through these positions I gained valuable experience in distilling challenging subject material to create intuitive and well-structured lesson plans to facilitate learning and share my passion for the subjects. I also served as a mentor with a club called \"OLE,\" a part of the Dartmouth Center for Social Impact. This program entailed leading middle and high school students from local school districts on afterschool outdoor activities like sledding, hiking, and canoeing. My time working with OLE was one of the most fulfilling pieces of my college experience, and I am passionate about continuing to build personal connections with mentees through Curious Cardinals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy all things outdoors, especially hiking, fishing, and surfing. I am also a music lover, with a special affinity for rock and bluegrass. When not listening, I find joy in playing my own (amateur) renditions of my favorite songs on the guitar. Sports are another hobby of mine, from playing pickup basketball or soccer, to watching professional and college games. Additionally, I love to cook, and have done so professionally as a line cook, making burgers and breakfast at The Nest in Hanover, NH.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science \u0026 Electrical Engineering","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/b9db251e-3969-4e1a-803c-914de02ccc0d/-/preview/-/format/jpg/","https://ucarecdn.com/2eb1edad-f22d-4222-8328-5e17291cd441/-/preview/-/format/jpg/","https://ucarecdn.com/68fa3a2d-a7cd-4e9e-8338-f1fbf3fead7b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4303b7ec-9c87-47ab-a1f9-19a9b2e983d8\"}"},{"__ref":"Education:{\"uuid\":\"450f23f5-58e4-444e-96ab-1f6417903f7a\"}"}],"hiredAt":"2024-04-26T08:27:22.720Z","topics":["Robotics / Electronics / CAD","Coding / Programming","Web Design","Physics","Algebra I","Algebra II","K-5 Grade Math","Calculus","Geometry","Pre-Algebra","Precalculus / Trigonometry","Statistics","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"andrew-hunt\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a870689c-8bac-4c7f-bf17-200512c43a93\"}"}}},"_sentryTraceData":"804dea672a7a4688af0f31f9aea535ab-833dea613af608e3-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=804dea672a7a4688af0f31f9aea535ab,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"andrew-hunt"},"buildId":"ZAc
