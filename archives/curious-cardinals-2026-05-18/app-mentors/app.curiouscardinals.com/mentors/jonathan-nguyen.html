xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"afed1805-b852-4758-8528-f1f28c2944a9\"}":{"__typename":"Favorites","uuid":"afed1805-b852-4758-8528-f1f28c2944a9","photoUrl":"https://ucarecdn.com/bca15f7d-dd53-4f63-a2be-66f558264cd6/","title":"Jake Gyllenhaal","type":"ACTOR"},"Favorites:{\"uuid\":\"6a8e2082-17b2-4107-84e2-50979ef0823e\"}":{"__typename":"Favorites","uuid":"6a8e2082-17b2-4107-84e2-50979ef0823e","photoUrl":"https://ucarecdn.com/1952f5b6-a1ba-4a29-a207-d81774449a9b/","title":"Submarine","type":"ALBUM"},"Favorites:{\"uuid\":\"bb03d740-b9d1-4120-9cf9-171adeb9dd39\"}":{"__typename":"Favorites","uuid":"bb03d740-b9d1-4120-9cf9-171adeb9dd39","photoUrl":"https://ucarecdn.com/2fefefc5-43bd-478e-a7b7-f1b6320a63dd/","title":"The Marías","type":"ARTIST"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"84a7bcec-d6b6-4617-9eb0-776ff1d86a9f\"}":{"__typename":"DeepDives","uuid":"84a7bcec-d6b6-4617-9eb0-776ff1d86a9f","content":"\u003cp\u003eI chose to major in Electrical and Computer Engineering because I believe that these fields of engineering are the fastest growing sectors of society. The legacy I want to leave behind is one of technological advancement with simultaneous benefits to society and the Earth. I love to create new or improve on current applications. Approaching problems analytically and deconstructing systems for a better understanding is a method I try to apply to my everyday life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"201ce08d-42d2-4a63-9299-8a5b543520d1\"}":{"__typename":"School","uuid":"201ce08d-42d2-4a63-9299-8a5b543520d1","name":"Yvonne A. Ewell Townview Center","city":"Dallas","type":"HIGH","state":"Texas","country":"United States","zip":"75203"},"Education:{\"uuid\":\"3ce29c8f-5331-4f4b-92f8-dc10e56b7860\"}":{"__typename":"Education","uuid":"3ce29c8f-5331-4f4b-92f8-dc10e56b7860","school":{"__ref":"School:{\"uuid\":\"201ce08d-42d2-4a63-9299-8a5b543520d1\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"c2f8953d-02e4-49b3-bd4f-6f64982fdd5c\"}":{"__typename":"Education","uuid":"c2f8953d-02e4-49b3-bd4f-6f64982fdd5c","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"559c8cd2-2f52-481e-b733-992b7d208bb4\"}":{"__typename":"MentorPublicProfile","uuid":"559c8cd2-2f52-481e-b733-992b7d208bb4","displayName":"Jonathan N.","slug":"jonathan-nguyen","biography":"\u003cp\u003eHi! I'm Jonathan, a second year Electrical and Computer Engineer studying at Cornell University. I have a strong passion for technological innovation and sustainability, and I aspire to be an engineer that contributes meaningfully to the betterment of society. Originally from Dallas, Texas, I am a first-generation student. My journey to Cornell was one of hard work that required work outside of my comfort zone so that I could pursue my goals that at the time seemed unrealistic and infeasible. Because of that experience, I care deeply about helping others build confidence in accomplishing what they can sometimes feel overwhelming at first. I know firsthand how important having guidance through the hurdles of applying to college, starting passion projects, and overall school work is and I am happy to have the opportunity to provide that kind of support I once wished I had.\u003c/p\u003e\u003cp\u003eAcademically, I focus on circuits, digital logic, and embedded systems. Through my project team, Hyperloop, I am able to pursue my passions with hands-on electrical/computer engineering experience to create a magnetic levitation pod. With this work, I hope to be a stepping stone in innovative transportation technology that will make traveling more efficient and sustainable. I’m also in a lab to assist in the development and testing of embedded systems and robotic platforms for swarm robotics research. Right now, I am working on developing collaborative double-tailed SAW robots that utilize their appendages to manipulate materials.\u0026nbsp;\u003c/p\u003e\u003cp\u003eBesides engineering, I am also a part of the Salsa Pa’lante and Cornell Lion Dance clubs so I spend a good portion of my free time dancing, which I value as a source of expression and community connection. I love to play intramural sports, especially volleyball and I usually go to open gym. I also tutor students and facilitate academic workshops which has strengthened my ability to communicate complex ideas in a clear way.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI value persistence, curiosity, and open-mindedness with the belief that with the right support, challenging subjects or projects can be manageable and even more enjoyable. As a mentor, I am focused on building confidence and providing that much needed support to students who need extra investment into their growth. I am excited to work with you and I promise to bring dedication and genuine investment to your success!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"veZ4iaDsYnpFnSZpAbAPRtGkq00Ewvtc01ENyePq00omzQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__r
