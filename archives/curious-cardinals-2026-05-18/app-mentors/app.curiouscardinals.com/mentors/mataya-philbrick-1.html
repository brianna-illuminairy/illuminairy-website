rofile:{\"uuid\":\"2d0e9088-3346-4b5b-ae53-3dec7e0f43d4\"}":{"__typename":"MentorPublicProfile","uuid":"2d0e9088-3346-4b5b-ae53-3dec7e0f43d4","displayName":"Mataya P.","slug":"mataya-philbrick-1","biography":"\u003cp\u003eHi! My name is Mataya and I’m a recent graduate from Harvard University where I studied Linguistics and Romance Languages and Literature. I’m passionate about law and educational advocacy and a lot of my work in college centered on the local Haitian community in Boston. I grew up in Brewer, Maine, which is a smaller town next to Bangor and much of my childhood was spent outdoors, hiking, kayaking, and camping with my family. I still love being outdoors and exploring the world around me. I’ll always be a Mainer at heart :)\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLiving in Maine, I also grew to love language, particularly French, from working with the local francophone community, which is why I decided to study language in college. I know French, Italian, and Haitian, and I’m learning Mandarin Chinese. I enjoy research, and the process of exploring and discovering something new about the world around me. In college, I worked as an RA in the\u0026nbsp; Snedeker Lab for Childhood Development before starting my own project on Haitian Creole bilinguals and bilingual education, examining the intersections between race, language, and education advocacy. In the future, I dream to continue this work, attending law-school and working in policy reform. Another one of my passions is for art and design. I was the manager of the Dunster (Roll Meese!) Art Room and started my own fashion magazine with friends, called The Lavender Room, where we featured the artistic talents and history of other POC designers.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor fun I love reading, sometimes classical literature, but often YA ‘novels’; being outdoors; video games, especially The Legend of Zelda; and
