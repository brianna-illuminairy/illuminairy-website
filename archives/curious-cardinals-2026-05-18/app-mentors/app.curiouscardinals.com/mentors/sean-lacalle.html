w quickly I can get them done!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4acb189e-1e6c-462e-a396-093faadf5610\"}":{"__typename":"DeepDives","uuid":"4acb189e-1e6c-462e-a396-093faadf5610","content":"\u003cp\u003eI would love to start a school. As an education studies minor, I have learned about how much a good education matters to anyone's success, especially in areas with limited resources. So I would love to break that divide and be the one to provide resources and opportunities to people who need them most through a school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"20e8b6f5-4883-4e44-9610-356c9a2b5a6e\"}":{"__typename":"DeepDives","uuid":"20e8b6f5-4883-4e44-9610-356c9a2b5a6e","content":"\u003cp\u003eI am most motivated by working with other motivated people. I match the energy of whoever I am around. So if I am working with someone who is incredibly driven, I will also be incredibly driven. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"63e99cde-220b-47e8-8104-029bcb51b709\"}":{"__typename":"DeepDives","uuid":"63e99cde-220b-47e8-8104-029bcb51b709","content":"\u003cp\u003eI am most proud of the person I have become. I am an incredibly happy person who is always smiling. I'm very extroverted. And I'm very considerate of others. My mom really did raise me right. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"a8b0e720-3aac-4022-b186-69ca27ee6aef\"}":{"__typename":"School","uuid":"a8b0e720-3aac-4022-b186-69ca27ee6aef","name":"Westfield High School","city":"Chantilly","type":"HIGH","state":"Virginia","country":"United States","zip":"20151"},"Education:{\"uuid\":\"27143fab-90f0-405c-8f49-a4c12f142c60\"}":{"__typename":"Education","uuid":"27143fab-90f0-405c-8f49-a4c12f142c60","school":{"__ref":"School:{\"uuid\":\"a8b0e720-3aac-4022-b186-69ca27ee6aef\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"424f3e7a-b2aa-4ffb-aa2a-2a2243347e5e\"}":{"__typename":"Education","uuid":"424f3e7a-b2aa-4ffb-aa2a-2a2243347e5e","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics \u0026 Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"9a595380-e276-46fd-a700-26101931273e\"}":{"__typename":"MentorPublicProfile","uuid":"9a595380-e276-46fd-a700-26101931273e","displayName":"Sean L.","slug":"sean-lacalle","biography":"\u003cp\u003eHowdy you all! My name is Sean and I am a Sophomore at Yale University studying economics and political science from Virginia.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was predominantly a political science focused student. I created my own passion project that intersected my interests between political science and environmental issues that helped inform Virginian's votes in the 2023 Virginia Midterm Elections. My approach would mirror how I’d approach mentee’s passion project. We would work on finding your interests, where they intersect, and how to use that intersection to create a project that leaves a positive impact.\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn high school, I also competed nationally in several competitions with my most notable achievement being placing 3rd in the National Economics Exam.\u003cbr\u003e\u003cbr\u003eBeyond political science and economics in high school, I was an Eagle Scout and participated in the State Department's NSLI-Y program which was an all inclusive scholarship to study the Korean Language in South Korea.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eSince coming to college, I have chosen to focus extracurricularly on what makes me happy. So I am a business manager for America's oldest humor magazine- The Yale Record- and I work with a New Haven Homeless Shelter on how to raise money through grants. \u003c/p\u003e\u003cp\u003e\u003cbr\u003eFor fun, I watch every single Green Bay Packers game and I love watching just about any sport. I am passionate about fitness and I go to the gym 6 times a week since my junior year of high school. I also  spent way too much of my most recent summer playing pickleball, averaging around 10+ hour a week of pickleball last summer (I did keep track). \u003cbr\u003e\u003cbr\u003eBeyond sports, I play the New York Times Sudoku every day and love playing strategic board and card games. Most importantly, I love knitted sweaters too much for my own good. \u003c/p\u003e\u003cbr\u003e\u003cp\u003ePersonality wise I am a very smiley guy with a lot of energy and love working with other people who feel excitement about whatever we are working on.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI currently tutor students in writing which has taught me how to approach mentoring and tutoring students. My approach generally revolves around assessing student needs through looking at student performance and listening to them, and devising an executable timeline to accomplish whatever goal we have in mind.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to mentoring you all especially if you have finance/economics or political science aspirations in college.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"vo5aHNLKg1wybhFfTNIwIkIbMgEwLn011Er7u9pvnY1c","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'm most proud of being able to support my friends in times of emotional need. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"4313d70e-b103-41ed-9c5d-74e50fb6a91b\"}"},{"__ref":"Favorites:{\"uuid\":\"44a9287e-0668-42c5-84d4-1bf615f0ff67\"}"},{"__ref":"Favorites:{\"uuid\":\"a91b9a81-b13b-4179-877e-f5a2932524ff\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6e52eb9f-541b-47be-936d-565dd954044f\"}"}],"major":"Economics \u0026 Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"39738472-eea2-49ee-a2ed-e6eac3de80cc\"}"},{"__ref":"DeepDives:{\"uuid\":\"4acb189e-1e6c-462e-a396-093faadf5610\"}"},{"__ref":"DeepDives:{\"uuid\":\"20e8b6f5-4883-4e44-9610-356c9a2b5a6e\"}"},{"__ref":"DeepDives:{\"uuid\":\"63e99cde-220b-47e8-8104-029bcb51b709\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/66aceddf-af5c-40e5-95cf-6ad0cd7fe6e0/-/preview/-/format/jpg/","https://ucarecdn.com/e3d483b8-c919-4a9e-a09f-43df316e8121/-/preview/-/format/jpg/","https://ucarecdn.com/53200b0d-7525-4b40-8787-d7db740e026a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"27143fab-90f0-405c-8f49-a4c12f142c60\"}"},{"__ref":"Education:{\"uuid\":\"424f3e7a-b2aa-4ffb-aa2a-2a2243347e5e\"}"}],"hiredAt":"2025-12-22T20:47:01.011Z","topics":["Algebra I","Pre-Algebra","Geometry","K-5 Grade Math","Algebra II","Writing","Academic Coaching",
