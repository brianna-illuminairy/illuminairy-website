xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c96e75bb-8bf2-4725-82b7-9e12a07d8f50\"}":{"__typename":"Favorites","uuid":"c96e75bb-8bf2-4725-82b7-9e12a07d8f50","photoUrl":"https://ucarecdn.com/d98f89da-c4d3-48f3-ba44-a8bc2142c3ab/","title":"Capital Cities","type":"ARTIST"},"Favorites:{\"uuid\":\"31725ee3-7e63-4b96-adc8-5c72bc790091\"}":{"__typename":"Favorites","uuid":"31725ee3-7e63-4b96-adc8-5c72bc790091","photoUrl":"https://ucarecdn.com/4c89a7e7-ed78-47b8-8ab7-768aafb498f8/","title":"VALORANT","type":"GAME"},"Favorites:{\"uuid\":\"66a2fccf-63cd-430b-a3fc-03b8cc0a9b38\"}":{"__typename":"Favorites","uuid":"66a2fccf-63cd-430b-a3fc-03b8cc0a9b38","photoUrl":"https://ucarecdn.com/e644f795-2fa9-4fbb-9369-e22980123663/","title":"Your Name","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"aee6d100-43c5-4fd9-a189-52124c274c91\"}":{"__typename":"DeepDives","uuid":"aee6d100-43c5-4fd9-a189-52124c274c91","content":"\u003cp\u003eOne piece of advice I would give my middle or high school self is: take it easy and trust the process. I was a very anxious student who would often feel overwhelmed before exams, not because I hadn’t prepared, but because I lacked confidence in myself. I would complete every task on my to-do list and study diligently, yet I constantly questioned my abilities and scrutinized every small mistake. Looking back now, I realize that much of that pressure came from my own internal expectations rather than reality.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs an older version of myself, I would remind my younger self that growth is gradual and that consistency matters more than perfection. I have learned that performance improves significantly when we replace negative self-talk with constructive and encouraging thoughts. Confidence is not something you wait to have before trying; it is something you build through repeated effort, small wins, and patience with yourself. I would tell my younger self that setbacks are part of the learning process and not a reflection of personal worth or intelligence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would also emphasize the importance of balance — taking breaks, celebrating progress, and understanding that learning is not a race. Over time, I discovered that curiosity and genuine enjoyment of learning lead to far deeper understanding than studying purely out of fear or pressure. Trusting the process means believing that sustained effort will compound, even when results are not immediately visible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost importantly, I would encourage my younger self to be kinder to herself. The same discipline and determination that once fueled anxiety eventually became strengths when paired with self-compassion and perspective. Learning to manage stress, believe in my capabilities, and approach challenges with a growth mindset has been one of the most valuable lessons of my journey — and it’s advice I wish I had embraced much earlier.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"632d8268-8b69-4352-a8d7-86a51e7bee04\"}":{"__typename":"DeepDives","uuid":"632d8268-8b69-4352-a8d7-86a51e7bee04","content":"\u003cp\u003eMentorship matters to me because I see it as being a lighthouse for the next generation. Academic journeys can feel overwhelming — like sailing through a sea of self-doubt, confusion, and endless information — and many students struggle not because they lack ability, but because they lack direction and confidence. A mentor provides that steady light: guidance, reassurance, and clarity when students feel lost.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI value mentorship because it allows me to combine my passion for academics with my desire to help others grow. From an objective standpoint, I enjoy identifying the specific areas where students struggle most and breaking down concepts in ways that make them feel approachable and achievable. Seeing a student move from frustration to understanding is incredibly rewarding.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond grades or performance, mentorship is about empowering students to believe in their own potential. I want to help students develop confidence, critical thinking, and a genuine curiosity for learning so they can overcome challenges independently in the future. Ultimately, mentorship is my way of contributing to a future where students feel supported, capable, and equipped to build lives and opportunities that are even greater than those before them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"96f454ec-78fa-4b2b-9a1c-1e69ec7d1f0e\"}":{"__typename":"DeepDives","uuid":"96f454ec-78fa-4b2b-9a1c-1e69ec7d1f0e","content":"\u003cp\u003eAs a high school student, I was attentive, disciplined, and highly involved both academically and extracurricularly. I made it a priority to stay ahead of assignments to manage my time effectively and avoid deadline pressure. Beyond academics, I was deeply engaged in school activities and leadership. As a member of the student council, I helped coordinate events with external organizations, contributed to creative tasks such as designing invitation cards, painting event props, editing videos, and working on the annual school magazine.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was also an active participant in the Duke of Edinburgh’s Award program, where I engaged in meaningful community service. This included volunteering at the Baptist Church School for the Blind, where we cheered on students to showcase their musical talents, and working with the Acid Survivors Foundation, where I helped teach drawing and coloring as a form of creative therapy. These experiences shaped my sense of responsibility, empathy, and teamwork, while strengthening my confidence and leadership skills early on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"b9f53c71-b70a-4bcd-90b7-745327378d28\"}":{"__typename":"DeepDives","uuid":"b9f53c71-b70a-4bcd-90b7-745327378d28","content":"\u003cp\u003eMy greatest source of motivation is my younger 11-year-old brother. I strive to be a positive role model for him by pursuing excellence in my education, career, and personal growth. Knowing that he looks up to me pushes me to stay disciplined, resilient, and focused on long-term goals. I want to build a career that not only fulfills me intellectually but also allows me to support and empower him to pursue his own dreams with confidence. Ultimately, my motivation comes from the responsibility I feel to lead by example and create opportunities for both of us to grow and succeed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"5b8b558b-376a-4b1f-add8-f3d3edc1063d\"}":{"__typename":"School","uuid":"5b8b558b-376a-4b1f-add8-f3d3edc1063d","name":"Maple Leaf International School 96, Rd 11A","city":"Dhaka","type":"HIGH","state":"Dhaka Division","country":"Bangladesh","zip":"1205"},"Education:{\"uuid\":\"993f3c27-5a8b-4d8b-a492-06a8c71468f4\"}":{"__typename":"Education","uuid":"993f3c27-5a8b-4d8b-a492-06a8c71468f4","school":{"__ref":"School:{\"uuid\":\"5b8b558b-376a-4b1f-add8-f3d3edc1063d\"}"},"startYear":"2014","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"8868e205-ee13-431a-bab8-0964dfbdb510\"}":{"__typename":"Education","uuid":"8868e205-ee13-431a-bab8-0964dfbdb510","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2025","major":"Quantum Science and Technology","degree":null},"MentorPublicProfile:{\"uuid\":\"bc9498e0-cfda-4c7a-8a34-44ea6dd70a64\"}":{"__typename":"MentorPublicProfile","uuid":"bc9498e0-cfda-4c7a-8a34-44ea6dd70a64","displayName":"Afia Fahmida R.","slug":"afiafahmida-rahman","biography":"\u003chr\u003e\u003cp\u003eI am a recent MSc graduate in Quantum Science and Technology from Columbia University (Class of 2025), with a BSc in Computer Science and Engineering from BRAC University (Class of 2021). My academic journey bridges computer science, mathematics, and physics, and I am deeply passionate about helping students build confidence in STEM through structured guidance and intuitive understanding.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI began tutoring during my undergraduate years and have since worked with students across a wide range of ages and skill levels, from foundational learners to advanced students tackling rigorous academic material. Over time, I realized that my core teaching philosophy centers around \u003cem\u003eintuitive learning\u003c/em\u003e. Rather than simply repeating what is already written in textbooks, I focus on helping students understand how to think, how to approach unfamiliar problems, and how to develop independent learning skills that extend far beyond any single subject.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the ways I do this is by presenting multiple approaches to the same problem, especially in mathematics and technical subjects. By exploring different solution strategies together, I can better understand how a student thinks and identify which methods feel most challenging to them. This diagnostic approach allows me to pinpoint conceptual gaps and tailor future lessons to address specific weaknesses while reinforcing strengths. My goal is not just to help students arrive at the correct answer, but to ensure they understand the reasoning behind each step and gain confidence in their own problem-solving process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically and professionally, I bring real-world engineering experience into my teaching. I have worked as a software engineer on large-scale systems and collaborative technical projects, which helps me connect theoretical concepts to practical applications. Students often find this perspective helpful because it shows how classroom knowledge translates into real-world problem solving and innovation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of formal academics, I have been actively involved in technical communities such as IEEE, where I helped organize educational competitions and technology-focused events. These experiences strengthened my communication, mentorship, and leadership skills, all of which influence my teaching style today.\u003c/p\u003e\u003cp\u003eStudents and families can expect a supportive, structured, and adaptable learning environment. I emphasize conceptual clarity, critical thinking, and the development of strong study habits. Above all, I aim to help students learn \u003cem\u003ehow to learn\u003c/em\u003e — empowering them to approach challenges independently and build lasting academic confidence.\u003c/p\u003e","teachingVideoPlaybackId":"h2lyKD9Q5W01OjpHYFiJlAW2P2Qtbw7n8cEuoCsn9i1w","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I am most proud of is completing a dual major in Computer Science and Engineering and Physics during my undergraduate studies. Balancing two rigorous disciplines required constant context switching between analytical problem-solving, theoretical reasoning, and hands-on technical implementation. It was challenging to manage the academic intensity and workload, but through discipline, resilience, and strong time management, I successfully completed all coursework across both programs. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also pursued a thesis that integrated concepts from both fields, allowing me to apply computational thinking to complex scientific problems. This experience strengthened my ability to learn quickly, adapt across domains, and approach challenges from multiple perspectives — skills that continue to shape how I solve problems today.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c96e75bb-8bf2-4725-82b7-9e12a07d8f50\"}"},{"__ref":"Favorites:{\"uuid\":\"31725ee3-7e63-4b96-adc8-5c72bc790091\"}"},{"__ref":"Favorites:{\"uuid\":\"66a2fccf-63cd-430b-a3fc-03b8cc0a9b38\"}"}],"causesSupported":[],"major":"Quantum Science and Technology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"aee6d100-43c5-4fd9-a189-52124c274c91\"}"},{"__ref":"DeepDives:{\"uuid\":\"632d8268-8b69-4352-a8d7-86a51e7bee04\"}"},{"__ref":"DeepDives:{\"uuid\":\"96f454ec-78fa-4b2b-9a1c-1e69ec7d1f0e\"}"},{"__ref":"DeepDives:{\"uuid\":\"b9f53c71-b70a-4bcd-90b7-745327378d28\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/233cf6e8-9cc4-479f-bce6-4a61f8f509ba/-/preview/-/format/jpg/","https://ucarecdn.com/33f672e8-c6f2-41e8-aeee-68e8f7b35219/-/preview/-/format/jpg/","https://ucarecdn.com/60c4d115-b7af-4ba0-ae84-25300f572d83/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"993f3c27-5a8b-4d8b-a492-06a8c71468f4\"}"},{"__ref":"Education:{\"uuid\":\"8868e205-ee13-431a-bab8-0964dfbdb510\"}"}],"hiredAt":"2026-02-02T18:45:35.569Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Computer Science","History","Reading","Economics","K-6 Storybook","Creative Writing","Coding / Programming","Web Design","Robotics / Electronics / CAD","STEM Project","Machine Learning / AI","Public Speaking"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"afiafahmida-rahman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bc9498e0-cfda-4c7a-8a34-44ea6dd70a64\"}"}}},"_sentryTraceData":"4bdb8e5e570e460ab16697254bcebe6d-8d0e5cc85462f1fb-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4bdb8e5e570e460ab16697254bcebe6d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"afiafahmida-rahman"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.s
