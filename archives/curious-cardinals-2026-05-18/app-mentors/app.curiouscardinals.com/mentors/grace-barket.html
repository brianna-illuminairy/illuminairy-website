xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"593b0e02-41fd-4b03-9937-1565115377e5\"}":{"__typename":"DeepDives","uuid":"593b0e02-41fd-4b03-9937-1565115377e5","content":"\u003cp\u003eI'm the oldest of five children, so from the days of singing lullabies and feeding pureed carrots to my brothers and sisters until now, supporting and encouraging others has been my biggest passion. I also remember what it felt like to feel lost in a class until someone explained the concept to me in that one way that just \"clicked\", or how it felt to have so much curiosity about a topic that we never covered in school. I believe that everyone deserves to learn in a way that is stimulating, fun, and uplifting! I love mentoring because it gives me a chance to make learning truly enjoyable, and I get to know awesome students who have incredible passions and questions!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"0f513452-0cab-4970-b446-cff14f15330b\"}":{"__typename":"DeepDives","uuid":"0f513452-0cab-4970-b446-cff14f15330b","content":"\u003cp\u003eRecently, I visited Dahab, Egypt, which is a beach town on the Red Sea, and there happen to be a lot of dogs who live along the boardwalk, napping by the beach and getting leftover food from tourists :D. I love dogs, and apparently I especially loved these dogs, because I had a dream that I adopted one of the dogs and brought her home. In my dream, I had named the dog Starry, took her to the vet, and even installed baby gates in my home so that she wouldn't fall down the stairs! For the rest of my trip, every time I saw a big white dog on the beach, I joked that she must be Starry. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a45831c5-f3c1-4908-8b9f-3fd5703a87d0\"}":{"__typename":"DeepDives","uuid":"a45831c5-f3c1-4908-8b9f-3fd5703a87d0","content":"\u003cp\u003eI don't live by a sea or ocean, but I absolutely love snorkeling whenever I get the chance. The marine world has been fascinating to me ever since watching The Blue Planet documentary series with my family as a first grader, but actually seeing corals, fish, and the entire reef ecosystem with my own eyes is mind blowing every time. I especially love to think about how interconnected all the organisms living in a reef are, and how each species, no matter how big or small, has its own unique purpose in keeping the ecosystem balanced. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"623a722a-85c3-47df-a872-f3a2d55972cd\"}":{"__typename":"DeepDives","uuid":"623a722a-85c3-47df-a872-f3a2d55972cd","content":"\u003cp\u003eI absolutely love all things teaching, especially coming up with creative and engaging ways to teach topics that can be challenging and frustrating. But, Stanford doesn't have an Education major, and I am also really interested in Sociology and Economics, so Public Policy was the perfect way for me to combine my passion for discovering effective teaching methods with the quantitative research and data behind which teaching methods produce the best outcomes and why. I loved that I was able to take something I was so passionate about and analyze it from a data driven perspective. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"f5073699-a4ea-4deb-a558-d055c40c365f\"}":{"__typename":"Education","uuid":"f5073699-a4ea-4deb-a558-d055c40c365f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":"2022","major":"Public Policy","degree":"Bachelor's"},"School:{\"uuid\":\"53bed011-e9b2-40d2-aac4-9b4dd275aa59\"}":{"__typename":"School","uuid":"53bed011-e9b2-40d2-aac4-9b4dd275aa59","name":"Hopkins School","city":"New Haven","type":"HIGH","state":"Connecticut","country":"United States","zip":"06515"},"Education:{\"uuid\":\"e21d7f51-0c57-4797-b231-2cdbe8956022\"}":{"__typename":"Education","uuid":"e21d7f51-0c57-4797-b231-2cdbe8956022","school":{"__ref":"School:{\"uuid\":\"53bed011-e9b2-40d2-aac4-9b4dd275aa59\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"Testimonial:2fbcec58-a5da-40ec-be17-a05e6355dc20":{"__typename":"Testimonial","id":"2fbcec58-a5da-40ec-be17-a05e6355dc20","text":"We absolutely adore Grace Barket. She has been such a wonderful addition to our 12-year-old's life. We cannot recommend her enough to other families.","date":"2025-06-14 01:42:25.293+00","rating":5,"endorser":{"__typename":"Endorser","name":"Emma Stewart","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"37d34c1b-b6d7-48dd-aab4-3fb932aec650\"}":{"__typename":"MentorPublicProfile","uuid":"37d34c1b-b6d7-48dd-aab4-3fb932aec650","displayName":"Grace B.","slug":"grace-barket","biography":"\u003cp\u003eHi! My name is Grace, and I am a recent graduate of Stanford University, majoring in Public Policy and minoring in Education. I've worked in public school districts for four years as both a Classroom Director for an after school program and a Teacher's Assistant for middle school science classes. I also have worked as an academic support tutor for four years. My biggest goal is to encourage students to believe in themselves and dream big, and I'm especially passionate about teaching math, writing, and science! In my free time, I love running, snorkeling, dining at all you can eat buffets, and cooking with my friends and family. I look forward to getting to know you :).\u003c/p\u003e","teachingVideoPlaybackId":"ypIVPF9NKuaKUByup1BxrcwYocA5iFRbd01RWGgJxYwI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Public Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"593b0e02-41fd-4b03-9937-1565115377e5\"}"},{"__ref":"DeepDives:{\"uuid\":\"0f513452-0cab-4970-b446-cff14f15330b\"}"},{"__ref":"DeepDives:{\"uuid\":\"a45831c5-f3c1-4908-8b9f-3fd5703a87d0\"}"},{"__ref":"DeepDives:{\"uuid\":\"623a722a-85c3-47df-a872-f3a2d55972cd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e92a6ad7-43af-43db-bdbd-3dfce94d1323/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f5073699-a4ea-4deb-a558-d055c40c365f\"}"},{"__ref":"Education:{\"uuid\":\"e21d7f51-0c57-4797-b231-2cdbe8956022\"}"}],"hiredAt":"2023-09-26T15:31:04.424Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","6-8 Grade Science","Biology","Writing"
