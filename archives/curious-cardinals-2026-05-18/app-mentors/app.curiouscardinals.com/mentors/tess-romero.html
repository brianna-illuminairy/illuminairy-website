xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6ae44591-8d21-472c-860e-0da58e510b5b\"}":{"__typename":"Favorites","uuid":"6ae44591-8d21-472c-860e-0da58e510b5b","photoUrl":"https://ucarecdn.com/b62afab6-f638-4566-984a-e98a09a7a565/","title":"Vampire weekend","type":"ARTIST"},"Favorites:{\"uuid\":\"b92e3be6-010f-4ebe-9366-3b40eb67a087\"}":{"__typename":"Favorites","uuid":"b92e3be6-010f-4ebe-9366-3b40eb67a087","photoUrl":"https://ucarecdn.com/aaa3f15c-7782-466d-b220-d7f6cf2b7137/","title":"Juno - Remi Wolf","type":"ALBUM"},"Favorites:{\"uuid\":\"193c3d6f-02eb-4069-99c6-a91cc5ded8ba\"}":{"__typename":"Favorites","uuid":"193c3d6f-02eb-4069-99c6-a91cc5ded8ba","photoUrl":"https://ucarecdn.com/e952cbd5-7ae0-4250-b69a-4a90c400000c/","title":"Black Swan","type":"MOVIE"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"057011a8-b80d-45eb-a9dd-1b1b3103a8c1\"}":{"__typename":"DeepDives","uuid":"057011a8-b80d-45eb-a9dd-1b1b3103a8c1","content":"\u003cp\u003eAs a mixed-race Colombian, Filipino, and Jewish woman with ADHD, I bring a deep appreciation for diverse perspectives and learning styles to my teaching. My background has taught me that there’s no one-size-fits-all approach to education. I strive to meet students where they are, honor their unique experiences, and support them in finding the methods that help them thrive.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cfc40e99-8f13-4838-b829-3495379706f3\"}":{"__typename":"DeepDives","uuid":"cfc40e99-8f13-4838-b829-3495379706f3","content":"\u003cp\u003eIn my free time, I enjoy doing art projects either by myself or with friends. I find that watercoloring, painting, or any kind of craft are really fun ways to help me unwind.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"d7240fea-6f3e-4fb6-8e22-5e71f115553d\"}":{"__typename":"DeepDives","uuid":"d7240fea-6f3e-4fb6-8e22-5e71f115553d","content":"\u003cp\u003eMy greatest role model is my mom. She’s an artist and jewelry maker who has inspired me to follow my own path. Growing up, she always encouraged me to explore different disciplines and gave me the freedom to express myself creatively. Her unconditional support and belief in me gave me the confidence to pursue my passions—whether in acting, filmmaking, or academics.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"c7376edb-046f-422d-927b-5bb8e5e72314\"}":{"__typename":"DeepDives","uuid":"c7376edb-046f-422d-927b-5bb8e5e72314","content":"\u003cp\u003eMy first job was working for a company that organized princess themed birthday parties for children. I played Mirabel and Moana!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"e2bff428-180f-47f4-a06d-c839fa2f02e0\"}":{"__typename":"School","uuid":"e2bff428-180f-47f4-a06d-c839fa2f02e0","name":"Paul D. Schreiber High School","city":"Port Washington","type":"HIGH","state":"New York","country":"United States","zip":"11050"},"Education:{\"uuid\":\"6469b341-55b9-477a-a7d9-cf9228d9fa8f\"}":{"__typename":"Education","uuid":"6469b341-55b9-477a-a7d9-cf9228d9fa8f","school":{"__ref":"School:{\"uuid\":\"e2bff428-180f-47f4-a06d-c839fa2f02e0\"}"},"startYear":"2021","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"10bd6a01-fb14-42f9-93fb-e51d625d6bdc\"}":{"__typename":"Education","uuid":"10bd6a01-fb14-42f9-93fb-e51d625d6bdc","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Humanities/art history","degree":null},"MentorPublicProfile:{\"uuid\":\"8e388323-460b-493e-b0fc-1a25d201885b\"}":{"__typename":"MentorPublicProfile","uuid":"8e388323-460b-493e-b0fc-1a25d201885b","displayName":"Tess R.","slug":"tess-romero","biography":"\u003cp\u003eHi! I'm Tess Romero, and I'm thrilled to be a part of the Curious Cardinals community!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m currently a student at Yale University studying Humanities with a concentration in Art History and Film. Before college, I worked professionally as an actor—most notably as the lead in the Disney+ series \u003cem\u003eDiary of a Future President\u003c/em\u003e. My love for storytelling and performance has shaped much of who I am, and I continue to explore these passions through writing, directing, and producing short films, as well as performing in campus theater and sketch comedy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond the performing arts, I’ve always had a deep appreciation for literature, writing, and visual art. I grew up in a creative household where artistic expression was encouraged in every form—from painting to singing to dance. Studying art history has allowed me to combine these interests and explore how creativity reflects and shapes the world around us.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I also pursued scientific research, including a conservation project in Malaysia where I worked with a group of primatologists to help protect endangered gibbon species. Working on this project broadened my perspective and showed me the importance of interdisciplinary learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my proudest accomplishments is founding \u003cem\u003eShare the Spotlight\u003c/em\u003e, a program that offered free acting classes to children with disabilities. Collaborating with students to help them find their voice and build confidence through performance was incredibly rewarding and reaffirmed my passion for mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI joined Curious Cardinals because I believe education and creative expression should be accessible to everyone. As a mentor, I strive to build genuine relationships with my students, encourage curiosity, and create an environment where they feel empowered to explore, express, and grow. I can’t wait to meet my future students and begin this journey together!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6ae44591-8d21-472c-860e-0da58e510b5b\"}"},{"__ref":"Favorites:{\"uuid\":\"b92e3be6-010f-4ebe-9366-3b40eb67a087\"}"},{"__ref":"Favorites:{\"uuid\":\"193c3d6f-02eb-4069-99c6-a91cc5ded8ba\"}"}],"causesSupported":[],"major":"Humanities/art history","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"057011a8-b80d-45eb-a9dd-1b1b3103a8c1\"}"},{"__ref":"DeepDiv
