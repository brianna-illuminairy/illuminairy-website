on:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c00358f5-3c52-4c9a-81c0-753ab554e521\"}":{"__typename":"DeepDives","uuid":"c00358f5-3c52-4c9a-81c0-753ab554e521","content":"\u003cp\u003eI would not be where I am today without the help of my mentors. I love creating connections with people and helping them find their path just like I did!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"37164a56-b5c8-499f-9d97-59af54d6fe03\"}":{"__typename":"DeepDives","uuid":"37164a56-b5c8-499f-9d97-59af54d6fe03","content":"\u003cp\u003eExercise, watch funny shows with friends, and read books!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"8e28867a-9f1a-4604-8bc5-7a23989de4ae\"}":{"__typename":"School","uuid":"8e28867a-9f1a-4604-8bc5-7a23989de4ae","name":"Sharon High School","city":"Sharon","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02067"},"Education:{\"uuid\":\"6ea5f805-35a0-4830-89b8-7c977da945d6\"}":{"__typename":"Education","uuid":"6ea5f805-35a0-4830-89b8-7c977da945d6","school":{"__ref":"School:{\"uuid\":\"8e28867a-9f1a-4604-8bc5-7a23989de4ae\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"59760431-0d74-43ae-a334-968d316c1349\"}":{"__typename":"School","uuid":"59760431-0d74-43ae-a334-968d316c1349","name":"University of Massachusetts Amherst","city":"Amherst","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"01003"},"Education:{\"uuid\":\"06f266d9-ba7f-4238-81f5-8251d2a40998\"}":{"__typename":"Education","uuid":"06f266d9-ba7f-4238-81f5-8251d2a40998","school":{"__ref":"School:{\"uuid\":\"59760431-0d74-43ae-a334-968d316c1349\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"8b65f05b-2fee-46e6-a7cc-dd240c7a8694\"}":{"__typename":"MentorPublicProfile","uuid":"8b65f05b-2fee-46e6-a7cc-dd240c7a8694","displayName":"Sam L.","slug":"sam-levitt","biography":"\u003cp\u003eHi! I'm Sam, a first-year graduate student at Stanford University studying Mechanical Engineering. I am also an incoming Summer Intern at Boeing in 2026! I help students turn their passion for innovation into real career trajectories and overcome obstacles of challenging STEM subjects!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI recently graduated Summa Cum Laude from UMass Amherst with a B.S. in Mechanical Engineering and completed my Honors Thesis researching the aerodynamics of offshore wind turbines. Now at Stanford, I am completing my Master's in Mechanical Engineering to further my understanding of fluid mechanics. I have worked at 3 different companies for summer internships during my undergrad career. This Summer, I will be a Mechanical Engineering Intern at Boeing working on projects related to the aircraft. I would love to help students find their passion for aviation!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have plenty of experience working with students! While at UMass, I worked at the Learning Resource Center for 3 years as a Peer Tutor, Mentor, and Academic Success Coach. Not only did I help students in engineering, physics, and math classes to learn the material and study for exams, I helped student with executive functioning to plan their schedules and overcome personal challenges. I was also a head tutor, so I had the opportunity to run training workshops and provide feedback to new tutoring cohorts to help them become the best tutors they could be. I even presented at the New England Peer Tutoring Conference about metacognition! Lastly, I was an overnight camp counselor and Assistant Head of the Waterfront at my summer camp, so I love working with kids of all ages.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love to exercise by going for a run or swim on campus at Stanford. I also enjoy watching sports and hanging out with my family and friends!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am also a very positive, passionate person who can help your student find their curiosity related to engineering or other topics. I can provide solid foundational academic support, student success coaching, or career navigation as your student begins to think about life after high school. I know how hard and overwhelming that process is, and I think I can be a supportive, smiling person to assist with the process.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy career interests include aviation and aeronautics, as I will be working at Boeing this upcoming summer. What sparked this interest was working on the Aeronautics Team at UMass Amherst. I also have a passion for renewable energy, which I conducted research on offshore wind turbines for my Honors Thesis. I investigated the aerodynamics of a mobile offshore wind turbine and the hydrodynamics of the structure for testing the drag coefficient. In addition, I love Formula 1 racing and worked on the Formula SAE team at UMass. I also solidified my passions for sports and business outside of engineering through my minor in engineering management.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf your student is looking for some academic help with mechanical engineering, physics, or math related subjects, executive functioning/time management, or finding their passion for engineering innovation design, I would love to work with your student! I would also be happy to help students figure out how to decide what type of college to attend and how to advertise themselves to network for internships.\u003c/p\u003e","teachingVideoPlaybackId":"Nsx4a6uonVL5LnQkBjiRUbSMq3bB01ozLBNUW13aWWns","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eCompleting my Honors Thesis research about the aerodynamics of offshore wind turbines and writing the manuscript. Talking about my work during the Boeing interview helped me get the job offer!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5d823df0-8e5b-4861-a2d1-6ec8ef5dc720\"}"},{"__ref":"Favorites:{\"uuid\":\"fb5763cc-cd8d-4600-81a0-feba675e17c1\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"977747c3-8534-4f63-a36e-6a61535430e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"678a385d-300b-4718-8ae2-ecf5394c643e\"}"},{"__ref":"DeepDives:{\"uuid\":\"c00358f5-3c52-4c9a-81c0-753ab554e521\"}"},{"__ref":"DeepDives:{\"uuid\":\"37164a56-b5c8-499f-9d97-59af54d6fe03\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cad52d71-9c7b-439f-9695-74933f09ea18/-/preview/-/format/jpg/","https://ucarecdn.com/3d33ae5e-1206-46a2-a253-672c0aa59ce6/-/preview/-/format/jpg/","https://ucarecdn.com/0a97ea3d-4b4c-4707-987a-bfc769e1042a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6ea5f805-35a0-4830-89b8-7c977da945d6\"}"},{"__ref":"Education:{\"uuid\":\"06f266d9-ba7f-4238-81f5-8251d2a40998\"}"}],"hiredAt":"2026-02-18T18:31:12.856Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Statistics","6-8 Grade Science","Chemistry","Physics","Academic Coaching","Executive Function","Economics","Sports Journalism","Business / Entrepreneurship","Finance / Investing","Sports Analytics","Aviation / Aerospace","STEM Project","Robotics / Electronics / CAD","Public Speaking"],"communityBadges":["https://ucar
