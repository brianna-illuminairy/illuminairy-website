xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"be3256ed-33f9-4054-8743-7008b9b043b1\"}":{"__typename":"Favorites","uuid":"be3256ed-33f9-4054-8743-7008b9b043b1","photoUrl":"https://ucarecdn.com/48e9562b-68b5-4535-ac35-e4048c15d0d2/","title":"All the Minnesota Teams","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"96b63a03-1bb7-462d-b24b-3927683108ce\"}":{"__typename":"Favorites","uuid":"96b63a03-1bb7-462d-b24b-3927683108ce","photoUrl":"https://ucarecdn.com/0cd8a767-0013-407a-b404-c8cc9b191496/","title":"Kane \u0026 Abel","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"18d2dbc9-09ea-4980-aa6a-0354599b8ad5\"}":{"__typename":"DeepDives","uuid":"18d2dbc9-09ea-4980-aa6a-0354599b8ad5","content":"\u003cp\u003eMentorship matters to me because I know firsthand how transformative it can be. When I entered college, I had no clear idea of what I wanted to pursue. Like many students, I felt uncertain and overwhelmed by the range of possibilities. It wasn’t until I started having conversations with peers, professors, and mentors that things began to take shape. They challenged me to explore different paths, encouraged me to push myself, and helped me see potential in places I hadn’t considered.\u003c/p\u003e\u003cp\u003eThrough their guidance, I discovered a genuine passion for accounting. It wasn’t just about numbers—it was about problem-solving, structure, and understanding how organizations operate. Their belief in me helped me believe in myself, and that’s an experience I want to pass on to others.\u003c/p\u003e\u003cp\u003eMentorship, to me, is about showing up for someone in the moments when they need direction, perspective, or simply someone to believe in them. It's about helping others uncover the opportunities they already have within them—and that’s something I’m deeply committed to as both a tutor and a mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"d0043d79-c303-4c24-8c2f-400c4be16364\"}":{"__typename":"DeepDives","uuid":"d0043d79-c303-4c24-8c2f-400c4be16364","content":"\u003cp\u003eMy greatest source of motivation is helping students build confidence in their abilities and recognize their value beyond just the grades they receive. I’ve seen how easy it is for students to tie their self-worth to a letter or a score, but real growth comes when they start to believe in themselves—when they discover that learning can be rewarding, even enjoyable, on its own.\u003c/p\u003e\u003cp\u003eWhat inspires me most is watching that shift happen: when a student begins to ask questions out of curiosity instead of fear, or when they start to take pride in the effort, not just the outcome. I believe that when you find an intrinsic love for what you do—when you're learning because it excites you, not because you have to—you unlock the chance to make a meaningful impact on your community \u003cem\u003eand\u003c/em\u003e to find fulfillment in your own day-to-day life.\u003c/p\u003e\u003cp\u003eThat’s the kind of mindset I strive to nurture in the students I work with, and it's what continues to motivate me every single day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"7d87e661-1899-4aca-b7a4-78c0bfd35b99\"}":{"__typename":"DeepDives","uuid":"7d87e661-1899-4aca-b7a4-78c0bfd35b99","content":"\u003cp\u003eIn high school, I was deeply passionate about the social sciences and humanities. I loved diving into complex topics, thinking critically about the world around me, and engaging in meaningful discussions. That passion led me to become actively involved in my school’s Model UN team, where I developed strong research, public speaking, and collaboration skills. I also wrote for my high school newspaper, which gave me a creative outlet and taught me the value of clear, thoughtful communication.\u003c/p\u003e\u003cp\u003eOutside the classroom, I stayed active and adventurous—I was on both my middle and high school mountain biking teams. It was a great way to stay grounded, challenge myself physically, and connect with others in a completely different setting.\u003c/p\u003e\u003cp\u003eLooking back, I think those experiences helped shape my ability to think both analytically and empathetically—skills I still rely on today in my academic, professional, and mentoring work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2c18b7be-e46c-4c83-acdd-f6bb79932904\"}":{"__typename":"DeepDives","uuid":"2c18b7be-e46c-4c83-acdd-f6bb79932904","content":"\u003cp\u003eI chose to major in accounting because I fell in love with its fundamentals in a way I didn’t expect. Going into college, I had a lot of stereotypes about what accounting was—I assumed it was rigid, repetitive, and purely numbers-driven. But as I started taking courses and engaging with the material more deeply, I realized how much more there was beneath the surface.\u003c/p\u003e\u003cp\u003eAccounting isn’t black and white—it’s filled with nuance, judgment, and problem-solving. I was drawn to how it required both analytical thinking and attention to detail, and how even complex problems could lead to clear, satisfying solutions with enough effort and understanding. It challenged me in a way that was both difficult and deeply rewarding.\u003c/p\u003e\u003cp\u003eThat discovery made me excited not just about accounting as a subject, but about the professional and personal opportunities it could open up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"4022d0cb-7cdb-4e2f-a41f-cfac5b006bc5\"}":{"__typename":"School","uuid":"4022d0cb-7cdb-4e2f-a41f-cfac5b006bc5","name":"Edina High School","city":"Edina","type":"HIGH","state":"Minnesota","country":"United States","zip":"55439"},"Education:{\"uuid\":\"74364115-2223-4895-93b9-d5cdb215add2\"}":{"__typename":"Education","uuid":"74364115-2223-4895-93b9-d5cdb215add2","school":{"__ref":"School:{\"uuid\":\"4022d0cb-7cdb-4e2f-a41f-cfac5b006bc5\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3521ce67-22ba-4ca5-a724-a8738ea89e15\"}":{"__typename":"School","uuid":"3521ce67-22ba-4ca5-a724-a8738ea89e15","name":"William \u0026 Mary","city":"Williamsburg","type":"COLLEGE","state":"Virginia","country":"United States","zip":"23185"},"Education:{\"uuid\":\"777e3ef0-3fd2-4cc5-b6bd-0d7384c9da55\"}":{"__typename":"Education","uuid":"777e3ef0-3fd2-4cc5-b6bd-0d7384c9da55","school":{"__ref":"School:{\"uuid\":\"3521ce67-22ba-4ca5-a724-a8738ea89e15\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Accounting","degree":null},"MentorPublicProfile:{\"uuid\":\"9d1467c5-6493-4d0b-870b-3457a0af4bf1\"}":{"__typename":"MentorPublicProfile","uuid":"9d1467c5-6493-4d0b-870b-3457a0af4bf1","displayName":"Matthew H.","slug":"matthew-hovelsrud","biography":"\u003cp\u003eI’m passionate about creating learning environments where students feel capable, supported, and genuinely engaged. I believe that academic success isn't just about getting the right answer—it’s about building confidence, curiosity, and problem-solving skills that last far beyond the classroom. My goal is to help students develop the mindset and tools they need to tackle challenges independently, while still feeling encouraged and guided every step of the way. I aim to make learning not only productive, but something students can actually enjoy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated early from the College of William \u0026amp; Mary with a BBA in Accounting and a concentration in Finance, and continued on to complete my Master of Accounting (MAcc) at the same institution in 2025. I earned Summa Cum Laude honors in both programs, was a PCAOB Scholar, recognized among the \u003cem\u003e100 Best \u0026amp; Brightest Undergraduate Business Majors 2024\u003c/em\u003e by \u003cem\u003ePoets \u0026amp; Quants\u003c/em\u003e, awarded the Gibbs Accounting Society's Leadership and Highest Accounting GPA Award, and was inducted into Beta Gamma Sigma twice in recognition of academic excellence in business studies. These honors reflect my commitment not only to mastering the material, but also to consistently challenging myself academically.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my time at William \u0026amp; Mary, I served as both a teaching assistant and a graduate assistant across multiple semesters. This role gave me the opportunity to support students through challenging coursework in a variety of settings—whether breaking down complex accounting standards, facilitating review sessions, or guiding students one-on-one through problem sets. I worked with courses ranging from introductory accounting to specialized electives, each with its own pace, complexity, and expectations. Collaborating with professors who had distinct teaching styles and working with students from diverse academic backgrounds taught me how to adapt explanations, examples, and practice problems to match different learning needs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I have completed multiple accounting and finance internships at both Big 4 and regional firms, where I learned to bridge the gap between textbook theory and real-world application. These experiences not only deepened my technical expertise, but also showed me how to communicate complex concepts in clear, relatable terms. \u003c/p\u003e\u003cp\u003eThis Fall, I will be starting on a financial services-specific audit team for Ernst \u0026amp; Young, which will further expand my ability to provide real-world context for the topics I teach.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I stay active through running, biking, skiing, hiking, and swimming—pursuits that have taught me discipline, perseverance, and balance. I’m also an avid home cook who enjoys experimenting with new recipes, a creative outlet that mirrors the curiosity and problem-solving mindset I bring to tutoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, I combine subject matter expertise with a thoughtful, personalized approach. My goal is to help students not just succeed, but to truly enjoy the process of learning and gain skills they’ll carry far beyond the classroom.\u003c/p\u003e\u003ch6\u003e\u003c/h6\u003e","teachingVideoPlaybackId":"zGD3YV5Nbj5LQuT01VjmCtmkRnFAr3602taw9M8GGzUCs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"be3256ed-33f9-4054-8743-7008b9b043b1\"}"},{"__ref":"Favorites:{\"uuid\":\"96b63a03-1bb7-462d-b24b-3927683108ce\"}"}],"causesSupported":[],"major":"Accounting","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"18d2dbc9-09ea-4980-aa6a-0354599b8ad5\"}"},{"__ref":"DeepDives:{\"uuid\":\"d0043d79-c303-4c24-8c2f-400c4be16364
