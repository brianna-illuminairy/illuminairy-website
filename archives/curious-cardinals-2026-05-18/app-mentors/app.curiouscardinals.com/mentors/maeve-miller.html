xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fffbcbf8-47ca-4521-a2a6-149596595591\"}":{"__typename":"Favorites","uuid":"fffbcbf8-47ca-4521-a2a6-149596595591","photoUrl":"https://ucarecdn.com/0d6c6605-dfdd-4aed-880f-7bf7f4a91cb4/","title":"The Last Black Man in San Francisco","type":"MOVIE"},"Favorites:{\"uuid\":\"7d94d8d3-6d0c-4e13-a390-eea1e1817de4\"}":{"__typename":"Favorites","uuid":"7d94d8d3-6d0c-4e13-a390-eea1e1817de4","photoUrl":"https://ucarecdn.com/73642813-80fd-4f19-af77-c5777a573b87/","title":"The Great Gatsby","type":"BOOK"},"Favorites:{\"uuid\":\"f93e6a86-5d4f-40cc-91a3-23ce7de321c2\"}":{"__typename":"Favorites","uuid":"f93e6a86-5d4f-40cc-91a3-23ce7de321c2","photoUrl":"https://ucarecdn.com/311bb714-a10c-4664-a56d-30f9cddfb00f/","title":"Salvador Dalí","type":"ARTIST"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8cbd468d-21b0-4917-9c5b-9aec243abdfc\"}":{"__typename":"DeepDives","uuid":"8cbd468d-21b0-4917-9c5b-9aec243abdfc","content":"\u003cp\u003eHistory of Art and Architecture was the reason I went to Harvard. They have one of the best graduate programs in the world and I hoped to get a foot in the door with professors. I was also particularly enamored by a professor in History of African American Art as I'd never heard of this before college.\u003c/p\u003e\u003cp\u003eEverything changed for me when I went to my first day of a History of Cinema class. It had a similarly analytical approach to art, but with a new medium. I immediately fell in love. I liked the way you could use an art historical framework to change your perception of film and tv. While the program was academic (rather than professional), I found the type of study and analysis helpful in all areas of my education. It made me a better essay and creative writer, skills I've brought with me outside of school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"daafe8f4-e6e0-40f1-9cad-56326293a793\"}":{"__typename":"DeepDives","uuid":"daafe8f4-e6e0-40f1-9cad-56326293a793","content":"\u003cp\u003eAs one of the few African American students at both my high school and major in my college, I haven't always felt confident in myself. This struggle pushed me to be a better student, settling into academia as a place to fit in. As my confidence in my expertise grew, so did my confidence in my learning and thus teaching abilities.\u003c/p\u003e\u003cp\u003eI feel my heritage influences every area of my teaching. I am conversational and explorative because of the curiosity of my white, British mother. I am also confident in my speech because of my Black father's passionate discourse.\u003c/p\u003e\u003cp\u003eAs with anyone, my background helps inform what I'm interested in and passionate about. My work ethic, my drive, my artistic nature, all come from the doors opened to me by my parents and those before them. I look forward to teaching from that place of passion, because it has been so helpful and important for me in giving me purpose.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"10fad3dd-7ccc-40df-afa7-e84c9d9f6c36\"}":{"__typename":"DeepDives","uuid":"10fad3dd-7ccc-40df-afa7-e84c9d9f6c36","content":"\u003cp\u003eAva DuVernay, an prominent African American filmmaker in Hollywood, is my greatest model for the life I want. She started as a PR person but pivoted later in life to follow her passion for directing. Such confidence in her abilities makes me sure that someone like me could follow in her footsteps wherever my path may take me. While I love the media she's involved in, I also love the way she carries herself. Making impactful work while looking great and brimming with joy at the universe she's created around her. I hope to grow into such a person one day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"6610212f-8278-4e5c-aebe-d1fd18c197bf\"}":{"__typename":"School","uuid":"6610212f-8278-4e5c-aebe-d1fd18c197bf","name":"University High School","city":"San Francisco","type":"HIGH","state":"CA","country":"United States","zip":"94415"},"Education:{\"uuid\":\"44f24ea9-2f15-476e-8425-c58fcf9128e2\"}":{"__typename":"Education","uuid":"44f24ea9-2f15-476e-8425-c58fcf9128e2","school":{"__ref":"School:{\"uuid\":\"6610212f-8278-4e5c-aebe-d1fd18c197bf\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"5b6c9f96-064e-46cc-9041-c884073fa423\"}":{"__typename":"Education","uuid":"5b6c9f96-064e-46cc-9041-c884073fa423","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"History of Art \u0026 Art, Film, Visual Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"bbb42314-5043-4847-8767-4b27510f3e3a\"}":{"__typename":"MentorPublicProfile","uuid":"bbb42314-5043-4847-8767-4b27510f3e3a","displayName":"Maeve M.","slug":"maeve-miller","biography":"\u003cp\u003eMy name is Maeve and I'm originally from San Francisco, CA. I grew up in the Twin Peaks neighborhood of the city, attending an academically rigorous high school which set me up for a successful college application process. My college essay was strong and used as an example years after my departure. Similarly, study sets and Quizlets for the classes I was in were the talk of my high school, helping students succeed for several classes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI went to college at Harvard University where I planned to study architecture. Instead, I fell in love with film studies, slotting it in where I could. I graduated from Harvard University in 2022 with a dual degree in History of Art and Architecture \u003cem\u003eand \u003c/em\u003eArt, Film, and Visual Studies. My thesis was an exploration of the effects of Salvador Dalí's celebrity on the market for his art. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduation, I moved to LA and have been living here for about 3 years. I have worked as an assistant in Hollywood for several years where I help creatives match with projects through an agency. I love to work on film sets with friends as much as work allows. I have a passion for writing and experience in most visual arts as both critic and maker. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile my background is in the arts, my interests go far beyond that area. I'm a student at heart, always interested to pick up a book on the history of the occult or listen to a lecture on astronomy. Early and strong study habits have always influenced my work ethic, making me a flexible and driven leader with a strong sense of self. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work, I enjoy going to museums, playing games with friends, hiking, and photography.  I'm always looking for new experiences to try. Right now, I'm reviewing my Creative Writing skills in extension classes at UCLA. I also love to travel! I'm very close with my family who live both in Northern California and England and try to visit as much as I can. Currently, I'm planning a historical tour of Mexico City with some friends for next year.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my opinion, establishing learning habits and skills early helps students keep up when they get to college. Once these are established, passion and eventually confidence and even excitement will follow. The ability to imagine a bright future is a privilege and I hope to foster such hopefulness in students I mentor. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThank you and I look forward to working with you.\u003c/p\u003e","teachingVideoPlaybackId":"uc6nf2MaudtrKB01HjDhMxbRBYxAhBPnBomU5BIkXmzY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"fffbcbf8-47ca-4521-a2a6-149596595591\"}"},{"__ref":"Favorites:{\"uuid\":\"7d94d8d3-6d0c-4e13-a390-eea1e1817de4\"}"},{"__ref":"Favorites:{\"uuid\":\"f93e6a86-5d4f-40cc-91a3-23ce7de321c2\"}"}],"causesSupported":[],"major":"History of Art \u0026 Art, Film, Visual Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8cbd468d-21b0-4917-9c5b-9aec243abdfc\"}"},{"__ref":"DeepDives:{\"uuid\":\"daafe8f4-e6e0-40f1-9cad-56326293a793\"}"},{"__ref":"DeepDives:{\"uuid\":\"10fad3dd-7ccc-40df-afa7-e84c9d9f6c36\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/be7955ed-913f-4857-8502-da9c8eabb0b7/-/preview/-/format/jpg/","https://ucarecdn.com/ff1e0d57-c96d-41ff-827a-e151bc55f482/-/preview/-/format/jpg/","https://ucarecdn.com/b248fd8a-5074-4a4e-83bb-1537711a6de6/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"44f24ea9-2f15-476e-8425-c58fcf9128e2\"}"},{"__ref":"Education:{\"uuid\":\"5b6c9f96-064e-46cc-9041-c884073fa423\"}"}],"hiredAt":"2025-09-06T15:28:47.392Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Law / Government / Policy","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/","https://ucarecdn.com/c278d819-50e0-435a-a1b0-1b3a8793462f/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maeve-miller\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bbb42314-5043-4847-8767-4b27510f3e3a\"}"}}},"_sentryTraceData":"cf8ca3bfaf27429e8b9a27bed253573e-a096acf7a91bb769-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=cf8ca3bfaf27429e8b9a27bed253573e,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"maeve-miller"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'scri
