xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"45b598e5-1aef-470e-9edf-5cdaa68cafb2\"}":{"__typename":"DeepDives","uuid":"45b598e5-1aef-470e-9edf-5cdaa68cafb2","content":"\u003cp\u003eI owe all my life's achievements to my mentors, who have an extraordinary knack for recognizing and nurturing my best traits. Mentors can appear in the most unexpected forms, ranging from the everyday wisdom of my mom to the global insights of international NGO presidents. Each has uniquely broadened my perspective and understanding. They excel in connecting these qualities to opportunities I couldn't have imagined on my own. These mentors are more than guides; they inspire and transform potential into reality, illuminating strengths and teaching us to navigate life's journey with confidence and wisdom.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5d6c7d08-c364-4848-b56f-5dbfefd63b2f\"}":{"__typename":"DeepDives","uuid":"5d6c7d08-c364-4848-b56f-5dbfefd63b2f","content":"\u003cp\u003ePlease, please(!)  don't underestimate the value of creativity in your life, even if traditional art classes like drawing or painting don't appeal to you. Creativity can flourish in many forms beyond the canvas. Consider exploring graphic design, photography, filmmaking, baking, or cooking...you might find that you have a creative side after all. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"11a8628d-7e58-42de-9159-93c7bb927c44\"}":{"__typename":"DeepDives","uuid":"11a8628d-7e58-42de-9159-93c7bb927c44","content":"\u003cp\u003eOne of my proudest achievements dates back to high school when I initiated an art therapy pen pal program for kids in the oncology unit of the hospital where I worked. This small project, fueled by the power of social media marketing, blossomed into an international youth-led 501(c)(3) nonprofit, revolutionizing the interaction between children and local healthcare systems. Our initiative expanded across 72 countries, touching the lives of over 30,000 children, a testament to the power of compassion and innovation in making a global impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a7eaffe5-d885-4c25-a2f6-d0becd707d1b\"}":{"__typename":"DeepDives","uuid":"a7eaffe5-d885-4c25-a2f6-d0becd707d1b","content":"\u003cp\u003eOne of my favorite summers was spent as an assistant teacher at a daycare, where I worked specifically with a group of fifteen two-year-olds. My days were filled with preparing snacks, crafting imaginative stories, composing impromptu songs, and yes, cleaning up quite the variety of messes. I loved every minute of it (well, almost every minute!).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"371e683c-3ece-4c6a-bc74-5a296e917c28\"}":{"__typename":"School","uuid":"371e683c-3ece-4c6a-bc74-5a296e917c28","name":"Grover Cleveland High School","city":"Portland","type":"HIGH","state":"Oregon","country":"United States","zip":"97202"},"Education:{\"uuid\":\"d6b57f29-746e-46c4-bbcd-78a88e7a8734\"}":{"__typename":"Education","uuid":"d6b57f29-746e-46c4-bbcd-78a88e7a8734","school":{"__ref":"School:{\"uuid\":\"371e683c-3ece-4c6a-bc74-5a296e917c28\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"199f420d-95cf-43c8-9446-b5c55fa761a0\"}":{"__typename":"Education","uuid":"199f420d-95cf-43c8-9446-b5c55fa761a0","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"154727eb-dfe1-4bd2-8b7d-026f8f4d5536\"}":{"__typename":"MentorPublicProfile","uuid":"154727eb-dfe1-4bd2-8b7d-026f8f4d5536","displayName":"Malcolm A.","slug":"malcolm-asher","biography":"\u003cp\u003eHello! I'm Malcolm, and this spring I will be graduating from Stanford with a major in Human Biology. My journey has been unique; I've transformed my personal struggles with navigating the complex health insurance system into a source of hope and guidance for others. I co-founded Paxos Appeals, a pioneering direct-to-patient firm specializing in overturning unjustly denied surgery pre-authorizations. Since taking on our first client in June 2022, we've transformed countless insurance denials into over $1.2 million in critical surgery coverage for hundreds of patients nationwide, achieving a 94% success rate.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy Stanford journey has been one of self-discovery. Starting on a pre-med trajectory, I was deeply intrigued by science and clinical medicine. This interest propelled me into two years of research at the Sleep Surgery Innovation Lab, working on improving global surgery standards, and the Heifets Lab, focusing on understanding powerful, rapid-acting therapies for psychiatric disease. I also took a COVID gap year to work full-time as a medical scribe in a bustling family health practice in my home of Portland, Oregon. Currently, my focus after graduating is on growing Paxos, which means delaying my medical school plans for now. I'm particularly thrilled about the opportunity to blend creativity and entrepreneurship in fostering healthcare innovation.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school and work, you will most likely find me on an outdoor expedition or navigating San Francisco's public transportation to embark on adventures that involve photography, music, thrifting, or film. My friends would say I’m a people-person first and foremost, bringing energy and positivity into every room.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the realm of mentoring, I'm not just a tutor; I'm a journey companion. I embrace a teaching style filled with lightheartedness, humor, and genuine human connection. Each session with me is a purposefully designed mini-adventure. We weave together humor and learning with a clear intention: to transform your passions into tangible, real-life achievements. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs your mentor, I'm here to kindle that spark within you. To guide, inspire, and walk alongside you as you carve your own path. Together, we'll explore the realms of knowledge, unbox your potential, and embark on a journey that's as enriching as it is exhilarating. 🚀🌟\u003cbr\u003e\u003cbr\u003ewww.linkedin.com/in/malcolm-asher\u003c/p\u003e","teachingVideoPlaybackId":"q1uNN6RA2DLXC5hMZYj9KT00KMy5jt87ByztDUnOA2PA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"45b598e5-1aef-470e-9edf-5cdaa68cafb2\"}"},{"__ref":"DeepDives:{\"uuid\":\"5d6c7d08-c364-4848-b56f-5dbfefd63b2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"11a8628d-7e58-42de-9159-93c7bb927c44\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7eaffe5-d885-4c25-a2f6-d0becd707d1b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fd964110-a67b-4eb9-bdd0-f9ed78cf7e5d/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d6b57f29-746e-46c4-bbcd-78a88e7a8734\"}"},{"__ref":"Education:{\"uuid\":\"199f420d-95cf-43c8-9446-b5c55fa761a0\"}"}],"hiredAt":"2023-12-20T01:03:33.667Z","topics":["Video / Photography","Academic Coaching","Executive Function","Business / Entrepreneurship","Negotiation","Music","Film / Theater","Fashion / Cosmetics","Cooking","Global Health","Debate","Journalism","Public Speaking","Statistics","K-5 Grade Math","Geometry","Pre-Algebra","Biology","Chemistry","6-8 Grade Science","Physics","Algebra I"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"malcolm-asher\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"154727eb-dfe1-4bd2-8b7d-026f8f4d5536\"}"}}},"_sentryTraceData":"4e99ec6a5d9d4d129e30ec985ca87271-813fb513eda565a8-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4e99ec6a5d9d4d129e30ec985ca87271,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"malco
