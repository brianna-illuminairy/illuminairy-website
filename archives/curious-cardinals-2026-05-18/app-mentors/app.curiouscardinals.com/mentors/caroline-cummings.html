xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8a92ad42-6e21-4b20-ab23-f6d3e2e8e07b\"}":{"__typename":"DeepDives","uuid":"8a92ad42-6e21-4b20-ab23-f6d3e2e8e07b","content":"\u003cp\u003eIf I'm not outside running or exploring, I enjoy reading and typically read 20+ books every year.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"b23f42cc-d93a-47db-ad05-3e4f083b9fea\"}":{"__typename":"DeepDives","uuid":"b23f42cc-d93a-47db-ad05-3e4f083b9fea","content":"\u003cp\u003eMy greatest source of motivation is curiosity and continuous growth. I’m energized by learning new concepts, exploring how things work, and pushing myself to improve.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"bd701b85-48d1-46e1-a935-b54d7b11f4df\"}":{"__typename":"School","uuid":"bd701b85-48d1-46e1-a935-b54d7b11f4df","name":"Lawton Chiles High School","city":"Tallahassee","type":"HIGH","state":"Florida","country":"United States","zip":"32312"},"Education:{\"uuid\":\"903b7dba-8cef-4e84-ae56-6baf2635aa5e\"}":{"__typename":"Education","uuid":"903b7dba-8cef-4e84-ae56-6baf2635aa5e","school":{"__ref":"School:{\"uuid\":\"bd701b85-48d1-46e1-a935-b54d7b11f4df\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"75c044bf-6642-440f-8086-6c54eb087685\"}":{"__typename":"Education","uuid":"75c044bf-6642-440f-8086-6c54eb087685","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"6d9472fc-9db3-4012-b40c-5e523fe3fc92\"}":{"__typename":"MentorPublicProfile","uuid":"6d9472fc-9db3-4012-b40c-5e523fe3fc92","displayName":"Caroline C.","slug":"caroline-cummings","biography":"\u003cp\u003eHi! My name is Caroline, and I’m so excited to be a mentor with Curious Cardinals. I’m a computer science student who loves building creative projects and helping students feel confident learning new skills. I started teaching coding a few years ago, and it quickly became one of the most meaningful parts of my week. I’ve worked with groups of elementary and middle school students in Philadelphia, teaching beginner coding and problem-solving using Scratch. I love Scratch because it makes programming feel fun and creative right away, while still teaching real skills like logic, patterns, and debugging.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also enjoy helping students with more traditional school subjects, and I’m excited to support learners in a wide range of areas and school subjects. I hope to also help with other skills like study strategies, staying organized, building confidence, and setting goals in a way that feels manageable and encouraging.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I spend a lot of time working on my own technical projects, learning how software is built, and exploring how technology can be used to solve real-world problems. I’ve worked on projects ranging from building full web apps to analyzing data and experimenting with artificial intelligence, but one of my favorite parts of tech is that it combines creativity and logic at the same time. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of coding, I’m a long-distance runner, and I love baking different desserts, exploring new restaurants, hiking, and overall just being outside. I also played soccer for 14 years of my life, which taught me a lot about teamwork, practice, and not giving up when something feels hard at first. I bring that same mindset into mentoring — learning takes time, and progress is something to be proud of.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHere are some fun facts about me:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI grew up in Florida\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMy favorite animal is a monkey (I LOVED climbing trees when I was younger)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI have a dog named Ludo and 11 chickens\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMy favorite snack is fresh fruit, especially mango\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eMy goal as a mentor is to help each student feel proud of what they learn and create, whether it’s a small game, a funny animation, or a project they never thought they could build. I believe learning should feel fun, creative, and exciting – and I hope I can provide that for you. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can’t wait to meet you and start creating!\u003c/p\u003e","teachingVideoPlaybackId":"517YhFUEGyB35YIAvSQvnTP02oMBMKmcrc026FO1zU3FA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8a92ad42-6e21-4b20-ab23-f6d3e2e8e07b\"}"},{"__ref":"DeepDives:{\"uuid\":\"b23
