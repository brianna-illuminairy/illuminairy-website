xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9d2079ec-3526-40ec-b258-767d1a3e3967\"}":{"__typename":"DeepDives","uuid":"9d2079ec-3526-40ec-b258-767d1a3e3967","content":"\u003cp\u003eI chose Computer Science because it felt like the most powerful way to turn ideas into real solutions. Growing up, I became interested in how technology can open doors for people and make difficult parts of life easier. In college at the University of Virginia, I liked that computer science combined logic, creativity, and problem solving. I could build something from scratch, test it, improve it, and see results quickly. I also enjoyed that the field touches nearly everything, from healthcare and education to finance and public services. \u003cbr\u003e\u003cbr\u003eAs I learned more, I became especially drawn to systems and machine learning because they let you work on problems at scale. I want to build products that are reliable, ethical, and genuinely helpful, and computer science gives me the tools to do that.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ea6ef4ab-e36d-4503-a02d-1f937f50d596\"}":{"__typename":"DeepDives","uuid":"ea6ef4ab-e36d-4503-a02d-1f937f50d596","content":"\u003cp\u003eI would tell my middle or high school self to stop waiting to feel ready. Start earlier, ask more questions, and get comfortable being a beginner. Choose one skill to build each semester and practice it consistently, even if it is just 30 minutes a day. Find mentors and peers who take learning seriously. Also, protect your confidence: one bad grade is feedback, not your identity. Keep showing up and you will compound fast.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1ffbee62-48eb-478f-8a4b-61f0a362cf46\"}":{"__typename":"DeepDives","uuid":"1ffbee62-48eb-478f-8a4b-61f0a362cf46","content":"\u003cp\u003eA current passion project I’m working on is a Microservices Compute Workload Orchestrator. I’m building it as a multi-service system that accepts job requests, tracks resource availability over time, and makes placement decisions about where a workload should run. I’m also treating operational visibility as a core feature, so you can see what the system decided, why it decided it, and how healthy the overall system is. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt a high level, a user can submit a workload request and immediately get either a placement decision or a clear decision status if it is still processing. The system maintains an authoritative view of resource state, initially simulated but structured so it could later ingest real signals, including optional GPU style indicators. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eEach decision produces an audit friendly artifact that captures the input summary, the decision output, and reason codes to explain the tradeoffs and constraints. I’m intentionally designing the boundaries so it feels like a real production platform: ingestion is separated from decisioning, and decisioning is separated from visibility and reporting. The system also handles duplicate submissions with idempotent behavior, so the same request does not create conflicting outcomes. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eFinally, I’m building in a failure mode on purpose, such as one service being unavailable, and ensuring the system responds predictably with an explicit error or a degraded but consistent behavior. What excites me about this project is that it connects systems design, distributed reliability, and clear communication into one practical build.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"1c1b7559-dbf8-4367-89cc-f53cf8c6b3cc\"}":{"__typename":"DeepDives","uuid":"1c1b7559-dbf8-4367-89cc-f53cf8c6b3cc","content":"\u003cp\u003eMy greatest role model is my father. He has been the steady example in my life of what discipline, responsibility, and persistence look like, especially when things are not easy. He has always put family first, stayed calm under pressure, and kept moving forward even when the path required sacrifice. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat I admire most is his consistency. He does not just talk about values like hard work, integrity, and respect, he lives them every day. Watching him handle challenges with patience and purpose taught me that success is not only about talent, it is about character and showing up when it matters. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs I have grown older, I have realized how much his example shaped the way I approach school, work, and relationships. When I face difficult decisions, I often ask myself what he would do, and that helps me choose the right long-term path instead of the easy short-term one.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"067a0ff1-8851-4113-a91b-bdf64d7058fc\"}":{"__typename":"School","uuid":"067a0ff1-8851-4113-a91b-bdf64d7058fc","name":"Annandale High School","city":"Annandale","type":"HIGH","state":"Virginia","country":"United States","zip":"22003"},"Education:{\"uuid\":\"4d6d8ea6-92ac-41bc-ac90-586e382af7d1\"}":{"__typename":"Education","uuid":"4d6d8ea6-92ac-41bc-ac90-586e382af7d1","school":{"__ref":"School:{\"uuid\":\"067a0ff1-8851-4113-a91b-bdf64d7058fc\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0178f3bb-c43d-4bd8-b730-6b146040dc14\"}":{"__typename":"School","uuid":"0178f3bb-c43d-4bd8-b730-6b146040dc14","name":"University of Virginia","city":"Charlottesville","type":"COLLEGE","state":"Virginia","country":"United States","zip":"22904"},"Education:{\"uuid\":\"6cff73fe-ca4e-45dd-a1af-82da84f2672c\"}":{"__typename":"Education","uuid":"6cff73fe-ca4e-45dd-a1af-82da84f2672c","school":{"__ref":"School:{\"uuid\":\"0178f3bb-c43d-4bd8-b730-6b146040dc14\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"MS Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"36642355-ffa2-4708-9069-466e201af7b4\"}":{"__typename":"MentorPublicProfile","uuid":"36642355-ffa2-4708-9069-466e201af7b4","displayName":"Elias H.","slug":"elias-haddad","biography":"\u003cp\u003eHi! I’m Elias, a software engineer and lifelong learner who cares a lot about helping students build confidence through clear structure and real, tangible progress. My family immigrated to the U.S. from Lebanon when I was young, and that experience shaped how I think about opportunity: with the right guidance, consistency, and support, you can go further than you think. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I studied Computer Science at the University of Virginia, where I built a strong foundation in topics like data structures, operating systems, and machine learning. I also explored how technology impacts society through research on bias in data. One of my favorite parts of college was turning ideas into things people could actually use, like a capstone mobile app I helped build to encourage plastic waste cleanup, which we worked on with an external professor and partnered with schools to motivate students. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I work in cloud and distributed systems, building software that’s reliable, secure, and scalable. I’ve supported teams with documentation, debugging, and mentoring new teammates, and I enjoy breaking down complex topics into simple, practical steps. Outside of work, I’m currently pursuing a part-time M.S. in Computer Science at Columbia University with a focus on machine learning. I spend a lot of my free time studying (networking, systems, and ML), building side projects, and refining my ability to explain hard concepts in a way that feels approachable. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, my style is structured but encouraging. Students I work with can expect three things; first, a clear plan and weekly goals, second, accountability and consistent check-ins, and third, support that adapts to their learning style, especially if they’re overwhelmed, unsure where to start, or struggling with study habits. I’m happy to help with academic tutoring (math, CS fundamentals), building passion projects, or creating a strong portfolio for high school programs and college applications. My goal is for students to feel supported, capable, and proud of what they create, because confidence comes from progress you can see. For parents, my priority is to provide a safe, supportive space where your student feels encouraged, challenged appropriately, and consistently progressing.\u003c/p\u003e","teachingVideoPlaybackId":"7VB9G3hNqfQ1fy3HZ5Xr1EqXE0244KO7vRaG8mhPtXDU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"MS Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9d2079ec-3526-40ec-b258-767d1a3e3967\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea6ef4ab-e36d-4503-a02d-1f937f50d596\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ffbee62-48eb-478f-8a4b-61f0a362cf46\"}"},{"__ref":"DeepDives:{\"uuid\":\"1c1b7559-dbf8-4367-89cc-f53cf8c6b3cc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b29d818c-c574-4f54-9d80-5100b87f2252/-/preview/-/format/jpg/","https://ucarecdn.com/2e6b0e44-b72f-4e49-b874-fa969755d08e/-/preview/-/format/jpg/","https://ucarecdn.com/bda319ba-4feb-4daf-95b5-8e26cdf36453/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4d6d8ea6-92ac-41bc-ac90-586e382af7d1\"}"},{"__ref":"Education:{\"uuid\":\"6cff73fe-ca4e-45dd-a1af-82da84f2672c\"}"}],"hiredAt":"2026-02-03T02:02:19.702Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Physics","Writing","Academic Coaching","College Essay Writing","Computer Science","Economics","Executive Function","Creative Writing","Fashion / Cosmetics","History Project","K-6 Storybook","Sports Journalism","Video / Photography","Visual Arts / Graphic Design","Business / Entrepreneurship","Finance / Investing","Aviation / Aerospace","Coding / Programming","Game Design","Machine Learning / AI","Medicine / Health","Robotics / Electronics / CAD","Sports Analytics","STEM Project","Web Design","Debate","Journalism","Law / Government / Policy","Public Speaking","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elias-haddad\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"36642355-ffa2-4708-9069-466e201af7b4\"}"}}},"_sentryTraceData":"a5663c91fcc842468ab6252823b1239f
