xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f74c075b-e8ca-4c97-b9df-7254bf37ad8c\"}":{"__typename":"Favorites","uuid":"f74c075b-e8ca-4c97-b9df-7254bf37ad8c","photoUrl":"https://ucarecdn.com/a31759e3-6936-43ea-8340-7d52918e0179/","title":"Rihanna","type":"ARTIST"},"Favorites:{\"uuid\":\"2ef24101-4dae-449c-8690-8b7be3523dde\"}":{"__typename":"Favorites","uuid":"2ef24101-4dae-449c-8690-8b7be3523dde","photoUrl":"https://ucarecdn.com/96e2a8dd-59c2-4c33-83c7-2305aa3f4fe9/","title":"Stephen Curry","type":"ATHLETE"},"Favorites:{\"uuid\":\"59d8c4a6-f6ac-4210-9ae4-4abb24680365\"}":{"__typename":"Favorites","uuid":"59d8c4a6-f6ac-4210-9ae4-4abb24680365","photoUrl":"https://ucarecdn.com/38593a2d-88ba-4da7-a241-cd660e8d5266/","title":"Fortnite","type":"GAME"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c7546f2c-c8b8-40b5-bbd3-5fcc38446dac\"}":{"__typename":"DeepDives","uuid":"c7546f2c-c8b8-40b5-bbd3-5fcc38446dac","content":"\u003cp\u003eMentorship matters to me because I know what it feels like to be curious and motivated but unsure how to turn that curiosity into something real. When I was in middle and high school, I loved computers, robotics, and science, but I didn’t know how to explore these interests beyond online courses or textbooks. It was through guidance from teachers, professors, and peers that I learned how to take ideas and turn them into meaningful projects—projects that challenged me, taught me new skills, and sometimes even made a difference for others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want to be that guide for other students. Mentorship is about more than teaching concepts—it’s about helping someone see what’s possible, building their confidence, and showing them how to navigate challenges on their own. I love helping students break big ideas into manageable steps, experiment without fear of failure, and celebrate their progress along the way. Seeing a student light up when they realize they can create something they didn’t think they could is incredibly rewarding.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"516f9c33-3810-4f22-a428-21c56d85ff40\"}":{"__typename":"DeepDives","uuid":"516f9c33-3810-4f22-a428-21c56d85ff40","content":"\u003cp\u003eMy dream job is to be a \u003cstrong\u003esports analyst\u003c/strong\u003e for the Golden State Warriors. I’ve always been passionate about basketball, and I love analyzing games, players, and strategies. Being a sports analyst would let me combine that passion with my skills in data, statistics, and critical thinking. I imagine myself breaking down plays, studying player performance, and using data to provide insights that help fans and teams understand the game on a deeper level. Ultimately, my dream is to turn my love of basketball and analytics into a career that’s both challenging and meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"57c71e22-1436-4d32-8402-06852a832353\"}":{"__typename":"DeepDives","uuid":"57c71e22-1436-4d32-8402-06852a832353","content":"\u003cp\u003eMy introduction to artificial intelligence was through my aunt, a medical professional, who visited California for a conference on technological innovations in medicine. By actively listening to her perspective, my ultimate question was how artificial intelligence can be used in early disease detection. To fuel my curiosity, I started exploring computer science and its applications in machine learning. I delved into the nuances of AI, completing three courses by Dr. Andrew Ng from Stanford. I applied this knowledge through workshops at Microsoft and programming courses in Python offered by the University of Michigan, further deepening my passion for coding and data analytics. I was also inspired by my dad’s workplace, where machine learning is used to detect and classify cancer. By being exposed to how AI has a transformative impact on healthcare, I quickly realized the versatility of machine learning and how it can be leveraged to solve complex problems.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a3336215-7622-4061-b729-310bb894b2b5\"}":{"__typename":"DeepDives","uuid":"a3336215-7622-4061-b729-310bb894b2b5","content":"\u003cp\u003eDuring high school, I spent my summers diving into hands-on projects and research that let me explore my interests in computer science, AI, and engineering. One summer, I worked with a professor to develop a \u003cstrong\u003esmart fire-detection camera\u003c/strong\u003e using a Raspberry Pi and machine learning that could identify smoke and alert local residents. Another summer, I conducted \u003cstrong\u003eresearch on using machine learning to detect diabetes from ECG signals\u003c/strong\u003e, comparing multiple algorithms to improve prediction accuracy. I also interned at AI companies, working on real-world projects that combined data analysis, coding, and problem-solving.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese summers were some of the most valuable learning experiences I had; they taught me how to take an idea from concept to completion, how to work with mentors and peers, and how to solve problems creatively. They also showed me the excitement of applying what I learned in school to projects that could make a real impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"b8d7ac6b-1315-4810-aad9-7d5923c30a74\"}":{"__typename":"School","uuid":"b8d7ac6b-1315-4810-aad9-7d5923c30a74","name":"University of California San Diego","city":"La Jolla","type":"COLLEGE","state":"California","country":"United States","zip":"92093"},"Education:{\"uuid\":\"4969d3d3-1bf0-48f1-80ce-1336de99f356\"}":{"__typename":"Education","uuid":"4969d3d3-1bf0-48f1-80ce-1336de99f356","school":{"__ref":"School:{\"uuid\":\"b8d7ac6b-1315-4810-aad9-7d5923c30a74\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Artificial Intelligence","degree":null},"School:{\"uuid\":\"ff24fd72-b515-42c5-b57a-e83016197cd8\"}":{"__typename":"School","uuid":"ff24fd72-b515-42c5-b57a-e83016197cd8","name":"Leland High School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95120"},"Education:{\"uuid\":\"5414bedb-29c9-43a4-bcb2-0d6ef5d07582\"}":{"__typename":"Education","uuid":"5414bedb-29c9-43a4-bcb2-0d6ef5d07582","school":{"__ref":"School:{\"uuid\":\"ff24fd72-b515-42c5-b57a-e83016197cd8\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"14f8b807-8044-4242-bba4-b59c390fa4bb\"}":{"__typename":"MentorPublicProfile","uuid":"14f8b807-8044-4242-bba4-b59c390fa4bb","displayName":"Shrivas S.","slug":"shrivas-sudharsan","biography":"\u003cp\u003eShrivas is a first-year Artificial Intelligence student at the University of California San Diego (GPA: 4.0) who has spent the few years turning his passion for AI into real, working systems through machine learning models that detect diabetes from ECG signals, to a smart fire-detection camera using a \u003cstrong\u003eRaspberry Pi \u003c/strong\u003eand neural networks, to an \u003cstrong\u003eAI-powered\u003c/strong\u003e ocean debris coordination platform that placed \u003cstrong\u003e3rd at DataHacks 2026.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eShrivas currently conducts active learning research with Engineers for Exploration, building bioacoustic classification pipelines that help scientists study wildlife in the field. This research involves designing systems that learn efficiently from limited data, a challenge that mirrors what many students face when trying to make sense of complex problems with limited time and resources. It also reflects his broader belief that the most impactful technology is built not just to be technically impressive, but to solve problems that actually matter to people.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eShrivas works across a broad range of technical areas, such as \u003cstrong\u003eRAG\u003c/strong\u003e systems, \u003cstrong\u003eLLM \u003c/strong\u003efine-tuning, signal processing, \u003cstrong\u003ecomputer vision\u003c/strong\u003e, and full-stack AI development. He also has experience bringing these systems from prototype to deployment, not just building something that works in theory, but seeing it through until it works in practice. He has built and evaluated over a \u003cstrong\u003edozen machine learning algorithms \u003c/strong\u003eacross real-world datasets, and understands both the excitement and the frustration that comes with that process. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether it's a research pipeline, a hackathon project, or a passion project built late at night, he knows what it takes to go from a blank screen to something that's presentable to real-world audiences and competitions. He approaches mentoring the same way he approaches his own projects: break the big idea into clear steps, build something real, and don't be afraid to debug along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eShrivas has over \u003cstrong\u003esix months \u003c/strong\u003eof experience teaching K–12 students of different ages and skill levels, and genuinely enjoys the moment when a student goes from an idea to building an actual project. He believes the best learning happens when students are given the freedom to explore, experiment, and create, not just follow instructions. His goal is always to help students build the confidence and independence to keep going on their own long after the session ends. He takes time to understand what each student is excited about, and uses that as the foundation for everything they work on together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, Shrivas plays basketball, goes camping, follows investing, and watches sitcoms, and strongly believes you don't have to fit into one box to be great at what you do. You just have to be brave enough to try new things. If you're curious, motivated, or excited to try something new, Shrivas would love to help you get started.\u003c/p\u003e","teachingVideoPlaybackId":"x4O5ddpuGGvluGVl00agU4VADPsfN75D01GXNpl4WBZ2A","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne experience I’m especially proud of is building a smart fire-detection camera during high school. I worked with a professor to design a system using a Raspberry Pi and machine learning that could detect smoke and fire and send alerts to nearby residents.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat made this project meaningful wasn’t just the technical challenge, but the responsibility that came with it. I had to think carefully about accuracy, reliability, and how the system would behave in real situations where people’s safety mattered. There were many moments when things didn’t work as expected, and learning how to debug, adapt, and keep going was a huge growth experience for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis project changed how I think about learning. I realized that building something real—even when it’s difficult—is one of the best ways to truly understand a concept. It also showed me how empowering it can be to take an idea and turn it into something that could help others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat experience is a big reason why I enjoy mentoring students today. I love helping younger students move from “I’m curious about this” to “I built something I’m proud of,” and showing them that they’re capable of far more than they might expect.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f74c075b-e8ca-4c97-b9df-7254bf37ad8c\"}"},{"__ref":"Favorites:{\"uuid\":\"2ef24101-4dae-449c-8690-8b7be3523dde\"}"},{"__ref":"Favorites:{\"uuid\":\"59d8c4a6-f6ac-4210-9ae4-4abb24680365\"}"}],"causesSupported":[],"major":"Artificial Intelligence","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c7546f2c-c8b8-40b5-bbd3-5fcc38446dac\"}"},{"__ref":"DeepDives:{\"uuid\":\"516f9c33-3810-4f22-a428-21c56d85ff40\"}"},{"__ref":"DeepDives:{\"uuid\":\"57c71e22-1436-4d32-8402-06852a832353\"}"},{"__ref":"DeepDives:{\"uuid\":\"a3336215-7622-4061-b729-310bb894b2b5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c43f714b-3434-4fd1-8e01-50ebe4d26fb5/-/preview/-/format/jpg/","https://ucarecdn.com/08926b19-0410-4905-983c-85cc5550f3f9/-/preview/-/format/jpg/","https://ucarecdn.com/8de349f3-3fdc-4f56-9a5a-681c5fe75905/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4969d3d3-1bf0-48f1-80ce-1336de99f356\"}"},{"__ref":"Education:{\"uuid\":\"5414bedb-29c9-43a4-bcb2-0d6ef5d07582\"}"}],"hiredAt":"2026-01-18T05:29:49.707Z","topics":["K-6 Storybook","Sports Journalism","Finance / Investing","Coding / Progr
