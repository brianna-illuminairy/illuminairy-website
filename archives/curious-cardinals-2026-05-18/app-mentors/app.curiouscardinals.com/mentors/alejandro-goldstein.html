xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"10249f83-b6ec-4a49-8b49-3492bb58371b\"}":{"__typename":"DeepDives","uuid":"10249f83-b6ec-4a49-8b49-3492bb58371b","content":"\u003cp\u003eJoin more clubs! I didn't take advantage of all of the teams and groups I had around me and I wish I had. I'm now applying that advice in college and have recently joined rugby, robotics, and the solar car team. I'm learning so much and feel very fulfilled participating in all of those clubs.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"46c27b33-c01c-42be-95ec-5dc18a706230\"}":{"__typename":"DeepDives","uuid":"46c27b33-c01c-42be-95ec-5dc18a706230","content":"\u003cp\u003eI hope to make a positive, tangible impact on the environment. I love nature and see how much room there is for improvement in achieving a sustainable world. If I can use my skills to contribute to making our future one that will last, then I'll be extremely fulfilled.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:
