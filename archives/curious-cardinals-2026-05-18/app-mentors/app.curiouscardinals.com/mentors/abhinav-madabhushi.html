xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"887edea2-e3c1-4bd4-a43e-e8fe0c8c844d\"}":{"__typename":"Favorites","uuid":"887edea2-e3c1-4bd4-a43e-e8fe0c8c844d","photoUrl":"https://ucarecdn.com/7bd2c178-e5d1-4428-bec3-af1a1eb5211b/","title":"Settlers of Catan","type":"GAME"},"Favorites:{\"uuid\":\"6769cc38-e19c-4c99-91d2-1a7f27267c10\"}":{"__typename":"Favorites","uuid":"6769cc38-e19c-4c99-91d2-1a7f27267c10","photoUrl":"https://ucarecdn.com/1805f810-7bc2-40a6-886e-09bbeca183d0/","title":"Houston Rockets","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"c4a25605-e67b-4663-8ee9-d92ab2afa15e\"}":{"__typename":"Favorites","uuid":"c4a25605-e67b-4663-8ee9-d92ab2afa15e","photoUrl":"https://ucarecdn.com/fbab6e8d-5baf-4f34-a838-b2450dd08ffc/","title":"Hakeem the Dream","type":"ATHLETE"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4da18cb4-c36b-4a8f-a3cf-076c28660b92\"}":{"__typename":"DeepDives","uuid":"4da18cb4-c36b-4a8f-a3cf-076c28660b92","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to create a new invention for a major league sports team. I want to use the power of technology along with my mathematical prowess to create an algorithm that takes past game videos and comes up with a relevant strategy that the team can use to win the current game. I want to help the team win the championship using new and innovative strategies no one has used before.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c77bf1fe-1263-49a3-bbf1-dfb07d255347\"}":{"__typename":"DeepDives","uuid":"c77bf1fe-1263-49a3-bbf1-dfb07d255347","content":"\u003cp\u003eMy major, Data Theory, is the perfect combination between mathematics, statistics, and computer science. I have always been passionate about mathematics as a kid, and my major helps me apply mathematics to solve real-world problems. It also teaches me how to write code in different programming languages, which I can use as a tool to solve difficult problems. Looking at new data excites me, which is why this major is a perfect fit for me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"f2813f54-b998-4298-89fa-72de5c50074e\"}":{"__typename":"DeepDives","uuid":"f2813f54-b998-4298-89fa-72de5c50074e","content":"\u003cp\u003eAs a middle school student, I used to be the shy kid who used to sit at the back of the classroom but was always extremely engaged in academics. My books used to be my best friend, and my social anxiety prevented me from talking to other people. As I came to high school, I realized I needed to break this barrier to be able to apply my academics to solve real-world problems. This is when I got myself into playing all kinds of different sports, and after some time I found out that I was good at them. I loved playing sports, and this passion for sports and academics led me to pursue the career of a sports analyst. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a7569ad5-86cc-4db4-bcbb-0a019cdce87f\"}":{"__typename":"DeepDives","uuid":"a7569ad5-86cc-4db4-bcbb-0a019cdce87f","content":"\u003cp\u003eDuring my spare time, I like to do anything sports-related. I watch and play cricket and basketball, and also go to the gym. I also read books related to sports analytics. I'm also really into TV series that portray lawyers and doctors. My two favorite TV shows are Suits and Doctor House. Other than that, I love to hang with my friends and build a community. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"998f6353-a1f0-4491-91d5-f0d61770fb85\"}":{"__typename":"School","uuid":"998f6353-a1f0-4491-91d5-f0d61770fb85","name":"CHIREC International School","city":"Kondapur","type":"HIGH","state":"Telangana","country":"India","zip":"500084"},"Education:{\"uuid\":\"b0ee7541-0f52-4484-b937-f89cccd727be\"}":{"__typename":"Education","uuid":"b0ee7541-0f52-4484-b937-f89cccd727be","school":{"__ref":"School:{\"uuid\":\"998f6353-a1f0-4491-91d5-f0d61770fb85\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"6bc163b2-6488-4402-92fc-c34e0c322dbf\"}":{"__typename":"Education","uuid":"6bc163b2-6488-4402-92fc-c34e0c322dbf","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Data Theory","degree":null},"MentorPublicProfile:{\"uuid\":\"18103660-2c1a-41a2-9cd7-0f20acafbb2c\"}":{"__typename":"MentorPublicProfile","uuid":"18103660-2c1a-41a2-9cd7-0f20acafbb2c","displayName":"ABHINAV M.","slug":"abhinav-madabhushi","biography":"\u003cp\u003eMy life has revolved around mathematics and sports from the time I can remember it. From getting into abacus classes as a kid to placing 9th internationally in math Olympiads to majoring in a math-based major at UCLA, I have always enjoyed solving math problems. For me, math has more to do with logic and problem-solving than it has to do with just numbers. Of course, the numbers make it even more fun.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy dad joined me in cricket coaching at the age of 9, and since then I have played Tennis, Table Tennis, and finally settled on Basketball as my favorite sport. Currently, I play basketball and cricket, which is why they are my favorite sports to analyze as well. I remember the days I used to wake up to watch NBA games at 4 am in the morning, supporting the Houston Rockets and their newfound small ball lineup. More than the team and the players, I wanted the concept to succeed, and even though they didn't win in 2020, it set the foundation of how the NBA is going to change in the coming years.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis gets me to why I'm so passionate about sports analytics. During high school, I read several books in sports analytics such as Mathletics, Sprawlball, Basketball on paper, and many more. From the minute I stepped into UCLA, I have been engaged with the Bruin Sports Analytics Club, writing three articles, a research paper, serving as the membership development chair by hosting technical workshops, to finally being the Vice President of the club. I also started my own blog named sportstechnalytics, where I write articles on contemporary sports topics. I am currently also doing an internship in sports analytics at an insurance company.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy dream job is to become a data scientist for a professional sporting team because I feel like it will let me be a competitive person while also combining my passion for sports and mathematics. For me, data science is more of an art that uses programming languages as tools to analyze millions of numbers in the form of data to get meaningful results, and being able to come up with strategies for the coaching staff to implement is a meaningful result to me that also makes me happy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"PYV0002TKsLC2Afsti2S5GsydZow62k5h6cQME8RqoGuU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"887edea2-e3c1-4bd4-a43e-e8fe0c8c844d\"}"},{"__ref":"Favorites:{\"uuid\":\"6769cc38-e19c-4c99-91d2-1a7f27267c10\"}"},{"__ref":"Favorites:{\"uuid\":\"c4a25605-e67b-4663-8ee9-d92ab2afa15e\"}"}],"causesSupported":[],"major":"Data Theory","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4da18cb4-c36b-4a8f-a3cf-076c28660b92\"}"},{"__ref":"DeepDives:{\"uuid\":\"c77bf1fe-1263-49a3-bbf1-dfb07d255347\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2813f54-b998-4298-89fa-72de5c50074e\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7569ad5-86cc-4db4-bcbb-0a019cdce87f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9267759a-b29a-4db3-8eb4-3990deb8fef8/-/preview/-/format/jpg/","https://ucarecdn.com/c851a1e2-9325-4d2a-ae08-109bfafc519c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"b0ee7541-0f52-4484-b937-f89cccd727be\"}"},{"__ref":"Education:{\"uuid\":\"6bc163b2-6488-4402-92fc-c34e0c322dbf\"}"}],"hiredAt":"2024-07-25T02:40:44.886Z","topics":["Calculus","Statistics","Algebra I","Algebra II","Precalculus / Trigonometry","Coding / Programming","Sports Analytics","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename
