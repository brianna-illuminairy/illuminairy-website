\"}":{"__typename":"DeepDives","uuid":"08ea26ff-d530-4512-8e81-2faf33d124b6","content":null,"videoPlaybackId":"kgsW01dGE00aBfYKVHv4o52qdVr8NaatAnZOfvCCq01sK00","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"f6d817a3-8035-45eb-9184-6a6355fc41b7\"}":{"__typename":"School","uuid":"f6d817a3-8035-45eb-9184-6a6355fc41b7","name":"Hinsdale Central High School","city":"Hinsdale","type":"HIGH","state":"Illinois","country":"United States","zip":"60521"},"Education:{\"uuid\":\"50cffef7-5d29-4cd0-82cc-a4050e759c37\"}":{"__typename":"Education","uuid":"50cffef7-5d29-4cd0-82cc-a4050e759c37","school":{"__ref":"School:{\"uuid\":\"f6d817a3-8035-45eb-9184-6a6355fc41b7\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"c5d3b7af-f804-41f0-99b0-c7400522d153\"}":{"__typename":"Education","uuid":"c5d3b7af-f804-41f0-99b0-c7400522d153","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"54444c93-0de2-4743-ada3-5f4c368915af\"}":{"__typename":"MentorPublicProfile","uuid":"54444c93-0de2-4743-ada3-5f4c368915af","displayName":"Will S.","slug":"will-schmeltz","biography":"\u003cp\u003eHi! My name is Will, and I'm a current Junior at Duke University. At Duke, my biggest involvement is the Duke University Debating Society. The Duke University Debating Society has been an amazing extension of my involvement with the debate team in high school, for which I was team captain. So far, I’ve had the opportunity to compete in Mexico City, at Cambridge University, and at Vanderbilt University. Another great passion of mine is music. I played standup bass for nine years before I fully transitioned to electric bass, which I’ve played for six years. I've recently picked up acoustic guitar and songwriting since coming to college! I’m also a huge fan of almost any sport and love to talk ball with anyone willing (especially if you're a Steelers, Cubs, or Manchester United Fan). \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne fun fact about me is that I love roller coasters and have ridden eighty so far. Roller coasters and amusement parks are some of my favorite pastimes and they are also what drew me to engineering. Becoming well versed in the mechanical engineering discipline through course and project work has been an incredible learning experience and immensely fulfilling. The problem solving, people skills, technical proficiencies, and so much more that you learn by puzzling through new concepts and tackling unknown challenges are unmatched. I can't wait to help students explore their passion for engineering early on so that they're ready to hit the ground running when they get to college!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBetween May and December of 2025, I've had the opportunity to live in both France and Spain for extended periods. Pushing myself out of my comfort zone and making the most of these opportunities has been one of the greatest learning and character building experiences of my entire life. Learning new languages, experiencing new ways of life, and traveling are just a few of the wonderful experiences that I've gained a newfound appreciation for and want to continue seeking going forward. If you want to know anything about it, I will talk about it!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCuriosity, trying new things, and exploring my interests are all personal cornerstones of mine. Between school and summer work I've learned about and gained experience in the worlds of engineering, big tech and startup culture in Silicon Valley, songwriting, debate, economics and finance, community service, and so much more. Dipping from many buckets is essential to personal and professional development, and I can't wait to help your Curious Cardinals find their wings!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing curious has made me who I am today and will allow me to grow into the person I will be tomorrow. I am forever grateful for the people that pushed me to try everything and shy away from nothing. I can't wait to pay it forward by instilling this same confidence and curiosity in as many students as I can! I'm so excited to meet you and your student soon!\u003c/p\u003e","teachingVideoPlaybackId":"Umvm5PiITxO9DS5SO6u2fle9Xv62o6e9c02ZiwYXjDBo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"69e37a79-52bf-4fd2-bf12-3752db49d642\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed430928-4789-44f2-8a56-715a7d79ac9d\"}"},{"__ref":"DeepDives:{\"uuid\":\"4e158a04-0047-49ce-97bd-317b2f00343c\"}"},{"__ref":"DeepDives:{\"uuid\":\"08ea26ff-d530-4512-8e81-2faf33d124b6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/556e1fa2-b862-42e2-80f9-d4b2e383dded/-/preview/-/format/jpg/","https://ucarecdn.com/c7c1a7c2-4031-43b4-8eb7-da349c91023d/-/preview/-/format/jpg/","https://ucarecdn.com/ac0c2298-e0af-43aa-8831-6010a2d5e561/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"50cffef7-5d29-4cd0-82cc-a4050e759c37\"}"},{"__ref":"Education:{\"uuid\":\"c5d3b7af-f804-41f0-99b0-c7400522d153\"}"}],"hiredAt":"2024-06-15T05:16:22.683Z","topics":["Precalculus / Trigonometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","Calculus","Statistics","Physics","Writing","Academic Coaching","Music","Business / Entrepreneurship","Sports Analytics","Public Speaking","Debate"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampai
