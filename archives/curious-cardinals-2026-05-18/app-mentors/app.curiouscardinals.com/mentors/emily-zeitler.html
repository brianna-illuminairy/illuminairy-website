xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"72a587de-6bd8-4245-92b2-55a367a6d2e5\"}":{"__typename":"DeepDives","uuid":"72a587de-6bd8-4245-92b2-55a367a6d2e5","content":"\u003cp\u003eI would like to further explore the value of human communication and the processes that reveal how individuals connect emotionally and intellectually. As a psychology major, my interest in this subject has blossomed into a skill for thinking deeply about the motivations that influence decision-making. Psychology has given me the opportunity to express my personable and creative character, along with my understanding of how people seek solutions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a7556bc9-4632-4a95-9b02-e6c919bede0d\"}":{"__typename":"DeepDives","uuid":"a7556bc9-4632-4a95-9b02-e6c919bede0d","content":"\u003cp\u003eIn my spare time, I enjoy spending time with my friends and talking with them about all facets of life. I like to hear about how they spend their days, the ups and the downs, as well as anything interesting that we can discuss. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d8149a3e-3671-4d46-ab92-12d1a11ad432\"}":{"__typename":"DeepDives","uuid":"d8149a3e-3671-4d46-ab92-12d1a11ad432","content":"\u003cp\u003eMentorship matters to me because I believe in the importance of collaboration and helping others where you feel as though you have expertise that could be of use. I believe that this is the best way to learn and expand our knowledge. A mentor provides you with guidance, and a source of support in your efforts. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f53179b1-8863-4b13-b028-ae11d834c22a\"}":{"__typename":"DeepDives","uuid":"f53179b1-8863-4b13-b028-ae11d834c22a","content":"\u003cp\u003eA few years ago, I had the incredible opportunity to participate in a transformative event with Glam4Good, a non-profit organization dedicated to fostering positive social change through fashion. Glam4Good embodies the joy that fashion can bring, using it as a tool to raise awareness and bolster self-esteem. In this initiative, I played a key role in planning and executing an event aimed at bringing joy and empowerment to courageous teens facing terminal illnesses. The evening was imbued with uplifted spirits and hope, leaving a lasting impact on everyone involved. Inspired by this experience, I took the initiative to establish a Glam4Good chapter at my high school, with the objective of spreading the organization's mission and providing support. We organized various events and initiatives to raise awareness and honor courage, such as hosting Glam4Good leadership presentations and launching programs like Teens4Good, which encourages youth involvement in public service. Leading weekly Glam4Good meetings became a highlight of my high school experience, enabling me to share my passion for sustainability, volunteerism, youth empowerment, and women's advocacy with my peers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"ebe5e575-6532-4978-8c24-9de0e98cd08e\"}":{"__typename":"School","uuid":"ebe5e575-6532-4978-8c24-9de0e98cd08e","name":"Horace Mann School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"4e2b7bdb-0f29-4aff-9659-d9b4ba546c2c\"}":{"__typename":"Education","uuid":"4e2b7bdb-0f29-4aff-9659-d9b4ba546c2c","school":{"__ref":"School:{\"uuid\":\"ebe5e575-6532-4978-8c24-9de0e98cd08e\"}"},"startYear":"2010","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"84235867-1f6e-4c0e-9538-b50746b1cf55\"}":{"__typename":"Education","uuid":"84235867-1f6e-4c0e-9538-b50746b1cf55","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"f5d4f6c2-7649-4701-93b4-46f2adf9b5ab\"}":{"__typename":"MentorPublicProfile","uuid":"f5d4f6c2-7649-4701-93b4-46f2adf9b5ab","displayName":"Emily Z.","slug":"emily-zeitler","biography":"\u003cp\u003eHi! My name is Emily, and I am originally from New York City. I am majoring in Psychology and minoring in Art History. I am also studying Marketing. I have years of experience as a camp counselor, and through psychology truly value the importance of human communication. I understand the importance of executive function skills, as well as organization in producing positive learning outcomes! I consider myself a kind, genuine, and creative person who is always eager to learn more! I’ve always been committed to making a difference beyond the classroom through non-profit outreach. This journey began in high school with my involvement in the service-learning team, where I first truly engaged in community outreach. In college, I joined Supplies for Dreams, a non-profit dedicated to supporting Chicago students with resources for academic success. \u003c/p\u003e","teachingVideoPlaybackId":"2ALyVk7cATiZjcjelMCsSkcQ7hVr5C01V5B02oD3nuvQ4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eDesigning an Independent Study on the Evolution of Textile Design \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"72a587de-6bd8-4245-92b2-55a367a6d2e5\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7556bc9-4632-4a95-9b02-e6c919bede0d\"}"},{"__ref":"DeepDives:{\"uuid\":\"d8149a3e-3671-4d46-ab92-12d1a11ad432\"}"},{"__ref":"DeepDives:{\"uuid\":\"f53179b1-8863-4b13-b028-ae11d834c22a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/33eb14d2-6952-42a2-b88f-d4c068daf440/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4e2b7bdb-0f29-4aff-9659-d9b4ba546c2c\"}"},{"__ref":"Education:{\"uuid\":\"84235867-1f6e-4c0e-9538-b50746b1cf55\"}"}],"hiredAt":"2025-02-17T18:27:31.138Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Biology","Writing","Executive Function","Reading","History"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"emily-zeitler\"}})":{"__re
