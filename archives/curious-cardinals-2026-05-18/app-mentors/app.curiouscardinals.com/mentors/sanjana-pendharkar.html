xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1f7654ed-e966-487d-b124-0297fd21e0a5\"}":{"__typename":"DeepDives","uuid":"1f7654ed-e966-487d-b124-0297fd21e0a5","content":"\u003cp\u003eMy parents. They immigrated to America to give me a better life, and cultivated a sense of responsibility, a hunger for learning, and a fire for growth in me early on. They asked me to think critically about how I could help others, transforming my perception of what a good education meant (i.e. asking questions and challenging assumptions).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"9366a195-7ec6-494b-b115-9aba38310140\"}":{"__typename":"DeepDives","uuid":"9366a195-7ec6-494b-b115-9aba38310140","content":"\u003cp\u003eI was naturally quiet, studious, and ambitious. I appreciated reading \u003cem\u003eOf Mice and Men\u003c/em\u003e cover to cover, wrote a full novel about French diplomats, and genuinely enjoyed solving math workbooks in my free time. Somewhere along the way, I learned that technical brilliance alone isn't enough. The ability to articulate your ideas, ask the right questions, and confidently advocate for your work is just as critical as mastering the material itself. That's a lesson I carry into every tutoring session: I help students find the confidence to speak up in spaces where their voices deserve to be heard.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"e187a7fb-2e07-4c00-a8c5-e87ef1383aec\"}":{"__typename":"DeepDives","uuid":"e187a7fb-2e07-4c00-a8c5-e87ef1383aec","content":"\u003cp\u003eRight now, I'm deep in the world of LLM evaluation techniques. As large language models (LLMs) become more prevalent, devising and implementing robust evaluation methods/benchmarks becomes critical. I've been studying frameworks like Ragas (reference-free evaluation method for Retrieval Augmented Generation), ARES (Automated Evaluation for RAG systems), and SelfEval (models assess their own outputs). I'm synthesizing my research into a short textbook that breaks down these methodologies, when to use each one, and how to implement them thoughtfully. My goal is to create a resource that helps developers and researchers to build more reliable, trustworthy AI systems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"3268af12-ff23-4452-afda-b43c198d927a\"}":{"__typename":"School","uuid":"3268af12-ff23-4452-afda-b43c198d927a","name":"South Brunswick High School","city":"South Brunswick Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08852"},"Education:{\"uuid\":\"37f5de7c-5bdf-45ef-97b4-1e69e4ac5476\"}":{"__typename":"Education","uuid":"37f5de7c-5bdf-45ef-97b4-1e69e4ac5476","school":{"__ref":"School:{\"uuid\":\"3268af12-ff23-4452-afda-b43c198d927a\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a61a129e-3632-4145-86eb-0180f6a7589f\"}":{"__typename":"School","uuid":"a61a129e-3632-4145-86eb-0180f6a7589f","name":"Rutgers University–New Brunswick","city":"New Brunswick","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08901"},"Education:{\"uuid\":\"5ce3d31d-01d2-43dc-b551-4f78e5dbd5d7\"}":{"__typename":"Education","uuid":"5ce3d31d-01d2-43dc-b551-4f78e5dbd5d7","school":{"__ref":"School:{\"uuid\":\"a61a129e-3632-4145-86eb-0180f6a7589f\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2022","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"7c9a4e56-9726-46ae-b2eb-d30c6c6f4c01\"}":{"__typename":"MentorPublicProfile","uuid":"7c9a4e56-9726-46ae-b2eb-d30c6c6f4c01","displayName":"Sanjana P.","slug":"sanjana-pendharkar","biography":"\u003cp\u003eHi there! I'm Sanjana, a driven data professional who is excited to showcase how coding transforms into real-world social impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passion for programming and math stems from the positive outcomes they can have in overlooked populations. For instance, in undergrad, I launched Catalysts for Change, a mentorship-based ed-tech startup, building the website and carrying out the marketing from scratch. As I started working, I won my company’s Early Career Research Program Fellowship, a prestigious offering for emerging researchers to pursue a self-directed research study. I developed “The Third Eye”, an iOS app that supported low vision communities with navigating transit. At the culmination of my study, I had delivered 5+ technical presentations to senior leadership, and submitted 2 manuscripts to leading journals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI didn’t just stop there, though. During my nights and weekends, I built two full-stack apps for neurodivergent individuals (one for their productivity management; the other for improving written communication), and partially developed a talking plushie that helped little children learn English through an Impact Labs Fellowship. I live, breathe and dream in code – the only difference is that I see every line as an opportunity to bring equity and positivity into another life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith respect to my teaching skills, I’ve been a tutor since high school. I can teach all subjects, but am most excited about programming, math, biology, and English. My technical toolkit includes Python, SQL, full-stack development, data visualization, and machine learning. What sets me apart is my ability to break down complex concepts into digestible, relatable pieces. I frequently use analogies when explaining difficult topics (e.g., data structures and algorithms, recursion, graph theory), and connect each aspect of the concept with your student’s interests. Whether your student is a veteran programmer/mathematician, or just starting out, I’m excited to catalyze their growth and give them an unfair advantage by focusing on their passions and the questions they ask.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work, I love fashion, and experimenting with different styles. My favorite store as of now is Mango (I would highly suggest getting one of their coats). I also love animals, and reading about their physiology – my friends and family know that if I wasn’t a programmer, I would be a veterinarian!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm a huge believer that your technical skills can be channeled into whatever you're passionate about, in a way that supports social good. I primarily work with students in high school, but would love to take on motivated middle school students as well. If you want to learn how to code, analyze data, discuss integrals, or build something meaningful, definitely reach out!\u003c/p\u003e","teachingVideoPlaybackId":"IRJPy9tsctD00U67fWip9avN01ZDlo2bb00y7X1dBP302ug","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{
