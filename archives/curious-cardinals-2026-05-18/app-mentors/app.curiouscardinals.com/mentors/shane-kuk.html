xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9e323797-2a6a-4b8e-8ddb-90bcf14e3bc5\"}":{"__typename":"DeepDives","uuid":"9e323797-2a6a-4b8e-8ddb-90bcf14e3bc5","content":"\u003cp\u003eI’d tell my younger self that you don’t have to carry everything alone to be strong. Staying quiet to prove you could handle it only made things heavier. The moments that truly changed your path were the ones where you asked questions, reached out, and let yourself learn from others. Asking for help does not make you smaller. It helps you become who you are meant to be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1b72b4f3-6b4f-490b-a3a0-3c0262f706d7\"}":{"__typename":"DeepDives","uuid":"1b72b4f3-6b4f-490b-a3a0-3c0262f706d7","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is learning and performing Rachmaninoff’s Piano Concerto No. 2. It’s been a lifelong dream of mine, not just because of its technical challenge, but because of the depth of emotion it carries. Chasing it represents years of discipline, patience, and growth, and I want to reach a point where I can fully express what that music holds and know I earned every note.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"803002e5-01cc-432f-8b82-145ec4531350\"}":{"__typename":"DeepDives","uuid":"803002e5-01cc-432f-8b82-145ec4531350","content":"\u003cp\u003eBecause mentorship changed the trajectory of my life. I was once the student who struggled and felt stuck, and it was my mentors who took the time to guide me. They helped me build my first game, publish my first website, and transform math from a source of frustration into something I could excel at at the highest level. Mentorship is my way of carrying that forward and being for someone else what they were for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"7862b858-c46d-4109-bd63-81ef0e6e13d9\"}":{"__typename":"DeepDives","uuid":"7862b858-c46d-4109-bd63-81ef0e6e13d9","content":"\u003cp\u003eIn my spare time, I created Tech \u0026amp; Tunes, my own volunteer organization. I arrange and rehearse music to perform for nursing home residents, which is something I really enjoy creatively. But what I find most fulfilling is sitting down with residents and teaching them how to use their devices, troubleshooting with them, and just connecting over technology. Bridging that generation gap with both music and tech feels genuinely meaningful to me, and it's honestly one of the most rewarding things I do outside of school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"42b74ffc-d574-4009-a4da-b553145f45e5\"}":{"__typename":"School","uuid":"42b74ffc-d574-4009-a4da-b553145f45e5","name":"Arnold O. Beckman High School","city":"Irvine","type":"HIGH","state":"California","country":"United States","zip":"92602"},"Education:{\"uuid\":\"499401b6-f751-4c78-8c8f-2f8fcf84ab3c\"}":{"__typename":"Education","uuid":"499401b6-f751-4c78-8c8f-2f8fcf84ab3c","school":{"__ref":"School:{\"uuid\":\"42b74ffc-d574-4009-a4da-b553145f45e5\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"f7a70d13-5bbd-4f54-a8cc-5e1ae704435e\"}":{"__typename":"Education","uuid":"f7a70d13-5bbd-4f54-a8cc-5e1ae704435e","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Computer Science and Linguistics","degree":null},"MentorPublicProfile:{\"uuid\":\"f37ad6ac-4fd4-4237-9e21-f2913b8f2c62\"}":{"__typename":"MentorPublicProfile","uuid":"f37ad6ac-4fd4-4237-9e21-f2913b8f2c62","displayName":"Shane K.","slug":"shane-kuk","biography":"\u003cp\u003eHi! I’m Shane, a Computer Science and Linguistics major at UCLA. I help students turn interests in technology and creative work into strong projects, clear narratives, and competitive college applications.\u003c/p\u003e\u003cp\u003eI focus on execution — helping students go from ideas to real outcomes they can confidently share.\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/h2\u003e\u003cbr\u003e\u003cp\u003eI support K-12 students with:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects\u003cbr\u003e\u003c/strong\u003eStarting and growing projects such as apps, clubs, nonprofits, or creative platforms like YouTube channels and portfolios\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eComputer science \u0026amp; STEM support\u003cbr\u003e\u003c/strong\u003ePython, JavaScript, Unity, game/web development, and project-based learning that builds both skill and confidence\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePortfolio building\u003c/strong\u003e \u003cbr\u003eCurating recordings, repertoire, and performance videos to showcase for auditions or applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege applications \u0026amp; strategy\u003cbr\u003e\u003c/strong\u003eSchool selection, essay brainstorming and editing, resume building, and extracurricular descriptions that clearly communicate impact\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSTEM subject guidance\u003c/strong\u003e \u003cbr\u003eMath, Physics, Computer Science\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003chr\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eExperience \u0026amp; background\u003c/strong\u003e\u003c/h2\u003e\u003cbr\u003e\u003cp\u003eI’ve worked as a \u003cstrong\u003esoftware engineering intern\u003c/strong\u003e on applications that provide technical solutions for \u003cstrong\u003elocal and state government agencies\u003c/strong\u003e, improving usability, security, and data processing in real operational systems.\u003c/p\u003e\u003cp\u003eAt UCLA, I’m a developer with \u003cstrong\u003eNova, Tech for Good\u003c/strong\u003e, where I help build software solutions for \u003cstrong\u003enationwide and international nonprofits\u003c/strong\u003e, focusing on accessibility, automation, and impact-driven design.\u003c/p\u003e\u003cp\u003eI’m also a \u003cstrong\u003econtent creator and musician\u003c/strong\u003e, running a piano YouTube channel (@kukster93). Creating content has strengthened my ability to communicate ideas clearly, stay consistent, and present work effectively — skills that translate directly to applications and portfolios.\u003c/p\u003e\u003cp\u003eIn the past, I’ve \u003cstrong\u003etutored students\u003c/strong\u003e of various levels and academic subjects such as \u003cstrong\u003eAP Calculus\u003c/strong\u003e, \u003cstrong\u003ePrecalculus\u003c/strong\u003e, \u003cstrong\u003eTrigonometry\u003c/strong\u003e, \u003cstrong\u003eAP Microeconomics\u003c/strong\u003e, and more.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming/building innovative project ideas with real-world impact\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a structured week-by-week roadmap so you feel confident and goal-oriented\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGuiding you through application material preparation from essays and resumes to portfolios and presentation practice\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down complex academic concepts into easy, simple steps\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003chr\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eAdmissions perspective\u003c/strong\u003e\u003c/h2\u003e\u003cbr\u003e\u003cp\u003eI was accepted to \u003cstrong\u003eUCLA, UC Irvine (Regents’ Scholarship), UC Santa Barbara (Regents’ Scholarship), UC San Diego, UIUC, and the U.S. Air Force Academy\u003c/strong\u003e. *UC Regents’ Scholarships are awarded to roughly the \u003cstrong\u003etop 1–2% of applicants\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eI help students approach applications strategically, authentically, and without unnecessary stress.\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eOutside of academics\u003c/strong\u003e\u003c/h2\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not coding or writing, I’m usually at the piano, editing videos for my YouTube channel, playing volleyball or pickleball, or experimenting with new baking recipes!\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003cbr\u003e\u003cp\u003eIf you’re looking for guidance on building meaningful projects, crafting strong essays, or developing skills that stand out, I’d love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"y1Enw01bIdLUSbVq202hSeEaZvr9RX7M7LN02ITMZOv8Fk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science and Linguistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9e323797-2a6a-4b8e-8ddb-90bcf14e3bc5\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b72b4f3-6b4f-490b-a3a0-3c0262f706d7\"}"},{"__ref":"DeepDives:{\"uuid\":\"803002e5-01cc-432f-8b82-145ec4531350\"}"},{"__ref":"DeepDives:{\"uuid\":\"7862b858-c46d-4109-bd63-81ef0e6e13d9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e3ec2446-200f-4295-b561-f0f56f997323/-/preview/-/format/jpg/","https://ucarecdn.com/bb0e2034-fd14-449d-a92c-982e67756e8c/-/preview/-/format/jpg/","https://ucarecdn.com/d07efa35-8111-4c20-978c-d6a8ef3ce81c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"499401b6-f751-4c78-8c8f-2f8fcf84ab3c\"}"},{"__ref":"Education:{\"uuid\":\"f7a70d13-5bbd-4f54-a8cc-5e1ae704435e\"}"}],"hiredAt":"2026-01-28T18:37:50.826Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Academic Coaching","Executive Function","College Essay Writing","Economics","Computer Science","Reading","Music","Video / Photography","Coding / Programming","Web Design","Game Design","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignV
