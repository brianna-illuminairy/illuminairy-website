xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bb69d553-0a65-49c9-8a80-561ba0ac26dc\"}":{"__typename":"Favorites","uuid":"bb69d553-0a65-49c9-8a80-561ba0ac26dc","photoUrl":"https://ucarecdn.com/0003e588-b9ba-476f-83ce-d532b3a0ab95/","title":"1989","type":"ALBUM"},"Favorites:{\"uuid\":\"55dfed63-f034-4729-a251-755b05e353d3\"}":{"__typename":"Favorites","uuid":"55dfed63-f034-4729-a251-755b05e353d3","photoUrl":"https://ucarecdn.com/8c0889d9-de6b-4f98-bf7a-3a2acd71b318/","title":"NYC","type":"CITY"},"CausesSupported:{\"uuid\":\"256b78f1-0682-403e-b51c-f851e86e0ae5\"}":{"__typename":"CausesSupported","uuid":"256b78f1-0682-403e-b51c-f851e86e0ae5","name":"Mental health ","description":"\u003cp\u003eI volunteers with mental health nonprofits to promote mental well-being. \u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"3e2ec443-7ec5-482e-86a2-198260b725cc\"}":{"__typename":"DeepDives","uuid":"3e2ec443-7ec5-482e-86a2-198260b725cc","content":"\u003cp\u003eI was also actively involved in campus life as a cheerleader, where I served as Co-Captain. I especially enjoyed the AP Research Capstone program and remained highly engaged both in the classroom and across campus activities.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f4696208-b540-49b8-8dca-54b4b60c634e\"}":{"__typename":"DeepDives","uuid":"f4696208-b540-49b8-8dca-54b4b60c634e","content":"\u003cp\u003eI enjoy sound meditation, ice cream (coffee and strawberry is my favorite combination), and baking chocolate chip cookies.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"0e75a0e6-5869-4638-9b52-00e258903d6e\"}":{"__typename":"DeepDives","uuid":"0e75a0e6-5869-4638-9b52-00e258903d6e","content":"\u003cp\u003eAfter benefiting from mentorship in high school, I went on to mentor my sister through her college application process and the development of her passion project. I see mentorship as a critical bridge that connects students to guidance, opportunity, and long-term support.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"1ccea8a2-2f75-45f5-a8bd-59691d0f61f6\"}":{"__typename":"School","uuid":"1ccea8a2-2f75-45f5-a8bd-59691d0f61f6","name":"Miami Senior High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33135"},"Education:{\"uuid\":\"833a42f7-31f0-454a-8730-bf1f2de4bfce\"}":{"__typename":"Education","uuid":"833a42f7-31f0-454a-8730-bf1f2de4bfce","school":{"__ref":"School:{\"uuid\":\"1ccea8a2-2f75-45f5-a8bd-59691d0f61f6\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"9b39f34c-92ae-442f-84f2-26b84362fd14\"}":{"__typename":"Education","uuid":"9b39f34c-92ae-442f-84f2-26b84362fd14","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Cognitive Science and Statistics ","degree":null},"MentorPublicProfile:{\"uuid\":\"a51f2594-f29c-45a0-a131-9934d3828c71\"}":{"__typename":"MentorPublicProfile","uuid":"a51f2594-f29c-45a0-a131-9934d3828c71","displayName":"José C.","slug":"jos-caballero","biography":"\u003cp\u003eMy work centers on research, healthcare, and statistics, with a focus on using data-driven approaches to improve access and outcomes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I founded a mental health student club that grew to over 500 members and raised $5,000 to support awareness and outreach initiatives. This experience introduced me to the importance of combining community engagement with measurable impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBuilding on this work, I helped my sister establish a nonprofit in Miami that translates healthcare research from English into Spanish through accessible online guides. The goal is to bridge gaps in health information for Spanish-speaking communities. This initiative contributed to her receiving a Miami Herald award. To date, the organization has built a volunteer staff of 30, raised $10,000, and reached over 20,000 unique online visitors.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Columbia, I have continued to apply both technical and analytical skills to real-world problems. I developed a Python-based applet—an interactive webpage—that uses machine learning to predict heat vulnerability across New York City. This project integrates environmental and behavioral data to identify communities at greater risk, with the goal of informing targeted interventions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, I have leveraged my statistics training in academic research. My upcoming peer-reviewed paper, \u003cem\u003e“The Effects of Health and Income Benefits by Age, Race, and Legal Status: Evidence from the Health-Inclusive Poverty Measure,”\u003c/em\u003e examines how different measurement frameworks shape our understanding of the impact of health coverage. This work reflects my broader interest in how methodological choices influence policy conclusions and resource allocation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy research and advocacy have also been recognized beyond the classroom. I have been invited to present my work at organizations such as Meta and at SXSW. My work has also been featured in USA Today and ABC News, and my writing has been published in the Harvard Public Health Magazine. I also had the opportunity to ring the Nasdaq Opening Bell, reflecting the broader visibility and impact of my work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcross these experiences, I aim to remain flexible in the projects I take on while consistently quantifying impact and building for long-term sustainability. I am particularly interested in opportunities that combine research with real-world impact. I would welcome the opportunity to learn more about your work, explore potential collaboration, and contribute to advancing your project.\u003c/p\u003e","teachingVideoPlaybackId":"5IcTImYiwRvJOz4qM9mgNDNtfWTPjpgeMu9vmV8HDSc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I am most proud of is completing Columbia Core Curriculum. While it is a requirement for all students, for me it became one of the most formative parts of my college experience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI initially found the Core challenging. Reading dense philosophical texts, engaging in fast-paced discussions, and writing analytically pushed me outside my comfort zone. But over time, those same challenges became opportunities. I learned how to read closely, question assumptions, and articulate my ideas with clarity and confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I value most about the Core is not just the content, but the way it shaped how I think. It taught me to engage with complex ideas across disciplines—from philosophy and literature to machine learning—and to connect them to real-world issues. \u003c/p\u003e\u003cbr\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"bb69d553-0a65-49c9-8a80-561ba0ac26dc\"}"},{"__ref":"Favorites:{\"uuid\":\"55dfed63-f034-4729-a251-755b05e353d3\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"256b78f1-0682-403e-b51c-f851e86e0ae5\"}"}],"major":"Cognitive Science and Statistics ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3e2ec443-7ec5-482e-86a2-198260b725cc\"}"},{"__ref":"DeepDives:{\"uuid\":\"f4696208-b540-49b8-8dca-54b4b60c634e\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e75a0e6-5869-4638-9b52-00e258903d6e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/603b0037-2820-4e0e-a312-be9ec3c1cd12/-/preview/-/format/jpg/","https://ucarecdn.com/bca16976-e4b1-48b7-8c20-8b04f487c3a9/-/preview/-/format/jpg/","https://ucarecdn.com/b927f97e-1c64-4a89-a7e0-7010613fd074/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"833a42f7-31f0-454a-8730-bf1f2de4bfce\"}"},{"__ref":"Education:{\"uuid\":\"9b39f34c-92ae-442f-84f2-26b84362fd14\"}"}],"hiredAt":"2026-03-29T20:57:29.228Z","topics":["History Project","Medicine / Health","Web Design","STEM Project","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/9f7019f6-5b03-4f9f-a136-5aeaf2c62de6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jos-caballero\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a51f2594-f29c-45a0-a131-9934d3828c71\"}"}}},"_sentryTraceData":"a35c2b0cbd
