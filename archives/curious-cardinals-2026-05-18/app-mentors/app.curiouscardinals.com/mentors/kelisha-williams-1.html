chool and have used that experience to further my myself to larger stages and audiences!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f2906d9b-8386-488e-a7c3-2e1b69030020\"}":{"__typename":"DeepDives","uuid":"f2906d9b-8386-488e-a7c3-2e1b69030020","content":"\u003cp\u003eIn my spare time, I've been using my time to teach myself Spanish and Italian. I have also been learning to play the electric guitar and have taken up boxing. Besides these things, I am also a telescope instructor for the Loomis- Observatory, teaching people how to use a high-powered telescope to see astral phenomenons!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"9bf9100c-d978-4f0e-881d-75021ce8ff39\"}":{"__typename":"DeepDives","uuid":"9bf9100c-d978-4f0e-881d-75021ce8ff39","content":"\u003cp\u003eI once had a dream that I was stung by a bee in 7th grade. I had this dream for 3 nights in a row and was so spooked that I avoided honey for an entire week afterward. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"78dc6886-853c-4d40-b813-525259f6470c\"}":{"__typename":"School","uuid":"78dc6886-853c-4d40-b813-525259f6470c","name":"Conner High School","city":"Hebron","type":"HIGH","state":"Kentucky","country":"United States","zip":"41048"},"Education:{\"uuid\":\"18d7a805-0163-44bc-ad5b-57be4c13bed4\"}":{"__typename":"Education","uuid":"18d7a805-0163-44bc-ad5b-57be4c13bed4","school":{"__ref":"School:{\"uuid\":\"78dc6886-853c-4d40-b813-525259f6470c\"}"},"startYear":"2017","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"6359749a-5a15-4239-b0a1-7166a0066cc8\"}":{"__typename":"Education","uuid":"6359749a-5a15-4239-b0a1-7166a0066cc8","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"d9df34b6-325b-467d-a4f9-08acd6e4ae33\"}":{"__typename":"MentorPublicProfile","uuid":"d9df34b6-325b-467d-a4f9-08acd6e4ae33","displayName":"Key W.","slug":"kelisha-williams-1","biography":"\u003cp\u003eHey! My name’s Key, and I’m a senior at Harvard majoring in Psychology with a secondary in Government. I’m here to be your mentor and help you navigate school, life, and whatever else is on your plate. Whether it’s with studying tips, balancing your schedule, or just chatting about the ups and downs of college life, I’ve got your back.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the things I love doing is breaking down complicated topics in psychology, especially when it comes to understanding why people do what they do—so if you’re into understanding how the brain works or just want to ace your psych class, I’ve got you covered. I’m also huge into making complex topics easier with examples and videos because staring at a piece of paper can be super daunting and boring. Plus, I’ve dabbled in some pretty cool courses, like criminal law and neurobiology, so if you’re into those fields or just curious, I’m happy to help you explore those interests, too.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also big on time management and figuring out how to stay productive without burning out—trust me, I’ve learned the hard way with all the things I’ve juggled. From writing for the \u003cem\u003eHarvard Crimson\u003c/em\u003e to working in a lab on cooperation and thought processes, I’ve picked up a few tricks for staying organized and keeping a good balance. So if you’re struggling with feeling overwhelmed by deadlines or just trying to keep up, we can work through it together and come up with a game plan that works for you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut here’s the deal: I’m not just about the academics. I’m all about making sure you feel supported, both mentally and emotionally. College is hard enough without trying to do it all on your own. So whether you need to vent, ask for advice, or just have someone to listen to your concerns, I’m here for that, too. I get it—life’s a lot sometimes, and having someone in your corner can make all the difference.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLet’s make this year one where you thrive, not just survive. Hit me up, and let’s crush this together!\u003c/p\u003e","teachingVideoPlaybackId":"Kd00jtlCEVT8N35d2j3E00Cfz1Z755VVyU7zTGpEwVA2k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"cd23daba-3663-4ba2-bae6-c11d5c148f03\"}"},{"__ref":"Favorites:{\"uuid\":\"471a2259-40e2-4779-9e0a-86b2acbf4b93\"}"},{"__ref":"Favorites:{\"uuid\":\"3b03d42c-28a1-4560-aeae-45093c45d93e\"}"}],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7f41024f-8084-4c42-9287-0dac32b09eb8\"}"},{"__ref":"DeepDives:{\"uuid\":\"66de4b2f-a6a1-4bd1-be18-689612eaa69e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2906d9b-8386-488e-a7c3-2e1b69030020\"}"},{"__ref":"DeepDives:{\"uuid\":\"9bf9100c-d978-4f0e-881d-75021ce8ff39\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5e433a12-2a0e-4d44-bf41-13ec1d7f1a9e/-/preview/-/format/jpg
