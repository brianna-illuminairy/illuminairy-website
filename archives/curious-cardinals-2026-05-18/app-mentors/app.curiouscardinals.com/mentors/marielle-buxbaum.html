xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"50a23af4-1051-4545-b9cc-2debf5c5bb71\"}":{"__typename":"Favorites","uuid":"50a23af4-1051-4545-b9cc-2debf5c5bb71","photoUrl":"https://ucarecdn.com/9eb3f72b-eb7b-4727-abc5-d1071c362ef0/","title":"Ilana Glazer","type":"ACTOR"},"Favorites:{\"uuid\":\"0b1a8311-63ab-4c77-a599-0a57e5c3d379\"}":{"__typename":"Favorites","uuid":"0b1a8311-63ab-4c77-a599-0a57e5c3d379","photoUrl":"https://ucarecdn.com/5e87172e-3d17-4ee1-9928-408302309129/","title":"Never Let Me Go by Kazuo Ishiguro","type":"BOOK"},"Favorites:{\"uuid\":\"2542350f-8ad3-41f9-ad38-ecbb647aa402\"}":{"__typename":"Favorites","uuid":"2542350f-8ad3-41f9-ad38-ecbb647aa402","photoUrl":"https://ucarecdn.com/0841cc7c-612d-448a-af63-8d58d94cd7b0/","title":"SOS by SZA","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4a5e6f09-c20c-4596-84be-5dd29eb12888\"}":{"__typename":"DeepDives","uuid":"4a5e6f09-c20c-4596-84be-5dd29eb12888","content":"\u003cp\u003eTo my high school self I would say: don't be afraid to reinvent yourself! High school environments can feel unforgiving. I remember feeling nervous to make major switches — changing my style, asserting myself with more confidence, etc, feeling like there were too many eyes on me with expectations of who I was supposed to be. My advice for high schoolers is to be bold! You have more power than you might think to create community. Instead of needing to fit in to existing boxes, you could even  create a new environment where you are seen for your full self. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"2e6ae947-d764-4f53-8d11-a463ac3a9f8f\"}":{"__typename":"DeepDives","uuid":"2e6ae947-d764-4f53-8d11-a463ac3a9f8f","content":"\u003cp\u003eLast night I dreamt that I existed in an alternate universe, and I was responsible for writing the dreams that people in the main universe would have at night. Every day, I would jump into a deep pool of clouds (\"thought clouds,\" my Dream Mentor explained to me), creating visions that the Dream Editors would then curate. This dream made me wonder who in an alternate universe wrote it for me...\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"dffe348d-495f-4985-ad7b-b74506ef6f9e\"}":{"__typename":"DeepDives","uuid":"dffe348d-495f-4985-ad7b-b74506ef6f9e","content":"\u003cp\u003eMy first semester of college (when we were at home because of Covid!), I had the idea to post in a Brown facebook group: \"Does anyone want to meet on zoom to write a sitcom?\" A group formed, and we began writing a 7 episode murder-mystery comedy, which we filmed half of on zoom, and half in a timeshare we met up in in the Poconos. When everyone returned to campus, and had to mask and stick to \"covid pods,\" I felt so lucky to already have a network of friends to rely on. Creating something truly off-the-wall under challenging circumstances brought us together, and inspired me to never stop on my goal to root my writing in collaboration. I then went on to co-found a TV production company, Brown Original Series, and co-wrote our first mini series! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"25d22308-1818-4483-852b-2bc58589b472\"}":{"__typename":"DeepDives","uuid":"25d22308-1818-4483-852b-2bc58589b472","content":"\u003cp\u003eMy greatest source of motivation is community. For me, making art is a way to bring people together over a laugh, encourage them to open up in difficult conversations, and at the most basic level — get them out of the house and talking to other people. When I teach theater, I am also creating an artistic community within the classroom, encouraging students not only to see me as a source of encouragement, but to rely on each other.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"00c02fc8-bab2-4a19-a585-59ce0735d614\"}":{"__typename":"School","uuid":"00c02fc8-bab2-4a19-a585-59ce0735d614","name":"Friends' Central School","city":"Penn Wynne","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19096"},"Education:{\"uuid\":\"a34c082c-d387-4373-845c-eae6570dccf9\"}":{"__typename":"Education","uuid":"a34c082c-d387-4373-845c-eae6570dccf9","school":{"__ref":"School:{\"uuid\":\"00c02fc8-bab2-4a19-a585-59ce0735d614\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"db96c6e4-611b-4232-a3db-68e90ec0c45f\"}":{"__typename":"Education","uuid":"db96c6e4-611b-4232-a3db-68e90ec0c45f","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Theater Arts and Performance Studies; Literary Arts","degree":null},"MentorPublicProfile:{\"uuid\":\"58f13289-179a-4f02-b7c4-84659659a061\"}":{"__typename":"MentorPublicProfile","uuid":"58f13289-179a-4f02-b7c4-84659659a061","displayName":"Marielle B.","slug":"marielle-buxbaum","biography":"\u003cp\u003eHi! My name is Marielle, and I am a playwright, screenwriter, theater educator, and performer! I have performed and written for international theater festivals from Ecuador to Edinburgh, and am passionate about bringing my love of the arts together with my obsession with seeing the world. After graduating from Brown and studying Theater and Literary Arts (creative writing and literature), I lived in Ecuador on a Fulbright grant and worked as a writer and performer with local theater company \"Teatro Quimera,\" helping write plays about literacy, local art history, and animal conservation. \u003c/p\u003e\u003cp\u003eI also designed and taught playwriting-for-social change workshops in a high school, juvenile detention center, and sexual violence treatment center for teenage girls. Currently, I am living in Peru, where I am working with Lima theater company \"Frontera Flotante\" to create a play about Amazonian pink river dolphins, funded by arts and conservation organization Creature Conserve. So far, this experience has included heading out on the Amazonas river to look for dolphins, and subtly asking questions in a local market to talk to those illegally selling dolphin-oil love charms. \u003c/p\u003e\u003cp\u003eI am also an avid screenwriter, particularly interested in working in TV comedy. I am excited about popular media's potential for influencing cultural change, from climate narratives to complex representations of Judaism. I also love to write poetry, and am excited to guide students through a variety of arts projects (writing a play, poetry collection, screenplay, or novel, directing a play or film, creating a writing/visual art installation, etc.)\u003c/p\u003e\u003cp\u003eFor fun, I love to figure skate and learn new dance styles from around the world, practice my French and Spanish, perform Shakespeare and stand-up comedy, and recently, drum. (I joined a feminist drumming group in Ecuador, and am currently working with them to found a new youth feminist organization in their city, Loja!) \u003c/p\u003e\u003cp\u003eIn addition to supporting arts projects, I am excited about local community and international engagement projects (whether it be starting a non-profit, creating a club to advocate for local animals, working with immigrants, or planning a project abroad). Most of all, I am extremely enthusiastic and encouraging, and am eager to share my passion for project-design with curious young students. In high school, I had huge dreams. Some of them, I was able to tackle, and others felt like they had to wait until college or beyond. I don't want students to have to wait. Together, we can dive right into your passions, and make your wildest dreams come true, while making an impact on your community and inspiring you to continue creating and leading with the energy only you can bring to the table!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"3g3InRP0000j79HRtiE2x00E1hQmCNIiI5WnL01Vqv00VZlU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThis past year in Ecuador, I joined a local feminist drumming group, and worked with them to create a documentary theater play with monologues based on the members' experiences. The members themselves, most of whom are not actors, performed in the play, some of them sharing their own stories publicly for the first time. It was such a great honor for me to be trusted with my friends' and collaborators' stories of abuse, discrimination, and hopes for change. I am currently working on re-writes to the script, which will be re-staged for international women's day next March.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"50a23af4-1051-4545-b9cc-2debf5c5bb71\"}"},{"__ref":"Favorites:{\"uuid\":\"0b1a8311-63ab-4c77-a599-0a57e5c3d379\"}"},{"__ref":"Favorites:{\"uuid\":\"2542350f-8ad3-41f9-ad38-ecbb647aa402\"}"}],"causesSupported":[],"major":"Theater Arts and Performance Studies; Literary Arts","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4a5e6f09-c20c-4596-84be-5dd29eb12888\"}"},{"__ref":"DeepDives:{\"uuid\":\"2e6ae947-d764-4f53-8d11-a463ac3a9f8f\"}"},{"__ref":"DeepDives:{\"uuid\":\"dffe348d-495f-4985-ad7b-b74506ef6f9e\"}"},{"__ref":"DeepDives:{\"uuid\":\"25d22308-1818-4483-852b-2bc58589b472\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/db75aae3-a3b3-46fd-9dca-94d4371eb8b0/-/preview/-/format/jpg/","https://ucarecdn.com/574b8ee1-f829-44e8-aebb-26a076284fd6/-/preview/-/format/jpg/","https://ucarecdn.com/2a9c39ac-3f1e-4380-be91-b2f56c1530c4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a34c082c-d387-4373-845c-eae6570dccf9\"}"},{"__ref":"Education:{\"uuid\":\"db96c6e4-611b-4232-a3db-68e90ec0c45f\"}"}],"hiredAt":"2025-09-03T21:02:41.579Z","topics":["Writing","Spanish","French","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Film / Theater","History Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"marielle-buxbaum\"}})":{"__ref":"MentorPublicP
