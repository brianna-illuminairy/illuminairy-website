xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"ac390fe5-7baa-4584-90f9-0fde6381bcdd\"}":{"__typename":"DeepDives","uuid":"ac390fe5-7baa-4584-90f9-0fde6381bcdd","content":"\u003cp\u003eI truly believe that mentorship is a two-way street, where both parties are able to connect and learn from one another in such a special way. I hope to make a lasting impact, whether it be on someone's day or something as important as their High School journey. I also love meeting new people with different backgrounds, perspectives, and personalities from me. It's the best way to learn and grow as a person!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"be1f70f1-d3b3-46df-8f5d-a4de734f214c\"}":{"__typename":"DeepDives","uuid":"be1f70f1-d3b3-46df-8f5d-a4de734f214c","content":"\u003cp\u003eMy biggest dream is to travel to 15+ countries in Europe and try the cheese in every single country there\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"eb491ad2-a8a7-44a8-8ffa-e8e63409cf6d\"}":{"__typename":"DeepDives","uuid":"eb491ad2-a8a7-44a8-8ffa-e8e63409cf6d","content":"\u003cp\u003eAs an international student from Indonesia, I believe that my empathy and open-mindedness greatly differentiate my teaching style. I am so grateful to have had the opportunity to meet people from all walks of life, and I hope to incorporate my personal growth into my teaching. I strive to always create a safe space for my mentee, where all perspectives are always heard and respected.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"0a197889-45ae-47f3-a647-140b874056e6\"}":{"__typename":"Education","uuid":"0a197889-45ae-47f3-a647-140b874056e6","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Economics","degree":"B.A"},"School:{\"uuid\":\"51dc0696-95a9-42dd-abad-3fd3f77c1e86\"}":{"__typename":"School","uuid":"51dc0696-95a9-42dd-abad-3fd3f77c1e86","name":"Jakarta Intercultural School","city":"Jakarta","type":"HIGH","state":"Daerah Khusus Ibukota Jakarta","country":"Indonesia","zip":"12430"},"Education:{\"uuid\":\"8d126413-36aa-4904-8248-63fe2c4844a3\"}":{"__typename":"Education","uuid":"8d126413-36aa-4904-8248-63fe2c4844a3","school":{"__ref":"School:{\"uuid\":\"51dc0696-95a9-42dd-abad-3fd3f77c1e86\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"5754dad8-05c7-4a34-a4e3-a28368471969\"}":{"__typename":"MentorPublicProfile","uuid":"5754dad8-05c7-4a34-a4e3-a28368471969","displayName":"Anya S.","slug":"anya-sastrena","biography":"\u003cp\u003eAnya is a senior at UCLA majoring in Economics and minoring in Accounting. She is originally from Jakarta, Indonesia but has lived abroad in Singapore, Louisiana, Los Angeles, and New York throughout her life.\u0026nbsp;\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn High School, Anya was actively involved in her community, and always believed in a learning by doing approach. She tutored Middle School Math in her school’s National Honor Society chapter, and took on a leadership role within her school’s service learning committee. In her senior year, she spearheaded a service passion project, where she taught low-income Indonesian women entrepreneurship skills to create their own self-supporting small business.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eComing to UCLA, one of Anya’s main hobbies has always been creative writing and storytelling, which encouraged her to become an Opinion Columnist and an Editorial Board Member for The Daily Bruin. She also writes for Her Campus, an online magazine targeted towards college females.\u0026nbsp;From her college classes, Anya quickly became interested in a professional career in finance, and immersed herself in UCLA’s robust business community from early on in her college journey. Anya is now the Vice President of The Undergraduate Business Society, where she helps facilitate career fairs and professional resources for the student body. She is also the Vice President of Education at Bruin Value Investing, where she teaches underclassmen finance, valuation, and investing subjects not taught in a traditional degree. This summer, she pursued an investment banking summer internship at Goldman Sachs in New York, and will be returning there full time once she graduates. As a Southeast Asian woman, she is extremely passionate about mentoring underrepresented communities in traditional business and finance roles.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her free time, Anya loves making (and mostly eating) charcuterie boards, reading Agatha Christie novels, trying new restaurants, journaling, traveling to new places, and thrift shopping. She is so excited to connect with younger students on her love of learning. She has a strong passion for teaching and hopes to encourage students to always think big and stay curious!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ac390fe5-7baa-4584-90f9-0fde6381bcdd\"}"},{"__ref":"DeepDives:{\"uuid\":\"be1f70f1-d3b3-46df-8f5d-a4de734f214c\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb491ad2-a8a7-44a8-8ffa-e8e63409cf6d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/45bea35f-6adf-4bf6-aa9e-7401480e2bbe/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0a197889-45ae-47f3-a647-140b874056e6\"}"},{"__ref":"Education:{\"uuid\":\"8d126413-36aa-4904-8248-63fe2c4844a3\"}"}],"hiredAt":"2023-09-07T09:45:47.745Z","topics":["Economics","Finance / Investing","Journalism"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anya-sastrena\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5754dad8-05c7-4a34-a4e3-a28368471969\"}"}}},"_sentryTraceData":"d7e56d8f7da74bed8e34aa5fdaccdddd-b42e65ffebb80869-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d7e56d8f7da74bed8e34aa5fdaccdddd,sentry-s
