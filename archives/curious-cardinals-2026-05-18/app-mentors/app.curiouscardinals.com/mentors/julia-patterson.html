xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8aacc756-68fb-4b57-bb16-fa8d832bd890\"}":{"__typename":"DeepDives","uuid":"8aacc756-68fb-4b57-bb16-fa8d832bd890","content":"\u003cp\u003eI know I could have never achieved all that I have without the mentors in my life, from my mom to my professors. I think it is important to have a variety of mentors, from experts in your field of interest to young people you can relate to. As a recent graduate, I have fresh knowledge and experience that I am excited to share with the next generation of change-makers!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9caedb96-b889-4a08-a295-acba4fecc979\"}":{"__typename":"DeepDives","uuid":"9caedb96-b889-4a08-a295-acba4fecc979","content":"\u003cp\u003eIn high school I knew I was drawn to more quantitative subjects like math and science. I also enjoyed musical extracurriculars and played in my school band. When I got to college, I immediately loved my chemistry and biology classes, choosing a major that would allow me to explore these two disciplines: biochemistry. As I got into more advanced courses, I realized I was most intrigued by the chemical basis of biology. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a sophomore in college, I took a few academic music courses and realized I really enjoyed academic music. More than that, I loved how the academic pursuit of music complimented my STEM endeavors, and I found myself taking more and more music classes until I had enough to declare a major. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"dae47320-5ad2-4ef6-898c-0160ed1c4cdf\"}":{"__typename":"DeepDives","uuid":"dae47320-5ad2-4ef6-898c-0160ed1c4cdf","content":"\u003cp\u003eAfter completing an MD/PhD or MD program I plan to pursue academic medicine. I hope to continue as a mentor as the principal investigator of a biochemistry or chemical biology lab while simultaneously continuing in part-time clinical practice. This would allow me to engage in basic science while interacting with the very patients who could be impacted by my research. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d8ef72eb-21d6-4cf4-a4ed-36a61db819d4\"}":{"__typename":"DeepDives","uuid":"d8ef72eb-21d6-4cf4-a4ed-36a61db819d4","content":"\u003cp\u003eIn my spare time, I love to run, hike, play soccer, and otherwise spend time outdoors. Recently, I have spent many of my weekends hiking in the mountains of New Hampshire. I also love to curl up with a good book, knit, and cook. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9a36b99e-ee27-4ac0-b423-47c331b500ef\"}":{"__typename":"School","uuid":"9a36b99e-ee27-4ac0-b423-47c331b500ef","name":"Elkhorn South High School","city":"Omaha","type":"HIGH","state":"Nebraska","country":"United States","zip":"68130"},"Education:{\"uuid\":\"e6bdc223-5460-40f3-91b0-837439cd26f2\"}":{"__typename":"Education","uuid":"e6bdc223-5460-40f3-91b0-837439cd26f2","school":{"__ref":"School:{\"uuid\":\"9a36b99e-ee27-4ac0-b423-47c331b500ef\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"1fcc250b-b468-43ee-b28c-8a16580513c7\"}":{"__typename":"Education","uuid":"1fcc250b-b468-43ee-b28c-8a16580513c7","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Biological Chemistry and Music","degree":null},"MentorPublicProfile:{\"uuid\":\"8ba33a79-769d-4223-9c47-bf45b70f0943\"}":{"__typename":"MentorPublicProfile","uuid":"8ba33a79-769d-4223-9c47-bf45b70f0943","displayName":"Julia P.","slug":"julia-patterson","biography":"\u003cp\u003eHello! My name is Julia and I am a recent Dartmouth College graduate.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up in Mountain View, California, where I lived through 7th grade. While living in California, I became an avid skier and soccer player and learned to love the outdoors. I worked with my dad in these years on global health projects in Gitwe, Rwanda, learning to translate my interests to impactful passion projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI moved to Omaha, Nebraska for 8th grade and lived there through college. In high school I played on a travel soccer team and my high school varsity team, as well as playing the flute in all-state and all-national orchestras. I won awards for my aptitude in science, particularly chemistry and biology. I was also known for my leadership across my school band, soccer team, and in the classroom.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college at Dartmouth, I was the captain of the Dartmouth Alpine Club Ski Team and played flute in a variety of ensembles across campus. I ambitiously completed honors theses in both my majors, earning high honors for my biochemistry research and flute performance. I worked as a peer mentor for women in science and was a teaching assistant for chemistry courses such as organic chemistry and biochemistry, and I worked for 3 years in a biochemistry lab researching a poorly-understood protein implicated in cancer and obesity. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eAfter graduation, I spent one year in Boston, Massachussets. In my time there  I worked as an emergency department medical scribe while applying to medical school. I also played in the Longwood Symphony Orchestra, a medical orchestra with quarterly charity concerts. I was accepted to Emory University School of Medicine, and I will begin my medical school studies there next year.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis year, I am living in Granada, Spain while I do a masters degree in Immunology. I am doing research in cancer radiotherapy and working to develop fluency in Spanish. \u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy mission as a mentor is to help my mentees become confident and excited about their academics and extracurriculars. I strive to bolster their areas of strength, develop their areas of weakness, and help learning become a creative and fun process.\u003c/p\u003e","teachingVideoPlaybackId":"WK157012Hb02VlmJIQ2HL1yrj702Y00S1KD1FJbfX4u49fk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biological Chemistry and Music","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8aacc756-68fb-4b57-bb16-fa8d832bd890\"}"},{
