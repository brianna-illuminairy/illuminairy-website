xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c1cbac1c-a9ac-493e-9a8e-9ce68a1a0167\"}":{"__typename":"DeepDives","uuid":"c1cbac1c-a9ac-493e-9a8e-9ce68a1a0167","content":"\u003cp\u003eControl what you can control. \u003c/p\u003e\u003cp\u003eAs a perfectionist, I used to break down whenever my results for something I have tried very hard for wasn't what I was expecting, whether it was my tests or art competitions. Leading up to the reveal of the results, I was always super anxious and stressed by the fact that I did not have control over the results. However, I started to realize that sometimes, what matters is how much I've tried and what I learned throughout the journey. Sometimes things are not in your control and it is OK. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"44184c8c-d79a-4be4-b65d-7b1e15d2cd2e\"}":{"__typename":"DeepDives","uuid":"44184c8c-d79a-4be4-b65d-7b1e15d2cd2e","content":"\u003cp\u003eI would LOVE to go to Chamonix, France and design a creative equipment for the hikers specifically for the Alps!\u003c/p\u003e\u003cp\u003eChamonix is a mountain that is located in the French Alps, only 30 minute train ride from Geneva. It is famous for skiing, as it was the first place to ever host the winter Olympics. I have never been there, despite that fact that I am named after this place. My parents named me after this place because of their admiration for \"alpinism\", which originated in Chamonix. Alpinism reminds me to take risks and to never give up on my dreams. \u003c/p\u003e\u003cp\u003eI would like to visit Chamonix and learn the unique terrain and ecosystem to design for the environment. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e586d22b-b4d2-4ece-922f-a106b53d8eed\"}":{"__typename":"DeepDives","uuid":"e586d22b-b4d2-4ece-922f-a106b53d8eed","content":"\u003cp\u003ePeople often ask \"What exactly is Industrial Design?\" Industrial Designs range from designing something small and practical like a spoon, to a necessary transportation in life like a car. Or even spaceships! Isn't that just so exciting? Growing up, I thought art was limited to drawing and painting. However, art can be an interdisciplinary practice where you can combine different subjects. Meaning, I can design a creative product to connect people's world. The idea that a product or a system I designed will be used by people around the world was very charming. I still think that there are no other majors that is so creative and versatile like ID.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a70452f3-30d2-4ab2-b2c8-fc22b3d77be3\"}":{"__typename":"DeepDives","uuid":"a70452f3-30d2-4ab2-b2c8-fc22b3d77be3","content":"\u003cp\u003eI loveee\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eGoing ice skating!! I skated ever since I was 6.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePainting with Bob Ross video tutorials. It always clears my mind.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eShopping for stuffed animals. I have a collection of stuffed animals in my dorm.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReading Haruki Murakami. \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGoing to concerts! Fun fact, I was actually mentioned by Olivia Rodrigo in the middle of the concert because of the Shirt I made \u0026amp; wore to the concert :)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e... \u0026amp; I have so many more hobbies that I want to try out! Maybe we have something in common?\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"1fdcf198-e23c-4aff-bbe1-c39c8b889b95\"}":{"__typename":"School","uuid":"1fdcf198-e23c-4aff-bbe1-c39c8b889b95","name":"Bergen County Technical High School","city":"Teterboro","type":"HIGH","state":"NJ","country":"United States","zip":"07608"},"Education:{\"uuid\":\"36c98bbb-2f41-4552-a385-eb99768ae829\"}":{"__typename":"Education","uuid":"36c98bbb-2f41-4552-a385-eb99768ae829","school":{"__ref":"School:{\"uuid\":\"1fdcf198-e23c-4aff-bbe1-c39c8b889b95\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"91b97cbb-919e-49e6-81fe-a6dc058ed117\"}":{"__typename":"School","uuid":"91b97cbb-919e-49e6-81fe-a6dc058ed117","name":"Rhode Island School of Design","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02903"},"Education:{\"uuid\":\"f5d7027f-332b-4863-a218-518a3d82bd83\"}":{"__typename":"Education","uuid":"f5d7027f-332b-4863-a218-518a3d82bd83","school":{"__ref":"School:{\"uuid\":\"91b97cbb-919e-49e6-81fe-a6dc058ed117\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Industrial Design","degree":null},"MentorPublicProfile:{\"uuid\":\"eb2f4ca4-ff69-4e8f-8fc8-071bce5bfb65\"}":{"__typename":"MentorPublicProfile","uuid":"eb2f4ca4-ff69-4e8f-8fc8-071bce5bfb65","displayName":"Cham H.","slug":"cham-han","biography":"\u003cp\u003eChamonix is a sophomore in Rhode Island School of Design majoring in Industrial Design with a concentration in CTC (Computation, Technology and Culture). She is interested in user-interactive design and ambient interface, as her work consists of connecting fine art and technology to interact with creative individuals and move people's hearts and emotions. In her free time, you can find her crocheting for her friends or searching for the best matcha latte. Chamonix spent her high school years focusing on how to use art for activism, and interning at a design firm to create custom stationaries for clients. She also partnered up with a local pet adoption center to paint portraits of sheltered dogs. At RISD, Cham is still on a journey to utilize her artistic activism. She is a PR member of Better World by Design, a student-led club that focuses on the interdisciplinary collaboration between everyone and anyone. Chamonix strives for design-thinking to be an accessible way for everyone to create their own unique solutions to problems.\u003c/p\u003e","teachingVideoPlaybackId":"x4g68ArRfTKsT02ilNCr7nK1fVfzq6tkzn00PDNC00MMvI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Industrial Design","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c1cbac1c-a9ac-493e-9a8e-9ce68a1a0167\"}"},{"__ref":"DeepDives:{\"uuid\":\"44184c8c-d79a-4be4-b65d-7b1e15d2cd2e\"}"},{"__ref":"DeepDives:{\"uuid\":\"e586d22b-b4d2-4ece-922f-a106b53d8eed\"}"},{"__ref":"DeepDives:{\"uuid\":\"a70452f3-30d2-4ab2-b2c8-fc22b3d77be3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/baefb932-6a8c-403e-b746
