xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"6a2f6466-4177-4add-b219-16f6435e1c44\"}":{"__typename":"DeepDives","uuid":"6a2f6466-4177-4add-b219-16f6435e1c44","content":"\u003cp\u003eI believe that mentorship helps instill a pillar of support that young innovators need. As a mentor, it is my greatest joy to see the progress of my students by being apart of their support system as well as being their guide. I believe that mentorship is a role where an individual allows their student to discover their creativity and that is the reason why I love being a mentor. I enjoy watching my students tap into their creative outlets.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bf827970-4100-40a7-9896-74a112470c26\"}":{"__typename":"DeepDives","uuid":"bf827970-4100-40a7-9896-74a112470c26","content":"\u003cp\u003eI've always been passionate about politics and education, but my main motivation for choosing education began my Junior year when I was chosen to sit on my state board of education's advisory council and there I was able to participate in policy making. I chose this major because I want to make a difference and I believe that I can through my field of study. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"037ea53a-83ec-4df1-af72-2596c559a7e2\"}":{"__typename":"DeepDives","uuid":"037ea53a-83ec-4df1-af72-2596c559a7e2","content":"\u003cp\u003eI spent a majority of my summers working whether that was for a political organization or waitressing. I enjoyed to keep myself busy during the summers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"64cac6c7-79a5-4568-9733-ef70b393ee8f\"}":{"__typename":"DeepDives","uuid":"64cac6c7-79a5-4568-9733-ef70b393ee8f","content":"\u003cp\u003eI was very passionate about the organizations that I joined in high school and I was very active in them. I would say that I was a strong and active student.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"12b46907-7bd7-4347-b1de-e6bf97f29124\"}":{"__typename":"School","uuid":"12b46907-7bd7-4347-b1de-e6bf97f29124","name":"Eldorado High School","city":"Eldorado","type":"HIGH","state":"Illinois","country":"United States","zip":"62930"},"Education:{\"uuid\":\"75d8e15f-3e87-4684-8c8d-edc5f21aef59\"}":{"__typename":"Education","uuid":"75d8e15f-3e87-4684-8c8d-edc5f21aef59","school":{"__ref":"School:{\"uuid\":\"12b46907-7bd7-4347-b1de-e6bf97f29124\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"7b3c5212-d11f-466f-bb13-e1040c115c7f\"}":{"__typename":"Education","uuid":"7b3c5212-d11f-466f-bb13-e1040c115c7f","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Government","degree":null},"MentorPublicProfile:{\"uuid\":\"c78110b7-a290-4be9-b104-b58220534e17\"}":{"__typename":"MentorPublicProfile","uuid":"c78110b7-a290-4be9-b104-b58220534e17","displayName":"Jenna J.","slug":"jenna-jiang-1","biography":"\u003cp\u003eHi! My name is Jenna Jiang and I'm currently a student at Harvard College studying Government. Although Government is a field that I am extremely passionate and interested in, I have another passion for education. For the last two years, I sat on the Illinois Board of Education Student Advisory council where I was elected as an executive council member my first year and then later on as President. Within my position, I learned to write policies and bills where I would advocate for them along with my peers to the Board. In addition to sitting on the Illinois State Board of Education Student Advisory Council, I also sit on two other councils where I was elected by the State Superintendent as the sole student advisor ranging from rural advisory to student equity. \u003cbr\u003e\u003cbr\u003eThrough my experience in education and policy writing, I have been able to help launch and manage educational initiatives helping progress missions from bridging the gap between ESL students and English to expanding access for rural students. In these opportunities, I have been able to meet and interact with so many individuals that has helps shaped my perspective. In addition, I have been a tutor/mentor for the last three years teaching anything from SAT to essay writing. At Harvard, I am apart of the Harvard Civics program where I enter the classroom once a week to teach Civics education. I am extremely open to any opportunities and specialize in crafting college applications and essay help. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you need an individual who is driven, hard-working, and creative then I believe I am the person for you and I am so excited about that prospect!\u003c/p\u003e","teachingVideoPlaybackId":"Mh6sjXNFsVdHWYClVGBFrXxJMj02o2QPJlgp00H9Qj01Ts","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Government","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6a2f6466-4177-4add-b219-16f6435e1c44\"}"},{"__ref":"DeepDives:{\"uuid\":\"bf827970-4100-40a7-9896-74a112470c26\"}"},{"__ref":"DeepDives:{\"uuid\":\"037ea53a-83ec-4df1-af72-2596c559a7e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"64cac6c7-79a5-4568-9733-ef70b393ee8f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2b9e1272-1d40-4ab1-b3c7-4c4bee8874e8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"75d8e15f-3e87-4684-8c8d-edc5f21aef59\"}"},{"__ref":"Education:{\"uuid\":\"7b3c5212-d11f-466f-bb13-e1040c115c7f\"}"}],"hiredAt":"2024-12-24T15:21:23.886Z","topics":["Creative Writing","Video / Photography","Law / Government / Policy","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jenna-jiang-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c78110b7-a290-4be9-b104-b58220534e17\"}"}}},"_sentryTraceData":"25ef18ae7f03439b9f15958fda1f0cdc-8e01ce9c5a1c428d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=25ef18ae7f03439b9f15958fda1f0cdc,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/men
