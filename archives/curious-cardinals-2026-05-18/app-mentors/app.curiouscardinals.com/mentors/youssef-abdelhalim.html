xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b04dda97-36f9-4120-a274-15f9463eaa8e\"}":{"__typename":"Favorites","uuid":"b04dda97-36f9-4120-a274-15f9463eaa8e","photoUrl":"https://ucarecdn.com/59d4d7d6-6897-4a5d-ac9c-2e6906eab221/","title":"Messi","type":"ATHLETE"},"Favorites:{\"uuid\":\"192e78e3-868a-4ca4-a838-c68c3de8bc78\"}":{"__typename":"Favorites","uuid":"192e78e3-868a-4ca4-a838-c68c3de8bc78","photoUrl":"https://ucarecdn.com/ed8131f2-c32b-46d8-97d1-eae43ca58309/","title":"Hans Zimmer","type":"ARTIST"},"Favorites:{\"uuid\":\"909d56a1-9c9d-4ca4-b5f0-636971769d82\"}":{"__typename":"Favorites","uuid":"909d56a1-9c9d-4ca4-b5f0-636971769d82","photoUrl":"https://ucarecdn.com/f189eeaa-76c7-4de4-bd02-6809c14c43e3/","title":"Interstellar","type":"MOVIE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5a774bae-9976-4bf3-84d7-d86644859559\"}":{"__typename":"DeepDives","uuid":"5a774bae-9976-4bf3-84d7-d86644859559","content":"\u003cp\u003eI really love what I do. I see the magic in numbers and sharing ideas with others. And I hope I could pass the love and passion I have towards engineering to the next generation of aspiring engineers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMany people see mentorship as a one-way street where the mentee is the only one that benefits, however, it is very much a mutualistic relationship. The mentor learns how to communicate an idea in its simplest forms based on fundamental concepts. Sometimes even mentoring could remind the mentor why they fell in love with their field in the first place!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"78dbf9d3-2991-4620-8057-3578c2da2917\"}":{"__typename":"DeepDives","uuid":"78dbf9d3-2991-4620-8057-3578c2da2917","content":"\u003cp\u003eI have a lot of hobby projects that I am pursuing in college, this is where most of my learning happens so I would like continue working on hobby projects after I graduate as well. Two of my biggest goals is to build a functional car and Cessna-style plane (both of which have been done before so I am not fully crazy here!)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI already got exposed to car-building through the Formula SAE club here at Northwestern. It takes a full team to build one over the course of a year, so I anticipate this will take me ~5 years. The plane will probably be the one that takes \u0026gt;10 years.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f9242d2a-2473-4185-9bca-bc714ef04328\"}":{"__typename":"DeepDives","uuid":"f9242d2a-2473-4185-9bca-bc714ef04328","content":"\u003cp\u003eFrom a very young age, I was into two things: rockets and legos. I really enjoyed watching rocket launches and I always enjoyed building things and taking and putting apart my toys. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up I wanted to become an astronaut. However, as cool as it is to be in space, just sitting around in Space Shuttle is not enough. I realized that I was thrilled by the space itself of the Space Shuttle. I then wanted to become a fighter jet pilot, because I don't just experience extreme speeds, but I also get to control that speed. I then wanted to become an Formula 1 driver. It soon became apparent to me that speed was my thill. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis is why I am majoring in mechanical and aerospace engineering. I don't just to build things, I get to build really fast things. It combines both of my interests, speed and creating. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"dbd977d8-5c02-4242-8edf-253117119fad\"}":{"__typename":"DeepDives","uuid":"dbd977d8-5c02-4242-8edf-253117119fad","content":"\u003cp\u003eI seem very calm, rational, and collected. But there is a side of me that is very much the opposite of that.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFrom my other responses, you probably already know that I am an adrenaline junky and that speed is my thrill. That is why I went skydiving for the first time this year. I also went skiing for the first time except I completely skipped the bunny slopes. I also skateboarded down steep 200m slopes (that one particularly didn't end too well for my knees and elbows). I also drifted a Formula car!  Point is, if it sounds crazy, there is a voice inside of me that will convince me to do it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn the daily, I am a calm and collected engineer. But every once in a while I need a an adrenaline kick!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"68d15d76-d64f-428a-8fa5-ff9cd4399dbc\"}":{"__typename":"School","uuid":"68d15d76-d64f-428a-8fa5-ff9cd4399dbc","name":"Hillsborough High School","city":"Hillsborough Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08844"},"Education:{\"uuid\":\"0e922310-3eb6-44f6-9cf1-b3e511767ccc\"}":{"__typename":"Education","uuid":"0e922310-3eb6-44f6-9cf1-b3e511767ccc","school":{"__ref":"School:{\"uuid\":\"68d15d76-d64f-428a-8fa5-ff9cd4399dbc\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"e8234bff-707e-4040-a046-619f496e9734\"}":{"__typename":"Education","uuid":"e8234bff-707e-4040-a046-619f496e9734","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical \u0026 Aerospace Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"b7fa871f-b811-442f-ace7-18d61db63658\"}":{"__typename":"MentorPublicProfile","uuid":"b7fa871f-b811-442f-ace7-18d61db63658","displayName":"Youssef A.","slug":"youssef-abdelhalim","biography":"\u003cp\u003eHello! My name is Youssef and I am a mechanical \u0026amp; aerospace engineering student at Northwestern University, where I am pursuing a Bachelors and an Masters degree. I am passionate about rocket engines, Formula 1, and planes!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEarly on, I understood that the easiest and best way to learn something is to love it. Once you love it, your brain does the rest of the work for you. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of classes, I spend most of my time with the Northwestern Formula SAE Racing team, where we design, build, and drive a Formula-style car from scratch every year. This past year, we moved from an internal combustion engine to and electric car. I am the water cooling, battery segment design, and battery container lead. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also working on Project Ceres, where we're building one of the first college-level hybrid rocket engine that we will fly to the Karman line. We are in the hot-firing phase of the project and aim to launch a full-scale launch vehicle to space by the end of next spring. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eRecently, I got involved with an aerospace startup called Aster Space, where we're focusing on oxygen production on the moon. My role with the team is producing CFD simulations to validate our designs before we move onto the prototyping phase. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of all this engineering, I really enjoy doing anything that involves speed, whether that be driving Formula cars, skiing, skating, or skydiving. If it goes fast, I want in!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","teachingVideoPlaybackId":"QY1XQ018r003oVZjcDRP00CFeDxs00Zk8wYCgiTgr4lE02jQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the most important tasks on our Formula team is welding tubes together to make our frame. This task is not just difficult but it is very time consuming and requires a lot of after-hours work. In previous years, I used to see older members weld the frame and I'd think it was the coolest thing ever and I made it a point to become the team's welder. Over the fall, I taught myself how to weld by practicing on scrap pieces almost everyday until I got good at. Long story short, the frame is now fully welded by me and my buddy Marcello!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b04dda97-36f9-4120-a274-15f9463eaa8e\"}"},{"__ref":"Favorites:{\"uuid\":\"192e78e3-868a-4ca4-a838-c68c3de8bc78\"}"},{"__ref":"Favorites:{\"uuid\":\"909d56a1-9c9d-4ca4-b5f0-636971769d82\"}"}],"causesSupported":[],"major":"Mechanical \u0026 Aerospace Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5a774bae-9976-4bf3-84d7-d86644859559\"}"},{"__ref":"DeepDives:{\"uuid\":\"78dbf9d3-2991-4620-8057-3578c2da2917\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9242d2a-2473-4185-9bca-bc714ef04328\"}"},{"__ref":"DeepDives:{\"uuid\":\"dbd977d8-5c02-4242-8edf-253117119fad\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/11da1800-3bde-4a90-afb7-004bfd57e96f/-/preview/-/format/jpg/","https://ucarecdn.com/5bc3fae6-2530-4faa-a570-96db1c65b00e/-/preview/-/format/jpg/","https://ucarecdn.com/710be150-80ad-42d9-9372-bca3f7e98b49/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0e922310-3eb6-44f6-9cf1-b3e511767ccc\"}"},{"__ref":"Education:{\"uuid\":\"e8234bff-707e-4040-a046-619f496e9734\"}"}],"hiredAt":"2024-03-19T22:15:06.068Z","topics":["Calculus","Algebra II","Algebra I","Geometry","Physics","College Essay Writing","Executive Function","Academic Coaching","Video / Photography","Coding / Programming","Robotics / Electronics / CAD","Aviation / Aerospace","STEM Project","Sustainability"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"youssef-abdelhalim\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b7fa871f-b811-442f-ace7-18d61db63658\"}"}}},"_sentryTraceData":"9a3dc66209e84048869502e5d32e6f69-b8a19ba18e090518-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9a3dc66209e84048869502e5d32e6f69,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"youssef-abdelhalim"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerou
