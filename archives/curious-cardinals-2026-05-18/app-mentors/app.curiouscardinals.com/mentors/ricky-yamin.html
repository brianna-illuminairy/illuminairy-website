xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"01248603-3b67-43aa-8905-f1bfcc187992\"}":{"__typename":"DeepDives","uuid":"01248603-3b67-43aa-8905-f1bfcc187992","content":"\u003cp\u003eIn high school, I conducted and published a research study that used behavioral economics to tackle food waste in my school cafeteria. I designed an experiment where students were rewarded with Oreo cookies if they finished their meals—and it worked: food waste dropped by 64.5%!\u003c/p\u003e\u003cp\u003eWhat started as a class project turned into something much bigger. The study was published in the \u003cem\u003eJournal of Student Research\u003c/em\u003e, and more importantly, it showed me how data and creativity can come together to solve real-world problems. It was one of the first times I realized I could use my interests in economics and sustainability to make a meaningful impact—and I’ve been chasing that feeling ever since.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"98be8320-bf7c-41e7-b409-6b96703119e0\"}":{"__typename":"DeepDives","uuid":"98be8320-bf7c-41e7-b409-6b96703119e0","content":"\u003cp\u003eMy dream job is to work at the intersection of sustainability and finance in Latin America. Having grown up with roots in both Venezuela and Puerto Rico, I’m deeply connected to the region and passionate about its future. I want to help mobilize capital toward solving environmental and social challenges—whether that’s funding reforestation, scaling clean energy, or creating innovative financing models for conservation. I’m especially interested in using tools like green bonds, impact investing, and blended finance to make sustainable development not just possible, but scalable and inclusive. For me, it’s about creating long-term, real-world impact in the places that mean the most to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"41e1619e-3bf6-4160-a038-096626903d2d\"}":{"__typename":"DeepDives","uuid":"41e1619e-3bf6-4160-a038-096626903d2d","content":"\u003cp\u003eIn high school, I co-founded a student-run organization called FostertheGrove, which focused on raising awareness about the importance of mangrove ecosystems in South Florida. Mangroves play a huge role in protecting coastlines, supporting biodiversity, and fighting climate change—but in places like Miami, they’re constantly threatened by development.\u003c/p\u003e\u003cp\u003eWith FostertheGrove, we organized bi-weekly cleanups where we not only picked up trash, but also educated volunteers about why mangroves matter, planted new ones, and held workshops on how to care for and protect existing mangrove populations. Our goal was to make environmental stewardship accessible and action-oriented for students, while advocating for the preservation of native ecosystems.\u003c/p\u003e\u003cp\u003eThat experience was the spark that first ignited my passion for sustainability—and it opened my eyes to the role that finance can play in driving long-term environmental impact. It’s what led me down the path of exploring sustainable finance, and it continues to shape how I think about the kind of work I want to do in the future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"bba6e223-43e9-4176-aa5e-da1941444b50\"}":{"__typename":"School","uuid":"bba6e223-43e9-4176-aa5e-da1941444b50","name":"Belen Jesuit Preparatory School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33184"},"Education:{\"uuid\":\"17505b60-b253-4b17-83c1-445287eb5737\"}":{"__typename":"Education","uuid":"17505b60-b253-4b17-83c1-445287eb5737","school":{"__ref":"School:{\"uuid\":\"bba6e223-43e9-4176-aa5e-da1941444b50\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"16d9b775-4207-4514-94a8-9f698d7376a0\"}":{"__typename":"Education","uuid":"16d9b775-4207-4514-94a8-9f698d7376a0","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics and Statistics","degree":null},"MentorPublicProfile:{\"uuid\":\"fccdc42e-0709-4141-b7d1-f1beaccf57a1\"}":{"__typename":"MentorPublicProfile","uuid":"fccdc42e-0709-4141-b7d1-f1beaccf57a1","displayName":"Ricky Y.","slug":"ricky-yamin","biography":"\u003cp\u003eRicky is a sophomore at the University of Pennsylvania, where he’s majoring in Economics and minoring in Statistics and Art History.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi! I'm Ricky, and I’m passionate about helping students turn big ideas into bold projects—while having fun along the way. I grew up in Miami, Florida, where I ran competitive cross country at a national level and served as my high school’s DECA President, leading our team to competitions and mentoring underclassmen. I’ve always loved combining creative thinking with structure and strategy—whether that meant building a website to showcase my interests, launching new student-led initiatives, or just helping my friends write standout essays and prep for interviews. Those experiences helped me build resilience, time management, and a deep love for helping others succeed.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow at Penn, I’ve had the chance to explore my academic interests across economics, sustainability, art, and history, and apply them in real-world ways. I’ve interned in wealth management, hospitality, and global consulting, and I currently lead a team working on reforestation and biodiversity projects in Brazil’s Atlantic Rainforest. I’m also excited to be joining Morgan Stanley’s Investment Banking Division in 2026, where I’ll continue growing my skills in finance and global impact.\u003c/p\u003e\u003cp\u003eI bring a ton of energy, enthusiasm, and patience to everything I do—especially mentorship. I love working with students of all ages and across subjects, from math, economics, and business to writing, college essays, and interview prep. More than anything, I want students to feel confident, curious, and capable. Whether we’re building a passion project, mapping out a college strategy, or just figuring out what makes you tick, I’ll be there with structure, support, and a whole lot of encouragement.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I love to travel, cook, and follow the Champions League, Formula 1, and the NFL. I’m also a huge fan of geopolitics, history, and art—and I’m always excited to bring those perspectives into the classroom.\u003c/p\u003e\u003cp\u003eI can’t wait to work with students who are excited to learn, explore new ideas, and build something meaningful together.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics and Statistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"01248603-3b67-43aa-8905-f1bfcc187992\"}"},{"__ref":"DeepDives:{\"uuid\":\"98be8320-bf7c-41e7-b409-6b96703119e0\"}"},{"__ref":"DeepDives:{\"uuid\":\"41e1619e-3bf6-4160-a038-096626903d2d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b1227568-5656-42cd-aee3-08413de7d570/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"17505b60-b253-4b17-83c1-445287eb5737\"}"},{"__ref":"Education:{\"uuid\":\"16d9b775-4207-4514-94a8-9f698d7376a0\"}"}],"hiredAt":"2025-03-27T23:35:02.297Z","topics":["Statistics","Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Physics","Writing","Spanish","History","Economics","College Essay Writing","Academic Coaching","Executive Function","Reading","Finance / Investing","Business / Entrepreneurship","Law / Government / Policy","Sustainability"],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ricky-yamin\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fccdc42e-0709-4141-b7d1-f1beaccf57a1\"}"}}},"_sentryTraceData":"0cf8178a33184da4b26cfb4bed789162-93f9ae318f721915-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=0cf8178a33184da4b26cfb4bed789162,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ricky-yamin"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,
