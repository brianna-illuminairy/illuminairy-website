xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a0a9c5ba-3d99-4440-95ba-7c990d9140b8\"}":{"__typename":"Favorites","uuid":"a0a9c5ba-3d99-4440-95ba-7c990d9140b8","photoUrl":"https://ucarecdn.com/9e25183a-1298-4429-a3d4-add8adc4ec22/","title":"A Head Full of Dreams","type":"ALBUM"},"Favorites:{\"uuid\":\"97ad38de-1abf-45d0-acb6-dfee0c0e66c6\"}":{"__typename":"Favorites","uuid":"97ad38de-1abf-45d0-acb6-dfee0c0e66c6","photoUrl":"https://ucarecdn.com/9e25183a-1298-4429-a3d4-add8adc4ec22/","title":"Elf","type":"MOVIE"},"Favorites:{\"uuid\":\"ba4b7e42-eea9-437e-bda6-84da4b8a3798\"}":{"__typename":"Favorites","uuid":"ba4b7e42-eea9-437e-bda6-84da4b8a3798","photoUrl":"https://ucarecdn.com/9e25183a-1298-4429-a3d4-add8adc4ec22/","title":"Originals, Adam Grant","type":"BOOK"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"b27eac31-a56a-41ae-93bc-688ce1cfde42\"}":{"__typename":"DeepDives","uuid":"b27eac31-a56a-41ae-93bc-688ce1cfde42","content":"\u003cp\u003eMentorship has been the single most important to my personal development. I would not be a strong student, curious innovator, or motivated cosmopolitan without mentors who either inspired or directed me. I cannot even begin to imagine who I would be without those 3-4 people who changed my life for the better. I hope to be one of those for you – I will do my very best.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a2e52be2-a739-4bca-872b-2a2ba7eed5a0\"}":{"__typename":"DeepDives","uuid":"a2e52be2-a739-4bca-872b-2a2ba7eed5a0","content":"\u003cp\u003eTech Entrepreneur –\u0026gt; CEO of TED –\u0026gt; Professor –\u0026gt; Angel Investor\u003c/p\u003e\u003cbr\u003e\u003cp\u003e(All throughout — a mentor to those not as far along the journey:)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"bf14d92f-3d70-4335-bb4f-2f4e7efab1ca\"}":{"__typename":"DeepDives","uuid":"bf14d92f-3d70-4335-bb4f-2f4e7efab1ca","content":"\u003cp\u003eDuring COVID, I founded a virtual exchange program for over 250 students from across 25+ countries and 6 continents. It was called Worldwide LIVE (Linguistic \u0026amp; International Virtual Exchange) and we would gather 1-2 times per week to engage in conversations, have debates, teach each other how to make dishes from different global walks of life, and just connect since traveling or leaving our homes wasn’t an option. It was a blast and I still join the meetings periodically (I passed on leadership after starting college).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ec6e0a5f-bb18-4c53-bf18-c96246e887b4\"}":{"__typename":"DeepDives","uuid":"ec6e0a5f-bb18-4c53-bf18-c96246e887b4","content":"\u003cp\u003eTo change at least one person's life enough that they are happy, love their work, or are successful by whatever metric they most value due to something I said or did for them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"95382ea5-a697-4bd5-a482-710ba9431b33\"}":{"__typename":"School","uuid":"95382ea5-a697-4bd5-a482-710ba9431b33","name":"Sacred Heart Schools, Atherton","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"229fdfde-053f-42ab-87f4-7bb192f695b1\"}":{"__typename":"Education","uuid":"229fdfde-053f-42ab-87f4-7bb192f695b1","school":{"__ref":"School:{\"uuid\":\"95382ea5-a697-4bd5-a482-710ba9431b33\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc\"}":{"__typename":"School","uuid":"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc","name":"Claremont McKenna College","city":"Claremont","type":"COLLEGE","state":"California","country":"United States","zip":"91711"},"Education:{\"uuid\":\"c04a2606-f28d-4220-b614-9e2098c57f5b\"}":{"__typename":"Education","uuid":"c04a2606-f28d-4220-b614-9e2098c57f5b","school":{"__ref":"School:{\"uuid\":\"a6591f8c-3480-4b1b-8cbb-8d9d5dc9fcbc\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"science management \u0026 cognitive science","degree":null},"MentorPublicProfile:{\"uuid\":\"e885a507-4998-4fdb-9bdc-adc4f23a07b8\"}":{"__typename":"MentorPublicProfile","uuid":"e885a507-4998-4fdb-9bdc-adc4f23a07b8","displayName":"Armin H.","slug":"armin-hamrah","biography":"\u003cp\u003eHi there! I'm Armin, a freshman at Claremont McKenna College studying Science Management and Cognitive Science with a Computer Science sequence. Off campus, I conduct research for the Stanford Institute for Human-Centered AI (HAI), am on the Product Space National Board, and create AI tools which I sell to businesses ad-hoc. On campus, I work with startups reach their strategic goals using AI as a founding member of the Claremont AI Advancement Society, help Claremont founders launch their projects as an innovation catalyst in Pomona Ventures, and am a part of the competitive ski race team. In high school, I interned at three different cutting-edge research labs (Stanford-Northwestern-Stanford), created four clubs at my high school, a worldwide exchange program, and a CA-wide chess league. As you can see, across all of my endeavors is a burning passion to catalyze innovation, whether it be technological, social, or interpersonal. Now, it is my time to share the learning I've acquired (along with the mistakes!) and help excited students like you all reach your intellectual and life goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love playing piano, watching basketball, and skiing! Please reach out to me if you'd like to chat or have me as a mentor – I'm your next best advocate. :)\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a0a9c5ba-3d99-4440-95ba-7c990d9140b8\"}"},{"__ref":"Favorites:{\"uuid\":\"97ad38de-1abf-45d0-acb6-dfee0c0e66c6\"}"},{"__ref":"Favorites:{\"uuid\":\"ba4b7e42-eea9-437e-bda6-84da4b8a3798\"}"}],"causesSupported":[],"major":"science management \u0026 cognitive science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b27eac31-a56a-41ae-93bc-688ce1cfde42\"}"},{"__ref":"DeepDives:{\"uuid\":\"a2e52be2-a739-4bca-872b-2a2ba7eed5a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"bf14d92f-3d70-4335-bb4f-2f4e7efab1ca\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec6e0a5f-bb18-4c53-bf18-c96246e887b4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b312839b-7209-496a-be20-9ab6c28c1d0c/-/preview/-/format/jpg/","https://ucarecdn.com/817b95ec-8a38-488f-8976-d4447dd5c5ce/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"229fdfde-053f-42ab-87f4-7bb192f695b1\"}"},{"__ref":"Ed
