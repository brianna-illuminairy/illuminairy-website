xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"72b62c6e-da6a-4cf2-869b-44f5ad6a9f7e\"}":{"__typename":"CausesSupported","uuid":"72b62c6e-da6a-4cf2-869b-44f5ad6a9f7e","name":"Xixi Garden （希希学园）","description":"\u003cp\u003eProvides free comprehensive sexual education to 10k+ migrant students in China!\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"301fbc81-7d7e-4ea9-9914-861498bcf7c4\"}":{"__typename":"DeepDives","uuid":"301fbc81-7d7e-4ea9-9914-861498bcf7c4","content":"\u003cp\u003eI love cooking and exploring new cuisines! One of my favorite dishes is shakshouka, a delicious and cheap North African dish which sustained me and my coworkers for an entire summer when we interned in Switzerland over the summer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"b80afa7f-94ef-47f6-b6f1-3e9094387690\"}":{"__typename":"DeepDives","uuid":"b80afa7f-94ef-47f6-b6f1-3e9094387690","content":"\u003cp\u003eMy little sister. I want to show her that she can do anything and to not be afraid of dreaming big.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c7f98398-c7d3-4416-bf90-6fadfe3bc1dc\"}":{"__typename":"DeepDives","uuid":"c7f98398-c7d3-4416-bf90-6fadfe3bc1dc","content":"\u003cp\u003eBe kind to everyone, including yourself, and especially to the people who love you. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"6d25781d-56e5-4d42-a889-5445d840861d\"}":{"__typename":"DeepDives","uuid":"6d25781d-56e5-4d42-a889-5445d840861d","content":"\u003cp\u003eLearning how to surf! I was once caught in a rip current and ended up being hospitalized due submersion injuries. Even now, I still get anxious around large bodies of water, but I always made it a point of getting swimming practice and trying new activities like surfing to face my fears. I took my first surfing lesson in Panama a year after my near-drowning accident, and it affirmed to me that I can make strides even if the thing I'm attempting scares me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"c4a47393-ab90-4143-b49b-4a0a4d07a90e\"}":{"__typename":"School","uuid":"c4a47393-ab90-4143-b49b-4a0a4d07a90e","name":"Upper Arlington High School","city":"Upper Arlington","type":"HIGH","state":"Ohio","country":"United States","zip":"43221"},"Education:{\"uuid\":\"e5cc46f6-d2aa-4851-b41d-253d4a22fb38\"}":{"__typename":"Education","uuid":"e5cc46f6-d2aa-4851-b41d-253d4a22fb38","school":{"__ref":"School:{\"uuid\":\"c4a47393-ab90-4143-b49b-4a0a4d07a90e\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"e7ea86f8-9072-4120-a9a1-d537c2f6b06f\"}":{"__typename":"Education","uuid":"e7ea86f8-9072-4120-a9a1-d537c2f6b06f","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"History \u0026 Science, Molecular \u0026 Cellular Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"736b0ff8-0826-4132-ad81-af434bc9a658\"}":{"__typename":"MentorPublicProfile","uuid":"736b0ff8-0826-4132-ad81-af434bc9a658","displayName":"Minjue W.","slug":"minjue-wu-1","biography":"\u003cp\u003eHi Curious Cardinals! My name is Minjue Wu (MIN-joo) and I'm a current Harvard University Priscilla Chan Stride Public Service Fellow with an A.B. Honors degree double majoring in History \u0026amp; Science and Molecular \u0026amp; Cellular Biology and a minor in Computer Science. I originally hail from Anhui, China, and I've divided my time between Ohio, Massachusetts, and California.  Since immigrating to the U.S. Growing up with experiences in two different countries' healthcare systems piqued my interest in interdisciplinary approaches to international health equity and developmental economics.  I'm passionate about tackling these question through the medical humanities, data-driven policymaking, and public-private sector collaborations. At Harvard, I served on the board of trustees for the student-run public service organization Phillips Brooks House Associate, as well as the Co-President of An Evening with Champions, the world's oldest ice skating cancer fundraiser. Professionally, I've worked with Harvard Medical School, Boston Consulting Group, D. E. Shaw, and the United Nations, where I served on the External Affairs and Strategics Initiatives Team in the Stop TB Partnership to create a digital platform for the Re-imagining TB Care Initiative. I look forward to meeting you and working with you to launch the path of your dreams, whether that might be personal transformation, an educational track, a professional pursuit, or a passion project!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"72b62c6e-da6a-4cf2-869b-44f5ad6a9f7e\"}"}],"major":"History \u0026 Science, Molecular \u0026 Cellular Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"301fbc81-7d7e-4ea9-9914-861498bcf7c4\"}"},{"__ref":"DeepDives:{\"uuid\":\"b80afa7f-94ef-47f6-b6f1-3e9094387690\"}"},{"__ref":"DeepDives:{\"uuid\":\"c7f98398-c7d3-4416-bf90-6fadfe3bc1dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"6d25781d-56e5-4d42-a889-5445d840861d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8f4f1f14-e9a3-4496-af75-a50cad15cc33/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e5cc46f6-d2aa-4851-b41d-253d4a22fb38\"}"},{"__ref":"Education:{\"uuid\":\"e7ea86f8-9072-4120-a9a1-d537c2f6b06f\"}"}],"hiredAt":"2023-09-01T15:36:36.368Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","K-6 Storybook","Creative Writing","History Project","Visual Arts / Graphic Design"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"minjue-wu-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"736b0ff8-0826-4132-ad81-af434bc9a658\"}"}}},"_sentryTraceData":"9c1cd6b107544c0cb0b17590fcf8d99e-91da2b2e1b291d82-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e
