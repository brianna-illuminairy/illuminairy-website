xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bdf03909-e261-4237-869f-143a6295413f\"}":{"__typename":"Favorites","uuid":"bdf03909-e261-4237-869f-143a6295413f","photoUrl":"https://ucarecdn.com/6750d689-20e1-4646-89d4-c66b7aa4e8fc/","title":"Shi Zhiyong","type":"ATHLETE"},"Favorites:{\"uuid\":\"f75a9521-e957-4ac3-ab21-b847153ec20f\"}":{"__typename":"Favorites","uuid":"f75a9521-e957-4ac3-ab21-b847153ec20f","photoUrl":"https://ucarecdn.com/7b85789a-fad5-4351-a5ac-be600b35d22c/","title":"Data","type":"ALBUM"},"Favorites:{\"uuid\":\"ec9adf09-c03d-4a50-9491-112175b1d8f2\"}":{"__typename":"Favorites","uuid":"ec9adf09-c03d-4a50-9491-112175b1d8f2","photoUrl":"https://ucarecdn.com/46f02f62-5e06-4926-85e0-a338841cc482/","title":"Rosalía","type":"ARTIST"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a5842138-3cbb-429a-bbc7-434aa17d03dc\"}":{"__typename":"DeepDives","uuid":"a5842138-3cbb-429a-bbc7-434aa17d03dc","content":"\u003cp\u003eIn high school, I never had the benefit of mentorship or guidance. When I decided to apply to colleges in the United States during my junior year, I had to navigate the entire process on my own. From researching scholarships to understanding application requirements, it was a challenging and overwhelming experience. Looking back, I realize how valuable it would have been to have someone guide me, help me avoid mistakes, and offer advice along the way. No matter how many resources you have, having someone who's been through similar experiences can help you avoid pitfalls and make more informed decisions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe mentorship is not just about giving advice; it’s about having someone who truly understands your journey—someone who can relate to where you’re coming from and help you see where you want to go. I want to be that person for other students, helping them reach their dreams with guidance, understanding, and support. Mentorship can make the path less daunting and more rewarding, allowing students to enjoy their journey while making the most of the opportunities ahead.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"28113464-df8b-4273-9321-f241ddf995d4\"}":{"__typename":"DeepDives","uuid":"28113464-df8b-4273-9321-f241ddf995d4","content":"\u003cp\u003eSince I was young, one of my biggest dreams has been to go to space. In my lifetime, I hope to achieve that dream and contribute to the advancement of space exploration. More than just the personal experience of space travel, I want to play a role in making life multi-planetary, helping humanity expand beyond Earth and explore new frontiers. It’s a goal that drives me, and I hope to be part of the efforts that make this future a reality. I also hope that by pursuing this dream, I can inspire other young people to push the boundaries of their own ambitions, whether in space exploration or any field that excites them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"538030d3-0802-44b4-b126-fcd0a409fac6\"}":{"__typename":"DeepDives","uuid":"538030d3-0802-44b4-b126-fcd0a409fac6","content":"\u003cp\u003eMy greatest source of motivation is myself. Every day, I strive to make myself proud and prove that no matter where you come from or the opportunities you’ve had, you can fight for your dreams and make them a reality—just like I am doing. I want to inspire others to believe in themselves and not let their background or circumstances limit their potential. I believe that no matter where you start, it's about pushing yourself to go further and aiming for personal excellence, which is something we all have the power to do. My goal is to encourage people to pursue their dreams without fear or self-doubt, showing them that anything is possible with determination.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"1f110b3c-f920-4eec-932f-187942618ab7\"}":{"__typename":"DeepDives","uuid":"1f110b3c-f920-4eec-932f-187942618ab7","content":"\u003cp\u003eWhen I arrived at UC Berkeley, I felt lost and struggled with imposter syndrome. But I never let those thoughts interfere with my motivation. I had come too far to stop now. Since my freshman year of high school, I dreamed of being a NASA intern. Two years into my undergraduate degree, I achieved that dream by working as a research assistant for the Human and Computer Interaction group at NASA Ames. The experience and knowledge I gained that summer were invaluable for my professional development.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEven at places like UC Berkeley, where it might seem like everyone has it all figured out, feelings of doubt can creep in. But overcoming those doubts and continuing to strive for your dreams is something anyone can do with the right mindset. What I’m most proud of is how I’ve adapted to challenges, continued pursuing my dreams, and slowly checked off the goals I set for myself. Each step forward makes me more proud of what I’ve accomplished and motivates me to keep going.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"827f33fe-6995-474b-a1da-e69ed27b9ff1\"}":{"__typename":"School","uuid":"827f33fe-6995-474b-a1da-e69ed27b9ff1","name":"Isidro A. Sánchez High School","city":"Luquillo","type":"HIGH","state":"Luquillo","country":"Puerto Rico","zip":"00773"},"Education:{\"uuid\":\"44aba2e6-39c4-48ea-8120-ea302fcf727c\"}":{"__typename":"Education","uuid":"44aba2e6-39c4-48ea-8120-ea302fcf727c","school":{"__ref":"School:{\"uuid\":\"827f33fe-6995-474b-a1da-e69ed27b9ff1\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"473c9266-0876-4534-8844-326dcf69ef59\"}":{"__typename":"Education","uuid":"473c9266-0876-4534-8844-326dcf69ef59","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"8d68ecc5-dd7f-4f3c-9572-6178bafb6598\"}":{"__typename":"MentorPublicProfile","uuid":"8d68ecc5-dd7f-4f3c-9572-6178bafb6598","displayName":"Larielys N.","slug":"larielys-nieves","biography":"\u003cp\u003eEver since I was young, I’ve been fascinated by space and the possibility of life beyond Earth. This passion has driven much of my academic and professional journey, and I’m proud to be turning my dreams into reality.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOriginally from Luquillo, Puerto Rico, I moved to Berkeley, California, to pursue my undergraduate degree at UC Berkeley. I am currently studying Cognitive Science and Data Science with a focus on space exploration. I aim to contribute to the space industry through education, leadership, and research, with the ultimate goal of becoming an astronaut. I chose Cognitive Science because it combines many of the fields I’m passionate about, providing me with a wide range of opportunities for continued learning, including graduate school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne of the major highlights of my journey has been working as a research assistant for NASA's Human and Computer Interaction group at NASA Ames. This experience perfectly blended my studies with my passion for space. It taught me invaluable lessons in collaboration, innovation, and how technology can be used to explore new frontiers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I’m passionate about Olympic weightlifting and foreign languages. I’ve been weightlifting since I was 9 years old, and today I can squat almost three times my body weight. In addition, I love learning new languages. I taught myself English by watching cartoons as a kid in Puerto Rico and, during quarantine, I challenged myself to learn Mandarin Chinese. Now, I speak five languages and aim to learn at least ten in my lifetime.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentoring is another passion of mine. I didn’t have much guidance growing up, especially when navigating the complex process of applying to universities in the United States. That experience made me realize how important it is to have someone who can guide you, offer support, and help you make informed decisions. Today, I strive to be that person for others, particularly students who share a passion for science, technology, or space.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the future, I hope to contribute to making life multi-planetary and help humanity explore new worlds. Along the way, I want to inspire the next generation of explorers, showing them that no dream is too big if you work hard and believe in yourself. Whether through mentorship, research, or exploration, I’m committed to pushing the boundaries of what’s possible and helping others do the same.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eP.S. I love singing, dancing, especially salsa and afro, and fashion!!\u003c/p\u003e","teachingVideoPlaybackId":"V9gAKZaNpNGdHtUCkouaMP6BRv7d47fuNM7xZSG016YE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bdf03909-e261-4237-869f-143a6295413f\"}"},{"__ref":"Favorites:{\"uuid\":\"f75a9521-e957-4ac3-ab21-b847153ec20f\"}"},{"__ref":"Favorites:{\"uuid\":\"ec9adf09-c03d-4a50-9491-112175b1d8f2\"}"}],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a5842138-3cbb-429a-bbc7-434aa17d03dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"28113464-df8b-4273-9321-f241ddf995d4\"}"},{"__ref":"DeepDives:{\"uuid\":\"538030d3-0802-44b4-b126-fcd0a409fac6\"}"},{"__ref":"DeepDives:{\"uuid\":\"1f110b3c-f920-4eec-932f-187942618ab7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/afc0d0e6-eb7c-4771-a594-adaec93efe96/-/preview/-/format/jpg/","https://ucarecdn.com/3d9148b3-701b-4a5f-937c-6438fd5fa8ee/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"44aba2e6-39c4-48ea-8120-ea302fcf727c\"}"},{"__ref":"Education:{\"uuid\":\"473c9266-0876-4534-8844-326dcf69ef59\"}"}],"hiredAt":"2024-09-17T00:29:13.798Z","topics":[],"communityBadges":["https://ucarecdn.com/9a4c114f-3114-4d6c-908a-b4d35953934d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lari
