xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e1203af2-1134-4c01-be19-9895aa087ad7\"}":{"__typename":"Favorites","uuid":"e1203af2-1134-4c01-be19-9895aa087ad7","photoUrl":"https://ucarecdn.com/e07a9b4e-665d-45b7-827f-83e811287d2d/","title":"Margot Robbie","type":"ACTOR"},"Favorites:{\"uuid\":\"60f03b9c-14a9-4f6d-bcad-2289b7dfa3e4\"}":{"__typename":"Favorites","uuid":"60f03b9c-14a9-4f6d-bcad-2289b7dfa3e4","photoUrl":"https://ucarecdn.com/e64596c3-e152-4178-ae7c-c44f92095f6e/","title":"RUBY by Jennie","type":"ALBUM"},"Favorites:{\"uuid\":\"d1a5737a-c493-457e-ac61-960ca40e30a4\"}":{"__typename":"Favorites","uuid":"d1a5737a-c493-457e-ac61-960ca40e30a4","photoUrl":"https://ucarecdn.com/1943fe1c-7a97-4dc9-a7c9-abfab043f678/","title":"Charlie XCX","type":"ARTIST"},"CausesSupported:{\"uuid\":\"c325908a-fa8e-446e-a945-c194571bfa48\"}":{"__typename":"CausesSupported","uuid":"c325908a-fa8e-446e-a945-c194571bfa48","name":"HIPHOP Community Health Initiative","description":"\u003cp\u003eServes diverse, underserved patients facing social and structural health barrier\u003c/p\u003e","photoUrl":"https://ucarecdn.com/4b7bfc1e-6c97-4e7e-986f-a745b8c43266/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"df4fba6d-a767-4ce6-99ad-9e944f052260\"}":{"__typename":"DeepDives","uuid":"df4fba6d-a767-4ce6-99ad-9e944f052260","content":"\u003cp\u003eMentorship matters to me because I believe guidance, encouragement, and support can truly change the trajectory of someone’s life. Throughout my own journey, I have benefitted from mentors who not only shared knowledge, but also believed in me when I doubted myself. That sense of reassurance and empowerment helped me grow academically, professionally, and personally. Mentorship, to me, is about more than explaining concepts or giving advice. It is about listening, understanding someone’s goals, and helping them realize their potential. I value the opportunity to create a safe learning space where students feel comfortable asking questions, making mistakes, and developing confidence. Knowing that I can play even a small role in someone’s growth is deeply meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"62809f76-f43e-4108-859e-90746dcc0bec\"}":{"__typename":"DeepDives","uuid":"62809f76-f43e-4108-859e-90746dcc0bec","content":"\u003cp\u003eMy dream job is to become a physician who combines clinical care, research, and mentorship. I hope to work in a specialty that allows me to build meaningful patient relationships while also contributing to scientific knowledge and improving healthcare systems. I envision myself teaching future medical trainees, supporting students, and helping shape compassionate, thoughtful future physicians. Ultimately, I want a career rooted in service, curiosity, and human connection.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"d1c6039f-12b2-41c7-81a1-dc6a371d6741\"}":{"__typename":"DeepDives","uuid":"d1c6039f-12b2-41c7-81a1-dc6a371d6741","content":"\u003cp\u003eMy greatest source of motivation is the desire to make a meaningful impact on others. Whether that is through patient care, mentorship, or community engagement, I am driven by the belief that compassion and knowledge can improve lives. I am also motivated by my family, my personal goals, and my commitment to growth. Knowing that every step I take brings me closer to serving others in a greater capacity keeps me focused and determined.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"3d807f56-baad-405d-97c7-e88390f38ee6\"}":{"__typename":"DeepDives","uuid":"3d807f56-baad-405d-97c7-e88390f38ee6","content":"\u003cp\u003eAs a high school student, I was motivated, curious, and deeply involved in my school community. I loved learning, especially in the sciences, and I enjoyed finding ways to challenge myself academically. At the same time, I was active in extracurriculars, leadership roles, and service activities. I valued building connections with others and supporting my peers. Looking back, I see that those experiences shaped my appreciation for teamwork, mentorship, and lifelong learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"b91ec275-9a27-4b00-97b6-a6c182837ceb\"}":{"__typename":"School","uuid":"b91ec275-9a27-4b00-97b6-a6c182837ceb","name":"Morris County School of Technology","city":"Denville","type":"HIGH","state":"New Jersey","country":"United States","zip":"07834"},"Education:{\"uuid\":\"b741fbf3-0207-4cc6-9690-424ac7dcca85\"}":{"__typename":"Education","uuid":"b741fbf3-0207-4cc6-9690-424ac7dcca85","school":{"__ref":"School:{\"uuid\":\"b91ec275-9a27-4b00-97b6-a6c182837ceb\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"89ab1d6b-3bfa-4028-b567-d5668a7cbdaa\"}":{"__typename":"Education","uuid":"89ab1d6b-3bfa-4028-b567-d5668a7cbdaa","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"f89379f5-c7a2-40a6-b151-d79d4b8871fd\"}":{"__typename":"MentorPublicProfile","uuid":"f89379f5-c7a2-40a6-b151-d79d4b8871fd","displayName":"Rishika V.","slug":"rishika-voruganti","biography":"\u003cp\u003eHi! My name is Rishika, and I am a current medical student with a genuine passion for learning, mentorship, and helping others discover their academic strengths. I believe education is most powerful when students feel supported, confident, and encouraged to ask questions, and I strive to create a learning environment that feels welcoming and empowering. My goal as a tutor is not only to help students understand the material in front of them, but also to build the skills and confidence they need to succeed long term.\u003c/p\u003e\u003cp\u003eAcademically, I study medicine with a strong foundation in the sciences and a deep appreciation for how the human body works. I enjoy taking complex topics and breaking them down into clear, approachable explanations that make students feel capable rather than overwhelmed. Throughout my education, I have developed a systematic and organized way of learning, and I enjoy sharing strategies for studying, problem solving, and critical thinking. I especially value patience and clear communication, and I always meet students where they are.\u003c/p\u003e\u003cp\u003eBeyond academics, I stay actively involved in leadership, wellness initiatives, and research. I have worked in student development and community health spaces, where I supported students and patients through mentorship, education, and advocacy. These experiences have shaped my teaching style into one that is compassionate, structured, and student-centered. I care deeply about the well-being of the people I work with, and I believe learning should feel safe and encouraging rather than intimidating.\u003c/p\u003e\u003cp\u003eSome unique aspects of my journey include leading wellness programming, engaging in medical research, presenting scholarly work, and supporting community-focused initiatives. Through these roles, I have learned how to communicate clearly, collaborate effectively, and remain adaptable to each person’s needs and learning style. Most importantly, I have learned how meaningful it is to uplift others and celebrate progress, both big and small.\u003c/p\u003e\u003cp\u003eWhat I care about most as a tutor is helping students realize that they are capable of mastering challenging material. I love seeing concepts “click” and watching confidence grow over time. Whether a student needs foundational review, structured guidance, or simply someone who believes in them, I am committed to being a positive, supportive presence throughout their learning journey. I look forward to helping students reach their goals while making the process engaging, motivating, and rewarding.\u003c/p\u003e","teachingVideoPlaybackId":"VzqdDK9BMlESFnFaK33Kmk02OaS4Np1qFwOi3QWjJhCM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest accomplishment is earning my place in medical school and everything it took to get here. At UCLA, I grew a lot through leadership and service, especially during my time in Washington D.C. as the Coordinator of Student Development with the University of California Office of the President. Now at Rutgers Robert Wood Johnson Medical School, I’m proud of the work I’ve done as SGA Vice President of Wellness and through my research with mentors like Dr. Rao and Dr. Alopi Patel. This journey has taken resilience and heart, and it reminds me every day why I care so deeply about people and medicine.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e1203af2-1134-4c01-be19-9895aa087ad7\"}"},{"__ref":"Favorites:{\"uuid\":\"60f03b9c-14a9-4f6d-bcad-2289b7dfa3e4\"}"},{"__ref":"Favorites:{\"uuid\":\"d1a5737a-c493-457e-ac61-960ca40e30a4\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"c325908a-fa8e-446e-a945-c194571bfa48\"}"}],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"df4fba6d-a767-4ce6-99ad-9e944f052260\"}"},{"__ref":"DeepDives:{\"uuid\":\"62809f76-f43e-4108-859e-90746dcc0bec\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1c6039f-12b2-41c7-81a1-dc6a371d6741\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d807f56-baad-405d-97c7-e88390f38ee6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cd8f23a7-13d0-4c56-b62f-ceb2fb8de022/-/preview/-/format/jpg/","https://ucarecdn.com/dd76cb4a-c57a-4555-9cf0-156c01ec26cc/-/preview/-/format/jpg/","https://ucarecdn.com/da48529f-8704-4fe3-92f5-8ed47fdd220d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b741fbf3-0207-4cc6-9690-424ac7dcca85\"}"},{"__ref":"Education:{\"uuid\":\"89ab1d6b-3bfa-4028-b567-d5668a7cbdaa\"}"}],"hiredAt":"2025-12-28T22:00:51.398Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading"],"communityBadges":["https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"rishika-voruganti\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f89379f5-c7a2-40a6-b151-d79d4b8871fd\"}"}}},"_sentryTraceDat
