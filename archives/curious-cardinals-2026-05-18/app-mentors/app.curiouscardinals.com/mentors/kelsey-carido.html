xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a4e9f1c9-7395-46b7-b520-e194c5682354\"}":{"__typename":"DeepDives","uuid":"a4e9f1c9-7395-46b7-b520-e194c5682354","content":"\u003cp\u003eOh my gosh where do I even begin! The most influential people in my life have been mentors. I believe that mentorship not only provides someone with a guiding voice, but an invaluable sounding board to both process and hear your own thoughts, hopes, and dreams. Without my mentors, I would most definitely not be where I am today and I have their patience, listening hearts, and sound advice to thank. It would be me honor to give back to someone else as their mentor in the ways that I've extremely benefitted from my own! I hope that person is YOU!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"c689327e-9b38-4226-b802-74db0788f22e\"}":{"__typename":"DeepDives","uuid":"c689327e-9b38-4226-b802-74db0788f22e","content":null,"videoPlaybackId":"cPQSr1CMooOuoU3pWz02aLHelnpALMxnKfu9fSszd8oE","question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"accb279e-ef31-4502-82a4-6cc2e7dbf23d\"}":{"__typename":"DeepDives","uuid":"accb279e-ef31-4502-82a4-6cc2e7dbf23d","content":"\u003cp\u003eDuring the pandemic, I created a project using WhatsApp (a messaging platform/application) to teach migrant children English! \u003cbr\u003e\u003cbr\u003eWe would use the audio message function to speak to each other back and forth and use photos and emojis✌️ to learn basic English phrases and vocabulary. \u003cbr\u003e\u003cbr\u003eSeeing how much the students loved learning English was extremely rewarding but moreover it was impactful to see how much just having someone to talk to, someone who is invested in their learning and someone who cares (because many of them had to leave their schools and are living in less-than-ideal situations) meant to the kids. It was inspiring to be a part of and to see.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"19a0ecba-b106-438c-a2af-19e98808e4c2\"}":{"__typename":"School","uuid":"19a0ecba-b106-438c-a2af-19e98808e4c2","name":"Vernon Hills High School","city":"Vernon Hills","type":"HIGH","state":"IL","country":"USA","zip":"60061"},"Education:{\"uuid\":\"83516609-12d7-4bd1-8b8a-d85aa92e7fb0\"}":{"__typename":"Education","uuid":"83516609-12d7-4bd1-8b8a-d85aa92e7fb0","school":{"__ref":"School:{\"uuid\":\"19a0ecba-b106-438c-a2af-19e98808e4c2\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"5cb4250e-a95f-40c6-8f5a-06c39df6186e\"}":{"__typename":"Education","uuid":"5cb4250e-a95f-40c6-8f5a-06c39df6186e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"International Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"c27dd5d9-d6b8-41c2-9108-b5b9e2fc2f36\"}":{"__typename":"MentorPublicProfile","uuid":"c27dd5d9-d6b8-41c2-9108-b5b9e2fc2f36","displayName":"Kelsey C.","slug":"kelsey-carido","biography":"\u003cp\u003eHello! I'm so happy you are here 😊 \u003cbr\u003e\u003cbr\u003eMy name is Kelsey and I just graduated from Stanford University in June 2023 with my BA in International Relations and minor in Human Rights. I would say I am a life-long learner who is passionate about discovering new places, cultures, and people while figuring out how I can make a lasting impact on the lives of others! \u003cbr\u003e\u003cbr\u003eI am passionate about migrant justice and public service, where I've interned at places like the Senate Committee on Foreign Relations, the U.S. Mission to the United Nations and the White House!!\u003cbr\u003e\u003cbr\u003eI will be attending Harvard Law School in a few years, so if you want to talk about Law or Law School I am here to help!!\u003cbr\u003e\u003cbr\u003eOutside of career things, I love music (singing, playing guitar, piano, ukulele!!) and photography (both film and digital)\u003cbr\u003e\u003cbr\u003eI am grateful for the opportunity to work with you and your child and can't wait to learn and grow together!✨♥️\u003c/p\u003e","teachingVideoPlaybackId":"qXquNOVXw02tRwzw1xO79401D7zVMMNHaoM00ydpvQToV4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"International Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a4e9f1c9-7395-46b7-b520-e194c5682354\"}"},{"__ref":"DeepDives:{\"uuid\":\"c689327e-9b38-4226-b802-74db0788f22e\"}"},{"__ref":"DeepDives:{\"uuid\":\"accb279e-ef31-4502-82a4-6cc2e7dbf23d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/48f07250-1b4c-4c6e-8ee2-a76012f7eb4d/-/preview/-/format/jpg/","https://
