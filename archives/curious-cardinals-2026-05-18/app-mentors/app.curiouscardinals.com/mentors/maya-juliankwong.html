xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4c250bec-583c-429a-bd1d-b2a457c4db11\"}":{"__typename":"Favorites","uuid":"4c250bec-583c-429a-bd1d-b2a457c4db11","photoUrl":"https://ucarecdn.com/f5e81a51-6032-4450-86ee-e3e65bce42cd/","title":"Overwatch","type":"GAME"},"Favorites:{\"uuid\":\"e45af707-5eee-4810-b852-9d77e9337f97\"}":{"__typename":"Favorites","uuid":"e45af707-5eee-4810-b852-9d77e9337f97","photoUrl":"https://ucarecdn.com/5f3f3c25-8071-4ed0-ba45-27b4848edc8b/","title":"Remember the Titans","type":"MOVIE"},"Favorites:{\"uuid\":\"adad79a3-b18e-4f0d-982a-0b69c0bcb80e\"}":{"__typename":"Favorites","uuid":"adad79a3-b18e-4f0d-982a-0b69c0bcb80e","photoUrl":"https://ucarecdn.com/ae518ee5-2881-4439-82dc-243451a3803b/","title":"Hamilton","type":"PLAY"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5290b212-8be5-4c90-926d-876438499b0a\"}":{"__typename":"DeepDives","uuid":"5290b212-8be5-4c90-926d-876438499b0a","content":"\u003cp\u003eIn high school, I spent a lot of my summers working at various restaurants as both a manager and server. I loved these work experiences as I got to meet and become friends with people from many different walks of life, and interact with customers every day. I also appreciated having an extracurricular that felt fairly separated from academics, where I learned that I love motivating myself and being the best I can at any job. In addition, I often spent a week or two traveling with my family, and every minute of spare time with my friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"b82b7f27-ddbb-4173-a355-99f1a0d35427\"}":{"__typename":"DeepDives","uuid":"b82b7f27-ddbb-4173-a355-99f1a0d35427","content":"\u003cp\u003eAs I am a tri-racial woman of color, I have learned how to advocate for myself and strongly pursue my various interests. My past experiences have taught me the importance of speaking up for myself and knowing what learning styles work for me. This will impact my mentorship style, as I want to focus--in both academic mentorships and passion projects--on fostering curiosity and voice. I think these capabilities can open up a lot of opportunities for anyone who works to develop them. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"60fe495d-dfbe-4cc6-8231-d680997f4baf\"}":{"__typename":"DeepDives","uuid":"60fe495d-dfbe-4cc6-8231-d680997f4baf","content":"\u003cp\u003eI am extremely proud of the people I choose to surround myself with. I know, it sounds cliche, but I truly believe I am extremely lucky to have my family and close circle of friends. They not only make every day more fun, but they also motivate me to be the best person I can be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"872a879e-3408-4e66-8bd4-7dd54f3a99fe\"}":{"__typename":"DeepDives","uuid":"872a879e-3408-4e66-8bd4-7dd54f3a99fe","content":"\u003cp\u003eMy dream job would be an amalgamation of a few separate jobs: first, I would love to be a doctor. I think this job would both stimulate my brain and satisfy my desire to help others. Second, I have always dreamed of being a chef. I still love cooking dinner every night and finding new ways to express my creativity through food. Lastly, I would love to be a professional traveler and food blogger, because there are so many places and dishes I have yet to try. So, I guess my dream job is some sort of weekly rotation that combines these three. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}":{"__typename":"School","uuid":"70146acc-a4ce-459e-8969-b791ab43dfb2","name":"Menlo School","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"ea1a8b54-8b7b-43d2-a542-9031fc61f2d9\"}":{"__typename":"Education","uuid":"ea1a8b54-8b7b-43d2-a542-9031fc61f2d9","school":{"__ref":"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"0c9002c5-132e-4097-aa36-99cf122a0a8e\"}":{"__typename":"Education","uuid":"0c9002c5-132e-4097-aa36-99cf122a0a8e","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"d7560042-1609-4d7b-a79d-c0ddc0fc4989\"}":{"__typename":"MentorPublicProfile","uuid":"d7560042-1609-4d7b-a79d-c0ddc0fc4989","displayName":"Maya J.","slug":"maya-juliankwong","biography":"\u003ch3\u003eMaya, Neuroscience (Academic Mentorship \u0026amp; Passion Projects)\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eHi! I’m Maya, a fourth-year student at Brown University majoring in Neuroscience on the pre-medical track, and I help students nurture their curiosity for science and build a toolkit for academics and for life beyond the classroom.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eGet To Know Me:\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eEver since my first science fair project in middle school where I made plastic out of milk and vinegar, I have loved the sciences and approaching academics with a curious and growth-focused mindset. Since then, I’ve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTutored high school physics students, helping them with laboratory experiments and leading course review sessions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked as a teaching assistant for a core neuroscience course at Brown, guiding students through complex topics like the sensory and motor systems\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as a Peer Advisor for first-year students, holistically mentoring them by offering support both academically, as well as emotionally, mentally, and socially.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreated and ran a college application preparation program for high school juniors and seniors, where I focused on finding one’s voice and improving one’s writing style.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThrough these experiences, I’ve learned that curiosity, thoughtful conversation, and critical thinking are the building blocks for development\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eHow I Can Help You!\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI mentor students who are eager to explore:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eScience foundations in biology, physics, chemistry, and math\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWriting and communication skills, both inside and outside the classroom\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAcademic skills development, such as studying effectively, staying organized, and communicating your ideas clearly\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePassion projects that creatively explore your interests\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI work best with students who are committed to getting the most out of our mentorship together, just as I am!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eMy Mentorship Style\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eA session with me will focus on dynamic and active learning with a growth mindset. Throughout my mentorship and teaching experiences, I have learned the importance of understanding and applying, rather than simply memorizing. You can expect sessions to include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eVisual demonstrations or outside-of-the-box explanations for science topics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding confidence by breaking down complex material into clear, approachable pieces\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReflecting on how you learn best so you can grow as a learner, not just a student\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eWhether we’re working through difficult assignment problems or brainstorming project ideas, I always want to ensure my mentees are engaged and retaining a deeper understanding of what we learn or work towards.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eOutside of academics\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOutside of class, you’ll probably find me rock climbing, hiking, or backpacking. I’m also passionate about traveling—I just spent a semester abroad in Copenhagen, and I’m hoping to plan a backpacking trip through Asia in the next few years. Most of all, I love spending time with friends and family, whether that’s cooking together, working out with my siblings, or binging movies with my friends.\u003c/p\u003e\u003cp\u003eIf you’re looking for academic mentorship or guidance for a passion project—and want to build a strong foundation for your future in science or medicine—I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"qN4dNxNoDyqduPtPyTWC9lIXc5gHdUBeOymspwExgTo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4c250bec-583c-429a-bd1d-b2a457c4db11\"}"},{"__ref":"Favorites:{\"uuid\":\"e45af707-5eee-4810-b852-9d77e9337f97\"}"},{"__ref":"Favorites:{\"uuid\":\"adad79a3-b18e-4f0d-982a-0b69c0bcb80e\"}"}],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5290b212-8be5-4c90-926d-876438499b0a\"}"},{"__ref":"DeepDives:{\"uuid\":\"b82b7f27-ddbb-4173-a355-99f1a0d35427\"}"},{"__ref":"DeepDives:{\"uuid\":\"60fe495d-dfbe-4cc6-8231-d680997f4baf\"}"},{"__ref":"DeepDives:{\"uuid\":\"872a879e-3408-4e66-8bd4-7dd54f3a99fe\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/942dee52-9aa7-4969-bbef-acf5faa5c925/-/preview/-/format/jpg/","https://ucarecdn.com/77cb6f2e-5dcf-4f00-bce9-91333e83f6bd/-/preview/-/format/jpg/","https://ucarecdn.com/b0d6090c-9851-4d01-a87f-3c5abff4863b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ea1a8b54-8b7b-43d2-a542-9031fc61f2d9\"}"},{"__ref":"Education:{\"uuid\":\"0c9002c5-132e-4097-aa36-99cf122a0a8e\"}"}],"hiredAt":"2025-10-04T17:02:00.799Z","topics":["Pre-Algebra","Algebra I","Algebra II","K-5 Grade Math","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","A
