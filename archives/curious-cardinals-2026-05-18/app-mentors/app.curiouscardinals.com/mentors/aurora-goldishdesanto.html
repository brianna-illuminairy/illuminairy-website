xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ef8d988d-7e3c-4331-a7c3-7461ebbb46f8\"}":{"__typename":"Favorites","uuid":"ef8d988d-7e3c-4331-a7c3-7461ebbb46f8","photoUrl":"https://ucarecdn.com/7e6033a5-689f-42fb-ae85-78fe172550de/","title":"Ryan Reynolds ","type":"ACTOR"},"Favorites:{\"uuid\":\"b62fea56-1d93-4413-b453-68c14eb71537\"}":{"__typename":"Favorites","uuid":"b62fea56-1d93-4413-b453-68c14eb71537","photoUrl":"https://ucarecdn.com/69004c00-a8e7-4945-afba-e5f7f4167db0/","title":"Tate McRae","type":"ARTIST"},"Favorites:{\"uuid\":\"d873e73c-c396-4487-82cf-909ab4e06bfc\"}":{"__typename":"Favorites","uuid":"d873e73c-c396-4487-82cf-909ab4e06bfc","photoUrl":"https://ucarecdn.com/729eb32c-0ccd-4a16-bfdd-9c3a619e4064/","title":"Gymnastics","type":"SPORT"},"CausesSupported:{\"uuid\":\"3f484194-370d-4cbe-9352-7f522034f743\"}":{"__typename":"CausesSupported","uuid":"3f484194-370d-4cbe-9352-7f522034f743","name":"Kindly Hearts Initiative","description":"\u003cp\u003eI support this cause through Alpha Xi Delta’s philanthropy work.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/5e80d20d-1104-4ca0-9377-98e355f3959b/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"26182db5-c9d2-4985-b618-22845c01235d\"}":{"__typename":"DeepDives","uuid":"26182db5-c9d2-4985-b618-22845c01235d","content":"\u003cp\u003eI would tell my high school self that everything truly does work out, as long as you’re trying your best. I used to stress so much about getting into college when I was in high school and whether I was doing enough, but I’ve learned that it’s not about being perfect. It’s about showing up, working hard, and being a good person. The only time things start to fall apart is when you give up on yourself. If you keep going, stay curious, and trust the process, you’ll end up exactly where you’re meant to be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"944e3b1f-618c-4fad-9fcc-3a7256a0cc4b\"}":{"__typename":"DeepDives","uuid":"944e3b1f-618c-4fad-9fcc-3a7256a0cc4b","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to make a real impact in people’s lives by helping them feel seen, supported, and safe. I want to become a doctor, not just to treat people, but to be a steady presence they can trust through some of their hardest moments. My goal is to bring both care and comfort to those I help, and to redefine what it means to support someone by making the process feel human, not just clinical. Whether through science, mentorship, or simply showing up with kindness, I want to be the reason someone felt less alone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"eb116442-100e-4914-a878-8bacc159e863\"}":{"__typename":"DeepDives","uuid":"eb116442-100e-4914-a878-8bacc159e863","content":"\u003cp\u003eAs someone with ADHD, my identity has shaped my teaching style in powerful ways. I’ve learned that my brain processes information best through visual learning, repetition, and hands-on practice, and I bring that same mindset into how I mentor others. I know what it feels like to need things explained more than once, to benefit from structure and encouragement, and to appreciate when someone takes the time to slow down and make space for questions. Because of this, I always strive to create a patient, organized, and engaging learning environment where students feel comfortable and supported, no matter their learning style. I want my students to know that it’s okay to learn differently, and that with the right approach, they can thrive\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"e5af6211-7b83-42cf-a2b5-6f96171ebbfe\"}":{"__typename":"DeepDives","uuid":"e5af6211-7b83-42cf-a2b5-6f96171ebbfe","content":"\u003cp\u003eMy greatest source of motivation comes from the low points, like staying up all night cramming for a test I procrastinated on, or feeling like I completely failed something I cared about. In those moments, I felt stuck, overwhelmed, and like I had no one to blame but myself. However, I also saw what I was capable of when I pushed through and when I slowed down, asked for help, got organized, and worked harder next time. I never want to feel that helpless again, and that memory pushes me to stay on track, plan ahead, and take ownership of my goals. Those hard moments are now what remind me that I can grow through anything.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"0dbb016b-84f4-40d8-9296-cb3b86dbe301\"}":{"__typename":"School","uuid":"0dbb016b-84f4-40d8-9296-cb3b86dbe301","name":"Shorecrest Preparatory School","city":"St. Petersburg","type":"HIGH","state":"Florida","country":"United States","zip":"33703"},"Education:{\"uuid\":\"c5fcdc50-050d-4f70-a4f1-09d0c930c0ae\"}":{"__typename":"Education","uuid":"c5fcdc50-050d-4f70-a4f1-09d0c930c0ae","school":{"__ref":"School:{\"uuid\":\"0dbb016b-84f4-40d8-9296-cb3b86dbe301\"}"},"startYear":"2008","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"4a2b0841-62b3-4571-a9f8-479696c5b8f0\"}":{"__typename":"Education","uuid":"4a2b0841-62b3-4571-a9f8-479696c5b8f0","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Biology and Society","degree":null},"MentorPublicProfile:{\"uuid\":\"f9d86a48-f95d-4159-bfaf-44aea338ccbe\"}":{"__typename":"MentorPublicProfile","uuid":"f9d86a48-f95d-4159-bfaf-44aea338ccbe","displayName":"Aurora G.","slug":"aurora-goldishdesanto","biography":"\u003cp\u003eHi! My name is Aurora, and I am so excited to be a part of the Curious Cardinals community!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m currently a Biology and Society major on the pre-med track at Cornell University. I have a huge love for science, mainly an interest in neuroscience and psychology. However, I have learned to expand my skills in various academic areas and also love reading and writing. In my free time and everynight before bed you will find me reading a good book!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA large part of my college career is dedicated to extracurricular activities that align with my interests as a pre-med student, such as shadowing physicians and volunteering at my local hospital. I also am a part of a club called science kits where we make science experiments for younger kids to perform and learn from. Additionally, I am a part of the Surgical Society and a sorority.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBesides studying in the library or attending class, I am found in my academic research lab. During my first year at Cornell, I’ve been lucky enough to have the opportunity to conduct research in a lab focused on neurodegeneration, using mice embryo genes and their olfactory system. In the future I will conduct a thesis statement on what I have learned and have contributed to the lab. I’m very excited to see where this research will take off and how it might contribute to our understanding of the regeneration of neurons and how that connects to regrowing tissue.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAside from my academics, I love spending time with my friends and enjoying the nature of Ithaca, where my university is located. I love being surrounded by people and experiencing new things.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI decided to join the Curious Cardinals community because I know what it’s like to need a mentor. As someone who is neurodivergent, with ADHD and dyslexia, school didn’t always come easily to me, and sometimes, I just needed someone to meet me where I was and believe in my potential. I want to be that person for someone else. I believe that mentorship isn’t just about academics, it’s about creating a space where students feel seen, supported, and excited to learn in their own way. My goal as a mentor is to make learning feel approachable, personalized, and fun, and to help each student grow not just in knowledge, but in confidence.\u003c/p\u003e","teachingVideoPlaybackId":"C00flrUQ9021N02cNNaypPrjXsrXshV001Uf3QuU008UAHC00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I’m really proud of is the progress I’ve made with my time management skills. Staying focused has always been one of my biggest challenges, especially as someone who’s easily distracted and very social. In high school, I’d often lose track of time or get pulled into conversations when I was supposed to be studying. Even now, if a friend walks up to me in the library, it takes real effort to stay on track. But over time, I’ve developed a lot more self-discipline. I’ve learned how to set boundaries, create routines, and keep myself accountable. It wasn’t easy, but now I feel in control of my time instead of overwhelmed by it. That sense of growth is something I hope to pass on to my mentees; to show them that even your biggest challenges can become your strengths.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ef8d988d-7e3c-4331-a7c3-7461ebbb46f8\"}"},{"__ref":"Favorites:{\"uuid\":\"b62fea56-1d93-4413-b453-68c14eb71537\"}"},{"__ref":"Favorites:{\"uuid\":\"d873e73c-c396-4487-82cf-909ab4e06bfc\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"3f484194-370d-4cbe-9352-7f522034f743\"}"}],"major":"Biology and Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"26182db5-c9d2-4985-b618-22845c01235d\"}"},{"__ref":"DeepDives:{\"uuid\":\"944e3b1f-618c-4fad-9fcc-3a7256a0cc4b\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb116442-100e-4914-a878-8bacc159e863\"}"},{"__ref":"DeepDives:{\"uuid\":\"e5af6211-7b83-42cf-a2b5-6f96171ebbfe\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f5944374-0d68-423a-94ca-3148b78cbd1c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c5fcdc50-050d-4f70-a4f1-09d0c930c0ae\"}"},{"__ref":"Education:{\"uuid\":\"4a2b0841-62b3-4571-a9f8-479696c5b8f0\"}"}],"hiredAt":"2025-05-31T12:28:38.432Z","topics":["K-5 Grade Math","Pre-Algebra","Biology","Writing","College Essay Writing","Reading","K-6 Storybook","Creative Writing","History Project","Medicine / Health","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Que
