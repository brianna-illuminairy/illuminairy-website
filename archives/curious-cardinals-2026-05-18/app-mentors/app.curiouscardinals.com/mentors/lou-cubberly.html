ad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a2e0b288-832a-4417-8a67-029165c58029\"}":{"__typename":"DeepDives","uuid":"a2e0b288-832a-4417-8a67-029165c58029","content":null,"videoPlaybackId":"3eeZMKSHhE9DZur3dKt1OcuYfAlkdNAXmI02e7SLHJzo","question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"8f3ea40f-800e-4cce-bd4f-2ef4bd21a168\"}":{"__typename":"School","uuid":"8f3ea40f-800e-4cce-bd4f-2ef4bd21a168","name":"Burr \u0026 Burton Academy","city":"Manchester","type":"HIGH","state":"Vermont","country":"United States","zip":"05254"},"Education:{\"uuid\":\"a609aa72-387b-4f1f-b69f-bb911f2acfe9\"}":{"__typename":"Education","uuid":"a609aa72-387b-4f1f-b69f-bb911f2acfe9","school":{"__ref":"School:{\"uuid\":\"8f3ea40f-800e-4cce-bd4f-2ef4bd21a168\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"97902639-b248-4ea2-a2ed-67b99ddfb0d2\"}":{"__typename":"School","uuid":"97902639-b248-4ea2-a2ed-67b99ddfb0d2","name":"McGill University","city":"Montréal","type":"COLLEGE","state":"Québec","country":"Canada","zip":"H3A 0G4"},"Education:{\"uuid\":\"0b9e8086-ed76-4ef3-acc2-e2e379b9a8d0\"}":{"__typename":"Education","uuid":"0b9e8086-ed76-4ef3-acc2-e2e379b9a8d0","school":{"__ref":"School:{\"uuid\":\"97902639-b248-4ea2-a2ed-67b99ddfb0d2\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2027","major":"Bioengineering","degree":null},"MentorPublicProfile:{\"uuid\":\"46177dab-1d18-4abf-9cb0-1f17ee310352\"}":{"__typename":"MentorPublicProfile","uuid":"46177dab-1d18-4abf-9cb0-1f17ee310352","displayName":"Lou C.","slug":"lou-cubberly","biography":"\u003cp\u003eHi! My name is Lou, and I’m a bioengineering major at McGill University in Montreal. I'm driven by the mysteries of the human brain and the potential to improve the lives of those living with neurodegenerative disorders like Alzheimer's and Parkinson's.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my studies, I've found so much fulfillment in mentoring: most recently, I worked with a high school freshman to develop a passion project centered on synthetic biology diagnostics for Parkinson's. Seeing her gain confidence in such a complex field was so inspiring and I look forward to guiding future students as they explore their own interests, whether that's through a project or classroom learning.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore Curious Cardinals, I worked as a chemistry tutor for first-year undergraduate students at McGill. This experience taught me that learning is never one-sided. Helping students understand difficult concepts is incredibly rewarding, but I also love the insight I gain into how others think and approach problems.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn a professional capacity, I worked as a quality engineering intern on a project manufacturing a medical device to treat lymphoma. It was not only exciting exposure to the engineering world, but I got to experience first-hand how rewarding it is to create solutions that help people. A year later I did something totally outside of my comfort zone and worked as a consultant in product development for an AI startup. It was a huge adjustment since I had been so bioengineering focused for the past few years but it turned out to be such a fun challenge! I got to create my own projects and learn a lot about this rapidly growing industry.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my academics, I’ve been playing guitar since the guitar was bigger than me, and I love textile arts, especially knitting. I’m also passionate about learning new languages, and I’m really intrigued by the link between language and cognition and how language structures can shape cultures. I speak English and French at home, I learned Spanish in school, and I’m currently working on learning Portuguese. I really cherish these activities because they’re not about being “good” or “bad”, they’re just intrinsically rewarding.\u0026nbsp;My goal in a mentorship would be to help a student cherish learning challenges.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I got to university, I quickly learned that at some point in math courses, the difference between right or wrong answers was not as simple as it was in high school. This really frustrated me until I started to think of math more like I thought of my knitting, guitar, or portuguese. The beauty of a math problem is in the theorems and the proofs and the concepts, but often we simply focus on an answer which is why I think it seems boring to many students. I’m excited about the opportunity to mentor students and help them discover the intrinsic reward of deeply understanding concepts, whether in math, chemistry, programming, or French.\u003c/p\u003e","teachingVideoPlaybackId":"9pMRiRR9WfLnU8biNv601jDmXeD01yVvJ00F8LI7KCReaw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3e59ba59-2a23-4ad4-b1cc-6c09a3431a2a\"}"},{"__ref":"Favorites:{\"uuid\":\"c3df8ba1-518b-440a-a2c2-b743f2be14ce\"}"},{"__ref":"Favorites:{\"uuid\":\"1e6d1045-0ade-44fd-8024-6ca678dd102c\"}"}],"causesSupported":[],"major":"Bioengineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"05ec9aa9-9a7c-465f-b7b5-366552f29b37\"}"},{"__ref":"DeepDives:{\"uuid\":\"c9a53046-d173-43c7-8720-643ea26d074b\"}"},{"__ref":"DeepDives:{\"uuid\":\"a2e0b288-832a-4417-8a67-029165c58029\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/155cbd4f-419a-4ead-b152-fe1f82e4a231/-/preview/-/format/jpg/","https://ucarecdn.com/0f3086d6-4cb4-40bc-a360-53a79cf22407/-/preview/-/format/jpg/","https://ucarecdn.com/6ddb1871-4c8d-45cd-8f0f-d74cd3a3eb19/-/preview/-/format/jpg/"],"pronouns":"SHE_H
