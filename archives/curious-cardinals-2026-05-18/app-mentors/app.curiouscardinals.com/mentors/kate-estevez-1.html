xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8aa161ec-1173-43a1-a07b-39f16f5b0ec3\"}":{"__typename":"Favorites","uuid":"8aa161ec-1173-43a1-a07b-39f16f5b0ec3","photoUrl":"https://ucarecdn.com/28d0c01b-7b65-46c6-9908-b7cd0bf951c9/","title":"The Metamorphosis","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"09dafd4f-1a0b-44f2-ae66-ef949e400f9d\"}":{"__typename":"DeepDives","uuid":"09dafd4f-1a0b-44f2-ae66-ef949e400f9d","content":"\u003cp\u003eYou don’t need to be exceptional at everything—just genuinely curious about a few things. Stop confusing pressure with passion. It’s okay if you don’t know yet what you want to be; clarity comes from doing, not from overthinking.\u003c/p\u003e\u003cp\u003eTake care of your mental health \u003cem\u003ebefore\u003c/em\u003e you feel like you’re falling behind. Being tired, anxious, or overwhelmed isn’t a personal failure—it’s a signal. Ask for help sooner. It doesn’t make you weak; it makes you efficient.\u003c/p\u003e\u003cp\u003eYour grades matter, but not as much as learning how to think, ask questions, and recover from mistakes. One bad test or awkward moment will not define you, even if it feels huge right now. Most people are too busy worrying about themselves to judge you as harshly as you think.\u003c/p\u003e\u003cp\u003eChoose friends who make you feel calm, not anxious. If you constantly feel like you’re “too much” or “not enough” around someone, listen to that. Longevity in friendships comes from mutual respect, not proximity or history.\u003c/p\u003e\u003cp\u003eStart doing small hard things consistently—studying a little each day, moving your body, sleeping enough. Discipline will take you further than motivation ever will.\u003c/p\u003e\u003cp\u003eAnd finally: you are allowed to change. Outgrowing people, goals, and versions of yourself isn’t betrayal—it’s growth. Be kinder to yourself while you’re becoming who you are.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"d853d128-1c6f-497e-8cf6-a1be660a064a\"}":{"__typename":"School","uuid":"d853d128-1c6f-497e-8cf6-a1be660a064a","name":"Townsend Harris High School","city":"Flushing","type":"HIGH","state":"New York","country":"United States","zip":"11367"},"Education:{\"uuid\":\"ee12912a-505c-4eb7-9f15-ddce9294d6a1\"}":{"__typename":"Education","uuid":"ee12912a-505c-4eb7-9f15-ddce9294d6a1","school":{"__ref":"School:{\"uuid\":\"d853d128-1c6f-497e-8cf6-a1be660a064a\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"2800b440-0e6f-495b-b58d-1e0b699e6025\"}":{"__typename":"Education","uuid":"2800b440-0e6f-495b-b58d-1e0b699e6025","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Molecular, Cellular, Developmental Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"d4da4bc5-480e-4826-b2cc-ddb13d7f2a4c\"}":{"__typename":"MentorPublicProfile","uuid":"d4da4bc5-480e-4826-b2cc-ddb13d7f2a4c","displayName":"Kate E.","slug":"kate-estevez-1","biography":"\u003cp\u003eHi! My name is Kate, and I’m a Molecular, Cellular, and Developmental Biology major at Yale University on the pre-med track. I’m hoping to become a pediatric allergist one day because I care a lot about children’s health and helping families better understand how the immune system works. I’ve always been interested in science, especially how tiny things like cells and molecules can have such a big impact on the human body.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, I spend most of my time balancing classes, research, and campus jobs. Academically, I focus on biology, chemistry, and immunology, and I’ve had the opportunity to work as a research assistant for two summers. Right now, I’m involved in an immunology project where we study how fetal T cells respond to antigens from maternal vaccines. This involves working with cell cultures, flow cytometry, and analyzing real lab data, which has been an exciting way to see how what I learn in class applies to real-world medicine.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, I stay involved in a few different ways. I’ve worked as a Bulldog Caller, where I talk to Yale alumni, build connections, and help support university programs. I also enjoy mentoring and tutoring, especially working with ESL students from Ukraine who are learning English. Helping them improve their reading and writing skills has been really rewarding, and it’s taught me a lot about patience, communication, and adapting to different learning styles.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love being creative and staying active. Photography is one of my favorite hobbies, and I enjoy capturing campus life, events, and special moments. When I’m not studying or working, you can usually find me going on walks, trying new workouts, exploring coffee spots, or spending time with friends.  \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome of my favorite experiences at Yale have been meeting people from all different backgrounds, working on meaningful projects, and growing both academically and personally. I’m excited to be part of Curious Cardinals because I love sharing what I’ve learned, supporting younger students, and helping make learning fun and less intimidating. Whether it’s science, college life, or just staying motivated, I’m always happy to help and connect!\u003c/p\u003e","teachingVideoPlaybackId":"oDTdCWzdkfadyqcxLMfJEv1BbIUNwsEB2l02W01JgrwkQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8aa161ec-1173-43a1-a07b-39f16f5b0ec3\"}"}],"causesSupported":[],"major":"Molecular, Cellular, Developmental Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"09dafd4f-1a0b-44f2-ae66-ef949e400f9d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/be6eb3f0-6385-4faf-90c2-1d537f1534bc/-/preview/-/format/jpg/","https://ucarecdn.com/423b3d00-7783-4f57-8520-74c46051e5d3/-/preview/-/format/jpg/","https://ucarecdn.com/368875f3-9f30-4001-892c-e12a6a6116ae/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ee12912a-505c-4eb7-9f15-ddce9294d6a1\"}"},{"__ref":"Education:{\"uuid\":\"2800b440-0e6f-495b-b58d-1e0b699e6025\"}"}],"hiredAt":"2026-01-19T18:45:51.499Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","Sports Journalism","Video / Photography","Medicine / Health","STEM Project","Journalism"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kate-estevez-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d4da4bc5-480e-4826-b2cc-ddb13d7f2a4c\"}"}}},"_sentryTraceData":"2a52c7b47ce74147b6829fc074dbb492-ae5eed180600aebc-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb
