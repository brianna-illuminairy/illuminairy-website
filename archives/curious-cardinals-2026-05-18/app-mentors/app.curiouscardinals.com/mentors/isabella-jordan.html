xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6471ce55-35f4-49ff-8b72-580f0b3cc87b\"}":{"__typename":"Favorites","uuid":"6471ce55-35f4-49ff-8b72-580f0b3cc87b","photoUrl":"https://ucarecdn.com/e78fcf20-d032-4f13-81df-a1a090074ae9/","title":"Messi","type":"ATHLETE"},"Favorites:{\"uuid\":\"c2e54ba6-51d0-499a-a12e-fe79d9591120\"}":{"__typename":"Favorites","uuid":"c2e54ba6-51d0-499a-a12e-fe79d9591120","photoUrl":"https://ucarecdn.com/e78fcf20-d032-4f13-81df-a1a090074ae9/","title":"La La Land","type":"MOVIE"},"Favorites:{\"uuid\":\"798ef72f-7aac-4a2c-9094-da53a8989759\"}":{"__typename":"Favorites","uuid":"798ef72f-7aac-4a2c-9094-da53a8989759","photoUrl":"https://ucarecdn.com/e78fcf20-d032-4f13-81df-a1a090074ae9/","title":"Soccer","type":"SPORT"},"CausesSupported:{\"uuid\":\"e5bdf3cd-6a4c-4fb5-9557-4f9857fda5f4\"}":{"__typename":"CausesSupported","uuid":"e5bdf3cd-6a4c-4fb5-9557-4f9857fda5f4","name":"Camp Kesem","description":"\u003cp\u003eFree summer camp for kids whose parents have or have had cancer.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/386d0ca2-d72b-4710-ba49-530263982e63/"},"CausesSupported:{\"uuid\":\"5ec905d5-44f0-4bc3-8803-096e3961d19c\"}":{"__typename":"CausesSupported","uuid":"5ec905d5-44f0-4bc3-8803-096e3961d19c","name":"San Francisco City Impact","description":"","photoUrl":"https://ucarecdn.com/cd41dd29-181b-4b2f-af1b-b0a2fdc9185e/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f8cdc262-93f2-4fa7-a80c-5e1027ca1607\"}":{"__typename":"DeepDives","uuid":"f8cdc262-93f2-4fa7-a80c-5e1027ca1607","content":"\u003cp\u003eAs a woman of color, I have found that as a student, specifically in computer science, I have often had little to none leaders or role models that share my identity or background in my areas of academic interest. I hope that by being a mentor, I can't only show a student that there is someone with a shared identity that is doing what they want to do, but that they have a support system of someone who can motivate them while empathizing with their experiences.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"204128ef-0f49-4634-ad69-1af2d184dff1\"}":{"__typename":"DeepDives","uuid":"204128ef-0f49-4634-ad69-1af2d184dff1","content":"\u003cp\u003eMy greatest source of motivation is creating a safer and sustainable future. I think what draws me to technology as a career and concentration of study is the ability to impact others on a large scale. With a consistent interest in social justice, I want to be in the technology industry so I can help to creative a more innovative and advanced society, but one that is more safe and just.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"761c68fd-e23f-4e7b-8b95-54b652448d97\"}":{"__typename":"DeepDives","uuid":"761c68fd-e23f-4e7b-8b95-54b652448d97","content":"\u003cp\u003eI spent a month every summer in high school as a teaching assistant at a summer school in East Palo Alto. This is really where my love for working with kids and tutoring began because I felt so connected and rewarded when I saw the impact that I had on these kids. I really think one of the things I have valued most is being able to see those kids grow not just in the classroom, but as leaders, friends, artists, and people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"83ba494b-f133-4988-a144-31a9879ae448\"}":{"__typename":"DeepDives","uuid":"83ba494b-f133-4988-a144-31a9879ae448","content":"\u003cp\u003eOne of my previous students at CC interrupted our session to ask me advice on a friend problem. It honestly was such a heartfelt moment as I understand when you are young it can sometimes be difficult to talk to parents about social things you are going through. I was able to talk with this student to really listen to her and make her feel like she had someone to confide in. I would love to not only be a mentor/teacher, but a trusted adult in their life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"School:{\"uuid\":\"95382ea5-a697-4bd5-a482-710ba9431b33\"}":{"__typename":"School","uuid":"95382ea5-a697-4bd5-a482-710ba9431b33","name":"Sacred Heart Schools, Atherton","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"4c939795-2e35-40a8-8dc9-d34aa18d984a\"}":{"__typename":"Education","uuid":"4c939795-2e35-40a8-8dc9-d34aa18d984a","school":{"__ref":"School:{\"uuid\":\"95382ea5-a697-4bd5-a482-710ba9431b33\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"74c8609e-7806-4780-a532-eb8b0ddbaf2c\"}":{"__typename":"Education","uuid":"74c8609e-7806-4780-a532-eb8b0ddbaf2c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"37154c4b-c2ec-4e87-8479-e579c2a5e7d6\"}":{"__typename":"MentorPublicProfile","uuid":"37154c4b-c2ec-4e87-8479-e579c2a5e7d6","displayName":"Isabella J.","slug":"isabella-jordan","biography":"\u003cp\u003eHello! My name is Isabella and I am a current masters student in Computer Science at Stanford. For my undergraduate concentration, I focused on Artificial Intelligence and as a Masters student I am concentrating on Computer Systems. I am very interested in artificial intelligence and its interaction with society which inspired me to undergo an Honors Thesis last year focusing on generative artificial intelligence and misinformation in the 2024 presidential election.\u003c/p\u003e\u003cp\u003eI came into Stanford anticipating going to law school so I am very interested in policy as well. I spent my first year and a half as a research assistant to Professor John Donohue on racial discrimination in death sentence penalties. I was also in the Ethics Honors Program  as I generally am interested in the intersection of law, ethics, and technology. My freshman year at Stanford I also co-founded a policy consulting group called Cardinal Policy Group that works to create policy briefings requested by different legislators, policy organizations or NGOs.\u003c/p\u003e\u003cp\u003eI've spent three summers at Google: two software engineering and one doing product management. I have enjoyed my time interning at Google immensely but also consider it a big part of the reason why I want to mentor in computer science because of the lack of diverse representation in industry. I also interned at a startup my freshman summer that was working to use machine learning to predict hospital acquired infections in hospital patients.\u003c/p\u003e\u003cp\u003eOutside of the classroom, I play a lot of soccer, having been the caption of a nationally ranked club team in high school. I also enjoy surfing and running, as well as dancing. I have spent many years working with kids from being a tutor to my previous English teachers kids in math to spending the last year tutoring kids in computer science to spending three summers as a teaching assistant for a summer school program to underprivileged kids in my community. I love connecting with those younger than me and considering the role that mentorship has played in my life, would love to be able to be a mentor to another girl or boy who shares any interests as me.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhen I was little, my grandfather had Parkinson's disease. Because of his illness, it was physically almost impossible for my grandfather to smile let alone laugh. One year during Christmas when I was quite young, my sister and I started goofily break dancing and performing skits for my family. My grandfather started to laugh and at the time as a young kid I thought nothing of it, but would later come to find out this was the first time my grandfather had laughed in several years. It would also be the last time he laughed before he passed away. While a small feat in retrospect, being able to give him that joy has been one of the things I am most proud of to this day.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"6471ce55-35f4-49ff-8b72-580f0b3cc87b\"}"},{"__ref":"Favorites:{\"uuid\":\"c2e54ba6-51d0-499a-a12e-fe79d9591120\"}"},{"__ref":"Favorites:{\"uuid\":\"798ef72f-7aac-4a2c-9094-da53a8989759\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"e5bdf
