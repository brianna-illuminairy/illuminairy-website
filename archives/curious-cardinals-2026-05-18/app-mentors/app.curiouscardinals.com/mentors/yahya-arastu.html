xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e8a4a7fd-a374-45ee-a653-b059b725fb1d\"}":{"__typename":"Favorites","uuid":"e8a4a7fd-a374-45ee-a653-b059b725fb1d","photoUrl":"https://ucarecdn.com/1ef3725f-4e76-4e3c-a9f8-1378e6d2884d/","title":"Lord of the Rings ","type":"BOOK"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"759ea02c-033b-47a7-9d76-99126e41dc6b\"}":{"__typename":"DeepDives","uuid":"759ea02c-033b-47a7-9d76-99126e41dc6b","content":"\u003cp\u003e\u003cstrong\u003eRunning a Marathon\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI want to complete a marathon as both a physical and mental challenge. The real test isn't the 26.2 miles but pushing past the moment when my mind screams \"quit.\" Training means learning to sit with discomfort and keep moving when everything hurts. It's about discovering what happens beyond my perceived limits and proving that mental barriers are often just suggestions. Crossing that finish line would represent mastering my own mind and finding strength I didn't know existed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eContributing to International Economic Development\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI want to help communities build sustainable economic foundations using data analysis and research skills. My goal is identifying what actually works rather than imposing outside solutions. I'm drawn to projects in microfinance, technology transfer, or policy work that amplify existing community strengths. Success means creating systems that generate lasting prosperity, where economic growth translates into real improvements in education, healthcare, and opportunity long after any intervention ends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"20c7f2a6-eec8-4f60-beb6-0213f9b433d1\"}":{"__typename":"DeepDives","uuid":"20c7f2a6-eec8-4f60-beb6-0213f9b433d1","content":"\u003cp\u003eI was definitely the classic nerdy kid in middle school - deeply into Science Olympiad and mathletes, probably spending way too much time thinking about competition problems. When high school came around, I made a conscious effort to become more well-rounded. I joined cross country, which was perfect for me since I could be part of a team without having to be super outgoing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was still pretty quiet, but I opened up once I got comfortable with people. I was always reading - constantly had a book with me. Not getting a phone until junior year meant I had to find other ways to keep myself occupied, which probably pushed me toward books even more.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was definitely a bit of a teacher's pet, but mainly just in my history classes. There was something about those discussions and the way history connected that really clicked with me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"883c3aa2-af0d-42a8-9507-4552e2c9e2b2\"}":{"__typename":"DeepDives","uuid":"883c3aa2-af0d-42a8-9507-4552e2c9e2b2","content":"\u003cp\u003eOut of all the things I could be doing with my time and energy, I choose mentorship because it creates something that outlasts me - and honestly, that matters to me. When I mentor someone, I'm not just helping one person figure things out; I'm investing in a system where my knowledge, the lessons I've learned through my mistakes and successes, get passed forward through generations of people I may never even meet.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere's this beautiful Islamic teaching that really captures why this feels so important to me: \u003cem\u003e\"When a person dies, his deeds come to an end except for three: Sadaqah Jariyah (a continuous charity), knowledge which is beneficial, or a virtuous descendant who prays for him.\"\u003c/em\u003e When I mentor someone, I'm essentially creating Sadaqah Jariyah through knowledge - a continuous charity that keeps giving value to the world long after I'm gone. That's powerful to me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut here's what I find equally valuable for myself: mentoring forces me to really understand what I know. When my mentee asks me why I approach a problem a certain way, or challenges something I've always taken for granted, I have to dig deeper into my own thinking. I end up discovering gaps in my knowledge I didn't even realize existed, making new connections, and honestly learning as much as I'm teaching sometimes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo I get this incredible double benefit - I'm building a legacy of knowledge that will ripple through countless lives I'll never know about, while simultaneously sharpening my own understanding and staying curious. My mentee's fresh perspective keeps me growing, and my guidance gives them a foundation to eventually mentor others. It's this beautiful cycle where giving knowledge actually multiplies both the knowledge itself and my own grasp of it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe knowledge I share doesn't just transfer - it evolves, compounds, and continues benefiting people for years to come. That feels like one of the most meaningful things I can do with my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a467bee2-4ff9-4724-8790-f2189f72aaef\"}":{"__typename":"DeepDives","uuid":"a467bee2-4ff9-4724-8790-f2189f72aaef","content":"\u003cp\u003eMy dream job would definitely be park ranger! I'd love spending my days managing wildlife - maybe tracking bear movements, monitoring bird migrations, or figuring out why the raccoons have formed what appears to be an organized crime syndicate around the garbage bins.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLeading hiking groups would be incredible too. I'd get to share all those amazing \"fun facts\" about local ecosystems while secretly judging people's hiking boot choices. Plus I'd develop that perfect ranger ability to spot the one person in the group who's definitely going to wander off the trail despite multiple warnings.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'd also get to be that person who knows all the secret spots - the best viewpoints, where to see the most wildlife, which trails are perfect for different skill levels. And honestly, getting paid to basically live in some of the most beautiful places on earth while helping people connect with nature? That sounds pretty perfect to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"54b9bc88-4e85-446a-bfb6-b61120b1ccf0\"}":{"__typename":"School","uuid":"54b9bc88-4e85-446a-bfb6-b61120b1ccf0","name":"Elgin High School","city":"Elgin","type":"HIGH","state":"Illinois","country":"United States","zip":"60120"},"Education:{\"uuid\":\"18223bec-e0cc-458a-ad1d-125c7d8fb97a\"}":{"__typename":"Education","uuid":"18223bec-e0cc-458a-ad1d-125c7d8fb97a","school":{"__ref":"School:{\"uuid\":\"54b9bc88-4e85-446a-bfb6-b61120b1ccf0\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"1efc0612-4616-4311-b9a6-025d8db31daf\"}":{"__typename":"Education","uuid":"1efc0612-4616-4311-b9a6-025d8db31daf","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics \u0026 Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2ee29965-455d-413a-ad49-aaa27fcdb7df\"}":{"__typename":"MentorPublicProfile","uuid":"2ee29965-455d-413a-ad49-aaa27fcdb7df","displayName":"Yahya A.","slug":"yahya-arastu","biography":"\u003cbr\u003e\u003cp\u003eHi! I’m a senior at Northwestern University studying Economics and Political Science, with a minor in Transportation and Logistics. I’m interested in how large systems shape everyday life, from global political institutions to the design of a city’s transit network, and how understanding those systems helps people make better decisions about their futures.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic work centers on applying theory to real-world problems. I’ve spent years studying econometrics and political theory, and I’m comfortable breaking down complex ideas in a clear, intuitive way. Whether I’m explaining regression analysis or unpacking competing political frameworks, my goal is to help students move from confusion to confidence and use analytical tools with purpose.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI bring a global perspective shaped by experience. I spent a semester abroad in Durban, South Africa during the country’s G20 preparations, and I’ve traveled to more than twenty countries. Living abroad and navigating unfamiliar cities taught me how policy, infrastructure, and culture interact, and reinforced the value of learning beyond the classroom through direct experience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFamily plays a central role in how I approach mentorship. I’m second-generation Indian American and the only brother to five sisters. I’ve been closely involved in guiding my younger sisters through academic planning, extracurricular decisions, and the college admissions process. One of my sisters now attends Northwestern, and we are actively working to help the next three find strong, well-matched paths. Supporting them has given me firsthand insight into both student pressures and parent priorities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I serve in leadership roles as captain of Northwestern’s Ultimate Frisbee team and as a trip leader for the Outdoors Club, organizing everything from weekend kayaking trips to multi-day backpacking routes. These roles have taught me how to balance high expectations with empathy, structure with flexibility, and independence with support.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside academics, I value experiential learning and balance. I enjoy long-distance travel, outdoor leadership, cooking, and time at my grandparents’ farm, where I’m currently raising chickens. These experiences ground my approach to mentorship in curiosity, adaptability, and perspective.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduation, I plan to pursue a career in economic consulting, with the long-term goal of attending law school. I take mentorship seriously and aim to help students not only position themselves competitively for top colleges, but also develop the clarity, confidence, and skills they need to succeed once they arrive.\u003c/p\u003e","teachingVideoPlaybackId":"efX0000xkkW01mE8zmVnENLEYhJShPfJirl1jRPv00cqahM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e8a4a7fd-a374-45ee-a653-b059b725fb1d\"}"}],"causesSupported":[],"major":"Economics \u0026 Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"759ea02c-033b-47a7-9d76-99126e41dc6b\"}"},{"__ref":"DeepDives:{\"uuid\":\"20c7f2a6-eec8-4f60-beb6-0213f9b433d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"883c3aa2-af0d-42a8-9507-4552e2c9e2b2\"}"},{"__ref":"DeepDives:{\"uuid\":\"a467bee2-4ff9-4724-8790-f2189f72aaef\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/433cc3af-dd05-462b-bd88-d235e229b66f/-/preview/-/format/jpg/","https://ucarecdn.com/91242d09-3bc4-4b28-b567-31f011e23176/-/preview/-/format/jpg/","https://ucarecdn.com/01f4e398-e9b7-48b4-b702-1eb8c07b2eb4/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"18223bec-e0cc-458a-ad1d-125c7d8fb97a\"}"},{"__ref":"Education:{\"uuid\":\"1efc0612-4616-4311-b9a6-025d8db31daf\"}"}],"hiredAt":"2025-08-12T02:03:10.089Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Chemistry","Physics","Writing","Spanish","Academic Coaching","College Essay Writing","Computer Science","Economics","Executive Function","History","Reading","Creative Writing","Fashion / Cosmetics","Film / Theater","History Project","K-6 Storybook","Sports Journalism","Video / Photography","Visual Arts / Graphic Design","Business / Entrepreneurship","Finance / Investing","Aviation / Aerospace","Game Design","Medicine / Health","Robotics / Electronics / CAD","Sports Analytics","STEM Project","Web Design","Debate","Journalism","Law / Government / Policy","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisi
