xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"65ff8144-f67c-415f-83fd-33cda592d51d\"}":{"__typename":"Favorites","uuid":"65ff8144-f67c-415f-83fd-33cda592d51d","photoUrl":"https://ucarecdn.com/ef5577b1-b562-459b-8044-67e4fce338f1/","title":"When Harry Met Sally","type":"MOVIE"},"Favorites:{\"uuid\":\"9eca3193-8571-4b9f-b871-aae51125b795\"}":{"__typename":"Favorites","uuid":"9eca3193-8571-4b9f-b871-aae51125b795","photoUrl":"https://ucarecdn.com/d5d2b209-60b7-47cc-b320-4d2a5cb0cd17/","title":"Tchaikovsky: The Nutracker, Op. 71, Act 2: No. 14a, Pas de deux","type":"SONG"},"Favorites:{\"uuid\":\"e779c61f-c3ec-4289-a6ce-46a7dd0de58e\"}":{"__typename":"Favorites","uuid":"e779c61f-c3ec-4289-a6ce-46a7dd0de58e","photoUrl":"https://ucarecdn.com/7fd5f8e0-2f2c-445c-9db4-8fa5afb236a1/","title":"Anne Hathaway","type":"ACTOR"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"aa81adb2-4c21-4249-aab0-89a561b9e02d\"}":{"__typename":"DeepDives","uuid":"aa81adb2-4c21-4249-aab0-89a561b9e02d","content":"\u003cp\u003eAs someone from a mixed-race background, I am the first to know that appearances aren't everything. I'm excited to learn what makes your student tick, and how we can work together to give them the best experience possible. In my roles as a Oral Communication Tutor and a Student Tour Guide, I've developed my skills in crafting individualized lesson plans and tours that can maximize learning outcomes. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4f62aafd-4d58-482c-afde-61bc5bdeee0d\"}":{"__typename":"DeepDives","uuid":"4f62aafd-4d58-482c-afde-61bc5bdeee0d","content":"\u003cp\u003eI'm an Art History major because of an unorthodox, wacky, and amazing high school teacher. Imagine taking notes however you wanted (painting, drawing, or writing), exams only being 10% of your grade, and playing Jeopardy as a study tool. It was the first time in my life that I felt as if I was learning for the pure love of it. By cultivating that genuine excitement around an intellectual pursuit, it allowed me to see myself waking up every day being excited to go to school. I came to college, and I never looked back. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"85bbc9c7-0ef5-4a37-aa52-3adce6136462\"}":{"__typename":"DeepDives","uuid":"85bbc9c7-0ef5-4a37-aa52-3adce6136462","content":"\u003cp\u003eSwimming the islands of Croatia with my mom has been on my bucket list for years. I am part Croatian, and I grew up right next to the beach, so I've always loved the water. Getting to experience part of my heritage while also challenging the limits of my physicality sounds like the perfect combination!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"df60eb2c-b28e-46f8-b8d7-4003e36a6070\"}":{"__typename":"DeepDives","uuid":"df60eb2c-b28e-46f8-b8d7-4003e36a6070","content":"\u003cp\u003eYou often don't realize the importance of mentors until later on. I stopped dancing for two years after I graduated high school because of the pandemic, and I auditioned for Stanford's ballet company on a whim. After returning to dance and realizing the joy it brought me, I reached out to a former mentor I had lost contact with. I emailed her to express gratitude for the years of training, the lessons I had learned, and for the belief she had in me at a time when I didn't have any in myself. Mentors are there to fall back on when you are learning to take risks and try new things. Even though some moments seemed small at the time, I'll never forget the impact her mentorship had on me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"a898bb92-2553-487b-bac2-5bbf69f4debc\"}":{"__typename":"School","uuid":"a898bb92-2553-487b-bac2-5bbf69f4debc","name":"Orange County School of the Arts","city":"Santa Ana","type":"HIGH","state":"California","country":"United States","zip":"92701"},"Education:{\"uuid\":\"70d1919f-92de-4035-bc91-cfbcdee30c0a\"}":{"__typename":"Education","uuid":"70d1919f-92de-4035-bc91-cfbcdee30c0a","school":{"__ref":"School:{\"uuid\":\"a898bb92-2553-487b-bac2-5bbf69f4debc\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"79883342-12a9-444a-b635-f42f95555df4\"}":{"__typename":"Education","uuid":"79883342-12a9-444a-b635-f42f95555df4","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Art History/Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"5e5edf8f-5097-43cb-a81c-40054727700f\"}":{"__typename":"MentorPublicProfile","uuid":"5e5edf8f-5097-43cb-a81c-40054727700f","displayName":"Sydney K.","slug":"sydney-marie","biography":"\u003cp\u003eHi! I'm Sydney, and I'm a current senior at Stanford with a passion for the arts, digital storytelling, and taking big ideas and turning them into reality. I grew up training in classical ballet and modern dance, and I attended the Orange County School of the Arts in the Classical and Contemporary Dance Program. My rigorous high school experience helped me develop time management skills that have helped me succeed in college and balance all the craziness life has to offer. In high school, I also taught dance to kids ages 5-13, worked with March For Our Lives, and led the high school voter registration effort during the 2020 election.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my time at Stanford, I like to say I'm the poster child for taking advantage of every opportunity possible. Although I am the biggest advocate of the Art History department (I'm literally the undergraduate Peer Advisor), this hasn't stopped me from pursuing research opportunities in Political Science, Religious Studies, and American History. For three years, I have worked as a Student Tour Guide at the Cantor Arts Center, where I lead tours for all ages and backgrounds. I use to dread museum visits as a kid, and now I spend the majority of my time trying to make sure that kids are excited to come back! I also work as a Oral Communication Tutor at our writing and speaking center, where I work with students on research presentations, mock interviews, and speech anxiety. I love this role because although the sessions are only 45 minutes, I can always see a major change in a student's confidence from when they come in versus when they leave. Outside of work, I'm part of the University's Public Art Committee, a 2-year member of the executive board of a woman's organization, and an executive board member of the Cardinal Ballet Company, where I perform in our annual Nutcracker and spring show.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis year, I also hosted a month-long recipe competition in our dining halls to encourage students to come up with creative, plant-based dishes. Working with Stanford chefs, dining staff, and academic advisors, we hosted a week of specials in the dining halls where students could vote on their favorite dishes. Over 1350 plant-based specials were served to students to show how eating sustainably can be extremely delicious too!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eYou can normally find me on a hike, scouring the produce at a farmer's market, grabbing a coffee at Philz, reading a Jane Austen novel, or trying to undo a knot in my embroidery thread (seriously this takes up a lot of my time). I'm excited to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"PVHMvPlCQEay004GQUsVTvUETlJmKHjj00ndSTinpJUWQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my proudest achievements over the past year was hosting a corsage-making workshop at the Stanford Farm to celebrate Asian-American heritage at Stanford. After 6 months of research, I collaborated with 3 Asian community groups in the Bay Area, planned a community engagement event, and hosted 70+ guests for presentations, a student band performance, and corsage-making for Big Game. It even got me a write-up in the Stanford Report!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"65ff8144-f67c-415f-83fd-33cda592d51d\"}"},{"__ref":"Favorites:{\"uuid\":\"9eca3193-8571-4b9f-b871-aae51125b795\"}"},{"__ref":"Favorites:{\"uuid\":\"e779c61f-c3ec-4289-a6ce-46a7dd0de58e\"}"}],"causesSupported":[],"major":"Art History/Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"aa81adb2-4c21-4249-aab0-89a561b9e02d\"}"},{"__ref":"DeepDives:{\"uuid\":\"4f62aafd-4
