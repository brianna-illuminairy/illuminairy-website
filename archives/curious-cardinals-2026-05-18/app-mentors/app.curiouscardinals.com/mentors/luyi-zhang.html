xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"37942c25-d0de-42ce-aced-b54f79cb921e\"}":{"__typename":"DeepDives","uuid":"37942c25-d0de-42ce-aced-b54f79cb921e","content":"\u003cp\u003eI would tell myself not to be afraid of getting my hands dirty. It’s easy to follow what everyone else is doing without truly understanding what you’re signing up for — but the best way to figure out what you love is to try things early, even if they feel small. Explore different fields, build something, get firsthand experience. That early curiosity will give you clarity and confidence when it comes to choosing your path later on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"952eb818-ee4e-4552-ab9e-fcbf25bccf70\"}":{"__typename":"DeepDives","uuid":"952eb818-ee4e-4552-ab9e-fcbf25bccf70","content":"\u003cp\u003eI wish I had the kind of guidance I now understand is so important. Back then, I focused heavily on academics but didn’t spend enough time figuring out what I truly enjoyed or how different careers actually looked in real life. Because I had to navigate those uncertainties on my own, I want to help students who might be in the same place — unsure of their next step — find direction earlier. Mentorship is about more than teaching skills; it’s about helping someone discover what excites them and showing them how to pursue it with confidence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ef1a35f5-dcfe-4e8a-b63d-12908b6a946c\"}":{"__typename":"DeepDives","uuid":"ef1a35f5-dcfe-4e8a-b63d-12908b6a946c","content":"\u003cp\u003eI pivoted from finance to computer science because I realized I wanted to be closer to the heart of how change happens. During my time in investment banking, I saw firsthand how technology was transforming industries — like a company using satellite data to assess farmland and improve loan access for farmers. Experiences like that showed me that finance is a powerful tool, but technology is often the driver behind real impact. I wanted to understand how those technologies actually work and be part of building them myself — that’s why I chose computer science.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d811ee8e-d727-48f4-b21b-46888a1f9380\"}":{"__typename":"DeepDives","uuid":"d811ee8e-d727-48f4-b21b-46888a1f9380","content":"\u003cp\u003eI’m deeply interested in the potential of AI to transform traditional industries — many of which haven’t yet tapped into its full power. My long-term goal is to help bridge that gap: to lead efforts that bring AI into real-world applications, unlocking opportunities and efficiency in fields far beyond tech itself. I believe the true impact of AI will come not just from building advanced models, but from integrating them into industries where they can make the biggest difference.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"c22b5cff-35cf-46e3-b44b-9c52ad8cac91\"}":{"__typename":"School","uuid":"c22b5cff-35cf-46e3-b44b-9c52ad8cac91","name":"Saratoga High School","city":"Saratoga","type":"HIGH","state":"California","country":"United States","zip":"95070"},"Education:{\"uuid\":\"4a810764-0cf9-416a-9f9a-36f2de467e02\"}":{"__typename":"Education","uuid":"4a810764-0cf9-416a-9f9a-36f2de467e02","school":{"__ref":"School:{\"uuid\":\"c22b5cff-35cf-46e3-b44b-9c52ad8cac91\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"ad182b49-8cdb-4fd9-908e-b03bb399e85f\"}":{"__typename":"Education","uuid":"ad182b49-8cdb-4fd9-908e-b03bb399e85f","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"4e113d04-5f4c-426c-a1d5-0b271f81346f\"}":{"__typename":"MentorPublicProfile","uuid":"4e113d04-5f4c-426c-a1d5-0b271f81346f","displayName":"Luyi Z.","slug":"luyi-zhang","biography":"\u003cp\u003eHi! I’m Luyi — I worked in investment banking for two years before pivoting into computer science, and I’m now pursuing my master’s degree in Computer Science at the University of Pennsylvania.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI graduated from \u003cstrong\u003eNYU Stern School of Business\u003c/strong\u003e and began my career as an \u003cstrong\u003einvestment banker \u003c/strong\u003eat \u003cstrong\u003eMorgan Stanley\u003c/strong\u003e, where I focused on the technology and financial services sectors. It was an exciting environment, but I found myself increasingly curious about the \u003cem\u003etechnology\u003c/em\u003e shaping the companies I advised. That curiosity grew into a passion — and I decided to completely change my path.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI started from zero, learning how to code and building projects from scratch. Since then, I’ve:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCompleted a \u003cstrong\u003eSoftware Engineering Internship at Bloomberg\u003c/strong\u003e, working on infrastructure and distributed tracing pipelines — and I’ll be returning to the company full-time next year.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilt and deployed a \u003cstrong\u003efull-stack web application\u003c/strong\u003e from the ground up, gaining hands-on experience with frontend, backend, and cloud platforms like AWS.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDesigned a \u003cstrong\u003ebackend microservices system\u003c/strong\u003e with technologies such as Redis, RabbitMQ, and Docker to explore how large-scale applications are built and scaled.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eGoing through that journey myself taught me what it’s like to feel uncertain about the future — and how to turn that uncertainty into actionable steps. I’m passionate about helping students do the same: explore different paths, discover what excites them, and learn how to bring ideas to life.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI love working with students who are curious about \u003cstrong\u003esoftware engineering, backend systems, and passion projects\u003c/strong\u003e — whether you’re completely new to coding or already exploring advanced topics. I can help you:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBuild a \u003cstrong\u003efull-stack web app from zero\u003c/strong\u003e, even with no prior experience, and understand how the entire tech ecosystem fits together — from frontend to backend to cloud.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExplore \u003cstrong\u003edifferent career paths\u003c/strong\u003e — whether in \u003cstrong\u003efinance\u003c/strong\u003e or \u003cstrong\u003etechnology\u003c/strong\u003e — and understand what those careers look like day-to-day, what skills matter, and how to prepare for them.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTurn your interests into meaningful \u003cstrong\u003epassion projects\u003c/strong\u003e, learning how technology is actually used to solve real-world problems.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStrengthen your \u003cstrong\u003etechnical foundations\u003c/strong\u003e — I can also tutor students in \u003cstrong\u003ecomputer science fundamentals\u003c/strong\u003e (like data structures, algorithms, and system design basics) and \u003cstrong\u003emath concepts\u003c/strong\u003e that are essential for CS.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eMy goal is to show you not just how to code, but how to think like a problem-solver — and how to connect your learning to the bigger picture of how industries evolve.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eBecause I’ve done the hard work of switching careers myself, I understand both the beginner’s perspective \u003cem\u003eand\u003c/em\u003e the real-world demands of the tech industry. My mentorship is focused on bridging that gap — helping students who may not know where to start gain confidence, clarity, and direction.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking down the entire \u003cstrong\u003etech landscape\u003c/strong\u003e — what all the terms mean, how the pieces fit together, and what a day in the industry looks like.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorming project ideas and mapping them into \u003cstrong\u003eactionable plans\u003c/strong\u003e you can complete over several weeks.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWalking through key concepts step by step — from frontend to backend — and understanding how everything connects.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSharing the \u003cstrong\u003eresources, tools, and strategies\u003c/strong\u003e I used to teach myself, so you can build independently and confidently.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAnswering all your questions — from technical challenges to career advice — and helping you navigate next steps.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eOutside of coding\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eOutside of tech, I love \u003cstrong\u003ejournaling\u003c/strong\u003e and \u003cstrong\u003eexploring new restaurants\u003c/strong\u003e. I’m also studying \u003cstrong\u003eJapanese\u003c/strong\u003e — I’m fascinated by the language and culture, and it’s been a rewarding challenge. I’m a very organized person and love experimenting with \u003cstrong\u003eproductivity tools\u003c/strong\u003e to make everyday life more efficient (it’s weirdly satisfying!). And when I’m not coding or reading, I’m usually hanging out with my very spoiled cat.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re curious about technology, exploring career paths, or simply want to learn how to build something from the ground up, I’d love to guide you on that journey — step by step.\u003c/p\u003e","teachingVideoPlaybackId":"qzx7cUNK1b01js7Hwmt9Th00x5oXUcah5sp00ZszKEYG0100","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"37942c25-d0de-42ce-aced-b54f79cb921e\"}"},{"__ref":"DeepDives:{\"uuid\":\"952eb818-ee4e-4552-ab9e-fcbf25bccf70\"}"},{"__ref":"DeepDives:{\"uuid\":\"ef1a35f5-dcfe-4e8a-b63d-12908b6a946c\"}"},{"__ref":"DeepDives:{\"uuid\":\"d811ee8e-d727-48f4-b21b-46888a1f9380\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ccb6a3c3-de87-4515-9bdc-420eba3545ca/-/preview/-/format/jpg/","https://ucarecdn.com/93e072f7-8663-4ea8-b256-e394235b3cb4/-/preview/-/format/jpg/","https://ucarecdn.com/c739e874-2e82-40cd-972f-b58b11292d44/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"4a810764-0cf9-416a-9f9a-36f2de467e02\"}"},{"__ref":"Education:{\"uuid\":\"ad182b49-8cdb-4fd9-908e-b03bb399e85f\"}"}],"hiredAt":"2025-09-30T02:41:49.725Z","topics":["Algebra I","Algebra II","Japanese","Mandarin Chinese","Computer Science","Academic Coaching","Finance / Investing","Coding / Programming"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"luyi-zhang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4e113d04-5f4c-426c-a1d5-0b271f81346f\"}"}}},"_sentryTraceData":"756bc88a7a074c01baa4ee034e9852e3-98a08b0bb7bacbf9-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=756bc88a7a074c01baa4ee034e9852e3,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":tru
