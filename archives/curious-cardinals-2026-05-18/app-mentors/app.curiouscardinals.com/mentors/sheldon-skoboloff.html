0-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8e137395-02a1-4327-80ce-b34a62bb0323\"}":{"__typename":"DeepDives","uuid":"8e137395-02a1-4327-80ce-b34a62bb0323","content":"\u003cp\u003eI would love to be a sketch writer for SNL\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"0c23209d-8237-4c97-bfa3-5f056ac8e29e\"}":{"__typename":"School","uuid":"0c23209d-8237-4c97-bfa3-5f056ac8e29e","name":"Coronado High School","city":"Henderson","type":"HIGH","state":"Nevada","country":"United States","zip":"89052"},"Education:{\"uuid\":\"81d2c92e-1be0-42d6-8a3b-dbfc5098831c\"}":{"__typename":"Education","uuid":"81d2c92e-1be0-42d6-8a3b-dbfc5098831c","school":{"__ref":"School:{\"uuid\":\"0c23209d-8237-4c97-bfa3-5f056ac8e29e\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"6855d246-de83-4959-a91a-29d8a0fcf0ae\"}":{"__typename":"Education","uuid":"6855d246-de83-4959-a91a-29d8a0fcf0ae","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Theater and Professional Writing","degree":null},"MentorPublicProfile:{\"uuid\":\"db1cc92e-8259-4906-bcaf-9052f3a323ba\"}":{"__typename":"MentorPublicProfile","uuid":"db1cc92e-8259-4906-bcaf-9052f3a323ba","displayName":"Sheldon S.","slug":"sheldon-skoboloff","biography":"\u003cp\u003e\u003cstrong\u003e\u003cem\u003eSheldon Skoboloff\u003c/em\u003e\u003c/strong\u003e (he/him) is a \u003cstrong\u003e\u003cem\u003ewriter, director, and sound designer, \u003c/em\u003e\u003c/strong\u003eknown far and wide as the inventor of the mocha (don’t look it up.) Born to a Latino Jewish family in Las Vegas, Nevada, he’s always been deeply interested in understanding and studying culture, spending countless hours falling down Wikipedia rabbit holes trying to figure out exactly what he is (we still don’t know.) His interest in education and teaching methods began when he re-taught\u003cstrong\u003e \u003c/strong\u003ehimself his first language, Spanish, at the age of 11 after being forced to speak only English in Texas elementary schools. He would later go on to learn Portuguese in college, and is currently teaching himself Hebrew. After noticing the lack of publicly available teaching resources, he became focused on the intersection of education and entertainment, inspired by TV shows like “The Good Place” and “Sesame Street.” He currently works at the\u003cstrong\u003e\u003cem\u003e Learning and Community Engagement Coordinator at Manhattan Theatre Club\u003c/em\u003e\u003c/strong\u003e, a producing theatre generating new works\u003cstrong\u003e on Broadway and Off-Broadway\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo investigate further, Sheldon left home and attended the \u003cstrong\u003e\u003cem\u003eUCLA School of Theater, Film, and Television\u003c/em\u003e\u003c/strong\u003e as an \u003cstrong\u003e\u003cem\u003eAlumni Scholar\u003c/em\u003e\u003c/strong\u003e in the \u003cstrong\u003e\u003cem\u003eIntegrated Studies\u003c/em\u003e\u003c/strong\u003e program. Recently, he wrote, co-directed, and produced his first full length play \u003cstrong\u003e\u003cem\u003e\u003cu\u003eYOU NEVER EXISTED\u003c/u\u003e\u003c/em\u003e\u003c/strong\u003e (Bay Area Playwrights Festival 47 Semifinalist) at the Kerckhoff Grand Salon with \u003cu\u003eOut of the Blue Theater Company and ASUCLA\u003c/u\u003e. Previous directing projects include scene work from a Zoom version of\u003cstrong\u003e \u003cem\u003eUNCLE VANYA\u003c/em\u003e\u003c/strong\u003e\u003cem\u003e \u003c/em\u003efocused on cyber sex crimes and the Nicky Silver play \u003cstrong\u003e\u003cem\u003eRAISED IN CAPTIVITY\u003c/em\u003e\u003c/strong\u003e\u003cem\u003e.\u003c/em\u003e While at UCLA Sheldon has also had the opportunity to sound design various productions, including an immersive murder-mystery take on \u003cstrong\u003e\u003cem\u003eOEDIPUS\u003c/em\u003e\u003c/strong\u003e (Anna Makauskas, Out of the Blue) and a queered \u003cstrong\u003e\u003cem\u003eTHE IMPORTANCE OF BEING EARNEST \u003c/em\u003e\u003c/strong\u003e(Hall McCurdy, Out of the Blue.) He assisted Winter Hagstrom in the sound design of \u003cstrong\u003e\u003cem\u003eTHE TIME OF YOUR LIFE\u003c/em\u003e\u003c/strong\u003e (Jennifer Chang, UCLA TFT.)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMore of Sheldon’s non theatrical writing can be found at\u003cu\u003e \u003c/u\u003e\u003cstrong\u003e\u003cem\u003e\u003cu\u003eBusiness Insider,\u003c/u\u003e\u003c/em\u003e\u003c/strong\u003e \u003cstrong\u003e\u003cem\u003e\u003cu\u003eHey Alma (College Writing Fellow)\u003c/u\u003e, \u003cu\u003eFAST AT UCLA\u003c/u\u003e, \u003c/em\u003e\u003c/strong\u003e\u003cem\u003eand\u003c/em\u003e\u003cstrong\u003e\u003cem\u003e The Listening Dolls.\u003c/em\u003e\u003c/strong\u003e A collection of his poems were featured in \u003cstrong\u003e\u003cem\u003e\u003cu\u003eBruins Belong: Diaspora and the Meaning of Home\u003c/u\u003e\u003c/em\u003e\u003c/strong\u003e, presented by the \u003cstrong\u003e\u003cem\u003eUCLA Library’s Department of International and Area Studies.\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt the end of his Senior year at UCLA, Sheldon participated in a six week \u003cstrong\u003e\u003cem\u003eDramatic Writing Workshop\u003c/em\u003e\u003c/strong\u003e at the \u003cstrong\u003e\u003cem\u003eGeffen Playhouse\u003c/em\u003e\u003c/strong\u003e, served as the \u003cstrong\u003eDramaturg\u003c/strong\u003e for \u003cstrong\u003e\u003cem\u003eBRIGHT STAR\u003c/em\u003e\u003c/strong\u003e (Anna Makauskas, Out of the Blue) and the Sound Designer for \u003cstrong\u003e\u003cem\u003eHEAD OVER HEELS \u003c/em\u003e\u003c/strong\u003e(Hall McCurdy, Act iii). Since graduating, Sheldon has served as the \u003cstrong\u003eSpecial Events Assistant\u003c/strong\u003e at \u003cstrong\u003e\u003cem\u003eLa Jolla Playhouse \u003c/em\u003e\u003c/strong\u003eand the \u003cstrong\u003ePaul A. Kaplan Marketing Trainee \u003c/strong\u003eat \u003cstrong\u003e\u003cem\u003eManhattan Theatre Club \u003c/em\u003e\u003c/strong\u003eduring a Tony Award winning season.\u003c/p\u003e","teachingVideoPlaybackId":"GMN698xX2l2TslmgKXra8XYiduBaZ2tlzO3o00diIvow","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Theater and Professional Writing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b126398a-efc1-44e5-8c47-d1e61eb1a368\"}"},{"__ref":"DeepDives:{\"uuid\":\"8f6f98bf-99fa-4cf2-a936-c0b0673ef8f9\"}"},{"__ref":"DeepDives:{\"uuid\":\"4276bad9-b470-4279-8237-ccdfac340ca2\"}"},{"__ref":"DeepDives:{\"uuid\":\"8e137395-02a1-4327-80ce-b34a62bb0323\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/61853b5a-62a5-4b3a-8a83-9aa03be8778a/-/preview/-/format/jpg/","https://ucarecdn.com/7d3d44bf-a6c9-4d4d-9380-a3e8bbce7e46/-/preview/-/format/jpg/","https://ucarecdn.com/abec7d70-3a13-4cca-aee9-08e5d9d599b3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"81d2c92e-1be0-42d6-8a3b-dbfc5098831c\"}"},{"__ref":"Education:{\"uuid\":\"6855d246-de83-4959-a91a-29d8a0fcf0ae\"}"}],"hiredAt":"2025-07-02T17:52:55.640Z","topics":["K-5 Grade Math","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","R
