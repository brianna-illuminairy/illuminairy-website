xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2fe110fe-055b-4b08-a3ee-5105d8ec9009\"}":{"__typename":"Favorites","uuid":"2fe110fe-055b-4b08-a3ee-5105d8ec9009","photoUrl":"https://ucarecdn.com/a7d937f7-8fac-4476-9a82-8091e74d4bc9/","title":"Boston","type":"CITY"},"Favorites:{\"uuid\":\"4519d7fd-a627-4415-90ad-042ded316496\"}":{"__typename":"Favorites","uuid":"4519d7fd-a627-4415-90ad-042ded316496","photoUrl":"https://ucarecdn.com/96523976-4940-495d-86a4-e89dbf9f5888/","title":"Boston Celtics","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"01ea4c2c-eefd-495b-a919-ed71d1140397\"}":{"__typename":"Favorites","uuid":"01ea4c2c-eefd-495b-a919-ed71d1140397","photoUrl":"https://ucarecdn.com/5dd6d0bc-fd80-42f5-9c2f-96648c38345d/","title":"Fortnite","type":"GAME"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"be16899e-4817-4d9b-b684-fbee60ef89a5\"}":{"__typename":"DeepDives","uuid":"be16899e-4817-4d9b-b684-fbee60ef89a5","content":"\u003cp\u003eIn my spare time, I enjoy watching sports, crocheting, and doing nail art. I like activities that let me relax while also being creative and detail-oriented. Crocheting and nail art especially allow me to work patiently through patterns and designs, which mirrors how I enjoy approaching problem-solving and learning!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"0d90b84c-d7b7-4ba8-b1f2-4e9233678f64\"}":{"__typename":"DeepDives","uuid":"0d90b84c-d7b7-4ba8-b1f2-4e9233678f64","content":"\u003cp\u003eI spent my summers in high school working at the same summer camp I once attended as a child. I started as a counselor-in-training and eventually became a camp counselor, taking on more responsibility each summer. Returning to a place that meant so much to me allowed me to give back, build strong connections with kids, and develop patience, leadership, and mentorship skills that continue to shape how I work with students today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"fb4bb185-d4e2-4953-9073-b1f9e9d36e6e\"}":{"__typename":"DeepDives","uuid":"fb4bb185-d4e2-4953-9073-b1f9e9d36e6e","content":"\u003cp\u003eAs a middle school student, I was fairly shy, but that period marked the beginning of me growing out of my shyness. I started exploring new activities to better understand my interests and build confidence. In high school, I leaned into that curiosity by trying a wide range of art classes and experimenting with new sports like rowing. Those experiences helped me become more confident, adaptable, and open to learning!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f48efe2d-bd18-43c7-96b2-2e535f677d1b\"}":{"__typename":"DeepDives","uuid":"f48efe2d-bd18-43c7-96b2-2e535f677d1b","content":"\u003cp\u003eI chose my major because mechanical engineering felt like the broadest field, which gave me space to explore different areas of engineering and discover what I enjoy most. I’ve always been drawn to hands-on, process-based work, and mechanical engineering allows me to design, build, test, and refine ideas step by step. That balance of creativity and problem-solving is what made it the right fit for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"9fe722f3-abc2-4130-90de-30ff1210eb8e\"}":{"__typename":"School","uuid":"9fe722f3-abc2-4130-90de-30ff1210eb8e","name":"Lincoln School","city":"Providence","type":"HIGH","state":"Rhode Island","country":"United States","zip":"02906"},"Education:{\"uuid\":\"b52f04d1-5595-407c-9b7b-6ffc9a885ab4\"}":{"__typename":"Education","uuid":"b52f04d1-5595-407c-9b7b-6ffc9a885ab4","school":{"__ref":"School:{\"uuid\":\"9fe722f3-abc2-4130-90de-30ff1210eb8e\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"854a9bd6-ffd3-400e-8804-4e1dd27a5652\"}":{"__typename":"Education","uuid":"854a9bd6-ffd3-400e-8804-4e1dd27a5652","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"5cd0e432-e438-4297-827c-831d3bf4b00a\"}":{"__typename":"MentorPublicProfile","uuid":"5cd0e432-e438-4297-827c-831d3bf4b00a","displayName":"Mary G.","slug":"mary-gueye","biography":"\u003cp\u003eHi! I’m Mary, a mechanical engineering student with a strong passion for academic mentorship and supporting students as they build confidence, curiosity, and independent thinking skills. I care deeply about helping students feel comfortable engaging with learning, especially those who may be shy, hesitant, or unsure of themselves at first.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStudying mechanical engineering has shaped the way I approach teaching and problem-solving. My coursework emphasizes breaking complex problems into clear, manageable steps, recognizing patterns, and explaining reasoning in structured and accessible ways. I enjoy helping students learn \u003cem\u003ehow\u003c/em\u003e to think through problems rather than relying on memorization or shortcuts, and I focus on building strategies they can confidently apply across subjects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I have experience working with children in mentorship and educational settings. I’ve worked as a summer camp counselor for multiple summers, supervising and supporting groups of 8-year-old campers while leading engaging educational and recreational activities. Through this role, I learned how to build trust, manage different personalities, and foster creativity, teamwork, and confidence in young learners. These experiences reinforced how powerful patience and encouragement can be, especially for students who need time to feel comfortable participating.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve also served as a youth tutor with Brown Refugee Youth Tutoring and Enrichment, where I provided personalized academic support in english language arts. I adapted my teaching approach to meet my student’s individual learning style, tracked progress over time, and worked to create supportive, welcoming learning environments. Additionally, I’ve volunteered in early childhood classrooms, engaging students through play-based learning, storytelling, and creative activities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCreativity is also an important part of my life outside academics. I enjoy crocheting as a way to relax and express creativity, and I love working on projects that require patience, planning, and attention to detail, many of the same skills I bring into mentorship. Recently, I created a bouquet blanket, crocheted a beanie for the cold winter months, and designed headbands, projects that remind me how rewarding it is to see something come together step by step. I often find that sharing creative interests helps students feel more comfortable opening up and connecting during sessions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I strive to meet students where they are, balance structure with flexibility, and celebrate effort just as much as outcomes. I value reflection and communication, helping students recognize their progress and feel proud of their growth. I’m excited to support students not only academically, but also in building confidence, resilience, and a genuine love for learning that extends far beyond any single subject or session.\u003c/p\u003e","teachingVideoPlaybackId":"ajlIKPkbqrFsHRj86Vjp8qwkxwYYv8GxEm3Duu3Nooc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2fe110fe-055b-4b08-a3ee-5105d8ec9009\"}"},{"__ref":"Favorites:{\"uuid\":\"4519d7fd-a627-4415-90ad-042ded316496\"}"},{"__ref":"Favorites:{\"uuid\":\"01ea4c2c-eefd-495b-a919-ed71d1140397\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"be16899e-4817-4d9b-b684-fbee60ef89a5\"}"},{"__ref":"DeepDives:{\"uuid\":\"0d90b84c-d7b7-4ba8-b1f2-4e9233678f64\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb4bb185-d4e2-4953-9073-b1f9e9d36e6e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f48efe2d-bd18-43c7-96b2-2e535f677d1b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/aa14b532-08e8-4cb8-b6b4-55652cb774a8/-/preview/-/format/jpg/","https://ucarecdn.com/63fbd0b2-9d6d-40da-9ae8-4aeaa20818b0/-/preview/-/format/jpg/","https://ucarecdn.com/750bb64d-ea7e-4e9c-841a-cf40c23dbb39/-/preview/-/format/jpg/"]
