xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ab2a2576-1200-4134-ab4b-a118ccf1ed7f\"}":{"__typename":"DeepDives","uuid":"ab2a2576-1200-4134-ab4b-a118ccf1ed7f","content":"\u003cp\u003eIf I could give one piece to my middle or high school aged self, it would be to always give full effort in everything you do! Don’t let opportunities go to waste! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eYou have no idea what great things might come days, months, or even years down the line. This was something my dad always harped on me growing up - being the hardest worker is entirely in your control, so do it! In my own experience, putting the work in and doing my best to make the most of all my opportunities has only served me and created even more opportunities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy junior and senior years of high school, I had AP Exams. My AP scores didn't affect my grades at all, so it could have been challenging to find the motivation to study for them, but I chose to put my all into preparing for the exams and I got great scores! These scores transferred to course credit at Northwestern, which I accumulated enough of to graduate a WHOLE YEAR early, which saved me a year of NCAA eligibility which I took at the University of Alabama, where I won an SEC Championship and played for a team that made it all the way to the Final Four! I also completed my MBA with a concentration in Finance, all the while enrolled with athletic scholarship. None of that happens if I don't prepare well for my AP exams - but I didn't know that when I was studying!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLong story short - whatever you find yourself doing, don’t just scrape by, go all in! You might be surprised what it leads to and you'll certainly see what you’re capable of!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"be381df7-2480-4eac-801d-a11d89631f79\"}":{"__typename":"DeepDives","uuid":"be381df7-2480-4eac-801d-a11d89631f79","content":"\u003cp\u003eAt Northwestern, I double majored in Mathematical Methods in the Social Sciences (MMSS) and Psychology. I chose MMSS because I loved math! It was a program that I was confident would give me a strong quantitative skillset to prepare me well for a number of careers that I was interested in (entrepreneurship, finance, data analysis). I chose Psychology because it fascinated me! I loved learning about how the human mind works, the psychological processes underlying decision making, cognitive abilities, and more. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs you think about what you want to study, I encourage you to choose something that will take you one step closer to what you think you want to do with the rest of your life - choose something that will set you up for success! Or, choose something that completely fascinates you. Bonus points if you find something that satisfies each of those. If not, no worries, you can just study both - I did!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"950fda6c-61de-487e-98d2-193978f34920\"}":{"__typename":"DeepDives","uuid":"950fda6c-61de-487e-98d2-193978f34920","content":null,"videoPlaybackId":"jYCIImnuqxkSCVeHoqir85ISDCFbgDTf1OEcuhdStv00","question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"1361f105-cbe4-4229-9d72-d4e6bd919a94\"}":{"__typename":"DeepDives","uuid":"1361f105-cbe4-4229-9d72-d4e6bd919a94","content":null,"videoPlaybackId":"GLuZdeN01KlNWFM3MuiUBOxtdG00tnhT1HCTgyoMneVC8","question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"2f319bcf-259e-4dfe-96be-2bb0ab0b948f\"}":{"__typename":"School","uuid":"2f319bcf-259e-4dfe-96be-2bb0ab0b948f","name":"Colorado Academy","city":"Denver","type":"HIGH","state":"Colorado","country":"United States","zip":"80235"},"Education:{\"uuid\":\"7b46384c-e011-4066-93f4-c6923b260a75\"}":{"__typename":"Education","uuid":"7b46384c-e011-4066-93f4-c6923b260a75","school":{"__ref":"School:{\"uuid\":\"2f319bcf-259e-4dfe-96be-2bb0ab0b948f\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"c683d8c5-ae88-485e-831a-8b184887354b\"}":{"__typename":"Education","uuid":"c683d8c5-ae88-485e-831a-8b184887354b","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2022","major":"Mathematical Methods in the Social Sciences \u0026 Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"5b6e393b-dad0-497a-a9d7-948c91dfb1ee\"}":{"__typename":"MentorPublicProfile","uuid":"5b6e393b-dad0-497a-a9d7-948c91dfb1ee","displayName":"Marianna A.","slug":"mari-annest","biography":"\u003cp\u003eMarianna (you can call her Mari!) is formerly a college student-athlete and currently a professional soccer player for SK Slavia Praha in Prague. She grew up in Arvada, Colorado, loving to play soccer and ski, learn math and history, bake goodies over the holidays with her sister, and grow in faith within her Christian family.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe attended Northwestern University, where she double-majored in Psychology and a unique major called the Mathematical Methods in the Social Sciences, designed to help students bridge quantitative and qualitative forms of thinking and analysis. Her time at Northwestern culminated in a thesis in which she studied the effects of cognitive self-regulation and emotion regulation on the quality of a person's social and romantic life! Mari completed her degree at Northwestern in three years and found herself with two additional years of NCAA eligibility (thank you COVID!). She transferred to The University of Alabama to play soccer for the Crimson Tide for two years, where she also earned her Master's degree in Business Administration with a concentration in Finance, interning at an investment bank in Denver, Colorado over the summers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMari absolutely loves learning and has taken a number of fascinating classes, including the History of World Globalization, the Neuroscience of Emotion, Philosophy of Religion, Crime \u0026amp; Punishment, Bioethics, Cognitive Psychology, and so many more! During her time in university, she was heavily involved with student ministries including Athletes in Action, Fellowship of Christian Athletes, and Reformed University Fellowship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to playing lots of soccer, Mari spends her time traveling (so far this year: New Zealand, Salzburg, Vienna, Munich, Florence, Barcelona, Prague,  Istanbul, and Zürich), reading (books about faith, non-fiction, and political news), and listening to podcasts and new music!\u003c/p\u003e","teachingVideoPlaybackId":"ac4VUWH6XcSy012vklncEfGoep901f00A01xUZluYXTBres","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mathematical Methods in the Social Sciences \u0026 Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ab2a2576-1200-4134-ab4b-a118ccf1ed7f\"}"},{"__ref":"DeepDives:{\"uuid\":\"be381df7-2480-4eac-801d-a11d89631f79\"}"},{"__ref":"DeepDives:{\"uuid\":\"950fda6c-61de-487e-98d2-193978f34920\"}"},{"__ref":"DeepDives:{\"uuid\":\"1361f105-cbe4-4229-9d72-d4e6bd919a94\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8ec078ef-c2ae-40f7-9242-67c5f6151ff0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7b46384c-e011-4066-93f4-c6923b260a75\"}"},{"__ref":"Education:{\"uuid\":\"c683d8c5-ae88-485e-831a-8b184887354b\"}"}],"hiredAt":"2024-10-18T15:58:11.857Z","topics":["Public Speaking","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Writing","Spanish","Algebra I","Algebra II","Economics","College Essay Writing","Business / Entrepreneurship","Sports Analytics","Physics","Reading","History","Academic Coaching"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mari-annest\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5b6e393b-dad0-497a-a9d7-948c91dfb1ee\"}"}}},"_sentryTraceData":"7a8b3120d4c54a23b148c4995d66f875-84cb3dec38cf51af-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,se
