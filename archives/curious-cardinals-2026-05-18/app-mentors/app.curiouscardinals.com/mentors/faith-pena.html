xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7a3f658c-8b09-42c3-8f2e-ec4fbfca29c0\"}":{"__typename":"Favorites","uuid":"7a3f658c-8b09-42c3-8f2e-ec4fbfca29c0","photoUrl":"https://ucarecdn.com/a84c8089-9d3b-4d7c-a55a-9dd87b2c482e/","title":"A Thousand Splendid Suns by Khaled Hosseini","type":"BOOK"},"Favorites:{\"uuid\":\"972e2b01-5e99-476a-9d57-63723cd04d48\"}":{"__typename":"Favorites","uuid":"972e2b01-5e99-476a-9d57-63723cd04d48","photoUrl":"https://ucarecdn.com/c1d40451-2bba-434c-a646-80cbf6f05358/","title":"Sales Lp by SALES","type":"ALBUM"},"Favorites:{\"uuid\":\"cfc83699-23dc-4695-85bf-88248b54712f\"}":{"__typename":"Favorites","uuid":"cfc83699-23dc-4695-85bf-88248b54712f","photoUrl":"https://ucarecdn.com/a4eba48a-96ce-49fd-bf3d-e8ecfedfe948/","title":"The Bacchae by Euripides","type":"PLAY"},"CausesSupported:{\"uuid\":\"f9862564-dbbf-402c-a0b0-fd3714f0f921\"}":{"__typename":"CausesSupported","uuid":"f9862564-dbbf-402c-a0b0-fd3714f0f921","name":"Closer to Free Ride","description":"\u003cp\u003eBike ride to fundraise and support cancer research at Yale's Cancer Center.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/58dbb77a-e63f-4afb-9935-680c4fb61775/"},"CausesSupported:{\"uuid\":\"88e5e280-fc72-4401-961a-4a75e462fcc7\"}":{"__typename":"CausesSupported","uuid":"88e5e280-fc72-4401-961a-4a75e462fcc7","name":"Integrated Refugee and Immigrant Services (IRIS)","description":"\u003cp\u003eIRIS offers long-term support to immigrants for successful integration.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/0afdfe35-55bf-42f7-9f65-74cf29b624a6/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8eccbdd6-dd69-40ed-bf81-a4c5e9e6952a\"}":{"__typename":"DeepDives","uuid":"8eccbdd6-dd69-40ed-bf81-a4c5e9e6952a","content":"\u003cp\u003eRecently, I have taken up various ways of being active such as cycling, hiking, indoor climbing/bouldering, and running. These have all been great ways to get some more time outside while the weather is nice during the Summer. On top of that, I love exploring around town, finding new coffee shops to try or local events to take part in, such as a group bike rides or local vendor pop-ups! When I am trying to wind down, I typically reach for a book, especially since there is less time to read for enjoyment during the school year. I just finished The Curious Incident of the Dog in the Night-Time by Mark Haddon, which I loved because it shed light on a perspective I was unfamiliar with in my personal life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1d678909-b5d9-45bf-aedf-3e0c3f409169\"}":{"__typename":"DeepDives","uuid":"1d678909-b5d9-45bf-aedf-3e0c3f409169","content":"\u003cp\u003eThe story of choosing my major is actually one that typically surprises people. Unlike some people who go into college with the plan to complete a STEM major, I was very opposed. I came into college planning to major in sociology or political science, which is a sharp turn from what I am doing now. I was hoping to go into medicine but still really learn about people and society through my major during my undergraduate education. I thought this would be the best way to help people, which was why I was most interested in pursuing a career in medicine. While medicine is a great choice for many, I did not want to give up the life and fulfillment that conducting scientific research gave me throughout high school. This is when I turned to the M.D. Ph.D. route, but even this was not fulfilling for me because I knew eventually most people decide to utilize just one of their degrees. Ultimately, I chose to pursue a Ph.D. because. it had the scientific rigor and dedication to research I was hoping for, and I could still help many many people, it would just feel more like behind the scenes work (which is okay with me). For my journey to a Ph.D., it makes the most sense to major in something closely related to the field I wish to earn a Ph.D. in becauseI will be best trained for it going into it. So, I decided to major in molecular biophysics and biochemistry because I knew I enjoyed working with viruses and using biochemical assays to conduct research.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ec5edbc0-f439-4d27-b836-59c61e8886a0\"}":{"__typename":"DeepDives","uuid":"ec5edbc0-f439-4d27-b836-59c61e8886a0","content":"\u003cp\u003eThe mentors I have had throughout my life have had a great impact on the way my life has ultimately been shaped. From my high school college counselor and mother who had to push me to apply to various programs and universities to my research mentor who I still text with questions, mentorship has been a huge part of my life. I honestly would not have been where I am today without them because I would not have known how to make the most of the opportunities available to me. Even now as I feel annoying asking my college advisor which classes I should take about a million times, I always have someone I feel comfortable turning to in a time of doubt and uncertainty. Mentorship allows me to really brainstorm about what is best for me to do with people I trust and who have my best interest in mind. Having had so many great mentors in my life, I am eager to share the knowledge I have learned in life and the wisdom I have gained from my mentors with others who could benefit from it. Navigating life, especially academics, is definitely a daunting experience, so having people to lean on takes away some of the burden. Overall, mentorship has helped me, and I hope to be a great mentor to others now and in the future as I continue to grow as a mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"77c242ab-1ef5-42b3-8533-429166a264a2\"}":{"__typename":"DeepDives","uuid":"77c242ab-1ef5-42b3-8533-429166a264a2","content":"\u003cp\u003eA random fascination of mine is airplanes and aircrafts in general. I am particularly partial to most of Boeing's aircrafts and enjoy learning about how they function and their history. A trip to Washington state would not be complete for me without a visit to the Museum of flight.  My fascination with aircrafts is definitely something most people do not know about me, but watching documentaries relating to aircrafts will usually interest me more than a typical drama or action movie. Although this is somewhat of a niche topic, I am always happy to discuss my excitement with aircrafts with others!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"f506bbe5-1448-4cc0-9813-d927b18da418\"}":{"__typename":"School","uuid":"f506bbe5-1448-4cc0-9813-d927b18da418","name":"YES Prep North Forest Secondary","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77050"},"Education:{\"uuid\":\"2b343844-f8b5-4c11-959c-6ff668764ba3\"}":{"__typename":"Education","uuid":"2b343844-f8b5-4c11-959c-6ff668764ba3","school":{"__ref":"School:{\"uuid\":\"f506bbe5-1448-4cc0-9813-d927b18da418\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"cb64d2e7-bfbd-4aa5-8700-36017f086f99\"}":{"__typename":"Education","uuid":"cb64d2e7-bfbd-4aa5-8700-36017f086f99","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Molecular Biophysics and Biochemistry","degree":"Bachelor of Science"},"MentorPublicProfile:{\"uuid\":\"6afdff04-f70d-4733-a31c-0dbb72579da2\"}":{"__typename":"MentorPublicProfile","uuid":"6afdff04-f70d-4733-a31c-0dbb72579da2","displayName":"Faith L.","slug":"faith-pena","biography":"\u003cp\u003eFaith is a junior at Yale University majoring in Molecular Biophysics and Biochemistry with a concentration in biophysics and structural biology. She is most passionate about the intersection of STEM and public service. Faith is originally from McAllen, Texas but moved to Houston when she was 10, where she has had opportunities to pursue various research projects. There she graduated as valedictorian at a public charter school in one of Houston’s underserved communities.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThroughout high school, Faith interned at Baylor College of Medicine to pursue research in various fields. Her first introduction to research was with a genetics lab that focused on a rare metabolic disorder called Lysinuric Protein Intolerance. Faith continued her passion for research by interning at a lab that focused on cardiac gene therapy using adeno-associated viral vectors. Here, she discovered her love for biophysics and biochemistry! Faith also worked with a National Institutes of Health funded bioinformatics lab where she learned computer programming and statistics skills to implement in her secondary research project. With her vast background in research, she has officially decided to pursue a Ph.D. in structural biology focusing on biophysics techniques and viruses. To prepare for that endeavor, she is currently conducting research in a structural biology lab at Yale that focuses on researching the host’s immune responses to viral infections, especially for HIV-1.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhen Faith is not in class, she enjoys listening to music (all genres), practicing her culture through dance, reading, and taking walks around campus. Faith is the co-head of the Zine department of Yale’s on campus radio club! Here she creates a space for students to submit multi-media art such as writing, photography, drawings, etc., which will later be published and distributed around campus. Some of her favorite books are A Thousand Splendid Suns by Khaled Hosseini and Misery by Stephen King. She enjoys thought provoking films as well as any kind of documentary. Her friends would describe her as easy-going, friendly, funny, and well-rounded.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eTo stimulate her love for STEM outside of the classroom, Faith volunteers at a New Haven public school where she provides scientific demonstrations in hopes of igniting students’ passion for STEM. Additionally, Faith uses her native Spanish skills to interpret at HAVEN Free Clinic in New Haven. Faith also practices communicating STEM topics by writing for Yale’s Scientific Magazine. Ultimately, Faith hopes to utilize her Ph.D. education to enter a career in academia or at a federal agency to use her scientific knowledge for the public’s benefit.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eFaith’s mission as a mentor is to equip students academically and create an environment where their passions can be pursued. Before starting at Curious Cardinals, Faith has tutored Colombian students in the English language and prepared incoming Yale freshmen for the rigor of Yale’s quantitative reasoning courses through Yale’s ONEXYS program. Faith is very excited to spread her passion for STEM and experience in research, but she is also extremely happy to share her native language, Spanish, as well as her skills in nonfiction writing.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"n00vzV01012800VAoret9D7ZITkMlb02zbHbAe8Hk6CT011zU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7a3f658c-8b09-42c3-8f2e-ec4fbfca29c0\"}"},{"__ref":"Favorites:{\"uuid\":\"972e2b01-5e99-476a-9d57-63723cd04d48\"}"},{"__ref":"Favorites:{\"uuid\":\"cfc83699-23dc-4695-85bf-88248b54712f\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"f9862564-dbbf-402c-a0b0-fd3714f0f921\"}"},{"__ref":"CausesSupported:{\"uuid\":\"88e5e280-fc72-4401-961a-4a75e462fcc7\"}"}],"major":"Molecular Biophysics and Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8eccbdd6-dd69-40ed-bf81-a4c5e9e6952a\"}"},{"__ref":"DeepDives:{\"uuid\":\"1d678909-b5d9-45bf-aedf-3e0c3f409169\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec5edbc0-f439-4d27-b836-59c61e8886a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"77c242ab-1ef5-42b3-8533-429166a264a2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dccd2d24-4742-4d49-86a2-cfb9ffcae15f/-/crop/739x739/24,0/-/preview/-/format/jpg/","https://ucarecdn.com/1e770c1e-6372-4bef-b6cb-d67dd44ada97/-/preview/-/format/jpg/","https://ucarecdn.com/21816530-2349-46c2-86e5-a58027cbb0f7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:
