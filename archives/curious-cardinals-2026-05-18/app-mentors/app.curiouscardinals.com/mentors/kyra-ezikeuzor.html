e-technology field!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"83949179-4b1e-4103-86c4-a4c369ce5966\"}":{"__typename":"DeepDives","uuid":"83949179-4b1e-4103-86c4-a4c369ce5966","content":"\u003cp\u003eI would tell my high school self to yes, be focused, but also chill out. I was soo stressed out about college apps during high school that I wish I spent less time studying and more time hanging out with friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8e4cb98a-c84a-4f67-a57b-e997400d87cf\"}":{"__typename":"DeepDives","uuid":"8e4cb98a-c84a-4f67-a57b-e997400d87cf","content":"\u003cp\u003eSince June 2024, I've been working on a small nonprofit called Omelora, a word that means changemaker. We're about 200+ team members and volunteers helping young people in underfunded schools access education. So far, we've donated/are donating hundreds of books \u0026amp; resources to schools in Nigeria, Indonesia, \u0026amp; Uganda.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"e300595a-0ef6-48c9-b447-8dd6bd238b16\"}":{"__typename":"School","uuid":"e300595a-0ef6-48c9-b447-8dd6bd238b16","name":"St. Agnes Academy","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77036"},"Education:{\"uuid\":\"b46a3bc5-f46d-421d-a8ea-25136af6f1c3\"}":{"__typename":"Education","uuid":"b46a3bc5-f46d-421d-a8ea-25136af6f1c3","school":{"__ref":"School:{\"uuid\":\"e300595a-0ef6-48c9-b447-8dd6bd238b16\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"317e5085-8fa5-4a0b-b472-d67364edf053\"}":{"__typename":"Education","uuid":"317e5085-8fa5-4a0b-b472-d67364edf053","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Computer Science \u0026 Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"24660c0e-04a5-4000-8034-9cd8cd927b42\"}":{"__typename":"MentorPublicProfile","uuid":"24660c0e-04a5-4000-8034-9cd8cd927b42","displayName":"Kyra E.","slug":"kyra-ezikeuzor","biography":"\u003cp\u003eI am a first-year undergraduate at Columbia University studying Computer Science and Biology. I care about using technology to make education, healthcare, and opportunity more accessible, especially for young people and under-resourced communities. I am most motivated by work that feels practical and human, where code is not just impressive on paper but genuinely useful in people's lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHere's what I mentor in:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBuilding websites and web apps\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHTML, CSS, and JavaScript fundamentals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePython programming\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStarting a coding nonprofit\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGetting into tech as a beginner\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding apps from scratch\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eUsing code for social impact\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNavigating CS as a first-gen or underrepresented student\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eAcademically, I am drawn to the intersection of computing and biology, including computational biology, bioinformatics, and data-driven approaches to public health. I enjoy the challenge of building systems that help answer real scientific questions. I have experience in both wet-lab and computational research environments. At UTHealth Houston's Institute for Molecular Medicine, I worked with large-scale genomic and proteomic datasets, performing statistical analysis and building a Python pipeline of over 700 lines to process genomic data. At Rice University's Bennett Biodesign Lab, I assisted with molecular biology techniques including restriction cloning and Golden Gate Assembly. These experiences deepened my appreciation for how software can amplify scientific research.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of class, I spend a lot of time building and leading community-focused projects. In 2024, I founded Omelora, a youth-led education and wellness nonprofit. Starting from a single Google Doc, it has grown into an international effort with over 200 active student volunteers. Through Omelora, I have helped coordinate the delivery of school supplies, books, and care items to an orphanage and school in Enugu, Nigeria, while also running local service initiatives in the United States. Leading Omelora has taught me how to organize people, communicate clearly,  and build things that last.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also passionate about tech education. I co-founded Compute the Future Foundation, where I helped design and teach multi-week web development courses to younger students. I have worked with Hack Club to support girls in tech, reviewing projects and maintaining program resources. Mentoring and helping beginners find their footing in coding is something I genuinely enjoy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also care deeply about writing. I have received national recognition for my writing, and I see storytelling as an important complement to technical work, especially when communicating ideas about science and impact.\u003c/p\u003e","teachingVideoPlaybackId":"Yxx2yDpIJFk4VwQwriCUkFBpTcHMcIjSrATftykGT1M","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c3b7ce5a-bb16-4b91-a1ec-f0489ad0c988\"}"},{"__ref":"Favorites:{\"uuid\":\"250a2a9f-8fc4-45f9-a493-583566abeee5\"}"},{"__ref":"Favorites:{\"uuid\":\"0c0bb57b-7f0d-45b5-b40f-c6491f6f7427\"}"}],"causesSupported":[],"major":"Computer Science \u0026 Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"292fe722-0135-40d0-acab-9edc22a1acb6\"}"},{"__ref":"DeepDives:{\"uuid\":\"1eee6ef0-d2fc-412e-a93a-aec6cbe850eb\"}"},{"__ref":"DeepDives:{\"uuid\":\"83949179-4b1e-4103-86c4-a4c369ce5966\"}"},{"__ref":"DeepDives:{\"uuid\":\"8e4cb98a-c84a-4f67-a57b-e997400d87cf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4851dea8-9b42-4ee5-8a72-cefa16e609b4/-/preview/-/format/jpg/","https://ucarecdn.com/5467cfd7-a141-45c4-857f-cb502c292f13/-/preview/-/format/jpg/","https://ucarecdn.com/0fce169d-d8fb-423b-857c-e256fc8d069a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b46a3bc5-f46d-421d-a8ea-25136af6f1c3\"}"},{"__ref":"Education:{\"uuid\":\"317e5085-8fa5-4a0b-b472-d67364edf053\"}"}],"hiredAt":"2026-01-16T16:02:20.031Z","topics":["Calculus","Precalculus / Trigonometry","6-8 Grade Science","Biology","Writing","College Essay Writing","Computer Science","Reading","Executive Function","Academic Coaching"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucar
