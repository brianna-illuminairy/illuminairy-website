xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"e2eb7b76-af7a-4b90-b815-dd88c2083bbf\"}":{"__typename":"DeepDives","uuid":"e2eb7b76-af7a-4b90-b815-dd88c2083bbf","content":"\u003cp\u003eMy greatest role models are my parents. Growing up, I saw how much dedication and discipline they brought to their work and to providing for our family. When we came to the United States and had to begin again in many ways, I saw firsthand their perseverance and commitment to building a better future.\u003c/p\u003e\u003cp\u003eThey often woke up very early, sometimes as early as 3 a.m., and worked long days as they continued striving forward. Watching their consistency taught me the importance of responsibility, humility, and steady effort. Their example continues to shape how I approach my work and the opportunities I’ve been given.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"614b1a7c-e5ae-4de0-a195-fcd1227bd62a\"}":{"__typename":"DeepDives","uuid":"614b1a7c-e5ae-4de0-a195-fcd1227bd62a","content":"\u003cp\u003eMentorship matters to me because I would not be where I am today without the guidance of others. Throughout my life I have been fortunate to have mentors who encouraged me academically and personally. Some were teachers who took time to help me think through challenges, and others were peers who supported and motivated me along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHaving someone who believes in you and takes the time to listen can make a big difference in a student’s confidence and direction. Mentorship does not always mean having all the answers, but it means walking alongside someone as they learn and grow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of the mentors who helped me, I value the opportunity to support students as they explore their interests, overcome challenges, and build confidence in themselves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7a1b6063-b7f3-4c40-84e2-fdd278d45387\"}":{"__typename":"DeepDives","uuid":"7a1b6063-b7f3-4c40-84e2-fdd278d45387","content":"\u003cp\u003eIn my spare time I enjoy reading, cooking, and exploring new places. Cooking is one of my favorite hobbies. Whenever I have the chance, I like learning new recipes and experimenting with different ways of preparing food. I especially enjoy finding ways to make simple, everyday meals feel special, creative, and enjoyable.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLiving in France has also \u003c/p\u003e\u003cp\u003ebeen a meaningful experience for me. It has given me the opportunity to experience a different culture, practice French, and learn from the people and communities around me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also enjoy learning new things on my own, particularly in areas related to technology and problem solving. Sometimes that means experimenting with small coding ideas or exploring how different tools and technologies work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I appreciate simple moments like taking walks, spending time in quiet reflection, or journaling. These activities help me recharge and stay curious about the world around me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"ccc6bd8a-0feb-4d41-87a3-36941fb2fdcc\"}":{"__typename":"DeepDives","uuid":"ccc6bd8a-0feb-4d41-87a3-36941fb2fdcc","content":"\u003cp\u003eSomething that might not be obvious right away is that I really value quiet moments in nature. A perfect day for me might be something simple like having a picnic in the park, watching the water and the blue sky, and taking time to reflect. I also enjoy journaling and occasionally writing poetry. Slowing down like this helps me reset and return to my work with a clearer mind\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"87d29d46-e145-40bc-a269-48dbcd351e15\"}":{"__typename":"School","uuid":"87d29d46-e145-40bc-a269-48dbcd351e15","name":"North Bergen High School","city":"North Bergen","type":"HIGH","state":"New Jersey","country":"United States","zip":"07047"},"Education:{\"uuid\":\"1bff8186-ed95-4362-ab7a-1f151b4e8c3c\"}":{"__typename":"Education","uuid":"1bff8186-ed95-4362-ab7a-1f151b4e8c3c","school":{"__ref":"School:{\"uuid\":\"87d29d46-e145-40bc-a269-48dbcd351e15\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"8cdcb3bc-9513-4769-89a8-40a68c37db7d\"}":{"__typename":"Education","uuid":"8cdcb3bc-9513-4769-89a8-40a68c37db7d","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science ","degree":null},"MentorPublicProfile:{\"uuid\":\"a9ff4766-4b8a-4386-a296-53312df0516f\"}":{"__typename":"MentorPublicProfile","uuid":"a9ff4766-4b8a-4386-a296-53312df0516f","displayName":"Vimbisai B.","slug":"vimbisai-basvi","biography":"\u003cp\u003eHi! My name is Vimbisai, and I recently graduated from Yale University with a degree in Computer Science. I enjoy helping students learn, ask questions, and build confidence in subjects that can sometimes feel challenging at first.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up between Zimbabwe and the United States gave me an early appreciation for education and the different ways people learn and experience the world. Because of that, I believe learning becomes most meaningful when students feel supported and encouraged to explore ideas at their own pace.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am currently working as an English Language Assistant in France, where I support young students in the classroom and help teachers create engaging learning activities. I work with students across many different classes, which has given me experience adapting lessons to different personalities, learning styles, and levels of confidence. This experience has reminded me how important patience, encouragement, and curiosity are in helping students grow. I enjoy creating learning environments where students feel comfortable participating and sharing their ideas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my time at Yale, I also had opportunities to work with students in teaching and mentoring roles. Through a Yale teaching fellowship, I taught a project-based coding course for middle school students. In that course, students learned introductory programming concepts using tools such as Scratch, HTML, and CSS. One of the most rewarding parts of the experience was watching students turn their ideas into small projects and gain confidence as they experimented and solved problems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also worked as an Academic Strategies Mentor through Yale’s Poorvu Center for Learning and Teaching. In this role, I supported first-generation and underrepresented students as they navigated the academic challenges of college and explored opportunities in STEM fields. Mentoring students during this time helped me appreciate how valuable it can be for students to have someone who listens, encourages them, and helps them think through obstacles.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my mentoring sessions, I enjoy helping students with math, writing, and computer science. Sometimes this means working through difficult concepts step by step, and other times it means exploring creative projects such as simple coding exercises or small website designs. My goal is not only to help students arrive at the right answer, but also to help them understand how to approach problems thoughtfully and independently.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI enjoy working with students who are curious, thoughtful, and willing to try new ideas. Learning is often most meaningful when students feel supported and encouraged, and I hope to create that kind of environment in the sessions I lead.\u003c/p\u003e","teachingVideoPlaybackId":"QOEhctiMYSc8DQxBXazeUl47GCBTqqeiXvriVQLNSKM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e2eb7b76-af7a-4b90-b815-dd88c2083bbf\"}"},{"__ref":"DeepDives:{\"uuid\":\"614b1a7c-e5ae-4de0-a195-fcd1227bd62a\"}"},{"__ref":"DeepDives:{\"uuid\":\"7a1b6063-b7f3-4c40-84e2-fdd278d45387\"}"},{"__ref":"DeepDives:{\"uuid\":\"ccc6bd8a-0feb-4d41-87a3-36941fb2fdcc\"}"}],"active":true,"profilePhotos":["https://ucare
