xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"d66e9441-6660-408a-997f-979c6a8cf4aa\"}":{"__typename":"DeepDives","uuid":"d66e9441-6660-408a-997f-979c6a8cf4aa","content":"\u003cp\u003eThe schools I grew up in were very academically focused, and that naturally shaped how I work and how I teach. I value structure, clarity, and depth, and I try to pass that on to my students. At the same time, I’m very aware of how overwhelming strict academic environments can feel, so I make an effort to balance high expectations with encouragement. I want students to push themselves, but I also want them to feel supported and confident as they tackle complex ideas.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"de56c777-2391-43bc-a421-6b1eb92407dc\"}":{"__typename":"DeepDives","uuid":"de56c777-2391-43bc-a421-6b1eb92407dc","content":"\u003cp\u003eMy one piece of advice, would be to do less but do it better. I used to think saying yes to everything made me more impressive or more prepared, but it mostly made me scattered. Focusing on a few things that genuinely mattered would have given me more depth, more clarity, and a lot more peace. I’d tell my younger self that there’s no prize for being stretched thin, and that real growth comes from giving your full attention to what you care about instead of trying to hold everything at once.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"acdfa109-6fa0-4945-93bc-555aaa8c59b9\"}":{"__typename":"DeepDives","uuid":"acdfa109-6fa0-4945-93bc-555aaa8c59b9","content":"\u003cp\u003eI chose my majors because I genuinely loved both subjects and wasn’t ready to give up either. Computer science gave me the tools to build and understand complex systems, while economics helped me think about incentives, behavior, and real-world impact. Studying them together felt natural. Each one pushed me to think in a different way, and the combination has shaped how I approach problems and make decisions today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"0b045c5a-d49c-4f22-a3f6-fea2514bfe7f\"}":{"__typename":"School","uuid":"0b045c5a-d49c-4f22-a3f6-fea2514bfe7f","name":"Aga Khan Higher Secondary School, Karachi","city":"Karachi","type":"HIGH","state":"Sindh","country":"Pakistan","zip":"75950"},"Education:{\"uuid\":\"413de49d-e9f5-4fec-8f42-611874fa57bd\"}":{"__typename":"Education","uuid":"413de49d-e9f5-4fec-8f42-611874fa57bd","school":{"__ref":"School:{\"uuid\":\"0b045c5a-d49c-4f22-a3f6-fea2514bfe7f\"}"},"startYear":"2019","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}":{"__typename":"School","uuid":"0a298df6-dac8-4a1d-8e35-77e7b609185d","name":"Minerva University","city":"San Francisco","type":"COLLEGE","state":"California","country":"United States","zip":"94103"},"Education:{\"uuid\":\"dbcf1985-4acb-4829-9190-b49578c16620\"}":{"__typename":"Education","uuid":"dbcf1985-4acb-4829-9190-b49578c16620","school":{"__ref":"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science, Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"91f7b50c-59c7-4148-a429-0cff69214c8b\"}":{"__typename":"MentorPublicProfile","uuid":"91f7b50c-59c7-4148-a429-0cff69214c8b","displayName":"Ramsha A.","slug":"ramsha-ali","biography":"\u003cbr\u003e\u003cp\u003eThis past summer I taught at Yale's Young Global Scholars Program, on vision learning models, autonomous vehicles, and machine learning. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWatching students gain confidence as they break down difficult concepts has become one of the most rewarding parts of my work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI recently graduated from Minerva University, where I studied computer science and economics. That combination shaped how I think: CS gave me the tools to build and analyze systems, and economics forced me to understand incentives, tradeoffs, and the real impact technology has on people’s lives. \u003c/p\u003e\u003cp\u003eAlongside teaching, I spent my summer at Yale’s Interactive Robotics Lab working on spatial modeling, Hilbert maps, and simulation. It was the first time I saw how mathematical modeling and robotics come together to create something that can actually navigate and understand the world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of research, I’ve consistently gravitated toward applied work. Over the past year I’ve been involved with a range of AI startups across San Francisco, working on things like agentic workflows, freight automation, developer tools, and meaning-based search. These roles usually sit at the intersection of engineering, product decisions, and real customer problems, which is where I work best. I like taking an idea, building a system around it, then iterating until it solves something real.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also spend a lot of time thinking about how technology shapes culture, behavior, and opportunity. That interest has taken me through projects on autonomous vehicles, simulation, vision-language models, and 3D mapping. It has also influenced my writing, which I do as a way to reflect, to make sense of what I’m learning, and to communicate ideas clearly.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLiving in San Francisco, I’m active in the robotics and AI community, organizing events, collaborating with founders, and building side projects. I enjoy being around people who are curious, ambitious, and trying to push boundaries.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the end of the day, my goal as a teacher is simple: help students feel capable, grounded, and excited to explore challenging ideas. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne thing I try to bring into all my teaching and technical work is a sense of openness toward uncertainty. Most of the fields I work in are changing fast, and students often feel pressure to “already know everything” before they begin. I remind them that curiosity is more valuable than certainty, and that good work comes from asking better questions, testing ideas, and being willing to revise your thinking. That mindset has shaped my own path through robotics, AI, and research, and it’s something I hope my students carry with them long after the class ends.\u003c/p\u003e\u003cp\u003eIf they walk away believing they can understand and build more than they thought, then I’ve done my job.\u003c/p\u003e","teachingVideoPlaybackId":"hLvfj48lqATvdHusZdUtU6VbfNqnvFQOsjU3BY85bJg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science, Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d66e9441-6660-408a-997f-979c6a8cf4aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"de56c777-2391-43bc-a421-6b1eb92407dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"acdfa109-6fa0-4945-93bc-555aaa8c59b9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7698bdcd-93ec-4dba-a6cd-6cf99e8f5e81/-/preview/-/format/jpg/","https://ucarecdn.com/1e804930-ec13-41bc-a547-b355b7a94681/-/preview/-/format/jpg/","https://ucarecdn.com/8487f6eb-9476-4194-a620-c99c912c5e65/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"413de49d-e9f5-4fec-8f42-611874fa57bd\"}"},{"__ref":"Education:{\"uuid\":\"dbcf1985-4acb-4829-9190-b49578c16620\"}"}],"hiredAt":"2025-12-02T17:04:11.182Z","topics":["Statistics","Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","6-8 Grade Science","Physics","Chemistry","Writing","Economics","Computer Science","Reading","Academic Coaching","Executive Function","College Essay Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ramsha-ali\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"91f7b50c-59c7-4148-a429-0cff69214c8b\"}"}}},"_sentryTraceData":"a66796d4a81c4a39b3850a9753558cc6-90e21e428d7bb9ef-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a66796d4a81c4a39b3850a9753558cc6,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ramsha-ali"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+
