xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3b300f10-4239-4600-930a-42c6acdeeecb\"}":{"__typename":"Favorites","uuid":"3b300f10-4239-4600-930a-42c6acdeeecb","photoUrl":"https://ucarecdn.com/1e2666a8-4017-4650-96d2-0aeee3991b13/","title":"Amy Poehler","type":"ACTOR"},"Favorites:{\"uuid\":\"5ec12c00-7fdb-4440-93c8-17bf8a6a4554\"}":{"__typename":"Favorites","uuid":"5ec12c00-7fdb-4440-93c8-17bf8a6a4554","photoUrl":"https://ucarecdn.com/07d3c122-9d4e-4251-b2e4-6c5e08673229/","title":"Wall-E","type":"MOVIE"},"Favorites:{\"uuid\":\"7235bd78-40a8-4dae-9d31-747544269131\"}":{"__typename":"Favorites","uuid":"7235bd78-40a8-4dae-9d31-747544269131","photoUrl":"https://ucarecdn.com/22bea27c-d820-40d9-9eb0-39b13db131b0/","title":"San Diego","type":"CITY"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a59696f3-fe81-45b8-9e71-e2512fd99622\"}":{"__typename":"DeepDives","uuid":"a59696f3-fe81-45b8-9e71-e2512fd99622","content":"\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eThe summer going into junior year, I worked as a sword fighter in one of the shows at Legoland... four times a day, I performed on Castle Hill in their medieval show. It was a fever dream.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAnother summer I was an intern for Alzheimer's San Diego, which was very different!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"029a9764-b287-4cae-b747-7c5aac9498ea\"}":{"__typename":"DeepDives","uuid":"029a9764-b287-4cae-b747-7c5aac9498ea","content":"\u003cp\u003eIn middle school, I was constantly critiquing myself and worried about the future. Whether I was stressed about acne, being queer, or what those around me were thinking, I recall wondering if it would ever get easier. Because of this, I can fully empathize with any student who is struggling to feel comfortable in their own skin. But almost as quickly as high school, I learned that it does get better, and that your dreams can become your reality!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"a898bb92-2553-487b-bac2-5bbf69f4debc\"}":{"__typename":"School","uuid":"a898bb92-2553-487b-bac2-5bbf69f4debc","name":"Orange County School of the Arts","city":"Santa Ana","type":"HIGH","state":"California","country":"United States","zip":"92701"},"Education:{\"uuid\":\"1c05d583-d3b9-47c4-922a-3deea43c0b42\"}":{"__typename":"Education","uuid":"1c05d583-d3b9-47c4-922a-3deea43c0b42","school":{"__ref":"School:{\"uuid\":\"a898bb92-2553-487b-bac2-5bbf69f4debc\"}"},"startYear":"2016","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"6daf6342-1149-447a-96d8-e111c08ea3d5\"}":{"__typename":"Education","uuid":"6daf6342-1149-447a-96d8-e111c08ea3d5","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Film and Media Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"8b2727c7-8e67-4ff8-b8c0-3cf568ed05f7\"}":{"__typename":"MentorPublicProfile","uuid":"8b2727c7-8e67-4ff8-b8c0-3cf568ed05f7","displayName":"Dean F.","slug":"dean-farella","biography":"\u003cp\u003eHi hi! My name is Dean, and I graduated from Yale in 2025 with a degree in Film and Media Studies. I’m super passionate about all forms of creative expression, but my primary areas of interest are in writing, film, and theater. Whether it’s editing a video to post on TikTok, choreographing a combo for a Hip Hop recital, or writing a screenplay to send to film festivals, I’d love to support your student in realizing their passions!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA little bit about me… From 8th to 12th grade, I took a train 4 hours roundtrip every day to attend a public performing arts high school that was not immediately accessible to me in San Diego County. I was a member of their Acting Conservatory program, and it was there that I fell in LOVE with arts advocacy and mentorship. My extracurriculars mainly involved acting in student short films, being the Vice President of French Honors Society, and having some leadership roles in a few local community service-oriented clubs. Looking back on my time in high school, I definitely was most driven by getting to perform on stage and expressing myself creatively. This meant filming lots of TikToks in the school parking lot and wearing outfits so colorful astronauts probably got distracted by them in orbit.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I got to Yale, I largely continued these extracurricular endeavors, albeit with more of an emphasis on production and directing. I was involved with the Yale Student Film Festival as an event coordinator, the Yale Hunger and Homelessness Action Project, numerous theatrical and film productions, and Yale’s oldest sketch comedy group, The Fifth Humour. Additionally, I continued refining my writing skills as a blogger for the Yale Admissions Office. I also worked as an intern for the production companies of actress Viola Davis and producer Bruce Cohen (\u003cem\u003eAmerican Beauty\u003c/em\u003e, \u003cem\u003eSilver Linings Playbook\u003c/em\u003e, etc.).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSo! Whether your student wants feedback on an English essay or to discover their passion in something new, I’d love to help them reach their goals. In 2022, my dad passed away from brain cancer, so I know how hard life can be when trying to juggle school with growing up. To give a student (of any age) the support they need to get after what they want, is why I’m happy to be with Curious Cardinals.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen not mentoring, I can be found in Los Angeles writing, acting, and roller skating around town. Can’t wait to meet your student!\u003c/p\u003e","teachingVideoPlaybackId":"027026crnIxL02T9ly7a6rHRnHKMTtROfAydRUh00C3EuOw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3b300f10-4239-4600-930a-42c6acdeeecb\"}"},{"__ref":"Favorites:{\"uuid\":\"5ec12c00-7fdb-4440-93c8-17bf8a6a4554\"}"},{"__ref":"Favorites:{\"uuid\":\"7235bd78-40a8-4dae-9d31-747544269131\"}"}],"causesSupported":[],"major":"Film and Media Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a59696f3-fe81-45b8-9e71-e2512fd99622\"}"},{"__ref":"DeepDives:{\"uuid\":\"029a9764-b287-4cae-b747-7c5aac9498ea\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/37a826c0-445a-45b3-af42-808c4901c4f9/-/preview/-/format/jpg/","https://ucarecdn.com/060619ae-a33d-4f5e-a09c-23825b378957/-/preview/-/format/jpg/","https://ucarecdn.com/d03734a8-01d5-460e-8f9a-60852926bea5/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1c05d583-d3b9-47c4-922a-3deea43c0b42\"}"},{"__ref":"Education:{\"uuid\":\"6daf6342-1149-447a-
