xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"d3c0ddc9-1fca-4c59-9742-0c05c450c29d\"}":{"__typename":"DeepDives","uuid":"d3c0ddc9-1fca-4c59-9742-0c05c450c29d","content":"\u003cp\u003eWhen I reflect upon my educational journey thus far, one of the true constants have been my educators. They crafted safe spaces for identity development, intellectual curiosity, and a sense of community. Without their mentorship, I truly would not be the person I am today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"be9e67ef-b91b-4ce5-924f-2760fc1992e6\"}":{"__typename":"DeepDives","uuid":"be9e67ef-b91b-4ce5-924f-2760fc1992e6","content":"\u003cp\u003eI founded Medical Advocacy, my high school's first public health club, where we created K-8 outreach initiatives to educate students and their families on the social determinants of health.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3d565a91-ccca-4305-a76c-e8f1b3758272\"}":{"__typename":"DeepDives","uuid":"3d565a91-ccca-4305-a76c-e8f1b3758272","content":"\u003cp\u003eAlways remember to lean on community (even when it's hard) and that authenticity is key to a fulfilling life!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2c2adb88-547c-4367-9462-68b684d76294\"}":{"__typename":"School","uuid":"2c2adb88-547c-4367-9462-68b684d76294","name":"Head-Royce School","city":"Oakland","type":"HIGH","state":"California","country":"United States","zip":"94602"},"Education:{\"uuid\":\"c36991ba-fb8e-4591-8250-05479e85b2b2\"}":{"__typename":"Education","uuid":"c36991ba-fb8e-4591-8250-05479e85b2b2","school":{"__ref":"School:{\"uuid\":\"2c2adb88-547c-4367-9462-68b684d76294\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a34ed8bf-20b0-4cb7-8a53-863ce0b3867b\"}":{"__typename":"Education","uuid":"a34ed8bf-20b0-4cb7-8a53-863ce0b3867b","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"52eb459b-1e90-4a83-be2c-c90120b3dc93\"}":{"__typename":"MentorPublicProfile","uuid":"52eb459b-1e90-4a83-be2c-c90120b3dc93","displayName":"Iyobosa E.","slug":"iyobosa-enabulele","biography":"\u003cp\u003eHi, my name is Iyọbosa!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eRooted in a rich multicultural background, I have developed an unwavering passion for public/global health, medicine, and building healthier communities. A friend once described me as “a STEM cloud with a humanities lining,” and I think that captures who I am on many levels. At Stanford, I am a rising junior studying Human Biology on the premed track, with a concentration in informed decision-making in health policy. I am deeply drawn to connecting with people and understanding how our personal stories fit within our broader systems. I am especially interested in how accessibility shapes our sense of life fulfillment and our ability to live our healthiest lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI live in this kind of intersection between life and social sciences, and firmly believe that this avenue best equips me to address issues of accessibility in healthcare. It is vital to understand how our social contexts influence our biology — and how our biology, as a result, shapes our social experiences. In these ways, we can then better provide more effective and equitable care. This is why my concentration serves as the perfect convergence of my academic and professional ambitions as a future physician-scientist.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThough lots of my academic energy is channeled into the sciences, in my free time, I love dabbling in all things creative — from dance and storytelling to visual arts and acting. I also enjoy being an active member of student groups at school and coordinating events that extend resources beyond our immediate campus community. Ever since I was a kid, these forms of communal involvement and self-expression have been core to me, and haven't left me since!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, as I join the Curious Cardinals team, I hope to draw on my experiences as a STEMentor through Stanford's Department of Chemistry and a Seeds of Change Mentor for the VMware Women's Leadership Innovation Lab. Over the past year and a half, I have supported both high school and college students in cultivating their academic skills. With each lesson, we go through lecture topics (e.g., stoichiometry, dimensional analysis, multi-step word problems) and pair them with an associated skill, such as time management or creating your own challenge problems. Through this, we build towards a solid foundation for general chemistry concepts and also long-term study habits. This work really excites me because it truly is a transformative process to simultaneously tackle challenging questions, while building up skills that make students more well-rounded learners. When I entered Stanford, these kinds of mentorship programs were pivotal to my academic growth in the classroom. Now, it feels rewarding to experience this full-circle moment, one where I can similarly create spaces for students to master challenging topics and develop skills that will serve them well beyond the classroom!\u003c/p\u003e","teachingVideoPlaybackId":"6g7B9FD3o1XGOSev2dQOUhaakx101100SBuKylpqz66qE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d3c0ddc9-1fca-4c59-9742-0c05c450c29d\"}"},{"__ref":"DeepDives:{\"uuid\":\"be9e67ef-b91b-4ce5-924f-2760fc1992e6\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d565a91-ccca-4305-a76c-e8f1b3758272\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a6a23aab-c8f6-444e-b06c-003df820c7c7/-/preview/-/format/jpg/","https://ucarecdn.com/c9af6cfa-d5a7-45f3-88a4-6a7de7919cb4/-/preview/-/format/jpg/","https://ucarecdn.com/404c8ae8-97a0-49ca-bae7-b85126eeb69c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c36991ba-fb8e-4591-8250-05479e85b2b2\"}"},{"__ref":"Education:{\"uuid\":\"a34ed8bf-20b0-4cb7-8a53-863ce0b3867b\"}"}],"hiredAt":"2025-08-25T16:05:13.741Z","topics":["Chemistry","Biology","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Music","Visual Arts / Graphic Design","Medicine / Health","STEM Project","Public Speaking","Law / Government / Policy"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"iyobosa-enabulele\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"52eb459b-1e90-4a83-be2c-c90120b3dc93\"}"}}},"_sentryTraceData":"a55115cecfaf4769bb579a2f836d1d4d-9d7db180bf936de3-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a55115cecfaf4769bb579a2f836d1d4d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"iyobosa-enabulele"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
