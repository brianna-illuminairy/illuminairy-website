xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"380af035-f3df-4dda-bf39-a40cd918945c\"}":{"__typename":"Favorites","uuid":"380af035-f3df-4dda-bf39-a40cd918945c","photoUrl":"https://ucarecdn.com/70a11ac3-bde1-4ded-8252-ade5fbee727d/","title":"Seoul","type":"CITY"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"e48294cc-9f71-4d35-b6a3-69d2012de5b6\"}":{"__typename":"DeepDives","uuid":"e48294cc-9f71-4d35-b6a3-69d2012de5b6","content":"\u003cp\u003eThe fact that my future profession (clinical psychologist) closely aligns with giving people \u003cstrong\u003ehope\u003c/strong\u003e, faith, healing, and love motivates me to persevere on this path!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"9df5c95f-9e46-432b-b7ca-95584e9735a7\"}":{"__typename":"DeepDives","uuid":"9df5c95f-9e46-432b-b7ca-95584e9735a7","content":"\u003cp\u003ePeople often called me \"try-hard\" but I was someone who wanted to try everything through a \u003cem\u003egrowth mindset\u003c/em\u003e. I'm so glad I took those years to truly \u003cstrong\u003eexplore\u003c/strong\u003e different ways to impact my community. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"4529ff2c-bf8e-4551-a4ef-332c56e21bc8\"}":{"__typename":"DeepDives","uuid":"4529ff2c-bf8e-4551-a4ef-332c56e21bc8","content":"\u003cp\u003eForming relationships and walking with someone for an extended time is so beautiful. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9db833f9-d633-471a-9443-e95c25c80bdb\"}":{"__typename":"DeepDives","uuid":"9db833f9-d633-471a-9443-e95c25c80bdb","content":"\u003cp\u003eOur minds are so complicated! And that makes it interesting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"d28499bc-072b-4bf1-ae6f-c00b69958d8b\"}":{"__typename":"School","uuid":"d28499bc-072b-4bf1-ae6f-c00b69958d8b","name":"Larchmont Charter School - La Fayette Park","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90057"},"Education:{\"uuid\":\"f3361a88-b6db-44fd-bb97-0b7f5f049d9c\"}":{"__typename":"Education","uuid":"f3361a88-b6db-44fd-bb97-0b7f5f049d9c","school":{"__ref":"School:{\"uuid\":\"d28499bc-072b-4bf1-ae6f-c00b69958d8b\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"d680d573-c038-4500-b7bf-25265482ac31\"}":{"__typename":"Education","uuid":"d680d573-c038-4500-b7bf-25265482ac31","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology and Global Health Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"23110c56-6378-4f00-b477-e9b5c50c0782\"}":{"__typename":"MentorPublicProfile","uuid":"23110c56-6378-4f00-b477-e9b5c50c0782","displayName":"Goeun L.","slug":"goeun-lee","biography":"\u003cp\u003eHello! I'm Goeun (pronounced \"Go-In\"). I graduated from \u003cstrong\u003eYale University\u003c/strong\u003e as a Berkeley College Class of 2025 student with a B.S. in\u003cstrong\u003e Psychology with Honors Distinction\u003c/strong\u003e. I was selected as a Yale \u003cstrong\u003eGlobal Health Scholar\u003c/strong\u003e through the Jackson School of Global Affairs. Last year, I was selected as a \u003cstrong\u003eUS Fulbright Finalist \u003c/strong\u003eto conduct my independent research project in Korea. I am now working as a Postgraduate Associate at Yale School of Medicine, conducting clinical psychology research under Dr. Marc Potenza. I hope to pursue a Clinical Psychology PhD following my gap year to be able to practice, research, and teach about mental health/illness, the very topics I'm deeply passionate about.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was born in \u003cstrong\u003eSouth Korea\u003c/strong\u003e, but my family moved to Los Angeles, CA when I was ten. Thanks to my background, I am fluent in both Korean and American and well-versed in both cultures. I enjoy journaling, running, hanging out with my church community, and ~planning out my life for fun. My favorite memory from undergraduate is my global health policy study abroad program in Geneva, \u003cstrong\u003eSwitzerland\u003c/strong\u003e :)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI served as an Instructor for the \"Solving Global Challenges\" Track at the\u003cstrong\u003e Yale Young Global Scholars Program (YYGS)\u003c/strong\u003e in Summer 2025, where I mentored high school students from around the world. The titles of my seminars were ​​\u003cem\u003eHow Social Psychology Explains Our Biases and Mistakes (and teaches us to fix it), The Psychology of Resilience: Rethinking Global Mental Health, and Does Money Buy Happiness?: The Social Determinants of Mental Health\u003c/em\u003e. Through YYGS, I learned that high school is such a formative year for growth and that I absolutely \u003cem\u003eLOVE\u003c/em\u003e walking with students 1-1 on their academic, professional, and personal journeys.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs your mentor, I’m happy to help with \u003cstrong\u003eany academic subject\u003c/strong\u003e, \u003cstrong\u003eSAT preparation\u003c/strong\u003e, \u003cstrong\u003ecollege essays\u003c/strong\u003e, \u003cstrong\u003einterview prep\u003c/strong\u003e, and \u003cstrong\u003epsychology lessons\u003c/strong\u003e. I also offer guidance on \u003cstrong\u003egoal-setting\u003c/strong\u003e, \u003cstrong\u003etime management\u003c/strong\u003e, \u003cstrong\u003efinding your passions\u003c/strong\u003e, \u003cstrong\u003eexploring extracurricular opportunities\u003c/strong\u003e, and using tools like \u003cstrong\u003eNotion\u003c/strong\u003e and \u003cstrong\u003eGoogle Calendar\u003c/strong\u003e to stay organized. I love helping students search for \u003cstrong\u003efellowships\u003c/strong\u003e, \u003cstrong\u003escholarships\u003c/strong\u003e, and other enrichment programs.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor students applying to college, I specialize in helping you \u003cstrong\u003e“market yourself” effectively\u003c/strong\u003e, identifying your unique strengths and crafting a compelling personal narrative that will stand out!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAbove all, I’m excited to support you as you discover who you are, what you care about, and how you want to make an impact.\u003c/p\u003e","teachingVideoPlaybackId":"7cgli0034gOwMCpHwqAvoUDOwoIiq01vNJnjvRuLO5EuQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"380af035-f3df-4dda-bf39-a40cd918945c\"}"}],"causesSupported":[],"major":"Psychology and Global Health Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e48294cc-9f71-4d35-b6a3-69d2012de5b6\"}"},{"__ref":"DeepDives:{\"uuid\":\"9df5c95f-9e46-432b-b7ca-95584e9735a7\"}"},{"__ref":"DeepDives:{\"uuid\":\"4529ff2c-bf8e-4551-a4ef-332c56e21bc8\"}"},{"__ref":"DeepDives:{\"uuid\":\"9db833f9-d633-471a-9443-e95c25c80bdb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f234fb15-3452-4950-9e33-93794627315b/-/preview/-/format/jpg/","https://ucarecdn.com/18a15f2b-750d-4d02-b594-1752e3d5c304/-/preview/-/format/jpg/","https://ucarecdn.com/0dfec497-2c48-43f0-b819-c775188ddbe8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f3361a88-b6db-44fd-bb97-0b7f5f049d9c\"}"},{"__ref":"Education:{\"uuid\":\"d680d573-c038-4500-b7bf-25265482ac31\"}"}],"hiredAt":"2025-12-04T18:10:55.658Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Writing","College Essay Writing","Academic Coaching","Executive Function","STEM Project","Medicine / Health"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"goeun-lee\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"23110c56-6378-4f00-b477-e9b5c50c0782\"}"}}},"_sentryTraceData":"05bcdbdcd5364599b76a80cca86b7125-b9e795b834425f76-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=05bcdbdcd5364599b76a80cca86b7125
