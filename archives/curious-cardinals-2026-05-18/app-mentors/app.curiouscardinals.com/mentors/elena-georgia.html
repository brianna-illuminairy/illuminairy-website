xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"39db84d7-da24-4f6d-b1f6-8f7358784028\"}":{"__typename":"DeepDives","uuid":"39db84d7-da24-4f6d-b1f6-8f7358784028","content":"\u003cp\u003eI grew up, and am still growing, between multiple identities and cultural environments. From my Italian childhood, two years in Nairobi, French summer camps, involvement in the competitive academic environment of Washington D.C., and now studying in the Irish system, I’ve learned to switch between not only languages but also ways of thinking. Living across these different cultures has taught me to expand ideas beyond a single place or perspective and think in a more global and impactful way. It has also helped me develop the ability to break down ideas that I can explain to all different kinds of people and students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"db5787f3-9f0b-4e57-9dbf-b7c2a5ee4d1d\"}":{"__typename":"DeepDives","uuid":"db5787f3-9f0b-4e57-9dbf-b7c2a5ee4d1d","content":"\u003cp\u003eIt’ll all work out. There’s no need to force everything into one path. The experiences that felt disconnected at the time often come together in beautiful and often unexpected ways which shape not only how you think, but how you can now connect with all sorts of people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"7d807ca8-046c-4c57-821d-bdd406bcdcc7\"}":{"__typename":"DeepDives","uuid":"7d807ca8-046c-4c57-821d-bdd406bcdcc7","content":"\u003cp\u003eNike’s “Just Do It.” It reminds me not to overthink things or get stuck in fear that something might not work out or in worry about judgment. Truth is, when you’re committed and put real effort into what you think is awesome, people are more likely to appreciate it than criticize it. I’ve found that most of the meaningful experiences I’ve had came from simply starting and throwing myself out there, even when I wasn’t fully sure how things would turn out.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"60bd8978-b9bd-4e4e-a019-a6577878faff\"}":{"__typename":"DeepDives","uuid":"60bd8978-b9bd-4e4e-a019-a6577878faff","content":"\u003cp\u003eBecause it was so far from anything I ever knew, and because I get to do two ;) – majors I mean. The Middle East is such a fascinating place, and stepping outside the Western hemisphere is something I think we all need to do; not just to learn about other cultures, but to really notice how interconnected everything is, and how something that happens in one part of the world can have a domino effect elsewhere. And Political Science, well, that’s because I get to tie it all together: from my intensive cultural studies, I get to go to New York and zoom out and see the world in a more geopolitical context. It’s so cool!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"eb919ee9-a434-4b06-9d87-e450f2b4a553\"}":{"__typename":"School","uuid":"eb919ee9-a434-4b06-9d87-e450f2b4a553","name":"Georgetown Day School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20016"},"Education:{\"uuid\":\"0fca1a08-ffdd-43bb-a9be-43f9f08c2773\"}":{"__typename":"Education","uuid":"0fca1a08-ffdd-43bb-a9be-43f9f08c2773","school":{"__ref":"School:{\"uuid\":\"eb919ee9-a434-4b06-9d87-e450f2b4a553\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"48d8bee7-e8ac-4261-bdaf-355b67407a77\"}":{"__typename":"School","uuid":"48d8bee7-e8ac-4261-bdaf-355b67407a77","name":"Trinity College Dublin/ Columbia University Dual BA","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"7d4e5c09-f46b-4700-b3f8-ac6acd45b773\"}":{"__typename":"Education","uuid":"7d4e5c09-f46b-4700-b3f8-ac6acd45b773","school":{"__ref":"School:{\"uuid\":\"48d8bee7-e8ac-4261-bdaf-355b67407a77\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Middle Eastern and European Languages and Cultures (MEELC)/ Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"f2831945-ec05-4f4f-af5f-727ad0ab98a3\"}":{"__typename":"MentorPublicProfile","uuid":"f2831945-ec05-4f4f-af5f-727ad0ab98a3","displayName":"Elena L.","slug":"elena-georgia","biography":"\u003cp\u003eCiao! I’m Elena (Eh-luh-nah), a first-year student in the Dual BA program between Trinity College Dublin and Columbia University. I’m currently studying Middle Eastern and European Languages and Cultures at Trinity, and I’ll complete my second degree in Political Science at Columbia, where I also plan to pursue a minor in Dance. I help students turn multiple interests into a standout project that actually feels like them. I’ll also be working in Greece this summer, so keep the time difference in mind ;) But I’m still available and happy to coordinate times that work well for us!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI grew up between cultures, speaking Italian as my first language and learning English along the way. In high school, I explored this global perspective through a range of projects and leadership roles:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eLed a \u003cstrong\u003e7-part research project on the Roma community in Europe\u003c/strong\u003e, including surveys in the U.S. and Italy, presentations across communities, and research on discrimination and policy gaps.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSpent three years in Model UN, earning verbal commendations and later helping organize my school’s first conference, where I served as an \u003cstrong\u003eAssistant Chair for a WHO debate on vaccine distribution.\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrought \u003cstrong\u003eSpeak Truth\u003c/strong\u003e, an inter-school dialogue initiative, to my high school, facilitating conversations on complex topics with students across the DC, Maryland, and Virginia area.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelped \u003cstrong\u003edouble the size of my student-run dance team (FATA Morgana)\u003c/strong\u003e and co-led performances, managing choreography, creative direction, fundraising, and logistics.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOrganized and performed at a \u003cstrong\u003e200+ person DJ event\u003c/strong\u003e, handling networking locally and full event production.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI know what it feels like to have several interests and try to see how to execute them further. That's what I'd love to help students with. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eResearch projects (especially in social science, culture, identity, and global issues)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStarting initiatives or organizations (from idea → structure → execution)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEvent creation and leadership projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreative and interdisciplinary projects (combining writing, design, presentation, or performance)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also really enjoy working with international and multicultural students. Having navigated different languages, education systems, and cultures myself, I can help you turn that global perspective into a real strength.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eBeyond my own projects, I’ve spent a lot of time working directly with students:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTeaching assistant at the \u003cstrong\u003eItalian Cultural Institute\u003c/strong\u003e and summer camp counselor, working with young children\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMentor through my school’s \u003cstrong\u003eCommunity Leadership Corps\u003c/strong\u003e, supporting younger high school students and organizing school-wide events\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching assistant in a school in \u003cstrong\u003eGhana\u003c/strong\u003e, working across language and cultural differences\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences taught me how to adapt my mentoring style to different students, from teaching in Italian immersion settings to working with high schoolers and supporting students who don’t speak English.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA few fun facts about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I’m usually dancing, traveling (especially hunting cheap Ryanair flights), or discovering new music. I also am still learning how to DJ, so I’m always looking for songs that can actually move a room.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m a big believer that you don’t have to fit into one box. You can be analytical, creative, social, and global all at once. I love helping students build projects that reflect exactly that.\u003c/p\u003e","teachingVideoPlaybackId":"DZu02Qdwecr7oGB7PNNR5qpqJKp7Ir7IoK00xcnXqz1MQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Middle Eastern and European Languages and Cultures (MEELC)/ Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"39db84d7-da24-4f6d-b1f6-8f7358784028\"}"},{"__ref":"DeepDives:{\"uuid\":\"db5787f3-9f0b-4e57-9dbf-b7c2a5ee4d1d\"}"},{"__ref":"DeepDives:{\"uuid\":\"7d807ca8-046c-4c57-821d-bdd406bcdcc7\"}"},{"__ref":"DeepDives:{\"uuid\":\"60bd8978-b9bd-4e4e-a019-a6577878faff\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/688c2ef8-2736-4e2a-9eaa-e2cc586a5bfa/-/preview/-/format/jpg/","https://ucarecdn.com/e888b5bd-7288-4700-8307-6b2fce8318cd/-/preview/-/format/jpg/","https://ucarecdn.com/53befd9b-77ab-400b-9188-781013500ea8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0fca1a08-ffdd-43bb-a9be-43f9f08c2773\"}"},{"__ref":"Education:{\"uuid\
