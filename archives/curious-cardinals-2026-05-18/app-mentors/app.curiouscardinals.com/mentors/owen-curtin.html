xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d0d54831-c3f0-4e3d-8cdf-1c80045f56f4\"}":{"__typename":"Favorites","uuid":"d0d54831-c3f0-4e3d-8cdf-1c80045f56f4","photoUrl":"https://ucarecdn.com/29ea8218-4f30-4274-a111-8822d913a1ea/","title":"To the Lighthouse by Virgina Woolf","type":"BOOK"},"Favorites:{\"uuid\":\"284af68e-2867-4dd8-aa38-4cf8b60adbf9\"}":{"__typename":"Favorites","uuid":"284af68e-2867-4dd8-aa38-4cf8b60adbf9","photoUrl":"https://ucarecdn.com/ab94e701-5802-4757-b7c1-07c5329595c3/","title":"Melodrama by Lorde","type":"ALBUM"},"CausesSupported:{\"uuid\":\"b6c79c40-c570-4308-83e4-284699479fc7\"}":{"__typename":"CausesSupported","uuid":"b6c79c40-c570-4308-83e4-284699479fc7","name":"Urban Improvement Corps","description":"","photoUrl":""},"CausesSupported:{\"uuid\":\"7f231457-05df-455b-98f0-1a1d6de2db5a\"}":{"__typename":"CausesSupported","uuid":"7f231457-05df-455b-98f0-1a1d6de2db5a","name":"Environmental Working Group ","description":"","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"fc400404-ac13-4975-956e-8216a8dddba7\"}":{"__typename":"DeepDives","uuid":"fc400404-ac13-4975-956e-8216a8dddba7","content":"\u003cp\u003eBe louder! In high school, I was also so scared to speak up for fear of being judged. It's natural, of course, but I don't think it's all that helpful. I often feel most like myself when I'm talking, when I'm with others and sharing ideas. I would tell myself to embrace it! Do the things that make you feel like yourself. I found, towards the end of high school, that being louder made me stand out, that it helped me find my voice and inspire others to do the same. I think we should all feel empowered to share our stories with others. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1247226d-c302-4b60-90ab-d1b523c895ba\"}":{"__typename":"DeepDives","uuid":"1247226d-c302-4b60-90ab-d1b523c895ba","content":"\u003cp\u003eMentorship is like a shovel or a flashlight, and it's not fun digging in the dark alone.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up with a lot of siblings, but paradoxically, I didn't have a lot of support from them. I felt that I had to carve my own path for fear of being left behind or drowned out in the chaos of it all. So my various mentors, namely my first-grade teacher who taught me how to read (in 5th grade... I was vaguely illiterate for far too long as a child), showed me how to carve my path. I am forever grateful to them for giving me the tools I use every day to succeed. \u003cbr\u003e\u003cbr\u003eI hope to give others those same tools, or at least show others how to find them. I want to pass on the shovel and flashlight.   \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"186abb58-9bae-43bc-b4ce-0afcc7ed8905\"}":{"__typename":"DeepDives","uuid":"186abb58-9bae-43bc-b4ce-0afcc7ed8905","content":"\u003cp\u003eI had a dream once, when I was very little, that I owned a coffee shop in Stockholm, Sweden. I have never been there, nor do I speak Swedish, but I hope to open that coffee shop. It will be a two-story building with a red brick exterior and big bay windows. I will live on the second floor above it, and every day I will pour coffee for my  community. I will also sell lamps. All of the lighting in the store will be from lamps made by local artists. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"56d0eaab-567f-4953-a7e0-c1ee1251b380\"}":{"__typename":"DeepDives","uuid":"56d0eaab-567f-4953-a7e0-c1ee1251b380","content":"\u003cp\u003eOriginally, I was a Chemistry major. I wanted to work in a lab and get a master's in material science. And for a while, I did work in a lab, both at Yale and at Boise State University (where I'm from). I found it very isolating and mundane. The projects were cool, but the day-to-day was boring. I also found the chemistry department at my school unnecessarily bureaucratic. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs part of my liberal arts degree, I had to take a writing class. An upperclassman recommended me an Anthropology class , which they said \"changed their life.\" Turns out, it changed mine, too. It was an incredible class on the linguistics of place and how different people/languages/cultures perceive of place. I fell in love. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI decided to abondan chemistry and the stuffyness of the lab, and instead to work WITH people. So I decided to major in Anthropology. To study others and learn more about myself along the way. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut social sciences, at least to me, can feel abstract without a way to actualize them. And I orginally wanted to study chemistry to do material science with a focus on making buildings more eco-friendly, so I added Envrionmental Science. I have found it to be the perfect way to actualize what I learn in Anthro calsses. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"a2e0c4a0-8a51-4e30-b8fd-cbbc08341c68\"}":{"__typename":"School","uuid":"a2e0c4a0-8a51-4e30-b8fd-cbbc08341c68","name":"Boise High School","city":"Boise","type":"HIGH","state":"Idaho","country":"United States","zip":"83702"},"Education:{\"uuid\":\"369f5ddc-6467-4595-9c66-fb3eea77635e\"}":{"__typename":"Education","uuid":"369f5ddc-6467-4595-9c66-fb3eea77635e","school":{"__ref":"School:{\"uuid\":\"a2e0c4a0-8a51-4e30-b8fd-cbbc08341c68\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"82041d02-d638-4215-aee3-14fdec57612d\"}":{"__typename":"Education","uuid":"82041d02-d638-4215-aee3-14fdec57612d","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Environmental Science","degree":null},"MentorPublicProfile:{\"uuid\":\"202f313e-d823-4a01-abfc-7d171e00b8a2\"}":{"__typename":"MentorPublicProfile","uuid":"202f313e-d823-4a01-abfc-7d171e00b8a2","displayName":"Owen C.","slug":"owen-curtin","biography":"\u003cp\u003eHi,\u003c/p\u003e\u003cp\u003eMy name is Owen, and I'm going to be a senior at Yale studying Anthropology and Environmental Science. I am originally from Boise, Idaho, and I surprised myself by ending up on the East Coast. That's because from the time that I was little, I always gravitated towards the mountains (of which the East Coast is sorely lacking). I grew up in the mountains biking and rafting, always surrounded by pine forests. It's something I miss every now and then. I think that's partly the reason I ended up studying Environmental Science, it's a way for me to feel connected—even if only intellectually—with my past. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat past has shaped me in many ways, but most precisely in how I work and what I believe. I grew up going to public schools filled with disintreste students (to no fault of their own, the Idaho pulic school system is one of the worst funded in the U.S.) in a culture that often prioritized athletics over all else. Part of this had to do with the poltics of where I lived—most people weren't too fond of education, let alone higher education. It was there, in a place that I found joy and comfort on the peaks of mountains, but also a deeply isolating sense of value for learning that was often ridiculed, that I learned how to work hard. It taught me that hard work means doing things that make you uncomfortable, that defy expectation. It also taught me to believe in myslef above all else! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBack in Idaho, I also learned how to make my voice heard, even when it was uncomfortable. In high school, I wrote an opinion piece opposing Idaho's House Bill 249, which would have restricted discussions of sexuality and gender in public schools. What started as a  distraction during an ordinary English class turned into published articles in the Idaho Education News and Idaho Statesman, and eventually led to me testifying before the Idaho Senate. None of this would have happened unless my English teacher at the time encouraged me, and allowed me to skip class to testify. Standing alone at that podium, facing skepticism simply because of my age, reinforced what I'd learned growing up—that sometimes the most important conversations happen when people are uncomfortable, and that young voices deserve to be heard. And while I may have stood alone, I was supported by my teacher and others who say the promise in my voice. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think constantly about my first-grade teacher who taught me how to read after I fell behind later in school. I spent hours in her classroom, sitting in those small desks, trying to graps the letters. Without her patience, I would have never been able to write those articles, or testify, or make my way to Yale. I think about my chemistry teacher in high school who was more like a father figure to me than most, who taught me stoichiomotry and how to ask for help. I think about my professors now, my thesis advisors who have helped me created a mountain of books I hope to finish by the end of year. I am so fortuante to be able to see mountains of knowledge and be excited, and to have help scaling them. All these people, their investment in me shaped not just my academic path, but my understanding of what it means to truly see potential in someone. It continues to shape me. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow I want to do the same for others. I started the writing center at my high school because I knew firsthand how transformative one-on-one instruction could be. Here at Yale, I volunteer as a tutor at underfunded New Haven schools because I know exactly what funding cuts and lack of individual attention does to students—I lived it. I also lead weekly volunteer shifts at a soup kitchen because I've learned that education isn't the only thing that matters; students can't focus on learning when their basic needs aren't met. My approach to tutoring comes from this holistic understanding—I work with students on everything from college essays to research methods, but I'm equally focused on helping them find their authentic voices and feel confident in their unique perspectives. I now that perosnal history can be the jumping off point, and that it can be a pool of quick sand that sucks others down. I hope to create the former, and help those stuck in the latter. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond all this, I'm still a normal 20-year-old. When I'm not studying or tutoring, you'll find me exploring the 'mountains' of the East Coast, reading everything from anthropological theory to environmental policy, or planning my next research project that bridges human behavior and environmental challenges. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm excited to work with Curious Cardinals because I believe the best learning happens when students feel seen, heard, and empowered to think critically about the world around them—just like those teachers did for me. \u003c/p\u003e","teachingVideoPlaybackId":"icGsVR3ZT00s4NrSkUjhCVPTy1XXcv16c00yhQepDUVZM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d0d54831-c3f0-4e3d-8cdf-1c80045f56f4\"}"},{"__ref":"Favorites:{\"uuid\":\"284af68e-2867-4dd8-aa38-4cf8b60adbf9\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b6c79c40-c570-4308-83e4-284699479fc7\"}"},{"__ref":"CausesSupported:{\"uuid\":\"7f231457-05df-455b-98f0-1a1d6de2db5a\"}"}],"major":"Environmental Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fc400404-ac13-4975-956e-8216a8dddba7\"}"},{"__ref":"DeepDives:{\"uuid\":\"1247226d-c302-4b60-90ab-d1b523c895ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"186abb58-9bae-43bc-b4ce-0afcc7ed8905\"}"},{"__ref":"DeepDives:{\"uuid\":\"56d0eaab-567f-4953-a7e0-c1ee1251b380\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b5643243-e5be-4bc5-8cb3-c4c79c81c323/-/preview/-/format/jpg/","https://ucarecdn.com/d0fcd507-294e-4519-a833-194a7a55bbd8/-/preview/-/format/jpg/","https://ucarecdn.com/97473dbe-9129-4ea9-a359-95b59372ae37/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"369f5ddc-6467-4595-9c66-fb3eea77635e\"}"},{"__ref":"Education:{\"uuid\":\"82041d02-d638-4215-aee3-14fdec57612d\"}"}],"hiredAt":"2025-05-29T15:30:39.682Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","K-5 Grade Math","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Creative Writing","History Project","Video / Photography","Business / Entrepreneurship","Web Design","STEM Project","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"owen-curtin\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"202f313e-d823-4a01-abfc-7d171e00b8a2\"}"}}},"_sentryTraceData":"f8d6930ea4804cefada2208f185cc548-be790a7dd8fb880c-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f8d6930ea4804cefada2208f185cc548,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"owen-curtin"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript
