epDives:{\"uuid\":\"1e5336f8-9df7-4d49-b197-d795d6fa12c2\"}":{"__typename":"DeepDives","uuid":"1e5336f8-9df7-4d49-b197-d795d6fa12c2","content":null,"videoPlaybackId":"r02NL7qreKfrngn1AJqFFzZkw2GY1Oco022nA00fDK00CEs","question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4da9713c-0c73-40d7-967f-18db95748e2a\"}":{"__typename":"DeepDives","uuid":"4da9713c-0c73-40d7-967f-18db95748e2a","content":null,"videoPlaybackId":"qpvjfEsxqTJSK00Z27HoCRGkxIOBnmo6M4JCg00HFeEmU","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"c3cb6d9c-785e-49ec-b91c-c16587c6e467\"}":{"__typename":"School","uuid":"c3cb6d9c-785e-49ec-b91c-c16587c6e467","name":"The Overlake School","city":"Redmond","type":"HIGH","state":"Washington","country":"United States","zip":"98053"},"Education:{\"uuid\":\"b7862bd6-0a49-4b88-b289-050f19c0d7fa\"}":{"__typename":"Education","uuid":"b7862bd6-0a49-4b88-b289-050f19c0d7fa","school":{"__ref":"School:{\"uuid\":\"c3cb6d9c-785e-49ec-b91c-c16587c6e467\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"0fab6943-bbb7-4998-aa46-a61d7280074a\"}":{"__typename":"Education","uuid":"0fab6943-bbb7-4998-aa46-a61d7280074a","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"eaf3adbd-1673-4127-98fb-42ff2f7f10e7\"}":{"__typename":"MentorPublicProfile","uuid":"eaf3adbd-1673-4127-98fb-42ff2f7f10e7","displayName":"Anirudh S.","slug":"anirudh-sridharan","biography":"\u003cp\u003e\u003cstrong\u003eAnirudh Sridharan (Academic Mentorship and Passion Project\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi everyone! My name is Anirudh Sridharan, and I am an undergraduate student at Columbia University, studying Computer Science and Applied Math. I help students learn STEM subjects, build apps and projects, conduct CS research, and guide them with any College Essay Writing they need.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eAbout me:\u003c/u\u003e\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI am originally from Seattle, WA (Go Hawks!) and graduated from The Overlake School in 2025.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI am currently studying CS at Columbia Engineering, where I do research on Large Language Model theory, and build my own startups.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eMy Highschool Experience:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I spent a lot of my time bouncing between STEM subjects, from Mechanical and Aerospace Engineering, to Physics, Math, and ultimately Computer Science, and have explored activities and completed projects in many fields. Here are some of the activities that I did in high school!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWorked at a small Tech startup building industry-level code.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePublished a research paper in IEEE, combining my favorite passions: Baseball and CS!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCompeted in Robotics and Aerospace Engineering competitions.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePlayed baseball and the Alto Saxophone.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTaught Taekwondo and MMA.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eWhat I specialize in:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMiddle and High School STEM courses such as Algebra I - Multivariable Calculus, Computer Science, Physics, Chemistry.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCollege Application and Essay planning.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStudents who want to combine their passions for a comprehensive project.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eApplied Computer Science research.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eApp/Startup development.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTime management and study strategies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eWhy I'm qualified to mentor you:\u003c/u\u003e\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have been mentoring and teaching students of different ages and types for around five years. I've taught numerous subjects to students including Algebra II, Computer Science, and AP Chemistry. I have also taught Taekwondo for over four years to students ranging from 4-year-olds, to adults. Additionally, as a student with ADHD, I have spent significant time developing strategies to master academic performance, and have taught and advocated for students with learning differences.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eA fun and engaging lesson on topics you might struggle with.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDrafting ways to convert your passions and interests into a tangible project.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDeveloping actionable plans with exact deadlines to complete a project.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eOutside of Academics:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I LOVE watching and playing sports. Some of my favorite sports are include Baseball, American Football, and Martial Arts. In my free time I'll always be outside, where you can find me at a Golf course or a park (the nature around Seattle is beautiful). I love watching movies, and know almost every fact about Marvel and Star Wars.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI'm super excited to meet you, and I know that we can build and learn incredible things!\u003c/p\u003e","teachingVideoPlaybackId":"jtq6mrCoGamx02004KI7rDs1KAAhySOZO6c99Kf7Q5o7k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2df6541d-83cd-4bd8-806d-422e2fcc1073\"}"},{"__ref":"Favorites:{\"uuid\":\"a8594ba9-fab5-4107-8eb2-b5ffd4476ae5\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ffd1d1ae-a6cc-4dbb-8130-8a24d088f3d7\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec165045-12ab-4c97-b07f-b80fa587ea20\"}"},{"__ref":"DeepDives:{\"uuid\":\"1e5336f8-9df7-4d49-b197-d795d6fa12c2\"}"},{"__ref":"DeepDives:{\"uuid\":\"4da9713c-0c73-40d7-967f-18db95748e2a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9a4cd607-39e1-426b-8676-17eeb76fe4da/-/preview/-/format/jpg/","htt
