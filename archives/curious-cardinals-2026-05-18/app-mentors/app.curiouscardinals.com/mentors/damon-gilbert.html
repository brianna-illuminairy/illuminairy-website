xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2dfc229d-90f6-4e18-b187-d735c3cfeae0\"}":{"__typename":"Favorites","uuid":"2dfc229d-90f6-4e18-b187-d735c3cfeae0","photoUrl":"https://ucarecdn.com/5617d090-1bf2-4140-b134-82e37c6d3dbb/","title":"Manchester United","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"f814aeab-d3e1-4d7b-861b-635c4d364afe\"}":{"__typename":"Favorites","uuid":"f814aeab-d3e1-4d7b-861b-635c4d364afe","photoUrl":"https://ucarecdn.com/5617d090-1bf2-4140-b134-82e37c6d3dbb/","title":"Soccer/Futbol","type":"SPORT"},"Favorites:{\"uuid\":\"d6922a45-9d93-4b4e-aa1e-51895357880b\"}":{"__typename":"Favorites","uuid":"d6922a45-9d93-4b4e-aa1e-51895357880b","photoUrl":"https://ucarecdn.com/5617d090-1bf2-4140-b134-82e37c6d3dbb/","title":"Enter the Dragon","type":"MOVIE"},"CausesSupported:{\"uuid\":\"7dbd742f-9644-443a-99d0-a5ef1b98f4f2\"}":{"__typename":"CausesSupported","uuid":"7dbd742f-9644-443a-99d0-a5ef1b98f4f2","name":"WE ACT","description":"\u003cp\u003eVolunteer for environmental justice campaigns.\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"0bfa089a-8fb0-4de5-b76a-d13dcce005b4\"}":{"__typename":"CausesSupported","uuid":"0bfa089a-8fb0-4de5-b76a-d13dcce005b4","name":"Brooklyn Eviction Defense","description":"\u003cp\u003eVolunteer in protesting unjust eviction movements. \u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"298acb5b-047e-42bc-913f-09795bb396a3\"}":{"__typename":"DeepDives","uuid":"298acb5b-047e-42bc-913f-09795bb396a3","content":"\u003cp\u003eIdeally, I aim to one day develop programs that give children and families in inner city areas, which historically have much less access to clean and healthy environments, proper access to nature! There is so much beauty and knowledge that we can experience in nature, and it has always been a goal of mine to give those without the privilege of having access to nature in their lived environment the opportunity to explore our planet! Whether that be through summer camps, funded school trips, or other community organizational work, giving children from all walks of life the chance to connect with their natural environment is a job I would truly love to have. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"03fcf2ba-f344-422f-b846-2308c792173b\"}":{"__typename":"DeepDives","uuid":"03fcf2ba-f344-422f-b846-2308c792173b","content":"\u003cp\u003eI was an incredibly shy high school student! I have pretty strong ADHD, which often left me very distracted during class and conversations in large groups, so I had a bit of a hard time talking to people in and out of class. I enjoyed making friends through extracurriculars like sports and clubs, but in my everyday life I kept to myself and often read my books (I always carried two with me) in the library during lunch! This helped me become a lot more comfortable with myself, however, and now that I have a better understanding of how my brain operates both socially and educationally, I am much more comfortable speaking and operating in large group settings! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4128f694-3fcd-4f7b-ab9d-f460a91bd30b\"}":{"__typename":"DeepDives","uuid":"4128f694-3fcd-4f7b-ab9d-f460a91bd30b","content":"\u003cp\u003eI spend a lot of my spare time outside with my dog! He's a pretty active guy, so I often take him on runs to the park where I can read or play soccer while he gets his energy out. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love writing poetry when the inspiration hits me, as well as taking pottery classes! It's a goal of mine to make all of my own kitchen ware and interior decor by hand, and I have a long way to go!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"ec38620c-b2d4-46b2-ba61-cabac250bb17\"}":{"__typename":"DeepDives","uuid":"ec38620c-b2d4-46b2-ba61-cabac250bb17","content":"\u003cp\u003eMy summers in high school were all outdoors! I worked as a lifeguard and children's swim teacher, and volunteered as a soccer coach for children with disabilities. My family also used to a reading competition over the summers to see who could read the most books, so when I wasn't working or playing I was usually under some tree with a book!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"590b9eeb-e0a1-4510-a12c-4f497caea6f3\"}":{"__typename":"School","uuid":"590b9eeb-e0a1-4510-a12c-4f497caea6f3","name":"Pioneer High School","city":"Ann Arbor","type":"HIGH","state":"Michigan","country":"United States","zip":"48103"},"Education:{\"uuid\":\"3deb605c-677e-47ae-bfdb-c1d13f3aab24\"}":{"__typename":"Education","uuid":"3deb605c-677e-47ae-bfdb-c1d13f3aab24","school":{"__ref":"School:{\"uuid\":\"590b9eeb-e0a1-4510-a12c-4f497caea6f3\"}"},"startYear":"2011","endYear":"2015","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"da6e2e0b-f264-45f2-a3f0-b187c8ad14b5\"}":{"__typename":"School","uuid":"da6e2e0b-f264-45f2-a3f0-b187c8ad14b5","name":"NYU School of Law","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10011"},"Education:{\"uuid\":\"c393461a-02ed-4bdd-9513-5cee41427372\"}":{"__typename":"Education","uuid":"c393461a-02ed-4bdd-9513-5cee41427372","school":{"__ref":"School:{\"uuid\":\"da6e2e0b-f264-45f2-a3f0-b187c8ad14b5\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2023","major":"Law","degree":null},"MentorPublicProfile:{\"uuid\":\"f8d3f22b-f0c1-43af-9962-156ef38e27b4\"}":{"__typename":"MentorPublicProfile","uuid":"f8d3f22b-f0c1-43af-9962-156ef38e27b4","displayName":"Damon G.","slug":"damon-gilbert","biography":"\u003cp\u003e“Without community, there is no liberation, only the most vulnerable and temporary armistice between an individual and her oppression.” – Audre Lorde\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eHello! My name is Damon Gilbert, and I am a recently graduated African American student from the New York University School of Law, where I focused on environmental and racial justice.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThroughout my educational career, I have found the most profound learning opportunities often come from experiences that can be supported by a community that can provide proper guidance and context. Additionally, as a minority student with ADHD, I have a strong appreciation for the depth that personal observations and social interactions can bring to a learning experience.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eMy educational fascination lies in the systems of our society and how they affect our everyday lives. Throughout the course of my time in undergrad and law school I was very politically engaged. I was an active member of both the black law student association as well as multiple environmental advocacy groups, where I helped lead both legislative and legal campaigns to protect disadvantaged populations in New York City. I have been an active participant in a number of governmental working groups centering around environmental justice and civil rights, and have ample experience analyzing, discussing, and distilling complex legal and political issues and solutions with a wide variety of individuals who may be interested.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eOutside of my educational engagements, I am active in a number of community groups in my neighborhood. I’m a big believer in the power and healing that our natural environment provides, and as such am a volunteer with my local community garden and its connected environmental justice group!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am also a passionate member of my neighborhood ceramics studio and an avid soccer player and dog runner! In my downtime, I’m a big fan of creative writing as well as reading manga, science fiction, and mystery novels!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs a very active learner and teacher, I can guarantee that your child will have the opportunity to be fully immersed and engaged in whatever subject or project we tackle. I understand how challenging learning via solely static lectures can be, which is why I aim to teach through real world scenarios and thought experiments. These active connections will fuel a deeper understanding, and hopefully enflame my mentees’ passion for their subjects. I look forward to connecting with you!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"gfBN3VxlA02IcuJfaYNXYDKQbcZjHYn2AdqSphUVnfH8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2dfc2
