xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"20bccfa2-b5c3-4296-8e14-d0eb33e56c81\"}":{"__typename":"Favorites","uuid":"20bccfa2-b5c3-4296-8e14-d0eb33e56c81","photoUrl":"https://ucarecdn.com/f06753e1-d885-471c-8920-b1b17fb4305e/","title":"Harrison Ford","type":"ACTOR"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"28c64bfc-df52-4e7e-9e9d-6293cb5e28b5\"}":{"__typename":"DeepDives","uuid":"28c64bfc-df52-4e7e-9e9d-6293cb5e28b5","content":"\u003cp\u003eI got into 3D printing back in high school when I was trying to build a nitrogen filter prototype for a science fair project and needed a way to fabricate custom parts from cellulose acetate pellets I was melting down in my basement. What started as a necessity turned into something I genuinely enjoy doing in my free time. There is something satisfying about going from a CAD model on a screen to holding a real physical object a few hours later. I have used it for everything from small household fixes to prototyping parts for my engineering work at Cornell. It is one of those hobbies where I am always learning something new, whether that is dialing in print settings or experimenting with different materials.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c1f9ccd0-d255-45c2-a409-edba57dd8350\"}":{"__typename":"DeepDives","uuid":"c1f9ccd0-d255-45c2-a409-edba57dd8350","content":"\u003cp\u003eRight now I am teaching myself to code with the goal of building a startup that protects people from identity theft after losing a loved one. It is a problem most people do not think about until it happens to them, but deceased individuals are surprisingly vulnerable to having their identities stolen, and families are usually too overwhelmed with grief to catch it. I want to build a platform that automates that protection process so families do not have to worry about it during the worst time of their lives. My computer science minor at Cornell has given me a foundation, but I spend a lot of my free time going beyond coursework, learning full-stack development and reading about security infrastructure on my own. It is the kind of project where the more I learn, the more I realize how much I can actually build.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"51ba42d1-5136-45cd-a7c0-ddf875af2bdf\"}":{"__typename":"DeepDives","uuid":"51ba42d1-5136-45cd-a7c0-ddf875af2bdf","content":"\u003cp\u003eMy high school summers were all about traveling and making memories with the people closest to me. My family and I visited a ton of places, from Dubai and India to Italy, France, Switzerland, Germany, Spain, Portugal, Mexico, and Canada. Each trip gave me a completely different perspective on how people live, what they value, and how communities are built. Some of my favorite memories are honestly just the small moments, walking through random streets in a new city with my family or trying food I had never heard of before. Those summers taught me to be curious about the world and comfortable in unfamiliar places, which has shaped how I approach pretty much everything now.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0ea8788c-6607-4294-9d35-8250140c7f73\"}":{"__typename":"DeepDives","uuid":"0ea8788c-6607-4294-9d35-8250140c7f73","content":"\u003cp\u003eWhen I was fourteen, I saw algae choking Cabin John Stream below a storm drain near my house and could not let it go. I ended up building a cellulose acetate filter prototype in my basement, 3D printing it from pellets I melted down myself, and that project won me a Battelle Climate Change grant and recognition from the EPA and NOAA. That experience showed me that engineering could be pointed directly at environmental problems I cared about, and it pulled me toward biological engineering specifically. My research at the NIH on retinal disease and at Sanaria on malaria vaccines deepened that interest, and now my work with AguaClara at Cornell building gravity-powered wastewater treatment systems feels like a direct continuation of what started at that stream. Biological engineering gives me the tools to solve real environmental and health problems with science that actually reaches people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"9fe36390-ecf2-4193-b72f-dc707dc14323\"}":{"__typename":"School","uuid":"9fe36390-ecf2-4193-b72f-dc707dc14323","name":"Winston Churchill High School","city":"Potomac","type":"HIGH","state":"Maryland","country":"United States","zip":"20854"},"Education:{\"uuid\":\"8b6c8063-6475-4a69-b061-1941e9b2dec5\"}":{"__typename":"Education","uuid":"8b6c8063-6475-4a69-b061-1941e9b2dec5","school":{"__ref":"School:{\"uuid\":\"9fe36390-ecf2-4193-b72f-dc707dc14323\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"f6c99573-4151-4a2a-bfa0-a246e3f5af9e\"}":{"__typename":"Education","uuid":"f6c99573-4151-4a2a-bfa0-a246e3f5af9e","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Bioengineering","degree":null},"MentorPublicProfile:{\"uuid\":\"e3dec344-3dd2-4a21-866b-e9afcb2c9885\"}":{"__typename":"MentorPublicProfile","uuid":"e3dec344-3dd2-4a21-866b-e9afcb2c9885","displayName":"Ishaan S.","slug":"ishaan-samantray","biography":"\u003cp\u003eI am a first-year Biological Engineering student at Cornell with a minor in Computer Science. My interest in science started early. In freshman year of high school, I worked on a project developing a theoretical cure for age-related macular degeneration and won $1,000 in the eCybermission Maryland Challenge. That experience lit something in me. It showed me that I could actually contribute to solving real health problems, and it motivated me to keep pursuing scientific research from that point forward.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat motivation led me to the NIH National Eye Institute, where I worked on retinal disease imaging and contributed to LipidUNet, an AI-powered tool for analyzing retinal cell images. Working in a real lab environment showed me how biology and technology come together to tackle problems that affect millions of people, and it deepened my commitment to biological engineering as a career path.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Cornell, I am on the UASB subteam of AguaClara, where we design gravity-powered wastewater treatment systems. My work focuses on coding, controls, and integrating pressure sensors into our anaerobic reactor systems. I am also an analyst in Impact Investing at Cornell, where I do valuation modeling and financial statement analysis. I wanted that experience because biological engineering does not come with a finance curriculum, and if I ever want to build something of my own, I need to understand how businesses get funded and evaluated.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school, I founded Kids For Code, a nonprofit that has brought free computer science classes to over 4,000 students across 37 states and 11 countries. Teaching kids to code gave me the same feeling I got tutoring over 175 students at Spidersmart across subjects like reading, writing, and math. Both experiences showed me that the most rewarding work comes from helping someone else get better at something, and that pushing through the tough moments with a student is where the real growth happens on both sides.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne thing that carries across everything I do is how I approach problems. I have a step-by-step process where I break a big problem down into smaller sub-problems, work on solutions for each piece individually, and then combine everything together at the end. Whether I am debugging a sensor integration issue for AguaClara, building a financial model for IIC, or planning a curriculum for Kids For Code, the approach is the same. I find that tackling things piece by piece keeps me from getting overwhelmed and usually leads to a better result than trying to solve everything at once. It is something I picked up naturally from years of research and coding, and at this point it is just how my brain works.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI care about building things that solve real problems for real people, whether that is a treatment, a coding class, or whatever comes next.\u003c/p\u003e","teachingVideoPlaybackId":"N7zGiEzJKGrU1HYtQ2zNYd007H3iEjubdx01C8jl2xgDA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'm proud of the time I taught a first-grader named Dayanna how to speak and read English. I was tutoring at Academic Pathways and had no idea what I was walking into. Her mom wanted her to learn English from scratch, and all I had was three years of high school Spanish. My first instinct was to pass her off to someone more qualified, but nobody else was available. So I grabbed a picture book, \u003cem\u003eBig Red Apple\u003c/em\u003e, and we got to work. That first session, we spent ten minutes on a single sentence. I would say the words in Spanish, she would try them in English. \"The... tree... was... full.\" It was slow. But she was trying so hard, and I realized I had to match that energy. I started watching movies and reading articles in Spanish on my own time just to keep up with her.\u003c/p\u003e\u003cp\u003eThree weeks later, she finished the book out loud with a huge smile on her face. That moment honestly meant more to me than any award I have gotten. It proved that I could figure things out even when I felt completely unprepared.\u003c/p\u003e\u003cp\u003eThat experience changed how I approach everything. It pushed me to keep learning Spanish. The work ethic I built tutoring Dayanna carried directly into organizing those classes and working one-on-one with students. Dayanna is in the fourth grade now, speaking English fluently. I'm proud of her, but I'm also proud that I didn't back down when I had every reason to.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"20bccfa2-b5c3-4296-8e14-d0eb33e56c81\"}"}],"causesSupported":[],"major":"Bioengineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"28c64bfc-df52-4e7e-9e9d-6293cb5e28b5\"}"},{"__ref":"DeepDives:{\"uuid\":\"c1f9ccd0-d255-45c2-a409-edba57dd8350\"}"},{"__ref":"DeepDives:{\"uuid\":\"51ba42d1-5136-45cd-a7c0-ddf875af2bdf\"}"},{"__ref":"DeepDives:{\"uuid\":\"0ea8788c-6607-4294-9d35-8250140c7f73\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a38e456d-a461-47ae-adaa-81867080ae14/-/preview/-/format/jpg/","https://ucarecdn.com/f1f6193d-e1e2-41c1-8d97-fd7a7c647aed/-/preview/-/format/jpg/","https://ucarecdn.com/7ed1a851-e8f2-438b-acc0-5e2e21c23d68/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8b6c8063-6475-4a69-b061-1941e9b2dec5\"}"},{"__ref":"Education:{\"uuid\":\"f6c99573-4151-4a2a-bfa0-a246e3f5af9e\"}"}],"hiredAt":"2026-03-17T01:32:16.981Z","topics":["Creative Writing","History Project","Sports Journalism","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Game Design","Machine Learning / AI","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Web Design","Debate","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ishaan-samantray\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e3dec344-3dd2-4a21-866b-e9afcb2c9885\"}"}}},"_sentryTraceData":"61ea92762106436bb943f79aefe2a3e1-a9e05f764eeeefc6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=61ea92762106436bb943f79aefe2a3e1,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ishaan-samantray"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.g
