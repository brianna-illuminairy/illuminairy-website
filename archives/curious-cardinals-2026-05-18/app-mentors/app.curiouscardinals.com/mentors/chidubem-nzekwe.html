xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3799916b-258d-4412-bd8a-7f2757e5d557\"}":{"__typename":"Favorites","uuid":"3799916b-258d-4412-bd8a-7f2757e5d557","photoUrl":"https://ucarecdn.com/b7199e32-badd-4c3c-840f-fca790954dfd/","title":"Jamal Musiala","type":"ATHLETE"},"Favorites:{\"uuid\":\"8444dd19-b4d9-4cc1-9810-ac2d323c0c45\"}":{"__typename":"Favorites","uuid":"8444dd19-b4d9-4cc1-9810-ac2d323c0c45","photoUrl":"https://ucarecdn.com/f9bd817f-c8d3-436f-99ee-350d0e2ec96c/","title":"Percy Jackson:The Last Olympian","type":"BOOK"},"Favorites:{\"uuid\":\"ac6b4d9f-057f-43aa-8979-58364adb6bda\"}":{"__typename":"Favorites","uuid":"ac6b4d9f-057f-43aa-8979-58364adb6bda","photoUrl":"https://ucarecdn.com/7d14481d-e6c7-49c2-99fb-bd9229feb108/","title":"Kigali, Rwanda","type":"CITY"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"04757f7f-dfb9-4957-a53e-ea60ac7461af\"}":{"__typename":"DeepDives","uuid":"04757f7f-dfb9-4957-a53e-ea60ac7461af","content":"\u003cp\u003eIn my free time, I like to get together with friends and play pick-up soccer, basketball, or ultimate frisbee. I also enjoy reading or catching up on a good tv show.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"49a8ff01-fbe1-4464-a258-40745b0d4354\"}":{"__typename":"DeepDives","uuid":"49a8ff01-fbe1-4464-a258-40745b0d4354","content":"\u003cp\u003eAs a Nigerian-American, I was raised to prioritize hard work and discipline, especially in academics. My heritage and upbringing have shaped my teaching style by emphasizing repetition, consistency, and depth of understanding rather than shortcuts or surface-level learning. I strive to instill the same values of perseverance and strong work ethic in my students, encouraging them to fully engage with the material and build lasting mastery.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e327a71e-416a-46dd-aca5-bb951b9d1d46\"}":{"__typename":"DeepDives","uuid":"e327a71e-416a-46dd-aca5-bb951b9d1d46","content":"\u003cp\u003eI have a deep passion for understanding how social determinants of health affect quality and access to healthcare. History of Science, Medicine, and Public Health allows me to explore the history of our healthcare system and its effects on various populations. This knowledge will not only help me understand how our current healthcare system works, but also how it can be improved for everyone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"458f8978-e5b0-4114-b40e-53c4f0c2be55\"}":{"__typename":"DeepDives","uuid":"458f8978-e5b0-4114-b40e-53c4f0c2be55","content":"\u003cp\u003eMentors help to shape, inspire, and change the lives of their mentees. Without my mentors, who pushed me past my limits and showed me what I was capable of, I would not be where I am today. I hope to be the same kind of role model for my mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"53bed011-e9b2-40d2-aac4-9b4dd275aa59\"}":{"__typename":"School","uuid":"53bed011-e9b2-40d2-aac4-9b4dd275aa59","name":"Hopkins School","city":"New Haven","type":"HIGH","state":"Connecticut","country":"United States","zip":"06515"},"Education:{\"uuid\":\"35db5f79-de67-461d-926e-35a2b87b412b\"}":{"__typename":"Education","uuid":"35db5f79-de67-461d-926e-35a2b87b412b","school":{"__ref":"School:{\"uuid\":\"53bed011-e9b2-40d2-aac4-9b4dd275aa59\"}"},"startYear":"2019","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b86d5fac-5035-4a3e-8fbd-435cd9f0346f\"}":{"__typename":"Education","uuid":"b86d5fac-5035-4a3e-8fbd-435cd9f0346f","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"History of Science, Medicine, and Public Health","degree":null},"MentorPublicProfile:{\"uuid\":\"a6bfe3ec-481d-4109-a421-eb7344d26033\"}":{"__typename":"MentorPublicProfile","uuid":"a6bfe3ec-481d-4109-a421-eb7344d26033","displayName":"Chidubem N.","slug":"chidubem-nzekwe","biography":"\u003cp\u003eFrom helping my parents fill out job applications to upholding my high school's policies and rules as a disciplinary committee member, I always strive to give back to people and communities that have shaped\u0026nbsp; who I am today. When I got the opportunity to volunteer as a teaching fellow at Pathfinder I took advantage of it, despite my introverted nature.\u0026nbsp; Pathfinder at Hopkins is an academic enrichment after-school program for\u0026nbsp; minority students in the inner-city area who seek more challenging and rigorous coursework than what their current schools provide. When I first attended this program in middle school, I joined a community of highly academically ambitious middle schoolers just like myself. In addition, I\u0026nbsp; was surrounded by teachers and high school volunteers who were not only invested in my academic success, but also my emotional development as I transitioned into becoming a teenager. The community Pathfinder fostered for me was one I felt obligated to give back too. As soon as I was eligible to become a teaching fellow during the school year, I did so. In my junior year, I taught Math and Verbal to help seventh graders prepare to take SSAT. Whether it was the determination and resilience these students demonstrated when tackling new and challenging concepts or the intense pop culture discussions I and the other teaching fellows had with the students in the minutes before class began, the experience of watching these students grow as learners and people was thoroughly rewarding. In fact, I decided I would volunteer during the summer session of Pathfinder as well where I was fortunate enough to have the opportunity to catch up with some of my former Pathfinder classmates who had also decided to volunteer as high schoolers at Pathfinder. To this day, I still regularly converse with my classmates from Pathfinder who chose to attend Hopkins as well as those who did not. We all are unified not only by the commonality of all being Pathfinder alumni, but also our desire to “pay it forward,” giving back to a community that fostered habits, ambitions, and friends that will last a lifetime.\u003c/p\u003e","teachingVideoPlaybackId":"BveWTTGNsN6v00kNaXqgaZAO4gXEu2WYL02I015bhlBOO4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3799916b-258d-4412-bd8a-7f2757e5d557\"}"},{"__ref":"Favorites:{\"uuid\":\"84
