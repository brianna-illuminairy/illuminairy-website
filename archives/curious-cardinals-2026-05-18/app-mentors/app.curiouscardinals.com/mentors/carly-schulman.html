xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4cb87516-06a6-4283-9637-ba329aa1e5b0\"}":{"__typename":"Favorites","uuid":"4cb87516-06a6-4283-9637-ba329aa1e5b0","photoUrl":"https://ucarecdn.com/73b68825-7a51-4e49-a183-21b315340a9d/","title":"Nine Stories by J.D. Salinger","type":"BOOK"},"Favorites:{\"uuid\":\"2df890f1-edd0-4bd8-948b-2264af5a167c\"}":{"__typename":"Favorites","uuid":"2df890f1-edd0-4bd8-948b-2264af5a167c","photoUrl":"https://ucarecdn.com/6cfad30d-197a-4113-b849-fa866605e03a/","title":"Miami Heat","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"1a596877-1387-4c17-a93a-a4e24b9d833c\"}":{"__typename":"Favorites","uuid":"1a596877-1387-4c17-a93a-a4e24b9d833c","photoUrl":"https://ucarecdn.com/a6150190-380b-4207-bcb9-f94f0aa541ec/","title":"Ratatouille","type":"MOVIE"},"CausesSupported:{\"uuid\":\"a802a441-206a-4255-bd56-662dfb034218\"}":{"__typename":"CausesSupported","uuid":"a802a441-206a-4255-bd56-662dfb034218","name":"Camp Kesem","description":"\u003cp\u003eCamp Kesem supports children of families affected by cancer.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/1fd6eac6-7745-44ef-828e-2588f5fc2d03/"},"CausesSupported:{\"uuid\":\"17744a4c-948b-462f-ae82-69edf7486904\"}":{"__typename":"CausesSupported","uuid":"17744a4c-948b-462f-ae82-69edf7486904","name":"Equal Justice Initiative","description":"\u003cp\u003eEJI advocates for marginalized communities and fights against systemic injustice\u003c/p\u003e","photoUrl":"https://ucarecdn.com/6c58b76b-bf95-4d8d-88b0-a66e5dc178bd/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f47a84dc-f633-4524-8b44-714a285fef2a\"}":{"__typename":"DeepDives","uuid":"f47a84dc-f633-4524-8b44-714a285fef2a","content":"\u003cp\u003eWhen I first got to college, I had no idea what I wanted to major in. As freshman year passed and sophomore year began, I started to panic at the thought of having to make a decision. I heard a lot about the strong journalism program at Northwestern and was surrounded by journalism majors while working at the student newspaper, but never quite considered it for myself.\u003c/p\u003e\u003cp\u003eI decided to take an introductory journalism class purely on a whim based on a random suggestion from my academic adviser and sheer desperation. Within two weeks of the class starting, I found myself interviewing \u003cem\u003ereal people\u003c/em\u003e for stories that were \u003cem\u003emy idea\u003c/em\u003e to write. This was truly unlike any academic experience I had before; the scope of my work was actually stretching beyond the classroom to impact others. Whether it was conducting interviews, analyzing public data or even creating illustrations, I felt like my work was making an impact. I felt inspired and invigorated by the real conversations I was having with my interviewees to continue to share. My job was to find a way to capture the stories I heard over the phone in a way that could be shared with the world. As I continued my studies, I realized all the different ways journalism could manifest outside of traditional reporting, leading me to discover my passion for visual journalism.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"ea72ebd2-202b-4a64-956f-2e1f7b9fe75c\"}":{"__typename":"DeepDives","uuid":"ea72ebd2-202b-4a64-956f-2e1f7b9fe75c","content":"\u003cp\u003eMy favorite things to teach always center around creativity, and my favorite thing to do with a student is to help them unlock their own creativity. A lot of people go through life believing they aren’t creative, or don’t have the power to come up with good ideas. I wholeheartedly believe that this idea that only certain people can be creative is completely untrue, and I’m passionate about helping more people realize that. The process to unlock creativity is more about changing your mindset than learning something new, which makes it much more complex than other kinds of lessons, but also more rewarding. I’ve loved working with students to help them see how they can come up with ideas, projects and solutions just as well as anyone else can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"26bff1f5-5a57-4ce3-b8a7-ea0ee1a1ce6e\"}":{"__typename":"DeepDives","uuid":"26bff1f5-5a57-4ce3-b8a7-ea0ee1a1ce6e","content":"\u003cp\u003eWhile working with my robotics team in high school, I volunteered to make a side panel for our robot with the laser cutter. My first time using this machine, I was immediately hooked– this machine had the power to cut or engrave almost any material, and I knew the opportunities to use it were endless. I started thinking of ways I could incorporate it into my other work. and eventually came up with the idea to make a lamp after seeing light fixtures at Art Basel in Miami. I spent most of my art classes during senior year of high school making a series of light fixtures completely made out of laser cut acrylic, wood and other materials. I loved the process of sketching out a design, figuring out the construction, and putting all of the pieces together to make the end product. I made pendant lamps, table lamps, light sculptures and more. This project helped me realize how much I loved combining the power of technology and design to create things from scratch. I continued laser cutting throughout college and will probably always seek out a laser cutter wherever I am!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f7f5f5b3-59e1-47e1-8f2e-57e8466e7e04\"}":{"__typename":"DeepDives","uuid":"f7f5f5b3-59e1-47e1-8f2e-57e8466e7e04","content":"\u003cp\u003eThere is no such thing as the perfect time to do anything. Going through school, I always felt like there was a strict timeline of when to have everything figured out. As early as elementary school, I often felt behind. I spent a lot of time jumping between different hobbies and activities, feeling jealous of the people who seemed to know exactly what they liked and were good at. This pressure continued throughout school as my life took unexpected twists and turns.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe deadline-based nature of school led me to set subconscious, arbitrary deadlines for other parts of my life. However, things like finding your passion, a solid group of friends or life’s meaning have no deadline! Everyone moves at their own pace. There will always be someone behind and ahead of you. Things don’t always fall into place exactly when you want them to, and that is perfectly okay (sometimes even a blessing in disguise). Embrace uncertainty and take the time you need, not the time you think you should need.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"07fb5f3c-ad33-4d20-afd0-6229f32f7cae\"}":{"__typename":"School","uuid":"07fb5f3c-ad33-4d20-afd0-6229f32f7cae","name":"Pine Crest School","city":"Fort Lauderdale","type":"HIGH","state":"Florida","country":"United States","zip":"33334"},"Education:{\"uuid\":\"6c6c13c4-2b33-4db5-9021-ceb3b35207c5\"}":{"__typename":"Education","uuid":"6c6c13c4-2b33-4db5-9021-ceb3b35207c5","school":{"__ref":"School:{\"uuid\":\"07fb5f3c-ad33-4d20-afd0-6229f32f7cae\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"f2832296-8524-4b84-8df4-0d3d25897eeb\"}":{"__typename":"Education","uuid":"f2832296-8524-4b84-8df4-0d3d25897eeb","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":"2022","major":"Journalism and Sociology","degree":"B.S."},"MentorPublicProfile:{\"uuid\":\"0115eb59-e534-4dab-8596-82a4cf86203b\"}":{"__typename":"MentorPublicProfile","uuid":"0115eb59-e534-4dab-8596-82a4cf86203b","displayName":"Carly S.","slug":"carly-schulman","biography":"\u003cp\u003eCarly is a native of Fort Lauderdale, Florida and recent graduate of Northwestern University where she majored in journalism and sociology with a concentration in social data research. At Northwestern, she held leadership positions at Camp Kesem, an organization that supports children who are affected by a parent’s cancer, and the Daily Northwestern, where she served as design editor, as well as working as a reporter and sports photographer. Some of her main academic interests include socioeconomic inequality research and data visualization.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eArt and design have been lifelong passions of Carly’s, leading her to pursue creative ventures throughout high school and college. She started her artistic pursuits with drawing and painting and eventually transitioned to focus more on digital art. This led her to explore the fields of graphic design, digital illustration and photography in college and find ways to incorporate these skills into her personal academic interests. Carly has worked as an apparel designer for almost four years, creating designs for various organizations and some of the NCAA’s top athletes. She also worked as a graphic designer for Northwestern Athletics and the performing arts center. Although most of her recent work has been digital, she still loves to create art IRL, especially if it involves a laser cutter.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCarly is the type of person who tends to have a wide range of interests rather than gravitating toward one specific area. She is a huge sports fan (especially of basketball and football) and has consequently developed an extensive register of random sports facts. Music is another main interest of Carly’s; she plays guitar (badly), but she mostly likes to spend time discovering new music, learning about music history and making playlists for her friends. She also absolutely loves to cook unnecessarily elaborate dinners for her friends and family, especially if they involve pasta.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe believes creativity can be applied to any discipline and is excited to bring her passion for innovation and expressiveness to the Curious Cardinals community. Carly’s mission as a mentor is to help her students discover their strengths in whatever they choose to learn by finding ways to use their creativity to go beyond their perceived limits. She aims to foster a comfortable, friendly environment where questions and exploration are always encouraged.\u003c/p\u003e","teachingVideoPlaybackId":"JcX00X028sDTNpkJ4dV5NeZx3kjoDGEfI00OTU7ve6qVzE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4cb87516-06a6-4283-9637-ba329aa1e5b0\"}"},{"__ref":"Favorites:{\"uuid\":\"2df890f1-edd0-4bd8-948b-2264af5a167c\"}"},{"__ref":"Favorites:{\"uuid\":\"1a596877-1387-4c17-a93a-a4e24b9d833c\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"a802a441-206a-4255-bd56-662dfb034218\"}"},{"__ref":"CausesSupported:{\"uuid\":\"17744a4c-948b-462f-ae82-69edf7486904\"}"}],"major":"Journalism and Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f47a84dc-f633-4524-8b44-714a285fef2a\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea72ebd2-202b-4a64-956f-2e1f7b9fe75c\"}"},{"__ref":"DeepDives:{\"uuid\":\"26bff1f5-5a57-4ce3-b8a7-ea0ee1a1ce6e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7f5f5b3-59e1-47e1-8f2e-57e8466e7e04\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4ec4410e-7a7c-4adb-80d6-a578ec76faaf/-/preview/-/format/jpg/","https://ucarecdn.com/f819e072-a078-4a93-911f-87e37d400039/-/preview/-/format/jpg/","https://ucarecdn.com/a1c8a8a1-3fab-47a5-b4cd-16643bd2b115/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6c6c13c4-2b33-4db5-9021-ceb3b35207c5\"}"},{"__ref":"Education:{\"uuid\":\"f2832296-8524-4b84-8df4-0d3d25897eeb\"}"}],"hiredAt":"2022-11-18T16:24:30.000Z","topics":["Writing","Executive Function","College Essay Writing","Reading","Creative Writing","K-6 Storybook","Visual Arts / Graphic Design","Sports Journalism","Video / Photography","Sports Analytics","Web Design","Coding / Programming","Journalism"],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"carly-schulman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0115eb59-e534-4dab-8596-82a4cf86203b\"}"}}},"_sentryTraceData":"69fa4c43cdf549c89765066efb0cee9a-bd23a7381b2acd7b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=69fa4c43cdf549c89765066efb0cee9a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"carly-schulman"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
