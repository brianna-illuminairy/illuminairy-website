xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f6626db8-fc3e-46f0-9a38-7a01f28a67d3\"}":{"__typename":"Favorites","uuid":"f6626db8-fc3e-46f0-9a38-7a01f28a67d3","photoUrl":"https://ucarecdn.com/b30bab47-ea8d-4fed-8baf-509fcc674050/","title":"Donovan Mitchell","type":"ATHLETE"},"Favorites:{\"uuid\":\"e48fcb8a-e283-4200-b711-ca86be93773e\"}":{"__typename":"Favorites","uuid":"e48fcb8a-e283-4200-b711-ca86be93773e","photoUrl":"https://ucarecdn.com/5d5bc968-2629-426d-bf69-e70baecf3f0d/","title":"Minecraft","type":"GAME"},"Favorites:{\"uuid\":\"22edad70-adef-40d4-abc8-a56671fc05b8\"}":{"__typename":"Favorites","uuid":"22edad70-adef-40d4-abc8-a56671fc05b8","photoUrl":"https://ucarecdn.com/7f312ef9-1bd9-4de4-b178-bbd97a22b84e/","title":"Cleveland Cavaliers","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5cad6322-af70-4ee1-ad9c-cfea324ba988\"}":{"__typename":"DeepDives","uuid":"5cad6322-af70-4ee1-ad9c-cfea324ba988","content":"\u003cp\u003eOne piece of advice I would give my middle or high school self would be to express my interests with adults who may have expertise in fields I'm interested in (like a teacher). I think that I could have enjoyed my time in high school so much more if I let those who wish to see me succeed know more about what I am interested in.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8646c01f-d78b-4449-922e-d7c26c12d7b4\"}":{"__typename":"DeepDives","uuid":"8646c01f-d78b-4449-922e-d7c26c12d7b4","content":"\u003cp\u003eI hope that one day I can release my dream game. I have a vague idea of what it would be, but when I have the time and resources, I'd love to fully focus on developing and releasing a game with a lot of lore and passion put into it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"ee434329-b2bf-4db8-aa8f-f55fc7675bc2\"}":{"__typename":"DeepDives","uuid":"ee434329-b2bf-4db8-aa8f-f55fc7675bc2","content":"\u003cp\u003eAs a high school student, I was a well rounded but lazy student. I was involved in many activities like band, track, and clubs. However once I got home from these activities, I would either crash and sleep, or just play games with my friends. I wasn't a perfect student, but I knew what I needed to do in order to get where I wanted to be (and I did the absolute minimum needed to get there).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c7bc2a61-5da3-42b9-ae6e-2bf2eed7765b\"}":{"__typename":"DeepDives","uuid":"c7bc2a61-5da3-42b9-ae6e-2bf2eed7765b","content":"\u003cp\u003eI decided to study computer science because from a young age I had a big interest in technology. I wasn't too interested in the electronics or physical expertise behind them, but the digital systems that make these things work really stood out to me, and when I learned that computer science is a major that a lot of game developers took, that clinched this selection.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"b77ed00c-a89c-4271-8f0c-f8675e50a91b\"}":{"__typename":"School","uuid":"b77ed00c-a89c-4271-8f0c-f8675e50a91b","name":"Monroe Woodbury High School","city":"Woodbury","type":"HIGH","state":"New York","country":"United States","zip":"10917"},"Education:{\"uuid\":\"21fdf310-b719-45cb-b762-e54d4b7db331\"}":{"__typename":"Education","uuid":"21fdf310-b719-45cb-b762-e54d4b7db331","school":{"__ref":"School:{\"uuid\":\"b77ed00c-a89c-4271-8f0c-f8675e50a91b\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"0bdd3ad1-32ef-4401-a353-3e2d1f576ed1\"}":{"__typename":"Education","uuid":"0bdd3ad1-32ef-4401-a353-3e2d1f576ed1","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"daf1bccc-794f-4973-918e-f49ebf5a3204\"}":{"__typename":"MentorPublicProfile","uuid":"daf1bccc-794f-4973-918e-f49ebf5a3204","displayName":"David R.","slug":"david-rouchon","biography":"\u003cp\u003eHello, my name is David and I am a Junior at Cornell University studying Computer Science.\u003cbr\u003e\u003cbr\u003eI have a passion for creating fun things, and my most recent projects have dealt with games. I feel like CS is the perfect field to express my creativity, and my experiences have only strengthened that feeling. Through my school, I was able to do an internship with LinkedIn where we researched the effects of AI on the data analyst job market. Now I have an opportunity to explore the cloud as I will be interning with Oracle this summer.\u003c/p\u003e\u003cp\u003eWhen I was in highschool, I ran Instagram Theme Pages, and I sold a few of them. I took that expertise to Fiverr, where I would consult clients trying to grow their own personal brand on Instagram. I also started editing Twitch VODs into Youtube Videos for Twitch streamers on Fiverr, and that experience lead me to creating my own Youtube channel (subscribe to MakenDev 😄).\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs a mentor, I hope to guide mentees who are interested in creating projects with code, or who want to take a stab at entrepreneurship online (maybe even both). Personally, I’m working on a video game, and I feel like this is a perfect combination of making code and entrepreneurship. Obviously, there’s a lot of code required for making a game, but posting updates of the game on social media, marketing the game, and shipping the game hits many important facets of entrepreneurship as well.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe my coursework, previous internship, and personal projects give me the experience necessary to guide your child. At Cornell, I’ve mentored some of my underclassmen in clubs I’m involved in, and this is what sparked my interest in mentoring at a larger capacity. I’d love to make friends with your child, and guide them in their future!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I'm free, I'm either playing Basketball, Fifa, or drawing (I'm learning but my art is really bad 😭). My favorite basketball team is the Cleveland Cavaliers, and my favorite player is Donovan Mitchell. I love playing video games as well, mostly Fifa and Minecraft. I’ve been playing video games since I came out of the womb, so I have a profound love for both playing and making them.\u003c/p\u003e","
