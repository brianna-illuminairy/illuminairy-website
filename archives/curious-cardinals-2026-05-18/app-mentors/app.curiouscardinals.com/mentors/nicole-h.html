xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"417ef582-0f9a-4b19-9c09-29f31f8d05cb\"}":{"__typename":"Favorites","uuid":"417ef582-0f9a-4b19-9c09-29f31f8d05cb","photoUrl":"https://ucarecdn.com/4a587faf-3311-42e2-906b-e0306b88b280/","title":"Florence, Italy","type":"CITY"},"CausesSupported:{\"uuid\":\"11591b89-4327-4fbf-800f-f4f1339b8da8\"}":{"__typename":"CausesSupported","uuid":"11591b89-4327-4fbf-800f-f4f1339b8da8","name":"","description":"","photoUrl":""},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"84ad11c0-e3fb-4b6c-8820-3ed61dc127c9\"}":{"__typename":"DeepDives","uuid":"84ad11c0-e3fb-4b6c-8820-3ed61dc127c9","content":"\u003cp\u003eMentorship matters to me because a lot of my success comes from the guidance I received from older students in high school and college. Their advice helped me navigate challenges and believe in myself. I enjoy helping others find their way and discover what they’re capable of, just like my mentors did for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"9003f7a4-52a7-4695-a613-6943729b3ba6\"}":{"__typename":"DeepDives","uuid":"9003f7a4-52a7-4695-a613-6943729b3ba6","content":"\u003cp\u003eAs a high school student, I was very committed to my academics and always excited to learn. I set ambitious goals for myself and worked hard to achieve them. I was also heavily involved in sports, serving as captain of both my soccer and flag football teams. Overall, I had a great time in high school, balancing my studies, sports, and extracurricular activities while making the most of every opportunity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e1a53a90-e76a-43e0-8b04-708935b37f40\"}":{"__typename":"DeepDives","uuid":"e1a53a90-e76a-43e0-8b04-708935b37f40","content":"\u003cp\u003eIn my spare time, I love staying active with workouts, spending time with friends, exploring Chicago’s best spots and restaurants, and traveling to new destinations whenever I get the chance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"7db517a6-57fb-40ff-90b4-a19648cce435\"}":{"__typename":"Education","uuid":"7db517a6-57fb-40ff-90b4-a19648cce435","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics \u0026 Journalism","degree":null},"School:{\"uuid\":\"1cd875ec-a408-4b8e-890b-c05d34abbea8\"}":{"__typename":"School","uuid":"1cd875ec-a408-4b8e-890b-c05d34abbea8","name":"Scheck Hillel Community School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33180"},"Education:{\"uuid\":\"5dadd0e2-64a6-465a-b7e3-bd715be69358\"}":{"__typename":"Education","uuid":"5dadd0e2-64a6-465a-b7e3-bd715be69358","school":{"__ref":"School:{\"uuid\":\"1cd875ec-a408-4b8e-890b-c05d34abbea8\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"f6f257a0-7ba0-4baa-8e30-c51fb7310a61\"}":{"__typename":"MentorPublicProfile","uuid":"f6f257a0-7ba0-4baa-8e30-c51fb7310a61","displayName":"Nicole F.","slug":"nicole-h","biography":"\u003cp\u003eHi! I’m Nicole and I’m from Miami, Florida! I’m a senior at Northwestern University majoring in Economics and Journalism with a minor in Business Institutions. Outside of school, I love to stay active — I enjoy running, doing Pilates, and taking workout classes in my free time.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Northwestern, I combine my interests in business and storytelling through studies in Economics and Journalism — whether I’m analyzing markets or writing a compelling narrative, I love using both data and creativity to communicate ideas in a clear and engaging way.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve taken entrepreneurship classes and am passionate about innovation and building new ideas. I’ve also worked at Mathnasium and have over seven years of experience tutoring and mentoring, helping many students with schoolwork, college applications, and discovering what excites them. I’m especially passionate about helping students build confidence in their academic abilities, explore their interests, and identify possible paths after high school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether it's walking through an essay, discussing life goals, or simply offering support, I love being part of that journey. I know firsthand how challenging it can be to juggle academics, fitness, a social life, and rest. Through experience, I’ve learned practical ways to stay on track and make the most of my time. I’m passionate about helping others find what works for them and enjoy offering guidance to students looking to improve their study habits and time management skills.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m really looking forward to connecting with students, learning about their goals, and supporting them however I can!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGetting into my dream school and pursuing a career that combines my passions for business, economics, and storytelling!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"417ef582-0f9a-4b19-9c09-29f31f8d05cb\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"11591b89-4327-4fbf-800f-f4f1339b8da8\"}"}],"major":"Economics \u0026 Journalism","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"84ad11c0-e3fb-4b6c-8820-3ed61dc127c9\"}"},{"__ref":"DeepDives:{\"uuid\":\"9003f7a4-52a7-4695-a613-6943729b3ba6\"}"},{"__ref":"DeepDives:{\"uuid\":\"e1a53a90-e76a-43e0-8b04-708935b37f40\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/312b8f7a-692b-43c2-8352-735c3b5ac1c4/-/preview/-/format/jpg/","https://ucarecdn.com/198a05a7-31e8-4b04-8bc2-a21730b79186/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"7db517a6-57fb-40ff-90b4-a19648cce435\"}"},{"__ref":"Education:{\"uuid\":\"5dadd0e2-64a6-465a-b7e3-bd715be69358\"}"}],"hiredAt":"2025-04-18T09:14:27.773Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nicole-h\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f6f257a0-7ba0-4baa-8e30-c51fb7310a61\"}"}}},"_sentryTraceData":"c5b463c2b37e42d3a3429d6
