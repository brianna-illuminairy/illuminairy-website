xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"21b5f65c-a66a-453b-996d-77bc23c7bbd0\"}":{"__typename":"DeepDives","uuid":"21b5f65c-a66a-453b-996d-77bc23c7bbd0","content":"\u003cp\u003eIn high school, I spent my summers training new skills to gear up for the upcoming season, working on passion projects like creating my own nonprofit to support newly settled Burmese refugees, and spending time with friends and family.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"fe9daad7-b4f2-4468-a2f4-86770e2623f4\"}":{"__typename":"DeepDives","uuid":"fe9daad7-b4f2-4468-a2f4-86770e2623f4","content":"\u003cp\u003eAs a high school student, I was fascinated by language. I took classes in three world languages: Latin, Chinese, and Italian. Learning these diverse languages and each of their accompanying cultures and histories sparked my interest in both spoken and written communication, which I now explore through my English studies.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"974a4582-3614-4942-b83c-3d9a02f7ed1e\"}":{"__typename":"DeepDives","uuid":"974a4582-3614-4942-b83c-3d9a02f7ed1e","content":"\u003cp\u003eWhen I’m not in a library or classroom, I love to dance. I take a contemporary repertoire class at Brown each semester and find that the community of dancers and our collective practice grounds me in the midst of otherwise hectic college days.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"904b01c3-ca5c-4c80-adb8-6d3052e39074\"}":{"__typename":"DeepDives","uuid":"904b01c3-ca5c-4c80-adb8-6d3052e39074","content":"\u003cp\u003eI would tell my past self to tune out the noise and find what truly matters to me. Though comparison is almost unavoidable through middle and high school, I wish I had spent less time doing what I thought was expected of me and spent more time exploring my early passions and curiosities.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"171ad647-cb21-4709-a475-ac5835c31f57\"}":{"__typename":"Education","uuid":"171ad647-cb21-4709-a475-ac5835c31f57","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"a4cd2812-2e1e-4bf4-94e0-5c366e529e03\"}":{"__typename":"Education","uuid":"a4cd2812-2e1e-4bf4-94e0-5c366e529e03","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"English and Education Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"8c489bc9-0a9c-4afa-a533-d266d6238e7c\"}":{"__typename":"MentorPublicProfile","uuid":"8c489bc9-0a9c-4afa-a533-d266d6238e7c","displayName":"Neleh K.","slug":"neleh-kay-1","biography":"\u003cp\u003eHi! My name is Neleh Kay, and I was born and raised in Los Angeles. I attended Harvard-Westlake School for middle and high school, and am currently a third-year undergraduate student at Brown University in Providence, Rhode Island. I double-concentrate in English and Education Studies with a specialization in Education Policy Analysis. I’m most passionate about advancing educational equity in urban areas through meaningful policy development, reform, and implementation. Through my coursework, I’ve developed expertise in literary critique of many genres, social science research, and analytical writing in English, Classics, and Art History.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I serve as the secretary of the Brown Women’s Pre-Law Association, contribute to our course review publication The Critical Review, serve on the Community Engagement Team of Students for Educational Equity, and dance with the Contemporary Dance Studio Project. Off campus, I have professional experience in teaching, law, consulting, and nonprofit work. Right now I’m working as an English as a Second Language tutor for a nonprofit organization that brings services to displaced refugee women and girls. In high school, I competed internationally as a member of the USA Rhythmic Gymnastics National Team. Though I’ve since retired from the sport, training at an elite level taught me the importance of resilience, tenacity, and time management – skills I apply to everything I pursue. In juggling a demanding academic schedule with an even more demanding training and travel schedule, I had to perfect a range of executive functioning strategies which I now share with and ingrain in my mentees. Aside from academics and extracurriculars, I spend my time by the beach, reading, dancing, or listening to music.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I intend to center your student's unique interests while creating a space for both intellectual and personal growth. Rather than focusing solely on academic mastery in the short term, I aim to equip my mentees with the skill set and habits necessary to continue succeeding throughout their academic journey and beyond. I place a strong emphasis on step-by-step guidance, structured practice, targeted feedback, and researched best practices to meet my students’ individual learning needs in reading and writing. I look forward to supporting your student as they grow into a confident, independent learner!\u003c/p\u003e","teachingVideoPlaybackId":"UOurU3c4EVLDFNz01y7kCrrk01wbVc02SKwr2T01pMyHYQg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English and Education Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"21b5f65c-a66a-453b-996d-77bc23c7bbd0\"}"},{"__ref":"DeepDives:{\"uuid\":\"fe9daad7-b4f2-4468-a2f4-86770e2623f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"974a4582-3614-4942-b83c-3d9a02f7ed1e\"}"},{"__ref":"DeepDives:{\"uuid\":\"904b01c3-ca5c-4c80-adb8-6d3052e39074\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3153ccf1-8f04-49be-ac81-b63b155523ad/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"171ad647-cb21-4709-a475-ac5835c31f57\"}"},{"__ref":"Education:{\"uuid\":\"a4cd2
