xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"7c6ed20f-4ec2-4a52-a6d4-acb04eb5c8d3\"}":{"__typename":"CausesSupported","uuid":"7c6ed20f-4ec2-4a52-a6d4-acb04eb5c8d3","name":"Adapted Aquatics","description":"\u003cp\u003eAn organization that teaches children with disabilities how to swim.\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"b62fc018-b9db-4ca2-8cce-2a936fa6e0d5\"}":{"__typename":"CausesSupported","uuid":"b62fc018-b9db-4ca2-8cce-2a936fa6e0d5","name":"SEVA Truck","description":"\u003cp\u003eA non-profit that provides fresh, free meals to communities in need.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"871b396c-7dbb-4a1b-954a-efb1aae8df36\"}":{"__typename":"DeepDives","uuid":"871b396c-7dbb-4a1b-954a-efb1aae8df36","content":"\u003cp\u003eMy dream job would be an online food critic. I love eating, traveling, and filming, so this job would combine all three of some of my favorite things to do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"f9d8cea8-271f-4fca-a717-de4a44b66ea3\"}":{"__typename":"DeepDives","uuid":"f9d8cea8-271f-4fca-a717-de4a44b66ea3","content":"\u003cp\u003eI would love to travel to every continent during my lifetime.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4b838042-8e4a-4685-b648-0fac91026898\"}":{"__typename":"DeepDives","uuid":"4b838042-8e4a-4685-b648-0fac91026898","content":"\u003cp\u003eThe advice I would give to my high school self is to not stress over every exam. At the end of the day, a single test means very little, so you shouldn't let the stress consume you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6495e139-56c7-4adf-afed-88982754b5df\"}":{"__typename":"DeepDives","uuid":"6495e139-56c7-4adf-afed-88982754b5df","content":"\u003cp\u003eOver my summers I coached, swam, and lifeguarded at my local pool. I volunteered for two different organizations: one taught children with disabilities how to swim and the other provided meals to communities in need. Also, the summer after my junior year of high school, I did the Governor's School for STEM which was a fantastic learning experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"85ab8977-9639-4460-9f00-796b1d4739f4\"}":{"__typename":"School","uuid":"85ab8977-9639-4460-9f00-796b1d4739f4","name":"McLean High School","city":"McLean","type":"HIGH","state":"Virginia","country":"United States","zip":"22101"},"Education:{\"uuid\":\"00ece59b-6a85-40ff-b088-73b4f5fb00df\"}":{"__typename":"Education","uuid":"00ece59b-6a85-40ff-b088-73b4f5fb00df","school":{"__ref":"School:{\"uuid\":\"85ab8977-9639-4460-9f00-796b1d4739f4\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"5311ed14-57a1-4ae7-9ff5-63908d6b3e44\"}":{"__typename":"Education","uuid":"5311ed14-57a1-4ae7-9ff5-63908d6b3e44","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics; Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"570125d2-8153-4923-8b00-6acabd1aabf0\"}":{"__typename":"MentorPublicProfile","uuid":"570125d2-8153-4923-8b00-6acabd1aabf0","displayName":"Nicolas C.","slug":"nico-christofferson","biography":"\u003cp\u003eHi! My name is Nico and I’m a student at Yale pursuing a Bachelor’s in economics and mathematics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAn important thing to know about me is that I love optimization. Whether it was optimizing my distance per stroke in swimming or viewership for my school’s news show, figuring out the optimal way to do something has always been at the forefront of my mind when I approach a task.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn a similar fashion, this is how I plan to teach. My focus will be on figuring out which methods of teaching best suits your understanding, and how I can implement those methods in the most efficient way. What I have learned from teaching kids how to swim is that learning is much easier when both parties are excited and communicative. I plan on bringing enthusiasm to every lesson and forging relationships with all of my mentees!\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo start this process, I will tell you a little bit more about my background. I was raised in McLean, Virginia (just outside DC), and went to public school there. I got interested in economics in high school by joining a business club called DECA, which held competitions from local to international levels. I have also been a competitive swimmer for over 10 years, competing at Nationals my sophomore and junior years of high school. In my free time I love cooking, reading manga, and playing volleyball.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnother important thing to know about me is that I use my talents to give back to the community. This led me to volunteer for two organizations throughout high school: Adapted Aquatics, an organization that teaches children with disabilities how to swim, and SEVA Truck which provides free, freshly cooked meals for communities in need.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the future, I hope to work in finance, consulting, or to start my own business, but for now, I’m looking forward to working with you!\u003c/p\u003e","teachingVideoPlaybackId":"VjW01EA6FEildCRaldALB02v4goT29jA02WNkRJ01frR5r4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"7c6ed20f-4ec2-4a52-a6d4-acb04eb5c8d3\"}"},{"__ref":"CausesSupported:{\"uuid\":\"b62fc018-b9db-4ca2-8cce-2a936fa6e0d5\"}"}],"major":"Economics; Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"871b396c-7dbb-4a1b-954a-efb1aae8df36\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9d8cea8-271f-4fca-a717-de4a44b66ea3\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b838042-8e4a-4685-b648-0fac91026898\"}"},{"__ref":"DeepDives:{\"uuid\":\"6495e139-56c7-4adf-afed-88982754b5df\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/81a4ae72-bb77-410b-9204-6934a62b3fe1/-/preview/-/format/jpg/","https://ucarecdn.com/912d410a-4494-40f7-93bd-68c0cadf1e55/-/preview/-/format/jpg/","https://ucarecdn.com/f5e22b06-7b02-43f2-b729-e8ebe1ac2314/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"00ece59b-6a85-40ff-b088-7
