xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fa131c77-adce-44f7-854f-cb5da953c786\"}":{"__typename":"Favorites","uuid":"fa131c77-adce-44f7-854f-cb5da953c786","photoUrl":"https://ucarecdn.com/689bb1dc-b5b0-4e57-8573-7c6f7e988024/","title":"MTV Unplugged No. 2.0","type":"ALBUM"},"Favorites:{\"uuid\":\"562346da-db33-434e-b691-2d60620b39b7\"}":{"__typename":"Favorites","uuid":"562346da-db33-434e-b691-2d60620b39b7","photoUrl":"https://ucarecdn.com/92443863-e930-4622-a1e6-984ce3170cbf/","title":"San Francisco, CA","type":"CITY"},"Favorites:{\"uuid\":\"bb29bb3e-9591-4abf-8b8f-bb3585e757d0\"}":{"__typename":"Favorites","uuid":"bb29bb3e-9591-4abf-8b8f-bb3585e757d0","photoUrl":"https://ucarecdn.com/75dece9b-64d7-49cd-8919-19e2903a40a3/","title":"Robin Williams","type":"ACTOR"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"63e3287c-6289-4213-b5ef-d40ab52aa28a\"}":{"__typename":"DeepDives","uuid":"63e3287c-6289-4213-b5ef-d40ab52aa28a","content":"\u003cp\u003eMentorship has been a defining part of my academic and career experience. As a sophomore at Yale, I became a first-year mentor for the Yale National Society of Black Engineers (NSBE). As one of the few Black students in my computer science classes, I wanted to give back to the NSBE community that helped me feel represented as a first-year. This same spirit I carried to the ColorStack exec-board, where I’ve enjoyed interacting with underclassmen at bazaars and club events. I even recall spending an entire event discussing a freshman’s interests and majors. I discovered I love helping others succeed and teaching what I’ve learned.\u003c/p\u003e\u003cp\u003eIn the Yale Ethiopian Eritrean Student Association (YEESA) and Yale Gospel Choir, I’ve spent significant time personally checking on first-years, and invested in their growth at Yale. Through the YEESA Big Sib program, I had the privilege of mentoring two first-years, grabbing holiday meals, and helping them navigate decisions and opportunities. I would hate for anyone to become an upperclassman only to discover a resource and think, “I wish I knew about this sooner”. Therefore, I've documented helpful insider information (e.g., conference funding resources) over the years.\u003c/p\u003e\u003cp\u003eOutside of Yale, I have cousins and younger siblings who have not entered college yet, and I have made sure to actively meet with them, advise them, and tell them all the information I was told at their age. Mentorship is a full circle moment for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"155e0f5d-e503-48ce-ac0d-f2e5a1a19583\"}":{"__typename":"DeepDives","uuid":"155e0f5d-e503-48ce-ac0d-f2e5a1a19583","content":"\u003cp\u003eI spent my high school summers seeking out enrichment programs, academic exploration, and creative activities that aligned with my interests in learning and self-growth. The summer before my sophomore year, I enrolled in a UC Berkeley class, where I learned introductory statistics.\u003c/p\u003e\u003cp\u003eThe summer after sophomore year, I joined “Zoom Quarancooks,” an eight-week virtual recipe cooking exchange with high school students in Greece and a guest pastry chef, where I learned classic Greek dishes and desserts. This sparked the idea for me to begin a small baking business through which I sold mostly Greek desserts to local churches and small events. The summers after my sophomore and junior years, I participated in the Thrive Scholars program, which consisted of 6-week academic bootcamps taking place at Amherst College then University of Chicago, where I took Calculus and college essay writing classes and participated in college preparatory programming.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"6cef77e8-f409-4a95-bb86-c1869c341ec7\"}":{"__typename":"School","uuid":"6cef77e8-f409-4a95-bb86-c1869c341ec7","name":"Sacred Heart Cathedral Preparatory","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94109"},"Education:{\"uuid\":\"87df1082-2d9b-410d-a05a-340979f132a5\"}":{"__typename":"Education","uuid":"87df1082-2d9b-410d-a05a-340979f132a5","school":{"__ref":"School:{\"uuid\":\"6cef77e8-f409-4a95-bb86-c1869c341ec7\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"118cd2b1-f9f1-46a3-b15d-f2796170294d\"}":{"__typename":"Education","uuid":"118cd2b1-f9f1-46a3-b15d-f2796170294d","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"85aed382-08c1-46d5-819f-ca641712482c\"}":{"__typename":"MentorPublicProfile","uuid":"85aed382-08c1-46d5-819f-ca641712482c","displayName":"Liya F.","slug":"liya-fasil-1","biography":"\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi! I’m a Computer Science student at Yale (Class of 2027) with a deep curiosity for how AI and technology can change the way we communicate. My journey has taken me through two consecutive software engineering internships at AWS, where I got to dive into the full product lifecycle and build solutions using AI agents. In my first internship, I created a real-time data visualization of experimental benchmark test results to be used daily by teams’ scientists and developers, cutting wait times by ~5 hours. During my second internship, I built an automatic service for an engineering team that takes in error logs, suggests code fixes with an LLM, and publishes its suggestions, reducing developer troubleshooting time by ~1.5 weeks. These experiences have been supplemented by my primarily AI-related CS courses. These experiences sparked my interest in the intersection of AI and product management.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond the code, I’m a proud member of communities like Management Leadership for Tomorrow, Code2040, Thrive Scholars, Rewriting the Code, Girls Who Code, the National Society of Black Engineers, and ColorStack. These spaces have been instrumental in my growth, and I’m a firm believer in \"sending the elevator back down.\" Whether it’s sharing what I’ve learned academically or advocating for more equity in tech, I’m excited about helping others. I’ve pursued this mission little by little– in college, I’ve been an Undergraduate Teaching Assistant for a Full Stack Web Programming course, where I held office hours twice weekly for a class of 96+ students, held advising sessions for class capstone project groups, and graded homework assignments.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOther interest areas I have include investing and personal finance. I am also interested in entrepreneurship– I’ve worked as a Venture Development Program Coordinator for my university entrepreneurship center (Tsai CITY), where I mentor 8-10 early-stage ventures/startups each semester, sharing resources and assisting with project planning/execution. There is nothing that excites me more than helping people turn ideas into reality.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not coding or working, you can usually find me exploring new languages, cooking, baking, fashion, writing (short stories, poems, scripts), and making TikToks! I love anything creative, and I’m a huge movie buff!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","teachingVideoPlaybackId":"DLbmMgd1yvKQ01G5WYfy2sONo3BaSbozX02pXF800AhFTg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"fa131c77-adce-44f7-854f-cb5da953c786\"}"},{"__ref":"Favorites:{\"uuid\":\"562346da-db33-434e-b691-2d60620b39b7\"}"},{"__ref":"Favorites:{\"uuid\":\"bb29bb3e-9591-4abf-8b8f-bb3585e757d0\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"63e3287c-6289-4213-b5ef-d40ab52aa28a\"}"},{"__ref":"DeepDives:{\"uuid\":\"155e0f5d-e503-48ce-ac0d-f2e5a1a19583\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/db407f29-881b-4fd0-8727-baa399e2d55e/-/preview/-/format/jpg/","https://ucarecdn.com/d4c68fa2-eabf-423b-900a-59a31394e422/-/preview/-/format/jpg/","https://ucarecdn.com/86b09830-60b1-489d-8a48-49e5ace8d6bd/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"87df1082-2d9b-410d-a05a-340979f132a5\"}"},{"__ref":"Education:{\"uuid\":\"118cd2b1-f9f1-46a3-b15d-f2796170294d\"}"}],"hiredAt":"2026-01-28T18:28:50.799Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science","Creative Writing","Fashion / Cosmetics","K-6 Storybook","Video / Photography","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Machine Learning / AI","Web Design","Public Speaking"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c
