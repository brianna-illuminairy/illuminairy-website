xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cc030689-b4cd-483f-8081-e5b2ffb0f768\"}":{"__typename":"Favorites","uuid":"cc030689-b4cd-483f-8081-e5b2ffb0f768","photoUrl":"https://ucarecdn.com/a403ee58-6ada-43f6-8313-9c1e99a27fb3/","title":"Scarlett Johansson","type":"ACTOR"},"Favorites:{\"uuid\":\"9319c1fc-4d9f-4edb-b283-1812be26abe9\"}":{"__typename":"Favorites","uuid":"9319c1fc-4d9f-4edb-b283-1812be26abe9","photoUrl":"https://ucarecdn.com/6db321b9-2fb6-4f40-8aef-cceb6631557f/","title":"Adele","type":"ARTIST"},"Favorites:{\"uuid\":\"84458801-a637-46de-b477-ccfabba4b90a\"}":{"__typename":"Favorites","uuid":"84458801-a637-46de-b477-ccfabba4b90a","photoUrl":"https://ucarecdn.com/bd5f5776-8084-4075-a35c-e2c23bd0ba23/","title":"The Circle by Dave Eggers","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d5efbfcf-b761-4ae6-bdc5-c1532ff70778\"}":{"__typename":"DeepDives","uuid":"d5efbfcf-b761-4ae6-bdc5-c1532ff70778","content":"\u003cp\u003eI would tell them to try no matter what. Oftentimes, when I look back at my younger years, I regret not trying more. The main reason I've gotten this far is that I started trying more. I tried harder in Academic Decathlon and Speech and Debate, I tried to socialize more, and I tried to reach out even when it felt weird. I even applied to all these crazy colleges when I didn't know if I would get in. I wish I had told myself that trying is a bigger accomplishment than people realize. If the results aren't what you wanted, it's better to know than look back and wonder what would've happened if you had given yourself the space to try. That's the mentality I would try to instill within my middle and high school self.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f929bc5e-e1c5-48c7-9284-5699084ee585\"}":{"__typename":"DeepDives","uuid":"f929bc5e-e1c5-48c7-9284-5699084ee585","content":"\u003cp\u003eMentorship matters to me because, throughout life, I've found it difficult to ask for help. I was never someone who wanted to admit that I didn't understand something or that I needed support. When I was lucky enough to receive that support from others, I remember how much I cherished it, and I still do. I've been dedicated to helping underclassmen in many ways, including tutoring and mentoring them on college applications. I've always wanted to help however I can, and mentorship is the best way for me to do this. I not only get to focus on enriching someone's learning capabilities, but also their outlook on life and overall confidence. As long as I can help just a little bit, that's a win in my book.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"405b0d2a-a31f-4f8d-9224-7a315ab87650\"}":{"__typename":"DeepDives","uuid":"405b0d2a-a31f-4f8d-9224-7a315ab87650","content":"\u003cp\u003eI love to sing whenever I can! I'm super passionate about singing and listening to music as well. I also love hanging out with friends whenever I find the time. It's always nice to be surrounded by people and have proper conversations with them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"0e48e775-e0dc-4f19-a236-b2201f93a390\"}":{"__typename":"DeepDives","uuid":"0e48e775-e0dc-4f19-a236-b2201f93a390","content":"\u003cp\u003eI spent my summers reading a lot of books because I never had time to do it during school. It was a nice time to relax, deep into a novel, because I didn't have to worry about turning anything in or any additional responsibilities. It also provided me with a nice mental stimulus as I found myself entranced by many plot lines, and couldn't stop reading. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"4836d696-f307-4d2a-97d2-da0401670227\"}":{"__typename":"School","uuid":"4836d696-f307-4d2a-97d2-da0401670227","name":"Sherman Oaks Center for Enriched Studies","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91335"},"Education:{\"uuid\":\"85846b85-d53d-4118-b9d5-003ce2397b47\"}":{"__typename":"Education","uuid":"85846b85-d53d-4118-b9d5-003ce2397b47","school":{"__ref":"School:{\"uuid\":\"4836d696-f307-4d2a-97d2-da0401670227\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"291a1d0e-33d3-4831-b449-be191dc0571c\"}":{"__typename":"Education","uuid":"291a1d0e-33d3-4831-b449-be191dc0571c","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"6a0cd973-08a8-4574-abb9-f038e872cd1d\"}":{"__typename":"MentorPublicProfile","uuid":"6a0cd973-08a8-4574-abb9-f038e872cd1d","displayName":"Ruben S.","slug":"ruben-stepanian","biography":"\u003cp\u003eHey! I’m Ruben, I'm from Los Angeles, and I'm a freshman studying Mechanical Engineering at Brown University. I’m so excited to be a part of Curious Cardinals! I'm very passionate about STEM, and love to help underclassmen explore their interests in STEM-related subjects. I'm also an avid singer and frequent music enjoyer, so I would love to deepen their curiosity about the arts as well.\u003cbr\u003e\u003cbr\u003eIn my free time, I love to go hiking, swimming, and spend time with friends. I also enjoy reading books (mainly fictional mysteries or detective novels), listening to some music (Adele, The Weeknd, Lady Gaga, Bruno Mars, etc.), and playing video games (Roblox with other games on the side). I’m eager to connect with people, and I'm thankful Curious Cardinals allows me to get to know such bright minds!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat are you passionate about?\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love to talk to people whenever I can. I truly enjoy engaging in deep conversation with others and finding out what motivates people in their day-to-day lives. I'm also dedicated to making an impact wherever I can. One way I've been doing this is by reaching out to incoming Brown students, offering advice, support, and overall encouragement to make them feel a little less alone :). I'm also a very curious individual, and I can't help but research things whenever they spark my interest, and I'd love to provide that space for my mentees to do the same!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy are you qualified?\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGreat question! In high school, I was a part of my school's National Honor Society, where I focused on tutoring 4-12 students on a variety of subjects, including English, Calculus, and Science. I also often helped fellow classmates in Spanish and worked with students on refining their college applications. Additionally, this past semester I worked with BRYTE (the Brown Refugee Youth Tutoring \u0026amp; Enrichment program), which allowed me to work closely with a refugee student in enhancing their academic habits and building a valuable connection.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you're eager to explore your interests and capitalize on that spark you feel when it comes to learning, as well as work on boosting your confidence in handling whatever comes your way, I'd be delighted to work with you! \u003c/p\u003e","teachingVideoPlaybackId":"6ChurngK6YpYzwjYVTyuIPRj6OwkRuaGhNKd5SGZWLw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhen I went to the California Academic Decathlon competition for the first time during my senior year, I was hoping to outscore one of the two people in my bracket for my score to count towards our total. Little did I know I would not only outscore one of them, but both, let alone the entire team, to become our team's highest scorer. I never could've imagined accomplishing something so crazy because I had been a part of Academic Decathlon since my sophomore year and had never made the team until that year. I didn't do so great during the regional competition, so I told myself I needed to give it my all at states. That entire awards ceremony felt like a product beyond my wildest dreams, and I'm so grateful for that opportunity, as it made me realize I'm a lot more capable than I think.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"cc030689-b4cd-483f-8081-e5b2ffb0f768\"}"},{"__ref":"Favorites:{\"uuid\":\"9319c1fc-4d9f-4edb-b283-1812be26abe9\"}"},{"__ref":"Favorites:{\"uuid\"
