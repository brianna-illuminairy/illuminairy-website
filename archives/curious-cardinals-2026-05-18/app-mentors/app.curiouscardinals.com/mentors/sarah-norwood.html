xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"87ceb390-4549-4685-a1d7-164bb5b2f020\"}":{"__typename":"Favorites","uuid":"87ceb390-4549-4685-a1d7-164bb5b2f020","photoUrl":"https://ucarecdn.com/026d47e2-9571-4a35-880b-53712d0dc4af/","title":"Amsterdam","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9cf5b6e2-4c22-475b-b504-f77add5009a0\"}":{"__typename":"DeepDives","uuid":"9cf5b6e2-4c22-475b-b504-f77add5009a0","content":"\u003cp\u003eFocus on what you are truly interested and dive deep into those areas. Whether taking on more leadership roles, starting a new club, or dedicating time to these pursuits, search for ways to meaningfully develop these interests into a passion!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"f0fed111-068e-4b57-9dcc-cc3a7b57b7b7\"}":{"__typename":"DeepDives","uuid":"f0fed111-068e-4b57-9dcc-cc3a7b57b7b7","content":"\u003cp\u003eI have taken advantage of getting to live in 7 different cities over the past 4 years. Getting to explore new areas and meet new people has truly had a tremendous impact on my life, and I'm proud that I've pushed myself to take on these risks and challenges!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7200e5f1-308f-4aa8-91b3-4a20aa137408\"}":{"__typename":"DeepDives","uuid":"7200e5f1-308f-4aa8-91b3-4a20aa137408","content":"\u003cp\u003eLearning from others is one of the greatest sources of knowledge in life. I owe nearly everything to those who have taught me, which often includes my peers and mentors just as much as my formal teachers. I want to share this important part of my life with others and think that becoming a mentor provides me the opportunity to form meaningful relationships while giving back!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"fe1ff259-61a7-4b24-83d5-1d9feb2b25ac\"}":{"__typename":"DeepDives","uuid":"fe1ff259-61a7-4b24-83d5-1d9feb2b25ac","content":"\u003cp\u003eExploring Nashville's music scene, trying out new coffee shops, checking off places on my travel bucket list (SE Asia is up next!), hiking trails, finding and trying new recipes, enjoying time with friends, completing my daily crosswords puzzle, or filling up my bucket in some other way!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"d4155c11-7630-43c0-a530-75b85a95b855\"}":{"__typename":"School","uuid":"d4155c11-7630-43c0-a530-75b85a95b855","name":"Valley High School","city":"West Des Moines","type":"HIGH","state":"Iowa","country":"United States","zip":"50266"},"Education:{\"uuid\":\"41531e4a-9f03-4c8b-98ab-ea98e800cc31\"}":{"__typename":"Education","uuid":"41531e4a-9f03-4c8b-98ab-ea98e800cc31","school":{"__ref":"School:{\"uuid\":\"d4155c11-7630-43c0-a530-75b85a95b855\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"f60d9a67-72e6-4352-af72-0633016543eb\"}":{"__typename":"Education","uuid":"f60d9a67-72e6-4352-af72-0633016543eb","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Human and Organizational Development and minoring in Business","degree":null},"MentorPublicProfile:{\"uuid\":\"5ddae7a8-2904-4e59-9628-3d077d8407de\"}":{"__typename":"MentorPublicProfile","uuid":"5ddae7a8-2904-4e59-9628-3d077d8407de","displayName":"Sarah N.","slug":"sarah-norwood","biography":"\u003cp\u003eHi everyone! I'm Sarah, a current senior at Vanderbilt University in Nashville, TN! So excited to share a little bit more about myself with you!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy past few years have been nothing short of exciting, mixing academic pursuits with fun experiences. I've gotten to learn in NYC, Madrid, D.C., Nashville, Philly, and Des Moines, all of which have provided me with some of my favorite memories and friendships to date.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was all about horses and singing, spending my time riding competitively and learning new songs in choir. Those experiences taught me a lot about dedication and teamwork. In college, I've done anything from exploring AI projects in class to learning the history behind sites when traveling around Europe for a semester (also had some time for fun peep the pictures in my profile taken while paragliding in the Swiss Alps and riding a camel in Morocco). These experiences have taught me the importance of weaving in fun and passion, no matter what the topic may be. As a mentor, I will make sure to share this with you as we grow together!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'll soon be kicking off my career with Bain in San Francisco. I can't wait to see what exciting challenges lie ahead in the Bay Area! For now, I'll be soaking up my last few months in Nashville as it's been an incredible place to spend my college years. The music scene here is phenomenal, and exploring it has become one of my favorite hobbies. I'm also a bit of a foodie, always on the hunt for new restaraunts and recipes to try out.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat really drives me, though, is helping people find what they're passionate about—whether that's a hobby, a career path, or just something fun to dive into. I love being a part of the journey where ideas become reality.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re ready to explore your passions and make something amazing, I'm all in to help you along the way. Let's see where we can go together!\u003c/p\u003e","teachingVideoPlaybackId":"GSzit6rozTU3CyZeXUp00kvfTaeCD1t02ys6LDzU6PU7A","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"87ceb390-4549-4685-a1d7-164bb5b2f020\"}"}],"causesSupported":[],"major":"Human and Organizational Development and minoring in Business","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9cf5b6e2-4c22-475b-b504-f77add5009a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0fed111-068e-4b57-9dcc-cc3a7b57b7b7\"}"},{"__ref":"DeepDives:{\"uuid\":\"7200e5f1-308f-4aa8-91b3-4a20aa137408\"}"},{"__ref":"DeepDives:{\"uuid\":\"fe1ff259-61a7-4b24-83d5-1d9feb2b25ac\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f6773e33-dc49-42f8-a7a3-0d2acefeb72b/-/preview/-/format/jpg/","https://ucarecdn.com/43828877-6c6b-4265-bd4e-
