xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0ec37550-bd53-469b-a5a1-1d8eed5d2d29\"}":{"__typename":"Favorites","uuid":"0ec37550-bd53-469b-a5a1-1d8eed5d2d29","photoUrl":"https://ucarecdn.com/daa7ffeb-a7cb-4e4c-98b5-7fb8926850d1/","title":"NEW YORK CITY!","type":"CITY"},"Favorites:{\"uuid\":\"09e7cc72-e551-4fb6-b0d5-9edd2ee9b9da\"}":{"__typename":"Favorites","uuid":"09e7cc72-e551-4fb6-b0d5-9edd2ee9b9da","photoUrl":"https://ucarecdn.com/0f65f3e6-fd5c-4366-859f-1ca4f7112454/","title":"Crazy Rich Asians","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"75e2d5ae-1033-4c4f-ace1-05ed71b6d36b\"}":{"__typename":"DeepDives","uuid":"75e2d5ae-1033-4c4f-ace1-05ed71b6d36b","content":"\u003cp\u003eI've lost track of all my hobbies! But when I have some extra time, I like to spend it on photography, sports (basketball, volleyball, \u0026amp; flag football), playing my guitar, learning more about fashion, cooking, eating (I am such a big foodie!), fitness, collecting, gaming, and so much more! There is so much fun, adventure, and excitement in trying new things, especially the more open you are to doing it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"92e0d71d-570e-489d-b7ce-86849fefb44b\"}":{"__typename":"DeepDives","uuid":"92e0d71d-570e-489d-b7ce-86849fefb44b","content":"\u003cp\u003eRole models and mentors come in many forms and although I am grateful for all the ones who've provided me guidance, I have to say that one that has always stuck is my grandmother. She has an unmatched sympathetic, kind, and generous personality, constantly looking to help those around her regardless of what she may be doing or what is going on in her individual life. I have never been more grateful for an individual who has not only helped shape me into the person I am today, but continues to better me toward the best version of myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"215fb708-5d94-472b-aae5-26db7b3bebfd\"}":{"__typename":"School","uuid":"215fb708-5d94-472b-aae5-26db7b3bebfd","name":"Bard Early College","city":"Long Island City","type":"HIGH","state":"New York","country":"United States","zip":"11101"},"Education:{\"uuid\":\"b1eb783e-0caf-4f40-804f-b57109e94a35\"}":{"__typename":"Education","uuid":"b1eb783e-0caf-4f40-804f-b57109e94a35","school":{"__ref":"School:{\"uuid\":\"215fb708-5d94-472b-aae5-26db7b3bebfd\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"76808a57-030d-4a69-ba46-99fe74969756\"}":{"__typename":"Education","uuid":"76808a57-030d-4a69-ba46-99fe74969756","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"e8e930d7-af2f-4814-a753-49b0048a386d\"}":{"__typename":"MentorPublicProfile","uuid":"e8e930d7-af2f-4814-a753-49b0048a386d","displayName":"Erika Y.","slug":"erika-yeung","biography":"\u003cp\u003eHi! My name is \u003cstrong\u003eErika\u003c/strong\u003e, and I’m a \u003cstrong\u003esophomore at Princeton University studying Electrical and Computer Engineering.\u003c/strong\u003e I mentor students who are ambitious, curious about technology, engineering, and creative problem-solving, and want to better navigate demanding academic environments — especially those who want to explore STEM but aren’t quite sure where to start, want to build strong study habits, and learn how to mange their time while pursuing big goals!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, I was always fascinated by technology, whether that was playing new games, tinkering with an old laptop, or learning from mentors who encouraged me to dream big. Although I am drawn to STEM in many different ways, I’ve also always had a deep appreciation for the humanities, storytelling, and creativity. Many, if not most, impactful innovations happen at the intersection of these worlds, and strong thinkers are those who combine technical skills and knowledge with curiosity, empathy, and human-centered thinking to solve meaningful problems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e\u003cem\u003eA bit about my journey here!\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was a 3-sport varsity athlete tackling college-level coursework and participating in a wide range of extracurriculars. Learning to balance academics, athletics, and leadership roles taught me how to manage challenges, leverage resilience, and push myself outside of my comfort zone.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSome of my proudest experiences during that time include:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStarting a \u003cstrong\u003ementorship program \u003c/strong\u003efocused on bringing more \u003cstrong\u003eSTEM curriculum and hands-on learning \u003c/strong\u003eopportunities to \u003cstrong\u003emiddle school girls\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDesigning and building a \u003cstrong\u003erobotic hand\u003c/strong\u003e operated through buttons, motion sensors, and voice activation\u003cbr\u003e\u003c/p\u003e\u003cp\u003eConducting business-development research projects and delivering formal presentations for an \u003cstrong\u003eesports youth platform\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBuilding a fully custom Scratch game about service animals that \u003cstrong\u003ewon the 2020 Games for Change Student Challenge\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cem\u003eWhat I’m exploring now\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Princeton, I’ve continued diving deeper into fields that excite me, particularly artificial intelligence, software development, and emerging technologies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m currently working as an\u003cstrong\u003e intern at a digital platform company\u003c/strong\u003e, where I contribute to a variety of software engineering projects, and I am also \u003cstrong\u003econducting research alongside a professor exploring AI and its applications, \u003c/strong\u003econstantly learning how these systems can be used to improve education, efficiency, and accessibility.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in mentoring\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love working with students who are curious, creative, and eager to explore and learn. I believe at the very core of my mentorship is helping students succeed academically and personally, whether hands-on and/or skill building such as:\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBuilding effective study habits and academic routines\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTime management and organization for demanding schedules\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBreaking down large goals into more manageable steps\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLearning how to approach difficult problems without getting discouraged\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinding motivation and direction if interests feel uncertain\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am especially eager and passionate about helping students who may feel unsure about whether they “belong” in STEM or in competitive academic spaces. I remember how important encouragement and mentorship were for me when I was younger, and how powerful it was when someone believed in my potential; I strive to provide that same encouragement to others. \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e\u003cem\u003eHow I work with students\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy goal as a mentor is to help students feel supported, confident, and excited about learning and their future. I also focus on helping students develop skills that extend beyond a single subject — things like problem-solving, persistence, creative thinking, and soft skills, which are valuable in any field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e\u003cem\u003eWhy mentorship matters to me\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I was younger, I had big dreams, but there were times when it felt like the support around me didn’t quite match the size of those dreams. I felt like I was being indirectly told that I might be aiming too high. That’s the narrative I want to change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAmbitious students deserve mentors who encourage curiosity, validate their ideas, and help them realize what they’re capable of building. Supporting students as they discover their own passions and strengths is one of the most rewarding parts of mentorship for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e\u003cem\u003eOutside of engineering\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy list of hobbies is still growing, but I really enjoy photography (I am a production member on some dance teams at Princeton!), fitness and sports (basketball, volleyball \u0026amp; flag football), cooking, travelling, playing my guitar, fashion, gaming, and so much more! I'm also a huge foodie and love my city, (New York City!) for that reason! And a fun fact about me is that I am really particular with my water temperature and always prefer to drink it \u003cstrong\u003e\u003cu\u003eICE-COLD\u003c/u\u003e\u003c/strong\u003e or \u003cstrong\u003e\u003cu\u003eBURNING-HOT\u003c/u\u003e\u003c/strong\u003e!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eReady to get started?!\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether you’re just starting to explore STEM, need help managing and organizing your time with a challenging schedule, or just trying to figure out where your interests might lead, I’d love to help guide you along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re \u003cstrong\u003ecurious\u003c/strong\u003e, motivated, ready to explore and \u003cstrong\u003e\u003cu\u003edream BIG\u003c/u\u003e\u003c/strong\u003e, I’d love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"02t02xtXubjCv2K9WLzFXi8um8029mOivVPA2wPE4n202kM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0ec37550-bd53-469b-a5a1-1d8eed5d2d29\"}"},{"__ref":"Favorites:{\"uuid\":\"09e7cc72-e551-4fb6-b0d5-9edd2ee9b9da\"}"}],"causesSupported":[],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"75e2d5ae-1033-4c4f-ace1-05ed71b6d36b\"}"},{"__ref":"DeepDives:{\"uuid\":\"92e0d71d-570e-489d-b7ce-86849fefb44b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2117faf6-1a8b-412c-bd77-78a2cde38810/-/preview/-/format/jpg/","https://ucarecdn.com/b7dcd4ea-67f6-4da9-9f26-4276838715c4/-/preview/-/format/jpg/","htt
