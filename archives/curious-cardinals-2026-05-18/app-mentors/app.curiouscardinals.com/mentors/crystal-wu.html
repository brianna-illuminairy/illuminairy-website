xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"638ca22a-e3d4-480e-87b0-fef352c8e69c\"}":{"__typename":"Favorites","uuid":"638ca22a-e3d4-480e-87b0-fef352c8e69c","photoUrl":"https://ucarecdn.com/d378ad75-21b7-4ea1-920f-bd493a8dd609/","title":"Los Angeles","type":"CITY"},"Favorites:{\"uuid\":\"9c20713c-5750-443d-b3ff-b03ae16ec968\"}":{"__typename":"Favorites","uuid":"9c20713c-5750-443d-b3ff-b03ae16ec968","photoUrl":"https://ucarecdn.com/b001a35e-cc3f-4efa-9a20-4cfa25d463a7/","title":"Billie Eilish","type":"ARTIST"},"Favorites:{\"uuid\":\"fc0fcb91-0b2f-43c3-8a3d-0ee18be81f75\"}":{"__typename":"Favorites","uuid":"fc0fcb91-0b2f-43c3-8a3d-0ee18be81f75","photoUrl":"https://ucarecdn.com/c42574b7-1d69-4d26-9581-d56b190242f1/","title":"The Secret of Us","type":"ALBUM"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a4e04392-a76c-418f-bc42-428d7666e710\"}":{"__typename":"DeepDives","uuid":"a4e04392-a76c-418f-bc42-428d7666e710","content":"\u003cp\u003eI chose to study Applied Math–Economics and Behavioral Decision Sciences because together, they give me a unique lens to examine both the \u003cem\u003equantitative\u003c/em\u003e and \u003cem\u003epsychological\u003c/em\u003e sides of human behavior. Applied Math–Economics equips me with the analytical tools to model complex systems, interpret data, and understand the incentives that drive economic and organizational decisions. Behavioral Decision Sciences, on the other hand, helps me explore the cognitive biases, social influences, and emotional factors that traditional models often overlook. Studying both allows me to bridge the gap between numbers and nuance—between what people \u003cem\u003eshould\u003c/em\u003e do and what they \u003cem\u003eactually\u003c/em\u003e do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"aa23b79a-bcb2-4105-95f7-fddb224098e5\"}":{"__typename":"DeepDives","uuid":"aa23b79a-bcb2-4105-95f7-fddb224098e5","content":"\u003cp\u003eCompeting in business conferences while traveling and exploring new cities with friends! I've explored Chicago, Atlanta, and Orlando!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5b9b202f-cc5a-45ac-abaf-efcb27c9c5c2\"}":{"__typename":"DeepDives","uuid":"5b9b202f-cc5a-45ac-abaf-efcb27c9c5c2","content":"\u003cp\u003eI like to crochet amigurumi, drink boba or matcha, and taking photos at photo booths with friends. Also scrolling on TikTok!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2e40d9a1-d1b0-4e1e-b996-88f573ff787f\"}":{"__typename":"DeepDives","uuid":"2e40d9a1-d1b0-4e1e-b996-88f573ff787f","content":"\u003cp\u003e\"Sometimes life doesn’t give you what you want, not because you don’t deserve it, but because you deserve so much more.\"\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"7625f47d-a286-42a9-badf-a0539e97575a\"}":{"__typename":"School","uuid":"7625f47d-a286-42a9-badf-a0539e97575a","name":"Los Osos High School","city":"Rancho Cucamonga","type":"HIGH","state":"California","country":"United States","zip":"91737"},"Education:{\"uuid\":\"64891683-f94f-4c18-aa59-15629f0a67c9\"}":{"__typename":"Education","uuid":"64891683-f94f-4c18-aa59-15629f0a67c9","school":{"__ref":"School:{\"uuid\":\"7625f47d-a286-42a9-badf-a0539e97575a\"}"},"startYear":"2020","endYear":"20224","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"5d96d1cf-b7ac-4a45-9b01-c02ac242b3de\"}":{"__typename":"Education","uuid":"5d96d1cf-b7ac-4a45-9b01-c02ac242b3de","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Applied Math Economics \u0026 Behavioral Decision Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"bc2a0d6a-d9c7-46ba-a7aa-fc60bcd90583\"}":{"__typename":"MentorPublicProfile","uuid":"bc2a0d6a-d9c7-46ba-a7aa-fc60bcd90583","displayName":"Crystal W.","slug":"crystal-wu","biography":"\u003cp\u003eHi! I’m Crystal, a rising sophomore at Brown University studying Applied-Math Economics and Behavioral Decision Sciences with a strong interest in understanding what drives decision-making, how thoughtful design can influence behavior, and how data can inform innovative strategies. At the heart of everything I do is a passion for learning and helping others feel confident and supported in their own journey.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy approach to tutoring is rooted in empathy, structure, and curiosity. I know firsthand that learning isn't always a straight path, and I believe that every student benefits from having someone who truly listens and meets them where they are. I strive to create an environment where students feel encouraged to ask questions, make mistakes, and build lasting confidence in their own abilities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I am involved in my school’s student government, serving as the Public Relations officer. I organize engaging events, collaborating with local vendors, and creating capturing campaigns to promote diversity, inclusion, and community engagement. I am also involved in my school’s Women in Business organization and Brown Marketing Club, where I develop[ skills in strategic thinking and teamwork, skills I bring to every session.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eIn my free time, I enjoy spending time with loved ones, traveling to new cities or countries, and exploring new cultures and cuisines. I also enjoy capturing these memories through photo booths and other memorabilia. \u003cbr\u003e\u003cbr\u003eOne of my favorite memorabilia I own is a tablecloth with hundreds of signatures from members across the state of California as I was running for state office. During my senior year of high school, I had the honor to serve as the California State Future Business of Leaders of America (FBLA) Public Relations officer, representing over 10,000 students and planning several conferences on the regional and state level. In this experience, I have developed confidence in leadership, organization, and communication, skills that are essential to success as a mentor here. I’m here to support students not only in reaching their academic goals, but in building the kind of mindset and skills that last far beyond the classroom. I’d love the opportunity to work with you or your student and be part of that journey.\u003c/p\u003e","teachingVideoPlaybackId":"eHSezlylqfsOVmtQTJ44f00f00zoSHeK4yocQOG3vO1wo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing the paver of my own path! Growing up as the older sister and not having mentors too look up to, I am proud of my drive and resilience to bring me to where I am today. From serving at the State level of FBLA, to navigating the college admission process alone, to getting accepted to Brown early, I am proud of my ambition and ability to achieve my goals.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"638ca22a-e3d4-480e-87b0-fef352c8e69c\"}"},{"__ref":"Favorites:{\"uuid\":\"9c20713c-5750-443d-b3ff-b03ae16ec968\"}"},{"__ref":"Favorites:{\"uuid\":\"fc0fcb91-0b2f-43c3-8a3d-0ee18be81f75\"}"}],"causesSupported":[],"major":"Applied Math Economics \u0026 Behavioral Decision Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a4e04392-a76c-418f-bc42-428d7666e710\"}"},{"__ref":"DeepDives:{\"uuid\":\"aa23b79a-bcb2-4105-95f7-fddb224098e5\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b9b202f-cc5a-45ac-abaf-efcb27c9c5c2\"}"},{"__ref":"DeepDives:{\"uuid\":\"2e40d9a1-d1b0-4e1e-b996-88f573ff787f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7509729c-7648-457e-b607-4a84389a24f1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"64891683-f94f-4c18-aa59-15629f0a67c9\"}"},{"__ref":"Education:{\"uuid\":\"5d96d1cf-b7ac-4a45-9b01-c02ac242b3de\"}"}],"hiredAt":"2025-05-01T00:03:26.788Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Statistics","6-8 Grade Science","Academic Coaching","Executive Function","College Essay Writing","Economics"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"crystal-wu\"}})":{"__ref":"MentorPublicProfile:{
