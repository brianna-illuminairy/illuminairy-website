":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"fe25ee20-9538-4f50-816d-2623585ecf7d\"}":{"__typename":"Education","uuid":"fe25ee20-9538-4f50-816d-2623585ecf7d","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2dd9e1bb-7ef4-4ddb-9319-5bebe85b2388\"}":{"__typename":"MentorPublicProfile","uuid":"2dd9e1bb-7ef4-4ddb-9319-5bebe85b2388","displayName":"MATTEO L.","slug":"matteo-lecat-1","biography":"\u003cp\u003eHi! My name is Matteo, and I am a student at UCLA pursuing a major in Political Science and a minor in Biomedical Research.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'd say my favorite thing about life is getting to know other people. I was born in France and moved to Los Angeles when I was 10 years old. Moving to a new country was both a golden opportunity, gleaming with excitement, and a tough challenge. Aside from learning English, I found difficulty in acclimating myself to a brand-new environment with new people and a brand-new school. However, looking back at my journey, this part of my life proves to be very dear to me and was filled with many wonderful people who helped me along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne lesson I learned was to never give up on your dreams; I did not get into my dream college on my first try. Instead, I went to UC Davis and yet I persevered and never lost sight of the big picture. I worked hard and persevered and reapplied to UCLA and got in!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy time in Davis proved to proved to be transformative and solidified my passion for medicine. I figured out that my passion in life was to help others, build a connection with them, and spread hope. At UCLA, I involved myself as much as possible in the medical world. I joined a lab and started doing research as an undergraduate assistant. I joined several clubs in which I got to shadow doctors in the Emergency Room and provide medical services to the homeless community of Los Angeles. Through these experiences, I met amazing individuals who's passion in their careers reinvigorated my own. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy favorite part of the various extra-curricular activities that I joined is that they helped me get involved at the heart of my community and enabled me to weave connections with patients that I was lucky to serve in my time. I saw closely the role that education plays in changing lives and decided that I wanted to get involved directly in helping others on their academic journeys. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my focus on biomedical research, my political science concentration has provided me with a unique perspective on the interconnection of politics and medicine. I saw firsthand how our political system plays a huge role in the quality of medical care that many individuals around the country receive. It has inspired me to emphasize the importance of equal medical care in my own career.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAside from career focused activities, I love to sail, play the guitar, and go hiking with my friends.\u003c/p\u003e","teachingVideoPlaybackId":"TrfoD01MqWz9LFVZI4CSJy0002Dy2WSA02Cx1wrHUDTz00JY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8669072a-38ac-41df-807e-89a07f68a026\"}"},{"__ref":"Favorites:{\"uuid\":\"cd0d8cb5-a006-41fe-b5a2-226948a7615d\"}"},{"__ref":"Favorites:{\"uuid\":\"47a8af3c-5e6d-4844-a728-05ea198700dd\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"043d2c56-8df1-417c-b1b0-5ca47bce96ba\"}"}],"major":"Political Science","deepDives":[{"__
