y-bernstein","biography":"\u003cp\u003eHello everybody! My name is Jeremy and I'm excited to share my interest in all things science. I grew up outside of Chicago and am currently senior at Northwestern University studying biology and have background in physics, chemistry, and mathematics. All of these subjects are fun for me because I get to spend half the time working through problems and understanding the content and the other half of the time sitting back and imagining how the things I study happen right in front of me and in the world I live in. I hope to share this excitement! I'm interested in attending medical school following my graduation. In my free time I like to play guitar, sports and explore the outdoors. I've been in a couple different bands which have all been great experiences and have taught me great teamwork skills. I'm a big fan of classic rock, blues, funk, and electronic music. Before college I participated in science olympiad bridge building, bottle rocket, and robotics competitions. The intersection of creativity and science has always been fascinating to me and a headspace I have felt very comfortable in. Through all these activities I like to keep a bright attitude, a sense of humor, and a willingness to learn and make mistakes. I'm looking forward to working with students who are looking for academic support, interested in science, or just want to talk about school! \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"aa74a77e-e6ff-4d9a-a69e-e2b1d22584ea\"}"},{"__ref":"DeepDives:{\"uuid\":\"7603c9dd-9880-40b9-b635-374a2eaabab8\"}"},{"__ref":"DeepDives:{\"uuid\":\"9265a047-ad0a-4a99-8b9b-0c746e433b9b\"}"},{"__ref":"DeepDives:{\"uuid\":\"909fc5f7-4b2f-402e-8f3a-fc7116445f92\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/901e8587-492a-4ca2-b07f-b108854d9ea1/-/preview/-
