xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"20d0cdf7-44a6-47c1-9484-a4ec4957bb17\"}":{"__typename":"DeepDives","uuid":"20d0cdf7-44a6-47c1-9484-a4ec4957bb17","content":"\u003cp\u003eI would tell my middle and high school self to trust the process and not stress so much about having everything figured out. It’s okay to explore different interests and not have a rigid plan—sometimes the best opportunities come from unexpected places. I would also remind myself that confidence comes from experience, and it’s okay to make mistakes as long as you learn from them. Whether it’s public speaking, leadership, or even just navigating friendships and school, stepping outside of my comfort zone would only help me grow.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1b8e2828-192b-4734-93aa-18329d8eae91\"}":{"__typename":"DeepDives","uuid":"1b8e2828-192b-4734-93aa-18329d8eae91","content":"\u003cp\u003eMentorship matters to me because I’ve seen firsthand how the right guidance can shape someone’s confidence, skills, and future opportunities. Throughout my own journey—whether in academics, internships, or leadership roles—I have benefited from mentors who took the time to share their insights and push me to grow. Their support helped me take on challenges I might have otherwise shied away from.  Now, I love being able to do the same for others. Whether it’s helping a student refine their resume, practice for an interview, or develop stronger communication skills, I find it incredibly rewarding to see someone gain confidence and succeed. Mentorship isn’t just about giving advice—it’s about empowering people to recognize their own potential and take the next step toward their goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"17cf1dd6-428a-4fb5-a579-01d07be98a8d\"}":{"__typename":"DeepDives","uuid":"17cf1dd6-428a-4fb5-a579-01d07be98a8d","content":"\u003cp\u003eIn my spare time, I love to stay active by skiing whenever I can and exploring new places through travel. I enjoy spending time with friends, whether it’s catching up over a meal or just hanging out. When I need to relax, I’ll often unwind with a good movie or challenge myself with logic puzzles—it’s a fun way to keep my mind sharp while doing something enjoyable.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c8361c30-b63c-4f26-8bc6-9ddd5f53c0f9\"}":{"__typename":"DeepDives","uuid":"c8361c30-b63c-4f26-8bc6-9ddd5f53c0f9","content":"\u003cp\u003eIn high school, I spent my summers at sleepaway camp, where I not only had fun but also developed important teamwork and leadership skills. One summer, I also attended a summer program in Barcelona, which was a truly life-changing experience. It broadened my perspective, allowing me to immerse myself in a new culture, learn Spanish, and make lifelong memories. The experience really sparked my interest in travel and international connections, something I’ve continued to value throughout my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"e31f68bc-b89e-40bd-a43e-d87a962b4cf6\"}":{"__typename":"School","uuid":"e31f68bc-b89e-40bd-a43e-d87a962b4cf6","name":"Watchung Hills Regional High School","city":"Warren","type":"HIGH","state":"New Jersey","country":"United States","zip":"07059"},"Education:{\"uuid\":\"1415b8ff-3833-43d0-ac0e-e3775aafe04a\"}":{"__typename":"Education","uuid":"1415b8ff-3833-43d0-ac0e-e3775aafe04a","school":{"__ref":"School:{\"uuid\":\"e31f68bc-b89e-40bd-a43e-d87a962b4cf6\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"60295eab-9ce5-40b8-aae7-c3e2dcde37ed\"}":{"__typename":"Education","uuid":"60295eab-9ce5-40b8-aae7-c3e2dcde37ed","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Management, Accounting","degree":null},"MentorPublicProfile:{\"uuid\":\"1832a6d0-1967-4412-8fac-422f30a92a15\"}":{"__typename":"MentorPublicProfile","uuid":"1832a6d0-1967-4412-8fac-422f30a92a15","displayName":"Jordyn Y.","slug":"jordyn-youngelson-1","biography":"\u003cp\u003eHi! I’m Jordyn, a senior at the University of Pennsylvania’s Wharton School studying Management and Accounting. I have a strong foundation of business knowledge, completing the Wharton core curriculum that includes courses in finance, marketing, operations, statistics, and more. Outside of the classroom, I have completed four internships in consulting and private equity, gaining first hand experience in strategy, financial analysis, and problem-solving. After graduation, I will be working as a strategy consultant, helping businesses tackle complex challenges.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my studies, I am passionate about mentorship and professional development. As a Teaching Assistant for Business Communication for Impact, I work closely with students on refining their public speaking, writing, and presentation skills. I have helped students craft compelling resumes, write professional emails, and prepare for interviews with confidence. Additionally, my leadership roles in student organizations have given me experience in guiding teams and structuring clear, persuasive communication.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy approach to tutoring is supportive and tailored to each student’s needs. Whether you’re looking to strengthen your business knowledge, improve your public speaking, or polish your resume and interview skills, I’m here to help. My goal is to build your confidence so that you can present yourself and your ideas effectively, both in the classroom and in your future career.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLooking forward to working together!\u003c/p\u003e","teachingVideoPlaybackId":"nYPd01nj02sP01Mkfwv945KbtplewGKXTydrPnWyjMbHQg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Management, Accounting","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"20d0cdf7-44a6-47c1-9484-a4ec4957bb17\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b8e2828-192b-4734-93aa-18329d8eae91\"}"},{"__ref":"DeepDives:{\"uuid\":\"17cf1dd6-428a-4fb5-a579-01d07be98a8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"c8361c30-b63c-4f26-8bc6-9ddd5f53c0f9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/311967a2-d2a3-4bbb-b903-75260944e204
