xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"66b6b1c9-fa44-40f4-9de9-e901d07721f2\"}":{"__typename":"DeepDives","uuid":"66b6b1c9-fa44-40f4-9de9-e901d07721f2","content":"\u003cp\u003eLike many people, I’ve always had that inner child who would stare up at the night sky, filled with wonder about the vastness of space. For me, that curiosity never faded. It grew into a passion that led me to choose aerospace as my major. What excites me about this field is that we get to work on projects that are bigger than ourselves, constantly pushing boundaries. Plus, the innovations that come from aerospace often have a ripple effect, impacting other areas of life. Being part of something that fuels both exploration and innovation feels incredibly meaningful to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9e0b9ae4-bf53-4e8a-88d8-b4e606f29ffc\"}":{"__typename":"DeepDives","uuid":"9e0b9ae4-bf53-4e8a-88d8-b4e606f29ffc","content":"\u003cp\u003eMentorship is important to me because it goes far beyond just teaching technical concepts or guiding someone through a project. It’s about building a connection and sharing the world I live in with someone else. While it’s hard for one person to change the entire world, we all have the power to change someone’s world. That’s why I want to be a positive influence—to help others grow, explore new possibilities, and make an impact in their own lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"3beb122e-fcab-43ff-8943-449adb102e50\"}":{"__typename":"DeepDives","uuid":"3beb122e-fcab-43ff-8943-449adb102e50","content":"\u003cp\u003eI'm extremely proud of my 19-year-old self for making the decision to move abroad to a place where I had no family or relatives, and for building a life from scratch. Starting out in a country where the language, culture, and everything else was completely different was a challenge that not everyone gets to experience. But I grew so much from it. That journey has given me the confidence that I can achieve anything if I put my mind to it, and I’m proud of how far I’ve come since then.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8a1e3b74-3ef5-40a0-8e03-665b2fa53570\"}":{"__typename":"DeepDives","uuid":"8a1e3b74-3ef5-40a0-8e03-665b2fa53570","content":"\u003cp\u003eIn my spare time, I love learning about sociology and geopolitics because it helps me better understand the diverse ways people live and interact around the world. By exploring different cultures, social dynamics, and political systems, I gain a deeper appreciation for how individuals make decisions and navigate their environments. It enriches my perspective and helps me connect more meaningfully with people from all walks of life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"94f8684a-4d2a-4043-80a5-d8b0235cbe5c\"}":{"__typename":"Education","uuid":"94f8684a-4d2a-4043-80a5-d8b0235cbe5c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Aeronautics and Astronautics","degree":null},"School:{\"uuid\":\"0eca4c60-9c9e-4b7a-9238-8a3611ab7e4d\"}":{"__typename":"School","uuid":"0eca4c60-9c9e-4b7a-9238-8a3611ab7e4d","name":"Jinseon Girls' High School","city":"Gangnam-gu","type":"HIGH","state":"Seoul","country":"South Korea","zip":"06213"},"Education:{\"uuid\":\"0ccbf295-94b4-4439-afc2-8df082fd503a\"}":{"__typename":"Education","uuid":"0ccbf295-94b4-4439-afc2-8df082fd503a","school":{"__ref":"School:{\"uuid\":\"0eca4c60-9c9e-4b7a-9238-8a3611ab7e4d\"}"},"startYear":"2013","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"6bd7b77c-ee91-4c56-be6e-0541c5cb46b6\"}":{"__typename":"MentorPublicProfile","uuid":"6bd7b77c-ee91-4c56-be6e-0541c5cb46b6","displayName":"Jungeun P.","slug":"jung-eun","biography":"\u003cp\u003eJungeun is an aerospace engineer based in San Francisco, California. Originally from Seoul, Korea, she has been living in the United States for nearly a decade. Her passion for exploring what lies beyond our planet led her to pursue a degree in aerospace engineering from Penn State, followed by a master’s degree in aeronautics and astronautics from Stanford University. At Stanford, Jungeun specialized in aerospace structures, particularly in deployable space structures, where she combined her love for both art and engineering to design innovative solutions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring her college years, Jungeun engaged in various aerospace structures and materials research projects, including building Martian habitats, developing underwater drones, and advancing the application of composite materials. She also devoted much of her time to promoting diversity and inclusion for minorities in STEM and participating in STEM outreach programs for elementary students, inspiring the next generation of engineers and scientists.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of engineering, Jungeun has a keen interest in sociology, psychology, and geopolitics. Growing up in different cities and countries, she was exposed to a wide range of environments and perspectives, which shaped her understanding of how culture, politics, and economics influence human behavior and society. This background has equipped her with a unique lens through which she views the world, appreciating the interconnectedness of various disciplines.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn her free time, Jungeun enjoys exploring new cities, taking cooking classes, and attending live performances— whether it's theater, concerts, or comedy shows. She finds that immersing herself in diverse experiences not only broadens her perspective but also gives her stories and lessons to share with others. Jungeun loves having deep, thought-provoking conversations over coffee at a park or a cozy café. She’s always on the lookout for new experiences that allow her to learn and grow, and she genuinely enjoys connecting with people who have different backgrounds and viewpoints. Jungeun believes that these shared experiences make mentorship more meaningful and create a space where both mentors and mentees can inspire each other.\u003c/p\u003e","teachingVideoPlaybackId":"01bfUR1R4302XDk50002IUsrIowPoaQ4WWUc8gtdUs2NFxM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Aeronautics and Astronautics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"66b6b1c9-fa44-40f4-9de9-e901d07721f2\"}"},{"__ref":"DeepDives:{\"uuid\":\"9e0b9ae4-bf53-4e8a-88d8-b4e606f29ffc\"}"},{"__ref":"DeepDives:{\"uuid\":\"3beb122e-fcab-43ff-8943-449adb102e50\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a1e3b74-3ef5-40a0-8e03-665b2fa53570\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6ec71c57-eb06-4e70-b767-425958eba5db/-/preview/-/format/jpg/","https://ucarecdn.com/8820548b-9c57-46a7-b060-1c113b7c684a/-/preview/-/format/jpg/","https://ucarecdn.com/7c21d5a6-fa46-474a-9b68-429551d6c9ed/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"94f8684a-4d2a-4043-80a5-d8b0235cbe5c\"}"},{"__ref":"Education:{\"uuid\":\"0ccbf295-94b4-4439-afc2-8df082fd503a\"}"}],"hiredAt":"2024-10-10T14:34:37.104Z","topics":["Aviation / Aerospace","Law / Government / Policy","World Cultures","Physics","Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Korean","Academic Coaching","Executive Function","STEM Project","Journalism","6-8 Grade Science"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/9f7019f6-5b03-4f9f-a136-5aeaf2c62de6/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jung-eun\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6bd7b77c-ee91-4c56-be6e-0541c5cb46b6\"}"}}},"_sentryTraceData":"66af3eead0434372a9d46c2174015f69-b084ac059cd634ed-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=66af3eead0434372a9d46c2174015f69,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry
