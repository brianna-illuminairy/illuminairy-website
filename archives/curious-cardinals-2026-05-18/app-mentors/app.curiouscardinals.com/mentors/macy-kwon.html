xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5ab2754e-71c5-4765-a81b-16e220c95f43\"}":{"__typename":"Favorites","uuid":"5ab2754e-71c5-4765-a81b-16e220c95f43","photoUrl":"https://ucarecdn.com/599599ba-5fc0-4e21-8b3e-9bd3b7df2c82/","title":"Moonlight","type":"MOVIE"},"Favorites:{\"uuid\":\"4854a04e-0595-4df3-a2fa-4569c72b3203\"}":{"__typename":"Favorites","uuid":"4854a04e-0595-4df3-a2fa-4569c72b3203","photoUrl":"https://ucarecdn.com/b27ef8ec-7628-4a81-9232-67bce3c9c59f/","title":"Kim Whanki","type":"ARTIST"},"Favorites:{\"uuid\":\"c66d7cad-f477-499e-89e6-1686d24a24e4\"}":{"__typename":"Favorites","uuid":"c66d7cad-f477-499e-89e6-1686d24a24e4","photoUrl":"https://ucarecdn.com/4d1f1e20-c069-4e54-8a14-0e2eec27b73d/","title":"Night Sky with Exit Wounds","type":"BOOK"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"2aa65796-c245-4226-aae9-a2ac12738fea\"}":{"__typename":"DeepDives","uuid":"2aa65796-c245-4226-aae9-a2ac12738fea","content":"\u003cp\u003eAs an avid hiker and traveler, I've chased sunsets and sunrises across glaciers in Iceland, jungles in Peru, and along the shores of Morocco. The act of watching darkness fall or the sky come alive with color often brings to mind a quote from \u003cem\u003eThe Little Prince\u003c/em\u003e: \"Quand on est tellement triste, on aime les couchers de soleil\" (when one is so sad, one loves the sunset). It captures the quiet beauty of those moments. One day, I hope to earn my pilot's license, soaring above the clouds to watch the sun paint the sky from a foreign and unique vantage, flying to new horizons, yonder.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"97d19113-fe81-4107-9da7-d90f1dacde6f\"}":{"__typename":"DeepDives","uuid":"97d19113-fe81-4107-9da7-d90f1dacde6f","content":"\u003cp\u003eAt unexpected hours of the day, whenever my local ceramic studio has open hours, I find myself shaping clay into jewelry. While I've always been captivated by the aesthetics of jewelry and its role in adornment, my ceramic projects—particularly my clay rings—are often reflections of the literature I’m reading and writing. For instance, during a period when I became enamored with the feminist poet Kim Hyesoon, my rings and accessories took on the form of flying pigs and anatomically correct hearts, images that appear in her poetry. Each piece I create serves as a tangible connection to the words and ideas that preoccupy my mind. My ceramic work might be seen as my take on the saying \"you are what you eat,\" only in my case, it's more like \"you are what you read and think.\"\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c5aa8d78-3a6a-4adc-944b-51e81124ad43\"}":{"__typename":"DeepDives","uuid":"c5aa8d78-3a6a-4adc-944b-51e81124ad43","content":"\u003cp\u003eLike many curious students and readers, I became utterly captivated by Greek and Roman mythology. The idea of ancient empires rising and falling at the whims of power, knowledge, and innovation was both alien and fascinating to me. The stories of mortals daring to defy gods, chosen warriors embarking on epic quests, and tragic love stories crossing the realms of the living and the dead held me spellbound. I knew I needed to learn more, to engage directly with the ancient sources. So, I spent my summers studying Latin at nearby colleges and, through a series of incredible opportunities, traveled to Florence to read Catullus, Lucretius, and explore ancient artifacts housed in the Uffizi and the Academy of Florence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"eb6e10e4-909c-4b25-aec9-e0d5178c624e\"}":{"__typename":"DeepDives","uuid":"eb6e10e4-909c-4b25-aec9-e0d5178c624e","content":"\u003cp\u003eMy journey learning more about my Korean identity and heritage demanded that I trek across significant language barriers. To know more about my family's diaspora and culture meant conducting discourse and heavy, complex conversations with my monolingual Korean-speaking grandmother. While I was in 5th to sixth grade when I began inquiring more about who I am and how much my heritage informs how I conduct myself, I found myself looking towards a non-linear journey of language learning, yes, but also experimentation. I bounced from Korean dramas and media to music to literature to connections to community and on. My process learning and exploring each facet of culture, language, and community allowed me to realized that the process of learning is nuanced and different for each person. The \"success\" of learning is often impacted by the student's environment, systems of support, and learning style. Thus, as a teacher, I allow awareness of the student's external environment, state of being, and style of learning to inform their personalized lessons. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"8839bf17-9b92-4b3c-b970-953b21ab9771\"}":{"__typename":"School","uuid":"8839bf17-9b92-4b3c-b970-953b21ab9771","name":"Cleveland High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91335"},"Education:{\"uuid\":\"51a4793f-88d3-449f-a11c-aa3f17e121c2\"}":{"__typename":"Education","uuid":"51a4793f-88d3-449f-a11c-aa3f17e121c2","school":{"__ref":"School:{\"uuid\":\"8839bf17-9b92-4b3c-b970-953b21ab9771\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"04b68b50-2bf6-48e2-8a21-807cef3d5a6f\"}":{"__typename":"Education","uuid":"04b68b50-2bf6-48e2-8a21-807cef3d5a6f","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Comparative Literature","degree":null},"MentorPublicProfile:{\"uuid\":\"1011ebfc-fbba-48ce-a3e2-27727a6bdf5e\"}":{"__typename":"MentorPublicProfile","uuid":"1011ebfc-fbba-48ce-a3e2-27727a6bdf5e","displayName":"Macy K.","slug":"macy-kwon","biography":"\u003cp\u003eHello!\u003c/p\u003e\u003cp\u003eWhat if I began by telling you about my love for the color blue? In her book \u003cem\u003eBluets\u003c/em\u003e, poet Maggie Nelson opens with reflections on blue objects and blue people, each carrying pieces of grief and heartbreak. Long before I read her work, I had already fallen inarticulately in love with Kim Whanki's blues. These shades became the starting point for my own poetry, helping me understand the complexities of my origin story and the fragmented memories of my family’s immigration—reimagined through language barriers, art movements, and silence.\u003c/p\u003e\u003cp\u003eMy fascination with blue has profoundly shaped my journey. It has inspired independent projects with Princeton's archives, earned me Lewis Art Grants to create blue-themed poems and ceramics in places such as Chefchaouen, Sicily, Paris, and Porto, and sparked my exploration of blue’s significance in ocean studies and postcolonial contexts, particularly within the French Caribbean and South Korea. As a Comparative Literature major at Princeton, with minors in Gender and Sexuality Studies and American Studies, I am currently engaged in analyzing the allegories of blue that emerge from these two regions.\u003c/p\u003e\u003cp\u003eMy pursuit of blue pushed me to study Arabic, dive into France's national archive, and venture into challenging fields like environmental ecologies. In short, this curiosity has woven its way through everything I do—from poetry and journalism to research and creative projects. My love for blue serves as a metaphor for the depth of my approach to learning and the way I inspire that same passion for discovery in my students.\u003c/p\u003e\u003cp\u003eThroughout my career, I've had the privilege of wearing many hats: as a student journalist with L.A. Times affiliates, organizing global literacy campaigns and book drives as a social activist, and publishing poetry. After joining Princeton, I expanded my horizons even further—reporting on the art and poetry scene in Rabat, Morocco, exploring Korean literature through a publishing internship in South Korea, and leading art tours in Aix-en-Provence, France. On campus, I serve as a global ambassador, mentoring peers as they explore professional opportunities abroad.\u003c/p\u003e\u003cp\u003eAt the core of my work is a deep love for languages. For me, language isn’t just a tool to unlock understanding of art, culture, philosophy, and poetics; it's a bridge that connects people, fosters conversation, and builds identity. I firmly believe that the skills of intercultural communication are essential for connecting stories across time and place and for designing creative projects that engage with the world in thoughtful, global ways. My teaching philosophy embraces this by encouraging critical, global reflection while tailoring lessons to each student’s unique learning style—whether that’s through logic-based reasoning or visual, creative methods. Through my own ongoing journey of learning French, Arabic, Spanish, Latin, Korean, and ASL, I’ve found that no single method works for everyone. I thrive on sharing this love of language with students, whether it’s looking at Toni Morrison’s writings alongside her personal archive or leading feminist Korean literature circles at Princeton.\u003c/p\u003e\u003cp\u003eI’m deeply passionate about the power of art and the humanities to shape social and intellectual movements, and I’m always experimenting with new ways to make these subjects come alive for students.\u003c/p\u003e\u003cp\u003eI look forward to the opportunity to work together.\u003c/p\u003e\u003cp\u003eAll the best,\u003cbr\u003eMacy\u003c/p\u003e","teachingVideoPlaybackId":"8F7JdjsD3HiggGaFTTwi2oyfu8fZksoTBAzQmApMBCk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"5ab2754e-71c5-4765-a81b-16e220c95f43\"}"},{"__ref":"Favorites:{\"uuid\":\"4854a04e-0595-4df3-a2fa-4569c72b3203\"}"},{"__ref":"Favorites:{\"uuid\":\"c66d7cad-f477-499e-89e6-1686d24a24e4\"}"}],"causesSupported":[],"major":"Comparative Literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2aa65796-c245-4226-aae9-a2ac12738fea\"}"},{"__ref":"DeepDives:{\"uuid\":\"97d19113-fe81-4107-9da7-d90f1dacde6f\"}"},{"__ref":"DeepDives:{\"uuid\":\"c5aa8d78-3a6a-4adc-944b-51e81124ad43\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb6e10e4-909c-4b25-aec9-e0d5178c624e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/12d32aee-0d3
