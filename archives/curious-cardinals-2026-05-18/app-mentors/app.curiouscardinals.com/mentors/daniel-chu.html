-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"20d1f15c-4112-4981-b80b-a35fd9c8fdec\"}":{"__typename":"DeepDives","uuid":"20d1f15c-4112-4981-b80b-a35fd9c8fdec","content":null,"videoPlaybackId":"Uo2xMYac702xuqLIErdagcKMOC8DH0101CQVeRsKVT2HQc","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"eac2609d-06fb-46fb-badf-c2129f0fa46f\"}":{"__typename":"DeepDives","uuid":"eac2609d-06fb-46fb-badf-c2129f0fa46f","content":null,"videoPlaybackId":"Kwramj1LR01EBrvlk2QhRCiXDLyjvkdH7szfHNvyM00jg","question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"1d2eb187-2670-4cd8-82a5-41d1e58c3696\"}":{"__typename":"School","uuid":"1d2eb187-2670-4cd8-82a5-41d1e58c3696","name":"Bellarmine College Preparatory","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95126"},"Education:{\"uuid\":\"88cb245d-2306-4317-98a1-26d4095131b7\"}":{"__typename":"Education","uuid":"88cb245d-2306-4317-98a1-26d4095131b7","school":{"__ref":"School:{\"uuid\":\"1d2eb187-2670-4cd8-82a5-41d1e58c3696\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"d89cf2af-4e68-430a-8472-fe2102f6efd7\"}":{"__typename":"Education","uuid":"d89cf2af-4e68-430a-8472-fe2102f6efd7","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Business Administration","degree":null},"MentorPublicProfile:{\"uuid\":\"c98343eb-cd85-4c08-97c4-04d80a8b0c8b\"}":{"__typename":"MentorPublicProfile","uuid":"c98343eb-cd85-4c08-97c4-04d80a8b0c8b","displayName":"Daniel C.","slug":"daniel-chu","biography":"\u003cp\u003eHi! I’m Daniel, a current freshman at UC Berkeley studying Business Administration with an intended double major in Industrial Engineering. One of my core values has always been mentorship and transparency, which is why I’m excited to work with students to develop their passion projects or academic performance based on my own past experiences and insights.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, at UC Berkeley, I’m a consultant for the Association for Socially Responsible Business, an ESG consulting organization. One example project I’m working on this semester is in partnership with Google, where we’re developing an educational curriculum to promote human rights in hyperscale provider supply chains. I’m also part of the Research and Governance Department at Blockchain @ Berkeley, which focuses on regulations and proposals in the blockchain and cryptocurrency space. As a result, some of my main interests and causes are sustainability, fintech, and business strategy.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was involved in similar organizations: in addition to the school newspaper and speech and debate team, I was the Co-President of our Economics Club, where I taught micro- and macroeconomics concepts to peers in preparation for competitions. One major achievement (which might be of interest to students!) was placing 2nd in the northern California finals for the National Economics Challenge. I also served as the Operations Director of Art of the Heart, a nonprofit organizing musical concerts for the elderly, where I engaged with a variety of business areas like marketing, operations, and finance, by leading programs expansions, fundraising efforts, and Board of Directors meetings. In addition, I was part of the City of Cupertino’s Youth Activity Board, where I helped lead social, professional, and educational activities for local youth as the Secretary my first year and President my second year. As a result, I’ve explored a lot of different opportunities for leadership, civic engagement, and nonprofit work.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnother large part of my background is academic research. I started out in the California State Summer School for Mathematics and Science (COSMOS) at UC Santa Cruz, where I researched anaerobic wastewater treatment and environmental engineering. The year after, I participated in UC Santa Barbara’s Summer Research Academies, during which I used cultural studies and theoretical frameworks to analyze the stigmatization of drug use in Black communities. The following school year, I also had the opportunity to work with faculty at Santa Clara University in developing a curriculum for computational biology for high school and college students. Finally, during the summer before my senior year, I took part in UC Santa Barbara’s Research Mentorship Program, where I studied blockchain economics, specifically transaction ordering and sequencing rules to prevent maximal extractable value profit generation.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, I’ve continued working in academia as part of the Haas HIGHER Lab, which studies social psychology. My research investigates Asian American cultural experiences and racial statuses in the US through lenses like realistic and symbolic threat and Asian American panethnicity.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a CC mentor, I would absolutely love to work with students on topics related to the extracurriculars I’ve participated in, the research I’ve done, or whatever classes they find interesting! I’m excited to share my experiences with mentees in hopes that I can provide some guidance and clarity for them to develop their own passions and interests.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"ci6fBupKqKglnbqFZr7fj2Lo96LYpRiZYwYGeXu7NVw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"623b5af6-64ef-45d2-bf3a-df71b259ed95\"}"},{"__ref":"Favorites:{\"uuid\":\"b707cfa0-88ad-48ae-b4ae-da98a2411043\"}"},{"__ref":"Favorites:{\"uuid\":\"3aadf74b-1421-4dac-a9dd-8056725650cb\"}"}],"causesSupported":[],"major":"Business Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ce2f0692-c414-40fb-aff8-8c9126c1e927\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e7da48d-c225-4a55-9941-e25a9cb69122\"}"},{"__ref":"DeepDives:{\"uuid\":\"20d1f15c-4112-4981-b80b-a35fd9c8fdec\"}"},{"__ref":"DeepDives:{\"uuid\":\"eac2609d-06fb-46fb-badf-c2129f0fa46f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dd04d853-331c-4816-aaf2-4936208c2b3e/-/preview/-/format/jpg/","https://ucarecdn.com/25854125-ca41-488e-a5a2-89136a6d1b1c/-/preview/-/format/jpg/","https://ucarecdn.com/6aba0be9-5036-4d4a-b5df-7e4781241681/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"88cb245d-2306-4317-98a1-26d4095131b7\"}"},{"__ref":"Education:{\"uuid\":\"d89cf2af-4e68-430a-8472-fe2102f6efd7\"}"}],"hiredAt":"2025-12-02T16:56:10.353Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Writing","Mandarin Chinese","Spanish","Academic Coaching","College Essay Writing","Reading","Sustainability"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/9a4c114f-3114-4d6c-908a-b4d35953934d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"t
