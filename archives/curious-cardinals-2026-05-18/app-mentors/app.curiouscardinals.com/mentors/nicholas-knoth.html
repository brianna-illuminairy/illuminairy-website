xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"852b3ec9-0ebb-4f7c-ac09-5349cc45c79d\"}":{"__typename":"Favorites","uuid":"852b3ec9-0ebb-4f7c-ac09-5349cc45c79d","photoUrl":"https://ucarecdn.com/e48fac42-e9bd-442d-a5a9-8a5fd18f04d6/","title":"RUFUS DU SOL: SOLACE","type":"ALBUM"},"Favorites:{\"uuid\":\"7d29ee13-f669-44ca-b7ec-57d6b9f71ec2\"}":{"__typename":"Favorites","uuid":"7d29ee13-f669-44ca-b7ec-57d6b9f71ec2","photoUrl":"https://ucarecdn.com/9ec07427-ee7f-466a-82af-5694d7ed2d30/","title":"Roger Federer","type":"ATHLETE"},"Favorites:{\"uuid\":\"f4287d3d-5ef2-4e3b-8dcc-9c11ed423f0f\"}":{"__typename":"Favorites","uuid":"f4287d3d-5ef2-4e3b-8dcc-9c11ed423f0f","photoUrl":"https://ucarecdn.com/7989cb45-7723-44b5-b628-65ac29fc212a/","title":"Tennis","type":"SPORT"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"b2c61113-ad24-4fb0-9b42-bfefa317f110\"}":{"__typename":"DeepDives","uuid":"b2c61113-ad24-4fb0-9b42-bfefa317f110","content":"\u003cp\u003eGrowing up in three different countries has had a huge influence on the way I see the world and how I approach teaching. I was born in New York, but after a couple of years my family moved to Munich, where I spent most of my childhood. Then we moved again to Toronto, where I went to high school. Each place had its own culture, language, and way of thinking about learning, so from an early age I had to adapt to new environments and learn how to connect with people who came from very different backgrounds.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eThat experience gave me a real appreciation for different perspectives and made me curious about how people learn and communicate. In my teaching, I try to bring that same mindset. I make a conscious effort to understand how each student thinks, because everyone processes information differently depending on their experiences and personality. Sometimes that means slowing down and building up confidence step by step. Other times it means encouraging creativity and pushing students to look at a problem from a completely new angle.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eHaving lived in three countries also helped me develop a lot of empathy and patience. When you’ve had to adjust to new cultures, schools, and even languages, you realize how important it is to feel understood and supported. I try to create that same feeling for my students. I want them to know that learning is a process, that it’s okay to ask questions, and that their unique background or way of thinking is actually a strength.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eAt the end of the day, I think my international upbringing has made me a more adaptable and understanding teacher. It helps me connect with students from all kinds of backgrounds and create a space where they feel confident exploring ideas, making mistakes, and growing both academically and personally.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"1b57524a-f109-48c0-b10d-ffa3530ad078\"}":{"__typename":"DeepDives","uuid":"1b57524a-f109-48c0-b10d-ffa3530ad078","content":"\u003cp\u003eMentorship has played a huge role in my own life, and it’s one of the reasons I’m so excited to be part of this program. All throughout high school and college, I’ve had mentors who helped me navigate big decisions, from applying to universities to exploring career paths and figuring out what I wanted to build or pursue outside the classroom. They weren’t that much older than me, but they had the exact experiences I was hoping to have, so their insight was incredibly valuable.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eThose relationships taught me how impactful mentorship can be, especially when it’s hands-on and goal-oriented. Some of the most meaningful lessons I learned came from mentors who encouraged me to take initiative — to start something, test ideas, and think creatively about what I cared about. That kind of support helped me develop confidence, not just in academics or career planning, but in actually turning interests into real projects.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eNow that I’m a senior, I want to offer that same kind of guidance to younger students. I know how hard it can be to figure out where to start when you have a big idea or a goal in mind, and I think mentorship provides a space to make that process a little less intimidating and a lot more rewarding.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eWhile information is easier to access than ever, genuine mentorship — the kind that’s personal, consistent, and focused on helping someone bring their ideas to life — is still rare. I see this as an opportunity to provide that kind of support, to help students think deeply about what excites them, and to give them the tools and confidence to actually make it happen.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d7f2e152-02a6-4e86-becf-e5a434d4b8fa\"}":{"__typename":"DeepDives","uuid":"d7f2e152-02a6-4e86-becf-e5a434d4b8fa","content":"\u003cp\u003eIn middle school and my early high school years, I spent almost every summer at basketball training camps with my friends. Those weeks were honestly my favorite time of the year. We’d play basketball all day, compete, and just have fun together. It wasn’t only about the game -- it was about the friendships and the sense of community that came with it. I learned a lot about teamwork, discipline, and leadership, and over time that translated into becoming captain of my school’s varsity team.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my last two years of high school, I actually went back to those same camps, but this time as a coach and counselor. That experience was really meaningful because it gave me the chance to pay it forward and help create the same kind of environment that had meant so much to me when I was younger. Coaching younger players taught me a lot about communication, patience, and empathy. I had to learn how to motivate different personalities, resolve conflicts, and make sure every kid felt included and encouraged.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLooking back, those summers were a big part of my personal growth. They combined something I loved with real responsibility and leadership. I think that experience helped shape how I work with others today: being supportive, listening first, and helping people develop confidence in themselves\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"fcea2c7f-1812-440f-a676-963262cd9524\"}":{"__typename":"DeepDives","uuid":"fcea2c7f-1812-440f-a676-963262cd9524","content":"\u003cp\u003eIn my spare time, I like to stay active and spend time doing things that keep me connected to people I enjoy being around. I love playing tennis with my dad and with friends at Duke, and I’m a big tennis fan in general. I follow most of the big tournaments and especially enjoy watching matches between players like Alcaraz and Sinner. I’ve always found the mix of strategy, focus, and competitiveness in tennis really inspiring.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eI also love traveling with friends and exploring new places. Studying abroad in Europe was one of my favorite experiences, and it gave me the chance to visit so many different cities and cultures. When I’m home, I enjoy being outdoors, especially on the golf course. It’s a great way to unwind and spend time with friends while still challenging myself.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eOutside of that, I like to commit time to meaningful work on campus. I have a part-time job at The Chronicle, Duke’s independent student newspaper, where I’m the Student Ad Sales Manager. I lead a team of students and manage a portfolio of clients that ranges from campus organizations and local businesses to national brands like Uber and Amazon Prime. I really enjoy how hands-on the role is -- there's a lot of collaboration and relationship-building, and it’s rewarding to see our work have a real impact, both financially and for our clients.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eIt’s also been a great opportunity to help younger students develop skills in communication, sales, and professionalism, which adds a layer of mentorship that I really value. Overall, I try to balance my time between staying active, spending time with friends, traveling, and pursuing work that feels both challenging and meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"a13b1629-ea29-4606-b4d2-6d440d41193e\"}":{"__typename":"School","uuid":"a13b1629-ea29-4606-b4d2-6d440d41193e","name":"Upper Canada College","city":"Toronto","type":"HIGH","state":"Ontario","country":"Canada","zip":"M5P 1K7"},"Education:{\"uuid\":\"896244ad-d59b-4b25-8c4a-bcb7ee6024c2\"}":{"__typename":"Education","uuid":"896244ad-d59b-4b25-8c4a-bcb7ee6024c2","school":{"__ref":"School:{\"uuid\":\"a13b1629-ea29-4606-b4d2-6d440d41193e\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"ab0fc919-ad31-4984-baf5-6f35556aed0d\"}":{"__typename":"Education","uuid":"ab0fc919-ad31-4984-baf5-6f35556aed0d","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics, Finance Concentration","degree":null},"MentorPublicProfile:{\"uuid\":\"d581fbff-0027-4ccb-940a-395042f6b0c8\"}":{"__typename":"MentorPublicProfile","uuid":"d581fbff-0027-4ccb-940a-395042f6b0c8","displayName":"Nick K.","slug":"nicholas-knoth","biography":"\u003cp\u003eHi! My name is Nick. I’m originally from New York, but I’ve spent most of my life living abroad in Munich, Germany, and Toronto, Canada. After graduating high school in Toronto, I moved back to the U.S. to attend Duke University, where I’m now a senior majoring in Economics with a Finance concentration and a minor in German.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Duke, I’ve been fortunate to explore both the academic and professional sides of business and finance. I’ve worked in real estate development and spent the past summer in investment banking in New York City, where I’ll be returning full-time after graduation. These experiences have given me firsthand exposure to how financial analysis and strategic thinking come together to drive real projects and investments.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I’m a teaching assistant for a hands-on Financial Markets course, where I help students connect the theories we learn in class to real-world investing. I’m also a portfolio manager for the Duke Investment Club, helping research and manage a portion of the club’s portfolio, and I serve as the Ad Sales Manager for The Chronicle, Duke’s student-run newspaper. Balancing the creative and business sides of that role has taught me a lot about teamwork, leadership, and communication.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHaving lived in several different countries, I’ve developed a deep appreciation for new ideas, cultures, and perspectives. Moving between cities like Munich, Toronto, and Durham has taught me how to adapt to new environments and connect with people from all kinds of backgrounds. I try to bring that same open-mindedness and curiosity into everything I do, whether I’m working on a group project, mentoring younger students, or learning something new myself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and work, I love playing and watching tennis, cooking, and traveling with friends. One of my favorite experiences at Duke was spending a semester abroad in Copenhagen, where I got to meet students from all over the world and explore a completely different culture. I also make a point to visit my friends in Toronto whenever I can, since it still feels like a second home.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat drives me most is the chance to make a meaningful impact on people and communities around me. As a senior, I’ve realized how valuable mentorship can be. Having someone just a few steps ahead to share their perspective and advice can make all the difference. My goal is to use what I’ve learned from both the classroom and the professional world to help guide younger students as they work toward their own goals, not just by teaching, but by connecting, listening, and helping them find their own path.\u003c/p\u003e","teachingVideoPlaybackId":"gFxAOASkxbe87j9wFeS38HCfajnioX63ahMlmVpgZ3s","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I'm really proud of is going from a complete beginner in track and field to placing fourth in my state in the 400m hurdles in just one season. It taught me that progress comes from hard work, open-mindedness, and daily improvement, all of which are lessons that I still apply every day, whether I’m studying, working, or mentoring others.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"852b3ec9-0ebb-4f7c-ac09-5349cc45c79d\"}"},{"__ref":"Favorites:{\"uuid\":\"7d29ee13-f669-44ca-b7ec-57d6b9f71ec2\"}"},{"__ref":"Favorites:{\"uuid\":\"f4287d3d-5ef2-4e3b-8dcc-9c11ed423f0f\"}"}],"causesSupported":[],"major":"Economics, Finance Concentration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b2c61113-ad24-4fb0-9b42-bfefa317f110\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b57524a-f109-48c0-b10d-ffa3530ad078\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7f2e152-02a6-4e86-becf-e5a434d4b8fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"fcea2c7f-1812-440f-a676-963262cd9524\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ea58df50-c955-4a15-ac75-7d56a93c0ea0/-/preview/-/format/jpg/","https://ucarecdn.com/a7ffec1f-946d-403a-a7df-340b7c63d8ab/-/preview/-/format/jpg/","https://ucarecdn.com/009f9fec-5dd3-4963-b055-1db8a0e7c2e9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"896244ad-d59b-4b25-8c4a-bcb7ee6024c2\"}"},{"__ref":"Education:{\"uuid\":\"ab0fc919-ad31-4984-baf5-6f35556aed0d\"}"}],"hiredAt":"2025-10-16T15:00:10.642Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Business / Entrepreneurship","Finance / Investing"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/"],"restrictedP
