5","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"ad4de8f7-e5c8-4a13-87d6-9d1af2f309f6\"}":{"__typename":"Education","uuid":"ad4de8f7-e5c8-4a13-87d6-9d1af2f309f6","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"1e76d270-77ce-4fca-ab1a-6d63224e340f\"}":{"__typename":"MentorPublicProfile","uuid":"1e76d270-77ce-4fca-ab1a-6d63224e340f","displayName":"Andres C.","slug":"andres-cubeddu","biography":"\u003cp\u003eAndres recently graduated from Cornell University with a degree in Information Science and a minor in Business. In the fall, he will return as a graduate student pursuing a Master of Professional Studies degree in Data Science. Andres grew up in Washington, D.C. where he graduated from Washington International School (WIS) with an International Baccalaureate Bilingual Diploma. Throughout his high school years, Andres was captain of the Varsity Soccer team and volunteered weekly at Reading Partner where he tutored elementary school students reading below grade level.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFrom a young age, Andres loved Math, but he always wondered how he’d be able to apply these skills to the real world. In his first year at Cornell, he took a class in data science and soon fell in love with the field after completing his final project. In this assignment, he performed a statistical analysis of the Spanish soccer league (La Liga) to determine the various factors behind the success of teams. He was intrigued by the fact that he could combine his analytical skills with his passion for soccer.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a proud individual from Latin America, with roots in both Argentina and Venezuela, Andres stayed connected to his cultural heritage by joining the Salsa club at Cornell. In his free time, Andres also enjoys playing soccer, making tapas, going to jazz clubs, practicing Brazilian Jiu-Jitsu, and playing Sudoku.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAndres’ teaching style focuses on meeting the learning tendencies of the student.\u0026nbsp; Instead of following a standardized model, he takes a more flexible approach that involves adapting his lesson plans/mentoring to fit the mentee. He believes that sparking a connection and truly understanding the mentee holds the greatest value in approaching education.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e","teachingVideoPlaybackId":"xkKs8hviD82889KunVhOKc2kiPvBoz82iOVg01862I0200","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"78d7beed-e41a-40d1-9151-7c4321cdc8a4\"}"},{"__ref":"Favorites:{\"uuid\":\"e6d54db8-7d3b-448b-a15e-7932918a500c\"}"},{"__ref":"Favorites:{\"uuid\":\"9815d3e2-7bdd-4042-a979-a2adcd9c224e\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b53e3033-f4ed-45f2-abc7-32d6b6e6db37\"}"}],"major":"Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cd4047d9-0559-4c31-bfdb-1b7975de2423\"}"},{"__ref":"DeepDives:{\"uuid\":\"6976db3f-ffcc-4010-a65f-ec035af98416\"}"},{"__ref":"DeepDives:{\"uuid\":\"9bd5960e-97df-4cbd-9ded-1e269639e747\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/684289cf-f78c-4f5c-9457-fe1a76c6ab08/-/preview/-/format/jpg/","https://ucarecdn.com/4ea22ca8-e9b9-4f8b-bdd7-037d2da1f482/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"04283517-6d2c-49fe-9a29-0965729c0753\"}"},{"__ref":"Education:{\"uuid\":\"ad4de8
