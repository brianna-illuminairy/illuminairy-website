xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5b7612a0-cb35-4270-b463-35d08347e3a5\"}":{"__typename":"DeepDives","uuid":"5b7612a0-cb35-4270-b463-35d08347e3a5","content":"\u003cp\u003eMentorship matters to me because I’ve experienced firsthand just how transformative it can be. As the son of two immigrants, I grew up in an environment where topics like college, career paths, and professional development weren’t readily accessible or familiar. Recognizing this, I took it upon myself to seek out mentors who could guide me and open doors to new opportunities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis practice has become a cornerstone of my personal and professional growth. Whenever I’m curious about a topic or industry, I’ve found incredible value in connecting with individuals who have hands-on experience. These conversations not only deepen my understanding but also challenge my perceptions and inspire new ways of thinking.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship, to me, is about creating a ripple effect—passing on the knowledge and support that I’ve been fortunate to receive and empowering others to explore their potential with confidence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"dc813009-2167-4b47-82e1-339616c36116\"}":{"__typename":"DeepDives","uuid":"dc813009-2167-4b47-82e1-339616c36116","content":"\u003cp\u003eChoosing my major was a long but intellectually exciting journey of discovery. I started at USC as a business major, drawn by my interest in problem-solving and entrepreneurship. However, I quickly realized that much of the coursework focused on memorization and information I could pick up on the job, which left me craving a more dynamic intellectual experience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNext, I switched to Public Policy, thinking it would combine my passion for business with a commitment to public service. While I appreciated the real-world relevance, I found it too limiting; the field often operates within established paradigms, leaving little room for innovative or unconventional thought.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt wasn’t until I took a class on Urban Economics that everything clicked. I loved how the subject focused on theory, decision-making, and problem-solving. The answers weren’t always straightforward—many questions invited debate and could be analyzed from multiple perspectives. That complexity and flexibility excited me and ultimately shaped the direction of my academic journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"399400ba-64a6-47ed-989a-f9d1bfdf4165\"}":{"__typename":"DeepDives","uuid":"399400ba-64a6-47ed-989a-f9d1bfdf4165","content":"\u003cp\u003eAs a fan of music and an even bigger fan of live entertainment, I’ve always been captivated by the artistry and logistics behind concert and festival stages. I’ve spent countless hours watching YouTube videos that break down some of the most complex stage designs—like Taylor Swift’s \u003cem\u003eEras Tour\u003c/em\u003e—and marveling at how these massive structures are made portable, traveling seamlessly from city to city.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf I could have any job, it would be to join the team that designs these incredible stages and orchestrates the logistics of bringing such monumental productions to life. The idea of blending creativity, engineering, and problem-solving to create unforgettable experiences for audiences around the world is a dream that truly excites me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"76ac2080-66c5-49c5-adcb-19f081a90da5\"}":{"__typename":"School","uuid":"76ac2080-66c5-49c5-adcb-19f081a90da5","name":"Lenox Memorial Middle \u0026 High School","city":"Lenox","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01240"},"Education:{\"uuid\":\"0d7d7640-9d46-4f78-9eb0-d8bb1e0573fe\"}":{"__typename":"Education","uuid":"0d7d7640-9d46-4f78-9eb0-d8bb1e0573fe","school":{"__ref":"School:{\"uuid\":\"76ac2080-66c5-49c5-adcb-19f081a90da5\"}"},"startYear":"2016","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"9c4edd33-33cc-4ba2-99be-8b94038dbb78\"}":{"__typename":"Education","uuid":"9c4edd33-33cc-4ba2-99be-8b94038dbb78","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"913d69d7-2cbd-4353-ba3c-93fd97e27b92\"}":{"__typename":"MentorPublicProfile","uuid":"913d69d7-2cbd-4353-ba3c-93fd97e27b92","displayName":"Jimmy C.","slug":"jimmy-chassi-1","biography":"\u003cp\u003eHi! I’m Jimmy Jay, and I’m excited to help students explore their curiosities and expand their intellectual horizons. I’m passionate about connecting with others and finding innovative ways to turn learning into an exciting, transformative experience. With a diverse background in project management, communication, and translation, I bring both structure and creativity to mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a student at USC, my academic journey has been anything but linear—something I take pride in. My studies and professional experiences at companies like JP Morgan Bank and Amazon have given me a strong foundation in critical thinking, problem-solving, and adapting to new challenges. Beyond academics, I’ve worked in hospitality, launched entrepreneurial ventures, and even started my own laundry delivery service in Los Angeles. These experiences have taught me the value of balancing practicality with creative exploration.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my most rewarding roles has been serving as President of my college’s foreign affairs society. It was here that I learned how to foster collaboration, develop strategy, and engage deeply with global issues. That experience fueled my belief that intellectual growth isn’t just about finding the “right answer” but about asking meaningful questions and thinking critically about the world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy diving into new subjects, from world history to personal development. Whether it’s reading about leadership principles, experimenting with fitness routines, or creating TikToks to spark conversations, I’m always looking for ways to grow—and I’m thrilled to share that passion with my students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLet’s work together to explore what excites you, uncover new interests, and tackle challenges with creativity and confidence!\u003c/p\u003e","teachingVideoPlaybackId":"MwhHTtkfNjCV8oFGSdA5NYi02i7I8CGSikpDBfnhu2rY","teachingVideoDescription"
