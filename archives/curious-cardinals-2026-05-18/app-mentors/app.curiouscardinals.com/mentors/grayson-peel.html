xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7133a865-4a15-47af-887e-93d63e361b81\"}":{"__typename":"DeepDives","uuid":"7133a865-4a15-47af-887e-93d63e361b81","content":"\u003cp\u003eHere in Quito, I spend a lot of time in the queer Ballroom scene. Ballroom is a culture that was born in the LGBTQ+ community in the 1970s in Harlem, New York--it's where \"vogue\" dancing comes from. I am part of a community that practices the original style of \"vogueing,\" called \"the Old Way.\" I spend a lot of time dancing with them and competing in \"balls\" (competitions) here.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love to play the guitar and write music, read (especially science fiction and Japanese fiction), watch and talk about movies (fun fact: I was almost a film Major!), cook and bake for my friends, and hike the mountains and volcanoes in and around Quito.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"26d24af5-1814-4a86-ac65-98deb446bc20\"}":{"__typename":"DeepDives","uuid":"26d24af5-1814-4a86-ac65-98deb446bc20","content":"\u003cp\u003eI've had the travel bug since I was a kid. But, as someone from a low-income, single-parent household, I always thought I'd have to wait until I was an adult to travel-- until my junior year of high school, when a close friend told me she was able to get a full scholarship to go to Tanzania through CIEE Study Abroad.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI had no idea opportunities like this existed, and I applied to CIEE and another high school summer abroad program called Rustic Pathways immediately. I ended up getting scholarships to study Human Rights and Environmental Policy in rural northeast Thailand through CIEE, and to do service learning in Morocco through Rustic Pathways. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo, that summer, I ended up spending 5 weeks outside of the country, and I absolutely loved it! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe following summer, I saved up money from my coffee shop job to spend a month in Montreal with a friend, where I practiced my French and learned about French-Canadian culture, before beginning my gap year in Ecuador, during which time I lived with a host family in a small indigenous community and worked for an indigenous cultural magazine. These experiences abroad sparked my passion for international travel, language learning, and cultural exchange, which has shaped the academic and professional paths I've chosen. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"05a6b096-ce0c-4910-9307-601c3d4e8334\"}":{"__typename":"DeepDives","uuid":"05a6b096-ce0c-4910-9307-601c3d4e8334","content":"\u003cp\u003eAs a trans, queer, and neurodivergent person, I have often felt different than others around me throughout my life. I did not have many role models who shared these identities as a middle and high schooler, and often felt misunderstood by many of the adults in my life, which caused me to feel shame, embarrassment, and self-isolate. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my work with middle and high schoolers, I want to validate and celebrate their specific identities, idiosyncrasies, and learning styles, so that they do not feel that way. I firmly believe that our differences are what make us unique, and that many of the things that society deems weird or undesirable can really be our greatest superpowers. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor this reason, in my work with students, I prioritize building a strong foundation of the mentor-mentee relationship through mutual understanding, exercising curiosity over judgment, and utilizing a strengths-based approach when designing strategies and plans for achieving goals. This approach allows me to build authentic connections with students, empowering them to celebrate their differences, develop a better understanding of their unique learning styles, and feel confident in expressing their strengths and needs in and outside of the classroom. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2207b4e3-b54c-42f0-9990-edfb21edd8e3\"}":{"__typename":"DeepDives","uuid":"2207b4e3-b54c-42f0-9990-edfb21edd8e3","content":"\u003cp\u003eI am currently working on turning my research here in Quito into a series of autoethnographic essays, which I plan to self-publish in both English and Spanish.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI came to Ecuador on a Fulbright to study the discrepancies between Ecuador's relatively progressive public policies related to LGBTQ+ rights and protection from discrimination, and the lived realities of LGBTQ+ Ecuadorians in Quito. I conducted ethnographic fieldwork for the 10 months of my grant. Now that this term is over, I am working on analyzing my data and writing. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI decided to write a series of essays that focus largely on my own experiences here instead of a more conventional academic article analyzing the experiences of others. I am very passionate about making anthropological research that is accessible and that does not claim to speak for others. Through publishing my autoethnographic writing on an open-source website, I hope to share the insights I have made through my research and personal experiences here in Ecuador to a wider and more diverse audience than publication in an academic journal allows for.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"af1570b0-dfc3-4a65-981c-0c4b01fa6b3c\"}":{"__typename":"School","uuid":"af1570b0-dfc3-4a65-981c-0c4b01fa6b3c","name":"Enloe Magnet High School","city":"Raleigh","type":"HIGH","state":"North Carolina","country":"United States","zip":"27610"},"Education:{\"uuid\":\"dbc91307-09e8-410b-9887-e80eb3811481\"}":{"__typename":"Education","uuid":"dbc91307-09e8-410b-9887-e80eb3811481","school":{"__ref":"School:{\"uuid\":\"af1570b0-dfc3-4a65-981c-0c4b01fa6b3c\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}":{"__typename":"School","uuid":"0505e371-93af-4291-ab60-2728b5ad4443","name":"Northeastern University","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02115"},"Education:{\"uuid\":\"6ab822bb-3beb-482d-b6d9-7ed8de1e6e25\"}":{"__typename":"Education","uuid":"6ab822bb-3beb-482d-b6d9-7ed8de1e6e25","school":{"__ref":"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2023","major":"Cultural Anthropology","degree":null},"MentorPublicProfile:{\"uuid\":\"374b1141-de1b-4a8e-9766-d6c908b9195d\"}":{"__typename":"MentorPublicProfile","uuid":"374b1141-de1b-4a8e-9766-d6c908b9195d","displayName":"Grayson P.","slug":"grayson-peel","biography":"\u003cp\u003eHi! I’m Grayson, a Cultural Anthropology Northeastern graduate (2023) originally from Raleigh, North Carolina. I recently completed a Fulbright research grant to Ecuador to study LGBTQ+ public policies, discrimination, and resistance in Quito, where I am continuing to live and work on my research while applying to MSW programs.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about social and environmental justice, music, food, art, movies, photography, writing, and cross-cultural exchange. In my free time I love to write and play music, read, cook, dance, and explore the outdoors. I also love learning foreign languages-- I am fluent in Spanish, and speak intermediate Hindi and French! \u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eI mentor students in the following areas:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003ePassion Projects\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI work with students to leverage the resources available to them, pursue new opportunities, and think outside the box in order to create meaningful and fulfilling Passion Projects. As an anthropologist, I have executed 2 long-term ethnographic research projects, received prestigious research grants, and presented my work at academic conferences. From working as a Digital Media Librarian, to recording and producing independent music projects, to editing and producing a former professor’s Podcast, I also have extensive experience in digital media production. I am especially enthusiastic about helping students who share my passions for social science and/or digital media to turn their project ideas into realities!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHere are some examples of some projects we could work on together:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePodcast series\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eShort documentary\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePhoto essay\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLiterature review\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSocial science research paper\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMusic project (writing, recording, producing and releasing a song or album)\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eAcademic Mentorship\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI have particular expertise in social studies/humanities, English/language arts, Spanish, and life sciences. If you’re a middle or high school student looking to strengthen performance, practice study habits, study for AP exams, or explore specific topics within these subjects, please feel free to reach out!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eExecutive Functioning\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAs a neurodivergent person, I have struggled with executive functions for my entire life. However, I was only recently diagnosed with ADHD and ASD, meaning that over the course of my time as a K-12 and college student, I developed habits that enabled me to excel in the classroom on my own. Through trial and error, I have found what strategies work for me. I would love to work with students, whether neurodivergent or neurotypical, who struggle with challenges like the ones I dealt with as a student. These could include (but are not limited to) staying organized, finding and practicing study habits that work for them, creating adaptive schoolwork routines, prioritizing and completing assignments, and procrastination.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy am I qualified to mentor you or your child?\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI am experienced in youth education, from teaching Guitar and Bass at Girls Rock North Carolina summer camps and after-school programs to teaching English to youths in a small town in Ecuador during my gap year. As a Peer Mentor to incoming Freshman at Northeastern, I worked one-on-one with a small cohort of students in the Sociology and Anthropology majors each semester to support them to adjust to life on campus, navigate academic and social challenges, and plan out their time at Northeastern. I am comfortable working with kids and teens from a variety of backgrounds and love empowering them to accomplish their goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat’s my philosophy when it comes to mentoring?\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI believe that, too often, kids and teens aren’t taken seriously by the adults around them. In my work with youths, I’ve found that being an adult who honors their experiences can make a huge impact. Through active listening, meeting students where they’re at, and leading with empathy, I build authentic and meaningful connections with students that enable me to help them define, plan for, and accomplish their goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eIf it sounds like we might be a good match, I would love to work with you!\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlaybackId":"xbnU6nPUk7OZNV5yIUdg5f00wY02jHbg3Cnn2QNHxoh4U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Cultural Anthropology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7133a865-4a15-47af-887e-93d63e361b81\"}"},{"__ref":"DeepDives:{\"uuid\":\"26d24af5-1814-4a86-ac65-98deb446bc20\"}"},{"__ref":"DeepDives:{\"uuid\":\"05a6b096-ce0c-4910-9307-601c3d4e8334\"}"},{"__ref":"DeepDives:{\"uuid\":\"2207b4e3-b54c-42f0-9990-edfb21edd8e3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6831a38f-269a-477a-86c4-ae9c9636b91f/-/preview/-/format/jpg/","https://ucarecdn.com/040b444a-ae0e-4d92-8d59-3d398608d96c/-/preview/-/format/jpg/","https://ucarecdn.com/8a511792-4617-4df6-b62c-0d17daa81391/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"dbc91307-09e8-410b-9887-e80eb3811481\"}"},{"__ref":"Education:{\"uuid\":\"6ab822bb-3beb-482d-b6d9-7ed8de1e6e25\"}"}],"hiredAt":"2025-09-27T18:37:49.602Z","topics":["Biology","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Creative Writing","Music","Visual Arts / Graphic Design","Video / Photography","History Project","Web Design","Public Speaking","Journalism","Sustainability","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"grayson-peel\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"374b1141-de1b-4a8e-9766-d6c908b9195d\"}"}}},"_sentryTraceData":"df1cff08ebaf4caf8060ddffd8b58ee6-93c0b678cd392dd9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=df1cff08ebaf4caf8060ddffd8b58ee6,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"grayson-peel"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.c
