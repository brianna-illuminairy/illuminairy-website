xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"67a22666-fc77-4729-ba27-f32dfb28bea5\"}":{"__typename":"Favorites","uuid":"67a22666-fc77-4729-ba27-f32dfb28bea5","photoUrl":"https://ucarecdn.com/7c4ecd7f-473d-4cee-8900-c8b5764df4c0/","title":"Waiting for Godot","type":"PLAY"},"Favorites:{\"uuid\":\"7d158429-0d43-40dc-b73d-750a39cded92\"}":{"__typename":"Favorites","uuid":"7d158429-0d43-40dc-b73d-750a39cded92","photoUrl":"https://ucarecdn.com/75829b31-b732-4a40-9147-5ef508effb9f/","title":"The Stranger","type":"BOOK"},"Favorites:{\"uuid\":\"46365c06-60d1-4335-96ce-37a419d52d94\"}":{"__typename":"Favorites","uuid":"46365c06-60d1-4335-96ce-37a419d52d94","photoUrl":"https://ucarecdn.com/59364ee7-a779-4ac5-af12-2dbc67d7625e/","title":"Call Me By Your Name","type":"MOVIE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"63d80660-9ca1-4ff3-bea3-7081b41e2931\"}":{"__typename":"DeepDives","uuid":"63d80660-9ca1-4ff3-bea3-7081b41e2931","content":"\u003cp\u003eMath is a language of numbers, and Computer Science is a language of math. Studying Math, I feel as though I am expanding my mind to think in a new language it is not used to, and my mind enters an entirely new realm detached from the one I live my life in. Mathematical Computational Sciences allows me to dive deep into theoretical Math, practical CS applications, and useful statistical modeling, allowing me to feel like I can speak the language of numbers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"bef687d5-2058-4b41-8463-0f935da3afb9\"}":{"__typename":"DeepDives","uuid":"bef687d5-2058-4b41-8463-0f935da3afb9","content":"\u003cp\u003eI am currently working on writing an Album! I have been a singer all of life--Jazz, theater, and classical--and I have recently been trying to write some of my own music. Writing music has been an entirely new challenge than learning it, but my hope is to create an album with a storyline that represents my character and life. It has been such a fun new endeavor that allows me to express myself through singing and also through writing! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"af79ae85-49ac-48d3-b446-a477a1dc359e\"}":{"__typename":"DeepDives","uuid":"af79ae85-49ac-48d3-b446-a477a1dc359e","content":null,"videoPlaybackId":"6N6V3ZB38pj33Q16TVcb7Yv5A00r3Xv8yFEEchAm2wLc","question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"5f41d4ea-47f9-4577-9143-b2b49b3baf15\"}":{"__typename":"School","uuid":"5f41d4ea-47f9-4577-9143-b2b49b3baf15","name":"Trinity SchooI","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10024"},"Education:{\"uuid\":\"b879f688-ba76-4414-9426-e96b5c5911b5\"}":{"__typename":"Education","uuid":"b879f688-ba76-4414-9426-e96b5c5911b5","school":{"__ref":"School:{\"uuid\":\"5f41d4ea-47f9-4577-9143-b2b49b3baf15\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"3ce0d4f9-6e4d-42ae-b541-912d7d7875c3\"}":{"__typename":"Education","uuid":"3ce0d4f9-6e4d-42ae-b541-912d7d7875c3","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mathematical Computational Sciences","degree":null},"Testimonial:0a686115-6a6d-4c9d-b373-0453c2dc8573":{"__typename":"Testimonial","id":"0a686115-6a6d-4c9d-b373-0453c2dc8573","text":"Brooke loved working with Anya.  Anya was always supportive, made Brooke feel comfortable asking questions and was always there to support her. Brooke is shy and can be embarrassed at times when she doesn’t understand something. She was never embarrassed when working with Anya. She always felt supported, and she trusted Anya as a mentor and a champion to help her do her best.   Anya is kind and sweet and extremely knowledgeable. She was a true support and mentor for Brooke this year","date":"2025-06-06 19:29:49.366+00","rating":5,"endorser":{"__typename":"Endorser","name":"Lisa Rappaport","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"ca2235a0-efb7-4866-a183-1558803d0919\"}":{"__typename":"MentorPublicProfile","uuid":"ca2235a0-efb7-4866-a183-1558803d0919","displayName":"Anya B.","slug":"anya-sheila","biography":"\u003cp\u003eHi! My name is Anya Bulchandani, and I am a sophomore from New York City studying Mathematical Computational Sciences and History at Stanford University.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was always on the creative side of things. I did two musicals and one play each year, in addition to art classes and choir! My senior year was undoubtedly my favorite, because I got to direct Shakespeare’s Taming of the Shrew. In our production, my co-directors and I decided to switch the genders of Kate and Petruchio to add a level of clear absurdity to the egregious gender dynamics. I had wanted to direct since eighth grade, and it was the perfect way to culminate my high school experience.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBesides the creative outlets, I spent much of my time working at the Taub Institute at Columbia researching Alzheimers and traumatic brain injury. I worked here for three summers running gels and working on project proposals. At school, I was the managing editor of our newspaper, the Trinity Times, which meant I was the point person for turning out monthly issues from a google drive folder into a physical copy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, I would say my interests are very similar, but present differently. I am the financial officer and soprano lead of my acapella group which sings soul, funk, and R\u0026amp;B. Outside of acapella rehearsal, I am a part of a sketch comedy group that tutors second graders in creative writing, then writes and performs a sketch comedy show based on their stories! This year, I plan on initiating a research project through the Cyber Policy Institute about the most effective ways to regulate Artificial Intelligence at a federal level.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs these past few paragraphs may have illuminated (my profile as well), I wouldn’t say I have very streamlined interest both as a student or as a creative. All I know is I love to think about how things relate to one another, and I love to create. I can promise that as a mentor, I will cater to every one of your child's interests in order to engage them through as many angles as possible. I believe education should begin from the self, and I want your child to feel like all of their accomplishments are personal to them, and stem intrinsically from their core.\u003c/p\u003e","teachingVideoPlaybackId":"Hn300bJ6ywwkHH3lEYcou8ll00f8s024lvKyIgjX5Uvsgs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"67a22666-fc77-4729-ba27-f32dfb28bea5\"}"},{"__ref":"Favorites:{\"uuid\":\"7d158429-0d43-40dc-b73d-750a39cded92\"}"},{"__ref":"Favorites:{\"uuid\":\"46365c06-60d1-4335-96ce-37a419d52d94\"}"}],"causesSupported":[],"major":"Mathematical Computational Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"63d80660-9ca1-4ff3-bea3-7081b41e2931\"}"},{"__ref":"DeepDives:{\"uuid\":\"bef687d5-2058-4b41-8463-0f935da3afb9\"}"},{"__ref":"DeepDives:{\"uuid\":\"af79ae85-49ac-48d3-b446-a477a1dc359e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1894c556-17f2-4e67-9cf7-84c7cdbe9c49/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"b879f688-ba76-4414-9426-e96b5c5911b5\"}"},{"__ref":"Education:{\"uuid\":\"3ce0d4f9-6e4d-42ae-b541-912d7d7875c3\"}"}],"hiredAt":"2024-09-13T02:29:37.092Z","topics":["Algebra II","Calculus","Geometry","Statistics","Writing","Latin","Academic Coaching","College Essay Writing","Computer Science","Film / Theater","Music","Aviation / Aerospace","Machine Learning / AI","STEM Project"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:0a686115-6a6d-4c9d-b373-0453c2dc8573"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anya-sheila\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ca2235a0-efb7-4866-a183-1558803d0919\"}"}}},"_sentryTraceData":"dd321058fc0b43e59a077225ed343e42-b62c9f63ebeda40c-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=dd321058fc0b43e59a077225ed343e42,sentry-
