xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"8bab0209-8a60-4841-8106-c53c4725ddc3\"}":{"__typename":"DeepDives","uuid":"8bab0209-8a60-4841-8106-c53c4725ddc3","content":"\u003cp\u003eIt may sound cliché, but my family is my greatest source of motivation. They have supported me time and time again, through all the ups and downs that I've experienced in high school and college. My success is due to them, and they continue to keep me motivated to perform my best in the classroom and on the track. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1afd6d81-653f-4f24-8396-3cf753dabbe5\"}":{"__typename":"DeepDives","uuid":"1afd6d81-653f-4f24-8396-3cf753dabbe5","content":"\u003cp\u003eThrough middle/high school, I was driven to accomplish my academic and extracurriculars goals my own unique way. There are many benefits to this approach, but I eventually learned that I did not have to undergo my journey alone. Junior year of high school I had met my now mentor and good friend, Mr. Luisi, who proved a crucial role in my success. Mr. Luisi had provided me with guidance and mentorship for my academics and college applications, on top of supporting my athletic career. From my personal experience, I know and understand the importance of mentorship. How a different perspective may open your eyes in a way you hadn't previously seen. How a caring push may lead you to jump to new heights that you didn't know was possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5e6566df-3e59-4f9d-8d6d-cc9c3a91599f\"}":{"__typename":"DeepDives","uuid":"5e6566df-3e59-4f9d-8d6d-cc9c3a91599f","content":"\u003cp\u003eThere are several pieces of advice I would give to my younger self: study harder, join more extracurriculars, etc. But one of the most important would be to remain genuinely curious about the surrounding world. Curiosity is a trait that we all inherit; it enables us to learn in an engaging fashion and to continue questioning things that are unclear. Without a curious mind, learning is dull and seems like a chore. If you are genuinely intrigued and interested on a certain topic and desire to know more, learning is an experience unlike no other. This mindset has lead to numerous innovations and technologies that would not have emerged if their creators were not curious. This is therefore the mindset that I would advise my middle/high school self to strive for.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"4edffe7f-2e47-4342-ba75-1c7c363a8c5f\"}":{"__typename":"Education","uuid":"4edffe7f-2e47-4342-ba75-1c7c363a8c5f","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Human Developmental \u0026 Regenerative Biology","degree":"Bachelor of Arts"},"School:{\"uuid\":\"cb24eec8-1cca-4773-835b-68a7f6c8adc2\"}":{"__typename":"School","uuid":"cb24eec8-1cca-4773-835b-68a7f6c8adc2","name":"Oceanside High School","city":"Oceanside","type":"HIGH","state":"New York","country":"United States","zip":"11572"},"Education:{\"uuid\":\"9ae8971b-6f81-4e36-9366-b9421e1f546d\"}":{"__typename":"Education","uuid":"9ae8971b-6f81-4e36-9366-b9421e1f546d","school":{"__ref":"School:{\"uuid\":\"cb24eec8-1cca-4773-835b-68a7f6c8adc2\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"38b25601-4467-4fe8-9aa8-84a71f64bf27\"}":{"__typename":"MentorPublicProfile","uuid":"38b25601-4467-4fe8-9aa8-84a71f64bf27","displayName":"Jonathan G.","slug":"jonathan-gamarra","biography":"\u003cp\u003eJonathan is a junior at Harvard studying Human Developmental \u0026amp; Regenerative Biology with a citation in Spanish. His experience as a student-athlete had sparked his interest of the human body in all its mysteries, and intends to extend this passion through orthopedic surgery in the future. Taking this passion outside the classroom, Jonathan had fulfilled a research assistant position at Boston Children’s Hospital in a lab investigating alternative therapeutics for osteoarthritis. At Harvard, he is a sprinter on the Men’s Track \u0026amp; Field team and was an All-Ivy Finalist in the 400m the past 2 seasons. Aside from his 6-day per week practice schedule, Jonathan has been dancing his way through the semester with salsa, bachata and merengue, as he is an avid member of Harvard’s Latin Dance Troupe, Candela. In High School Jonathan was heavily involved athletically as he was a member of Varsity soccer, a leader of the Varsity track team as well as a NYS Track \u0026amp; Field All-State Finalist in the 400m, School Record Holder in the indoor 300m, and his school’s Athlete of the Year. Outside of sport, Jonathan was also somewhat of a math nerd as he actively participated in his school’s Mu Alpha Theta Math Society and earned an excellent score on the AP AB Calc exam, along with a Math SAT score within the top 95th percentile. Through his high school experiences, Jonathan valued the importance of a role model/mentor so he had taken on the role of a proctor at the Harvard Summer School this past summer. He was tasked with the safety and guidance of 21 rising high school seniors, in which he learned the valuable lessons of camaraderie, fun, and the occasional push of “tough love”. Prior to Curious Cardinals, Jonathan was also an English tutor for South Korean English learners for 2 years. Through these positions, Jonathan had cherished the relationships that he had built with his students and loved seeing their overall development in tandem with their success in the classroom. He is very excited to continue to build these memorable relationships through Curious Cardinals!\u003c/p\u003e","teachingVideoPlaybackId":"g3Y021QiK5g1eqFwSIxXyTqssB01xLTcyCRoXsmjZnA3A","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Developmental \u0026 Regenerative Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8bab0209-8a60-4841-8106-c53c4725ddc3\"}"},{"__ref":"DeepDives:{\"uuid\":\"1afd6d81-653f-4f24-8396-3cf753dabbe5\"}"},{"__ref":"DeepDives:{\"uuid\":\"5e6566df-3e59-4f9d-8d6d-cc9c3a91599f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/897decde-6a6d-463f-a0cd-b01da123aba8/-/preview/-/format/jpg/","https://ucarecdn.com/7be4063d-359d-466b-9d98-78f778e4333b/-/preview/-/format/jpg/","https://ucarecdn.com/079c7d05-d345-49a2-b900-abc02d1f133d/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4edffe7f-2e47-4342-ba75-1c7c363a8c5f\"}"},{"__ref":"Education:{\"uuid\":\"9ae8971b-6f81-4e36-9366-b9421e
