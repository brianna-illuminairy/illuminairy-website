xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b6d67821-66ce-4fa5-90cb-a3233f114abe\"}":{"__typename":"Favorites","uuid":"b6d67821-66ce-4fa5-90cb-a3233f114abe","photoUrl":"https://ucarecdn.com/7e16b386-515a-409d-aa89-eb89225d681f/","title":"Stardew Valley","type":"GAME"},"Favorites:{\"uuid\":\"3e5aae64-f54f-44d7-b351-f2b518735c08\"}":{"__typename":"Favorites","uuid":"3e5aae64-f54f-44d7-b351-f2b518735c08","photoUrl":"https://ucarecdn.com/421e4fd8-37aa-47be-80f3-f2bc5c1c67d0/","title":"Houston Texans","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"035912f2-7ce3-4d66-a6fa-c3be87666450\"}":{"__typename":"Favorites","uuid":"035912f2-7ce3-4d66-a6fa-c3be87666450","photoUrl":"https://ucarecdn.com/0a15e18a-abaf-4405-9998-14cf9a8fd92b/","title":"Hit Me Hard and Soft","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"370aafff-fdc5-43d4-914d-9d46462feb8a\"}":{"__typename":"DeepDives","uuid":"370aafff-fdc5-43d4-914d-9d46462feb8a","content":"\u003cp\u003eI’d tell my middle or high school self to trust the process and not be afraid to take up space. Your voice, your goals, and your dreams are valid, even when they feel bigger than you. The work you do with genuine purpose will always matter more than the fear of failing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8a09d83c-b627-43c9-a8a5-c51c125a4832\"}":{"__typename":"DeepDives","uuid":"8a09d83c-b627-43c9-a8a5-c51c125a4832","content":"\u003cp\u003eMy dream job is to become a physician focused on health equity and global health, someone who not only treats patients, but also works to eliminate the systemic barriers that prevent people from accessing care.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2bce14c1-2751-4953-bab8-1dbd1d56372f\"}":{"__typename":"DeepDives","uuid":"2bce14c1-2751-4953-bab8-1dbd1d56372f","content":"\u003cp\u003eOne passion project I created in high school was Letters \u0026amp; Love, an initiative focused on spreading encouragement and human connection to people \u0026amp; healthcare workers feeling isolated or overlooked.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLetters \u0026amp; Love grew to have a network of volunteers from all 50 states and 40+ countries who helped write handwritten letters. Together, we sent over 50,000 letters, creating a massive wave of positivity and connection.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis project taught me the power of empathy and community, that even small, intentional acts of kindness can reach far beyond what you might imagine and make a real difference in someone’s life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"5124a212-9fdc-4a8d-8ea9-c26d62705afc\"}":{"__typename":"DeepDives","uuid":"5124a212-9fdc-4a8d-8ea9-c26d62705afc","content":"\u003cp\u003eAs a high school student, I was highly driven, curious, and deeply involved in both academics and community service. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated as valedictorian with an Associate’s degree during my high school graduation. I served as a HOSA state officer, and balanced a wide range of activities. I danced, worked as a pharmacy technician, volunteered in hospitals, and taught Telugu to younger students. I also started a nonprofit and won an international beauty pageant.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, I was a student who cared deeply about learning, leadership, and using my time to make a meaningful impact in my community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"ed5d2380-cbf8-46eb-8fdf-a8d7d0e3c26e\"}":{"__typename":"School","uuid":"ed5d2380-cbf8-46eb-8fdf-a8d7d0e3c26e","name":"Langham Creek High School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77095"},"Education:{\"uuid\":\"e8539519-0bf6-4889-9f20-25d8b9e4bb80\"}":{"__typename":"Education","uuid":"e8539519-0bf6-4889-9f20-25d8b9e4bb80","school":{"__ref":"School:{\"uuid\":\"ed5d2380-cbf8-46eb-8fdf-a8d7d0e3c26e\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"d0a9bab6-b3dc-4758-bd7b-2f50d9c4fb66\"}":{"__typename":"Education","uuid":"d0a9bab6-b3dc-4758-bd7b-2f50d9c4fb66","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2025","major":"Molecular \u0026 Cellular Biology and Medicine, Health, \u0026 Society","degree":null},"MentorPublicProfile:{\"uuid\":\"f577d854-cf69-4b52-96ca-64f8159e10c6\"}":{"__typename":"MentorPublicProfile","uuid":"f577d854-cf69-4b52-96ca-64f8159e10c6","displayName":"Nitya K.","slug":"nitya-kodali","biography":"\u003cp\u003eHi, I'm Nitya! I earned my B.S. in Molecular and Cellular Biology and Medicine, Health, and Society from Vanderbilt University, graduating magna cum laude with honors after just two years. Since graduating, I’ve been focused on gaining hands-on clinical experience while also helping students become more confident and successful learners. My goal is to combine my knowledge, experience, and love for teaching to make a meaningful impact on students’ learning journeys. Alongside tutoring, I currently work in a hospital, where I’m gaining valuable insights into patient care every day.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve been tutoring for most of my academic career. As an undergraduate, I volunteered with Vanderbilt’s peer tutoring program, leading study sessions, helping with lab prep and reports, and coaching students on test-taking strategies. My proudest moments are seeing students go from struggling or failing a class to fully understanding the material and earning an A, knowing that my guidance helped boost both their understanding and confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy approach to tutoring is personalized, patient, and interactive. I focus on understanding each student’s unique learning style and adapting my approach, whether that’s through step-by-step explanations, visual aids, or guided practice. I strive to create a supportive and safe environment where students feel comfortable asking questions and learning from mistakes. I truly believe that learning should be engaging and empowering, and that with the right guidance, every student can overcome challenges and even develop a genuine love for the subject.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Vanderbilt, I stayed deeply involved on campus. I served in leadership roles like Vanderbilt Student Government Senator and Resident Advisor, gaining experience in mentoring and community building. I also pursued research and clinical work in ophthalmology labs, studying topics like diabetic retinopathy and inflammation, and volunteered as a pharmacy technician in India, helping at health camps and participating in global health programs. Those experiences gave me hands-on clinical skills and a broader perspective on healthcare around the world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve been fortunate to receive a few honors along the way. I was a CV Scholar, which provided a full scholarship to Vanderbilt, and my leadership earned me the VALE Award. I was also recognized for my humanitarian work as a Nichols Scholar. Back in high school, I was valedictorian, a National Merit Scholar, and a Presidential Scholar nominee, finishing as Valedictorian of my class.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and service, I love dance, especially choreographing and performing Bharatanatyam, a classical Indian dance. I also enjoy exploring my artistic side through crafting projects, from painting and DIY décor to cake decorating and holiday crafts. And a fun, fearless fact about me? I once went shark cage diving in Hawaii!\u003c/p\u003e","teachingVideoPlaybackId":"Dw71Si2XnK902DmraQW7yMkSVAlQpLkPMp4fMJXIdRak","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is earning a full merit scholarship to Vanderbilt University.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eComing from a background where I deeply value education and service, being awarded a merit scholarship felt like validation of years of hard work, academic dedication, and commitment to making an impact beyond the classroom. It allowed me to pursue a rigorous education in Molecular \u0026amp; Cellular Biology and Medicine, Health, and Society, and I could fully immerse myself in research, clinical volunteering, and service projects focused on health equity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMore than the academic recognition, the scholarship gave me the freedom to say yes to opportunities: conducting ophthalmology research, leading service organizations, volunteering in hospitals, and building initiatives that serve underserved communities. It made my parents incredibly proud, and it reinforced my belief that when you work hard with purpose, doors truly do open.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b6d67821-66ce-4fa5-90cb-a3233f114abe\"}"},{"__ref":"Favorites:{\"uuid\":\"3e5aae64-f54f-44d7-b351-f2b518735c08\"}"},{"__ref":"Favorites:{\"uuid\":\"035912f2-7ce3-4d66-a6fa-c3be87666450\"}"}],"causesSupported":[],"major":"Molecular \u0026 Cellular Biology and Medicine, Health, \u0026 Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"370aafff-fdc5-43d4-914d-9d46462feb8a\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a09d83c-b627-43c9-a8a5-c51c125a4832\"}"},{"__ref":"DeepDives:{\"uuid\":\"2bce14c1-2751-4953-bab8-1dbd1d56372f\"}"},{"__ref":"DeepDives:{\"uuid\":\"5124a212-9fdc-4a8d-8ea9-c26d62705afc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f23f1281-fe8d-4177-bcc6-8e08f0b83a0e/-/preview/-/format/jpg/","https://ucarecdn.com/c410feb6-0076-4f61-9772-9d3e99af4b9f/-/preview/-/format/jpg/","https://ucarecdn.com/b33007d4-1657-4e0d-9acd-0ecb536be752/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e8539519-0bf6-4889-9f20-25d8b9e4bb80\"}"},{"__ref":"Education:{\"uuid\":\"d0a9bab6-b3dc-4758-bd7b-2f50d9c4fb66\"}"}],"hiredAt":"2025-12-28T22:18:15.602Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","K-6 Storybook","Business / Entrepreneurship","Medicine / Health","Web De
