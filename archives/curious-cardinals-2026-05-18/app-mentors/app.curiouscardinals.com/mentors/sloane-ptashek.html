376251abde4\"}":{"__typename":"DeepDives","uuid":"d17896a2-13c6-4045-9288-b376251abde4","content":"\u003cp\u003eDuring my middle and high school years, there were times where I felt lost or unsure. These were times where I felt I definitely could have used someone that was more my equal than my parents, teachers, or directors, and someone that had gone through similar experiences as me. I hope I can provide that for someone and be able to create an open and creative environment where mentees are able to explore their passions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"e95a4b52-4eb8-4b85-9a9e-ef397e74d242\"}":{"__typename":"School","uuid":"e95a4b52-4eb8-4b85-9a9e-ef397e74d242","name":"University of California, Irvine","city":"Irvine","type":"COLLEGE","state":"California","country":"United States","zip":"92697"},"Education:{\"uuid\":\"3834e14b-8675-4dfd-a424-cd5a55ccc856\"}":{"__typename":"Education","uuid":"3834e14b-8675-4dfd-a424-cd5a55ccc856","school":{"__ref":"School:{\"uuid\":\"e95a4b52-4eb8-4b85-9a9e-ef397e74d242\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Music Theatre ","degree":"BFA "},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"0faa6611-a873-433b-a56c-6931326d45bd\"}":{"__typename":"Education","uuid":"0faa6611-a873-433b-a56c-6931326d45bd","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2008","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"07a35c90-820c-4495-b825-d8f01a2b273d\"}":{"__typename":"MentorPublicProfile","uuid":"07a35c90-820c-4495-b825-d8f01a2b273d","displayName":"Sloane P.","slug":"sloane-ptashek","biography":"\u003cp\u003eSloane is a student pursuing a BFA in Music Theatre at UC Irvine. She also is minoring in Art History, with a focus in renaissance art! Apart from college, she has trained with The Atlantic Acting School, Actor Therapy and Applause New York. She enjoys teaching and sharing her joy and passion for theater and art history! For possible mentees, she is excited about learning about singing and music, theatre history, acting lessons, and or teaching and discussing art history topics! She also enjoys directing and producing work! Past experience includes stage managing \u003cem\u003eThey're Playing Our Song\u003c/em\u003e, producing her freshman showcase, and acting in and designing props for \u003cem\u003eThe 25th Annual Putnam County Spelling Bee. \u003c/em\u003eIn my free time, I love to go to museums, try new food, seeing shows, and finding Shirley Temples to drink around the country!!! Being a mentor excites me because I have always loved working with students and being around eager kids and teens. I am excited to help students learn about what they might not in school, and I know that Curious Cardinals empowers students to do just that.  \u003c/p\u003e","teachingVideoPlaybackId":"POrmHpmNqPz3thPtmZbTRbc2EVWDYf00DOqtFQcdXRSQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a7d736e8-d037-4e2f-8a43-7c459a222da1\"}"},{"__ref":"Favorites:{\"uuid\":\"ef2d993e-82e6-4b4b-8c9e-06eea17dcf6e\"}"},{"__ref":"Favorites:{\"uuid\":\"9b5639dd-6d15-4f6a-beea-9e4c7f1f39b0\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0f98dba0-910d-420f-991d-deabb5fc3b0e\"}"},{"__ref":"CausesSupported:{\"uuid\":\"d1e4ed62-8776-4d38-b85d-6af5a218a5c1\"}"}],"major":"Music Theatre ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d17896a2-13c6-4045-9288-b376251abde4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/69db89a4-8d84-4575-8023-bda5e41c7b76/-/preview/-/format/jpg/"],"pronouns":"SHE_HER"
