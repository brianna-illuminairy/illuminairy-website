xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"12c1a55f-ad8f-4fc8-8afd-cde03d5f2a8e\"}":{"__typename":"DeepDives","uuid":"12c1a55f-ad8f-4fc8-8afd-cde03d5f2a8e","content":"\u003cp\u003eI would advise my middle school self to not worry too much. When I was younger I was constantly worrying about my classes, homework, and friendships. I wish I had taken a step back to breathe a little bit and enjoy the moment I was in a little more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"dc3d4f6d-d028-48aa-a574-e2d3ccd849b8\"}":{"__typename":"DeepDives","uuid":"dc3d4f6d-d028-48aa-a574-e2d3ccd849b8","content":"\u003cp\u003eI want the opportunity to help other people discover and pursue things that they truly care about. I love learning new things and am always excited to apply those ideas to tangible projects and I think mentorship is the best way to do it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8b1412d2-3b3a-41f4-be63-8523a1bbd3b2\"}":{"__typename":"DeepDives","uuid":"8b1412d2-3b3a-41f4-be63-8523a1bbd3b2","content":"\u003cp\u003eI chose Neuroscience as my major because I think it is fascinating to learn how the brain works. Specifically I am really interested in how the brain's decision making process is constantly changing and being affected by its environment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5201c91e-ea4d-4a8b-93b1-77e94a619fb4\"}":{"__typename":"DeepDives","uuid":"5201c91e-ea4d-4a8b-93b1-77e94a619fb4","content":"\u003cp\u003eI really enjoy running! In fact I ran the Marine Corps marathon in October!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"658275c6-1da8-4af9-90cb-762749a4e655\"}":{"__typename":"School","uuid":"658275c6-1da8-4af9-90cb-762749a4e655","name":"Mira Mesa High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92126"},"Education:{\"uuid\":\"67ec378e-3acb-4601-b2e8-a04f6c1aca24\"}":{"__typename":"Education","uuid":"67ec378e-3acb-4601-b2e8-a04f6c1aca24","school":{"__ref":"School:{\"uuid\":\"658275c6-1da8-4af9-90cb-762749a4e655\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"3a2471e0-fdca-4472-85dd-42fa6571437e\"}":{"__typename":"Education","uuid":"3a2471e0-fdca-4472-85dd-42fa6571437e","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"1e4801e3-8665-432b-b006-f375f68b56c0\"}":{"__typename":"MentorPublicProfile","uuid":"1e4801e3-8665-432b-b006-f375f68b56c0","displayName":"Victoria H.","slug":"victoria-hunter-1","biography":"\u003cp\u003eHi everyone! I am Victoria Hunter and I am a current sophomore studying Neuroscience at Yale University. I am the oldest of four kids and we are all extremely close. My dad was an officer in the Marine Corps until this past December so I moved quite a bit growing up and we became a lot closer because of that. A few places I have lived are Hawaii, Germany, and California. Due to this I have experienced a variety of teaching styles and I am able to adapt to different methods very easily. I choose to pursue Neuroscience as my area of study because I think that it is fascinating how each decision a person makes has the ability to reroute neural pathways in the brain. While at school I am a board member on my club soccer team, I am a part of the Navy ROTC unit, I play club lacrosse, and I volunteer at a food kitchen each Friday. I also work in my residential college buttery, a place that serves appetizer snacks and a variety of sodas, and Gatorades for late night study sessions. Currently I am in Buenos Aires studying abroad for the semester and exploring the city. One goal I had during college specifically was to study abroad because I think that it expands one's perspective of the world and makes a person more globally aware. It is not extremely common at my school to do so and because of this the process was a little scarier than I initially thought it would be. So far it was completely worth it though and I have truly enjoyed my time here. I have always enjoyed exploring new ideas and places so I thought that a study abroad semester would be a perfect fit for me. A large part of why I want to mentor other students is to help them pursue a topic that they are truly passionate about. I enjoy seeing the process of a person becoming more confident in what they are pursuing and I would be honored to be a part of that.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"dA5e8iIao7Ofs01X7UEvUenfstNUZ6B8mfn4EEUsF6O00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"12c1a55f-ad8f-4fc8-8afd-cde03d5f2a8e\"}"},{"__ref":"DeepDives:{\"uuid\":\"dc3d4f6d-d028-48aa-a574-e2d3ccd849b8\"}"},{"__ref":"DeepDives:{\"uuid\":\"8b1412d2-3b3a-41f4-be63-8523a1bbd3b2\"}"},{"__ref":"DeepDives:{\"uuid\":\"5201c91e-ea4d-4a8b-93b1-77e94a619fb4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fc3e30f0-bdd1-42f2-8dda-2cd85b019c26/-/preview/-/format/jpg/","https://ucarecdn.com/bd3344c6-76fd-4b0d-b809-65ce81ef4843/-/preview/-/format/jpg/","https://ucarecdn.com/4970164b-7982-4ff7-9cff-e8b6883d4e64/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"67ec378e-3acb-4601-b2e8-a04f6c1aca24\"}"},{"__ref":"Education:{\"uuid\":\"3a2471e0-fdca-4472-85dd-42fa6571437e\"}"}],"hiredAt":"2026-01-15T15:33:08.458Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","Calculus","Precalculus / Trigonometry","Algebra II","6-8 Grade Science","Biology","Physics","Chemistry","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Computer Science","K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Sports Journalism","Video / Photography","Business / Entrepreneurship","Finance / Investing","Medicine / Health","Sports Analytics","STEM Project","Aviation / Aerospace","Web Design","Machine Learning / AI","Sustainability","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"dis
