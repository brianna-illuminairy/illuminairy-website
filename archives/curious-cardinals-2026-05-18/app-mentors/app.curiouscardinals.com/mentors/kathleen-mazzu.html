xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1e2ff32b-efe9-497e-a6a5-aa6adccf5211\"}":{"__typename":"Favorites","uuid":"1e2ff32b-efe9-497e-a6a5-aa6adccf5211","photoUrl":"https://ucarecdn.com/1e01d948-e066-45e5-a029-70dcce36b614/","title":"Boston","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ba6fb344-d1f4-47b5-8d8b-beb59974aec1\"}":{"__typename":"DeepDives","uuid":"ba6fb344-d1f4-47b5-8d8b-beb59974aec1","content":"\u003cp\u003eGrowing up, I struggled with reading and often gave myself excuses for why I didn’t need to be good at certain subjects. It was easier to hide behind my dyslexia than to push through it. For a long time, I let that hold me back. But everything shifted when I saw my older sister chasing her dreams with so much drive and purpose. Watching her work hard and succeed, helped me realize that my dreams were possible too. It wouldn’t be easy, and it would take time, passion, and commitment, but seeing her example gave me the strength to believe in myself. Without even knowing it, she became my mentor. She showed me that growth only comes when you lean into the hard parts, and that the biggest dreams require the biggest pushes. Our dreams may look different, but her work ethic empowered me, and now I want to be that person for someone else. A guide. An example. A mentor. I want to help students stop hiding behind their flaws and start embracing their potential, because that’s where the real success begins.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c59a9d57-32c3-4652-befe-bc493f3d8d9e\"}":{"__typename":"DeepDives","uuid":"c59a9d57-32c3-4652-befe-bc493f3d8d9e","content":"\u003cp\u003eIf I could give advice to my middle school self, oh wow, where do I even start? Back then, it felt like the world was caving in every time I fell behind or saw my classmates excel in subjects that I just couldn’t seem to grasp. I was constantly comparing myself, and when I got caught doodling in class, I was ridiculed by my teachers instead of being encouraged. I truly believed that my worth was defined by the letters on my report card. And while I’m proud that those challenges pushed me to work harder, I wish I could go back and tell myself that my value came from so much more than a grade. I would remind myself that it’s okay to shine in different ways, that my artistic talent was just as valid as academic success. If I had focused more on where I was thriving, maybe I would’ve built the confidence to let that carry over into the areas where I struggled. Instead of thinking I wasn’t smart because of my dyslexia, I would’ve learned earlier that everyone has their own strengths and weaknesses, and that’s what makes us human. I had (and still have) all the time in the world to grow, learn, and strengthen every part of myself, even the ones I used to doubt.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f277f28e-1cce-4956-9757-e40af4078b1e\"}":{"__typename":"DeepDives","uuid":"f277f28e-1cce-4956-9757-e40af4078b1e","content":"\u003cp\u003eOne of my biggest passion projects, and one I’m still continuing, is illustrating children’s books. It all started back in my freshman year of high school, when a woman noticed my artwork at a school event where I had painted six-foot panels of Dr. Seuss characters. Even though it was simple replication, she saw something in my work, my attention to detail, my creativity, and most importantly, my passion. Shortly after, she invited me to collaborate on a children’s book called \u003cem\u003eSimply Bella\u003c/em\u003e, a sweet story about a dog finding her forever home with a Latina family. The story resonated deeply with me, not just because I love dogs, but because of its message of love, belonging, and cultural representation. What started as a single book has since grown into a series, and I’ve continued to illustrate new titles as the characters’ journey unfolds. Through this project, I’ve been able to visually bring stories to life while also documenting my own evolution as an artist. I look back at my first sketches and can see how far I’ve come, not just in technique, but in storytelling. While I’m constantly creating in architecture, children’s book illustration is a completely different outlet. It allows me to return to my roots, paper (or now, iPad) and pen, and express myself in the way I always have. It’s a reminder that no matter how technical or structured my studies become, there’s always room for imagination, whimsy, and heartfelt storytelling in the work I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"86022633-c980-4b05-aa77-e0138d98b6b9\"}":{"__typename":"DeepDives","uuid":"86022633-c980-4b05-aa77-e0138d98b6b9","content":"\u003cp\u003eThe dreaming never really stops for me, I’ve got academic goals, career goals, and personal ones too. But if I had to pick just one, I’d focus on my career. I genuinely believe I’m studying something I love, and my biggest hope is that architecture will always feel more like passion than “work.” I’m currently in a five-year accredited architecture program, and once I graduate, my first goal is to become licensed as soon as possible. I want to jump into the profession by joining a well-recognized firm where I can pour my energy into technical drawings, model-making, and real design work that makes an impact. Ideally, I’d travel with that firm, learning, exploring, and growing both professionally and personally. But the long-term dream? I want to start my own local firm someday. Wherever I end up, hopefully near a big city, I want to be that go-to architect people in the community call when it’s time to redesign, renovate, or build their forever home. The idea of growing with a family, helping them shape a space that reflects their lives and dreams, that’s what feels most fulfilling to me. Creating homes, not just houses, is the legacy I want to build.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"43c5af56-eaff-43ae-8ed9-77026d543c73\"}":{"__typename":"School","uuid":"43c5af56-eaff-43ae-8ed9-77026d543c73","name":"The Bromfield School","city":"Harvard","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01451"},"Education:{\"uuid\":\"b02ed75b-1cd2-4287-8743-4f31ea7af67c\"}":{"__typename":"Education","uuid":"b02ed75b-1cd2-4287-8743-4f31ea7af67c","school":{"__ref":"School:{\"uuid\":\"43c5af56-eaff-43ae-8ed9-77026d543c73\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ac3b1132-41ad-4d93-8d6d-56c94caf18f7\"}":{"__typename":"School","uuid":"ac3b1132-41ad-4d93-8d6d-56c94caf18f7","name":"Rensselaer Polytechnic Institute","city":"Troy","type":"COLLEGE","state":"New York","country":"United States","zip":"12180"},"Education:{\"uuid\":\"a7684e27-af9c-4795-844a-b1faa7c7a210\"}":{"__typename":"Education","uuid":"a7684e27-af9c-4795-844a-b1faa7c7a210","school":{"__ref":"School:{\"uuid\":\"ac3b1132-41ad-4d93-8d6d-56c94caf18f7\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2028","major":"architecture","degree":null},"MentorPublicProfile:{\"uuid\":\"887def77-04e5-4dab-bde8-c68d13e6f3ba\"}":{"__typename":"MentorPublicProfile","uuid":"887def77-04e5-4dab-bde8-c68d13e6f3ba","displayName":"Kathleen  M.","slug":"kathleen-mazzu","biography":"\u003cp\u003eHi! I’m Kathleen, and I’m currently studying Architecture at Rensselaer Polytechnic Institute. Ever since I was a kid, I’ve loved creating, whether it was sketching, crafting, or building cardboard mansions for my toys, yes, with furniture and everything. That love for making things led me straight into the world of architecture, where I get to combine creativity, storytelling, and real-world problem-solving every day.\u003c/p\u003e\u003cp\u003eI’m super excited to be a mentor with Curious Cardinals because I know firsthand how powerful guidance can be. Back in high school, I had dreams, running the National Art Honor Society, organizing events, trying to bring ideas to life. I was lucky to have an older sister who had done something similar before me, and her support made all the difference. She showed me what was possible. Now, I want to be that person for someone else, to help light that creative fire and remind students that their ideas are worth building (even if they start with cardboard).\u003c/p\u003e\u003cp\u003eOutside of school, I like to keep my hands busy. I’m a published illustrator and currently work as an in-house illustrator for The Purple Owl, a publishing company that uplifts minority voices. As a Latina woman, I’m incredibly proud to be part of a mission that champions representation through storytelling. When I’m not drawing, you can probably find me sewing (I used to run an Etsy shop!) or making tufted rugs that I gift to friends and family. Basically, if it involves fabric, paper, or paint I’m in.\u003c/p\u003e\u003cp\u003eIf you’re navigating the college application process or building a creative portfolio and feeling a little overwhelmed, I’ve been there. I’d love to help you figure it out and make something you’re proud of. Whether you’re dreaming big or just trying to figure out your next step, I’m here to cheer you on!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"z5NcJdQoNKcP01hSWAdZEUjnoBFWQVzupDwSBiGMm89I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1e2ff32b-efe9-497e-a6a5-aa6adccf5211\"}"}],"causesSupported":[],"major":"architecture","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ba6fb344-d1f4-47b5-8d8b-beb59974aec1\"}"},{"__ref":"DeepDives:{\"uuid\":\"c59a9d57-32c3-4652-befe-bc493f3d8d9e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f277f28e-1cce-4956-9757-e40af4078b1e\"}"},{"__ref":"DeepDives:{\"uuid\":\"86022633-c980-4b05-aa77-e0138d98b6b9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bb7bed3c-6290-4cf3-9acb-acaa7caa9948/-/preview/-/format/jpg/","https://ucarecdn.com/8512d902-f57a-4b95-a670-1edeb3804071/-/preview/-/format/jpg/","https://ucarecdn.com/efd92468-073b-49a3-a3b8-553547b57ef2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b02ed75b-1cd2-4287-8743-4f31ea7af67c\"}"},{"__ref":"Education:{\"uuid\":\"a7684e27-af9c-4795-844a-b1faa7c7a210\"}"}],"hiredAt":"2025-05-10T14:29:24.364Z","topics":["K-6 Storybook","Fashion / Cosmetics","Visual Arts / Graphic Design","Video / Photography","Business / Entrepreneurship","Finance / Investing","Web Design","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kathleen-mazzu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"887def77-04e5-4dab-bde8-c68d13e6f3ba\"}"}}},"_sentryTraceData":"751b653b8bfb44cda023549a9a98e436-8c6daf1a88d87085-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=751b653b8bfb44cda023549a9a98e436,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"kathleen-mazzu"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
