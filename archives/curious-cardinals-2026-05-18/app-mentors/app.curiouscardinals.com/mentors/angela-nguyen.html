xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"64d878ac-4827-4ca7-ba3e-557fb6ae6b8d\"}":{"__typename":"DeepDives","uuid":"64d878ac-4827-4ca7-ba3e-557fb6ae6b8d","content":"\u003cp\u003eDon’t be afraid to pursue what you love or venture into uncharted territory, even when it feels intimidating. While it's easy to cling to the plans and goals you've meticulously crafted for your future in college and beyond, there's unparalleled gratification in taking a leap of faith and discovering that the unexpected path was meant for you all along. Embrace your passions wholeheartedly, showcasing them with enthusiasm and dedication, even if they don’t seem to align perfectly with your academic or career trajectory. Often, these pursuits enrich your life in ways that structured plans cannot predict.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"924f59ba-d725-483b-b38b-6c119c6527e0\"}":{"__typename":"DeepDives","uuid":"924f59ba-d725-483b-b38b-6c119c6527e0","content":"\u003cp\u003eIn my spare time, I love to run and hike. There's something deeply grounding and restorative about being in tune with the natural world around us, especially in the midst of a busy college life where we often overlook the beauty that surrounds us.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"cc0ed134-c848-4dd7-bb55-dce7347d3828\"}":{"__typename":"DeepDives","uuid":"cc0ed134-c848-4dd7-bb55-dce7347d3828","content":"\u003cp\u003eMentorship matters to me because it’s a powerful way to foster growth, not only for the mentee but also for the mentor. I believe that sharing knowledge, experience, and insights can have a transformative impact on someone’s personal and professional journey. Mentorship provides a space to explore ideas, ask questions, and build confidence, helping others navigate challenges and opportunities with greater clarity and support. For me, it’s incredibly rewarding to guide others toward their potential, especially when they discover new passions, develop skills, or unlock doors to future opportunities they may not have considered. At its core, mentorship is about creating meaningful connections, empowering others, and paying forward the wisdom that has been shared with me along the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c0b2be66-9d46-45d3-991d-229580df00af\"}":{"__typename":"DeepDives","uuid":"c0b2be66-9d46-45d3-991d-229580df00af","content":"\u003cp\u003eEventually, I hope to join a startup company focused on developing medical technologies that can significantly improve patient outcomes, particularly through collaboration with generational businesses. These long-standing companies have deep-rooted relationships with the communities they serve, and I believe that partnering with them to introduce innovative healthcare solutions can lead to sustainable and impactful change. By working at the intersection of cutting-edge technology and established business practices, I aspire to contribute to advancements that not only enhance patient care but also strengthen the legacy of these businesses, ensuring that the benefits reach future generations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"df852e85-9123-4c3b-9e6c-a7bf0a9aa86b\"}":{"__typename":"School","uuid":"df852e85-9123-4c3b-9e6c-a7bf0a9aa86b","name":"Milpitas High School","city":"Milpitas","type":"HIGH","state":"California","country":"United States","zip":"95035"},"Education:{\"uuid\":\"bf0480dc-57c2-4c62-a715-ed42b4e30322\"}":{"__typename":"Education","uuid":"bf0480dc-57c2-4c62-a715-ed42b4e30322","school":{"__ref":"School:{\"uuid\":\"df852e85-9123-4c3b-9e6c-a7bf0a9aa86b\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"b2bdf850-7e99-46bc-8c12-4922b321d716\"}":{"__typename":"Education","uuid":"b2bdf850-7e99-46bc-8c12-4922b321d716","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology and Science, Technology \u0026 Society","degree":null},"MentorPublicProfile:{\"uuid\":\"acbb5269-5c05-4ca8-b438-7178059328a6\"}":{"__typename":"MentorPublicProfile","uuid":"acbb5269-5c05-4ca8-b438-7178059328a6","displayName":"Angela N.","slug":"angela-nguyen","biography":"\u003cp\u003eAngela Nguyen graduated as valedictorian of her high school class, where she founded a tutoring non-profit dedicated to supporting students of diverse learning backgrounds. Her lifelong passion for studying the intersection of neuropsychology and teaching was sparked by her own experiences as a student, where she saw the transformative power of tutoring. Angela balanced running the non-profit with private tutoring and subject-specific tutoring through programs like Science Olympiad.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow at Stanford, Angela is an enthusiastic biologist and innovator. She merges her love for learning about the human body with biodesign and engineering, prototyping new medical technologies in Stanford's biodesign labs. With a strong entrepreneurial drive, Angela is also passionate about business management in the life sciences and aims to pursue a career in this field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond her STEM interests, Angela enjoys reading and creative writing, reflecting on how much she loved crafting her college application portfolio. Outdoorsy by nature, she spends her free time exploring trails, baking, and running, with a long-term goal of competing in an Ironman competition.\u003c/p\u003e","teachingVideoPlaybackId":"FCO1wSUNU7MuRXiDGQhlOZsjQb7kGzQe8bkG1a01RaPg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology and Science, Technology \u0026 Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"64d878ac-4827-4ca7-ba3e-557fb6ae6b8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"924f59ba-d725-483b-b38b-6c119c6527e0\"}"},{"__ref":"DeepDives:{\"uuid\":\"cc0ed134-c848-4dd7-bb55-dce7347d3828\"}"},{"__ref":"DeepDives:{\"uuid\":\"c0b2be66-9d46-45d3-991d-229580df00af\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/05ad4f03-031e-4d7a-89df-72d0a688c482/-/preview/-/format/jpg/","https://ucarecdn.com/041119ef-cca5-4d90-97df-b99d13c91046/-/preview/-/format/jpg/","https://ucarecdn.com/ab17a113-3dad-40e7-9376-74bca08626f3/-/preview/-/format/jpg/"
