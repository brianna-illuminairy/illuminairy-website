xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"644feacc-55c5-4955-b521-37115335660e\"}":{"__typename":"DeepDives","uuid":"644feacc-55c5-4955-b521-37115335660e","content":"\u003cp\u003eI attended high school in the Bay Area at Lynbrook, which was top 10 in the state. The environment was intensely competitive—it felt like everyone was excelling, and I had to work incredibly hard to keep up. I graduated as valedictorian, juggling AP classes, student council involvement, and community service activities while trying to figure out who I was beyond my achievements. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese experiences carried over into college, where I realized my path wasn’t as straightforward as I thought. I started at UCSD, but transferring to Cornell was a pivotal moment for me. I also switched majors from economics to environmental science before finally settling into data and information science. Each step involved questioning my choices and exploring what truly excited me.\u003c/p\u003e\u003cp\u003eBecause of this journey, I deeply understand how difficult it can be for students to find their passions, especially in high-pressure environments. I’m excited to mentor students through similar challenges—whether it’s navigating academics, managing stress, or figuring out their next steps in life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"4732bef5-48d4-4cc8-b96d-2799c57dc737\"}":{"__typename":"DeepDives","uuid":"4732bef5-48d4-4cc8-b96d-2799c57dc737","content":"\u003cp\u003eOne of my proudest achievements is leading a groundbreaking research project that was recently published in a leading sustainable and smart cities academic journal. This work was a collaboration between Cornell and Imperial College and focused on addressing urban air pollution—a topic close to my heart, having grown up in Northern California and experienced the worsening wildfire smoke each summer.\u003c/p\u003e\u003cp\u003eThe project involved analyzing an unprecedented scale of data: over 350 sensors capturing air quality in London for several years, compared to previous studies that typically worked with only five sensors for a few weeks. Navigating this scale required developing a novel machine learning algorithm. I drew inspiration from fields like genomics clustering and credit card fraud detection to create an innovative technique for identifying non-traffic emission sources, which are notoriously hard to pinpoint due to their variability and complexity.\u003c/p\u003e\u003cp\u003eThis experience not only honed my technical skills but also taught me the persistence and creativity needed to overcome challenges in academia. I know firsthand what it takes to publish research, from identifying impactful problem spaces to navigating the rigorous peer-review process. I’m excited to share these insights with students, helping them explore cutting-edge technologies and find solutions to meaningful problems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"ea9b49db-3e27-48e0-933e-c034ce8b7f61\"}":{"__typename":"DeepDives","uuid":"ea9b49db-3e27-48e0-933e-c034ce8b7f61","content":"\u003cp\u003eMy dream job is to create impactful, tech-enabled solutions that address societal and environmental challenges. Currently, I’m on the path to achieving this as a product management intern at Wing, Alphabet’s drone delivery company. This will help decarbonize last-mile delivery and assist in taking cars off the road. Overall, I’m excited about leveraging technology for sustainable urban solutions, such as autonomous vehicles and last-mile delivery systems.\u003c/p\u003e\u003cp\u003eLong-term, I aspire to continue in product management to innovate in urban technology and climate tech. My ultimate goal is to found a startup that builds products to bridge societal gaps and promote sustainability. At Cornell Tech, I’m fortunate to be part of a program that includes a sandbox and accelerator, offering hands-on experience and support for entrepreneurship. This aligns perfectly with my vision of using technology as a force for good to create a more sustainable and equitable future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"bd5a6d35-8a0e-4581-b22c-812dcfb71ad9\"}":{"__typename":"DeepDives","uuid":"bd5a6d35-8a0e-4581-b22c-812dcfb71ad9","content":"\u003cp\u003eI’m working on an art exhibition selected by the NYC Office of Technology from a competitive pool of 100+ submissions. The project combines NYC Open Data with digital fabrication techniques (laser cutting, 3D printing, etc.), creating a sculpture and advocacy for elderly communities in NYC Chinatown. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough this project, I’ve honed skills in creative data visualization, creative coding, and identifying meaningful problem spaces. I’d be thrilled to help students translate their interests into impactful projects, whether through coding, art, or advocacy. I love guiding students to use creativity and technology to explore and advocate for the issues they care about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"abd57c02-bbeb-427f-b642-0488f9094f71\"}":{"__typename":"School","uuid":"abd57c02-bbeb-427f-b642-0488f9094f71","name":"Lynbrook High School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95129"},"Education:{\"uuid\":\"ad37bfee-0b14-4e94-8fef-0a12472dd441\"}":{"__typename":"Education","uuid":"ad37bfee-0b14-4e94-8fef-0a12472dd441","school":{"__ref":"School:{\"uuid\":\"abd57c02-bbeb-427f-b642-0488f9094f71\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"3ef600b1-50f9-4e43-b615-08e713f59fbf\"}":{"__typename":"Education","uuid":"3ef600b1-50f9-4e43-b615-08e713f59fbf","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"e0043ff9-a32e-45cf-8dab-194984386664\"}":{"__typename":"MentorPublicProfile","uuid":"e0043ff9-a32e-45cf-8dab-194984386664","displayName":"Michelle H.","slug":"michelle-hui","biography":"\u003cp\u003eHi! I’m \u003cstrong\u003eMichelle Hui\u003c/strong\u003e, a passionate technologist and mentor currently pursuing an M.S. in Computer Science with a focus on Urban Technology at Cornell, where I’m a Merit Scholar. I also hold a B.S. in Information Science with a specialization in Data Science from Cornell ('24). My work focuses on building technology for social impact, advancing equity in education, and addressing global sustainability challenges.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e🔹 \u003cstrong\u003eProfessional Experience\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eProduct Management at Alphabet\u003c/strong\u003e: I’ll be joining Wing, an Alphabet company, as a Product Management Intern. Wing is pioneering the future of drone delivery, last-mile logistics, and sustainability.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eUnited Nations\u003c/strong\u003e: At the UN, I work to advance the Sustainable Development Goals, helping launch initiatives like the UN Decade of Sustainable Transport. My experience spans global development and partnerships with organizations like the World Bank and USAID.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePublished Research\u003c/strong\u003e: I recently lead-authored a three-year research project developing a machine learning algorithm to address urban air pollution. Published in a leading sustainable cities journal, this work highlights my expertise in data science, problem-solving, and collaboration.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e🔹 \u003cstrong\u003eOther Experiences\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eArt + Tech Leadership\u003c/strong\u003e: I founded the Art + Tech Club at Cornell Tech, integrating digital fabrication techniques like 3D printing, laser cutting, and smart textiles into creative projects. I’d love to help students explore the intersection of technology and art!\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eTeaching \u0026amp; Advocacy\u003c/strong\u003e: As a mentor with Girls Who Code and Break Through Tech, I’ve guided students in developing machine learning projects for companies like Google. I’m committed to gender equity in STEM and enjoy making technical concepts approachable and engaging.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHaving navigated the college and post-graduate process, I understand how overwhelming it can be. I’d be thrilled to help students pursue passion projects, craft authentic essays that showcase their unique strengths, and find personal niches of interest. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eLearn more about me at michelle-hui.com!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"644feacc-55c5-4955-b521-37115335660e\"}"},{"__ref":"DeepDives:{\"uuid\":\"4732bef5-48d4-4cc8-b96d-2799c57dc737\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea9b49db-3e27-48e0-933e-c034ce8b7f61\"}"},{"__ref":"DeepDives:{\"uuid\":\"bd5a6d35-8a0e-4581-b22c-812dcfb71ad9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bacd5157-8f02-4fb3-99dd-15b38c915c05/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ad37bfee-0b14-4e94-8fef-0a12472dd441\"}"},{"__ref":"Education:{\"uuid\":\"3ef600b1-50f9-4e43-b615-08e713f59fbf\"}"}],"hiredAt":"2024-12-24T06:31:32.156Z","topics":["Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science","Coding / Programming","Machine Learning / AI","Sustainability"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"michelle-hui\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e0043ff9-a32e-45cf-8dab-194984386664\"}"}}},"_sentryTraceData":"ab2cd1d0f05d4ac29d9e07de925944f6-84cb0dcfd957f
