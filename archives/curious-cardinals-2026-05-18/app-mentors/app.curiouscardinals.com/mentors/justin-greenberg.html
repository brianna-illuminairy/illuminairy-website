xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"929a3bb7-55ab-430b-a4f5-522f2496c111\"}":{"__typename":"Favorites","uuid":"929a3bb7-55ab-430b-a4f5-522f2496c111","photoUrl":"https://ucarecdn.com/975f6534-69ee-40a2-ab66-f3ba4ea02bd8/","title":"Channel Orange - Frank Ocean","type":"ALBUM"},"Favorites:{\"uuid\":\"89c5d096-a8f8-438e-b9af-54c45cf5e13f\"}":{"__typename":"Favorites","uuid":"89c5d096-a8f8-438e-b9af-54c45cf5e13f","photoUrl":"https://ucarecdn.com/21db5f48-1530-473d-978a-817fc0d5676f/","title":"Pittsburgh Steelers","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b705f21b-4ab7-42d0-9d4e-d295369b639d\"}":{"__typename":"DeepDives","uuid":"b705f21b-4ab7-42d0-9d4e-d295369b639d","content":"\u003cp\u003eDon’t stress so much — no homework, test, or club meeting is more important than spending time with your family or doing something you love. Go to that movie night, play that extra round of pickleball, hang out with your siblings. I promise you can still get into your dream college \u003cem\u003eand\u003c/em\u003e have fun along the way. I’m living proof.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"449b1866-19a7-4c8a-8f2d-5196e9c7cbed\"}":{"__typename":"DeepDives","uuid":"449b1866-19a7-4c8a-8f2d-5196e9c7cbed","content":"\u003cp\u003eMentorship matters to me because I truly don’t think I’d be where I am today without the mentors in my life. From older students who helped me navigate college apps to my older brother and parents who support everything I do — their guidance shaped me. No project, goal, or decision has ever felt complete without someone I could turn to for advice, and I want to be that person for someone else now.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"59a7b37c-a57b-441e-b32b-2dc975d8181e\"}":{"__typename":"DeepDives","uuid":"59a7b37c-a57b-441e-b32b-2dc975d8181e","content":"\u003cp\u003eOne thing I’ve always hoped to accomplish in my lifetime is building my own house. I think designing everything — especially my room — would be so cool. My mom’s known this has been a dream of mine ever since I got obsessed with Minecraft as a kid, but now that I’m older, I’d love to actually make it happen one day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"23c77428-b20a-4ba6-8b08-4d7b13d05b41\"}":{"__typename":"DeepDives","uuid":"23c77428-b20a-4ba6-8b08-4d7b13d05b41","content":"\u003cp\u003eI chose Public Policy because it lets me learn about everything I care about — like law, helping others, and how real change happens. The classes are super unique (I took one called \u003cem\u003eThe Good Life\u003c/em\u003e with eight professors — one was a Buddhist monk who didn’t wear shoes and led us in meditation). I added Economics because I wanted to push myself to explore something new, and it felt broad enough that I could find my niche — and maybe even a new passion I didn’t expect.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"6a3858a9-f89f-4e9d-81c2-e9c9421997b7\"}":{"__typename":"School","uuid":"6a3858a9-f89f-4e9d-81c2-e9c9421997b7","name":"Eleanor Roosevelt High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10021"},"Education:{\"uuid\":\"aa30690a-f568-4471-b675-5bdc1d855c07\"}":{"__typename":"Education","uuid":"aa30690a-f568-4471-b675-5bdc1d855c07","school":{"__ref":"School:{\"uuid\":\"6a3858a9-f89f-4e9d-81c2-e9c9421997b7\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"4e448b34-632d-4029-bf21-71d8bb1db24c\"}":{"__typename":"Education","uuid":"4e448b34-632d-4029-bf21-71d8bb1db24c","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Public Policy, Economics and History","degree":null},"MentorPublicProfile:{\"uuid\":\"4b862472-7c42-43a7-9caf-bc9e70304937\"}":{"__typename":"MentorPublicProfile","uuid":"4b862472-7c42-43a7-9caf-bc9e70304937","displayName":"Justin G.","slug":"justin-greenberg","biography":"\u003cp\u003eHi! I’m Justin Greenberg — a sophomore at Duke studying Public Policy and Economics with a minor in History. For most of my life, I was the kind of student who stressed over every test, joined every extracurricular, and felt like I always had to do \u003cem\u003emore\u003c/em\u003e. But somewhere along the way, I started figuring out how to make learning feel fun, and that changed everything.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always cared deeply about social impact, especially around education, equity, and public service. In high school, I started a nonprofit to fight food insecurity in my neighborhood and launched a passion project where I built a website and tried to pass my own bill to make school curricula more inclusive. I used to think these kinds of things had to be tackled through serious, stressful work — but I’ve found joy in doing them my own way. Whether it’s researching political polarization in North Carolina, consulting for Israeli startups through TAMID, or helping students register to vote through Duke Votes, I bring creativity and community into the mix — and that makes it all so much more meaningful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m a massive pickleball and tennis fan (if you're ever down for a virtual rally, let me know!) and I never miss a football Sunday. I ran my first half marathon this year, which felt impossible at first, but somehow I made it fun — training to 2010s pop hits and treating it like a challenge with friends. I’m also the guy who turns study sessions into game nights, pitches into storytelling moments, and policy discussions into real-life applications.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentoring and teaching are some of my favorite things to do, because I know how overwhelming school can feel — and I love helping people discover their own groove. Whether it’s breaking down a stats concept, editing a college essay, or just talking through goals, I’ll meet you where you are and make sure we have some laughs along the way.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"929a3bb7-55ab-430b-a4f5-522f2496c111\"}"},{"__ref":"Favorites:{\"uuid\":\"89c5d096-a8f8-438e-b9af-54c45cf5e13f\"}"}],"causesSupported":[],"majo
