xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"d3e0bf11-feaa-412f-bf31-a472bbb0c476\"}":{"__typename":"CausesSupported","uuid":"d3e0bf11-feaa-412f-bf31-a472bbb0c476","name":"Sunrise Association ","description":"\u003cp\u003eSunrise supports families of children with cancer. I worked as a camp counselor.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7bf159aa-eae3-4412-923e-96ad9e06d641\"}":{"__typename":"DeepDives","uuid":"7bf159aa-eae3-4412-923e-96ad9e06d641","content":"\u003cp\u003eI'm a camp girl! I went to sleepaway camp until I was 16. After that, I started working for a day camp for kids with cancer called Sunrise. I am lucky to still be involved with Sunrise's events today! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"2b73f308-9449-463a-9034-3eb6bd5d1221\"}":{"__typename":"DeepDives","uuid":"2b73f308-9449-463a-9034-3eb6bd5d1221","content":"\u003cp\u003eWorking out, baking \u0026amp; spending time with friends. I recently learned how to bake sourdough! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"470ace84-a025-4f96-b172-416f91f6486b\"}":{"__typename":"DeepDives","uuid":"470ace84-a025-4f96-b172-416f91f6486b","content":"\u003cp\u003eI have seen firsthand the power of mentorship. It has opened doors for me including opportunities for passion projects and to learn from senior leaders at work. I have also learned so much from my mentees in the past and want to inspire girls to be confident and ask big questions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"537e5bb7-fd5a-4c0f-87af-93fe3d0dd329\"}":{"__typename":"DeepDives","uuid":"537e5bb7-fd5a-4c0f-87af-93fe3d0dd329","content":"\u003cp\u003eMy dream job would be to be the CEO of a wellness / fitness company that is focused on helping people feel strong and confident. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"575aaf39-b6f4-4e81-99d3-578c5efb96ed\"}":{"__typename":"School","uuid":"575aaf39-b6f4-4e81-99d3-578c5efb96ed","name":"Half Hollow Hills High School East","city":"Dix Hills","type":"HIGH","state":"New York","country":"United States","zip":"11746"},"Education:{\"uuid\":\"07b0338c-e8d8-4da3-9961-5320689fa17d\"}":{"__typename":"Education","uuid":"07b0338c-e8d8-4da3-9961-5320689fa17d","school":{"__ref":"School:{\"uuid\":\"575aaf39-b6f4-4e81-99d3-578c5efb96ed\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"dd02f7fd-d49a-411e-9bff-cfd46094f4bc\"}":{"__typename":"Education","uuid":"dd02f7fd-d49a-411e-9bff-cfd46094f4bc","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Human and Organizational Development","degree":null},"MentorPublicProfile:{\"uuid\":\"376f8446-1c41-4aa1-8e56-e4b5e75e2b14\"}":{"__typename":"MentorPublicProfile","uuid":"376f8446-1c41-4aa1-8e56-e4b5e75e2b14","displayName":"Brooke B.","slug":"brooke-blumberg","biography":"\u003cp\u003eHi! I'm Brooke, a Vanderbilt University graduate (Class of 2023) with a degree in Human and Organizational Development. I'm currently working as an Analyst at Citi Private Bank. My background in business and psychology has provided me with a unique perspective for my role in Wealth.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eDuring my time at Vanderbilt, I immersed myself in a variety of extracurriculars. I was an active member of the DSP business fraternity, ran our chapter of Relay for Life, and found a creative outlet in hip-hop dance (a lifelong passion that began when I was just three years old!).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eOutside the world of finance, I'm a self-proclaimed foodie and explorer, always eager to discover new restaurants and travel to new places. I'm also an avid Pilates enthusiast and love trying new workouts across NYC.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eMentorship holds a special place in my heart. Having benefited immensely from the guidance of incredible mentors who have pushed me beyond my comfort zone, I'm passionate about paying it forward. My goal is to empower my mentees to discover their own strengths, pursue their passions, and build confidence – all while sharing a few laughs along the way!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement
