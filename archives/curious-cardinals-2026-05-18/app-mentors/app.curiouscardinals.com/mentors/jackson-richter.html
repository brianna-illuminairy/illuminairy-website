f644506e5\"}":{"__typename":"Education","uuid":"d4679f25-db34-4084-80c4-7e0f644506e5","school":{"__ref":"School:{\"uuid\":\"97de59a2-9916-4f4f-a140-82ac8b1700ac\"}"},"startYear":"2005","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"beba029d-537e-4eb4-9c41-3fc442650bab\"}":{"__typename":"Education","uuid":"beba029d-537e-4eb4-9c41-3fc442650bab","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Public Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"64e0aea1-2a88-4181-83ad-62102e561eef\"}":{"__typename":"MentorPublicProfile","uuid":"64e0aea1-2a88-4181-83ad-62102e561eef","displayName":"Jackson R.","slug":"jackson-richter","biography":"\u003cp\u003eHello future mentees! I'm Jackson, born and raised in New York and a Stanford graduate (go Card!). I went to an all-boys school for 13 years with 29 students in my graduating class, so going to a huge college out in California was an amazing experience for me. I majored in Public Policy and minored in Data Science, and I also received my Master of Public Policy degree with a Health Care Policy concentration.\u003cbr\u003e\u003cbr\u003eOutside the classroom, I founded Stanford's chapter of BridgeUSA, an organization focused on using college campuses as a means to depolarize America. I am exceedingly passionate about productive political discourse across the aisle and bridging ideological gaps between people of differing perspectives. I was also an avid member of Stanford in Government - campus' largest nonpartisan government organization - and I was a teaching assistant for Health Care Policy \u0026amp; Reform and Biodesign Fundamentals.\u003cbr\u003e\u003cbr\u003eSome fun facts about me:\u003cbr\u003e     - I care deeply about mental health and health care innovation. Always down to chat about these topics!\u003cbr\u003e     - I'm a basketball junkie and the biggest Knicks fan in the world. Ask me about some of the games I've been lucky enough to attend.\u003cbr\u003e     - I love all different kinds of music. My favorite artists span from Kendrick Lamar to Metallica.\u003cbr\u003e     - I'm a roller coaster nerd and a self-proclaimed \"thrill-seeker.\"\u003cbr\u003e\u003cbr\u003eI can't wait to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"GxQKVNxDp7s1f01yd1J02FxylrPIrxaj9FDMyB401HI01bY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"82d990cb-790f-4836-bb2c-d2d5962c0219\"}"},{"__ref":"Favorites:{\"uuid\":\"3add3a74-4d49-48ff-90f3-630c60798687\"}"},{"__ref":"Favorites:{\"uuid\":\"2ca56c07-01d5-4001-9c10-8424e7be5995\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"bbabec73-d6cb-44fd-9de4-73d63f9314c1\"}"}],"major":"Public Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fe1bdb42-7ee3-4189-a7ae-6ee724e3cde7\"}"},{"__ref":"DeepDives:{\"uuid\":\"d88065ce-8d14-4b3f-b02d-0997038a1b76\"}"},{"__ref":"DeepDives:{\"uuid\":\"21578fe7-9d40-48c4-a235-20e1359e234f\"}"},{"__ref":"DeepDives:{\"uuid\":\"b98ed10d-3836-4901-8b5c-c35f2a1fb49b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c6beac1c-b2cb-4820-b85a-7f60f46c86fe/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"d4679f25-db34-4084-80c4-7e0f644506e5\"}"},{"__ref":"Education:{\"uuid\":\"beba029d-537e-4eb4-9c41-3fc442650bab\"}"}],"hiredAt":"2023-08-20T21:31:42.730Z","topics":["Sports Journalism","History Project","Business / Entrepreneurship","Law / Government / Policy","Journalism","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true
