xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"fc89dd8b-0e66-46c3-a25f-24706b8158f6\"}":{"__typename":"DeepDives","uuid":"fc89dd8b-0e66-46c3-a25f-24706b8158f6","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime? To help create the next generation of human-centered robots — machines that don’t just \u003cem\u003ework\u003c/em\u003e, but \u003cem\u003eunderstand\u003c/em\u003e. I want to be at the frontier of AI and robotics, turning wild ideas into real, intelligent companions that make everyday life more connected, creative, and deeply human.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"916db9cf-9124-4c1f-8ed5-aa066c8cc068\"}":{"__typename":"DeepDives","uuid":"916db9cf-9124-4c1f-8ed5-aa066c8cc068","content":"\u003cp\u003eHonestly, I wasn’t that different from you — curious, a little restless, always tinkering with new ideas. What really defined me, though, was my drive. I loved diving deep into things I cared about, whether it was robotics, bridge, or a random side project that got out of hand. I always wanted to understand how things worked — and then see if I could make them better.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"740268f2-f8b4-4ea1-87ef-4b789802fca9\"}":{"__typename":"DeepDives","uuid":"740268f2-f8b4-4ea1-87ef-4b789802fca9","content":"\u003cp\u003eMy biggest motivation comes from where I come from and who I represent. Every step forward feels like I’m carrying a bit of my family’s story with me — their grit, curiosity, and belief that I could do something new. I’m driven by this quiet question in the back of my mind: \u003cem\u003ehow far can I actually go?\u003c/em\u003e That push to test my limits, to turn the opportunities I’ve been given into something meaningful, is what keeps me moving.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3f0f2769-de63-4ffe-868c-633016222b6c\"}":{"__typename":"DeepDives","uuid":"3f0f2769-de63-4ffe-868c-633016222b6c","content":"\u003cp\u003eMentorship matters to me because it’s how curiosity turns into confidence. I’ve had people in my life who didn’t just teach me facts — they showed me what was possible. That kind of guidance can completely change how someone sees themselves. I want to pay that forward — to help others discover the spark that makes them excited to learn, build, and dream a little bigger than they thought they could.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"b5656bc4-4496-4c95-ac3c-7dd6ab65fb0b\"}":{"__typename":"School","uuid":"b5656bc4-4496-4c95-ac3c-7dd6ab65fb0b","name":"Williamsville South High School","city":"Williamsville","type":"HIGH","state":"New York","country":"United States","zip":"14221"},"Education:{\"uuid\":\"7a7cc0cd-e512-4801-853f-5528d69d82f3\"}":{"__typename":"Education","uuid":"7a7cc0cd-e512-4801-853f-5528d69d82f3","school":{"__ref":"School:{\"uuid\":\"b5656bc4-4496-4c95-ac3c-7dd6ab65fb0b\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"23b70999-a45e-4b42-acf7-dd9dedcda5f7\"}":{"__typename":"Education","uuid":"23b70999-a45e-4b42-acf7-dd9dedcda5f7","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"B.S. Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"ef76d308-36dd-43de-92a9-61d2b873e8df\"}":{"__typename":"MentorPublicProfile","uuid":"ef76d308-36dd-43de-92a9-61d2b873e8df","displayName":"Tiger L.","slug":"tiger-li","biography":"\u003cp\u003eHey! I’m Tiger Li, a student at Brown University studying Computer Engineering — I love finding creative ways to make technology do amazing things. My biggest passion is robotics: I’m fascinated by how code, sensors, and mechanics come together to create machines that can actually think and move intelligently. At Brown, I work in the Intelligent Robot Lab, where we explore how robots can perceive the world, make decisions, and interact with people. It’s a field that sits at the frontier of engineering and imagination — we’re not just programming motion; we’re teaching machines to understand and respond to their surroundings. Seeing something you built come to life, move, and react on its own never stops feeling like magic.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI first got into robotics because I was curious about how people and technology could work together. The idea that you can give a robot “intelligence” — that you can make it sense, plan, and act — completely captivated me. I love the balance of creativity and logic it demands: you’re writing code, yes, but you’re also thinking like a designer, a problem-solver, and sometimes even an artist. Every new robot is a puzzle waiting to be solved, and I’m drawn to that challenge.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond robotics, I’ve explored different ways technology connects with the world around us. I’ve built websites, worked on environmental data analysis, and led stage design for TEDxBrownUniversity, where engineering meets art and storytelling. Each project has taught me something new about collaboration, precision, and finding beauty in both structure and spontaneity. I’ve learned that being an engineer isn’t just about understanding systems — it’s about understanding people, too.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m a lifelong bridge player and trombonist. Bridge, especially, has been a huge part of my life — I was part of the team that won the 2023 Youth North American Open Swiss Teams Championship. Bridge is a game of strategy, logic, and intuition, and it’s shaped the way I think about problem-solving. It’s taught me patience, focus, and how to see patterns where others might see chaos. Music, on the other hand, reminds me that creativity and rhythm matter just as much as logic and structure. Together, those two interests have helped me approach STEM with both analytical precision and creative flexibility.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I mentor, I want students to see that STEM isn’t just about equations or circuits — it’s about curiosity, creativity, and the thrill of discovery. My favorite moments are when students realize they can take an idea in their head and turn it into something real — a robot that moves, a program that works, a solution that surprises them. Whether we’re coding, building, or brainstorming, I want to make learning hands-on, exciting, and empowering. Technology is an adventure, and I can’t wait to help students explore just how far their imagination can take them.\u003c/p\u003e","teachingVideoPlaybackId":"G5Fo00wBOpZSzioN9R77oTUYaGXkSfU12TPwo4IUm9sc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"B.S. Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fc89dd8b-0e66-46c3-a25f-24706b8158f6\"}"},{"__ref":"DeepDives:{\"uuid\":\"916db9cf-9124-4c1f-8ed5-aa066c8cc068\"}"},{"__ref":"DeepDives:{\"uuid\":\"740268f2-f8b4-4ea1-87ef-4b789802fca9\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f0f2769-de63-4ffe-868c-633016222b6c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8fe9e3aa-26b2-4895-9d5f-68852000b54f/-/preview/-/format/jpg/","https://ucarecdn.com/155be890-ec42-4b8f-9c75-6161bd7e6b9f/-/preview/-/format/jpg/","https://ucarecdn.com/c6cd0c2b-0b8c-4c84-8334-78579a454e4e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7a7cc0cd-e512-4801-853f-5528d69d82f3\"}"},{"__ref":"Education:{\"uuid\":\"23b70999-a45e-4b42-acf7-dd9dedcda5f7\"}"}],"hiredAt":"2025-10-21T20:32:17.501Z","topics":["Pre-Algebra","Algebra II","Algebra I","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Chemistry","Biology","Physics","Academic Coaching","Executive Function","College Essay Writing","Computer Science","History","Music","Film / Theater","Video / Photography","Coding / Programming","Robotics / Electronics / CAD","Machine Learning / AI","Web Design","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tiger-li\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ef76d308-36dd-43de-92a9-61d2b873e8df\"}"}}},"_sentryTraceData":"643c5a0ebde9448cb59ffb18262542
