xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a51c253b-31db-401d-bf9d-b131618d7341\"}":{"__typename":"Favorites","uuid":"a51c253b-31db-401d-bf9d-b131618d7341","photoUrl":"https://ucarecdn.com/8870610e-f83f-48b6-a29c-dfacfa5c7a0e/","title":"Little Women","type":"MOVIE"},"Favorites:{\"uuid\":\"bb510062-27bd-47b1-a15e-96334c5b09a8\"}":{"__typename":"Favorites","uuid":"bb510062-27bd-47b1-a15e-96334c5b09a8","photoUrl":"https://ucarecdn.com/9553853c-a20d-4ef6-8e54-6e97f6e2c8d2/","title":"Ruel","type":"ARTIST"},"Favorites:{\"uuid\":\"c43be3af-23a5-484a-8505-50b86b69f93f\"}":{"__typename":"Favorites","uuid":"c43be3af-23a5-484a-8505-50b86b69f93f","photoUrl":"https://ucarecdn.com/3ba8a97c-a092-4627-a66b-b1bd04efeafc/","title":"Siddhartha ","type":"BOOK"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"3832fe15-f4eb-453d-8a0b-4d537c1ec454\"}":{"__typename":"DeepDives","uuid":"3832fe15-f4eb-453d-8a0b-4d537c1ec454","content":"\u003cp\u003eMy mentor in high school played a pivotal role in shaping my future. As my counselor, she understood my desire for scientific work and to apply knowledge to real-world challenges. At the time, I didn’t know how to channel my enthusiasm, but she guided me by suggesting I reach out to local colleges and apply for research programs. Her advice provided me with a framework to direct my passion and turn it into meaningful research, which ultimately launched my career in geoscience. Now, I want to pay that forward by helping others discover their passions and connect them with opportunities that allow them to engage with what truly excites them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ff5afa8f-3e36-405b-b936-3420cc13d024\"}":{"__typename":"DeepDives","uuid":"ff5afa8f-3e36-405b-b936-3420cc13d024","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to be published in a scientific journal on a topic I'm truly passionate about, whether that's seismic tomography, mineral exploration, glacial analysis, or another area of interest.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"c99ab83a-8ffe-42d3-95b1-5c8f2dbc40cb\"}":{"__typename":"DeepDives","uuid":"c99ab83a-8ffe-42d3-95b1-5c8f2dbc40cb","content":"\u003cp\u003eAs a high school student, I was highly motivated and determined to take as many AP classes as I could, filling my schedule with opportunities to learn. I dedicated hours every night to studying and completing my homework with discipline. Rather than seeking extraneous goals, I focused on doing my best on every assignment, test, and project, which ultimately led to my academic success. I also enjoyed helping others learn, tutoring my peers and teaching subjects to reinforce my own understanding. I balanced such academic rigor by being captain of my track and field team, where I pushed both my physical limits and my discipline.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"69ebd413-8c44-4676-9fc6-1446e4f81bd6\"}":{"__typename":"DeepDives","uuid":"69ebd413-8c44-4676-9fc6-1446e4f81bd6","content":"\u003cp\u003eOne thing I am extremely proud of is the research I conducted, including my paper and poster, during the summer of my junior year at Stony Brook University. I studied the crustal structure in Western Canada using H-k stacking of P-wave receiver functions. Through dedication, I learned to use Python packages and refine my understanding of the geodynamics and subsurface structure of Western Canada using seismic imaging methods, contributing to our knowledge of Earth's crust. I presented my work at a symposium and later entered a regional science competition, where I won the NASA Earth System Science Award and the STANYS Eleanor Miller Reed Science Research Award. My accomplishments were even featured in an article in my school’s newspaper.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"20f38097-ac16-440a-b535-22500a098037\"}":{"__typename":"School","uuid":"20f38097-ac16-440a-b535-22500a098037","name":"Bethlehem Central High School","city":"Delmar","type":"HIGH","state":"New York","country":"United States","zip":"12054"},"Education:{\"uuid\":\"2d3cffc7-a89d-4869-98ab-0c45d9d23221\"}":{"__typename":"Education","uuid":"2d3cffc7-a89d-4869-98ab-0c45d9d23221","school":{"__ref":"School:{\"uuid\":\"20f38097-ac16-440a-b535-22500a098037\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"312272b0-230f-4af2-99a5-5c5d47962109\"}":{"__typename":"Education","uuid":"312272b0-230f-4af2-99a5-5c5d47962109","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Earth and Atmospheric Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"d6cf3458-98c7-49c9-8cef-0136821ffe16\"}":{"__typename":"MentorPublicProfile","uuid":"d6cf3458-98c7-49c9-8cef-0136821ffe16","displayName":"Maeve M.","slug":"maeve-mccarthy","biography":"\u003cp\u003eHello! My name is Maeve McCarthy, and I’m a freshman at Cornell University studying Earth and Atmospheric Science with a concentration in geology. Growing up in upstate New York, I spent a lot of time exploring the Adirondacks, which sparked my love for the outdoors and my curiosity about the natural world. This fascination led me to pursue a deeper understanding of the Earth’s dynamic processes, particularly through seismic tomography, a technique that uses seismic waves to create 3D images of the Earth's interior.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring high school, my interest in the environment and intellectual curiosity motivated me to pursue independent research, which sparked a deeper love for learning and inspired me to reach out with local colleges and research programs. This networking journey led to research experiences at Union College and Stony Brook University, where I earned the New York Space Grant Student Support Fellowship and won two awards at the Regeneron Science Fair. Now at Cornell, I continue my research with four geophysical research projects, including my work with the CU Geodata project team.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a former peer tutor, I love helping students discover study methods that work best for them. I know that everyone learns differently, so I focus on creating personalized approaches that fit each student's unique needs. Whether it's developing effective study strategies, helping students tap into their passions, or guiding them toward research opportunities, I strive to create a supportive and motivating learning environment. I also enjoy helping students develop their networking skills to connect with research programs and mentors that align with their interests.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not studying, I’m staying active with the Cornell Running Club and Track and Field Team, building on my experience as captain of my high school team. I also enjoy hiking, skiing, and reading philosophy. I serve as an underclassman representative for Cornell’s Logos philosophy club, and in my free time, I love landscape painting to capture the beauty of life’s moments.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d love the opportunity to help your student succeed academically, discover new passions, and find exciting opportunities for personal and intellectual growth.\u003c/p\u003e","teachingVideoPlaybackId":"s8IkPKNfxjON5O6HUOFbYs2A9DyFTHM3mfYHXSpdE024","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'm proud of having the courage to dive headfirst into life. I enrolled in an academically rigorous college, committed myself to research, and took on challenges without knowing certainty of where it would all lead. Despite the uncertainty, I trust that it will work out, and I believe I’ll end up loving what I do.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a51c253b-31db-401d-bf9d-b131618d7341\"}"},{"__ref":"Favorites:{\"uuid\":\"bb510062-27bd-47b1-a15e-96334c5b09a8\"}"},{"__ref":"Favorites:{\"uuid\":\"c43be3af-23a5-484a-8505-50b86b69f93f\"}"}],"causesSupported":[],"major":"Earth and Atmospheric Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3832fe15-f4eb-453d-8a0b-4d537c1ec454\"}"},{"__ref":"DeepDives:{\"uuid\":\"ff5afa8f-3e36-405b-b936-3420cc13d024\"}"},{"__ref":"DeepDives:{\"uuid\":\"c99ab83a-8ffe-42d3-95b1-5c8f2dbc40cb\"}"},{"__ref":"DeepDives:{\"uuid\":\"69ebd413-8c44-4676-9fc6-1446e4f81bd6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1868a547-3903-46b7-89a0-c9ef3e0eb34c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2d3cffc7-a89d-4869-98ab-0c45d9d23221\"}"},{"__ref":"Education:{\"uuid\":\"312272b0-230f-4af2-99a5-5c5d47962109\"}"}],"hiredAt":"2025-01-04T22:59:25.986Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","STEM Project"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maeve-mccarthy\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d6cf3458-98c7-49c9-8cef-0136821ffe16\"}"}}},"_sentryTraceData":"d8f02a0097e44c0ca0e3ed2d074fc5f9-abd6adf4acc23494-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d8f02a0097e44c0ca0e3ed2d074fc5f9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"maeve-mccarthy"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.inse
