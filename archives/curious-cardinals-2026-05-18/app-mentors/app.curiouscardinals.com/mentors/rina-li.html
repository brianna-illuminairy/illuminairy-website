xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fd8b57fe-84e7-462f-ac32-c355d6a4a1ca\"}":{"__typename":"DeepDives","uuid":"fd8b57fe-84e7-462f-ac32-c355d6a4a1ca","content":"\u003cp\u003eMentorship matters to me because I want to be the encouragement, assurance, and support that I needed when I was in the place of a mentee. I believe it's so crucial to have some sort of guidance to turn passion into actual projects through avoiding mistakes, ensuring accountability, and building confidence!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"774251ce-2eda-4faa-8049-f91a83795e88\"}":{"__typename":"DeepDives","uuid":"774251ce-2eda-4faa-8049-f91a83795e88","content":"\u003cp\u003eI was definitely pressured by my peers to immerse myself in the \"grind culture.\" I always had to take on as many advanced classes as my schedule allowed, and I had to invest in time-consuming extracurricular activities. That being said, I don't forget to have fun! Going on cafe study crawls and random side quests is something I always made time for. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"408e0f60-5fb0-4ec9-b76b-a2844a2214ad\"}":{"__typename":"DeepDives","uuid":"408e0f60-5fb0-4ec9-b76b-a2844a2214ad","content":"\u003cp\u003eYou don't have to live life so fast-paced; slow down and enjoy the present because everything will work out. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d3e0146e-3bc5-4611-99a6-28156d0457e0\"}":{"__typename":"DeepDives","uuid":"d3e0146e-3bc5-4611-99a6-28156d0457e0","content":"\u003cp\u003eMy dream job is definitely something advocacy-related! I'm currently thinking civil or immigration law or government litigation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"29c1e4ca-1f65-4ff0-81a1-b6466b82e2ac\"}":{"__typename":"School","uuid":"29c1e4ca-1f65-4ff0-81a1-b6466b82e2ac","name":"Dulles High School","city":"Sugar Land","type":"HIGH","state":"Texas","country":"United States","zip":"77478"},"Education:{\"uuid\":\"53497413-57b4-4e77-9ffc-b02f0bfad79a\"}":{"__typename":"Education","uuid":"53497413-57b4-4e77-9ffc-b02f0bfad79a","school":{"__ref":"School:{\"uuid\":\"29c1e4ca-1f65-4ff0-81a1-b6466b82e2ac\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"89405289-d588-41cf-b634-4513e643cf6a\"}":{"__typename":"Education","uuid":"89405289-d588-41cf-b634-4513e643cf6a","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Business Economics and Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"4ae7cf7b-e16a-491f-bfcc-823249233d3a\"}":{"__typename":"MentorPublicProfile","uuid":"4ae7cf7b-e16a-491f-bfcc-823249233d3a","displayName":"Rina L.","slug":"rina-li","biography":"\u003cp\u003eHello! I'm Rina, and I'm a freshman at UCLA studying Business Economics and Political Science on a pre-law track. I'm originally from Texas, though, so I'm a bit far from home. Despite that, I've been able to find a second home in California because I’m someone who is driven by connection—real, human, unfiltered connection.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt the core of what I care about is advocacy: showing up for people, amplifying voices that often go unheard, and making sure that ideas don’t just stay theoretical but actually reach and impact others. I’m deeply interested in engaging with the people around me, whether that means learning from their perspectives, collaborating on shared goals, or simply building relationships rooted in trust. I’m especially drawn to experiences that teach lessons you can’t find in a textbook—the kind that come from navigating ambiguity, working through challenges, and understanding people in dynamic, real-world environments. I'm constantly practicing these values in my projects (such as my advocacy podcast) and work (such as my consulting project right now).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs I mentioned, I currently study Business Economics and Political Science, where I explore the intersection between markets, policy, and human behavior. These fields allow me to think both analytically and critically—understanding not just how systems function, but how they affect individuals and communities. I'm taking classes that specifically allow me to interact with peers and professors that have made real-world impacts on causes I really care about, and it's really broadened my perspective on the change we can make.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I tend to go beyond surface-level understanding. A lot of that comes from my background in debate, which I did for six years (I qualified for state 3 times, Tournament of Champions twice, and Nationals). Debate taught me how to break down complex ideas, question assumptions, and engage with topics from multiple angles (ask me about any current issue or philosophical question—I probably have thoughts!). That habit has stayed with me—I like digging deeper into the concepts I learn, connecting them across disciplines, and applying them to real-world contexts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I’m someone who thrives on creative and active outlets. I do portrait and event photography, which has taught me how to capture stories and emotions in a single frame. I love dancing as I've done it since I was 3, and I’m always up for trying new foods or exploring coffee spots. I also play recreational volleyball, go to the gym super often (my brother is a powerlifter), and enjoy spontaneous side adventures, whether that’s exploring a new place or saying yes to something unexpected (I love skydiving, bungee jumping, last-minute concerts, and more). These experiences keep me curious, adaptable, and open to new perspectives.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I’m currently part of a marketing consulting club, where I work on real-world business challenges and collaborate with teams to develop strategic solutions. It’s been a valuable space to apply both my analytical skills and creativity while learning how to communicate ideas effectively in a professional setting.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne of the most meaningful throughlines in my experience has been mentorship. I’ve mentored students ranging from elementary to high school across a variety of settings, and it’s something I genuinely value. No matter if it's math or debate, the basis of it all is being able to help others because others have helped me get to where I am today. Being able to support others in their growth, whether academically or personally, has shaped how I approach leadership and collaboration.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm so excited to be able to work with you; even more, I'm eager to get to know you so we can make real, powerful things happen.\u003c/p\u003e","teachingVideoPlaybackId":"W9sLA02BEPcuIQrf41VCL2fSKeCgK4THUMggQq37QWYo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business Economics and Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fd8b57fe-84e7-462f-ac32-c355d6a4a1ca\"}"},{"__ref":"DeepDives:{\"uuid\":\"774251ce-2eda-4faa-8049-f91a83795e88\"}"},{"__ref":"DeepDives:{\"uuid\":\"408e0f60-5fb0-4ec9-b76b-a2844a2214ad\"}"},{"__ref":"DeepDives:{\"uuid\":\"d3e0146e-3bc5-4611-99a6-28156d0457e0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3c2d9d0c-afd2-4a2f-b41d-146ceec2cae6/-/preview/-/format/jpg/","https://ucarecdn.com/4b714301-f5de-400a-9a96-344e78555068/-/preview/-/format/jpg/","https://ucarecdn.com/69e1b56c-5895-4422-be1a-ad2d7b15f71b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"53497413-57b4-4e77-9ffc-b02f0bfad79a\"}"},{"__ref":"Education:{\"uuid\":\"89405289-d588-41cf-b634-4513e643cf6a\"}"}],"hiredAt":"2026-03-17T00:25:02.109Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Biology","Writing","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Visual Arts / Graphic Design","Video / Photography","Creative Writing","Business / Entrepreneurship","STEM Project","Law / Government / Policy","Sustainability","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"rina-li\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4ae7cf7b-e16a-491f-bfcc-823249233d3a\"}"}}},"_sentryTraceData":"98c46a810de34bcebb481aa6c21a8ba8-9ece7fc4c5773b16-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=98c46a810de34bcebb481aa6c21a8ba8,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"rina-li"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
