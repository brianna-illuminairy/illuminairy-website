xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c77e4880-124f-48dd-a2b9-8e7314cf561c\"}":{"__typename":"Favorites","uuid":"c77e4880-124f-48dd-a2b9-8e7314cf561c","photoUrl":"https://ucarecdn.com/5ed19de7-a11e-4b63-b6d6-f417b952acf1/","title":"Igor","type":"ALBUM"},"Favorites:{\"uuid\":\"e38b696c-cfb1-4f70-a281-2f2c8c3a6b4e\"}":{"__typename":"Favorites","uuid":"e38b696c-cfb1-4f70-a281-2f2c8c3a6b4e","photoUrl":"https://ucarecdn.com/a368d6ab-0dff-4507-a5b4-f5a1819a001c/","title":"Namesake","type":"BOOK"},"Favorites:{\"uuid\":\"2b628233-a0ba-49f6-98ce-72aecb0b1cb5\"}":{"__typename":"Favorites","uuid":"2b628233-a0ba-49f6-98ce-72aecb0b1cb5","photoUrl":"https://ucarecdn.com/9c1a270c-c400-40f2-856e-35e9ba45422f/","title":"Kamakura, Japan","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"db6ece48-14c6-4eff-bbac-2a003494e560\"}":{"__typename":"DeepDives","uuid":"db6ece48-14c6-4eff-bbac-2a003494e560","content":"\u003cp\u003eFor both my middle school and high school self, I have only one message: \"Chill out. It's all going to turn out okay.\"\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI let school feed my anxiety, but I don't remember 99% of the specific events that caused such feelings of stress. At the moment, I put a disproportionate amount of weight on the tiniest things at school, and consequently, my enjoyment as a student was hurt. Now, I realize that, for the most part, everything's going to be okay.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"b64e2984-98ab-42c9-8bfe-59d574223e63\"}":{"__typename":"DeepDives","uuid":"b64e2984-98ab-42c9-8bfe-59d574223e63","content":"\u003cp\u003eMy greatest role model is my high school math teacher. He proved to me that teachers are not only academic mentors but can be life mentors as well. He taught me so much about every aspect of life, and I want to offer that same level of support to my students. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"36e48e90-d1e1-4a48-b763-b132e195b7da\"}":{"__typename":"DeepDives","uuid":"36e48e90-d1e1-4a48-b763-b132e195b7da","content":"\u003cp\u003eI love learning a new sport and developing the relevant skills to become better. Whether it be climbing or volleyball, every sport has a technical aspect that I love to delve into and explore. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"9f9837d4-cee3-43aa-b8f2-01040f7231ab\"}":{"__typename":"DeepDives","uuid":"9f9837d4-cee3-43aa-b8f2-01040f7231ab","content":"\u003cp\u003eThe fact that every day has a limited amount of time motivates me to complete as much as I can. I like going to sleep recapping what I did throughout the day to earn my rest (though I also appreciate the occasional lazy days where it feels like I didn't do much of anything)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"4605b231-d64d-4497-80f2-57444ca68e9f\"}":{"__typename":"School","uuid":"4605b231-d64d-4497-80f2-57444ca68e9f","name":"Aragon High School","city":"San Mateo","type":"HIGH","state":"California","country":"United States","zip":"94401"},"Education:{\"uuid\":\"773f1f4e-ca36-4217-bfc4-abe9f3afa418\"}":{"__typename":"Education","uuid":"773f1f4e-ca36-4217-bfc4-abe9f3afa418","school":{"__ref":"School:{\"uuid\":\"4605b231-d64d-4497-80f2-57444ca68e9f\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}":{"__typename":"School","uuid":"dff4a26a-20c2-4281-9c2a-b500907e0661","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"de822444-fd9e-4d72-ac21-01ab2414ef6d\"}":{"__typename":"Education","uuid":"de822444-fd9e-4d72-ac21-01ab2414ef6d","school":{"__ref":"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"ddc08a8d-3d08-40d8-b17c-420cf6f803ea\"}":{"__typename":"MentorPublicProfile","uuid":"ddc08a8d-3d08-40d8-b17c-420cf6f803ea","displayName":"Zen Y.","slug":"zen-yoshikawa","biography":"\u003cp\u003eHello!!! I'm Zen Yoshikawa, and I'm a first-year chemical engineering student at UC Berkeley. In the future, I hope to break into the cell-cultivated meat industry and work specifically on upscaling the technology to reach a commercially available level. Although this line of work is my main career interest, my end goal is to become a high school teacher (any subject sounds like so much fun to teach) or open up a small restaurant in Kamakura, Japan. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs for my interests, I've played soccer for 11 years, rock climbing (I'm awful at it), golfing (getting even worse at it), and reading (I love Kurt Vonnegut, Jhumpa Lahiri, Murakami, etc.). I also spent most of my time in high school on a marine robotics team where I engineered a robot capable of autonomous buoyancy manipulation (or in more simple terms, a robot that can move up and down in a pool by itself). At college, I'm part of the professional chemistry fraternity Alpha Chi Sigma, three intramural sports teams (volleyball, soccer, and basketball), and looking into learning Kendo. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have a huge passion for teaching and would love to meet any and every student I can. I'm looking forward to mentoring and fostering the high potential that every student carries!\u003c/p\u003e","teachingVideoPlaybackId":"RT69i01kBsP48B2ycRyNzaDUzmX00NBXIXEJsyLHuoJaA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c77e4880-124f-48dd-a2b9-8e7314cf561c\"}"},{"__ref":"Favorites:{\"uuid\":\"e38b696c-cfb1-4f70-a281-2f2c8c3a6b4e\"}"},{"__ref":"Favorites:{\"uuid\":\"2b628233-a0ba-49f6-98ce-72aecb0b1cb5\"}"}],"causesSupported":[],"major":"Chemical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"db6ece48-14c6-4eff-bbac-2a003494e560\"}"},{"__ref":"DeepDives:{\"uuid\":\"b64e2984-98ab-42c9-8bfe-59d574223e63\"}"},{"__ref":"DeepDives:{\"uuid\":\"36e48e90-d1e1-4a48-b763-b132e195b7da\"}"},{"__ref":"DeepDives:{\"uuid\":\"9f9837d4-cee3-43aa-b8f2-01040f7231ab\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/adeb69bb-2665-45a0-806d-4f04323d137a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"773f1f4e-ca36-4217-bfc4-abe9f3afa418\"}"},{"__ref":"Education:{\"uuid\":\"de822444-fd9e-4d72-ac21-01ab2414ef6d\"}"}],"hiredAt":"2025-01-25T01:18:04.307Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus
