xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bd7d2f41-0493-4f01-bc16-2173ef4040e8\"}":{"__typename":"Favorites","uuid":"bd7d2f41-0493-4f01-bc16-2173ef4040e8","photoUrl":"https://ucarecdn.com/7c04c7d2-2f98-4651-8046-550771dabb46/","title":"The Secret History","type":"BOOK"},"School:{\"uuid\":\"33dfd66f-b9ee-4355-bb41-07b3ef87483b\"}":{"__typename":"School","uuid":"33dfd66f-b9ee-4355-bb41-07b3ef87483b","name":"Nightingale Bamford School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"80afe71a-fd78-4770-8df3-1ce06185cf79\"}":{"__typename":"Education","uuid":"80afe71a-fd78-4770-8df3-1ce06185cf79","school":{"__ref":"School:{\"uuid\":\"33dfd66f-b9ee-4355-bb41-07b3ef87483b\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"40fbdc76-c54a-4d30-b330-81c4dfed40ca\"}":{"__typename":"Education","uuid":"40fbdc76-c54a-4d30-b330-81c4dfed40ca","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"d2ed30b4-8a8c-4ea5-a7b4-3ecccf10f335\"}":{"__typename":"MentorPublicProfile","uuid":"d2ed30b4-8a8c-4ea5-a7b4-3ecccf10f335","displayName":"Jaylynn C.","slug":"jaylynn-cortes","biography":"\u003cp\u003eHi! My name is Jaylynn, and I’m a rising Junior at Yale University pursuing a degree in History with a concentration in Politics, Law, and Government. I’ve always been drawn to history for the way it reveals how different cultures respond to the world around them, and how individuals shape, and are shaped by, their environments.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the humanities, I’m also passionate about economics and research. I currently work as a research assistant at the Yale School of Management, where I study decision-making through the lens of behavioral economics and the Cognitive Reflection Test. On campus, I’m involved in finance-focused groups like Yale Alternative Investments and the Yale Undergraduate Hedge Fund Association. This summer, I’ll be interning at a consumer investing firm, where I’m excited to combine my analytical interests with more people-focused work.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBesides my academic and professional interest, I love hiking and am slowly making my way through the U.S. national parks. I’m also an avid kayaker (after two summers working as a dockhand!) and have been playing basketball since the 6th grade. I also volunteer as a tax preparer through VITA (Volunteer Income Tax Assistance), helping low-income New Haven families file their taxes and understand their finances.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore Yale, I was part of the Oliver Scholars program, a mentorship program for high-achieving Latinx and Black students. That experience shaped who I am today, and showed me just how powerful it is to have a mentor who believes in you. As a mentor, I hope to provide the same encouragement and perspective that my mentors gave me: supporting students as they find their path and pursue the things they care about most.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bd7d2f41-0493-4f01-bc16-2173ef4040e8\"}"}],"causesSupported":[],"major"
