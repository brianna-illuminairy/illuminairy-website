xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6c0516a9-9fa7-4dc5-a629-68e9cfa9edb1\"}":{"__typename":"Favorites","uuid":"6c0516a9-9fa7-4dc5-a629-68e9cfa9edb1","photoUrl":"https://ucarecdn.com/6d6ef7f6-8b73-4afb-ab1e-e4207d0cdf7f/","title":"Chelsea FC","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"2c3cb4cd-c5d8-42dd-bad1-3b3be48dc53d\"}":{"__typename":"Favorites","uuid":"2c3cb4cd-c5d8-42dd-bad1-3b3be48dc53d","photoUrl":"https://ucarecdn.com/6d6ef7f6-8b73-4afb-ab1e-e4207d0cdf7f/","title":"Abbey Road","type":"ALBUM"},"Favorites:{\"uuid\":\"ab6b0bd2-739c-492d-9534-0872c28ae732\"}":{"__typename":"Favorites","uuid":"ab6b0bd2-739c-492d-9534-0872c28ae732","photoUrl":"https://ucarecdn.com/6d6ef7f6-8b73-4afb-ab1e-e4207d0cdf7f/","title":"Boston, MA","type":"CITY"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4b2777d7-e992-408c-9443-3db46c4c5d74\"}":{"__typename":"DeepDives","uuid":"4b2777d7-e992-408c-9443-3db46c4c5d74","content":"\u003cp\u003eIn my lifetime, I hope to complete a marathon. I have always loved running, and in high school, I joined the track team and discovered the world of competitive running. Since then, my love for running has only grown. I have found some of my greatest friends through running and some of my best memories have been running with my friends along the Charles River in Boston. I recently ran my first half marathon, and I feel that the perfect capstone to my running journey so far would be the completion of a full marathon. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a6cddbc0-27da-464d-8ddd-588838d70c55\"}":{"__typename":"DeepDives","uuid":"a6cddbc0-27da-464d-8ddd-588838d70c55","content":"\u003cp\u003eA passion project I recently completed was my performance of the Finale of the Bruch Violin Concerto in G minor. As mentioned in my bio, I am a violinist and it is one of the most important things in my life. I began this concerto back in high school, but I gave it up for 2 years while I navigated life as a new college student. This past year, I decided I wanted to complete the concerto. So throughout the school year, I worked tirelessly, perfecting the piece as best I could. At the end of this past semester, I performed the piece. The satisfaction of seeing an entire year's worth of hard work culminating in a moment of beauty and passion was like nothing I had felt before. It made me so proud of all the work I had put in, and also eager to work even more. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f880ad12-7784-4432-a21b-b723df348339\"}":{"__typename":"DeepDives","uuid":"f880ad12-7784-4432-a21b-b723df348339","content":"\u003cp\u003eMuch of my spare time is spent watching sports. I love soccer, basketball, football, and more, and I am an avid fan of the Boston Celtics, New England Patriots, and Chelsea FC. Outside of sports, I also love playing and listening to music. I am a violinist, so I love playing and listening to classical music, but I love all kinds of music as well. Additionally, I love watching movies in my spare time. I have always loved movies, but recently I have been trying to watch more movies and expand my boundaries. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"dc03c8e0-248a-4929-9259-8555322aaf3f\"}":{"__typename":"DeepDives","uuid":"dc03c8e0-248a-4929-9259-8555322aaf3f","content":"\u003cp\u003eI chose mathematics as my major because I have always had a love for it. For as long as I can remember, I have always loved working with numbers and thinking critically. I enjoy working through tough problems and coming up with creative solutions. I appreciate math's analytical nature, but it is also such a beautiful and creative subject, and I love these two contrasting sides of it. I chose economics as a second major because once I gained a little bit of exposure to it, I was hooked. Economics  is essential to becoming a successful member of society and its applications are limitless. Similar to math, I love economics' two sides. There is microeconomics, the more mathematical and small-scale side, but there is also macroeconomics, which dictates how major corporations, governments, and the entire world functions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"7ec9da57-0206-4793-804c-d3080ce79e9f\"}":{"__typename":"School","uuid":"7ec9da57-0206-4793-804c-d3080ce79e9f","name":"Buckingham Browne \u0026 Nichols School","city":"Cambridge","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"3fa3169f-4d6a-4e28-a72c-3bee58e7dd89\"}":{"__typename":"Education","uuid":"3fa3169f-4d6a-4e28-a72c-3bee58e7dd89","school":{"__ref":"School:{\"uuid\":\"7ec9da57-0206-4793-804c-d3080ce79e9f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"87189140-0f83-40b6-90c9-9efbd6a43f0a\"}":{"__typename":"Education","uuid":"87189140-0f83-40b6-90c9-9efbd6a43f0a","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mathematics and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"545ced87-c924-4522-8a7e-faf0f0dc8635\"}":{"__typename":"MentorPublicProfile","uuid":"545ced87-c924-4522-8a7e-faf0f0dc8635","displayName":"Sam W.","slug":"sam-whitney","biography":"\u003cp\u003eHi! My name is Sam Whitney. I'm currently a rising senior at Brown University, where I am concentrating in mathematics and economics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile my academic focus lies in the above fields, I consider myself a diverse and curious student, seeking new knowledge and skills in many different areas. At Brown, I have taken courses all across the spectrum, from physics to history to music theory and beyond. I believe that this varied strategy is a great way to approach learning and it has certainly worked well for me. I seek out topics I that I am interested in, regardless of the field or if I have prior knowledge on the topic. I allow myself to feed my curiosity and embrace the unknowns and difficulties that are a natural part of the learning process\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy goal as a mentor is to help kids fuel their curiosity, letting them be the navigators of their own educational journey. If a kid needs help solidifying a subject from school, I am there for them as a traditional tutor. If a child has an interest in a completely new topic to them and wants to dive in to uncharted waters, I will be right there with them. If a kid has a personal project they are working on and needs guidance or help organizing it, I can fulfill that role as well. While free intellectual curiosity is something I pride myself on, I also recognize the importance of a more structured approach to learning. I have lots of experience in time management and organization of complex projects and am capable of devising structured lesson plans for kids.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, one of my greatest passions is music. I have been playing the violin for almost my whole life and continue to be very involved in the Brown music program, studying privately and as a member of the chamber music program. I also love listening to music, ranging anywhere from classical music to classic rock to modern hip-hop.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, I am avid sports fan. Growing up in Boston, I am a huge Patriots and Celtics fan (Now that Brady and Belichick are gone, there’s no reason to hate us Pats fans). However, my favorite sport is soccer. I love watching and playing it in any form. In my free time I also enjoy distance running. I ran track in high school and I recently ran my first half marathon.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI hope by learning a little more about me and my mentoring philosophies you can decide if I am a good choice for your child. I look forward to helping kids embrace their natural curiosity and discover the joys of learning!\u003c/p\u003e","teachingVideoPlaybackId":"SA5zzOGcbiOw6KLoqPGkieuN51W5fK4EqnYGecSIkcU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6c0516a9-9fa7-4dc5-a629-68e9cfa9edb1\"}"},{"__ref":"Favorites:{\"uuid\":\"2c3cb4cd-c5d8-42dd-bad1-3b3be48dc53d\"}"},{"__ref":"Favorites:{\"uuid\":\"ab6b0bd2-739c-4
