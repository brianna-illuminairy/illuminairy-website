xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9ee61a45-bd63-4cc5-b911-40c9e2fd177f\"}":{"__typename":"Favorites","uuid":"9ee61a45-bd63-4cc5-b911-40c9e2fd177f","photoUrl":"https://ucarecdn.com/1977f546-0cc2-4e04-82db-ba43ac017737/","title":"The Miseducation of Lauryn Hill","type":"ALBUM"},"Favorites:{\"uuid\":\"ae5e844a-9d84-46ce-90b0-54c3e28e9b0d\"}":{"__typename":"Favorites","uuid":"ae5e844a-9d84-46ce-90b0-54c3e28e9b0d","photoUrl":"https://ucarecdn.com/1977f546-0cc2-4e04-82db-ba43ac017737/","title":"Heartburn by Nora Ephron","type":"BOOK"},"Favorites:{\"uuid\":\"576d87d4-8234-4ddb-8b8d-a86f1a5bc98b\"}":{"__typename":"Favorites","uuid":"576d87d4-8234-4ddb-8b8d-a86f1a5bc98b","photoUrl":"https://ucarecdn.com/1977f546-0cc2-4e04-82db-ba43ac017737/","title":"Spirited Away by Hayao Miyazaki","type":"MOVIE"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4cd3a4f4-2c8c-4ef2-807a-0cea99b12110\"}":{"__typename":"DeepDives","uuid":"4cd3a4f4-2c8c-4ef2-807a-0cea99b12110","content":"\u003cp\u003eIn my lifetime, I hope to write and direct my own feature film. I’d also love to be the creator of a tv show, or the writer of a play. I’m drawn to being in a position of creative leadership, bringing together a group of talented people, hearing out their suggestions, bouncing ideas back and forth, and making the final call. If I deliver an end product that makes people smile and is respected by the people I respect, I will have accomplished what I wanted to in my lifetime. While I have these goals, I’m a believer in not holding your goals too tightly and letting them shift as you explore and learn about yourself.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"54a2fdd0-49ac-4877-8923-f175470d0dae\"}":{"__typename":"DeepDives","uuid":"54a2fdd0-49ac-4877-8923-f175470d0dae","content":"\u003cp\u003eAs a middle /high-schooler, I was so anxious about what I would do with my life. The \"not knowing\" was paralyzing—I put so much pressure on myself to figure it all out right away. When I look back on my College Essay, I realize now that I was pandering to College admissions and trying to write a version of myself that I thought they wanted me to be, rather than showing my true personality. I wish I had been more comfortable with the moment I was in and not so panicky! It would be so cathartic to me to alleviate some of that angst and confusion among middle/high schoolers today. It is okay to not know what you're good at yet. It's actually better, and leads to a more unpredictable, exciting life of self-discovery! I love to help people express themselves and figure out their talents without pressure. My parents think I'd be a good therapist :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c270e716-7cbf-4119-a276-5d284855b61d\"}":{"__typename":"DeepDives","uuid":"c270e716-7cbf-4119-a276-5d284855b61d","content":"\u003cp\u003eI chose to be an English major because I thought it would improve my writing. I’d hoped to learn about the foundations of literature and absorb some of the sophistication posessed by canonical authors and poets. One of the most important things I learned as an English major is that “literature is an iceberg”, meaning that what’s written on the page is above the surface, and the true meaning is below the surface. In the best pieces of writing, meaning is infused into every word, space, and use of punctuation. There is always something more to glean or a different way to analyze a work.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eArt is almost always created out of a quarrel with oneself. The humanities give us subjective reality, as the world is filled with issues that science cannot solve. People need art to sort through their feelings, ideas, beliefs, and come to an understanding about the chaos of the world. Parsing through confusion, accepting that you’ll never have it all figured out, reflecting on that reconciliation was a common theme in my English classes. I found it interesting to learn about the anguish of being a writer and the complex portrait of the artist.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"41624798-ec7f-46bf-ace9-4d031b9d2cfa\"}":{"__typename":"DeepDives","uuid":"41624798-ec7f-46bf-ace9-4d031b9d2cfa","content":"\u003cp\u003eFirst I’d say, “You are not better than anyone,\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003eand nobody is better than you.” Then I would tell my middle/high school self that the embarrassing moments that make you want to crawl into a hole will be the most important moments to you as a creative person later on. Cherish the embarrassment, embrace the cringe, and write it all down. We’re probably more creative when we’re younger because we’re less coded by society and our emotions are more raw. So, start creating now!\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}":{"__typename":"School","uuid":"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5","name":"The Chapin School","city":"New York","type":"HIGH","state":"NY","country":"USA","zip":"10028"},"Education:{\"uuid\":\"2527e23d-2399-49ce-a1ad-7c51b77e109d\"}":{"__typename":"Education","uuid":"2527e23d-2399-49ce-a1ad-7c51b77e109d","school":{"__ref":"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}"},"startYear":"2006","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"a487a839-6d11-4f26-8959-57977b7ee843\"}":{"__typename":"Education","uuid":"a487a839-6d11-4f26-8959-57977b7ee843","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"500fed4d-351b-4765-99f3-f7948be9afc2\"}":{"__typename":"MentorPublicProfile","uuid":"500fed4d-351b-4765-99f3-f7948be9afc2","displayName":"Sascha B.","slug":"sascha-betty","biography":"\u003ch4\u003eSascha is a dedicated screenwriter based in New York City. During her junior year at Duke University, her sketch \"O-Week\" on Inside Amy Schumer contributed to a Writers’ Guild Award-winning season. Sascha now works for screenwriting duo Lauren Blum and Rebecca Angelo (Business Affairs Productions) as a staff writer, pitching ideas for their numerous projects including DUMB MONEY (2023). She honed her craft through an internship at Stay Gold Productions and in the Life \u0026amp; Beth (Season 2) writers' room. In May 2023, Sascha graduated with distinction as an English major. For her Senior Thesis, she wrote a feature-length script titled “Full Method Jacket.” Currently, she’s editing her short film “The Final Cut,\" which she wrote and directed.\u003c/h4\u003e","teachingVideoPlaybackId":"wiRfoyJaokildftEWVyOqSX028SxtwbDt02QeLwwlGqh00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThis year, I wrote, directed, and fundraised 50k for a short film called \"The Final Cut.\" Walking around my own film set, physically inside something that came from my brain, was a surreal and invigorating experience. Being the sole director of a supremely talented cast and a highly competent crew (25 people) was certainly a challenge but one that felt so right for me. I was pleasantly surprised to learn that it was in the bracket of my capabilities and I can't wait to do it as many more times as I can.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"9ee61a45-bd63-4cc5-b911-40c9e2fd177f\"}"},{"__ref":"Favorites:{\"uuid\":\"ae5e844a-9d84-46ce-90b0-54c3e28e9b0d\"}"},{"__ref":"Favorites:{\"uuid\":\"576d87d4-8234-4ddb-8b8d-a86f1a5bc98b\"}"}],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4cd3a4f4-2c8c-4ef2-807a-0cea99b12110\"}"},{"__ref":"DeepDives:{\"uuid\":\"54a2fdd0-49ac-4877-8923-f175470d0dae\"}"},{"__ref":"DeepDives:{\"uuid\":\"c270e716-7cbf-4119-a276-5d284855b61d\"}"},{"__ref":"DeepDives:{\"uuid\":\"41624798-ec7f-46bf-ace9-4d031b9d2cfa\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e4ee3e55-acd2-421e-b7f4-ee4c4e6db223/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2527e23d-2399-49ce-a1ad-7c51b77e109d\"}"},{"__ref":"Education:{\"uuid\":\"a487a839-6d11-4f26-8959-57977b7ee843\"}"}],"hiredAt":"2024-05-20T21:01:45.481Z","topics":["Video / Photography","Film / Theater","Visual Arts / Graphic Design","Writing","Reading","L
