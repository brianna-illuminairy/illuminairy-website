xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"77a93313-0457-42ff-ad48-8757ea3dbe4f\"}":{"__typename":"Favorites","uuid":"77a93313-0457-42ff-ad48-8757ea3dbe4f","photoUrl":"https://ucarecdn.com/7f0257d2-f6f7-4a38-8a4a-157b4329cfde/","title":"Words of Radiance","type":"BOOK"},"Favorites:{\"uuid\":\"bd7171e6-15d9-4dfe-87b9-ae98e697f4a5\"}":{"__typename":"Favorites","uuid":"bd7171e6-15d9-4dfe-87b9-ae98e697f4a5","photoUrl":"https://ucarecdn.com/8dab75aa-1abc-4bda-a4e0-cf0a80e3180a/","title":"The Miseducation of Lauryn Hill","type":"ALBUM"},"Favorites:{\"uuid\":\"836da19a-8501-4745-9164-c16d9cdaa214\"}":{"__typename":"Favorites","uuid":"836da19a-8501-4745-9164-c16d9cdaa214","photoUrl":"https://ucarecdn.com/ce387034-6b43-4a5c-b0a6-a1afd8468ced/","title":"Tears of the Kingdom","type":"GAME"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"968a6ef4-7a4f-4e3b-83b0-cee2fe6ccbe4\"}":{"__typename":"DeepDives","uuid":"968a6ef4-7a4f-4e3b-83b0-cee2fe6ccbe4","content":"\u003cp\u003eI’d love to one day visit every continent in the world, and am currently halfway to reaching that goal! It’s a lot of fun visiting new and unfamiliar places, and getting to experience foods, cities, and customs very different from those I grew up with. What’s more, I think it’s already been truly valuable to have a more worldly perspective of my own cultural upbringing, and I’d love to broaden that perspective even further by traveling to every faraway corner of the world. Plus, I want to have loads of awesome stories to tell once I’m a cool old grandpa.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"f6d6d6ec-45f9-4b51-bf06-f721ca80e66a\"}":{"__typename":"DeepDives","uuid":"f6d6d6ec-45f9-4b51-bf06-f721ca80e66a","content":"\u003cp\u003eFor me, cooperatively sharing ideas with others has always felt wonderfully satisfying, and a mentorship is special because that sharing goes both ways. As a mentor, I get the opportunity to share my knowledge and experiences: to help mentees when they’re stuck to reach that electric “a-ha” moment; and to inspire them to learn from my own triumphs and failings, and to set their sights higher than I ever did. Yet I also have the privilege of learning from each mentee: they share with me their own unique understanding of the world; and they often pose new questions and avenues of interest that I myself had never thought to consider before. Mentorship excites me because it’s a two-way sharing of curiosity, passion, and insight; and I love that it helps both me and the mentees I work with to grow into better students and better people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ffb30533-adca-4c6f-8e8e-611ad8678a53\"}":{"__typename":"DeepDives","uuid":"ffb30533-adca-4c6f-8e8e-611ad8678a53","content":"\u003cp\u003eFor me, it’s definitely Neil deGrasse Tyson. When I was in middle school, I obsessed over every book, documentary, and guest lecture with his name on it, and I wished that I could be an astrophysicist just like him when I grew up. As one of the few Black scientists that I saw on TV as a kid, Neil was the first person that allowed me to see myself as someone who was ‘meant to’ study physics. Beyond just this, I was fascinated by the way he explained complex topics within science: always led by a driving question, and supported by a motivated flow of ideas. Looking back, he’s really what inspired me to start off on the academic path that I’m still on to this day, and I’m honored to now take influence from him in my own approach as a mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"66dd1a84-0c15-47af-82c6-e3ffd4417dda\"}":{"__typename":"DeepDives","uuid":"66dd1a84-0c15-47af-82c6-e3ffd4417dda","content":"\u003cp\u003eDon’t be put off of an activity just because it\u0026nbsp; is unconventional, unpopular, or uncool. If it interests you, I promise you won’t regret giving it an honest try. The niche things you get into now will shape your entire personality in just a few years!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"6aa2e699-906b-47e1-9f35-3326ba0ab636\"}":{"__typename":"School","uuid":"6aa2e699-906b-47e1-9f35-3326ba0ab636","name":"Golden Valley Charter School","city":"Ventura","type":"HIGH","state":"California","country":"United States","zip":"93003"},"Education:{\"uuid\":\"7d987307-247c-4a90-b134-58ee1ca3ecaf\"}":{"__typename":"Education","uuid":"7d987307-247c-4a90-b134-58ee1ca3ecaf","school":{"__ref":"School:{\"uuid\":\"6aa2e699-906b-47e1-9f35-3326ba0ab636\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"aeb1baed-eeca-48d9-9cf3-31ad787f6240\"}":{"__typename":"Education","uuid":"aeb1baed-eeca-48d9-9cf3-31ad787f6240","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Engineering Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"929c9f91-33b9-46c2-8d53-a347028a0ad1\"}":{"__typename":"MentorPublicProfile","uuid":"929c9f91-33b9-46c2-8d53-a347028a0ad1","displayName":"Noah H.","slug":"noah-haile","biography":"\u003cp\u003eNoah is a sophomore at Stanford University pursuing a degree in Engineering Physics with a concentration in quantum information science. He’s always been deeply curious about the workings of the everyday world around him, and knew from a young age that he wanted to be a physicist so that he could one day make his own great discoveries about the universe. In his free time, Noah loves exploring the great outdoors--especially when doing so in his home state of California--and also enjoys going out on climbing competitions and bouldering expeditions with his school’s rock climbing team. When he’s not in the lab or at the gym, Noah likes to spend his time reading epic fantasy, singing and practicing piano, and playing board games with his friends--especially chess and bananagrams. In high school, Noah explored a variety of extracurricular interests, but it was also very important to him that he spend a great deal of his time actively serving his local community. In 2021 he joined Hopeful Hands, a youth-led community service club that aimed to combat food insecurity within the struggling local homeless population. He became co-president of the team in 2022, partnering with local residents, restaurants, and food kitchens to greatly increase the scope of the team’s project. Because of his dedication, he and his team became some of the few to be honored with the Jefferson Award for Public Service later that same year. Noah went on to be selected as a member of his city’s Youth Ambassador Program, which employed students to advocate for their peers in the city council, and to help organize and oversee the city’s community service programs. Throughout high school, Noah was also involved as a member of his local Boy Scout troop: teaching and leading his peers on outdoor expeditions; designing his own service project to help renovate a local middle school; and further going on to earn the highest rank of Eagle Scout in 2023. Now as a college student, Noah works hard to continually serve the local community of his peers, but is excited to also pursue his childhood dream of uncovering the hidden workings of the universe. He’s happy to be living in such a technologically and scientifically revolutionary age, and can’t wait to play his own part in making the discoveries of tomorrow. For him, the best part about being a Curious Cardinals mentor is getting to share his sense of wonder and curiosity with others: encouraging mentees to question \u003cem\u003ewhy\u003c/em\u003e things are the way they are, and building up their intuition so they can find the answers themselves. He hopes to inspire the next generation of kind and passionate innovators, and to give them the tools they need to build their own bright future.\u003c/p\u003e","teachingVideoPlaybackId":"ic774MbyuKJVRNMY02dxrda00RT1Rl3902bM01lo2ZhWtn8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"77a93313-0457-42ff-ad48-8757ea3dbe4f\"}"},{"__ref":"Favorites:{\"uuid\":\"bd7171e6-15d9-4dfe-87b9-ae98e697f4a5\"}"},{"__ref":"Favorites:{\"uuid\":\"836da19a-8501-4745-9164-c16d9cdaa214\"}"}],"causesSupported":[],"major":"Engineering Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"968a6ef
