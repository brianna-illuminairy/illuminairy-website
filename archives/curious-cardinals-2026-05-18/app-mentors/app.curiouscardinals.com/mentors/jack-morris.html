xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"67e9b7ef-7e4d-4018-b190-036beb5a7c44\"}":{"__typename":"Favorites","uuid":"67e9b7ef-7e4d-4018-b190-036beb5a7c44","photoUrl":"https://ucarecdn.com/9d011029-3007-4b60-9f9d-aab6f23f540b/","title":"Abbey Road","type":"ALBUM"},"Favorites:{\"uuid\":\"3671e031-2d79-4d9e-b0ef-c83c6a12d2ae\"}":{"__typename":"Favorites","uuid":"3671e031-2d79-4d9e-b0ef-c83c6a12d2ae","photoUrl":"https://ucarecdn.com/5bcac1ea-8a11-41a4-b1bb-ded2961c67eb/","title":"Paris, France","type":"CITY"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"8217312f-9b10-4bb8-9a3a-7c9ce281c783\"}":{"__typename":"DeepDives","uuid":"8217312f-9b10-4bb8-9a3a-7c9ce281c783","content":"\u003cp\u003eI was a theater kid and a music nerd! In my free time, I was in school productions of \u003cem\u003eRagtime, Noises Off, \u003c/em\u003eand \u003cem\u003e9 to 5\u003c/em\u003e when I wasn't playing music at restaurants around town with my trio.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"700cb42c-e4e9-43ec-ac60-2cbd740875e2\"}":{"__typename":"DeepDives","uuid":"700cb42c-e4e9-43ec-ac60-2cbd740875e2","content":"\u003cp\u003eFind the \"questions that keep you up at night!\" Instead of thinking about which job you want to do, think about which questions you want to answer--which problems you want to solve. The best scientists are those who start with questions. This is key to keeping our motivation up over time, too!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c67f5eed-8ce3-47d3-b982-7eb084e0bcef\"}":{"__typename":"DeepDives","uuid":"c67f5eed-8ce3-47d3-b982-7eb084e0bcef","content":"\u003cp\u003eI'd be nowhere without my mentors! Connecting with my teachers and professors has been essential to my success in college and beyond. I would never have gotten a Fulbright scholarship without the guidance of my \"Language and the Brain\" professor. I want to give this gift back to the next generation of students, because I know how much of an impact it can have!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"97893e11-9603-4752-878c-446c15c3d0ee\"}":{"__typename":"DeepDives","uuid":"97893e11-9603-4752-878c-446c15c3d0ee","content":"\u003cp\u003eI want to establish a new field of science, the Neuroscience of Disability. I hope to showcase the adaptability and resilience of all people and expand medicine's focus beyond just \"finding cures.\" How can we design better infrastructure? How can we give people more holistic medical care? How can we all live our best lives? These are the questions I hope to build my career around.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"e6deef00-561b-4615-a3a2-cd30a9091b82\"}":{"__typename":"School","uuid":"e6deef00-561b-4615-a3a2-cd30a9091b82","name":"MICDS (Mary Institute and Saint Louis Country Day School)","city":"St. Louis","type":"HIGH","state":"Missouri","country":"United States","zip":"63124"},"Education:{\"uuid\":\"a708f804-dd20-4507-b495-e1a77c757f54\"}":{"__typename":"Education","uuid":"a708f804-dd20-4507-b495-e1a77c757f54","school":{"__ref":"School:{\"uuid\":\"e6deef00-561b-4615-a3a2-cd30a9091b82\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"6c6e37bc-a3c2-41a0-8f86-f89f276f20cf\"}":{"__typename":"Education","uuid":"6c6e37bc-a3c2-41a0-8f86-f89f276f20cf","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"7d3399c4-839e-415e-be3d-419fd801c12a\"}":{"__typename":"MentorPublicProfile","uuid":"7d3399c4-839e-415e-be3d-419fd801c12a","displayName":"Jack M.","slug":"jack-morris","biography":"\u003cp\u003eHi! I’m Jack, a recent graduate from Brown University with a degree in Neuroscience. I am pursuing a career in Neuroscience research and hope to use science to showcase the adaptability of Disabled people in an effort to inform public policy, inclusive design, and to unravel the stigma surrounding Disability.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about brain science in its many forms, from behavioral psychology to computational neuroscience, and I have conducted neuroscience research in both English and French! As a mentor, I bring an expert perspective on how research really works and am practiced in communicating about it. I worked as a Learning Assistant for Brown’s Neural Systems course, where I lectured on course content and held office hours. In this role, I facilitated problem-solving sessions and became proficient in understanding students’ goals and challenges and responding to them skillfully.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also a fluent French speaker–from 10 years of classroom study and 7 months of living in France. I am eager to help French language learners build a deep knowledge of how French is really spoken, outside the classroom. I have a wide knowledge of French music, TV, movies, and books and would love to guide mentees through an exploration of French media and culture.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I am visually impaired, and I have worked my whole life as a formal and informal mentor for students navigating life with a Disability. I served as the Youth Chair of the St. Louis chapter of the Foundation Fighting Blindness and have sat on numerous panels to spread awareness about blindness. I am skilled in self-advocacy and understand how to navigate higher education as a visually impaired person. I am also practiced in integrating my experience with Disability into application essays. I did so successfully to get into college and have already been accepted at graduate schools using the same approach. I am passionate about mentoring students–Disabled or not–on how to put their best foot forward in school and in their applications.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of class, I love playing music--I play guitar and bass and sing a little in several bands. I also meditate daily and believe in the power of mindfulness to make change in our lives. I also recently discovered the joy of audiobooks and have been reading through some classic sci-fi / fantasy books! I'd love to nerd out with you about any of these things - hope to connect soon!\u003c/p\u003e","teachingVideoPlaybackId":"2SHlOJkWGSq6tBiqLySES02OuWWMsFuj7ShpXIIHanG8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"67e9b7ef-7e4d-4018-b190-036beb5a7c44\"}"},{"__ref":"Favorites:{\"uuid\":\"3671e031-2d79-4d9e-b0ef-c83c6a12d2ae\"}"}],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8217312f-9b10-4bb8-9a3a-7c9ce281c783\"}"},{"__ref":"DeepDives:{\"uuid\":\"700cb42c-e4e9-43ec-ac60-2cbd740875e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"c67f5eed-8ce3-47d3-b982-7eb084e0bcef\"}"},{"__ref":"DeepDives:{\"uuid\":\"97893e11-9603-4752-878c-446c15c3d0ee\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8f89a4b3-415c-421a-913e-0305978fe30f/-/preview/-/format/jpg/","https://ucarecdn.com/3dd07a6b-f17c-409c-8bb2-079a77fd0a4a/-/preview/-/format/jpg/","https://ucarecdn.com/86eccaf2-89ba-4703-9a8f-1cff469b03c5/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a708f804-dd20-4507-b495-e1a77c757f54\"}"},{"__ref":"Education:{\"uuid\":\"6c6e37bc-a3c2-41a0-8f86-f89f276f20cf\"}"}],"hiredAt":"2025-04-22T10:32:10.747Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","French","Academic Coaching","Executive Function","College Essay Writing","Music","Medicine / Health","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jack-morris\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7d3399c4-839e-415e-be3d-419fd801c12a\"}"}}},"_sentryTraceData":"3c29fb119cee49fda0034a70477b336e-a06c90938077327e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_
