xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8bbfc027-0e29-40d7-8ee4-2183f430e8a5\"}":{"__typename":"Favorites","uuid":"8bbfc027-0e29-40d7-8ee4-2183f430e8a5","photoUrl":"https://ucarecdn.com/ab774268-365e-4d60-89c8-59af2a8b57e4/","title":"Munenori Kawasaki","type":"ATHLETE"},"Favorites:{\"uuid\":\"28d626e0-5e24-4a1c-a424-14a559843a5a\"}":{"__typename":"Favorites","uuid":"28d626e0-5e24-4a1c-a424-14a559843a5a","photoUrl":"https://ucarecdn.com/b47ffa09-4388-45dd-bc3a-2b657c2a90ef/","title":"Volleyball","type":"SPORT"},"Favorites:{\"uuid\":\"e24b13f3-a885-464a-9179-2d13bcd0a94b\"}":{"__typename":"Favorites","uuid":"e24b13f3-a885-464a-9179-2d13bcd0a94b","photoUrl":"https://ucarecdn.com/66020ddf-44af-4b07-9040-61d8e6047640/","title":"Mac DeMarco ","type":"ARTIST"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ccce7f4d-7679-4d11-92ee-62a81eb1fe53\"}":{"__typename":"DeepDives","uuid":"ccce7f4d-7679-4d11-92ee-62a81eb1fe53","content":"\u003cp\u003eIt’s okay to do things that your friends aren’t doing! You’re interested in something, but you’re scared to do it, or you don’t know anyone doing it? That’s totally okay, and honestly, it might even be the best situation. Not only do you get to learn something new and challenge yourself, but you also get to meet people you wouldn’t have otherwise met. Don’t hold yourself back because your friends aren’t doing it, or you might feel embarrassed at first. Some of the best opportunities come from stepping into unfamiliar spaces alone, and those experiences often end up shaping you the most. So take these chances sooner rather than later, and you’ll thank yourself later for it.\u0026nbsp;\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"adae5782-e236-464a-9066-a738aa84e6dc\"}":{"__typename":"DeepDives","uuid":"adae5782-e236-464a-9066-a738aa84e6dc","content":"\u003cp\u003eIn my lifetime, I hope to build my own house. Yes, you heard it, I'll build myself my own house with 4 walls and a roof. I want to design it, build it, and eventually live in it. Oh, and I hope to make some of the furniture in this future home. I’m thinking some shelves, a coffee table, a wooden bench, and I’ll decorate this place until it becomes truly me!\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"b3facc81-5383-47ad-a64d-80edd2f1712e\"}":{"__typename":"DeepDives","uuid":"b3facc81-5383-47ad-a64d-80edd2f1712e","content":"\u003cp\u003eIn high school, I was always talking to people, but this didn’t start happening until the end of my sophomore year. In fact, in the first two years of high school, I was so scared to talk to anyone that I didn’t know, and I was especially nervous to talk to teachers. Even writing an email to them was something that would cause me so much anxiety. But slowly, as I got more comfortable with the high school environment, talking to people also became more natural. I reven started regularly talking to my teachers, and this was an incredibly important development for me in high school. I realized that talking to people, both my peers and especially my teachers, made my day so much better. I even did better academically because I was so much more engaged with the community and with the classroom content. So by the end of high school, I can confidently say, “in high school, I was always talking to people.”\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"2c4e625a-3548-4098-9c90-28e2a5141ec7\"}":{"__typename":"DeepDives","uuid":"2c4e625a-3548-4098-9c90-28e2a5141ec7","content":"\u003cp\u003eMentorship was something that I started all the way back in my freshman year of high school, in the form of being a teacher at my Sunday school. Every Sunday, I would come in from 9:30 to 12:30 pm, and spend my time teaching my classroom of young children. Seeing the smiles on my students' faces and hearing them say they can’t wait for next week was incredibly rewarding, but what made this experience so important to me was seeing my students grow as individuals, learn more, and have fun in the process. I wanted to continue to do something similar during my time in College, which brought me here to mentorship at Curious Cardinals.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"741299fd-9f23-44bd-9e77-471c400cd06c\"}":{"__typename":"School","uuid":"741299fd-9f23-44bd-9e77-471c400cd06c","name":"The American School in Japan","city":"Chofu","type":"HIGH","state":"Tokyo","country":"Japan","zip":"182-0031"},"Education:{\"uuid\":\"f6cc2a02-02bf-415c-a4fa-57e30412700b\"}":{"__typename":"Education","uuid":"f6cc2a02-02bf-415c-a4fa-57e30412700b","school":{"__ref":"School:{\"uuid\":\"741299fd-9f23-44bd-9e77-471c400cd06c\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"7eeb307f-f7d4-4f11-b12b-571e0a7a7b57\"}":{"__typename":"Education","uuid":"7eeb307f-f7d4-4f11-b12b-571e0a7a7b57","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"b1fe60d7-22c8-49f5-aeed-8efc6e6a35b7\"}":{"__typename":"MentorPublicProfile","uuid":"b1fe60d7-22c8-49f5-aeed-8efc6e6a35b7","displayName":"Emi M.","slug":"emi-matsumoto","biography":"\u003cp\u003eHi everyone! My name is Emi, and I’m from Tokyo, Japan. I am currently a student at Cornell University in the College of Engineering. I love spending time outdoors, whether that’s hiking, swimming, or simply exploring new places. I also enjoy trying new things with friends, from discovering cafés around Ithaca to exploring restaurants in Tokyo, or learning new skills like pottery and experimenting with different coding environments. I’m always looking for opportunities to explore my interests and gain new experiences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs an engineering student, I am passionate about building things that connect both hardware and software. I am especially interested in product development at the intersection of technology and design, where I can work on creating practical, impactful systems. I’m also drawn to structural engineering, and am currently working on a footbridge project in upstate New York, which has given me hands-on experience in design and problem-solving. I get to design, cut wood, assemble, and even get super muddy, but through all this, I learn so so so much. Through rain, wind, and sunshine, I have been working on this bridge, and I can’t recommend working on hands-on projects enough! I strongly believe that starting small and just trying out new things is the best way to discover and explore your passions!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I value building connections with people and being part of communities where I can both learn from others and contribute my own experiences. This has led me to join cultural clubs on campus, where I can reconnect with my Japanese roots while also building meaningful friendships with people with similar backgrounds but vastly different experiences. And speaking of trying new things, I recently joined the club rugby team here at Cornell! Even though I had no prior experience in rugby, trying a new sport at an older age has challenged me so much and has given me more confidence to step outside of my comfort zone and face new experiences!\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, I learn best by doing, whether that’s through engineering projects, outdoor exploration, or trying something new with friends. I am excited to help you grow, both academically and beyond the classroom. Feel free to reach out to me if you have any questions!\u003c/p\u003e","teachingVideoPlaybackId":"VpwD6Gj3Fh00QSpmbMlvIGPU5iIeJweA5D02pK01MQe01Kw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8bbfc027-0e29-40d7-8ee4-2183f430e8a5\"}"},{"__ref":"Favorites:{\"uuid\":\"28d626e0-5e24-4a1c-a424-14a559843a5a\"}"},{"__ref":"Favorites:{\"uuid\":\"e24b13f3-a885-464a-9179-2d13bcd0a94b\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ccce7f4d-7679-4d11-92ee-62a81eb1fe53\"}"},{"__ref":"DeepDives:{\"uuid\":\"adae5782-e236-464a-9066-a738aa84e6dc\"}"},{"__ref":"DeepDives:{\"u
