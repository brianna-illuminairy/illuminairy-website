xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"853f12bf-fa5a-4420-8493-8312b611ea1d\"}":{"__typename":"Favorites","uuid":"853f12bf-fa5a-4420-8493-8312b611ea1d","photoUrl":"https://ucarecdn.com/4f55d2ac-c1c1-4bc0-8bf4-27e58db3474e/","title":"Silver Springs by Fleetwood Mac","type":"SONG"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d8d2d206-76a6-4631-baca-dda68de988dd\"}":{"__typename":"DeepDives","uuid":"d8d2d206-76a6-4631-baca-dda68de988dd","content":"\u003cp\u003eMy mentors in high school and college were so impactful--they not only aided me with my academics and college essays, but they also helped me to grow confidence in my abilities and create guidelines that would direct me through uncertain moments of my life. We can learn so much from our mentors, and I am so excited to help pay it forward and pass on what I've learned to my mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8e9b571c-b7ee-43a5-a587-f47d228ff1cf\"}":{"__typename":"DeepDives","uuid":"8e9b571c-b7ee-43a5-a587-f47d228ff1cf","content":"\u003cp\u003eI want to be an actor! I've loved performing since I was five years old, so I am currently pursuing that dream. In an ideal world, I would own a production company and produce shows that I feel are exciting and meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"40df35ef-7e67-4c7c-9965-2056709885da\"}":{"__typename":"DeepDives","uuid":"40df35ef-7e67-4c7c-9965-2056709885da","content":"\u003cp\u003eI've always loved theater, and I knew that I wanted to study this art form from both a practical and theoretical sense. I grew as an actor, thinker, director, producer, and person. Theater asks you to employ empathy and understand why people act the way they do, and I've applied the lessons I learned to my life on and off the stage. I was also excited by the prospect of putting up a show for my thesis! I produced and starred in \u003cem\u003eNatasha, Pierre \u0026amp; The Great Comet of 1812 \u003c/em\u003eas Natasha. This was the most tiring, challenging, yet fulfilling accomplishment of my life. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI decided to double major in History because I recognized that my favorite classes in high school were courses like APUSH and World Civilizations. I love reading, writing, and learning about how the past informs the present. At first, I thought I wanted to study political science, but I soon realized that I was more interested in the historical ramifications of policy than the complexities of the laws themselves. I found it so exciting to pour the archives to find important primary texts and also discuss secondary sources in class. After taking several history classes at Yale, I realized that I was fascinated by the history of science and medicine. I declared a concentration in Science, Medicine, and Technology. For my thesis, I researched and wrote a 45-page essay on the history of Yale's reproductive health systems. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn short, I chose to study what I wanted to pursue as a career and what was most excited by! College is a unique opportunity to learn as much as you can about what you love, and that is exactly what I was fortunate enough to do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6e8b8e66-18a1-4f3a-ad54-61a7a38ac0c0\"}":{"__typename":"DeepDives","uuid":"6e8b8e66-18a1-4f3a-ad54-61a7a38ac0c0","content":"\u003cp\u003eSuccess doesn't happen overnight. For some, it does, but for most individuals, any accomplishment requires years of hard work and dedication. In today's digital age, we watch people become famous overnight and compare our progress to their instant success. This can feel incredibly discouraging, and we might fault ourselves for not naturally getting the grade that we want or making the soccer team. It's important to work hard and build good habits consistently. If we are dedicated, our efforts will pay off. LeBron James, as talented as he naturally is, practices all the time. Hours of studying will help us get the A on the algebra test that we want. Playing piano daily will allow us to master the song that once felt impossible. It's ok, and often better, to be the tortoise instead of the hare--success will feel even sweeter when we finally achieve it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"f63e18ad-d8be-4ffd-b01f-202e27056645\"}":{"__typename":"School","uuid":"f63e18ad-d8be-4ffd-b01f-202e27056645","name":"Punahou School","city":"Honolulu","type":"HIGH","state":"Hawaii","country":"United States","zip":"96822"},"Education:{\"uuid\":\"49e8abb9-d865-4828-90ee-67b1abd2987b\"}":{"__typename":"Education","uuid":"49e8abb9-d865-4828-90ee-67b1abd2987b","school":{"__ref":"School:{\"uuid\":\"f63e18ad-d8be-4ffd-b01f-202e27056645\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1421145c-5f71-40af-85dc-a5b837eab228\"}":{"__typename":"Education","uuid":"1421145c-5f71-40af-85dc-a5b837eab228","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"History, Theater Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"eb49325f-4b25-4406-a7d6-246b906fccff\"}":{"__typename":"MentorPublicProfile","uuid":"eb49325f-4b25-4406-a7d6-246b906fccff","displayName":"Malia M.","slug":"malia-munley-1","biography":"\u003cp\u003eHi everyone!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy name is Malia, and I’m originally from Honolulu, HI. I graduated from Yale in May, Cum Laude and with distinction, with a double major in History and Theater. Arriving at Yale, I thought I wanted to study Theater and Economics. Then, I wanted to study Theater and Political Science. However, after working on the 2020 Biden-Harris Michigan Campaign and the Jon Ossoff Senate runoff, I realized that I was more drawn to people's stories and how policy has affected them than the legal complexities of those policies. I thought back to high school and realized that, although I loved English, math, and environmental science, some of my favorite classes were  APUSH and World Civilizations. Suddenly, it became clear: I had to study History!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was a National Merit Scholar, Presidential Scholar Nominee, served on the Student Government, and co-chaired my school's carnival to raise almost $1,000,000 for our school's financial aid program. I also worked as a tutor and performed in all of my school's plays and musicals!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGoing all the way from Honolulu, HI, to Connecticut, I found comfort in the arts. I’ve always loved performing and leadership, so at Yale, I decided to try my hand at producing and directing as well as performing. I worked on over 25 shows during college, and I’ve learned not only how to become a better performer but also a better leader and mentor. I was the first student director at the Yale School of Drama’s Cabaret, served as Vice President for the Yale Dramatic Association, the nation’s oldest college theater company, and co-founded the first free virtual acting intensive for New Haven high school students. I worked as a peer mentor and taught students how to produce and direct, was selected as the student representative for Yale’s musical theater curriculum, performed improv comedy, and worked as a tour guide. One of my proudest accomplishments was producing and starring as Natasha in the musical \u003cem\u003eNatasha, Pierre \u0026amp; The Great Comet of 1812\u003c/em\u003e. I also sing, tap dance, and love to read, write, hike, and swim at the beach. Music is one of my favorite things in the world—I always have a pair of headphones on. So, needless to say, I love all things creative.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere are so many things I learned in and out of the classroom in high school and college, and I’m so excited to work with you to discover your passions!\u003c/p\u003e","teachingVideoPlaybackId":"W02aVEsmu5nePAQy3tt02BiAYD5xyUigU5DK802KhpZ01sw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn high school, I fell in love with the musical \u003cem\u003eOnce. \u003c/em\u003eMy senior year, I wanted to put up my own production of the show. So, I directed, produced, stage-managed, designed, and starred in the show. I even had to teach myself piano for this role. It was extremely challenging but so rewarding. There's nothing like the feeling of accomplishing your goals.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"853f12bf-fa5a-4420-8493-8312b611ea1d\"}"}],"causesSupported":[],"major":"History, Theater Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d8d2d206-76a6-4631-baca-dda68de988dd\"}"},{"__ref":"DeepDives:{\"uuid\":\"8e9b571c-b7ee-43a5-a587-f47d228ff1cf\"}"},{"__ref":"DeepDives:{\"uuid\":\"40df35ef-7e67-4c7c-9965-2056709885da\"}"},{"__ref":"DeepDives:{\"uuid\":\"6e8b8e66-18a1-4f3a-ad54-61a7a38ac0c0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/29be9e44-b750-4e21-af1c-8a742ef14169/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"49e8abb9-d865-4828-90ee-67b1abd2987b\"}"},{"__ref":"Education:{\"uuid\":\"1421145c-5f71-40af-85dc-a5b837eab228\"}"}],"hiredAt":"2024-08-31T04:14:20.141Z","topics":[],"communityBadges":["https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"malia-munley-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"eb49325f-4b25-4406-a7d6-246b906fccff\"}"}}},"_sentryTraceData":"546751fc0f9048669ca29e1186c77fd5-abb7ca17c5e9b3f2-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=546751fc0f9048669ca29e1186c77fd5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"malia-munley-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.star
