xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bf84c78d-0d9c-4e20-98af-e9311984dd56\"}":{"__typename":"Favorites","uuid":"bf84c78d-0d9c-4e20-98af-e9311984dd56","photoUrl":"https://ucarecdn.com/7aa71824-3322-4756-9050-fde8229f6240/","title":"Minecraft","type":"GAME"},"Favorites:{\"uuid\":\"3f4efd7a-87ef-4f25-b4f8-846c5feb8cde\"}":{"__typename":"Favorites","uuid":"3f4efd7a-87ef-4f25-b4f8-846c5feb8cde","photoUrl":"https://ucarecdn.com/bee607b2-2956-4ef1-9955-4fb9ab5e3d97/","title":"Coraline","type":"MOVIE"},"Favorites:{\"uuid\":\"0f51ee81-8f2f-42ec-9214-ce1839a91e95\"}":{"__typename":"Favorites","uuid":"0f51ee81-8f2f-42ec-9214-ce1839a91e95","photoUrl":"https://ucarecdn.com/0e1edae8-ae6e-4b19-9ada-6c6ea37285d7/","title":"5 Seconds of Summer","type":"ARTIST"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1c593fb8-1e39-457f-8d0e-a60b958236f4\"}":{"__typename":"DeepDives","uuid":"1c593fb8-1e39-457f-8d0e-a60b958236f4","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to make a significant impact in education, especially for underrepresented communities that often lack support and face numerous obstacles. Through my research and passion for accessibility and teaching, I aspire to create meaningful change by breaking down barriers and providing opportunities for those who need it most. I believe I can help empower individuals to overcome challenges and achieve their full potential by fostering an environment where everyone has equal access to quality education.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"37c79780-9e46-46e5-b4cf-68edfc7286a5\"}":{"__typename":"DeepDives","uuid":"37c79780-9e46-46e5-b4cf-68edfc7286a5","content":"\u003cp\u003eMy dad is my greatest role model and mentor. Although he wasn't able to finish college because of unforeseen circumstances, he's the smartest person I know. He's been a teacher in my life, always tinkering, thinking outside the box, and showing me that there’s no problem too big to solve. I truly believe my passion for making and design came from him. His creativity, resourcefulness, and relentless drive to improve constantly inspire and motivate me to do better. His ability to see solutions where others might see challenges has shaped my own approach to life and work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"f6664850-5c5b-49f8-be59-118f0c37b007\"}":{"__typename":"DeepDives","uuid":"f6664850-5c5b-49f8-be59-118f0c37b007","content":"\u003cp\u003eI am extremely proud of my research focused on increasing accessibility to electrical engineering education for blind and low-vision students. It’s a cause that deeply resonates with me, and I’m proud to be part of a movement that aims to make technical fields more inclusive. Through my work, I hope to create opportunities for individuals who might otherwise face barriers in accessing STEM education, and I’m passionate about breaking down those obstacles to help others thrive.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4c0695c3-735a-43be-949f-0253f7d1852b\"}":{"__typename":"DeepDives","uuid":"4c0695c3-735a-43be-949f-0253f7d1852b","content":"\u003cp\u003eI would tell my middle and high school self not to be afraid to ask for help when needed. I used to think I had to do everything on my own, but I've learned that reaching out for support—whether from teachers, friends, or mentors—can make a huge difference. Trusting others and seeking guidance not only lightens the load but also opens up new perspectives, enriches your passions, and helps you grow in ways you might never expect. Embracing collaboration and learning from others can make your journey more enjoyable, fulfilling, and successful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"731dba15-ac09-4f54-95e3-1960d8c14cb8\"}":{"__typename":"School","uuid":"731dba15-ac09-4f54-95e3-1960d8c14cb8","name":"Escuela Superior Josefa Vélez Bauza","city":"Peñuelas","type":"HIGH","state":"Peñuelas","country":"Puerto Rico","zip":"00624"},"Education:{\"uuid\":\"096df768-2834-4f30-8841-1875aac1cf09\"}":{"__typename":"Education","uuid":"096df768-2834-4f30-8841-1875aac1cf09","school":{"__ref":"School:{\"uuid\":\"731dba15-ac09-4f54-95e3-1960d8c14cb8\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"c2b33371-e511-4a26-a795-700f2d98daef\"}":{"__typename":"Education","uuid":"c2b33371-e511-4a26-a795-700f2d98daef","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Product Design","degree":null},"MentorPublicProfile:{\"uuid\":\"1d83e9c8-9a09-4e8c-931b-8818b7c0d8a0\"}":{"__typename":"MentorPublicProfile","uuid":"1d83e9c8-9a09-4e8c-931b-8818b7c0d8a0","displayName":"Mirelys M.","slug":"mirelys-mendezpons","biography":"\u003cbr\u003e\u003cp\u003eMirelys Mendez Pons is a senior at Stanford University studying Product Design with a minor in Modern Languages (Spanish and Portuguese). Growing up in Puerto Rico, she has always been fascinated by how thoughtfully designed products can improve people’s lives. This interest in design led her to focus on accessibility and inclusion, particularly in creating educational tools for blind and low-vision learners, which she explores through her honors thesis at the Graduate School of Education.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, Mirelys created a homemade kit to detect CO2 gas after Hurricane Maria hit Puerto Rico. With most of the island without power, many homes used gas-powered generators, leading to dangerous levels of CO2. She designed this kit to prevent potential accidents, which marked the beginning of her journey to solve real-world challenges with innovation. Mirelys also overcame the challenges of transitioning from an underresourced school to a competitive academic environment. She channels this experience into mentoring others, ensuring they feel supported and empowered.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a Resident Assistant (RA) for two years, Mirelys has found joy in fostering a welcoming environment and building connections with her peers. She loves helping others feel supported and creating a sense of community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMirelys also works as the webpage manager and designer for \u003cem\u003eSemilla de Bienestar\u003c/em\u003e, an organization that works with the Puerto Rican community and its diaspora. She contributes her design skills to help elevate the organization's mission of supporting and strengthening the Puerto Rican community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to her academic and extracurricular work, Mirelys spent five years practicing inline speed skating. This experience taught her discipline, resilience, and the value of pushing through challenges—skills that have shaped her approach to both her personal and professional life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen she’s not busy with academic or leadership roles, Mirelys enjoys playing video games like \u003cem\u003eMinecraft\u003c/em\u003e and \u003cem\u003eStardew Valley\u003c/em\u003e. She also loves retro games and tinkering with old consoles. Cooking is another passion of hers; she took three years of culinary arts in high school and graduated with a vocational diploma in the field. Mirelys also enjoys photography and spending time with her younger sister in San Francisco. You might also find her sketching ideas for her next project or diving into a good book.\u003c/p\u003e","teachingVideoPlaybackId":"uqbE00qA3q7Cy02PW5roK93EWM900MpVVJ01GgVpHCpFpVQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bf84c78d-0d9c-4e20-98af-e9311984dd56\"}"},{"__ref":"Favorites:{\"uuid\":\"3f4efd7a-87ef-4f25-b4f8-846c5feb8cde\"}"},{"__ref":"Favorites:{\"uuid\":\"0f51ee81-8f2f-42ec-9214-ce1839a91e95\"}"}],"causesSupported":[],"major":"Product Design","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1c593fb8-1e39-457f-8d0e-a60b958236f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"37c79780-9e46-46e5-b4cf-68edfc7286a5\"}"},{"__ref":"DeepDives:{\"uuid\":\"f6664850-5c5b-49f8-be59-118f0c37b007\"}"},{"__ref":"DeepDives:{\"uuid\":\"4c0695c3-735a-43be-949f-0253f7d1852b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cda65a5f-c604-4632-8837-1e9be151338d/-/preview/-/format/jpg/","https://ucarecdn.com/ecc7eb0d-546e-4df9-b4c6-ddd1fa7d1d51/-/preview/-/format/jpg/","https://ucarecdn.com/65b4584a-c64b-4784-8ff5-ac51bbba0095/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"096df768-2834-4f30-8841-1875aac1cf09\"}"},{"__ref":"Education:{\"uuid\":\"c2b33371-e511-4a26-a795-700f2d98daef\"}"}],"hiredAt":"2024-12-30T20:07:13.968Z","topics":["Visual Arts / Graphic Design","History Project","Video / Photography","Fashion / Cosmetics","K-6 Storybook","Business / Entrepreneurship","Web Design","Robotics / Electronics / CAD","STEM Project","Sustainability"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mirelys-mendezpons\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1d83e9c8-9a09-4e8c-931b-8818b7c0d8a0\"}"}}},"_sentryTraceData":"44f006abb27d4d8a88a4c3b2403e915d-a5c3986fa54edacd-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=44f006abb27d4d8a88a4c3b2403e915d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"mirelys-mendezpons"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-579
