xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f963b66e-ae1e-4657-9737-4fe449ed4475\"}":{"__typename":"Favorites","uuid":"f963b66e-ae1e-4657-9737-4fe449ed4475","photoUrl":"https://ucarecdn.com/e6291344-0638-4e7d-b874-cbf7a6b3ae30/","title":"Forrest Gump","type":"MOVIE"},"Favorites:{\"uuid\":\"c56e3f6f-fe2b-49ad-a59a-9695c8c1d372\"}":{"__typename":"Favorites","uuid":"c56e3f6f-fe2b-49ad-a59a-9695c8c1d372","photoUrl":"https://ucarecdn.com/4243742f-aec9-4dc3-9650-0459956cbdf2/","title":"Little Women","type":"BOOK"},"Favorites:{\"uuid\":\"9d9b445e-3052-4094-b136-04b41f2da129\"}":{"__typename":"Favorites","uuid":"9d9b445e-3052-4094-b136-04b41f2da129","photoUrl":"https://ucarecdn.com/21984b39-7e59-457b-9bed-855b47dd9491/","title":"The Yankees!","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"2f38a459-b62a-4a28-bfe9-1010bbbee92e\"}":{"__typename":"CausesSupported","uuid":"2f38a459-b62a-4a28-bfe9-1010bbbee92e","name":"Rooftop Films","description":"\u003cp\u003eI volunteer to help put on shows by independent film artists in the city!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/fd20a232-1eab-4c5d-8940-d3e75c697907/"},"CausesSupported:{\"uuid\":\"7f9afdaa-d011-4c7b-a176-713dac0843a9\"}":{"__typename":"CausesSupported","uuid":"7f9afdaa-d011-4c7b-a176-713dac0843a9","name":"Prevent Child Abuse America","description":"\u003cp\u003eI contribute to multiple fundraising events through my sorority!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/3f6f436b-1e13-4663-a82a-95afd900c8b7/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"583e6602-c055-4ad5-95d3-1efdc5cf0aed\"}":{"__typename":"DeepDives","uuid":"583e6602-c055-4ad5-95d3-1efdc5cf0aed","content":"\u003cp\u003eI always like to learn how to do new things and embark on new projects in my spare time. Whether that's embroidering my clothes, wood burning, learning stained glass and soldering techniques, or hand crocheting a blanket, I love teaching myself a random new skill! I also absolutely love baking, and especially love making French macarons and Lefse, my famous family recipe!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e1505710-f132-4c6e-9c56-4a09d10fcfa7\"}":{"__typename":"DeepDives","uuid":"e1505710-f132-4c6e-9c56-4a09d10fcfa7","content":"\u003cp\u003eI chose my major, Chemical Engineering, because there are so many paths that you can go with it. You can stay in research, go into industry, enter into finance, become a policy professional, or so much more with a ChemE degree! There are also a ton of different sectors that you can concentrate on in ChemE whether that be in health, energy, or materials. I also love the challenging problem-solving aspect of my degree!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"d6d7d196-78ef-4347-b8b5-6ac6772e6948\"}":{"__typename":"DeepDives","uuid":"d6d7d196-78ef-4347-b8b5-6ac6772e6948","content":"\u003cp\u003eI can do a back flip. I spent over 10 years in competitive gymnastics and will always have a random skill to whip out. Sports have always been a huge part of my life and I loved running track and cross country on high school, performing at nationals with my high school dance team, and participating in gymnastics meets all over the country.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f7f378a0-b864-4fd1-a250-b7a89a9d0222\"}":{"__typename":"DeepDives","uuid":"f7f378a0-b864-4fd1-a250-b7a89a9d0222","content":"\u003cp\u003eMy summers in high school were so much fun. I would spend my mornings going to morning practices for my sports and taking care of my sheep on our family farm, and then head to my engineering internship where I would perform tests on solar additions in the reclamation of heat energy. In the evening, my friends and I would attend local summer festivals, hike in the mountains, and drag our dogs to get Starbucks Pup Cups.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"b797c0d2-6a0a-40ed-b1d6-5341b178e9a9\"}":{"__typename":"School","uuid":"b797c0d2-6a0a-40ed-b1d6-5341b178e9a9","name":"Fruita Monument High School","city":"Fruita","type":"HIGH","state":"Colorado","country":"United States","zip":"81521"},"Education:{\"uuid\":\"c172695e-0ce7-4f01-bbcc-1813468ea658\"}":{"__typename":"Education","uuid":"c172695e-0ce7-4f01-bbcc-1813468ea658","school":{"__ref":"School:{\"uuid\":\"b797c0d2-6a0a-40ed-b1d6-5341b178e9a9\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"0eb609dd-01ef-4fa3-b8e1-71335abf04af\"}":{"__typename":"Education","uuid":"0eb609dd-01ef-4fa3-b8e1-71335abf04af","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"2e6c6ad6-939c-4da3-baa4-c595e0870e08\"}":{"__typename":"MentorPublicProfile","uuid":"2e6c6ad6-939c-4da3-baa4-c595e0870e08","displayName":"Miranda D.","slug":"miranda-deeths","biography":"\u003cp\u003eHey! I’m Miranda, a second-year Chemical Engineering major at Columbia University’s School of Engineering and Applied Science. I’m passionate about global health, whether that means working to end poverty, advance medicine, or develop real medical solutions through my biotech ChemE coursework or through national and international advocacy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI help driven and passionate middle and high school students turn their curiosity about global health, medicine, engineering for humanity, and social impact into real projects: research, advocacy campaigns, and initiatives they can be genuinely proud of.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOver the past few years, I’ve:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConducted and presented protein engineering research at Columbia focused on combating antibiotic resistance\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as a ONE Campaign Champion and Campus Leader, advocating in Washington, DC for solutions to preventable diseases\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eActed as a United Nations Youth Delegate with the Major Group for Children and Youth, speaking at forums at the UN Headquarters in NYC\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eParticipated in the NPLB Biotechnology Fellowship, working with biotech professionals to advance equity in the U.S. biotech sector\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked as a World Bank Youth Delegate, contributing to infrastructure development projects\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch4\u003e\u003cstrong\u003eWhat I Specialize In:\u003c/strong\u003e\u003c/h4\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eEngineering and STEM solutions IRL\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eYouth advocacy and policy-focused initiatives\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePublic speaking, writing, and leadership development\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGlobal health and disease equity projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBiotechnology and science-for-good explorations\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI know what it feels like to want to change the world, but to not know where to start. I love helping students realize that meaningful impact is possible, no matter where they’re beginning from!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eMy Mentorship Style:\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve worked closely with younger activists and peers to transform big ideas into concrete, achievable outcomes. I think real change starts with honest conversations about the resources we already have and how to use them effectively.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA Typical Session Might Look Like:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eExploring a student’s passions and ideas for impact\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTurning a big concern (e.g. “I want to help with global health”) into a specific, actionable project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a step-by-step plan with real milestones\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing speaking, pitching, or presenting ideas with confidence\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLearning how to reach out to experts, organizations, competitions, or programs\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSupport with applications, interviews, and public-facing presentations\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eProject Ideas We Can Work On\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDesigning a mini research project that could continue at a local university or later in higher education\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a magazine or portfolio of mathematical or scientific shortcuts not taught in traditional classrooms\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTurning a personal interest (fashion, music, sports, etc.) into a health- or equity-focused capstone project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding and launching a youth advocacy campaign around an issue the student cares about\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStarting a high school chapter of an advocacy organization and learning how to engage with policymakers\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e\u0026amp; A Few Fun Facts About Me!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m originally from Colorado, so I love being outdoors in every facet: skiing, mountain biking, running, camping, and hiking. I’m obsessed with my dog Toronto (aka Toes) and my cat Mills, and I also have goats and chickens back home!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also passionate about art history and film, love visiting museums and galleries around NYC, and volunteering with Rooftop Films when I have an open evening. I'm really enjoying city life exploring with friends, shopping, running the social media for my sorority, running events for the line dancing club I co-founded, trying new food, and going to concerts and games (especially the US Open and Yankees games!).\u003c/p\u003e","teachingVideoPlaybackId":"Qtc02LNg3B7aCm1cobRJ201j3A9k89lOQRV3h00XeaUifQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMaybe not my single greatest achievement in the whole world, but I was in the top 0.05% of Spotify listeners globally last year which I think is pretty impressive.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f963b66e-ae1e-4657-9737-4fe449ed4475\"}"},{"__ref":"Favorites:{\"uuid\":\"c56e3f6f-fe2b-49ad-a59a-9695c8c1d372\"}"},{"__ref":"Favorites:{\"uuid\":\"9d9b445e-3052-4094-b136-04b41f2da129\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"2f38a459-b62a-4a28-bfe9-1010bbbee92e\"}"},{"__ref":"CausesSupported:{\"uuid\":\"7f9afdaa-d011-4c7b-a176-713dac0843a9\"}"}],"major":"Chemical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"583e6602-c055-4ad5-95d3-1efdc5cf0aed\"}"},{"__ref":"DeepDives:{\"uuid\":\"e1505710-f132-4c6e-9c56-4a09d10fcfa7\"}"},{"__ref":"DeepDives:{\"uuid\":\"d6d7d196-78ef-4347-b8b5-6ac6772e6948\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7f378a0-b864-4fd1-a250-b7a89a9d0222\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a53ca594-4205-4b66-ae17-c9e4b2d0669c/-/preview/-/format/jpg/","https://ucarecdn.com/eb0cee16-def6-4398-937f-e801735569cc/-/preview/-/form
