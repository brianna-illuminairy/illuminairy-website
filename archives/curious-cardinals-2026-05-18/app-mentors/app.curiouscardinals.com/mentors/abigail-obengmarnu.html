xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"79920372-71fd-4a26-9b49-60d47dcf5e0b\"}":{"__typename":"DeepDives","uuid":"79920372-71fd-4a26-9b49-60d47dcf5e0b","content":"\u003cp\u003eThis might be cliché, but I truly believe that it takes a village! Throughout every major stage in my life, I am fortunate to be able to say that I have had wonderful mentors who have helped to guide me--whether it be an older sibling or an undergraduate advisor. Having beacons of advice can be the difference between having an aspiration and making it your reality.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c30ce761-1d50-4b95-81aa-bbb9aea9e8a0\"}":{"__typename":"DeepDives","uuid":"c30ce761-1d50-4b95-81aa-bbb9aea9e8a0","content":"\u003cp\u003eI majored in Neuroscience and Linguistics in college! This was because, towards the end of my high school career, I became very interested in neurological disorders--particularly, aphasia (a condition in which individuals experience deficits in communication). I longed to learn more about these conditions and embarked on my college journey with the passion project of conducting research in this field in mind. I went on to complete an honors thesis all about communication deficits!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"dcd4fe6f-d70e-4713-8f12-5efc98bcf538\"}":{"__typename":"DeepDives","uuid":"dcd4fe6f-d70e-4713-8f12-5efc98bcf538","content":"\u003cp\u003eIn my spare time, I love to perform! I grew up singing in church and went on to perform in an internationally recognized collegiate a cappella group. I also enjoy exploring cities along the Eastern Corridor and learning how to roller skate!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"b470a9c8-2e68-44f8-b79a-a0ea23322c7a\"}":{"__typename":"DeepDives","uuid":"b470a9c8-2e68-44f8-b79a-a0ea23322c7a","content":"\u003cp\u003eRight now, my greatest motivation is the notion that all of the moves I am making right now will contribute to my preparedness to treat patients in the future. I am starting my medical school journey right now, and what keeps me going through all of the hardships and stress is remembering that the knowledge base and skillset I am building and strengthening may help change someone's life for the better.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"a69b3cda-e3aa-4acd-8e4f-fec17148dfb0\"}":{"__typename":"School","uuid":"a69b3cda-e3aa-4acd-8e4f-fec17148dfb0","name":"Brookwood High School","city":"Snellville","type":"HIGH","state":"GA","country":"United States","zip":"30078"},"Education:{\"uuid\":\"f27cbaaf-e1a2-4a2a-be62-1090ec196e57\"}":{"__typename":"Education","uuid":"f27cbaaf-e1a2-4a2a-be62-1090ec196e57","school":{"__ref":"School:{\"uuid\":\"a69b3cda-e3aa-4acd-8e4f-fec17148dfb0\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"4c442465-f1ec-42ef-bac9-9e61ac5e5da3\"}":{"__typename":"Education","uuid":"4c442465-f1ec-42ef-bac9-9e61ac5e5da3","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"4daadf74-a850-43cb-842f-a4f4dd1c6e44\"}":{"__typename":"MentorPublicProfile","uuid":"4daadf74-a850-43cb-842f-a4f4dd1c6e44","displayName":"Abigail O.","slug":"abigail-obengmarnu","biography":"\u003cp\u003eHi there! My name is Abby, and I'm so excited to be your prospective mentor! I grew up in metro-Atlanta, Georgia, but have been living in the Northeast US for the last several years. I attended Harvard College where I studied Neuroscience and Linguistics on the pre-medical track. I am currently a first-year medical student at the University of Pennsylvania. In addition to this science focus that I have had, I love learning and teaching math and have done so regularly for the last few years. I deeply believe that mentorship, through tutoring or otherwise, can have a profound impact on both students' knowledge set and also their confidence and love for different fields.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, I am passionate about the arts, and particularly, singing! I competed with the Harvard Opportunes, an all-gender a cappella group, during my college years, and we went on to achieve 2nd Place at the Finals for the International Championship of Collegiate A Cappella (yes, the competition from Pitch Perfect!).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm excited to interact with new students and get to know their passions as well!\u003c/p\u003e","teachingVideoPlaybackId":"J7jPUC8KVPr2ZD1MNcHSyKiwnD7SyzOqXVRyUsKpigA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"79920372-71fd-4a26-9b49-60d47dcf5e0b\"}"},{"__ref":"DeepDives:{\"uuid\":\"c30ce761-1d50-4b95-81aa-bbb9aea9e8a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"dcd4fe6f-d70e-4713-8f12-5efc98bcf538\"}"},{"__ref":"DeepDives:{\"uuid\":\"b470a9c8-2e68-44f8-b79a-a0ea23322c7a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/55512415-df0e-4a52-827f-eba96a712c44/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f27cbaaf-e1a2-4a2a-be62-1090ec196e57\"}"},{"__ref":"Education:{\"uuid\":\"4c442465-f1ec-42ef-bac9-9e61ac5e5da3\"}"}],"hiredAt":"2024-08-12T12:06:46.644Z","topics":["K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Chemistry","Physics","Algebra I","Algebra II"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"abigail-obengmarnu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4daadf74-a850-43cb-842f-a4f4dd1c6e44\"}"}}},"_sentryTraceData":"565f4d7cada441279091db1f781d47d1-b99531d3cdb832b4-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=565f4d7cada441279091db1f781d47d1,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry
