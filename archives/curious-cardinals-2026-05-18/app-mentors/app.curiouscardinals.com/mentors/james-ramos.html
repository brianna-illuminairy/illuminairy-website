University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"065d7496-4eb6-4317-be07-c11af30ef365\"}":{"__typename":"Education","uuid":"065d7496-4eb6-4317-be07-c11af30ef365","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"a1491b4c-60aa-4670-8fb4-a3bfe4da6807\"}":{"__typename":"MentorPublicProfile","uuid":"a1491b4c-60aa-4670-8fb4-a3bfe4da6807","displayName":"James R.","slug":"james-ramos","biography":"\u003cp\u003eHi! My name is James, and I’m from Union City, NJ, which is a densely populated city outside of NYC! I went to Regis High School in New York City, then attended Cornell University, where I graduated magna cum laude with a major in Biological Sciences. I’m currently applying to medical schools, and hope to become a physician-scientist someday who returns to Union City to serve its predominantly Latino, immigrant, low-income residents. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, guidance from my professors, coaches, and peers was essential to my continued success as a student, athlete, and citizen. Without them, I could not have broken past the structural barriers impeding my success. I plan to continue advancing my mission to be a champion and friend for those who may find it challenging to define their passions and direction as a Curious Cardinals mentor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Cornell, I had the privilege of beginning to pass down the gifts of mentorship I have received. As a TA for three challenging upper-level biology courses, I’ve provided personalized guidance to students not only in terms of their academic success but also on their quests to navigate the pre-medical student environment. From course selection to choice of recommenders, even down to finding extracurricular and volunteer opportunities, I’ve been able to support my students with far more than their final course grade. As an informal mentor to tens of middle school, high school, and undergraduate students, I’ve been able to make a direct, meaningful impact on their abilities to gain admission to competitive programs across the U.S., and I hope further to advance this legacy of excellence as a mentor. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAside from being a mentor, my college experience has been defined by innovative research, eye-opening clinical experiences, and sensitive community service. Both at Cornell and at the Cleveland Clinic, I’ve been able to make significant contributions to glioblastoma drug development and steroid hormone research that may impact patients worldwide. As an EMT and patient support volunteer at an infusion clinic, I solidified my desire to become a physician after hands-on experiences with very emotional medical cases. By serving my local community as an advocate, volunteer, and firefighter, I pushed beyond my comfort zone to serve a cause greater than myself. I aspire to infect my students with this same zeal for serving others that I have garnered after years of pursuing a career in medicine. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbove all, however, I believe that balance is key to a gratifying life. To counterbalance the demands of my academic and professional pursuits, I’ve engaged in many hobbies and activities that have brought me serenity and satisfaction beyond service to others. I love staying active, having played three sports as a child. Currently, I am training for a marathon and find tranquility in lifting weights daily. Someday, I hope to finish an Ironman, and I hope to begin swimming and cycling soon. I also enjoy reading, especially dystopian novels and philosophical texts. I’m also a fish dad to three blue guppies! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, none of this would be possible without the support of my family and friends. My younger brother and parents have built the foundation for my growth. As the former president of my fraternity at Cornell, I continue to nurture lifelong friendships with men of strong moral character and keep many close friendships with Cornell students and neighborhood friends alike. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThank you for reading my bio, and I hope that we can work together in the future. I am confident that, no matter what stage of your life you may be in, I can provide some guidance that will serve you as you forge forward in achieving your ultimate goal, whatever it may be. As my parents always say, ¡Si se puede!\u003c/p\u003e","teachingVideoPlaybackId":"MsQWxMamphizm9ZFVe5sVBr3C42z9AnOAhL01XakLsrI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eDon't tell my little brother I'm telling you this, but in high school, he didn't care about his education. School was just a chore that got in the way of playing Minecraft. However, after months of helping him, first with identifying his career passions, and then with applying to colleges, I helped my younger brother gain admission to a Top 20 university! Now, he works in investment banking in NYC. I couldn't be prouder!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"227d3e3f-df29-4142-80af-42066bd6cb54\"}"},{"__ref":"Favorites:{\"uuid\":\"3b5f5f19-7274-4149-bee8-ebadcbb1c0a9\"}"},{"__ref":"Favorites:{\"uuid\":\"0a9f4647-9abc-4d23-a490-7cef363f78c8\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"260abca8-5921-4b79-b3fc-8413d2d41e00\"}"}],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4efb94c6-34ec-42fc-93d1-4e37e79d1afe\"}"},{"__ref":"DeepDives:{\"uuid\":\"7857b430-a144-4a8e-8c7c-135ce92d4b3e\"}"},{"__ref":"DeepDives:{\"uuid\":\"cec768ed-493c-4651-8598-7afc106e53fb\"}"},{"__ref":"DeepDives:{\"uuid\":\"17c7029c-826b-481b-8501-dcd7999462f7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2e5f9f98-7f72-40a8-b4b5-a4c72
