ool:{\"uuid\":\"223c68ec-c211-4391-ac51-11aa5144d6e7\"}":{"__typename":"School","uuid":"223c68ec-c211-4391-ac51-11aa5144d6e7","name":"Oak Grove High School","city":"Winston-Salem","type":"HIGH","state":"North Carolina","country":"United States","zip":"27107"},"Education:{\"uuid\":\"d21baf59-47ff-4676-8152-8f68fc5b272b\"}":{"__typename":"Education","uuid":"d21baf59-47ff-4676-8152-8f68fc5b272b","school":{"__ref":"School:{\"uuid\":\"223c68ec-c211-4391-ac51-11aa5144d6e7\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"f20a5219-0309-4ca6-8f6f-d7288c470877\"}":{"__typename":"Education","uuid":"f20a5219-0309-4ca6-8f6f-d7288c470877","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"History, Political Science, and Intensive Education Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"ce17a4b1-ecd4-4a6f-aa47-28f3c29f9bb9\"}":{"__typename":"MentorPublicProfile","uuid":"ce17a4b1-ecd4-4a6f-aa47-28f3c29f9bb9","displayName":"Micah D.","slug":"micah-draper","biography":"\u003cp\u003eHi everybody!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Micah Draper, and I'm a student at Yale University studying History and Political Science, with a Certificate in Intensive Education Studies. I grew up in Winston-Salem, North Carolina, and carry with me the values of hard work, humility, and community that shaped my upbringing. My dad is an automobile mechanic, and from an early age I learned the importance of showing up prepared, following through on commitments, and treating people with respect. Those lessons guide how I mentor and support students today.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I’ve been elected Class President, where I lead initiatives and events serving over 1,600 students and manage a substantial budget. I’ve also served in leadership roles within international relations organizations and helped oversee large conferences for high school students across the U.S. and abroad. These experiences have strengthened my organization, communication, and ability to connect with students from diverse backgrounds, all skills that translate directly into thoughtful, dependable mentorship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis summer, I'm interning at the United Nations in New York City! I'm also working part-time at an education non-profit. I look forward to sharing the leadership skills that I gain in these positions with my students!\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI remain closely connected to public education through my work as an intern in a New Haven K–8 school and through tutoring elementary students in reading fundamentals. I also conduct research on rural schooling and educational opportunity in North Carolina. These roles keep me grounded in the realities students face and continually sharpen my ability to support different learning styles and goals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside academics, I’m a principal French horn player in Yale’s Concert Band and a first-year outdoor orientation leader. Music and the outdoors have taught me patience, discipline, and resilience, all qualities I model for the students I work with. Whether guiding a backpacking trip or preparing for a performance, I value preparation, steady encouragement, and calm leadership.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI specialize in helping students design and execute meaningful passion projects, particularly those connected to current events, public policy, politics, and innovation. Whether a student wants to launch a civic engagement initiative, write a research paper on a pressing global issue, start a podcast, or develop an original policy proposal, I guide them through the full process, from refining their idea to conducting research, structuring arguments, and presenting their work with clarity and confidence. My academic focus in history and political science allows me to provide strong subject-matter support in American government and international relations, helping students understand not just what is happening in the world, but why. I love working with curious, motivated students who want to think critically about the institutions, debates, and global forces shaping our time, and I strive to make complex political and historical topics accessible, engaging, and intellectually empowering.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to working with you!\u003c/p\u003e","teachingVideoPlaybackId":"LZILufQTIGIq01UieikWagkg8sG1pz01yo8zM42DOG1yk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement is serving as Class President of the Class of 2028 at Yale University. Since arriving at Yale in August 2024, I've been elected by my peers twice. I love serving them!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a71adccd-c154-4177-9c77-706ceeda7233\"}"},{"__ref":"Favorites:{\"uuid\":\"9a2c3197-4772-4fa7-9c2f-5a3e3f452bac\"}"},{"__ref":"Favorites:{\"uuid\":\"49b7e739-16cd-459b-b8f0-c57776c17c68\"}"}],"causesSupported":[],"major":"History, Political Science, and Intensive Education Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"abdaf588-aa71-42c2-bc66-046a41192609\"}"},{"__ref":"DeepDives:{\"uuid\":\"07f2300d-07f6-47a0-adf6-fe0145a11a07\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/048acf03-1702-40e4-8a7f-3d5f729b0494/-/preview/-/format/jpg/","https://ucarecdn.com/e0373398-575f-4be1-8eba-5d3728ccff99/-/preview/-/f
