first meeting with Shula and her introducing you to us. It was so great to see how Aanika was engaged since the first session and she’s always been ready and looking forward to the sessions each week. Your positive energy and support has encouraged her beyond what we’ve been able to do. I also look forward to the articulate session notes each week. We are so glad to have met you and can’t wait for her to complete the book and figuring out with her on how to publish it. We have a few friends that are waiting to read and discuss the book with her. It’s great to she is willing to share her work.","date":"2025-05-29 22:50:22.334+00","rating":5,"endorser":{"__typename":"Endorser","name":"Jigna Desai","tagline":"","avatar":null}},"Testimonial:d0f547fb-47c3-4cff-b216-91101c113d04":{"__typename":"Testimonial","id":"d0f547fb-47c3-4cff-b216-91101c113d04","text":"This journey has come such a long way from my first meeting with Shula and her introducing you to us. It was so great to see how Aanika was engaged since the first session and she’s always been ready and looking forward to the sessions each week. Your positive energy and support has encouraged her beyond what we’ve been able to do. I also look forward to the articulate session notes each week. We are so glad to have met you and can’t wait for her to complete the book and figuring out with her on how to publish it. We have a few friends that are waiting to read and discuss the book with her. It’s great to she is willing to share her work.","date":"2025-05-28 05:07:53.556+00","rating":5,"endorser":{"__typename":"Endorser","name":"Jigna Desai","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"94a41222-c3b9-44d8-a99e-6145a0ae1ddc\"}":{"__typename":"MentorPublicProfile","uuid":"94a41222-c3b9-44d8-a99e-6145a0ae1ddc","displayName":"Lily S.","slug":"lily-scott-1","biography":"\u003cp\u003eLily Scott is a sophomore at Yale University, majoring in History with a concentration in Politics, Law, and Government. Originally from Saint Paul, Minnesota, Lily maintains a strong appreciation for her Midwest roots.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLily is passionate about transforming historical research into creative storytelling through essays and visual formats. Her academic focus centers on early American history, particularly political theory and constitutional ideals. She also has a deep love for ancient Greek and Roman history. Lily believes that studying history is not just about knowing facts—it's about exploring the values, struggles, and systems that have shaped humanity. She loves historical documentaries and examining archival costumes and art. In high school, Lily produced a short documentary on the history of South Korean-American relations, particularly investigating the roots of the Korean adoption system.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLily grew up as a serious ballet dancer and trained with professional dance companies in New York City, Boston, and Seattle. Her dance training instilled in her a lifelong appreciation for the performing arts, music, costume design, and choreography. This creative interest has manifested in her work with video editing, podcasts, and graphic design. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of classes at Yale, Lily is a member of Yale’s premier dance company, Yale Dancers. She is also a member of The Women’s Network (TWN), the largest collegiate women’s networking organization in North America. Through TWN, Lily has learned from female leaders across various industries, including finance, law, entertainment, and art. These women have taught Lily an abundance about career advice, leadership skills, and the importance of networking. Lily is also involved with Yale Asian-ish, a cultural group for mixed-race Asian students. As half-Korean and half-white, she has enjoyed connecting with other biracial students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLastly, Lily believes in the importance of volunteer work. In high school, she served on the Advisory Board for CAN Dance, a nonprofit providing high-quality dance training to underserved youth in Minnesota. She analyzed and collected data to boost membership and helped design the dance curriculum. At Yale, Lily continues to volunteer with the Yale Undergraduate Legal Aid Association, supporting local nonprofits focused on education, women’s equity, and immigration. Lily plans to attend law school in the future!\u003c/p\u003e","teachingVideoPlaybackId":"ZStlFiHJThKDvC6nPjCZ24tw4XGblvhMWtYW6xRNsLY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c043b850-32f2-4e29-ad91-4ff63ebb1aed\"}"},{"__ref":"DeepDives:{\"uuid\":\"b38ea7e4-fe02-4533-b360-5328e72f952c\"}"},{"__ref":"DeepDives:{\"uuid\":\"e9ba5088-fe7d-446b-984b-bfb328cf74ab\"}"},{"__ref":"DeepDives:{\"uuid\":\"01831419-3714-4be1-8bbc-aa143876c83d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3d6d7ffc-2558-4274-9df4-e45f882d14b3/-/preview/-/format/jpg/","https://ucarecdn.com/03dfb512-55d3-452a-aea4-826f44d9ad8c/-/preview/-/format/jpg/","https://ucarecdn.com/8cc7fa81-61c5-4c37-9e71-cb83ccfc4e11/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4382614e-9b64-429c-a132-3408b4670f96\"}"},{"__ref":"Education:{\"uuid\":\"9d5650d8-a23c-4449-b870-375fb45e83a4\"}"}],"hiredAt":"2024-08-30T08:08:30.562Z","topics":[],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":false,"testimonials":[{"__ref":"Testimonial:550b36b0-3963-47f7-b6b9-abf84cf5a2cb"},{"__ref":"Testimonial:56a40381-7b4c-4a7a-bf2d-e1c37b590f7c"},{"__ref":"Testimonial:d0f547fb-47c3-4cff-b216-91101c113d04"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lily-scott-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"94a41222-c3b9-44
