xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"894fdb62-f7c1-499e-8b43-af79d65a1be9\"}":{"__typename":"Favorites","uuid":"894fdb62-f7c1-499e-8b43-af79d65a1be9","photoUrl":"https://ucarecdn.com/00294869-4eb5-42b6-8c62-dec6ab3efabe/","title":"VolleyBall!","type":"SPORT"},"Favorites:{\"uuid\":\"117f4849-eebc-478c-8369-fc0b6aa7b66b\"}":{"__typename":"Favorites","uuid":"117f4849-eebc-478c-8369-fc0b6aa7b66b","photoUrl":"https://ucarecdn.com/0ae2b7a5-1a33-4371-95b8-a6d0ad75fbd6/","title":"New York, New York","type":"CITY"},"Favorites:{\"uuid\":\"e1409549-134a-4f7f-a81f-35f8a27a1bca\"}":{"__typename":"Favorites","uuid":"e1409549-134a-4f7f-a81f-35f8a27a1bca","photoUrl":"https://ucarecdn.com/d2ad62f4-fc62-4d55-bc1b-91e2667f7e3b/","title":"The Cat in the Hat","type":"MOVIE"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"86fb15a2-ef55-4a85-9690-bcb90ac8a776\"}":{"__typename":"DeepDives","uuid":"86fb15a2-ef55-4a85-9690-bcb90ac8a776","content":"\u003cp\u003eI spent my summers in high school doing summer intensives for ballet and modern dance! When I wasn't dance class, I would sign up for other performing arts camps like musical theater camp and jazz improvisation camp. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"070ce316-b248-4ca6-8e4a-615cb596b5d8\"}":{"__typename":"DeepDives","uuid":"070ce316-b248-4ca6-8e4a-615cb596b5d8","content":"\u003cp\u003eI was the high school student that signed up for way too many extracurriculars! On top of being a pre-professional dancer, I also played piano, was on the volleyball team, ran track, did school plays, and wrote poetry for our literary magazine. I was always EXHAUSTED but what kept me going was being able to spent quality time with my friends in each part of my life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"26e253ea-3cab-4c8d-9e97-87c2ae8aa4b2\"}":{"__typename":"DeepDives","uuid":"26e253ea-3cab-4c8d-9e97-87c2ae8aa4b2","content":"\u003cp\u003eMy Dream Job is working as a creative director at a big children's media company. I think what kids watch in their free time has a big impact on the type of humans they will turn out to be. I would hope to inspire future generations to be creative, contemplative, and to enjoy life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"955073a7-5da6-4376-9945-4d76302b9009\"}":{"__typename":"School","uuid":"955073a7-5da6-4376-9945-4d76302b9009","name":"Greenwich Academy","city":"Greenwich","type":"HIGH","state":"Connecticut","country":"United States","zip":"06830"},"Education:{\"uuid\":\"b81f2ce3-f4b5-4956-95ca-3fba825d8b87\"}":{"__typename":"Education","uuid":"b81f2ce3-f4b5-4956-95ca-3fba825d8b87","school":{"__ref":"School:{\"uuid\":\"955073a7-5da6-4376-9945-4d76302b9009\"}"},"startYear":"2009","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"02db351d-1b39-48f5-869f-f0fe59f45c46\"}":{"__typename":"Education","uuid":"02db351d-1b39-48f5-869f-f0fe59f45c46","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"9b3c7256-d453-4928-97ec-ecaddd1dd69c\"}":{"__typename":"MentorPublicProfile","uuid":"9b3c7256-d453-4928-97ec-ecaddd1dd69c","displayName":"Aiyanna O.","slug":"aiyanna-ojukwu","biography":"\u003cp\u003eHi! I’m Aiyanna, a fourth-year at Harvard studying Neuroscience with a minor in Art, Film, and Visual Studies, and I help students turn creative ideas into projects they’re genuinely excited to build. I love helping people move from “I have too many ideas” to “I actually made something!”\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eAbout Me:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always been deeply drawn to the arts. I was a pre-professional dancer for 14 years, which shaped the way I think about aesthetics, storytelling, discipline, and what it means to create something that makes people feel. Since then, I’ve explored creativity through a lot of different forms: I’ve completed three short films during college, served as blog editor for my school’s literary magazine, hosted a weekly radio show, interned with a documentary company, and even built my own website to showcase my work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA big part of how I approach creativity comes from having to balance a lot of different interests at once. In high school, I was school president while also staying involved in theater productions, daily dance classes, varsity sports, and academics. Long story short, I know what it feels like to care about a lot of things at once, and I also know how overwhelming it can feel when you have a strong idea but no clear place to begin.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI work especially well with students who are creative, thoughtful, and overwhelmed by where to start. I’m good at brainstorming ideas, adding structure, building accountability, and giving thoughtful feedback. I especially enjoy helping students shape projects that feel personal and exciting to them, while also making sure they have a concrete plan to follow through. My goal is for students to leave sessions feeling clearer, more confident, and more capable than when they came in.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eProjects we can do:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eSmall business creation\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFilm and media projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePortfolio building\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWriting-based projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePersonal artistic passion projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCommunity-centered creative ideas\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eOutside of class:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI like to think that I have a brain for STEM and the personality of a theater kid. When I’m not in a neuroscience lab or in class, I love arts and crafts, (especially crochet,) along with screenwriting, improv comedy, animated movies, and reruns of Everybody Hates Chris.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re creative, curious, and looking for someone who will take your ideas seriously and help you follow through, I’d love to work with you! \u0026lt;3\u003c/p\u003e","teachingVideoPlaybackId":"aLC37Aj00bZwbLNNMT4d2ZaFhyCruzhuXsmFfMgSvmYE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"894fdb62-f7c1-499e-8b43-af79d65a1be9\"}"},{"__ref":"Favorites:{\"uuid\":\"117f4849-eebc-478c-8369-fc0b6aa7b66b\"}"},{"__ref":"Favorites:{\"uuid\":\"e1409549-134a-4f7f-a81f-35f8a27a1bca\"}"}],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"86fb15a2-ef55-4a85-9690-bcb90ac8a776\"}"},{"__ref":"DeepDives:{\"uuid\":\"070ce316-b248-4ca6-8e4a-615cb596b5d8\"}"},{"__ref":"DeepDives:{\"uuid\":\"26e253ea-3cab-4c8d-9e97-87c2ae8aa4b2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ddc45fdb-178b-4313-9672-817985d80293/-/preview/-/format/jpg/","https://ucarecdn.com/2c0e2f6f-4d42-4535-a069-09198bff64ca/-/preview/-/format/jpg/","https://ucarecdn.com/e75e0cae-928b-4639-976a-52be5e2e15ff/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b81f2ce3-f4b5-4956-95ca-3fba825d8b87\"}"},{"__ref":"Education:{\"uuid\":\"02db351d-1b39-48f5-869f-f0fe59f45c46\"}"}],"hiredAt":"2026-02-11T23:48:25.109Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Biology","Writing","College Essay Writing","K-6 Storybook","Creative Writing","Film / Theater","Video / Photography","History Project","Business / Entrepreneurship","Medicine / Health","Web Design","STEM Project","Machine Learning / AI","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"aiyanna-ojukwu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9b3c7256-d453-4928-97ec-ecaddd1dd6
