ll},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"3f2b6ea1-c440-4e58-9a68-2f3972cc47a8\"}":{"__typename":"Education","uuid":"3f2b6ea1-c440-4e58-9a68-2f3972cc47a8","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Biology","degree":null},"Testimonial:c2db5b69-6559-41b8-9a08-43cbdb449e0a":{"__typename":"Testimonial","id":"c2db5b69-6559-41b8-9a08-43cbdb449e0a","text":"We were looking for someone who could truly understand our child’s needs and guide them with patience. Alyssa has been amazing. The way she explain concepts and clear doubts makes learning so much easier. My child has gained a lot of confidence and now actually looks forward to her classes. Finding such a dedicated tutor who genuinely cares about the student’s progress is rare. We are so grateful!","date":"2025-08-24 08:49:41.564+00","rating":5,"endorser":{"__typename":"Endorser","name":"Sonal jain","tagline":"","avatar":null}},"Testimonial:01d586e1-9537-4588-8d6d-fe1c6adcde43":{"__typename":"Testimonial","id":"01d586e1-9537-4588-8d6d-fe1c6adcde43","text":"It was really great for Kieran to have such a wonderful resource for all the inevitable questions that came up in tacking a high intensity Biology class!  Thank you.","date":"2025-06-11 19:31:06.286+00","rating":5,"endorser":{"__typename":"Endorser","name":"Jeet Sohal","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"631e769b-d4f6-4ba0-ae5f-52abca89b3cb\"}":{"__typename":"MentorPublicProfile","uuid":"631e769b-d4f6-4ba0-ae5f-52abca89b3cb","displayName":"Alyssa A.","slug":"alyssa-agarwal","biography":"\u003cp\u003eHi! I’m Alyssa, a scientist, artist, volleyball player, and lover of the outdoors. I grew up in sunny San Diego, where I spent much of my childhood exploring tide pools, hiking through the mountains, and asking endless questions about how the world works. While I loved science, I quickly realized that traditional textbooks weren’t always the best way to learn. I found that I learned best through visuals, storytelling, and hands-on activities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat realization led me to attend an arts-focused high school, where I spent over 15 hours a week in the studio painting. But my love for science never faded. I found a way to combine the two by writing and illustrating a book that helps middle schoolers learn science through comics and creative visuals. I wanted to show students that science isn’t just about memorizing facts, it’s about exploration, discovery, and creativity.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow, I’m a Master’s student in Public Health at Yale, where I also earned my undergraduate degree in Biology. I specialize in infectious diseases and global health, studying everything from how diseases spread to the best ways to communicate health information across different cultures. Just this past summer, I worked with a malaria research team in Senegal, where I designed infographics to communicate our research goals in areas where language barriers made traditional communication difficult. It reinforced my belief in the power of creative, engaging education.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I play volleyball and love hiking.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, my goal is to make learning interactive, engaging, and tailored to each student’s strengths. I know that everyone learns differently. No matter what your learning style is, I promise that our sessions will never feel like a boring lecture. We’ll tackle concepts together in a way that makes sense for you.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI
