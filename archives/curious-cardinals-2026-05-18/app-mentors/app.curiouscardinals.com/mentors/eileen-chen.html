their \"comfort show\"\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ddeeb74e-a286-421b-bd52-e6f9eada9d20\"}":{"__typename":"DeepDives","uuid":"ddeeb74e-a286-421b-bd52-e6f9eada9d20","content":"\u003cp\u003eI chose RTVF because it bridges my two passions: film and storytelling. It's such a vast field; there's so much to learn!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3e844b23-a5c5-46c8-b6a7-67ebed250a9d\"}":{"__typename":"DeepDives","uuid":"3e844b23-a5c5-46c8-b6a7-67ebed250a9d","content":"\u003cp\u003ePassing on my learning process and passion for the subjects I love is something that fulfills me since I began tutoring in high school. Excelling not only in my own regard but together is what brings me joy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"a8c09203-c169-49a8-94e8-ea0bfdc0494f\"}":{"__typename":"School","uuid":"a8c09203-c169-49a8-94e8-ea0bfdc0494f","name":"Foothill High School","city":"Santa Ana","type":"HIGH","state":"California","country":"United States","zip":"92705"},"Education:{\"uuid\":\"10819589-d2a0-45ed-8556-3794e3aa9521\"}":{"__typename":"Education","uuid":"10819589-d2a0-45ed-8556-3794e3aa9521","school":{"__ref":"School:{\"uuid\":\"a8c09203-c169-49a8-94e8-ea0bfdc0494f\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"52eb7140-8595-4ad1-a2ba-f85f955c0ade\"}":{"__typename":"Education","uuid":"52eb7140-8595-4ad1-a2ba-f85f955c0ade","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Radio/TV/Film","degree":null},"MentorPublicProfile:{\"uuid\":\"8eafeece-6f84-48c5-a0dd-1d4690f922ad\"}":{"__typename":"MentorPublicProfile","uuid":"8eafeece-6f84-48c5-a0dd-1d4690f922ad","displayName":"Eileen C.","slug":"eileen-chen","biography":"\u003cp\u003eHi! I'm Eileen and to really sum it up, I just love creation. I began with storytelling because I loved reading as a kid and I would make up stories to fall asleep. I put good use to my ideas through writing, which led me through magical worlds full of imagination. I've learned how to channel storytelling through so many different mediums; I don't think I can even count them all on one hand! Stories are in ads you see in your favorite shows to the movies you see on the big screen. It's even in clothes!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've also been interested in psychology since I was in middle school, learning about how our brains works and how we think before ever taking a class at school. This love has led to take on a minor in psychology in college.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEntering college, I've found a new love for event planning as I dived into my sorority, taking on new leadership positions in my new community. One of my favorites is planning for is our philanthropic events. Managing whole events to raise money for good causes like PCAA and Enchanted Backpack gives me great experiences leading my whole chapter!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn my days off, I love finding new unique activities to do with my friends like pottery painting, pop-up events, and trying new restaurants!\u003c/p\u003e","teachingVideoPlaybackId":"Melvn4Q6mXL01mhM4D1SMSXzPhP9gZpyAqvLwzp1AreU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI've won two national Gold Medals from Scholastics Young Artists and Writers Alliances, but I'm even more proud of overcoming my weakness in drawing by making my book, \"Paper Magic\", and learning a bunch of new useful skills I still use.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f3395dce-d557-4202-9132-3eeb47612137\"}"},{"__ref":"Favorites:{\"uuid\":\"943fd17e-5fab-491a-afbe-a53169f71ccc\"}"},{"__ref":"Favorites:{\"uuid\":\"2e89f1ed-4b99-4167-80a8-0f7b4470c95c\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0149d002-9f6d-4a56-a4b7-c6d3fe7130c0\"}"},{"__ref":"CausesSupported:{\"uuid\":\"ddda41b0-49ec-4cd3-8d82-12d405eca84a\"}"}],"major":"Radio/TV/Film","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"244e87ef-c4d8-483e-b2c8-32327c81fab3\"}"},{"__ref":"DeepDives:{\"uuid\":\"ddeeb74e-a286-421b-bd52-e6f9eada9d20\"}"},{"__ref":"DeepDives:{\"uuid\":\"3e844b23-a5c5-46c8-b6a7-67ebed250a9d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d170dc90-7459-49ac-918a-0b1c5eae5433/-/preview/-/format/jpg/","https://ucarecdn.com/e97b246b-477b-472c-8e84-109528cf5b3b/-/preview/-/format/jpg/","https://ucarecdn.com/f25977e0-c28b-4879-8f35-1a6b75692fac/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"10819589-d2a0-45ed-8556-3794e3aa9521\"}"},{"__ref":"Education:{\"uuid\":\"52eb7140-8595-4ad1-a2ba-f85f955c0ade\"}"}],"hiredAt":"2024-04-15T18:42:16.760Z","topics":["Public Speaking","Business / Entrepreneurship","Music","Visual Arts / Graphic Design","Film / Theater","Fashion / Cosmetics","Video / Photography","Mandarin Chinese","Writing"],"communityBadges
