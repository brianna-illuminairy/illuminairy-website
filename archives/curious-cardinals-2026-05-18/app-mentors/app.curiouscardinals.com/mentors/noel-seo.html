xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"19a8fb1d-5e9b-449e-bee1-2832674c28fc\"}":{"__typename":"Favorites","uuid":"19a8fb1d-5e9b-449e-bee1-2832674c28fc","photoUrl":"https://ucarecdn.com/17e4d4cd-8eca-4087-87f1-7ea881af452f/","title":"Eternal Sunshine of the Spotless Mind","type":"MOVIE"},"Favorites:{\"uuid\":\"6d91d651-3697-4488-8788-cd1ec48e1a53\"}":{"__typename":"Favorites","uuid":"6d91d651-3697-4488-8788-cd1ec48e1a53","photoUrl":"https://ucarecdn.com/fba4124e-dd9a-4691-aebf-91853faf9f72/","title":"Les Miserables","type":"PLAY"},"Favorites:{\"uuid\":\"bebb14a8-4064-4691-9892-66df0f832cf3\"}":{"__typename":"Favorites","uuid":"bebb14a8-4064-4691-9892-66df0f832cf3","photoUrl":"https://ucarecdn.com/c5077374-8c9d-472c-93fb-3f5820e8de00/","title":"The Marías","type":"ARTIST"},"CausesSupported:{\"uuid\":\"ccdbc6d7-71ad-45a7-8f4e-7eece496a5b2\"}":{"__typename":"CausesSupported","uuid":"ccdbc6d7-71ad-45a7-8f4e-7eece496a5b2","name":"Anti-trafficking","description":"\u003cp\u003ePassionate about ending exploitation with survivors, policy, and advocacy.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/4ab44580-5603-4aa1-8a0f-82c236de49a4/"},"CausesSupported:{\"uuid\":\"c78add07-dd7a-4731-a485-3200b9e71665\"}":{"__typename":"CausesSupported","uuid":"c78add07-dd7a-4731-a485-3200b9e71665","name":"Labor rights","description":"\u003cp\u003eDriven to establish fair wages, safe work, and dignity for all workers.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/35600c1d-47c9-487d-88a0-1fde5c0b25ec/"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"15280068-60b9-41e0-91ed-3366fa24ac2b\"}":{"__typename":"DeepDives","uuid":"15280068-60b9-41e0-91ed-3366fa24ac2b","content":"\u003cp\u003eOf all the things I could be doing, I choose mentorship because I believe it’s one of the most meaningful and transformative things we can offer, both to others and to ourselves. At its heart, mentorship is about shared growth: learning from one another, offering guidance, and lifting each other up. No matter how busy or accomplished we become, the chance to pass on what we’ve learned and gain new insights from others is invaluable.\u003c/p\u003e\u003cp\u003eFor me, mentorship isn’t a side pursuit—it’s a deeply personal commitment. I’ve been incredibly fortunate to learn from mentors at every stage of my journey, from high school teachers to professors, supervisors, and peers. Their support, constructive criticism, and belief in me have immensely shaped who I am. Now, being able to offer that same kind of presence to someone else— to help them feel seen, supported, and confident in who they are— feels like the most meaningful way I can give back.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"0c6bb58e-dd85-496a-9148-209580002f8c\"}":{"__typename":"DeepDives","uuid":"0c6bb58e-dd85-496a-9148-209580002f8c","content":"\u003cp\u003eIn high school, my summers were devoted to exploring the humanities in ways that profoundly shaped my worldview. One of the most eye-opening and fulfilling experiences was attending the Yale Young Global Scholars program in Literature, Culture, and Philosophy. It was my first time studying the humanities, but my roommates and I would stay up late in the dorms debating everything from the ethics of the trolley problem to the true definition of love. Though we came from different corners of the world, we shared a deep curiosity and a passion for engaging with life's most difficult questions. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese conversations continued the following summer when I took the course on \"Revolutions\" at the Stanford Summer Humanities Institute. Even though the program was virtual due to the pandemic, I was energized by meeting students from around the globe who shared my enthusiasm for philosophy, history, and ethics. The course gave me a taste of what it was like to be in a college environment surrounded by people who care deeply about these philosophical ideas. Together, we examined historical revolutions like the French and Marxist revolutions, comparing their approaches to solving inequality and discussing how their successes and failures could inform modern struggles for justice. Our conversations linked these movements to contemporary issues like the George Floyd protests and the Black Lives Matter movement, exploring how today's fight for racial justice mirrors past revolutions and how we should apply the lessons we've learned to them. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBoth experiences left me more confident in my ability to engage with complex, sometimes controversial ideas, challenge my assumptions, and think critically about how change happens—both in society and within ourselves. They also sparked my ongoing interest in issues of morality and applied ethics, which I continue exploring today!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0af78d89-e418-4888-a3ec-c24ccb15a243\"}":{"__typename":"DeepDives","uuid":"0af78d89-e418-4888-a3ec-c24ccb15a243","content":"\u003cp\u003eIn my spare time, journaling is my go-to way to process everything on my mind. It's my little escape to step back from life's chaos and reflect on what's really going on—what excites me, what challenges me, or what's just been on my mind. It's my space to pause, breathe, and reclaim my voice amid everything else going on. From middle school to college, journaling has been my constant companion, helping me work through doubts, celebrate growth, and figure things out as I go. I love writing in cozy coffee shops, where the background chatter and the smell of coffee make the perfect environment for reflection. Looking back at old entries about stressing about college apps or even painful breakups makes me realize how much I've learned and grown over the years. In this way, journaling has been a way to track my progress and make sense of life's ups and downs. My entries take many forms. From jotting down an insightful quote to scribbling a venting session or simply writing what's on my heart, the key is showing up for myself, even if only for a few minutes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"66f4685d-642c-4b7e-81a3-27f53706438a\"}":{"__typename":"DeepDives","uuid":"66f4685d-642c-4b7e-81a3-27f53706438a","content":"\u003cp\u003eMy dream job combines two passions: making tangible legal change and inspiring the next generation of advocates and thinkers. I envision a career where I can run a pro-bono legal clinic that supports human trafficking survivors' reintegration into society and teach at law schools, offering courses on public interest law and corporate social responsibility. In the clinic, my goal would be to remove the structural barriers that make it hard for survivors to move forward in their lives. I want to help them clear their non-violent offenses (like prostitution) from their criminal records when possible, push for laws that increase funding for NGOs that provide critical survivor services, and strengthen protections for workers in industries like strip clubs. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the classroom, I would encourage students to explore public service and the ethics behind their career choices. Through my teaching, I want to challenge students to recognize how crucial ethics, justice, and service are for their personal growth and society as a whole. I want them to think critically, engage with the moral complexities of the world, and use their talents to make a meaningful impact. We don't need fewer engineers or data scientists—we need engineers who understand ethics, data scientists who value justice, and business leaders who prioritize dignity!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"10817f95-26f1-45a1-82f5-284c99accb7f\"}":{"__typename":"School","uuid":"10817f95-26f1-45a1-82f5-284c99accb7f","name":"Campolindo High School","city":"Moraga","type":"HIGH","state":"California","country":"United States","zip":"94556"},"Education:{\"uuid\":\"0312d44a-443b-46f5-9ec8-fff30f331b55\"}":{"__typename":"Education","uuid":"0312d44a-443b-46f5-9ec8-fff30f331b55","school":{"__ref":"School:{\"uuid\":\"10817f95-26f1-45a1-82f5-284c99accb7f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"0f1664b7-474b-494c-8012-0cccdacd447f\"}":{"__typename":"Education","uuid":"0f1664b7-474b-494c-8012-0cccdacd447f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"e62e386d-3c90-40fb-9b2c-f0de875dfc59\"}":{"__typename":"MentorPublicProfile","uuid":"e62e386d-3c90-40fb-9b2c-f0de875dfc59","displayName":"Noel S.","slug":"noel-seo","biography":"\u003cp\u003eHi! My name is Noel Seo, and I’m a soon-to-be graduate of Stanford University, majoring in Sociology and minoring in Human Rights and Ethics in Society. This fall, I’ll be at UC Berkeley Law to pursue a career in Public Interest and Human Rights Law, focusing on combating human trafficking and systemic injustices in the workplace. I am committed to protecting individuals from all forms of exploitation and abuse, from labor trafficking to employment discrimination, and advancing fair, equitable conditions for marginalized communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my time in college, I’ve worked at the intersection of law, advocacy, and accessibility. I clerked for federal administrative law judges at the National Labor Relations Board (NLRB), where I helped draft legal decisions and memoranda in high-impact cases involving corporations like Starbucks and Kaiser Permanente. I’ve also been deeply engaged in anti-trafficking efforts as a Policy Fellow with 3Strands Global Foundation, a California-based nonprofit, and with the National Center on Sexual Exploitation. Through these roles, I’ve testified at the California State Capitol, organized national advocacy summits, and developed policy recommendations for CEOs, stakeholders, and lawmakers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my work in law and policy, I’m equally passionate about creativity, community service, and personal growth. At Stanford, I direct and sing with \u003cem\u003eTestimony A Cappella\u003c/em\u003e, a Christian a cappella group that performs regularly at elderly homes and homeless shelters, has recorded and released music (check us out on Spotify and Youtube!), and recently hosted a national a cappella conference with groups from across the country! I also teach a service-learning course on anti-trafficking, where I guide students in partnering with local NGOs to work on creative projects that support survivors and at-risk communities. Earlier in high school, I was a four-year varsity tennis player, coached children with special needs, and founded a nonprofit that donated tennis rackets to underserved youth. I also interned at my local space and science museum, where I led hands-on science and astronomy workshops for kids.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough my own journey, I’ve learned how to navigate the public service space, build lasting relationships with mentors who inspire growth, and create meaningful opportunities that align with my passions—whether through internships, research, or leadership roles. I’d love to support you in doing the same—let’s work together to turn your ideas into something real and impactful!\u003c/p\u003e","teachingVideoPlaybackId":"qWbQ7yXNQHnFUnkaJdVI1gJcUBd00pR00zeSb45Kd02mqQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne accomplishment is testifying at the California State Capitol for Assemblymember Josh Hoover’s bill, AB 1375. This important bill urges courts to consider whether a child or parent has been a victim of trafficking, or whether a parent is a trafficker, when making child custody decisions. I was honored to speak on behalf of trafficking survivors through my continued work with 3Strands Global Foundation, a CA-based anti-trafficking organization I’ve been deeply involved with during my time in college!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"19a8fb1d-5e9b-449e-bee1-2832674c28fc\"}"},{"__ref":"Favorites:{\"uuid\":\"6d91d651-3697-4488-8788-cd1ec48e1a53\"}"},{"__ref":"Favorites:{\"uuid\":\"bebb14a8-4064-4691-9892-66df0f832cf3\"}"}],"causesSupported":[{"__re
