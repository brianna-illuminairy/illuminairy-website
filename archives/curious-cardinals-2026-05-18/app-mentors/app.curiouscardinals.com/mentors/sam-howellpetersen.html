tion:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"84c09cf1-ee56-4643-813c-2f883863aa4f\"}":{"__typename":"DeepDives","uuid":"84c09cf1-ee56-4643-813c-2f883863aa4f","content":null,"videoPlaybackId":"4yvYucoZAZLg6uoij4BZ7bAfzVDBHfqHEyiEjELpzPg","question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"56b8cecf-9d70-4109-8fc1-56f1b67f6736\"}":{"__typename":"DeepDives","uuid":"56b8cecf-9d70-4109-8fc1-56f1b67f6736","content":null,"videoPlaybackId":"Z5qfS2idtZT7kjRWtaYsf8lyDE00x9dOZcvz4nUPnNro","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"9e5e7c54-8efa-46e9-801a-edd2e6d9bb87\"}":{"__typename":"School","uuid":"9e5e7c54-8efa-46e9-801a-edd2e6d9bb87","name":"Park City High School","city":"Park City","type":"HIGH","state":"Utah","country":"United States","zip":"84060"},"Education:{\"uuid\":\"61237a6b-143c-4031-8835-378eb1680b1e\"}":{"__typename":"Education","uuid":"61237a6b-143c-4031-8835-378eb1680b1e","school":{"__ref":"School:{\"uuid\":\"9e5e7c54-8efa-46e9-801a-edd2e6d9bb87\"}"},"startYear":"2016","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"846a1a21-e2e1-4eab-aa52-51c4a6217dee\"}":{"__typename":"Education","uuid":"846a1a21-e2e1-4eab-aa52-51c4a6217dee","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Theater and Performance Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"b7e66324-d1d3-42b7-a6c6-8cbfc17de3f8\"}":{"__typename":"MentorPublicProfile","uuid":"b7e66324-d1d3-42b7-a6c6-8cbfc17de3f8","displayName":"Sam H.","slug":"sam-howellpetersen","biography":"\u003cp\u003eHello! My name is Sam Howell Petersen (they/them). I’m a queer artist, writer, and food-enthusiast. I graduated from Stanford University with a degree in Theater and Performance Studies and a minor in Music. In addition to the arts, one of my top passions is language-learning—in high school I studied abroad in Salta, Argentina, and in college I studied abroad in Barcelona, Spain, and Kyoto, Japan. I’m originally from Park City, Utah, where I developed a deep love for nature and the outdoors. I’m stoked to teach anything from Spanish and writing to songwriting and performance creation. I want to help you learn and achieve what \u003cem\u003eyou\u003c/em\u003e are excited about!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a theatrical director, I know what it takes to see large-scale projects through from start to finish, and the importance of breaking down big ideas into small, doable steps. I love the marriage of creativity and project-planning, and would be excited to work with you to turn something that feels daunting into a manageable and fun exploration. I am a songwriter and have experience in playwriting and theatrical devising (i.e. coming up with plays from nothing), and have performed an original work at the Edinburgh Fringe Festival (the largest arts festival in the world!). I have also directed an original work on Stanford’s campus about computer science and the future of tech, and directed and performed in a complex experimental musical for which I learned to play the accordion.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love to read, play music, and spend time outside with friends. Some of my most awesome experiences have been hiking big mountains, but a night in with tea, friends, and laughter cannot be underestimated. I love sharing humor with those in my life and building relationships through shared passions and projects. Some of my closest friends have been made through collaboration on artistic endeavors, and I value nothing more than creating in community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want to help you find what \u003cem\u003eyou \u003c/em\u003eare stoked on. Learning is incredibly fulfilling when we are driven towards the topic or project. I want to help you find that passion and run with you to the finish line and beyond.\u003c/p\u003e","teachingVideoPlaybackId":"afHq800Ichuu7DteXu3MEM11pNcJO6T81osjnz7JnHDc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m most proud of the communities I was able to help create through the theatrical projects I directed. It was truly fulfilling to bring together a group of people and facilitate the creation of art in community, and all the more more wonderful to see that community flourish even after the projects were over.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also taught myself how to roller skate and I’m pretty proud of that too :)\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f2e10d5d-c0e5-4526-a2db-ad3765bfc06c\"}"},{"__ref":"Favorites:{\"uuid\":\"4086b03f-5175-4adc-95ef-cd1a0460ecda\"}"},{"__ref":"Favorites:{\"uuid\":\"887217f0-552b-40ba-a0ee-f6b13210b892\"}"}],"causesSupported":[],"major":"Theater and Performance Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f1ef9429-b95d-4598-875f-8173cfce885f\"}"},{"__ref":"DeepDives:{\"uuid\":\"7c3b7277-36f1-469d-8d1e-c0732e8bc38b\"}"},{"__ref":"DeepDives:{\"uuid\":\"84c09cf1-ee56-4643-813c-2f883863aa4f\"}"},{"__ref":"DeepDives:{\"uuid\":\"56b8cecf-9d70-4109-8fc1-56f1b67f6736\"}"}],"active":true,"profilePhotos"
