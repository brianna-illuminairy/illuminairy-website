xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"761a69b9-839d-456c-a18d-581fb9b425c2\"}":{"__typename":"DeepDives","uuid":"761a69b9-839d-456c-a18d-581fb9b425c2","content":"\u003cp\u003eMentorship matters to me because everyone has different life experiences which can provide new perspectives and ways to think. Whether you are the mentor or the mentee, odds are both members have slightly different habits or go-to methods for understanding concepts. This is why mentorship is so effective — the mentee is able to share their initial thought process, which can teach the mentor a new outlook they hadn’t previously thought of, and the mentor is able to teach the way they were taught and/or the way they interpreted what they were taught to more easily conceptualize the task at hand.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a67912f1-855b-4fa5-8881-0fa0e09fc5cd\"}":{"__typename":"DeepDives","uuid":"a67912f1-855b-4fa5-8881-0fa0e09fc5cd","content":"\u003cp\u003eMy greatest source of motivation lies in my pursuit of becoming a doctor. My desire to achieve this goal has become the driving force behind my actions, and has shaped many of my academic decisions at Penn. Striving to become a doctor extends beyond just personal success. I hope to make a difference in peoples’ lives, and offer my eventual ability to heal and provide relief to those who may be suffering. Growing up many adults have mentioned to me that there is a lack of child psychiatrists in our world. Having many friends and family members who live with anxiety/depression/OCD/and other challenges, I want to have the ability to directly help, which is only really possible if I become a doctor.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHaving a concrete goal serves as a powerful tool to provide direction and purpose to things that may appear challenging, and the obstacles that I must overcome along the way instill confidence within my abilities as well as perseverance. Being a student on the pre-med track means committing to taking two semesters of organic chemistry and physics, both of which have been framed to be extremely difficult. However, my motivation has created such determination that I am proud (and a little embarrassed…) to say that organic chemistry is not terrible! Maybe I was lucky with my professors, or maybe it was simply my motivation that gave me the push necessary to succeed.\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"35cc114e-47a2-4f00-9744-a5b2e915ecbc\"}":{"__typename":"DeepDives","uuid":"35cc114e-47a2-4f00-9744-a5b2e915ecbc","content":"\u003cp\u003eMy greatest mentor is my older sister who actually graduated Penn this year in 2023. We went to the same lower, middle, and high school, and I was so lucky to be able to have two years of college with her as well. I admire my sister’s accomplishments and relationships she has made despite being in college during a pandemic. Although our career interests and lifestyle habits are different, it is precisely because of them that I have learned so much from her. It is the contrast in our goals that offers me valuable insights and perspectives that I would not have otherwise. Growing up, we would fight like sisters do, about taking each other’s clothes or whose turn it is to feed our dogs, and I bet I would not be writing this if the year was 2013. However, growing up together she has taught me how to compromise, how to be compassionate, how to navigate through college life and the balance of academics and socializing, how to deal with issues that may arise with friends or in a class, and so much more. I really do owe it to her, because like most little sisters do, I am a copier, and I am extremely lucky to have copied her values and sense of motivation. And to the things that I did not copy, I owe that to her as well. She, unknowingly or not, exposed me to so many types of people, topics to study, places to travel to, and I am able to formulate my own path because of that. She encourages me to reach my highest potential, even if it means taking the more difficult path, and I am so so grateful to have a built-in best friend.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e9b6f259-135a-45fa-b037-f03cafe4bd12\"}":{"__typename":"DeepDives","uuid":"e9b6f259-135a-45fa-b037-f03cafe4bd12","content":"\u003cp\u003eNowadays it seems imperative that students “do something for college” during their summers. Truth be told, I had this mindset as well, but I also made sure to balance my summer with fun. My mentality was to feel fulfilled and genuinely interested by what I was doing, rather than dreading what I signed up for.\u003cbr\u003e\u003cbr\u003eThe summers after my freshman and sophomore years I went to overnight camp as a camper and then a counselor assistant. After my junior year (Covid summer), I worked in a remote lab at Penn that focused on SARS-CoV-2 and the production of a vaccine. Since I was a high school student, this was more of a learning opportunity than anything else, and I had a lot of guidance from the lab manager and other research assistants. I was a dog walker as well. After my senior year I worked as a lifeguard and travelled.\u003cbr\u003e\u003cbr\u003eFinding balance that works for you is extremely important. Personally, I enjoyed structuring my summer in a way that I was not constantly moving. I made sure to have free time to see friends and live more in the moment, while also feeling productive and accomplished.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"16a9551d-6330-4d29-80ba-d3df9e8d38db\"}":{"__typename":"School","uuid":"16a9551d-6330-4d29-80ba-d3df9e8d38db","name":"William Penn Charter School","city":"Philadelphia","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19144"},"Education:{\"uuid\":\"55687c06-d006-427f-acf4-7f687bfaa780\"}":{"__typename":"Education","uuid":"55687c06-d006-427f-acf4-7f687bfaa780","school":{"__ref":"School:{\"uuid\":\"16a9551d-6330-4d29-80ba-d3df9e8d38db\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"abc18d5d-bf15-42de-bc9e-ec596a6b06b3\"}":{"__typename":"Education","uuid":"abc18d5d-bf15-42de-bc9e-ec596a6b06b3","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"d06b9bae-4073-4339-9585-a83f6479030c\"}":{"__typename":"MentorPublicProfile","uuid":"d06b9bae-4073-4339-9585-a83f6479030c","displayName":"Olivia S.","slug":"olivia-schwartz","biography":"\u003cp\u003eHi! My name is Olivia and I am so excited to be your mentor! In middle school, high school, and now college, I have always sought out mentors who could help me understand or re-explain a concept I was struggling with. Whether that mentor was my teacher or an outside-of-school tutor, I have learned how to effectively ask questions to strengthen my knowledge about a subject, and how to ask for a new way of thinking about a concept if the first method was not clicking for me. I will definitely relay that experience to you as a mentor. \u003cbr\u003e\u003cbr\u003eIn high school and college, I helped students with math concepts such as Algebra and Trigonometry, and I was a science peer tutor for biology and chemistry. I was also a writing center peer tutor, so I am able to help with essay writing and tips! In college, I am a peer advisor for incoming freshman, so I have a sense of what it feels like to enter a new learning environment, whether that is changing grades in elementary, middle, or high school, or going to college. I can assure you that with time, these changes feel a lot less scary, and can be really fun :)\u003cbr\u003e\u003cbr\u003eI study Neuroscience at the University of Pennsylvania and hope to become a child psychiatrist one day. I have always felt passionately about helping children who may struggle with their mental health, and in the future, I would love to be involved not only psychologically, but medically as well. I am currently being trained to become an EMT, and I have really enjoyed and appreciated the mentors I have gained along the way. Building connections with people who have varying life experiences from you is an amazing way to learn new things.\u003cbr\u003e\u003cbr\u003eAside from academics, I love to run! I also love being outside, and going for hikes with my two dogs! I love to cook and ski, and a goal of mine is to go skydiving! \u003cbr\u003e\u003cbr\u003eI am so excited to meet you, and please do not hesitate to reach out with questions!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"yXLWKVTp006jKxMSvkUoBwWbL601H3kC00ogpLGa7SYD9E","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"761a69b9-839d-456c-a18d-581fb9b425c2\"}"},{"__ref":"DeepDives:{\"uuid\":\"a67912f1-855b-4fa5-8881-0fa0e09fc5cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"35cc114e-47a2-4f00-9744-a5b2e915ecbc\"}"},{"__ref":"DeepDives:{\"uuid\":\"e9b6f259-135a-45fa-b037-f03cafe4bd12\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b02e9588-d39f-4922-9850-3406c2bbe7a6/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"55687c06-d006-427f-acf4-7f687bfaa780\"}"},{"__ref":"Education:{\"uuid\":\"abc18d5d-bf15-42de-bc9e-ec596a6b06b3\"}"}],"hiredAt":"2023-07-17T17:51:17.799Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Reading"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"olivia-schwartz\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d06b9bae-4073-4339-9585-a83f6479030c\"}"}}},"_sentryTraceData":"6091b329e8ee494292e716e1a81abdb2-b211976c21727cec-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=6091b329e8ee494292e716e1a81abdb2,sentry-sample_rate=0.2,sentry-transactio
