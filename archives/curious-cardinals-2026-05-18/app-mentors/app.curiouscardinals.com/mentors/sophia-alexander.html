eventually go through the 12 years of schooling and practice as an OB/GYN!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b07a322d-b161-43d9-b5ee-687c837276cc\"}":{"__typename":"DeepDives","uuid":"b07a322d-b161-43d9-b5ee-687c837276cc","content":"\u003cp\u003eI choose my major of Human Biology to create a fluid motion towards medical school, providing me flexibility but also a linear path! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"686b83d9-c3ea-4dd9-982f-a0b8ed49ee20\"}":{"__typename":"DeepDives","uuid":"686b83d9-c3ea-4dd9-982f-a0b8ed49ee20","content":"\u003cp\u003eMy summers were purpose-driven...\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eSummer 2022: \u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAttending UCLA Summer Medical Scholars, involved in Harvard Pre-Med Scholars I, thrifting and donating clothes with my sisters, long sunburnt beach days. \u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eSummer 2023: \u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAttending Yale Young Global Scholars Program, participation in Harvard Pre-Med Scholars II, watching over my nana, and coastal drives around California.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eSummer 2024:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eDog sitting, roadtripping, practicing tennis, soaking in Croatian sunsets, listening to R\u0026amp;B music, and publishing my research.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eAll my summers\u003c/strong\u003e included Crete Academy camp counseling, babysitting neighborhood kids, and my Modern Women's Care internship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"dca8a772-ce76-4bf9-a4e0-65cb7738ef6d\"}":{"__typename":"School","uuid":"dca8a772-ce76-4bf9-a4e0-65cb7738ef6d","name":"Da Vinci Communications High School","city":"El Segundo","type":"HIGH","state":"California","country":"United States","zip":"90245"},"Education:{\"uuid\":\"5b5f4693-7950-4996-ab84-d02bbe510f37\"}":{"__typename":"Education","uuid":"5b5f4693-7950-4996-ab84-d02bbe510f37","school":{"__ref":"School:{\"uuid\":\"dca8a772-ce76-4bf9-a4e0-65cb7738ef6d\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"b85bcc57-68bc-4422-a4b8-e4ba31a9c5b7\"}":{"__typename":"Education","uuid":"b85bcc57-68bc-4422-a4b8-e4ba31a9c5b7","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"2136b304-e34c-4c52-bf85-9e3cba8fdb36\"}":{"__typename":"MentorPublicProfile","uuid":"2136b304-e34c-4c52-bf85-9e3cba8fdb36","displayName":"sophia a.","slug":"sophia-alexander","biography":"\u003cp\u003e\u003cstrong\u003eHi! I’m Sophia Alexander,\u003c/strong\u003e a current freshman at Stanford University, an ambitious leader, and a Curious Cardinal mentor. Currently I am a published research author and aspiring physician driven by a passion for women’s health, equity, and youth empowerment. My interests are\u0026nbsp; medicine, advocacy, leadership, and community service. I'm constantly motivated by creating spaces of belonging where all communities feel empowered, seen, and informed.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eWHO AM I?\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eFrom an early age, I’ve been drawn to science as well as service, but it was through hands-on experiences that those interests truly flourished. My ongoing internship with \u003cstrong\u003eModern Women’s Care\u003c/strong\u003e amplified my love for the physician field by way of women’s health and self empowerment. Over 150 hours, I assisted physicians, interacted with over 45 patients, and gained incomparable insight into anatomy, patient care, and the sacred doctor–patient connection. Most importantly, I witnessed how education and compassion intersect within the OB/GYN profession by way of patient support and in turn women empowerment.\u003c/p\u003e\u003cp\u003eBeyond clinical exposure, I’ve pursued \u003cstrong\u003eresearch and activism\u003c/strong\u003e as a lead author on an internationally published paper analyzing and critiquing Black patient care. I zeroed in on maternal healthcare inequities. Working alongside physicians of color, I analyzed systemic disparities and helped recognize voices too often overlooked in medicine. This experience earned me an invitation to speak on the \u003cem\u003eKevinMD\u003c/em\u003e podcast as one of its youngest guests.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eLEADERSHIP \u0026amp; SERVICE\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eLeadership has always been central to who I am. As \u003cstrong\u003ePresident of Jack and Jill of America: South Los Angeles Chapter\u003c/strong\u003e, I lead a group driven to excel through servitude and scholarship.\u0026nbsp; Black excellence was seen in initiatives raising $7,000 for Children’s Hospital and the completion of all 16 leadership pillars. I also founded \u003cstrong\u003eSaving Our World Organization\u003c/strong\u003e, creating service opportunities for over 1,000 youth across Los Angeles through partnerships, fundraisers, and outreach events. One of my favorite organizations that I was a part of.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAthletically, I’ve grown as a leader through discipline excelling in \u003cstrong\u003evarsity cross country and track\u003c/strong\u003e, breaking my school’s 800m record.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eBEYOND…\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI’ve expanded my global perspective through \u003cstrong\u003eYale Young Global Scholars\u003c/strong\u003e, competed nationally through \u003cstrong\u003eDECA\u003c/strong\u003e, and volunteered extensively with organizations like \u003cstrong\u003ePeace4Kids, Crete Academy, National Honors Society, and Luv Michael\u003c/strong\u003e, supporting foster youth’s academic journey, underserved students through clothing drives, and neurodivergent communities by fundraising.\u003c/p\u003e\u003cp\u003eIf there’s one thing that defines me, it’s this: I lead with empathy, act with purpose, and strive to make every space I enter more equitable than I found it.\u003c/p\u003e","teachingVideoPlaybackId":"tDttYrHfZcxrsBq1CizLo00yA7FSQlR00jBGMqvgHeUE00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bb06a0e7-3dc6-427a-b1ce-c4f8d58672cb\"}"},{"__ref":"Favorites:{\"uuid\":\"65460d16-aca0-4ced-b986-78578c01cbe2\"}"},{"__ref":"Favorites:{\"uuid\":\"c9dd9e97-bdd7-410b-973b-22d8bb598561\"}"}],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e20fa700-f81f-4455-a379-9ccbdd9fd854\"}"},{"__ref":"DeepDives:{\"uuid\":\"888b3dc6-7294-4d41-b3f0-bfa793307464\"}"},{"__ref":"DeepDives:{\"uuid\":\"b07a322d-b161-43d9-b5ee-687c837276cc\"}"},{"__ref":"DeepDives:{\"uuid\":\"686b83d9-c3ea-4dd9-982f-a0b8ed49ee20\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8de1040c-5fb8-4f90-b24c-e22d6737ab58/-/preview/-/format/jpg/","https://ucarecdn.com/fbbb051e-d238-48b4-a65d-be2e0aea5f71/-/preview/-/format/jpg/","https://ucarecdn.com/767be4e0-ee3b-4058-af3c-087603a386f2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5b5f4693-7950-4996-ab84-d02bbe510f37\"}"},{"__ref":"Education:{\"uuid\":\"b85bcc57-68bc-4422-a4b8-e4ba31a9c5b7\"}"}],"hiredAt":"2026-01-28T01:54:10.263Z","topics":["K-6 Storybook","Visual Arts / Graphic Design","History Project","Video / Photography","Creative Writing","Business / Entrepreneurship","Medicine / Health","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/","https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sophia-alexander\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2136b304-e34c-4c52-bf85-9e3cba8fdb36\"}"}}},"_sentryTraceData":"1ca500972e39408da5d6cd11f4e5eec1-9ca47bfa9396102f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1ca500972e39408da5d6cd11f4e5eec1,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sophia-alexander"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s
