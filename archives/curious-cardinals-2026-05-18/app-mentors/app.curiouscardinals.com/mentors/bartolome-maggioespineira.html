xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"299ef932-2d18-49e1-b3b6-09fac9bcd454\"}":{"__typename":"Favorites","uuid":"299ef932-2d18-49e1-b3b6-09fac9bcd454","photoUrl":"https://ucarecdn.com/ccdb9776-c468-4dff-a73e-d32dd47f9e77/","title":"Boca Juniors","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"f5362957-3266-4ea4-8b0a-749d8e1d2ac1\"}":{"__typename":"Favorites","uuid":"f5362957-3266-4ea4-8b0a-749d8e1d2ac1","photoUrl":"https://ucarecdn.com/b2a66458-9653-4a47-8762-b3aba1676d3f/","title":"Buenos Aires, Argentina","type":"CITY"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"076abd91-63af-4a3b-af5c-6b0facef42fd\"}":{"__typename":"DeepDives","uuid":"076abd91-63af-4a3b-af5c-6b0facef42fd","content":"\u003cp\u003eOne passion project that has been especially meaningful to me is \u003cstrong\u003eKUPU\u003c/strong\u003e, a startup cosmetic company I founded during high school. The idea behind KUPU came from my interest in entrepreneurship and sustainability, and from growing up in Brazil, where I was constantly exposed to the richness of Amazonian natural resources. I wanted to explore how those ingredients could be responsibly used to create high-quality consumer products, particularly in the male cosmetics space.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStarting from scratch, I independently researched existing products, studied consumer needs, and reviewed scientific literature to understand ingredient properties and formulation constraints. Through this process, I developed multiple product prototypes and analyzed their production costs to ensure they were both sustainable and economically viable. I also had the opportunity to collaborate alongside Natura, one of the largest cosmetic companies in Brazil, which gave me firsthand exposure to large-scale product development, quality standards, and real-world business considerations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I launched and sold several products, managing everything from product design and cost analysis to testing and distribution. Building KUPU taught me how to take an idea from concept to execution, balance creativity with structure, and learn through trial and error. It remains a project I am deeply proud of and one that sparked my continued interest in entrepreneurship, data-driven decision making, and product development.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"8c4036b7-1953-4398-9361-a6c16e8828a6\"}":{"__typename":"DeepDives","uuid":"8c4036b7-1953-4398-9361-a6c16e8828a6","content":"\u003cp\u003eAs a high school student, I’d describe myself as someone who really valued balance. I made a conscious effort to split my time between academics, sports, and my social life because I believed that doing well in one area should not come at the expense of the others. Of course, that balance was not always perfectly even. During exam season or before important competitions, academics or athletics naturally took priority, but having an overall structure helped me stay grounded and motivated.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause my schedule was full, I learned early on how important it was to study efficiently. I focused on creating realistic study plans that matched my goals and deadlines rather than putting in long hours just for the sake of it. This approach helped me avoid wasted time and taught me how to get meaningful results without burning out. Over time, I learned how to adjust my effort depending on what demanded the most attention while still maintaining consistency.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSocially, I have always loved meeting new people. I enjoyed getting to know classmates from different backgrounds and quickly built friendships by talking about shared interests such as sports, school, or everyday life. That openness made high school a very positive experience for me and helped me grow both academically and personally.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"39bb35ab-b5b5-4b3c-90e3-0cc8dffba96f\"}":{"__typename":"DeepDives","uuid":"39bb35ab-b5b5-4b3c-90e3-0cc8dffba96f","content":"\u003cp\u003eI chose my major because it lines up really well with how I’ve always liked to think and work through problems. I actually started college as just an Economics major, since I was interested in how markets work and how people make decisions. Pretty quickly though, I realized that a lot of what I enjoyed most involved more structured, hands on problem solving, which led me to Industrial Engineering.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always been good with numbers and I genuinely enjoy puzzle like problems, especially ones where there isn’t a single obvious solution. Industrial Engineering felt like a great fit because it gives you the tools to think creatively while still being very analytical. I like that it focuses on breaking down messy, real world problems and finding efficient and sometimes unconventional ways to solve them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI decided to keep Economics as my second major because it balances Industrial Engineering perfectly. Econ has helped me build strong analytical intuition around trade offs, incentives, and decision making, which comes up in almost every problem. Together, the two majors complement each other nicely and let me approach challenges from both a technical and big picture perspective.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"3ae9047f-4ad2-4bf7-aed5-9c2ce549d4b8\"}":{"__typename":"DeepDives","uuid":"3ae9047f-4ad2-4bf7-aed5-9c2ce549d4b8","content":"\u003cp\u003eMy greatest role model is Lionel Messi. Growing up in Argentina, he has always been more than just a soccer player to me. Of course, his talent is extraordinary. People back home joke that he is an alien because of how effortlessly he does things no one else can. But what truly makes him my role model is not just his skill, it is his character.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMessi has always carried himself with humility, even while being one of the greatest athletes of all time. He lets his work speak for itself and never seeks attention for the wrong reasons. What resonates with me most is his perseverance with the Argentine national team. He faced defeat again and again, endured heavy criticism, and experienced heartbreaking losses. Still, he never gave up. Eventually, he achieved his dream of winning the World Cup.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat mindset deeply influences how I approach challenges in my own life, with persistence, humility, and the belief that effort eventually pays off.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"5054dbcd-f749-4c96-b068-64898ea27f71\"}":{"__typename":"School","uuid":"5054dbcd-f749-4c96-b068-64898ea27f71","name":"St Francis College","city":"Sao Paulo","type":"HIGH","state":"Sao Paulo","country":"Brazil","zip":"05614050"},"Education:{\"uuid\":\"2d226ff4-11eb-4fb7-948f-eff81dbe722f\"}":{"__typename":"Education","uuid":"2d226ff4-11eb-4fb7-948f-eff81dbe722f","school":{"__ref":"School:{\"uuid\":\"5054dbcd-f749-4c96-b068-64898ea27f71\"}"},"startYear":"2010","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"24767069-8780-4464-accb-a23a42231f67\"}":{"__typename":"Education","uuid":"24767069-8780-4464-accb-a23a42231f67","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Industrial Engineering and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"8c1e9ae6-8205-43d7-a564-d4e6133f9839\"}":{"__typename":"MentorPublicProfile","uuid":"8c1e9ae6-8205-43d7-a564-d4e6133f9839","displayName":"Bartolome M.","slug":"bartolome-maggioespineira","biography":"\u003cp\u003eHi! My name is Barto, and I’m currently a student at Northwestern University in Chicago, where I study Industrial Engineering. Before coming to the U.S., I spent most of my life moving between Argentina and Brazil. Growing up across countries and time zones meant constantly adapting to new places, schools, and people, and it also means I’m fluent in Spanish, Portuguese, and English. Being exposed to different education systems early on helped me become flexible, curious, and comfortable learning in many different ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Northwestern, I focus on Industrial Engineering, a field centered around problem solving, efficiency, and finding better ways to approach challenges. I enjoy working through difficult material, especially when it involves logic, numbers, or structured thinking. Even more than that, I enjoy helping others understand those ideas in a clear, low stress way that actually feels approachable. I believe learning works best when concepts are broken down step by step and students feel comfortable asking questions along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, sports have always been an important part of my life. I played competitive tennis throughout all of high school, an experience that taught me discipline, consistency, and how to stay patient when progress takes time. I’m also a big soccer fan and love following the sport whenever I get the chance. Being involved in sports helped me learn how to manage my time, stay motivated, and handle both success and setbacks, lessons that translate well to academics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEducation is something I truly care about. While living in Brazil, I participated in several initiatives supporting severely underfunded public schools. Alongside teachers and volunteers, we worked on building clearer curricula and organizing learning materials so students could have more structure and support in their education. Spending time in those classrooms was eye opening and reinforced how important it is for students to feel supported, encouraged, and taken seriously. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, my goal is simple: to help students feel more confident and comfortable with what they are learning. I aim to be patient, clear, and encouraging, and I always adapt to each student’s pace and needs. I try to meet students where they are, whether they need help building foundational skills, reviewing material, or gaining confidence in a subject they find challenging.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe students learn best when they feel supported, not rushed, and when they feel comfortable asking questions without fear of being wrong. My hope is that students not only improve academically, but also develop better study habits, stronger problem solving skills, and more confidence in their own abilities.\u003c/p\u003e","teachingVideoPlaybackId":"9mH00TZDC01ptBsC36M3xivoSjEWn4pD801jklW3JiugFQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"299ef932-2d18-49e1-b3b6-09fac9bcd454\"}"},{"__ref":"Favorites:{\"uuid\":\"f5362957-3266-4ea4-8b0a-749d8e1d2ac1\"}"}],"causesSupported":[],"major":"Industrial Engineering and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"076abd91-63af-4a3b-af5c-6b0facef42fd\"}"},{"__ref":"DeepDives:{\"uuid\":\"8c4036b7-1953-4398-9361-a6c16e8828a6\"}"},{"__ref":"DeepDives:{\"uuid\":\"39bb35ab-b5b5-4b3c-90e3-0cc8dffba96f\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ae9047f-4ad2-4bf7-aed5-9c2ce549d4b8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d991d16a-506a-45c2-a277-292b995f0618/-/preview/-/format/jpg/","https://ucarecdn.com/54229560-9a37-445d-976c-c1c340cb8b10/-/preview/-/format/jpg/","https://ucarecdn.com/bc2e5040-6055-4aa3-be0d-6d010c1d6fa5/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2d226ff4-11eb-4fb7-948f-eff81dbe722f\"}"},{"__ref":"Education:{\"uuid\":\"24767069-8780-4464-accb-a23a42231f67\"}"}],"hiredAt":"2025-11-06T16:27:21.594Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","College Essay Writing","Computer Science","Economics","Reading","Creative Writing","Sports Journalism","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Machine Learning / AI","Sports Analytics","STEM Project","Web Design","Debate","Law / Government / Policy","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"bartolome-maggioespineira\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8c1e9ae6-8205-43d7-a564-d4e6133f9839\"}"}}},"_sentryTraceData":"dec3ba85b18d4fcd98542ba5d0d08734-8daca2a46e221b19-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=dec3ba85b18d4fcd98542ba5d0d08734,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"bartolome-maggioespineira"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
