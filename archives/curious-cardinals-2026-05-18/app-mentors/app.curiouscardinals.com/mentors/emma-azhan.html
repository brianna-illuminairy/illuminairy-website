xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"62f22b16-f898-4933-b50e-166a0ef3d675\"}":{"__typename":"DeepDives","uuid":"62f22b16-f898-4933-b50e-166a0ef3d675","content":"\u003cp\u003eI love to be outside! Whether it's long distance running, hiking, skiing, climbing or surfing; being in nature actively is when I am the happiest. I also love to create. I have played the piano for most of my life, but also really enjoy sewing and cooking. I am currently taking an oil painting class at Berkeley and am loving it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"23067e76-d71f-4b26-8a9e-524e208e2c88\"}":{"__typename":"DeepDives","uuid":"23067e76-d71f-4b26-8a9e-524e208e2c88","content":"\u003cp\u003eI chose my major because I wanted to find a way to combine my passion for the environment with my natural skills and interests. I have always loved math and quantitative analysis, and quickly found economics to be very attuned to the way my brain works. The application of economic theory to policy analysis has been one of the most rewarding learning experiences I've had the pleasure of having; and the opportunity to apply that to sustainability has made my major all the more meaningful!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"66e8b463-f89f-4703-a6d6-ce68d58cae07\"}":{"__typename":"DeepDives","uuid":"66e8b463-f89f-4703-a6d6-ce68d58cae07","content":"\u003cp\u003eMy dream job is using econometric models to forecast energy market prices! I know it sounds kind of boring... but trust me, energy is AWESOME!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"9368c740-b23e-438c-b0a2-601e253f5790\"}":{"__typename":"DeepDives","uuid":"9368c740-b23e-438c-b0a2-601e253f5790","content":"\u003cp\u003eMy biggest role model is my mum! From going to business school to staying at home to raise me, and then going back to school to pursue her passion in psychology... my mum has taught me that it is never too late to pursue your dreams and that you are capable of anything you set your mind to!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"f273af4b-8684-4c84-b29d-7a5d0230838f\"}":{"__typename":"School","uuid":"f273af4b-8684-4c84-b29d-7a5d0230838f","name":"Capistrano Valley High School","city":"Mission Viejo","type":"HIGH","state":"California","country":"United States","zip":"92692"},"Education:{\"uuid\":\"e5e0c5f0-d06c-48da-a38f-84431a7ffb5d\"}":{"__typename":"Education","uuid":"e5e0c5f0-d06c-48da-a38f-84431a7ffb5d","school":{"__ref":"School:{\"uuid\":\"f273af4b-8684-4c84-b29d-7a5d0230838f\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"bbc90362-2d80-4292-a443-8a256146bc1e\"}":{"__typename":"Education","uuid":"bbc90362-2d80-4292-a443-8a256146bc1e","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Environmental Economics and Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"735cf10f-f2f5-4cd0-8ff2-74d8d848bf0d\"}":{"__typename":"MentorPublicProfile","uuid":"735cf10f-f2f5-4cd0-8ff2-74d8d848bf0d","displayName":"Emma A.","slug":"emma-azhan","biography":"\u003cp\u003eHi! I’m Emma Azhan, a UC Berkeley senior studying Environmental Economics and Data Science. I’m driven by the intersection of data, policy, and sustainability; specifically, how the choices we make today shape a more equitable and environmentally responsible future. I love exploring how economics and technology can work together to promote clean energy, climate resilience, and social justice.\u003c/p\u003e\u003cp\u003eAt Berkeley, I research how emerging technologies like data centres affect electricity markets, environmental outcomes, and regional energy planning. My work combines econometric modelling with environmental policy analysis, helping me understand not just how systems function, but how they can change for the better. Through this research, I’ve learned how to use data to tell meaningful stories and solve real-world problems, both skills I love sharing with my students. Whether we’re unpacking a sticky calculus problem, breaking down an economics model, or crafting a powerful personal essay, I focus on making learning clear, relevant, and confidence-building.\u003c/p\u003e\u003cp\u003eTeaching has always been a big part of my life. Before college, I founded Terra, a nonprofit that taught sustainability and ecology to elementary schoolers through creative, hands-on lessons. I designed and led more than 40 sessions, introducing young students to big ideas about climate change, ecosystems, and conservation in ways that felt fun and approachable. That experience taught me that students learn best when they feel inspired, supported, and curious, which is an approach I bring to every tutoring session. Seeing my students grow more confident and curious over time is by far my favourite part of what I do.\u003c/p\u003e\u003cp\u003eI currently tutor college essay writing, economics, writing, and AP Calculus. My sessions are interactive and encouraging. I like helping students find their unique voice in writing, discover connections between ideas, and realise that challenging subjects can be enjoyable and empowering. My goal is to help students not only master the material but also build lasting confidence, curiosity, and skills they can carry with them throughout their education.\u003c/p\u003e\u003cp\u003eOutside of academics, I love running, surfing, sewing, and hiking—basically anything that gets me outdoors or lets me be creative. I find enjoyment in adventure and artistic expression, and am excited to help guide any students that are interested in those pursuits. I want our mentorship to extend beyond our academic material, and help guide you in discovering your path in whatever chapter may be coming next. I believe curiosity is the foundation of great learning, and I hope to share that same excitement and openness with every student I work with. :)\u003c/p\u003e","teachingVideoPlaybackId":"3CK01Xzx9CpBoMtVjevnYYKtacCqxOE4cmU6Akk02GYDY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Environmental Economics and Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"62f22b16-f898-4933-b50e-166a0ef3d675\"}"},{"__ref":"DeepDives:{\"uuid\":\"23067e76-d71f-4b26-8a9e-524e208e2c88\"}"},{"__ref":"DeepDives:{\"uuid\":\"66e8b463-f89f-4703-a6d6-ce68d58cae07\"}"},{"__ref":"DeepDives:{\"uuid\":\"9368c740-b23e-438c-b0a2-601e253f5790\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3b291c94-f852-48bb-a1a6-47b6d38636c9/-/preview/-/format/jpg/","https://ucarecdn.com/80feaf18-fdaf-46be-96ef-2428cd9b2400/-/preview/-/format/jpg/","https://ucarecdn.com/7e79fa29-9cdc-43c6-84c8-645a288deee9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e5e0c5f0-d06c-48da-a38f-84431a7ffb5d\"}"},{"__ref":"Education:{\"uuid\":\"bbc90362-2d80-4292-a443-8a256146bc1e\"}"}],"hiredAt":"2025-10-23T23:03:48.978Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Calculus","K-5 Grade Math","Biology","Writing","Spanish","Academic Coaching","College Essay Writing","Reading","History","Economics","Creative Writing","Music","History Project","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"emma-azhan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"735cf10f-f2f5-4cd0-8ff2-74d8d848bf0d\"}"}}},"_sentryTraceData":"fe901b15cafb464081d81bc93fe65d45-b1dde4fdea104153-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=fe901b15cafb464081d81bc93fe65d45,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"emma-azhan"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTi
