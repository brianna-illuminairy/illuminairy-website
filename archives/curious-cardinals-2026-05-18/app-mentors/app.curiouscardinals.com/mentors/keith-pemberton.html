xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8e3ea634-72e2-4d05-b7fc-f8eb06fe1f04\"}":{"__typename":"DeepDives","uuid":"8e3ea634-72e2-4d05-b7fc-f8eb06fe1f04","content":"\u003cp\u003eBecome the Ambassador to the United Nations\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"35cbdfd7-24b6-4978-bfed-1035a5914e68\"}":{"__typename":"DeepDives","uuid":"35cbdfd7-24b6-4978-bfed-1035a5914e68","content":"\u003cp\u003eExtremely Busy! From Student Council President to Captain of the Varsity Lacrosse Team I was constantly engaging with my community\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d0ffbfe2-609e-46d3-854c-cd04c94b321e\"}":{"__typename":"DeepDives","uuid":"d0ffbfe2-609e-46d3-854c-cd04c94b321e","content":"\u003cp\u003eMy first two summers I was heavily focused on college lacrosse recruitment until I had a change what I wanted to do with my life. I spent the summer between my junior and senior year of high in Rabat, Morocco as an diplomatic exchange participant with the US State Department\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ac79070b-1ded-464d-9f56-e4fd82866017\"}":{"__typename":"DeepDives","uuid":"ac79070b-1ded-464d-9f56-e4fd82866017","content":"\u003cp\u003ePick up new hobbies and explore things that interest you. Life is about experiences!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"44a0160b-76f2-4321-bbc9-184530f70da7\"}":{"__typename":"School","uuid":"44a0160b-76f2-4321-bbc9-184530f70da7","name":"Forsyth Country Day School","city":"Lewisville","type":"HIGH","state":"North Carolina","country":"United States","zip":"27023"},"Education:{\"uuid\":\"2d2bb2aa-59e2-4ba4-abaa-da8db0f05dce\"}":{"__typename":"Education","uuid":"2d2bb2aa-59e2-4ba4-abaa-da8db0f05dce","school":{"__ref":"School:{\"uuid\":\"44a0160b-76f2-4321-bbc9-184530f70da7\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"7ece2d52-79ff-4350-be40-dce5dd3b4781\"}":{"__typename":"Education","uuid":"7ece2d52-79ff-4350-be40-dce5dd3b4781","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"dbb165f1-a8fd-48ee-aea5-37362b7e1ab5\"}":{"__typename":"MentorPublicProfile","uuid":"dbb165f1-a8fd-48ee-aea5-37362b7e1ab5","displayName":"Keith P.","slug":"keith-pemberton","biography":"\u003cp\u003eI’m currently a sophomore at Yale University, working toward a B.A. in History with certificates in Human Rights and Arabic. My academic journey here is shaped by a deep curiosity about how historical systems impact contemporary issues, especially in governance and human rights. Courses like \u003cem\u003eLaw, Technology, and Culture\u003c/em\u003e, \u003cem\u003eHistories of Nonviolent Resistance\u003c/em\u003e, and \u003cem\u003eFoundations in Education Studies\u003c/em\u003e are helping me explore these intersections.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore coming to Yale, I graduated from Forsyth Country Day School in Lewisville, NC, with a weighted GPA of 4.40. During high school, I immersed myself in Advanced Placement courses. My commitment to academic excellence was recognized with honors like the AP Scholar with Distinction and the Princeton Prize in Race Relations. One of my most memorable experiences was my senior capstone project, where I designed and taught Arabic language and culture classes to 8th graders—an initiative inspired by my time in Rabat, Morocco, as a National Security Language Initiative for Youth scholar.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I also took on several leadership roles that shaped my approach to service and advocacy. As Student Body President, I led initiatives to address gender equity in sports and celebrate heritage months. I was also the chair of the Student Diversity Leadership Council and co-founded the Black Student Union, which focused on supporting and empowering minority students. My involvement with the NAACP High Point Youth Chapter, where I served as President, allowed me to advocate for voting rights and police reform. Additionally, I played varsity lacrosse, helping my team secure a state championship, and lobbied for legislation at the On The Hill Summit in Washington, D.C.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow at Yale, I continue to build on these experiences. As a first-year representative on the Branford College Council, I work to enhance the undergraduate experience by representing student interests and collaborating on event planning. I’m also involved with the Yale Policy Institute’s Hate Crime Prevention Center, where I conduct research on hate crime trends and support diversity and inclusion workshops. Writing for \u003cem\u003eThe Globalist\u003c/em\u003e has given me the chance to delve into international issues and engage with Yale World Fellows for fresh perspectives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis past summer, I interned at the Lawyers’ Committee for Civil Rights Under Law in Washington, D.C., where I contributed to criminal justice reform initiatives. I also gained valuable research experience at the Library of Congress, assisting with archival work that supported ongoing historical research projects. Looking ahead, I’m eager to continue bridging my passions for education, public service, and international relations, with aspirations for a career in law, foreign service, or public policy.\u003c/p\u003e","teachingVideoPlaybackId":"01jGcDYVzD27eHiUhKrsCnFDleKSjexN64i7Msnwu6EY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8e3ea634-72e2-4d05-b7fc-f8eb06fe1f04\"}"},{"__ref":"DeepDives:{\"uuid\":\"35cbdfd7-24b6-4978-bfed-1035a5914e68\"}"},{"__ref":"DeepDives:{\"uuid\":\"d0ffbfe2-609e-46d3-854c-cd04c94b321e\"}"},{"__ref":"DeepDives:{\"uuid\":\"ac79070b-1ded-464d-9f56-e4fd82866017\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2ba7c131-9085-4463-aa8c-0e113a8828bc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2d2bb2aa-59e2-4ba4-abaa-da8db0f05dce\"}"},{"__ref":"Education:{\"uuid\":\"7ece2d52-79ff-4350-be40-dce5dd3b4781\"}"}],"hiredAt":"2024-0
