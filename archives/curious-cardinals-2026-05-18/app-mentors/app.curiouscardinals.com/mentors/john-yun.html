xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3bc8ba84-56e6-47e8-a0a7-d6d275cc2df6\"}":{"__typename":"Favorites","uuid":"3bc8ba84-56e6-47e8-a0a7-d6d275cc2df6","photoUrl":"https://ucarecdn.com/5665d347-0fe0-4f5f-b695-5de1980ba2a9/","title":"About Time","type":"MOVIE"},"Favorites:{\"uuid\":\"61ce32cb-5b01-47f8-bb21-1b629e75a535\"}":{"__typename":"Favorites","uuid":"61ce32cb-5b01-47f8-bb21-1b629e75a535","photoUrl":"https://ucarecdn.com/9e5d89c2-9682-4f4b-ac21-c207b6f36c7e/","title":"Apex Legends ","type":"GAME"},"Favorites:{\"uuid\":\"810a8a19-7068-4395-88a0-416f0716391d\"}":{"__typename":"Favorites","uuid":"810a8a19-7068-4395-88a0-416f0716391d","photoUrl":"https://ucarecdn.com/1ab16c20-2bcf-4765-98af-0658ebe49109/","title":"Son of Spergy by Daniel Caesar","type":"ALBUM"},"CausesSupported:{\"uuid\":\"2952e634-a943-4131-8b86-7c04e0d9e643\"}":{"__typename":"CausesSupported","uuid":"2952e634-a943-4131-8b86-7c04e0d9e643","name":"Advance Myanmar","description":"\u003cp\u003eIt provides humanitarian assistance to my home country\u003c/p\u003e","photoUrl":"https://ucarecdn.com/882315e9-c254-4098-907a-8ea3c291292d/"},"CausesSupported:{\"uuid\":\"39cc4021-c803-4788-ad1f-ceaadcabd2dd\"}":{"__typename":"CausesSupported","uuid":"39cc4021-c803-4788-ad1f-ceaadcabd2dd","name":"Myanmar Red Cross","description":"\u003cp\u003eSimilar to the red cross but more focused on my home country\u003c/p\u003e","photoUrl":"https://ucarecdn.com/3563addb-6223-4a52-88ad-93731c0ec50e/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3dc49dfc-5def-4577-9f2c-87ce0871ea3a\"}":{"__typename":"DeepDives","uuid":"3dc49dfc-5def-4577-9f2c-87ce0871ea3a","content":"\u003cp\u003eIn my spare time you can almost always find me either at the climbing wall here on campus! or at one of the practice rooms playing the violin!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ec1618eb-62c6-42f8-bab6-0bc5c9ebe07c\"}":{"__typename":"DeepDives","uuid":"ec1618eb-62c6-42f8-bab6-0bc5c9ebe07c","content":"\u003cp\u003eIf I had any advice to give my middle school self, it would be to try any and everything and to not let my own fear of embarrassment stop me from discovering a potential passion whether it be a sport or a academic field. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f86a1383-d59a-4029-a539-36de3856275c\"}":{"__typename":"DeepDives","uuid":"f86a1383-d59a-4029-a539-36de3856275c","content":"\u003cp\u003eMy dream job would be one where I can use most if not all of my skills in order to help others. This could show up in different ways, like mentoring students, working at an NGO that protects marine life or making an app that helps people with social media addiction. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"20154bff-5976-4e2f-a001-cf3a3bd1a31d\"}":{"__typename":"DeepDives","uuid":"20154bff-5976-4e2f-a001-cf3a3bd1a31d","content":"\u003cp\u003eI constantly find myself gravitating towards positions that involve mentoring and teaching others. I believe it is where I am happiest, when my own efforts reflect in the success of a mentee. I think this is largely due to the immensely positive experience I had with a mentor from a leadership program I took part in when I was younger. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"83780cd2-7121-43f1-b6c1-4f7b13b47d1e\"}":{"__typename":"School","uuid":"83780cd2-7121-43f1-b6c1-4f7b13b47d1e","name":"The Pre-Collegiate Program of Yangon","city":"Yangon","type":"HIGH","state":"Yangon Region","country":"Myanmar (Burma)","zip":"11141"},"Education:{\"uuid\":\"f2853e59-0813-442a-a812-2198bfa52f33\"}":{"__typename":"Education","uuid":"f2853e59-0813-442a-a812-2198bfa52f33","school":{"__ref":"School:{\"uuid\":\"83780cd2-7121-43f1-b6c1-4f7b13b47d1e\"}"},"startYear":"2021","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"99c27379-10f6-49ec-9e59-3402737a5dc4\"}":{"__typename":"School","uuid":"99c27379-10f6-49ec-9e59-3402737a5dc4","name":"New York University Abu Dhabi","city":"Abu Dhabi","type":"COLLEGE","state":"Abu Dhabi","country":"United Arab Emirates","zip":"00000"},"Education:{\"uuid\":\"da2cc28a-ff8a-4513-9bc6-335f8f9a2082\"}":{"__typename":"Education","uuid":"da2cc28a-ff8a-4513-9bc6-335f8f9a2082","school":{"__ref":"School:{\"uuid\":\"99c27379-10f6-49ec-9e59-3402737a5dc4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science ","degree":null},"MentorPublicProfile:{\"uuid\":\"54218972-f659-4fbe-8339-1273584cb7b5\"}":{"__typename":"MentorPublicProfile","uuid":"54218972-f659-4fbe-8339-1273584cb7b5","displayName":"John Y.","slug":"john-yun","biography":"\u003cp\u003eI’m a computer science student at NYU Abu Dhabi with a focus on machine learning and web development, and a growing interest in game development. I enjoy understanding how systems learn from data and how software can be designed to feel intuitive and purposeful. Machine learning interests me because it blends data, logic, and real-world impact, while web development appeals to me because it turns ideas into things people can actually interact with. Game development has become an area of curiosity for me as it brings together storytelling, design, and technical problem-solving in a very hands-on way.\u003c/p\u003e\u003cp\u003eAlongside my studies, I worked part time as an assistant teacher in Yangon’s Pre-Collegiate Program, where I supported both an academic writing class and a college counseling class. In the writing course, I helped students improve clarity, structure, and confidence in their work. In college counseling, I guided students through identifying schools that fit their goals and supported them through applications, personal statements, and interviews. Teaching pushed me to communicate clearly, adapt to different learning styles, and understand the importance of making complex ideas approachable.\u003c/p\u003e\u003cp\u003eWhen it comes to projects, I enjoy building websites and apps that people can realistically use in their daily lives. One project I worked on is an unreleased app called Q-It, designed to help people block distracting social media apps so they can be more present and focused on what matters to them. Working on this project encouraged me to think beyond technical implementation and consider habits, attention, and how design choices influence behavior.\u003c/p\u003e\u003cp\u003eOutside of academics, I spend time climbing and playing the violin. Climbing has taught me patience, focus, and how to approach challenges step by step. Playing the violin has helped me appreciate discipline, steady progress, and the importance of practice. I also love music in general, both as a creative outlet and as a way to recharge.\u003c/p\u003e\u003cp\u003eAs a Burmese student studying at NYU Abu Dhabi, growing up in a politically unstable environment made me resilient early on. Studying at a global university has further shaped my ability to navigate different cultures and perspectives. Together, these experiences have made me adaptable, curious, and comfortable learning in unfamiliar spaces.\u003c/p\u003e","teachingVideoPlaybackId":"gw6egsE9ai6E7zC4xYS7NysTqVpLjPsnOlDjvoYqpEI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I'm really proud of is having done HLAB, which is a selective program where university students mentor Japanese high school students in terms of career advice and life advice in general. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"3bc8ba84-56e6-47e8-a0a7-d6d275cc2df6\"}"},{"__ref":"Favorites:{\"uuid\":\"61ce32cb-5b01-47f8-bb21-1b629e75a535\"}"},{"__ref":"Favorites:{\"uuid\":\"810a8a19-7068-4395-88a0-416f0716391d\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"2952e634-a943-4131-8b86-7c04e0d9e643\"}"},{"__ref":"CausesSupported:{\"uuid\":\"39cc4021-c803-4788-ad1f-ceaadcabd2dd\"}"}],"major":"Computer Science ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3dc49dfc-5def-4577-9f2c-87ce0871ea3a\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec1618eb-62c6-42f8-bab6-0bc5c9ebe07c\"}"},{"__ref":"DeepDives:{\"uuid\":\"f86a1383-d59a-4029-a539-36de3856275c\"}"},{"__ref":"DeepDives:{\"uuid\":\"20154bff-5976-4e2f-a001-cf3a3bd1a31d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9c0fe938-c1c9-4df3-816d-2ebb0914d833/-/preview/-/format/jpg/","https://ucarecdn.com/d60321fe-a1fa-4d5c-8c5f-ed56686fff03/-/preview/-/format/jpg/","https://ucarecdn.com/27551379-edac-4437-b976-8ff7716901d4/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f2853e59-0813-442a-a812-2198bfa52f33\"}"},{"__ref":"Education:{\"uuid\":\"d
