xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d5a75b29-4ee6-4b22-b6a5-db6e02613920\"}":{"__typename":"Favorites","uuid":"d5a75b29-4ee6-4b22-b6a5-db6e02613920","photoUrl":"https://ucarecdn.com/c45e506c-5207-46b3-bedb-8a65b4a4fad1/","title":"Robert Downey Jr.","type":"ACTOR"},"Favorites:{\"uuid\":\"e6f91743-2348-41ed-a7de-46d1e06f3a56\"}":{"__typename":"Favorites","uuid":"e6f91743-2348-41ed-a7de-46d1e06f3a56","photoUrl":"https://ucarecdn.com/5fc4bf2f-8dd6-4cfc-aaef-b476e7b54ef6/","title":"Steph Curry","type":"ATHLETE"},"Favorites:{\"uuid\":\"e073554f-7c8b-4ed2-ae4d-9c56c15755cf\"}":{"__typename":"Favorites","uuid":"e073554f-7c8b-4ed2-ae4d-9c56c15755cf","photoUrl":"https://ucarecdn.com/5fc4bf2f-8dd6-4cfc-aaef-b476e7b54ef6/","title":"Steph Curry","type":"ATHLETE"},"Favorites:{\"uuid\":\"3450b537-5975-4f80-8775-af78d2d9b171\"}":{"__typename":"Favorites","uuid":"3450b537-5975-4f80-8775-af78d2d9b171","photoUrl":"https://ucarecdn.com/4a1f1d00-6bab-4bff-9080-2808f09c6e63/","title":"Metro Boomin","type":"ARTIST"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"414fb6b0-2a78-4b8e-92c6-fec5f3de84cb\"}":{"__typename":"DeepDives","uuid":"414fb6b0-2a78-4b8e-92c6-fec5f3de84cb","content":"\u003cp\u003eI love to play sports! My weeks typically consist of pickup basketball runs, pickleball, flag football, and beach volleyball!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c73f3db8-b3ed-44b4-91aa-02ffdaa2aeb2\"}":{"__typename":"DeepDives","uuid":"c73f3db8-b3ed-44b4-91aa-02ffdaa2aeb2","content":"\u003cp\u003eTalk to people! I think I was very introverted in middle and high school and slowly broke out of my shell in college and beyond. I would definitely advise myself to talk to more people, learn from them, and just make more friends/connections!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"00b700b3-760d-49cd-9e06-b51b43391c6e\"}":{"__typename":"DeepDives","uuid":"00b700b3-760d-49cd-9e06-b51b43391c6e","content":"\u003cp\u003eI love to build random apps all the time. I am currently working on a smart menu scanner app where you can take a picture of a complicated or foreign language cuisine menu and interactively tap through the menu items to learn more about it and see pictures.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"a77991d7-a414-434b-b952-7f371381726f\"}":{"__typename":"DeepDives","uuid":"a77991d7-a414-434b-b952-7f371381726f","content":"\u003cp\u003eTeaching in general is super fulfilling to me because I feel that I am grateful to have friends and family around me that were able to guide me in middle school and high school. However, once I got to college I realized that there were so many people of diverse backgrounds who did not have the same opportunities I did. I hope to use my experiences and learnings to help the next generation in their journey!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"9fbeb43d-0baa-4280-97c2-03532c64f583\"}":{"__typename":"School","uuid":"9fbeb43d-0baa-4280-97c2-03532c64f583","name":"Oxford Academy","city":"Cypress","type":"HIGH","state":"California","country":"United States","zip":"90630"},"Education:{\"uuid\":\"0133043b-88cd-4e43-9f1d-49d17696f42e\"}":{"__typename":"Education","uuid":"0133043b-88cd-4e43-9f1d-49d17696f42e","school":{"__ref":"School:{\"uuid\":\"9fbeb43d-0baa-4280-97c2-03532c64f583\"}"},"startYear":"2015","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"b69b86da-28fe-4d8d-bb7f-8b40aaec662a\"}":{"__typename":"Education","uuid":"b69b86da-28fe-4d8d-bb7f-8b40aaec662a","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Electrical Engineering and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"be289113-a843-406e-afc8-5215d18b5fac\"}":{"__typename":"MentorPublicProfile","uuid":"be289113-a843-406e-afc8-5215d18b5fac","displayName":"Arvind V.","slug":"arvind-vivekanandan","biography":"\u003cp\u003eHey! I'm Arvind and I am a recent grad from UC Berkeley where I studied Electrical Engineer and Computer Science and minored in Data Science. I am originally from SoCal and currently I am a Software Development Engineer at Amazon in Seattle. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore I sold my soul to corporate America (no hate to Amazon :)), I was really into startups and entrepreneurship during my time in college. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAll my internship experiences were at startups, and the most notable internship was at a manufacturing software startup in LA focused on building a factory operating system that provides manufacturing teams insight into their production. Here, I scoped out, planned and built a full-fledged internal developer tool to help debug performance and optimization of their software. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis was especially super cool for myself since this tool was immediately used by the engineers there and found up to 3 performance issues within first few hours of using it! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I took the leap my senior year of college (technically 3rd year because I graduated early) and founded my own startup: SimpleCell, a bioinformatics analysis platform to help wet lab researchers who can't code analyze their big data through conversations. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy experience with SimpleCell and building a company was extremely exciting, scary and valuable. We got funding right after graduation and I went all in. We had started in the academia space and faced product market fit issues when trying to transition to the biotech industry (pharmaceuticals and therapeutics companies). At this point, we made the decision to pause on startups and get some industry experience first before coming back to entrepreneurship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor fun, I love to play recreational sports! I played tennis in high school, and got into pickup basketball in the recent years. Currently, I also play a lot of pickleball, beach volleyball and flag football as well. It's a great way for me to stay and active and meet new people. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love to teach-in high school I volunteered to teach coding to elementary school students, and in college I was an academic intern on computer science courses' staff to help students learn in labs and lead discussions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow that I am in my post-grad life, I hope to continue some form of teaching and mentorship and hope to leverage Curious Cardinals to help out the next generation!\u003c/p\u003e","teachingVideoPlaybackId":"cqVvjmyzmesLdYhM02nSm7BbSGG5CM3htA2qyuE005cJU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn my senior year of college, I founded a startup which got venture capital funding. The product was an agent-based software to help nontechnical researchers (think wet lab bio researchers) who couldn't code, analyze their big data. I believe that more than just founding the company and getting funding, seeing the real life impact of something that I built directly help other people was most fulfilling.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d5a75b29-4ee6-4b22-b6a5-db6e02613920\"}"},{"__ref":"Favorites:{\"uuid\":\"e6f91743-2348-41ed-a7de-46d1e06f3a56\"}"},{"__ref":"Favorites:{\"uuid\":\"e073554f-7c8b-4ed2-ae4d-9c56c15755cf\"}"},{"__ref":"Favorites:{\"uuid\":\"3450b537-5975-4f80-8775-af78d2d9b171\"}"}],"causesSupported":[],"major":"Electrical Engineering and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"414fb6b0-2a78-4b8e-92c6-fec5f3de84cb\"}"},{"__ref":"DeepDives:{\"uuid\":\"c73f3db8-b3ed-44b4-91aa-02ffdaa2aeb2\"}"},{"__ref":"DeepDives:{\"uuid\":\"00b700b3-760d-49cd-9e06-b51b43391c6e\"}"},{"__ref":"DeepDives:{\"uuid\":\"a77991d7-a414-434b-b952-7f371381726f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/73af3bec-48c1-4c88-8685-ec055879b232/-/preview/-/format/jpg/","https://ucarecdn.com/ca4689d1-c437-4c42-a7ac-0f2f4a3dabe4/-/preview/-/format/jpg/","https://ucarecdn.com/2c6e5378-cda5-4ff7-ad01-7ced7c9cbb2a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0133043b-88cd-4e43-9f1d-49d17696f42e\"}"},{"__
