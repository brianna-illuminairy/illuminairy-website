","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"School:{\"uuid\":\"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a\"}":{"__typename":"School","uuid":"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a","name":"Cambridge Rindge \u0026 Latin School","city":"Cambridge","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"fa0eab5d-9060-4c0d-ae4f-7a9f517e84b6\"}":{"__typename":"Education","uuid":"fa0eab5d-9060-4c0d-ae4f-7a9f517e84b6","school":{"__ref":"School:{\"uuid\":\"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"4c4c4edc-a6e2-473b-b6c4-a0fc1276a26c\"}":{"__typename":"MentorPublicProfile","uuid":"4c4c4edc-a6e2-473b-b6c4-a0fc1276a26c","displayName":"Adrian B.","slug":"a-betancourt","biography":"\u003cp\u003eFrom constructing water systems in the Dominican Republic to designing prosthetics in Sierra Leone, I’ve pursued engineering not just as a technical discipline, but as a tool for justice. I recently graduated from Harvard College with a degree in Mechanical Engineering, a secondary in Ethnicity, Migration, and Rights (Latinx Studies), and a Spanish language citation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my time at Harvard, I focused on using engineering for social good. Alongside the MIT Media Lab’s Biomechatronics group, I developed prosthetic sockets using banana fibers as a low-cost, sustainable alternative to carbon fiber, designed for amputees in Sierra Leone. This work emphasized human-centered design, a strategy that I used to guide me, which directly responds to real community needs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond research, I’ve worked across Puerto Rico, Boston, and Los Angeles, helping design electrical resilience plans for low-income communities, supporting case managers assisting formerly incarcerated individuals, and mentoring immigrant youth in STEM. I also interned at TransHealthHQ where I helped build a healthcare resource hub for the transgender and nonbinary community. No matter the project, I’m driven by my beliefs of equity and access.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I led Harvard’s Club Soccer Team as captain, an experience that sharpened my leadership and teamwork under pressure. I also bring bilingual fluency in Spanish and a strong technical foundation meaning I am equally at ease translating for in a rural engineering project as I am designing in SolidWorks or troubleshooting code in Python. With support from various grants such as the Harvard College Research Program, the Institute of Politics, and the Fong Family Winternship Program, I’ve turned ideas into action within labs, nonprofits, and communities around the world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the core of everything I do is a belief that engineering should serve people. I’m not just here to build machines, I’m here to help build a more just and inclusive world.\u003c/p\u003e","teachingVideoPlaybackId":"H008016600Y6GSwyxkwkAFpULpu5w7m3ScQ92F8usyyRZs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOutside the classroom, I’m deeply passionate about soccer—so much so that I literally broke my collarbone mid-game to help secure a national championship. Painful? Yes. Worth it? Absolutely.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"1c75a547-e59f-4a25-a57f-da8d14d2e372\"}"},{"__ref":"Favorites:{\"uuid\":\"deae6931-a85a-4ec2-9262-5a87d9efafb6\"}"},{"__ref":"Favorites:{\"uuid\":\"d4afa826-1cc2-417b-9d9b-7c791589708a\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6d9d14a0-7535-4fc6-bbce-4ed0b9ed5217\"}"},{"__ref":"CausesSupported:{\"uuid\":\"13d6bda0-3100-45a5-bffb-60d8fb344423\"}"}],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{
