Year":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}":{"__typename":"School","uuid":"891dad70-4e24-4602-8353-1e8140b8eb0c","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60201"},"Education:{\"uuid\":\"c139d93c-84b2-4378-b154-781a94f3a119\"}":{"__typename":"Education","uuid":"c139d93c-84b2-4378-b154-781a94f3a119","school":{"__ref":"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Cognitive Science/Global Health","degree":null},"MentorPublicProfile:{\"uuid\":\"0e0d9aae-409c-40ac-b2a5-2f4c8066e771\"}":{"__typename":"MentorPublicProfile","uuid":"0e0d9aae-409c-40ac-b2a5-2f4c8066e771","displayName":"Joseph B.","slug":"joseph-biju-1","biography":"\u003cp\u003eHey! My name is Joseph and I am a pre-medical student at Northwestern studying Cognitive Science and Global Health. I am interested in health care policy and advocating for rights and autonomy! Upon graduation, I want to pursue an MD/JD, and maybe one day, work for the government. I would say that I am interested in these field since science and technology (in every essence) is always changing, and society is becoming more aware of the issues that are developing over time. I want to specialize in a career where I can prevent the capitalization on medications for life-changing treatments and procedures. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the moment academically, I spend most of my time learning organic chemistry, but I am also involved in Model UN and Northwestern's South Asian Student Alliance. When I'm not in the classroom or studying for an exam, I am usually at the gym, lifting weights or playing basketball. Another major hobby of mine is food science. I enjoy discovering the scientifically best ways to cook a pizza, bake chocolate-chip cookies, and breakfast through
