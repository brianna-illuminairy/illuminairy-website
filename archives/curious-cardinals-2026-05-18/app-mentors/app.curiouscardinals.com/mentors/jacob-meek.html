xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f20147c3-65d9-4870-8ab9-e948ff0a5540\"}":{"__typename":"Favorites","uuid":"f20147c3-65d9-4870-8ab9-e948ff0a5540","photoUrl":"https://ucarecdn.com/4781f9e4-9f36-4a92-9373-1cb1169858ca/","title":"Atomic Habits","type":"BOOK"},"Favorites:{\"uuid\":\"30e6bebc-1908-4829-86dc-b80d0d1f73d5\"}":{"__typename":"Favorites","uuid":"30e6bebc-1908-4829-86dc-b80d0d1f73d5","photoUrl":"https://ucarecdn.com/87cd816a-3b56-4999-b775-282fae54fc57/","title":"Chicago","type":"CITY"},"Favorites:{\"uuid\":\"e10c4edf-8c1d-4d70-af9a-e085ba690782\"}":{"__typename":"Favorites","uuid":"e10c4edf-8c1d-4d70-af9a-e085ba690782","photoUrl":"https://ucarecdn.com/3d08d5dd-d311-4d6d-bdce-95300741f20f/","title":"Rory McIlroy","type":"ATHLETE"},"CausesSupported:{\"uuid\":\"f57fdebd-cd76-4cc5-b6da-d2caeb3e9582\"}":{"__typename":"CausesSupported","uuid":"f57fdebd-cd76-4cc5-b6da-d2caeb3e9582","name":"Forgotten Harvest","description":"\u003cp\u003eDetroit's largest food rescue organization\u003c/p\u003e","photoUrl":"https://ucarecdn.com/07c4df8b-60dd-4580-b355-26693454b951/"},"CausesSupported:{\"uuid\":\"a06c7814-4860-4313-80b3-fb86f691d0d8\"}":{"__typename":"CausesSupported","uuid":"a06c7814-4860-4313-80b3-fb86f691d0d8","name":"Wounded Warrior Project","description":"\u003cp\u003eNon-profit organization raising money for injured veterans\u003c/p\u003e","photoUrl":"https://ucarecdn.com/457ee937-cf5a-4de9-bfd0-e61e64f9d888/"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"098b25af-90d1-41ef-a9ae-af013761d565\"}":{"__typename":"DeepDives","uuid":"098b25af-90d1-41ef-a9ae-af013761d565","content":"\u003cp\u003eMy greatest role model is my Mom. My Mom is the hardest working person I have ever met, and yet with all the hats she wears, she always finds ways to make those around her feel special. She is always willing to drop what she is doing to help someone else, and yet still manages to be unbelievably productive. It's my hope that one day people will describe me this same way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"648a915a-6fff-41e1-8eef-fc038d29f40d\"}":{"__typename":"DeepDives","uuid":"648a915a-6fff-41e1-8eef-fc038d29f40d","content":"\u003cp\u003eA typical summer day for me in high school would look like running in the morning, working during the day (soccer officiating, golf caddying, waiting tables, etc.)and hanging out with friends at night m playing video games, watching movies, riding dirt bikes, etc.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"2212f2c2-a527-4595-9fc5-fc7764f4586b\"}":{"__typename":"DeepDives","uuid":"2212f2c2-a527-4595-9fc5-fc7764f4586b","content":"\u003cp\u003eThe reason I'm pursuing mentorship is that I believe investing in others is the key to a happy, productive, inclusive, and uplifting society. It's so easy to spend our entire days wrapped in our own bubble and only thinking about ourself, especially when you are ambitious and have big dreams. However, investing in others is how you build one another up. People feed off of one another's actions and energy and if more people took interest in one another I truly believe our world would be a kinder and more complete place.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFurthermore, young people today face very unique challenges. With social media, the internet, and constant connectivity there are many positive and negative implications, especially for students. It's my hope that I can help mentees navigate these challenges, and take some weight off of their shoulders.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5ae544f0-c930-460b-bfc9-4d3dd8bb3623\"}":{"__typename":"DeepDives","uuid":"5ae544f0-c930-460b-bfc9-4d3dd8bb3623","content":"\u003cp\u003eI'd tell myself that if something is difficult that probably means it's worth doing. One of the biggest mistakes someone can make is to try to make their life as easy as possible. Of course, it's essential to life to have fun and connect with those around you but it's equally important to embrace challenges with open arms.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"bb90dde2-f44b-4997-83cf-bfa11d252f3c\"}":{"__typename":"School","uuid":"bb90dde2-f44b-4997-83cf-bfa11d252f3c","name":"Northville High School","city":"Northville","type":"HIGH","state":"Michigan","country":"United States","zip":"48168"},"Education:{\"uuid\":\"70d7477c-c6b7-4ad5-9b71-610383884157\"}":{"__typename":"Education","uuid":"70d7477c-c6b7-4ad5-9b71-610383884157","school":{"__ref":"School:{\"uuid\":\"bb90dde2-f44b-4997-83cf-bfa11d252f3c\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"8e30f18d-6882-44b6-9b6f-92b4f02dbfb3\"}":{"__typename":"School","uuid":"8e30f18d-6882-44b6-9b6f-92b4f02dbfb3","name":"Michigan State University","city":"East Lansing","type":"COLLEGE","state":"Michigan","country":"United States","zip":"48823"},"Education:{\"uuid\":\"08c53972-3d11-4aef-8434-3c659d6a5609\"}":{"__typename":"Education","uuid":"08c53972-3d11-4aef-8434-3c659d6a5609","school":{"__ref":"School:{\"uuid\":\"8e30f18d-6882-44b6-9b6f-92b4f02dbfb3\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Finance","degree":null},"Testimonial:a8074acc-d32a-4d14-af31-bc3a846aee25":{"__typename":"Testimonial","id":"a8074acc-d32a-4d14-af31-bc3a846aee25","text":"Working with Jacob was a very meaningful part of our son's year.  We were so impressed with how Jacob spent the time learning about his interests and helping him take everything to the next level. It has inspired him to think more carefully about his academic goals as well as his sports goals.  We really appreciate how Jacob has encouraged our son to push himself.  They really formed a special relationship.","date":"2025-05-23 22:36:53.047+00","rating":5,"endorser":{"__typename":"Endorser","name":"hillary","tagline":"","avatar":null}},"Testimonial:b81a3aaa-08ff-4433-a3d0-c1350f1d8662":{"__typename":"Testimonial","id":"b81a3aaa-08ff-4433-a3d0-c1350f1d8662","text":"Mentor Jacob Meek’s guidance for my freshman Jackson Getting has been stellar. Jacob has been communicative, forward thinking, got along great with Jackson’s entrepreneurial spirit and provided him with a perfect amount of nudge to guide him on his E-bike sales business. This was one of the best investments I’ve ever made for my child’s academic career. Thank you, Jacob of Curious Cardinals.","date":"2025-05-21 22:59:47.902+00","rating":5,"endorser":{"__typename":"Endorser","name":"Ro Liu","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"dd3a7cdd-f467-45a5-8f2f-747dd7d32eb6\"}":{"__typename":"MentorPublicProfile","uuid":"dd3a7cdd-f467-45a5-8f2f-747dd7d32eb6","displayName":"Jacob M.","slug":"jacob-meek","biography":"\u003cp\u003eHey all! My name is Jacob Meek, and I am a senior at Michigan State University currently pursuing a Bachelor's degree in Finance with a minor in Sales Leadership. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about many things, both in the classroom and outside of it. Academically and professionally I'm interested in Finance, Business, Marketing, Sales, and what makes a business special. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I've found is that typically what makes any organization special is the people within it. This is why I am pursing mentorship with Curious Cardinals. Every person has unbelievable potential, the challenge is unlocking it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school and work, I love to be outdoors, go for runs, go to the gym, go camping, and play just about any sport. I'm very competitive and sports are a healthy outlet for this competitive nature. More than anything, I'm very passionate about health. With the constant stresses of balancing social life, school, work, etc., sometimes one can forget about their physical and mental health. Personally, I always try to prioritize my physical and mental health first as these are the building blocks of joy and success. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, the first thing that I can guarantee is my efforts. When it comes to preparing lessons, maintaining an organized schedule, thoroughly covering the selected subjects, and fostering an optimal learning environment for the mentee, I will give my 110%. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, it's my hope that each mentee I work with will feel stress-free during our sessions and that my involvement in their learning experience can help alleviate the stresses involved with school and growing up. Being a mentor isn't just about covering the selected lessons and topics, it's about creating a holistic learning experience and a real connection.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you made it this far, thanks for reading my bio. I am looking forward to my work with Curious Cardinals and the wonderful families that use our services!\u003c/p\u003e","teachingVideoPlaybackId":"2QKIFF02Pa500CBt7pDaRYMazd2oBie00dNp02TKUwazhbw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my proudest achievements in life is when I placed All-State in track my senior year of high school. While in comparison to academic and professional achievements, athletic achievements seem insignificant (especially since I am no longer an \"athlete\" on paper), however this one meant a lot to me. Growing up playing soccer and basketball, I was told that I was slow (I was in fact pretty slow). However, I liked to run and I am exceptionally competitive. After years of training I became an elite runner in the state of Michigan and eventually placed All-State. I couldn't even tell you where my old metals and trophies are, but this achievement is a constant reminder to me that hard work and self-belief are the two most powerful forces in the world.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f20147c3-65d9-4870-8ab9-e948ff0a5540\"}"},{"__ref":"Favorites:{\"uuid\":\"30e6bebc-1908-4829-86dc-b80d0d1f73d5\"}"},{"__ref":"Favorites:{\"uuid\":\"e10c4edf-8c1d-4d70-af9a-e085ba690782\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"f57fdebd-cd76-4cc5-b6da-d2caeb3e9582\"}"},{"__ref":"CausesSupported:{\"uuid\":\"a06c7814-4860-4313-80b3-fb86f691d0d8\"}"}],"major":"Finance","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"098b25af-90d1-41ef-a9ae-af013761d565\"}"},{"__ref":"DeepDives:{\"uuid\":\"648a915a-6fff-41e1-8eef-fc038d29f40d\"}"},{"__ref":"DeepDives:{\"uuid\":\"2212f2c2-a527-4595-9fc5-fc7764f4586b\"}"},{"__ref":"DeepDives:{\"uuid\":\"5ae544f0-c930-460b-bfc9-4d3dd8bb3623\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3c67ee42-a287-4270-ba42-42645d69ed4d/-/preview/-/format/jpg/","https://ucarecdn.com/056320dc-ccdf-4807-bb8f-e1e494cbe596/-/preview/-/format/jpg/","https://ucarecdn.com/e46b6d1a-713d-41ec-abc5-9933dc7e2249/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"70d7477c-c6b7-4ad5-9b71-610383884157\"}"},{"__ref":"Education:{\"uuid\":\"08c53972-3d11-4aef-8434-3c659d6a5609\"}"}],"hiredAt":"2024-09-02T13:09:05.549Z","topics":["Writing","Reading","Public Speaking","Business / Entrepreneurship","Finance / Investing","Negotiation","K-5 Grade Math","Pre-Algebra","Geography","Executive Function","Economics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:a8074acc-d32a-4d14-af31-bc3a846aee25"},{"__ref":"Testimonial:b81a3aaa-08ff-4433-a3d0-c1350f1d8662"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jacob-meek\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"dd3a7cdd-f467-45a5-8f2f-747dd7d32eb6\"}"}}},"_sentryTraceData":"edd2985efd5f4ad2bbb31b554f728aeb-b42e20a85e0067bd-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=edd2985efd5f4ad2bbb31b554f728aeb,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jacob-meek"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/
