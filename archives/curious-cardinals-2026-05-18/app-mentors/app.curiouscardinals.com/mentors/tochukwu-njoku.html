xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ca56011d-7a3f-446a-8236-8c14dd7d61e5\"}":{"__typename":"Favorites","uuid":"ca56011d-7a3f-446a-8236-8c14dd7d61e5","photoUrl":"https://ucarecdn.com/84e3f87c-edf0-446f-abb0-1d003425fc4a/","title":"Boston ","type":"CITY"},"Favorites:{\"uuid\":\"c8e00a23-ef81-47c7-8295-4a4ff592f34d\"}":{"__typename":"Favorites","uuid":"c8e00a23-ef81-47c7-8295-4a4ff592f34d","photoUrl":"https://ucarecdn.com/769c0e5d-4913-4bb4-876b-d96f64ad72a3/","title":"The Inner Game of Tennis ","type":"BOOK"},"CausesSupported:{\"uuid\":\"53273028-2adc-4039-988f-dbc4cf36f080\"}":{"__typename":"CausesSupported","uuid":"53273028-2adc-4039-988f-dbc4cf36f080","name":"New Haven Reads ","description":"\u003cp\u003eI love this non-profit because you get to impact a child's future through tutors\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c0fe7453-646e-4454-b97b-b5af749a1df5\"}":{"__typename":"DeepDives","uuid":"c0fe7453-646e-4454-b97b-b5af749a1df5","content":"\u003cp\u003eIn my spare time, I enjoy trying out new things and pushing myself out of my comfort zone. Whether that is playing a new sport, eating at a new restaurant, or visiting a new city. I try to expand my horizons because I know there is so much out there to see and explore, and it would be a shame if i didnt give myself that opportunity to explore and grow. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2c67efe4-687e-438b-a54d-d116d8f97eb7\"}":{"__typename":"DeepDives","uuid":"2c67efe4-687e-438b-a54d-d116d8f97eb7","content":"\u003cp\u003eIf I could go back to high school, I would tell my high school self to \"enjoy your time there\". My high school self was so caught up trying to get into a good college that I forgot to step back and really experience high school. I don't regret my actions because I got what I wanted, but I definitely overdid it sometimes. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ec1a9c3a-0080-4ad2-b21d-d37e0312525d\"}":{"__typename":"DeepDives","uuid":"ec1a9c3a-0080-4ad2-b21d-d37e0312525d","content":"\u003cp\u003eI want to finish my bucketlist. I have a couple of things that I really want to try, like skydiving, bungee jumping, driving an F1 car, and traveling around the world to visit new continents. I really want to live a life with as few regrets as possible. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"7d27ebcb-a4c8-4649-b403-ef9940248da7\"}":{"__typename":"DeepDives","uuid":"7d27ebcb-a4c8-4649-b403-ef9940248da7","content":"\u003cp\u003eI love mentorship because it is something I love doing. I wish that I had more opportunities like these in middle school and high school, because I know how much they could impact a child's growth. I am where I am today because of the teachers, coaches, and people who have mentored me in different ways. I have also grown to enjoy that process, and I want to give back. My goal is to help in whatever way I can, even if it is just for a brief while. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"dceafcff-e5ea-48ce-b12b-154c43188eac\"}":{"__typename":"Education","uuid":"dceafcff-e5ea-48ce-b12b-154c43188eac","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Molecular Cellular and Developmental Biology","degree":null},"School:{\"uuid\":\"02b7782f-c05e-462e-bd35-2c875ead6f9a\"}":{"__typename":"School","uuid":"02b7782f-c05e-462e-bd35-2c875ead6f9a","name":"John D. O'Bryant School of Mathematics and Science","city":"Boston","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02120"},"Education:{\"uuid\":\"ac162217-b5c7-4d09-8d23-437ddb819f86\"}":{"__typename":"Education","uuid":"ac162217-b5c7-4d09-8d23-437ddb819f86","school":{"__ref":"School:{\"uuid\":\"02b7782f-c05e-462e-bd35-2c875ead6f9a\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"4d47bb69-1256-418f-aaa3-0a47dc660720\"}":{"__typename":"MentorPublicProfile","uuid":"4d47bb69-1256-418f-aaa3-0a47dc660720","displayName":"Tochukwu N.","slug":"tochukwu-njoku","biography":"\u003cp\u003eHello, my name is Tochukwu Njoku. I was born and raised in Umuahia, Nigeria, and moved to Boston, Massachusetts, with my family in 2019. A few months after we arrived, the pandemic hit the United States, which made adjusting to a new place and culture especially challenging. I was able to find my footing in high school through sports. I played varsity soccer as a right back and served as the captain of the volleyball team. Currently, I am a second-year student at Yale University, majoring in Molecular, Cellular, and Developmental Biology with a concentration in Neurobiology. I am interested in neurobiology because I want to understand the physiology of the nervous system and how it allows the body to coordinate activities in response to the environment.\u003c/p\u003e\u003cp\u003eOutside of my major, I enjoy taking math classes, and I am currently studying Chinese. My goal is to become proficient before I graduate. I am also a member of the Yale Club Volleyball team and work as an undergraduate research assistant in the McNamara Lab, where I study multicellular self-organization and the use of synthetic biology to control cell signaling interactions. Some of my hobbies include working out, trying new restaurants, and dancing. I consider myself an outgoing and active person. Sports and fitness are very important to me because they have taught me many lessons that extend beyond the court and the field. They also help keep me grounded when things get stressful in school or life. When I am having a bad day or need to relieve stress, engaging in physical activity is my outlet.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI want to be a mentor at Curious Cardinals because I understand the importance of mentorship in a young person’s development, especially during the high school years when many students are still figuring out who they are and what they want to pursue. I am where I am today because of the guidance and support of my coaches, teachers, supervisors, older teammates, and family members, who have each served as mentors in my life one way or another. Because of their impact on me and my growth, I hope to give back by supporting and guiding others, even if the role I play is small. I look forward to meeting you all!\u003c/p\u003e","teachingVideoPlaybackId":"bpCMQ5f7vd00KMvwoK001h8o00gIrZtkntzNW38IJzzuwI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy team and I won second place at the volleyball nationals in Pheonix Arizona, last year\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ca56011d-7a3f-446a-8236-8c14dd7d61e5\"}"},{"__ref":"Favorites:{\"uuid\":\"c8e00a23-ef81-47c7-8295-4a4ff592f34d\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"53273028-2adc-4039-988f-dbc4cf36f080\"}"}],"major":"Molecular Cellular and Developmental Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c0fe7453-646e-4454-b97b-b5af749a1df5\"}"},{"__ref":"DeepDives:{\"uuid\":\"2c67efe4-687e-438b-a54d-d116d8f97eb7\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec1a9c3a-0080-4ad2-b21d-d37e0312525d\"}"},{"__ref":"DeepDives:{\"uuid\":\"7d27ebcb-a4c8-4649-b403-ef9940248da7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/18d09ebd-c19b-43de-8568-5210e4be3190/-/preview/-/format/jpg/","https://ucarecdn.com/4bc8768e-f230-4b73-889f-a7277291fb35/-/preview/-/format/jpg/","https://ucarecdn.com/2cd1e7fc-e78b-464d-bf7a-a048025bc867/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"dceafcff-e5ea-48ce-b12b-154c43188eac\"}"},{"__ref":"Education:{\"uuid\":\"ac162217-b5c7-4d09-8d23-437ddb819f86\"}"}],"hiredAt":"2026-02-26T20:40:43.132Z","topics":["Algebra I","Algebra II","Calculus","Precalculus / Trigonometry","Biology","Chemistry","College Essay Writing","Reading","Sports Journalism","Coding / Programming","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"
