xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"00d24bfb-9848-4d2d-8e99-74a7f5cae6d1\"}":{"__typename":"DeepDives","uuid":"00d24bfb-9848-4d2d-8e99-74a7f5cae6d1","content":"\u003cp\u003eComing from an immigrant family, I've seen the lasting impact that support and mentorship can have. Personally, I've been incredibly fortunate to have this support growing up--from the Ethiopian Diaspora community around me to teachers who've ignited my intellectual curiosity to mentors who've helped counsel and guide my academic and professional trajectory. In high school, I sought to give back by tutoring students at my high school and others in my community, and now in college, I hope to do the same through Curious Cardinals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e4b53e91-27ad-4207-acc6-4cb0382c2329\"}":{"__typename":"DeepDives","uuid":"e4b53e91-27ad-4207-acc6-4cb0382c2329","content":"\u003cp\u003eI really enjoy dancing! In high school, I was part of an Ethiopian-Eritrean dance group with my friends and we would travel to different schools and perform at assemblies or Culture Nights! At Harvard, I'm part of Dankira (the Ethiopian-Eritrean dance troupe) and Candela (the Latin American dance troupe) where I practice and put on performances for different events and gatherings for the Student Body!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"172dd6c4-69b3-444a-8236-bc46641cb7a8\"}":{"__typename":"DeepDives","uuid":"172dd6c4-69b3-444a-8236-bc46641cb7a8","content":"\u003cp\u003eI originally came into Harvard thinking I'd be a Government major, since I was interested in pre-law and policy work. But over time, I found that Social Studies fit my interests better! At Harvard, classes from Government, Economics, History, Sociology, and other social science departments count towards a Social Studies degree. And for me, I enjoyed being able to take classes outside of just Government in order to better understand and contextualize  the issues of law, international justice, and US Politics which fascinate me!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b3760408-3478-4153-8dc9-9bb4276798bb\"}":{"__typename":"DeepDives","uuid":"b3760408-3478-4153-8dc9-9bb4276798bb","content":"\u003cp\u003eThe summer after my Sophomore Year in high school, I visited my dad's old high school in Ethiopia which ran a scholarship program to sponsor needy students. I met with the headmaster, copied important paperwork, and when I came back worked with my school to raise money for a scholarship to sponsor a student from Ethiopia to attend the high school.\u003c/p\u003e\u003cp\u003eThe summer after my Junior Year, I landed an internship at a local law firm in Maryland. I spent the summer learning the fundamentals of the Maryland court system, the basic structure and timelines of cases, and helped with ongoing cases by sorting through discovery files, conducting case law research, and completing other tasks.\u003c/p\u003e\u003cp\u003eFinally, the summer after my Senior Year, I worked an internship with an international NGO, Jesuit Refugee Services/USA. I got to sit in on meetings with other human rights organizations, congressional offices, and stakeholders. Furthermore, I worked with other student leaders across the country to help them form social justice action plans.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"33c2ed0a-fdb7-445e-a5c2-8376051981b1\"}":{"__typename":"School","uuid":"33c2ed0a-fdb7-445e-a5c2-8376051981b1","name":"Georgetown Preparatory School","city":"North Bethesda","type":"HIGH","state":"Maryland","country":"United States","zip":"20852"},"Education:{\"uuid\":\"b4439edc-9c7e-423d-8e71-7da0079e359d\"}":{"__typename":"Education","uuid":"b4439edc-9c7e-423d-8e71-7da0079e359d","school":{"__ref":"School:{\"uuid\":\"33c2ed0a-fdb7-445e-a5c2-8376051981b1\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"47814da8-8eec-47b4-8262-ac1d76536ee1\"}":{"__typename":"Education","uuid":"47814da8-8eec-47b4-8262-ac1d76536ee1","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Social Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"af4aea4f-47b8-4114-b718-90a0f7733f97\"}":{"__typename":"MentorPublicProfile","uuid":"af4aea4f-47b8-4114-b718-90a0f7733f97","displayName":"Ethan R.","slug":"ethan-ristu","biography":"\u003cp\u003eHi, my name is Ethan! I’m a freshman at Harvard College studying Social Studies (Harvard's version of PPE: Politics, Philosophy, and Economics) with a citation in Mandarin. I'm on the pre-law track at Harvard and am academically interested in government and politics as well as international relations and current events!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have a lot of experience in being involved with law (I've landed an internship at a law office in high school) or social justice (I've organized teams to volunteer and lobby policy makers-even meeting President Biden himself) as a high schooler for any mentees interested! Furthermore, I can help with any mentees navigating the College Admissions process (I was accepted into the 7 Ivies I applied to, other incredible schools like Georgetown, Duke, and Notre Dame, and received full tuition merit scholarships from schools like Vanderbilt, WashU in St. Louis, and University of Maryland) as well as SAT Prep (I self studied and scored a 1600)! I'm strongest in the humanities, but I can also help students who'd like support in mathematics up to basic calculus (by my senior year of high school I was taking multivariable calculus). I can also help students who need help with time-management or organization!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I served as President of our Black Student Association, where I facilitated hard conversations and built community. CoPresident of our International Relations Club, where I traveled on our Model UN Team and discussed current Events. I also ran Cross Country and Track \u0026amp; Field. At Harvard, I've taken classes on Government, History, Economics, Law, and other areas of the social sciences if you're interested in hearing about that. I'm also part of several clubs and organizations! I serve as Freshman Representative for the Harvard Black Men's Forum, Internal Relations Chair for the Harvard Undergraduate Legal Committee, Public Relation Cochair for the Student Government, and Programming Associate for the Harvard College China Forum!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love learning and experiencing different cultures- this summer, I'll be studying abroad in Taiwan to continue learning Mandarin! I've been a massive bookworm since I was a kid and have been trying to read as much as I used to--if you have any book recs I'll try my best to get to them :) I also like spending time in the gym and weight-lifting when I have spare time!\u003c/p\u003e","teachingVideoPlaybackId":"9DGPpPr2ov301GfMbDkCI1trPt5W00EV2JR00u5mIZXBvI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Social Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"00d24bfb-9848-4d2d-8e99-74a7f5cae6d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4b53e91-27ad-4207-acc6-4cb0382c2329\"}"},{"__ref":"DeepDives:{\"uuid\":\"172dd6c4-69b3-444a-8236-bc46641cb7a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"b3760408-3478-4153-8dc9-9bb4276798bb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a4f43a4c-66bf-49f8-ae34-4c97b9d2f5b5/-/preview/-/format/jpg/","https://ucarecdn.com/7ca5e39f-76b0-4e6b-8c3a-efe9d8f6f118/-/preview/-/format/jpg/","https://ucarecdn.com/7e4095de-0274-4c69-b65c-a8f757cae058/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b4439edc-9c7e-423d-8e71-7da0079e359d\"}"},{"__ref":"Education:{\"uuid\":\"47814da8-8eec-47b4-8262-ac1d76536ee1\"}"}],"hiredAt":"2025-03-05T11:11:53.871Z","topics":["Algebra I","Algebra II","Calculus","Precalculus / Trigonometry","Statistics","Writing","Mandarin Chinese","Latin","Economics","Computer Science","History","Reading"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile(
