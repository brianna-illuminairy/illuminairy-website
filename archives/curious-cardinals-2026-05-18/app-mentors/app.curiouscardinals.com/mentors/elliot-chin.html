 for F500 and former decacorns on 5-figure deals. His experience there ranges from evaluating enterprise sales platform market fit to developing an anonymized data licensing strategy. In high school, Elliot was involved in public forum debate, FIRST robotics challenge, and student council. He also published first-author research with the Durmus Lab at Stanford and led his school’s Community Service Learning Club.\n\nElliot has been involved in education since early high school. He has experience teaching CS, chemistry, and math in group and individual settings. He developed LEGO robotics curriculum for the organization Peninsula Bridge and led the creation of a hands-on, robotics-based math class. Elliot is a strong proponent of experiential learning and emphasizes explorative education and learning from failure. Students should expect to learn by building analytical models in a hands-on fashion.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/8fb70615-d040-4d9b-a547-de1a1c0583bc/-/crop/666x666/75,99/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"dd4925ed-29ee-40d0-a9de-9b969f65b088\"}"}],"hiredAt":"2022-07-27T02:43:07.000Z","topics":["Chemistry","Biology","STEM Project","Physics","Precalculus / Trigonometry","Geometry","Statistics","Finance / Investing","Calculus","Economics","K-5 Grade Math","Algebra I","Pre-Algebra","Algebra II","6-8 Grade Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elliot-chin\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c2e3be1f-03c0-42fd-b669-0c40a20b401f\"}"}}},"_sentryTraceData":"306b019db22e49a89ba8b76c0e155b37-96e774d646d3a7d6-1","_sentryBaggage":"sentry-environment
