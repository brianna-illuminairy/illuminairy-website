xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"3dd384ec-c609-4d31-be99-658ca1284a04\"}":{"__typename":"DeepDives","uuid":"3dd384ec-c609-4d31-be99-658ca1284a04","content":"\u003cp\u003eWith any form of tutoring/mentoring I've done in the past, I've always tried to nurture an appreciation for asking \"why?\" beyond \"what/how?\" when it comes to learning. In my experience as a Curious Cardinals mentor, I've become proudest of the growth I've been able to witness as students progress from asking themselves \"what is the answer?\" to \"why is that the answer?\" Ultimately, I think that developing such a perspective is the most valuable thing for a student and the best thing a mentor can encourage.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"12b38e94-32eb-462c-9ba4-eed18387cd6f\"}":{"__typename":"Education","uuid":"12b38e94-32eb-462c-9ba4-eed18387cd6f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Bioengineering and Electrical Engineering","degree":null},"School:{\"uuid\":\"12a8d8be-2886-4fd9-9ace-64618c6b2b53\"}":{"__typename":"School","uuid":"12a8d8be-2886-4fd9-9ace-64618c6b2b53","name":"Washtenaw International High School \u0026 Middle Academy","city":"Ypsilanti","type":"HIGH","state":"Michigan","country":"United States","zip":"48197"},"Education:{\"uuid\":\"1b86a8fd-29ac-47c0-b97c-36ae57574301\"}":{"__typename":"Education","uuid":"1b86a8fd-29ac-47c0-b97c-36ae57574301","school":{"__ref":"School:{\"uuid\":\"12a8d8be-2886-4fd9-9ace-64618c6b2b53\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"38327beb-3efc-4786-8856-b2d47584d9d0\"}":{"__typename":"MentorPublicProfile","uuid":"38327beb-3efc-4786-8856-b2d47584d9d0","displayName":"Andrew Y.","slug":"andrew-h","biography":"\u003cp\u003eAndrew is currently studying at Stanford University (Class of '25) as a double-major in Bioengineering and Electrical Engineering.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAn avid fanatic for all things innovative and biological, Andrew has had experience as a researcher in multiple types of biology/medicine research groups, most recently developing lab-patented hydrogel platforms for enhanced cranial bone regeneration in the Fan Yang Lab at Stanford Medicine/Biomedical Innovations. He is now currently working with an independent, close group of peers on a new project tackling challenges in medicinal chemistry, hoping to emerge out of stealth soon. He is also an active member of the Stanford Student Space Initiative's Biology Team, where he helped develop a proposal for the ISS National Lab Research Announcement detailing utilization of microgravity conditions found in Low Earth Orbit for novel vasculature bioprinting methods. Having also previously conducted research at the University of Michigan Rogel Cancer Center, his scientific interests dip into many realms of cell and synthetic biology, specifically in novel cancer therapies, tissue regeneration, nanotechnology, senescence, and the potential explosion of a not-so-distant, space-based biotechnology industry. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOutside of the lab, Andrew is also passionate about film studies and sci-fi (from Wong Kar-wai to Andrei Tarkovsky to Agnès Varda to Hideaki Anno), having written and directed his own film at Stanford, and continues to nurture a lifelong hobby of creative writing. An exercise nut hailing from Michigan, Andrew has also competed at the state/national level for ice hockey and lacrosse for over 10 years while enjoying a slew of other sports including swimming, football, basketball, and fishing. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eBeyond anything else, Andrew is inspired by the sincerity of passionate conversations on any/all interests: be it from philosophy to astrophysics or literature to pure mathematics, he is always ready to explore this crazy universe of curiosities in the next chat.\u003c/p\u003e","teachingVideoPlaybackId":"iKGcMU005GsN8FqCyAw4tKRbhmfC7HXeldev6ZYhoVG8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Bioengineering and Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3dd384ec-c609-4d31-be99-658ca1284a04\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a857fdde-6a98-48a6-a73b-92c89ef5f52c/-/crop/623x623/29,122/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"12b38e94-32eb-462c-9ba4-eed18387cd6f\"}"},{"__ref":"Education:{\"uuid\":\"1b86a8fd-29ac-47c0-b97c-36ae57574301\"}"}],"hiredAt":"2022-06-13T04:30:28.000Z","topics":["Geometry","Chemistry","6-8 Grade Science","Algebra I","Pre-Algebra","Philosophy","STEM Project","Literature","K-5 Grade Math","Physics","Biology","Algebra II","Writing","Computer Science","Coding / Programming","Medicine / Health","Reading","Precalculus / Trigonometry","Film / Theater","Calculus"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.
