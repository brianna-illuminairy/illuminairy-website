xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"7899a05e-ee8d-4d57-920f-4086e5dbfb0b\"}":{"__typename":"DeepDives","uuid":"7899a05e-ee8d-4d57-920f-4086e5dbfb0b","content":"\u003cp\u003eAs a high school student, I was very academically driven. My schedule was constantly packed with various clubs and volunteering commitments. One of my fondest memories was organizing a Valentine's Day bake sale where we sold homemade dog treats - it was such a success!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d5b06c8a-fedc-464e-8226-d92c52ad2dfb\"}":{"__typename":"DeepDives","uuid":"d5b06c8a-fedc-464e-8226-d92c52ad2dfb","content":"\u003cp\u003eI'm very grateful to have made some very close friends in college! We spend a lot of time together and, if ever we get a week off of school, we like to go backpacking in the mountains. Recently, I climbed a volcano in the Canary Islands with one of my best friends! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"de1f7554-1925-42f1-b516-dad202cf882f\"}":{"__typename":"DeepDives","uuid":"de1f7554-1925-42f1-b516-dad202cf882f","content":"\u003cp\u003eI started college on the pre-veterinary track and have done a lot of exploring, but found that I always enjoyed my math classes the most of anything I was taking. I felt quite uncertain for a while there and was really eager to figure everything out, but have now learned to enjoy the process of discovery and am grateful for the varied background that my period of exploration resulted in.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1ecc851c-d17f-4fcb-8ec9-3d05a909fc53\"}":{"__typename":"DeepDives","uuid":"1ecc851c-d17f-4fcb-8ec9-3d05a909fc53","content":"\u003cp\u003eI am working on recording and releasing an album! I love to play guitar and sing whenever I can, and I listen to a broad range of music - from Gracie Abrams to Peal Jam. I'm always trying to think of good lyrics, so I sometimes stop whatever I'm doing to jot ideas down! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"9a93e4f5-7658-45cf-a48f-29d795c92656\"}":{"__typename":"School","uuid":"9a93e4f5-7658-45cf-a48f-29d795c92656","name":"Horace Greeley High School","city":"Chappaqua","type":"HIGH","state":"New York","country":"United States","zip":"10514"},"Education:{\"uuid\":\"af93ea67-20a8-418c-9fa7-403f34a2bf40\"}":{"__typename":"Education","uuid":"af93ea67-20a8-418c-9fa7-403f34a2bf40","school":{"__ref":"School:{\"uuid\":\"9a93e4f5-7658-45cf-a48f-29d795c92656\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"4d09ffed-cb50-4e82-9419-fd0241ee208c\"}":{"__typename":"School","uuid":"4d09ffed-cb50-4e82-9419-fd0241ee208c","name":"Amherst College","city":"Amherst","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"01002"},"Education:{\"uuid\":\"d5cdae7d-2a99-4901-b642-ce6d7aab82fb\"}":{"__typename":"Education","uuid":"d5cdae7d-2a99-4901-b642-ce6d7aab82fb","school":{"__ref":"School:{\"uuid\":\"4d09ffed-cb50-4e82-9419-fd0241ee208c\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"12f3d688-9c5f-43af-865c-ca2b49f74a15\"}":{"__typename":"MentorPublicProfile","uuid":"12f3d688-9c5f-43af-865c-ca2b49f74a15","displayName":"Karinna C.","slug":"karinna-cvijanovich","biography":"\u003cp\u003eHey there! I'm Karinna.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've spent the last four years studying math at Amherst College, and considering every possible career path along the way. After graduation, I'll be taking a gap year to do humanitarian work abroad and pursue music production before starting my master's in Electrical Engineering at Dartmouth. This exploration has taught me valuable lessons about discovering purpose. A favorite mantra of mine is \"pay attention to what you pay attention to\"—I am eager to help students recognize their natural interests and build meaningful paths around them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've been particularly grateful for the liberal arts approach to mathematics—focusing not just on formulas and calculations, but on the spirit of learning, articulating ideas, and communicating complex concepts. Beyond math, I've pursued extensive coursework in physics and computer science, creating a well-rounded STEM education.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe intersection of math and music is a particular passion of mine, and I'm excited to incorporate these interdisciplinary connections into our learning sessions. My love for music production began in eleventh grade when my English teacher gave us creative freedom for our assignment on \"A Streetcar Named Desire.\" I chose to write a song inspired by the text, and I've been recording and producing music ever since. I understand how daunting the technical barriers to music creation can be, and am committed to empowering students to be heard and express themselves.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAside from music, research is another avenue through which I've pursued my various curiosities. My research journey began in high school, where I participated in our school's selective science research program. After working as a wolf caretaker in Colorado one summer, I designed my own research study focused on wolf hormones and behavior, which earned me first place in a regional competition. Last summer, I was awarded a full scholarship to Stanford's Center for Computer Research in Music and Acoustics while simultaneously working as a machine learning intern at New York University's Music and Audio Research Laboratory. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I strive to break down stereotypes about who \"belongs\" in STEM fields. As someone who loves math but doesn't fit the typical mathematician stereotype, I'm committed to empowering students to embrace their love of math regardless of their background or identity. Math is for everyone!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my early education, I was driven by perfectionism. College opened my eyes to the power of a more balanced approach. I'm passionate about helping students set healthy goals while maintaining their wellbeing and joy in learning. When I'm not tutoring or studying, you'll likely find me backpacking or exploring the outdoors with the amazing friends I've made in college.\u003c/p\u003e","teachingVideoPlaybackId":"f6Jfm6kf8vtQEKVu1ooujeybL2WZXkJD00Z00trkCLZtA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mathematics","deepDives":[{"__ref":"D
