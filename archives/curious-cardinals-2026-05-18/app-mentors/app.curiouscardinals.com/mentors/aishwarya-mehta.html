xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"c056180d-63cb-4c77-aa86-5a9fecd7663c\"}":{"__typename":"DeepDives","uuid":"c056180d-63cb-4c77-aa86-5a9fecd7663c","content":"\u003cp\u003eMy greatest source of motivation is my parents. My parents both came from disadvantaged backgrounds, moved to the United States, and worked extremely hard in order to give my brother and I opportunities to be successful. As a child, it was hard to understand the gravity of the sacrifices they made and obstacles they had to overcome, but as I have grown older, I feel truly grateful for all they have done for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"19b5c1ea-6ade-47a7-ac73-1d07e0985684\"}":{"__typename":"DeepDives","uuid":"19b5c1ea-6ade-47a7-ac73-1d07e0985684","content":"\u003cp\u003eGrowing up with an older brother who always seemed to learn everything with little to no trouble, I always felt a bit less than. However, I realized later on that each person has different affinities for different subjects, and different learning styles, and my brother and I were no different. When teaching others, I try to understand how they learn best, whether it’s by doing examples together, or having the time to try things independently. Additionally, I feel like I personally used to benefit when new concepts were broken up into smaller pieces, and so I try to incorporate that whenever I teach others.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"45c3e0ed-aa79-4b43-8456-407c417acf9b\"}":{"__typename":"DeepDives","uuid":"45c3e0ed-aa79-4b43-8456-407c417acf9b","content":"\u003cp\u003eI am most proud of the fact that I performed my Arangetram, which is the solo debut performance of a Bharatanatyam dancer. Training for my Arangetram was the most physically and mentally challenging experience I've ever had, and taught me how to push the limits I had placed on myself.\u0026nbsp;\u003c/p\u003e\u003cp\u003eSpecifically, I had to train for 6-8 hours everyday for 7 months, which caused me to develop an extreme knee problem. It was a given that I would be mentally exhausted from learning almost 3 hours of choreography, but I unexpectedly developed a severe knee problem 2 months into training. This problem would cause my knee to swell within 10 minutes of dancing, causing immense pain. I wanted to stop, but we had already booked a theater, invited all my friends and family, and gotten my costumes and jewelry. At that point I had no option but just to push through the mental barriers and give the best performance I could. I ended up having to take 4 Advil the day of the performance to keep the inflammation and pain at bay, but the experience taught me how powerful our minds are in pushing us to persevere under the worst circumstances.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9260dd39-6780-4125-b259-78b7bcc87694\"}":{"__typename":"DeepDives","uuid":"9260dd39-6780-4125-b259-78b7bcc87694","content":"\u003cp\u003eI love to spend quality time with my loved ones, spend time outdoors, and try new things! (whether they're experiences, restaurants, or recipes)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"34a6b6d7-4d7c-48f2-81f8-673422365ca4\"}":{"__typename":"School","uuid":"34a6b6d7-4d7c-48f2-81f8-673422365ca4","name":"Granada Hills Charter","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91344"},"Education:{\"uuid\":\"347ab1db-2134-406b-83aa-473d1103e23f\"}":{"__typename":"Education","uuid":"347ab1db-2134-406b-83aa-473d1103e23f","school":{"__ref":"School:{\"uuid\":\"34a6b6d7-4d7c-48f2-81f8-673422365ca4\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4021bd05-b7bb-471b-81a5-e5a98b0ec80a\"}":{"__typename":"Education","uuid":"4021bd05-b7bb-471b-81a5-e5a98b0ec80a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Management Science \u0026 Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"6ee2368e-9903-4316-8605-e536a94d43d1\"}":{"__typename":"MentorPublicProfile","uuid":"6ee2368e-9903-4316-8605-e536a94d43d1","displayName":"Aishwarya M.","slug":"aishwarya-mehta","biography":"\u003cp\u003eHi I’m Aishwarya! I’m a Los Angeles native, but my parents immigrated to the US from India. For college, I attended Stanford and majored in Management Science \u0026amp; Engineering. In my free time I love spending time outdoors, taking workout classes, cooking, and trying new restaurants with friends.\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile these are great facts, I feel like the following fun facts would help you get a better sense as to who I am:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eFun Fact 1:\u003c/strong\u003e As a kid, my mom didn’t let me watch TV during the school year, so I spent most of my free time secretly watching cooking videos on Youtube, then trying recipes on the weekends, which is how I learnt how to cook.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eFun Fact 2\u003c/strong\u003e: From ages 8 to 17, I took dance lessons in a 2,000 year old Indian dance style called Bharatanatyam. Upon completing my dance training at the age of 17, I trained for 7 months for my Arangetram, which is the traditional solo debut dance performance required by the dance form upon completion of training, which was almost 3 hours long.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eFun Fact 3: \u003c/strong\u003eDespite growing up in LA, I didn’t live close enough to the beach to learn how to surf; So when I had the opportunity, I decided to go on a 6 week trip to Hawaii, befriended a local surf shop employee, and took sunrise lessons from her until I was able to catch waves on my own!\u003c/p\u003e","teachingVideoPlaybackId":"jqOchjK1NApncFcqpSOTN7w01kHsRal00jDzw801Q3b8Zo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Management Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c056180d-63cb-4c77-aa86-5a9fecd7663c\"}"},{"__ref":"DeepDives:{\"uuid\":\"19b5c1ea-6ade-47a7-ac73-1d07e0
