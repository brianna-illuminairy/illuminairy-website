xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6739bb19-855f-47e8-9ad4-c723a9ccafa2\"}":{"__typename":"DeepDives","uuid":"6739bb19-855f-47e8-9ad4-c723a9ccafa2","content":"\u003cp\u003eI would tell myself to try new things and not just stick to what I'm already good at. Some of the most rewarding classes I took--and some of my closest friendships--came from stepping outside my comfort zone. I also think a lot of the limits we put on ourselves are artificial. When you challenge those assumptions, you often surprise yourself, and the experience ends up being incredibly rewarding.\u003c/p\u003e\u003cp\u003eI'd also remind myself not to neglect time with family. High school can get overwhelming with academics, sports, extracurriculars, and applying to college, and it's easy to lose sight of family. Looking back, those moments with my family mean even more, especially now being away at college. Making time for them is something I'd prioritize even more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"3fd9eb8d-56df-442b-911a-55e19186a12f\"}":{"__typename":"DeepDives","uuid":"3fd9eb8d-56df-442b-911a-55e19186a12f","content":"\u003cp\u003eOne goal I have is to become bilingual. I'd love to be fluent in Spanish and possibly learn another language as well. I've studied Spanish in school, but I've never had the chance to fully immerse myself, which is something I hope to do though studying abroad.\u003c/p\u003e\u003cp\u003eTo me, language is about much more than communication. It shapes how we understand other people and their perspectives. Being able to speak another language would open up entirely new ways of connecting with others and seeing the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"aadd71e6-3ff2-4c9e-b917-bca1efd5bb4a\"}":{"__typename":"DeepDives","uuid":"aadd71e6-3ff2-4c9e-b917-bca1efd5bb4a","content":"\u003cp\u003eAs a high school student, I was constantly balancing a lot. My days often started with early workouts, followed by classes, meetings with teachers, and time with friends at lunch, then practices or games after school. I stayed engaged academically and built strong relationships with teachers by genuinely investing in what I was learning.\u003c/p\u003e\u003cp\u003eFor me, the end of middle school was shaped a lot by COVID. That period gave me unexpected free time and pushed me to find new ways to stay active and engaged. I got into biking and spent a lot of time exploring local trails and biking hundreds of miles. I also spent more time with family--baking, playing games, and just being together--which ended up being really meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"3da0b45b-2f77-4d92-a633-01b35130b6f1\"}":{"__typename":"DeepDives","uuid":"3da0b45b-2f77-4d92-a633-01b35130b6f1","content":"\u003cp\u003eMy summers in high school were mostly spent on the baseball field--both playing and working--and at the pool, where I worked as a lifeguard. Outside of that, I tried to spend as much time as possible with friends and family.\u003c/p\u003e\u003cp\u003eGrowing up in and around Chicago, summers were always something I looked forward to. Whether it was going to the beach, playing sports like tennis, or just being outside, I made the most of the time and tried not to spend it indoors. Those summers are some of my best memories.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}":{"__typename":"School","uuid":"1855d7ef-1e93-4456-9092-47a74b3f8fb1","name":"New Trier Township High School - Winnetka","city":"Winnetka","type":"HIGH","state":"Illinois","country":"United States","zip":"60093"},"Education:{\"uuid\":\"f620fb49-c7cd-41fe-bd4a-0f4f99824c38\"}":{"__typename":"Education","uuid":"f620fb49-c7cd-41fe-bd4a-0f4f99824c38","school":{"__ref":"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"48bf17d4-dd74-4347-bbc2-d147d4037848\"}":{"__typename":"Education","uuid":"48bf17d4-dd74-4347-bbc2-d147d4037848","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Economics \u0026 Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"55fa4e53-1993-4f73-b8a1-a51ed80023b6\"}":{"__typename":"MentorPublicProfile","uuid":"55fa4e53-1993-4f73-b8a1-a51ed80023b6","displayName":"Neil S.","slug":"neil-sanderson","biography":"\u003cp\u003eI attend Duke University, where I study economics and political science. I am also involved in Duke's First-Year Constellations program focusing on artificial intelligence, and this spring I co-founded Duke's AI in Business Club. I am especially interested in understanding large systems--whether economic, political, or technological--how they interact with people, and how they can be used to create meaningful, positive change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was deeply involved in journalism, serving as editor-in-chief of a 25-person staff. During that time, I earned individual first-place awards in sports and news writing from the Illinois Journalism Education Association in both 2023 and 2024, and led our publication to win gold in 2025. I oversaw coverage of major topics, including the 2024 election and a Title IX lawsuit involving my school, while also implementing a strategy to expand our digital presence. By growing our social media audience by over 33%, improving search visibility on our website, and launching a broadcast and multimedia division, I learned that strong leadership is not just about ideas; it's about collaboration, clear communication, and empowering others to contribute.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I have always been drawn to the humanities, particularly reading, writing, and history. Over time, I have also developed strong public speaking skills. As a senior, I presented to my school board as a student voice representative and was selected as our class's graduation speaking, addressing our class of 900 students and thousands of family members. These experiences taught me how to communicate complex ideas clearly, connect with an audience, and build confidence under pressure, skills I bring into any learning or teaching environment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I have spent years involved in baseball. I played on my varsity team in high school and continue to play club baseball at Duke, where I also serve as treasurer. I have also worked as an umpire for six years and currently coach an 11U team, experiences that have given me a unique perspective on leadership and mentorship. In addition, I volunteer with organizations that provide opportunities for children with developmental and physical disabilities to play baseball. These roles have reinforced the importance of patience, adaptability, and meeting individual where they are.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not busy, you can likely find me outdoors hiking or biking, or reading and working on writing projects of my own.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, I aim to create a supportive and engaging environment where students feel comfortable asking questions, building confidence, and developing sills that extend beyond the classroom.\u003c/p\u003e","teachingVideoPlaybackId":"2aAeKmOpekoiZJjdXmzUnMMLw02Ya4iudNtPhzjU1QE4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics \u0026 Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6739bb19-855f-47e8-9ad4-c723a9ccafa2\"}"},{"__ref":"DeepDives:{\"uuid\":\"3fd9eb8d-56df-442b-911a-55e19186a12f\"}"},{"__ref":"DeepDives:{\"uuid\":\"aadd71e6-3ff2-4c9e-b917-bca1efd5bb4a\"}"},{"__ref":"DeepDives:{\"uuid\":\"3da0b45b-2f77-4d92-a633-01b35130b6f1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/56e2a8c2-af2f-48fb-b32a-cfb4fd5f5cfd/-/preview/-/format/jpg/","https://ucarecdn.com/53376632-d7de-4e9e-91f8-053ab18eea55/-/preview/-/format/jpg/","https://ucarecdn.com/a62afd9d-5faf-4835-bd85-4774623b12f7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f620fb49-c7cd-41fe-bd4a-0f4f99824c38\"}"},{"__ref":"Education:{\"uuid\":\"48bf17d4-dd74-4347-bbc2-d147d4037848\"}"}],"hiredAt":"2026-04-14T20:29:59.699Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"neil-sanderson\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"55fa4e53-1993-4f73-b8a1-a51ed80023b6\"}"}}},"_sentryTraceData":"29bb3aa98bfa4cc1a917902e5a73371c-be58752be02124a9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=29bb3aa98bfa4cc1a917902e5a73371c,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"neil-sanderson"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
