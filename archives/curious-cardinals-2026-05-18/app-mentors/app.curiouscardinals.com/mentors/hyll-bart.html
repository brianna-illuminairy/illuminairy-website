xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"6b1e6c6d-ad7e-4ca6-bb04-c45a304b4647\"}":{"__typename":"DeepDives","uuid":"6b1e6c6d-ad7e-4ca6-bb04-c45a304b4647","content":"\u003cp\u003eI am very proud of my undergraduate thesis in the History of Medicine that helped uncover the medical mysteries behind the current circumstances of health within the country of my ancestors, Haiti!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"1dea2608-3972-4552-835f-02f8f9130aa8\"}":{"__typename":"DeepDives","uuid":"1dea2608-3972-4552-835f-02f8f9130aa8","content":"\u003cp\u003eI was incredibly studious, to the point where many of my peers considered me the smartest person in the room! Externally, this reality pushed me to excel always, but in retrospect, it was quite a lot of pressure to carry. It did mold me into the motivated and ambitious young woman that I am today!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d47b37df-f553-4081-a26e-c17040f829b3\"}":{"__typename":"DeepDives","uui
