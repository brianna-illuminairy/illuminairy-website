xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"242636fa-51e8-41ad-badc-55941dbe8e95\"}":{"__typename":"DeepDives","uuid":"242636fa-51e8-41ad-badc-55941dbe8e95","content":"\u003cp\u003eI spent my summers in high school doing what I love, which is teaching the youth in my community. I've been a recreation leader teaching students how to play sports, an intern at a local elementary school, and a private tutor teaching students math and English.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"acb49b88-32c2-4e79-b96f-eb6fb9748f97\"}":{"__typename":"DeepDives","uuid":"acb49b88-32c2-4e79-b96f-eb6fb9748f97","content":"\u003cp\u003eMy dream job is to work as a data scientist or machine learning engineer who addresses real-world social challenges, which includes sustainability and healthcare.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"11cd29b1-e6b3-42c4-b3bd-69174c8718bd\"}":{"__typename":"DeepDives","uuid":"11cd29b1-e6b3-42c4-b3bd-69174c8718bd","content":"\u003cp\u003eThroughout middle school and early high school, I was a very shy student who often kept to myself. However, as I entered junior year in high school, I began to put myself out there and try new things. As a result, I became more social and built relationships I still treasure today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5a404938-8d9e-49d4-9622-5b04f1a94698\"}":{"__typename":"DeepDives","uuid":"5a404938-8d9e-49d4-9622-5b04f1a94698","content":"\u003cp\u003eIn my free time, I like to hang out with friends, try new foods, and play sports. Some sports I especially love to play are tennis, pickleball, ping pong, and badminton.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"ca7dc7a3-83a6-4e1b-9fcb-ca907622225d\"}":{"__typename":"School","uuid":"ca7dc7a3-83a6-4e1b-9fcb-ca907622225d","name":"Franklin High School","city":"Elk Grove","type":"HIGH","state":"California","country":"United States","zip":"95757"},"Education:{\"uuid\":\"da4ac3f5-3144-4caf-baea-d4f5c2ebbd48\"}":{"__typename":"Education","uuid":"da4ac3f5-3144-4caf-baea-d4f5c2ebbd48","school":{"__ref":"School:{\"uuid\":\"ca7dc7a3-83a6-4e1b-9fcb-ca907622225d\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"fab9e217-253f-4095-a191-2589f2ee7f4a\"}":{"__typename":"Education","uuid":"fab9e217-253f-4095-a191-2589f2ee7f4a","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"9214324c-ca48-47b1-9490-65151fa804cf\"}":{"__typename":"MentorPublicProfile","uuid":"9214324c-ca48-47b1-9490-65151fa804cf","displayName":"Caden H.","slug":"caden-huy","biography":"\u003cp\u003eHello! I'm Caden, a freshman at UC Berkeley studying Data Science, and I help students turn curiosity into real-world data science and machine learning projects, from their first idea to a project they can be proud of.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAbout Me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI discovered my passion for data science just recently in my senior year of high school, but since then, I:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eHave built multiple data science and machine learning personal projects to address real-world problems, including predictive models and interactive applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eParticipated in hackathons and datathons at UC Berkeley, collaborating to turn ideas into working solutions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAm currently doing research exploring how machine learning and behavioral insights can encourage more sustainable transportation habits\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eMy experiences have taught me both how to turn curiosity into a concrete, structured project and how to develop the skills to break into data science opportunities.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eProjects we can work on\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI am open to mentor students who want to pursue:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eIntroductory data science projects (working with real datasets, asking questions, finding patterns)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBeginner machine learning projects (classification and regression with simple models)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePassion-driven projects (sports, music, sustainability, etc.)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eNo prior coding experience is required, only curiosity.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy mentorship style\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’ve worked as a recreation leader teaching sports, an intern at a local elementary school, and a private tutor teaching math and English. I’ve supported learners with different confidence levels, learning styles, and goals. My goal is to mentor rather than simply lecture. I focus on breaking complex ideas into manageable steps and help students feel supported, curious, and in control of their own progress. A typical session with me might include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming and refining a project idea\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDesigning a clear plan before starting to write any code\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eVisually exploring a dataset and asking “why” together\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReflecting on goals and progress\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI introduce technical tools like Python and its data science libraries only after students have a clear idea of what they’re trying to build, so students don’t feel overwhelmed\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA few fun facts\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I love playing sports, especially tennis and pickleball, going to the gym, and exploring restaurants around Berkeley. I also love watching anime like Naruto, Demon Slayer, and Attack on Titan.\u0026nbsp;\u003c/p\u003e\u003cp\u003eIf you’re curious, inspired, and ready to build something meaningful, I’d love to work with you to make it happen!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"fW9GQMyKrcmN7takfmYo2vD3X8IEpSlyaI3o01OAVpB00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"242636fa-51e8-41ad-badc-55941dbe8e95\"}"},{"__ref":"DeepDives:{\"uuid\":\"acb49b88-32c2-4e79-b96f-eb6fb9748f97\"}"},{"__ref":"DeepDives:{\"uuid\":\"11cd29b1-e6b3-42c4-b3bd-69174c8718bd\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a404938-8d9e-49d4-9622-5b04f1a94698\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/08313453-2fec-48de-809f-ffb4af47f53b/-/preview/-/format/jpg/","https://ucarecdn.com/7f12f806-a69d-4cb6-af3a-8e839e6a0966/-/preview/-/format/jpg/","https://ucarecdn.com/b0a8305d-dc8a-47d9-8080-83437cd836f3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"da4ac3f5-3144-4caf-baea-d4f5c2ebbd48\"}"},{"__ref":"Education:{\"uuid\":\"fab9e217-253f-4095-a191-2589f2ee7f4a\"}"}],"hiredAt":"2026-01-18T18:04:33.862Z","topics":["Coding / Programming","Machine Learning / AI"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"caden-huy\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9214324c-ca48-47b1-9490-65151fa804cf\"}"}}},"_sentryTraceData":"70026c463d794279abf09fbbf9c4d3d5-b12b9740a421761b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=70026c463d794279abf09fbbf9c4d3d5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"caden-huy"},"buildId":"ZA
