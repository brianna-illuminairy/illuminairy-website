literature.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"06cb7a4e-d8d9-4c11-a10d-30f2fa109187\"}":{"__typename":"DeepDives","uuid":"06cb7a4e-d8d9-4c11-a10d-30f2fa109187","content":"\u003cp\u003eA few come to mind: \u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eIn the mornings, I would love to be a news anchor on Good Morning America. \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAfter 10 AM, I would aspire to be the CEO of a tech company. \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOn Fridays I would love to be a judge on the Court of Appeals. \u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eEvidently, I have many interests, and if you ask me again one month from now this answer will likely change :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c79fc4ed-cd88-4f51-b653-cdc4b8196a96\"}":{"__typename":"DeepDives","uuid":"c79fc4ed-cd88-4f51-b653-cdc4b8196a96","content":"\u003cp\u003eTravel, read autobiographies, currently writing my own autobiography, visual arts (piano, ceramics, acrylic painting, waltz dance), and trying new cuisines. I am also currently learning how to play golf!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"66d8ef0b-c1f1-49f0-af0a-d93f1cf5bc8d\"}":{"__typename":"DeepDives","uuid":"66d8ef0b-c1f1-49f0-af0a-d93f1cf5bc8d","content":"\u003cp\u003eAs an older sibling, I often found myself wishing I had someone to turn to for advice about school, college, and life. Having lived both in the United States and abroad, experienced multiple education systems, and held a variety of work experiences, I've learned many lessons that I would love to share with students. I find it incredibly rewarding to help students discover their passions or finally solve a tricky problem they've been stuck on, and I am excited to support them on their academic journeys.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"51beb6df-c53c-4446-a69f-7e0b3eeba424\"}":{"__typename":"School","uuid":"51beb6df-c53c-4446-a69f-7e0b3eeba424","name":"Alhambra High School","city":"Alhambra","type":"HIGH","state":"California","country":"United States","zip":"91801"},"Education:{\"uuid\":\"c374b4ec-23f9-4d2a-bff7-0400c3c23a90\"}":{"__typename":"Education","uuid":"c374b4ec-23f9-4d2a-bff7-0400c3c23a90","school":{"__ref":"School:{\"uuid\":\"51beb6df-c53c-4446-a69f-7e0b3eeba424\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4fc504cf-0bd8-480e-aad0-cbfe03890b1a\"}":{"__typename":"Education","uuid":"4fc504cf-0bd8-480e-aad0-cbfe03890b1a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Data Science (focus on Quantitative Financial Methods), minors in Math and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"6637917f-e477-4be5-8839-5cf7ee5249fb\"}":{"__typename":"MentorPublicProfile","uuid":"6637917f-e477-4be5-8839-5cf7ee5249fb","displayName":"Rebecca W.","slug":"rebecca-wu-1","biography":"\u003cp\u003eHi, I'm Rebecca—it's great to meet you!\u003cbr\u003eAt Stanford, I study Data Science, Computer Science, and Mathematics, and am deeply involved in entrepreneurship and venture capital organizations. I serve as Vice President of Stanford Women in Business, Head of Finance at Cardinal Ventures, and am also involved with Alternative Spring Breaks, Stanford Introductory Seminars, and the Stanford Computer Forum. Additionally, I work as a Research Assistant at both the Stanford King Center for Global Development and the Graduate School of Business.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I am passionate about the applications of artificial intelligence to financial markets, technological innovation, and global trade. Professionally, I have experience in Product Management, Quantitative Research, and Asset Management across public equities, fixed income, and multi-asset strategies. I have also studied abroad at Oxford University and in Australia.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I graduated at the top of my class with a 4.7 GPA while concurrently earning an associate’s degree from East Los Angeles College as a dual-enrolled student. I was actively involved in Speech \u0026amp; Debate, Future Business Leaders of America, and several city- and state-wide youth leadership councils. My activities spanned civic engagement (public policy research, internships with elected officials), law (internships at the Los Angeles Superior Court, writing competitions, and summer programs at USC), and mathematics (instructor at Mathnasium, President of Math Olympiad, and founder of a financial literacy and mathematics education initiative).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have extensive experience teaching and academically mentoring students of all ages—from 4-year-olds to incoming college freshmen—in mathematics, writing, science, and standardized testing (ACT, SAT, and AP exams). I've also helped students develop research projects, compete in writing competitions, and apply to selective summer programs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy reading autobiographies, traveling, and exploring the visual arts—piano, waltz dance, ceramics, and acrylic painting—as well as attending theater performances and trying new cuisines.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI look forward to working with you!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3d5b4c75-e23b-4110-9d84-9b1ab05365c4\"}"},{"__ref":"Favorites:{\"uuid\":\"9c622447-d0dd-49d5-9f94-584920643156\"}"}],"causesSupported":[],"major":"Data Science (focus on Quantitative Financial Methods), minors in Math and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4a0f70ac-ca1b-4e5b-a7af-98e4353177c7\"}"},{"__ref":"DeepDives:{\"uuid\":\"06cb7a4e-d8d9-4c11-a10d-30f2fa109187\"}"},{"__ref":"DeepDives:{\"uuid\":\"c79fc4ed-cd88-4f51-b653-cdc4b8196a96\"}"},{"__ref":"DeepDives:{\"uuid\":\"66d8ef0b-c1f1-49f0-af0a-d93f1cf5bc8d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6dadbe6f-d0fb-462a-bfe8-ef41333de2e0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c374b4ec-23f9-4d2a-bff7-0400c3c23a90\"}"},{"__ref":"Education:{\"uuid\":\"4fc504cf-0bd8-480e-aad0-cbfe03890b1a\"}"}],"hiredAt":"2025-04-16T23:23:52.709Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Statistics","Geometry","6-8 Grade Science","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","History","Reading","Economics","K-6 Storybook","Creative Writing","Sports Journalism","Visual Arts / Graphic Design","History Project","Video / Photography","Business / Entrepreneurship","Finance / Investing","STEM Project","Machine Learning / AI","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"rebecca-wu-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6637917f-e477-4be5-8839-5cf7ee5249fb\"}"}}},"_sentryTraceData":"1b6a439fd9cc4382a3618392e43628bd-931177c610d6426f-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1b6a439fd9cc4382a3618392e43628bd,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"rebecca-wu-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
