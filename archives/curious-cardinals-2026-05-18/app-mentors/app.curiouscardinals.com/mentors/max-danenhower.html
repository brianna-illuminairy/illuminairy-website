xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"5531ac82-0230-470b-b0b8-61db1d2a0e9c\"}":{"__typename":"DeepDives","uuid":"5531ac82-0230-470b-b0b8-61db1d2a0e9c","content":"\u003cp\u003eWhen I was really young, I wanted to play professional football. I saw professional football players as super stars, and of course I wanted to be like them. This goal was very silly (as I would quickly learn as I got older), but still managed to make a huge impact on my life. While I never made it to the NFL (or even got close), my dedication to competing as a football player taught me a lot about myself and who I wanted to be. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think failure is a great teacher. It taught me that the pursuit of some goal is more rewarding than the goal itself. The process of failing, and then being able to get back up and keep pushing forward regardless builds confidence, humility, and toughness. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"68d43403-9287-4ff1-a022-8547b1169593\"}":{"__typename":"School","uuid":"68d43403-9287-4ff1-a022-8547b1169593","name":"Lakeside School","city":"Seattle","type":"HIGH","state":"Washington","country":"Estados Unidos","zip":"98125"},"Education:{\"uuid\":\"8bfe44d3-6df2-4f33-9303-c766fa7d5266\"}":{"__typename":"Education","uuid":"8bfe44d3-6df2-4f33-9303-c766fa7d5266","school":{"__ref":"School:{\"uuid\":\"68d43403-9287-4ff1-a022-8547b1169593\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"078fe622-d3af-42a2-9053-d11e2b4750de\"}":{"__typename":"School","uuid":"078fe622-d3af-42a2-9053-d11e2b4750de","name":"Bowdoin College","city":"Brunswick","type":"COLLEGE","state":"Maine","country":"United States","zip":"04011"},"Education:{\"uuid\":\"ebd839bc-7801-4e13-9b7a-c5a72e653d99\"}":{"__typename":"Education","uuid":"ebd839bc-7801-4e13-9b7a-c5a72e653d99","school":{"__ref":"School:{\"uuid\":\"078fe622-d3af-42a2-9053-d11e2b4750de\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"ad7166e0-fe6e-49ce-995d-b1e2aa5e1e7f\"}":{"__typename":"MentorPublicProfile","uuid":"ad7166e0-fe6e-49ce-995d-b1e2aa5e1e7f","displayName":"Max D.","slug":"max-danenhower","biography":"\u003cp\u003eHi, I'm Max! I grew up in Seattle and went to Bowdoin College in Maine where I studied computer science and graduated in May 2025. At Bowdoin, I enjoyed the true liberal arts experience, and had the opportunity to take classes from many different departments. I also played on the varsity football team (Bowdoin is a Division 3 school) as a linebacker and safety. One cool project I completed while at Bowdoin was making an AI Geoguessr Bot. If you’ve never heard of Geoguessr, it is a game where given a street view image (like the street view images on google maps), you guess where in the image was taken. This was a fun project because we were given a high degree of flexibility to build an AI model of our choosing. And, I would say our Geoguessr bot provided some impressive results.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI also was an assistant coach at the high school I used to play for last fall, which was a full circle moment for my football career. Coaching gave me some insights into football that I never got as a player, and was my first introduction to being a mentor. I greatly enjoyed watching the players and team develop over the course of the season.\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhile at Bowdoin, I studied abroad in Taiwan for 4 months and took intensive mandarin courses. Now, I’m planning to return to Taiwan as a graduate student at the National Taiwan University Institute of Oceanography in September 2026. I am excited to continue to improve my Chinese ability and learn more about Oceanography!\u003c/p\u003e\u003cp\u003eMore recently, I was a Research Scientist at the University of Washington, where I worked with an oceanographer on developing, testing, and implementing an algorithm that estimates chlorophyll concentrations on the ocean surface from satellite imagery. I was also lucky enough to join a 5-day research cruise in the Puget Sound (near Seattle, WA) where we took plankton and water samples (I was mostly just responsible for rinsing the nets off). Seeing some orcas and porpoises was a bonus!\u003c/p\u003e\u003cp\u003eIn my free time, I like to get outside as much as possible. My favorite activities are skiing and surfing, and I am always trying to plan my next adventure.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"BPQgP8bC8d4r7HVIJwJ5EUeatv009Xj6ODdUWszhJ00ts","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5531ac82-0230-470b-b0b8-61db1d2a0e9c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bbcbeae3-28ac-4f4a-ba6d-36fabbec58bb/-/preview/-/format/jpg/","https://ucarecdn.com/8a5d1fd3-7c21-46dd-bac5-6d425f3af596/-/preview/-/format/jpg/","https://ucarecdn.com/f4242c13-6ba1-4bcd-b981-2843cfee500f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8bfe44d3-6df2-4f33-9303-c766fa7d5266\"}"},{"__ref":"Education:{\"uuid\":\"ebd839bc-7801-4e13-9b7a-c5a72e653d99\"}"}],"hiredAt":"2026-01-23T18:21:29.802Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-
