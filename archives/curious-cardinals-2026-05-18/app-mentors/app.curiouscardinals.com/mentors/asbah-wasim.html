js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"400b78cc-82ed-4608-9039-6df7de210c15\"}":{"__typename":"DeepDives","uuid":"400b78cc-82ed-4608-9039-6df7de210c15","content":"\u003cp\u003eMentorship matters to me because I’ve seen firsthand how the right guidance can change someone’s trajectory—not just academically, but in how they see themselves and their potential. At different points in my life, mentors helped me navigate unfamiliar environments, challenge my own self-doubt, and recognize opportunities I didn’t know existed. That experience showed me that mentorship isn’t just about explaining material; it’s about building confidence, clarity, and a sense of direction.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI care deeply about mentorship because learning can feel overwhelming or isolating, especially in rigorous subjects or competitive environments. Having someone who listens, adapts to your learning style, and genuinely believes in your ability can make all the difference. I strive to be that person for my students: someone who not only helps them understand concepts, but also helps them trust their own thinking process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship also matters to me because it creates ripple effects. When students feel supported and empowered, they’re more likely to take intellectual risks, ask questions, pursue opportunities, and eventually support others in return. I see mentorship as a way to expand access—to knowledge, to confidence, and to possibilities that students may not yet realize are within reach.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I don’t view mentorship as a one-way transfer of knowledge. It’s a collaborative relationship built on encouragement, curiosity, and growth. Being part of a student’s learning journey is incredibly meaningful to me because it means helping them not just succeed in a subject, but develop skills and confidence that will stay with them long after our sessions end.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"26d6f64e-c746-4e52-983d-4ea60d59bde4\"}":{"__typename":"DeepDives","uuid":"26d6f64e-c746-4e52-983d-4ea60d59bde4","content":"\u003cp\u003eI chose my majors because I’ve always been curious about one core question: how do people think, and how can we design systems that actually work for them?\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I first came to college, I didn’t expect to study Data Science at all. I actually started as an Applied Math major and had almost no programming experience. I used to tell my dad, “I don’t even know how to code,” whenever he encouraged me to try it. Out of curiosity, I enrolled in an introductory data science course, and that class completely changed my perspective. I realized data science wasn’t just about coding—it was a powerful, interdisciplinary tool for understanding real-world problems across areas like human behavior, health, policy, and technology. What started as a single class turned into a minor, and eventually a major. Along the way, I even went on to teach upper-division data science courses and mentor hundreds of students exploring the field themselves.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, I was drawn to Cognitive Science because it explores the science behind how people learn, make decisions, and interact with the world. Studying cognition gave me a deeper understanding of the human side of technology—how attention works, why people make certain choices, and what makes information clear or confusing. It complemented data science perfectly: one helps explain \u003cem\u003ehuman behavior\u003c/em\u003e, while the other helps analyze \u003cem\u003epatterns in data\u003c/em\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy Design Innovation certificate brought those two worlds together. Design taught me how to translate insights into solutions—how to take research, data, and psychological principles and turn them into tools, systems, and experiences that are actually useful, inclusive, and intuitive. Through design, I learned that solving problems isn’t just about technical skill; it’s about empathy, creativity, and understanding people’s real needs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTogether, these fields shaped how I approach learning and problem-solving. Data Science trained me to think analytically, Cognitive Science trained me to think human-centeredly, and Design trained me to think creatively and practically. I chose this combination because I didn’t want to study just one dimension of problems—I wanted to understand them from multiple angles.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLooking back, my path wasn’t linear, and that’s exactly why I value it. Choosing these majors taught me that you don’t need to start as an expert to grow into something new. Sometimes the subjects that challenge you most at first end up becoming the ones that shape you the most.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"da0ef9b9-938f-47c1-a5d3-fc4f16b0b7e4\"}":{"__typename":"DeepDives","uuid":"da0ef9b9-938f-47c1-a5d3-fc4f16b0b7e4","content":"\u003cp\u003eIn high school, I was the kind of student who was curious, detail-oriented, and always drawn to creative problem-solving—especially when it involved understanding people’s needs. One of the experiences that best captures who I was back then was taking an Interior Design course, which sparked my fascination with how environments shape how we feel, think, and function. I started noticing the small details of spaces everywhere I went—office lobbies, stores, waiting rooms—and I’d mentally analyze why certain places felt welcoming, efficient, or calming.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat curiosity led me to compete in a regional and state interior design competition during 10th grade, where I designed a fully planned 500-square-foot studio apartment for a hypothetical client. I developed everything from the client profile and floor plan to furniture layouts, color palettes, elevation sketches, and materials. I even contacted flooring and textile companies to select realistic design elements. I loved balancing creativity with logic—thinking about aesthetics while also making sure every design choice served a functional purpose. Winning first place at both regionals and state showed me that careful thinking, empathy, and attention to detail could come together to create something meaningful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I was motivated and hardworking, but I was also someone who liked exploring different interests rather than limiting myself to one path. I enjoyed subjects that challenged me to think deeply, and I wasn’t afraid to try something new even if I wasn’t immediately confident in it. I cared a lot about doing things thoughtfully and thoroughly, whether that meant refining a project, improving a presentation, or asking extra questions to truly understand something.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLooking back, high school was really where I started developing the mindset I still carry today: curiosity first, confidence second. I didn’t always know exactly what I wanted to pursue, but I knew I loved learning, creating, and understanding how things work. That willingness to explore is what eventually led me toward fields like data science, cognitive science, and design.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn many ways, I’m still that same student—I just now have more tools, experience, and perspective.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"1429ba3a-ed96-4e2a-9daf-0126ef9fdf6d\"}":{"__typename":"School","uuid":"1429ba3a-ed96-4e2a-9daf-0126ef9fdf6d","name":"Connecting Waters Charter School","city":"Waterford","type":"HIGH","state":"California","country":"United States","zip":"95386"},"Education:{\"uuid\":\"1e82f874-54cf-4800-bd38-7a16aee53b18\"}":{"__typename":"Education","uuid":"1e82f874-54cf-4800-bd38-7a16aee53b18","school":{"__ref":"School:{\"uuid\":\"1429ba3a-ed96-4e2a-9daf-0126ef9fdf6d\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"9945535a-50b0-4d66-8b33-28fc4584dab0\"}":{"__typename":"Education","uuid":"9945535a-50b0-4d66-8b33-28fc4584dab0","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Cognitive Science, Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"95ed480c-5ecd-477f-b334-fec5634bc728\"}":{"__typename":"MentorPublicProfile","uuid":"95ed480c-5ecd-477f-b334-fec5634bc728","displayName":"Asbah W.","slug":"asbah-wasim","biography":"\u003cp\u003eAs a researcher, mentor, and designer, I am deeply passionate about helping students discover how learning connects to the real world. I recently graduated from UC Berkeley with dual degrees in Cognitive Science and Data Science and a certificate in Design Innovation, where I graduated with a 3.9 GPA and academic distinction. My academic journey has focused on understanding how people think, how technology shapes our decisions, and how data can be used to design solutions that improve lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI specialize in breaking down complex topics—whether that’s machine learning, statistics, programming, or research methods—into clear, engaging explanations that build confidence and curiosity. Students I work with often say I make intimidating subjects feel approachable and even fun. I believe that strong learning happens when students feel supported, encouraged, and challenged at the right level, so I tailor my teaching style to each student’s goals, pace, and learning preferences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I bring extensive real-world experience from research and industry. I have conducted user experience research for government technology systems, worked on human-computer interaction projects developing AI-supported tools, and collaborated with multidisciplinary teams analyzing large datasets to uncover meaningful insights. I’ve also presented research at conferences, published technical work, and helped design university courses that guide students through solving real societal challenges. These experiences allow me to show students not just \u003cem\u003ewhat\u003c/em\u003e they’re learning, but \u003cem\u003ewhy it matters\u003c/em\u003e and how it’s applied outside the classroom.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTeaching and mentorship have always been central to who I am. I’ve served as course staff for large university data science classes, led workshops for hundreds of students, mentored freshmen navigating college, and guided high school students through academic and career planning. I’ve also designed and taught hands-on design courses where students created real prototypes to address global issues. These roles taught me how to meet learners where they are, adapt explanations in real time, and build a supportive environment where questions are welcomed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat motivates me most is helping students realize their potential. I know that every learner is capable of growth when given the right tools, strategies, and encouragement. Whether you’re aiming to strengthen fundamentals, prepare for advanced coursework, explore research, or simply build confidence in a subject, I’m here to support you every step of the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI strive to make each session engaging, encouraging, and empowering so students leave not only with stronger skills, but with greater belief in themselves as learners.\u003c/p\u003e","teachingVideoPlaybackId":"VuBvvpjILkSeIVsRhoA00Uge2a015SB00Wp63d5rH0201ly4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Cognitive Science, Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"400b78cc-82ed-4608-9039-6df7de210c15\"}"},{"__ref":"DeepDives:{\"uuid\":\"26d6f64e-c746-4e52-983d-4ea60d59bde4\"}"},{"__ref":"DeepDives:{\"uuid\":\"da0ef9b9-938f-47c1-a5d3-fc4f16b0b7e4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b4f81fcf-3dee-42e4-8950-fcb9a53c39d1/-/preview/-/format/jpg/","https://ucarecdn.com/50aaaa6f-5739-4c1f-8a5d-19d3dcba0330/-/preview/-/format/jpg/","https://ucarecdn.com/fae7233b-1f21-4245-8039-be099bc318e4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1e82f874-54cf-4800-bd38-7a16aee53b18\"}"},{"__ref":"Education:{\"uuid\":\"9945535a-50b0-4d66-8b33-28fc4584dab0\"}"}],"hiredAt":"2026-02-11T19:21:47.460Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Biology","6-8 Grade Science","Chemistry","Writing","Spanish","Academic Coaching","College Essay Writing","Reading","History","Economics","Computer Science","K-6 Storybook","Creative Writing","Fashion / Cosmetics","History Project","Coding / Programming","Web Design","STEM Project","Machine Learning / AI","Sustainability","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"asbah-wasim\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"95ed480c-5ecd-477f-b334-fec5634bc728\"}"}}},"_sentryTraceData":"1ec7ef1715a84f249c406358ec4810c5-9899ac74a62bcad3-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1ec7ef1715a84f249c406358ec4810c5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"asbah-wasim"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
