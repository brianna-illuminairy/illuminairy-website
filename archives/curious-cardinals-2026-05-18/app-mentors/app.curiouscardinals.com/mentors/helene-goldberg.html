xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"6e16f96c-5e49-4205-a556-fb76377b3cd9\"}":{"__typename":"DeepDives","uuid":"6e16f96c-5e49-4205-a556-fb76377b3cd9","content":"\u003cp\u003eBy the time I am thirty-five, I want to have my own psychology practice. I want to aid children and teenagers experiencing anxiety and anxiety-related disorders. This age group encompasses an especially challenging period of life because of factors like academic pressure and social media use. Therefore, I believe early intervention is crucial at this stage. I plan to continue researching developmental neuroscience and neurochemical circuitry as I earn a phD in Clinical Psychology. After I complete my education and training, I want to open my own affordable and holistic therapy practice.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"62ac65a8-2f64-415f-8be6-b03e48caf051\"}":{"__typename":"DeepDives","uuid":"62ac65a8-2f64-415f-8be6-b03e48caf051","content":"\u003cp\u003eGrowing up Jewish in the South, I was not surrounded by a big Jewish community or culture. Instead, I learned a lot about being Jewish from my parents. There was a book that always sat on the living room bookshelf called “The Jewish Book of Why.” So, from a young age, I learned that as Jews, we love to ask, “Why?”. This taught me to ask questions about everything to my parents, siblings, teachers, and peers. The more I asked, the more I learned, and I began to understand the world around me. So, as a teacher, I always encourage students to ask, “Why?”. Not only does it aid their discovery process, but it also tailors the lesson to fit their specific needs.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"32fe6827-0325-47a9-a08d-48059679cc31\"}":{"__typename":"DeepDives","uuid":"32fe6827-0325-47a9-a08d-48059679cc31","content":"\u003cp\u003eAs a young child, I became obsessed with any and every creative exercise I could get my hands on, from designing my own Rainbow Loom animal pencil toppers to perfecting the recipe for an apple cinnamon crumb cake. When my mom decided to teach me how to sew, naturally, it became my new obsession. In elementary school, I was obsessed with stuffed animals. The first thing I wanted to create was my very own stuffed animal. I used an otter stuffed animal to design my own template. With my mom’s fleece fabric scraps and a needle and thread, I created my very own otter. Although it was a strenuous task and the new button-eyed animal did not look exactly like my otter, I had created my very own creature! Through the years, I kept up with small sewing projects until the COVID lockdown hit, and my passion for sewing came back in full swing. At the time, I was a junior in high school, and my current obsession was clothes. This time, I watched YouTube sewing tutorials to learn how to make my own blouses, skirts, and bathing suits. Practically every day, I was adding a new item to my wardrobe. I still sew every now and then because it is rhythmic, relaxing, and it inspires me to build real objects from my imagination.\u0026nbsp;\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f7d9773b-f83b-496c-8f7b-9ed508c42c54\"}":{"__typename":"DeepDives","uuid":"f7d9773b-f83b-496c-8f7b-9ed508c42c54","content":"\u003cp\u003eAs a college student in New York City, my favorite pastime is carving out an afternoon to go for a walk. I leave my apartment with no plan, I pick a direction, and walk. If I walk down Columbus Avenue, I’ll stop on 77th Street at the Grand Bazaar flea market to find vintage treasures before heading towards Columbus Circle. I might also walk through Central Park and explore the East side, or through Riverside Park to explore the West side. I love to spend the afternoon trying new bakeries or reading a book in the park, and watching the sunset from the Westside Highway makes the perfect end to the day.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"b1fa5c0d-952c-4de9-b8fb-73ebe416a9a5\"}":{"__typename":"School","uuid":"b1fa5c0d-952c-4de9-b8fb-73ebe416a9a5","name":"Chapel Hill High School","city":"Chapel Hill","type":"HIGH","state":"North Carolina","country":"United States","zip":"27516"},"Education:{\"uuid\":\"531dd19c-8e8e-47ea-8792-273ac7454bae\"}":{"__typename":"Education","uuid":"531dd19c-8e8e-47ea-8792-273ac7454bae","school":{"__ref":"School:{\"uuid\":\"b1fa5c0d-952c-4de9-b8fb-73ebe416a9a5\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"df9d6d96-5ad5-400f-881a-b0798272c2b7\"}":{"__typename":"Education","uuid":"df9d6d96-5ad5-400f-881a-b0798272c2b7","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Psychology and Ethics","degree":null},"MentorPublicProfile:{\"uuid\":\"8a020ca3-0f64-43c5-959a-4b0ab4fea94d\"}":{"__typename":"MentorPublicProfile","uuid":"8a020ca3-0f64-43c5-959a-4b0ab4fea94d","displayName":"Helene G.","slug":"helene-goldberg","biography":"\u003cp\u003eHelene is a Senior at Columbia University studying Psychology and Ethics. You might find her on the streets of New York City searching for the city’s best chocolate chip cookie or on the pickleball courts in Central Park, enjoying an afternoon with her friends. Although she loves the hustle and bustle of the city, Helene grew up in Chapel Hill, North Carolina, a small college town with an intense basketball rivalry. Apart from the fierce March Madness competition, she enjoyed having access to academics at UNC-Chapel Hill and Duke University. Helene enrolled in college courses during her high school years to explore her interests and passions. She fondly recalls a Literature course called “Film, Media, and Culture” at UNC-Chapel Hill that sparked her passion for writing and the creative process. In high school, she also harnessed her creative spirit in entrepreneurial ventures. As a member of District C at The North Carolina School of Science and Mathematics, she acted as a business consultant for a local truck company seeking increased social media engagement and an improved customer loyalty experience. Through her work, inside and outside the classroom, Helene becam a confident, ambitious young student, excited to continue her education at Columbia University.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen Helene began her college career, she had many unanswered questions about the human experience. She attempted to explore this discipline from all angles, deciding upon on a double degree program, majoring in both Psychology and Ethics. From the psychological lens, Helene was fascinated by the ability of critical development periods to impact emotional and behavioral outcomes. She investigated this phenomenon as a Research Assistant in Dr. Dima Amso’s Developmental Cognitive Neuroscience Lab at Columbia University. Here, Helene studied the attentional relationship between infants and caretakers. But, as an aspiring clinical psychologist, she still had unanswered questions about the function of neurochemical circuits in psychological maladaptations. So, Helene joined Dr. Mark Ansorge’s Lab at the New York State Psychiatric Center at Columbia University Irving Medical Center. Here, she is a Research Assistant, and uses mouse models to study the interactions between serotonin and dopamine in aggressive behavior. Everyday, she continues to learn new things that aid in her understanding of the intricacies of the human experience.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSimultaneously, Helene investigates the human experience from a philosophical lens. This past semester, her pursuit of a degree in Ethics brought her to a semester-long exchange program in Berlin, Germany. Here, Helene was immersed in the German language as she studied the German philosophy canon, from Schopenhauer to Nietzsche to Marx to Arendt. She learned how some of the greatest thinkers of the 19th-century percieved the world, society, and the individual. Throughout the semester, she used these perspectives to understand the human experience in Germany during monarchy, socialism, and totalitarianism. She hopes to continue to apply her findings to the social and political climate of today.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHelene is excited to share her passions for mentorship, exploration, and education with Curious Cardinals. She enjoys preparing hands-on, interactive lessons that aid student growth and discovery!\u003c/p\u003e","teachingVideoPlaybackId":"DQmO4JYIymlWoBWeO8NIqjKHzzU6HuKwVSEHQghAWd8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology and Ethics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6e16f96c-5e49-4205-a556-fb76377b3cd9\"}"},{"__ref":"DeepDives:{\"uuid\":\"62ac65a8-2f64-415f-8be6-b03e48caf051\"}"},{"__ref":"DeepDives:{\"uuid\":\"32fe6827-0325-47a9-a08d-48059679cc31\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7d9773b-f83b-496c-8f7b-9ed508c42c54\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b17e47af-1a7c-411e-94d9-f21c39eb6fae/-/preview/-/format/jpg/","https://ucarecdn.com/91c3d082-d940-4b25-be7b-37be39806817/-/preview/-/format/jpg/","https://ucarecdn.com/614a31e9-b39e-4bab-91c6-1e3917adf3c4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"531dd19c-8e8e-47ea-8792-273ac7454bae\"}"},{"__ref":"Education:{\"uuid\":\"df9d6d96-5ad5-400f-881a-b0798272c2b7\"}"}],"hiredAt":"2025-05-21T13:43:22.814Z","topics":["6-8 Grade Science","Biology","Writing","Spanish","German","College Essay Writing","Reading","History","Executive Function","Academic Coaching","K-6 Storybook","Creative Writing","History Project","Medicine / Health","STEM Project","Law / Government / Policy","Sustainability","Journalism"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"sl
