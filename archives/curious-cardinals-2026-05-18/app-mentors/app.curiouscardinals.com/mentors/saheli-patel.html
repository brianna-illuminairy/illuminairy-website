xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"cd345f5e-674f-4b29-9e19-9a437ab0e560\"}":{"__typename":"DeepDives","uuid":"cd345f5e-674f-4b29-9e19-9a437ab0e560","content":"\u003cp\u003eOne of my biggest passion projects has been building my own “athletic portfolio.” Not in the sense of trying to become a pro-athlete, but in pushing myself to try new sports—especially the ones that once felt intimidating.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, I didn’t play a lot of traditional team sports. But over time, I started challenging myself to explore movement in all kinds of forms: from rock climbing and soccer, to training for a triathlon (which felt wildly daunting at first). Every time I try something new, there’s a mix of excitement and fear. \u003cem\u003eI ask myself, what if I’m bad at it? what if I don’t fit in?\u003c/em\u003e But showing up even when it’s uncomfortable, has taught me a lot more than just physical skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt’s become less about performance and more about courage, consistency, and discovery. In a way, my body has become a space for learning, just like school—but with a lot more sweat and stumbles.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4b19f99a-6028-4b5c-b08e-5821c7105129\"}":{"__typename":"DeepDives","uuid":"4b19f99a-6028-4b5c-b08e-5821c7105129","content":"\u003cp\u003eIf I could go back, I’d tell my younger self that \u003cstrong\u003eyour peers don’t define you.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn middle and high school, it’s easy to feel like everyone is watching and judging. I remember holding back from asking questions or trying something new because I was worried about what others might think. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut over time I have learned that most people are too focused on their own insecurities to be thinking about you that much. And honestly, the things that feel huge in high school such as popularity, fitting in, being cool begin to matter less and less. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat matters more is learning to be true to yourself and to be curious and to let your best self shine. That’s where confidence really comes from. So to my younger self, and to anyone reading, \u003cstrong\u003eyou don’t need to fit in, you just need to figure out who you are.\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f82eb1bb-97e7-4c69-a8aa-3dbd1788d42d\"}":{"__typename":"DeepDives","uuid":"f82eb1bb-97e7-4c69-a8aa-3dbd1788d42d","content":"\u003cp\u003eMentorship matters to me because I know what it feels like to be curious but unsure, eager to grow, but not always knowing where to start or who to ask. Having someone a few steps ahead, who’s been through the same doubts and detours, can make all the difference.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome of the most important moments in my growth came not from classes or textbooks, but from conversations, when someone believed in me before I fully believed in myself, or when they shared a story that made me feel less alone.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, I mentor because I want to be that person for someone else. Not to have all the answers, but to help others ask better questions, explore more bravely, and trust themselves a little more each step of the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"fbb4b0fe-8e44-4c8b-a228-96ecfd273c5c\"}":{"__typename":"DeepDives","uuid":"fbb4b0fe-8e44-4c8b-a228-96ecfd273c5c","content":"\u003cp\u003eIn my spare time, I love moving my body and moving my mind. That might mean going for a run, trying a new sport, or just stretching out after a long day. I’m always curious to challenge myself physically, whether it’s rock climbing, joining a pickup game of soccer, or training for something that once felt out of reach.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut I also make space for slower moments. I love reading, especially historical fiction or books that shift my perspective or introduce me to new ideas. When there’s an opportunity, I enjoy traveling and experiencing new places, people, and ways of living. And sometimes, what I really need is a nap. Letting my body rest and recover is just as important as pushing it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"88513b1b-0449-4246-bded-32d2253afbfe\"}":{"__typename":"School","uuid":"88513b1b-0449-4246-bded-32d2253afbfe","name":"Arundel High School","city":"Gambrills","type":"HIGH","state":"Maryland","country":"United States","zip":"21054"},"Education:{\"uuid\":\"96c8d24e-f18c-4070-9c05-567fef3e0556\"}":{"__typename":"Education","uuid":"96c8d24e-f18c-4070-9c05-567fef3e0556","school":{"__ref":"School:{\"uuid\":\"88513b1b-0449-4246-bded-32d2253afbfe\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"79610151-3e0d-4077-a82a-5c89d4fb757f\"}":{"__typename":"School","uuid":"79610151-3e0d-4077-a82a-5c89d4fb757f","name":"University of Maryland","city":"College Park","type":"COLLEGE","state":"Maryland","country":"United States","zip":"20742"},"Education:{\"uuid\":\"1214784c-184a-4b92-bbb1-e89c5b1948c9\"}":{"__typename":"Education","uuid":"1214784c-184a-4b92-bbb1-e89c5b1948c9","school":{"__ref":"School:{\"uuid\":\"79610151-3e0d-4077-a82a-5c89d4fb757f\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"5a15eca8-a62a-4462-95c1-dfe9e74588cb\"}":{"__typename":"MentorPublicProfile","uuid":"5a15eca8-a62a-4462-95c1-dfe9e74588cb","displayName":"Saheli P.","slug":"saheli-patel","biography":"\u003cp\u003eHi there! I’m Saheli, and I’m passionate about helping students unlock their potential, academically and creatively. I’m currently a PhD student in engineering at the University of Pennsylvania, and every day I’m inspired by how learning can transform not just grades, but confidence and dreams.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond textbooks, I love hiking, traveling, and playing various sports, and reading. I believe learning should feel like an \u003cem\u003eadventure\u003c/em\u003e rather than a chore. Whether we’re diving into challenging topics or exploring a your wildest passions, I’m here to make that journey exciting, meaningful, and empowering.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, I was lucky to have mentors who saw my potential even when I couldn’t and that’s the energy I will bring to every session. I’m excited to be a champion, a coach, and a cheerleader for you every step of the way. Let’s learn and grow together!\u003c/p\u003e","teachingVideoPlaybackId":"xdQ64XGp5ZfwkTNLlplZ9h68qcaRwWOtNijczFrs6mE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cd345f5e-674f-4b29-9e19-9a437ab0e560\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b19f99a-6028-4b5c-b08e-5821c7105129\"}"},{"__ref":"DeepDives:{\"uuid\":\"f82eb1bb-97e7-4c69-a8aa-3dbd1788d42d\"}"},{"__ref":"DeepDives:{\"uuid\":\"fbb4b0fe-8e44-4c8b-a228-96ecfd273c5c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8fb483d3-b5e6-47c5-b879-843374e1ad4b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"96c8d24e-f18c-4070-9c05-567fef3e0556\"}"},{"__ref":"Education:{\"uuid\":\"1214784c-184a-4b92-bbb1-e89c5b1948c9\"}"}],"hiredAt":"2025-04-29T11:36:58.442Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Physics","Writing","Academic Coaching","College Essay Writing","Reading","Computer Science","Creative Writing","K-6 Storybook","Visual Arts / Graphic Design","Sports Journalism","Video / Photography","Finance / Investing","Coding / Programming","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Aviation / Aerospace","Machine Learning / AI","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"saheli-patel\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5a15eca8-a62a-4462-95c1-dfe9e74588cb\"}"}}},"_sentryTraceData":"0d9917432dbc4a20957681b3277fa5e8-a2c608ff7e7b188f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5
