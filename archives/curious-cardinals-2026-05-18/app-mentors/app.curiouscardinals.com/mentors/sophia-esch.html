xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"45c8ffd2-ffb3-444a-bfb4-1af68d3529d9\"}":{"__typename":"Favorites","uuid":"45c8ffd2-ffb3-444a-bfb4-1af68d3529d9","photoUrl":"https://ucarecdn.com/0e06193e-7692-47fc-aa39-e50ef3b3ddf9/","title":"AT.LONG.LAST.A$AP","type":"ALBUM"},"Favorites:{\"uuid\":\"6c9806ef-c198-4cb8-b849-b367d2e1e44c\"}":{"__typename":"Favorites","uuid":"6c9806ef-c198-4cb8-b849-b367d2e1e44c","photoUrl":"https://ucarecdn.com/13f7ede2-6c3d-4723-bf77-eb71ea99cc99/","title":"Kylian Mbappé","type":"ATHLETE"},"Favorites:{\"uuid\":\"2597265b-fdfc-449c-9252-33409ad693b3\"}":{"__typename":"Favorites","uuid":"2597265b-fdfc-449c-9252-33409ad693b3","photoUrl":"https://ucarecdn.com/e811df47-974c-4bd4-ba2b-b5bcc768aed1/","title":"Extremely Loud and Incredibly Close","type":"BOOK"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"f31d41cc-a222-42f7-a284-3924ea621983\"}":{"__typename":"DeepDives","uuid":"f31d41cc-a222-42f7-a284-3924ea621983","content":"\u003cp\u003eI was very academically driven in high school and wanted to push myself as hard as possible. As a sophomore, I was the only student in my grade to take 3 AP classes, a major academic accomplishment for myself. The travel soccer team I played for was a huge time commitment, and the practices were over an hour from my house. Many of my high school memories involved doing homework with a flashlight on the rides back from practice. Even though I was pretty burnt out by graduation, I wouldn't change how much I challenged myself in high school. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"cdc88816-248f-4f96-b4ef-e4ac81b6b361\"}":{"__typename":"DeepDives","uuid":"cdc88816-248f-4f96-b4ef-e4ac81b6b361","content":"\u003cp\u003eAlthough my ultimate goal is to be a doctor, my dream job is being a producer or sound engineer in the rap/hip hop industry! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"ae5eb2fe-7076-45ca-a461-daaafbb0143a\"}":{"__typename":"DeepDives","uuid":"ae5eb2fe-7076-45ca-a461-daaafbb0143a","content":"\u003cp\u003eI decided to become a mentor because I want to inspire the next generation to become motivated students and engaged, informed citizens. Right now, education is at a turning point, and I want to show students the value of learning and finding ways to be excited about life and the future. My goal is to make meaningful and lasting connections with my mentees and see what they can achieve in the next couple of years! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"7a682f69-a745-4e2c-a2fe-5547e9825dfe\"}":{"__typename":"School","uuid":"7a682f69-a745-4e2c-a2fe-5547e9825dfe","name":"Kennebunk High School","city":"Kennebunk","type":"HIGH","state":"Maine","country":"United States","zip":"04043"},"Education:{\"uuid\":\"7a481d30-a9ce-46af-821b-47a6e0ae01bf\"}":{"__typename":"Education","uuid":"7a481d30-a9ce-46af-821b-47a6e0ae01bf","school":{"__ref":"School:{\"uuid\":\"7a682f69-a745-4e2c-a2fe-5547e9825dfe\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"4150fc1a-8785-4611-a08a-87f02e2bf0c4\"}":{"__typename":"Education","uuid":"4150fc1a-8785-4611-a08a-87f02e2bf0c4","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"247d232e-b135-43f3-8d8d-b2484a7af726\"}":{"__typename":"MentorPublicProfile","uuid":"247d232e-b135-43f3-8d8d-b2484a7af726","displayName":"Sophia E.","slug":"sophia-esch","biography":"\u003cp\u003eHi! I’m Sophia and I'm a junior studying biomedical engineering on the pre-med track at Brown University. Growing up, I have always had a passion for science and math, which is why I chose to pursue engineering at Brown. Throughout high school, I took 11 AP classes and was involved in many extracurricular activities, including club soccer, the Civil Rights team, and musical groups where I played violin and flute. Another hobby I had in high school was learning French, which ended up qualifying me to receive the Maine Seal of Biliteracy! At Brown, I have taken two French courses and continue to improve my skills.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI spend my time at Brown doing research with a PhD student, going to the gym, and finding new study spots around Providence. My research is centered around microfluidic assay development, which is important for the pharmaceutical discovery process. My goal after college is to go to medical school and specialize in orthopaedics. Recently, I was accepted into an Orthopaedic Fellowship at the Bronx Care Hospital in NYC! I am very passionate about the intersection between medicine and engineering and would be happy to share my insights in these areas.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I am interested in fashion, music, coffee, and traveling. Since I grew up in a small town in Maine, I love visiting new cities and learning about different cultures and lifestyles.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI hope we can learn from each other and make learning a little less stressful! Looking forward to connecting with you :)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"CgNuekytXYyN6KeBuPOGgSoGopG00MVAe7ho2Mu2wdf8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"45c8ffd2-ffb3-444a-bfb4-1af68d3529d9\"}"},{"__ref":"Favorites:{\"uuid\":\"6c9806ef-c198-4cb8-b849-b367d2e1e44c\"}"},{"__ref":"Favorites:{\"uuid\":\"2597265b-fdfc-449c-9252-33409ad693b3\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f31d41cc-a222-42f7-a284-3924ea621983\"}"},{"__ref":"DeepDives:{\"uuid\":\"cdc88816-248f-4f96-b4ef-e4ac81b6b361\"}"},{"__ref":"DeepDives:{\"uuid\":\"ae5eb2fe-7076-45ca-a461-daaafbb0143a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d2e2fedb-2933-46d9-bf49-56505e56e5c0/-/preview/-/format/jpg/","https://ucarecdn.com/112297f7-2c21-49ed-b4d9-bff09c052ecb/-/preview/-/format/jpg/","https://ucarecdn.com/378efd83-24b9-4daf-b1c1-f415c22d3c43/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7a481d30-a9ce-46af-821b-47a6e0ae01bf\"}"},{"__ref":"Education:{\"uuid\":\"4150fc1a-8785-4611-a08a-87f02e2bf0c4\"}"}],"hiredAt":"2025-02-05T20:10:24.567Z","topics":["K-5 Grade Math","Geometry","Precalculus / Trigonometry","Calculus","Pre-Algebra","Algebra I","6-8 Grade Science","Biology","Chemistry","Writing","French","Academic Coaching","Executive Functi
