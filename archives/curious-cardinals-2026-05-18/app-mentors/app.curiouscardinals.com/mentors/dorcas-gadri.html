xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e9fba955-dc5b-4628-a97a-c94c9a2210fc\"}":{"__typename":"Favorites","uuid":"e9fba955-dc5b-4628-a97a-c94c9a2210fc","photoUrl":"https://ucarecdn.com/4a0166de-f4f9-4949-bf3b-4daac989d2a3/","title":"The Martian","type":"MOVIE"},"Favorites:{\"uuid\":\"bf5ec5ce-699a-4b0d-b9d9-778c63261ab6\"}":{"__typename":"Favorites","uuid":"bf5ec5ce-699a-4b0d-b9d9-778c63261ab6","photoUrl":"https://ucarecdn.com/0347a5bc-038c-41fc-a581-bbc78ba38198/","title":"NYC","type":"CITY"},"Favorites:{\"uuid\":\"b5824cd8-35fd-47bd-9a56-d3acba57d9be\"}":{"__typename":"Favorites","uuid":"b5824cd8-35fd-47bd-9a56-d3acba57d9be","photoUrl":"https://ucarecdn.com/b019c6c2-2966-42bd-9201-69e9a3e03465/","title":"Dream Count","type":"BOOK"},"CausesSupported:{\"uuid\":\"afdb8559-f877-4294-afe3-90851989afb0\"}":{"__typename":"CausesSupported","uuid":"afdb8559-f877-4294-afe3-90851989afb0","name":"Malala Fund","description":"","photoUrl":"https://ucarecdn.com/ca982117-9a0d-4c7b-a6f4-384a05b30d9e/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2faf37ed-4afb-44bb-85ab-e5d7e5114034\"}":{"__typename":"DeepDives","uuid":"2faf37ed-4afb-44bb-85ab-e5d7e5114034","content":"\u003cp\u003eI would tell my younger self that while striving for academic excellence is valuable, it shouldn’t eclipse the importance of personal growth and being authentic. The intense pressure to succeed in a competitive academic setting often made me shy away from exploring interests outside the typical STEM fields. I’d encourage younger me to keep her scientific curiosity alive while also embracing her creative writing abilities because this seemingly unrelated interest would later turn out to be incredibly useful in solving complex problems creatively. Most importantly, I’d remind her that there are many ways to lead and make an impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"af06e5a3-9342-4e48-985b-e7f74ee73e7d\"}":{"__typename":"DeepDives","uuid":"af06e5a3-9342-4e48-985b-e7f74ee73e7d","content":"\u003cp\u003eI’ve always been captivated by Developmental (embryology) and Regenerative (stem cell biology) Biology because it beautifully combines complexity with a sense of purpose. The study of stem cells illustrates how even the smallest cellular changes can have a huge impact on human development. Through my undergraduate research on atherosclerosis, I’ve come to realize how understanding the most minute processes can lead to revolutionary healthcare advancements. This connection between cellular mechanisms and their potential to improve human lives keeps inspiring me in my academic endeavors and future aspirations in medicine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"09967e81-2e8a-4003-9006-d54e29cd9757\"}":{"__typename":"DeepDives","uuid":"09967e81-2e8a-4003-9006-d54e29cd9757","content":"\u003cp\u003eMentorship feels a lot like being a tour guide through a world brimming with possibilities. Growing up, I encountered so many brilliant kids who just needed someone to help illuminate the paths they couldn’t yet see. That’s why, to me, mentorship isn’t about having all the answers; it’s about showing someone they have the potential to ask remarkable questions and seek truth. The mentors who truly shaped me not only imparted knowledge, but they also believed in me even before I believed in myself. Now, I’m excited to be that spark for someone else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"da03512e-38ff-479b-9175-e7b6cdd871f9\"}":{"__typename":"DeepDives","uuid":"da03512e-38ff-479b-9175-e7b6cdd871f9","content":"\u003cp\u003eHaving immigrated to the United States as a child, I, as a Ghanaian woman, offer a unique viewpoint on mentoring that focuses on adaptability and cultural understanding. My journey between two cultures has taught me how important it is to create inclusive learning environments where students can fully express themselves. I recognize that each student's background plays a significant role in shaping their academic experience. So, whether we're working through a difficult math problem or deconstructing literature, I always encourage my students to draw from their personal experiences and perspectives, just as I learned to integrate my heritage with American academic approaches.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"3b5b29ce-bda6-4810-b7ca-a663daa404e5\"}":{"__typename":"School","uuid":"3b5b29ce-bda6-4810-b7ca-a663daa404e5","name":"Elite Scholars Academy","city":"Jonesboro","type":"HIGH","state":"Georgia","country":"United States","zip":"30236"},"Education:{\"uuid\":\"282e75fb-8ace-4d5c-b1d8-d3a074ceae2b\"}":{"__typename":"Education","uuid":"282e75fb-8ace-4d5c-b1d8-d3a074ceae2b","school":{"__ref":"School:{\"uuid\":\"3b5b29ce-bda6-4810-b7ca-a663daa404e5\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"692431e4-700c-4883-89e5-d0638a5360fb\"}":{"__typename":"Education","uuid":"692431e4-700c-4883-89e5-d0638a5360fb","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Human Biology","degree":null},"Testimonial:f2d8c40a-53e6-41c5-a8fa-86f0930342aa":{"__typename":"Testimonial","id":"f2d8c40a-53e6-41c5-a8fa-86f0930342aa","text":"Dorcas has been amazing mentor to my daughter.  Watching my daughter grow and expand her skills and knowledge has been great. Looking forward to continuing long term mentorship in partnership with Curious Cardinals.","date":"2025-08-22 21:45:51.146+00","rating":5,"endorser":{"__typename":"Endorser","name":"Igor V","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"775d0114-e89c-4592-8f46-2b9a8ff7e8de\"}":{"__typename":"MentorPublicProfile","uuid":"775d0114-e89c-4592-8f46-2b9a8ff7e8de","displayName":"Dorcas G.","slug":"dorcas-gadri","biography":"\u003cp\u003eHi there! My name is Dorcas, and I'm a Harvard graduate in Human Developmental and Regenerative Biology with a secondary in Global Health \u0026amp; Health Policy. I help students grow into confident thinkers—whether that means building a stronger foundation in STEM, finding their voice as a writer, or understanding how science shapes the world around them.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOver the past four years, I've had the privilege of working at the intersection of science, medicine, and human impact, conducting cardiovascular research at Brigham and Women's Hospital and supporting epidemiology studies at Massachusetts General Hospital. One conviction has stayed with me throughout: understanding how things work is one of the most powerful tools a person can have.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI first fell in love with science because of mentors who made it feel alive and accessible, not intimidating. That experience shapes everything about how I work with students today. I believe the best learning happens when material is connected to something a student genuinely cares about—so I always start by listening. Whether a student is wrestling with calculus, making the sense of how the brain works, building their first research project, or finding the story they want to tell in their college essay, I meet them exactly where they are and build from there. My approach is patient, structured, and deeply personalized.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, my background spans the hard sciences, quantitative methods, and the humanities, which means I'm genuinely comfortable moving across subjects. I've worked with statistical modeling in R, STATA, and Python; written scientific publications and policy reports; and developed the communication skills to translate complex ideas for audiences ranging from researchers to general readers. This range lets me support students at every stage—from early math and reading foundations, to middle school science, to high school coursework and SAT/ACT preparation. I'm also deeply invested in executive function and academic coaching: learning how to learn, manage time, set goals, and build study systems that actually work is foundational to everything else, and I love helping students develop these habits early.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm also a writer outside of academic contexts. I'm currently working on a dystopian novel—a long-form project that is teaching me as much about discipline and revision as any course I've taken. This creative work informs how I coach writing at every level, whether a student is writing their first storybook, developing a journalistic piece, or crafting their college application essays. I understand the vulnerability that comes with putting words on a page, and I know how to make that process feel manageable and even exciting.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I'm not studying, mentoring, or writing, you'll find me dissecting book-to-screen adaptations with friends or discovering new music for my playlist (gospel, Afrobeats, R\u0026amp;B, and soul are always on rotation).\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you're looking for a mentor who will show up prepared, adapt to your child's learning style, push them to think more deeply, and make the process feel rewarding rather than stressful—I would love to connect. I look forward to meeting your child and helping them build the skills and confidence to pursue whatever excites them most!\u003c/p\u003e","teachingVideoPlaybackId":"eFMmKA02N1Zo1SaRGmCI9g4zHhYdhkL8a21kGbJcEeFs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing honored with the Maurice M. Pechet Prize in Medicine has been a significant milestone for me! This annual honor goes to a senior at Harvard who stands out for their exceptional academic talent and passion for solving major health issues through research and clinical practice. This award reflects my dedication to advocating for global child health and cardiovascular research.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e9fba955-dc5b-4628-a97a-c94c9a2210fc\"}"},{"__ref":"Favorites:{\"uuid\":\"bf5ec5ce-699a-4b0d-b9d9-778c63261ab6\"}"},{"__ref":"Favorites:{\"uuid\":\"b5824cd8-35fd-47bd-9a56-d3acba57d9be\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"afdb8559-f877-4294-afe3-90851989afb0\"}"}],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2faf37ed-4afb-44bb-85ab-e5d7e5114034\"}"},{"__ref":"DeepDives:{\"uuid\":\"af06e5a3-9342-4e48-985b-e7f74ee73e7d\"}"},{"__ref":"DeepDives:{\"uuid\":\"09967e81-2e8a-4003-9006-d54e29cd9757\"}"},{"__ref":"DeepDives:{\"uuid\":\"da03512e-38ff-479b-9175-e7b6cdd871f9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6630d1f7-679b-4ea2-92be-7cc4c3134ef3/-/preview/-/format/jpg/","https://ucarecdn.com/3066d5b1-56b5-4dd8-819f-30bc0577d11f/-/preview/-/format/jpg/","https://ucarecdn.com/df4991c2-dc18-458f-94b4-743b6d3642bc/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"282e75fb-8ace-4d5c-b1d8-d3a074ceae2b\"}"},{"__ref":"Education:{\"uuid\":\"692431e4-700c-4883-89e5-d0638a5360fb\"}"}],"hiredAt":"2024-10-29T10:40:39.601Z","topics":["STEM Project","Medicine / Health","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Calculus","Statistics","Writing","Biology","Chemistry","Algebra I","Algebra II","6-8 Grade Science","Academic Coaching","Executive Function","College Essay Writing","Reading","Creative Writing","K-6 Storybook","Sustainability","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":false,"testimonials":[{"__ref":"Testimonial:f2d8c40a-53e6-41c5-a8fa-86f0930342aa"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"dorcas-gadri\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"775d0114-e89c-4592-8f46-2b9a8ff7e8de\"}"}}},"_sentryTraceData":"c7837c4c95184535bce24e12012ab3a7-b17e4c4cffa1f43a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c7837c4c
