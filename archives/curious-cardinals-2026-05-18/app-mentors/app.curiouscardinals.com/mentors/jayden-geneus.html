he time, I saw this as a disadvantage, but as I got older, I realized it was actually one of my greatest strengths.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e     Because nothing came effortlessly to me, I had to put in extra effort to succeed. I spent countless hours refining my skills, whether it was practicing layups until I could compete with the best at my school or going from a hesitant drummer to the lead percussionist at my local church. Every challenge I faced taught me discipline, perseverance, and the value of hard work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e     This mindset extended beyond my extracurriculars into my academic life, where I honed organization and intentionality. I relied on spreadsheets, calendars, and structured planning to balance my responsibilities and stay on top of my goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e     Wanting to give back, I created Culture Corner, a program that combined my love for literature and culture by reading to K-5 students at my alma mater. This project allowed me to mentor young minds the same way I was mentored, while also strengthening my leadership skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e     At Duke, I’m embracing new opportunities—playing in the Marching Band’s percussion section, advocating for immigrant rights through Beyond Borders, and fully immersing myself in my college experience. I’m excited for what’s ahead and eager to keep growing in every way possible!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"I2N3LeQRuH3unKO6Lgh01cZ28wpTcGazHG9R02W7lht00E","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7fb11849-fc46-4528-926e-41bfd34f2be7\"}"},{"__ref":"Favorites:{\"uuid\":\"6197ca9d-c005-4a1e-baa9-fbd6319808fc\"}"},{"__ref":"Favorites:{\"uuid\":\"4e502ddc-41e4-4bee-aa1e-db27a189cec2\"}"}],"causesSupported":[],"major":"African and African American Studies and Economics","deepDives":[{"__ref":"DeepD
