xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2cec1ef6-2c84-4086-9c4d-e7697fcaf965\"}":{"__typename":"Favorites","uuid":"2cec1ef6-2c84-4086-9c4d-e7697fcaf965","photoUrl":"https://ucarecdn.com/408ee7a6-4771-47b8-a8f8-6db296a1d2bd/","title":"Jim Carrey","type":"ACTOR"},"CausesSupported:{\"uuid\":\"591097c2-fee4-4de1-a737-1a2137bed747\"}":{"__typename":"CausesSupported","uuid":"591097c2-fee4-4de1-a737-1a2137bed747","name":"Helping Hand","description":"\u003cp\u003eHelping Ukrainian refugees integrate in Georgian culture and workforce.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2d689c94-e6e7-4fa1-9ab1-fc0a906742c3\"}":{"__typename":"DeepDives","uuid":"2d689c94-e6e7-4fa1-9ab1-fc0a906742c3","content":"\u003cp\u003eDiscover and try as many different things as possible. Don’t limit yourself to just a few activities: the more options you explore, the more likely you are to find what you truly enjoy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"15b30ca5-3026-406e-98e9-e40d5b042ef1\"}":{"__typename":"DeepDives","uuid":"15b30ca5-3026-406e-98e9-e40d5b042ef1","content":"\u003cp\u003eWhen I was a kid, I was scared of horrifying masked figures in my dreams. In one dream, when the killer came closer and I had nowhere to go, I overcame my fear by removing his mask. It turned out to be my friend playing a prank on me. I dabbed him up, and we had a cheerful conversation afterward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d7ecf969-327e-402b-9881-2b6f3fa947ac\"}":{"__typename":"DeepDives","uuid":"d7ecf969-327e-402b-9881-2b6f3fa947ac","content":"\u003cp\u003eMechanical Engineering appeals to me for several reasons:\u003cbr\u003e1) Rigorous, measurable, and objective.\u003cbr\u003e2) Requires the chain of enormous professional knowledge. Hence, someone cannot replace you easily\u003cbr\u003e3) Doesn’t have \"the ending\" because it is based on physics, which never stops creating new constraints, materials, and performance limits.\u003c/p\u003e\u003cp\u003e4) Freedom. You can design anything… as long as it obeys physics.\u003c/p\u003e\u003cp\u003e5) Extremely broad: diverse job opportunities\u003c/p\u003e\u003cp\u003e6) Answers \"How?\" and \"Why\" questions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7e636057-442d-4305-a0d4-a357e61264b4\"}":{"__typename":"DeepDives","uuid":"7e636057-442d-4305-a0d4-a357e61264b4","content":"\u003cp\u003eLove meeting new people.\u003cbr\u003ePlay chess online.\u003c/p\u003e\u003cp\u003eRead news and watch stock prices.\u003c/p\u003e\u003cp\u003eExercise.\u003c/p\u003e\u003cp\u003eCall with parents/friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"400798eb-7dc3-4009-9ca4-8e20acc41aff\"}":{"__typename":"School","uuid":"400798eb-7dc3-4009-9ca4-8e20acc41aff","name":"Vladimir Komarov Tbilisi School of Physics and Mathematics N199","city":"Tbilisi","type":"HIGH","state":"Tbilisi","country":"Georgia","zip":"0177"},"Education:{\"uuid\":\"decdee28-6ead-4033-88f3-0d47e70da034\"}":{"__typename":"Education","uuid":"decdee28-6ead-4033-88f3-0d47e70da034","school":{"__ref":"School:{\"uuid\":\"400798eb-7dc3-4009-9ca4-8e20acc41aff\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"50a534a0-ef8a-4cb9-8a5c-3da0a490ac99\"}":{"__typename":"Education","uuid":"50a534a0-ef8a-4cb9-8a5c-3da0a490ac99","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"3a396188-0951-4d33-9e27-db0d1459772c\"}":{"__typename":"MentorPublicProfile","uuid":"3a396188-0951-4d33-9e27-db0d1459772c","displayName":"Mikheil V.","slug":"mikheil-vazagashvili","biography":"\u003cp\u003eI’m Mikheil Vazagashvili, a Mechanical Engineering student at Columbia University, where I am a C.P. Davis Scholar and a recipient of the Mahendra Mehta Scholarship. I come from a rigorous physics and mathematics background, including winning a national physics contest organized by CERN and placing first in a national mathematical olympiad. Those experiences trained me to think quantitatively, stay calm under pressure, and approach complex problems with structure and discipline.\u003c/p\u003e\u003cp\u003eAt the same time, I have always believed that technical ability only matters if it translates into real outcomes. Before starting at Columbia, I worked as an Operations and Data Analyst at Eurotrade in Tbilisi, Georgia. There, I analyzed PLC and sensor data using SQL and Excel to calculate MTBF and MTTR across machines and production lines. By prioritizing corrective actions based on data, we reduced unplanned downtime by 32 percent. I also built a linear optimization model in Excel Solver to minimize changeover and idle time per SKU, and validated it through pilot runs. In addition, I designed yield tracking dashboards and helped standardize operating procedures, contributing to a yield improvement of about 12 percent. That role taught me how to connect engineering analysis with measurable operational impact.\u003c/p\u003e\u003cp\u003eEntrepreneurship has been another defining part of my journey. I founded and currently run Powerwash-NYC, where I oversee operations, marketing, and client acquisition. I built the company website and improved its SEO ranking from page eight to the number one result for “Powerwash NYC” within three months. I manage scheduling, equipment maintenance, safety protocols, and on site consultations, and I focus heavily on delivering high quality service that generates repeat business and referrals. Running a company has sharpened my leadership, communication, and decision making skills in ways that no classroom could.\u003c/p\u003e\u003cp\u003eTechnically, I enjoy building systems across hardware and software. I designed and built a functional 3D lunar gravity visualization device that required pressure control modeling, careful material selection, and precision assembly. I have also built software projects, including a webpage that calculates the number of bonds in a compound under octet rule constraints, and a game with AI integration and custom hardware input mapping. I am comfortable with CAD, machining, circuits, programming, and data analysis, and I enjoy operating at the intersection of engineering and execution.\u003c/p\u003e\u003cp\u003eOverall, I see myself as someone who combines analytical rigor with ownership. I am motivated by technically demanding challenges, but even more by the responsibility of turning ideas into functioning systems that create real value.\u003c/p\u003e","teachingVideoPlaybackId":"pSqx487p9aPxICk7Qo8H1HlPzWCIgHNnkZL0185r3uC4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn \"Product Realization\" class my CNC desk machine broke many times because of poor quality: broken tightner, calibration sensors bugged, emergency button not working, bugs in program... Project deadlines were approaching and professor didn't have enough time to ship another machine. Hence, I decided to repair whole machine by myself everytime it crashed and surprisingly it worked and I delivered my project on time.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"2cec1ef6-2c84-4086-9c4d-e7697fcaf965\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"591097c2-fee4-4de1-a737-1a2137bed747\"}"}],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2d689c94-e6e7-4fa1-9ab1-fc0a906742c3\"}"},{"__ref":"DeepDives:{\"uuid\":\"15b30ca5-3026-406e-98e9-e40d5b042ef1\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7ecf969-327e-402b-9881-2b6f3fa947ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"7e636057-442d-4305-a0d4-a357e61264b4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9bcb3678-7bb7-4b57-a340-af3598c176af/-/preview/-/format/jpg/","https://ucarecdn.com/5e479e0d-bac4-4929-808c-807b914a7d7b/-/preview/-/format/jpg/","https://ucarecdn.com/e42becc5-86c8-4c3b-81fa-7355416ae151/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"decdee28-6ead-4033-88f3-0d47e70da034\"}"},{"__ref":"Education:{\"uuid\":\"50a534a0-ef8a-4cb9-8a5c-3da0a490ac99\"}"}],"hiredAt":"2026-02-11T19:09:57.467Z","topics":["Business / Entrepreneurship","Web Design","Game Design","Robotics / Electroni
