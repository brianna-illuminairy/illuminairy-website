xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"eaeffb12-3381-4a57-b48f-a98ef14e4ad4\"}":{"__typename":"Favorites","uuid":"eaeffb12-3381-4a57-b48f-a98ef14e4ad4","photoUrl":"https://ucarecdn.com/96475749-e488-4c9e-81f9-696f2edc9858/","title":"Denver","type":"CITY"},"Favorites:{\"uuid\":\"18204b81-86da-4e25-b62a-bca31aa78ded\"}":{"__typename":"Favorites","uuid":"18204b81-86da-4e25-b62a-bca31aa78ded","photoUrl":"https://ucarecdn.com/21893fac-9dd8-4d32-a306-3473c058c2b2/","title":"Skiing","type":"SPORT"},"Favorites:{\"uuid\":\"a37933bf-9691-4da6-a6fd-7545ef37ee0c\"}":{"__typename":"Favorites","uuid":"a37933bf-9691-4da6-a6fd-7545ef37ee0c","photoUrl":"https://ucarecdn.com/c8cd660e-030d-48ac-986f-3418be24b2c1/","title":"The Hunger Games","type":"MOVIE"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8e681070-dffe-460c-818e-a028eef1fdb9\"}":{"__typename":"DeepDives","uuid":"8e681070-dffe-460c-818e-a028eef1fdb9","content":"\u003cp\u003eAfter a wildfire tore through my Colorado community, climate change felt immediate and personal. I wanted to make a difference. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI taught myself how to design a carbon footprint calculator, pitched the idea, and secured $5,000 in funding from Amazon, along with support from Google for Nonprofits. That backing enabled me to collaborate with developers across the U.S., U.K., and India to launch Change Carbon, a climate action app on the Apple App Store. The platform went on to host 100+ youth-written articles and help plant 10,000+ trees.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUsing the platform to organize students, I drafted a climate justice policy that was ratified by 200 schools, impacting nearly 92,000 students. When former Vice President Kamala Harris met with our team, she told us, \"The lives of people you may never meet, people who may never know your name, will be forever changed because of your advocacy.\"\u003c/p\u003e\u003cbr\u003e\u003cp\u003eChange can come from anywhere, even a high school student, and it’s a belief I now help others build.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e1d1c14c-1ec7-4f07-8393-2b66937e2451\"}":{"__typename":"DeepDives","uuid":"e1d1c14c-1ec7-4f07-8393-2b66937e2451","content":"\u003cp\u003eMentorship matters to me because every meaningful step I’ve taken came from someone showing me how. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m committed to making that kind of guidance more accessible to others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"dbe15dcd-284e-457a-b045-9efda47bf81e\"}":{"__typename":"DeepDives","uuid":"dbe15dcd-284e-457a-b045-9efda47bf81e","content":"\u003cp\u003eGrowing up as a Filipino American and the child of immigrants taught me how opaque systems can be. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eI teach with clarity and flexibility so students feel supported, confident, and equipped to navigate those systems themselves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"60605947-58c3-45f4-aae4-4cfe9ab83416\"}":{"__typename":"DeepDives","uuid":"60605947-58c3-45f4-aae4-4cfe9ab83416","content":"\u003cp\u003eFollow your curiosity, not the crowd. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"15ab7f72-a190-4e1b-95d6-1e83b91063fb\"}":{"__typename":"School","uuid":"15ab7f72-a190-4e1b-95d6-1e83b91063fb","name":"Denver East High School","city":"Denver","type":"HIGH","state":"Colorado","country":"United States","zip":"80206"},"Education:{\"uuid\":\"45f5601b-2a80-4ab5-9857-2ece58f29d3d\"}":{"__typename":"Education","uuid":"45f5601b-2a80-4ab5-9857-2ece58f29d3d","school":{"__ref":"School:{\"uuid\":\"15ab7f72-a190-4e1b-95d6-1e83b91063fb\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"edaee106-278d-4e33-8e61-1f3fa63d2150\"}":{"__typename":"Education","uuid":"edaee106-278d-4e33-8e61-1f3fa63d2150","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics \u0026 Philosophy","degree":null},"MentorPublicProfile:{\"uuid\":\"76464297-071d-479d-8d40-4126d2147095\"}":{"__typename":"MentorPublicProfile","uuid":"76464297-071d-479d-8d40-4126d2147095","displayName":"Gabriel N.","slug":"gabriel-nagel","biography":"\u003cp\u003eGabriel Nagel is a Stanford University student, nationally recognized climate leader, and mentor who helps students turn passion, especially in climate and entrepreneurship, into real initiatives, leadership experience, and compelling college applications.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, Gabriel studies Economics and Philosophy and is Co-President of Affiliated Stanford Entrepreneurial Students (ASES), the university’s largest entrepreneurship organization, where he has organized programs featuring leaders from Y Combinator to OpenAI. His campus leadership and impact led to his appointment to the Stanford Board of Trustees.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGabriel’s entrepreneurship and climate leadership extend well beyond campus. He is the inaugural Chairperson of the U.S. Environmental Protection Agency’s Youth Council, the first youth-led, Congressionally chartered federal advisory committee in U.S. history. Selected from 1,200+ applicants, he led the council in delivering 35 policy recommendations advising an $11.88B federal agency. He also serves as a Global Goal Ambassador for Climate Action with the United Nations Association, helping advance the UN Youth Declaration of Human Rights following national town halls engaging 20,000+ young people and formally advising the U.S. State Department. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOriginally from Colorado, Gabriel graduated as Valedictorian (1 of 618) from Denver East High School, earning the Coca-Cola Scholarship (top 0.15% nationally) and the Presidential Environmental Award. He founded an environmental nonprofit that planted 10,000+ trees and passed a historic environmental justice policy across 200 public schools, impacting 92,000+ students. Vice President Kamala Harris recognized the work as “a model for the nation,” and Gabriel has since spoken at the United Nations, Harvard Climate Week, and National Public Radio. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, Gabriel has experience in public policy, global development, finance, and consulting, having worked with the United States Congress, the World Bank, J.P. Morgan, and the Boston Consulting Group. \u003c/p\u003e\u003cbr\u003e\u003cp\u003ePersonally, he enjoys hiking Colorado 14ers, crafting matcha, and practicing meditation, having recently completed a 10-day silent Vipassana retreat. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eGabriel is committed to mentorship, having served as a tutor at the Stanford Hume Center and provided 200+ hours of one-on-one elite college advising to high school students. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eHe will help students find what drives them and turn it into action, whether that means launching a nonprofit, speaking on global stages, or passing real policy, ensuring they stand out and make a massive impact. \u003c/p\u003e","teachingVideoPlaybackId":"EDiElAFCiYyw5A3dM1SvtKNcLL00XYQ2osbyiw4liWFg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"eaeffb12-3381-4a57-b48f-a98ef14e4ad4\"}"},{"__ref":"Favorites:{\"uuid\":\"18204b81-86da-4e25-b62a-bca31aa78ded\"}"},{"__ref":"Favorites:{\"uuid\":\"a37933bf-9691-4da6-a6fd-7545ef37ee0c\"}"}],"causesSupported":[],"major":"Economics \u0026 Philosophy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8e681070-dffe-460c-818e-a028eef1fdb9\"}"},{"__ref":"DeepDives:{\"uuid\":\"e1d1c14c-1ec7-4f07-8393-2b66937e2451\"}"},{"__ref":"DeepDives:{\"uuid\":\"dbe15dcd-284e-457a-b045-9efda47bf81e\"}"},{"__ref":"DeepDives:{\"uuid\":\"60605947-58c3-45f4-aae4-4cfe9ab83416\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0040623e-65eb-4b85-9521-ee097224ae7b/-/preview/-/format/jpg/","https://ucarecdn.com/823278d2-30cf-4a74-9fda-63e338838429/-/preview/-/format/jpg/","https://ucarecdn.com/3bfabfcf-63cc-4e17-afa9-fb0d6db4fb53/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"45f5601b-2a80-4ab5-9857-2ece58f29d3d\"}"},{"__ref":"Education:{\"uuid\"
