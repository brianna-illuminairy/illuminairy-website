xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ef42e15c-323d-4a52-a7e1-690462e31c31\"}":{"__typename":"DeepDives","uuid":"ef42e15c-323d-4a52-a7e1-690462e31c31","content":"\u003cp\u003eI co-founded a nonprofit called Southern Ohio Soles, where we provide new sneakers to students in need across Appalachian Ohio. What started as a small idea in high school has grown into an organization that has donated over 500 pairs of shoes and operates across eleven school districts. Beyond the numbers, the project taught me how to build something from the ground up – developing school, government, and private sector partnerships across counties and scaling impact in a community I care deeply about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"01d17371-4a92-4745-92cf-2599e9b08b17\"}":{"__typename":"DeepDives","uuid":"01d17371-4a92-4745-92cf-2599e9b08b17","content":"\u003cp\u003eI would tell myself to stop waiting until I felt “qualified” to start something. A lot of the opportunities that shaped me came from starting before I had everything figured out. I’d also tell myself to be more intentional with my time and not spread myself too thin. In high school, it’s easy to say yes to everything, but the real growth comes from going deep on a few things that genuinely matter to you. The earlier you figure out what you actually care about – and commit to building something around it – the more meaningful your experiences become.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"9aa05fcd-eb80-4c10-9ad9-2c001c12bdea\"}":{"__typename":"DeepDives","uuid":"9aa05fcd-eb80-4c10-9ad9-2c001c12bdea","content":"\u003cp\u003eI fiercely believe that mentorship is one of the highest-leverage ways to create impact. I’ve seen firsthand how access to the right guidance can completely change someone’s confidence. With middle and high school students, that gap is even bigger. A strong mentor can take a student from having a vague interest to actually building something real. Looking back, I know how much faster I would have grown if I had someone pushing me, refining my ideas, and helping me navigate that process in high school. I want to offer that experience to students now – the kind of guidance I had to figure out on my own – so they can move from idea to execution with more confidence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5f05804c-c97e-4607-b977-2cb37976c3e6\"}":{"__typename":"DeepDives","uuid":"5f05804c-c97e-4607-b977-2cb37976c3e6","content":"\u003cp\u003eIn my spare time, I like to stay active – whether that’s training for a half marathon or golfing. I’m also really interested in following markets and economic trends, which ties into my coursework at Yale. Outside of that, I spend time working on expanding my nonprofit and staying connected to my community back home. I also enjoy watching sports, reading nonfiction, and trying new foods – especially as a way to experience different cultures.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"d45ae388-fd3c-4cfb-944e-3bd0e589e0a0\"}":{"__typename":"School","uuid":"d45ae388-fd3c-4cfb-944e-3bd0e589e0a0","name":"Jackson High School","city":"Jackson","type":"HIGH","state":"Ohio","country":"United States","zip":"45640"},"Education:{\"uuid\":\"1a97f959-4272-4b6b-82da-144df570a45e\"}":{"__typename":"Education","uuid":"1a97f959-4272-4b6b-82da-144df570a45e","school":{"__ref":"School:{\"uuid\":\"d45ae388-fd3c-4cfb-944e-3bd0e589e0a0\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"4a65f4fd-5581-402e-8f6b-19fc9559cb66\"}":{"__typename":"Education","uuid":"4a65f4fd-5581-402e-8f6b-19fc9559cb66","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics \u0026 Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"7a43d6ff-8bd3-4f13-bd5c-3328bb3b3b7f\"}":{"__typename":"MentorPublicProfile","uuid":"7a43d6ff-8bd3-4f13-bd5c-3328bb3b3b7f","displayName":"Dayne N.","slug":"dayne-neff","biography":"\u003cp\u003eHi! I’m Dayne, a student at Yale University studying economics and political science, originally from a small town in Ohio. A lot of my work – both inside and outside of the classroom – centers around building things that create tangible impact and helping others do the same\u003c/p\u003e\u003cp\u003eOne of the biggest projects I’ve built is a nonprofit I co-founded called Southern Ohio Soles. What started as a small idea in high school has grown into an organization that has donated over 500 pairs of new shoes to students across eleven school districts in Appalachian Ohio. Through that experience, I’ve learned how to take an idea from concept to execution – building partnerships, raising funds, and scaling something in a meaningful way. That “build from nothing” process is something I’m really passionate about helping students navigate.\u003c/p\u003e\u003cp\u003eAt Yale, I am the president of Yale Democracy Project, where I help lead initiatives focused on civic engagement, including voter registration drives and campus-wide programming. I’ve also worked as a poll worker and in a public service role with a  juvenile court, which has given me a unique perspective on how governments operate at a local level. \u003c/p\u003e\u003cp\u003eOutside of academics, I’ve had the opportunity to work across both finance and public service. At Credit Flow Research, I collaborated with teams to analyze bond market activity and deliver insights to investment bankers. I’ve also worked in a U.S. Senate office, where I’ve been involved in constituent services and gained firsthand exposure to the day-to-day work of public policy.\u003c/p\u003e\u003cp\u003eAs a mentor, I focus on helping students turn their interests into something concrete – whether that’s launching a passion project, refining an idea, or just figuring out where to start. I know how overwhelming it can feel to have a lot of ideas but no clear path forward, especially without guidance. My goal is to provide that structure and support, while also pushing students to think bigger and take ownership of what they’re building.\u003c/p\u003e\u003cp\u003eWhether you have a fully formed idea or just a spark of curiosity, I’d love to help you turn it into something real – something you can point to and say, I built that.\u003c/p\u003e","teachingVideoPlaybackId":"cgktmZ4Lmur31DEmzLQ7VUymOBOidY4pF5ZNUQJt58U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics \u0026 Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ef42e15c-323d-4a52-a7e1-690462e31c31\"}"},{"__ref":"DeepDives:{\"uuid\":\"01d17371-4a92-4745-92cf-2599e9b08b17\"}"},{"__ref":"DeepDives:{\"uuid\":\"9aa05fcd-eb80-4c10-9ad9-2c001c12bdea\"}"},{"__ref":"DeepDives:{\"uuid\":\"5f05804c-c97e-4607-b977-2cb37976c3e6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d8f6bd2a-eda9-4569-9463-f4526a54f446/-/preview/-/format/jpg/","https://ucarecdn.com/6a61dd99-babc-441b-88f5-11454af56960/-/preview/-/format/jpg/","https://ucarecdn.com/a40ebd20-fba7-46f1-a9de-53b7428555d6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1a97f959-4272-4b6b-82da-144df570a45e\"}"},{"__ref":"Education:{\"uuid\":\"4a65f4fd-5581-402e-8f6b-19fc9559cb66\"}"}],"hiredAt":"2026-04-14T03:14:48.088Z","topics":[],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"dayne-neff\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7a43d6ff-8bd3-4f13-bd5c-3328bb3b3b7f\"}"}}},"_sentryTraceData":"70f4ba60de7c4818a92585a91acd85d3-a33a96bef0e50472-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=70f4ba60de7c4818a92585a91acd85d3,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"dayne-neff"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,
