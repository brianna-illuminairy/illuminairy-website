xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"88d5b07b-9dbc-481f-bfef-acba8486a1d5\"}":{"__typename":"DeepDives","uuid":"88d5b07b-9dbc-481f-bfef-acba8486a1d5","content":"\u003cp\u003eLast year, I became fascinated with the Seven Wonders of the Ancient World— the Great Pyramids of Giza, the Temple of Artemis, the Pharos of Alexandria, the Mausoleum at Halicarnassus, the Statue of Zeus, the Colossus of Rhodes, and the Hanging Gardens of Babylon—but more specifically the poetic nature of their existence and inevitable destruction. Thus, I decided to write and produce a pop alternative concept album based these and each of their stories.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"5d1a9ecc-a34b-4f4e-a72f-bf5516ecda14\"}":{"__typename":"DeepDives","uuid":"5d1a9ecc-a34b-4f4e-a72f-bf5516ecda14","content":"\u003cp\u003eMy identity deeply shapes how I connect with others, especially in teaching. Growing up in Colombia, I was surrounded by a culture defined by warmth and hospitality. Colombians will hug and kiss strangers as a polite greeting, offer help in any situation, and always approach others with kindness and respect. That cultural foundation has made me an open, caring, and relationship-oriented person—qualities I bring into every teaching moment. I strive to make students feel welcomed, supported, and heard from the very beginning.\u003c/p\u003e\u003cp\u003eAt Northwestern, being immersed in a new cultural environment has taught me the power of diversity of thought and perspective. It’s made me even more intentional about creating inclusive spaces where students feel safe to be themselves. I want to learn as much from my students as they learn from me—meeting them on common ground, listening actively, and collaborating to uncover new ideas together.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"20885579-6c3a-4209-afea-bbc8ec8dceef\"}":{"__typename":"DeepDives","uuid":"20885579-6c3a-4209-afea-bbc8ec8dceef","content":"\u003cp\u003eI have a deep passion for food. I grew up cooking, baking, and trying any recipe I could get my hands on. Some of my proudest moments have been finally cracking a faulty recipe or mastering a complex dish. For me, the kitchen is a place to destress and recharge. In high school, whenever I was stressed, I would come to school the next day with a myriad of baked goods to share with my friends. I still maintain that ritual at college, even tracking down a dorm with a good kitchen to bake cookies before finals. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"cfd7f19a-6985-4ec1-9660-908e5e5ead14\"}":{"__typename":"DeepDives","uuid":"cfd7f19a-6985-4ec1-9660-908e5e5ead14","content":"\u003cp\u003eIn high school, I spent my summers trying to figure out what I was passionate about and what I wanted to pursue at university. I participated in summer programs at at different universities exploring foreign policy, creative writing, and journalism. I made the most of each experience, aiming to get to the core of each area of study to see if it truly resonated with me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"993ef857-a9ee-42e8-8bd1-e344eb0f21d6\"}":{"__typename":"School","uuid":"993ef857-a9ee-42e8-8bd1-e344eb0f21d6","name":"Colegio Nueva Granada","city":"Bogotá","type":"HIGH","state":"Bogotá","country":"Colombia","zip":"110231"},"Education:{\"uuid\":\"7041b9c7-ee23-4cbc-a4b5-fe7d77180c82\"}":{"__typename":"Education","uuid":"7041b9c7-ee23-4cbc-a4b5-fe7d77180c82","school":{"__ref":"School:{\"uuid\":\"993ef857-a9ee-42e8-8bd1-e344eb0f21d6\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"59e501d9-b965-446b-bd4b-281e3cb07de2\"}":{"__typename":"Education","uuid":"59e501d9-b965-446b-bd4b-281e3cb07de2","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"656b3c42-65f3-4136-a5e6-efb6b1877f1a\"}":{"__typename":"MentorPublicProfile","uuid":"656b3c42-65f3-4136-a5e6-efb6b1877f1a","displayName":"Angelica P.","slug":"angelicad-pardo","biography":"\u003cp\u003eHi! My name is Angelica, and I’m a sophomore at Northwestern University, majoring in Mechanical Engineering and minoring in Creative Writing. I’ve always struggled with choices—my fascination with learning has left me with only one clear option: do both. Now, I strive to strike a balanced intersection between my analytical and creative minds. My disparate passions are hard to picture side by side—differential equations and fiction writing don’t often share a syllabus—but I’ve made it work.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m originally from Bogotá, Colombia, where I attended Colegio Nueva Granada. Here, I cemented myself as someone who wanted to be involved in everything. I was captain of the soccer team, lead singer of a rock band, a school ambassador, NHS secretary, and a tutor in a wide range of subjects including chemistry, calculus, SAT reading and writing, and English. In my free time I loved volunteering, particularly at the Fundación Hogar Nueva Granada, a local school for children from low income families. Throughout my years working with the school, I developed an English tutoring program to improve the student's English skills. There, I discovered my love for creating individualized lesson plans, building one-on-one connections, and finding creative ways to make learning fun and meaningful.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow at Northwestern, I’m constantly exploring the new and diverse community around me. I’ve become involved in numerous student organizations, attending Society of Hispanic Professional Engineers events, connecting with fellow songwriters in SWAN (the Songwriter’s Association at Northwestern), and recently being elected the Vice President of Engagement for the Northeast Area Council—working to cultivate and strengthen relationships among on-campus students to promote area affinity and a shared sense of identity. When I’m not working on engineering mechanics problem sets or tinkering with microcontrollers, I journal, putting ink to paper and transforming my thoughts into poems, narratives, and songs. In any case, all my academic and non-academic pursuits require headphones, a coffee, and a sweet treat—a ritual that has now transformed into a mission to explore every coffee shop in the Chicago area.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e​​As a mentor, I bring warmth, patience, and a belief that students thrive when they feel seen. I’m especially passionate about working with students who have varied interests or are still figuring out their path—believe me, I can relate. Whether I’m helping a student grasp a complex STEM concept or coaching them through an essay, I want to build their confidence and curiosity every step of the way. I believe that learning should be collaborative, flexible, and grounded in empathy—with plenty of room for questions, creativity, and fun.\u003c/p\u003e","teachingVideoPlaybackId":"02iq01DUIUSZyjhzCyOF1xg02PuShIlxVmBw8JBk9xh1XE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"88d5b07b-9dbc-481f-bfef-acba8486a1d5\"}"},{"__ref":"DeepDives:{\"uuid\":\"5d1a9ecc-a34b-4f4e-a72f-bf5516ecda14\"}"},{"__ref":"DeepDives:{\"uuid\":\"20885579-6c3a-4209-afea-bbc8ec8dceef\"}"},{"__ref":"DeepDives:{\"uuid\":\"cfd7f19a-6985-4ec1-9660-908e5e5ead14\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/980015e6-9a1b-4ce9-882b-6a1e381db913/-/preview/-/format/jpg/","https://ucarecdn.com/7638c7ce-ab10-4cb1-8f57-26cd08f2e2c0/-/preview/-/format/jpg/","https://ucarecdn.com/dedabc51-a617-42d8-a1a2-646eda6b07ba/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7041b9c7-ee23-4cbc-a4b5-fe7d77180c82\"}"},{"__ref":"Education:{\"uuid\":\"59e501d9-b965-446b-bd4b-281e3cb07de2\"}"}],"hiredAt":"2025-07-03T12:16:32.387Z","topics":["Precalculus / Trigonometry","Calculus","Algebra I","Algebra II","Pre-Algebra","Chemistry","Writing","Spanish","College Essay Writing","Reading","Creative Writing","Coding / Programming","STEM Project","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"angelicad-pardo\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"656b3c42-65f3-4136-a5e6-efb6b1877f1a\"}"}}},"_sentryTraceData":"66713941190647b39aeefd2a00f8ab45-895df7ece5be8949-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=66713941190647b39aeefd2a00f8ab45,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"angelicad-pardo"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
