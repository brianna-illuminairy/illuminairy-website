xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"66b12e41-a7c0-46c4-a5ce-e035cd75f4f0\"}":{"__typename":"DeepDives","uuid":"66b12e41-a7c0-46c4-a5ce-e035cd75f4f0","content":"\u003cp\u003eThere is no rush. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the competitive society that we live in, especially between that of students, multiple factors including 'adults' and the institution forces you to run. However, a lot of times the students are running without a direction. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOf course, as a strong believer of 'figuring it out as you go', the act of doing is very important. But, at your own pace. It does not have to be at the pace of other students nor driven by a motivation instigated by exterior forces. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eYou had no idea what you wanted to do even coming into Brown University but see how much has changed. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"5ce58bce-15f1-4831-b6a0-74861e0daabd\"}":{"__typename":"DeepDives","uuid":"5ce58bce-15f1-4831-b6a0-74861e0daabd","content":"\u003cp\u003eAs someone who has had the opportunity to experience a cultural range of education, my teaching style stems around a lesson plan and goal; however, leaves room for the student's desires or ideas. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy father has been teaching English in South Korea for over thirty years and he emphasizes the dual relationship between a teacher and a student. As a result, I hope to learn from the students that I mentor through spaces for conversations and imagination. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"12a9b0fa-758d-4f0b-ba5f-84d7f3bd6cf9\"}":{"__typename":"DeepDives","uuid":"12a9b0fa-758d-4f0b-ba5f-84d7f3bd6cf9","content":"\u003cp\u003eI was clueless. It felt like everyone around me had the perfect answer when asked about future aspirations and dreams while I just did not know. And to a certain extent the unknowing created insecurities about myself. I wouldn't say there was anything wrong with me. I got good grades, played sports and had a good number of friends. But, thinking back I just needed time to continue exploring and not limiting myself to rushed decisions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"abeab2e4-4d12-4d6a-8ec0-a547c2c37564\"}":{"__typename":"DeepDives","uuid":"abeab2e4-4d12-4d6a-8ec0-a547c2c37564","content":"\u003cp\u003eThe European Painting Tour. I spent five weeks after my service in the Korean Air Force traveling around different cities creating a project with local artists. The most memorable was Lisbon where I was able to live paint for four hours whilst a dozen street performers played music in front of hundreds of tourists. This shaped my practice in the art of gathering to incorporate different mediums of art to create an experience. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"790b475c-14f5-428b-a5d5-7bf203a87ea1\"}":{"__typename":"School","uuid":"790b475c-14f5-428b-a5d5-7bf203a87ea1","name":"Winchester College","city":"Winchester","type":"HIGH","state":"England","country":"United Kingdom","zip":"SO23 9NA"},"Education:{\"uuid\":\"d3d4dd23-654e-4ad0-b60b-398f07838b02\"}":{"__typename":"Education","uuid":"d3d4dd23-654e-4ad0-b60b-398f07838b02","school":{"__ref":"School:{\"uuid\":\"790b475c-14f5-428b-a5d5-7bf203a87ea1\"}"},"startYear":"2012","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"95d390ec-b19a-437f-a5dc-8ef9991f860a\"}":{"__typename":"Education","uuid":"95d390ec-b19a-437f-a5dc-8ef9991f860a","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2024","major":"Visual Arts ","degree":null},"MentorPublicProfile:{\"uuid\":\"1dfd8b2a-b6a7-4711-9676-dc0faecf4670\"}":{"__typename":"MentorPublicProfile","uuid":"1dfd8b2a-b6a7-4711-9676-dc0faecf4670","displayName":"Namoo S.","slug":"namoo-song","biography":"\u003cp\u003eHello! My name was Albert but is now Namoo. Let me elaborate.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was born and raised in South Korea until the age of ten then spent my teens in an English boarding school away from 'home'. Here is where my adventures as 'Albert' began. As one of the few international students, I experienced certain difficulties trying to fit in. As a result, throughout my teens, playing different sports was the main way in which I connected and created relationships with others. I graduated from high school in England, proceeded to take a year off working in South Korea and was admitted to Brown University. Without a clear sense of direction, I chose Philosophy as my concentration.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I continued to navigate the continuous realms of ambiguity as a college student, COVID-19 forced me off campus to return home. At that time, I was taking a Visual Arts course as a beginner for which I had to complete the assignments back home under quarantine. I made a small studio space and purchased materials. However, even after the semester had ended I continued to paint full of joy in having finally found an activity that I genuinely enjoyed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis was very special for me as I was that kid who simply shrugged his shoulders when asked about one’s dreams and the great future. I got good grades and was slightly above average in the sports I played but I lacked character. Character driven by passion. In light of the novice realization, I locked myself in my home studio and painted for over a month.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eJust before enlisting into the Korean Airforce to fulfill my duties of conscription, I created an art instagram account under the name ‘Namoo’. Although the highlighted collaborations and experiences take place after the military and within the final two years of my college life, I believe the foundation of my evolved identity was formed on base as a Drill Sergeant. I was responsible for teaching the military mindset to new recruits as well as organizing their everyday activities. In doing so, there were many moments where I stood up in front of thousands of recruits supporting my confidence on stage.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHeavily influenced by my experience in the Korean Airforce, my passion for painting spread into the art of gathering and the facilitation of community. The act of painting became a skill that I could use to gather different types of people and in extraordinary locations. With my belief that the most beautiful and necessary qualities for a fulfilling life lies within the act of collaboration, it is my life mission to continue creating spaces and stages for artistic expression and intimate connections.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"ryvGYLlLOgogMOt2QQb45bf8lvs7x5pvIS01i9800DEek","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am proud to have served for my country, South Korea, as a Drill Sergeant for two years. \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Visual Arts ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"66b12e41-a7c0-46c4-a5ce-e035cd75f4f0\"}"},{"__ref":"DeepDives:{\"uuid\":\"5ce58bce-15f1-4831-b6a0-74861e0daabd\"}"},{"__ref":"DeepDives:{\"uuid\":\"12a9b0fa-758d-4f0b-ba5f-84d7f3bd6cf9\"}"},{"__ref":"DeepDives:{\"uuid\":\"abeab2e4-4d12-4d6a-8ec0-a547c2c37564\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fbe523b7-c2c2-4706-a482-1621f229b7b1/-/preview/-/format/jpg/","https://ucarecdn.com/0cd636ad-5005-4d82-84bf-a84a8f348ce0/-/preview/-/format/jpg/","https://ucarecdn.com/4a1d3092-0595-44f3-b664-ef0102fe6ceb/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d3d4dd23-654e-4ad0-b60b-398f07838b02\"}"},{"__ref":"Education:{\"uuid\":\"95d390ec-b19a-437f-a5dc-8ef9991f860a\"}"}],"hiredAt":"2024-04-07T21:17:07.272Z","topics":["Negotiation","Business / Entrepreneurship","Video / Photography","Film / Theater","Philosophy","Korean","Writing","Creative Writing","Visual Arts / Graphic Design"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfil
