xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"827dd714-4f9d-4113-8ca2-0714f7699562\"}":{"__typename":"DeepDives","uuid":"827dd714-4f9d-4113-8ca2-0714f7699562","content":"\u003cp\u003eMy dream job changes all the time, but I definitely want to do something creative. Right now, I’d love to work on the business side of fashion, maybe in merchandising or buying.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ea0f4e0e-f555-4dd5-ae07-43e3d0314313\"}":{"__typename":"DeepDives","uuid":"ea0f4e0e-f555-4dd5-ae07-43e3d0314313","content":"\u003cp\u003eI would tell my high school self that it’s never too late to try something new. At every stage of life, we often convince ourselves that if we haven’t already done something, it’s too late—or that learning a new skill or improving at something unfamiliar is just too hard. Looking back, I wish I had stepped out of my comfort zone more and explored more areas that I wouldn’t normally gravitate toward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"25988679-5cd2-4f28-bc48-dd135ad6ec71\"}":{"__typename":"DeepDives","uuid":"25988679-5cd2-4f28-bc48-dd135ad6ec71","content":"\u003cp\u003eI am a very visual and hands-on learner, and I find that actually doing something myself, rather than just being told about it, helps me fully grasp concepts. I love incorporating visuals, practical examples, and interactive elements into the learning process to make concepts more engaging and easier to understand. I also struggled a lot with test anxiety throughout high school, which emphasized the importance of patience, encouragement, and creating a safe, supportive learning environment. I’m a strong believer that every student is capable of succeeding—it’s all about finding the methods and tools that work best for you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c2fb5a67-22c7-4c6c-bfd7-7e28b836e648\"}":{"__typename":"DeepDives","uuid":"c2fb5a67-22c7-4c6c-bfd7-7e28b836e648","content":"\u003cp\u003eI was a Curious Cardinals mentee from eighth grade until I graduated high school, and having my mentor, Audrey, was such a meaningful experience for me. Not only did she help me grow and excel academically, but she also became a friend and a huge support system—someone who always cheered me on and pushed me to be my best self. I also had an amazing mentor, Julia, who helped me find my confidence and grow my math skills, which I had always struggled with. Through these experiences, I realized how important it is to have someone close in age to look up to, get inspired by, and feel supported by. Having my mentors really shaped who I am today, and it’s why I’m so passionate about creating that same kind of meaningful experience for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}":{"__typename":"School","uuid":"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5","name":"The Chapin School","city":"New York","type":"HIGH","state":"NY","country":"USA","zip":"10028"},"Education:{\"uuid\":\"cd907d29-df72-4871-b779-1ecd1acd900f\"}":{"__typename":"Education","uuid":"cd907d29-df72-4871-b779-1ecd1acd900f","school":{"__ref":"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"fd902386-7feb-44bf-85d0-a6e226429865\"}":{"__typename":"Education","uuid":"fd902386-7feb-44bf-85d0-a6e226429865","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Feminist, Gender, and Sexuality Studies","degree":null},"Testimonial:39037dbc-6467-4272-a10b-26137342ee6c":{"__typename":"Testimonial","id":"39037dbc-6467-4272-a10b-26137342ee6c","text":"Elise was simply the best mentor! She kept my daughter engaged, she was motivating, and she pushed her to really explore her creative side. She learned so much in 3 months and looked forward to every session. Thank you!!","date":"2025-05-29 21:50:56.563+00","rating":5,"endorser":{"__typename":"Endorser","name":"kimberly goodwin","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"932d1704-4dee-4891-9594-6263a4828a4a\"}":{"__typename":"MentorPublicProfile","uuid":"932d1704-4dee-4891-9594-6263a4828a4a","displayName":"Elise L.","slug":"elise-larsson-1","biography":"\u003cp\u003eElise is currently a freshman at Cornell University, passionate about women’s rights, sociology, fashion, and business. She is originally from Sweden and lived there until she was six before moving to California, where she learned English as her second language. After living in the Bay Area for 4 years, she moved to New York City, where she attended and later graduated from The Chapin School. There, Elise was elected captain of the field hockey team, served as an admissions ambassador and tour guide for applicant families, and tutored middle schoolers weekly at the East Harlem School in Humanities, which inspired her love for working with youth. In 2023, Elise traveled to Nairobi, Kenya, to visit the Shining Hope for Communities (SHOFCO) schools, where she saw firsthand how education can empower young girls to become leaders and change-makers. Elise also spent a summer researching widow’s rights and microfinance products in Iraq, authoring a report with solutions to empower women both economically and socially to support the expansion of the Global Fund for Widows.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eElise was also one of Curious Cardinals’ first mentees, where she worked on her own passion project, which led to her blog, Maud. Through interviews with female founders in the fashion world, Elise explored the intersection of fashion and feminism, sharing the stories of women leaders and inspiring others to embrace their unique passions and aspirations in the world of fashion. Now at Cornell, Elise is a member of the Cornell Fashion Industry Network and Cornell Fashion Collective, where she is part of the marketing committee on the business operations team. When she’s not studying, Elise loves spending time with friends and family (including her mini Labradoodle, Hugo), being active outdoors, and trying new (gluten-free!) foods. Elise is excited to bring her creativity, empathy, and curiosity to her role as a mentor, helping students explore their passions and gain confidence, just as her own mentors inspired her to embrace her unique interests and turn them into something meaningful.\u003c/p\u003e","teachingVideoPlaybackId":"RbkaS6hHVmKKU00iDgY14SHawXkxKmG2nj28KjYd54xM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Feminist, Gender, and Sexuality Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"827dd714-4f9d-4113-8ca2-0714f7699562\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea0f4e0e-f555-4dd5-ae07-43e3d0314313\"}"},{"__ref":"DeepDives:{\"uuid\":\"25988679-5cd2-4f28-bc48-dd135ad6ec71\"}"},{"__ref":"DeepDives:{\"uuid\":\"c2fb5a67-22c7-4c6c-bfd7-7e28b836e648\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3e9eba9b-c448-4ea1-b8df-3b011bf5570e/-/preview/-/format/jpg/","https://ucarecdn.com/d9e5663d-a75d-43ba-a527-d8d16a8b2f8a/-/preview/-/format/jpg/","https://ucarecdn.com/74d73ff6-ebae-4b73-be76-b5739c0ae130/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cd907d29-df72-4871-b779-1ecd1acd900f\"}"},{"__ref":"Education:{\"uuid\":\"fd902386-7feb-44bf-85d0-a6e226429865\"}"}],"hiredAt":"2024-11-28T11:40:32.056Z","topics":["Fashion / Cosmetics","History Project","Academic Coaching"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:39037dbc-6467-4272-a10b-26137342ee6c"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elise-larsson-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"932d1704-4dee-4891-9594-6263a4828a4a\"}"}}},"_sentryTraceData":"3ac29eaa72d74d6e869301c6f6fb50f7-82ba7bdbb8114a67-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3ac29eaa72d74d6e869301c6f6fb50f7,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"pa
