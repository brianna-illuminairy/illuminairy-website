xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fb6c9bed-5c37-41fb-9186-d013b8434c1a\"}":{"__typename":"Favorites","uuid":"fb6c9bed-5c37-41fb-9186-d013b8434c1a","photoUrl":"https://ucarecdn.com/90a599be-9cd7-4871-8482-98c640843dc4/","title":"Novak Djokovic","type":"ATHLETE"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1a6da7e0-c584-468b-947d-568915076fec\"}":{"__typename":"DeepDives","uuid":"1a6da7e0-c584-468b-947d-568915076fec","content":"\u003cp\u003eI hope to write a book someday.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm not quite sure on what, exactly, but the process seems like a journey waiting to be fulfilled.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"67769083-21bb-42f7-9fcb-a033f788e07f\"}":{"__typename":"DeepDives","uuid":"67769083-21bb-42f7-9fcb-a033f788e07f","content":"\u003cp\u003eI love manufacturing/design and computer vision, so mechanical engineering + CS gave me the freedom to explore both.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a0f03acd-78e9-4707-8414-847c0c355b39\"}":{"__typename":"DeepDives","uuid":"a0f03acd-78e9-4707-8414-847c0c355b39","content":"\u003cp\u003ePer Ralph Waldo Emerson, “Whenever a mind is simple, and receives a divine wisdom, old things pass away—means, teachers, texts, temples fall; \u003cstrong\u003eit lives now, and absorbs past and future into the present hour.\u003c/strong\u003e All things are made sacred by relation to it—one as much as another.”\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBy staying in the present, I can directly impact my ambitions and goals -- that is what motivates me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3ce30122-038c-4214-b883-b55e6cb8ab4e\"}":{"__typename":"DeepDives","uuid":"3ce30122-038c-4214-b883-b55e6cb8ab4e","content":"\u003cp\u003eLearn to write \u003cstrong\u003ewell\u003c/strong\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn any position in life, you will likely have to communicate digitally. First impressions matter, and people will judge you based on how you write.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}":{"__typename":"School","uuid":"1855d7ef-1e93-4456-9092-47a74b3f8fb1","name":"New Trier Township High School - Winnetka","city":"Winnetka","type":"HIGH","state":"Illinois","country":"United States","zip":"60093"},"Education:{\"uuid\":\"e5bf40c4-5f3a-48f8-a842-7e23b5582194\"}":{"__typename":"Education","uuid":"e5bf40c4-5f3a-48f8-a842-7e23b5582194","school":{"__ref":"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"ea1e1604-c617-4bb6-82e6-17f69f34cfcc\"}":{"__typename":"Education","uuid":"ea1e1604-c617-4bb6-82e6-17f69f34cfcc","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"338f8922-6087-45fe-8ed9-fa86768d1756\"}":{"__typename":"MentorPublicProfile","uuid":"338f8922-6087-45fe-8ed9-fa86768d1756","displayName":"Edison S.","slug":"edison-sun","biography":"\u003cp\u003e\u003cbr\u003eHi, everybody!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m Edison, a rising sophomore at Northwestern University pursuing a major in Mechanical Engineering and a minor in Computer Science. I've always been fascinated by the intersection of engineering and human health, to the point that I've devoted my time at Northwestern so far to developing the computer vision and robotic skills necessary in healthcare robotics.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the lab, I'm developing a deep-learning–based pipeline for thoracic aorta diameter measurements for risk prediction in aortic aneurysms. Previously, I contributed to the development of robotic visible-light optical coherence tomography for glaucoma imaging, creating a speckle-pattern-based montaging algorithm that corrects for positioning errors and enhances the visualisation of aqueous humour outflow pathways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not in the lab, you'll find me on the tennis court or exploring new restaurants around Evanston and Chicago.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn terms of mentorship, I possess the
