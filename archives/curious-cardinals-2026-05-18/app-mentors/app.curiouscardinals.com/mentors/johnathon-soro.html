xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c95b3833-32c8-4f87-8001-0075fe4c89d0\"}":{"__typename":"Favorites","uuid":"c95b3833-32c8-4f87-8001-0075fe4c89d0","photoUrl":"https://ucarecdn.com/59e71152-c3fa-4ebd-8cdf-38576336eaca/","title":"folklore","type":"ALBUM"},"Favorites:{\"uuid\":\"eaf0b491-6e40-4abe-a558-cc7edfdb8a5f\"}":{"__typename":"Favorites","uuid":"eaf0b491-6e40-4abe-a558-cc7edfdb8a5f","photoUrl":"https://ucarecdn.com/59e71152-c3fa-4ebd-8cdf-38576336eaca/","title":"Lamar Jackson","type":"ATHLETE"},"Favorites:{\"uuid\":\"767f4207-8878-4513-a038-bc074906833e\"}":{"__typename":"Favorites","uuid":"767f4207-8878-4513-a038-bc074906833e","photoUrl":"https://ucarecdn.com/59e71152-c3fa-4ebd-8cdf-38576336eaca/","title":"Interstellar","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4401efd8-134a-4eb7-8241-e24bcb029d1f\"}":{"__typename":"DeepDives","uuid":"4401efd8-134a-4eb7-8241-e24bcb029d1f","content":"\u003cp\u003eIn my spare time, I like to find activities that I can do with my brothers, friends, and cousins. This usually means playing or watching sports together, playing video games or board games, watching movies, or listening to new music.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"91844f47-46d1-486f-94a7-221bc4dedb56\"}":{"__typename":"DeepDives","uuid":"91844f47-46d1-486f-94a7-221bc4dedb56","content":"\u003cp\u003eMy dream job is to be a Biology professor at a top research university where I will be able to advance cancer therapeutics research while teaching courses to train the next generation of scientists.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7f715ed5-92d8-47a2-97ef-d87cb79f6de4\"}":{"__typename":"DeepDives","uuid":"7f715ed5-92d8-47a2-97ef-d87cb79f6de4","content":"\u003cp\u003eI was always interested in Biology from a young age because my dad is blind. As I got to high school and started undergrad, I realized that I wanted to use biology research to make an impact on medicine and society, so I chose to do a  Biology major in undergrad and now am pursuing an Immunology PhD where I hope to research cancer immunotherapies.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e7b62a78-1ff7-4e36-a698-fcbeb6faa3de\"}":{"__typename":"DeepDives","uuid":"e7b62a78-1ff7-4e36-a698-fcbeb6faa3de","content":"\u003cp\u003eI would tell my middle or high school self to be more proactive about trying to gain new life and academic experiences. Undergrad was the first time I really stepped out of my comfort zone academically and pushed myself to learn and research new things, and it has allowed me to grow exponentially. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"b4683ba8-9b52-4556-bf26-f5ba9c20cf67\"}":{"__typename":"School","uuid":"b4683ba8-9b52-4556-bf26-f5ba9c20cf67","name":"Saint Augustine High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92104"},"Education:{\"uuid\":\"6776a612-c477-4843-acf9-18d671ea57b0\"}":{"__typename":"Education","uuid":"6776a612-c477-4843-acf9-18d671ea57b0","school":{"__ref":"School:{\"uuid\":\"b4683ba8-9b52-4556-bf26-f5ba9c20cf67\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}":{"__typename":"School","uuid":"11470c0e-6098-4972-92d0-60616358bd13","name":"California Institute of Technology","city":"Pasadena","type":"COLLEGE","state":"California","country":"United States","zip":"91125"},"Education:{\"uuid\":\"7b7acd7e-2446-4776-8fa3-2130e5b3af47\"}":{"__typename":"Education","uuid":"7b7acd7e-2446-4776-8fa3-2130e5b3af47","school":{"__ref":"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"aec7476d-8f2b-4d8e-9b60-104a8bcd95c8\"}":{"__typename":"MentorPublicProfile","uuid":"aec7476d-8f2b-4d8e-9b60-104a8bcd95c8","displayName":"Johnathon S.","slug":"johnathon-soro","biography":"\u003cp\u003eI was always interested in math and science growing up. I have two younger brothers, and spent a lot of time in middle and high school tutoring them informally. In more formal settings, I have been a tutor for various STEM subjects for the past 7 years. I primarily tutored math courses, but also have experience tutoring different high school science classes. For reference, in high school I took AP Calculus BC, AP Physics C, AP Chemistry, and AP Biology. However, my tutoring extended beyond just helping students with coursework. My parents are Middle Eastern immigrants and I am a first-generation college student, so much of the time spent tutoring has been about building connects with my students and helping prepare them to find their path to college, the same way I had to connect with mentors to help find my path to college.\u003c/p\u003e\u003cp\u003eMy family has a history of genetic illnesses and cancer, so from a young age I was always especially interested in Biology, making Biology an obvious choice for my major at Caltech. While there, I tutored students primarily in biology and math courses. I also gained significant experience programming in my coursework and in my biology research. Moreover, I had a chance to do an internship working on cancer therapies at Kite Pharma, giving me insight into the world of biotech and pharmaceuticals. Now, I am a PhD student in the Immunology program at Stanford School of Medicine. Here, I am interested in studying cancer, more specifically engineering more effective ways of targeting cancer using the immune system.\u003c/p\u003e\u003cp\u003eMy interests and experiences in undergraduate and graduate school have positioned to be a great career mentor for anyone pursuing a degree in math and/or science research, engineering, and/or medicine. I am especially passionate about mentoring those interested in pursuing Biology or scientific research in general.\u003c/p\u003e\u003cp\u003eMy personal interests include playing and watching sports and video games, and listening to music. I spend most of my time enjoying these hobbies with family or the friends that I have made in undergrad or graduate school.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c95b3833-32c8-4f87-8001-0075fe4c89d0\"}"},{"__ref":"Favorites:{\"uuid\":\"eaf0b491-6e40-4abe-a558-cc7edfdb8a5f\"}"},{"__ref":"Favorites:{\"uuid\":\"767f4207-8878-4513-a038-bc074906833e\"}"}],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4401efd8-134a-4eb7-8241-e24bcb029d1f\"}"},{"__ref
