xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ab94356c-8842-4377-a36d-ac921678c04d\"}":{"__typename":"DeepDives","uuid":"ab94356c-8842-4377-a36d-ac921678c04d","content":"\u003cp\u003eI would tell my high school self that you don’t need to follow the same path as everyone else to make an impact. Focus on what you love and are passionate about—that’s what will drive you to keep going and truly make a difference. Explore your passions, seek out opportunities, and remember, there are always people ready to help along the way!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"504f9f96-666f-4c8b-bb6d-488a9e9f7242\"}":{"__typename":"DeepDives","uuid":"504f9f96-666f-4c8b-bb6d-488a9e9f7242","content":"\u003cp\u003eMentorship matters to me because I know firsthand the incredible impact a good mentor can have. As an immigrant to the U.S., I was fortunate to have passionate teachers who went above and beyond to support me when I reached out. I wouldn't be where I am today without the mentors who guided me, and I want to pay that forward by making a difference in someone else’s life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8d9e2230-2515-4f0a-b214-d58e2e7c8658\"}":{"__typename":"DeepDives","uuid":"8d9e2230-2515-4f0a-b214-d58e2e7c8658","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is either starting my own business or creating a fund to support startups. Two \u003cem\u003every\u003c/em\u003e ambitious goals, but as the saying goes: \"Shoot for the moon, even if you miss, you'll land among the stars!\"\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"855e159a-f72f-422b-a54d-06f01f50815f\"}":{"__typename":"DeepDives","uuid":"855e159a-f72f-422b-a54d-06f01f50815f","content":"\u003cp\u003eDuring the summer after my junior year of high school, I spent countless hours on Zoom with my friends building a website called Curriculelge.com. We wanted to help students with the college application process after many of our teachers and counselors were laid off in our school district. It was our way of stepping up and giving back to the community in a time of need.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"02dbcf62-7098-496d-b068-e274931ecb35\"}":{"__typename":"School","uuid":"02dbcf62-7098-496d-b068-e274931ecb35","name":"Olympian High School","city":"Chula Vista","type":"HIGH","state":"California","country":"United States","zip":"91913"},"Education:{\"uuid\":\"836f4442-507c-4095-8e34-a2efaef1aa53\"}":{"__typename":"Education","uuid":"836f4442-507c-4095-8e34-a2efaef1aa53","school":{"__ref":"School:{\"uuid\":\"02dbcf62-7098-496d-b068-e274931ecb35\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"0c988266-ccd4-49ca-a277-ffad262b6817\"}":{"__typename":"Education","uuid":"0c988266-ccd4-49ca-a277-ffad262b6817","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"79faebeb-4d11-4e68-9b31-56fecdf23538\"}":{"__typename":"MentorPublicProfile","uuid":"79faebeb-4d11-4e68-9b31-56fecdf23538","displayName":"Jin Woo  P.","slug":"james-park","biography":"\u003cp\u003eHi! I’m Jin, a junior at Yale majoring in Economics because I’m fascinated by how value is created and what drives innovation in our world. That curiosity led me to intern in Venture Capital, where I had the incredible opportunity to work with super passionate people with ideas that could change the world. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up in Mexico, I was lucky to be surrounded by diverse cultures and perspectives, which shaped how I see the world. Since I was young, I’ve been deeply involved in my community, whether it was volunteering as an afterschool tutor or teaching at a weekend Korean school. One of my proudest achievements was receiving The President’s Volunteer Service Award for my dedication to community service! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen it comes to activities, I've always been all in. I’ve been doing robotics since elementary school and even made it to the world championships! In high school, I served as Government Affairs and Policy Director for the California Association of Student Councils, where I collaborated with legislators to improve school policies. At Yale, I’ve been involved in the Mexican Baile Folklorico dance group and Taekwondo, where my team took home first place at the Princeton tournament! I’m also a Research Assistant at the Yale School of Management, where I get to dive into data and explore exciting research topics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, you can find me painting, filming videos, trying out new restaurants with friends, or building aquariums (it’s my latest obsession!). One day, I plan to channel all this energy and passion into launching my own startup!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m beyond excited to join Curious Cardinals as a tutor because I know firsthand how transformative learning can be when it’s guided by passion and curiosity. I can’t wait to work with students and help them discover their own passions—whether it’s through creative projects, hands-on activities, or diving deep into subjects they’re excited about. I’m all about making learning fun, personalized, and impactful, and I’m thrilled to help my students find the spark that will drive them forward.\u003c/p\u003e","teachingVideoPlaybackId":"ZrfJaytPrdF00ih9CfXNMtsw1Olnu6X2TTLHLypB2QhE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ab94356c-8842-4377-a36d-ac921678c04d\"}"},{"__ref":"DeepDives:{\"uuid\":\"504f9f96-666f-4c8b-bb6d-488a9e9f7242\"}"},{"__ref":"DeepDives:{\"uuid\":\"8d9e2230-2515-4f0a-b214-d58e2e7c8658\"}"},{"__ref":"DeepDives:{\"uuid\":\"855e159a-f72f-422b-a54d-06f01f50815f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a83bb817-9b22-4efa-b1ba-0621e06d4929/-/preview/-/format/jpg/","https://ucarecdn.com/2c9a28b9-1ad0-47d3-a15b-8fa991b0671b/-/preview/-/format/jpg/","https://ucarecdn.com/640cf428-4aa1-4801-951f-a6e6bd8b375e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"u
