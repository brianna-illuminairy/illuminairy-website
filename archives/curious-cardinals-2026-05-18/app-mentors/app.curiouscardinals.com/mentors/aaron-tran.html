xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"482bc313-ecad-4737-b55a-e3ebaa008fc5\"}":{"__typename":"Favorites","uuid":"482bc313-ecad-4737-b55a-e3ebaa008fc5","photoUrl":"https://ucarecdn.com/62dbefe3-69b1-4d99-86df-69e879d9447f/","title":"The Weeknd","type":"ARTIST"},"Favorites:{\"uuid\":\"f7dac228-b659-4294-90a0-38ae6e25c2d5\"}":{"__typename":"Favorites","uuid":"f7dac228-b659-4294-90a0-38ae6e25c2d5","photoUrl":"https://ucarecdn.com/62dbefe3-69b1-4d99-86df-69e879d9447f/","title":"Kobe Bryant","type":"ATHLETE"},"Favorites:{\"uuid\":\"778aa9d9-7c0e-48d7-bf82-d4af5347beef\"}":{"__typename":"Favorites","uuid":"778aa9d9-7c0e-48d7-bf82-d4af5347beef","photoUrl":"https://ucarecdn.com/62dbefe3-69b1-4d99-86df-69e879d9447f/","title":"The Shawshank Redemption","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f6bfabff-9071-4c46-adae-91879917c708\"}":{"__typename":"DeepDives","uuid":"f6bfabff-9071-4c46-adae-91879917c708","content":"\u003cp\u003eI would tell my middle school self to maintain an open mind and stay curious when learning new topics. That way, you can find out which subjects you truly enjoy and continue to nurture that interest throughout high school and college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"4d2f7668-c4ff-493d-988d-9cef9fab6dd2\"}":{"__typename":"DeepDives","uuid":"4d2f7668-c4ff-493d-988d-9cef9fab6dd2","content":"\u003cp\u003eI was very studious in high school but made sure to make time for my other extracurricular interests. I played for the basketball and volleyball teams, and I also spent time playing video games with my friends. I was pretty reserved during school and tended to hang around my close group of friends most of the time. I also formed some really close relationships with a lot of my teachers.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"74c2d7a6-6b70-4e2f-a808-f2851d726069\"}":{"__typename":"DeepDives","uuid":"74c2d7a6-6b70-4e2f-a808-f2851d726069","content":"\u003cp\u003eOne of my role models is Kobe Bryant. I always admired his work ethic and the level of intensity with which he played basketball. I try to emulate the \"mamba mentality\" in everything I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4ef87d99-8418-4e37-bb32-dcb2a0711b81\"}":{"__typename":"DeepDives","uuid":"4ef87d99-8418-4e37-bb32-dcb2a0711b81","content":"\u003cp\u003eBiology was the first science class I took in high school, and it is what really drew me towards the medical field. I found the quest to discover how life works to be really intriguing and I hope to continue studying that in college. I chose the Computational track because I took computer science classes for three years and I really enjoyed it. I thought that a Computational Biology major would provide an intersection between two subjects that I am interested in.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"9622dd81-5797-4a88-ba43-46fca6829905\"}":{"__typename":"School","uuid":"9622dd81-5797-4a88-ba43-46fca6829905","name":"Sobrato High School","city":"Morgan Hill","type":"HIGH","state":"California","country":"United States","zip":"95037"},"Education:{\"uuid\":\"63c14f06-f92a-4e5c-8fca-f4cc4e404dcd\"}":{"__typename":"Education","uuid":"63c14f06-f92a-4e5c-8fca-f4cc4e404dcd","school":{"__ref":"School:{\"uuid\":\"9622dd81-5797-4a88-ba43-46fca6829905\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"1485c828-7671-4722-b942-f2c97c3818ef\"}":{"__typename":"Education","uuid":"1485c828-7671-4722-b942-f2c97c3818ef","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computational Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"2a5946dd-3d96-4092-b3d9-33955701bf3d\"}":{"__typename":"MentorPublicProfile","uuid":"2a5946dd-3d96-4092-b3d9-33955701bf3d","displayName":"Aaron T.","slug":"aaron-tran","biography":"\u003cp\u003e\u003cbr\u003e\u003cstrong\u003e\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAaron is a premed student at Stanford University majoring in Computational Biology. He is a firm believer in educational equity and his passion for teaching started in high school, where he consistently tutored his classmates in subjects like calculus, physics, chemistry, and biology. During the pandemic, Aaron was alarmed by the number of people in his community who were falling behind in their classes, so he developed and led two free online learning platforms, Aaron’s AP Prep and Engage STEM, to help improve standardized testing outcomes and foster intellectual curiosity among underserved students. Over the last two years, the AP Prep’s weekly Q\u0026amp;A review sessions have served more than 13,000 students, and Engage STEM has provided enrichment courses for more than 1,000 middle schoolers.\u0026nbsp;He is an Ignite Fellow for Teach for America, where he hopes to leverage research-based best practices for high-impact tutoring of younger students.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, Aaron has also made contributions as an intern and researcher for prestigious programs through MIT, Stanford University, and more. Currently, he is doing research at the Stanford School of Medicine analyzing the effects of the TET1 gene on aging. He is a part of the Summer Science Program (SSP)’s mentorship program in which he helps guide high school seniors through the college application process and essay writing.\u0026nbsp;As a Curious Cardinal mentor, Aaron hopes to share his love for math and sciences with younger students and to create a fun, engaging learning environment for everybody.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"482bc313-ecad-4737-b55a-e3ebaa008fc5\"}"},{"__ref":"Favorites:{\"uuid\":\"f7dac228-b659-4294-90a0-38ae6e25c2d5\"}"},{"__ref":"Favorites:{\"uuid\":\"778aa9d9-7c0e-48d7-bf82-d4af5347beef\"}"}],"causesSupported":[],"major":"Computational Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f6bfabff-9071-4c46-adae-91879917c708\"}"},{"__ref":"DeepDives:{\"uuid\":\"4d2f7668-c4ff-493d-988d-9cef9fab6dd2\"}"},{"__ref":"DeepDives:{\"uuid\":\"74c2d7a6-6b70-4e2f-a808-f2851d726069\"}"},{"__ref":"DeepDives
