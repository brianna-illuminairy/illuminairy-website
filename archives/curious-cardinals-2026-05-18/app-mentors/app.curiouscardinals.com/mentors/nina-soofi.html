xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f426acdd-3fe0-4830-bb4c-2d3d710be028\"}":{"__typename":"Favorites","uuid":"f426acdd-3fe0-4830-bb4c-2d3d710be028","photoUrl":"https://ucarecdn.com/cffc8d79-6646-4800-8290-a572a39ec144/","title":"San Diego, CA","type":"CITY"},"Favorites:{\"uuid\":\"da4bcb25-bf69-4b24-a3f3-fd5ac1ca0d57\"}":{"__typename":"Favorites","uuid":"da4bcb25-bf69-4b24-a3f3-fd5ac1ca0d57","photoUrl":"https://ucarecdn.com/9b499d00-6b96-47f0-a864-afa1862595a7/","title":"Normal People","type":"BOOK"},"Favorites:{\"uuid\":\"4bbbc1ae-0bad-481c-b503-ba7c37ba0189\"}":{"__typename":"Favorites","uuid":"4bbbc1ae-0bad-481c-b503-ba7c37ba0189","photoUrl":"https://ucarecdn.com/433d07b2-b9dc-49aa-82c3-b80441449729/","title":"Lana Del Rey","type":"ARTIST"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"20a8b487-0a5e-4e90-b3d1-5613876f875d\"}":{"__typename":"DeepDives","uuid":"20a8b487-0a5e-4e90-b3d1-5613876f875d","content":"\u003cp\u003eThe advice I would give to my middle or high school self is to not be afraid to explore your interests and get involved in as many unique opportunities as you can, whether it comes to clubs, passion projects, volunteer opportunities, etc.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1302c353-6e71-4fac-b039-c03e73ab2c36\"}":{"__typename":"DeepDives","uuid":"1302c353-6e71-4fac-b039-c03e73ab2c36","content":"\u003cp\u003eMentorship matters to me because it’s about building meaningful connections and growing together! Throughout college, I’ve been lucky to have mentors who guided and encouraged me, and I know firsthand how impactful that support can be. As a student mentor myself, I love helping students gain confidence, navigate through challenges, and discover their passions—whether in STEM, career paths, or personal growth. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"16e52104-b3ba-42d6-ac38-a75e43fa68eb\"}":{"__typename":"DeepDives","uuid":"16e52104-b3ba-42d6-ac38-a75e43fa68eb","content":"\u003cp\u003eIn my spare time, I love to explore my creative and artistic side and create art. Since I was little, I've always loved to draw. In my senior year, I was lucky enough to take a painting and illustration studio course, which was a super cool experience!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ced444e8-92f5-4404-be90-2de3a1cdf80e\"}":{"__typename":"DeepDives","uuid":"ced444e8-92f5-4404-be90-2de3a1cdf80e","content":"\u003cp\u003eIn my lifetime, I hope to visit at least one country on every continent and all 50 US states!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"8d26ad1d-71eb-47b5-8a82-12eff2ce24a6\"}":{"__typename":"School","uuid":"8d26ad1d-71eb-47b5-8a82-12eff2ce24a6","name":"Lyons Township High School North Campus","city":"La Grange","type":"HIGH","state":"Illinois","country":"United States","zip":"60525"},"Education:{\"uuid\":\"0bb16607-ec07-4115-9eaf-74e5a4e6840c\"}":{"__typename":"Education","uuid":"0bb16607-ec07-4115-9eaf-74e5a4e6840c","school":{"__ref":"School:{\"uuid\":\"8d26ad1d-71eb-47b5-8a82-12eff2ce24a6\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"f9bcd389-9161-4a14-878a-7118f5891901\"}":{"__typename":"School","uuid":"f9bcd389-9161-4a14-878a-7118f5891901","name":"University of Illinois Urbana-Champaign","city":"Champaign","type":"COLLEGE","state":"Illinois","country":"United States","zip":"61820"},"Education:{\"uuid\":\"14a14684-5ed7-486a-9255-fde0a5d653f8\"}":{"__typename":"Education","uuid":"14a14684-5ed7-486a-9255-fde0a5d653f8","school":{"__ref":"School:{\"uuid\":\"f9bcd389-9161-4a14-878a-7118f5891901\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Bioengineering","degree":null},"MentorPublicProfile:{\"uuid\":\"2c921bbb-e937-447c-b7a5-9dd4589f2a5d\"}":{"__typename":"MentorPublicProfile","uuid":"2c921bbb-e937-447c-b7a5-9dd4589f2a5d","displayName":"Nina S.","slug":"nina-soofi","biography":"\u003cbr\u003e\u003chr\u003e\u003cp\u003eHi! I'm Nina, and I’m so excited to be part of the Curious Cardinals mentor team!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m a senior at the University of Illinois Urbana-Champaign, majoring in Bioengineering with a minor in Art \u0026amp; Design. I've always loved science and problem-solving, which led me to bioengineering—I wanted to be part of innovations that improve healthcare and make a real difference in people’s lives. Outside of school, I love to draw and paint and have been making art since I was a kid. I also love to cook, read, work, travel, and spend time with my friends and family. I'm a huge cat lover and have two cats named Leo and Jillie!!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring college, I’ve had the chance to work on exciting research and industry projects in biomedical engineering. This past summer, I interned at Thermo Fisher Scientific in Carlsbad, CA, where I worked in an antibody manufacturing lab—a truly incredible experience that gave me firsthand insight into how science translates into life-saving products. On campus, I love being involved in organizations that support and uplift others, especially the Society of Women Engineers (SWE), where I serve as a committee chair and help plan engaging events for our 400+ members.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the most fulfilling parts of my college journey has been mentorship and teaching. I’ve worked as a course and learning assistant for engineering and physiology courses, helping students navigate through challenging coursework. I also mentor K-5 students as an Outreach Assistant at my university’s Cancer Center, where I get to make STEM fun and interactive for young learners.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI joined Curious Cardinals because I believe mentorship is about so much more than just learning—it’s about building connections, growing together, and inspiring each other to reach our full potential. I love making learning engaging, rewarding, and personalized for each of my mentees. My goal is to help students not only understand new concepts but also gain confidence in their abilities and enjoy the journey.\u003c/p\u003e\u003cp\u003eI can’t wait to meet you and support you in achieving your goals!\u003c/p\u003e","teachingVideoPlaybackId":"ra8A9021534skjAa3jUBwdgWBggeFrLcY3EbNxjoPFZ8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f426acdd-3fe0-4830-bb4c-2d3d710be028\"}"},{"__ref":"Favorites:{\"uuid\":\"da4bcb25-bf69-4b24-a3f3-fd5ac1ca0d57\"}"},{"__ref":"Favorites:{\"uuid\":\"4bbbc1ae-0bad-481c-b503-ba7c37ba0189\"}"}],"causesSupported":[]
