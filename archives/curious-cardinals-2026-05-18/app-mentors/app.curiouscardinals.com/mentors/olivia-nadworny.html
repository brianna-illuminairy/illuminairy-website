xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"fdec1631-9f8b-43ff-95e3-6746e1d31d29\"}":{"__typename":"DeepDives","uuid":"fdec1631-9f8b-43ff-95e3-6746e1d31d29","content":"\u003cp\u003eI would tell my high school self to pursue creativity and not to be scared of looking silly. Early on in high school, I convinced myself that creativity was not one of my strengths and instead focused solely on academics, despite having been a lover of art and music for most of my childhood. I was so scared of being bad at something that I did not allow myself to even try any creative endeavors. Once I got to college, I rediscovered my love for art and creativity and am now pursuing a career in design. I wish I had allowed myself to connect with this side of myself earlier on rather than imposing unnecessary limitations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"cd24bcac-ecd3-4c4d-9f7a-62c9674b25fc\"}":{"__typename":"School","uuid":"cd24bcac-ecd3-4c4d-9f7a-62c9674b25fc","name":"Burlington High School","city":"Burlington","type":"HIGH","state":"Vermont","country":"United States","zip":"05408"},"Education:{\"uuid\":\"3eeb7c09-9ec8-4814-90e8-15177a7d25fa\"}":{"__typename":"Education","uuid":"3eeb7c09-9ec8-4814-90e8-15177a7d25fa","school":{"__ref":"School:{\"uuid\":\"cd24bcac-ecd3-4c4d-9f7a-62c9674b25fc\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"684f8e6d-c360-4417-b481-39c085c3eb26\"}":{"__typename":"Education","uuid":"684f8e6d-c360-4417-b481-39c085c3eb26","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Cognitive Science and Human Centered Design","degree":"B.A."},"MentorPublicProfile:{\"uuid\":\"f5dc0c90-69cc-46d6-9a60-1668aa10f561\"}":{"__typename":"MentorPublicProfile","uuid":"f5dc0c90-69cc-46d6-9a60-1668aa10f561","displayName":"Olivia N.","slug":"olivia-nadworny","biography":"\u003cp\u003eOlivia is a recent graduate of Dartmouth College, studying Cognitive Science and Human Centered Design. Olivia's biggest passions are design thinking, sustainability, art, and running. At Dartmouth, she was ann active member of the design community, working as a Teaching Assistant for both the Intro to Design Thinking and Intro to UX/UI courses for three years, mentoring young designers, helping to build a new design program at the college, and working as a UX Designer at the Dartmouth Digital Applied Learning and Innovation Lab. She also took numerous classes in printmaking and sculpture, where she discovered her love of welding. In her free time, Olivia had a weekly radio show where she discussed everything from music to wellness trends to the psychology of dreams. She also loves running and has run five half marathons. She uses her passionate for design thinking, problem solving, and human connection whenever she can, and has experience working for organizations such as the Swedish government and JP Morgan Chase. She is also fluent in Swedish and is skilled in tools such as Adobe Photoshop and Figma. She believes in hands-on, experiential learning, and in building creative confidence.\u003c/p\u003e
