xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"eafd7aa3-7627-436b-815e-64c113d954f6\"}":{"__typename":"Favorites","uuid":"eafd7aa3-7627-436b-815e-64c113d954f6","photoUrl":"https://ucarecdn.com/c49d67a4-2889-4620-b07d-4df7defe92c5/","title":"Nathan Fillion","type":"ACTOR"},"Favorites:{\"uuid\":\"ce141e46-941f-404c-8d75-508c02b4e5ae\"}":{"__typename":"Favorites","uuid":"ce141e46-941f-404c-8d75-508c02b4e5ae","photoUrl":"https://ucarecdn.com/f09da889-b16f-4e2b-993f-cedbfe68cd94/","title":"Good Material by Dolly Alderton","type":"BOOK"},"Favorites:{\"uuid\":\"0d142279-319f-40e7-8acc-68139ec7e959\"}":{"__typename":"Favorites","uuid":"0d142279-319f-40e7-8acc-68139ec7e959","photoUrl":"https://ucarecdn.com/50591a92-71f6-4156-aeaa-0c02a88111b9/","title":"Minecraft","type":"GAME"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0b8f2d57-c8e2-47fe-b548-74e9d6af73d9\"}":{"__typename":"DeepDives","uuid":"0b8f2d57-c8e2-47fe-b548-74e9d6af73d9","content":"\u003cp\u003eIn my spare time, you can find me baking/cooking, sewing, reading, or coding!\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eThis summer, I will be living fully by myself without friends or family nearby and thus I will have to cook for myself! (I've been on a meal plan at college.) In anticipation, I am creating a sort of cookbook of recipes that I have already tested (to make sure I like the food of course) and know that it won't take too much effort or time (as I'd probably be tired from the day's work).\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI started sewing as a covid hobby my freshman year of high school. I continued it all throughout high school, learning how to draft my own patterns and buying a mannequin. I eventually made my own prom dress with thrifted bedsheets. Now, at college, it's harder to have time and space to sew, but I still love the process of ideation.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI'm currently reading \u003cem\u003eThe Premonition\u003c/em\u003e by Banana Yoshimoto translated from Japanese. In 2022, I read 55 books in a year. I haven't been able to repeat that, but this year, I'm aiming to read 50 books. 2 down 48 to go!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"3c525679-54f1-42a0-b3d0-88e0c87e2359\"}":{"__typename":"DeepDives","uuid":"3c525679-54f1-42a0-b3d0-88e0c87e2359","content":"\u003cp\u003eMy dream job is to work at Disney World in Florida. Though I'm no longer in their typical age group, I still view it as a land of wonder through my childhood lens. I grew up in the Orlando area, going to Disney every year. Still not sure what my job title would be, but I'm currently aiming to work on metallurgy. I might get to work on designing new rides!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5de071dc-3871-43a6-9880-5ee03ddc9392\"}":{"__typename":"DeepDives","uuid":"5de071dc-3871-43a6-9880-5ee03ddc9392","content":"\u003cp\u003eI care so much about mentorship because of the people who showed up for me when I was starting out. I’ve seen firsthand how one person can change your entire trajectory.\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFinding my place in robotics:\u003c/strong\u003e In high school, I was terrified to join the robotics club because I didn't know a soul. When I finally walked in, the club president was a girl in a room full of guys. She was so incredibly welcoming and made sure I actually understood the CAD lessons instead of getting left behind. I credit her as the reason I stayed—and why I ended up becoming president of that same club my senior year!\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNavigating college life:\u003c/strong\u003e When I got to Northwestern, my \"big\" in the Chinese Students’ Association became my lifeline. Whether I was dealing with friendship drama or struggling with work-life balance, she had been through it all.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOpening doors:\u003c/strong\u003e If she didn't have the answer to a specific engineering question, she connected me with the friends who could help. In fact, one of those connections is exactly how I ended up here!\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eIt’s a bit of a cliché, but it’s true: without these mentors, I never would have realized everything I’m capable of. I want to be that person for you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c3d391e3-e894-499a-af7d-cadc3a0db0cf\"}":{"__typename":"DeepDives","uuid":"c3d391e3-e894-499a-af7d-cadc3a0db0cf","content":"\u003cp\u003eMy summers have been a mix of exploration, hard work, and figuring out what I \u003cem\u003edon't\u003c/em\u003e want to do—which is just as important as finding what you love!\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eThe \"Process of Elimination\" Summer:\u003c/strong\u003e Between freshman and sophomore year, I went to a medical summer program (NYLF Medicine). It was a cool experience and I met great people, but it actually taught me that medicine \u003cem\u003ewasn’t\u003c/em\u003e the right path for me.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eThe Farm Life:\u003c/strong\u003e To knock out my volunteer hours, I spent a summer working on a local farm. It was tough work—pulling weeds and hauling mulch—but the payoff was getting to eat fresh fruits and veggies every single day!\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNarrowing Down STEM:\u003c/strong\u003e By junior year, I focused on YYGS (Yale Young Global Scholars) and BELL Sierra Nevada. These programs were my turning point. They showed me what was actually possible in STEM and gave me my first taste of college freedom on a campus.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eThe Best of Both Worlds:\u003c/strong\u003e After senior year, I balanced two totally different jobs—working as a swim instructor and doing a civil engineering internship at a local DPW. Between shifts, I used my car to head to the beach with friends, soaking up that last bit of high school freedom.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eEvery one of these experiences shaped the path I’m on now at Northwestern. I’m a big believer that every internship, job, or program is a chance to learn something new about yourself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"ec1277a5-eaa8-420b-b207-ebbd40f60e0a\"}":{"__typename":"School","uuid":"ec1277a5-eaa8-420b-b207-ebbd40f60e0a","name":"Wayland High School","city":"Wayland","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01778"},"Education:{\"uuid\":\"3e3856c3-abda-4b9f-bfa5-5c22d9a8fcdb\"}":{"__typename":"Education","uuid":"3e3856c3-abda-4b9f-bfa5-5c22d9a8fcdb","school":{"__ref":"School:{\"uuid\":\"ec1277a5-eaa8-420b-b207-ebbd40f60e0a\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"9dff1fcf-3951-4f79-95c5-06aa06da29e2\"}":{"__typename":"Education","uuid":"9dff1fcf-3951-4f79-95c5-06aa06da29e2","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Materials Science and Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"06a0c382-5dca-44b3-9ae7-d947c82a3349\"}":{"__typename":"MentorPublicProfile","uuid":"06a0c382-5dca-44b3-9ae7-d947c82a3349","displayName":"Charmaine G.","slug":"charmaine-guo-1","biography":"\u003cp\u003eHi! I’m Charmaine, a sophomore studying Materials Science and Engineering at Northwestern, and I’m so excited to help you dive into the world of materials and tech!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI actually hadn’t even heard of materials science until my junior year of high school, but now I’m obsessed with how it connects every part of STEM. I love that this field can be incredibly broad but also so niche that everyone is constantly learning from one another. Since starting at Northwestern, I’ve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearched structural color:\u003c/strong\u003e I joined a polymer lab my freshman year to study structural color (similar to how butterfly wings work), which ended with me presenting a poster at our undergraduate research expo.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuilt an electric race car:\u003c/strong\u003e I’m part of our Formula SAE team where I worked on the low-voltage system. I actually manufactured the wire harness that makes the whole car run!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCombined code with creativity:\u003c/strong\u003e I’ve been coding since middle school (starting with HTML and CSS) and have used C++ and Python to build things like an LED audio visualizer and a personal website.\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI love mentoring students who are curious about:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCreative Electronics \u0026amp; PCB Design:\u003c/strong\u003e Going beyond breadboards to design your own printed circuit boards. We can dive into C++, messaging protocols, or system design for your own tech gadgets.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTurning \"What If\" into \"How To\":\u003c/strong\u003e Taking a big, broad idea—whether it's an app, a physical product, or a research question—and figuring out the engineering path to make it a reality.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eThe \"Why\" behind stuff:\u003c/strong\u003e Understanding how experimenting with existing properties leads to designing something brand new for a specific use case.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI’ve been teaching since my freshman year of high school. I started out mentoring a 3rd grader in math and literacy (we even wrote a newspaper about her cat!) and later became a swim instructor. Teaching swimming was a challenge because I’ve done it since I could walk, so it forced me to learn how to break down \"obvious\" skills and adapt my style to exactly how a student learns.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might involve:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eConnecting the dots:\u003c/strong\u003e Finding a way to apply engineering or tech to a field you’re already passionate about.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBreaking down the \"scary\" stuff:\u003c/strong\u003e If you feel like you’re drowning in a heavy workload, we’ll tackle it together step-by-step.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eProject Milestones:\u003c/strong\u003e Mapping out a plan so your creative project moves from a sketch to a finished portfolio piece.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eOutside of the lab\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eWhen I’m not working on the car or coding, you can usually find me taking a walk outside to reset. I’m really into creative projects like sewing and making patchwork designs. And honestly, I live for the drama—I’m a huge fan of \u003cem\u003eThe Rookie\u003c/em\u003e and \u003cem\u003e9-1-1\u003c/em\u003e. There’s nothing like a high-stakes episode to help me unwind!\u003c/p\u003e\u003cp\u003eIf you're ready to start experimenting and building something cool, I can't wait to get started with you.\u003c/p\u003e","teachingVideoPlaybackId":"bi1VJ7qTLiKnizknmNbQdTiaAoIwPsCdpQB02AqoLmDo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"eafd7aa3-7627-436b-815e-64c113d954f6\"}"},{"__ref":"Favorites:{\"uuid\":\"ce141e46-941f-404c-8d75-508c02b4e5ae\"}"},{"__ref":"Favorites:{\"uuid\":\"0d142279-319f-40e7-8acc-68139ec7e959\"}"}],"causesSupported":[],"major":"Materials Science and Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0b8f2d57-c8e2-47fe-b548-74e9d6af73d9\"}"},{"__ref":"DeepDives:{\"uuid\":\"3c525679-54f1-42a0-b3d0-88e0c87e2359\"}"},{"__ref":"DeepDives:{\"uuid\":\"5de071dc-3871-43a6-9880-5ee03ddc9392\"}"},{"__ref":"DeepDives:{\"uuid\":\"c3d391e3-e894-499a-af7d-cadc3a0db0cf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e2a1a338-6df6-47f0-857e-dbf8f6a9d6d0/-/preview/-/format/jpg/","https://ucarecdn.com/7f274177-70e3-48e6-ab0c-c3e606d9f892/-/preview/-/format/jpg/","https://ucarecdn.com/996713d3-5585-4471-b1cc-c9b9f6bd092e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3e3856c3-abda-4b9f-bfa5-5c22d9a8fcdb\"}"},{"__ref":"Education:{\"uuid\":\"9dff1fcf-3951-4f79-95c5-06aa06da29e2\"}"}],"hiredAt":"2026-01-21T15:49:43.616Z","topics":["K-5 Grade Math","Algebra I","Pre-Algebra","Calculus","Chemistry","Physics","College Essay Writing","Computer Science","K-6 Storybook","Music","Fashion / Cosmetics","Coding / Programming","Web Design","Robotics / Electronics / CAD","Game Design","STEM Project","Machine Learning / AI"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"charmaine-guo-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"06a0c382-5dca-44b3-9ae7-d947c82a3349\"}"}}},"_sentryTraceData":"b8896f50b19143718519ef87336ee739-b
