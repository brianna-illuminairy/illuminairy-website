cept or tool. am excited to connect, get to know you, and share some of my favorite subject areas with you.\u003c/p\u003e","teachingVideoPlaybackId":"zvgPW6vCx2cWImLuPIOGN6vFlS7mtfTFx201ofJVQBo4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am the 2022 Women's Middleweight USIBA National Boxing Champion representing Georgia Tech's Club Boxing team. This victory came less than one year after I picked up my first pair of gloves!\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"27e3bb8d-08f8-4404-99a4-cb418562fe96\"}"},{"__ref":"DeepDives:{\"uuid\":\"f266b20e-7968-4976-a382-49e8e0806477\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f7471e92-6c38-47b6-b9b9-95ad936b6d37/-/preview/-/format/jpg/","https://ucarecdn.com/9931fb4f-7c40-4a7e-a368-3b5fd1d99430/-/preview/-/format/jpg/","https://ucarecdn.com/5e9859d7-ea31-4fb7-98b9-fd51f68e0281/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5eed95a3-d7a1-4cb6-b3c7-6eb0dd9c77c4\"}"},{"__ref":"Education:{\"uuid\":\"fa6d4c86-b114-4d87-90e1-96288e93dfb0\"}"}],"hiredAt":"2025-05-10T14:23:17.706Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science","Creative Writing","Coding / Programming","Medicine / Health","Robotics / Electronics / CAD","STEM Project"],"communityBadges":["https://ucarecdn.com/113d5871-8410-43cf-8c06-3005496319c6/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/7888bd4b-612e-4eb6-94e7-3442bd9a4a01/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typ
