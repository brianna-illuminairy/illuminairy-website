xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"d6b55e9d-99a1-47a5-a833-15f90c42afa7\"}":{"__typename":"Education","uuid":"d6b55e9d-99a1-47a5-a833-15f90c42afa7","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":null,"endYear":"2022","expectedGradYear":null,"major":"Music","degree":"Bachelor of Arts"},"MentorPublicProfile:{\"uuid\":\"6c458694-fe7b-4a43-978f-b7a2a6ab375c\"}":{"__typename":"MentorPublicProfile","uuid":"6c458694-fe7b-4a43-978f-b7a2a6ab375c","displayName":"Eddie T.","slug":"eddie-tchaouchev","biography":"Eddie is a double bassist from the Metro Detroit area of Michigan. He recently graduated with a Bachelor of Arts with Honors in Music from Stanford University.\n\nEddie has been passionate about music ever since he began learning the double bass through his middle school orchestra program - an experience that opened him to the joy of learning for the love of learning that continues to motivate him to this day. In addition to his study of the double bass, his undergraduate studies were focused primarily on music theory and analysis, music history, music perception and cognition, philosophy, and psychology. He loves the humanities in general, and is particularly interested in philosophical questions regarding human experience, perception, and learning. His Honors Capstone project drew from the philosophical discipline of phenomenology, the study of consciousness and experience from a first-person perspective, to analyze the experiences of embodiment, learning, and injury in the context of music-making.\n\nEddie is passionate about education and loves to work with students of all ages. \nOutside of class, he served as President of the student service organization Music + Mentorship, through which he taught free music lessons to middle schoolers in the Bay Area. He also had the opportunity to design and teach a fun and hands-on introductory music theory course for undergraduates through Stanford’s Immersion in the Arts (ITALIC) program. \n\nSince graduating, Eddie has worked as an apprentice in the music library of the Houston Grand Opera, where he proofread and made edits and corrections in orchestral scores and parts to prepare them for use in opera performances. In addition, he has worked as a supervisor for the children’s chorus at the opera. In his free time, he loves to run, go on contemplative nature walks, cook, watch classic movies, read, and discover beautiful music from around the world. \n\nHe is particularly interested in working with students who would like to explore their interests in music, philosophy, psychology, or the humanities, as well as students that would like to develop their general academic writing skills. He is excited to mentor students with a sense of curiosity towards the world and our experience in it, and to help them discover their passions and achieve their goals!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Music","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/b31fb39a-1821-4186-ba37-4cda06784468/-/crop/653x652/0,129/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d6b55e9d-99a1-47a5-a833-15f90c42afa7\"}"}],"hiredAt":"2023-01-28T00:45:12.279Z","topics":["History Project","Music","Philosophy","Writing","Reading","History","Computer Science","Executive Function","College Essay Writing","Academi
