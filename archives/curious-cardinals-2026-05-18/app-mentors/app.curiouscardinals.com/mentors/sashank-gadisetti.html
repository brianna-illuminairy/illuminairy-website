xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b6e7be52-877a-490f-a78b-a24593d21368\"}":{"__typename":"DeepDives","uuid":"b6e7be52-877a-490f-a78b-a24593d21368","content":"\u003cp\u003eI would love to give back. I have received so much guidance from so many people in my life. Without their help, I wouldn't be where I am today. I would love to make my student's lives easier and help them grow by offering a perspective of somebody who has been constantly learning and adapting to the systems around them. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also enjoy mentoring and teaching quite a bit, as there are so many lessons to be learned in teaching.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f34ef625-cb9a-4c5e-97f5-d677339cbc35\"}":{"__typename":"DeepDives","uuid":"f34ef625-cb9a-4c5e-97f5-d677339cbc35","content":"\u003cp\u003eI chose Computer Science + Data Science because it felt like the best mix of impact and practicality.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always been drawn to problems where the solution is something you can actually build and scale. Technology is one of the few tools where a small team can create something that helps thousands or millions of people, whether that’s making education more accessible, improving healthcare systems, or just taking friction out of everyday life. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, I’m pretty practical. I like skills that translate directly into real-world outcomes. CS gives me the ability to turn ideas into products, and data science helps me make decisions based on evidence. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"8298588d-c023-49cb-ae66-6ea3248ab079\"}":{"__typename":"DeepDives","uuid":"8298588d-c023-49cb-ae66-6ea3248ab079","content":"\u003cp\u003eI was on the shy side who loved to try new things. Funnily enough, becoming a tennis coach was what really brought me out of my shell and built up my confidence. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ab90211d-959c-4747-9fcb-f21dfc0c016e\"}":{"__typename":"DeepDives","uuid":"ab90211d-959c-4747-9fcb-f21dfc0c016e","content":"\u003cp\u003eMy dad. He has been there my whole life pushing me to discover what I am passionate about and pursue it. I will forever be grateful. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"4a08a2b6-244c-4da2-ac2b-ec8b7e3c6796\"}":{"__typename":"School","uuid":"4a08a2b6-244c-4da2-ac2b-ec8b7e3c6796","name":"Dublin High School","city":"Dublin","type":"HIGH","state":"California","country":"United States","zip":"94568"},"Education:{\"uuid\":\"638ffd65-92d9-41b4-a6df-3d38c6f0c30d\"}":{"__typename":"Education","uuid":"638ffd65-92d9-41b4-a6df-3d38c6f0c30d","school":{"__ref":"School:{\"uuid\":\"4a08a2b6-244c-4da2-ac2b-ec8b7e3c6796\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}":{"__typename":"School","uuid":"dff4a26a-20c2-4281-9c2a-b500907e0661","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"5275600c-8a0d-4872-9031-8257d4c6317e\"}":{"__typename":"Education","uuid":"5275600c-8a0d-4872-9031-8257d4c6317e","school":{"__ref":"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Data Science, Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"02d78ba9-a421-4e8f-a14f-b851d940085d\"}":{"__typename":"MentorPublicProfile","uuid":"02d78ba9-a421-4e8f-a14f-b851d940085d","displayName":"Sashank G.","slug":"sashank-gadisetti","biography":"\u003cp\u003eHey! I’m Sashank, a UC Berkeley student studying Data Science and minoring in Computer Science, and I’m the kind of mentor who’s equal parts coach and builder. I’ve led and built real projects in consulting + technology settings (taking messy, ambiguous problems and turning them into something structured, usable, and actually helpful). The foundation of how I mentor comes from two places: \u003cstrong\u003eworking with special needs children\u003c/strong\u003e and \u003cstrong\u003ecoaching tennis\u003c/strong\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBoth taught me the same lesson: \u003cstrong\u003elearning isn’t one-size-fits-all\u003c/strong\u003e and that teaching is constant learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eI’m best suited for:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion Projects\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eEspecially CS / data / “build something” projects like:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eapps or websites (beginner-friendly)\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003edata science projects (sports, music, social media, environment, etc.)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ebeginner AI projects (chatbots, recommendation systems, simple classifiers)\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic mentorship / study support\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePython, Java\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003edata science fundamentals (cleaning data, basic ML, storytelling with data)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eproject planning + problem-solving strategies \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMath\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEnglish (Took AP Language \u0026amp; AP Literature)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLife skills that matter\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ebuilding confidence through repetition + small wins\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003etime management\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ehow to think clearly under pressure (tests, interviews, competitions)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSpecial needs / learning differences:\u003c/strong\u003e\u003cbr\u003eI have experience working with students who learn differently, including ADHD/autism-adjacent needs (and I’m very comfortable adapting sessions). My style is structured, patient, and flexible. Happy to go fast or go step-by-step, depending on what works.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA session with me usually looks like:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWe start with a clear goal\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI break things down into small steps\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWe practice in a way that feels like coaching: quick feedback, small improvements, repeat\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI’ll give you a simple plan for what to do between sessions\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eQualifications\u003c/strong\u003e\u003c/h3\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eUC Berkeley CS + Data Science student\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReal-world project experience building + shipping work with teams (strategy + product + data)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked with companies such as Visa, SC Johnson, Fervo Energy, Reformation for their product and technical needs\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePart of Net Impact Berkeley, one of the top and oldest consulting clubs at Berkeley\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExperience teaching/coaching through both sports and special education settings\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMany years of teaching experience starting from my days as a pre-medicine student\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHave experience in various fields from software to business/product to medicine.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eFun Facts:\u003c/strong\u003e\u003c/h3\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI’m a huge tennis and pickleball person\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI love making espressos and matchas\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePassionate about having an impact\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLove comedy and sports tv shows\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"TMQf2wjIUzu00pMD5SIXnpAS01APZVvidxIDVZc0221YXY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Data Science, Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b6e7be52-877a-490f-a78b-a24593d21368\"}"},{"__ref":"DeepDives:{\"uuid\":\"f34ef625-cb9a-4c5e-97f5-d677339cbc35\"}"},{"__ref":"DeepDives:{\"uuid\":\"8298588d-c023-49cb-ae66-6ea3248ab079\"}"},{"__ref":"DeepDives:{\"uuid\":\"ab90211d-959c-4747-9fcb-f21dfc0c016e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bd076f90-1e40-4e4a-a615-438e2b0ee492/-/preview/-/format/jpg/","https://ucarecdn.com/41bf6fc6-e9a9-407d-8b5a-04582c2b3dba/-/preview/-/format/jpg/","https://ucarecdn.com/e148cc6c-0140-4806-88d8-5de07e7ef3bd/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"638ffd65-92d9-41b4-a6df-3d38c6f0c30d\"}"},{"__ref":"Education:{\"uuid\":\"5275600c-8a0d-4872-9031-8257d4c6317e\"}"}],"hiredAt":"2026-01-28T02:10:09.682Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Writing","Executive Function","College Essay Writing","Computer Science","Academic Coaching","Creative Writing","Business / Entrepreneurship","Coding / Programming","Machine Learning / AI","Sports Analytics","Sustainab
