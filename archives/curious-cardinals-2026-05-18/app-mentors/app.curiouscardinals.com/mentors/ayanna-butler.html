xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"dedd42ef-ea39-4d57-a4af-a800f3d3856a\"}":{"__typename":"DeepDives","uuid":"dedd42ef-ea39-4d57-a4af-a800f3d3856a","content":"\u003cp\u003eMentorship matters to me because it shapes not just what you learn, but how you grow. I’ve benefited from mentors who invested in me, and I want to create that same kind of supportive, confidence-building environment for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"e4fd0291-0b1b-4b4a-ab6c-1290eb1ef868\"}":{"__typename":"DeepDives","uuid":"e4fd0291-0b1b-4b4a-ab6c-1290eb1ef868","content":"\u003cp\u003eMy identity shapes my teaching in that I’m very intentional about creating a classroom where all students—especially those from a variety of backgrounds—feel seen, valued, and capable. Growing up, I understand how powerful it is to have role models who believe in your potential. That makes me prioritize inclusive teaching, representation, and building relationships so students feel a strong sense of belonging and confidence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"80f3d60b-b267-4e6b-879e-c2447df1b633\"}":{"__typename":"School","uuid":"80f3d60b-b267-4e6b-879e-c2447df1b633","name":"Western School of Technology \u0026 Environmental Science","city":"Catonsville","type":"HIGH","state":"Maryland","country":"United States","zip":"21228"},"Education:{\"uuid\":\"f3b7e179-afea-46c0-8704-19431e63417d\"}":{"__typename":"Education","uuid":"f3b7e179-afea-46c0-8704-19431e63417d","school":{"__ref":"School:{\"uuid\":\"80f3d60b-b267-4e6b-879e-c2447df1b633\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"a4ff0ee1-dff1-4503-9963-8fe63234a214\"}":{"__typename":"Education","uuid":"a4ff0ee1-dff1-4503-9963-8fe63234a214","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Ecology","degree":null},"MentorPublicProfile:{\"uuid\":\"e5d9226a-6f08-4960-98ab-11cd1cc08484\"}":{"__typename":"MentorPublicProfile","uuid":"e5d9226a-6f08-4960-98ab-11cd1cc08484","displayName":"Ayanna B.","slug":"ayanna-butler","biography":"\u003cp\u003eI am a PhD candidate in Ecology, Evolution, and Environmental Biology at Columbia University, and I am passionate about helping students understand how the world around them works. My academic background is rooted in environmental science, where I study how natural systems respond to change, but what excites me most is making these ideas accessible and engaging for others.\u003c/p\u003e\u003cp\u003eI’ve always been curious about how things are connected—how water moves through landscapes, how forests recover after disturbance, and how small changes in the environment can have larger impacts. That curiosity is what led me to pursue a career in science, and it’s something I try to pass on to every student I work with. I believe science is not just about memorizing facts, but about asking questions, thinking critically, and developing a deeper understanding of the world.\u003c/p\u003e\u003cp\u003eIn addition to my research, I have extensive experience teaching and mentoring students at a range of levels. I have worked as a teaching assistant at Columbia University, where I supported undergraduate students in learning complex scientific concepts, and I have also worked with younger students through programs like the E3B Summer Youth Justice Program and Ms. Steph’s Science Club. In these roles, I have led hands-on activities, guided students through problem-solving, and helped them build confidence in their abilities. I especially enjoy working with students from underserved communities and creating learning environments where all students feel supported and capable.\u003c/p\u003e\u003cp\u003eMy teaching style is patient, encouraging, and interactive. I focus on breaking down complex ideas into simple, understandable pieces and connecting concepts to real-world examples that students can relate to. Whether I’m helping a student with science coursework, preparing for exams, or exploring broader STEM topics, my goal is to make learning feel approachable and engaging.\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy finding new ways to connect science to everyday life and helping students see that STEM is not something distant or intimidating, but something they can understand and be a part of. I am excited about the opportunity to support students in building both their knowledge and their confidence, and to help them develop skills that will stay with them beyond the classroom.\u003c/p\u003e","teachingVideoPlaybackId":"1qTANqfQ701TUe02W2lytxYgjQ1Kdw7d00c200PPzGudzto","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Ecology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dedd42ef-ea39-4d57-a4af-a800f3d3856a\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4fd0291-0b1b-4b4a-ab6c-1290eb1ef868\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dc8cff42-c825-4c74-aab9-cf8a84d0793f/-/preview/-/format/jpg/","https://ucarecdn.com/d93e198c-1c49-4882-ac61-810d7c752de6/-/preview/-/format/jpg/","https://ucarecdn.com/1c89b7fc-cb1b-4e82-ab86-a3f7a3faf49a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f3b7e179-afea-46c0-8704-19431e63417d\"}"},{"__ref":"Education:{\"uuid\":\"a4ff0ee1-dff1-4503-9963-8fe63234a214\"}"}],"hiredAt":"2026-04-03T17:46:21.488Z","topics":["Calculus","Statistics","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science","Video / Photography","K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Coding / Programming","STEM Project","Sustainability","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ayanna-butler\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e5d9226a-6f08-4960-98ab-11cd1cc08484\"}"}}},"_sentryTraceData":"03e2a7b21e67480e9c1dbcf4d8fd32eb-a81619c2efd49603-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=03e2a7b21e67480e9c1dbcf4d8fd32eb,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ayanna-butler"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].p
