xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a05a17a5-6ce5-4ebf-bbb6-3e058819232b\"}":{"__typename":"Favorites","uuid":"a05a17a5-6ce5-4ebf-bbb6-3e058819232b","photoUrl":"https://ucarecdn.com/e102fbb9-a93a-429d-b6bf-7958cc608813/","title":"Educated (Tara Westover)","type":"BOOK"},"Favorites:{\"uuid\":\"654d66fc-bbf3-466d-8ea6-3d22ec99ee46\"}":{"__typename":"Favorites","uuid":"654d66fc-bbf3-466d-8ea6-3d22ec99ee46","photoUrl":"https://ucarecdn.com/b977e644-95e3-4e2c-acc9-3f19bc1283cf/","title":"Maggie Q","type":"ACTOR"},"Favorites:{\"uuid\":\"c5e817a3-3cb4-45a2-914f-2e7af9ec40c4\"}":{"__typename":"Favorites","uuid":"c5e817a3-3cb4-45a2-914f-2e7af9ec40c4","photoUrl":"https://ucarecdn.com/34391c27-2360-419b-9772-e52d2e2dfd76/","title":"Revolution (Miranda Lambert)","type":"ALBUM"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f0d4c2b9-be44-47bf-b48a-5271f9513e29\"}":{"__typename":"DeepDives","uuid":"f0d4c2b9-be44-47bf-b48a-5271f9513e29","content":"\u003cp\u003eMy high school experience was marked by the COVID pandemic starting halfway through my Freshman year (NOT FUN!!), but I still found ways to stay busy over the summers. My Freshman Summer, I was able to make it to the national level of the FBLA Business Law competition. Usually, this involves a trip to their national conference over the summer to compete in the national level competition. Unfortunately, the pandemic caused the competition to instead be conducted remotely — so I spent the summer studying for that test from home. My Sophomore Summer, I was accepted to Harvard Summer School, where I took two classes, (remotely because of the pandemic). I also interned full-time at a local real estate law firm in Wilmington, NC. My Junior Summer, I was again accepted to Harvard Summer School — and was finally able to attend in person! I spent my time learning about International Relations, War, and exploring Boston!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"355b1c26-7938-41d5-9418-b2ac9009c193\"}":{"__typename":"DeepDives","uuid":"355b1c26-7938-41d5-9418-b2ac9009c193","content":"\u003cp\u003eComing from the rural south heavily impacts the way that I interact with the world, including my teaching style! In Appalachia, we tend to communicate through stories — and I am no exception! I think the best way to learn is not to memorize, but to build a framework of critical analysis that can guide you through different scenarios. Learning through stories (or case studies) is a great way of developing these frameworks! In Economics, this might look like learning about a business and contextualizing different decisions they make. In Political Science, this centers around understanding the different personal, national, regional, and global contexts that explain why actors make certain decisions — and often predetermine their success or failure.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"085a42c0-9fa5-4743-89f0-843b26b292ee\"}":{"__typename":"DeepDives","uuid":"085a42c0-9fa5-4743-89f0-843b26b292ee","content":"\u003cp\u003eIn my Freshman year at Yale, I was incredibly lucky to be assigned a TF (which is a Yale graduate student who teaches part of a course to undergrads) who would later become a significant mentor in my life! At the time, she was in the process of editing her memoir about growing up in Ukraine and, after learning about my unique background, pushed me to start writing my own! Since then, I have written a significant portion of my first draft! I have found that writing a book is one of the best things someone can do not only to enact change in the world, but to help clarify takeaways from prior challenges.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"9b00c716-e81d-4bd3-8e83-b1302d578096\"}":{"__typename":"DeepDives","uuid":"9b00c716-e81d-4bd3-8e83-b1302d578096","content":"\u003cp\u003eI am incredibly blessed to have three passions in my life: politics, economics, and the people of North Carolina. In my lifetime, I hope to meaningfully contribute to the people of North Carolina by utilizing the skills and frameworks given to me by Political Science and Economics. Today, that looks like working to get candidates elected who I believe will benefit the people of my state. It also looks like helping the Federal Reserve understand the state of the American Economy so we can make monetary policy decisions that keep unemployment and inflation low. In the future, it might involve being a candidate for office myself or working with politicians to draft economically sound legislation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"1d32ffc4-9447-40d5-bc67-b60103247125\"}":{"__typename":"School","uuid":"1d32ffc4-9447-40d5-bc67-b60103247125","name":"Isaac Bear Early College High School","city":"Wilmington","type":"HIGH","state":"North Carolina","country":"United States","zip":"28403"},"Education:{\"uuid\":\"a4524a06-27cc-455e-9b79-c925af90cc11\"}":{"__typename":"Education","uuid":"a4524a06-27cc-455e-9b79-c925af90cc11","school":{"__ref":"School:{\"uuid\":\"1d32ffc4-9447-40d5-bc67-b60103247125\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"0519234b-17fb-4295-8c30-17ce1d5a7a5a\"}":{"__typename":"Education","uuid":"0519234b-17fb-4295-8c30-17ce1d5a7a5a","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics \u0026 Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"984fce41-b99a-4520-ba60-9ec44cc9709c\"}":{"__typename":"MentorPublicProfile","uuid":"984fce41-b99a-4520-ba60-9ec44cc9709c","displayName":"Garrett W.","slug":"garrett-warner","biography":"\u003cp\u003eHi! I'm Garrett, a double major in Economics and Political Science at Yale. I dedicate most of my time to exploring those two topics: I am a current intern with the research division of the Federal Reserve Bank of Atlanta and I also have experience working with both Democrats and Republicans in national politics. Within Economics, I tend to focus on Macroeconomics because I believe there is a lot of insight that policy makers can gain from understanding the complex global economy. However, I also love Microeconomics’ business applications. In Political Science, I tend to focus on the intersection of globalization, conflict, and American Politics. I approach this by learning about different regions of the world through classes and American Politics through real-world practice. When I'm not working, I spend my time writing my memoir centered around growing up in rural Appalachian North Carolina and adapting to the unique culture of the Ivy League. The book is most similar to Educated by Tara Westover, which I highly recommend that everyone read! I also spend a lot of my time combating antisemitism around the United States, working with multiple leading national organizations in this field. I am also a strong advocate for public education in North Carolina — I have visited high schools to talk to students about applying to Yale and wrote a speech for a non-profit fundraiser at the school in my hometown with the goal of fixing the school’s aging facilities. In terms of clubs, I am a member of the Yale Political Union, where I write and perform speeches nearly every week in front of fellow Yale students and leading international thought leaders. One of my favorite speeches that I have performed was arguing that we should reconsider satellite systems that reflect Earth’s light pollution because they make it so that we can’t see the stars! In America, stars are central to our understanding of self-improvement and seeking a better life — from the north star to the “stars” of Hollywood. Many of us aspire to be stars, so it’s important that future generations of children should be able to see them in the night sky. We also associate stars with dreams, I believe that it is incredibly important that everyone feels like their dreams are attainable, and that they can make a concrete plan to achieve them.\u003c/p\u003e","teachingVideoPlaybackId":"h4L341qX5tRoFm00cJd01w9Dmv01uifkE4FnCfqm4rpENg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThe village I grew up in is one of the smallest on the East coast: it has about 250 full time residents. Our public school also serves nearby towns and has about 250 students, from Kindergarten all the way through 13th grade! (13th grade is a program some North Carolina schools have which allows students to attend classes at a local community college for free, graduating with a high school diploma and an associates degree simultaneously). Because the town is so isolated, the school often struggles to find teachers. The year of my Sophomore year at Yale, the school had to start the school year without a single math teacher in the entire high school: students from 9th to 12th grade found themselves having to learn Math completely online through tools similar to Khan Academy! I reached out to a local nonprofit that raises money for the school and was able to write a speech that was performed at a fundraiser that successfully raised enough money to entice a math teacher from a neighboring school district to come teach our high school students. Being a significant part of the effort to provide these students with a real chance at learning the math skills they will need to be accepted into college will be my proudest achievement for a long time to come.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a05a17a5-6ce5-4ebf-bbb6-3e058819232b\"}"},{"__ref":"Favorites:{\"uuid\":\"654d66fc-bbf3-466d-8ea6-3d22ec99ee46\"}"},{"__ref":"Favorites:{\"uuid\":\"c5e817a3-3cb4-45a2-914f-2e7af9ec40c4\"}"}],"causesSupported":[],"major":"Economics \u0026 Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f0d4c2b9-be44-47bf-b48a-5271f9513e29\"}"},{"__ref":"DeepDives:{\"uuid\":\"355b1c26-7938-41d5-9418-b2ac9009c193\"}"},{"__ref":"DeepDives:{\"uuid\":\"085a42c0-9fa5-4743-89f0-843b26b292ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"9b00c716-e81d-4bd3-8e83-b1302d578096\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0d920493-8bc3-4fa6-a639-196d7c6d7230/-/preview/-/format/jpg/","https://ucarecdn.com/e8bd3d59-54c1-411f-b748-c2177c8e6c3f/-/preview/-/format/jpg/","https://ucarecdn.com/e82e4971-884a-4e87-99b4-cea396d6ce55/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a4524a06-27cc-455e-9b79-c925af90cc11\"}"},{"__ref":"Education:{\"uuid\":\"0519234b-17fb-4295-8c30-17ce1d5a7a5a\"}"}],"hiredAt":"2026-01-16T15:44:30.500Z","topics":["Writing","Spanish","Academic Coaching","College Essay Writing","Economics","Executive Function","History","Reading","Creative Writing","Finance / Investing","Debate","Journalism","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"garrett-warner\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"984fce41-b99a-4520-ba60-9ec44cc9709c\"}"}}},"_sentryTraceData":"f9eefbb700ab49c98fbd85ea2b7c7e67-b9796974777e6a4b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f9eefbb700ab49c98fbd85ea2b7c7e67,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"garrett-warner"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7
