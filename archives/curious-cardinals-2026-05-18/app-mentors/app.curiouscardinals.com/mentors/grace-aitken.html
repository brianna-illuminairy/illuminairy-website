xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"890a7772-245e-440c-bac1-d4c8f6e42192\"}":{"__typename":"Favorites","uuid":"890a7772-245e-440c-bac1-d4c8f6e42192","photoUrl":"https://ucarecdn.com/fa813d32-67df-4396-9526-5230f5d03d0a/","title":"Uno","type":"GAME"},"Favorites:{\"uuid\":\"9caa3fcb-0ca3-409d-9faa-9b75eb27131c\"}":{"__typename":"Favorites","uuid":"9caa3fcb-0ca3-409d-9faa-9b75eb27131c","photoUrl":"https://ucarecdn.com/1707ed7d-9d62-4bff-b2a7-f08a17beba89/","title":"Moonrise Kingdom ","type":"MOVIE"},"Favorites:{\"uuid\":\"1a7f320d-7cec-4980-8921-58ed25f7dd8b\"}":{"__typename":"Favorites","uuid":"1a7f320d-7cec-4980-8921-58ed25f7dd8b","photoUrl":"https://ucarecdn.com/279a5930-35fb-4b01-9d64-5d052c4d27ab/","title":"East of Eden","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e2071c1c-d80e-41b6-8b99-51459e193147\"}":{"__typename":"DeepDives","uuid":"e2071c1c-d80e-41b6-8b99-51459e193147","content":"\u003cp\u003eWhen I went to college I thought I was going to study political science due to my interest in law and government. After my first year, I fell in love with my history classes and changed my major to United States history. The primary reason I switched my major was because I loved reading and analytical writing, and history gave me the opportunity to do both. I ended up focusing on 20th century history, and wrote my senior essay about an unconventional political group in the early 1900s in Los Angeles. I still kept my connection to political science by becoming a research assistant for a political science professor. We studied how local newspaper endorsements have impacted American elections over time, which was a perfect way to blend both history and politics.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"352d7a20-2d75-4503-9f45-83920a79d0b5\"}":{"__typename":"DeepDives","uuid":"352d7a20-2d75-4503-9f45-83920a79d0b5","content":"\u003cp\u003eDuring a summer in high school, I worked at a pet store. It wasn’t a glamorous job, but it was my first “real job,” and I loved working there. Working in retail gives you a crash course on how to deal with difficult people, which is a skill I know I will use throughout my life. I also loved seeing all the wonderful animals people would bring in the store. Today I volunteer weekly at an animal shelter in Philadelphia, and I use my animal knowledge from my former life as a pet store employee often.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"ccb069cd-497f-4567-8ca7-0a64d291d842\"}":{"__typename":"DeepDives","uuid":"ccb069cd-497f-4567-8ca7-0a64d291d842","content":"\u003cp\u003eI am very proud of the work I do at my job everyday. When I graduated, I wasn't quite sure what I wanted to do before law school, but I knew I wanted to help people. I work at a legal services organization where I connect low-income clients to volunteer attorneys. I am passionate about access to justice, and I feel so lucky that I get to go to work every day and help provide people with essential legal services. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"102d771c-61fb-49b9-9ce9-5410e521d29a\"}":{"__typename":"DeepDives","uuid":"102d771c-61fb-49b9-9ce9-5410e521d29a","content":"\u003cp\u003eEvery Sunday I work at the animal shelter here in Philadelphia. It's been a great way to connect with my new community. I grew up with lots of pets in Southern California, and spending time with the animals at the shelter feels like a little slice of home out here on the east coast. When I'm not working or at the animal shelter, I love to explore new restaurants around the city with my friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2971fc21-fa4b-4292-b857-728f2c7744ce\"}":{"__typename":"School","uuid":"2971fc21-fa4b-4292-b857-728f2c7744ce","name":"San Juan Hills High School","city":"San Juan Capistrano","type":"HIGH","state":"California","country":"United States","zip":"92675"},"Education:{\"uuid\":\"8b6797f7-f8d0-44f1-8822-0b57da458373\"}":{"__typename":"Education","uuid":"8b6797f7-f8d0-44f1-8822-0b57da458373","school":{"__ref":"School:{\"uuid\":\"2971fc21-fa4b-4292-b857-728f2c7744ce\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b269aa76-6366-491e-8741-10cd517c96e8\"}":{"__typename":"Education","uuid":"b269aa76-6366-491e-8741-10cd517c96e8","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"United States History ","degree":null},"MentorPublicProfile:{\"uuid\":\"7ebb951c-1cca-4f64-9d3f-8f1601f3d562\"}":{"__typename":"MentorPublicProfile","uuid":"7ebb951c-1cca-4f64-9d3f-8f1601f3d562","displayName":"Grace A.","slug":"grace-aitken","biography":"\u003cp\u003eHi! I’m Grace, and I am a recent Yale University graduate with a degree in United States history. I am passionate about helping students, whether it is with a passion project or academic mentoring in humanities and social studies classes. I love helping students polish their writing, develop study skills, and explore their passions!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA little bit about me:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI am interested in government, history, public policy, and law. In high school, I:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eLed my school’s newspaper, where I wrote, edited, and published engaging news pieces about our school and community. I won two “Best of Student News Online” awards for my original journalism.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBecame involved in my school district, and fought for better mental health resources for students by organizing student groups and going to council meetings.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStarted a student organization that educated our peers about mental health issues in teens. We led a yearly charity walk that raised over $5000 for mental health resources in our community.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInterned for my local congressman, where I gained valuable experience in political campaigning.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWon the class-wide award for excellence in AP United States History.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eIn college, I both continued fostering these passions and discovered new ones! I joined my school’s club rugby team, researched how newspaper endorsements have affected US elections, and volunteered with Volunteer Income Tax Assitance. I interned with congresswoman Katie Porter, where I helped manage her press relations and social media presence. I also was a policy intern with the Inner City Law Center in Los Angeles, where I studied housing and homelessness policy. I was nominated for a prize for my senior essay, and graduated \u003cem\u003emagna cum laude \u003c/em\u003elast May.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I work as a case manager at a legal services organization in Philadelphia where I help connect low-income clients with volunteer attorneys for assistance with homeownership matters, adoption, custody, name changes, and more. I recently took the LSAT and plan on applying to law school in the future. Outside of work, I love to volunteer at the local animal shelter, watch movies, and explore the city with my friends.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve:\u0026nbsp;\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eGoing over responsible study and organization habits to maximize success across your classes.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReviewing content from your history, social studies, English, or Spanish language classes.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorming and editing essays for class, college applications, or outside projects.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eI am excited to get to know you!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"h5UQbea00Let2ZaReWnBD7d5eq01K9ZDuY6kjH2488Sd8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"890a7772-245e-440c-bac1-d4c8f6e42192\"}"},{"__ref":"Favorites:{\"uuid\":\"9caa3fcb-0ca3-409d-9faa-9b75eb27131c\"}"},{"__ref":"Favorites:{\"uuid\":\"1a7f320d-7cec-4980-8921-58ed25f7dd8b\"}"}],"causesSupported":[],"major":"United States History ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e2071c1c-d80e-41b6-8b99-51459e193147\"}"},{"__ref":"DeepDives:{\"uuid\":\"352d7a20-2d75-4503-9f45-83920a79d0b5\"}"},{"__ref":"DeepDives:{\"uuid\":\"ccb069cd-497f-4567-8ca7-0a64d291d842\"}"},{"__ref":"DeepDives:{\"uuid\":\"102d771c-61fb-49b9-9ce9-5410e521d29a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e48d8683-4496-4ac8-a6fe-ee452bfad57b/-/preview/-/format/jpg/","https://ucarecdn.com/7fade4f9-1a80-47a9-9fa3-885cfa2c345c/-/preview/-/format/jpg/","https://ucarecdn.com/0ae9c4f3-264d-4b0b-9b03-7ba90b81a6c1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8b6797f7-f8d0-44f1-8822-0b57da458373\"}"},{"__ref":"Education:{\"uuid\":\"b269aa76-6366-491e-8741-10cd517c96e8\"}"}],"hiredAt":"2026-04-03T17:39:52.377Z","topics":["6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Sports Journalism","History Project","Business / Entrepreneurship","Law / Government / Policy","Sustainability","Journalism"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"grace-aitken\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7ebb951c-1cca-4f64-9d3f-8f1601f3d562\"}"}}},"_sentryTraceData":"945132c3b2f34cfd937afa3926cd607e-91d34d6a38ead17f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-tr
