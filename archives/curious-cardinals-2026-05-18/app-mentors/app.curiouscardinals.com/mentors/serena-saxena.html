xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fe0187e9-eee1-4c66-b822-6d68728f3989\"}":{"__typename":"DeepDives","uuid":"fe0187e9-eee1-4c66-b822-6d68728f3989","content":"\u003cp\u003eI chose my major because I’m fascinated by how people make decisions—especially at the intersection of humans and technology. Behavioral Decision Sciences lets me explore the psychology behind trust, advice-taking, and judgment, while my data and international affairs courses give me tools to design systems and policies that shape those choices. It’s the perfect mix of understanding \u003cem\u003ewhy\u003c/em\u003e people act the way they do and figuring out \u003cem\u003ehow\u003c/em\u003e to build better solutions for the future!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"24d9f4bb-dd0f-4263-b670-04bd5533837b\"}":{"__typename":"DeepDives","uuid":"24d9f4bb-dd0f-4263-b670-04bd5533837b","content":"\u003cp\u003eMentorship matters to me because it’s about amplifying voices and opening doors. So much of opportunity comes down to access, to information, networks, and belief in what’s possible. I’ve been shaped by mentors who saw potential in me before I fully saw it myself, and I want to pay that forward. Mentorship isn’t just guidance; it’s creating a ripple effect where someone else’s success becomes the foundation for many more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7dbcc5b4-b8d3-478d-a515-e68a8445a8f0\"}":{"__typename":"DeepDives","uuid":"7dbcc5b4-b8d3-478d-a515-e68a8445a8f0","content":"\u003cp\u003eI’d tell my younger self to advocate for herself relentlessly! To trust her instincts, speak with conviction, and never shrink to make others comfortable. No one will fight for your dreams harder than you will, and closed mouths don’t get fed. Claim your space, ask for what you deserve, and remember: your voice is your greatest tool so use it boldly!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2822ff7c-8097-4087-8436-99dc9c155aad\"}":{"__typename":"School","uuid":"2822ff7c-8097-4087-8436-99dc9c155aad","name":"The Nueva School | San Mateo","city":"San Mateo","type":"HIGH","state":"California","country":"United States","zip":"94403"},"Education:{\"uuid\":\"78afc59a-7141-43f5-89ad-7372c1364036\"}":{"__typename":"Education","uuid":"78afc59a-7141-43f5-89ad-7372c1364036","school":{"__ref":"School:{\"uuid\":\"2822ff7c-8097-4087-8436-99dc9c155aad\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"ae2e1fb4-e530-4ae6-b544-da75cba9c480\"}":{"__typename":"Education","uuid":"ae2e1fb4-e530-4ae6-b544-da75cba9c480","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Decision Sciences, International \u0026 Public Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"a58f5d1b-79b0-4aae-82c7-71e8c7f17f33\"}":{"__typename":"MentorPublicProfile","uuid":"a58f5d1b-79b0-4aae-82c7-71e8c7f17f33","displayName":"Serena S.","slug":"serena-saxena","biography":"\u003cp\u003eHi, I’m Serena! I’m a junior at Brown University, where I study Behavioral Decision Sciences, International and Public Affairs, and Data Science. That might sound like a mouthful, but at its core, my work is about understanding how people make decisions—why we trust certain voices, how technology shapes our choices, and how our identities and communities influence the paths we take.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up in the San Francisco Bay Area, I was always fascinated by how ideas turn into action. I started out as a storyteller through journalism, which taught me how to ask meaningful questions and really listen. Over time, my curiosity evolved into building and problem-solving: launching startups, mentoring founders, and now investing in early-stage companies through Van Wickle Ventures, Brown’s student-run venture capital fund.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Brown, my day-to-day life is a mix of research, leadership, and mentorship. In the Sloman Lab, I study trust, collaboration, and how groups of people (and even humans and machines!) solve problems together. Outside the lab, I am involved in our entrepreneurship ecosystem, and work closely with startup founders to help bring their ideas to life. I’ve also organized entrepreneurship trips to cities like Boston and New York to give students hands-on exposure to innovative companies and communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut the role I’ve always loved most is mentoring. I’ve worked with students from middle school through college, helping them explore their passions, set meaningful goals, and build the confidence to take the next step forward. Whether a student is excited about launching a project, navigating a challenging class, or just figuring out what makes them tick, I believe the best growth comes from curiosity and support—not pressure.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I love exploring new experiences. I’m a lifelong sports enthusiast (go Warriors...), a food adventurer who’s always hunting for the best local spots, and a huge fan of design and fashion. I also love photography and reading! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I work with students, I focus on meeting them where they are. That might mean breaking down complex ideas into clear, simple steps, brainstorming creative solutions to a problem, or just being a sounding board as they discover what excites them most. My goal is to make learning feel energizing and empowering, not intimidating. I believe deeply in the power of access and opportunity. Often, the difference between a student pursuing a big dream and giving up is whether someone helps them see what’s possible.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the end of the day, I see every mentoring relationship as a partnership. You bring their questions, creativity, and drive; I bring my experience, empathy, and some tools to help :) Together, we can figure out what they want to achieve and make it happen.\u003c/p\u003e","teachingVideoPlaybackId":"vlwVfpD02oBNeAOf4IgRSuSeDSXrcwhuUf7AiyJjeIGk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Decision Sciences, International \u0026 Public Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fe0187e9-eee1-4c66-b822-6d68728f3989\"}"},{"__ref":"DeepDives:{\"uuid\":\"24d9f4bb-dd0f-4263-b670-04bd5533837b\"}"},{"__ref":"DeepDives:{\"uuid\":\"7dbcc5b4-b8d3-478d-a515-e68a8445a8f0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b6b4c5d2-fe08-491f-a294-77aa25763662/-/preview/-/format/jpg/","https://ucarecdn.com/38d9b115-68f6-4b43-bd38-067243e8d835/-/preview/-/format/jpg/","https://ucarecdn.com/a2750953-8403-4f5a-ae04-4870f1b8dc26/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"78afc59a-7141-43f5-89ad-7372c1364036\"}"},{"__ref":"Education:{\"uuid\":\"ae2e1fb4-e530-4ae6-b544-da75cba9c480\"}"}],"hiredAt":"2025-09-11T22:15:21.591Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"serena-saxena\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a58f5d1b-79b0-4aae-82c7-71e8c7f17f33\"}"}}},"_sentryTraceData":"f8102ced2b9940abb1f7d0ed36a5459d-82d9040e9406af72-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f8102ced2b9940abb1f7d0ed36a5459d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"serena-saxena"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
