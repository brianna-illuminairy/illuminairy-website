 originally from Thailand 🇹🇭, where I worked as a software engineer 🧑‍💻 for a year after graduation from the University of Michigan with a double major—Mathematics (Honors) and Computer Science. When I started working as a software engineer in 2023, I found that many skills required in the technology industries were not really taught in schools/colleges! That led me to think about sharing these skill sets and mentoring friends and juniors in high schools \u0026amp; colleges for their career paths.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSkills\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e📚 My expertise includes cloud platforms (e.g., utilizing virtual CPUs in the cloud), data analytics (analyzing real-world data to generate actionable insights), web systems (creating your own portfolio website, for example!), and mathematical concepts (for instance, probability theory, algebra, combinatorics, high school mathematics competitions). I found that these skills I have developed since starting my career in software engineering have helped me grow significantly in the technology field.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eTA Experience\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e💻 Because of my debugging skills (though, it is even better if there are no programming bugs 🐞! 🙂), Professor Hardeep Johar at Columbia invited me to be a Teaching Assistant for his three courses—Generative AI, Data Analytics, and Analytics on the Cloud. I developed my interest in teaching and mentoring after serving as a TA at Columbia; I went above and beyond for students with precise grading and constructive feedback, for the purpose of improvements \u0026amp; growth—rather than making the courses intense!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMentorship Principles\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e🎓📖 My principles of mentoring are that I would lean on mentees’ interests as much as I can—because they are the center of their growth. I do not allocate projects that are not practical for mentees to complete within the discussed timeline established in the very first weeks of our sessions. My role is to make sure mentees are on track to finish the project with either real-world actionable insights or products, based on their interests. Mentees can also always ask any questions about anything beyond the projects we are doing and propose any ideas for any part of the projects—\u003cstrong\u003eit’s all for you and about you\u003c/strong\u003e 😀!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHobbies\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e⚽️ Aside from academic \u0026amp; professional careers, I like watching soccer, watching movies, and intaking world news.\u003c/p\u003e","teachingVideoPlaybackId":"ToUB01g01SrAxBkdWA7DUKNesduNJS1fdyhphS39aPvpw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"100170ac-d095-4c3f-a9b3-96906affdacc\"}"}],"causesSupported":[],"major":"Business Analytics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8534913c-019c-406f-a8a6-cb73aad0d736\"}"},{"__ref":"DeepDives:{\"uuid\":\"56f27b73-7eb4-46cf-ae29-5c18ad37568a\"}"},{"__ref":"DeepDives:{\"uuid\":\"af3028a3-7d35-4aec-b529-52d20f1d830d\"}"},{"__ref":"DeepDives:{\"uuid\":\"fe23da6a-f57b-40f1-8806-2b930731c3f6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c04c7fda-87fd-4384-bc91-334b17454c54/-/preview/-/format/jpg/","https://ucarecdn.com/2839b249-fa7e-4a9c-a714-4971d87e9726/-/preview/-/format/jpg/","https://ucarecdn.com/7e39bd5a-6077-469b-a8b0-ed5da531aaa9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c2431475-48a5-4847-8ab1-db4a4eee88fc\"}"},{"__ref":"Education:{\"uuid\":\"4ee046a6-7ed2-4027-92da-8815a2a1a9ad\"}"}],"hiredAt":"2026-02-11T18:57:39.675Z","topics":["Statistics","Calculus","Precalculus / Trigon
