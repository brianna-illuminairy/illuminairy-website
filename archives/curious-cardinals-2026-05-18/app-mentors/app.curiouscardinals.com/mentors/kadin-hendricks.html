xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ca8a5a65-8bd3-4f1e-8f78-1f4f71608249\"}":{"__typename":"Favorites","uuid":"ca8a5a65-8bd3-4f1e-8f78-1f4f71608249","photoUrl":"https://ucarecdn.com/db0d36fe-d9c7-40d0-8ca4-ad3985488c98/","title":"Green Bay Packers","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"2f0ea098-21ac-4f15-8f5e-342ccfd6ae16\"}":{"__typename":"Favorites","uuid":"2f0ea098-21ac-4f15-8f5e-342ccfd6ae16","photoUrl":"https://ucarecdn.com/b60d89bb-23e1-4752-86b7-5794365eccb8/","title":"Disco Elysium","type":"GAME"},"Favorites:{\"uuid\":\"a7c4e764-f74f-4c81-a1b3-c2099d7c3cdd\"}":{"__typename":"Favorites","uuid":"a7c4e764-f74f-4c81-a1b3-c2099d7c3cdd","photoUrl":"https://ucarecdn.com/d01dc126-3c55-4c03-a94d-39a78d7af8b0/","title":"Seveneves, Neal Stephenson","type":"BOOK"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"5a7530a4-323f-427b-b0f7-905ead83e630\"}":{"__typename":"DeepDives","uuid":"5a7530a4-323f-427b-b0f7-905ead83e630","content":"\u003cp\u003eI'm working on an EP! I've been writing my own music for a few years now, and wanted to make a project that I felt reflected the love that I have for making music.  I spent about 6 months writing the first drafts of the lyrics and instrumentals, and have spent the last 6 months recording, tweaking, and re-writing them \"just one more time\".  I don't have a set release date goal for it currently, but have loved the process of watching these songs slowly get better with each week!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d34bea21-cc6c-4d20-b627-468d99e6d6cc\"}":{"__typename":"DeepDives","uuid":"d34bea21-cc6c-4d20-b627-468d99e6d6cc","content":"\u003cp\u003eThroughout my life, I've had many mentors who would go on to shape large parts of who I am. Without people like my grandfather, my high school band director, or even my college RA's, I might not be an engineer, or a musician, or be swamped with imposter syndrome. In my opinion, a good mentor is one of the most valuable things someone can have, and I would love to use my experience to to be that for someone else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5a15a55b-4a20-4f18-9b93-166fa69635c2\"}":{"__typename":"DeepDives","uuid":"5a15a55b-4a20-4f18-9b93-166fa69635c2","content":"\u003cp\u003eA lot of my spare time is spent listening to and making music, either gathering ideas for my own work or just relaxing and enjoying some great songs! Outside of music, I've long had a love for photography, and try to make trips out to go hiking and do photography frequently. I also enjoy video games, cooking, and following sports (Go Pack Go!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6c327fb0-c465-4961-89e4-4722c382df0f\"}":{"__typename":"DeepDives","uuid":"6c327fb0-c465-4961-89e4-4722c382df0f","content":"\u003cp\u003eI worked with my grandfather doing lawncare and handyman work around Green Bay. To this day, it is one the best jobs I've ever had.  The work was definitely hard (Wisconsin summers are no joke!), but it was so fun getting to know people from so many different walks of life. My grandfather's business was essentially just him before I joined, and his clients ranged from former NFL players to elderly clients on disability and everyone in between. No matter the client, my grandfather was always friendly with them, and hearing how different their latest life updates were gave me a unique perspective on the world that I definitely would not have gotten otherwise.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"f78deefd-812a-4fc0-b109-c944ee96eefa\"}":{"__typename":"School","uuid":"f78deefd-812a-4fc0-b109-c944ee96eefa","name":"West De Pere High School","city":"De Pere","type":"HIGH","state":"WI","country":"United States","zip":"54115"},"Education:{\"uuid\":\"d9bf59d7-f91c-451c-b1c4-821365b91f77\"}":{"__typename":"Education","uuid":"d9bf59d7-f91c-451c-b1c4-821365b91f77","school":{"__ref":"School:{\"uuid\":\"f78deefd-812a-4fc0-b109-c944ee96eefa\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"85903d61-fd41-44ad-b6f1-a705eae5384a\"}":{"__typename":"Education","uuid":"85903d61-fd41-44ad-b6f1-a705eae5384a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2025","major":"Aeronautical and Astronautical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"a6e4134c-d8bd-43f5-a86e-3bb6a01b37af\"}":{"__typename":"MentorPublicProfile","uuid":"a6e4134c-d8bd-43f5-a86e-3bb6a01b37af","displayName":"Kadin H.","slug":"kadin-hendricks","biography":"\u003cp\u003eHi! I’m Kadin Hendricks, and I’m currently a Coterminal Master’s student at Stanford University studying Aeronautical and Astronautical Engineering and Music. I’m originally from De Pere, Wisconsin, just outside of Green Bay.\u003c/p\u003e\u003cp\u003eI became an engineer because I love to tinker, to dig into things, and find out how they really work. My focus has been on the hands-on design, building, and testing of everything from weather balloons to orbital rockets. I co-led the stability team for Stanford Student Space Initiative’s Spaceshot, teaching new members best practices for designing and building parts while making a balloon-based rocket launch platform. Growing up, I spent a lot of time in my grandfather’s shop, and the ideas he taught me about quality work and care for your craft stick with me to this day. I believe that the best way to learn is by doing, whether that be testing rockets and learning from the failures or playing a jazz solo and making every note work (even if they don’t seem like they will at first!)\u003c/p\u003e\u003cp\u003eI’ve always had a deep love for music, from jamming along to songs on the radio as a kid to working in a professional recording studio and everything in between. At Stanford, I’ve been part of a wide range of ensembles, including the Jazz Orchestra and the Wind Symphony. Additionally, I’ve been producing and recording music for myself and some of the campus’s many student bands. One part of that process I’ve found especially fulfilling has been showing new ways of music making and music listening to people. I’ve been lucky enough to be there with people for their first time in a recording studio, their first time writing music using a computer, or even their first time playing in an ensemble. Being able to help someone feel comfortable in these times and allowing them to express their artistic ability to the fullest has become my favorite part of the entire music-making process.\u003c/p\u003e\u003cp\u003eOutside of music and aerospace, my main hobbies are photography, hiking, and gaming, but I’m also well-known for picking up new hobbies frequently!\u003c/p\u003e\u003cp\u003eMentorship is extremely important to me, as I’ve had a number of mentors in my life who were vital to shaping the person I am today.\u0026nbsp; In my teaching, I aim to strike a balance between informative and fun, relating academic concepts to more relatable examples that show the real-world impact of the topics we’re learning. Learning is the goal, and from my experience, it’s much easier to learn when you look forward to it!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"v02N01X6clmGOAfVmpolK00pftL4YNoa4rIZA02YZJs2k2I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ca8a5a65-8bd3-4f1e-8f78-1f4f71608249\"}"},{"__ref":"Favorites:{\"uuid\":\"2f0ea098-21ac-4f15-8f5e-342ccfd6ae16\"}"},{"__ref":"Favorites:{\"uuid\":\"a7c4e764-f74f-4c81-a1b3-c2099d7c3cdd\"}"}],"causesSupported":[],"major":"Aeronautical and Astronautical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5a7530a4-323f-427b-b0f7-905ead83e630\"}"},{"__ref":"DeepDives:{\"uuid\":\"d34bea21-cc6c-4d20-b627-468d99e6d6cc\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a15a55b-4a20-4f18-9b93-166fa69635c2\"}"},{"__ref":"DeepDives:{\"uuid\":\"6c327fb0-c465-4961-89e4-4722c382df0f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e55cbc86-fa96-499e-aa09-ab6ef8233318/-/preview/-/format/jpg/","https://ucarecdn.com/538d2c56-976f-417d-afae-91046e53339b/-/preview/-/format/jpg/","https://ucarecdn.com/278a0e1e-80f5-45a0-9068-383e5a583b96/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d9bf5
