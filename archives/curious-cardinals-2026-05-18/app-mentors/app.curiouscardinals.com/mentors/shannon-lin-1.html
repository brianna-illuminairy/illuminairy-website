xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e322f355-0152-4611-a081-3dbccc91168e\"}":{"__typename":"Favorites","uuid":"e322f355-0152-4611-a081-3dbccc91168e","photoUrl":"https://ucarecdn.com/b1102b83-5bb1-4248-9a55-07db3c661b83/","title":"The Little Prince","type":"BOOK"},"Favorites:{\"uuid\":\"b0d5dc05-5ea9-4b76-a616-f515553c3939\"}":{"__typename":"Favorites","uuid":"b0d5dc05-5ea9-4b76-a616-f515553c3939","photoUrl":"https://ucarecdn.com/3df7b967-3930-4481-8afc-e7f6a5b85f86/","title":"Suni Lee","type":"ATHLETE"},"Favorites:{\"uuid\":\"55f62bd4-8a15-44a4-8879-c986df126b3b\"}":{"__typename":"Favorites","uuid":"55f62bd4-8a15-44a4-8879-c986df126b3b","photoUrl":"https://ucarecdn.com/6ef64c1d-14af-41e7-b023-222aaa83e6b2/","title":"Gracie Abrams","type":"ARTIST"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"94b97415-1034-4955-ae6f-69f9de63f195\"}":{"__typename":"DeepDives","uuid":"94b97415-1034-4955-ae6f-69f9de63f195","content":"\u003cp\u003eAs a high school student, I often found myself caught in a never ending cycle of schoolwork, swimming, eating, and sleeping. I struggled to balance my passions alongside my academic demands. That experience made me realize the importance of finding balance and managing priorities, which is why I'm so passionate about mentoring. I want to help others navigate similar challenges and discover how to pursue their interests without feeling overwhelmed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"42fa11c8-93d2-4c62-98af-9e8c0a04c837\"}":{"__typename":"DeepDives","uuid":"42fa11c8-93d2-4c62-98af-9e8c0a04c837","content":"\u003cp\u003eMy greatest source of motivation comes from envisioning a future where my innovations make a meaningful impact within the disability community. The thought of not only helping others but also challenging myself to push the boundaries of what’s possible fuels my passion and determination.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e4724ea3-7973-4544-a31e-64836ce24399\"}":{"__typename":"DeepDives","uuid":"e4724ea3-7973-4544-a31e-64836ce24399","content":"\u003cp\u003eI would tell my high school self that academic validation isn’t the only path to self-worth. I’d encourage myself to explore new passions, dive into experiences, and savor this rare period of life where I have the freedom to be curious and carefree. It's a time to enjoy, not just achieve.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"5136310c-aa5d-4191-88c3-69225b15fae3\"}":{"__typename":"DeepDives","uuid":"5136310c-aa5d-4191-88c3-69225b15fae3","content":"\u003cp\u003eIn my lifetime, I hope to inspire people to get more involved in shaping the world’s political landscape. Too many people feel disconnected from the decisions that affect them, and I want to show how powerful it can be when individuals take action, whether by voting, participating in discussions, or standing up for what they believe in. My goal is to encourage more people to engage with the issues that matter, so we can work together to build a fairer, more inclusive world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"98f0a56a-d1a9-4e1a-820a-5b452ec5615d\"}":{"__typename":"School","uuid":"98f0a56a-d1a9-4e1a-820a-5b452ec5615d","name":"Lake Travis High School","city":"Austin","type":"HIGH","state":"Texas","country":"United States","zip":"78738"},"Education:{\"uuid\":\"55795b15-bbb3-4e90-8c66-959c20f7ff16\"}":{"__typename":"Education","uuid":"55795b15-bbb3-4e90-8c66-959c20f7ff16","school":{"__ref":"School:{\"uuid\":\"98f0a56a-d1a9-4e1a-820a-5b452ec5615d\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"939c87d7-d6fd-4190-8bdd-f68b81dbdbd0\"}":{"__typename":"Education","uuid":"939c87d7-d6fd-4190-8bdd-f68b81dbdbd0","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Science","degree":null},"Testimonial:f6b21c2b-f660-4997-84ae-93d377b3c0f6":{"__typename":"Testimonial","id":"f6b21c2b-f660-4997-84ae-93d377b3c0f6","text":"Thank you so much! I hope to kept working with you!!","date":"2025-06-05 22:41:45.458+00","rating":5,"endorser":{"__typename":"Endorser","name":"Parisa Mosavat","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"f4a71a36-36fe-4509-9a24-7f8da56975dc\"}":{"__typename":"MentorPublicProfile","uuid":"f4a71a36-36fe-4509-9a24-7f8da56975dc","displayName":"Shannon L.","slug":"shannon-lin-1","biography":"\u003cp\u003eHi, I’m Shannon Lin, a sophomore at Cornell University majoring in Computer Science. If you know me, you probably know that I’m insanely food-motivated. I always feel a little sad when a meal ends, knowing I won’t get to taste something that magical again for a few hours. It’s like the world goes a bit dim until the next bite brings it back to life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor me, food is more than just eating; it’s a reason to explore. I love planning my next trip around what I want to try next, from street food stalls to hole-in-the-wall cafes that only locals know about. My goal is to visit three countries every year, and one day I’m going to backpack across Europe and Asia solo, meeting people, getting lost, and finding the best local spots along the way. Traveling reminds me how big the world is and how much there is to learn just by being curious.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not chasing the next great meal, I’m usually chasing ideas. I’m passionate about accessibility and about making technology work for everyone. On my Cornell project team, we focus on creating more inclusive everyday experiences. Right now, I'm trying to make the Nintendo Switch more accessible and also teach people how to code in braille. There’s something incredibly rewarding about taking a familiar object and reimagining it in a way that opens it up to more people.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat same passion for accessibility is what led me to work at a summer camp for people with disabilities. Every summer, I help campers experience the same kind of fun, freedom, and adventure that every kid deserves. It’s one of the most meaningful things I do. Watching someone light up while trying something new, something they might not have thought possible, reminds me why inclusion matters so much. Those experiences have shaped how I think about technology, design, and community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy biggest inspiration is probably my dog, Teddy. Interesting, I know. He’s a labradoodle with the attention span of a goldfish and the confidence of someone who’s never faced a single consequence. Teddy approaches life with this wild, unfiltered curiosity that I really admire. He’ll spend ten minutes trying to befriend a rock, chase down leaves like they owe him money, and somehow convince every delivery driver to scratch his head before leaving. Watching him reminds me how important it is to stay open to new experiences, to find joy in small things, and to never take yourself too seriously. I try to bring that same sense of wonder and freedom into everything I do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always believed that if something doesn’t exist and you want it, you should build it. That mindset led me to create a platform that helps people connect through music. I love building things that bring people together, whether it’s through code, creativity, or shared experiences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I bring that same energy to everything I do. I learn best by doing, and I help others learn that way too, through building, experimenting, and connecting ideas to the real world. Whether it’s coding, design, or problem-solving, I want the process to feel alive, collaborative, and full of curiosity.\u003c/p\u003e","teachingVideoPlaybackId":"1CNVv9W00aDhCiK0000TToW35G6BvzU4ZGg101eCQ7T4eA4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest accomplishment was conquering the Koko Head hike in Oahu, Hawaii. The trail is essentially a relentless climb of steep stairs, with one section so vertical it feels more like scaling a ladder. It took me nearly two hours to reach the summit, and despite wanting to quit more than once, the moment I finally reached the lookout was one of the proudest of my life. Pushing through the exhaustion made the view, and the achievement, so much more rewarding.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e322f355-0152-4611-a081-3dbccc91168e\"}"},{"__ref":"Favorites:{\"uuid\":\"b0d5dc05-5ea9-4b76-a616-f515553c3939\"}"},{"__ref":"Favorites:{\"uuid\":\"55f62bd4-8a15-44a4-8879-c986df126b3b\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"94b97415-1034-4955-ae6f-69f9de63f195\"}"},{"__ref":"DeepDives:{\"uuid\":\"42fa11c8-93d2-4c62-98af-9e8c0a04c837\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4724ea3-7973-4544-a31e-64836ce24399\"}"},{"__ref":"DeepDives:{\"uuid\":\"5136310c-aa5d-4191-88c3-69225b15fae3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/da8bf1d8-0ae4-433b-b83e-98abf32845f7/-/preview/-/format/jpg/","https://ucarecdn.com/40bff16f-d6cd-4c43-b4aa-3f5248966b00/-/preview/-/format/jpg/","https://ucarecdn.com/7834edee-ff3b-4708-bebd-e332db022725/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"55795b15-bbb3-4e90-8c66-959c20f7ff16\"}"},{"__ref":"Education:{\"uuid\":\"939c87d7-d6fd-4190-8bdd-f68b81dbdbd0\"}"}],"hiredAt":"2024-09-09T05:23:34.708Z","topics":[],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:f6b21c2b-f660-4997-84ae-93d377b3c0f6"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"shannon-lin-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f4a71a36-36fe-4509-9a24-7f8da56975dc\"}"}}},"_sentryTraceData":"35d9555fc1cb4e70918b0e0a0a7945cf-8e1217f61907d31b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=35d9555fc1cb4e70918b0e0a0a7945cf,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=fa
