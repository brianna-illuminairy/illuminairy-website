xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f42ec657-1948-43b3-a1f4-45da88ee8fef\"}":{"__typename":"Favorites","uuid":"f42ec657-1948-43b3-a1f4-45da88ee8fef","photoUrl":"https://ucarecdn.com/0e8e1817-ba1f-470a-b3f9-9c32d09413f7/","title":"James Spader","type":"ACTOR"},"Favorites:{\"uuid\":\"0d99a003-39e5-477e-96c0-96ac1221b7a9\"}":{"__typename":"Favorites","uuid":"0d99a003-39e5-477e-96c0-96ac1221b7a9","photoUrl":"https://ucarecdn.com/8452701c-41c9-4acd-8f7a-7ccbb9455603/","title":"Daniel Caesar","type":"ARTIST"},"Favorites:{\"uuid\":\"11b77264-20ee-490b-9c72-4dc4f791b4ff\"}":{"__typename":"Favorites","uuid":"11b77264-20ee-490b-9c72-4dc4f791b4ff","photoUrl":"https://ucarecdn.com/21ee60a5-6340-45c7-bcaa-cb1c83c3a0ab/","title":"Golf","type":"SPORT"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6bfcbd91-a088-471a-a7f1-c25ff1e80948\"}":{"__typename":"DeepDives","uuid":"6bfcbd91-a088-471a-a7f1-c25ff1e80948","content":"\u003cp\u003eMy dream job would be a professional golfer. Making money playing the sport I love would be my heaven on Earth. Golf is arguably the most addicting, satisfying sport created. If I could play it (successfully) making millions a year for the rest of my life I would do it in a heartbeat. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"0a74056a-69c1-49c1-9b0c-a545716fc8f2\"}":{"__typename":"DeepDives","uuid":"0a74056a-69c1-49c1-9b0c-a545716fc8f2","content":"\u003cp\u003eFamily is my greatest source of motivation. My dream in life is to be in a position where I can provide any family of mine, blood or not, an infinite amount of resource and love. Everything I do is with the intention of setting myself up so that I can provide for others in any form whether it be love, money, or laughter to my dog, brother, or wife.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"5a84b713-7ff9-4c97-af4f-d509045e189c\"}":{"__typename":"DeepDives","uuid":"5a84b713-7ff9-4c97-af4f-d509045e189c","content":"\u003cp\u003eMy greatest role model and mentor is my twin. He’s not just my brother; he’s my best friend and the person I look up to most. His drive, level-headedness, and support inspire me every single day. If I'm unsure of something, I ask myself \"what would Noah do?\" He's always been there for me and has taught me what it means to be a good sibling, son, and friend. Honorable mention to my girlfriend Kenna who I look up to every single day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"255140d7-287f-46f6-aed1-1429446a3978\"}":{"__typename":"DeepDives","uuid":"255140d7-287f-46f6-aed1-1429446a3978","content":"\u003cp\u003eI grew up following in my older brothers' footsteps, spending over 10 summers at a performing arts sleep-away camp called French Woods in the Catskills of New York. I started going at age 7 and spent 7-11 weeks there each summer, and it’s where I met some of my closest friends to this day. French Woods became my second home, and I looked forward to it every year from the first day of school. It will always hold a special place in my heart, shaping who I am today and bringing the most important people into my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"a37f34ca-7e2f-4641-9e1c-53a539098708\"}":{"__typename":"School","uuid":"a37f34ca-7e2f-4641-9e1c-53a539098708","name":"Oxbridge Academy","city":"West Palm Beach","type":"HIGH","state":"Florida","country":"United States","zip":"33409"},"Education:{\"uuid\":\"5f1ce026-6baa-420f-9ca0-9247b4756ab4\"}":{"__typename":"Education","uuid":"5f1ce026-6baa-420f-9ca0-9247b4756ab4","school":{"__ref":"School:{\"uuid\":\"a37f34ca-7e2f-4641-9e1c-53a539098708\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}":{"__typename":"School","uuid":"9a91466f-187b-4e9b-8a98-c02cef7bf621","name":"University of Michigan","city":"Ann Arbor","type":"COLLEGE","state":"Michigan","country":"United States","zip":"48109"},"Education:{\"uuid\":\"ec965adf-21de-4277-9f96-41ce3e5b5235\"}":{"__typename":"Education","uuid":"ec965adf-21de-4277-9f96-41ce3e5b5235","school":{"__ref":"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Business Administration","degree":null},"Testimonial:23da41a9-1625-4532-b2ab-1f259a9fc4ae":{"__typename":"Testimonial","id":"23da41a9-1625-4532-b2ab-1f259a9fc4ae","text":"I am thrilled to share my experience with Gabe, who has been an incredible tutor for my sons. Since they began working with Rogan, I have noticed a remarkable improvement in his understanding of subjects and their overall confidence. Gabe has a unique way of making complex topics relatable and engaging. My sons look forward to his sessions, which speaks volumes about his teaching style. He is not only knowledgeable but also patient and encouraging, creating a positive learning environment that motivates Rogan to strive for excellence. Beyond academics, Gabe has helped my sons develop important study skills and life skills that extend beyond the classroom. I am grateful for his dedication and the personalized approach he takes with Rogan.","date":"2025-08-25 20:49:48.115+00","rating":5,"endorser":{"__typename":"Endorser","name":"Kearstin Nuckles","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"976db286-e8da-4eaa-844a-ef17f752d848\"}":{"__typename":"MentorPublicProfile","uuid":"976db286-e8da-4eaa-844a-ef17f752d848","displayName":"Gabe P.","slug":"gabe-prissert","biography":"\u003cp\u003eHey, my name is Gabe and I am a business major with a focus on finance at the Ross School of Business at the University of Michigan! More specifically, I am working towards a career in wealth management and trading. Math has always come naturally to me, and I’m passionate about sharing that knowledge with others to help them feel the same confidence and understanding I have. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMore personally, I have a deep love for sports, especially golf. I’ve managed a scratch handicap and had the incredible opportunity to play golf with Tiger Woods' son, with Tiger himself watching us on Father's Day, a memory that I'll never forget. Watching sports of all kinds is something I love to do, as I enjoy the competition and the crazy moments that come out of every game.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbove all, family is everything to me. I want to set myself up in a way that allows me to set my family up forever. I also love spending time with my best friends, who mean the world to me. These relationships are what get me up and push me every day.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the end of the day, I love helping anyone who needs it. There's nothing better than seeing the smile on someone's face when things finally click for them.\u003c/p\u003e","teachingVideoPlaybackId":"86CsKHBh3yIhfBxx4w8eL9aG101I9hpN900KyKExQ8vMI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f42ec657-1948-43b3-a1f4-45da88ee8fef\"}"},{"__ref":"Favorites:{\"uuid\":\"0d99a003-39e5-477e-96c0-96ac1221b7a9\"}"},{"__ref":"Favorites:{\"uuid\":\"11b77264-20ee-490b-9c72-4dc4f791b4ff\"}"}],"causesSupported":[],"major":"Business Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6bfcbd91-a088-471a-a7f1-c25ff1e80948\"}"},{"__ref":"DeepDives:{\"uuid\":\"0a74056a-69c1-49c1-9b0c-a545716fc8f2\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a84b713-7ff9-4c97-af4f-d509045e189c\"}"},{"__ref":"DeepDives:{\"uuid\":\"255140d7-287f-46f6-aed1-1429446a3978\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/030df7f7-6e9e-4f7c-9274-46de9b2e0d93/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5f1ce026-6baa-420f-9ca0-9247b4756ab4\"}"},{"__ref":"Education:{\"uuid\":\"ec965adf-21de-4277-9f96-41ce3e5b5235\"}"}],"hiredAt":"2025-04-10T14:59:44.952Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Physics","6-8 Grade Science","Economics","College Essay Writing"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/bc931f8b-f00f-4064-8767-bece7541c20e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:23da41a9-1625-4532-b2ab-1f259a9fc4ae"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gabe-prissert\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"976db286-e8da-4eaa-844a-ef17f752d848\"}"}}},"_sentryTraceData":"5f8eead9d0fc44af85a5b8b8fe1d46d1-995383ab12839f17-0","
