xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ec6306ab-4c0c-4944-a745-4c264045f8c9\"}":{"__typename":"Favorites","uuid":"ec6306ab-4c0c-4944-a745-4c264045f8c9","photoUrl":"https://ucarecdn.com/9393c3ac-1f3d-47b5-8516-5624007709c7/","title":"The Three-Body Problem","type":"BOOK"},"Favorites:{\"uuid\":\"c78ae898-6a32-4b97-8b15-fad3f2a51c0f\"}":{"__typename":"Favorites","uuid":"c78ae898-6a32-4b97-8b15-fad3f2a51c0f","photoUrl":"https://ucarecdn.com/7abe0915-933a-452e-9d73-56295b99e1a6/","title":"Roger Federer","type":"ATHLETE"},"Favorites:{\"uuid\":\"a71d5ae6-d11d-487a-9bf6-ceabc33d9287\"}":{"__typename":"Favorites","uuid":"a71d5ae6-d11d-487a-9bf6-ceabc33d9287","photoUrl":"https://ucarecdn.com/52e64efb-69d9-4909-af14-bd5af707babc/","title":"Currents (Tame Impala)","type":"ALBUM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5c02abc8-00c0-4bf6-ab4e-eb2e58c59545\"}":{"__typename":"DeepDives","uuid":"5c02abc8-00c0-4bf6-ab4e-eb2e58c59545","content":"\u003cp\u003eHumans have limited time to make a difference, and I believe we shouldn't squander that time reinventing the wheel. The value of mentorship lies in shortening the path to meaningful achievement. If a student can master calculus in six weeks instead of six months, that saved time can be spent learning something new—or even pioneering an original idea.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, it’s deeply gratifying to see the moment when something “clicks” for a student. With each student, I feel I’m making a difference, however small. And if even one of them goes on to change the world, I’ll take pride in having helped them reach their early goals faster—giving them more time to focus on what truly matters.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"17c7cbfe-abcf-421a-a41a-9825e7272539\"}":{"__typename":"DeepDives","uuid":"17c7cbfe-abcf-421a-a41a-9825e7272539","content":"\u003cp\u003eThe impact that reading can have on a young mind cannot be understated. I'm confident that if I didn't read science fiction and fantasy early on, I wouldn't be the writer, the debater, the student, and—frankly—the person that I am today. Refining one's imagination has powerful spillover effects; for example, it's a lot easier to understand genetic transcription if you can imagine the RNA's movement along the DNA strand.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo what is my dream? To write a science fiction novel. I don't particularly care if it tops the NYT Bestsellers list. But it's my dream to give back to a genre that has given me so much. Somewhere in the world, if a little child learns to make words fly off the page, I'll be happy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"ab196493-194d-40d4-9b88-e3f97f3e66c0\"}":{"__typename":"DeepDives","uuid":"ab196493-194d-40d4-9b88-e3f97f3e66c0","content":"\u003cp\u003eThe average retirement age in the United States is 64 years old. When I graduate from Yale, I'll be newly 22 years old. When I consider that I'll be in the workforce for (at least) 42 years, I feel the need to split my career into stages. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eEarly on—for the first 15 years—I plan to work in finance. Finance is one of the only career paths where you get to grapple with \"big\" things: big companies, big transactions, big (metaphorically) people, and big consequences. I'm hopeful that starting my career in such an environment will allow me to become a judicious risk-taker.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLater—for the next 15 years—I hope to start my own company. The AI boom is certainly attractive, but I have conviction that the need for educational technology will never die out. Whether it's a new form of oral testing to mitigate AI usage or an implant to help with language acquisition, I dream of creating something that revolutionizes learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNear the end—perhaps until the day I die—I dream of teaching high school students. While I imagine the nature of education will change drastically in 40 years, I don't imagine that the need for teacher will ever go away. The old mind tends to become rigid, but by spending time with youth, I hope to remain flexible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eObviously, life is not guaranteed by any means. It's a luxury to even be thinking about the future, and I sincerely hope I get to live out my dreams.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a12d668e-5579-4b6c-bc60-cfa4e64518f4\"}":{"__typename":"DeepDives","uuid":"a12d668e-5579-4b6c-bc60-cfa4e64518f4","content":"\u003cp\u003eMy parents don't often talk about themselves. Only on special occasions—surrounded by the elders of my family—do they open up about their past struggles. So while driving to San Diego last December (a seven-hour journey from home), I was surprised to hear my dad begin telling stories about his immigration experience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs he spoke, I grew more and more impressed. Perhaps it's cliché, but clichés exist because they are often true: my dad came to America with just $20 in his pocket. He transferred graduate schools three times—and worked minimum-wage jobs in between—before finally securing funding for his education. At one of those jobs, he was held at gunpoint by masked teenagers on Halloween night. He took an hour-long bus to the University of Oklahoma each day because he couldn't afford on-campus housing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt first, I felt shame. Compared to my dad, my life has been extraordinarily privileged. I never wanted for food or shelter. Money never kept me from an experience I wished to have. Because I could focus solely on my education, I now attend one of the country's best universities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut over time, my perspective shifted. Today, I feel pride. Pride that in just one generation, my parents were able to turn everything around so dramatically. Every day, I am motivated by the example they set.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"507f17d3-bc05-4b5c-abd6-9ad110075be1\"}":{"__typename":"School","uuid":"507f17d3-bc05-4b5c-abd6-9ad110075be1","name":"Clovis North High School","city":"Fresno","type":"HIGH","state":"California","country":"United States","zip":"93730"},"Education:{\"uuid\":\"689317d4-cadc-4175-befe-92b4148ee982\"}":{"__typename":"Education","uuid":"689317d4-cadc-4175-befe-92b4148ee982","school":{"__ref":"School:{\"uuid\":\"507f17d3-bc05-4b5c-abd6-9ad110075be1\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"82686fc8-a3d3-4f93-b4e6-663f9f2b43eb\"}":{"__typename":"Education","uuid":"82686fc8-a3d3-4f93-b4e6-663f9f2b43eb","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"083f283b-aa85-437f-a14e-6e5cafcb2d73\"}":{"__typename":"MentorPublicProfile","uuid":"083f283b-aa85-437f-a14e-6e5cafcb2d73","displayName":"Dhruv J.","slug":"dhruv-javangula","biography":"\u003cp\u003eHi! My name is Dhruv, and I'm a sophomore at Yale University originally from Central California.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, I loved reading Harry Potter, Percy Jackson, and the Hunger Games. This early love for fiction translated pretty readily into a passion for history. Why? History, to me, is a window into societies and cultures so old they seem almost fictional. While I'm broadly interested in world history, I especially enjoy studying under-appreciated periods—such as the European Middle Ages and the Late Antique Roman Empire.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond the classroom, I'm involved in various groups on campus. Debate has always been a major part of my life; I was a nationally-ranked debater in high school and now compete for the Yale Debate Association. More recently, I've developed an interest in finance and business. I'm a member of two investment clubs at Yale and will be interning in investment banking next summer. On a more community-focused note, I also work as an event planner for my residential college. The highlight of my fall semester was running a weekly food event called \"Fiesta Friday.\" You'd be surprised how easily conversations start when free food is up for grabs!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love reading science fiction (Three Body Problem is a favorite), playing tennis (and its evil cousin, pickleball), listening to Hans Zimmer soundtracks (especially Cornfield Chase), and trail-running whenever I get the chance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I was younger, people told me I had to narrow down my interests. I didn't agree. I left high school as a prospective computer science and neuroscience double major. Now, I study the humanities and will likely never touch a coding terminal again. Having multi-varied interests—as I see it—is the only way to discover what you truly love. Whether it's history, biotechnology, ancient philosophy, or something else entirely, I want to help students discover the path they were meant to walk.\u003c/p\u003e","teachingVideoPlaybackId":"8l4vm1CLTJMy9PnXX6cxa5ZN9a02ZizKRShT8y00uOShk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ec6306ab-4c0c-4944-a745-4c264045f8c9\"}"},{"__ref":"Favorites:{\"uuid\":\"c78ae898-6a32-4b97-8b15-fad3f2a51c0f\"}"},{"__ref":"Favorites:{\"uuid\":\"a71d5ae6-d11d-487a-9bf6-ceabc33d9287\"}"}],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5c02abc8-00c0-4bf6-ab4e-eb2e58c59545\"}"},{"__ref":"DeepDives:{\"uuid\":\"17c7cbfe-abcf-421a-a41a-9825e7272539\"}"},{"__ref":"DeepDives:{\"uuid\":\"ab196493-194d-40d4-9b88-e3f97f3e66c0\"}"},{"__ref":"DeepDives:{\"uuid\":\"a12d668e-5579-4b6c-bc60-cfa4e64518f4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cfccb677-ff1d-4a29-aa97-b643553e1ae8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"689317d4-cadc-4175-befe-92b4148ee982\"}"},{"__ref":"Education:{\"uuid\":\"82686fc8-a3d3-4f93-b4e6-663f9f2b43eb\"}"}],"hiredAt":"2025-04-22T10:13:24.292Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statis
