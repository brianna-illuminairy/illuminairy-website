reene","biography":"\u003cp\u003e\u003cstrong\u003eViolet is an incoming MBA student at London Business School.\u003c/strong\u003e \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOriginally from Los Angeles, she graduated from Duke University with a degree in Public Policy. While at Duke, she conducted research on juvenile justice reform in North Carolina and ran \u003cem\u003eGoBringIt\u003c/em\u003e, a food delivery startup that connected students with local restaurants. Her experiences reflect a long-standing passion for business, policy, and the systems that shape how society works.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduation, Violet joined McKinsey \u0026amp; Company, where she worked on projects ranging from scaling clean tech across Europe to driving public-sector transformation in Sweden. Living in Stockholm deepened her interest in how institutions, both public and private, influence behavior and outcomes. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Curious Cardinals, Violet looks to help students explore big-picture questions surrounding policy, innovation, and social change through writing, storytelling, and entrepreneurial thinking. Outside of work, she’s often baking sourdough, taking dance classes, or ranking breakfast burritos by city (spoiler: LA takes the crown).\u003c/p\u003e","teachingVideoPlaybackId":"Svl9QxHhgbw8wZW5D1w3LahJ77dDxBO00p5IhEy3rqpI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"71606e09-11ac-4c68-8330-62fc0e8e7598\"}"},{"__ref":"Favorites:{\"uuid\":\"96527f40-edd1-44d3-bf5e-c6ebc76cf4a0\"}"}],"causesSupported":[],"major":"Public Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c0e55a49-780b-4717-aa54-6822c6e7785c\"}"},{"__ref":"DeepDives:{\"uuid\":\"6dc40e43-1825-46be-ad8a-817a7d87b24c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/46eb6d28-ba92-4577-b06d-ca25dc817c9f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":
