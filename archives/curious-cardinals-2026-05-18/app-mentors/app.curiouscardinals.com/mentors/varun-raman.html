xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4a8dda50-5d2d-4ed2-8ad8-e4c2e1bf8c8d\"}":{"__typename":"DeepDives","uuid":"4a8dda50-5d2d-4ed2-8ad8-e4c2e1bf8c8d","content":"\u003cp\u003eI love staying active and curious in my spare time. A lot of that time goes to playing soccer, spending time with friends and family, and getting outside through hiking and traveling. I also really enjoy doing deep dives into complex topics for fun, whether that’s neuroscience, business strategy, or some random question I suddenly decide I need to understand fully. On the more relaxed side, I’m also a big fan of video games, which I think is one of the many ways I stay connected to the kinds of interests a lot of students have, too. I’d say I’m someone who likes a good mix of energy, curiosity, and fun\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4f7b2eb3-4692-46d8-aaaa-c94e1a4529d9\"}":{"__typename":"DeepDives","uuid":"4f7b2eb3-4692-46d8-aaaa-c94e1a4529d9","content":"\u003cp\u003eOne passion project that’s been really meaningful to me was my research on Alzheimer’s disease at the University of Arizona. My interest in neurodegeneration actually started during my time volunteering at Hospice of the Valley, where I saw firsthand how diseases like Alzheimer’s affect not just patients, but entire families. That experience made me want to better understand what was happening at a biological level.\u003c/p\u003e\u003cp\u003eThrough my research, I explored protein synthesis pathways related to neurodegenerative diseases, using computational approaches to analyze how disruptions at the molecular level can contribute to disease progression. It was my first real exposure to independent scientific inquiry, where I learned how to ask meaningful questions, work through ambiguity, and communicate complex ideas clearly.\u003c/p\u003e\u003cp\u003eWhat I found most rewarding wasn’t just the research itself, but the process of turning curiosity into something tangible, and that’s something I love helping students do in their own projects.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c885f103-02ea-4630-bf2b-c2ebd624c1c0\"}":{"__typename":"DeepDives","uuid":"c885f103-02ea-4630-bf2b-c2ebd624c1c0","content":"\u003cp\u003eMentorship matters to me because it’s a way to give back while helping students discover who they are and what excites them. I’ve been in that position before,  having interests, but not always knowing how to explore them or feel confident in my abilities. The right guidance can completely change that.\u003c/p\u003e\u003cp\u003eFor me, mentorship is about helping students build curiosity, confidence, and a sense of direction. It’s not just about improving grades or finishing a project, but helping someone realize \u003cem\u003e“I can actually do this”\u003c/em\u003e and take ownership of their learning.\u003c/p\u003e\u003cp\u003eBeing able to play even a small role in that process is incredibly meaningful to me\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"bbead84f-dbdb-4b4c-9c5c-3469bdc3aa95\"}":{"__typename":"DeepDives","uuid":"bbead84f-dbdb-4b4c-9c5c-3469bdc3aa95","content":"\u003cp\u003eI tried to make my summers a balance of exploration, growth, and fun. On one end, I spent time doing research on genome sequencing, which gave me my first exposure to scientific inquiry and sparked my interest in biology and medicine.\u003c/p\u003e\u003cp\u003eAt the same time, I was heavily involved in competitive soccer, traveling across the U.S. for regional tournaments where I learned a lot about teamwork and performing under pressure.\u003c/p\u003e\u003cp\u003eI also had the opportunity to travel internationally to places such as Australia, Hawaii, France, and Ireland, which broadened my perspective and deepened my curiosity about the world.\u003c/p\u003e\u003cp\u003eAnd of course, a big part of my summers was just spending time with friends, which I think is just as important. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, my summers were about trying new things, staying active, and following whatever I was most curious about at the time, something I always encourage students to do as well.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"82f2764d-9728-44d6-ae95-68279f9766ad\"}":{"__typename":"School","uuid":"82f2764d-9728-44d6-ae95-68279f9766ad","name":"Hamilton High School","city":"Chandler","type":"HIGH","state":"Arizona","country":"United States","zip":"85248"},"Education:{\"uuid\":\"c5f5c1ab-4557-4e7e-aba3-43f6c83b82eb\"}":{"__typename":"Education","uuid":"c5f5c1ab-4557-4e7e-aba3-43f6c83b82eb","school":{"__ref":"School:{\"uuid\":\"82f2764d-9728-44d6-ae95-68279f9766ad\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"06ec35a3-2ef2-4650-895b-6c03d782693d\"}":{"__typename":"Education","uuid":"06ec35a3-2ef2-4650-895b-6c03d782693d","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Biological Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"5ae962cb-395b-48bb-b764-dc9f049aa4c8\"}":{"__typename":"MentorPublicProfile","uuid":"5ae962cb-395b-48bb-b764-dc9f049aa4c8","displayName":"Varun R.","slug":"varun-raman","biography":"\u003cp\u003eHi! I’m Varun, a student at Cornell University studying\u003cstrong\u003e \u003c/strong\u003eBiological Engineering with minors in Data Science and Applied Economics, and I love helping students build confidence and clarity in their academic journey.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve always been deeply interested in understanding how things work, whether that’s biological systems, data, or real-world problems. At Cornell, I’ve explored this through:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eStudying biology, chemistry, math, and data science at a rigorous level\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConducting computational biology research on protein synthesis pathways related to neurodegenerative diseases\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorking in a molecular medicine lab, studying stem cells and regeneration\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eApplying analytical thinking in a private equity internship focused on healthcare companies\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences have strengthened not just my subject knowledge, but also my ability to break down complex concepts into clear and intuitive ideas, which is something I bring into every session.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI primarily mentor students in academic subjects and skill-building, including:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBiology \u0026amp; Chemistry (middle school through high school, including intro college-level concepts)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMath \u0026amp; problem-solving (algebra, statistics, and structured quantitative thinking)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStudy strategies \u0026amp; executive functioning\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTime management\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down difficult assignments\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePreparing for exams effectively\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI especially enjoy working with students who want to move beyond memorization and truly understand the “why” behind what they’re learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m excited to work with you\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI know that school can sometimes feel overwhelming, not because the material is impossible, but because it isn’t always explained in a way that \u003cem\u003eclicks\u003c/em\u003e. My goal is to make that “click” happen.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking down a confusing concept step-by-step until it feels intuitive\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWalking through practice problems and explaining the thought process, not just the answer\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelping you develop repeatable strategies for tackling new problems independently\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating structured study plans so you feel prepared (not stressed) before exams\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI focus on building both confidence and independence, so over time you rely less on help and more on your own understanding.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch3\u003e\u003cstrong\u003eMy experience working with students\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve worked extensively with students in both academic and mentorship settings, including:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCoaching 50+ neurodivergent athletes through TOPSoccer, where I learned how to adapt my communication style to different learning needs\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching members of a genetics nonprofit how to navigate biological databases and understand complex scientific concepts\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences have shaped my approach: patient, structured, and tailored to how \u003cem\u003eyou\u003c/em\u003e learn best.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch3\u003e\u003cstrong\u003eOutside of academics\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI enjoy:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePlaying and coaching soccer ⚽\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSpending time outdoors, from difficult hikes to cliff jumping\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWatching sports and hanging out with freinds\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e\u003cp\u003eIf you’re looking for someone who will not only help you improve your grades, but also actually understand and feel confident in what you’re learning, I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"OZtgZXdf8WXgN3BRyTa800nJGK33V7gTQ28ir002IaasE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biological Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4a8dda50-5d2d-4ed2-8ad8-e4c2e1bf8c8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"4f7b2eb3-4692-46d8-aaaa-c94e1a4529d9\"}"},{"__ref":"DeepDives:{\"uuid\":\"c885f103-02ea-4630-bf2b-c2ebd624c1c0\"}"},{"__ref":"DeepDives:{\"uuid\":\"bbead84f-dbdb-4b4c-9c5c-3469bdc3aa95\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9cdd459a-34e5-45c1-a042-5404cd610ab7/-/preview/-/format/jpg/","https://ucarecdn.com/6f54fc06-a437-470f-8f52-db3b03e3da0c/-/preview/-/format/jpg/","https://ucarecdn.com/7a9826f5-4b8b-4d40-ba28-ba66a132c055/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c5f5c1ab-4557-4e7e-aba3-43f6c83b82eb\"}"},{"__ref":"Education:{\"uuid\":\"06ec35a3-2ef2-4650-895b-6c03d782693d\"}"}],"hiredAt":"2026-04-02T21:46:26.394Z","topics":["K-
