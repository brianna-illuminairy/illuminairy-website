xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7453d51c-7ea0-4a14-92f5-961066657888\"}":{"__typename":"Favorites","uuid":"7453d51c-7ea0-4a14-92f5-961066657888","photoUrl":"https://ucarecdn.com/83b844dc-cd29-47ae-8975-eeb99ea67637/","title":"Dead Aid: Why Aid Is Not Working and How There Is a Better Way for Africa","type":"BOOK"},"Favorites:{\"uuid\":\"2f97187e-e1ba-4722-9ec2-cb480b60cc9b\"}":{"__typename":"Favorites","uuid":"2f97187e-e1ba-4722-9ec2-cb480b60cc9b","photoUrl":"https://ucarecdn.com/4bf4a241-32aa-44ed-8cf5-b5240985097b/","title":"Volleyball","type":"SPORT"},"Favorites:{\"uuid\":\"44043304-a3a4-40a3-ad9d-546cc9c67057\"}":{"__typename":"Favorites","uuid":"44043304-a3a4-40a3-ad9d-546cc9c67057","photoUrl":"https://ucarecdn.com/09437744-1cd2-4f01-8807-a8c2a29b1d7e/","title":"Hacksaw Ridge","type":"MOVIE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"42b33bad-eb7d-43f5-bc92-59375210bc7c\"}":{"__typename":"DeepDives","uuid":"42b33bad-eb7d-43f5-bc92-59375210bc7c","content":"\u003cp\u003eAttorney (eventually owning my own firm/nonprofit)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a21da068-97cf-453e-ba66-cfd36349ab94\"}":{"__typename":"DeepDives","uuid":"a21da068-97cf-453e-ba66-cfd36349ab94","content":"\u003cp\u003eI would tell my high school self that being diligent and focused all four years is worth the sacrifice for your future. Stay the course, it will and does pay off.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"695fd259-045e-4cd2-9de7-91c6241dfee6\"}":{"__typename":"DeepDives","uuid":"695fd259-045e-4cd2-9de7-91c6241dfee6","content":"\u003cp\u003eComing from a traditional Nigerian household, education has always been of the utmost importance. I understand the value of knowledge in opening doors, creating new realities, and exposing people to a myriad of things and experiences. My teaching style is built on this belief, and I am very intentional about investing time and supporting my mentee in their aspirations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"5263e901-e6bd-4a00-97c7-bcfcb898dd35\"}":{"__typename":"School","uuid":"5263e901-e6bd-4a00-97c7-bcfcb898dd35","name":"Noble and Greenough School","city":"Dedham","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02026"},"Education:{\"uuid\":\"c5eca0e8-ecf8-466b-99e2-3553fc502e8d\"}":{"__typename":"Education","uuid":"c5eca0e8-ecf8-466b-99e2-3553fc502e8d","school":{"__ref":"School:{\"uuid\":\"5263e901-e6bd-4a00-97c7-bcfcb898dd35\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"39d31ddb-47fd-40b4-915d-1f32f46de1a1\"}":{"__typename":"Education","uuid":"39d31ddb-47fd-40b4-915d-1f32f46de1a1","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"International and Public Affairs ","degree":null},"MentorPublicProfile:{\"uuid\":\"a9b82ba5-2d96-4807-8183-c4a015e563e3\"}":{"__typename":"MentorPublicProfile","uuid":"a9b82ba5-2d96-4807-8183-c4a015e563e3","displayName":"Temitope A.","slug":"tope-adetunji","biography":"\u003cp\u003eHi, I’m Temitope (tay-me-tuh-peh), but you can call me Tope if it is easier for you! I am a senior at Brown University studying International and Public Affairs with a focus on policy and governance. I am also on the pre-law track and hope to go to law school within the next two years after graduation. I am from Boston, MA, by way of Lagos, Nigeria, and a dual citizen!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I founded my school’s first Black Student Union since its founding in 1866. I also served as 1 of 16 students in the senior class as a prefect (student advisor) to the head of school. These experiences marked my high school years and sparked my interest in social justice and advocacy. I graduated with high honors, the school’s record for highest female vertical jump (varsity volleyball player), and an award for student impact. My college admissions essay, entitled “\u003cu\u003eSight\u003c/u\u003e,” was published in \u003cem\u003eFilament: The Journal of Teen Writing at Zinc \u003c/em\u003eand received an honourable mention.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, I have been fortunate enough to take advantage of Brown University’s open curriculum and take a vast array of courses that have deepened my interests in public policy, economic development, ethics, law, and politics. On campus, I have written for the society section of a school paper called the Black Star Journal, served as the Political Action and Community Outreach Coordinator for the African Students Association, and co-led the International and Public Affairs Departmental Undergraduate Group (IAPA DUG). I have also been a research assistant to a professor on campus, investigating electoral integrity in African countries.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have had internship experiences all four years of college across the government, public, and private spheres. My freshman summer, I interned for the Massachusetts State Treasurer in the Office of Economic Employment, which was the first of its kind in the nation The following two summers, I interned for Bloomberg: The summer after sophomore year I interned for Bloomberg Philanthropies (philanthropic foundation) as a Government Innovation Intern, and the summer after junior year I interned at Bloomberg L.P. (corporate entity) as a communications intern for their Corporate Philanthropy team, expanding on my content creation hobby.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus I have coordinated a mentorship program within the IAPA DUG for the past two years, pairing underclassmen within the major with upperclassmen in order to help them navigate all aspects of the major. I have been a mentor myself, and also serve as an informal mentor for any students at Brown interested in pursuing the pre-law track. I have also been a panelist on multiple career and academic panels and taught a college seminar class. Students and parents can feel confident that I bring both academic rigor and coaching experience to every session.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eHow I can help you:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e7th-12th grade:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCollege-readiness projects and college applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePassion projects (starting a club/non-profit, social media content creation [websites, blogs, social media, podcasts], and more!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSocial sciences and humanities subject guidance (political science, english, public policy, international and public affairs, education, history, government/law)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOverall time management, focus, and organization strategies\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love to watch a good Netflix show, weightlift, explore fashion trends, make content, spend time with friends and family, and try new restaurants!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re excited to explore your interests, try ambitious projects, and grow your confidence, I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"ZugQEoSlrD92qXepvXphHwfhJ6H5mAIfgMb2dVo3gCM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7453d51c-7ea0-4a14-92f5-961066657888\"}"},{"__ref":"Favorites:{\"uuid\":\"2f97187e-e1ba-4722-9ec2-cb480b60cc9b\"}"},{"__ref":"Favorites:{\"uuid\":\"44043304-a3a4-40a3-ad9d-546cc9c67057\"}"}],"causesSupported":[],"major":"International and Public Affairs ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"42b33bad-eb7d-43f5-bc92-59375210bc7c\"}"},{"__ref":"DeepDives:{\"uuid\":\"a21da068-97cf-453e-ba66-cfd36349ab94\"}"},{"__ref":"DeepDives:{\"uuid\":\"695fd259-045e-4cd2-9de7-91c6241dfee6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/eeb69522-ddb9-4b5b-8f30-79f75766713d/-/preview/-/format/jpg/","https://ucarecdn.com/b640f1d5-dbd9-44a8-aafc-3af5b3245b5f/-/preview/-/format/jpg/","https://ucarecdn.com/65fb9909-2849-4947-817d-de13f1e29dd7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMA
