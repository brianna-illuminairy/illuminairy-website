xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c5810454-cca0-4119-abc2-4201c1fe27a7\"}":{"__typename":"Favorites","uuid":"c5810454-cca0-4119-abc2-4201c1fe27a7","photoUrl":"https://ucarecdn.com/8f617ef8-4775-4fe4-bc39-025ff6e1fcb7/","title":"Boston","type":"CITY"},"Favorites:{\"uuid\":\"f70e2ff9-a734-438a-97e6-d8d28ec706e4\"}":{"__typename":"Favorites","uuid":"f70e2ff9-a734-438a-97e6-d8d28ec706e4","photoUrl":"https://ucarecdn.com/a5d6dcce-343d-494e-a299-0411602cde3d/","title":"Catan (or just any card game)","type":"GAME"},"Favorites:{\"uuid\":\"7e7e2388-5ce7-4c92-95f6-c4079c710a83\"}":{"__typename":"Favorites","uuid":"7e7e2388-5ce7-4c92-95f6-c4079c710a83","photoUrl":"https://ucarecdn.com/f320dcf5-ba2c-4c8c-b8b4-39b996b29182/","title":"Pinegrove","type":"ARTIST"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7fafe9bd-7f24-4904-b300-048dcf7d0c9a\"}":{"__typename":"DeepDives","uuid":"7fafe9bd-7f24-4904-b300-048dcf7d0c9a","content":"\u003cp\u003eI chose my major because I want to improve human health, but I’m most excited by \u003cem\u003ehow\u003c/em\u003e we get there—through designing and testing new technologies, not just studying existing ones. I’m naturally drawn to creative problem-solving and iterative design, so engineering felt like the best fit. Biomedical engineering brings together my interest in medicine with the tools to build practical solutions to real clinical problems. Long-term, I’m especially interested in targeted drug and RNA delivery and how better delivery systems could transform treatments for cardiovascular disease.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"268988d9-053a-44c6-acc8-7231c24f5070\"}":{"__typename":"DeepDives","uuid":"268988d9-053a-44c6-acc8-7231c24f5070","content":"\u003cp\u003eI would tell my middle or high school self to take more risks and ask more questions. When I was younger, I was nervous about being “bad” at something, so I stayed in my comfort zone more than I needed to. Now, some of my favorite college memories have come from trying things I’d never done before—like joining a dance group with zero dance experience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d also remind myself that there are no “dumb” questions. I’ve learned that opportunities usually aren’t just handed to you—you have to ask for them. And some of the most meaningful insights I’ve gained haven’t come from lectures, but from asking honest, creative questions and following my curiosity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"70bffd7e-8d4f-42ca-9cc2-e9b10e760653\"}":{"__typename":"DeepDives","uuid":"70bffd7e-8d4f-42ca-9cc2-e9b10e760653","content":"\u003cp\u003eMy dream job is to lead a research team at a biotech company developing new strategies to treat disease. I want to create therapies that meaningfully improve the patient experience, and to help make sure those innovations are accessible to the people who need them. I’m excited by translational work: investigating revolutionary science, generating rigorous data, and moving discoveries toward real-world impact. I would also love to serve as a connector between scientists, physicians, and company goals. I think my strengths as both a communicator and a scientist would let me thrive at the intersection of the lab, the clinic, and the business.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"36a04600-19fc-43bb-96fd-5886ba0c5ce3\"}":{"__typename":"DeepDives","uuid":"36a04600-19fc-43bb-96fd-5886ba0c5ce3","content":"\u003cp\u003eIn middle school, I was very quiet and shy. I was a strong student who genuinely enjoyed completing my schoolwork, and that’s when my love of learning really started to take shape.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I became more focused on science, especially chemistry and biology, though I still didn’t fully understand what careers or paths could grow out of those interests. I also gained a lot more confidence: I stepped into leadership roles on my sports teams and joined a jazz band as a saxophonist. Overall, I was pretty well-rounded, excited by a wide range of activities, and increasingly curious and self-assured—while still figuring out what I wanted my future to look like.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"adbd8837-fb02-4c52-8685-8c51b271d97d\"}":{"__typename":"School","uuid":"adbd8837-fb02-4c52-8685-8c51b271d97d","name":"The Rivers School","city":"Weston","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02493"},"Education:{\"uuid\":\"e534525f-cffd-4e4e-8122-2a8e525eb61a\"}":{"__typename":"Education","uuid":"e534525f-cffd-4e4e-8122-2a8e525eb61a","school":{"__ref":"School:{\"uuid\":\"adbd8837-fb02-4c52-8685-8c51b271d97d\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"5c2636bc-6757-4ea7-9832-aaac60d36c91\"}":{"__typename":"Education","uuid":"5c2636bc-6757-4ea7-9832-aaac60d36c91","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"85657a46-384d-4811-9ff0-20e2bf58fbb7\"}":{"__typename":"MentorPublicProfile","uuid":"85657a46-384d-4811-9ff0-20e2bf58fbb7","displayName":"Abby M.","slug":"abby-matsuyasu","biography":"\u003cp\u003eHi! I’m Abby—a Biomedical Engineering student at Yale and a hands-on research mentor who helps students turn broad science questions into projects they can dive deeply into and feel confident presenting about.\u003c/p\u003e\u003ch2\u003e\u003c/h2\u003e\u003cp\u003eI’m currently pursuing a B.S. in Biomedical Engineering and I spend a lot of my time in research labs focused on cardiac disease and drug delivery mechanisms. I plan to continue research after I graduate Yale on a PhD pathway.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy work has included:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCardiac muscle disease modeling\u003c/strong\u003e,\u003cstrong\u003e \u003c/strong\u003eusing iPSC-derived cardiomyocytes and engineered heart tissue (EHT) systems.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eGene editing + experimental design\u003c/strong\u003e, including CRISPR/Cas9 projects and building/characterizing mutant cell lines.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDrug/gene delivery work\u003c/strong\u003e, including formulating and testing polymer-based (PACE) nanoparticle/mRNA polyplex delivery systems.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFellowship applications and written proposals that highlight my experience as a scientific writer and communicator. I have also presented my work to various academic audiences.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003eI love mentoring students who are curious about:\u003c/h2\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBiomedical sciences \u0026amp; human physiology\u003c/strong\u003e (heart, disease, genetics, biotech, etc)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch project design\u003c/strong\u003e (how to form a strong question, pick methods, and make a realistic plan)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eData \u0026amp; scientific storytelling\u003c/strong\u003e (how to analyze results and communicate clearly in a paper, poster, or presentation)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003eHow I mentor:\u003c/h2\u003e\u003cp\u003eMy style is structured, supportive, and practical—especially for students who don’t know where to start. In sessions, we might:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTurn an interest like “heart disease” into a \u003cstrong\u003especific, testable project idea\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuild a \u003cstrong\u003estep-by-step roadmap\u003c/strong\u003e with milestones and check-ins\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePractice \u003cstrong\u003epresenting like a scientist\u003c/strong\u003e—from explaining the “why” to defending conclusions with evidence\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003eBeyond the lab:\u003c/h2\u003e\u003cp\u003eI’m also deeply involved in STEM leadership and education. I co-lead Yale’s Society of Women Engineers and a STEM outreach group that brings interactive science lessons to New Haven elementary classrooms, and I’m a STEM tour guide with Yale Admissions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also love to be outside in any way. My favorite activities include running (I'm currently training for a half-marathon), hiking (I took myself on a solo hiking trip to the Dolomites in Italy), and exploring new places. I love to travel and try all different kinds of new foods. I also play the alto saxophone and love music - my taste has super wide range (I love jazz and folk and R\u0026amp;B and classic rock). I am from the Greater Boston area and nothing hypes me up more than Boston sports. I could talk for hours about the Pats and Drake Maye. I grew up playing field hockey, ice hockey, and softball so I am also interested in working with students interested in sports. Actually, my cardiac research is relevant to exercise, especially to endurance athletes!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also a big planner, so I am super excited to help students out with executive planning and organizational skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re excited about science and want guidance turning your curiosity into a clear, compelling project—I'd love to work with you! :)\u003c/p\u003e","teachingVideoPlaybackId":"D48ZTOxf00rx9sr6H3AhG9vCP6jYg6Op82ArzRK3sVfw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c5810454-cca0-4119-abc2-4201c1fe27a7\"}"},{"__ref":"Favorites:{\"uuid\":\"f70e2ff9-a734-438a-97e6-d8d28ec706e4\"}"},{"__ref":"Favorites:{\"uuid\":\"7e7e2388-5ce7-4c92-95f6-c4079c710a83\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7fafe9bd-7f24-4904-b300-048dcf7d0c9a\"}"},{"__ref":"DeepDives:{\"uuid\":\"268988d9-053a-44c6-acc8-7231c24f5070\"}"},{"__ref":"DeepDives:{\"uuid\":\"70bffd7e-8d4f-42ca-9cc2-e9b10e760653\"}"},{"__ref":"DeepDives:{\"uuid\":\"36a04600-19fc-43bb-96fd-5886ba0c5ce3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e60f8618-edf5-4a16-bf71-6f87228b89ef/-/preview/-/format/jpg/","https://ucarecdn.com/3d7c57c1-ebd2-4cd1-a6b8-98ea48d5da0d/-/preview/-/format/jpg/","https://ucarecdn.com/78581c0e-16cc-43f5-a0d3-934e93bc70b3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e534525f-cffd-4e4e-8122-2a8e525eb61a\"}"},{"__ref":"Education:{\"uuid\":\"5c2636bc-6757-4ea7-9832-aaac60d36c91\"}"}],"hiredAt":"2026-01-28T16:40:09.431Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Physics","Writing","American Sign Language","Academic Coaching","Executive Function","College Essay Writing","Music","Fashion / Cosmetics","Sports Journalism","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"abby-matsuyasu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"85657a46-384d-4811-9ff0-20e2bf58fbb7\"}"}}},"_sentryTraceData":"97f82763affd4d5596e7811db495ac8c-83adee3885381218-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=97f82763affd4d5596e7811db495ac8c,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"
