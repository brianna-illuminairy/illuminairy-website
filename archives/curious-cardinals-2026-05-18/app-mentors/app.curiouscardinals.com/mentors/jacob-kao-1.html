xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"220ea5c1-8901-46d6-9c52-b1069b435f6b\"}":{"__typename":"DeepDives","uuid":"220ea5c1-8901-46d6-9c52-b1069b435f6b","content":"\u003cp\u003eTwo weeks ago—one week before Halloween—I decided that I wanted to throw a murder mystery party. This was to be no ordinary party. I would write every plotpoint, every character, ever idiosyncracy myself. It was to be an exercise in writing with the highest of stakes: already 25 of my friends had RSVP'd, each expecting some funny well-thought out character to experience some twisting, dark, and complex mystery. \u003c/p\u003e\u003cp\u003eWith a looming deadline, I got to work. 4 hours a day for a week. Character dossiers and major plotpoints. Pieces of evidence and major discoveries. Though creativity can't be forced, it can certainly be helped along with the promise that failures means a boring party. \u003c/p\u003e\u003cp\u003eBy the end of the week, I had everything together. A plot that centered around memory and changed identity; a cast of suspicious and quirky characters; name tags, and speeches; costumes and snacks. \u003c/p\u003e\u003cp\u003eI bring this up not to brag about what was truly a spectacular murder mystery party. No—I bring it up to demonstrate the various ways that one can pursue a passion project, even when that project is outside of the academic or professional realm. I care about bringing ideas into fruition; it's something I do in my own life and would love to make happen in yours.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"0c4e6d15-f842-4136-bf01-b2943b897d50\"}":{"__typename":"School","uuid":"0c4e6d15-f842-4136-bf01-b2943b897d50","name":"Acton Boxborough Regional High School","city":"Acton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01720"},"Education:{\"uuid\":\"7ffaaa36-443e-4356-ab42-c39b386459b6\"}":{"__typename":"Education","uuid":"7ffaaa36-443e-4356-ab42-c39b386459b6","school":{"__ref":"School:{\"uuid\":\"0c4e6d15-f842-4136-bf01-b2943b897d50\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"13c6bd5e-5419-4654-b9d0-66a7d91b1e79\"}":{"__typename":"Education","uuid":"13c6bd5e-5419-4654-b9d0-66a7d91b1e79","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Philosophy, Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"a6d7f4a3-d4c8-4c30-b547-2c106b91fd56\"}":{"__typename":"MentorPublicProfile","uuid":"a6d7f4a3-d4c8-4c30-b547-2c106b91fd56","displayName":"Jacob K.","slug":"jacob-kao-1","biography":"\u003cp\u003eOptimistic; curious; friendly. If forced to boil myself down to to three adjectives, these are the three that would float to the surface. \u003c/p\u003e\u003cp\u003eCurious: I'm curious about why we act the way we do, what that means for who we are, and how bettering an understanding of self can bring us together.\u003c/p\u003e\u003cp\u003eFriendly: I love to meet people. My favorite thing to do is sit in a cafe and strike up conversation. It's the reason I thrive in a seminar, excel at public speaking, and have been named Captain of every team I've ever been a part of.\u003c/p\u003e\u003cp\u003eOptimistic: I believe that agency and growth are self-fulfilling. The more we believe in these qualities, the more they come to be true. Optimism guides how I interact with others, and it dictates how I pursue my passions. I attribute most of my on-paper success—all-americanhood, captaincy, cum-laudeship, the like—to my refusal to accept dissapointment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEnough about my qualities. Here is some more about me. I was born in Cambridge MA, grew up in neighboring Acton where I attended public high school. In high school, I developed a love for writing, reading, and running track and field. By the end of my time there, I had been named two-time All-American, Boston Globe All-Scholastic, and held several state and New England records. During this time, I took more than my fair share of AP classes, was elected Class President three times, and learned how to juggle four balls at a time. \u003c/p\u003e\u003cp\u003eHighschool was when I developed my attitude towards growth; one that has dictated the way I live my life up to this point. I believe that identification with qualities solidifies these qualities, whereas an identification with growth solidifies growth. It is through the belief in one's capacity to improve—not some innate inevitability—that allows radical improvement.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, I clung to this attitude. Where once I was a big fish in a small pond, I now was a big fish in the Atlantic Ocean. If nothing else, Yale reveals just how much more one can achieve in his life. At Yale, I focused a lot of my time towards the Varsity Track and Field team. With a committment of almost 30 hours every week, this team taught me unshakeable time-management skills. It taught me discipline and rigor even as it grew my passion for community and leadership. Off the track, I redoubled my interest in writing. Specifically, I turned to Experimental Philosophy; an interdisciplinary study that sees the marriage of Psychology and Philosophy. I became increasingly curious in human nature, agency, and how our own conceptions of these ideas affect how we lead our lives. Over summers, I conducted research both with professors and local non-profits to investigate this curiousity. Also at Yale, I worked for the College Dean's Office, worked as a Tour Guide for Admissions, and mentored first years through the Office of Student Affairs. \u003c/p\u003e\u003cp\u003eMore than anything, this time was one of self-discovery, community engagement, and constant writing.\u003c/p\u003e\u003cp\u003eAll this being said, I'm someone who thinks deeply about life, cares deeply for friends, and invests deeply in passions. I am excited to continue this during my time with Curious Cardinals. \u003c/p\u003e","teachingVideoPlaybackId":"uZOhDzVR9Fh1I4d6JGe6YzYAdOv9Lbjb5BwesFuQbok","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Philosophy, Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"220ea5c1-8901-46d6-9c52-b1069b435f6b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a9df3314-18ff-4f35-9fd5-934133cca879/-/preview/-/format/jpg/","https://ucarecdn.com/0829790a-ad17-43a9-82ad-a681f10892d6/-/preview/-/format/jpg/","https://ucarecdn.com/32ad0451-b1dd-44cf-860e-4480ff328a8f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"7ffaaa36-443e-4356-ab42-c39b386459b6\"}"},{"__ref":"Education:{\"uuid\":\"13c6bd5e-5419-4654-b9d0-66a7d91b1e79\"}"}],"hiredAt":"2025-10-31T17:02:38.131Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","College Essay Writing","Reading","History","Executive Function"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":fa
