xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2e6ffe52-e5ce-471e-9ff5-412ac2c7772d\"}":{"__typename":"Favorites","uuid":"2e6ffe52-e5ce-471e-9ff5-412ac2c7772d","photoUrl":"https://ucarecdn.com/4c2fa047-22b1-44aa-b146-7e0acb6ac9b7/","title":"Stephen Curry","type":"ATHLETE"},"Favorites:{\"uuid\":\"36b627b1-ad3a-48d5-997d-dd962cbac6ba\"}":{"__typename":"Favorites","uuid":"36b627b1-ad3a-48d5-997d-dd962cbac6ba","photoUrl":"https://ucarecdn.com/5f700e5e-8808-4524-a905-4099c73429c0/","title":"Swimming","type":"SPORT"},"Favorites:{\"uuid\":\"6b8b05a2-a349-4d7e-a7b4-c598175f49c8\"}":{"__typename":"Favorites","uuid":"6b8b05a2-a349-4d7e-a7b4-c598175f49c8","photoUrl":"https://ucarecdn.com/acdd8596-e34b-4b20-b952-7e7329cd248f/","title":"Shenself","type":"ALBUM"},"CausesSupported:{\"uuid\":\"8097fbd1-4f56-4ce9-a980-932b563045f3\"}":{"__typename":"CausesSupported","uuid":"8097fbd1-4f56-4ce9-a980-932b563045f3","name":"Youth mentorship for left-behind children","description":"\u003cp\u003eProviding after-school tutoring, mentorship, and creative storytelling sessions.\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"a09d45e5-5515-436c-9a58-7772b3c127ae\"}":{"__typename":"CausesSupported","uuid":"a09d45e5-5515-436c-9a58-7772b3c127ae","name":"iGEM - biology education","description":"\u003cp\u003eIntroduce synthetic biology and basic life science concepts to students.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0bf17880-79cb-47b7-b043-6a66973e0074\"}":{"__typename":"DeepDives","uuid":"0bf17880-79cb-47b7-b043-6a66973e0074","content":"\u003cp\u003eIf I could talk to my middle/high school self, I’d say this: college is not as scary or distant as you think, and you don’t need to have everything figured out at 16.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI spent a lot of time worrying I was “behind” -- starting clubs too late, trying new activities too late, changing my mind too late. Looking back, that mindset held me back more than any actual limitation. I’d tell myself to stop treating every decision like it’s permanent and every mistake like it’s fatal.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTry the class that seems hard. Join the club where you don’t know anyone. Reach out to the teacher or mentor who intimidates you. You’re not “too late” to start coding, a sport, an instrument, or a new interest. The people who seem ahead are usually just the ones who started and kept going.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo my advice is simple: explore. Be curious, take more small risks, and worry less about being perfect on the first try. That’s how you actually figure out who you are and what you care about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"361de8ef-63f6-4fa1-9c31-4bd5273d31ef\"}":{"__typename":"DeepDives","uuid":"361de8ef-63f6-4fa1-9c31-4bd5273d31ef","content":"\u003cp\u003eMentorship matters to me because it turns everything I’ve struggled through into something useful for someone else instead of just “my problem.” I see it as a culture of sharing, not a one-way relationship where the expert talks and the student listens.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI didn’t get where I am by figuring everything out alone. Older students, teachers, and coworkers showed me how things really work -- from navigating hard classes and internships to dealing with burnout and self-doubt. A short conversation with the right person often saved me weeks of confusion.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow I’m on the other side, and I feel a responsibility to pass that forward. Mentorship is a way to compress the trial-and-error process for someone younger: share what I know, be honest about what I don’t, and give them the kind of support I wish I had earlier. It’s about making the path behind you less confusing for the next person.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d56e0d55-9ebf-447a-bf88-aa5c8fe5834e\"}":{"__typename":"DeepDives","uuid":"d56e0d55-9ebf-447a-bf88-aa5c8fe5834e","content":"\u003cp\u003e\u003cstrong\u003eMy dream job is to become an Algorithmic Developer.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI love designing logic that turns messy real-world data into structured, reliable decisions. Algorithmic development sits at the intersection of ML, optimization, and systems engineering -- fields I want to master. It’s one of the roles where depth, rigor, and long-term craftsmanship truly matter, and where AI enhances the work instead of replacing it. This is the space where my strengths fit naturally, and where I can build systems that scale far beyond myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6aa16443-3577-46e8-89af-15963a9fc2da\"}":{"__typename":"DeepDives","uuid":"6aa16443-3577-46e8-89af-15963a9fc2da","content":"\u003cp\u003eRecently, I’ve been experimenting with using ChatGPT as my personal fitness coach -- more specifically, as a “virtual” swimming coach. I break down my swim sessions and dry-land training, ask for workout structures, technique cues, and progression plans, then take them to the pool to see what actually works for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI trained seriously when I was younger, so I know what a rigid training system feels like. Now it’s really fun to come back to the sport as a grown-up, on my own terms, and use AI to rebuild my training in a way that’s flexible and personalized instead of strict and repetitive.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFun fact: using this setup, I’ve hit new personal bests in the 50 fly, and 200 IM all with ChatGPT as my “coach.” 🥳\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f2806339-e17c-4c69-a291-080dac963c06\"}":{"__typename":"School","uuid":"f2806339-e17c-4c69-a291-080dac963c06","name":"北京市第四中学","city":"Beijing","type":"HIGH","state":"Bei Jing Shi","country":"China","zip":"100034"},"Education:{\"uuid\":\"d5e11bb1-9ef0-47a0-b992-015d97147e5f\"}":{"__typename":"Education","uuid":"d5e11bb1-9ef0-47a0-b992-015d97147e5f","school":{"__ref":"School:{\"uuid\":\"f2806339-e17c-4c69-a291-080dac963c06\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"cd8b1888-e92a-45b0-bf43-ec94c6be5554\"}":{"__typename":"Education","uuid":"cd8b1888-e92a-45b0-bf43-ec94c6be5554","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"1b2491b6-063c-4b7b-a101-27d71deea77a\"}":{"__typename":"MentorPublicProfile","uuid":"1b2491b6-063c-4b7b-a101-27d71deea77a","displayName":"Angela W.","slug":"angela-wu","biography":"\u003cp\u003eHi! I’m Angela, an undergraduate at UC Berkeley studying Data Science with a focus in business and industrial analytics. I work with students and families who want more than “just getting through school” -- you want real understanding, confidence, and skills that last beyond one class or test.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, my strengths are in math, computer science, economics, and writing. I’ve taken rigorous courses such as Data Structures, Efficient Algorithms, Probability, and Macroeconomics. Beyond coursework, I’m doing research in quantum machine learning, where I explore how ideas from quantum computing can be used to design new kinds of algorithms and models.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn the industry side, I’ve worked across several parts of finance: mergers \u0026amp; acquisitions investment banking at CICC, private equity at Shixiang Tech, and public markets investing at Baer Investment Advisory. In practical terms, that means I’ve analyzed companies, built financial models, and supported real investment and deal decisions. This has given me a clear view of how the finance world is structured, if you are interested, don't hesitate to reach out :)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cem\u003e‼️ I specialize in:\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSubject tutoring:\u003c/strong\u003e I have strong experience in STEM fields like Computer Science/Coding, Chemistry, and all levels of Math (K–5 Math, Pre-Algebra, Algebra I \u0026amp; II, Geometry, Precalculus/Trigonometry, and Calculus). I focus on building a solid foundation and habits that actually stick: writing out clear steps, checking work, managing time under pressure, and asking good questions. My priority is teaching students how to think, not just how to plug into a formula.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects \u0026amp; academic mentorship:\u003c/strong\u003e I enjoy working with students who may only know “I kind of like X” and turning that into something concrete: a small app, a research-style project, a slide deck, or a portfolio piece they can be proud of.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic planning, and college applications:\u003c/strong\u003e I help students plan their week, break large assignments into manageable steps, prepare for exams, and reflect honestly on what is and isn’t working. For high schoolers, I also support college applications -- brainstorming and organizing essays, presenting activities clearly, and building a narrative that feels true to who they are while still standing out.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn sessions, I’m interactive and straightforward. I expect students to explain their thinking, try problems themselves, and tell me when something doesn’t make sense. I don’t do the work for them, but I make sure they always know what to do next.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside academics, I’m very into sports -- I love swimming 🏊‍♀️, playing basketball 🏀, and going on walks with friends. I also like music 🎶, video games 🎮, and watching YouTube vlogs. If a student connects more with sports or hobbies than with school at first, that’s fine; I’m good at using those interests to build trust and keep learning engaging.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re looking for someone who will challenge you or your child and actually care about long-term growth, I’d be glad to work together.\u003cbr\u003e\u003cbr\u003eCannot wait to meet you! 🤗\u003c/p\u003e","teachingVideoPlaybackId":"UXA01YZqIoA5pczRt02600GhwmaKadLft5d84tmizTkelA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is how I used my summer internship to start investing seriously and build my own portfolio from scratch.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUsing what I learned on the job, I researched companies, chose my own positions, and kept a simple log every two weeks where I wrote down what I bought or sold, why I made each decision, and what I was learning from the market. It wasn’t about chasing huge returns. It was about being disciplined, testing my ideas with real money, and holding myself accountable for the results.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOver time, the portfolio grew, and I eventually took 40% of the profit out. I used that money to buy birthday presents for my parents.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt’s not a huge, dramatic achievement, but it’s the proudest I’ve felt, because it was entirely self-driven and aligned with the kind of person I want to be.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"2e6ffe52-e5ce-471e-9ff5-412ac2c7772d\"}"},{"__ref":"Favorites:{\"uuid\":\"36b627b1-ad3a-48d5-997d-dd962cbac6ba\"}"},{"__ref":"Favorites:{\"uuid\":\"6b8b05a2-a349-4d7e-a7b4-c598175f49c8\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8097fbd1-4f56-4ce9-a980-932b563045f3\"}"},{"__ref":"CausesSupported:{\"uuid\":\"a09d45e5-5515-436c-9a58-7772b3c127ae\"}"}],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0bf17880-79cb-47b7-b043-6a66973e0074\"}"},{"__ref":"DeepDives:{\"uuid\":\"361de8ef-63f
