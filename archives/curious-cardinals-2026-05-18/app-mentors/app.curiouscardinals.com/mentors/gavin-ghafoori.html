xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"d07cf558-9b78-4b5b-b7c9-887f1368c0b3\"}":{"__typename":"DeepDives","uuid":"d07cf558-9b78-4b5b-b7c9-887f1368c0b3","content":"\u003cp\u003eWhen I was in high school, I spent two years putting together a non-profit organization to help underprivileged students have better access to and succeed in advanced placement (AP) courses. The goal was to cover program/exam costs, offer personalized study plans, and create a bank of supplemental lesson videos for students to access, and though every part of it didn't come to fruition, the time I spent working on it was some of the biggest fun I had, and it helped a lot of students improve their standing in what were otherwise really difficult classes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"740cf244-2e3c-4d6f-a569-1583befa3b6c\"}":{"__typename":"DeepDives","uuid":"740cf244-2e3c-4d6f-a569-1583befa3b6c","content":"\u003cp\u003eHonestly, it started with a youtube video. When I first got to college, I started as a theoretical math major, and it only took a couple of courses for me to figure out that it wasn't for me. Now during this time, I was in introductory biology courses, and while looking for help understanding a topic, I stumbled on a video from a professor explaining aspects of the biochemistry behind protein structure, and I was absolutely fascinated. I looked back after that video and realized that the most fun I'd ever had in classes growing up was when I was learning about biology or chemistry, and when I first pulled up the form to switch majors, it was like something inside me clicked. I knew I'd found my passion.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6476186e-5154-4049-9f46-68c02e62fa3d\"}":{"__typename":"DeepDives","uuid":"6476186e-5154-4049-9f46-68c02e62fa3d","content":"\u003cp\u003eWhen something's hard for you, it's a sign to keep going! Personal growth doesn't happen if you stick with the things you're good at all the time, and even if you work hard at something only to find out you don't like it, you'll be left with the pride of knowing you did something you didn't think you could.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"7a324ca7-27a4-4899-8036-915150e7d092\"}":{"__typename":"DeepDives","uuid":"7a324ca7-27a4-4899-8036-915150e7d092","content":"\u003cp\u003eI come from a family of Persian and Italian immigrants, each of whom moved to the United States during a time when their identity made them a target for everyone around them. They came with nothing, and most of them struggled for a long time; it wasn't until each of them, in their own ways, met someone who showed them empathy and true kindness, who sought to help them, that they began to flourish here. I grew up hearing those stories all the time, about why all of the wonderful people I grew up around were in my life, and it taught me how important it is to show that kindness to others. I make it my goal to give students a reason to believe in themselves, to be someone who shows them kindness and empathy, even if no one else has before, because I know firsthand that that's the only way we succeed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"94bdca39-51a2-403a-8b1d-13a865aef99f\"}":{"__typename":"School","uuid":"94bdca39-51a2-403a-8b1d-13a865aef99f","name":"St. Johnsbury Academy","city":"Saint Johnsbury","type":"HIGH","state":"Vermont","country":"United States","zip":"05819"},"Education:{\"uuid\":\"05930fbf-2532-4308-ad49-ad84880c1f17\"}":{"__typename":"Education","uuid":"05930fbf-2532-4308-ad49-ad84880c1f17","school":{"__ref":"School:{\"uuid\":\"94bdca39-51a2-403a-8b1d-13a865aef99f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"d4042709-5b23-41d5-a78d-541cd610794f\"}":{"__typename":"School","uuid":"d4042709-5b23-41d5-a78d-541cd610794f","name":"University of Texas at Dallas","city":"Richardson","type":"COLLEGE","state":"Texas","country":"United States","zip":"75080"},"Education:{\"uuid\":\"3b485818-3198-4518-aef9-c8e577fb9e7a\"}":{"__typename":"Education","uuid":"3b485818-3198-4518-aef9-c8e577fb9e7a","school":{"__ref":"School:{\"uuid\":\"d4042709-5b23-41d5-a78d-541cd610794f\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biochemistry","degree":"B.S."},"MentorPublicProfile:{\"uuid\":\"21e440e9-f7c4-4b87-a83b-966f96a3977e\"}":{"__typename":"MentorPublicProfile","uuid":"21e440e9-f7c4-4b87-a83b-966f96a3977e","displayName":"Gavin G.","slug":"gavin-ghafoori","biography":"\u003cp\u003eHi there! My name is Gavin, and I'm currently a junior at the University of Texas at Dallas majoring in Biochemistry with a minor in Neuroscience. I'm really passionate about a wide range of topics in both the sciences and the arts, and I spend my free time investing in a wide range of interests and activities. When I'm not in the lab or the lecture halls, you can usually find me in a spare classroom, working as a teaching instructor for organic chemistry. However, I'm interested in a lot more than science: Music in particular holds a special place in my heart, and I spend countless hours playing the piano and working on my abilities in opera. When I don't have my nose in a research journal, a Star Wars book, or notes for a D\u0026amp;D session, I'm usually absentmindedly humming a tune, cooking, or playing a video game.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat I believe sets me apart as an educator is my drive to hold students' inner passions as an integral part of my teaching approach. I find that science and math have the capacity to hold a kind of beauty and inspiration, as long as you have someone to help you find it along the way. I want to help students discover this inherent wonder, turning subjects often perceived as cold and calculating into fun journeys of exploration. By bridging this gap in understanding, I hope to empower learners to make connections between their academic pursuits and their own lives, fostering a deeper understanding of the world around them.\u003cbr\u003e\u003cbr\u003eIn addition to all of these things, I have a strong passion for mentoring neurodivergent students. As a person with ADHD, I grew up having to learn to navigate a lot of really complicated systems and develop everyday management strategies on my own, and I found that most systems aren't built to make that easy. I strive to help other neurodivergent students navigate the paths ahead of them and ensure that they never feel lost or left behind, giving them the tools they need to meet their fullest potential.\u003c/p\u003e","teachingVideoPlaybackId":"56HdT501MwZBEwUEyOSALfOrQXQBZ5kN4nGpQ029Up02XU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d07cf558-9b78-4b5b-b7c9-887f1368c0b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"740cf244-2e3c-4d6f-a569-1583befa3b6c\"}"},{"__ref":"DeepDives:{\"uuid\":\"6476186e-5154-4049-9f46-68c02e62fa3d\"}"},{"__ref":"DeepDives:{\"uuid\":\"7a324ca7-27a4-4899-8036-915150e7d092\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d410ebef-a35e-48da-8d65-35c018b11e63/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"05930fbf-2532-4308-ad49-ad84880c1f17\"}"},{"__ref":"Education:{\"uuid\":\"3b485818-3198-4518-aef9-c8e577fb9e7a\"}"}],"hiredAt":"2023-07-06T20:15:46.058Z","topics":["Medicine / Health","Statistics","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","Geometry","Calculus","Algebra II","Algebra I","Chemistry","Biology","STEM Project"],"communityBadges":["https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/ac9566a7-da83-4384-8db1-04fe48d7e720/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gavin-ghafoori\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"21e440e9-f7c4-4b87-a83b-966f96a3977e\"}"}}},"_sentryTraceData":"4bb3889ea078438b8620c9d312f75999-8c7788e44d3e2c13-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4bb3889ea078438b8620c9d312f75999,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","quer
