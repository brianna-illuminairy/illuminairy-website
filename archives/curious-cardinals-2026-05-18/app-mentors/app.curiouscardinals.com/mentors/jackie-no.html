xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"90560c8b-c7f9-43a8-ade3-6ef17bb79a50\"}":{"__typename":"Favorites","uuid":"90560c8b-c7f9-43a8-ade3-6ef17bb79a50","photoUrl":"https://ucarecdn.com/9c02eb92-904c-4c2d-92ff-0d3b963039cf/","title":"The Body Keeps the Score","type":"BOOK"},"Favorites:{\"uuid\":\"0a10d6fe-a68d-44e5-81a0-73e348b48ad3\"}":{"__typename":"Favorites","uuid":"0a10d6fe-a68d-44e5-81a0-73e348b48ad3","photoUrl":"https://ucarecdn.com/c16feda8-f51d-4b54-b9c8-b40c856b75ff/","title":"It Won't Always Be Like This","type":"ALBUM"},"Favorites:{\"uuid\":\"56ba6d8b-6444-4771-b9bf-d3d56e4b5ce2\"}":{"__typename":"Favorites","uuid":"56ba6d8b-6444-4771-b9bf-d3d56e4b5ce2","photoUrl":"https://ucarecdn.com/8070b357-0100-4e82-a718-f668de4b20e4/","title":"Tyrese Proctor","type":"ATHLETE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"92a819b4-bbc8-427b-b949-17f82f347014\"}":{"__typename":"DeepDives","uuid":"92a819b4-bbc8-427b-b949-17f82f347014","content":"\u003cp\u003eWhile it is great to have ambitious goals and desire to create a better life for yourself, also remember to find joy and gratitude in the little things and simple moments. Take the time to enjoy your friends and the coming-of-age experience. Understand that your worth is not determined by awards and academics. Be thankful for each breath you take, be excited for every sunrise you see and allow yourself to just be because there is joy in simply existing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis is a somewhat terrifying concept for you, I’m sure. You will see your friends accomplish incredible things and will inevitably feel far behind. I know that for most of your academic career, a student’s worth was determined by grades and honors. But I want to tell you that in between where you are and where you want to be, there is endless, boundless peace. There is an opportunity to be still, as you find yourself on the threshold between the past and the future, knowing that this is the space where you were called to come alive. It is okay if you feel uncertain here. You don’t have to have it all figured out. You are free to take this moment by moment, and see the wholeness of it all: some things will be difficult. Some things will be easier. Some things will make sense, while other things leave you with questions. But altogether, these mountains and valleys create a landscape, where somehow, through it all, everything finds its place. It is quite simple—nothing that is meant for you will ever get away.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9b087ac6-1814-4a1d-8746-b14f745a979c\"}":{"__typename":"DeepDives","uuid":"9b087ac6-1814-4a1d-8746-b14f745a979c","content":"\u003cp\u003eMy entire life, I thought I would go to art school. Ever since I was young, I had been immersed in the world of creatives—most instruments or modalities of art came to me naturally (one that usually surprises people is my ability to play the accordion). I was often told I would be a fantastic graphic designer or video game artist. This train of thought took a sharp turn my junior year of high school.\u003c/p\u003e\u003cp\u003eAt the time, I had crafted a lofty goal for myself—I wanted to join a local rock band. Pushed by fantasies of basking in the spotlight, I taught myself how to play the electric guitar. Many online tutorials later, I was able to play at an acceptable rate, and ended up joining a local indie rock band.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I quickly realized, was that I have abnormally short pinkies. Both of my pinkies measure in at a whopping 1.3 inches—which made it incredibly difficult to play more difficult chords or complicated riffs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAround this time, one of my favorite teachers at school had pitched a new course he would be teaching the following semester—Engineering 101. It was a makerspace based class, teaching students how to do woodworking, sewing, 3D printing, and circuitry. This proposal gave me a crazy idea—I could join this class and learn to somehow design and 3D print myself a new pinky.\u003c/p\u003e\u003cp\u003eSo, out of spite for my blob-like pinkies and intense desire to get better at the guitar, I joined this course.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUnfortunately, I completely failed in my pinky-making endeavors. But in the process, I realized I very much enjoyed the concept of engineering design. Engineering felt like its own form of art. It’s about finding elegant solutions to complex challenges, and bringing abstract ideas to life. That same semester, I fell in love with AP Biology, captivated by the intricate systems that make life possible. This blend of creative problem-solving and biological curiosity led me to Biomedical Engineering, where I could merge my passion for science and art into a single, impactful discipline.\u003c/p\u003e\u003cp\u003eEven so, I haven’t completely forgotten my art school roots. I chose to minor in Visual Arts so that I would continue to create art in college, even though my major seemed like something on the opposite end of the spectrum.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"7f62c270-f68a-48a9-8945-de9405168d0d\"}":{"__typename":"DeepDives","uuid":"7f62c270-f68a-48a9-8945-de9405168d0d","content":"\u003cp\u003eMy greatest role model is my high school computer science teacher, Mr. Herring. I can confidently say that he is the person who changed the trajectory of my life, and is the reason where I am now.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt started during the COVID-19 pandemic, when I enrolled in AP Computer Science A over Zoom. I didn’t expect much from the class—after all, virtual learning felt impersonal and disconnected, and I viewed it as an “easy elective” course. Despite my initial negativity, AP CSA is where I met Mr. Herring. Even with the distance, he brought the screen to life. He had a way of making Java feel intuitive and exciting, and eventually I was one of the only students who consistently kept my camera on.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat summer, out of the blue, he asked if I’d be interested in mentoring at a computer science summer camp for incoming freshmen. I said yes, not knowing that moment would mark a turning point in my academic career. Mr. Herring was the first person who made me feel like I could succeed in STEM. He showed me I was capable, that my voice mattered, and that I didn’t have to be the loudest in the room to lead with confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough his classes, I discovered a love for coding, met some of my closest friends, and found joy in helping others learn. He also happened to be the faculty sponsor of our school’s Future Business Leaders of America (FBLA) chapter. With his encouragement, I joined—and what followed was one of the most formative chapters of my high school career. I won every one of my events at the Arizona state level and competed at nationals each year. I was able to meet students from all over the nation and realize my talents in areas I hadn’t thought of before. None of that would have happened without him.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver time, Mr. Herring and I developed a close bond—complete with a secret handshake we created together. At graduation, we were told not to do anything “extra” on stage. But when he handed me my diploma, we did the handshake anyway. It was our quiet celebration of everything I had overcome, and everything he had helped me believe in.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEven now, years later, we still keep in touch. He’s pursuing his master’s degree in computer science, and he occasionally sends me photos from class or vents about grading. I still rely on the coding foundation he gave me—but more importantly, I carry the self-belief he helped instill. He’s the kind of mentor who changes lives by noticing the small things. He saw potential in me before I saw it in myself. One day, I hope I can do the same for someone else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"306a6b91-5eb4-4a62-9c16-a291dd9d0d96\"}":{"__typename":"DeepDives","uuid":"306a6b91-5eb4-4a62-9c16-a291dd9d0d96","content":"\u003cp\u003eOne of the things I’m most proud of is joining \u003cem\u003ePureun\u003c/em\u003e, Duke’s K-pop dance group—even though I had absolutely no prior dance experience. I went to auditions during my freshman year without knowing a single person and feeling incredibly intimidated, but I was determined to try something completely outside of my comfort zone. That leap of faith turned out to be one of the most rewarding decisions I’ve ever made.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, Pureun has become one of the most important parts of not just my life at Duke, but of my identity. We’ve performed in front of huge crowds, built a reputation on campus for our powerful stage presence and polished choreography, and developed a tight-knit community that feels like family. I’ve grown so much—not just as a dancer, but as a teammate and a leader. I now serve on the executive board as our lead coordinator, helping plan performances, manage rehearsals, and guide new members who were once just like me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the highlights of this year was helping coordinate a group of our members to fly to New York City, where they performed live on the \u003cem\u003eToday Show\u003c/em\u003e with Ken Jeong. Watching our team shine on national TV was surreal—and knowing I had a hand in making it happen made it even more meaningful. Pushing myself to take that first risk gave me the confidence to embrace new challenges in every part of my life, and I’m incredibly proud of how far I’ve come with a team that means so much to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"7fc0cea0-002d-41e9-b4a3-bc7cf6a655f5\"}":{"__typename":"Education","uuid":"7fc0cea0-002d-41e9-b4a3-bc7cf6a655f5","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biomedical Engineering \u0026 Global Health \u0026 Visual Arts","degree":null},"School:{\"uuid\":\"081643b5-e021-4eda-b767-ffb487630c24\"}":{"__typename":"School","uuid":"081643b5-e021-4eda-b767-ffb487630c24","name":"University High School","city":"Tucson","type":"HIGH","state":"Arizona","country":"United States","zip":"85711"},"Education:{\"uuid\":\"e192de20-8146-42e0-9a58-23a7928b6f71\"}":{"__typename":"Education","uuid":"e192de20-8146-42e0-9a58-23a7928b6f71","school":{"__ref":"School:{\"uuid\":\"081643b5-e021-4eda-b767-ffb487630c24\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"191d14e9-a591-4c48-b627-8340b8ad856b\"}":{"__typename":"MentorPublicProfile","uuid":"191d14e9-a591-4c48-b627-8340b8ad856b","displayName":"Jackie N.","slug":"jackie-no","biography":"\u003cp\u003eHey everyone! My name is Jackie No, and I’m a rising junior at Duke University majoring in Biomedical Engineering, Visual Arts, and Global Health on the premed track. Right now, I’m working in rural North Carolina with the Pamlico County Health Department to engineer a financial analysis software that demonstrates the sustainability of their clinical services—an essential resource for supporting grant applications. I like to think of engineering as a launchpad for impact—it’s how we design better medicines, build tools to serve our communities, and envision a healthy future for all. And that’s the mindset I bring to every mentorship: creativity and curiosity grounded in real-world problem-solving.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always loved both the arts and STEM, and I can confidently say that my past few years at Duke have taught me how to live in both worlds simultaneously. I’m someone who loves to be everywhere at once—whether that’s at practice with my dance team, engineering safer organ transplantation methods in my lab, or teaching English to North Korean refugees in Seoul. My interests stretch across disciplines, and I truly believe that your college experience doesn’t have to fit into a single box. That being said, as a mentor, I specialize in helping students tackle bold projects that blend STEM and creatives together—whether they’re building biomedical models, designing a zine, or learning to code. I focus on building confidence alongside technical skill, and I’m a firm believer that no question is too small and no dream is too ambitious.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat mindset didn’t come naturally. Up until my senior year of high school, I was absolutely set on going to art school. It was what I did best, and it was what I had done for my entire life—until I decided to design and 3D print myself a prosthetic pinky finger so that I could play guitar better for my indie rock band (crazy story, you can read more about it below). That wild idea introduced me to the world of Biomedical Engineering and changed everything I knew about myself. All of this was possible only because I had an incredible teacher who encouraged me to chase what mattered to me. That support meant the world to me, and it’s a big reason why I am where I am today. I hope to be that kind of mentor for you.\u003c/p\u003e","teachingVideoPlaybackId":"qf8DVmGn4jdOhsfLScb7P017BgHpFzIuhL75RUvT02v00M","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"90560c8b-c7f9-43a8-ade3-6ef17bb79a50\"}"},{"__ref":"Favorites:{\"uuid\":\"0a10d6fe-a68d-44e5-81a0-73e348b48ad3\"}"},{"__ref":"Favorites:{\"uuid\":\"56ba6d8b-6444-4771-b9bf-d3d56e4b5ce2\"}"}],"causesSupported":[],"major":"Biomedical Engineering \u0026 Global Health \u0026 Visual Arts","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"92a819b4-bbc8-427b-b949-17f82f347014\"}"},{"__ref":"DeepDives:{\"uuid\":\"9b087ac6-1814-4a1d-8746-b14f745a979c\"}"},{"__ref":"DeepDives:{\"uuid\":\"7f62c270-f68a-48a9-8945-de9405168d0d\"}"},{"__ref":"DeepDives:{\"uuid\":\"306a6b91-5eb4-4a62-9c16-a291dd9d0d96\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d37c1178-1d99-44d6-b08d-dffea211ef01/-/preview/-/format/jpg/","https://ucarecdn.com/d34b7650-92c6-4f85-b2b3-3bcfff5ba8a0/-/preview/-/format/jpg/","https://ucarecdn.com/a84bd6d1-7181-4fc2-a409-50b63e7733fc/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7fc0cea0-002d-41e9-b4a3-bc7cf6a655f5\"}"},{"__ref":"Education:{\"uuid\":\"e192de20-8146-42e0-9a58-23a7928b6f71\"}"}],"hiredAt":"2025-05-14T14:35:39.089Z","topics":["K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Video / Photography","Medicine / Health","Coding / Programming","Public Speaking"],"communityBadges":["https://ucarecdn.com/c942d968-716c-4352-9dd1-9c8441a54458/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jackie-no\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"191d14e9-a591-4c48-b627-8340b8ad856b\"}"}}},"_sentryTraceData":"29a32797229d420e95e54cac6ba398e9-8a4ce74ecfaf9c01-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=29a32797229d420e95e54cac6ba398e9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jackie-no"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
