xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"cc95cc0d-936c-44c2-b373-ee4a05257f97\"}":{"__typename":"DeepDives","uuid":"cc95cc0d-936c-44c2-b373-ee4a05257f97","content":"\u003cp\u003eWhen I was a kid, I had a dream where I was in the basement of my grandparents' house. The basement was dark and damp, with minimal lighting emanating from the lightbulbs hanging from the ceiling. All of a sudden, a human sized Mickey Mouse appeared out of nowhere, clapped three times in my face, then walked up the basement stairs. That dream was terrifying to me as a kid, but now I look back on it and I laugh at how ridiculous it was.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"58d6201c-eba2-425a-9c3f-6518204c4a85\"}":{"__typename":"DeepDives","uuid":"58d6201c-eba2-425a-9c3f-6518204c4a85","content":"\u003cp\u003eMy greatest role model is my Dad. My Dad is a man of integrity and persistence. Although he isn't too fond of his job, he puts his head down and shows up at work in order to provide for his family. I admire his resilience and I hope to one day be as resilient as him.\u003cbr\u003e\u003cbr\u003eHe's also the one who started my on my music journey and supported me throughout. Thanks Dad.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f0f88a52-3a86-4ac7-b2f4-5a21425ff1de\"}":{"__typename":"DeepDives","uuid":"f0f88a52-3a86-4ac7-b2f4-5a21425ff1de","content":"\u003cp\u003eI can't think of a time in my life where I have not had a mentor to look up to. Whether it be exposing me to new ideas, sharing life lessons, having someone to talk to, or taking me out to dinner, all of the role models in my life have had major impact in shaping me into the person I am today. I am incredibly thankful to them for helping me out, so I want to be able to provide a similar experience to those who may need it and assist them where I can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b22b763a-6ef5-478d-b2f5-83e0718ae70f\"}":{"__typename":"DeepDives","uuid":"b22b763a-6ef5-478d-b2f5-83e0718ae70f","content":"\u003cp\u003eDon't take life so seriously. In high school, I had a habit of fixating on my negative feelings and experiences while downplaying fulfilling experiences and my achievements. This mindset left me in a constant state of negativity and unhappiness. Always be grateful for what you have in your life and remember to enjoy yourself!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"e43ac86b-9fd5-4ae0-bdd7-4b588e05584a\"}":{"__typename":"School","uuid":"e43ac86b-9fd5-4ae0-bdd7-4b588e05584a","name":"River Dell High School","city":"Oradell","type":"HIGH","state":"New Jersey","country":"United States","zip":"07649"},"Education:{\"uuid\":\"8d76789d-5093-4629-83cc-f017a9507b3f\"}":{"__typename":"Education","uuid":"8d76789d-5093-4629-83cc-f017a9507b3f","school":{"__ref":"School:{\"uuid\":\"e43ac86b-9fd5-4ae0-bdd7-4b588e05584a\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"2ba99034-574a-4893-a068-6e9d57d018ae\"}":{"__typename":"Education","uuid":"2ba99034-574a-4893-a068-6e9d57d018ae","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Music, Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"09025de8-654c-401b-b6e5-68532f8be8d0\"}":{"__typename":"MentorPublicProfile","uuid":"09025de8-654c-401b-b6e5-68532f8be8d0","displayName":"Paul J.","slug":"paul-jeong","biography":"\u003cp\u003ePaul is a dedicated music and computer science student at Brown University. He is currently the bassist of a college pop/funk/R\u0026amp;B band and a junior developer at a small tech startup focused on mobile app development.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFrom very early on, Paul knew that music was something special. Growing up in Bergen County, New Jersey, Paul’s parents would often find him sprawled on the rug, reading piano sheet music like a compelling novel. Over the years, Paul would go on to learn a multitude of different instruments including piano, violin, guitar, bass guitar, double bass, drums, and saxophone. With a variety of musical experiences and influences under his belt, Paul decided to pursue music production as a way to articulate his love for the art.\u0026nbsp;In addition to his creative pursuits, Paul also has an appreciation for logical and analytical thinking. Paul had always enjoyed STEM classes throughout school, where he relished the challenge of dissecting complex problems with systematic reasoning. His love for computer science was further fueled by a background in video games, prompting him to delve into the world of coding and computational problem-solving.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAside from academics, Paul enjoys being active (going to the gym, playing tennis), solving crossword puzzles, jamming out to music (send me your favorite song), dominating his friends in Super Smash Bros, and surfing YouTube.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHaving previously been on the receiving end of tutoring multiple times himself, Paul understands what it is like to be a tutee. While it may be scary and intimidating to be a student, Paul is committed to empowering and inspiring his mentees on their educational journey, whether it be guiding them through the intricacies of music theory or tackling coding challenges.\u003c/p\u003e","teachingVideoPlaybackId":"v42kvIT00g2zmLQMS012rUOQf01YymOQgwf6aMxKlSwwyk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Music, Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cc95cc0d-936c-44c2-b373-ee4a05257f97\"}"},{"__ref":"DeepDives:{\"uuid\":\"58d6201c-eba2-425a-9c3f-6518204c4a85\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0f88a52-3a86-4ac7-b2f4-5a21425ff1de\"}"},{"__ref":"DeepDives:{\"uuid\":\"b22b763a-6ef5-478d-b2f5-83e0718ae70f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/147c637b-6c69-400d-9cde-3a0b85b8e1d8/-/preview/-/format/jpg/","https://ucarecdn.com/286dc9d4-2d8e-46e8-b729-1d509ce72c85/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8d76789d-5093-4629-83cc-f017a9507b3f\"}"},{"__ref":"Education:{\"uuid\
