xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"a4111d42-1f38-4d97-bddd-cdccda14e705\"}":{"__typename":"School","uuid":"a4111d42-1f38-4d97-bddd-cdccda14e705","name":"Windward School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90066"},"Education:{\"uuid\":\"f1be9648-b8b1-47b3-bf0c-12e1a0756702\"}":{"__typename":"Education","uuid":"f1be9648-b8b1-47b3-bf0c-12e1a0756702","school":{"__ref":"School:{\"uuid\":\"a4111d42-1f38-4d97-bddd-cdccda14e705\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"5e6d780d-b300-48a2-a669-f38b50c8b3d8\"}":{"__typename":"Education","uuid":"5e6d780d-b300-48a2-a669-f38b50c8b3d8","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"4fb5a31b-6283-4f59-b82f-00323e63ad97\"}":{"__typename":"MentorPublicProfile","uuid":"4fb5a31b-6283-4f59-b82f-00323e63ad97","displayName":"Jeremy M.","slug":"jeremy-barrientos","biography":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eJeremy is a junior at Stanford University majoring in mechanical engineering with a minor in art practice. He is passionate about space exploration and hopes to go full-time into the aerospace industry as an engineer after graduation. During high school he was selected for a summer internship with Boeing, working with antenna engineers which helped to solidify his desire to work in the industry. His love for space has brought him to become involved with the Stanford Student Space Initiative, a space club on campus. He primarily works with the satellites sub-team where he has been both a member and co-lead of the structures division. He is very proud to have worked on technology that is currently in orbit.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eJeremy is also excited by the intersections of engineering and art. On campus, you can often find him in the Product Realization Lab (PRL), Stanford machine shop, tinkering away at engineering design projects, or in McMurtry in one of the drawing or painting studios. He loves to create. Whether that means making an oil painting on canvas, a structural component on a satellite, or machining parts in the PRL for a mechanical engineering course.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to his engineering and artistic pursuits, Jeremy is also an outdoorsman. He loves to be active and in nature as much as possible. Throughout high school, he ran on both the track and cross-country teams and played four years of varsity soccer. He also enjoys hiking, be it a backpacking trip or a more casual sunday hike with friends. In no particular order fishing, surfing, and skiing are also some of his favorite pastimes.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHis passion for mentorship began in high school where he cofounded a community service project with a friend. The project entailed guiding underprivileged local kids in personal computer builds, showing them how they too can tackle challenging engineering problems like building a computer. It also had the bonus of each child getting to take home their own computer while also giving them a valuable resource for pursuing further learning. Jeremy looks forward to aiding the engineers, artists, and students of the future with whatever endeavors they are currently tackling. From personal engineering projects to a math class to practicing figure drawing, Jeremy is open and excited to help young learners pursue their passions in any way he can.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/044c9050-18ce-4ec4-bbfa-baf5916d9234/-/preview/-/format/jpg/","https://ucarecdn.com/40f65d3c-be1d-47d9-8d41-20813bd2dccb/-/preview/-/format/jpg/","https://ucarecdn.com/7b18ea63-0471-4d0e-a744-a69ec566e864/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f1be9648-b8b1-47b3-bf0c-12e1a0756702\"}"},{"__ref":"Education:{\"uuid\":\"5e6d780d-b300-48a2-a669-f38b50c8b3d8\"}"}],"hiredAt":"2023-10-12T09:05:10.018Z","topics":["Robotics / Electronics / CAD","Aviation / Aerospace","Product Design","Statistics","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","Geometry","Calculus","Algebra II","Algebra I","Physics","Visual Arts / Graphic Design","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jeremy-barrientos\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4fb5a31b-6283-4f59-b82f-00323e63ad97\"}"}}},"_sentryTraceData":"40a1e0dd8e484140a6b95307e6481c9d-8bd9a876affcb832-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=40a1e0dd8e484140a6b95307e6481c9d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jeremy-barrientos"},"buildId":"ZAc
