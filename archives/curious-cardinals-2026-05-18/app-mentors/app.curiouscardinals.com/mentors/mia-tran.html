xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f339839a-8dc5-4c0e-adaa-2364fc8ea92d\"}":{"__typename":"Favorites","uuid":"f339839a-8dc5-4c0e-adaa-2364fc8ea92d","photoUrl":"https://ucarecdn.com/ee622374-1c1f-4b18-ae28-a33d61d5699c/","title":"The Alchemist","type":"BOOK"},"Favorites:{\"uuid\":\"b7acd94f-27ad-45f7-847b-ad47a5236b21\"}":{"__typename":"Favorites","uuid":"b7acd94f-27ad-45f7-847b-ad47a5236b21","photoUrl":"https://ucarecdn.com/0349802e-2bbf-4966-8c6b-5f12a0be32af/","title":"Armin van Buuren","type":"ARTIST"},"Favorites:{\"uuid\":\"03faafa2-c0e3-4845-b9d4-95980b6e889b\"}":{"__typename":"Favorites","uuid":"03faafa2-c0e3-4845-b9d4-95980b6e889b","photoUrl":"https://ucarecdn.com/fb7db0cd-090c-4db5-ba3a-ef11da7f5141/","title":"Interstellar","type":"MOVIE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2e610279-1407-4849-b833-da484e37d466\"}":{"__typename":"DeepDives","uuid":"2e610279-1407-4849-b833-da484e37d466","content":"\u003cp\u003eMentorship is extremely important to me because I've had such brilliant mentors that have helped me through all walks of life. Be it an older friend that I looked up to, a teacher who pushed me when I wasn't confident, or even a random stranger who gives a morsel of advice that just hits in a moment of crisis, I think it is in the nature of humanity to guide and help one another. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt was important to me as a young person to have someone older who saw me as an individual, and provided guidance in a way that felt genuine. I've always loved talking to younger people and seeing how differently they see the world, and I am particularly passionate about helping guide others through walks of life that I have already been through.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4977bf33-48b3-45b7-878a-318b535f8885\"}":{"__typename":"DeepDives","uuid":"4977bf33-48b3-45b7-878a-318b535f8885","content":"\u003cp\u003eI love talking about this, because I definitely fell into it through process of elimination and some blind leaps of faith. In school, I had always naturally gravitated towards math, it was my favorite subject in school through high school. When I went to college, I wanted to find something where I could apply the math to something a bit more practical and employable, and so I entered as a general engineering major. Through the preliminary course work, I found that I excelled in chemistry, could not understand biology at all, and really gravitated towards topics regarding climate change and public health. After spending a few years working in a aquatic biochemistry laboratory, I knew I wanted to learn more in graduate school, but not sure in what. I randomly switched out of aquatic chemistry into atmospheric chemistry, and have completely fallen in love with it through the course of my Ph.D., though it did take 3-4 years of elbow grease before I could start enjoying it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"6cd064cb-3d2f-4d70-991c-06c5933cab7e\"}":{"__typename":"DeepDives","uuid":"6cd064cb-3d2f-4d70-991c-06c5933cab7e","content":"\u003cp\u003eI am a first generation Vietnamese-American woman. It's been a challenge navigating the world as a woman of color, but also extra challenging having parents who immigrated to the states. I think the immigrant experience is one of the core identifiers of my teaching style; I've become culturally very adaptable due to the years of moving around city-to-city, but also having to bridge the cultural gaps between my own family and the world I experience professionally. I have a particularly strong understanding of the needs and nuances of students from another culture, as well as how dynamics with parents may vary. \u003cbr\u003e\u003cbr\u003eMy experience as a woman of color in STEM fields, a traditionally white and male dominated arena, also informs my teaching style. I am particularly passionate about empowering women and POC in fields that feel isolating to them, and have a lot of drive to level out the playing field in that sense. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"f1accf33-60e8-44e7-b471-7fa1c94684b9\"}":{"__typename":"DeepDives","uuid":"f1accf33-60e8-44e7-b471-7fa1c94684b9","content":"\u003cp\u003eMy greatest form of motivation in my own life is the gratification of learning in itself. I find it really meaningful to start from ground-zero for something and slowly build my expertise in it over time, and to do this over and over again for whatever my heart desires to learn. I find a lot of joy of having a diverse set of skills and also how it allows me to connect with a lot of people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"98101a6d-a774-4260-b003-2abf362ad23e\"}":{"__typename":"School","uuid":"98101a6d-a774-4260-b003-2abf362ad23e","name":"Walter Payton College Preparatory High School","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60610"},"Education:{\"uuid\":\"99bd33a4-7800-4f39-80c4-09d7b0755247\"}":{"__typename":"Education","uuid":"99bd33a4-7800-4f39-80c4-09d7b0755247","school":{"__ref":"School:{\"uuid\":\"98101a6d-a774-4260-b003-2abf362ad23e\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"64786661-cd3b-4cd3-a9a7-c06591d85003\"}":{"__typename":"Education","uuid":"64786661-cd3b-4cd3-a9a7-c06591d85003","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"ENVIRONMENTAL ENGINEERING","degree":null},"MentorPublicProfile:{\"uuid\":\"829da029-1eab-41cf-ac13-992d4b9a6aaa\"}":{"__typename":"MentorPublicProfile","uuid":"829da029-1eab-41cf-ac13-992d4b9a6aaa","displayName":"Mia T.","slug":"mia-tran","biography":"\u003cp\u003eMia is a Ph.D. candidate studying environmental engineering at Yale University. When it comes to knitty gritty science details, she specializes in atmospheric chemistry, particularly air quality and how that evolves in a changing climate. Mia has experience in field work and in the lab operating very fancy equipment known as mass spectrometers. Her dissertation focuses on the temperature dependence of volatile organic compounds (VOCs) in the urban environment. She nerds out over anything organic chemistry, mass spec, and mathematics.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen she's not holed up in the lab, Mia is extremely passionate about two things: arts and education. Since she was a teenager, Mia has been dabbling in a million creative endeavors; she's been dancing and choreographing on hip-hop teams for over 10 years, designing graphics for small fashion labels and websites, sewing cute outfits for herself and friends, and currently learning how to DJ electronic music. In her spare time, she's always catching a flight to see her friends, hanging out at home with her two cats, or going to another concert.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn finding her path, Mia has always juggled the world STEM with creative outlets. As a high schooler, Mia was heavily (and I mean heavily) involved with her school's math team, co-captain of the K-pop dance club, and editor of the yearbook. As she progressed into her college years, Mia spent four years on her school's hip-hop dance team, spending hours in the studio choreographing, staging, and dancing in all sorts of new styles. She spent a large amount of time on the team's board as well as the design and branding chair, growing the team's social media presence and dressing the 80+ member team for performances. She also spent hours in the library on her coursework, where she found her love for chemistry and environmental engineering, and completed a dual B.S./M.S. degree in her four years at Northwestern University.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMia's dream in life is to inspire others to explore the nexus between science and art, and to make education of these fields feel less daunting. Mia has historically tutored in the STEM fields, and feels strongly that they can be accessibly taught to everyone. Over the years, she has also taught dance classes, mentored younger graphic designers, and is currently working as a K-12 arts educator at the Yale Art Gallery. She feel that with the right building blocks, students can thrive both technically and creatively as they find their way through life.\u003c/p\u003e","teachingVideoPlaybackId":"B3knBlhDoGCnzfN500kvyl22MPhl9L00mEegGnqJhSTX4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my proudest memories was during my senior year of college, from 2020-2021. Everything had shut down, and my dance team was devastated because we wouldn't be able to put on the year-end show, especially us seniors. What our board decided to do was to still put on a virtual showcase, where we spent the entire semester filming a dance documentary like we would a normal show. The logistics felt impossible; all of the campus spaces were closed, so we pooled resources to find studio time. We hired videographers from the city, were diligent with our 80+ member team stay on top of testing for COVID, and edited over 20 unique choreographies to string together into a dance film. At the end of the year, we all gathered in the same auditorium we usually would dance in, and watched the hour long showcase together. I was very emotional, seeing how resilient my team was in the face of the ongoing pandemic. I was proud of my leadership in this time as well, along with the many hours I put into video-editing, gathering traction on social media, and keeping morale up for our members.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f339839a-8dc5-4c0e-adaa-2364fc8ea92d\"}"},{"__ref":"Favorites:{\"uuid\":\"b7acd94f-27ad-45f7-847b-ad47a5236b21\"}"},{"__ref":"Favorites:{\"uuid\":\"03faafa2-c0e3-4845-b9d4-95980b6e889b\"}"}],"causesSupported":[],"major":"ENVIRONMENTAL ENGINEERING","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2e610279-1407-4849-b833-da484e37d466\"}"},{"__ref":"DeepDives:{\"uuid\":\"4977bf33-48b3-45b7-878a-318b535f8885\"}"},{"__ref":"DeepDives:{\"uuid\":\"6cd064cb-3d2f-4d70-991c-06c5933cab7e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f1accf33-60e8-44e7-b471-7fa1c94684b9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/31a7d31f-d344-4804-8bb8-6a6780d83993/-/preview/-/format/jpg/","https://ucarecdn.com/f47d5433-a866-4db2-99e4-aa7e08807133/-/preview/-/format/jpg/","https://ucarecdn.com/9559edf4-5dfb-49af-bd73-820e358f7909/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"99bd33a4-7800-4f39-80c4-09d7b0755247\"}"},{"__ref":"Education:{\"uuid\":\"64786661-cd3b-4cd3-a9a7-c06591d85003\"}"}],"hiredAt":"2026-01-28T18:15:26.202Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Physics","Writing","Spanish","Academic Coaching","College Essay Writing","K-6 Storybook","Visual Arts / Graphic Design","STEM Project","Sustainability"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mia-tran\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"829da029-1eab-41cf-ac13-992d4b9a6aaa\"}"}}},"_sentryTraceData":"34f292093dc54b25ab1d7cf2b5398421-80b58d3601e69924-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=34f292093dc54b25ab1d7cf2b5398421,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"mia-tran"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.a
