xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a3c37a21-4a96-46f5-b6c9-22f71038150f\"}":{"__typename":"Favorites","uuid":"a3c37a21-4a96-46f5-b6c9-22f71038150f","photoUrl":"https://ucarecdn.com/938bb658-7c9c-4bdc-84d5-d9f79efbfd34/","title":"Oakland, CA","type":"CITY"},"Favorites:{\"uuid\":\"eeab412e-9a40-4b35-b8d4-6e166eb9c971\"}":{"__typename":"Favorites","uuid":"eeab412e-9a40-4b35-b8d4-6e166eb9c971","photoUrl":"https://ucarecdn.com/938bb658-7c9c-4bdc-84d5-d9f79efbfd34/","title":"Ballet","type":"SPORT"},"Favorites:{\"uuid\":\"b0bfb3a3-8927-4178-b203-69c6c617ac66\"}":{"__typename":"Favorites","uuid":"b0bfb3a3-8927-4178-b203-69c6c617ac66","photoUrl":"https://ucarecdn.com/938bb658-7c9c-4bdc-84d5-d9f79efbfd34/","title":"The Chronicles of Narnia","type":"BOOK"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"6815cbb0-9b08-46f1-9571-9c2018b169e3\"}":{"__typename":"DeepDives","uuid":"6815cbb0-9b08-46f1-9571-9c2018b169e3","content":"\u003cp\u003eIn eighth grade, my science class learned about atoms. I was so fascinated by this lesson, that I challenged myself to learn about the smallest, most fundamental thing in the universe. That journey led me to \u003cstrong\u003estring theory\u003c/strong\u003e… and was the beginning of a passion project that I pursued the following year. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI conducted research, interviewed theoretical physicists, wrote a paper and gave a final presentation investigating the validity of this theory. I investigated, \u003cstrong\u003e\"What is the leading theory for the smallest building block in the universe?\"\u003c/strong\u003e \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you're interested in a similar research project, I'd love to guide you through the process.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5ca61a99-4271-46f7-bada-6f322492b760\"}":{"__typename":"DeepDives","uuid":"5ca61a99-4271-46f7-bada-6f322492b760","content":"\u003cp\u003eWhen I was in middle school, I found out that I had a \"learning disability.\" Sometimes, conventional teaching methods just didn't work for the way that my brain processed information. This made for some really frustrating homework nights. But, over time, I figured out cool organizational tricks  and study methods that finally clicked for me. Turns out, my learning difference was actually a superpower!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEvery student possesses the capability to define and achieve their version of success. I am particularly attuned to the diverse ways our brains, including those with dyslexia, ADHD, or memory deficits, embrace a distinctive and often more hands-on approach to learning. My commitment to mentorship is fueled by the desire to guide students through their own unique educational journeys, helping them unlock their potential and recognize the strengths inherent in their individual learning styles. I want to share what I've learned over the years to help kids define and achieve their own version of success. We can learn what works best for you together! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f0fe6672-39af-413c-a002-0eed42ec91fb\"}":{"__typename":"DeepDives","uuid":"f0fe6672-39af-413c-a002-0eed42ec91fb","content":"\u003cp\u003eCamp Counselor (and Minotaur Maze Designer!) at Camp Half-Blood \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d5fdeb8f-0482-4f2f-bbbd-c4d601d4041f\"}":{"__typename":"DeepDives","uuid":"d5fdeb8f-0482-4f2f-bbbd-c4d601d4041f","content":"\u003cp\u003eIt's OK to fail! It shows courage and is always an opportunity for growth :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2c2adb88-547c-4367-9462-68b684d76294\"}":{"__typename":"School","uuid":"2c2adb88-547c-4367-9462-68b684d76294","name":"Head-Royce School","city":"Oakland","type":"HIGH","state":"California","country":"United States","zip":"94602"},"Education:{\"uuid\":\"86db61d1-e363-4d8a-84d3-7922b48a04fd\"}":{"__typename":"Education","uuid":"86db61d1-e363-4d8a-84d3-7922b48a04fd","school":{"__ref":"School:{\"uuid\":\"2c2adb88-547c-4367-9462-68b684d76294\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"afec0873-1a89-4533-964b-2933163d9646\"}":{"__typename":"Education","uuid":"afec0873-1a89-4533-964b-2933163d9646","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"B.S. DESIGN, specializing in Human Behavior + Multi-stakeholder Research Methods Track","degree":null},"MentorPublicProfile:{\"uuid\":\"3e805586-a13b-44af-ab69-225c9009e7a3\"}":{"__typename":"MentorPublicProfile","uuid":"3e805586-a13b-44af-ab69-225c9009e7a3","displayName":"Kealia V.","slug":"kealia-rayne","biography":"\u003cp\u003e👋 \u003cstrong\u003eHello! I'm Kealia\u003c/strong\u003e, a creative with a passion for engineering and human behavior. I'm currently working towards my B.S. in Design at Stanford University. My journey into product design and visual design was inspired by my pre-professional career in ballet, where I learned the art of precision and connection.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eWhy choose me as your tutor? \u003c/strong\u003eMy tutoring style is all about making learning engaging and tailored to your unique needs. I value intellectual curiosity and exploration, and embracing fear of failure! I love finding fun ways to make learning hands-on. From tackling math mysteries to navigating literature landscapes, I'm here to make your academic journey a lot more enjoyable and a lot less overwhelming.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eIn my free time, \u003c/strong\u003eyou'll find me juggling various roles. I serve as the Senior Communications Designer for Stanford's Center for Teaching and Learning, bringing a touch of design flair to the world of education. We support evidence-based and inclusive learning and teaching practices, and raise awareness for learning disabilities. As the Philanthropy VP for Pi Phi, I'm dedicated to making a positive impact beyond the classroom. Additionally, I hold a professional research position within Stanford's Communications department, adding a bit of data-driven insight to the mix. And finally, I am a soloist for the Cardinal Ballet Company. Yes, dance and data can coexist!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eLet's connect.\u003c/strong\u003e I would love to meet you! I look forward to being part of your academic journey! 📚✨\u003c/p\u003e","teachingVideoPlaybackId":"TtVuZXlli8DZZ02bJ7H02kRYhKTT00wtfI3QOkTlFv2c6c","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a3c37a21-4a96-46f5-b6c9-22f71038150f\"}"},{"__ref":"Favorites:{\"uuid\":\"eeab412e-9a40-4b35-b8d4-6e166eb9c971\"}"},{"__ref":"Favorites:{\"uuid\":\"b0bfb3a3-8927-4178-b203-69c6c617ac66\"}"}],"causesSupported":[],"major":"B.S. DESIGN, specializing in Human Behavior + Multi-stakeholder Research Methods Track","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6815cbb0-9b08-46f1-9571-9c2018b169e3\"}"},{"__ref":"DeepDives:{\"uuid\":\"5ca61a99-4271-46f7-bada-6f322492b760\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0fe6672-39af-413c-a002-0eed42ec91fb\"}"},{"__ref":"DeepDives:{\"uuid\":\"d5fdeb8f-0482-4f2f-bbbd-c4d601d4041f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8f844756-c771-40b4-a3fa-e49595832353/-/preview/-/format/jpg/","https://ucarecdn.com/55af4786-8b0d-49f4-9899-e6831caf6111/-/preview/-/format/jpg/","https://ucarecdn.com/bbac977c-9467-4525-8ce9-10f6351daa61/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"86db61d1-e363-4d8a-84d3-7922b48a04fd\"}"},{"__ref":"Education:{\"uuid\":\"afec0873-1a89-4533-964b-2933163d9646\"}"}],"hiredAt":"2024-01-18T19:03:48.257Z","topics":[],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kealia-rayne\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3e805586-a13b-44af-ab69-225c9009e7a3\"}"}}},"_sentryTraceData":"c164969b607644658bd0fbce1da7bb47-9b45bad53fc89285-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-relea
