xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cd17184b-4395-4403-95ca-1bc2d9c29eb6\"}":{"__typename":"Favorites","uuid":"cd17184b-4395-4403-95ca-1bc2d9c29eb6","photoUrl":"https://ucarecdn.com/463bde49-5345-4b39-a2e7-ab367fe4d92e/","title":"Alex Morgan","type":"ATHLETE"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"4630c01a-f613-4dab-b68d-704a127f80c3\"}":{"__typename":"DeepDives","uuid":"4630c01a-f613-4dab-b68d-704a127f80c3","content":"\u003cp\u003eBeing the oldest child I have had to figure out my way through a lot of things for the first time, many things my parents did now know. When it came to my younger brother and sister I was able to transfer my experiences and advice to them and make their understanding of growing up less scary. We are all doing life for the first time and should support each other in any way possible!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"55aff62f-bcf5-4362-9ac2-9e261fcfc889\"}":{"__typename":"School","uuid":"55aff62f-bcf5-4362-9ac2-9e261fcfc889","name":"Suncoast Community High School","city":"Riviera Beach","type":"HIGH","state":"Florida","country":"United States","zip":"33404"},"Education:{\"uuid\":\"e4c46e49-d809-4c40-9ed3-7427599466d6\"}":{"__typename":"Education","uuid":"e4c46e49-d809-4c40-9ed3-7427599466d6","school":{"__ref":"School:{\"uuid\":\"55aff62f-bcf5-4362-9ac2-9e261fcfc889\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"d3e5e194-a7fc-4f96-b78d-01f0b111659e\"}":{"__typename":"Education","uuid":"d3e5e194-a7fc-4f96-b78d-01f0b111659e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"fd39d813-606e-4996-8ec9-0fa99e4dcd3d\"}":{"__typename":"MentorPublicProfile","uuid":"fd39d813-606e-4996-8ec9-0fa99e4dcd3d","displayName":"Lyla I.","slug":"lyla-ibrahimibrahiml","biography":"\u003cp\u003eHi, my name is Lyla!\u003c/p\u003e\u003cp\u003eI am a current Junior at Stanford studying computer science and aerospace engineering. I am from South Florida and consequently love surfing, skim boarding, and the beach! Some of my favorite skills and hobbies I have done include speech and debate, photography, and computer science outreach.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eComputer science outreach is super important to me and I believe everyone should have a chance to learn and experiment! Through high school I ran my school's Girls Who Code club and taught girls around my school how to code in various languages and even self-taught myself how to teach them how to take apart a computer and explain what parts.\u0026nbsp; Throughout college I have volunteered in local middle schools in elementary school so she's younger students how to code in Python.\u0026nbsp; One summer I even created a course on web design and taught young women in Kenya how to code in under 4 weeks!\u0026nbsp; I never had a role model in computer science growing up and want to help be a role model for other girls who want to learn and succeed in the field. Currently I'm president of Stanford women in computer science and continue to volunteer in my free time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm also a big fan of math and science and believe those skills on a base level are super important to learn and love teaching them as well.\u0026nbsp; I'm the eldest of three and have experience working with my little brother and sister on their college applications as well as tutoring them in various subjects from elementary to middle to high school. I am a fan of math, reading, science, and history as well!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the past I have worked with various age groups from preschool to 8th grade whether it was teaching them study skills tutoring them or even being a soccer coach for 4 years during my high school career.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have self taught myself skills such as web development and design, SQL and database writing, photography, graphic design, lightroom, and photoshop.\u003c/p\u003e\u003cp\u003eTo me some of the most important skills that I wished I had learned when I was younger was time management, learning how to put together a calendar, and study methods as well. I am super excited and happy to help your students and learn and teach what works best for them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond school I love surfing, animals, photography, graphic design, watching the English Premier League, and am a Miami Heat fan!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlways happy to answer any and every question and am super excited to work, learn, and grow with you all!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"vt01koPPzfyb7W1gMZ36chpNxcT5gBl4AUagWv4LI9Lk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"cd17184b-4395-4403-95ca-1bc2d9c29eb6\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4630c01a-f613-4dab-b68d-704a127f80c3\"}"}],"active":true,"profilePhotos
