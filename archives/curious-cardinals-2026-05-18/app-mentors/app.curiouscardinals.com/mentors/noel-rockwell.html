xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2bd8805b-d791-4c89-8128-d47d9d850c95\"}":{"__typename":"DeepDives","uuid":"2bd8805b-d791-4c89-8128-d47d9d850c95","content":"\u003cp\u003e“They won’t remember what you did or what you said, but they will remember how you made them feel.”\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA friend shared this sentiment with me in college, and I wish I had heard it years earlier. I was so concerned with “success” and approval in middle and high school—getting good grades, making the soccer team, being liked by everyone, etc. It was exhausting, and looking back, I realize that none of that truly matters.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy advice is to have integrity, in everything you do. Take the classes that genuinely interest you, not the ones you feel pressured to take. Surround yourself with friends who make you feel good just as you are, not the ones you are seeking approval from. Dedicate yourself to extracurriculars and causes that light a fire within you—those that bring you joy or fuel your passion. Treat others with kindness and empathy, and show up for them when they need help. I know this may all sound cliché, but I promise, when you act with integrity, you inherently become hardworking, passionate, interesting, and character-driven. In other words, you become what true success is. It’s not about perfect grades or prestigious awards, it’s about being authentic and trying your best.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"72705dee-d343-4cce-9860-99bd863c507d\"}":{"__typename":"DeepDives","uuid":"72705dee-d343-4cce-9860-99bd863c507d","content":"\u003cp\u003eI went into college completely open minded about my major, and for the first two years, I primarily focused on taking classes I found to be most interesting. This included a course called “The History of Reproductive Health in America” which served as a major catalyst for me. Soon enough, I realized almost all of my favorite classes were under the History of Health, Science, and Medicine major, which I could have never expected going into college. The major is usually most popular for students in pre-med, which I was not, and that honestly intimidated me a bit! But after talking to some professors and my academic advisors, I learned about a plethora of other academic and career opportunities that can come from the major, many of which I was completely elated by the prospect of. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eLong story short, I chose my major by following my genuine interests, and I couldn’t be happier with my decision!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"ac18d39d-8e9c-4d7e-b8b2-09b5240d8ce5\"}":{"__typename":"DeepDives","uuid":"ac18d39d-8e9c-4d7e-b8b2-09b5240d8ce5","content":"\u003cp\u003eDuring my sophomore year of college, I signed up for a session in the pottery studio—something I had experience with in high school, and was excited to get back into. While my first session went great, it was nearly impossible to book another after that, due to the limited studio hours and its popularity amongst students. I felt super frustrated. We had such an incredible resource for students to destress and create art, but there were hardly enough sessions to meet student demand. I ended up emailing my head of college about it, and she shared my concerns. She ultimately explained that there were not enough students with adequate experience to manage the studio. That’s when I knew I could step into help. Although it had been a few years since I took ceramics, I felt confident in being able to learn more to fill in the gaps. Throughout the remainder of college, I led pottery sessions 2-3 times per week, and cultivated a space where students could unplug from their academic stressors, gather with friends, listen to music, and work with clay. I met so many friends that I otherwise would have never met, and got to share the gift of ceramics with countless others. I am immensely proud of the space I contributed to, and none of it would have been possible had I not sent the email to ask if something could change.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"5a86f0ac-abb7-40f7-8c4d-ef39bef1b2c8\"}":{"__typename":"DeepDives","uuid":"5a86f0ac-abb7-40f7-8c4d-ef39bef1b2c8","content":"\u003cp\u003eMy mom! She made countless sacrifices to raise my brother and me, and I believe so much of my diligence and strength comes from her. All she wants for me is to live a happy and meaningful life—values I wholeheartedly share and strive to uphold.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"3488a5a0-8824-4e1a-86a2-5034e0c37f9b\"}":{"__typename":"School","uuid":"3488a5a0-8824-4e1a-86a2-5034e0c37f9b","name":"Archie Williams High School","city":"San Anselmo","type":"HIGH","state":"California","country":"United States","zip":"94960"},"Education:{\"uuid\":\"6c01774a-12db-4b0c-b748-a6f48efb0e40\"}":{"__typename":"Education","uuid":"6c01774a-12db-4b0c-b748-a6f48efb0e40","school":{"__ref":"School:{\"uuid\":\"3488a5a0-8824-4e1a-86a2-5034e0c37f9b\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"3d89bdbc-2f03-4c8b-aed2-62d46f2545ad\"}":{"__typename":"Education","uuid":"3d89bdbc-2f03-4c8b-aed2-62d46f2545ad","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"History of Health, Science, and Medicine","degree":null},"MentorPublicProfile:{\"uuid\":\"fafd901c-ac56-4b2a-9ed7-7f91f71edf9e\"}":{"__typename":"MentorPublicProfile","uuid":"fafd901c-ac56-4b2a-9ed7-7f91f71edf9e","displayName":"Noel R.","slug":"noel-rockwell","biography":"\u003cp\u003eHi there! I’m Noel, a recent graduate from Yale University, where I studied the History of Health, Science, and Medicine with a focus on women’s reproductive health.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up in a small town in the Bay Area and attending public schools, I faced the unique challenges of being a first-generation, low-income college student. From setting academic goals without familial guidance to balancing a part-time job with schoolwork and extracurriculars, these experiences taught me resilience, adaptability, and determination. I believe these qualities exist within every student like me, even if they haven’t fully recognized them yet. In my mentorship sessions, I aim to help students realize how their own life stories have shaped them, giving them powerful skills to pursue and create incredible opportunities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis journey also fueled my passion for causes I care about and helped me grow as a leader during high school. I served as student body president, editor-in-chief of the school newspaper, captain of the track and cross-country teams, and president of a peer support club for students with disabilities. These roles taught me that leadership begins long before the title is earned. I help students develop the skills to build trusting, supportive relationships, take creative risks, and maintain a positive, growth-oriented mindset throughout their academic and extracurricular endeavors.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, my heart lies in the humanities, and I’m eager to mentor students in AP U.S. History, AP World History, AP English Language \u0026amp; Composition, AP English Literature \u0026amp; Composition, AP Psychology, as well as journalism and creative writing courses.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore my senior year, I attended the Telluride Association Summer Program (TASP), which was a transformative educational experience outside the traditional classroom. It taught me the power of learning in democratic, diverse communities—an experience I couldn’t have had within my high school. If a student is interested in summer programs but finds the application process unclear, I’d love to help them navigate it and find the right fit.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, I continued to explore both academic and extracurricular activities that brought me joy. I worked as a reporter for the Yale Daily News, volunteered for the Legal Aid Association, and assisted in research on racial biases in court decisions. I made time for balance, too—whether it was managing the pottery studio, babysitting, going on long runs, or spending time with friends.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I’m deeply committed to addressing inequities in women’s reproductive healthcare. Over the past year, I worked with a reproductive health research organization, contributing to a privacy-centered app that provides secure access to abortions. In my mentorship sessions, I help students imagine how tools—like technology or e-commerce, as an example—can be leveraged for social good.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince graduating, I’ve spent four months traveling through Southeast Asia, where I also volunteered to teach English to children in Indonesia. Now that I’m back home, I’m excited to resume working with students, helping them discover and pursue their authentic interests, both in and out of the classroom.\u003c/p\u003e","teachingVideoPlaybackId":"fakjR6bfVvDFGAHKpNLd00sMCjvzAlYSMllD9TQP84OQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History of Health, Science, and Medicine","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2bd8805b-d791-4c89-8128-d47d9d850c95\"}"},{"__ref":"DeepDives:{\"uuid\":\"72705dee-d343-4cce-9860-99bd863c507d\"}"},{"__ref":"DeepDives:{\"uuid\":\"ac18d39d-8e9c-4d7e-b8b2-09b5240d8ce5\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a86f0ac-abb7-40f7-8c4d-ef39bef1b2c8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/389b3772-a341-4979-85e1-1144bb5a7496/-/preview/-/format/jpg/","https://ucarecdn.com/95737c2a-3b67-4f12-ade5-d671629e1931/-/preview/-/format/jpg/","https://ucarecdn.com/02b6d153-bdfb-43c3-b141-25abface10d1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6c01774a-12db-4b0c-b748-a6f48efb0e40\"}"},{"__ref":"Education:{\"uuid\":\"3d89bdbc-2f03-4c8b-aed2-62d46f2545ad\"}"}],"hiredAt":"2024-08-28T02:24:56.304Z","topics":["Writing","College Essay Writing","Medicine / Health","History","History Project","Race \u0026 Ethnicity","Sustainability","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"noel-rockwell\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fafd901c-ac56-4b2a-9ed7-7f91f71edf9e\"}"}}},"_sentryTraceData":"150ad30eea8044fa880e6587081b26d0-833cac0e759bdb74-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=150ad30eea8044fa880e6587081b26d0,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"noel-rockwell"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
