xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ce254840-b67b-400e-b15a-a286ee0db1e8\"}":{"__typename":"DeepDives","uuid":"ce254840-b67b-400e-b15a-a286ee0db1e8","content":"\u003cp\u003eI wish I found more tranquility and enjoyment in activities I was engaging in instead of being preoccupied with the outcome and how they would benefit me in the future.\u003cbr\u003eI would advise my past self to try to find relevance in every topic or subject, whether relating to my career aspirations or not because being multifaceted is one's biggest strength.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7248db81-c9ab-4dc1-95b2-e54b4e0f1c53\"}":{"__typename":"DeepDives","uuid":"7248db81-c9ab-4dc1-95b2-e54b4e0f1c53","content":"\u003cp\u003eIn my spare time, I like to:\u003cbr\u003e- Dance\u003cbr\u003e- Hike\u003cbr\u003e- Read\u003cbr\u003e- Have movie nights with my roommates\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"8bba6a21-4a17-424e-b3f0-f596a8e66d09\"}":{"__typename":"DeepDives","uuid":"8bba6a21-4a17-424e-b3f0-f596a8e66d09","content":"\u003cp\u003eI am fortunate to have grown up living in several countries in South America and Africa. I speak French, English, and Portuguese fluently, and have studied Spanish for 10 years.\u003cbr\u003eMy upbringing has given me a high level of cultural awareness and knowledge, and, overall important levels of understanding that unavoidably manifest in my teach style!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"7042740e-675e-4210-bc2b-3813b8e74fc6\"}":{"__typename":"Education","uuid":"7042740e-675e-4210-bc2b-3813b8e74fc6","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"History","degree":"BA"},"School:{\"uuid\":\"6044e886-c340-4929-8ae1-6b63e4c06b58\"}":{"__typename":"School","uuid":"6044e886-c340-4929-8ae1-6b63e4c06b58","name":"Lycée Français Blaise Pascal Abidjan","city":"Abidjan","type":"HIGH","state":"Lagunes","country":"Côte d'Ivoire","zip":"20016"},"Education:{\"uuid\":\"a92e731a-2741-4ea6-bd29-44ad88fbbd55\"}":{"__typename":"Education","uuid":"a92e731a-2741-4ea6-bd29-44ad88fbbd55","school":{"__ref":"School:{\"uuid\":\"6044e886-c340-4929-8ae1-6b63e4c06b58\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ecd6a40c-0c48-4f2e-9434-a2e871cadab3\"}":{"__typename":"MentorPublicProfile","uuid":"ecd6a40c-0c48-4f2e-9434-a2e871cadab3","displayName":"Maëlle T.","slug":"maelle-tanoh","biography":"\u003cp\u003eHi! My name is \u003cstrong\u003eMaëlle Tanoh\u003c/strong\u003e (\u003cem\u003epronounced muh-elle/ma-elle\u003c/em\u003e), and I graduated from \u003cstrong\u003eYale University\u003c/strong\u003e with a major in \u003cstrong\u003eHistory\u003c/strong\u003e. I now live in Chicago where i work in consulting. I grew up traveling and living in \u003cstrong\u003eBrazil, South Africa, Togo, Côte d'Ivoire, and the United States\u003c/strong\u003e, and I speak \u003cstrong\u003eFrench, English, Portuguese, and Spanish\u003c/strong\u003e fluently! My parents are from France and Côte d'Ivoire, and this rich cultural tapestry has profoundly influenced how I see the world. It has also inspired my passion for understanding the history and sociology of societies and exploring how historical insights can \u003cstrong\u003edrive meaningful change\u003c/strong\u003e in today’s society.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I’ve had the privilege of diving deeper into these interests through my coursework, but \u003cstrong\u003ehistory is just one of my many passions\u003c/strong\u003e! Outside the classroom, I led a \u003cstrong\u003ehip-hop dance team\u003c/strong\u003e, where I could delve into my creative mind and channel my love for performance into movement. Dance has been one of my greatest joys, a way to express myself and connect with others. I’m also an avid traveler and skier, always seeking my next adventure. (\u003cem\u003eFingers crossed I’ll hit the \u003c/em\u003e\u003cstrong\u003e\u003cem\u003e40- or 50-country milestone\u003c/em\u003e\u003c/strong\u003e\u003cem\u003e this year!\u003c/em\u003e)\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAnother dimension of me? \u003cstrong\u003eI’m deeply inspired by people, experiences, and the small joys of life.\u003c/strong\u003e Here are a few things that inspire me:\u003c/p\u003e\u003cp\u003e☆ \u003cem\u003e“It is not the answer that enlightens, but the question.”\u003c/em\u003e – Eugene Ionesco\u003cbr\u003e☆ \u003cem\u003e“The most beautiful thing we can experience is the mysterious. It is the source of all true art and all science.”\u003c/em\u003e – Albert Einstein\u003cbr\u003e☆ \u003cem\u003e“We are all different shades of the same thing, constantly changing in an attempt to find a balance between who we are and who we want to be.”\u003c/em\u003e – Unknown\u003c/p\u003e\u003cp\u003eThese reminders keep me grounded and encourage me to focus on \u003cem\u003econnection\u003c/em\u003e, taking life \u003cem\u003eone moment at a time\u003c/em\u003e, and cherishing the \u003cem\u003erelationships\u003c/em\u003e that make everything \u003cem\u003emeaningful\u003c/em\u003e.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs someone with a deep interest in \u003cstrong\u003ebusiness and entrepreneurship\u003c/strong\u003e, I’ve been part of a consulting club at Yale, which informed my understanding of how businesses work and how ideas are turned into impactful solutions. These experiences have sparked my curiosity about how historical and social insights intersect with today’s challenges, especially in the realms of leadership and innovation.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMost importantly, \u003cstrong\u003eI am a Curious Cardinals mentor\u003c/strong\u003e. Over the past year, I’ve guided students to pursue their \u003cstrong\u003eacademic goals and passion projects\u003c/strong\u003e, from making French learning fun to launching a podcast and blog. \u003cstrong\u003eMy mentees are my besties.\u003c/strong\u003e My ultimate goal is for us to create what feels like a hangout session—one where we are \u003cem\u003eproductive, creative, and genuinely enjoying the process of building something meaningful together\u003c/em\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Curious Cardinals, I’m excited to \u003cstrong\u003ehelp your child uncover what excites them most\u003c/strong\u003e, providing not just guidance but also encouragement and support. \u003cstrong\u003eI care deeply about forming close, fun, and impactful relationships with my mentees,\u003c/strong\u003e and I can’t wait to meet them!\u003c/p\u003e","teachingVideoPlaybackId":"pglwFpUtr9dGqZg00zerPeW2TqNrOLJwDfG0101yr0062LQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ce254840-b67b-400e-b15a-a286ee0db1e8\"}"},{"__ref":"DeepDives:{\"uuid\":\"7248db81-c9ab-4dc1-95b2-e54b4e0f1c53\"}"},{"__ref":"DeepDives:{\"uuid\":\"8bba6a21-4a17-424e-b3f0-f596a8e66d09\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/77d94f79-d5b9-494d-a8b1-9a5494ce7cd9/-/preview/-/format/jpg/","https://ucarecdn.com/789f65a1-ca43-4315-ad51-a02182139677/-/preview/-/format/jpg/","https://ucarecdn.com/79497834-2286-4b36-aeaa-5e7b9c8247b9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7042740e-675e-4210-bc2b-3813b8e74fc6\"}"},{"__ref":"Education:{\"uuid\":\"a92e731a-2741-4ea6-bd29-44ad88fbbd55\"}"}],"hiredAt":"2023-09-16T14:49:07.769Z","topics":["Writing","French","Spanish","Academic Coaching","College Essay Writing","Executive Function","History","Reading","Creative Writing","Fashion / Cosmetics","History Project","Debate","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maelle-tanoh\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ecd6a40c-0c48-4f2e-9434-a2e871cadab3\"}"}}},"_sentryTraceData":"4720246fb7f04605bec23650737491d3-8387c479d52d6788-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc58
