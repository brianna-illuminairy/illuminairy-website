xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7f46cf68-e5e2-4649-aaa9-fb3b5afa956f\"}":{"__typename":"Favorites","uuid":"7f46cf68-e5e2-4649-aaa9-fb3b5afa956f","photoUrl":"https://ucarecdn.com/6a1ec65e-ac54-43ba-83ba-c54bda69ca91/","title":"Clint Eastwood","type":"ACTOR"},"Favorites:{\"uuid\":\"bd29274c-2395-4be6-a73b-9b35f1facc81\"}":{"__typename":"Favorites","uuid":"bd29274c-2395-4be6-a73b-9b35f1facc81","photoUrl":"https://ucarecdn.com/6a1ec65e-ac54-43ba-83ba-c54bda69ca91/","title":"Clint Eastwood","type":"ACTOR"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"1ea2bbc1-382a-477f-b6c3-b1a687a35994\"}":{"__typename":"DeepDives","uuid":"1ea2bbc1-382a-477f-b6c3-b1a687a35994","content":"\u003cp\u003eI am extremely proud of myself for moving across the country to attend college, making so many friends, and building a home away from home. I gained valuable skills regarding independence, which will be useful throughout life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7d2e93aa-9c96-4bcc-8f1b-26e2a1b66c4b\"}":{"__typename":"DeepDives","uuid":"7d2e93aa-9c96-4bcc-8f1b-26e2a1b66c4b","content":"\u003cp\u003eMentorship matters to me because everyone should have someone they feel comfortable coming to for advice. I want to be able to guide those who are younger and less experienced than me through their education, careers, and life in general by sharing my experiences and what I have learned from them. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"956461ad-e9bd-467c-8c08-309c2e2c4186\"}":{"__typename":"DeepDives","uuid":"956461ad-e9bd-467c-8c08-309c2e2c4186","content":"\u003cp\u003eIn my lifetime, I hope to accomplish complete freedom. Where I can travel freely, not being restricted by work, school, or money. I want to be able to provide a good childhood to my children and raise them well. To accomplish this, I must work hard now so I don't have to later and make smart decisions within my career and lifestyle choices.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9f447e78-6e50-463f-b8e5-c85cf74fb81c\"}":{"__typename":"DeepDives","uuid":"9f447e78-6e50-463f-b8e5-c85cf74fb81c","content":"\u003cp\u003eI spent my summers in high school being a kid. Growing up in Florida, it was like growing up on a big playground. In the summers, my friends and I would spend the weekends at the beach, afternoons fishing the neighborhood ponds, playing in soccer tournaments, basketball at the park, living the childhood a child should have. I also worked at a wakeboarding cable park, working as a lifeguard and camp counselor, spending my days in the sun.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uu
