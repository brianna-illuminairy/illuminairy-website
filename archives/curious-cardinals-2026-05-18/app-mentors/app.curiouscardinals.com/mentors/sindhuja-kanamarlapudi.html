e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"a67adf03-eecd-4a5a-8c50-d8d5306a3933\"}":{"__typename":"DeepDives","uuid":"a67adf03-eecd-4a5a-8c50-d8d5306a3933","content":"\u003cp\u003eI love to read all sorts of new genres - I recently picked up a book centered around deep space exploration!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"32a9f961-2e54-4211-a2d7-1e7671340742\"}":{"__typename":"DeepDives","uuid":"32a9f961-2e54-4211-a2d7-1e7671340742","content":"\u003cp\u003eI volunteered at my local library, did service work as a Girl Scout, and played tennis for my school team!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"eb81fdb3-cefe-4da5-8529-ce77409f722f\"}":{"__typename":"DeepDives","uuid":"eb81fdb3-cefe-4da5-8529-ce77409f722f","content":"\u003cp\u003eI enjoy baking, painting, hiking, and making Spotify playlists.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e1bfb545-a89f-43a3-ae10-a379ebd46ceb\"}":{"__typename":"School","uuid":"e1bfb545-a89f-43a3-ae10-a379ebd46ceb","name":"Avon Grove High School","city":"West Grove","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19390"},"Education:{\"uuid\":\"01b5d3e9-3db5-420a-a180-71d62b6cff3f\"}":{"__typename":"Education","uuid":"01b5d3e9-3db5-420a-a180-71d62b6cff3f","school":{"__ref":"School:{\"uuid\":\"e1bfb545-a89f-43a3-ae10-a379ebd46ceb\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"e09f92eb-e74a-48f0-81db-17f4b0e891d7\"}":{"__typename":"Education","uuid":"e09f92eb-e74a-48f0-81db-17f4b0e891d7","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"1b834a6b-1ce6-434f-86b4-a561520e23d3\"}":{"__typename":"MentorPublicProfile","uuid":"1b834a6b-1ce6-434f-86b4-a561520e23d3","displayName":"Sindhuja K.","slug":"sindhuja-kanamarlapudi","biography":"\u003cp\u003eHi! My name is Sindhuja, and I’m currently a student at Princeton University, where I study economics and cognitive science. My academic interests reflect my curiosity about both how people think and how societies function. I love exploring the intersection between human decision-making and broader economic systems, and I’m excited by the ways research in these fields can inform real-world problem-solving.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, one of my biggest passions is mentoring and tutoring students. I’ve worked with learners of various ages and backgrounds, and I’ve found that each student teaches me something new. I believe education is a two-way street: while I help students grasp challenging concepts and develop confidence, they share fresh perspectives that expand my own understanding. These connections often go beyond academics, turning into lasting relationships built on trust, encouragement, and shared curiosity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also deeply interested in fostering inclusive and supportive learning environments. Having benefited from great mentors myself, I know how powerful it can be when someone believes in you. That’s why I strive to create spaces where students feel safe asking questions, making mistakes, and growing through the process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA fun fact about me: I have a black belt in Tang Soo Do, a traditional Korean martial art. Training in Tang Soo Do has taught me discipline, focus, and perseverance - qualities that carry over into both my academic work and my approach to challenges in life. Martial arts also emphasize respect and humility, values that shape the way I interact with others in any setting.\u003c/p\u003e\u003cp\u003eIn my free time, I enjoy reading widely, from behavioral economics books to mystery novels, and I’m always on the lookout for new podcasts that challenge the way I think. I also love spending time outdoors, whether that means hiking, exploring new places, or simply enjoying a sunny afternoon on campus.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLooking ahead, I hope to continue combining my interests in economics, cognitive science, and education. Whether through research, policy, or hands-on teaching, I’m committed to contributing to work that makes knowledge more accessible and empowers people to make informed decisions. For me, learning isn’t just something that happens in a classroom. It’s a lifelong journey, and I’m grateful to be both a student and a teacher along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, what drives me most is curiosity about people, ideas, and the world around me. I’m fascinated by the stories and motivations that shape human behavior, and I believe that understanding these can help bridge differences, solve complex problems, and inspire meaningful change. No matter where my life takes me, I want to keep asking questions, building connections, and using what I learn to make a positive impact.\u003c/p\u003e","teachingVideoPlaybackId":"O6wHNveP00Ox3f01u5v2w02TYHBupUgZI3em02dFRql8s008","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGetting the highest honor in Girl Scouts - my Gold Award!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"133885a6-8a7e-4201-8c1a-65bc0190e8a6\"}"},{"__ref":"Favorites:{\"uuid\":\"820bf42f-758d-4c73-923c-5092189417b9\"}"},{"__ref":"Favorites:{\"uuid\":\"8a13d657-d944-4e7c-aac1-92914b37ef2f\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6120d017-5471-4463-86ed-5c869c011ead\"}"}],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"327f3b06-1896-46e7-a4f8-85b9e587299d\"}"},{"__ref":"DeepDives:{\"uuid\":\"a67adf03-eecd-4a5a-8c50-d8d5306a3933\"}"},{"__ref":"DeepDives:{\"uuid\":\"32a9f961-2e54-4211-a2d7-1e7671340742\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb81fdb3-cefe-4da5-8529-ce77409f722f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ddcca826-62c5-492c-8391-0f1853cd0227/-/preview/-/format/jpg/","https://ucarecdn.com/7b1519c2-24f9-4c83-a26b-2731e9ad07c6/-/preview/-/format/jpg/","https://ucarecdn.com/9c390f6e-c22c-43a2-bb0a-ad99b0680eb6/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"01b5d3e9-3db5-420a-a180-71d62b6cff3f\"}"},{"__ref":"Education:{\"uuid\":\"e09f92eb-e74a-48f0-81db-17f4b0e891d7\"}"}],"hiredAt":"2025-08-13T21:05:15.779Z","topics":["Algebra I","Algebra II","Calculus","Pre-Algebra","Biology","Academic Coaching","College Essay Writing","Economics","Executive Function","Reading"],"communityBadges":["https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sindhuja-kanamarl
