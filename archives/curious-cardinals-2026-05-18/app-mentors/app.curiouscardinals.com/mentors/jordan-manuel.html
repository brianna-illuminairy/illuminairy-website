xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b08be0f8-392e-4a89-b114-560b90669ae8\"}":{"__typename":"Favorites","uuid":"b08be0f8-392e-4a89-b114-560b90669ae8","photoUrl":"https://ucarecdn.com/29ecd995-c24a-4cdd-b61f-407ce667345b/","title":"Black Swan","type":"MOVIE"},"Favorites:{\"uuid\":\"baa79c34-a8e3-4b62-840c-68bc222cae15\"}":{"__typename":"Favorites","uuid":"baa79c34-a8e3-4b62-840c-68bc222cae15","photoUrl":"https://ucarecdn.com/f5b5f469-d69a-4f30-8348-0d75d3df2db3/","title":"Think Like a Monk","type":"BOOK"},"Favorites:{\"uuid\":\"431f1116-d26b-4f9f-baed-8f62a2f28b3e\"}":{"__typename":"Favorites","uuid":"431f1116-d26b-4f9f-baed-8f62a2f28b3e","photoUrl":"https://ucarecdn.com/bb31bb3e-e9da-4312-94f9-d10c017da430/","title":"Melophobia by Cage the Elephant","type":"ALBUM"},"CausesSupported:{\"uuid\":\"8153fde8-e80f-46ff-ae4d-c2814c935bf9\"}":{"__typename":"CausesSupported","uuid":"8153fde8-e80f-46ff-ae4d-c2814c935bf9","name":"The Adrienne Arsht Center for the Performing Arts","description":"\u003cbr\u003e","photoUrl":"https://ucarecdn.com/c72661a5-98f5-400e-923b-b71f29ae3672/"},"CausesSupported:{\"uuid\":\"098159a4-965c-4f24-8004-a7bad781041c\"}":{"__typename":"CausesSupported","uuid":"098159a4-965c-4f24-8004-a7bad781041c","name":"Hispanic Scholarship Fund","description":"","photoUrl":"https://ucarecdn.com/7c17f06f-5d86-4e93-8366-a2a212349ade/"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"d4e78635-fedb-43de-bb2e-3a8cf6503f4c\"}":{"__typename":"DeepDives","uuid":"d4e78635-fedb-43de-bb2e-3a8cf6503f4c","content":"\u003cp\u003eAs a high school student, I always prioritized balancing academic and social life. I was heavily involved in school, having been Student Government President for four years and an AP/IB student. But I also made sure to spend my weekends hanging out with my friends, enjoying Downtown Miami, and spontaneous after-school trips to the beach! I firmly believe I could handle a heavy workload because I understood how important it was to enjoy my high school experience and be present!  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"7abc0601-2584-41aa-a09d-57250e01dee8\"}":{"__typename":"DeepDives","uuid":"7abc0601-2584-41aa-a09d-57250e01dee8","content":"\u003cp\u003eSomething about me that isn't obvious right away is my love for self-help books! I deeply enjoy learning about philosophies on internal peace, mediation, and how to live a life filled with purpose and gratitude! They are such vital characteristics for living a life with intention. I am currently reading a book about the Japanese philosophies of Wabi-Sabi.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"af61d7bd-facf-4447-8175-103bab2e2a2e\"}":{"__typename":"DeepDives","uuid":"af61d7bd-facf-4447-8175-103bab2e2a2e","content":"\u003cp\u003eIn my spare time, I find joy in journaling, reading self-help books, and exploring all the beaches Miami has to offer! I always try to give myself moments to destress, ground my energy, and appreciate the world around me!\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"044b75da-a131-4be0-ad99-423823954dbf\"}":{"__typename":"DeepDives","uuid":"044b75da-a131-4be0-ad99-423823954dbf","content":"\u003cp\u003eDuring my summers in high school, I made a clear effort to volunteer at local shelters, network with college students to learn about the admissions process, and travel with family and friends! During my junior summer, I specifically spent three weeks on-campus at the Wharton School of the University of Pennsylvania for their premier business leadership program! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"6e531bba-aaf3-4e8e-8bbd-c95f8aa6cf38\"}":{"__typename":"School","uuid":"6e531bba-aaf3-4e8e-8bbd-c95f8aa6cf38","name":"Coral Reef High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33157"},"Education:{\"uuid\":\"8466dc1c-da5e-4138-bc23-e34abe54c64d\"}":{"__typename":"Education","uuid":"8466dc1c-da5e-4138-bc23-e34abe54c64d","school":{"__ref":"School:{\"uuid\":\"6e531bba-aaf3-4e8e-8bbd-c95f8aa6cf38\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"8b31c557-5a6b-40fa-b493-2999e5737183\"}":{"__typename":"Education","uuid":"8b31c557-5a6b-40fa-b493-2999e5737183","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"2865d453-bc24-464a-91a5-49ce537eb468\"}":{"__typename":"MentorPublicProfile","uuid":"2865d453-bc24-464a-91a5-49ce537eb468","displayName":"Jordan C.","slug":"jordan-manuel","biography":"\u003cp\u003eJordan Cancel is a graduate from Coral Reef Senior High School, magna cum laude, with a Superintendents Diploma of Distinction. He graduated from the International Baccalaureate program with a concentration in economics. Jordan is passionate about understanding the world’s financial markets and their implications on policy.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Columbia University, Jordan intends to major in economics and eventually pursue a special concentration in business management. Enrolling in a leading academic institution, he was among ~50 students who were named Kluge Scholars out of the +57,000 applications to the university.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAn avid leader and spokesperson in his community, Jordan was a Miami Herald Silver Knight Nominee in Speech and won a State-Semifinalist title with Future Business Leaders of America. Jordan has interned at Miami’s #1 luxury boutique real estate firm and with School Board Member Luisa Santos, where he led a 15-person team fighting for educational equity. He has also presented multiple times at the Wharton School of the University of Pennsylvania.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn his free time, Jordan enjoys hiking, exploring new Jazz spots in NYC, and engaging with the Arts. He recently met with a Columbia University Art Archivist to develop a Scholars Capstone project titled \"Renowned Artistry and Power: An In-Depth Commentary on Columbia University's Acquisition of Florine Stettheimer’s Art Collection, the Largest in the World.\"\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHe is steadfast in his holistic approach to learning and developing students' interests in ways that meet them where they are. Jordan recognizes that learning and teaching are interdisciplinary at their core, with a clear understanding of what constitutes effective and engaging lessons that encourage progress! He first gained exposure to the benefits of learning through mentorship from life-changing high school teachers who helped him find his spark. He hopes to do the same for others!\u003c/p\u003e","teachingVideoPlaybackId":"bAq4sDqwhnmhk00udZSGuKfSkiBUegjuclul01mGFLRZo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn my first year, I decided to take an introductory Art History class where I crafted in-depth research papers, took tours of the MET on behalf of Columbia, and regularly met with my Professor. This was my first formal decision to take initiative in developing an interest in the arts, which was far out of line with my preprofessional history of business and finance. I even created a personal Capstone for my Scholars Program that delves into Columbia's acquisition of art!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b08be0f8-392e-4a89-b114-560b90669ae8\"}"},{"__ref":"Favorites:{\"uuid\":\"baa79c34-a8e3-4b62-840c-68bc222cae15\"}"},{"__ref":"Favorites:{\"uuid\":\"431f1116-d26b-4f9f-baed-8f62a2f28b3e\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8153fde8-e80f-46ff-ae4d-c2814c935bf9\"}"},{"__ref":"CausesSupported:{\"uuid\":\"098159a4-965c-4f24-8004-a7bad781041c\"}"}],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d4e78635-fedb-43de-bb2e-3a8cf6503f4c\"}"},{"__ref":"DeepDives:{\"uuid\":\"7abc0601-2584-41aa-a09d-57250e01dee8\"}"},{"__ref":"DeepDives:{\"uuid\":\"af61d7bd-facf-4447-8175-103bab2e2a2e\"}"},{"__ref":"DeepDives:{\"uuid\":\"044b75da-a131-4be0-ad99-423823954dbf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f26dcdb8-9dfa-46b5-84db-3cd242e33ece/-/preview/-/
