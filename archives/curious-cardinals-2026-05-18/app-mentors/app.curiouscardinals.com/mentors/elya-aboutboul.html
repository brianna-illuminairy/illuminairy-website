xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"d3202e07-99cc-48a3-b8b8-410248384716\"}":{"__typename":"DeepDives","uuid":"d3202e07-99cc-48a3-b8b8-410248384716","content":"\u003cp\u003eVERY, very shy! But as I deepened my connection with art, I became a little more confident. My art started speaking for me, expressing the things I was hesitant to say myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7435c130-0e16-417c-a09d-aa10d3d74eb9\"}":{"__typename":"DeepDives","uuid":"7435c130-0e16-417c-a09d-aa10d3d74eb9","content":"\u003cp\u003eWithout the mentors who showed interest and belief in my work and curiosity, I’m sure I wouldn’t be where I am today. It’s thanks to those who invested in me that I feel inspired to take on that role myself. I believe education is the only way to bring change, and creative education is revolutionary—one that I am committed to advancing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"754023f0-605a-4fcb-974d-caf203871973\"}":{"__typename":"DeepDives","uuid":"754023f0-605a-4fcb-974d-caf203871973","content":"\u003cp\u003eObservation, play, collaboration, and reading.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"dd372794-9244-4233-92d5-d3a0178eb270\"}":{"__typename":"DeepDives","uuid":"dd372794-9244-4233-92d5-d3a0178eb270","content":"\u003cp\u003eDuring my 3rd year of university, I embarked on a creative research project exploring the sonic and sculptural elements of the L.A. Freeways. The house I’ve lived in for the past 12 years sits right off the freeway, and its presence has been constant—woven into my daily life, whether I’m walking my dog, chatting with family, or falling asleep to its hum.\u003c/p\u003e\u003cp\u003eFor about a year, I immersed myself in studying the freeway: reading, field recording, photographing, and sculpting. The final project was an installation featuring two instruments I built, which played the resonances of my freeway recordings—composed into 30-minute tracks. These instruments were surrounded by cement objects I sculpted in response to the freeway’s roads, or its \"body,\" if you will.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also am a first generation student and I completed a double major! I guess I am pretty proud of that, too:)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"e899a9c9-0d60-4bc0-a5aa-d7b6a4efa453\"}":{"__typename":"School","uuid":"e899a9c9-0d60-4bc0-a5aa-d7b6a4efa453","name":"LACHSA (Los Angeles County High School for the Arts)","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90032"},"Education:{\"uuid\":\"a54c7942-642c-4531-b318-3fccf9637da8\"}":{"__typename":"Education","uuid":"a54c7942-642c-4531-b318-3fccf9637da8","school":{"__ref":"School:{\"uuid\":\"e899a9c9-0d60-4bc0-a5aa-d7b6a4efa453\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"ec850cb1-d1f2-4b30-aa58-47a8ae39db5d\"}":{"__typename":"Education","uuid":"ec850cb1-d1f2-4b30-aa58-47a8ae39db5d","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Art + Comparative Literature","degree":null},"MentorPublicProfile:{\"uuid\":\"396b6c3f-6d82-49ae-a4d6-f22ceb3b7965\"}":{"__typename":"MentorPublicProfile","uuid":"396b6c3f-6d82-49ae-a4d6-f22ceb3b7965","displayName":"Elya A.","slug":"elya-aboutboul","biography":"\u003cp\u003eHi :) I’m Elya Aboutboul-Bilia— artist, writer, translator (of things seen and unseen), and a lifelong explorer of lines, borders, and the spaces in between. I hold a double B.A. in Fine Art and Comparative Literature from UCLA, where I spent my time drawing, sculpting, translating, and occasionally building instruments out of freeway frequencies.\u003c/p\u003e\u003cp\u003eMy work has been supported by the UCLA Undergraduate Research Fellowship, the Stark Scholarship, and the Merage Scarry Art Award, among others. I’ve exhibited in solo and group shows from Los Angeles to Tel Aviv, worked as a studio assistant for artists like Yung Jake and Lizabeth Young, and taught art to students of all abilities at Lowman Special Education and Career Transition Center. Somewhere along the way, I also coordinated for Supporters of Standing Together LA, reinforcing my belief that art, politics, and community are always in conversation.\u003c/p\u003e\u003cp\u003eIf you ask me what I do, I’d say I play—with materials, language, and ideas. I see art as a form of translation, a way to process and reshape the world around us. My work often investigates how lines—whether drawn, built, written, or sonic—define space and identity. Recently, I’ve been making my own paper, breaking down and reconstructing material histories, exploring how transformation can be both an act of destruction and renewal.\u003c/p\u003e\u003cp\u003eI’m fascinated by the spaces where disciplines blur, where language becomes material, and sound takes on physical form. Whether in the studio, the classroom, or the streets of a new city, I’m always looking for new ways to listen, translate, and reimagine.\u003c/p\u003e","teachingVideoPlaybackId":"qpqtvNKJkXA1V3NCSkfgczt35s3E02XNHj01j6E2Rgocw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Art + Comparative Literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d3202e07-99cc-48a3-b8b8-410248384716\"}"},{"__ref":"DeepDives:{\"uuid\":\"7435c130-0e16-417c-a09d-aa10d3d74eb9\"}"},{"__ref":"DeepDives:{\"uuid\":\"754023f0-605a-4fcb-974d-caf203871973\"}"},{"__ref":"DeepDives:{\"uuid\":\"dd372794-9244-4233-92d5-d3a0178eb270\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f856db71-24f3-44b8-b5c3-ca0c00fdb2f5/-/preview/-/format/jpg/","https://ucarecdn.com/fa52f541-5ee4-44fd-a513-994768a6003f/-/preview/-/format/jpg/","https://ucarecdn.com/e5c3a2ad-e65b-48b5-8fa7-e88321fbfc7d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a54c7942-642c-4531-b318-3fccf9637da8\"}"},{"__ref":"Education:{\"uuid\":\"ec850cb1-d1f2-4b30-aa58-47a8ae39db5d\"}"}],"hiredAt":"2025-02-18T10:35:22.702Z","topics":["Writing","Executive Function","College Essay Writing","Reading","Academic Coaching","History","Creative Writing","Visual Arts / Graphic Design","Music","Video / Pho
