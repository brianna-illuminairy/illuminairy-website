xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"6d7494c8-b6df-418b-abf0-ec00ffa7f071\"}":{"__typename":"DeepDives","uuid":"6d7494c8-b6df-418b-abf0-ec00ffa7f071","content":"\u003cp\u003eI have always wanted to make YouTube videos, as it felt like an incredible opportunity to \"teach the entire world\" by posting public videos. I oscillated for a while, as it was a completely new skill that I had no experience in, and I was a bit shy about putting myself out there for the whole world to see.\u003cbr\u003e\u003cbr\u003eHowever, in early 2023 I decided it was time to face my fears, step outside of my comfort zone, and give it a shot. On my channel, I currently make videos that teach computer science students how to solve common technical interview questions. In the future, I am planning to make videos about studying computer science in school, applying to graduate programs, and other career advice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3df69a80-d20a-4e16-8864-22754a4d59ce\"}":{"__typename":"DeepDives","uuid":"3df69a80-d20a-4e16-8864-22754a4d59ce","content":"\u003cp\u003eI would tell myself that I should go on more adventures. \u003cbr\u003e\u003cbr\u003eWhen I say adventures, I mean anything fun and exciting, no matter how large or small. An adventure can be going to dinner with friends, or moving halfway around the world, or anything in between.\u003cbr\u003e\u003cbr\u003eThe reason I would give myself this advice is because I was incredibly boring during undergrad - I basically studied all day, everyday. I was so concerned about my academic performance that I rarely left campus, and although I did well, I regret that I was so disciplined. During the past 2 years, I have discovered my fun side, and have made it a goal to go on as many adventures as I can. It has made such a huge positive difference in my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"202a5f90-d088-46e0-8b17-55310e603e2a\"}":{"__typename":"DeepDives","uuid":"202a5f90-d088-46e0-8b17-55310e603e2a","content":"\u003cp\u003eI attribute a large part of my success to the mentors that I've had in my life. In undergrad, I had incredible professors who took an interest in my success, and worked with me to improve both my academics and my life skills. I am forever indebted to their kindness, as it allowed me to find my passions, nurture them, and craft a plan to pursue them each and every day.\u003cbr\u003e\u003cbr\u003eMy mentors inspired me to not only pay it forward, but to find an immense amount of joy in serving as a mentor to others. To this day, one of my favorite feeling in the world is when a student I am teaching/mentoring finally sees the concept we are talking about \"click\" in a new way, and everything makes sense to them.\u003cbr\u003e\u003cbr\u003eMy mentors were some of the most meaningful and important people in my life, so I know how impactful and formative my mentorship can be for future students and I hope to help them in any way that I can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c84e1d9f-f894-4193-a802-4c77c091673a\"}":{"__typename":"DeepDives","uuid":"c84e1d9f-f894-4193-a802-4c77c091673a","content":"\u003cp\u003eMy dream is to wake up every morning at sunrise, get a quick workout in, then drive to a university where I get to teach all day long. I'd love to give lectures in computer science, ideally the introductory courses where I can specialize in teaching people how to program for the first time. These are my favorite courses to teach because I can make a huge impact on if students enjoy programming and how they build their important foundational skills.\u003cbr\u003e\u003cbr\u003eAs part of my job, I would also like to conduct research in computer science education, which is the field that asks \"how can we make computer science even easier to teach and learn?\" For this work, I would build new tools that make programming more fun to learn in the classroom, and I would test these tools on my own students to see how effective they are.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"ba7a6e4e-471c-4cd7-862b-214a7e9da84b\"}":{"__typename":"School","uuid":"ba7a6e4e-471c-4cd7-862b-214a7e9da84b","name":"The University of Edinburgh","city":"Edinburgh","type":"HIGH","state":"Scotland","country":"United Kingdom","zip":"EH3 9DS"},"Education:{\"uuid\":\"37a9cf09-156e-4318-b9e5-47e8ef3b5c6a\"}":{"__typename":"Education","uuid":"37a9cf09-156e-4318-b9e5-47e8ef3b5c6a","school":{"__ref":"School:{\"uuid\":\"ba7a6e4e-471c-4cd7-862b-214a7e9da84b\"}"},"startYear":"2022","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"f2da0b6d-d8b4-45aa-b413-bf6eeca2a886\"}":{"__typename":"School","uuid":"f2da0b6d-d8b4-45aa-b413-bf6eeca2a886","name":"University of Cambridge","city":"Cambridge","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"CB2 1TN"},"Education:{\"uuid\":\"926ca0cc-8e9d-42ca-a341-4dbc10de7724\"}":{"__typename":"Education","uuid":"926ca0cc-8e9d-42ca-a341-4dbc10de7724","school":{"__ref":"School:{\"uuid\":\"f2da0b6d-d8b4-45aa-b413-bf6eeca2a886\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"566af956-30bc-4625-8136-05723132a54d\"}":{"__typename":"MentorPublicProfile","uuid":"566af956-30bc-4625-8136-05723132a54d","displayName":"Colton B.","slug":"colton-botta","biography":"\u003cp\u003eAfter completing my undergraduate in Computer Science and Entrepreneurship at NC State, I was awarded a Marshall Scholarship to pursue two Master's degrees in the United Kingdom. So, I packed my bags and left the US (for the very first time!!) to embark on the greatest adventure of my life. The past 2 years have been beyond incredible, as I've studied Cognitive Science and Artificial Intelligence at the University of Edinburgh and University of Cambridge, respectively. I have loved the UK so much that I'm planning to stay for my PhD.\u003cbr\u003e\u003cbr\u003eAbove ALL else, I am passionate about teaching. Even though I have worked as a Software Engineer for over 4 years, I always tell people that my all time favorite job was as a teaching assistant at NC State, and as a lecturer for Stanford's Introduction to Python course. There is no place I find more joy than in the classroom, and I hope to work as a college professor after the completion of my PhD.\u003cbr\u003e\u003cbr\u003eAs much as I love teaching and learning, I am a big believer in work-life balance and spend a lot of time outside of the classroom pursuing my (many) hobbies. I am a competitive Rubik's Cube Solver, which makes me sound like a huge nerd (I am) but I am also an athlete and play competitive hockey, golf, and tennis. I also love being outdoors, especially hiking and running. Finally, I am an avid traveler and have visited 25 countries in my 2 years living in the UK!\u003cbr\u003e\u003cbr\u003eWhile I am excited about teaching and/or tutoring your student, I am equally excited to connect with them as a mentor to unlock their curiosity and passion both inside and outside the classroom!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIt has been over two years since I was awarded a Marshall Scholarship, but it is still the greatest achievement of my life.\u003cbr\u003e\u003cbr\u003eThe Marshall is a prestigious fellowship that fully funds 2 years of graduate work in the UK at any university of our choosing. Each year, about 45 scholars are selected from the US. I chose to attend the University of Edinburgh and the University of Cambridge, and the Marshall Scholarship paid for my tuition, flights to and from the UK, my visa application, books, and a monthly living stipend.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6d7494c8-b6df-418b-abf0-ec00ffa7f071\"}"},{"__ref":"DeepDives:{\"uuid\":\"3df69a80-d20a-4e16-8864-22754a4d59ce\"}"},{"__ref":"DeepDives:{\"uuid\":\"202a5f90-d088-46e0-8b17-55310e603e2a\"}"},{"__ref":"DeepDives:{\"uuid\":\"c84e1d9f-f894-4193-a802-4c77c091673a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8c628521-8555-4786-99ed-91cec14033a4/-/preview/-/format/jpg/","https://ucarecdn.com/ef41f7e1-6a1b-45d2-9777-f61aaf4d8c40/-/preview/-/format/jpg/","https://ucarecdn.com/e9bc8699-5317-4668-a5b5-acd3e6d8b0af/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"37a9cf09-156e-4318-b9e5-47e8ef3b5c6a\"}"},{"__ref":"Education:{\"uuid\":\"926ca0cc-8e9d-42ca-a341-4dbc10de7724\"}"}],"hiredAt":"2023-10-13T12:21:02.431Z","topics":["Coding / Programming","Machine Learning / AI","Web Design","Finance / Investing","Business / Entrepreneurship","Algebra I","Algebra II","Calculus","Geometry","Pre-Algebra","K-5 Grade Math","Precalculus / Trigonometry","Statistics","Writing","Public Speaking","Sports Analytics","6-8 Grade Science"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/","https://ucarecdn.com/dbb85a97-5baf-4c25-858e-d5d38d0a7f9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"colton-botta\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"566af956-30bc-4625-8136-05723132a54d\"}"}}},"_sentryTraceData":"bcb71a8db59448e8b3b3b48b83697e89-ad8bebf4817b0685-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=bcb71a8db59448e8b3b3b48b83697e89,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"colton-botta"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html
