xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a744c1b3-7b3a-4d34-9937-195075ee23b3\"}":{"__typename":"DeepDives","uuid":"a744c1b3-7b3a-4d34-9937-195075ee23b3","content":"\u003cp\u003eMentorship matters to me because I know firsthand how powerful it can be to have someone believe in you and help you see possibilities you didn’t know existed. When I first started debating, I didn’t have access to private coaches or extra resources. What made the difference for me was the passion and guidance of people who stepped in and shared what they knew, even when they didn’t have to.\u003c/p\u003e\u003cp\u003eThat experience inspired me to give back. While coaching at Dynamic Debate Academy, I worked with a student named Abdullah from a low-income school in Iowa. We spent just two weeks together during a summer program, but a few years later, he wrote me an email thanking me for everything I had taught him. He told me he never would have stayed involved in debate if it hadn’t been for that coaching.\u003c/p\u003e\u003cp\u003eThat message showed me that even small acts of mentorship can shape someone’s confidence, direction, and future. It taught me that being a mentor isn’t just about passing on skills — it’s about helping someone find their voice, feel seen, and realize what they’re capable of.\u003c/p\u003e\u003cp\u003eMentorship gives me a chance to pay forward the support I received, and to help students build not just knowledge, but a sense of purpose and self-belief. That’s why it matters to me so much.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"df8cd24a-e394-4761-a180-670d1d126ce9\"}":{"__typename":"DeepDives","uuid":"df8cd24a-e394-4761-a180-670d1d126ce9","content":"\u003cp\u003eAs a high school student, I was definitely curious and motivated, but I also struggled a lot with focus. I had pretty severe ADHD and was easily distracted, which made it hard to stay on top of all my classes and activities. I had to learn how to build strategies to manage my time and keep myself centered, like breaking big tasks into smaller steps and finding ways to connect assignments to things I was passionate about.\u003c/p\u003e\u003cp\u003eThose challenges taught me a lot about resilience and how to turn frustration into progress. By the end of high school, I had figured out how to channel my energy into debate and other interests I cared about, and that process really shaped who I am today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1fcbd106-533a-4cd8-b8d5-01ab993b7138\"}":{"__typename":"DeepDives","uuid":"1fcbd106-533a-4cd8-b8d5-01ab993b7138","content":"\u003cp\u003ebehavior. I wanted to understand not just how systems and policies work on paper, but how people actually respond to them in everyday life.\u003c/p\u003e\u003cp\u003eIn the Philosophy, Politics, and Economics (PPE) program at Penn, my concentration is in Choice and Behavior. This focus looks at how people make decisions, how they interact in markets, and what drives human behavior beyond just logic or economics alone. I find it really interesting to explore why people don’t always act in the ways that models predict, and how small shifts in incentives or information can change outcomes in surprising ways.\u003c/p\u003e\u003cp\u003eThis major lets me combine my interests in policy, economics, and human psychology, and it helps me think about solutions that are both practical and human-centered.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8e52938d-3c9f-4acc-89d7-5e0b31e90ce8\"}":{"__typename":"DeepDives","uuid":"8e52938d-3c9f-4acc-89d7-5e0b31e90ce8","content":"\u003cp\u003eIn my spare time, I’m a huge basketball guy. Whether I’m playing pick-up games with friends, watching NBA matchups, or analyzing player stats, basketball is a big part of my life. I’m also really interested in the data and strategy side of sports. I even built a sports betting API and an LLM-powered tool to help calculate expected value on bets, combining my love for sports with my interest in data science and programming. It’s been a fun way to explore how numbers and probabilities play out in real life, and it keeps me engaged with the game on a whole different level.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"edacbf48-64ba-487d-96b1-cb12cd981246\"}":{"__typename":"School","uuid":"edacbf48-64ba-487d-96b1-cb12cd981246","name":"American Heritage Schools, Broward Campus","city":"Plantation","type":"HIGH","state":"Florida","country":"United States","zip":"33325"},"Education:{\"uuid\":\"3bf7557f-f274-42c9-bc75-89be339d95e2\"}":{"__typename":"Education","uuid":"3bf7557f-f274-42c9-bc75-89be339d95e2","school":{"__ref":"School:{\"uuid\":\"edacbf48-64ba-487d-96b1-cb12cd981246\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"53f414c8-349b-4ab0-a4d4-e2796d53202d\"}":{"__typename":"Education","uuid":"53f414c8-349b-4ab0-a4d4-e2796d53202d","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics ","degree":null},"MentorPublicProfile:{\"uuid\":\"9b761946-4146-486f-88eb-f33e80c52f43\"}":{"__typename":"MentorPublicProfile","uuid":"9b761946-4146-486f-88eb-f33e80c52f43","displayName":"Ethan R.","slug":"ethan-roytman","biography":"\u003cp\u003eHi! I’m Ethan, and I’m so excited to be part of the Curious Cardinals community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m currently studying Philosophy, Politics, and Economics (PPE) at the University of Pennsylvania, with minors in Data Science \u0026amp; Analytics and Business Economics \u0026amp; Public Policy. I chose this combination because I’ve always been fascinated by how systems work, why people make the choices they do, and how we can use data and policy to create meaningful change. I love connecting big-picture ideas to real-world issues, whether that means unpacking a Supreme Court decision, exploring the economic impacts of renewable energy, or discussing how policy can shape our daily lives in unexpected ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDebate has played a huge role in my life. I founded Dynamic Debate Academy, a nonprofit debate education startup that I launched in high school to make high-level coaching more accessible. Through this, I’ve worked with students across the country, helped them win scholarships, and guided them to competitive placements they once thought were out of reach. I also lead the debate program at Germantown Friends School, where I’ve grown the team significantly and helped them break into the national circuit. Seeing students find their voice and gain confidence has been one of the most rewarding parts of my journey.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Penn, I work as a teaching assistant for BEPP 2010, a class that explores the economics and politics of public policy. I help students tackle complex topics like taxation, social security, and healthcare policy. Being a TA has pushed me to get better at breaking down difficult ideas and finding creative ways to make them stick, which is something I love doing with students in all areas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I try to stay active and curious in other parts of my life, too. You’ll often find me playing basketball with friends, going to the gym, or eating my way through Philly’s amazing food scene. I’m always looking for the next great dumpling spot or new ramen place to try, and I love exploring hidden neighborhood gems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up with ADHD, I had to learn how to build my own systems for staying organized and motivated. It wasn’t always easy, but those challenges taught me patience and empathy — qualities I bring to every mentorship relationship. I’ve also helped many of my debate mentees through their college applications, supporting them as they figure out not just where they want to go, but who they want to become.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether you want to get ahead in school, build confidence in your public speaking, or just figure out what really excites you, I am here to help you explore, grow, and enjoy the journey.\u003c/p\u003e","teachingVideoPlaybackId":"lO5TF8iIQpA4OBbtRsZMbQYGuGmty7x5W7pcFFJsrgs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a744c1b3-7b3a-4d34-9937-195075ee23b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"df8cd24a-e394-4761-a180-670d1d126ce9\"}"},{"__ref":"DeepDives:{\"uuid\":\"1fcbd106-533a-4cd8-b8d5-01ab993b7138\"}"},{"__ref":"DeepDives:{\"uuid\":\"8e52938d-3c9f-4acc-89d7-5e0b31e90ce8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3e2958ad-ddf2-4860-badb-aed2d97a1850/-/preview/-/format/jpg/","https://ucarecdn.com/05a75530-3cf3-416a-813a-5eb6113ce3b2/-/preview/-/format/jpg/","https://ucarecdn.com/e562a5b7-8206-4c82-8b15-ccaf67989d1d/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3bf7557f-f274-42c9-bc75-89be339d95e2\"}"},{"__ref":"Education:{\"uuid\":\"53f414c8-349b-4ab0-a4d4-e2796d53202d\"}"}],"hiredAt":"2025-06-27T13:13:27.949Z","topics":["Algebra II","Algebra I","Writing","Executive Function","Academic Coaching","College Essay Writing","History","Economics","Business / Entrepreneurship","Finance / Investing","Law / Government / Policy","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ethan-roytman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9b761946-4146-486f-88eb-f33e80c52f43\"}"}}},"_sentryTraceData":"238adbfd054a4de780db2532daec7cb0-9f82be8d5e3aac98-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=238adbfd054a4de780db2532daec7cb0,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ethan-roytman"},"buildId":"ZAcrs1hPe6xcPE
