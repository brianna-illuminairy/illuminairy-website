xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"8681a50b-e7c9-419b-aefb-5e09d16226ee\"}":{"__typename":"DeepDives","uuid":"8681a50b-e7c9-419b-aefb-5e09d16226ee","content":"\u003cp\u003eI was a huge nerd, especially when it came to global affairs and Model UN! I went to three high schools over four years, and ended up starting or leading the MUN club at each different school because I so desperately wanted to continue doing it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"363377bb-e72b-4001-b8aa-5e72f3aa66de\"}":{"__typename":"DeepDives","uuid":"363377bb-e72b-4001-b8aa-5e72f3aa66de","content":"\u003cp\u003eMentorship is a core value for me because it's something I would have loved to have when I was younger. I moved from Italy to the U.S. when I was 11, and struggled to navigate new school environments and social scenes alone. Having someone to talk to about my academic and personal interests would have made all the difference - so I'm excited to be that someone for students now!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7204edee-15fc-4503-91c6-14d67d9b73c5\"}":{"__typename":"DeepDives","uuid":"7204edee-15fc-4503-91c6-14d67d9b73c5","content":"\u003cp\u003eI loved two subjects more than anything in high school - international affairs and biology. Georgetown's STIA major was the only major I could find that actually blended those two interests!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2a5701c3-4c44-4c33-afc3-85af3d19b53f\"}":{"__typename":"DeepDives","uuid":"2a5701c3-4c44-4c33-afc3-85af3d19b53f","content":"\u003cp\u003eI think it would be really cool to be in a team deployed by the World Health Organization during a pandemic - at the \"frontline\" of the fight making sure the policy helps us get better quicker. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"19303920-5f55-40f3-945f-9d02b41f2099\"}":{"__typename":"School","uuid":"19303920-5f55-40f3-945f-9d02b41f2099","name":"Washington-Liberty High School","city":"Arlington","type":"HIGH","state":"Virginia","country":"Stati Uniti","zip":"22201"},"Education:{\"uuid\":\"6d860ea4-7cde-4346-af52-f20eb51c4d1b\"}":{"__typename":"Education","uuid":"6d860ea4-7cde-4346-af52-f20eb51c4d1b","school":{"__ref":"School:{\"uuid\":\"19303920-5f55-40f3-945f-9d02b41f2099\"}"},"startYear":"2015","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"9e959e0f-5639-49f1-a458-51f51c17108b\"}":{"__typename":"Education","uuid":"9e959e0f-5639-49f1-a458-51f51c17108b","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Science, Technology, International Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"ed130576-bbcf-476f-b474-33ec389f6d89\"}":{"__typename":"MentorPublicProfile","uuid":"ed130576-bbcf-476f-b474-33ec389f6d89","displayName":"Isabella T.","slug":"isabella-turilli","biography":"\u003cp\u003eHi everyone! My name is Isabella, and I am currently a PhD student in international relations at Oxford University, where I am a Clarendon Scholar. My research focuses on the forgotten politics of prominent nurses between 1850-1950, spanning from Florence Nightingale to Alice Sher. I hope to show how nursing was a significant career thrugh which women theorized, impacted, and entered social politics. Here at Oxford, I am also a tutor in international relations, and teach the beginner and historical courses to undergraduate students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn 2025, I graduated with my MPhil (Master's) in international relations from Oxford University, as a Rhodes Scholar. My thesis centered on pandemic politics and the career of a pioneering American public health nurse, Lillian D. Wald, and her surprisingly global career as a healthcare worker, administrator, and statesperson. During my undergraduate degree at Georgetown University, I studied global health governance research with Professors Rebecca Katz and Emily Mendenhall. I also worked in an ecological disease networking lab under Professor Shweta Bansal and Dr. Greg Albery studying how natural disasters like wildfires impact animal disease spread. After I graduated, I worked at the Council on Foreign Relations, a think tank in Washington D.C., researching and writing articles on COVID-19, monkeypox, the opioid crisis, and more. Because most of my work involves writing for non-experts, I love to help outline, compose, and edit essays (especially those tricky college ones!).\u003cbr\u003e\u003cbr\u003eOutside of my academic work, I served as an emergency medical technician (EMT) and EMS/CPR instructor for four years. Being a pre-hospital provider has hugely shaped my interests in health and its systems globally, and I am passionate about sharing my experiences working on the ambulance and educating others about lifesaving skills! I am also a classically trained singer, with performance experience as an operatic soloist (Kennedy Center Millennium Stage, DC Arena Stage, DC Decatur House) and as a choral singer specializing in Baroque and Renaissance eras (GU Chamber Singers, Choral Arts Society of Washington, Tanglewood Music Festival). I speak English and Italian at a native level, and Korean at an advanced level, and have experience teaching language as an immersion counselor at Concordia Language Villages. \u003c/p\u003e","teachingVideoPlaybackId":"wNbow5Uen01LrwElb3essmkisoU01z600RGRW5CFpa00Pow","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Science, Technology, International Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8681a50b-e7c9-419b-aefb-5e09d16226ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"363377bb-e72b-4001-b8aa-5e72f3aa66de\"}"},{"__ref":"DeepDives:{\"uuid\":\"7204edee-15fc-4503-91c6-14d67d9b73c5\"}"},{"__ref":"DeepDives:{\"uuid\":\"2a5701c3-4c44-4c33-afc3-85af3d19b53f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/356f2e9d-5355-4804-957c-02cde4db347a/-/preview/-/format/jpg/","https://ucarecdn.com/4672c634-6d69-40a5-95d2-22efdfd5c964/-/preview/-/format/jpg/","https://ucarecdn.com/63a010fc-80e4-440e-9976-e0906880539b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"6d860ea4-7cde-4346-af52-f20eb51c4d1b\"}"},{"__ref":"Education:{\"uuid\":\"9e959e0f-5639-49f1-a458-51f51c17108b\"
