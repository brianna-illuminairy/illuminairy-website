tion":"What is your dream job?"},"DeepDives:{\"uuid\":\"46065ab9-07b8-4f38-92ee-f93390941bef\"}":{"__typename":"DeepDives","uuid":"46065ab9-07b8-4f38-92ee-f93390941bef","content":null,"videoPlaybackId":"bMfklfBu02lnmHn02l6pGHlZGpS3H3GlLWKAlg00tryBCI","question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"3307138a-4842-48a0-b874-c1009ea0e602\"}":{"__typename":"DeepDives","uuid":"3307138a-4842-48a0-b874-c1009ea0e602","content":"\u003cp\u003eIn high school I spent my summers interning at a research lab where I worked with mice in a breast cancer research lab. I learned so much about wet lab skills, developing an experiment, and how to present your findings. I also doubled my time as a camp counselor for immigrant children in Chinatown. This experience was super fulfilling to be able to work with kids who were new to the US and help them integrate into everyday life. I also spent much of my summers at Dance bootcamps for my dance team where we would be preparing for the next year's sporting games and events!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"2eb73a1a-ccc7-4e3b-9106-e2f01f83fc63\"}":{"__typename":"DeepDives","uuid":"2eb73a1a-ccc7-4e3b-9106-e2f01f83fc63","content":"\u003cp\u003eIn my lifetime I hope to just make a positive difference in the world directly working with people. I always tell myself that by the time I leave this world I want to look back and be proud of the ways I served and helped others. One of my big passions is healthcare inequality and I hope to do something to restore or adapt the healthcare system to better support those who are less fortunate. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"ff9739a2-dea0-41ca-921f-841581879a7b\"}":{"__typename":"School","uuid":"ff9739a2-dea0-41ca-921f-841581879a7b","name":"St. Ignatius","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94116"},"Education:{\"uuid\":\"2c9ea117-4659-4dc5-bea5-b34636b61437\"}":{"__typename":"Education","uuid":"2c9ea117-4659-4dc5-bea5-b34636b61437","school":{"__ref":"School:{\"uuid\":\"ff9739a2-dea0-41ca-921f-841581879a7b\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"a8aa5ff8-ac1b-4e8b-a517-fcb80e5342b6\"}":{"__typename":"Education","uuid":"a8aa5ff8-ac1b-4e8b-a517-fcb80e5342b6","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Molecular,Cellular,and Developmental Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"acf97cf5-9708-43e3-89c0-a7244e39346d\"}":{"__typename":"MentorPublicProfile","uuid":"acf97cf5-9708-43e3-89c0-a7244e39346d","displayName":"Ashley C.","slug":"ashley-chung-1","biography":"\u003cp\u003eHi! My name is Ashley and I am currently an incoming second year at UCLA studying molecular, cellular, and developmental biology. (I know it’s a crazy long name!) I am someone who is super passionate about teaching and mentoring others. I have extensive work working with children all throughout high school, teaching kids in math, science, english, and even sports. I love spending time with kids because it is something I find super fulfilling to see someone gain confidence and newfound skills that they may have just needed a little push in finding. I believe all kids are curious and are passionate about something, even if they may not seem at times, there is always something to connect with them on.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ll tell you a story about when I was tutoring for a nonprofit that I was an administrator for in high school. I had tried so hard to connect with Thomas on math problems for school, he was a first grader so math did not excite him very much. I attempted for weeks to get him to pay attention and have some interest in the subject, however it seemed that nothing sufficed, until I realized I needed to meet him at his level. I knew he was super interested in the legos I had in my room and decided to use my StarWars lego figurines to teach him math. To my surprise, it worked and I was able to get him interested in a subject he previously never was in. All this to say that I worked as a tutor for kids K-6th all of high school through a nonprofit that I headed, working with underserved children who could not afford tutoring. Along with this\u0026nbsp; I was a counselor for immigrant children in Chinatown teaching them basic English as many of them have just moved here. As you can probably see, I’ve spent most of my time around kids :)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have aspirations to work with children in a medical setting, and I have hopes of becoming either a doctor or physician assistant. I spend my time working at a breast oncology lab at UCSF where I am researching a BRCA2 cell line using T cells to combat cancer and am currently working on a study that is to be published. This past summer I interned  as a Design Intern at an architecture firm which has allowed me to pour out my love for the arts and drawing and doubled my time working at Chipotle! That is something that has taught me so much about customer service and I have so much gratitude for service workers. This summer I am studying to become a CNA! I also am super passionate about working with kids to help them get into the college of their dreams. I feel I have learned so much going through the process myself so recently that I have much knowledge and experience to share with you all. My college admission process is one that I designed and went through on my own. It has taught me a thing or two and I am super happy to want to share that knowledge and pass it on so you all can have as much success as I did!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAside from all of this, I am a creative, passionate, and curious person at heart and want to share my love for learning, teaching, and mentoring with all of you. Thanks for learning a little bit about me, I cannot wait to get to know you and share all my knowledge with you all!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"PPXxHn02XUt9KObYH9a6uIWirSvjHBp2sTPsf5ApX2BQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSeeing someone I never thought would crack a smile is what I consider my greatest achievement. I love making people laugh and smile and it hurts my heart when I see others who are not. I think back to my time in highschool, one of the more vulnerable moments I will share with you all, when I was volunteering at a pediatric oncology hospital where I met a young girl named Savannah. She was just five years old with a glioblastoma causing her eyes to rapidly shake. Throughout my time at the hospital, I would visit her frequently, but I would never see her smile. It saddened me that such a young girl seemed to be having such a hard time. I made it my goal next time to spend time with her and try to lighten her spirits. The next time I saw her I sat with her as she showed me the multitude of princess stickers she had collected over the years. I remarked that Belle was like her twin which made her eyes light up and made her chuckle. It warmed my heart that such a menial moment could bring a little joy into my patients stay at the hospital and I hope to keep spreading this joy to others, and I consider this my biggest achievement.\u0026nbsp;\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a38183d8-e5f9-4838-a9f0-891645495984\"}"},{"__ref":"Favorites:{\"uuid\":\"096c8e62-e599-4cdf-a200-396514723436\"}"},{"__ref":"Favorites:{\"uuid\":\"02b4e0dc-8e82-4ac5-803b-aaee5b32cdb6\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"76f742dd-5da3-46d4-81e7-d91fffc93ee7\"}"}],"major":"Molecular,Cellular,and Developmental Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cf915dca-1e03-405a-b39f-12f8997d9653\"}"},{"__ref":"DeepDives:{\"uuid\":\"46065ab9-07b8-4f38-92ee-f93390941bef\"}"},{"__ref":"DeepDives:{\"uuid\":\"3307138a-4842-48a0-b874-c1009ea0e602\"}"},{"__ref":"DeepDives:{\"uuid\":\"2eb73a1a-ccc7-4e3b-9106-e2f01f83fc63\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d29be55d-b3fb-44e1-a3b4-8f37b2931747/-/preview/-/format/jpg/","https://ucarecdn.com/dfd05a12-0ee4-443d-a445-63c941f0c7b7/-/preview/-/format/jpg/","https://ucarecdn.com/ee4b91aa-6264-4419-bc0a-6d60fa33a5ac/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2c9ea117-4659-4dc5-bea5-b34636b61437\"}"},{"__ref":"Education:{\"uuid\":\"a8aa5ff8-ac1b-4e8b-a517-fcb80e5342b6\"}"}],"hiredAt":"2025-08-09T11:31:31.095Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","College Essay Writing","Executive Function","K-6 Storybook","Video / Photography","Fashion / Cosmetics","Visual Arts / Graphic Design","Medicine / Health","STEM
