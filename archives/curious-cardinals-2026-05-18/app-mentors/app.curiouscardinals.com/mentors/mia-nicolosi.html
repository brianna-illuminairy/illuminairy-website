xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4a4f3f50-0b22-479e-a6bd-5e78b8103fea\"}":{"__typename":"Favorites","uuid":"4a4f3f50-0b22-479e-a6bd-5e78b8103fea","photoUrl":"https://ucarecdn.com/4764c891-34e2-4222-90a1-16732bc60904/","title":"Copenhagen, Denmark","type":"CITY"},"Favorites:{\"uuid\":\"cc2041a8-85a3-4d74-846d-ee09f1b0ed99\"}":{"__typename":"Favorites","uuid":"cc2041a8-85a3-4d74-846d-ee09f1b0ed99","photoUrl":"https://ucarecdn.com/9ec1234e-e603-4f42-8dc3-6cc6d2775b12/","title":"Rumors: Fleetwood Mac","type":"ALBUM"},"Favorites:{\"uuid\":\"59ed48c5-4af2-448d-84ac-b010478e2554\"}":{"__typename":"Favorites","uuid":"59ed48c5-4af2-448d-84ac-b010478e2554","photoUrl":"https://ucarecdn.com/2a2ba6f9-36d8-42cb-a1f9-1fb37cf1dd35/","title":"Settlers of Catan","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f10fae1a-81c7-4c43-909c-c25a3346b84e\"}":{"__typename":"DeepDives","uuid":"f10fae1a-81c7-4c43-909c-c25a3346b84e","content":"\u003cp\u003eI’d tell my middle and high school self to follow your passions—even if they feel random, niche, or different from what everyone else is doing. The things that genuinely excite you, even if they don’t seem “practical” at the time, are often what lead to the most meaningful opportunities later on. Don’t be afraid to dive deep into your interests, try new things, and let your curiosity guide you. It’s okay if your path isn’t linear—what matters most is that it feels like yours.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d4df0baa-467b-43a6-bdf7-b1adfaa8d475\"}":{"__typename":"DeepDives","uuid":"d4df0baa-467b-43a6-bdf7-b1adfaa8d475","content":"\u003cp\u003eI came into college undecided, but I’ve always been someone who notices the details—how light moves through a room, how people interact with space, how design tells a story. Growing up in the Virgin Islands, surrounded by both natural beauty and imperfect infrastructure, I became curious about how we shape the world around us. I kept following that curiosity—taking design and architecture classes—and eventually realized this wasn’t just an interest, it was something I cared deeply about. That’s when I knew I wanted to pursue architecture.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"f3bb4013-493e-44e5-bb62-6b0735299722\"}":{"__typename":"DeepDives","uuid":"f3bb4013-493e-44e5-bb62-6b0735299722","content":"\u003cp\u003eIn high school, I was definitely the super-organized, color-coding-everything, making-study-guides-for-fun kind of student. I loved turning chaos into structure, especially if it involved highlighters and good stationery. My friends and I would make collaborative study sheets and quiz each other before exams—it made learning feel like a team effort. I’ve always been someone who takes pride in being prepared and finding creative ways to stay on top of things.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"a49538ff-e897-4a57-b409-57775c86f7fc\"}":{"__typename":"DeepDives","uuid":"a49538ff-e897-4a57-b409-57775c86f7fc","content":"\u003cp\u003eMentorship means a lot to me because I know how much it helped me. I’ve had people in my life who believed in me when I was still figuring things out—who listened, asked the right questions, and gave me the space to grow. That made a huge difference in my confidence and direction. I love the idea of being that person for someone else. I really enjoy getting to know students, hearing what they’re excited about (or stressed about), and helping them find their own path—whether that’s through school, creative projects, or just figuring out what they care about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"e03b92ab-c480-4236-8fba-d5064234fa6a\"}":{"__typename":"School","uuid":"e03b92ab-c480-4236-8fba-d5064234fa6a","name":"Antilles School","city":"St Thomas","type":"HIGH","state":"VI","country":"United States","zip":"00802"},"Education:{\"uuid\":\"90afa8b8-a98f-4c9e-b386-f5db8a6f45a9\"}":{"__typename":"Education","uuid":"90afa8b8-a98f-4c9e-b386-f5db8a6f45a9","school":{"__ref":"School:{\"uuid\":\"e03b92ab-c480-4236-8fba-d5064234fa6a\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"9959172b-4a4a-43c6-953f-20f7954e0b35\"}":{"__typename":"Education","uuid":"9959172b-4a4a-43c6-953f-20f7954e0b35","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Architecture","degree":null},"MentorPublicProfile:{\"uuid\":\"aaec9542-7737-454d-840e-c7ff8f087b4b\"}":{"__typename":"MentorPublicProfile","uuid":"aaec9542-7737-454d-840e-c7ff8f087b4b","displayName":"Mia N.","slug":"mia-nicolosi","biography":"\u003cp\u003eHi! I’m Mia, and I’m currently studying architecture at Yale. I was born in Chicago and raised in the U.S. Virgin Islands, where I developed a deep appreciation for design, nature, and the ways our surroundings shape how we live and connect with one another. I’ve always been curious and creative, and studying architecture has been a way for me to explore those interests through both hands-on work and big-picture thinking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I’ve taken courses in everything from environmental systems and architectural history to digital modeling, visual storytelling, and design theory. I’ve studied abroad in Copenhagen, worked on residential and public design projects, and even participated in a 10-day design-build program where I helped construct a boat shed in rural New Hampshire. I also love photography and media—whether I’m documenting my own projects, creating social content, or capturing a moment just for fun, visual storytelling is something that really excites me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I’m a proud member of Yale’s varsity sailing team, where I’ve competed nationally and served as team captain. Sailing has taught me a lot about focus, leadership, and resilience—lessons I carry with me in all areas of life. I’ve also held internships across architecture, design, and creative industries, which has given me a wide range of experience balancing structure with imagination.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I love supporting students in whatever ways they need—whether that’s academic support, help developing time management strategies, or encouragement on creative or personal projects. I especially love working with students on passion projects and helping them bring their ideas to life. I know how much it can mean to have someone in your corner who’s not just there to teach, but to listen, inspire, and cheer you on.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether you're a visual learner, a deep thinker, or someone still figuring out how you learn best, I’m here to meet you where you’re at. My goal is to create a space where learning feels meaningful, personalized, and fun—and where students feel seen, supported, and excited to grow.\u003c/p\u003e","teachingVideoPlaybackId":"01nAEcIwXwN5O4lb0101gSAxFGrlbJGbKG3gS5FScx5PiA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4a4f3f50-0b22-479e-a6bd-5e78b8103fea\"}"},{"__ref":"Favorites:{\"uuid\":\"cc2041a8-85a3-4d74-846d-ee09f1b0ed99\"}"},{"__ref":"Favorites:{\"uuid\":\"59ed48c5-4af2-448d-84ac-b010478e2554\"}"}],"causesSupported":[],"major":"Architecture","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f10fae1a-81c7-4c43-909c-c25a3346b84e\"}"},{"__ref":"DeepDives:{\"uuid\":\"d4df0baa-467b-43a6-bdf7-b1adfaa8d475\"}"},{"__ref":"DeepDives:{\"uuid\":\"f3bb4013-493e-44e5-bb62-6b0735299722\"}"},{"__ref":"DeepDives:{\"uuid\":\"a49538ff-e897-4a57-b409-57775c86f7fc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/009be6d9-76ca-427d-bcaa-c6073b736f97/-/preview/-/format/jpg/","https://ucarecdn.com/06b79672-c151-4915-9b4b-b77fcf0037b8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"90afa8b8-a98f-4c9e-b386-f5db8a6f45a9\"}"},{"__ref":"Education:{\"uuid\":\"9959172b-4a4a-43c6-953f-20f7954e0b35\"}"}],"hiredAt":"2025-04-01T18:48:03.349Z","topics":[],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisib
