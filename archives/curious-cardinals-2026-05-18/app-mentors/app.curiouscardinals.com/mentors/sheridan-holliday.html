ritize the needs, voices, and potential of the next generation! As a mentor, I'm deeply passionate and enthusiastic about achieving excellence and helping others discover their potential. I approach mentorship with purpose, empathy, and a strong belief in the value of lifelong learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have spearheaded many initiatives and projects in my college and high school career. One of my proudest projects was when I worked at The Sheridan at River Forest Assisted Living Community. While working here, I created a program called \u003cem\u003e“Tech Talks with Sheridan”\u003c/em\u003e where residents could receive help with technology, whether it was learning how to FaceTime a loved one or view a photo their grandchild sent! This initiative was permanently installed into the company's programming and continues to inspire my mission to be of service. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn combination with my studies, I hold a Treasurer position within my school's premier gospel choir: Northwestern Community Ensemble. One of my favorite things to do is sing! I am a trained vocal performer and enjoy singing music from all genres. My current favorite album is Beatopia by Beabadoobee!  \u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eNo matter the topic, I'm here to help you grow, push boundaries, and shine!💫💥\u003c/p\u003e","teachingVideoPlaybackId":"JRBaoTVa2r00zyewjvy1T17NvMKRFYbAWWNAz3n00pOZU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology/Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fd1367fe-b6c0-48a7-a0b1-3be51ed7ef76\"}"},{"__ref":"DeepDives:{\"uuid\":\"38015188-1e5f-4472-a44f-fc51b9d4b09d\"}"},{"__ref":"DeepDives:{\"uuid\":\"f010ca1e-adf7-49aa-ae77-732ae1e9e1e0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/82357a4a-0cb6-4f03-b77c-7b4fb81224f4/-/preview/-/format/jpg/","https://ucarecdn.com/c4ef00dd-32b7-4cf7-b821-771cbc7ebef
