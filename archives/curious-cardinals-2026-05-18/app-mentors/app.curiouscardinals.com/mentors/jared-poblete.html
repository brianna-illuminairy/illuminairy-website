xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"913e1378-2896-4969-ba38-4dfa645f3a53\"}":{"__typename":"DeepDives","uuid":"913e1378-2896-4969-ba38-4dfa645f3a53","content":"\u003cp\u003eAt the end of the day, I aim to be the mentor that I wish I had when I was younger. I want to share all the tools I’ve acquired, whether they be graphic design tricks I’ve collected or organization management habits I’ve formed. I aim to create a place of support and learning where mentees can be motivated to explore their interests and passions without judgment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"cb1db2ce-b987-41d0-a9db-b583e88afe9a\"}":{"__typename":"DeepDives","uuid":"cb1db2ce-b987-41d0-a9db-b583e88afe9a","content":"\u003cp\u003eWhen I was in high school, I was driven but had terrible habits and little sense of direction. By the end, I did a little bit of everything—science, government, journalism—and had a ton of fun doing all of it, but I found myself burnt out at a young age. My hope is to help my mentees find their own way and push them to focus on what they really love to do! I'd also love to build learning strategies and find ways to navigate a busy schedule.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9080f6f1-fa8d-407e-85e9-2497fbde1415\"}":{"__typename":"DeepDives","uuid":"9080f6f1-fa8d-407e-85e9-2497fbde1415","content":"\u003cp\u003eIn 2023, I was given the opportunity to spearhead the look of Stanford’s largest concert, Frost Music \u0026amp; Arts Festival. Denzel Curry would be headlining the show, with 070 Shake and Jean Dawson supporting. I knew it would be the culmination of all my graphic design practice throughout my time on campus, so I made sure to go big or go home.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI learned new techniques like 3D rendering and combined them with familiar techniques like collaging and halftone. I looked at older iterations of the festival to find what we had been missing until now: with its neon color combinations and stretched text, I made sure to make the entire canvas my signature. Best of all, I built something so big from a fun, little theme—sticky hands—which we gave away all over campus! The most proud I could be was seeing my work on the big screen, designed for some amazing musicians and seen by hundreds of people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bc0943eb-b66c-478b-ae20-ac2eccb654b4\"}":{"__typename":"DeepDives","uuid":"bc0943eb-b66c-478b-ae20-ac2eccb654b4","content":"\u003cp\u003eI chose to major in “Symbolic Systems” so people could ask me about it! (Just kidding.)\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo answer the “what” before the “why”: the name can be a little mysterious, but what I've come to understand is that “Symbolic Systems” aims to address the physical and artificial ways in which information can be represented: for example, thought or communication. (Much of which comes by \u003cstrong\u003ebridging the divide between the humanities and science\u003c/strong\u003e.) As such, there's a wide variety of concentrations in the field: neuroscience, music, and artificial intelligence are common places to see SymSys students.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my major, I learned philosophy, writing, and psychology. Personally, I individually designed my own concentration within the major, visual communication, to focus on app \u0026amp; interaction design and graphic design!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"58b56ced-6df3-43bd-98ea-b35e66529f2f\"}":{"__typename":"School","uuid":"58b56ced-6df3-43bd-98ea-b35e66529f2f","name":"West Ranch High School","city":"Santa Clarita","type":"HIGH","state":"California","country":"United States","zip":"91381"},"Education:{\"uuid\":\"350340d4-29e6-4fbc-846a-8b3a6d1862c1\"}":{"__typename":"Education","uuid":"350340d4-29e6-4fbc-846a-8b3a6d1862c1","school":{"__ref":"School:{\"uuid\":\"58b56ced-6df3-43bd-98ea-b35e66529f2f\"}"},"startYear":"2017","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"147fc1e7-2bfa-465f-b050-8e391042abfd\"}":{"__typename":"Education","uuid":"147fc1e7-2bfa-465f-b050-8e391042abfd","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2024","major":"Symbolic Systems","degree":null},"MentorPublicProfile:{\"uuid\":\"24d6a76f-8a9c-4b67-9664-804d4cb45ac3\"}":{"__typename":"MentorPublicProfile","uuid":"24d6a76f-8a9c-4b67-9664-804d4cb45ac3","displayName":"Jared P.","slug":"jared-poblete","biography":"\u003cp\u003eJared is a graduate from Stanford University with a degree in Symbolic Systems with an individually-designed concentration in Visual Communication. Jared is passionate about empowering students using their own individual mindsets.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorships with Jared include \u003cstrong\u003ebranding and growth for social media or portfolios\u003c/strong\u003e; \u003cstrong\u003etraditional writing and art\u003c/strong\u003e classes; and introductions to \u003cstrong\u003edigital design \u003c/strong\u003efor\u003cstrong\u003e photography, websites, and video\u003c/strong\u003e \u003cstrong\u003eediting\u003c/strong\u003e. Together, Jared and his students have worked on exploratory passion projects like storytelling and design for a club’s website, creating original comic books, coding video games in Scratch, and more.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eJared also aims to use design thinking as an empathetic approach to support \u003cstrong\u003eexecutive function\u003c/strong\u003e and develop skills like \u003cstrong\u003etime management\u003c/strong\u003e. As an adult with ADHD, Jared uses personal experience to help struggling students foster long-term habits and organizational structures that fit their unique mindset. Jared works with students closely and conversationally to tailor individual solutions that build on, not break, current routines to improve meeting deadlines, procrastination stress, and grades.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, Jared worked on a variety of projects including: needfinding and development for a social media app connecting Deaf individuals with user-sourced alternative audio interpretations; designing art for musicians like Phoebe Bridgers and Denzel Curry; and fashioning his own apparel and merch line for student-run festivals. Seen a sticker on a laptop, a poster, or a menu on campus? Chances are—it’s his work. Ask him more about balancing extracurriculars and school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a Symbolic Systems major, Jared was concerned with delivering novel opportunities and experiences in terms of apps and events alike. (So what does that mean, really?) Joy is something worth working for; in fact, the work itself is meaning-making. Ask him more about what “Symbolic Systems” is, why it matters, and what joy has to do with it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eApart from tutoring at Curious Cardinals, Jared works as a freelancer in advertising, branding, and interface design (jaredrpoblete.com). Currently, he’s branding for an ed-tech home cooking app concept and doing creative direction for a zine about a speculative San Francisco urban revival.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTalk to Jared about fiction, fashion, and music (or, appeal to his sensibilities re: exploring cold cities, playing video games past midnight, and defending modern art).\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"913e1378-2896-4969-ba38-4dfa645f3a53\"}"},{"__ref":"DeepDives:{\"uuid\":\"cb1db2ce-b987-41d0-a9db-b583e88afe9a\"}"},{"__ref":"DeepDives:{\"uuid\":\"9080f6f1-fa8d-407e-85e9-2497fbde1415\"}"},{"__ref":"DeepDives:{\"uuid\":\"bc0943eb-b66c-478b-ae20-ac2eccb654b4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b40ec8bb-296e-4761-ae8a-f5f1c7408b7d/-/preview/-/format/jpg/","https://ucarecdn.com/86ae81de-0a6b-4f40-99b1-a723caf82d1d/-/preview/-/format/jpg/","https://ucarecdn.com/64aff9d1-ecb7-4555-bcb5-59d04df58eed/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"350340d4-29e6-4fbc-846a-8b3a6d1862c1\"}"},{"__ref":"Education:{\"uuid\":\"147fc1e7-2bfa-465f-b050-8e391042abfd\"}"}],"hiredAt":"2023-07-07T00:35:05.030Z","topics":["6-8 Grade Science","Biology","Writing","History","Reading","College Essay Writing","Executive Function","Academic Coaching","K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Game Design","Journalism"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/6fbd7257-e9de-4421-8a0b-bde4a854891b/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jared-poblete\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"24d6a76f-8a9c-4b67-9664-804d4cb45ac3\"}"}}},"_sentryTraceData":"310c69f13e0d4671b436451f24737cc6-b8ba2cb044d5bdbf-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=310c69f13e0d4671b436451f24737cc6,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jared-poblete"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.j
