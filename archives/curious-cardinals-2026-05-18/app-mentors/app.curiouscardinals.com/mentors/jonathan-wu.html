xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"93d218ba-a101-4604-89eb-6a21c00c345c\"}":{"__typename":"DeepDives","uuid":"93d218ba-a101-4604-89eb-6a21c00c345c","content":"\u003cp\u003eBecause the difference between a student who figures it out and one who doesn't is often just one person who took them seriously. I had moments where someone believed in my potential before I did, and it changed my trajectory. I also had long stretches where I was figuring everything out alone. I know what both feel like and I'd rather be that person for someone else than leave them to navigate it without support.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d395224d-c7ed-4dcd-b538-6a7783a06b71\"}":{"__typename":"DeepDives","uuid":"d395224d-c7ed-4dcd-b538-6a7783a06b71","content":"\u003cp\u003eThe path doesn't have to be linear and the detours aren't failures. Work hard at the things that compound over time, be honest about what you want, and don't let anyone else's timeline make you feel behind. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9b80d86b-4994-4ddb-a298-be78d35f97c0\"}":{"__typename":"DeepDives","uuid":"9b80d86b-4994-4ddb-a298-be78d35f97c0","content":"\u003cbr\u003e\u003cp\u003eOne of my most engaging academic projects sits at the intersection of behavioral finance and natural language processing. I built a research project examining whether retail investor sentiment expressed on Reddit is associated with short-term stock returns. Using posts from major finance-related subreddits, I extract ticker mentions, score sentiment using a lexical NLP model called VADER which produces compound sentiment scores, aggregate that sentiment at the weekly level, and merge it with weekly stock return data from Yahoo Finance. This connects my data science training with my growing interest in financial markets.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"8dac4c0e-5687-4e85-ae9e-ffd892f39bb6\"}":{"__typename":"DeepDives","uuid":"8dac4c0e-5687-4e85-ae9e-ffd892f39bb6","content":"\u003cp\u003eI considered myself to be someone that explored all pursuits. From doing Model United Nations and founding my history club to doing X-ray spectroscopy research at a university in Shanghai, I originally applied to Cornell as a Chemistry and Comparative Literature double major. Although I didn't end up necessarily pursuing either of those as majors, I was--and still am now--surely interested in the arts AND the sciences.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"37f74680-4d39-4b0d-8dbe-346771d9b9e5\"}":{"__typename":"School","uuid":"37f74680-4d39-4b0d-8dbe-346771d9b9e5","name":"Shanghai American School Pudong Campus","city":"Pudong","type":"HIGH","state":"Shanghai","country":"China","zip":"201201"},"Education:{\"uuid\":\"191575ce-7371-4e8b-a9b9-fa3bf7672a7e\"}":{"__typename":"Education","uuid":"191575ce-7371-4e8b-a9b9-fa3bf7672a7e","school":{"__ref":"School:{\"uuid\":\"37f74680-4d39-4b0d-8dbe-346771d9b9e5\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"d1e4d4c7-2cce-4f92-a02b-8ddb1b221d8f\"}":{"__typename":"Education","uuid":"d1e4d4c7-2cce-4f92-a02b-8ddb1b221d8f","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"60192bae-ee83-4235-9139-8cfa4890191c\"}":{"__typename":"MentorPublicProfile","uuid":"60192bae-ee83-4235-9139-8cfa4890191c","displayName":"Jonathan W.","slug":"jonathan-wu","biography":"\u003cp\u003eHi, I'm Jonathan! I’m a senior at Cornell University studying Economics with minors in Data Science, Business, and Comparative Literature. This summer I’ll be interning at a global research and consulting firm in Boston before pursuing a Master of Business Analytics at Cornell's New York City campus. I was also accepted to Duke University's Fuqua School of Business MQM program but chose Cornell's program for its unique positioning at the intersection of analytics and New York City's professional ecosystem.\u003c/p\u003e\u003cp\u003eI care deeply about helping students learn how to think, how to position themselves, and how to tell their story. Whether that's through college admissions preparation, business and entrepreneurship projects, understanding financial markets and economics, or reading about literature, I try to bring my own experience in these fields into every session.\u003c/p\u003e\u003cp\u003eAt Cornell I've had the opportunity to engage deeply across disciplines that don't always overlap. My economics coursework has spanned specialized topics in economics, such as development and education. My data science minor gave me hands-on experience working with Python and applying linear algebra to real-world datasets. My comparative literature minor, which I pursued purely out of intellectual curiosity, sharpened how I read, write, and communicate complex ideas simply.\u003c/p\u003e\u003cp\u003eOutside academics, I've spent years training in basketball, practicing the viola, and learning how discipline translates into mental resilience. I've taught English in Taiwan, to the blind, and worked as an independent tutor as well. I also created educational video content in Taiwan that resonated strongly enough with students that school leadership doubled their investment in the program. I understand that consistency matters and am always looking to improve myself wherever possible.\u003c/p\u003e\u003cp\u003eMy mentoring style is direct and collaborative, with the goal of helping students be as ambitious as possible to achieve their goals. I've been the student who had to figure it out the hard way, and I've been the student on the Dean's List. I know what the difference looks like and I can help you get there. And if you don’t know what that goal might be, that’s okay too! We’ll figure it out. If you’re a student looking to build something you’re proud of, I’d love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"vxd00CKaWAUb00dLu025A1zaeRJk00Uff1OVixPuBbAAHPQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"93d218ba-a101-4604-89eb-6a21c00c345c\"}"},{"__ref":"DeepDives:{\"uuid\":\
