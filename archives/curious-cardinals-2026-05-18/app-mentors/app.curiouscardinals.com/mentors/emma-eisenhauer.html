xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"27e6f3c6-e981-47e7-9956-6e95e8b5295b\"}":{"__typename":"DeepDives","uuid":"27e6f3c6-e981-47e7-9956-6e95e8b5295b","content":"\u003cp\u003eI built an entire escape room during Covid quarantine!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI spent a week engrossed in videos of how to make ciphers with plastic cups and organize geographical coordinates to reveal codes. I scrounged in my house for locks, but when I came up three short, I \"borrowed\" my families devices and set new passcodes (making my older sister VERY eager to break out...)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTaking inspiration from official breakout rooms I had done in the past, I stuck colored dots on objects and related them together in a word scramble. I even wrote an introduction speech to \"set the stage\", enticing the prize of Clorox wipes upon success. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough the motivation to retrieve their lost belongings was strong, my family almost did not breakout! What went from a 30-minute, \"short\" challenge turned into 57 minutes and 38 seconds of perseverance. With a few hints and many laughs, we escaped! (And then spent the next 3 months in the same rooms. :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"94842e9d-c8f5-48fb-967a-72740947b3fc\"}":{"__typename":"DeepDives","uuid":"94842e9d-c8f5-48fb-967a-72740947b3fc","content":"\u003cp\u003eI met an amazing mentor when I was 15.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe taught me the value of having someone support you in mindsets, goal setting, project planning, understanding global perspectives, relationships, and so much more.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe showed me it didn't matter that we met virtually on Zoom instead of in person because we built a strong connection nonetheless. Three years later, we did finally have a reunion in person, and it was just the same!\u003cbr\u003e\u003cbr\u003eI believe mentorship is important in all ages of life. I continue my luck in having her as a mentor and am excited to be “that mentor” to students of my own. :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"94d27e18-2d47-49aa-b351-3a43005c3cea\"}":{"__typename":"DeepDives","uuid":"94d27e18-2d47-49aa-b351-3a43005c3cea","content":"\u003cp\u003e\"Don't take life too seriously, you'll never get out of it alive.\" :)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI focused a lot of my attention in middle school doing things I was already good at and comfortable in: soccer, math, spending time with the same friends.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLooking back on these years, I now understand I was afraid of looking stupid or failing if I branched out.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis was tested when I moved to Boston in 8th grade. Everything became new to me, and while difficult at the time, I decided to create \"stretch\" goals as a way to experience my new city and school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow 5 years later \u0026amp; on a gap year, I couldn’t be more of an advocate for trying new things (and failing :).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've played pickup soccer with strangers in all 12 of the countries I've traveled to this year, built a failure wall, went skydiving (!!), and continue to bring fun energy to all my jobs. I would tell my middle school self to slow down, connect with new people, and take advantage of all crazy opportunities because we don't have to be serious to be productive.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"fe49eeb1-55b5-43ed-999f-1e28165ceabb\"}":{"__typename":"School","uuid":"fe49eeb1-55b5-43ed-999f-1e28165ceabb","name":"Brookline High School","city":"Brookline","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02445"},"Education:{\"uuid\":\"cbd489e3-58d5-4d57-a7c9-a9dfc6128ba7\"}":{"__typename":"Education","uuid":"cbd489e3-58d5-4d57-a7c9-a9dfc6128ba7","school":{"__ref":"School:{\"uuid\":\"fe49eeb1-55b5-43ed-999f-1e28165ceabb\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"bea76dd3-5050-43a4-a2dd-1193af30aa43\"}":{"__typename":"Education","uuid":"bea76dd3-5050-43a4-a2dd-1193af30aa43","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2029","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"97629db6-ed39-4b65-b4d2-b83cb2d1bce0\"}":{"__typename":"MentorPublicProfile","uuid":"97629db6-ed39-4b65-b4d2-b83cb2d1bce0","displayName":"Emma E.","slug":"emma-eisenhauer","biography":"\u003cp\u003eHey there! I’m Emma, a Duke University student from Boston (though I grew up in NYC, Columbus, \u0026amp; Cincinnati, too!). \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m on a gap year exploring the intersection between culture \u0026amp; engineering through living in Guatemala \u0026amp; working for a sanitation company (and climbing every volcano I can get my backpack to :).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy family nickname is Stretch, as in “Stretch, can you grab that peanut butter off the top shelf…”\u0026nbsp;It’s a joke given to me by my grandpa in middle school about my long arms after playing 1 v 1 basketball. Through silly challenges, I also started leaning into the figurative side of my nickname. I made “stretch” goals such as basement soccer tricks, writing every day (though I hated writing at the time), and high-fiving my sister while surfing the same wave.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout high school, my goals became more purposeful. I started a 501(c)(3) to teach elementary \u0026amp; middle schoolers teamwork \u0026amp; problem solving through robots. I worked on a consulting project for IKEA, won a hackathon, and built technology solutions for mobile healthcare access \u0026amp; clean water. I even created EarthGPT \u0026amp; stretched myself all the way to Austin, TX to speak at South by Southwest on the importance of Digital Twin technology to make effective climate decisions!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWith the confidence gained from these “reach” experiences, I dove into more: I spoke Spanish as a medical translator in rural Panamá, captained my FIRST Tech Challenge robotics team, got a scholarship to study abroad in Brazil, and took the leap to apply for funding for my gap year.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat started as a funny nickname turned into a mindset. As a mentor to your child, my goal is to help them aim high, find what interests them \u0026amp; build off that in every tangential direction. So, whether I’m guiding your child in an engineering project, pushing them to make connections between their passions, sparking ideas for a bucket list, creating a presentation, learning Algebra 1 basics, or anything else, we will stretch our minds, interests, and beliefs.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAdemás, hablo español por si es más fácil para comunicarse con su estudiante. :)\u003c/p\u003e","teachingVideoPlaybackId":"B02VzoHmwmbBGjZMpAod00D4iftF00li9s9VeJlDhsJAXs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"27e6f3c6-e981-47e7-9956-6e95e8b5295b\"}"},{"__ref":"DeepDives:{\"uuid\":\"94842e9d-c8f5-48fb-967a-72740947b3fc\"}"},{"__ref":"DeepDives:{\"uuid\":\"94d27e18-2d47-49aa-b351-3a43005c3cea\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c1a83a25-6c25-4329-a9cb-1e08be1f2090/-/preview/-/format/jpg/","https://ucarecdn.com/da3c29a2-0bd6-4890-bd83-468a79a04c21/-/preview/-/format/jpg/","https://ucarecdn.com/271416e9-a4c5-494a-bda3-2b9b323631b1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cbd489e3-58d5-4d57-a7c9-a9dfc6128ba7\"}"},{"__ref":"Education:{\"uuid\":\"bea76dd3-5050-43a4-a2dd-1193af30aa43\"}"}],"hiredAt":"2025-03-27T09:37:25.782Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Writing","Spanish","College Essay Writing","Academic Coaching","Executive Function","Creative Writing","K-6 Storybook","Business / Entrepreneurship","Finance /
