xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1df66f66-3d64-4a73-a4f6-05c1296614a3\"}":{"__typename":"Favorites","uuid":"1df66f66-3d64-4a73-a4f6-05c1296614a3","photoUrl":"https://ucarecdn.com/ac26dc40-e421-4006-b1eb-05be950a0379/","title":"The Pursuit of Happyness","type":"MOVIE"},"Favorites:{\"uuid\":\"fca8b3ca-d3e2-42dc-aa80-221ea8447927\"}":{"__typename":"Favorites","uuid":"fca8b3ca-d3e2-42dc-aa80-221ea8447927","photoUrl":"https://ucarecdn.com/29af97f7-2bb2-4f45-a5e7-d518bac8a4e1/","title":"Dwayne Johnson","type":"ACTOR"},"Favorites:{\"uuid\":\"0e9b7881-f0fb-47ae-9062-32367c97e07b\"}":{"__typename":"Favorites","uuid":"0e9b7881-f0fb-47ae-9062-32367c97e07b","photoUrl":"https://ucarecdn.com/d06967e4-07a3-4d00-bb1b-45d2c0b5551c/","title":"Clue","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0a4f25db-ebfc-4f30-a6a3-bd4de73810f9\"}":{"__typename":"DeepDives","uuid":"0a4f25db-ebfc-4f30-a6a3-bd4de73810f9","content":"\u003cp\u003eOpen your eyes to the world around you and really look at it. There are so many opportunities waiting to be seized, stories waiting to be told, and people whose lives can teach you something amazing. Pay attention to what makes you lean forward. What lights you up? What conversations make you lose track of time? Where do you find yourself naturally wanting to show up?\u003cbr\u003e\u003cbr\u003eMost of the time you already know what you're drawn to, you just have to trust it. The things that naturally pull your attention aren't random. They're pointing at something real about who you are and what you're here to do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"0aeb0949-d4e2-45f2-aff7-6b2b0b13e8a6\"}":{"__typename":"DeepDives","uuid":"0aeb0949-d4e2-45f2-aff7-6b2b0b13e8a6","content":"\u003cp\u003eHonestly, mentorship completely changed my life. Someone believed in me before I believed in myself, and it shifted everything, my confidence, my direction, my sense of what was possible. That kind of impact stays with you, and it makes you want to pass it forward.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBut what really drives me is what true mentorship actually is. It's not about telling someone what to do. It's about helping them find their own voice, their own strengths, their own path. When you can do that for someone, when you see their eyes light up and they start to own who they are and what they bring to the table, there's nothing like it.\u003c/p\u003e\u003cp\u003eIt brings me just as much joy as I hope it brings them. That's why mentorship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"694807fd-bf2e-44a8-a210-9fede4b80649\"}":{"__typename":"DeepDives","uuid":"694807fd-bf2e-44a8-a210-9fede4b80649","content":"\u003cp\u003eI feel a real sense of responsibility for the world around me. I know I have gifts, and so does everyone I encounter. That drives me to keep growing myself, but also to invest in the people and community around me. If we all show up and use what we have, the world gets a little better. That idea genuinely excites me and keeps me going every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9449b41d-1ae5-4417-8afc-f9baeabb91b9\"}":{"__typename":"DeepDives","uuid":"9449b41d-1ae5-4417-8afc-f9baeabb91b9","content":"\u003cp\u003eOne of my proudest projects was organizing and leading a Girls Entrepreneurship Incubator where I mentored over 80 young women in starting their own small businesses. It was a six-week program where each week the girls would visit a new company, learn new business concepts, and hear from guest speakers I brought in. I also worked with community sponsors and investors to make it all happen. \u003cbr\u003e \u003cbr\u003eAt the end of each six weeks, the girls would pitch their businesses in a pitch competition, and I got to help distribute grant and sponsorship money among the participants. Over the course of my time in high school, that added up to over $100,000 distributed to young women building something of their own. The incubator has continued since I graduated and is now run through the nonprofit Pi515, where I now serve as the youngest Board of Advisor. \u003cbr\u003e  \u003cbr\u003eSeeing the participants show up, take it seriously, and believe in themselves was everything.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"97b6ac5f-3b4c-4701-84a4-513b1137fb7e\"}":{"__typename":"School","uuid":"97b6ac5f-3b4c-4701-84a4-513b1137fb7e","name":"Waukee High School","city":"Waukee","type":"HIGH","state":"Iowa","country":"United States","zip":"50263"},"Education:{\"uuid\":\"19cb9af5-d18c-4920-b86f-07f05a6380e1\"}":{"__typename":"Education","uuid":"19cb9af5-d18c-4920-b86f-07f05a6380e1","school":{"__ref":"School:{\"uuid\":\"97b6ac5f-3b4c-4701-84a4-513b1137fb7e\"}"},"startYear":"2021","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"56d683df-e876-46c0-9604-3121e3550bba\"}":{"__typename":"Education","uuid":"56d683df-e876-46c0-9604-3121e3550bba","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Management Science \u0026 Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"274b40ff-87ca-4fd0-8fc8-f29bf0b0c91a\"}":{"__typename":"MentorPublicProfile","uuid":"274b40ff-87ca-4fd0-8fc8-f29bf0b0c91a","displayName":"Anika Y.","slug":"anika-yadav","biography":"\u003cp\u003eHi, I’m Anika! I’m currently a sophomore at Stanford University majoring in Management Science \u0026amp; Engineering with a secondary focus in Public Policy.\u003cbr\u003e \u003c/p\u003e\u003cp\u003eBefore Stanford, I grew up in Iowa and graduated from Waukee High School, where I discovered my love for mentoring, community engagement, and building projects that connect people. \u003cbr\u003e \u003cbr\u003eDuring high school, I served as a 2023-24 National FBLA Officer, where I was the North Central Region Vice President overseeing 8 states and representing more than 230,000 student members globally. I also served as Secretary for Pi515’s Board of Advisors and led the Girls Entrepreneurship Incubator, mentoring over 70 young women as they launched their own businesses. As Education Committee Chair for the State of Iowa’s Youth Advisory Council, I spearheaded legislative efforts to expand student voice in school boards.\u003c/p\u003e\u003cp\u003e \u003cbr\u003eI was honored to represent Iowa on the national stage as the 2024 Distinguished Young Woman of Iowa, a delegate to the United States Senate Youth Program in 2024, and a Girls Nation Senator in 2023. These experiences gave me the chance to work with leaders across government, business, and education, while also building lifelong friendships with peers who were equally passionate about making an impact. Alongside these roles, I performed spoken word poetry, something that taught me the power of storytelling and self-expression. Each of these moments reinforced how important it is to have people who believe in you. I mentor because I’ve seen first-hand how a single mentor’s encouragement can completely change a student’s trajectory, just as others once did for me.\u003cbr\u003e \u003c/p\u003e\u003cp\u003eAt Stanford, I’ve gotten deeply involved in communities that sit at the intersection of entrepreneurship, technology, and public policy. I serve as Director of the $100K Startup Challenge for Stanford BASES, and was a Sponsorship Organizer for TreeHacks 2025, the largest collegiate hackathon in the world. I also work as a Senior Consultant for the Stanford Marketing Group. Beyond campus, I’m interning with the U.S. Air Force’s Innovation Accelerator (AUiX), where I’ve been involved in AI adoption in military education and collaborated with industry partners.\u003cbr\u003e \u003c/p\u003e\u003cp\u003eWhat ties all of these experiences together is my passion for helping people grow—whether that’s coaching founders on how to pitch, working with policymakers on innovation strategy, or mentoring younger students. I know from experience that success isn’t just about knowledge; it’s about confidence, resilience, and having someone in your corner who believes in you.\u003cbr\u003e \u003c/p\u003e\u003cp\u003eAs a mentor, I love supporting students in areas like math (K–8), writing (from creative storytelling to college essays), public speaking, and executive function skills like time management and goal setting. I also enjoy sharing what I’ve learned about leadership, entrepreneurship, finance, and navigating both academic and extracurricular opportunities. I speak conversational German, have a background in photography and design, and I’ve even explored the worlds of fashion and brand consulting. So, I bring a wide range of perspectives into sessions.\u003cbr\u003e \u003c/p\u003e\u003cp\u003eWhen I work with students, I aim to create a space that is equal parts challenging and encouraging. I want my students to leave sessions not only with new skills, but also with the belief that their passions and quirks can become their superpowers. Whether you’re tackling a tough class, building a big dream, or just figuring out what excites you, I’d love to help you get there.\u003c/p\u003e","teachingVideoPlaybackId":"EPZfjLUBhGI1fCShe02xH01amvwn1PJO5NHi8zqm02mzyo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1df66f66-3d64-4a73-a4f6-05c1296614a3\"}"},{"__ref":"Favorites:{\"uuid\":\"fca8b3ca-d3e2-42dc-aa80-221ea8447927\"}"},{"__ref":"Favorites:{\"uuid\":\"0e9b7881-f0fb-47ae-9062-32367c97e07b\"}"}],"causesSupported":[],"major":"Management Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0a4f25db-ebfc-4f30-a6a3-bd4de73810f9\"}"},{"__ref":"DeepDives:{\"uuid\":\"0aeb0949-d4e2-45f2-aff7-6b2b0b13e8a6\"}"},{"__ref":"DeepDives:{\"uuid\":\"694807fd-bf2e-44a8-a210-9fede4b80649\"}"},{"__ref":"DeepDives:{\"uuid\":\"9449b41d-1ae5-4417-8afc-f9baeabb91b9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5320fcb2-8b5b-4deb-869b-b5dc6ad5f9d6/-/preview/-/format/jpg/","https://ucarecdn.com/d1e69203-066c-4068-836a-1971fb2d14c7/-/preview/-/format/jpg/","https://ucarecdn.com/c92fe3ff-cbc3-48fd-bd64-bde684f61277/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"19cb9af5-d18c-4920-b86f-07f05a6380e1\"}"},{"__ref":"Education:{\"uuid\":\"56d683df-e876-46c0-9604-3121e3550bba\"}"}],"hiredAt":"2025-09-01T23:37:35.431Z","topics":["K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Writing","German","College Essay Writing","Academic Coaching","Executive Function","Video / Photography","K-6 Storybook","Fashion / Cosmetics","Business / Entrepreneurship","Finance / Investing","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anika-yadav\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"274b40ff-87ca-4fd0-8fc8-f29bf0b0c91a\"}"}}},"_sentryTraceData":"351ab3c0cd7841de9c243315b153d368-97f57bd176d7e688-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=351ab3c0cd7841de9c243315b153d368,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"anika-yadav"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
