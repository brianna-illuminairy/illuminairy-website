xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5facc57f-dca2-49f5-90ce-a0834ab4e1b3\"}":{"__typename":"DeepDives","uuid":"5facc57f-dca2-49f5-90ce-a0834ab4e1b3","content":"\u003cp\u003eThe advice I would give to my middle or high school self (or to any middle or high schooler for that matter) is to follow your passions as far as possible and to share those passions with your friends. Growing up, I always loved music. I took guitar lessons, taught myself to play synth keyboard, and made hip hop instrumentals with a sampler on my iPad. However, I always felt my passion of music was solo, and mostly kept it to myself throughout middle and high school. It was not until the end of high school, for our senior capstone project, that I formed a band with my friends. There, I learned how much a passion can grow when you share it with friends. In college, I joined the student radio station and made so many friends through putting on concerts, hosting different shows, and designing and selling merchandise. I wish I had known earlier the power sharing your passions with others has.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b51289a3-04d4-467b-b33d-80dc6f2f58f2\"}":{"__typename":"DeepDives","uuid":"b51289a3-04d4-467b-b33d-80dc6f2f58f2","content":"\u003cp\u003eMentorship matters to me because I believe in every child's ability not only to become great students, but great people. Before my senior year of high school, I was asked by my school's principal if I would mentor and tutor her ten-year-old son. I agreed and had a wonderful time helping him work through different problem, finding new ways make learning enjoyable and fun. When he finished his homework, we would play outside in the street until his parents got home. He would ask his friends on the street to play and pretty soon I was practically operating a daycare service for the block. More than the expected tasks of teaching and reigning in, I cherished the small moments where my mentee would ask me a question about life or growing up. I would stop to think and provide a thoughtful response, respecting the influence I had on this child. To this day, I hold this influence dearly and will continue to recognize the importance of mentorship here at Curious Cardinals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"55a9eca7-9f3c-4e8f-812f-276f21c3a395\"}":{"__typename":"DeepDives","uuid":"55a9eca7-9f3c-4e8f-812f-276f21c3a395","content":"\u003cp\u003eAs a high school student, I was active, hard-working, and well-organized. I balanced AP classes with being on the basketball team and founded the First Tuesday of the Month Club, a monthly discussion forum dedicated to giving students the chance to share and discuss their thoughts about the world surrounding them. As a Curious Cardinals mentor, I hope to impart many of the tips and tricks I learned in high school in order to be a successful student while engaging in extracurricular hobbies and interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"63e42296-8ae4-422f-bcde-0db47ec51f6e\"}":{"__typename":"DeepDives","uuid":"63e42296-8ae4-422f-bcde-0db47ec51f6e","content":"\u003cp\u003eMy greatest role model is my grandfather. Growing up, it seemed that he could fix practically anything, from the television to our kitchen table. He never complained and worked quietly. However, when you asked him a question, he was always happy to answer and would be sure to throw in a small joke to make me laugh. I always will admire his combination of work ethic and kind humor and hope to bring the same traits to my role as a Curious Cardinal mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"792976d2-75e5-4d09-8907-8c1f2b90a90b\"}":{"__typename":"School","uuid":"792976d2-75e5-4d09-8907-8c1f2b90a90b","name":"St. Margaret's Episcopal School","city":"San Juan Capistrano","type":"HIGH","state":"California","country":"United States","zip":"92675"},"Education:{\"uuid\":\"cc7e7521-5a2a-4e8c-9502-020c06188908\"}":{"__typename":"Education","uuid":"cc7e7521-5a2a-4e8c-9502-020c06188908","school":{"__ref":"School:{\"uuid\":\"792976d2-75e5-4d09-8907-8c1f2b90a90b\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"27a6b60e-cfd0-41ab-9633-94e80b80a87b\"}":{"__typename":"School","uuid":"27a6b60e-cfd0-41ab-9633-94e80b80a87b","name":"University of Chicago: Hyde Park","city":"Chicago","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60637"},"Education:{\"uuid\":\"f67d119a-3b6f-44c4-97e3-100c20579214\"}":{"__typename":"Education","uuid":"f67d119a-3b6f-44c4-97e3-100c20579214","school":{"__ref":"School:{\"uuid\":\"27a6b60e-cfd0-41ab-9633-94e80b80a87b\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Statistics \u0026 Anthropology","degree":null},"MentorPublicProfile:{\"uuid\":\"eb934ba2-b7bd-4d7d-a654-9f6f385e8d7f\"}":{"__typename":"MentorPublicProfile","uuid":"eb934ba2-b7bd-4d7d-a654-9f6f385e8d7f","displayName":"Logan B.","slug":"logan-burke","biography":"\u003cp\u003eHi! My name is Logan, and I am thrilled to be a part of the Curious Cardinals community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated from the University of Chicago in June of 2024, where I double majored in Statistics and Anthropology and worked for the student radio station. There, I was station manager and hosted two shows every week, one where we played music and one where my friend and I engaged in thoughtful conversations about basketball. In addition to music and basketball, I love watching movies, cooking new recipes, and designing t-shirts.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI recently completed an internship at the Court of International Trade under a Senior Judge. During my time there, I researched and created presentations on issues including eDiscovery and FARA, observed hearings and negotiations at the District Court of New Jersey, and drafted court slip opinions. This experience heightened my interest in the legal field as I look towards a career in law.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I love math and writing. In college, I enjoyed coding with programming languages including C+ and RStudio in my statistics classes and writing about local communities in Hyde Park as a student of anthropology. In high school, I was a proud member of our school's math team where we placed second in a national competition. Competing with my friends on the team was a highlight of my high school experience. Another highlight was my job as a mentor/tutor. What started as a mentorship for one student eventually turned into me running a quasi-day care for a whole street of elementary schoolers. I embraced the high energy levels and had a wonderful time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my role as a tutor and mentor, I prioritize kindness and understanding, aiming not just to clarify concepts but to make the learning process genuinely enjoyable for every student. I believe in every student’s ability to learn and will put in the effort to ensure that this goal becomes a reality.\u003c/p\u003e","teachingVideoPlaybackId":"wEy1TFBUm02rKgLhfz27o02p4qzi1aMkqIjUiusSgMab4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics \u0026 Anthropology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5facc57f-dca2-49f5-90ce-a0834ab4e1b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"b51289a3-04d4-467b-b33d-80dc6f2f58f2\"}"},{"__ref":"DeepDives:{\"uuid\":\"55a9eca7-9f3c-4e8f-812f-276f21c3a395\"}"},{"__ref":"DeepDives:{\"uuid\":\"63e42296-8ae4-422f-bcde-0db47ec51f6e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/20f84b9f-e262-4541-9a60-da9237d2bb1f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cc7e7521-5a2a-4e8c-9502-020c06188908\"}"},{"__ref":"Education:{\"uuid\":\"f67d119a-3b6f-44c4-97e3-100c20579214\"}"}],"hiredAt":"2025-05-30T17:44:53.668Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Physics","Writing","History","Reading","College Essay Writing","Academic Coaching","Executive Function","Sports Journalism","Creative Writing","K-6 Storybook","Business / Entrepreneurship","Sports Analytics","Web Design","Coding / Programming","Law / Government / Policy","Journalism"],"communityBadges":["https://ucarecdn.com/fe18a7d8-d65b-4523-ab43-2a809d9f45e6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"
