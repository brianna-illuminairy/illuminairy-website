xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"21bdfd8b-107f-4156-9d10-80d8b05ccb1e\"}":{"__typename":"DeepDives","uuid":"21bdfd8b-107f-4156-9d10-80d8b05ccb1e","content":"\u003cp\u003eMy dream job is to either be an entrepreneur or a venture capitalist. The craziest part is that 5 years ago, I didn't really even know these jobs existed. I see these two professions as jobs that help fuel improvement and innovation in the way we live. For me, leaving behind a legacy beyond me through the work I accomplish is important and I see both of these jobs as ways to do that. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"465f8466-d63e-4327-a41d-d73db34d6af0\"}":{"__typename":"DeepDives","uuid":"465f8466-d63e-4327-a41d-d73db34d6af0","content":"\u003cp\u003eI chose Economics because it is a fantastic mix of a variety of subjects; philosophy, math, psychology, political science, business, and the list goes on. Economics is a great way of understanding how the world around you really works and what drives rationality and decision-making in humans (or markets, as my professors would say). \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"5eb1d102-8df9-4a97-bb4f-79dc69053a8a\"}":{"__typename":"DeepDives","uuid":"5eb1d102-8df9-4a97-bb4f-79dc69053a8a","content":"\u003cp\u003eWhile there are many things pulling for my time on a daily basis, I find mentorship to be a top priority for me. Looking back on my own journey, mentors played a key role in helping me find inspiration and teach me about the path that I will presumably take (and that they have already taken). I want to pass on my learnings to the next group of students to reach their full potential which I hope they will give back one day when they are in my position!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5ffef0fc-4920-4b7a-ae18-d86c5ec05265\"}":{"__typename":"DeepDives","uuid":"5ffef0fc-4920-4b7a-ae18-d86c5ec05265","content":"\u003cp\u003eEverything will work out. I spent a ton of time in high school worrying about my future and hypothetical scenarios of how my life could turn out if XYZ outcomes didn't occur. While I cannot deny I still partake in some of those thoughts, I will always encourage you to stay present and control what is in your ability to be controlled.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"867fe324-06e3-4a4f-9863-5b73d8c6e552\"}":{"__typename":"School","uuid":"867fe324-06e3-4a4f-9863-5b73d8c6e552","name":"Plano Senior High School","city":"Plano","type":"HIGH","state":"Texas","country":"United States","zip":"75075"},"Education:{\"uuid\":\"5aa579a6-4db2-4610-92f9-187556ab36e3\"}":{"__typename":"Education","uuid":"5aa579a6-4db2-4610-92f9-187556ab36e3","school":{"__ref":"School:{\"uuid\":\"867fe324-06e3-4a4f-9863-5b73d8c6e552\"}"},"startYear":"2020","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"28e416b9-37b5-4974-ad6a-3c16727eab49\"}":{"__typename":"Education","uuid":"28e416b9-37b5-4974-ad6a-3c16727eab49","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"819a63eb-eb28-4fbb-97ad-0b190b7b9d27\"}":{"__typename":"MentorPublicProfile","uuid":"819a63eb-eb28-4fbb-97ad-0b190b7b9d27","displayName":"Arbaaz K.","slug":"arbaaz-karim","biography":"\u003cp\u003eHi there! My name is Arbaaz and while my profile picture may look scary, I promise I am not! I took that picture because of some cool things I do like being a Gen-Z entrepreneur. \u003cbr\u003e\u003cbr\u003eYep! I am the founder and CEO of Mentall. Mentall is reimagining universities by tailoring personalized wellness support for every student, powered by data. Check us out at trymentall.com. Before Mentall, I founded The World is Yours an international organization working with over 400 students from 240 schools and 10 countries to redefine the culture around mental health by supporting student activists’ ideas. I was super fortunate to be recognized by the United States Congress, The World Economic Forum, UNICEF, Salesforce, Harvard University, and Johns Hopkins University. \u003cbr\u003e\u003cbr\u003eAll of that is a really polished way of saying, I am very passionate about mental health. While it may be intimidating at first, by working with me you can expect to find things that you are just as passionate about too. I want to help you develop ways of looking at the world around you and then doing something to improve it. \u003cbr\u003e\u003cbr\u003eParents, as your child's mentor, I will make it my mission to help them be able to explore their passions early. I look forward to giving them similar inspiration that got me motivated to start so they can excel at problem-solving. \u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"21bdfd8b-107f-4156-9d10-80d8b05ccb1e\"}"},{"__ref":"DeepDives:{\"uuid\":\"465f8466-d63e-4327-a41d-d73db34d6af0\"}"},{"__ref":"DeepDives:{\"uuid\":\"5eb1d102-8df9-4a97-bb4f-79dc69053a8a\"}"},{"__ref":"DeepDives:{\"uuid\":\"5ffef0fc-4920-4b7a-ae18-d86c5ec05265\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f38fdef7-50bc-4d0d-90e5-6418595d7ab8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5aa579a6-4db2-4610-92f9-187556ab36e3\"}"},{"__ref":"Education:{\"uuid\":\"28e416b9-37b5-4974-ad6a-3c16727eab49\"}"}],"hiredAt":"2023-12-23T02:51:06.331Z","topics":[],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"arbaaz-karim\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"819a63eb-eb28-4fbb-97ad-0b190b7b9d27\"}"}}},"_sentryTraceData":"6528ae5968ea40e5ab2d7af1157542b5-8148aef63373b5be-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=6528ae5968ea40e5ab2d7af1157542b5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D
