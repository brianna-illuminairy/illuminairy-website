xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6bcafac1-c815-4f3c-8aa2-5fcff54e2aff\"}":{"__typename":"Favorites","uuid":"6bcafac1-c815-4f3c-8aa2-5fcff54e2aff","photoUrl":"https://ucarecdn.com/61719ea2-f6e3-4c53-8767-77c0f74214f4/","title":"Blue (Joni Mitchell)","type":"ALBUM"},"Favorites:{\"uuid\":\"8c96f7ff-e371-453a-a5f9-21f757248091\"}":{"__typename":"Favorites","uuid":"8c96f7ff-e371-453a-a5f9-21f757248091","photoUrl":"https://ucarecdn.com/3990c2f7-5619-4801-b993-8ff83108697a/","title":"The Golden Compass (Philip Pullman)","type":"BOOK"},"Favorites:{\"uuid\":\"8f2ba75f-6f52-4929-bff1-fc49c168cede\"}":{"__typename":"Favorites","uuid":"8f2ba75f-6f52-4929-bff1-fc49c168cede","photoUrl":"https://ucarecdn.com/351226ff-c163-492b-95a7-965a456f7c0c/","title":"Sevilla, Spain","type":"CITY"},"CausesSupported:{\"uuid\":\"4de9bf18-e96d-4653-8247-746950792368\"}":{"__typename":"CausesSupported","uuid":"4de9bf18-e96d-4653-8247-746950792368","name":"HOPE (Housing Opportunities for People Everywhere)","description":"\u003cp\u003eOutreach \u0026amp; supply distribution to unhoused community members in Providence. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/4428cbfe-8516-4495-8e03-6bd996493717/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e0e701e3-3d18-4ebe-8237-f598836fd627\"}":{"__typename":"DeepDives","uuid":"e0e701e3-3d18-4ebe-8237-f598836fd627","content":"\u003cp\u003eWhen I came to school, I planned on studying something \"practical\" like Public Policy or Sociology. Both were fields that I was interested in and cared about, but I learned very quickly that they weren't where my heart was. I changed my major to English on the journalism track because, as much as I'd tried to convince myself otherwise, writing was what I really loved. And if you think about it, almost every job in the whole world involves or rewards strong writing in some way. Talk about practical! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"c8952b10-e19f-4002-97c9-52a3c9f5fd2e\"}":{"__typename":"School","uuid":"c8952b10-e19f-4002-97c9-52a3c9f5fd2e","name":"Hunter College High School","city":"New York","type":"HIGH","state":"NY","country":"United States","zip":"10128"},"Education:{\"uuid\":\"01dcbb35-1389-40f3-8322-ca487927714a\"}":{"__typename":"Education","uuid":"01dcbb35-1389-40f3-8322-ca487927714a","school":{"__ref":"School:{\"uuid\":\"c8952b10-e19f-4002-97c9-52a3c9f5fd2e\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"a7f58ecc-e9ae-4f47-a0cf-a78dbf77f0fc\"}":{"__typename":"Education","uuid":"a7f58ecc-e9ae-4f47-a0cf-a78dbf77f0fc","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English (Nonfiction)","degree":null},"MentorPublicProfile:{\"uuid\":\"8730c8f2-abc4-4a7e-9695-f3ebad7caceb\"}":{"__typename":"MentorPublicProfile","uuid":"8730c8f2-abc4-4a7e-9695-f3ebad7caceb","displayName":"Lily S.","slug":"lily-seltz","biography":"\u003cp\u003eLily is a junior at Brown University working towards a degree in English with a focus in creative nonfiction writing and journalism. She's also pursuing a certificate in Migration Studies. Outside of her classes, Lily leads her school's weekly paper, the College Hill Independent (the Indy), as a Managing Editor. She works as a Writing Fellow for Brown's Writing Center, mentoring fellow undergraduates in academic writing across the curriculum. Lily has also written for the World and Literary sections of the Indy, and for the Arts \u0026amp; Culture section of a separate campus publication, post- magazine. She's excited to return to writing once her term as editor is up! Lily is also a member of HOPE (Housing Opportunities for People Everywhere), which conducts outreach to unhoused community members in the Providence area and advocates for policy changes related to housing affordability and poverty. She has found a home in the Environmental Program Housing community at Brown, where she cooks locally-sourced communal meals, plans social and political events, and goofs around with her fabulous housemates. Lily graduated from Hunter College High School, where she was awarded for her excellence in English, Spanish, Calculus, Constitutional Law, community service, and contribution to the well-being of others. She was co-president of Hunter's feminist group, president of their music-based community service club, and a leader of the Cross Country team. Outside of school, she volunteered for several years at an immigration advocacy organization— working as a translator for their legal clinic, a childcare worker, a receptionist, and an outreach intern. She also played the flute seriously and was a member of the New York Symphonic Band, multiple chamber groups, and the pit orchestra at her high school. (These days, Lily prefers the guitar.) When she's not wrangling with the written word, Lily loves to run, rock-climb, curate a massively long list of Spotify playlists, and analyze her friends' love lives in the North House kitchen. She believes that everyone is or can be a writer, and she can't wait to share her enthusiasm for language with younger students! (And numbers are a kind of language, too :))\u003c/p\u003e","teachingVideoPlaybackId":"HIjwenIIchp2vM6iFvfitn1ewfaZ9Y4gZBcvEAArrYE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6bcafac1-c815-4f3c-8aa2-5fcff54e2aff\"}"},{"__ref":"Favorites:{\"uuid\":\"8c96f7ff-e371-453a-a5f9-21f757248091\"}"},{"__ref":"Favorites:{\"uuid\":\"8f2ba75f-6f52-4929-bff1-fc49c168cede\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"4de9bf18-e96d-4653-8247-746950792368\"}"}],"major":"English (Nonfiction)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e0e701e3-3d18-4ebe-8237-f598836fd627\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c9be146f-2bee-437e-aa28-21629de51c2f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"01dcbb35-1389-40f3-8322-ca487927714a\"}"},{"__ref":"Education:{\"uuid\":\"a7f58ecc-e9ae-4f47-a0cf-a78dbf77f0fc\"}"}],"hiredAt":"2023-06-28T01:42:52.157Z","topics":["Journalism","Sustainability","K-5 Grade Math","Geometry","Pre-Algebra","Statistics","Precalculus / Trigonometry","Algebra I","Algebra II","Writing","Spanish","Creative Writing"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lily-seltz\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8730c8f2-abc4-4a7e-9695-f3ebad7caceb\"}"}}},"_sentryTraceData":"45d57c27a888423fa750cd78d9f97050-8b165e33fb7d39c3-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=45d57c27a888423fa750cd78d9f97050,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_
