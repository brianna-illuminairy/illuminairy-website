xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e16bb78f-0b65-4f27-b86d-e6e61d9feb96\"}":{"__typename":"Favorites","uuid":"e16bb78f-0b65-4f27-b86d-e6e61d9feb96","photoUrl":"https://ucarecdn.com/a410da56-53e0-40cc-85e8-c2be26424c80/","title":"Atomic Habits","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"10a6cc66-6aba-4bdf-b29c-7e24bdd847c6\"}":{"__typename":"DeepDives","uuid":"10a6cc66-6aba-4bdf-b29c-7e24bdd847c6","content":"\u003cp\u003eMentorship matters to me because I believe it greatly accelerates growth in ways that self-learning can’t. Having mentors has helped me gain clarity, confidence, and perspective, especially when navigating academics, career decisions, and personal development. In turn, I value mentorship as a way to give that same guidance back: specifically, helping students ask better questions, build confidence in their abilities, and see paths forward that they may not yet realize are possible\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ffdbb760-7335-42ad-bb40-e2142c68d2a6\"}":{"__typename":"DeepDives","uuid":"ffdbb760-7335-42ad-bb40-e2142c68d2a6","content":"\u003cp\u003eI chose Information Systems because it sits at the intersection of technology, business, and people. Not only do I enjoy building and working with technical systems, but I’m especially motivated by understanding why they’re built and how they create real impact for users and organizations. Information Systems allows me to combine software, data, and strategic thinking to solve practical problems, which aligns closely with how I like to learn and work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6fe357dd-56a0-437e-89d2-a335da19c1ac\"}":{"__typename":"DeepDives","uuid":"6fe357dd-56a0-437e-89d2-a335da19c1ac","content":"\u003cp\u003eIn my spare time, I enjoy a mix of learning and staying active. I’ve been consistently learning Mandarin for the past year through daily Duolingo practice, which I find to be both challenging and rewarding. I also like to unwind by playing billiards and ping pong, and I regularly lift weights as a way to stay disciplined, focused, and healthy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"af35ffc6-a36a-49ff-a247-00fb2166e156\"}":{"__typename":"DeepDives","uuid":"af35ffc6-a36a-49ff-a247-00fb2166e156","content":"\u003cp\u003eI would tell my middle or high school self to focus less on having everything figured out and more on being curious and consistent. I would emphasize on trying new things, asking questions, and sticking with challenges matters far more than early perfection. I believe that growth compounds over time, and confidence comes from effort, not from having all the answers early on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"bb032650-a981-4675-9201-5cdd8ef5d315\"}":{"__typename":"School","uuid":"bb032650-a981-4675-9201-5cdd8ef5d315","name":"Rock Bridge High School","city":"Columbia","type":"HIGH","state":"Missouri","country":"United States","zip":"65203"},"Education:{\"uuid\":\"8a0268e8-3f21-4517-aa71-f406d266c118\"}":{"__typename":"Education","uuid":"8a0268e8-3f21-4517-aa71-f406d266c118","school":{"__ref":"School:{\"uuid\":\"bb032650-a981-4675-9201-5cdd8ef5d315\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"d02fed2f-49ae-4fcf-99f0-74dd6ae4f142\"}":{"__typename":"Education","uuid":"d02fed2f-49ae-4fcf-99f0-74dd6ae4f142","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Information Systems","degree":null},"MentorPublicProfile:{\"uuid\":\"d0ac92fe-c5d8-4d12-9663-e80d4f0711aa\"}":{"__typename":"MentorPublicProfile","uuid":"d0ac92fe-c5d8-4d12-9663-e80d4f0711aa","displayName":"Jorge G.","slug":"jorge-graciaviveros","biography":"\u003cp\u003eI was born in Monterrey, Mexico, and now I’m an Information Systems student at Carnegie Mellon University with a strong interest in how technology, data, and people come together to solve meaningful problems. Growing up between cultures has shaped how I think and communicate, and it has made me especially adaptable and curious about the systems, technical and human, that shape everyday experiences. I care deeply about learning with purpose, whether that means building software that improves real-world systems, helping others navigate complex decisions, or continuously challenging myself to grow both intellectually and personally. My coursework and projects have exposed me to software development, data analysis, and systems thinking, reinforcing my interest in building solutions that are both technically sound and user-focused.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I spend a lot of my time in leadership and mentorship roles. I serve as the President of the Scholars of Finance chapter at CMU, where I help organize professional development events, connect students with mentors and internships, and foster a strong, supportive community. In this role, I’ve learned how impactful guidance and access to information can be, especially for students navigating competitive academic and career paths. I’m also a Teaching Assistant for multiple courses, which has given me hands-on experience guiding students through challenging material, breaking down complex concepts, and meeting people where they are in their learning process. These experiences have shaped how I approach mentorship, with empathy, clarity, and a focus on building confidence rather than just delivering answers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I’ve interned as a Software Development Engineer at Amazon for the past two years, where I worked on full-stack systems and gained experience building scalable, production-level software used by real customers. That experience reinforced my interest in technology as a tool for impact and taught me the importance of ownership, collaboration, and clear communication in fast-paced environments. Upon graduation, I will be working at BlackRock as a Software Engineer in San Francisco, where I hope to continue building reliable systems that support critical business and financial decisions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and work, I value consistency and personal growth. I’ve been learning Mandarin daily for over a year, enjoy playing billiards and ping pong, and lift weights regularly as a way to stay disciplined and balanced. Overall, I’m someone who values curiosity, effort, and giving back—and I’m excited about opportunities to support and mentor others as they grow academically, personally, and professionally.\u003c/p\u003e","teachingVideoPlaybackId":"uEVy7xwEfDWT01k13r58DgnbaECz8j13zUAwHN007RkQA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003e2x Software Engineer Intern @ Amazon\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI completed an associate degree through an Early College Program before graduating from high school. My journey was featured in a local news story, and I was interviewed about the experience:\u003cbr\u003ehttps://www.komu.com/news/midmissourinews/early-college-program-helps-cps-students-earn-college-credit-tuition-before-graduating/article_278942d6-26b3-11ec-8fda-d734a27d6270.html\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e16bb78f-0b65-4f27-b86d-e6e61d9feb96\"}"}],"causesSupported":[],"major":"Information Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"10a6cc66-6aba-4bdf-b29c-7e24bdd847c6\"}"},{"__ref":"DeepDives:{\"uuid\":\"ffdbb760-7335-42ad-bb40-e2142c68d2a6\"}"},{"__ref":"DeepDives:{\"uuid\":\"6fe357dd-56a0-437e-89d2-a335da19c1ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"af35ffc6-a36a-49ff-a247-00fb2166e156\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bef34db6-6f7d-45bc-8ddf-2414039460cb/-/preview/-/format/jpg/","https://ucarecdn.com/a5b96985-e21a-4960-bcf5-240740388348/-/preview/-/format/jpg/","https://ucarecdn.com/b553db35-4404-4b6f-8994-8bb929499655/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8a0268e8-3f21-4517-aa71-f406d266c118\"}"},{"__ref":"Education:{\"uuid\":\"d02fed2f-49ae-4fcf-99f0-74dd6ae4f142\"}"}],"hiredAt":"2025-12-23T09:39:19.568Z","topics":["Algebra I","Algebra II","Pre-Algebra","K-5 Grade Math","Precalculus / Trigonometry","6-8 Grade Science","Ch
