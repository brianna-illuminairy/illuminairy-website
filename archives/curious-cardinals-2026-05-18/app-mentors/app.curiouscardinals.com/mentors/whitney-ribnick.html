xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3c6eefc9-6c6b-44e1-9942-d605d68570b0\"}":{"__typename":"Favorites","uuid":"3c6eefc9-6c6b-44e1-9942-d605d68570b0","photoUrl":"https://ucarecdn.com/4b9e3496-da99-408f-a5f6-7ed70db19377/","title":"Milo Ventimiglia","type":"ACTOR"},"Favorites:{\"uuid\":\"adc8e83b-ea8f-4c4f-8669-e081a7f5a386\"}":{"__typename":"Favorites","uuid":"adc8e83b-ea8f-4c4f-8669-e081a7f5a386","photoUrl":"https://ucarecdn.com/df134441-9b6f-46f6-be9b-415e982491c7/","title":"Five Seconds Flat","type":"ALBUM"},"Favorites:{\"uuid\":\"6a66a24a-3f99-40ef-9297-3b78be58a178\"}":{"__typename":"Favorites","uuid":"6a66a24a-3f99-40ef-9297-3b78be58a178","photoUrl":"https://ucarecdn.com/2f9d5c09-9c7a-495c-b502-02bf3f332c7f/","title":"All Time Low","type":"ARTIST"},"CausesSupported:{\"uuid\":\"52c38977-2ed6-4870-9fd9-b6feb66af645\"}":{"__typename":"CausesSupported","uuid":"52c38977-2ed6-4870-9fd9-b6feb66af645","name":"Arthritis Foundation","description":"\u003cp\u003eAs someone who was diagnosed with Juvenile Arthritis at 8, I support this cause\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"41a15ffe-e769-446e-9f14-f161988ede9f\"}":{"__typename":"DeepDives","uuid":"41a15ffe-e769-446e-9f14-f161988ede9f","content":"\u003cp\u003eLife goes on. No matter what happens. Despite any challenges you may face, they can be overcome by going through or going around a problem. Whether this be personal, mental, or physical, with the support of the people around you, you can and WILL make it through.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"94572f8b-6e90-4f9c-8542-6ad3753a4b36\"}":{"__typename":"DeepDives","uuid":"94572f8b-6e90-4f9c-8542-6ad3753a4b36","content":"\u003cp\u003eAs someone who always asks questions, I understand needing extra clarification or to stop and take a moment to try and comprehend. Additionally, I have post-concussion syndrome, so continuing to learn with attention deficits is something I'm familiar with and empathize with. I'm happy to work with any disabilities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6b8ab4ac-458f-4c41-8c56-af670c2b9a21\"}":{"__typename":"DeepDives","uuid":"6b8ab4ac-458f-4c41-8c56-af670c2b9a21","content":"\u003cp\u003eDuring my first two summers in high school, I went to theatre camp! I did High School Musical the Musical and Cats! After that, I got a job at a pharmacy and worked there full-time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a536c045-7f03-425b-aa13-aaa5e0ed5637\"}":{"__typename":"DeepDives","uuid":"a536c045-7f03-425b-aa13-aaa5e0ed5637","content":"\u003cp\u003eI loved AP Chemistry and was really interested in the pharmaceutical industry. I was also interested in Biomedical Engineering, and my junior year Carnegie Mellon they created a double major I immediately signed up for. Previously, I was just minoring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"cd73e868-94ed-48db-9124-7051a3b438da\"}":{"__typename":"School","uuid":"cd73e868-94ed-48db-9124-7051a3b438da","name":"Cypress Bay High School","city":"Weston","type":"HIGH","state":"Florida","country":"United States","zip":"33332"},"Education:{\"uuid\":\"72fa376a-9b33-4672-a162-ff6bd4011a81\"}":{"__typename":"Education","uuid":"72fa376a-9b33-4672-a162-ff6bd4011a81","school":{"__ref":"School:{\"uuid\":\"cd73e868-94ed-48db-9124-7051a3b438da\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"88779080-6d0b-4219-92aa-2fbdb999c08f\"}":{"__typename":"Education","uuid":"88779080-6d0b-4219-92aa-2fbdb999c08f","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Chemistry/Biochemistry Track and Biomedical Technology/Biomaterials and Tissue Engineering Track","degree":null},"MentorPublicProfile:{\"uuid\":\"f68f6fa7-508f-455d-90e7-d8e989e557db\"}":{"__typename":"MentorPublicProfile","uuid":"f68f6fa7-508f-455d-90e7-d8e989e557db","displayName":"Whitney R.","slug":"whitney-ribnick","biography":"\u003cp\u003e\u003cstrong\u003eAbout Me:\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eHi! My name is Whitney Ribnick and I'm a current pre-med senior at Carnegie Mellon University double majoring in Chemistry and Biomedical Technology. I originally entered college wanting to get my PhD in Chemistry to work on drug development, and it took me seeing the different sides of research to understand where my true passions lied: person-to-person interaction. I’ve now received 8 medical school interviews, 3 medical school acceptances and am waiting to hear back from the others. I’ve worked on both basic science and clinical research and am happy to give perspectives about both!\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m Qualified:\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout my time at CMU, I've overloaded on classes, published a paper, and worked 5 jobs all while maintaining a 4.0 average at a T20 school. One of my jobs has been acting as a role model to students through being a Resident Assistant. My responsibilities during this time was guiding students through career choices, connecting them with opportunities, and also helping them grow personally.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Specialties:\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've been tutoring and mentoring students for over 4 years now. I specialize in the sciences, specifically chemistry and biology, and am happy to assist with students of all ages, abilities and experience levels. I've tutored classes from 5th grade math to Organic Chemistry. I’ve also worked on multiple research and passion projects such as looking into the filtration systems of nicotine, the effects of psilocybin on the brain, and am currently developing a pulse oximeter for felines.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat Our Sessions Can Look Like:\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTalking through ideas to see what is possible\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFinding your interests!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorking through problems together, I’m \u003cstrong\u003eALWAYS\u003c/strong\u003e happy to answer questions or rework something so it makes more sense for you!!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003eFun Facts:\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI am Cheer Captain for the Carnegie Mellon Tartans\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI've been performing in musical theatre since I was 8\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI play Pokemon, Undertale, and The Legend of Zelda series\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI'm a big NY Sports fan (mainly hockey #letsgorangers)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI’m not sure what medicine I want to go into, but I’m excited to explore all of the options\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI love to cook and bake and recently got a Ninja Creami I love to experiment with and try new recipes\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"cM4IoWVQNG702SfiadkrfmPRCXKHvAdtgXyvtFKZ1SA4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWorking at a refugee center, I mentored two high school siblings from Syria. Through this experience, I recognized there were things out of my control, but I couldn’t have imagined the impact. The students were bright, creative, and excited to take the opportunities their new school had to offer, however, they lived in a poor area. Therefore they didn’t have access to the resources they hoped for. After tutoring one day, I got a panicked message from the students after they learned their school was in the bottom 15% of standardized test scores for the state of Pennsylvania. They wanted to attend a top-tier college and were concerned this would limit their options.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThey didn’t have the funds to relocate, but wanted the best education possible. Other families with the money and ability to change schools were at a systematic advantage. My focus shifted from exams and personal issues to the more pressing problems of the kids I was mentoring. They refused to let their fire and desire for education be stopped, so I continued to encourage them to be the best version of themselves. I worked with them on their assignments, provided supplemental materials and did my best to be an educator while researching how to apply to magnet schools. Though the inequities in their lives could not be directly addressed, I did my best to work with them personally.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAlmost imperceptibly, my priority shifted from myself to these kids. I lost myself in the job, constantly thinking about what I could do to help them. It did not feel like work anymore, but a passion bigger than myself. I found a deeper meaning. I watched them grow into strong independent thinkers with empathy and problem-solving skills that made me proud. The joy I captured came from us working and learning together. Our lives have been deeply impacted by one another.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eWhile I enjoyed doing well in school, there was something transcendental about having a direct impact on the well-being of others. Watching my students grow intellectually and helping them stay positive in the face of adversity was inspiring. I found that working towards their goals transported me away from the minutia of my own life, making me become less inwardly focused and more aware of the world as a whole.\u0026nbsp;\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"3c6eefc9-6c6b-44e1-9942-d605d68570b0\"}"},{"__ref":"Favorites:{\"uuid\":\"adc8e83b-ea8f-4c4f-8669-e081a7f5a386\"}"},{"__ref":"Favorites:{\"uuid\":\"6a66a24a-3f99-40ef-9297-3b78be58a178\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"52c38977-2ed6-4870-9fd9-b6feb66af645\"}"}],"major":"Chemistry/Biochemistry Track and Biomedical Technology/Biomaterials and Tissue Engineering Track","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"41a15ffe-e769-446e-9f14-f161988ede9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"94572f8b-6e90-4f9c-8542-6ad3753a4b36\"}"},{"__ref":"DeepDives:{\"uuid\":\"6b8ab4ac-458f-4c41-8c56-af670c2b9a21\"}"},{"__ref":"DeepDives:{\"uuid\":\"a536c045-7f03-425b-aa13-aaa5e0ed5637\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f3c9d9e8-6bf3-417d-a44a-138598ff306b/-/preview/-/format/jpg/","https://ucarecdn.com/a6a4b4a7-a538-45d8-bf24-7bc51b906cc6/-/preview/-/format/jpg/","https://ucarecdn.com/5fcf3820-aff9-4f3d-99c6-f75ffb432c87/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"72fa376a-9b33-4672-a162-ff6bd4011a81\"}"},{"__ref":"Education:{\"uuid\":\"88779080-6d0b-4219-92aa-2fbdb999c08f\"}"}],"hiredAt":"2026-01-16T15:21:13.853Z","topics":["6-8 Grade Science","Biology","Chemistry","Academic Coaching","Executive Function"],"communityBadges":["https://ucarecdn.com/754f9a3e-f5c4-4576-8cdd-2cdf8c2e4e63/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"whitney-ribnick\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f68f6fa7-508f-455d-90e7-d8e989e557db\"}"}}},"_sentryTraceData":"cbb5c9563713404a950b45039478c5da-839e241e784bce48-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=cbb5c9563713404a950b45039478c5da,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"whitney-ribnick"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google
