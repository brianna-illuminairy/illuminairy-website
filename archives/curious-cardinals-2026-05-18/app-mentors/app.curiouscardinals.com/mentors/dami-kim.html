xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3636c7b7-6c2d-4b3d-9bc6-732a368a78e4\"}":{"__typename":"Favorites","uuid":"3636c7b7-6c2d-4b3d-9bc6-732a368a78e4","photoUrl":"https://ucarecdn.com/066362da-aedf-4944-ae06-cd6ad1161696/","title":"Freudian","type":"ALBUM"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5bdc6575-3a95-4a7e-a567-60b1ed3d1fc5\"}":{"__typename":"DeepDives","uuid":"5bdc6575-3a95-4a7e-a567-60b1ed3d1fc5","content":"\u003cp\u003eI love to paint, draw, and make little crafts in my spare time :) I also like taking pictures and playing the guitar! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"79e04901-6077-44d2-bf53-617bad736cba\"}":{"__typename":"DeepDives","uuid":"79e04901-6077-44d2-bf53-617bad736cba","content":"\u003cp\u003eRecently, I've been working on small tech projects outside of school. I designed and 3D-printed custom Mecanum wheels, then built a small Arduino-powered robot capable of omni-directional movement. It was a great way to explore mechanical design, motion control, and the unique kinematics of holonomic drive systems. I also developed a virtual painter using OpenCV that lets users draw and erase in real time using hand gestures. This project was a good introduction to computer vision, which is a topic I am further exploring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"85573413-e4a5-4306-a27c-17f1ae669673\"}":{"__typename":"School","uuid":"85573413-e4a5-4306-a27c-17f1ae669673","name":"Montgomery Blair High School","city":"Silver Spring","type":"HIGH","state":"Maryland","country":"United States","zip":"20901"},"Education:{\"uuid\":\"1174ae0c-1808-435d-ba3b-6fe5c033017c\"}":{"__typename":"Education","uuid":"1174ae0c-1808-435d-ba3b-6fe5c033017c","school":{"__ref":"School:{\"uuid\":\"85573413-e4a5-4306-a27c-17f1ae669673\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}":{"__typename":"School","uuid":"11470c0e-6098-4972-92d0-60616358bd13","name":"California Institute of Technology","city":"Pasadena","type":"COLLEGE","state":"California","country":"United States","zip":"91125"},"Education:{\"uuid\":\"f9074cd5-8f3e-40e6-a819-8c4d32be6b75\"}":{"__typename":"Education","uuid":"f9074cd5-8f3e-40e6-a819-8c4d32be6b75","school":{"__ref":"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"4c6f31aa-f7a3-4668-b452-74b90863f2ac\"}":{"__typename":"MentorPublicProfile","uuid":"4c6f31aa-f7a3-4668-b452-74b90863f2ac","displayName":"Dami K.","slug":"dami-kim","biography":"\u003cp\u003eHi! My name is Dami, and I’m a sophomore at Caltech pursuing a major in Electrical Engineering and a minor in Computer Science. I’m passionate about robotics, entrepreneurship, and STEM education. I’ve been a part of award-winning robotics teams through FIRST, conducted biomechanics and robotics research at Johns Hopkins and the University of Maryland, and am now starting my journey at Caltech as a researcher in autonomous technologies and an active student involved in robotics, investing, and hackathons.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne of the most meaningful parts of my journey has been mentoring younger students. In high school, I founded the East Coast branch of Opportunity X, a nonprofit that brings STEM research to under-resourced communities. I’ve recruited and managed 60+ peers in the region who came together with a goal of sharing something we know. We were able to create after-school STEM clubs that had more than 100 middle school students carry out a science project of their design. Over three years, the program kept growing, and we taught fun experiments, mentored projects, hosted annual science fair events, and even organized an international summer camp.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince then, I’ve been curious about how I can make an impact and bring people together through tech, management, and mentorship.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve tutored math and science to students spanning middle and high school, helping them tackle everything from Pre-Algebra to Calculus and Python programming. I’ve participated in a few math competitions (AMC, AIME), so I’m aware of the problem structures there. I've worked as an art lead for my high school's newspaper, and I love making pretty slides; I can definitely help out with art and design-related goals. I’ve built fun projects with Arduino and Raspberry Pi, and I’m excited to help a mentee get started on a mini robotics project.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAdditionally, as someone who (semi) recently came out of the college application process, I know exactly how tough it is. If you are a high school student, in particular, I am here to understand your difficulties, provide insight, and guide you through the process rather than show up every week for a cold and transactional lesson. (Use me as your older sister! I’m always available to chat 🍵😊)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I aim to meet students where they are, break down tough concepts, and spark excitement in learning. I hope for both the mentee and myself to gain something meaningful from the relationship and grow together as a team.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether you're new to STEM or already building robots, I’m here to support your growth with patience, enthusiasm, and real-world experience.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLet’s build something amazing together.\u003c/p\u003e","teachingVideoPlaybackId":"VfHYk00bpcGDJO00s1BHirheolXVLI8A84vdegwYGR01o8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3636c7b7-6c2d-4b3d-9bc6-732a368a78e4\"}"}],"causesSupported":[],"major":"Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5bdc6575-3a95-4a7e-a567-60b1ed3d1fc5\"}"},{"__ref":"DeepDives:{\"uuid\":\"79e04901-6077-44d2-bf53-617bad736cba\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0771c032-053d-4ad0-804a-88a97c5b30a0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1174ae0c-1808-435d-ba3b-6fe5c033017c\"}"},{"__ref":"Education:{\"uuid\":\"f9074cd5-8f3e-40e6-a819-8c4d32be6b75\"}"}],"hiredAt":"2025-04-30T23:28:59.928Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","College Essay Writing","Executive Function","Academic Coaching","Computer Science"],"communityBadges":["https://ucarecdn.com/1e4a2735-1bb6-4525-bb3b-365dd5531407/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"dami-kim\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4c6f31aa-f7a3-4668-b452-74b90863f2ac\"}"}}},"_sentry
