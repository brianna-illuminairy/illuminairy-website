xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ffef4843-5f3b-4821-bf52-87717a2e1582\"}":{"__typename":"Favorites","uuid":"ffef4843-5f3b-4821-bf52-87717a2e1582","photoUrl":"https://ucarecdn.com/dc9bfdef-7736-48c8-a5e7-55684133055e/","title":"Folklore","type":"ALBUM"},"Favorites:{\"uuid\":\"70498c22-6914-466c-8b98-2b8b49941566\"}":{"__typename":"Favorites","uuid":"70498c22-6914-466c-8b98-2b8b49941566","photoUrl":"https://ucarecdn.com/e07620fd-ae18-4c02-a46d-d2d93aba4e45/","title":"Interstellar","type":"MOVIE"},"Favorites:{\"uuid\":\"97ae070e-acf1-4520-b324-bc2b6969a5d3\"}":{"__typename":"Favorites","uuid":"97ae070e-acf1-4520-b324-bc2b6969a5d3","photoUrl":"https://ucarecdn.com/91d3b847-50c6-48b6-9fe5-1f7736f658f2/","title":"The Invisible Life of Addie LaRue","type":"BOOK"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"16ee2c89-a53b-425b-a8df-3b5469bd9593\"}":{"__typename":"DeepDives","uuid":"16ee2c89-a53b-425b-a8df-3b5469bd9593","content":"\u003cp\u003eMy dream job is to work in consumer robotics or electronics! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f6d2d0c8-f7da-44aa-85e6-54046b990de1\"}":{"__typename":"DeepDives","uuid":"f6d2d0c8-f7da-44aa-85e6-54046b990de1","content":"\u003cp\u003eMechanical engineering is very broad, which allows me to explore my interests in both design and engineering.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6970edf0-e275-4038-a341-3ccafad908a5\"}":{"__typename":"DeepDives","uuid":"6970edf0-e275-4038-a341-3ccafad908a5","content":"\u003cp\u003eI've been lucky to have strong mentors throughout my education, and I would love to help someone else the same way. I know how helpful it can be to have someone with expertise and who can help guide you as you have questions, curiosities, and needs.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"73e9c107-59db-4bba-bcad-63ad48b773da\"}":{"__typename":"DeepDives","uuid":"73e9c107-59db-4bba-bcad-63ad48b773da","content":"\u003cp\u003eIn my spare time I love spending time with friends outdoors, including hiking and running.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"fe49eeb1-55b5-43ed-999f-1e28165ceabb\"}":{"__typename":"School","uuid":"fe49eeb1-55b5-43ed-999f-1e28165ceabb","name":"Brookline High School","city":"Brookline","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02445"},"Education:{\"uuid\":\"a66d1b53-6cc7-4543-a50f-82c8e9375aed\"}":{"__typename":"Education","uuid":"a66d1b53-6cc7-4543-a50f-82c8e9375aed","school":{"__ref":"School:{\"uuid\":\"fe49eeb1-55b5-43ed-999f-1e28165ceabb\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"2561fc7a-c8de-45a3-ab4d-5eb1ef8b2248\"}":{"__typename":"Education","uuid":"2561fc7a-c8de-45a3-ab4d-5eb1ef8b2248","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"07b62d51-0a4c-469a-badf-b9ec9ab7a6aa\"}":{"__typename":"MentorPublicProfile","uuid":"07b62d51-0a4c-469a-badf-b9ec9ab7a6aa","displayName":"Audrey G.","slug":"audrey-garon","biography":"\u003cp\u003eHi! My name is Audrey, and I’m a junior at Cornell University studying mechanical engineering. On campus, I stay busy with both academic and extracurricular activities that let me explore my interests in technology, design, and teamwork. I’m currently involved in engineering research and serve as the Distance Captain of the Club Track Team, where I help organize practices, support teammates, and build a positive team environment.\u003c/p\u003e\u003cp\u003eDuring my first two years at Cornell, I worked in the Organic Robotics Lab on a robot fish project. The research focused on designing soft robotic systems that mimic the movement of real fish, which gave me experience with prototyping, experimentation, and thinking creatively about how biological systems can inspire engineering solutions. More recently, I joined the HAPPI Lab, focusing on haptics and human-robot interaction. I’m currently working on a project designed to help regulate a person’s body temperature through the movement of connected tiles.\u0026nbsp;\u003c/p\u003e\u003cp\u003eLooking ahead, I’m excited about pursuing a career in consumer electronics or consumer robotics. I’m especially interested in roles that combine technical engineering with thoughtful product design. I enjoy the challenge of turning ideas into real, functional systems, and I love finding creative ways to solve technical problems. Engineering is exciting to me because it sits at the intersection of analytical thinking and creativity.\u003c/p\u003e\u003cp\u003eGrowing up, my favorite classes were always math and writing or reading classes. I liked math because it challenged me to think logically and solve problems step by step, while writing allowed me to be creative and communicate ideas clearly. Because of that interest in math, I worked as a math tutor for several years. Tutoring felt really rewarding because I enjoyed helping students build confidence and understand concepts that once felt difficult.\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy spending time with friends and staying active. I love activities like hiking, running, and exploring the outdoors. Whenever the weather is nice, my friends and I try to go on a hike. I’m also an avid reader and enjoy finding new books whenever I have free time. These hobbies help me stay balanced and bring creativity and energy into the rest of my work.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"GxCUe80056yomGnmaUD500mnPgDTfKc7dvSxfpxKo01sbQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ffef4843-5f3b-4821-bf52-87717a2e1582\"}"},{"__ref":"Favorites:{\"uuid\":\"70498c22-6914-466c-8b98-2b8b49941566\"}"},{"__ref":"Favorites:{\"uuid\":\"97ae070e-acf1-4520-b324-bc2b6969a5d3\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"16ee2c89-a53b-425b-a8df-3b5469bd9593\"}"},{"__ref":"DeepDives:{\"uuid\":\"f6d2d0c8-f7da-44aa-85e6-54046b990de1\"}"},{"__ref":"DeepDives:{\"uuid\":\"6970edf0-e275-4038-a341-3ccafad908a5\"}"},{"__ref":"DeepDives:{\"uuid\":\"73e9c107-59db-4bba-bcad-63ad48b773da\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b6b639cd-197b-
