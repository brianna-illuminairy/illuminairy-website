js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b431658a-1681-440c-9b16-18ee50e0ea84\"}":{"__typename":"DeepDives","uuid":"b431658a-1681-440c-9b16-18ee50e0ea84","content":"\u003cp\u003eI'd tell my younger self to stop waiting until you fully understand something before you're willing to engage with it. For a long time, I held back in class discussions, stayed quiet when I was confused, and convinced myself I'd participate once I \"really got it.\" But that's backwards — the engagement is how you get it. Confusion isn't a reason to wait on the sidelines. It's an invitation to jump in.\u003c/p\u003e\u003cp\u003eI'd also say: care less about looking smart and more about actually learning. Those two things feel similar from the outside, but they lead you to completely different places. One makes you avoid hard problems. The other makes you seek them out.\u003c/p\u003e\u003cp\u003eAnd practically speaking — ask your teachers more questions. Not to impress them, but because most of them genuinely love their subject and will give you a completely different understanding of it if you give them the chance. Some of my richest learning has happened in office hours or casual conversations, not in lecture.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"dfc82138-4c95-4c50-b6ab-7ce1379f4914\"}":{"__typename":"DeepDives","uuid":"dfc82138-4c95-4c50-b6ab-7ce1379f4914","content":"\u003cp\u003eOn the surface, I probably come across as someone who spends most of his time thinking about genomes and molecular biology — and honestly, that's not wrong. But one thing that might surprise people is that I'm just as comfortable in the wilderness as I am in a lab. I've spent a good amount of time backpacking and camping, and there's something about navigating the outdoors — reading terrain, solving problems with limited resources, knowing which knot to tie and when — that scratches the same itch as research. Both require you to slow down, pay attention, and think carefully before you act.\u003c/p\u003e\u003cp\u003eI think that's actually shaped how I approach learning and tutoring more than people might expect. Science, like the outdoors, rewards patience and careful observation over rushing to an answer. The students I've connected with most are the ones who are willing to sit with a hard problem for a moment instead of immediately reaching for the solution — and I try to model that myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5724b088-f407-4e73-8e53-4d9a78c89bca\"}":{"__typename":"DeepDives","uuid":"5724b088-f407-4e73-8e53-4d9a78c89bca","content":"\u003cp\u003eWhen I'm not in the lab or buried in coursework, you'll usually find me outside or in the kitchen. I love going on walks — there's something about getting away from a screen and just moving that helps me reset and think more clearly. I've also gotten into rock climbing, which has become one of my favorite ways to challenge myself physically and mentally. Climbing has a lot in common with problem-solving in science: you can stare at a route for a while convinced there's no way through, and then suddenly the sequence reveals itself. It rewards patience and creativity in a way I really appreciate.\u003c/p\u003e\u003cp\u003eCooking is another big one for me. I find it genuinely relaxing after a long day, and I like the improvisational aspect of it — working with what you have and figuring it out as you go. It's one of those hobbies that's both grounding and endlessly interesting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"bbf052a2-4d77-4f1d-841b-443627a4fce5\"}":{"__typename":"DeepDives","uuid":"bbf052a2-4d77-4f1d-841b-443627a4fce5","content":"\u003cp\u003eGrowing up, my grandmother was one of the most formative influences in my life. She's Chinese, and so much of how she showed love and care was through patience — sitting with me, not rushing me, making sure I actually understood something before moving on. She never made me feel stupid for not knowing something. She just stayed present until we figured it out together.\u003c/p\u003e\u003cp\u003eI didn't realize until much later how much that shaped the way I approach learning. There's a certain unhurried quality to how she taught me things — whether it was how to cook a dish or navigate a new situation — that I've carried into how I work with students. I never want someone sitting across from me to feel like they're behind, or like their confusion is an inconvenience. If anything, it's where the real work begins.\u003c/p\u003e\u003cp\u003eThat patience, that willingness to stay in the difficult moment with someone rather than rushing past it — I think that's one of the most valuable things I can offer as a tutor. And I have my grandmother to thank for it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"f3b5046a-7f68-4da5-95e9-89059d5f13cd\"}":{"__typename":"School","uuid":"f3b5046a-7f68-4da5-95e9-89059d5f13cd","name":"Upper Dublin High School","city":"Fort Washington","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19034"},"Education:{\"uuid\":\"cea4d4fe-f2a9-4b56-a19d-658748a492ce\"}":{"__typename":"Education","uuid":"cea4d4fe-f2a9-4b56-a19d-658748a492ce","school":{"__ref":"School:{\"uuid\":\"f3b5046a-7f68-4da5-95e9-89059d5f13cd\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"a0cba858-9000-47df-abf6-f02533ec4ddd\"}":{"__typename":"Education","uuid":"a0cba858-9000-47df-abf6-f02533ec4ddd","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computational Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"f17cded9-7bf7-4730-87ad-8a6acae6b004\"}":{"__typename":"MentorPublicProfile","uuid":"f17cded9-7bf7-4730-87ad-8a6acae6b004","displayName":"Jason C.","slug":"jason-chang","biography":"\u003cp\u003eHi! I'm Jason, a senior at Brown University studying Computational Biology. I'm passionate about the life sciences and the process of learning how to think rigorously about complex biological systems — and I'd love to help you do the same.\u003c/p\u003e\u003cp\u003eMy academic journey has taken me from introductory biology and chemistry all the way through upper-level coursework in genetics, molecular biology, population genetics, and computational methods. Right now, I'm completing an honors thesis investigating the LINE-1 ORF0 protein, a relatively uncharacterized product of one of the most abundant genetic elements in the human genome. Working in a research lab has fundamentally changed how I engage with science. It's taught me that the best scientists aren't the ones who memorize the most — they're the ones who ask the best questions and know how to sit with uncertainty until something clicks. That insight shapes everything about how I tutor.\u003c/p\u003e\u003cp\u003eMy approach is collaborative and Socratic. Rather than just walking you through answers, I'll ask you questions, work through problems alongside you, and help you build the kind of intuition that holds up on exams and beyond. I genuinely believe that confusion is a sign you're on the verge of understanding something — so I try to meet students right there and help them push through it. Science can feel overwhelming when it's presented as a wall of facts to memorize, but it becomes a lot more manageable — even exciting — when you start to see the underlying logic connecting everything together.\u003c/p\u003e\u003cp\u003eI'm well-equipped to help with a wide range of pre-med and biology subjects, including introductory biology and chemistry, genetics, cell and molecular biology, biochemistry, and science writing. I also have experience with quantitative and computational methods in biology, so if your course has a stats or data analysis component, I'm comfortable there too.\u003c/p\u003e\u003cp\u003eOutside of research, I've been pursuing clinical experiences across several specialties, which has deepened my appreciation for why this foundational science actually matters. Understanding biology isn't just about getting into medical school — it's about building a framework for thinking about human health that will serve you for the rest of your career.\u003c/p\u003e\u003cp\u003eWhether you're trying to survive orgo, prep for the MCAT, or genuinely fall in love with biology, I'd love to work with you. Let's figure it out together.\u003c/p\u003e","teachingVideoPlaybackId":"DNfhe1NbA86u4S0201b802NmVg7iLcwYXK00x5DiiYNTwaw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computational Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b431658a-1681-440c-9b16-18ee50e0ea84\"}"},{"__ref":"DeepDives:{\"uuid\":\"dfc82138-4c95-4c50-b6ab-7ce1379f4914\"}"},{"__ref":"DeepDives:{\"uuid\":\"5724b088-f407-4e73-8e53-4d9a78c89bca\"}"},{"__ref":"DeepDives:{\"uuid\":\"bbf052a2-4d77-4f1d-841b-443627a4fce5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dd2f698b-b3f3-455c-9aed-7a421ff22b98/-/preview/-/format/jpg/","https://ucarecdn.com/0d70b5c1-f9cd-4808-82e4-051c598204e4/-/preview/-/format/jpg/","https://ucarecdn.com/3f3c4f30-b3da-44b0-9b95-b06bd43b154b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cea4d4fe-f2a9-4b56-a19d-658748a492ce\"}"},{"__ref":"Education:{\"uuid\":\"a0cba858-9000-47df-abf6-f02533ec4ddd\"}"}],"hiredAt":"2026-01-28T18:06:22.525Z","topics":["Statistics","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","Physics","Biology","Chemistry","6-8 Grade Science","Academic Coaching","Executive Function","Computer Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jason-chang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f17cded9-7bf7-4730-87ad-8a6acae6b004\"}"}}},"_sentryTraceData":"24577c0d931b4e1ba2eec8049fcfe3f1-91e8fc2864217145-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=24577c0d931b4e1ba2eec8049fcfe3f1,sentry-sample_rate=0.2,sentry-transaction
