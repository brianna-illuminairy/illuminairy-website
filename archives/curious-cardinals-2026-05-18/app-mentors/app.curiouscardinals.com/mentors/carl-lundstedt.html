xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"af13805a-5c0d-4d94-9cb6-0b91baeb4916\"}":{"__typename":"DeepDives","uuid":"af13805a-5c0d-4d94-9cb6-0b91baeb4916","content":"\u003cp\u003eMentorship, to me, is about helping someone feel \u003cstrong\u003esupported, challenged, and confident enough to try\u003c/strong\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve had mentors who changed my life simply by believing in me and giving me space to grow — and I try to offer that same mix of \u003cstrong\u003eencouragement, structure, and trust\u003c/strong\u003e to my students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5c9ecabd-6276-46f4-9445-e51a61dcdc33\"}":{"__typename":"DeepDives","uuid":"5c9ecabd-6276-46f4-9445-e51a61dcdc33","content":"\u003cp\u003eI chose to pursue my \u003cstrong\u003eMaster’s in Social Work at Columbia\u003c/strong\u003e because I wanted to help people in a way that feels both \u003cstrong\u003epersonal and impactful\u003c/strong\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat excites me most is the intersection of \u003cstrong\u003estorytelling, healing, and advocacy\u003c/strong\u003e — supporting individual growth while also thinking about how larger systems and narratives can change.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"e7ea7f84-0819-4c93-a420-ca905ed6b9c4\"}":{"__typename":"DeepDives","uuid":"e7ea7f84-0819-4c93-a420-ca905ed6b9c4","content":"\u003cp\u003e\u003cstrong\u003eCuriosity.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’m constantly curious about people, their stories, and what drives them. That curiosity has shaped my path as an actor, teacher, and now social worker — and it’s a big part of what I bring into mentorship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f4133e88-4040-4933-8db6-8f1045c522d0\"}":{"__typename":"DeepDives","uuid":"f4133e88-4040-4933-8db6-8f1045c522d0","content":"\u003cp\u003e\u003cstrong\u003eTraveling\u003c/strong\u003e 🌍\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love exploring new places, spending time in nature, and learning from cultures and histories different from my own. I’ve been to almost every continent — Australia and Antarctica are next — and I’m always excited for the next adventure.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"58652ddc-03b9-4dd1-9080-fd346aff6fc7\"}":{"__typename":"School","uuid":"58652ddc-03b9-4dd1-9080-fd346aff6fc7","name":"Libertyville High School","city":"Libertyville","type":"HIGH","state":"Illinois","country":"United States","zip":"60048"},"Education:{\"uuid\":\"cde025f4-9212-4891-a5ce-d2f18cdc34cf\"}":{"__typename":"Education","uuid":"cde025f4-9212-4891-a5ce-d2f18cdc34cf","school":{"__ref":"School:{\"uuid\":\"58652ddc-03b9-4dd1-9080-fd346aff6fc7\"}"},"startYear":"2006","endYear":"2010","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"d0fee7a8-004f-40db-8cb6-763870de6828\"}":{"__typename":"Education","uuid":"d0fee7a8-004f-40db-8cb6-763870de6828","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2010","endYear":null,"expectedGradYear":"2014","major":"Acting","degree":null},"MentorPublicProfile:{\"uuid\":\"56ac1423-4c92-413e-a1a7-133066f73aff\"}":{"__typename":"MentorPublicProfile","uuid":"56ac1423-4c92-413e-a1a7-133066f73aff","displayName":"Carl L.","slug":"carl-lundstedt","biography":"\u003cp\u003e\"I help students turn meaningful ideas into polished, creative projects.\" 🎬✨\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHi! I’m Carl — a Columbia University Master of Social Work student, professional actor, and creative mentor who loves helping students bring big ideas to life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve spent the past 15 years working across Broadway, television, and film, and I studied acting at Carnegie Mellon University. My background is rooted in storytelling, collaboration, and creative execution — whether that means performing, writing, producing, directing, or helping shape an idea into something real.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside my creative work, I’ve also worked as an assistant to high-level Hollywood managers, which taught me how to combine creativity with structure, organization, and follow-through. So while I love brainstorming exciting ideas, I’m also great at helping students actually build a plan and finish what they start.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Columbia, my work sits at the intersection of storytelling, imagination, and social impact — where I support incarcerated youth in building personal agency, work in a research lab exploring the health benefits of imagination, and help develop stories that support social justice-oriented advocacy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve also created original storytelling-based projects like Men Who Share, an interview series exploring masculinity, identity, mental health, and connection through conversation and video.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003eProjects I’d love to help with:\u003c/h3\u003e\u003cp\u003e🎥 Short films, documentaries, podcasts, and interview series\u003cbr\u003e✍️ Scripts, plays, essays, and creative writing projects\u003cbr\u003e🌍 Social impact, advocacy, or community-based projects\u003cbr\u003e💡 Websites, personal brands, and media concepts\u003cbr\u003e🚀 Or really, any passion project that needs creative direction + structure\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy mentorship style is supportive, collaborative, and student-led. I’m there to help students brainstorm, organize, problem-solve, and stay on track — while making sure the project still feels like \u003cem\u003etheirs\u003c/em\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work and school, I’m a huge fan of movies, theater, music, thoughtful conversations, and ambitious creative ideas. If you’ve got a project you care about — or even just a vague idea you want help shaping — I’d love to help you bring it to life.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003eSpecialty Tags\u003c/h3\u003e\u003cbr\u003e\u003cp\u003ePassion Projects | Film / TV / Theater | Creative Writing | Podcasting / Interview Projects | Storytelling | Social Impact / Advocacy Projects | Executive Functioning | Public Speaking / Presentation | Personal Branding / Content Creation\u003c/p\u003e","teachingVideoPlaybackId":"R002TbM3qkaY3KPFj026OKGOoRqchKeu01N4vzvDMopayc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Acting","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"af13805a-5c0d-4d94-9cb6-0b91baeb4916\"}"},{"__ref":"DeepDives:{\"uuid\":\"5c9ecabd-6276-46f4-9445-e51a61dcdc33\"}"},{"__ref":"DeepDives:{\"uuid\":\"e7ea7f84-0819-4c93-a420-ca905ed6b9c4\"}"},{"__ref":"DeepDives:{\"uuid\":\"f4133e88-4040-4933-8db6-8f1045c522d0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fcb58cb3-a919-44c4-b4e5-9432f88c8222/-/preview/-/format/jpg/","https://ucarecdn.com/188c1936-3ba9-4503-bd76-b15b739ee375/-/preview/-/format/jpg/","https://ucarecdn.com/985c9f06-82a1-4077-8942-7011669d98f0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cde025f4-9212-4891-a5ce-d2f18cdc34cf\"}"},{"__ref":"Education:{\"uuid\":\"d0fee7a8-004f-40db-8cb6-763870de6828\"}"}],"hiredAt":"2026-04-01T20:10:15.907Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Music","Film / Theater","Sports Journalism","History Project","Video / Photography","Business / Entrepreneurship","Public Speaking","Debate"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"carl-lundstedt\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"56ac1423-4c92-413e-a1a7-133066f73aff\"}"}}},"_sentryTraceData":"75dbc1c02f284479a6ca85247dcc907f-819870b1d728350c-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=75dbc1c02f284479a6ca85247dcc907f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"carl-lundstedt"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","i
