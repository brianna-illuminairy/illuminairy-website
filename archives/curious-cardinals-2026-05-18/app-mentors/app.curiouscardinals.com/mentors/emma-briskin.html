xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3e6284af-77a1-4a61-9498-955593a4cef0\"}":{"__typename":"Favorites","uuid":"3e6284af-77a1-4a61-9498-955593a4cef0","photoUrl":"https://ucarecdn.com/1d493459-9484-49b4-b81a-03a1bf3c4917/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"c0895e8f-aa12-41ef-aa6a-b2470b41bfa2\"}":{"__typename":"Favorites","uuid":"c0895e8f-aa12-41ef-aa6a-b2470b41bfa2","photoUrl":"https://ucarecdn.com/3354b52a-3f8c-4d1c-8c3e-175217089e51/","title":"Cleveland Cavaliers","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"00517134-f541-4641-a0c0-22d65bfe4299\"}":{"__typename":"Favorites","uuid":"00517134-f541-4641-a0c0-22d65bfe4299","photoUrl":"https://ucarecdn.com/a9b83934-6119-40a5-ba28-cf398a6619c3/","title":"Rome, Italy","type":"CITY"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"20451f3d-41bf-4f16-804d-e18a70e8dc85\"}":{"__typename":"DeepDives","uuid":"20451f3d-41bf-4f16-804d-e18a70e8dc85","content":"\u003cp\u003eI had no idea what sociology was until after I read \u003cem\u003eEvicted\u003c/em\u003e by sociologist Matthew Desmond in high school. The mixture of qualitative interviews and storytelling with quantitative studies and data analysis engaged \"both sides of my brain\" in a way that I had never experienced before. As I researched sociology I was inspired by its overall goal of better understanding the society we live in and how we can use that knowledge to make positive social change. When I arrived at Dartmouth and perused the course catalog, every single sociology class intrigued me just by their titles. I ultimately chose to major in it because of how passionate my professors were about their research and how the things I studied energized me to make a difference in the world around me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"3a73c9b3-2477-4e1a-8a84-200e9a544c57\"}":{"__typename":"DeepDives","uuid":"3a73c9b3-2477-4e1a-8a84-200e9a544c57","content":"\u003cp\u003eWhat gets me out of bed each day is the goal of making a positive impact on others' lives, even in the tiniest ways. There's always been a fire inside me that's fueled by the thought that I can contribute to someone's happiness or growth. Seeing how even the little things I do can bring a smile to someone's face or help them in some way – that's what gives me a sense of purpose and keeps me energized. Whether it's through mentorship work, giving advice to friends, or just doing small acts of kindness for strangers, the chance to spread some positivity keeps me moving forward each day. And it's not just about making connections, it's about always finding new ways to make things better and leave a positive mark. My studies in sociology have inspired me to keep social praxis at the center of everything I do. I truly believe that our actions can shape a brighter world for everyone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"71cafdfc-c8f7-45b2-b082-425d969d7bae\"}":{"__typename":"DeepDives","uuid":"71cafdfc-c8f7-45b2-b082-425d969d7bae","content":"\u003cp\u003eWhile my work-life balance was far from perfect, in high school I strived to be the best student I could be while allowing myself to explore activities that piqued my curiosity. I went to a small public high school where most of us had known each other since elementary school. I didn't have much flexibility in the major subjects I took as my school offered a limited number of AP classes. However, I decided to explore my passions through extracurriculars, like a digital photography class that sparked a lifelong interest in graphic design. While trying to evade a mandatory 7 AM gym class, I decided to sign up for the varsity women's golf team even though I had never touched a golf club before! I quickly fell in love with the sport and spent hours on the driving range, eventually becoming good enough to be the team captain for two years! I also got to flex my acting and improv skills on the mock trial team for four years, eat tasty food in French club, give back to my community in mentorship and volunteer organizations, and have lots of study sessions at the local Starbucks or public library with friends. I left high school feeling fulfilled and ready to take on the next chapter of college!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"39006b5a-a090-4b37-ac68-f3999ef51608\"}":{"__typename":"DeepDives","uuid":"39006b5a-a090-4b37-ac68-f3999ef51608","content":"\u003cp\u003eAfter recently graduating from Dartmouth, I've found myself drawn to mentorship as a way to give back and make a meaningful impact. While my college journey was fulfilling, the pandemic limited my chances to connect with young students and offer guidance. The experience of tutoring peers in Italian during my time in college was incredibly fulfilling, reminding me of the joy of sharing knowledge and helping others grow.\u003c/p\u003e\u003cp\u003eWith my post-grad job not commencing until February, I see this as an opportune time to immerse myself in mentorship. I believe in the power of guiding and inspiring the next generation, fostering their growth and igniting their potential. The chance to offer insights, provide support, and be a positive influence resonates deeply with me. I'm excited to embark on this journey of mutual growth and learning with my future mentees!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"417ba384-9404-4e18-bec8-c172a9b8bf9a\"}":{"__typename":"School","uuid":"417ba384-9404-4e18-bec8-c172a9b8bf9a","name":"Orange High School","city":"Pepper Pike","type":"HIGH","state":"OH","country":"USA","zip":"44124"},"Education:{\"uuid\":\"b9545e9c-9cc5-4dba-b05f-2c5de084fd9d\"}":{"__typename":"Education","uuid":"b9545e9c-9cc5-4dba-b05f-2c5de084fd9d","school":{"__ref":"School:{\"uuid\":\"417ba384-9404-4e18-bec8-c172a9b8bf9a\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"86b1f7f9-a869-4ef4-9e5b-7f50aeba0bef\"}":{"__typename":"Education","uuid":"86b1f7f9-a869-4ef4-9e5b-7f50aeba0bef","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"68067c57-4c6b-49dd-ab6f-1dc16706f128\"}":{"__typename":"MentorPublicProfile","uuid":"68067c57-4c6b-49dd-ab6f-1dc16706f128","displayName":"Emma B.","slug":"emma-briskin","biography":"\u003cp\u003eEmma is a recent graduate of Dartmouth College, where she earned a Bachelor of Arts in Sociology with a minor in Linguistics. She grew up in Cleveland, Ohio. She began learning Italian on a whim in her first year at college, and ended up on a total language immersion program in Rome during the Winter of 2022. She loves learning Italian and ended up working as a teaching assistant and social media manager for the department for three years!\u003cbr\u003e\u003cbr\u003eHer interest in Sociology has always been present in her love of reading nonfiction and memoirs, gaining insight into the societies and cultures around her.\u0026nbsp;Her bat mitzvah was even book-themed! After reading a book specifically about the sociology of poverty in high school, she knew she had found a subject that engaged her qualitative and quantitative skills with the meaningful goal of promoting social justice. Before college, she had never even heard of Linguistics, but after sitting in on an introductory class during a visit to Dartmouth, she was inspired to take classes and found The Dartmouth Undergraduate Linguistics Club to foster student engagement with the department.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eEmma has engaged in mentorship opportunities all her life, but especially in high school, where she was an active member and leader in both preschool and elementary school mentorship programs. She facilitated over 100 students’ weekly involvement in mentoring students at both the preschool and elementary school, often returning to the classes and teachers they had as young students themselves. She found it incredibly rewarding to give back to the schools and teachers that had taught her all her life, and to leave a lasting legacy of mentorship at her school district. \u003cbr\u003e\u003cbr\u003eThough the COVID-19 pandemic limited her involvement in K-12 mentorship opportunities at Dartmouth, she was able to hone her teaching and mentoring skills through peer tutoring and teaching assistant opportunities. As a “drill instructor” for the Italian program, she worked with students three times per week on listening and speaking drills to reinforce their classroom learning and share her excitement for learning Italian. In the innovative “Learning Fellows” program, she facilitated daily reading discussions and designed lesson plans for students in an introductory sociology class, working with the professor to overcome challenges and improve learning.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eEmma is also interested in marketing, general business, French, and graphic design. She was an active member of Dartmouth Hillel, Women in Business, her sorority, and Dartmouth Outing Club. She has completed several internships in graphic design, marketing, and public relations, and looks forward to becoming a corporate strategy associate in February.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, Emma loves to cook and bake tasty treats. She also loves to read, crochet, go for walks, listen to Taylor Swift or Noah Kahan, and travel.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"h1vvp8oImoOI799svedQTt3LSAUEl2EeL5I9InIIfoE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3e6284af-77a1-4a61-9498-955593a4cef0\"}"},{"__ref":"Favorites:{\"uuid\":\"c0895e8f-aa12-41ef-aa6a-b2470b41bfa2\"}"},{"__ref":"Favorites:{\"uuid\":\"00517134-f541-4641-a0c0-22d65bfe4299\"}"}],"causesSupported":[],"major":"Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"20451f3d-41bf-4f16-804d-e18a70e8dc85\"}"},{"__ref":"DeepDives:{\"uuid\":\"3a73c9b3-2477-4e1a-8a84-200e9a544c57\"}"},{"__ref":"DeepDives:{\"uuid\":\"71cafdfc-c8f7-45b2-b082-425d969d7bae\"}"},{"__ref":"DeepDives:{\"uuid\":\"39006b5a-a090-4b37-ac68-f3999ef51608\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d64f3d9f-26be-4b56-bcdf-6de00f7d3803/-/preview/-/format/jpg/","https://ucarecdn.com/65266fd7-cf57-44c2-899b-f7208c2094b7/-/preview/-/format/jpg/","https://ucarecdn.com/87728c7a-8991-40fa-a4dd-894d134811d3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b9545e9c-9cc5-4dba-b05f-2c5de084fd9d\"}"},{"__ref":"Education:{\"uuid\":\"86b1f7f9-a869-4ef4-9e5b-7f50aeba0bef\"}"}],"hiredAt":"2023-08-07T22:26:29.073Z","topics":["Reading","Business / Entrepreneurship","Creative Writing","Italian","Writing","Academic Coaching","College Essay Writing"],"communityBadges":["https://ucarecdn.com/ceacbeeb-af28-4003-96cf-d977276b04ef/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"emma-briskin\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"68067c57-4c6b-49dd-ab6f-1dc16706f128\"}"}}},"_sentryTraceData":"b762d9e681b246d8b3bc63c4513972a0-b27a255c5357a764-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b762d9e681b246d8b3bc63c4513972a0,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"emma-briskin"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,d
