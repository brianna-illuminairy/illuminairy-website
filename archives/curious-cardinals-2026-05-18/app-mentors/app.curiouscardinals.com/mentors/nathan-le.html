xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5d3e042b-4f4e-4c29-9681-e77cb5779c43\"}":{"__typename":"DeepDives","uuid":"5d3e042b-4f4e-4c29-9681-e77cb5779c43","content":"\u003cp\u003eDon't be afraid to explore your interests and don't let the thought of college admissions determine your entire life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"fe2bb1d1-84ad-4e50-9ed9-1c6202e60abb\"}":{"__typename":"DeepDives","uuid":"fe2bb1d1-84ad-4e50-9ed9-1c6202e60abb","content":"\u003cp\u003eMy drum mentor during middle and high school taught me the invaluable concepts of self-confidence and perseverance. I wouldn't be who I am today without him. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"eb912500-8a56-4cff-a2b8-435c97cf7290\"}":{"__typename":"DeepDives","uuid":"eb912500-8a56-4cff-a2b8-435c97cf7290","content":"\u003cp\u003eI took my first computer science class during the pandemic, and I found the idea of being able to write code and watch it actually be able to do something fascinating. I also enjoyed the algorithmic problem-solving strategies that are required for programming. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"1d10c03b-3180-4bc2-8086-aa396275d13f\"}":{"__typename":"DeepDives","uuid":"1d10c03b-3180-4bc2-8086-aa396275d13f","content":"\u003cp\u003eIn another universe, I'd love to be a professional musician with one of the top orchestras in the country or become a composer (inspired by Joe Hisaishi). \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"ba385b69-000f-400d-980a-18169d4bcc55\"}":{"__typename":"School","uuid":"ba385b69-000f-400d-980a-18169d4bcc55","name":"Ann Sobrato High School","city":"Morgan Hill","type":"HIGH","state":"California","country":"United States","zip":"95037"},"Education:{\"uuid\":\"df5c0978-e53a-44c0-acc5-224239cfef98\"}":{"__typename":"Education","uuid":"df5c0978-e53a-44c0-acc5-224239cfef98","school":{"__ref":"School:{\"uuid\":\"ba385b69-000f-400d-980a-18169d4bcc55\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"ef3ca346-ec38-4189-965c-af174f0b137a\"}":{"__typename":"Education","uuid":"ef3ca346-ec38-4189-965c-af174f0b137a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"8851065a-ccce-4a99-808b-f3800b8448ae\"}":{"__typename":"MentorPublicProfile","uuid":"8851065a-ccce-4a99-808b-f3800b8448ae","displayName":"Nathan T.","slug":"nathan-le","biography":"\u003cp\u003eNathan is currently a student at Stanford University planning to study Computer Science and either minor or double major in Music. He is interested in the intersection between music and technology and is expanding that interest through classes at Stanford's Center for Computer Research in Music and Acoustics. Nathan is passionate about being able to help others who are excited to learn or haven't had a proper chance to explore their interests. Growing up, Nathan didn't have access to many tutoring resources and spent most of his time learning alone. Now in college, he wants to be able to help those who might've been in the same position as him years ago. \u003cbr\u003e\u003cbr\u003eIn high school, Nathan found a love for tutoring through his Calculus class, where he would often show up during office hours and lunch to assist his peers who wanted extra support. He has worked as a math tutor for Mathnasium in the past as well as a private tutor for kids who were local. Nathan hopes that through Curious Cardinals, he can not only enrich one's learning but also forge a deep bond between mentor and mentee. \u003cbr\u003e\u003cbr\u003eOutside of school, Nathan is a percussionist for both the Stanford Symphony Orchestra and the Stanford Philharmonia. In his free time, he likes to arrange music, read, play video games, chat with friends, go to the gym, and sleep. \u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5d3e042b-4f4e-4c29-9681-e77cb5779c43\"}"},{"__ref":"DeepDives:{\"uuid\":\"fe2bb1d1-84ad-4e50-9ed9-1c6202e60abb\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb912500-8a56-4cff-a2b8-435
