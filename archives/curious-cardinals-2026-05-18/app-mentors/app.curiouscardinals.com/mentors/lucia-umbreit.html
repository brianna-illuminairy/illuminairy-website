xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3fda0cd2-1d83-45fe-ac74-73615193869f\"}":{"__typename":"Favorites","uuid":"3fda0cd2-1d83-45fe-ac74-73615193869f","photoUrl":"https://ucarecdn.com/52cba868-717e-4cff-835d-bb2ba3cc3dcc/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"df2ae80b-45e3-4327-8431-7eb729ad4946\"}":{"__typename":"Favorites","uuid":"df2ae80b-45e3-4327-8431-7eb729ad4946","photoUrl":"https://ucarecdn.com/1e288406-6d72-47cd-a73f-23bd0f450b09/","title":"The Vanishing Half","type":"BOOK"},"Favorites:{\"uuid\":\"8e751adf-071e-48f8-afcb-587e6c566a02\"}":{"__typename":"Favorites","uuid":"8e751adf-071e-48f8-afcb-587e6c566a02","photoUrl":"https://ucarecdn.com/d30a27f8-f926-410a-b1f5-f770d5cfd032/","title":"Chicago","type":"CITY"},"CausesSupported:{\"uuid\":\"cc0591b3-1fbe-4965-9522-26847a49992f\"}":{"__typename":"CausesSupported","uuid":"cc0591b3-1fbe-4965-9522-26847a49992f","name":"The St. Louis Women's Safe House","description":"\u003cbr\u003e","photoUrl":""},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"cf3f220c-4f22-49c2-a860-293de87b03d7\"}":{"__typename":"DeepDives","uuid":"cf3f220c-4f22-49c2-a860-293de87b03d7","content":"\u003cp\u003eI chose to major in chemical engineering because I had always loved science and math, so in high school everyone told me I should major in engineering. Luckily, this was good advice for me and I haven't looked back since. I love using math to model process systems, and I'm fascinated by the way chemical engineering can drive sustainable solutions. My internship experience as a Process Engineer Intern and Environmental Consulting Intern has only further cemented this passions. I would love to talk more about my experience with engineering!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"41aa4a01-aee3-4550-9c32-f8cc8271c761\"}":{"__typename":"DeepDives","uuid":"41aa4a01-aee3-4550-9c32-f8cc8271c761","content":"\u003cp\u003eMentorship matters to me because I did not have any sort of mentor as a high school student, and I wish I did. I navigated the college and scholarship application process alone, and while I'm proud of the lessons I learned, I'm passionate about helping students so they don't feel like they have to navigate this alone! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also a huge people-person, and my favorite thing about being a mentor is developing relationships and getting to know my mentees! I am so excited to learn more about each student's unique interests, goals, strengths and weaknesses so we can work together to develop a plan for your success!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"64a95ba9-7436-4e49-955e-dd41ff447c7d\"}":{"__typename":"School","uuid":"64a95ba9-7436-4e49-955e-dd41ff447c7d","name":"Liberty High School","city":"Liberty","type":"HIGH","state":"Missouri","country":"United States","zip":"64068"},"Education:{\"uuid\":\"77d8ba83-2c31-4aa0-b304-6e374449280d\"}":{"__typename":"Education","uuid":"77d8ba83-2c31-4aa0-b304-6e374449280d","school":{"__ref":"School:{\"uuid\":\"64a95ba9-7436-4e49-955e-dd41ff447c7d\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"ca9b533f-5d5e-4215-a7ba-f5f45d3bdb85\"}":{"__typename":"Education","uuid":"ca9b533f-5d5e-4215-a7ba-f5f45d3bdb85","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"d7219634-f61b-472d-b646-d003f7433656\"}":{"__typename":"MentorPublicProfile","uuid":"d7219634-f61b-472d-b646-d003f7433656","displayName":"Lucia U.","slug":"lucia-umbreit","biography":"\u003cp\u003eHi! I'm Lucia, a junior studying Chemical Engineering at Washington University in St. Louis. With a strong background in math, science, and problem-solving, I love helping students build confidence and excel in their studies, with a special passion for organizational strategies and study tools. I have extensive experience working with students of all ages, from my role as a Teaching Assistant for Engineering Ethics and Sustainability and a Problem Solving Teams Leader for freshman engineering students, where I make complex concepts more approachable and engaging.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academics, I'm deeply involved in STEM outreach for underfunded middle and high schools, leading hands-on demonstrations and mentorship programs. My passion for education and innovation extends to my startup, WUWA Textiles, where I develop sustainable materials from textile waste.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eIn my free time I love to read, go thrifting, paint, do crafts, and over-decorate for whatever niche holiday is coming up. I am a retired competitive dancer who danced for 18 years and still loves the dance world!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m an Hispanic Scholarship Fund Scholar, Honeywell Women in Engineering Scholar, American Chemical Society Scholar, and Hispanic Development Fund Scholar, dedicated to empowering the next generation of learners. Whether your student needs help with math, science, essay writing, scholarship applications, passion projects, or organizational skills, I’d love to get to know them and support their academic journey!\u003c/p\u003e","teachingVideoPlaybackId":"XltgyQf602kjY01sKWiecFDAL02eWxXKF02fEDb00YwYwbiM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3fda0cd2-1d83-45fe-ac74-73615193869f\"}"},{"__ref":"Favorites:{\"uuid\":\"df2ae80b-45e3-4327-8431-7eb729ad4946\"}"},{"__ref":"Favorites:{\"uuid\":\"8e751adf-071e-48f8-afcb-587e6c566a02\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"cc0591b3-1fbe-4965-9522-26847a49992f\"}"}],"major":"Chemical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cf3f220c-4f22-49c2-a860-293de87b03d7\"}"},{"__ref":"DeepDives:{\"uuid\":\"41aa4a01-aee3-4550-9c32-f8cc8271c761\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/db2feca4-9af9-4abd-b29e-ce02ab00adee/-/preview/-/format/jpg/","https://ucarecdn.com/6efa96f0-7aa4-47e8-b291-77fc473602ae/-/preview/-/format/jpg/","https://ucarecdn.com/4b625ca6-13b4-45ab-96ed-5aa0731e158c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"77d8ba83-2c31-4aa0-b304-6e374449280d\"}"},{"__ref":"Education:{\"uuid\":\"ca9b533f-5d5e-4215-a7ba-f5f45d3bdb85\"}"}],"hiredAt":"2025-02-11T13:05:37.008Z","topics":["Calculus","K-5 Grade Math","Algebra I","Algebra II","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Physics","Writing","Academic Coaching","College Essay Writing","Executive Function","Creative Writing","STEM Project","Sustainability"],"communityBadges":["https://ucarecdn.com/09da5bb5-3efa-4fae-89ff-19db3c27efba/"],"restrictedProfileVisibility":fa
