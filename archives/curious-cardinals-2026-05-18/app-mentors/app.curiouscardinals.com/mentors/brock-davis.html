is junior and senior year. His community service work has been catered to bettering the conditions of marginalized students at GDS and beyond. He served as the co-lead for the Young Men of Color Affinity Group and GDS’s school-wide mentorship program: The Buddy Program. In the summer of 2021, Brock was a track member in GDS’s Policy Institute. He spent two months addressing issues of economic inequality and fair housing in the DC area, along with advocating for policy proposals to combat these socio-economic issues. While in high school Brock played varsity basketball all four years serving as co-captain his junior and senior year. He won All-Mid Atlantic Conference and received a Division I offer from Howard University. In his free time, Brock enjoys visiting museums/exhibits, listening to live music, and trying different cuisines from across the world. At Duke he is a member of The Real Estate Club and Events Chair of Duke's 100 Black Men organization. As a mentor at Curious Cardinals, Brock desires to help achieve the goals and aspirations of his mentees. \u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"Y5M01eVUaV1PUIYNyT9petUhWpJAIk2HBWFAyAtXB01JY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"30135bcd-55bc-43d8-9899-8ed7c92d56ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"5db9f448-10e2-446e-832b-48787618a83e\"}"},{"__ref":"DeepDives:{\"uuid\":\"2f036b75-8f79-4e30-beea-c85b7f977be6\"}"},{"__ref":"DeepDives:{\"uuid\":\"196d042d-00d2-4c7f-ba45-746f904a6279\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/745de613-7001-4ac5-9139-7011e8021684/-/preview/-/format/jpg/","https://ucarecdn.com/596dcde1-4a88-4a1f-9da9-fb3b9c49f7a0/-/preview/-/format/jpg/","https://ucarecdn.com/8f785994-f922-4eb4-b7a4-db9ac30f99f9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"aef791a5-8799-4e79-9ad1-23484ce5bf
