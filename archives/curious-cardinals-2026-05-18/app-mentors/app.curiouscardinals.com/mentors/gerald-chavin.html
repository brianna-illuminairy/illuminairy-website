xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"40aae345-31ef-46c0-8a8b-bfe2af306a30\"}":{"__typename":"DeepDives","uuid":"40aae345-31ef-46c0-8a8b-bfe2af306a30","content":"\u003cp\u003eI love working with students and seeing them develop a passion for something! It inspires me and encourages me to keep mentoring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"6bbef16d-993c-4b2b-8b94-a6991f6d71a2\"}":{"__typename":"DeepDives","uuid":"6bbef16d-993c-4b2b-8b94-a6991f6d71a2","content":"\u003cp\u003eI hope to build cars in the future (modding and fixing cars) so that I can have a garage like fast and furious\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"71b8cc5b-f0e7-4d2e-af3f-94a331a1c2e6\"}":{"__typename":"DeepDives","uuid":"71b8cc5b-f0e7-4d2e-af3f-94a331a1c2e6","content":"\u003cp\u003eI like to play sports (i play lacrosse) along with playing pickup soccer and basketball with my friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9f43efd0-673e-40eb-8f98-20460104c908\"}":{"__typename":"DeepDives","uuid":"9f43efd0-673e-40eb-8f98-20460104c908","content":"\u003cp\u003eI felt as though the analytical thinking required in computer science really fit me and came to me naturally which is why I switched from premed to cs. I also realized I would much rather do a computer science assignment than a chemistry problem set.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"74769c9d-de41-4e4a-b5ae-6db87025ce89\"}":{"__typename":"Education","uuid":"74769c9d-de41-4e4a-b5ae-6db87025ce89","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science","degree":"BS"},"School:{\"uuid\":\"73dbb57d-bf23-47a2-adcc-6950df4bf7b2\"}":{"__typename":"School","uuid":"73dbb57d-bf23-47a2-adcc-6950df4bf7b2","name":"Westview High School","city":"Portland","type":"HIGH","state":"Oregon","country":"USA","zip":"97229"},"Education:{\"uuid\":\"4dc6434b-0921-4022-a39b-b4f8a184d116\"}":{"__typename":"Education","uuid":"4dc6434b-0921-4022-a39b-b4f8a184d116","school":{"__ref":"School:{\"uuid\":\"73dbb57d-bf23-47a2-adcc-6950df4bf7b2\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"1a98cbec-067a-48ff-9c54-4865739654de\"}":{"__typename":"MentorPublicProfile","uuid":"1a98cbec-067a-48ff-9c54-4865739654de","displayName":"Gerald K.","slug":"gerald-chavin","biography":"Hello! I am Gerald, a current student at Stanford University. I am studying Computer Science with a concentration in the Systems Track. I grew up in Portland Oregon but I recently moved to Seoul in Korea when I started college. I mainly attended public schools in Portland starting from kindergarten til high school. I am a computer scientist along with a musician and an athlete. I have previous teaching experience in Biology, Chemistry, Writing, and College Consulting with wide experience in SAT prep, Physics, Geometry, Precalculus, and Calculus as well. However, I most want to teach computer science and projects within the subject as it is what I am most passionate about.\nI previously worked at the Seoul National University Hospital working on an EKG labeler allowing practitioners to digitalize EKG records. I also participated in Beaverton Health Careers during high school studying Human Anatomy, Biology, and Chemistry prepping for the possibility of Medical School. I was also initially pre-med in the first two years of college (completed courses including Organic Chemistry). I have experience in competition math and performed music at a high level (I performed in Carnegie Hall for clarinet). Currently, I would like to keep pursuing my career in computer science and in the end, build my own company.\nA couple of hobbies include playing sports (I play for the Stanford Club Lacrosse team) and music (I learned a variety of instruments such as guitar, drums, and clarinet). I also enjoy playing video games such as FIFA or apex legends. My friends would often describe me as laid back and comfortable as I like to build relationships by making jokes and playing sports or doing some an activity together.\nMy mission as a mentor is to teach kids that subjects are not as scary as they seem. That everything can be broken down into smaller problems and they can do anything they put their mind to. I hope that I can build a personal relationship with my mentee where they ask me not only for education help but for advice as well. What I loved most about teaching in the past was the joy I would feel when my mentee understood what I was saying. Furthermore, seeing them get curious about the subject we are diving into and research themselves.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"40aae345-31ef-46c0-8a8b-bfe2af306a30\"}"},{"__ref":"DeepDives:{\"uuid\":\"6bbef16d-993c-4b2b-8b94-a6991f6d71a2\"}"},{"__ref":"DeepDives:{\"uuid\":\"71b8cc5b-f0e7-4d2e-af3f-94a331a1c2e6\"}"},{"__ref":"DeepDives:{\"uuid\":\"9f43efd0-673e-40eb-8f98-20460104c908\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e3e36acc-afba-4525-a9f9-14d6d1ff78cb/-/crop/960x961/0,160/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"74769c9d-de41-4e4a-b5ae-6db87025ce89\"}"},{"__ref":"Education:{\"uuid\":\"4dc6434b-0921-4022-a39b-b4f8a184d116\"}"}],"hiredAt":"2023-01-25T18:56:09.866Z","topics":["Precalculus / Trigonometry","Geometry","Calculus","Algebra II","Physics","Chemistry","Biology","Computer Science","Coding / Programming"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gerald-chavin\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1a98cbec-067a-48ff-9c54-4865739654de\"}"}}},"_sentryTraceData":"58856f90b33e4fd696680afa0efa7306-b5b133446825d2bc-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=58856f90b33e4fd696680afa0efa7306,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=t
