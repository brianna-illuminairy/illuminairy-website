xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"265323d6-4593-46b4-9866-df7006c33c5d\"}":{"__typename":"Favorites","uuid":"265323d6-4593-46b4-9866-df7006c33c5d","photoUrl":"https://ucarecdn.com/25f98f49-1e9d-46f0-99f5-528e64e8b50d/","title":"Basketball","type":"SPORT"},"Favorites:{\"uuid\":\"f228069f-1b58-4680-8b12-feb8b5ed3b1b\"}":{"__typename":"Favorites","uuid":"f228069f-1b58-4680-8b12-feb8b5ed3b1b","photoUrl":"https://ucarecdn.com/2e1c7a5c-7963-437c-b1b3-d397308c391d/","title":"Bananagrams","type":"GAME"},"Favorites:{\"uuid\":\"2aeb0320-1b46-4a5b-8853-4c95035cb88d\"}":{"__typename":"Favorites","uuid":"2aeb0320-1b46-4a5b-8853-4c95035cb88d","photoUrl":"https://ucarecdn.com/d88ad33a-4e20-450a-936b-1e50b5ea9766/","title":"Shoe Dog","type":"BOOK"},"CausesSupported:{\"uuid\":\"1722af8c-0ef3-48df-9bc9-9c9b3cb15f97\"}":{"__typename":"CausesSupported","uuid":"1722af8c-0ef3-48df-9bc9-9c9b3cb15f97","name":"","description":"","photoUrl":"https://ucarecdn.com/c54239bd-5d39-4add-a056-56c5d6be2ec0/"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ddc53dd5-1cab-41d1-9290-3cae49a25ce4\"}":{"__typename":"DeepDives","uuid":"ddc53dd5-1cab-41d1-9290-3cae49a25ce4","content":"\u003cp\u003eI lived with my 105-year-old Grandpa, and when he asked about school or my latest basketball game, it was easy to forget our 86-year age difference. If Grandpa was feeling especially chatty at dinner, he’d share stories from his life, including the time he had a pet monkey named Skeeter in the Philippines. I would just sit there, nodding, completely mesmerized by everything he had seen and survived.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHe grew up in an orphanage, fought in two wars, and never had the opportunity to attend college, yet he spent his life emphasizing curiosity, resilience, and family. He believed learning was a privilege, not a chore, and he approached it with real respect.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"01bb20cc-93b1-4f8c-8070-ca9d293b65f6\"}":{"__typename":"DeepDives","uuid":"01bb20cc-93b1-4f8c-8070-ca9d293b65f6","content":"\u003cp\u003eDuring COVID, my sister and I started a tie-dye company called Tie Dye for Good and raised thousands of dollars for first responders at Montefiore Medical Center in New York CIty. It gave us a concrete way to show gratitude to the people on the front lines, and it showed me that you don’t have to be “older” or have a formal title to make a real impact. Most of all, it proved to me that creativity and mission can work side by side; you can build something you genuinely love while still doing something that matters.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"aa5e8ae9-0810-46cf-bba5-e7a00bf4f699\"}":{"__typename":"DeepDives","uuid":"aa5e8ae9-0810-46cf-bba5-e7a00bf4f699","content":"\u003cp\u003eMy dream job is to be a White House press secretary. I love the pace and pressure of that role, and I’m drawn to the challenge of translating complex policy into honest communication. I’ve always loved public speaking, and I’m energized by the idea of being at the center of major national conversations while helping shape how information is shared and understood.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"243e5063-36c6-41db-a8e8-4f20abd56887\"}":{"__typename":"DeepDives","uuid":"243e5063-36c6-41db-a8e8-4f20abd56887","content":"\u003cp\u003eIn my free time, I love to cook. I started just by watching my mom in the kitchen when I was young. I was itching to use the oven for the first time. Now, I love making bread from scratch! Some of my go-to dishes are eggplant parmesan, chicken schnitzel, and penne alla vodka.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"3b17ce76-818b-49d8-a5e9-e78e397a9971\"}":{"__typename":"School","uuid":"3b17ce76-818b-49d8-a5e9-e78e397a9971","name":"Trinity School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10024"},"Education:{\"uuid\":\"b647be5f-ec50-4f37-98d2-042e5ad917df\"}":{"__typename":"Education","uuid":"b647be5f-ec50-4f37-98d2-042e5ad917df","school":{"__ref":"School:{\"uuid\":\"3b17ce76-818b-49d8-a5e9-e78e397a9971\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"2b091705-034b-4789-8173-90ac3ae2d6f5\"}":{"__typename":"Education","uuid":"2b091705-034b-4789-8173-90ac3ae2d6f5","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"dd692138-99e8-49d1-9879-d4022081737c\"}":{"__typename":"MentorPublicProfile","uuid":"dd692138-99e8-49d1-9879-d4022081737c","displayName":"Tess G.","slug":"tess-gray","biography":"\u003cp\u003eHi! I’m Tess, a junior at Duke University majoring in English and minoring in History. English, to me, is where creativity and logic meet; I love taking big ideas and shaping them into arguments that are both ambitious and airtight. My history coursework focuses on the development of public policy, especially how cyber and national security priorities shape government decision-making.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I work with Duke Student Broadcasting, where I’ve produced short-form documentary and investigative content on topics like NCAA Name, Image, and Likeness (NIL) legislation and the changing world of college athletics. I’m comfortable helping students with writing that’s more “real-world,” like school presentations, personal statements, and structured projects. These are skills I’ve built through research, communication work, and deadline-driven storytelling.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI specialize in academic mentorship and skill-building, and I focus on helping students feel organized, capable, and supported so homework stops feeling like a mysterious endurance sport. I specialize in English and History for K–12 students, assisting with reading comprehension, essay writing, and test preparation. I also teach elementary and middle school math, helping students build core skills to develop long-term confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e“I hate reading” is one of the sentences I hear most often from students, and it’s almost never actually about reading. Usually, it means: I don’t know what’s going on, I’m reading too slowly, or I’m scared I’ll be wrong. One of my favorite parts of mentoring is helping students move past that feeling and get to the point where they’re not just finishing the assignment, but genuinely invested. “Wait…what’s the next book in the series?” invested.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not mentoring, you can find me long-distance running in neon pink shoes. I approach running the way I approach mentoring: with patience, consistency, and a focus on steady improvement. My other favorite \"slow process\" is making things from scratch. I love baking sourdough, building board games, and even crafting murder mystery kits.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA fun fact about me is that I'm the youngest of four girls, so I grew up learning how to speak up, ask questions, and keep up at a loud dinner table. It made me patient, direct, and comfortable explaining things more than once. That definitely impacts the kind of mentor I am.\u003c/p\u003e","teachingVideoPlaybackId":"9HjViwrxLC9k1LxCfCfTBmqV5tDANcfezsXhuGt01pvo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThe project that I worked on in the Pediatric Emergency Room at Weill Cornell Hospital in New York City analyzing urinalysis data ended up turning into a large enterprise initiative and is just now getting published in an infectious disease journal! \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"265323d6-4593-46b4-9866-df7006c33c5d\"}"},{"__ref":"Favorites:{\"uuid\":\"f228069f-1b58-4680-8b12-feb8b5ed3b1b\"}"},{"__ref":"Favorites:{\"uuid\":\"2aeb0320-1b46-4a5b-8853-4c95035cb88d\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"1722af8c-0ef3-48df-9bc9-9c9b3cb15f97\"}"}],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ddc53dd5-1cab-41d1-9290-3cae49a25ce4\"}"},{"__ref":"DeepDives:{\"uuid\":\"01bb20cc-93b1-4f8c-8070-ca9d293b65f6\"}"},{"__ref":"DeepDives:{\"uuid\":\"aa5e8a
