xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c2873904-ce5c-46c9-b215-76f4c847a477\"}":{"__typename":"Favorites","uuid":"c2873904-ce5c-46c9-b215-76f4c847a477","photoUrl":"https://ucarecdn.com/dd0ce189-5aeb-43a3-8d57-3e9021618c96/","title":"Prague, Czech Republic","type":"CITY"},"Favorites:{\"uuid\":\"465fa540-6857-4d41-a5b0-73d5409c4f8d\"}":{"__typename":"Favorites","uuid":"465fa540-6857-4d41-a5b0-73d5409c4f8d","photoUrl":"https://ucarecdn.com/d1adbc46-95c0-425f-816a-4c6ef614d73c/","title":"Soccer ","type":"SPORT"},"Favorites:{\"uuid\":\"685d1660-6cf9-425f-9738-d47b2a60cf22\"}":{"__typename":"Favorites","uuid":"685d1660-6cf9-425f-9738-d47b2a60cf22","photoUrl":"https://ucarecdn.com/c9910909-45bd-4b27-bda7-744aa278299b/","title":"Lamar Jackson","type":"ATHLETE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"edc8f17c-58b6-427f-b7cc-d080525b72bf\"}":{"__typename":"DeepDives","uuid":"edc8f17c-58b6-427f-b7cc-d080525b72bf","content":"\u003cp\u003eMentorship matters to me because it represents a powerful exchange of knowledge, support, and growth that goes beyond formal education or professional training. Throughout my life, mentors have helped me recognize my potential, guiding me through unfamiliar territory with patience and perspective. They’ve not only shared technical knowledge but have also modeled how to handle setbacks, communicate effectively, and lead with integrity. These experiences have taught me that mentorship can transform confusion into clarity and hesitation into confidence.\u003c/p\u003e\u003cp\u003eAs someone who has benefited greatly from both professional and personal mentorship, I feel a responsibility to pay that support forward. I believe mentorship creates a ripple effect—when one person is guided and empowered, they are more likely to do the same for others. This cycle strengthens communities, workplaces, and institutions by fostering collaboration, resilience, and continuous learning.\u003c/p\u003e\u003cp\u003eMentorship also matters to me because it offers a space for honest conversations and personal development. In today’s fast-paced world, having someone who takes the time to listen, offer constructive feedback, and celebrate your progress can make a tremendous difference. It reminds me that success is rarely achieved alone.\u003c/p\u003e\u003cp\u003eUltimately, mentorship is about connection. Whether I’m learning from someone with more experience or guiding someone just starting out, I value the relationships built and the mutual growth that comes from those partnerships. It's through mentorship that I’ve found some of my most meaningful opportunities and insights—and it’s a practice I will continue to prioritize in both my personal and professional life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bf650790-194d-4d0c-8928-a8ebc4af1f12\"}":{"__typename":"DeepDives","uuid":"bf650790-194d-4d0c-8928-a8ebc4af1f12","content":"\u003cp\u003eI chose mechanical engineering because I’ve always been curious about how things work, especially machines and mechanical systems. From a young age, I enjoyed taking things apart and figuring out how they functioned, which naturally led me toward engineering. I remember working with my dad and friends on lawn mowers, cars, or anything with an engine, and how I was attracted to learning hands on. Mechanical engineering stood out to me because of its broad applications—from robotics and automotive design to energy systems and manufacturing. I appreciate that it combines analytical thinking with creativity, allowing me to solve real-world problems in innovative ways. During my time in college, I’ve had the opportunity to work on hands-on projects like designing parts in SolidWorks and collaborating on group builds, which confirmed that I’m in the right field. Mechanical engineering also opens doors to many career paths, which is important to me as someone who values flexibility and lifelong learning. Ultimately, I wanted a major that would challenge me and help me make a tangible impact on the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"05451f66-fddd-4289-b274-1ef5583dc422\"}":{"__typename":"DeepDives","uuid":"05451f66-fddd-4289-b274-1ef5583dc422","content":"\u003cp\u003eIf I could give my middle or high school self advice, I’d say: don’t be afraid to speak up. I was pretty shy back then, and I let that keep me from trying new things or sharing my ideas. What I didn’t realize is that confidence doesn’t just appear—it grows the more you challenge yourself. I’d also tell myself to embrace my curiosity for how things work. I spent hours tinkering with anything mechanical, especially cars, without knowing it would shape my future. That passion led me to study mechanical engineering at Georgia Tech, where I get to work on systems with moving parts and solve real-world problems. I’d remind myself that it’s okay not to have everything figured out yet—what matters most is staying curious, working hard, and not letting fear hold you back. Everything else starts to fall into place when you follow what truly excites you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"02c5e312-2797-485c-9fa6-39be2358ad4c\"}":{"__typename":"DeepDives","uuid":"02c5e312-2797-485c-9fa6-39be2358ad4c","content":"\u003cp\u003eMy greatest source of motivation is the people who have believed in me and helped me grow—my mentors, professors, and peers. Knowing that others have taken the time to guide me pushes me to work harder, not just for myself but to honor the support I’ve received. I've faced tough challenges, but mentorship has helped me navigate them with confidence. That experience motivates me to keep learning and improving so I can one day do the same for someone else. I’m driven by the idea of progress—of becoming someone who not only builds efficient systems and machines but also builds up others. Whether I’m working on a car or collaborating on a team project, I’m motivated by the impact I can make when I combine my technical skills with the values of mentorship, curiosity, and a desire to give back.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"7e7093aa-9fff-4c43-aee2-c57036fe1810\"}":{"__typename":"School","uuid":"7e7093aa-9fff-4c43-aee2-c57036fe1810","name":"Rockdale Magnet School","city":"Conyers","type":"HIGH","state":"Georgia","country":"United States","zip":"30012"},"Education:{\"uuid\":\"24187209-be36-46ce-afea-bda313b55174\"}":{"__typename":"Education","uuid":"24187209-be36-46ce-afea-bda313b55174","school":{"__ref":"School:{\"uuid\":\"7e7093aa-9fff-4c43-aee2-c57036fe1810\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"00de0dba-1dac-4870-83f0-8c1942fb0d3a\"}":{"__typename":"Education","uuid":"00de0dba-1dac-4870-83f0-8c1942fb0d3a","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"fe9e5e7c-3be2-45a0-9245-562221b2c310\"}":{"__typename":"MentorPublicProfile","uuid":"fe9e5e7c-3be2-45a0-9245-562221b2c310","displayName":"Dylan B.","slug":"dylan-burkey","biography":"\u003cp\u003eHi, I’m Dylan Burkey—a sophomore at the Georgia Institute of Technology pursuing a degree in Mechanical Engineering with a concentration in Automotive Engineering. I’ve lived in Georgia my entire life, but I’m passionate about exploring the world. I recently spent a semester studying abroad in France, which was one of the most enriching experiences of my life.\u003c/p\u003e\u003cp\u003eI have a deep love for engineering, research, and hands-on problem-solving. Over the years, I’ve also developed experience as an academic tutor, and I truly enjoy helping others succeed—whether it’s in the classroom or through passion projects. I know from personal experience how valuable it is to have mentors who support and challenge you. The mentors in my life have played a huge role in shaping who I am today, and I’m excited to pay that forward by offering guidance, encouragement, and real-world advice to others.\u003c/p\u003e\u003cp\u003eOutside of academics, I’m usually outdoors—fishing, playing sports, or exploring new places. I’m also an avid music lover and enjoy DJing in my spare time. I’m outgoing, adventurous, and always up for learning about new cultures. I’m a huge fan of soccer, football, and movies—and here’s a fun fact: I’m currently helping build an actual plane at school!\u003c/p\u003e\u003cp\u003eWhether you're tackling academic hurdles or pursuing your own projects, I’m here to support you with insight, experience, and enthusiasm. I look forward to helping others grow and reach their full potential.\u003c/p\u003e","teachingVideoPlaybackId":"evHhcXiG02MiKQJLhF202u8YxuC22mkJuk2hr9TyriiMg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c2873904-ce5c-46c9-b215-76f4c847a477\"}"},{"__ref":"Favorites:{\"uuid\":\"465fa540-6857-4d41-a5b0-73d5409c4f8d\"}"},{"__ref":"Favorites:{\"uuid\":\"685d1660-6cf9-425f-9738-d47b2a60cf22\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"edc8f17c-58b6-427f-b7cc-d080525b72bf\"}"},{"__ref":"DeepDives:{\"uuid\":\"bf650790-194d-4d0c-8928-a8ebc4af1f12\"}"},{"__ref":"DeepDives:{\"uuid\":\"05451f66-fddd-4289-b274-1ef5583dc422\"}"},{"__ref":"DeepDives:{\"uuid\":\"02c5e312-2797-485c-9fa6-39be2358ad4c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/26b018b9-7183-4cab-a059-b16cfdafeebb/-/preview/-/format/jpg/","https://ucarecdn.com/21726784-b1fe-48fe-9925-73c451be2ebe/-/preview/-/format/jpg/","https://ucarecdn.com/b80c7b64-ffdb-4bee-8f38-77cdf3b3a805/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"24187209-be36-46ce-afea-bda313b55174\"}"},{"__ref":"Education:{\"uuid\":\"00de0dba-1dac-4870-83f0-8c1942fb0d3a\"}"}],"hiredAt":"2025-04-29T17:01:49.202Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Physics","Writing","French","Academic Coaching","College Essay Writing","Economics","Computer Science","Reading","History","Music","History Project","Business / Entrepreneurship","Coding / Programming","Robotics / Electronics / CAD","STEM Pr
