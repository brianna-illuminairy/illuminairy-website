xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9b3e2b98-0612-413d-af0b-0481f7c9e55b\"}":{"__typename":"DeepDives","uuid":"9b3e2b98-0612-413d-af0b-0481f7c9e55b","content":"\u003cp\u003eDon’t be afraid to ask for help sooner. I used to think I had to figure everything out on my own before I could raise my hand, and it just made things harder than they needed to be. The moment I started asking questions, after class, during office hours, or even just telling someone “I’m stuck”, I learned faster and felt more confident. Most people actually want to help, and asking for support doesn’t mean you’re behind. I now am the first person to ask a question; I am always looking for ways to learn from those around me who are experts in their field. This is what I want to do as well, be that support for others around me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e9379e85-10f4-4810-b3b8-604a0089ecf3\"}":{"__typename":"DeepDives","uuid":"e9379e85-10f4-4810-b3b8-604a0089ecf3","content":"\u003cp\u003eI chose Global Affairs and Economics because I wanted something that connects what I’m learning to the real world. I’ve always loved history, and I really believe you can’t understand what’s happening today, wars, migration, inequality, policy debates, without looking at what came before. Economics gives me tools to think clearly about incentives, and how policies actually play out in people’s lives, while Global Affairs helps me understand the political and historical context behind those choices. They balance each other really well: one gives me frameworks and data, the other gives me the “why.”\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"ea4d711d-42f1-4d3b-b034-f54446f8765a\"}":{"__typename":"DeepDives","uuid":"ea4d711d-42f1-4d3b-b034-f54446f8765a","content":"\u003cp\u003eI was head chef and president of Yale PopUp, an undergraduate fine dining cooking club. I was able to organize 40 students, split into Bake, Cook, and Business teams, each of whom has their own internal organizational structures. These teams come together to put on a restaurant every two weeks that served 7 courses of fine dining, each week based on a different theme. These themes vary (Seaside summer, Valentines Day, Wes Anderson), but each one brings out my teams creativity, passion, and drive. I am so proud of how I was able to unite so many people, and truly run a successful business as an undergraduate at Yale.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"c48a54a2-baee-410f-b31c-eec24e40c460\"}":{"__typename":"School","uuid":"c48a54a2-baee-410f-b31c-eec24e40c460","name":"High School of American Studies at Lehman College","city":"New York","type":"HIGH","state":"NY","country":"United States","zip":"10468"},"Education:{\"uuid\":\"e8fd9036-d4b4-4782-8ba2-cc65ce56ec10\"}":{"__typename":"Education","uuid":"e8fd9036-d4b4-4782-8ba2-cc65ce56ec10","school":{"__ref":"School:{\"uuid\":\"c48a54a2-baee-410f-b31c-eec24e40c460\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1c09cca2-3d80-4f25-a598-9fe8420829e0\"}":{"__typename":"Education","uuid":"1c09cca2-3d80-4f25-a598-9fe8420829e0","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Global Affairs and Economics, Certificate in Spanish","degree":null},"MentorPublicProfile:{\"uuid\":\"aa82c595-4d1d-492e-b821-d52cf9db5b3e\"}":{"__typename":"MentorPublicProfile","uuid":"aa82c595-4d1d-492e-b821-d52cf9db5b3e","displayName":"Julia D.","slug":"julia-dalessandro","biography":"\u003cp\u003eGrowing up in New York City, my life consisted of going to school at the High School of American Studies at Lehman College, dancing in the Alvin Ailey American Dance Company's pre-professional program, and attempting to watch a movie in every theater in the city. Now, In my personal life, I am training for a half marathon and focusing on exploring the city of New Haven where i live! love to go on hikes, explore local coffee shops, and binge watch new tv shows.\u003c/p\u003e\u003cp\u003eI am a currently a Global Affairs and Economics Double Major at Yale, with a Certificate in Spanish. Academically, I am passionate about learning about the intersection of global affairs and economics, essentially understanding the economic drivers of major world events. I have also focused on post-conflict recovery and analyzing the best practices for societies who need to rebuild after a disruption has taken place. I have also pursued a spanish certificate, and am self declared as trilingual (Spanish, Portuguese, and English). I love learning about historic events in Latin America, and hope to work closely with the region in the future. My family is Brazilian, sparking this deep personal connection with this region.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am a journalist for the Jackson School of Global Affairs, where I have learned how to interview professionals, and craft articles that represent the achievements of those who come speak at Yale. I am also the president of an undergraduate fine dining club, which puts on a 7 course, affordable, fine dining “pop-up” restaurant for the undergraduate community every other week. This has combined my love for business and entrepreneurship with my passion for cooking! I am an incoming Business Analyst at Mckinsey \u0026amp; Co., where I hope to gain experience in various fields, and understand more about their global-economic interconnectedness.\u003c/p\u003e\u003cp\u003eI am excited about sharing the knowledge I have accumulated in these various parts of my life, and supporting new students on whatever endeavor they wish to pursue. Everyone should have the means and support to achieve all that they wish, and I am honored to have a chance to be a part of this.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"VNYpaPYGGJhZG2XImPkq006Er02zhAQew3cNeGRsWHDWk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Global Affairs and Economics, Certificate in Spanish","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9b3e2b98-0612-413d-af0b-0481f7c9e55b\"}"},{"__ref":"DeepDives:{\"uuid\":\"e9379e85-10f4-4810-b3b8-604a0089ecf3\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea4d711d-42f1-4d3b-b034-f54446f8765a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f7498ee1-cdbc-4f01-96f7-222e876edbe7/-/preview/-/format/jpg/","https://ucarecdn.com/3e4b9bd7-298e-4651-9122-14843549c52c/-/preview/-/format/jpg/","https://ucarecdn.com/39390c4c-da0f-48d2-9f88-f6efbcb103f7/-/preview/-/format/jpg/"],"pron
