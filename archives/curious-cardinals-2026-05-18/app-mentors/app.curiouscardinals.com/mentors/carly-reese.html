xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"205e3a5d-b22e-40a1-9041-3bbad434d6af\"}":{"__typename":"DeepDives","uuid":"205e3a5d-b22e-40a1-9041-3bbad434d6af","content":"\u003cp\u003eWhen I was in high school, the highlight of my school year was building life-sized boats entirely out of cardboard and racing them across a pond. It was during the experience I learned how to create something both structurally sound and aesthetically pleasing. My team won Best Overall Boat in the competition two years in a row! I channeled my artistry and imagination into the designs, creating a Willy Wonka boat and The Yellow Submarine in honor of The Beatles (one of my favorite artists!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1a12caeb-cc2e-461f-a650-212275f2061f\"}":{"__typename":"DeepDives","uuid":"1a12caeb-cc2e-461f-a650-212275f2061f","content":"\u003cp\u003eMentorship brings me so much joy and fulfillment. I have previously served as a Girls On The Run coach, mentoring young women through empowering life lessons and physical activity. I was also a resident assistant for my high school dormitory, where I fostered community in the dorms and provided support to all underclassmen. I sincerely love to see other people succeed, which is why mentorship has become such a big part of my life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7abd1b51-a213-4975-9423-655664185702\"}":{"__typename":"DeepDives","uuid":"7abd1b51-a213-4975-9423-655664185702","content":"\u003cp\u003eA little bit of everything! I enjoyed working; I was apart of the first group of employees for an açai bowl/smoothie shop, I became an events coordinator for an independent bookstore, and I was selected for a Bank of America internship in which I was placed on the administrative team at a local childrens museum to write grants, revamp/redesign the library space, and run different marketing efforts. I also travelled to France to complete a french program and went surfing in the Outer Banks! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"218618f7-4280-41fe-a129-368e931e2505\"}":{"__typename":"DeepDives","uuid":"218618f7-4280-41fe-a129-368e931e2505","content":"\u003cp\u003eAs a high schooler, I was constantly seeking new adventures and finding passions across so many disciplines. I was a little insecure about not having a \"spike\" or one thing that I was most interested in, but in retrospect I'm very glad that I pursued different activities, from starting a taste testing club to playing lacrosse to taking poetry classes. I'd like to think I was a pretty cool high schooler. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"b388468b-e30d-48a9-8774-e4e86dff17da\"}":{"__typename":"Education","uuid":"b388468b-e30d-48a9-8774-e4e86dff17da","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Sustainable Architecture and Engineering ","degree":null},"School:{\"uuid\":\"501309ae-5257-48d2-80a3-a5d9410dae11\"}":{"__typename":"School","uuid":"501309ae-5257-48d2-80a3-a5d9410dae11","name":"McDonogh School","city":"Owings Mills","type":"HIGH","state":"Maryland","country":"United States","zip":"21117"},"Education:{\"uuid\":\"464aa082-2120-48b7-8499-d464579e01ed\"}":{"__typename":"Education","uuid":"464aa082-2120-48b7-8499-d464579e01ed","school":{"__ref":"School:{\"uuid\":\"501309ae-5257-48d2-80a3-a5d9410dae11\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"756b8e96-22e8-4d79-b48f-091f49ef46cf\"}":{"__typename":"MentorPublicProfile","uuid":"756b8e96-22e8-4d79-b48f-091f49ef46cf","displayName":"Carly R.","slug":"carly-reese","biography":"\u003cp\u003eHi!\u003c/p\u003e\u003cp\u003e       My name is Carly. I am passionate about architecture, the environment, and all things design-related. I’m a sophomore at Stanford University majoring in Sustainable Architecture and Engineering, where I combine creativity, technical problem-solving, and a strong curiosity about how thoughtful design can improve the way people live and learn. I love working across disciplines and exploring how engineering, design, and human-centered thinking come together to create meaningful impact.\u003c/p\u003e\u003cp\u003e     Mentorship and education are at the core of what I care about. I’ve had the opportunity to work closely with students in a variety of settings, most notably as a Site Supporter Fellow with Dent Education in Baltimore. In this role, I helped lead a five-week design thinking and product design program for over 20 high school students. I provided daily coaching, supported students as they developed real-world projects and brands, and helped create an environment where they felt confident sharing ideas and learning from mistakes. Watching students grow in both skill and self-belief is one of the most rewarding parts of my work.\u0026nbsp;\u003c/p\u003e\u003cp\u003e     As a research assistant in Stanford’s Psychophysiology Lab, I worked one-on-one with participants to collect and analyze EEG and physiological data. I’m comfortable supporting students in STEM and design-focused subjects, with a passion for biology and technical experience in tools like Rhino, Adobe Creative Cloud, Laser Cutting, and Figma.\u003c/p\u003e\u003cp\u003e     I’m also a strong creative and analytical writer, with experience across a wide range of styles and formats. I’ve written everything from extensive, research-driven academic papers that require clear argumentation and critical analysis to creative works like poetry and short fiction that explore voice, emotion, and storytelling. As a former Writing Center Tutor, I would be excited to mentor students in the writing process as well.\u0026nbsp;\u003c/p\u003e\u003cp\u003e     Outside the classroom, I stay deeply involved in creative and collaborative communities. I play on Stanford’s Women’s Club Lacrosse team, write a column about music for \u003cem\u003eThe Stanford Grind\u003c/em\u003e, and lead the media team for Stanford’s fashion club, FashionX. I love photography, sketching, interior design, and events planning too!\u003c/p\u003e\u003cp\u003e     As a mentor and tutor, my goal is to be someone students feel comfortable asking questions to and taking risks with. I’m approachable, hardworking, and genuinely excited to help students build confidence, discover their interests, and succeed both academically and creatively.\u003c/p\u003e\u003cp\u003eI hope to be in touch!\u003c/p\u003e","teachingVideoPlaybackId":"ZHzV3029mGt8lvzc027BL00J01Tzpv7fhvMtMLQpCaXOscI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Sustainable Architecture and Engineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"205e3a5d-b22e-40a1-9041-3bbad434d6af\"}"},{"__ref":"DeepDives:{\"uuid\":\"1a12caeb-cc2e-461f-a650-212275f2061f\"}"},{"__ref":"DeepDives:{\"uuid\":\"7abd1b51-a213-4975-9423-655664185702\"}"},{"__ref":"DeepDives:{\"uuid\":\"218618f7-4280-41fe-a129-368e931e2505\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6d3e5623-588e-406a-99b6-828e785242f6/-/preview/-/format/jpg/","https://ucarecdn.com/e5497cc7-cb01-451d-9730-1ec586b5b2ff/-/preview/-/format/jpg/","https://ucarecdn.com/1340c440-2407-4674-af9a-35546e4275cc/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b388468b-e30d-48a9-8774-e4e86dff17da\"}"},{"__ref":"Education:{\"uuid\":\"464aa082-2120-48b7-8499-d464579e01ed\"}"}],"hiredAt":"2026-01-28T17:31:29.510Z","topics":["Algebra I","Algebra II","Geometry","6-8 Grade Science","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","Video / Photography","History Project","STEM Project","Sustainability","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"carly-reese\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"756b8e96-22e8-4d79-b48f-091f49ef46cf\"}"}}},"_sentryTraceData":"67fc904276924de38e9b9a8f9b7c0b94-99727835485db634-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972
