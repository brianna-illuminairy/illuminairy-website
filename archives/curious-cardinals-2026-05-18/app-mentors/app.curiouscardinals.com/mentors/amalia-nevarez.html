xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d5be1ce3-663c-4a20-a37d-def3211b54f0\"}":{"__typename":"Favorites","uuid":"d5be1ce3-663c-4a20-a37d-def3211b54f0","photoUrl":"https://ucarecdn.com/8b55b974-cf8b-40a4-acd5-699f6b8bf47a/","title":"Harry Potter and the Order of the Phoenix","type":"BOOK"},"Favorites:{\"uuid\":\"d7ced055-2be1-49ce-9dca-48683ebfa317\"}":{"__typename":"Favorites","uuid":"d7ced055-2be1-49ce-9dca-48683ebfa317","photoUrl":"https://ucarecdn.com/9c7553c0-9ae2-4a9c-8c04-7ef81c81c57f/","title":"Sweet Creature by Harry Styles","type":"SONG"},"Favorites:{\"uuid\":\"267dc946-eb21-474f-af84-f72dba719526\"}":{"__typename":"Favorites","uuid":"267dc946-eb21-474f-af84-f72dba719526","photoUrl":"https://ucarecdn.com/a5327f86-858c-4060-b655-c710ef35e253/","title":"Lihue, Kauai","type":"CITY"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a0bed7f9-8df4-458e-a21b-791329dfbadf\"}":{"__typename":"DeepDives","uuid":"a0bed7f9-8df4-458e-a21b-791329dfbadf","content":"\u003cp\u003eMy greatest source of motivation is thinking about the future that I want to build for myself. When studying seems like a lot, or a project is looming, I like to think about how what I'm doing now will allow me to have the future I've always dreamed of.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ee77d14f-5e38-4692-956a-a6ff8430196e\"}":{"__typename":"DeepDives","uuid":"ee77d14f-5e38-4692-956a-a6ff8430196e","content":"\u003cp\u003eI hope to make a genuine net positive impact on the world, perhaps through medical innovation, or providing kind and empathetic care to patients and their families when they need it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6a170621-f72b-458a-9f85-7dd65c4a5061\"}":{"__typename":"DeepDives","uuid":"6a170621-f72b-458a-9f85-7dd65c4a5061","content":"\u003cp\u003eThere's a quote by Michelle Obama that I live by: \"For every door that's been opened to me, I've tried to open my door to others.\"\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI know what it's like to be a curious kid, interested in making a change but not knowing how too go about it. It can be difficult knowing how to go about chasing one's dreams, and to be able to provide guidance and help those dreams become realities for people is something I absolutely love to do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f9690194-6abe-4949-bc17-6373b8122e5e\"}":{"__typename":"DeepDives","uuid":"f9690194-6abe-4949-bc17-6373b8122e5e","content":"\u003cp\u003eI would love to be a pediatrician one day! I've always enjoyed engaging in youth outreach and improving the lives of the younger generation, and also have a love for medicine and science. The field seems like the perfect intersection of my two interests :). \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"cc69a731-9a7e-4ca6-925d-899e1ae25052\"}":{"__typename":"School","uuid":"cc69a731-9a7e-4ca6-925d-899e1ae25052","name":"Arizona School For The Arts","city":"Phoenix","type":"HIGH","state":"Arizona","country":"United States","zip":"85004"},"Education:{\"uuid\":\"d904831c-672b-4a0d-a0af-fb546badcf1f\"}":{"__typename":"Education","uuid":"d904831c-672b-4a0d-a0af-fb546badcf1f","school":{"__ref":"School:{\"uuid\":\"cc69a731-9a7e-4ca6-925d-899e1ae25052\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"83b73ee7-4b39-4621-bf26-a3a3ab6f1dcc\"}":{"__typename":"Education","uuid":"83b73ee7-4b39-4621-bf26-a3a3ab6f1dcc","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Molecular Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"88342456-941d-4c4c-ac15-14bbc1d4843b\"}":{"__typename":"MentorPublicProfile","uuid":"88342456-941d-4c4c-ac15-14bbc1d4843b","displayName":"Amalia N.","slug":"amalia-nevarez","biography":"\u003cp\u003eAmalia is a Molecular Biology major and Latino Studies minor on the pre-med track at Princeton University, where she is involved in research at the intersection of microbiology and human health. She is currently a researcher in the Gitai Lab, studying how pH influences \u003cem\u003eStaphylococcus\u003c/em\u003e bacteria growth patterns within the skin microbiome – work that reflects her broader interest in using scientific research to improve patient outcomes.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, Amalia participated in NASA’s STEM Enhancement in Earth Science (SEES) program, where her team conducted original research that was published and also presented at the American Geophysical Union 2021 conference. The following summer, she returned to the program as a mentor, guiding younger students through the research process and helping them develop their own projects. She was also recognized at the end of her senior year with the Smith Book Award for her academic achievement and leadership.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Princeton, Amalia is actively involved in several organizations that reflect both her academic interests and commitment to building community. She is an Advising Fellow with Matriculate, where she mentors high-achieving, low-income students through the college application process. Through this work, \u003cstrong\u003eshe has supported all her mentees in gaining admission to Ivy League institutions.\u003c/strong\u003e Additionally, she is an Outreach Officer for the Princeton Biotechnology Group, a member of the Molecular Biology Undergraduate Student Advisory Committee as well as the Latines en Medicine group, and is currently co-founding Princeton's first Voices of Equity chapter.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe specializes in STEM mentorship, research development, and help with college applications, with a particular focus on helping students interested in STEM, medicine, and social impact. \u003cstrong\u003eShe enjoys working with students to develop passion projects and discover what they are interested in, providing guidance in navigating applications to competitive summer programs and universities, and helping build strong, cohesive academic narratives.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her free time, Amalia loves to swim! She was a competitive swimmer for 11 years and now works as an assistant swim coach. She is also a blue belt in Brazilian jiu-jitsu, has a deep love for musical theater (currently \u003cem\u003eHadestown \u003c/em\u003eis her favorite!), enjoys playing the piano, and loves to read fantasy novels.\u003c/p\u003e","teachingVideoPlaybackId":"5dPiWAWPRtpVlcNqBQAmtLd6to54bPH29ZLGcUhMY4g","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d5be1ce3-663c-4a20-a37d-def3211b54f0\"}"},{"__ref":"Favorites:{\"uuid\":\"d7ced055-2be1-49ce-9dca-48683ebfa317\"}"},{"__ref":"Favorites:{\"uuid\":\"267dc946-eb21-474f-af84-f72dba719526\"}"}],"causesSupported":[],"major":"Molecular Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a0bed7f9-8df4-458e-a21b-791329dfbadf\"}"},{"__ref":"DeepDives:{\"uuid\":\"ee77d14f-5e38-4692-956a-a6ff8430196e\"}"},{"__ref":"DeepDives:{\"uuid\":\"6a170621-f72b-458a-9f85-7dd65c4a5061\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9690194-6abe-4949-bc17-6373b8122e5e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8d0438a3-46e3-40fc-942f-09e4ccd051f2/-/preview/-/format/jpg/","https://ucarecdn.com/bfb9ea8d-7674-4464-acb5-bc3118a4e55d/-/preview/-/format/jpg/","https://ucarecdn.com/6259758d-1c5f-4cbf-a663-0ce6bb9bb7f3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d904831c-672b-4a0d-a0af-fb546badcf1f\"}"},{"__ref":"Education:{\"uuid\":\"83b73ee7-4b39-4621-bf26-a3a3ab6f1dcc\"}"}],"hiredAt":"2026-04-10T17:35:57.269Z","topics":[],"communityBadges":["https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"amalia-nevarez\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"88342456-941d-4c4c-ac15-14bbc1d4843b\"}"}}},"_sentryTraceData":"3bdb86a607e34164b8c8a56c059d8651-ae1294bc2b061c56-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-rel
