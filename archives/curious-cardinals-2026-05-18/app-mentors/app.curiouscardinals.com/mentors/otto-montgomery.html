ool:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mathematics+Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"2bfd3da1-2863-4ecb-a1e5-5c179a2b714a\"}":{"__typename":"MentorPublicProfile","uuid":"2bfd3da1-2863-4ecb-a1e5-5c179a2b714a","displayName":"Otto M.","slug":"otto-montgomery","biography":"\u003cp\u003eHello! My name is Otto, and I'm from Berkeley California. I'm so excited to work as a member of the Curious Cardinals Family! I am a first year student at Columbia University, majoring in the combined Mathematics \u0026amp; Economics major. I love learning and talking about math, statistics, economy, engineering, computation, and anything else number-related. I am also minoring in Jazz Studies and participate in various musical organizations at Columbia. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI first discovered my passion for teaching in 10th grade when I volunteered at my old middle school, teaching jazz history, theory, and performance to groups of students. My experience there introduced me to the joy that is found in watching students grow - nothing is more rewarding than seeing a mentee get excited about learning, and getting excited along with them. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eLater, when I tutored students in math and chemistry, I witnessed how learning is not always a linear path, and requires different support for each student. We all have certain areas that we excel at, and just as many areas where we struggle. I believe the job of a mentor is to identify and support both - targeting a student's challenge areas while also striving to enrich their preexisting strengths. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I'm a dedicated musician: I've played piano since I was 4 years old, both classical and jazz. I've taught private piano lessons, joined and founded various bands,and performed at restaurants, birthdays, salsa dance clubs, and in jazz festivals across Europe. I also spend my time playing basketball, building Lego, practicing karate, and collecting an embarrassing amount of Batman comics. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, teacher, teamate, and friend, community is a value that I hold very close to my heart. More than anything else, I dream of creating environments where everyone feels heard, supported, and welcomed. It's so much easier to learn when we feel at home!  \u003c/p\u003e","teachingVideoPlaybackId":"kYCLdmhrITyvC8Gns13R7NCr9T2a9Jp00EAAjc34HsJ4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"5e4862ba-bf16-405e-b703-cc7037ccbadd\"}"},{"__ref":"Favorites:{\"uuid\":\"5781ae12-5bc0-4f22-a1a7-11f88ea3dcd8\"}"},{"__ref":"Favorites:{\"uuid\":\"2c03aba2-7745-4e7c-950e-535dc7ed801a\"}"}],"causesSupported":[],"major":"Mathematics+Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"42fad669-9c46-4d54-ba5a-2af84a86d179\"}"},{"__ref":"DeepDives:{\"uuid\":\"a260468d-6643-4506-9d31-e33ef57e34ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"80ed8b2b-7a53-4164-9f1b-2a3414b263c2\"}"},{"__ref":"DeepDives:{\"uuid\":\"6cc5d4e8-ebe6-4349-b88a-fc8867dfd17a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b1e1cb65-332a-44b4-b3ef-fa3c3bda1e27/-/preview/-/format/jpg/","https://ucarecdn.com/89a4e519-6d72-4cb2-938d-5bc0132a092f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"ac277fae-cf37-4c85-8636-9207a99c6454\"}"},{"__ref":"Education:{\"uuid\":\"4d42f70d-cde8-471a-852d-d625b392e909\"}"}],"hiredAt":"2024-09-30T12:41:05.317Z","topics":["Music","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Algebra I","Algebra II","Economics","College Essay Writing","Academic Coaching"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d75fd6e6-
