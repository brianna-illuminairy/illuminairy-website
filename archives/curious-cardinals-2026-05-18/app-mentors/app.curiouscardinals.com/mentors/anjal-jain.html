xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1588e045-956d-40e8-944d-48310ce09a57\"}":{"__typename":"Education","uuid":"1588e045-956d-40e8-944d-48310ce09a57","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Molecular, Cellular, and Developmental Biology","degree":"BS/MS"},"School:{\"uuid\":\"a898bb92-2553-487b-bac2-5bbf69f4debc\"}":{"__typename":"School","uuid":"a898bb92-2553-487b-bac2-5bbf69f4debc","name":"Orange County School of the Arts","city":"Santa Ana","type":"HIGH","state":"California","country":"United States","zip":"92701"},"Education:{\"uuid\":\"4078ee77-b57b-4f4e-b512-6eccd0ae9f41\"}":{"__typename":"Education","uuid":"4078ee77-b57b-4f4e-b512-6eccd0ae9f41","school":{"__ref":"School:{\"uuid\":\"a898bb92-2553-487b-bac2-5bbf69f4debc\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"aa72f59f-2174-457f-ab2c-d44fcbb808a2\"}":{"__typename":"MentorPublicProfile","uuid":"aa72f59f-2174-457f-ab2c-d44fcbb808a2","displayName":"Anjal J.","slug":"anjal-jain","biography":"Anjal Jain is a first year student at Yale University, double majoring in Molecular, Cellular, and Developmental Biology as well as Music. She graduated from the Orange County School of the Arts High School as a Distinguished Valedictorian in 2022. Her academic passion is STEM, specifically in Ophthalmology, where she has worked as a research intern at Stanford University's Byers Eye Institute, USC's Keck School of Medicine, and UCLA's Doheny Eye Institute with multiple publications in the field. Some of her research topics include artificial intelligence applications to cataract surgeries, early detection of glaucoma, and drusen analysis in macular degeneration. Recently, she was awarded the Davidson Fellowship of $25,000 from Massachusetts Institute of Technology and the Hahn Scholarship of $10,000 from Yale University to continue her research. Currently, she is working at the Brian Hafler Lab at Yale University, investigating the implications of the COVID spike protein on cases of age related macular degeneration. \n\nAlong with her academic endeavors, Anjal has a passion for classical voice. She has been singing since the age of 4, and has explored multiple genres including Hindustani Classical singing, Bollywood, opera, and popular music. Anjal was the grand finalist on the Indian singing reality TV show “Sa Re Ga Ma Pa Little Champs,” where she was flown to Mumbai to compete with aspiring Bollywood singers from all over the world. Currently she is ​​a part of Yale's Glee Club, Something Extra a cappella group, and Dhwani Musicians, where she will be singing in Kenya, New Delhi, Chennai, Washington D.C., and New York this year. \n\nAnjal’s love for singing also blossomed her interest in Bharatanatyam, Indian Classical dance. Anjal trained under the Arpana Dance Company for 12 years and recently completed her Arangetram, a 2 hour solo debut marking her graduation in the art form. \nAnjal has also explored acting in Los Angeles, where she was casted in the movie Blockers (top 100 grossing 2018 films), 6 Minutes short film, and commercials for Disney’s Dream Big Princess, Disney’s International Women‘s Day, Harry Potter Universal Studios, Nike’s Dream Further, Bop-It, Lenovo, etc.\n\nCombining her passions for low vision and music, Anjal spearheads a non-profit organization, Eye Matter International (501c3), where she leads projects that increase accessibility and inclusivity in the arts for the international low vision community. Eye Matter hosted international art classes with 100 low vision students from 15 different countries, teaching 11 different art forms. At the end of the art classes, all students performed at an international showcase, providing them with the platform to showcase their newfound artistic passions and interact with esteemed guests such as Stanford’s ophthalmology professor Sophia Wang. Anjal continues to organize and lead projects as such through Eye Matter.\n\nAnjal is a huge Harry Potter fan, where she identifies with the Ravenclaw house and frequently re-reads and re-watches the books and movies. She is very excited to purchase the new Harry Potter video game on the Xbox and plans to spend her summer time fighting in duels and creating potions. ","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Molecular, Cellular, and Developmental Biology","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/fdd691b7-3024-4dec-b717-e85dfafde498/-/crop/715x716/0,2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1588e045-956d-40e8-944d-48310ce09a57\"}"},{"__ref":"Education:{\"uuid\":\"4078ee77-b57b-4f4e-b512-6eccd0ae9f41\"}"}],"hiredAt":"2023-02-10T19:06:42.306Z","topics":["Biology","Chemistry","Physics","Statistics","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","Geometry","6-8 Grade Science","Calculus","Algebra II","Algebra I","Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anjal-jain\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"aa72f59f-2174-457f-ab2c-d44fcbb808a2\"}"}}},"_sentryTraceData":"673cd43bc37b4f0a8ef2a445271ccb0c-94
