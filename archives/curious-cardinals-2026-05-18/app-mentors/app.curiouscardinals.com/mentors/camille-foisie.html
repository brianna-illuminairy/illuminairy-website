xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2a0e0a6f-0800-421f-883b-ba7ed6609726\"}":{"__typename":"DeepDives","uuid":"2a0e0a6f-0800-421f-883b-ba7ed6609726","content":"\u003cp\u003eI spent my summers adventuring throughout North America! My dad is French-Canadian and my mom is Latin-American. We spent time as a family exploring and visiting our homes within Mexico and Canada! From surfing in the Bahía de Banderas to visiting the vibrant city of Halifax, NS; the experiences I've had the pleasure of enjoying outside of the United States have helped shape who I am today. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8b928261-bdcf-4ef4-9eb6-ee0697098c50\"}":{"__typename":"DeepDives","uuid":"8b928261-bdcf-4ef4-9eb6-ee0697098c50","content":"\u003cp\u003eCreating a Zero Waste Nail Salon! I am incredibly passionate about sustainability and generating a sustainable lifestyle. I also love the artistry and creation of nail art. Right now I am working on developing a small-business that blends these two practices together. I want to bring a common activity that encourages self-care and align it will zero waste principles.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"a670ec83-670d-428e-9c95-61d4578f0248\"}":{"__typename":"School","uuid":"a670ec83-670d-428e-9c95-61d4578f0248","name":"Staples High School","city":"Westport","type":"HIGH","state":"CT","country":"United States","zip":"06880"},"Education:{\"uuid\":\"1d77e708-840d-4d27-b430-c6be5853f630\"}":{"__typename":"Education","uuid":"1d77e708-840d-4d27-b430-c6be5853f630","school":{"__ref":"School:{\"uuid\":\"a670ec83-670d-428e-9c95-61d4578f0248\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}":{"__typename":"School","uuid":"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5","name":"New York University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10012"},"Education:{\"uuid\":\"5552b189-31cf-481b-a6e3-b217078180de\"}":{"__typename":"Education","uuid":"5552b189-31cf-481b-a6e3-b217078180de","school":{"__ref":"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Drama (Musical Theatre) ","degree":null},"MentorPublicProfile:{\"uuid\":\"65143467-bcef-40db-a941-90f6dfba7af4\"}":{"__typename":"MentorPublicProfile","uuid":"65143467-bcef-40db-a941-90f6dfba7af4","displayName":"Camille F.","slug":"camille-foisie","biography":"\u003cp\u003eCamille Foisie is a recent graduate from NYU Tisch in the Department of Drama and additionally earned a minor in the Business of Entertainment, Media, and Technology.\u0026nbsp; Camille grew up in Westport, CT and ended up attending New York University. As she is a performer, when Camille isn’t singing, dancing and acting; you can find her experimenting with vegan recipes in the kitchen or volunteering with environmental sustainability groups. One of her favorite experiences she's had in volunteering is working with Broadway Green Alliance, a theatrical sustainability group. She volunteered as a College Green Captain during her time at New York University promoting sustainable practices within her theatre community at the Tisch Schools of the Arts. Camille exercises her creative passion through the culinary arts; she has developed her own vegan cookbook and is a proud vegetarian herself. She has also worked with the national yoga company CorePower Yoga since 2024 and now holds the position of Studio Coordinator in their New York market. Through her practice, Camille is developing certifications as a RYT 200HR Yoga Alliance certified instructor as well as a 50HR Yoga Sculpt instructor. Her passion for fitness blends naturally with her artistry; she is a born-motivator for people from all walks of life. She is a proud recipient of the National Choral Scholar Award having received it in 2021. She was awarded the title of Gilman Scholar in 2024, an award that represents a prestigious, nationwide, merit-based academic program that supports young Americans who want to study abroad. Camille is a proud dual-citizen of the US and Mexico and has spent several summers between both countries visiting family. She enjoys visiting the terrains of new places being an avid camper and hiker. In 2023, Camille spent four months camping throughout Atlantic Canada. One of her favorite experiences was visiting the Cape Breton Nova Scotia Highlands. Fun fact: she spent four months without running water! All of these experiences have shaped Camille into who she is today, but there is one common thread among them all. Camille is a consistent advocate of joy, whether she has joy within her own experience or if she’s giving joy to others.\u003c/p\u003e","teachingVideoPlaybackId":"Rr7Hn9FWRi00j8VcrCpvE1ElxTsEDXEr1AEWjqbX88Os","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was being awarded as a Gilman Scholar in 2024. This has meant so much to me as I was given the opportunity to represent the United States as student in abroad programs through Gilman. With both of my parents having participated in the Peace Corps, cross-cultural understanding was always a subject I was seeking to be involved in. As a Gilman Scholar, it affirms to me that one of my superpowers is the ability to learn from other cultures and appreciate them fully. \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Drama (Musical Theatre) ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2a0e0a6f-0800-421f-883b-ba7ed6609726\"}"},{"__ref":"DeepDives:{\"uuid\":\"8b928261-bdcf-4ef4-9eb6-ee0697098c50\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9ef8c68e-e3da-45a4-839e-7a8a87fdbe54/-/preview/-/format/jpg/","https://ucarecdn.com/5282305e-a326-45a1-a9c6-a890216a54ca/-/preview/-/format/jpg/","https://ucarecdn.com/7db1e565-0680-4d29-af8d-ddb8312c6fc0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1d77e708-840d-4d27-b430-c6be5853f630\"}"},{"__ref":"Education:{\"uuid\":\"5552b189-31cf-481b-a6e3-b217078180de\"}"}],"hiredAt":"2026-03-01T14:51:57.750Z","topics":["Music","Film / Theater","Business / Entrepreneurship","Web Design","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/9fa2d8bf-132f-4356-a39d-e6f0aecb3e5b/","https://ucarecdn.com/9f7019f6-5b03-4f9f-a136-5aeaf2c62de6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"camille-foisie\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"65143467-bcef-40db-a941-90f6dfba7af4\"}"}}},"_sentryTraceData":"13aace1bd5e241e6ac2ff5591fd59d08-af428aa7f38230f7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=13aace1bd5e241e6ac2ff5591fd59d08,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=f
