xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0a0fe85f-9f96-47b2-a61f-b79a0beacee0\"}":{"__typename":"Favorites","uuid":"0a0fe85f-9f96-47b2-a61f-b79a0beacee0","photoUrl":"https://ucarecdn.com/514e7eb1-fb8c-41de-b92f-bbffcf67dac7/","title":"Tom Hanks","type":"ACTOR"},"Favorites:{\"uuid\":\"314602de-cf7f-4830-9dd6-25d2dfa12800\"}":{"__typename":"Favorites","uuid":"314602de-cf7f-4830-9dd6-25d2dfa12800","photoUrl":"https://ucarecdn.com/83739d48-c94f-4f80-835e-787bef734f5e/","title":"FC Barcelona ","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"55f057f3-f4d3-4c5c-9f5f-3165f4e3810e\"}":{"__typename":"Favorites","uuid":"55f057f3-f4d3-4c5c-9f5f-3165f4e3810e","photoUrl":"https://ucarecdn.com/1a8fd3da-7a27-48e9-9cee-eb58fcb4ea3a/","title":"Distance Running","type":"SPORT"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1837dcd4-6cb1-4dd7-a0ae-e494c9792d37\"}":{"__typename":"DeepDives","uuid":"1837dcd4-6cb1-4dd7-a0ae-e494c9792d37","content":"\u003cp\u003eDon't over-filter your ideas. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"0e9fcf5e-2533-4138-8e1f-b08273b3fbda\"}":{"__typename":"DeepDives","uuid":"0e9fcf5e-2533-4138-8e1f-b08273b3fbda","content":"\u003cp\u003eDesigned and built a SCARA robotic arm. Automated it for pick and place application with computer vision! It was super exciting to see come together after months of development :) \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"381b5fe5-4972-4137-a779-f2c65c64c042\"}":{"__typename":"School","uuid":"381b5fe5-4972-4137-a779-f2c65c64c042","name":"Bani Naim Secondary School","city":"Hebron","type":"HIGH","state":"N/A","country":"Palestine","zip":"90100"},"Education:{\"uuid\":\"acd0ab0b-cb18-464f-b989-adc002131295\"}":{"__typename":"Education","uuid":"acd0ab0b-cb18-464f-b989-adc002131295","school":{"__ref":"School:{\"uuid\":\"381b5fe5-4972-4137-a779-f2c65c64c042\"}"},"startYear":"2010","endYear":"2013","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"5f81cf5f-8bc0-4477-939c-c9bb35bd13ea\"}":{"__typename":"School","uuid":"5f81cf5f-8bc0-4477-939c-c9bb35bd13ea","name":"Boston University","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02215"},"Education:{\"uuid\":\"883a468a-bdb0-4089-96b3-ffc765854b5f\"}":{"__typename":"Education","uuid":"883a468a-bdb0-4089-96b3-ffc765854b5f","school":{"__ref":"School:{\"uuid\":\"5f81cf5f-8bc0-4477-939c-c9bb35bd13ea\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Robotics","degree":null},"MentorPublicProfile:{\"uuid\":\"b4f784a1-d633-4b23-b899-cae56896df66\"}":{"__typename":"MentorPublicProfile","uuid":"b4f784a1-d633-4b23-b899-cae56896df66","displayName":"Ahmad A.","slug":"ahmad-ahmad","biography":"\u003cp\u003eHi! I'm Ahmad, and I'm on a mission to make robotics accessible and exciting for the next generation of builders and thinkers.\u003c/p\u003e\u003cp\u003eCurrently, I'm a PhD candidate in Systems Engineering at Boston University, where I develop algorithms that help robots navigate safely and intelligently. My research focuses on three key areas: motion planning (teaching robots how to move efficiently), reinforcement learning (helping robots learn from experience), and temporal logic (giving robots complex instructions like \"visit the kitchen before noon, then the bedroom, but avoid the dining room\").\u003c/p\u003e\u003cp\u003eMy robotics journey began during my undergraduate studies in Mechatronics Engineering in Palestine, where an advanced course on robot manipulators completely transformed my career trajectory. The synthesis of mathematics, control theory, and practical engineering captivated me. For my undergraduate thesis, I led a team to design and build a SCARA robotic arm from scratch—handling mechanical design, motor selection, and control implementation. When we couldn't afford the specialized servo motors needed for feedback control, we adapted and integrated computer vision for object sorting instead. That experience taught me invaluable lessons: real robotics demands both theoretical rigor and practical creativity, and constraints often breed innovative solutions.\u003c/p\u003e\u003cp\u003eSince then, I've worked at the cutting edge of robotics research. I've published eight papers at top conferences including CDC, ACC, ICRA, and L4DC, with my most recent work on accelerating reinforcement learning accepted at the prestigious Learning for Dynamics and Control conference. During my internship at Mitsubishi Electric Research Labs, I developed motion planning algorithms for autonomous vehicles and conducted hardware-in-loop simulations using professional equipment—work that contributed to a patent for autonomous vehicle control. I've served as a technical reviewer for major conferences and journals including IEEE Robotics and Automation Letters, giving me insight into emerging breakthroughs.\u003c/p\u003e\u003cp\u003eBut here's what truly excites me: witnessing that moment when a student's eyes light up because they grasp how a complex algorithm works, or when they successfully program their first robot to complete a task. I've experienced this joy while mentoring undergraduate researchers at BU and coordinating technical seminars. These experiences confirmed that transformative learning happens when students are genuinely curious and invested in building something meaningful.\u003c/p\u003e\u003cp\u003eI believe every student can learn to build intelligent systems. The robotics field is exploding, from humanoid robots like Boston Dynamics' Atlas to autonomous vehicles navigating our streets. Whether you're interested in frontier technologies or understanding how your Roomba works, I'm here to guide you from curiosity to capability.\u003c/p\u003e\u003cp\u003eLet's build something amazing together!\u003c/p\u003e","teachingVideoPlaybackId":"AtfYSpv9TZem3r3MGjlSw1UZdUJBGjbkvucyCpcd3yI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhen I was in 9th grade, we won the 1st place in my country's competition of FIRST Lego League!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCurrently, I'm towards the end of PhD in robotics :) \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0a0fe85f-9f96-47b2-a61f-b79a0beacee0\"}"},{"__ref":"Favorites:{\"uuid\":\"314602de-cf7f-4830-9dd6-25d2dfa12800\"}"},{"__ref":"Favorites:{\"uuid\":\"55f057f3-f4d3-4c5c-9f5f-3165f4e3810e\"}"}],"causesSupported":[],"major":"Robotics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1837dcd4-6cb1-4dd7-a0ae-e494c9792d37\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e9fcf5e-2533-4138-8e1f-b08273b3fbda\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/99d3641b-8e6d-4fdf-8af4-04f5a7596fa4/-/preview/-/format/jpg/","https://ucarecdn.com/27581bbe-100d-409c-983c-2da9866ea217/-/preview/-/format/jpg/","https://ucarecdn.com/b64fd512-bb33-4256-ad31-e2ad4718a8b7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"acd0ab0b-cb18-464f-b989-adc002131295\"}"},{"__ref":"Education:{\"uuid\":\"883a468a-bdb0-4089-96b3-ffc765854b5f\"}"}],"hiredAt":"2025-10-10T20:16:35.640Z","topics":["Algebra I","Alg
