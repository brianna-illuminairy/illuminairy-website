xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cbdfb3ca-ce63-4865-85e2-f43918447f54\"}":{"__typename":"Favorites","uuid":"cbdfb3ca-ce63-4865-85e2-f43918447f54","photoUrl":"https://ucarecdn.com/8935bb45-12fc-49b3-aadf-e32629888b57/","title":"Boston","type":"CITY"},"Favorites:{\"uuid\":\"44b324ad-0a3b-4276-9132-bc57f0c6a319\"}":{"__typename":"Favorites","uuid":"44b324ad-0a3b-4276-9132-bc57f0c6a319","photoUrl":"https://ucarecdn.com/5318a15a-346c-4f60-9166-be9f2d929903/","title":"Undercurrents - Bill Evans","type":"ALBUM"},"Favorites:{\"uuid\":\"7742432e-83e1-4eca-8fdf-43796de6b1b8\"}":{"__typename":"Favorites","uuid":"7742432e-83e1-4eca-8fdf-43796de6b1b8","photoUrl":"https://ucarecdn.com/4e6b4607-f096-4a18-bf4e-5df458b95e2e/","title":"Donavan Brazier","type":"ATHLETE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f3b76ff5-2bbe-4ebc-8c4f-9a8c89d404d1\"}":{"__typename":"DeepDives","uuid":"f3b76ff5-2bbe-4ebc-8c4f-9a8c89d404d1","content":"\u003cp\u003eIf I could talk to my middle or high school self, I’d say this: focus on how \u003cem\u003eyou\u003c/em\u003e learn, but don’t ignore how others succeed. Your path will always be your own, but there’s a lot of wisdom in watching how people you admire think, work, and overcome challenges.\u003c/p\u003e\u003cp\u003eFor a long time, I thought that protecting my individuality meant shutting out everyone else’s methods—after all, if I wasn’t like them, why should I follow their lead? But over time I realized that surrounding yourself with driven, curious, and passionate people isn’t about copying them—it’s about exposure to new possibilities. You can adapt what works for them into something that works for you.\u003c/p\u003e\u003cp\u003eYes, honor your learning style. Know whether you thrive through trial and error, visual aids, discussion, or solo deep dives. But also seek out the habits, mindsets, and strategies of people who are already where you want to be. Watch how they handle setbacks, how they approach big goals, and how they carry themselves in the arena.\u003c/p\u003e\u003cp\u003eIn the end, you don’t have to choose between self-awareness and modeling success—you can combine the two. Keep your roots, but let the people around you help you grow taller.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"5be701d8-2d5d-462e-847f-8ebe37f225ac\"}":{"__typename":"DeepDives","uuid":"5be701d8-2d5d-462e-847f-8ebe37f225ac","content":"\u003cp\u003eHonestly, it’s a little unexpected—I’d love to start as a teacher and eventually become the owner of a Korean restaurant. Teaching lets me share knowledge, inspire curiosity, and watch people grow. Owning a Korean restaurant would let me share another side of myself—my culture, my family’s recipes, and the warmth that comes from gathering around good food.\u003c/p\u003e\u003cp\u003eAs a Korean person, food has always been a way to connect—each dish telling a story about heritage, resilience, and community. I imagine my restaurant not just as a business, but as a space where people can come to feel welcome, discover something new, and leave with both a full stomach and a fuller heart.\u003c/p\u003e\u003cp\u003eIn a way, both dreams are about the same thing: creating spaces where people can learn, connect, and walk away better than they came.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c1638f3d-1c8f-4e9b-ada4-85af090a8f3a\"}":{"__typename":"DeepDives","uuid":"c1638f3d-1c8f-4e9b-ada4-85af090a8f3a","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to change the world for the better—starting with the communities and individuals around me. I’ve learned that “changing the world” doesn’t always mean massive, overnight transformations. Sometimes it’s about sparking one person’s curiosity, giving someone the tools to believe in themselves, or creating opportunities that ripple outward in ways you can’t always measure.\u003c/p\u003e\u003cp\u003eWhether it’s through education, mentorship, or building something that outlasts me, I want my work to leave a mark that makes life a little fairer, kinder, and more inspiring for the people who come after me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ea06ea02-28a6-40c4-bd2b-b1b16ec11282\"}":{"__typename":"DeepDives","uuid":"ea06ea02-28a6-40c4-bd2b-b1b16ec11282","content":"\u003cp\u003eData Science sits at both the height and intersection of curiosity and impact; it’s about uncovering patterns that can change how we learn, work, and connect. Growing up, I often struggled in traditional classroom environments, which made me curious about how learning could be more adaptive and personal.\u003c/p\u003e\u003cp\u003eI’ve always been drawn to solving problems in a way that blends creativity with logic. Data Science gives me the tools to do exactly that—whether it’s breaking down a complex problem into manageable pieces or finding unexpected insights hidden in the noise.\u003c/p\u003e\u003cp\u003eUltimately, I see my major as a way to turn my own challenges as a learner into opportunities for others. Combining analytical thinking, with an understanding of how people learn, I hope to create systems that help students to succeed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"31e927c8-f82c-4178-815b-079bd7d4272c\"}":{"__typename":"School","uuid":"31e927c8-f82c-4178-815b-079bd7d4272c","name":"Bush School","city":"Seattle","type":"HIGH","state":"Washington","country":"United States","zip":"98112"},"Education:{\"uuid\":\"cd942d91-d164-4980-8fa9-fc3df337312f\"}":{"__typename":"Education","uuid":"cd942d91-d164-4980-8fa9-fc3df337312f","school":{"__ref":"School:{\"uuid\":\"31e927c8-f82c-4178-815b-079bd7d4272c\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}":{"__typename":"School","uuid":"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5","name":"New York University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10012"},"Education:{\"uuid\":\"a2a4ce5a-0c95-43cb-a903-b120f676a3ec\"}":{"__typename":"Education","uuid":"a2a4ce5a-0c95-43cb-a903-b120f676a3ec","school":{"__ref":"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Data Science \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"2aab5a7a-0dd5-4242-ada9-5507967bfafb\"}":{"__typename":"MentorPublicProfile","uuid":"2aab5a7a-0dd5-4242-ada9-5507967bfafb","displayName":"Geoffrey A.","slug":"geoffrey-arone","biography":"\u003cp\u003eAs a neurodivergent learner, my life was often dominated by a sense of insecurity.\u003c/p\u003e\u003cp\u003eFor my differences, I was ridiculed by others.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore my successes, there was a point where I had no idea where to even begin.\u003c/p\u003e\u003cp\u003eAs a mentor, my goal is simple: to help others see that the starting point doesn’t have to be perfect—that it just has to exist. I know what it feels like to face a blank page, an empty stage, or a challenge so big, it feels insurmountable. But I also know that with curiosity, persistence, and a willingness to learn in the arena, those first steps can lead to something extraordinary.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy very own first steps took the form of Mathematics. I was never technically gifted at math, often falling behind in  class. But maybe, this was just right. Rather than comparing myself to my peers, trying to fill their shoes, I focused wholeheartedly on learning for my own betterment; to develop the skills I never had.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOftentimes, people might discourage you. “Give up coding, they started when they were younger,” “It’s probably not for you.” Then you remember –it’s not about them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout my own journey, whether performing with Grammy-nominated artists, being accepted to Ivy League institutions, or winning State Championships, I’ve come to learn that if you can’t believe in yourself, no one else can do it for you.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I want to help others recognize that their journey is theirs alone to shape. You don’t need to follow the “right” path. You just need the courage to walk your own. And maybe, the question isn’t “Can I do this?” but rather, “What could happen if I tried?”\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMyself? I’m still trying. Currently, I study Data Science.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eTo advance my own dreams, I’m aiming to pursue a career in EdTech—building tools and experiences that make learning more personal, accessible, and inspiring for students of all backgrounds. My own journey taught me that education is never one-size-fits-all, and I believe the right environment can unlock potential in ways that traditional models often overlook.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePersonally, EdTech isn’t about replacing teachers or overloading classrooms with technology—it’s about giving learners the tools to explore their curiosity, discover their strengths, and develop skills they never thought possible. Regardless of whether that’s helping a student visualize complex math, sparking creativity through arts, or guiding someone through their first big project, I want to create systems that open doors instead of closing them.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUltimately, my story isn’t a straight path—it’s been a series of experiments, risks, and moments of unexpected opportunity. And that’s exactly why I want to help others step into their own arenas.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSo, I leave you with a hopeful question. How far can you go?\u003c/p\u003e","teachingVideoPlaybackId":"xqyHkA8t4finem4Arhll1igUlAMyavSc8lTjutlXQLs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"cbdfb3ca-ce63-4865-85e2-f43918447f54\"}"},{"__ref":"Favorites:{\"uuid\":\"44b324ad-0a3b-4276-9132-bc57f0c6a319\"}"},{"__ref":"Favorites:{\"uuid\":\"7742432e-83e1-4eca-8fdf-43796de6b1b8\"}"}],"causesSupported":[],"major":"Data Science \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f3b76ff5-2bbe-4ebc-8c4f-9a8c89d404d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"5be701d8-2d5d-462e-847f-8ebe37f225ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"c1638f3d-1c8f-4e9b-ada4-85af090a8f3a\"}"},{"__re
