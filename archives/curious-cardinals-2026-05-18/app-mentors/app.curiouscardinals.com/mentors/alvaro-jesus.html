estion:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ddcbc620-2eef-4525-bbf4-4e0ae2211113\"}":{"__typename":"DeepDives","uuid":"ddcbc620-2eef-4525-bbf4-4e0ae2211113","content":null,"videoPlaybackId":"368ZedFL0101SVkewaSusiWyCDEe02Pfr5K8O4677PmR6g","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bcbde5b8-70e5-404d-a7e1-e669cb269b4d\"}":{"__typename":"DeepDives","uuid":"bcbde5b8-70e5-404d-a7e1-e669cb269b4d","content":null,"videoPlaybackId":"leRX00Acr7EQs3tBi3V00jUXWHZ3o016Yp6Q00nSyGxNudI","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"de20603a-67b6-4c50-83e1-d9d0ea11a909\"}":{"__typename":"School","uuid":"de20603a-67b6-4c50-83e1-d9d0ea11a909","name":"Winslow Township High School","city":"Winslow Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08004"},"Education:{\"uuid\":\"07fef63e-9b81-4849-9776-d7971177e1c5\"}":{"__typename":"Education","uuid":"07fef63e-9b81-4849-9776-d7971177e1c5","school":{"__ref":"School:{\"uuid\":\"de20603a-67b6-4c50-83e1-d9d0ea11a909\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"68964df8-b57f-4eab-9c8d-a2e020046c44\"}":{"__typename":"Education","uuid":"68964df8-b57f-4eab-9c8d-a2e020046c44","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"83651805-3993-4677-b786-fb21915acabe\"}":{"__typename":"MentorPublicProfile","uuid":"83651805-3993-4677-b786-fb21915acabe","displayName":"Alvaro J.","slug":"alvaro-jesus","biography":"\u003cp\u003eHey everyone! I’m Alvaro, a first-year Mechanical Engineering student at Columbia University with a deep passion for mathematics, physics, and engineering. I am from Winslow Township, New Jersey, which is 40 minutes out from Philadelphia (Go Birds!). I ranked 3rd out of 275 students in high school with a 4.7 weighted GPA and served as President of Mu Alpha Theta (Math Honor Society), where I led tutoring initiatives and mentored students in geometry, algebra, and calculus. I was the captain of the math team that competed in local math Olympiads. I also was the President of the Science Club, which worked on differing science related projects, ranging from creating our own wind-tunnel to study how streamlined common objects were, to creating a videogame based on the schools layout.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI specialize in academic mentorship for middle and high school students in Algebra, Geometry, Precalculus, AP Calculus, and AP Physics. Beyond homework help, I focus on helping students truly understand concepts and build long-term problem-solving skills. My goal is to teach students how to think analytically and approach challenges with confidence.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me includes a clear breakdown of concepts, guided practice, and independent application. I emphasize understanding the “why” behind formulas so students aren’t just memorizing steps but developing real mastery. I also help students build study systems, time-management skills, and structured note-taking habits that translate across subjects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to academics, I mentor students interested in STEM passion projects and engineering exploration. As a current engineering student, I can help guide independent research ideas, design-based thinking, and advanced math preparation.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eResilience has shaped my academic journey. After being diagnosed with epilepsy in high school, I had to develop discipline, adaptability, and strong time-management skills. That experience strengthened my empathy as a mentor and my ability to support students through setbacks and self-doubt.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I enjoy playing tennis and soccer, reading books on philosophy and metaphysics, and exploring the intersection between engineering and ethics. I truly believe great mentorship balances high standards with encouragement, and I strive to create sessions that are structured, engaging, and empowering.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf your child is ready to grow both academically and emotionally, I would be excited to support them on that journey. If you have any questions, please feel free to reach out!\u003c/p\u003e","teachingVideoPlaybackId":"72HPfw5AdgSWsj0201SRNB3UmJK4A302ni4kXrL7BaZwAs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a83d75a5-1631-4b8e-a8a9-d5fd87eddc07\"}"},{"__ref":"Favorites:{\"uuid\":\"4f96fab2-7bf7-45f7-b037-e421028fc0b9\"}"},{"__ref":"Favorites:{\"uuid\":\"778f1e19-518c-4938-bd14-afc5af8f91c9\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8ebe0d12-b4db-4286-9d36-12ffb52ed0be\"}"},{"__ref":"DeepDives:{\"uuid\":\"d3136f5b-0e86-41b9-8754-d322229e7e0f\"}"},{"__ref":"DeepDives:{\"uuid\":\"ddcbc620-2eef-4525-bbf4-4e0ae2211113\"}"},{"__ref":"DeepDives:{\"uui
