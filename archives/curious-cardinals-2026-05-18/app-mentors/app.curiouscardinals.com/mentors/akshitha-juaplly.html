xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0f4fe4df-82dd-41c2-8dd7-6d50de48a1de\"}":{"__typename":"Favorites","uuid":"0f4fe4df-82dd-41c2-8dd7-6d50de48a1de","photoUrl":"https://ucarecdn.com/af0a6c4e-67a6-4204-9899-58c9ca63bab5/","title":"Catan","type":"GAME"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"f17efba6-d5dc-4398-8f48-7a2ac82c5ce5\"}":{"__typename":"DeepDives","uuid":"f17efba6-d5dc-4398-8f48-7a2ac82c5ce5","content":"\u003cp\u003eMentorship offers a unique opportunity to give back and inspire others, much like the impact conferences and other activities have had on my own journey. By becoming a mentor, I can directly influence the growth and development of individuals, sharing my experiences and knowledge to help them navigate challenges and reach their full potential. This one-on-one connection allows for personalized guidance and support, creating a ripple effect of positive change that extends beyond the mentee to their communities and future generations. Ultimately, mentorship is a powerful way to pay forward the inspiration and guidance I've received, fostering a cycle of continuous learning and empowerment. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"44e5f65b-8f55-4e54-88b9-8c58aada6428\"}":{"__typename":"DeepDives","uuid":"44e5f65b-8f55-4e54-88b9-8c58aada6428","content":"\u003cp\u003eIf I could offer advice to my middle or high school self, I would emphasize the importance of exploration and trusting in the process of hard work. Here's what I would say:\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\"Embrace curiosity and dive into various fields of interest. Don't limit yourself to a single path or subject. Try out different activities, join diverse clubs, and participate in various academic and extracurricular pursuits. This exploration will help you discover your true passions and may lead you to unexpected opportunities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTrust in the effort you're putting in, even when results aren't immediately visible. The work you're doing now is laying a foundation for your future success. Whether it's studying for exams, working on projects, or developing new skills, each step is contributing to your growth and opening doors for future opportunities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eRemember that your journey in science, technology, engineering, and mathematics (STEM) can take many forms. Don't be afraid to combine different interests, as I did with Applied Engineering Physics and Aerospace Engineering. This interdisciplinary approach can lead to innovative ideas and unique perspectives in your future career.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLastly, seek out mentors and role models in fields that interest you. Attend conferences, participate in summer programs, and engage with professionals in your areas of interest. These experiences can provide invaluable guidance and inspiration for your academic and professional journey.\"\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1649f4c4-3b42-46d5-b865-c0f5ec3afe75\"}":{"__typename":"DeepDives","uuid":"1649f4c4-3b42-46d5-b865-c0f5ec3afe75","content":"\u003cp\u003eI chose Applied Engineering Physics as my major because of my deep-rooted love for physics and its inherent logic and linearity. The field's ability to explain the fundamental workings of the universe has always fascinated me, providing a sense of comfort in its structured approach to problem-solving. I find immense satisfaction in unraveling the complexities of physics, much like solving an intricate puzzle. This major allows me to explore the theoretical aspects of physics while also applying these concepts to real-world engineering challenges, bridging the gap between fundamental science and practical applications.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"714399a1-7ebb-4a05-bfc0-9a8bea634ba4\"}":{"__typename":"School","uuid":"714399a1-7ebb-4a05-bfc0-9a8bea634ba4","name":"George C. Marshall High School","city":"Falls Church","type":"HIGH","state":"Virginia","country":"United States","zip":"22043"},"Education:{\"uuid\":\"8184e5e3-c730-4783-b161-a347c22a68c4\"}":{"__typename":"Education","uuid":"8184e5e3-c730-4783-b161-a347c22a68c4","school":{"__ref":"School:{\"uuid\":\"714399a1-7ebb-4a05-bfc0-9a8bea634ba4\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"6072803a-108e-4bd7-80de-0ecd401fd64c\"}":{"__typename":"Education","uuid":"6072803a-108e-4bd7-80de-0ecd401fd64c","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Applied Engineering Physics ","degree":null},"MentorPublicProfile:{\"uuid\":\"cb8e6d06-b589-4d8c-8294-2492bd20705c\"}":{"__typename":"MentorPublicProfile","uuid":"cb8e6d06-b589-4d8c-8294-2492bd20705c","displayName":"Akshitha  J.","slug":"akshitha-juaplly","biography":"\u003cp\u003eAs a passionate engineering student at Cornell University, I'm driven by curiosity and a desire to push the boundaries of science and technology. My academic journey in Applied Engineering Physics, coupled with a minor in Aerospace Engineering, reflects my commitment to bridging fundamental science with practical engineering applications.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy research experiences span diverse fields, from tomographic ionized carbon intensity mapping to optics and laser research. I've had the privilege of working on cutting-edge projects, such as improving radar techniques at Northrop Grumman and designing micro fluids payloads for Cornell Rocketry. These experiences have not only honed my technical skills but also fueled my passion for innovation and problem-solving.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my proudest achievements was leading a team to first place in the Spaceport America Cup, competing against 159 teams in the SRAD 10k motors category. This experience taught me the value of teamwork, leadership, and perseverance in the face of complex challenges.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy fascination with space and astronomy led me to participate in the Summer Science Program at the University of Colorado Boulder, where I analyzed data from research-grade telescopes to map the orbit of a near-Earth asteroid. This project culminated in a research paper submitted to the International Astronomical Union, further solidifying my interest in space exploration.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I'm actively involved in various clubs and organizations, including the Society of Women in Engineering and Women of Aeronautics and Astronautics at Cornell. These involvements reflect my commitment to promoting diversity and inclusion in STEM fields.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I'm excited to share my experiences and knowledge with curious minds. I believe in the power of hands-on learning and interdisciplinary approaches to solving complex problems. Whether it's discussing the intricacies of quantum mechanics, exploring the possibilities of space exploration, or delving into the world of programming and data analysis, I'm here to inspire and guide the next generation of scientists and engineers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy journey is a testament to the endless possibilities that arise when curiosity meets dedication. I look forward to fostering this same sense of wonder and drive in the students I mentor, helping them discover their own paths in the exciting world of science and engineering.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0f4fe4df-82dd-41c2-8dd7-6d50de48a1de\"}"}],"causesSupported":[],"major":"Applied Engineering Physics ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f17efba6-d5dc-4398-8f48-7a2ac82c5ce5\"}"},{"__ref":"DeepDives:{\"uuid\":\"44e5f65b-8f55-4e54-88b9-8c58aada6428\"}"},{"__ref":"DeepDives:{\"uuid\":\"1649f4c4-3b42-46d5-b865-c0f5ec3afe75\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/26c26216-cfca-4686-8347-3fc3762524d2/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8184e5e3-c730-4783-b161-a347c22a68c4\"}"},{"__ref":"Education:{\"uuid\":\"6072803a-108e-4bd7-80de-0ecd401fd64c\"}"}],"hiredAt":"2024-12-03T19:59:08.064Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Chemistry","Physics","Writing","Academic Coaching","College Essay Writing","Computer Science","Economics","Executive Function","Reading","Creative Writing","K-6 Storybook","Music","Aviation / Aerospace","Coding / Programming","Game Design","Robotics / Electronics / CAD","STEM Project","Web Design","Debate","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"akshitha-juaplly\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"cb8e6d06-b589-4d8c-8294-2492bd20705c\"}"}}},"_sentryTraceData":"bbf720f5b5eb4ac6ac16e2a3b12c4bcc-95bcc3390d8ae2c4-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=bbf720f5b5eb4ac6ac16e2a3b12c4bcc,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"akshitha-juaplly"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
