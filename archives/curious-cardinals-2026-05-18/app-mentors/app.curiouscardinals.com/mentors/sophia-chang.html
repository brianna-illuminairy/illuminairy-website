xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3ddac23b-f842-4190-81d1-d317c88bd7c2\"}":{"__typename":"DeepDives","uuid":"3ddac23b-f842-4190-81d1-d317c88bd7c2","content":"\u003cp\u003eBefore applying to colleges, I was very STEM-oriented, leaning heavily towards pursuing the pre-medical path. However, I also always had an interest in entrepreneurship and investing, which is really what drew me to the LSM program at Penn. Since then, I've been blown away by the importance of combining business and science and all the opportunities \u0026amp; potential innovations that lie at its intersection.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"47cabbe2-4dee-41a2-899b-967b97b04779\"}":{"__typename":"DeepDives","uuid":"47cabbe2-4dee-41a2-899b-967b97b04779","content":"\u003cp\u003eDuring my Sophomore summer, I joined an entrepreneurship incubator in San Francisco, creating my first start-up alongside five other high school students. Before starting school, I also traveled to Spain for a language immersion program.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my Junior summer, I completed a biomedical research internship at OHSU, focused on gene therapy. I later presented my research at the program symposium and national science fairs. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"4d5ec581-8381-4958-b8d2-b6ce3a4c9cc4\"}":{"__typename":"DeepDives","uuid":"4d5ec581-8381-4958-b8d2-b6ce3a4c9cc4","content":"\u003cp\u003eIn middle school, I was a very shy student, rarely speaking up in class or sharing my thoughts in larger groups.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHowever, this all changed when I began my Freshman year at boarding school. Being 500 miles from home in a new environment was overwhelming at first, however, it also gave me the space to grow and develop my identity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGiven these skills, I have since served as a leader for a Penn investment fund, TA'd for a 200+ person class, and presented research at multiple symposiums.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinding my independence and being able to advocate for myself were essential lessons I learned throughout high school, and ones I now hope to help other students with as well.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7e678b83-d7d4-4d23-9bf1-08a398e1db1c\"}":{"__typename":"DeepDives","uuid":"7e678b83-d7d4-4d23-9bf1-08a398e1db1c","content":"\u003cp\u003eThroughout school, peer mentors have always played an influential role in my life. As a peer tutor and teaching assistant, I've come to understand the importance of asking for help and collaborating with other students in the classroom.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHowever, beyond that, I've also come to appreciate the holistic impact of mentorship. As a dorm proctor in high school, I valued the deep connections formed with my dormmates across all grades, realizing the significance of peer support and guidance outside of an academic setting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}":{"__typename":"School","uuid":"62e59c56-ee46-4213-b082-758af3ff99db","name":"Phillips Exeter Academy","city":"Exeter","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03833"},"Education:{\"uuid\":\"e96e59f9-097d-45fa-801d-00e8498ea0c7\"}":{"__typename":"Education","uuid":"e96e59f9-097d-45fa-801d-00e8498ea0c7","school":{"__ref":"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"ab08f391-0128-4d32-b586-065c8bcbbf33\"}":{"__typename":"Education","uuid":"ab08f391-0128-4d32-b586-065c8bcbbf33","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Finance and Biology (LSM Program)","degree":null},"MentorPublicProfile:{\"uuid\":\"783010ba-a942-42e9-aae4-17e5c3f6e29c\"}":{"__typename":"MentorPublicProfile","uuid":"783010ba-a942-42e9-aae4-17e5c3f6e29c","displayName":"Sophia C.","slug":"sophia-chang","biography":"\u003cp\u003eSophia is a senior at the University of Pennsylvania in the Vagelos Life Sciences and Management Program at Wharton, earning a dual degree in Finance and Biology.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Penn, she is involved in financial investing \u0026amp; social impact consulting clubs and plays in Penn Chamber as a cellist of 15 years. Outside the classroom, she loves hiking with her family in the PNW, working out, and trying new restaurants with friends!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSophia is passionate about the intersection of healthcare and business, with specific interests in entrepreneurship and biotechnology. After graduation, she plans to pursue her interests as a healthcare investment banker in New York. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSophia would love to work with any students interested in business, entrepreneurship, finance, the sciences (biology, chemistry, math, etc.), career development/pathfinding, college prep, or personal development \u0026amp; growth!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Finance and Biology (LSM Program)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3ddac23b-f842-4190-81d1-d317c88bd7c2\"}"},{"__ref":"DeepDives:{\"uuid\":\"47cabbe2-4dee-41a2-899b-967b97b04779\"}"},{"__ref":"DeepDives:{\"uuid\":\"4d5ec581-8381-4958-b8d2-b6ce3a4c9cc4\"}"},{"__ref":"DeepDives:{\"uuid\":\"7e678b83-d7d4-4d23-9bf1-08a398e1db1c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1a29893a-f695-49eb-a2ec-c58676ebe4cf/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e96e59f9-097d-45fa-801d-00e8498ea0c7\"}"},{"__ref":"Education:{\"uuid\":\"ab08f391-0128-4d32-b586-065c8bcbbf33\"}"}],"hiredAt":"2024-02-07T13:12:07.218Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Business / Entrepreneurship","Medi
