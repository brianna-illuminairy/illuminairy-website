 and was the captain of her high school cross country and track teams for 3 years and competed all across the West Coast. She also served as a Guidance Tutor at her school and tutored students in Algebra and biology. Anna loves creative projects and spent quarantine teaching herself to design and sew her own prom dress, and she spent her last summer researching Black feminist theory. Now at Stanford, Anna is interning with the Women’s Community Center; continues to work as a senior baker at Antoine’s Cookie Shop; and spends her free time embroidering, sewing, baking, biking, and hanging out with friends.\n","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":null,"deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/d586767b-2f40-4e67-8103-aae058e3d3a9/-/crop/688x688/0,63/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1d96fac9-61f3-47bc-8558-192045a523d5\"}"}],"hiredAt":"2023-05-08T23:37:22.459Z","topics":["Literature","Race \u0026 Ethnicity","Journalism","Law / Government / Policy","Fashion / Cosmetics","Spanish","Philosophy","Women \u0026 Gender Studies"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anna-perronne\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8f6a3ad2-ff61-4578-9652-d0e06ad31a02\"}"}}},"_sentryTraceData":"a76fb3fe1542423c8f80955fc59600db-b90cc6fe94122a50-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a76fb3fe1542423c8f80955fc59600db,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"anna-perronne"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L
