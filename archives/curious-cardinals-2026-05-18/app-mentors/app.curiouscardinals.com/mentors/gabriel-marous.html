xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c4a88e91-c3e7-4fe6-88a8-95a7abd25722\"}":{"__typename":"DeepDives","uuid":"c4a88e91-c3e7-4fe6-88a8-95a7abd25722","content":"\u003cp\u003eAs a physics major, I KNOW that science is hard. I mean, learning new things is hard in general! But, from experience I also know that a good mentor can make all the difference in empowering students to push themselves and explore their deepest interests. I have certainly had mentors like this in my life who all served to broaden my perspective of what is possible and guid me through the process of discovering the ideas that truly excite me to learn more. That is what I hope to do for you! I don’t want to simply tell you what to do. I want to build a real mentorship relationship where we can discover your interests and work to build the necessary skills to explore those interests together. If you want to learn what quantum computing is all about, I’ve got a course for you. If you want to learn Python by exploring a dataset related to a social issue that matters to you, I got you. Even if you just want help understanding what your precalculus teacher is even talking about (trust me, I’ve been there), we can work through it together! As your mentor, I am here to empower you to fall in love with learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"7573770b-194d-41c0-b366-cd1e2958e8d9\"}":{"__typename":"School","uuid":"7573770b-194d-41c0-b366-cd1e2958e8d9","name":"Pierrepont School","city":"Westport","type":"HIGH","state":"Connecticut","country":"United States","zip":"06880"},"Education:{\"uuid\":\"234d758a-8f5b-400a-8863-d7727fc67b96\"}":{"__typename":"Education","uuid":"234d758a-8f5b-400a-8863-d7727fc67b96","school":{"__ref":"School:{\"uuid\":\"7573770b-194d-41c0-b366-cd1e2958e8d9\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"6a1f022a-f400-415d-be5a-a1dc0dfbd953\"}":{"__typename":"Education","uuid":"6a1f022a-f400-415d-be5a-a1dc0dfbd953","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"137675f2-1f40-40d7-98bf-48a5ea532c1b\"}":{"__typename":"MentorPublicProfile","uuid":"137675f2-1f40-40d7-98bf-48a5ea532c1b","displayName":"Gabriel M.","slug":"gabriel-marous","biography":"\u003cp\u003eHi! I am a senior at Yale University studying physics with particular interests in quantum computing and STEM education. I have extensive experience with scientific computing and data science in Python, linear algebra, quantum information, and high school physics, among other subjects. But what really excites me is sharing my love of STEM subjects with younger students!\u003c/p\u003e\u003cp\u003eAs a co-founder of the education non-profit Tiny and Great and the Yale Summer Intro to Quantum program, I have had the opportunity to teach middle and high school students in introductory Java programming, quantum physics, and linear algebra. As a Curious Cardinals mentor, I seek to build long-term advising relationships with my students and empower them with the tools necessary to pursue their own love of learning. I want to help my students define their own learning goals, both in the classroom and in their academic passion projects, and provide them with strategies to achieve those goals. Whether it be by tutoring my students in algebra and trigonometry, teaching them how to program a quantum computer, or by guiding them through a passion project in data science, I am committed to fostering an exciting and rewarding learning environment.\u003c/p\u003e\u003cp\u003eOutside of the classroom, my research focuses on how to leverage the weirdness of quantum physics to design new materials and systems which might serve as the basis for future technologies, most of which I can do from my laptop in Python. As your mentor, I would love to show you how you can explore your own interests with programming too! In addition to my research, I am a co-president of the Yale Undergraduate Jazz Collective where I help organize free jazz events on campus (I play piano and drums!). Also, as a former lightweight rower at Yale I like to stay active and have picked up martial arts and running since leaving the rowing team.\u003c/p\u003e\u003cp\u003ePlease feel free to reach out to me with any questions you might have to see if I would be a good fit for you. I hope we get the chance to work together. I can not wait to learn and grow alongside you!\u003c/p\u003e","teachingVideoPlaybackId":"CzwkYlbV1SSrh01bMJhuWFReo7NLbJJfo94fNBRQUo9k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c4a88e91-c3e7-4fe6-88a8-95a7abd25722\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2d5469b4-7ec1-4db2-990c-3e96674f923b/-/preview/-/format/jpg/","https://ucarecdn.com/170b3f8b-1390-4ff2-bcb0-3b0b90f12d25/-/preview/-/format/jpg/","https://ucarecdn.com/bfa91912-5d43-412f-9abf-a520e2638d61/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:
