xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"bcad13ec-67b4-417c-9840-f33df1e0a4c7\"}":{"__typename":"DeepDives","uuid":"bcad13ec-67b4-417c-9840-f33df1e0a4c7","content":"\u003cp\u003eI want to build a career at the intersection of engineering, climate, and entrepreneurship. My long-term goal is to found or lead a company developing technologies for energy systems, climate resilience, or global health. I'm drawn to climate-tech and energy infrastructure —power grids, storage, urban energy systems, problems that are both technically deep and globally impactful. My ideal role combines hands-on technical work like modeling and hardware with big-picture thinking around markets, policy, and scaling solutions. For me, a dream job isn't about a title. It's about solving meaningful problems and building things that actually matter.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a2646e5f-8764-4b0e-8163-c79f5e36a6ae\"}":{"__typename":"DeepDives","uuid":"a2646e5f-8764-4b0e-8163-c79f5e36a6ae","content":"\u003cp\u003eI chose Electrical Engineering and Finance through Penn's M\u0026amp;T Program because I wanted to combine technical problem-solving with an understanding of how technologies scale in the real world. Electrical engineering lets me work on energy systems, circuits, and emerging technologies from first principles. Finance helps me understand markets, incentives, and how innovation gets funded. I've always been interested in bridging the gap between great ideas in the lab and real-world deployment at scale. This dual degree gives me both technical depth and entrepreneurial flexibility, which is exactly the foundation I need for the kind of work I want to do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"724d509c-31ad-4864-88d0-2f2af418c4d5\"}":{"__typename":"DeepDives","uuid":"724d509c-31ad-4864-88d0-2f2af418c4d5","content":"\u003cp\u003eMentorship has been critical in my own journey, from learning how to approach complex problems to gaining confidence in challenging environments. The best mentors I've had didn't just teach content. They taught me how to think and how to navigate uncertainty. I believe mentorship can accelerate learning and prevent students from feeling stuck or discouraged. I value being someone who makes difficult topics feel approachable and manageable. On a personal level, it matters to me to create a space where students feel heard, supported, and capable. I want to give others the same guidance and encouragement that helped me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"5f203820-2fc6-4a60-a208-86d6349015a9\"}":{"__typename":"DeepDives","uuid":"5f203820-2fc6-4a60-a208-86d6349015a9","content":"\u003cp\u003eI was curious and exploration-driven, always trying new things, from engineering projects to research to soccer and music. I wasn't someone who instantly understood everything. I had to work through confusion and build understanding step by step, which taught me strong problem-solving habits, time management, and how to balance multiple commitments. I spent my time building projects like drones and AI tools, conducting climate research, and competing in science fairs. The biggest lesson I learned was the importance of asking questions early and not being afraid to struggle. Over time, I became more confident by learning how to learn.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"12357c73-fe08-4459-9c56-33bf3f3ccff8\"}":{"__typename":"School","uuid":"12357c73-fe08-4459-9c56-33bf3f3ccff8","name":"North Carolina School of Science and Mathematics - Durham","city":"Durham","type":"HIGH","state":"North Carolina","country":"United States","zip":"27705"},"Education:{\"uuid\":\"041cc85f-6e47-4c46-840c-fefff984451b\"}":{"__typename":"Education","uuid":"041cc85f-6e47-4c46-840c-fefff984451b","school":{"__ref":"School:{\"uuid\":\"12357c73-fe08-4459-9c56-33bf3f3ccff8\"}"},"startYear":"2023","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"d6991723-de1e-4ae6-bcc4-71cc15b02527\"}":{"__typename":"Education","uuid":"d6991723-de1e-4ae6-bcc4-71cc15b02527","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Electrical Engineering and Finance (M\u0026T)","degree":null},"MentorPublicProfile:{\"uuid\":\"fb15079b-4f18-4927-996a-f267a504e806\"}":{"__typename":"MentorPublicProfile","uuid":"fb15079b-4f18-4927-996a-f267a504e806","displayName":"Shubhan B.","slug":"shubhan-bhattacharya","biography":"\u003cp\u003eI'm from Raleigh, North Carolina, and I'm currently a student in the Jerome Fisher Management \u0026amp; Technology Program at the University of Pennsylvania, where I'm pursuing a dual degree in Electrical Engineering from Penn Engineering and Finance from Wharton. My coursework spans data structures, electromagnetics, quantitative modeling, and more, but what drives me isn't just the material itself. I genuinely love understanding how systems work from first principles, whether that's a circuit, a financial model, or a climate simulation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy research interests lie at the intersection of semiconductor technology and energy infrastructure, and I'm currently working on building electronics for modular robots. I've also done extensive work in climate and energy systems modeling, including urban heat dynamics and building energy simulations, using advanced computational tools, data analysis pipelines, machine learning, and signal processing. Beyond the lab, I've built projects that put engineering to work on real problems, from autonomous drones designed for disease prevention to AI-powered healthcare tools. These experiences have earned recognition as a RISE Global Finalist, Intel ISEF Finalist, and Earth Prize Winner.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I care most about is using technology to tackle challenges that matter — in energy, climate, and global health. I'm also active in entrepreneurship and venture-building, and I've spent time mentoring through research teams, hackathons, and community organizations. Outside of academics, I played competitive soccer for years, which taught me a lot about teamwork, coaching, and showing up consistently.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, I focus on breaking down complex ideas into intuitive, step-by-step explanations. I don't just hand students answers, I teach problem-solving strategies they can carry forward. I adapt to each student's learning style and pace, and I'm patient and structured in how I work through material. My goal is to make students feel comfortable asking questions, even the ones they think are \"too basic.\" They never are.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause my training cuts across math, physics, coding, engineering, and finance, I can help students see how concepts connect across subjects, which makes everything click faster. I'm not just here to help with next week's exam. I want to help students build confidence, develop independent thinking skills, and get to the point where they can say, \"I can solve this on my own.\"\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you're ready to challenge yourself and grow, I'd love to work with you.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"cNl3hAZDdaqgEtwpwdYx77kYWl1nln400PVZNEwHCqXU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Electrical Engineering and Finance (M\u0026T)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bcad13ec-67b4-417c-9840-f33df1e0a4c7\"}"},{"__ref":"DeepDives:{\"uuid\":\"a2646e5f-8764-4b0e-8163-c79f5e36a6ae\"}"},{"__ref":"DeepDives:{\"uuid\":\"724d509c-31ad-4864-88d0-2f2af418c4d5\"}"},{"__ref":"DeepDives:{\"uuid\":\"5f203820-2fc6-4a60-a208-86d6349015a9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b51723d2-b0f8-41f9-91d7-ec1d3240c32d/-/preview/-/format/jpg/","https://ucarecdn.com/e48aafc5-2328-4f76-a1d7-3d28b42d0caf/-/preview/-/format/jpg/","https://ucarecdn.com/c549d325-b1d8-44cb-9f0b-d97ed5ad38c2/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"041cc85f-6e47-4c46-840c-fefff984451b\"}"},{"__ref":"Education:{\"uuid\":\"d6991723-de1e-4ae6-bcc4-71cc15b02527\"}"}],"hiredAt":"2026-03-17T15:29:47.457Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Computer Science","Robotics / Electronics / CAD","Machine Learning / AI","Web Design","Coding / Programming"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"shubhan-bhattacharya\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fb15079b-4f18-4927-996a-f267a504e806\"}"}}},"_sentryTraceData":"3d865d72ccce466e8c35a676b10d4314-b7105f076f85a1bb-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3d865d72ccce466e8c35a676b10d4314,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"shubhan-bhattacharya"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
