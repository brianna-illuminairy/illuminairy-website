xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8f06655e-d010-4cc1-8228-807d0a3b9412\"}":{"__typename":"Favorites","uuid":"8f06655e-d010-4cc1-8228-807d0a3b9412","photoUrl":"https://ucarecdn.com/861f7f8a-d704-468e-b86f-91a4dd0b2087/","title":"Loveseat","type":"ALBUM"},"Favorites:{\"uuid\":\"9e8b58f5-47f0-4161-bb1f-4286f3d6ea16\"}":{"__typename":"Favorites","uuid":"9e8b58f5-47f0-4161-bb1f-4286f3d6ea16","photoUrl":"https://ucarecdn.com/c27150e3-beeb-45e4-b213-e0e9d5f34fc3/","title":"Notting Hill","type":"MOVIE"},"Favorites:{\"uuid\":\"20d63ef7-411c-4c47-a2cd-23c2a9fc3e5a\"}":{"__typename":"Favorites","uuid":"20d63ef7-411c-4c47-a2cd-23c2a9fc3e5a","photoUrl":"https://ucarecdn.com/3ae7cd59-5dc2-4088-b6b2-50b0edfcbbbb/","title":"The Dodgers","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"566558a0-0ec3-4189-8ca7-a39c85880885\"}":{"__typename":"DeepDives","uuid":"566558a0-0ec3-4189-8ca7-a39c85880885","content":"\u003cp\u003eMentorship matters to me because I know what it feels like to have someone believe in you as a thinker and problem-solver. Growing up, I was lucky to have a math tutor, Thomas, whom I met with every week for over 10 years. He didn't just teach me how to solve an equation, he taught me to always ask \"Why?\" From showing me how to use a ruler to guiding me through differential equations, he instilled in me a love of learning. He's the reason I love math. \u003cbr\u003eThat's why I mentor today. I want to be that person for my mentees– the person who sparks curiosity and builds confidence. I want to help students discover what excites them and give them the tools to continue exploring it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"9a565055-5988-49f7-9406-7ed61548c670\"}":{"__typename":"DeepDives","uuid":"9a565055-5988-49f7-9406-7ed61548c670","content":"\u003cp\u003eMy older sister, Lauren, is my greatest role model. She walks through the world with confidence and an unshakeable sense of who she is. Even more than that, she's the person who has shown me what it means to be there for someone else. \u003cbr\u003eShe has supported me in the smallest moments– reviewing the concepts on my homework with me when I was stuck– and the biggest, like when we were both screaming with joy after I opened my Stanford acceptance. Lauren has taught me to be strong, to stay grounded in who I am, and to believe in my own abilities.\u003cbr\u003eShe's the reason I understand the power of showing up and offering encouragement, which is what I hope to bring to my mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1f36586c-4587-412f-935d-095df2448db0\"}":{"__typename":"DeepDives","uuid":"1f36586c-4587-412f-935d-095df2448db0","content":"\u003cblockquote\u003e\u003cp\u003eI would tell my middle and high school self that it’s okay not to have everything figured out. The moments when you’re confused, struggling, or unsure are often the ones where you’re learning the most. Never be afraid to ask questions and let yourself be curious just for the sake of it. Every question leads to learning and every step moves you forward. Your path doesn’t have to look like anyone else’s to be meaningful.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"eee232e5-753a-4d34-906d-dac183ea438b\"}":{"__typename":"DeepDives","uuid":"eee232e5-753a-4d34-906d-dac183ea438b","content":"\u003cp\u003eRead, try new restaurants/dessert spots, bake, watch rom-coms, and take walks\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"0317d3f6-2d9b-41d0-ae28-b5892108123a\"}":{"__typename":"School","uuid":"0317d3f6-2d9b-41d0-ae28-b5892108123a","name":"Palisades Charter High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90272"},"Education:{\"uuid\":\"bfa576b2-6edf-45ba-baa2-9fccf2cc03a6\"}":{"__typename":"Education","uuid":"bfa576b2-6edf-45ba-baa2-9fccf2cc03a6","school":{"__ref":"School:{\"uuid\":\"0317d3f6-2d9b-41d0-ae28-b5892108123a\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"e1acef41-0767-4f7f-8c6f-268855f758c9\"}":{"__typename":"Education","uuid":"e1acef41-0767-4f7f-8c6f-268855f758c9","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"393de3a4-a659-44d9-96d8-a1b815daa7c8\"}":{"__typename":"MentorPublicProfile","uuid":"393de3a4-a659-44d9-96d8-a1b815daa7c8","displayName":"Olivia Z.","slug":"olivia-thuy","biography":"\u003cp\u003eHi, I'm Olivia! I'm currently at Stanford and haven't declared a major yet, but I'm thinking of studying Electrical Engineering or Chemical Engineering. I'm drawn to engineering because it allows me to take what I’ve learned about how and why things work and apply it to real-world problems. My passion lies in problem-solving (especially math) and enjoying the process that leads me to an answer, even if it's a little messy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI've had the opportunity to do research on sustainable energy here at Stanford where I’ve worked on aqueous battery systems and explored how electrochemical processes can be optimized for more environmentally friendly, scalable energy storage. Research taught me how to be patient with failure, think critically about my results, and refine my experiments with each round of testing. I learned that failure is part of the process and sometimes what you learn from what \u003cem\u003edoesn't\u003c/em\u003e work is more important than the outcome you were hoping for. It also reinforced something I tell every student I work with: \"get your hands dirty.\"\u003c/p\u003e\u003cp\u003e\u003cbr\u003eEven though I'm drawn to STEM, I've always loved learning across disciplines. I'm pursuing minors in both Classics and Math, and I enjoy reading and learning about ancient Roman history just as much as working through a tough problem. I’ve found that thinking across fields helps me explain ideas in more creative and approachable ways. It also reminds me that learning isn’t confined to one mindset– there’s always more than one way to think about a problem.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eOutside the classroom, you'll find me doing a little bit of everything. I'm a captain of the club lacrosse team at Stanford, an executive board member for our chapter of AIChE (the American Institute of Chemical Engineers), a member of the Jewish Student Association, and I spend an arguably unhealthy amount of time watching the Dodgers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI've tutored and mentored middle and high school students in math and science for four years now, and I've also been a mentee myself throughout high school and here at Stanford. I know what it feels like to be stuck or overwhelmed and how valuable a reliable mentor is. As a mentor, I prioritize being a resource my mentees can turn to with any question, no matter how small, because I firmly believe asking questions is one of the most powerful ways to learn.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMore than anything, I care about \u003cem\u003elearning\u003c/em\u003e. Whether I'm in the lab, on the field, or working one-on-one with a student, I'm driven to help others understand and grow.\u003c/p\u003e","teachingVideoPlaybackId":"W02PHLdDeShrvO4EV02lPHzoUjXg2VDHPOTcOt8ZtTY01Q","teachingVideoDescription":null,"greatestAchievement":"\u003cblockquote\u003e\u003cblockquote\u003e\u003cp\u003eMy greatest achievement is becoming someone who reflects the values my family has given me. I’m proud to carry forward the generosity, loyalty, and resilience that define my family. Everything I do is shaped by what they’ve taught me, and being someone they’re proud of means more than any award.\u003c/p\u003e\u003c/blockquote\u003e\u003c/blockquote\u003e\u003cbr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"8f06655e-d010-4cc1-8228-807d0a3b9412\"}"},{"__ref":"Favorites:{\"uuid\":\"9e8b58f5-47f0-4161-bb1f-4286f3d6ea16\"}"},{"__ref":"Favorites:{\"uuid\":\"20d63ef7-411c-4c47-a2cd-23c2a9fc3e5a\"}"}],"causesSupported":[],"major":"Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"566558a0-0ec3-4189-8ca7-a39c85880885\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a565055-
