xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7b430d71-9f1b-4df8-b396-e0ac03ca4400\"}":{"__typename":"Favorites","uuid":"7b430d71-9f1b-4df8-b396-e0ac03ca4400","photoUrl":"https://ucarecdn.com/a7d5d411-e9e4-45e0-ab7f-dd485eb38840/","title":"Pitch Perfect","type":"MOVIE"},"Favorites:{\"uuid\":\"073c3704-a4fc-457d-9223-2a5e8c2a4380\"}":{"__typename":"Favorites","uuid":"073c3704-a4fc-457d-9223-2a5e8c2a4380","photoUrl":"https://ucarecdn.com/b3ee0cf2-4a81-4073-9615-218d240a8cf0/","title":"Little Shop of Horrors","type":"PLAY"},"Favorites:{\"uuid\":\"e26ad51b-df88-4b2e-97e3-7f4f06253e0a\"}":{"__typename":"Favorites","uuid":"e26ad51b-df88-4b2e-97e3-7f4f06253e0a","photoUrl":"https://ucarecdn.com/b3ee0cf2-4a81-4073-9615-218d240a8cf0/","title":"Melodrama by Lorde","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9d0a5c99-74bd-4c82-a000-cb67fae599f6\"}":{"__typename":"DeepDives","uuid":"9d0a5c99-74bd-4c82-a000-cb67fae599f6","content":"\u003cp\u003eI think the biggest advice I would give myself is that you do not have to have everything figured out by the time you graduate high school. I thought I had to plan out exactly how the rest of my life was gonna go and carefully calculate every step so college and post-grad life was achievable. This is simply not true. College is the place to explore different passions and find what truly speaks to you. You can go into college with one major in mind and graduate with the complete opposite.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8706526b-f9a0-4f43-aa40-f11a40cd34a7\"}":{"__typename":"DeepDives","uuid":"8706526b-f9a0-4f43-aa40-f11a40cd34a7","content":"\u003cp\u003eI chose my majors (Legal Studies and Theatre) because I have a passion for both the arts and the law. I have always been interested in how film deals are made or contract negotiations are done. My personal dream is to work as an entertainment lawyer where I get to stay in the world of film and theatre while still practicing my analytical legal thinking.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"518af46a-5f1f-41b2-81c3-2842d8433fc6\"}":{"__typename":"DeepDives","uuid":"518af46a-5f1f-41b2-81c3-2842d8433fc6","content":"\u003cp\u003eMentorship matters because every single person needs somebody to be the person they can look up to for help without any semblance of judgement. As a mentor, you get the absolute joy being able to share your love of learning and try to show others why x, y, or z is important and genuinely so cool. My mentors growing up are the reason I felt comfortable asking for help when others did not. Without them, I do not think my education would have been nearly as beneficial or truly interesting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"be8e925e-94ce-4d29-9ec5-94f1c431610a\"}":{"__typename":"DeepDives","uuid":"be8e925e-94ce-4d29-9ec5-94f1c431610a","content":"\u003cp\u003eActing is my greatest source of motivation. I am currently a working actor, and nothing even comes close to the joy of breaking down a new script, finding all the nuanced details in the characters, and then being able to perform a meaningful story for an audience\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"f3d06080-323b-4552-8c31-613fde8614b8\"}":{"__typename":"School","uuid":"f3d06080-323b-4552-8c31-613fde8614b8","name":"St. John's School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77019"},"Education:{\"uuid\":\"8b41a21b-7c96-4780-9a4b-33e25484a270\"}":{"__typename":"Education","uuid":"8b41a21b-7c96-4780-9a4b-33e25484a270","school":{"__ref":"School:{\"uuid\":\"f3d06080-323b-4552-8c31-613fde8614b8\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"4c401e7d-352a-4477-a3d9-c8a85852af3d\"}":{"__typename":"Education","uuid":"4c401e7d-352a-4477-a3d9-c8a85852af3d","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Legal Studies and Theatre","degree":null},"MentorPublicProfile:{\"uuid\":\"69ed5682-1df3-482e-a24f-2e229ecc9968\"}":{"__typename":"MentorPublicProfile","uuid":"69ed5682-1df3-482e-a24f-2e229ecc9968","displayName":"Gray W.","slug":"gray-watson","biography":"\u003cp\u003eHello! My name is Gray Watson. I am recent graduate of \u003cstrong\u003eNorthwestern University\u003c/strong\u003e where I graduated with a \u003cstrong\u003eBachelor's degree in Legal Studies and Theatre\u003c/strong\u003e. I also graduated with the \u003cstrong\u003eMusical Theatre Certificate \u003c/strong\u003eas well as the \u003cstrong\u003eActing for the Screen Module\u003c/strong\u003e. I am originally from Houston, Texas where I found my deep passion for chips \u0026amp; queso and my love for the performing arts. \u003cbr\u003e\u003cbr\u003eFor high school, I attended \u003cstrong\u003eSt. John's School\u003c/strong\u003e in Houston, Texas where I pursued my vast and sprawling academic interests from taking Organic Chemistry, AP World History, Calculus, AP Biology, etc. and simultaneously performing in every theater production offered.\u003cbr\u003e\u003cbr\u003eIn \u003cstrong\u003eNorthwestern’s Theatre Program\u003c/strong\u003e, I took a wide variety of courses based in acting, screen acting, musical theatre, and dance. Some areas of study I focused on were voice, contemporary theatre, Chekhov, jazz, ballet, and circus to just name a few. Similarly, as a \u003cstrong\u003eLegal Studies major,\u003c/strong\u003e I took courses related to constitutional law, entertainment law, legal philosophy, and many other aspects of the court system. Additionally, I wrote an honors thesis in the Legal Studies major where I explored the portrayal of attorney-client privilege in film and television.\u003cbr\u003e\u003cbr\u003eWhen I was not in class, You could find me singing with my chaotic a cappella group the \u003cstrong\u003eX-Factors\u003c/strong\u003e, producing new play readings with the \u003cstrong\u003eJewish Theatre Ensemble\u003c/strong\u003e, or performing at local elementary schools with the Children's Repertory Group \u003cstrong\u003eGriffin's Tale\u003c/strong\u003e. Outside of acting, you can find me at the closest movie theater watching truly anything and everything (the trashier the movie, the better), forcing my roommates to listen to my newly coined impressions, or biking through a park while listening to a podcast.\u003cbr\u003e\u003cbr\u003eMy teaching style focuses on helping each student become confident and comfortable in whatever area of study they are struggling with while providing strategies to prevent further problems down the road and foster a love for further learning. The most important thing a teacher can do is making sure a student feels valued, important, and comfortable to make a mistake and learn\u003c/p\u003e","teachingVideoPlaybackId":"1Dott3sGcXxrjHap00lGXPrw8R01EpzX49D7fkgzoBnBs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhile I do not want to brag, I do have a killer Kermit the Frog voice.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"7b430d71-9f1b-4df8-b396-e0ac03ca4400\"}"},{"__ref":"Favorites:{\"uuid\":\"073c3704-a4fc-457d-9223-2a5e8c2a4380\"}"},{"__ref":"Favorites:{\"uuid\":\"e26ad51b-df88-4b2e-97e3-7f4f06253e0a\"}"}],"causesSupported":[],"major":"Legal Studies and Theatre","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9d0a5c99-74bd-4c82-a000-cb67fae599f6\"}"},{"__ref":"DeepDives:{\"uuid\":\"8706526b-f9a0-4f43-aa40-f11a40cd34a7\"}"},{"__ref":"DeepDives:{\"uuid\":\"518af46a-5f1f-41b2-81c3-2842d8433fc6\"}"},{"__ref":"DeepDives:{\"uuid\":\"be8e925e-94ce-4d29-9ec5-94f1c431610a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cb9a8ba5-7cbd-40e1-9b70-32f802560ea9/-/preview/-/format/jpg/","https://ucarecdn.com/6ba078eb-443e-49f0-9ef4-0587ad0f907c/-/preview/-/format/jpg/","https://ucarecdn.com/699a7c32-5ed5-414c-95f9-6996472ec4cd/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8b41a21b-7c96-4780-9a4b-33e25484a270\"}"},{"__ref":"Education:{\"uuid\":\"4c401e7d-352a-4477-a3d9-c8a85852af3d\"}"}],"hiredAt":"2023-10-21T11:04:39.241Z","topics":["Film / Theater","History Project","Philosophy","Literature","Law / Government / Policy","World Cultures","Debate","Public Speaking","K-5 Grade Math","Writing","Journalism"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gray-watson\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"69ed5682-1df3-482e-a24f-2e229ecc9968\"}"}}},"_sentryTraceData":"5a329228c1dd4820b1906265e1739f40-981c7e70c6cb5c1a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=5a329228c1dd4820b1906265e1739f40,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"gray-watson"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
