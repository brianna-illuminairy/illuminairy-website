xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"47674197-88ab-481a-a588-91eb0e11ec5e\"}":{"__typename":"Favorites","uuid":"47674197-88ab-481a-a588-91eb0e11ec5e","photoUrl":"https://ucarecdn.com/a97ce1ca-27c4-4c1f-a58a-603a4cd60bfd/","title":"Pride and Prejudice!!","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"63662dde-b426-4c57-acc9-f55fa40e5e37\"}":{"__typename":"DeepDives","uuid":"63662dde-b426-4c57-acc9-f55fa40e5e37","content":"\u003cp\u003eI would tell my middle and high school self not to be afraid of uncertainty. It’s okay not to have everything figured out yet: curiosity and persistence matter more than having a perfect plan. Every experience, even the confusing ones, will teach you something valuable!!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e027bc32-aa57-4a24-aeec-159cbc0fff29\"}":{"__typename":"DeepDives","uuid":"e027bc32-aa57-4a24-aeec-159cbc0fff29","content":"\u003cp\u003eMentorship matters to me because I know how much difference it makes to have someone believe in you and guide you when you’re figuring things out. I’ve been lucky to have mentors who helped me see my potential and navigate challenges, and I want to do the same for others, to be that source of encouragement and perspective that can really change someone’s path!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"c6a8b57d-178b-4fd8-a41e-bf567b6d5aa7\"}":{"__typename":"DeepDives","uuid":"c6a8b57d-178b-4fd8-a41e-bf567b6d5aa7","content":"\u003cp\u003eMy greatest source of motivation is knowing that my work can have a positive impact on others. Whether it’s helping someone understand a concept, feel more confident, or see new possibilities for themselves, the chance to make a meaningful difference keeps me motivated to keep learning and improving.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"531983b9-9bb4-471e-89c6-9afbd1f7bb10\"}":{"__typename":"DeepDives","uuid":"531983b9-9bb4-471e-89c6-9afbd1f7bb10","content":"\u003cp\u003eOne of my biggest passion projects is Why This Matters, a community-based organization I founded to bring free, open-to-the-public life skills classes to my community. I wanted to create a space where people of all ages could learn practical skills that often aren’t taught in school, from financial literacy to communication and self-awareness. Alongside it, I created a podcast where I interview community members of different ages, races, and backgrounds to learn about their experiences, perspectives, and hopes for the future. The project has shown me how powerful open dialogue and shared learning can be in building understanding and connection across differences.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"a9d96768-27b3-40e8-84e1-c6919601cd65\"}":{"__typename":"School","uuid":"a9d96768-27b3-40e8-84e1-c6919601cd65","name":"Princeton High School","city":"Princeton","type":"HIGH","state":"New Jersey","country":"United States","zip":"08540"},"Education:{\"uuid\":\"ed09318a-4a30-472c-a9a4-a012b526ab01\"}":{"__typename":"Education","uuid":"ed09318a-4a30-472c-a9a4-a012b526ab01","school":{"__ref":"School:{\"uuid\":\"a9d96768-27b3-40e8-84e1-c6919601cd65\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"b466614e-e1fc-460e-abcf-3331a8703d3b\"}":{"__typename":"Education","uuid":"b466614e-e1fc-460e-abcf-3331a8703d3b","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Hotel Administration \u0026 Business Management","degree":null},"MentorPublicProfile:{\"uuid\":\"26b4e50f-c5c1-4b64-b8e1-255a53207f7a\"}":{"__typename":"MentorPublicProfile","uuid":"26b4e50f-c5c1-4b64-b8e1-255a53207f7a","displayName":"Elizabeth T.","slug":"elizabeth-tian","biography":"\u003cp\u003eHello! My name is Elizabeth Tian, and I’m a student at Cornell University’s Nolan School of Hotel Administration, where I’m studying Business Management. I’ve always been fascinated by how people come together to create change, whether that’s through a local community project, a business idea, or simply a story that makes someone see the world differently. I’m especially drawn to the intersection of business and social impact, where strategic thinking and empathy can work hand in hand to make real progress possible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I founded a nonprofit called WhyThisMatters, an organization dedicated to offering free, open to the public life skills courses to bridge the inequality gap. We focused on helping community members build confidence in areas like financial literacy, public speaking, and professional development, while connecting them with mentors who shared similar goals and challenges. With WhyThisMatters I also created a podcast to empower students to ask big questions about the world around them, from politics and identity to sustainability and justice, where I’ve interviewed activists, creators, and educators. These conversations inspired me to see leadership as something deeply collaborative. They taught me that leadership isn’t about being the loudest voice in the room; it’s about listening deeply, building trust, and helping others find theirs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Cornell, I’ve carried this curiosity into my work as a consultant and community builder. As a Business Analyst for Consult Your Community, I collaborate with small business owners in Ithaca to strengthen their marketing and financial strategies, helping them grow and thrive. This summer I was a social impact consulting intern for Full Circle Strategies where I worked on projects with major clients like L’Oréal North America and Amazon, helping them align community partnerships and DEI initiatives with measurable business outcomes. One of my favorite experiences was helping develop a national outreach strategy for L’Oréal that connected corporate teams with nonprofit leaders representing over three million members, proving that business impact can scale alongside social purpose. Whether I’m helping a café expand its customer base or brainstorming DEI initiatives with a corporate client, I’m motivated by the same goal: to make change practical, measurable, and meaningful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics and consulting, you can probably find me trying a new restaurant (I keep an 11-page Google Doc of food reviews!), curating Spotify playlists, or going on impulsive trips with friends. I believe curiosity is contagious and through my work, I hope to show others that asking why this matters is often the first step toward making a real difference!!\u003c/p\u003e","teachingVideoPlaybackId":"c02br12Lqq402dwX6LZVAoFwK00r3OOWwUo02HwPyJQLrT4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"47674197-88ab-481a-a588-91eb0e11ec5e\"}"}],"causesSupported":[],"major":"Hotel Administration \u0026 Business Management","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"63662dde-b426-4c57-acc9-f55fa40e5e37\"}"},{"__ref":"DeepDives:{\"uuid\":\"e027bc32-aa57-4a24-aeec-159cbc0fff29\"}"},{"__ref":"DeepDives:{\"uuid\":\"c6a8b57d-178b-4fd8-a41e-bf567b6d5aa7\"}"},{"__ref":"DeepDives:{\"uuid\":\"531983b9-9bb4-471e-89c6-9afbd1f7bb10\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bb39852b-6291-47c6-ac32-ffff0d8dd182/-/preview/-/format/jpg/","https://ucarecdn.com/2870c127-2ffe-4023-bfbb-549f14c02810/-/preview/-/format/jpg/","https://ucarecdn.com/311deb39-d005-478d-9fe8-d04e4767e0c0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ed09318a-4a30-472c-a9a4-a012b526ab01\"}"},{"__ref":"Education:{\"uuid\":\"b466614e-e1fc-460e-abcf-3331a8703d3b\"}"}],"hiredAt":"2025-09-30T17:00:41.613Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Creative Writing","Business / Entrepreneurship","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPubl
