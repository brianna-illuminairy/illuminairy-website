l self?"},"DeepDives:{\"uuid\":\"45526a27-bbc2-4b1e-9681-ea18860ebe94\"}":{"__typename":"DeepDives","uuid":"45526a27-bbc2-4b1e-9681-ea18860ebe94","content":"\u003cp\u003eYou don't rise to your goals, you fall to your systems\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"df866675-4ccb-4826-a1d0-61de24cefcd1\"}":{"__typename":"School","uuid":"df866675-4ccb-4826-a1d0-61de24cefcd1","name":"Springbrook High School","city":"Silver Spring","type":"HIGH","state":"Maryland","country":"United States","zip":"20904"},"Education:{\"uuid\":\"5a50ecd4-2653-4faf-b384-1c664e08f143\"}":{"__typename":"Education","uuid":"5a50ecd4-2653-4faf-b384-1c664e08f143","school":{"__ref":"School:{\"uuid\":\"df866675-4ccb-4826-a1d0-61de24cefcd1\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"f4ca2577-0d89-4e28-8ecf-994d4aadae09\"}":{"__typename":"Education","uuid":"f4ca2577-0d89-4e28-8ecf-994d4aadae09","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2028","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"4ed26f8d-e497-421a-8e98-e038bc994142\"}":{"__typename":"MentorPublicProfile","uuid":"4ed26f8d-e497-421a-8e98-e038bc994142","displayName":"Samuel B.","slug":"samuel-birru","biography":"\u003cp\u003eHi everyone! I’m a computer science student who really enjoys building things with code and using data to solve problems. I got into CS because I liked the idea of being able to create tools and systems that actually do something useful. Over time, I’ve become especially interested in data-driven work and figuring out how programming can be applied in different industries.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring college, I’ve had the chance to intern at Amazon, the National Institute of Standards and Technology, and a small alumni hedge fund. Each of those experiences showed me a different side of the tech world. At Amazon, I saw what it’s like to work on large systems with big teams and real customers. At NIST, I was in a more research-focused environment where the work was slower paced but very detail-oriented. At the hedge fund, I got exposure to how technology and data are used in finance. Being in these very different settings helped me understand that there isn’t just one path in computer science. There are a lot of options, and each one fits different personalities and goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m happy to talk about internships, recruiting, technical interviews, or just how to get started in CS. I know how confusing and stressful the process can feel, especially when you are trying to figure everything out on your own. I’ve been through it recently, so I can share what worked for me and what I would do differently. I truly believe that with guidance, it can be both a fun and very rewarding experience!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school and work, I like to stay active. I play rugby and train in Muay Thai and Brazilian Jiu-Jitsu. On the other hand. I also spend a decent amount of time playing video games. I think both sports and gaming have shaped how I think about improvement. You practice, you lose, you learn, and you get better over time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf anything I’ve done sounds interesting to you, or if you just want someone to talk to about CS and career paths, feel free to reach out. I’m always open to connecting and helping however I can.\u003c/p\u003e","teachingVideoPlaybackId":"IBFebtmC1wqi20001EZVE028HbTBhjDZDyDKCP01cRiH02JY","teachingVideoDescript
