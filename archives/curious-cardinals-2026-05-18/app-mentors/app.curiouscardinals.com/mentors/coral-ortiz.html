xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8b35c67b-d6e1-46ad-813d-f3abbda256ba\"}":{"__typename":"DeepDives","uuid":"8b35c67b-d6e1-46ad-813d-f3abbda256ba","content":"\u003cp\u003eI would tell myself to trust the process. Everything is a learning experience. When stakes may feel high, it’s important to have a growth mindset so you can continue adapting when things get tough.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"79a7d6e1-eb38-41b5-8491-36d32bd9545b\"}":{"__typename":"DeepDives","uuid":"79a7d6e1-eb38-41b5-8491-36d32bd9545b","content":"\u003cp\u003eAs someone who attended a high school with limited resources, I understand just how important mentorship is. In high school, I joined my city's local debate league. This decision would change my life in so many ways. At debate, I met one of my lifelong mentors who happened to be a current Yale student. She helped me navigate the college admissions process and gave me tips and resources when I first got to Yale. This experience has highlighted just how important mentorship can be. As someone who benefitted from mentorship, I want to guide students in the same way I was guided.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"702bc50c-c0c7-4800-aa3b-7328f328f2a9\"}":{"__typename":"DeepDives","uuid":"702bc50c-c0c7-4800-aa3b-7328f328f2a9","content":"\u003cp\u003eI would love to start my own production company that focuses on using various types of media to tell stories in my lifetime.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e66ddc62-6a56-4fce-b12e-0977a8caa6cb\"}":{"__typename":"DeepDives","uuid":"e66ddc62-6a56-4fce-b12e-0977a8caa6cb","content":"\u003cp\u003eI chose my major because it allowed me to learn across various disciplines. At Yale, I took English, History, Art, and Political Science classes which allowed me to gain a well-rounded perspective on subjects that matter to me.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"b8cfe7a2-a2d7-4535-98f3-25e08648d9c9\"}":{"__typename":"School","uuid":"b8cfe7a2-a2d7-4535-98f3-25e08648d9c9","name":"James Hillhouse High School","city":"New Haven","type":"HIGH","state":"Connecticut","country":"United States","zip":"06511"},"Education:{\"uuid\":\"dcbe7221-ee88-4bc6-bfa5-7fa2401de81b\"}":{"__typename":"Education","uuid":"dcbe7221-ee88-4bc6-bfa5-7fa2401de81b","school":{"__ref":"School:{\"uuid\":\"b8cfe7a2-a2d7-4535-98f3-25e08648d9c9\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-
