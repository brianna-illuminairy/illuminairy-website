xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"70de3dde-d8df-46c9-9487-f7ffc7ad4b31\"}":{"__typename":"Favorites","uuid":"70de3dde-d8df-46c9-9487-f7ffc7ad4b31","photoUrl":"https://ucarecdn.com/045ca202-d371-4d5c-97c4-57e5983145db/","title":"Home Alone 2: Lost in New York","type":"MOVIE"},"Favorites:{\"uuid\":\"aa80b634-aa7d-4b00-9214-05c2c5e6d562\"}":{"__typename":"Favorites","uuid":"aa80b634-aa7d-4b00-9214-05c2c5e6d562","photoUrl":"https://ucarecdn.com/1cebb141-8379-4f59-8455-94808d7cf42d/","title":"Soccer","type":"SPORT"},"Favorites:{\"uuid\":\"ae958e24-0bf1-4604-b14d-b68fd80a49f1\"}":{"__typename":"Favorites","uuid":"ae958e24-0bf1-4604-b14d-b68fd80a49f1","photoUrl":"https://ucarecdn.com/d387e688-ed98-43ee-8af7-dccd8bc52bcc/","title":"New York City","type":"CITY"},"CausesSupported:{\"uuid\":\"5c6a8d49-de9a-4f29-b839-216f24b9909e\"}":{"__typename":"CausesSupported","uuid":"5c6a8d49-de9a-4f29-b839-216f24b9909e","name":"Girls on the Run","description":"\u003cp\u003eMy sorority's philanthropic organization\u003c/p\u003e","photoUrl":"https://ucarecdn.com/e1ddd18f-af43-4ac6-87a5-e0f5c5c47c2a/"},"CausesSupported:{\"uuid\":\"e70c8a50-861d-4bbc-95ce-af3b440df8be\"}":{"__typename":"CausesSupported","uuid":"e70c8a50-861d-4bbc-95ce-af3b440df8be","name":"Bergen Family Center","description":"\u003cp\u003eWhere I donated 100% of the proceeds from my non-profit, to help those in need.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/5368a4ed-ea3d-4b10-ba74-03a65b9527d8/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"eb94a7e9-e853-4e12-8787-014189e25a9f\"}":{"__typename":"DeepDives","uuid":"eb94a7e9-e853-4e12-8787-014189e25a9f","content":"\u003cp\u003eI’d tell myself: Don’t give up—seriously. I know things feel overwhelming sometimes, and it’s easy to think you’re not doing enough or that you’re not on the right track. But you are. Just keep going. Even when it’s hard or confusing, and when it feels like nothing’s working out—don’t quit. You’re learning, growing, and becoming exactly who you’re meant to be. Even if something goes awry, it's a learning lesson. You’ve got more strength in you than you realize.\u003c/p\u003e\u003chr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"df22c6ef-f763-4038-b56e-5b1a3abec59b\"}":{"__typename":"DeepDives","uuid":"df22c6ef-f763-4038-b56e-5b1a3abec59b","content":"\u003cp\u003eMy mom, hands down. She’s the strongest person I know—not just because of what she’s been through, but because of how she handles everything with so much love and resilience. She never gives up, no matter how tough things get, and she’s always there for the people she cares about. I’ve learned so much from watching her—how to be patient, how to stay grounded, and how to keep going even when life doesn’t go as planned. She’s the kind of person I hope to become one day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"0e58d034-8e87-4818-8c71-b2371a695aba\"}":{"__typename":"DeepDives","uuid":"0e58d034-8e87-4818-8c71-b2371a695aba","content":"\u003cp\u003eI spent my high school summers working as a camp counselor, which honestly ended up being one of the best experiences. I got to work with kids, plan activities, and just be outside all day. It taught me a lot about responsibility, patience, and how to be a good leader—plus, it was a lot of fun. Every day was different, and even when things got chaotic (which they definitely did), I loved it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1212b49f-fe77-401e-9931-1f589bb25d76\"}":{"__typename":"DeepDives","uuid":"1212b49f-fe77-401e-9931-1f589bb25d76","content":"\u003cp\u003eIn my spare time, I like to just unwind and do things that help me recharge. Sometimes that means hanging out with friends or family, other times it’s reading, listening to music, or going for a walk. I also really enjoy anything creative or hands-on—it’s nice to have little moments where I can slow down and enjoy something simple.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65\"}":{"__typename":"School","uuid":"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65","name":"Tenafly High School","city":"Tenafly","type":"HIGH","state":"New Jersey","country":"United States","zip":"07670"},"Education:{\"uuid\":\"c97d2a2c-d08d-46ce-9e13-312ee34015ca\"}":{"__typename":"Education","uuid":"c97d2a2c-d08d-46ce-9e13-312ee34015ca","school":{"__ref":"School:{\"uuid\":\"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1104326-8c39-4ffc-88fb-397e6af4a57a\"}":{"__typename":"School","uuid":"a1104326-8c39-4ffc-88fb-397e6af4a57a","name":"Lehigh University","city":"Bethlehem","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"18015"},"Education:{\"uuid\":\"8d072821-d3bb-4f43-b649-15526945623e\"}":{"__typename":"Education","uuid":"8d072821-d3bb-4f43-b649-15526945623e","school":{"__ref":"School:{\"uuid\":\"a1104326-8c39-4ffc-88fb-397e6af4a57a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"1731d827-6d8e-4b97-bc99-6dd486033718\"}":{"__typename":"MentorPublicProfile","uuid":"1731d827-6d8e-4b97-bc99-6dd486033718","displayName":"Gillian F.","slug":"gillian-feit-1","biography":"\u003cp\u003eHi! My name is Gillian, and I am so excited to join the Curious Cardinals community!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m currently majoring in Psychology and minoring in Business at Lehigh University. My passion for studying psychology began at a young age when I questioned why my twin and I are so different, yet we have almost mirroring life experiences. He is Type B while I’m Type A, he used to be significantly more outgoing than me (although I think the tables are beginning to turn), his favorite ice cream flavor is vanilla while mine is chocolate, etc.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile I am truly passionate about learning and teaching psychology, my other interests include business (I started my own non-profit during COVID-19), arts and crafts, cooking, traveling (I studied abroad in Copenhagen last spring, as shown in photo 2), watching movies and TV, listening to music (I went to Noah Kahan's concert, as shown in photo 3), going for walks outside, and simply hanging out with my friends and family!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not studying or in class, you can probably find me conducting psychological research. Over the past three summers, I’ve had clinical psychology internships, where I learned firsthand the impact that personalized interventions can have on one’s life. Last year, I was a research assistant in a FASD (Fetal Alcohol Spectrum Disorder) lab and a parent-infant attachment style lab. This year, I am conducting original research as part of my Honors Thesis. I’m very excited to see where this research will lead and how it might contribute to the psychological field.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAside from academics, much of my college career has been dedicated to extracurricular activities. I am currently in a sorority where I have met amazing friends, and we are all super passionate about our philanthropic organization (Girls on the Run). I am also involved in the America Reads/America Counts Tutoring Club. I spend much time being an assistant teacher at a local elementary school, which has been engaging and exciting! I can’t wait to bring the skills I’ve learned in the classroom to Curious Cardinals.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI decided to join the Curious Cardinals community because I’ve always loved working with students as a mentor and creating personalized approaches to help fulfill individual needs. I enjoy getting to know others, understanding their needs and interests, and helping them achieve their goals! I look forward to helping your students find themselves and feel passionate about learning what interests them.\u003c/p\u003e","teachingVideoPlaybackId":"GQ2LxwmoB19f2TorAHjw52L8hWWqGDAAikoptf1LYwM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I’m really proud of is my honors thesis and the research I’m currently doing for a literature review I'm writing for \u003cem\u003eJAPA\u003c/em\u003e (Journal of the American Psychoanalytic Association). My thesis gave me the chance to dive deep into a topic I’m passionate about, and it really pushed me to grow as a writer and a thinker. The JAPA review has been an amazing opportunity too—it’s been challenging, but it’s also taught me so much about the research process and how to communicate complex ideas clearly. It feels really good to be contributing to something meaningful in the field I care about.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"70de3dde-d8df-46c9-9487-f7ffc7ad4b31\"}"},{"__ref":"Favorites:{\"uuid\":\"aa80b634-aa7d-4b00-9214-05c2c5e6d562\"}"},{"__ref":"Favorites:{\"uuid\":\"ae958e24-0bf1-4604-b14d-b68fd80a49f1\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5c6a8d49-de9a-4f29-b839-216f24b9909e\"}"},{"__ref":"CausesSupported:{\"uuid\":\"e70c8a50-861d-4bbc-95ce-af3b440df8be\"}"}],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"eb94a7e9-e853-4e12-8787-014189e25a9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"df22c6ef-f763-4038-b56e-5b1a3abec59b\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e58d034-8e87-4818-8c71-b2371a695aba\"}"},{"__ref":"DeepDives:{\"uuid\":\"1212b49f-fe77-401e-9931-1f589bb25d76\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/02b46d5e-f2f9-4c49-a17a-b62551b37ada/-/preview/-/format/jpg/","https://ucarecdn.com/9db691fc-29e9-4335-9794-2db5eee3a760/-/preview/-/format/jpg/","https://ucarecdn.com/4ca168eb-5b79-4efd-a871-ec413dcc534d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c97d2a2c-d08d-46ce-9e13-312ee34015ca\"}"},{"__ref":"Education:{\"uuid\":\"8d072821-d3bb-4f43-b649-15526945623e\"}"}],"hiredAt":"2025-03-20T21:17:13.251Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Video / Photography","Business / Entrepreneurship","Medicine / Health","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gillian-feit-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1731d827-6d8e-4b97-bc99-6dd486033718\"}"}}},"_sentryTraceData":"15d892312afb48c0ac6de253cc76f845-b5b0c40f2acd5ffc-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=15d892312afb48c0ac6de253cc76f845,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"gillian-feit-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
