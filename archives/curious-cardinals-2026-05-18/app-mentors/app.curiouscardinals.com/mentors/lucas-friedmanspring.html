xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e1530fa3-6e31-4d65-baeb-96469f9e6043\"}":{"__typename":"Favorites","uuid":"e1530fa3-6e31-4d65-baeb-96469f9e6043","photoUrl":"https://ucarecdn.com/23615ffb-ae13-4e93-9e82-381aa7edce4c/","title":"Philadelphia (of course)","type":"CITY"},"Favorites:{\"uuid\":\"3bbca7fb-577a-402e-8d5d-5a931a01692f\"}":{"__typename":"Favorites","uuid":"3bbca7fb-577a-402e-8d5d-5a931a01692f","photoUrl":"https://ucarecdn.com/50db2ba2-c28f-4f54-b3f4-909de180364a/","title":"Hopscotch by Julio Cortázar","type":"BOOK"},"Favorites:{\"uuid\":\"2c4cc6f9-9b4c-45bf-b606-a270b81a5a43\"}":{"__typename":"Favorites","uuid":"2c4cc6f9-9b4c-45bf-b606-a270b81a5a43","photoUrl":"https://ucarecdn.com/f1051209-065e-4228-b221-e86cacb2d365/","title":"Juan Cuadrado","type":"ATHLETE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f9b9d7f7-a939-4011-b1da-2ee33ec5bd9b\"}":{"__typename":"DeepDives","uuid":"f9b9d7f7-a939-4011-b1da-2ee33ec5bd9b","content":"\u003cp\u003eEnglish Professor\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"99a82549-86f3-4ab7-8d3f-49341b5c8386\"}":{"__typename":"DeepDives","uuid":"99a82549-86f3-4ab7-8d3f-49341b5c8386","content":"\u003cp\u003eWorking on small farms across the Northeast, biking Vermont from it's southern to northern border, making hummus, caring for family friends' goats, working at a counselor at a soccer camp, working for a community-based nonprofit in New York, playing Pokemon Go with my cousins on their paprika farm in Northern Spain\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"5bf39fab-ea35-485e-92d5-3f4146159500\"}":{"__typename":"DeepDives","uuid":"5bf39fab-ea35-485e-92d5-3f4146159500","content":"\u003cp\u003eMy 10th grade English teacher. He was the first person who really showed me that literary study wasn't just something you do in a classroom and then stop doing when you get home. What I learned from him was that literary study can and in fact must be a way of living all aspects of your one's life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"916d3ae5-e3f3-4621-aa9d-37c8c4192d89\"}":{"__typename":"DeepDives","uuid":"916d3ae5-e3f3-4621-aa9d-37c8c4192d89","content":"\u003cp\u003eGenerally scattered. I struggled—particularly in middle school but early into high school as well—with organization and general executive functioning issues. Obviously I am excited to work with all kinds of students, but it's always particularly rewarding to work with students who, like I once was, can do really good work but just need a little extra push to start doing it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"1b71a073-2eaf-4df9-bf59-ba6bac16b290\"}":{"__typename":"School","uuid":"1b71a073-2eaf-4df9-bf59-ba6bac16b290","name":"Germantown Friends School","city":"Philadelphia","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19144"},"Education:{\"uuid\":\"f2755e73-d471-4178-a04b-4baa83e752ea\"}":{"__typename":"Education","uuid":"f2755e73-d471-4178-a04b-4baa83e752ea","school":{"__ref":"School:{\"uuid\":\"1b71a073-2eaf-4df9-bf59-ba6bac16b290\"}"},"startYear":"2015","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"9243b309-e93d-459c-88a0-6260ba04f466\"}":{"__typename":"Education","uuid":"9243b309-e93d-459c-88a0-6260ba04f466","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"English Literature, certificate in European Critical Thought","degree":null},"MentorPublicProfile:{\"uuid\":\"f9b76e5b-0025-485e-a96d-c5814612d01f\"}":{"__typename":"MentorPublicProfile","uuid":"f9b76e5b-0025-485e-a96d-c5814612d01f","displayName":"Lucas F.","slug":"lucas-friedmanspring","biography":"\u003cp\u003eHello! My name is Lucas Friedman-Spring. I was born in New York City before moving to Philadelphia in third grade. I attended Grinnell College in Iowa as a Founder’s Scholar for a year before transferring to Brown University, where I’m currently a rising Junior studying English Literature and European Critical Thought (a program mainly focused on continental philosophy and literary theory) and also serving on the Departmental Undergraduate Group for the Comparative Literature department. I’m particularly interested in sustainable agriculture (I spent much of my time in high school working on small farms), semiotics, and literature of the early-to-mid 20th Century. I’m currently an editor of \u003cem\u003eThe Prospector Journal of Comparative Literature\u003c/em\u003e at Brown and \u003cem\u003eHouse House Magazine\u003c/em\u003e: a magazine of cultural criticism and literature run out of Harvard. I also spent last semester working as a copyeditor and fact checker at \u003cem\u003eThe College Hill Independent\u003c/em\u003e, New England’s largest-circulating alt-weekly (to which I'll return next semester as editor of the literary section). I’m working this summer at New Directions Publishing, a New York-based independent publisher of literature in English and translation, publishing such authors as William Carlos Williams, Clarice Lispector, Franz Kafka, Anne Carson, and more. I like to spend my free time reading, playing soccer, gardening, and trying to teach tricks to my two very unruly dogs. I played soccer, baseball, squash, threw javelin, and ran long-distance in high school, along with acting in a production of Frank Wedekind's 1891 play \u003cem\u003eSpring Awakening \u003c/em\u003eand founding a still-operating alternative student magazine that, in my time as editor, reached over 500 readers per issue on 6 out of 7 continents (Antarctica proving a tough nut to crack in that regard). I also beatboxed in a cappella groups in high school and at Grinnell.\u003c/p\u003e\u003cp\u003eAt Grinnell I mostly studied earlier English literature, taking courses mainly focusing on the period between 1,000 and 1,900, though at Brown I’ve become more interested more recent developments in the humanities, taking courses on modernist literature, psychoanalysis, poetry composition, philosophy of language, literature of the 1980s, and more.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI’m excited to work with writers and readers of all levels, whether they’re a student who wants more learning opportunities outside of their normal English curriculum or a student who needs help meeting the demands of their school, if they’re an aspiring author or someone who just wants to write great college essays. Whoever and wherever you are, I’m looking forward to working with you!\u003c/p\u003e","teachingVideoPlaybackId":"Yb9ZtP7ZkDGBGQoWXxVXFsESsAOn00rqfOeUXddU9P94","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was almost certainly hitting a walk-off double to win the finals of my little league tournament when I was 12 years old. Nothing since has come close.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e1530fa3-6e31-4d65-baeb-96469f9e6043\"}"},{"__ref":"Favorites:{\"uuid\":\"3bbca7fb-577a-402e-8d5d-5a931a01692f\"}"},{"__ref":"Favorites:{\"uuid\":\"2c4cc6f9-9b4c-45bf-b606-a270b81a5a43\"}"}],"causesSupported":[],"major":"English Literature, certificate in European Critical Thought","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f9b9d7f7-a939-4011-b1da-2ee33ec5bd9b\"}"},{"__ref":"DeepDives:{\"uuid\":\"99a82549-86f3-4ab7-8d3f-49341b5c8386\"}"},{"__ref":"DeepDives:{\"uuid\":\"5bf39fab-ea35-485e-92d5-3f4146159500\"}"},{"__ref":"DeepDives:{\"uuid\":\"916d3ae5-e3f3-4621-aa9d-37c8c4192d89\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/007945a4-e1f9-4977-9dda-3c6b68e16038/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f2755e73-d471-4178-a04b-4baa83e752ea\"}"},{"__ref":"Education:{\"uuid\":\"9243b309-e93d-459c-88a0-6260ba04f466\"}"}],"hiredAt":"2025-05-30T23:03:57.787Z","topics":["Writing","College Essay Writing","Reading","History"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lucas-friedmanspring\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f9b76e5b-0025-485e-a96d-c5814612d01f\"}"}}},"_sentryTraceData":"451baf7577d64d549ae266df521d0033-85ca76779377bf
