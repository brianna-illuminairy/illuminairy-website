xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f2a289f2-25cd-4715-bf01-e4a0d4dfe3fe\"}":{"__typename":"Favorites","uuid":"f2a289f2-25cd-4715-bf01-e4a0d4dfe3fe","photoUrl":"https://ucarecdn.com/77d15b5a-6d47-40d0-baa3-c3c4ac3cc71b/","title":"Tokyo","type":"CITY"},"Favorites:{\"uuid\":\"83dde2fa-cbe8-476b-9dfb-4ef9f959ecb3\"}":{"__typename":"Favorites","uuid":"83dde2fa-cbe8-476b-9dfb-4ef9f959ecb3","photoUrl":"https://ucarecdn.com/d8985e71-a196-4866-837e-33c0536d499e/","title":"Animal Crossing","type":"GAME"},"Favorites:{\"uuid\":\"efb30f8b-7347-4e3f-b5bf-8757a96ba699\"}":{"__typename":"Favorites","uuid":"efb30f8b-7347-4e3f-b5bf-8757a96ba699","photoUrl":"https://ucarecdn.com/e46d67c7-f8e1-4be9-bf43-2ea57be6f467/","title":"Rebecca Sugar","type":"ARTIST"},"CausesSupported:{\"uuid\":\"f8cd1b89-44f0-4eb3-a3b6-e9fcf7fe8672\"}":{"__typename":"CausesSupported","uuid":"f8cd1b89-44f0-4eb3-a3b6-e9fcf7fe8672","name":"Doctors without Borders","description":"","photoUrl":"https://ucarecdn.com/2cc8f30d-b5c8-4829-bc19-b394c7b1faba/"},"CausesSupported:{\"uuid\":\"bf7da069-8199-4fab-b79c-3c6846fc8bd4\"}":{"__typename":"CausesSupported","uuid":"bf7da069-8199-4fab-b79c-3c6846fc8bd4","name":"To Write Love on her Arms","description":"","photoUrl":"https://ucarecdn.com/4e6e5a42-881a-4fa2-b3d2-544fb730df04/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c1733018-9e12-44c1-8b67-26a14dab8b04\"}":{"__typename":"DeepDives","uuid":"c1733018-9e12-44c1-8b67-26a14dab8b04","content":"\u003cp\u003eMentorship is super important to me because my life wouldn't be the same without the mentors who guided me as I grew up. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne mentor who really changed my life was my choir director, Patti Stock. She helped me discover my singing voice and gave me the confidence to perform in front of others. Before Patti, I didn't even know I could sing, but she spent years teaching me and helping me grow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can't imagine my life without singing now, and the confidence Patti helped me build has carried over into other areas of my life, like giving presentations, pitching to investors, and singing in front of large crowds.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"12a723f8-63f3-4430-958e-b2d15979fb23\"}":{"__typename":"DeepDives","uuid":"12a723f8-63f3-4430-958e-b2d15979fb23","content":"\u003cp\u003eI have so many hobbies I love! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI enjoy surfing, going to Pilates classes, and working on creative projects like taking voice lessons or singing with friends. I also love watercolor painting and making beautiful flower arrangements.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eOn top of all that, I’m into playing video games, going on long hikes with my dog, doing some photography, and creating mood boards on Pinterest. It's easy for me to always find something fun to do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"4091d6a8-ca52-460a-888d-56444feaf123\"}":{"__typename":"DeepDives","uuid":"4091d6a8-ca52-460a-888d-56444feaf123","content":"\u003cp\u003eBack in high school, I usually spent my summers training for cross country and running in local races. I also hung out with friends and occasionally took some summer school classes\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"d660944e-0cbe-4b53-97c3-7a2db87fe4e0\"}":{"__typename":"DeepDives","uuid":"d660944e-0cbe-4b53-97c3-7a2db87fe4e0","content":"\u003cp\u003eI'm really proud of what I accomplished with Whatever. Starting a business takes a lot of courage and isn't easy to navigate, but I went for it and learned a ton in the process. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eEven though it didn't ultimately succeed, the experience taught me valuable skills that I can use in other parts of my career. I gained insights into entrepreneurship, problem-solving, and leadership that I couldn't have learned any other way. \u003c/p\u003e\u003cbr\u003e\u003cp\u003ePlus, the connections I made and the challenges I overcame have prepared me for whatever comes next.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"ec6dbd1a-f6b6-41cd-a354-380052a0a123\"}":{"__typename":"School","uuid":"ec6dbd1a-f6b6-41cd-a354-380052a0a123","name":"Benedictine University","city":"Lisle","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60532"},"Education:{\"uuid\":\"45d4224f-a08f-4f5e-905a-9d795d658258\"}":{"__typename":"Education","uuid":"45d4224f-a08f-4f5e-905a-9d795d658258","school":{"__ref":"School:{\"uuid\":\"ec6dbd1a-f6b6-41cd-a354-380052a0a123\"}"},"startYear":"2012","endYear":null,"expectedGradYear":"2014","major":"Communications","degree":null},"School:{\"uuid\":\"91a8851d-2eb9-4908-b097-be124de53908\"}":{"__typename":"School","uuid":"91a8851d-2eb9-4908-b097-be124de53908","name":"Naperville Central High School","city":"Naperville","type":"HIGH","state":"Illinois","country":"United States","zip":"60540"},"Education:{\"uuid\":\"1b02149f-bba1-4bc4-ab99-6a6f55ef979a\"}":{"__typename":"Education","uuid":"1b02149f-bba1-4bc4-ab99-6a6f55ef979a","school":{"__ref":"School:{\"uuid\":\"91a8851d-2eb9-4908-b097-be124de53908\"}"},"startYear":"2007","endYear":"2010","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"5473c793-a6f0-4d87-af65-8544c133f876\"}":{"__typename":"MentorPublicProfile","uuid":"5473c793-a6f0-4d87-af65-8544c133f876","displayName":"Mallory L.","slug":"mallory-loar-1","biography":"\u003cp\u003eHello! It's so nice to meet you. My name is Mallory and here's a little bit more about me. ✌️\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor over a decade, I've been passionate about fostering community both online and in real life. I most recently worked on building my very own startup, Whatever, where our mission was focused on helping people experience the world with the people they loved the most and inspire deep connections.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Discord, I was the founding community hire, focusing on creating vibrant programs for millions of superfans, shaping the brand's identity, and leading various marketing teams. \u003cbr\u003e\u003cbr\u003eMy career began as a gaming blogger on Tumblr, which paved the way for my role at SteelSeries. There, I immersed myself in influencer marketing, public relations, and event launches. I've spent most of my career working in gaming and tech, driven by my love for building communities and creating exciting content.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated from Benedictine University with a major in Communications. Outside of my career, I sang soprano in choir for six years and participated in numerous music workshops. I grew up in Illinois as the oldest of four sisters and now live in San Francisco.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I enjoy watercolor painting, creating Japanese ikebana flower arrangements, and taking care of my houseplants and my dog, Winnie. I also have a soft spot for egg salad sandwiches!\u003c/p\u003e","teachingVideoPlaybackId":"EpaUGYSAvoPqXcEnWC9jghkLszBgD4Lw02R3ZbmX1O01g","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am the reason why tens of millions of Discord users are rabid fans of Discord as a brand. I created Discord's community, content and brand marketing from the ground up as their founding community hire. I'm so proud of this accomplishment in my career!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f2a289f2-25cd-4715-bf01-e4a0d4dfe3fe\"}"},{"__ref":"Favorites:{\"uuid\":\"83dde2fa-cbe8-476b-9dfb-4ef9f959ecb3\"}"},{"__ref":"Favorites:{\"uuid\":\"efb30f8b-7347-4e3f-b5bf-8757a96ba699\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"f8cd1b89-44f0-4eb3-a3b6-e9fcf7fe8672\"}"},{"__ref":"CausesSupported:{\"uuid\":\"bf7da069-8199-4fab-b79c-3c6846fc8bd4\"}"}],"major":"Communications","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c1733018-9e12-44c1-8b67-26a14dab8b04\"}"},{"__ref":"DeepDives:{\"uuid\":\"12a723f8-63f3-4430-958e-b2d15979fb23\"}"},{"__ref":"DeepDives:{\"uuid\":\"4091d6a8-ca52-460a-888d-56444feaf123\"}"},{"__ref":"DeepDives:{\"uuid\":\"d660944e-0cbe-4b53-97c3-7a2db87fe4e0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/340d5818-71b6-49e0-866d-926ced7e9e65/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"45d4224f-a08f-4f5e-905a-9d795d658258\"}"},{"__ref":"Education:{\"uuid\":\"1b02149f-bba1-4bc4-ab99-6a6f55ef979a\"}"}],"hiredAt":"2024-08-05T19:30:00.467Z","topics":[],"communityBadges":["https://ucarecdn.com
