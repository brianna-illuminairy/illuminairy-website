"type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"516d1370-e3f4-4135-8645-81803550e0b3\"}":{"__typename":"Education","uuid":"516d1370-e3f4-4135-8645-81803550e0b3","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"4336f521-0bc8-4c6a-924b-65ef0fcd134e\"}":{"__typename":"MentorPublicProfile","uuid":"4336f521-0bc8-4c6a-924b-65ef0fcd134e","displayName":"Alex P.","slug":"alexandra-poltorak","biography":"\u003cp\u003e\u003cu\u003eIntroduction:\u003c/u\u003e\u003c/p\u003e\u003cp\u003eHello website traveler!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy name is Alex.\u0026nbsp; I am a Carnegie Mellon University (CMU) 2022 Alumni and I used to play on my college varsity soccer team.\u0026nbsp; My favorite pastimes are hiking (anything outdoorsy really!), art (making it and looking at it), volunteering, and spending time with friends.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently I am working at one of the world’s top tech companies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cu\u003eEducational Philosophy:\u003c/u\u003e\u003c/p\u003e\u003cp\u003ePreviously I worked in the cloud, and currently I work with operating systems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWas this always what I thought I’d be doing?\u0026nbsp; No way.\u0026nbsp; In fact, none of this came easy.\u0026nbsp; The best things in life take time, and that’s just what had happened on my educational journey - lots of time invested.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn 3rd grade, I was the struggling student who had a weakness in multiplication and fractions.\u0026nbsp; Then I ended up succeeding in multivariable calculus and differential equations by 12th grade.\u0026nbsp; My first year at CMU, I was the only one in my computer science class who didn’t know a thing about programming.\u0026nbsp; My junior year, I became a teaching assistant for Introduction to Computer Systems.\u0026nbsp; These things took time, and they are what made my journey so precious.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf anything, this is what I am a big believer in: you are capable in anything you set your mind to.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWelcome to your first step in unlocking your potential.\u003c/p\u003e","teachingVideoPlaybackId":"rvdDwzgfWJ01y00DJa700uXNxCF3RCOZXUrWwnFfMrHW01g","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI ran a half marathon!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"67c720ef-f185-4d08-ac40-3af6f396969c\"}"},{"__ref":"Favorites:{\"uuid\":\"73c4d65e-8195-4448-9028-1bbd91fb0356\"}"}],"causesSupported":[],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ad0e26b4-a406-42cb-9be1-bd3536710ec8\"}"},{"__ref":"DeepDives:{\"uuid\":\"42553df5-c2b7-4be8-9407-530908d6dfb0\"}"},{"__ref":"DeepDives:{\"uuid\":\"753625f1-e8cc-42b9-a8ca-71276252ed2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"63d5333b-8ee1-4402-bbe4-c8e4a23a9d87\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/81a41f5d-472f-4ae4-881e-e9a3bd27aa98/-/preview/-/format/jpg/","https://ucarecdn.com/072f3f38-76e4-4579-adbc-7f1871ffc076/-/preview/-/format/jpg/","https://ucarecdn.com/4e87b90b-8c19-475b-8c85-ff5718ae4a9d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"663ae985-1a75-4389-9812-ffbbb10e9e4a\"}"},{"__ref":"Education:{\"uuid\":\"516d1370-e3f4-4135-8645-81803550e0b3\"}"}],"hiredAt":"2025-03-04T17:24:27.263Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science","Creative Writing","K-6 Storybook","Video / Photography","Coding / Programmi
