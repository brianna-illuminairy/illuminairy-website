xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"adc0b25a-29d9-4679-b86e-d4687c6af703\"}":{"__typename":"DeepDives","uuid":"adc0b25a-29d9-4679-b86e-d4687c6af703","content":null,"videoPlaybackId":"vUZlYs9QAuxFJPxpHSB5dIK7JJqxu3ur4IG7VBclchA","question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c3d779c7-096e-4208-bc1f-a2fe52e3fb23\"}":{"__typename":"DeepDives","uuid":"c3d779c7-096e-4208-bc1f-a2fe52e3fb23","content":"\u003cp\u003eIt will always work out in the way it's meant to! Keep yourself open to new experiences and you'll be amazed where it might take you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"31e7eae9-46e1-4e9f-b8f6-d4579c635d96\"}":{"__typename":"DeepDives","uuid":"31e7eae9-46e1-4e9f-b8f6-d4579c635d96","content":"\u003cp\u003eMy single mother, who never had the chance to go to college, who works countless hours each day to support me, who fought cancer while raising me, who puts me above everything else, is my biggest source of inspiration!!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a937771c-ecaa-42b9-a4dc-a3a8e73df8d0\"}":{"__typename":"DeepDives","uuid":"a937771c-ecaa-42b9-a4dc-a3a8e73df8d0","content":"\u003cp\u003e\u003cstrong\u003eI love surfing, playing beach volleyball, and cooking chicken katsu curry!!\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"a11cb9ae-baac-4ba7-9d00-ac28590abe5a\"}":{"__typename":"School","uuid":"a11cb9ae-baac-4ba7-9d00-ac28590abe5a","name":"Richard Montgomery High School","city":"Rockville","type":"HIGH","state":"Maryland","country":"United States","zip":"20852"},"Education:{\"uuid\":\"e32062a0-b317-45d0-8868-16f8e3ed6024\"}":{"__typename":"Education","uuid":"e32062a0-b317-45d0-8868-16f8e3ed6024","school":{"__ref":"School:{\"uuid\":\"a11cb9ae-baac-4ba7-9d00-ac28590abe5a\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"23c0687c-e872-4572-98fb-70991f0e54ed\"}":{"__typename":"Education","uuid":"23c0687c-e872-4572-98fb-70991f0e54ed","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"b59ef76e-db20-42c7-a1dc-6b58710be253\"}":{"__typename":"MentorPublicProfile","uuid":"b59ef76e-db20-42c7-a1dc-6b58710be253","displayName":"Austin C.","slug":"austin-cheung","biography":"\u003cp\u003e\u003cstrong\u003e“Blessed are the curious, for they shall have adventures.”\u003c/strong\u003e – Lovelle Drachman\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe first time I ever stepped onto an airplane, I was terrified. At just six years old, I was flying from Maryland to San Francisco to visit my grandpa, and the idea of soaring thousands of feet above the ground felt overwhelming. But the moment we took off—feeling the engines roar, the wheels lift, and the world shrink beneath me—I discovered something new: thrill, wonder, and an irresistible curiosity for the skies. That moment ignited a lifelong obsession with aerospace and exploration, ultimately leading me to pursue my career as a mechanical engineer.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in a single-parent, low-income household, I was incredibly fortunate to have a strong network of mentors and supporters who believed in me. Their encouragement pushed me to explore my passions, leading me to Yale, where I immersed myself in both aerospace and mentorship. As a project leader for the Yale Undergraduate Aerospace Association’s rocket team, I worked with an incredible group of peers to bring ambitious ideas to life. At the same time, through Matriculate, I had the privilege of mentoring high school seniors, guiding them through the entirety of the college application process and helping them achieve their own dreams.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAfter graduation, my love for exploration took me even further—on a four-month solo journey through Asia. Traveling alone across new cultures and landscapes solidified my belief in adventure, resilience, and the power of stepping outside one’s comfort zone. That same mindset ultimately brought me to San Diego, where I chose to move on my own, far from my East Coast roots, in pursuit of the life I want to build for myself.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWith a strong foundation in STEM and a deep appreciation for mentorship, I strive not only to help students master academic concepts but also to instill confidence and fearlessness in pursuing their passions. Whether through aerospace, education, or exploration, my journey has been shaped by the incredible people and experiences that have fueled my curiosity. I hope to inspire others to embrace their own journeys with the same sense of adventure and determination!\u003c/p\u003e","teachingVideoPlaybackId":"dWFfGdhVNyPApKstoMYfEa28UjfZNLrBkZrsM435K01w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"adc0b25a-29d9-4679-b86e-d4687c6af703\"}"},{"__ref":"DeepDives:{\"uuid\":\"c3d779c7-096e-4208-bc1f-a2fe52e3fb23\"}"},{"__ref":"DeepDives:{\"uuid\":\"31e7eae9-46e1-4e9f-b8f6-d4579c635d96\"}"},{"__ref":"DeepDives:{\"uuid\":\"a937771c-ecaa-42b9-a4dc-a3a8e73df8d0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/458482aa-eddf-4d25-80a4-047dacc84e21/-/preview/-/format/jpg/","https://ucarecdn.com/4047435d-3fe8-4fff-8d94-5499735ab8a5/-/preview/-/format/jpg/","https://ucarecdn.com/5633a985-c3e1-44c2-9a4f-0ea2f0f4413c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e32062a0-b317-45d0-8868-16f8e3ed6024\"}"},{"__ref":"Education:{\"uuid\":\"23c0687c-e872-4572-98fb-70991f0e54ed\"}"}],"hiredAt":"2025-01-27T18:48:23.530Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Calculus","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Physics","Spanish","Executive Function","College Essay Writing","Academic Coaching","Video / Photography","Robotics / Electronics / CAD","Aviation / Aerospace"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"
