xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"43a6cd9f-fced-4f7e-836f-81ca8639313a\"}":{"__typename":"DeepDives","uuid":"43a6cd9f-fced-4f7e-836f-81ca8639313a","content":"\u003cp\u003eSomething about me that isn't immediately obvious is that I am quite crafty! I like spending time on DIY projects, ranging from creating my own textured canvas art pieces to making garden planters out of cinderblock. These long, intricate projects fascinate me, and I love to look back on the process after putting together my creations!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e6da3544-c50c-4ca9-8a8f-2b348afadbd0\"}":{"__typename":"DeepDives","uuid":"e6da3544-c50c-4ca9-8a8f-2b348afadbd0","content":"\u003cp\u003eI spent my summers in high school on classes at local colleges or in debate camps! I took some unique classes in Comparative Literature and Technology Entrepreneurship one year that taught me new perspectives on world literature, while also inspiring me to create my own start-up! Other years, I spent my time doing speech drills to improve my public speaking skills and doing practice debates with my fellow camp-goers. In my free time, I baked a ton, learning how to make sourdough bread, French macarons, handmade pasta, and more!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4c300c94-589c-4b6a-b0eb-f35c01458483\"}":{"__typename":"DeepDives","uuid":"4c300c94-589c-4b6a-b0eb-f35c01458483","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to create an art studio, where I can freely create. I am interested in painting, making pottery, and woodworking; I'd love to have a space where I can spend my free time making pieces to share with family and friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"44dc9bcb-bff8-4299-9b2d-17925fd7b005\"}":{"__typename":"DeepDives","uuid":"44dc9bcb-bff8-4299-9b2d-17925fd7b005","content":"\u003cp\u003eOne passion project I have created in the past was my cooking blog in high school. I have loved to cook and bake for as long as I can remember, and after many friends asking for my recipes, I decided to put together a food blog to share my favorites. This taught me the basics of food photography, blogging, and website creation, skills that have helped me in my internships and classes!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"0bfda57b-830f-484c-84b4-2b5aedf9b4bf\"}":{"__typename":"School","uuid":"0bfda57b-830f-484c-84b4-2b5aedf9b4bf","name":"Dougherty Valley High School","city":"San Ramon","type":"HIGH","state":"California","country":"United States","zip":"94582"},"Education:{\"uuid\":\"ebfd0094-9dbc-4133-92d5-b1fe3e3ff727\"}":{"__typename":"Education","uuid":"ebfd0094-9dbc-4133-92d5-b1fe3e3ff727","school":{"__ref":"School:{\"uuid\":\"0bfda57b-830f-484c-84b4-2b5aedf9b4bf\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"7f683d1c-644e-4651-9258-56ed3317b3ed\"}":{"__typename":"Education","uuid":"7f683d1c-644e-4651-9258-56ed3317b3ed","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science - Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"a23a7ed3-3f2c-4ea9-883b-cc6b1064f4c2\"}":{"__typename":"MentorPublicProfile","uuid":"a23a7ed3-3f2c-4ea9-883b-cc6b1064f4c2","displayName":"Sonal S.","slug":"sonal-sharma","biography":"\u003cp\u003eHello! My name is Sonal; I am a senior at Brown University, studying Computer Science and Economics. In my free time, I love to cook \u0026amp; bake, rock climb (indoors exclusively!), and paint. I grew up in the Bay Area in California, but I plan to remain in Providence post-graduation to pursue a career in healthcare consulting. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor some background about me: I spent my time in middle and high school highly involved with the Speech and Debate team (I competed in both Lincoln Douglas and Policy style debate). The skills I picked up from debate helped me find confidence in my voice, which inspired me to seek new opportunities where I could apply my analytical skills. I then turned to entrepreneurship, creating a company to reduce household food waste with my teammates from a class on Technology Entrepreneurship. This opportunity taught me skills I continue to utilize in the work that I do today: I learned how to target unique customer markets, design app mock-ups, speak to investors, and more.  \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I transitioned to college, I began to investigate the theoretical foundations to entrepreneurship: economics. By combining a study in economics with computer science, I developed the means to understand economic factors that govern world markets and create code to analyze the data that drives these markets. This background so far has served me well in experiences in social enterprise advisory, business development, and healthcare consulting. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have spent the last eight years exploring what academic subjects inspire me and what career pursuits best fit my interests and aspirations. I hope to serve as a mentor to guide you through your exploration, whatever form that may take!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science - Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"43a6cd9f-fced-4f7e-836f-81ca8639313a\"}"},{"__ref":"DeepDives:{\"uuid\":\"e6da3544-c50c-4ca9-8a8f-2b348afadbd0\"}"},{"__ref":"DeepDives:{\"uuid\":\"4c300c94-589c-4b6a-b0eb-f35c01458483\"}"},{"__ref":"DeepDives:{\"uuid\":\"44dc9bcb-bff8-4299-9b2d-17925fd7b005\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0d92a3a5-678e-463c-8375-01527e9cad13/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ebfd0094-9dbc-4133-92d5-b1fe3e3ff727\"}"},{"__ref":"Education:{\"uuid\":\"7f683d1c-644e-4651-9258-56ed3317b3ed\"}"}],"hiredAt":"2025-02-05T13:32:50.312Z","topics":["Business / Entrepreneurship","Finance / Investing","Coding / Programming","Web Design","Machine Learning / AI","Law / Government / Policy","Sustainability","Journalism","Debate","Publi
