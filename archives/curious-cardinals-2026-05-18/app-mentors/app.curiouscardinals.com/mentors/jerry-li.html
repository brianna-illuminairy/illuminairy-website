xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"66de09d1-f9b3-4915-815a-83126bc7a100\"}":{"__typename":"Favorites","uuid":"66de09d1-f9b3-4915-815a-83126bc7a100","photoUrl":"https://ucarecdn.com/cf7621be-2b83-443c-86ee-900477e59b5d/","title":"The Miseducation of Lauryn Hill","type":"ALBUM"},"Favorites:{\"uuid\":\"19d41999-797c-4fa3-ae74-136c56ea4026\"}":{"__typename":"Favorites","uuid":"19d41999-797c-4fa3-ae74-136c56ea4026","photoUrl":"https://ucarecdn.com/4de6ec5c-6839-4c7c-8b9c-26deeebd6d31/","title":"Terraria","type":"GAME"},"Favorites:{\"uuid\":\"7854979a-5b5b-416c-9143-2845710a820e\"}":{"__typename":"Favorites","uuid":"7854979a-5b5b-416c-9143-2845710a820e","photoUrl":"https://ucarecdn.com/43d07592-a33a-44a0-a505-4e14afeeab9d/","title":"Lionel Messi","type":"ATHLETE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8a4789fe-c1f9-48a7-91e3-5003b8c8e2f2\"}":{"__typename":"DeepDives","uuid":"8a4789fe-c1f9-48a7-91e3-5003b8c8e2f2","content":"\u003cp\u003eI chose to major in physics because the mysteries of the universe are very exciting to me. It is really cool that we can formulate even the craziest phenomenon in a rigorous way using the language of math. Ultimately, I think that understanding where our world came from and understanding our current reality are very important pieces to understanding who we are as humans.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"93b86dfb-6cbe-4f75-a8a1-0fb15ef25cb6\"}":{"__typename":"DeepDives","uuid":"93b86dfb-6cbe-4f75-a8a1-0fb15ef25cb6","content":"\u003cp\u003eI was quite shy in middle/high school, so, as cliché as it might be, I would advise myself to not overthink so much about what others are thinking.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"27223662-7573-494b-9d0e-6152ad543717\"}":{"__typename":"DeepDives","uuid":"27223662-7573-494b-9d0e-6152ad543717","content":"\u003cp\u003eA big dream of mine is to go to space someday since everything about space has always fascinated me. It would be extra cool if I could do science in space somehow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6c9e9706-b95d-408d-9410-860491a7f2c2\"}":{"__typename":"DeepDives","uuid":"6c9e9706-b95d-408d-9410-860491a7f2c2","content":"\u003cp\u003eI really enjoy playing or watching sports in my free time. In particular, I'm often playing basketball or soccer with a group of friends. I think it's a great way to let out some energy and relax!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"4b07ef42-819f-461f-9ee3-364ff16a926a\"}":{"__typename":"School","uuid":"4b07ef42-819f-461f-9ee3-364ff16a926a","name":"Guilford High School","city":"Guilford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06437"},"Education:{\"uuid\":\"0beecc03-5144-451c-9ffc-1b21decef4f3\"}":{"__typename":"Education","uuid":"0beecc03-5144-451c-9ffc-1b21decef4f3","school":{"__ref":"School:{\"uuid\":\"4b07ef42-819f-461f-9ee3-364ff16a926a\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"ec8c1254-a118-47ef-8590-1a7923e8cc2f\"}":{"__typename":"Education","uuid":"ec8c1254-a118-47ef-8590-1a7923e8cc2f","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"55d7ab93-0efc-4b99-814d-9b77b2ab215b\"}":{"__typename":"MentorPublicProfile","uuid":"55d7ab93-0efc-4b99-814d-9b77b2ab215b","displayName":"Jerry L.","slug":"jerry-li","biography":"\u003cp\u003eI am a junior studying physics at Yale. There, I have taken numerous math, physics, and computer science courses and have been especially passionate about those subjects. In the long term, I hope to pursue a PhD and go into academia for physics. In my many years as a student so far, I have started to understand which learning methods are the most effective for me and I intend to impart these ways to others. Most importantly, I have discovered that learning is an exciting, joyous process and I hope to share this sentiment with the next generation of students.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up in a small town in Connecticut only around 30 minutes outside of New Haven where Yale is located. As a little kid, I remember spending weekends at Yale, whether it was to listen to talks for young students, attend science competitions, or wander about the fascinating assortment of museums. In particular, I remember learning about space and black holes for the first time and being fascinated (a bit scared too) by the concept of infinity. It was then that my curiosity began to develop, and it has been a fundamental part of me ever since.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was involved with a number of extracurriculars. I played viola for the school orchestra, was a varsity soccer player and fencer, and was class president for four years. I also participated in many of the popular high school math or science competitions and became quite familiar with those processes. In the end, I earned a Regeneron STS Scholar (top 300) distinction, was an AIME qualifier, was the highest scorer in the local, county-wide math league, and was the salutatorian of my high school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAs a college student, I am a project lead for the Yale Undergraduate Aerospace Association CubeSat (an engineering project/team aiming to launch a real satellite to space) and am involved with computational astrophysics research, where I study the evolution of galaxies and black holes over time to better understand the history of the universe. Outside of academic interests, I have kept up my love for soccer by playing for a club team at Yale and have been learning again to play piano, which I used to do as a kid. I have also been practicing French in my free time, as I am planning to study abroad in Paris in the near future!\u003c/p\u003e","teachingVideoPlaybackId":"K4r6PG6s01dlhsMGseaFrmkh01nUw02ND40002SYU9g462Rg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"66de09d1-f9b3-4915-815a-83126bc7a100\"}"},{"__ref":"Favorites:{\"uuid\":\"19d41999-797c-4fa3-ae74-136c56ea4026\"}"},{"__ref":"Favorites:{\"uuid\":\"7854979a-5b5b-416c-9143-2845710a820e\"}"}],"cau
