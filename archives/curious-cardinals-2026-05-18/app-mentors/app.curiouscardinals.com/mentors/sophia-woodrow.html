xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8564e3fd-3faa-4d04-b7df-f7fc735c6aca\"}":{"__typename":"Favorites","uuid":"8564e3fd-3faa-4d04-b7df-f7fc735c6aca","photoUrl":"https://ucarecdn.com/ecb85712-932f-45dc-9ec8-75e7de4fec8d/","title":"Lewis Hamilton","type":"ATHLETE"},"Favorites:{\"uuid\":\"e7832a7a-22cd-43be-adf5-e3b7eb459ea6\"}":{"__typename":"Favorites","uuid":"e7832a7a-22cd-43be-adf5-e3b7eb459ea6","photoUrl":"https://ucarecdn.com/f7dd651e-43b0-4102-a89f-dce474fa0ecc/","title":"Fearless","type":"ALBUM"},"Favorites:{\"uuid\":\"dd44eb7f-e5bb-4240-b314-9a47a24e93b8\"}":{"__typename":"Favorites","uuid":"dd44eb7f-e5bb-4240-b314-9a47a24e93b8","photoUrl":"https://ucarecdn.com/fc3260ee-fa68-49c0-af9c-812d041f177c/","title":"Pride and Prejudice","type":"BOOK"},"CausesSupported:{\"uuid\":\"5eb800ee-68bd-4904-84b2-f0a291204b8b\"}":{"__typename":"CausesSupported","uuid":"5eb800ee-68bd-4904-84b2-f0a291204b8b","name":"Pi Beta Phi Women's Fraternity","description":"\u003cp\u003eAs President, I helped lead our literacy advocacy work for a year in college.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/228ee1e4-b488-4a6c-8aa0-497130b61cdd/"},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"ef4717c6-4197-4ef6-a9cb-c4df2bf948f4\"}":{"__typename":"DeepDives","uuid":"ef4717c6-4197-4ef6-a9cb-c4df2bf948f4","content":"\u003cp\u003eMy former dream jobs were astrophysicist and fashion designer. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"78ee6d6a-97c4-40e4-9287-5ad3632b3512\"}":{"__typename":"DeepDives","uuid":"78ee6d6a-97c4-40e4-9287-5ad3632b3512","content":"\u003cp\u003eI got to bring my family to the White House as guests of President Biden during college. My dad was so proud he cried! It was one of the most rewarding days of my life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"d1d482ea-390c-478e-ad5d-d14ca2018a8d\"}":{"__typename":"DeepDives","uuid":"d1d482ea-390c-478e-ad5d-d14ca2018a8d","content":"\u003cp\u003eWhen I'm feeling down I repeat the Margaret Mead quote to myself, \"Never doubt that a small group of thoughtful, committed citizens can change the world; indeed, it's the only thing that ever has.\" It reminds me that everything we do matters and we can be the change we want to see in the world, whether through ordinary acts of kindness or through large-scale movements. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"815d0af0-e8c8-43d1-a41a-65b1a2d842fa\"}":{"__typename":"DeepDives","uuid":"815d0af0-e8c8-43d1-a41a-65b1a2d842fa","content":"\u003cp\u003eBe curious! Now is a time for trying new things and exploring what makes you inspired. Embracing the unknown and not being afraid of failure are two of the best ways you can find what you're passionate about. I firmly believe that the middle school and high school years determine the relationship we have with learning as an adult; finding things that make you curious and that ignite passion within you will help you develop a lifelong love of exploration.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"5bc96ad9-4628-4b6a-9daa-0b14c88a078b\"}":{"__typename":"School","uuid":"5bc96ad9-4628-4b6a-9daa-0b14c88a078b","name":"Centennial High School","city":"Roswell","type":"HIGH","state":"Georgia","country":"United States","zip":"30076"},"Education:{\"uuid\":\"d51118c4-c61b-4ca3-90de-88c6f120f48b\"}":{"__typename":"Education","uuid":"d51118c4-c61b-4ca3-90de-88c6f120f48b","school":{"__ref":"School:{\"uuid\":\"5bc96ad9-4628-4b6a-9daa-0b14c88a078b\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"57d8db29-186f-4292-999e-273364a7ced1\"}":{"__typename":"Education","uuid":"57d8db29-186f-4292-999e-273364a7ced1","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"International Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"d64a134c-a146-4ebd-b92d-427b4558d3b9\"}":{"__typename":"MentorPublicProfile","uuid":"d64a134c-a146-4ebd-b92d-427b4558d3b9","displayName":"Sophia W.","slug":"sophia-woodrow","biography":"\u003cp\u003eMy name is Sophia and I'm passionate about making the world a better place!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m based out of San Francisco, but I’m a southern girl at heart, having spent most of my life in Atlanta.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a student at Stanford, I studied International Relations with a concentration in Social Development and Human Well-Being. Specifically, I was interested in how the systems we put in place as a society shape our world and what we can do to change them. I was fortunate to have the opportunity to study abroad at the University of Oxford (as a former Harry Potter lover, this was a dream), where I concentrated in Political Science.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen not in class at Stanford, I spent my time working on the Political Strategy team of a non-profit led by the people who planned the 2017 Women’s March. I also got to learn all about the publishing process after collaborating on a paper that was then published in the Journal of the Association for Consumer Research (JACR).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI currently work in campaign finance and compliance, operating a handful of Political Action Committees working to elect young political candidates across the country. Since taking on this role last July, the PACs I oversee have brought in ~$1 million in revenue and in 2026, I’ll be helping manage an additional estimated $4-5 million.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI specialize in Passion Project mentoring in the social sciences and humanities, generally with students who are interested in politics, debate, history, literature (fun fact: I wrote a book in college!), law, and theater.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether you know exactly what you want your passion project to be (starting a non-profit, publishing in a literary magazine, getting a job with a campaign, etc.) or you’re still looking to find your spark, I’m here to help! I have been involved in academic and pre-professional mentoring for seven years, teaching middle and high school students debate, helping them balance school and extracurricular activities, and guiding them through the college selection and admissions process. As someone who grew up with a brother with special needs, I know what a difference individualized learning plans can make and I take a unique approach with every student I meet.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOther important facts:\u0026nbsp;\u003c/p\u003e\u003cp\u003e— I love formula one racing and can’t wait to see how the new 2026 cars perform.\u0026nbsp;\u003c/p\u003e\u003cp\u003e— In my spare time, I am frequently found working out at Equinox or cooking! My favorite thing to make is Ratatouille (exactly like in the movie).\u0026nbsp;\u003c/p\u003e\u003cp\u003e— I used to be a dancer! Ballet, jazz, and acrobatics mainly.\u0026nbsp;\u003c/p\u003e\u003cp\u003e— I love live music and have been to over 1000 concerts.\u0026nbsp;\u003c/p\u003e\u003cp\u003e— I was nationally ranked #2 in the United States on the popular gaming app “Subway Surfers” during the pandemic.\u0026nbsp;\u003c/p\u003e\u003cp\u003e— I’m a total extrovert and I can’t wait to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"6IkebTyrxX1ee7YJODBx5dRqz026niGycohINXBesEOM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI received a civil rights award for my community engagement work during the 2020 election from the Atlanta Hawks. The award highlighted people honoring Martin Luther King Jr.'s legacy; I was the youngest recipient and the Pope was the oldest. The award was presented to me at a Hawks Basketball game and I brought my parents, however I did not tell them we had suite tickets or that I would be on the jumbotron. It was both an honor to receive the award and awesomely cool to surprise my parents.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"8564e3fd-3faa-4d04-b7df-f7fc735c6aca\"}"},{"__ref":"Favorites:{\"uuid\":\"e7832a7a-22cd-43be-adf5-e3b7eb459ea6\"}"},{"__ref":"Favorites:{\"uuid\":\"dd44eb7f-e5bb-4240-b314-9a47a24e93b8\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5eb800ee-68bd-4904-84b2-f0a291204b8b\"}"}],"major":"International Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ef4717c6-4197-4ef6-a9cb-c4df2bf948f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"78ee6d6a-97c4-40e4-9287-5ad3632b3512\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1d482ea-390c-478e-ad5d-d14ca2018a8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"815d0af0-e8c8-43d1-a41a-65b1a2d842fa\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2dfd58b3-982d-4e8a-8ffa-1cb7106ea872/-/preview/-/format/jpg/","https://ucarecdn.com/ef1c0fcb-1160-4bd7-85d8-0f9cb286b38b/-/preview/-/format/jpg/","https://ucarecdn.com/4263c9ba-be34-47b5-a075-6b871adf76ef/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d51118c4-c61b-4ca3-90de-88c6f120f48b\"}"},{"__ref":"Education:{\"uuid\":\"57d8db29-186f-4292-999e-273364a7ced1\"}"}],"hiredAt":"2026-02-09T23:56:42.858Z","topics":["K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","History Project","Business / Entrepreneurship","STEM Project","Law / Government / Policy","Sustainability","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sophia-woodrow\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d64a134c-a146-4ebd-b92d-427b4558d3b9\"}"}}},"_sentryTraceData":"da784c1eb25c4168ae2d96d0dfa3b8cc-a5f619ca9980c283-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentr
