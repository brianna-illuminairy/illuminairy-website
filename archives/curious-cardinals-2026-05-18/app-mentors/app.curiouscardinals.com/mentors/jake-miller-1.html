xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"9ae8a0d6-60dc-40df-8b6e-dcbf17bbba9c\"}":{"__typename":"DeepDives","uuid":"9ae8a0d6-60dc-40df-8b6e-dcbf17bbba9c","content":"\u003cp\u003eMy greatest source of motivation is simply my life. My main goal is to live a good life now and to live a good life in the future. This means something different for every person, but for me, it boils down to being a morally good person and being able to enjoy life. This desire to live this kind of life first motivates me to work hard in school or with my friends to prepare myself for a future of success in both my career and my relationships. Secondly, this motivates me to remember to enjoy life now. For me, it is vitally important to not just strive for my goals in the future, but also appreciate and enjoy what I have already done and can do in my life now. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"62ca8e29-872a-44c2-8f2a-c0f8dc9b6eaa\"}":{"__typename":"DeepDives","uuid":"62ca8e29-872a-44c2-8f2a-c0f8dc9b6eaa","content":"\u003cp\u003eA passion project I did in the past was something completely different than what I am doing now in school. In my junior year of high school, I started getting into music outside of just what the radio played. With this, I started listening to Kendrick Lamar, mainly his album To Pimp a Butterfly. This album is widely considered one of the best rap/ hip-hop albums of all time. I had decided I wanted to delve deep into this work and spent a couple of hours a week for about a month analyzing the album and each song, learning about the elements of jazz and funk Kendrick incorporated while telling an album long story about his evolution in life, using the metaphor of a caterpillar's metamorphosis into a butterfly from start to finish. This was one of my favorite projects I was able to do in high school and it gave me an incredible appreciation for both this album and for a lot of music as a whole. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"7733a6b8-8792-49de-9d04-33393cc9109c\"}":{"__typename":"School","uuid":"7733a6b8-8792-49de-9d04-33393cc9109c","name":"Syosset High School","city":"Syosset","type":"HIGH","state":"New York","country":"United States","zip":"11791"},"Education:{\"uuid\":\"93be9caf-6230-4c00-af16-fc4c46e81d15\"}":{"__typename":"Education","uuid":"93be9caf-6230-4c00-af16-fc4c46e81d15","school":{"__ref":"School:{\"uuid\":\"7733a6b8-8792-49de-9d04-33393cc9109c\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"e3b5b814-d622-4f36-b0dd-6ba582eb9683\"}":{"__typename":"Education","uuid":"e3b5b814-d622-4f36-b0dd-6ba582eb9683","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"ae7d5819-2e0a-4e63-bdc5-b3737e95ce9e\"}":{"__typename":"MentorPublicProfile","uuid":"ae7d5819-2e0a-4e63-bdc5-b3737e95ce9e","displayName":"Jake M.","slug":"jake-miller-1","biography":"\u003cp\u003eHi, my name is Jake Miller and I am a student at Northwestern. Coming into university, I didn't have any idea about what I wanted to pursue for my career. I had always been good with numbers and math but had never found something I was surely set on. Here I am, a year and a half later, as a Data Science major, to which you are all probably thinking, \"He figured out what he wanted to do!\" Well, you all would be mistaken, as I barely know more than I knew at the start of college. However, what I do know is that I enjoy working with data and using data to find solutions to problems. More so, I've learned that not knowing what I want my future career to be is okay. Currently, I am applying for internships all across the job spectrum, looking at sports companies, music companies, mortgage businesses, and even health insurance agencies \u003cbr\u003e\u003cbr\u003eOutside of academics, I enjoy what a lot of people tend to enjoy. I love hanging out with friends, playing soccer and basketball, and I am a huge sports fan of the New York Knicks and Giants. I am also in a couple of clubs, my favorite being the Sports Analytics club where I get to use data and help write articles on various sports topics. I also happen to love food, so whether I end up working with you or not, if anyone ever finds themselves in Chicago I would love to offer some of my favorite food recommendations. Some other hobbies of mine include watching TV(recently watching Young Sheldon) and listening to music(my favorite artist is Kendrick Lamar).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStarting my career at Curious Cardinals I am very excited to teach a variety of students with different areas of study. In the classroom, I'd be excited to teach in most areas of math, but outside of the classroom, I would love to delve into topics like Sports Analytics or something like analyzing and writing about popular shows and movies. I think that breaking down popular forms of media such as sports, movies, or music makes each thing even more enjoyable to experience, and something that I thoroughly enjoy doing. \u003c/p\u003e","teachingVideoPlaybackId":"01vtIPF6z3KUCYYVcvvM4Lpm5HrbJQ01tWBHU01eFon3Fo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9ae8a0d6-60dc-40df-8b6e-dcbf17bbba9c\"}"},{"__ref":"DeepDives:{\"uuid\":\"62ca8e29-872a-44c2-8f2a-c0f8dc9b6eaa\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bebdf271-9484-4941-b990-f298bf1aa8e5/-/preview/-/format/jpg/","https://ucarecdn.com/54617861-e169-4f75-a8d9-585000a86309/-/preview/-/format/jpg/","https://ucarecdn.com/bcbc851f-c4ed-4038-a9af-654a922de03c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"93be9caf-6230-4c00-af16-fc4c46e81d15\"}"},{"__ref":"Education:{\"uuid\":\"e3b5b814-d622-4f36-b0dd-6ba582eb9683\"}"}],"hiredAt":"2024-01-10T21:06:04.146Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jake-miller-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ae7d5819-2e0a-4e63-bdc5-b3737e95ce9e\"}"}}},"_sentryTraceData":"3102500f08224af390aa26b001bb8d75-b788c791c8edb7bf-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3102500f08224af390aa26b001bb8d75,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jake-miller-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id
