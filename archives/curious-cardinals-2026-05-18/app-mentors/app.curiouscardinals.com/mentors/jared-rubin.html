-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"c84b70c3-6de5-4b17-9a14-ea5f6cae88b0\"}":{"__typename":"MentorPublicProfile","uuid":"c84b70c3-6de5-4b17-9a14-ea5f6cae88b0","displayName":"Jared R.","slug":"jared-rubin","biography":"\u003cp\u003eHey there! My name is Jared, and I am a second year medical student at the University of Illinois in Chicago. I am originally from Los Angeles and attended Northwestern University in undergrad, where I majored in Neuroscience and minored in Psychology. Despite my many classes learning about the biochemical and social functions of the brain, I am actually very interested in the field of sports medicine. In undergrad, I was an athletic training aide for the Northwestern Football team. In this role, I attended practices and helped players through injury prevention and recovery alongside the athletic trainers. This experience sparked my interest in sports medicine, ultimately guiding my path towards the pursuit of becoming an orthopedic surgeon. Now in medical school, I am the Vice President of the Orthopedic Surgery Interest Group and the Shadowing Coordinator for the Student Surgical Society. From conducting research on knee replacements, rounding in the orthopedic outpatient clinic, and scrubbing in for surgical cases, I am following my dream of one day becoming an orthopedic surgeon!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn terms of experience, I have been a tutor for over two years now, helping students primarily in science courses (chemistry, biology, physics). Not only did I take the AP courses while in high school, but I also continue to study such courses at Northwestern and in medical school. Along with being a tutor, I have served multiple teaching assistant roles throughout the years. As a high school senior, I was a TA for an honors chemistry course, helping students learn the material and being able to teach some topics on my own! During my gap year between undergrad and medical school, I was a City Year volunteer, in which I dedicated a year to being a TA for an underserved elementary school in Los Angeles. I volunteered with a 5th grade class, helping students with math and English language arts. Finally, as a current medical student, I am a peer mentor for undergraduate students who also attend UIC and are interested in pursuing medicine. I meet with them monthly to answer any questions they may have and give advice on getting into medical school.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhether helping explain difficult concepts in various science courses, providing tips on crushing the science section of the ACT, or building a passion project to pursue (ex. breaking down orthopedic surgery cases from initial patient presentation to imaging to assessment and plan), I would love to be able to help out in any way I can! I look forward to meeting and working with you!\u003c/p\u003e","teachingVideoPlaybackId":"yCZjReWvGbH4ERychApTa54P6uoB2Czf1JcvEVMKIXM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething that I am really proud of is getting into medical school! Ever since first discovering my passion for science in my middle school “parts of the cell” project, I always dreamed of being involved in the field of medicine. As I continued to take more science courses, shadow physicians, and partake in other extracurriculars surrounding medicine, I was deeply convinced it was the field I was meant to be in. Now having finished my first year of medical school, I am very proud of myself to see how far I have come. What was once a faraway dream has now become my reality and I am so excited to keep pursing my goal of becoming a doctor!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"1a7ecf3f-9ce3-4015-974b-40a13d5d5c01\"}"},{"__ref":"Favorites:{\"uuid\":\"a295bdbc-52d4-41e7-a9d5-3d14932f0b04
