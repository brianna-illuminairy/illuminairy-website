xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"de775bf7-3b63-4299-99df-1d7dd4d70926\"}":{"__typename":"Favorites","uuid":"de775bf7-3b63-4299-99df-1d7dd4d70926","photoUrl":"https://ucarecdn.com/780638d3-bfd9-49fd-aab1-377b0d79a210/","title":"Blue by Joni Mitchell","type":"ALBUM"},"Favorites:{\"uuid\":\"3ce9c1e5-cb8b-47a7-8d05-5fa6b4066288\"}":{"__typename":"Favorites","uuid":"3ce9c1e5-cb8b-47a7-8d05-5fa6b4066288","photoUrl":"https://ucarecdn.com/a6ab4334-cec9-4e7e-94aa-aa88f87d6e7a/","title":"The Sun Also Rises by Hemingway","type":"BOOK"},"Favorites:{\"uuid\":\"1bd72e54-18ed-44f8-afad-2d102383307c\"}":{"__typename":"Favorites","uuid":"1bd72e54-18ed-44f8-afad-2d102383307c","photoUrl":"https://ucarecdn.com/8c6980a3-958e-4423-b356-2ce831ad8547/","title":"Shawshank Redemption","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"86102e02-f403-4008-b3b0-b9afb9e517b1\"}":{"__typename":"DeepDives","uuid":"86102e02-f403-4008-b3b0-b9afb9e517b1","content":"\u003cp\u003eBuy in and be engaged! No matter where you are, who you are with, what you are doing, I promise that you will glean more from the experience if you dive in head first and offer your full self at all times. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"87e89cf7-dccc-4096-9616-9a4caa720344\"}":{"__typename":"DeepDives","uuid":"87e89cf7-dccc-4096-9616-9a4caa720344","content":"\u003cp\u003eI initially entered college expecting to concentrate in government, but I quickly realized that my academic interests were much broader. This led me to Social Studies department, which is an interdisciplinary concentration that spans five different fields (government, economics, history, anthropology, ad sociology). This was the perfect concentration for me, allowing me to explore my academic interests from many different disciplinary approaches and perspectives. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"88f6459b-24b7-415f-b307-94bbac5d8b2e\"}":{"__typename":"DeepDives","uuid":"88f6459b-24b7-415f-b307-94bbac5d8b2e","content":"\u003cp\u003eIn high school, I spent every summer attending music festivals and competitions around the world. I studied with world-renown pedagogues, performed in legendary concert halls, and most importantly, met so many of my closest friends who shared my passion and drive for music through these summer opportunities. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"179eb42b-0d58-4b28-a2d4-6182bb4cb395\"}":{"__typename":"DeepDives","uuid":"179eb42b-0d58-4b28-a2d4-6182bb4cb395","content":"\u003cp\u003eI am extremely passionate about accessible, high-quality music education. In 2020, the pandemic halted many arts education programs. Seeing the immense need for virtual, accessible education, my friends and I founded a virtual learning platform called Through the Staff that pairs 2nd-12th graders with college-aged music students for private instrument lessons.\u0026nbsp;The current admin team of Through the Staff has grown to four times its original size, with volunteers who work weekly to manage operations and connect students to our services. Since 2020, TTS\u0026nbsp;has provided 12,000+ lessons to 350+ students! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"3986bfb4-bb1a-45a5-a75e-9f1949a670e5\"}":{"__typename":"School","uuid":"3986bfb4-bb1a-45a5-a75e-9f1949a670e5","name":"Midway High School","city":"Waco","type":"HIGH","state":"Texas","country":"United States","zip":"76712"},"Education:{\"uuid\":\"7dca1655-4c6e-4fc7-8074-a485da158fde\"}":{"__typename":"Education","uuid":"7dca1655-4c6e-4fc7-8074-a485da158fde","school":{"__ref":"School:{\"uuid\":\"3986bfb4-bb1a-45a5-a75e-9f1949a670e5\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"f7236b1f-22c0-4363-9c9a-20d779d690f8\"}":{"__typename":"Education","uuid":"f7236b1f-22c0-4363-9c9a-20d779d690f8","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Social Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"94383a9e-c01f-43b5-846d-ddb681177296\"}":{"__typename":"MentorPublicProfile","uuid":"94383a9e-c01f-43b5-846d-ddb681177296","displayName":"Haeun M.","slug":"haeun-moon","biography":"\u003cp\u003eHi! My name is Haeun Moon, and I’m excited to introduce myself to you. I am a recent graduate of Harvard College, where I graduated with honors with a concentration in Social Studies, a secondary in Philosophy, and a citation in Spanish. I work as an Arts Consultant in Cambridge.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy intellectual curiosities have been fueled by my identity and background. As a Korean immigrant who grew up in Texas, human rights and immigration issues have been constant themes in my thoughts. The human rights violations by the North Korean government sparked my interest in why people sharing the same language, history, and culture were divided by an arbitrary line. This led to a deep interest in human rights, spanning from detained immigrants at the southern border of the United States to Afghan refugees. Who is guaranteed protection, and how can we safeguard those who aren’t protected by the system? At Harvard, my course load reflected my passion for these fundamental questions, as well as other intellectual interests in philosophy. These courses covered human rights discourse, international law and institutions, Korean history, modern social and political theory, ethnic studies, American foreign policy, and comparative politics.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my academic pursuits, I dedicate most of my time to music, both playing and listening. As a lifelong violinist, I understand and interact with the world through music. I have performed globally, from Carnegie Hall in NYC to the Concertgebouw in Amsterdam and the National Centre for the Performing Arts in Beijing. In college, I was the concertmaster of the Harvard Radcliffe Orchestra and served on the student-led administrative board.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am passionate about mentorship and teaching, having dedicated much of my time to teaching and mentoring both peers and younger students in high school and college. I have tutored standardized tests, including the SAT, ACT, and AP tests, taught violin, and worked as a peer tutor for many economics and political science courses at Harvard. In my junior year of college, I served as the Vice President of HACIA, running the largest and most diverse OAS simulation conference in the world and leading conversations among high school students from across the Americas.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am starting law school in the fall of 2026. In the long term, I aim to pursue a career in immigration law, directly serving disadvantaged members of our communities while advocating for more fundamental systemic changes. I am continually reminded that we all share a common future, and I want to help shape a hopeful future that embraces more and more people.\u003c/p\u003e","teachingVideoPlaybackId":"zaczh1bGWKfcwoJrj00ulOeTzhoa5X9ssHlKy4v00N5FU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"de775bf7-3b63-4299-99df-1d7dd4d70926\"}"},{"__ref":"Favorites:{\"uuid\":\"3ce9c1e5-cb8b-47a7-8d05-5fa6b4066288\"}"},{"__ref":"Favorites:{\"uuid\":\"1bd72e54-18ed-44f8-afad-2d102383307c\"}"}],"causesSupported":[],"major":"Social Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"86102e02-f403-4008-b3b0-b9afb9e517b1\"}"},{"__ref":"DeepDives:{\"uuid\":\"87e89cf7-dccc-4096-9616-9a4caa720344\"}"},{"__ref":"DeepDives:{\"uuid\":\"88f6459b-24b7-415f-b307-94bbac5d8b2e\"}"},{"__ref":"DeepDives:{\"uuid\":\"179eb42b-0d58-4b28-a2d4-6182bb4cb395\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/65ae6c79-7918-4431-b2b8-33b9f7969849/-/preview/-/format/jpg/","https://ucarecdn.com/3899d827-de28-410a-b572-2011f841e69d/-/preview/-/format/jpg/","https://ucarecdn.com/d3ba65ad-14fd-4065-9781-4bae07bc7b05/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7dca1655-4c6e-4fc7-8074-a485da158fde\"}"},{"__ref":"Education:{\"uuid\":\"f7
