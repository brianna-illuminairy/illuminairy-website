 \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"97ffecfc-972f-4cf5-a2e6-6bdd964f15a4\"}":{"__typename":"DeepDives","uuid":"97ffecfc-972f-4cf5-a2e6-6bdd964f15a4","content":"\u003cp\u003eI hope to become a professor so I can help the new generation of scientists be true to themselves, do good science, and do good in the world. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4d95a94a-2813-4727-93d6-d20cd542f985\"}":{"__typename":"DeepDives","uuid":"4d95a94a-2813-4727-93d6-d20cd542f985","content":"\u003cp\u003eI love deconstructing things and building them better than they were! In bioengineering, I take biological processes and engineer them to be better or more effective. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"237b6728-849a-4a26-b2f2-fef591fb0879\"}":{"__typename":"School","uuid":"237b6728-849a-4a26-b2f2-fef591fb0879","name":"Connelly School of the Holy Child","city":"Potomac","type":"HIGH","state":"Maryland","country":"United States","zip":"20854"},"Education:{\"uuid\":\"79148999-b845-4933-abf1-bf2762bac0c5\"}":{"__typename":"Education","uuid":"79148999-b845-4933-abf1-bf2762bac0c5","school":{"__ref":"School:{\"uuid\":\"237b6728-849a-4a26-b2f2-fef591fb0879\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"79610151-3e0d-4077-a82a-
