xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"12602742-24a3-4645-96f9-3ecdc9ef6655\"}":{"__typename":"DeepDives","uuid":"12602742-24a3-4645-96f9-3ecdc9ef6655","content":"\u003cp\u003eIt always fascinated me how most coding could be done without buying anything or possessing advanced machinery. It is cool -- creating something outstanding and unique without even leaving the house!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"1981027a-df38-44d5-aadc-6a13cedb2f62\"}":{"__typename":"DeepDives","uuid":"1981027a-df38-44d5-aadc-6a13cedb2f62","content":"\u003cp\u003eMy real dream would be to become a tech lead. I would love to contribute to the team of engineers working on something I proposed or suggested\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"058cbc6c-9b10-4e2d-bda6-8320e4a6a580\"}":{"__typename":"DeepDives","uuid":"058cbc6c-9b10-4e2d-bda6-8320e4a6a580","content":"\u003cp\u003eThe best way to learn something is to teach others. I believe mentorship would not only help me share my skills and perspective, but also teach me something I lack.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"55ce4ce1-f1ae-49c6-be9a-e7ceadffcca4\"}":{"__typename":"DeepDives","uuid":"55ce4ce1-f1ae-49c6-be9a-e7ceadffcca4","content":"\u003cp\u003eBe yourself and never give up! Real accomplishment never come without a challenge, so it's important to persist and remain focused.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"0a90646e-94c9-4f38-8713-713023fa428b\"}":{"__typename":"School","uuid":"0a90646e-94c9-4f38-8713-713023fa428b","name":"Lomonosov Boarding School","city":"Ramenskoye","type":"HIGH","state":"Moscow","country":"Russia","zip":"140125"},"Education:{\"uuid\":\"0b23cc75-5a57-4e81-84e4-4cd02608c3cb\"}":{"__typename":"Education","uuid":"0b23cc75-5a57-4e81-84e4-4cd02608c3cb","school":{"__ref":"School:{\"uuid\":\"0a90646e-94c9-4f38-8713-713023fa428b\"}"},"startYear":"2013","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"d688e208-638e-48cb-8dbd-3d28c5adec1f\"}":{"__typename":"Education","uuid":"d688e208-638e-48cb-8dbd-3d28c5adec1f","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"d3d8d7b8-5141-4d58-9abb-73c70f13d49e\"}":{"__typename":"MentorPublicProfile","uuid":"d3d8d7b8-5141-4d58-9abb-73c70f13d49e","displayName":"Arthur R.","slug":"arthur-roshal","biography":"\u003cp\u003eHello! I’m Arthur -- an undergraduate student at Columbia Engineering pursuing a BS in Computer Science with a minor in Electrical Engineering. My professional interests lie at the intersection of software engineering, systems programming, and computational problem-solving, and I love helping students build both technical skills and confidence in their learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond completing rigorous coursework at Columbia, I’ve built real-world technical projects that demonstrate creativity and persistence. In particular, I have conducted plasma physics research through the Columbia Physics Scholars Program, built a multifunctional Telegram bot, and developed several other coding projects -- including a fully functional chess application. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcross my projects and coursework, I have implemented data structures and algorithms to solve real-life engineering challenges, reinforcing my ability to design efficient solutions. My technical background includes Java, Python, C, Bash, Linux/Unix environments, Git, and web technologies, and I am comfortable learning new tools quickly by self-learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor to your child, I promise to make academic learning engaging, structured, and motivating. We will focus on building deep understanding rather than memorization, ensuring that students not only perform well academically but also develop strong problem-solving skills and intellectual independence. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether a student is struggling with foundational concepts or looking to go beyond their school curriculum, I adapt my teaching style to match their goals, personality, and background.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere is a widespread stereotype that engineers struggle to teach concepts in an accessible way — my experience in tutoring and mentoring students proves the opposite. We will grasp complex ideas through intuitive explanations, encourage curiosity, and I'll help students feel comfortable asking questions and making mistakes as part of the learning process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eChoosing a life path and staying committed to it is never easy, especially for young people. My goal is not only to teach academic material, but also to support students in building confidence, discipline, and a growth mindset. I believe we can make progress -- and build meaningful skills -- together. I also believe that I have a lot of relevant skills and experience that I must share.\u003cbr\u003e\u003cbr\u003e--------------------------------------\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of professional area, I enjoy playing chess, reading adventure books, and working out. I also love strolling around NYC and discovering its gems\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"4QuBlBPQEGSjWKOjgGKlssxICWZl796djZmzNt2fXsI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"12602742-24a3-4645-96f9-3ecdc9ef6655\"}"},{"__ref":"DeepDives:{\"uuid\":\"1981027a-df38-44d5-aadc-6a13cedb2f62\"}"},{"__ref":"DeepDives:{\"uuid\":\"058cbc6c-9b10-4e2d-bda6-8320e4a6a580\"}"},{"__ref":"DeepDives:{\"uuid\":\"55ce4ce1-f1ae-49c6-be9a-e7ceadffcca4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4410b26c-0b0f-4d67-8d25-790117da7381/-/preview/-/format/jpg/","https://ucarecdn.com/52056d27-da1e-4208-abe6-b5d65d626c96/-/preview/-/format/jpg/","https://ucarecdn.com/ad70d758-5319-4239-ab5b-0a2e8ec455b7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0b23cc75-5a57-4e81-84e4-4cd02608c3cb\"}"},{"__ref":"Education:{\"uuid\":\"d688e208-638e-48cb-8dbd-3d28c5adec1f\"}"}],"hiredAt":"2
