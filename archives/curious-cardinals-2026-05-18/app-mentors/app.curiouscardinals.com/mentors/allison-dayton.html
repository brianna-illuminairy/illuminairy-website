:\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a9d70da2-fa1e-4395-9315-8bfeaed5273e\"}":{"__typename":"DeepDives","uuid":"a9d70da2-fa1e-4395-9315-8bfeaed5273e","content":"\u003cp\u003eIn my spare time, I love to learn languages, listen to music, play piano, read, bake, and do deep dives on niche topics for hours.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"70bd76cb-8e46-4107-a435-bfea8606f133\"}":{"__typename":"DeepDives","uuid":"70bd76cb-8e46-4107-a435-bfea8606f133","content":"\u003cp\u003eMy dream job is in educational technology with a company that focuses on utilizing AI to provide student-centered teaching services.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"61db2298-21d2-4971-891c-cfb258c6b255\"}":{"__typename":"DeepDives","uuid":"61db2298-21d2-4971-891c-cfb258c6b255","content":"\u003cp\u003eThe advice I would give my high school self is that it is okay to fail. Failure is uncomfortable but through even small failures, we learn invaluable information about ourselves, others and the world around us.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"f8d98bb0-9141-40fe-bda3-b44df6db4b35\"}":{"__typename":"School","uuid":"f8d98bb0-9141-40fe-bda3-b44df6db4b35","name":"Palo Alto High School","city":"Palo Alto","type":"HIGH","state":"California","country":"United States","zip":"94301"},"Education:{\"uuid\":\"668537ad-7215-4025-84a1-bbd9ea70df21\"}":{"__typename":"Education","uuid":"668537ad-7215-4025-84a1-bbd9ea70df21","school":{"__ref":"School:{\"uuid\":\"f8d98bb0-9141-40fe-bda3-b44df6db4b35\"}"},"startYear":"2021","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"486216be-5657-4ed5-8546-56e0c936a0b5\"}":{"__typename":"Education","uuid":"486216be-5657-4ed5-8546-56e0c936a0b5","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Statistics and Machine Learning","degree":null},"MentorPublicProfile:{\"uuid\":\"9dea99b6-43c9-4e14-a23a-0c45db1a3281\"}":{"__typename":"MentorPublicProfile","uuid":"9dea99b6-43c9-4e14-a23a-0c45db1a3281","displayName":"Allison D.","slug":"allison-dayton","biography":"\u003cp\u003eHello! My name is Allison! I am currently a student at Carnegie Mellon University studying statistics and machine learning. I am originally from the Bay Area and have been living in Pittsburgh for a year. I have two years of experience privately tutoring students from elementary to high school. I was also the head of the peer tutoring program at my high school for two years. Through this experience, I have become highly proficient in teaching test prep, algebra, biology, and English. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also studied abroad in Seoul, South Korea through NSLI-Y for three months during an intensive language acquisition program. This experience tied into my passion projects - international language learning organizations focused on providing accessible language tutoring for students across the world. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would love to chat about any of these processes and procedures!\u003c/p\u003e","teachingVideoPlaybackId":"AR02iV2mvAyLrLf2H802Q8f49skHdv6FdQId80202JmqQD00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am very proud of my accomplishments throughout high school. Throughout high school I maintained a healthy social life while doing well academically, working part-time, attending community college, volunteering, and participating in leadership roles in 4+ international student organizations.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"bc101267-7847-47aa-9b2e-eca9fca7d7ff\"}"},{"__ref":"Favorites:{\"uuid\":\"2823cff2-a34c-4cbd-8e3f-c04e837314b9\"}"},{"__ref":"Favorites:{\"uuid\":\"af0ed0b5-8769-4936-adf8-f8c976be5578\"}"}],"causesSupported":[],"major":"Statistics and Machine Learning","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1ce21a15-38a5-4e41-b2c4-580aa2bb036a\"}"},{"__ref":"DeepDives:{\"uuid\":\"a9d70da2-fa1e-4395-9315-8bfeaed5273e\"}"},{"__ref":"DeepDives:{\"uuid\":\"70bd76cb-8e46-4107-a435-bfea8606f133\"}"},{"__ref":"DeepDives:{\"uuid\":\"61db2298-21d2-4971-891c-cfb258c6b255\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/14a4aebd-6093-4ac3-a9f0-4a9ff58f9e2f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"668537ad-7215-4025-84a1-bbd9ea70df21\"}"},{"__ref":"Education:{\"uuid\":\"486216be-5657-4ed5-8546-56e0c936a0b5\"}"}],"hiredAt":"2024-02-04T23:17:16.967Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Statistics","Geometry","6-8 Grade Science","Biology","Writing","Academic Coaching","Executive Function","Reading","Computer Science"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f
