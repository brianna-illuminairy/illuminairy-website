xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b357598d-761b-47cb-ba94-7cc93401f6e4\"}":{"__typename":"DeepDives","uuid":"b357598d-761b-47cb-ba94-7cc93401f6e4","content":"\u003cp\u003eI chose to major in finance because it is at the core of how businesses operate, and understanding it opens up a wide range of opportunities to make impactful decisions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"1fc0927a-917b-4bc3-8f16-f3aba20a1bcf\"}":{"__typename":"DeepDives","uuid":"1fc0927a-917b-4bc3-8f16-f3aba20a1bcf","content":"\u003cp\u003eMentoring allows me to offer knowledge and support to someone on their journey, which is incredibly rewarding. The process is also a two-way street; while helping others grow, I learn and grow myself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"8ab2867a-6bed-4fe4-a4ee-290dc052b1a5\"}":{"__typename":"DeepDives","uuid":"8ab2867a-6bed-4fe4-a4ee-290dc052b1a5","content":"\u003cp\u003eI grew up attending sleepaway camp in the summers. I absolutely loved camp and credit it for teaching me how to connect with different types of people. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7dfa3b4d-4ce2-4887-876d-e687bb07301e\"}":{"__typename":"DeepDives","uuid":"7dfa3b4d-4ce2-4887-876d-e687bb07301e","content":"\u003cp\u003eMy favorite way to wind down after a long day is reading. My current favorite is The Nightingale by Kristen Hannah.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"16a9551d-6330-4d29-80ba-d3df9e8d38db\"}":{"__typename":"School","uuid":"16a9551d-6330-4d29-80ba-d3df9e8d38db","name":"William Penn Charter School","city":"Philadelphia","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19144"},"Education:{\"uuid\":\"9cbda39c-9c8a-4095-be7f-bacb41af9ad8\"}":{"__typename":"Education","uuid":"9cbda39c-9c8a-4095-be7f-bacb41af9ad8","school":{"__ref":"School:{\"uuid\":\"16a9551d-6330-4d29-80ba-d3df9e8d38db\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"251d314c-d662-4ec6-a843-797296c5bdbb\"}":{"__typename":"School","uuid":"251d314c-d662-4ec6-a843-797296c5bdbb","name":"Emory University","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30322"},"Education:{\"uuid\":\"3e2c1a51-b898-4393-9c7b-4681b7038ec7\"}":{"__typename":"Education","uuid":"3e2c1a51-b898-4393-9c7b-4681b7038ec7","school":{"__ref":"School:{\"uuid\":\"251d314c-d662-4ec6-a843-797296c5bdbb\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Finance","degree":null},"MentorPublicProfile:{\"uuid\":\"d0de8aa5-ae34-4cc0-b86d-a2614524628c\"}":{"__typename":"MentorPublicProfile","uuid":"d0de8aa5-ae34-4cc0-b86d-a2614524628c","displayName":"Jessica W.","slug":"jessica-wolfe","biography":"\u003cp\u003eHi, I'm Jess! I'm a junior at Emory University studying Finance and AI with a minor in Entrepreneurship. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eI attended a Quaker high school in Philadelphia, which I credit for instilling my commitment to social impact. During my junior and senior years, I worked on a capstone project exploring the complex relationship between Adverse Childhood Experiences (ACEs), poverty, and crime in inner-city Philadelphia. When my research concluded, I published a report proposing policy changes and potential solutions to address these systemic issues.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a sophomore in high school, I spent a semester studying in Israel, where I was struck by the coexistence of spiritual traditions and innovative technology. This experience sparked my interest in how technology evolves over time and creates new sectors and industries.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI began college at Columbia University where I studied in their dual-degree program with the Jewish Theological Seminary. I then took a gap year to pursue an opportunity working with a technology startup at the Wharton Neuroscience Initiative at Penn. My role involved analyzing data to determine whether there was brain synchrony among romantic partners (spoiler alert: there was!).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFollowing my year of research at Penn, I transferred to Emory University. At Emory, I'm actively involved in Goizueta Women in Finance (GWiF) and the Goizueta Art Market Guild (GAMG). In GAMG, I lead outreach efforts to facilitate partnerships and events with local and national artists, galleries, and other on-campus groups.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school and work, I love to read, play tennis, ski, and travel. I stay informed through podcasts like Prof G and Pivot, which keep me connected to the latest trends in business, technology, and culture.\u003c/p\u003e","teachingVideoPlaybackId":"i01VwCUrSMFDltSNfjDtHsZn01drBMbnUcD7RLa9UzBGo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Finance","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b357598d-761b-47cb-ba94-7cc93401f6e4\"}"},{"__ref":"DeepDives:{\"uuid\":\"1fc0927a-917b-4bc3-8f16-f3aba20a1bcf\"}"},{"__ref":"DeepDives:{\"uuid\":\"8ab2867a-6bed-4fe4-a4ee-290dc052b1a5\"}"},{"__ref":"DeepDives:{\"uuid\":\"7dfa3b4d-4ce2-4887-876d-e687bb07301e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/941acf6c-5087-403a-9b73-6c4fb3ebcb08/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9cbda39c-9c8a-4095-be7f-bacb41af9ad8\"}"},{"__ref":"Education:{\"uuid\":\"3e2c1a51-b898-4393-9c7b-4681b7038ec7\"}"}],"hiredAt":"2024-08-29T19:06:21.619Z","topics":["Machine Learning / AI","Coding / Programming","Business / Entrepreneurship"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jessica-wolfe\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d0de8aa5-ae34-4cc0-b86d-a2614524628c\"}"}}},"_sentryTraceData":"4624c17331284334b29d76daaa84b650-8e47448b9f9319d9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4624c17331284334b29d76daaa84b650,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jessica-wolfe"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","stra
