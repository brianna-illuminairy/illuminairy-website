xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"a0fd7821-51a5-4a4f-81bc-94a04fbcc274\"}":{"__typename":"DeepDives","uuid":"a0fd7821-51a5-4a4f-81bc-94a04fbcc274","content":"\u003cp\u003eOne of the most enriching experiences of my academic journey was spending a year in Paris during my gap year, where I immersed myself in the culture and language. As a result, I am fluent in French, which has opened doors to cross-cultural exchanges and expanded my worldview.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"41d14a0b-caff-493d-b526-7c3d8511cad5\"}":{"__typename":"DeepDives","uuid":"41d14a0b-caff-493d-b526-7c3d8511cad5","content":"\u003cp\u003eDuring my senior year of high school, I worked for a historically African American newspaper in my hometown, The New Pittsburgh Courier. I was an intern and junior writer, and I wrote weekly articles. At my high school, I also created a newsletter called \u003cem\u003eVoices for minority students, \u003c/em\u003ewhom our official school newspaper had vastly marginalized. Instead of traditional reporting, the newsletter served as a creative outlet for underprivileged students. As I was promoting the newsletter in my school, I discovered dozens of personal essays, artwork, and poems that displayed the interconnectivity of students’ experiences along with the isolation they felt as students of color.\u0026nbsp;I read the powerful words of these students: their joys, disappointments, and struggles. By presenting these works in a comprehensive, visual way, the shared experiences shown in writing and art founded relationships between students, who, until newsletter’s release had not known of the similarity of their struggles\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"09707939-a767-4b7a-98ba-c089c09a4a1a\"}":{"__typename":"DeepDives","uuid":"09707939-a767-4b7a-98ba-c089c09a4a1a","content":"\u003cp\u003eMy mom, a federal public defender, is my greatest mentor. Her dedication to the law and reforming the criminal justice system has taught me the importance of justice and compassion. Additionally, her service in the Peace Corps has shown me the value of global citizenship and empathy towards others. Through her example, I've learned the importance of advocacy, empathy, and selflessness in making a positive impact on the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9d82b419-b9ee-498a-a8d0-e58fd84f189b\"}":{"__typename":"DeepDives","uuid":"9d82b419-b9ee-498a-a8d0-e58fd84f189b","content":"\u003cp\u003eIn my spare time, I love to read, listen to music, and go on walks with my lovely housemates (four of whom are CC tutors)! I love exploring all of the amazing food spots in New Haven. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"04b4ad85-8500-4fc2-924f-868bbd82b434\"}":{"__typename":"School","uuid":"04b4ad85-8500-4fc2-924f-868bbd82b434","name":"Taylor Allderdice High School","city":"Pittsburgh","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"15217"},"Education:{\"uuid\":\"afb37d67-aad4-4d0e-b530-40453b59c91d\"}":{"__typename":"Education","uuid":"afb37d67-aad4-4d0e-b530-40453b59c91d","school":{"__ref":"School:{\"uuid\":\"04b4ad85-8500-4fc2-924f-868bbd82b434\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"736b8e17-d697-4710-bace-46115841ef5d\"}":{"__typename":"Education","uuid":"736b8e17-d697-4710-bace-46115841ef5d","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"History of Science, Medicine, and Public Health/Statistics and Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"97b8a1c9-ce41-4bec-9083-8bffb479a181\"}":{"__typename":"MentorPublicProfile","uuid":"97b8a1c9-ce41-4bec-9083-8bffb479a181","displayName":"Gianna G.","slug":"gianna-griffin","biography":"\u003cp\u003eHello everyone! My name is Gianna, and I'm thrilled to share a bit about myself with you. Currently, I'm a first-year Master of Public Health candidate at the Yale School of Public Health (YSPH), enrolled in the B.A./M.P.H. program with a concentration in Health Policy. Alongside my graduate studies, I'm also completing my senior year at Yale University, majoring in the History of Science, Medicine, and Public Health, and I hold a Statistics and Data Science certificate.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was born in Washington, D.C., but much of my childhood was spent on Saipan, CNMI, a beautiful island in the Pacific Ocean. Later, I moved to Pittsburgh, PA, where I completed my high school education. It was during my time in high school that I discovered my passion for social justice and advocacy movements, which ultimately influenced my academic and extracurricular pursuits.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, I've been actively involved in various initiatives aimed at addressing health inequities. I volunteer at Yale-New Haven Hospital, where I contribute to community health projects and gain valuable hands-on experience. Additionally, I'm engaged in bioethics research, exploring the ethical dimensions of public health policies and interventions.Beyond my academic commitments, I've been deeply involved in extracurricular activities that align with my interests. I proudly served as the captain of the Yale Women's Club Soccer team, where I honed my leadership skills. As a writer and editor for an undergraduate health review, I've had the opportunity to explore pressing health issues and communicate them effectively to a broader audience. Furthermore, I've had the privilege of serving as a teaching assistant in an undergraduate statistics and data science course.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThank you for taking the time to learn a bit about me! \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History of Science, Medicine, and Public Health/Statistics and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a0fd7821-51a5-4a4f-81bc-94a04fbcc274\"}"},{"__ref":"DeepDives:{\"uuid\":\"41d14a0b-caff-493d-b526-7c3d8511cad5\"}"},{"__ref":"DeepDives:{\"uuid\":\"09707939-a767-4b7a-98ba-c089c09a4a1a\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d82b419-b9ee-498a-a8d0-e58fd84f189b\"}"}],"active":true,
