xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"16b321de-0abf-4621-a823-1f2f0d2c090e\"}":{"__typename":"DeepDives","uuid":"16b321de-0abf-4621-a823-1f2f0d2c090e","content":"\u003cp\u003eTrust yourself and dig deep into your passions! As you lean into what you like to do, you will find your way through career and life. Those hobbies will ground you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"243aae78-a067-4377-a733-67e1dd37db6f\"}":{"__typename":"DeepDives","uuid":"243aae78-a067-4377-a733-67e1dd37db6f","content":"\u003cp\u003eI have been always so lucky to be surrounded by coaches, teachers, and peers that inspire me to do better everyday. I respect my own mentors so greatly because they have been so grounding in times of uncertainty and searching in my own life while carrying themselves in their own lives so well. If I can give my 2 cents and spread the knowledge that I have accumulated to become even a fraction of what my own mentors meant to me for someone else, that would be the best way to appreciate my own mentors.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f9c50ee7-7ff0-4e63-aaed-de0959b02e4a\"}":{"__typename":"DeepDives","uuid":"f9c50ee7-7ff0-4e63-aaed-de0959b02e4a","content":"\u003cp\u003eMy dream job would be to create something I can see with my own eyes and touch with my own hands and that can create a better life for someone else. I want to put to use my knowledge of structural mechanics to make a safer and serviceable structure on a building, car, plane, or device. My dream job would consist of hard days and rewarding times, of great people I learn from everyday, and a product I would be proud to share with my mentors, family, and friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"e9a9134f-acc8-4714-9395-43a2e8650aa0\"}":{"__typename":"School","uuid":"e9a9134f-acc8-4714-9395-43a2e8650aa0","name":"Naperville North High School","city":"Naperville","type":"HIGH","state":"Illinois","country":"United States","zip":"60563"},"Education:{\"uuid\":\"240d3fff-b816-4000-8045-4531eefbb468\"}":{"__typename":"Education","uuid":"240d3fff-b816-4000-8045-4531eefbb468","school":{"__ref":"School:{\"uuid\":\"e9a9134f-acc8-4714-9395-43a2e8650aa0\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}":{"__typename":"School","uuid":"dff4a26a-20c2-4281-9c2a-b500907e0661","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"41a47805-24cc-4404-bb55-41c662c1948d\"}":{"__typename":"Education","uuid":"41a47805-24cc-4404-bb55-41c662c1948d","school":{"__ref":"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Civil and Environmental Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"e8581fec-eb80-44fd-8a2b-4ff6048560f4\"}":{"__typename":"MentorPublicProfile","uuid":"e8581fec-eb80-44fd-8a2b-4ff6048560f4","displayName":"Amanda N.","slug":"amanda-ng","biography":"\u003cp\u003eHi! I am currently a first-year Master's Student at Stanford University studying Structural Mechanics and Computation! I am currently focused on developing mechanical models of hinges for satellites, exploring composite materials, and getting lots of hands-on experience through research and clubs. I am aiming to become a structural or mechanical design engineer working on sustainable aerospace products in the coming years after graduation!\u003c/p\u003e\u003cp\u003eI did my undergraduate at UC Berkeley in Civil and Environmental Engineering so I have a solid foundation in civil structures like buildings, bridges, and more. I spent a few summers in industry at cool design firms, and a few semesters with a competition team building a bridge, and a few more semesters in the lab with 3D printers and CAD software. While anything structures excites me, I have a passion for math and physics as a CLTA-certified tutor. I have taught all the way up to Linear Algebra and Multivariable Calculus and would genuinely enjoy sharing the resources and knowledge I have accumulated through tutoring.\u003c/p\u003e\u003cp\u003eIn high school, I struggled to find a career option going into college that felt 100% right. After hours of diagnostic quizzes, talking to counselors, professors, and classmates, I found an intersection between my clubs, my enjoyment of STEM and CAD classes, and even my hobbies like baking that called to me. It took some searching for sure, but with guidance I trusted, I put together a plan for the next few years that aligned well with my passions. Having been in that position, I would want to give my 2 cents in hopes of discovering that unique path, regardless of a student’s academic age - elementary to high school.\u003c/p\u003e\u003cp\u003eOutside of it all, I have always enjoyed playing badminton, swimming competitively, playing piano, and of course, making food! I try my best to dedicate as much time as possible to my hobbies, especially if I can turn them into ways to give back through coaching, leading clubs, and making long-time friends. I 100% believe it is\u0026nbsp; necessary to find time to enjoy life through the chaos of it all so discovering passions has been one of my top priorities along with school.\u003c/p\u003e\u003cp\u003eAs much as I like sharing my knowledge, I am excited to learn even more - especially about you and your journey!\u003c/p\u003e","teachingVideoPlaybackId":"yNEGmSgMlAWpES7SuVcFYji012gsJwqBscCxPF9rM01kg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Civil and Environmental Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"16b321de-0abf-4621-a823-1f2f0d2c090e\"}"},{"__ref":"DeepDives:{\"uuid\":\"243aae78-a067-4377-a733-67e1dd37db6f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9c50ee7-7ff0-4e63-aaed-de0959b02e4a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7aa97ab3-9b9f-4373-b057-0883dd94e342/-/preview/-/format/jpg/","https://ucarecdn.com/b20995dd-9b59-4c90-9157-59d2f2ae6797/-/preview/-/format/jpg/","https://ucarecdn.com/5f29f126-a375-4492-af5a-95f1a4f2246d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"240d3fff-b816-4000-8045-4531eefbb468\"}"},{"__ref":"Education:{\"uuid\":\"41a47805-24cc-4404-bb55-41c662c1948d\"}"}],"hiredAt":"2026-02-01T07:59:07.701Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","K-6 Storybook","Creative Writing","STEM Project","Aviation / Aerospace","Robotics / Electronics / CAD","Sustainability"],"communityBadges":[],"restrictedProfileVisibi
