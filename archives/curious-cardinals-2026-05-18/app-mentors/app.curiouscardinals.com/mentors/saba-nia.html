xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a7f73ae1-31fb-4eb9-b87f-2bcdce865144\"}":{"__typename":"DeepDives","uuid":"a7f73ae1-31fb-4eb9-b87f-2bcdce865144","content":"\u003cp\u003eI love running outside and swimming, particularly in the ocean. I also surf and hike in my hometown of Los Angeles. An avid reader and writer, I also co-lead a narrative medicine collective and write poetry and novels with my friends. I enjoy visiting museums, exploring cities around the world, and getting lost in nature.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7e4581ca-ef15-4492-b0c1-d602dfba1eac\"}":{"__typename":"DeepDives","uuid":"7e4581ca-ef15-4492-b0c1-d602dfba1eac","content":"\u003cp\u003e\"Find your own personal balance.\" This is inspired by a piece of advice I did receive in middle school: \"Just because you can, doesn't mean you should.\" A former teacher told me this as I was deciding on which classes and extracurriculars to take on for the following year. I think when you're a motivated and passionate student, you want to do as much as you can. Sometimes it's okay to recognize there are not enough hours in the day to do everything with the same level of intensity. This doesn't mean giving up on anything you're trying to pursue, but that you also need to take care of your sleep, health, family and social life, and personal growth.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d7398d27-5876-4c4e-8bd3-ade580156931\"}":{"__typename":"DeepDives","uuid":"d7398d27-5876-4c4e-8bd3-ade580156931","content":"\u003cp\u003eI would love to be a physician working with migrant and Indigenous populations in a community-based care model that integrates a narrative medicine outlook on healthcare. It would be lovely to work with patients and their families and serve as a professor to teach the next generation of doctors how to be empathetic providers. I would also love to continue the research I'm working on right now to apply narrative medicine principles and practices to helping patients and trauma-informed providers. And, of course, I would love to be writing creatively on the side too. This would be in creative nonfiction ways regarding health, bodies, healing, and grief as it would pertain to my personal life and work, but also in my capacity as a poet and fiction novelist.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"44e18048-ff7c-4b43-a9e7-b9ebe559e361\"}":{"__typename":"DeepDives","uuid":"44e18048-ff7c-4b43-a9e7-b9ebe559e361","content":"\u003cp\u003eI have such a strong love of learning and have had such great mentors who have shaped this love. They have been my formal teachers, but also other students and older peers. I want to give back and help motivate other students by being more than just a teacher, but also a trusted friend and role model.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"b1f644e4-7e64-495b-aab7-0da534edc13f\"}":{"__typename":"Education","uuid":"b1f644e4-7e64-495b-aab7-0da534edc13f","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2013","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"8cb60df3-d412-4dda-aa74-68912c3aa2e2\"}":{"__typename":"Education","uuid":"8cb60df3-d412-4dda-aa74-68912c3aa2e2","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"e800e9e3-caed-45e5-9da1-02434a46e6bc\"}":{"__typename":"MentorPublicProfile","uuid":"e800e9e3-caed-45e5-9da1-02434a46e6bc","displayName":"Saba N.","slug":"saba-nia","biography":"\u003cp\u003eHi! My name is Saba and I’m excited we’ve found each other. Ever since I can remember, I have loved learning and I’m grateful for this opportunity to share that passion with your child and help them on their academic and personal journey.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA little about my education: I’m a recent graduate from the University of Southern California Keck School of Medicine’s MS in Narrative Medicine program, a groundbreaking and holistic field that uses storytelling, workshop interventions, and interdisciplinary scholarship to improve both patient and provider outcomes and create egalitarian healthcare encounters that foster community and kinship. (If your child loves both storytelling and healthcare, please send them my way!) I graduated from Georgetown University on the pre-medical track with a major in Psychology and minors in Creative Writing and Biology. I am also currently applying to medical school, and will be matriculating to the Class of 2030 (still deciding where I will go!). I would absolutely love to inspire your child to go into any of these fields, especially if they're looking for someone with a high level of experience in medicine and/or writing. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile I am on track to be a physician and extremely passionate about the content of biological sciences, I have a unique background and expertise in writing that allows me to approach learning and teaching from a holistic perspective. In addition to breaking down difficult scientific concepts and motivating your child to learn, I can help your child improve their communication skills so they can better relay their ideas in science classes (especially for lab work), on humanities papers, and for college application essays and personal passion projects. If your child has specific interests, I also have experience integrating real-life medical, public health, and narrative medicine concepts into passion projects, and could help your child learn about medical topics while also developing their creative and communication skills.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to the research I’ve produced, I am a published author of \u003cem\u003eCarpe Diem\u003c/em\u003e (New Degree Press, 2022), a novel that I first began as a middle schooler. I have years of experience writing and helping others write fiction, lyrical prose, poetry, and creative nonfiction. A former member of \u003cem\u003eThe Los Angeles Times \u003c/em\u003eStudent Advisory Board, I have also a strong background in journalistic writing. I have been an editor for over a dozen publications and was published in \u003cem\u003eMs.\u003c/em\u003e Magazine and in college papers. Quite simply, if you need a writing coach, I’m your person.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA graduate from Harvard-Westlake in Los Angeles, I understand the uniquely rigorous landscape many students may find themselves in and want, above all, to cultivate and maintain your child’s love of learning. To have been able to juggle so many different disciplines and interests, I have developed strong organizational and time management skills, but I have also learned the importance of rest and balance. I see myself as an advocate for your child, making sure they accomplish goals both inside and outside the classroom, even if that means tailoring their plans and our work together to be realistic but more sustainable. I am a proud daughter of immigrants who have instilled in me a love of learning, and I want to help your child become intrinsically motivated and create habits that let them succeed in spite of external pressures, even if they are coming from others in their environment. If you have questions or concerns, let’s talk about it, together.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI take my own recreation and personal growth as passionately as I take my work, and absolutely love reading and writing, working with my patients and volunteering, and being active and outdoors. I have a particular soft spot for running and ocean swimming, reading Greek mythology and Jane Austen, and talking about sweet nothings with my friends. I look forward to working together and hearing from you!\u003c/p\u003e","teachingVideoPlaybackId":"2l1rMAVWWFXZRRhZBSesgGuE4ZtehsF7RTZ1vN8O28A","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'm really proud of the fact that I was able to publish a novel, a passion project 6-7 years in the making, in college. I did this while working and studying as a full-time student, research assistant, and TA, which was certainly a challenge! The book was such a labor of love, and it took a village. For this reason, I'm really grateful towards my friends and family members, and proud of their contributions too.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI only re-discovered my love of creative writing when I went to college, and it was a sweet surprise to learn that I had a strong sense of what I wanted to write about and a clear voice despite never really having the opportunity to write that creatively in high school. I got the idea for my book from an eighth grade English assignment, and kept the idea within me for a third of my life. It was during the pandemic when I finally had the time and confidence in myself and writing to begin writing this book. I worked on my book during an uncertain time, but was able to get connected to a publisher and an editing team that brought my dream to life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt was so special to finally complete a dream project and to recogize that I had to grow as a person and writer first for it to happen. I still can't bleieve that I wrote and published a book, even when I hold a copy in my hands!\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a7f73ae1-31fb-4eb9-b87f-2bcdce865144\"}"},{"__ref":"DeepDives:{\"uuid\":\"7e4581ca-ef15-4492-b0c1-d602dfba1eac\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7398d27-5876-4c4e-8bd3-ade580156931\"}"},{"__ref":"DeepDives:{\"uuid\":\"44e18048-ff7c-4b43-a9e7-b9ebe559e361\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/235456dc-4d71-487f-8874-1932d394e006/-/preview/-/format/jpg/","https://ucarecdn.com/06757a8e-21ec-4a89-af92-9388e1fd1d10/-/preview/-/format/jpg/","https://ucarecdn.com/fb1cf565-0494-4c0b-8d39-2753ef6a0118/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b1f644e4-7e64-495b-aab7-0da534edc13f\"}"},{"__ref":"Education:{\"uuid\":\"8cb60df3-d412-4dda-aa74-68912c3aa2e2\"}"}],"hiredAt":"2025-05-02T21:52:24.193Z","topics":["K-5 Grade Math","6-8 Grade Science","Biology","Writing","Academic Coaching","College Essay Writing","Executive Function","History","Reading","Creative Writing","History Project","K-6 Storybook","Visual Arts / Graphic Design","Medicine / Health","STEM Project","Journalism","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/4898ea96-6627-4c32-80af-8dd44881bd39/","https://ucarecdn.com/b98f175c-f982-4497-bb8d-4a9c11113cd8/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"saba-nia\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e800e9e3-caed-45e5-9da1-02434a46e6bc\"}"}}},"_sentryTraceData":"e16e34807d2e4c98a1ed8d3869dd34d6-98101d674bd8b3bd-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e16e34807d2e4c98a1ed8d3869dd34d6,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"saba-nia"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i
