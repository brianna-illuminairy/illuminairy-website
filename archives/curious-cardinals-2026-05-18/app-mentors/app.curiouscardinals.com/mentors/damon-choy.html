xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4d218b5a-6540-45f2-bc9d-82207beadb2f\"}":{"__typename":"Favorites","uuid":"4d218b5a-6540-45f2-bc9d-82207beadb2f","photoUrl":"https://ucarecdn.com/bdf9d9dc-bebd-4f5f-9158-c38b9af8d666/","title":"Stephen Curry","type":"ATHLETE"},"Favorites:{\"uuid\":\"c88456e0-f914-43b2-8c9f-625a307b34c2\"}":{"__typename":"Favorites","uuid":"c88456e0-f914-43b2-8c9f-625a307b34c2","photoUrl":"https://ucarecdn.com/39576225-0c31-4ec5-a7a8-d45c9d13dfc1/","title":"The Prestige","type":"MOVIE"},"Favorites:{\"uuid\":\"c302ea40-04ef-4848-a0d6-a4565b53db1a\"}":{"__typename":"Favorites","uuid":"c302ea40-04ef-4848-a0d6-a4565b53db1a","photoUrl":"https://ucarecdn.com/2b98e8d7-045d-4cab-8aee-8c76a822683f/","title":"San Francisco","type":"CITY"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c3e903f7-0123-4e43-90e6-4ba59578873a\"}":{"__typename":"DeepDives","uuid":"c3e903f7-0123-4e43-90e6-4ba59578873a","content":"\u003cp\u003eAfter two years of growing At the Buzzer, it finally reached profitability. While I was proud of this accomplishment, I wanted to put the company's profits into good use. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eKnowing the value of a college education, I decided to start a scholarship fund for underprivileged adolescents in the Bay Area. We were able to grow the fund to over $10,000 after a successful couple years of business, and helped four teens pay for their textbooks and other necessary supplies for school. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"5acf14f6-f07b-4e5e-a499-7bcdf0cdae77\"}":{"__typename":"DeepDives","uuid":"5acf14f6-f07b-4e5e-a499-7bcdf0cdae77","content":"\u003cp\u003eThe number one item on my bucket list is to go to a game at every NBA and NFL stadium. 30 teams in the NBA and 32 teams in the NFL means 62 stadiums total. While I have only been to 5 stadiums in my 19 years on Earth so far (so not pacing too well...), I'm optimistic that I can make up some ground after I finish school!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"504c4dc0-2652-4bf5-82dc-fdaa0334fcfd\"}":{"__typename":"DeepDives","uuid":"504c4dc0-2652-4bf5-82dc-fdaa0334fcfd","content":"\u003cp\u003eMy proudest accomplishment is my second-degree black belt.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI started martial arts at three years old to become like the super heroes I idolized at the time. While I never reached that goal, my years in the studio shaped who I am today. Not only did I gain the ability to kick and punch, but I also joined a community that I hold dear. I will always cherish the relationships I developed during my 15 years in martial arts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo achieve my second-degree, I had to complete 1,000 push-ups, leg throws, and crunches in one day. I then had to perform all of my techniques physically exhausted, while in front of a crowd with hundreds of people watching. Finally, I had to break two slabs of concrete with a hammer fist. Completing the day of my test filled me with a sense of accomplishment unlike anything I've ever experienced.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"c76adb24-9582-440c-afe9-f005ad2827f7\"}":{"__typename":"DeepDives","uuid":"c76adb24-9582-440c-afe9-f005ad2827f7","content":"\u003cp\u003eWith two immigrant parents, school has been an emphasis my whole life. I've always been a diligent student, and this continued through high school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love learning about the inner workings of things that I interact with on a daily basis. For example, learning how to calculate the probabilities of poker or how businesses price their products were two of the most memorable moments of my classroom study. This eventually led to the selection of my two majors: economics and statistics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, I was an avid athlete and loved spending time with friends, whether during practice or when sharing meals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"201a9359-ec0d-49bd-9d60-cfe65ec20f0c\"}":{"__typename":"School","uuid":"201a9359-ec0d-49bd-9d60-cfe65ec20f0c","name":"The College Preparatory School","city":"Oakland","type":"HIGH","state":"California","country":"United States","zip":"94618"},"Education:{\"uuid\":\"e0b92322-e41a-47d6-bcd0-ff8a418b1c98\"}":{"__typename":"Education","uuid":"e0b92322-e41a-47d6-bcd0-ff8a418b1c98","school":{"__ref":"School:{\"uuid\":\"201a9359-ec0d-49bd-9d60-cfe65ec20f0c\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"2587affb-79a6-498b-97ca-a236d8eb58d6\"}":{"__typename":"Education","uuid":"2587affb-79a6-498b-97ca-a236d8eb58d6","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Business Economics and Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2d55458b-4304-41fc-9ae1-a20e32886a15\"}":{"__typename":"MentorPublicProfile","uuid":"2d55458b-4304-41fc-9ae1-a20e32886a15","displayName":"Damon C.","slug":"damon-choy","biography":"\u003cp\u003eHi! My name is Damon Choy, and I am a sophomore at UCLA studying both Business Economics and Data Science.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy life revolves around sports, both as a player and fan. I’ve played basketball all my life. I also grew up in the Bay Area, so I was lucky enough to cheer for the Warriors as they decimated the rest of the NBA.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn some ways, my boundless love for Stephen Curry started my career path. I loved basketball so much that in my freshman year of high school, I began a blog called At the Buzzer (ATB) to write about my favorite teams. While at the start it was just me jotting down my deeply biased sports opinions, one by one, my friends joined as fellow journalists, each focusing on their favorite sport. Under my leadership, we transformed it into a company, growing to over 1,000,000 monthly viewers and $120,000 in annual revenue in four years.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eRunning At the Buzzer sparked my interest in business and entrepreneurship, so I decided to explore these areas further at UCLA. I joined Bruin Asset Management, a finance club on campus. Through BAM, I’ve been able to network with dozens of professionals. These conversations convinced me to pursue investment banking, as I would get to help major companies during the most critical part of their life cycle. Since then, I’ve interned at an investment bank, a private equity firm, and secured an investment banking offer for my sophomore summer.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love helping people pursue their passions in business, and have taught both finance and entrepreneurship fundamentals within my club. Running a company in high school provided me with unique experiences and lessons learned that I believe make me a great mentor.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of business, I am really passionate about my Mexican, Peruvian, and Chinese heritage, and have joined affinity groups on campus to learn more about my cultures. I also spent 15 years in martial arts, and received my second-degree black belt right before going off to college.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love watching Christopher Nolan movies, crafting fantasy football trades, or diving into sports data to put together my next prediction!\u003c/p\u003e","teachingVideoPlaybackId":"jwuHjeK02S01M6DTJMyZpW6zX01nKjmPvK1VVizEaAg2kE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4d218b5a-6540-45f2-bc9d-82207beadb2f\"}"},{"__ref":"Favorites:{\"uuid\":\"c88456e0-f914-43b2-8c9f-625a307b34c2\"}"},{"__ref":"Favorites:{\"uuid\":\"c302ea40-04ef-4848-a0d6-a4565b53db1a\"}"}],"causesSupported":[],"major":"Business Economics and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c3e903f7-0123-4e43-90e6-4ba59578873a
