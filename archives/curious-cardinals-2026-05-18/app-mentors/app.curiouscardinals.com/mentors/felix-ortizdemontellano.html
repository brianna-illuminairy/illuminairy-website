xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7c4c6e20-2c13-4163-a297-077102decac0\"}":{"__typename":"Favorites","uuid":"7c4c6e20-2c13-4163-a297-077102decac0","photoUrl":"https://ucarecdn.com/9afefa17-714d-48ff-b61d-9c98b569aae7/","title":"The Dark Forest by Cixin Liu","type":"BOOK"},"Favorites:{\"uuid\":\"cc325795-f613-4c52-951f-e20d1d91537b\"}":{"__typename":"Favorites","uuid":"cc325795-f613-4c52-951f-e20d1d91537b","photoUrl":"https://ucarecdn.com/9afefa17-714d-48ff-b61d-9c98b569aae7/","title":"Interstellar","type":"MOVIE"},"Favorites:{\"uuid\":\"83893cf0-9c0c-4596-bc57-97b146adbab1\"}":{"__typename":"Favorites","uuid":"83893cf0-9c0c-4596-bc57-97b146adbab1","photoUrl":"https://ucarecdn.com/9afefa17-714d-48ff-b61d-9c98b569aae7/","title":"The Strokes - The New Abnormal","type":"ALBUM"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"55c980e4-a060-4e31-8bc9-aa8a455d512d\"}":{"__typename":"DeepDives","uuid":"55c980e4-a060-4e31-8bc9-aa8a455d512d","content":"\u003cp\u003eMy greatest motivation is my curiosity, and desire to understand how things work. Ever since I was a kid, I have wanted to understand the mechanisms underlying the world I saw around me, and I soon realized that the best way for me to do that was through science. This desire for understanding has led me down the academic path I am on today. When I solve a problem, it is seeing the ways that the puzzle pieces fit together which motivates me. When I learn something new, it is the way that it builds off of other pieces of knowledge that encourages me to learn more. When I mentor, fostering that Eureka moment, and helping others see things differently, is what motivates me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"67649d7f-ff59-4922-b21e-0f6c1d6fe3f7\"}":{"__typename":"DeepDives","uuid":"67649d7f-ff59-4922-b21e-0f6c1d6fe3f7","content":"\u003cp\u003eI would tell myself to find new ways to explore what I was interested in, and to discover new areas and interests. Going through middle and high school, I enjoyed a lot of the classes I took but I didn’t discover what I was really passionate about until I stepped outside of the bounds of my school and took the initiative to learn more. Because I spent so long in school, I did not push myself to discover new topics. But what I have since realized is that there are so many amazing resources out there which make it fun and engaging to explore new areas, while also exposing me to ideas I had never even considered. It is easy to think of yourself as not interested in a specific subject, or good at only one thing, without giving any thought to the alternative. I would urge myself to try exploring things I had not given a chance to before, to see how I actually felt.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"d2a71158-115c-46c6-940a-d9b93d042cb4\"}":{"__typename":"School","uuid":"d2a71158-115c-46c6-940a-d9b93d042cb4","name":"French American International School + International High School","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94102"},"Education:{\"uuid\":\"a3362553-9481-46a2-92cd-c4e97b0d0760\"}":{"__typename":"Education","uuid":"a3362553-9481-46a2-92cd-c4e97b0d0760","school":{"__ref":"School:{\"uuid\":\"d2a71158-115c-46c6-940a-d9b93d042cb4\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"183c7f82-a074-431e-9141-4ba0bceba1f9\"}":{"__typename":"Education","uuid":"183c7f82-a074-431e-9141-4ba0bceba1f9","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"8d9e1886-f92b-43ed-8235-cbcc0fea7a22\"}":{"__typename":"MentorPublicProfile","uuid":"8d9e1886-f92b-43ed-8235-cbcc0fea7a22","displayName":"Felix O.","slug":"felix-ortizdemontellano","biography":"\u003cp\u003eI grew up in San Francisco where I was raised bilingual French-English, and attended school in both languages, also spending much of my summers in France growing up. I ultimately went through the French curriculum, which exposed me even more to my place in these two cultures and made me conscious of how many different perspectives people can have in different contexts. I graduated with my French Baccalaureate diploma in 2022, achieving the highest honors with a perfect score in the Math section, before moving across the country to Columbia University in New York.\u003c/p\u003e\u003cp\u003eAt college, where I am a junior studying biology, I have been able to develop my passions for the sciences, which I love because of how they satisfy my ingrained desire to know how and why things function the way they do. My favorite part about these kinds of classes is that nothing is theoretical: it all follows you out of the classroom. Every breath, every step, is biology at work. I split my time between class and working at a genetics lab at the Columbia medical center, building on research work I’ve done during the summer. I spent summer 2023 at UCSF's Mass Spectrometry Facility, and summer 2024 working on a research project as part of Columbia University’s SURF fellowship. Seeing what I know in theory materialize in front of my eyes has made this one of the most exciting parts of my learning at Columbia. I have also been able to continue tutoring, which I have been doing since 2020, working with students through middle and high school.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOne of my favorite things about being in New York has been continuing Capoeira, an afro-brazilian martial art which combines combat with dancing, gymnastics, and music. I started in middle school, and since leaving my San Francisco studio for college I have been training in the Bronx. I also discovered ballroom dance, and after joining the club at the start of my freshman year I have had the chance to compete up and down the East Coast. Last year, I joined the board as competitions chair, organizing our trips to Boston, DC, and other events.\u003c/p\u003e\u003cp\u003eWhen I'm not working or dancing, I love to explore New York, read science fiction, find new ways to keep decorating my room, and listen to Indie pop.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"LKJ6h1zEcwEo01C4PgTU54WNhGVvX8iYqsUz36LUCrao","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7c4c6e20-2c13-4163-a297-077102decac0\"}"},{"__ref":"Favorites:{\"uuid\":\"cc325795-f613-4c52-951f-e20d1d91537b\"}"},{"__ref":"Favorites:{\"uuid\":\"83893cf0-9c0c-4596-bc57-97b146adbab1\"}"}],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"55c980e4-a060-4e31-8bc9-aa8a455d512d\"}"},{"__ref":"DeepDives:{\"uuid\":\"67649d7f-ff59-4922-b21e-0f6c1d6fe3f7\"}"}],"active":true,"profilePhotos":["https://ucar
