xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"1eb02653-0931-4549-833f-b3e67f7ddfd7\"}":{"__typename":"School","uuid":"1eb02653-0931-4549-833f-b3e67f7ddfd7","name":"Tesoro High School","city":"Las Flores","type":"HIGH","state":"California","country":"United States","zip":"92688"},"Education:{\"uuid\":\"d2170aa5-4a16-4cf1-a9df-1b3af7089e30\"}":{"__typename":"Education","uuid":"d2170aa5-4a16-4cf1-a9df-1b3af7089e30","school":{"__ref":"School:{\"uuid\":\"1eb02653-0931-4549-833f-b3e67f7ddfd7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a85ba301-1ac7-454f-a3cd-b9f196bf8284\"}":{"__typename":"Education","uuid":"a85ba301-1ac7-454f-a3cd-b9f196bf8284","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"aec2fb47-b7c6-421f-9601-de674797d7fc\"}":{"__typename":"MentorPublicProfile","uuid":"aec2fb47-b7c6-421f-9601-de674797d7fc","displayName":"Stephanie C.","slug":"stephanie-cao","biography":"\u003cp\u003eHey everyone! My name is Stephanie Cao and I am a rising senior at Yale University studying Psychology on the pre-law track! I’ve definitely come a long way in terms of my academic journey, considering I applied to Yale as a Biology major hoping to eventually go to medical school. Growing up in a Chinese household, I really only ever knew that academics was about being top of your class and getting approval from your parents. This type of mentality altered my relationship with learning deeply, as I never really understood that learning could be enjoyable– it was always a constant pressure towards perfection hovering over my head. However, as I got to Yale, the people surrounding me taught me that not everyone was thinking the way I was thinking, and that I had so much to learn from my new environment. Thus, I found my passion in Psychology– I loved understanding why we are who we are, and how we influence other people. Alongside my journey, I regained a love for learning, something that I didn’t realize was still in me ever since school was more than just coloring inside the lines and nap time.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeing a student athlete, I am all but too familiar with the struggles of returning home late from practice, about to pass out, and realizing you have two exams and three papers due the next day. Time management became something crucial to learn by high school, because I realized I wouldn’t be able to succeed without it. While my academic journey began as a strong pursuit to go to the best college I could, I quickly realized it was more colorful than that. Learning was about realizing who you are as a person, and what makes you happy. Learning is exciting, and it helps connect you to amazing people.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I want to help students regain a passion for learning, and help them understand that learning is about being yourself!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/ddf0c86a-f5aa-429d-8d3b-da5772929005/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Educa
