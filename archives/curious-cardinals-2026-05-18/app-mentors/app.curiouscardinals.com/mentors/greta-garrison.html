"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Global Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"c314f3f1-45ff-4419-83bb-bce7fac065a7\"}":{"__typename":"MentorPublicProfile","uuid":"c314f3f1-45ff-4419-83bb-bce7fac065a7","displayName":"Greta G.","slug":"greta-garrison","biography":"\u003cp\u003eHi! I'm Greta Garrison, a rising sophomore at Yale University. I'm super excited to be on the Curious Cardinals team!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up in Ithaca, NY, on an organic vegetable farm. I have three younger siblings, cats, dogs, sheep, and chickens. In my free time, I love to cook and bake things, read, and be outside! I’m half Taiwanese, and am currently beginning to learn Mandarin. I also play classical and jazz trumpet, and spend a lot of time listening to music or going to see concerts.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m passionate about many issues, but some that I’ve focused on include sustainability, food sovereignty, social justice (especially regarding race and gender), and immigration.\u0026nbsp;I'm currently majoring in Global Affairs. After graduating, I hope to attend law school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAbout my background:\u003c/p\u003e\u003cp\u003eThroughout high school, I interned with Professor Elizabeth Brundige at the Cornell Law School, working as a Research Assistant. Most of this work was through the Cornell Gender Justice Clinic, and this was my first introduction to legal studies. Later, I worked alongside NYS Assembly member Anna Kelles on a public policy project regarding Naloxone emergency trainings. I also hosted a radio show on WRFI station 88.1, and love listening to podcasts. I was president of my class and of our Spanish Club, Global Humanism Club, and team captain of my cross-country team. In sophomore year, I started a summer program to help teach youth grades 6-12 about basic jazz improv and music theory, which gave me experience with teaching over 40 middle \u0026amp; high school students. I also worked several jobs including as a barista, baker, and social media manager, and played trumpet in a variety of ensembles in and out of school.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat I do now:\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHere at Yale, I'm a member of the Yale Daily News Business Team, WYBC (the student radio), Director of Social Media at both 17o1 Records and YCB (the wind ensemble), and am involved in the Asian American Cultural Center and the jazz collective. I recently completed a marketing and management internship with an artist management company based in LA.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e I work as a Yale Admissions Ambassador and have had experience working with high schoolers throughout college application processes. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis past summer, I attended a study abroad program at the Palais des Nations in Geneva, where I will attended UN briefings, conducted interviews and completed a thesis related to international law \u0026amp; diplomacy.\u003c/p\u003e","teachingVideoPlaybackId":"HMYFvsADdXFACizxroIhG4a01okVXEgqbOeIsNjJtC38","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9f5924b5-7f8f-475f-a391-90713a97ee87\"}"},{"__ref":"Favorites:{\"uuid\":\"4fea6ed5-328d-46ed-adc5-6f232db4751f\"}"},{"__ref":"Favorites:{\"uuid\":\"153f1903-21ee-4ddd-a282-db23327feac1\"}"}],"causesSupported":[],"major":"Global Affairs","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/3fcc8b78-cd71-4cf2-99e3-0ba0dd1a14b1/-/preview/-/format/jpg/","https://ucarecdn.com/c3e0fabe-69c4-44ba-b1bb-adcfa7dfd9b6/-/preview/-/format/jpg/","https://ucarecdn.com/bdbb0347-b816-45ba-b867-96f1fc1d3195/-/preview/-/format/jpg/"],"pronouns":"SHE_HER
