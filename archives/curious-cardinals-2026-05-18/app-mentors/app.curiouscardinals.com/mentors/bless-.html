xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4f28f2c7-729e-42dc-93aa-99c1a0f3ce9f\"}":{"__typename":"DeepDives","uuid":"4f28f2c7-729e-42dc-93aa-99c1a0f3ce9f","content":"\u003cp\u003eIf I could give advice to my middle or high school self, it would be to work backward from your goals but focus on the very next step in front of you. Big dreams can feel overwhelming, but breaking them into manageable steps makes progress possible, and hard work always pays off, especially when it’s focused and intentional. Surround yourself with people who lift you up, challenge you, and encourage you to be the best version of yourself, and make sure to maintain those friendships. Don’t be afraid to ask for help, learn from others, and take chances, sometimes the small steps and connections you make along the way turn out to be the most important part of the journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7f4a0447-d02e-4a2b-bf24-653a94bd64eb\"}":{"__typename":"DeepDives","uuid":"7f4a0447-d02e-4a2b-bf24-653a94bd64eb","content":"\u003cp\u003eDuring a trip to South Africa, I observed firsthand how a significant portion of the population lacked access to the My greatest source of motivation comes from seeing how access to resources and education can completely change someone’s path. During a trip to South Africa, I witnessed firsthand how many communities lacked stable housing, reliable food access, and quality education—experiences that strongly mirrored my own upbringing in Uganda. Volunteering as a coach, working with community-led environmental initiatives, and visiting places like the Apartheid Museum helped me understand how history, policy, and economics shape opportunity in very real ways. Those experiences pushed me toward an interdisciplinary engineering major focused on sustainable technology and economic development, because engineering lets you take an idea and turn it into something tangible; a real, working solution that can improve lives. I love engineering for its mix of creativity, systems thinking, and impact, and I love mentoring for the same reason: helping students realize they don’t just have ideas, they have the ability to build them into meaningful change.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"5428f84c-8a9a-4d86-ad44-aebf8f762fbd\"}":{"__typename":"DeepDives","uuid":"5428f84c-8a9a-4d86-ad44-aebf8f762fbd","content":"\u003cp\u003eIn high school, I was a highly motivated and high-achieving student who loved challenging myself academically. I took as many advanced science courses as possible, including AP Chemistry and AP Physics C in both Mechanics and Electricity and Magnetism. Outside the classroom, I spent most of my time studying and training as a varsity soccer player, and I was honored to serve as team captain my senior year, leading our team to the school’s first-ever state final. I spent many summers volunteering as a soccer coach, attending collegiate ID camps, and competing on the regional Olympic Development Team for my age group. I was friendly with everyone and built strong connections across different groups, often spending lunch and after-school hours in the engineering lab if I was not playing soccer with friends. At home, I was a big brother who helped support my family, and I even started a small candy business to earn enough money to cover my college application and travel fees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"8696e04a-6555-495e-a9b7-5210e1038bfc\"}":{"__typename":"DeepDives","uuid":"8696e04a-6555-495e-a9b7-5210e1038bfc","content":"\u003cp\u003eSomething that isn’t obvious right away is that I speak four languages fluently, and after years of studying Spanish, I can read and write it proficiently as a fifth language. Languages have always been one of my favorite ways to connect with people and cultures. I’m also a huge soccer fan and follow all the major tournaments, so I’m especially excited about the World Cup coming to the U.S. There’s nothing better than great football bringing people together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"5488a298-cb1d-472c-b026-97d60922b333\"}":{"__typename":"School","uuid":"5488a298-cb1d-472c-b026-97d60922b333","name":"Jackson-Reed High School","city":"Washington","type":"HIGH","state":"DC","country":"United States","zip":"20016"},"Education:{\"uuid\":\"4b858614-945a-42cb-85da-50069c818f00\"}":{"__typename":"Education","uuid":"4b858614-945a-42cb-85da-50069c818f00","school":{"__ref":"School:{\"uuid\":\"5488a298-cb1d-472c-b026-97d60922b333\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"4cd183fa-4390-4232-8378-8edff0cecf91\"}":{"__typename":"School","uuid":"4cd183fa-4390-4232-8378-8edff0cecf91","name":"Swarthmore College","city":"Swarthmore","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19081"},"Education:{\"uuid\":\"c7d990bf-a342-4df0-8429-a0f8a9e0e583\"}":{"__typename":"Education","uuid":"c7d990bf-a342-4df0-8429-a0f8a9e0e583","school":{"__ref":"School:{\"uuid\":\"4cd183fa-4390-4232-8378-8edff0cecf91\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Engineering Special Major: Environment, Technology, and Society","degree":null},"MentorPublicProfile:{\"uuid\":\"8cd09d47-b8e3-4816-852b-88a70a77ad4e\"}":{"__typename":"MentorPublicProfile","uuid":"8cd09d47-b8e3-4816-852b-88a70a77ad4e","displayName":"Bless T.","slug":"bless-","biography":"\u003cp\u003eI am an interdisciplinary engineering graduate who loves helping students understand how what they learn in school connects to the real world. My academic background blends environmental science, technology, economics, and systems thinking, and I approach learning, and teaching, with curiosity, patience, and care. I enjoy breaking down complex ideas into clear, practical concepts that students can truly understand and feel confident using.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my studies, I focused on sustainable technology and economic development, exploring topics like solar energy, clean water access, pollution control, and data-driven decision-making. What excites me most is showing students that math, science, and critical thinking aren’t just abstract subjects. They’re tools for solving real problems and improving lives. This perspective helps students see learning as meaningful and empowering, not overwhelming.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I have worked in both large organizations and community-focused settings. During college, I interned at Amazon in operations and process engineering at one of its largest fulfillment centers, where I helped design and launch a new processing area and improve workflows. After graduating, I was hired full-time as an Operations Manager. These experiences taught me how to explain complex systems clearly, stay organized under pressure, and adapt to different learning styles, all skills that directly support my work as a tutor and mentor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside this, I have been deeply involved in service and youth development. I am the Co-Founder and Program Systems Director of Rwakabego Sports Academy in Uganda, a nonprofit that has supported over 140 students and families through educational scholarships. I am also the Founder and Systems Operations Manager of a community healthcare initiative that helps deliver medical care and essential medications to underserved communities. These roles have strengthened my commitment to mentorship, empathy, and meeting students where they are.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also have direct experience working with young people as an SAT preparation tutor and as a mentor with Design FC, a youth design organization that uses sports and creativity to build confidence, self-expression, and problem-solving skills. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a former NCAA athlete and semi-professional soccer player, I understand the value of discipline, goal-setting, and perseverance. I enjoy helping students apply these same skills to academics, while also reminding them that learning doesn’t have to be stressful to be effective.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor and tutor, I bring a calm, encouraging, and structured approach. I focus not only on helping students succeed academically, but also on building confidence, curiosity, and independence. My goal is for students to feel supported, capable, and inspired, and for families to feel confident that their child is learning in a positive, respectful, and motivating environment.\u003c/p\u003e","teachingVideoPlaybackId":"lEb3Syx38gp60136HDtysFztWtpmm1SkJEeBpXOvywwQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Engineering Special Major: Environment, Technology, and Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4f28f2c7-729e-42dc-93aa-99c1a0f3ce9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"7f4a0447-d02e-4a2b-bf24-653a94bd64eb\"}"},{"__ref":"DeepDives:{\"uuid\":\"5428f84c-8a9a-4d86-ad44-aebf8f762fbd\"}"},{"__ref":"DeepDives:{\"uuid\":\"8696e04a-6555-495e-a9b7-5210e1038bfc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6dc65038-02fe-4ea2-a589-6a89f400d62e/-/preview/-/format/jpg/","https://ucarecdn.com/2d2bf9ec-56ad-4c6f-8726-cd3d87b55942/-/preview/-/format/jpg/","https://ucarecdn.com/3589093a-4fbf-484f-9f2e-e51424ebf9ea/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4b858614-945a-42cb-85da-50069c818f00\"}"},{"__ref":"Education:{\"uuid\":\"c7d990bf-a342-4df0-8429-a0f8a9e0e583\"}"}],"hiredAt":"2026-01-21T19:37:23.923Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Physics","6-8 Grade Science","Academic Coaching","Executive Function","History","History Project","K-6 Storybook","Business / Entrepreneurship","STEM Project","Aviation / Aerospace","Sports Analytics","Sustainability","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"bless-\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8cd09d47-b8e3-4816-852b-88a70a77ad4e\"}"}}},"_sentryTraceData":"7eefeb8171eb47bebca07529bc56a82c-8e09abbf56d31c56-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7
