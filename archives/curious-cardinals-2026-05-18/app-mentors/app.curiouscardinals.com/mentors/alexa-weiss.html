xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"5524da4a-93f1-4046-85fb-722d17cd41e2\"}":{"__typename":"DeepDives","uuid":"5524da4a-93f1-4046-85fb-722d17cd41e2","content":"\u003cp\u003eOne of the things I’m most proud of is taking a gap year and moving abroad on my own. It was a spur-of-the-moment decision, driven by COVID, and completely outside my comfort zone—I had never lived anywhere other than my hometown. Leaving behind my family, friends, and everything familiar was terrifying, especially since I hadn’t had to make new friends in over ten years. But despite the fear, I took the leap and embraced every moment. I learned how to be independent, adapt to new environments, and build relationships in an unfamiliar place. That experience shaped me in ways I never expected, giving me the confidence to take on new challenges. Looking back, I’m incredibly proud that I didn’t let fear hold me back from an opportunity that ultimately changed my perspective on life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b7d9961d-7183-49ca-8416-2452a7ad82cb\"}":{"__typename":"DeepDives","uuid":"b7d9961d-7183-49ca-8416-2452a7ad82cb","content":"\u003cp\u003eI spent my summers at sleepaway camp, first as a camper and later as a counselor, and it was one of the best parts of my high school years. Camp allowed me to unplug from technology for seven weeks, build lasting friendships, and fully immerse myself in the experience. My biggest advice to high schoolers is to enjoy summer for what it is—don’t stress too much about being productive, but instead embrace the time off and make the most of it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f906853c-2cea-4363-833a-67bf7b6f3e75\"}":{"__typename":"DeepDives","uuid":"f906853c-2cea-4363-833a-67bf7b6f3e75","content":"\u003cp\u003eI’d tell my middle school and high school self that the key is finding a balance—enjoying the present while still exploring the things that excite you. It’s easy to get caught up stressing about the future, but the best way to prepare for it is by staying curious and taking advantage of opportunities that come your way. Push yourself to try new things, even if they seem intimidating, but don’t forget to slow down and appreciate the moment too. Some of the best memories come from the times when you’re just having fun and not overthinking what’s next. The friendships, experiences, and lessons you pick up along the way will shape you just as much as any big accomplishment. So trust yourself, take chances, and remember—you don’t have to have it all figured out right now.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f838fc7d-c251-4db5-a6d0-a198bb533982\"}":{"__typename":"DeepDives","uuid":"f838fc7d-c251-4db5-a6d0-a198bb533982","content":"\u003cp\u003eMy dream job is to be a world-traveling food critic! I love to explore new places and try various cuisines!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65\"}":{"__typename":"School","uuid":"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65","name":"Tenafly High School","city":"Tenafly","type":"HIGH","state":"New Jersey","country":"United States","zip":"07670"},"Education:{\"uuid\":\"378146be-8ded-403d-a4dc-b42373505999\"}":{"__typename":"Education","uuid":"378146be-8ded-403d-a4dc-b42373505999","school":{"__ref":"School:{\"uuid\":\"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"4dce56e4-ac04-4cf8-a60c-0d8e332f4af0\"}":{"__typename":"Education","uuid":"4dce56e4-ac04-4cf8-a60c-0d8e332f4af0","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Finance","degree":null},"MentorPublicProfile:{\"uuid\":\"f556d812-ae99-4321-86ff-a994e22282af\"}":{"__typename":"MentorPublicProfile","uuid":"f556d812-ae99-4321-86ff-a994e22282af","displayName":"Alexa W.","slug":"alexa-weiss","biography":"\u003cp\u003eHello! My name is Alexa, and I’m a student at The Wharton School at the University of Pennsylvania. I’m originally from Tenafly, New Jersey, I have three brothers (an older, younger, and a twin!) and I have a Belgian Mallinois named Forrest!\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I knew I wanted to study business because it combined my passion for working with driven, supportive people and my desire to pursue meaningful, challenging work. As captain of my varsity soccer team and president of my varsity debate team, I developed leadership skills that pushed me to grow both on and off the field. These experiences reinforced my goal of continuing to lead and challenge myself beyond high school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAfter graduating, I took a gap year and lived abroad for nine months, working at a venture capital firm. That experience sparked my interest in finance and investing while also teaching me independence and efficiency. By the time I arrived at Wharton, I felt prepared to make the most of every opportunity.\u003c/p\u003e\u003cp\u003eAt Wharton, my strong work ethic, organizational skills, and leadership experience led me to become Co-President of Wharton Ambassadors—an organization of 60 students who give information sessions and coffee chats to prospective students. As ambassadors, we serve as role models on campus and work closely with the school's advisors. This role has deepened my leadership skills and reinforced my excitement for working in teams and leading others.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academics, I’m a huge New York Rangers fan, I love running outdoors, and I’m always up for a concert (especially country music and classic rock). I also love traveling, exploring new places, and spending time with my friends and family.\u003c/p\u003e","teachingVideoPlaybackId":"6Z3tdVIbh0200odHU6sZDruGWBCr9YPhs2nUcNXFhGy3Q","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Finance","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5524da4a-93f1-4046-85fb-722d17cd41e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7d9961d-7183-49ca-8416-2452a7ad82cb\"}"},{"__ref":"DeepDives:{\"uuid\":\"f906853c-2cea-4363-833a-67bf7b6f3e75\"}"},{"__ref":"DeepDives:{\"uuid\":\"f838fc7d-c251-4db5-a6d0-a198bb533982\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/029f2e39-1d57-42ec-b28f-7f90309e1d81/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"378146be-8ded-403d-a4dc-b42373505999\"}"},{"__ref":"Education:{\"uuid\":\"4dce56e4-ac04-4cf8-a60c-0d8e332f4af0\"}"}],"hiredAt":"2025-02-18T10:13:50.139Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","College Essay Writing","Executive Function","Reading","History","K-6 Storybook","History Project","Finance / Investing","Business / Entrepreneurship","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexa-weiss\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f556d812-ae99-4321-86ff-a994e22282af\"}"}}},"_sentryTraceData":"f2e766c689ee485b9b1584cbbfdc6af5-bfda9998b4722866-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f2e766c689ee485b9b1584cbbfdc6af5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alexa-weiss"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'sc
