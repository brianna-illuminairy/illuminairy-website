xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1375fb11-f393-4179-88bf-36195a3a2bee\"}":{"__typename":"Favorites","uuid":"1375fb11-f393-4179-88bf-36195a3a2bee","photoUrl":"https://ucarecdn.com/4637e718-1f6a-47ed-aa40-9dac2afda838/","title":"Rio De Jainero","type":"CITY"},"CausesSupported:{\"uuid\":\"89fb36b2-ffbc-4a18-823d-8c89febee3e3\"}":{"__typename":"CausesSupported","uuid":"89fb36b2-ffbc-4a18-823d-8c89febee3e3","name":"International Rescue Committee","description":"\u003cp\u003eI worked with refugees, helping them achieve self sufficiency in America. \u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"ab6f2be0-4d3a-4976-a67e-e12c671bc060\"}":{"__typename":"CausesSupported","uuid":"ab6f2be0-4d3a-4976-a67e-e12c671bc060","name":"Sacramento Street Medicine","description":"\u003cp\u003eI provided food, supplies, and basic medical care to the unhoused population. \u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3094ab28-7bfd-4476-b254-6e908ffa1e0e\"}":{"__typename":"DeepDives","uuid":"3094ab28-7bfd-4476-b254-6e908ffa1e0e","content":"\u003cp\u003eIn my free time, I love to read, especially books in the fantasy fiction genre. In addition to reading, I really enjoy playing sports like volleyball, skiing, and soccer. I have played soccer for over 15 years. Furthermore, I enjoy traveling and learned about different cultures. I have traveled to over 27 countries so far, having taught English abroad while also doing internships abroad. I love trying new foods and exploring different cafes. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"dc9f5e88-d35e-4907-aa1a-2d9fc06c1854\"}":{"__typename":"DeepDives","uuid":"dc9f5e88-d35e-4907-aa1a-2d9fc06c1854","content":"\u003cp\u003eMy dream job is to work as a doctor. As a doctor, I hope to build long term relationships with my patients and help them achieve their best health possible. I would also like to work with Doctors Without Borders in providing global health care to areas that have a shortage in doctors. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a538e12f-e253-4b78-bd81-2ebb18419dcc\"}":{"__typename":"DeepDives","uuid":"a538e12f-e253-4b78-bd81-2ebb18419dcc","content":"\u003cp\u003eThe reason why I chose my major was because I have always been fascinated with how life works. In middle school and high school, my favorite subjects were life sciences and biology as I was able to learn more about how the way life worked, from plants to humans. By majoring in Biology, I was able to do a deep dive into learning about the mechanisms for how life works and functions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5298f4c5-e577-4cd8-abfe-c552cc1f988f\"}":{"__typename":"DeepDives","uuid":"5298f4c5-e577-4cd8-abfe-c552cc1f988f","content":"\u003cp\u003eIn the summers of high school, I would spend them either visiting family abroad or staying at home. Every other summer, I would go to Jordan to visit my grandparents, aunts, and cousins. In Jordan, I would eat great Jordanian food, spend time with family, and explore the Dead Sea, Petra, and ancient ruins. During the summers where I stayed home, I would hang out with my friends, go swimming in the local lakes and rivers, and volunteer in the community. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"a88747d5-5202-41a7-9c2b-4a37fb292baa\"}":{"__typename":"School","uuid":"a88747d5-5202-41a7-9c2b-4a37fb292baa","name":"Oak Ridge High School","city":"El Dorado Hills","type":"HIGH","state":"California","country":"United States","zip":"95762"},"Education:{\"uuid\":\"3c3beaba-3295-406e-84eb-16719d4b10d9\"}":{"__typename":"Education","uuid":"3c3beaba-3295-406e-84eb-16719d4b10d9","school":{"__ref":"School:{\"uuid\":\"a88747d5-5202-41a7-9c2b-4a37fb292baa\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"8d371ac6-e3a4-48a0-ac69-f210d93175a2\"}":{"__typename":"School","uuid":"8d371ac6-e3a4-48a0-ac69-f210d93175a2","name":"University of California, Davis","city":"Davis","type":"COLLEGE","state":"California","country":"United States","zip":"95616"},"Education:{\"uuid\":\"4f7339d1-7e28-46f8-a854-5b3e30ec485f\"}":{"__typename":"Education","uuid":"4f7339d1-7e28-46f8-a854-5b3e30ec485f","school":{"__ref":"School:{\"uuid\":\"8d371ac6-e3a4-48a0-ac69-f210d93175a2\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"fb40dc7d-25d0-4623-a564-362f8d9a5d29\"}":{"__typename":"MentorPublicProfile","uuid":"fb40dc7d-25d0-4623-a564-362f8d9a5d29","displayName":"Maya S.","slug":"maya-sahtout","biography":"\u003cp\u003eHello! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy name is Maya and I am a first year medical student in California, hoping to become a family medicine, pediatric, or OBGYN doctor. I studied biological sciences with a minor in cultural anthropology at UC Davis. After taking two gap years where I taught English abroad to elementary schoolers in Spain, worked as a medical assistant and scribe at an ENT clinic, volunteered with the unhoused populations in California, and traveled to the Middle East, South America and Southeast Asia, I have continued my path towards becoming a doctor. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn a typical day, I am usually studying, working on research projects, and going to yoga class or on a walk. I am currently involved in research in OBGYN, anesthesia, dermatology, and pediatrics. My research typically consists of chart review and patient recruitment. In my free time, I work as a substitute teacher for elementary to high schoolers and I participate in student organizations such as volleyball, hiking, camping, and soccer clubs. \u003c/p\u003e\u003cbr\u003e\u003cp\u003ePrior to medical school, I had the privilege of conducting research, presenting a poster, and writing a thesis on estrogen synthesis in Zebrafish. I was also granted various scholarships each year of undergrad and was awarded the Outstanding Senior Award in my major upon graduation. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am very passionate and interested in public health, addressing disparities in health, preventative health care, biology, and research. As the eldest in my family of immigrants, I had to navigate school, applying to college, and getting into medicine on my own, along with the help of amazing mentors along the way. I would love to give back and mentor others to assist them with school work, research projects, and healthcare/medicine exposure. \u003c/p\u003e","teachingVideoPlaybackId":"101iI6h24InK4yiTgFHb00Zr7xhwVE1qmNGXbhXJ500s5c","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1375fb11-f393-4179-88bf-36195a3a2bee\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"89fb36b2-ffbc-4a18-823d-8c89febee3e3\"}"},{"__ref":"CausesSupported:{\"uuid\":\"ab6f2be0-4d3a-4976-a67e-e12c671bc060\"}"}],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3094ab28-7bfd-4476-b254-6e908ffa1e0e\"}"},{"__ref":"DeepDives:{\"uuid\":\"dc9f5e88-d35e-4907-aa1a-2d9fc06c1854\"}"},{"__ref":"DeepDives:{\"uuid\":\"a538e12f-e253-4b78-bd81-2ebb18419dcc\"}"},{"__ref":"DeepDives:{\"uuid\":\"5298f4c5-e577-4cd8-abfe-c552cc1f988f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/736c685e-075b-4b38-b1e7-d96c3e6c7fa8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3c3beaba-3295-406e-84eb-16719d4b10d9\"}"},{"__ref":"Education:{\"uuid\":\"4f7339d1-7e28-46f8-a854-5b3e30ec485f\"}"}],"hiredAt":"2025-03-21T09:13:34.049Z","topics":["Algebra I","K-5 Grade Math","Biology","Chemistry","6-8 Grade Science","Executive Function","Medicine / Health","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maya-sahtout\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fb40dc7d-25d0-4623-a564-362f8d9a5d29\"}"}}},"_sentryTraceData":"21307b20cb32405ca64450c16a500df2-ba994b0cffa6f3d6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=21307b20cb32405ca64450c16a500df2,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"maya-sahtout"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInter
