xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"ffbac29f-dcb5-4a8e-ba6f-edd9d68953e9\"}":{"__typename":"DeepDives","uuid":"ffbac29f-dcb5-4a8e-ba6f-edd9d68953e9","content":"\u003cp\u003eMy dream job is to be the CEO/Founder of a company that helps others! I want my company to have a big beautiful office, a team of happy employees, and a product that makes a big impact of people's lives. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"82704ee0-2742-4308-bc3d-9b3bef7908ec\"}":{"__typename":"DeepDives","uuid":"82704ee0-2742-4308-bc3d-9b3bef7908ec","content":"\u003cp\u003eWhen COVID-19 hit, I had a lot of extra free time and decided to learn how to sew. I used my mom's old sewing machine and watched countless YouTube videos so I could get familiar with the different types of stitches. I began sewing my owns shirts and skirts, and my classmates loved them so much that they wanted to buy them from me. That's when my clothing company, Cavalloko, was born! I sold ~100 shirts and skirts to people at my school and started an Instagram page to advertise my products! It was so rewarding seeing my friends and classmates show up to school in the clothes that I made. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"9a527190-9510-44dd-a4da-55f0f8634866\"}":{"__typename":"DeepDives","uuid":"9a527190-9510-44dd-a4da-55f0f8634866","content":"\u003cp\u003e100% my mom. My mom grew up in Puerto Rico and when she turned 18, she was the first in her family to go to college, despite not knowing English! She studied law while learning English, and eventually got her law degree at Amherst College. She is now working at a biotech company where she is helping develop a cure for a rare disease that affects children's skin, causing it to peel off easily. My mom has gone against all odds, building a life for herself in the states despite her family not supporting her moving away and attending college. She has always reminded me to dream big, and has been my #1 cheerleader. I will look up to her for the rest of my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"8e5cb9d0-be15-4dd3-93c0-470a8310c8b3\"}":{"__typename":"DeepDives","uuid":"8e5cb9d0-be15-4dd3-93c0-470a8310c8b3","content":"\u003cp\u003eI have had so many amazing mentors throughout my life that have helped me accomplish some of my biggest achievements - including raising $54,000 for the Save The Children Organization and getting into my dream college. My mentors have been some of the most valuable people in my life, and I want to pay forward the guidance I've received to someone else. I am extremely passionate about building connections with others and helping them succeed in their journeys, whatever their dreams may be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"dc525c6e-abf8-45a3-9631-ca31e09373f5\"}":{"__typename":"School","uuid":"dc525c6e-abf8-45a3-9631-ca31e09373f5","name":"Tamalpais High School","city":"Mill Valley","type":"HIGH","state":"California","country":"United States","zip":"94941"},"Education:{\"uuid\":\"fb9ea188-c4bd-405f-8f59-00ec46e18e5a\"}":{"__typename":"Education","uuid":"fb9ea188-c4bd-405f-8f59-00ec46e18e5a","school":{"__ref":"School:{\"uuid\":\"dc525c6e-abf8-45a3-9631-ca31e09373f5\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"e2f35f70-be9c-4e78-9d1d-524bc4b02f4b\"}":{"__typename":"Education","uuid":"e2f35f70-be9c-4e78-9d1d-524bc4b02f4b","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Business Administration","degree":null},"MentorPublicProfile:{\"uuid\":\"345dbaa9-7e71-4559-bbb3-99ce30e17cb4\"}":{"__typename":"MentorPublicProfile","uuid":"345dbaa9-7e71-4559-bbb3-99ce30e17cb4","displayName":"Yasha P.","slug":"yasha-paola","biography":"\u003cp\u003eYasha (Ja-Sha) is a Junior at UC Berkeley pursuing a degree in Business Administration with an Environmental Economics minor. She grew up in Sausalito, CA and has always been fascinated with entrepreneurship and its potential for global impactful change.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHer passion for entrepreneurship sparked in 3rd grade when she founded Kuku Wallets - her first mini-business selling duct tape wallets and purses. In 7th grade, she realized the potential to use her entrepreneurial skills for social impact and founded Running to the Rescue, a long-term fundraiser to raise money for the Save The Children Organization. Over the span of five years Yasha organized races, summer camps, and public challenges, raising a total of $54,000 in donations for the Save the Children Organization.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Berkeley, Yasha leveraged the thriving startup ecosystem to launch Detect-Stix, her company focused on developing the world’s most advanced date-rape drug test. Detect-Stix is currently in the fundraising stage and Yasha aims to have the company well-established by graduation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond her entrepreneurial pursuits, Yasha is dedicated to mentoring others. She spent the summer of 2023 mentoring a group of Malaysian students launching an apparel company, guiding them through operational, marketing, and pitching challenges. She is also dedicated to helping high school students with their college application essays. Drawing from her own experience navigating the college application process without a counselor, she loves helping students brainstorm, write, and edit their essays. Additionally, she offers academic tutoring in K-12 English, Geometry, Algebra, and Pre-Calculus.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn her free time, Yasha loves running (she ran competitively in highschool and used to hold the school record for the 800m), hanging out with friends, sewing her own clothes, and playing with her cat, Jagger!\u003c/p\u003e","teachingVideoPlaybackId":"M7dtlqLRQ9eedSCc6Y6bZu3RK1o6io9Rs7cVd6EbqFE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ffbac29f-dcb5-4a8e-ba6f-edd9d68953e9\"}"},{"__ref":"DeepDives:{\"uuid\":\"82704ee0-2742-4308-bc3d-9b3bef
