xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"3146f652-37b5-450f-a2dc-82efc6a832b9\"}":{"__typename":"DeepDives","uuid":"3146f652-37b5-450f-a2dc-82efc6a832b9","content":"\u003cp\u003eAs I've gotten older, I've realized the importance of continuing to challenge yourself outside of the bounds of a professional or academic context. Especially in a high-achieving environment like Stanford, it can be terrifying to be a beginner at something. But I've found some of my proudest moments have come from mastering something I was previously unskilled at, or even just making the littlest bit of progress towards mastery. Thus, I've made an effort to try to learn new skills. This past quarter, one of those skills has been golfing. I never grew up going to the driving range and up until this past quarter, the closest I'd gotten to golfing was eating cheese fries on the couch at TopGolf with my friends. But after going to the driving range for the first time with one of my friends and actually being able to hit the ball by the end of a long, grueling session, I found that I'd actually enjoyed myself. This quarter, I have a weekly commitment to go to the driving range with a one of my good (and very patient) friends, and by the end of my lifetime, I hope to actually be able to make it to a proper golf course.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ee992e0f-eea9-499f-8c76-66ed0331d343\"}":{"__typename":"DeepDives","uuid":"ee992e0f-eea9-499f-8c76-66ed0331d343","content":"\u003cp\u003eMentorship is important to me because I wouldn’t have gotten to where I am today without the help of mentorship found from both formal and unexpected places. As the daughter of immigrant parents, much of my early mentorship came from sources outside of my family. From friends in grades above me to my teachers to even my small group leader, I relied heavily on what offhand advice I could get to navigate both the academic and social pressures of school and, later on, the infamous college application process. Throughout my high school career, however, I longed for a more formal mentor. Thus, my freshman year of Stanford, I joined Women in Network (WIN), a mentorship program for undergrad woman interested in careers in business and technology. Through the mentors I’ve found in this community, I managed to land my dream internship my friendship and secure a job for when I graduate. From my experiences with mentors, however, I learned that mentorship is not just about professional advice; it's about fostering community, especially for those facing unique challenges. Approaching the end of my undergraduate journey, I see the importance of paying it forward, recognizing the impact mentorship can have in shaping identity and creating opportunities. In short, learning is a journey that shouldn’t have to be navigated alone, and I hope to be a guiding hand for each of my mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"22f3aff3-4f62-402b-9b10-21d5feb739be\"}":{"__typename":"DeepDives","uuid":"22f3aff3-4f62-402b-9b10-21d5feb739be","content":"\u003cp\u003eAs a kid, I was obsessed with murder mysteries. From Poirot to Perry Mason, I would devour any book I could get my hands on and spend my Saturdays watching the TV adaptations of my favorite series. But what fascinated me the most was not the astounding abilities of these detectives to uncover the murderer based off the slightest of clues. Rather, I found the murderers themselves fascinating. I wanted to understand what exactly compelled them to commit the most heinous of human acts. I wanted to understand the human mind, even at its darkest. Over time, the childhood obsession with mystery books slowly morphed into a passion for psychology as a whole. During my time at Stanford, I've discovered whole new facets of psychology beyond the abnormal psychology of serial killers and murderers, and I've seen the way psychology touches every aspect of human life. I'm currently working as a Research Assistant in the Culture \u0026amp; Emotion lab at Stanford where we're studying the effects of ideal emotions and responses to good news on relationship satisfaction in American and Japanese couples. And, from time to time, I still return to the books that started it all.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"21beef00-e49c-49a1-8c79-4a54f6fb9b00\"}":{"__typename":"DeepDives","uuid":"21beef00-e49c-49a1-8c79-4a54f6fb9b00","content":"\u003cp\u003eIn my spare time, I love to travel. Growing up, holidays and summers were spent abroad visiting family, from Malaysia to Australia to the Netherlands. As I've gotten older, the trips have now been more self-organized. During my freshman year while school and work was still online, I was fortunate to spend spring quarter and summer living in Oahu while was my sister was filming a documentary. This past summer, I got to travel all across the US, from New York and DC to Chicago to most of the West Coast, staying with friends while I worked a tech job remotely. After I graduate, I hope to spend some time backpacking in South America and to get my diving certification in Thailand before I start work full time. Overall, seeing the world is something that is a big priority in my life and what I love to do with my spare time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"0665dc2c-3588-40a9-8435-6c790bbd04d4\"}":{"__typename":"School","uuid":"0665dc2c-3588-40a9-8435-6c790bbd04d4","name":"Klein High School","city":"Klein","type":"HIGH","state":"Texas","country":"United States","zip":"77379"},"Education:{\"uuid\":\"8b335688-87e0-40ab-abdb-ab350886abb8\"}":{"__typename":"Education","uuid":"8b335688-87e0-40ab-abdb-ab350886abb8","school":{"__ref":"School:{\"uuid\":\"0665dc2c-3588-40a9-8435-6c790bbd04d4\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"b8f5267e-ecff-45c3-9486-11804aa86a27\"}":{"__typename":"Education","uuid":"b8f5267e-ecff-45c3-9486-11804aa86a27","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science \u0026 Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"63cb3b04-d473-4841-8b59-54c191f6ced0\"}":{"__typename":"MentorPublicProfile","uuid":"63cb3b04-d473-4841-8b59-54c191f6ced0","displayName":"Jasmine V.","slug":"jasmine-vonk","biography":"\u003cp\u003eI’m currently a Coterm student at Stanford University finishing up a BA in Psychology and a Masters of Science in Computer Science, with a focus on Human-Computer Interaction.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my first year at Stanford, I worked as a Marketing \u0026amp; Communications intern for an EdTech startup based out of Singapore, developing and implementing a marketing and SEO strategy. Through this internship, I realized my passion for problem-solving in team settings and pivoted to management consulting. For the past two summers, I worked as a Summer Business Analyst at McKinsey \u0026amp; Company, helping build tailored solutions for our clients and exploring a wide range of industries from sustainability to petrochemicals to tech.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis past summer, I'm took the interpersonal and technical skills I've learned to the tech industry to intern as a Project Manager in the Product Operations branch at the mid-sized software company Alteryx. After I graduate, however, I will be returning to McKinsey full-time as a Business Analyst.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile at Stanford, I’ve been a part of Stanford Consulting, a student-run consulting organization focused on providing students with real-world experience and providing clients with results.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not attending classes or hopping on client calls, I’m working as a Research Assistant in Professor Jeanne Tsai’s Culture \u0026amp; Emotion lab. I’m currently helping run a study investigating the effects of ideal emotions and responses to good news on relationship satisfaction in American and Japanese couples.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my spare time, I love travelling the world, trying new foods, and testing out my psych theories on my significant other.\u003c/p\u003e","teachingVideoPlaybackId":"azPPevN7026u600MVAZgGvCvmz3pJzVFs2TC5FJBqvt5s","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science \u0026 Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3146f652-37b5-450f-a2dc-82efc6a832b9\"}"},{"__ref":"DeepDives:{\"uuid\":\"ee992e0f-eea9-499f-8c76-66ed0331d343\"}"},{"__ref":"DeepDives:{\"uuid\":\"22f3aff3-4f62-402b-9b10-21d5feb739be\"}"},{"__ref":"DeepDives:{\"uuid\":\"21beef00-e49c-49a1-8c79-4a54f6fb9b00\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0c7f3eff-b57a-4c64-9cf9-2facd4a01dec/-/preview/-/format/jpg/","https://ucarecdn.com/d7120e3d-41b7-4d1d-b02d-ab7ac3867f22/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8b335688-87e0-40ab-abdb-ab350886abb8\"}"},{"__ref":"Education:{\"uuid\":\"b8f5267e-ecff-45c3-9486-11804aa86a27\"}"}],"hiredAt":"2024-01-02T19:15:31.406Z","topics":[],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jasmine-vonk\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"63cb3b04-d473-4841-8b59-54c191f6ced0\"}"}}},"_sentryTraceData":"89f1542f81fa4df6bdbf06edfccdcd60-987b9082781d13ad-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=89f1542f81fa4df6bdbf06edfccdcd60,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jasmine-vonk"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'})
