xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"edff7841-599d-4161-8dca-a4ef463d7ddd\"}":{"__typename":"Favorites","uuid":"edff7841-599d-4161-8dca-a4ef463d7ddd","photoUrl":"https://ucarecdn.com/eaaa6672-1c30-4acd-b60e-bb11d65503ea/","title":"Henrik Lundqvist","type":"ATHLETE"},"Favorites:{\"uuid\":\"08872662-a0f9-4830-bf1a-ff2897b5c5e3\"}":{"__typename":"Favorites","uuid":"08872662-a0f9-4830-bf1a-ff2897b5c5e3","photoUrl":"https://ucarecdn.com/784a7ef3-7eb9-46dc-83fb-4dcdda0894de/","title":"New York","type":"CITY"},"Favorites:{\"uuid\":\"b63a6865-ec3e-465b-9e65-b128c4f7c3ab\"}":{"__typename":"Favorites","uuid":"b63a6865-ec3e-465b-9e65-b128c4f7c3ab","photoUrl":"https://ucarecdn.com/b2075670-e842-4944-a95d-743b94112ea4/","title":"New York Rangers","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2dfb8589-ceed-4942-bfce-d23682fc71ba\"}":{"__typename":"DeepDives","uuid":"2dfb8589-ceed-4942-bfce-d23682fc71ba","content":"\u003cp\u003eMy dream job is to be the General Manager of an NHL team. I’m drawn to the challenge of building a team that a community can truly root for, not just a winning roster, but a shared identity. The role combines high-level decision-making, scouting, and long-term vision, all in service of creating something sustainable, competitive, and deeply connected to the people who support it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ce991396-b2f1-47dc-8be7-50f74062e62f\"}":{"__typename":"DeepDives","uuid":"ce991396-b2f1-47dc-8be7-50f74062e62f","content":"\u003cp\u003eI'm currently working on a fiction novel titled The First Flame, a character-driven story set on a fictional planet within an original solar system, as it enters its space race. The book blends science fiction with political intrigue, history, and personal legacy, drawing inspiration from real-world exploration, Cold War rocketry, and my interest in how ambition and identity collide. The world features multiple continents, cultures, and political Houses, each with their own traditions, tensions, and relationships to science and power. It’s been a rewarding creative outlet that lets me explore complex ideas while grounding them in human relationships and emotional stakes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"bb41740d-7ec3-4142-a591-22d599d160f6\"}":{"__typename":"DeepDives","uuid":"bb41740d-7ec3-4142-a591-22d599d160f6","content":"\u003cp\u003eIn 2017, I climbed Mount Kilimanjaro with my mom and a group of nine others. While it’s not the most dangerous mountain, the challenge was more mental than physical, waking up at midnight for summit day, pushing through altitude fatigue, and staying focused step by step. Reaching the top of one of the Seven Summits was an unforgettable experience, and sharing it with my mom made it even more meaningful. It’s something I’m deeply proud of.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"cd04f0f3-7c7d-4fad-be53-9f99fe88f0f2\"}":{"__typename":"DeepDives","uuid":"cd04f0f3-7c7d-4fad-be53-9f99fe88f0f2","content":"\u003cp\u003eKeep an open mind. You don’t need to have everything figured out yet, and that’s okay. Stay curious, learn about anything and everything, even if it doesn’t seem “useful” at the time. The more you explore, the more you’ll find unexpected connections between things, and that’s where a lot of the best ideas come from.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}":{"__typename":"School","uuid":"375c6521-abfd-4666-859e-1190f187c648","name":"Collegiate School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10069"},"Education:{\"uuid\":\"2f62a7db-eb18-4c0e-98f0-a35ded578ee5\"}":{"__typename":"Education","uuid":"2f62a7db-eb18-4c0e-98f0-a35ded578ee5","school":{"__ref":"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}"},"startYear":"2007","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"8ea92bec-ea4e-4ecf-87c0-8bffdde78bea\"}":{"__typename":"Education","uuid":"8ea92bec-ea4e-4ecf-87c0-8bffdde78bea","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Government","degree":null},"MentorPublicProfile:{\"uuid\":\"f8476a0c-6362-4f0c-9220-d011a91452bb\"}":{"__typename":"MentorPublicProfile","uuid":"f8476a0c-6362-4f0c-9220-d011a91452bb","displayName":"Sam H.","slug":"samuel-henes","biography":"\u003cp\u003eSam studied Government at Georgetown University, where he explored the intersections of law, policy, international affairs, and communication through both classroom and hands-on experiences. He has interned in the offices of Senator Cory Booker and leading law firms like Paul, Weiss and Kirkland \u0026amp; Ellis, where he gained exposure to complex legal and policy matters. He’s also volunteered for multiple political campaigns, developing a grounded understanding of how political strategy and messaging operate in real time.\u003c/p\u003e\u003cp\u003eOutside the political and legal arenas, Sam has long been immersed in the world of sports. A lifelong hockey fan, he writes about the New York Rangers, his favorite team, for The Hockey Writers, combining analytics, scouting insights, and narrative storytelling. He’s especially drawn to the challenge of evaluating young players and understanding how skill, mindset, and context shape their development.\u003c/p\u003e\u003cp\u003eIn 2017, at age 15, Sam summited Mount Kilimanjaro. The climb sparked a broader curiosity about resilience, adventure, and the natural world. That experience led him down a rabbit hole of exploration literature, from Shackleton’s Endurance to the first ascent of Everest by Sir Edmund Hillary and Tenzing Norgay, and deepened his interest in how people confront uncertainty and push their limits. Today, that same sense of curiosity drives his interest in space travel, frontier discovery, and the kinds of stories that sit at the edge of what’s possible.\u003c/p\u003e\u003cp\u003eSam is also an avid creative writer and journalist, with a focus on character-driven storytelling and asking difficult, often open-ended questions. Whether writing about hockey prospects or imagined worlds, he aims to bring a blend of depth, clarity, and curiosity to his work.\u003c/p\u003e\u003cp\u003eA dedicated golfer, Sam competed throughout high school and finished 24th in the New York State championship as a sophomore. He still plays regularly and enjoys the mental challenge of the game. He even made a hole-in-one on a Par 4 while playing with his younger brother recently.\u003c/p\u003e\u003cp\u003eSam also loves helping his four younger siblings with their homework and school projects. Whether proofreading essays, explaining how bills become laws, or creating a model of the solar system, he finds joy in making learning feel exciting and collaborative.\u003c/p\u003e\u003cp\u003eHis work across politics, law, sports, and storytelling reflects a habit of deep engagement and a belief that the best ideas often live where different disciplines and perspectives meet. He’s especially excited by the opportunity to share his interests with others while also learning from the perspectives, questions, and experiences of those he mentors.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"X4dKIx1dF7u7M01kNY6RvEt7Z6XlRY7a34Whj018u5801E","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’ve been playing golf since I was little, and I’m proud to say I’ve made not one, but two holes-in-one. One of them was on a par 3, which is exciting enough. But the other was on a par 4, which still feels surreal to say out loud. I was playing with my younger brother, and we watched the ball bounce, roll, and just disappear. It’s the kind of thing you dream about and never really expect to happen. It didn’t earn me a trophy or headline, but moments like that, where preparation meets just a little bit of magic, stick with you.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"edff7841-599d-4161-8dca-a4ef463d7ddd\"}"},{"__ref":"Favorites:{\"uuid\":\"08872662-a0f9-4830-bf1a-ff2897b5c5e3\"}"},{"__ref":"Favorites:{\"uuid\":\"b63a6865-ec3e-465b-9e65-b128c4f7c3ab\"}"}],"causesSupported":[],"major":"Government","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2df
