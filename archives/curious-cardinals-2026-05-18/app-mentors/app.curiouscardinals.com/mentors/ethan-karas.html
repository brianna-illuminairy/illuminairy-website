xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a2c65c32-5cf0-4979-a2ce-4d1b2b2e33b4\"}":{"__typename":"Favorites","uuid":"a2c65c32-5cf0-4979-a2ce-4d1b2b2e33b4","photoUrl":"https://ucarecdn.com/d6a606a2-1989-4717-a4aa-1db75ddda58a/","title":"One Hundred Years of Solitude","type":"BOOK"},"Favorites:{\"uuid\":\"44d6e859-78fa-4c83-99a9-acfe1faf2dcd\"}":{"__typename":"Favorites","uuid":"44d6e859-78fa-4c83-99a9-acfe1faf2dcd","photoUrl":"https://ucarecdn.com/97a82988-5821-48d6-8643-2564d05837af/","title":"Songs in the Key of Life","type":"ALBUM"},"Favorites:{\"uuid\":\"8dd06e74-c638-445d-aac7-ad11c3dffda2\"}":{"__typename":"Favorites","uuid":"8dd06e74-c638-445d-aac7-ad11c3dffda2","photoUrl":"https://ucarecdn.com/e757c4ab-30c0-408e-8ae3-4ed8bb1468e3/","title":"New York Yankees","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fa921a3d-38e0-4a10-8d51-f5eb71769100\"}":{"__typename":"DeepDives","uuid":"fa921a3d-38e0-4a10-8d51-f5eb71769100","content":"\u003cp\u003eI would be nothing without the mentors in my life who have gotten me to where I am today, and I'm a big believer in paying it forward! Some of the best teachers in my life have not just given me knowledge on a subject, but the tools and confidence to tackle any challenge life throws my way. I would love to do the same for the students I mentor!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"acaa0412-a01a-4ead-a350-87892ca25d3e\"}":{"__typename":"DeepDives","uuid":"acaa0412-a01a-4ead-a350-87892ca25d3e","content":"\u003cp\u003eWhile in high school, I interviewed immigrant families in the community to create a cookbook, combining their stories of their cultures with their favorite recipes. I then used proceeds from the book sales to raise money for Neighbor's Link, a local charity helping immigrants integrate into the local community. It meant a lot to have community members trust me with their stories, and to be able to give back to a charity that does so much!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"7e7bd9ad-1606-4449-841e-c023050bdb01\"}":{"__typename":"DeepDives","uuid":"7e7bd9ad-1606-4449-841e-c023050bdb01","content":"\u003cp\u003eMy great-great-grandmother Sadie Schultz, who was head of the Kosher kitchen at Ellis Island, overseeing thousands of meals served every day to people arriving in a country where they might not even have spoken the language. Her ability to welcome others  is something that inspires me to this day, and also fuels my love of cooking!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"41b000ff-ebb3-4a89-8375-d49f69b05fba\"}":{"__typename":"DeepDives","uuid":"41b000ff-ebb3-4a89-8375-d49f69b05fba","content":"\u003cp\u003eAs mentioned in a separate answer, I love to cook, especially for my friends and family. I'm also a massive fan of the outdoors, and when I'm home, I love to go hiking with friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f9064e48-fa67-4fe2-9a37-d489f120a7b3\"}":{"__typename":"School","uuid":"f9064e48-fa67-4fe2-9a37-d489f120a7b3","name":"Fox Lane High School","city":"Bedford","type":"HIGH","state":"New York","country":"United States","zip":"10506"},"Education:{\"uuid\":\"6b91f4a7-67fc-4a9b-8b11-9c9227db984e\"}":{"__typename":"Education","uuid":"6b91f4a7-67fc-4a9b-8b11-9c9227db984e","school":{"__ref":"School:{\"uuid\":\"f9064e48-fa67-4fe2-9a37-d489f120a7b3\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"1e49a3af-9ecf-4fc0-9f18-546f2f4a3b04\"}":{"__typename":"Education","uuid":"1e49a3af-9ecf-4fc0-9f18-546f2f4a3b04","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Theater and Entrepreneurship","degree":null},"MentorPublicProfile:{\"uuid\":\"ab430431-beff-45bb-890b-56906ccdc5ae\"}":{"__typename":"MentorPublicProfile","uuid":"ab430431-beff-45bb-890b-56906ccdc5ae","displayName":"Ethan K.","slug":"ethan-karas","biography":"\u003cp\u003eHiya! My name is Ethan, I'm a rising Senior at Northwestern studying Theatre and Entrepreneurship, and I'm dedicated to helping students reach their full potential while fostering a love for learning. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passion for theater and culture has taken me to Chicago, New York, Edinburgh, and Avignon, and I have extensive experience bringing passion projects to life, from writing a cookbook to successfully applying for research grants to travel abroad.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've been tutoring students of all grade levels since high school. My goal is to create a learning environment that's fun, focused, and exciting, where students feel empowered to ask questions and explore their interests. I believe every student can excel with the right guidance and support, and I tailor my approach to meet each student's unique needs and learning style!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","teachingVideoPlaybackId":"00Sk1HldweopDyafHcJu4IZR3tWBVy85n4qzY01xhVuHU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a2c65c32-5cf0-4979-a2ce-4d1b2b2e33b4\"}"},{"__ref":"Favorites:{\"uuid\":\"44d6e859-78fa-4c83-99a9-acfe1faf2dcd\"}"},{"__ref":"Favorites:{\"uuid\":\"8dd06e74-c638-445d-aac7-ad11c3dffda2\"}"}],"causesSupported":[],"major":"Theater and Entrepreneurship","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fa921a3d-38e0-4a10-8d51-f5eb71769100\"}"},{"__ref":"DeepDives:{\"uuid\":\"acaa0412-a01a-4ead-a350-87892ca25d3e\"}"},{"__ref":"DeepDives:{\"uuid\":\"7e7bd9ad-1606-4449-841e-c023050bdb01\"}"},{"__ref":"DeepDives:{\"uuid\":\"41b000ff-ebb3-4a89-8375-d49f69b05fba\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/274f1116-05a6-4e82-9080-507657afca20/-/preview/-/format/jpg/","https://ucarecdn.com/5f439359-9b93-4011-b4cf-3313f5004618/-/preview/-/format/jpg/","https://ucarecdn.com/469ad30b-3398-4666-b387-ea033364271c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"6b91f4a7-67fc-4a9b-8b11-9c9227db984e\"}"},{"__ref":"Education:{\"uuid\":\"1e49a3af-9ecf-4fc0-9f18-546f2f4a3b04\"}"}],"hiredAt":"2024-07-19T11:44:54.909Z","topics":["Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","History","Creative Writing","Music","Film / Theater","History Pro
