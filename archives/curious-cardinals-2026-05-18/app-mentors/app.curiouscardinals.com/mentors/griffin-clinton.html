xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f29c53b7-30fd-41f1-b90a-7d1f26e03c4d\"}":{"__typename":"DeepDives","uuid":"f29c53b7-30fd-41f1-b90a-7d1f26e03c4d","content":"\u003cp\u003eTo make use of your mistakes. It's one thing to know that you're supposed to learn from your mistakes, but it's a whole other beast actually internalizing, seeing, and growing from them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere came a point in my athletic, and academic careers (around 15/16 and definitely as college applications crept closer) where I began to feel ashamed because I was plateauing. I didn't know why I wasn't improving in any subject and particularly not in soccer, but I kept refusing to look at it. As a result, I lost a lot of my passion for learning and soccer during the latter stages of my high school years. I wish that I'd been able to put my pride aside and be brave enough to face those deficiencies with the same drive that I'd had for so many years.   \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"0ec60439-25ef-4e0e-ac35-ca38040b50b9\"}":{"__typename":"DeepDives","uuid":"0ec60439-25ef-4e0e-ac35-ca38040b50b9","content":"\u003cp\u003eI'm currently trying to run a monthly philosophy/academic paper reading club. After graduating, many of my friends expressed a desire to feel academically challenged as their current job/situation didn't have that quality.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"b40520cf-7db7-4479-8c6e-4fd0d26a2967\"}":{"__typename":"DeepDives","uuid":"b40520cf-7db7-4479-8c6e-4fd0d26a2967","content":"\u003cp\u003eGrowing up my role models were the people I would see on television: some good influences (Ben10, Naruto, Luffy) and some really bad (Bill Cosby). I've come to realize that celebrity worship is a futile exercise, and as a result, I've found much more inspiration in the stories of those who have dedicated their lives to making the world a better place.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm inspired everyday knowing there are people like Rosa Luxemburg, George Jackson, Thomas Sankara, and Malcolm X who fought for the marginalized and oppressed peoples of the World.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"15da5e5b-b99f-4dab-b275-1017ccf6ddaa\"}":{"__typename":"DeepDives","uuid":"15da5e5b-b99f-4dab-b275-1017ccf6ddaa","content":"\u003cp\u003eWhen I arrived at college, I didn't know what I wanted to study so, I just went with the majority influence on the soccer team: economics. It wasn't for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter my gap year during Covid, I returned much happier and much more excited about learning so I decided to pursue my love for storytelling (and science fiction) by declaring for English. During that time, I discovered my own love for writing and language. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}":{"__typename":"School","uuid":"e5a76254-778b-4843-9fe4-18689765e318","name":"Sidwell Friends School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20016"},"Education:{\"uuid\":\"5feed14f-ed12-42c7-9d02-1fcf7a9fc58e\"}":{"__typename":"Education","uuid":"5feed14f-ed12-42c7-9d02-1fcf7a9fc58e","school":{"__ref":"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}"},"startYear":"2014","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"274f76b5-d171-4071-af7b-babe99019c94\"}":{"__typename":"School","uuid":"274f76b5-d171-4071-af7b-babe99019c94","name":"Middlebury College","city":"Middlebury","type":"COLLEGE","state":"Vermont","country":"United States","zip":"05753"},"Education:{\"uuid\":\"e3a6be8f-5e48-4e95-96ed-cb6ded39e3b0\"}":{"__typename":"Education","uuid":"e3a6be8f-5e48-4e95-96ed-cb6ded39e3b0","school":{"__ref":"School:{\"uuid\":\"274f76b5-d171-4071-af7b-babe99019c94\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"English","degree":null},"Testimonial:3fa02fac-fd07-41da-96df-628b8f3b14fc":{"__typename":"Testimonial","id":"3fa02fac-fd07-41da-96df-628b8f3b14fc","text":"Griffin has been the best mentor for a slightly moody 15 year old boy.  His expertise and knowledge of soccer has been the key in winning him over and my son looks forward to his weekly meetings.","date":"2025-05-21 13:28:15.001+00","rating":5,"endorser":{"__typename":"Endorser","name":"Risa Shimazaki","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"ec21f663-b2d5-430f-958e-de98ec63c868\"}":{"__typename":"MentorPublicProfile","uuid":"ec21f663-b2d5-430f-958e-de98ec63c868","displayName":"Griffin C.","slug":"griffin-clinton","biography":"\u003cp\u003eHey there! I am a recent graduate of Middlebury College, where I studied English and Spanish. At Middlebury, I worked as a peer writing tutor, played for the Men’s Varsity Soccer team, and wrote for Middlebury’s satire paper \u003cem\u003eThe Local Noodle\u003c/em\u003e.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am passionate about the reading and writing process and making it as enjoyable for others as it is for me. I love creating projects and analyzing (and enjoying) the storytelling of different sorts of works (television, novels, scientific papers).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have been tutoring in English/Spanish since high school and have also worked with middle and highs school kids as a soccer coach, so I take great pride in fostering supportive tutoring environments where students feel heard and empowered. I am a resource for traditional learning, but also for all things creative, I used to stream on Twitch, create videos for YouTube and Instagram, and written analytical essays on films.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time I like to watch the Premier League, read science fiction and philosophy essays, and play video games like Valorant and Deadlock.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy favorite television series is Mad Men. My favorite (recently seen) movie is Gattaca. My favorite anime series is Code Geass. My favorite city is Madrid. And my favorite soccer player is Lionel Messi.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI look forward to working with you and your child!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"DuqqPOrcdwog8aLF5FzIz026zNYZ02GeyHDkuhKNGenhw","teachingVideoDescription":null,"greatestAchievement":null,"fa
