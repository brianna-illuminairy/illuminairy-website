xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3cd6b431-4f91-49d7-9432-f8a691ab8e90\"}":{"__typename":"Favorites","uuid":"3cd6b431-4f91-49d7-9432-f8a691ab8e90","photoUrl":"https://ucarecdn.com/ea1754e0-3013-4958-95be-592654a14329/","title":"Ignition! ","type":"BOOK"},"Favorites:{\"uuid\":\"a35532c4-4985-48d5-af56-aec4f2aa4680\"}":{"__typename":"Favorites","uuid":"a35532c4-4985-48d5-af56-aec4f2aa4680","photoUrl":"https://ucarecdn.com/d1afbb9a-8b71-45e8-95dd-729274a069a7/","title":"The Martian","type":"MOVIE"},"Favorites:{\"uuid\":\"4f3a0da6-568b-48dc-a34d-e6c9a3f85a1a\"}":{"__typename":"Favorites","uuid":"4f3a0da6-568b-48dc-a34d-e6c9a3f85a1a","photoUrl":"https://ucarecdn.com/5906da9e-b531-4d4e-8acb-e4f5c5b68b13/","title":"Miami","type":"CITY"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"00db10b1-d521-491c-b034-81f7f7dc6a08\"}":{"__typename":"DeepDives","uuid":"00db10b1-d521-491c-b034-81f7f7dc6a08","content":"\u003cp\u003eIn my Junior year, I decided I wanted to learn how rocket engines worked and design one of my own. With the advice and mentorship of a Curious Cardinals mentor Blake, I started researching and learning, eventually progressing to the point where I was able to start designing in earnest. By the end of it, I had a full 3D model of an engine that would (at least on paper) produce two thousand pounds of thrust! More importantly, through Blake's mentorship, I gained confidence in my own abilities as an engineer, skills in research and project management, and made a lasting connection to a mentor in my field.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3fa1311e-258c-41a8-9930-b9f53b0cc0dc\"}":{"__typename":"DeepDives","uuid":"3fa1311e-258c-41a8-9930-b9f53b0cc0dc","content":"\u003cp\u003eWhen I was nine, the NASA Curiosity rover was about to launch, and my Mom took me to the Johnson space center to learn about it. Since then, I have been fascinated by space. I knew I wanted to work on the next generation of spacecraft, which would take humans to Mars and beyond. Pursuing aerospace engineering at MIT gives me the opportunity to be at the cutting edge of space vehicle engineering. At MIT's Space Propulsion Laboratory, I am designing thrusters that will teach us more about the physics of electrospray, a critical technology for the next era of spaceflight. My passion for pushing human exploration forward has lead me to pursue my major.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0943b7aa-2798-4bd3-bb99-f1477aa6f09b\"}":{"__typename":"DeepDives","uuid":"0943b7aa-2798-4bd3-bb99-f1477aa6f09b","content":"\u003cp\u003eEvery day, my uncle wakes up, fixes a pot of coffee, and reads the newspaper until my aunt gets up. During one stay with him when I was six years old, in order to preserve some peace and quiet, he handed me the comic section, and his morning routine became our morning tradition. Since then, reading has been a way for me to connect with others. I read in order to stay informed, engage with communities that share my passion, and explore perspectives that are entirely outside of my worldview.\u0026nbsp;When I moved to college, I needed eight U-Haul boxes to pack up the books that filled my room. Reading exposes me to new and diverse topics, but it is only so meaningful because it represents the connections I have formed between my family and friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1b64b6b3-86f8-429c-8631-3df64a23fd3f\"}":{"__typename":"DeepDives","uuid":"1b64b6b3-86f8-429c-8631-3df64a23fd3f","content":"\u003cp\u003eIf I could give my younger self one piece of advice, it would be to be less afraid of trying. It's pretty easy to dismiss an idea or a dream because you feel you haven't learned enough, or don't have the skills. But when I learned to be ok with the idea of failure, and recognize when I needed support, I was amazed at what I was able to accomplish. My goal as a mentor is to make sure that students don't feel defeated before they even begin, and to approach every problem and challenge as solvable!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}":{"__typename":"School","uuid":"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a","name":"Massachusetts Institute of Technology","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02139"},"Education:{\"uuid\":\"588001da-9528-44dc-9812-3203fccb8e86\"}":{"__typename":"Education","uuid":"588001da-9528-44dc-9812-3203fccb8e86","school":{"__ref":"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Aerospace Engineering","degree":"B.S."},"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}":{"__typename":"School","uuid":"1dc8c564-7629-4af5-851c-69ed64a8870e","name":"Ransom Everglades High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33133"},"Education:{\"uuid\":\"1cd78bf0-784a-4682-aa46-8727c818e862\"}":{"__typename":"Education","uuid":"1cd78bf0-784a-4682-aa46-8727c818e862","school":{"__ref":"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"59ede164-01d6-40d8-b736-b6e3c665893e\"}":{"__typename":"MentorPublicProfile","uuid":"59ede164-01d6-40d8-b736-b6e3c665893e","displayName":"Dashiell D.","slug":"dashiell-destefano","biography":"\u003cp\u003eDashiell is a sophomore at MIT pursuing a major in Aerospace Engineering and a minor in Public Policy. He is from Miami, FL, where he graduated from Ransom Everglades cum laude. There, he was the president of the robotics program and the captain of the congressional debate team. While Dashiell is excited to work on any engineering problem, and is interested in policy and social justice, his primary passion is all things space—he even keeps a telescope in his dorm room to take out on clear nights. In high school, he did a Curious Cardinals passion project of his own, where he worked with a mentor to design a liquid rocket engine. This was a formative experience for him not just as an engineer, but as a learner, and he is thrilled at the opportunity to pass it on. Dashiell is now a researcher at MIT’s Space Propulsion Laboratory, where he is attempting to better measure the behavior of electrospray thrusters for small satellites. To that end, he has developed a new imaging and image processing technique for experiments in the lab, and designed, manufactured, and test-fired a novel thruster design. In the future, he hopes to work on propulsion systems for human spaceflight. In his free time, Dashiell loves hiking, watersports, or just being outside. He’s an avid reader of mainly science fiction, but his favorite book is Ignition! by John D. Clark. His friends would describe him as outgoing, caring, and hard-working, if a little silly. He is a dreamer at heart, and is excited to work with students to fulfill theirs!\u003c/p\u003e","teachingVideoPlaybackId":"02zSfoEiM02remxBpkPtDhsUNGZpT01U6jNC29wwjUt7KQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3cd6b431-4f91-49d7-9432-f8a691ab8e90\"}"},{"__ref":"Favorites:{\"uuid\":\"a35532c4-4985-48d5-af56-aec4f2aa4680\"}"},{"__ref":"Favorites:{\"uuid\":\"4f3a0da6-568b-48dc-a34d-e6c9a3f85a1a\"}"}],"causesSupported":[],"major":"Aerospace Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"00db10b1-d521-491c-b034-81f7f7dc6a08\"}"},{"__ref":"DeepDives:{\"uuid\":\"3fa1311e-258c-41a8-9930-b9f53b0cc0dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"0943b7aa-2798-4bd3-bb99-f1477aa6f09b\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b64b6b3-86f8-429c-8631-3df64a23fd3f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/470bb286-fb3b-41c1-a636-28ae5930fb3c/-/crop/3024x3026/0,75/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"588001da-9528-44dc-9812-3203fccb8e86\"}"},{"__ref":"Education:{\"uuid\":\"1cd78bf0-784a-4682-aa46-8727c818e862\"}"}],"hiredAt":"2023-04-24T03:07:55.841Z","topics":["Robotics / Electronics / CAD","Coding / Programming","Aviation / Aerospace","Statistics","Precalculus / Trigonometry","Pre-Algebra","Geometry","Calculus","Algebra I","Algebra II","Physics","STEM Project"],"communityBadges":["https://ucarecdn.com/7888bd4b-612e-4eb6-94e7-3442bd9a4a01/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"dashiell-destefano\"}})"
