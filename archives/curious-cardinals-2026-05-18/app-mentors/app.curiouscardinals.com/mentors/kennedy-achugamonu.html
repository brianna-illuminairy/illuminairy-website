xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5d12d4cc-8e86-4abc-aa2d-501cd10f27dc\"}":{"__typename":"Favorites","uuid":"5d12d4cc-8e86-4abc-aa2d-501cd10f27dc","photoUrl":"https://ucarecdn.com/72d38870-1d9f-46b6-ae03-0b60f044594b/","title":"Creed","type":"MOVIE"},"Favorites:{\"uuid\":\"c84f8b94-be40-4560-b5d8-974add32f29e\"}":{"__typename":"Favorites","uuid":"c84f8b94-be40-4560-b5d8-974add32f29e","photoUrl":"https://ucarecdn.com/825cdf95-28fa-444a-83f5-a5e48d42dd24/","title":"NBA 2K17","type":"GAME"},"Favorites:{\"uuid\":\"d87db33a-4511-4f03-83c9-07329cf49165\"}":{"__typename":"Favorites","uuid":"d87db33a-4511-4f03-83c9-07329cf49165","photoUrl":"https://ucarecdn.com/49ccf30b-0c85-4b60-8743-4c36b80c1552/","title":"Basketball","type":"SPORT"},"CausesSupported:{\"uuid\":\"6db2f708-c963-4b09-a99d-beda1f5eab96\"}":{"__typename":"CausesSupported","uuid":"6db2f708-c963-4b09-a99d-beda1f5eab96","name":"Habitat For Humanity","description":"\u003cp\u003eAn organization that helps build houses for homeless and low-income families.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/688deaad-9182-44fc-bb7f-0f5acaad69e8/"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9102b176-745d-421c-9d8d-708f1767af5e\"}":{"__typename":"DeepDives","uuid":"9102b176-745d-421c-9d8d-708f1767af5e","content":"\u003cp\u003eIn my high school summers, I spent time working with computer science and coding teams to teach students Python and work on web development. Also, I spent time in my native country of Nigeria, getting closer to my heritage and exposing myself to new settings.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2c773e73-facb-40ec-b5c7-f4c9c5064670\"}":{"__typename":"DeepDives","uuid":"2c773e73-facb-40ec-b5c7-f4c9c5064670","content":"\u003cp\u003eIf I could give advice to my high school self, it would be to have patience. In high school, a lot of my peers had access to a lot of opportunities I didn't and I thought I was behind in my journey. As I transitioned into college, I experienced the same thing. However, I realized that I needed to switch my mentality to capitalize on where I was in that moment or I would let my current opportunities pass me by. It was when I made this mind shift that new, amazing opportunities started coming my way. To get to your desired future, you must capitalize on your now.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a7c84007-e90c-4229-982a-8c118cb75bcc\"}":{"__typename":"DeepDives","uuid":"a7c84007-e90c-4229-982a-8c118cb75bcc","content":"\u003cp\u003eMentorship matters a lot to me because I know firsthand the effects of lack of guidance on an individual's journey. Many pieces of advice can be given to individuals to help them develop themselves holistically and avoid negative situations. In society, many voices and influences can misguide. Mentors must steer mentees on the right path, helping them find their passions and desires. A great relationship between a mentor and mentee allows both parties to effectively communicate with each other and understand each other's thinking, causing a genuine bond that reaps many benefits. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"948f6c08-9362-4935-9e47-7817e4e9ae49\"}":{"__typename":"DeepDives","uuid":"948f6c08-9362-4935-9e47-7817e4e9ae49","content":"\u003cp\u003eAs a child, I was infatuated with CPUs, phone models, and gaming. I used to watch endless YouTube videos about them just to learn more. When I entered high school, I transitioned into a passion for creating apps that could connect people from different parts of the world, giving better access to certain regions and combining shared interests. I realized that majoring in computer science would give me a lot of exposure to what will help me create the apps that I want to in the future. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"f1a7250c-07a7-4fc3-a1d6-7ce86b1c6535\"}":{"__typename":"School","uuid":"f1a7250c-07a7-4fc3-a1d6-7ce86b1c6535","name":"Christ School","city":"Arden","type":"HIGH","state":"North Carolina","country":"United States","zip":"28704"},"Education:{\"uuid\":\"eb5f0550-d97d-4d3c-8750-c988a6c6aaec\"}":{"__typename":"Education","uuid":"eb5f0550-d97d-4d3c-8750-c988a6c6aaec","school":{"__ref":"School:{\"uuid\":\"f1a7250c-07a7-4fc3-a1d6-7ce86b1c6535\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"71d15680-963c-4cc3-bd66-a3f9e6fd42e9\"}":{"__typename":"Education","uuid":"71d15680-963c-4cc3-bd66-a3f9e6fd42e9","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"b129ee67-dd5a-4983-a53c-3329becffab7\"}":{"__typename":"MentorPublicProfile","uuid":"b129ee67-dd5a-4983-a53c-3329becffab7","displayName":"Kennedy A.","slug":"kennedy-achugamonu","biography":"\u003cp\u003eHey everybody! I am Kennedy Achugamonu and I currently study Computer Science and Finance at Duke University. With passions in app development, consulting, business, and finance, I desire to find intersections with all these fields. Outside of this, I am very passionate about mentorship and student programs. Growing up as a Nigerian American in a low-income community, I wasn't fortunate enough to have mentors in my journey. I desire to be a guide and voice for students on their life and academic journeys and impart the useful knowledge that I acquired on my own. For fun, I love to play basketball, hang out with friends, watch basketball/football games, and sing. I look forward to meeting you all!\u003c/p\u003e","teachingVideoPlaybackId":"MH1SQhtiBemVVbg9JbtODt4Xm4OllHiApk66Wx39cgI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was getting into Duke University. Coming from an immigrant background, the elation I felt when I achieved something my parents sacrificed so much for was indescribable. Duke has now allowed me to learn from and connect with individuals who will allow me to pursue my interests in community development, mentorship, and my professional career. I am forever grateful to be surrounded by great individuals who cultivate high-level thinking and work on amazing projects.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5d12d4cc-8e86-4abc-aa2d-501cd10f27dc\"}"},{"__ref":"Favorites:{\"uuid\":\"c84f8b94-be40-4560-b5d8-974add32f29e\"}"},{"__ref":"Favorites:{\"uuid\":\"d87db33a-4511-4f03-83c9-07329cf49165\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6db2f708-c963-4b09-a99d-beda1f5eab96\"}"}],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9102b176-745d-421c-9d8d-708f1767af5e\"}"},{"__ref":"DeepDives:{\"uuid\":\"2c773e73-facb-40ec-b5c7-f4c9c5064670\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7c84007-e90c-4229-982a-8c118cb75bcc\"}"},{"__ref":"DeepDives:{\"uuid\":\"948f6c08-9362-4935-9e47-7817e4e9ae49\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fab78042-fa19-49cb-9af1-2bf48e43781f/-/preview/-/format/jpg/","https://ucarecdn.com/f00bb5f9-42e6-4d7f-b562-f374ef3a47c5/-/preview/-/format/jpg/","https://ucarecdn.com/8e537a92-304e-4474-95c9-9a9753939f6e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"eb5f0550-d97d-4d3c-8750-c988a6c6aaec\"}"},{"__ref":"Education:{\"uuid\":\"71d15680-963c-4cc3-bd66-a3f9e6fd42e9\"}"}],"hiredAt":"2025-01-01T15:43:42.882Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Writing","Academic Coaching","Executive Function","Reading"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kennedy-achugamonu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b129ee67-dd5a-4983-a53c-3329becffab7\"}"}}},"_sentryTraceData":"43165cab3bd04718a4254c2d391764c4-9d8b35d1d7407f43-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=43165cab3bd04718a4254c2d391764c4,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","q
