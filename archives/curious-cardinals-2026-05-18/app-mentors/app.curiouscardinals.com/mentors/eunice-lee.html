xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f874cad5-2ae7-48f4-b44c-e780bf6ffe49\"}":{"__typename":"Favorites","uuid":"f874cad5-2ae7-48f4-b44c-e780bf6ffe49","photoUrl":"https://ucarecdn.com/ac4978a8-12d1-41be-b3d5-9b275e7cda79/","title":"F1 Mclaren","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1584b85b-6755-4b3d-8ac1-0b80c8f7820f\"}":{"__typename":"DeepDives","uuid":"1584b85b-6755-4b3d-8ac1-0b80c8f7820f","content":"\u003cp\u003eMy greatest source of motivation is my younger siblings. Knowing that they look up to me pushes me to work harder, stay disciplined, and pursue opportunities that I never imagined for myself. I want to show them that with effort, resilience, and confidence, they can carve their own paths, no matter where they start. Being a role model for them inspires me every day to become the best version of myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"e14889ff-5dc5-4db8-b4e1-dfc6e7b076d9\"}":{"__typename":"DeepDives","uuid":"e14889ff-5dc5-4db8-b4e1-dfc6e7b076d9","content":"\u003cp\u003eOne passion project I created is \u003cstrong\u003eFresh Booth\u003c/strong\u003e, a youth-led nonprofit focused on reducing food waste and addressing food insecurity. I founded the organization to rescue surplus groceries from local stores and redistribute them to food banks and underrepresented communities. Through regular food drives and donation efforts, we provided fresh, healthy items to families in need while preventing large amounts of food from going to waste. My work with Fresh Booth was recognized by national newspapers, including \u003cem\u003eThe Korea Times\u003c/em\u003e and \u003cem\u003eThe Korea JoongAng Daily\u003c/em\u003e, for its impact and leadership in community food justice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1104c7cc-96c6-4147-8316-6eabe36ac664\"}":{"__typename":"DeepDives","uuid":"1104c7cc-96c6-4147-8316-6eabe36ac664","content":"\u003cp\u003eEverything is going to be okay. Even when things feel overwhelming, trust that every experience is shaping you in ways you don’t yet see. Keep putting in the effort, because consistency and perseverance will always carry you across the finish line.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"036e9763-3257-4274-9a78-253a82d2605c\"}":{"__typename":"School","uuid":"036e9763-3257-4274-9a78-253a82d2605c","name":"Woodlands Middle/ High School","city":"Hartsdale","type":"HIGH","state":"New York","country":"United States","zip":"10530"},"Education:{\"uuid\":\"1d392716-b14a-47c1-9fa2-fe44124ee748\"}":{"__typename":"Education","uuid":"1d392716-b14a-47c1-9fa2-fe44124ee748","school":{"__ref":"School:{\"uuid\":\"036e9763-3257-4274-9a78-253a82d2605c\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"bf0a0448-810f-423b-a17e-a8678ec0a9c4\"}":{"__typename":"Education","uuid":"bf0a0448-810f-423b-a17e-a8678ec0a9c4","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Global Development","degree":null},"MentorPublicProfile:{\"uuid\":\"c1141d5e-6ea1-430c-a5b7-eb5d1b9c5aca\"}":{"__typename":"MentorPublicProfile","uuid":"c1141d5e-6ea1-430c-a5b7-eb5d1b9c5aca","displayName":"Eunice L.","slug":"eunice-lee","biography":"\u003cp\u003eHi everyone! I’m Eunice Lee, a junior at Cornell studying Global Development with minors in Business and Education. Before coming to Cornell, I competed on Team USA in Taekwondo, and I now continue training with Cornell’s club team.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of classes, I love watercolor painting, visiting art museums, spending time with friends and family, as well as exploring Ithaca’s trails. I’m also a big café and coffee person, and I love exploring different food scenes whenever I travel. Experiencing different cultures is one of my favorite things; I feel like I learn best when I hear new perspectives and understand issues from multiple angles. I’ll be studying abroad in London at UCL next semester, and I’m excited to meet new people and continue experiencing global cultures firsthand. Looking ahead, I hope to spend the next decade building a strong foundation in the corporate world and eventually branch into the food, beverage, or hospitality space, combining my love for culture, community, and cuisine into something meaningful.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also deeply interested in education because I believe it provides students with opportunities and freedom they may not otherwise have access to. As a first-generation student, I’ve seen firsthand how education can shape mobility and open doors that were never available to previous generations in my family. Growing up navigating academics largely on my own, I learned early on how transformative it is when students are given support, guidance, and resources. I personally understand how overwhelming and confusing the college application process can be, especially when your parents didn’t go through the U.S. education system and can’t always guide you through essays or deadlines. There were many moments when I felt lost or unsure of where to turn, and those experiences made me deeply appreciate the mentors and teachers who stepped in to help.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese experiences shaped many of my core values and inspired my commitment to creating pathways for students who face similar barriers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I’m part of a consulting group on campus, where I serve as the Vice President of Internal and work as a Senior Consultant on a client project with Girls Who Invest. In this role, I’ve enjoyed helping develop strategic solutions, strengthening organizational operations, and contributing to a project that aims to expand access and representation within the finance industry. This role has also allowed me to hone my leadership skills, teaching me that effective leadership is not about telling people what to do, but about ensuring everyone understands their tasks, feels supported, and feels comfortable asking questions: skills I hope to carry forward and use with my own students in the future.\u003c/p\u003e","teachingVideoPlaybackId":"EBvruagGoZ89cBGehWSnfKD01F3t001CdjTATg00qjUQxc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f874cad5-2ae7-48f4-b44c-e780bf6ffe49\"}"}],"causesSupported":[],"major":"Global Development","deepDives":[{"__re
