xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9ef699c3-bc2b-4097-a3db-d4db42783cd1\"}":{"__typename":"Favorites","uuid":"9ef699c3-bc2b-4097-a3db-d4db42783cd1","photoUrl":"https://ucarecdn.com/d5d87a72-006a-4e84-954a-eed5a23770a2/","title":"Shohei Ohtani","type":"ATHLETE"},"Favorites:{\"uuid\":\"92e3977a-3628-4ad5-b576-b8cd099a1f84\"}":{"__typename":"Favorites","uuid":"92e3977a-3628-4ad5-b576-b8cd099a1f84","photoUrl":"https://ucarecdn.com/78d1fcaa-beab-4270-8493-8dc537927328/","title":"Klara and the Sun","type":"BOOK"},"Favorites:{\"uuid\":\"60086722-5c71-4f95-a195-ee2c40fdf9f5\"}":{"__typename":"Favorites","uuid":"60086722-5c71-4f95-a195-ee2c40fdf9f5","photoUrl":"https://ucarecdn.com/4dd835b0-9825-4013-8939-5fe73cab82f2/","title":"Fortnite","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"54c88a74-8b44-478d-ae25-30805a23761a\"}":{"__typename":"DeepDives","uuid":"54c88a74-8b44-478d-ae25-30805a23761a","content":"\u003cp\u003eIf I could give advice to my middle or high school self, it would be this: tackle one thing at a time.\u003c/p\u003e\u003cp\u003eI was always dabbling in something new—whether it was building new projects, exploring different sports, or working with people in different organizations. And while that was a lot of fun, in hindsight, I think I could have benefited from slowing down and focusing on each curiosity more deeply. Spending extra time on one thing would have helped me assess if I really enjoyed it, and more importantly, would have given me the chance to face and work through obstacles in a way that builds grit.\u003c/p\u003e\u003cp\u003eJumping from one interest to the next was great for exposure, but sticking with a challenge longer helps build resilience and gives you a true sense of accomplishment. Having learned that, I now try to be more intentional with my commitments.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"602830c9-6dd3-43da-8d9d-70fdb176e2ad\"}":{"__typename":"School","uuid":"602830c9-6dd3-43da-8d9d-70fdb176e2ad","name":"Troy High School","city":"Fullerton","type":"HIGH","state":"California","country":"United States","zip":"92831"},"Education:{\"uuid\":\"06cc7f0c-386f-461f-81f4-dfe8a536c11c\"}":{"__typename":"Education","uuid":"06cc7f0c-386f-461f-81f4-dfe8a536c11c","school":{"__ref":"School:{\"uuid\":\"602830c9-6dd3-43da-8d9d-70fdb176e2ad\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"8eeadf70-1ef6-4f0d-9554-1d8dc94b6389\"}":{"__typename":"Education","uuid":"8eeadf70-1ef6-4f0d-9554-1d8dc94b6389","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science and Design Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"ab135780-20fc-4403-8ffb-ea7ace1549a4\"}":{"__typename":"MentorPublicProfile","uuid":"ab135780-20fc-4403-8ffb-ea7ace1549a4","displayName":"Ethan W.","slug":"ethan-wei","biography":"\u003cp\u003eHi, I’m Ethan! I’m currently studying Computer Science at Brown University, but my journey started in a vibrant immigrant household in sunny Southern California. Growing up, I had more hobbies than I could count, and I was lucky to have parents who encouraged me to explore them all. From modifying Nerf guns to learning woodworking, my curiosity knew no bounds. (Let's just say I spent more hours in the garage than in my room!)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I wasn’t just experimenting in the garage. As the founding Partnerships Lead of Dream DAO, I navigated partnerships with the Ethereum Foundation, Coinbase, and others to bring blockchain development and cryptography education to students across the globe—literally every continent except Antarctica. It was a wild ride, and I loved every second of it! I learned about growth, marketing, and operations, but most importantly, I learned that a lot can happen when you're persistent.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I wasn’t deep in blockchain projects or at school, my energy was spent writing. I started writing on Medium as a freshman and ultimately amassed over 100k readers across my articles and a few hundred newsletter subscribers. Professionally, I had the opportunity to work as a product manager at a Series B startup (EV Connect) for three years, which sparked my love for software and product development. Now at Brown, I’m involved in the consulting club and serve as vice president of the venture capital club (Van Wickle Ventures).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile I’m still figuring out the specifics of my career path, I know I want to work in tech, likely as an operator, with a dream of using my experience to become an advisor or investor. I love blending creativity with strategy, and I’m always looking for ways to build meaningful products that solve real-world problems. If you resonate with any of the above, then I'm your guy!\u003c/p\u003e","teachingVideoPlaybackId":"DTbIwbaLT2IUD5RFGbB1jlMTWPbrdOV84n02YVbRTQ64","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9ef699c3-bc2b-4097-a3db-d4db42783cd1\"}"},{"__ref":"Favorites:{\"uuid\":\
