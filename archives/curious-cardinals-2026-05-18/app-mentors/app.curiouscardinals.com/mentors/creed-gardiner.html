xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2abac0a9-2951-4bf2-9705-937cb4089b60\"}":{"__typename":"Favorites","uuid":"2abac0a9-2951-4bf2-9705-937cb4089b60","photoUrl":"https://ucarecdn.com/045677c1-336d-4920-b2c6-9c9010dac077/","title":"Rumours by Fleetwood Mac","type":"ALBUM"},"CausesSupported:{\"uuid\":\"6b58bc27-6280-474c-8e2d-d1a6087dc6a4\"}":{"__typename":"CausesSupported","uuid":"6b58bc27-6280-474c-8e2d-d1a6087dc6a4","name":"Integrated Refugee and Immigrant Services","description":"\u003cp\u003eI've loved tutoring English to Immigrant and Refugee kids with IRIS.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/587d1e8e-bc17-4333-b566-b3bb38f587b4/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"bced3455-b8fd-44d6-9da7-c1b5e6a1c1e2\"}":{"__typename":"DeepDives","uuid":"bced3455-b8fd-44d6-9da7-c1b5e6a1c1e2","content":"\u003cp\u003eThe advice that I would give my high school self would be to focus more on trying a wide variety of classes, projects, and extracurriculars rather than putting too much pressure on myself to overperform in the subjects and extracurriculars that I liked during my freshman year of high school.\u003cbr\u003e\u003cbr\u003eHigh school is about learning your likes, your dislikes, what comes naturally for you, and what you couldn't be paid to study again. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ce02239f-2cc4-4fbe-b27f-a56046e61197\"}":{"__typename":"DeepDives","uuid":"ce02239f-2cc4-4fbe-b27f-a56046e61197","content":"\u003cp\u003eIn my spare time, I love all things outdoors: running, biking, swimming, hiking, slacklining, and soft serve on a hot day.\u003cbr\u003e\u003cbr\u003eIf I must stay inside, I love making music--I especially love playing any piano solo by Debussy or Chopin, and I have loved singing Benjamin Britten's war requiem as a member of the Yale Glee Club. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether indoors or outdoors, I love to read. Some of my favorite authors are Sally Rooney, James Baldwin, and Hanya Yanagihari.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"639925eb-953e-47df-a69c-b701251314ba\"}":{"__typename":"School","uuid":"639925eb-953e-47df-a69c-b701251314ba","name":"Corner Canyon High School","city":"Draper","type":"HIGH","state":"Utah","country":"United States","zip":"84020"},"Education:{\"uuid\":\"c2da317a-8dc9-400e-9816-accbd6edf7a6\"}":{"__typename":"Education","uuid":"c2da317a-8dc9-400e-9816-accbd6edf7a6","school":{"__ref":"School:{\"uuid\":\"639925eb-953e-47df-a69c-b701251314ba\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"4c7b2d8d-fac8-4869-acf0-3e952e3bfa5c\"}":{"__typename":"Education","uuid":"4c7b2d8d-fac8-4869-acf0-3e952e3bfa5c","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"American Studies","degree":"BA"},"MentorPublicProfile:{\"uuid\":\"9236f81e-03c1-40b1-9f04-2f403545fd77\"}":{"__typename":"MentorPublicProfile","uuid":"9236f81e-03c1-40b1-9f04-2f403545fd77","displayName":"Creed G.","slug":"creed-gardiner","biography":"\u003cp\u003eHello Everyone!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy name is Creed, and I’m a rising senior at Yale University, where I am pursuing a major in American Studies alongside certificates in Education Studies and in French. Beyond my academic work, I serve as a Recruitment Coordinator in the Yale Office of Undergraduate Admissions, where I have the privilege of meeting prospective students and helping them envision themselves as part of our community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the core of my studies and work is a commitment to building inclusive communities. Growing up queer in a close-knit and deeply devout religious environment, I often felt the tensions between belonging and exclusion. Those early experiences led me to focus my scholarship on people at the peripheries of religious communities—those who are marginalized because of sexuality, race, immigration status, or other identities. These interests are not abstract for me; they come from lived experience, and from the ways I’ve seen inclusion, or the lack of it, shape people’s lives.\u003c/p\u003e\u003cp\u003eMy path to Yale was profoundly shaped by the dedication of my public-school teachers in suburban Salt Lake City. They built classroom communities where students like me—who sometimes felt out of place in the broader culture—could belong, learn, and thrive. Their example taught me that education can be transformative, and that the simple act of including every student can change the trajectory of a life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince arriving at Yale, I have experienced how impactful mentorship can be. One professor in particular, from an American Studies seminar, played a crucial role in my growth. She not only helped me brainstorm an original research project but also supported me in securing funding and guided me through months of ethnographic fieldwork. Now, as I work to synthesize that research into my senior essay, her ongoing mentorship has been indispensable. This experience reinforced my belief that mentorship is not just helpful but essential to student success, providing encouragement, perspective, and guidance at moments when it is most needed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my career, I am deeply interested in teaching history and continuing to advocate for students of all backgrounds. I believe classrooms are strongest when they reflect diverse identities, experiences, and ways of thinking. Diversity benefits everyone, fostering empathy and broadening horizons. My previous roles have given me opportunities to mentor others—as a recruitment coordinator in Admissions, a Camp Yale Leader for Harvest, an English tutor for immigrant and refugee students in Connecticut, and a counselor at Common Ground Summer Camp. In each of these settings, I have seen how mentorship and inclusion can empower students to take risks, pursue passions, and find belonging.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would be delighted to mentor students in French language and literature, the humanities, social sciences, personal projects, or application writing. Above all, I hope to create spaces where students feel supported, seen, and encouraged to pursue their goals. I am so excited to meet you all and to learn from you as much as I hope you will learn from me.\u003c/p\u003e","teachingVideoPlaybackId":"00Ioo8gOME7k3GwDfoE0002tPKKKY2WXQM35neUNL01y01kw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2abac0a9-2951-4bf2-9705-937cb4089b60\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6b58bc27-6280-474c-8e2d-d1a6087dc6a4\"}"}],"major":"American Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bced3455-b8fd-44d6-9da7-c1b5e6a1c1e2\"}"},{"__ref":"DeepDives:{\"uuid\
