xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c80f338f-686d-47a4-8fac-cf5c6763638b\"}":{"__typename":"DeepDives","uuid":"c80f338f-686d-47a4-8fac-cf5c6763638b","content":"\u003cp\u003eMentorship matters to me because it can completely change how someone sees their own potential. Growing up, having the right guidance at the right time made a huge difference in how I approached school, opportunities, and my future.\u003c/p\u003e\u003cp\u003eI’ve seen how easy it is to feel uncertain or overwhelmed, especially when you don’t have someone to help you think through decisions or challenge your perspective. Mentorship provides that clarity—it’s not just about giving answers, but helping someone learn how to think, ask better questions, and build confidence in themselves.\u003c/p\u003e\u003cp\u003eThat’s what I try to do in my sessions. I want students to walk away not just understanding a topic, but feeling more capable and more sure of what they can achieve.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b8d7435b-f9f8-4220-8ca9-991d2aa15456\"}":{"__typename":"DeepDives","uuid":"b8d7435b-f9f8-4220-8ca9-991d2aa15456","content":"\u003cp\u003eMy dream job is to work at the Bank of Mexico, where I can be directly involved in shaping monetary policy and understanding how economic decisions impact real people. I’m especially interested in how macroeconomic policy affects emerging markets like Mexico.\u003c/p\u003e\u003cp\u003eAt the same time, I’ve always been drawn to teaching, so becoming an economics professor is also part of that vision. I enjoy breaking down complex ideas and helping others understand how systems work.\u003c/p\u003e\u003cp\u003eAnd on a more personal note, I’ve always loved cooking—so eventually, I’d love to explore becoming a professional cook or spending more time in the kitchen later in life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"7038b5b7-dc8e-4644-94a4-9bbff328d0d3\"}":{"__typename":"DeepDives","uuid":"7038b5b7-dc8e-4644-94a4-9bbff328d0d3","content":"\u003cp\u003eMy greatest source of motivation is my family. I grew up watching how hard they worked and the sacrifices they made to create opportunities for me, and that’s always stayed with me. It’s shaped how I approach challenges—I try to be disciplined, consistent, and make the most of every opportunity I have.\u003c/p\u003e\u003cp\u003eAt the same time, it also motivates me to build something meaningful on my own and to eventually give back, both to my family and to others who are in similar positions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1af017fa-03fb-46e0-8ecd-4abf7c892395\"}":{"__typename":"DeepDives","uuid":"1af017fa-03fb-46e0-8ecd-4abf7c892395","content":"\u003cp\u003eIn my spare time, I like to stay active both mentally and physically. I spend a lot of time reading about macroeconomics and global markets, especially how developments in Latin America connect to broader global trends.\u003c/p\u003e\u003cp\u003eOutside of that, I’m really drawn to the humanities. I enjoy reading Russian literature and history, and I like painting and reading poetry as a way to slow down and think more creatively.\u003c/p\u003e\u003cp\u003eI also love being outdoors. I spend time hiking and mountaineering, and I enjoy activities like scuba diving and cooking. More recently, I’ve gotten into rock climbing, which has been a fun challenge both physically and mentally.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"3cba1ed4-4a7e-40ec-8fa0-d251d0302eb6\"}":{"__typename":"School","uuid":"3cba1ed4-4a7e-40ec-8fa0-d251d0302eb6","name":"Independence High School","city":"Bakersfield","type":"HIGH","state":"California","country":"Estados Unidos","zip":"93311"},"Education:{\"uuid\":\"1519969f-a901-438d-bc5f-c5fc8eb2039f\"}":{"__typename":"Education","uuid":"1519969f-a901-438d-bc5f-c5fc8eb2039f","school":{"__ref":"School:{\"uuid\":\"3cba1ed4-4a7e-40ec-8fa0-d251d0302eb6\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"f1153f64-f8fe-477b-962a-a953bbf788d0\"}":{"__typename":"Education","uuid":"f1153f64-f8fe-477b-962a-a953bbf788d0","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Neuroscience and Economics and Mathematical Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"49738223-426d-4b65-a320-7a460a822b0a\"}":{"__typename":"MentorPublicProfile","uuid":"49738223-426d-4b65-a320-7a460a822b0a","displayName":"Alejandro G.","slug":"alejandro-gaytan","biography":"\u003cp\u003eHi, I’m Alejandro, a graduate of Harvard where I studied Neuroscience, Economics, and Mathematical Sciences. My academic path has always been driven by one core question: how do systems—whether biological, financial, or social—actually work beneath the surface? That curiosity has shaped both my studies and my professional experiences.\u003c/p\u003e\u003cp\u003eOver the past few years, I’ve worked across healthcare, finance, and research in both the U.S. and Latin America. At a pharmaceutical company in Mexico, I helped evaluate multi-million dollar investments in drug manufacturing, analyzing how factors like inflation, exchange rates, and regulation affect real-world decisions. In investment banking and finance roles, I’ve worked on infrastructure and financial services transactions, building models and thinking through how businesses grow, operate, and manage risk.\u003c/p\u003e\u003cp\u003eAt the same time, I’ve spent several years doing research on economic development. That experience taught me how access to resources—like credit, education, and information—can fundamentally shape opportunities and outcomes.\u003c/p\u003e\u003cp\u003eBut beyond the technical work, what I care most about is helping students build clarity and confidence in how they think. I don’t believe in just memorizing information—I focus on helping students understand why things work, ask better questions, and connect ideas across subjects.\u003c/p\u003e\u003cp\u003eWhether we’re working on:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;•\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;building a passion project\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;•\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;understanding business, economics, or finance\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;•\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;preparing for college or interviews\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;•\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;or just exploring interests and career paths\u003c/p\u003e\u003cp\u003emy goal is to make sessions practical, engaging, and tailored to you.\u003c/p\u003e\u003cp\u003eI also understand that every student is different. Some are trying to get ahead academically, others are still figuring out what they’re interested in—and that’s completely okay. I aim to meet you where you are and help you take the next step forward.\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy exploring new ideas from Russian philosophy, the classics, and poetry from the Age of Exploration; staying active (I'm an advanced scuba diver and mountaineer, having climbed 3 of the 7 summits!); and learning from different cultures (I've traveled across every country in the Americas!) experiences. Having grown up navigating different environments myself, I value mentorship that is both supportive and challenging.\u003c/p\u003e\u003cp\u003eIf you’re curious, motivated, or just trying to figure things out, I’d love to work with you. Looking forward to getting to know you!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"JTwjH54mOq357xA21KpvHnH1VaIhemnkAGLi02Vy01J02A","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience and Economics and Mathematical Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c80f338f-686d-47a4-8fac-cf5c6763638b\"}"},{"__ref":"DeepDives:{\"uuid\":\"b8d7435b-f9f8-4220-8ca9-991d2aa15456\"}"},{"__ref":"DeepDives:{\"uuid\":\"7038b5b7-dc8e-4644-94a4-9bbff328d0d3\"}"},{"__ref":"DeepDives:{\"uuid\":\"1af017fa-03fb-46e0-8ecd-4abf7c892395\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/07f72cc4-d815-41d2-9b4e-c33c6293151b/-/preview/-/format/jpg/","https://ucarecdn.com/0aacc427-f406-41d8-a8c9-e0fc75593381/-/preview/-/format/jpg/","https://ucarecdn.com/3d5d55c9-6eb6-4051-a901-3ce7864c8cd2/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1519969f-a901-438d-bc5f-c5fc8eb2039f\"}"},{"__ref":"Education:{\"uuid\":\"f1153f64-f8fe-477b-962a-a953bbf788d0\"}"}],"hiredAt":"2026-03-26T15:42:49.265Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","History","Creative Writing","History Project","Business / Entrepreneurship","Finance / Investing","Medicine / Health","STEM Project","Law / Government / Policy","Sustainability","Journalism","Public Speaking","Debate"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alejandro-gaytan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"49738223-426d-4b65-a320-7a460a822b0a\"}"}}},"_sentryTraceData":"2b2b78378fc44909ab1de27133366efd-bc0e3c10cf23610f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2b2b78378fc44909ab1de27133366efd,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alejandro-gaytan"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.j
