xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"739fdbc8-9fce-4ad6-9685-0bae89c65b0a\"}":{"__typename":"Favorites","uuid":"739fdbc8-9fce-4ad6-9685-0bae89c65b0a","photoUrl":"https://ucarecdn.com/ae763def-d006-4d6a-beb2-182ee477f775/","title":"Soccer","type":"SPORT"},"CausesSupported:{\"uuid\":\"68421eb4-1e74-4aaa-bc51-16b9bfdfdac6\"}":{"__typename":"CausesSupported","uuid":"68421eb4-1e74-4aaa-bc51-16b9bfdfdac6","name":"Fighting Food Insecurity","description":"\u003cp\u003eI love working with my local food pantry to provide meals to those in need!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/4b980375-a472-4488-9090-75489e35fc32/"},"CausesSupported:{\"uuid\":\"8653f296-7ab3-4da0-a7de-93e4dcf5e22f\"}":{"__typename":"CausesSupported","uuid":"8653f296-7ab3-4da0-a7de-93e4dcf5e22f","name":"Improving Health Education","description":"\u003cp\u003eI am highly interested in helping enlighten and spread awareness about health!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/c5804865-67a8-456b-ac9e-1e8c31aa98f7/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1159bb5f-5732-488d-8a25-a55be587c076\"}":{"__typename":"DeepDives","uuid":"1159bb5f-5732-488d-8a25-a55be587c076","content":"\u003cp\u003eIn my spare time, I love to spend time with friends \u0026amp; family, write, bake, and listen to music! I also love to stay active, whether that includes going to the gym, running in half-marathons, or hiking different trails.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"43bae863-f0fc-40ad-a27c-a327b6036ade\"}":{"__typename":"DeepDives","uuid":"43bae863-f0fc-40ad-a27c-a327b6036ade","content":"\u003cp\u003eIn high school, I often spent my summers taking extra courses at my local colleges through Ohio's CCP program. I also had soccer trainings and weightlifting sessions, and I made sure to spend plenty of time with friends and family to prevent burnout!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a32304b6-0d1b-4dba-9c4f-beadd1162f0e\"}":{"__typename":"DeepDives","uuid":"a32304b6-0d1b-4dba-9c4f-beadd1162f0e","content":"\u003cp\u003eMy greatest source of motivation is making my family proud and reaching my goal of being able to help as many people as possible!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9fbb5b9c-3e4a-4228-91e6-184bef58dc68\"}":{"__typename":"DeepDives","uuid":"9fbb5b9c-3e4a-4228-91e6-184bef58dc68","content":"\u003cp\u003eMentorship matters to me because I love being able to give back and help out whenever I can! I think that it is so important to work together and build community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"7ffe0896-d5d8-46c1-8513-7f3cccfabf83\"}":{"__typename":"School","uuid":"7ffe0896-d5d8-46c1-8513-7f3cccfabf83","name":"Canal Winchester High School","city":"Canal Winchester","type":"HIGH","state":"Ohio","country":"United States","zip":"43110"},"Education:{\"uuid\":\"26203bb3-845f-4214-b726-98ff1e94398e\"}":{"__typename":"Education","uuid":"26203bb3-845f-4214-b726-98ff1e94398e","school":{"__ref":"School:{\"uuid\":\"7ffe0896-d5d8-46c1-8513-7f3cccfabf83\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a5a64bfb-8fc2-4f00-a897-47928e7bf9f8\"}":{"__typename":"Education","uuid":"a5a64bfb-8fc2-4f00-a897-47928e7bf9f8","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"0d55a15b-155a-49e8-9593-264daa8917f4\"}":{"__typename":"MentorPublicProfile","uuid":"0d55a15b-155a-49e8-9593-264daa8917f4","displayName":"Samuel H.","slug":"samuel-howard","biography":"\u003cp\u003eHello, my name is Sam Howard! I am originally from Canal Winchester, Ohio, a small town outside of Columbus. I attend Stanford University, where I am pursuing a major in Chemistry and a minor in Biology on the pre-medicine track. While medicine is my primary passion, I also hold strong academic interests in business, mathematics, history, and writing. I enjoy exploring the intersections of these disciplines, and I believe that having diverse interests strengthens my academic and professional endeavors. I also love research. I am a research assistant in the Chen Lab at Stanford, where we are researching activity inhibitors for proteins in an effort to create a sustainable male contraceptive. I also have been heavily involved in vaccine hesitancy research for several years.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, I am actively involved in several organizations that allow me to pursue leadership, collaboration, and service. I serve as the Director of Recruitment for REM Consulting, Director of Operations for the Stanford Pre-Business Association, and Executive Secretary for the Stanford Pre-Medical Association. Outside of academics, I love creative writing, baking, and staying active. I played soccer competitively until college, and I am now playing soccer recreationally and training for half-marathons! One of my proudest non-academic achievements is cofounding and serving as president of Pumpkins Helping People, a 501c3 nonprofit organization. Each year, we sell pumpkins online and donate 100% of the proceeds to local food pantries. Over the past seven years, we have donated nearly $30,000 to fight against food insecurity, and I am excited to continue to grow this donation in the upcoming years!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA unique aspect of my academic experience is that I actually started college in 7th grade. In sixth grade, I took the SAT, achieving a 740/800 on the math section. In 7th grade, I took the ACT and scored a 32 with 33 math and 34 English scores. These scores garnered me recognition and placement into prestigious middle school talent competitions at Northwestern, Duke, Johns Hopkins, and Notre Dame. Subsequently, I began taking college courses through Ohio’s CCP program, earning A's in over 30 college courses before graduating high school as my class’s valedictorian. I attribute these academic experiences to my success in college admissions, where I earned acceptances to Harvard, Yale, Brown, Cornell, Duke, Northwestern, Vanderbilt and more. Additionally, I earned over $1 million dollars in merit-based scholarships, including full-ride scholarships to Vanderbilt, Notre Dame, and The Ohio State University.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am super passionate about teaching and mentoring people. I have tutored kids for the ACT for years and am so looking forward to helping students through Curious Cardinals. I plan to return to school to become a teacher instead of retiring! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eUsing my own past experiences, I hope to assist my mentees with achieving success, and I can’t wait to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"5oiHI9y55PZvUcIWen1oLypOWVgtLatHbiOB5rWu2zk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my greatest achievements is successfully launching and serving as president for my 501c3 non-profit organization Pumpkins Helping People with my sisters, which has donated nearly $30,000 to fight food insecurity over the past seven years!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"739fdbc8-9fce-4ad6-9685-0bae89c65b0a\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"68421eb4-1e74-4aaa-bc51-16b9bfdfdac6\"}"},{"__ref":"CausesSupported:{\"uuid\":\"8653f296-7ab3-4da0-a7de-93e4dcf5e22f\"}"}],"major":"Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1159bb5f-5732-488d-8a25-a55be587c076\"}"},{"__ref":"DeepDives:{\"uuid\":\"43bae863-f0fc-40ad-a27c-a327b6036ade\"}"},{"__ref":"DeepDives:{\"uuid\":\"a32304b6-0d1b-4dba-9c4f-beadd1162f0e\"}"},{"__ref":"DeepDives:{\"uuid\":\"9fbb5b9c-3e4a-4228-91e6-184bef58dc68\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ded5a38c-cfd7-4e64-bd84-acdf19e58848/-/preview/-/format/jpg/","https://ucarecdn.com/2307ac99-daca-4846-8fe6-e13b3bd30060/-/preview/-/format/jpg/","https://ucarecdn.com/5f1d9a20-ea94-420c-a880-557ebeb871c7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"26203bb3-845f-4214-b726-98ff1e94398e\"}"},{"__ref":"Education:{\"uuid\":\"a5a64bfb-8fc2-4f00-a897-47928e7bf9f8\"}"}],"hiredAt":"2025-09-11T12:32:14.612Z","topics":["K-5 Grade Math","Pre-A
