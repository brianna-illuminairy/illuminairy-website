xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7ac17cbb-fbc5-455d-9051-a6e302ab8c9b\"}":{"__typename":"DeepDives","uuid":"7ac17cbb-fbc5-455d-9051-a6e302ab8c9b","content":"\u003cp\u003eMentorship, in my opinion, is the key to pursuing any endeavor, whether that be academic, artistic or any other aspiration one might harbor. When a dream or an aspiration takes root in your mind, regardless of your age, the process of transforming that idea into a reality can appear daunting, if not outright impossible. This feeling can be particularly pronounced in individuals who face challenges academically, or with executive functioning, making the act of fulfilling a dream seem like an uphill battle from the outset. The power of having a mentor lies in their living proof that your aspirations are attainable. that their existence is sheer proof that what you aspire to do is achievable. As mentorship is a cyclical journey, these mentors were once in your shoes, armed with nothing but a vision of their end goal. The firsthand experience of a mentor uniquely positions them to realize the achievability of your dreams.\u003c/p\u003e\u003cp\u003eAs a mentee, I hope that my mentor finds not only guidance but also inspiration, in recognizing that my journey began much like their own: with nothing but an idea. As your mentor, I aspire to affirm that the path to achieving your ambitions is achievable, if you take it one step at a time. All your dreams require to be embodied is your own ambition, energy and drive, and maybe the occasional guidance of a mentor.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3aeeb04b-14ac-4c3b-b7c4-8d4370962c36\"}":{"__typename":"DeepDives","uuid":"3aeeb04b-14ac-4c3b-b7c4-8d4370962c36","content":"\u003cp\u003eThroughout my journey, I have pursued many projects in the pursuit to harmonize my wide range of interests. Among these, a standout piece that continues to find resonanceis the creation of a performance art piece, which I crafted and filmed from my New York apartment.\u003c/p\u003e\u003cp\u003eIn the spring of 2020, I was involved in a semester program called Oxbow, which led me away from my home school to immerse myself in the world of visual art in California. Unfortunately this adventure was abruptly cut short due to the COVID-19 pandemic. Despite this setback, we, the students, remained determined to complete our final projects with no less dedication than had we still been at school. By harnessing our creativity and resourcefulness, my fellow student and I created our final projects with the\u0026nbsp; limited resources available in our homes.\u0026nbsp;\u003c/p\u003e\u003cp\u003eDrawing from my passion for both performing and visual arts, I conceived a one-woman show, which I performed and recorded in the confines of my family’s living room. The play revolves around a woman, aware of the performance going on around her, painting the “set” for her life. Her roommate, unaware of the performative nature of their existence, continues on with his daily routines, like grocery shopping and band practice. As the narrative unfolds, the once obscured set reveals itself to be a graveyard, unveiling a powerful foreshadowing\u0026nbsp; the play’s conclusion- the passing of one of the roomates band members. At its core, this production explores the concept of fate versus free will: how much of our fate do we control and how much is being built around us, for us.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis project has and continues to hold a special place in my heart. Isolated and devoid of the collaborative energy of my fellow artists, I faced the challenge of executing this project completely on my own. I was forced to trust myself and my vision of the project, and it worked greatly in my favor.\u003c/p\u003e\u003cp\u003eHaving constructed and executed this piece during COVID and the loss of leaving California, the completion of my strange one woman show makes it one of the most cherished and impactful projects I have ever created. It serves as a testament to the creativity and beauty that comes out of persevering through change and confusion.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"097c8640-c906-49df-8739-be8d6e25154c\"}":{"__typename":"DeepDives","uuid":"097c8640-c906-49df-8739-be8d6e25154c","content":"\u003cp\u003eOne valuable piece of advice I'd like to share with the lovely high school or middle school Vera, or anyone in need of a little guidance during those years, is to wholeheartedly embrace your uniqueness and trust in your own journey. Adolescence, whether in middle or high school, inevitably comes with challenges as it makes the time where you're establishing your identity and finding your place in the world. \u003cbr\u003eThe most powerful advice I could give to my younger self, and the advice that, perhaps, she would be the most receptive to, is to discover your passions and interests—those areas where you feel most genuinely yourself—and pursue them with passion and vigor. Firstly, doing so creates the opportunity to find like-minded people to celebrate when you succeed and offer support during your low points. Community and collaboration are, in my opinion key for the pursuit of any passion. \u003cbr\u003eSecondly, dedicating yourself to a passion not only prepares you for the future but it puts the everyday dramas and growing pains of adolescence into perspective. When wholeheartedly committed to pursuing an interest that brings you joy, and you feel that your life is well rounded, the highs and lows of life become more manageable and are less likely to phase you!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"6cf58a9b-0699-4b38-b31c-43bf81c4c64b\"}":{"__typename":"DeepDives","uuid":"6cf58a9b-0699-4b38-b31c-43bf81c4c64b","content":"\u003cp\u003eIn my household growing up, my parents strongly valued wit and humor. Cleverness or perhaps a not-so-appropriate joke was truly the way into my parents’ fondness. While I myself have grown to value other attributes more, such as authenticity, honesty and openness, I have not been able to shake the habit of weaving humor into every aspect of my life. So as a mentor, even when we get down and dirty planning and mapping out your dreams, expect to be laughing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"5ffb31ec-cfeb-4eef-8e38-a68224225788\"}":{"__typename":"School","uuid":"5ffb31ec-cfeb-4eef-8e38-a68224225788","name":"The Spence School Middle \u0026 Upper School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"514b6913-897b-42ff-b72c-a30f5b96c7c7\"}":{"__typename":"Education","uuid":"514b6913-897b-42ff-b72c-a30f5b96c7c7","school":{"__ref":"School:{\"uuid\":\"5ffb31ec-cfeb-4eef-8e38-a68224225788\"}"},"startYear":"2008","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"03882c53-6e3e-4046-b03f-dc0341c52d17\"}":{"__typename":"Education","uuid":"03882c53-6e3e-4046-b03f-dc0341c52d17","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Fine Arts","degree":null},"MentorPublicProfile:{\"uuid\":\"67ab07ab-ae78-4f56-b7cd-2ff2640e3fcc\"}":{"__typename":"MentorPublicProfile","uuid":"67ab07ab-ae78-4f56-b7cd-2ff2640e3fcc","displayName":"Vera K.","slug":"vera-kelly","biography":"\u003cp\u003e\u003cbr\u003eVera Kelly, a Junior at Cornell University with an unwavering passion for the arts, is excited to introduce herself as a proud participant in the Curious Cardinals mentorship program. Hailing from the bustling heart of Manhattan, Vera's enthusiasm to connect with both parents and their children knows no bounds.\u003c/p\u003e\u003cp\u003eWith a diverse skill set at her disposal, Vera is ready to offer her expertise in various academic subjects. She can provide tutoring and guidance in Math, Science, and English, making her a valuable resource for young learners seeking support in their academic endeavors. What sets Vera apart, however, is her special affinity for helping individuals with learning differences. She possesses a unique ability to adapt her teaching methods to cater to each student's needs, ensuring that they not only succeed but also gain confidence in their abilities.\u003c/p\u003e\u003cp\u003eVera's true specialty and heartfelt passion lie within the realm of the arts. She is a proficient coach in both visual and performing arts, making her a well-rounded mentor for creative souls. Vera has honed her skills as an acting and singing coach, and she is committed to nurturing the talents of aspiring artists. Whether it's perfecting a monologue, hitting the right notes in a song, or exploring the world of visual arts, Vera is here to guide and inspire young artists on their creative journeys.\u003c/p\u003e\u003cp\u003eAs an active participant in the mentorship program, Vera is excited to create a welcoming and enriching environment where children can explore their interests, discover their strengths, and unleash their creativity. She believes that the arts are a powerful tool for personal growth and self-expression, and she is dedicated to helping young individuals shine in their chosen artistic endeavors.\u003c/p\u003e\u003cp\u003eVera Kelly looks forward to forging meaningful connections with parents and children alike and she can't wait to embark on this inspiring educational journey with all participants.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Fine Arts","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7ac17cbb-fbc5-455d-9051-a6e302ab8c9b\"}"},{"__ref":"DeepDives:{\"uuid\":\"3aeeb04b-14ac-4c3b-b7c4-8d4370962c36\"}"},{"__ref":"DeepDives:{\"uuid\":\"097c8640-c906-49df-8739-be8d6e25154c\"}"},{"__ref":"DeepDives:{\"uuid\":\"6cf58a9b-0699-4b38-b31c-43bf81c4c64b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/691805e2-2874-44da-9214-94bea3ca783b/-/preview/-/format/jpg/","https://ucarecdn.com/0e0d7b1a-fd43-48be-9c0a-8d10234c41f3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":
