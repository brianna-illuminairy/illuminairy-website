xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b6617c28-7cd9-46a2-95b6-271fcd1940ca\"}":{"__typename":"Favorites","uuid":"b6617c28-7cd9-46a2-95b6-271fcd1940ca","photoUrl":"https://ucarecdn.com/e4e3899a-4d2a-4814-96ca-44b541930046/","title":"Interstellar","type":"MOVIE"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"654cbfad-40f3-4db5-b595-14ee3a3d59f1\"}":{"__typename":"DeepDives","uuid":"654cbfad-40f3-4db5-b595-14ee3a3d59f1","content":"\u003cp\u003eI hope at least one person could say \"Alice really changed my life\" in any way! Bringing positive change to people's lives and being remembered are what I wish could be my lifetime acheivement.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"4beb4d3b-6922-4600-9fc9-071337b59bca\"}":{"__typename":"DeepDives","uuid":"4beb4d3b-6922-4600-9fc9-071337b59bca","content":"\u003cp\u003eI was super active in student activities and tried a bunch of different things! In my first year of high school, I studied hard for Gaokao (the Chinese college entrance exam),  learned to play bridge, and played basketball with friends. Then I transfered to the international department because I decided to apply for US colleges. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my second year, I was elected as president of our student government and organized activities throughout the school, the city and the nation. Academically, I did research in astronomy and competed in the Young Physicist Tornament.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my third and last year of high school (it's 3 years in China), I applied for college, started a ultimate-frisbee team, and worked at my favorite cafe.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4ff3dad7-f313-4912-81d5-704104d066e1\"}":{"__typename":"DeepDives","uuid":"4ff3dad7-f313-4912-81d5-704104d066e1","content":"\u003cp\u003e\u003cem\u003eDefending the Skies: The Science and Significance of the Golden Dome\u003c/em\u003e is a hands-on project that helps students explore how real-world technology keeps us safe. We dive into the science behind missile defense systems — how radar detects incoming objects, how interceptors track and respond, and why timing matters so much. To make it fun and relatable, we compare it all to catching a football mid-air — figuring out where it’s going, how fast it’s moving, and when to react.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcross eight sessions, students get to think like scientists and problem-solvers. They’ll look at real examples, build simple models or diagrams, and even debate big questions like: \u003cem\u003eCan science truly protect peace?\u003c/em\u003e By the end, they’ll create a short research project and presentation called \u003cem\u003e“The Science Behind the Golden Dome: How Feasible Are Missile Defense Shields?”\u003c/em\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis project is perfect for curious learners who love mixing science, creativity, and world events. It’s not about memorizing facts — it’s about understanding how technology works in real life and discovering the excitement of solving problems that really matter. Students will walk away with stronger research skills, confidence in presenting ideas, and a deeper appreciation for how science shapes our world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f20f00c8-c562-4d3b-a9c4-c7f590eaf9e6\"}":{"__typename":"DeepDives","uuid":"f20f00c8-c562-4d3b-a9c4-c7f590eaf9e6","content":"\u003cp\u003eIn one phrase: I enjoy arts and sports. Specifically, I sing in Yale's biggest and only choir - the Yale Glee Club; I produce musicals and currently also a film on campus; and I played the piano and the violin for many years. As for sports, I ride horses, I work out, and I play squash or basketball with my friends from time to time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"1412b68e-503f-40dd-b02e-2ccf8a79c0a8\"}":{"__typename":"School","uuid":"1412b68e-503f-40dd-b02e-2ccf8a79c0a8","name":"High School Affiliated to Renmin University of China","city":"Haidian","type":"HIGH","state":"Beijing","country":"China","zip":"100086"},"Education:{\"uuid\":\"cb9ac0ff-339e-47f0-a7a4-ee93013f20f6\"}":{"__typename":"Education","uuid":"cb9ac0ff-339e-47f0-a7a4-ee93013f20f6","school":{"__ref":"School:{\"uuid\":\"1412b68e-503f-40dd-b02e-2ccf8a79c0a8\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"05dcb0b7-df6a-464f-8031-2307be938c32\"}":{"__typename":"Education","uuid":"05dcb0b7-df6a-464f-8031-2307be938c32","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Astronomy and Global Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"3f6c5072-75fd-4313-856a-9e2443c91479\"}":{"__typename":"MentorPublicProfile","uuid":"3f6c5072-75fd-4313-856a-9e2443c91479","displayName":"Alice C.","slug":"alice-cui","biography":"\u003cp\u003eHi there! I’m Alice — a junior at Yale University studying Global Affairs and Astronomy. I was born in Beijing and grew up in China, but I’ve been incredibly lucky to study and live in a few corners of the world along the way. So far, I’ve studied in five countries — China, Australia, the United States, Tanzania, and Turks and Caicos — and next semester, I’ll be heading to Switzerland! Each country has left a different imprint on me, from snorkeling with vibrant coral reefs in the Caribbean to watching the Milky Way stretch endlessly across the African sky. These experiences opened my eyes to how beautifully interconnected our planet is, both socially and environmentally, and made me appreciate the wonder in every place and person I meet.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love learning and teaching all kinds of cool things — anything from the mysteries of outer space to the habits of wild animals. I’m endlessly curious, and that curiosity has shaped both my studies and my values. I care deeply about wildlife conservation, sustainable development, space exploration, and international peace-building — areas where science, policy, and empathy come together to make the world a little better for everyone, and where collaboration can truly create change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of class, I’m always chasing experiences that keep life exciting and full of joy. I love singing (especially with the Yale Glee Club), scuba diving whenever I get the chance, trying new foods, and horse-riding — though not usually all at once! On campus, I stay involved in a mix of things: I do research on space policy, work at the Yale Law School, and previously served as president of the Chinese Student Union. In that role, I helped create spaces for cultural exchange, friendship, and celebration — connecting students from all over the world through shared curiosity, laughter, and community spirit.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always believed that interest is the best teacher. Every project, trip, or class I’ve taken started with one small question that grew into something much bigger. Whether I’m analyzing space governance, helping protect endangered species, or mentoring younger students, everything I do begins with curiosity and the excitement to explore the unknown.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLooking ahead, I hope to share that love of learning with more people — especially kids — and inspire them to find joy in discovery, just like I did. I can’t wait to meet you all, share stories, and explore new ideas together with open minds and happy hearts!\u003c/p\u003e","teachingVideoPlaybackId":"3eCebuvItt01lsO9vp6MYMB600p5gMH9fH9Fh018o4SXBc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b6617c28-7cd9-46a2-95b6-271fcd1940ca\"}"}],"causesSupported":[],"major":"Astronomy and Global Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"654cbfad-40f3-4db5-b595-14ee3a3d59f1\"}"},{"__ref":"DeepDives:{\"uuid\":\"4beb4d3b-6922-4600-9fc9-071337b59bca\"}"},{"__ref":"DeepDives:{\"uuid\":\"4ff3dad7-f313-4912-81d5-704104d066e1\"}"},{"__ref":"DeepDives:{\"uuid\":\"f20f00c8-c562-4d3b-a9c4-c7f590eaf9e6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9cd6972a-425d-4151-98b5-a8224200ba12/-/preview/-/format/jpg/","https://ucarecdn.com/25086a53-d789-472c-a676-0ac1
