xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bf4cd0d0-96d8-4882-99d4-ad5452299bfb\"}":{"__typename":"Favorites","uuid":"bf4cd0d0-96d8-4882-99d4-ad5452299bfb","photoUrl":"https://ucarecdn.com/96407bfd-85d0-4b68-9a28-bb722deb8ba3/","title":"Matt Damon","type":"ACTOR"},"Favorites:{\"uuid\":\"86d8c4a9-1530-462a-9e55-63faf10270ec\"}":{"__typename":"Favorites","uuid":"86d8c4a9-1530-462a-9e55-63faf10270ec","photoUrl":"https://ucarecdn.com/33b2526a-cd39-4589-960e-d7eed2fcf524/","title":"Anna Karenina","type":"BOOK"},"Favorites:{\"uuid\":\"1ee2d272-a559-49ee-bcba-06ff031103f9\"}":{"__typename":"Favorites","uuid":"1ee2d272-a559-49ee-bcba-06ff031103f9","photoUrl":"https://ucarecdn.com/ddf8af99-82cf-4e21-95e5-2e34f316b821/","title":"Joe Burrow","type":"ATHLETE"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a71ed1a4-9452-492f-9754-a877b4f41cdb\"}":{"__typename":"DeepDives","uuid":"a71ed1a4-9452-492f-9754-a877b4f41cdb","content":"\u003cp\u003eIn my summers, I conducted science research mostly. I worked at a lab at UF Scripps studying targeted protein degradation (which is a form of cancer therapeutics). I also worked with the Miami Marlins Foundation to help coordinate summer baseball leagues for kids in Miami who wouldn't otherwise be able to play.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a3b70c67-7dc3-45e7-8ea0-3a42e5bd2c52\"}":{"__typename":"DeepDives","uuid":"a3b70c67-7dc3-45e7-8ea0-3a42e5bd2c52","content":"\u003cp\u003eDon’t be afraid to ask questions—even the “dumb” ones. In high school, I spent way too much time pretending I understood things when I didn’t, just because I didn’t want to look like I was behind. What I’ve learned since then is that most people are quietly confused about the same things, and the only difference between falling behind and getting ahead is whether or not you’re willing to speak up. Being curious isn’t a weakness—it’s how you get better.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlso, please use a planner. You’ll thank me later.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"4af91e02-6a31-4bce-aad6-c8228d5ad0e0\"}":{"__typename":"DeepDives","uuid":"4af91e02-6a31-4bce-aad6-c8228d5ad0e0","content":"\u003cp\u003eBecause I remember exactly what it felt like to be on the other side—curious, ambitious, and completely unsure of what direction to go in. Mentorship gives me a chance to help someone navigate that space, not by handing them answers, but by helping them ask better questions. Some of the most meaningful parts of my education weren’t classes—they were conversations with people just a few years ahead of me who opened my eyes to possibilities I didn’t know existed. If I can play that role for someone else, even in a small way, I think that’s time incredibly well spent.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"72523245-dc97-4048-87c2-8488104ffe40\"}":{"__typename":"DeepDives","uuid":"72523245-dc97-4048-87c2-8488104ffe40","content":"\u003cp\u003eMy greatest source of motivation is the idea that knowledge shouldn't stay locked in labs, lectures, or textbooks—it should actually help people. Whether I’m working in a research lab or mentoring a younger student, what drives me is figuring out how to translate complexity into something useful. That mindset pushes me to keep learning, keep asking questions, and keep looking for ways to bridge the gap between theory and real-world impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"07fb5f3c-ad33-4d20-afd0-6229f32f7cae\"}":{"__typename":"School","uuid":"07fb5f3c-ad33-4d20-afd0-6229f32f7cae","name":"Pine Crest School","city":"Fort Lauderdale","type":"HIGH","state":"Florida","country":"United States","zip":"33334"},"Education:{\"uuid\":\"adec0acd-2c13-4a7b-9914-56d13bfe3ba1\"}":{"__typename":"Education","uuid":"adec0acd-2c13-4a7b-9914-56d13bfe3ba1","school":{"__ref":"School:{\"uuid\":\"07fb5f3c-ad33-4d20-afd0-6229f32f7cae\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"48675d1f-96e2-49e2-ab58-9d901dc5086a\"}":{"__typename":"Education","uuid":"48675d1f-96e2-49e2-ab58-9d901dc5086a","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Biochemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"f7d1b44d-3980-419c-94bf-97df84469cfd\"}":{"__typename":"MentorPublicProfile","uuid":"f7d1b44d-3980-419c-94bf-97df84469cfd","displayName":"Alex S.","slug":"alex-schnurman","biography":"\u003cp\u003eHi! My name is Alex Schnurman, and I’m currently studying Biochemistry at the University of Pennsylvania, with a focus on the intersection of science, healthcare, and business. I’ve always been curious about how complex biological systems work—and just as importantly, how we can translate those discoveries into real-world therapies that actually reach patients.\u003c/p\u003e\u003cp\u003eI’m currently conducting research in a cardiac immunology lab, where I’m working on engineering a protein-based therapy to reduce damage caused by heart attacks. Prior to that, I spent a summer at UF Scripps Biomedical Research, where I worked on the development of targeted protein degraders (called PROTACs) for cancer treatment. This project won the Transformative Research Award and a $4.5 million grant from the NIH. That experience gave me a window into both the experimental side of drug development and how scientific discoveries can turn into real biotech products. I’ve also started intering with a healthcare AI startup, learning how machine learning models are built to improve medical communication and diagnosis.\u003c/p\u003e\u003cp\u003eOutside the lab, I’m part of the Wharton Undergraduate Healthcare Club and the Wharton Investment and Trading Group, where I help analyze biotech and pharma companies from both a scientific and financial perspective. I even co-founded a new club that helps students explore long-term trends in business and industry.\u003c/p\u003e\u003cp\u003eBut I’m not all lab coats and spreadsheets—I’m also a huge baseball fan. I played competitively growing up and still carry that team-first mentality into everything I do. Whether it’s breaking down a chemistry concept or preparing for a big test, I think learning works best when it feels like a collaborative process—not a lecture.\u003c/p\u003e\u003cp\u003eI’ve been in your shoes before, and I know what it’s like to struggle with difficult material. I also know how satisfying it is when things finally click. My goal as a tutor is to meet you wherever you are—whether that’s mastering high school chemistry or exploring college-level science—and build a game plan together. I love digging into questions, drawing real-world connections, and helping students develop confidence along the way.\u003c/p\u003e\u003cp\u003eLooking forward to learning together!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","teachingVideoPlaybackId":"o010001cpkG4tdA3zBVHW83Dybztj1H6nuQTb6EA00kZDwE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGrowing up I loved playing baseball. I played very competitively. During my time playing in high school, I won Broward 3A-13 All-District Team OF, was selected to play in Broward vs Miami Future Showdown, and was Sun-Sentinel 5A-1A All Broward County Baseball Second Team OF. Although I no longer play baseball competitively, I play in a softball league with my friends at Penn!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"bf4cd0d0-96d8-4882-99d4-ad5452299bfb\"}"},{"__ref":"Favorites:{\"uuid\":\"86d8c4a9-1530-462a-9e55-63faf10270ec\"}"},{"__ref":"Favorites:{\"uuid\":\"1ee2d272-a559-49ee-bcba-06ff031103f9\"}"}],"causesSupported":[],"major":"Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a71ed1a4-9452-492f-9754-a877b4f41cdb\"}"},{"__ref":"DeepDives:{\"uuid\":\"a3b70c67-7dc3-45e7-8ea0-3a42e5bd2c52\"}"},{"__ref":"DeepDives:{\"uuid\":\"4af91e02-6a31-4bce-aad6-c8228d5ad0e0\"}"},{"__ref":"DeepDives:{\"uuid\":\"72523245-dc97-4048-87c2-8488104ffe40\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d9e08585-4444-43a6-8999-1ef096a7c21c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"adec0acd-2c13-4a7b-9914-56d13bfe3ba1\"}"},{"__ref":"Education:{\"uuid\":\"48675d1f-96e2-49e2-ab58-9d901dc5086a\"}"}],"hiredAt":"2025-05-01T05:07:05.591Z","topics":["Statistics","Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics"],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alex-schnurman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f7d1b44d-3980-419c-94bf-97df84469cfd\"}"}}},"_sentryTraceData":"493567c368df4d5dbaf8b79e8275e325-9de1245b5f363616-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=493567c368df4d5dbaf8b79e8275e325,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alex-schnurman"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
