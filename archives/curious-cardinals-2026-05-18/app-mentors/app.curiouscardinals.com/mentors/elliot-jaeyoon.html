xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"37c0c819-63ef-4b57-8ddd-ce4658d24c09\"}":{"__typename":"DeepDives","uuid":"37c0c819-63ef-4b57-8ddd-ce4658d24c09","content":"\u003cp\u003eThis past Summer, I worked at a real estate investment firm with confidential access to a large dataset of property pricing. With this, I was able to train a machine learning model to optimally predict the price of a given piece of property. It was extremely rewarding to present my findings to the executive board of the company. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"738f2754-c4d4-4ac2-8028-08e708cafc80\"}":{"__typename":"DeepDives","uuid":"738f2754-c4d4-4ac2-8028-08e708cafc80","content":"\u003cp\u003eMentorship is vastly different than traditional tutoring, as it allows for genuine connection between a student and their teacher. Inspiring a student through sharing passions is extremely important to me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"083f1153-db68-4de5-981d-2c801a40d2f3\"}":{"__typename":"DeepDives","uuid":"083f1153-db68-4de5-981d-2c801a40d2f3","content":"\u003cp\u003eI’ve been mesmerized by Mr. Rogers' attempts to shift viewer focus from self to service. With him, we learned about the processes most Americans take for granted through questions which were probing yet simple enough for his audience of young children. The equal amount of care and respect Fred Rogers gave to each of his real-world subjects helped me recognize that every minor curiosity is worth exploring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"26b8564f-e1d7-483a-b178-9993dd7074e2\"}":{"__typename":"DeepDives","uuid":"26b8564f-e1d7-483a-b178-9993dd7074e2","content":"\u003cp\u003eBefore Stanford, I had never taken an Econ or CS class. Coming into college, I determined that an interdisciplinary approach to learning would make me a more well-rounded individual. Majoring in CS and Econ provides me with tools to think about issues from multiple perspectives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"0a0fe670-d94b-4937-ac99-c570c3741de7\"}":{"__typename":"School","uuid":"0a0fe670-d94b-4937-ac99-c570c3741de7","name":"Lincoln High School","city":"Portland","type":"HIGH","state":"Oregon","country":"United States","zip":"97205"},"Education:{\"uuid\":\"85a8c4e8-42b2-42e1-b4da-cd75c60606ee\"}":{"__typename":"Education","uuid":"85a8c4e8-42b2-42e1-b4da-cd75c60606ee","school":{"__ref":"School:{\"uuid\":\"0a0fe670-d94b-4937-ac99-c570c3741de7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"8421d869-abc4-421e-881b-9ddf8be83777\"}":{"__typename":"Education","uuid":"8421d869-abc4-421e-881b-9ddf8be83777","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics/Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"a32b1bae-4b7f-4622-9f3e-c72a619fae1b\"}":{"__typename":"MentorPublicProfile","uuid":"a32b1bae-4b7f-4622-9f3e-c72a619fae1b","displayName":"Elliot J.","slug":"elliot-jaeyoon","biography":"\u003cp\u003eHi! I am a Junior at Stanford studying Economics and Computer Science. I have over 6 years of teaching experience and have taught a wide range of subjects to a diverse set of students. As a mentor, developing relationships with students and keeping lessons engaging and fun is extremely important for easier learning. No matter the subject, I encourage students to think from multiple perspectives, as looking at problems from different angles is vital. \u003cbr\u003eThroughout school, I have been engaged with learning about Law, spearheading Stanford's Quantitative Finance Club, and working through Econ and CS problem sets. \u003cbr\u003eOutside of school, I love spending time outdoors. Growing up in the Pacific Northwest, I kayaked, hiked, backpacked, and tried to spend as much time outdoors as possible. I also started a couple non-profits, as I believe it is important for students to use their skills to give back to their community!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics/Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"37c0c819-63ef-4b57-8ddd-ce4658d24c09\"}"},{"__ref":"DeepDives:{\"u
