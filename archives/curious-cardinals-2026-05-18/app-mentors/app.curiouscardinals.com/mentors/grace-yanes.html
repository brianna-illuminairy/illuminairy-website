ted my interest in environmental science. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"27ca8815-c3f6-45d0-8d3d-2f28192a4e34\"}":{"__typename":"DeepDives","uuid":"27ca8815-c3f6-45d0-8d3d-2f28192a4e34","content":"\u003cp\u003eI am on the club ski team!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"8294116e-a190-41eb-a458-e542ee61c042\"}":{"__typename":"School","uuid":"8294116e-a190-41eb-a458-e542ee61c042","name":"St. Paul's School","city":"Concord","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03301"},"Education:{\"uuid\":\"d29b51d1-e065-4d11-8487-91a6d35e54ca\"}":{"__typename":"Education","uuid":"d29b51d1-e065-4d11-8487-91a6d35e54ca","school":{"__ref":"School:{\"uuid\":\"8294116e-a190-41eb-a458-e542ee61c042\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"f3e20c37-f2bd-44df-b504-691645d167c5\"}":{"__typename":"Education","uuid":"f3e20c37-f2bd-44df-b504-691645d167c5","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Environmental Science, Economics, and Spanish","degree":null},"MentorPublicProfile:{\"uuid\":\"b19b38ad-f2f0-452e-bf4a-544387774524\"}":{"__typename":"MentorPublicProfile","uuid":"b19b38ad-f2f0-452e-bf4a-544387774524","displayName":"Grace Y.","slug":"grace-yanes","biography":"\u003cp\u003eI'm Grace, a sophomore majoring in Environmental Studies at Yale University, originally from Washington, DC. In addition to my major, I'm pursuing an advanced certificate in Spanish because I'm passionate about breaking down language barriers and fostering cross-cultural connections.\u003c/p\u003e\u003cp\u003eOutside of the classroom, I have a love for adventure, particularly scuba diving. Exploring the intricate ecosystems beneath the ocean's surface fascinates me. I also enjoy cooking, and I'm a member of the Yale Club Ski team.\u003c/p\u003e\u003cp\u003eI'm an active volunteer tutor through the Yale Undergraduate Prison Project, and I absolutely love teaching. The opportunity to empower and inspire others through education is something that truly excites me.\u003c/p\u003e\u003cp\u003eOne of the reasons I'm so passionate about tutoring, especially in math, is because I personally experienced the transformative power of tutoring when I was younger. I know what it feels like to struggle with a subject, and math was a significant challenge for me. However, thanks to the support and guidance of a tutor in middle school, I not only overcame my difficulties but also developed a deep appreciation for the subject. It was through these tutoring sessions that I realized the incredible impact that one-on-one guidance and mentorship can have on a student's understanding and confidence. Now, I find immense joy in being able to pay it forward and help others navigate their own academic journeys, hoping to instill in them the same sense of accomplishment and enthusiasm that I gained through tutoring. \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Environmental Science, Economics, and Spanish","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"abc94890-1364-491d-b420-551554fc7515\"}"},{"__ref":"DeepDives:{\"uuid\":\"9ca9b6d9-4ee6-4
