xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5ae123fd-87ab-41cb-944e-f259b4ce8306\"}":{"__typename":"Favorites","uuid":"5ae123fd-87ab-41cb-944e-f259b4ce8306","photoUrl":"https://ucarecdn.com/5b6ad222-eeaf-4d16-9bb4-7df08a05b99d/","title":"Philadelphia Eagles","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"25f8cae0-397a-47d1-a903-027b3633ac1b\"}":{"__typename":"Favorites","uuid":"25f8cae0-397a-47d1-a903-027b3633ac1b","photoUrl":"https://ucarecdn.com/4d4d4134-6d5e-4587-a72d-bebfc9ffde30/","title":"Bird Songs of a Killjoy, Bedouine","type":"ALBUM"},"Favorites:{\"uuid\":\"931559c1-cce6-4292-b702-5d168826e4b5\"}":{"__typename":"Favorites","uuid":"931559c1-cce6-4292-b702-5d168826e4b5","photoUrl":"https://ucarecdn.com/1c8a8197-42d3-4437-bece-a32d5c913aa6/","title":"A Book of Common Prayer, Joan Didion","type":"BOOK"},"CausesSupported:{\"uuid\":\"1193835f-603f-41aa-8572-09639b1c4fcb\"}":{"__typename":"CausesSupported","uuid":"1193835f-603f-41aa-8572-09639b1c4fcb","name":"Oxfam - Fighting Inequality to End Poverty and Injustice","description":"\u003cp\u003eSince my volunteer summer in 2023, I donate $5/month. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/7c8247ad-ea23-4492-bf0b-8948014d0637/"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"320abd4c-063e-4c80-9679-f087ed5f6315\"}":{"__typename":"DeepDives","uuid":"320abd4c-063e-4c80-9679-f087ed5f6315","content":"\u003cp\u003e\"And I thought about how, actually, if you wanted to, you could say the same thing about life. That \u003cem\u003elife\u003c/em\u003e is terrifying and overwhelming and it can happen at any moment. And when you're confronted with life you can either be cowardly or you can be brave, but either way you're going to live. So you might as well be brave.\" (Raphael Bob-Waksberg from \u003cem\u003eSomeone Who Will Love You in All Your Damaged Glory\u003c/em\u003e)\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eMy greatest source of motivation is life. \u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"a0a5c522-8b49-41cb-8be6-22a1e622292d\"}":{"__typename":"DeepDives","uuid":"a0a5c522-8b49-41cb-8be6-22a1e622292d","content":"\u003cp\u003eOnce, I saved two large adult men and their dog from an icy mountain whirlpool in New Hampshire with the help of seven 13 year olds and my co-tripper. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"701e30d8-cb1d-4e07-a071-f830f45ff2f4\"}":{"__typename":"DeepDives","uuid":"701e30d8-cb1d-4e07-a071-f830f45ff2f4","content":"\u003cp\u003eI am incredibly proud of my friends and family, and the relationships we have. Recently, Jake excelled at waterski nationals. Ryan spoke at a UN conference. Claire performed a live show in NYC. Nate created a series of short films. Kelsey attended an esteemed gala for her human rights charity. I am so proud of these people! They rock! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"466ac7e1-6c50-415e-b5f4-c2b0fda9e851\"}":{"__typename":"DeepDives","uuid":"466ac7e1-6c50-415e-b5f4-c2b0fda9e851","content":"\u003cp\u003eAsk yourself questions. How do I feel about this? Do I actually like that? What if I tried this? I would tell young Anya to take her inner monologue seriously, and to speak kindly. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"d21fab66-6eae-4e0e-b796-a630bbbc3d51\"}":{"__typename":"School","uuid":"d21fab66-6eae-4e0e-b796-a630bbbc3d51","name":"Strath Haven High School","city":"Nether Providence Township","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19086"},"Education:{\"uuid\":\"981d574f-323c-47f0-8f78-6044941304df\"}":{"__typename":"Education","uuid":"981d574f-323c-47f0-8f78-6044941304df","school":{"__ref":"School:{\"uuid\":\"d21fab66-6eae-4e0e-b796-a630bbbc3d51\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"0d85b1c4-c8f4-4992-a5b7-e9be7145a338\"}":{"__typename":"Education","uuid":"0d85b1c4-c8f4-4992-a5b7-e9be7145a338","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Psychology ","degree":null},"MentorPublicProfile:{\"uuid\":\"4d5e98d6-14e3-4bc6-80a0-17a4b78ca10b\"}":{"__typename":"MentorPublicProfile","uuid":"4d5e98d6-14e3-4bc6-80a0-17a4b78ca10b","displayName":"Anya H.","slug":"anya-hooper","biography":"\u003cp\u003eHi there,\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Anya Hooper. Loved ones affectionately call me Hoop, Hooper, Yooper, Hoopster, Hoopy, AHoop and Yaya.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs the oldest sister and cousin in my family and a camp counselor of 5+ years, I believe in the growth of all children. It is my philosophy that children are expansive and capable and wish most of all to be seen, to be able to trust, and to grow with others. Having had the lifelong privilege of looking up to and learning from incredible mentors, I wish to give back by sharing my experiences--especially the experience of having someone believe in you.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI graduated from Stanford this spring with a degree in Psychology, the study of thinking, feeling and behaving. I love English and the arts, but I also wanted to broaden my scientific understanding of humanity. Stanford is a stem school, after all! While I ended up majoring in Psychology, I found that my writing, art and art history courses and projects were the arenas where I could test and play with theories of humanity and expression the most.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis being said, I am happy to guide young learners who feel they have countless interests, struggle “choosing” what to do, or who need support channeling their attention and energy--Perhaps those who feel pressure to study one topic, but also have a talent in other areas. I am excited to explore with your student the many opportunities to connect seemingly disparate subjects. Ultimately, I’m interested in bringing ideas, knowledge and people together. For example, I am currently reading Leonard Shlain’s \u003cem\u003eArt and Physics\u003c/em\u003e, which I’ve been told is an interdisciplinary classic.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs embarrassing as it can be to try new things, it is the only way to discover and grow. I am passionate about creating environments where people feel safe, inspired and motivated to go for it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHere is some of what I tried at Stanford --\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI worked as a research assistant in the Behavioral Decisions and the Environment Lab developing coding analyses to understand risk perception, decision-making, and emotional and behavioral responses to environmental threats in the Bay Area. Our work is currently in the publication process.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was the Performance Manager for Mixed Company, Stanford’s foremost A Cappella group, leading the group to win an ICCA quarterfinals alongside a personal award for “Outstanding Choreography.”\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was a student organizer for the non-profit Class Action, which seeks to create a more equitable higher education system by empowering student voices. I oversaw the creation of Stanford Students for Educational Equity and through lobbying efforts, helped pass a fair admissions bill in California. (I traveled to Sacramento three times as the bill moved up.)\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my final quarter at Stanford, I completed an independent study in oil painting, I memorized a poem and planned an elaborate itinerary for travel to Taiwan, Vietnam and Thailand (which I pursued with two wonderful friends this past summer).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have energy for life, I’m enthusiastic and deeply committed to learning. I currently study oil painting at the Art Students League in New York City, read in a book club (we are reading Gabriel Garcia Marquez’s \u003cem\u003eLove in the Time of Cholera\u003c/em\u003e) and freelance on a book project. I have also continued supporting Class Action as an alum.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am at my absolute best with people and community to serve. I look forward to getting to know you and your family.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAll the best,\u0026nbsp;\u003c/p\u003e\u003cp\u003eAnya Hoop\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eP.S. I asked my oldest friend Annie* how she would describe me for this bio. Here is what she sent:\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e“Bright! Bubbly, eager to solve problems with an open mind/heart. Goofy! Seasoned 22 year old, well versed in all things growing-pain-related. Comedically on par with your 15 year old brother but also your 50 year old father. Attentive. Playful. Honest and moral, sometimes to a fault. Passionate and curious about both life and death. Lover of green beans.”\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e*We are the two in the center of the class photograph above. Me with the braids and very light pink sweater, Annie to the right with the yellow dress and folded hands. We met when we were 5 years old.\u003c/p\u003e","teachingVideoPlaybackId":"2O4wl016zxni71X3VUqLju4HgXQx02kihwnA00801WxuOGY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eAt 14, I overcame a life-threatening illness that left me unable to walk. After multiple misdiagnoses, a month-long hospitalization, finding the right treatment and months of physical therapy, I learned to walk again. Three years later I ran xc at the varsity level. The greatest accomplishment in this is not the walking or running, but the living. I am forever grateful to the wonderful people at Children's Hospital of Philadelphia and my family, especially to my mom who never left my bedside. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5ae123fd-87ab-41cb-944e-f259b4ce8306\"}"},{"__ref":"Favorites:{\"uuid\":\"25f8cae0-397a-47d1-a903-027b3633ac1b\"}"},{"__ref":"Favorites:{\"uuid\":\"931559c1-cce6-4292-b702-5d168826e4b5\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"1193835f-603f-41aa-8572-09639b1c4fcb\"}"}],"major":"Psychology ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"320abd4c-063e-4c80-9679-f087ed5f6315\"}"},{"__ref":"DeepDives:{\"uuid\":\"a0a5c522-8b49-41cb-8be6-22a1e622292d\"}"},{"__ref":"DeepDives:{\"uuid\":\"701e30d8-cb1d-4e07-a071-f830f45ff2f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"466ac7e1-6c50-415e-b5f4-c2b0fda9e851\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ead37c35-7e9c-427b-bd3f-6f36d81df47b/-/preview/-/format/jpg/","https://ucarecdn.com/7058557b-3c38-4473-8fd2-2009fdfff7b4/-/preview/-/format/jpg/","https://ucarecdn.com/5af90a9e-3c26-41b3-9fa6-e4735bd8372e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"981d574f-323c-47f0-8f78-6044941304df\"}"},{"__ref":"Education:{\"uuid\":\"0d85b1c4-c8f4-4992-a5b7-e9be7145a338\"}"}],"hiredAt":"2024-10-17T13:23:28.447Z","topics":["College Essay Writing","History Project","Music","Video / Photography","Visual Arts / Graphic Design","Film / Theater","Philosophy","Literature","Writing","French","Reading","History","Executive Function"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anya-hooper\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4d5e98d6-14e3-4bc6-80a0-17a4b78ca10b\"}"}}},"_sentryTraceData":"aa6b8c3e79d9407592d6ccf5c6579d9a-857a3b45cd0c9e42-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb75
