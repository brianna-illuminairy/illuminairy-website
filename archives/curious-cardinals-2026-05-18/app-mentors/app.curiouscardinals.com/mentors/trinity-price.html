xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6beb24a1-4aac-4106-9449-59bcf4be649b\"}":{"__typename":"Favorites","uuid":"6beb24a1-4aac-4106-9449-59bcf4be649b","photoUrl":"https://ucarecdn.com/90af0e9c-9e72-4242-a5b8-f2f6ccc49c26/","title":"The Sims 4","type":"GAME"},"Favorites:{\"uuid\":\"078956e5-64d8-471d-8397-7fde3e18442d\"}":{"__typename":"Favorites","uuid":"078956e5-64d8-471d-8397-7fde3e18442d","photoUrl":"https://ucarecdn.com/5bafc513-0c06-4198-9083-f404abc9f417/","title":"ATL!","type":"CITY"},"Favorites:{\"uuid\":\"16efb3a2-a3ce-4222-a97b-7577d784951b\"}":{"__typename":"Favorites","uuid":"16efb3a2-a3ce-4222-a97b-7577d784951b","photoUrl":"https://ucarecdn.com/2a1b0d80-94fc-4dd9-8a30-75421ea26898/","title":"Lilo and Stitch","type":"MOVIE"},"CausesSupported:{\"uuid\":\"c41b3f89-3c4f-4051-921c-8bbb6846e85c\"}":{"__typename":"CausesSupported","uuid":"c41b3f89-3c4f-4051-921c-8bbb6846e85c","name":"CardinalBLCK","description":"\u003cp\u003eCardinalBLCK- Alumni Coordinator and Communications Liaison \u003c/p\u003e","photoUrl":"https://ucarecdn.com/7cf8cf6a-6771-4a49-bfbf-decde48e2bb9/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"28daa1f6-c464-486f-9247-70a6e3d2a0ff\"}":{"__typename":"DeepDives","uuid":"28daa1f6-c464-486f-9247-70a6e3d2a0ff","content":"\u003cp\u003eOne piece of advice I would give my high school/middle school self is \"you are MORE than capable\". Looking back on my younger years, I would definitely say that I felt a lot of pressure and imposter syndrome coming into Stanford. I questioned my abilities and my skills, and I spent a lot of time worrying on whether or not I would be able to keep up with my peers. If there is one skill I've learned throughout my years here, it's that if no one else is betting on you, you can \u003cem\u003ealways\u003c/em\u003e bet on yourself. You are just as capable as anyone else, and, as cliché as it may sound, you really can do anything you put your mind to. I pride myself in being patient with myself, patting myself on the back when necessary, and believing in my skills and talents. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"73299007-6f6b-4f6f-8771-588ef389ce4d\"}":{"__typename":"DeepDives","uuid":"73299007-6f6b-4f6f-8771-588ef389ce4d","content":"\u003cp\u003eMentorship matters to me because I want to be able to give the same support and guidance to others that I feel like I received in high school/ my younger years. I think that humans thrive in community - we are meant to learn from one another and grow with one another. Mentorship is the perfect opportunity for me to be able to share some knowledge I've gathered along the way with younger kids, as well as learn new perspectives and experiences from my mentees. \u003c/p\u003e\u003cp\u003eIn my opinion, mentorship and Curious Cardinals is a symbiotic relationship; we learn from each other, and I would be more than honored to learn and grow with you all.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ed37bafa-f2c8-4fc3-874b-d7c078e00ef6\"}":{"__typename":"DeepDives","uuid":"ed37bafa-f2c8-4fc3-874b-d7c078e00ef6","content":"\u003cp\u003eI chose Human Biology with a concentration in Health and Development of Vulnerable Populations because it perfectly combines my passions for both STEM and the humanities. I’ve always loved exploring science and understanding how the body works, but I’m also equally drawn to reading, writing, and engaging with social issues. This major allows me to bridge those interests while working toward a larger purpose. As a woman, a Black woman, and someone deeply committed to justice and equity, I feel a responsibility to amplify the voices of those who are often unheard. Through this field, I hope to address systemic inequities and empower vulnerable communities by combining scientific knowledge with thoughtful advocacy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"a33f4b13-cc7a-4820-8468-0488e244fa9d\"}":{"__typename":"DeepDives","uuid":"a33f4b13-cc7a-4820-8468-0488e244fa9d","content":"\u003cp\u003eSomething about me that isn’t obvious right away is that I actually \u003cem\u003ereally\u003c/em\u003e enjoy listening more than talking. I find that I learn a lot by paying attention to others and their perspectives. I also value the power of humility—it’s something that doesn’t always stand out, but I believe it’s important to stay grounded and recognize that there’s always more to learn from others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"ca987983-ea1c-42ea-953e-54596149d8ed\"}":{"__typename":"School","uuid":"ca987983-ea1c-42ea-953e-54596149d8ed","name":"Buford High School","city":"Buford","type":"HIGH","state":"Georgia","country":"United States","zip":"30518"},"Education:{\"uuid\":\"499ae537-56da-4fa8-b239-289e85a6f45f\"}":{"__typename":"Education","uuid":"499ae537-56da-4fa8-b239-289e85a6f45f","school":{"__ref":"School:{\"uuid\":\"ca987983-ea1c-42ea-953e-54596149d8ed\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"5f4832ee-c29e-4b07-9445-36a5e7929b69\"}":{"__typename":"Education","uuid":"5f4832ee-c29e-4b07-9445-36a5e7929b69","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"57846b16-e81f-48f9-a351-2c21fa105b84\"}":{"__typename":"MentorPublicProfile","uuid":"57846b16-e81f-48f9-a351-2c21fa105b84","displayName":"Trinity P.","slug":"trinity-price","biography":"\u003cp\u003eHi! I’m Trinity-a student, athlete, mentor, and lifelong learner with roots just outside of Atlanta, Georgia. As a kid, I spent a lot of time outside running around, exploring, and letting my imagination lead the way. I was always drawn to stories, science, and anything that helped me better understand the world and the people in it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was \u003cem\u003ealso\u003c/em\u003e always the kid running from one thing to the next- between track practice, schoolwork, and club meetings, I got used to managing a pretty full schedule. In high school, I led a nonprofit focused on underserved youth and vulnerable populations in Atlanta, and since then, I’ve continued working with students of all ages - from early learners building confidence to middle schoolers crafting personal essays.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passions and interests led me to Stanford, where I’m now a senior majoring in Human Biology with a concentration in Health and Development of Vulnerable Populations. Mentoring felt like the perfect opportunity for me to explore my interests that aligned with my major, such as working in pediatric healthcare, where I can support kids holistically. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academic and mentoring, I’m also a sprinter on Stanford’s Track \u0026amp; Field team, which means I've become an excellent multi-tasker, balancing intense academics with athletics. I love mentoring ambitious students, especially those trying to juggle big dreams with busy lives. Whether it's test prep, writing a killer essay, or navigating school stress, I’m all about helping students stay confident, curious, and empowered.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not studying, training, or mentoring, I love movies, creative projects (like writing stories and making videos), and finding new places to explore. As a mentor, I bring that same spirit of curiosity and discovery into the work I do with students- making sure they feel confident, cared for, and capable every step of the way.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWe’ll figure out what works best for you and we’ll do it together!\u003c/p\u003e","teachingVideoPlaybackId":"VyC1J6Ebi00COqmJdCKkeJS9tkrdJwL00HVm17QBXXBkA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing that continues to be one of my biggest accomplishments isn’t Stanford or internships or grades, but rather the time I tried out for the middle school volleyball team despite knowing I was \u003cem\u003eawful\u003c/em\u003e at volleyball (and continue to be to this day :) ). It might seem silly, but at the time, I wasn’t the most athletic or skilled player. I decided to bet on myself, though, and even though I didn’t make the team, I walked away proud of myself for trying. It taught me that it's okay to put yourself out there, even when the odds are against you. That moment stuck with me and continues to shape how I approach challenges today.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"6beb24a1-4aac-4106-9449-59bcf4be649b\"}"},{"__ref":"Favorites:{\"uuid\":\"078956e5-64d8-471d-8397-7fde3e18442d\"}"},{"__ref":"Favorites:{\"uuid\":\"16efb3a2-a3ce-4222-a97b-7577d784951b\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"c41b3f89-3c4f-4051-921c-8bbb6846e85c\"}"}],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"28daa1f6-c464-486f-9247-70a6e3d2a0ff\"}"},{"__ref":"DeepDives:{\"uuid\":\"73299007-6f6b-4f6f-8771-588ef389ce4d\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed37bafa-f2c8-4fc3-874b-d7c078e00ef6\"}"},{"__ref":"DeepDives:{\"uuid\":\"a33f4b13-cc7a-4820-8468-0488e244fa9d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8247ac16-e591-4c7f-9e53-520fcc4ab856/-/preview/-/format/jpg/","https://ucarecdn.com/161965ee-a9a3-425d-aff6-2d13a3b8b967/-/preview/-/format/jpg/","https://ucarecdn.com/bf857b93-c04d-43df-8385-c702805f6666/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"499ae537-56da-4fa8-b239-289e85a6f45f\"}"},{"__ref":"Education:{\"uuid\":\"5f4832ee-c29e-4b07-9445-36a5e7929b69\"}"}],"hiredAt":"2024-12-03T16:15:23.793Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"trinity-price\"}})":{"__ref":"MentorPub
