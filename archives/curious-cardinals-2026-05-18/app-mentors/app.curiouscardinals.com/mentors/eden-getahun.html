xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3e7080af-e68a-42da-884d-7cdf05c3da3f\"}":{"__typename":"DeepDives","uuid":"3e7080af-e68a-42da-884d-7cdf05c3da3f","content":"\u003cp\u003eAs the first in my family to attend college and the eldest of three sisters, I often felt like I had to figure everything out on my own. I didn’t always know how to ask for help, and I struggled because of it. That experience sparked my passion for student advocacy and helping others navigate their own journeys. When I arrived at Harvard and gained access to resources and support networks, I realized just how powerful it is to have someone in your corner, encouraging and guiding you. I want to be that person for others—the mentor I wish I’d had—someone who helps students believe in themselves and achieve their goals with confidence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"bb3c5ee0-d418-4d40-bf86-14f0d7ebf13a\"}":{"__typename":"DeepDives","uuid":"bb3c5ee0-d418-4d40-bf86-14f0d7ebf13a","content":"\u003cp\u003e\u003cstrong\u003eWhat’s your greatest source of motivation?\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eMy greatest motivation comes from my parents, who immigrated to the U.S. and sacrificed so much to give me opportunities they never had. They’ve been my biggest supporters—my dad attended every debate tournament, and my mom juggled dropping three kids off at different schools each day with a smile. Their dedication and belief in me have shaped who I am today. I know that if you’re here, it’s because you care for your child with the same devotion my parents showed me, and I would be honored to pay that forward by supporting your child’s growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"8d2cceda-b94d-4415-912c-7107f381e2bc\"}":{"__typename":"DeepDives","uuid":"8d2cceda-b94d-4415-912c-7107f381e2bc","content":"\u003cp\u003eIt’s hard to imagine now, but I wasn’t always the confident person I am today. In middle school, I was shy and hesitant to raise my hand, worried about saying the wrong thing. Things began to change when I challenged myself to join activities like debate, where I discovered my voice and learned how to advocate for myself and others. That journey taught me that growth can look different for everyone, whether you’re introverted or outgoing. As a mentor, I love meeting students where they are and helping them find their confidence, no matter their starting point.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"336aad48-1ffb-4727-a998-b7a420ada3be\"}":{"__typename":"DeepDives","uuid":"336aad48-1ffb-4727-a998-b7a420ada3be","content":"\u003cp\u003e\u0026nbsp;I’m passionate about the arts and love immersing myself in creative communities. I spend time volunteering with local arts and culture organizations, attending events, and participating in open mics or poetry workshops. I’m always seeking new creative outlets—whether that’s learning from emerging poets, listening to thought-provoking podcasts, or exploring new artistic spaces. I also love diving into new areas of knowledge; lately, I’ve been exploring ethical AI through online courses. Curiosity fuels me, and I enjoy sharing that excitement for learning with others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"bf8c53c5-e1f8-4a46-88fa-61bcb3da24d4\"}":{"__typename":"School","uuid":"bf8c53c5-e1f8-4a46-88fa-61bcb3da24d4","name":"C.K. McClatchy High School","city":"Sacramento","type":"HIGH","state":"California","country":"United States","zip":"95818"},"Education:{\"uuid\":\"4aab61dc-780c-4c6d-96eb-79024eb9b8a3\"}":{"__typename":"Education","uuid":"4aab61dc-780c-4c6d-96eb-79024eb9b8a3","school":{"__ref":"School:{\"uuid\":\"bf8c53c5-e1f8-4a46-88fa-61bcb3da24d4\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"bf072378-be7f-45be-ac43-9289294e9b3e\"}":{"__typename":"Education","uuid":"bf072378-be7f-45be-ac43-9289294e9b3e","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"a5b397cb-399e-4191-8227-135434a646de\"}":{"__typename":"MentorPublicProfile","uuid":"a5b397cb-399e-4191-8227-135434a646de","displayName":"Eden G.","slug":"eden-getahun","biography":"\u003cp\u003eEden Getahun graduated from Harvard University in May 2025 with a degree in Social Studies and a secondary in Global Health and Health Policy. She has always been deeply curious about the ways art, culture, and health intersect, and she finds joy in spaces that allow her to explore creativity alongside advocacy. Whether through writing poetry, singing, collaging, or visiting museums, Eden sees the arts as a powerful tool for healing and community-building.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHer passion for advocacy began in high school at C.K. McClatchy, where she founded \u003cem\u003eGirls Across the Globe\u003c/em\u003e, an international women’s advocacy club. She was also an accomplished competitor in speech and performance: she ranked among the top 25 debate teams in the country and became the California Poetry Out Loud Champion. Beyond the stage, she served on Sacramento’s Student Advisory Council and worked with the County Board of Education to expand mental health programming.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Harvard, Eden’s love of art and health continued to shape her path. She founded \u003cem\u003eUni-Verse Poetry Collective\u003c/em\u003e, an inclusive space for student writers, and helped organize cultural programming as part of the Black Arts Collective. As Director of Programming for the Harvard Undergraduate Black Health Advocates, she led initiatives that connected wellness, activism, and community care. She also served as a Fellow at the Derek Bok Learning Lab, where she explored creative approaches to education and learning through tools like podcasts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorship has been a constant thread throughout Eden’s journey. She was a mentor with Harvard’s \u003cem\u003eEmerging Leaders Program\u003c/em\u003e, where she guided high school sophomores through academic, social, and leadership development. At the Cambridge After-School Program, she supported elementary school students with both tutoring and enrichment activities, combining academic support with creative play. She also coached debate at Garland and Delta High Schools, helping students strengthen their public speaking, research, and critical thinking skills. Across these roles, Eden has learned the importance of meeting students where they are and encouraging them to approach challenges with curiosity and confidence.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHer professional experiences reflect a similar fusion of creativity, strategy, and social impact. She has worked in marketing and cultural strategy at the National Museum of African American History and Culture, Art School Africa, and Nunchi Health, developing campaigns that uplift artists and foster dialogue. Most recently, she joined Pedagogy Ventures, an ethical education AI startup, where she supports research and projects at the intersection of artificial intelligence and equity in learning. She is also a Carnegie Young Leader for Civic Preparedness, where she designed arts-based civic learning modules for Boston public school students of color. Eden is excited to bring her passion for art, health, and education to Curious Cardinals and to support students in discovering their own unique paths!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"SCdK7MYmOc8tFWWkkUBDUjMHWU5fQO1vZBkQ01pzjcZI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3e7080af-e68a-42da-884d-7cdf05c3da3f\"}"},{"__ref":"DeepDives:{\"uuid\":\"bb3c5ee0-d418-4d40-bf86-14f0d7ebf13a\"}"},{"__ref":"DeepDives:{\"uuid\":\"8d2cceda-b94d-4415-912c-7107f381e2bc\"}"},{"__ref":"DeepDives:{\"uuid\":\"336aad48-1ffb-4727-a998-b7a420ada3be\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/
