xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0051da64-cf83-4456-8296-653c176152e2\"}":{"__typename":"DeepDives","uuid":"0051da64-cf83-4456-8296-653c176152e2","content":"\u003cp\u003eI would encourage my middle \u003cem\u003eand\u003c/em\u003e high school self to seek situations and environments that feel a little unfamiliar and outside my comfort zone because it is where I've found the most growth to occur. Being the least knowledgeable in the room, conversing with people who have entirely different perspectives, and placing myself in completely unfamiliar environments have been some of my best learning experiences.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUnfamiliar things and new situations are often scary, and my tendency was to try to avoid them. But I wish I had leaned into those experiences, instead of thinking “what if I fail?” I wish I had thought “let’s see what happens.” I’ve found that the mental shift toward trying something new makes a big difference and I believe you only really understand what you’re capable of when you push yourself to try.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"9929bf7a-897a-4ac5-839f-fbca0b2cfc20\"}":{"__typename":"DeepDives","uuid":"9929bf7a-897a-4ac5-839f-fbca0b2cfc20","content":"\u003cp\u003eI’m so fortunate to have had my own amazing mentors: teachers, peers, and other adults. Having experienced it firsthand, I strongly believe in the power of mentorship to help you grow into your most confident, capable, and best self!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne mentor stands out in particular for the large impact she’s had on me. She’s been my mentor for over five years (although we’re only five years apart), from middle school to high school and now into college. I aspire to have her passion, confidence and curiosity toward the world. She’s always encouraged me to take initiative, share my opinions, and embrace mistakes as part of learning and growing. Through it all, she has been an amazing support system and inspiration.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorship has given me so much and I want to pay forward the time, energy, and support others have invested in me. My mentors have had an immeasurable positive impact on my growth as a student and a person, improving my academic skills, helping me execute on decisions (small and big), and building my confidence. I want to do the same for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e71f9c18-1bf1-446a-b361-454b58c29a24\"}":{"__typename":"DeepDives","uuid":"e71f9c18-1bf1-446a-b361-454b58c29a24","content":"\u003cp\u003eIn my spare time, I enjoy:\u0026nbsp;\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003elong walks - my new favorite obsession has been walking to the national monuments during sunset. I love staring up at the Lincoln Memorial as the sky becomes a beautiful mix of red, orange, and yellow hues overhead.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003espending time with my friends and family - I'm very social and love chatting with my friends about everything from the political theory we learned in class to our wildest animal encounter. I also make sure to call my mom every day!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ereading - I’m always excited to cozy up in a swivel chair with my e-book overlooking the Potomac River.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eeating - I love food and will eat almost anything. My favorite dessert is chocolate lava cake with vanilla ice cream or matcha soft serve!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ce9bb986-3478-41db-a8e5-ae475b1a1440\"}":{"__typename":"DeepDives","uuid":"ce9bb986-3478-41db-a8e5-ae475b1a1440","content":"\u003cp\u003eOne of my passion projects is my blog, Chatz with Natz. I’ve never known what career I wanted to pursue, so I decided to interview people with interesting career paths and share their stories in the hopes of finding clarity and helping others do the same. Through crafting questions, conducting interviews, and writing articles, I grew significantly in both my verbal and written communication. I spoke with a wide variety of people and shared their stories with peers who were also uncertain about their own futures. I still remember the first time a classmate told me how much she loved one of my articles. Although I didn’t find an exact career from these discussions, I discovered what really matters to me: connecting with inspiring people, fostering environments where unconventional ideas are met with joy, and being in spaces where impact and growth intertwine. I’m proud not just of what I created, but what I learned through the process.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFun fact: I worked on the articles and website design with my own Curious Cardinals mentors!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"7f6069c4-555b-4a9d-be33-f399a28103a4\"}":{"__typename":"School","uuid":"7f6069c4-555b-4a9d-be33-f399a28103a4","name":"Harvard-Westlake","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"390cb68b-3ba5-4afb-ad5b-8caa747aaaff\"}":{"__typename":"Education","uuid":"390cb68b-3ba5-4afb-ad5b-8caa747aaaff","school":{"__ref":"School:{\"uuid\":\"7f6069c4-555b-4a9d-be33-f399a28103a4\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"a6a54092-3937-4f8d-a5b5-5570c529cb70\"}":{"__typename":"Education","uuid":"a6a54092-3937-4f8d-a5b5-5570c529cb70","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Undeclared","degree":null},"MentorPublicProfile:{\"uuid\":\"7149bb40-daea-4fc1-bdc9-32e74ae4a316\"}":{"__typename":"MentorPublicProfile","uuid":"7149bb40-daea-4fc1-bdc9-32e74ae4a316","displayName":"Natalie R.","slug":"natalie-ro-1","biography":"\u003cp\u003eHi! I'm Natalie, a freshman at Georgetown University from Los Angeles, California. I'm pursuing a major in Economics with minors in Science, Technology, and International Affairs (STIA) and Business Studies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m interested in many subjects, ranging from English to statistics, and I can often be found taking long walks while listening to podcasts or audiobooks around entrepreneurship. In my free time, I also enjoy trying new recipes, reading books or playing with my dog.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I co-chaired our Admissions Office’s Student Ambassador Program, where I led campus tours, spoke on panels, and organized events. I loved sharing my experiences and favorite memories with applicants and other visitors.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve been involved with Curious Cardinals since 2020, starting as a mentee, moving to High School Ambassador, becoming an intern and, most recently and excitingly, transitioning to mentor. As an intern this past summer, I worked on projects building and streamlining processes for growth events and workshops, planning the admin team retreat, and leading an end-to-end hiring search. This experience revealed how much I enjoy combining operational thinking with creativity to drive results and impact.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile I love interdisciplinary work, I've never known exactly what career I want to pursue. But I always knew I loved talking with people about their stories and experiences. That curiosity led me to start my own blog in 10th grade, Chatz with Natz, where I interviewed people with interesting careers, from screenwriters and movie trailer creators to nonprofit founders and venture capitalists, to learn about how they discovered their paths and built careers they love. While I didn’t necessarily identify a future career through these conversations, I did discover what I love: seeking inspiration, connecting meaningfully with people, and sharing my learnings and insights with others. It also reinforced my desire to surround myself with curious minds and kind hearts who inspire me to do and be better.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Georgetown, I serve as an admissions tour guide for Blue \u0026amp; Gray Tour Guide Society and I am also a member of the 1634 Society, Georgetown's largest philanthropy group. I am deeply curious, love learning new things, and am everyone’s biggest cheerleader. I can't wait to see what we can accomplish together!\u003c/p\u003e","teachingVideoPlaybackId":"xUDAvnAFrak009PrJkPvHQnurrxEj9vyGEpDSoVGwT78","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Undeclared","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0051da64-cf83-4456-8296-653c176152e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"9929bf7a-897a-4ac5-839f-fbca0b2cfc20\"}"},{"__ref":"DeepDives:{\"uuid\":\"e71f9c18-1bf1-446a-b361-454b58c29a24\"}"},{"__ref":"DeepDives:{\"uuid\":\"ce9bb986-3478-41db-a8e5-ae475b1a1440\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9e55ec4f-7c9a-4246-ac37-3d41ab8a921d/-/preview/-/format/jpg/","https://ucarecdn.com/a2020e53-74d7-44d6-a502-a9023d952ee1/-/preview/-/format/jpg/","https://ucarecdn.com/56a137df-41d7-4ab9-be91-11d1b19671f9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"390cb68b-3ba5-4afb-ad5b-8caa747aaaff\"}"},{"__ref":"Education:{\"uuid\":\"a6a54092-3937-4f8d-a5b5-5570c529cb70\"}"}],"hiredAt":"2026-01-04T23:51:52.156Z","topics":["K-5 Grade Math","6-8 Grade Science","Biology","Executive Function","K-6 Storybook","Visual Arts / Graphic Design","Business / Entrepreneurship","Web Design","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/4898ea96-6627-4c32-80af-8dd44881bd39/"],"restrictedProfileVisibility":true,"displayCampaignV
