xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"5f3c5919-b230-4144-ba0e-83564cf2cbb3\"}":{"__typename":"DeepDives","uuid":"5f3c5919-b230-4144-ba0e-83564cf2cbb3","content":"\u003cp\u003eMy biggest role model and mentor is my high school humanities teacher! Mr. Spars is an inspiration to everyone: not only is he kind, caring, and super knowledgable, but he's also a renowned storyteller! Regularly in his classes, you could find him recounting stories from the Mahabharata or his trips to Indonesia, always re-enacting certain parts that are sure to give you a laugh. He inspired in me not only a love for storytelling, but also a love of learning. Each day, I aspire to be like Mr. Spars: a passionate teacher, learner, hard worker, and kind human being. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"28be7849-0328-4481-b236-83622879a8f6\"}":{"__typename":"DeepDives","uuid":"28be7849-0328-4481-b236-83622879a8f6","content":"\u003cp\u003eEver since I was a kid, I've dreamed of performing a solo guitar concerto on a big stage. To me, it seems to be the most exhilarating musical adventure: honoring a celebrated composer, engaging with the orchestra at your back, connecting with the conductor and audience in front of you. From start to finish, you are telling a wordless story, one that captivates the audience both emotionally and physically. While I've had the privilege of experiencing the concerto as a listener, I dream of one day having the opportunity to become the performer. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9a2823cc-85ea-462b-adfa-c5143c866ce9\"}":{"__typename":"DeepDives","uuid":"9a2823cc-85ea-462b-adfa-c5143c866ce9","content":"\u003cp\u003eSomething I like to do in my free time is explore new cultures through food. Whether that's discovering new restaurants in my hometown, engaging in cultural events and celebrations, or traveling abroad with my family, I'm always looking to try new and adventurous cuisines! To me, food has the ability to bring people together and serve as a means of connection across cultures which is something I value. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"07758295-9569-4825-a19b-0dfbe833fbca\"}":{"__typename":"DeepDives","uuid":"07758295-9569-4825-a19b-0dfbe833fbca","content":"\u003cp\u003eTo my high school self: embrace the unknown. High school is a time for exploration, so take that class you know nothing about, join that club that's always peaked your interest, and attend those events that you wouldn't normally consider. I wouldn't be surprised if you discovered a newfound interest or passion from taking one of these unfamiliar leaps!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"bd82ae8e-4c65-48e5-936a-925785a9fba1\"}":{"__typename":"School","uuid":"bd82ae8e-4c65-48e5-936a-925785a9fba1","name":"Sonoma Academy","city":"Santa Rosa","type":"HIGH","state":"California","country":"United States","zip":"95404"},"Education:{\"uuid\":\"9b6494eb-fa3e-4e93-96a7-5fb8d72e79bb\"}":{"__typename":"Education","uuid":"9b6494eb-fa3e-4e93-96a7-5fb8d72e79bb","school":{"__ref":"School:{\"uuid\":\"bd82ae8e-4c65-48e5-936a-925785a9fba1\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"bf5e313b-6d3f-4b14-9205-7dcb93bb0ff4\"}":{"__typename":"Education","uuid":"bf5e313b-6d3f-4b14-9205-7dcb93bb0ff4","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science and Music","degree":null},"MentorPublicProfile:{\"uuid\":\"62cf05d2-94f9-4ce5-8908-ab0d89581881\"}":{"__typename":"MentorPublicProfile","uuid":"62cf05d2-94f9-4ce5-8908-ab0d89581881","displayName":"Ethan B.","slug":"ethan-boyers","biography":"\u003cp\u003eHi! My name is Ethan Boyers and I am a Sophomore at Stanford University pursuing a Bachelors in Computer Science as well as a Minor in Music. I was born and raised in Santa Rosa, California, which is just an hour or so north of San Francisco!\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the core parts of my identity is being a musician. I grew up playing classical guitar, and in high school, I pursued a higher musical education at the San Francisco Conservatory of Music. During junior and senior year, I attended a Pre-College program there on Saturdays, where I engaged in music theory and history classes, small ensembles, larger orchestras, and professional masterclasses. During the summers, I traveled across the country to compete in various guitar competitions and festivals, including the Guitar Foundation of America International Youth Competition and James Stroud Classical Guitar Competition, where, in 2022, I won 2nd and 3rd prizes, respectively. I was also able to record for the professional studio and non-profit Guitar Salon International, where proceeds went to providing underserved students with a musical education in downtown LA. Within my high school, I wrote a musical score for a production of A Midsummer Night’s Dream as the student music director and was also a part of various classical and jazz ensembles.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school, I enjoy playing tennis, exploring the outdoors with my golden doodle, attending concerts, and reading (Stephen King is one of my favorites!). I look forward to working with your kid and helping them achieve their goals, whether that’s understanding the complexities of algebra or integral calculus, developing a Python program, or working on new musical compositions!\u003c/p\u003e","teachingVideoPlaybackId":"88zMKi65AuzDa1EIgAjcMgePtqsS8sJF12plnNloM01U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science and Music","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5f3c5919-b230-4144-ba0e-83564cf2cbb3\"}"},{"__ref":"DeepDives:{\"uuid\":\"28be7849-0328-4481-b236-83622879a8f6\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a2823cc-85ea-462b-adfa-c5143c866ce9\"}"},{"__ref":"DeepDives:{\"uuid\":\"07758295-9569-4825-a19b-0dfbe833fbca\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e4c08edc-6fc6-4476-9a7a-fa21608b6718/-/preview/-/format/jpg/","https://ucarecdn.com/4210f41e-bf4a-4bad-a1e5-f6018b9acd54/-/preview/-/format/jpg/"],"pron
