xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0fc50c13-44f6-4f05-bd17-8f77a494e09c\"}":{"__typename":"Favorites","uuid":"0fc50c13-44f6-4f05-bd17-8f77a494e09c","photoUrl":"https://ucarecdn.com/d2a8fbf0-2757-4096-81d8-77c8f7167d2b/","title":"Tom Brady","type":"ATHLETE"},"Favorites:{\"uuid\":\"137b20b4-f8f5-4e5c-bf65-f6b2c3441c9d\"}":{"__typename":"Favorites","uuid":"137b20b4-f8f5-4e5c-bf65-f6b2c3441c9d","photoUrl":"https://ucarecdn.com/8df77eb0-0526-4f7b-8ef2-f9262ff03ad2/","title":"Dangerous (Morgan Wallen)","type":"ALBUM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a1012f4b-9fe0-4c38-a228-01afd07a0ecb\"}":{"__typename":"DeepDives","uuid":"a1012f4b-9fe0-4c38-a228-01afd07a0ecb","content":"\u003cp\u003eCollege admissions, academic success, and prestigious competitions are skill checks that can change the trajectory of your life. Unfortunately, there now exists a massive gap between those who have access to knowledgeable mentorship and those who don't. I attended an enormously competitive school in one of the USA's most cutthroat regions (NYC/Long Island), and I want to extend my knowledge and experience to help others succeed where I have (Yale + multiple T20 admit, STS Finalist, ISEF winner, top-14 ranked debater, AIME qualifier).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"73d5be95-1673-40d0-bc42-8b4a6a6920fa\"}":{"__typename":"DeepDives","uuid":"73d5be95-1673-40d0-bc42-8b4a6a6920fa","content":"\u003cp\u003eI participated in science research at Stony Brook University, attended highly competitive debate summer programs (National Symposium for Debate), and competed in junior sailing. I also started very early on college applications, having an intimate knowledge of timelines, details, and how to win admission. I would like to teach my students on how to win at research, at debate, and school, and at life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"8932c56d-d21f-4291-97b5-6ca3de8d60d7\"}":{"__typename":"DeepDives","uuid":"8932c56d-d21f-4291-97b5-6ca3de8d60d7","content":"\u003cp\u003eMy extensive knowledge of all areas of high school competition and college admissions. I was an internationally recognized researcher, nationally recognized debater, star student (14 APs taken, 98.5 GPA, 1550 SAT), and am now a walk-on varsity athlete on a Division 1 sports team. Whatever a student wants to excel at, I can help.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"842bce74-fdcf-4dd5-910b-18ec034a5ded\"}":{"__typename":"DeepDives","uuid":"842bce74-fdcf-4dd5-910b-18ec034a5ded","content":"\u003cp\u003eI'd like be the founder and managing partner of my own investment fund. Stephen Schwarzman, one of Yale's greatest modern alumni, founded Blackstone and turned it into the world's largest alternative investments firm. That's the footsteps I'd like to follow in.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"7733a6b8-8792-49de-9d04-33393cc9109c\"}":{"__typename":"School","uuid":"7733a6b8-8792-49de-9d04-33393cc9109c","name":"Syosset High School","city":"Syosset","type":"HIGH","state":"New York","country":"United States","zip":"11791"},"Education:{\"uuid\":\"1dea70cb-3997-4703-aca9-cdcb2eaf4d3a\"}":{"__typename":"Education","uuid":"1dea70cb-3997-4703-aca9-cdcb2eaf4d3a","school":{"__ref":"School:{\"uuid\":\"7733a6b8-8792-49de-9d04-33393cc9109c\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a9e86f1c-675e-44b1-b4d7-48c5e14d8733\"}":{"__typename":"Education","uuid":"a9e86f1c-675e-44b1-b4d7-48c5e14d8733","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics \u0026 Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"ad157279-f949-43ff-9980-66280c39c402\"}":{"__typename":"MentorPublicProfile","uuid":"ad157279-f949-43ff-9980-66280c39c402","displayName":"Vincent H.","slug":"vincent-huang","biography":"\u003cp\u003e\u003cbr\u003eVincent Huang is a rising sophomore at Yale University, majoring in Economics and Mathematics. He is expertly knowledgeable about high school competitions, academics, and college admissions. Before college, Vincent was a 2024 Regeneron Science Talent Search Top 40 Finalist, a 2023 Regeneron International Science \u0026amp; Engineering Fair 2nd Place Grand Award winner, the 14th ranked Lincoln-Douglas debater in the entire United States, and an American Invitational Mathematics Examination qualifier. He took 14 APs, held a 98.5 high school GPA, and had a 1550 SAT score. He currently attends Yale, and was admitted to multiple T20 universities. At Yale, he is also a walk-on varsity Division I student-athlete. His professional aspirations are to work in finance, where he is currently recruiting for top firms across private equity and investment banking. Whatever a student wants to succeed at, whether it is competitions, academics, or admissions, Vincent is here to help. Winning in competitions, academics, and admissions will change the course of your or your child’s life, but so much of how to win is gatekept. Vincent has already broken through the gatekeeping, and he is here to help you win.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"iiJb6LlMaXMPLHsUQwtQ4drIyVzv66fyT01Op1AJpbZA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0fc50c13-44f6-4f05-bd17-8f77a494e09c\"}"},{"__ref":"Favorites:{\"uuid\":\"137b20b4-f8f5-4e5c-bf65-f6b2c3441c9d\"}"}],"causesSupported":[],"major":"Economics \u0026 Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a1012f4b-9fe0-4c38-a228-01afd07a0ecb\"}"},{"__ref":"DeepDives:{\"uuid\":\"73d5be95-1673-40d0-bc42-8b4a6a6920fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"8932c56d-d21f-4291-97b5-6ca3de8d60d7\"}"},{"__ref":"DeepDives:{\"uuid\":\"842bce74-fdcf-4dd5-910b-18ec034a5ded\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4a88550e-e5d8-4541-918a-9856d758ce10/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1dea70cb-3997-4703-aca9-cdcb2eaf4d3a\"}"},{"__ref":"Education:{\"uuid\":\"a9e86f1c-675e-44b1-b4d7-48c5e14d8733\"}"}],"hiredAt":"2025-05-14T14:21:55.293Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Writing","Academic Coaching","Executive Functi
