xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e99f1258-b362-4497-a364-4bfd96b5572e\"}":{"__typename":"DeepDives","uuid":"e99f1258-b362-4497-a364-4bfd96b5572e","content":"\u003cp\u003eMentorship is critical to giving people the tools, confidence, and abilities to bring their best and make an impact that they want. I could not have found the success I had in college and in the lab without the experience and lessons that my counselors and mentors passed down to me. They helped me learn about the world I was living in, and more importantly, figure out how I wanted to work, live, and contribute to the communities I was a part of. The exposure and support a mentor provides is invaluable and can propel one through even the toughest challenges and most uncertain of situations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"1140431c-f865-49bb-a216-864e028a0a56\"}":{"__typename":"DeepDives","uuid":"1140431c-f865-49bb-a216-864e028a0a56","content":"\u003cp\u003eComing from a background where my family has not had the best access to education, I know the impact that an education can have on one’s life and community. As the first in my family to attend college, I have learned just how vital holistic mentorship is to succeeding both inside and outside the classroom. This is why it is so important that my mentees feel supported not only as students, but as people. In addition, my experience communicating my advanced academic interests and rigorous research passions in a home where even the concept of a cell is foreign has given me the ability to make mentorship and academic enrichment accessible for anyone, regardless of their previous experience. All you need is heart!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f2446226-ecd8-4cb4-bf39-9a104fb25d20\"}":{"__typename":"DeepDives","uuid":"f2446226-ecd8-4cb4-bf39-9a104fb25d20","content":"\u003cp\u003eI would tell my younger self to have confidence in my beliefs and identity. Unsure of how a teenager could make an impact, I hesitated to pursue my interests and get involved in activities. I often worried that I would not be a good fit and that I would be unable to work with more experienced folks. Now, I understand that teenagers not only contribute to projects, but fuel much of the change in the world through their perspectives, drive, and pure curiosity. I hope to help my mentees find their voice and make sure it is heard!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"55ff0fd1-560f-408b-8162-828388644994\"}":{"__typename":"DeepDives","uuid":"55ff0fd1-560f-408b-8162-828388644994","content":"\u003cp\u003eI spent my summers helping out my dad at our family bodega. Although this job may not seem the most fabulous, there is an incredible amount one can learn behind the counter. Working at a corner store (or any customer service position!) exposes one to an infinite diversity of personalities and identities. Simply asking a person how their day has been can reveal deep insight into their universe. It was this focus on empathy that made my time at Central so enriching. This experience laid the foundation for my work ethic and commitment to serving my community, I wouldn’t trade it for the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"73744ab1-3413-4c10-be6d-16c5497f85b2\"}":{"__typename":"School","uuid":"73744ab1-3413-4c10-be6d-16c5497f85b2","name":"Coronado High School","city":"Coronado","type":"HIGH","state":"California","country":"United States","zip":"92118"},"Education:{\"uuid\":\"c3ae4ee0-140d-4557-b3b7-b06ae2ce075e\"}":{"__typename":"Education","uuid":"c3ae4ee0-140d-4557-b3b7-b06ae2ce075e","school":{"__ref":"School:{\"uuid\":\"73744ab1-3413-4c10-be6d-16c5497f85b2\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"f72a5e63-c83b-4338-a17d-dd8c59b85ae5\"}":{"__typename":"Education","uuid":"f72a5e63-c83b-4338-a17d-dd8c59b85ae5","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Molecular, Cellular, and Developmental Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"83f71233-7bf4-4f11-a67a-ca4002b022f8\"}":{"__typename":"MentorPublicProfile","uuid":"83f71233-7bf4-4f11-a67a-ca4002b022f8","displayName":"Andrew H.","slug":"andrew-harmez","biography":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlthough I was born in Mississauga, Canada, I grew up in America’s finest city: San Diego, California. I come from a very large family of Iraqi immigrants and have dedicated a lot of time learning about America and guiding our transition to our new home. With the invaluable support of family, teachers, and mentors, I became the first in my family to go to college. Having overcome so many challenges on my path to college taught me an incredible amount about the road to education and the process of discovering one’s interests and abilites. These experiences have fostered a passion for encouraging and empowering the next generation to pursue their goals, regardless of what barriers they face. I am grateful to have gotten the chance to pass along this wisdom to so many students over the years and look forward to lifting up many more inspirational students at Curious Cardinals\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I graduated \u003cem\u003ecum laude \u003c/em\u003ewith a degree in Molecular, Cellular, and Developmental Biology while also obtaining a certificate of advanced language study in Spanish. I am interested in all things science and am currently applying to medical school. Before becoming a Curious Cardinals mentor, I was a First-Year Counselor, supporting 13 first years in academics, activities, social life, health, and all other aspects of college living as they transitioned to life at Yale. On the weekends, I volunteered as an interpreter for HAVEN, a free clinic for the New Haven community. Whether I was mentoring students or welcoming a patient into the clinic, my favorite part of any activity is learning about and building genuine relationships with the people around me. Embracing people’s identity, interests, and concerns allows us to not only feel comfortable and grow as students but as people.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I am not riding around ambulances as a registered EMT or messing with amoebas in the lab, you can find me listening to new (and old, I love a good throwback) music while walking my maltipoo, playing any team sport, or just chilling and playing the Nintendo Switch. I attended a creative arts school during elementary and middle school and although I have mostly focused on STEM in the classroom, my love for exploring our environment through different artistic mediums has not faded a bit.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am so excited to hear about how you see and discover the world as we embark on our educational journey.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003e \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Molecular, Cellular, and Developmental Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e99f1258-b362-4497-a364-4bfd96b5572e\"}"},{"__ref":"DeepDives:{\"uuid\":\"1140431c-f865-49bb-a216-864e028a0a56\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2446226-ecd8-4cb4-bf39-9a104fb25d20\"}"},{"__ref":"DeepDives:{\"uuid\":\"55ff0fd1-560f-408b-8162-828388644994\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fc5c910b-6ec0-4503-866e-bc6a34ed3b26/-/preview/-/format/jpg/","https://ucarecdn.com/3453b66d-0abe-41d7-96d1-36f211b10f5e/-/preview/-/format/jpg/","https://ucarecdn.com/70b3aff7-be94-4aea-ab2c-31f064581a7a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c3ae4ee0-140d-4557-b3b7-b06ae2ce075e\"}"},{"__ref":"Education:{\"uuid\":\"f72a5e63-c83b-4338-a17d-dd8c59b85ae5\"}"}],"hiredAt":"2023-10-29T17:53:57.599Z","topics":["STEM Project","Medicine / Health","History Project","Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Spanish","Physics","Chemistry","Biology","6-8 Grade Science"],"commun
