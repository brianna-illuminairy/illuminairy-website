xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"debd11f9-bea5-479a-81a3-99e36a972b65\"}":{"__typename":"DeepDives","uuid":"debd11f9-bea5-479a-81a3-99e36a972b65","content":"\u003cp\u003eOne passion project I worked on was designing and building a patterned wooden cutting board using four different types of wood. I was interested in how different woods vary and I wanted to create a geometric pattern by carefully arranging small pieces together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe process required planning the layout, cutting and aligning many small pieces precisely, gluing them together, and sanding and finishing the surface to bring out the contrast between the woods. It took a lot of patience and iteration to get the alignment right and make the pattern come together cleanly.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"923605b9-0186-48f7-b60a-38004533b15f\"}":{"__typename":"DeepDives","uuid":"923605b9-0186-48f7-b60a-38004533b15f","content":"\u003cp\u003eIn my spare time I enjoy spending time with friends and family, exploring new cafes and brunch spots around the city. I also enjoy working on small creative projects through a small creative shop I run. It’s a fun way to explore design, storytelling, and connecting with people through meaningful objects. Outside of that, I enjoy learning about new topics or ideas I haven’t encountered before.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c99328b2-fcbd-481b-8e87-978f0c83c5f2\"}":{"__typename":"DeepDives","uuid":"c99328b2-fcbd-481b-8e87-978f0c83c5f2","content":"\u003cp\u003eIf could give advice to my middle or high school self, it would be to worry less about having everything figured out and spend more time exploring what genuinely interests you. When I was younger, I felt like I needed to know exactly what path I was going to take, but some of the most important parts of my journey came from trying things I wasn’t sure about at first.\u003c/p\u003e\u003cp\u003eI would also remind myself to ask more questions and seek out mentors. Conversations with people who shared their experiences ended up shaping my path in ways I never expected.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"a0eb66fd-0ec2-4394-a651-d3de9de16998\"}":{"__typename":"DeepDives","uuid":"a0eb66fd-0ec2-4394-a651-d3de9de16998","content":"\u003cp\u003eMentorship feels especially meaningful to me because mentors played an important role in shaping my own path. When I was in school, conversations with people who shared their experiences and encouraged my curiosity helped me discover interests I hadn’t considered before and gave me the confidence to explore them.\u003c/p\u003e\u003cp\u003eBecause of that, I really value the chance to support students who are still figuring out what excites them. Helping someone explore new ideas, build confidence in their abilities, and realize what they’re capable of is incredibly rewarding.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"15193e0b-daa4-4979-9375-2b9cca2751c1\"}":{"__typename":"School","uuid":"15193e0b-daa4-4979-9375-2b9cca2751c1","name":"University of Illinois Urbana-Champaign","city":"Champaign","type":"HIGH","state":"IL","country":"United States","zip":"61801"},"Education:{\"uuid\":\"c7275b39-cebe-44da-a794-f6779387eb7f\"}":{"__typename":"Education","uuid":"c7275b39-cebe-44da-a794-f6779387eb7f","school":{"__ref":"School:{\"uuid\":\"15193e0b-daa4-4979-9375-2b9cca2751c1\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"ffde1a58-e542-4214-ae7d-d3da005cb73a\"}":{"__typename":"Education","uuid":"ffde1a58-e542-4214-ae7d-d3da005cb73a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2024","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"5d8009d0-1629-4197-9be0-198366b92db5\"}":{"__typename":"MentorPublicProfile","uuid":"5d8009d0-1629-4197-9be0-198366b92db5","displayName":"Raefa M.","slug":"raefa-malik","biography":"\u003cp\u003eHi! I’m Raefa, a mechanical engineer who enjoys helping students explore their curiosity and turn ideas into projects they’re excited about.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy path into engineering wasn’t perfectly straightforward. When I first started college, I wasn’t entirely sure what direction I wanted to take. I ended up studying Mechanical Engineering at the University of Illinois Urbana-Champaign, where I slowly discovered how much I enjoyed understanding how things move, fit together, and work in the real world. Along the way, I met a mentor who introduced me to new areas of engineering and helped me see what was possible. That experience had a big impact on me and showed me how meaningful mentorship can be.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter finishing my undergraduate degree, I continued my studies in Mechanical Engineering at Stanford University. During that time, I worked on projects that involved mechanical design, robotics, and building physical systems. One of the things I enjoy most about engineering is the process of taking an idea and slowly turning it into something real - designing it, building it, testing it, and figuring out what needs to change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eToday I work as a mechanical engineer at a space startup where I help design hardware that operates in space. My work involves building and testing systems that interact with the physical world, and every day involves a lot of problem solving, experimentation, and teamwork.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTeaching and mentorship have also been an important part of my experience. During my undergraduate years I worked as a teaching assistant for Introduction to Engineering and later during graduate school I was a TA for Introduction to Solid Mechanics. Through those experiences I learned how to break down complicated ideas and help students feel more comfortable approaching technical problems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI enjoy working with students who are curious about STEM or simply trying to figure out what they’re interested in. Whether it’s exploring engineering concepts, brainstorming project ideas, or working through a challenging problem, I like helping students build confidence in their ability to learn and figure things out.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of engineering, I enjoy spending time with family and friends, trying new brunch spots, cafés, and pastry shops, and learning about topics I’ve never heard of before. I’m naturally curious and love discovering new ideas, which is probably what led me to engineering in the first place.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you enjoy asking questions and or building things, I’d be excited to work together and see what we can create!\u003c/p\u003e","teachingVideoPlaybackId":"xjAAFDqeASolcKp02o200OoFt00SMFZ83AFvZtLszeCm4U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"debd11f9-bea5-479a-81a3-99e36a972b65\"}"},{"__ref":"DeepDives:{\"uuid\":\"923605b9-0186-48f7-b60a-38004533b15f\"}"},{"__ref":"DeepDives:{\"uuid\":\"c99328b2-fcbd-481b-8e87-978f0c83c5f2\"}"},{"__ref":"DeepDives:{\"uuid\":\"a0eb66fd-0ec2-4394-a651-d3de9de16998\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cf52e7fb-35c2-4cb4-8b70-c717d8abc31f/-/preview/-/format/jpg/","https://ucarecdn.com/2a164f67-a608-4b67-80a8-4ae43ad39e4b/-/preview/-/format/jpg/","https://ucarecdn.com/c0371137-2e4f-4e42-884e-235e249ca746/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c7275b39-cebe-44da-a794-f6779387eb7f\"}"},{"__ref":"Education:{\"uuid\":\"ffde1a58-e542-4214-ae7d-d3da005cb73a\"}"}],"hiredAt":"2026-03-01T21:18:15.533Z","topics":["Precalculus / Trigonometry","Chemistry","Robotics / Electronics / CAD","STEM Project"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"raefa-malik\"}})":{"__ref":"MentorP
