xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"e49bbc58-3dd8-42ad-8da0-10f8e38ff364\"}":{"__typename":"DeepDives","uuid":"e49bbc58-3dd8-42ad-8da0-10f8e38ff364","content":"\u003cp\u003eMy Filipino heritage deeply shapes my teaching style. I grew up in a culture that values familial warmth, empathy, and communal care, and I carry those values into how I mentor students. I naturally approach teaching the way I approach family: with patience, encouragement, and a commitment to understanding the whole person. I try to build relationships that feel like the bonds I have with younger cousins or siblings, supportive, personal, and rooted in genuine care.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of this, I prioritize getting to know each student beyond academics. I want to understand their motivations, inspirations, and dreams so I can help them harness those inner strengths. My goal is not just to teach them skills, but to help them recognize the impact they can make in the world. In many ways, my identity encourages me to teach with heart, presence, and purpose.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3f3500a4-57a8-4c13-82d6-929d25d600a5\"}":{"__typename":"DeepDives","uuid":"3f3500a4-57a8-4c13-82d6-929d25d600a5","content":"\u003cp\u003eThe advice I would give my middle or high school self is to stop being scared and go after the things you truly want. Time is a gift, and you don’t get any of it back so don’t hold yourself back out of fear or worrying about what others think. Be bold, take up space, and stand your ground. You’re capable of more than you realize, and the sooner you trust that, the sooner your world will open up!!!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a177e1aa-afe6-4a93-ad44-6e1a2ff50c2a\"}":{"__typename":"DeepDives","uuid":"a177e1aa-afe6-4a93-ad44-6e1a2ff50c2a","content":"\u003cp\u003eI chose Applied Economics and Management because I wanted a major that sits at the intersection of social impact and entrepreneurship. I’ve always cared about building solutions that empower communities, but I also wanted the flexibility to think creatively, launch ideas, and learn how organizations create meaningful change. Dyson’s curriculum, faculty, and student organizations make it the perfect environment to explore both, allowing me to develop a strong analytical foundation while staying grounded in purpose-driven, innovative work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"83cb755e-42a6-42d1-8713-59ba51ef6f03\"}":{"__typename":"DeepDives","uuid":"83cb755e-42a6-42d1-8713-59ba51ef6f03","content":"\u003chr\u003e\u003cp\u003eOne of my lifelong dreams is to visit all seven wonders of the world and, someday, to be invited to the Met Gala.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"83bb547b-5a08-4fac-9f4c-5036dca6cc36\"}":{"__typename":"School","uuid":"83bb547b-5a08-4fac-9f4c-5036dca6cc36","name":"NEST+m","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10002"},"Education:{\"uuid\":\"843cc9e3-f0c7-4790-9d88-4ef6789b7087\"}":{"__typename":"Education","uuid":"843cc9e3-f0c7-4790-9d88-4ef6789b7087","school":{"__ref":"School:{\"uuid\":\"83bb547b-5a08-4fac-9f4c-5036dca6cc36\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"6f0dfcc4-bc91-4e53-913d-9c335034f7aa\"}":{"__typename":"Education","uuid":"6f0dfcc4-bc91-4e53-913d-9c335034f7aa","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Applied Economics and Management","degree":null},"MentorPublicProfile:{\"uuid\":\"3672b2a2-7b95-498e-bdff-1102d7bb5681\"}":{"__typename":"MentorPublicProfile","uuid":"3672b2a2-7b95-498e-bdff-1102d7bb5681","displayName":"Tricia D.","slug":"tricia-derecho","biography":"\u003cp\u003eHeyy everyone!! I'm currently a junior at Cornell University’s Dyson School, studying Applied Economics and Management with concentrations in Strategy and Marketing. I spent high school and college trying to expand educational access, uplifting underrepresented communities, and creating people-centered solutions that blend strategy, creativity, and cultural representation. This is grounded in the belief that storytelling and intentional design can make systems more inclusive and empowering.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I also love exploring digital business strategy, consumer psychology, and organizational behavior whether it be making AI powered fashion design startups or deadstock waste marketplaces. I am also really fascinated by how brands shape identity, how communities form around shared cultural experiences, and how organizations can be designed to prioritize people over profit. This type of coursework helps me connect culture, markets, and technology, always through a lens of representation and impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus, I serve as Secretary of the Cornell Fashion Collective, supporting designer communications, organizational operations, and one of Cornell’s largest annual showcases of student creativity. This role has strengthened my skills in project coordination, cross-team communication, and event planning. I also work in Cornell’s Asian American Studies Department, where I help execute programming, cultural events, and outreach efforts that highlight Asian and Asian American histories, identities, and visibility. Additionally, I still remain an active member of the Cornell Filipino Student Association, where I have choreographed cultural performances and helped cultivate community spaces grounded in connection and belonging.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond campus, I am involved with PERIOD and Asian American Dream, supporting menstrual equity and youth activism as well providing professional connections to marginalized groups. Professionally, I am also a brand strategist at Crossroads, a student-led merch startup collaborating with artisans worldwide and have worked with other startups centered around fashion, e-commerce, and tech.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside my academic and professional work, I absolutely love thrifting and sustainable fashion as I see clothing as both personal storytelling and a form of circularity. I am also an avid concert-goer, having seen Blackpink, Tyler, the Creator, NIKI, and more. And on most days, you can find me recharging with a matcha in hand.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn Summer 2026, I will join Google as an Associate Product Marketing Management intern on the YouTube Platforms \u0026amp; Devices team.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUltimately, I hope to build a career at the intersection of strategy, media, and culture, uplifting communities and amplifying stories that deserve to be heard.\u003c/p\u003e","teachingVideoPlaybackId":"XjKB027spWXg54kS8uyO1E6BDqpJ5xW2BDpyIoaaVFKQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Economics and Management","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e49bbc58-3dd8-42ad-8da0-10f8e38ff364\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f3500a4-57a8-4c13-82d6-929d25d600a5\"}"},{"__ref":"DeepDives:{\"uuid\":\"a177e1aa-afe6-4a93-ad44-6e1a2ff50c2a\"}"},{"__ref":"DeepDives:{\"uuid\":\"83cb755e-42a6-42d1-8713-59ba51ef6f03\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2ec38b4e-9452-4f44-ab59-e8510a37d349/-/preview/-/format/jpg/","https://ucarecdn.com/b90b51d9-73aa-44f2-8fb4-17a04ed234e8/-/preview/-/format/jpg/","https://ucarecdn.com/34aad53d-f0ae-4fdd-b92b-e682c1484359/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"843cc9e3-f0c7-4790-9d88-4ef6789b7087\"}"},{"__ref":"Education:{\"uuid\":\"6f0dfcc4-bc91-4e53-913d-9c335034f7aa\"}"}],"hiredAt":"2025-12-09T01:01:12.556Z","topics":["Writing","College Essay Writing","Executive Function","Academic Coaching","Reading","Economics","Fashion / Cosmetics","Video / Photography","Visual Arts / Graphic Design","Business / Entrepreneurship","Public Speaking"],"communityBadges":
