xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"afc5a1de-c8cf-46ab-86b3-3b887ac26c72\"}":{"__typename":"DeepDives","uuid":"afc5a1de-c8cf-46ab-86b3-3b887ac26c72","content":"\u003cp\u003eWhen I'm not tutoring or mentoring, I love playing board games with friends. Once a week, we gather to play fun games like Settlers of Catan or Exploding Kittens!\u003cbr\u003e\u003cbr\u003eI also love biking and exploring nature with my friends and watching YouTube under a comfy blanket at home.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"d14a7cd9-2408-4aa1-89f6-4bee2c374986\"}":{"__typename":"DeepDives","uuid":"d14a7cd9-2408-4aa1-89f6-4bee2c374986","content":"\u003cp\u003eWhen I was in high school, I created a fundraiser to help raise money to rebuild houses after the triple hurricanes that hit the US in 2017 (Harvey in TX, Irma in the Southeastern US, and Maria in the Caribbean). I took junior and senior portraits in exchange for donations to Direct Relief, a relief organization that helps rebuild after natural disasters.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"1706a00a-90c5-4262-a221-9b0d7b62ee41\"}":{"__typename":"DeepDives","uuid":"1706a00a-90c5-4262-a221-9b0d7b62ee41","content":"\u003cp\u003eWhen I was in high school, I didn't do too much during the summers, preferring to use them to relax with friends and make a little bit of income to save for college. I first worked at a local ice cream shop for a summer, then was a server for the next. I always made time for my friends so we could hang out at our local lake, and I played too many video games at home to escape the Texas heat. I also went to orchestra camp for a week every summer, meeting new orchestra friends from around the Dallas area and learning more about my craft of playing violin!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ebac65d8-b320-49f1-952f-2edbf5952451\"}":{"__typename":"DeepDives","uuid":"ebac65d8-b320-49f1-952f-2edbf5952451","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to have traveled to many different countries and experienced many different cultures. How many, you ask? I'm not sure. As a history major, I enjoy learning the history of our world and the people who inhabit it, so the continued exploration in my lifetime may never end! So far, I've been to more than 12 countries, and I am hoping to explore more soon.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"d767bf15-04c0-47d5-9bd9-eea897534da8\"}":{"__typename":"School","uuid":"d767bf15-04c0-47d5-9bd9-eea897534da8","name":"Arlington High School","city":"A
