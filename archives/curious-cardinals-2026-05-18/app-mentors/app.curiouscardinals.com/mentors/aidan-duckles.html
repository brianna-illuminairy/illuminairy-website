xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"135f4a1b-2086-401a-8307-20a2de413259\"}":{"__typename":"Favorites","uuid":"135f4a1b-2086-401a-8307-20a2de413259","photoUrl":"https://ucarecdn.com/dce722cd-c74d-4446-921e-633bc4036132/","title":"Eric Clapton Unplugged","type":"ALBUM"},"Favorites:{\"uuid\":\"ef406a99-f651-4a3c-9843-fec1b66117f1\"}":{"__typename":"Favorites","uuid":"ef406a99-f651-4a3c-9843-fec1b66117f1","photoUrl":"https://ucarecdn.com/3837e5aa-fe2f-43aa-aa29-d19b6aede1cc/","title":"FC Barcelona","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"0581bb38-0861-4937-bd80-900569d29d3e\"}":{"__typename":"Favorites","uuid":"0581bb38-0861-4937-bd80-900569d29d3e","photoUrl":"https://ucarecdn.com/10f9f03a-8156-4996-8008-273ab0814f22/","title":"School of Rock","type":"MOVIE"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e285f121-6306-45d1-af42-cf24b8684f2f\"}":{"__typename":"DeepDives","uuid":"e285f121-6306-45d1-af42-cf24b8684f2f","content":"\u003cp\u003eI want to make the most out of my education and buy a house with a pool.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b8163af2-1b4a-45db-82d2-425c7bdb05a0\"}":{"__typename":"DeepDives","uuid":"b8163af2-1b4a-45db-82d2-425c7bdb05a0","content":"\u003cp\u003eI want to learn everything I can about the human body, and Human Biology is the best department for that. It keeps me well rounded as a student, and prepares me for endless careers and lifestyles.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"cf706f59-1212-41f7-aabf-503a361ac6dc\"}":{"__typename":"DeepDives","uuid":"cf706f59-1212-41f7-aabf-503a361ac6dc","content":"\u003cp\u003eI know what it's like to be a confused kid with a hopeless amount of questions, big or small, so I want to give back and let others stand on my shoulders. I would not be where I am without the help of my high school cross country coach, now colleague, so I know the life altering impact a good mentor can have.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"09bb83ea-0b8d-4913-b47a-6b53389808c2\"}":{"__typename":"DeepDives","uuid":"09bb83ea-0b8d-4913-b47a-6b53389808c2","content":"\u003cp\u003eI play the harp, and was ranked #1 in California my junior year of high school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"9e7fc706-8b12-4eaa-a204-abec9e92d2ba\"}":{"__typename":"School","uuid":"9e7fc706-8b12-4eaa-a204-abec9e92d2ba","name":"Long Beach Polytechnic High School","city":"Long Beach","type":"HIGH","state":"California","country":"United States","zip":"90813"},"Education:{\"uuid\":\"a4b26ee5-20fd-4ac6-b639-7cdc9b4754d4\"}":{"__typename":"Education","uuid":"a4b26ee5-20fd-4ac6-b639-7cdc9b4754d4","school":{"__ref":"School:{\"uuid\":\"9e7fc706-8b12-4eaa-a204-abec9e92d2ba\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"f38b3280-2633-4240-9bb1-19d7d1efbc39\"}":{"__typename":"Education","uuid":"f38b3280-2633-4240-9bb1-19d7d1efbc39","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"43eac02d-acd9-4a32-b539-6e72057952c1\"}":{"__typename":"MentorPublicProfile","uuid":"43eac02d-acd9-4a32-b539-6e72057952c1","displayName":"Aidan D.","slug":"aidan-duckles","biography":"\u003cp\u003eHi! I'm Aidan and I grew up in Long Beach, California. I went to Long Beach Poly High School, where I ran cross country, became the 1st chair harpist in the state, and worked as a professional race timer for track meets. I'm currently studying Human Biology at Stanford University on a Pre-Med track, and assistant coaching Loyola High School (LA) cross country over the summer.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time I like to play sports video games, watch tv shows, listen to music, read comics, hang out with friends, swim, run, go to the gym, and nap. I like pretty much everything, so it’s easy and fun to teach or create a passion project about anything. In addition, I’ve been an avid soccer (Barcelona) fan since I was born, but also a sports nerd in Basketball, Baseball, Tennis, and Athletics (particularly track).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI remember being a confused kid and it was my mentors who guided me to the solution and trained me to stand on my own feet. I’ve become proactive and relatable after being a mentee for so long (I still am), able to answer and get ahead of questions students can’t articulate or even think of.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy former high school cross country coach is my greatest mentor, taking me from a kid who used to hide at practice, to his colleague, training and impacting the lives of other runners. I enjoy giving back; also, it’s just fun to see students develop and succeed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy studies at Stanford are an outgrowth of my passions for athletics and training; I'm a Human Biology major, but would try learning everything in the world if I had the time. My dream job is to work in the sports science industry or as an athletic coach; I like the idea of physical therapy, but I could also see myself as a medical doctor or doing a Stem Cell or Developmental Bio PhD.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs an academic mentor, I’m particularly strong at teaching Chemistry, along with K-12 STEM. I focus on demystifying terminology while providing mentees with a fundamental understanding of the topic, one they can be proud and secure of.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I will simplify learning to the point where mentees can feel fluent and explain it back to me like an expert would. I will make learning stress-free, fun, and relieving, in order to help as much as I can, and as efficiently as possible. I hope to become the first person mentees think of when they need help with anything, and to lower the barrier to any academic topic, hobby, etc. My favorite teaching moment is eliminating a students' confusion and watching their reaction when they finally figure it out.\u003c/p\u003e","teachingVideoPlaybackId":"WxkYl017f2UejAwY8qfdIq3vH9FkvFGlWpbCKYMcdmhE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003e\u003cstrong\u003eGetting into Stanford\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIt was a massive relief getting in early, validating my life's hard work while giving me a stress free senior year. I felt proud of myself knowing I'd get to continue pursuing my passions at the highest level, and the school has surpassed my greatest expectations.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"135f4a1b-2086-401a-8307-20a2de413259\"}"},{"__ref":"Favorites:{\"uuid\":\"ef406a99-f651-4a3c-9843-fec1b66117f1\"}"},{"__ref":"Favorites:{\"uuid\":\"0581bb38-0861-4937-bd80-900569d29d3e\"}"}],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e285f121-6306-45d1-af42-cf24b8684f2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"b8163af2-1b4a-45db-82d2-425c7bdb05a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"cf706f59-1212-41f7-aabf-503a361ac6dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"09bb83ea-0b8d-4913-b47a-6b53389808c2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9c70251f-084d-4e76-b5cc-8aac67cb6602/-/preview/-/format/jpg/","https://ucarecdn.com/ca106288-b9d2-47af-b416-b01cbfefc7ce/-/preview/-/format/jpg/","https://ucarecdn.com/f995ce1a-5504-4a64-aa02-ef11147936fa/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a4b26ee5-20fd-4ac6-b639-7cdc9b4754d4\"}"},{"__ref":"Education:{\"uuid\":\"f38b3280-2633-4240-9bb1-19d7d1efbc39\"}"}],"hiredAt":"2025-06-25T15:58:12.417Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Chemistry","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Music","History Project","Sports Journalism","Sports Analytics","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/6fbd7257-e9de-4421-8a0b-bde4a854891b/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfi
