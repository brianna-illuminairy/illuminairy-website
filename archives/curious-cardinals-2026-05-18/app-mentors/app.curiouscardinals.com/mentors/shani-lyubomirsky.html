__typename":"DeepDives","uuid":"83276a1e-092f-4309-8ef3-80a62359acb6","content":"\u003cp\u003eI have a side hustle where I bring communities together through murder mystery parties~ Community building is a joy and honor I get to do for work and for fun : )\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3a246330-09b4-4233-98f6-b456c28ee67d\"}":{"__typename":"DeepDives","uuid":"3a246330-09b4-4233-98f6-b456c28ee67d","content":"\u003cp\u003eAs a high schooler, I built a music tutoring organization and looped in my friends from our band program. It was an incredible learning and teaching experience!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6b4e8e7d-b976-4e0b-a706-073ded1875f5\"}":{"__typename":"DeepDives","uuid":"6b4e8e7d-b976-4e0b-a706-073ded1875f5","content":"\u003cp\u003eI take several walks every day, I like to read from time to time, and nothing brings me more joy than yapping with a friend. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"73496897-4425-4686-a703-9afdb54335fc\"}":{"__typename":"School","uuid":"73496897-4425-4686-a703-9afdb54335fc","name":"Foothill High School","city":"Pleasanton","type":"HIGH","state":"California","country":"United States","zip":"94588"},"Education:{\"uuid\":\"10324f9c-689f-4fbc-9592-40fdaa42d5c8\"}":{"__typename":"Education","uuid":"10324f9c-689f-4fbc-9592-40fdaa42d5c8","school":{"__ref":"School:{\"uuid\":\"73496897-4425-4686-a703-9afdb54335fc\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"7fdb8e05-c549-4fa9-8ee7-fde33e3d565e\"}":{"__typename":"Education","uuid":"7fdb8e05-c549-4fa9-8ee7-fde33e3d565e","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2937a76d-4d3b-4d43-9d97-d031427141be\"}":{"__typename":"MentorPublicProfile","uuid":"2937a76d-4d3b-4d43-9d97-d031427141be","displayName":"Shani L.","slug":"shani-lyubomirsky","biography":"\u003cp\u003eHi! I'm Shani. I'm meeting you now as a research professional and a business owner, but I didn't start there! \u003cbr\u003e\u003cbr\u003eAs a child, I dreamed of one day becoming a professional flute player and composer. I worked towards this dream until right before college apps season, when I decided to pursue a traditional degree. I was told that a traditional path provides the most stability, and as such, I went for the most popular program of the time - Data Science. \u003cbr\u003e\u003cbr\u003eI graduated from UC Berkeley in 2023 with a Data Science degree. However, I quickly learned that the supposedly stable path was not as stable as I had hoped. I was laid off a month into my first job post graduation. \u003cbr\u003e\u003cbr\u003eAfter some soul searching, I made the challenging decision to scrap my degree and start over. I thought about my lifestyle, my interests, my strengths, and the future I wanted to build. I transitioned into the healthcare space, and now work my dream job in oncology clinical trials! \u003cbr\u003e\u003cbr\u003eIn 2025, I started my own business - The Perfect Crime - in which I curate custom murder mystery parties for orgs, companies, and private clients. This past year, I launched its sister business - The Crime of Passion - which provides Murder Mystery parties to the community as public mixers. \u003cbr\u003e\u003cbr\u003eI had a long journey to find the type of work and lifestyle that is best suited for my talents and interests. I often made decisions based on what was statistically the \"safest\" decision. However, this is where modern education has lost the plot. Each person is so uniquely equipped that the statistics are looking at career building from the wrong direction. I believe that people should build themselves towards their best future given their own individualized interests and talents. When a person is excited and driven to accomplish a goal, they will be far more successful than someone who is unenthusiastic about their path. \u003cbr\u003e\u003cbr\u003eMentorship is an incredibly valuable resource to help bypass some common problems that many - dare I say, most - young adults encounter while building their life. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe that everyone has unique strengths that have the power to launch them into their dream future. I'm excited to work together to make dreams into a reality!\u003c/p\u003e","teachingVideoPlaybackId":"lZkt01zUcUg9KBano8tiKIW9DgzG701f02GgadaHI7E00og","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWon an international flute solo competition at 17!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"21728a05-869b-4dd9-a830-72069d514bcb\"}"},{"__ref":"Favorites:{\"uuid\":\"91e8d757-480b-4e3a-a845-443ede7d4b81\"}"},{"__ref":"Favorites:{\"uuid\":\"8507fe11-3e24-4cab-b60f-09d8c9071cf7\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"e17d0f19-a317-4d20-a36b-af0bcd4e129f\"}"}],"majo
