xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b2160278-f5ab-4696-bfee-b4df054bf75d\"}":{"__typename":"DeepDives","uuid":"b2160278-f5ab-4696-bfee-b4df054bf75d","content":"\u003cp\u003eIn my wildest dreams, I would love to be a travel writer! It would be absolutely phenomenal to explore new places and document my impressions. National Geographic, let me know if you're hiring ;)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f0ac33c1-27da-4fdf-9a92-f56152c672f5\"}":{"__typename":"DeepDives","uuid":"f0ac33c1-27da-4fdf-9a92-f56152c672f5","content":"\u003cp\u003eThroughout my life, I've had incredible mentors. Many of them may not even realize that they were a source of inspiration for me! I would honored to play that role in another person's life, especially a young person facing some of the same challenges, doubts and insecurities that I've faced.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"927a31bb-7ac5-4d54-942b-2449c676cf62\"}":{"__typename":"DeepDives","uuid":"927a31bb-7ac5-4d54-942b-2449c676cf62","content":"\u003cp\u003eRecently, I've been learning traditional Latin dances! One of my close friends is in a Latin dance group at Yale. I've attended their dance workshops, where I've learned salsa, bachata and merengue. It's always so much fun!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}":{"__typename":"School","uuid":"e5a76254-778b-4843-9fe4-18689765e318","name":"Sidwell Friends School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20016"},"Education:{\"uuid\":\"0eeff3a8-e882-4d98-94bb-b1384e229bff\"}":{"__typename":"Education","uuid":"0eeff3a8-e882-4d98-94bb-b1384e229bff","school":{"__ref":"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}"},"startYear":"2012","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"54faa40b-75ba-4382-a257-baf16f4bba6d\"}":{"__typename":"Education","uuid":"54faa40b-75ba-4382-a257-baf16f4bba6d","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Ethics, Politics \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"3444f78b-66de-4845-ac46-2510944d6f63\"}":{"__typename":"MentorPublicProfile","uuid":"3444f78b-66de-4845-ac46-2510944d6f63","displayName":"Alexandra M.","slug":"alexandra-mcguire","biography":"\u003cp\u003eHi! My name is Alexandra, but most of my friends call me Alex :) I’m a senior at Yale University studying Ethics, Politics \u0026amp; Economics with a concentration in the Middle East. I’m also working towards an Advanced Language Certificate in Spanish. In both academic areas, I focus on citizenship policy, immigration patterns and refugee flows.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eOutside of class, I volunteer with Immigrant and Refugee Integration Services (IRIS) of Connecticut. I’ve been volunteering with IRIS for three years. I first began volunteering with their at-home tutoring program where I worked with both children and their parents. After COVID, I began working for their after-school program. The program provides reading support, math exercises and unstructured play for young students in New Haven public schools. As volunteers, we also provide opportunities for socio-emotional learning to support students in their transition to life in the United States.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn my first few years at Yale, I was on the Investment and Executive Boards of Smart Woman Securities (SWS). SWS is an extracurricular club that exposes young women to finance and consulting, two predominantly male-dominated fields. With SWS’s mentorship and training, I interned with a management consulting firm last summer. There, I was exposed to fascinating data analysis and impressive strategic thought. I’m interested in facilitating similar opportunities for other girls interested in finance and consulting!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAway from Yale, I’ve been fortunate to spend time traveling and working overseas. During my COVID-induced gap year, I worked at a legal clinic in Mexico City serving migrant women and their families. Our work was absolutely transformative and a fascinating application of the academic theories I’d studied in the classroom. Not to mention, it was an incredible chance to explore a new city!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe following summer, I interned at an NGO in Amman, Jordan. While there, I led entrepreneurship workshops – in customer experience management and human resource management – for Jordanian youth enrolled in a business development program. I had complete creative control over the lesson plan and activities. I loved bringing some of my business experience to a group of my peers in a classroom on the other side of the world!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThat’s a little bit about me! I can’t wait to learn about you :)\u003c/p\u003e","teachingVideoPlaybackId":"yy3PD101hDSjapIHPGbrCjPSE01nilaGkMUIuuSlT5iwQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Ethics, Politics \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b2160278-f5ab-4696-bfee-b4df054bf75d\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0ac33c1-27da-4fdf-9a92-f56152c672f5\"}"},{"__ref":"DeepDives:{\"uuid\":\"927a31bb-7ac5-4d54-942b-2449c676cf62\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2288f956-4dbe-46ae-860b-3c377940bef7/-/preview/-/format/jpg/","https://ucarecdn.com/425a7d47-b317-4316-b3f1-544ca7e63afb/-/preview/-/format/jpg/","https://ucarecdn.com/b60b9b77-5886-4eac-8ca7-be4014b26dcf/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0eeff3a8-e882-4d98-94bb-b1384e229bff\"}"},{"__ref":"Education:{\"uuid\":\"54faa40b-75ba-4382-a257-baf16f4bba6d\"}"}],"hiredAt":"2023-12-20T01:19:45.024Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Chemistry","Writing","Spanish","History","Reading"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexandra-mcguire\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3444f78b-66de-4845-ac46-2510944d6f63\"}"}}},"_sentryTraceData":"1af807569c3a49b9abb0c1b77
