xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a709698e-2e62-4b03-97d1-bb8bb963e3ee\"}":{"__typename":"DeepDives","uuid":"a709698e-2e62-4b03-97d1-bb8bb963e3ee","content":"\u003cp\u003eDon't be afraid to be yourself- playing clarinet is cool (:\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"181d9c5a-6e4a-4455-88e3-52af16efcb65\"}":{"__typename":"DeepDives","uuid":"181d9c5a-6e4a-4455-88e3-52af16efcb65","content":"\u003cp\u003eI love to cook! Spending time in the kitchen with friends and creating something to share and enjoy brings me an immense amount of joy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"bcb1859a-dca4-47bd-854a-9238d3983944\"}":{"__typename":"DeepDives","uuid":"bcb1859a-dca4-47bd-854a-9238d3983944","content":"\u003cp\u003eI'm currently working on an honors thesis in Comparative Studies in Race and Ethnicity. This project truly is a culmination of everything that I'm passionate about, and I'm so inspired to be working towards something that uplifts Black women in music like myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"361df2fa-0dcc-4b6e-8bf7-186f33e3a95a\"}":{"__typename":"DeepDives","uuid":"361df2fa-0dcc-4b6e-8bf7-186f33e3a95a","content":"\u003cp\u003eEvery time I teach something new for the first time I learn so much more deeply what I'm attempting to communicate. Mentoring is an opportunity for me to educate others and myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"377d7653-f87b-4f5e-bd37-781b2d1c44cd\"}":{"__typename":"School","uuid":"377d7653-f87b-4f5e-bd37-781b2d1c44cd","name":"Berkeley High School","city":"Berkeley","type":"HIGH","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"3a50b9f5-c07a-4f9a-a213-0c4f1e59f25d\"}":{"__typename":"Education","uuid":"3a50b9f5-c07a-4f9a-a213-0c4f1e59f25d","school":{"__ref":"School:{\"uuid\":\"377d7653-f87b-4f5e-bd37-781b2d1c44cd\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"5b5efa58-aba8-4af8-9bf0-c2721bad00ba\"}":{"__typename":"Education","uuid":"5b5efa58-aba8-4af8-9bf0-c2721bad00ba","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Comparative Studies in Race and Ethnicity","degree":null},"MentorPublicProfile:{\"uuid\":\"6a95313f-fc34-4aa5-9b03-70d471d1d2a5\"}":{"__typename":"MentorPublicProfile","uuid":"6a95313f-fc34-4aa5-9b03-70d471d1d2a5","displayName":"Rabiah K.","slug":"rabiah-kabir","biography":"\u003cp\u003eHi! My name is Rabiah Kabir and I’m a passionate artist and humanitarian. I’m from Berkeley California, a city filled with culture and alternative expression. As an East Bay native, my parents raised me at the protests we marched through, thus instilling a moral compass grounded in the desire to support the community that surrounded me with the resources I had access to.\u0026nbsp;\u003c/p\u003e\u003cp\u003eMajoring in Comparative Studies in Race and Ethnicity (CSRE) at Stanford felt like a natural next step to my progressive education. I’ve always leaned towards the humanities, delving into a love of writing and music. As a senior in the CSRE department I’ve been able to culminate my interests in a creative thesis that combines jazz composition, feminist discourse and Black studies. This project truly is a passion project for me, and I’m excited to guide students through projects that are meaningful to them.\u003c/p\u003e\u003cp\u003eFor me, teaching is an experience that is incredibly rewarding for both parties. I have worked as a private music teacher for six years, and watching my students blossom into fantastic musicians in their own right has been so exciting. In high school, I worked summer jobs with ESL programs that gave extra support to students in need, which helped me practice my Spanish and teaching strategies. These experiences have all influenced my practice as an educator today.\u003c/p\u003e\u003cp\u003eI love to laugh, to play music, to cook, to dance, to party- I want to inspire creativity and fun when it comes to my mentees. Education is a vehicle to a life fuller lived. I hope that my excitement resonates!\u003c/p\u003e","teachingVideoPlaybackId":"aHnImIzYci02TB8qPWhyWc3Yn4VhA41pKfthXcSqoeCM","teachingVide
