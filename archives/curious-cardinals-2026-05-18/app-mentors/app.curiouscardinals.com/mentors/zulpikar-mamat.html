xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c73939b6-b4dd-46e7-a8f5-54a438eb459b\"}":{"__typename":"DeepDives","uuid":"c73939b6-b4dd-46e7-a8f5-54a438eb459b","content":"\u003cp\u003eI've currently been working on publishing a book that I wrote in high school. It's a historical fiction novel based on the Chinese concentration camps situated in the Xinjiang province. I was really into human rights activism in middle school and that carried on into high school where I started research on this topic during the pandemic. I conducted many interviews with survivors from the camps and read through dozens of auto-biographies, historical precedent, and research in order to get a solid understanding of the issue. Then after simulating a method-acting like experience on myself with the conditions of the camps, I wrote the piece over a course of two years. After being accepted by a publishing company, it is on its last steps to getting published. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"ff5b37f4-a6e1-4f03-a283-dbbae7659188\"}":{"__typename":"DeepDives","uuid":"ff5b37f4-a6e1-4f03-a283-dbbae7659188","content":"\u003cp\u003eI was very curious, about the classes I was taking, about the people I called my friends, and the world around me. I didn't exactly have a specific avenue I wanted to explore yet but I was very well aware of my own strengths and weaknesses. Having this knowledge, I tried to push my strengths to its limits by continuously testing my skills in Debate, Writing, and Speech Competitions across the world. By being fully aware of my weaknesses in the STEM field, I utilized my school's resources in the robotics, and the Science Olympiads to have a solid grasp on the fundamentals and learn valuable insights into the field from my classmates who were season competitors. Through constantly testing my strengths and reducing my weaknesses, I was able to excel and learn new things simultaneously, satisfying my thirst for knowledge.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d00df41f-248d-446b-b613-343f153545bc\"}":{"__typename":"DeepDives","uuid":"d00df41f-248d-446b-b613-343f153545bc","content":"\u003cp\u003eThe number one advice I would give my middle school self is to always focus on the fundamentals. Learning is much like building a house. Without the ground structure and base being built properly, the walls and roofs will never be materialized. In high school, I would advise myself to go very deep into any passion project. It is critical at this point to dive into an interest as far as possible since it will not only open up different avenues for further exploration but also for the first time in your life so far, allow you to become an expert in that specific field/topic.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"49abbe58-af78-4ff1-903f-0ac59845f996\"}":{"__typename":"DeepDives","uuid":"49abbe58-af78-4ff1-903f-0ac59845f996","content":"\u003cp\u003eThough I have many grand dreams and ambitions, I would really like to open up a new school institution either a university or K-12.  I believe that it is essential for children across the world especially those from underdeveloped communities, suffering from trauma, and seeking asylum/refugee status get the proper education in order to survive and succeed in this ever-developing world. The natural human cycle of knowledge is an exchange between the knowledgeable and curious and therefore by keeping this knowledge free from strictly the hands of the privileged and blessed would allow a more prosperous, open-viewed, and rich perspective on key issues and problems across the globe.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"709b572e-5c9c-4fb2-9f2f-d23ea8c707f7\"}":{"__typename":"School","uuid":"709b572e-5c9c-4fb2-9f2f-d23ea8c707f7","name":"Poolesville High School","city":"Poolesville","type":"HIGH","state":"Maryland","country":"United States","zip":"20837"},"Education:{\"uuid\":\"be666d11-eb21-4b2b-82b2-528d64609eed\"}":{"__typename":"Education","uuid":"be666d11-eb21-4b2b-82b2-528d64609eed","school":{"__ref":"School:{\"uuid\":\"709b572e-5c9c-4fb2-9f2f-d23ea8c707f7\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"6bae6616-c4e1-4655-b361-fa3725e6fce9\"}":{"__typename":"Education","uuid":"6bae6616-c4e1-4655-b361-fa3725e6fce9","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Polysci/International Relaitions/Econ","degree":null},"MentorPublicProfile:{\"uuid\":\"7c004e65-7d7d-4dda-84dd-de018edd5586\"}":{"__typename":"MentorPublicProfile","uuid":"7c004e65-7d7d-4dda-84dd-de018edd5586","displayName":"Zafar M.","slug":"zulpikar-mamat","biography":"\u003cp\u003eHey! I'm Zafar, a storyteller, advocate, and lifelong learner driven by a passion for human rights and creative expression. I’ve dedicated myself to using my voice and skills to uplift those who need it most.\u003c/p\u003e\u003cp\u003eHaving been blessed with opportunities to lead debate organizations, I’ve developed a love for not only competing but teaching younger students how to stand tall, argue fearlessly, and turn losses into lessons. I’ve found debate to be a powerful tool for change—it’s not just about winning arguments, but about making sure the important stories are told.\u003c/p\u003e\u003cp\u003eSpeaking of stories, writing is where my heart truly beats. I’ve poured my soul into my novel, Death by Strawberry, which delves into the Uyghur human rights crisis. This book, currently in the final stages of publication, reflects my desire to give voice to those who are silenced. I’ve also written Tea with the Devil, a poem confronting the injustices of the U.S. prison system, which I had the honor of presenting to educators and administrators as part of my Minority Scholars Program Internship.\u003c/p\u003e\u003cp\u003eOutside of writing, you’ll often find me on the volleyball court. Besides competing, coaching has been one of the most rewarding experiences. Teaching younger players the game has been a chance for me to give back and build a strong sense of community.\u003c/p\u003e\u003cp\u003eMy volunteer work with the Uyghur Wellness Initiative has been especially close to my heart. Helping Uyghur genocide survivors access mental health services is a way for me to take action, to contribute to healing and support for those who have endured unspeakable trauma.\u003c/p\u003e\u003cp\u003eIn everything I do—whether it’s writing, debating, or competing—I aim to shine a light on issues that matter, while learning and growing every step of the way. \u003c/p\u003e\u003cp\u003eNo matter what your passions, interests, and dreams are, and no matter how difficult they may be to achieve, I can't wait to meet you and help you on your path to success!\u003c/p\u003e","teachingVideoPlaybackId":"9BLsYValaC800hKOutMqFDMd74WBzR2DCcu2ewCNzWd4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Polysci/International Relaitions/Econ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c73939b6-b4dd-46e7-a8f5-54a438eb459b\"}"},{"__ref":"DeepDives:{\"uuid\":\"ff5b37f4-a6e1-4f03-a283-dbbae7659188\"}"},{"__ref":"DeepDives:{\"uuid\":\"d00df41f-248d-446b-b613-343f153545bc\"}"},{"__ref":"DeepDives:{\"uuid\":\"49abbe58-af78-4ff1-903f-0ac59845f996\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c3d09d2a-08ae-4a96-b0ac-230f489adb4f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"be666d11-eb21-4b2b-82b2-528d64609eed\"}"},{"__ref":"Education:{\"uuid\":\"6bae6616-c4e1-4655-b361-fa3725e6fce9\"}"}],"hiredAt":"2024-10-15T00:34:27.222Z","topics":["Coding / Programming","Public Speaking","Journalism","Debate","World Cultures","Computer Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"zulpikar-mamat\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7c004e65-7d7d-4dda-84dd-de018edd5586\"}"}}},"_sentryTraceData":"c6b62ffac53547f7a276108cad158a80-8cf3e39cda75b7c6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=
