xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"f166d9b5-810c-4d44-9f3a-b142ec057b01\"}":{"__typename":"Education","uuid":"f166d9b5-810c-4d44-9f3a-b142ec057b01","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Cognitive Science \u0026 Artificial Intelligence","degree":"BA"},"School:{\"uuid\":\"1a604c64-c709-43cb-be63-61df4067e851\"}":{"__typename":"School","uuid":"1a604c64-c709-43cb-be63-61df4067e851","name":"Seattle Academy","city":"Seattle","type":"HIGH","state":"Washington","country":"United States","zip":"98122"},"Education:{\"uuid\":\"1d782335-c4c1-4321-a505-53f8a695a8d0\"}":{"__typename":"Education","uuid":"1d782335-c4c1-4321-a505-53f8a695a8d0","school":{"__ref":"School:{\"uuid\":\"1a604c64-c709-43cb-be63-61df4067e851\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"0b306caf-e312-416c-aa99-e6ce7792831c\"}":{"__typename":"MentorPublicProfile","uuid":"0b306caf-e312-416c-aa99-e6ce7792831c","displayName":"Mason M.","slug":"mason-mcilwain","biography":"\u003cp\u003eMason is a junior at Dartmouth College pursuing a major in cognitive science with a focus on Artificial Intelligence and a minor in human-centered design. Originally from Seattle, he was exposed to the vast tech ecosystem at a young age, sparking his curiosity and love of design. Mason took multiple honors classes in high school, including history, English, calculus, and biology. Attending an arts and sciences high school, Mason pursued an advanced course of study in Vocal Jazz, competing in regional festivals individually and with his choir, \"The Onions.\" Over the last decade, he has participated in 23 musicals and plays while teaching himself three instruments. Mason also engaged with his school's rhetoric program, competing on the Ethics Bowl and Mock Trial teams at the state level for three years. He founded the entrepreneurship club, was the treasurer of Students Spreading Disability Awareness, and helped run a charity raising money for disabled students in Zambia, Africa. In college, Mason played on the ultimate frisbee team, is part of The Dartmouth Cords, an A cappella group, Casual Thursday, an improv group, and various other communities on campus. Outside of school, he has had multiple internships at different tech companies, primarily working at startups. Mason worked at Smartsheet doing UX Design, at the AI2 Incubator, working on a machine learning-powered personal assistant, and as a market researcher at March Capital and Defy VC. He also worked with the American Conservation Coalition, advocating for free-market climate change solutions and law reform. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eMason especially loves to work with kids who have learning disabilities. Having ADHD and Dyslexia, he knows firsthand the benefit of having a mentor who understands the challenges and unique advantages of a mind that doesn't always experience the world the same way as others. Unfortunately, learning disabilities typically make the simple stuff hard, leading to confusion, frustration, and anger. However, if you can get over that initial hump, the hard stuff amazingly seems simple. From engineering to the stage, Mason now sees his learning disabilities as an incredible gift that has helped him excel. He is excited to work with students to bolster their curiosity and confidence in their abilities.     \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Cognitive Science \u0026 Artificial Intelligence","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/d80a39bc-ecf6-4188-86d4-692fefa2ccd8/-/crop/742x742/0,60/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f166d9b5-810c-4d44-9f3a-b142ec057b01\"}"},{"__ref":"Education:{\"uuid\":\"1d782335-c4c1-4321-a505-53f8a695a8d0\"}"}],"hiredAt":"2022-09-12T22:25:14.000Z","topics":["History","Visual Arts / Graphic Design","Journalism","Literature","Finance / Investing","Public Speaking","Business / Entrepreneurship","Debate","History Project","Writing","Philosophy","Law / Government / Policy","Film / Theater"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mason-mcilwain\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0b306caf-e312-416c-aa99-e6ce7792831c\"}"}}},"_sentryTraceData":"e958485111384e73bf2c5945831edf67-b0314163819be4ec-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e958485111384e73bf2c5945831edf67,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"mason-mcilwain"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googleta
