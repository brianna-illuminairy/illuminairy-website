xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e7ae79c7-af22-4f84-a4d0-442e75de4f29\"}":{"__typename":"Favorites","uuid":"e7ae79c7-af22-4f84-a4d0-442e75de4f29","photoUrl":"https://ucarecdn.com/6ecd0104-dbbc-4e16-80a4-cd0f7c633e04/","title":"Spirited Away","type":"MOVIE"},"Favorites:{\"uuid\":\"d56a0799-77af-4034-bcee-d12c7909e8ec\"}":{"__typename":"Favorites","uuid":"d56a0799-77af-4034-bcee-d12c7909e8ec","photoUrl":"https://ucarecdn.com/0abcf9b1-1a3a-47cf-87ea-c00dd8735d2c/","title":"Name of the Wind by Patrick Rothfuss","type":"BOOK"},"Favorites:{\"uuid\":\"bbaf6403-2a28-4187-aa6c-b71ffe2aa82c\"}":{"__typename":"Favorites","uuid":"bbaf6403-2a28-4187-aa6c-b71ffe2aa82c","photoUrl":"https://ucarecdn.com/6cb1c0c3-4ae4-4007-8af7-2a0c0c659e39/","title":"It Happened Quiet by AURORA","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4f0929f8-9631-49b5-af03-26e40f8d0459\"}":{"__typename":"DeepDives","uuid":"4f0929f8-9631-49b5-af03-26e40f8d0459","content":"\u003cp\u003eBe yourself! I know this is incredibly cliche, but it is such a valuable and difficult mindset to instill, which is why it is repeated so often. The key to happiness and true fulfillment lies in being yourself, trusting yourself, and knowing yourself. By being yourself, you find your people, you uncover your passions, you exude confidence and a sense of security that others will be drawn to. The earlier a person can master this complex ethos, the earlier they can begin living a life they  feel proud, excited, and inspired by. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c09d4f50-a115-440a-8225-b82b74be78d1\"}":{"__typename":"DeepDives","uuid":"c09d4f50-a115-440a-8225-b82b74be78d1","content":"\u003cp\u003eAs an adrenaline junkie, I love anything that can lend itself to an adventure. I spend a lot of time outdoors, hiking and running. The national parks I've been lucky to visit include the Grand Canyon, Acadia, Shenandoah, and Smoky Mountains. I also love to travel and immerse myself in different cultures. I have had the privilege to travel overseas to countries like Singapore, Vietnam, France, the Netherlands, South Korea, Spain, Italy, Thailand, and more! At home, you'll find me reading, journaling, or cuddling with two adorable cats!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"5db592cb-81bb-4b2f-ac38-36dd0c5feda6\"}":{"__typename":"DeepDives","uuid":"5db592cb-81bb-4b2f-ac38-36dd0c5feda6","content":"\u003cp\u003eIn high school, I was extremely involved with both clubs and sports. I was team captain of the fencing team and women's saber squad, and a varsity sprinter and pole vaulter on my track \u0026amp; field team. I was elected class president for three years, and was a part of Peer Leaders and the National Honors Society. Despite my seemingly busy lifestyle, I always made sure to make time for fun, relaxation, and sleep! Maintaining a balance between work and leisure is extremely important to prevent burn out.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"13cda251-713d-4839-a2bb-c8f918076992\"}":{"__typename":"DeepDives","uuid":"13cda251-713d-4839-a2bb-c8f918076992","content":"\u003cp\u003eMy first and forever role model is my mom, of course. She is the definition of self-made--escaping the Vietnam War as a child and arriving in America as a refugee with nothing. She was the only one out of her four siblings to go to college on a full scholarship and eventually earn her doctorates degree at an ivy league institution. Now, she owns a successful practice as both an entrepreneur and dentist. I fell in love with the medical field because of her, seeing first-hand the deep relationships she builds and cultivates with her patients, as well as the pure love she feels for her job. My mom is one of the strongest, most resilient, determined, and selfless people I know, and I hope to be a fraction of the woman she is. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"06aee4aa-ca75-41f4-b102-bc9f6a7a5b51\"}":{"__typename":"School","uuid":"06aee4aa-ca75-41f4-b102-bc9f6a7a5b51","name":"Bernards High School","city":"Bernardsville","type":"HIGH","state":"New Jersey","country":"United States","zip":"07924"},"Education:{\"uuid\":\"4e5b945e-dd5f-44a3-9725-89840eecbe89\"}":{"__typename":"Education","uuid":"4e5b945e-dd5f-44a3-9725-89840eecbe89","school":{"__ref":"School:{\"uuid\":\"06aee4aa-ca75-41f4-b102-bc9f6a7a5b51\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"69c2192c-20bb-4214-9fb5-e2c2f9064be5\"}":{"__typename":"Education","uuid":"69c2192c-20bb-4214-9fb5-e2c2f9064be5","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Health and Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"eb5c0727-c452-4090-9690-a1e2bc51c4ba\"}":{"__typename":"MentorPublicProfile","uuid":"eb5c0727-c452-4090-9690-a1e2bc51c4ba","displayName":"Bridget L.","slug":"bridget-lim","biography":"\u003cp\u003eBridget is a senior at Brown University studying Health and Human Biology on the pre-dental track. She will be matriculating into Columbia University College of Dental Medicine in the Fall of 2026. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eShe has always been very drawn to the maths and sciences, participating in science leagues and competitions throughout high school, and works as both a college biology and physics teaching assistant. Bridget grew up in northern NJ, where she volunteered as certified EMT with her local first aid squad for over three years. There, she found her passion for the medical field in which she had the opportunity to shadow various doctors in both hospital and clinical settings.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of her very STEM-focused academic endeavors, Bridget loves indulging in the arts in her spare time. She has experience with a wide range of mediums from graphite, oil paint, pen and ink, encaustics, hard and soft pastels, and watercolor to stop motion, photography, crocheting, jewelry making, and fashion. Singing is also a significant outlet for Bridget. Throughout her life, she’s sung in select choirs and school choruses, as well as private voice lessons for some years. Currently, she is President of her competitive college a capella group, where they participate in collegiate competitions, go on both domestic and international tours, and record albums on Spotify.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor the past few summers, she has worked as a dental assistant-–which sparked her love for dentistry-–and for over two years now, she has been involved in research in a microbiology lab at Brown. In high school, for over two years she tutored K-12 students in math and english, and for the past few years, she has been a member of an elementary mentorship program. Bridget has extensive experience mentoring students across all ages with varying attention spans and learning capacities. She strives to create a warm and welcoming environment, to inspire and motivate her mentees, and to help them gain a sense of confidence and independence towards pursuing their interests. If you are seeking guidance in math, science, art, or music, or would just like someone to help you explore your passions further, please do not hesitate to reach out! She is so so excited to meet you :)\u003c/p\u003e","teachingVideoPlaybackId":"ghz01UI9aXacB02JbeUKiku50002UWiMKug1QPccKolCGaM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e7ae79c7-af22-4f84-a4d0-442e75de4f29\"}"},{"__ref":"Favorites:{\"uuid\":\"d56a0799-77af-4034-bcee-d12c7909e8ec\"}"},{"__ref":"Favorites:{\"uuid\":\"bbaf6403-2a28-4187-aa6c-b71ffe2aa82c\"}"}],"causesSupported":[],"major":"Health and Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4f0929f8-9631-49b5-af03-26e40f8d0459\"}"},{"__ref":"DeepDives:{\"uuid\":\"c09d4f50-a115-440a-8225-b82b74be78d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"5db592cb-81bb-4b2f-ac38-36dd0c5feda6\"}"},{"__ref":"DeepDives:{\"uuid\":\"13cda251-713d-4839-a2bb-c8f918076992\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/257eeab9-bf07-4cc5-82fe-6e2520568b91/-/preview/-/format/jpg/","https://ucarecdn.com/0a32df9f-643e-4df8-a050-aa2c7c5
