xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6da99dd5-8d63-4714-add0-93c337b9419e\"}":{"__typename":"Favorites","uuid":"6da99dd5-8d63-4714-add0-93c337b9419e","photoUrl":"https://ucarecdn.com/129b4fa3-57f9-4aea-8a52-c2a411d47fa4/","title":"All the light we cannot see","type":"BOOK"},"Favorites:{\"uuid\":\"3dd499d9-d403-4dc5-af0d-beac6c580ed3\"}":{"__typename":"Favorites","uuid":"3dd499d9-d403-4dc5-af0d-beac6c580ed3","photoUrl":"https://ucarecdn.com/7605d102-1229-4394-879c-7029bdea017e/","title":"Castle in the sky","type":"MOVIE"},"Favorites:{\"uuid\":\"f971c955-fc08-462d-8b50-331267964198\"}":{"__typename":"Favorites","uuid":"f971c955-fc08-462d-8b50-331267964198","photoUrl":"https://ucarecdn.com/20242f92-8cc8-4436-90a3-1dc6eeccc180/","title":"Si tu me quieres","type":"SONG"},"CausesSupported:{\"uuid\":\"d6d942d9-25b8-488f-aefa-b4b6e7d226ce\"}":{"__typename":"CausesSupported","uuid":"d6d942d9-25b8-488f-aefa-b4b6e7d226ce","name":"Brain Injury Association","description":"\u003cp\u003eRaising awareness, telling my story and being an advocate\u003c/p\u003e","photoUrl":"https://ucarecdn.com/9974bcda-e5b9-4068-b731-9cc8a9e441fe/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"08f92a53-73d0-430d-8629-677358908117\"}":{"__typename":"DeepDives","uuid":"08f92a53-73d0-430d-8629-677358908117","content":"\u003cp\u003e I grew up in Mexico City before moving to California, and I know firsthand what it’s like to adapt to a completely new world. Navigating a different education system and culture without a roadmap was tough—my family had never gone through it before, so I had to figure things out on my own. But that experience shaped me. It made me passionate about guiding others through uncertainty, helping them find their own spark with the right tools and encouragement.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"5e7ccf03-e21a-456d-a150-302dc339731a\"}":{"__typename":"DeepDives","uuid":"5e7ccf03-e21a-456d-a150-302dc339731a","content":"\u003cp\u003eMy dad is my greatest role model and mentor. He has dedicated his life to making an impact and has instilled in me the importance of perseverance. He always reminds me to look for the “third door”—there is always another way through, and you should never stop searching for it. His relentless pursuit of using his expertise for good has been a constant source of inspiration.\u003c/p\u003e\u003cp\u003eHe has founded more than eight companies and continues to do so with joy, dedication, and gratitude. His pursuit for knowledge is boundless—he reads nine books a week!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9964ead2-778a-4f2d-ad45-d9b154ed6c86\"}":{"__typename":"DeepDives","uuid":"9964ead2-778a-4f2d-ad45-d9b154ed6c86","content":"\u003cp\u003eI would tell myself to stop and reflect—on the little things, the big things—because these moments only come once. Take a step back and appreciate the time you have while you’re young. What happens to you does not define you; what you do afterward is what truly matters. You have control over the kind of person you want to become, the people you surround yourself with, and the impact you leave on the world.\u003c/p\u003e\u003cp\u003eI would also say: keep dreaming big—the only limit is yourself.\u003c/p\u003e\u003cp\u003e\u003cem\u003e\"One moment can change a day, one day can change a life, and one life can change the world.\"\u003c/em\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"f8d98bb0-9141-40fe-bda3-b44df6db4b35\"}":{"__typename":"School","uuid":"f8d98bb0-9141-40fe-bda3-b44df6db4b35","name":"Palo Alto High School","city":"Palo Alto","type":"HIGH","state":"California","country":"United States","zip":"94301"},"Education:{\"uuid\":\"d6d83357-951b-4f29-8d59-7f2a1746d6db\"}":{"__typename":"Education","uuid":"d6d83357-951b-4f29-8d59-7f2a1746d6db","school":{"__ref":"School:{\"uuid\":\"f8d98bb0-9141-40fe-bda3-b44df6db4b35\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"8a6d4606-5489-4c43-8dd5-fd2ccc46dcbd\"}":{"__typename":"Education","uuid":"8a6d4606-5489-4c43-8dd5-fd2ccc46dcbd","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Design and Environmental Analysis","degree":null},"MentorPublicProfile:{\"uuid\":\"49d2ed10-3523-4e13-bd8b-de80ba7b3480\"}":{"__typename":"MentorPublicProfile","uuid":"49d2ed10-3523-4e13-bd8b-de80ba7b3480","displayName":"Anahi C.","slug":"anahi-chapela","biography":"\u003cp\u003eIf there’s one thing I love, it’s a good problem to solve. Whether it’s redesigning a hospital to cut down patient wait times, revitalizing home healthcare, or figuring out how to value-engineer a new construction project at Cornell, I approach every challenge with an evidence-based, sustainable, and community-oriented mindset. My work is all about finding solutions—big and small—that make an impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve tackled everything from designing sensory-friendly gyms for children with autism to creating electric vehicle retail experiences at Rivian (I worked on what is now the SF flagship store that just opened this January!). I’ve worked with Kaiser Permanente to explore home healthcare solutions, helped nonprofits design engaging nature centers for children, reimagined office spaces for Cornell staff, and even worked on improving transportation and security in downtown Ithaca. No matter the scale, I believe everything we build has an impact—it’s up to us to decide what kind of impact that will be. We hold the lever for change, and I take that responsibility seriously.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of design, I’ve always been drawn to activities that push me out of my comfort zone. I’ve ridden horses my whole life, eventually joining the varsity equestrian show jumping team at Cornell. In high school, I couldn’t sit still—I was rowing, sailing, swimming, and playing soccer. Sports taught me the value of discipline, time management, and the mental grit needed to master a craft.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnd when I’m not designing or moving, I’m probably deep into a book or podcast about neuroscience. I’m endlessly fascinated by how the brain works and how environments shape our behavior. That curiosity has led me to some wild experiences—like a month-long National Geographic expedition studying thermal plants and photographing climate change, getting scuba certified in the frigid waters of the West Coast, learning to sail catamarans, and training for a half marathon this spring.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt the end of the day, I love designing spaces, systems, and experiences that make people’s lives better. Whether it’s a hospital, a hotel, or a simple everyday object, my goal is to create thoughtful, adaptable solutions that bring people together and improve their surroundings. And if I can inspire others to take on challenges with the same curiosity and excitement, even better.\u003c/p\u003e","teachingVideoPlaybackId":"Zz2yDb8qlwG9mqLtBhTg1Mkw00ZgRluIzpFQtBRjwm44","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6da99dd5-8d63-4714-add0-93c337b9419e\"}"},{"__ref":"Favorites:{\"uuid\":\"3dd499d9-d403-4dc5-af0d-beac6c580ed3\"}"},{"__ref":"Favorites:{\"uuid\":\"f971c955-fc08-462d-8b50-331267964198\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"d6d942d9-25b8-488f-aefa-b4b6e7d226ce\"}"}],"major":"Design and Environmental Analysis","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"08f92a53-73d0-430d-8629-677358908117\"}"},{"__ref":"DeepDives:{\"uuid\":\"5e7ccf03-e21a-456d-a150-302dc339731a\"}"},{"__ref":"DeepDives:{\"uuid\":\"9964ead2-778a-4f2d-ad45-d9b154ed6c86\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b1386c9c-b138-47fc-98b3-bfdcb08291b5/-/preview/-/format/jpg/","https://ucarecdn.com/e5cd7d9e-4f6c-474b-90ed-fb5aa86abba9/-/preview/-/format/jpg/","https://ucarecdn.com/3a5ac132-7431-4665-8d2f-625f6e754f9f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d6d83357-951b-4f29-8d59-7f2a1746d6db\"}"},{"__ref":"Education:{\"uuid\":\"8a6d4606-5489-4c43-8dd5-fd2ccc46dcbd\"}"}],"hiredAt":"2025-02-13T20:46:34.078Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","6-8 Grade Science","Chemistry","Biology","Writing","Spanish","College Essay Writing","Executive Function","Academic Coaching","Visual Arts / Graphic Design","Video / Photography","K-6 Sto
