xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e886ea38-25a7-431f-8c44-8da09589e0bc\"}":{"__typename":"Favorites","uuid":"e886ea38-25a7-431f-8c44-8da09589e0bc","photoUrl":"https://ucarecdn.com/3404ad93-e63e-4959-98aa-ff1301443700/","title":"The Weeknd","type":"ARTIST"},"Favorites:{\"uuid\":\"9b8c7af2-1d2f-4824-9c0b-3c134e2c3e49\"}":{"__typename":"Favorites","uuid":"9b8c7af2-1d2f-4824-9c0b-3c134e2c3e49","photoUrl":"https://ucarecdn.com/0070669f-5270-4226-9eef-0969ae43e8f5/","title":"Arsenal","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"9043c401-8b92-40fe-a434-f2e7027ca92e\"}":{"__typename":"Favorites","uuid":"9043c401-8b92-40fe-a434-f2e7027ca92e","photoUrl":"https://ucarecdn.com/07f56b88-6d8a-4601-a589-44f75e05d1a6/","title":"Lionel Messi","type":"ATHLETE"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"2e9ca5e4-fbde-46ec-b233-f5ca21907bf0\"}":{"__typename":"DeepDives","uuid":"2e9ca5e4-fbde-46ec-b233-f5ca21907bf0","content":"\u003cp\u003eMy heritage and international background have strongly shaped how I approach teaching and mentorship. Growing up across different cultures and educational systems taught me early on that there isn’t one “right” way to learn and that feeling confused often has more to do with context than ability. I learned to listen first, ask thoughtful questions, and adjust how I explain things so they actually click for the person in front of me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of this, my teaching style is patient, empathetic, and very individualized. I’m especially mindful of students who may feel behind, overlooked, or unsure of themselves academically. I focus on building trust first, then structure — helping students feel safe asking questions, making mistakes, and gradually gaining confidence in how they think and problem-solve. I try to keep sessions encouraging, clear, and collaborative, so learning feels less intimidating and more empowering.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, my background has shown me that education works best when it’s flexible, inclusive, and human. That way of thinking guides every mentoring session I lead, and it’s what allows me to connect with students from many different backgrounds and learning styles.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2b691091-c323-45e8-b0e9-96f80a15b542\"}":{"__typename":"DeepDives","uuid":"2b691091-c323-45e8-b0e9-96f80a15b542","content":"\u003cp\u003eIn high school, I spent most of my summers building things, especially apps and small projects, mostly out of curiosity. I didn’t always have formal programs or structured opportunities, so I taught myself by experimenting, breaking things, and figuring out how to fix them. I’d start with an idea, try to turn it into something real, and learn along the way when it didn’t work the first time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome days that meant coding for hours, other days it meant watching tutorials, reading documentation, or completely rethinking an approach after getting stuck. What I remember most is learning how to stay patient with myself and push through confusion instead of giving up. Those summers actually taught me how to learn independently and how to take a big, vague idea and slowly turn it into something functional.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a4f70a8a-25bd-470e-889a-93e7d331239c\"}":{"__typename":"DeepDives","uuid":"a4f70a8a-25bd-470e-889a-93e7d331239c","content":"\u003cp\u003eI’d remind myself that you don’t have to have everything figured out. Ask questions sooner, make mistakes faster, and trust that consistency beats talent:)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"056e1759-06e7-46e4-9cc6-3f65b5ba9939\"}":{"__typename":"DeepDives","uuid":"056e1759-06e7-46e4-9cc6-3f65b5ba9939","content":"\u003cp\u003eBecause mentorship creates impact that lasts. You can explain a concept once, but mentorship helps someone change how they think, learn, and see themselves. I’ve experienced how having a genuinely supportive mentor completely shifted my confidence, and that’s why being part of someone else’s growth feels far more meaningful to me than anything I could be doing on my own.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"52f7fd16-e42a-4c44-a5cf-f350e8082a47\"}":{"__typename":"School","uuid":"52f7fd16-e42a-4c44-a5cf-f350e8082a47","name":"Gibson youth acadamy (mek branch)","city":"Addis Ababa","type":"HIGH","state":"Addis Ababa","country":"Ethiopia","zip":"100027"},"Education:{\"uuid\":\"3cb694f5-e6da-4b2f-8c16-f6ff8414ca37\"}":{"__typename":"Education","uuid":"3cb694f5-e6da-4b2f-8c16-f6ff8414ca37","school":{"__ref":"School:{\"uuid\":\"52f7fd16-e42a-4c44-a5cf-f350e8082a47\"}"},"startYear":"2007","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"f4fa9e4e-7bef-4c53-9053-74af814443f0\"}":{"__typename":"Education","uuid":"f4fa9e4e-7bef-4c53-9053-74af814443f0","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"136130a1-21ce-41d1-9efc-84b3b2196c2b\"}":{"__typename":"MentorPublicProfile","uuid":"136130a1-21ce-41d1-9efc-84b3b2196c2b","displayName":"Eldad T.","slug":"eldad-tolla","biography":"\u003cp\u003eHi! My name is \u003cstrong\u003eEldad\u003c/strong\u003e, and I’m a Computer Science student at \u003cstrong\u003eColumbia University\u003c/strong\u003e with a strong background in math and analytical thinking. I care deeply about helping students feel confident in how they think, learn, and grow — especially during moments when school starts to feel overwhelming, frustrating, or discouraging. I believe learning should feel challenging but also supportive, empowering, and even enjoyable, and that mindset guides everything I do as a mentor.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eGrowing up with an international background and navigating different cultures and educational expectations shaped the way I approach both learning and teaching. Early on, I learned that there isn’t one “right” way to understand something — and that feeling confused doesn’t mean you’re behind. More often, it means you’re in the middle of learning something meaningful. \u003c/p\u003e\u003cp\u003eAcademically, I study computer science with a strong emphasis on math, logic, and problem-solving. I’ve spent countless hours building projects, experimenting with ideas, and learning through trial and error . These experiences deeply influence my mentoring style today, especially when working with students who need structure and reassurance as they work through challenges.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI specialize in guiding K–12 students through \u003cstrong\u003eAcademic Mentorship and Passion Projects\u003c/strong\u003e, including:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege-readiness projects\u003c/strong\u003e such as research experiences, competitions, portfolios, and presentations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects\u003c/strong\u003e like starting a club or nonprofit, building an engineering prototype, or developing a creative project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch mentorship\u003c/strong\u003e, including learning the research process and presenting findings with confidence\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePortfolio building\u003c/strong\u003e for academic or creative goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSTEM subject guidance\u003c/strong\u003e in math, algebra foundations, computer science, and analytical thinking\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to help\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eMy sessions go beyond traditional tutoring. Instead of just giving answers, I focus on helping students build repeatable strategies, break problems into manageable steps, and reflect on \u003cem\u003ehow\u003c/em\u003e they think. I care just as much about confidence, organization, and study habits as I do about correctness. Sessions with me are interactive, structured, and encouraging — a space where students feel safe asking questions, making mistakes, and gradually becoming more independent learners.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session might involve brainstorming project ideas, building a week-by-week roadmap, breaking down complex concepts into visual steps, or preparing application materials like essays, resumes, or presentations.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eOutside of academics\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOutside of school, I enjoy working out, playing sports, and building things. I’m naturally curious about how people learn best, and I bring that curiosity into every mentoring session. I genuinely enjoy connecting with students, celebrating their progress, and helping them realize they’re far more capable than they think.\u003c/p\u003e\u003cp\u003eIf you’re looking for a mentor who is patient, encouraging, and invested in long-term growth — someone who will challenge you while also supporting you — I’d love to work together.\u003c/p\u003e","teachingVideoPlaybackId":"cclBQXxn1JCeUCx1FUOxUaFlOCeZlDEVqQH1RMIk018g","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e886ea38-25a7-431f-8c44-8da09589e0bc\"}"},{"__ref":"Favorites:{\"uuid\":\"9b8c7af2-1d2f-4824-9c0b-3c134e2c3e49\"}"},{"__ref":"Favorites:{\"uuid\":\"9043c401-8b92-40fe-a434-f2e7027ca92e\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2e9ca5e4-fbde-46ec-b233-f5ca21907bf0\"}"},{"__ref":"DeepDives:{\"uuid\":\"2b691091-c323-45e8-b0e9-96f80a15b542\"}"},{"__ref":"DeepDives:{\"uuid\":\"a4f70a8a-25bd-470e-889a-93e7d331239c\"}"},{"__ref":"DeepDives:{\"uuid\":\"056e1759-06e7-46e4-9cc6-3f65b5ba9939\"}"}],"active":true,"profilePhotos":[
