xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a96e7496-b939-4e4c-9241-83ceed8480c4\"}":{"__typename":"DeepDives","uuid":"a96e7496-b939-4e4c-9241-83ceed8480c4","content":"\u003cp\u003eIn my spare time, I like to stay active through running and weightlifting, and I enjoy setting structured goals for myself—whether that’s training for a race or improving my performance in the gym. I also like exploring ways to optimize how I learn and work, from refining study systems to building small projects or ideas. Outside of that, I enjoy spending time with friends, trying new restaurants, and getting outside whenever I can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ef7ec511-47b6-479f-9932-efcc89ff50f4\"}":{"__typename":"DeepDives","uuid":"ef7ec511-47b6-479f-9932-efcc89ff50f4","content":"\u003cp\u003eI would tell my younger self to focus less on doing everything perfectly and more on building strong systems and habits. At the time, I thought success came from working harder in the moment, but I’ve learned that consistency and structure matter much more over time. I’d also remind myself not to be afraid of challenging paths or changing directions—some of the most valuable growth comes from trying something new and being willing to adjust. Finally, I’d emphasize the importance of asking for help and learning from others earlier, rather than trying to figure everything out alone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9642dda6-64fe-4a10-834d-6cb47548c3b4\"}":{"__typename":"DeepDives","uuid":"9642dda6-64fe-4a10-834d-6cb47548c3b4","content":"\u003cp\u003eI chose my original major in Finance because I was drawn to problem-solving, decision-making, and understanding how systems work at a high level. I liked that it combined analytical thinking with real-world applications, especially in areas like investing and building businesses.\u003c/p\u003e\u003cp\u003eOver time, though, I realized I wanted to apply those same skills in a more direct, human-centered way, which led me to transition into the sciences through Columbia’s Postbaccalaureate Premedical Program. Now, I’m pursuing medicine because it allows me to combine analytical thinking with meaningful impact—using science to solve complex problems while directly helping people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"8b5161ac-c6a4-4c9b-a41f-619071854df3\"}":{"__typename":"DeepDives","uuid":"8b5161ac-c6a4-4c9b-a41f-619071854df3","content":"\u003cp\u003eMy greatest source of motivation is the desire to keep improving and building toward something meaningful. I’m driven by setting clear goals—whether academic, professional, or personal—and then creating a plan to reach them. There’s something really rewarding to me about making steady progress and seeing how small, consistent efforts compound over time.\u003c/p\u003e\u003cp\u003eAt the same time, I’m motivated by impact. I want the work I’m doing to matter, whether that’s helping someone understand a difficult concept, building something useful, or working toward a career where I can make a real difference. That combination of personal growth and meaningful impact is what keeps me focused and motivated.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"9fe36390-ecf2-4193-b72f-dc707dc14323\"}":{"__typename":"School","uuid":"9fe36390-ecf2-4193-b72f-dc707dc14323","name":"Winston Churchill High School","city":"Potomac","type":"HIGH","state":"Maryland","country":"United States","zip":"20854"},"Education:{\"uuid\":\"1fc24a16-8c82-4e7f-9156-e0c7e6902273\"}":{"__typename":"Education","uuid":"1fc24a16-8c82-4e7f-9156-e0c7e6902273","school":{"__ref":"School:{\"uuid\":\"9fe36390-ecf2-4193-b72f-dc707dc14323\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c9b44e42-4328-4891-94b9-d3074236050b\"}":{"__typename":"School","uuid":"c9b44e42-4328-4891-94b9-d3074236050b","name":"University of Notre Dame","city":"Notre Dame","type":"COLLEGE","state":"Indiana","country":"United States","zip":"46556"},"Education:{\"uuid\":\"92a7f013-7e4b-42ac-a1db-a78f0d259e97\"}":{"__typename":"Education","uuid":"92a7f013-7e4b-42ac-a1db-a78f0d259e97","school":{"__ref":"School:{\"uuid\":\"c9b44e42-4328-4891-94b9-d3074236050b\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Finance","degree":null},"MentorPublicProfile:{\"uuid\":\"91f07164-b5cf-4528-a7a6-13f09aa62de6\"}":{"__typename":"MentorPublicProfile","uuid":"91f07164-b5cf-4528-a7a6-13f09aa62de6","displayName":"Nicholas K.","slug":"nicholas-karakunnel","biography":"\u003cp\u003eI’m currently a student in Columbia University’s Postbaccalaureate Premedical Program, where I study chemistry, biology, and physics as I prepare for a future career in medicine. Before transitioning into science, I earned my degree in Finance from the University of Notre Dame. My background in both finance and science has shaped how I approach learning—analytically, strategically, and with a strong focus on building systems that make complex material easier to understand.\u003c/p\u003e\u003cp\u003eWhat I care most about is helping students learn how to think, not just what to memorize. Throughout my own academic journey, I’ve realized that success often comes down to having the right framework. Whether it’s breaking down a difficult chemistry reaction, approaching a physics problem, or preparing for an exam, I focus on teaching students how to organize information, recognize patterns, and apply concepts with confidence. My goal is to make challenging subjects feel structured and approachable rather than overwhelming.\u003c/p\u003e\u003cp\u003eAcademically, I’ve taken rigorous coursework across the sciences while also being involved in research focused on curiosity and decision-making. This experience has shaped how I teach—I aim to spark genuine curiosity in students and help them engage more deeply with what they’re learning. I believe that when students understand why something matters, they naturally become more motivated and confident.\u003c/p\u003e\u003cp\u003eOutside of academics, I’m highly structured and goal-oriented. I spend a lot of time refining study strategies, building efficient schedules, and optimizing how I learn. I also balance school with fitness and endurance training, which has taught me discipline, consistency, and how to stay focused through challenges. These are lessons I bring into my sessions, helping students develop not just academic skills, but habits that support long-term success.\u003c/p\u003e\u003cp\u003eStudents who work with me can expect sessions that are organized, interactive, and tailored to their individual needs. I take the time to understand how each student learns, where they’re getting stuck, and what strategies will work best for them. Rather than a one-size-fits-all approach, I focus on building a personalized system that helps each student improve both their performance and their confidence.\u003c/p\u003e\u003cp\u003eUltimately, my goal is not just to help students achieve better grades, but to give them the tools, structure, and mindset to succeed independently long after our sessions.\u003c/p\u003e","teachingVideoPlaybackId":"k00K3gcVdPQNm1DokIYF00u015sgn6MkUCrjQdPr3HEo8M","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Finance","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a96e7496-b939-4e4c-9241-83ceed8480c4\"}"},{"__ref":"DeepDives:{\"uuid\":\"ef7ec511-47b6-479f-9932-efcc89ff50f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"9642dda6-64fe-4a10-834d-6cb47548c3b4\"}"},{"__ref":"DeepDives:{\"uuid\":\"8b5161ac-c6a4-4c9b-a41f-619071854df3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8be95932-0fc0-4ba2-9ec3-10bbf6eb9e7a/-/preview/-/format/jpg/","https://ucarecdn.com/ea138a1c-3117-4977-bc60-11520ba6e6a4/-/preview/-/format/jpg/","https://ucarecdn.com/4278bae0-a6cd-4e4e-98c8-750ef62a039f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1fc24a16-8c82-4e7f-9156-e0c7e6902273\"}"},{"__ref":"Education:{\"uuid\":\"92a7f013-7e4b-42ac-a1db-a78f0d259e97\"}"}],"hiredAt":"2026-03-13T20:53:08.951Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Physics","Business / Entrepreneurship","Finance / Investing","Medicine / Health"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nicholas-karakunnel\"}})":{"__ref":"MentorPub
