xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8b565a25-3f68-4afd-9c72-0d0d6c822fb8\"}":{"__typename":"Favorites","uuid":"8b565a25-3f68-4afd-9c72-0d0d6c822fb8","photoUrl":"https://ucarecdn.com/e78ade79-1c9b-4c7e-98ce-d47d5208f221/","title":"Sarah Snook","type":"ACTOR"},"Favorites:{\"uuid\":\"35ded9dc-206f-4ece-9b5c-131b324d2b2b\"}":{"__typename":"Favorites","uuid":"35ded9dc-206f-4ece-9b5c-131b324d2b2b","photoUrl":"https://ucarecdn.com/c4785bab-e658-497f-8178-1484affdc9ac/","title":"Virgo's Groove by Beyoncé","type":"SONG"},"Favorites:{\"uuid\":\"8a893bbd-8de2-4b4e-a064-460a2f7106f4\"}":{"__typename":"Favorites","uuid":"8a893bbd-8de2-4b4e-a064-460a2f7106f4","photoUrl":"https://ucarecdn.com/b63f5887-914f-4627-a33f-4286da65b406/","title":"Backgammon","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"31ff6df1-233d-4d67-9e01-15d523c19dee\"}":{"__typename":"DeepDives","uuid":"31ff6df1-233d-4d67-9e01-15d523c19dee","content":"\u003cp\u003eDon't stress so much about grades! Worry more about the learning, and the grades will reflect that.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ea98791b-00df-4ea6-8fce-b98f780663dc\"}":{"__typename":"DeepDives","uuid":"ea98791b-00df-4ea6-8fce-b98f780663dc","content":"\u003cp\u003eI chose theatre because it is what I have loved doing since I was 6 years old, and I want to build a career for myself in the entertainment industry in New York City.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI added Communication as a double major in my sophomore year of college because I wanted to learn more practical skills in the job industry that were still in my field of media and entertainment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I'm so glad I did both! They complemented one another so well, and I felt like I really just graduated with one big degree!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"0efd9b84-6773-45ce-a519-c1f89cc6942c\"}":{"__typename":"DeepDives","uuid":"0efd9b84-6773-45ce-a519-c1f89cc6942c","content":"\u003cp\u003eI love helping people find what they are passionate about and helping them stay organized to accomplish their goals. Having a project that helps one grow as a person and as a student is one of the most rewarding things I can help mentees do.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eStaying organized was one of my biggest challenges in high school, and I wish I had a mentor who would've helped me when I was struggling. \u003c/p\u003e\u003cp\u003e\u003cbr\u003eI want to give back and be that motivating, encouraging force that not only keeps students on track, but pushes them to achieve their highest potential!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f77a04c4-f1f0-488a-ba6f-436b14c0c3cc\"}":{"__typename":"DeepDives","uuid":"f77a04c4-f1f0-488a-ba6f-436b14c0c3cc","content":"\u003cp\u003eWhen I moved to New York City in August 2025, I raised money to produce a full-length theatre show in Midtown Manhattan called \u003cem\u003ePurgatorio\u003c/em\u003e. Not only was I fundraising, scheduling rehearsals, booking spaces, and coordinating teammembers, but I also starred in the show and had over 500 lines! It was truly a feat, but because it was something I truly loved to do, it brought me so much joy and fulfillment. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"5736bce3-57ad-40e2-a2ee-bff13187fc7f\"}":{"__typename":"School","uuid":"5736bce3-57ad-40e2-a2ee-bff13187fc7f","name":"UNC School of the Arts","city":"Winston Salem","type":"HIGH","state":"North Carolina","country":"United States","zip":"27107"},"Education:{\"uuid\":\"207aa3bf-8b2c-4d6a-a374-af9d56b6fd27\"}":{"__typename":"Education","uuid":"207aa3bf-8b2c-4d6a-a374-af9d56b6fd27","school":{"__ref":"School:{\"uuid\":\"5736bce3-57ad-40e2-a2ee-bff13187fc7f\"}"},"startYear":"2019","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"caa36047-6685-4fdc-bff2-a98500625f92\"}":{"__typename":"Education","uuid":"caa36047-6685-4fdc-bff2-a98500625f92","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Theatre \u0026 Communication","degree":null},"MentorPublicProfile:{\"uuid\":\"1feff0eb-4b82-4366-a0c2-11237593f3e8\"}":{"__typename":"MentorPublicProfile","uuid":"1feff0eb-4b82-4366-a0c2-11237593f3e8","displayName":"Sierra C.","slug":"sierra-corcoran","biography":"\u003cp\u003eMy name is Sierra, and I’m a multifaceted professional: mentor, actor, producer, and marketer. I’ve been deeply connected to the arts since I was six years old, but my time at Stanford University expanded my curiosity far beyond performance alone. Through interdisciplinary coursework and collaboration with peers across disciplines, I developed a genuine appreciation for STEM fields and the power of integrating creative and analytical thinking.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, I majored in Theatre and Communication, combining the two into a hybrid media studies focus. This allowed me to explore how digital spaces, technology, and storytelling shape individuals and society. I engaged with these ideas through work in A.I. technologies, performance, and journalism, gaining a nuanced understanding of how media influences the way we connect, learn, and express ourselves.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy favorite passion project I’ve done both academically and personally was my final capstone project for my theatre degree. I got to take full ownership over a production from start to finish, which included booking rehearsal and performance spaces, scheduling my teammates, building a set, and most of all, memorizing a play with only 2 characters and performing 6 shows back-to-back in one weekend. It was so much work, but thanks to my incredible team of artists who were there to uplift and support me, it was successful!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, I spent a lot of my extracurricular time at school as a mentor to middle schoolers, helping them organize local, community-focused service projects while also providing them with a safe space to learn and grow alongside one another. This was the most fulfilling role I have ever played, and watching those girls grow from shy, unsure 6th graders to 8th-grade leaders in their schools and local communities was the most pride I’ve ever felt.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to take my past experiences in project development and mentorship to support you in creating a project that speaks to your passions and drives. Having a team around you that is invested in your success and your learning is the key to creating a project that reflects who you are and what you’re capable of. I’m excited to support you as we explore that journey together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work, you can usually find me experimenting with a new recipe in the kitchen, biking around New York City (especially in the summer!), or getting lost in a new fantasy series. If you have any fantasy series recommendations, please let me know! I’m always looking for a new read.\u003c/p\u003e","teachingVideoPlaybackId":"IWk1sHcKKZ3HvZxcacDjTY9CUlfWbWi7ZkiBhe01K01xY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8b565a25-3f68-4afd-9c72-0d0d6c822fb8\"}"},{"__ref":"Favorites:{\"uuid\":\"35ded9dc-206f-4ece-9b5c-131b324d2b2b\"}"},{"__ref":"Favorites:{\"uuid\":\"8a893bbd-8de2-4b4e-a064-460a2f7106f4\"}"}],"causesSupported":[],"major":"Theatre \u0026 Communication","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"31ff6df1-233d-4d67-9e01-15d523c19dee\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea98791b-00df-4ea6-8fce-b98f780663dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"0efd9b84-6773-45ce-a519-c1f89cc6942c\"}"},{"__ref":"DeepDives:{\"uuid\":\"f77a04c4-f1f0-488a-ba6f-436b14c0c3cc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/407cc017-0b03-400b-aeff-ff8a3399a4a3/-/preview/-/format/jpg/","https://ucarecdn.com/b6b0dffd-2ec9-4772-846a-c3bd54fb48ed/-/preview/-/format/jpg/","https://ucarecdn.com/c28c541b-1f32-4aee-b668-1faa43dc6343/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"207aa3bf-8b2c-4d6a-a374-af9d56b6fd27\"}"},{"__ref":"Education:{\"uuid\":\"caa36047-6685-4fdc-bff2-a98500625f92\"}"}],"hiredAt":"2026-01-28T02:11:13.859Z","topics":["K-5 Grade Math","6-8 Grade Science","Writing","Spanish","Academic Coaching","College Essay Writing","Executive Function","History","Reading","Creative Writing","Film / Theater","K-6 Storybook","Business / Entrepreneurship","Web Design","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sierra-corcoran\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1feff0eb-4b82-4366-a0c2-11237593f3e8\"}"}}},"_sentryTraceData":"2f93c0b7fdcf496db63f8ee171976d12-a40f5e0f92228086-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2f93c0b7fdcf496db63f8ee171976d12,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sierra-corcoran"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html
