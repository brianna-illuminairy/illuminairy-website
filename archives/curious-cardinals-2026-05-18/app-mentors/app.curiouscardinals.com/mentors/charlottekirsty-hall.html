ab Seoul in South Korea where she led a team to develop a bio-leather from bacteria and yeast as well as design and construct technical equipment for the lab. Her passion for creative and active teaching has led her to Curious Cardinals, where she hopes to use her experience and enthusiasm to help students learn in a welcoming and engaging environment. ","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":null,"deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/6bae5bb5-6fd8-49d3-818e-58c13f441665/-/crop/4336x4335/0,1008/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"139ee749-62b1-41fb-bff7-0b50b8ce395a\"}"}],"hiredAt":"2021-12-06T13:18:03.000Z","topics":["Cooking","Women \u0026 Gender Studies","STEM Project","Architecture","Economics","Visual Arts / Graphic Design","Journalism","Game Design","Video / Photography","Sustainability","Film / Theater","Biology","Creative Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"charlottekirsty-hall\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9f667237-1dc6-4fe5-b259-30d75714cb7c\"}"}}},"_sentryTraceData":"49adf009f83c41f19cb9b937ff1c00c3-948e701834febe46-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=49adf009f83c41f19cb9b937ff1c00c3,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"charlottekirsty-hall"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (f
