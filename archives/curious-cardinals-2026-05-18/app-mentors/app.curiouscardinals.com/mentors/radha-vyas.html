xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bc806ac1-1050-4676-8352-d0b3a8489e6d\"}":{"__typename":"Favorites","uuid":"bc806ac1-1050-4676-8352-d0b3a8489e6d","photoUrl":"https://ucarecdn.com/c6ca3a1c-9894-4fca-a5ee-4cebcfdddc0c/","title":"Tennis","type":"SPORT"},"Favorites:{\"uuid\":\"36c5afa4-c045-4428-bcd1-f86b134e4f60\"}":{"__typename":"Favorites","uuid":"36c5afa4-c045-4428-bcd1-f86b134e4f60","photoUrl":"https://ucarecdn.com/b5be8d32-1073-4c48-bd86-26cae162fc14/","title":"London","type":"CITY"},"Favorites:{\"uuid\":\"0decdbae-deaf-4541-9ff7-c880cd61d907\"}":{"__typename":"Favorites","uuid":"0decdbae-deaf-4541-9ff7-c880cd61d907","photoUrl":"https://ucarecdn.com/728f5379-2885-4417-8c47-01f091a1b76b/","title":"Mario Kart","type":"GAME"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"868d16ae-463d-43e6-9101-4e4b74cd455e\"}":{"__typename":"DeepDives","uuid":"868d16ae-463d-43e6-9101-4e4b74cd455e","content":"\u003cp\u003eThe desire to mentor comes naturally to me. As an only child with little/no family other than my incredible parents, I personally had very little guidance when it came to navigating school/college, applying to college and medical school, figuring out what I wanted my future career to look like, etc. I've fought many battles against imposter syndrome and overwhelming uncertainty that I believe could have been avoided had I had a consistent mentor. This is what fuels me to mentor! It is my goal to be that voice of reason and unwavering support, that I so needed and wanted in the past, for students seeking guidance :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"9d5d349d-e111-4c67-bbae-f3f5f4b6d1f1\"}":{"__typename":"DeepDives","uuid":"9d5d349d-e111-4c67-bbae-f3f5f4b6d1f1","content":"\u003cp\u003eMy dream job is actually the one I am about to have - I'll be a doctor in just a few months (still feels surreal to say!), and I truly can't imagine myself in any other career. Connecting with patients while helping them heal using science are some of the main reasons I love the field of medicine, and I can't wait to finally put those years of schooling to good use!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"15ef710f-f56e-455a-aacc-e0d8656bb127\"}":{"__typename":"DeepDives","uuid":"15ef710f-f56e-455a-aacc-e0d8656bb127","content":"\u003cp\u003eProfessionally, I would tell my middle/high school self to start exploring what's out there! Sounds vague, but I didn't fully realize how many different career paths and opportunities existed until I was about halfway through college. I'd want my younger self to start researching what career paths sound the most appealing so that I could spend more time in college chasing those dreams rather than doing the exploration then!\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePersonally, I would advise my middle/high school self to do more of what you love. I adored tennis (and still do!), but because I don't have as much time as I did in middle/high school and now have fewer fellow tennis-lovers around me, I haven't picked up a racquet in months! I'd tell her to cherish the free time and capitalize on it by playing tennis whenever she can :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f150f85e-ae28-4802-8f87-d4bc02c3a432\"}":{"__typename":"DeepDives","uuid":"f150f85e-ae28-4802-8f87-d4bc02c3a432","content":"\u003cp\u003eI always knew I wanted to choose a science subject as my major, but I was torn between chemistry and biology. I loved biology a \u003cem\u003ebit \u003c/em\u003emore at the time (and was better at it high school), so I decided to pursue it as my major in college and minor in chemistry instead! I wasn't set on medicine when I entered college, though, and wanted to give myself the time to explore other fields. I loved research and got involved in some cutting-edge work reengineering healthy cells to more precisely and specifically target cancer (which I LOVED and became incredibly passionate about!) and initially thought I wanted to pursue a career as a researcher/scientist. After doing an internship, I realized that what I really wanted to see was how this incredible work was actually affecting patients' daily lives. At that point, I knew medicine was the career for me, and I set out to become a doctor! That research work still has an impact on me today, though, as I'm hoping to pursue hematology/oncology fellowship after residency to become a more specialized physician who would actually be able to prescribe the technologies and medications I worked on in college. This time though, I'd be able to see their impacts firsthand :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"8c03cdf2-739a-406d-a62f-a697dac69dfb\"}":{"__typename":"School","uuid":"8c03cdf2-739a-406d-a62f-a697dac69dfb","name":"Parsippany High School","city":"Parsippany-Troy Hills","type":"HIGH","state":"New Jersey","country":"United States","zip":"07054"},"Education:{\"uuid\":\"8d3a7092-a333-4485-946e-95ff6099d66d\"}":{"__typename":"Education","uuid":"8d3a7092-a333-4485-946e-95ff6099d66d","school":{"__ref":"School:{\"uuid\":\"8c03cdf2-739a-406d-a62f-a697dac69dfb\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"62cc0e5d-4c68-4974-b6fb-97a2ca1d84cb\"}":{"__typename":"Education","uuid":"62cc0e5d-4c68-4974-b6fb-97a2ca1d84cb","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"b54c7aa6-f0bc-4642-8657-3cad04d6a6ad\"}":{"__typename":"MentorPublicProfile","uuid":"b54c7aa6-f0bc-4642-8657-3cad04d6a6ad","displayName":"Radha V.","slug":"radha-vyas","biography":"\u003cp\u003eHi! My name is Radha, and I'm a fourth year medical student in New Jersey (my home state) and soon-to-be internal medicine resident physician!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eEducational Background:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBA in Molecular \u0026amp; Cell Biology from the University of Pennsylvania with minors in Chemistry and French \u0026amp; Francophone Studies\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMS in Biology from New York University\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e~2 months away from graduating with my MD from Rutgers Robert Wood Johnson Medical School\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMentorship/Teaching Experience:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI've been tutoring/mentoring for as long as I can remember! Here are some of my \u003cem\u003ehighlights\u003c/em\u003e -\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eIn college, I tutored West Philadelphia high school students on a weekly basis in subjects like math, reading, chemistry, and biology, and I was also a peer mentor for 3 years!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDuring the COVID-19 pandemic, I tutored elementary and middle school students every week. This is when I \u003cem\u003ereally\u003c/em\u003e had to get creative to ensure our virtual sessions were engaging but also productive. Think endless whiteboard drawings, at-home science experiments, and connecting our lessons to real-world events to \"make it stick!\"\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIn medical school, I'm a peer mentor and formal resource for students interested in pursuing internal medicine\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I Can Help With:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAnything science! Biology, chemistry, anatomy/physiology, etc.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eK-5 grade math, pre-algebra, algebra, geometry, precalculus/trigonometry, statistics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEstablishing good study skills and consistent routines\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGuidance on pursuing a career in STEM and specifically, medicine\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e...and the list goes on! I have a range of experiences to pull from and would be happy to chat to figure out what your/your child's goals are to see how I can support them :)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHobbies/Interests:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTennis! I've played since the 4th grade and was a varsity athlete and team captain in high school\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTraveling - I've been to 50+ international cities and am constantly trying to visit the cities on my ever-expanding list\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eListening to music and updating my Spotify playlists (one with over 3000 songs!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSpending time with friends and family, especially by taking them to cute coffee shops and new restaurants in the NJ/NYC/Philly area\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReading/watching psychological thrillers\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePhotography (especially landscapes, cityscapes, and architecture)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThings in Medicine I'm Passionate About:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eHematology/oncology\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWomen's health\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMedical education and health literacy\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAcademic medicine\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThe Big Picture:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eEach student thinks, works, and processes information differently, so I'll meet you where you are. Having been in school for nearly my entire life, I've truly seen it all when it comes to study techniques. We'll strengthen weaknesses and reinforce strengths on an \u003cem\u003eindividual\u003c/em\u003e level, pulling from my toolkit as needed, to reach our shared goals!\u003c/p\u003e","teachingVideoPlaybackId":"a007M25f9DHvhyP4nAEOoTqxSCdUo02QSBgcBriCU79z00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bc806ac1-1050-4676-8352-d0b3a8489e6d\"}"},{"__ref":"Favorites:{\"uuid\":\"36c5afa4-c045-4428-bcd1-f86b134e4f60\"}"},{"__ref":"Favorites:{\"uuid\":\"0decdbae-deaf-4541-9ff7-c880cd61d907\"}"}],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"868d16ae-463d-43e6-9101-4e4b74cd455e\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d5d349d-e111-4c67-bbae-f3f5f4b6d1f1\"}"},{"__ref":"DeepDives:{\"uuid\":\"15ef710f-f56e-455a-aacc-e0d8656bb127\"}"},{"__ref":"DeepDives:{\"uuid\":\"f150f85e-ae28-4802-8f87-d4bc02c3a432\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f79fff41-ea31-4177-9115-bb3ddb5c4048/-/preview/-/format/jpg/","https://ucarecdn.com/8d9ae65d-a9f1-4e51-bb58-4e12f728248a/-/preview/-/format/jpg/","https://ucarecdn.com/a869215a-2749-4af7-ba27-d5db68bef188/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8d3a7092-a333-4485-946e-95ff6099d66d\"}"},{"__ref":"Education:{\"uuid\":\"62cc0e5d-4c68-4974-b6fb-97a2ca1d84cb\"}"}],"hiredAt":"2025-12-22T13:46:06.808Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Chemistry","Biology","Academic Coaching","Executive Function"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/9fa2d8bf-132f-4356-a39d-e6f0aecb3e5b/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,
