xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5b507349-0869-4c6d-b928-1bdcedbe091b\"}":{"__typename":"Favorites","uuid":"5b507349-0869-4c6d-b928-1bdcedbe091b","photoUrl":"https://ucarecdn.com/2f105d9d-7db0-4941-9a25-b3578374eb6c/","title":"Minecraft","type":"GAME"},"Favorites:{\"uuid\":\"251abc19-c60c-4f3e-8d82-5bf987807ad2\"}":{"__typename":"Favorites","uuid":"251abc19-c60c-4f3e-8d82-5bf987807ad2","photoUrl":"https://ucarecdn.com/d613fc31-750f-434e-afa6-942555444f4d/","title":"My Way by Frank Sinatra","type":"SONG"},"Favorites:{\"uuid\":\"8f6db2fe-eab9-41a0-8919-566a5f3e2820\"}":{"__typename":"Favorites","uuid":"8f6db2fe-eab9-41a0-8919-566a5f3e2820","photoUrl":"https://ucarecdn.com/1959ccca-a752-459f-9939-bc63f44ec38a/","title":"Waitress","type":"PLAY"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"96dabd78-dd7f-4164-b60a-82bcef3ad3ef\"}":{"__typename":"DeepDives","uuid":"96dabd78-dd7f-4164-b60a-82bcef3ad3ef","content":"\u003cp\u003eDuring high school, I used my summers to explore academic interests, build new skills, and enjoy some well-earned downtime. After freshman year, I stayed at Princeton University, where I took a college-level course and a public speaking workshop to overcome my fear of public speaking. It was also my first time meeting people from so many different places and backgrounds, which was incredibly eye-opening at a young age. Between sophomore and junior year, I interned at a small law firm as a legal assistant, gaining exposure to a professional environment. The summer before senior year, with COVID limiting in-person opportunities, I focused on preparing for the SAT, taught myself to play the ukulele, worked as a grocery store cashier, and played video games to unwind. Not every day was packed with activities, though. I also made plenty of time to hang out with friends, get sunburnt at the beach, and just relax, which helped me stay balanced and avoid burnout.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4a2ab590-0072-49c3-9483-157e2008c8c1\"}":{"__typename":"DeepDives","uuid":"4a2ab590-0072-49c3-9483-157e2008c8c1","content":"\u003cp\u003eIn my spare time, I enjoy building LEGO sets and crocheting. I have loved building all types of LEGOs from a young age, but most of my newer sets come from the Botanical, Ideas, and Modular Building lines. Crocheting is another major passion of mine because it is not only therapeutic but a sustainable and practical art form. I especially enjoy making clothing, as well as amigurumi (stuffed animals and objects). Although it may seem simple, crocheting involves a lot of planning, measuring, and choosing the right materials, so it helps me unwind while still challenging me to think creatively.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8bc0fb92-7ab6-4076-b357-3ef825ae1d04\"}":{"__typename":"DeepDives","uuid":"8bc0fb92-7ab6-4076-b357-3ef825ae1d04","content":"\u003cp\u003eI consider my research work a passion project because it’s not something required for my degree. Rather, it's something I choose to do because I genuinely enjoy it. One project I’m currently working on involves training a language model to mimic how children learn language. It’s a bit of a funny visual, but the training is done using audio and video data collected from toddlers wearing GoPro cameras on their heads as they explore and play. The idea is to see how well the model captures patterns of human language acquisition and what that reveals at the intersection of linguistics, cognitive science, and computer science. I find this work especially exciting because it gives me a chance to apply my computational skills in a way that connects with larger questions about how we learn and understand language.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"710735fa-597a-4194-86c7-c446c9d3e304\"}":{"__typename":"DeepDives","uuid":"710735fa-597a-4194-86c7-c446c9d3e304","content":"\u003cp\u003eStop comparing yourself to other people. Going to college and gaining some perspective has shown me that there isn’t one right path to success. There are so many, and they all look different depending on the person. The best path for you is the one that builds on your natural strengths, interests, and goals. What really matters, especially in things like applications, is the narrative you tell about your life. The key is learning how to use everything you’ve been through, including both the wins and the setbacks, to show who you are and where you’re going.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"c2a25ec4-9e21-425a-9f55-00ee0fc2c561\"}":{"__typename":"School","uuid":"c2a25ec4-9e21-425a-9f55-00ee0fc2c561","name":"Manalapan High School","city":"Manalapan Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"07726"},"Education:{\"uuid\":\"0b03067e-cbaa-4c66-83e9-3b04e12d8cf2\"}":{"__typename":"Education","uuid":"0b03067e-cbaa-4c66-83e9-3b04e12d8cf2","school":{"__ref":"School:{\"uuid\":\"c2a25ec4-9e21-425a-9f55-00ee0fc2c561\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"e93ad1b3-ab0d-45ce-afa1-cc6c3e232abc\"}":{"__typename":"Education","uuid":"e93ad1b3-ab0d-45ce-afa1-cc6c3e232abc","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"99b77296-7404-411e-becd-e94f6f006a2c\"}":{"__typename":"MentorPublicProfile","uuid":"99b77296-7404-411e-becd-e94f6f006a2c","displayName":"Deanna D.","slug":"deanna-decarlo-1","biography":"\u003cp\u003eHi, I’m Deanna! I am a senior at Yale majoring in Computer Science with a focus on artificial intelligence, specifically machine learning and natural language processing. I plan to attend law school after graduation to work in regulatory compliance. But before all of that, I was a girl in central New Jersey trying to figure out what I was passionate about, and it turned out to be a little bit of everything!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up in a town that has farms down the road, the beach a short drive away, and New York City just across the river. I went to public school in my area and got involved in just about every extracurricular that sparked my curiosity. I loved science and math, but also found myself drawn to debate, philosophy, and community volunteering. I participated in various conferences and competitions, stayed after school nearly every day for club meetings, and worked hard in my classes. When I graduated as valedictorian, it wasn’t just because I studied a lot; it was because I genuinely enjoyed learning and saw connections across different subjects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I applied to Yale, I was looking for a place where I could keep that interdisciplinary momentum going. I came in knowing I wanted to study STEM, but also that I wanted to go to law school. I’ve stuck with both goals, and now my work lives at the intersection of technology, ethics, and policy. I’ve been a long-term researcher at the Computational Linguistics at Yale (CLAY) Lab, where I’ve published research in machine learning and language. I’ve also worked with the Yale Policy Institute and Yale Law School on U.S. AI policy research. This summer, I’m doing research abroad in Dublin on secure machine learning for biometric data.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBut one of the most important parts of my time at Yale has been teaching. I’ve worked for three years as an Undergraduate Learning Assistant (ULA) in the CS department, and I’ve been recognized by the department for exceptional teaching. Several students I’ve mentored have come back to tell me that I inspired them to major in CS, which is one of the most meaningful things I could hear as a teaching figure. I love mentoring students who are still figuring out what excites them, or who want to connect what they already enjoy learning in school to something bigger.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I’m involved in several student communities, including Women and Gender Minorities in CS, First-Generation and Low-Income Students at Yale, and the Harbor Fellows Program for independent students. Being part of these spaces has made me even more committed to mentorship beyond the traditional classroom setting.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I like to crochet, build Lego sets (I have way too many), hike, and read nonfiction about philosophy and psychology. I’d describe myself as a mix of introverted and extroverted (it depends on the environment!) but my friends would say I’m dedicated, resilient, and a good listener.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether you're working on a personal project, exploring a new subject, or trying to study more effectively, I can help you find an approach that works. I've supported students with a wide range of learning styles and have collaborated with Yale’s Student Accessibility Services, so adapting to individual needs is a big part of how I teach. I am also open to providing support with college applications and essays. Wherever you’re starting from, I’d like to meet you there and help you move forward with confidence.\u003c/p\u003e","teachingVideoPlaybackId":"tWWOUqsZEAv011RLE6E2rI1opqiKzVPwq4UEn26JzF4I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"5b507349-0869-4c6d-b928-1bdcedbe091b\"}"},{"__ref":"Favorites:{\"uuid\":\"251abc19-c60c-4f3e-8d82-5bf987807ad2\"}"},{"__ref":"Favorites:{\"uuid\":\"8f6db2fe-eab9-41a0-8919-566a5f3e2820\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"96dabd78-dd7f-4164-b60a-82bcef3ad3ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"4a2ab590-0072-49c3-9483-157e2008c8c1\"}"},{"__ref":"DeepDives:{\"uuid\":\"8bc0fb92-7ab6-4076-b357-3ef825ae1d04\"}"},{"__ref":"DeepDives:{\"uuid\":\"710735fa-597a-4194-86c7-c446c9d3e304\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/71299eab-2604-4d96-830b-186e9b447224/-/preview/-/format/jpg/","https://ucarecdn.com/8b78327b-2db5-45a0-985f-d064750ffea5/-/preview/-/format/jpg/","https://ucarecdn.com/04452198-96f6-4c05-8a29-9c2c41287a7e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0b03067e-cbaa-4c66-83e9-3b04e12d8cf2\"}"},{"__ref":"Education:{\"uuid\":\"e93ad1b3-ab0d-45ce-afa1-cc6c3e232abc\"}"}],"hiredAt":"2025-07-07T22:36:46.652Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Statistics","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Computer Science","Fashion / Cosmetics","Coding / Programming","STEM Project","Machine Learning / AI","Law / Government / Policy","Sustainability"],"communityBadges":["https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"deanna-decarlo-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"99b77296-7404-411e-becd-e94f6f006a2c\"}"}}},"_sentryTraceData":"0a0e7f10569347dd821968ba24d68b57-8b0e8f00ce203969-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=0a0e7f10569347dd821968ba24d68b57,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"deanna-decarlo-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.inse
