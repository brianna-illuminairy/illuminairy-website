xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"663dd4af-1272-4037-923c-5e678dead6d3\"}":{"__typename":"Favorites","uuid":"663dd4af-1272-4037-923c-5e678dead6d3","photoUrl":"https://ucarecdn.com/169f64fa-50b8-47f8-9bd0-2d665833e694/","title":"A Man Called Ove","type":"BOOK"},"Favorites:{\"uuid\":\"f0afbe6b-9dfe-4d93-bdf7-4a446a4289fa\"}":{"__typename":"Favorites","uuid":"f0afbe6b-9dfe-4d93-bdf7-4a446a4289fa","photoUrl":"https://ucarecdn.com/efeb52e7-7016-4257-b40f-9af8e0437205/","title":"starboy","type":"ALBUM"},"Favorites:{\"uuid\":\"54d091b4-fc5e-4399-a221-0cc864b519f0\"}":{"__typename":"Favorites","uuid":"54d091b4-fc5e-4399-a221-0cc864b519f0","photoUrl":"https://ucarecdn.com/afaf1ab7-7bc9-4799-849a-52658af52415/","title":"dirk nowitzki","type":"ATHLETE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a6a17cc7-a875-463d-b038-be9e316fef5d\"}":{"__typename":"DeepDives","uuid":"a6a17cc7-a875-463d-b038-be9e316fef5d","content":"\u003cp\u003eMy dream job is to become a physician! However, if I had to choose a different job, I would want to be food critic, trying all the best restaurants across the world :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"be66a0e8-3f04-4a64-92ee-ad1e365797cd\"}":{"__typename":"DeepDives","uuid":"be66a0e8-3f04-4a64-92ee-ad1e365797cd","content":"\u003cp\u003eIn my spare time I love to run. I love how I can  think about nothing and just run. I also like to read in my spare time. A recent read of mine I enjoyed is \u003cem\u003eI Who Have Never Known Men\u003c/em\u003e by Jacqueline Harpman that dives into the tenderness and complexity of humanity. Otherwise, I also love to explore all sorts of new cafes and find my next favorite matcha!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b3c9a084-f581-4354-b107-a0672fe0183b\"}":{"__typename":"DeepDives","uuid":"b3c9a084-f581-4354-b107-a0672fe0183b","content":"\u003cp\u003eRelax. I would tell myself to just breathe, calm down, and reassure myself that everything will be just fine. There's no need to move so quickly through life. Just take your time and enjoy the ride.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e609db10-169f-4a88-9de1-e40b4db75f21\"}":{"__typename":"DeepDives","uuid":"e609db10-169f-4a88-9de1-e40b4db75f21","content":"\u003cp\u003eShadowing physicians and learning that patients have better survival rates with targeted therapy led to my desire to pursue biomedical engineering, to create the technology for chemo delivery systems. Through biomedical engineering, I can develop advanced immunotherapy that will allow me to participate in labs to technology to help cure acute myeloid leukemia (AML). The advanced chromosomal mutation targeted therapy I help create can be the reason people like Dr. Kim, my pediatrician with AML, have a chance to overcome this aggressive leukemia. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"b9044f77-252e-406d-91e7-d31a33350824\"}":{"__typename":"School","uuid":"b9044f77-252e-406d-91e7-d31a33350824","name":"Hebron High School","city":"Carrollton","type":"HIGH","state":"Texas","country":"United States","zip":"75010"},"Education:{\"uuid\":\"04107ef8-3149-448a-8dee-a7b5d4fb39fc\"}":{"__typename":"Education","uuid":"04107ef8-3149-448a-8dee-a7b5d4fb39fc","school":{"__ref":"School:{\"uuid\":\"b9044f77-252e-406d-91e7-d31a33350824\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"c7d654c6-41fc-4ebc-991c-0508949aa4cd\"}":{"__typename":"Education","uuid":"c7d654c6-41fc-4ebc-991c-0508949aa4cd","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Biomedical Engineering + PreMed","degree":null},"MentorPublicProfile:{\"uuid\":\"c319195b-ba2d-4034-baaf-937ca9849f15\"}":{"__typename":"MentorPublicProfile","uuid":"c319195b-ba2d-4034-baaf-937ca9849f15","displayName":"Allison S.","slug":"allison-shea","biography":"\u003cp\u003eHi!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Allison Shea, and I am a student at Brown University studying Biomedical Engineering on the Pre-Med track. I spend a lot of time studying, but this has allowed me to discover my love for chemistry, especially organic chemistry. I’m also learning about electricity and magnetism in my engineering courses while studying genetics through my pre-med classes. These subjects intertwine beautifully, and I love seeing how chemistry, physics, and biology connect to help us understand the human body.\u003c/p\u003e\u003cp\u003eAs a kid, I was always building with Legos, and I’ve collected quite the assortment over the years. Looking back, I think this was where I unknowingly began building the foundation for my future in engineering, a field that lets me solve hands-on problems and bring ideas to life.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis past summer, I had the opportunity to work in the Aguilera Lab at UT Southwestern Medical Center, where I specialized in molecular biology wet lab techniques. I learned invaluable technical and analytical skills, from DNA extraction to gel electrophoresis, and this experience reaffirmed my love for research and discovery. I am continuing to explore this passion at Brown as part of the Wong Lab, where we study metastatic cancer, specifically, why certain cancer cells migrate to particular parts of the body. I assist with data and image analysis, and every day I’m reminded of how much there is still to learn in biomedical science.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Brown, I’m involved in several organizations, but my favorite roles are those where I can mentor others. As a mentor for Women in Science and Engineering (WiSE) and the Society of Asian Scientists and Engineers (SASE), I’ve had the incredible opportunity to guide underclassmen, answering their questions, offering advice, and encouraging them to pursue their own ambitions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not in the lab or library, I love to run around Providence. The city has so many scenic routes that make every jog feel like an adventure. I’m also a huge food enthusiast. Whether grabbing a sweet treat or savoring a bowl of pho, I believe food brings people together. I also love to cook, especially for other people!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAdditionally, I’m the founder of Share with Shea, a nonprofit organization that helps register individuals, especially from underrepresented populations, for the National Bone Marrow Registry. Through drives at churches, universities, and festivals, we’ve added over 1,500 donors and directly helped save four lives. I hope to help others find their passions and make a difference, too!\u003c/p\u003e","teachingVideoPlaybackId":"FCsOrbKts8DXQI8OIqZttzb7o4s8RFmV7OoRpmM8JNA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"663dd4af-1272-4037-923c-5e678dead6d3\"}"},{"__ref":"Favorites:{\"uuid\":\"f0afbe6b-9dfe-4d93-bdf7-4a446a4289fa\"}"},{"__ref":"Favorites:{\"uuid\":\"54d091b4-fc5e-4399-a221-0cc864b519f0\"}"}],"causesSupported":[],"major":"Biomedical Engineering + PreMed","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a6a17cc7-a875-463d-b038-be9e316fef5d\"}"},{"__ref":"DeepDives:{\"uuid\":\"be66a0e8-3f04-4a64-92ee-ad1e365797cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"b3c9a084-f581-4354-b107-a0672fe0183b\"}"},{"__ref":"DeepDives:{\"uuid\":\"e609db10-169f-4a88-9de1-e40b4db75f21\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b5b30d66-4a63-4d6a-b288-ecea223bd203/-/preview/-/format/jpg/","https://ucarecdn.com/b3cdf35b-50fc-4334-a422-70fef56f29c8/-/preview/-/format/jpg/","https://ucarecdn.com/8e005b7a-dae7-4330-8990-21af10f6acd6/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"04107ef8-3149-448a-8dee-a7b5d4fb39fc\"}"},{"__ref":"Education:{\"uuid\":\"c7d654c6-41fc-4ebc-991c-0508949aa4cd\"}"}],"hiredAt":"2025-10-21T21:10:02.041Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","K-6 Storybook","Creative
