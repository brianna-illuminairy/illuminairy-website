xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"88f3cf60-8f6b-40eb-af48-c46188767337\"}":{"__typename":"Favorites","uuid":"88f3cf60-8f6b-40eb-af48-c46188767337","photoUrl":"https://ucarecdn.com/10923da9-37f7-4d68-a45e-c819c4cfea92/","title":"Inception","type":"MOVIE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"85281c5d-7ab4-405e-b5fc-47ec5fd2905d\"}":{"__typename":"DeepDives","uuid":"85281c5d-7ab4-405e-b5fc-47ec5fd2905d","content":"\u003cp\u003eI chose neuroscience because I’ve always been fascinated by how our brains shape how we think, feel, and experience the world. It sits at the intersection of biology, behavior, and cognition, allowing me to ask both scientific and human questions. Through my research on multisensory perception and my work making science more accessible—whether through teaching or outreach—I’ve found that neuroscience gives me the tools to explore not just how the brain works, but how it connects us to each other and our environments. It’s a field that constantly challenges me to think critically, ask deeper questions, and apply what I learn in meaningful, real-world contexts.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"37ee6187-7e67-4179-8bc2-d5038638125c\"}":{"__typename":"School","uuid":"37ee6187-7e67-4179-8bc2-d5038638125c","name":"Seoul International School","city":"Seongnam-si","type":"HIGH","state":"Gyeonggi-do","country":"South Korea","zip":"461-200"},"Education:{\"uuid\":\"cb89c413-faf3-4143-8a25-a721f5304bc7\"}":{"__typename":"Education","uuid":"cb89c413-faf3-4143-8a25-a721f5304bc7","school":{"__ref":"School:{\"uuid\":\"37ee6187-7e67-4179-8bc2-d5038638125c\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"c1c46252-1d6e-478e-a834-cb71f0090189\"}":{"__typename":"Education","uuid":"c1c46252-1d6e-478e-a834-cb71f0090189","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Neuroscience","degree":null},"Testimonial:9dccd3f3-fa2b-461a-9213-b51d50a4e2bc":{"__typename":"Testimonial","id":"9dccd3f3-fa2b-461a-9213-b51d50a4e2bc","text":"Ashley has helped Sasha through the summer to work on her blog. Ashley brings out the best from Sasha by engaging with her in a way that motivates her to give her best. \nIt is amazing to see her blog for the first time and effort that has gone into her research, it has been possible only because of Ashley! This program has been very beneficial, to have a mentor who was in high school not long before that Sasha has talk to and learn from!","date":"2025-08-22 16:16:47.353+00","rating":5,"endorser":{"__typename":"Endorser","name":"Zeena Benjamin","tagline":"","avatar":null}},"Testimonial:aea30e7c-d09c-4ef6-adaa-43f46c3b07d4":{"__typename":"Testimonial","id":"aea30e7c-d09c-4ef6-adaa-43f46c3b07d4","text":"Ashley has been a wonderful mentor, and I am thoroughly impressed by what Alyssa achieved this summer. I read her draft research paper, and it was evident how much work went into it. The skills that Alyssa developed through this mentorship far exceed what she could have gained in high school. We are extremely grateful for Ashley's patience in guiding Alyssa through every step of the process. I hope Alyssa maintains her curiosity and continues to learn and explore the knowledge she gained during this mentorship throughout her high school and college years. Thank you, Ashley! You are amazing, and Alyssa is so happy to have been paired with such a smart and kind mentor!","date":"2025-08-20 20:54:05.952+00","rating":5,"endorser":{"__typename":"Endorser","name":"Susan","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"41081d17-e679-435a-b1cc-c68d6f8351c7\"}":{"__typename":"MentorPublicProfile","uuid":"41081d17-e679-435a-b1cc-c68d6f8351c7","displayName":"Ashley S.","slug":"ashley-seong","biography":"\u003cp\u003eHere's the updated bio with bolded section headers and VP listed before President:\u003c/p\u003e\u003chr\u003e\u003cp\u003e\u003cstrong\u003eResearch\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI'm a neuroscience student at \u003cstrong\u003eBrown University\u003c/strong\u003e, graduating with a 4.0 GPA, deeply passionate about bridging scientific research, education, and community engagement. My academic journey centers on understanding how humans perceive and interact with the world, a curiosity I explore through coursework in neuroscience, chemistry, and physics, as well as hands-on research experiences.\u003c/p\u003e\u003cp\u003eCurrently, I work in the S\u003cstrong\u003eheinberg Lab at Brown's Graduate School of Neuroscience\u003c/strong\u003e, where I am completing an honors thesis in neuroscience while designing experiments to investigate how people recognize objects through both vision and touch. I use a novel pneumatic haptic display to study multisensory integration, combining both behavioral and technological approaches. Before this, I led behavioral research at \u003cstrong\u003eYonsei University's Cognition Lab\u003c/strong\u003e, focusing on attention and multisensory perception. This experience strengthened my ability to design experiments and analyze cognitive processes across different sensory modalities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my research, I'm passionate about education and mentorship. I serve as a teaching assistant for general chemistry at Brown, where I help students navigate challenging topics like thermodynamics and kinetics. I've also worked as a course developer for organic chemistry and upper-level biology courses, where I focus on promoting conceptual understanding. Outside of formal coursework, I'm co-developing a high school immunology course that blends scientific learning with interactive storytelling through an original Dungeons \u0026amp; Dragons campaign. My goal is to make complex concepts both fun and accessible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy leadership and extracurricular activities are deeply rooted in community and service. As \u003cstrong\u003eVice President of the Brown Addiction Medicine Club\u003c/strong\u003e, I organize harm reduction volunteering and creative recovery workshops in collaboration with RICARES, a local addiction recovery organization. As President of the Korean International Student Association (KISA), I launched KISA Konnect, a program that connects students with Korean professionals and alumni to build networks and mentorships. These experiences reflect my belief that science and health are intrinsically linked to community well-being.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I've had the opportunity to intern at AITrics, where I helped integrate predictive AI technology into hospital workflows to enhance clinical decision-making. I've also supported scientific conferences by providing Korean-English translation, drawing on my fluency in English, Korean, and Mandarin to facilitate cross-cultural communication.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis fall, I will be beginning my dental education at \u003cstrong\u003eColumbia University College of Dental Medicine\u003c/strong\u003e. I earned a 27AA on the DAT and look forward to combining my background in neuroscience and research with a focus on patient care and community health. At the core of everything I do is a drive to make science more human, through research, teaching, and community-based initiatives. I'm excited to continue exploring new spaces where curiosity and impact intersect.\u003c/p\u003e","teachingVideoPlaybackId":"JIKxcgL02HGNcBqllEAWsJJCvw7NRxhZTbiVfyGZSDbM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I’m most proud of is scoring a 27 Academic Average and 28 Total Science on the Dental Admission Test (DAT). Preparing for the DAT was one of the most challenging academic experiences I’ve taken on—it required balancing intense self-discipline, long hours of independent study, and managing stress over several months. I didn’t come from a family with a background in dentistry or test prep resources, so I had to build my own strategy from the ground up: researching study plans, creating my own materials, and holding myself accountable daily.\u003c/p\u003e\u003cp\u003eWhat made this achievement especially meaningful wasn’t just the score itself, but the mindset it reinforced. It taught me how to be self-motivated, how to stay resilient through setbacks, and how to trust my ability to learn complex material on my own terms. It also reminded me of why I want to enter dentistry in the first place—not just for the academic challenge, but to eventually become a provider who can support others with the same level of care and commitment I brought to this goal.\u003c/p\u003e\u003cp\u003eEarning a score I was proud of didn’t just make my parents proud—it helped me believe more deeply in my own potential.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"88f3cf60-8f6b-40eb-af48-c46188767337\"}"}],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"85281c5d-7ab4-405e-b5fc-47ec5fd2905d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7edf9b29-5c18-472f-a7a0-5c57551c3fc9/-/preview/-/format/jpg/","https://ucarecdn.com/5cb86d5e-faef-407e-be57-bb31eb3eb246/-/preview/-/format/jpg/","https://ucarecdn.com/79db1625-f5b0-4687-963c-f742596752ee/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cb89c413-faf3-4143-8a25-a721f5304bc7\"}"},{"__ref":"Education:{\"uuid\":\"c1c46252-1d6e-478e-a834-cb71f0090189\"}"}],"hiredAt":"2025-04-28T21:24:33.903Z","topics":["Algebra II","Algebra I","Precalculus / Trigonometry","Chemistry","Biology","6-8 Grade Science","Writing","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Reading"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:9dccd3f3-fa2b-461a-9213-b51d50a4e2bc"},{"__ref":"Testimonial:aea30e7c-d09c-4ef6-adaa-43f46c3b07d4"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ashley-seong\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"41081d17-e679-435a-b1cc-c68d6f8351c7\"}"}}},"_sentryTraceData":"528e5639d1c14d809bd47d98e75bb8de-b18d34f46419c647-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=528e5639d1c14d809bd47d98e75bb8de,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ashley-seong"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagma
