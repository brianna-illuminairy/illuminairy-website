xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0c2cf22c-aa54-4e85-a6d9-2877c107edd7\"}":{"__typename":"Favorites","uuid":"0c2cf22c-aa54-4e85-a6d9-2877c107edd7","photoUrl":"https://ucarecdn.com/990068da-d1d6-46bf-92b2-c3ed821b423e/","title":"Tomorrow, and Tomorrow, and Tomorrow - Gabrielle Zevin","type":"BOOK"},"Favorites:{\"uuid\":\"5d77456a-a1fb-4879-87a6-1b6bbf376328\"}":{"__typename":"Favorites","uuid":"5d77456a-a1fb-4879-87a6-1b6bbf376328","photoUrl":"https://ucarecdn.com/a5b9a4c1-fb41-42cb-bac6-0220192bb167/","title":"Dreamland - Glass Animals","type":"ALBUM"},"Favorites:{\"uuid\":\"2f685e14-8ffd-4a8f-8422-b49a9398b165\"}":{"__typename":"Favorites","uuid":"2f685e14-8ffd-4a8f-8422-b49a9398b165","photoUrl":"https://ucarecdn.com/4c6cf016-61a5-4d5e-8229-de5c44f19a62/","title":"Pirates of the Caribbean","type":"MOVIE"},"CausesSupported:{\"uuid\":\"9b9c43b0-ea8e-45dd-bf3f-c9b632d6dcc2\"}":{"__typename":"CausesSupported","uuid":"9b9c43b0-ea8e-45dd-bf3f-c9b632d6dcc2","name":"The Smile Train","description":"\u003cp\u003eEveryone deserve to be confident and happy with what they see in the mirror.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e932b12e-123b-4fa8-a457-0967a3bf28c8\"}":{"__typename":"DeepDives","uuid":"e932b12e-123b-4fa8-a457-0967a3bf28c8","content":"\u003cp\u003eTry to pay attention to the moments in school where you lose track of time.\u003cbr\u003e\u003cbr\u003eI know that for a lot of young students, the idea that you will go to college and have to choose one thing to study can be daunting, and the decision seems impossible.\u003cbr\u003e\u003cbr\u003eWhile choosing what you want to study isn't a death sentence, you will probably be spending a lot of time with it in the future. Don't try to make yourself interested in something that you aren't. Instead, be honest, and try to recognize the ideas that you find your mind naturally drawn to.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"395f4ce7-affb-4e8b-8fc7-5d9649eee1fc\"}":{"__typename":"DeepDives","uuid":"395f4ce7-affb-4e8b-8fc7-5d9649eee1fc","content":"\u003cp\u003eEasily distracted!\u003cbr\u003e\u003cbr\u003eI always had a very hard time focusing in class, and a lot of my teachers didn't do a very good job of reaching me with their traditional lesson styles.\u003cbr\u003e\u003cbr\u003eSome of my teachers could recognize my passion, and could create hands on class environments that engaged me, and it was through them that I could realize my love of learning!\u003cbr\u003e\u003cbr\u003eLike many young student, I dreaded getting up to go to school in the morning. Something about the rigid schedule didn't agree with how my brain likes to function. But when I found a teacher that could really connect with me they became the highlight of my day. They would teach me plenty about the subject, but even more about my own learning style in general and how to be a lifelong learner.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"aec1a2c1-b1c5-4844-8a32-fd5779009843\"}":{"__typename":"DeepDives","uuid":"aec1a2c1-b1c5-4844-8a32-fd5779009843","content":"\u003cp\u003eDuring my years in college I often found myself entering various Game Jams in my free time. These are organized competitions where groups of developers band together to see what they can create in a short amount of time.\u003cbr\u003e\u003cbr\u003eThrough events like this I found myself at the center of a group of friends and talented developers who loved working together, and the experience was incredibly rewarding. Though I originally envisioned myself as just a competent programmer, I quickly fell into the niche of project manager, a role that many game jam teams would fall apart without.\u003cbr\u003e\u003cbr\u003eAlthough it never made it off the ground, creating Split Siege was an enlightening experience for me. It showed me how much I could accomplish on my own motivations, how rewarding it is to make friends with my teammates, and what my natural strengths are in a professional setting.\u003cbr\u003e \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"ed20ca72-a2a3-43bf-b1c6-52e2221bb34d\"}":{"__typename":"DeepDives","uuid":"ed20ca72-a2a3-43bf-b1c6-52e2221bb34d","content":"\u003cp\u003eMy dream started in the middle of the action, taking a chairlift up a giant ski mountain. Even though this is totally in my comfort zone, something was making me uneasy. \u003cbr\u003e\u003cbr\u003eTo my right was one of my best friends Andres, who couldn't look more excited to shred the slopes on the way down. \u003cbr\u003e\u003cbr\u003eAs we get off the lift, Andres takes off and it doesn't take long before I lose him entirely. I'm a very competent skiier, but for some reason my legs had turned to jelly.\u003cbr\u003e\u003cbr\u003eTotally lacking in confidence, I take off my skis, sit down on my butt, and slide down the mountain the whole way. When I get down to the bottom, Andres is laughing at me because I've torn a huge hole through the outer layer of my snow-pants. I could not have been more embarrassed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"4aaf601c-ec8a-4942-a68c-78b394a56004\"}":{"__typename":"School","uuid":"4aaf601c-ec8a-4942-a68c-78b394a56004","name":"Briarcliff High School","city":"Briarcliff Manor","type":"HIGH","state":"New York","country":"United States","zip":"10510"},"Education:{\"uuid\":\"4ab5e165-1459-4668-a6b9-982205a30664\"}":{"__typename":"Education","uuid":"4ab5e165-1459-4668-a6b9-982205a30664","school":{"__ref":"School:{\"uuid\":\"4aaf601c-ec8a-4942-a68c-78b394a56004\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}":{"__typename":"School","uuid":"0505e371-93af-4291-ab60-2728b5ad4443","name":"Northeastern University","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02115"},"Education:{\"uuid\":\"5ce42079-ed00-41c7-9909-da2c3118047b\"}":{"__typename":"Education","uuid":"5ce42079-ed00-41c7-9909-da2c3118047b","school":{"__ref":"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Computer Science and Game Development","degree":null},"MentorPublicProfile:{\"uuid\":\"daf2d0d6-a137-4175-8645-40fe31d97b90\"}":{"__typename":"MentorPublicProfile","uuid":"daf2d0d6-a137-4175-8645-40fe31d97b90","displayName":"Jonathan G.","slug":"jonathan-gold","biography":"\u003cp\u003eI've been playing board and video games for as long as I can remember. Literally! One of my earliest memories is from just before my 5th birthday, my older brother helped me make an account on a game called Runescape.\u003cbr\u003e\u003cbr\u003eWhen I got an opportunity to learn how to make a game it seemed like a no-brainer. After studying the variety of disciplines that go into game development, I became totally obsessed.\u003cbr\u003e\u003cbr\u003e7 years later, I've learned so much from so many mentors, became an expert programmer, worked on dozens of game projects ranging in size, and I'm now working full time at a game studio.\u003cbr\u003e\u003cbr\u003eIn the technical space, I'm proficient with Unity and Unreal Engine and graduated with a BS in Computer Science from Northeastern University. While I am most capable as a programming teacher, making games requires your passions to be strong and wide. If you sign up to work with me you can expect lots of lessons about Game Design, and some small tidbits on becoming your own game artist, audio engineer, and producer!\u003cbr\u003e\u003cbr\u003eWhile I'm not gaming some of my biggest hobbies include cooking and staying in shape. My frequent trips to the gym and skiing outings in the winter are the perfect way for me to take a break from whatever I've been working on and get out my excess energy. I was also born with a severe allergy to sesame, so I've taken up making my own versions of a lot of the take-out classics, especially Chinese food. Just like games, I feel like cooking a hearty meal for your friends and family and taking the time to chat and laugh is the best way to bring people together.\u003cbr\u003e\u003cbr\u003eGames are really a beautiful thing that have incredible power to teach and bring people together. I want to share my passion with as many people as possible.\u003c/p\u003e","teachingVideoPlaybackId":"dMWfMVPrYxkFxvRBRo3K9Ov02BmoHpAyO2WeZ3khSz00w","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBriarcliff Highschool Indoor Track and Field Teams \"Most Improved\" Athlete of 2015.\u003cbr\u003e\u003cbr\u003eOk more seriously it might be going from one of the slowest freshman on the track team, to winning the sectionals meet 200m dash and being invited to the statewide meet.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0c2cf22c-aa54-4e85-a6d9-2877c107edd7\"}"},{"__ref":"Favorites:{\"uuid\":\"5d77456a-a1fb-4879-87a6-1b6bbf376328\"}"},{"__ref":"Favorites:{\"uuid\":\"2f685e14-8ffd-4a8f-8422-b49a9398b165\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"9b9c43b0-ea8e-45dd-bf3f-c9b632d6dcc2\"}"}],"major":"Computer Science and Game Development","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e932b12e-123b-4fa8-a457-0967a3bf28c8\"}"},{"__ref":"DeepDives:{\"uuid\":\"395f4ce7-affb-4e8b-8fc7-5d9649eee1fc\"}"},{"__ref":"DeepDives:{\"uuid\":\"aec1a2c1-b1c5-4844-8a32-fd5779009843\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed20ca72-a2a3-43bf-b1c6-52e2221bb34d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/18687f05-907e-41d9-be7b-3ae1c6be0998/-/preview/-/format/jpg/","https://ucarecdn.com/a9b30ebb-ac86-4327-814f-aa18cff8aa06/-/preview/-/format/jpg/","https://ucarecdn.com/7917c7fb-9616-4b68-ab64-a7a7b3476d2a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4ab5e165-1459-4668-a6b9-982205a30664\"}"},{"__ref":"Education:{\"uuid\":\"5ce42079-ed00-41c7-9909-da2c3118047b\"}"}],"hiredAt":"2023-09-16T11:52:26.087Z","topics":[],"communityBadges":["https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jonathan-gold\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"daf2d0d6-a137-4175-8645-40fe31d97b90\"}"}}},"_sentryTraceData":"1e5263394d9e44388331ce8c1ad227ac-bebe20bd81ea0bc9-0","_sentryBaggage":"sentry-e
