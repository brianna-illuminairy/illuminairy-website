xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"469a429d-0933-434a-87d5-e23ed501cadd\"}":{"__typename":"DeepDives","uuid":"469a429d-0933-434a-87d5-e23ed501cadd","content":"\u003cp\u003eI chose my majors and minor because I’ve always been drawn to understanding both how the human body works \u003cem\u003eand\u003c/em\u003e how larger systems shape health. Biology gave me the scientific foundation I was looking for—I loved learning the mechanisms behind disease, the immune system, and how different systems in the body interact. At the same time, I knew I didn’t want to study science in a vacuum, which is what drew me to Global Health. That major allowed me to think more broadly about how factors like access to care, policy, environment, and socioeconomic conditions influence health outcomes across different communities and countries.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI added Gender \u0026amp; Sexuality Studies as a minor because I wanted to better understand how identity and lived experience shape people’s interactions with healthcare systems. This is also personal for me—members of my family are part of the LGBTQ+ community, and I’ve seen how identity can influence people’s experiences in medical spaces. That perspective pushed me to think more critically about disparities in care, patient advocacy, and what it means to provide inclusive, respectful healthcare.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ee668256-c99e-4ce2-b035-e774a28de4a0\"}":{"__typename":"DeepDives","uuid":"ee668256-c99e-4ce2-b035-e774a28de4a0","content":"\u003cp\u003eMy greatest role model has always been my grandfather, Arthur Frommer. He built his career from the ground up, creating a name for himself in the travel world through persistence, curiosity, and a belief that the world should be accessible to everyone—not just a privileged few. What I admire most about him isn’t just his success, but the mindset behind it. He faced real challenges early on and still chose to build something meaningful, practical, and impactful.\u003c/p\u003e\u003cp\u003eGrowing up, I was constantly surrounded by his perspective on the world. Travel, for him, wasn’t just about seeing new places—it was about understanding people, asking questions, and approaching unfamiliar situations with openness rather than fear. That mindset has shaped how I approach both my education and my work. Whether I’m studying global health, working in different communities, or mentoring students, I try to bring that same curiosity and respect for different lived experiences.\u003c/p\u003e\u003cp\u003eMore than anything, he showed me that you don’t have to follow a single, predefined path to build a meaningful career. You can create your own direction, stay true to your values, and make a real impact. That’s something I think about a lot in both my academic journey and my work with students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"90277ee5-ee48-45d6-9fb4-9c3374280deb\"}":{"__typename":"DeepDives","uuid":"90277ee5-ee48-45d6-9fb4-9c3374280deb","content":"\u003cp\u003eSomething that isn’t obvious about me at first is how much I love being outdoors—especially when it comes to more rugged, “unplugged” experiences like camping. Most people meet me in academic or city settings and assume I’m very indoorsy, but I actually really value getting completely away from that environment when I can.\u003c/p\u003e\u003cp\u003eI’ve spent time on trips where I’m hiking, camping, and living pretty simply—no constant phone access, no set schedule, just figuring things out as you go. I like the independence that comes with it and the way it forces you to be present and adaptable. It’s a very different pace from school and work, and I think it’s helped me become more grounded and flexible in other parts of my life too.\u003c/p\u003e\u003cp\u003eIt also ties into how I approach challenges. When you’re camping or outdoors for extended periods, things don’t always go according to plan—weather changes, logistics fall through, you have to problem-solve in real time. I’ve learned to stay calm, think practically, and adjust quickly, which is something I bring into both academics and mentoring.\u003c/p\u003e\u003cp\u003eI think that contrast—being very academically driven but also really valuing time spent outdoors and off the grid—is a big part of who I am, even if it’s not the first thing people notice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"3ebd9610-baf6-4b58-aacc-d2c87fc9123e\"}":{"__typename":"DeepDives","uuid":"3ebd9610-baf6-4b58-aacc-d2c87fc9123e","content":"\u003cp\u003eMy dream job is to become a physician. I’m drawn to medicine because it combines science, problem-solving, and working closely with people in a meaningful way. I’m especially interested in pediatrics and how clinical care connects with public health and community impact.\u003c/p\u003e\u003cp\u003eThat said, if medicine weren’t an option, I would open my own bakery. I love baking, and there’s something really special about making something that brings people joy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"fc7ba619-ca42-49ac-84fb-9f24675181ee\"}":{"__typename":"Education","uuid":"fc7ba619-ca42-49ac-84fb-9f24675181ee","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Global Health and Biology","degree":"BA"},"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}":{"__typename":"School","uuid":"2ff73c87-6442-482c-8d92-863dfb263ea0","name":"The Dalton School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"f65c0321-181b-4cce-8d58-9e2d3279c6fe\"}":{"__typename":"Education","uuid":"f65c0321-181b-4cce-8d58-9e2d3279c6fe","school":{"__ref":"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"1a1a1111-88f7-4b6b-b500-d40fb7f792d7\"}":{"__typename":"MentorPublicProfile","uuid":"1a1a1111-88f7-4b6b-b500-d40fb7f792d7","displayName":"Beatrix S.","slug":"beatrix-stewartfrommer","biography":"\u003cp\u003eHi! I’m Beatrix, and I’m originally from New York City. I grew up in a very musical family—both my parents and my sibling are musicians—but I ended up falling in love with science, global health, and understanding how the world works. That mix of creativity and curiosity still shapes how I learn and how I teach.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated from Northwestern University, where I studied Biology, Global Health, and Gender \u0026amp; Sexuality Studies, and I’m currently finishing my Master of Public Health (MPH) at Northwestern’s Feinberg School of Medicine. I have worked as an EMT, a Crisis Line Texter, and have acted as the head of the Evanston AFSP chapter. This fall, I’ll be starting medical school, with the goal of eventually going into pediatric surgery. I’m especially interested in how medicine connects with public health, community systems, and early life experiences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I’ve always loved combining science with real-world impact. I’ve done research on the interferon JAK-STAT pathway (a key part of the immune system), as well as projects focused on how positive and negative childhood experiences shape long-term mental health. I’ve also had the opportunity to take my interests abroad—working on a maternal health education project in Uganda and spending time in a children’s hospital in Ghana, where I helped with a project focused on improving care for kids recovering from severe malaria. Those experiences really shaped how I think about healthcare, equity, and working with communities. They also helped me win the Global Health Experience Award and receive a Public Health Scholars Scholarship.  \u003c/p\u003e\u003cbr\u003e\u003cp\u003eTeaching and mentorship have always been a huge part of my life. I’ve worked with students through programs like Learn To Be and Books \u0026amp; Breakfast, been a peer tutor, and served as both a peer advisor and New Member Director in my sorority. I genuinely love helping students figure out how they learn best—whether that’s breaking down tough science concepts, improving writing, preparing for presentations, or building confidence in school overall.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was heavily involved in Model UN, which sparked my love of public speaking, current events, and helping students learn how to think critically and communicate clearly. I’m always happy to work with students on presentations, debate-style thinking, or organizing their ideas.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I love staying active and creative: I play volleyball, run, bake, and spend time doing pottery and needlepoint. I also love to travel (my mom is a travel writer, so I grew up exploring new places), and I bring that curiosity and openness into how I approach learning and mentoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m a big believer that there’s no one “right” way to be a student. You can be interested in science \u003cem\u003eand\u003c/em\u003e the arts, academics \u003cem\u003eand\u003c/em\u003e extracurriculars, structure \u003cem\u003eand\u003c/em\u003e creativity. My goal as a mentor is to help you build confidence, find what excites you, and develop the tools to succeed in a way that actually works for you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re looking for someone who’s supportive, practical, and genuinely invested in your growth, I’d love to work together!\u003c/p\u003e","teachingVideoPlaybackId":"pMn2L7L2FcxsWQh702T8Ed4kU9waVlKdLGNWfE8N5Xp4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is my work on a pediatric health project in Ghana. I spent several weeks at a children’s hospital helping develop a pilot program focused on improving care for kids recovering from severe malaria after they were discharged. A lot of these children are at high risk of getting sick again, so the goal was to create a system that could actually work in that setting—something practical, not just theoretical.\u003c/p\u003e\u003cp\u003eWhat made it meaningful to me wasn’t just the academic side, but figuring out how to adapt ideas to a real-world environment. It meant listening to clinicians, understanding resource constraints, and thinking about what families could realistically manage once they left the hospital. It pushed me to think beyond textbooks and really consider what effective, equitable healthcare looks like.\u003c/p\u003e\u003cp\u003eI’m proud of it because it was the first time I saw something I worked on connect directly to patient care in a tangible way. It confirmed for me that this is the kind of work I want to keep doing—combining medicine, public health, and community-focused problem-solving.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Global Health and Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"469a429d-0933-434a-87d5-e23ed501cadd\"}"},{"__ref":"DeepDives:{\"uuid\":\"ee668256-c99e-4ce2-b035-e774a28de4a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"90277ee5-ee48-45d6-9fb4-9c3374280deb\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ebd9610-baf6-4b58-aacc-d2c87fc9123e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9138ae0b-aa28-40b9-b8bb-0dc9bc8e5a6c/-/preview/-/format/jpg/","https://ucarecdn.com/0efd7813-55b3-4f5a-a452-a6d53622fa9c/-/preview/-/format/jpg/","https://ucarecdn.com/edb8a720-0b58-44e2-95b1-4957377d2a0e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fc7ba619-ca42-49ac-84fb-9f24675181ee\"}"},{"__ref":"Education:{\"uuid\":\"f65c0321-181b-4cce-8d58-9e2d3279c6fe\"}"}],"hiredAt":"2026-05-01T18:49:35.777Z","topics":[],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"beatr
