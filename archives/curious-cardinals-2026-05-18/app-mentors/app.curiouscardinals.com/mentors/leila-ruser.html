xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"400e3c59-aa99-4a7e-a64c-26c5820dbbc4\"}":{"__typename":"Favorites","uuid":"400e3c59-aa99-4a7e-a64c-26c5820dbbc4","photoUrl":"https://ucarecdn.com/caaf02b6-9af8-4d7f-9018-d8e36befd168/","title":"The Stranger","type":"BOOK"},"Favorites:{\"uuid\":\"8e53b0d1-dedd-4f68-982f-86c39d1be309\"}":{"__typename":"Favorites","uuid":"8e53b0d1-dedd-4f68-982f-86c39d1be309","photoUrl":"https://ucarecdn.com/b756cdba-bdcb-4c09-8c61-a1e1aa490de5/","title":"Persepolis","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1bac7c93-a62c-4ca0-a32f-53f5cf456961\"}":{"__typename":"DeepDives","uuid":"1bac7c93-a62c-4ca0-a32f-53f5cf456961","content":"\u003cp\u003eI would tell my middle and high school self to be gentle on myself, and pursue my passions without self-consciousness. It is difficult to make sense of these very important experiences as they happen, but looking back, I am proud of everything I accomplished and the person I was.  It's OK  to be different, and your differences allow you to contribute to your community all the more! Never be ashamed of your interests or passions, even if they're unconventional. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"e5c8023c-4833-407d-90a7-89e91b407269\"}":{"__typename":"DeepDives","uuid":"e5c8023c-4833-407d-90a7-89e91b407269","content":"\u003cp\u003eI once dreamt that I had 30 cats living in my house! It was very loud, because they all were meowing at the same time. I love cats, so it was a pretty good dream, all things considered. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ba4de45e-3b59-448a-ab59-60779ca25cab\"}":{"__typename":"DeepDives","uuid":"ba4de45e-3b59-448a-ab59-60779ca25cab","content":"\u003cp\u003eMy greatest role models are my mother and grandmother. My grandmother was born in 1940s Iran, and was the first female doctor from her city. When she immigrated to America with my mother in 1984, they were fleeing war and oppression, and had to make new lives for themselves here. My mother also became a doctor, and has changed the lives of many veterans at our local Veteran's Hospital. Their stories never fail to inspire me to work hard, continue learning, and never take what I have for granted. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6432a5b8-621c-4b3e-923e-2e137b7e499e\"}":{"__typename":"DeepDives","uuid":"6432a5b8-621c-4b3e-923e-2e137b7e499e","content":null,"videoPlaybackId":"2b600zP4b9yNet9qNtkfZAApGhPj02ezedwYGnRALISjM","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"4b07ef42-819f-461f-9ee3-364ff16a926a\"}":{"__typename":"School","uuid":"4b07ef42-819f-461f-9ee3-364ff16a926a","name":"Guilford High School","city":"Guilford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06437"},"Education:{\"uuid\":\"5f8d5274-c736-4f45-bdce-a66ceea1347c\"}":{"__typename":"Education","uuid":"5f8d5274-c736-4f45-bdce-a66ceea1347c","school":{"__ref":"School:{\"uuid\":\"4b07ef42-819f-461f-9ee3-364ff16a926a\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b63e4cda-0471-4074-8eee-9c99086df8cb\"}":{"__typename":"School","uuid":"b63e4cda-0471-4074-8eee-9c99086df8cb","name":"Williams College","city":"Williamstown","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"01267"},"Education:{\"uuid\":\"7e46386f-5678-42be-9912-3d02b14169fa\"}":{"__typename":"Education","uuid":"7e46386f-5678-42be-9912-3d02b14169fa","school":{"__ref":"School:{\"uuid\":\"b63e4cda-0471-4074-8eee-9c99086df8cb\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Comparative Literature and History","degree":null},"MentorPublicProfile:{\"uuid\":\"6954aef1-8153-4909-978d-6e682d8485d8\"}":{"__typename":"MentorPublicProfile","uuid":"6954aef1-8153-4909-978d-6e682d8485d8","displayName":"Leila R.","slug":"leila-ruser","biography":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHello! My name is Leila Ruser, and I am a rising senior at Williams College, where I study Comparative Literature and History with a concentration in Middle Eastern studies. At Williams, I’m Co-President of the South West Asian North African Student Union, and help promote community amongst Middle Eastern students. I am also a member of the Middle Eastern Music Ensemble, where I play upright Bass and help select and arrange repertoire. I really value my identity as the daughter of a Persian immigrant, and these on-campus activities help me stay connected. Additionally, I love engaging with different cultures through collaborations with other cultural groups and my membership in Vive, the Latin performance group on campus, in which I also play upright bass. Finally, I sing, play guitar, and drum for a\u0026nbsp; student band. Since my first year in college, I’ve had the opportunity to play shows at gatherings and events on campus, which I find super fun! I also write and produce music, poetry and short fiction. I have won awards for my poetry at a local and regional level, and I love reading other people’s writing as well.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have worked as a Teaching Assistant for History of the Modern Middle East, and I have been a writing tutor since my sophomore fall. These professional experiences have really reinforced my love of mentoring and teaching, and I am incredibly excited to work with students on both passion projects and any area they might want to grow within. Last summer, I had two very important experiences working with non-profit organizations: Physicians for Human Rights, an international human rights advocacy group, and Connecticut Veterans Legal Center, which provides free legal aid for veterans in need. Both of these experiences taught me to maintain strong personal organizational skills, as well as cater to the needs of a situation – especially when timing is important and when working with others. This summer, I will continue my non-profit work with the Forest Foundation, working to achieve social justice across communities. Alongside social justice, mentoring is another passion of mine, as I believe that it helps everyone achieve their potential. I would be honored to help students achieve their own goals, regardless of what those might look like.\u003c/p\u003e","teachingVideoPlaybackId":"ZnVPyDcqiVXtAGdirRMbmk00rXivlxXmHpkWsgj4gDXc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThis year, I put out my very first album alongside my band. It took a lot of work; it allowed me to learn new skills and enhance some I already had. This experience taught me a lot about recording, producing, and marketing, and it was an incredible opportunity to express my passion for music.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"400e3c59-aa99-4a7e-a64c-26c5820dbbc4\"}"},{"__ref":"Favorites:{\"uuid\":\"8e53b0d1-dedd-4f68-982f-86c39d1be309\"}"}],"causesSupported":[],"major":"Comparative Literature and History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1bac7c93-a62c-4ca0-a32f-53f5cf456961\"}"},{"__ref":"DeepDives:{\"uuid\":\"e5c8023c-4833-407d-90a7-89e91b407269\"}"},{"__ref":"DeepDives:{\"uuid\":\"ba4de45e-3b59-448a-ab59-60779ca25cab\"}"},{"__ref":"DeepDives:{\"uuid\":\"6432a5b8-621c-4b3e-923e-2e137b7e499e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/712d0cde-451e-45dd-a104-276182c24229/-/preview/-/format/jpg/","https://ucarecdn.com/a7c2ab7e-2352-41ef-baa7-170f2c030b5d/-/preview/-/format/jpg/","https://ucarecdn.com/a63d180f-387b-4153-8f21-ecb658ca1c0c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5f8d5274-c736-4f45-bdce-a66ceea1347c\"}"},{"__ref":"Education:{\"uuid\":\"7e46386f-5678-42be-9912-3d02b14169fa\"}"}],"hiredAt":"2026-04-07T18:08:16.638Z","topics":["Writing","History","Reading","College Essay Writing","Executive Function","Academic Coaching","K-6 Storybook","Creative Writing","Music","Fashion / Cosmetics","Film / Theater","History Project","Law / Government / Policy","Journalism","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"leila-ruser\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6954aef1-8153-4909-978d-6e682d8485d8\"}"}}},"_sentryTraceData":"8b3d18a6a9fb449e9124f92efc4e7dee-bcd94b277fb8feac-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8b3d18a6a9fb449e9124f92efc4e7dee,sentry-sample_rate=0.2,s
