xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5373c512-00ee-471d-ae28-836db4f86f63\"}":{"__typename":"Favorites","uuid":"5373c512-00ee-471d-ae28-836db4f86f63","photoUrl":"https://ucarecdn.com/4fe45393-7e9e-4f54-9946-84c416de7ea7/","title":"Tokyo","type":"CITY"},"Favorites:{\"uuid\":\"f3c2d6b3-f1b2-4579-9994-a969ea36edfd\"}":{"__typename":"Favorites","uuid":"f3c2d6b3-f1b2-4579-9994-a969ea36edfd","photoUrl":"https://ucarecdn.com/5f89ba56-ddfc-4837-a567-b8e5f54b56d9/","title":"Washington Commanders","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"e8709f8f-4eaa-412e-b59e-9c957318c6e8\"}":{"__typename":"Favorites","uuid":"e8709f8f-4eaa-412e-b59e-9c957318c6e8","photoUrl":"https://ucarecdn.com/cfa1853f-37f1-43ff-b759-cd9f39d4c8c7/","title":"Half of a Yellow Sun","type":"BOOK"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"721edc05-6b14-4796-b118-1d3210cfed5e\"}":{"__typename":"DeepDives","uuid":"721edc05-6b14-4796-b118-1d3210cfed5e","content":"\u003cp\u003eMy greatest role model is my great-grandmother. Born a sharecropper in South Carolina, she migrated to redlined inner-city D.C. as a teenager, where she raised five daughters on her own, working odd jobs to make ends meet. Despite not having the chance to finish the eighth grade, she instilled in her children the importance of education and the drive to strive for better opportunities.\u003c/p\u003e\u003cp\u003eWhat makes her so remarkable isn’t just her resilience in the face of adversity but her ability to embrace life with love and joy, no matter the circumstances. Some of my fondest memories are of dancing with her, moments that showed me the power of finding light even in tough times. She set a tone of strength, ambition, and hope that carried through to my grandmother, my mother, and now to me.\u003c/p\u003e\u003cp\u003eWithout her example, the achievements my family has reached—education, professional success, and the pursuit of dreams—would not have been possible. She remains a constant reminder to me that circumstances don’t define you; your attitude and values do. Her legacy continues to inspire me to face challenges with grace, seek knowledge, and always find joy in the journey.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"b9fb605e-a947-4573-804a-fd7d666c6fab\"}":{"__typename":"DeepDives","uuid":"b9fb605e-a947-4573-804a-fd7d666c6fab","content":"\u003cp\u003eOne of my favorite passion projects was during high school when my best friend and I teamed up to develop games on Roblox. We took on everything ourselves—coding, creating assets, designing the games, managing advertising, and even networking with other amateur developers. While we didn’t achieve the level of success we initially dreamed of, the experience was incredibly rewarding because it allowed us to bring our ideas to life and share them with friends. Some of my best memories are of us playing those games together, enjoying worlds we had imagined and built ourselves.\u003c/p\u003e\u003cp\u003eGame development wasn’t easy, especially since we were learning everything through trial and error. Coding was often challenging, and figuring out how to solve problems required creativity, persistence, and a willingness to fail and try again. But that process was part of the fun. We spent countless hours refining our skills and pushing through obstacles, especially during the pandemic when we had more time to dedicate to it.\u003c/p\u003e\u003cp\u003eLooking back, the journey taught me a lot about teamwork, problem-solving, and the value of perseverance. Even though the project didn’t reach the heights we’d hoped for, the experience itself was invaluable and remains a highlight of my creative journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b37475cf-991e-48f6-9fd8-5ef2e5bc4b50\"}":{"__typename":"DeepDives","uuid":"b37475cf-991e-48f6-9fd8-5ef2e5bc4b50","content":"\u003cp\u003eIf I could give my middle or high school self some advice, I’d start by telling him to worry less—especially about things like the beard, which, I promise, you’ll get someday. It won’t be great, but its definitely there!\u003c/p\u003e\u003cp\u003eOn a more serious note, I’d remind him that the hard work he’s putting in now is planting seeds for trees that he won’t get to sit under the shade of until much later. It’s easy to get caught up in the day-to-day and feel like the effort doesn’t matter, but those small, consistent actions add up. I’d also tell him not to take that responsibility lightly because, when I got to college, I struggled more than I needed to. I had to make major adjustments to my academic strategies because, looking back, I didn’t develop the best habits early on.\u003c/p\u003e\u003cp\u003eThe most important thing I’d say is that there’s no substitute for building strong foundations early—whether that’s in academics, work ethic, or just life in general. Start building those habits now, because they’ll pay off later in ways you won’t fully understand until you’re in the thick of it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"bcd434f6-10d5-49b8-836f-3839514c22ce\"}":{"__typename":"DeepDives","uuid":"bcd434f6-10d5-49b8-836f-3839514c22ce","content":"\u003cp\u003eBeing Black and a descendant of American slaves. I understand firsthand the unique challenges Black students often face in academic environments, from systemic barriers to underrepresentation and the feelings of isolation or doubt that can come with being in predominantly white spaces. These experiences have shaped my approach to teaching in ways that prioritize building confidence, promoting inclusivity, and creating a supportive learning environment.\u003c/p\u003e\u003cp\u003eI strive to be not just a mentor, but also a role model—someone who shows students that their backgrounds and identities are not obstacles, but strengths. I make it a point to celebrate diverse perspectives and ensure that students feel seen and valued in my sessions. I approach every interaction with patience and understanding, recognizing that academic struggles can sometimes stem from external pressures.\u003c/p\u003e\u003cp\u003eOne key element of my teaching style is breaking down complex concepts into relatable terms, drawing on real-world examples that resonate with my students’ experiences. I also emphasize the importance of self-advocacy and resilience, encouraging students to ask questions, seek support, and believe in their potential. My goal is to empower Black students—and all students—to navigate academic challenges with confidence and to see education as a tool for opportunity and growth.\u003c/p\u003e\u003cp\u003eMy ethnic identity informs my belief in the transformative power of education. It drives me to create spaces where every student can succeed, not in spite of their background, but because of the unique strengths and perspectives said background can bring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"0fe8db0d-4ece-4b2d-af86-9d4b833f28a3\"}":{"__typename":"School","uuid":"0fe8db0d-4ece-4b2d-af86-9d4b833f28a3","name":"Reservoir High School","city":"Fulton","type":"HIGH","state":"Maryland","country":"United States","zip":"20759"},"Education:{\"uuid\":\"845d4fa2-ceff-440b-9da3-03c47348eed2\"}":{"__typename":"Education","uuid":"845d4fa2-ceff-440b-9da3-03c47348eed2","school":{"__ref":"School:{\"uuid\":\"0fe8db0d-4ece-4b2d-af86-9d4b833f28a3\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"97e37e52-2b5c-4a61-8c01-3c4d5a9c5af1\"}":{"__typename":"Education","uuid":"97e37e52-2b5c-4a61-8c01-3c4d5a9c5af1","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Management Science \u0026 Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"75d98ee0-d48b-45b2-bc99-bb43bd27f78c\"}":{"__typename":"MentorPublicProfile","uuid":"75d98ee0-d48b-45b2-bc99-bb43bd27f78c","displayName":"Anwar P.","slug":"anwar-perry","biography":"\u003cp\u003eHey, I’m Anwar! Education has always been a big part of my life—I come from a family of lifelong learners, with a writer and professor as one grandparent and a mathematician as the other. Not to mention my father, who is an engineer, and my former Wall Street banker mom. It’s safe to say I’m familiar with managing high academic expectations. That background inspired my own academic journey. I’m currently a senior at Stanford University, studying Management Science and Engineering with a concentration in Finance and Decision, and pursuing a minor in math.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my time at Stanford, I’ve gained valuable experience through internships in consulting, where I’ve honed my problem-solving and analytical skills by working on complex, real-world challenges. After graduation, I’m excited to join a major consulting firm, where I’ll continue to tackle impactful projects and help organizations make data-driven decisions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver the years, I’ve worn many hats. I’m a two-time National Latin Exam gold medalist, a Howard County Executive Political Science Award recipient, a former Roblox game developer, a basketball referee, and now a Curious Cardinals mentor. Outside of academics and work, I enjoy playing basketball and flag football, traveling and exploring new cultures with friends, and doing genealogical research. You might also catch me enjoying grand strategy video games (EU4, HoI4, Crusader Kings), anime (DBZ is my all-time favorite), watching NFL football (Hail to the Commanders!), reading historical fiction novels (especially war-themed ones), or listening to music (rap and R\u0026amp;B are my go-to genres) in my downtime.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I strive to combine my love for learning with a commitment to helping others succeed. I know how important it is to have someone who can break down challenging topics into something understandable and relatable. Whether it’s math, Latin, or simply figuring out how to tackle tough problems, I’m here to support you every step of the way. Let’s work together to achieve your goals!\u003c/p\u003e","teachingVideoPlaybackId":"mx024Rz1nlbTfvxYuZ2OI00UpXvZIhiHeIV7c6GAN79WQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGetting to walk the high school graduation stage in front of my grandmother. Seeing the pride on her face as I her oldest grandchild came to her seat diploma in hand.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5373c512-00ee-471d-ae28-836db4f86f63\"}"},{"__ref":"Favorites:{\"uuid\":\"f3c2d6b3-f1b2-4579-9994-a969ea36edfd\"}"},{"__ref":"Favorites:{\"uuid\":\"e8709f8f-4eaa-412e-b59e-9c957318c6e8\"}"}],"causesSupported":[],"major":"Management Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"721edc05-6b14-4796-b118-1d3210cfed5e\"}"},{"__ref":"DeepDives:{\"uuid\":\"b9fb605e-a947-4573-804a-fd7d666c6fab\"}"},{"__ref":"DeepDives:{\"uuid\":\"b37475cf-991e-48f6-9fd8-5ef2e5bc4b50\"}"},{"__ref":"DeepDives:{\"uuid\":\"bcd434f6-10d5-49b8-836f-3839514c22ce\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/43120951-5b96-4395-a0f3-9b23d4de04d3/-/preview/-/format/jpg/","https://ucarecdn.com/258d388f-6c26-46af-b856-cfbcdefe57ee/-/preview/-/format/jpg/","https://ucarecdn.com/5cf61004-3299-49bf-8a3b-939a3d17c5fa/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"845d4fa2-ceff-440b-9da3-03c47348eed2\"}"},{"__ref":"Education:{\"uuid\":\"97e37e52-2b5c-4a61-8c01-3c4d5a9c5af1\"}"}],"hiredAt":"2024-12-17T11:34:56.870Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Biology","Chemistry","6-8 Grade Science","Writing","Spanish","Latin","College Essay Writing","Economics","Computer Science","Academic Coaching","Executive Function","History"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anwar-perry\"}})":{"__ref":"MentorPublicProfile:{\"u
