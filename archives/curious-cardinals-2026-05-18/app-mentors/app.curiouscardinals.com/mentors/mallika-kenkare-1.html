xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"5300aa5f-f9c5-4240-87a1-d0689a9a4609\"}":{"__typename":"DeepDives","uuid":"5300aa5f-f9c5-4240-87a1-d0689a9a4609","content":"\u003cp\u003eMy dream job is to be a small animal veterinarian, and potentially own my own business. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"f31d45c4-0900-4e11-bae1-618e81dea0bb\"}":{"__typename":"DeepDives","uuid":"f31d45c4-0900-4e11-bae1-618e81dea0bb","content":"\u003cp\u003eAs an Indian-American, I grew up in a culture that emphasizes grades and academic achievement. For much of my school career, I believed that grades defined my worth, and it’s taken time and effort to separate my self-worth from academic performance. I’ve come to see learning as the process of gaining skills and knowledge, with true success being measured by the effort I put in and the understanding I gain, rather than the grade itself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"bdb8f313-aca8-427b-a796-979563c4d390\"}":{"__typename":"DeepDives","uuid":"bdb8f313-aca8-427b-a796-979563c4d390","content":"\u003cp\u003eMy mother is my greatest source of inspiration. She is an engineer who immigrated to the United States at just 20 years old, navigating a new culture and career with resilience and determination. Her kindness and intelligence have always inspired me, and she has instilled in my sister and I the importance of knowledge, the courage to stand up for our beliefs, and the confidence to pursue our dreams wholeheartedly. She embodies the strength and compassion I strive to mirror every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"deac5b8b-778f-40b7-9117-a9da7eb3e44d\"}":{"__typename":"DeepDives","uuid":"deac5b8b-778f-40b7-9117-a9da7eb3e44d","content":"\u003cp\u003eIn my spare time, I enjoy what I like to call “food for the soul.” I love cooking and often find myself scrolling through New York Times recipes, trying out new dishes for my roommates, who serve as my enthusiastic taste-testers. I’ve played lacrosse since I was 10, and I currently play on Duke’s Club Lacrosse team. The teammates I’ve met there continually remind me why I love the sport and the sisterhood it brings. Whenever possible, I volunteer at local animal shelters and the Duke Lemur Center, helping with tasks like cleaning, laundry, and dishes—anything I can do to support the animals and the staff who care for them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"1e5635a4-ae4b-40e2-a6f8-149c4e3abdce\"}":{"__typename":"School","uuid":"1e5635a4-ae4b-40e2-a6f8-149c4e3abdce","name":"Chattahoochee High School","city":"Alpharetta","type":"HIGH","state":"GA","country":"United States","zip":"30022-7917"},"Education:{\"uuid\":\"98e4306c-aa93-428a-a084-19aebd815de1\"}":{"__typename":"Education","uuid":"98e4306c-aa93-428a-a084-19aebd815de1","school":{"__ref":"School:{\"uuid\":\"1e5635a4-ae4b-40e2-a6f8-149c4e3abdce\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"b705e3ac-0837-4752-9f31-8749f30cb0cd\"}":{"__typename":"Education","uuid":"b705e3ac-0837-4752-9f31-8749f30cb0cd","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"d67f5370-c80c-4acd-b583-8e3fa84838ad\"}":{"__typename":"MentorPublicProfile","uuid":"d67f5370-c80c-4acd-b583-8e3fa84838ad","displayName":"Mallika K.","slug":"mallika-kenkare-1","biography":"\u003cp\u003eI’m a Biology major with a minor in Education at Duke University, where I’m passionate about blending science and teaching. I have always loved working with animals, and I plan to attend vet school after graduating and pursue a career as a small animal veterinarian. It is important to me to bring a different perspective to learning, one beyond just grades. Beyond academics, I’m involved on campus as the treasurer and player on the club lacrosse team, a volunteer at the Duke Lemur Center, and a barista at our campus coffee shop. In my free time, I enjoy cooking, dancing, and exploring new places. I’m excited to help students find joy in learning!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology","deepDives":[{"__r
