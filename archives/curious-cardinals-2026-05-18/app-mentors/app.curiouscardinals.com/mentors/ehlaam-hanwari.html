xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"bb09e68c-b1a1-4039-a3a5-e82c6121e64f\"}":{"__typename":"DeepDives","uuid":"bb09e68c-b1a1-4039-a3a5-e82c6121e64f","content":"\u003cp\u003eI’d tell myself to worry less about what other people think- but in a realistic way. People do notice things. They have opinions. That’s normal.\u003c/p\u003e\u003cp\u003eWhat I wish I’d understood earlier is that no one is spending that much time thinking about you. Everyone goes home focused on their own stuff- their problems, their plans, their insecurities. The moments that feel awkward or embarrassing to you usually matter far less to everyone else than you think.\u003c/p\u003e\u003cp\u003eOnce I started to get that, it became easier to take small risks. To ask questions, try new things, and go after what I actually cared about without overthinking how it would look. You don’t need everyone’s approval to move forward. You just need to be okay with not getting it.\u003c/p\u003e\u003cp\u003eSo I’d tell my younger self this: be kind and respectful, but don’t let the fear of being judged stop you from doing things you’re curious about. Most people are busy figuring out their own lives. You might as well use that to your advantage and try.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"14b5a355-c648-4eeb-9053-fd44d7300a5b\"}":{"__typename":"School","uuid":"14b5a355-c648-4eeb-9053-fd44d7300a5b","name":"Apeejay School - Nerul","city":"Navi Mumbai","type":"HIGH","state":"Maharashtra","country":"India","zip":"400706"},"Education:{\"uuid\":\"b9d417a2-6ca5-40ce-9cce-346681a331a6\"}":{"__typename":"Education","uuid":"b9d417a2-6ca5-40ce-9cce-346681a331a6","school":{"__ref":"School:{\"uuid\":\"14b5a355-c648-4eeb-9053-fd44d7300a5b\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"a9b828a7-f8f9-4da2-aeff-e33f1e2e9493\"}":{"__typename":"Education","uuid":"a9b828a7-f8f9-4da2-aeff-e33f1e2e9493","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2025","major":"Engineering Management","degree":null},"MentorPublicProfile:{\"uuid\":\"314f201d-dcc0-40ad-90db-fc6852284993\"}":{"__typename":"MentorPublicProfile","uuid":"314f201d-dcc0-40ad-90db-fc6852284993","displayName":"Ehlaam H.","slug":"ehlaam-hanwari","biography":"\u003cp\u003eI’ve always been interested in how people learn, not in a big, theoretical way, but in the everyday moments when something finally clicks!\u003cbr\u003e\u003cbr\u003eI’m curious about why certain explanations make people feel confident while others make them shut down, and how much learning depends on feeling comfortable enough to ask questions in the first place.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI recently graduated from Cornell University with a Master’s in Engineering Management. My background is technical, but the parts of my work I’ve enjoyed most have always been about communication and clarity. I like taking ideas that feel complicated or intimidating and breaking them down in ways that feel manageable. Whether it was explaining a system, talking through a problem with a teammate, or helping someone work through something they were unsure about, I’ve learned that learning goes a lot better when it feels approachable.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of coursework, I’ve spent time working on hands-on projects and early-stage ideas where learning happened through trial and error. Things didn’t work the first time, and often didn’t work the second time either. Those experiences taught me that being confused isn’t a bad thing; it’s usually just part of figuring something out. When people are allowed to experiment, ask questions, and try again without pressure, learning becomes a lot less stressful and a lot more engaging.\u003c/p\u003e\u003cp\u003eThat’s one of the reasons Curious Cardinals really stood out to me. I appreciate learning environments that don’t rush people toward the “right” answer, but instead encourage curiosity and exploration. I think kids learn best when they feel okay being unsure, when they can try things out, and when asking “why” is encouraged instead of rushed past. Those early experiences matter- they shape how someone feels about learning long after the lesson is over.\u003c/p\u003e\u003cp\u003eI’m especially interested in helping make learning feel less intimidating and more human- something you can participate in, not something you’re constantly being evaluated on. I care about kindness, clarity, and creating spaces where curiosity is supported rather than shut down.\u003c/p\u003e\u003cp\u003eIn my free time, I enjoy reading, writing, reflecting, and following soccer and F1! \u003cbr\u003eI'd love to be a part of an environment that takes learning seriously while still making it feel enjoyable :)\u003c/p\u003e","teachingVideoPlaybackId":"XhkBHx5jGzukEDzH9q4HKdCkQLtPPZb5FIzFSsfbCS8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am the co-founder of a healthtech startup called the Deticktor, which was born out of a little weekend competition during graduate school :) Feel free to check it out- deticktor.com !\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Engineering Management","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bb09e68c-b1a1-4039-a3a5-e82c6121e64f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/578c4f9b-8706-4a04-986b-aecb6e9649f3/-/preview/-/format/jpg/","https://ucarecdn.com/4d58b794-f59d-4ba8-a323-7ac70bb65ecd/-/preview/-/format/jpg/","https://ucarecdn.com/05b8b6df-8f49-4ad0-95f2-cccb7d722a68/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b9d417a2-6ca5-40ce-9cce-346681a331a6\"}"},{"__ref":"Education:{\"uuid\":\"a9b828a7-f8f9-4da2-aeff-e33f1e2e9493\"}"}],"hiredAt":"2026-01-28T16:50:21.670Z","topics":["K-5 Grade Math","6-8 Grade Science","Writing","Reading","K-6 Storybook","Business / Entrepreneurship","Machine Learning / AI","Debate"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ehlaam-hanwari\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"314f201d-dcc0-40ad-90db-fc6852284993\"}"}}},"_sentryTraceData":"5d481421e8574e60adc7bf2e4bc96bc8-9d31fac3905708cc-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=5d481421e8574e60adc7bf2e4bc96bc8,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ehlaam-hanwari"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElem
