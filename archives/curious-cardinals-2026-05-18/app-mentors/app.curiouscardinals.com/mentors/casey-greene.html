xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"dca58364-1516-4c4f-90df-c4b229098c5a\"}":{"__typename":"Favorites","uuid":"dca58364-1516-4c4f-90df-c4b229098c5a","photoUrl":"https://ucarecdn.com/ddf4b78f-09e6-4831-9df1-544a125fe41d/","title":"Ctrl by Sza","type":"ALBUM"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"511f15c7-0b0e-4614-acd7-bdcc7265a78b\"}":{"__typename":"DeepDives","uuid":"511f15c7-0b0e-4614-acd7-bdcc7265a78b","content":"\u003cp\u003eIn high school, I've had various different mentoring experiences, and through all of them, I've loved being able to share tips and tricks that I wish I would have known about as a student. I've also learned a tremendous amount from each student. For example, when I mentored for the middle school jazz band, I showed Sarah how to add her own improvised flare to her saxophone solo, and she destroyed it on stage! During our time together, she also showed me a cool new way to play the G sharp that I had no idea about. When mentoring for the newcomer program at my high school, I taught José how to graph x-intercepts by looking at a factored equation, and he taught me a ton of Spanish slang. I look forward to building a relationship with each new student that I have the privilege to mentor, because I'm so excited to share the things that I've learned with them, and even more eager to see what they have to teach me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e767c9dd-8af6-4ec3-9db0-abc67dfd5d52\"}":{"__typename":"DeepDives","uuid":"e767c9dd-8af6-4ec3-9db0-abc67dfd5d52","content":"\u003cp\u003eGo for morning runs, ride horses, play soccer, and try new sweet treats! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9b4fae0c-4844-4e76-b594-da3a58e6bc80\"}":{"__typename":"School","uuid":"9b4fae0c-4844-4e76-b594-da3a58e6bc80","name":"Carrboro High School","city":"Carrboro","type":"HIGH","state":"North Carolina","country":"United States","zip":"27510"},"Education:{\"uuid\":\"52a2c58d-fe0e-4e8f-93b9-f3289e54cb30\"}":{"__typename":"Education","uuid":"52a2c58d-fe0e-4e8f-93b9-f3289e54cb30","school":{"__ref":"School:{\"uuid\":\"9b4fae0c-4844-4e76-b594-da3a58e6bc80\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"c60bf271-fa79-4908-87b9-62eb6a872e58\"}":{"__typename":"Education","uuid":"c60bf271-fa79-4908-87b9-62eb6a872e58","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"b806d6f5-a11a-4f4f-a1e0-c11c66ca02df\"}":{"__typename":"MentorPublicProfile","uuid":"b806d6f5-a11a-4f4f-a1e0-c11c66ca02df","displayName":"Casey G.","slug":"casey-greene","biography":"\u003cp\u003eHello! I am currently a freshman at Stanford University, and I intend to pursue a major in Biology, potentially on a pre-veterinary track. Academically, I have several areas of interest, but I've always been drawn to biology and chemistry. I find that with each class, I discover another 'secret' about why the world works the way it does. Conveniently, these subjects align with my passion for animals. Growing up as a competitive equestrian, I love anything that has to do with horses. In high school, I worked as a veterinary technician for an equine mobile vet, where my curiosity was able to grow and flourish through exciting hands-on cases. While stressful at times, I loved being able to help relieve each patient's pain and gained a unique window into the medical aspects of treatment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBesides biology, I am also planning to minor in Spanish. I've grown up attending bilingual schools, and I couldn't imagine life without it. I believe that learning a new language not only enhances our communication skills, but also allows us to experience another culture, which in turn creates ties and relationships that wouldn't have formed otherwise.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I am on the Stanford Equestrian Team and the women's club soccer team. I'm also a jazz enthusiast (currently on a tenor saxophone hiatus). On the weekends, my friends and I are slowly working through a bucket list of cafes and restaurants in the area, as we all love to try new foods!\u003c/p\u003e","teachingVideoPlaybackId":"IPiXYZmUzpIRkJ00o6SqPPs3bwgunul6GB3h01aH1AVeY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"dca58364-1516-4c4f-90df-c4b229098c5a\"}"}],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"511f15c7-0b0e-4614-acd7-bdcc7265a78b\"}"},{"__ref":"DeepDives:{\"uuid\":\"e767c9dd-8af6-4ec3-9db0-abc67dfd5d52\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9de7d3f3-4c5b-4b0b-aa15-9991cc077c1c/-/preview/-/format/jpg/","https://ucarecdn.com/952d22d6-4ab0-4de0-9f42-6abef8f0bb20/-/preview/-/format/jpg/"]
