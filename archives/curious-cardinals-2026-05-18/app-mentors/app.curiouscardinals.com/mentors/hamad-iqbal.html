xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"895a1af4-8e08-470f-b35c-2089496929c5\"}":{"__typename":"DeepDives","uuid":"895a1af4-8e08-470f-b35c-2089496929c5","content":"\u003cp\u003eDon't be afraid to try and fail. I remember being hesitant to join the Stanford Solar Car Project as a freshman, thinking I didn’t have the experience needed. The same went for my role as project manager for the Woods Institute for the Environment, where I had no prior experience leading such a major project. But those experiences taught me that stepping outside my comfort zone and embracing failure as a learning opportunity was key to growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6cd1f0fb-bae2-4259-aec9-4271220a7391\"}":{"__typename":"DeepDives","uuid":"6cd1f0fb-bae2-4259-aec9-4271220a7391","content":"\u003cp\u003eGrowing up in a family with very little, I never had anyone encouraging me to explore my passions or push me beyond my limits. I want to be the person I didn’t have—someone who helps students explore their potential, guides them, and encourages them to chase their ambitions. I’ve tutored students in various subjects, including being a reading buddy for kids who were falling behind, and I found that meeting them on their level—just as a regular person, not a teacher—was the best way to build a trusting relationship and help them succeed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a47bc519-78ba-4941-a8ea-13ea8d2d4efc\"}":{"__typename":"DeepDives","uuid":"a47bc519-78ba-4941-a8ea-13ea8d2d4efc","content":"\u003cp\u003eI chose mechanical engineering because it’s the 'mother' of all engineering disciplines—there’s so much you can do with it. Whether it’s building rockets, cars, or solving problems across a range of industries, mechanical engineering allows me to apply diverse skills and work in fields that intersect with electrical engineering and computer science. The versatility and potential impact of this field is what inspired me to pursue it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8e0fd5a0-ced2-4b04-b547-5e1c1c9dc535\"}":{"__typename":"DeepDives","uuid":"8e0fd5a0-ced2-4b04-b547-5e1c1c9dc535","content":"\u003cp\u003eI hope to help bridge the gap between advanced engineering and underserved communities. I’ve seen firsthand how access to technology and education can change lives, especially in communities that are typically left behind. My goal is to bring engineering solutions that help improve lives, whether through clean energy solutions, robotics, or other technologies that are scalable and accessible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"358df89c-91ae-4b66-9214-0ac2e09e347a\"}":{"__typename":"School","uuid":"358df89c-91ae-4b66-9214-0ac2e09e347a","name":"Kingsway Park High School","city":"Rochdale","type":"HIGH","state":"England","country":"United Kingdom","zip":"OL16 4XA"},"Education:{\"uuid\":\"0d192cee-6e90-4cb0-9f5c-a7e2dc69d2bd\"}":{"__typename":"Education","uuid":"0d192cee-6e90-4cb0-9f5c-a7e2dc69d2bd","school":{"__ref":"School:{\"uuid\":\"358df89c-91ae-4b66-9214-0ac2e09e347a\"}"},"startYear":"2014","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"704bd8d4-9d53-4b3e-afa6-1b50c383cc08\"}":{"__typename":"Education","uuid":"704bd8d4-9d53-4b3e-afa6-1b50c383cc08","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"2ac82473-32c5-4a54-b616-128070fca2f6\"}":{"__typename":"MentorPublicProfile","uuid":"2ac82473-32c5-4a54-b616-128070fca2f6","displayName":"Hamad I.","slug":"hamad-iqbal","biography":"\u003cp\u003eHi there! I’m Hamad, a recent Mechanical Engineering graduate from Stanford University, passionate about solving real-world problems through engineering. I specialize in robotics, product design, and sustainability, and I’m excited to use my skills to create impactful solutions that make a difference in the world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my time at Stanford, I’ve had the chance to work on some incredible projects that have shaped my approach to engineering. One standout project was leading the development of an automatic coal feeder system for brick kilns in Bangladesh, as part of my role at the Stanford Woods Institute for the Environment. This project aimed to reduce emissions by 75%, improve worker safety, and reduce the incidence of pollution-related diseases, showing me how engineering can drive meaningful social and environmental change. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, I’ve worked on projects like a thermally actuated soft robot butterfly and a haptic maze, where I was able to apply my knowledge of robotics to solve complex, hands-on challenges. These experiences gave me a deeper appreciation for how technology can enhance our understanding of the world while solving practical issues.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my academic and research work, I’ve gained valuable industry experience working on the Stanford Solar Car Project. As part of the team, I helped design mechanical components, build prototypes, and validate our designs through rigorous testing. This project not only refined my technical abilities but also taught me the importance of teamwork and collaboration across various engineering disciplines.\u003c/p\u003e\u003cp\u003eOutside of my academic and professional work, I’m a huge fan of football (real football, not American football!) and cricket. Playing and following these sports has taught me valuable life lessons about teamwork, resilience, and strategy, all of which have translated into my work as an engineer. I believe these skills are just as crucial in the lab as they are on the field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve also had the privilege of tutoring local high school students in math and science. Helping them develop their problem-solving skills and guiding them through exciting projects has been incredibly rewarding. I’m passionate about inspiring the next generation of engineers, showing them the value of creativity, persistence, and hands-on learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith my strong foundation in mechanical engineering, a passion for robotics, and experience in product design, I’m confident in my ability to make a meaningful contribution to any project I take on. I’m eager to continue learning and growing in this field, and I look forward to working with students who share my curiosity and excitement for engineering.\u003c/p\u003e","teachingVideoPlaybackId":"Ci9UdDQ31aN01OSzqbZnk9ghqPKvX2cxy1wYI3xNTMrQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"895a1af4-8e08-470f-b35c-2089496929c5\"}"},{"__ref":"DeepDives:{\"uuid\":\"6cd1f0fb-bae2-4259-aec9-4271220a7391\"}"},{"__ref":"DeepDives:{\"uuid\":\"a47bc519-78ba-4941-a8ea-13ea8d2d4efc\"}"},{"__ref":"DeepDives:{\"uuid\":\"8e0fd5a0-ced2-4b04-b547-5e1c1c9dc535\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/730297b5-c74b-4754-b764-dc9e43926034/-/preview/-/format/jpg/","https://ucarecdn.com/82e15966-81a0-4780-b748-b9884819e065/-/preview/-/format/jpg/","https://ucarecdn.com/5a8fda4a-738a-4036-929d-cc0e5c33af66/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0d192cee-6e90-4cb0-9f5c-a7e2dc69d2bd\"}"},{"__ref":"Education:{\"uuid\":\"704bd8d4-9d53-4b3e-afa6-1b50c383cc08\"}"}],"hiredAt":"2026-02-02T18:50:26.466Z","topics":["K-5 Grade Math","Algebra I","Pre-Algebra","Algebra II","Precalculus / Trigonometry","Geometry","Calculus","6-8 Grade Science","Physics","Chemistry","Writing","Academic Coaching","Reading","Executive Function","Robotics / Electronics / CAD","STEM Project","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hamad-iqbal\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2ac82473-32c5-4a54-b616-128070fca2f6\"}"}}},"_sentryTraceData":"308c535c81f94fd9a77a2cc1742e7982-abbae5feb5607cbe-0","_sentryBaggage":"sentry-envir
