xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"156fa851-4c7a-4901-b674-6c2ee8da34a7\"}":{"__typename":"DeepDives","uuid":"156fa851-4c7a-4901-b674-6c2ee8da34a7","content":"\u003cp\u003eMy dream is to eventually work as an attorney or policy analyst in state government or with a nonprofit such as the ACLU, drafting empirically supported policies that seek to undo social inequities. My specific legal interests are in the education and criminal justice systems, where I believe there is much work to be done to align the country with its core values of equality and justice. One day, I hope to return to academia as a professor to share my love of learning and activism with youth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f50ee950-b1ce-4655-9a45-75700bba176a\"}":{"__typename":"DeepDives","uuid":"f50ee950-b1ce-4655-9a45-75700bba176a","content":"\u003cp\u003eI have always been curious about how people learn about and move through the world both as individuals, with unique and complex minds, and as members of social groups and societies. Through my psychology major, I was able to explore answers to my questions about the human mind, from the influences of culture upon personality to the nuerochemistry of depression and anxiety. In my research, I studied how young children learn critical emotional intelligence capacities, such as the ability to express and identify emotions. I helped design social and emotional learning curriculum for SF schools and support teachers in its implementation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4b7d251d-5c56-4ca6-923c-329ea1596305\"}":{"__typename":"DeepDives","uuid":"4b7d251d-5c56-4ca6-923c-329ea1596305","content":"\u003cp\u003eAs a low-income student applying to college, I taught myself about essays, scholarships, and financial aid, often unsure of what I was doing and lacking the guidance or generational knowledge to connect with resources. Although I believe these challenges built my character and independence, they also created a great deal of stress for me. The mentorship I received from programs such as Matriculate and QuestBridge, organizations that support low-income high school students, were critical to alleviating my stress and connecting me with opportunities I was unaware of. As a mentor now, I hope to provide a similar support system for students and offer my experience and connections as resources to reduce their stress and boost their success. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"21be55e5-d600-4027-9321-c3087aeee61d\"}":{"__typename":"DeepDives","uuid":"21be55e5-d600-4027-9321-c3087aeee61d","content":"\u003cp\u003eI am passionate about learning languages and exploring food, art, music, and culture around the world. Although I haven't yet had many opportunities to travel, and have only left the country two times to study abroad in Guatemala and Spain, I hope to travel as much as possible throughout my life, complete my journey to fluency in Spanish, and continue learning Italian and hopefully Mandarin and Arabic as well. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"a9e579f8-9fe8-4654-886d-6aeedda44fb5\"}":{"__typename":"School","uuid":"a9e579f8-9fe8-4654-886d-6aeedda44fb5","name":"Alder Grove Charter School","city":"Eureka","type":"HIGH","state":"California","country":"United States","zip":"95501"},"Education:{\"uuid\":\"8dad5774-daf0-4897-bcc8-0ef08bc11e23\"}":{"__typename":"Education","uuid":"8dad5774-daf0-4897-bcc8-0ef08bc11e23","school":{"__ref":"School:{\"uuid\":\"a9e579f8-9fe8-4654-886d-6aeedda44fb5\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"c5818a11-a4c6-4f11-8d1e-06ef9be305b5\"}":{"__typename":"Education","uuid":"c5818a11-a4c6-4f11-8d1e-06ef9be305b5","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"fc37b4ff-9e6e-43bc-89c0-283579745faf\"}":{"__typename":"MentorPublicProfile","uuid":"fc37b4ff-9e6e-43bc-89c0-283579745faf","displayName":"Shirleen F.","slug":"shirleen-ferraraframe","biography":"\u003cp\u003eI am a Stanford Master’s student in Public Policy and have over 5 years of tutoring experience at the elementary, high school, and college level for academic and professional settings, from research essays to personal statements. \u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eQualifications:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI have over 750 hours of teaching and tutoring experience, with over 650 hours of 1-on-1 in-person writing tutoring experience and 100 hours of 1-on-1 virtual tutoring experience.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI took a 10-week tutoring seminar where I was trained in guiding students through the brainstorming and researching to outlining, drafting, and polishing phases of writing.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI have worked a selective position as a writing tutor at Stanford’s Hume Center for Speaking and Writing for 3 years, meeting 1-on-1 with 10 to 20 students per week to work on projects at any and every stage of the writing process. Through this, I have developed an adaptable tutoring pedagogy that allows me to identify the diverse needs of my students and assist them with a broad range of disciplines.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI have over 100 hours of 1-on-1 tutoring experience in high-school English, working for a year with a high-school student and helping improve his essay grades from Bs to As.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI have mentored 4 high school students in writing their college essays for the QuestBridge Scholarship Program, who later were admitted to USC, Columbia, UC Berkeley, etc.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAbout Me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI personally love writing, particularly policy writing, and will attend law school after my Master's. Outside of school, I love staying active--taking exercise and dance classes, hiking and exploring nature, and going on runs with friends. I love all types of music and art, and have been painting since I was 5 years old! My favorite part about teaching is meeting new amazing students and getting to learn about their interests and passions. I love incorporating students' interests into our lesson plans and making learning exciting!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"156fa851-4c7a-4901-b674-6c2ee8da34a7\"}"},{"__ref":"DeepDives:{\"uuid\":\"f50ee950-b1ce-4655-9a45-75700bba176a\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b7d251d-5c56-4ca6-923c-329ea1596305\"}"},{"__ref":"DeepDives:{\"uuid\":\"21be55e5-d600-4027-9321-c3087aeee61d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/701a101f-081f-4a3c-b6db-a0d6dea588fe/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8dad5774-daf0-4897-bcc8-0ef08bc11e23\"}"},{"__ref":"Education:{\"uuid\":\"c5818a11-a4c6-4f11-8d1e-06ef9be305b5\"}"}],"hiredAt":"2024-07-24T15:53:46.140Z","topics":["Writing","Executive Function","Academic Coaching","College Essay Writing","Reading","History","STEM Project","History Project","Literature"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"shirleen-ferraraframe\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fc37b4ff-9e6e-43bc-89c0-283579745faf\"}"}}},"_sentryTraceData":"982eac53d0e740af82a0b969a339c8db-af29fe855594f146-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=982eac53d0e740af82a0b969a339c8db,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":tr
