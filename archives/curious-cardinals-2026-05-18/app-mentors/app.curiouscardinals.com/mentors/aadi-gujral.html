xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2a35c9eb-0932-4cdb-9fb9-bd982a6e33b0\"}":{"__typename":"DeepDives","uuid":"2a35c9eb-0932-4cdb-9fb9-bd982a6e33b0","content":"\u003cp\u003eMake mistakes—it’s the best way to learn. Take risks, push yourself, and don’t be afraid to fail. Work hard, stay curious, and trust the process—but most importantly, smile through it all. The journey matters just as much as the destination.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"83fa63d3-e8de-4218-82af-7910b7ff7c02\"}":{"__typename":"DeepDives","uuid":"83fa63d3-e8de-4218-82af-7910b7ff7c02","content":"\u003cp\u003eOne of my biggest passion projects is TrailGuard, an environmental initiative I founded to preserve and maintain public trails. We removed 250,000+ lbs of invasive species and waste across California parks and collaborated with park authorities, environmental scientists, and Congressman DeSaulnier’s office.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also founded FinLitFun, a 501(c)(3) nonprofit dedicated to making financial literacy engaging for students. The platform has 7,000+ users across 9 countries, and I’ve written op-eds in The New York Times and Fast Company advocating for financial education. Through FinLitFun, I was named a Daily Point of Light Award recipient and was selected as a Global Possibility Network scholar at Penn Graduate School of Education.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f2aabead-d527-4390-ad13-115cf2a21261\"}":{"__typename":"DeepDives","uuid":"f2aabead-d527-4390-ad13-115cf2a21261","content":"\u003cp\u003eWhen I’m not working, I love deep diving into philosophy, meditation, and weightlifting. Lately, I’ve been hooked on determinism, metaphysics, simulation theory, and the meaning of life—basically, questioning everything. Whether it’s pushing my limits in the gym or contemplating existence, I enjoy exploring both the physical and philosophical sides of life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"cfb3c1bb-f64b-4b05-9a14-d368e5b9553a\"}":{"__typename":"DeepDives","uuid":"cfb3c1bb-f64b-4b05-9a14-d368e5b9553a","content":"\u003cp\u003eLebron James\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"e0657a89-6f31-49a8-ad5d-2bfbc7b6d6e6\"}":{"__typename":"School","uuid":"e0657a89-6f31-49a8-ad5d-2bfbc7b6d6e6","name":"Monte Vista High School","city":"Danville","type":"HIGH","state":"California","country":"United States","zip":"94526"},"Education:{\"uuid\":\"2a731ae7-e730-4637-b502-fcfbaa914db5\"}":{"__typename":"Education","uuid":"2a731ae7-e730-4637-b502-fcfbaa914db5","school":{"__ref":"School:{\"uuid\":\"e0657a89-6f31-49a8-ad5d-2bfbc7b6d6e6\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"75021a1e-b93d-46dc-ac80-0158798b6e5d\"}":{"__typename":"Education","uuid":"75021a1e-b93d-46dc-ac80-0158798b6e5d","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Science + Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"d225aac8-bb9d-4f63-9ffc-4107de8cecab\"}":{"__typename":"MentorPublicProfile","uuid":"d225aac8-bb9d-4f63-9ffc-4107de8cecab","displayName":"Aadi G.","slug":"aadi-gujral","biography":"\u003cp\u003eHello!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Aadi, and I'm a first-year at Yale from the Bay Area, studying Economics and Computer Science. I've always been fascinated by how everything works. I don’t believe in free will (\u003cem\u003eyes, let’s argue about it\u003c/em\u003e), but I’m captivated by how patterns emerge, how incentives drive action, and how understanding the mechanics of something—whether it's a financial market, a forest ecosystem, or a human relationship—lets you engage with it more effectively.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I spend a lot of my time outside the classroom working at Yale Alternative Investments and leading my residential college’s intramural teams to victory. But beyond competition, I spend a lot of time outdoors—hiking, mountain biking, and just being in nature. In high school, I was president of my mountain biking team and raced competitively at the state level. I also cared deeply about the trails we rode on. That led me to start and lead a major trail conservation initiative, organizing efforts to clear invasive species and maintain parks across California.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have a go-getter attitude and like to make the most of every opportunity. I’ve scaled two global projects, leading teams and working with people to drive real impact. I approach life systematically—breaking things down, optimizing, and executing. But at the same time, I find joy in laughing through the absurdity of it all, balancing precision with spontaneity. I believe the best ideas emerge when you step back, breathe, and let them form naturally—hence my love for meditation, weightlifting, and long rides on my bike.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I bring a mix of structured guidance and open-ended curiosity. I thrive on working with people, helping them think bigger, execute better, and push themselves in ways they didn’t know were possible. Whether you want to launch a project, tackle an academic challenge, or figure out how to approach problems more effectively, I’m here to help you navigate that journey—and we’ll probably have a few laughs along the way.\u003c/p\u003e","teachingVideoPlaybackId":"Wf4K5qCRNaGOT00yg1WWHZ45oisPaqusIVCYsnnSru01U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science + Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2a35c9eb-0932-4cdb-9fb9-bd982a6e33b0\"}"},{"__ref":"DeepDives:{\"uuid\":\"83fa63d3-e8de-4218-82af-7910b7ff7c02\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2aabead-d527-4390-ad13-115cf2a21261\"}"},{"__ref":"DeepDives:{\"uuid\":\"cfb3c1bb-f64b-4b05-9a14-d368e5b9553a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2a52d145-7064-4cae-8c96-34878f5d8e35/-/preview/-/format/jpg/","https://ucarecdn.com/31b87ea9-a0de-45b4-ae8b-5825348b1cee/-/preview/-/format/jpg/","https://ucarecdn.com/016
