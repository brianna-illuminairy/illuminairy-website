xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f20b3a42-c671-474a-b80a-d6c03c6f8c73\"}":{"__typename":"DeepDives","uuid":"f20b3a42-c671-474a-b80a-d6c03c6f8c73","content":"\u003cp\u003eI would tell my high school self that people (even your friends) might doubt you, but that never means that your goals are impossible. Do what you want that fulfills your dreams because this \u003cem\u003eyour\u003c/em\u003e life. No one else can live it but you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a4176b64-5d5d-4803-a01b-a902d542eb36\"}":{"__typename":"DeepDives","uuid":"a4176b64-5d5d-4803-a01b-a902d542eb36","content":"\u003cp\u003eMentorship matters to me because it can be difficult to find an individual to look up to. As the oldest child, I always found it difficult to have a person to look up, and in times, I still struggle with this feeling. However, I know that I can be a mentor for someone that can help them truly be confident in themselves and pursue their goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b875569c-e8b6-4c74-9de9-5eeb5c2b0438\"}":{"__typename":"DeepDives","uuid":"b875569c-e8b6-4c74-9de9-5eeb5c2b0438","content":"\u003cp\u003eIn high school, I spent every summer playing soccer (both club and school), and also running track on the side. If I wasn't being active, I was working at my part time job!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I would spend time with friends and watch movies with my sisters!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"38c66c7b-9554-4f51-93d7-bddeaa89e50e\"}":{"__typename":"DeepDives","uuid":"38c66c7b-9554-4f51-93d7-bddeaa89e50e","content":"\u003cp\u003eMy greatest source of motivation is that I have control over my life. I am able to make the decisions I want. With that, I know how to challenge myself and persevere when challenges arise. I know that I have exceeded my expectations more times than I can count, so I know that I can keep being successful when I put my mind to the problem at hand. I have control over my life because I am confident in who I am as a person, and that is what pushes me forward to leave my comfort zone and pursue new interest that come my way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"2b46a3d4-e4fd-4e7e-8602-dceecb8dcf7d\"}":{"__typename":"School","uuid":"2b46a3d4-e4fd-4e7e-8602-dceecb8dcf7d","name":"Owen J Roberts High School","city":"Pottstown","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19465"},"Education:{\"uuid\":\"f5258571-fd4e-454c-b21d-f84cc91804b0\"}":{"__typename":"Education","uuid":"f5258571-fd4e-454c-b21d-f84cc91804b0","school":{"__ref":"School:{\"uuid\":\"2b46a3d4-e4fd-4e7e-8602-dceecb8dcf7d\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"2b2e7c34-be15-4549-84b3-7a93cf8dfa4d\"}":{"__typename":"Education","uuid":"2b2e7c34-be15-4549-84b3-7a93cf8dfa4d","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"5089a61a-ecc6-420a-b978-66bef8535af5\"}":{"__typename":"MentorPublicProfile","uuid":"5089a61a-ecc6-420a-b978-66bef8535af5","displayName":"Jailyn C.","slug":"jailyn-cardwell","biography":"\u003cp\u003eHi! My name is Jailyn and I am a sophomore at the University of Pennsylvania! At Penn, I am majoring in Biology with a minor in Chemistry and pursuing another minor in Political Science! I am so thrilled to help with both academic mentorship and passion projects!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eIn high school:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI was an Algebra 2 tutor!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAn Honors Chemistry teaching assistant.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eThird place state championship winner in Pennsylvania's State DECA Conference!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eA member of my school's Executive Student Council.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAward winner for Excellence in Life Sciences!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eAt Penn, I am a member of the STEM Sorority, Alpha Omega Epsilon, and a member of the National Society of Black Women in Medicine! I am also an award winner of Penn Undergraduate Research Mentorship program where I began working with a PhD fellow for ten weeks in the summer following my freshman year. From this, I presented my research at Penn's Undergraduate Research Symposium!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, I was always a very curious kid, and I always wanted to learn the \u003cem\u003e\"why?\"\u003c/em\u003e behind the questions I asked- not just the answers given to me. Being a Biology major has given me access to ask even more questions and figure out the purpose behind it. \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eMy Style!\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eMy goal is to let you understand the \"why?\" behind every step we take together. This allows our end goal to make an impact on yourself and grow as a student! We can accomplish this by:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eApproaching the problem at hand one step at a time.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReviewing mistakes and problem-solving how we can fix it.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAsking questions behind the answer solved.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLeaving each session with a more intricate understanding rather than a broad \"I got it!\"\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eSome Fun Facts!\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I enjoy taking walks: whether I am back at home walking my dog, or walking into the city with my friends, I enjoy hearing the noise of the world! I enjoy playing chess with my dad, and the Wordle is also one of my favorite past times! I also absolutely LOVE the Harry Potter Series (my favorite book is the Prisoner of Azkaban, and my favorite move is The Half Blood Prince). Lastly, I love driving restaurants and enjoying meals with my two younger sisters!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can't wait for us to really gain the understanding to make the difference in your work! See you soon!\u003c/p\u003e","teachingVideoPlaybackId":"ucAJK00ihYBg5PrKSSwB9yZcij97OSpH2IINQLF2iQKI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f20b3a42-c671-474a-b80a-d6c03c6f8c73\"}"},{"__ref":"DeepDives:{\"uuid\":\"a4176b64-5d5d-4803-a01b-a902d542eb36\"}"},{"__ref":"DeepDives:{\"uuid\":\"b875569c-e8b6-4c74-9de9-5eeb5c2b0438\"}"},{"__ref":"DeepDives:{\"uuid\":\"38c66c7b-9554-4f51-93d7-bddeaa89e50e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e86a3ee6-d2a8-4759-aecf-3d33bb307db3/-/preview/-/format/jpg/","https://ucarecdn.com/02079221-ef35-4776-8781-96e1237c870d/-/preview/-/format/jpg/","https://ucarecdn.com/fc05d085-004e-45ce-ba95-7aadf94684e3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f5258571-fd4e-454c-b21d-f84cc91804b0\"}"},{"__ref":"Education:{\"uuid\":\"2b2e7c34-be15-4549-84b3-7a93cf8dfa4d\"}"}],"hiredAt":"2026-04-27T21:06:21.898Z","topics":[],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jailyn-cardwell\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5089a61a-ecc6-420a-b978-66bef8535af5\"}"}}},"_sentryTraceData":"5988a6927c644fefa00e0569a8211f65-9d0873ef46badfc8-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=5988a6927c644fefa00e0569a8211f65,sentry-sample_r
