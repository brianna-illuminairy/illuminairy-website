xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8606a893-4595-4e10-8cc7-23047be2eca1\"}":{"__typename":"DeepDives","uuid":"8606a893-4595-4e10-8cc7-23047be2eca1","content":"\u003cp\u003eMy dream job is to be an environmentally-conscious urban planner, where I can create and renew green spaces for the benefit of local communities. I see myself as the connector between community organizations, design professionals, and the landscape-- for the benefit of all.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"abce95e1-bdb6-4dec-a413-73cfe0fa0996\"}":{"__typename":"DeepDives","uuid":"abce95e1-bdb6-4dec-a413-73cfe0fa0996","content":"\u003cp\u003eIn my spare time, I love to learn and expand my knowledge of new craft mediums. Since I began in the third grade, my favorite craft to date is jewelry making. My recent obsession is crochet, and I am currently working on clothing pieces for my summer wardrobe!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7dbc7e2d-3201-4b81-9c7b-f81f17677f1e\"}":{"__typename":"DeepDives","uuid":"7dbc7e2d-3201-4b81-9c7b-f81f17677f1e","content":"\u003cp\u003eWhen I applied to a summer camp for girls in STEM in middle school, I was prompted to write about a STEM field I wanted to study. So, I began to research, turning to Google to ask 'what are different STEM fields?' during which I learned about Architecture. The ability to imagine, create, and build deeply resonated with me. This continued into high school where Architecture became a representation of the connection between art and math, my two seemingly unrelated interests. Since then, the more I studied and learned about architecture, the more interested and passionate I am about designing the world we live in.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"f541ac53-170e-440d-abf5-37a83497665e\"}":{"__typename":"DeepDives","uuid":"f541ac53-170e-440d-abf5-37a83497665e","content":"\u003cp\u003eMy greatest source of motivation is my family. Both of my parents immigrated from other countries and have actively worked to provide a better life for me and my sister. It is that drive and courage they set out with that inspires me to emulate their example. Not only do I want to give back to my parents, but I also want to create a foundation to for my own future family to build upon. This inspires me beyond my family ties, and connection and care are at the heart of everything I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"4051e41a-0e11-478e-a74a-43f8cc4ee533\"}":{"__typename":"School","uuid":"4051e41a-0e11-478e-a74a-43f8cc4ee533","name":"Gridley High School","city":"Gridley","type":"HIGH","state":"CA","country":"United States","zip":"95948"},"Education:{\"uuid\":\"587fc8e0-5a16-45b4-b441-335bb928dc45\"}":{"__typename":"Education","uuid":"587fc8e0-5a16-45b4-b441-335bb928dc45","school":{"__ref":"School:{\"uuid\":\"4051e41a-0e11-478e-a74a-43f8cc4ee533\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"49010c1f-fdc3-4f7c-8035-0fca38e56874\"}":{"__typename":"Education","uuid":"49010c1f-fdc3-4f7c-8035-0fca38e56874","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"History of Art and Architecture","degree":null},"Testimonial:8daa6f6b-ef2a-4100-86de-d4154d0fcd84":{"__typename":"Testimonial","id":"8daa6f6b-ef2a-4100-86de-d4154d0fcd84","text":"We are so grateful for the incredible support and guidance Skylar received from her mentor and tutor, Yasmeen. She was consistently kind, patient, and empathetic—qualities that made a real difference in Skylar's confidence and motivation. Yasmeen was also incredibly flexible with Skylar’s busy schedule, which helped reduce stress and made tutoring something Skylar could look forward to. With her help, Skylar got back on track with her homework, especially in math, and felt well-prepared for her AP exams. Thank you, Yasmeen, for being such a positive and steady influence in her life!","date":"2025-06-09 18:26:40.828+00","rating":5,"endorser":{"__typename":"Endorser","name":"Heidi von Mayrhauser","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"3c358786-af68-4e7e-a4ab-1f410e828426\"}":{"__typename":"MentorPublicProfile","uuid":"3c358786-af68-4e7e-a4ab-1f410e828426","displayName":"Yasmeen A.","slug":"yasmeen-alfaqeeh","biography":"\u003cp\u003eHi! I'm Yasmeen, a recent graduate from Harvard College with a Bachelor's Degree in History of Art and Architecture.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am passionate about all things architecture, design, and urban planning. I found my interest in architecture and design since I was young, and I remember visiting 'big cities' and being in awe at the skyscrapers and business of the streets. Being from a small rural town in Northern California, there wasn't a huge architectural landscape to marvel at, but I did learn the importance of community and connection and this value has stuck with me since. At the core, what motivates me in design is always PEOPLE, and my interest in design is focused on community-centered design and sustainability. The key question I find myself asking is: How can design work in service of the local community and environment? I believe everyone deserves to enjoy nature, have access to open spaces, and most importantly, play!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up, I did all kinds of sports, but the two activities that I love are Dance and Rugby. I was a dancer from 3rd grade through my senior year of high school, and my favorite classes were ballet and lyrical. My love for rugby didn't start until I was a freshman in High School, and then I went on to play for Harvard Women's Varsity Rugby team in college! (Ask me about girls' rugby, I can't recommend it enough!)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, I was a co-founder and co-director for the Harvard Undergraduate Design Collective, a digital arts organization on campus that hosted educational workshops, created design community, and fulfilled client work requests. This taught me deeply about innovation, collaboration, and education in the design realm. In addition, I found my community at school in several Latino affinity groups where I made some lifelong friendships and found home-away-from-home while living across the country.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy friends would describe me as deeply caring and considerate, and I value my ability to listen and empathize with other people. I am curious at heart and like to learn about nearly anything. I also believe in the importance of laughter, and I love to joke around or share funny stories.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eArtistically, I have a wide range of experiences in primarily digital but also traditional mediums. My areas of expertise are graphic design and illustration. (Fun fact: I've been using Photoshop for 9 years!) I love anything crafty, creative, and beautiful. In our sessions, we will use visual modalities for learning, including creating presentations, sketching activities, and other hands-on ways to 'see' what we are learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"O00QVcVxqBiNhx5jT7HUgdCtk7MsQhLoy11u501l5EUr8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History of Art and Architecture","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8606a893-4595-4e10-8cc7-23047be2eca1\"}"},{"__ref":"DeepDives:{\"uuid\":\"abce95e1-bdb6-4dec-a413-73cfe0fa0996\"}"},{"__ref":"DeepDives:{\"uuid\":\"7dbc7e2d-3201-4b81-9c7b-f81f17677f1e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f541ac53-170e-440d-abf5-37a83497665e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fd29f4f5-e36a-47c5-b60e-c4421ee70ef8/-/preview/-/format/jpg/","https://ucarecdn.com/fdfdf453-c606-4018-b7c5-7e2a10883676/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"587fc8e0-5a16-45b4-b441-335bb928dc45\"}"},{"__ref":"Education:{\"uuid\":\"49010c1f-fdc3-4f7c-8035-0fca38e56874\"}"}],"hiredAt":"2024-06-06T09:01:16.355Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Writing","College Essay Writing","Reading","K-6 Storybook","Visual Arts / Graphic Design","Fashion / Cosmetics","Video / Photography","Sustainability"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:8daa6f6b-ef2a-4100-86de-d4154d0fcd84"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"yasmeen-alfaqeeh\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3c358786-af68-4e7e-a4ab-1f410e828426\"}"}}},"_sentryTraceData":"3d122691009e4877b7fcc9ebfb0681dc-b971becace8f6d88-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3d122691009e4877b7fcc9ebfb0681dc,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"yasmeen-alfaqeeh"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
