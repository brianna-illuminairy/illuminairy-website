xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1e210c13-e873-4228-877a-29d55e92eb09\"}":{"__typename":"Favorites","uuid":"1e210c13-e873-4228-877a-29d55e92eb09","photoUrl":"https://ucarecdn.com/d611bbe0-48b9-40d6-9c81-9dfa9691d442/","title":"Cameron Diaz (Ask me why:)","type":"ACTOR"},"Favorites:{\"uuid\":\"c49dc79e-54a8-49bc-8503-fa98cfd6d202\"}":{"__typename":"Favorites","uuid":"c49dc79e-54a8-49bc-8503-fa98cfd6d202","photoUrl":"https://ucarecdn.com/6fd813da-b816-48ee-8100-7a7f7f45f655/","title":"Tea for the Tillerman - Cat Stevens/Yusuf","type":"ALBUM"},"Favorites:{\"uuid\":\"853b977d-48fa-4032-b0b7-0e6e7b3bc5df\"}":{"__typename":"Favorites","uuid":"853b977d-48fa-4032-b0b7-0e6e7b3bc5df","photoUrl":"https://ucarecdn.com/5a1ae420-2f44-47b6-862d-acb1341717f1/","title":"Cold Play","type":"ARTIST"},"CausesSupported:{\"uuid\":\"df7fada8-5eb6-4868-a5a4-712088a6509f\"}":{"__typename":"CausesSupported","uuid":"df7fada8-5eb6-4868-a5a4-712088a6509f","name":"Save the Children","description":"\u003cp\u003e  I contribute financially to Save the Children and follow their work closely. \u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"4217fc18-14ab-433a-b0b2-26380f5ff890\"}":{"__typename":"DeepDives","uuid":"4217fc18-14ab-433a-b0b2-26380f5ff890","content":"\u003cp\u003eI once had a very vivid dream that I was late for school at Stanford, except the school was floating on water and I had to swim between classes. No one else thought this was strange, which was honestly the most stressful part. I sometimes think about this dream while I am swimming laps. 😂 🏊‍♂️ 🏫\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"faf9bd7d-3dac-48d8-99d4-b9b361939865\"}":{"__typename":"DeepDives","uuid":"faf9bd7d-3dac-48d8-99d4-b9b361939865","content":"\u003cp\u003eMost people don’t guess that I’m actually pretty goofy. I take my work seriously, but I don’t take myself too seriously. I love being creative, trying new things, and finding ways to make learning feel fun instead of formal. 🤪\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"57d18008-55d3-42e0-92cc-eede3a9c74f6\"}":{"__typename":"DeepDives","uuid":"57d18008-55d3-42e0-92cc-eede3a9c74f6","content":"\u003cp\u003eSo many things!!! Professionally, I want to write and advocate for policies that impact child and social welfare systems in the United States. ✍️ 🇺🇸 👶\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also want to learn how to play the Cello and fly a plane! 🎼 🎻 ✈️\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"298078df-b7cc-4167-b827-397a41961a57\"}":{"__typename":"DeepDives","uuid":"298078df-b7cc-4167-b827-397a41961a57","content":"\u003cp\u003eMy biggest source of motivation is working with kids. I really enjoy being the kind of support I wish I’d had at their age. It’s rewarding to see the impact of the work in real time and to know that by showing up consistently I am making a positive difference for kids and their families.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"d8b9806e-443e-494d-a541-49a9ea71749e\"}":{"__typename":"School","uuid":"d8b9806e-443e-494d-a541-49a9ea71749e","name":"General Educational Development","city":"Santa Barbara","type":"HIGH","state":"CA","country":"United States","zip":"93105"},"Education:{\"uuid\":\"c3657624-a7b0-4d28-aee0-b34dd1e77d99\"}":{"__typename":"Education","uuid":"c3657624-a7b0-4d28-aee0-b34dd1e77d99","school":{"__ref":"School:{\"uuid\":\"d8b9806e-443e-494d-a541-49a9ea71749e\"}"},"startYear":"2020","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"92e9eddf-952a-481f-8503-b64cef4bf495\"}":{"__typename":"Education","uuid":"92e9eddf-952a-481f-8503-b64cef4bf495","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Communications/Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"b0ed386d-756a-45f4-ae19-c7c2ad53cde6\"}":{"__typename":"MentorPublicProfile","uuid":"b0ed386d-756a-45f4-ae19-c7c2ad53cde6","displayName":"Cameron B.","slug":"cameron-black","biography":"\u003ch2\u003eCAMERON B. (IN A NUTSHELL)\u003c/h2\u003e\u003cbr\u003e\u003cp\u003eHi, I’m Cameron.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy path to education hasn’t been traditional, and that experience shapes how I mentor today. Growing up, I didn’t always have consistent access to school, and for a long time I assumed learning just wasn’t meant for me. It wasn’t until adulthood that I discovered how much I genuinely love learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter earning my GED, I went on to complete my college education at Stanford, an experience that deeply reinforced my belief that with the right support, expectations, and environment, students are capable of far more than they often realize.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of this, I care deeply about helping students build confidence in their thinking, trust their voice, and take ownership of their growth.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve worked with kids and teens across a wide range of settings, from after-school programs to mentoring and behavioral support, including work with youth in San Francisco and rural Alaskan communities. These experiences taught me that great mentorship starts with paying attention, understanding how each student learns, what motivates them, and where they want to go.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have a special place in my heart for project-based learning and passion projects anything that allows students to explore ideas they genuinely care about and turn them into something real. I love helping students organize messy thoughts into clear direction, test ideas, learn from setbacks, and try again.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic work centers on communication, storytelling, psychology, and how people make meaning of their experiences all of which inform how I help students express themselves clearly and think more deeply.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of mentoring, I spend a lot of time swimming, training, and being outdoors. Movement keeps me grounded and focused, and I often encourage students to find the environments that help them think best too.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my work, I’m highly organized, reliable, and deeply invested in my students’ growth. I care about trust and create a space where students feel supported and also challenged to stretch.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re someone who learns differently, gets distracted, thinks big, or needs help turning ideas into action, you’re in very good company and I can’t wait to meet you!\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003ch2\u003eWHERE I ADD THE MOST VALUE\u003c/h2\u003e\u003cp\u003eI do my best work with students who are looking to build something meaningful to them.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eStudents often work with me to:\u003c/p\u003e\u003cp\u003e• Design and launch passion projects from the ground up\u003cbr\u003e• Develop entrepreneurial or social impact ideas\u003cbr\u003e• Strengthen writing, storytelling, and communication\u003cbr\u003e• Build confidence in public speaking\u003cbr\u003e• Organize complex ideas into clear, actionable plans\u003cbr\u003e• Think strategically and make thoughtful decisions\u003cbr\u003e• Grow into independent, self-directed learners\u003c/p\u003e\u003cp\u003eI love working with students who are curious, motivated, and ready to challenge themselves!\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003ch2\u003eEXPERIENCEs \u0026amp; HARD SKILLS\u003c/h2\u003e\u003cp\u003e\u003cstrong\u003eYouth Behavioral Support Specialist (Independent)\u003c/strong\u003e\u003cbr\u003eWorked directly with youth and families to support emotional regulation, executive functioning, and behavioral growth.\u003c/p\u003e\u003cp\u003e\u003cem\u003eSkills students build:\u003c/em\u003e\u003cbr\u003e• Goal-setting and accountability\u003cbr\u003e• Emotional awareness\u003cbr\u003e• Productive learning habits\u003cbr\u003e• Resilience and confidence\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003cp\u003e\u003cstrong\u003eMentor \u0026amp; Educator — Urban and Rural Communities (including rural Alaska)\u003c/strong\u003e\u003cbr\u003eSupported students across vastly different educational environments, adapting learning approaches to meet each student where they were.\u003c/p\u003e\u003cp\u003e\u003cem\u003eSkills students build:\u003c/em\u003e\u003cbr\u003e• Adaptability\u003cbr\u003e• Personalized learning strategies\u003cbr\u003e• Academic confidence\u003cbr\u003e• Project planning\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003cp\u003e\u003cstrong\u003eEntrepreneurial \u0026amp; Business Experience\u003c/strong\u003e\u003cbr\u003eHands-on experience developing business ideas and thinking strategically about how to move them forward.\u003c/p\u003e\u003cp\u003e\u003cem\u003eSkills students build:\u003c/em\u003e\u003cbr\u003e• Entrepreneurial thinking\u003cbr\u003e• Financial literacy fundamentals\u003cbr\u003e• Opportunity analysis\u003cbr\u003e• Creative problem-solving\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003cp\u003e\u003cstrong\u003eCurriculum \u0026amp; Learning Design\u003c/strong\u003e\u003cbr\u003eExperience structuring learning experiences that are engaging, student-centered, and outcome-driven.\u003c/p\u003e\u003cp\u003e\u003cem\u003eSkills students build:\u003c/em\u003e\u003cbr\u003e• Project organization\u003cbr\u003e• Research skills\u003cbr\u003e• Structured thinking\u003cbr\u003e• Follow-through\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003cp\u003e\u003cstrong\u003eCommunication \u0026amp; Storytelling Focus — Stanford University\u003c/strong\u003e\u003cbr\u003eAcademic concentration on how ideas are communicated and understood.\u003c/p\u003e\u003cp\u003e\u003cem\u003eSkills students build:\u003c/em\u003e\u003cbr\u003e• Writing clarity\u003cbr\u003e• Persuasive communication\u003cbr\u003e• Presentation skills\u003cbr\u003e• Developing a strong personal voice\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003ch2\u003eIDEAL PROJECTS I LOVE SUPPORTING\u003c/h2\u003e\u003cp\u003e• Student startups or business ideas\u003cbr\u003e• Social impact initiatives\u003cbr\u003e• Writing-focused projects\u003cbr\u003e• Presentation or speech preparation\u003cbr\u003e• Student-led nonprofits\u003cbr\u003e• Interdisciplinary passion projects\u003c/p\u003e","teachingVideoPlaybackId":"MFm006OxzlCi02HvQyPTLR6nwauykoo6Ig02z7gpVO02UDQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eFor the first 20 years of my life, I didn’t really have access to education. For a long time, I thought that meant I wasn’t smart. Eventually, as an adult, I got my GED and realized pretty quickly that I actually loved learning once it felt safe and possible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn less than 5 years I completed three degrees and graduated from one of the most rigorous universities in the world. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think one of the things that made all of this possible was finding the right support system. That is why I am a Curious Cardinals Mentor today. So that I can be that support system for the next generation.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"1e210c13-e873-4228-877a-29d55e92eb09\"}"},{"__ref":"Favorites:{\"uuid\":\"c49dc79e-54a8-49bc-8503-fa98cfd6d202\"}"},{"__ref":"Favorites:{\"uuid\":\"853b977d-48fa-4032-b0b7-0e6e7b3bc5df\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"df7fada8-5eb6-4868-a5a4-712088a6509f\"}"}],"major":"Communications/Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4217fc18-14ab-433a-b0b2-26380f5ff890\"}"},{"__ref":"DeepDives:{\"uuid\":\"faf9bd7d-3dac-48d8-99d4-b9b361939865\"}"},{"__ref":"DeepDives:{\"uuid\":\"57d18008-55d3-42e0-92cc-eede3a9c74f6\"}"},{"__ref":"DeepDives:{\"uuid\":\"298078df-b7cc-4167-b827-397a41961a57\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5a235b54-5780-4fdf-9c58-542b0fd91aaa/-/preview/-/format/jpg/","https://ucarecdn.com/c1bc49e6-717d-43ad-9d20-8b755e95df37/-/preview/-/format/jpg/","https://ucarecdn.com/971f1d59-a00d-47fe-8fb7-7e7e8fbc12d3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid
