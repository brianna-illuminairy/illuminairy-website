e of the greatest moments of my life! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5d96233d-9290-4629-87b3-2b6d718563bf\"}":{"__typename":"DeepDives","uuid":"5d96233d-9290-4629-87b3-2b6d718563bf","content":"\u003cp\u003eI worked at a small motel in Clearwater Beach, Florida! I loved watching the guests create happy memories and getting to know them. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"9ca399cb-e914-48ef-bb67-eebc747bb50d\"}":{"__typename":"School","uuid":"9ca399cb-e914-48ef-bb67-eebc747bb50d","name":"Bronxville High School ","city":"Bronxville","type":"HIGH","state":"NY","country":"USA","zip":"10708"},"Education:{\"uuid\":\"b4612c6d-0571-41c2-8bcc-299d363ee937\"}":{"__typename":"Education","uuid":"b4612c6d-0571-41c2-8bcc-299d363ee937","school":{"__ref":"School:{\"uuid\":\"9ca399cb-e914-48ef-bb67-eebc747bb50d\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"4e50e427-db46-47f0-b7cd-d7cff2f66664\"}":{"__typename":"Education","uuid":"4e50e427-db46-47f0-b7cd-d7cff2f66664","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"International Politics, French","degree":null},"MentorPublicProfile:{\"uuid\":\"5d0df9e1-3184-4632-b261-6c38bbac832c\"}":{"__typename":"MentorPublicProfile","uuid":"5d0df9e1-3184-4632-b261-6c38bbac832c","displayName":"Carmen P.","slug":"carmen-phillips","biography":"\u003cp\u003eHi there! My name is Carmen and I am from Bronxville, New York (about 30 minutes from New York City). I’m a student at Georgetown University’s School of Foreign Service, where I study International Politics and French. I’ve always been curious about the world, how countries get along (or don’t), why conflicts happen, and how people from different places can work together to solve global challenges. That curiosity is what led me to study international affairs and think about a career in diplomacy and global development.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m especially passionate about human rights, diplomacy, and finding ways to make the world fairer and safer. This past summer, I was lucky to intern with the UN Development Programme, where I helped with projects that raised money to support the United Nations’ Sustainable Development Goals. It was exciting to see how different countries, businesses, and communities work together to tackle big problems like poverty and climate change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Georgetown, I’ve taken classes on topics like diplomacy, youth and peacebuilding, counterterrorism, and criminology. I love learning how countries can cooperate to prevent conflict and create opportunities for young people.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, I try to be active in campus life. I’m the Vice President of my sorority, Kappa Kappa Gamma, where I help plan events and build a welcoming community. I’ve also worked as a special events coordinator for the School of Foreign Service, which gave me the chance to help bring interesting speakers and discussions about global issues to campus.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not studying or involved in campus activities, I love cooking and baking, especially trying new recipes, and I love exploring Washington, DC. I’m always on the lookout for hidden gems, whether it’s a cozy coffee shop, a great new restaurant, or a quiet park to read in.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA fun fact about me is that I’ve visited all seven continents, including Antarctica (the penguins were adorable)! Traveling has taught me so much about other cultures and made me realize how connected people everywhere really are. I hope that travel always plays a big role in my life, especially in a future job. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to work with Curious Cardinals because I love helping younger students discover what they’re passionate about and showing them how their interests can lead to amazing opportunities. I know how much it meant to me when older students and mentors supported my curiosity, and I can’t wait to do the same for others. I can't wait to meet you all! \u003c/p\u003e","teachingVideoPlaybackId":"8LXzZrTwIAF003IS4G00loPrg7oYdTNhGG5cRKemWRg6A","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e6183676-178c-4453-b6ad-e99061e1a143\"}"},{"__ref":"Favorites:{\"uuid\":\"2d0e15cc-8b4a-4bee-b682-ed95cd470127\"}"},{"__ref":"Favorites:{\"uuid\":\"93375a28-eb73-4161-addd-0fb0336eaa49\"}"}],"causesSupported":[],"major":"International Politics, French","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"56e5536b-6f14-46ed-8550-bcc4949247a3\"}"},{"__ref":"DeepDives:{\"uuid\":\"0a259b2a-cea7-4dc7-bd11-495af0955b08\"}"},{"__ref":"DeepDives:{\"uuid\":\"5d96233d-9290-4629-87b3-2b6d718563bf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/feb30fab-2b07-447b-9297-cea43a36f802/-/preview/-/format/jpg/","https://ucarecdn.com/e6fe1208-a423-4391-9699-6438442e6ed6/-/preview/-/format/jpg/","https://ucarecdn.com/c41e8231-f69d-4a73-b7cb-d3139b94066f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b4612c6d-0571-41c2-8bcc-299d363ee937\"}"},{"__r
