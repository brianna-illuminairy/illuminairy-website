xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"643d1c0b-769e-482b-a997-1ae68cb1658c\"}":{"__typename":"DeepDives","uuid":"643d1c0b-769e-482b-a997-1ae68cb1658c","content":"\u003cp\u003eMost of what I was able to accomplish throughout my life has been based on what I learned from my elder peers. As a mentor, I have the opportunity to play the same role.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"dce05479-7231-4c9d-a5b9-7b8ae2be952a\"}":{"__typename":"DeepDives","uuid":"dce05479-7231-4c9d-a5b9-7b8ae2be952a","content":"\u003cp\u003eKnowing I have the potential to make tangible change in the world. I want to help the lives of others, and I try to do it at several scales. And if I know I have the potential, why would I not try to reach it?\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"8eb6563b-a9be-452f-b071-358f9c1c3635\"}":{"__typename":"DeepDives","uuid":"8eb6563b-a9be-452f-b071-358f9c1c3635","content":"\u003cp\u003eBeing a Hindu Indian-American, I have experienced both western and eastern styles of education. I think I have taken the best of both worlds in my personal teaching style, which I constantly amend as I interact with students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"f324f763-a339-4bfb-8b24-bf7f273038a4\"}":{"__typename":"DeepDives","uuid":"f324f763-a339-4bfb-8b24-bf7f273038a4","content":"\u003cp\u003eI like making deep connections to other individuals. I find that I do not need to know many people, but I want to completely understand those I do know. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"6ae16383-f021-414f-b89e-f7c660f9608b\"}":{"__typename":"Education","uuid":"6ae16383-f021-414f-b89e-f7c660f9608b","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Neuroscience","degree":null},"School:{\"uuid\":\"edacbf48-64ba-487d-96b1-cb12cd981246\"}":{"__typename":"School","uuid":"edacbf48-64ba-487d-96b1-cb12cd981246","name":"American Heritage Schools, Broward Campus","city":"Plantation","type":"HIGH","state":"Florida","country":"United States","zip":"33325"},"Education:{\"uuid\":\"6a9d3e97-c73a-4258-9e92-79c08c0d33ff\"}":{"__typename":"Education","uuid":"6a9d3e97-c73a-4258-9e92-79c08c0d33ff","school":{"__ref":"School:{\"uuid\":\"edacbf48-64ba-487d-96b1-cb12cd981246\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"91ba0b51-bcd9-421e-bfe5-bb904afdf2df\"}":{"__typename":"MentorPublicProfile","uuid":"91ba0b51-bcd9-421e-bfe5-bb904afdf2df","displayName":"Rithvik  M.","slug":"rithvik-marri","biography":"\u003cp\u003eHello! My name is Rithvik Marri, and I am a student at Duke University pursuing a B.S. in Neuroscience with minors in Computational Biology \u0026amp; Bioinformatics and Medical Sociology.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHow and why do people think differently? Cognition is one of biology’s biggest mysteries, and I have looked for answers to that question in my work. My interest with neuroscience started when I was told that two of my immediate cousins have autism spectrum disorder (ASD). I was not able to grasp how their brains work differently than mine, but I was determined to find out. This has led to my research in creating an AI model to capture a pathway affected by ASD, attempting to identify biomarkers in young children with ASD, and using a model organism to better understand behavioral neuroscience. I hope to attend medical school and become a physician, and it is crucial for me to be able to put what I discover into practice. I would love to help find that passion for others!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlong with my academics, I am a part of several organizations that represent causes important to me. I am on the executive board of a student association for my religion, where I help create a community for others to practice and feel supported. I work with a global health initiative that looks to provide clean water to rural, underserved areas. This upcoming school year, I will be part of a team that is building sustainable neurosurgical systems in developing countries. I also volunteer my time locally, with clinics and hospitals in the spaces I want to work in. My experiences are vast and varied, and I am always excited to share the insights I have gained!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy spending hours at the beach, starting new novels, or watching/playing sports. I am a part of the Duke club swim team and have been swimming competitively for over ten years.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI understand what it takes to set and achieve goals, with years of experience in my disciplined approach. I have been able to explore my passions in a multitude of fields while maintaining a balance between all my pursuits. Being a mentor has stood out to me as a way to share my story and contribute to the lives of others. I know I can make a difference.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"yCvQv400eaGh01YzbXLuvD3aNJbisa4cDzict01lHC01fhQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"643d1c0b-769e-482b-a997-1ae68cb1658c\"}"},{"__ref":"DeepDives:{\"uuid\":\"dce05479-7231-4c9d-a5b9-7b8ae2be952a\"}"},{"__ref":"DeepDives:{\"uuid\":\"8eb6563b-a9be-452f-b071-358f9c1c3635\"}"},{"__ref":"DeepDives:{\"uuid\":\"f324f763-a339-4bfb-8b24-bf7f273038a4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d39386eb-aaf7-4f8f-a399-1ad8bcc3abd3/-/preview/-/format/jpg/","https://ucarecdn.com/6dc0ffd2-5b4c-4b71-832f-c16c1a80db91/-/preview/-/format/jpg/","https://ucarecdn.com/9dcf7676-6e0e-4809-a1ad-ad49a682405a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6ae16383-f021-414f-b89e-f7c660f9608b\"}"},{"__ref":"Education:{\"uuid\":\"6a9d3e97-c73a-4258-9e92-79c08c0d33ff\"}"}],"hiredAt":"2025-05-29T23:34:02.160Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","College Essay Wri
