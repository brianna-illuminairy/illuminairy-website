xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"dbeeb7c1-cc97-40c3-b48d-cad93b9fce3a\"}":{"__typename":"DeepDives","uuid":"dbeeb7c1-cc97-40c3-b48d-cad93b9fce3a","content":"\u003cp\u003eIf I could advise my high school self, I would emphasize the power of positive thinking when pursuing goals. Believing in your abilities and visualizing success can create the momentum needed to overcome obstacles. Additionally, I would stress the importance of never being afraid to ask for what you want. Advocating for yourself opens doors and opportunities that may have otherwise remained closed! Have faith in your abilities and don't let self-doubt hold you back. With a positive mindset, the courage to ask, and unwavering confidence, you can conquer any challenge that comes your way! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8a13fda9-fa20-4276-8d3c-0aafa6174c98\"}":{"__typename":"DeepDives","uuid":"8a13fda9-fa20-4276-8d3c-0aafa6174c98","content":"\u003cp\u003eMentorship matters to me because of my own personal experiences. Coming from a small public high school where attending an out-of-state college wasn't the norm, I often longed for a mentor who could relate to my circumstances and provide honest advice and guidance. That absence made me realize the value of having someone in your corner who understands your journey. Now, my hope is to pass on the lessons I learned and make students feel more supported in their goals, no matter how big or small. By offering encouragement, relatable advice, and unwavering support, I hope to empower students and help them realize their full potential! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"367e144b-34a4-4fb1-a298-6c7bf87f0118\"}":{"__typename":"Education","uuid":"367e144b-34a4-4fb1-a298-6c7bf87f0118","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Political Science \u0026 Psychology","degree":"B.A.H"},"School:{\"uuid\":\"b71514ca-1a49-4836-b515-1939494a6f94\"}":{"__typename":"School","uuid":"b71514ca-1a49-4836-b515-1939494a6f94","name":"Sprague High School","city":"Salem","type":"HIGH","state":"Oregon","country":"United States","zip":"97302"},"Education:{\"uuid\":\"cc5f5bd6-75cc-4ddc-9c77-fd29aa3537f7\"}":{"__typename":"Education","uuid":"cc5f5bd6-75cc-4ddc-9c77-fd29aa3537f7","school":{"__ref":"School:{\"uuid\":\"b71514ca-1a49-4836-b515-1939494a6f94\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"c957ca35-faf7-40ab-ab2c-091c2a10f640\"}":{"__typename":"MentorPublicProfile","uuid":"c957ca35-faf7-40ab-ab2c-091c2a10f640","displayName":"Haley S.","slug":"haley-silva","biography":"\u003cp\u003eHaley graduated from Stanford University in 2024 with a major in Political Science and a minor in Psychology. Her intellectual curiosity and passion for learning led her to write an honors thesis exploring technology companies' content moderation policies and their observable impacts on civic processes. Haley is currently working at Ropes \u0026amp; Gray LP in New York City as a Corporate Paralegal focused on private investment funds while simultaneously applying to law school. In her free time, she loves exploring new cities, taking film photos of her friends, and going to workout classes! \u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn 2020, she graduated Valedictorian and Senior Class President of her high school, juggling a wide range of extracurricular activities from club volleyball to orchestra to constitutional debate team. She also worked part-time at her local Congressman's office and competed with her ballet performing company. At Stanford, Haley has held leadership positions within Stanford in Government, the leading civic engagement organization on campus, and enjoys taking part in all of the wacky campus traditions with her friends!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHaley's mission as a mentor is to empower students and make learning accessible and enjoyable for all. She believes in the power of taking initiative and speaking goals into existence, guiding students to set intermittent goals that lead them toward their desired futures without feeling overwhelmed. By fostering a comfortable and open-minded environment, Haley encourages her students to embrace their individuality and explore their passions. Her ultimate goal is to help students discover their true potential and develop the confidence to explore their interests outside of the classroom!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Political Science \u0026 Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dbeeb7c1-cc97-40c3-b48d-cad93b9fce3a\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a13fda9-fa20-4276-8d3c-0aafa6174c98\"}"
