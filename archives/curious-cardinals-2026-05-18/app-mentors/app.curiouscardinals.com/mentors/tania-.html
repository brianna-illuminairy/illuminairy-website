xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"cc5aea56-92cc-45c3-bb66-a4d3a7fbe6e1\"}":{"__typename":"Education","uuid":"cc5aea56-92cc-45c3-bb66-a4d3a7fbe6e1","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":null,"endYear":null,"expectedGradYear":"2023","major":"Psychology","degree":"A.B."},"MentorPublicProfile:{\"uuid\":\"66fd53ba-9c88-4a6d-a0c3-df8fb668867e\"}":{"__typename":"MentorPublicProfile","uuid":"66fd53ba-9c88-4a6d-a0c3-df8fb668867e","displayName":"Tania V.","slug":"tania-","biography":"Tania is a senior at Harvard College studying Psychology. Academically and beyond, Tania is excited by multipotentiality. Her early passions included psychology and cognitive neuroscience, creative writing, music and songwriting, fashion, studio art, photography, design, entrepreneurship, social impact, and public policy. She was always told that with age, she would narrow her interests. She's delighted to say that her passions are going strong and that she regularly discovers more interests. Tania also grew up in a multicultural environment. Her parents are Bulgarian and have lived in countries around the world, her older brother grew up speaking French in Austria and German in France, and Tania grew up in London attending an international school. Tania's interests and cultural background have yielded her an open-minded enthusiasm for possibilities.\n\nFrom a young age, Tania recognised that learning styles vary dramatically from person to person and that traditional education paths cater to some, but certainly not all, learners. Tania also believes that the world sometimes struggles to nurture and support holistic and sensitive individuals as much as specialists. Some of these people are lucky to have the confidence, resources, and support to advocate for themselves. Some feel constrained and become frustrated and disillusioned. Yet, everyone has a reservoir of talent, brilliance, and enthusiasm, whether tapped or untapped.\n\nTania is especially excited to help students with a breadth of interests find out how to combine, nurture, and complement their range of passions in a way that makes them feel fulfilled. Tania believes not only that radically different passions can coexist but that they can strengthen one another - and would love to tell you anytime about how her own interests have all fed each other! This summer, Tania is working as a Business Analyst Intern at Gameto, a biotechnology company innovating in female health. Tania's past experiences range vastly and include: acting as the co-president of FIG Magazine, Harvard's premiere fashion magazine; singing backup for Primal Scream at London Palladium; contributing to multidisciplinary research on structural inequity in Professor Mark L. Hatzenbuehler's Biopsychosocial Effects of Stigma Lab. \n\nAbove all, Tania believes in the importance of skills in mental health and resilience alongside all other lessons. In a busy, challenging world, even enthusiasm can accidentally lead to burnout. Let's cultivate true, multidimensional wellness and fulfilment to create an ever better world.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/2626e43c-a7d1-4166-bc38-f45e6fc1a6b5/-/crop/312x311/247,102/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education
