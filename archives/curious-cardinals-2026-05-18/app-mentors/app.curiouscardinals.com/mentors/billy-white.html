xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e9d846dc-fc02-4c90-8be7-6c896d4ba993\"}":{"__typename":"DeepDives","uuid":"e9d846dc-fc02-4c90-8be7-6c896d4ba993","content":"\u003cp\u003eMentorship not only allows me to help expand someone else's knowledge and provide them with a fun environment to learn, but also lets me grow as a person. Be it furthering my communication skills or organisational skills, there is a wide range of ways in which mentoring can better myself as a person whilst helping someone else do the same.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"060f15ba-25d5-419d-8ff2-54d289f56ef1\"}":{"__typename":"DeepDives","uuid":"060f15ba-25d5-419d-8ff2-54d289f56ef1","content":"\u003cp\u003eI chose my major, economics, as it allowed me to apply my passion for mathematics in real world scenarios. Be it studying different business cycles or the effects of different interest rates, I am able to use numbers to reflect visible processes in the world. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"de9ecd76-dbef-4d3a-9da6-4224bab1e4d9\"}":{"__typename":"DeepDives","uuid":"de9ecd76-dbef-4d3a-9da6-4224bab1e4d9","content":"\u003cp\u003eI come from a family of teachers so have grown up watching my parents handle different situations with different students and I feel one of the most important parts about mentoring and teaching is being able to adapt to different personalities. This allows you to get the best out the person you're teaching and connect with them on a far more personal level.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"01cf8fbe-1fd5-4654-8733-65123272a60f\"}":{"__typename":"DeepDives","uuid":"01cf8fbe-1fd5-4654-8733-65123272a60f","content":"\u003cp\u003eI feel I come across as a very chilled out and relaxed person, however, if you get to know me you'll know I am very driven and hardworking. Resilience is a big thing for me and encourage it as a value. Working hard and not giving up are key to be successful in whatever you do and this is something I value highly. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"d9e55d6a-e709-435a-b992-32f254f9e8a5\"}":{"__typename":"School","uuid":"d9e55d6a-e709-435a-b992-32f254f9e8a5","name":"Wellington College","city":"Crowthorne","type":"HIGH","state":"Berkshire","country":"United Kingdom","zip":"RG45 7PU"},"Education:{\"uuid\":\"9eac83ae-b174-4c80-8dae-9cf2c576c335\"}":{"__typename":"Education","uuid":"9eac83ae-b174-4c80-8dae-9cf2c576c335","school":{"__ref":"School:{\"uuid\":\"d9e55d6a-e709-435a-b992-32f254f9e8a5\"}"},"startYear":"2018","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"789daf65-2263-4f88-a48d-5a9450ee32b5\"}":{"__typename":"School","uuid":"789daf65-2263-4f88-a48d-5a9450ee32b5","name":"University of Bath","city":"Bath","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"BA2 7AY"},"Education:{\"uuid\":\"fbb1e51c-cd09-48b5-a912-7bc64f5ea056\"}":{"__typename":"Education","uuid":"fbb1e51c-cd09-48b5-a912-7bc64f5ea056","school":{"__ref":"School:{\"uuid\":\"789daf65-2263-4f88-a48d-5a9450ee32b5\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"742feaaa-23f7-41b5-9287-98758fd8efd3\"}":{"__typename":"MentorPublicProfile","uuid":"742feaaa-23f7-41b5-9287-98758fd8efd3","displayName":"Billy W.","slug":"billy-white","biography":"\u003cp\u003eHi! My name is Billy White and I’m an undergraduate student at the University of Bath in the UK studying Economics. Having grown up in the UK I hope to be able to share some of my British knowledge with you as well as learning about your different experiences!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf I were to describe myself as a person, I would say that I am relaxed, resilient, and reliable. With my mentoring, I like to take a collaborative approach, challenging you to think about the question at hand hopefully utilizing different techniques and methods learnt in class. I did the International Baccalaureate at school so if anyone is looking to do that or are looking to study over in the UK, I would be more than happy to help advise them with any needs on top of math tutoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademics wise, I like to go about my learning focusing on the multiple different inputs which allow you to reach a certain output, basically the reasoning behind how things work. My primary interest lies within mathematics be it calculus, algebra, geometry, statistics, I am keen to help you further your skills using the approach of fully understanding why a topic works rather than just plugging numbers into an equation.. With both my parents being teachers I’d like to think that they’ve passed on some of their teaching and mentoring genes onto me!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I am a big sports fan. Name any sport and I’ll have probably followed it at some point! Personally, I play a lot of cricket and field hockey, I know both are predominantly played in the UK rather than the US, however the most recent cricket world cup was played over in the states so I’m excited to see the growth of the sport over the pond. I am also a fan of football (soccer) and am a big Chelsea fan and I’ll always try and go watch them at Stamford Bridge as much as possible throughout the season! Recently I have really gotten into the NFL and with my Gramps living in North Carolina I’ve been following the Carolina Panthers (definitely a mistake from what I’ve seen so far!).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I am a big movie fan, in particular, a fan of psychological thrillers, for example, The Prestige or Shutter Island. I love how these films have you on edge throughout, not knowing where the twists and turns may take you. As for series, my top 3 of all time is probably Peaky Blinders, The Boys, and Breaking Bad in no particular order! \u003c/p\u003e","teachingVideoPlaybackId":"y97dhfRU0102AjX9kxcnVQjvxkVnDP01C5mQopZNa7301YE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e9d846dc-fc02-4c90-8be7-6c896d4ba993\"}"},{"__ref":"DeepDives:{\"uuid\":\"060f15ba-25d5-419d-8ff2-54d289f56ef1\"}"},{"__ref":"DeepDives:{\"uuid\":\"de9ecd76-dbef-4d3a-9da6-4224bab1e4d9\"}"},{"__ref":"DeepDives:{\"uuid\":\"01cf8fbe-1fd5-4654-8733-65123272a60f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6b8620a9-915c-498a-860f-39c96e03fb3b/-/preview/-/format/jpg/","https://ucarecdn.com/d181ab30-b876-42
