462-40a2-ad5f-46a0ed70c93f","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering and Applied Mechanics","degree":null},"MentorPublicProfile:{\"uuid\":\"d1a68bb2-5b27-4b6d-b975-f1fbe6e3d00b\"}":{"__typename":"MentorPublicProfile","uuid":"d1a68bb2-5b27-4b6d-b975-f1fbe6e3d00b","displayName":"Sophie A.","slug":"sophie-abramovitz","biography":"\u003cp\u003eHi! My name is Sophie Abramovitz. I study Mechanical Engineering and Applied Mechanics with a concentration in robotics, dynamics, and controls. I have been working in the Sung Robotics Lab, part of the General Robotics, Automated, Sensing, and Perception Lab (GRASP) at Penn for two years now, where I work on mechanical and controls design for soft robotics. This means we incorporate foldable materials so that the robots can change shape and adapt to new environments!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am interested in all aspects of design, from sketching to Computer Aided Design to fabrication. I have experience working in several CAD softwares as well as operating laser cutters, 3D printers, mills, lathes, and more. This summer, I will be working for Accenture in New York City, consulting for engineering companies on their manufacturing and other processes. I joined Curious Cardinals because my own mentors have had such a positive impact on my life and have helped me get to where I am today. I am so excited to be able to give that back to other students and help them become excited about learning. I received the Penn Undergraduate Research Mentorship Award for Summer 2025 and spent my summer working very closely with my mentor in the lab, completing a full-scale redesign of a robotic arm capable of tuning its own stiffnesses. This experience cemented my love for design and for learning new skills!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love playing sports and staying active. In high school, I played basketball, volleyball, and lacrosse. I have since picked up running and love to run along the river here in Philadelphia. I also love listening to music and going to concerts! I am very active in Jewish life here on campus and am a student leader in our Hillel. This school year, I am living in my sorority house, Sigma Delta Tau. Additionally, I am the Operations Coordinator for Camp Kesem at the University of Pennsylvania, where we run a week-long summer camp for children whose parents have been impacted by cancer. I am so excited to be a part of Curious Cardinals and would love the opportunity to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"cTO01UB02B9PH18dGcUYqq28Ant01kh1QcWGKwD6ioSs98","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"5a1e5e25-e14f-495c-8f61-7828836aaa87\"}"},{"__ref":"Favorites:{\"uuid\":\"dee4553c-cb6c-476f-9856-4b4c1cb94429\"}"},{"__ref":"Favorites:{\"uuid\":\"7f601a98-3328-4649-a7d3-5b7c93793eb4\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"f25c8c24-f2b3-4ff4-ae1e-4e48a30988b4\"}"}],"major":"Mechanical Engineering and Applied Mechanics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cd507589-83e9-4541-874d-8affbad12d5f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9341614-1593-4b4c-9910-4f8d9d551884\"}"},{"__ref":"DeepDives:{\"uuid\":\"a61ee10c-f7d7-4746-856c-f9733356a161\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cde1c3cd-5204-466d-906c-d6273226d02d/-/preview/-/format/jpg/","https://ucarecdn.com/7bf1ded4-3218-4f9f-b7d9-6b515318cc00/-/preview/-/format/jpg/","https://ucarecdn.com/ee261bf0-1ab2-4033-860f-c8d6282fa81c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b0021db4-b51e-415e-b187-ed7e07f3c718\"}"},{"__ref":"Education:{\"uuid\":\"36abebd9-b462-40a2-ad5f-46a0ed70c93f\"}"}],"hiredAt":"2026-02-21T00:46:20.209Z"
