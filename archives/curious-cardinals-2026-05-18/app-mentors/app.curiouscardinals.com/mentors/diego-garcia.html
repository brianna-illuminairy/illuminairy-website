xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b6d3e6d1-df1f-48d6-892b-35e72163c7e8\"}":{"__typename":"DeepDives","uuid":"b6d3e6d1-df1f-48d6-892b-35e72163c7e8","content":"\u003cp\u003eIn my spare time, I enjoy a mix of sports, cooking, and social activities. I'm an avid basketball and football player, and I love the challenge of rock climbing. Cooking is another passion of mine, especially preparing Latin American-inspired dishes and grilling steaks. I also make time for regular workouts at the gym. Above all, I value spending quality time with my friends and family, as it brings a great balance to my active lifestyle.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5d1e4def-4c61-43a7-8ae3-fb8b9aee2a24\"}":{"__typename":"DeepDives","uuid":"5d1e4def-4c61-43a7-8ae3-fb8b9aee2a24","content":"\u003cp\u003eMentorship is important to me because it plays a key role in personal and academic development. It offers guidance and support, helping students navigate challenges and grow. Mentors provide valuable insights, fostering skills like problem-solving and resilience, which are crucial both in school and in life beyond. This relationship goes beyond traditional learning, empowering students to realize their potential and prepare for their future careers. Essentially, mentorship is about inspiring confidence and shaping a student's journey in a holistic way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"cf45cfef-ee84-49ac-8015-2fa3342fa76e\"}":{"__typename":"DeepDives","uuid":"cf45cfef-ee84-49ac-8015-2fa3342fa76e","content":"\u003cp\u003eI would tell my younger self to prioritize communication and relationships for personal and leadership growth. Engage more with teachers for guidance beyond academics, motivate friends to foster a supportive environment, and maintain open communication with family and sports coaches for diverse perspectives and support. These steps are key to developing leadership skills and focusing on future goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b0e42b43-34a5-43c1-92e3-8bff97ca5ac5\"}":{"__typename":"DeepDives","uuid":"b0e42b43-34a5-43c1-92e3-8bff97ca5ac5","content":"\u003cp\u003eDuring my high school summers, I engaged in a variety of activities that were both meaningful and educational. One summer, I immersed myself in the Stanford Explore Lecture Series, where I explored different fields of medical research like Immunology, Neuroscience, and Bioinformatics. This experience broadened my understanding of medicine and its various specialties.\u003c/p\u003e\u003cp\u003eIn another summer, I participated in a community service program with Rustic Pathways in Costa Rica. I led a summer camp for children, focusing on educational and cultural exchange, and worked on environmental projects like coral reef and marine restoration. This not only honed my leadership skills but also deepened my appreciation for environmental conservation.\u003c/p\u003e\u003cp\u003eAdditionally, I spent summers working at Jamba, where I learned valuable lessons in leadership, teamwork, and customer service. This job taught me the importance of hard work and responsibility in a fast-paced setting.\u003c/p\u003e\u003cp\u003eEach of these experiences, whether academic, volunteer, or work-related, were instrumental in shaping my skills and perspectives, demonstrating my commitment to learning and personal growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"2c53a311-5cff-467c-ab1d-f4d5a458dd6f\"}":{"__typename":"School","uuid":"2c53a311-5cff-467c-ab1d-f4d5a458dd6f","name":"Crystal Springs Uplands School - Upper School","city":"Hillsborough","type":"HIGH","state":"California","country":"United States","zip":"94010"},"Education:{\"uuid\":\"799044d0-b183-404b-b40c-6b4ff5f9d1ce\"}":{"__typename":"Education","uuid":"799044d0-b183-404b-b40c-6b4ff5f9d1ce","school":{"__ref":"School:{\"uuid\":\"2c53a311-5cff-467c-ab1d-f4d5a458dd6f\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"af08a58f-3f2a-4510-a9ad-f1ffb7622cc5\"}":{"__typename":"Education","uuid":"af08a58f-3f2a-4510-a9ad-f1ffb7622cc5","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"ac26804a-1330-42ad-8634-b489a5d3dfdb\"}":{"__typename":"MentorPublicProfile","uuid":"ac26804a-1330-42ad-8634-b489a5d3dfdb","displayName":"Diego G.","slug":"diego-garcia","biography":"\u003cp\u003eAs a senior at the University of Southern California, majoring in Biomedical Engineering, my academic journey has been driven by a passion for genomics and bioinformatics. I am deeply committed to the advancement of these fields, aiming to leverage them to create meaningful changes in healthcare and research. My interest lies at the intersection of technology and biology, where I believe the future of medicine is being shaped.\u003c/p\u003e\u003cp\u003eOutside the classroom, I am actively involved in several campus organizations that reflect my commitment to both my field of study and my community. As a member of the Associated Students of Biomedical Engineering and the Society of Hispanic Professional Engineers, I have had the opportunity to collaborate with like-minded peers, share knowledge, and gain insights into the latest developments in our field. These experiences have not only enriched my academic life but also allowed me to cultivate leadership skills and a network of professional connections.\u003c/p\u003e\u003cp\u003eCurious Cardinals is more than just an extracurricular activity for me; it's a chance to inspire and guide the next generation, particularly in STEM fields. My goal is to be a role model for young students, demonstrating that with hard work and dedication, a career in STEM is within reach.\u003c/p\u003e\u003cp\u003eMy aspirations go beyond just academic success; I am driven by a desire to make a tangible impact in my community and the field of biomedical engineering. The path to a career in genomics and bioinformatics is not just a professional goal but a personal commitment to contributing to a field that stands at the forefront of scientific innovation.\u003c/p\u003e\u003cp\u003eAs I near the completion of my undergraduate studies, I look forward to the opportunities and challenges that lie ahead. With a foundation built on academic rigor, extracurricular involvement, and a strong sense of community responsibility, I am prepared and excited to contribute to the world of biomedical engineering.\u003c/p\u003e","teachingVideoPlaybackId":"ui6QTsg4L8Hr7rEb2cFexBqGvzzP6023q1fGmJy00NCNQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b6d3e6d1-df1f-48d6-892b-35e72163c7e8\"}"},{"__ref":"DeepDives:{\"uuid\":\"5d1e4def-4c61-43a7-8ae3-fb8b9aee2a24\"}"},{"__ref":"DeepDives:{\"uuid\":\"cf45cfef-ee84-49ac-8015-2fa3342fa76e\"}"},{"__ref":"DeepDives:{\"uuid\":\"b0e42b43-34a5-43c1-92e3-8bff97ca5ac5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2a5af41f-4442-432d-b5ec-35b84c3235f5/-/preview/-/format/jpg/","https://ucarecdn.com/2567e292-44b9-4957-8b6e-6871f37a21f5/-/preview/-/format/jpg/","https://ucarecdn.com/f8ef6a22-cbad-4930-914f-5af72e3adbe8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"799044d0-b183-404b-b40c-6b4ff5f9d1ce\"}"},{"__ref":"Education:{\"uuid\":\"af08a58f-3f2a-4510-a9ad-f1ffb7622cc5\"}"}],"hiredAt":"2023-12-24T21:23:40.826Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/b98f175c-f982-4497-bb8d-4a9c11113cd8/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"diego-garcia\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ac26804a-1330-42ad-8634-b489a5d3dfdb\"}"}}},"_sentr
