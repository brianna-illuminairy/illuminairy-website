"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"a1b61d13-e4be-4121-95be-87d268e0ad35\"}":{"__typename":"DeepDives","uuid":"a1b61d13-e4be-4121-95be-87d268e0ad35","content":"\u003cp\u003eMy mentors have single-handedly had the greatest impact on my career and I want to share that forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"ce906380-62a2-4cc2-ab5b-5ada805a9d03\"}":{"__typename":"DeepDives","uuid":"ce906380-62a2-4cc2-ab5b-5ada805a9d03","content":"\u003cp\u003eThe guidance and mentorship I have provided to my younger siblings to help them be the best versions of themselves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"696afb87-6ec3-4817-9a74-5c3273571479\"}":{"__typename":"School","uuid":"696afb87-6ec3-4817-9a74-5c3273571479","name":"Deerfield High School","city":"Deerfield","type":"HIGH","state":"Illinois","country":"United States","zip":"60015"},"Education:{\"uuid\":\"8ab2ef7b-9905-47b3-b37e-60cc6ed08b14\"}":{"__typename":"Education","uuid":"8ab2ef7b-9905-47b3-b37e-60cc6ed08b14","school":{"__ref":"School:{\"uuid\":\"696afb87-6ec3-4817-9a74-5c3273571479\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"362ac396-74ed-4ada-ae75-ed7fd326c4e2\"}":{"__typename":"Education","uuid":"362ac396-74ed-4ada-ae75-ed7fd326c4e2","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Political Science, Business","degree":null},"Testimonial:34d60898-d97c-4995-9ba7-3d0ae8cf717e":{"__typename":"Testimonial","id":"34d60898-d97c-4995-9ba7-3d0ae8cf717e","text":"Jess Malkin warmly welcomed us to Chicago for various Curious Cardinals workshops and shared her story as a Curious Cardinals mom. \n\nWe’re so grateful to have her as a Curious Cardinals mom \u0026 champion💛\n#CuriousCardinals #parentstories #Inspiration","date":"2025-05-26 22:41:57+00","rating":null,"endorser":{"__typename":"Endorser","name":"Jessica Malkin","tagline":null,"avatar":null}},"Testimonial:59fe32fd-b4e7-4ae9-9146-c5f4cce71e06":{"__typename":"Testimonial","id":"59fe32fd-b4e7-4ae9-9146-c5f4cce71e06","text":"I highly recommend Curious Cardinals for specialized mentorship. Shulamit has been instrumental in guiding my daughter's extracurricular passions, focusing her efforts, and helping her amplify her strengths. I love that CC makes an incredible effort to match your child with the right mentor. That relationship makes all the difference!","date":"2024-01-08 16:09:00.638+00","rating":5,"endorser":{"__typename":"Endorser","name":"Aliza Licht","tagline":null,"avatar":"https://cdn.senja.io/public/avatar/c04469cd-6ad5-4a04-bb40-6e91bb99db30_croppedheadshot%20%289%29.png"}},"MentorPublicProfile:{\"uuid\":\"299e8051-9ef4-453d-887e-0d77a1756a59\"}":{"__typename":"MentorPublicProfile","uuid":"299e8051-9ef4-453d-887e-0d77a1756a59","displayName":"Shula H.","slug":"shulamit-horton","biography":"\u003cp\u003eShula graduated from Vanderbilt University in 2023, summa cum laude, where she studied Political Science and minored in Business. During her time at Vanderbilt, her favorite classes were \"Middle East Politics,\" \"The Modern British Novel,\" \"Unity and American Democracy,\" and \"Business Management.\" Outside the classroom, Shula was actively involved with Women in Business, serving as President and empowering fellow female-identifying students in their career journeys. Shula also worked as a Tour Guide, connecting with prospective Vandy students and creating an exciting campus environment.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOriginally from the suburbs of Chicago, Shula was engaged in student council during high school and led her school's annual charity fundraiser, raising over $200,000! She also volunteered with the United States Holocaust Memorial Museum, where she first developed a passion for education. Shula was honored as part of the Jewish United Fund's 18-Under-18 Cohort for this work.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eDuring her summers in college, Shula explored the intersection of social impact and business. She worked as a Grants and Development intern at the Illinois Holocaust Museum, a Digital Strategy intern at EY in Israel, and a Summer Associate at EY-Parthenon. During the summer of 2021, Shula took part in the Birthright Israel Excel fellowship where she had the opportunity to live in Tel Aviv and learn from other Jewish business leaders from around the world.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow residing in New York City, Shula works full-time for Curious Cardinals as Family Operations and Strategy Manager. She is passionate about using education and EdTech as a lever for social change.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her free time, you can find Shula reading, listening to podcasts, searching for the best iced coffee in town, or experimenting with new recipes. Her all-time favorite books are \u003cem\u003eThe Nightingale \u003c/em\u003eby Kristin Hannah, \u003cem\u003eEducated\u003c/em\u003e by Tara Westover, and \u003cem\u003eBefore We Were Yours\u003c/em\u003e by Lisa Wingate.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShula is thrilled to be a part of the Curious Cardinals team!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"95e9b664-9e00-4c84-8dad-446fc2b481cd\"}"},{"__ref":"Favorites:{\"uuid\":\"8cb87d53-e4f8-4d57-a228-6dce1621159f\"}"},{"__ref":"Favorites:{\"uuid\":\"96357a57-83fc-4b5b-8133-f713db148dfb\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"924da8b8-2ea0-4f1b-afdb-9fb9f58cd7f9\"}"}],"major":"Political Science, Business","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"36dca721-7ac8-4815-b9ce-d5674a3882e0\"}"},{"__ref":"DeepDives:{\"uuid\":\"a1b61d13-e4be-4121-95be-87d268e0ad35\"}"},{"__ref":"DeepDives:{\"uuid\":\"ce906380-62a2-4cc2-ab5b-5ada805a9d03\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/283b485d-9443-492d-a21c-d9676f29395e/-/preview/-/format/jpg/","https://ucarecdn.com/c84b39a1-efb4-4f1c-b09c-fd7bd995f81b/-/preview/-/format/jpg/","https://ucarecdn.com/7be59b6c-1613-480a-b9f0-81fa9f6c77ab/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8ab2ef7b-9905-47b3-b37e-60cc6ed08b14\"}"},{"__ref":"Education:{\"uuid\":\"362ac396-74ed-4ada-ae75-ed7fd326c4e2\"}"}],"hiredAt":"2023-09-30T07:01:15.733Z","topics":["Business / Entrepreneurship","Journalism","Negotiation","Executive Function","College Essay Writing","Academic Coaching","Writing","History","Reading","Law / Government / Policy","Public Speaking","History Project","Literature"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/3fe96660-66b0-4395-b48d-3044e8987993/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:34d60898-d97c-4995-9ba7-3d0ae8cf717e"},{"__ref":"Testimonial:59fe32fd-
