xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"f607b5fd-2a1a-47be-8b05-4dee7196fe02\"}":{"__typename":"CausesSupported","uuid":"f607b5fd-2a1a-47be-8b05-4dee7196fe02","name":"Doctors Without Borders","description":"\u003cp\u003eEveryone deserves to be healthy and happy! I donate monthly.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/30563a03-b197-4ebb-99cd-8257a2a514d4/"},"CausesSupported:{\"uuid\":\"0dea3680-2905-443e-9d80-13f2a470be8e\"}":{"__typename":"CausesSupported","uuid":"0dea3680-2905-443e-9d80-13f2a470be8e","name":"Epilepsy Foundation","description":"\u003cp\u003eI raised $600+ and represented EF Texas in the 2022 Houston Marathon!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/f3dafb92-b8e7-4d3e-9120-273421d655a1/"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"afda78c2-e9c0-47bf-b419-7670e3fca2db\"}":{"__typename":"DeepDives","uuid":"afda78c2-e9c0-47bf-b419-7670e3fca2db","content":"\u003cp\u003eGrowing up in San Diego, CA, I was a 30-minute drive from the US-MX border. Volunteering for refugees and migrant communities in Tijuana, MX, I realized that I wanted to do more. After graduating, I'll be working on an independent research project that aims to understand and advocate for the mental health services of these communities. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0fcd8090-0079-4ba7-9be3-2ff9cdcae43d\"}":{"__typename":"DeepDives","uuid":"0fcd8090-0079-4ba7-9be3-2ff9cdcae43d","content":"\u003cp\u003eGrowing up in a low-income family, I didn't have access to alot of paid resources, which was why I often had to learn things on my own or reach out to those around me. Thanks to my friends and upperclassmen that I met through classes and clubs, I gained alot of insight and experience. This was really helpful during the college application process, and continued to guide me as I entered university. As a CC mentor, I want to be there for someone else and offer myself as a resource for inspiration and guidance. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"18d1c008-aa1e-4027-9b0a-5a4e8437d604\"}":{"__typename":"DeepDives","uuid":"18d1c008-aa1e-4027-9b0a-5a4e8437d604","content":"\u003cp\u003eIn high school, I was really into competitive swimming, which meant hours of practice every day. Because of all the commitment, I learned to balance challenging AP courses with practices and meets. On top of discipline, I improved my time management skills and was still able to hang out with friends and play video games as a student-athlete. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"1a44a6ac-3c34-477f-83a8-55d827963131\"}":{"__typename":"DeepDives","uuid":"1a44a6ac-3c34-477f-83a8-55d827963131","content":"\u003cp\u003eMy greatest role model is my dad. Ever since I was little, he's taught me to dream big and work hard, but also to enjoy the important things in life, like eating good food or spending time with friends and family. Even though he immigrated from another country and doesn't quite understand the things I learn or do in college, he's always super supportive and encouraging.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"055af12a-27b8-4627-9f53-56c254a34ec6\"}":{"__typename":"School","uuid":"055af12a-27b8-4627-9f53-56c254a34ec6","name":"Scripps Ranch High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92131"},"Education:{\"uuid\":\"51cd9f76-cfb1-4ab2-95dc-141d3fe5a820\"}":{"__typename":"Education","uuid":"51cd9f76-cfb1-4ab2-95dc-141d3fe5a820","school":{"__ref":"School:{\"uuid\":\"055af12a-27b8-4627-9f53-56c254a34ec6\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}":{"__typename":"School","uuid":"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41","name":"Rice University","city":"Houston","type":"COLLEGE","state":"Texas","country":"United States","zip":"77005"},"Education:{\"uuid\":\"38fd386d-7a45-4e57-ba00-fd7cd8aef798\"}":{"__typename":"Education","uuid":"38fd386d-7a45-4e57-ba00-fd7cd8aef798","school":{"__ref":"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"c7360b67-bcb7-4c30-89ca-7f88d3a1a9cd\"}":{"__typename":"MentorPublicProfile","uuid":"c7360b67-bcb7-4c30-89ca-7f88d3a1a9cd","displayName":"Samuel L.","slug":"samuel-lee","biography":"\u003cp\u003eHi there! I'm Sam and I recently graduated from Rice University in Houston, TX. Despite being an honorary Texan, I consider myself a Californian at heart and am originally from sunny San Diego. I studied Neuroscience and Spanish, with the goal of pursuing a future in medicine, research, and service.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSome of my hobbies include running marathons, playing pickup basketball, reading, and listening to music - I've actually started learning how to DJ recently! I've done a lot of cool things in college. For example, I'm a full-fledged EMT and have ridden in ambulances and worked in hospital ER's. I've done research in a neuroscience lab where I've seen mice brains sliced into sheets thinner than paper. I've also gotten to travel abroad and work with a nonprofit in Quito, Ecuador, where I taught children in schools for two months. Because I'm from a low-income family with immigrant parents, navigating higher education and seeking out resources was definitely a challenge. I'm fortunate to be where I am today and it wouldn't have been possible without the support of my friends and mentors, which is why I want to pay it forward as a mentor for Curious Cardinals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you are interested in anything related to medicine, science, service, language, travel, or college in general, I'm here for you. I can tutor you in all sorts of subjects or guide you through your own projects and goals. Most importantly, I just want to help you discover and develop something that you care about!\u003c/p\u003e","teachingVideoPlaybackId":"1iJ3HH8uF6h02uaNtraY5WO1Y19BP6NS02mib100tE2i34","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"f607b5fd-2a1a-47be-8b05-4dee7196fe02\"}"},{"__ref":"CausesSupported:{\"uuid\":\"0dea3680-2905-443e-9d80-13f2a470be8e\"}"}],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"afda78c2-e9c0-47bf-b419-7670e3fca2db\"}"},{"__ref":"DeepDives:{\"uuid\":\"0fcd8090-0079-4ba7-9be3-2ff9cdcae43d\"}"},{"__ref":"DeepDives:{\"u
