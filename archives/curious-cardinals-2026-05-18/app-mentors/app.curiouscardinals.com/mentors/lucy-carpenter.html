xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"0b2c62b5-47c0-4565-9ca2-31fb081e2e2c\"}":{"__typename":"Education","uuid":"0b2c62b5-47c0-4565-9ca2-31fb081e2e2c","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":null,"endYear":null,"expectedGradYear":"2024","major":"English ","degree":"Bachelor of Arts "},"MentorPublicProfile:{\"uuid\":\"83d2a419-000d-4cfc-9786-180e82b1972c\"}":{"__typename":"MentorPublicProfile","uuid":"83d2a419-000d-4cfc-9786-180e82b1972c","displayName":"Lucy C.","slug":"lucy-carpenter","biography":"Hi! My name is Lucy Carpenter, I’m a writer, poet, actor, artist, and student studying English literature at Brown University. I am most passionate about art and writing, have had my poetry and prose published in independent magazines, and would most like to mentor learners passionate about reading and writing!\n\nBefore going to Choate Rosemary Hall in Wallingford, Connecticut for high school, I grew up in New York, New Jersey, Vermont, and North Carolina. In high school I was part of an arts program concentrating in visual studio art for three years in which I mounted exhibitions of my work, compiled a portfolio, and explored the visual medium with incredible teachers and mentors. I directed a play for my high schools fringe festival, acted at brown in a 24 hour play festival, and recently acted on camera for the first time in a film made with the Brown Motion Pictures production company. \n\nIn high school I worked with a group called BEP (bystander education program) to work with the student body on relationship and hookup culture at our school. At Brown I’ve continued this work by being a part of SAPE (sexual assault peer educators) in which I facilitate conversations fostering safety, inclusivity, and responsibility in student groups. This is work I’ve continued over the summer as an intern at Aware Inc., a social services organization in Hardwick, Vermont working with families seeking relief from abuse and resources for safety. \n\nFor fun I love to read (my favorite authors are Pynchon, Joyce, and Nabokov), listen to music (I love rock, folk, and jazz music), talk about books, paint, and make music with my friends. I also enjoy running, yoga, and meditation, which help me clear my mind to be a better thinker, daughter, sister, and friend. \n\nMy favorite thing about mentoring has been seeing the incredible work my mentees make - mentoring in poetry writing has been unbelievably rewarding as I get to learn not only my mentees' approach to writing, but also about their minds and life. I have been so lucky to learn so much about drive, motivation, and commitment from my current mentee! \n\nIn the future I would like to combine my skills in writing and social work to pursue journalism and reporting to represent overlooked issues and communities to a large readership with an end goal of understanding, empathy, and community betterment. ","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English ","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/b2497d1b-8ec3-40e5-afe1-3cb5b6e93f4d/-/crop/692x692/116,0/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0b2c62b5-47c0-4565-9ca2-31fb081e2e2c\"}"}],"hiredAt":"2022-11-07T22:43:22.000Z","topics":["Philosophy","Literature","History Project","History","Film / Theater","Women \u0026 Gend
