xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9d1353fa-e0d8-4d71-8098-3de7a3908d44\"}":{"__typename":"DeepDives","uuid":"9d1353fa-e0d8-4d71-8098-3de7a3908d44","content":"\u003cp\u003eI would tell my middle or high school self to keep dancing at his studio, because his training and somatic practices there will ground and carry him through the academic demands of college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3b1e363e-bef6-4b67-b6af-3c0aa2daf446\"}":{"__typename":"DeepDives","uuid":"3b1e363e-bef6-4b67-b6af-3c0aa2daf446","content":"\u003cp\u003eI had some really great mentors in my older brother and his friends, who, without their guidance, I wouldn't have even known what questions to ask to go where I wanted to go, or had peers to share and support my interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"aaa6057a-ce49-495f-a32a-e5032b19a50e\"}":{"__typename":"DeepDives","uuid":"aaa6057a-ce49-495f-a32a-e5032b19a50e","content":"\u003cp\u003eI spent summers in high school taking extra classes at my local community college and attending the Medill Cherubs journalism program at Northwestern outside Chicago, IL.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"57aa2798-1152-4955-9281-b76b69c9a013\"}":{"__typename":"DeepDives","uuid":"57aa2798-1152-4955-9281-b76b69c9a013","content":"\u003cp\u003eI chose my major because the psychology department was big enough to offer academic opportunities but small enough for its professors to offer enough one-on-one mentorship and support. I felt that the professors in the department cared about and would go out of their way for me to support a young academic. They cared about teaching what they know, not just their own research or tenure track milestones.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"c84009d3-f66f-4281-8342-b3d66e547d95\"}":{"__typename":"School","uuid":"c84009d3-f66f-4281-8342-b3d66e547d95","name":"Roseville High School","city":"Roseville","type":"HIGH","state":"California","country":"Estados Unidos","zip":"95678"},"Education:{\"uuid\":\"aef7c8c7-b08e-4735-9714-52575fff688e\"}":{"__typename":"Education","uuid":"aef7c8c7-b08e-4735-9714-52575fff688e","school":{"__ref":"School:{\"uuid\":\"c84009d3-f66f-4281-8342-b3d66e547d95\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"89a38cbe-6058-4bf2-84be-64949656a31e\"}":{"__typename":"School","uuid":"89a38cbe-6058-4bf2-84be-64949656a31e","name":"Universidad Stanford","city":"Stanford","type":"COLLEGE","state":"California","country":"Estados Unidos","zip":"94305"},"Education:{\"uuid\":\"6dcce7
