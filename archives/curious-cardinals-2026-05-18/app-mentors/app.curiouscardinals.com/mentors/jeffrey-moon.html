xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1b61df9a-27db-494a-9d05-0b19f9cc48aa\"}":{"__typename":"Favorites","uuid":"1b61df9a-27db-494a-9d05-0b19f9cc48aa","photoUrl":"https://ucarecdn.com/72eb8105-e20c-43cc-a487-524745ce723f/","title":"Basketball","type":"SPORT"},"Favorites:{\"uuid\":\"21a2651d-44b3-48d3-a8cb-44bec4ea4183\"}":{"__typename":"Favorites","uuid":"21a2651d-44b3-48d3-a8cb-44bec4ea4183","photoUrl":"https://ucarecdn.com/9e3f10da-9334-4b63-9d54-4b9a4e823a6f/","title":"Pride and Prejudice","type":"BOOK"},"Favorites:{\"uuid\":\"7bb8fc68-a6fd-4200-adf0-af6fa8c9de58\"}":{"__typename":"Favorites","uuid":"7bb8fc68-a6fd-4200-adf0-af6fa8c9de58","photoUrl":"https://ucarecdn.com/215a6655-4ae7-4ece-873c-5ecbc96c3eab/","title":"I Love You, I'm Sorry","type":"SONG"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9d069f25-e440-490d-868c-ab4436399147\"}":{"__typename":"DeepDives","uuid":"9d069f25-e440-490d-868c-ab4436399147","content":"\u003cp\u003eThe current world is changing rapidly, and we never know what is to come next. I find it foolish to attempt to focus on a specific field starting from your undergraduate years, thinking that it will become your future. \u003c/p\u003e\u003cp\u003eI chose physics as my major not only because I simply enjoy studying it, but also because it is much easier to study narrower and specific fields later, starting from a natural science background, instead of the other way around. I also personally think undergraduate years are where you must truly strengthen and build your foundational knowledge that will last your lifetime, given that our prefrontal cortex stops developing around 27. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e972df3b-118a-4388-8317-5babea08edf1\"}":{"__typename":"DeepDives","uuid":"e972df3b-118a-4388-8317-5babea08edf1","content":"\u003cp\u003eOne simple piece of advice is to always answer the question of why I am doing something before answering what I am doing and how I will do it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c6099f10-c341-4370-967a-61ae719418f6\"}":{"__typename":"DeepDives","uuid":"c6099f10-c341-4370-967a-61ae719418f6","content":"\u003cp\u003eMy dream job is to own the largest research facility in the world. Every time I get the question about \"if you had unlimited amounts of money, what would you do?\", I always say that I want to build the largest research facility that will have every tool and resource needed to build, research, and test anything. It will naturally attract the greatest minds around the world to work together, and I hope I can take part in the process both as a researcher and as a supporter. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}":{"__typename":"School","uuid":"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5","name":"Choate Rosemary Hall","city":"Wallingford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06492"},"Education:{\"uuid\":\"77f22462-3b1b-4d0a-85bb-5a6f1314e723\"}":{"__typename":"Education","uuid":"77f22462-3b1b-4d0a-85bb-5a6f1314e723","school":{"__ref":"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}"},"startYear":"2023","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"15673b93-50a7-4460-be48-578ca4b26f9e\"}":{"__typename":"Education","uuid":"15673b93-50a7-4460-be48-578ca4b26f9e","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2026","endYear":null,"expectedGradYear":"2029","major":"Physics \u0026 Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"86c0a86b-4b0a-4e94-8386-5c5611e0ca33\"}":{"__typename":"MentorPublicProfile","uuid":"86c0a86b-4b0a-4e94-8386-5c5611e0ca33","displayName":"Jeffrey M.","slug":"jeffrey-moon","biography":"\u003cp\u003eHi! I’m Jeffrey, a student at the University of Pennsylvania majoring in Physics and Computer Science.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003ch1\u003e\u003cstrong\u003eMy Background and Achievements\u003c/strong\u003e\u003c/h1\u003e\u003cp\u003eI am a researcher in the Yale Vision Lab, researching multimodal depth estimation and continual learning, with publications in CVPR and NeurIPS. I am also part of the software team of Penn Electric Racing, the university’s prestigious Formula SAE Electric Team, focusing on implementation and design of the autonomous system for the FSAE Driverless division. I also did many passion projects throughout my time as a student, where I self-taught many skills like soldering, CAD, PCB design, etc.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI won the Jon Chapitis Spirit of Innovation Award and Next Step Inventors Award from one of the passion projects that I submitted to the Connecticut Science and Engineering Fair (CSEF). I was an AIME qualifier all throughout high school and am in the Platinum division for USACO. I won different events such as AI Soccer and Team Creative Problem Solving in IROC for consecutive years while I was in Korea. Recently, I was able to win the Most Impactful Project amongst 283 teams that participated in NexHacks.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003ch1\u003e\u003cstrong\u003eWhat I Can Offer\u003c/strong\u003e\u003c/h1\u003e\u003cp\u003eI mentor students to work on passion projects on robotics and AI/Machine Learning or more broadly any computer science project. These projects can head in different directions such as submitting to science fairs, research journals or conferences, or scholarships.\u0026nbsp;\u003c/p\u003e\u003cp\u003eSpecific fields that I can provide better guidance are\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eNatural Language Processing (using text and AI)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eComputer Vision (using different sensors and AI)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEngineering Projects (any “building” project such as making custom mobile robots or drones)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePhysics Simulation\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eApart from the project itself, I teach students fundamentals of the research experience, ranging from tools such as LaTeX and GitHub to skills like reading papers or presenting your own work. As a student who stepped into research as a high schooler, I know the struggles that comes from this first step and hope to help alleviate this burden.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003ch1\u003e\u003cstrong\u003eOutside of Academics\u003c/strong\u003e\u003c/h1\u003e\u003cp\u003eI spend my free time playing basketball with my friends, taking random walks around campus, reading books, and, more recently, crocheting. I enjoy playing the trumpet for Penn Jazz and picked up the bass guitar last summer. I also played the trumpet for the Penn Band, playing at football games and basketball games, and sometimes played for pit orchestras of different musicals and shows. I’m always open to picking up new hobbies, so feel free to introduce me to your favorite hobby!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you are a student who is willing to take the next step to transform your knowledge and skills into something meaningful, I would love to help you.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"02rs7j5HX00Sei00NatAwNH00s6iP02ndFxUopMp6TqYlPS8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1b61df9a-27db-494a-9d05-0b19f9cc48aa\"}"},{"__ref":"Favorites:{\"uuid\":\"21a2651d-44b3-48d3-a8cb-44bec4ea4183\"}"},{"__ref":"Favorites:{\"uuid\":\"7bb8fc68-a6fd-4200-adf0-af6fa8c9de58\"}"}],"causesSupported":[],"major":"Physics \u0026 Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9d069f25-e440-490d-868c-ab4436399147\"}"},{"__ref":"DeepDives:{\"uuid\":\"e972df3b-118a-4388-8317-5babea08edf1\"}"},{"__ref":"DeepDives:{\"uuid\":\"c6099f10-c341-4370-967a-61ae719418f6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ccd47218-748b-4899-9f0e-1d6f6b749351/-/preview/-/format/jpg/","https://ucarecdn.com/62892efd-396b-491a-9a7d-65744b38c2c3/-/preview/-/format/jpg/","https://ucarecdn.com/f7f0f293-bc51-47ea-a072-4473eed15a47/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"77f22462-3b1b-4d0a-85bb-5a6f1314e723\"}"},{"__ref":"Education:{\"uuid\":\"15673b93-50a7-4460-be48-578ca4b26f9e\"}"}],"hiredAt":"2026-04-23T02:52:55.787Z","topics":[],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonia
