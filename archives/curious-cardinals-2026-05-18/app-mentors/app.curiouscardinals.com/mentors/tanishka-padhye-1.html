xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"15b0f388-95e6-40b1-aa3e-2fd5cfa94ac7\"}":{"__typename":"Favorites","uuid":"15b0f388-95e6-40b1-aa3e-2fd5cfa94ac7","photoUrl":"https://ucarecdn.com/16b8de22-f78d-4767-a583-a05c607c488a/","title":"Right Here, For Now","type":"SONG"},"Favorites:{\"uuid\":\"a7415832-6a6e-47ba-9604-d4cf8ffbe3bd\"}":{"__typename":"Favorites","uuid":"a7415832-6a6e-47ba-9604-d4cf8ffbe3bd","photoUrl":"https://ucarecdn.com/97f6e553-30c8-4378-aa12-ff13d1bc2ece/","title":"Rovinj, Croatia","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4b092c34-7fdd-4d1b-85c0-5b2fa544fb2a\"}":{"__typename":"DeepDives","uuid":"4b092c34-7fdd-4d1b-85c0-5b2fa544fb2a","content":"\u003cp\u003eMentorship matters to me because it has shaped nearly every important part of my life. I grew up surrounded by mentors, especially my parents and coaches, who guided me not just in skills but in how to think, handle setbacks, and grow as a person. Their support showed me that mentorship is more than instruction. It is companionship and a sense of safety. It is knowing there is someone whose purpose, in that moment, is to help you move forward. As I started mentoring younger fencers and teaching students through Virtually Verbal, I experienced the other side of that relationship. Helping someone else gain confidence and clarity is deeply rewarding. Mentorship creates a shared space where both people learn and grow. For me, it is about building trust, offering steady support, and passing forward the guidance that has meant so much in my own life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"3d74d00e-e4ab-4c4b-be35-818abc17067f\"}":{"__typename":"DeepDives","uuid":"3d74d00e-e4ab-4c4b-be35-818abc17067f","content":"\u003cp\u003eHelping people. From the smallest gestures to truly life-changing moments, it genuinely overwhelms me with this sense of joy and purpose. I remember helping a young fencer choose which glove to buy. I spent time explaining the differences, watching their face light up when they found the perfect fit. I've coached an older teammate through the mental battle of getting back up after a devastating loss, talking through what went wrong and what could go differently next time. I taught French to a student all the way in India who needed it for a job opportunity they'd been dreaming about. No matter the scale, whether it's a five-minute conversation or weeks of dedicated work, seeing that tangible result, that moment when something clicks or when someone succeeds because of our collaboration, it makes every single bit of effort feel ten times more worthwhile. there's something about knowing you've made even a small difference in someone's journey that just fuels everything else I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4d6b105c-0c76-4b1b-85cd-888e2b2edc0f\"}":{"__typename":"DeepDives","uuid":"4d6b105c-0c76-4b1b-85cd-888e2b2edc0f","content":"\u003cp\u003eI love art, honestly any form of it. painting my nails with intricate designs, painting cups and mugs to give as gifts or keep for myself, sewing clothes or fixing things that need mending; anything creative really gets me going. I also have other extracurriculars that fill up my schedule. I'm currently learning how to fly, which has been incredibly exhilarating every single time I'm up there. I also know how to scuba dive, and there's something so peaceful about being underwater, just floating in this completely different world. but honestly, on a busy day when I'm stretched thin and don't have the energy for anything elaborate, I tend to just take my dog to the dog park. it's simple, low-key, but watching him run around and play with other dogs while I sit on a bench and breathe for a second, it's genuinely one of my favorite ways to decompress and reset. sometimes the smallest routines are the most grounding ones.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8ccccd34-37a6-43a6-bdbc-0ace9b3d0234\"}":{"__typename":"DeepDives","uuid":"8ccccd34-37a6-43a6-bdbc-0ace9b3d0234","content":"\u003cp\u003eMy biggest goal is to learn as much as I can about everything. I want to go into business eventually, the growth of a company is super fascinating to me, or figuring out the marketability and branding of a company, what makes people connect with it. I also loved chemistry in high school and didn't want to completely give that up. design lets me take classes across so many different fields and gives me this well-rounded education that can actually prep me for any job I end up pursuing. it's flexible in the best way possible, letting me explore what I'm genuinely curious about without boxing myself into one narrow path too early.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"8dabba04-d77c-4cdc-a717-020407052971\"}":{"__typename":"School","uuid":"8dabba04-d77c-4cdc-a717-020407052971","name":"The Awty International School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77055"},"Education:{\"uuid\":\"f64e121c-d9fd-4c3e-ba79-5c9f36879d74\"}":{"__typename":"Education","uuid":"f64e121c-d9fd-4c3e-ba79-5c9f36879d74","school":{"__ref":"School:{\"uuid\":\"8dabba04-d77c-4cdc-a717-020407052971\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"8b35ffe3-7bdc-4058-ad9c-2bbdbb72b7e8\"}":{"__typename":"Education","uuid":"8b35ffe3-7bdc-4058-ad9c-2bbdbb72b7e8","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Design, Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"903cfd74-7433-48b0-aaf8-dba553ff0f85\"}":{"__typename":"MentorPublicProfile","uuid":"903cfd74-7433-48b0-aaf8-dba553ff0f85","displayName":"Tanishka P.","slug":"tanishka-padhye-1","biography":"\u003cp\u003eHi! I’m a first-year student at Stanford and an international-level varsity fencer who’s passionate about education, mentorship, and helping students turn big ideas into real projects. A lot of my academic growth came through the International Baccalaureate program, where I completed research-heavy coursework in science and the humanities. Designing experiments and long-term investigations taught me how to manage complex projects and explain difficult concepts clearly. I now specialize in academic mentorship and project-based learning, especially in STEM subjects and research writing. I work best with students who want help building strong foundations, improving study systems, or developing independent projects.\u003c/p\u003e\u003cp\u003eI co-founded Virtually Verbal, a nonprofit that expands access to language education through peer-to-peer teaching. Working with a team, I helped grow the program to reach over 250 students across 15+ countries and built partnerships with schools and nonprofits. I’ve taught students from diverse backgrounds and learned how to adapt lessons to different learning styles and goals. These experiences shaped my mentoring approach: sessions with me are structured, collaborative, and focused on problem-solving. We break big tasks into manageable steps, practice active learning, and build habits that last beyond a single assignment. I’m especially interested in helping students develop time management, confidence, and critical thinking skills alongside academic content.\u003c/p\u003e\u003cp\u003eOutside the classroom, fencing has been a huge part of my life. Starting at an older age than my peers to competing internationally has taught me discipline, resilience, and how to perform under pressure. I bring that mindset into mentoring by creating a supportive environment where mistakes are part of learning and progress comes from steady practice. When I’m not studying or training, I enjoy exploring languages, traveling, and working on creative projects. I speak English fluently and am conversational in French, Hindi, and Marathi. As a mentor, I prioritize clear communication with students and families so goals stay aligned and progress is visible. Each session is tailored to individual needs, whether that’s preparing for exams, strengthening fundamentals, or exploring new interests. My goal is to be someone students feel comfortable learning with: organized, encouraging, and genuinely invested in helping them grow into confident, independent learners.\u003c/p\u003e","teachingVideoPlaybackId":"K01kvyCHuR00hO01dkD4D8PgIIlzjPgwwVyRihap018cqR00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"15b0f388-95e6-40b1-aa3e-2fd5cfa94ac7\"}"},{"__ref":"Favorites:{\"uuid\":\"a7415832-6a6e-47ba-9604-d4cf8ffbe3bd\"}"}],"causesSupported":[],"major":"Design, Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4b092c34-7fdd-4d1b-85c0-5b2fa544fb2a\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d74d00e-e4ab-4c4b-be35-818abc17067f\"}"},{"__ref":"DeepDives:{\"uuid\":\"4d6b105c-0c76-4b1b-85cd-888e2b2edc0f\"}"},{"__ref":"DeepDives:{\"uuid\":\"8ccccd34-37a6-43a6-bdbc-0ace9b3d0234\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/aaf589bb-3052-4a8c-ab98-51aff753fe5c/-/preview/-/format/jpg/","https://ucarecdn.com/1bced760-df95-48ef-97e0-4d84ff77132b/-/preview/-/format/jpg/","https://ucarecdn.com/e1946343-0fd5-4252-a565-7958e65b2719/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f64e121c-d9fd-4c3e-ba79-5c9f36879d74\"}"},{"__ref":"Education:{\"uuid\":\"8b35ffe3-7bdc-4058-ad9c-2bbdbb72b7e8\"}"}],"hiredAt":"2026-02-07T02:09:26.733Z","topics":["Fashion / Cosmetics","K-6 Storybook","Business / Entrepreneurship","Sustainability"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tanishka-padhye-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"903cfd74-7433-48b0-aaf8-dba553ff0f85\"}"}}},"_sentryTraceData":"c853db92d8394a48bfbcdb991ab8f5b5-be9c80fdef5c2866-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c853db92d8394a48bfbcdb991ab8f5b5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/me
