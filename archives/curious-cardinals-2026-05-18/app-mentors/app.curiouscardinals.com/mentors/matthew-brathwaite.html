xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7cc136c2-3805-4edb-81dc-317302bf3229\"}":{"__typename":"Favorites","uuid":"7cc136c2-3805-4edb-81dc-317302bf3229","photoUrl":"https://ucarecdn.com/ac4d083f-4ec1-475f-9ddc-f192f176650c/","title":"LeBron James","type":"ATHLETE"},"Favorites:{\"uuid\":\"724b8099-2b26-4784-bdd0-1c5064acdff4\"}":{"__typename":"Favorites","uuid":"724b8099-2b26-4784-bdd0-1c5064acdff4","photoUrl":"https://ucarecdn.com/97543a5e-29cb-4dac-896c-f89b9f2d0edf/","title":"Drake","type":"ARTIST"},"Favorites:{\"uuid\":\"da918a28-6d75-4881-af5a-766d3907f9f3\"}":{"__typename":"Favorites","uuid":"da918a28-6d75-4881-af5a-766d3907f9f3","photoUrl":"https://ucarecdn.com/8954c39a-1e15-4fa4-af5c-c49d0057e8c5/","title":"Basketball","type":"SPORT"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3ee8fbe0-8c14-4903-a34a-ccaaf5c49171\"}":{"__typename":"DeepDives","uuid":"3ee8fbe0-8c14-4903-a34a-ccaaf5c49171","content":"\u003cp\u003eDuring my spare time, I love to hang out with my dog, play basketball with my friends, or just relax and listen to music. Recently, I have also started diving deeper into the world of fashion and reading the book, \u003cem\u003eLucky Me,\u003c/em\u003e by Rich Paul. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"165c5f90-2be4-4922-a025-0e28df3aeb15\"}":{"__typename":"DeepDives","uuid":"165c5f90-2be4-4922-a025-0e28df3aeb15","content":"\u003cp\u003eMy greatest role models have to be my parents. From a young age, both my mom and dad taught me what it meant to work hard, to always do what is right, and to advocate for what I believe in. My parents built me up to be the man I am today and I will be forever grateful for their guidance and their sacrifices they have made for me throughout my lifetime.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"9f3b90cd-4e40-4aac-8cd9-910633f30815\"}":{"__typename":"DeepDives","uuid":"9f3b90cd-4e40-4aac-8cd9-910633f30815","content":"\u003cp\u003eI am extremely proud and grateful for the relationship I have with my younger brother. My younger brother, Jordan, is my best friend and I am extremely proud of how we have stayed close during my time away for school and continued to push each other to be the best versions of ourselves. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis fall, Jordan will be attending Yale University as a member of their varsity basketball team.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c35e96e2-127f-4ee0-ba27-b2cc65bc72b4\"}":{"__typename":"DeepDives","uuid":"c35e96e2-127f-4ee0-ba27-b2cc65bc72b4","content":"\u003cp\u003eTry to put your best foot forward in everything you do. Whether it is one of your classes at school, a club you participate in, or a sport you play, always make sure you are giving it your all! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere are going to be some classes you don't like, times where you don't feel like engaging in your club, times when you are too tired to practice your sport, or your instrument, or your art, or whatever it is that you are passionate about. These feelings are normal! But I challenge you to push past them. I challenge you to persevere, to go the extra mile, to be resilient. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the worst feelings in life is to look back and know you could have done more. Focus on what you can do now, in the present, in order to build towards your goals and commit to getting those things done!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"64f9f9ff-a5ba-4755-a322-0b82a27e58c0\"}":{"__typename":"Education","uuid":"64f9f9ff-a5ba-4755-a322-0b82a27e58c0","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Public Policy","degree":null},"School:{\"uuid\":\"0fe8db0d-4ece-4b2d-af86-9d4b833f28a3\"}":{"__typename":"School","uuid":"0fe8db0d-4ece-4b2d-af86-9d4b833f28a3","name":"Reservoir High School","city":"Fulton","type":"HIGH","state":"Maryland","country":"United States","zip":"20759"},"Education:{\"uuid\":\"bd486b2a-96ab-4ce9-950c-2f45a16c21ec\"}":{"__typename":"Education","uuid":"bd486b2a-96ab-4ce9-950c-2f45a16c21ec","school":{"__ref":"School:{\"uuid\":\"0fe8db0d-4ece-4b2d-af86-9d4b833f28a3\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"bb7cc3c4-c0bd-41d7-86cb-ad0f04e5800e\"}":{"__typename":"MentorPublicProfile","uuid":"bb7cc3c4-c0bd-41d7-86cb-ad0f04e5800e","displayName":"Matthew B.","slug":"matthew-brathwaite","biography":"\u003cp\u003eMatthew is a rising junior at Duke University studying Public Policy and Economics. His love for sports has been a driving force in his life, shaping his academic and career aspirations. In high school, Matthew was a two-sport varsity athlete (baseball and basketball), and his passion for both athletics and learning earned him the Mike Williams Integrity Award, which recognizes one student-athlete each year for exceptional leadership, perseverance, and excellence both on and off the playing field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Duke, Matthew continues to pursue his passion for sports. He serves as a practice player for the women’s basketball team, a youth basketball coach in the Durham community, and a sports writer for the school’s newspaper. His dedication to athletics inspired him to start a podcast with his friends called Inside The Lines, which highlights the stories of some of the best athletes in the world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, Matthew hopes to help students find excitement in learning and give mentees the confidence to pursue their own dreams and aspirations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn his free time, Matthew loves to go to the gym, spend time with his dog, and participate in all things basketball. Recently, he has also started to explore the world of fashion and is reading the book \"Lucky Me\" by Rich Paul.\u003c/p\u003e","teachingVideoPlaybackId":"MS2J7taQXiEiTVEVK02T3INVxusDTJNdnJyBWVnnWKwM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7cc136c2-3805-4edb-81dc-317302bf3229\"}"},{"__ref":"Favorites:{\"uuid\":\"724b8099-2b26-4784-bdd0-1c5064acdff4\"}"},{"__ref":"Favorites:{\"uuid\":\"da918a28-6d75-4881-af5a-766d3907f9f3\"}"}],"causesSupported":[],"major":"Publ
