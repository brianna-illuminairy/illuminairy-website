xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3bdebd0e-d7db-4b79-8ad3-6bf7722a9a4a\"}":{"__typename":"Favorites","uuid":"3bdebd0e-d7db-4b79-8ad3-6bf7722a9a4a","photoUrl":"https://ucarecdn.com/73edecd9-4712-41f3-b3e3-e056e4111a1a/","title":"Swimming!","type":"SPORT"},"Favorites:{\"uuid\":\"f2b5f22e-eb8b-4bd4-87c3-0177485d1b36\"}":{"__typename":"Favorites","uuid":"f2b5f22e-eb8b-4bd4-87c3-0177485d1b36","photoUrl":"https://ucarecdn.com/77b75e37-f872-43f2-8dec-80dcab275cc3/","title":"Seven Husbands of Evevlyn Hugo","type":"BOOK"},"Favorites:{\"uuid\":\"54855002-a959-41ec-9ef8-f64798e1170f\"}":{"__typename":"Favorites","uuid":"54855002-a959-41ec-9ef8-f64798e1170f","photoUrl":"https://ucarecdn.com/9c6e737d-3086-4073-83e8-105baa4a04ab/","title":"Amsterdam","type":"CITY"},"Favorites:{\"uuid\":\"a044b565-0a18-47ce-a08b-b8a830c8e66c\"}":{"__typename":"Favorites","uuid":"a044b565-0a18-47ce-a08b-b8a830c8e66c","photoUrl":"https://ucarecdn.com/9c6e737d-3086-4073-83e8-105baa4a04ab/","title":"Amsterdam","type":"CITY"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"747b058e-6717-4511-8a33-e72cb41abcd8\"}":{"__typename":"DeepDives","uuid":"747b058e-6717-4511-8a33-e72cb41abcd8","content":"\u003cp\u003eMy greatest role model is my mom. My mom is an incredibly driven, accomplished, and selfless person. Not only has she made countless sacrifices to allow me to accomplish my goals, but she inspires me every day to be a kind person who is there for others. I hope to emulate her love and kindness in my relationship with my mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b51076ab-3970-43b0-94e1-2c864d7873e3\"}":{"__typename":"DeepDives","uuid":"b51076ab-3970-43b0-94e1-2c864d7873e3","content":"\u003cp\u003eI chose my undergraduate major by accident at first! I started off my freshman year as a Biology Pre-Vet major. I had completed high school internships at two kinds of vet clinics, and I was \u003cem\u003ecertain \u003c/em\u003ethat was my path. However, in a meeting going into the Spring semester of my freshman year, my advisor told me that unless I added a second major, I wouldn't have enough credits to remain a full-time student for 4 years. There was a new major--Biomedical Humanities Pre-Med--that she was encouraging students to try to enhance their graduate school applications. I signed up for my first class for that Spring, and I immediately realized I was less interested in the practice of medicine for people or animals, but rather I was interested in the complex, interdisciplinary questions that arise at the intersection of health, technology, ethics, and society. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f04e06c8-d056-4ae7-90a1-b63d9d03ed25\"}":{"__typename":"DeepDives","uuid":"f04e06c8-d056-4ae7-90a1-b63d9d03ed25","content":"\u003cp\u003eIf I'm not with my friends or family, you'll usually find me cooking! Cooking is my safe space and an outlet for creativity. Growing up, I loved watching cooking shows like Chopped or Guy's Grocery Games. I was mesmerized by the way they would bring ingredients or themes, often not their choosing, together to create a decadent dish. For me, food is fuel for my body, but it is also a place for creative experimentation and a mechanism to bring people together!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"897436a9-e960-45ad-93cd-cc86cf8644fd\"}":{"__typename":"DeepDives","uuid":"897436a9-e960-45ad-93cd-cc86cf8644fd","content":"\u003cp\u003eWhen I was in high school, I saw a beaded bracelet I really liked at a store. It was rather expensive for what I perceived it was worth. It seemed relatively simple--just some beads and string. So I asked myself, \u003cem\u003ehow hard could this be?\u003c/em\u003e I went to a craft store, and within 1 hour, I had made 5 bracelets for less than the price of one.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI began experimenting with what other kinds of jewelry I could recreate. Eventually, I started creating original pieces, and my friends and family expressed interest in buying my pieces. It was then that I started Peaches \u0026amp; Pearls Designs. The business lasted around two years before I sold the remaining pieces and donated the profits to a charity that helps teach people water safety and swimming in historically underserved or underrepresented communities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"b2e5ef4f-cca1-40a9-aca2-c0fdc6be4780\"}":{"__typename":"School","uuid":"b2e5ef4f-cca1-40a9-aca2-c0fdc6be4780","name":"Roswell High School","city":"Roswell","type":"HIGH","state":"Georgia","country":"United States","zip":"30075"},"Education:{\"uuid\":\"68996508-ae49-437a-98bb-b7128b6f8f09\"}":{"__typename":"Education","uuid":"68996508-ae49-437a-98bb-b7128b6f8f09","school":{"__ref":"School:{\"uuid\":\"b2e5ef4f-cca1-40a9-aca2-c0fdc6be4780\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"4dcefad2-7273-4b10-9409-84fab8cda711\"}":{"__typename":"Education","uuid":"4dcefad2-7273-4b10-9409-84fab8cda711","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2024","major":"MA in Bioethics and Science/Technology Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"2ccc9cd3-fc14-479b-b504-a939b24be38f\"}":{"__typename":"MentorPublicProfile","uuid":"2ccc9cd3-fc14-479b-b504-a939b24be38f","displayName":"Liz S.","slug":"liz-sparacino","biography":"\u003cp\u003eHi, I’m Liz Sparacino– a bioethics and tech ethics and policy nerd, proud dog mom, major foodie, and former collegiate swimmer. I grew up in Roswell, Georgia, but fell in love with North Carolina after attending undergraduate and graduate school here. I am proud to call NC home for 6 years now.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am passionate about exploring the challenges at the intersection of technology, humanity, democracy, and society. I believe that addressing these challenges requires interdisciplinary perspectives, and that future computer scientists, engineers, and doctors can create the most positive change when they understand not only the technology itself, but also its societal and ethical implications. Before graduate school, I wasn’t even sure if careers in technology ethics and bioethics existed. I actually started college on a pre-vet track and only stumbled upon bioethics after taking an elective course.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt’s incredibly important for young students to have opportunities to explore the bold and curious questions they have about the world and to explore research, projects, and career options in those spaces. I wouldn’t be where I am today without the mentors who guided and encouraged me, and I hope to offer my mentees that same sense of confidence, inspiration, and excitement about the future.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCurrently, I serve as the Technology Policy Research and Programs Fellow at Duke University’s Sanford School of Public Policy. In this role, I work with undergraduate and graduate students on research spanning topics of AI governance, platform accountability, data privacy, and cybersecurity from a policy and ethics lens. I am particularly excited about our ongoing research on how artificial intelligence is impacting creative economies, particularly music. My research recently took my team around the EU and UK to meet with AI and music policy experts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am also a proud Duke alumna, where I earned a Master of Arts in Bioethics and Science and Technology Policy. My graduate work included projects on the data privacy of mental health apps and the psychological impact of fraud on older adults. I also interned at Takeda Pharmaceuticals, where I developed metrics for policy impact and wrote about resilient technology adoption in healthcare systems.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore graduate school, I was a Division I swimmer at Campbell University (Go Camels!), where I earned a Bachelor of Science in Biomedical Humanities Pre-Med with a minor in sociology. There, I served as president of the Student-Athlete Advisory Committee and co-chair of Student Leaders in Diversity. My graduate capstone focused on the impacts of germline gene editing on disability communities. I am also excited to share the organizational, leadership, and time-management skills she developed as a student-athlete with Curious Cardinal mentees.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my academic and career interets, I love cheering on the Duke Blue Devils, experimenting with foods from different cultures, lifting weights, and spending time outdoors with my dog, Beacon.\u003c/p\u003e","teachingVideoPlaybackId":"fA00Hbd8loZWrW02QnRVGWXdTooXOUIcBUMt9W3KFF4iM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3bdebd0e-d7db-4b79-8ad3-6bf7722a9a4a\"}"},{"__ref":"Favorites:{\"uuid\":\"f2b5f22e-eb8b-4bd4-87c3-0177485d1b36\"}"},{"__ref":"Favorites:{\"uuid\":\"54855002-a959-41ec-9ef8-f64798e1170f\"}"},{"__ref":"Favorites:{\"uuid\":\"a044b565-0a18-47ce-a08b-b8a830c8e66c\"}"}],"causesSupported":[],"major":"MA in Bioethics and Science/Technology Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"747b058e-6717-4511-8a33-e72cb41abcd8\"}"},{"__ref":"DeepDives:{\"uuid\":\"b51076ab-3970-43b0-94e1-2c864d7873e3\"}"},{"__ref":"DeepDives:{\"uuid\":\"f04e06c8-d056-4ae7-90a1-b63d9d03ed25\"}"},{"__ref":"DeepDives:{\"uuid\":\"897436a9-e960-45ad-93cd-cc86cf8644fd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ccba0e82-f503-4982-a4b1-d8c935a31d67/-/preview/-/format/jpg/","https://ucarecdn.com/8e12d24a-97d3-4884-a861-568396a159fe/-/preview/-/format/jpg/","https://ucarecdn.com/6da84f13-e6ed-43bd-bcc0-413dd1014415/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"68996508-ae49-437a-98bb-b7128b6f8f09\"}"},{"__ref":"Education:{\"uuid\":\"4dcefad2-7273-4b10-9409-84fab8cda711\"}"}],"hiredAt":"2025-09-06T15:56:20.380Z","topics":["Medicine / Health","Law / Government / Policy","Public Speaking","Journalism"],"communi
