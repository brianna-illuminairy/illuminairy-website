 positive change in our society.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have significant experience working with human rights issues, specifically working to combat human trafficking. Through my work, I had the wonderful opportunity to intern at the Human Trafficking Institute where I evaluated countries’ efficacy in combating human trafficking through math and data analysis. This experience represents why I am so passionate about math and economics, and it encompasses the message that I want to convey to my mentees – these subjects can be used to evaluate and address the most prevalent issues that our world faces. I’ve continued to work on issues of human rights at Duke through my participation on the Duke Human Rights Student Advisory Board. I am also a founding member of Women’s Empowerment at Duke, a club aimed to empower, educate, and advocate for gender equity and women’s empowerment. As a female studying math and economics, I have come to realize the severe underrepresentation of women in quantitative fields. This underrepresentation is not a reflection of ability, but rather I believe it to be a result of a lack of confidence. Through this club, we aim to empower others, a goal that I plan to carry into my work with my mentees.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics and Math","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/fd88ab36-a274-4578-8bd1-e59d553ec258/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"816882f3-a804-457d-ba02-56b2dcc53238\"}"},{"__ref":"Education:{\"uuid\":\"8109bcbe-377f-458b-a75c-8e6c7ee47cf6\"}"}],"hiredAt":"2023-09-07T09:31:03.442Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Precalculus / Trigonometry","Pre-Algebra","Law / Government / Policy","Global
