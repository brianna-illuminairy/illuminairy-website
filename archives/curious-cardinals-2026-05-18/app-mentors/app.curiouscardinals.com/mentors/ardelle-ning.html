xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a33575e5-159e-4c2f-b2dd-4f06e67c7366\"}":{"__typename":"Favorites","uuid":"a33575e5-159e-4c2f-b2dd-4f06e67c7366","photoUrl":"https://ucarecdn.com/1acc8a3e-a13b-4893-b5e3-09870ce3938f/","title":"Big Fish","type":"MOVIE"},"Favorites:{\"uuid\":\"7b389091-fec2-4a74-9812-aa6a2c525b0d\"}":{"__typename":"Favorites","uuid":"7b389091-fec2-4a74-9812-aa6a2c525b0d","photoUrl":"https://ucarecdn.com/1acc8a3e-a13b-4893-b5e3-09870ce3938f/","title":"Wayne Thiebaud","type":"ARTIST"},"Favorites:{\"uuid\":\"4949a047-49eb-4514-b633-77b961fe7190\"}":{"__typename":"Favorites","uuid":"4949a047-49eb-4514-b633-77b961fe7190","photoUrl":"https://ucarecdn.com/1acc8a3e-a13b-4893-b5e3-09870ce3938f/","title":"Shanghai","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"73516228-d6f3-45a1-b425-f2f907f9354d\"}":{"__typename":"DeepDives","uuid":"73516228-d6f3-45a1-b425-f2f907f9354d","content":"\u003cp\u003eSome of the best learning moments I've had have occurred outside a classroom, in conversations with people who were not necessarily a teacher in a traditional sense, but someone who has had some valuable life experience that I can learn and be inspired from! I have loved getting to know every aspect of my own mentors' journeys to the present: their beginnings, their motivations, their mistakes, the challenges they've tackled and how they have changed through them. I've found that insights from these stories are hard to come by in lectures or seminars, and that building close mentor-mentee relationships have taught me lessons about responsibility, communication, and creativity in ways that are much more organic and actually applicable to the real world. To me, mentorship where both parties understand and support each other is a booster for everyone's success.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"dfb6830b-2af1-45e3-9962-be508ff0f788\"}":{"__typename":"DeepDives","uuid":"dfb6830b-2af1-45e3-9962-be508ff0f788","content":"\u003cp\u003eExplore a range of interests early, think hard about which part of each activity you actually enjoy, then dive deep and don't give up. There is room for improvement at every stage of the process, so make sure to always stay a learner and be grateful for every experience!\u003cbr\u003e\u003cbr\u003eAlso, try your best to not participate in the comparison game. Root for your friends and support them on their way to success, even if you yourself may not be doing as well - you will naturally find people that will do the same for you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f6f75718-ba4a-4125-92a5-e46592ef043d\"}":{"__typename":"DeepDives","uuid":"f6f75718-ba4a-4125-92a5-e46592ef043d","content":"\u003cp\u003eI chose architecture because I was fascinated by both the visual and psychological aspects of the field, and by the power of architects to shape the human experience. As pretty as a structure is on the outside, if people can't get in, navigate, or enjoy being inside, it would be a failure; and when a design can balance all of these things, magic happens, and the challenge of creating that magic is what made me commit to my major. I also enjoyed how hands-on the classes were - we built models by hand, went on building site visits, and presented work off of of printed drawings and foam boards. It was a nice change from studying off a screen in my other core classes.\u003cbr\u003e\u003cbr\u003eAlthough I ended up trading architecture for digital user experience, I still love observing urban planning and space design in the wild. Following my major, I added two minors that allowed me to explore filmmaking, animation, and product design, so that I could create projects that pulled skills from all sides of my creative education. My parents still get confused when I try to explain what I studied, but I wouldn't trade it for anything!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"f9881186-b185-4022-a254-6fcbd187820e\"}":{"__typename":"Education","uuid":"f9881186-b185-4022-a254-6fcbd187820e","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":"2022","major":"Studio Art, Human-Centered Design and Digital Arts","degree":"BA"},"School:{\"uuid\":\"8b88a34b-2757-461a-93b7-36951755246e\"}":{"__typename":"School","uuid":"8b88a34b-2757-461a-93b7-36951755246e","name":"Shorewood High School","city":"Shoreline","type":"HIGH","state":"Washington","country":"United States","zip":"98133"},"Education:{\"uuid\":\"93f43ef7-e8d9-4c49-8fb2-6ab7644b8116\"}":{"__typename":"Education","uuid":"93f43ef7-e8d9-4c49-8fb2-6ab7644b8116","school":{"__ref":"School:{\"uuid\":\"8b88a34b-2757-461a-93b7-36951755246e\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"9d843669-b565-4b9f-b366-b21bac62d86c\"}":{"__typename":"MentorPublicProfile","uuid":"9d843669-b565-4b9f-b366-b21bac62d86c","displayName":"Ardelle N.","slug":"ardelle-ning","biography":"\u003cp\u003eNice to meet you! 👋 My name is Ardelle, and I'm a 2022 graduate of Dartmouth College, where I studied Studio Art, Human-Centered Design, and Digital Arts. I've always loved doing anything hands-on and creative, and while in school, I took part in all sorts of activities, from illustrating a children's reading curriculum, to teaching arts integration lessons for elementary school students, and even helping to design and run Dartmouth's annual hackathon! \u003cbr\u003e\u003cbr\u003eSince graduating, I now work in tech, specifically in user experience (UX) design, which I discovered in my sophomore year through Dartmouth's Digital Applied Learning and Innovation Lab (DALI). I'm currently a designer at Google working on consumer-facing interfaces for ChromeOS, the Chromebook operating system. I continue to be passionate about project-based education and accessible technology, and I'm excited to work with students of all backgrounds and interests! 🌟\u003cbr\u003e\u003cbr\u003eIn terms of design tools, I'm familiar with using Figma, Illustrator, and Procreate, and 3D modeling with Rhino3D, Maya, and SketchUp, so if you're looking to complete a project using any of these, we should definitely chat! 😊\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eothers facts about me: \u003c/strong\u003e\u003cbr\u003e- I like to spend my free time painting, karaoke-ing, and most recently pickle balling! \u003cbr\u003e- I was born and raised in Seattle and am proud to be Chinese-American; I speak Mandarin at home.\u003cbr\u003e- I have a twin sister!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null
