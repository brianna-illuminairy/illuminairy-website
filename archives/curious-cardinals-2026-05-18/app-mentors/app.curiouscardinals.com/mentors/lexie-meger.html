xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6c4c7540-bab3-4f64-bff3-fa088a343141\"}":{"__typename":"Favorites","uuid":"6c4c7540-bab3-4f64-bff3-fa088a343141","photoUrl":"https://ucarecdn.com/6eee9d24-f32e-4456-9179-14927c385d14/","title":"Basketball","type":"SPORT"},"Favorites:{\"uuid\":\"31ee826d-c411-4133-aeba-b3431dc1b399\"}":{"__typename":"Favorites","uuid":"31ee826d-c411-4133-aeba-b3431dc1b399","photoUrl":"https://ucarecdn.com/e8faa049-9e74-425e-b515-269e738d5660/","title":"Sleep Through the Static","type":"ALBUM"},"Favorites:{\"uuid\":\"9ecef437-f1aa-45ad-a6d0-33699446881f\"}":{"__typename":"Favorites","uuid":"9ecef437-f1aa-45ad-a6d0-33699446881f","photoUrl":"https://ucarecdn.com/58309e53-ee13-4ee8-85e0-c395201d6930/","title":"Claude Monte","type":"ARTIST"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7c3777ed-b0fd-480a-8ddd-a133d7a9eec0\"}":{"__typename":"DeepDives","uuid":"7c3777ed-b0fd-480a-8ddd-a133d7a9eec0","content":"\u003cp\u003eYour relationship with yourself is the most important relationship you will ever have. Learning how to love yourself, how to trust yourself, how to spend time with yourself - these things will great the strongest foundation for your future. So, try spending some time getting to know who you are. Speak to yourself with kindness. Learn to appreciate all the qualities that make you who you are. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"de7def36-0066-4bf4-a558-5aa7e644be0b\"}":{"__typename":"DeepDives","uuid":"de7def36-0066-4bf4-a558-5aa7e644be0b","content":"\u003cp\u003eWhen I was 11, my mom went through the process of becoming a foster mom. Since then, I have been blessed with 22 siblings on top of the 3 sisters who I grew up with. At the beginning, we took care of a lot of infants who struggled with a variety of high-level medical needs. I spent a lot of time in NICUs, and I saw a desperate need with the healthcare workforce. My siblings were my biggest inspiration for choosing to pursue a nursing major. I wanted to have the opportunity to help those in similar situations in the future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"6ae816a2-99eb-43ad-b347-7ca0e6b3741c\"}":{"__typename":"DeepDives","uuid":"6ae816a2-99eb-43ad-b347-7ca0e6b3741c","content":"\u003cp\u003eMentoring is one of the most special things you can do; it benefits not only the mentee but the mentor themselves. I cannot imagine a world where I wouldn't want to be a mentor. It is such a privilege to be apart of the process of learning and bettering understanding. Throughout my life, I have always been a mentor in some form, whether that be through being an older sister, through babysitting, through working with children with autism, through informally deciding to \"adopt\" a younger student as my sibling, through teaching art classes, or through being a nurse. Mentorship is a necessary and important part of being alive.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"871c9095-5c9d-4d5e-bfce-c7f16ee5df32\"}":{"__typename":"DeepDives","uuid":"871c9095-5c9d-4d5e-bfce-c7f16ee5df32","content":null,"videoPlaybackId":"iqWAbE01o2Jy0200aaRMJ9dXsVOJXyFntb6iBoFGt1qUVA","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"e4117636-4ed9-41cc-b3eb-0b05f0936985\"}":{"__typename":"School","uuid":"e4117636-4ed9-41cc-b3eb-0b05f0936985","name":"Bakersfield Christian High School","city":"Bakersfield","type":"HIGH","state":"California","country":"United States","zip":"93314"},"Education:{\"uuid\":\"254f2925-c021-4f49-9651-7c56e2842959\"}":{"__typename":"Education","uuid":"254f2925-c021-4f49-9651-7c56e2842959","school":{"__ref":"School:{\"uuid\":\"e4117636-4ed9-41cc-b3eb-0b05f0936985\"}"},"startYear":"2014","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"56ee801c-0cd6-4547-bf4a-cec84281aa4e\"}":{"__typename":"Education","uuid":"56ee801c-0cd6-4547-bf4a-cec84281aa4e","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Nursing and Studio Art","degree":null},"MentorPublicProfile:{\"uuid\":\"e74f53b3-42bb-4bc4-b430-0efcb552d753\"}":{"__typename":"MentorPublicProfile","uuid":"e74f53b3-42bb-4bc4-b430-0efcb552d753","displayName":"Lexie M.","slug":"lexie-meger","biography":"\u003cp\u003eI believe that in life, we are all gifted with the opportunity to become anything we can dream of. We are allowed to, and should, be greedy in our dreams.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am very greedy when it comes to my dreams. In college, I studied nursing, studio art, and Portuguese, because I didn't want to limit myself in learning things that interested me. Lexie today, who lives in Manaus, Brazil, researching \"Indigenous Midwifery Care within the Brazilian Amazon\" through a Fulbright Research Award, speaking Portuguese daily, and teaching weekly art classes, is beyond grateful to the girl who embraced all of her opportunities. I chose to chase a dream on a path that wasn't previously paved when I became the first student at Georgetown University's School of Nursing to receive a Fulbright award. The path wasn't paved, so I paved it. Our dreams shouldn't always be limited by the paths that have been clearly defined by others.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my life, I strive to identify and actively incorporate my dreams into my reality. Of these dreams, I am actively incorporating the following: learning to play the saxophone, co-writing and illustrating a children's book, mentoring Fulbright applicants, creating a life-size sculpture of my head from locally-sourced clay, my current oil painting series, learning a new dance form, and teaching myself to knit.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWithin my professional life, I chase my dreams all the same. I have worked as the Clinical Trail Manager for a healthcare technology startup where I managed a team, ~20 different studies from start to finish, collaborated with the design and functionality teams, and assisted in building product. As previously stated, I am currently an independent researcher in the heart of the Brazilian Amazon pursing knowledge of Indigenous practices and treatments within the scope of pregnancy, birth, and postpartum. I have worked as an independently contracted artist since 2021, having taken commissions from both individuals and companies. I am also a California registered nurse. Who says we can't have it all?\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentoring to me feels to be more paramount than many of my other dreams. What could be more important than assisting in the inspiration and actualization of another person's dreams? I strongly believe that every person is capable of greatness, but it is a lot easier to accomplish greatness when you have active support and a sound plan. I hope that through myself or through one of the other amazing mentors at Curious Cardinals, you will be able to find that support for yourself or your child.\u003c/p\u003e","teachingVideoPlaybackId":"Z01oWJaeGs001NdpEcWfmM1Z01rn00zTg4m00Ksvhu4rBz02M","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6c4c7540-bab3-4f64-bff3-fa088a343141\"}"},{"__ref":"Favorites:{\"uuid\":\"31ee826d-c411-4133-aeba-b3431dc1b399\"}"},{"__ref":"Favorites:{\"uuid\":\"9ecef437-f1aa-45ad-a6d0-33699446881f\"}"}],"causesSupported":[],"major":"Nursing and Studio Art","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7c3777ed-b0fd-480a-8ddd-a133d7a9eec0\"}"},{"__ref":"DeepDives:{\"uuid\":\"de7def36-0066-4bf4-a558-5aa7e644be0b\"}"},{"__ref":"DeepDives:{\"uuid\":\"6ae816a2-99eb-43ad-b347-7ca0e6b3741c\"}"},{"__ref":"DeepDives:{\"uuid\":\"871c9095-5c9d-4d5e-bfce-c7f16ee5df32\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a36567a0-98ed-44bf-af12-5f438a95459b/-/preview/-/format/jpg/","https://ucarecdn.com/f6b1bdc1-5ac5-4a32-bb10-ad2fb156786f/-/preview/-/format/jpg/","https://ucarecdn.com/ad5e786a-c1f7-4a05-99d2-23f8c82aace3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"254f2925-c021-4f49-9651-7c56e2842959\"}"},{"__ref":"Education:{\"uuid\":\"56ee801c-0cd6-4547-bf4a-cec84281aa4e\"}"}],"hiredAt":"2025-09-04T19:
