xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0527047c-1985-4581-bdb2-227fb6f37c63\"}":{"__typename":"Favorites","uuid":"0527047c-1985-4581-bdb2-227fb6f37c63","photoUrl":"https://ucarecdn.com/c9ba415b-cdfe-4142-b97f-a8c7fa411283/","title":"Soccer","type":"SPORT"},"CausesSupported:{\"uuid\":\"b0b8673c-9a5b-4ed4-8ba8-ab4ed04c1fa3\"}":{"__typename":"CausesSupported","uuid":"b0b8673c-9a5b-4ed4-8ba8-ab4ed04c1fa3","name":"Ronald McDonald House of Durham \u0026 Wake, Inc","description":"\u003cp\u003eit provides families with a home-away-from-home while their children receive lif\u003c/p\u003e","photoUrl":"https://ucarecdn.com/90e8d130-26c8-4ceb-91b9-9fe205c5396d/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"55b54436-8481-4133-80be-b441e859537a\"}":{"__typename":"DeepDives","uuid":"55b54436-8481-4133-80be-b441e859537a","content":"\u003cp\u003eMentorship matters to me because it represents the bridge between potential and realization. Every person’s journey is shaped by someone who took the time to guide, listen, and believe in them — and I’ve been fortunate to have mentors who did exactly that for me. Their encouragement helped me see possibilities I hadn’t imagined for myself, and their belief often came at moments when I doubted my own.\u003c/p\u003e\u003cp\u003eTo me, mentorship isn’t about giving answers — it’s about creating space for growth, curiosity, and confidence. It’s about helping others see that they already have the tools they need to succeed, and simply showing them how to use them. I see it as a cycle of empowerment: the guidance we receive becomes the guidance we pass on.\u003c/p\u003e\u003cp\u003eI care deeply about mentorship because it embodies empathy, connection, and purpose — values I try to live by every day. Whether in academics, career, or personal growth, mentorship reminds me that progress is rarely made alone, and that one person’s belief can change the entire trajectory of another’s life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a8a2b221-0770-4790-8d0a-25088cf03654\"}":{"__typename":"DeepDives","uuid":"a8a2b221-0770-4790-8d0a-25088cf03654","content":"\u003cp\u003eSpeaking fluent arabic and living in egypt with it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"36121690-1df2-46c2-8d32-4f6505023401\"}":{"__typename":"DeepDives","uuid":"36121690-1df2-46c2-8d32-4f6505023401","content":"\u003cp\u003eI chose to study \u003cstrong\u003eEconomics\u003c/strong\u003e not because I’m driven by money, but because I’m fascinated by the art of \u003cstrong\u003edecision-making\u003c/strong\u003e— understanding why people do what they do and how those choices shape the world around us. To me, economics is about human behavior, incentives, and the quiet logic behind every action. I’m drawn to concepts like \u003cstrong\u003egame theory\u003c/strong\u003e, which reveal how strategy, psychology, and circumstance intertwine in the decisions we make every day. Studying economics allows me to connect data with meaning — to see how individual choices ripple through societies and markets. More than anything, it teaches me how to think critically, anticipate outcomes, and understand the systems that drive human progress.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d809881a-df42-4ec2-8a02-79fbaa4f05ff\"}":{"__typename":"DeepDives","uuid":"d809881a-df42-4ec2-8a02-79fbaa4f05ff","content":"\u003cp\u003eBeing on the Board of Directors for Chealsea FC.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"457e8e04-38a3-40c6-b17e-2b876baba365\"}":{"__typename":"School","uuid":"457e8e04-38a3-40c6-b17e-2b876baba365","name":"Stewarts Creek High School","city":"Smyrna","type":"HIGH","state":"Tennessee","country":"United States","zip":"37167"},"Education:{\"uuid\":\"5f739968-fb78-4c73-b6f2-01171ccc441b\"}":{"__typename":"Education","uuid":"5f739968-fb78-4c73-b6f2-01171ccc441b","school":{"__ref":"School:{\"uuid\":\"457e8e04-38a3-40c6-b17e-2b876baba365\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"e0e7dcac-94a9-4820-aa3a-19dae8e5caa3\"}":{"__typename":"Education","uuid":"e0e7dcac-94a9-4820-aa3a-19dae8e5caa3","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"e9243079-1933-41b3-8e28-46c22ac47ce5\"}":{"__typename":"MentorPublicProfile","uuid":"e9243079-1933-41b3-8e28-46c22ac47ce5","displayName":"Gabriel M.","slug":"gabriel-markwei","biography":"\u003cp\u003eHi! My name is Gabriel Markwei, and I’m from Nashville, Tennessee. I’m currently studying Economics at Duke University, where I’m pursuing a concentration in Financial Economics. What draws me most to economics is how it connects people, markets, and choices — revealing how decisions at every level, from individuals to global institutions, shape opportunity, growth, and equity. I’ve always been fascinated by how access to financial knowledge can change lives, and I hope to one day use what I learn to make finance more inclusive and impactful for others. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up in a Ghanaian-American family, I was surrounded by strong examples of perseverance, faith, and gratitude. My parents taught me to see education not just as a path to success, but as a means of service — a way to lift others up and open doors that might have once seemed closed. That mindset has shaped the way I approach mentorship, leadership, and learning. Whether I’m studying, playing soccer, or helping someone work through a challenge, I try to lead with empathy, patience, and an open mind. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m someone who thrives on connection and exploration. I’m passionate about soccer, which has taught me teamwork, discipline, and how to see strategy unfold in real time. I also love chess, which challenges me to think several steps ahead and stay calm under pressure — a skill that’s helped me both in life and in the classroom. I’ve been fortunate to travel to London and Ghana, experiences that deepened my appreciation for different cultures and perspectives. Traveling reminds me that learning doesn’t only happen in classrooms; it happens in the conversations, meals, and moments we share with people whose stories are different from our own. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also currently learning Arabic, which has pushed me out of my comfort zone and taught me the value of patience and persistence in mastering new skills. Language learning reminds me that growth takes time — and that small, consistent effort can lead to something incredible. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy faith is another cornerstone of my life. I’m passionate about theology and the ways belief can guide how we think about purpose, compassion, and leadership. My faith grounds me and gives me a deep sense of gratitude and responsibility — to live with integrity, to stay humble, and to serve others wherever I can. My family keeps me anchored in that, reminding me daily that success means little if it’s not shared. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a Curious Cardinals mentor, I’m excited to help students not only succeed academically, but also discover what truly excites and motivates them. I believe learning is at its best when it’s driven by curiosity — when students feel empowered to explore their ideas, connect knowledge to the real world, and take ownership of their growth. My goal as a mentor is to be a source of encouragement and perspective, helping students see that their passions, voices, and dreams all matter. Whether we’re tackling a tough subject, brainstorming a project, or just talking about life, I want my students to feel supported, inspired, and capable of achieving more than they imagined.\u003c/p\u003e","teachingVideoPlaybackId":"PFjc2tNaYbl01C3qXR2hRnKouX02K6qMIqO1wlHIN9DYU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I’m really proud of is learning to speak Arabic. I started with almost no background, but I committed to practicing every day—listening to podcasts, watching videos, and speaking with native speakers whenever I could. Over time, I went from struggling with basic phrases to holding full conversations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat makes me most proud isn’t just learning a new language, but the discipline and patience it took to get there. It taught me how to stay consistent, embrace mistakes, and push through challenges. It also opened the door to understanding a new culture and connecting with people in a much more meaningful way.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0527047c-1985-4581-bdb2-227fb6f37c63\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b0b8673c-9a5b-4ed4-8ba8-ab4ed04c1fa3\"}"}],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"55b54436-8481-4133-80be-b441e859537a\"}"},{"__ref":"DeepDives:{\"uuid\":\"a8a2b221-0770-4790-8d0a-25088cf03654\"}"},{"__ref":"DeepDives:{\"uuid\":\"36121690-1df2-46c2-8d32-4f6505023401\"}"},{"__ref":"DeepDives:{\"uuid\":\"d809881a-df42-4ec2-8a02-79fbaa4f05ff\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2c7794f4-743c-4040-b14f-31f25e0302b5/-/preview/-/format/jpg/","https://ucarecdn.com/23c2cc23-a2e8-466d-b81d-686d52a40791/-/preview/-/format/jpg/","https://ucarecdn.com/5bc37f20-9d0d-488a-a2ff-62c2d1f6b935/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5f739968-fb78-4c73-b6f2-01171ccc441b\"}"},{"__ref":"Education:{\"uuid\":\"e0e7dcac-94a9-4820-aa3a-19dae8e5caa3\"}"}],"hiredAt":"2025-10-03T15:11:52.795Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Sports Journalism","Business / Entrepreneurship","Sports Analytics","STEM Project","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfil
