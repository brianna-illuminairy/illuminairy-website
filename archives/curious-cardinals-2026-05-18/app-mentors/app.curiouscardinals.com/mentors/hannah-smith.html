xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a3e6e6f4-e861-4c08-81ae-85d67bbb62a6\"}":{"__typename":"DeepDives","uuid":"a3e6e6f4-e861-4c08-81ae-85d67bbb62a6","content":"\u003cp\u003eI would tell myself to seize every opportunity possible that aligns with my passions. The butterfly effect is REAL... you never know how one professor's recommendation of attending a small event may lead you to meeting someone who changes your life forever! I would also tell myself to believe in myself, know that there is so much going forward, and that high school is such a small but significant portion of your life. Seize those opportunities and push yourself, but remember that high school is only four years of MANY. So, breathe and know you will be okay!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a1f51ea4-dafe-4f1c-8ed9-7738b9bbeb9b\"}":{"__typename":"DeepDives","uuid":"a1f51ea4-dafe-4f1c-8ed9-7738b9bbeb9b","content":"\u003cp\u003eAll it takes is one teacher, counselor, or professor to transform a student from hopeless to hopeful; to inspire a student down a path that ignites them throughout the rest of their life. If I can ignite academic passion in just one student, or guide them toward something that fills them with joy, I have done my job :) \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"5f3489fa-8ce3-4b84-ad9a-15d14d582dde\"}":{"__typename":"DeepDives","uuid":"5f3489fa-8ce3-4b84-ad9a-15d14d582dde","content":"\u003cp\u003eAs someone with transgender individuals near and dear to my heart, I hope to open minds regarding the LGBTQIA+ --- specifically the transgender --- community. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI hope to be kind and leave in my wake joy over anger, and be remembered for spreading kindness :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ab92f198-12e4-4929-b220-6bc85967d6cd\"}":{"__typename":"DeepDives","uuid":"ab92f198-12e4-4929-b220-6bc85967d6cd","content":"\u003cp\u003eI was 12 when I watched the film \"On the Basis of Sex\" about Ruth Bader Ginsburg's pioneering as a lawyer at Harvard --- a then male-dominated law school. She found a paradox in the law where a \u003cem\u003eman\u003c/em\u003e was discriminated against because of his gender, and was able to fight for gender equality for men and women. She was revolutionary, and from then on, I knew I wanted to study the constitution, philosophy, and human nature to contribute to bettering human societies. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"e4cc13aa-3f21-4fe7-a4df-687bb91ff72d\"}":{"__typename":"School","uuid":"e4cc13aa-3f21-4fe7-a4df-687bb91ff72d","name":"Aspen High School","city":"Aspen","type":"HIGH","state":"Colorado","country":"United States","zip":"81611"},"Education:{\"uuid\":\"078c1ab9-23d4-4cfd-a9cb-d4a747b44ef1\"}":{"__typename":"Education","uuid":"078c1ab9-23d4-4cfd-a9cb-d4a747b44ef1","school":{"__ref":"School:{\"uuid\":\"e4cc13aa-3f21-4fe7-a4df-687bb91ff72d\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9c355a46-d17f-47de-ab06-5e81b8a5d3fd\"}":{"__typename":"School","uuid":"9c355a46-d17f-47de-ab06-5e81b8a5d3fd","name":"Colorado College","city":"Colorado Springs","type":"COLLEGE","state":"Colorado","country":"United States","zip":"80903"},"Education:{\"uuid\":\"b98665e4-bff7-4e6c-b6f1-1b4a4e818c8e\"}":{"__typename":"Education","uuid":"b98665e4-bff7-4e6c-b6f1-1b4a4e818c8e","school":{"__ref":"School:{\"uuid\":\"9c355a46-d17f-47de-ab06-5e81b8a5d3fd\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"169361e2-7a23-4ec3-bff4-b5699ee2090a\"}":{"__typename":"MentorPublicProfile","uuid":"169361e2-7a23-4ec3-bff4-b5699ee2090a","displayName":"Hannah S.","slug":"hannah-smith","biography":"\u003cp\u003eGreetings! My name is Hannah Smith, a Colorado College 2025 graduate who studied Political Science and minored in Philosophy. I am currently a student at the Columbia Journalism School, expected to graduate with a Master of Science degree in 2026. I hope to one day get a PhD in Political Theory.\u003c/p\u003e\u003cp\u003eI adore the mountains and the outdoors, as well as reading and writing in many forms (I am both a philosophy connoisseur and a journalist!) Due to my undergraduate degree in Political Science, I am well-versed in topics related to American constitutionality and the intersections between constitutional law, philosophical thought, and journalism.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether you enjoy reading Hobbes or Rousseau, Simone de Beauvoir, Gloria Steinem, or even the feared Machiavelli, I would love to share in your passions and also explore new, profound works with you to keep fueling your academic fire. Maybe you are seeking to introduce yourself to philosophy or political science for the first time and need some introductory collaboration. I am absolutely here for that, too!\u0026nbsp;\u003c/p\u003e\u003cp\u003eIf you are an aspiring journalist or writer, our sessions would be the perfect place to work on lede writing, writing style, editing…. Anything of the journalistic sort!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI LOVE learning each and every day. In the summers, I have the privilege of interning at the Aspen Institute, where I get to listen in on productive bipartisan dialogue on a range of topics like AI, mental health, global politics, etc. I take every chance I can each day to learn about something new: whether it be the history of a statue I pass at the park, reading a thought-provoking news article, or picking up a new philosophical book.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLet’s learn together!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can quickly call to mind three instructors through my K-12 education and college education who changed my life --- they inspired me in profound ways, took the time to really SEE me, and challenged me in the ways that counted. One of my biggest desires is to continue on their legacies in any way I can. I want students to be heard and seen.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want to nurture students’ talents and inclinations in every way that counts. I saw these three instructors as both professional mentors and — in a formal way –- dear friends I could turn to. I aspire to be a professional mentor, yes, but also become a trustworthy friend a mentee may be able to lean on.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThank you for taking the time to read my bio, and I hope to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"mZFBsVPhb4q01UnP1jssPYbamX6JCNRIXeYSwLJoLRZE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a3e6e6f4-e861-4c08-81ae-85d67bbb62a6\"}"},{"__ref":"DeepDives:{\"uuid\":\"a1f51ea4-dafe-4f1c-8ed9-7738b9bbeb9b\"}"},{"__ref":"DeepDives:{\"uuid\":\"5f3489fa-8ce3-4b84-ad9a-15d14d582dde\"}"},{"__ref":"DeepDives:{\"uuid\":\"ab92f198-12e4-4929-b220-6bc85967d6cd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f818236a-da37-4eca-b0a6-6d7e677eb26a/-/preview/-/format/jpg/","https://ucarecdn.com/b1015e3e-22c8-4ec2-8448-096b65eaa2ef/-/preview/-/format/jpg/","https://ucarecdn.com/637a895d-7204-4eb8-8f17-c31226387275/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"078c1ab9-23d4-4cfd-a9cb-d4a747b44ef1\"}"},{"__ref":"Education:{\"uuid\":\"b98665e4-bff7-4e6c-b6f1-1b4a4e818c8e\"}"}],"hiredAt":"2025-08-25T15:56:23.731Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hannah-smith\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"169361e2-7a23-4ec3-bff4-b5699ee2090a\"}"}}},"_sentryTraceData":"27969b8e134e407b9961ee6028ba73d2-bac234a198a3e7ae-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=27969b8e134e407b9961ee6028ba73d2,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"hannah-smith"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w
