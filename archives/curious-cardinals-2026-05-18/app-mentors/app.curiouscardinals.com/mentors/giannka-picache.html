xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c682ba2a-e887-42db-b20e-ec09019996a2\"}":{"__typename":"Favorites","uuid":"c682ba2a-e887-42db-b20e-ec09019996a2","photoUrl":"https://ucarecdn.com/7eb8df76-df3c-43cd-802c-abfb33d4edfe/","title":"Big Hero 6","type":"MOVIE"},"Favorites:{\"uuid\":\"974a0305-4a61-45c5-a302-066717fb7a6a\"}":{"__typename":"Favorites","uuid":"974a0305-4a61-45c5-a302-066717fb7a6a","photoUrl":"https://ucarecdn.com/82d17766-5b34-43d1-9101-7607e70bb2e4/","title":"Overcooked","type":"GAME"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"68f6410a-f313-44ea-b14f-5621aeff800a\"}":{"__typename":"DeepDives","uuid":"68f6410a-f313-44ea-b14f-5621aeff800a","content":"\u003cp\u003eI'm Filipina and also a first-gen low income undergraduate and graduate student. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy mentorship style reflects an openness and understanding to students who share a similar unconventional background.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"dd5c994d-f870-4281-8a1b-75c5c30950f3\"}":{"__typename":"DeepDives","uuid":"dd5c994d-f870-4281-8a1b-75c5c30950f3","content":"\u003cp\u003eJust as enthusiastically geeky as I am today!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"4fa85173-6a40-4680-86dc-6bb2f896a38c\"}":{"__typename":"DeepDives","uuid":"4fa85173-6a40-4680-86dc-6bb2f896a38c","content":"\u003cp\u003eFor all of my summers, I took courses at two or three nearby community colleges and universities. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor two summers, I was an apprentice at a local machine shop.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor one summer, I was an intern at a metal 3D printing startup.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"9b54c06a-1819-4f4d-afa5-0caca2d2eb66\"}":{"__typename":"School","uuid":"9b54c06a-1819-4f4d-afa5-0caca2d2eb66","name":"California Academy of Mathematics and Science School","city":"Carson","type":"HIGH","state":"California","country":"United States","zip":"90747"},"Education:{\"uuid\":\"635ba885-7ccb-45cf-84d8-61a71cce0468\"}":{"__typename":"Education","uuid":"635ba885-7ccb-45cf-84d8-61a71cce0468","school":{"__ref":"School:{\"uuid\":\"9b54c06a-1819-4f4d-afa5-0caca2d2eb66\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"ceb8fd89-1e2f-443f-b593-daecc81cf76e\"}":{"__typename":"Education","uuid":"ceb8fd89-1e2f-443f-b593-daecc81cf76e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"be62a312-d17f-4d87-ba41-5dad86a92ee3\"}":{"__typename":"MentorPublicProfile","uuid":"be62a312-d17f-4d87-ba41-5dad86a92ee3","displayName":"Giannka P.","slug":"giannka-picache","biography":"\u003cp\u003eI’ve always liked building things that are uniquely me. In high school, I designed my own handcrafted pair of ice skate blades that first started out as a block of stainless steel. The project started because I wanted to understand how I could improve my own skating skills: jumps, spins, and edge control. The blades were specifically designed to reflect my particular skating style, opting for more durability upon impact and sharper, thicker edges for faster gliding speed. But in the end, the project taught me something far more valuable than mechanics and materials. It taught me that engineering is as much about iteration and patience as it is about precision.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, that hands-on curiosity evolved into research. I joined a bioprinting lab where I studied how to bioprint cardiac muscle, eventually writing my honors thesis on ways to better improve control of the printing process. That project pushed me to think like an inter-disciplinarian: mechanical engineering and biology. It also reminded me how much I love translating complex ideas for others, which led me to pursue a science communication minor and start tutoring in STEM.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, I’m a PhD student in Mechanical Engineering at MIT, developing \u003cstrong\u003eclosed-loop control systems for 3D bioprinting of musculoskeletal tissue.\u003c/strong\u003e My work blends control theory and cell biology to make tissue fabrication more adaptive and reliable. I’m also certified as a \u003cstrong\u003eresearch mentor and grant writer\u003c/strong\u003e, so much of my graduate life revolves around helping others turn their ideas into projects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the lab, my world still revolves around skating. I compete with the MIT Figure Skating Club and I love the discipline and artistry that sport has given me. I balance that with running, sewing, thrifting, and journaling. I also write essays and blog posts about the grad school experience as a first-gen low-income Filipina from Southern California. I also love to cook, so I often bake cookies or pies for friends whenever I can. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether I’m teaching a concept, assembling a piece of furniture, or testing a new bioprinting setup, what drives me is the same impulse I had back in high school with those skate blades: stand out.\u003c/p\u003e","teachingVideoPlaybackId":"n02027E55nCoXwsufkMpCpLcCMHY5ulzNR01esYvHZcbJk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c682ba2a-e887-42db-b20e-ec09019996a2\"}"},{"__ref":"Favorites:{\"uuid\":\"974a0305-4a61-45c5-a302-066717fb7a6a\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"68f6410a-f313-44ea-b14f-5621aeff800a\"}"},{"__ref":"DeepDives:{\"uuid\":\"dd5c994d-f870-4281-8a1b-75c5c30950f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"4fa85173-6a40-4680-86dc-6bb2f896a38c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d62b5137-c26c-434e-a1e1-2f4a2172420e/-/preview/-/format/jpg/","https://ucarecdn.com/4a24380c-326a-415a-a77e-90be2cb130da/-/preview/-/format/jpg/","https://ucarecdn.com/9fc4cf85-dfc4-48fb-8992-ee6526358944/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"635ba885-7ccb-45cf-84d8-61a71cce0468\"}"},{"__ref":"Education:{\"uuid\":\"ceb8fd89-1e2f-443f-b593-daecc81cf76e\"}"}],"hiredAt":"2026-04-05T17:39:40.319Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writin
