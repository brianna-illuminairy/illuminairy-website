xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"195c594f-def2-431c-a150-5470473fdff3\"}":{"__typename":"DeepDives","uuid":"195c594f-def2-431c-a150-5470473fdff3","content":"\u003cp\u003eI have had many important mentors throughout the years who have motivated me, pushed me to new limits, and introduced me to new passions. I know what it feels like to be in the shoes of a mentee, and I only hope to spark meaningful exploration, discovery, and learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3cc7f56b-c9e5-4b1a-904c-b1e68314e27a\"}":{"__typename":"DeepDives","uuid":"3cc7f56b-c9e5-4b1a-904c-b1e68314e27a","content":"\u003cp\u003eKeep exploring and to pursue your passions fully! Many of my interests have served as the catalyst for new interests and experiences that have provided me with so many important lessons. If you want to pursue something, don't be scared to do it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c7d22482-1b3e-41dd-b13c-05e8787fbdd5\"}":{"__typename":"DeepDives","uuid":"c7d22482-1b3e-41dd-b13c-05e8787fbdd5","content":"\u003cp\u003eA passion project of mine has been creating my website (https://chenkaiwen.org/)\u003cbr\u003e\u003cbr\u003eWhile I enjoy the physical aspect of my work, I find it extremely fun to find creative ways to display my artwork digitally! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6d37a9a7-7929-4de6-8946-6297301278a8\"}":{"__typename":"DeepDives","uuid":"6d37a9a7-7929-4de6-8946-6297301278a8","content":"\u003cp\u003eI hope to become a physician in the future who takes care of a diverse patient population and utilizes my teaching skills to improve my future patients' health literacy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"91a8851d-2eb9-4908-b097-be124de53908\"}":{"__typename":"School","uuid":"91a8851d-2eb9-4908-b097-be124de53908","name":"Naperville Central High School","city":"Naperville","type":"HIGH","state":"Illinois","country":"United States","zip":"60540"},"Education:{\"uuid\":\"2d337546-b53f-4cb2-8291-448061788dfc\"}":{"__typename":"Education","uuid":"2d337546-b53f-4cb2-8291-448061788dfc","school":{"__ref":"School:{\"uuid\":\"91a8851d-2eb9-4908-b097-be124de53908\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}":{"__typename":"School","uuid":"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41","name":"Rice University","city":"Houston","type":"COLLEGE","state":"Texas","country":"United States","zip":"77005"},"Education:{\"uuid\":\"6d218782-0e0d-40ea-9aad-add66085b630\"}":{"__typename":"Education","uuid":"6d218782-0e0d-40ea-9aad-add66085b630","school":{"__ref":"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"BioSciences and Art ","degree":null},"Testimonial:5ef924c0-2ca5-45cd-9c34-d38c515afc48":{"__typename":"Testimonial","id":"5ef924c0-2ca5-45cd-9c34-d38c515afc48","text":"I cannot say enough good things about Kevin, my son‘s mentor for the past year and a half. He always comes prepared, on time, and is always so very accommodating and understanding. Curious Cardinals couldn’t have found a better match for my son… They are both interested in biology (Kevin is in med school) and photography! What are the chances?? That being said, Kevin not only helps my son with biology, but also with his hobby. Kevin has helped create a website where my son can upload all of his experiments that he has done for the past year and a half, which also includes an area for his photography to showcase when he applies to college in two years.  Kevin is amazing in every way and I couldn’t have asked for a better mentor to guide my son through his critical high school years !","date":"2025-05-27 16:13:52.69+00","rating":5,"endorser":{"__typename":"Endorser","name":"Eunice Ma","tagline":"","avatar":null}},"Testimonial:a9194515-23c8-46e3-99dc-0f401b043b17":{"__typename":"Testimonial","id":"a9194515-23c8-46e3-99dc-0f401b043b17","text":"Hi Kevin, \nThank you so much for the heartfelt message to Noah.  We read it together and we are truly grateful and thankful to have a mentor like you. You have played a big role in his growth these past six months and we are impressed with how much he has learned through your guidance. \nThank YOU for your dedication and sharing your knowledge with Noah. \nKind regards, \nClara","date":"2025-05-27 14:02:53.979+00","rating":5,"endorser":{"__typename":"Endorser","name":"Clara","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"39f906a1-616b-4b60-8d9a-e003ea1d108b\"}":{"__typename":"MentorPublicProfile","uuid":"39f906a1-616b-4b60-8d9a-e003ea1d108b","displayName":"Kevin C.","slug":"kevin-chen","biography":"\u003cp\u003eKevin is a current medical student at the Northwestern University Feinberg School of Medicine. He graduated from Rice University with a BA in BioSciences (cell biology and genetics) and Art (photography). Starting from his backyard experiments as a kid, Kevin has been interested in scientific discovery and exploration for as long as he can remember. In high school, he helped conduct wound healing research, worked with physicists at Argonne National Laboratory to study how a particular microscopy method can be used to analyze samples at the nanoscale level and competed at the VEX Robotics World Championship with his team of four. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, Kevin found fulfillment in serving the community and sharing his passions with others. As a volunteer EMT with Rice Emergency Medical Services, he responded to campus medical emergencies and has helped teach EMT-basic students important patient scenarios and medical skills. Beyond EMS, Kevin served as a volunteer neuroscience teacher for middle and high school students in Houston, and he greatly enjoyed connecting with them through humor and creative, patient mentorship. \u003cbr\u003e\u003cbr\u003eKevin also has a creative side as an artist/photographer passionate about providing stories and commentaries through his work. In college, he received the Mary Ellen Hale Lovett Travel Fellowship, which allowed him to travel to Amsterdam to work on a photographic project on bike infrastructure. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eIn his free time, Kevin enjoys playing the guitar, viewing art, traveling, and learning new things!\u003c/p\u003e","teachingVideoPlaybackId":"hP202lqyhoim00T00a7UUXngbOQRG100sULJsz3thYFO6JY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"BioSciences and Art ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"195c594f-def2-431c-a150-5470473fdff3\"}"},{"__ref":"DeepDives:{\"uuid\":\"3cc7f56b-c9e5-4b1a-904c-b1e68314e27a\"}"},{"__ref":"DeepDives:{\"uuid\":\"c7d22482-1b3e-41dd-b13c-05e8787fbdd5\"}"},{"__ref":"DeepDives:{\"uuid\":\"6d37a9a7-7929-4de6-8946-6297301278a8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/be038547-e06b-4e02-966f-953677073e46/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2d337546-b53f-4cb2-8291-448061788dfc\"}"},{"__ref":"Education:{\"uuid\":\"6d218782-0e0d-40ea-9aad-add66085b630\"}"}],"hiredAt":"2023-07-24T16:23:51.971Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Reading","Visual Arts / Graphic Design","Video / Photography","Medicine / Health","Web Design","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:5ef924c0-2ca5-45cd-9c34-d38c515afc48"},{"__ref":"Testimonial:a9194515-23c8-46e3-99dc-0f401b043b17"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kevin-chen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"39f906a1-616b-4b60-8d9a-e003ea1d108b\"}"}}},"_sentryTraceData":"06e162bd594d42cbb67a84805b104a5f-b1911803006deedf-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=06e162bd594d42cbb67a84805b104a5f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"kevin-chen"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketi
