xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ac85573d-fbf9-4256-9dd8-bed622e37204\"}":{"__typename":"DeepDives","uuid":"ac85573d-fbf9-4256-9dd8-bed622e37204","content":"\u003cp\u003eI would tell her that its important to find the joy in a personal practice of discipline. In high school there was so many stressful expectations of success that often I was only doing things because I had to. There was a deadline so I completed the work. There was a test so I learned the material.... then immediately forgot it. In college, it took me a long time to disentangle myself from this conception of discipline. Once I did, I found that most everything that's worthwhile in life requires hard work - from friendship to creativity - so one must find a way to enjoy it. The trick is not to think of discipline as doing what is required, but to nurture an intimate relationship to the process of going after your passions. If one is able acquaint their own dreams and then sit down and do the work, one is bound to be happy. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"57c379b1-e6c4-4865-a981-62f1fec41fc1\"}":{"__typename":"DeepDives","uuid":"57c379b1-e6c4-4865-a981-62f1fec41fc1","content":null,"videoPlaybackId":"We027MlL3gPfhoFxXSxlqdMOyEpahY5C3xbTOkDJsukQ","question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"fb61ab90-1980-4ca4-a335-ffbbaa8c940f\"}":{"__typename":"DeepDives","uuid":"fb61ab90-1980-4ca4-a335-ffbbaa8c940f","content":null,"videoPlaybackId":"EZNnIpkILvLGdLgrQjfdjRokBqlYawBn00BUuFQQG006U","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"180aeaf9-75ae-41b8-b6eb-0618d8bf655e\"}":{"__typename":"DeepDives","uuid":"180aeaf9-75ae-41b8-b6eb-0618d8bf655e","content":"\u003cp\u003eWhen I got to Stanford I was very lost about what I wanted to major in. I knew I was interested in psychology, but the major was very research-oriented, and I knew that wasn't for me. I proceeded to explore around 3 different majors until I landed on Urban Studies. Urban Studies gave me insight to a broad range of social issues and the factors that contribute to them, such as housing, immigration, policing, sustainability, etc. These issues affect the city, but they also affect each individual within the city. For many people, they are inseparable from mental health. I plan to pursue a Master's in Social Work, where I will pair my understanding of social systems with my passion for psychology in hopes to create change and care for individuals and communities!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}":{"__typename":"School","uuid":"1dc8c564-7629-4af5-851c-69ed64a8870e","name":"Ransom Everglades High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33133"},"Education:{\"uuid\":\"4c567f73-2057-4bec-983d-28a3ce9ec0f5\"}":{"__typename":"Education","uuid":"4c567f73-2057-4bec-983d-28a3ce9ec0f5","school":{"__ref":"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"431ccf86-6cef-4208-887c-a064157af261\"}":{"__typename":"Education","uuid":"431ccf86-6cef-4208-887c-a064157af261","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Urban Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"2d96deee-4cb4-40b9-9f2a-64f33a6709ac\"}":{"__typename":"MentorPublicProfile","uuid":"2d96deee-4cb4-40b9-9f2a-64f33a6709ac","displayName":"Cassidy C.","slug":"casi-cobb","biography":"\u003cp\u003eCasi grew up in Miami, Florida. She has a BA in Urban Studies from Stanford University and intends to pursue a Masters in Social Work. She is interested in creativity, sustainability, community, counseling, and mindfulness.\u003cbr\u003e\u003cbr\u003eShe is passionate about social work and counseling and looks forward to pursuing a life dedicated to emotional and community care. \u003cbr\u003e\u003cbr\u003eShe has experience teaching and facilitating in a variety of settings. She has been an RA, taught a course to help freshmen adjust to college life, taught young children, as well as Special Ed students. \u003cbr\u003e\u003cbr\u003eShe is a passionate hobbyist and creator, and knows that creativity requires equal parts discipline and self-compassion. She has published creative writing and has sold her art. Her writing consists of fiction, non-fiction, and poetry. Her art consists of knitting, sewing, illustration, pottery, and dance. \u003cbr\u003e\u003cbr\u003eLearning new skills takes a ton of vulnerability, and Casi mentors with this in mind. Casi is fun, friendly, and kind, and is extremely excited to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"4YC502EHkvI9Xyofr6Pq8kXwK4g5UmBe01vHvC9PSSpjU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Urban Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ac85573d-fbf9-4256-9dd8-bed622e37204\"}"},{"__ref":"DeepDives:{\"uuid\":\"57c379b1-e6c4-4865-a981-62f1fec41fc1\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb61ab90-1980-4ca4-a335-ffbbaa8c940f\"}"},{"__ref":"DeepDives:{\"uuid\":\"180aeaf9-75ae-41b8-b6eb-0618d8bf655e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e6df713e-da51-4883-96e9-8678d082c0f0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"4c567f73-2057-4bec-983d-28a3ce9ec0f5\"}"},{"__ref":"Education:{\"uuid\":\"431ccf86-6cef-4208-887c-a064157af261\"}"}],"hiredAt":"2023-08-02T16:04:57.510Z","topics":["K-6 Storybook","Creative Writing","Sustainability","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"casi-cobb\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2d96deee-4cb4-40b9-9f2a-64f33a6709ac\"}"}}},"_sentryTraceData":"f4b910361864407bbb14837633685375-ac4c967705fc68ea-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f4b910361864407bbb14837633685375,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"cas
