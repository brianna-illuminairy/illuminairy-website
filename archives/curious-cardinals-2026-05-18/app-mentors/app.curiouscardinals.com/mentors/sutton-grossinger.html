xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"00a1b9c3-aeb4-4d20-9630-26ba864a1737\"}":{"__typename":"DeepDives","uuid":"00a1b9c3-aeb4-4d20-9630-26ba864a1737","content":"\u003cp\u003eAs a student on the Pre-Med track, I am often asked why I chose to major in Classical Studies. While unconventional, this path has allowed me to pursue my passions in both STEM and the humanities. Studying history provides valuable insights into the present, and my coursework in the Classics has helped shape me into a more thoughtful and well-rounded learner.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c8fb3aa7-6487-4a6b-afcc-fb45c302130d\"}":{"__typename":"DeepDives","uuid":"c8fb3aa7-6487-4a6b-afcc-fb45c302130d","content":"\u003cp\u003eOne piece of advice I would give my younger self is to never let go of my passions. In college, I’ve found joy in being surrounded by people who pursue their own interests and support me in following mine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6e9738d3-4be0-480e-9d9d-183cee3955a6\"}":{"__typename":"DeepDives","uuid":"6e9738d3-4be0-480e-9d9d-183cee3955a6","content":"\u003cp\u003eMy dream career is to become a physician, driven by my passion for helping others and my deep appreciation for patient care.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1e04e0ae-eddd-4b64-80a7-e38846b4f798\"}":{"__typename":"DeepDives","uuid":"1e04e0ae-eddd-4b64-80a7-e38846b4f798","content":"\u003cp\u003eMentorship is important to me because I have deeply valued the guidance of my mentors throughout my educational journey. Without the support of teachers and older students, I would not have had the confidence to achieve what I have today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"92d20537-c215-404f-908c-345b072b6716\"}":{"__typename":"Education","uuid":"92d20537-c215-404f-908c-345b072b6716","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Classical Studies","degree":null},"School:{\"uuid\":\"f5994d51-bc58-4b40-bd19-10023714b548\"}":{"__typename":"School","uuid":"f5994d51-bc58-4b40-bd19-10023714b548","name":"The Shipley School","city":"Bryn Mawr","type":"HIGH","state":"PA","country":"United States","zip":"19010"},"Education:{\"uuid\":\"f67a7b1d-1854-4db7-a9cd-c689068f4c0f\"}":{"__typename":"Education","uuid"
