xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"38aea4af-1c2e-4004-be86-fae3be15a23c\"}":{"__typename":"DeepDives","uuid":"38aea4af-1c2e-4004-be86-fae3be15a23c","content":"\u003cp\u003eOnly people who are crazy enough to change the world can change the world. Call me crazy, but I think we can do it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"8d0c3850-989e-48dc-a743-caa0edb8c54b\"}":{"__typename":"School","uuid":"8d0c3850-989e-48dc-a743-caa0edb8c54b","name":"San Marin High School","city":"Novato","type":"HIGH","state":"California","country":"United States","zip":"94945"},"Education:{\"uuid\":\"bace8139-da01-4bba-92e0-4b035df29f68\"}":{"__typename":"Education","uuid":"bace8139-da01-4bba-92e0-4b035df29f68","school":{"__ref":"School:{\"uuid\":\"8d0c3850-989e-48dc-a743-caa0edb8c54b\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"bb4be666-297e-4e6d-8ac9-52828ad8db25\"}":{"__typename":"Education","uuid":"bb4be666-297e-4e6d-8ac9-52828ad8db25","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"fba3e802-db93-46e8-993b-c8edaf3213bb\"}":{"__typename":"MentorPublicProfile","uuid":"fba3e802-db93-46e8-993b-c8edaf3213bb","displayName":"Mahalia M.","slug":"mahalia-dorothy","biography":"\u003cp\u003eMahalia Morgan is a sophomore at Stanford University, studying \u003cstrong\u003eeconomics\u003c/strong\u003e with a strong focus on the intersection of finance, law, and ethics. With aspirations of becoming a lawyer and working in finance and government, she plans to pursue a JD or JD/MBA after undergrad. She is passionate about ethical investing, governance, and policy development, seeking to shape industries that align financial growth with social responsibility.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMahalia has built an impressive professional foundation through \u003cstrong\u003emultiple high-impact roles\u003c/strong\u003e. This past quarter, she was a fellow with the California Impact Fund, where she was identifying promising Series A+ companies that innovatively address disparities faced by California's middle class. Previously, she interned at the San Francisco Foundation, working on impact investing strategies to integrate sustainable and socially responsible VC managers into institutional portfolios. Her experience extends throughout her coursework, where she explores macroeconomic perspectives and corporate governance.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond finance, Mahalia has a deep commitment to public service and advocacy. Throughout high school, she played a pivotal role in various social justice campaigns by organizing protests and leading policy development and implementation at the district level that resulted in the auditing of racial outcomes. Through the pursuit of justice, Mahalia gained expertise in targeting an audience, understanding the importance of varying perspectives, and \u003cstrong\u003ebuilding and leading successful organizations and movements.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese experiences contributed to Mahalia's eventual acceptance to \u003cstrong\u003e15 colleges\u003c/strong\u003e including Stanford, Duke, Brown, UC Berkeley, USC, and Northwestern and earning her multiple \u003cstrong\u003emerit-based full-rides\u003c/strong\u003e at T-20 universities. A highlight of Mahalia's personal background was navigating the college process entirely by herself. Coming from a single-parent household and attending an averagely resourced public high-school, Mahalia's vision for her success extended beyond the circumstances seen by others as insurmountable barriers; she was the \u003cstrong\u003efirst student from her high-school to receive acceptance to Stanford\u003c/strong\u003e. Her profound understanding of the college process came from years of falling asleep to the guidance of college counselors on YouTube. Now, as a mentor at Curious Cardinals, Mahalia is honored to \u003cstrong\u003eextend her knowledge and guide a future generation\u003c/strong\u003e of leaders.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, Mahalia prides herself in \u003cstrong\u003emaximizing her experience\u003c/strong\u003e through personal and professional endeavors. She was a research assistant for Stanford’s BEAD-T1D Study, ensuring equitable research representation in diabetes technology distribution. She currently serves on the board as Communications Director of the Stanford Pre-Law Society and is the Vice President of Strategy for Stanford's Inter-Sorority Council representing Kappa Kappa Gamma.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to her career goals, she is a passionate foodie, a model, an avid reader of physical newspapers, and known for being \"The Best San Francisco Tour Guide.\" She envisions a future where her legal and financial expertise contribute to systemic change, while allowing her to \u003cstrong\u003ebalance personal fulfillment\u003c/strong\u003e and global exploration.\u003c/p\u003e","teachingVideoPlaybackId":"RGSDDPiVnqg4Q1uzC7qQUvuEcNzCUpZMDlxzDPLgfz4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"38aea4af-1c2e-4004-be86-fae3be15a23c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/54b1b86d-9155-4103-97fc-885a1bcfd294/-/preview/-/format/jpg/","https://ucarecdn.com/2c754c3e-660e-486f-bc33-064262785cbd/-/preview/-/format/jpg/","https://ucarecdn.com/28c26d60-c789-4d1c-a416-f71ca3b69a90/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"bace8139-da01-4bba-92e0-4b035df29f68\"}"},{"__ref":"Education:{\"uuid\":\"bb4be666-297e-4e6d-8ac9-52828ad8db25\"}"}],"hiredAt":"2025-03-08T13:21:07.085Z","topics":["K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Video / Photography"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mahalia-dorothy\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fba3e802-db93-46e8-993b-c8edaf3213bb\"}"}}},"_sentryTraceData":"2612371927dc41088fff9eb5a611d812-8528800cb1f199e6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2612371927dc41088fff9eb5a611d812,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"mahalia-dorothy"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","is
