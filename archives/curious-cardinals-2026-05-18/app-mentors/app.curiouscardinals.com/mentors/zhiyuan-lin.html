xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"cb9575f0-2929-465f-8a67-02794a9ba05d\"}":{"__typename":"DeepDives","uuid":"cb9575f0-2929-465f-8a67-02794a9ba05d","content":"\u003cblockquote\u003e\u003cp\u003eBiomedical engineering is a major that values both breadth and depth, which aligns well with my curiosity and desire to explore diverse topics while still allowing me to specialize in niche areas.\u003c/p\u003e\u003ch3\u003e\u003c/h3\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"4a3b76fc-666e-4518-b416-7dc232a654ba\"}":{"__typename":"DeepDives","uuid":"4a3b76fc-666e-4518-b416-7dc232a654ba","content":"\u003cblockquote\u003e\u003cp\u003eI opened the fridge in the middle of the night. Inside, there was no food—only hammers.\u003c/p\u003e\u003c/blockquote\u003e\u003ch3\u003e\u003c/h3\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"92c6f2d1-6079-4dd0-bff8-a7217ebfdc46\"}":{"__typename":"DeepDives","uuid":"92c6f2d1-6079-4dd0-bff8-a7217ebfdc46","content":"\u003cp\u003eMy potential and ntorPublicProfile","uuid":"4c104f52-6c79-40db-aa75-ea815cef1bcb","displayName":"Zhiyuan L.","slug":"zhiyuan-lin","biography":"\u003cp\u003e\u003cbr\u003eHello! My name is Zhiyuan Lin, and I go by Oscar. I am from a small rural area in North Carolina, where growing up with limited academic resources encouraged me to become independent, curious, and proactive about learning. This environment taught me the importance of persistence, adaptability, and community support—values that continue to shape how I approach both academics and mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I served as the programming team leader for my FIRST robotics team, and even qualified for the world championship. Beyond robotics, I explored a variety of interests, including participating in a trivia show and learning pottery, which helped me balance technical thinking with creativity. I graduated as valedictorian with both a high school diploma and an Associate Degree in Science, an experience that prepared me for the academic rigor of college coursework.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow in college, I am majoring in Biomedical Engineering, currently with a strong interest in nephrology. I am particularly fascinated by the kidney’s role in maintaining homeostasis and how engineering innovations can improve diagnostics, dialysis technologies, and patient quality of life. I also enjoy exploring courses related to Chinese traditions and history, and even studied abroad in Beijing to learn more about the language and culture, while gaining a broader global perspective. Outside of the classroom, I work as a lab technician taking care of drosophila, and as a production electrician for college plays. In my free time, I enjoy eating, running, reading, and playing basketball. While I am not much of a gamer, I occasionally play Minecraft, and I enjoy learning hands-on skills such as juggling, pen spinning, and card shuffling.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have been involved in tutoring since high school, including volunteering as a peer tutor for North Carolina Virtual Public School, where I assisted students across the state. These experiences strengthened my communication skills and reinforced my passion for helping others navigate challenging material. I value curiosity, patience, and consistency, and I enjoy learning skills that require steady practice—whether in the lab, on stage, or through hands-on hobbies. Looking ahead, I hope to continue integrating engineering, research, and mentorship in ways that positively impact both science and the communities I’m part of.\u003c/p\u003e","teachingVideoPlaybackId":"p02PyNaNKerXiBiFLNpWLTRLzaOcsjWlng9PL00RoEWns","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cb9575f0-2929-465f-8a67-02794a9ba05d\"}"},{"__ref":"DeepDives:{\"uuid\":\"4a3b76fc-666e-4518-b416-7dc232a654ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"92c6f2d1-6079-4dd0-bff8-a7217ebfdc46\"}"},{"__ref":"DeepDives:{\"uuid\":\"9e8d9ba0-e868-49c5-8f6d-e7dadbebd6ad\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ca683e18-e110-4211-945f-22a2ee31d025/-/preview/-/format/jpg/","https://ucarecdn.com/e3a56828-7557-402a-9782-de44da3ed95e/-/preview/-/format/jpg/","https://ucarecdn.com/5a51b037-0dcb-4c07-a2b6-143a6e91f441/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5310811c-6a6f-4470-865b-9a8b2b36ec01\"}"},{"__ref":"Education:{\"uuid\":\"3d267746-c26e-484a-b59f-df4be03bab43\"}"}],"hiredAt":"2026-01-16T16:12:42.780Z","topics":["Calculus","Chemistry","Biology","Writing","Mandarin Chinese","College Essay Writing","Academic Coaching","Reading","Computer Science"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"RO
