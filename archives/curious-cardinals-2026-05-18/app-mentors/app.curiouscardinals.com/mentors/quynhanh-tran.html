ull},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"07e3ff37-86d6-4bea-a7b9-8e7cb4205dff\"}":{"__typename":"Education","uuid":"07e3ff37-86d6-4bea-a7b9-8e7cb4205dff","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Undeclared","degree":null},"MentorPublicProfile:{\"uuid\":\"8e06d558-c70d-4967-a200-67f0895c1c4f\"}":{"__typename":"MentorPublicProfile","uuid":"8e06d558-c70d-4967-a200-67f0895c1c4f","displayName":"Quynh Anh T.","slug":"quynhanh-tran","biography":"\u003cp\u003eHi! My name is Anh and I'm rising Junior at Barnard College of Columbia University! I've been providing tutoring services since I was a Junior in high school, and I'm familiar with subjects such as economics, computer science, cognitive science, history, English literature, environmental science, and debate for Model United Nations. I have worked with students ranging from ages 15 to 24. I am a student author, in my last year of high school, I was able to get my history research paper published in the Journal of Student Research. I love lifting, yoga, running, writing, and reading. I have had experiences interning for two different tech startups. In high school, I worked with an MIT alumnus and professor, where I had the opportunity to conduct user testing experience, getting feedback for our app and website by talking to students around the Boston area, which relates to the program's field of effectively communicating with students and adolescents. In my freshman year of college, I interned for an Oxford alumni who worked at Goldman for 20 years and founded his startup at Goldman.\u003c/p\u003e\u003cp\u003eI am currently a board member of an educational Model United Nations nonprofit student organization at Columbia University called CESIMS, where we host free teaching conferences for high school students and beginners twice a year. The most rewarding part of this experience is seeing my students improve each day. Whenever I see returning students participate in our new Model UN conferences, I can clearly see how much their debate skills have grown. Last year, I also provided some tutoring lessons to my fellow college students on subjects such as statistics and economics.\u003c/p\u003e\u003cp\u003eFor each tutoring session, I look forward to hearing students share their exam results. Seeing their scores gradually increase makes me feel fulfilled and grateful. I love teaching, and hearing my students explain the concepts I taught them in clear and accurate terms brings me so much joy.\u003c/p\u003e\u003cp\u003eThrough teaching, I have realized that the meaning of life is to learn widely, become excellent at something, and use your knowledge and privilege to help others grow in the areas where you are strongest.\u003c/p\u003e","teachingVideoPlaybackId":"euOoMA9ozDeiNHWd3mmc00tDLW800DZqZixIUrqnYElnw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003ePeriod AI\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"75fca498-250d-47ea-bc5c-38ef52b35c72\"}"},{"__ref":"Favorites:{\"uuid\":\"ee77e3f2-98cf-49e5-afa0-96b1880fdac0\"}"},{"__ref":"Favorites:{\"uuid\":\"bcd353b4-daaf-4506-a0a9-9219bf941c61\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"37b41a00-b083-4b44-8f1a-22286ee3f24d\"}"}],"major":"Undeclared","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"df4d7a8e-6589-41b2-b163-710b883a90a5\"}"},{"__ref":"DeepDives:{\"uuid\":\"873a582e-0e43-4737-9680-220d70b78019\"}"},{"__ref":"DeepDives:{\"uuid\":\"1e3ca08d-3916-4000-8a29-f5e1da848f50\"}"},{"__ref":"DeepDives:{\"uuid\":\"c7046662-c1c5-46b4-b12a-351b0f7dbe0c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/53c26a39-cf9f-4ec4-a2ae-5b9868dd9801/-/pre
