xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0cce0790-89d8-4b39-8ac4-520bebf913e6\"}":{"__typename":"Favorites","uuid":"0cce0790-89d8-4b39-8ac4-520bebf913e6","photoUrl":"https://ucarecdn.com/e8c77142-b735-4e87-97f6-844be8a9a442/","title":"ASTROWORLD","type":"ALBUM"},"Favorites:{\"uuid\":\"9e4d1cb7-d80e-42a7-b8cf-7effbf5236d6\"}":{"__typename":"Favorites","uuid":"9e4d1cb7-d80e-42a7-b8cf-7effbf5236d6","photoUrl":"https://ucarecdn.com/2e187db9-9d52-45dd-9bbe-c4dcabbc3771/","title":"Real Madrid","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"b6826e62-8ab0-43a5-9857-80c09dd8e531\"}":{"__typename":"Favorites","uuid":"b6826e62-8ab0-43a5-9857-80c09dd8e531","photoUrl":"https://ucarecdn.com/ac77fd46-d15e-48f4-a63f-eb55b28501bf/","title":"Clash Royale","type":"GAME"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5ae18f59-2ac1-42a6-a3e1-cf5bb44fb694\"}":{"__typename":"DeepDives","uuid":"5ae18f59-2ac1-42a6-a3e1-cf5bb44fb694","content":"\u003cp\u003ePsychology, game theory, and fiscal policy all in one place! Who could ask for more? Every aspect of economics relates directly to human behavior. Therefore, economics is more than studying world markets and fiscal policy; it is studying human behavior in a high-risk setting. I chose the BA track to allow myself the freedom to take other premed courses. Through my course combination, I have opened a connection between patients' physical and financial lives. Using this connection, I hope to develop cost-efficient solutions to modern healthcare shortcomings, such as mobile healthcare.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"0fa6556e-7f7e-4a35-a966-3cb5c9228312\"}":{"__typename":"DeepDives","uuid":"0fa6556e-7f7e-4a35-a966-3cb5c9228312","content":"\u003cp\u003eIf I find myself operating on a child’s severe diplopia (double-vision) in my own clinic in 10 years, I would be living the dream. I yearn to be a pediatric ophthalmologist. Helping restore vision, a sense that is too often taken for granted, in children would be the most rewarding way I could contribute to my community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d495a79a-0759-48fd-b16a-60aef6bcf6d0\"}":{"__typename":"DeepDives","uuid":"d495a79a-0759-48fd-b16a-60aef6bcf6d0","content":"\u003cp\u003eI spent my summers volunteering at Advanced Behavioral Health (ABH), a clinic for toddlers with mental disabilities. Monday through Friday, 8 am-3 pm, I worked with staff to lead group time motor therapy sessions and vocal therapy lessons. Through four years of volunteering, I learned valuable skills in connecting with and guiding children with disabilities and their families. I also developed relationships with the owners and learned the financial and management duties of running a therapy center in California. In addition to volunteering at ABH, I participated in the Children’s Hospital of Orange County (CHOC) Medical Intelligence and Innovation Institute (Mi4) Summer Internship Program. Over 10 intensive weeks, I shadowed physicians, brainstormed medical solutions, and learned about the integration of technology into modern healthcare. In my free time, I played soccer or video games with my friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"f9689670-c657-423e-b3a8-247ac842e6fd\"}":{"__typename":"DeepDives","uuid":"f9689670-c657-423e-b3a8-247ac842e6fd","content":"\u003cp\u003eMy greatest source of motivation has always been helping others. As long as I can remember, I have known I wanted to be a physician. When I was an elementary schooler, I recall my mom talking about a life she saved by stopping a hemorrhage or a new life she brought into the world. My mom’s role as a lifesaver has strongly influenced my passion for helping others. Since then, I have placed myself on a path to become a physician to help people who otherwise cannot help themselves. This motivator is why I chose my summer medicine-related activities, focused on STEM subjects in school, and even why I came to Stanford. Each step I have taken toward becoming a physician, small and large, helps someone along the way. It can be a classmate I help understand a topic in class, or a patient I translate for during a clinic visit, but my goal in every effort is to help someone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"20da4ded-268f-40d8-96df-36fcc946e7fa\"}":{"__typename":"School","uuid":"20da4ded-268f-40d8-96df-36fcc946e7fa","name":"Servite High School","city":"Anaheim","type":"HIGH","state":"California","country":"United States","zip":"92801"},"Education:{\"uuid\":\"6e33681d-3928-4a69-a075-842d0f144368\"}":{"__typename":"Education","uuid":"6e33681d-3928-4a69-a075-842d0f144368","school":{"__ref":"School:{\"uuid\":\"20da4ded-268f-40d8-96df-36fcc946e7fa\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"14b419cb-6361-4233-b670-00e2a90e2985\"}":{"__typename":"Education","uuid":"14b419cb-6361-4233-b670-00e2a90e2985","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"27032eea-a1d5-4003-83a2-4149106ac26d\"}":{"__typename":"MentorPublicProfile","uuid":"27032eea-a1d5-4003-83a2-4149106ac26d","displayName":"James D.","slug":"james-dunne","biography":"\u003cp\u003eHi! My name is James, but you can call me Jim. I am a current sophomore at Stanford University, studying economics and also on the pre-med track. I am from Laguna Beach, California. My primary professional interest is health economics, and I strive to acquire my MD and MBA. I believe that the key to an efficient and equitable healthcare system requires a diverse knowledge of medical treatments and the financial constructs of modern care.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAcademically, I split my time between economics and life science courses. In high school, I took 15 AP courses, a mix of science and math. Splitting my time between two major fields has helped me think more creatively about how to connect them. For example, while my applied economic statistics and genetics courses seem like an unlikely duo, they intertwine quite well. Statistics provides the mathematical foundation for understanding genetic variation and thus allows physicians to provide patient-centered gene therapy. I firmly believe that abstract thinking, derived from connecting subjects, helps students grasp and maintain their understanding of schoolwork. Outside the classroom, I often attend pre-med activities. Whether I am volunteering at the VA hospital or listening to guest medical school speakers, I immerse myself in extracurriculars centered around medicine. In the summer of 2025, I spent my days working as a camp counselor and my nights working on ophthalmology research. While my academic life can be challenging, I balance the stress with daily physical activity. I am a HUGE soccer fan. Name any current player, club, match, or league, and I guarantee we can talk for hours. I try to play soccer at least three times a week and have met some of my closest friends both at and outside of Stanford through the sport. The other four days, I lift. After my daily exercise, I wind down by watching anything Star Wars related or by browsing Netflix. Balancing school with physical activity is critical to maintaining a healthy body and mind.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI mentioned earlier that I am interested in health economics. My passion for this niche subject comes from my parents. My dad works in real estate, and my mom is an OBGYN. Growing up, I always saw financial success as a product of real estate and personal satisfaction as a result of healing people. Although I felt pressure to choose one over the other, as I got older, I realized that combining both was not only possible but also central to transforming the modern healthcare landscape.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI look forward to meeting you and talking all about medicine, economics, soccer (hopefully you’re not a Barca fan…), and anything else!\u003c/p\u003e","teachingVideoPlaybackId":"KfcOfpreLYl8FhkG8S00fpqHZCsAJx7dfscHadaUcK28","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0cce0790-89d8-4b39-8ac4-520bebf913e6\"}"},{"__ref":"Favorites:{\"uuid\":\"9e4d1cb7-d80e-42a7-b8cf-7effbf5236d6\"}"},{"__ref":"Favorites:{\"uuid\":\"b6826e62-8ab0-43a5-9857-80c09dd8e531\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5ae18f59-2ac1-42a6-a3e1-cf5bb44fb694\"}"},{"__ref":"DeepDives:{\"uuid\":\"0fa6556e-7f7e-4a35-a966-3cb5c9228312\"}"},{"__ref":"DeepDives:{\"uuid\":\"d495a79a-0759-48fd-b16a-60aef6bcf6d0\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9689670-c657-423e-b3a8-247ac842e6fd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f986e961-d57f-42b7-b8e5-67254fde0395/-/preview/-/format/jpg/","https://ucarecdn.com/8b379fde-8e22-4c10-a9f2-1a1cff0ba68e/-/preview/-/format/jpg/","https://ucarecdn.com/d2dd55bf-cf6f-48a3-8f03-9dbf844ce57b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6e33681d-3928-4a69-a075-842d0f144368\"}"},{"__ref":"Education:{\"uuid\":\"14b419cb-6361-4233-b670-00e2a90e2985\"}"}],"hiredAt":"2026-01-21T20:00:52.000Z","topics":["Pre-Algebra","K-5 Grade Math","Algebra II","Algebra I","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Writing","Spanish","Mandarin Chinese","College Essay Writing","Academic Coaching","Executive Function","Creative Writing","Business / Entrepreneurship","Finance / Investing","Medicine / Health"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"james-dunne\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"27032eea-a1d5-4003-83a2-4149106ac26d\"}"}}},"_sentryTraceData":"334976ce80dd465690339489b0e5eba9-9b3fbec9bd5c2c5e-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=334976ce80dd465690339489b0e5eba9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":tr
