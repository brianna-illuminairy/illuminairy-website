xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0ea99aaa-edd1-471c-ab3a-ee19662abbbf\"}":{"__typename":"DeepDives","uuid":"0ea99aaa-edd1-471c-ab3a-ee19662abbbf","content":"\u003cp\u003eDon't be too hard on yourself! I became so wrapped up in results that I couldn't even enjoy the other aspects of life. Results are important, but they're not the end-all. Take a breath and try to find balance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"99b78c9b-0375-4865-96d9-87a0aea477ec\"}":{"__typename":"DeepDives","uuid":"99b78c9b-0375-4865-96d9-87a0aea477ec","content":"\u003cp\u003eI'd love to create or be a part of an organization that focuses on the wellbeing of children and young adults that have lost a parent. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b420cf28-4f77-4d81-b303-109ac647bb6e\"}":{"__typename":"DeepDives","uuid":"b420cf28-4f77-4d81-b303-109ac647bb6e","content":"\u003cp\u003eSpent every summer training! I got the opportunity to travel the world competing for Team USA and it was an incredible experience. I'll never forget exploring new places and the memories I made.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2ae1be8e-4d75-4825-a2ec-615536a165e0\"}":{"__typename":"DeepDives","uuid":"2ae1be8e-4d75-4825-a2ec-615536a165e0","content":"\u003cp\u003eWorking in the NBA is definitely at the top of my list. Practicing as a sports doctor for a specific team or working in a front-office role would fulfill my childhood dreams!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"2dea79ea-d07a-4073-9220-720878d9e326\"}":{"__typename":"School","uuid":"2dea79ea-d07a-4073-9220-720878d9e326","name":"Sonora High School","city":"La Habra","type":"HIGH","state":"California","country":"United States","zip":"90631"},"Education:{\"uuid\":\"6ea49dc0-77f5-4c73-89e6-17a5112240d4\"}":{"__typename":"Education","uuid":"6ea49dc0-77f5-4c73-89e6-17a5112240d4","school":{"__ref":"School:{\"uuid\":\"2dea79ea-d07a-4073-9220-720878d9e326\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"74dff79e-3e33-4fb2-a07a-e3d18e5c75cc\"}":{"__typename":"Education","uuid":"74dff79e-3e33-4fb2-a07a-e3d18e5c75cc","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2024","major":"Human Evolutionary Biology","degree":"Bachelor"},"MentorPublicProfile:{\"uuid\":\"39cc57c6-38cc-4d54-848c-c7a5af7b0388\"}":{"__typename":"MentorPublicProfile","uuid":"39cc57c6-38cc-4d54-848c-c7a5af7b0388","displayName":"Simon L.","slug":"simon-lamar","biography":"\u003cp\u003eHi! I’m Simon, a rising senior (have one semester left) at Harvard, and am studying Human Evolutionary Biology with a secondary in MCB. I’m on the swim team at Harvard and hope to make the Olympic team one day. I would like to attend medical school in the future and am interested in cardiology at the moment! Biomechanics and how sleep plays an integral role in our daily health have been some passions of mine over the last two years. At Harvard, I am the president of the Student-Athlete Advisory Committee, VP of the Athlete Medical Mentorship Program, and help run a student-athlete program centered around mental health. My goal in these clubs and programs is to provide guidance and support to the student-athlete community in conjunction with the athletic department to make the experience at Harvard worthwhile. To relax, I love watching basketball, F1, and college sports. I’ve had tutoring experience for the last five years by helping high school students with college essays and writing in general. I’m looking forward to working with mentees and developing a relationship to help and guide all different kinds of interests and aspirations!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eParticipating at World Championships for Team USA in the 5K and 25K!\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Human Evolutionary Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0ea99aaa-edd1-471c-ab3a-ee19662abbbf\"}"},{"__ref":"DeepDives:{\"uuid\":\"99b78c9b-0375-4865-96d9-87a0aea477ec\"}"},{"__ref":"DeepDives:{\"uuid\":\"b420cf28-4f77-4d81-b303-109ac647bb6e\"}"},{"__ref":"DeepDives:{\"uuid\":\"2ae1be8e-4d75-4825-a2ec-615536a165e0
