xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"602b9ab1-fe71-4be0-b3f1-3f44506e0861\"}":{"__typename":"Favorites","uuid":"602b9ab1-fe71-4be0-b3f1-3f44506e0861","photoUrl":"https://ucarecdn.com/90e8f5bc-f9f3-4ce5-bf5e-5be996a3e60b/","title":"Top Gun: Maverick","type":"MOVIE"},"Favorites:{\"uuid\":\"5d7e1786-228b-424b-9c03-ca9a99a72bf5\"}":{"__typename":"Favorites","uuid":"5d7e1786-228b-424b-9c03-ca9a99a72bf5","photoUrl":"https://ucarecdn.com/3769c67f-be10-4bb8-8d94-f58bf23547e5/","title":"Cheerleading","type":"SPORT"},"Favorites:{\"uuid\":\"80baab93-e9ae-40fd-ad54-f17dff8cda81\"}":{"__typename":"Favorites","uuid":"80baab93-e9ae-40fd-ad54-f17dff8cda81","photoUrl":"https://ucarecdn.com/13abc85d-2be4-45ba-931b-d0c256595d00/","title":"Fortnite","type":"GAME"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"453a53fc-1ae6-4793-ac3d-94c09a45c389\"}":{"__typename":"DeepDives","uuid":"453a53fc-1ae6-4793-ac3d-94c09a45c389","content":"\u003cp\u003eI chose my major because growing up in Fort Lauderdale made me curious about real estate from an early age. Living in a big city, I was surrounded by new buildings being developed, neighborhoods changing, and communities expanding. I became fascinated by how much the built environment shapes daily life, from where people live and work to the places where families and friends come together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I got older, I began to see that real estate is not just about buildings. It is about creating spaces that feel like home and building communities that last. That perspective is what led me to study Business Administration with a focus in Real Estate. It gives me the chance to learn both the technical side of the industry, such as valuation and investment, and the human side, which is about connection and impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f24c0b6d-a0f7-4e06-b535-b5dce5f15142\"}":{"__typename":"DeepDives","uuid":"f24c0b6d-a0f7-4e06-b535-b5dce5f15142","content":"\u003cp\u003eThe advice I would give my middle or high school self is to be where your feet are. At that age I spent a lot of time thinking about what was next, whether it was the next test, the next summer, or the next step after graduation. I would remind myself that it is important to enjoy the stage of life you are in instead of always worrying about the future. Things have a way of working out even if the path does not look exactly like you expect. Looking back, I wish I had trusted that more and allowed myself to slow down and enjoy the moment I was in.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"6f1de4df-89c3-40b9-bbde-8abae515e039\"}":{"__typename":"DeepDives","uuid":"6f1de4df-89c3-40b9-bbde-8abae515e039","content":"\u003cp\u003eMy greatest source of motivation is my family and friends. I am very influenced by my environment and the people I spend time with, so I make it a priority to surround myself with people who are supportive and driven. Being around people who work hard and care deeply about what they do pushes me to set high standards for myself as well. My family has always encouraged me to stay focused and keep going even when things feel overwhelming, and my friends motivate me by challenging me to grow and cheering me on along the way. Having that kind of support system makes me want to be the best version of myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"bd776e0e-138b-47bf-9b3a-53d5337d1f6e\"}":{"__typename":"DeepDives","uuid":"bd776e0e-138b-47bf-9b3a-53d5337d1f6e","content":"\u003cp\u003eMentorship matters to me because I grew up with six siblings, and from a young age I learned the importance of both giving and receiving guidance. In a big family you are constantly looking out for one another, learning from each other’s experiences, and stepping into both the role of teacher and student. My older siblings showed me how to handle challenges and set an example I could look up to, while my younger siblings reminded me how important it is to be patient, supportive, and encouraging.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThose experiences shaped how I view mentorship today. I see it as a way to share what you have learned, offer support during uncertain times, and help someone else feel confident as they move forward. Mentorship is not only about giving advice but also about building a relationship where both people grow. Because of my siblings, I understand how meaningful it is to have someone in your corner, and that is why I care about being that person for others.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"07fb5f3c-ad33-4d20-afd0-6229f32f7cae\"}":{"__typename":"School","uuid":"07fb5f3c-ad33-4d20-afd0-6229f32f7cae","name":"Pine Crest School","city":"Fort Lauderdale","type":"HIGH","state":"Florida","country":"United States","zip":"33334"},"Education:{\"uuid\":\"8236d4d9-6b27-4120-92be-a8c5a139d003\"}":{"__typename":"Education","uuid":"8236d4d9-6b27-4120-92be-a8c5a139d003","school":{"__ref":"School:{\"uuid\":\"07fb5f3c-ad33-4d20-afd0-6229f32f7cae\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2f41b623-6021-4481-934b-c9f2439459c8\"}":{"__typename":"School","uuid":"2f41b623-6021-4481-934b-c9f2439459c8","name":"University of Florida","city":"Gainesville","type":"COLLEGE","state":"Florida","country":"United States","zip":"32611"},"Education:{\"uuid\":\"835e8d06-738c-4dd1-8c1c-636c9001f8b6\"}":{"__typename":"Education","uuid":"835e8d06-738c-4dd1-8c1c-636c9001f8b6","school":{"__ref":"School:{\"uuid\":\"2f41b623-6021-4481-934b-c9f2439459c8\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Business Administration","degree":null},"MentorPublicProfile:{\"uuid\":\"df38a042-5822-4a44-98a3-ffd5ec98d28a\"}":{"__typename":"MentorPublicProfile","uuid":"df38a042-5822-4a44-98a3-ffd5ec98d28a","displayName":"Mackenna R.","slug":"mackenna-riley","biography":"\u003cp\u003eHi, I am Kenna Riley, a junior at the University of Florida studying Business Administration with a specialization in Real Estate. I grew up in Fort Lauderdale in a big family with seven kids, which shaped a lot of who I am. Being one of many siblings taught me patience, responsibility, and how to work well with others. It also made me value connection and community from an early age. My family is a huge part of my life, and I carry those lessons with me into everything I do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt UF I have enjoyed diving into classes that explore how the business world and real estate industry intersect. I like studying topics such as property valuation, investment decisions, and how markets function, but what interests me most is the way these lessons affect real people and communities. Group projects and case studies have been some of my favorite parts of class, because they let me apply ideas in practical ways and collaborate with others. I enjoy the challenge of taking information, organizing it, and presenting it clearly so that others can understand and use it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I try to live a very balanced and active life. I love starting my mornings with Fit classes, which give me energy and a positive mindset for the rest of the day. After class I often stop by a coffee shop to study or catch up with friends. Coffee shops feel like my second home in Gainesville. At home, I like to bake, especially banana bread, which has become my signature recipe. Baking is both relaxing and a way I show love to the people around me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love animals and have four dogs at home, which means there is never a dull moment when I go back to Fort Lauderdale. My family and I also love to travel. Growing up, I spent my summers in Lake Tahoe, California, where we would spend long days on the lake. Those summers gave me a love for nature, adventure, and exploring new places. Even now, traveling is one of my favorite ways to recharge and learn more about the world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt UF I am involved in the Real Estate Society, the Women’s Real Estate Society, and Kappa Alpha Theta. These communities have helped me grow as a leader, meet mentors, and form close friendships. I enjoy supporting younger members and being someone they can rely on for guidance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the heart of everything, I care about bringing positive energy into the spaces I am part of. Whether it is with classmates, coworkers, or friends, I want to help people feel supported, confident, and encouraged to grow.\u003c/p\u003e","teachingVideoPlaybackId":"4cvp01GWcIbdZqAgSoFHw8R97qvC15Wxm1xb01PEnl015w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"602b9ab1-fe71-4be0-b3f1-3f44506e0861\"}"},{"__ref":"Favorites:{\"uuid\":\"5d7e1786-228b-424b-9c03-ca9a99a72bf5\"}"},{"__ref":"Favorites:{\"uuid\":\"80baab93-e9ae-40fd-ad54-f17dff8cda81\"}"}],"causesSupported":[],"major":"Business Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"453a53fc-1ae6-4793-ac3d-94c09a45c389\"}"},{"__ref":"DeepDives:{\"uuid\":\"f24c0b6d-a0f7-4e06-b535-b5dce5f15142\"}"},{"__ref":"DeepDives:{\"uuid\":\"6f1de4df-89c3-40b9-bbde-8abae515e039\"}"},{"__ref":"DeepDives:{\"uuid\":\"bd776e0e-138b-47bf-9b3a-53d5337d1f6e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cd1011dc-3222-43b3-afff-71f18ab6de1b/-/preview/-/format/jpg/","https://ucarecdn.com/44171347-934f-4e6f-9f6e-596b66ca9ff0/-/preview/-/format/jpg/","https://ucarecdn.com/8615cfeb-7d49-4157-8829-179199129bdd/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8236d4d9-6b27-4120-92be-a8c5a139d003\"}"},{"__ref":"Education:{\"uuid\":\"835e8d06-738c-4dd1-8c1c-636c9001f8b6\"}"}],"hiredAt":"2025-09-11T02:56:48.089Z","topics":["K-5 Grade Math","6-8 Grade Science","Writing","Academic Coaching","Reading","Executive Function","College Essay Writing","Economics","Computer Science","History","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Film / Theater","Video / Photography","Business / Entrepreneurship","Machine Learning / AI","Journalism","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mackenna-riley\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"df38a042-5822-4a44-98a3-ffd5ec98d28a\"}"}}},"_sentryTraceData":"41d7753c611d49019ad299a57f5b695a-a4125e3f459b0bc
