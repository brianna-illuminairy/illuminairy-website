ion:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"26f76142-2d08-4c4d-8e06-b8bfc3606902\"}":{"__typename":"DeepDives","uuid":"26f76142-2d08-4c4d-8e06-b8bfc3606902","content":null,"videoPlaybackId":"A7JI6BljFSHySBFqP00h4HFUT602EOeYevXxAFB3Efekk","question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"45e6162a-81e5-476c-b672-0e65057371ee\"}":{"__typename":"DeepDives","uuid":"45e6162a-81e5-476c-b672-0e65057371ee","content":null,"videoPlaybackId":"eRSB62nhiHIdMpq1m1E02QIB7E9mvPc4LE3GNI7o2yJE","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"0317d3f6-2d9b-41d0-ae28-b5892108123a\"}":{"__typename":"School","uuid":"0317d3f6-2d9b-41d0-ae28-b5892108123a","name":"Palisades Charter High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90272"},"Education:{\"uuid\":\"5dbd2827-31e8-43c0-9b9c-c6d2c4ccb70c\"}":{"__typename":"Education","uuid":"5dbd2827-31e8-43c0-9b9c-c6d2c4ccb70c","school":{"__ref":"School:{\"uuid\":\"0317d3f6-2d9b-41d0-ae28-b5892108123a\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"52c8a79b-f402-4697-a2c8-98153c1d4cd5\"}":{"__typename":"Education","uuid":"52c8a79b-f402-4697-a2c8-98153c1d4cd5","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"074db95d-cb04-4ec7-a397-69f7d43cd441\"}":{"__typename":"MentorPublicProfile","uuid":"074db95d-cb04-4ec7-a397-69f7d43cd441","displayName":"Teddy S.","slug":"teddy-suisman","biography":"\u003cp\u003eHi there! My name is Teddy, and I’m from Santa Monica, CA. I grew up playing basketball and football, going to the beach with friends, and exploring the mountains and coast of Southern California. I love to learn and teach, and am particularly passionate about philosophy, psychology, art and literature, and neuroscience. I also have a strong meditation practice and interest in the mind-body connection. If you think we might be a good match, please don’t hesitate to reach out!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA little more about me:\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I was young, what I loved most was sports and play; I used to stay on the playground of my elementary school for hours in the afternoons (my parents said I’d come home looking like a coal miner with all the dirt and grime on my face!). I played soccer, tennis, and then basketball, which became my obsession for many years until I switched to football halfway through high school.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUp until then I’d dreamed of playing basketball in college (ideally at UCLA–\u0026nbsp;sorry, Stanford), so this had taken center stage. But during high school I became increasingly interested in photography, writing, meditation, philosophy, and just learning in general. The shorter football season gave me more free time to explore these interests while still serving as an outlet for my competitive team-spirit.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith this new time, I was able to, among other things, become a member and eventually president of a non-profit called ARTribe which supported student artists across Los Angeles. I loved the creative community and collaboration this organization facilitated, and I began to see that my identity wasn’t just limited to the stereotypical high-school categories of “jock” or “artist” (or even “nerd”; I had started taking a lot of APs at that time as well!). This breadth of interests and identities was part, I think, of why Stanford admitted me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eToday, I play on the Stanford club basketball team, work as a docent at the Cantor Arts Center, serve as a member of the Zen Buddhist Society, and major in psychology. So I think I’ve kept that diversity of interests, as well as that same love of play and exploration I had as a kid on my elementary school playground. I hope to bring all of these traits into my teaching and mentoring!\u003c/p\u003e","teachingVideoPlaybackId":"r3yfrgm01rISOn7gZ9Q5nhKjxNY8OVC8d01BeYgmcQO01Y","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eTo this day, I think the thing I’m most proud of, even more than getting into Stanford, is winning the MVP award at the UCLA basketball camp when I was around 10 or 11. At the time, basketball was my entire life, and I poured my heart and soul into it. I remember after one camp during the summer going home and making a word document with an entire basketball workout I wanted to do every day for the rest of the summer. I just loved the feeling that I was improving at something I cared about, and I had big dreams for basketball. So when I won that MPV award it really was a dream come true, and it showed me that hard work really does pay off. I carried that lesson with me throughout high school, and though I no longer dream of being a basketball star (at least not in the same way), I know that whatever my next dream is, I will bring that same fire and passion to it, and I can’t wait for that moment–\u0026nbsp;I have the next word document ready to go!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a39170b2-bfdd-492b-9e87-16275d218513\"}"},{"__ref":"Favorites:{\"uuid\":\"9b32caf1-a679-4f02-9aa8-7c3c794d37bc\"}"},{"__ref":"Favorites:{\"uuid\":\"4161776f-e9c6-4c43-b86f-139ae4eabd4d\"}"}],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"49bb5a29-4e93-4358-b904-b539ba498d00\"}"},{"__ref":"DeepDives:{\"uuid\":\"8496287e-7cc1-4eb9-b9ac-a35fd1375319\"}"},{"__ref":"DeepDives:{\"uuid\":\"26f76142-2d08-4c4d-8e06-b8bfc3606902\"}"},{"__ref":"DeepDives:{\"uuid\":\"45e6162a-81e5-476c-b672-0e65057371ee\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bbc07345-ea77-47eb-a463-1b0c150a71a2/-/preview/-/format/jpg/","https://ucarecdn.com/38bc77ea-dd6f-4bf5-a3c1-1b7e4c1b2397/-/preview/-/format/jpg/","https://ucarecdn.com/b7209034-1101-4794-997c-3344a18d64c3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5dbd2827-31e8-43c0-9b9c-c6d2c4ccb70c\"}"},{"__ref":"Education:{\"uuid\":\"52c8a79b-f402-4697-a2c8-98153c1d4cd5\"}"}],"hiredAt":"2024-08-01T22:58:27.014Z","topics":["Philosophy","Literature","Creative Writing","STEM Project","Writing"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"teddy-suisman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"074db95d-cb04-4ec7-a397-69f7d43cd441\"}"}}},"_sentryTraceData":"42c60001189d4012bbfa6327b2067939-a7b3b251cbad71e9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=42c60001189d4012bbfa6327b2067939,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},
