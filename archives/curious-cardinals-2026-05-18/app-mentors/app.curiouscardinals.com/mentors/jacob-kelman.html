xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"212cba83-8faf-404a-a266-21e8289c6556\"}":{"__typename":"Favorites","uuid":"212cba83-8faf-404a-a266-21e8289c6556","photoUrl":"https://ucarecdn.com/cd04dedc-641c-43c8-a86c-12c67b5e146b/","title":"Rumors","type":"ALBUM"},"Favorites:{\"uuid\":\"8e59323a-1205-4c2f-a981-47cbff77f9b8\"}":{"__typename":"Favorites","uuid":"8e59323a-1205-4c2f-a981-47cbff77f9b8","photoUrl":"https://ucarecdn.com/8b5acec2-318b-43fa-905f-6d4002532dee/","title":"Basketball","type":"SPORT"},"Favorites:{\"uuid\":\"410ad8d7-540e-4728-a462-44f82a00209a\"}":{"__typename":"Favorites","uuid":"410ad8d7-540e-4728-a462-44f82a00209a","photoUrl":"https://ucarecdn.com/7ee441bd-7fe8-4681-9699-3ee18cb2d8eb/","title":"Dazed and Confused","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c44d80a1-6294-4c5a-b9a6-c37a5285bb8a\"}":{"__typename":"DeepDives","uuid":"c44d80a1-6294-4c5a-b9a6-c37a5285bb8a","content":"\u003cp\u003eI like to be outdoors! I snowboard as much as possible! I was on the ski/board team in college. Last season I boarded 30 days, and this year, on my gap year, I moved closer to the mountains so I can try to get as close as possible to 100 days of boarding. I go on backpacking trips with my friends, I surf, I swim, and I lift weights – I have a lot of fun in the gym. I love to read – I just finished A Secret History by Donna Tart, which was one of my favorite books I’ve read I in while. I also love to cook. I’m, a big new York Cooking recipe guy, and watch TV – Right I’m rewatching succession.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"fb97860d-2c1e-4ef8-9d9d-1c27e808615f\"}":{"__typename":"DeepDives","uuid":"fb97860d-2c1e-4ef8-9d9d-1c27e808615f","content":"\u003cp\u003eI grew up going to sleepaway camp every summer when I was a kid. Once I was in high school, I spent the summer after my freshman year as a CIT. That was the first time I got to experience camp from the other side—helping lead activities, supporting the counselors, and getting to know the younger campers. It was also the first time I realized how much I loved being in a mentorship role, encouraging kids, and helping them feel at home in a new environment.\u003c/p\u003e\u003cp\u003eFrom then on, I returned each summer with more responsibility—first as a junior counselor, then as a full counselor. Those summers taught me patience, leadership, and how to be both a role model and a teammate. Looking back, camp wasn’t just about the outdoors and the fun—it was where I learned the value of creating a safe, supportive space where kids could grow more confident and independent.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0b7989f7-b0da-41cd-ae63-e2d1f9071dd6\"}":{"__typename":"DeepDives","uuid":"0b7989f7-b0da-41cd-ae63-e2d1f9071dd6","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I’d say: don’t be afraid to take big swings. Starting something new—whether it’s a project, a skill, or even just a habit—can feel overwhelming, but the truth is that small consistent steps compound over time. At first it feels like nothing is happening, but one day you look back and realize you’ve built something meaningful. Whether it’s a body of work, a new ability, or confidence in yourself, those little investments stack up. Dream big, start small, and keep going—before you know it, you’ll have created something special.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"09dd40f6-7076-4ee0-ac09-2e02dd7b7a9b\"}":{"__typename":"DeepDives","uuid":"09dd40f6-7076-4ee0-ac09-2e02dd7b7a9b","content":"\u003cp\u003eMentorship matters to me because it’s one of the most powerful ways to help someone grow. I know from my own experiences that having someone who believes in you and is willing to guide you can make all the difference when you’re facing challenges or trying something new.\u003c/p\u003e\u003cp\u003eWhen I’ve been in mentorship roles—whether at camp, helping younger kids navigate friendships and build confidence, or at UCLA through outreach programs supporting students at under-resourced high schools—I’ve seen how small moments of encouragement can spark real change. It’s not about having all the answers; it’s about listening, supporting, and showing someone that they’re capable of more than they thought.\u003c/p\u003e\u003cp\u003eFor me, mentorship is about paying forward the kind of support I’ve been lucky enough to receive in my own life. It’s meaningful because it creates a ripple effect: helping one person believe in themselves can influence how they show up for others, and that impact extends far beyond a single conversation or summer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"27773479-c6e4-4dae-9a8c-685b026455b3\"}":{"__typename":"School","uuid":"27773479-c6e4-4dae-9a8c-685b026455b3","name":"Davis Senior High School","city":"Davis","type":"HIGH","state":"California","country":"United States","zip":"95616"},"Education:{\"uuid\":\"faf9b367-f1e1-49fd-9b1c-abee883bfae1\"}":{"__typename":"Education","uuid":"faf9b367-f1e1-49fd-9b1c-abee883bfae1","school":{"__ref":"School:{\"uuid\":\"27773479-c6e4-4dae-9a8c-685b026455b3\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0c0caa0c-3eb4-444c-9250-7880d11ee571\"}":{"__typename":"School","uuid":"0c0caa0c-3eb4-444c-9250-7880d11ee571","name":"UCLA","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"e53ac1b9-c617-4d73-a016-6fbf641f34d9\"}":{"__typename":"Education","uuid":"e53ac1b9-c617-4d73-a016-6fbf641f34d9","school":{"__ref":"School:{\"uuid\":\"0c0caa0c-3eb4-444c-9250-7880d11ee571\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology, Data Science Concentration","degree":null},"MentorPublicProfile:{\"uuid\":\"9a7dfc4d-7d15-4e51-aeae-6d36eb42686b\"}":{"__typename":"MentorPublicProfile","uuid":"9a7dfc4d-7d15-4e51-aeae-6d36eb42686b","displayName":"Jacob K.","slug":"jacob-kelman","biography":"\u003cp\u003e\u003cstrong\u003eHi, I’m Jacob!\u003c/strong\u003e I graduated from UCLA in 2025 with a degree in Computational \u0026amp; Systems Biology and a concentration in Data Science. I have research experience spanning medicine, computer science/AI, and biology. I’ve tutored students in SAT prep, math, computer science, biology, chemistry, physics, and psychology, and I’ve mentored students on college applications as well as passion projects in data science, biology, and community activism.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePre-Med Researcher \u0026amp; EMT:\u003c/strong\u003e I currently split my time between working in a research lab and on an ambulance, while applying to medical school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside of Work: \u003c/strong\u003eWhen I'm not busy with work I like to stay active! Snowboarding is my favorite, but when there's no snow I love to surf, hike, camp, swim, lift weights, and just be outdoors as much as possible. If I can't make it outside, you can find me trying new recipes or reading a book.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eResearch: \u003c/strong\u003eDuring undergrad my learning was largely shaped through my involvement in academic research. I worked in two different research labs, both of which I’m still involved in.\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eComputational Medicine \u0026amp; Neurobehavioral Genetics \u003c/strong\u003e(Loes Lab) – The Loes Lab investigates the genetic and biological mechanisms underlying psychiatric illness, with a focus on how technology can improve diagnosis and care. The lab combines data science (AI, machine learning, genomics, clinical records) with psychiatric research to better understand mental health disorders. In this lab I contributed to projects ranging from AI-driven analyses of genetic risk to studies on how telehealth can expand access to psychiatric treatment.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eViral Ecology \u0026amp; Metagenomcis \u003c/strong\u003e(Knowles Lab) – The Knowles lab focuses on how viruses interact with their environment. Research is conducted using a blend of traditional wet-lab techniques (experimental virology) and more modern methods in computational biology (metagenomics). In this lab I published papers on topics such as the how viruses have played a role in the evolution of the human gut microbiome.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eTeaching and Mentorship: \u003c/strong\u003eI have always been passionate about helping kids and young adults achieve their goals. I have experience working across modalities, subjects, and age groups. I worked for the UCLA admissions department for 3 years, and was tasked with mentoring students and running application workshops.\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eTeaching/Tutoring: \u003c/strong\u003eIn high school I started tutoring elementary age students in math and reading to get involved with volunteering. I fell in love with teaching, and the privilege of being able to watch someone grow and progress as they work to acquire new skills. Since then I have tutored in college, helping my peers learn math, computer science, biology, chemistry, physics, and psychology.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMentorship: \u003c/strong\u003eMy experience as a mentor began during my time as senior staff at the summer camp I grew up going to. I helped create programming and run the leadership training program for high school students the camp offers. During this I mentored students as they worked on activism focused projects within their communities. One of the biggest successes was the successful campaign for bail reform in San Francisco lead by a mentee.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"igsKpvrCjmOBqpnvOx02Mk7bEv6IOjj9Hsbtyl7eiUzA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m especially proud of publishing my first scientific paper as the lead author.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"212cba83-8faf-404a-a266-21e8289c6556\"}"},{"__ref":"Favorites:{\"uuid\":\"8e59323a-1205-4c2f-a981-47cbff77f9b8\"}"},{"__ref":"Favorites:{\"uuid\":\"410ad8d7-540e-4728-a462-44f82a00209a\"}"}],"causesSupported":[],"major":"Biology, Data Science Concentration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c44d80a1-6294-4c5a-b9a6-c37a5285bb8a\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb97860d-2c1e-4ef8-9d9d-1c27e808615f\"}"},{"__ref":"DeepDives:{\"uuid\":\"0b7989f7-b0da-41cd-ae63-e2d1f9071dd6\"}"},{"__ref":"DeepDives:{\"uuid\":\"09dd40f6-7076-4ee0-ac09-2e02dd7b7a9b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7282d31f-8093-42b3-8aec-9cad969fcd95/-/preview/-/format/jpg/","https://ucarecdn.com/55e56acc-4b41-4109-81a5-5f7f21c7ef17/-/preview/-/format/jpg/","https://ucarecdn.com/2753ee77-6d56-4cc2-ae15-8b5c78d02f8b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"faf9b367-f1e1-49fd-9b1c-abee883bfae1\"}"},{"__ref":"Education:{\"uuid\":\"e53ac1b9-c617-4d73-a016-6fbf641f34d9\"}"}],"hiredAt":"2025-10-03T07:32:07.201Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Computer Science","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Medicine / Health","Sports Analytics","STEM Project","Machine Learning / AI","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jacob-kelman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9a7dfc4d-7d15-4e51-aeae-6d36eb42686b\"}"}}},"_sentryTraceData":"050b2fb6217e42d197f182b02d4fd01d-84bbca6a6aa6433d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65c
