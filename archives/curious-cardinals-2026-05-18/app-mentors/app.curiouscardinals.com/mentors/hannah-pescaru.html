8f3e-d48bd90cd343\"}":{"__typename":"DeepDives","uuid":"cc6b749e-a50c-4dfc-8f3e-d48bd90cd343","content":null,"videoPlaybackId":"I25gnlSYvfVGdCbgC5nIokZFUXmzlydvq3aVkUWSUDc","question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"f83c0f45-f38f-40b4-8c7b-04bc7b324cd3\"}":{"__typename":"School","uuid":"f83c0f45-f38f-40b4-8c7b-04bc7b324cd3","name":"Prospect High School","city":"Mount Prospect","type":"HIGH","state":"Illinois","country":"United States","zip":"60056"},"Education:{\"uuid\":\"eb6cd808-a05f-4297-af34-3f14162af300\"}":{"__typename":"Education","uuid":"eb6cd808-a05f-4297-af34-3f14162af300","school":{"__ref":"School:{\"uuid\":\"f83c0f45-f38f-40b4-8c7b-04bc7b324cd3\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"de1c8d4b-68b7-415d-ba59-00e04947768e\"}":{"__typename":"Education","uuid":"de1c8d4b-68b7-415d-ba59-00e04947768e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Chemistry","degree":null},"Testimonial:b3101ef9-1e71-4913-bc9d-56b02c9c5a22":{"__typename":"Testimonial","id":"b3101ef9-1e71-4913-bc9d-56b02c9c5a22","text":"Hannah has been the perfect mentor for Hailey! Hannah has been supportive, helpful, friendly, and easy to communicate with. Hailey continues to want to work with her, even through summer, so I think that in itself is a huge testimonial! :)","date":"2025-05-29 23:46:20.35+00","rating":5,"endorser":{"__typename":"Endorser","name":"Tori Humphrey","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"0d1ac86e-146b-4b24-bf8d-33268193bd2d\"}":{"__typename":"MentorPublicProfile","uuid":"0d1ac86e-146b-4b24-bf8d-33268193bd2d","displayName":"Hannah P.","slug":"hannah-pescaru","biography":"\u003cp\u003eHi! My name is Hannah and I am a current junior at Stanford University majoring in biochemistry. Originally from the Chicago area, I've been mentoring middle- and high-school students for 5 years, anywhere from their latest math homework assignment to a research paper on Alzheimer's. I'm particularly passionate about improving health literacy for students, and I have led various programs to teach medical fundamentals and mentor student projects related to prevalent conditions such as diabetes, hypertension, and stroke. On campus, I conduct neuroscience research, mentor female undergraduates as a part of Stanford Women in Medicine, and serve as a pre-clinical volunteer at our free clinics. I aspire to become a physician-scientist, providing holistic treatment for patients while also advancing clinical research.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI became interested in learning about health--especially the brain--in high school, when I learned that I have a body-focused repetitive behavior (BFRB). These compulsive behaviors, like hair pulling or nail biting, may seem like bad habits, but they can interfere with an individual's daily life and self-esteem. Learning this about myself helped me feel validated, and I threw myself into research ever since to learn more about my own brain and those around me. A few months later, I found out my close friend also struggled with a BFRB, and I realized that more people than I initially thought suffered in silence. I now prioritize awareness and positive destigmatization along with research, aiming to create a supportive, welcoming environment for all of my students, no matter the background.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not studying the brain or the chemicals inside it, I like leaning into my creative side. I especially love singing and baking, but I recently picked up crocheting, too! I'm also currently training for a half-marathon, so stay tuned for progress on that :) I'm so excited to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"WP6tBgQ8e9kviup00TfQUMQdcfYFKPYLLVEaTYr3ic7g","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGrowing up with a body-focused repetitive behavior (BFRB), I often felt isolated even in my own body. I would have to say that my proudest full-circle moment was being selected to present at International BFRBCon, hosted by The Learning Center for BFRBs, the nation's leading BFRB nonprofit. It was the culmination of all my struggles and research, and it really helped me prove to myself that I was stronger than I thought.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"bd133198-a301-492f-aed9-cfd4726ba0d5\"}"},{"__ref":"Favorites:{\"uuid\":\"f3f9b381-72f5-4295-ac1a-37f58213e839\"}"}],"causesSupported":[],"major":"Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"83db984a-a95a-4d1a-8107-1a2ac72861d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"a791e364-5689-44bf-a687-ad4fb0538bcc\"}"},{"__ref":"DeepDives:{\"uuid\":\"cc6b749e-a50c-4dfc-8f3e-d48bd90cd343\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e03f6b2f-ce6e-4580-9dc8-f34ff8d83d68/-/preview/-/format/jpg/","https://ucarecdn.com/db603725-5e99-4695-a968-f39249d9d436/-/preview/-/format/jpg/","https://ucarecdn.com/910e50b8-24c3-47d8-a6dd-bfbfbe75425a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"eb6cd808-a05f-4297-af34-3f14162af300\"}"},{"__ref":"Education:{\"uuid\":\"de1c8d4b-68b7-415d-ba59-00e04947768e\"}"}],"hiredAt":"2024-08-28T02:10:26.264Z","topics":["Algebra I","Algebra II","6-8 Grade Science","Chemistry","Biology","College Essay Writing","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testi
