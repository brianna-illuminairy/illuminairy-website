xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9c790d5e-b1c9-4681-b449-2f1fdb1f0439\"}":{"__typename":"Favorites","uuid":"9c790d5e-b1c9-4681-b449-2f1fdb1f0439","photoUrl":"https://ucarecdn.com/347c872c-5dfc-4fee-a32b-90f6103f7584/","title":"Arsenal","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"f844926c-cfd5-4fd9-8e2f-5db69a9b7568\"}":{"__typename":"Favorites","uuid":"f844926c-cfd5-4fd9-8e2f-5db69a9b7568","photoUrl":"https://ucarecdn.com/4b522412-b86c-4ff7-864b-8a73e79f3006/","title":"Neymar","type":"ATHLETE"},"Favorites:{\"uuid\":\"ec4a1328-272f-4fc3-bbd1-48692dac8328\"}":{"__typename":"Favorites","uuid":"ec4a1328-272f-4fc3-bbd1-48692dac8328","photoUrl":"https://ucarecdn.com/ecb4f966-386d-4bb3-b41f-49d35567fa71/","title":"Fortnite","type":"GAME"},"CausesSupported:{\"uuid\":\"a1ff035a-cd45-49b9-9bbc-5d8e6077f355\"}":{"__typename":"CausesSupported","uuid":"a1ff035a-cd45-49b9-9bbc-5d8e6077f355","name":"Engineers Without Borders","description":"","photoUrl":"https://ucarecdn.com/e573d4c8-c7e7-4a2a-84d6-d31d7b53f692/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5f7258d9-37c1-4029-873f-6dd410137704\"}":{"__typename":"DeepDives","uuid":"5f7258d9-37c1-4029-873f-6dd410137704","content":"\u003cp\u003eI initially gravitated toward Electrical and Computer Engineering thinking it would give me some distance from coding, but the universe had other plans. It didn't take long to realize that no matter where you go in engineering, code follows. And honestly? I'm glad it does. What really solidified my choice was understanding just how universal ECE is. Almost every industry, from healthcare to aerospace to finance, needs electrical and computer engineers. I wanted a degree that wouldn't box me in, and ECE gave me exactly that: the freedom to go anywhere and build anything\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"a6b25c93-807f-4098-8d1a-9973b2d278b3\"}":{"__typename":"School","uuid":"a6b25c93-807f-4098-8d1a-9973b2d278b3","name":"Appoquinimink High School","city":"Middletown","type":"HIGH","state":"Delaware1","country":"United States","zip":"19709"},"Education:{\"uuid\":\"e1af0025-1672-45cc-8097-7c24b0434ef7\"}":{"__typename":"Education","uuid":"e1af0025-1672-45cc-8097-7c24b0434ef7","school":{"__ref":"School:{\"uuid\":\"a6b25c93-807f-4098-8d1a-9973b2d278b3\"}"},"startYear":"2021","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"e5efd972-4a70-4f0a-a715-c48248cd0614\"}":{"__typename":"Education","uuid":"e5efd972-4a70-4f0a-a715-c48248cd0614","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"c22fb26c-232c-471d-aece-5def1cb93120\"}":{"__typename":"MentorPublicProfile","uuid":"c22fb26c-232c-471d-aece-5def1cb93120","displayName":"Daniel A.","slug":"daniel-anigioro","biography":"\u003cp\u003eHi! I'm Daniel :), a junior at Cornell University majoring in Electrical and Computer Engineering, and I help high/middle schoolers build the skills and confidence to tackle STEM, and maybe even get excited about it :). I've been exactly where you are. I grew up in Nigeria competing in national math and science olympiads, staring down problems that felt impossible at first glance. I know what it's like to feel lost in a subject, and I also know what it's like to put in the work and watch it all come together. That feeling? It never gets old, and it's exactly why I love doing this. Whether you're trying to survive algebra, get ahead in physics, or figure out what \"machine learning\" actually means, I've navigated all of it. Now I get to be the person I wish I'd had, someone who breaks it down, keeps it real, and genuinely believes you're more capable than you think.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Cornell, I work as the Hardware Subteam Lead for Engineers Without Borders, and have organized events connecting 75–100 students with companies like Google and McKinsey. I work best with students who want to strengthen their foundation or stretch into more advanced territory, including:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePre-Algebra through Calculus and Statistics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eChemistry, Physics, and Computer Science\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCoding, Machine Learning / AI, and STEM Projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCollege Essay Writing, Academic Coaching, and Business / Entrepreneurship\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also focus on broader skills like building real curiosity, because the best engineers I know aren't the ones who had all the answers, they're the ones who kept asking questions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003eLinkedin: \u003c/strong\u003ehttps://www.linkedin.com/in/daniel-anigioro\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might include:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking a concept down until it actually makes sense for you\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConnecting the topic to something real, a technology, a career, a problem being solved right now\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWalking through mistakes together and building strategies so they don't happen again\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating space where no question is too basic, because that's how real learning happens\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eMy other Side quests!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I love playing soccer (I played varsity in high school and I'm still very much active), travelling, and cooking to unwind. I'm also a Fortnite player, and yes, I'm actually good. I have two younger siblings, so explaining things patiently and creatively is basically second nature to me.\u003c/p\u003e\u003cp\u003eIf you want to head into your future feeling genuinely prepared, whether that's college, a career in tech, or just acing your next exam, I'd love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"68cEeQ8NPq224MjzsRJp8ED5UAOvCa8NSFc39vFTHko","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMaking sure to take a moment to reflect and enjoy my current situation while achieving things my younger self could have ever imagined!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"9c790d5e-b1c9-4681-b449-2f1fdb1f0439\"}"},{"__ref":"Favorites:{\"uuid\":\"f844926c-cfd5-4fd9-8e2f-5db69a9b7568\"}"},{"__ref":"Favorites:{\"uuid\":\"ec4a1328-272f-4fc3-bbd1-48692dac8328\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"a1ff035a-cd45-49b9-9bbc-5d8e6077f355\"}"}],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5f7258d9-37c1-4029-873f-6dd410137704\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ed2f0f8c-762e-4ea
