xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e721c52e-1455-4062-bd38-4fc57e08d442\"}":{"__typename":"Favorites","uuid":"e721c52e-1455-4062-bd38-4fc57e08d442","photoUrl":"https://ucarecdn.com/3b25e7bb-4f66-4a43-9a79-19f9eba9957a/","title":"\"Way to the Show\" by Solange","type":"SONG"},"Favorites:{\"uuid\":\"bfaaac00-5274-4215-91ff-e8cd40f9cc17\"}":{"__typename":"Favorites","uuid":"bfaaac00-5274-4215-91ff-e8cd40f9cc17","photoUrl":"https://ucarecdn.com/1039f117-7991-43b0-aa49-6a20dbfd210d/","title":"All Desire is a Desire for Being","type":"BOOK"},"Favorites:{\"uuid\":\"a862e044-cb7a-48a8-8784-f2b800f9aa4b\"}":{"__typename":"Favorites","uuid":"a862e044-cb7a-48a8-8784-f2b800f9aa4b","photoUrl":"https://ucarecdn.com/3362a3cd-d07f-456b-ab1e-85f9ed9d2be5/","title":"Dreamgirls: The Musical (I starred in my school's rendition!)","type":"PLAY"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"141345f4-e85c-4043-840c-f0eb4f539636\"}":{"__typename":"DeepDives","uuid":"141345f4-e85c-4043-840c-f0eb4f539636","content":"\u003cp\u003eMy dreams. I go big—I always have. I believe in harnessing my capabilities to bring forth the future I envision for myself, and in every aspect of my life, I've worked to prove this true. My greatest source of motivation by FAR is my proactiveness to imagine—and thus, \u003cem\u003ecreate\u003c/em\u003e—the life I want to see. And in a world that often limits our potential, I will work as your child's mentor to make their dreams a \u003cstrong\u003etop priority.\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"939e0111-7c48-4870-8d22-170075d222a1\"}":{"__typename":"DeepDives","uuid":"939e0111-7c48-4870-8d22-170075d222a1","content":"\u003cp\u003eAs someone on both ends of the stick (mentee and mentor), I know that \u003cstrong\u003eeffective instruction is integral to your child's learning process,\u003c/strong\u003e just as it was for me. Every student has the power and the right to flourish when given the right support!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e7799c35-e578-47ea-b700-63fdbefc6260\"}":{"__typename":"DeepDives","uuid":"e7799c35-e578-47ea-b700-63fdbefc6260","content":"\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSummer post-9th grade:\u003c/strong\u003e Political text- and phone-banking for a California congressional campaign.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSummer post-10th grade:\u003c/strong\u003e Population monitoring with the Public Health Youth Leaders Program under LACDPH. Paired with precalculus!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSummer post-11th grade:\u003c/strong\u003e Pod launching with the Youth Activism Project to highlight issues like education equity and racial advocacy; preparing a research proposal on disinformation with the Pre-College Research Institute.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSummer post-12th grade: \u003c/strong\u003epouring my heart into my new exposure to innovation as a Summer Technology Intern at On Board Experiential, a global top 100 experiential marketing company.\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"407b96bc-fd4e-4ca8-ad28-7a41ef9b4fed\"}":{"__typename":"School","uuid":"407b96bc-fd4e-4ca8-ad28-7a41ef9b4fed","name":"Narbonne High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90710"},"Education:{\"uuid\":\"95f016dd-3f17-4663-b362-e7dfc0e48918\"}":{"__typename":"Education","uuid":"95f016dd-3f17-4663-b362-e7dfc0e48918","school":{"__ref":"School:{\"uuid\":\"407b96bc-fd4e-4ca8-ad28-7a41ef9b4fed\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4f452809-6902-4dfd-bf34-05bc60cb5b61\"}":{"__typename":"Education","uuid":"4f452809-6902-4dfd-bf34-05bc60cb5b61","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Management Science and Engineering + minoring in Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"52361512-7611-4ce1-b058-98bbf3c2e789\"}":{"__typename":"MentorPublicProfile","uuid":"52361512-7611-4ce1-b058-98bbf3c2e789","displayName":"Prince N.","slug":"prince-nwalozie","biography":"\u003cp\u003e\u003cstrong\u003eHey, I’m Prince!\u003c/strong\u003e I’m a music enthusiast, a tech fanatic, and a second-year Stanford student originally from Los Angeles, CA. I have a powerful passion for blending social justice and humanitarianism into the tech realm, and I have multiple years of experience bringing this emphasis into advocacy groups and nonprofit organizations. You can find me engaging in civic discussions, songwriting with friends, and building my Goodreads profile with new favorites (I’m currently engrossed in John Green's \u003cem\u003eThe Anthropocene Reviewed: Essays on a Human-Centered Planet,\u003c/em\u003e a unique collection of personal anecdotes and thoughtful reflections that underscore the beauty in humanity).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, I’m working toward a degree in Management Science and Engineering and a minor in Computer Science; across these two areas of expertise, my main interests are in developing methods that make STEM more equitable and inclusive for minority students. As an active member of the Stanford community, I belong to a variety of clubs and organizations: the Society of Black Scientists and Engineers (SBSE), the Nigerian Students Association (NAIJA), and Everyday People (hip-hop/R\u0026amp;B a cappella group). After college, I intend to pursue a fulfilling career in digital strategy, tech policy, or civic engagement. \u003cstrong\u003eI'm motivated by my lifelong love and commitment to learning,\u003c/strong\u003e and I'm always ready to have an open conversation about topics like media bias, deliberative democracy, and the latest projects aimed at using tech for good.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college and out, I’m a firm believer in \u003cstrong\u003ebeing the gap.\u003c/strong\u003e In everything I do, I make it my mission to locate the \u003cem\u003emissing piece\u003c/em\u003e—whether in a client demo, a study habit, or a skincare routine—and take it upon myself to help as much as possible. This past summer, I brought this mindset to life as a business analyst intern with Accenture—the world’s best management consulting firm (Forbes 2024). I led training sessions on widely unfamiliar topics; I met with subject matter experts (SME) to identify pain points; and I made the most of my time at Accenture by actively taking up opportunities to network, learn about other industries, and grow my professional and technical skills. I’m also a recent volunteer with Seen\u0026amp;Heard, an LA-based professional development program for foster youth ages 16 to 23. In my role as a college liaison, I host Zoom workshops where I outline postsecondary education options for students who are often not exposed to pathways for the future. \u003cstrong\u003eAs your child’s mentor, my mindset of being the gap will be honored: we will work together to heighten interests and strengthen confidence, creating a mutually beneficial learning journey.\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my many experiences, I’m an avid runner, a creative literature connoisseur, and \u003cem\u003e(new!)\u003c/em\u003e a morning meditator. I love spending my weekends thrifting, practicing the flute, and exploring the unknowns of cities like the one I call home. And I have just as much love for the time I spend helping your child soar in their academic and exploratory pursuits. \u003cstrong\u003eI look forward to learning more about you and your growing star!\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Q88z8S01ljJ4qzEJQMIx1FNBspfzV01N00Y1NAI01kMDY9w","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eLast June, I was selected as \u003cstrong\u003e1 of 75 students\u003c/strong\u003e out of 1,000+ U.S. applicants to participate in the inaugural \u003cstrong\u003eCivic Innovation Academy\u003c/strong\u003e in Washington, D.C., sponsored by the nonprofit Civics Unplugged.\u003cbr\u003e\u003cbr\u003eIn D.C., I spoke with and learned from current CEOs, political leaders, intergenerational activists, and members of the United States Congress; I also held discussions with deputy directors from the US Department of Treasury (USDT) and the Internal Revenue Service (IRS). Through the CU CIA Department Challenge, we had the opportunity to take up the role of USDT clients and present a culminating group research project aiming to revolutionize tax accessibility for U.S. taxpayers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOur guiding question: \u003cstrong\u003e\"Why is the U.S. tax code so complicated?\"\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eOur group worked under the Department of Treasury to analyze the tax collection systems of other countries and evaluate the U.S. tax code. \u003cstrong\u003eWe proposed a simplified strategy for filing taxes—\u003c/strong\u003eone that takes full advantage of the digital landscape through the translation of tax codes, the networked collaboration of tax professionals, and the digitization of Volunteer Income Tax Assistance (VITA) Centers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough our decomposed approach to revolutionizing tax accessibility, my team placed as \u003cstrong\u003eone of two finalists\u003c/strong\u003e out of 20 groups! I am committed to bringing this superpower of simplifying strategies to all students.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e721c52e-1455-4062-bd38-4fc57e08d442\"}"},{"__ref":"Favorites:{\"uuid\":\"bfaaac00-5274-4215-91ff-e8cd40f9cc17\"}"},{"__ref":"Favorites:{\"uuid\":\"a862e044-cb7a-48a8-8784-f2b800f9aa4b\"}"}],"causesSupported":[],"major":"Management Science and Engineering + minoring in Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"141345f4-e85c-4043-840c-f0eb4f539636\"}"},{"__ref":"DeepDives:{\"uuid\":\"939e0111-7c48-4870-8d22-170075d222a1\"}"},{"__ref":"DeepDives:{\"uuid\":\"e7799c35-e578-47ea-b700-63fdbefc6260\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d1b694fe-486c-45f1-9120-22c3af047ecf/-/preview/-/format/jpg/","https://ucarecdn.com/61738e9a-d345-404d-bb37-ce2d8c01090c/-/previ
