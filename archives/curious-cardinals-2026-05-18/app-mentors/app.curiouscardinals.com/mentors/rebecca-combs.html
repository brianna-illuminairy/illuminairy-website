xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d1409510-f2f3-4972-b253-b386902fcd0f\"}":{"__typename":"DeepDives","uuid":"d1409510-f2f3-4972-b253-b386902fcd0f","content":"\u003cp\u003eMentorship matters to me because it is what has inspired me to pursue difficult subjects and always try to push/challenge myself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6ecfb385-06c7-48a6-ac5f-5e6572eff9fd\"}":{"__typename":"DeepDives","uuid":"6ecfb385-06c7-48a6-ac5f-5e6572eff9fd","content":"\u003cp\u003eI chose my major because I am passionate about the concept of \u003cem\u003eengineering for humanity\u003c/em\u003e, and I felt that computer science could change the world-- based on my experience working in a computational biology lab and a neruoscience/machine learning lab in high school, and in all of the projects I have seen at the various hackathons I have attended. I hope to contribute towards the field in a meaningful way, in pursuit of this goal. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"540dcc4d-350d-4764-b011-f21ef4dffb9e\"}":{"__typename":"DeepDives","uuid":"540dcc4d-350d-4764-b011-f21ef4dffb9e","content":"\u003cp\u003eDr. Nancy Kanwisher, head of Kanwisher Labs at MIT's Broadhead Institute. She studies facial recognition within the brain, utilizing machine learning to explore mapping areas of the brain out. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"ecd5d830-b468-4db2-a786-5440d2695458\"}":{"__typename":"DeepDives","uuid":"ecd5d830-b468-4db2-a786-5440d2695458","content":"\u003cp\u003eI believe being able to communicate difficult concepts in a way that is clear and easy to understand is crucial for having an in-depth understanding of the concept. As someone who will be a Technical Product Manager in a couple months, being able to communicate difficult concepts clearly will be a key part of my job!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"120dbf32-5990-4660-a515-05b000bcaf2d\"}":{"__typename":"School","uuid":"120dbf32-5990-4660-a515-05b000bcaf2d","name":"Winsor School","city":"Boston","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02215"},"Education:{\"uuid\":\"98e3a213-be92-4f30-aeba-1551668d305b\"}":{"__typename":"Education","uuid":"98e3a213-be92-4f30-aeba-1551668d305b","school":{"__ref":"School:{\"uuid\":\"120dbf32-5990-4660-a515-05b000bcaf2d\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b59a2a4b-9c1a-4264-aea7-abdb2cb1102e\"}":{"__typename":"School","uuid":"b59a2a4b-9c1a-4264-aea7-abdb2cb1102e","name":"Duke Kunshan University","city":"Su Zhou Shi","type":"COLLEGE","state":"Jiang Su Sheng","country":"China","zip":"215316"},"Education:{\"uuid\":\"a355bc9f-dd63-434a-a59a-9f836ee24866\"}":{"__typename":"Education","uuid":"a355bc9f-dd63-434a-a59a-9f836ee24866","school":{"__ref":"School:{\"uuid\":\"b59a2a4b-9c1a-4264-aea7-abdb2cb1102e\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"705adcbd-8333-4cca-90ee-f6c82f622f14\"}":{"__typename":"MentorPublicProfile","uuid":"705adcbd-8333-4cca-90ee-f6c82f622f14","displayName":"Rebecca C.","slug":"rebecca-combs","biography":"\u003cp\u003eThroughout my academic and professional journey, I've been driven by a core belief: technology should solve real problems for real people. As a Technical Product Manager at Red Hat working on Red Hat Enterprise Linux (RHEL), I bring together my background in machine learning and full-stack development to create solutions that matter. What excites me most is finding where technical innovation meets human need.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy foundation in this field was built during my B.S. in Computer Science at Duke Kunshan and Duke University. While coursework provided the fundamentals, I discovered my true calling in collaborative, hands-on projects. Hackathons became my proving ground—high-energy environments where ideas transform into working solutions. At Stanford's TreeHacks, my team won first place for EcoBite, a mobile app tackling food waste. The following year at HackDKU, we earned an honorable mention for Navigator AR, an augmented reality tool designed to help individuals with cognitive impairments like Alzheimer's navigate their environment. These weren't just coding exercises; they represented my commitment to building technology that enhances sustainability, dignity, and independence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis focus on meaningful impact has shaped every aspect of my career. As an undergraduate, I worked as a Data Scientist at Massachusetts General Hospital's Pinello Lab and served as a reviewer for \u003cem\u003eBriefings in Bioinformatics\u003c/em\u003e. A particularly memorable honor was being named a Young Envoys Scholar, which took me to Shanghai to present my perspectives on AI and technology to the Chinese Minister of Education. Whether developing interactive data visualizations or organizing science cafés for high schoolers at the MIT Museum, I've consistently sought to bridge complex technology with human understanding.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you're a student curious about how computer science can drive positive change and energized by interdisciplinary collaboration, I'd love to connect. I'm always eager to share experiences and learn from fresh perspectives in this rapidly evolving field.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d1409510-f2f3-4972-b253-b386902fcd0f\"}"},{"__ref":"DeepDives:{\"uuid\":\"6ecfb385-06c7-48a6-ac5f-5e6572eff9fd\"}"},{"__ref":"DeepDives:{\"uuid\":\"540dcc4d-350d-4764-b011-f21ef4dffb9e\"}"},{"__ref":"DeepDives:{\"uuid\":\"ecd5d830-b468-4db2-a786-5440d2695458\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/262a4949-15ed-41f6-8f1a-f28b3fd26aa8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"98e3a213-be92-4f30-aeba-1551668d305b\"}"},{"__ref":"Education:{\"uuid\":\"a355bc9f-dd63-434a-a59a-9f836ee24866\"}"}],"hiredAt":"2025-04-23T09:41:07.237Z","topics":["Statistics","Writing","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Coding / Programming","Web Design","Machine Learning / AI","Game Design","Public Speaking"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/"],"restrictedProfileVisibility":false,"displayCampaignVis
