xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7d833054-9394-4cc2-a81f-65c1c160796b\"}":{"__typename":"DeepDives","uuid":"7d833054-9394-4cc2-a81f-65c1c160796b","content":"\u003cp\u003eStop worrying so much about being “on track.” The truth is, there is no perfect path. Try things. Fail at things. Change your mind. I used to think every decision had to be perfect, but growth comes from being uncomfortable, from trying things you’re not sure you’re good at. Don’t be afraid to ask for help either — the people who seem like they have it all figured out usually don’t. Be curious, not perfect.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"620f0348-434c-426b-acf9-55e1365bf195\"}":{"__typename":"DeepDives","uuid":"620f0348-434c-426b-acf9-55e1365bf195","content":"\u003cp\u003eI want to build something — whether it’s a company, a movement, or a product — that helps people live with more clarity and confidence. I’m really passionate about making tools that are both accessible and meaningful, especially for younger learners or people who feel left behind by traditional systems. Whatever form it takes, I want it to make a real impact in people’s lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0eb4f400-b93d-42cb-a8c0-d78a3e298879\"}":{"__typename":"DeepDives","uuid":"0eb4f400-b93d-42cb-a8c0-d78a3e298879","content":"\u003cp\u003eMentorship matters to me because it’s the fastest way to turn potential into confidence. I’ve had mentors who helped me take risks, pushed me to aim higher, and reminded me of my value when I forgot it. I want to be that person for someone else — not just to help them understand a subject, but to help them believe in themselves and their ability to learn, grow, and lead.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d32b7a21-5778-49bd-8bb0-cd1007d709be\"}":{"__typename":"DeepDives","uuid":"d32b7a21-5778-49bd-8bb0-cd1007d709be","content":"\u003cp\u003eI chose to major in Computer Science because I love solving problems and creating things that have real-world impact. But more than that, I was drawn to how versatile and powerful CS is — it’s not just about coding, it’s a tool that can be applied to education, healthcare, sustainability, finance, and beyond. I’ve always been someone who’s curious about a lot of different things, and CS gives me a way to explore all of them while building solutions that matter. Whether I’m developing an app to help people stay organized or working on AI tools to improve communication, I enjoy how CS gives me both the logic and the creativity to bring ideas to life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"f1ad1851-cbbe-47fb-acd2-895adeb77973\"}":{"__typename":"School","uuid":"f1ad1851-cbbe-47fb-acd2-895adeb77973","name":"Springfield Central High School","city":"Springfield","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01109"},"Education:{\"uuid\":\"c9601ab6-e935-4915-a835-84237b6bf25c\"}":{"__typename":"Education","uuid":"c9601ab6-e935-4915-a835-84237b6bf25c","school":{"__ref":"School:{\"uuid\":\"f1ad1851-cbbe-47fb-acd2-895adeb77973\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"aaae9651-126b-4bb8-a9f7-cc2bd7077746\"}":{"__typename":"School","uuid":"aaae9651-126b-4bb8-a9f7-cc2bd7077746","name":"Carnegie Mellon School of Computer Science","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"c5d543fe-e30a-4247-a861-abab5bd7887b\"}":{"__typename":"Education","uuid":"c5d543fe-e30a-4247-a861-abab5bd7887b","school":{"__ref":"School:{\"uuid\":\"aaae9651-126b-4bb8-a9f7-cc2bd7077746\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"29e94f8a-478c-4279-8a15-c68b65e82a12\"}":{"__typename":"MentorPublicProfile","uuid":"29e94f8a-478c-4279-8a15-c68b65e82a12","displayName":"Pratick K.","slug":"pratick-kafley","biography":"\u003cp\u003eHi! I’m Pratick Kafley, a student at Carnegie Mellon University with a wide range of academic interests and a genuine passion for helping others learn. Whether it’s exploring the logic behind computer science, unpacking a challenging math concept, writing a compelling essay, or diving into the big questions in ethics and society — I love making complex topics click in a way that’s engaging and approachable.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat drives me most is curiosity. I’ve always enjoyed learning across disciplines — from coding and systems design to economics, writing, and philosophy — and I bring that same energy to mentoring. At CMU, I’ve taken courses in everything from functional programming and AI product design to 3D calculus and social impact. I’ve also worked on real-world projects that bridge tech and society, like building AI tools for workplace communication and visual systems to track job applications.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I spend time mentoring peers, building side projects, and helping others stay motivated and confident in their learning journey. I know how important it is to have someone in your corner — someone who can explain things clearly, help you problem-solve, or just remind you that you’re capable of more than you think.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I care deeply about meeting students where they are and creating an environment where they feel seen, heard, and empowered. Whether you need help understanding the material, preparing for an exam, or exploring what truly excites you — I’m here for all of it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d love to support you in whatever subjects you’re exploring, and help you build confidence not just in what you’re learning, but in how you learn.\u003c/p\u003e","teachingVideoPlaybackId":"6IDuwKp00kosP5s00IIWRInZgorrqaFF7Du4VXEaa8u4c","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7d833054-9394-4cc2-a81f-65c1c160796b\"}"},{"__ref":"DeepDives:{\"uuid\":\"620f0348-434c-426b-acf9-55e1365bf195\"}"},{"__ref":"DeepDives:{\"uuid\":\"0eb4f400-b93d-42cb-a8c0-d78a3e298879\"}"},{"__ref":"DeepDives:{\"uuid\":\"d32b7a21-5778-49bd-8bb0-cd1007d709be\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0a4147df-7cc4-49a2-a4cb-d7319fd976d4/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c9601ab6-e935-4915-a835-84237b6bf25c\"}"},{"__ref":"Educa
