xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"70b83ef4-9843-4591-8e6c-83027281680e\"}":{"__typename":"DeepDives","uuid":"70b83ef4-9843-4591-8e6c-83027281680e","content":"\u003cp\u003eI spent my summers doing neuroscience research at Children's National Medical Center and at UCSD. I also spent a summer interning and doing research at the FDA.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"cacf774e-7a7a-4fbe-a0da-5535737ee620\"}":{"__typename":"DeepDives","uuid":"cacf774e-7a7a-4fbe-a0da-5535737ee620","content":"\u003cp\u003eMentorship and making a meaningful impact on others' lives are incredibly important to me. I aspire to pay forward the guidance and support my mentors provided me in high school, helping younger students navigate their own journeys and reach their full potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"58bdd107-9137-488c-8f29-d63df402a04f\"}":{"__typename":"DeepDives","uuid":"58bdd107-9137-488c-8f29-d63df402a04f","content":"\u003cp\u003eThe best advice I would give to my high school self is to take risks and step outside of my comfort zone. Growth, exploration, and discovering new passions happen when we challenge ourselves to try things that may not come naturally. This might look like joining a club, applying for a leadership position, or trying a new sport! High school offers a unique opportunity to explore new experiences and learn more about yourself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f3cde032-1c97-466f-986d-083742102d07\"}":{"__typename":"DeepDives","uuid":"f3cde032-1c97-466f-986d-083742102d07","content":"\u003cp\u003eI enjoy running, baking, reading, and exploring new coffee shops. I also volunteer at the homeless shelter and visit pediatric cancer patients weekly to provide them with companionship during a stressful time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}":{"__typename":"School","uuid":"e5a76254-778b-4843-9fe4-18689765e318","name":"Sidwell Friends School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20016"},"Education:{\"uuid\":\"00fd41b4-2d7b-494c-8042-597be089b6aa\"}":{"__typename":"Education","uuid":"00fd41b4-2d7b-494c-8042-597be089b6aa","school":{"__ref":"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}"},"startYear":"2016","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"141dcab4-8f2e-440a-b130-905171a69425\"}":{"__typename":"Education","uuid":"141dcab4-8f2e-440a-b130-905171a69425","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"2ed028db-c5e9-4eaf-99bf-67915adaae02\"}":{"__typename":"MentorPublicProfile","uuid":"2ed028db-c5e9-4eaf-99bf-67915adaae02","displayName":"Adie S.","slug":"adie-selassie","biography":"\u003cp\u003eHi! My name is Adie Selassie, and I’m a junior at Harvard University from Arlington, Virginia, studying neuroscience and economics on the pre-medical track.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m passionate about global health equity and how we can leverage science and policy to address disparities in healthcare worldwide.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI currently serve as the president of the Harvard Undergraduate Black Premedical Society and as the social media manager for the Harvard Undergraduate Pediatric Cancer Buddies.\u003c/p\u003e\u003cp\u003eI am also involved in research that focuses on understanding the neural circuits underlying social behavior. Additionally, I have clinical research experience, having worked as a Clinical Research Associate Intern in Emergency Medicine at NYU Bellevue Hospital and having conducted research on social determinants of health at Mount Sinai Hospital. These experiences have deepened my understanding of healthcare disparities and solidified my commitment to a career in medicine.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship and giving back have always been important to me. I spent two years participating in and leading a youth refugee weekend tutoring program, where I helped students with math homework and organized educational activities. This experience has made me effective in supporting students of various learning styles and needs. As a board member of Harvard OpenBio, I organize programs for underrepresented high school and college students around the world to engage with synthetic biology, with the hope of making biological research more accessible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I enjoy running, baking, and exploring new coffee shops. I can’t wait to meet my future mentees and help them achieve their academic goals!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"70b83ef4-9843-4591-8e6c-83027281680e\"}"},{"__ref":"DeepDives:{\"uuid\":\"cacf774e-7a7a-4fbe-a0da-5535737ee620\"}"},{"__ref":"DeepDives:{\"uuid\":\"58bdd107-9137-488c-8f29-d63df402a04f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f3cde032-1c97-466f-986d-083742102d07\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4f60300c-6a96-44ae-bcdc-6e85dd2c6347/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"00fd41b4-2d7b-494c-8042-597be089b6aa\"}"},{"__ref":"Education:{\"uuid\":\"141dcab4-8f2e-440a-b130-905171a69425\"}"}],"hiredAt":"2025-02-12T13:20:31.734Z","topics":["Pre-Algebra","K-5 Grade Math","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Biology","Chemistry","6-8 Grade Science","Writing"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"adie-selassie\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2ed028db-c5e9-4eaf-99bf-67915adaae02\"}"}}},"_sentryTraceData":"d790b12dd7c04073baa67917538ffbcc-805735b89433958e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d790b12dd7
