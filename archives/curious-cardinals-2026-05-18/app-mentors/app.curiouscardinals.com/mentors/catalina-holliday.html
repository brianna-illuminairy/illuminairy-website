xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e242ec97-f6ee-4781-b91d-ff0f0826a232\"}":{"__typename":"Favorites","uuid":"e242ec97-f6ee-4781-b91d-ff0f0826a232","photoUrl":"https://ucarecdn.com/3014f1de-da02-4150-8893-66350b249d39/","title":"“Good Will Hunting”","type":"MOVIE"},"Favorites:{\"uuid\":\"4733c077-6c7b-444d-bbf5-3a02f2293be1\"}":{"__typename":"Favorites","uuid":"4733c077-6c7b-444d-bbf5-3a02f2293be1","photoUrl":"https://ucarecdn.com/5adeff94-070f-48cf-bf16-570133f6cd68/","title":"The Marias- Heavy","type":"SONG"},"Favorites:{\"uuid\":\"b89bb42c-603c-4b95-a376-ac6cb41e1d57\"}":{"__typename":"Favorites","uuid":"b89bb42c-603c-4b95-a376-ac6cb41e1d57","photoUrl":"https://ucarecdn.com/97681095-ea03-402b-a102-1c1309e6e433/","title":"JJ Watt- Texans NFL Player ","type":"ATHLETE"},"CausesSupported:{\"uuid\":\"60ec618b-26f8-4ab5-8978-82cda6dc2fc1\"}":{"__typename":"CausesSupported","uuid":"60ec618b-26f8-4ab5-8978-82cda6dc2fc1","name":"Faith and Community","description":"\u003cp\u003eSuch as FCA, Church outreach, mission work, or community service projects\u003c/p\u003e","photoUrl":"https://ucarecdn.com/728e841e-c078-4d1b-8a1d-4374b1b84aeb/"},"CausesSupported:{\"uuid\":\"e96d3e63-2cb0-49d6-883e-5105673e664a\"}":{"__typename":"CausesSupported","uuid":"e96d3e63-2cb0-49d6-883e-5105673e664a","name":"Mental Health Awareness ","description":"\u003cp\u003ePeople I love suffered due to mental health problems and I get involved to help\u003c/p\u003e","photoUrl":"https://ucarecdn.com/b74497c6-c971-46f6-9253-36b30e006d72/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"da52c118-0f87-4bcd-8b4a-7c3c4a3b7b59\"}":{"__typename":"DeepDives","uuid":"da52c118-0f87-4bcd-8b4a-7c3c4a3b7b59","content":"\u003cp\u003eYou do not always have to be ok and you do not have to put your whole purpose into the expectations you hold for yourself. Some days you will mess up and fall down but you still succeed by just picking yourself up and moving forward even when it is hard too.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"0e47eab2-4517-4746-ab42-b9d1672a623a\"}":{"__typename":"DeepDives","uuid":"0e47eab2-4517-4746-ab42-b9d1672a623a","content":"\u003cp\u003eI spent my summers relaxing. While I still worked out and worked occasionally. I hung out with friends, spent time with family, traveled. My favorite thing to do was go to the beach and walk the boardwalk and grab some of my favorite ice cream from Kohr’s. It makes me happy just thinking about it and I would love to know what you like to do over the summer!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"421346cf-5dd0-4946-9cd2-7a0afb2b24ea\"}":{"__typename":"DeepDives","uuid":"421346cf-5dd0-4946-9cd2-7a0afb2b24ea","content":null,"videoPlaybackId":"301z6ZGpziiW02Osm9ESfKUVNacLEgsXtq8hMPmESt6rY","question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"bf2a515f-2d36-45b2-8011-686bf0a9e502\"}":{"__typename":"DeepDives","uuid":"bf2a515f-2d36-45b2-8011-686bf0a9e502","content":"\u003cp\u003eI like to go on bike rides, go out with friends, sometimes bake and cook, workout, draw/paint, write, do some photography, play sports like soccer or volleyball with friends, and more \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"4c2a07ab-3e48-46ef-98f0-cc83e9cf4cbd\"}":{"__typename":"School","uuid":"4c2a07ab-3e48-46ef-98f0-cc83e9cf4cbd","name":"Nottingham High School","city":"Hamilton Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08619"},"Education:{\"uuid\":\"57329ad4-bd7d-493f-af7b-6be4a59c39e3\"}":{"__typename":"Education","uuid":"57329ad4-bd7d-493f-af7b-6be4a59c39e3","school":{"__ref":"School:{\"uuid\":\"4c2a07ab-3e48-46ef-98f0-cc83e9cf4cbd\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"a4277420-6d0d-4ac2-9506-6d2f86515181\"}":{"__typename":"Education","uuid":"a4277420-6d0d-4ac2-9506-6d2f86515181","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Pre-Med (Neuroscience) ","degree":null},"MentorPublicProfile:{\"uuid\":\"83f76980-57f1-4e62-a7ab-55e6414a69d1\"}":{"__typename":"MentorPublicProfile","uuid":"83f76980-57f1-4e62-a7ab-55e6414a69d1","displayName":"Catalina H.","slug":"catalina-holliday","biography":"\u003cp\u003eHi! I’m Catalina Holliday, a Division I student-athlete at Columbia University studying neuroscience on the pre-med track. As a member of Columbia’s track \u0026amp; field team I’ve learned how to perform at a high level while balancing intense academic and athletic demands.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m here because I know that success isn’t just about being “smart”—it’s about having the right strategies, mindset, and support. I work with students to build confidence, improve academically, and develop systems that actually work for \u003cem\u003ethem\u003c/em\u003e—especially for students who feel overwhelmed or stuck.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I can help with:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e• Study strategies \u0026amp; time management\u003c/p\u003e\u003cp\u003e• Academic coaching (especially for ADHD \u0026amp; different learning styles)\u003c/p\u003e\u003cp\u003e• STEM and Creative subjects, including biology and neuroscience or wanting to start a project or some of the arts as well including creative writing\u003c/p\u003e\u003cp\u003e• Building passion projects for college applications\u003c/p\u003e\u003cp\u003e• Confidence, motivation, and goal-setting\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy journey hasn’t been easy or typical. Growing up with ADHD and dyslexia—while also learning to navigate personal health challenges—I had to completely rethink how I learn. Through trial and error, I built personalized systems that allowed me to succeed at a high level—earning admission to both Columbia University and the University of Pennsylvania, along with multiple academic awards, honor societies, and scholarships. These are the same strategies I now teach my students. I understand what it feels like to struggle, and I know how to help students find strategies that actually work for them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also bring strong leadership and mentorship experience. I currently serve as \u003cstrong\u003eVice President of Columbia Women in Medicine\u003c/strong\u003e, where I help support and guide students interested in healthcare careers and similarly I was able to work at \u003cstrong\u003ePenn Medicine Princeton Hospital\u003c/strong\u003e as an\u003cstrong\u003e Intern \u003c/strong\u003efor quite some time which really allowed me to help others not just physically but mentally by getting to know each of the patients and so on. In high school, I was President of Fellowship of Christian Athletes and Vice President of HOSA, and I’ve worked directly with younger students as a volunteer coach for track, football, and MMA programs. I also founded and organized a \u003cstrong\u003ebreast cancer awareness fundraiser\u003c/strong\u003e at my school, combining leadership with a cause I care deeply about.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a \u003cstrong\u003e2x All-American in shot put and discus\u003c/strong\u003e, Team MVP, and a 4-year varsity athlete who competed at national meets like Penn Relays, I understand discipline, resilience, and how to push through challenges. I bring that same mindset into how I mentor.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academics and athletics, I’m deeply creative. I’ve been recognized for my photography and writing, love drawing, baking and have even performed as a \u003cstrong\u003esoloist at a NYC jazz venue, Don’t Tell Mama\u003c/strong\u003e—experiences that have helped me grow in confidence and self-expression. I love helping students tap into their own creativity and turn their ideas into meaningful passion projects that truly stand out.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy passion for how I choice my path in college (neuroscience) is deeply personal. Watching my grandparents experience Alzheimer’s and dementia inspired me to pursue medicine and understand the brain on a deeper level. That same sense of purpose drives how I mentor—I genuinely care about helping students grow into confident, capable individuals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAbove all, I create a supportive, encouraging environment where students feel comfortable asking questions, making mistakes, and challenging themselves. My goal is not just better grades—but helping students believe in themselves and realize their full potential.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re looking for a mentor who is driven, experienced, and truly invested in your success, I’d love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"548dW7T1tHVN7AO6Ex2HVxCJID5n9or8peH58001aP02o","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was winning gold in two events at state sectionals in track in highschool. While thats not my “greatest achievement” it is a moment I will always remember because I was not expected to get gold in both events and when I did I had some of the greatest teammates who cheered me on and supported me. That’s why that is my proudest moment not because it was just a great achievement but it was an achievement where I got to feel how proud people were and how they appreciate me as one of their teammates. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e242ec97-f6ee-4781-b91d-ff0f0826a232\"}"},{"__ref":"Favorites:{\"uuid\":\"4733c077-6c7b-444d-bbf5-3a02f2293be1\"}"},{"__ref":"Favorites:{\"uuid\":\"b89bb42c-603c-4b95-a376-ac6cb41e1d57\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"60ec618b-26f8-4ab5-8978-82cda6dc2fc1\"}"},{"__ref":"CausesSupported:{\"uuid\":\"e96d3e63-2cb0-49d6-883e-5105673e664a\"}"}],"major":"Pre-Med (Neuroscience) ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"da52c118-0f87-4bcd-8b4a-7c3c4a3b7b59\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e47eab2-4517-4746-ab42-b9d1672a623a\"}"},{"__ref":"DeepDives:{\"uuid\":\"421346c
