xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"49938f39-b042-49ad-a65e-3cd71983d3aa\"}":{"__typename":"Favorites","uuid":"49938f39-b042-49ad-a65e-3cd71983d3aa","photoUrl":"https://ucarecdn.com/cc86c5cb-8913-43d5-9254-ed2a24f21f09/","title":"The Thing","type":"MOVIE"},"Favorites:{\"uuid\":\"83600cfc-c432-4009-857d-b5050643c131\"}":{"__typename":"Favorites","uuid":"83600cfc-c432-4009-857d-b5050643c131","photoUrl":"https://ucarecdn.com/c061603f-fc04-4e1a-92b1-cfaeb432b3d0/","title":"Hilma af Klint","type":"ARTIST"},"Favorites:{\"uuid\":\"c4f91325-713a-4074-967a-092f054aab50\"}":{"__typename":"Favorites","uuid":"c4f91325-713a-4074-967a-092f054aab50","photoUrl":"https://ucarecdn.com/35ee0ed8-8cd4-4503-a631-7d891dd07a45/","title":"Don't Let's Start","type":"SONG"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"eae7d549-9d01-4a9d-9611-a0a45c57517d\"}":{"__typename":"DeepDives","uuid":"eae7d549-9d01-4a9d-9611-a0a45c57517d","content":"\u003cp\u003eThroughout high school, I participated in all manner of math and science extracurriculars, like Science Olympiad, Math League, and Science National Honor Society. I knew I would be doing something STEM in college, but I was interested in so many different things that it was hard to choose!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I registered for classes my freshman year, I off-handedly decided to begin my undergraduate education with introductory biology, and I’m happy to say I’ve never looked back. The thing about biology that has kept me hooked, I think, is that it reminds me how connected we are to other living things 💗🧬\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c0331210-6577-4493-aaaf-9c5fc0f82e8a\"}":{"__typename":"DeepDives","uuid":"c0331210-6577-4493-aaaf-9c5fc0f82e8a","content":"\u003cp\u003eMy greatest passion outside the laboratory is art! 🎨 I loved cartoons and comics growing up, which definitely influences my style today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love to read horror novels 🧟‍♀️👻🦇and science-adjacent nonfiction 🌿🧬🍄\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt home I love to work out 🏋️and spend time with my cat 🐈‍⬛\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"da1ddb90-0d74-4458-aa83-513822277d2a\"}":{"__typename":"DeepDives","uuid":"da1ddb90-0d74-4458-aa83-513822277d2a","content":"\u003cp\u003eI spent a lot of my high school summers volunteering at my local public library 📚 and doing scientific demonstrations for school-age kids at the Hagley Museum and Library 🧪\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also enjoyed going on biking adventures around my hometown 🚲\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNo matter what, I was always learning! 📖\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"f1bc1174-3412-4991-9ed4-7457fb0b0c87\"}":{"__typename":"DeepDives","uuid":"f1bc1174-3412-4991-9ed4-7457fb0b0c87","content":"\u003cp\u003eSomething people might not know about me right away is that I have ADHD! 🧠\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have worked very hard to develop my executive function skills, and it would be so meaningful to help other neurodivergent kids like me find their systems. I believe that anyone can be successful with the right supports in place 🌈💪\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"6b9fe42a-0ec9-4e58-988b-6bfc552f2009\"}":{"__typename":"School","uuid":"6b9fe42a-0ec9-4e58-988b-6bfc552f2009","name":"Concord High School","city":"Wilmington","type":"HIGH","state":"Delaware","country":"United States","zip":"19810"},"Education:{\"uuid\":\"7c7b1eb6-05ef-4c1d-8a6c-23ab7c342eb9\"}":{"__typename":"Education","uuid":"7c7b1eb6-05ef-4c1d-8a6c-23ab7c342eb9","school":{"__ref":"School:{\"uuid\":\"6b9fe42a-0ec9-4e58-988b-6bfc552f2009\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}":{"__typename":"School","uuid":"67d96877-4245-4f9b-a557-94f9ecabd290","name":"Barnard College","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"c247287f-aa1a-44bd-b9c5-4c3cf1fc9d68\"}":{"__typename":"Education","uuid":"c247287f-aa1a-44bd-b9c5-4c3cf1fc9d68","school":{"__ref":"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Cell and Molecular Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"b90b82b3-7b19-4746-9bf6-d1443ad2044c\"}":{"__typename":"MentorPublicProfile","uuid":"b90b82b3-7b19-4746-9bf6-d1443ad2044c","displayName":"Chloe P.","slug":"chloe-paolucci-1","biography":"\u003cp\u003eHowdy! I’m Chloe :)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis year, I am beginning my journey as a PhD student in Cell and Molecular Biology at Columbia University. Let me tell you a little bit about how I got there!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in Wilmington, Delaware with a pretty typical public school experience, but naturally, jam-packed with AP classes and extracurriculars, like choir and musical rehearsals, art,\u0026nbsp; math league, and science olympiad. I’ve never had trouble making things hard on myself, completing multiple independent-study courses so I could both get unnecessarily ahead and maintain my interests, despite a busy schedule.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen it came time to apply to college, it was the first time I realized I could consider historically women’s institutions. Choosing between Smith and Barnard, the allure of New York City won out in the end. At Barnard, I found an incredibly supportive environment to foster my love for STEM among many other brilliant young women.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my undergraduate experience, I was immersed in scientific research and STEM pedagogy, which I developed through teaching assistant and tutoring roles. I feel strongly that science and math would be more accessible to kids with the right teacher. As a giant nerd myself, I get so excited when a new concept clicks for a kid I’m working with--I want nothing more than for them to fall in love with science and math as I did! As a laboratory research scientist, I provide specialist insight into a wide variety of careers related to life sciences and medicine.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduating in 2023, I began my role as a research technician in a cancer lab at Columbia University Irving Medical Center (CUIMC) to gain further experience before pursuing a PhD. In addition to enhancing my understanding of the field and techniques, my lab experience has introduced me to cancer disparities research and community outreach efforts.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am thrilled to begin my PhD in the Cell and Molecular Umbrella Program at CUIMC this year. It hasn’t been the easiest journey, but I am proud to be a part of this community of scientists and physicians. At Curious Cardinals, I hope to be able to empower other young people to pursue their passions to the fullest extent.\u003c/p\u003e","teachingVideoPlaybackId":"dz00GSuCKjn6U4N8UWXyIggqj81h0202Va8NUqTbp801sNw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"49938f39-b042-49ad-a65e-3cd71983d3aa\"}"},{"__ref":"Favorites:{\"uuid\":\"83600cfc-c432-4009-857d-b5050643c131\"}"},{"__ref":"Favorites:{\"uuid\":\"c4f91325-713a-4074-967a-092f054aab50\"}"}],"causesSupported":[],"major":"Cell and Molecular Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"eae7d549-9d01-4a9d-9611-a0a45c57517d\"}"},{"__ref":"DeepDives:{\"uuid\":\"c0331210-6577-4493-aaaf-9c5fc0f82e8a\"}"},{"__ref":"DeepDives:{\"uuid\":\"da1ddb90-0d74-4458-aa83-513822277d2a\"}"},{"__ref":"DeepDives:{\"uuid\":\"f1bc1174-3412-4991-9ed4-7457fb0b0c87\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ce2067d8-8198-4389-bb95-74d7c6d06485/-/preview/-/format/jpg/","https://ucarecdn.com/4eadcaaa-18f7-4d7a-ba59-07b30bd84045/-/preview/-/format/jpg/","https://ucarecdn.com/c359b6bc-c5e3-402c-90b6-f6191b7af056/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7c7b1eb6-05ef-4c1d-8a6c-23ab7c342eb9\"}"},{"__ref":"Education:{\"uuid\":\"c247287f-aa1a-44bd-b9c5-4c3cf1fc9d68\"}"}],"hiredAt":"2025-05-26T09:54:04.277Z","topics":["Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn
