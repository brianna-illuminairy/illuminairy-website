xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f7a85e2d-e1c6-4b39-b559-142b561bebc3\"}":{"__typename":"Favorites","uuid":"f7a85e2d-e1c6-4b39-b559-142b561bebc3","photoUrl":"https://ucarecdn.com/f5142c88-bc27-4db9-beb7-4e84e82968ad/","title":"Stick Season by Noah Kahan","type":"ALBUM"},"Favorites:{\"uuid\":\"c18eeca1-b2ef-4c23-8a88-eaef060b66d5\"}":{"__typename":"Favorites","uuid":"c18eeca1-b2ef-4c23-8a88-eaef060b66d5","photoUrl":"https://ucarecdn.com/d7e0d5bd-c91d-474e-8255-0b8c5a9312a2/","title":"Wicked","type":"PLAY"},"Favorites:{\"uuid\":\"d416562b-b14f-44fb-b469-c3e2e72a0ed9\"}":{"__typename":"Favorites","uuid":"d416562b-b14f-44fb-b469-c3e2e72a0ed9","photoUrl":"https://ucarecdn.com/747dca60-74fe-4720-a257-8fa634c6aacd/","title":"Madrid","type":"CITY"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"7897dd93-3df4-4ddd-8017-daa49fddca11\"}":{"__typename":"DeepDives","uuid":"7897dd93-3df4-4ddd-8017-daa49fddca11","content":"\u003cp\u003eMy dad is a urologic oncologist and my greatest role model. He played a huge role in my decision to pursue medicine because I witness the meaningful impact that his work as a surgeon and physician has on his patients.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"495c0233-3aea-4a46-83a3-4add15c9dc9a\"}":{"__typename":"DeepDives","uuid":"495c0233-3aea-4a46-83a3-4add15c9dc9a","content":"\u003cp\u003eIn my spare time, I love to run, bike, spend time with friends and family, and play tennis. I'm also looking to become a better chef and cook more! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"64a8f9a6-e594-4344-b445-de8ab4a03068\"}":{"__typename":"DeepDives","uuid":"64a8f9a6-e594-4344-b445-de8ab4a03068","content":"\u003cp\u003eAs a high school student, I loved to keep myself busy. I played a sport every season, which taught me discipline and time management since I had to balance after-school practices with homework. I was also a French horn player in the wind ensemble and loved being involved in both music and sports!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"a42803d3-c7f7-4c88-939f-5f1eacee03ef\"}":{"__typename":"DeepDives","uuid":"a42803d3-c7f7-4c88-939f-5f1eacee03ef","content":"\u003cp\u003eWriting my honors thesis in college was the most autonomous research project I had ever undertaken. By completing this, I learned the value of staying proactive and managing my responsibilities and workload with purpose and in a timely manner.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"88e5b078-bfe4-46e7-b7a0-037d65d29801\"}":{"__typename":"School","uuid":"88e5b078-bfe4-46e7-b7a0-037d65d29801","name":"Scarsdale High School","city":"Scarsdale","type":"HIGH","state":"New York","country":"United States","zip":"10583"},"Education:{\"uuid\":\"e1b7a978-2de0-4bc4-a6d7-2c8cdce68b43\"}":{"__typename":"Education","uuid":"e1b7a978-2de0-4bc4-a6d7-2c8cdce68b43","school":{"__ref":"School:{\"uuid\":\"88e5b078-bfe4-46e7-b7a0-037d65d29801\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"af308ad5-eb2d-4c49-b5c2-6d283ef114b5\"}":{"__typename":"Education","uuid":"af308ad5-eb2d-4c49-b5c2-6d283ef114b5","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Quantitative Social Science; Spanish","degree":null},"MentorPublicProfile:{\"uuid\":\"568d8b87-05db-4f33-ac95-f8b9ff680865\"}":{"__typename":"MentorPublicProfile","uuid":"568d8b87-05db-4f33-ac95-f8b9ff680865","displayName":"Lily S.","slug":"lily-steckel","biography":"\u003cp\u003eHi everyone! I'm a current Research Assistant at Weill Cornell Medicine studying racial and ethnic disparities in breast cancer diagnoses. I'm planning to start medical school next summer. Here is a bit of background about myself:\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, I craved a thorough understanding of people and their interconnectedness within the world. I loved to explore and try everything at my disposal. In high school, I played three sports: tennis, basketball, and lacrosse. I was also a French horn player in my school’s wind ensemble and the class treasurer. I loved immersing myself in different groups and learning more about the people around me. This influences my approach to mentoring, as I understand that students have different needs and personalities as they navigate schooling.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI wanted to continue my exploration of different subjects in college. I took classes in history, music, public policy, religion, math, statistics, and more. I decided to double major in Spanish and Quantitative Social Science because I loved the ability to connect with people from other cultures and use data to explain real-world social issues.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy honors thesis, inspired by behaviors I noticed among peers, analyzed how isolation affected Dartmouth students’ drinking habits after the pandemic lockdown. It piqued my curiosity about the behavioral consequences of the pandemic and public health more broadly. My thesis was borne out of what I witnessed; I value research that originates in observation and am eager to help students figure out what excites them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen deciding on a path after college, I chose management consulting. I could use the quantitative skills I learned in college to help businesses navigate complex economic landscapes. While working in consulting, I felt a persistent pull toward a career that fostered deeper human connection and more tangible ways of helping others. I started volunteering at a local hospital in San Francisco, and it soon became clear that medicine was my calling.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI completed the Bryn Mawr Postbaccalaureate Premedical Program last year, where I took all of the prerequisites to apply to medical school. I took the MCAT this past June and applied to start medical school next fall. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academics, I love to run, play tennis, bike, and spend time with friends and family. I’m deeply committed to mentorship and to creating supportive learning environments. I know that every student comes in with different strengths and goals. My goal as a Curious Cardinals mentor is to build lasting confidence, curiosity, and critical thinking skills. I will connect lessons back to the bigger picture and show why the material matters, making learning an enjoyable and rewarding experience. I look forward to working with you!\u003c/p\u003e","teachingVideoPlaybackId":"XnrtMwIYmRvsxoWtz86acbTAKdHN01pTPsRU902X6B18A","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f7a85e2d-e1c6-4b39-b559-142b561bebc3\"}"},{"__ref":"Favorites:{\"uuid\":\"c18eeca1-b2ef-4c23-8a88-eaef060b66d5\"}"},{"__ref":"Favorites:{\"uuid\":\"d416562b-b14f-44fb-b469-c3e2e72a0ed9\"}"}],"causesSupported":[],"major":"Quantitative Social Science; Spanish","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7897dd93-3df4-4ddd-8017-daa49fddca11\"}"},{"__ref":"DeepDives:{\"uuid\":\"495c0233-3aea-4a46-83a3-4add15c9dc9a\"}"},{"__ref":"DeepDives:{\"uuid\":\"64a8f9a6-e594-4344-b445-de8ab4a03068\"}"},{"__ref":"DeepDives:{\"uuid\":\"a42803d3-c7f7-4c88-939f-5f1eacee03ef\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/759df515-1704-499c-8b7f-3ddc2919a430/-/preview/-/format/jpg/","https://ucarecdn.com/4d246d71-8a57-419e-9de3-3c53ff65d9ec/-/preview/-/format/jpg/","https://ucarecdn.com/e875e277-baed-412b-b773-c616a1039ca7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e1b7a978-2de0-4bc4-a6d7-2c8cdce68b43\"}"},{"__ref":"Education:{\"uuid\":\"af308ad5-eb2d-4c49-b5c2-6d283ef114b5\"}"}],"hiredAt":"2025-09-08T18:08:46.836Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","Academic Coaching","College Essay Writing","Executive Function","Music","Medicine / Health","Public Speaking"],"communityBadges":["https://ucarecdn.com/ceacbeeb-af28-4003-96cf-d977276b04ef/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testim
