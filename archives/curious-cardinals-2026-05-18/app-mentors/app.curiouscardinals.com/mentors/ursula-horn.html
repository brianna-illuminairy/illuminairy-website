xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"30194613-4e4d-4f10-8bc9-46333d513689\"}":{"__typename":"Favorites","uuid":"30194613-4e4d-4f10-8bc9-46333d513689","photoUrl":"https://ucarecdn.com/ca2e9609-8657-4594-99d0-89acf41206af/","title":"Robin Williams","type":"ACTOR"},"Favorites:{\"uuid\":\"fe72e657-6181-42f6-a9d8-95be85ffa248\"}":{"__typename":"Favorites","uuid":"fe72e657-6181-42f6-a9d8-95be85ffa248","photoUrl":"https://ucarecdn.com/d68de085-4f68-4a5e-9447-292bd9eda385/","title":"Stevie Wonder","type":"ARTIST"},"Favorites:{\"uuid\":\"afe2fb17-804b-47c7-84cb-399b92683b37\"}":{"__typename":"Favorites","uuid":"afe2fb17-804b-47c7-84cb-399b92683b37","photoUrl":"https://ucarecdn.com/685e08e6-1816-4e32-98c0-c463ec8a571d/","title":"Summer McIntosh","type":"ATHLETE"},"CausesSupported:{\"uuid\":\"7e50d124-67e2-40e6-b1e7-b61e5acd27af\"}":{"__typename":"CausesSupported","uuid":"7e50d124-67e2-40e6-b1e7-b61e5acd27af","name":"Association to Benefit Children","description":"\u003cp\u003eI was a camp counselor and tutor at this organization during high school.\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"89026322-708e-46c5-9e57-187029ebdf41\"}":{"__typename":"CausesSupported","uuid":"89026322-708e-46c5-9e57-187029ebdf41","name":"Trinity's Services and Food for the Homeless","description":"\u003cp\u003eThis organization provides a reliable source of food for people in New York.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"72575341-a8ee-40a4-9e63-3e48a0b9fcf4\"}":{"__typename":"DeepDives","uuid":"72575341-a8ee-40a4-9e63-3e48a0b9fcf4","content":"\u003cp\u003eIn my lifetime, I want my family, friends, and those  around me to feel supported and cared for by me. I want to be able to give back to all the people who have helped me achieve my goals and make a difference in the world. Whether that be through my neuroscience research or volunteering, I want to make an impact that helps people. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"72f9cc6e-7262-4655-a078-a3d127537df4\"}":{"__typename":"DeepDives","uuid":"72f9cc6e-7262-4655-a078-a3d127537df4","content":"\u003cp\u003eI would tell my younger self not to be scared to reach out to people and not to be so hard on myself. With some extra confidence and support from mentors around me, I would have felt braver, tried new things, and challenged myself more. I would make sure to tell myself not to push away fear, but instead, to embrace it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"00fbf88f-2549-45c6-8b11-c7d05063b46b\"}":{"__typename":"DeepDives","uuid":"00fbf88f-2549-45c6-8b11-c7d05063b46b","content":"\u003cp\u003eMy greatest source of motivation is my mother. She is one of the hardest-working, kindest, and most caring people I know, and I aspire to be as successful as she is one day. She has always supported everything I do and is the reason I have been able to succeed at swimming, academics, and personal growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b5efdde6-d086-44ef-84da-7c36434055dd\"}":{"__typename":"DeepDives","uuid":"b5efdde6-d086-44ef-84da-7c36434055dd","content":"\u003cp\u003eWhile no summer looked the same, I usually centered them around science, swimming, and spending time outdoors. My first summer, I worked in an Infectious Diseases \u0026amp; Immunology lab at NYU, where I learned about adhering to strict protocols and worked alongside inspiring researchers. The following summer, I was a camp counselor and tutor for the Association to Benefit Children in Harlem, NY. I had been tutoring online with this organization since middle school, and wanted to continue with them full-time for a summer. My third summer, I worked on a farm in Wisconsin and volunteered with a voting agency. I spent my final summer before college working as a swim instructor, online tutor, and travelling! Alongside this, I spent every summer swimming 1-2 times per day on my swim team. We would travel for competitions, training trips, and technique camps. The experiences I was able to have during my summers shaped me as a person and allowed me to understand more about the world around me. It made me realize that I wanted to dedicate my life to helping people, even though I may not have known yet in what capacity. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"6a3858a9-f89f-4e9d-81c2-e9c9421997b7\"}":{"__typename":"School","uuid":"6a3858a9-f89f-4e9d-81c2-e9c9421997b7","name":"Eleanor Roosevelt High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10021"},"Education:{\"uuid\":\"f25698c9-3b14-4f66-a5ae-714cb2a2f41a\"}":{"__typename":"Education","uuid":"f25698c9-3b14-4f66-a5ae-714cb2a2f41a","school":{"__ref":"School:{\"uuid\":\"6a3858a9-f89f-4e9d-81c2-e9c9421997b7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"4cd183fa-4390-4232-8378-8edff0cecf91\"}":{"__typename":"School","uuid":"4cd183fa-4390-4232-8378-8edff0cecf91","name":"Swarthmore College","city":"Swarthmore","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19081"},"Education:{\"uuid\":\"b12976f1-f3a5-400b-9640-69d214339951\"}":{"__typename":"Education","uuid":"b12976f1-f3a5-400b-9640-69d214339951","school":{"__ref":"School:{\"uuid\":\"4cd183fa-4390-4232-8378-8edff0cecf91\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology, Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"ab798ecc-d0b0-458f-be6d-1c02c1dbf3dd\"}":{"__typename":"MentorPublicProfile","uuid":"ab798ecc-d0b0-458f-be6d-1c02c1dbf3dd","displayName":"Ursula H.","slug":"ursula-horn","biography":"\u003cp\u003eHi! My name is Ursula, and I just graduated from Swarthmore College with a double major in Biology and Psychology (with a research emphasis in Neuroscience and Computer Science). I worked in a neuroscience lab at Swarthmore for three years, studying Depression using EEG. This work sparked my love for studying brain disorders, data analysis, and coding. I have always had a passion for science, math, and problem-solving, which I am able to apply to my new job at the NIH (National Institutes of Health) in Washington, D.C., where I work in a lab that studies epilepsy and memory using intracranial neurosurgical procedures.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOutside of school, I have dedicated most of my life to swimming and volunteering. I have been swimming for 20 years, with 15 years of competitive swimming. I thoroughly enjoyed my commitment to this sport, as it taught me the importance of accountability, dedication, and perseverance. Throughout high school and college, I volunteered at organizations that provided support to low-income and homeless families, hospice care, tutoring, and swim lessons. Through both swimming and volunteering, I loved being able to challenge myself physically and mentally.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThrough my work at a non-profit organization in NYC as a tutor and camp counselor, tutoring individually online, and my work at Swarthmore tutoring kids and college students, I have learned a lot about how learning looks different for everyone. I enjoy finding new ways to teach students who may learn at different paces, appreciate unique activities, or prefer learning visually. I am easily adaptable, as I have learned to do this with my own learning style, so I am quick to understand if I need to change my teaching method.\u003c/p\u003e\u003cp\u003eIn lower school, I often struggled learning like other kids, so I found support in teachers, coaches, and other mentors to help me uncover how I could best succeed academically. I often viewed having learning disabilities as a disadvantage, but later came to realize that these disabilities just made my learning journey look different. However, this didn’t discourage me. I learned about the importance of advocating for myself and appreciating finding new challenges along the way.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs a mentor with Curious Cardinals, I hope to inspire and help kids who need encouragement to finding how they can succeed in or outside of the classroom, even if that looks different than their peers. Through a connected, patient, and supportive teaching-style, I will be a reliable and caring mentor in order for the student to feel inspired and motivated to learn. I ensure that the student and I establish trust and a connection first before starting to break down difficult concepts. It is my goal to make sure the student feels supported and listened to throughout our entire mentorship.\u003c/p\u003e","teachingVideoPlaybackId":"noIkLHA38bUUaU8P7A01XPEkyggzRN4jjRNqiF6Hkon00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI swam for 20 years, starting at just two years old. I graduated from Swarthmore College with two awards from my swim team, which highlighted my love for working hard and collaborating with others. Despite some challenges along the way, I was able to continue swimming with the help of my family, teammates, and incredible coaches. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"30194613-4e4d-4f10-8bc9-46333d513689\"}"},{"__ref":"Favorites:{\"uuid\":\"fe72e657-6181-42f6-a9d8-95be85ffa248\"}"},{"__ref":"Favorites:{\"uuid\":\"afe2fb17-804b-47c7-84cb-399b92683b37\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"7e50d124-67e2-40e6-b1e7-b61e5acd27af\"}"},{"__ref":"CausesSupported:{\"uuid\":\"89026322-708e-46c5-9e57-187029ebdf41\"}"}],"major":"Biology, Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"72575341-a8ee-40a4-9e63-3e48a0b9fcf4\"}"},{"__ref":"DeepDives:{\"uuid\":\"72f9cc6e-7262-4655-a078-a3d127537df4\"}"},{"__ref":"DeepDives:{\"uuid\":\"00fbf88f-2549-45c6-8b11-c7d05063b46b\"}"},{"__ref":"DeepDives:{\"uuid\":\"b5efdde6-d086-44ef-84da-7c36434055dd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/134f5377-55be-4b07-aa17-9d06d098c1bb/-/preview/-/format/jpg/","https://ucarecdn.com/38d5f967-50f3-4da5-8325-ccd8cb30cc1a/-/preview/-/format/jpg/","https://ucarecdn.com/a1ad1257-1dd7-455d-96b0-6f59a7b39639/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f25698c9-3b14-4f66-a5ae-714cb2a2f41a\"}"},{"__ref":"Education:{\"uuid\":\"b12976f1-f3a5-400b-9640-69d214339951\"}"}],"hiredAt":"2025-07-02T17:24:38.606Z","topics":["Public Speaking","K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Biology","Chemistry","Physics","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Computer Science","K-6 Storybook","Creative Writing","History Project","Video / Photography","Sports Journalism","Business / Entrepreneurship","Coding / Programming","Medicine / Health","Sports Analytics","Web Design","STEM Project","Machine Learning / AI","Game Design","Sustainability","Journalism","Debate"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ursula-horn\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ab798ecc-d0b0-458f-be6d-1c02c1dbf3dd\"}"}}},"_sentryTraceData":"675fac7303944e82a7a58f6a0c1ac76c-85d25b379f171550-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=675fac7303944e82a7a58f6a0c1ac76c,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ursula-horn"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
