xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"47706c15-752f-4018-8915-133f9d1a3238\"}":{"__typename":"Favorites","uuid":"47706c15-752f-4018-8915-133f9d1a3238","photoUrl":"https://ucarecdn.com/9c5f445d-55c2-473c-8ccb-7e66154baa17/","title":"If This Isn’t Nice, I Don’t Know What Is Album by Still Woozy","type":"ALBUM"},"Favorites:{\"uuid\":\"c910f878-9aa2-4470-816a-7013af05cfb0\"}":{"__typename":"Favorites","uuid":"c910f878-9aa2-4470-816a-7013af05cfb0","photoUrl":"https://ucarecdn.com/316f6e47-476a-491a-8bf2-4413b749e879/","title":"Dinner at the Homesick Restaurant by Anne Tyler","type":"BOOK"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"5636ae0a-5303-449b-9f7b-befe7acd1189\"}":{"__typename":"DeepDives","uuid":"5636ae0a-5303-449b-9f7b-befe7acd1189","content":"\u003cp\u003eMy answer is basic but true—my parents. They’re both hardworking immigrants who pushed incredibly hard to get to where they are today, often making sacrifices I didn’t fully understand until I got older. They’ve always led by example, showing me what resilience, grit, and purpose look like in real life. More than anything, they’ve instilled in me a drive not just to accomplish things, but to do them well, to go further, and to never take opportunities for granted.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ea26d393-b9c5-4c03-9972-2ac508834953\"}":{"__typename":"DeepDives","uuid":"ea26d393-b9c5-4c03-9972-2ac508834953","content":"\u003cp\u003eMentorship matters to me because I know how much of a difference it makes to have someone just a few steps ahead who \u003cem\u003egets it\u003c/em\u003e. A lot of my growth has come from asking questions, getting real advice, and hearing that it’s okay not to have it all figured out. I want to be that person for someone else—to help make things a little less overwhelming and a lot more exciting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c7648350-caa7-4c63-a33c-5d4fff17e134\"}":{"__typename":"DeepDives","uuid":"c7648350-caa7-4c63-a33c-5d4fff17e134","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is publishing a book. I’ve been writing stories since middle school (some half-finished, some tucked away in old notebooks) and creative writing used to be a huge part of my life. Somewhere along the way, I got busy and focused more on business and academics, but that creative side has always stayed with me. I’d love to return to it one day and actually bring one of those stories to life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"79c1f6b6-c511-456a-aa4a-b33b586c9605\"}":{"__typename":"School","uuid":"79c1f6b6-c511-456a-aa4a-b33b586c9605","name":"Conestoga High School","city":"Berwyn","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19312"},"Education:{\"uuid\":\"91467616-bfcd-40cc-8e45-2125dfeecea9\"}":{"__typename":"Education","uuid":"91467616-bfcd-40cc-8e45-2125dfeecea9","school":{"__ref":"School:{\"uuid\":\"79c1f6b6-c511-456a-aa4a-b33b586c9605\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"12b06998-ebf7-4d26-af90-96730ff82dd8\"}":{"__typename":"Education","uuid":"12b06998-ebf7-4d26-af90-96730ff82dd8","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Applied Economics and Management","degree":null},"MentorPublicProfile:{\"uuid\":\"25a1a26f-f79e-454d-8a88-b4095bcc945d\"}":{"__typename":"MentorPublicProfile","uuid":"25a1a26f-f79e-454d-8a88-b4095bcc945d","displayName":"Maya R.","slug":"maya-rao","biography":"\u003cp\u003eHi! I’m Maya, a sophomore at Cornell University majoring in Applied Economics and Management with a dual concentration in Finance and Entrepreneurship.\u003cbr\u003e\u003cbr\u003eI've always been a curious and creative thinker. I grew up in Houston and later moved to the suburbs of Philly, where I developed an early interest in business through side hustles like jewelry making and reselling clothes. That early entrepreneurial spark led me to reach out to World of My Own, a Parsons student-founded clothing brand, where I explored brand strategy, market research, and the challenges of ethical production. It was such a cool experience to see someone turn a personal passion into a real business from the ground up–and it strengthened my interest in launching my own venture one day (hence, the concentration!)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile not a business, building Art for Hearts—a passion project turned community organization—has been one of my most meaningful experiences. I started it during the pandemic after noticing how isolated seniors at a local center were due to visitor restrictions. What began as a few handmade cards eventually grew into a team of over 100 volunteers delivering monthly crafts to hospitals and senior homes. We also partnered with local art centers and schools to host creative events and connect generations through art. It taught me how to recognize community needs, rally people around a mission, and lead with both heart and strategy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus, I’m involved in Cornell Hedge Fund, Cornell Fashion Industry Network, and the Cornell Consulting Club. To touch on one, through Cornell Consulting Club, I’m currently working on a paid, real-world project with a global telecom company, helping them rethink their customer loyalty program through strategy development, consumer research, and competitive analysis. It’s been one of my favorite hands-on learning experiences and has deepened my interest in problem-solving through a business lens.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics and internships, I love discovering small coffee shops, curating thrifted outfits, binge-watching shows, and going on long walks while listening to my favorite playlists. I’m also a big fan of travel and spontaneous creativity—whether that means writing, sketching, or brainstorming new ventures with friends.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I’m excited to support students who are navigating their own interests in business, would benefit from additional academic support, or even just figuring out what excites them. I know how overwhelming it can be to explore different paths or apply to college while balancing everything else. My goal is to be a resource, a sounding board, and a cheerleader—whether you’re brainstorming a business idea, prepping for a Stats test, or just trying to find your spark.\u003c/p\u003e","tea
