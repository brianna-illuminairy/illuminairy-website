xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"54b8b673-011e-4a26-ae73-b54f98bfa600\"}":{"__typename":"Favorites","uuid":"54b8b673-011e-4a26-ae73-b54f98bfa600","photoUrl":"https://ucarecdn.com/0ea59b49-b39f-4d1c-919f-75aff73902b6/","title":"Bangkok, Thailand (especially for the FOOD).","type":"CITY"},"Favorites:{\"uuid\":\"19ee879b-5f60-4e16-a5ce-14b71833671f\"}":{"__typename":"Favorites","uuid":"19ee879b-5f60-4e16-a5ce-14b71833671f","photoUrl":"https://ucarecdn.com/e5a2dd40-505d-44c6-8a55-ba291513524f/","title":"Subnautica!!","type":"GAME"},"Favorites:{\"uuid\":\"16d338e9-d2ac-4f7a-83dc-925c83f118d7\"}":{"__typename":"Favorites","uuid":"16d338e9-d2ac-4f7a-83dc-925c83f118d7","photoUrl":"https://ucarecdn.com/0778e88f-9597-49f2-b8b6-4f49d64e4c1b/","title":"Fred Again.. I recently went to his SF show. It was magical.","type":"ARTIST"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"96135a3c-7a84-48fb-a43b-637c41f3c41c\"}":{"__typename":"DeepDives","uuid":"96135a3c-7a84-48fb-a43b-637c41f3c41c","content":"\u003cp\u003eOne thing I'm interested in is impactful companies in the consumer packaged goods industry! Right now, I'm working on bringing in CPG founders to my campus student-run café (where I am in charge of events) to share their experiences starting a business in the consumer industry. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"9e15d965-f341-46f2-be2d-83560c9aab75\"}":{"__typename":"DeepDives","uuid":"9e15d965-f341-46f2-be2d-83560c9aab75","content":"\u003cp\u003eWho decided you can only have one dream job? Mine are always changing depending on what I'm into at the moment. Right now, my dream jobs are children's book illustrator (I'm taking a class on this in school) and restaurant critic.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f679b133-8691-4e85-a4df-be7ff24beeed\"}":{"__typename":"DeepDives","uuid":"f679b133-8691-4e85-a4df-be7ff24beeed","content":"\u003cp\u003eI would tell myself this great piece of advice that someone else once told me: \"Always surround yourself with people smarter than you.\"\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"558da0e6-61b3-484c-87f1-a40e8a2749f4\"}":{"__typename":"DeepDives","uuid":"558da0e6-61b3-484c-87f1-a40e8a2749f4","content":"\u003cp\u003eI spent a lot of my time outdoors, whether that was camping in the national park, rafting down whitewater, horseback riding or hiking.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"f580e9cc-a73b-4235-9a7b-72d954c0a6cf\"}":{"__typename":"School","uuid":"f580e9cc-a73b-4235-9a7b-72d954c0a6cf","name":"Jackson Hole High School","city":"Jackson","type":"HIGH","state":"Wyoming","country":"United States","zip":"83001"},"Education:{\"uuid\":\"dcf6589e-7abd-4aca-95b1-bfe99d9c99e0\"}":{"__typename":"Education","uuid":"dcf6589e-7abd-4aca-95b1-bfe99d9c99e0","school":{"__ref":"School:{\"uuid\":\"f580e9cc-a73b-4235-9a7b-72d954c0a6cf\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"8c1b4589-25e6-4bd3-ad27-0aaa982b8906\"}":{"__typename":"Education","uuid":"8c1b4589-25e6-4bd3-ad27-0aaa982b8906","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Design (AI + UX)","degree":null},"MentorPublicProfile:{\"uuid\":\"639f481f-945b-441a-9429-e8947b217ccd\"}":{"__typename":"MentorPublicProfile","uuid":"639f481f-945b-441a-9429-e8947b217ccd","displayName":"Linden H.","slug":"linden-hansen","biography":"\u003cp\u003eHi! I’m Linden, a sophomore at Stanford University studying Design with a focus on AI and user experience, with a minor in creative writing! I'm from Jackson Hole, Wyoming, but I spent a lot of my childhood in Bangkok, Thailand. Both my homes exposed me to polar opposite ways of living and instilled in me a curiosity for culture and human experience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've always been obsessed with the myriad ways we express ourselves and interact with the world around us, and that intellectual trail eventually led me to product design. I want to help the students I work with find this spark, too. Building products, especially consumer ones, requires blending creative and technical strengths, tapping into the left and right brain. If that excites you, then I \u003cem\u003ehave\u003c/em\u003e to meet you! Together, we'll follow constructive design thinking frameworks to create a meaningful passion projects that brings together design, entrepreneurship, and storytelling to breathe life into your idea, scaling it from inception to reality. And along the way, we'll develop timeless skills while mastering modern technologies (the two can coexist!).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf this sounds like you, but you don't know where to start, don't worry. I was the same way. Many students know what topics of interest appeal to them, but struggle to shape them into something concrete. My role as a mentor is to help you identify what excites you and break that vision into tangible steps. All you need is confidence in your creative intuition. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy background is super interdisciplinary, as I've explored the the many facets of product design and its complementary fields. I’ve worked on websites, brand campaigns, graphic design, product design/management, social media strategy, editorial content creation, storytelling projects, and more.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I’m extremely compassionate, encouraging, structured, and collaborative. And I'm a big believer in the fruits of organization! Any student I partner with will quickly gain stellar time and task-management skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love reading classic literature, snowboarding in the backcountry, and playing open-world RPG video games with my younger sisters! They are my best friends and, honestly, my OG mentees. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf any of this sounds like you, reach out! I can't wait to meet you!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"ImAa02DuN5gmRoKXLx2kAgnaSqhGwRwc1b2IOBFS00QgA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"54b8b673-011e-4a26-ae73-b54f98bfa600\"}"},{"__ref":"Favorites:{\"uuid\":\"19ee879b-5f60-4e16
