xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a65e32b3-6dd7-4c35-b4bd-32c965d79f04\"}":{"__typename":"DeepDives","uuid":"a65e32b3-6dd7-4c35-b4bd-32c965d79f04","content":"\u003cp\u003eDon’t rush to have it all figured out. Being young is about exploring—what you love, how you learn, and who you want to become. Whether that means diving into books, starting a random project, or just getting curious about something new, it all counts. Don’t feel boxed in by what others say you’re “good at” or “should do.” Make mistakes, take risks, and focus on how you respond—that’s where the real learning happens. Enjoy being a work in progress.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6476d013-d429-4835-9f0e-3462eae7d2da\"}":{"__typename":"DeepDives","uuid":"6476d013-d429-4835-9f0e-3462eae7d2da","content":"\u003cp\u003eMentorship matters because it’s rooted in authentic connection and mutual growth. As I’ve learned through teaching, there isn’t just one “expert” in the room—everyone brings valuable knowledge and perspective. Mentorship is about sharing that knowledge, learning together, and supporting each other’s growth. At its core, it’s about helping someone become the best version of themselves—while also growing yourself along the way. Having someone in your corner who truly listens, believes in you, and helps you stretch your thinking makes all the difference.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"3103ac2f-06bb-4e14-ba6b-fd834bde3e59\"}":{"__typename":"DeepDives","uuid":"3103ac2f-06bb-4e14-ba6b-fd834bde3e59","content":"\u003cp\u003eI want to live a life that makes people say, “Carter Hollingsworth — she made an impact you could feel and a difference you couldn’t forget.” I don’t need to be the person who solves world hunger or cures cancer (though how amazing would that be!). I just want people to know I showed up fully—worked hard, loved deeply, and brought purpose into every space I entered. I hope to build meaningful relationships, leave a real, tangible impact on the lives of the people I work with, and challenge them to grow in ways that matter. Making someone feel seen, supported, and stronger because of our connection—that’s the kind of legacy I want to leave.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"6bfa4435-d1f6-4d8d-9b54-afb94098ac6c\"}":{"__typename":"DeepDives","uuid":"6bfa4435-d1f6-4d8d-9b54-afb94098ac6c","content":"\u003cp\u003eOne of the passion projects I’m most proud of is my senior thesis, which I wrote in Spanish after studying abroad in Sevilla, Spain. My research explored how physical space—specifically the architecture of the American home—shapes the labor conditions and lived experiences of Latina domestic workers in the U.S. I was deeply interested in how power operates through everyday structures and environments, and how these hidden systems reinforce inequality. Drawing from psychology, Spanish literature, and architectural theory, I analyzed how the design of private homes can both reflect and perpetuate social hierarchies. This project allowed me to combine language, cultural analysis, and real-world impact into one sustained, meaningful inquiry—and it reminded me how powerful research can be when it’s rooted in curiosity and social justice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"f3d06080-323b-4552-8c31-613fde8614b8\"}":{"__typename":"School","uuid":"f3d06080-323b-4552-8c31-613fde8614b8","name":"St. John's School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77019"},"Education:{\"uuid\":\"d1865447-e3c4-460b-b4ce-a0b765ac904d\"}":{"__typename":"Education","uuid":"d1865447-e3c4-460b-b4ce-a0b765ac904d","school":{"__ref":"School:{\"uuid\":\"f3d06080-323b-4552-8c31-613fde8614b8\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"4d09ffed-cb50-4e82-9419-fd0241ee208c\"}":{"__typename":"School","uuid":"4d09ffed-cb50-4e82-9419-fd0241ee208c","name":"Amherst College","city":"Amherst","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"01002"},"Education:{\"uuid\":\"7842db0d-405c-41eb-ad16-9d6fd82cb155\"}":{"__typename":"Education","uuid":"7842db0d-405c-41eb-ad16-9d6fd82cb155","school":{"__ref":"School:{\"uuid\":\"4d09ffed-cb50-4e82-9419-fd0241ee208c\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology and Spanish with a Concentration in Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"752ed844-823e-49b9-ae92-26cfdf09fc25\"}":{"__typename":"MentorPublicProfile","uuid":"752ed844-823e-49b9-ae92-26cfdf09fc25","displayName":"Carter H.","slug":"carter-hollingsworth","biography":"\u003cp\u003eHi! I’m Carter, a recent graduate of Amherst College, where I majored in Psychology and Spanish with a concentration in Political Science and was also a proud member of the Women’s Soccer team. I grew up in Houston, Texas, attending public school before transitioning to a private high school where I learned the power of grit and adaptability. There, I fell in love with learning because it opened doors: to new ideas, new worlds, and new versions of myself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt my core, I’m a total nerd. Studying psychology taught me how and why people think, while studying Spanish gave me a new way to explore culture, language, and identity. I even studied abroad in Sevilla, Spain, where I lived with a host family, took university courses, and wrote my senior thesis entirely in Spanish on how space and architecture impact the lives of Latina domestic workers in the U.S. That research experience taught me how to find, explore, and write deeply about the ideas that matter—and I’d love to help you do the same.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a student-athlete, I know what it means to manage a packed schedule, stay organized, and lead with intention. Now as a 5th Grade Teacher in Teach For America pursuing my Master’s in Education, I believe the best learning happens when students feel seen, safe, and supported—and when they’re encouraged to nerd out on what excites them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore turning to teaching full-time, I interned in New York City for two summers—first at Loeb.nyc, a venture capital firm where I worked on marketing strategy and business development, and later at AlphaSights, where I supported capital markets clients in fast-paced research environments. These roles gave me experience in the corporate world, interviewing experts, conducting market analysis, and working on high-impact teams—so if you're curious about that world or need help preparing for it, I’ve got you covered.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy sessions are structured, warm, and collaborative. I specialize in helping students brainstorm, build research questions, write clearly (and with joy!), and explore topics they care about. Whether you're working on a school paper, a personal essay, or your own passion project, I’ll meet you where you are—and help you get where you want to go.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I love reading (especially fiction), cooking, diving into Supreme Court podcasts, and exploring whatever topic I’m curious about that week. My philosophy? \"There are no mistakes, only happy accidents\" - Bob Ross. Learning is messy—and that's what makes it beautiful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLet’s get curious together. I can’t wait to meet you.\u003c/p\u003e","teachingVideoPlaybackId":"3agEcigODss00xG91RI02003yY5bRgWbhQPmpIBCfgL02u8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology and Spanish with a Concentration in Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a65e32b3-6dd7-4c35-b4bd-32c965d79f04\"}"},{"__ref":"DeepDives:{\"uuid\":\"6476d013-d429-4835-9f0e-3462eae7d2da\"}"},{"__ref":"DeepDives:{\"uuid\":\"3103ac2f-06bb-4e14-ba6b-fd834bde3e59\"}"},{"__ref":"DeepDives:{\"uuid\":\"6bfa4435-d1f6-4d8d-9b54-afb94098ac6c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6173dda1-181c-4ff7-9849-2830f4527892/-/preview/-/format/jpg/","https://ucarecdn.com/3311644a-e0a8-4bd2-9b4c-7e3ccaf1808e/-/preview/-/format/jpg/","https://ucarecdn.com/3072a0a9-be29-4059-a5dc-ab3d03b4a67f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d1865447-e3c4-460b-b4ce-a0b765ac904d\"}"},{"__ref":"Education:{\"uuid\":\"7842db0d-405c-41eb-ad16-9d6fd82cb155\"}"}],"hiredAt":"2025-07-2
