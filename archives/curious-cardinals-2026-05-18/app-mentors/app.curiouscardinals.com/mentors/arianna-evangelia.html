ice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"55cd521f-b0ef-40a3-807a-52859a7eab8f\"}":{"__typename":"DeepDives","uuid":"55cd521f-b0ef-40a3-807a-52859a7eab8f","content":null,"videoPlaybackId":"GzbbY5OBO02j3HauSbcWlhvs7HGktdXsA02019vvTyhcvQ","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"870bb2d7-eeac-438d-9f86-dbb59fce4dd5\"}":{"__typename":"DeepDives","uuid":"870bb2d7-eeac-438d-9f86-dbb59fce4dd5","content":null,"videoPlaybackId":"b9Xuwynd1jdyUPBfn1qK8eFPtwmK7lf1DCjlbO2RDqc","question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9a29fa9b-a3ed-480a-a6f2-15525190f5e2\"}":{"__typename":"DeepDives","uuid":"9a29fa9b-a3ed-480a-a6f2-15525190f5e2","content":null,"videoPlaybackId":"2JH1ZtizLjl02cvvjReLKuHZaAGgXzZC01aBAD502ehIf4","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9e622fc0-8421-4f8c-879b-04f0843f6be5\"}":{"__typename":"DeepDives","uuid":"9e622fc0-8421-4f8c-879b-04f0843f6be5","content":null,"videoPlaybackId":"HhFAbMqyk2xUTTPBikYyMDnmcuNyyUSnOM1e2GwV6mw","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"82490df7-9a56-485e-a32f-947278a25a96\"}":{"__typename":"School","uuid":"82490df7-9a56-485e-a32f-947278a25a96","name":"Spanish River Community High School","city":"Boca Raton","type":"HIGH","state":"Florida","country":"United States","zip":"33496"},"Education:{\"uuid\":\"c9ca48a6-7f98-4499-b848-1507adc27d7d\"}":{"__typename":"Education","uuid":"c9ca48a6-7f98-4499-b848-1507adc27d7d","school":{"__ref":"School:{\"uuid\":\"82490df7-9a56-485e-a32f-947278a25a96\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"bff77ac4-cb2c-4359-b2eb-ea143c7d2d08\"}":{"__typename":"Education","uuid":"bff77ac4-cb2c-4359-b2eb-ea143c7d2d08","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Theatre \u0026 International Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"93e488db-8e8a-400e-a4a4-a09f62804ada\"}":{"__typename":"MentorPublicProfile","uuid":"93e488db-8e8a-400e-a4a4-a09f62804ada","displayName":"Arianna E.","slug":"arianna-evangelia","biography":"\u003cp\u003eHey there! My name is Ari and I'm a 24-year-old Greek-American artist. Upon receiving my BA in Communications (Theatre, International Studies, and Film \u0026amp; Media Studies) from Northwestern University, I moved to Los Angeles to pursue my artistic passions. I am eager to assist in the making and execution of any passion project! As a published author and working filmmaker, I am sure that my expertise and guidance will elevate and encourage younger artists to reach their full potential, no matter what age.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs an actor, writer, director, and producer of film and theatre, I have a lot of experience in the arts. At Northwestern, I starred in countless plays, short and feature films, and web series'. Additionally, I co-created, wrote, directed, and produced a four-part web series, won several grants to produce short films I had written, co-wrote an original musical, was editor of the satire magazine Sherman Ave, and produced and directed several Emmy-winning late-night comedy shows. Since graduating, I've starred in two professional plays (and won acting awards for both) as well as various short and feature films (including a music video for the band Sum 41, which was so cool). I'm currently working on a number of films in development (as both an actor and writer) and have already sold scripts to major television networks, including PBS! I've also worked for several small production companies and film festivals, so I've seen a wide range of scripts and films, thereby learning what really works in this industry.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, while at Northwestern, I was a talent buyer for Dillo Day, the largest student-run music festival in the nation. For this position, I identified and booked appropriate talent for the event and negotiated contracts for high-profile artists with top talent agencies. In order to book the most perfect lineup, I had to keep my finger on the pulse of pop culture on campus all the while working with a budget of up to 300K. While I no longer work in the music business, I am absolutely passionate about music and could talk about artists and albums for days.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also have deep roots in social justice organization through projects including Solidarity Street, Fossil Free NU, and Students Organizing for Labor Rights. Additionally, during my senior year of high school, I hosted and organized the first ever Boca Raton location charity walk for the National Eating Disorders Association, raising over $17,000 for eating disorder research and treatment. I am well-equipped to assist in any philanthropic or general event organization and execution!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a Greek-American, family and community are the most important things in my life. The values I learned from my Greek community growing up have stuck with me through thick and thin. Above all other achievements, I simply try my best to be good to others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn essence, as a hopeless romantic in denial, I find solace and torture in existential ruminations, Russian literature, avant-garde filmmaking, and my cat. When I'm not ruminating, acting, or mentoring, I can usually be found playing bass in my rock band, writing for my Substack, pleading with the Greek Consulate of LA to grant me my Greek citizenship, or taking myself on dates around the city (highly recommend).\u003c/p\u003e","teachingVideoPlaybackId":"Nk2YHn01AvP1mK88mAe4uxphkXE1ox8HM02b3EDgLXaAU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI was threatened with expulsion for leading walk-outs at my high school in political protest of lack of gun control following the 2018 tragedy at Marjory Stoneman Douglas, a high school ten minutes from mine. So, I guess not super cool that I was almost expelled, but actually super cool that I stood up for what I believe in, regardless of consequences. I will always rely on my moral backbone to do what's right.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e173d3ac-4e28-49ce-bb42-8dea6ba53975\"}"},{"__ref":"Favorites:{\"uuid\":\"9af5ebb3-7c51-4e59-9c4a-4cb8138a0976\"}"},{"__ref":"Favorites:{\"uuid\":\"f5576b67-83a2-46d2-a4f4-7ea3b6c3e0cb\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"41f6db05-f86f-4c83-a403-b574467ff764\"}"},{"__ref":"CausesSupported:{\"uuid\":\"9f30aa2e-4559-4420-8f20-e78982c194d8\"}"}],"major":"Theatre \u0026 International Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"55cd521f-b0ef-40a3-807a-52859a7eab8f\"}"},{"__ref":"DeepDives:{\"uuid\":\"870bb2d7-eeac-438d-9f86-dbb59fce4dd5\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a2
