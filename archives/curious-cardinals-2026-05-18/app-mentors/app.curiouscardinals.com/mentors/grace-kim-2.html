xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"775f5db1-c873-4bf1-8454-f9b0dfdeb3c1\"}":{"__typename":"Favorites","uuid":"775f5db1-c873-4bf1-8454-f9b0dfdeb3c1","photoUrl":"https://ucarecdn.com/c5392c4a-43be-4c82-b8f3-44f6b724f8e6/","title":"Matilda","type":"MOVIE"},"CausesSupported:{\"uuid\":\"ed6be757-5dc2-40df-a450-ba9a9da69a95\"}":{"__typename":"CausesSupported","uuid":"ed6be757-5dc2-40df-a450-ba9a9da69a95","name":"American Cancer Society","description":"","photoUrl":"https://ucarecdn.com/8b6e2f6f-68aa-4313-85bf-769d7c019855/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0872ee56-8ff0-450c-9f6b-616c3df973ee\"}":{"__typename":"DeepDives","uuid":"0872ee56-8ff0-450c-9f6b-616c3df973ee","content":"\u003cp\u003eI entered college as a biomedical engineering major, thinking I would want to work with biomaterials and drug discovery. At Cornell's engineering school, freshmen are required to take an introductory to CS course, CS 1110. I really enjoyed this course and decided to affiliate with computer science shortly after! As for operations research and information engineering (ORIE), I took an introduction to engineering course called Engineering Operations: Data Science and Decision Making, which ended up being my favorite course at Cornell! The professor was absolutely amazing and I just loved the content learned in the course so much that I decided to switch into ORIE! I still pursued my interests in BME through clubs and research, but ultimately ended up going with a double major in CS and ORIE\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"d1e926c9-1894-4ce4-afe6-013f97ea96fa\"}":{"__typename":"DeepDives","uuid":"d1e926c9-1894-4ce4-afe6-013f97ea96fa","content":"\u003cp\u003eI was a type A go-getter who did just about everything under the sun! I was the type of student to find a potential opportunity, draft a message, and send out an email within 24 hours. I wasn't really afraid of rejection, since it was redirection to finding more opportunities! I loved (and still love) to learn, and would try to find chances to learn something new whenever possible. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d7ad3a4d-2802-4f4e-998c-d96c4ae196cf\"}":{"__typename":"DeepDives","uuid":"d7ad3a4d-2802-4f4e-998c-d96c4ae196cf","content":"\u003cp\u003eI love arts and creation! I make polymer clay charms/figurines and sell them on Etsy, bake pretty desserts to share with friends/family, and enjoy searching for new clothing patterns to make my own pieces!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"faeb73ee-f1fb-4343-8c92-eb02dcf167b3\"}":{"__typename":"DeepDives","uuid":"faeb73ee-f1fb-4343-8c92-eb02dcf167b3","content":"\u003cp\u003eI wanted to run a cat cafe, where visitors can eat and drink while playing with cats! It was silly for me personally because I am severely allergic to cats...\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"9db0c741-64f2-4342-8511-1d689f987ced\"}":{"__typename":"School","uuid":"9db0c741-64f2-4342-8511-1d689f987ced","name":"West Windsor-Plainsboro High School South","city":"West Windsor Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08550"},"Education:{\"uuid\":\"6be7bf95-7db6-42cc-8b4e-71cb892f8742\"}":{"__typename":"Education","uuid":"6be7bf95-7db6-42cc-8b4e-71cb892f8742","school":{"__ref":"School:{\"uuid\":\"9db0c741-64f2-4342-8511-1d689f987ced\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"30477cde-a234-41ed-a841-68922f998477\"}":{"__typename":"Education","uuid":"30477cde-a234-41ed-a841-68922f998477","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science and Operations Research Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"9a87e67f-84e7-443c-b9f0-bba0ac855876\"}":{"__typename":"MentorPublicProfile","uuid":"9a87e67f-84e7-443c-b9f0-bba0ac855876","displayName":"Grace K.","slug":"grace-kim-2","biography":"\u003cp\u003eTo a lot of people, I am often known as a computer science student, but I’m here to tell you that my path didn’t always look like that!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am a senior at Cornell University studying computer science and operations research (which is an interesting mix of programming, applied math, and data science)! I love learning about all things STEM, and have dabbled in all kinds of STEM fields before. Fun fact - I entered college as a biomedical engineering major! Outside of the classroom, I've been involved in cardiovascular research, a robotics project team, e-board in various student groups, and several software engineering internships and hackathons. One of my passions is equity and accessibility, and these have been driving forces in my education and activities. I love being able to use software engineering to create real impact. In my free time, you can find me crafting using polymer clay, finding new music to listen to, and watching/rating movies!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was involved in a lot of things – from co-founding a school club, being a varsity athlete, nationally ranked cellist in several ensembles, winning writing accolades (Scholastic Writing and Arts, National High school poetry contest) orchestra council treasurer, being a student at Columbia University's Science Honors Program every Saturday, to being a chem-bio research intern at UPenn\u0026nbsp;– I graduated with a diverse set of experiences that have helped me into being the person I am today. I definitely was a go-getter back in the day, and loved to seize and find any opportunity or project that came my way, often even paving my own path for initiatives.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy extracurriculars in high school and college reflect a diverse set of passions and interests. I am so excited to be a part of Curious Cardinals to help students explore and grow their passions as well! As a mentor, I can promise three things: listening, engaging, and encouraging. Each person has their own set of passions, skills, and strengths, and as a mentor, it’s my job to listen to them, engage them with thought-provoking and deep questions, and encourage them to grow – the sky’s the limit! Not all classrooms have four walls, and I’m excited to provide a safe and engaging environment for you or your child :)\u003c/p\u003e","teachingVideoPlaybackId":"602vmyQ02eK5BLq02X1zyOXlkK5fZmhUtZ8500O4zqy2CSs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI recently completed a software development engineering internship at Amazon and developed a super cool feature that people will use one day - something I never thought I would be able to do 3 years ago!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"775f5db1-c873-4bf1-8454-f9b0dfdeb3c1\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"ed6be757-5dc2-40df-a450-ba9a9da69a95\"}"}],"major":"Computer Science and Operations Research Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0872ee56-8ff0-450c-9f6b-616c3df973ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1e926c9-1894-4ce4-afe6-013f97ea96fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7ad3a4d-2802-4f4e-998c-d96c4ae196cf\"}"},{"__ref":"DeepDives:{\"uuid\":\"faeb73ee-f1fb-4343-8c92-eb02dcf167b3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/960a3e35-cddf-4dd9-b899-ac0c764b7a54/-/preview/-/format/jpg/","https://ucarecdn.com/68448c90-bc72-4920-abbd-614d4564c1a3/-/preview/-/format/jpg/","https://ucarecdn.com/49d92fbf-361b-45d4-8889-b34626068367/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6be7bf95-7db6-42cc-8b4e-71cb892f8742\"}"},{"__ref":"Education:{\"uuid\":\"30477cde-a234-41ed-a841-68922f998477\"}"}],"hiredAt":"2025-12-17T18:42:54.348Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Academic Coaching","College Essay Writing","Computer Science","Coding / Programming","Medicine / Health","Web Design","Machine Learning / AI","STEM Project"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,
