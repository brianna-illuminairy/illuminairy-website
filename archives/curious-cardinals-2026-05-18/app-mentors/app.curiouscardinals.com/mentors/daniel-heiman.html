xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"271f8cda-1111-4016-9d21-16f66c573466\"}":{"__typename":"DeepDives","uuid":"271f8cda-1111-4016-9d21-16f66c573466","content":"\u003cp\u003eMy greatest mentor is my dad. He’s incredibly knowledgeable in so many areas, and he always seems to have the right answer, no matter the situation. Even when I’m convinced I’m 100% correct and he’s wrong, he somehow proves me wrong every time. I really look up to him because of how smart and insightful he is, and his guidance has shaped a lot of who I am today. I aspire to be like him, comfortable in every situation and never afraid to express his true self.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9fffdf84-24f3-49f1-a38f-762f22bf44c3\"}":{"__typename":"DeepDives","uuid":"9fffdf84-24f3-49f1-a38f-762f22bf44c3","content":"\u003cp\u003eThroughout my life, I’ve been fortunate to have mentors who have guided me through different stages and challenges. Growing up in various environments, from New Jersey to Israel to Costa Rica, each place came with its own set of opportunities and obstacles. No matter where I was, there was always someone—a coach, teacher, or community leader—who helped me find my way and encouraged me to grow. Their support made a huge impact on who I am today. Now, I want to pay that forward and be that guiding person for someone else. Mentorship isn’t just about giving advice; it’s about being there for someone, helping them navigate their own journey, and encouraging them to reach their potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ae7e8cd7-8498-470f-9c49-e3feecdccd88\"}":{"__typename":"DeepDives","uuid":"ae7e8cd7-8498-470f-9c49-e3feecdccd88","content":"\u003cp\u003eOne passion project I created was TSF, a fútbol organization I started while living in Costa Rica. TSF was focused on bringing together local players and providing them with opportunities to play, grow, and improve their skills. I was involved in recruiting players, managing the team, organizing events, and playing! It was a way to not only connect people through soccer but also to give back to the community by offering a space where players could develop and showcase their talents. The experience taught me a lot about leadership, teamwork, and the impact of sports on bringing people together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"ca98567f-374b-4b55-ae6b-186c85a7f9f3\"}":{"__typename":"DeepDives","uuid":"ca98567f-374b-4b55-ae6b-186c85a7f9f3","content":"\u003cp\u003eThe summer after senior year, I went on a backpacking trip through Europe with two of my high school friends. We traveled by train, exploring both bustling cities and serene wilderness. The trip was a perfect balance of adventure and discovery, as we immersed ourselves in different cultures, tried new foods, and experienced the beauty of the landscapes. We visited Madrid, Barcelona, Annecy, Innsbruck, Munich, Prague, Berlin, and Amsterdam. Some of the highlights were hiking in the Alps, meeting new friends from foreign countries, and of course, eating lots and lots of doner kebab.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"e303f4af-821a-4a80-b723-9b9d01a188fc\"}":{"__typename":"Education","uuid":"e303f4af-821a-4a80-b723-9b9d01a188fc","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics/Undecided","degree":null},"School:{\"uuid\":\"bea4eb8c-6213-47c3-af37-e053454a8fee\"}":{"__typename":"School","uuid":"bea4eb8c-6213-47c3-af37-e053454a8fee","name":"CRIA (Costa Rica International Academy)","city":"Brasilito","type":"HIGH","state":"Provincia de Guanacaste","country":"Costa Rica","zip":"50308"},"Education:{\"uuid\":\"e6b18998-f88b-4ef1-b8e0-367a7c0d463d\"}":{"__typename":"Education","uuid":"e6b18998-f88b-4ef1-b8e0-367a7c0d463d","school":{"__ref":"School:{\"uuid\":\"bea4eb8c-6213-47c3-af37-e053454a8fee\"}"},"startYear":"2022","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"9b315682-1dff-473a-83e2-c6edb0c316b9\"}":{"__typename":"MentorPublicProfile","uuid":"9b315682-1dff-473a-83e2-c6edb0c316b9","displayName":"Daniel H.","slug":"daniel-heiman","biography":"\u003cp\u003eHi, my name is Daniel Heiman, and I’m a first-year student at Duke University. I was born in Los Angeles but lived my childhood in New Jersey, Israel, and Costa Rica. One of my favorite things to do is spend time by the ocean and play soccer. I love surfing, going to the gym, and heading to the beach with my dog. At Duke, I am studying Economics and am considering minoring in Psychology and Spanish, as well as a certificate in Innovation and Entrepreneurship. When I’m not studying or playing soccer, I love reading, especially historical or post-apocalyptic fiction, and experimenting in the kitchen with new recipes. I love to cook but don't like to bake (I still haven't been able to make a good batch of brownies).\u003c/p\u003e","teachingVideoPlaybackId":"uEt01CgWo00Cw28um1aW01q7cUSEt3hH2XnapimZfZNM3c","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics/Undecided","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"271f8cda-1111-4016-9d21-16f66c573466\"}"},{"__ref":"DeepDives:{\"uuid\":\"9fffdf84-24f3-49f1-a38f-762f22bf44c3\"}"},{"__ref":"DeepDives:{\"uuid\":\"ae7e8cd7-8498-470f-9c49-e3feecdccd88\"}"},{"__ref":"DeepDives:{\"uuid\":\"ca98567f-374b-4b55-ae6b-186c85a7f9f3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0f45086b-d472-4cc9-8a66-b1ef0ff3d384/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"e303f4af-821a-4a80-b723-9b9d01a188fc\"}"},{"__ref":"Education:{\"uuid\":\"e6b18998-f88b-4ef1-b8e0-367a7c0d463d\"}"}],"hiredAt":"2024-12-03T11:49:19.862Z","topics":["Algebra I","K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Writing","Spanish","Academic Coaching","College Essay Writing","Economics"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"daniel-heiman\"}})":
