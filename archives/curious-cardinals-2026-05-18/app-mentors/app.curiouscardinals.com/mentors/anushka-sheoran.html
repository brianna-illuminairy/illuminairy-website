xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"666520d6-d7c8-4856-be63-b79dc9b5e804\"}":{"__typename":"DeepDives","uuid":"666520d6-d7c8-4856-be63-b79dc9b5e804","content":"\u003cp\u003eGrowing up, I was raised to be genuinely inquisitive, not to question things for the sake of it, but to actually sit with them and think them through. I was also taught to approach problems in a multidimensional and multifaceted way, to resist the urge to flatten something complex into a single perspective. That shows up a lot in how I teach and communicate. I try to create space for real curiosity and to honor the complexity of whatever we are working through together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"6eeac134-2d7e-4791-95e1-5a49d8da6026\"}":{"__typename":"DeepDives","uuid":"6eeac134-2d7e-4791-95e1-5a49d8da6026","content":"\u003cp\u003eI am most proud of maintaining a genuine learning mindset regardless of the situation. No matter how hard things have gotten, I have always found a way to get back up and treat the difficulty as something to learn from rather than something to escape. That consistency, especially in tough moments, is something I hold onto.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d49371a4-990a-40c2-83c1-45d58e8f5a22\"}":{"__typename":"DeepDives","uuid":"d49371a4-990a-40c2-83c1-45d58e8f5a22","content":"\u003cp\u003eYou don't need to force yourself to fit into a niche. What I would tell my younger self is to find a real problem that exists in the world and understand it deeply, not just as a project idea, but as something that genuinely affects people. For example, thinking broadly about healthcare is not enough. Start with a specific problem, then think through multiple ways to solve it and what the bottlenecks would be in each approach. Don't chase the application or the story. If you do the work of truly understanding the problem, the story will come through on its own, and it will be far more authentic for it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"dfab82f5-f135-4fec-8958-54a45ac82140\"}":{"__typename":"DeepDives","uuid":"dfab82f5-f135-4fec-8958-54a45ac82140","content":"\u003cp\u003eFor undergrad, I was weighing a few paths, including medicine, but I did not want to lock myself into one track too early. Bioinformatics felt like the right choice because it kept multiple doors open. It sharpened my critical thinking while keeping research, technology, and medicine all within reach as natural next steps. For my master's in data science, the reasoning was similar but more focused. Before going out and building things in AI, I wanted to make sure I actually understood what I was building on. I wanted a real foundation, not just familiarity with the tools.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3a70fcc8-c1b7-4a41-aeb3-aed38099ec6c\"}":{"__typename":"School","uuid":"3a70fcc8-c1b7-4a41-aeb3-aed38099ec6c","name":"John Fraser Secondary School","city":"Mississauga","type":"HIGH","state":"Ontario","country":"Canada","zip":"L5M 5H6"},"Education:{\"uuid\":\"719100e1-2bd9-4941-9c56-1fe53dbf02ac\"}":{"__typename":"Education","uuid":"719100e1-2bd9-4941-9c56-1fe53dbf02ac","school":{"__ref":"School:{\"uuid\":\"3a70fcc8-c1b7-4a41-aeb3-aed38099ec6c\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"763308d8-7f5f-4939-81f2-0437ee3091ad\"}":{"__typename":"Education","uuid":"763308d8-7f5f-4939-81f2-0437ee3091ad","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2027","major":"Masters in Computer and Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"0aab662a-0f77-4ee1-bd51-a322bab362f6\"}":{"__typename":"MentorPublicProfile","uuid":"0aab662a-0f77-4ee1-bd51-a322bab362f6","displayName":"Anushka S.","slug":"anushka-sheoran","biography":"\u003cp\u003eHere's the updated bio with a hobbies line woven in:\u003c/p\u003e\u003chr\u003e\u003cp\u003eHi! I'm Anushka, a graduate student at the University of Pennsylvania studying Computer Science, and I love helping students discover how exciting technology and science can be.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up fascinated by how things work, which led me to study Bioinformatics at UC San Diego, a field that combines biology and computer science to answer big questions about health and the human body. During college, I worked in a neuroscience research lab where our team published a real scientific paper studying spinal cord injuries. That experience showed me that even early in your journey, you can contribute to work that truly matters.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow at Penn, I spend my time learning about artificial intelligence and how to build smart computer systems. I also serve as President of the Claude Builder Club, a community of over 800 Penn students who learn together, build projects, and explore what AI can do. I am also an official Anthropic Campus Ambassador, representing one of the leading AI research companies in the world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I run my own company called Clariem Academy, where I help professionals in the healthcare and medicine industry learn how to use AI tools in their everyday work. Starting a business as a student has taught me so much about problem-solving, communication, and believing in your own ideas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I am not studying or working, you can find me on the volleyball court, in the gym for gymnastics, dancing, or out on a hiking trail soaking in nature. I love staying active and think some of the best ideas come when you step away from a screen and move your body.\u003c/p\u003e\u003cp\u003eI care deeply about making hard topics feel approachable and fun. Whether it is computer science, biology, research, or just figuring out what you are interested in, I think every student deserves a mentor who will meet them where they are and genuinely cheer them on. I remember exactly what it felt like to be a student staring at something confusing and not knowing where to start, and that is exactly why I love mentoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you are curious about science, technology, medicine, or just want someone in your corner as you figure out your path, I would love to connect with you. No question is too small, and every big journey starts with a little curiosity.\u003c/p\u003e","teachingVideoPlaybackId":"01KPf3ISX9nGcvAPcEC00rPxOXN3lF86tr01IlpwD9ECb8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Masters in Computer and Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"666520d6-d7c8-4856-be63-b79dc9b5e804\"}"},{"__ref":"DeepDives:{\"uuid\":\"6eeac134-2d7e-4791-95e1-5a49d8da6026\"}"},{"__ref":"DeepDives:{\"uuid\":\"d49371a4-990a-40c2-83c1-45d58e8f5a22\"}"},{"__ref":"DeepDives:{\"uuid\":\"dfab82f5-f135-4fec-8958-54a45ac82140\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b3eb93e4-02f2-4015-9c41-dd4945a7fd03/-/preview/-/format/jpg/","https://ucarecdn.com/fc17507f-4712-4d22-a363-ed27fa29e6a6/-/preview/-/format/jpg/","https://ucarecdn.com/2eba36aa-9442-4f95-afc9-790df8d920e0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"719100e1-2bd9-4941-9c56-1fe53dbf02ac\"}"},{"__ref":"Education:{\"uuid\":\"763308d8-7f5f-4939-81f2-0437ee3091ad\"}"}],"hiredAt":"2026-01-28T18:16:27.774Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science","K-6 Storybook","Creative Writing","Business / Entrepreneurship","Coding / Programming","Medicine / Health","STEM Project","Machine Learning / AI","Sustainability","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anushka-sheoran\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0aab662a-0f77-4ee1-bd51-a322bab362f6\"}"}}},"_sentryTraceData":"f8c0631dce1a40248aac91bd7
