xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"aba8b09d-5e18-478d-b81c-0342ad09c64e\"}":{"__typename":"DeepDives","uuid":"aba8b09d-5e18-478d-b81c-0342ad09c64e","content":"\u003cp\u003eStop blaming everyone for things you think you are not allowed to do, just do them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"f7baa7cd-b9bf-422f-bde4-d23c5d3cd060\"}":{"__typename":"DeepDives","uuid":"f7baa7cd-b9bf-422f-bde4-d23c5d3cd060","content":"\u003cp\u003eI would love to make a movie.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f4f6bb48-2649-4b87-89a9-300a6a31c954\"}":{"__typename":"DeepDives","uuid":"f4f6bb48-2649-4b87-89a9-300a6a31c954","content":"\u003cp\u003eArtist!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ac47c884-d32c-43d3-89e1-46a10d09df15\"}":{"__typename":"DeepDives","uuid":"ac47c884-d32c-43d3-89e1-46a10d09df15","content":"\u003cp\u003eI'm working on making an art space with my friends in New York, providing a place for artists to be able to be able to access, show and program within, and collaborate with on ideas that might not have as much support.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"73dbb57d-bf23-47a2-adcc-6950df4bf7b2\"}":{"__typename":"School","uuid":"73dbb57d-bf23-47a2-adcc-6950df4bf7b2","name":"Westview High School","city":"Portland","type":"HIGH","state":"Oregon","country":"USA","zip":"97229"},"Education:{\"uuid\":\"d8cc541a-e167-44c4-855d-63c536fd06ad\"}":{"__typename":"Education","uuid":"d8cc541a-e167-44c4-855d-63c536fd06ad","school":{"__ref":"School:{\"uuid\":\"73dbb57d-bf23-47a2-adcc-6950df4bf7b2\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"d7e810ab-e2c9-4786-9e50-103a53399e18\"}":{"__typename":"Education","uuid":"d7e810ab-e2c9-4786-9e50-103a53399e18","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2025","major":"MFA in Visual Art","degree":null},"MentorPublicProfile:{\"uuid\":\"d236bf6a-3b11-44ae-8156-cdf3b5e25b74\"}":{"__typename":"MentorPublicProfile","uuid":"d236bf6a-3b11-44ae-8156-cdf3b5e25b74","displayName":"Ridwana R.","slug":"ridwana-rahman","biography":"\u003cp\u003eHello!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm Ridwana. I'm an artist and graphic designer from Portland, Oregon, currently living in New York. I grew up in a tight-knit, Muslim, Bangladeshi community, where I spent my childhood playing piano, making art, doing robotics, and writing. I first started taking pictures when I was fourteen, using my older sister’s camera, and have been making them for more than ten years now. My art has also expanded beyond that now, taking the form of sculpture, installation, performance, writing, book-making, text, and programming. I think a lot about repetition in my work, ritual, the body, direction, space, and object. I think a lot about the movies I watch, the people I know, my mom.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI studied graphic design and computer science during my undergraduate at Oregon State University, during which I declared a minor in photography after talking to one of my favorite professors. I spent a lot of time in college working on book cover design, publication design, and social media marketing. After graduation, I took a gap year to work as a designer and travel, visiting wherever I had friends and family. The following year, I started my MFA in visual arts at Columbia University. Having just graduated this May, I have been freelancing as a graphic designer, making a lot of flyers for art events and shows, as well as helping design photobooks by Sinkhole Press. I have also begun a new project with my close collaborator, Giorgia Alliata, with whom I have been running a space called Umarell. It is an art-centered concept and space that hopes to dismantle systems that exist in the New York art world and market. We want to be a space for artists and friends to use, we want it to be complete accessible, and a space that can host a fine art gallery opening and a trivia night consecutively.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI spend all my time making art, making coffee, reading, watching movies, with loved ones, riding my bike, looking at art, and sometimes carving spoons. I am also part of a one-year seminar program called the Interdisciplinary Art and Theory Program, during which we are reading and discussing The Arcades Project by Walter Benjamin.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI work with photography, sculpture, installation, performance, and writing, and love working closely with other artists and thinkers. All my art is very minimalist and personal, linking back to my multiple, important identities. I print pictures really big and on different materials, I buy carpet to make a gallery into a prayer room, I collect pictures of arrows.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love learning about new people, learning what their artistic visions and passions are! I am excited to get to know you and yours.\u003c/p\u003e","teachingVideoPlaybackId":"02lg3xZHWrsyMEACbPPrBEu5gLGMWm02qvFr5DYdpHzK00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"MFA in Visual Art","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"aba8b09d-5e18-478d-b81c-0342ad09c64e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7baa7cd-b9bf-422f-bde4-d23c5d3cd060\"}"},{"__ref":"DeepDives:{\"uuid\":\"f4f6bb48-2649-4b87-89a9-300a6a31c954\"}"},{"__ref":"DeepDives:{\"uuid\":\"ac47c884-d32c-43d3-89e1-46a10d09df15\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7dcfaf33-6a61-49fe-a826-7229d4e758e9/-/preview/-/format/jpg/","https://ucarecdn.com/fb8a6b54-fa8e-47b6-8a74-178a1fbf2288/-/preview/-/format/jpg/","https://ucarecdn.com/d895af44-ad7f-4c77-b2ad-6892320d8fbd/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"NON_BINARY","education":[{"__ref":"Education:{\"uuid\":\"d8cc541a-e167-44c4-855d-63c536fd06ad\"}"},{"__ref":"Education:{\"uuid\":\"d7e810ab-e2c9-4786-9e50-103a53399e18\"}"}],"hiredAt":"2025-10-31T17:22:10.130Z","topics":["K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Video / Photography","Web Design","Sustainability","Journalism"],"communityBadges":[],"res
