xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f70801b7-8094-4919-8731-03bb85baaf0b\"}":{"__typename":"DeepDives","uuid":"f70801b7-8094-4919-8731-03bb85baaf0b","content":"\u003cp\u003eFirst, I’d give myself a big hug!! I would tell myself that success doesn’t necessarily mean getting straight As or attending a name brand school. That my drive and passion for learning about the world and helping others is what’s important, not superficial accolades. I really wish 15 year old April would have realized that it’s actually COOL to be authentic and engaged, it’s COOL to be who you are. I had the most fun when I embraced my individuality and shed the social pressure to conform. Overall, I had a wonderful high school experience and I cherish the friends I made and the opportunities I was given. My experience in high school taught me how to be a good friend, a hard worker, a team player and an effective planner. However, I only wish I had let go of anxieties and external pressures about what I should accomplish or who I should be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"23711535-0d16-449b-867c-f51c2fb0f50d\"}":{"__typename":"DeepDives","uuid":"23711535-0d16-449b-867c-f51c2fb0f50d","content":"\u003cp\u003e~besides my parents~ Hatshepsut (if you don't know, look her up!!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ecc4568f-d907-48e6-a410-faa72c92f81c\"}":{"__typename":"DeepDives","uuid":"ecc4568f-d907-48e6-a410-faa72c92f81c","content":"\u003cp\u003eBeating my older brother in arm wrestling \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"28cd0d06-e98d-4903-b2fd-c44f3a34c86d\"}":{"__typename":"DeepDives","uuid":"28cd0d06-e98d-4903-b2fd-c44f3a34c86d","content":"\u003cp\u003eMy time spent working on a goat farm! During the winter of 2020-2021 I went to southern Oregon for two and a half months to work on a farm. I lived in a camper van with no heat, water, electricity, or bathrooms. Every morning and evening I milked the goats, and I spent the time in-between chopping firewood, digging irrigation ditches, planting vegetables, cleaning the greenhouse, and mucking the barn. Although I can definitively say I will not be pursing a career in farming, I am really proud of the way in which I made the choice to thrust myself into an opportunity that was off the beaten path compared to what my Stanford cohort was up to at the time. I am proud of the relationships I built with the farmers and the goats (yes, I do mean that!) and the way I learned to embrace a lifestyle that was uncomfortable. The farmers gave me practical knowledge about herbal medicine, horticulture, and sustainable farming techniques, but they also helped me connect to the land and appreciate that happiness and fulfillment can look different for different people.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7fd5e195-9a80-4f30-8dfb-2a50f6da6693\"}":{"__typename":"Education","uuid":"7fd5e195-9a80-4f30-8dfb-2a50f6da6693","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2023","major":"Psychology ","degree":"BA"},"School:{\"uuid\":\"11924481-640e-4cfb-8cf7-41673119fd37\"}":{"__typename":"School","uuid":"11924481-640e-4cfb-8cf7-41673119fd37","name":"Westlake High School","city":"Thousand Oaks","type":"HIGH","state":"California","country":"United States","zip":"91362"},"Education:{\"uuid\":\"3f93f1b4-c0cc-496a-bc9f-277121835f74\"}":{"__typename":"Education","uuid":"3f93f1b4-c0cc-496a-bc9f-277121835f74","school":{"__ref":"School:{\"uuid\":\"11924481-640e-4cfb-8cf7-41673119fd37\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"Testimonial:31a5c8f8-d0d1-4117-af6f-11db3743b69f":{"__typename":"Testimonial","id":"31a5c8f8-d0d1-4117-af6f-11db3743b69f","text":"We love working with CC! We have had 2 mentors already and now looking to add a third mentor - each focusing on various aspects of College applications prep. There are many wonderful things about the mentors - their skills and interests are matched to what we need, mentors are extremely knowledgeable and committed to the student's success, very organized, clear on goals and what was accomplished (notes from each session); and probably one of the most important aspects - they \"speak the student's language\" and truly built a connection with my daughter! Highly recommend and have been referring many friends and colleagues. Thank you CC!","date":"2024-01-04 15:39:55.137+00","rating":5,"endorser":{"__typename":"Endorser","name":"Kalina Nikolova","tagline":null,"avatar":null}},"MentorPublicProfile:{\"uuid\":\"d7fa566c-ab3d-45f2-ae1b-d1effa301158\"}":{"__typename":"MentorPublicProfile","uuid":"d7fa566c-ab3d-45f2-ae1b-d1effa301158","displayName":"April B.","slug":"april-ball","biography":"April is a recent graduate of Stanford University who majored in Psychology and minored in Human Rights and Spanish and is currently studying in Madrid on a Fulbright Research Grant.\n\nGrowing up in the suburbs of LA and attending public schools her whole life, April has always been a dedicated teacher, tutor, and mentor. In high school she tutored math and english, coached volleyball, and led initiatives advocating for the rights of students with special needs. She graduated as Valedictorian of her class of over 600 students with local service and academic related scholarships to attend Stanford, where she she continued pursuing activities that championed access and inclusion. Among other service related activities, at Stanford April worked as a peer counselor to neurodiverse students and students struggling with mental health and manned phone hotlines for Spanish speakers apprehended in detention centers.\n\nLargely thanks to a grant she received in 2018 to conduct inter-generational interviews with Holocaust Survivors in Amsterdam, she is an advocate for culturally and trauma informed health care and the rights of refugee children and families. She worked at various research labs at Stanford including the Global Health Team for the Muslim Mental Health Lab in the School of Medicine, the YouthLAB and the STEP Program in the School of Education, and as a personal research assistant to prominent psychologist Dr. Claude Steele. April is cited as co-author on two papers that are currently in the process of publication. While she is proud of her academic accomplishments, she cites her loftiest achievement as coming in second place in Stanford Intramural Beach Volleyball and first place in an unofficial spike ball tournament organized by her friends.\n\nAs of now, April is living in Madrid conducting qualitative self-directed research in Spanish on the cultural and religious identities of second generation Moroccan Muslim women and spends her free time working with Spanish nonprofits. She also has made it her personal mission to be the best tour guide to friends and family who visit. She feels confident she has perfected the 1-5 day  “Madrid Sampler”.\n\nInclusion, access, exploration, and fun are at the core of her teaching and learning values. She is excited to share her knowledge of spanish, inclusive healthcare, academic writing and research, and application processes.","teachingVideoPlaybackId":"V2l01iBP8Cvcenl91vsC4LrabLrJugeR7L4jkZnKD00Io","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f70801b7-8094-4919-8731-03bb85baaf0b\"}"},{"__ref":"DeepDives:{\"uuid\":\"23711535-0d16-449b-867c-f51c2fb0f50d\"}"},{"__ref":"DeepDives:{\"uuid\":\"ecc4568f-d907-48e6-a410-faa72c92f81c\"}"},{"__ref":"DeepDives:{\"uuid\":\"28cd0d06-e98d-4903-b2fd-c44f3a34c86d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2bd432f5-20e0-4393-ae58-b8dfea9b19af/-/crop/374x374/0,30/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7fd5e195-9a80-4f30-8dfb-2a50f6da6693\"}"},{"__ref":"Education:{\"uuid\":\"3f93f1b4-c0cc-496a-bc9f-277121835f74\"}"}],"hiredAt":"2023-02-10T19:30:28.258Z","topics":["Writing","Spanish","Executive Function","College Essay Writing","Creative Writing","Medicine / Health"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimo
