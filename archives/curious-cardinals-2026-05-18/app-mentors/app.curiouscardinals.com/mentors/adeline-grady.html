xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"53cfb7cc-6f43-43c3-b73e-d3e1b7f26ccc\"}":{"__typename":"DeepDives","uuid":"53cfb7cc-6f43-43c3-b73e-d3e1b7f26ccc","content":"\u003cp\u003eNot only does flying from DC to Stanford and back hurt the wallet, but it hurts the environment as well! Climate change has already drastically altered our weather patterns, biodiversity, and natural disasters, and it's not slowing down any time soon! A big portion of carbon emissions comes from the air transportation sphere. That has to change. With my aerospace engineering degree, I hope to create safe, sustainable, affordable aircraft to help people and the planet.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e3637977-0979-464a-b12a-7c38e8ec40e1\"}":{"__typename":"DeepDives","uuid":"e3637977-0979-464a-b12a-7c38e8ec40e1","content":"\u003cp\u003eAsk more questions! The best experiences I've ever had have all come from reaching out to people--even if it seemed scary. If you find yourself wanting to try something new or get more involved, email your teacher, or a random professor at a university, or even an employee at a cool company! There's nothing more exciting than getting to share what you love with interested people, so there's a good chance whoever you contact will be happy to help!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"582f242e-57d1-42e7-afb4-6ef98a77bc4c\"}":{"__typename":"School","uuid":"582f242e-57d1-42e7-afb4-6ef98a77bc4c","name":"Broad Run High School","city":"Ashburn","type":"HIGH","state":"Virginia","country":"United States","zip":"20147"},"Education:{\"uuid\":\"b099531c-776d-457d-aa3a-3e7d6fc9cb68\"}":{"__typename":"Education","uuid":"b099531c-776d-457d-aa3a-3e7d6fc9cb68","school":{"__ref":"School:{\"uuid\":\"582f242e-57d1-42e7-afb4-6ef98a77bc4c\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"6635c326-34e2-436a-9e14-5ed2da6c83ee\"}":{"__typename":"Education","uuid":"6635c326-34e2-436a-9e14-5ed2da6c83ee","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Aero/Astro","degree":null},"MentorPublicProfile:{\"uuid\":\"6d205fb6-4c88-496c-838a-1c1c8811ba44\"}":{"__typename":"MentorPublicProfile","uuid":"6d205fb6-4c88-496c-838a-1c1c8811ba44","displayName":"Adeline Z.","slug":"adeline-grady","biography":"\u003cp\u003eHave you ever thought about how to make solar-powered planes? Or how time works on different planets across the universe? Or even how our daily choices affect the Earth? If you said yes to any of those questions–same. Although I’m studying Aero/Astro (aerospace engineering) at Stanford University, I find it impossible to encompass everything about a person through their major. Outside of planes and spaceships, I’m passionate about the environment, feminism, and philosophy. While not in class, you can find me in Cedar Hall building gliders or in the Potter computer cluster planning dorm trips to Lake Tahoe. When I’m back home in Northern Virginia, I’m likely strolling Georgetown or explaining at the Smithsonian’s National Air and Space Museum (NASM). At NASM, I have the privilege of sharing what I love–air, space, and the things that dwell in either–with hundreds of people every day. I walk visitors through various STEM-oriented “discovery stations,” answering questions to cater to each visitor’s interests and ensure they leave having learned something new.\u003c/p\u003e\u003cp\u003eI was a mentor long before I joined Curious Cardinals. My first exposure to leadership came from being a Girl Scout Camp counselor, where I found my campers’ desire to learn infectious and refreshing. Since then, I’ve been a mini-soccer coach, an AP Chemistry Teacher’s Assistant, a club president, and a museum explainer, giving me experience with how to effectively teach and accommodate every age group. Years of mentoring others has grown my love for helping people find and develop new passions, whether it be something they were already interested in, or something they never thought they could do. Through Curious Cardinals, I’m able to foster a symbiotic relationship where I get to do what I love–talk about STEM and cultivate connections–while my mentee furthers their own academic journey with access to my first-hand advice and experience at all times.\u003c/p\u003e","teachingVideoPlaybackId":"w9XSKYCDk1FrV500SbOlj2K7VQ00PEF6CU20201LcDGIx3o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Aero/Astro","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"53cfb7cc-6f43-43c3-b73e-d3e1b7f26ccc\"}"},{"__ref":"DeepDives:{\"uuid\":\"e3637977-0979-464a-b12a-7c38e8ec40e1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0ec7610d-6316-4f27-9b71-b5cf6be206f7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b099531c-776d-457d-aa3a-3e7d6fc9cb68\"}"},{"__ref":"Education:{\"uuid\":\"6635c326-34e2-436a-9e14-5ed2da6c83ee\"}"}],"hiredAt":"2024-05-07T18:38:11.013Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Physics","Academic Coaching","Executive Function","College Essay Writing","STEM Project","Robotics / Electronics / CAD","Aviation / Aerospace","Sustainability"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"adeline-grady\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6d205fb6-4c88-496c-838a-1c1c8811ba44\"}"}}},"_sentryTraceData":"733a610785ad4094bfd14d4b0fbee5e9-bbda186050dd7856-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=733a610785ad4094bfd14d4b0fbee5e9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"adeline-grady"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" st
