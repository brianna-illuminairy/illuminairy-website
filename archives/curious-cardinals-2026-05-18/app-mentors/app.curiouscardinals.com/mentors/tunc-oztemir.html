xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6d674462-ce34-4cfb-99eb-ad3eba35aff8\"}":{"__typename":"Favorites","uuid":"6d674462-ce34-4cfb-99eb-ad3eba35aff8","photoUrl":"https://ucarecdn.com/0d40a7a9-8451-4cdc-9e4c-fa9b669a1c1d/","title":"Song Kang Ho","type":"ACTOR"},"Favorites:{\"uuid\":\"1d0e04cf-bca7-42f2-bb42-96251f5697cb\"}":{"__typename":"Favorites","uuid":"1d0e04cf-bca7-42f2-bb42-96251f5697cb","photoUrl":"https://ucarecdn.com/e34e3d26-8c3f-4487-9533-22bd5b3d6e94/","title":"A Moon Shaped Pool","type":"ALBUM"},"Favorites:{\"uuid\":\"c2a2a43b-8b58-428d-b5e0-1aee3476fe39\"}":{"__typename":"Favorites","uuid":"c2a2a43b-8b58-428d-b5e0-1aee3476fe39","photoUrl":"https://ucarecdn.com/e34e3d26-8c3f-4487-9533-22bd5b3d6e94/","title":"Roger Federer","type":"ATHLETE"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"37fffb5d-2415-403e-acee-45b9f70cd693\"}":{"__typename":"DeepDives","uuid":"37fffb5d-2415-403e-acee-45b9f70cd693","content":"\u003cp\u003eTunc Oztemir's transition from a local school in Turkey to the esteemed halls of Harvard University stands as a beacon of relentless determination and resilience. His journey not only signified a personal achievement but also ignited a fire of ambition in his contemporaries.\u003c/p\u003e\u003cp\u003eWhile at Harvard, Tunc felt a pull towards mentoring students of diverse backgrounds. As a college counselor and tutor, he championed the belief that education should be universally accessible. Although he appreciates systematic instruction, he's a staunch advocate of fostering curiosity, emphasizing a Socratic-style engagement where students become co-navigators in their educational odyssey.\u003c/p\u003e\u003cp\u003eMotivated by innovative pedagogical models, Tunc and a group of friends founded an educational NGO. Over the years, fueled by collective dedication and community backing, it flourished into a sanctuary for learning and self-growth. At the heart of Tunc's educational ethos lies the principle of recognizing each student's distinct path, ensuring that education resonates and captivates.\u003c/p\u003e\u003cp\u003eDuring his Harvard tenure, Tunc delved into diverse fields, spanning from societal legal frameworks to the enigmas of quantum mechanics, before gravitating towards psychology. This wasn't merely scholarly; it symbolized his pivot from addressing vast societal conundrums to deciphering personal narratives. Tunc's zeal extends beyond imparting knowledge; he aims to nurture inquisitive minds that can discern quality information from misleading or superficial content. His profound understanding of philosophical inquiries into knowledge and his expertise in the natural sciences form an unparalleled blend. Introducing students to this critically analytical method of learning not only enhances their scholastic endeavors but also shapes them into truth-seeking, ethically sound citizens. Tunc stands by the idea that every subject is open for discourse and challenges, pushing the boundaries of pre-established beliefs to forge genuine, lifelong learners.\u003c/p\u003e\u003cp\u003eFor Tunc, education transcends mere knowledge acquisition. It paves the way for self-awareness, realizing one's capabilities, and identifying avenues to leave a positive imprint on the world. Through his initiatives and convictions, Tunc aspires to motivate others to set forth on their personal quests for exploration and development.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"302b3496-9404-4376-a2c1-d33c57778943\"}":{"__typename":"School","uuid":"302b3496-9404-4376-a2c1-d33c57778943","name":"Kabataş Boys' High School","city":"Istanbul","type":"HIGH","state":"Istanbul","country":"Turkey","zip":"34349"},"Education:{\"uuid\":\"deb4abd2-c611-4a52-a62c-8cba1c0f0165\"}":{"__typename":"Education","uuid":"deb4abd2-c611-4a52-a62c-8cba1c0f0165","school":{"__ref":"School:{\"uuid\":\"302b3496-9404-4376-a2c1-d33c57778943\"}"},"startYear":"2012","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"96ee069b-7daf-42c8-9185-214ccd88824c\"}":{"__typename":"Education","uuid":"96ee069b-7daf-42c8-9185-214ccd88824c","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2023","major":"Psychology with a Secondary in History","degree":null},"MentorPublicProfile:{\"uuid\":\"2e6136a8-8340-4647-b00c-37e250cb5c19\"}":{"__typename":"MentorPublicProfile","uuid":"2e6136a8-8340-4647-b00c-37e250cb5c19","displayName":"Tunc O.","slug":"tunc-oztemir","biography":"\u003cp\u003eTunc Oztemir's journey from a public school in Turkey to Harvard University is a testament to the power of dedication and perseverance. Taking this route not only marked a milestone for him but also instilled hope in his peers to aim higher.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile at Harvard, Tunc felt a pull towards mentoring students of diverse backgrounds. As a college counselor and tutor, he championed the belief that education should be universally accessible. Although he appreciates systematic instruction, he's a staunch advocate of fostering curiosity, emphasizing a Socratic-style engagement where students become co-navigators in their educational odyssey.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMotivated by innovative pedagogical models, Tunc and a group of friends founded an educational NGO. Over the years, fueled by collective dedication and community backing, it flourished into a sanctuary for learning and self-growth. At the heart of Tunc's educational ethos lies the principle of recognizing each student's distinct path, ensuring that education resonates and captivates.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring his Harvard tenure, Tunc delved into diverse fields, spanning from societal legal frameworks to the enigmas of quantum mechanics, before gravitating towards psychology. This wasn't merely scholarly; it symbolized his pivot from addressing vast societal conundrums to deciphering personal narratives. Tunc's zeal extends beyond imparting knowledge; he aims to nurture inquisitive minds that can discern quality information from misleading or superficial content. His profound understanding of philosophical inquiries into knowledge and his expertise in the natural sciences form an unparalleled blend. Introducing students to this critically analytical method of learning not only enhances their scholastic endeavors but also shapes them into truth-seeking, ethically sound citizens. Tunc stands by the idea that every subject is open for discourse and challenges, pushing the boundaries of pre-established beliefs to forge genuine, lifelong learners.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor Tunc, education transcends mere knowledge acquisition. It paves the way for self-awareness, realizing one's capabilities, and identifying avenues to leave a positive imprint on the world. Through his initiatives and convictions, Tunc aspires to motivate others to set forth on their personal quests for exploration and development.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"B65b3DDljkFt9UYwM6zfrbzY8TZrrZlV4Wv1O02sK00Zc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn the heart of the Ionian region of Turkey, where ancient pre-Socratic philosophers like Heraclitus and Anaxagoras once tread, we have constructed an educational village. This endeavor is my utmost pride. Drawing inspiration from the past, our village delves deep into social sciences and humanities, all set within a premodern environment. Participants live and learn communally in brick buildings, reminiscent of a time gone by, yet the knowledge shared is timeless.\u003c/p\u003e\u003cp\u003eThe pinnacle of this experience, for me, was the seminar I led on Heidegger, undeniably one of the 20th century's most profound yet intricate thinkers. Heidegger's writings, though profound, can often be obscured in complexity. Over a two-week period, I undertook the challenging task of demystifying his work, breaking down his philosophy in a way that was not just comprehensible but also deeply engaging. The enthusiasm and intrigue that ensued were palpable. Participants, previously unfamiliar or even daunted by modern philosophy, found themselves drawn into a world of profound thought, sparking a newfound interest.\u003c/p\u003e\u003cp\u003eSeeing the blend of ancient settings with modern philosophical discussions unfold in our educational village, and witnessing participants immerse themselves in the world of thinkers like Aristotle or Heidegger, is a testament to the power of education, and a testament to what I hold dear. The bridge between the past and the present, encapsulated in our village, symbolizes the continuous journey of learning, where ancient wisdom meets modern inquiry.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"6d674462-ce34-4cfb-99eb-ad3eba35aff8\"}"},{"__ref":"Favorites:{\"uuid\":\"1d0e04cf-bca7-42f2-bb42-96251f5697cb\"}"},{"__ref":"Favorites:{\"uuid\":\"c2a2a43b-8b58-428d-b5e0-1aee3476fe39\"}"}],"causesSupported":[],"major":"Psychology with a Secondary in History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"37fffb5d-2415-403e-acee-45b9f70cd693\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3aef6508-8b03-457c-bc02-acd131acd63a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"deb4abd2-c611-4a52-a62c-8cba1c0f0165\"}"},{"__ref":"Education:{\"uuid\":\"96ee069b-7daf-42c8-9185-214ccd88824c\"}"}],"hiredAt":"2023-08-27T02:57:27.545Z","topics":["Philosophy","Literature","History Project","Film / Theater","World Cultures","Sustainability","Race \u0026 Ethnicity","STEM Project","Writing","Biology","History","College Essay Writing","Academic Coaching","Law / Government / Policy","Economics","Journalism"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tunc-oztemir\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2e6136a8-8340-4647-b00c-37e250cb5c19\"}"}}},"_sentryTraceData":"ce7d1dc8a1bf4fe983189291020a30ee-a546cb3410c265ce-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ce7d1dc8a1bf4fe983189291020a30ee,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"tunc-oztemir"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n
