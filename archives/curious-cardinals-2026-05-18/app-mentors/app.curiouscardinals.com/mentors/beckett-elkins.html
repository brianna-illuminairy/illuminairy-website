xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"dd8f03f3-ef06-4d2c-a1eb-927900ec6a74\"}":{"__typename":"Favorites","uuid":"dd8f03f3-ef06-4d2c-a1eb-927900ec6a74","photoUrl":"https://ucarecdn.com/8c016f64-681f-429c-b900-c95913af0e00/","title":"Inception","type":"MOVIE"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"3fd17d67-fcf8-4700-a482-40e437398103\"}":{"__typename":"DeepDives","uuid":"3fd17d67-fcf8-4700-a482-40e437398103","content":"\u003cp\u003eMy mom. Is it cliché? Yes. Does that make it any less true? No.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a3fa2909-6441-4e11-83e6-696b86c63ac0\"}":{"__typename":"DeepDives","uuid":"a3fa2909-6441-4e11-83e6-696b86c63ac0","content":"\u003cp\u003eI sew patches onto my backpack for every milestone in my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"9f706d8d-3846-44d2-b8f8-0dfe2a9d1bfd\"}":{"__typename":"DeepDives","uuid":"9f706d8d-3846-44d2-b8f8-0dfe2a9d1bfd","content":"\u003cp\u003eHonestly–pretty shy. It’s funny because now I’m the exact opposite.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e433ef13-e50a-466f-81ff-dfc1c26d0ca8\"}":{"__typename":"DeepDives","uuid":"e433ef13-e50a-466f-81ff-dfc1c26d0ca8","content":"\u003cp\u003eI had dinner with the former president of Colombia. Cool guy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"c0b6732f-ef19-4538-b1ce-a83a6ae2d6a0\"}":{"__typename":"School","uuid":"c0b6732f-ef19-4538-b1ce-a83a6ae2d6a0","name":"Mount Vernon High School","city":"Mount Vernon","type":"HIGH","state":"Ohio","country":"United States","zip":"43050"},"Education:{\"uuid\":\"d31a4e2e-e68c-484f-bc4d-6a65e533644c\"}":{"__typename":"Education","uuid":"d31a4e2e-e68c-484f-bc4d-6a65e533644c","school":{"__ref":"School:{\"uuid\":\"c0b6732f-ef19-4538-b1ce-a83a6ae2d6a0\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"31d5f094-1f97-48c8-ae5e-c2ea50d40d5b\"}":{"__typename":"Education","uuid":"31d5f094-1f97-48c8-ae5e-c2ea50d40d5b","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Philosophy + Global Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"7239f496-575e-48cb-98a4-827f8cca0714\"}":{"__typename":"MentorPublicProfile","uuid":"7239f496-575e-48cb-98a4-827f8cca0714","displayName":"Beckett E.","slug":"beckett-elkins","biography":"\u003cp\u003eHey there–My name is Beckett! I’m a current Junior at Yale pursuing a double major in philosophy and global affairs. I also currently serve as the editor-in-chief of the Yale Review of International Studies and am hoping to pursue a career in foreign policy. In my free time, you can find me hitting the gym, playing guitar, and losing to my suitemates at Super Smash Bros.\u003c/p\u003e\u003cp\u003eI signed up to be a mentor because six-ish years ago when I started high school, I was in a situation that many high schoolers today can relate to. I was an honors student and did well enough in school but beyond that, I had absolutely no idea what I was going to do after I graduated. Even after I started college, I spent my first two years bouncing between various intro classes and boring lectures trying to figure things out. Don’t get me wrong—taking Econ 101 was fine and all, but I’d be lying if I said that learning about the Phillips Curve impacted my life or job prospects in any meaningful way. Certainly, my time could have been better spent talking to professors, going to job fairs, or just pursuing a passion project.\u003c/p\u003e\u003cp\u003eI write all this out there to say two things. First: many 17-year-olds (despite what they write on their college applications) have no clue what their “passion” is, much less what they want to do for the next 40 years of their lives–myself included. Second: despite all this, I can say from personal experience that developing a solid outline early on is such a huge advantage and it’s something I wish I had done. I know that if I had someone who could’ve helped me do that in high school, I would’ve felt much less lost during my first couple of years of college.\u003c/p\u003e\u003cp\u003eI think this is the most important part of mentorship. Going beyond the content itself and explaining why it matters and the different ways it can be applied. For example, I despised math in high school because I was slow with arithmetic. Since coming to Yale though, I’ve realized that Math isn’t just the stuff you see in a high school textbook. For instance, I encounter symbolic logic and set theory all the time in my philosophy classes–something most people wouldn’t know when they hear my major. So if you’re looking for a mentor who’s passionate about helping you find your path, I’d be excited to work with you!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"dd8f03f3-ef06-4d2c-a1eb-927900ec6a74\"}"}],"causesSupported":[],"major":"Philosophy + Global Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3fd17d67-fcf8-4700-a482-40e437398103\"}"},{"__ref":"DeepDives:{\"uuid\":\"a3fa2909-6441-4e11-83e6-696b86c63ac0\"}"},{"__ref":"DeepDives:{\"uuid\":\"9f706d8d-3846-44d2-b8f8-0dfe2a9d1bfd\"}"},{"__ref":"DeepDives:{\"uuid\":\"e433ef13-e50a-466f-81ff-dfc1c26d0ca8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1240175f-8833-4008-aa79-25d4e4ad6cb0/-/preview/-/format/jpg/","https://ucarecdn.com/7d08c887-db1b-45a0-9753-3e889ee643c3/-/preview/-/format/jpg/","https://ucarecdn.com/7b3275cd-2988-4b4e-beb0-6c6cc5bd39fd/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d31a4e2e-e68c-484f-bc4d-6a65e533644c\"}"},{"__ref":"Education:{\"uuid\":\"31d5f094-1f97-48c8-ae5e-c2ea50d40d5b\"}"}],"hiredAt":"2025-04-02T13:08:54.671Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","Writing","French","College Essay Writing","Academic Coaching","Reading","Economics","Music","Sports Journalism","History Project","Video / Photography","Creative Writing","Business / Entrepreneurship","Law / Government / Policy","Journalism","Sustainability"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfil
