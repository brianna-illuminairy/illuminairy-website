xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0a0462f9-4d27-4760-9e00-6d56c711e26d\"}":{"__typename":"Favorites","uuid":"0a0462f9-4d27-4760-9e00-6d56c711e26d","photoUrl":"https://ucarecdn.com/25c07ecb-b508-4c44-a9d6-dde33b783489/","title":"Kendrick Lamar","type":"ARTIST"},"Favorites:{\"uuid\":\"152a60b2-61d0-482f-8c36-0bb200ca9959\"}":{"__typename":"Favorites","uuid":"152a60b2-61d0-482f-8c36-0bb200ca9959","photoUrl":"https://ucarecdn.com/7a66ade8-9198-4649-9cbb-b433c8c6c3d8/","title":"Yared Nuguse","type":"ATHLETE"},"Favorites:{\"uuid\":\"303d6ad7-c9b9-492b-9ee8-0ef21ffc5640\"}":{"__typename":"Favorites","uuid":"303d6ad7-c9b9-492b-9ee8-0ef21ffc5640","photoUrl":"https://ucarecdn.com/7a66ade8-9198-4649-9cbb-b433c8c6c3d8/","title":"London","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d5ac818e-92c6-41a7-b5ee-246daac75ec4\"}":{"__typename":"DeepDives","uuid":"d5ac818e-92c6-41a7-b5ee-246daac75ec4","content":null,"videoPlaybackId":"TbsbVrplUn01HAmU4LMj3F01HY702mW6ROk9E7HCYvXqv4","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"27dbb6f3-e555-4365-9918-79d370588bd4\"}":{"__typename":"DeepDives","uuid":"27dbb6f3-e555-4365-9918-79d370588bd4","content":"\u003cp\u003eI chose Business Administration as my major because to a certain extent... the entire world revolves around business! From the clothes we wear to the laptop I'm writing this on, the practice of commerce, goods, labor, negotiation, and pricing have all been leveraged to make these goods accessible to us.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor better or for worse, business interests also impact politics at a very high level, influencing the motivations of the elected and appointed officials who govern us. Because of this, the business world impacts our lives in ways we as a society have yet to grasp the extent of.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor these reasons, I believe to understand business is to understand the world around us, something I think I owe it to myself to do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"42455a21-9b46-4069-82d0-26b57b3dc02f\"}":{"__typename":"DeepDives","uuid":"42455a21-9b46-4069-82d0-26b57b3dc02f","content":null,"videoPlaybackId":"V685NjGThnuTxx2xCFoCJJDVmD1rV887X22sG501UEg00","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"b6d65b85-adbc-4a67-9f4d-94e17dbdb669\"}":{"__typename":"DeepDives","uuid":"b6d65b85-adbc-4a67-9f4d-94e17dbdb669","content":"\u003cp\u003eAs a high school student, I was hard working, social, but definitely too proud. I say this because no matter what I was facing, both academically and personal, I thought I could face it alone. It worked for a while, but I started to see the value in leaning on others during my junior year. My course-load became too much, and my extracurriculars were taking up more time than ever, leaving me unsure of what to do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eInnocently, my friend saw me doing my physics homework one day, and decided to help me as we did it together. Our homework session didn't last longer than the 45 minute lunch period, but I was able to understand the concepts and breeze through the problem set. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt wasn't an immediate switch, but that day was the start of my understanding of the power of help and resources, and I can proudly say that I now know when to ask for help when I need it. I just wish I had learned that lesson sooner... I would've spent less time on homework!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"c07a3f56-ee8c-487b-add6-4e1039fb3874\"}":{"__typename":"School","uuid":"c07a3f56-ee8c-487b-add6-4e1039fb3874","name":"Walt Whitman High School","city":"Bethesda","type":"HIGH","state":"Maryland","country":"United States","zip":"20817"},"Education:{\"uuid\":\"106f23bd-24d6-40bb-b6e3-74263b37e39d\"}":{"__typename":"Education","uuid":"106f23bd-24d6-40bb-b6e3-74263b37e39d","school":{"__ref":"School:{\"uuid\":\"c07a3f56-ee8c-487b-add6-4e1039fb3874\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"e9cb6151-0265-4db6-bff3-9d946137574d\"}":{"__typename":"Education","uuid":"e9cb6151-0265-4db6-bff3-9d946137574d","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Business Administration","degree":null},"MentorPublicProfile:{\"uuid\":\"f616d175-6569-4d4f-875c-ced209f501c2\"}":{"__typename":"MentorPublicProfile","uuid":"f616d175-6569-4d4f-875c-ced209f501c2","displayName":"Obi O.","slug":"obidike-onwuamaegbu","biography":"\u003cp\u003eHello everyone! My name is Obi Onwuamaegbu and I'm from Bethesda, Maryland. I recently graduated from the University of Southern California, where I was able to attend on a Presidential Scholarship. Throughout my four years at USC, I studied Business Administration with a minor in Culture, Media, and Entertainment, all while having a keen interest in the music industry.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a student, I was the vice president of external relations at the Black Business Student Association, a role I took great pride in. During my time with the organization, I was able to establish partnerships with companies such as Boeing, Deloitte, Boston Consulting Group, Google, and more. Beyond the specifics, it was extremely rewarding to increase opportunities for marginalized folks in the business world, hopefully paving the way for others to do the same.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my role with the BBSA,\u0026nbsp; I was a member of Los Angeles Community Impact, a nonprofit consulting organization which provided counsel to socially minded entities in the Los Angeles area. As a consultant in the organization, I was able to construct a professional, creative, and results-driven project experience through analyzing and determining the effectiveness of a non-profit’s $2.4 million dollar budget. This was done with the purpose of helping the non-profit successfully implement a brand new curriculum for 150 plus volunteers to follow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eExpanding more on my passion for the music industry, the intrigue was born from countless mornings of scouring YouTube for music videos, then being amazed at the level of traction they would gain. I would sit on the school bus, wondering just how these artists were able to build their fanbase, keep consistent engagement, and continue to reinvent themselves and their music. After researching the ins and outs of the music industry, I have created numerous reports on rising trends, as well as helped friends get into contacts with agents and managers of major labels, providing me with invaluable experience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese experiences have fostered my passion for helping those in any way I can, and I saw Curious Cardinals as an ideal next step in that journey. As a mentor, I hope to inspire anybody I have the privilege of working with, as well as build a passion for whatever they're excited about learning. In my free time, you can catch me listening to any and every type of music I can get my hands on, meditating, and finding exciting new restaurants to try. I hope to meet a lot of you soon!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"rI8QO5NCYvOxmPzsbFikJdVpsr28zruFAvvfDQdFe2E","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThe proudest I've been was when I ran under 17 minutes for the 5k in the county championship. Not only was it the first time I achieved the mark, but it also helped my team win the race, which was a goal of ours the entire season. To see a personal achievement culminate in a team success was an amazing feeling, and something we will never forget.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0a0462f9-4d27-4760-9e00-6d56c711e26d\"}"},{"__ref":"Favorites:{\"uuid\":\"152a60b2-61d0-482f-8c36-0bb200ca9959\"}"},{"__ref":"Favorites:{\"uuid\":\"303d6ad7-c9b9-492b-9ee8-0ef21ffc5640\"}"}],"causesSupported":[],"major":"Business Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d5ac818e-92c6-41a7-b5ee-246daac75ec4\"}"},{"__ref":"DeepDives:{\"uuid\":\"27dbb6f3-e555-4365-9918-79d370588bd4\"}"},{"__ref":"DeepDives:{\"uuid\":\"42455a21-9b46-4069-82d0-26b57b3dc02f\"}"
