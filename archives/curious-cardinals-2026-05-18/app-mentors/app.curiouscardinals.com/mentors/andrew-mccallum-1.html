xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9209f05f-5934-4b8e-940b-e16d8863c82c\"}":{"__typename":"DeepDives","uuid":"9209f05f-5934-4b8e-940b-e16d8863c82c","content":"\u003cp\u003eI have always loved reading, so when it came to choose my major I gravitated towards English. Through my coursework I got to read so many great authors! Then, after reading through their work, I would engage with their writing through class discussions or pieces of my own. \u003c/p\u003e\u003cp\u003eOften the association with English is that the only valid things to study are \"the classics,\" big books written by long-dead authors. My coursework really challenged this idea and taught me to think outside the box. At Duke, I studied art, music, and even movies. One of my favorite parts of undergrad was the opportunity to teach a \"House Course,\" a special student-led class that met weekly throughout the semester. Last spring, I taught a class on comics and graphic novels, and it was a blast to share my favorites as I led the class through weeks that focused on the different styles and themes of the art form. \u003c/p\u003e\u003cp\u003eI believe the definition of what a good book is needs to be broadened to include all kinds of readers. There is something out there for everyone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f834b09c-af04-4ebf-bf8c-8299e6eea393\"}":{"__typename":"DeepDives","uuid":"f834b09c-af04-4ebf-bf8c-8299e6eea393","content":"\u003cp\u003eIn my spare time I love to push myself through long-distance running. I have run since high school, and throughout my life the sport has served as a way I ground myself. It is such a great feeling to start the day off with a morning run! I have been lucky to meet many of my friends through running, and often it is an incredibly social part of my routine. Spending several miles together is a wonderful way to build connection.\u003c/p\u003e\u003cp\u003eRecently, I have been getting into longer distances. This past fall, I ran a marathon (Marine Corp in DC) and it was an incredible experience. Since then, I have been training for an Ultra Marathon - which is a race longer than 26.2 miles. I love running for distance, not speed, because I can spend time chatting with friends or grabbing snacks. Choosing to get up and go for a run is not always easy. There are days where things are difficult. But regardless, I always returned feeling refreshed and enthusiastic\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"e037191f-c3c3-4f13-8858-100579ebe599\"}":{"__typename":"DeepDives","uuid":"e037191f-c3c3-4f13-8858-100579ebe599","content":"\u003cp\u003eI have spent the past five years of my life in dorms or apartments in urban spaces, and these cramped places have prevented me from sharing my love of animals. Growing up my family always had a slew of pets around. I grew up in the country, and from an early age I helped my mom raise the goats and horses that were beloved members of the family; the goats got Christmas cookies every year! On the smaller end of the animal kingdom, we always took in cats and dogs that turned up without a home. The four-legged friends we fostered were some of my best friends as a child. To this day, I can never answer whether I am a cat or dog person. \u003c/p\u003e\u003cp\u003eIt is my dream to have pets of my own one day!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"53a1a3be-591d-4947-abd4-76e83cd6e87a\"}":{"__typename":"School","uuid":"53a1a3be-591d-4947-abd4-76e83cd6e87a","name":"Chillicothe High School","city":"Chillicothe","type":"HIGH","state":"Ohio","country":"United States","zip":"45601"},"Education:{\"uuid\":\"2beb8ed6-d9fe-4e21-8859-8e2f6535e6d1\"}":{"__typename":"Education","uuid":"2beb8ed6-d9fe-4e21-8859-8e2f6535e6d1","school":{"__ref":"School:{\"uuid\":\"53a1a3be-591d-4947-abd4-76e83cd6e87a\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"40e207d2-1eba-4420-b261-9068cd5df757\"}":{"__typename":"Education","uuid":"40e207d2-1eba-4420-b261-9068cd5df757","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"English and Cultural Anthropology","degree":null},"MentorPublicProfile:{\"uuid\":\"62a6eb6a-4373-45ff-b7ce-b476490828ad\"}":{"__typename":"MentorPublicProfile","uuid":"62a6eb6a-4373-45ff-b7ce-b476490828ad","displayName":"Andrew M.","slug":"andrew-mccallum-1","biography":"\u003cp\u003eHi! My name is Andrew and I am 23 years old. I grew up in rural Ohio surrounded by pets and beautiful rolling hills. I love being outside, where you can find me running, hiking, or relaxing in a hammock. When I do spend time indoors I love to read, write, and cook.\u003c/p\u003e\u003cp\u003eI recently graduated from Duke University where I studied English and Cultural Anthropology (the study of people and how they live). I am interested in education and love connecting with curious people.\u003c/p\u003e\u003cp\u003eI am passionate about leaving my comfort zone through travel. This April I will move to Mendoza, Argentina, where I will spend the rest of the year teaching English.\u003c/p\u003e\u003cp\u003eReach out to me if you want an enthusiastic conversation about books, food, or anything that gets you excited!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English and Cultural Anthropology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9209f05f-5934-4b8e-940b-e16d8863c82c\"}"},{"__ref":"DeepDives:{\"uuid\":\"f834b09c-af04-4ebf-bf8c-8299e6eea393\"}"},{"__ref":"DeepDives:{\"uuid\":\"e037191f-c3c3-4f13-8858-100579ebe599\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1932831c-fa0b-4660-a910-60dad71afe62/-/preview/-/format/jpg/","https://ucarecdn.com/d7708df1-da28-4d46-8313-67f1d99b8d78/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2beb8ed6-d9fe-4e21-8859-8e2f6535e6d1\"}"},{"__ref":"Education:{\"uuid\":\"40e207d2-1eba-4420-b261-9068cd5df757\"}"}],"hiredAt":"2025-02-20T13:03:36.078Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","6-8 Grade Science","Writing","Spanish","College Essay Writing","Reading","Executive Function","Academic Coaching","History","Economics","Creative Writing","Film / Theater","History Project","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"and
