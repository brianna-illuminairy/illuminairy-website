xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"474e8198-c499-499a-9739-0c44b17c0c72\"}":{"__typename":"Favorites","uuid":"474e8198-c499-499a-9739-0c44b17c0c72","photoUrl":"https://ucarecdn.com/4bce4746-14f5-4e95-aaeb-292d2b86b20d/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"5d40b72a-1ebd-47a0-a8ec-27080b2becef\"}":{"__typename":"Favorites","uuid":"5d40b72a-1ebd-47a0-a8ec-27080b2becef","photoUrl":"https://ucarecdn.com/8ebc5763-13c6-46f8-923f-1e4372f728dc/","title":"Chicago Bears","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"a9d259a4-6f1a-47bd-bcf0-580b7bae91c3\"}":{"__typename":"Favorites","uuid":"a9d259a4-6f1a-47bd-bcf0-580b7bae91c3","photoUrl":"https://ucarecdn.com/3ed0670c-1158-4d78-ad9a-809b13171e2a/","title":"Michael Jordan","type":"ATHLETE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2286e7f6-7845-46a2-bcda-229960f9c878\"}":{"__typename":"DeepDives","uuid":"2286e7f6-7845-46a2-bcda-229960f9c878","content":"\u003cp\u003eI would tell my younger self that it's okay to always be learning. As I have grown older, accumulated more knowledge, and built skills -- I realize that there is always more to learn and be exposed to. The most successful people in the world are open to innovating and changing the way they operate as they learn new things. Learning is a process that will never hurt you -- and will in fact, oftentimes help you to improve as both a student and human being.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b1ea39dc-a24e-4a81-9c49-e21bfb518284\"}":{"__typename":"DeepDives","uuid":"b1ea39dc-a24e-4a81-9c49-e21bfb518284","content":"\u003cp\u003eI would not be the person I am today if it were not for the people who have taken the time to invest love, care, and resources in my life. I have seen through a countless number of ways how wisdom and generosity from others has helped me grow as both an artist and human being. No one is able to reach their goals by themselves -- I believe it takes nourishment, compassion, and love from others to get anywhere worthwhile. If I am able to impact someone else's life in a similar way to what my friends and family have done for me -- this would be a major accomplishment in my goal of wanting to give back to my community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c7641182-57c5-4f65-860a-8780c23e0a10\"}":{"__typename":"DeepDives","uuid":"c7641182-57c5-4f65-860a-8780c23e0a10","content":"\u003cp\u003eMy dream job is to be a filmmaker -- that is write and direct movies that play in theaters. Part of the reason why I love movies so much is because of the stories they tell. Watching characters overcome their own obstacles on screen really helped me out of a dark place in my life -- as I realized I could conquer my own challenges. If I am one day able to inspire and change the lives of others through the stories I tell on screen -- just as my favorite filmmakers did for me, I could not ask for anything more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"fe223186-47fa-4a37-bda5-923631d27dba\"}":{"__typename":"DeepDives","uuid":"fe223186-47fa-4a37-bda5-923631d27dba","content":"\u003cp\u003eIn high school, I remember often wanting to be more like others -- instead of embracing my own identity. I thought that I had to hide certain parts of myself in order to fit in. Yet, looking back at it now -- I wish I would've been more confident in the unique qualities that made me stand out. Though everyone finds out who they are in differing amounts of time, I believe it is important to lean into the aspects that make you special. Whether it be through a certain passion, your background, or other character trait -- those are the things that will play the biggest role in helping you find your purpose. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"5bb509bf-40a2-414a-a375-87e4b449952a\"}":{"__typename":"School","uuid":"5bb509bf-40a2-414a-a375-87e4b449952a","name":"Glenbrook South","city":"Glenview","type":"HIGH","state":"IL","country":"USA","zip":"60026"},"Education:{\"uuid\":\"8550c67e-ad3d-4923-bbaa-a9e034fd1a92\"}":{"__typename":"Education","uuid":"8550c67e-ad3d-4923-bbaa-a9e034fd1a92","school":{"__ref":"School:{\"uuid\":\"5bb509bf-40a2-414a-a375-87e4b449952a\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a0b92b4e-8239-4ebc-9763-bda3455a7a17\"}":{"__typename":"School","uuid":"a0b92b4e-8239-4ebc-9763-bda3455a7a17","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"IL","country":"USA","zip":"60015"},"Education:{\"uuid\":\"d93c25c9-ae4d-49f1-bb72-b39fb0c534f5\"}":{"__typename":"Education","uuid":"d93c25c9-ae4d-49f1-bb72-b39fb0c534f5","school":{"__ref":"School:{\"uuid\":\"a0b92b4e-8239-4ebc-9763-bda3455a7a17\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Film, Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"12bc7bf7-3a56-4ac1-b86e-da438f554f76\"}":{"__typename":"MentorPublicProfile","uuid":"12bc7bf7-3a56-4ac1-b86e-da438f554f76","displayName":"Nate L.","slug":"nate-levan","biography":"\u003cp\u003eHi! I grew up in the suburbs of Chicago and stayed there for college -- attending Northwestern University. \u003cbr\u003e\u003cbr\u003eComing out of high school, I wanted to study finance, go into investment banking and make a lot of money (to be totally honest). Yet shortly into my first year in college, I realized this was not the path for me. Though working in finance would offer me a lucrative career, it was not going to be a true source of fulfillment.\u003cbr\u003e\u003cbr\u003eLeaving finance and having to reset my life goals and aspirations left me in a lost, dark place; I felt hopeless and aimless without any purpose. It was during this period where movies changed my life. I turned to them as an escape -- watching characters overcome their own obstacles to become the hero's of their own worlds. Inspired by the stories I was watching on screen, I soon understood that I wanted to create these types of stories myself...\u003cbr\u003e\u003cbr\u003eSo, fast forward three years (after I changed my major to film) and my passion for film has only continued to grow. After graduating, I moved out to LA to continue to pursue a career in the movies!\u003cbr\u003e\u003cbr\u003eSeeing how pursuing my passion has transformed my life, I would love to help other students find and realize what their passions are. Whether it be a subject in the classroom or in the arts -- I'm here to encourage whomever I am mentoring to wholeheartedly chase their dreams.\u003cbr\u003e\u003cbr\u003eOutside of filmmaking, I love to hike, workout, serve/volunteer and spend time with friends. Sports were a big part of my childhood so I also like to play them whenever I get the chance!\u003c/p\u003e","teachingVideoPlaybackId":"a01Ibay6fJJRmS002g9oHfPJaavvGoAamywu8lt42TUxw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"474e8198-c499-499a-9739-0c44b17c0c72\"}"},{"__ref":"Favorites:{\"uuid\":\"5d40b72a-1ebd-47a0-a8ec-27080b2becef\"}"},{"__ref":"Favorites:{\"uuid\":\"a9d259a4-6f1a-47bd-bcf0-580b7bae91c3\"}"}],"causesSupported":[],"major":"Film, Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2286e7f6-7845-46a2-bcda-229960f9c878\"}"},{"__ref":"DeepDives:{\"uuid\":\"b1ea39dc-a24e-4a81-9c49-e21bfb518284\"}"},{"__ref":"DeepDives:{\"uuid\":\"c7641182-57c5-4f65-860a-8780c23e0a10\"}"},{"__ref":"DeepDives:{\"uuid\":\"fe223186-47fa-4a37-bda5-923631d27dba\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0eb1e309-0f4d-41b2-93ec-316f941e04c1/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8550c67e-ad3d-4923-bbaa-a9e034fd1a92\"}"},{"__ref":"Education:{\"uuid\":\"d93c25c9-ae4d-49f1-bb72-b39fb0c534f5\"}"}],"hiredAt":"2023-08-21T21:31:49.485Z","topics":["Video / Photography","Film / Theater"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nate-levan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"12bc7bf7-3a56-4ac1-b86e-da438f554f76\"}"}}},"_sentryTraceData":"7cd859e0236d4190945aabe5a58a65c4-9d08b64e480d28c2-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7cd859e0236d4190945aabe5a58a65c4,sentry-sample_rate=0.2,sentry-transaction=%2F
