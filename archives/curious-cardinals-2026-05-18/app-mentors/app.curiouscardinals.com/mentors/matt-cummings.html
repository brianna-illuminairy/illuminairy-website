xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6506a19c-c7a0-41ed-8d7f-19f4cf59a9a2\"}":{"__typename":"Favorites","uuid":"6506a19c-c7a0-41ed-8d7f-19f4cf59a9a2","photoUrl":"https://ucarecdn.com/7a4da8dd-779c-4c3b-827a-8b3f64bd87c3/","title":"The Messenger - Johnny Marr","type":"ALBUM"},"Favorites:{\"uuid\":\"15f29345-713c-4fc0-a445-3c1abb1e3c0f\"}":{"__typename":"Favorites","uuid":"15f29345-713c-4fc0-a445-3c1abb1e3c0f","photoUrl":"https://ucarecdn.com/7a4da8dd-779c-4c3b-827a-8b3f64bd87c3/","title":"Roger Federer","type":"ATHLETE"},"Favorites:{\"uuid\":\"711865dd-a553-4373-bcff-aa27d53e3caf\"}":{"__typename":"Favorites","uuid":"711865dd-a553-4373-bcff-aa27d53e3caf","photoUrl":"https://ucarecdn.com/7a4da8dd-779c-4c3b-827a-8b3f64bd87c3/","title":"Seattle, WA","type":"CITY"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"86c6a391-6832-4499-b2c0-b0b147283d9a\"}":{"__typename":"DeepDives","uuid":"86c6a391-6832-4499-b2c0-b0b147283d9a","content":"\u003cp\u003eI like to set goals simultaneously for my personal and professional life!  In my personal life, I want to visit (and backpack) through every single national park in the United States.  In my professional life, I would love to start my own company after spending a couple years in consulting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"23f90b39-0ce0-40a8-95fe-020c9fa4d61b\"}":{"__typename":"DeepDives","uuid":"23f90b39-0ce0-40a8-95fe-020c9fa4d61b","content":"\u003cp\u003eIn my spare-time, I enjoy hiking and backpacking, playing both tennis and basketball with friends, and exploring the local music scene in the city I am living in. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"9d7d2eca-4bcb-4450-8bf5-6bea884a5515\"}":{"__typename":"DeepDives","uuid":"9d7d2eca-4bcb-4450-8bf5-6bea884a5515","content":"\u003cp\u003eIn high school I thrived off the communities I found within clubs and organizations.  I was very into DECA, where I competed and served in exec positions such as President (DECA is a pre-professional business competition).  I also served as captain of our tennis team and played Euphonium in the wind ensemble.  Towards the end of my high school journey, I enjoyed a small stint with Model UN which I found extremely rewarding.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"1bfc3321-634b-440c-94d9-e83815755995\"}":{"__typename":"DeepDives","uuid":"1bfc3321-634b-440c-94d9-e83815755995","content":"\u003cp\u003eThroughout my high school journey, I owed a lot of my drive and development to the amazing mentors I had along the way.  Whether it was the DECA or tennis seniors when I was a freshman, or even my own classmates, being surround by passionate and driven individuals absolutely helped me find my place.  I believe every student should have the opportunity to find a mentor in the same way.  I love working with students continuing to find their place in the world!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"52ff7615-dc63-4c42-a0ad-09c32ddf7317\"}":{"__typename":"School","uuid":"52ff7615-dc63-4c42-a0ad-09c32ddf7317","name":"Inglemoor High School","city":"Kenmore","type":"HIGH","state":"Washington","country":"United States","zip":"98028"},"Education:{\"uuid\":\"6482c385-5c5f-401b-9e6b-1b4390047083\"}":{"__typename":"Education","uuid":"6482c385-5c5f-401b-9e6b-1b4390047083","school":{"__ref":"School:{\"uuid\":\"52ff7615-dc63-4c42-a0ad-09c32ddf7317\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"9a2e13c7-d9d3-4cf2-8f52-2d4c7e6a0b3e\"}":{"__typename":"Education","uuid":"9a2e13c7-d9d3-4cf2-8f52-2d4c7e6a0b3e","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Economics and Strategy","degree":null},"MentorPublicProfile:{\"uuid\":\"a4c7f9e1-9e90-48e6-9d6a-6781fda6bc29\"}":{"__typename":"MentorPublicProfile","uuid":"a4c7f9e1-9e90-48e6-9d6a-6781fda6bc29","displayName":"Matt C.","slug":"matt-cummings","biography":"\u003cp\u003eHi everyone!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy name is Matt Cummings, and I am a senior at Washington University in St. Louis, pursuing a major in Economics and Strategy with minors in Computer Science and American Culture Studies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am an avid hiker and camper who loves to pursue passion projects on a daily basis. From convincing a small kombucha company to sponsor a Southwestern backpacking trip to setting up a tennis clinic at my local homeless shelter, I enjoy committing to passion-oriented projects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduating from WashU, I will be moving to DC to work as an Analyst at Capital One. A large part of this, I credit all the way back to my involvement in business-oriented high school clubs like DECA and FBLA (which I would be ECSTATIC to work with students on), as well as consulting organizations I help run at WashU.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe ability to work with students across all age ranges is truly a privilege, as I consider my development and happiness a sub-product of the mentors I've had over the past 21 years. I am happy to work with students of ALL age ranges on a variety of topics, including but not limited to: college applications, passion projects/club involvements, math, SAT preparation, community event planning, economics, resume and cover letter (for students looking for summer internships or jobs), and much more.  I have extensive experience tutoring and working with children from the ages of 4-18 and would love the opportunity to meet with you!\u003c/p\u003e","teachingVideoPlaybackId":"EZIkd01Qd2t600mNMNUoz2Z01z01g6ZKJ01auknF01acgweLQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6506a19c-c7a0-41ed-8d7f-19f4cf59a9a2\"}"},{"__ref":"Favorites:{\"uuid\":\"15f29345-713c-4fc0-a445-3c1abb1e3c0f\"}"},{"__ref":"Favorites:{\"uuid\":\"711865dd-a553-4373-bcff-aa27d53e3caf\"}"}],"causesSupported":[],"major":"Economics and Strategy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"86c6a391-6832-4499-b2c0-b0b147283d9a\"}"},{"__ref":"DeepDives:{\"uuid\":\"23f90b39-0ce0-40a8-95fe-020c9fa4d61b\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d7d2eca-4bcb-4450-8bf5-6bea884a5515\"}"},{"__ref":"DeepDives:{\"uuid\":\"1bfc3321-634b
