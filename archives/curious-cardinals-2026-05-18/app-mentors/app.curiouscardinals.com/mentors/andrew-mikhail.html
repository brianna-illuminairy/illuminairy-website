xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"6550031d-1460-4061-bf90-cc7dd3e9dc3c\"}":{"__typename":"DeepDives","uuid":"6550031d-1460-4061-bf90-cc7dd3e9dc3c","content":"\u003cp\u003eWhen I was in fourth grade, after my first trip to the orthodontist, I had a recurring dream where she was operating on me in every place you can imagine: airports, museums, concert halls. I had to read \u003cem\u003eThe Interpretation of Dreams\u003c/em\u003e by Freud for a psych class --- still no clue what was up with that.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a7f431ee-8b6b-41ae-91d7-dd29134343e4\"}":{"__typename":"DeepDives","uuid":"a7f431ee-8b6b-41ae-91d7-dd29134343e4","content":"\u003cp\u003eI spent six summers working at the deli counter in a neighborhood market near my house. When I first started there, I was too young to get a work permit, so they paid me in food.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"dc8cb5b0-66d4-4a56-ac45-798de759090a\"}":{"__typename":"DeepDives","uuid":"dc8cb5b0-66d4-4a56-ac45-798de759090a","content":"\u003cp\u003eAs a high school senior, two friends and I made a thirty-minute documentary about gun violence. We went to protests, gun stores, and gun shows hearing from everyone from proud gun owners to victims of gun violence. The experience was eye-opening and helped me decide to become a film major.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"efdc3c09-53cf-4004-bbab-74578602f8a7\"}":{"__typename":"DeepDives","uuid":"efdc3c09-53cf-4004-bbab-74578602f8a7","content":"\u003cp\u003eI absolutely love games and competitions --- sports, board games, you name it. Right now, my three main obsessions are chess, pool, and pickleball.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"eb919ee9-a434-4b06-9d87-e450f2b4a553\"}":{"__typename":"School","uuid":"eb919ee9-a434-4b06-9d87-e450f2b4a553","name":"Georgetown Day School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20016"},"Education:{\"uuid\":\"76b5462e-737d-496f-9758-a10085582179\"}":{"__typename":"Education","uuid":"76b5462e-737d-496f-9758-a10085582179","school":{"__ref":"School:{\"uuid\":\"eb919ee9-a434-4b06-9d87-e450f2b4a553\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"bdfe73df-f893-4309-90ca-6e4faf73f515\"}":{"__typename":"Education","uuid":"bdfe73df-f893-4309-90ca-6e4faf73f515","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"History and Radio, Television \u0026 Film","degree":null},"MentorPublicProfile:{\"uuid\":\"c6b21a6d-e6f7-4487-a4b9-58c109eb00ce\"}":{"__typename":"MentorPublicProfile","uuid":"c6b21a6d-e6f7-4487-a4b9-58c109eb00ce","displayName":"Andrew M.","slug":"andrew-mikhail","biography":"\u003cp\u003eHey y’all! I’m Andrew, a sophomore at Northwestern from the DC area. At NU, I’m in the Radio, Television \u0026amp; Film program, and picked up a second major in history. In my free time, I’m pursuing standup comedy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI dedicated much of my time in high school to student journalism. I began reporting for my school newspaper as a freshman, and eventually worked my way up to leading the 70-person staff as managing editor during my junior and senior year. That experience taught me invaluable organizational and leadership skills, and editing hundreds of articles made me a much better writer. I look forward to helping mentees with their essay writing — whether your student needs tips on how to start an essay for English class, or on polishing their personal statement for college applications, I’m your guy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m still passionate about journalism, but my interest has morphed in the direction of film, by way of documentaries. As a senior in high school, I started making documentary projects with friends, which is how I ended up a film major. Around the same time, I began performing standup comedy in my hometown of DC, and broke into the Chicago scene when I came to college. I can’t wait to work with mentees interested in film, comedy, and creative media.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile math is not my primary academic focus in college, I’ve taken and excelled in math classes up through multivariable calculus and differential equations, and am also excited, and qualified, to mentor young math students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, I love to skateboard, play pickleball, and spend time with friends and family. I spent last summer working on Rep. Jamie Raskin’s congressional campaign; this upcoming summer, I’m interning at the law firm Morgan Lewis in DC, and I’ve been thinking about applying to law school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome teachers and tutors talk about balancing work and fun. I don’t believe that constructive and substantive teaching needs to come at the cost of having fun, or vice versa. My approach to mentorship is driven by learning together. I look forward to learning and growing alongside your students. Cheers!\u003c/p\u003e","teachingVideoPlaybackId":"zmeJDMyjSCZUh2a1WQ02gEKbTtEytXGfFcXGNWEdVEdg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History and Radio, Television \u0026 Film","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6550031d-1460-4061-bf90-cc7dd3e9dc3c\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7f431ee-8b6b-41ae-91d7-dd29134343e4\"}"},{"__ref":"DeepDives:{\"uuid\":\"dc8cb5b0-66d4-4a56-ac45-798de759090a\"}"},{"__ref":"DeepDives:{\"uuid\":\"efdc3c09-53cf-4004-bbab-74578602f8a7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2be1e18b-c050-442f-899e-1749dcd57f2d/-/preview/-/format/jpg/","https://ucarecdn.com/e7840fb5-e3d1-4d7d-993f-f86338b9f6db/-/preview/-/format/jpg/","https://ucarecdn.com/070e53b1-a675-47c9-a54a-28f2513fde21/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"76b5462e-737d-496f-9758-a10085582179\"}"},{"__ref":"Education:{\"uuid\":\"bdfe73df-f893-4309-90ca-6e4faf73f515\"}"}],"hiredAt":"2025-04-21T04:16:08.403Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Physics","Writing","College Essay Writing","History","Reading","Executive Function","Academic Coaching","Creative Writing","Film / Theater","Sports Journalism","History Project","Video / Photography","K-6 Storybook","Business / Entrepreneurship","Law / Government / Policy","Journalism","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"andrew-mikhail\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c6b21a6d-e6f7-4487-a4b9-58c109eb00ce\"}"}}},"_sentryTraceData":"a4fe916044064b1da310ff5e300fd478-95ad39fe213ac346-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a4fe916044064b1da310ff5e300fd478,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"andrew-mikhail"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
