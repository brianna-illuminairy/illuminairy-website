xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ed5f1811-d529-4db1-b33b-c157b85ba1fd\"}":{"__typename":"Favorites","uuid":"ed5f1811-d529-4db1-b33b-c157b85ba1fd","photoUrl":"https://ucarecdn.com/d9b7c8a4-0a5b-4cb7-9038-692ca0fefa25/","title":"Jennifer Lawrence","type":"ACTOR"},"Favorites:{\"uuid\":\"86dd3b05-21e6-4fbe-8e52-85517ba35375\"}":{"__typename":"Favorites","uuid":"86dd3b05-21e6-4fbe-8e52-85517ba35375","photoUrl":"https://ucarecdn.com/6c8ec6bc-dfb0-429e-bad3-0ea30d65f93d/","title":"Cloud 9 by Kygo","type":"ALBUM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"dc616c17-30d7-4b3f-9cb6-2e35f2b4d9c5\"}":{"__typename":"DeepDives","uuid":"dc616c17-30d7-4b3f-9cb6-2e35f2b4d9c5","content":"\u003cp\u003eI have always valued mentorship. In middle school, my sister joined \"Upper School Math Tutors\" at our school, where she tutored younger students. Inspired by her, I decided to join as well, and ever since, I have found immense fulfillment in both being a mentor and having one. When I reached high school, I took on leadership roles as the President of both Upper School Language and Math Tutors.\u003c/p\u003e\u003cp\u003eI believe having a mentor close in age is incredibly impactful—they can explain concepts with a fresh perspective, having recently learned the same material themselves. Additionally, as a junior in high school, I can connect with my mentee not just academically but also as a friend, fostering a strong and supportive relationship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"80cd95ad-c673-41df-9d0f-28f9eea4c8d9\"}":{"__typename":"DeepDives","uuid":"80cd95ad-c673-41df-9d0f-28f9eea4c8d9","content":"\u003cp\u003eIn my spare time, I love going for runs, reading, playing volleyball, trying new and unique foods, and spending time with my friends. I’ve been playing volleyball since fifth grade, both in school and club teams, and it has always been a source of joy for me. Being part of a team allowed me to meet incredible people and experience the excitement of competitive play.\u003c/p\u003e\u003cp\u003eAt Emory, I joined the club volleyball team, but due to logistical reasons, I am no longer playing. However, I’ve since found a new passion for running! I believe exercise is one of the best things you can do for both your body and mind, and running has become an incredible way for me to stay active and clear my thoughts.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"a87c82f0-c2c9-489c-afc1-87a8755cb536\"}":{"__typename":"DeepDives","uuid":"a87c82f0-c2c9-489c-afc1-87a8755cb536","content":"\u003cp\u003eAs a high school student, I was deeply passionate about both Math and History. I challenged myself by taking advanced math courses and particularly enjoyed studying financial history in the U.S. This interest initially led me to apply as a Political Science major, believing that was the path I wanted to pursue.\u003c/p\u003e\u003cp\u003eI also highly valued my relationships with my teachers, particularly my senior year math teacher. I built an extremely strong connection with them. I actively participated in class and made it a priority to seek clarification from him after lessons whenever I had questions. These one-on-one interactions were where I learned the most and built strong connections with my teachers, which in turn motivated me to excel academically. I believe this experience also shaped my passion for mentorship—having had such impactful guidance myself, I came to appreciate the value of personalized learning and the difference a mentor can make.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8612f9f4-1680-44ea-b848-bca1384f2d8a\"}":{"__typename":"DeepDives","uuid":"8612f9f4-1680-44ea-b848-bca1384f2d8a","content":"\u003cp\u003ey dream job is to be a successful trader, specializing in sustainable products and markets. I am deeply passionate about both sustainability and the health of our planet, alongside my strong interest in market dynamics, interest rates, and global financial systems. The ideal intersection of these passions would be a career where I can leverage my financial expertise to drive investments in sustainable markets, helping to support environmentally responsible industries while contributing to long-term economic growth. I believe that sustainable finance has the potential to create lasting positive change, and I am excited by the idea of playing a role in shaping a more sustainable global economy through trading and strategic investment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"5f41d4ea-47f9-4577-9143-b2b49b3baf15\"}":{"__typename":"School","uuid":"5f41d4ea-47f9-4577-9143-b2b49b3baf15","name":"Trinity SchooI","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10024"},"Education:{\"uuid\":\"7ad9a1d8-5df8-4640-bb6b-40d10070f9c1\"}":{"__typename":"Education","uuid":"7ad9a1d8-5df8-4640-bb6b-40d10070f9c1","school":{"__ref":"School:{\"uuid\":\"5f41d4ea-47f9-4577-9143-b2b49b3baf15\"}"},"startYear":"2009","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"251d314c-d662-4ec6-a843-797296c5bdbb\"}":{"__typename":"School","uuid":"251d314c-d662-4ec6-a843-797296c5bdbb","name":"Emory University","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30322"},"Education:{\"uuid\":\"ed9b144d-1f7d-42ab-8495-0aad2084bc60\"}":{"__typename":"Education","uuid":"ed9b144d-1f7d-42ab-8495-0aad2084bc60","school":{"__ref":"School:{\"uuid\":\"251d314c-d662-4ec6-a843-797296c5bdbb\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Finance and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"d68468b9-fab9-4ce5-8d01-f6b7a037db84\"}":{"__typename":"MentorPublicProfile","uuid":"d68468b9-fab9-4ce5-8d01-f6b7a037db84","displayName":"Natalia G.","slug":"natalia-giordano-1","biography":"\u003cp\u003eHi! My name is Natalia Giordano, and I am a junior at Emory University, majoring in Finance at the business school with a minor in Economics. I was born in New York City and grew up in Harlem and the East Side, attending school on the Upper West Side. At Trinity, my high school, I was deeply involved in extracurriculars, particularly political and environmental activities, which initially led me to Emory thinking I would major in Political Science with a minor in Environmental Science or Sustainability. However, I soon realized that what truly interested me was understanding why people are motivated to act in sustainable or unsustainable ways.\u003c/p\u003e\u003cp\u003eAs I delved deeper into this curiosity, I transitioned into the business school, where I will be officially enrolled this spring. My passion for markets, micro and macroeconomics, and consumer behavior grew, reinforcing my decision to concentrate in Finance while maintaining my minor in Economics. On campus, I sought out new communities that I knew I wouldn’t have the chance to explore after college. I joined organizations like Tamid at Emory, Emory Club Volleyball, and Atlas Consulting Group because I loved the structure, competition, and sense of working toward meaningful goals. Extracurricularly, I also love to read, run, play volleyball, and try new foods.\u003c/p\u003e\u003cp\u003eThis past summer, I worked as a Sales \u0026amp; Data Analyst at Veronica Beard, a global fashion retail brand, where I developed a deep appreciation for analyzing consumer and company behaviors and crafting strategic solutions to meet their needs. The role strengthened both my sales and analytical skills, reinforcing my passion for understanding different markets. Given my strong interest in sustainability, I prioritized finding internship opportunities at companies that share these values. That’s why I am thrilled to be interning at BNP Paribas this summer in Sales \u0026amp; Trading, where I look forward to applying and growing my skills in a dynamic, sustainability-focused environment.\u003c/p\u003e","teachingVideoPlaybackId":"ahBscnwAFJX01nZ00ZLL6xDumpo01iQCdrbSd8Qx9c6Y2c","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was deciding to take one of the hardest Economics classes at Emory. I was extremely scared because I had not yet taken the prerequisite class (they made an exception for me). I was terrified that I would do poorly since the math felt like an entirely new language. To prepare, I started studying a week before each exam and dedicated significant time and effort. In the end, it paid off—I did well! I was very proud of myself because I proved that I can excel when I set my mind to something.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ed5f1811-d529-4db1-b33b-c157b85ba1fd\"}"},{"__ref":"Favorites:{\"uuid\":\"86dd3b05-21e6-4fbe-8e52-85517ba35375\"}"}],"causesSupported":[],"major":"Finance and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dc616c17-30d7-4b3f-9cb6-2e35f2b4d9c5\"}"},{"__ref":"DeepDives:{\"uuid\":\"80cd95ad-c673-41df-9d0f-28f9eea4c8d9\"}"},{"__ref":"DeepDives:{\"uuid\":\"a87c82f0-c2c9-489c-afc1-87a8755cb536\"}"},{"__ref":"DeepDives:{\"uuid\":\"8612f9f4-1680-44ea-b848-bca1384f2d8a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6c60ee6d-d840-438a-bb75-3fb48ae7fce8/-/preview/-/format/jpg/","https://ucarecdn.com/6952f81e-e37b-4212-8ad5-75af16c1fde4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7ad9a1d8-5df8-4640-bb6b-40d10070f9c1\"}"},{"__ref":"Education:{\"uuid\":\"ed9b144d-1f7d-42ab-8495-0aad2084bc60\"}"}],"hiredAt":"2025-01-25T01:18:04.716Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Writing","Spanish","Reading","Economics","Executive Function","Academic Coaching"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"natalia-giordano-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d68468b9-fab9-4ce5-8d01-f6b7a037db84\"}"}}},"_sentryTraceData":"c352906a711349fc892d12aac9e92923-88a56250a403cbad-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c352906a711349fc892d12aac9e92923,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"natalia-giordano-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strateg
