xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"89cee352-cd2d-4022-aeb8-ef8d42f608c2\"}":{"__typename":"DeepDives","uuid":"89cee352-cd2d-4022-aeb8-ef8d42f608c2","content":"\u003cp\u003eTake your time and never be afraid to ask for help!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2c52b8a9-a658-4954-aa0f-74c835b0388c\"}":{"__typename":"DeepDives","uuid":"2c52b8a9-a658-4954-aa0f-74c835b0388c","content":"\u003cp\u003eMentorship matters to me because it is so formative to have someone not only teach you facts but show you what is possible with hard work. Connecting on a personal level with mentors is what makes students want to learn and explore.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"76502229-ef35-4aa6-a467-0d9d11218d01\"}":{"__typename":"DeepDives","uuid":"76502229-ef35-4aa6-a467-0d9d11218d01","content":"\u003cp\u003eI hope to make a movie that brings people joy while asking universal questions about life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c9a42daf-10cc-4dba-849d-94bdeec102c3\"}":{"__typename":"DeepDives","uuid":"c9a42daf-10cc-4dba-849d-94bdeec102c3","content":"\u003cp\u003eI am majoring in Radio/TV/Film because movies have brought me so much connection and happiness in my life. I want to be a filmmaker because the art form utilizes all of my favorite mediums from music to photography to performance. I began legal studies because I am passionate about constitutional law, specifically how the constitution is interpreted like literature. Gradually I've found the importance of being knowledgeable about contracts and how the legal system works.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"69264d90-5a19-41e4-9661-9f41181e6c1d\"}":{"__typename":"Education","uuid":"69264d90-5a19-41e4-9661-9f41181e6c1d","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Radio/Tv/Film and Legal Studies","degree":"Bachelor of Arts"},"School:{\"uuid\":\"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122\"}":{"__typename":"School","uuid":"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122","name":"Spence School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"0091d594-db35-4adb-a030-af57b1a1313b\"}":{"__typename":"Education","uuid":"0091d594-db35-4adb-a030-af57b1a1313b","school":{"__ref":"School:{\"uuid\":\"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"1c1171bd-fe2a-401c-a2e8-0661963b2f06\"}":{"__typename":"MentorPublicProfile","uuid":"1c1171bd-fe2a-401c-a2e8-0661963b2f06","displayName":"Lily K.","slug":"lily-kaplan","biography":"\u003cp\u003eLily is a sophomore Radio/TV/Film and Legal Studies double major at Northwestern University.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe grew up in NYC and attended the Spence School from K-12, except for 3rd-5th grade. During those years she went to a school for students with dyslexia and other language-based learning differences. Lily’s experience with dyslexia has made her passionate about creative mentorship for students with learning differences.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, Lily loves to ski, paint, perform and write. Lily’s passions include the arts, politics, and french fries. Her favorite musicians are Arctic Monkeys and Beyoncé and she could re-watch the tv show New Girl on repeat. In high school, Lily led the civics club, film club, fashion club, and youth education volunteering club. She also volunteered with multiple political campaigns and she wrote a short play with CreateHER that was performed by actors in NYC. In addition, Lily collaborated on many short films in high school, collectively featuring in 15 film festivals, including her short The Humanity Test, which won the Audience Award at the Red Rock Film Festival and Best Student Sci-Fi Short at Indie Short Fest. Now at Northwestern Lily has worked on 10 more short films. The last project she directed this spring, Nein Friends, was featured in 9 festivals including winning Best Direction at Chicago Feedback Film Festival. Currently, she is co-producing her first feature-length film with Applause for A Cause, a philanthropic student film production group at Northwestern. Lily hopes to continue making films and collaborating with creative people.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, Lily wants to help students discover their passions and unique talents. Her experience with mentoring and tutoring younger students, along with her own personal learning journey, has shown her the vital importance of encouragement and patience.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Radio/Tv/Film and Legal Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"89cee352-cd2d-4022-aeb8-ef8d42f608c2\"}"},{"__ref":"DeepDives:{\"uuid\":\"2c52b8a9-a658-4954-aa0f-74c835b0388c\"}"},{"__ref":"DeepDives:{\"uuid\":\"76502229-ef35-4aa6-a467-0d9d11218d01\"}"},{"__ref":"DeepDives:{\"uuid\":\"c9a42daf-10cc-4dba-849d-94bdeec102c3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3c97534d-efd9-471c-bac0-d361eb131f93/-/crop/1065x1066/21,0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"69264d90-5a19-41e4-9661-9f41181e6c1d\"}"},{"__ref":"Education:{\"uuid\":\"0091d594-db35-4adb-a030-af57b1a1313b\"}"}],"hiredAt":"2022-12-20T20:04:26.000Z","topics":["Film / Theater","Writing","Literature","Video / Photography","Creative Writing","History Project","Visual Arts / Graphic Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lily-kaplan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1c1171bd-fe2a-401c-a2e8-0661963b2f06\"}"}}},"_sentryTraceData":"2343cd9edd944cf5badb5f3569fa0d03-bc8e48448c228dc6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6da
