xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e9854419-a2e9-497f-aebd-f36bc945410e\"}":{"__typename":"Favorites","uuid":"e9854419-a2e9-497f-aebd-f36bc945410e","photoUrl":"https://ucarecdn.com/eb65be29-bed5-41b2-956f-73e2564bf9cf/","title":"Frank Ocean","type":"ARTIST"},"Favorites:{\"uuid\":\"503cd101-1925-49dd-9426-94fc11436157\"}":{"__typename":"Favorites","uuid":"503cd101-1925-49dd-9426-94fc11436157","photoUrl":"https://ucarecdn.com/1f3bea5e-30bc-4879-b42a-085491623d95/","title":"Russell Westbrook","type":"ATHLETE"},"Favorites:{\"uuid\":\"9c908317-742f-4d09-acba-2f3bc2c523f3\"}":{"__typename":"Favorites","uuid":"9c908317-742f-4d09-acba-2f3bc2c523f3","photoUrl":"https://ucarecdn.com/f0fdb47c-675b-40f0-84ce-86697e3d7002/","title":"Pickleball","type":"SPORT"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"66db4312-3f7c-40e5-87ee-428b648334d9\"}":{"__typename":"DeepDives","uuid":"66db4312-3f7c-40e5-87ee-428b648334d9","content":"\u003cp\u003eMy greatest role model is my grandfather, who was an engineer and investor. He raised me and taught me how to think. It's because of him that I have this opportunity to learn and grow at university. In everything that I do, I am reminded of his influence to give my best work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"20d1c35c-bb48-4931-9e03-918b660fc258\"}":{"__typename":"DeepDives","uuid":"20d1c35c-bb48-4931-9e03-918b660fc258","content":"\u003cp\u003eMentorship matters to me because it's vital to learning. Having people that you can ask questions to and pick their brains can help you improve your perspective or way of thinking. It also helps to have a person in your corner that gives reasonable advice towards you achieving certain goals. During my time in high school, I was blessed to have my Science Olympiad coach help guide me towards learning chemistry and gradually molding me to become a leader for our team. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d8936b7d-f715-46e2-b3f7-fb8f8519d0c2\"}":{"__typename":"DeepDives","uuid":"d8936b7d-f715-46e2-b3f7-fb8f8519d0c2","content":"\u003cp\u003eIn my spare time, I love to read, exercise, and watching Netflix shows. I love reading all types of books, especially science fiction and philosophy (currently reading Meditations by Marcus Aurelius). Exercise is super important to me because I believe having a healthy body is crucial to thinking clearly and executing on goals. Finally, when I have the chance, I enjoy binging Netflix with friends, especially K-dramas or thrillers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"49441630-5bc2-42f2-a5ba-016208f40335\"}":{"__typename":"DeepDives","uuid":"49441630-5bc2-42f2-a5ba-016208f40335","content":"\u003cp\u003eI would tell my past self to try different, new experiences and opportunities. I had no clue coming into high school that I would come to love STEM and volunteering. If you try new things and then commit to the ones that you love, you'll build a winning formula for your goals. I would also tell high school me to sleep more. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2f5a7e02-e3c1-4adf-8677-37a15953d187\"}":{"__typename":"School","uuid":"2f5a7e02-e3c1-4adf-8677-37a15953d187","name":"Gretchen Whitney High School","city":"Cerritos","type":"HIGH","state":"California","country":"United States","zip":"90703"},"Education:{\"uuid\":\"5dd01250-8a52-4bcb-a5b9-4ee3d7f8799e\"}":{"__typename":"Education","uuid":"5dd01250-8a52-4bcb-a5b9-4ee3d7f8799e","school":{"__ref":"School:{\"uuid\":\"2f5a7e02-e3c1-4adf-8677-37a15953d187\"}"},"startYear":"2019","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"79f2da05-c48c-46d0-9c24-772df69176ee\"}":{"__typename":"Education","uuid":"79f2da05-c48c-46d0-9c24-772df69176ee","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"c875ec34-b4b7-471f-abda-ce5e83e3ac95\"}":{"__typename":"MentorPublicProfile","uuid":"c875ec34-b4b7-471f-abda-ce5e83e3ac95","displayName":"Chris C.","slug":"chris-chen-1","biography":"\u003cp\u003eHi!\u003c/p\u003e\u003cp\u003eI'm Christopher, a freshman at Brown University studying Chemical Engineering and I love helping students with academic coaching and engaging with their community through science outreach!\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI know that getting involved in your community can feel overwhelming, especially when you're trying to build something from scratch. But I also know how rewarding it is when a project you've poured your heart into actually brings people together.\u003c/p\u003e\u003cp\u003eFor academic coaching, I can work with a wide range of students (K-5, Middle/High School) in many subjects. I'm particularly strong in chemistry, biology, and math. I also love history and can yap about it for hours!\u003c/p\u003e\u003cp\u003eFor passion projects, I work with primarily high school students who are looking to make an impact in their community through this kind of service. Regardless of your background in STEM, I’d love to work with you towards this kind of passion project. Additionally, if you're working on college applications, I'd love to help you write essays that stand out.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m Qualified to Help You:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDuring high school, I was the director for our STEM Club’s Science Night program, where we hosted 8+ volunteering events at elementary schools and libraries every year. This was one of my favorite parts of high school and it was so memorable teaching others about science.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI also was the coordinator for a STEM nonprofit’s science outreach program for two years, teaching math and chess!\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI was also a peer tutor in high school for chemistry and teaching assistant at a Chinese summer camp, where I started an engineering class for young students. \u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might include:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming and planning your outreach idea from the ground up\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a structure for events, including curriculum, volunteer coordination, and community partnerships\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTroubleshooting challenges that come up when running a real program\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReflecting on what works and refining your approach over time\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of STEM and volunteering, I love reading, playing chess, and working out. I'm also a big fan of K-dramas and can rewatch Suits endlessly. I also enjoy hiking, playing football, and listening to music (The Smiths are my favorite right now).\u0026nbsp;\u003c/p\u003e\u003cp\u003eI'd love to help you create something you're genuinely proud of, whether that's a school science fair, a library workshop series, a chess club, or something entirely your own. If you're curious about science outreach or any academic coaching, I’d love to work with you!\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"o9Z3f1cgEWOww2jDRE1HrEajZMpdwo602ZjupwqRdg3g","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e9854419-a2e9-497f-aebd-f36bc945410e\"}"},{"__ref":"Favorites:{\"uuid\":\"503cd101-1925-49dd-9426-94fc11436157\"}"},{"__ref":"Favorites:{\"uuid\":\"9c908317-742f-4d09-acba-2f3bc2c523f3\"}"}],"causesSupported":[],"major":"Chemical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"66db4312-3f7c-40e5-87ee-428b648334d9\"}"},{"__ref":"DeepDives:{\"uuid\":\"20d1c35c-bb48-4931-9e03-918b660fc258\"}"},{"__ref":"DeepDives:{\"uuid\":\"d8936b7d-f715-46e2-b3f7-fb8f8519d0c2\"}"},{"__ref":"DeepDives:{\"uuid\":\"49441630-5bc2-42f2-a5ba-016208f40335\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f22739bb-1125-4e10-ad58-86e9eb54a54b/-/preview/-/format/jpg/","https://ucarecdn.com/ae9f3d24-a4bf-40f6-8f73-e19e3c508b21/-/preview/-/format/jpg/","https://ucarecdn.com/55830e10-945f-4c20-abcf-178975a79df1/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5dd01250-8a52-4bcb-a5b9-4ee3d7f8799e\"}"},{"__ref":"Education:{\"uuid\":\"79f2da05-c48c-46d0-9c24-772df69176ee\"}"}],"hiredAt":"2026-02-11T19:00:18.785Z","topics":["Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Chemistry","Academic Coaching","College Essay Writing","Executive Function","History","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"chris-chen-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c875ec34-b4b7-471f-abda-ce5e83e3ac95\"}"}}},"_sentryTraceData":"8567739b6473431e8668cad1e13b745a-b22d65f8a934f584-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8567739b6473431e8668cad1e13b745a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"chris-chen-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><
