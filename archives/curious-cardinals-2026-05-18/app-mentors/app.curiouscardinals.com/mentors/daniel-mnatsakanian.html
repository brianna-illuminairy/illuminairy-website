xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e52175fd-a8c8-441b-8d02-0bf7e6cf66de\"}":{"__typename":"DeepDives","uuid":"e52175fd-a8c8-441b-8d02-0bf7e6cf66de","content":"\u003cp\u003eAs long as you don't quit, you'll make it farther than 99% of people out there.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"866bdf6c-a627-4e2d-96b3-4fbea5c6ad84\"}":{"__typename":"DeepDives","uuid":"866bdf6c-a627-4e2d-96b3-4fbea5c6ad84","content":"\u003cp\u003eMy family is my greatest source of motivation. I will be forever grateful for everything that they have done for me and they are the reason I give it my all every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"a1888e02-d89c-4917-82ef-b1c655cfaf70\"}":{"__typename":"DeepDives","uuid":"a1888e02-d89c-4917-82ef-b1c655cfaf70","content":"\u003cp\u003eMy mom is my greatest mentor. She is the reason I am where I am today. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"9e15413b-e380-4bf3-b674-5c117a5a3d39\"}":{"__typename":"DeepDives","uuid":"9e15413b-e380-4bf3-b674-5c117a5a3d39","content":"\u003cp\u003eI had incredible mentors growing up and I think that a lot of kids today lack that. Growing up, my mentors instilled in me the mindset required to tackle anything in life. I want to pass this on to the next generation. I want to see kids grow up with the right mentality about how to approach challenges. It not just about succeeding, it's about doing it the right way too.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a3e9f4e3-1b4f-4b98-aa91-fd307519e1c2\"}":{"__typename":"Education","uuid":"a3e9f4e3-1b4f-4b98-aa91-fd307519e1c2","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Management Science and Engineering","degree":null},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"d7ef3731-9e98-4cbf-b9f8-63ffa437f09d\"}":{"__typename":"Education","uuid":"d7ef3731-9e98-4cbf-b9f8-63ffa437f09d","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"f61b1515-5f3c-4e35-b274-a99406fb7e7c\"}":{"__typename":"MentorPublicProfile","uuid":"f61b1515-5f3c-4e35-b274-a99406fb7e7c","displayName":"Daniel M.","slug":"daniel-mnatsakanian","biography":"\u003cp\u003eHello everyone, my name is Daniel, and I’m currently a student-athlete at Stanford University. I’m pursuing a degree in Management Science and Engineering, an interdisciplinary major that blends computer science, finance, economics, optimization, and probability. After graduation, I hope to apply these skills in the financial sector.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLast summer, I interned at Ajax, a healthcare venture capital firm in Palo Alto. This summer, I’ll be interning with Alpine Investors, where I’m excited to gain more experience in the investing world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, athletics play a central role in my college experience. I’m a member of the Stanford Men’s Water Polo team and have been playing competitively for over a decade. I’ve represented the U.S. on several national teams, from development through youth levels, which has taken me to countries like Serbia, Greece, and Hungary. I earned a silver medal at the 2022 Junior Pan American Games and competed at the 2022 Youth World Championships in Belgrade, Serbia. Water polo has shaped who I am—it’s taught me tenacity, relentlessness, and discipline, and has given me lasting friendships and unforgettable experiences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school and sports, I’m a passionate music fan. I enjoy listening to all genres and played alto saxophone throughout middle and high school, performing in both jazz bands and classical ensembles. In my free time, I also enjoy reading and playing chess.\u003c/p\u003e\u003cp\u003eMy personal philosophy can be summed up with one of my favorite quotes:\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;“A ship is always safe at the shore, but that’s not what it was built for.”\u003cstrong\u003e\u003cbr\u003e\u003cbr\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u0026nbsp;To me, that means growth lies in stepping out of your comfort zone and taking risks. If you never fall, you never learn how to stand up. I believe one of the most important skills in life is learning how to fail—failure is an art that few take the time to master.\u003c/p\u003e","teachingVideoPlaybackId":"tzcu0102LNhjHlaZ4b4dcbDz00zrgcpQhFMMXg02SxLx6NY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Management Science and Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e52175fd-a8c8-441b-8d02-0bf7e6cf66de\"}"},{"__ref":"DeepDives:{\"uuid\":\"866bdf6c-a627-4e2d-96b3-4fbea5c6ad84\"}"},{"__ref":"DeepDives:{\"uuid\":\"a1888e02-d89c-4917-82ef-b1c655cfaf70\"}"},{"__ref":"DeepDives:{\"uuid\":\"9e15413b-e380-4bf3-b674-5c117a5a3d39\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5ce4e03a-8b9a-4576-8b39-b97386c3e42f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a3e9f4e3-1b4f-4b98-aa91-fd307519e1c2\"}"},{"__ref":"Education:{\"uuid\":\"d7ef3731-9e98-4cbf-b9f8-63ffa437f09d\"}"}],"hiredAt":"2025-04-21T04:18:53.788Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Physics","6-8 Grade Science","Economics","Academic Coaching"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"daniel-mnatsakanian\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f61b1515-5f3c-4e35-b274-a99406fb7e7c\"}"}}},"_sentryTraceData":"2dc797e48711463a8416abc33c82cea3-adc7ccd946a2caa7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb
