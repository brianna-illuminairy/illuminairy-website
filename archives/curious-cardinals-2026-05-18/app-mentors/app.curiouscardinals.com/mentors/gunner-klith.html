xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2c8e6614-b6dc-408b-830b-f74e584baeba\"}":{"__typename":"DeepDives","uuid":"2c8e6614-b6dc-408b-830b-f74e584baeba","content":null,"videoPlaybackId":"Zq4AJk00tZ441H02iDC00PFevZGNmhPhPBpMsJX2mcgA0200","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"23f4da79-98ca-40b2-8845-5eb53803c141\"}":{"__typename":"DeepDives","uuid":"23f4da79-98ca-40b2-8845-5eb53803c141","content":"\u003cp\u003eIn my spare time I love to read, play basketball, hang out with my friends, and workout. \u003cbr\u003eI enjoy both fiction and non-fiction books, though right now I mainly read fiction (I am currently reading the Iliad). I enjoy novels a lot and even wanted to be an author when I was younger!\u003cbr\u003eI consider myself to be social but also enjoy alone time, so I like to have a good mix of social activities and solo ones. With my friends, I enjoy exploring different areas of New York City on the metro, going out and getting food, and playing sports.\u003cbr\u003eThough I started working out for my health, I have grown to really enjoy the gym. I try to go around 4-5 times though studying and homework sometimes makes that difficult.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b769c4a2-0dd6-4752-97fc-b2eb0e82afee\"}":{"__typename":"DeepDives","uuid":"b769c4a2-0dd6-4752-97fc-b2eb0e82afee","content":null,"videoPlaybackId":"dbDq9oX1Z3lHDUWb4nkVQKX4WrVbWFJs5l102FtUKgeg","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a38d4a40-721a-44f0-951a-086a19ad6a8f\"}":{"__typename":"DeepDives","uuid":"a38d4a40-721a-44f0-951a-086a19ad6a8f","content":"\u003cp\u003eWhile I did a variety of things during my summers, the two biggest ones were volunteer work and traveling. \u003c/p\u003e\u003cp\u003eEach summer throughout high school, I returned to Guatemala, where I used to live, to run the math tutoring program I founded. This experience was incredibly inspiring and is a major reason why I remain passionate about tutoring and mentorship.\u003c/p\u003e\u003cp\u003eI also have a deep love for travel and spent much of my summers visiting other countries. This past summer, I backpacked through Europe with friends. I enjoy exploring new places and immersing myself in different cultures. Many of my most cherished memories come from spontaneous moments I’ve experienced while traveling.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"bea4eb8c-6213-47c3-af37-e053454a8fee\"}":{"__typename":"School","uuid":"bea4eb8c-6213-47c3-af37-e053454a8fee","name":"CRIA (Costa Rica International Academy)","city":"Brasilito","type":"HIGH","state":"Provincia de Guanacaste","country":"Costa Rica","zip":"50308"},"Education:{\"uuid\":\"c05268
