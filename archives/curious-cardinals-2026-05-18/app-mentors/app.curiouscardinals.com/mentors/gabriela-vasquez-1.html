xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0bf745fa-65f8-4c52-bd4e-00a7845ed6e2\"}":{"__typename":"DeepDives","uuid":"0bf745fa-65f8-4c52-bd4e-00a7845ed6e2","content":"\u003cp\u003eEverything falls into place. It's important to always keep a positive mindset even when faced with challenges.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"c8ce0b6c-8d00-4962-86b8-99e8838e0cdb\"}":{"__typename":"DeepDives","uuid":"c8ce0b6c-8d00-4962-86b8-99e8838e0cdb","content":"\u003cp\u003eI was shy and had a hard time understanding how valuable my voice was. I learned through pursuing my passions that I could take up space without shame.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"cb1d4a01-9dc5-4e88-9225-957056df30f3\"}":{"__typename":"DeepDives","uuid":"cb1d4a01-9dc5-4e88-9225-957056df30f3","content":"\u003cp\u003eI was born in the Dominican Republic, where community is incredibly important. The love and support that I received from my family and friends really guides my teaching style. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"3c823eb3-44d9-4706-abf0-1ae81403d6c4\"}":{"__typename":"School","uuid":"3c823eb3-44d9-4706-abf0-1ae81403d6c4","name":"Boston Latin School (BLS)","city":"Boston","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02115"},"Education:{\"uuid\":\"f9cb0cee-84cc-4160-8d50-080cbeef1a8b\"}":{"__typename":"Education","uuid":"f9cb0cee-84cc-4160-8d50-080cbeef1a8b","school":{"__ref":"School:{\"uuid\":\"3c823eb3-44d9-4706-abf0-1ae81403d6c4\"}"},"startYear":"2016","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"f7273fb6-4f15-4d15-bd8b-a8b88258746c\"}":{"__typename":"Education","uuid":"f7273fb6-4f15-4d15-bd8b-a8b88258746c","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"History and Literature","degree":null},"MentorPublicProfile:{\"uuid\":\"e9520abf-e1d2-4b05-9892-be51e63622cb\"}":{"__typename":"MentorPublicProfile","uuid":"e9520abf-e1d2-4b05-9892-be51e63622cb","displayName":"Gabriela V.","slug":"gabriela-vasquez-1","biography":"\u003cp\u003eHi! I’m Gabi, a senior at Harvard College studying History and Literature with a focus on race, gender, and justice in the Caribbean. Since I was young, I’ve been passionate about law and social justice — and I love helping students turn their curiosity about the world into meaningful, community-driven projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003cbr\u003eBefore Harvard, I was the captain of my high school Mock Trial and Moot Court teams, competing at both the local and national level. Since then, I’ve stayed deeply involved in mentorship and justice work. I’ve interned at the Suffolk County District Attorney’s Office in Boston, where I designed a \u003cem\u003eJuvenile Diversion Initiative\u003c/em\u003e — a program that connects first-time youth offenders with community organizations to promote positive engagement and reduce recidivism.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also collaborated with the DA’s Office to \u003cstrong\u003efound the DA Hayden Advocates of Criminal Justice Fellowship\u003c/strong\u003e, giving high school students paid opportunities to work in the court system. As the Lead Coordinator, I organized educational events with judges, lawyers, and community leaders, and even planned courthouse field trips to help students see justice in action. Each year, I also help organize a \u003cstrong\u003eYouth Juvenile Justice Symposium\u003c/strong\u003e, where students learn about their rights and explore real issues within the justice system.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese experiences taught me how to transform passion into impact — and I love helping others do the same!\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI mentor students interested in:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eSocial justice, law, and community-based projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePublic speaking (especially for Mock Trial or debate)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eResearch and writing (turning big ideas into actionable projects)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCritical thinking, time management, and confidence building\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eWhether you want to start a community initiative, write a compelling research paper, or simply learn how to articulate your passions more clearly, I’ll help you create a plan that feels exciting \u003cem\u003eand\u003c/em\u003e achievable.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat a session with me looks like\u003c/strong\u003e\u003cbr\u003eA typical session might involve brainstorming your passions, outlining a project timeline, and finding creative ways to share your work. I love helping students break down big goals into small, doable steps — while keeping things fun and encouraging. I’m also all about helping you build confidence and find your voice when presenting your ideas!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside of mentorship\u003c/strong\u003e\u003cbr\u003eWhen I’m not studying or mentoring, you’ll probably find me reading historical fiction(my favorite recent read was \u003cem\u003eLast Night at the Telegraph Club\u003c/em\u003e), exploring concerts for bands I've never heard of, or planning my next travel adventure. I love exploring new cultures through food — and I’m always down to swap favorite restaurant recommendations!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re passionate, curious, and ready to bring your ideas to life, I’d love to work with you to make it happen.\u003c/p\u003e","teachingVideoPlaybackId":"EaV458bq16sp01PqCizjGZOKbZ3s7CJCJBfLTz3OreJg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History and Literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0bf745fa-65f8-4c52-bd4e-00a7845ed6e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"c8ce0b6c-8d00-4962-86b8-99e8838e0cdb\"}"},{"__ref":"DeepDives:{\"uuid\":\"cb1d4a01-9dc5-4e88-9225-957056df30f3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/feb4333c-3bf4-4fa3-bd4d-26849a68bc2f/-/pre
