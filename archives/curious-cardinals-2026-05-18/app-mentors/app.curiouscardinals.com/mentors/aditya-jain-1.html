name":"DeepDives","uuid":"6b1a1efa-04d2-4111-975b-538b01d1a753","content":null,"videoPlaybackId":"F9f00smA7WjBldtBWX65eCabIvZpBHL2WfqEa0011TY9Q","question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7f2b6c03-63d1-4572-b70c-704a99c018bf\"}":{"__typename":"DeepDives","uuid":"7f2b6c03-63d1-4572-b70c-704a99c018bf","content":null,"videoPlaybackId":"6HAL012CSrACvBhuqu6ZUCG96wGj8pKD00qgs2cTKJ024Y","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8d7c2603-2378-473f-97e1-05b64d220901\"}":{"__typename":"DeepDives","uuid":"8d7c2603-2378-473f-97e1-05b64d220901","content":null,"videoPlaybackId":"Id01vOYxK5kqz3C1B2qvFRixP5fPmtCuhGVGxWaC01xvQ","question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"91ee3a8e-a44f-464b-9838-855724a1e9de\"}":{"__typename":"School","uuid":"91ee3a8e-a44f-464b-9838-855724a1e9de","name":"The Harker School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95129"},"Education:{\"uuid\":\"3fc935aa-8bcc-41b1-8c5f-97f8d65b118d\"}":{"__typename":"Education","uuid":"3fc935aa-8bcc-41b1-8c5f-97f8d65b118d","school":{"__ref":"School:{\"uuid\":\"91ee3a8e-a44f-464b-9838-855724a1e9de\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}":{"__typename":"School","uuid":"11470c0e-6098-4972-92d0-60616358bd13","name":"California Institute of Technology","city":"Pasadena","type":"COLLEGE","state":"California","country":"United States","zip":"91125"},"Education:{\"uuid\":\"fd8e832a-eff2-4b9c-b944-3ccbf1a99906\"}":{"__typename":"Education","uuid":"fd8e832a-eff2-4b9c-b944-3ccbf1a99906","school":{"__ref":"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical/Aerospace Engineering + B.E.M.","degree":null},"MentorPublicProfile:{\"uuid\":\"7805d9d5-a944-431c-9f6b-fed217ded4bb\"}":{"__typename":"MentorPublicProfile","uuid":"7805d9d5-a944-431c-9f6b-fed217ded4bb","displayName":"Aditya J.","slug":"aditya-jain-1","biography":"\u003cp\u003eYes! That's me flying an actual plane! I love flying. In fact, I love anything that moves ... and moves fast. Whether it be trains, cars, airplanes, or even intangibles like light and electrons—if it's going, you bet I'm studying it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Adi Jain, and as a Bay Area native and now a rising sophomore at Caltech, I've been surrounded by intelligence my entire life. Shaped by the mentorship of scientists, engineers, and thinkers, I've come to value not just acquiring knowledge but also sharing it. My goal is to pay what I've learned forward, building a community where teaching and learning drive discovery and empower future leaders to thrive. More specifically, I want to help create the STEM innovators of tomorrow, enabling those who love not only studying the theory but also getting their hands dirty and seeing the theory come to life. That's why I chose Mechanical Engineering as my major with a minor in Aerospace: the only way to know if an idea works is to build, test, and refine it. At the same time, I'm majoring in Business, Economics, and Management because I believe strong financial and strategic skills amplify technical impact, where great ideas require more than innovation; practical management skills can nurture a myriad of solutions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt's no surprise then that I also love spending my time outside and, in fact, in the sky! As a licensed pilot (earned from a $10,000 scholarship that I used to pursue it), I travel to places that would take hours by car in significantly less time (with a boatload more fun added to it). Additionally, I use my license to volunteer for my local Experimental Aircraft Association chapter, where I offer free 30-minute flights around the Bay Area to members of my community every month. I'm also building a plane with a few other students to gain a hands-on understanding of why a plane is shaped the way it is. We've completed nearly every individual component and are now assembling the aircraft itself.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEnough about the planes and the studies (though yes, I love planes). I am also an athlete at Caltech, serving as the starting catcher for the NCAA DIII Baseball team as well as a Teaching Assistant for the Mechanical Prototyping/Shop class (ME 13/113). Now you might be wondering: Adi, how in the world do you juggle all these commitments? The key is creating a schedule that suits me, one that I've developed through dedication and effort invested in refining it. During high school, I struggled with burnout and anxiety brought on by a mix of health and personal issues, which made it difficult to focus and fully participate in the activities I cared about. I empathize with anyone in a similar situation, and I want to do anything I can to help them get back on track.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the end, I didn't let anxiety define me, and I pursued my academic and personal goals. I have since interned at NASA, where I presented my final paper at an international conference, and at Spirit AeroSystems, where I will spend this summer learning how to perform stress analysis on, you guessed it, a piece of a plane wing that I will build.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm excited to continue pushing myself and contributing meaningfully wherever I land next. Thank you for taking the time to read through my bio!\u003cbr\u003e\u003cbr\u003eCheck out my Linkedin!: linkedin.com/in/adijain06/\u003c/p\u003e","teachingVideoPlaybackId":"eBRNy7tZYIEK00CUt13qjuQ01LtISStOszQykVOryjoFo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b294365d-fc8e-46f7-8904-1953215f4471\"}"},{"__ref":"Favorites:{\"uuid\":\"18d2b156-10d4-4809-a4b6-7918a31ced7b\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"54f4f53a-15bb-420a-9c9d-d77e8ace783d\"}"}],"major":"Mechanical/Aerospace Engineering + B.E.M.","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2e4726c8-381e-4cc8-b08e-48c9fd4803f2\"}"},{"__ref":"DeepDives:{\"uuid\":\"6b1a1efa-04d2-4111-975b-538b01d1a753\"}"},{"__ref":"DeepDives:{\"uuid\":\"7f2b6c03-63d1-4572-b70c-704a99c018bf\"}"},{"__ref":"DeepDives:{\"uuid\":\"8d7c2603-2378-473f-97e1-05b64d220901\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0007e97f-00ce-4a90-939b-d01925bdd924/-/preview/-/format/jpg/","https://ucarecdn.com/f4395290-2539-477c-b6f0-ba038ab73a29/-/preview/-/format/jpg/","https://ucarecdn.com/dc5eb05e-0974-42d5-b44a-5ab3c200a4ec/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3fc935aa-8bcc-41b1-8c5f-97f8d65b118d\"}"},{"__ref":"Education:{\"uuid\":\"fd8e832a-eff2-4b9c-b944-3ccbf1a99906\"}"}],"hiredAt":"2025-07-07T12:06:23.943Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Physics","6-8 Grade Science","Academic Coaching","Executive Function","Computer Science","College Essay Writing"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/1e4a2735-1bb6-4525-bb3b-365dd5531407/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49
