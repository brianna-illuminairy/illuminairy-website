xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1357c587-1c52-4ab1-a816-b5e66cd9f877\"}":{"__typename":"Favorites","uuid":"1357c587-1c52-4ab1-a816-b5e66cd9f877","photoUrl":"https://ucarecdn.com/85a5d781-5cf1-4fe9-b1a6-f4af3d38c116/","title":"One Hundred Years of Solitude by Gabriel García Márquez","type":"BOOK"},"Favorites:{\"uuid\":\"2f49d329-d7a6-44be-8e5d-3198c5996c31\"}":{"__typename":"Favorites","uuid":"2f49d329-d7a6-44be-8e5d-3198c5996c31","photoUrl":"https://ucarecdn.com/a162dd64-ec57-4658-b09b-c6d4fea51dd7/","title":"Wings of Desire, directed by Wim Wenders","type":"MOVIE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"63cae8c8-63c0-4157-bb00-f40306ca528d\"}":{"__typename":"DeepDives","uuid":"63cae8c8-63c0-4157-bb00-f40306ca528d","content":"\u003cp\u003eI want to get my PhD and become a professor!! I think that the craft of teaching is so fascinating and important, and I want to give back to students in the same way that my professors gave back to me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a176a5db-c18f-4619-b455-adb6e47de15c\"}":{"__typename":"DeepDives","uuid":"a176a5db-c18f-4619-b455-adb6e47de15c","content":"\u003cp\u003eFor three years in high school I was a camper at the Putney School Summer Arts program. It was one of the best things ever! I met incredible, like-minded friends, and learned skills I would have never learned elsewhere, like video-editing, film-scoring, acrylic painting, sculpture, songwriting, zine-making, and much more. The program was the perfect counterbalance to my competitive and not always creatively nourishing high school. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"21a2e98b-b335-44c3-bbf7-1e0afafefa7e\"}":{"__typename":"DeepDives","uuid":"21a2e98b-b335-44c3-bbf7-1e0afafefa7e","content":"\u003cp\u003eI was one of the lucky students who graduated high school in 2020 (haha, kidding), and as I finished my senior year behind the zoom screen getting more and more bored, I came up with the idea of asking all my fellow classmates if they'd like me to draw their portrait. I ended up with over 40 portraits, and the project led me to talk to peers I had never gotten to know before. It was simultaneously a wonderful antidote to my boredom, a learning experience, and a way to forge social connection during a very isolating time. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"42f8fea2-2823-443b-879f-9bd3cd720d1e\"}":{"__typename":"DeepDives","uuid":"42f8fea2-2823-443b-879f-9bd3cd720d1e","content":"\u003cp\u003eI began college thinking I would study English, but I kept gravitating toward classes in the German Department, even though I spoke no German! I asked myself what I liked so much about those classes, and realized that they delved much more deeply into ideas about the function of language itself than my English classes did—whereas in English class I was learning more about character and story structure and writing styles, in German classes I was learning about linguistics and translation and philosophy. This made me realize that Comparative Literature was the department that would allow me to explore my interest in language to the fullest—and it also led me to turning my high-school level French into full fluency. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3b17ce76-818b-49d8-a5e9-e78e397a9971\"}":{"__typename":"School","uuid":"3b17ce76-818b-49d8-a5e9-e78e397a9971","name":"Trinity School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10024"},"Education:{\"uuid\":\"feea1dd0-4e13-4ba3-9d20-8f093c36a9c0\"}":{"__typename":"Education","uuid":"feea1dd0-4e13-4ba3-9d20-8f093c36a9c0","school":{"__ref":"School:{\"uuid\":\"3b17ce76-818b-49d8-a5e9-e78e397a9971\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"67bd2761-8d2c-4469-bfd7-b68f345ed87b\"}":{"__typename":"Education","uuid":"67bd2761-8d2c-4469-bfd7-b68f345ed87b","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Comparative Literature","degree":null},"MentorPublicProfile:{\"uuid\":\"74619d28-ac77-4371-be78-c5d909e0491b\"}":{"__typename":"MentorPublicProfile","uuid":"74619d28-ac77-4371-be78-c5d909e0491b","displayName":"Eleanor T.","slug":"eleanor-tapping","biography":"\u003cp\u003eHi! My name is Ellie and I'm a recent graduate from Brown University. I'm super passionate about all things humanities, and my dream is to earn my PhD and become a professor of Comparative Literature (and translate some books on the side!). I began college thinking I would study English, but I soon realized that Comparative Literature would be a better fit as my academic home, since I was interested in the theory and philosophy of language itself. At Brown I was an honors student, and my senior thesis was a partial English translation of Algerian novelist Assia Djebar's \u003cem\u003eVaste est la prison. \u003c/em\u003eI was also chosen to present work at Brown's Translation Conference, and won an UTRA grant to work with a French department professor on research for his upcoming book. I speak fluent French, and spent a semester studying at the Sorbonne in Paris during my undergrad years. I also speak conversational German and am looking to add more languages to my roster! For most of college I worked the front desk of the admissions department, which gave me a front-row seat to the college process. I know how important it is for students to feel supported and seen as they think about life after high school.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm half New Yorker, half Bostonian, and the arts have been a part of my life for as long as I can remember. I love to sing, write songs, and bring my sketchbook to the wonderful museums that my city has to offer! I’m currently looking to join a chorus in NYC, and one of my favorite activities is taking classes at the Art Students League. I’m from a musical family (both of my parents were classical musicians), and I grew up learning to treasure creativity and passion above success for success’s sake. I've worked professionally as a literary translator, a writing/consulting assistant, a curatorial assistant, and a social media manager. I love to travel, spend time with my friends and family, and cook delicious meals! Over the years I have developed time management skills that have served me again and again, and I'm proud to say that I never pulled an all-nighter in college even when the going got tough. Balance is incredibly important to me, and I believe that excellence and success should never come at the cost of mental wellbeing. Learning should be a fun challenge, not a discouraging one. Above all, I can't wait to meet–and learn with–you!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"3011m1XIQumqfN2zBCggld73uJrx02OmgRs5DfkwYdON4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1357c587-1c52-4ab1-a816-b5e66cd9f877\"}"},{"__ref":"Favorites:{\"uuid\":\"2f49d329-d7a6-44be-8e5d-3198c5996c31\"}"}],"causesSupported":[],"major":"Comparative Literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"63cae8c8-63c0-4157-bb00-f40306ca528d\"}"},{"__ref":"DeepDives:{\"uuid\":\"a176a5db-c18f-4619-b455-adb6e47de15c\"}"},{"__ref":"DeepDives:{\"uuid\":\"21a2e98b-b335-44c3-bbf7-1e0afafefa7e\"}"},{"__ref":"DeepDives:{\"uuid\":\"42f8fea2-2823-443b-879f-9bd3cd720d1e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8d3f1253-ecfd-4fe5-a7eb-bf981a43fb52/-/preview/-/format/jpg/","https://ucarecdn.com/56926836-5c85-4432-a221-e3157461eafc/-/preview/-/format/jpg/","https://ucarecdn.com/ea4b6a6a-a73c-4390-98e5-d88e789d1af5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"feea1dd0-4e13-4ba3-9d20-8f093c36a9c0\"}"},{"__ref":"Education:{\"uuid\":\"67bd2761-8d2c-4469-bfd7-b68f345ed87b\"}"}],"hiredAt":"2025-08-25T16:04:10.163Z","topics":["Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","Music","Visual Arts / Graphic Design","History Project","Journalism","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"eleanor-tapping\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"74619d28-ac77-4371-be78-c5d909e0491b\"}"}}},"_sentryTraceData":"e5be443183ac40ef95fdd3edd5930c34-853661e4dce6ac5c-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e5be443183ac40ef95fdd3edd5930c34,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"eleanor-tapping"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
