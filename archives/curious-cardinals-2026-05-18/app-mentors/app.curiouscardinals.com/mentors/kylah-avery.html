xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d94c43c1-bc6e-476b-9bd3-80b5450a5d0c\"}":{"__typename":"Favorites","uuid":"d94c43c1-bc6e-476b-9bd3-80b5450a5d0c","photoUrl":"https://ucarecdn.com/40ecb1da-701c-4de5-95f8-04e061577448/","title":"Star Wars: Episode III – Revenge of the Sith","type":"MOVIE"},"Favorites:{\"uuid\":\"8ae2c00e-b566-46d0-98b0-010eb247e684\"}":{"__typename":"Favorites","uuid":"8ae2c00e-b566-46d0-98b0-010eb247e684","photoUrl":"https://ucarecdn.com/5b823219-6f1d-459f-8d53-e80d61ddccf9/","title":"My Way by Frank Sinatra","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"655777bf-c578-4f0e-9438-1ce625746fe6\"}":{"__typename":"DeepDives","uuid":"655777bf-c578-4f0e-9438-1ce625746fe6","content":"\u003cp\u003eI would tell myself to dance to the beat of your own drum! This is everyone's first time living, including yours, so live your life how you see fit and freely enjoy the things that make you happy. You can only control what you do and how you are; use that free will to make your life a joy to live each and every day!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"ee9d0930-8abd-4392-879b-e2ef55d247a0\"}":{"__typename":"DeepDives","uuid":"ee9d0930-8abd-4392-879b-e2ef55d247a0","content":"\u003cp\u003eMy dream job is to be a pediatrician and help under-privileged children and their families at no expense of their own. Every child deserves and equal fighting chance at making their lives what they want and I want to help provide an even playing field for all. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"35ac0a88-5ad6-4a22-af26-6b214e4120de\"}":{"__typename":"DeepDives","uuid":"35ac0a88-5ad6-4a22-af26-6b214e4120de","content":"\u003cp\u003eMy summer time was pretty evenly split between working long days at a country club, babysitting my little brother, and soaking up the sun on the beaches of Long Island with my best friends\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"6d122bf9-5418-495a-a6ab-0ecbed1c7d20\"}":{"__typename":"DeepDives","uuid":"6d122bf9-5418-495a-a6ab-0ecbed1c7d20","content":"\u003cp\u003eI crocheted an entire blanket for my dad for Christmas! It took me 10 months and 117 granny squares, and it turned out beautiful\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"7000632b-da2e-4a5c-9701-ca89cd0620bc\"}":{"__typename":"School","uuid":"7000632b-da2e-4a5c-9701-ca89cd0620bc","name":"Westhampton Beach Senior High School","city":"Westhampton Beach","type":"HIGH","state":"New York","country":"United States","zip":"11978"},"Education:{\"uuid\":\"1fbd0f76-b3bc-4199-b932-a25acf5f6302\"}":{"__typename":"Education","uuid":"1fbd0f76-b3bc-4199-b932-a25acf5f6302","school":{"__ref":"School:{\"uuid\":\"7000632b-da2e-4a5c-9701-ca89cd0620bc\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"ce45ba47-a1c9-43e6-ba89-cbc24c52efc6\"}":{"__typename":"Education","uuid":"ce45ba47-a1c9-43e6-ba89-cbc24c52efc6","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"001a973e-9829-4b66-a98d-e2171bf62735\"}":{"__typename":"MentorPublicProfile","uuid":"001a973e-9829-4b66-a98d-e2171bf62735","displayName":"Kylah A.","slug":"kylah-avery","biography":"\u003cp\u003eI am a third-year premedical student at Northwestern University studying Biological Sciences. I am from the East Coast, specifically Pennsylvania, Maryland, and New York. I am a vegetarian and have been going strong for 7 years and counting! My favorite foods include cheese pizza, NY deli egg sandwiches, rice and beans, and broccoli. I currently work with kids teaching them gymnastics, which I enjoy a lot. I also spend time with ages on the other end of the spectrum by volunteering weekly with a hospice. My goal is to one day become a pediatrician (the kid doctor)! In my free time, I like to craft, engage in outdoor activities, and build Lego sets. My favorite craft is crochet, but I enjoy all arts \u0026amp; crafts as they let me express myself freely and creatively while also working towards a tangible goal. Some of my favorite outdoor activities include walking/running, hiking, and swimming in the lake on a nice day. One fun fact about me is that I am a huge Star Wars fan! Ahsoka is, hands down, my favorite character (and possibly my spirit animal if that's allowed LOL). On top of Star Wars, I also enjoy the Marvel franchise, animated TV shows, anything with Dwayne \"The Rock\" Johnson, thriller/ horror movies, and the occasional rom-com. This summer, I will be spending my time on the Chicago Adventure Therapy team, a non-profit that engages in outdoor activities with under-represented identities, teaching the participants essential life skills. I am always open-minded and excited to learn something new, no matter the source. I am most passionate about engaging with kids on a meaningful level and providing them with a foundation for growth by both teaching them the \"lesson\" \u003cu\u003eand\u003c/u\u003e skills to be able to work through problems/towards goals on their own in the future. I value effort, engagement, and improvement over the final product. This allows for children to develop and hone skills vital for life such as critical thinking, problem solving, time management, confidence, accepting criticism, responsibility, and communication. I am happy to work with any student who wants to learn!\u003c/p\u003e","teachingVideoPlaybackId":"xVgT5IwLEtnDDZZSUT00FH4Ip6miLjtj53L02x6AAChpE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d94c43c1-bc6e-476b-9bd3-80b5450a5d0c\"}"},{"__ref":"Favorites:{\"uuid\":\"8ae2c00e-b566-46d0-98b0-010eb247e684\"}"}],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"655777bf-c578-4f0e-9438-1ce625746fe6\"}"},{"__ref":"DeepDives:{\"uuid\":\"ee9d0930-8abd-4392-879b-e2ef55d247a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"35ac0a88-5ad6-4a22-af26-6b214e4120de\"}"},{"__ref":"DeepDives:{\"uuid\":\"6d122bf9-5418-495a-a6ab-0ecbed1c7d20\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bbd110f4-fe08-42b9-81a8-4d2ebd897b17/-/preview/-/format/jpg/","https://ucarecdn.com/8fb41d78-7291-4df0-aca3-c379c0b5f83a/-/preview/-/format/jpg/","https://ucarecdn.com/
