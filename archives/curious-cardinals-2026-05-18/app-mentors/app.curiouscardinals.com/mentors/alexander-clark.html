xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cf870051-e158-41ce-8f8b-87ce8cec3a23\"}":{"__typename":"Favorites","uuid":"cf870051-e158-41ce-8f8b-87ce8cec3a23","photoUrl":"https://ucarecdn.com/2261423f-a83a-410a-bddb-554eddefd59c/","title":"The World of Yesterday by Stefan Zwieg","type":"BOOK"},"Favorites:{\"uuid\":\"019728e2-0f94-4601-b735-a27849c19fd7\"}":{"__typename":"Favorites","uuid":"019728e2-0f94-4601-b735-a27849c19fd7","photoUrl":"https://ucarecdn.com/a50d6535-fa30-4bdd-97fb-b772a6b25d0f/","title":"Edinburgh, Scotland","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"575f2699-4f90-4c95-8b3b-cca4889cdaae\"}":{"__typename":"DeepDives","uuid":"575f2699-4f90-4c95-8b3b-cca4889cdaae","content":"\u003cp\u003eAll throughout my educational experience in K-12 I was blessed to have some amazing mentors of my own. My parents always encouraged my educational endeavors, but frequently did not have the time to invest in guiding my curiosity or helping me explore things I was interested. Filling those gaps were my grandparents, teachers, tutors, and friends! Mentorship is the \"last mile\" of education, but it's the part that can be the most impactful and critical for the overall educational experience. At least, it certainly was for me! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b9e98fa6-1a69-4801-aabb-1555782851dd\"}":{"__typename":"DeepDives","uuid":"b9e98fa6-1a69-4801-aabb-1555782851dd","content":"\u003cp\u003eI think that everything I do can be considered some form or another of storytelling. When I research something in history or science, I want to distill it into a narrative that I can share. When I make visual art, be it a photo shoot, a painting, or a short film, I need a story to tell going into it. And then there's writing just by itself, which I've always been constantly itching to do! All of this influenced my decision to come to Emerson college to study creative writing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e68b3b4d-6f1c-4288-bb6f-d8d7976edd2d\"}":{"__typename":"DeepDives","uuid":"e68b3b4d-6f1c-4288-bb6f-d8d7976edd2d","content":"\u003cp\u003eIn middle and high school, especially once I started getting close to graduation and became worried about college applications, I stressed a lot about my schoolwork. Consequently, I devoted less time to extracurricular projects and activities. I read fewer books for pleasure, I pursued fewer internet rabbit holes, I made fewer things, etc. However, I found that the less time I spent pursuing my own interests, the less motivated I was to work hard in school. I've since learned that education is not just the means to the end of a degree or a job, especially if your primary interest lies somewhere in the humanities. What are essays and books and art good for if not enjoyment? Grades are important, but they are not the essence of education. That's what I would try to share with my middle and high school self.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"8e3f9546-163b-49d1-82c8-f322425ceaf6\"}":{"__typename":"DeepDives","uuid":"8e3f9546-163b-49d1-82c8-f322425ceaf6","content":"\u003cp\u003eWorking in the humanities, fame and money are not very applicable motivators. My greatest motivator is my curiosity. My hope is to be a life-long learner, and the process of discovering new and exciting things about the world around me encourages me every day to keep going! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"b1102f4d-c758-4f3f-a098-116a9a52bb65\"}":{"__typename":"School","uuid":"b1102f4d-c758-4f3f-a098-116a9a52bb65","name":"Santa Monica High School","city":"Santa Monica","type":"HIGH","state":"California","country":"United States","zip":"90405"},"Education:{\"uuid\":\"d4059c88-ce9a-4ccb-b134-17e81d96316e\"}":{"__typename":"Education","uuid":"d4059c88-ce9a-4ccb-b134-17e81d96316e","school":{"__ref":"School:{\"uuid\":\"b1102f4d-c758-4f3f-a098-116a9a52bb65\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"44b546c8-5dbb-43b9-bdc9-80817ef7eed3\"}":{"__typename":"School","uuid":"44b546c8-5dbb-43b9-bdc9-80817ef7eed3","name":"Emerson College","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02116"},"Education:{\"uuid\":\"9e9aacb0-913b-4435-8dbf-58842c8279d8\"}":{"__typename":"Education","uuid":"9e9aacb0-913b-4435-8dbf-58842c8279d8","school":{"__ref":"School:{\"uuid\":\"44b546c8-5dbb-43b9-bdc9-80817ef7eed3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Creative Writing","degree":null},"MentorPublicProfile:{\"uuid\":\"ce19b726-c2dd-447d-8f52-620286c0dd98\"}":{"__typename":"MentorPublicProfile","uuid":"ce19b726-c2dd-447d-8f52-620286c0dd98","displayName":"Alexander C.","slug":"alexander-clark","biography":"\u003cp\u003eSince I was very little I have lived and breathed projects. In elementary school I was the editor-in-chief of my own newspaper, and I was constantly writing fiction stories. In middle school I ran Minecraft servers, designed card games, and collaborated with friends to write a mini-encyclopedia! In high school, I learned the basics of web-design and 2D animation, I made an online video series about history and other subjects I was passionate about, and I started a political podcast with some friends to try and better understand what was going on in the world around me! All of this is to say that if you've got a project in mind, I'm here to help!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up in Los Angeles, I spent a lot of my free time outdoors with friends. Swimming in the ocean, hiking in the canyons, and spending weekends in the mountains! I've spent many summer afternoons sitting on the beach or on the shores of Big Bear Lake reading. I've always been a huge reader. It's impossible to pick a favorite book/author, but mostly I read literary fiction, classic literature, science fiction, and fantasy. In high school I got to work at an independent bookstore, which helped me get a better appreciation for the role that books play in community-building! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love tinkering with technology, and have been building computers since middle school. I enjoy playing video games, and occasionally designing my own! My current daily-driver is a Framework 16-inch running Ubuntu Linux. I like playing Magic: The Gathering, Sea of Thieves, Animal Crossing, and Zelda. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a kid I played the violin for seven years, and continue to be really passionate about music. I still listen to a lot of classical music, along with classic rock, indie rock, alternative, and much more. In high school I worked in the theater department as part of the tech crew, and later a stage manager. My crowning theater achievement was being the stage manager for my high school's production of \u003cem\u003ePhantom of the Opera\u003c/em\u003e. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school I took four years of Latin, which helped me gain an appreciation for ancient history and culture. I fell head-over-heels in love with literature and storytelling, which is why I'm currently studying creative writing at Emerson College! At the moment, on top of managing all of the classes I'm taking, I'm also working towards writing my first novel! When it comes to writing, I'm a very analog person. I draft by hand, and then transcribe what I write onto paper using my grandfather's old Olympia typewriter before moving onto a Google Doc draft. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm also very analog when it comes to other artistic things. I took several art classes in high school, and became interested in film photography, as well as watercolor painting.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall I'm a very creative and curious person, and I love to share my passion for learning with others!\u003c/p\u003e","teachingVideoPlaybackId":"ajEPhSQKPZmluxIAGbF00plqP3JabTy75A3FN7PRtDdI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"cf870051-e158-41ce-8f8b-87ce8cec3a23\"}"},{"__ref":"Favorites:{\"uuid\":\"019728e2-0f94-4601-b735-a27849c19fd7\"}"}],"causesSupported":[],"major":"Creative Writing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"575f2699-4f90-4c95-8b3b-cca4889cdaae\"}"},{"__ref":"DeepDives:{\"uuid\":\"b9e98fa6-1a69-4801-aabb-1555782851dd\"}"},{"__ref":"DeepDives:{\"uuid\":\"e68b3b4d-6f1c-4288-bb6f-d8d7976edd2d\"}"},{"__ref":"DeepDives:{\"uuid\":\"8e3f9546-163b-49d1-82c8-f322425ceaf6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c90c7347-1cd9-457e-800a-22b7cdfe2f71/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d4059c88-ce9a-4ccb-b134-17e81d96316e\"}"},{"__ref":"Education:{\"uuid\":\"9e9aacb0-913b-4435-8dbf-58842c8279d8\"}"}],"hiredAt":"2025-02-03T20:43:08.279Z","topics":["Writing","Latin","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","Visual Arts / Graphic Design","History Project","Video / Photography","Business / Entrepreneurship","Finance / Investing","Web Design","Game Design","Law / Government / Policy","Sustainability","Journalism"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexander-clark\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ce19b726-c2dd-447d-8f52-620286c0dd98\"}"}}},"_sentryTraceData":"9d2c8ecb241641a288ef1ce3e85f779b-9c3e583e8da1dc4c-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9d2c8ecb241641a288ef1ce3e85f779b,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alexander-clark"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer'
