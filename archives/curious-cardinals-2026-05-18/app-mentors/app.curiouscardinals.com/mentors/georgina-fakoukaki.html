xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2b3e60b6-2fc7-4ab5-aa55-359fd72da8f6\"}":{"__typename":"DeepDives","uuid":"2b3e60b6-2fc7-4ab5-aa55-359fd72da8f6","content":"\u003cp\u003eIt creates a space for the mentor and the mentee to learn from each other and for knowledge to be passed down in a way that allows for self-agency and co-creation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"e4a2560a-edab-4268-acc8-3cb6037bc7b3\"}":{"__typename":"DeepDives","uuid":"e4a2560a-edab-4268-acc8-3cb6037bc7b3","content":"\u003cp\u003eoverly enthusiastic, self-driven, obsessed with extracurricular activities, doing internships all the time, lead of the school dance team\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"11a45525-56c1-4472-b8f8-c8592db855a6\"}":{"__typename":"DeepDives","uuid":"11a45525-56c1-4472-b8f8-c8592db855a6","content":"\u003cp\u003eMy major allowed me to explore and delve into the intersectionality of mediums of communication (ex. social media) and our society and human experience as a whole (politics, consumer psychology e.t.c.)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"484d298b-bfec-4e73-b2f0-2615deb66b64\"}":{"__typename":"DeepDives","uuid":"484d298b-bfec-4e73-b2f0-2615deb66b64","content":"\u003cp\u003eTo travel to as many places as I can, learn by observing how other cultures oeprate, adopt new practices of healing and lifestyle, and speak 6 languages.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"4734d4d0-dea3-4944-8b26-a28cfc229292\"}":{"__typename":"Education","uuid":"4734d4d0-dea3-4944-8b26-a28cfc229292","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2024","major":"Media Studies","degree":null},"School:{\"uuid\":\"bcdcd76e-87ee-4743-a5ae-2a016d5a7815\"}":{"__typename":"School","uuid":"bcdcd76e-87ee-4743-a5ae-2a016d5a7815","name":"Design Tech High School","city":"Redwood City","type":"HIGH","state":"California","country":"United States","zip":"94065"},"Education:{\"uuid\":\"2988f371-ac0a-4f9a-ba0d-6fef5c18ad43\"}":{"__typename":"Education","uuid":"2988f371-ac0a-4f9a-ba0d-6fef5c18ad43","school":{"__ref":"School:{\"uuid\":\"bcdcd76e-87ee-4743-a5ae-2a016d5a7815\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"d1c5d703-27fc-4893-8980-d6dde8168c63\"}":{"__typename":"MentorPublicProfile","uuid":"d1c5d703-27fc-4893-8980-d6dde8168c63","displayName":"Georgina F.","slug":"georgina-fakoukaki","biography":"\u003cp\u003eHi Curious Cardinals!!!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eM name is Georgina and I am a recent Cal graduate with a major in Media Studies and a certificate in Entrepreneurship \u0026amp; Technology. My background leans heavily on leadership, project management, and mentorship roles around educational institutions, non-profits, startups, and businesses. As a 9-year practitioner of Design Thinking, I approach life with an extra dose of empathy, creative confidence, bias towards action and the mentality that the sky is the limit. As per my teaching philosophy, I always create a space where students can feel safe and confident to embrace failure and turn their setbacks into learning lessons.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA bit of my background and life journey: After attending an unconventional high school that was centered around design and creative problem-solving, I embarked on a gap year endeavor to replicate the same educational model in Puerto Rico. As the co-founder and lead volunteer, I dedicated myself in the advancement and adoption of design thinking practices in education. I then started pursuing my studies at UC Berkeley with a major in Media Studies. To me, this degree was the most relevant to our current day and age of political hostilities, social media echo chambers, and e-commerce consumerism culture. I wanted to understand all this on a deeper level to start making deliberate, quality-informed choices about my life and career pursuits. I also got certified in entrepreneurship \u0026amp; Technology from the SCET School of Engineering by designing two startups focused on social impact and by participating in the European Innovation Academy, Europe’s largest startup accelerator.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePassions: \u003c/p\u003e\u003cp\u003e// turning ideas into reality, scaling a business, social-impact initiatives, media-related passion projects // yoga and breathing, basketball, mobility and strength // piano/keyboard, percussion and music discovery. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eHow I spend my free time: attend dance workshops and socials, do team sports, read books, go to concerts, do yoga + pilates, go to the beach, take pictures, go on road trips, cook, learn a new language and discover new music.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"9nMSlUMonnhHf2BxXkl3H02vKfwfg01R5j01e6SNq6oOLM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Media Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2b3e60b6-2fc7-4ab5-aa55-359fd72da8f6\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4a2560a-edab-4268-acc8-3cb6037bc7b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"11a45525-56c1-4472-b8f8-c8592db855a6\"}"},{"__ref":"DeepDives:{\"uuid\":\"484d298b-bfec-4e73-b2f0-2615deb66b64\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/59c1bfa8-a3a6-496d-9c75-f4320599964b/-/preview/-/format/jpg/","https://ucarecdn.com/c17ac234-7ad6-4712-826a-20541d982c35/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4734d4d0-dea3-4944-8b26-a28cfc229292\"}"},{"__ref":"Education:{\"uuid\":\"2988f371-ac0a-4f9a-ba0d-6fef5c18ad43\"}"}],"hiredAt":"2024-10-22T09:18:49.009Z","topics":["Business / Entrepreneurship","Visual Arts / Graphic Design","Film / Theater","Cooking","Video / Photography","Public Speaking"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"
