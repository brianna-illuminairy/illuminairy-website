js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"53ecaa33-0df2-480b-ac4e-bb6d0f6d9f8e\"}":{"__typename":"DeepDives","uuid":"53ecaa33-0df2-480b-ac4e-bb6d0f6d9f8e","content":"\u003cp\u003eMentorship matters to me because I know firsthand how much it can change someone’s path. Growing up, I often thought I had to figure everything out on my own, and I didn’t realize how much easier things become when you have someone who believes in you, encourages your ideas, and shows you what’s possible.\u003c/p\u003e\u003cp\u003eI also care about mentorship because I’ve learned that age doesn’t determine impact. When I started my own projects, especially my dashboard research, I realized that young people can create real change — but they’re more likely to take that first step when someone is there to guide them. Mentorship gives students confidence, direction, and the feeling that their ideas matter.\u003c/p\u003e\u003cp\u003eFor me, mentoring younger students is a way to help them avoid the doubt I once had. It’s a chance to show them that they don’t need to wait to make a difference, and that with the right support, they can build something meaningful right now. Mentorship isn’t just about teaching; it’s about helping someone see their own potential a little sooner.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6b755068-af11-4dbe-914e-0d7fbe483269\"}":{"__typename":"DeepDives","uuid":"6b755068-af11-4dbe-914e-0d7fbe483269","content":"\u003cp\u003eIf I could give my younger self advice, I’d remind myself that you don’t need to wait to be older to make a difference. I used to think real change only came from adults, but I wish I had realized sooner that kids and teenagers can create meaningful impact too. Your ideas matter, your voice matters, and you’re never “too young” to start something important. I would tell myself to trust my own curiosity, take initiative earlier, and believe that small steps at any age can lead to real change.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b7e596bc-4f88-4337-bba2-8d09540301f3\"}":{"__typename":"DeepDives","uuid":"b7e596bc-4f88-4337-bba2-8d09540301f3","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to help as many people as I can and make the world a better place for them. Whether it’s through technology, public policy, mentoring, or everyday interactions, I want my work to create real, positive change. I also hope to make a big enough impact on someone that they feel inspired to pass it forward—sharing the guidance, confidence, or support they received with someone else. Creating that kind of chain reaction matters a lot to me.\u003c/p\u003e\u003cp\u003eOn a more personal level, I also hope to travel more and experience different cultures. I want to see the world, learn from people with different backgrounds, and understand the many ways communities live and solve problems.\u003c/p\u003e\u003cp\u003eOverall, I hope my life combines impact, connection, and curiosity—helping others while continuing to grow and learn myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5452dc5c-d929-4872-9d64-b3414c97f672\"}":{"__typename":"DeepDives","uuid":"5452dc5c-d929-4872-9d64-b3414c97f672","content":"\u003cp\u003eI chose my major because it brings together the two things I care about most: solving real problems with technology and improving the systems that shape people’s lives.\u003c/p\u003e\u003cp\u003eComputer Science gives me the tools to build, design, and analyze technology, while Public Policy helps me understand how decisions are made, how communities function, and how meaningful change actually happens. Working on public-health dashboards showed me how powerful the combination of tech + policy can be. It proved that good design and clear data can directly help people, influence decisions, and improve outcomes.\u003c/p\u003e\u003cp\u003eI wanted a major that wasn’t just theoretical but could be applied to real issues—healthcare, communication, accessibility, equity—and this intersection allows me to do exactly that. It lets me think creatively, technically, and socially all at once.\u003c/p\u003e\u003cp\u003eOverall, I chose Computer Science and Public Policy because I want to build tools that matter, understand the systems they operate in, and use both skill sets to make a positive impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"d60b71e1-936f-41e3-b35a-55bfb533485e\"}":{"__typename":"School","uuid":"d60b71e1-936f-41e3-b35a-55bfb533485e","name":"Bullis School","city":"Potomac","type":"HIGH","state":"Maryland","country":"United States","zip":"20854"},"Education:{\"uuid\":\"3c075866-e0a2-49a3-8fd7-030ddbe6fb94\"}":{"__typename":"Education","uuid":"3c075866-e0a2-49a3-8fd7-030ddbe6fb94","school":{"__ref":"School:{\"uuid\":\"d60b71e1-936f-41e3-b35a-55bfb533485e\"}"},"startYear":"2022","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"19688e0e-d1e6-4fb9-b01e-0d7c30f604df\"}":{"__typename":"Education","uuid":"19688e0e-d1e6-4fb9-b01e-0d7c30f604df","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Computer Science/Public Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"58361cea-9a4f-4b8e-bd7d-acc6998191d4\"}":{"__typename":"MentorPublicProfile","uuid":"58361cea-9a4f-4b8e-bd7d-acc6998191d4","displayName":"Melina M.","slug":"melina-malkani-1","biography":"\u003cp\u003eHi! I’m Melina Malkani, a freshman at Duke University studying Computer Science and Public Policy. I’m really interested in how technology can make information easier to understand and how good design can help people make better decisions, especially in public health.\u003c/p\u003e\u003cp\u003eBefore coming to Duke, I worked on a passion project that eventually turned into two published research papers. My first project focused on COVID-19 dashboards and how to redesign them so people could more easily understand daily trends, risks, and community data. I studied different dashboards, analyzed what worked and what didn’t, and created recommendations that focused on clarity, accessibility, and user-friendly visuals.\u003c/p\u003e\u003cp\u003eLater, I expanded this work into a second publication that looked at healthcare dashboards that use AI and predictive analytics. In that project, I identified which design elements matter most when people are trying to interpret complex information—like risk scores or future projections. Both projects taught me how to take a problem, research it deeply, and create solutions that are useful beyond the classroom. This work is one of the reasons I became interested in studying both computer science and public policy, because I enjoy connecting technical tools with real-world needs.\u003c/p\u003e\u003cp\u003eI also enjoy tutoring and mentoring younger students. I’ve tutored kids and teens in a wide variety of subjects, including writing, research, and basic computer science. I try to explain things in a simple, direct way, and I really enjoy helping students build confidence, stay organized, and understand material that once felt overwhelming. Supporting younger students is something I genuinely love, and I always aim to create a positive, encouraging environment.\u003c/p\u003e\u003cp\u003eOutside of academics, I like to stay active and spend time with people I care about. I’ve played tennis for years, and in high school I was also the lacrosse goalie, which taught me a lot about focus and teamwork. In my free time, I love hanging out with friends, exploring new places, and trying new restaurants.\u003c/p\u003e\u003cp\u003eOverall, I’m someone who enjoys learning, building meaningful projects, and helping others grow. I’m excited to continue developing my skills in technology, research, and policy while supporting younger students along the way.\u003c/p\u003e","teachingVideoPlaybackId":"TL02PcwBSlilRt9KmU2feNkMn9MjPogxUdvvS1MDnmJk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science/Public Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"53ecaa33-0df2-480b-ac4e-bb6d0f6d9f8e\"}"},{"__ref":"DeepDives:{\"uuid\":\"6b755068-af11-4dbe-914e-0d7fbe483269\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7e596bc-4f88-4337-bba2-8d09540301f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"5452dc5c-d929-4872-9d64-b3414c97f672\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4af4a8d7-9384-42f4-91fa-4afb63c9e792/-/preview/-/format/jpg/","https://ucarecdn.com/0289a204-fbcf-4b58-91ea-aba3df014bd9/-/preview/-/format/jpg/","https://ucarecdn.com/78def580-275d-4a45-af41-a2e39097145d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3c075866-e0a2-49a3-8fd7-030ddbe6fb94\"}"},{"__ref":"Education:{\"uuid\":\"19688e0e-d1e6-4fb9-b01e-0d7c30f604df\"}"}],"hiredAt":"2025-12-23T09:46:26.316Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","Algebra II","Calculus","Statistics","Precalculus / Trigonometry","6-8 Grade Science","Biology","Spanish","History","Economics","Finance / Investing","Web Design","STEM Project","Machine Learning / AI","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"melina-malkani-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"58361cea-9a4f-4b8e-bd7d-acc6998191d4\"}"}}},"_sentryTraceData":"b48ad972dbda42e19d4a5b2801b17ae0-b4bc76af06c2e56d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b48ad972dbda42e19d4a5b2801b17ae0,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"melina-malkani-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});va
