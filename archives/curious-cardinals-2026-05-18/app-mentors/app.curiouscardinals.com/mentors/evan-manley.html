xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"0152e699-10d9-4c96-a571-e0275850cb3a\"}":{"__typename":"DeepDives","uuid":"0152e699-10d9-4c96-a571-e0275850cb3a","content":"\u003cp\u003eI would love to one day be a lead biomechanics researcher for a running footwear company. As a runner, I am fascinated by different running styles and the long-term impact on your joints and bones by running. Creating products that can be on the cutting edge of minimizing this risk, while also researching something I love to do, would be an incredible experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"7221f7bc-0ef6-43dc-910a-85193eb094a3\"}":{"__typename":"DeepDives","uuid":"7221f7bc-0ef6-43dc-910a-85193eb094a3","content":"\u003cp\u003eGrowing up, I was surrounded by teachers everywhere. My mom, aunts, grandparents, and most family friends all taught at public elementary and middle schools in my area. As such, I was exposed to the passion of learning, as well as different styles of learning, from a very young age. Now, I look back appreciating that time as it has given me a great perspective on teaching and how to suit different learning styles.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"44477658-7649-4846-b97d-8ee699c38f49\"}":{"__typename":"DeepDives","uuid":"44477658-7649-4846-b97d-8ee699c38f49","content":"\u003cp\u003eI first learned about biomedical engineering when I broke my femur in high school and had two screws implanted in my knee! In my recovery, I was fascinated by how we could use materials to fix problems within the human body. After some research, I discovered that there were medical devices much more complex than screws, and I grew more and more passionate about being a creator of such devices. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"6f059076-bfaf-4bd5-9a7b-e5cb5322f8bc\"}":{"__typename":"DeepDives","uuid":"6f059076-bfaf-4bd5-9a7b-e5cb5322f8bc","content":"\u003cp\u003eI know what it's like to be completely lost when learning a subject, or to feel like the way you're being taught just doesn't match the way you learn best. I enjoy connecting with students who are feeling like that, and exploring different ways to teach concepts in the way that makes the most sense to them. Being able to connect to mentees as people first, then as students allows for a rewarding experience on both their end and mine. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"42f7a024-321a-4569-afb2-529b16b3adb6\"}":{"__typename":"School","uuid":"42f7a024-321a-4569-afb2-529b16b3adb6","name":"Bella Vista High School","city":"Fair Oaks","type":"HIGH","state":"California","country":"United States","zip":"95628"},"Education:{\"uuid\":\"d95878e8-22b1-4e96-9a3a-b7c42c1cc541\"}":{"__typename":"Education","uuid":"d95878e8-22b1-4e96-9a3a-b7c42c1cc541","school":{"__ref":"School:{\"uuid\":\"42f7a024-321a-4569-afb2-529b16b3adb6\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c546c509-23ac-4ffa-809a-84c0c7602ba1\"}":{"__typename":"School","uuid":"c546c509-23ac-4ffa-809a-84c0c7602ba1","name":"Cal Poly San Luis Obispo","city":"San Luis Obispo","type":"COLLEGE","state":"California","country":"United States","zip":"93405"},"Education:{\"uuid\":\"ebf16797-6acf-4a51-a732-5eb84df5002b\"}":{"__typename":"Education","uuid":"ebf16797-6acf-4a51-a732-5eb84df5002b","school":{"__ref":"School:{\"uuid\":\"c546c509-23ac-4ffa-809a-84c0c7602ba1\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"536fcc1f-f858-4f16-b6c5-c3d5544091b2\"}":{"__typename":"MentorPublicProfile","uuid":"536fcc1f-f858-4f16-b6c5-c3d5544091b2","displayName":"Evan M.","slug":"evan-manley","biography":"\u003cp\u003eHi! I'm Evan, a student at Cal Poly San Luis Obispo pursuing a MS in biomedical engineering.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a student, I'm enthralled by the way that we can use math, physics, anatomy, and engineering to solve instrumental problems within the human body. Having participated in multiple medical device design projects from ringing in the ears prevention to ventilation for infants, I love applying rigid engineering concepts to the constantly changing and complex human body in a way that can improve countless peoples' lives. Last summer, after shadowing at a local hospital, I led a team in creating a prototype for preventing blood clots in hospital patients, which was a rewarding and eye-opening experience.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLiving in sunny San Luis Obispo, I love to take advantage of the beach and nature around me. I'm an avid runner (training for my first marathon in a few months!) and am picking up surfing throughout these last few years. I'm a big sports fan, having played ice hockey throughout my childhood and still enjoying the game today. \u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","teachingVideoPlaybackId":"IdPFYNmicr00KVDr18N01xnLX32r87CKkLQMDRp8lB4xs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0152e699-10d9-4c96-a571-e0275850cb3a\"}"},{"__ref":"DeepDives:{\"uuid\":\"7221f7bc-0ef6-43dc-910a-85193eb094a3\"}"},{"__ref":"DeepDives:{\"uuid\":\"44477658-7649-4846-b97d-8ee699c38f49\"}"},{"__ref":"DeepDives:{\"uuid\":\"6f059076-bfaf-4bd5-9a7b-e5cb5322f8bc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1108aaa0-76e2-43f1-a607-7a16e7f20c2f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"d95878e8-22b1-4e96-9a3a-b7c42c1cc541\"}"},{"__ref":"Education:{\"uuid\":\"ebf16797-6acf-4a51-a732-5eb84df5002b\"}"}],"hiredAt":"2024-02-07T00:32:45.623Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","College Essay Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"evan-manley\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"536fcc1f-f858-4f16-b6c5-c3d5544091b2\"}"}}},"_sentryTraceData":"4acdf4146df3412e8c958427e8add9c1-b24417b99f3dca2e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4acdf4146df3412e8c958427e8add9c1,sentry-sample_
