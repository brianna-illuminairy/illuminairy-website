xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"475fbecd-36ef-4669-9b34-05e63d1973cb\"}":{"__typename":"CausesSupported","uuid":"475fbecd-36ef-4669-9b34-05e63d1973cb","name":"Special Olympics","description":"\u003cp\u003eVolunteer with Special Olympics; passionate about inclusion and accessibility.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5e2cfa36-0576-4c94-a9f9-26eaad472030\"}":{"__typename":"DeepDives","uuid":"5e2cfa36-0576-4c94-a9f9-26eaad472030","content":"\u003cp\u003eI grew up in Venezuela and saw firsthand the gaps in healthcare access, which made me pretty certain early on that I wanted to do something in that space. Like many people who loved science and watched too much \u003cem\u003eGrey’s Anatomy\u003c/em\u003e (still my favorite show), I thought med school was the obvious path. But the more I learned about what that route actually looked like, the more I realized it might not be the best fit for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, I started exploring design and fell in love with how creative problem-solving could be used to tackle real, human challenges. I realized I could still work on meaningful solutions in healthcare, but from a different angle. That’s how I landed in mechanical engineering, with a focus on biology  and global health. It’s the perfect mix of technical rigor, creativity, and impact—and it’s kept me excited about what I do every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"bcca7d21-ee0d-4efb-9fef-57cb83bf07a1\"}":{"__typename":"DeepDives","uuid":"bcca7d21-ee0d-4efb-9fef-57cb83bf07a1","content":"\u003cp\u003eI’d tell my high school self that everything \u003cem\u003eactually\u003c/em\u003e does work out. I didn’t go to the fanciest or most well-known high school, and I remember feeling like I had to prove myself twice as hard just to keep up. I was constantly stressed that no matter how hard I worked, it wouldn’t be enough, that I’d fall short or get stuck. But looking back, it’s wild how much things ended up falling into place. All that effort did pay off, and it taught me how to advocate for myself, stay grounded, and be proud of how far I’ve come. I’d tell younger me to keep going, trust the process a little more, and know that just because your path looks different doesn’t mean it’s any less valid. You’re doing just fine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"8b69ff9b-ebbc-419d-a5b7-75ade8580c11\"}":{"__typename":"DeepDives","uuid":"8b69ff9b-ebbc-419d-a5b7-75ade8580c11","content":"\u003cp\u003eI’ve really loved being a teaching assistant and mentoring in the past, it’s one of the most rewarding parts of my academic experience. I genuinely enjoy helping others get excited about learning and figure out what they’re passionate about. I’ve been lucky to have some amazing mentors at Stanford who have believed in me, challenged me, and helped me grow in ways I didn’t expect. I’d love to be that kind of support for my students, someone who shows up, encourages curiosity, and helps them realize what they’re capable of.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c2fdd8a5-0dcc-44f6-a1ea-b6f21494b4bb\"}":{"__typename":"DeepDives","uuid":"c2fdd8a5-0dcc-44f6-a1ea-b6f21494b4bb","content":"\u003cp\u003eOne passion project I’m currently working on is a customizable wheelchair solution that makes the evaluation and prescription process more accessible, especially for kids with disabilities. The project started through a class at Stanford, but it’s grown into something bigger, I’ve been working with vendors, therapists, and patients to understand the challenges in the current system and design a solution that better meets users’ needs. It’s been an amazing mix of engineering, healthcare, and human-centered design, and it’s shown me how impactful thoughtful, inclusive design can be when you involve the right voices from the start.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"7c8ab41c-edb1-4091-b6f1-b2f1e04efe68\"}":{"__typename":"School","uuid":"7c8ab41c-edb1-4091-b6f1-b2f1e04efe68","name":"Ronald W. Reagan Doral Senior High School","city":"Doral","type":"HIGH","state":"Florida","country":"United States","zip":"33178"},"Education:{\"uuid\":\"f18c233c-fb0a-459e-a839-00d97cd0ab96\"}":{"__typename":"Education","uuid":"f18c233c-fb0a-459e-a839-00d97cd0ab96","school":{"__ref":"School:{\"uuid\":\"7c8ab41c-edb1-4091-b6f1-b2f1e04efe68\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"34c63eef-0635-444d-9f13-09088885775e\"}":{"__typename":"Education","uuid":"34c63eef-0635-444d-9f13-09088885775e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"c04f9338-6e6b-4f77-ba1d-66166e7e5708\"}":{"__typename":"MentorPublicProfile","uuid":"c04f9338-6e6b-4f77-ba1d-66166e7e5708","displayName":"Isabella P.","slug":"isabella-pacheco","biography":"\u003cp\u003eHi! I’m Isabella, a mechanical engineering grad student at Stanford with a passion for design, creativity, and helping others bring their ideas to life. I grew up in Venezuela and moved to Miami in high school, and since then I’ve found myself drawn to work that blends technical problem-solving with human-centered impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, I’ve explored everything from product design and injection molding to global health and assistive technologies. I’ve worked on mobility devices, including a postural support chair for children with cerebral palsy through a collaboration with Kyaro, a social venture based in Tanzania. I’ve also taught brainstorming workshops and served as a teaching assistant for senior design courses—supporting students as they developed real solutions to real-world challenges. Taking global health classes and volunteering with the Special Olympics have also shaped the way I think about inclusive design and community-centered work.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love mentoring because I enjoy helping students figure out what excites them and how to move from an idea to something tangible. Whether you’re working through a school assignment, exploring a personal project, or just unsure where to begin, I’m here to support you every step of the way. I also have two younger sisters, ages 9 and 5, so I’m no stranger to questions, curiosity, and making learning fun at any age.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school, I enjoy fashion, learning about new shows to watch, and scouting for the best food spots in town.\u0026nbsp;Looking forward to supporting your journey and exploring what you're passionate about!\u003c/p\u003e","teachingVideoPlaybackId":"kGk8NnwGtFsMM18XkLsn1hdTFTT7vg2DEKSlORPFF00I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"475fbecd-36ef-4669-9b34-05e63d1973cb\"}"}],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5e2cfa36-0576-4c94-a9f9-26eaad472030\"}"},{"__ref":"DeepDives:{\"uuid\":\"bcca7d21-ee0d-4efb-9fef-57cb83bf07a1\"}"},{"__ref":"DeepDives:{\"uuid\":\"8b69ff9b-ebbc-419d-a5b7-75ade8580c11\"}"},{"__ref":"DeepDives:{\"uuid\":\"c2fdd8a5-0dcc-44f6-a1ea-b6f21494b4bb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e87664cc-31a3-46ec-b451-a3a3d5c3abc4/-/preview/-/format/jpg/","https://ucarecdn.com/276438b3-5e30-4017-81bc-e3d2da99432e/-/preview/-/format/jpg/","https://ucarecdn.com/bcce3e81-ec10-48ce-b7d2-06a8f85c1ef4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f18c233c-fb0a-459e-a839-00d97cd0ab96\"}"},{"__ref":"Education:{\"uuid\":\"34c63eef-0635-444d-9f13-09088885775e\"}"}],"hiredAt":"2025-04-11T09:22:40.413Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Writing","Spanish","Academic Coaching","Executive Function","History","K-6 Storybook","Music","Fashion / Cosmetics","History Project","Medicine / Health","Web Design","Robotics / Electronics / CAD","STEM Project","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isabella-pacheco\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c04f9338-6e6b-4f77-ba1d-66166e7e5708\"}"}}},"_sentryTraceData":"69d0dab3b0a64b7fb3579180f66b900f-82fe3f23ef52e006-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=69d0dab3b0a64b7fb3579180f66b900f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"isabella-pacheco"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
