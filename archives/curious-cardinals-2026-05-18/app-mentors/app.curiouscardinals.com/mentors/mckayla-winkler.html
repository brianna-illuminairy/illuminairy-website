xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"dbbeb9bc-10ea-4f8a-8d3e-8b72520ec24e\"}":{"__typename":"DeepDives","uuid":"dbbeb9bc-10ea-4f8a-8d3e-8b72520ec24e","content":"\u003cp\u003eEver since I entered high school, I dreamed not only of caring for others but of doing so while soaring through the skies. My ambition to become an Army Flight and Travel Nurse is rooted in both my passion for healthcare and my deep desire to serve my country. This career path perfectly blends my interests in medicine, adventure, and service, offering the unique opportunity to provide critical care in both emergency and global contexts.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d524a361-805e-4455-a07d-79e274080702\"}":{"__typename":"DeepDives","uuid":"d524a361-805e-4455-a07d-79e274080702","content":"\u003cp\u003eFrom a young age, I knew I wanted a career that would allow me to care for others, make a real difference, and be part of something greater than myself. That calling led me to pursue a degree in nursing. I chose this path not only because of my deep interest in health and medicine, but because I’ve always been drawn to the human side of care being able to offer comfort, support, and critical intervention when people need it most.\u003c/p\u003e\u003ch3\u003e\u003c/h3\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4d0c57b6-9fab-4c4f-98df-80c213f20c17\"}":{"__typename":"DeepDives","uuid":"4d0c57b6-9fab-4c4f-98df-80c213f20c17","content":"\u003cp\u003eStop comparing your journey to everyone else’s. Every student is different, and there’s no single “right” way to find success. It’s easy to feel pressure when you see classmates who seem to have everything figured out, straight A’s, early college decisions, big plans, but the truth is, everyone moves at their own pace, and that’s okay.\u003c/p\u003e\u003cp\u003eI would remind myself that being unsure, changing your mind, or taking a different path doesn’t make you lost, it makes you human. What matters most is staying true to your interests, working hard, and being open to learning from every experience, even the ones that don’t go as planned.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"02bc4997-5fda-484c-9379-76207fe889d3\"}":{"__typename":"DeepDives","uuid":"02bc4997-5fda-484c-9379-76207fe889d3","content":"\u003cp\u003eOne of the biggest goals I hope to accomplish in my lifetime is to rise through the ranks of the U.S. Army and ultimately earn the rank of General while serving as a nurse. I acknowledge this is an ambitious goal, but it fuels my drive every single day. I want to show that it's possible to lead with compassion, skill, and strength. I don’t just want to care for soldiers, I want to lead them, advocate for them, and help shape the future of military healthcare.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"b7205036-e2a7-426a-8d1a-e6d3e1c66f03\"}":{"__typename":"School","uuid":"b7205036-e2a7-426a-8d1a-e6d3e1c66f03","name":"Philadelphia Academy Charter High School","city":"Philadelphia","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19116"},"Education:{\"uuid\":\"ffb72a47-c37e-4363-ab0a-c755d2e9686d\"}":{"__typename":"Education","uuid":"ffb72a47-c37e-4363-ab0a-c755d2e9686d","school":{"__ref":"School:{\"uuid\":\"b7205036-e2a7-426a-8d1a-e6d3e1c66f03\"}"},"startYear":"2019","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"af925b77-c069-40d4-a7ef-b0fda08aa978\"}":{"__typename":"Education","uuid":"af925b77-c069-40d4-a7ef-b0fda08aa978","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Nursing","degree":null},"MentorPublicProfile:{\"uuid\":\"7985ac16-d185-4653-a440-f115c7bf13ce\"}":{"__typename":"MentorPublicProfile","uuid":"7985ac16-d185-4653-a440-f115c7bf13ce","displayName":"McKayla W.","slug":"mckayla-winkler","biography":"\u003cp\u003eI’m someone who dreams big and fights hard—literally and figuratively. I’m currently a nursing major, but my goals stretch far beyond the classroom. One day, I hope to become a General in the U.S. Army, blending my passion for healthcare with my deep desire to lead and serve. I’ve always believed that strength isn’t one-dimensional—it shows up in different ways for different people. For me, it’s in the way I show up for my community, my team, and myself.\u003c/p\u003e\u003cp\u003eI’ve taken that belief and put it into action across many areas of my life. In high school I was the captain of my flag football team, lead delegate in Model UN, and I’ve competed in Mock Trial—sharpening my skills in leadership, strategy, and communication. I also serve as the Vice President of the National Honor Society, where I’ve helped organize events and community service initiatives that truly make a difference. I’ve worked three jobs at once, all while keeping up with my studies and training. That hustle taught me time management, grit, and resilience—the kind you can’t learn from a textbook.\u003c/p\u003e\u003cp\u003eOutside the classroom and extracurriculars, I’m a fighter in the most literal sense. I train in boxing, MMA, and Brazilian jiu-jitsu, and I’m constantly pushing my limits to grow stronger—not just physically, but mentally and emotionally too. I also express myself through art, which helps keep me grounded and gives me another outlet to connect with others.\u003c/p\u003e\u003cp\u003eAll these experiences have shaped me into someone who leads with heart, lifts others up, and never backs down from a challenge. I know how important it is to have someone in your corner who believes in you—and I strive to be that person for others. That’s why being a mentor means so much to me. I’ve learned that real leadership is about showing up, listening, and helping others see the strength in themselves. And I’m ready to do just that.\u003c/p\u003e","teachingVideoPlaybackId":"cpycc8u00d2FjEMaTFtPbE197o01XOu1r1qzREibA869Y","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Nursing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dbbeb9bc-10ea-4f8a-8d3e-8b72520ec24e\"}"},{"__ref":"DeepDives:{\"uuid\":\"d524a361-805e-4455-a07d-79e274080702\"}"},{"__ref":"DeepDives:{\"uuid\":\"4d0c57b6-9fab-4c4f-98df-80c213f20c17\"}"},{"__ref"
