xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ba0b9fc0-4c82-47bc-a37b-9ff92e5d721b\"}":{"__typename":"Favorites","uuid":"ba0b9fc0-4c82-47bc-a37b-9ff92e5d721b","photoUrl":"https://ucarecdn.com/cdf9912d-4127-44e5-b0c9-575848e208f7/","title":"Football","type":"SPORT"},"Favorites:{\"uuid\":\"516619a7-0a67-403e-a562-572072555963\"}":{"__typename":"Favorites","uuid":"516619a7-0a67-403e-a562-572072555963","photoUrl":"https://ucarecdn.com/441c8df6-abed-4642-9f4e-9f1b748dae11/","title":"Florence","type":"CITY"},"Favorites:{\"uuid\":\"b845d808-c9d8-4551-9b2a-3ef37f38e3ee\"}":{"__typename":"Favorites","uuid":"b845d808-c9d8-4551-9b2a-3ef37f38e3ee","photoUrl":"https://ucarecdn.com/257c232a-1bda-44f6-a0eb-493e644c1778/","title":"LeBron James","type":"ATHLETE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"10d79191-19a5-4fe8-b99f-e036e8eff61d\"}":{"__typename":"DeepDives","uuid":"10d79191-19a5-4fe8-b99f-e036e8eff61d","content":"\u003cp\u003eI chose my major (Economics) because I was interested in law, history, math, and ultimately how they combined as disciplines to study the economy. I really enjoyed both humanities and STEM classes in high school, and I didn't want to abandon one for the other when picking a major. I ultimately selected economics because I was able to translate a lot of historical and sociological ideas into math. Studying at Northwestern allowed me to take the next step and use real-life data to dive deeper and gain even better insight. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"18fdb077-8260-43eb-8152-e849cd529a3c\"}":{"__typename":"DeepDives","uuid":"18fdb077-8260-43eb-8152-e849cd529a3c","content":"\u003cp\u003eI enjoy cooking, travel, photography, and watching movies. Recently I've traveled to \u0026amp; photographed several cities in Europe during a semester I spent studying in Italy. I try to learn at least one new recipe a month, and I often cook barbecue during the summer for my family. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"f903f6d3-b8d7-4f97-b178-72214018a72f\"}":{"__typename":"DeepDives","uuid":"f903f6d3-b8d7-4f97-b178-72214018a72f","content":"\u003cp\u003eI'm really passionate about mentorship because throughout college and beginning my career, the mentorship I received was very influential. I worked closely with several professors at Northwestern to narrow down my professional interests as well as acclimate to the college workload. When I began work over the last few summers in the finance industry, I had several close mentors making sure I had access to opportunities to develop and learn. Those relationships were super important to me, and I'm excited to continue that tradition as a mentor with Curious Cardinals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"03a27532-3536-4a96-b2a4-1743123ee455\"}":{"__typename":"DeepDives","uuid":"03a27532-3536-4a96-b2a4-1743123ee455","content":"\u003cp\u003eI hope to hit 30 countries traveled to by the time I hit 30 years old. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}":{"__typename":"School","uuid":"1855d7ef-1e93-4456-9092-47a74b3f8fb1","name":"New Trier Township High School - Winnetka","city":"Winnetka","type":"HIGH","state":"Illinois","country":"United States","zip":"60093"},"Education:{\"uuid\":\"b9f15339-3528-4529-8d08-b85126cc246f\"}":{"__typename":"Education","uuid":"b9f15339-3528-4529-8d08-b85126cc246f","school":{"__ref":"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"ed39c4e1-d6cb-44ac-bfd4-f4891aa37dd7\"}":{"__typename":"Education","uuid":"ed39c4e1-d6cb-44ac-bfd4-f4891aa37dd7","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"fa805d3c-2198-4ed2-811b-9120a80dfa98\"}":{"__typename":"MentorPublicProfile","uuid":"fa805d3c-2198-4ed2-811b-9120a80dfa98","displayName":"Max L.","slug":"maximus-leibov","biography":"\u003cp\u003eHi! My name is Max Leibov, and I am a senior at Northwestern University. I grew up in the Chicago suburbs, and am super passionate about Chicago sports. I enjoy travel, photography, and watching movies. Recently, I've been spending time learning to cook. At Northwestern, I study Economics \u0026amp; Business. \u003c/p\u003e\u003cp\u003e\u003cbr\u003eI've worked as a math \u0026amp; English tutor over the last several years, and I wanted to help students work more directly on developing their passions. That's why I joined Curious Cardinals this year. I'm excited to help your students learn \u0026amp; excel! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I'm interested in the financial services industry and plan to work in banking strategy in New York City after graduation. I've also worked in wealth management and corporate development roles over the past few summers. In addition to passion projects, I'd be glad to discuss internship recruitment and professional pathfinding with your students. \u003c/p\u003e","teachingVideoPlaybackId":"Kj3aj8Wa8uLZUC1d00z4BtzGKLJSLgl7b2rsUfhuTcbk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI came back from knee surgery and re-learned how to ski in the span of one year.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ba0b9fc0-4c82-47bc-a37b-9ff92e5d721b\"}"},{"__ref":"Favorites:{\"uuid\":\"516619a7-0a67-403e-a562-572072555963\"}"},{"__ref":"Favorites:{\"uuid\":\"b845d808-c9d8-4551-9b2a-3ef37f38e3ee\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"10d79191-19a5-4fe8-b99f-e036e8eff61d\"}"},{"__ref":"DeepDives:{\"uuid\":\"18fdb077-8260-43eb-8152-e849cd529a3c\"}"},{"__ref":"DeepDives:{\"uuid\":\"f903f6d3-b8d7-4f97-b178-72214018a72f\"}"},{"__ref":"DeepDives:{\"uuid\":\"03a27532-3536-4a96-b2a4-1743123ee455\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f4c0bc95-8905-494e-aacb-0d141a7a04f0/-/preview/-/format/jpg/","https://ucarecdn.com/715251b3-79d0-4313-9e9a-f076bcd11d40/-/preview/-/format/jpg/","https://ucarecdn.com/6942fe76-ce3b-43cc-932a-630bb11d7aa8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b9f15339-3528-4529-8d08-b85126c
