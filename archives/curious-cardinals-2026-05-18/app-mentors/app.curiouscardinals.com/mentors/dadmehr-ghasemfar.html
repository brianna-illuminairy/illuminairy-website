tical Math, creative thinking, and hands-on problem solving. The diversity of the study intrigued me. I also have always loved rockets, planes, cars, and gadgets. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"3c4c1c09-6fa0-469f-bd09-dab04d68ef36\"}":{"__typename":"DeepDives","uuid":"3c4c1c09-6fa0-469f-bd09-dab04d68ef36","content":"\u003cp\u003eIn my ideal job, I live near the mountains or ocean. I have access to a wide set of design tools (laser cutters, mills and lathes, 3D printers, electronics, etc) and I spend most of my time in with designing and enhancing nifty devices. I also hope to be a leader.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"40563a63-a2e2-4782-8792-0059a7110534\"}":{"__typename":"DeepDives","uuid":"40563a63-a2e2-4782-8792-0059a7110534","content":"\u003cp\u003eI love running and have done a couple marathons. Aside from that, I also really enjoy deep conversations with close friends, EDM music, Jazz, and audiobooks.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e64c6623-fcdc-488b-8961-13d0fbee5430\"}":{"__typename":"School","uuid":"e64c6623-fcdc-488b-8961-13d0fbee5430","name":"Los Altos High School","city":"Los Altos","type":"HIGH","state":"California","country":"United States","zip":"94022"},"Education:{\"uuid\":\"db9ad58e-64d3-4389-ac0a-258e8738be14\"}":{"__typename":"Education","uuid":"db9ad58
