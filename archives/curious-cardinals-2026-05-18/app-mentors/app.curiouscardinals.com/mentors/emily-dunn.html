js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"8f0c6d67-80e0-4abc-8be9-06c1a224d24b\"}":{"__typename":"DeepDives","uuid":"8f0c6d67-80e0-4abc-8be9-06c1a224d24b","content":"\u003cp\u003eThe summer between my freshman and sophomore year of high school, I read a lot of pop-science astrophysics (mostly from Neil DeGrasse Tyson). That summer, I attended Duke University's 2 week \"field studies\" program on astronomy, physics, and astrobiology located in Pisgah National Forest, NC. I got to nerd out about my favorite subjects with other students around my age, and then we did our own research with the equipment at the observatory there. I was on a team with three other girls, and we measured the Hubble constant using data in the observatory archives. \u003c/p\u003e\u003cp\u003eThe summer between sophomore and junior year was COVID times, so I became nocturnal and spent most nights reading. I decided I was going to teach myself world history starting from the first writing. It turned out to be quite an ambitious goal, so I ended up just studying the Sumerians and later groups of ancient Mesopotamia. So, if you ever want a random fact about that particular civilization...\u003c/p\u003e\u003cp\u003eThe summer between junior and senior year, I worked as a lifeguard in the wave pool at this water park in Texas. Nearly everyday, the \"feels like\" temperature was over 110 degrees Fahrenheit. I liked it, though, as everyday was different, and I gained skills in CPR, swimming, and customer service. That summer, I saved 4 or 5 people that summer from drowning in the wave pool, and those experience made me better at thinking and acting quickly.\u003c/p\u003e\u003cp\u003eThe summer after my senior year, I attended the World Biodiversity Forum in Davos, Switzerland, as I had been doing a biomimicry engineering project on hydrogen production and storage with a company called Born Global. My team and I presented our project on a stage and also got to attend various talks held at the conference. It was my first time abroad. Other than the conference, I spent most of that summer soaking in my Texas hometown before I left for college in North Carolina.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"6e65f95e-e51c-43be-83c8-d17733ea500e\"}":{"__typename":"DeepDives","uuid":"6e65f95e-e51c-43be-83c8-d17733ea500e","content":"\u003cp\u003eWhen I was in eighth grade, I was inspired by a video we had seen in my engineering elective-- a boy had turned his garage into an arcade, with most of the games made out of boxes. I asked my teacher if I could do the same and make a cardboard arcade machine for our classroom.\u003c/p\u003e\u003cp\u003eI made a version of Pac-Man. On the inside of the box. I had a cardboard platform lying horizontal. I constructed the walls of a maze on top of the platform and put in some painted magnetic balls. \u003c/p\u003e\u003cp\u003eThe platform was held up by a piece of cardboard on each edge. Each piece was connected to the edge of another smaller platform at the bottom of the box. Each smaller platform had a spring beneath it. \u003c/p\u003e\u003cp\u003eOn the other edge of this smaller platform was another piece that connected all the way up and out of the box to the 'buttons' of the machine. The buttons were made to be 'up,' 'down,' 'left,' and 'right.' \u003c/p\u003e\u003cp\u003eWhen you pressed one of the buttons, the piece connected to it would press down on one edge of the smaller platform with the spring beneath it. As one side was pressed down, the other side would lift. The piece connected to the lifted side would then also go up. As this piece was connected to a side of the platform with the maze on it, that side of the maze would raise, and the magnetic balls would roll in the opposite direction of the raised side (so the button pushed would correspond to the opposite side to be raised). In this way, a player would try to get one of the magnetic balls (Pac-Man) to navigate through the maze without getting stuck to any of the other magnetic balls (the ghosts).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThough a long time ago, I still hold this project dear to me, because it challenged me to think mechanically. This was one of my earliest experiences becoming very invested in how things move, which is a key part of describing physical systems. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"089bd66a-2c94-4bdf-a29a-3f126ad7a472\"}":{"__typename":"DeepDives","uuid":"089bd66a-2c94-4bdf-a29a-3f126ad7a472","content":"\u003cp\u003eAs a student, even from kindergarten, when you are learning things from other people, you become a part of this ecosystem of academia. People put in time and effort to help you along in your way, and often as a kid, you don't have much you can give back to them besides the effort you can put in to learn what they are trying to teach you. I am incredibly grateful for the mentors and teachers I have had in my academic journey, as I went to a small public school with little resources, and my teachers' dedication to challenging me and helping me find opportunities is really what helped me get into a good university. Because of their dedication to my education, I think it is only right to pass that along; it is my way to thank those who taught and mentored me. I know first hand how impactful teachers and mentors can be, so I know it is a very valuable thing to offer to someone else. I think as an undergraduate I have enough that I can and should give back in the world of academia.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"25e23f26-fb23-4e3b-9bf9-7cd333d1c9ac\"}":{"__typename":"DeepDives","uuid":"25e23f26-fb23-4e3b-9bf9-7cd333d1c9ac","content":"\u003cp\u003eAlways keep your eyes open for opportunities that will challenge you for the better. If there is a specific goal you have in mind, curate the challenges you take on to be related to that goal. If you don't have a specific goal, take what comes and what fits with the things you like to do. Find challenges that make you learn new skills, especially technical skills. Find challenges that genuinely are not easy, that you have to work hard for. You can only learn and do so much in school, but your work outside of the bare minimum-- the things you do in your free time and in the summers and over break, that is what can set you apart for future opportunities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"8f23064b-8c1d-444f-a515-4541edc9cbf6\"}":{"__typename":"School","uuid":"8f23064b-8c1d-444f-a515-4541edc9cbf6","name":"Lamar Consolidated High School","city":"Rosenberg","type":"HIGH","state":"Texas","country":"United States","zip":"77471"},"Education:{\"uuid\":\"2168bb4a-83d0-4433-8bcb-f6c1b50b8168\"}":{"__typename":"Education","uuid":"2168bb4a-83d0-4433-8bcb-f6c1b50b8168","school":{"__ref":"School:{\"uuid\":\"8f23064b-8c1d-444f-a515-4541edc9cbf6\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"4b9827c3-846d-44ba-9544-31e4cc83fdd0\"}":{"__typename":"Education","uuid":"4b9827c3-846d-44ba-9544-31e4cc83fdd0","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Mechanical Engineering and Physics","degree":null},"Testimonial:7adb18ee-67f1-4a90-89af-c9bc34362e64":{"__typename":"Testimonial","id":"7adb18ee-67f1-4a90-89af-c9bc34362e64","text":"She took on the unique challenge of mentoring a 9-year-old curious about quantum physics. Emily was incredibly patient and supportive, helping Jaya explore big ideas in an age-appropriate way. Jaya learned so much and really looked forward to their sessions. Thank you, Emily!","date":"2025-06-18 20:48:20.179+00","rating":4,"endorser":{"__typename":"Endorser","name":"Vimal Vora","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"8cfd67d6-a86f-4f4c-9707-44e97dbe47ac\"}":{"__typename":"MentorPublicProfile","uuid":"8cfd67d6-a86f-4f4c-9707-44e97dbe47ac","displayName":"Emily D.","slug":"emily-dunn","biography":"\u003cp\u003eHello! I'm 20 years old and was born and raised in Houston, Texas. Growing up next to the heart of the American space industry and countless nights stargazing as a kid lead me to my dream of being an astronaut. As I have followed this dream and become cognizant of world issues, I have become most passionate about the cross section between space travel, efforts against climate change, and global socioeconomic welfare.\u003c/p\u003e\u003cp\u003eI am currently on the 'obtain a bachelor's degree' phase of my career journey-- I study mechanical engineering and physics at Duke University (and am currently on a semester abroad at the University of Edinburgh). In my time as an undergraduate, I have picked up research experience in materials science, biomedical engineering, and (green) energy systems engineering. I am currently project manager of the Duke Smart Home (a residential center focused on sustainable engineering) and a researcher with Texas A\u0026amp;M's Extreme Environment Materials Lab.\u003c/p\u003e\u003cp\u003eI have peer tutored in all high school subjects, mentored high schoolers in a self-designed engineering projects, designed curriculum and taught an astrophysics and rocketry course to middle schoolers, and taught arts, math, and reading to at-risk 3rd and 4th graders in an after school program. Most recently, I taught guitar and arts (in Brazilian Portuguese) to K-12 aged students in a rural community in Bahia, Brazil.\u003c/p\u003e\u003cp\u003eOutside of academia, I am involved in a few martial arts-- I train capoeira angola (which was related to my time teaching in Bahia, Brazil), I am co-president of the Duke University Women's Wrestling Club, and have recently picked up kickboxing during my study away in Scotland. I find these sports empowering, and they help me stay in shape which fits into my plans to be an astronaut. \u003c/p\u003e\u003cp\u003eIn my own academic career, I have had to seek support and find a tutor. I know school can be challenging, and I'm eager to give back as an educator in the subjects I'm passionate about.\u003c/p\u003e","teachingVideoPlaybackId":"Hktu0200FGGWWKlvf0001AGg69IivsLLrImTITivqWMgvlw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering and Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8f0c6d67-80e0-4abc-8be9-06c1a224d24b\"}"},{"__ref":"DeepDives:{\"uuid\":\"6e65f95e-e51c-43be-83c8-d17733ea500e\"}"},{"__ref":"DeepDives:{\"uuid\":\"089bd66a-2c94-4bdf-a29a-3f126ad7a472\"}"},{"__ref":"DeepDives:{\"uuid\":\"25e23f26-fb23-4e3b-9bf9-7cd333d1c9ac\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/adfd2f64-429a-42b7-a343-3f50c9c43a2e/-/preview/-/format/jpg/","https://ucarecdn.com/c56bd277-4caa-4f9c-b6e2-40b34bbd24e1/-/preview/-/format/jpg/","https://ucarecdn.com/19571078-687f-4b19-ae84-1effec79b7bd/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2168bb4a-83d0-4433-8bcb-f6c1b50b8168\"}"},{"__ref":"Education:{\"uuid\":\"4b9827c3-846d-44ba-9544-31e4cc83fdd0\"}"}],"hiredAt":"2024-10-09T12:36:01.878Z","topics":["Aviation / Aerospace","Product Design","K-5 Grade Math","Pre-Algebra","Geometry","Algebra I","Algebra II","Statistics","Precalculus / Trigonometry","Calculus","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:7adb18ee-67f1-4a90-89af-c9bc34362e64"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"emily-dunn\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8cfd67d6-a86f-4f4c-9707-44e97dbe47ac\"}"}}},"_sentryTraceData":"65a84c17cacb4231868dc93cb786b627-a456bcd36e5bbc38-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=65a84c17cacb4231868dc93cb786b627,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"emily-dunn"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manag
