xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1542ece6-233a-4491-b911-26c40f2b60e8\"}":{"__typename":"DeepDives","uuid":"1542ece6-233a-4491-b911-26c40f2b60e8","content":"\u003cp\u003eIf I could give my middle or high school self advice, I’d say: \u003cstrong\u003estop worrying so much about having everything figured out.\u003c/strong\u003e Back then, I felt like I had to know exactly what I wanted to do and be “good” at everything right away. But I’ve learned that curiosity is way more powerful than certainty.\u003c/p\u003e\u003cp\u003eI’d tell myself to \u003cstrong\u003etry new things just because they seem interesting\u003c/strong\u003e, even if they feel a little uncomfortable or unfamiliar. Some of the most meaningful opportunities in my life — from studying AI to starting a nonprofit school — came from moments when I just followed what made me curious, not what I thought I was “supposed” to do.\u003c/p\u003e\u003cp\u003eAnd I’d remind myself that \u003cstrong\u003econfidence doesn’t come from knowing all the answers — it comes from trusting that you can figure them out.\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"75ce6dbc-d2c1-43dc-93ab-8884fbced852\"}":{"__typename":"DeepDives","uuid":"75ce6dbc-d2c1-43dc-93ab-8884fbced852","content":"\u003cp\u003eIn my spare time, I love being outside — \u003cstrong\u003esurfing, golfing, or going on little adventures with friends\u003c/strong\u003e. I’m also a huge music person, so I’m always \u003cstrong\u003emaking new Spotify playlists\u003c/strong\u003e or discovering artists from random genres.\u003c/p\u003e\u003cp\u003eBut honestly, one of my favorite things to do is just \u003cstrong\u003etalk to people\u003c/strong\u003e — whether it’s a barista, a classmate, or someone I meet while traveling. I love hearing about what excites them and learning how different people see the world. Everyone has something unique they’re passionate about, and I find it really inspiring to see what makes them light up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"e3332b14-7ec5-4e70-8fb8-559d26a0d0a0\"}":{"__typename":"DeepDives","uuid":"e3332b14-7ec5-4e70-8fb8-559d26a0d0a0","content":"\u003cp\u003eMy greatest role model is \u003cstrong\u003emy mom\u003c/strong\u003e. She immigrated from Vietnam and built a life from almost nothing, all while making sure I had every opportunity to dream bigger than she ever could. Watching her work so hard — and still stay kind, grounded, and endlessly curious — has shaped everything about how I approach life.\u003c/p\u003e\u003cp\u003eShe’s the reason I care so deeply about education and giving back. Growing up, I saw how access to learning could completely change someone’s path, and that’s what inspired me to start a \u003cstrong\u003enonprofit school in Vietnam\u003c/strong\u003e to teach English to kids who wouldn’t otherwise have that chance.\u003c/p\u003e\u003cp\u003eWhat I admire most about her is her mindset — she never stops learning, no matter how old she is or how busy life gets. That’s something I try to carry with me too: to stay curious, keep growing, and use what I learn to help others do the same.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"7e0b6f75-cf83-4c28-9635-a5ef4522e73c\"}":{"__typename":"DeepDives","uuid":"7e0b6f75-cf83-4c28-9635-a5ef4522e73c","content":"\u003cp\u003eOne of the silliest dreams I’ve ever had was that I somehow became \u003cstrong\u003ethe personal stylist for a group of squirrels\u003c/strong\u003e. They all lived in this tiny fashion studio inside a tree, and I was helping them pick out outfits made of leaves and acorns for their “fall collection.” There was even a dramatic squirrel runway show at the end — complete with music and flashing lights.\u003c/p\u003e\u003cp\u003eI woke up laughing and a little confused, but honestly, I kind of admired their confidence. Those squirrels had \u003cem\u003estyle.\u003c/em\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"9e7fc706-8b12-4eaa-a204-abec9e92d2ba\"}":{"__typename":"School","uuid":"9e7fc706-8b12-4eaa-a204-abec9e92d2ba","name":"Long Beach Polytechnic High School","city":"Long Beach","type":"HIGH","state":"California","country":"United States","zip":"90813"},"Education:{\"uuid\":\"f47c6a4a-1c34-437b-8bca-94fc50d806ec\"}":{"__typename":"Education","uuid":"f47c6a4a-1c34-437b-8bca-94fc50d806ec","school":{"__ref":"School:{\"uuid\":\"9e7fc706-8b12-4eaa-a204-abec9e92d2ba\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"bac93617-e867-4c13-bd79-e384bcc979b0\"}":{"__typename":"Education","uuid":"bac93617-e867-4c13-bd79-e384bcc979b0","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Mathematics and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"5019005f-9d3d-4082-bf74-da951ea8d973\"}":{"__typename":"MentorPublicProfile","uuid":"5019005f-9d3d-4082-bf74-da951ea8d973","displayName":"Linda T.","slug":"linda-tran","biography":"\u003cp\u003eHi! My name is \u003cstrong\u003eLinda Tran\u003c/strong\u003e, and I’m currently a \u003cstrong\u003esenior at Stanford University\u003c/strong\u003e studying \u003cstrong\u003eMathematics and Computer Science\u003c/strong\u003e. I’m passionate about exploring how people learn, think, and create through technology. I’ve always loved understanding how things work — from the logic behind equations to the creativity behind code. For me, learning is about curiosity and connection: taking something complex and making it click in a way that feels exciting and empowering.\u003c/p\u003e\u003cp\u003eI grew up as a \u003cstrong\u003efirst-generation Vietnamese-American\u003c/strong\u003e, and from a young age I saw how learning could open doors that once felt out of reach. That’s what inspired me to start a \u003cstrong\u003enonprofit school in Vietnam\u003c/strong\u003e, where I helped underprivileged kids learn English. Watching their confidence grow as they began speaking a new language reminded me how powerful education can be — especially when it’s creative, encouraging, and tailored to each student.\u003c/p\u003e\u003cp\u003eAt Stanford, I’ve taken that same mindset into everything I do. Academically, I focus on the intersection of \u003cstrong\u003eAI, data, and human behavior\u003c/strong\u003e — exploring how technology can solve real-world problems and empower people. Professionally, I’ve worked as an \u003cstrong\u003eAI software engineer\u003c/strong\u003e, where I got to see how machine learning models are built and refined. I’ve also taught high-school students \u003cstrong\u003eAI and machine learning\u003c/strong\u003e, helping them turn big, abstract concepts into hands-on projects like emotion recognition or music analysis. These experiences helped me see that teaching isn’t just about explaining concepts; it’s about helping students build confidence, curiosity, and creativity along the way.\u003c/p\u003e\u003cp\u003eOutside the classroom, I’m part of Stanford’s \u003cstrong\u003eSymbolic Systems Society\u003c/strong\u003e, which brings together students interested in tech, psychology, and philosophy. I love building communities that mix curiosity, creativity, and collaboration — whether that’s through mentoring younger students, leading discussions, or brainstorming new ideas with friends.\u003c/p\u003e\u003cp\u003eWhen I’m not studying or teaching, you’ll probably find me \u003cstrong\u003esurfing along the California coast\u003c/strong\u003e, \u003cstrong\u003eplaying golf\u003c/strong\u003e, or discovering new music (my Spotify playlists are always a work in progress!). I’m a big believer that the best ideas often come when you mix different parts of life together, and I bring that same energy into my teaching.\u003c/p\u003e\u003cp\u003eAs a mentor, my goal is to make learning something you actually \u003cem\u003elook forward to\u003c/em\u003e. I want students to feel supported, challenged, and inspired to ask questions that go beyond the textbook. Whether it’s solving a tricky math problem or exploring how AI works behind the scenes, I hope to help you discover the fun side of learning and the confidence that comes with it.\u003c/p\u003e","teachingVideoPlaybackId":"FRd39ld3aPEXAiCJWtvmgSlEHTTD8MCvZ59slG1AZuQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mathematics and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1542ece6-233a-4491-b911-26c40f2b60e8\"}"},{"__ref":"DeepDives:{\"uuid\":\"75ce6dbc-d2c1-43dc-93ab-8884fbced852\"}"},{"__ref":"DeepDives:{\"uuid\":\"e3332b14-7ec5-4e70-8fb8-559d26a0d0a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"7e0b6f75-cf83-4c28-9635-a5ef4522e73c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/89fad81e-0cc3-4305-b716-2079deec4144/-/preview/-/format/jpg/","https://ucarecdn.com/98fd7866-901d-4db8-bf1e-86263ae6fef5/-/preview/-/format/jpg/","https://ucarecdn.com/8b5e4954-9c0d-4bf0-b08d-296c9f39b4f6/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f47c6a4a-1c34-437b-8bca-94fc50d806ec\"}"},{"__ref":"Education:{\"uuid\":\"bac93617-e867-4c13-bd79-e384bcc979b0\"}"}],"hiredAt":"2025-09-30T02:41:30.419Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Economics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"linda-tran\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5019005f-9d3d-4082-bf74-da951ea8d973\"}"}}},"_sentryTraceData":"f45d54b0cd2b497597a960a967386001-8a00247d7bf7424b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f45d54b0cd2b497597a960a967386001,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"linda-tran"},"buildId":"ZAcrs1h
