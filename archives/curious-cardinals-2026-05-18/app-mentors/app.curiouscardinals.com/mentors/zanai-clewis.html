xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"965f535c-b348-4ea9-b71f-4d89a73fe824\"}":{"__typename":"DeepDives","uuid":"965f535c-b348-4ea9-b71f-4d89a73fe824","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003eI am extremely proud of taking an entire summer to learn how to surf. I am from Orange Country and what girl from Orange County is not a surfer? I think Shakespeare said that once too but please do not quote me on that. Anywho, I love to swim and spend my days at the beach so I figured I would level up and learn to surf. Let me just say, it is way harder than it looks and there were 8 year-olds blowing me out of the water. I pretty much forgot how to swim when I was in a panic and got a nose bleed once. I still did not let that bring me down and kept practicing. I was able to catch a few waves after a couple months of practice, but I am still nowhere near those 8 year-olds. One day, with enough practice, I will be as good as them. Surfing taught me not to give up, that you can get better at something if you work at it, and to learn from those around you. That is why I am proud of learning how to surf.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"17a914a0-0e4f-41a7-a07b-f9221b2eb133\"}":{"__typename":"DeepDives","uuid":"17a914a0-0e4f-41a7-a07b-f9221b2eb133","content":"\u003cp\u003eAs a first-generation college student, I constantly wished that I had someone who could mentor me and help me navigate my academic journey. I had to figure out many important tasks and decisions alone: how to succeed in high school, apply for college, decide which college to attend, and thrive in college. If I had someone to guide me through the process, it would have at least made me feel more confident and secure. I know what it is like to feel alone, stressed, and confused in making big decisions and do not wish it upon anyone. Instead, I am availing the opportunity of mentorship to instill confidence, strengthen skills, and give the tools necessary to prepare you for your future!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e4f31b09-3f90-4f50-8608-6c81c0d52eb9\"}":{"__typename":"DeepDives","uuid":"e4f31b09-3f90-4f50-8608-6c81c0d52eb9","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003eIn high school, I took AP Government and really enjoyed it. Not only did I find politics in general quite interesting, but I found it fun to read the Constitution and hear about all the landmark Supreme Court cases. When you love a subject, everything related to it becomes fun. I also found that reading and writing are some of my strong suits. Once I took my first couple political science classes at UCLA, I realized how important it is to know about the institutions, people, laws, and policies that directly affect aspects of your life. Politics is also interdisciplinary as it affects the environment, philosophy, society, culture, music, art, and so much more. The limits are endless when it comes to politics and that is why I love it. Maybe instead of calling it politics, we can call it the gift that keeps on giving.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"8e7412cd-8e30-4719-a073-430bd25b1c61\"}":{"__typename":"DeepDives","uuid":"8e7412cd-8e30-4719-a073-430bd25b1c61","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003eI once had a dream that I was in Australia and met a kangaroo. The kangaroo started calling my name and I immediately ran away from him because I thought he wanted to fight me. However, the kangaroo caught up to me and asked “Mate, will you stop running? I just want to know if you have seen my baby.” I said, “No sir, I am sorry but I have not seen your baby.” Then, he put on a top hat and a monocle and asked “Are you sure you haven’t seen my baby?” I then said “Oh, I have seen your baby.” He told me to call him “Mr. K” and I jumped into his pouch. He then showed me around Australia. At the end of the tour, he said “Okay can you tell me where my baby is?” I said “Why yes of course! Your baby is in Idaho.” He then did a super-jump, taking me from Australia to Idaho. Once we arrived, I said “look Mr. K there's your baby!” And there it was; a massive potato. My interpretation of this dream is that kangaroos do not have potato babies.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"a8c09203-c169-49a8-94e8-ea0bfdc0494f\"}":{"__typename":"School","uuid":"a8c09203-c169-49a8-94e8-ea0bfdc0494f","name":"Foothill High School","city":"Santa Ana","type":"HIGH","state":"California","country":"United States","zip":"92705"},"Education:{\"uuid\":\"37bf8cb2-7f29-464e-b847-cd02f1dc32d8\"}":{"__typename":"Education","uuid":"37bf8cb2-7f29-464e-b847-cd02f1dc32d8","school":{"__ref":"School:{\"uuid\":\"a8c09203-c169-49a8-94e8-ea0bfdc0494f\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"82804ee8-c32f-4c74-aceb-bc0c5370333e\"}":{"__typename":"Education","uuid":"82804ee8-c32f-4c74-aceb-bc0c5370333e","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"3b82328f-67d5-40b5-aad4-f0285553c6cd\"}":{"__typename":"MentorPublicProfile","uuid":"3b82328f-67d5-40b5-aad4-f0285553c6cd","displayName":"Zanai C.","slug":"zanai-clewis","biography":"\u003cp\u003eZanai (Zuh-nye) is my name and political science at UCLA is my game! In other words, reading, writing, government, and law are some of the subjects that I love. I also am on track to graduate summa cum laude. In my academic journey thus far, I’ve found it is important to immerse yourself in other subjects to not only strengthen what you are good at, but also to explore your curiosity and build other skills! As such, I am also knowledgeable about philosophy, linguistics, Spanish, film, fashion, creative writing, and a myriad of other topics! I also have experience with public policy research, focused on reducing racially disparate arrests in California and I presented this research at UCLA’s Undergraduate Research Fair. I also plan to attend law school to continue my commitment to social justice and help the communities around me. When I’m not living the academic or research life, you can catch me painting, drawing, sewing, listening to music, pretending I’m a comedian, at the beach, or making a short film! I have also spent my time as a legal assistant and classroom instructor; both of these experiences taught me how to work with various personality types to achieve a higher goal. To do so, I make it a priority to build a relationship with each person, understand how they learn and execute tasks, and then use that to help them thrive. In short, I am someone who loves to learn and help uplift those around me. I can’t wait to meet you and get excited about learning! Until then, stay curious!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"965f535c-b348-4ea9-b71f-4d89a73fe824\"}"},{"__ref":"DeepDives:{\"uuid\":\"17a914a0-0e4f-41a7-a07b-f9221b2eb133\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4f31b09-3f90-4f50-8608-6c81c0d52eb9\"}"},{"__ref":"DeepDives:{\"uuid\":\"8e7412cd-8e30-4719-a073-430bd25b1c61\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8b344e85-bbe5-4383-bfd4-cf9904ee7171/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"37bf8cb2-7f29-464e-b847-cd02f1dc32d8\"}"},{"__ref":"Education:{\"uuid\":\"82804ee8-c32f-4c74-aceb-bc0c5370333e\"}"}],"hiredAt":"2024-04-08T15:04:53.659Z","topics":["Statistics","Writing","Spanish","American Sign Language","Academic Coaching","College Essay Writing","Reading","Executive Function"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"zanai-clewis\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3b82328f-67d5-40b5-aad4-f0285553c6c
