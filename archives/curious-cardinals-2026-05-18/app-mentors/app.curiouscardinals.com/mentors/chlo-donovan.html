xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4cae6631-fbce-4034-8104-78fc4988e9c8\"}":{"__typename":"Favorites","uuid":"4cae6631-fbce-4034-8104-78fc4988e9c8","photoUrl":"https://ucarecdn.com/b1f9c16b-d325-4b5d-8084-ebc253260c10/","title":"Scuderia Ferrari","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"df66f0ef-5cf3-45ab-87a5-9ebed35868b9\"}":{"__typename":"Favorites","uuid":"df66f0ef-5cf3-45ab-87a5-9ebed35868b9","photoUrl":"https://ucarecdn.com/fbc68910-99da-4175-86c1-8216a201a204/","title":"Jason Bateman","type":"ACTOR"},"Favorites:{\"uuid\":\"697e2f61-a387-4294-b31c-c2b77258cd63\"}":{"__typename":"Favorites","uuid":"697e2f61-a387-4294-b31c-c2b77258cd63","photoUrl":"https://ucarecdn.com/0bbaca62-0480-4b3b-901f-611a9a165fda/","title":"Lady Bird","type":"MOVIE"},"CausesSupported:{\"uuid\":\"b36ade84-8759-4878-a295-01d538e53da5\"}":{"__typename":"CausesSupported","uuid":"b36ade84-8759-4878-a295-01d538e53da5","name":"Food \u0026 Friends","description":"\u003cp\u003eVolunteer at nonprofit providing  tailored meals to people with chronic disease\u003c/p\u003e","photoUrl":"https://ucarecdn.com/6265c37e-2f27-468a-bb24-391e4e70e1af/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f2f9fec2-7a22-4fa5-8ffa-3861db4629bf\"}":{"__typename":"DeepDives","uuid":"f2f9fec2-7a22-4fa5-8ffa-3861db4629bf","content":"\u003cp\u003e\u003cbr\u003eThroughout my childhood, my \"dream job\" was constantly changing. My earliest memory of being asked this question was when I was about 5. I had recently been gifted a toy microphone, which I was obsessed with and wouldn't stop shouting into (...my poor parents). Given this newfound passion for singing(?), I confidently replied that I wanted to be an opera singer. Other answers I remember include: astronaut, train conductor (Thomas the Tank Engine phase), surf instructor, and FBI agent.\u003c/p\u003e\u003cp\u003eOnce I got to high school, I became a bit more realistic given my skillset. Since I loved science and math, particularly human biology, I gravitated towards a career in medicine. Watching Grey's Anatomy only sealed the deal. But, when got to college, I found that my true passion was in public health. I realized that I'd rather be making policy or doing an analysis to improve health systems, rather than working with patients directly or in a lab. So, I'd say my dream job right now is Director of the US Commissioner of Food and Drugs (the head of the FDA). That being said, leading a Formula 1 team wouldn't be too bad either...\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"4925f772-d4e3-48fc-88ce-09e6895451e9\"}":{"__typename":"DeepDives","uuid":"4925f772-d4e3-48fc-88ce-09e6895451e9","content":"\u003cp\u003eGrowing up in Los Angeles, I spent lots of time outdoors during the summer because of the incredible weather! I LOVE the beach, from surfing waves to playing volleyball with friends to sitting on the sand with a good book. I'd also wake up early (...some days) to go hiking with my parents. The Backbone Trail, Skull Rock, and Tuna Canyon are some of my favorite trails in LA.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOn the more professional side of things, I worked during most of my high school summers. I didn't have any experience, so I tried many different jobs to see what I liked best. One year, I volunteered at UCLA's Neuroscience Lab helping to conduct research studies in women's health. This position opened my eyes to the field of public health and ignited a passion that has only grown since! Another year, I was a counselor at a tennis summer camp. My favorite part of this role was forming friendships with the kids in my group, and where I \"mentored\" for the first time!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"06dbb44b-6c43-4ff0-adea-3ea9a0e1b3d3\"}":{"__typename":"Education","uuid":"06dbb44b-6c43-4ff0-adea-3ea9a0e1b3d3","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Healthcare Management and Policy","degree":"Bachelor of Science"},"School:{\"uuid\":\"a59500a5-02d3-4c70-ac7b-7ead5e1c9a7a\"}":{"__typename":"School","uuid":"a59500a5-02d3-4c70-ac7b-7ead5e1c9a7a","name":"Harvard-Westlake School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"c0e958a7-9c8a-4147-8a2a-50dfee9f6c6e\"}":{"__typename":"Education","uuid":"c0e958a7-9c8a-4147-8a2a-50dfee9f6c6e","school":{"__ref":"School:{\"uuid\":\"a59500a5-02d3-4c70-ac7b-7ead5e1c9a7a\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"4e362716-e0f0-4b9b-b3bf-bb2f123eac68\"}":{"__typename":"MentorPublicProfile","uuid":"4e362716-e0f0-4b9b-b3bf-bb2f123eac68","displayName":"Chloë D.","slug":"chlo-donovan","biography":"\u003cp\u003e\u003cbr\u003eChloë is a recent graduate of Georgetown University, where she studied heath policy, management, and economics. She is originally from Los Angeles, California where she attended Harvard-Westlake School. In high school, she took a wide variety of A.P courses, including Statistics, Biology, Calculus BC, and U.S. History. She also captained the varsity tennis team and sang in the chamber \u0026amp; jazz choirs.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Georgetown, Chloë appreciated the opportunity to study and engage with global affairs, and meet peers from different cultures, backgrounds, and nationalities. She focused her studies on improving healthcare systems, taking courses in public health, economics, and government. She is particularly passionate about how communities can sustainability develop through efficient food and drug administration, completing capstone projects on the Nigerian counterfeit drug trade, the price of sugar’s impact on low-income communities, and the benefits of medically-tailored meals.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eChloë spent much of her time outside of the classroom working for Georgetown Global Consulting (GGC), a student-run organization dedicated to helping nonprofits in developing countries grow their businesses and their impact. During this time, she managed a project with an environmental group based in Suriname and eventually became Chief Executive Officer of GGC in 2022. Additionally, she was awarded two fellowships in college: one at the Los Angeles Mayor’s Office planning the city’s COVID-19 response and the other with Georgetown’s Global Health Institute analyzing an HIV prevention model in Kenya and Eswatini.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her free time, Chloë loves watching (and playing) sports, particularly soccer, tennis, and Formula 1. She also enjoys spending time outdoors, cooking, and listening to music. She has gained so much from learning with students (as both a mentor and mentee), and is so excited about working for Curious Cardinals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"RLDluQ3nu4wxjeliKXJcPBzJ4YGJw4Y6jadZSwxO7Qw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4cae6631-fbce-4034-8104-78fc4988e9c8\"}"},{"__ref":"Favorites:{\"uuid\":\"df66f0ef-5cf3-45ab-87a5-9ebed35868b9\"}"},{"__ref":"Favorites:{\"uuid\":\"697e2f61-a387-4294-b31c-c2b77258cd63\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b36ade84-8759-4878-a295-01d538e53da5\"}"}],"major":"Healthcare Management and Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f2f9fec2-7a22-4fa5-8ffa-3861db4629bf\"}"},{"__ref":"DeepDives:{\"uuid\":\"4925f772-d4e3-48fc-88ce-09e6895451e9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4a806c41-b9bc-4e7b-afb0-1076badb348b/-/crop/574x575/0,208/-/preview/-/format/jpg/","https://ucarecdn.com/0570f424-5244-4c4a-a742-dc13246bb706/-/preview/-/format/jpg/","https://ucarecdn.com/802521fd-62a9-4385-9405-29fd61e52b5d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"06dbb44b-6c43-4ff0-adea-3ea9a0e1b3d3\"}"},{"__ref":"Education:{\"uuid\":\"c0e958a7-9c8a-4147-8a2a-50dfee9f6c6e\"}"}],"hiredAt":"2023-06-03T20:59:15.638Z","topics":[],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/d441189b-003a-4aab-82f0-564452e913e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"chlo-donovan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4e362716-e0f0-4b9b-b3bf-bb2f123eac68\"}"}}},"_sentryTraceData":"677f63a8391d42c4b4e238d65ec912bc-898fd0de5b443630-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sent
