xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d2507082-6461-4c3f-936c-cea3a6b52f60\"}":{"__typename":"Favorites","uuid":"d2507082-6461-4c3f-936c-cea3a6b52f60","photoUrl":"https://ucarecdn.com/e5220b66-b795-48aa-8ebb-ee0af194e3f5/","title":"Christian Bale","type":"ACTOR"},"Favorites:{\"uuid\":\"802cc7ad-4fb9-421a-8362-4eeb16ac5034\"}":{"__typename":"Favorites","uuid":"802cc7ad-4fb9-421a-8362-4eeb16ac5034","photoUrl":"https://ucarecdn.com/cd8f0e77-6339-4774-ac79-f8333400b7cb/","title":"Bewitched - Laufey","type":"ALBUM"},"Favorites:{\"uuid\":\"ec6bf122-10e3-485d-8e3f-0384230e9644\"}":{"__typename":"Favorites","uuid":"ec6bf122-10e3-485d-8e3f-0384230e9644","photoUrl":"https://ucarecdn.com/9c7c375c-8b73-4979-9682-1b375729c7c4/","title":"Lionel Messi","type":"ATHLETE"},"CausesSupported:{\"uuid\":\"dede9137-6dc2-4d1f-969f-f8a552aca465\"}":{"__typename":"CausesSupported","uuid":"dede9137-6dc2-4d1f-969f-f8a552aca465","name":"Aryan Ashraya","description":"\u003cp\u003eAryan Ashraya is an orphanage in India dedicated to fostering education!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/70a93982-237a-4596-9bd7-591c5997de2f/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1e456cf0-a08f-4d84-b5f9-d548725a5d13\"}":{"__typename":"DeepDives","uuid":"1e456cf0-a08f-4d84-b5f9-d548725a5d13","content":"\u003cp\u003eIf I could talk to my middle or high school self, I would tell him one thing: have fun. I know it sounds cliché, but hear me out. Over these 7 years, you'll have many days when you're just feeling off. Maybe you'll struggle on a test one day, or you'll do badly on an assignment; it happens. However, that's not what you'll remember. You'll remember those days when you were sitting in chemistry with a few of your friends laughing away. Or, you'll remember getting McDonald's with your parents after a hard test. It's so easy to get caught up in the whirlwind that life is right now: grades, extracurriculars, college–it's all so much to think about. But, no matter the struggles, no matter the inevitable amount of hard work you are going to put in in the next few years, enjoy the ride! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ab39deca-4143-48da-b55b-c4e506119501\"}":{"__typename":"DeepDives","uuid":"ab39deca-4143-48da-b55b-c4e506119501","content":"\u003cp\u003eI began programming in 5th grade when my father introduced me to Java. Since then, the software world has hooked me. One of the biggest things that entices me about programming is the endless possibilities. As advanced as contemporary programming may seem, programming is still a relatively new practice. It still has a very long way to go, with a plethora of discoveries yet to be made, innovations yet to be created, and lives yet to be changed. Since I began programming, I have been determined to learn, grow, and research enough to push the boundaries of this field.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs I started out, my first experience occurred early in middle school, when I was studying for my first SAT. I searched the internet for any tools to help me study, but time and time again I was disappointed with what I found. On one website, I didn’t like the scoring. On another, the timing feature was subpar. Growing increasingly frustrated, I began thinking about how I could solve this myself. Could I make my own study tool? Engulfing myself in research, I read articles, watched videos, and stumbled my way through building my very first website. Determined to make my own SAT prep website, I learned HTML, CSS, Flask–a Python web framework–and more to become a beginner full-stack developer. Thus, my passion for learning in the programming field began.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"309a5c80-12f6-47d5-947a-a76c27c6cc8e\"}":{"__typename":"DeepDives","uuid":"309a5c80-12f6-47d5-947a-a76c27c6cc8e","content":"\u003cp\u003eEvery evening, my family comes together to pray. We’re all in the prayer room, laughing and enjoying each other's company, all the while mesmerized by the new alternating spiral flower patterns my mother added the night before. Then, together, we light a small lamp, a diya, and offer prasad to our gods in the form of water and mishri all the while joking about my brother’s new haircut and unpacking our daily lives. Finally, when everything is set, we begin singing our daily aarti, a devotional song. I sing and drum the dholak, closing my eyes as I get lost in singing aartis in prayer, safe and united. This is my safe space. It’s a special place where laughter and peace flood the room, encompassed by loved ones.\u0026nbsp; I’ve learned how important it is to carve out intentional spaces for connection. This lesson is the biggest tenet I try to bring to my teaching style. I want to be that space for connection in the lives of my students, and I want to build and atmosphere that feels comfortable to them just like this feels for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0ec957a2-87ff-41e1-b703-980ddec97d7f\"}":{"__typename":"DeepDives","uuid":"0ec957a2-87ff-41e1-b703-980ddec97d7f","content":"\u003cp\u003eAs a suburban kid at a public NC high school, I didn’t have many CS-related resources, clubs, or mentors. As a result, I, along with many aspiring programmers felt stifled by the lack of resources. One of my peers, Davis, in particular, was sorely passionate about Game Development (GD) and had many fantastic ideas that he wanted to implement. However, with public resources for GD being so convoluted, he was unable to make any headway without a supportive environment to explore new concepts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSeeing our struggles, I started my school’s first Coding Club. Immediately, students flooded onto the scene, including Davis. By working in a team with common goals and unique knowledge bases, Davis and I not only learned the principles of GD, but our team won 2nd place at the district-wide CMS Esports League with over 500 students.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEver since then, my fellow teammates and I banded together and dared to explore the endless abyss of challenging CS topics. By testing our collective resolve, we’ve accomplished a plethora of achievements, such as building an LLM-powered study website and placing 2nd in the Congressional App Challenge.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI simply wanted to create a supportive CS community for suburban North Carolina students before I left my hometown. Today, I have the same itch to create something valuable enough to leave behind for previous generations—this time with my students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"1cc404aa-d2d4-4a0b-ad0b-ad5a33b72dd8\"}":{"__typename":"School","uuid":"1cc404aa-d2d4-4a0b-ad0b-ad5a33b72dd8","name":"Butler High School","city":"Matthews","type":"HIGH","state":"North Carolina","country":"United States","zip":"28105"},"Education:{\"uuid\":\"720c0e2f-80ab-4409-acfb-258300413c92\"}":{"__typename":"Education","uuid":"720c0e2f-80ab-4409-acfb-258300413c92","school":{"__ref":"School:{\"uuid\":\"1cc404aa-d2d4-4a0b-ad0b-ad5a33b72dd8\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b421ee9e-9ce9-4b79-a81e-3d6bcf32953f\"}":{"__typename":"Education","uuid":"b421ee9e-9ce9-4b79-a81e-3d6bcf32953f","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Computer Science B.S./M.S.","degree":null},"MentorPublicProfile:{\"uuid\":\"5ea686ac-f730-4cd5-8863-2e358083beea\"}":{"__typename":"MentorPublicProfile","uuid":"5ea686ac-f730-4cd5-8863-2e358083beea","displayName":"Arush S.","slug":"arush-srivastava","biography":"\u003cp\u003eHi! I’m Arush. I’m a computer science student at Yale, and I’ve always been someone who likes turning ideas into things you can actually build, test, and show off.\u003c/p\u003e\u003cp\u003eMy main focus as a mentor is helping students develop passion projects in computer science. I love working with students who have the spark of an idea but aren’t sure how to shape it yet. Maybe it’s an app that solves a real problem, a personal website, a machine learning project, a game, or a data project built around something they care about like sports or music. I help students take that early concept and turn it into something concrete, technically strong, and genuinely impressive. A finished project should feel polished, personal, and meaningful.\u003c/p\u003e\u003cp\u003eI’ve built startup concepts, coded full-stack applications, worked on data-driven finance models, and competed in innovation competitions where execution matters just as much as creativity. I know what it feels like to get stuck halfway through a build and how satisfying it is to push through and ship something real. That experience shapes how I guide students through their own projects. I care about structure, follow-through, and making sure big ideas don’t fade out.\u003c/p\u003e\u003cp\u003eAlongside passion project mentorship, I’ve supported students academically in math and computer science, including algebra, precalculus, calculus, statistics, and introductory programming. I’ve worked one on one with students preparing for exams and strengthening their foundations. I focus on building clarity and confidence so that students feel comfortable tackling harder problems independently.\u003c/p\u003e\u003cp\u003eOutside of academics, I try to stay balanced. I play the violin in the Berkeley College Orchestra, and music has been part of my life for years. Rehearsals are one of my favorite parts of the week. There’s something powerful about sitting in a full orchestra, listening closely, and adjusting in real time so the whole group sounds cohesive. Performing after weeks of practice is intense and incredibly rewarding.\u003c/p\u003e\u003cp\u003eWhen I’m not coding or playing violin, I’m usually either gaming, traveling, or listening to music. I gravitate toward strategy and story-driven games because I like thinking about design, pacing, and decision-making. Traveling is something I genuinely enjoy, whether that means exploring a new city, trying local food, or just walking around without a strict plan. And my music taste reflects all of this. It jumps from classical concertos to hip hop to indie to whatever I discovered at midnight the night before.\u003c/p\u003e\u003cp\u003eI’m curious, driven, and easy to talk to. I care about building things that last and helping students do the same.\u003c/p\u003e","teachingVideoPlaybackId":"fMuWPCSn01w021UCdCH1jgbypMfS6Fx00902MMhs00pFnyVo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d2507082-6461-4c3f-936c-cea3a6b52f60\"}"},{"__ref":"Favorites:{\"uuid\":\"802cc7ad-4fb9-421a-8362-4eeb16ac5034\"}"},{"__ref":"Favorites:{\"uuid\":\"ec6bf122-10e3-485d-8e3f-0384230e9644\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"dede9137-6dc2-4d1f-969f-f8a552aca465\"}"}],"major":"Computer Science B.S./M.S.","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1e456cf0-a08f-4d84-b5f9-d548725a5d13\"}"},{"__ref":"DeepDives:{\"uuid\":\"ab39deca-4143-48da-b55b-c4e506119501\"}"},{"__ref":"DeepDives:{\"uuid\":\"309a5c80-12f6-47d5-947a-a76c27c6cc8e\"}"},{"__ref":"DeepDives:{\"uuid\":\"0ec957a2-87ff-41e1-b703-980ddec97d7f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4f86aea3-f69d-4ec2-857e-3f6fd9d8a1fe/-/preview/-/format/jpg/","https://ucarecdn.com/e5e45c68-dd67-443c-ae1b-e7e02560cae3/-/preview/-/format/jpg/","https://ucarecdn.com/8c973269-1384-487e-9cff-5a1c259680ad/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"720c0e2f-80ab-4409-acfb-258300413c92\"}"},{"__ref":"Education:{\"uuid\":\"b421ee9e-9ce9-4b79-a81e-3d6bcf32953f\"}"}],"hiredAt":"2026-02-04T21:59:19.334Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Computer Science","Music","History Project","Business / Entrepreneurship","Coding / Programming","Web Desig
