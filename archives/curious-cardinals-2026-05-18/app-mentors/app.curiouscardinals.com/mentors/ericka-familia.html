xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7dc411ec-9db0-4210-b5aa-50916a642e6f\"}":{"__typename":"Favorites","uuid":"7dc411ec-9db0-4210-b5aa-50916a642e6f","photoUrl":"https://ucarecdn.com/507572a6-3634-4cd3-bbf7-4aaae56d6352/","title":"Bad Bunny","type":"ARTIST"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6d5c66d4-5490-4695-8608-bb5225dd94b9\"}":{"__typename":"DeepDives","uuid":"6d5c66d4-5490-4695-8608-bb5225dd94b9","content":"\u003cp\u003eI chose to study Social Studies, a relatively unique major, because I wanted the opportunity to explore a topic I was deeply interested in—racialization in Latin America and the Caribbean—from an interdisciplinary perspective. Majoring in Social Studies ultimately allowed me to approach the topic from multiple social science lenses, such as history, anthropology, and sociology. My studies culminated in a senior thesis project, in which I extensively researched and wrote about anti-racist, feminist activism in the Dominican Republic today—my most challenging and rewarding academic endeavor thus far!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"081d5d82-088c-49b1-80fe-e4866f96c1ae\"}":{"__typename":"DeepDives","uuid":"081d5d82-088c-49b1-80fe-e4866f96c1ae","content":"\u003cp\u003eA life goal I have had since I was really young is to become 100% fluent in at least five languages! As a daughter of Dominican immigrants born and raised in the Bronx, New York, I speak English and Spanish as native languages. I also took Mandarin Chinese for several years in high school and college, and am currently living in Taiwan for the next year, so I hope to improve substantially during my time here! Additionally, I can understand and speak a bit of Portuguese after taking \"Introduction to Portuguese for Spanish Speakers\" during my last semester of college, and would love to spend some time living in Brazil! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7ed14315-0b5a-405b-a68f-0c66c7ed1f40\"}":{"__typename":"DeepDives","uuid":"7ed14315-0b5a-405b-a68f-0c66c7ed1f40","content":"\u003cp\u003eHaving transferred from an all-girls public school that I had attended for nearly ten years to a predominantly white private school for 9th grade, I spent much of high school trying to prove to myself and others that I belonged there. Looking back, the number one piece of advice I would give high school Ericka is reassurance that, although few others looked like me and shared my experiences, I deserve to be there and should spend my valuable time pursuing classes, friendships, and activities that truly bring me happiness, rather than trying to fit the mold of who I think the \"ideal\" student should be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"ebe5e575-6532-4978-8c24-9de0e98cd08e\"}":{"__typename":"School","uuid":"ebe5e575-6532-4978-8c24-9de0e98cd08e","name":"Horace Mann School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"902a52ec-da5f-452d-9942-b4c0d8032176\"}":{"__typename":"Education","uuid":"902a52ec-da5f-452d-9942-b4c0d8032176","school":{"__ref":"School:{\"uuid\":\"ebe5e575-6532-4978-8c24-9de0e98cd08e\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"76790718-c61c-4c2f-a81d-03b1b098e36f\"}":{"__typename":"Education","uuid":"76790718-c61c-4c2f-a81d-03b1b098e36f","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Social Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"3e2eb725-76d8-4c1e-ab87-c871c3e837d6\"}":{"__typename":"MentorPublicProfile","uuid":"3e2eb725-76d8-4c1e-ab87-c871c3e837d6","displayName":"Ericka F.","slug":"ericka-familia","biography":"\u003cp\u003eHi! My name is Ericka, and I’m so excited to join the Curious Cardinals team as a mentor! I was born and raised in the Bronx, New York, where both of my parents settled after immigrating to the U.S. from the Dominican Republic several decades ago. I graduated from Harvard University in May 2025 with a Bachelor’s Degree in Social Studies with a focus on Latin American history and culture. I also minored in Ethnicity, Migration, and Rights and completed a language certificate in Mandarin Chinese.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passion for mentorship and education has been shaped by my own journey. Growing up, my mom ran a family daycare out of our home, and I served as her unofficial “assistant” from a young age. Through that experience, I witnessed first-hand the power of early education and individualized attention and mentorship in a young person’s growth. In college, I carried this passion forward by directing an afterschool program for third through eighth graders from low-income backgrounds. As a first-generation college student, I know what it’s like to navigate academics and the education system as a whole without always having the guidance you need. While I was fortunate to have great mentors along the way, there were many moments where I had to figure things out on my own. These experiences shaped my belief in the importance of accessible mentorship, and I hope to be that person for students who might need extra support.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I’m living in Taichung, Taiwan, where I work as an English Teaching Assistant at an elementary school. I will be attending Harvard Law School in two years, with the goal of using my law degree to empower children and youth. In the meantime, I am eager to continue teaching and mentoring through Curious Cardinals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d be a strong match for elementary school students who need support in any academic area, as well as middle and high school students seeking help with reading and writing, history, or college applications. I strive to make learning engaging and enjoyable—helping students not only reach their goals, but also cultivate confidence and a love of learning—in part why I was drawn to Curious Cardinals’ mission.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not teaching, you can find me going on long walks, weight training, visiting history and culture museums, spending time with my family and friends, or listening to reguetón. I can’t wait to meet my mentees and help them grow, both as students and individuals!\u003c/p\u003e","teachingVideoPlaybackId":"8FhpFuo8Vf2eAyORp3Pr01C2IyLisGXDJCirHLCD02Rek","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eLast summer, I was admitted to Harvard Law School through the Junior Deferral Program! Although it was challenging balancing law school applications with college demands, especially studying for the LSAT, it was very rewarding in the end and definitely worth it. For the next two years, I have the opportunity to explore other interests and endeavors before matriculating in the fall of 2027!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"7dc411ec-9db0-4210-b5aa-50916a642e6f\"}"}],"causesSupported":[],"major":"Social Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6d5c66d4-5490-4695-8608-bb5225dd94b9\"}"},{"__ref":"DeepDives:{\"uuid\":\"081d5d82-088c-49b1-80fe-e4866f96c1ae\"}"},{"__ref":"DeepDives:{\"uuid\":\"7ed14315-0b5a-405b-a68f-0c66c7ed1f40\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e55f7c29-b564-4092-bf09-349ee957217e/-/preview/-/format/jpg/","https://ucarecdn.com/0a6c6569-bd35-40f2-a05b-3e3950e038e9/-/preview/-/format/jpg/","https://ucarecdn.com/b2093c1b-d80b-44a2-8419-b1a83024a1e3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"902a52ec-da5f-452d-9942-b4c0d8032176\"}"},{"__ref":"Education:{\"uuid\":\"76790718-c61c-4c2f-a81d-03b1b098e36f\"}"}],"hiredAt":"2025-08-21T03:11:42.511Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ericka-familia\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3e2eb725-76d8-4c1e-ab87-c871c3e837d6\"}"}}},"_sentryTraceData":"798214c31b0047889b001bd700fcdf6c-a1edf70d1995ac51-1","_sentr
