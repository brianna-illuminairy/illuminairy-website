ip":"63376"},"Education:{\"uuid\":\"395a723a-461a-4b41-bb88-fe7ff1a3ac24\"}":{"__typename":"Education","uuid":"395a723a-461a-4b41-bb88-fe7ff1a3ac24","school":{"__ref":"School:{\"uuid\":\"f3485548-02ed-4311-828f-b6b233b0b293\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a4249384-0456-448b-be95-93dacac98c56\"}":{"__typename":"Education","uuid":"a4249384-0456-448b-be95-93dacac98c56","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Bioastronautics Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"b4279af1-2e2f-4a71-b50c-bdcf7b64868d\"}":{"__typename":"MentorPublicProfile","uuid":"b4279af1-2e2f-4a71-b50c-bdcf7b64868d","displayName":"Jade N.","slug":"jade-nguyen","biography":"\u003cp\u003e\u003cstrong\u003eMy name is Jade Nguyen, and I grew up in St. Peters, MO. I now reside in San Jose after graduating from Stanford University last June with a degree in Bioastronautics Engineering. My personal identities, including being biracial (half Vietnamese and half white), pansexual, and coming from a low-income background, have been pivotal in shaping my life and ambitions. Growing up, I struggled to find role models I could relate to, which has fueled my desire to become a mentor for future generations.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eCommunity engagement has always been a cornerstone of my life. I became actively involved in my local community by helping to organize and research initiatives for a group adversely affected by a nearby radiation landfill. At a town hall meeting, I spoke passionately about the issues, challenging the EPA directly, which was a significant moment for me. Even as a high school student, I realized I could effect real change.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eDuring my time at Stanford, I was part of the Stanford Student Space Initiative, where I had the opportunity to present at the UN in Vienna and lead a team of over 80 engineers to successfully launch a liquid motor rocket. I then had an internship where I contributed to designing displays and controls for a lunar lander, interacting with astronauts and gaining invaluable experience.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eI took a gap year during COVID, working as an EMT in San Francisco, where I played a role in vaccinating hundreds and providing patient care in the Bay Area. The following summer, I continued my EMT work in a remote Alaskan town. Most recently, I served as a Staff Scientist at NASA Ames Research Center, working on missions involving experiments with mice flown in space, a galactic cosmic radiation beamline, and an 8-foot centrifuge. These diverse experiences have solidified my goal of attending medical school to become an aerospace physician.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMentoring is essential for student success. Having someone in your corner—guiding, teaching, and encouraging you—can make a significant difference. I know I wouldn’t be where I am today without the support of my mentors. My experiences in childcare and tutoring have taught me how to connect with students from various backgrounds. I focus on understanding each individual, meeting them where they are, and building foundational skills that can be applied across different goals.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eIn my mentoring sessions, I start by getting to know the student and understanding their objectives. We then work on any organizational skills needed to achieve those goals, followed by content and its applications. I believe in making learning engaging and enjoyable, and I bring a goofy, down-to-earth energy to each session, which helps foster a positive environment.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eI am eager to work with my future mentees and look forward to a journey filled with fun, learning, and growth. Together, we can navigate challenges, celebrate successes, and cultivate a passion for learning. Let’s get started on this exciting journey together!\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlaybackId":"D004s9kLzwaGAbGYQK7X01k6ctGnCKdJPS7YvOGhCB01u4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhen I was a Staff Scientist at NASA, I worked on an experiment that flew to the International Space Station where I got to collaborate with astronauts and work with mice that lived in space!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"3adcb953-5f9a-42b0-acb2-1959eda05a9b\"}"},{"__ref":"Favorites:{\"uuid\":\"70127474-3f82-49cd-821b-bb5d5f1a6267\"}"},{"__ref":"Favorites:{\"uuid\":\"d842cce5-35ed-4266-893d-5732d36f681d\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6b57b0f6-c587-4d22-9aa9-9b8f9b36a4aa\"}"},{"__ref":"CausesSupported:{\"uuid\":\"4838bbc1-ae96-40a9-b4e3-d2c493da787a\"}"}],"major":"Bioastronautics Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e14cfb50-0262-46e9-abba-0e15ed0adb25\"}"},{"__ref":"DeepDives:{\"uuid\":\"c07731e9-22d2-44ff-aaf4-b50f5125f0dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4ccb044-8654-41a8-9d09-993b8ab56e53\"}"},{"__ref":"DeepDives:{\"uuid\":\"83eeec31-517d-479a-81f9-258472029cc5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c116d392-6e8d-47f0-b21c-5ba5d12eecf1/-/preview/-/format/jpg/","https://ucarecdn.com/95f6ad68-217d-4818-b82d-70a47b162f8d/-/preview/-/format/jpg/","https://ucarecdn.com/05b9d345-7d25-436e-8167-9364cfb705ec/-/preview/-/f
