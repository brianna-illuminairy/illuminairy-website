xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5fb365b4-580f-4632-8b40-62733225b2c5\"}":{"__typename":"Favorites","uuid":"5fb365b4-580f-4632-8b40-62733225b2c5","photoUrl":"https://ucarecdn.com/f2c975f4-8c34-4a53-b09a-912eaa66c2ea/","title":"Channel Orange","type":"ALBUM"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a0fbfa81-64e4-431e-8bc6-d8869d7c0724\"}":{"__typename":"DeepDives","uuid":"a0fbfa81-64e4-431e-8bc6-d8869d7c0724","content":"\u003cp\u003eThough I am pursuing a career as a filmmaker, I dream of one day becoming a teacher too. Perhaps as a lecturer at a university teaching a film course or starting a filmmaking summer camp. Somewhere I can bring my passions for filmmaking and teaching into one. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c33db1ba-64eb-480c-8029-602c2d59888f\"}":{"__typename":"DeepDives","uuid":"c33db1ba-64eb-480c-8029-602c2d59888f","content":"\u003cp\u003eWin an Academy Award. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"5cab857d-f043-44a0-9f5e-75593285ed87\"}":{"__typename":"DeepDives","uuid":"5cab857d-f043-44a0-9f5e-75593285ed87","content":"\u003cp\u003eAn explorer! Growing up with a family of immigrants, I didn't really have anything telling me what I should do. Because of that, I tried almost everything I heard about -- robotics, speech and debate, theater, eSports, piano, activism, filmmaking, and more. While only some sticked (no more acting for me!), exploring all of these different pathways really helped me become who I am today. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"be1f446b-6b57-4c94-81bf-689a8ff378b4\"}":{"__typename":"DeepDives","uuid":"be1f446b-6b57-4c94-81bf-689a8ff378b4","content":"\u003cp\u003eI love video games. I'm actually in the top 0.01 percent of players in a game called League of Legends, and I was in the top 50 players in the US in a game called Teamfight Tactics. I even qualified for the world championships in Paris!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"ceca08f5-7b93-46ce-baab-40f4c8e0ec12\"}":{"__typename":"School","uuid":"ceca08f5-7b93-46ce-baab-40f4c8e0ec12","name":"Palm Desert High School","city":"Palm Desert","type":"HIGH","state":"CA","country":"USA","zip":"92211"},"Education:{\"uuid\":\"4c25e9eb-41e9-45a8-99fa-e5529dd073a1\"}":{"__typename":"Education","uuid":"4c25e9eb-41e9-45a8-99fa-e5529dd073a1","school":{"__ref":"School:{\"uuid\":\"ceca08f5-7b93-46ce-baab-40f4c8e0ec12\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"9495ab14-0517-4f81-9274-0dbbd8ec55d7\"}":{"__typename":"Education","uuid":"9495ab14-0517-4f81-9274-0dbbd8ec55d7","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Art, Film, and Visual Studies","degree":null},"Testimonial:d2b06f7b-c35f-4df0-baed-eafa6cfad91d":{"__typename":"Testimonial","id":"d2b06f7b-c35f-4df0-baed-eafa6cfad91d","text":"My son's experience with his Curious Cardinals mentor Matthew has been successful way beyond my highest expectations. Thanks to Matthew, he has gained confidence in his work, and begun to structure his passion into specific measurable results, including winning a number of prestigious writing awards. As he gears up to apply to college next year, I believe Curious Cardinals and Matthew have set him up for success.","date":"2025-06-04 17:48:37.056+00","rating":5,"endorser":{"__typename":"Endorser","name":"Bobbi Rebell Kaufman","tagline":"","avatar":null}},"Testimonial:305479aa-38fc-4390-8bd1-c8092df4222c":{"__typename":"Testimonial","id":"305479aa-38fc-4390-8bd1-c8092df4222c","text":"Matthew has been the absolute best mentor Rohan could have asked for. He is patient, encouraging and has the technical expertise to guide Rohan well. Over the past year Rohan learned multiple skills while making his first movie: script writing, camera angles, lighting, green screen effects, and Adobe Premiere Pro. Beyond the technical aspects, Matthew also helped Rohan with softer/ project management skills like thinking ahead, planning for execution, and reflecting on what can be improved. He has also been flexible with his time - especially when it gets tricky to stay on track with shooting (because of actor schedules, school events) - and that support means a lot to us because it reduces stress and makes it easy to work together. Matthew also has a positive and cheerful presence, which makes every session fun for Rohan!\n\nWe’re deeply grateful for all of Matthew’s efforts. He’s had a real impact on Rohan's growth - one that will last for Rohan's lifetime - and we couldn’t have asked for a better mentor! Thanks so much Matthew!","date":"2025-06-03 07:44:15.634+00","rating":5,"endorser":{"__typename":"Endorser","name":"Niketha Sushilkumar","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"584cb06b-52b7-4689-9cab-4ff3b6a4e11b\"}":{"__typename":"MentorPublicProfile","uuid":"584cb06b-52b7-4689-9cab-4ff3b6a4e11b","displayName":"Matthew C.","slug":"matthew-chang","biography":"\u003cp\u003eMy name is Matthew and I was born in Palm Springs, California and am currently living in Los Angeles, California. I graduated from Harvard in 2023 with a degree in Film Production (and a minor in government) where I studied closely under Chilean filmmaker Dominga Sotomayor Castillo, the first woman to ever win the directing prize at the Locarno Film Festival. My own short films have screened at numerous film festivals around the country (including HollyShorts and Dances with Films), and I am currently developing my feature directorial debut, which will begin production in late 2026. On my free time, I enjoy video games, Pokemon cards, staying active, and consuming all the literature I can. I'm constantly at the movies (thank you AMC A-List!), reading a new book, or meeting a new person and connecting about their unique experiences in life. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition, I have a decade of experience working on various creative projects, from short-form content that has garnered millions of views on Youtube to award-winning film scripts, as well as video games, plays, and everything in between. I know exactly what it takes to bring an idea to life, and how to push the idea to its fullest creative limits. I am passionate about working with my mentees to bring their creative visions to life in a manageable, efficient way, building their portfolios and urging them to think more critically about their art and how it affects/is influenced by the world around them. In the past, my mentees have been interviewed by news outlets on their projects, selected for special arts programs, and have even won national awards for projects that we've developed together. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince graduating college in 2023, I've spent time working at Creative Artists Agency (the biggest talent agency in Hollywood that works with talent of the highest caliber such as Brad Pitt, Margot Robbie, Paul Thomas Anderson, Jordan Peele, and etc) as well as Anonymous Content (a production company behind household titles such as Eternal Sunshine of the Spotless Mind, Spotlight, and The Revenant). Every day, I work with experienced writers and filmmakers on films with million-dollar budgets, A-list actors, and premieres at places like Sundance and Cannes. This gives me special insight into the film industry that share with my mentees, allowing us to be more informed on the best way to create and display our projects. With all my mentees, I hope to plant the seed for an illustrious, fulfilling creative life. And of course, TO HAVE FUN!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"AM01hL6KQsMugUDDpNH9Hss7ksY4vgvcEZghNdLqs01UM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eScreening my film on the main screen at the TCL Chinese Theater on Hollywood Boulevard.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5fb365b4-580f-4632-8b40-62733225b2c5\"}"}],"causesSupported":[],"major":"Art, Film, and Visual Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a0fbfa81-64e4-431e-8bc6-d8869d7c0724\"}"},{"__ref":"DeepDives:{\"uuid\":\"c33db1ba-64eb-480c-8029-602c2d59888f\"}"},{"__ref":"DeepDives:{\"uuid\":\"5cab857d-f043-44a0-9f5e-75593285ed87\"}"},{"__ref":"D
