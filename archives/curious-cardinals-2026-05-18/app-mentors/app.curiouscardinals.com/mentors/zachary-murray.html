xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"365aee54-74d0-49d2-b38f-2c4d08503d9e\"}":{"__typename":"DeepDives","uuid":"365aee54-74d0-49d2-b38f-2c4d08503d9e","content":"\u003cp\u003eI want to be a doctor because it is the one career that demands everything I have: intellectual rigor, human connection, leadership under pressure, and an unwavering commitment to showing up for others on their hardest days.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"668a7690-2111-4e12-aa7d-2dfcb0ddfb61\"}":{"__typename":"DeepDives","uuid":"668a7690-2111-4e12-aa7d-2dfcb0ddfb61","content":"\u003cp\u003eI am extremely proud to say that I play professional hockey, a dream I have been working toward since I first laced up skates as a kid. Reaching the professional level required years of sacrifice, resilience, and an unwavering belief in myself through every setback, and wearing that jersey is something I do not take for granted for a single moment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d1ddd044-9c06-42b1-bbdf-e10e58fcb79c\"}":{"__typename":"DeepDives","uuid":"d1ddd044-9c06-42b1-bbdf-e10e58fcb79c","content":"\u003cp\u003eOutside of hockey, I am an outdoorsman at heart — I love fishing, spending time at the beach, and staying active through pickup basketball and soccer. More than anything, I value the time I get to spend with my friends and family.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"91810cf1-9cd2-4c80-bbc0-1f377d3b205f\"}":{"__typename":"DeepDives","uuid":"91810cf1-9cd2-4c80-bbc0-1f377d3b205f","content":"\u003cp\u003eIf I could give my high school self one piece of advice, it would be pour everything you have into the effort, attitude, and preparation that are entirely within your hands. Trust that if you show up every single day and do the work, the results will take care of themselves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"9df712b3-2eba-4313-b34a-77ac98b95966\"}":{"__typename":"School","uuid":"9df712b3-2eba-4313-b34a-77ac98b95966","name":"West Potomac High School","city":"Alexandria","type":"HIGH","state":"Virginia","country":"United States","zip":"22307"},"Education:{\"uuid\":\"8b181380-f7d1-46df-bc6a-89f61402cba4\"}":{"__typename":"Education","uuid":"8b181380-f7d1-46df-bc6a-89f61402cba4","school":{"__ref":"School:{\"uuid\":\"9df712b3-2eba-4313-b34a-77ac98b95966\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"4d09ffed-cb50-4e82-9419-fd0241ee208c\"}":{"__typename":"School","uuid":"4d09ffed-cb50-4e82-9419-fd0241ee208c","name":"Amherst College","city":"Amherst","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"01002"},"Education:{\"uuid\":\"c44be8fa-96ef-4491-80c2-ae427996c769\"}":{"__typename":"Education","uuid":"c44be8fa-96ef-4491-80c2-ae427996c769","school":{"__ref":"School:{\"uuid\":\"4d09ffed-cb50-4e82-9419-fd0241ee208c\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"8fbe634a-bc0d-42de-b85f-0516225fede1\"}":{"__typename":"MentorPublicProfile","uuid":"8fbe634a-bc0d-42de-b85f-0516225fede1","displayName":"Zachary M.","slug":"zachary-murray","biography":"\u003cp\u003eMy name is Zachary Murray, and I am a recent graduate of Amherst College, where I majored in neuroscience while competing as a varsity ice hockey player. I grew up moving across the country — Rhode Island, Alaska, Virginia, Oklahoma — which gave me an early appreciation for adaptability, building relationships quickly, and finding common ground with people from all different backgrounds.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Amherst, I pushed myself both inside and outside the classroom. I published two peer-reviewed papers in clinical sports medicine research, completed a senior neuroscience thesis investigating the effects of caffeine and stress on performance, and conducted patient outcomes research at MD Anderson Cancer Center in Houston, where I spent a summer shadowing six orthopedic oncology surgeons. I was nominated by the Neuroscience Department for magna cum laude honors, named a Krampade Academic All-American Scholar twice, and selected for the NESCAC Winter All-Academic Team in each of my three eligible seasons.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics and athletics, I served as the Diversity, Equity, and Inclusion representative for the hockey team, coordinated our Team Impact partnership, and was invited by a professor to serve as a Teaching Assistant for Being Human in STEM — a course exploring identity, equity, and systemic barriers in science. These experiences deepened my commitment to creating inclusive spaces where every person feels seen and supported. I believe that the best learning happens when students feel comfortable enough to ask questions, make mistakes, and engage honestly — and I work hard to create that environment in every setting I am part of.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about education and mentorship because I know firsthand what it means to walk into an unfamiliar room and feel like you don't belong. Whether it was a new school, a new billet family, or a new research lab, I have always had to earn my place by working hard and showing genuine curiosity. That experience made me a better learner — and I believe it makes me a better teacher. I meet every student where they are, without judgment, and take genuine pride in helping them find confidence in subjects they once found intimidating.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am currently playing professional hockey for the Tulsa Oilers in the East Coast Hockey League while pursuing my goal of attending medical school.\u003c/p\u003e","teachingVideoPlaybackId":"oGySgI0201nW8uEpnc36oIWjYLO3THE3X01m02sEdRN1PCw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"365aee54-74d0-49d2-b38f-2c4d08503d9e\"}"},{"__ref":"DeepDives:{\"uuid\":\"668a7690-2111-4e12-aa7d-2dfcb0ddfb61\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1ddd044-9c06-42b1-bbdf-e10e58fcb79c\"}"},{"__ref":"DeepDives:{\"uuid\":\"91810cf1-9cd2-4c80-bbc0-1f377d3b205f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3f57fb3c-728e-46e1-a1e0-8985e5fedd49/-/preview/-/format/jpg/","https://ucarecdn.com/d2aa7442-3080-44d1-aed3-f5e1a96deb94/-/preview/-/format/jpg/","https://ucarecdn.com/cfaf7577-a8a9-49ca-8bcf-622aec9512e0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8b181380-
