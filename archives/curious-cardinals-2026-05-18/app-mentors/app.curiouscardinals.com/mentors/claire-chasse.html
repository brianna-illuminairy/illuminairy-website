of my studio. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"02377530-24d5-4c86-8003-1a9d7a1898e1\"}":{"__typename":"DeepDives","uuid":"02377530-24d5-4c86-8003-1a9d7a1898e1","content":"\u003cp\u003eMentorship matters to me because of the huge role that my own mentors have played in helping me become the confident, happy, and creative adult I am today. Thank you to JLT, Melody, Cammy, and Brooke for always believing in me and helping me learn to believe in myself, too!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9b4df3b1-8970-4f47-9165-a29958cbd78a\"}":{"__typename":"DeepDives","uuid":"9b4df3b1-8970-4f47-9165-a29958cbd78a","content":"\u003cp\u003eIn my spare time, I try to learn as many art media as I can get my hands on. From whittling, to knitting, to embroidery, to lithography, I always have an exciting new art venture up my sleeve. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f15ffaf5-0209-4369-89eb-8b2dc7c0b98b\"}":{"__typename":"School","uuid":"f15ffaf5-0209-4369-89eb-8b2dc7c0b98b","name":"Grant High School","city":"Portland","type":"HIGH","state":"Oregon","country":"United States","zip":"97212"},"Education:{\"uuid\":\"051e6318-b832-4dd7-9547-eab11e42a611\"}":{"__typename":"Education","uuid":"051e6318-b832-4dd7-9547-eab11e42a611","school":{"__ref":"School:{\"uuid\":\"f15ffaf5-0209-4369-89eb-8b2dc7c0b98b\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"673f3e87-43db-4aa6-8985-6b9fb54491fd\"}":{"__typename":"Education","uuid":"673f3e87-43db-4aa6-8985-6b9fb54491fd","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Visual art, Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"00198d52-4cfd-4bef-9a8f-65b1730cced4\"}":{"__typename":"MentorPublicProfile","uuid":"00198d52-4cfd-4bef-9a8f-65b1730cced4","displayName":"Claire C.","slug":"claire-chasse","biography":"\u003cp\u003e\u003cstrong\u003eHey there!\u003c/strong\u003e My name is Claire and I’m an artist who loves to teach and believes in the power of art to bring people together. Growing up as an anxious kid who didn’t always have the confidence to express myself out loud, I have long gravitated towards art, from drawing, to creative writing, to making videos. Over the years, my art practice has helped me build confidence and allowed me to form some of the most meaningful connections of my life. From my beloved art teachers and mentors to my artist friends and younger artists I’ve met through my teaching work, I’ve found that art can be a powerful way to build community and understanding in a world that can often feel isolating and individualistic.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMy art experience: \u003c/strong\u003eI’ve been an illustrator of magazines and newspapers for 8 years, winning a national award for a comic I made through CSPA (Columbia Scholastic Press Association). I’ve spent two years curating the visual section of an independent newspaper, where I enjoyed meeting and collaborating with other artists. I’ve had two solo shows of my artwork which included paintings, drawings, and textile work, earned honors from Brown University for my visual art thesis show, been selected for juried exhibitions, and won best in show in an exhibition in my hometown. I’ve been fortunate enough to receive an excellent arts education through the college level, learning techniques from bookbinding, to bespoke shoemaking, to oil painting and letter-press printing from experts. I’ve co-founded a sustainable fashion business with two other artists, with our first collection selling out on the first day we launched. In short, I love to create, no matter the medium, and have technical training in a variety of media.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA benefit of working with me is that in addition to my artistic background and technical training, I have strong project management skills and know how to keep a project going on track- I currently work in development at a nonprofit. Additionally, I have a great love for teaching, and hope one day to become a full-time art teacher and visual artist.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMy teaching experience: \u003c/strong\u003eI have worked in teaching since my first ever job, in high school, as an arts instructor for elementary aged children with hearing impairments. I greatly value individual mentorship and meeting students where they are at in terms of interests, learning styles, and skill level in different areas. I was recently a one-on-one English tutor for a 10-year-old learning English, whom I met with every day for a summer and led in creative writing and grammar practice activities. I’ve also interned at Create More, Fear Less, a nonprofit that creates art projects designed for children with anxiety, where I gave speeches and designed art projects. Additionally, I’ve worked as a math tutor for a middle school boy with ADHD, an assistant teacher to a high-school level gender studies course taught over Zoom, and a live-in resident assistant at Brown University’s Pre College program, where I helped my high school age residents adjust to living away from home and taking college-level courses. I believe that the key to teaching is forging strong relationships with students, and sharing my positive energy and outlook on the world. \u003cstrong\u003eI can help you create something awesome, and have a lot of fun while you're doing it!\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"sMLjH02m7qY5f6201NOoWFBg5BcmMOhzUDxQMedR6ERBc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"12a71b18-aec8-418d-8f9f-16fa3d3caa3b\"}"},{"__ref":"Favorites:{\"uuid\":\"2f5eab60-73bb-4b02-99a7-8b601744c63a\"}"}],"causesSupported":[],"major":"Visual art, Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"60a733f7-8c76-43f6-9122-e79699ff300a\"}"},{"__ref":"DeepDives:{\"uuid\":\"e32d7173-8c91-447e-952d-f9fe863c17b1\"}"},{"__ref":"DeepDives:{\"uuid\":\"02377530-24d5-4c86-8003-1a9d7a1898e1\"}"},{"__ref":"DeepDives:{\"uuid\":\"9b4df3b1-8970-4f47-9165-a29958cbd78a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/92ec6d2e-5022-4cf3-a02d-ce63384bf550/-/preview/-/format/jpg/","https://ucarecdn.com/f4448b05-62b0-4fb4-b0b0-f7c40309d3b7/-/preview/-/format/jpg/","https://ucarecdn.com/5f11d98c-7ee0-4ffd-b4f7-fd9d4d8a7c27/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"051e6318-b832-4dd7-9547-eab11e42a611\"}"},{"__ref":"Education:{\"uuid\":\"673f3e87-43db-4aa6-8985-6b9fb54491fd\"}"}],"hiredAt":"2024-07-24T15:45:51.494Z","topics":["6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","History Project","Video / Photography","Law /
