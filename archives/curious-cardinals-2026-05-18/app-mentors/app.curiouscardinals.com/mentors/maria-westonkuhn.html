xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"612af2c0-23d2-4a4c-b6f0-3b2ba138c451\"}":{"__typename":"Favorites","uuid":"612af2c0-23d2-4a4c-b6f0-3b2ba138c451","photoUrl":"https://ucarecdn.com/42c67f35-13b6-4592-bde3-614fa3c5607b/","title":"Hilma Af Klint","type":"ARTIST"},"Favorites:{\"uuid\":\"6c2325d5-9f0e-41f1-af79-e02c0dcb1cd6\"}":{"__typename":"Favorites","uuid":"6c2325d5-9f0e-41f1-af79-e02c0dcb1cd6","photoUrl":"https://ucarecdn.com/77d38998-5fc9-4307-8f12-917976361456/","title":"Trick Mirror","type":"BOOK"},"Favorites:{\"uuid\":\"453449ce-289f-4379-ac10-c430349e7ce3\"}":{"__typename":"Favorites","uuid":"453449ce-289f-4379-ac10-c430349e7ce3","photoUrl":"https://ucarecdn.com/0000f03c-ad10-4f46-acee-1e01ba341d13/","title":"Buffalo Bills","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"11362a9d-b0c4-4d1c-9fa9-c954569b4251\"}":{"__typename":"DeepDives","uuid":"11362a9d-b0c4-4d1c-9fa9-c954569b4251","content":"\u003cp\u003eIn high school, I spent my summers doing two things: working a hospitality job and spending time outside. Although it can be very helpful to do school- or academic- focused work in the summer, I valued the lessons learned from a different kind of work. Whether it was food-running steaming plates of overflowing mussels up and down a restaurant's back stairs, selling award-winning cupcakes at a downtown storefront and farmers market for 12 hours straight, or just working as a cashier at the town market down the road, these customer-service jobs taught me how to connect with everybody I meet, the value of elbow-grease, and to never underestimate how hard those around you are working. Plus, now I know how to make a mean Boston Cream Cupcake!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3c0e797f-514a-4da0-87b0-7ac68e6e1348\"}":{"__typename":"DeepDives","uuid":"3c0e797f-514a-4da0-87b0-7ac68e6e1348","content":"\u003cp\u003eOne passion project I've been working on for over 5 years is making cars safe for women. While this journey has looked different at times, it all began when my family and I survived a head-on crash in December 2019. Since that time, I've started  national 501(c)3 and 501(c)4 nonprofits, met and worked with Senators and Members of Congress on both sides of the aisle, appeared on national news networks like ABC, NBC News, Good Morning America, the Kelly Clarkson Show, Politico, and more, and published my essays in Ms. Magazine, Fast Company, and others. For the past two Congresses, I've had the great privilege of collaborating with four bipartisan Senators (Fischer, Blackburn, Murray, and Duckworth), to introduce the She DRIVES Act, that was recently advanced unanimously through the Senate Commerce Committee and will hopefully be passed into law soon.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"86a66e1f-d8cf-4587-b400-85b02112f78d\"}":{"__typename":"DeepDives","uuid":"86a66e1f-d8cf-4587-b400-85b02112f78d","content":"\u003cp\u003eI did not expect to choose the major I did! I entered Dartmouth as a STEM student, expecting to be pre-med, after focusing my classes and clubs around science while in high school. However, when I got to school, I took an introductory political science course on a whim, and fell in love. I didn't abandon science entirely (I studied neuroscience/psychology too) -- but once I started with political science and government, I knew I wanted to work in the field for the rest of my career.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"2de72845-cf28-4fc7-97e5-88fdf63d6228\"}":{"__typename":"DeepDives","uuid":"2de72845-cf28-4fc7-97e5-88fdf63d6228","content":"\u003cp\u003eI am choosing to mentor because so many have mentored me. I know the impact that a helping hand, a word of advice, or even a listening ear, can have, especially when you feel like you're struggling. It's my dream to give back some of the many opportunities and gifts that others have granted me -- whether that's from teachers, tutors, mentors, friends, coaches, or anyone who helped me somewhere along the way. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"9d4ffa7a-8870-45c3-ba80-60287d844893\"}":{"__typename":"School","uuid":"9d4ffa7a-8870-45c3-ba80-60287d844893","name":"Falmouth High School","city":"Falmouth","type":"HIGH","state":"Maine","country":"United States","zip":"04105"},"Education:{\"uuid\":\"ebc3d786-0276-4971-9436-ff1aca271487\"}":{"__typename":"Education","uuid":"ebc3d786-0276-4971-9436-ff1aca271487","school":{"__ref":"School:{\"uuid\":\"9d4ffa7a-8870-45c3-ba80-60287d844893\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"bfbf857c-8d2c-480d-a746-3153b154a454\"}":{"__typename":"Education","uuid":"bfbf857c-8d2c-480d-a746-3153b154a454","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2023","major":"Political Science, Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"b9434798-9f53-44b2-8d93-5982eb581635\"}":{"__typename":"MentorPublicProfile","uuid":"b9434798-9f53-44b2-8d93-5982eb581635","displayName":"Maria W.","slug":"maria-westonkuhn","biography":"\u003cp\u003eMy name is Maria and I'm so excited to be a Curious Cardinal Mentor. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm from Portland, Maine, and went to Dartmouth College for a year before transferring to Columbia University in 2020. I graduated from Columbia with a degree in Political Science and Psychology in February 2023 with a 3.92 GPA and as a member of both the Pi Sigma Alpha National Political Science Honor Society and Psi Chi International Honor Society in Psychology.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSoon after graduating, I started my own 5019(c)3 non-profit to continue work I'd been doing since 2019 -- advocating on behalf of women and girls across the nation to make cars safer for everybody. My work on this issue, and the organization, have been featured on NBC News, Politico, Good Morning America, the Kelly Clarkson Show, and more. I'm excited to be going back to school in the fall as a 1L at NYU Law.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work, I love to spend time with friends, play outside, thrift, read, see live music \u0026amp; sports, do crosswords and jigsaw puzzles, cheer for the Buffalo Bills, and run (my last picture was after my first marathon, last year!). I also love to fish, surf, hike, camp, and more -- I spent my winter backpacking through South America and volunteering on organic farms. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost of all, I love to help people fulfill their highest potential. I hope to help you, or your student, succeed academically and personally; I hope to grow your knowledge, confidence, and just make your day better and brighter than it was before. I can offer specific academic help, including math, science (I was a neuroscience and psychology tutor at Dartmouth and Columbia, respectively!), writing, reading, history, government, policy, and more; I can also assist in making your passion project a reality. Every new challenge is an opportunity to make the world a better place, and to make yourself a kinder, smarter, and more successful individual. Let's get started!\u003c/p\u003e","teachingVideoPlaybackId":"NyQelitFX7rfhMX5Jgevlmu1zw0201016DX9epTXRJMsV4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"612af2c0-23d2-4a4c-b6f0-3b2ba138c451\"}"},{"__ref":"Favorites:{\"uuid\":\"6c2325d5-9f0e-41f1-af79-e02c0dcb1cd6\"}"},{"__ref":"Favorites:{\"uuid\":\"453449ce-289f-4379-ac10-c430349e7ce3\"}"}],"causesSupported":[],"major":"Political Science, Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"11362a9d-b0c4-4d1c-9fa9-c954569b4251\"}"},{"__ref":"DeepDives:{\"uuid\":\"3c0e797f-514a-4da0-87b0-7ac68e6e1348\"}"},{"__ref":"DeepDives:{\"uuid\":\"86a66e1f-d8cf-4587-b400-85b02112f78d\"}"},{"__ref":"DeepDives:{\"uuid\":\"2de72845-cf28-4fc7-97e5-88fdf63d6228\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9e26428b-770b-468d-a148-536f7d900e5c/-/preview/-/format/jpg/","https://ucarecdn.com/2a8e2bff-2717-4334-b0ae-13ebc87c44b5/-/preview/-/format/jpg/","https://ucarecdn.com/7ed01a58-ab2d-4c33-a1f5-4acae031a401/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ebc3d786-0276-4971-9436-ff1aca271487\"}"},{"__ref":"Education:{\"uuid\":\"bfbf857c-8d2c-480d-a746-3153b154a454\"}"}],"hiredAt":"2025-04-02T12:39:54.054Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Biology","Writing","Academic Coaching","College Essay Writing","Reading","History","Executive Function","History Project","STEM Project","Law / Government / Policy","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/ceacbeeb-af28-4003-96cf-d977276b04ef/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/9fa2d8bf-132f-4356-a39d-e6f0aecb3e5b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maria-westonkuhn\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b9434798-9f53-44b2-8d93-5982eb581635\"}"}}},"_sentryTraceData":"4188a16d187b4bd5857882501a400879-aea0ab2140e1cac7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4188a16d187b4bd5857882501a400879,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"maria-westonkuhn"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}
