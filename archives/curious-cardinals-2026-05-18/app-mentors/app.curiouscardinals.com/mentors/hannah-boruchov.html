xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"591807cd-b135-4419-b2bc-d97df9b5c879\"}":{"__typename":"Favorites","uuid":"591807cd-b135-4419-b2bc-d97df9b5c879","photoUrl":"https://ucarecdn.com/c09373c1-0010-4798-ba74-14b26dbeb194/","title":"Nicole Eisenman","type":"ARTIST"},"Favorites:{\"uuid\":\"7fa1d80a-cfdc-4fd1-9eff-02b77d5eecf6\"}":{"__typename":"Favorites","uuid":"7fa1d80a-cfdc-4fd1-9eff-02b77d5eecf6","photoUrl":"https://ucarecdn.com/c09373c1-0010-4798-ba74-14b26dbeb194/","title":"Boyhood","type":"MOVIE"},"Favorites:{\"uuid\":\"7ffd8cbb-c917-4744-8f7e-ee672c5b28a2\"}":{"__typename":"Favorites","uuid":"7ffd8cbb-c917-4744-8f7e-ee672c5b28a2","photoUrl":"https://ucarecdn.com/c09373c1-0010-4798-ba74-14b26dbeb194/","title":"skiing","type":"SPORT"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"52181815-4bc1-4ad3-af31-bc68a04e06bc\"}":{"__typename":"DeepDives","uuid":"52181815-4bc1-4ad3-af31-bc68a04e06bc","content":"\u003cp\u003eIn one of my final classes at Northwestern, I learned how to use a CNC machine and for our final project we were allowed to make anything that could fit in a 4\" x 4\" aluminum block. I designed several rings with unique contours to be precisely carved out on the CNC. My first batch of rings came out so great that I designed 10 more to make for friends and family. This project was a perfect culmination of engineering, art, and human centered design/usability. I designed several rings with unique geometries inspired by mathematical equations. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7f9b522f-5739-4e3e-80aa-3bb85fe0d388\"}":{"__typename":"DeepDives","uuid":"7f9b522f-5739-4e3e-80aa-3bb85fe0d388","content":"\u003cp\u003eI've always enjoyed making things in hands on experiences. The mind to hand connection is something I value strongly, and I love sketching, prototyping, and designing new objects. I chose Mechanical Engineering because I was in love with math and physics, but I knew I wanted to expand outside of the notebook and use that knowledge to make things in the real world. Because I have so many interests, I chose the most broad engineering major so I could have more freedom in deciding my career path. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"bf9638d9-896d-4d2b-a9a6-a67fbfb5bd65\"}":{"__typename":"DeepDives","uuid":"bf9638d9-896d-4d2b-a9a6-a67fbfb5bd65","content":"\u003cp\u003eI worked in a cancer immunology lab at the Jackson Laboratory for two summers, and I learned more than I ever could in a classroom about the scientific method. When I first got there, it was like everyone around me was speaking a different language. As I moved onto different data analysis projects within the lab, I started gaining a context for the important research we were all working on. In my second summer, I got the chance to work in the wet lab where I stained frozen human tumor tissue with fluorescent biomarkers in meticulously timed procedures, in preparation for capturing real data from these samples using a laser confocal microscope. It was thrilling to take a 1 inch tissue sample and peer into the cellular level, a snapshot of exactly what the cells were doing. Being at the forefront of scientific discovery fueled my passion for science with the end goal of helping others. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"205b08ef-15c8-43cd-90e9-9042f1ed7351\"}":{"__typename":"DeepDives","uuid":"205b08ef-15c8-43cd-90e9-9042f1ed7351","content":"\u003cp\u003eBefore college, I didn't have much mentorship outside of my family members. I always had family friends or peers that I looked up to, but I was too shy to reach out to them for mentorship. Once I worked on my confidence and connected to myself, I started being a mentor wherever I could to provide a helping hand to those who need it. I believe that empowering others is so important and being a part of their growth is incredibly rewarding. I see mentorship as an opportunity to create meaningful relationships and connections with younger students that have the potential to last for years into the future. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"95a65ac4-9054-4797-a6f2-3ea6521c788e\"}":{"__typename":"School","uuid":"95a65ac4-9054-4797-a6f2-3ea6521c788e","name":"Avon High School","city":"Avon","type":"HIGH","state":"Connecticut","country":"United States","zip":"06001"},"Education:{\"uuid\":\"4e90f722-fd2e-4f04-bdbd-ed0243208519\"}":{"__typename":"Education","uuid":"4e90f722-fd2e-4f04-bdbd-ed0243208519","school":{"__ref":"School:{\"uuid\":\"95a65ac4-9054-4797-a6f2-3ea6521c788e\"}"},"startYear":"2016","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"6fcda516-420b-471b-bb61-38d5198690d7\"}":{"__typename":"Education","uuid":"6fcda516-420b-471b-bb61-38d5198690d7","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Mechanical Design Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"b0f82c78-a6a5-49db-a42a-89fc438533fa\"}":{"__typename":"MentorPublicProfile","uuid":"b0f82c78-a6a5-49db-a42a-89fc438533fa","displayName":"Hannah B.","slug":"hannah-boruchov","biography":"\u003cp\u003eI’m a recent graduate from Northwestern University with a Bachelor of Science in\u0026nbsp;\u003cstrong\u003emechanical engineering\u003c/strong\u003e\u0026nbsp;with a concentration in design. I\u0026nbsp;also minored\u0026nbsp;in\u0026nbsp;\u003cstrong\u003eart\u003c/strong\u003e, theory, and practice, and received the Segal \u003cstrong\u003eDesign\u003c/strong\u003e Certificate. I seek to combine my love for design with my interests, which include \u003cstrong\u003eproduct design\u003c/strong\u003e, \u003cstrong\u003esustainability\u003c/strong\u003e, and \u003cstrong\u003estudio arts\u003c/strong\u003e.\u0026nbsp;Having taken many STEM classes and being largely outnumbered in a classroom full of men, I'm all about \u003cstrong\u003eempowering women to pursue STEM\u003c/strong\u003e-related fields. At Northwestern I was an active member of the Society of Women Engineers, and I mentored several students to help guide them through choosing a major, picking classes for their schedule, and through overall adjustments to starting college. \u003cbr\u003e\u003cbr\u003eI utilize\u0026nbsp;creativity\u0026nbsp;to tackle challenging problems, employing both a\u0026nbsp;big picture\u0026nbsp;and\u0026nbsp;a detail-oriented\u0026nbsp;perspective. I've been a \u003cstrong\u003eproject manager\u003c/strong\u003e in many design projects throughout my time in college. I love overseeing design projects and breaking down big problems into actionable tasks. As a designer and artist, the power of observation contributes to my human centered approach to problem solving, and my strong \u003cstrong\u003ecuriosity about how things work\u003c/strong\u003e fuels my innovation process. I'm eager to guide young students through their own passion projects and help them take an idea on paper to the next level. I believe passion projects are of utmost importance for out of the classroom learning. Outside of Curious Cardinals, I love to make art and I am learning new design skills through independent projects.\u003cbr\u003e\u003cbr\u003eEver since I was little, I have had a burning passion for both STEM and art.\u0026nbsp;I initially believed that I would have to choose one passion over the other. I now know that is a choice that I'm unwilling to make. As I began taking engineering and art classes in tandem at Northwestern, I discovered the surprising parallels between these seemingly different domains. The critical thinking, problem-solving skills, and creativity required in both fields started to blend seamlessly.\u0026nbsp;I envision a world where artists and scientists collaborate openly, where the boundaries between disciplines blur, and where innovation thrives in the spaces where art and science intersect. As I continue my journey to integrate my passions for design, art, engineering, and science, I dream of contributing to projects that bridge the gap between these fields, and \u003cstrong\u003ementoring students in interdisciplinary projects\u003c/strong\u003e. \u003c/p\u003e","teachingVideoPlaybackId":"dvwx4qKd005pHSMLCVxQCmzMbe6vRgMb5lTLBKLhr6no","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__
