xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"32bea2a8-9945-4caf-a021-91af8efd7e52\"}":{"__typename":"DeepDives","uuid":"32bea2a8-9945-4caf-a021-91af8efd7e52","content":"\u003cp\u003eThey’re everywhere around me, \u003cem\u003eglistening\u003c/em\u003e, breathing life into the otherwise silent night sky. I’m too lost in their brilliant display to notice the misty fog creeping up, the frosty air bringing a chill that permeates through my body. I’m tormented as I stare at these million, trillion lifeless orbs.\u003cem\u003e How did we read these stars thousands of years ago? How have they changed in the past few millennia? What stories do they contain?\u003c/em\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThese ancient celestial bodies abruptly appeared one winter night by chance as I happened to look up from my campus. \u003cem\u003eHow did I not notice these stars before?\u003c/em\u003e Before long, I found myself walking back from study hall staring fixed at the stars, weekends spent lying on the concrete, holding up the star tracker app on my phone, and devoting Friday evenings to Astronomy Club, where I learned about the makeup of dwarf planets and climate change effects on our orbital rotation. Days turned to weeks, then months, and soon it became an instinct to look up the moment that darkness draped the sky. My dorm room soon became illuminated with fluorescent glow-in-the-dark stars as I tried to map out an astronomically-correct sky.\u0026nbsp;\u003c/p\u003e\u003cp\u003eLooking back now.\u003c/p\u003e\u003cp\u003eI had fallen into a rabbit hole that one innocent night and chose to continue traversing down. Now less than a year later, I had managed to learn about our planet's ISS route, researched the possibility of life in a ‘Goldilocks’ zone, and memorized over half of the major stars and constellations in the Northern Hemisphere.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"549ab099-a80e-4b76-965a-312b6cce04d1\"}":{"__typename":"DeepDives","uuid":"549ab099-a80e-4b76-965a-312b6cce04d1","content":"\u003cp\u003e\"We have learned to love ourselves, so now I urge you to speak yourself.\" The world of advocacy opened up when I first learned about UNICEF listening to BTS’s Love Myself campaign during my freshman year. I fell down a rabbit hole as I quickly realized that child welfare—protecting the most vulnerable from poverty and harm—was not just an issue, but one that resonated with the core of who I am. From refugee crises to education inequality, children often suffer the worst consequences of global instability. That injustice fuels my passion for creating sustainable, systemic solutions that empower youth and ensure their right to safety, education, and mental health. By majoring in Global Development, I hope to apply expand my skills in impact-driven consulting and international projects integrating ethical business practices.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"3affeba1-461e-42e6-a85a-dcfe46ab3bc0\"}":{"__typename":"DeepDives","uuid":"3affeba1-461e-42e6-a85a-dcfe46ab3bc0","content":"\u003cp\u003eI was chosen to be a boarding school prefect for my senior year of highschool and through this role, I was given a chance to help acclimate students into their upperclassmen years and build a home for students from around the world. Having experienced the feelings of attending a private boarding school as a low income and first generation student, I know how life changing it feels to someone to confide in. With this in mind, I became not only their prefect, but one of their best friends. And so, they talked to me. They talked to me about their plans for Harvest Weekend, they talked to me about their favorite dining hall desserts, and they talked to me about how worried they were with SATs, or if their chosen classes would be too hard for them. In those moments, I shared my personal experiences with them—my struggles, my journey, how I found my support system and how I was assured that they would find theirs. By creating a comfortable environment, I was able to lead and guide the students in a much more impactful way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"5316316a-1ef0-4b73-933e-2ed2e0d06dbd\"}":{"__typename":"DeepDives","uuid":"5316316a-1ef0-4b73-933e-2ed2e0d06dbd","content":"\u003cp\u003eI had always considered myself well-informed about global issues. That was until a conversation my junior year shattered that perception. I discovered that there were student refugees at our neighboring schools who had fled their homes in Syria, with one losing a sister due to the war.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThis information shocked me; although I had been aware of the refugee crises through the news, I had never grasped the depth of the situation. I had been able to live ignorantly, a blessing that they didn’t have. Recognizing that sympathy wasn’t enough, I felt compelled to act.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAfter searching the sea of advocacy programs, one caught my eye: the Welcoming Refugees project, a collaboration between Students Rebuild and UNICEF. Utilizing my UNICEF Club as a platform, we organized a campaign. We gathered drawing supplies and hand-cut postcard templates to make it as easy as possible for people to participate. Together with students and faculty, we raised $1400 and made 120 postcards and letters welcoming refugees to communities around the world.\u003c/p\u003e\u003cp\u003eThis experience wasn't only a proud achievement but a profound lesson in the power of taking initiative and going beyond conventional expectations. It taught me the importance of approaching every person and situation with respect and genuine curiosity as well as demonstrated that meaningful action far outweighs mere sympathy. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"140b2bb3-445e-46c4-bdf5-33f2d3f108c2\"}":{"__typename":"School","uuid":"140b2bb3-445e-46c4-bdf5-33f2d3f108c2","name":"George School","city":"Newtown","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"18940"},"Education:{\"uuid\":\"ec35e6fa-73a5-408e-80b7-0eda45ae4c89\"}":{"__typename":"Education","uuid":"ec35e6fa-73a5-408e-80b7-0eda45ae4c89","school":{"__ref":"School:{\"uuid\":\"140b2bb3-445e-46c4-bdf5-33f2d3f108c2\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"dcd111fe-310e-49ff-9383-8969768dde45\"}":{"__typename":"Education","uuid":"dcd111fe-310e-49ff-9383-8969768dde45","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Global Development","degree":null},"MentorPublicProfile:{\"uuid\":\"28499ad3-9269-48ad-bb9c-27eeb536dff2\"}":{"__typename":"MentorPublicProfile","uuid":"28499ad3-9269-48ad-bb9c-27eeb536dff2","displayName":"Christine Z.","slug":"christine-zhou","biography":"\u003cp\u003eHello, I am Christine Zhou, a freshman at Cornell University studying Global Development and Economics. I am a dedicated educator with a passion for critical thinking, academic excellence, and student empowerment. As the former Prefect of a private boarding high school, I honed my leadership skills and deep belief in perseverance and self-driven success—bringing this philosophy to every student I mentor. My experience spans across academics, leadership, and global advocacy. I founded and led my high school’s UNICEF chapter, served as Vice President of Future Business Leaders of America, and worked as an editor for the Social Science Alliance Team newspaper. I have a strong writing, research, and analytical thinking background, strengthened by my rigorous coursework in IB and AP classes.\u003c/p\u003e\u003cp\u003eBeyond academics, I am deeply committed to humanitarian aid and nonprofit strategy. I aspire to work with the United Nations on Sustainable Development Goals and believe strongly on having a global learning. I spent this winter break in Muscat, Oman and Saudi Arabia where I recently taught marketing and entrepreneurship to students. My global perspective and enthusiasm for learning allow me to connect with students in a way that expands both their knowledge and mindset.\u003c/p\u003e\u003cp\u003eAs a tutor, I specialize in fostering critical thinking, strong writing skills, and academic confidence. My approach is tailored to each student’s needs, ensuring they not only master the material but also develop the curiosity and skills to thrive beyond the classroom.\u003c/p\u003e","teachingVideoPlaybackId":"InxGktNZp5sbM7ykFxTsdtYN3pm02VPsfq3DbBEVdZn00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Global Development","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"32bea2a8-9945-4caf-a021-91af8efd7e52\"}"},{"__ref":"DeepDives:{\"uuid\":\"549ab099-a80e-4b76-965a-312b6cce04d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"3affeba1-461e-42e6-a85a-dcfe46ab3bc0\"}"},{"__ref":"DeepDives:{\"uuid\":\"5316316a-1ef0-4b73-933e-2ed2e0d06dbd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2438a19f-13e1-4515-bea1-650fec0702c8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ec35e6fa-73a5-408e-80b7-0eda45ae4c89\"}"},{"__ref":"Education:{\"uuid\":\"dcd111fe-310e-49ff-9383-8969768dde45\"}"}],"hiredAt":"2025-02-15T01:53:08.714Z","topics":["Algebra I","Algebra II","Writing","Mandarin Chinese","Academic Coaching","College Essay Writing","Economics","Executive Function","Reading","Business / Entrepreneurship","Sustainability","Public Speaking","Debate"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"christine-zhou\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"28499ad3-9269-48ad-bb9c-27eeb536dff2\"}"}}},"_sentryTraceData":"52cae826755748528d00a052f62cb29f-b6fb9d6103a75dd4-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=52cae826755748528d00a052f62cb29f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},
