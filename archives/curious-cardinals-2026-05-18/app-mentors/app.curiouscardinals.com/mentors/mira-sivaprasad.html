05c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"cfc8837a-8cc0-4c71-91e0-1b6f1424152c\"}":{"__typename":"DeepDives","uuid":"cfc8837a-8cc0-4c71-91e0-1b6f1424152c","content":"\u003cp\u003eMy versitality\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"4e106b1a-4973-485c-9ff6-65152e4455f8\"}":{"__typename":"School","uuid":"4e106b1a-4973-485c-9ff6-65152e4455f8","name":"Home Schooling","city":"Dubai","type":"HIGH","state":"Al Karama","country":"United Arab Emirates","zip":"00000"},"Education:{\"uuid\":\"ddf32a91-e6c2-4b0b-9f68-6971d66bf279\"}":{"__typename":"Education","uuid":"ddf32a91-e6c2-4b0b-9f68-6971d66bf279","school":{"__ref":"School:{\"uuid\":\"4e106b1a-4973-485c-9ff6-65152e4455f8\"}"},"startYear":"2019","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"372b8328-a880-4eca-9e24-f22dd761e5b2\"}":{"__typename":"Education","uuid":"372b8328-a880-4eca-9e24-f22dd761e5b2","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2027","major":"Robotics","degree":null},"MentorPublicProfile:{\"uuid\":\"00973d41-f6d4-4e69-ad21-3d7d368f90d5\"}":{"__typename":"MentorPublicProfile","uuid":"00973d41-f6d4-4e69-ad21-3d7d368f90d5","displayName":"Mira S.","slug":"mira-sivaprasad","biography":"\u003cp\u003eI’m a Robotics Engineering student at University of Pennsylvania, passionate about creating technology that improves people’s lives and helps build a more sustainable world. My fascination with engineering started with a simple curiosity about how things work — and that curiosity has evolved into a deep commitment to using robotics, design, and innovation to make a tangible difference.\u003c/p\u003e\u003cp\u003eAcademically, I’ve immersed myself in projects that combine technical problem-solving with social purpose. One of my earliest and most meaningful creations was an automation robot designed to safely carry hazardous waste materials. I built a 3D-printed gripper system capable of handling dangerous substances and developed safety packages for containment. That project taught me how powerful robotics can be when applied thoughtfully — not just to increase efficiency, but to protect lives.\u003c/p\u003e\u003cp\u003eMy interests later expanded toward medical robotics, where I began working on a semi-physical brain model for benchmarking transcranial magnetic stimulation (TMS) systems. This model, which I designed and simulated as part of my dissertation, integrates magnetic field modeling, physiological fluid systems, and the Hodgkin-Huxley neuron model. Its goal is to help researchers better understand how magnetic stimulation can be optimized to help people with neurodegenerative diseases like Alzheimer’s. For me, this project was not just a technical challenge — it was an opportunity to bridge robotics, neuroscience, and compassion.\u003c/p\u003e\u003cp\u003eOutside the lab, I’m an active member of Engineers Without Borders (EWB), where I’ve collaborated on community design challenges and helped host the University of Strathclyde Designathon. Our goal was to revitalize neglected areas of Glasgow by transforming them into vibrant, sustainable community spaces. I also took part in planning a multipurpose center in Govan that integrates vertical farming, tidal energy, and public art installations. These experiences have shown me that engineering is most impactful when it’s collaborative, creative, and rooted in empathy.\u003c/p\u003e\u003cp\u003eProfessionally, I’ve worked in the Emirates Airline Innovation Lab and the HW Innovation Lab, where I explored human-centered design, prototyping, and sustainable systems. These experiences strengthened my understanding of how research and industry can come together to create meaningful change.\u003c/p\u003e\u003cp\u003eWhat drives me most is the human side of technology — using robotics not as a luxury, but as a tool for accessibility, sustainability, and health. I’m particularly inspired by the field of assistive robotics, such as designing prosthetic arms and legs that restore independence and dignity.\u003c/p\u003e\u003cp\u003eAs a mentor, I want to share not just technical knowledge, but the mindset that makes innovation meaningful. I believe great engineering starts with empathy, curiosity, and the courage to explore ideas that might just make someone’s life a little better.\u003c/p\u003e","teachingVideoPlaybackId":"JAVPPJ76EeO100p65fsJBjfaGLZCiwc02HkRzsLYiGEKg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Robotics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a87f0754-22f7-4bc6-92dd-5afb03320ea2\"}"},{"__ref":"DeepDives:{\"uuid\":\"1a59f0e9-b527-43c2-b6a2-373b48288211\"}"},{"__ref":"DeepDives:{\"uuid\":\"e0a5c2da-181e-4289-84a2-53eba25e9ca2\"}"},{"__ref":"DeepDives:{\"uuid\":\"cfc8837a-8cc0-4c71-91e0-1b6f1424152c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/074a5dc7-2168-4f59-86fb-32b99ece571e/-/preview/-/format/jpg/","https://ucarecdn.com/76dc8986-263a-4513-9eb4-fc5925a34a1c/-/preview/-/format/jpg/","https://ucarecdn.com/17a4f4f7-fc1d-4722-8764-0f4c6c311b9b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ddf32a91-e6c2-4b0b-9f68-6971d66bf279\"}"},{"__ref":"Education:{\"uuid\":\"372b8328-a880-4eca-9e24-f22dd761e5b2\"}"}],"hiredAt":"2025-10-27T21:37:11.825Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Sci
