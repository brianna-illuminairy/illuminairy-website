xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8f1beb18-c946-4fb6-9469-a5a7d92889b2\"}":{"__typename":"Favorites","uuid":"8f1beb18-c946-4fb6-9469-a5a7d92889b2","photoUrl":"https://ucarecdn.com/d1b5152d-6e2e-4f0b-9af4-d96d9b1795fd/","title":"How to Defend Yourself by Liliana Padilla","type":"PLAY"},"Favorites:{\"uuid\":\"73252f90-a166-4d7a-8b6d-371a7d5560c4\"}":{"__typename":"Favorites","uuid":"73252f90-a166-4d7a-8b6d-371a7d5560c4","photoUrl":"https://ucarecdn.com/ad54f877-dd75-4c85-ab5a-4fa9539f29c0/","title":"Swimming","type":"SPORT"},"Favorites:{\"uuid\":\"85cb1dc2-3066-4c86-af60-3e983aa0bcab\"}":{"__typename":"Favorites","uuid":"85cb1dc2-3066-4c86-af60-3e983aa0bcab","photoUrl":"https://ucarecdn.com/bf55ad18-c22a-4243-a871-945875c18f0b/","title":"Los Angeles","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9a5d44ba-bc59-4f8f-8fbb-dfce183133be\"}":{"__typename":"DeepDives","uuid":"9a5d44ba-bc59-4f8f-8fbb-dfce183133be","content":"\u003cp\u003eI would tell my middle or high school self to \u003cstrong\u003edo less\u003c/strong\u003e \u003cstrong\u003eand enjoy more\u003c/strong\u003e!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a47cc106-a667-444c-88a6-84bfc4411b51\"}":{"__typename":"DeepDives","uuid":"a47cc106-a667-444c-88a6-84bfc4411b51","content":"\u003cp\u003eI hope to win an Emmy, Grammy, Oscar, or Tony award. Winning all four and achieving EGOT status would be awesome too.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"cd659a70-cf67-4f39-9f9f-39fe2dbb995b\"}":{"__typename":"DeepDives","uuid":"cd659a70-cf67-4f39-9f9f-39fe2dbb995b","content":"\u003cp\u003eI chose to major in English literature and Creative Writing because I wanted to become a better communicator and write my own stories. My introduction to creative writing was actually needing to write my personal statement for my college applications. I realized the power of words then, and I've continued writing since.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6add6857-7459-4c9d-ba89-b4c9c27035f6\"}":{"__typename":"DeepDives","uuid":"6add6857-7459-4c9d-ba89-b4c9c27035f6","content":"\u003cp\u003eMy dream job is being a muti-hyphenate artist: actor, writer, singer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"051329ef-be26-419c-ae96-2d20543d0194\"}":{"__typename":"School","uuid":"051329ef-be26-419c-ae96-2d20543d0194","name":"La Puente High School","city":"La Puente","type":"HIGH","state":"California","country":"United States","zip":"91744"},"Education:{\"uuid\":\"0ace25f4-5c00-4711-8a4b-9b78174e04f9\"}":{"__typename":"Education","uuid":"0ace25f4-5c00-4711-8a4b-9b78174e04f9","school":{"__ref":"School:{\"uuid\":\"051329ef-be26-419c-ae96-2d20543d0194\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4f78ec6b-bc5b-4b8f-a5d2-6dc8a58b1ac0\"}":{"__typename":"Education","uuid":"4f78ec6b-bc5b-4b8f-a5d2-6dc8a58b1ac0","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"English literature and Creative Writing","degree":null},"MentorPublicProfile:{\"uuid\":\"279458cc-366a-41ab-825b-e4ecdd5e693a\"}":{"__typename":"MentorPublicProfile","uuid":"279458cc-366a-41ab-825b-e4ecdd5e693a","displayName":"Rosana M.","slug":"rosana-maris-1","biography":"\u003cp\u003eHi there! I'm Rosana, a recent \u003cstrong\u003egraduate of Stanford University where I studied English literature and Creative Writing. I am a proud first-generation, low-income, and Latina college graduate. I'm excited about storytelling, music, literature, poetry, writing, theater, film \u0026amp; TV, and Spanish language.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, I spent a lot of time writing short stories for classes, wrote and directed short films, and acted in plays and student films.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI attended a traditional public high school that receives Title I funding and mainly serves low-income and first-generation college-going students. Going to college was never a question for me or my parents. Still, I felt lost, overwhelmed, and intimidated by the confusing college application process. I navigated the college application process and financial aid process on my own with help from teachers. In fact, I completed FASFA forms on my own whereas many of my peers at Stanford had their parents fill this out.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA Los Angeles native, I love all things Los Angeles and SoCal, from hiking to visiting Big Bear to enjoying the many artistic venues in the area. I write short screenplays, short stories, poems, personal essays, and am picking up playwriting. Can you tell I like to write?\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love music! I sing and play the alto saxophone. I can read music and tutor music theory. I enjoy all kinds of music; from instrumental to classical to movie scores to Jazz to Latin to rap.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI learned to swim about three years ago (it's never too late to learn new things!) and have been doing it ever since!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, my aim is to inspire students who identify as first-generation and low-income to attend and graduate from college. Additionally, I hope my mentees gain confidence and a sense of initiative to accomplish their goals, or develop personal, exciting, and independent creative projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"hijCli00tJ02aa8obfj2KwXYUpp8TsRne85xIpwJyqdcc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement has been being one of three \u003cstrong\u003eFulbright UK Summer Institute recipients\u003c/strong\u003e in 2022. I was awarded a scholarship to live and study at the University of Bristol in England for three weeks. After that,\u003cstrong\u003e I solo traveled in London and Wales. I completed 5th-grade-me's goal of visiting Buckingham Palace.\u003c/strong\u003e\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"8f1beb18-c946-4fb6-9469-a5a7d92889b2\"}"},{"__ref":"Favorites:{\"uuid\":\"73252f90-a166-4d7a-8b6d-371a7d5560c4\"}"},{"__ref":"Favorites:{\"uuid\":\"85cb1dc2-3066-4c86-af60-3e983aa0bcab\"}"}],"causesSupported":[],"major":"English literature and Creative Writing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9a5d44ba-bc59-4f8f-8fbb-dfce183133be\"}"},{"__ref":"DeepDives:{\"uuid\":\"a47cc106-a667-444c-88a6-84bfc4411b51\"}"},{"__ref":"DeepDives:{\"uuid\":\"cd659a70-cf67-4f39-9f9f-39fe2dbb995b\"}"},{"__ref":"DeepDives:{\"uuid\":\"6add6857-7459-4c9d-ba89-b4c9c27035f6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/99883012-2bd5-46d3-8642-621e0290f2e4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0ace25f4-5c00-4711-8a4b-9b78174e04f9\"}"},{"__ref":"Education:{\"uuid\":\"4f78ec6b-bc5b-4b8f-a5d2-6dc8a58b1ac0\"}"}],"hiredAt":"2025-04-25T22:56:13.006Z","topics":["K-5 Grade Math","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Music","Creative Writing","Film / Theater","Video / Photography","History Project","Law / Government / Policy","Journalism"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/6fbd7257-e9de-4421-8a0b-bde4a854891b/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"rosana-maris-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"279458cc-366a-41ab-825b-e4ecdd5e693a\"}"}}},"_sentryTraceData":"a243c3cf5462400e9e47b87e707d5e6e-9e77a6215bc8f637-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a243c3cf5462400e9e47b87e707d5e6e,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ros
