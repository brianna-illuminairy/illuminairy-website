ibuting in meaningful ways to things that I'm a part of and helping people be inspired and feel a similar way about topics and clubs I'm interested in.\u003cbr\u003e\u003cbr\u003eMy biggest strengths are communication and versatility. Ever since high school, I've always been a contributing member of a variety of organizations. I was student body vice president, first chair clarinetist, a peer mentor and tutor for students, and vice president of our model U.N. team. I also played tennis on the side! Through these clubs, I developed a unique set of skills to foster my connection with everyone. Whether you are an extrovert or an introvert, I learned ways to connect and form bonds with others.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently at Duke, I’m also exploring a wide set of interests. I’m the president of Duke’s premiere pre-professional technology organizations, am the external events chair for Duke KAjok (Korean Association), and have joined a dance team on campus. I also work at the Duke Innovation Makerspaces as a makerspace technician, where I help with hardware projects such as 3D printing, laser cutting, and water jetting. In my free time, I love playing pickleball and watching sports. Go Blue Devils!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve done a multitude of passion projects since high school. My favorite projects are projects where I can make an idea or a dream of mine come true while learning new things. I’ve created and launched a few apps, won hackathons (including TreeHacks), and done projects that involved both hardware (Arduino, Autocad, Raspberry Pi) and software.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Electrical and Computer Engineering, Computer Science","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/adf7594b-67b3-49f3-b55d-6783046e4f53/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE
