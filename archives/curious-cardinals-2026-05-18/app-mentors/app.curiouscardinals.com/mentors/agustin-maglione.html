xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"1b97005c-fdbc-4ca5-a92a-2653df93200f\"}":{"__typename":"DeepDives","uuid":"1b97005c-fdbc-4ca5-a92a-2653df93200f","content":"\u003cp\u003eIn the world of entertainment, it's tough for me to pick just one dream job. I'm always learning and eager to discover the many roles this diverse industry has to offer.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI love the idea of directing a fun, high-energy movie musical, something along the lines of 'Legally Blonde the Movie Musical.' At the same time, I'd jump at the chance to direct a Broadway revival of 'In the Heights.' I'm also drawn to the idea of producing unique works that tell meaningful stories close to my heart.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eManagement roles also catch my eye, like managing an international tour of 'Hamilton' or working with talented artists such as Lizzy Mcalpine. I'm interested in casting too. I hope to work in casting at The Telsey Office or aim for a high-level role like Vice President of Casting at a production company such as A24. The idea of working with people like Jennifer Vendetti, the casting director for 'Euphoria,' really excites me.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eIn terms of giving back, I'm interested in combining arts with education. One of my personal goals is to set up the first art school in the Dominican Republic, where I grew up.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eBut I'm not just focused on one job. I want to be a positive influence in the entertainment industry, taking on a range of different projects. For me, the journey is as important as the destination, and I'm excited to see where this adventure takes me! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"820c1f10-0e0a-4c74-a8ae-95a32bbbdce1\"}":{"__typename":"Education","uuid":"820c1f10-0e0a-4c74-a8ae-95a32bbbdce1","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021 ","endYear":null,"expectedGradYear":"2025","major":"Radio, Television, \u0026 Film ","degree":"2025"},"School:{\"uuid\":\"ac9d2520-b43b-494f-974d-147a19559a9e\"}":{"__typename":"School","uuid":"ac9d2520-b43b-494f-974d-147a19559a9e","name":"Interlochen Arts Academy ","city":"Interlochen ","type":"HIGH","state":"Michigan ","country":"United sates ","zip":"49643 "},"Education:{\"uuid\":\"f4e249d5-af8e-470e-a0e5-439664ab448d\"}":{"__typename":"Education","uuid":"f4e249d5-af8e-470e-a0e5-439664ab448d","school":{"__ref":"School:{\"uuid\":\"ac9d2520-b43b-494f-974d-147a19559a9e\"}"},"startYear":"2018 ","endYear":"2021 ","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"dc90c048-0afb-4f71-a3c9-df0e4df7ff0a\"}":{"__typename":"MentorPublicProfile","uuid":"dc90c048-0afb-4f71-a3c9-df0e4df7ff0a","displayName":"Agustin M.","slug":"agustin-maglione","biography":"\u003cp\u003eAgustin Maglione, a sophomore at Northwestern University studying Radio, Television, and Film with a minor in Theatre, has a multinational background from Puerto Rico, Argentina, and the Dominican Republic. He furthered his theatrical education at the Interlochen Arts Academy in Michigan and is now ambitiously involved at Northwestern, serving as the Marketing Manager for Arts Alliance and Public Relations Chair for Studio 22.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eBeyond management roles, Agustin is a skilled casting director for student productions and was the inaugural director for Northwestern's first multicultural theatre board, Vibrant Colors Collective. In the summer of 2022, he interned at Pinewood Studios, gaining key industry experience, and later served as a local casting assistant for Amazon Prime's \"Road House\".\u003c/p\u003e\u003cp\u003eAgustin's passion, academic achievements, and practical experiences display his dedication to the arts and entertainment industry. He is an inspiring figure for aspiring creatives and is making his mark in the sector as a student, artist, and future industry professional.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Radio, Television, \u0026 Film ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1b97005c-fdbc-4ca5-a92a-2653df93200f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6374e142-738f-4e09-bc73-6c5c18f04156/-/preview/-/format/jpg/","https://ucarecdn.com/7ec2d0e1-b8dc-41fd-8ab6-0e27b705fba2/-/preview/-/format/jpg/","https://ucarecdn.com/85d17390-dbf3-4a62-8948-fc5868caa6e6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"820c1f10-0e0a-4c74-a8ae-95a32bbbdce1\"}"},{"__ref":"Education:{\"uuid\":\"f4e249d5-af8e-470e-a0e5-439664ab448d\"}"}],"hiredAt":"2023-05-31T00:03:57.559Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","K-6 Storybook","Creative Writing","Music","Fashion / Cosmetics","Film / Theater","Video / Photography","Business / Entrepreneurship","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typ
