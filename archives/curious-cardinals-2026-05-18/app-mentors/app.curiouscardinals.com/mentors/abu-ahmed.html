xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"dcbe01a9-4bbf-412b-aba1-978da1541f00\"}":{"__typename":"DeepDives","uuid":"dcbe01a9-4bbf-412b-aba1-978da1541f00","content":"\u003cp\u003eMy dream job would be working as a quantitative developer at Jane Street. I really enjoy solving complex problems, building efficient systems, and thinking about how math, programming, and markets intersect, and Jane Street is the perfect place for me to explore those interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7ac58f4d-65ef-47d6-8182-b00f0ff4a7cf\"}":{"__typename":"DeepDives","uuid":"7ac58f4d-65ef-47d6-8182-b00f0ff4a7cf","content":"\u003cp\u003eI’d tell my high school self to experiment more with how I studied instead of sticking to the same old methods. Trying different study techniques, changing my environment, or even studying with music could’ve made learning more enjoyable and effective.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"893b241e-c73f-4da6-9856-ea34008352df\"}":{"__typename":"DeepDives","uuid":"893b241e-c73f-4da6-9856-ea34008352df","content":"\u003cp\u003eI chose my major because I’ve been coding since high school, starting with small projects on Roblox, and I fell in love with it. I liked how I could turn an idea into something real through code, and that curiosity eventually grew into a deeper interest that I wanted to pursue through studying computer science.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7363bcb3-512a-4eda-ba15-bb16d32909a8\"}":{"__typename":"DeepDives","uuid":"7363bcb3-512a-4eda-ba15-bb16d32909a8","content":"\u003cp\u003eMentorship matters to me because I benefited a lot from it in high school. My mentors helped me learn how to apply to college, explore computer science more seriously, and find opportunities I didn’t even know existed. Their guidance gave me direction and confidence when I wasn’t sure what path to take, and that’s something I want to pass on to others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"c82d12f3-ac36-4e16-a33f-da924be49ad8\"}":{"__typename":"School","uuid":"c82d12f3-ac36-4e16-a33f-da924be49ad8","name":"The Bronx High School of Science","city":"The Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10468"},"Education:{\"uuid\":\"4bd8fa8c-a7c3-4c58-b6f8-34625e54fc42\"}":{"__typename":"Education","uuid":"4bd8fa8c-a7c3-4c58-b6f8-34625e54fc42","school":{"__ref":"School:{\"uuid\":\"c82d12f3-ac36-4e16-a33f-da924be49ad8\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"69ec5f11-6626-4440-95d9-e8373dd82f7d\"}":{"__typename":"Education","uuid":"69ec5f11-6626-4440-95d9-e8373dd82f7d","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"8b37eb33-15c2-4a21-92d1-16db4f8ada72\"}":{"__typename":"MentorPublicProfile","uuid":"8b37eb33-15c2-4a21-92d1-16db4f8ada72","displayName":"Abu A.","slug":"abu-ahmed","biography":"\u003cp\u003eHi, I’m \u003cstrong\u003eAbu Ahmed\u003c/strong\u003e, a Computer Science student and current sophomore at Princeton University who enjoys exploring how technology, problem-solving, and creativity connect. I have always been curious about how things work and how to explain complex ideas in simple, understandable ways. Whether I am building software, studying new topics, or helping others learn, I like the process of breaking things down and discovering how different ideas fit together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore Princeton, I attended \u003cstrong\u003eThe Bronx High School of Science\u003c/strong\u003e, one of New York City’s top and specialized public high schools. I took 13 AP classes and several honors courses across math, physics, computer science, the humanities, and more. Bronx Science pushed me to think critically and approach learning with persistence. It also helped me appreciate how subjects overlap. For example, I started to see how writing clear arguments in English class was not so different from structuring a program in computer science or solving a physics problem. Outside of class, I spent a lot of time coding in \u003cstrong\u003eJavaScript\u003c/strong\u003e and \u003cstrong\u003ePython\u003c/strong\u003e, experimenting with small projects and exploring how technology can be creative as well as logical.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Princeton, I study topics like \u003cstrong\u003ealgorithms, data structures, and machine learning, operating systems, math, and physics.\u003c/strong\u003e I co-lead \u003cstrong\u003eHoagieMeal\u003c/strong\u003e, a web application that provides real-time dining information for students, and work on \u003cstrong\u003eBusiness Today’s\u003c/strong\u003e technology team to develop tools that manage large events and conferences. I am also part of \u003cstrong\u003eThe Daily Princetonian’s\u003c/strong\u003e technology team, where I create automated systems that preserve the newspaper’s digital archives. These projects have shown me how software connects with design, communication, and collaboration, and how meaningful work often happens at the intersection of disciplines.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis past summer, I was one of twelve students selected nationally for the \u003cstrong\u003eJane Street Software Engineering Fellowship\u003c/strong\u003e, where I built projects involving data processing, artificial intelligence, graphics, and simulation, culminating in a final project where I built a physics engine. The program taught me how to approach problems systematically, communicate ideas clearly, and stay calm under pressure.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond programming, I enjoy mentoring through \u003cstrong\u003eHoagie Club\u003c/strong\u003e, helping students build projects, improve their problem-solving skills, and develop confidence in their own abilities. I also enjoy learning and teaching topics outside of computer science, including math, writing, and logic. I believe that curiosity and persistence can make any subject approachable. As a mentor, I want to create an environment where students feel supported to ask questions, explore new ideas, and discover how learning across fields can inspire creativity and growth.\u003c/p\u003e","teachingVideoPlaybackId":"43T5n022LyEK8f01cZwLAtsXFBLDTeMStea9h6MlUqudo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dcbe01a9-4bbf-412b-aba1-978da1541f00\"}"},{"__ref":"DeepDives:{\"uuid\":\"7ac58f4d-65ef-47d6-8182-b00f0ff4a7cf\"}"},{"__ref":"DeepDives:{\"uuid\":\"893b241e-c73f-4da6-9856-ea34008352df\"}"},{"__ref":"DeepDives:{\"uuid\":\"7363bcb3-512a-4eda-ba15-bb16d32909a8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/62df114b-fb3b-4f77-916e-eaa41e126fc4/-/preview/-/format/jpg/","https://ucarecdn.com/58da4fb4-2d70-4dab-ae9e-781a1719380b/-/preview/-/format/jpg/","https://ucarecdn.com/79c9da5b-31c5-42ef-a4dc-ba8b80fe8000/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4bd8fa8c-a7c3-4c58-b6f8-34625e54fc42\"}"},{"__ref":"Education:{\"uuid\":\"69ec5f11-6626-4440-95d9-e8373dd82f7d\"}"}],"hiredAt":"2025-10-23T23:14:18.585Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Physics","Academic Coaching","Economics","Computer Science","Coding / Programming","Web Design","STEM Project","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/","https://ucarecdn.com/4f6b2e92-2aa8-4328-90be-11c5a7d63bc7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"abu-ahmed\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8b37eb33-15c2-4a21-92d1-16db4f8ada72\"}"}}},"_sentryTraceData":"388066ca52a342dfbf89808f68aa7228-a947c3f7ed03141a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-
