xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fb2dc6e1-60f8-4b82-a482-d74fc45452f8\"}":{"__typename":"Favorites","uuid":"fb2dc6e1-60f8-4b82-a482-d74fc45452f8","photoUrl":"https://ucarecdn.com/9256be90-aae9-4bba-9596-641d4be6c188/","title":"A Little Life by Hanya Yanagihara ","type":"BOOK"},"Favorites:{\"uuid\":\"6070f9f3-80d4-4a34-ae4d-085913095db9\"}":{"__typename":"Favorites","uuid":"6070f9f3-80d4-4a34-ae4d-085913095db9","photoUrl":"https://ucarecdn.com/ec3f8182-1607-4be4-a4ee-fd9e30123b50/","title":"Portrait of a Lady on Fire","type":"MOVIE"},"Favorites:{\"uuid\":\"3531a2ad-4a66-4aa3-a305-f148b4a2a379\"}":{"__typename":"Favorites","uuid":"3531a2ad-4a66-4aa3-a305-f148b4a2a379","photoUrl":"https://ucarecdn.com/a56545b0-5ec9-4977-97bc-6360c5ef44fb/","title":"Soccer!","type":"SPORT"},"CausesSupported:{\"uuid\":\"3a0477c4-e979-4843-a2d6-d81964257a25\"}":{"__typename":"CausesSupported","uuid":"3a0477c4-e979-4843-a2d6-d81964257a25","name":"Blessings in a Backpack","description":"\u003cp\u003eRaised over \u003cstrong\u003e$50,000 \u003c/strong\u003ein donations to feed kids on the weekends during COVID\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"53ba8acf-4f63-42ff-a320-83217c944bc6\"}":{"__typename":"CausesSupported","uuid":"53ba8acf-4f63-42ff-a320-83217c944bc6","name":"Siena House","description":"\u003cp\u003eReceived grant of \u003cstrong\u003e$10,000\u003c/strong\u003e in 10th Grade to support single mothers \u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7dca8c16-133a-474a-83ca-56cd40322514\"}":{"__typename":"DeepDives","uuid":"7dca8c16-133a-474a-83ca-56cd40322514","content":"\u003cp\u003eMentorship matters to me because it is a way to impart lessons I’ve learned and experiences I’ve had on others going through something similar, and it also allows me to learn new things, meet new people, and continue to explore the world around me. For mentorship to be successful, I believe it must be balanced – of course, a mentor-mentee relationship is still in place. But simultaneously, being a mentor means being incredibly in tune with your mentee, and letting them guide and shape the experience as much as you do. Mentorship, to me, is a reciprocal relationship built on trust, empathy, and active listening. While I may offer guidance and share what I've learned, I also remain open to being challenged, inspired, and changed by the perspectives of those I mentor. It’s a chance to foster growth – both theirs and mine – and to build meaningful connections rooted in mutual respect and curiosity. At the very least, I like to think that through mentorship, the challenges I’ve faced or overcome as a high schooler or middle schooler afford me the opportunity to validate someone else’s experience, offer support when it’s needed, and provide a sense of direction when things feel uncertain. It is the human connection that makes mentorship so powerful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"7bb55186-1aba-4977-92dd-f4f517e3813d\"}":{"__typename":"DeepDives","uuid":"7bb55186-1aba-4977-92dd-f4f517e3813d","content":"\u003cp\u003eMiddle school Calliope and high school Calliope were surprisingly different characters. Middle school me, who had just transferred to a more rigorous school from a Waldorf school, vastly preferred climbing trees in Central Park and jabbering away to friends in class than studying and doing homework. High school me, on the other hand, had a complete switch-up: I grew more academically focused and began taking advanced classes that challenged me, where I was genuinely thrilled to learn the material and engage with the professors. I also began participating in extracurriculars more, like clubs and student government, and above all, I began realistically seeing myself as someone who had a strong shot at attending a competitive university.\u0026nbsp;To me, it was all about a shift in mindset and priorities, which I wasn’t quite ready to make before going into 9th grade. I don’t regret my more laid-back approach to my studies in middle school. In fact, I think having the chance to naturally find my groove and my interest in school, instead of being forced into it, was a really wonderful aspect of my development, making me genuinely passionate about my studies. Especially in middle school, no one needs to be stressed out or too focused on their future –\u0026nbsp;they \u003cem\u003eshould \u003c/em\u003ebe climbing trees and having fun. Both versions of Calliope were valid, and I’m grateful for the journey between them. Looking back, I wouldn’t change a thing!\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f65bb824-ddde-4c79-bb05-ae50049300ee\"}":{"__typename":"DeepDives","uuid":"f65bb824-ddde-4c79-bb05-ae50049300ee","content":null,"videoPlaybackId":"q3YzYEXsb9vlLeNA400exgQDWgJMZB02kLvIdnoeXFlnM","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"d8503fc6-424b-4f46-bec7-feefd6760e68\"}":{"__typename":"DeepDives","uuid":"d8503fc6-424b-4f46-bec7-feefd6760e68","content":"\u003cp\u003eSomething I’m extremely proud of is the charity work I did for \u003cem\u003eBlessings in a Backpack\u003c/em\u003e (BIAB) during my last two years of high school. I was in 10th grade when COVID-19 hit, and it was around then that I began to fully understand the toll the pandemic was taking on low-income families –\u0026nbsp;especially in my own city. With schools moving online, many children were suddenly without the school-provided meals they depended on.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I learned more, I discovered BIAB, a charity focused on fighting food insecurity by supplying kids with meals over the weekend,\u0026nbsp;now shifting their efforts to cover weekdays during virtual learning. Around this time I also discovered the brand Popsockets, which makes phone grips, and saw that they had a charity initiative where you could design your own PopSockets grip and sell it, with the proceeds going to a charity of your choice. I decided to combine the two, and \u003cem\u003eBlessings in a Popgrip\u003c/em\u003e was born.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI created a website, wrote a press release to distribute, and did my best to develop a project that people would be willing to support financially. Raising money is never glamorous, and things started slow, but eventually, my initiative took off –\u0026nbsp;\u003cem\u003ePeople\u003c/em\u003e magazine featured the campaign online, and by the end, I had raised over $50,000 in donations –\u0026nbsp;far beyond what I had imagined. BIAB was able to bring a new school into their network –\u0026nbsp;PS-130 – and from there, I also helped campaign for the donation of 500 backpacks and 1,000 masks to further support the newly adopted school. BIAB also appointed me as their inaugural Teen Ambassador, and I helped create a video tutorial guide for the BIAB website on how to fundraise effectively and how to launch sustainable, student-led campaigns.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLooking back, I’m incredibly proud of this initiative,\u0026nbsp;not just because of what it achieved but because of where it started: with 16-year-old me recognizing a gap and wanting to help, however I could. Big things don’t begin big –\u0026nbsp;they start with one idea, one donation. I’m proud that mine made a lasting impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"a9445cfb-1455-4ef9-b54b-74b441a8ef0c\"}":{"__typename":"School","uuid":"a9445cfb-1455-4ef9-b54b-74b441a8ef0c","name":"Marymount School of New York","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10028"},"Education:{\"uuid\":\"1c684614-2dd5-4a20-b8d6-60cf0f46062a\"}":{"__typename":"Education","uuid":"1c684614-2dd5-4a20-b8d6-60cf0f46062a","school":{"__ref":"School:{\"uuid\":\"a9445cfb-1455-4ef9-b54b-74b441a8ef0c\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"ef510df4-0307-4d02-a7af-5b98823c56bb\"}":{"__typename":"Education","uuid":"ef510df4-0307-4d02-a7af-5b98823c56bb","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Health and Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"825ab997-b342-468b-bed5-03b880eec6c5\"}":{"__typename":"MentorPublicProfile","uuid":"825ab997-b342-468b-bed5-03b880eec6c5","displayName":"Calliope S.","slug":"calliope-speredakos","biography":"\u003cp\u003eHello! I'm Calliope, it's nice to meet you! I am a rising senior at Brown University, but I spent my junior year studying at Oxford in England. At Brown and Oxford, I study an interdisciplinary curriculum at the intersection of biology, anthropology, human health, and even business, and I have always been driven by paths and opportunities that are not straightforward or one-dimensional. I have taken content-heavy classes such as Physiology or Infectious Disease, and have balanced these in equal measure to classes like the Archaeology of Eating and Drinking or Human Osteoarchaeology, and extracurriculars like the Global Research and Consulting Group or Brown’s Global Health Advisory Committee. My love of interdisciplinary pursuits stems from my innate curiosity –\u0026nbsp;I love to explore, and to learn more, and to try new things, and these traits seep into all areas of my life. Studying at Oxford and living in England for the year, for example, was an experience I jumped into because I knew it would give me the opportunity to immerse myself in a new culture and really spend a significant amount of time there, learning and engaging with the community and environment –\u0026nbsp;both academic and social –\u0026nbsp;all around me. \u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eOutside of academics, I am very passionate about food and drink (trying new cuisines, learning about cultures and anthropology through food, traveling with a culinary lens), and especially the intersection of biology, health, and food. The past two summers, I recieved a grant from Brown to work on an organic Tuscan Vineyard and Farm called Castello di Potentino, learning about the care that goes into cultivating vines, producing wine, bottling, labeling, and shipping products, and earning a profit while simultaneously staying environmentally conscious and preserving the natural biodiversity and beauty of the land. This summer, I am working in London at Chiswick Auction House in their Wine and Spirits Department, learning about the intersection of culture, commerce, and craftsmanship and further exploring my interest in this area! Beyond these interests, I am also an avid reader, violinist, and paleontologist. I've been on many excavations, mostly in New Jersey and Florida, to uncover fossilized shark teeth and other assorted finds, and I am still in search of a hand-sized megaladon tooth to call my own! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Curious Cardinals, I see teaching/mentoring as a journey and learning opportunity for both mentee and mentor. This is why I am excited and open to helping students in a variety of fields, with tutoring but particularly with any passion projects they might want to pursue. I especially enjoy helping students build confidence, think creatively, and find their own voice and leadership abilities. I strive to be a mentor who listens closely, asks thoughtful questions, and helps students shape their goals in a way that’s exciting and achievable. In high school, I completed a passion project of my own called Girls’ STEMpede (check out the video below to learn more about it!), so I know what it takes to be motivated, have an idea, and see it through, and I’m excited to help other curious high schoolers and middle schoolers turn their own passions into something concrete! Girls’ STEMpede had a science focus, but I practiced and developed \u003cem\u003eso many\u003c/em\u003e skills from it in a range of areas, like public speaking, interviewing, networking, time management, and more, and I am excited to help students with any of these areas, science-related or not. Here’s to learning, exploration, and curiosity –\u0026nbsp;I look forward to working with you!\u003c/p\u003e","teachingVideoPlaybackId":"00GHSMeaY8nUrQxovP8pb00v01jYh00iqBFJvconxaSFLpA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"fb2dc6e1-60f8-4b82-a482-d74fc45452f8\"}"},{"__ref":"Favorites:{\"uuid\":\"6070f9f3-80d4-4a34-ae4d-085913095db9\"}"},{"__ref":"Favorites:{\"uuid\":\"3531a2ad-4a66-4aa3-a305-f148b4a2a379\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"3a0477c4-e979-4843-a2d6-d81964257a25\"}"},{"__ref":"CausesSupported:{\"uuid\":\"53ba8acf-4f63-42ff-a320-83217c944bc6\"}"}],"major":"Health and Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7dca8c16-133a-474a-83ca-56cd40322514\"}"},{"__ref":"DeepDives:{\"uuid\":\"7bb55186-1aba-4977-92dd-f4f517e3813d\"}"},{"__ref":"DeepDives:{\"uuid\":\"f65bb824-ddde-4c79-bb05-ae50049300ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"d8503fc6-424b-4f46-bec7-feefd6760e68\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ec193427-7d5b-49dc-b282-2dcaced2ff60/-/preview/-/format/jpg/","https://ucarecdn.com/67b79c1a-20f3-4ccd-850b-75909cbc1524/-/preview/-/format/jpg/","https://ucarecdn.com/7acc471d-c1ba-443d-ba82-2be9894f1ff8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1c684614-2dd5-4a20-b8d6-60cf0f46062a\"}"},{"__ref":"Education:{\"uuid\":\"ef510df4-0307-4d02-a7af-5b98823c56bb\"}"}],"hiredAt":"2025-07-06T12:25:15.540Z","topics":["History Project","K-5 Grade Math","Pre-Algebra","Writing","Spanish","Biology","Creative Writing","Algebra I","6-8 Grade Science"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"calliope-speredakos\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"825ab997-b342-468b-bed5-03b880eec6c5\"}"}}},"_sentryTraceData":"407ea593dcbb497bab2c9000fd96097c-a8ba7a6a27f715eb-0","_sentryBaggage":"sentry-
