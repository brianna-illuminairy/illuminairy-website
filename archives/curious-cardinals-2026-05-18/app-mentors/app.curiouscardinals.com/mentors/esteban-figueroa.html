xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"138b2b85-db0b-4c28-9ef7-2b4972ed0594\"}":{"__typename":"DeepDives","uuid":"138b2b85-db0b-4c28-9ef7-2b4972ed0594","content":"\u003cp\u003eIt is important to immerse yourself in your studies and school, but leave some time to explore hobbies and be curious!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"452e7868-1964-49dc-9f79-5eded1edc13d\"}":{"__typename":"DeepDives","uuid":"452e7868-1964-49dc-9f79-5eded1edc13d","content":"\u003cp\u003eKnowledge means nothing if it is not passed down. Mentorship means that the legacy of those before me, who taught me, will be instilled in those after me--to inspire and guide them. As a first-generation and low-income student, I know the importance of having someone who has experienced a bit more of life, and I think having that guidance is essential in achieve dreams and thriving in a given environment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fa2df4e3-0962-4bba-9ba3-fecc6c53afc3\"}":{"__typename":"DeepDives","uuid":"fa2df4e3-0962-4bba-9ba3-fecc6c53afc3","content":"\u003cp\u003eIn sixth grade, I was in a STEM elective where we did different hands-on projects. The last project was a phone charger, and not just any, we built one from scratch using a 9V battery, a custom circuit, and put it into an Altoids can. When I saw my creation work, I realized I wanted to go into electrical engineering.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"e1b4813a-a130-4476-8e30-b24e7e8fd5cc\"}":{"__typename":"DeepDives","uuid":"e1b4813a-a130-4476-8e30-b24e7e8fd5cc","content":"\u003cp\u003eMy high school band director, specifically, he once told me that perfection is impossible to obtain, but the goal is to strive for it, and achieve excellence along the way. That is important to me. It keeps me grounded and realistic, while striving to excel in whatever I choose to do. His legacy lives through me and continues to be the mentor I remember the most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"4f560612-73c5-4e7d-acf0-2efc3840d89b\"}":{"__typename":"School","uuid":"4f560612-73c5-4e7d-acf0-2efc3840d89b","name":"Wylie East High School","city":"Wylie","type":"HIGH","state":"Texas","country":"United States","zip":"75098"},"Education:{\"uuid\":\"9d7dc6fe-bfa0-461d-b6e0-35d7b30474c6\"}":{"__typename":"Education","uuid":"9d7dc6fe-bfa0-461d-b6e0-35d7b30474c6","school":{"__ref":"School:{\"uuid\":\"4f560612-73c5-4e7d-acf0-2efc3840d89b\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"fc1d8e01-dfdd-4c2e-8784-a7d5fe9eb98b\"}":{"__typename":"Education","uuid":"fc1d8e01-dfdd-4c2e-8784-a7d5fe9eb98b","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"B.S. Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"71622803-7789-453a-9407-a8003a999a7d\"}":{"__typename":"MentorPublicProfile","uuid":"71622803-7789-453a-9407-a8003a999a7d","displayName":"Esteban F.","slug":"esteban-figueroa","biography":"\u003cp\u003e\u003cstrong\u003eHi there! I’m Esteban!\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m a Yale University graduate with a degree in Electrical Engineering, and I currently work in a mechanical engineering lab where I study and build \u003cstrong\u003erobotic turtles\u003c/strong\u003e—yes, real swimming robots that explore how animals move both on land and in water! My research combines electronics, control systems, and soft robotics to better understand locomotion and design more adaptable machines. My long-term goal is to pursue a Ph.D. in Mechanical Engineering, where I can continue exploring the intersection of \u003cstrong\u003erobotics, design, and creativity\u003c/strong\u003e to develop technologies that move like living organisms. This is what we call \u003cstrong\u003ebioinspired robotics\u003c/strong\u003e, and I love that it allows me to merge engineering with curiosity about the natural world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI strongly believe that knowledge means little if it is not shared. That’s why I dedicate time to \u003cstrong\u003ementoring students\u003c/strong\u003e—helping them discover their passions, navigate the college application process, and build confidence in their goals. As a \u003cstrong\u003efirst-generation, low-income student\u003c/strong\u003e, I know firsthand how confusing and isolating the journey to college can feel. Through mentorship, I aim to demystify that process and empower students to believe in their potential. Whether it’s reviewing essays, brainstorming future career paths, or simply offering encouragement, I love seeing my students grow into confident, curious, and motivated learners who take ownership of their dreams. One of my favorite moments is when a student realizes that their story, background, or passion is exactly what makes them unique and powerful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my journey, I’ve had the privilege to travel the world for \u003cstrong\u003erobotics conferences\u003c/strong\u003e, present research, \u003cstrong\u003elaunch rockets\u003c/strong\u003e, contribute to \u003cstrong\u003elunar lander projects\u003c/strong\u003e, and lead engineering teams. I’ve learned that engineering isn’t just about solving problems—it’s about creativity, collaboration, and resilience. Yet, none of those experiences compare to the fulfillment I get from seeing the next generation discover what excites them and pursue it fearlessly.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of engineering and mentoring, I’m passionate about \u003cstrong\u003ephotography\u003c/strong\u003e—what began as a hobby has become a creative side business where I shoot portraits, events, and personal projects. Photography challenges me to notice small details, capture emotion, and tell stories visually—skills that surprisingly influence how I approach robotics and design. I’m also a \u003cstrong\u003emusician\u003c/strong\u003e who loves playing the saxophone, and I’m currently teaching myself drums and piano. I believe creativity and engineering go hand in hand—they balance each other and inspire new ways of thinking.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not in the lab or behind a camera, you’ll probably find me \u003cstrong\u003erunning\u003c/strong\u003e—I love exploring new places on long runs and road trips. I even taught myself to \u003cstrong\u003ebuild a website from scratch using HTML\u003c/strong\u003e, and I’m always eager to teach others how to create something of their own.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt my core, I see every experience as an opportunity to learn, grow, and pass on what I’ve discovered to others who are reaching for their own dreams—and to remind them that no dream is ever too ambitious or out of reach. My mission is simple: to keep building, exploring, and inspiring others to do the same.\u003c/p\u003e","teachingVideoPlaybackId":"mOaSId7NlshRaP3jAkZ7ClGCzO2PyU9nflLbLaf3oc4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"B.S. Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"138b2b85-db0b-4c28-9ef7-2b4972ed0594\"}"},{"__ref":"DeepDives:{\"uuid\":\"452e7868-1964-49dc-9f79-5eded1edc13d\"}"},{"__ref":"DeepDives:{\"uuid\":\"fa2df4e3-0962-4bba-9ba3-fecc6c53afc3\"}"},{"__ref":"DeepDives:{\"uuid\":\"e1b4813a-a130-4476-8e30-b24e7e8fd5cc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9a0d374e-bc41-48a5-aa37-ced66159a9b2/-/preview/-/format/jpg/","https://ucarecdn.com/7a0b1950-bcaa-495c-b2b0-89a9f1a22ab7/-/preview/-/format/jpg/","https://ucarecdn.com/d2e9374a-b792-4aea-b109-760f451b74a0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"9d7dc6fe-bfa0-461d-b6e0-35d7b30474c6\"}"},{"__ref":"Education:{\"uuid\":\"fc1d8e01-dfdd-4c2e-8784-a7d5fe9eb98b\"}"}],"hiredAt":"2025-10-10T20:28:14.132Z","topics":["Aviation / Aerospace","Coding / Programming","Robotics / Electronics / CAD","STEM Project"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicP
