xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a100a7df-23d6-4cbd-b0e9-25c17a085119\"}":{"__typename":"Favorites","uuid":"a100a7df-23d6-4cbd-b0e9-25c17a085119","photoUrl":"https://ucarecdn.com/b34f00ea-5b8f-45bb-b927-944bf9419725/","title":"The Social Network","type":"MOVIE"},"Favorites:{\"uuid\":\"f9ad5d73-d4aa-403c-afea-77c11c65aedc\"}":{"__typename":"Favorites","uuid":"f9ad5d73-d4aa-403c-afea-77c11c65aedc","photoUrl":"https://ucarecdn.com/1146d2f8-a157-40da-b5dc-f7b4e24ea2a4/","title":"Baseball","type":"SPORT"},"Favorites:{\"uuid\":\"4fc844cf-816d-4ba7-9564-7ba0a3442ac0\"}":{"__typename":"Favorites","uuid":"4fc844cf-816d-4ba7-9564-7ba0a3442ac0","photoUrl":"https://ucarecdn.com/ae417bcd-ab37-4836-83d3-c34e28f3de1c/","title":"FIFA","type":"GAME"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"3f908081-4552-45f8-8ff7-f3a4431c1e32\"}":{"__typename":"DeepDives","uuid":"3f908081-4552-45f8-8ff7-f3a4431c1e32","content":null,"videoPlaybackId":"tbLBwPEQvp5SaGE01ilaGq02E00GU4nMsxF02wscSsFXrHA","question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"86fa46e2-5b45-4910-89c7-5ff57839bbce\"}":{"__typename":"DeepDives","uuid":"86fa46e2-5b45-4910-89c7-5ff57839bbce","content":null,"videoPlaybackId":"AxuRfsbDDTufRKmxhTMcT3q2a2kXvqewGWqTb3ZyjhU","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"9135e6c3-1499-4a20-86cc-1eeb427011f7\"}":{"__typename":"DeepDives","uuid":"9135e6c3-1499-4a20-86cc-1eeb427011f7","content":"\u003cp\u003eIn college, I took two classes taught by philosophy professor Kate Withy. The classes were titled \"Lives of Learning\" and \"the Meaning of Life\". As you can probably imagine, the class covered some really deep and complicated questions about life and its purpose, like \"What is the purpose of a college education?\" and \"Is it more important to be happy or to be successful?\"\u003cbr\u003e\u003cbr\u003eProfessor Withy is my greatest mentor because she helped me shape my own convictions on these topics. She asked us many probing questions to our responses and thoughts, she also balanced this feedback with giving us enough freedom to come up with our own ideas. As a mentor and tutor, I hope to guide my mentee while also allowing them to eventually learn how to solve various problems without my help, just as Professor Withy did.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"f140e37a-ae4c-4dca-b7d1-876a84c2ad69\"}":{"__typename":"DeepDives","uuid":"f140e37a-ae4c-4dca-b7d1-876a84c2ad69","content":"\u003cp\u003eAs a Korean immigrant who volunteered in low-income areas and spent a summer interning in Tel Aviv, Israel, I have frequently been placed in unfamiliar settings. Through these experiences, I have learned to connect with people quite different from myself! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"26973c2e-9ee1-4a11-af80-ea86108ce8c2\"}":{"__typename":"School","uuid":"26973c2e-9ee1-4a11-af80-ea86108ce8c2","name":"Northern Highlands Regional High School","city":"Allendale","type":"HIGH","state":"NJ","country":"USA","zip":"07401"},"Education:{\"uuid\":\"926458c7-b30e-4bb3-a6c3-a37aa7f4d50b\"}":{"__typename":"Education","uuid":"926458c7-b30e-4bb3-a6c3-a37aa7f4d50b","school":{"__ref":"School:{\"uuid\":\"26973c2e-9ee1-4a11-af80-ea86108ce8c2\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"4838b291-3eaf-4d80-8b23-75df09f1ad89\"}":{"__typename":"School","uuid":"4838b291-3eaf-4d80-8b23-75df09f1ad89","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"DC","country":"USA","zip":"20007"},"Education:{\"uuid\":\"40271ee7-c462-4ab2-8f02-c77bdd4df252\"}":{"__typename":"Education","uuid":"40271ee7-c462-4ab2-8f02-c77bdd4df252","school":{"__ref":"School:{\"uuid\":\"4838b291-3eaf-4d80-8b23-75df09f1ad89\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Economics/Math","degree":null},"MentorPublicProfile:{\"uuid\":\"39fd83a8-578e-4122-90a7-e7ce96471cd1\"}":{"__typename":"MentorPublicProfile","uuid":"39fd83a8-578e-4122-90a7-e7ce96471cd1","displayName":"Allen P.","slug":"allen-park","biography":"\u003cp\u003eNice to meet you! My name is Allen, and I am a recent graduate of Georgetown University, where I majored in math and economics along with a minor in philosophy. In December, I will begin full-time work in the consulting industry, but before then, I would like to dedicate part of my time to serving as a mentor at Curious Cardinals!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs someone who always enjoyed learning from teachers, coaches, and older friends, I naturally became interested in teaching others. I first started tutoring as a sophomore in high school, when I volunteered at a shelter in a nearby low-income neighborhood. Tutoring here was a tremendous growth experience for me- I became increasingly aware and grateful for the supportive atmosphere I was raised in, and I found it rewarding to see struggling students begin to understand concepts they had trouble with.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI continued volunteering in college, tutoring students in math at a public elementary school in Washington DC. Additionally, I began to find other mentorship opportunities. When the world shut down due to COVID-19, I spent the summer of 2020 tutoring two students preparing for the SATs for 6 hours per week on Zoom. When Georgetown finally reopened its campus in 2021, I served as a peer advisor for 14 incoming freshmen. As they adjusted to college life, I assisted their transition by helping them pick classes, learn which clubs might be best for them, and consider how they can maintain a positive balance of school and extracurriculars while still looking after their well-being. I enjoy helping students whose shoes I have been in and equipping them with the skills and tools necessary to succeed.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my past experience as a tutor, mentor, and peer advisor, I found it easiest to connect with students with whom I share interests. I have played baseball my entire life, pitching in high school and also for the club team at Georgetown. I also enjoy watching soccer- I can’t wait until the United States hosts the World Cup in 2026! Finally, I am a foodie- I love trying different cuisines, which made going to school in the nation’s capital perfect for me! As an extrovert with past tutoring experience, I am confident that I can connect with any student, but I think I would be especially happy to work with a student who shares these interests with me!\u003c/p\u003e","teachingVideoPlaybackId":"1phjPfK4FBql02tnHovzQypDgHI8HV6bVOSSUkw4Tlls","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a100a7df-23d6-4cbd-b0e9-25c17a085119\"}"},{"__ref":"Favorites:{\"uuid\":\"f9ad5d73-d4aa-403c-afea-77c11c65aedc\"}"},{"__ref":"Favorites:{\"uuid\":\"4fc844cf-816d-4ba7-9564-7ba0a3442ac0\"}"}],"causesSupported":[],"major":"Economics/Math","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3f908081-4552-45f8-8ff7-f3a4431c1e32\"}"},{"__ref":"DeepDives:{\"uuid\":\"86fa46e2-5b45-4910-89c7-5ff57839bbce\"}"},{"__ref":"DeepDives:{\"uuid\":\"9135e6c3-1499-4a20-86cc-1eeb427011f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"f140e37a-ae4c-4dca-b7d1-876a84c2ad69\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4ddde40a-6942-4761-acb2-885bac8812eb/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"926458c7-b30e-4bb3-a6c3-a37aa7f4d50b\"}"},{"__ref":"Education:{\"uuid\":\"40271ee7-c462-4ab2-8f02-c77bdd4df252\"}"}],"hiredAt":"2023-08-11T04:59:24.215Z","topics":["Philosophy","Statistics","Calculus","Precalculus / Trigonometry","Algebra II","Algebra I","Geometry","Pre-Algebra","K-5 Grade Math","Economics"],"communityBadges":["https://ucarecdn.com/d441189b-003a-4aab-82f0-564452e913e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"allen-park\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"39fd83a8-578e-4122-90a7-e7ce96471cd1\"}"}}},"_sentryTraceData":"f4099f964974414c91503a19e50c5a1f-adf69cf0f6c2debf-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f4099f964974414c91503a19e50c5a1f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"allen-park"},"buildId"
