xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6f170878-f008-42f7-92cf-90a0db6b0cd0\"}":{"__typename":"Favorites","uuid":"6f170878-f008-42f7-92cf-90a0db6b0cd0","photoUrl":"https://ucarecdn.com/2448b0f9-b09a-4647-acb3-b4a3b3248b21/","title":"Pachinko by Min Jin Lee","type":"BOOK"},"Favorites:{\"uuid\":\"6315562b-615e-41c6-ba1a-8149a85d202f\"}":{"__typename":"Favorites","uuid":"6315562b-615e-41c6-ba1a-8149a85d202f","photoUrl":"https://ucarecdn.com/2448b0f9-b09a-4647-acb3-b4a3b3248b21/","title":"Forget It by Blood Orange","type":"SONG"},"Favorites:{\"uuid\":\"edd9a4ff-543e-4586-a74d-d7744020f7dc\"}":{"__typename":"Favorites","uuid":"edd9a4ff-543e-4586-a74d-d7744020f7dc","photoUrl":"https://ucarecdn.com/2448b0f9-b09a-4647-acb3-b4a3b3248b21/","title":"Amman, Jordan","type":"CITY"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ced04400-7774-4905-be56-f4dbd949d8c7\"}":{"__typename":"DeepDives","uuid":"ced04400-7774-4905-be56-f4dbd949d8c7","content":"\u003cp\u003eI was really impacted by the George Floyd protests, and found myself struggling to cope with my frustrations in a healthy manner. When venting to my friend, we started thinking about doing an art project to showcase Black joy rather than Black pain. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWe came up with the project \"Black Is ______.\" Our goal was to take portrait photos of people at protests and ask them what their Blackness meant to them. We then turned these photos into 5x3 ft prints and held an outdoor, Covid-safe exhibition in a park. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis project was not only an excellent way to channel my emotions into something more positive, but it also allowed me to connect with my community. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"21808bc0-d4d8-4d09-8018-12ced03f88c5\"}":{"__typename":"DeepDives","uuid":"21808bc0-d4d8-4d09-8018-12ced03f88c5","content":"\u003cp\u003eSome of the best advice I've ever gotten has been from people who were just a few years older than me. Proximity in age meant they had a keen ability to relate to my own experiences and feelings, offering input that was extremely relevant and honest. This played an extremely large role in how I navigated my academic path. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI firmly believe that one of the most important aspects of community is remembering how others have helped you, and extending that same help to others. I remember all the anxieties and questions I had about school and careers growing up, and I remember how I navigated them, growing my confidence and skill set at the same time. I would love to offer the things I have learned to others through mentorship. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6d1e7066-4fae-4650-8524-29aba0d20d94\"}":{"__typename":"DeepDives","uuid":"6d1e7066-4fae-4650-8524-29aba0d20d94","content":"\u003cp\u003eAt Yale, the Anthropology is pretty small. I was fortunate enough to find out about Anthropology my first year, and I stuck with it ever since. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor once, I love how interdisciplinary the major is. I am able to explore all of my academic interests because many Anthropology courses are cross listed under other departments as well, meaning I am not restricted to fulfilling hyper specific major requirements. I have been able to take courses in Political Science, Ethnicity Race \u0026amp; Migration, Ethics Politics and Economics, Global Affairs, and more. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSecondly, I love Anthropology's distinct writing style, called ethnography. It has taught me how to implement voice into my writing as well as ethically do impactful qualitative research. I have found his extremely helpful in my extracurricular pursuits, playing a big role in how I secured a postgraduate job as a public defense paralegal. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4189a0d1-d969-4b97-b68a-d4eb1b888b3e\"}":{"__typename":"DeepDives","uuid":"4189a0d1-d969-4b97-b68a-d4eb1b888b3e","content":"\u003cp\u003eCuriosity will set you apart -- always find multifaceted ways to pursue your interests. Not only does this prove how proactive you are, but it shows how you might become  a future leader. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn school, I was drawn to subjects such as history, English, and political science. Whenever there was a topic I found particularly interested, I would do deep dives to create a more intricate understanding of systemic issues. This manifested into my extracurricular interests as well, tutoring refugee children in English and leading my school's Amnesty International chapter, as well as doing cancer research. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough I wasn't fully sure what I wanted to do in the future, exploring my interests to the fullest capacity has been an integral part of my growth. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2c4ca96b-99dc-479d-9eb1-d05a708f7add\"}":{"__typename":"School","uuid":"2c4ca96b-99dc-479d-9eb1-d05a708f7add","name":"Fosdick-Masten Park High School","city":"Buffalo","type":"HIGH","state":"New York","country":"United States","zip":"14204"},"Education:{\"uuid\":\"89405e90-eec4-4826-8a6d-3932471e04ee\"}":{"__typename":"Education","uuid":"89405e90-eec4-4826-8a6d-3932471e04ee","school":{"__ref":"School:{\"uuid\":\"2c4ca96b-99dc-479d-9eb1-d05a708f7add\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"0898b565-f65f-4dad-b0cf-26a734316c43\"}":{"__typename":"Education","uuid":"0898b565-f65f-4dad-b0cf-26a734316c43","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Anthropology","degree":null},"MentorPublicProfile:{\"uuid\":\"50cefcd4-86e8-4d91-a4e6-1bf6e8bb74c4\"}":{"__typename":"MentorPublicProfile","uuid":"50cefcd4-86e8-4d91-a4e6-1bf6e8bb74c4","displayName":"Milkay T.","slug":"milkay-teysir","biography":"\u003cp\u003eHi! My name is Milkay Teysir. I recently graduated from Yale University in May  2024 with a Bachelor of Arts degree in Anthropology on a Pre-Law track.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a first-generation American from Buffalo, NY, community involvement has always been a top priority to me. Since middle school, I was always looking to combine my academic interests with public engagement in order to spread awareness and help others. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my academics, this manifested into taking many human rights courses on a national and global scale. Writing compelling pieces is one of my strong suits, as well as public speaking. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time at Yale, I also found ways to stay involved with human rights advocacy and community engagement. I was President of Black Students Alliance at Yale my Junior year. I also have done significant work surrounding prison and immigration reform.  I am pleased to say that I will be continuing this work post grad as well, as I will be working as a public defense paralegal. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinding our how to combine my academic and extracurricular interests has been an incredibly rewarding journey of self discovery. It has also given me a lot of insight as to how to create long term plans to decide what route to take, based on what you might benefit from now and in the future. Due to this, I would love to help younger students do the same, instilling the confidence they need to believe they can achieve anything!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e","teachingVideoPlaybackId":"y1sDvSVikFGgkpLdnOy8sM9qGzVn2lNWlsB8aHw4JHo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eAt graduation, I won an award for the best senior thesis within the Anthropology department! This was incredibly rewarding, as I based my paper on my research done in Amman, Jordan, in which I interned at a refugee nonprofit for two months. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI worked on my thesis the entirety of senior year, so I was really happy that my hard work paid off. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"6f170878-f008-42f7-92cf-90a0db6b0cd0\"}"},{"__ref":"Favorites:{\"uuid\":\"6315562b-615e-41c6-ba1a-8149a85d202f\"}"},{"__ref":"Favorites:{\"uuid\":\"edd9a4ff-543e-4586-a74d-d7744020f7dc\"}"}],"causesSupported":[],"major":"Anthropology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ced04400-7774-4905-be56-f4dbd949d8c7\"}"},{"__ref":"DeepDives:{\"uuid\":\"21808bc0-d4d8-4d09-8018-12ced03f88c5\"}"},{"__ref":"DeepDives:{\"uuid\":\"6d1e7066-4fae-4650-8524-29aba0d20d94\"}"},{"__ref":"DeepDives:{\"uuid\":\"4189a0d1-d969-4b97-b68a-d4eb1b888b3e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c0350f95-cf5d-47b5-8c81-fcedfdf9c445/-/preview/-/format/jpg/","https://ucarecdn.com/f96a47b0-20a0-4492-804b-ab6f88394f2d/-/preview/-/format/jpg/","https://ucarecdn.com/0dec1e57-c52c-41d2-8670-f804941a4a4b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"89405e90-eec4-4826-8a6d-3932471e04ee\"}"},{"__ref":"Education:{\"uuid\":\"0898b565-f65f-4dad-b0cf-26a734316c43\"}"}],"hiredAt":"2024-06-05T09:36:13.089Z","topics":["History Project","Literature","Sustainability","Women \u0026 Gender Studies","World Cultures","Race \u0026 Ethnicity","Journalism","Public Speaking","Writing","Arabic","Reading","History","Geography","Executive Function","College Essay Writing","K-5 Grade Math"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"milkay-teysir\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"50cefcd4-86e8-4d91-a4e6-1bf6e8bb74c4\"}"}}},"_sentryTraceData":"f04468556c424c30a85d4451c900b9e0-8b5c9b4cf4234137-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f04468556c424c30a85d4451c900b9e0,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"p
