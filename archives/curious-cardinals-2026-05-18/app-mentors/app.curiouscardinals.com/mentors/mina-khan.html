xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"9dea9228-e6b2-46fe-b2a8-ee88581191fe\"}":{"__typename":"DeepDives","uuid":"9dea9228-e6b2-46fe-b2a8-ee88581191fe","content":"\u003cp\u003eOut of all the things I could focus on, I choose mentorship because it’s been one of the most impactful elements of my journey. Mentorship has been instrumental in shaping my path, starting with the college admissions process. Having someone guide me through such a complex and overwhelming period helped me understand not only the steps I needed to take but also how to navigate the bigger picture. It turned an intimidating process into an opportunity for growth, offering me a clearer sense of direction.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEven in college, mentorship has been equally transformative. As I explored different career paths and worked to define my professional goals, mentors have provided insights that I wouldn’t have discovered on my own. Their perspectives have broadened my horizons and helped me view challenges not as obstacles but as opportunities for growth. That shift in mindset—from seeing something as merely challenging to seeing it as a chance to evolve—has been pivotal. Mentorship has played a crucial role in helping me realize what I want to achieve and how to strategically pursue it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4af2466e-9f86-4afe-a540-1d0ebd951e55\"}":{"__typename":"DeepDives","uuid":"4af2466e-9f86-4afe-a540-1d0ebd951e55","content":"\u003cp\u003eIf I could give advice to my middle or high school self, it would be to allow yourself to make errors, embrace the learning process, and not shy away from mistakes. You don’t need to have everything figured out right away, and it’s okay to fail—those failures are what will eventually shape your success.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlso, have the audacity to set big goals, even ones that scare you. The goals that push you outside your comfort zone will be the ones that help you grow the most. But remember, they should be feasible—something you can work toward and achieve, even if they seem a little out of reach right now. Don’t limit yourself, because you are capable of more than you realize.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2c436ce0-dafd-40ed-b5ef-075c855bf455\"}":{"__typename":"School","uuid":"2c436ce0-dafd-40ed-b5ef-075c855bf455","name":"Sanderson High School","city":"Raleigh","type":"HIGH","state":"North Carolina","country":"United States","zip":"27609"},"Education:{\"uuid\":\"819aea73-c966-4aed-9844-da606fa6ba15\"}":{"__typename":"Education","uuid":"819aea73-c966-4aed-9844-da606fa6ba15","school":{"__ref":"School:{\"uuid\":\"2c436ce0-dafd-40ed-b5ef-075c855bf455\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"e2f94a00-b7cf-49f5-bda3-6a77087a021d\"}":{"__typename":"Education","uuid":"e2f94a00-b7cf-49f5-bda3-6a77087a021d","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics ","degree":null},"MentorPublicProfile:{\"uuid\":\"62f8656e-5183-4b9e-bcb1-afebfbc6aee4\"}":{"__typename":"MentorPublicProfile","uuid":"62f8656e-5183-4b9e-bcb1-afebfbc6aee4","displayName":"Mina K.","slug":"mina-khan","biography":"\u003cp\u003eMina is a senior at Vanderbilt University pursuing a degree in Economics with minors in Data Science and Business. She grew up in Raleigh, North Carolina, and comes from a multicultural background that has deeply shaped her academic and personal interests. She is fluent in Russian and conversational in Persian and Spanish, and her passion for learning languages and understanding different cultures has influenced both her coursework and global experiences. Mina has spent two semesters studying Economics abroad- one at the University of New South Wales in Sydney and another in Madrid- where she deepened her global perspective and appreciation for international economic systems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMina’s interest in business, leadership, and social impact began early in her academic journey and has been reinforced through a range of professional and leadership experiences. As a Program Management Intern at the Jordan Thomas Foundation and an Analyst Intern at Lenovo, she developed skills in strategic planning, data analysis, and cross-functional collaboration. Her work with the Triangle Community Foundation and service on the Vanderbilt Commons Leadership Board further strengthened her leadership abilities and fueled her passion for helping communities grow and thrive.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEducation and mentorship play a central role in Mina’s life. At Vanderbilt, she is an active member of Alpha Kappa Psi (AKPsi), where she runs a micro-internship program and helps coordinate initiatives such as the Sprinternship AKPsi program and corporate case competitions. Through this work, Mina focuses on bridging the gap between students and businesses by creating meaningful, hands-on professional opportunities. She is also involved in organizations such as Women in Business and Change++, where she collaborates with peers to build skills in product management, technology, and inclusive leadership.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMina is particularly passionate about financial literacy and entrepreneurship. Her experience includes hosting industry speakers through the Academy of Finance and writing a financial literacy blog in high school. This past summer, she worked in consulting, where she focused on building KPIs and developing visual dashboards to support data-driven decision-making. After graduation, Mina plans to pursue a career in consulting, exploring a variety of business sectors while continuing to seek work that blends analytical rigor with real-world impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, Mina enjoys staying active through pilates and hot yoga, exploring new foods, spending time with family, and staying connected to her cultural roots. She loves traveling and, over the past two years, has visited six different continents.\u003c/p\u003e","teachingVideoPlaybackId":"02AgUlfaUNITBCAQBATfs13PGa4ZUj2ppfcPxJI02ys018","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne accomplishment I'm particularly proud of is spearheading the Sprinternship program for AKPsi. Recognizing a gap in opportunities for students to gain real-world experience, I took the initiative to create a micro-internship program that connects students with companies for short-term projects. This effort not only required strong leadership but also involved extensive collaboration and networking with external professionals to secure partnerships. By organizing these internships, I've been able to provide valuable career development opportunities for students while also strengthening the relationship between AKPsi and industry partners. This experience has allowed me to demonstrate my entrepreneurial mindset, strategic thinking, and commitment to fostering student success.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Economics ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9dea9228-e6b2-46fe-b2a8-ee88581191fe\"}"},{"__ref":"DeepDives:{\"uuid\":\"4af2466e-9f86-4afe-a540-1d0ebd951e55\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/366486bd-5b31-4cbb-903c-73696f43395f/-/preview/-/format/jpg/","https://ucarecdn.com/bc46c7cd-c64c-4815-8a71-696b9727e768/-/preview/-/format/jpg/","https://ucarecdn.com/39b1d6a7-68d3-4248-b152-e829c073d18b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"819aea73-c966-4aed-9844-da606fa6ba15\"}"},{"__ref":"Education:{\"uuid\":\"e2f94a00-b7cf-49f5-bda3-6a77087a021d\"}"}],"hiredAt":"2024-09-12T01:13:28.557Z","topics":["Business / Entrepreneurship","Finance / Investing","Sustainability"],"communityBadges":["https://ucarecdn.com/3fe96660-66b0-4395-b48d-3044e8987993/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mina-khan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"62f8656e-5183-4b9e-bcb1-afebfbc6aee4\"}"}}},"_sentryTraceData":"9abea4fcdc6c48e48b43857d66d82f15-abc618936b3ee39d-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9abea4fcdc6c48e48b43857d66d82f15,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"mina-khan"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"aft
