xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9404a2c3-7796-490c-aa01-8a7f538a7a1f\"}":{"__typename":"DeepDives","uuid":"9404a2c3-7796-490c-aa01-8a7f538a7a1f","content":"\u003cp\u003eI always tried to keep my summers balanced between having fun and relaxing but also stimulating and on top of college prep.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eSummer going into...\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e9th grade:\u003c/strong\u003e Attended day camp at Camp Ramaquois\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e10th grade:\u003c/strong\u003e Was a CIT (counselor in training) at Camp Ramaquois. I was a counselor in the mornings and camper in the afternoon. *Got paid\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e11th grade: \u003c/strong\u003eAttended Barnard College's Young Women's Leadership Institute, UHouston's Bauer EXPLORE Summer Institute, and was a bus and camp counselor at Ramaquois\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e12th grade: \u003c/strong\u003eVirtually attend the Young Women's Institute at the Kelly School of Business, took an online economics class, and continued to grow my organization WomenPlusGirls\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"16bc5f98-774f-42ca-bdb3-8e53e3336641\"}":{"__typename":"DeepDives","uuid":"16bc5f98-774f-42ca-bdb3-8e53e3336641","content":"\u003cp\u003eI was a tri-season varsity athlete since 8th grade! I was on Varsity Cross Country, Swim, and Track and Field. I was even the captain of the XC and swim teams.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"12547adb-4ce1-4342-b9cd-5c66e176abae\"}":{"__typename":"DeepDives","uuid":"12547adb-4ce1-4342-b9cd-5c66e176abae","content":"\u003cp\u003eI always say my interest in business was acquired through Osmosis. Growing up in a household with two parents that worked in finance, business became a common language to me at a young age.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eSince middle school, I loved mathematics because I liked the challenge of working through a problem to get to an answer. I also always preferred numbers to words – I was not a big reader. My true interest in business came when I learned that working in finance meant continuing to work with numbers and using mathematical equations to help reason business choices. Because of this interest, I attended multiple summer business programs in high school including programs at Barnard, the Bauer School of Business, and Indiana’s Kelly school. Through mini lectures on accounting, marketing, personal finance, management and more, these programs exposed me to umbrella of “business” and affirmed to me that business was an industry I was truly interested in.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eMy interest in business led me to apply to Wharton because I wanted to truly study exactly what I was interested in. What I like about Wharton is that I am getting a rounded business education by taking classes from marketing to legal ethics to business and public policy alongside the standard finance and accounting courses. My major at Wharton allows me to get a strong business foundation while focusing in finance and management.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"2b53e0fc-01e9-4e22-a10b-435ce30c7ad5\"}":{"__typename":"Education","uuid":"2b53e0fc-01e9-4e22-a10b-435ce30c7ad5","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":"BS"},"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}":{"__typename":"School","uuid":"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5","name":"The Chapin School","city":"New York","type":"HIGH","state":"NY","country":"USA","zip":"10028"},"Education:{\"uuid\":\"4211da04-3cc7-4c6a-94ea-df1633f17218\"}":{"__typename":"Education","uuid":"4211da04-3cc7-4c6a-94ea-df1633f17218","school":{"__ref":"School:{\"uuid\":\"68d6176b-61ff-4df9-b3e7-f7ea9631f8c5\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"39869efe-93a2-46f1-b512-509dc447a6aa\"}":{"__typename":"MentorPublicProfile","uuid":"39869efe-93a2-46f1-b512-509dc447a6aa","displayName":"Taylor R.","slug":"taylor-richter","biography":"\u003cp\u003eTaylor is a rising junior in The Wharton School at The University of Pennsylvania. She is concentrating in Finance and Management. This summer, Taylor is working a hybrid internship at a VC fund and one of their portfolio companies. Next summer (2024), she will be a member of an investment banking summer analyst program at a global firm.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eTaylor grew up in New York City and was a student at The Chapin School. Having attended an all girls school for 13 years, female empowerment and instilling self-confidence has always been important to her. In 2019, Taylor founded her own mentorship network, WomenPlusGirls, which pairs high school girls with inspiring women in the workforce. At UPenn, she is involved in The Women’s Network where she serves as the VP of the Finance Committee and is the Trip Coordinator. Taylor is also a member of Kappa Alpha Theta Fraternity and is the chapter’s VP of Finance.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eDuring her free time, Taylor can often be found running in Central Park or doing pilates in her dorm room. In addition, she is a fan of trying new restaurants and experimenting with making her own “healthy” desserts.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eWhile Taylor has previous tutoring experience in middle school math, Calculus, and Chemistry, she is also able to help mentor students in reading, writing, grammar, Latin, and general academic coaching. Taylor loves working with students and her main objective is always to make them feel confident about themselves and their abilities.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9404a2c3-7796-490c-aa01-8a7f538a7a1f\"}"},{"__ref":"DeepDives:{\"uuid\":\"16bc5f98-774f-42ca-bdb3-8e53e3336641\"}"},{"__ref":"DeepDives:{\"uuid\":\"12547adb-4ce1-4342-b9cd-5c66e176abae\"}"}],"active":true,"profilePhotos":["http
