xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3a673db9-1fac-4e98-9b1f-cfd5032b1e50\"}":{"__typename":"DeepDives","uuid":"3a673db9-1fac-4e98-9b1f-cfd5032b1e50","content":"\u003cp\u003eThe most intelligent people are not those you think. The access to knowledge makes the difference and is not always fair. I want to help students unlock their unlimited potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"6c678ba5-cff6-4214-b40f-1569a049b46b\"}":{"__typename":"School","uuid":"6c678ba5-cff6-4214-b40f-1569a049b46b","name":"ENSAE Paris, Master's in Applied Mathematics","city":"Paris","type":"HIGH","state":"Île-de-France","country":"France","zip":"78000"},"Education:{\"uuid\":\"d3792b3b-00bf-4a4c-86bc-922c15c88839\"}":{"__typename":"Education","uuid":"d3792b3b-00bf-4a4c-86bc-922c15c88839","school":{"__ref":"School:{\"uuid\":\"6c678ba5-cff6-4214-b40f-1569a049b46b\"}"},"startYear":"2020 ","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"27d870ea-838c-48c5-919a-ff28868b5370\"}":{"__typename":"School","uuid":"27d870ea-838c-48c5-919a-ff28868b5370","name":"Harvard John A. Paulson School Of Engineering And Applied Sciences, Master's in Data Science","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02134"},"Education:{\"uuid\":\"3f97f64c-dc6d-4459-86da-8718644ef8a8\"}":{"__typename":"Education","uuid":"3f97f64c-dc6d-4459-86da-8718644ef8a8","school":{"__ref":"School:{\"uuid\":\"27d870ea-838c-48c5-919a-ff28868b5370\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2024","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"fdc8af7d-8624-4f1b-9faf-680b1144c77e\"}":{"__typename":"MentorPublicProfile","uuid":"fdc8af7d-8624-4f1b-9faf-680b1144c77e","displayName":"Yanis V.","slug":"yanis-vandecasteele","biography":"\u003cp\u003eMy name is Yanis! I graduated from Harvard with a Master's degree in Data Science, and I also hold a Master's in Applied Mathematics from ENSAE Paris, a prestigious French engineering school, often considered as the best in data science and statistics.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have been teaching at Harvard for 1 year in modern topics in data science: notably algorithmic fairness (building fair AI) and differential privacy (protecting people's data). Overall, I have more than 5 years tutoring students from college, high school and middle school both in classroom setting and one on one, with a commitment to support underprivileged communities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eToo often, education feels like a robotic, textbook-driven exercise, focused more on memorization than true understanding. My approach is to teach students how to learn, how to think logically and how to articulate their reasoning as these skills make the whole difference to become successful, and that at all level. I also believe in fostering a sense of purpose (why do we learn this? how is this useful to me?). Thus, I strive to create an engaging environment where students feel truly invested in their growth; this is crucial.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI want to help students unlock their potential and achieve their standard of success. I am ready to tutor in the wide range of mathematical academic subjects and data science. Let's work together! Feel free to contact me for any questions or to schedule a first lesson!\u003c/p\u003e","teachingVideoPlaybackId":"n2uwEhpSF7rUSSO9xSNJUZskl00K9rOB1QGJ4YkNJXjM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3a673db9-1fac-4e98-9b1f-cfd5032b1e50\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ab716470-37b1-41e1-af8b-094920c824cc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"d3792b3b-00bf-4a4c-86bc-922c15c88839\"}"},{"__ref":"Education:{\"uuid\":\"3f97f64c-dc6d-4459-86da-8718644ef8a8\"}"}],"hiredAt":"2024-11-20T18:34:30.465Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","French","Academic Coaching","Executive Function","Computer Science","Economics","College Essay Writing","Finance / Investing","Business / Entrepreneurship","Coding / Programming","Medicine / Health","Sports Analytics","STEM Project","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"yanis-vandecasteele\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fdc8af7d-8624-4f1b-9faf-680b1144c77e\"}"}}},"_sentryTraceData":"d9ef807ec443462f8ce2e955e84365c3-8b0e6c20239d3007-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d9ef807ec443462f8ce2e955e84365c3,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"yanis-vandecasteele"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerou
