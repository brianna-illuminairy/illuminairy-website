xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"edfad5fa-be03-4f36-bfc1-2ac097bb0232\"}":{"__typename":"Favorites","uuid":"edfad5fa-be03-4f36-bfc1-2ac097bb0232","photoUrl":"https://ucarecdn.com/f885b9db-2560-4f81-98f9-6210ea1a80ee/","title":"The Lincoln Highway","type":"BOOK"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"bcd5b524-4236-4e48-85b7-e68886daa328\"}":{"__typename":"DeepDives","uuid":"bcd5b524-4236-4e48-85b7-e68886daa328","content":"\u003cp\u003eOut of all the things I could be doing, I choose mentoring because I know firsthand how impactful a great mentor can be. Throughout high school, I had incredible role models—teachers, coaches, and older students—who not only supported me academically but also helped me navigate my interests, challenges, and personal growth. Their guidance gave me the confidence to explore, take risks, and carve my own path.\u003c/p\u003e\u003cp\u003eNow, I want to give that same support to others. Learning isn’t just about mastering material—it’s about discovering who you are, what excites you, and how you want to engage with the world. I love mentoring because it allows me to help students explore their passions, gain confidence in their abilities, and feel seen and supported in their journey. Everyone deserves someone in their corner, and I’m excited to be that person for my students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"f8b3a224-e285-4f0e-b0e1-d0b439676909\"}":{"__typename":"DeepDives","uuid":"f8b3a224-e285-4f0e-b0e1-d0b439676909","content":"\u003cp\u003eAs a high school student, I was an incredibly dedicated student-athlete, balancing the intense demands of both academics and athletics. As a top-tier swimmer training 20 hours a week while attending a rigorous college prep school, I pushed myself to excel in every aspect of my life. I wasn’t just committed—I was relentless in my work ethic, always striving to improve, whether in the pool or the classroom. I took pride in doing things to the best of my ability, never shying away from a challenge, and I put in the effort to ensure my success.\u003c/p\u003e\u003cp\u003eAt the same time, my drive wasn’t just about results—it was about growth. I embraced hard work as a way to push my limits and prove to myself what I was capable of. That same mindset carried me to Brown as a Division I swimmer and continues to shape how I approach challenges today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"03ea45c9-9e01-474d-a667-eee073c1b0ab\"}":{"__typename":"School","uuid":"03ea45c9-9e01-474d-a667-eee073c1b0ab","name":"Breck School","city":"Golden Valley","type":"HIGH","state":"Minnesota","country":"United States","zip":"55422"},"Education:{\"uuid\":\"58c07535-4053-46c6-8f9d-7fbd23487f92\"}":{"__typename":"Education","uuid":"58c07535-4053-46c6-8f9d-7fbd23487f92","school":{"__ref":"School:{\"uuid\":\"03ea45c9-9e01-474d-a667-eee073c1b0ab\"}"},"startYear":"2013","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"76db855a-b594-4d72-9c4f-4c8fe3ff5c40\"}":{"__typename":"Education","uuid":"76db855a-b594-4d72-9c4f-4c8fe3ff5c40","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Environmental Science","degree":null},"MentorPublicProfile:{\"uuid\":\"af9497fe-2e71-446f-9ef7-86534b14174b\"}":{"__typename":"MentorPublicProfile","uuid":"af9497fe-2e71-446f-9ef7-86534b14174b","displayName":"Katelin P.","slug":"katelin-phelps","biography":"\u003cp\u003e\u003cstrong\u003eHi, I'm Katelin!\u003c/strong\u003e I’m a senior at Brown University studying Environmental Science on the Land, Water, and Food Security track. I’m passionate about the intersection of environmental sustainability and community well-being, particularly how food systems shape people’s lives. My interest in this field has grown through hands-on work, including my internship at Groundwork RI, where I helped run a community garden program for high school students. I’ve also worked on food access initiatives in Providence, researching ways to strengthen local food infrastructure.\u003c/p\u003e\u003cp\u003eSwimming has been a major part of my life. I started at age five and later specialized in backstroke, eventually competing for two years on Brown’s Division I Varsity Swim Team. Going through the college recruitment process and balancing athletics with academics taught me resilience, time management, and the value of teamwork—lessons I love to share with others navigating similar experiences.\u003c/p\u003e\u003cp\u003eBeyond academics and athletics, I’m passionate about creativity, the outdoors, and personal growth. I completed Brown Outdoor Leadership Training (BOLT), where I trained to lead students on backpacking trips. I also enjoy baking, knitting, crocheting, painting, and spending time with friends and family. When I’m not outside or in the kitchen, I love listening to podcasts and watching movies. Having dyslexia, I’ve developed strong strategies for standardized test-taking and was able to achieve a 35 on the ACT, so I’m always happy to share tips for tackling exams.\u003c/p\u003e\u003cp\u003eI’m excited to bring my experiences and enthusiasm to a mentorship role, helping students explore their interests, build confidence, and reach their goals—both academically and personally!\u003c/p\u003e","teachingVideoPlaybackId":"SZJH23Liukgnywm9kT7GnCMcfVNHY00zk015h51lcKZL00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my greatest achievements was leading a five-day backpacking trip for sophomores in college through the Northern Presidential Mountains in New Hampshire. It was one of the most physically demanding challenges I’ve ever faced—steep climbs, unpredictable weather, and long days on the trail—but what made it truly meaningful was guiding my peers through it alongside me.\u003c/p\u003e\u003cp\u003eAs a leader, I wasn’t just responsible for myself; I had to support my group, keep morale high, and ensure that everyone felt capable and empowered, even in the toughest moments. The experience pushed me beyond my limits, but it also reinforced my belief in resilience, teamwork, and the power of shared challenges. It’s one thing to push yourself to succeed, but it’s another to help others believe they can do the same—and that’s what made this experience so rewarding.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"edfad5fa-be03-4f36-bfc1-2ac097bb0232\"}"}],"causesSupported":[],"major":"Environmental Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bcd5b524-4236-4e48-85b7-e68886daa328\"}"},{"__ref":"DeepDives:{\"uuid\":\"f8b3a224-e285-4f0e-b0e1-d0b439676909\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3583d3bc-1b8e-45c5-8b7f-cd6c6b71c765/-/preview/-/format/jpg/","https://ucarecdn.com/e0754758-b50f-4c16-8558-9e7ebf2aaf44/-/preview/-/format/jpg/","https://ucarecdn.com/f3e7536f-90be-4eac-a01b-d6f49e3ca76a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"58c07535-4053-46c6-8f9d-7fbd23487f92\"}"},{"__ref":"Education:{\"uuid\":\"76db855a-b594-4d72-9c4f-4c8fe3ff5c40\"}"}],"hiredAt":"2025-02-11T21:50:41.969Z","topics":["Algebra I","K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","Chemistry","Spanish","Academic Coaching","College Essay Writing","Executive Function","K-6 Storybook","Visual Arts / Graphic Design","STEM Project","Sustainability"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"katelin-phelps\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"af9497fe-2e71-446f-9ef7-86534b14174b\"}"}}},"_sentryTraceData":"c5dc84378cf548e58c9c5c2d56062bd9-a9d88183f25aa311-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c5dc84378cf548e58c9c5c2d56062bd9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"katelin-phelps"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" he
