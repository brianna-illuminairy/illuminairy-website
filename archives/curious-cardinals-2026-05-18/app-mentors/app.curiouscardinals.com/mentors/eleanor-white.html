04d58a\"}"}},"School:{\"uuid\":\"5296d58b-4d0d-429a-8d50-7b069e18d533\"}":{"__typename":"School","uuid":"5296d58b-4d0d-429a-8d50-7b069e18d533","name":"Oak Park and River Forest High School","city":"Oak Park","type":"HIGH","state":"Illinois","country":"United States","zip":"60302"},"Education:{\"uuid\":\"c62e72a9-61a9-4cf6-98c2-9c22bdc5689c\"}":{"__typename":"Education","uuid":"c62e72a9-61a9-4cf6-98c2-9c22bdc5689c","school":{"__ref":"School:{\"uuid\":\"5296d58b-4d0d-429a-8d50-7b069e18d533\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"c7cfae4b-334e-492a-99e1-7aff63d78ba9\"}":{"__typename":"Education","uuid":"c7cfae4b-334e-492a-99e1-7aff63d78ba9","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2f900a7d-096d-4eb8-bd79-4c45f707df37\"}":{"__typename":"MentorPublicProfile","uuid":"2f900a7d-096d-4eb8-bd79-4c45f707df37","displayName":"Eleanor W.","slug":"eleanor-white","biography":"\u003cp\u003eNice to meet you! My name is Eleanor and I am originally from Oak Park, IL — a suburb of Chicago. I am someone driven by constant curiosity about the world, making education one of my core values. Every day I am thankful to be receiving an education and I hope to relay this enthusiasm to anyone I mentor.\u003c/p\u003e\u003cp\u003eCurrently, I am in my final year of college Studying Information Science at Cornell University. First, you may be wondering- What is Information Science? Information Science is a vast discipline that examines the intersections between Humans and Technology in all forms. With this, I have been able to study pretty much every corner of technology from software development, data science, user experience/design, ethics, and even law/ policy! \u003c/p\u003e\u003cp\u003eThrough Information Science, I have taken an interest in human-centered design AKA designing products specifically focusing on the user. For the past year, I have worked on a research team in Cornell’s Architectural Robotics Lab, developing a robotic lighting fixture that you can drag across the room with a remote. I attached a video of one of our prototypes at the top of my profile! We just finished writing the academic paper which is currently awaiting approval from a leading human-centered design journal (fingers crossed we get accepted, then Cornell will pay for me to go to France to present our findings!) If you're interested in reading more about my lab click here: https://arl.human.cornell.edu/home.htm\u003c/p\u003e\u003cp\u003eAlthough I love my major, I value my liberal arts education tremendously. I enjoy taking courses in college that align with my interests outside of technology. For example: My favorite class I have taken at Cornell is a class entitled: Introductory Field Biology. The course is actually made for Environment and Sustainability majors to learn how to perform research in the field, however, I petitioned to take it out of pure interest. Now I can identify over 50 trees, mammals, and species native to the northeast!\u003c/p\u003e\u003cp\u003eOutside of class, I love exploring my college town (Ithaca, NY) and the beautiful nature it has to offer. I love swimming in the local lakes, ponds, and gorges, and I try to take a dip at least once a week, even into December (I love a good polar plunge).\u003c/p\u003e\u003cp\u003eAs for mentoring, I worked as a tutor for high school mathematics with levels ranging from calculus to basic math for a student with severe learning disabilities, giving me a wide background in how to run an efficient and effective tutoring session. Also, I was a camp counselor for 2 years in which I underwent extensive training on building effective mentor relationships and applying them in context with my campers.\u0026nbsp;\u003c/p\u003e\u003cp\u003eWith a background in research and design, I would be happy to help your child in any passion they wish to research or innovate further. I also am happy to lead in any technology discipline including data science, web design, coding, and product design. Also another fun fact- I started at Cornell as a math major, as that was my primary interest during high school. Because of this, I feel very confident in all levels of mathematics at or before Calculus and would be happy to provide academic support in the subject. Looking back on my high school self, I wish I had someone pushing me to find my passions earlier. I would love to guide your child in finding their passion, based on my own experiences finding mine (something I still actively do every day). I promise to do all of this through a lighthearted, funny, relaxed approach while still evoking a sense of importance on the values of education.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"4ltXgE2QZ63fh7SzW8ygg011LzFP006yxQAFSH9mlcTN8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0b34800c-4130-486e-8cf3-434507de3231\"}"},{"__ref":"Favorites:{\"uuid\":\"ba5c1640-0887-4d63-97dc-ad8bf1174ca8\"}"},{"__ref":"Favorites:{\"uuid\":\"d074b0c2-6fcf-43d9-b1df-2b83649a88f8\"}"}],"causesSupported":[],"major":"Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"caba0f06-5496-4411-a65c-09acba201145\"}"},{"__ref":"DeepDives:{\"uuid\":\"127221d0-987f-4b78-a2b2-3a87dde02c91\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7e571142-bbcc-47e1-ba5d-f0130aa25f68/-/preview/-/format/jpg/","https://ucarecdn.com/e0ab20a3-9967-4922-9209-2db59e236cb0/-/preview/-/format/jpg/","https://ucarecdn.com/3a5ccb91-6939-4fe8-876a-55d0f9c11725/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c62e72a9-61a9-4cf6-98c2-9c22bdc5689c\"}"},{"__ref":"Education:{\"uuid\":\"c7cfae4b-334e-492a-99e1-7aff63d78ba9\"}"}],"hiredAt":"2024-09-12T01:31:39.557Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Web Design","Robotics / Electronics / CAD","Product Design","Machine Learning / AI","Coding / Programming","Computer Science","Cooking"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"eleanor-white\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2f900a7d-096d-4eb8-bd79-4c45f707df37\"}"}}},"_sentryTraceData":"424bc56ebe5d4bdca528e326457f7fc4-9162928e62d8a246-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=424bc56ebe5d4bdca528e326457f7fc4,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"eleanor-white"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" styl
