js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2e1a3284-a96b-4b46-8593-dd13cf56cca3\"}":{"__typename":"DeepDives","uuid":"2e1a3284-a96b-4b46-8593-dd13cf56cca3","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I’d say this: you don’t need to have it all figured out to move forward. I used to think every decision—what class to take, what club to join—had to fit into a perfect plan. I was chasing the “right” path instead of letting myself explore and grow through trial and error.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, I’ve learned that curiosity is just as valuable as clarity. Some of my most meaningful experiences came from saying yes to things that scared me or didn’t quite make sense at the time. Whether it was trying a design course or performing music for a new audience, those moments taught me to follow what excites me, not just what looks good on paper.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d also remind myself that asking for help is a strength, not a weakness. And most of all, I’d say: be kind to yourself. Growth takes time. Even in uncertainty, you’re still moving forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"4ae679c1-3e23-47f8-8b7a-5130c3d30510\"}":{"__typename":"DeepDives","uuid":"4ae679c1-3e23-47f8-8b7a-5130c3d30510","content":"\u003cp\u003eAs a Korean American, I grew up navigating multiple cultures, learning to listen closely, read between the lines, and notice what isn’t always said. That awareness shapes how I teach and mentor. I aim to create space where students feel truly seen—especially those who tend to stay quiet or question whether their voice belongs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy background also taught me there’s no one-size-fits-all approach to learning. I was a reflective student who processed deeply but didn’t always speak up right away. Because of that, I make space for both quick thinkers and quiet processors. I value introspection as much as participation and prioritize building trust before giving feedback.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost of all, my heritage reminds me of the power of persistence, humility, and care. I bring those values into every interaction, helping students feel they don’t need to change who they are to grow—just someone who’s willing to meet them where they are.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ab4e5e71-2066-4fe0-b87f-9e45c735e2c5\"}":{"__typename":"DeepDives","uuid":"ab4e5e71-2066-4fe0-b87f-9e45c735e2c5","content":"\u003cp\u003eOne of my greatest role models is my mom. She taught me to lead with empathy, resilience, and quiet strength. No matter how busy she was, she always made time to listen—whether it was a big idea or something I couldn’t quite put into words.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI watched her handle challenges with grace and persistence. She never sought recognition but always showed up for others. She taught me that kindness can coexist with high standards, and that support doesn’t have to be loud to be powerful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I admire most is how she makes people feel seen just by being fully present. Her quiet encouragement gave me the confidence to explore, trust myself, and grow. The way I mentor today is a reflection of how she raised me—with patience, care, and belief in others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8528a672-2921-40f7-a8d5-4679e2eb79dc\"}":{"__typename":"DeepDives","uuid":"8528a672-2921-40f7-a8d5-4679e2eb79dc","content":"\u003cp\u003eIn my spare time, I love staying active and creative. I enjoy playing piano, and it’s my favorite way to slow down and reconnect with emotion, especially when life feels hectic.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also enjoy spending time outdoors, whether it’s skiing in the winter, hiking in the mountains, or going on spontaneous adventures with friends. I grew up ski racing and playing varsity tennis, and I still turn to both sports as outlets for focus and energy. I love how they challenge me physically while giving my mind space to reset.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTravel is another big part of my life. I’m always excited to explore new places, whether that means trying unfamiliar food, learning about local traditions, or simply getting lost in a new city.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65\"}":{"__typename":"School","uuid":"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65","name":"Tenafly High School","city":"Tenafly","type":"HIGH","state":"New Jersey","country":"United States","zip":"07670"},"Education:{\"uuid\":\"f159ca9f-516b-4548-8c17-7a819cd7b155\"}":{"__typename":"Education","uuid":"f159ca9f-516b-4548-8c17-7a819cd7b155","school":{"__ref":"School:{\"uuid\":\"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"18841dd8-8687-42b8-b9a3-d9e274879410\"}":{"__typename":"Education","uuid":"18841dd8-8687-42b8-b9a3-d9e274879410","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Information Science (UX)","degree":null},"MentorPublicProfile:{\"uuid\":\"1feac861-fe01-4ad6-9bae-40dad039bae6\"}":{"__typename":"MentorPublicProfile","uuid":"1feac861-fe01-4ad6-9bae-40dad039bae6","displayName":"Madeleine C.","slug":"madeleine-cho","biography":"\u003cp\u003eHi, I’m Maddie! I recently graduated from Cornell University with a degree in Information Science, where I concentrated in User Experience (UX) Design. More than anything, I’m someone who has always been curious about people, how we learn, and how we make meaning in the world around us.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy academic journey began with a deep interest in psychology and neuroscience, which led me to study music therapy at NYU Steinhardt’s Nordoff-Robbins Center, where I explored how music can support cognitive and emotional well-being in people with developmental disabilities. That intersection of human behavior and creativity eventually drew me toward UX design, where empathy, storytelling, and systems thinking come together to solve real-world problems and improve how people interact with the world around them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Cornell, I took on leadership and teaching roles that helped me grow as both a designer and mentor. I served as Co-President of Cornell UX Design Club, a senior advisor in a design consulting group, and a teaching assistant for Digital Product Design, guiding students through critiques, portfolio building, and the design process from start to finish. These experiences deepened my love for mentorship and gave me a front-row seat to how powerful it can be when students are supported in turning their ideas into reality. Professionally, I worked with several startups and completed internships at PwC and VML, where I designed enterprise tools and conducted user research to improve AI-driven platforms and workplace experiences.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcross all of these experiences, what has mattered most to me is helping others find clarity in complexity. Whether that means prototyping a digital solution, breaking down a challenging academic topic, or figuring out what truly excites them, I love working with students who are eager to build, learn, and explore, even if they are not quite sure where to start. My approach is always rooted in active listening, asking thoughtful questions, and celebrating progress over perfection.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I’ve been a classical pianist since I was five, competed internationally, and often turn to music as a lens for understanding memory, emotion, and rhythm in our daily lives. I’m also a former competitive alpine ski racer and someone who enjoys diving into big questions, especially the ones without easy answers. In my free time, I love practicing yoga, playing tennis, traveling, and seeking out new adventures, whether it’s hiking a new trail or exploring a different culture. If you’re curious, creative, and committed to growth, I’d love to be part of your journey.\u003c/p\u003e","teachingVideoPlaybackId":"oN1d8KbNnPOHtVbOEXWZpjrYV5bKs5AbupSPQxihe2I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Information Science (UX)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2e1a3284-a96b-4b46-8593-dd13cf56cca3\"}"},{"__ref":"DeepDives:{\"uuid\":\"4ae679c1-3e23-47f8-8b7a-5130c3d30510\"}"},{"__ref":"DeepDives:{\"uuid\":\"ab4e5e71-2066-4fe0-b87f-9e45c735e2c5\"}"},{"__ref":"DeepDives:{\"uuid\":\"8528a672-2921-40f7-a8d5-4679e2eb79dc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4b6ed494-707e-4df7-b716-0ad914ddee48/-/preview/-/format/jpg/","https://ucarecdn.com/5750247d-216d-4314-8e33-b54389d8329d/-/preview/-/format/jpg/","https://ucarecdn.com/a1f816d1-3f39-4d9a-abc3-d40557e96cef/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f159ca9f-516b-4548-8c17-7a819cd7b155\"}"},{"__ref":"Education:{\"uuid\":\"18841dd8-8687-42b8-b9a3-d9e274879410\"}"}],"hiredAt":"2025-07-17T18:25:40.611Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Writing","Spanish","College Essay Writing","Academic Coaching","Executive Function","Economics","Music","Creative Writing","K-6 Storybook","Visual Arts / Graphic Design","Video / Photography","Web Design","STEM Project","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"madeleine-cho\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1feac861-fe01-4ad6-9bae-40dad039bae6\"}"}}},"_sentryTr
