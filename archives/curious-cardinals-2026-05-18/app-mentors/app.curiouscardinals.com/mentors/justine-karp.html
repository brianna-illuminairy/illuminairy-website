ower of having a mentor who genuinely cares about the mentee.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"90e9be96-b250-4311-ac4c-ced03fa85fc7\"}":{"__typename":"DeepDives","uuid":"90e9be96-b250-4311-ac4c-ced03fa85fc7","content":"\u003cp\u003eI was a major overachiever and made a lot of unnecessarily long study guides\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"acfd1d78-23dc-40f9-8fd8-586c9cfd6dfd\"}":{"__typename":"DeepDives","uuid":"acfd1d78-23dc-40f9-8fd8-586c9cfd6dfd","content":"\u003cp\u003eI worked at Sunrise Day Camp, a camp for children with cancer and their siblings.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"88e5b078-bfe4-46e7-b7a0-037d65d29801\"}":{"__typename":"School","uuid":"88e5b078-bfe4-46e7-b7a0-037d65d29801","name":"Scarsdale High School","city":"Scarsdale","type":"HIGH","state":"New York","country":"United States","zip":"10583"},"Education:{\"uuid\":\"b92ce25c-cfc8-46a4-a4a5-deac0487c615\"}":{"__typename":"Education","uuid":"b92ce25c-cfc8-46a4-a4a5-deac0487c615","school":{"__ref":"School:{\"uuid\":\"88e5b078-bfe4-46e7-b7a0-037d65d29801\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"622cf1ac-eb8e-4718-99fe-aec842239f04\"}":{"__typename":"School","uuid":"622cf1ac-eb8e-4718-99fe-aec842239f04","name":"University of Virginia","city":"Charlottesville","type":"COLLEGE","state":"Virginia","country":"United States","zip":"22903"},"Education:{\"uuid\":\"9c40e20d-207b-411a-9832-63fe507309a5\"}":{"__typename":"Education","uuid":"9c40e20d-207b-411a-9832-63fe507309a5","school":{"__ref":"School:{\"uuid\":\"622cf1ac-eb8e-4718-99fe-aec842239f04\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Commerce","degree":null},"MentorPublicProfile:{\"uuid\":\"d6bb089e-e1e2-4f45-97ef-72291e7d4cdb\"}":{"__typename":"MentorPublicProfile","uuid":"d6bb089e-e1e2-4f45-97ef-72291e7d4cdb","displayName":"Justine K.","slug":"justine-karp","biography":"\u003cp\u003eI’m a fourth-year student at the University of Virginia’s McIntire School of Commerce, studying Finance and Information Technology with a track in Global Commerce. I’ve always been drawn to the way business connects people through strategy, problem-solving, and shared goals, and I try to bring that mindset into everything I do. I’m also honored to have received three UVA Alumni Association scholarships: the Yeardley Love Endowment Scholarship, the Sherri King Memorial Scholarship, and the Glenn D. Kirwin Scholarship, each recognizing leadership, service, and academic achievement.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt UVA, I serve as President of \u003cem\u003eGamma Iota Sigma\u003c/em\u003e, a professional business fraternity. Leading a chapter of more than 100 members has challenged me to think strategically and manage growth while keeping the group’s culture strong. Over the past two years, we’ve more than doubled our application pool, introduced new professional workshops, and built stronger ties with alumni and employers. I’m also President of \u003cem\u003eKappa Alpha Theta\u003c/em\u003e, where I’ve worked to strengthen our philanthropy and make the organization a place that develops confident, capable leaders. In addition, I’m one of fifteen undergraduate students on the \u003cem\u003ePresident’s Student Advisory Council\u003c/em\u003e, where I help provide student input on key university initiatives.\u003c/p\u003e\u003cp\u003eProfessionally, I’ve gained experience across capital markets and sales and trading. This past summer, I interned at \u003cem\u003eGoldman Sachs\u003c/em\u003e on the Investment Grade Capital Markets team, focusing on insurance clients and corporate refinancing strategies. Previously, I worked at \u003cem\u003eUBS Investment Bank\u003c/em\u003e in the Sales \u0026amp; Trading Division, rotating across Advisory Sales, Knowledge Network, and Client Advisory desks. These experiences taught me how to analyze markets, synthesize complex information quickly, and think critically about how financial decisions fit into the bigger picture.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of finance, I’m a \u003cem\u003eProgram Director for Madison House’s CASH program\u003c/em\u003e, where I train volunteers to become IRS-certified tax preparers and assist Spanish-speaking Charlottesville residents with their filings. It’s a small but meaningful way to use what I’ve learned to make something complicated feel accessible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love long distance running and fitness. I am an ACE certified Personal Trainer. I also love working with kids. I grew up babysitting, tutoring, and working as a camp counselor. For the past five years, I have remained involved with the Sunrise Association, a camp that sends children with cancer and their siblings to camp for free. I have loved working with kids of many different ages at Sunrise. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduation, I plan to pursue a career in investment banking, continuing to learn how financial strategy can support long-term, responsible growth for both companies and communities. I am excited to work with Curious Cardinals and engage with a wide variety of students.\u003c/p\u003e","teachingVideoPlaybackId":"KT701UrVt1ra2sz7n9n00KK102WM2IMyzeSjbsZQJmF9YM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eRecipient of 3 UVA Alumni Association Scholarships\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b910d31c-2c12-4d23-9552-b1e3fb8c0d7d\"}"},{"__ref":"Favorites:{\"uuid\":\"3f4cb2a8-208a-496b-a117-a34b35837000\"}"},{"__ref":"Favorites:{\"uuid\":\"c937448e-6182-40bb-8dcc-7288354632a0\"}"}],"causesSupported":[],"major":"Commerce","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"25a669f1-6d6a-4014-a6ed-6ea58ed3e1b7\"}"},{"__ref":"DeepDives:{\"uuid\":\"755cd67b-5e34-4560-a78b-e2cc0bebf31b\"}"},{"__ref":"DeepDives:{\"uuid\":\"90e9be96-b250-4311-ac4c-ced03fa85fc7\"}"},{"__ref":"DeepDives:{\"uuid\":\"acfd1d78-23dc-40f9-8fd8-586c9cfd6dfd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/66bdd575-9615-4404-970f-1086e360012e/-/preview/-/format/jpg/","https://ucarecdn.com/1e308d61-cf96-473d-b4e6-9d56e61c9882/-/preview/-/format/jpg/","https://ucarecdn.com/95927e8e-1dcc-48c8-a33a-273e18ade83c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b92ce25c-cfc8-46a4-a4a5-deac0487c615\"}"},{"__ref":"Education:{\"uuid\":\"9c40e20d-207b-411a-9832-63fe507309a5\"}"}],"hiredAt":"2025-10-21T21:02:36.773Z","topics":["K-5 Grade Math","Algebra I","Algebra II","Calculus","Writing","Academic Coaching","Executive Function","College Essay Writing","Economics","K-6 Storybook","Creative Writing","Business / Entrepreneurship","Finance / Investing","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"justine-karp\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d6bb089e-e1e2-4f45-97ef-72291e7d4cdb\"}"}}},"_sentryTraceData":"307d2ea9d59f4c38ba825e7e91384b60-b9a87b9e70d767b8-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7
