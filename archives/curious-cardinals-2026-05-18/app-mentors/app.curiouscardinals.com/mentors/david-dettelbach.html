a/"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f7edbad0-5f13-4bc0-a887-7c036697ae50\"}":{"__typename":"DeepDives","uuid":"f7edbad0-5f13-4bc0-a887-7c036697ae50","content":"\u003cp\u003eFreshman Summer: Worked as a Caddie\u003c/p\u003e\u003cp\u003eSophomore Summer: Essentials of Finance program at Wharton, Internship at Barclays Investment Bank + Cognetic Capital Wealth Management\u003c/p\u003e\u003cp\u003eJunior: Basketball camp coach, heritage trip to Israel, volunteered at a free STEM camp for underprivileged students\u003c/p\u003e\u003cp\u003eSenior: Sports camp counselor, golf with friends\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"73e216fe-16ea-41fe-bf1d-72dde8e906c1\"}":{"__typename":"DeepDives","uuid":"73e216fe-16ea-41fe-bf1d-72dde8e906c1","content":"\u003cp\u003e\u003cstrong\u003eFBI4ALL\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAfter volunteering at the free STEM camp for underprivileged students, I founded an afterschool tutoring + diversion program for underprivileged 5-8th grade students in the inner city\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI taught basic principles of financial literacy, math, and entrepreneurship through a gamified and interactive approach (w/ snacks obviously!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIt was such a meaningful experience that taught me so much about myself and wanting to have an impact on the world\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"56aacb7a-a1bb-46b9-9f49-08cc83b8589a\"}":{"__typename":"DeepDives","uuid":"56aacb7a-a1bb-46b9-9f49-08cc83b8589a","content":"\u003cp\u003eWhen I was younger, I really wanted to be a barber/chef/salad-dressing maker/professional basketball player--crazy, right!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo this day, I love to cooked, learned to cut my dad's hair, and played basketball very competitively in high school (considered playing here at Yale)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"0f836824-83db-4efa-adb8-9207961a2662\"}":{"__typename":"DeepDives","uuid":"0f836824-83db-4efa-adb8-9207961a2662","content":"\u003cp\u003eMy greatest role model/mentor is my dad, Steven Dettelbach. As a public servant, he fought tirelessly as the former Director of the ATF to bring about safety, reform, and change. I look up to him for his strong moral compass, and ability to do the right thing in the face of pressure/adversity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"20fae6f4-3200-4bf9-bbf6-8396f32bd046\"}":{"__typename":"School","uuid":"20fae6f4-3200-4bf9-bbf6-8396f32bd046","name":"Hawken Upper School","city":"Chesterland","type":"HIGH","state":"Ohio","country":"United States","zip":"44026"},"Education:{\"uuid\":\"764f7f98-4b6e-4b21-85ae-25e3d4c44214\"}":{"__typename":"Education","uuid":"764f7f98-4b6e-4b21-85ae-25e3d4c44214","school":{"__ref":"School:{\"uuid\":\"20fae6f4-3200-4bf9-bbf6-8396f32bd046\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"64131d6c-b9f9-4c20-acff-dedfec0a0f3f\"}":{"__typename":"Education","uuid":"64131d6c-b9f9-4c20-acff-dedfec0a0f3f","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics and Mathematics","degree":null},"Testimonial:a829a439-1370-4294-b59c-4897abfa31bf":{"__typename":"Testimonial","id":"a829a439-1370-4294-b59c-4897abfa31bf","text":"David has been an incredible mentor and leader. We are thrilled to be connected to him through Curious Cardinals. Our son was looking for ways to continue his interests outside of the regular school curriculum. We became interested in Curious Cardinals because of the mentorship coupled with experiential learning. David has gone beyond what we expected. He spent time getting to know our son and has been thoughtful and perceptive about exactly who he is and what he needs to excel. Our son has launched his first project and would not have been able to bring his work to this level without David’s leadership!","date":"2025-08-22 13:36:14.124+00","rating":5,"endorser":{"__typename":"Endorser","name":"Kate Roomet","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"00a459e0-025a-4f2c-9c54-12cb727d6256\"}":{"__typename":"MentorPublicProfile","uuid":"00a459e0-025a-4f2c-9c54-12cb727d6256","displayName":"David D.","slug":"david-dettelbach","biography":"\u003cp\u003eHi! My name’s David Dettelbach and I hail from the great city of Cleveland, Ohio—\u003cem\u003eO-H-! \u003c/em\u003e(But currently reside in both Cleveland and Washington DC).\u003cem\u003e \u003c/em\u003eI attended a small private high school, and am currently a first year student at Yale University, completing a joint major in Economics and Mathematics. For fun, I enjoy playing basketball, golfing, cooking, and really watching any other sport like the NFL, college-football, MLB and NBA. If you get me going on sports, I’ll probably never stop! \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was really interested in learning finance, but also teaching financial literacy for other community members (which was reflected in some of my extra-curricular endeavors and passion projects). Most notably, I was the captain of my school’s varsity basketball team, founded and ran a free afterschool tutoring program for disadvantaged youth in topics such as financial literacy, math, and entrepreneurship, was a section editor for the school paper, wrote for an online publication about financial literacy, ran the school’s finance club, was elected to the student disciplinary council, and served as a senior-mentor to 15 Freshman students.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy favorite subjects were math, history, economics, and really anything else related to writing. Fun Fact: I’ve always loved art, but have never been very good, so here at Yale I’m actually trying to improve my skills a bit in a basic drawing class!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school, I pride myself in my ability to strike a balance between my academics and social life. On weekends, I love sharing a meal with friends (potentially at the world renowned Buffalo Wild Wings or Olive Garden), talking politics, golfing, traveling, or binging some of my favorite TV shows (which as of right now are Curb Your Enthusiasm, The Office, and Breaking Bad). As you may be able to tell, although I'm extroverted, I also do love quiet time to myself every now and then.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSo far in my freshman year of college, I have been very active on my schools club-basketball team (helping lead us to our first regional tournament appearance in many years), am a financial analyst for the Yale Student Investment Group (YSIG) (which manages part of the Yale Endowment Fund), Yale Sigma Nu fraternity, and have founded a club through the Yale Slifka Center, called \u003cem\u003eCasaShalom\u003c/em\u003e, serving as an affinity space for fellow Jewish and Hispanic students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have spent previous summers interning for an investment bank on Wall Street, traveling to Israel, being a sports camp counselor, a volunteer, and learning finance from a program at the Wharton school. This summer, I plan to spend part of the summer abroad in Barcelona immersing myself in the Spanish language, and the rest in NYC interning in Private Equity.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf any of this resonates or if you just want to talk about any of my interests (sports, cooking, TV shows/movies, finance, politics, etc.) please don’t hesitate to reach out and set up a time for us to speak face-to-face! I love meeting you all and hope to form meaningful and lasting mentorships in the future.\u003c/p\u003e","teachingVideoPlaybackId":"pnHKSqjcvVCerjVAyVM8jZ7ljYlfWiRXCKco7Oid3mY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2749898c-4612-4e7f-b4b1-795ed2534105\"}"},{"__ref":"Favorites:{\"uuid\":\"1afdf264-12ad-4321-8a90-f21f1bbb8b5f\"}"},{"__ref":"Favorites:{\"uuid\":\"4dcefed9-ceba-45d8-b581-ece5640139bb\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"132b4286-62a0-4e6a-bf5a-bb7de8b7ddfb\"}"},{"__ref":"CausesSupported:{\"uuid\":\"fb4cc47a
