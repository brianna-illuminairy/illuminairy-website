xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"2626873d-f11d-4ecb-a4fc-65b4192058ef\"}":{"__typename":"DeepDives","uuid":"2626873d-f11d-4ecb-a4fc-65b4192058ef","content":"\u003cp\u003eMy brother is definitely the greatest mentor that I have. I am so grateful to have him in my life and just be able to learn from his guidance. We have an 8 year age gap so he has always been at that next stage of life than me so just hearing from his mistakes, regrets, and accomplishments is something that I cherish deeply. I look forward to learning more from him in the future and of course getting to show him some of my own tips and tricks.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"de285bcf-ac68-4839-9e07-7b19c8bb5046\"}":{"__typename":"DeepDives","uuid":"de285bcf-ac68-4839-9e07-7b19c8bb5046","content":"\u003cp\u003eMy dream job is not really a job but more of a lifestyle. I wish to work for myself in the future. I'm not quite sure what that looks like right now but I know I want to be able to have the freedom and understanding that all the hard work that I put in at my job is ultimately going towards building my own company or brand. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9bc2b6c3-0b87-49b8-ae8a-09de5d9ea5b0\"}":{"__typename":"DeepDives","uuid":"9bc2b6c3-0b87-49b8-ae8a-09de5d9ea5b0","content":"\u003cp\u003eIn my opinion I think mentorship is one of the most underrated parts of getting ahead in life. You can have all the tools, drive, and motivation to do something but if you don't have anyone to guide you in the right direction you're just going to be bumping your head at every turn. Having a mentor who can show you the ropes and help you not make the same mistakes is so important and necessary for advancing quickly.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f11db72b-4a91-42fe-b293-2ae275921a42\"}":{"__typename":"DeepDives","uuid":"f11db72b-4a91-42fe-b293-2ae275921a42","content":"\u003cp\u003eI like to spend a lot of my spare time hanging out with my friends. Whether it be watching a movie together, going to the gym together, or just relaxing together, I find spending time with my peers, especially in college, is so necessary to have a good mental health. Here at Yale we have butteries which are like late night snack stations that every residential college has and I like to go there pretty often to grab a late night snack and run some games of ping pong or pool with friends and just relax. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2cc0fe0f-6f5f-4ffc-b2d9-3d0a5c2a85db\"}":{"__typename":"School","uuid":"2cc0fe0f-6f5f-4ffc-b2d9-3d0a5c2a85db","name":"Jesuit High School","city":"Arden-Arcade","type":"HIGH","state":"California","country":"United States","zip":"95608"},"Education:{\"uuid\":\"8168f744-99a6-4fe6-a99c-79d7e5ff5a0c\"}":{"__typename":"Education","uuid":"8168f744-99a6-4fe6-a99c-79d7e5ff5a0c","school":{"__ref":"School:{\"uuid\":\"2cc0fe0f-6f5f-4ffc-b2d9-3d0a5c2a85db\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"63167dd5-2fb6-4891-b271-1cacc547a1b2\"}":{"__typename":"Education","uuid":"63167dd5-2fb6-4891-b271-1cacc547a1b2","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Computer Science \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"3375ee5b-f0b7-4dfb-9839-2d052879e4dc\"}":{"__typename":"MentorPublicProfile","uuid":"3375ee5b-f0b7-4dfb-9839-2d052879e4dc","displayName":"Gio M.","slug":"gio-martinez","biography":"\u003cp\u003eHi! My name is Gio and I'm super excited to be a Curious Cardinals mentor. A little about me: I'm a QuestBridge National College Match Scholar which means I get to attend the great Yale University on a full ride! I spent this past summer abroad in Barcelona, Spain where I was able to immerse myself in Spanish culture and travel to 6 other countries (the middle photo is me in Morocco and the right one is me in France). This upcoming summer I'll be interning at Microsoft where I'll be working with software engineering and product management teams which I'm super excited about! In my free time I like to stay active so I go to the gym regularly, go on hikes with friends, or join a pickup soccer or basketball game. At school, I also volunteer with a group providing underfunded elementary schools in our local area with basic programming lessons and support. I'm really passionate about teaching and honestly enjoy being able to share my knowledge with someone else and see them slowly start to build up skills on their own. My past summers in high school I was a soccer camp coach and a summer camp counselor for people with developmental disabilities so I've had experience being a mentor and friend to others. I'm majoring in Computer Science \u0026amp; Economics which is a joint major here at Yale because I honestly find both concepts very interesting and am excited to see how the two connect and how I can use that in my future. At the moment I am fascinated with performance runtimes and using low-level programming languages to make things run super fast so I'm hopefully going to be joining this super cool startup very soon that uses these cool concepts and I hope to learn a lot. Overall, I would say I'm more of a STEM person but I definitely know a lot about the college admissions process, especially when it comes to telling your story which is what QuestBridge is all about. And from being here at Yale, I think I've gained a substantial amount of knowledge from my fellow classmates on their journeys as well so I would be happy to share all the knowledge I've gained over these past few years. I look forward to working with you!!\u003c/p\u003e","teachingVideoPlaybackId":"kDVS4mpZOMDpioMKnbQbfQ1X1jE486qgQNTpp3WGevI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2626873d-f11d-4ecb-a4fc-65b4192058ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"de285bcf-ac68-4839-9e07-7b19c8bb5046\"}"},{"__ref":"DeepDives:{\"uuid\":\"9bc2b6c3-0b87-49b8-ae8a-09de5d9ea5b0\"}"},{"__ref":"DeepDives:{\"uuid\":\"f11db72b-4a91-42fe-b293-2ae275921a42\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c8d55dcc-2ea5-47c0-a911-ecc80e9b0606/-/preview/-/format/jpg/","https://ucarecdn.com/fd389008-982e-4f6a-9adf-585eb123306e/-/preview/-/format/jpg/","https://ucarecdn.com/8077deae-c1d9-41e2-816c-23c2df07cf0b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8168f744-99a6-4fe6-a99c-79d7e5ff5a0c\"}"},{"__ref":"Education:{\"uuid\":\"63167dd5-2fb6-4891-b271-1cacc547a1b2\"}"}],"hiredAt":"2026-01-28T02:09:52.389Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Writing","Spanish","Academic Coaching","College Essay Writing","Economics","Computer Science","Executive Function","K-6 Storybook","Creative Writing","Sports Journalism","Business / Entrepreneurship","Coding / Programming","Machine Learning / AI","STEM Project","Game Design","Web Design","Sports Analytics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gio-martinez\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3375ee5b-f0b7-4dfb-9839-2d052879e4dc\"}"}}},"_sentryTraceData":"dbc687ea47cd487d8c810504afb455ce-938b25dc8270ab98-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=dbc687ea47cd487d8c810504afb455ce,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"gio-martinez"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=
