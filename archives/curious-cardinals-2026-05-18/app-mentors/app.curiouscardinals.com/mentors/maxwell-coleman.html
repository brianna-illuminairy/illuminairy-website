xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bb1e6445-90ce-49dc-954a-484d359abbb3\"}":{"__typename":"Favorites","uuid":"bb1e6445-90ce-49dc-954a-484d359abbb3","photoUrl":"https://ucarecdn.com/fc5dc7c7-541e-4fae-8125-1593716ccd66/","title":"Adam Sandler","type":"ACTOR"},"Favorites:{\"uuid\":\"011eefaa-7bae-46d4-ac37-587c15d25c36\"}":{"__typename":"Favorites","uuid":"011eefaa-7bae-46d4-ac37-587c15d25c36","photoUrl":"https://ucarecdn.com/d216cf9f-b0fd-40e6-9b69-8a5c4227e3b0/","title":"Morgan Wallen","type":"ARTIST"},"Favorites:{\"uuid\":\"40fa38d1-7b59-4ae9-93d8-2e7b90091754\"}":{"__typename":"Favorites","uuid":"40fa38d1-7b59-4ae9-93d8-2e7b90091754","photoUrl":"https://ucarecdn.com/576b9d3f-55a0-499b-bd1c-38896f5c35ad/","title":"Bryce Harper","type":"ATHLETE"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"855511bf-bf35-4100-9c67-07ef2626d2f5\"}":{"__typename":"DeepDives","uuid":"855511bf-bf35-4100-9c67-07ef2626d2f5","content":"\u003cp\u003eMy dad is my greatest role model. He goes the extra mile every day to show me what it means to be a great father, businessman, leader, husband, and citizen. I am extremely lucky to have his mentorship to guide me through this crazy game of life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e3729bb7-0c14-4368-8a43-5dee82e90890\"}":{"__typename":"DeepDives","uuid":"e3729bb7-0c14-4368-8a43-5dee82e90890","content":"\u003cp\u003eI would tell my middle or high school self to focus more on learning for the sake of growth, rather than just grades or external validation. I’d encourage taking risks, embracing failure, and not being afraid to make mistakes, as they are essential for growth. I’d also remind myself to be kinder and more patient, both with others and with myself, and to invest in building meaningful relationships that will last beyond school. Finally, I'd emphasize the importance of finding balance and not stressing too much over things that won't matter in the long run.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f7728e77-c216-41fc-811f-cef8123c2e44\"}":{"__typename":"DeepDives","uuid":"f7728e77-c216-41fc-811f-cef8123c2e44","content":"\u003cp\u003eMentorship matters to me because it provides guidance, perspective, and support that helps me grow both personally and professionally. A good mentor not only shares their knowledge and experiences but also challenges me to think differently and push beyond my limits. They help me navigate difficult decisions, offer valuable feedback, and serve as a role model for how to approach challenges with resilience and integrity. Having someone who believes in my potential and helps me stay focused on my goals makes a huge difference in my journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"29e23dba-52de-41f4-a207-ffd625223757\"}":{"__typename":"DeepDives","uuid":"29e23dba-52de-41f4-a207-ffd625223757","content":"\u003cp\u003eI am extremely proud of my time serving as President in my fraternity. I gained invaluable insights from this experience, including leadership skills, public speaking, conflict resolution, and time management. I had the opportunity to lead a diverse group of individuals, each with their own strengths and challenges, and this experience taught me how to build consensus, motivate others, and create an environment where everyone felt valued and supported. I also learned the importance of adaptability, as no two situations were ever the same, and being able to think critically and act decisively was key to overcoming obstacles. The responsibilities I carried as president not only shaped my personal growth, but also deepened my sense of community and commitment to service, which I continue to apply in all areas of my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6\"}":{"__typename":"School","uuid":"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6","name":"Parkland High School","city":"Allentown","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"18104"},"Education:{\"uuid\":\"bb465eda-2c58-4827-9c08-696e64658a2c\"}":{"__typename":"Education","uuid":"bb465eda-2c58-4827-9c08-696e64658a2c","school":{"__ref":"School:{\"uuid\":\"fbf2b15f-ffb4-41ae-a43e-d7c2ecda49e6\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"7b5a007c-76f8-494d-8a6b-97e0e9f72e22\"}":{"__typename":"School","uuid":"7b5a007c-76f8-494d-8a6b-97e0e9f72e22","name":"Syracuse University","city":"Syracuse","type":"COLLEGE","state":"New York","country":"United States","zip":"13244"},"Education:{\"uuid\":\"a6d548d3-2429-4df1-8307-b87f61408ed9\"}":{"__typename":"Education","uuid":"a6d548d3-2429-4df1-8307-b87f61408ed9","school":{"__ref":"School:{\"uuid\":\"7b5a007c-76f8-494d-8a6b-97e0e9f72e22\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Finance and Real Estate","degree":null},"MentorPublicProfile:{\"uuid\":\"70c40de2-87c6-4e3b-bc44-d3227056c1c5\"}":{"__typename":"MentorPublicProfile","uuid":"70c40de2-87c6-4e3b-bc44-d3227056c1c5","displayName":"Maxwell C.","slug":"maxwell-coleman","biography":"\u003cp\u003eHi! I’m Max Coleman, a 21-year-old student at Syracuse University, where I’m pursuing dual majors in Finance and Real Estate. Originally from Allentown, Pennsylvania, I’m someone who thrives on passion—whether it’s in my academic pursuits, my career goals, or the activities I love to do outside of class.\u003c/p\u003e\u003cp\u003eEver since I was young, I’ve had a strong interest in both business and sports. Finance and Real Estate felt like the perfect fit for me because they combine analytical thinking with the ability to create tangible, long-term impact. I’ve already gained several years of experience in both industries, working in finance and real estate roles that have sharpened my skills and confirmed that this is the field I want to build my future in. I’m especially excited by the dynamic opportunities these fields present and the potential to make a real difference in communities and organizations.\u003c/p\u003e\u003cp\u003eBeyond my academic and professional ambitions, I’m incredibly passionate about sports. Whether it’s playing golf on the weekends, watching my favorite teams (big Philadelphia sports fan), or staying active through other sports, athletics is a huge part of my life. Golf is a particular favorite of mine. Outside of the competitive side, sports also help me build strong relationships and connect with people from all walks of life. I’ve also been fortunate to have a diverse group of friends and family who I cherish deeply. They’re the people who inspire me, push me to be my best, and remind me of the importance of staying grounded and connected.\u003c/p\u003e\u003cp\u003eTraveling is another one of my passions. I’ve been lucky to visit a few amazing places during my travel abroad to Barcelona. Traveling allows me to learn about different cultures, broaden my perspective, and, of course, meet incredible new people along the way.\u003c/p\u003e\u003cp\u003eBeing an outgoing person, I love meeting new people and hearing their stories. I thrive in social situations, whether it’s networking events, grabbing coffee with classmates, or hanging out with friends and family. I believe in the power of relationships—whether professional or personal—and I love being in environments where I can learn from others and share my own experiences. My time at Syracuse University has shaped me into someone who is focused, driven, and excited for the future. If you’re looking for someone who is committed to hard work, constantly strives for excellence, and values meaningful connections, then I think we’d get along great!\u003c/p\u003e\u003cp\u003eFeel free to reach out to chat—I’m always open to new connections and collaborations!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bb1e6445-90ce-49dc-954a-484d359abbb3\"}"},{"__ref":"Favorites:{\"uuid\":\"011eefaa-7bae-46d4-ac37-587c15d25c36\"}"},{"__ref":"Favorites:{\"uuid\":\"40fa38d1-7b59-4ae9-93d8-2e7b90091754\"}"}],"causesSupported":[],"major":"Finance and Real Estate","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"855511bf-bf35-4100-9c67-07ef2626d2f5\"}"},{"__ref":"DeepDives:{\"uuid\":\"e3729bb7-0c14-4368-8a43-5dee82e90890\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7728e77-c216-41fc-811f-cef8123c2e44\"}"},{"__ref":"DeepDives:{\"uuid\":\"29e23dba-52de-41f4-a207-ffd625223757\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/01e0814e-318d-4f2e-8232-fc51a610aaba/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gende
