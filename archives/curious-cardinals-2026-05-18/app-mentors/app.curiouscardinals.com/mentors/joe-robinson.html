xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"665d1b92-2d32-468e-a53b-e066b57b7d50\"}":{"__typename":"DeepDives","uuid":"665d1b92-2d32-468e-a53b-e066b57b7d50","content":"\u003cp\u003eMy little cousins spend a ton of time on their iPads. Their parents hate it. I'm making AI coloring sheets of caricatures of them with their favorite things. They've loved coloring them so far!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a1d7739d-55f6-4101-8b8f-3a848fd3feec\"}":{"__typename":"DeepDives","uuid":"a1d7739d-55f6-4101-8b8f-3a848fd3feec","content":"\u003cp\u003eSurfing, dancing, rock climbing, walking, reading, petting dogs, playing with cats, eating burritos, watching Duke basketball, talking about Duke basketball.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"251273c8-880a-4285-ac3a-2fb3ff565a51\"}":{"__typename":"DeepDives","uuid":"251273c8-880a-4285-ac3a-2fb3ff565a51","content":"\u003cp\u003eI cherish the mentors I've had and I've had a lot of times when I've felt on top of the world and in the dumps. I wish I had a near-peer mentor in those times to help guide and support me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6389135c-de45-44c9-bd90-315a8b692af2\"}":{"__typename":"DeepDives","uuid":"6389135c-de45-44c9-bd90-315a8b692af2","content":"\u003cp\u003eCherish this time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"13526954-496c-4f80-ad78-4c5ab088c01d\"}":{"__typename":"School","uuid":"13526954-496c-4f80-ad78-4c5ab088c01d","name":"High Tech High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92106"},"Education:{\"uuid\":\"ff1c8d27-3502-4ea3-a7fe-01487ff747ce\"}":{"__typename":"Education","uuid":"ff1c8d27-3502-4ea3-a7fe-01487ff747ce","school":{"__ref":"School:{\"uuid\":\"13526954-496c-4f80-ad78-4c5ab088c01d\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"fdbfad09-c04a-4bde-a207-b2c36310e44c\"}":{"__typename":"Education","uuid":"fdbfad09-c04a-4bde-a207-b2c36310e44c","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"62c37f5a-c183-4f58-b736-c62e93814795\"}":{"__typename":"MentorPublicProfile","uuid":"62c37f5a-c183-4f58-b736-c62e93814795","displayName":"Aaron P.","slug":"joe-robinson","biography":"\u003cp\u003eHey, I'm Aaron!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy life is guided by curiosity and joy. I wrote my own curriculum for all of high school centered around my passions for electrical engineering and climate. I built oceanic moored buoys, rocket parachute ejectors, and weather balloon data loggers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy data logger went semi viral online and I published a paper on it in a peer reviewed academic journal my senior year of high school. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile school was a blast academically, I struggled socially until I did a summer program the summer going into my junior year of high school at MIT. This was the first time I was around other kids who shared the ambitions and goals that I have.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI then went to Duke to study electrical engineering and hated it. My learning was no longer guided by my curiosities and I lost my love for learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI decided to take time away from college and move to San Francisco to work on a climate tech startup. It was the most learning intensive time of my life. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter 8 months, I had rediscovered my \"why\" and went back to Duke as a computer science major and loved it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI care deeply about the future of education, curiosity, and joyous learning. I don't think school has to be boring and, in fact, it's innately joyful. We just have to let students explore what they find interesting. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm eager to help you find those things that get you excited and make tangible progress turning your ideas into reality.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love connecting with students. I have worked as a project based learning consultant for the last 6 years and have led students at summer camps for two years in college. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love surfing, rock climbing, silliness, burritos, and Duke basketball.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm super excited to get to know you and your family!\u003c/p\u003e","teachingVideoPlaybackId":"QAFMn5ABgZo014cd8zt81qZb8CHfJjkCUrnUIFfmTEfg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"665d1b92-2d32-468e-a53b-e066b57b7d50\"}"},{"__ref":"DeepDives:{\"uuid\":\"a1d7739d-55f6-4101-8b8f-3a848fd3feec\"}"},{"__ref":"DeepDives:{\"uuid\":\"251273c8-880a-4285-ac3a-2fb3ff565a51\"}"},{"__ref":"DeepDives:{\"uuid\":\"6389135c-de45-44c9-bd90-315a8b692af2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d2d3e405-b763-4c8d-9d85-8f9ee6b00df2/-/preview/-/format/jpg/","https://ucarecdn.com/f2e98ff5-24ff-4d1b-9eb5-bfae3c682ade/-/preview/-/format/jpg/","https://ucarecdn.com/e421a488-2fe0-4b4f-ada1-6ca18b485765/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"ff1c8d27-3502-4ea3-a7fe-01487ff747ce\"}"},{"__ref":"Education:{\"uuid\":\"fdbfad09-c04a-4bde-a207-b2c36310e44c\"}"}],"hiredAt":"2024-07-23T18:19:06.280Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"joe-robinson\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"62c37f5a-c183-4f58-b736-c62e93814795\"}"}}},"_sentryTraceData":"febca8ae62194fa4a6a477a6fdf1a40b-8ddd6359b84721d7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=febca8ae62194fa4a6a477a6fdf1a40b,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false
