xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e3ddedfd-bceb-46ee-b3e6-f0567001b20b\"}":{"__typename":"Favorites","uuid":"e3ddedfd-bceb-46ee-b3e6-f0567001b20b","photoUrl":"https://ucarecdn.com/54263ecd-828e-4a53-85c9-ece0e641e508/","title":"Drew Brees","type":"ATHLETE"},"Favorites:{\"uuid\":\"1b01513e-49f7-4cb4-b6cc-605fc11bb5f7\"}":{"__typename":"Favorites","uuid":"1b01513e-49f7-4cb4-b6cc-605fc11bb5f7","photoUrl":"https://ucarecdn.com/5768a006-b81d-404c-bec4-572b5fb21abc/","title":"San Diego","type":"CITY"},"Favorites:{\"uuid\":\"e6065aa6-e4bb-4d56-9be2-8e8d8ed66c39\"}":{"__typename":"Favorites","uuid":"e6065aa6-e4bb-4d56-9be2-8e8d8ed66c39","photoUrl":"https://ucarecdn.com/9ce69e2e-a599-496f-8472-35125cb96f60/","title":"The Beatles","type":"ARTIST"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"f8c3e1fd-33f5-4ee8-abf0-19dc26658bfb\"}":{"__typename":"DeepDives","uuid":"f8c3e1fd-33f5-4ee8-abf0-19dc26658bfb","content":"\u003cp\u003eWaking up safe and healthy every day is my biggest motivation to be successful. The freedom and ability to control my destiny is a liberty I don't take for granted and the reason I never let up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"50b7e959-235d-4078-a718-121aa877f118\"}":{"__typename":"DeepDives","uuid":"50b7e959-235d-4078-a718-121aa877f118","content":"\u003cp\u003eIn high school I felt a passion for creating measurable change in people's lives. Like a doctor who can save a life or an attorney who can protect someone's innocence, I wanted to work in service of others. I decided to study architecture because I saw a way to serve all human beings through the basic human need of shelter.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"998493e3-3bcd-460a-88eb-445a3f3cdc69\"}":{"__typename":"DeepDives","uuid":"998493e3-3bcd-460a-88eb-445a3f3cdc69","content":"\u003cp\u003e\"Do everything to the best of your ability, but don't forget to rest with the same intensity.\"\u003cbr\u003e\u003cbr\u003ePersistent hard work will allow you to achieve your dream, but taking the time to recharge will allow you to do it again and again... balance is key!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"5a04a4fb-3530-4e87-9ca0-daf1d29e62bd\"}":{"__typename":"DeepDives","uuid":"5a04a4fb-3530-4e87-9ca0-daf1d29e62bd","content":"\u003cp\u003eMy dream job is to be a professional golfer. I would get to stay healthy and active, travel the world, and do what I love every single day!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"b4683ba8-9b52-4556-bf26-f5ba9c20cf67\"}":{"__typename":"School","uuid":"b4683ba8-9b52-4556-bf26-f5ba9c20cf67","name":"Saint Augustine High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92104"},"Education:{\"uuid\":\"312269de-f751-4c44-a041-7d617a218935\"}":{"__typename":"Education","uuid":"312269de-f751-4c44-a041-7d617a218935","school":{"__ref":"School:{\"uuid\":\"b4683ba8-9b52-4556-bf26-f5ba9c20cf67\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"139f5eab-dc6c-4d61-a990-a6bd7786f007\"}":{"__typename":"Education","uuid":"139f5eab-dc6c-4d61-a990-a6bd7786f007","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Architecture","degree":null},"MentorPublicProfile:{\"uuid\":\"2aea13dc-d673-4b41-a976-887dbea8b3b0\"}":{"__typename":"MentorPublicProfile","uuid":"2aea13dc-d673-4b41-a976-887dbea8b3b0","displayName":"Will S.","slug":"will-simon","biography":"\u003cp\u003eHey, I'm Will and I recently graduated from Washington University in St. Louis. During my time at WashU, I studied Architecture and developed a passion for designing buildings and spaces for people to thrive in. What began as a simple interest and curiosity in the world around me blossomed into a passion for wanting to design it myself. I learned how to dream, sketch, design, build, and manifest all of my wildest ideas and imaginations. Now, I wish to share all I have learned with eager students just like you!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlong with my passion for learning is my passion for teaching and mentoring! As Lead Coordinator of the Big Brother Program, I provided yearlong mentorship for over 200 freshman boys entering high school as an effort to ease their transition and provide them support. Additionally, I was selected as senior captain of my high school football team and helped lead my school to its first championship victory in five years. In college, I was a part of a course series that provided student generated curriculum for inner city elementary students. I met once a week with each of my groups to teach them personally designed curriculum based on their own interests and feedback. The program was just like the work I do at Curious Cardinals and became my inspiration for joining the team!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not mentoring, I love to be active! My favorite activities are biking, hiking, and playing golf. Although I enjoy designing buildings, I have the best times when I’m outside of them. I am also a very curious and inquisitive person. I try to learn something new every day whether it's from a book, a video, or through talking with someone I know.\u003c/p\u003e","teachingVideoPlaybackId":"vt3LVuSRJ02IIAgFkO8kDvx021WxoyvCxubtZ02m003Ei7s","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was winning the Division I Football Championship my senior year of high school. It was the culmination of persistence, dedication, and overcoming adversity. Most of all, it was the fulfillment of a promise I made myself four years earlier. As a freshman I watched our team lose in the championship game and promised myself that I would win one before I graduated. Sure enough, as team captain my senior year, I was able to lead my team to a last second overtime victory and see the fulfillment of my dreams unfold in front of me. It serves me today as a reminder of what I am capable of and a coveted memory I hold dear.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e3ddedfd-bceb-46ee-b3e6-f0567001b20b\"}"},{"__ref":"Favorites:{\"uuid\":\"1b01513e-49f7-4cb4-b6cc-605fc11bb5f7\"}"},{"__ref":"Favorites:{\"uuid\":\"e6065aa6-e4bb-4d56
