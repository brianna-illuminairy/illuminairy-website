uestion:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d5d03037-a1dd-49e9-87fb-752c8832105f\"}":{"__typename":"DeepDives","uuid":"d5d03037-a1dd-49e9-87fb-752c8832105f","content":"\u003cp\u003eEverything works out in the end! Prepare for the future but always focus on the present and what you have right now or what you've already accomplished.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8ada5a00-585c-48ba-8832-4897e9606f39\"}":{"__typename":"DeepDives","uuid":"8ada5a00-585c-48ba-8832-4897e9606f39","content":"\u003cp\u003eI chose Biology because I’ve always enjoyed learning about living things and how life works.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI chose Political Science because I’m interested in how governments and policies shape the world around us.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"f4894c36-e688-4834-852a-93856957254e\"}":{"__typename":"DeepDives","uuid":"f4894c36-e688-4834-852a-93856957254e","content":"\u003cp\u003eI was born in Montreal, Canada and moved to the United States when I was 5. I knew how to skate years before I knew how to swim!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"81650f9b-7529-41f3-8a97-3b0f4c8228d7\"}":{"__typename":"School","uuid":"81650f9b-7529-41f3-8a97-3b0f4c8228d7","name":"Trinity Preparatory School","city":"Winter Park","type":"HIGH","state":"Florida","country":"United States","zip":"32792"},"Education:{\"uuid\":\"8bbdd5ea-8a69-4828-a399-975722c4c369\"}":{"__typename":"Education","uuid":"8bbdd5ea-8a69-4828-a399-975722c4c369","school":{"__ref":"School:{\"uuid\":\"81650f9b-7529-41f3-8a97-3b0f4c8228d7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"656b953f-7952-4cdb-ab89-575c97d4d5dc\"}":{"__typename":"Education","uuid":"656b953f-7952-4cdb-ab89-575c97d4d5dc","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology \u0026 Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"ed87fe15-ed04-4cc8-a8f6-34fa8c167fbb\"}":{"__typename":"MentorPublicProfile","uuid":"ed87fe15-ed04-4cc8-a8f6-34fa8c167fbb","displayName":"Gabriel S.","slug":"gabriel-steinberg","biography":"\u003cp\u003eHi, my name is Gabriel! I recently graduated from the University of Pennsylvania with a B.A. in Biology and Political Science. I'm very passionate about helping others learn and reach their goals, as I've tutored and mentored ever since a young age. I even taught my younger siblings what I learned in class when I was just 6 years old!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have extensive experience tutoring French and Spanish as well as English (writing specifically) and Math. In the future, I plan on attending medical school so I am happy to guide anyone through science or pre-med coursework, too. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI approach tutoring sessions by asking you what your goals are for the session that day, for the coming weeks, and long-term. That could be improving your grade in Spanish from a C to an A or becoming a more confident and independent writer.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also have experience as a mentor through being captain of the Varsity Tennis team, president of the National Spanish Honor Society, and the captain of the Speech \u0026amp; Debate team of my high school. In college, I was a peer advisor for the Freshman Year Leadership Board at Penn Hillel and the College of Arts \u0026amp; Sciences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor the past 4 years, I was a tutor for the West Philadelphia Tutoring Project, where I helped students from elementary to high school ages in subjects from reading to algebra. I was also a writer for The Daily Pennsylvanian, Penn's student paper. I wrote about sports at first, then transitioned to general news, and then to the science and health desk.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor the past 2 years, I was a TA for Introductory Statistics at the Wharton School of Business, where I led my own classes on Fridays and review sessions before exams. I was also a research assistant for the past 2 years at the Children's Hospital of Philadelphia where I was part of a study investigating sleep disordered breathing and insufficient sleep in preschoolers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I took 13 AP classes (Calculus AB, Calculus BC, Spanish, French, World History, U.S. History, U.S. Government \u0026amp; Politics, Comparative Government \u0026amp; Politics, Macroeconomics, Microeconomics, Biology, English Language, and English Lit), receiving 4s and 5s on all exams. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI competed at the Florida French and Spanish state competitions, where I received 1st in my division in impromptu speaking at both. I was also named a National Speech and Debate Academic All-American for my experience and achievements in Original Oratory, Informative Speaking, and Impromptu Speaking.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy playing tennis and pickleball, trying new restaurants and traveling to new places (especially where I can speak the language).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA fun fact about me is that I have cousins on all continents (except Antarctica).\u003c/p\u003e","teachingVideoPlaybackId":"hwV01GX005iWiS01mW02LSSiwjCF32j5viyVPCjEBS02ZZX8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy senior year of high school, I competed at the Florida Blue Key Speech and Debate Tournament through UF and I placed 5th out of 100+ competitors in Original Oratory! I gave a 10-minute speech that was about how a better solution to cancel culture is education and calling others in to conversation.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"fa6d815a-52f0-4729-9795-d0ff64da969d\"}"},{"__ref":"Favorites:{\"uuid\":\"16990019-530b-4b0c-ab7f-e6550558e188\"}"},{"__ref":"Favorites:{\"uuid\":\"1466ae0c-55dc-42a0-8fa9-b5f433ccc6cb\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"ce3c5a17-6dbc-415f-bfb0-2420fdb2f05a\"}"}],"major":"Biology \u0026 Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d1f0b607-e07a-454e-b2b2-0164327919e7\"}"},{"__ref":"DeepDives:{\"uuid\":\"d5d03037-a1dd-49e9-87fb-752c8832105f\"}"},{"__ref":"DeepDives:{\"uuid\":\"8ada5a00-585c-48ba-8832-4897e9606f39\"}"},{"__ref":"DeepDives:{\"uuid\":\"f4894c36-e688-4834-852a-93856957254e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0b89eaab-eb78-4fa4-977f-4d84a2be71a7/-/preview/-/format/jpg/","https://ucarecdn.com/d2955205-f191-48d5-aa1f-00a5a7dcfd17/-/preview/-/format/jpg/","https://ucarecdn.com/4c78211f-7b2b-4e8b-95ea-4ca287e327ee/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","e
