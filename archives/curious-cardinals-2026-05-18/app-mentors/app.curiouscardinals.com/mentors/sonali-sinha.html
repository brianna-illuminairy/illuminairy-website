xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2d80bffc-8427-4532-aa70-8bba92a96072\"}":{"__typename":"Favorites","uuid":"2d80bffc-8427-4532-aa70-8bba92a96072","photoUrl":"https://ucarecdn.com/6b4fa6c3-587b-46e7-b8b1-5291b1e59034/","title":"Scarlett Johansson ","type":"ACTOR"},"Favorites:{\"uuid\":\"c994abe4-fe62-45fa-99d2-ae65f79248f9\"}":{"__typename":"Favorites","uuid":"c994abe4-fe62-45fa-99d2-ae65f79248f9","photoUrl":"https://ucarecdn.com/c26a0012-70ad-4361-ac5f-0f4647dddb28/","title":"Chess","type":"SPORT"},"Favorites:{\"uuid\":\"02f7ba0a-31ee-4a63-b5e3-a1604d727923\"}":{"__typename":"Favorites","uuid":"02f7ba0a-31ee-4a63-b5e3-a1604d727923","photoUrl":"https://ucarecdn.com/bf79f591-b8d1-42c5-945d-17f916c72228/","title":"Tenet","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b84f35f1-c236-485c-8029-9fb60942b7de\"}":{"__typename":"DeepDives","uuid":"b84f35f1-c236-485c-8029-9fb60942b7de","content":"\u003cp\u003eIf I could give advice to my middle or high school self, it would be this:\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eYou don’t need to have everything figured out early but you do need to stay curious and consistent.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI spent a lot of time worrying about doing things “the right way” or comparing myself to people who seemed ahead. What I didn’t realize then was that growth isn’t linear. The skills that matter most discipline, problem-solving, resilience, and self-belief are built slowly through effort, not overnight success.\u003c/p\u003e\u003cp\u003eI’d also tell myself that \u003cstrong\u003estruggling doesn’t mean you’re bad at something\u003c/strong\u003e. It usually means you’re learning. Some concepts will click immediately, others will take time and that’s normal. Asking questions, making mistakes, and feeling confused are not signs of weakness; they’re part of the process.\u003c/p\u003e\u003cp\u003eAnother big piece of advice: \u003cstrong\u003edon’t ignore habits\u003c/strong\u003e. Small daily routines how you study, how you organize your time, how you take care of yourself matter more than last-minute cramming or bursts of motivation. Consistency beats intensity every single time.\u003c/p\u003e\u003cp\u003eFinally, I’d remind myself that \u003cstrong\u003eyou’re allowed to have more than one interest\u003c/strong\u003e. You don’t have to choose between being analytical and creative, academic and expressive, serious and curious. Exploring different sides of yourself isn’t a distraction it’s how you discover what truly excites you.\u003c/p\u003e\u003cp\u003eTrust the process. Keep showing up. You’ll grow into things you can’t even imagine yet.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"09da0d66-3fb3-438f-97d8-b076b18584e8\"}":{"__typename":"DeepDives","uuid":"09da0d66-3fb3-438f-97d8-b076b18584e8","content":"\u003cp\u003eMentorship matters to me because it can change the way someone sees \u003cstrong\u003ethemselves\u003c/strong\u003e, not just the subject they’re learning.\u003c/p\u003e\u003cp\u003eGrowing up and later in my career, I learned that progress isn’t only about intelligence or talent it’s about having someone who believes in you when you’re unsure, who explains things without judgment, and who helps you build confidence step by step. I’ve seen how the right mentor can turn fear into curiosity and confusion into clarity.\u003c/p\u003e\u003cp\u003eFor me, mentorship is about \u003cstrong\u003emaking learning feel human\u003c/strong\u003e. Many students struggle not because they aren’t capable, but because they feel overwhelmed, intimidated, or afraid of making mistakes. I care deeply about creating a space where questions are welcome, mistakes are part of learning, and students feel safe to try. When that happens, learning stops feeling like pressure and starts feeling empowering.\u003c/p\u003e\u003cp\u003eMentorship also matters because no two students learn the same way. I enjoy helping students find study methods, routines, and problem-solving approaches that actually work for \u003cem\u003ethem\u003c/em\u003e, instead of forcing a one-size-fits-all formula. Watching someone gain confidence and independence in their learning is incredibly rewarding.\u003c/p\u003e\u003cp\u003eUltimately, mentorship matters to me because it’s not just about teaching skills  it’s about helping students trust themselves, stay curious, and realize that they’re capable of far more than they think.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"285bbd93-0522-4917-97c7-b83516d2da92\"}":{"__typename":"DeepDives","uuid":"285bbd93-0522-4917-97c7-b83516d2da92","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to \u003cstrong\u003ecreate meaningful impact by bridging technology and people\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eI want to build and contribute to systems, products, and learning spaces that don’t just work efficiently, but are also \u003cstrong\u003ethoughtful, ethical, and human-centered\u003c/strong\u003e. Whether through engineering, mentorship, or writing, my goal is to help people understand technology deeply enough to use it responsibly and confidently not fear it.\u003c/p\u003e\u003cp\u003eI also hope to empower others, especially students and early learners, to believe in their ability to grow. If even a few people walk away from learning experiences with more confidence, clarity, and curiosity because of something I built or taught, that would matter deeply to me.\u003c/p\u003e\u003cp\u003eAt the core, I want my work to leave people better equipped technically, intellectually, and emotionally than they were before.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1b61fd63-18bc-4591-b6c9-2edc00ea03c6\"}":{"__typename":"DeepDives","uuid":"1b61fd63-18bc-4591-b6c9-2edc00ea03c6","content":"\u003cp\u003eI chose my major because I was drawn to \u003cstrong\u003ehow ideas turn into real, working systems\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eI’ve always been curious about how things function beneath the surface — not just \u003cem\u003ewhat\u003c/em\u003e works, but \u003cem\u003ewhy\u003c/em\u003e it works and \u003cem\u003ehow\u003c/em\u003e different pieces come together. Engineering and computer science gave me a way to think logically, break down complex problems, and build solutions that have tangible impact.\u003c/p\u003e\u003cp\u003eWhat really confirmed my choice was realizing that this field isn’t just about code or formulas it’s about \u003cstrong\u003eproblem-solving, structure, and decision-making\u003c/strong\u003e. I enjoy the process of taking an abstract problem, understanding its constraints, and designing something practical and scalable. That mindset applies far beyond technology, and it’s something I value deeply.\u003c/p\u003e\u003cp\u003eI also liked that my major constantly challenges me to keep learning. Technology evolves quickly, and that means curiosity, adaptability, and discipline matter as much as technical skill. Choosing this path felt right because it aligned with both how I think and how I want to grow as someone who builds, questions, and improves systems over time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"6283487e-47cf-421f-b50c-5a69dabfb772\"}":{"__typename":"School","uuid":"6283487e-47cf-421f-b50c-5a69dabfb772","name":"Bethany Convent School","city":"Prayagraj","type":"HIGH","state":"Uttar Pradesh","country":"India","zip":"211008"},"Education:{\"uuid\":\"5844421b-c665-4523-af5c-28bc9878d183\"}":{"__typename":"Education","uuid":"5844421b-c665-4523-af5c-28bc9878d183","school":{"__ref":"School:{\"uuid\":\"6283487e-47cf-421f-b50c-5a69dabfb772\"}"},"startYear":"2014","endYear":"2015","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"5cc07da2-74e0-48aa-8118-ed780ea9e811\"}":{"__typename":"School","uuid":"5cc07da2-74e0-48aa-8118-ed780ea9e811","name":"Visvesvaraya Technological University (VTU) - Online Programs","city":"Hanchya","type":"COLLEGE","state":"Karnataka","country":"India","zip":"570029"},"Education:{\"uuid\":\"c35c6f9b-8904-4367-a65b-357f104ee872\"}":{"__typename":"Education","uuid":"c35c6f9b-8904-4367-a65b-357f104ee872","school":{"__ref":"School:{\"uuid\":\"5cc07da2-74e0-48aa-8118-ed780ea9e811\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Computer Science Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"8d9a0eb8-1d71-4fc8-a277-0a6383f904ab\"}":{"__typename":"MentorPublicProfile","uuid":"8d9a0eb8-1d71-4fc8-a277-0a6383f904ab","displayName":"Sonali S.","slug":"sonali-sinha","biography":"\u003cp\u003e\u003cstrong\u003eSonali Sinha\u003c/strong\u003e is a Software Engineer with nearly six years of experience building scalable, real-world technology systems across enterprise platforms, analytics tools, and full-stack applications. She has worked extensively with \u003cstrong\u003eJava, JavaScript, React, cloud-based architectures, and data-driven systems\u003c/strong\u003e, designing and delivering products that support strategic decision-making and long-term planning for large organizations. Through her professional journey, Sonali has developed a strong foundation not only in coding, but in \u003cstrong\u003esystem thinking, problem decomposition, and understanding how technology interacts with people and organizations\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eAs a mentor, Sonali is deeply passionate about teaching technology in a way that feels \u003cstrong\u003eaccessible, empowering, and human\u003c/strong\u003e. She believes that learning to code is not about memorizing syntax, but about building logic, confidence, and the ability to think clearly under uncertainty. She especially enjoys working with students who feel intimidated by programming or math, helping them move from “I can’t do this” to “I understand how this works.” Her teaching style focuses on \u003cstrong\u003efundamentals, intuition, and real-world examples\u003c/strong\u003e, ensuring students truly grasp concepts rather than simply completing assignments.\u003c/p\u003e\u003cp\u003eSonali teaches programming and technical foundations with particular strength in \u003cstrong\u003eJavaScript, core programming concepts, logical thinking, and problem-solving\u003c/strong\u003e, while also supporting students in developing effective study habits and learning strategies. She strongly believes that success in academics is as much about \u003cstrong\u003econsistency, structure, and mindset\u003c/strong\u003e as it is about intelligence. For students who struggle with focus, overwhelm, or self-doubt, Sonali enjoys helping them design personalized routines and systems that make learning sustainable and less stressful.\u003c/p\u003e\u003cp\u003eBeyond her work in technology and mentorship, Sonali is a writer and creator with a deep interest in the intersection of \u003cstrong\u003etechnology, society, ethics, and human behavior\u003c/strong\u003e. She believes that students should be encouraged to ask not only \u003cem\u003ehow\u003c/em\u003e technology works, but \u003cem\u003ewhy\u003c/em\u003e it is built, \u003cem\u003ewho\u003c/em\u003e it impacts, and \u003cem\u003ewhat responsibility\u003c/em\u003e comes with creating it. This perspective shapes her mentorship approach encouraging curiosity, responsibility, and critical thinking alongside technical skills.\u003c/p\u003e\u003cp\u003eOutside of engineering, Sonali enjoys writing, reflective thinking, and creative exploration. She is a strong believer that you don’t have to fit into a single box you can be analytical and creative, ambitious and thoughtful, disciplined and curious at the same time. If you’re a student who wants to build confidence, explore technology meaningfully, or learn how to grow through both challenges and curiosity, Sonali would love to support you on that journey.\u003c/p\u003e","teachingVideoPlaybackId":"gsmeN8D2NzkLtZclsrrejakqKD9k01KUl9x9K00Z0181Y00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is building a technology project completely from scratch from understanding the problem to designing, building, and improving it based on real feedback.\u003c/p\u003e\u003cp\u003eWhat makes me proud isn’t just the final product, but the process. I had to break down complex ideas into simple pieces, learn continuously, and stay patient when things didn’t work the first time. Over time, I saw how something that started as an idea could genuinely help people understand information better and make clearer decisions.\u003c/p\u003e\u003cp\u003eThat experience taught me how powerful learning can be when it’s done step by step, without fear of mistakes. It’s also why I enjoy mentoring and teaching helping others move from confusion to confidence, just like I had to.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"2d80bffc-8427-4532-aa70-8bba92a96072\"}"},{"__ref":"Favorites:{\"uuid\":\"c994abe4-fe62-45fa-99d2-ae65f79248f9\"}"},{"__ref":"Favorites:{\"uuid\":\"02f7ba0a-31ee-4a63-b5e3-a1604d727923\"}"}],"causesSupported":[],"major":"Computer Science Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b84f35f1-c236-485c-8029-9fb60942b7de\"}"},{"__ref":"DeepDives:{\"uuid\":\"09da0d66-3fb3-438f-97d8-b076b18584e8\"}"},{"__ref":"DeepDives:{\"uuid\":\"285bbd93-0522-4917-97c7-b83516d2da92\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b61fd63-18bc-4591-b6c9-2edc00ea03c6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/89013c38-e563-476a-ada3-61ec0cea1493/-/preview/-/format/jpg/","https://ucarecdn.com/0f1eb2d0-003d-4d6c-a873-d52e58f70177/-/preview/-/format/jpg/","https://ucarecdn.com/1e2da540-8407-467d-86bd-2853e7ad425d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5844421b-c665-4523-af5c-28bc9878d183\"}"},{"__ref":"Education:{\"uuid\":\"c35c6f9b-8904-4367-a65b-357f104ee872\"}"}],"hiredAt":"2026-01-16T15:40:09.750Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Chemistry","Physics","Writing","Creative Writing","History Project","K-6 Storybook","Business / Entrepreneurship","Coding / Programming","Machine Learning / AI","Sports Analytics","STEM Project","Web Design","Debate","Journalism","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/7888bd4b-612e-4eb6-94e7-3442bd9a4a01/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c280a6f3-ba
