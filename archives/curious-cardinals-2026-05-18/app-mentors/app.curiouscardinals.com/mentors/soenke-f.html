xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b4a8a68f-394d-438e-8360-880ad8c1dd79\"}":{"__typename":"Favorites","uuid":"b4a8a68f-394d-438e-8360-880ad8c1dd79","photoUrl":"https://ucarecdn.com/e725ee84-f1db-4cd4-b89a-2171439ac9bb/","title":"Actual Life 2 by Fred Again","type":"ALBUM"},"Favorites:{\"uuid\":\"3510974c-6ff2-4575-9e17-4d37b2d8efe8\"}":{"__typename":"Favorites","uuid":"3510974c-6ff2-4575-9e17-4d37b2d8efe8","photoUrl":"https://ucarecdn.com/44af2cda-c9d4-4add-b7d0-9b15e51881aa/","title":"Taipei","type":"CITY"},"Favorites:{\"uuid\":\"abe54963-9083-451e-b8d8-702c2c68ec0b\"}":{"__typename":"Favorites","uuid":"abe54963-9083-451e-b8d8-702c2c68ec0b","photoUrl":"https://ucarecdn.com/07966a6b-1201-44f7-bd54-76d49c8d40ab/","title":"Triathlon! ","type":"SPORT"},"CausesSupported:{\"uuid\":\"467118cb-c4f0-4dea-89a2-6e4398f3b755\"}":{"__typename":"CausesSupported","uuid":"467118cb-c4f0-4dea-89a2-6e4398f3b755","name":"Meals on Wheels","description":"\u003cp\u003eI eat lunch and dinner with seniors in NYC, who cannot leave their apartments. \u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d5ed0b76-7dd9-44c3-b022-378e821fa800\"}":{"__typename":"DeepDives","uuid":"d5ed0b76-7dd9-44c3-b022-378e821fa800","content":"\u003cp\u003eMy dream job is to become an aviation diplomat! That means I want to work on the regulations that allow people to meet friends and family around the world. It is an often forgotten element of diplomacy but one that combines my two passions of international affairs and aviation!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"fbf6003a-8ad3-4804-880d-9f86f0c54eae\"}":{"__typename":"DeepDives","uuid":"fbf6003a-8ad3-4804-880d-9f86f0c54eae","content":"\u003cp\u003eLearn how to say yes (and no!). While it may sound kind of simple, I personally struggled to keep up with all my obligations, to the point that I was stretching myself too thin. Sitting down to write down what you are saying \"yes\" and \"no\" to can help you get a clearer sense of how you are spending your time and if it is meeting the goals you have set yourself!  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2b66559f-d5a1-4ac1-8865-1abd68d98f82\"}":{"__typename":"DeepDives","uuid":"2b66559f-d5a1-4ac1-8865-1abd68d98f82","content":"\u003cp\u003eThere were a couple of consistencies throughout my summers. I usually travelled to Germany to visit my grandparents, while also working  various internships. So far, I have worked for Senator Bayer (writing immigration legislation), worked on a environmental investment fund at JP Morgan, and helped to pass anti-discrimination legislation in the Michigan Senate. Of course, summer would not be complete without visiting Michigan's many lakes and enjoying Barbeques with friends!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"4d4cd8d7-e943-4378-a3fb-b1f01ffda5e8\"}":{"__typename":"DeepDives","uuid":"4d4cd8d7-e943-4378-a3fb-b1f01ffda5e8","content":"\u003cp\u003eMentorship is important to me because I believe in developing relationships with people. No matter what you study, are interested in, or are persuing, we all need other people to thrive. For me mentorship acts as a sound wall that allows me to flesh out ideas, get new thoughts and be challenged to push my thinking. I want to help you do the same! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"08cbee7b-d9a7-40d4-b1c4-a7ceeeeaa6b7\"}":{"__typename":"School","uuid":"08cbee7b-d9a7-40d4-b1c4-a7ceeeeaa6b7","name":"International Academy Okma","city":"Bloomfield Township","type":"HIGH","state":"Michigan","country":"United States","zip":"48304"},"Education:{\"uuid\":\"e4435a1b-1023-423e-877f-68cc5651d1bc\"}":{"__typename":"Education","uuid":"e4435a1b-1023-423e-877f-68cc5651d1bc","school":{"__ref":"School:{\"uuid\":\"08cbee7b-d9a7-40d4-b1c4-a7ceeeeaa6b7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"25183c4e-950c-4819-a1eb-2aa4c5ac86e5\"}":{"__typename":"Education","uuid":"25183c4e-950c-4819-a1eb-2aa4c5ac86e5","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Urban Studies \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"edf25ea3-2ed5-48c7-a57d-c93eb3d6f62c\"}":{"__typename":"MentorPublicProfile","uuid":"edf25ea3-2ed5-48c7-a57d-c93eb3d6f62c","displayName":"Soenke P.","slug":"soenke-f","biography":"\u003cp\u003eHey! I am Sönke. While I was born in Germany, I grew up in Sweden, Mexico, and China. Moving around has made me fall in love with traveling (some of my favorite places included New Zealand, Brazil, Peru, and Taiwan)! When I am not on a plane, I love to prepare for my triathlon, running, biking, and swimming around New York City! I am also passionate about cooking, volunteering with the elderly and (of course) teaching! I have 3 years of experience as an English teacher for refugees and immigrants, while also helping high schoolers with their college essays and applications! I am looking forward to getting to meet you and understanding what makes you you! \u003c/p\u003e","teachingVideoPlaybackId":"8s3ao9dD3aGn9F3yyCdP9koyMELDrbuNyTkpDfnyGQg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGot to present at the United Nations! I spoke at the Summit of the Future about how we can improve education in India and the time that I spent in the country! \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b4a8a68f-394d-438e-8360-880ad8c1dd79\"}"},{"__ref":"Favorites:{\"uuid\":\"3510974c-6ff2-4575-9e17-4d37b2d8efe8\"}"},{"__ref":"Favorites:{\"uuid\":\"abe54963-9083-451e-b8d8-702c2c68ec0b\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"467118cb-c4f0-4dea-89a2-6e4398f3b755\"}"}],"major":"Urban Studies \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d5ed0b76-7dd9-44c3-b022-378e821fa800\"}"},{"__ref":"DeepDives:{\"uuid\":\"fbf6003a-8ad3-4804-880d-9f86f0c54eae\"}"},{"__ref":"DeepDives:{\"uuid\":\"2b66559f-d5a1-4ac1-8865-1abd68d98f82\"}"},{"__ref":"DeepDives:{\"uuid\":\"4d4cd8d7-e943-4378-a3fb-b1f01ffda5e8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3f9d48ec-641f-4008-aa72-d948a1742a70/-/preview/-/format/jpg/","https://ucarecdn.com/8c7010d7-feb4-4b7b-b045-17d8ff65d742/-/preview/-/format/jpg/","https://ucarecdn.
