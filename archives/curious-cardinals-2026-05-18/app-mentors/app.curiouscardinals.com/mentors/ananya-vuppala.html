xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bab5db48-5ef2-4641-bd7e-adb18941ef93\"}":{"__typename":"Favorites","uuid":"bab5db48-5ef2-4641-bd7e-adb18941ef93","photoUrl":"https://ucarecdn.com/51325c05-b94b-4386-adfe-6d32e4d5f8ef/","title":"The Giver","type":"BOOK"},"Favorites:{\"uuid\":\"aba43d6d-663f-4f67-9b69-78a95f6ef1f4\"}":{"__typename":"Favorites","uuid":"aba43d6d-663f-4f67-9b69-78a95f6ef1f4","photoUrl":"https://ucarecdn.com/7e245eea-3919-4755-9c0d-045796c50ce0/","title":"NOTD","type":"ARTIST"},"Favorites:{\"uuid\":\"4302c061-0277-4787-be9a-ed4bafada2f8\"}":{"__typename":"Favorites","uuid":"4302c061-0277-4787-be9a-ed4bafada2f8","photoUrl":"https://ucarecdn.com/3fdec499-073b-4762-a93e-647f0a06a08f/","title":"NYC","type":"CITY"},"CausesSupported:{\"uuid\":\"4cdbba48-4d64-4743-9b32-e2adae87fbc4\"}":{"__typename":"CausesSupported","uuid":"4cdbba48-4d64-4743-9b32-e2adae87fbc4","name":"Effective altruism","description":"\u003cp\u003eI value doing the most good through evidence and real, quantifiable impact.\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"8db64754-7745-4644-95a0-5acd04218bd4\"}":{"__typename":"CausesSupported","uuid":"8db64754-7745-4644-95a0-5acd04218bd4","name":"Veterans health","description":"\u003cp\u003eEnsuring those who served receive the specialized care and support they earned.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/af7005fe-4a3d-4b5b-b5bd-1a0324ef15c5/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"bdae0359-f86b-4e11-99c7-ed4b565437bb\"}":{"__typename":"DeepDives","uuid":"bdae0359-f86b-4e11-99c7-ed4b565437bb","content":"\u003cp\u003eDo as much as you can! Do what you love, do what you hate, learn about everything and anything. Learning and growing is beautiful and is a privilege ♥\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4e030158-8a91-490a-a71b-6d7c3d8be95c\"}":{"__typename":"DeepDives","uuid":"4e030158-8a91-490a-a71b-6d7c3d8be95c","content":"\u003cp\u003eStart my own philanthropy focusing on real impact and be able to travel the world, meet all kinds of people, and see everything!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"42782445-195f-4bf9-bae5-6cff515250e0\"}":{"__typename":"DeepDives","uuid":"42782445-195f-4bf9-bae5-6cff515250e0","content":"\u003cp\u003eMentorship is important in all stages of life, as it helps guide you be the person you are through building confidence, decision-making skills, and personal accountability.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"afe485fc-f21d-4b63-b89b-662279cb8b48\"}":{"__typename":"DeepDives","uuid":"afe485fc-f21d-4b63-b89b-662279cb8b48","content":"\u003cp\u003eI find great value in supporting younger students and helping them grow, both personally and in areas they want to develop within their capabilities. Mentorship creates space for shared growth: it challenges me to think differently, develop as a leader, and experience the fulfillment that comes from helping someone gain confidence and clarity in their own path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"5c3a72a8-3b55-4793-a8a6-c040702cc41a\"}":{"__typename":"School","uuid":"5c3a72a8-3b55-4793-a8a6-c040702cc41a","name":"Marine Academy of Science and Technology","city":"Highlands","type":"HIGH","state":"New Jersey","country":"United States","zip":"07732"},"Education:{\"uuid\":\"fc9e5492-b0b1-48e5-9d1b-259cf66e32b9\"}":{"__typename":"Education","uuid":"fc9e5492-b0b1-48e5-9d1b-259cf66e32b9","school":{"__ref":"School:{\"uuid\":\"5c3a72a8-3b55-4793-a8a6-c040702cc41a\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"547ab24b-358d-4b45-820e-ee05012ada62\"}":{"__typename":"Education","uuid":"547ab24b-358d-4b45-820e-ee05012ada62","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics and Statistics \u0026 Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"4434cf37-47bb-48d3-9a17-63897f19a986\"}":{"__typename":"MentorPublicProfile","uuid":"4434cf37-47bb-48d3-9a17-63897f19a986","displayName":"Ananya V.","slug":"ananya-vuppala","biography":"\u003cp\u003eI am currently a sophomore at \u003cstrong\u003eYale University\u003c/strong\u003e pursuing a double major in \u003cstrong\u003eEconomics and Statistics \u0026amp; Data Science\u003c/strong\u003e. My academic and professional journey is defined by a fascination with using data-driven insights to solve complex problems and a deep-seated commitment to empowering the next generation of students through mentorship and community leadership. I'm also motivated by the possibility of solving complex problems through data and understanding various lived experiences, ranging from financial market analysis to neurodegenerative disease research.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy dedication to mentorship and education began with the \u003cstrong\u003eOnline Monmouth Math Competition (OMMC)\u003c/strong\u003e, which I co-founded and led as the Director of Outreach. Over four years, I grew the competition to engage over 5,000 members and secured a prize pool exceeding $12,000. This experience in organizing large-scale academic events and hosting speaker sessions established my foundation in student outreach and community building.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my leadership in educational organizations, I have a strong background in independent scientific research. I conducted an award-winning study using \u003cstrong\u003ePython\u003c/strong\u003e and \u003cstrong\u003emachine learning\u003c/strong\u003e algorithms to analyze metabolomics data for \u003cstrong\u003eMultiple Sclerosis\u003c/strong\u003e diagnosis patterns. This work, which identified key metabolites for disease prediction, earned several prestigious honors, including being named a \u003cstrong\u003eNational STEM Challenge Champion\u003c/strong\u003e in 2024 and publishing as a first author in the \u003cem\u003eInternational Young Researchers' Conference\u003c/em\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, at Yale, I serve as the \u003cstrong\u003eVice President of Marketing and Outreach\u003c/strong\u003e for \u003cstrong\u003eScholars of Finance\u003c/strong\u003e. In this role, I direct recruitment cycles and manage high-impact speaker events, successfully growing the organization's reach and engagement. My professional development also includes a \u003cstrong\u003eSales \u0026amp; Trading\u003c/strong\u003e internship at \u003cstrong\u003eVirtu Financial\u003c/strong\u003e, where I gained hands-on experience with algorithmic trading and proprietary technology, as well as roles in real estate investment analysis and business development. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my professional and academic pursuits, I am an active member of the \u003cstrong\u003eYale MonstRAASity\u003c/strong\u003e dance team and am involved with the \u003cstrong\u003eVolunteer Income Tax Assistance (VITA)\u003c/strong\u003e program. I am proficient in \u003cstrong\u003eR\u003c/strong\u003e and \u003cstrong\u003ePython\u003c/strong\u003e and am fluent in \u003cstrong\u003eTelugu\u003c/strong\u003e. I am passionate about leveraging my background in data science and my leadership experience to serve as a mentor and role model for students navigating their own academic and professional paths.\u003c/p\u003e","teachingVideoPlaybackId":"zL01VtnGe00qMN1JEcLKF48aFFwgYbk7oBD9vhJMff024A","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn my freshman year of high school, I was trying out everything I could get my hands on. One of those things happened to be poetry - and I ended up submitting a personal piece to a regional contest and won 2nd place. This was so profound to me because it opened me up to the beauty of expressing yourself through the art that is poetry. Come junior year of high school, I decided to rediscover my love for poetry and ended up winning another award! Learning and creating literary art had not been a traditional form of success in my family. Still, it was a way for me to see the world differently, and I loved every moment of this new personal milestone. Although these smaller achievements don't always make it onto my resume, I hold them dear to my heart.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"bab5db48-5ef2-4641-bd7e-adb18941ef93\"}"},{"__ref":"Favorites:{\"uuid\":\"aba43d6d-663f-4f67-9b69-78a95f6ef1f4\"}"},{"__ref":"Favorites:{\"uuid\":\"4302c061-0277-4787-be9a-ed4bafada2f8\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"4cdbba48-4d64-4743-9b32-e2adae87fbc4\"}"},{"__ref":"CausesSupported:{\"uuid\":\"8db64754-7745-4644-95a0-5acd04218bd4\"}"}],"major":"Economics and Statistics \u0026 Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bdae0359-f86b-4e11-99c7-ed4b565437bb\"}"},{"__ref":"DeepDives:{\"uuid\":\"4e030158-8a91-490a-a71b-6d7c3d8be95c\"}"},{"__ref":"DeepDives:{\"uuid\":\"42782445-195f-4bf9-bae5-6cff515250e0\"}"},{"__ref":"DeepDives:{\"uuid\":\"afe485fc-f21d-4b63-b89b-662279cb8b48\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2cdbc82f-7eb3-484a-a886-68fbbd82d6de/-/preview/-/format/jpg/","https://ucarecdn.com/036add81-88fb-4ad7-9ffe-33a4d405e021/-/preview/-/format/jpg/","https://ucarecdn.com/40088287-fcbd-4a1e-8081-7c124e135afc/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fc9e5492-b0b1-48e5-9d1b-259cf66e32b9\"}"},{"__ref":"Education:{\"uuid\":\"547ab24b-358d-4b45-820e-ee05012ada62\"}"}],"hiredAt":"2026-02-18T18:32:20.655Z","topics":["Pre-Algebra","K-5 Grade Math","Writing","Academic Coaching","Executive Function","College Essay Writing","Creative Writing","Business / Entrepreneurship","Finance / Investing","Machine Learning / AI","Robotics / Electronics / CAD","Web Design","Medicine / Health","Sustainability"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ananya-vuppala\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4434cf37-47bb-48d3-9a17-63897f19a986\"}"}}},"_sentryTraceData":"c138c27d1fa9463a945123a22e7379
