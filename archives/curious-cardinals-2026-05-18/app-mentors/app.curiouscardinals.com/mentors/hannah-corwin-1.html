xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1aee417f-6bfe-4908-9174-856a3cecdf1f\"}":{"__typename":"DeepDives","uuid":"1aee417f-6bfe-4908-9174-856a3cecdf1f","content":"\u003cp\u003eIn my spare time I like to explore the DC area near my school! DC has so much to offer in terms of food, museums, sports, and different seasonal activities. It's also a very walkable city (different from LA where I'm from), so it's awesome as a student to wander around and venture into new and cool places. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c7d678ec-adbc-471d-aac0-84591f544022\"}":{"__typename":"DeepDives","uuid":"c7d678ec-adbc-471d-aac0-84591f544022","content":"\u003cp\u003eI've always been interested in global health, and took an intro course through UC Berkeley over the summer in high school. Through this class, I became more familiar with systems within our own health care that are fragmented and outdated. This led me to dive deeper into health systems specific to the US. When I applied to colleges, I looked for public health programs. I found Georgetown's own Health Care Management and Policy major unique in its focus on systems and leadership, which is ultimately what led me to choose it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"806a40a2-0730-4e54-bc29-6b53eb7cb931\"}":{"__typename":"DeepDives","uuid":"806a40a2-0730-4e54-bc29-6b53eb7cb931","content":"\u003cp\u003eI would tell myself to enjoy myself and to try everything!! There are so many amazing opportunities and activities at school or in your community that you will regret not learning more about. Now is the time to really explore and to give \u003cem\u003eeverything\u003c/em\u003e and \u003cem\u003eeveryone\u003c/em\u003e a chance. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"60bbdae7-17a2-49fc-a713-e9ff4c6dd656\"}":{"__typename":"DeepDives","uuid":"60bbdae7-17a2-49fc-a713-e9ff4c6dd656","content":"\u003cp\u003eMentorship is so important because of how it brings together different age groups and people who might not otherwise know each other but have a shared passion or interest. There is nobody better to learn from than someone who has already gone through the experience themselves! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}":{"__typename":"School","uuid":"693ea7b8-def0-456d-88a4-4055bd090a62","name":"Marlborough School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90004"},"Education:{\"uuid\":\"b478f736-0181-4cc7-b3a9-c18967853587\"}":{"__typename":"Education","uuid":"b478f736-0181-4cc7-b3a9-c18967853587","school":{"__ref":"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}"},"startYear":"2016","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"b0b2f6e3-5a59-4bd3-9a79-a7b13523e7e3\"}":{"__typename":"Education","uuid":"b0b2f6e3-5a59-4bd3-9a79-a7b13523e7e3","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Health Care Management and Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"6189881c-ba23-453a-bc5d-7408cd6247c5\"}":{"__typename":"MentorPublicProfile","uuid":"6189881c-ba23-453a-bc5d-7408cd6247c5","displayName":"Hannah C.","slug":"hannah-corwin-1","biography":"\u003cp\u003eHi, I'm Hannah! I am currently a senior at Georgetown in Washington, DC studying Health Care Management and Policy and minoring in Disability Studies. My time at college has been shaped by my passion for public health, mental health advocacy, and the visual arts. I am originally from Los Angeles and went to an all girls school for middle and high school. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was part of my school's choir and was Vice President of our student-led non-profit that raises and grants funds to education programs for women and girls in the Los Angeles area-- so I know what it is like to tackle ambitious goals and balance academics and extracurriculars at a young age!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, you will find me drawing and painting, experimenting with new recipes, spending time with my family and friends, or walking dogs around my neighborhood. I am also a big fan of interior design and love a good creative project. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver the past few years, I have worked on a diverse set of projects such as designing refugee self-sufficiency plans at the International Rescue Committee and securing federal funding for community health centers. I have also served in multiple leadership roles, and I currently am President of Project Lighthouse, where I am working on outreach to expand our student text line to a larger audience on campus. \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHow I can help!!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn high school, I tutored younger students across all subjects. This included both academic subjects and mastery of organizational and study skills. I specifically provide support in \u003cstrong\u003emath\u003c/strong\u003e (pre-algebra, geometry, statistics, algebra I/II), \u003cstrong\u003ereading and writing \u003c/strong\u003e(including college essay writing), \u003cstrong\u003eacademic coaching\u003c/strong\u003e, and organizational and \u003cstrong\u003eexecutive functioning skills\u003c/strong\u003e. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love working creatively and visually, making academic work more engaging and personalized. This includes organized and methodical note taking, study guides, and practice problems. \u003cstrong\u003eFinding a way to break things up in a way that works for you is crucial for your success!\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLearning new and challenging things can be super intimidating but can also be so rewarding! It's important to have someone you feel comfortable with and trust by your side to guide and support you through bumps along the road. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI focus on helping students \u003cstrong\u003edevelop critical thinking\u003c/strong\u003e, \u003cstrong\u003econfidence\u003c/strong\u003e, and \u003cstrong\u003eproject management skills\u003c/strong\u003e so they leave our lessons with both \u003cu\u003estronger ideas\u003c/u\u003e and \u003cu\u003estronger voices\u003c/u\u003e. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can't wait to meet you and help you explore new topics and passions or build important skillsets that will serve you in school and beyond!\u003c/p\u003e","teachingVideoPlaybackId":"yGKCNMDKqPWLPbabOlpr4JRKpF29rDdpSP00rhg817eY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Health Care Management and Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1aee417f-6bfe-4908-9174-856a3cecdf1f\"}"},{"__ref":"DeepDives:{\"uuid\":\"c7d678ec-adbc-471d-aac0-84591f544022\"}"},{"__ref":"DeepDives:{\"uuid\":\"806a40a2-0730-4e54-bc29-6b53eb7cb931\"}"},{"__ref":"DeepDives:{\"uuid\":\"60bbdae7-17a2-49fc-a713-e9ff4c6dd656\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e96487ed-aca1-4045-9cb4-cc57516c7fad/-/preview/-/format/jpg/","https://ucarecdn.com/21dd700d-73df-4850-94d2-30dc1d7692f5/-/preview/-/format/jpg/","https://ucarecdn.com/ae08e614-817c-4d46-b034-816fef8cc722/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b478f736-0181-4cc7-b3a9-c18967853587\"}"},{"__ref":"Education:{\"uuid\":\"b0b2f6e3-5a59-4bd3-9a79-a7b13523e7e3\"}"}],"hiredAt":"2025-09-25T03:37:39.548Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Statistics","6-8 Grade Science","Writing","Executive Function","College Essay Writing","Reading","Academic Coaching"],"communityBadges":["https://ucarecdn.com/4898ea96-6627-4c32-80af-8dd44881bd39/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hannah-corwin-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6189881c-ba23-453a-bc5d-7408cd6247c5\"}"}}},"_sentryTraceData":"51b5879df07944ccbfdc9bf18f829a84-be71ab3a2f81f628-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972
