xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1c262f6f-402c-4883-93c5-ca665980bf84\"}":{"__typename":"DeepDives","uuid":"1c262f6f-402c-4883-93c5-ca665980bf84","content":"\u003cp\u003eMy greatest source of motivation is chasing the feeling of when all my hard-work pays off. In highscool I worked extremely hard to develop enough skill and strength to play at a Division one University, and when I finally committed it was the best feeling in the world. Then when I started my first collegiant game I felt another wave of gratefulness and confidence. Every small win and accomplishment on my road to the final goal feels better than the last. That feeling of joy when all the pain and growth I endured pays off in front of my eyes is unmatched and is my greatest source of motivation when things get hard. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"edcb27dc-5b3c-4863-9ff3-7a9bd92a7b6b\"}":{"__typename":"DeepDives","uuid":"edcb27dc-5b3c-4863-9ff3-7a9bd92a7b6b","content":"\u003cp\u003eMy greatest mentor throughout my life has been my dad. He has always pushed me to be better in every single way I can be and he always reminded me that if I worked hard enough and I loved what I did, I would succeed in life no matter the circumstances. I still live by that everyday and I always remind myself that hard work will always pay off. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"4f228644-9ba9-434b-842a-13644a48efae\"}":{"__typename":"DeepDives","uuid":"4f228644-9ba9-434b-842a-13644a48efae","content":"\u003cp\u003eIn high school and middle school I always hated math and chemistry. They were the subjects I avoided the most and would absolutely fall asleep listening to. In my senior year of high school I fell in love with biology and started shadowing doctors which led me down the path of pre-med. Unfortunately, this path involved a lot of math and chemistry in which I decided I was going learn to love these subjects. Throughout my first two years of college I struggled, but as time went on I learned to view these subjects in alignment with being a doctor and biological principles of life that genuinely interested me. After developing my understanding and switching my perspective, I wanted to share my interests with others that feel the same as I did in high school and middle school. I wish someone showed me how interesting difficult subjects may be when you pair them with subjects that interest you which is why I chose mentorship. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"45857144-0645-4687-9581-a323b3bb1182\"}":{"__typename":"DeepDives","uuid":"45857144-0645-4687-9581-a323b3bb1182","content":"\u003cp\u003eEver since starting college, I've been trying to find a new hobby. In high school, field hockey was my main passion, but now that it's more of a job than a hobby, I've been exploring other interests. So far, I've experimented with creating laser-cut engravings of my friends and family in our engineering lab, 3D modeling random items, learning pottery, reading fiction novels, cooking, and becoming a movie fanatic. I still haven't found a favorite new hobby, but I'm enjoying the process of exploring—and I'm always open to suggestions!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9ecae2fc-0c94-4b7a-8bca-7966d0467c61\"}":{"__typename":"School","uuid":"9ecae2fc-0c94-4b7a-8bca-7966d0467c61","name":"River Hill High School","city":"Columbia","type":"HIGH","state":"Maryland","country":"United States","zip":"21029"},"Education:{\"uuid\":\"db5c835e-91db-442d-a56e-a6987095cc27\"}":{"__typename":"Education","uuid":"db5c835e-91db-442d-a56e-a6987095cc27","school":{"__ref":"School:{\"uuid\":\"9ecae2fc-0c94-4b7a-8bca-7966d0467c61\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"d7447f96-9a10-4284-bab3-f6080cc0780e\"}":{"__typename":"Education","uuid":"d7447f96-9a10-4284-bab3-f6080cc0780e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biology ","degree":null},"MentorPublicProfile:{\"uuid\":\"f7162bc8-aa94-42f3-8b41-08faa06d16e2\"}":{"__typename":"MentorPublicProfile","uuid":"f7162bc8-aa94-42f3-8b41-08faa06d16e2","displayName":"puja n.","slug":"puja-nanjappa-1","biography":"\u003cp\u003eHi! I'm Puja, and I'm a sophomore at Stanford University studying Biology with a concentration in Neuroscience. Outside of the classroom, I'm a member of the Varsity Field hockey team, apart of a volunteering group that creates science labs for terminally ill children, and am conducting research on psychiatric disorders. I’ve always been fascinated by the complexities of the human brain, particularly in the ways that chemical imbalances can contribute to mental disorders.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in an environment where mental health was often dismissed as mere dramatization rather than a serious illness, I became passionate about educating others on the severity of mental health disorders and working to remove the stigma surrounding them. In high school, I volunteered at an ECT (electroconvulsive therapy) center, where I gained firsthand exposure to psychiatric treatments and the profound impact they have on patients. Now in college, I am furthering this passion by conducting research on how different brain waves correlate with psychiatric disorders, with the goal of identifying targeted medications and treatments to improve mental health care.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have recently gotten involved in a program called labsci, in which we create and teach modifications of science labs we did in highschool to children who are admitted in the hospital to make sure they keep up with school while they are unable to attend. I have always loved teaching and mentoring and in highschool I coached 5th graders for my old club team and taught them their first skills of field hockey which brought me a lot of joy. They taught me a lot about how to build confidence in kids who are struggling to learn new concepts and how to turn frustration into enjoyment. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eJust for fun I love to cook and try all kinds of new foods, spend time with friends and family, binge crazy documentaries, and go on hikes. I am looking forward to meeting you and working with your child whether it be helping them grind through math or understand how to connect biology to life and make it way more interesting!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"evMHZZhN1xc3Vz8C02evXytOoGDal9fgg301IXiH83xpk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1c262f6f-402c-4883-93c5-ca665980bf84\"}"},{"__ref":"DeepDives:{\"uuid\":\"edcb27dc-5b3c-4863-9ff3-7a9bd92a7b6b\"}"},{"__ref":"DeepDives:{\"uuid\":\"4f228644-9ba9-434b-842a-13644a48efae\"}"},{"__ref":"DeepDives:{\"uuid\":\"45857144-0645-4687-9581-a323b3bb1182\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5bb52b41-11fb-4bcc-a29d-ec175218023c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"db5c835e-91db-442d-a56e-a6987095cc27\"}"},{"__ref":"Education:{\"uuid\":\"d7447f96-9a10-4284-bab3-f6080cc0780e\"}"}],"hiredAt":"2025-02-26T17:02:16.800Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"puja-nanjappa-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f7162bc8-aa94-42f3-8b41-08faa06d16e2\"}"}}},"_sentryTraceData":"67735889b06f4d2da04c29dcdb64423a-9799a65d8ee8d59c-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=67735889b06f4d2da04c29dcdb64423a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"puja-nanjappa-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"i
