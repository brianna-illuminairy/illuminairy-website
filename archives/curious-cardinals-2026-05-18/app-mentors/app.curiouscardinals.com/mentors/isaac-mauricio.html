Understanding and acknowledging that such issues are systemic is a critical step to making meaningful change in the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1c6deeac-d349-4da0-bc2d-0e540e1879ef\"}":{"__typename":"DeepDives","uuid":"1c6deeac-d349-4da0-bc2d-0e540e1879ef","content":"\u003cp\u003eI have been blessed to receive support from amazing mentors throughout my life, and I believe it is my responsibility to pay these good deeds forward!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"b55ae7f0-db99-41cd-828b-4896767f187d\"}":{"__typename":"DeepDives","uuid":"b55ae7f0-db99-41cd-828b-4896767f187d","content":"\u003cp\u003eI once wanted to own a vet clinic! Though my interests have since shifted, I still know I would not have enjoyed the many tasks of being a business owner...\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"f4d1b3fc-23f3-442c-9875-1d8b6c4826e4\"}":{"__typename":"School","uuid":"f4d1b3fc-23f3-442c-9875-1d8b6c4826e4","name":"Essex North Shore Agricultural \u0026 Technical School","city":"Danvers","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01923"},"Education:{\"uuid\":\"76e4a548-8167-49a4-aed0-cdfeb69004f8\"}":{"__typename":"Education","uuid":"76e4a548-8167-49a4-aed0-cdfeb69004f8","school":{"__ref":"School:{\"uuid\":\"f4d1b3fc-23f3-442c-9875-1d8b6c4826e4\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a2c100d7-f1be-4e40-b66c-c09f31409e79\"}":{"__typename":"Education","uuid":"a2c100d7-f1be-4e40-b66c-c09f31409e79","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Molecular Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"ae7b33fe-66bf-43c1-a488-2b0855fced50\"}":{"__typename":"MentorPublicProfile","uuid":"ae7b33fe-66bf-43c1-a488-2b0855fced50","displayName":"Isaac M.","slug":"isaac-mauricio","biography":"\u003cp\u003eHi! I'm Isaac, a first-year at Yale University studying Neuroscience and passionate about helping students explore science with confidence and curiosity.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI work with students who are interested in biology, neuroscience, and biomedical research but may not yet know \u003cem\u003ewhere to start\u003c/em\u003e, or \u003cem\u003ewhat path is right\u003c/em\u003e for them. My goal is to help students turn broad interests into meaningful projects, strong applications, and long-term direction.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA little about me:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI was born and raised in Brazil, and my academic journey has been anything but linear. I began with an interest in medicine, explored veterinary science through a vocational high school, and ultimately fell in love with research. Along the way, I’ve completed projects in psychiatry, women’s health, and neurodegenerative disorders. These experiences taught me that there’s no single “right” path in STEM—only the one that fits \u003cem\u003eyou\u003c/em\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I help students with:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDesigning and developing \u003cstrong\u003epassion projects\u003c/strong\u003e in biomedical research (independent, wet lab or dry lab)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFinding and applying to \u003cstrong\u003eresearch programs\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAcademic support in \u003cstrong\u003ebiology\u003c/strong\u003e, \u003cstrong\u003ealgebra\u003c/strong\u003e, \u003cstrong\u003ewriting\u003c/strong\u003e, and \u003cstrong\u003ecollege planning\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding essential research skills such as \u003cstrong\u003enetworking etiquette\u003c/strong\u003e, \u003cstrong\u003epublic speaking\u003c/strong\u003e, and \u003cstrong\u003escience communication\u003c/strong\u003e (posters, abstracts, and presentations)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eExperience \u0026amp; background:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eResearch intern at the \u003cstrong\u003eRagon Institute of MGB, MIT, Harvard\u003c/strong\u003e, contributing to an informational database on an under-researched bacterial strain relevant to women’s health\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eResearch intern at the \u003cstrong\u003eBroad Institute of MIT and Harvard\u003c/strong\u003e, studying the effects of a chromosomal mutation linked to schizophrenia\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCertified Veterinary Assistant\u003c/strong\u003e with hands-on clinical experience, including patient documentation, vaccinations, and blood draws\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFormer \u003cstrong\u003eSTEM mentor\u003c/strong\u003e for project-based learning academies, supporting students through tailored work over school breaks\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA typical session may include:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eNarrowing broad interests (like “biology” or “neuroscience”) into \u003cstrong\u003eclear, achievable goals\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating \u003cstrong\u003estep-by-step plans\u003c/strong\u003e for research outreach, applications, or academic improvement\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eReviewing and refining\u003c/strong\u003e research proposals, emails, essays, and long-term plans\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside of school:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen not focused on academics or research, I love watching movies (and logging them on Letterboxd!). Some of my favorites include \u003cem\u003ePrincess Mononoke\u003c/em\u003e, \u003cem\u003eParasite\u003c/em\u003e, and \u003cem\u003eThe Grand Budapest Hotel\u003c/em\u003e. I have also recently picked up pottery! And I love to try new foods and restaurants :)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re motivated, curious, and ready to explore your interests in STEM, I’d love to support you on that journey!\u003c/p\u003e","teachingVideoPlaybackId":"oC023ZFhv7p02OvD34QXtFg201uH011G4voszyo2GWCkDPM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"97597403-64d6-4783-9835-0f0565605bcd\"}"},{"__ref":"Favorites:{\"uuid\":\"60cbb6ad-e653-41ed-bdc4-39da3
