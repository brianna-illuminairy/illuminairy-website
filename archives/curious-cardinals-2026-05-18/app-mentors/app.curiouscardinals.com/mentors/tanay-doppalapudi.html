"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"91fd9da4-a0b4-4e6d-83d4-873db2ec44cf\"}":{"__typename":"DeepDives","uuid":"91fd9da4-a0b4-4e6d-83d4-873db2ec44cf","content":null,"videoPlaybackId":"GZOs02MS5okgKCYSI1vbbPn6dfA1aKwPdv7bzJt8LJp4","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c063ed02-65a2-40c0-a5c9-7396ec3954c6\"}":{"__typename":"DeepDives","uuid":"c063ed02-65a2-40c0-a5c9-7396ec3954c6","content":"\u003cp\u003eI believe that summers should involve a balance between decompressing/fun from a busy school year and exploring your passions.\u003c/p\u003e\u003cp\u003e My summers were filled with travel and new experiences. In my freshman year summer, I started a two-week basketball clinic program to help elementary school kids prepare for middle school basketball. The summer following my sophomore year was busier; after spending a few weeks in India, I wrote my literature review paper on injury prevention, worked as a coach at a local sports camp, and organized the first Steps4SMILEs charity run. My junior year summer was more dedicated towards colleges; I spent a lot of time touring schools, but also took a summer course at Stanford and hosted the 2nd annual Steps4SMILEs race! I also worked weekend shifts at the Running Revolution shoe store starting my sophomore year. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs you can see, the projects/experiences I undertook were all directly connected to my interests and passion, and often took a lot of initiative of my own. While all of this can seem a little overwhelming and you don't necessarily have to do as much as I did, I feel that they have equipped me with the skillset to effectively guide you through exploring your passions. The goal is to emerge from each summer feeling refreshed, accomplished, and more in tune with your personal and professional aspirations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"1d2eb187-2670-4cd8-82a5-41d1e58c3696\"}":{"__typename":"School","uuid":"1d2eb187-2670-4cd8-82a5-41d1e58c3696","name":"Bellarmine College Preparatory","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95126"},"Education:{\"uuid\":\"5117e58e-eb66-4542-ba8f-43fa6652c478\"}":{"__typename":"Education","uuid":"5117e58e-eb66-4542-ba8f-43fa6652c478","school":{"__ref":"School:{\"uuid\":\"1d2eb187-2670-4cd8-82a5-41d1e58c3696\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"da085e8c-5bc1-41fc-b39b-55a8151d9239\"}":{"__typename":"Education","uuid":"da085e8c-5bc1-41fc-b39b-55a8151d9239","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Molecular and Cell Biology \u0026 Business Administration","degree":null},"MentorPublicProfile:{\"uuid\":\"a86b5299-4f6b-4eaa-962f-be676e03e803\"}":{"__typename":"MentorPublicProfile","uuid":"a86b5299-4f6b-4eaa-962f-be676e03e803","displayName":"Tanay D.","slug":"tanay-doppalapudi","biography":"\u003cp\u003eHello! My name is Tanay Doppalapudi, a Molecular and Cell Biology student at UC Berkeley, with a potential additional major in Business. After graduating, I hope to use these degrees to research various biological processes (metabolism, protein synthesis, hormone release) and their applications to maximizing athletic performance.\u003c/p\u003e\u003cp\u003eAs someone who experienced a ton of injuries through high school sports, I learned to gain an appreciation for my body and that’s what led me to choose Biology. I also love learning about the world around me, and I figure that the best way to start is to study what’s within me!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I am chiefly an athlete (in case you can’t already tell :) ), but also a researcher and founder of a non-profit. No matter the time of year, you’ll probably find me at the gym at least four times a week. I’m also an avid runner and hooper – my intramural basketball team at Berkeley boasts a 3-1 record and we're looking to bring home the title! Outside of athletics, I have also authored and published a literature review on injury prevention for intermediate runners. As I develop more as an undergrad, I’m looking forward to getting involved in professional research opportunities. Perhaps my most significant accomplishment, I co-founded an organization, named Steps4SMILEs, to host 5K/10K charity races and raise money for food insecurity. Through months of leadership, planning, networking/marketing, and overcoming hurdles, our annual Steps4SMILEs race has brought about 1000 people together and raised $30,000 for the Second Harvest Food Bank of Silicon Valley.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne of main reasons I chose to become a Curious Cardinal mentor is to share my experiences; I was in your shoes not too long ago. While I’d be happy to help you enjoy and understand the concepts from your classes, it is more important to me that I guide you in exploring your passions. What excites you? My goal is to assist you in the journey of determining how you want to spend your time and energy, so that you can be just as excited as I am when looking to the future.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA little bit more about me: I was born in the greater Boston area, grew up (K-12) in the Bay Area, and just moved to San Diego five months ago; so, I’m familiar with a few different areas, culturally and geographically. Instead of attending my local high school, I opted for a private Jesuit School to pursue my dreams of becoming a professional athlete. High school didn’t unfold quite as I anticipated, but it was transformative in how I learned to engage with the community. \u0026nbsp;I’m looking forward to sharing all my experiences and lessons with you!\u003c/p\u003e","teachingVideoPlaybackId":"EXNy2jNkrw00MVNmGHWJL01wEaxUsWGiZhphp62w5VL18","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7384a618-9c91-4bca-8daa-81acbd83e2e5\"}"},{"__ref":"Favorites:{\"uuid\":\"bc51a6b5-08f7-47af-806c-009721a5efd6\"}"},{"__ref":"Favorites:{\"uuid\":\"88235a29-d78b-44fa-87ec-4afd4fbb477b\"}"}],"causesSupported":[],"major":"Molecular and Cell Biology \u0026 Business Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"01b26981-637b-4f59-8a35-d2bbd51e9350\"}"},{"__ref":"DeepDives:{\"uuid\":\"06da57c4-cf48-4b79-98be-6daeb7416aa3\"}"},{"__ref":"DeepDives:{\"uuid\":\"91fd9da4-a0b4-4e6d-83d4-873db2ec44cf\"}"},{"__ref":"DeepDives:{\"uuid\":\"c063ed02-65a2-40c0-a5c9-7396ec3954c6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a0b3b7b3-4692-49d0-8490-5065a84afb66/-/preview/-/format/jpg/","https://ucarecdn.com/a5e7ca2d-bea7-406b-b080-5bf5893c1e2b/-/preview/-/format/jpg/","https://ucarecdn.com/a4fd7895-853a-497f-9f42-ccb832c48348/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5117e58e-eb66-4542-ba8f-43fa6652c478\"}"},{"__ref":"Education:{\"uuid\":\"da085e8c-5bc1-41fc-b39b-55a8151d9239\"}"}],"hiredAt":"2024-10-10T14:23:57.212Z","topics":["B
