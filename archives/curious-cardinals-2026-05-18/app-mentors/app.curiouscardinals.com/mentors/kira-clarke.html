xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8f705bcb-a422-4c12-b63e-4ff239287adc\"}":{"__typename":"Favorites","uuid":"8f705bcb-a422-4c12-b63e-4ff239287adc","photoUrl":"https://ucarecdn.com/3ff68e10-d389-4e85-8e67-e62d8f314767/","title":"Cinema Paradiso","type":"MOVIE"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"575f118a-e55e-4f24-abd8-999a3e8db2be\"}":{"__typename":"DeepDives","uuid":"575f118a-e55e-4f24-abd8-999a3e8db2be","content":"\u003cp\u003eI spent summers attending ballet intensives and summer courses. I was really in a rush to get to college, so I was getting all my credits to graduate early. If I could go back and do it again, I would try to take advantage of more courses and take my time :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"bbcc2693-d07a-421b-96f3-0d803d2493b7\"}":{"__typename":"DeepDives","uuid":"bbcc2693-d07a-421b-96f3-0d803d2493b7","content":"\u003cp\u003eA great source of motivation for me is happiness. That often means that the motivation is food, but overall, I'm motivated to do things that make me and others happy. I tend to overthink a lot of things — my thoughts, interactions, other people's thoughts — but when I focus on what can generate happiness and what can push me closer to everyday joys, I find a great deal of genuine and sustainable motivation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"183c9948-c298-4126-bbcf-4e6df0da2a57\"}":{"__typename":"School","uuid":"183c9948-c298-4126-bbcf-4e6df0da2a57","name":"St. Mary's","city":"x","type":"HIGH","state":"x","country":"Canada","zip":"x"},"Education:{\"uuid\":\"a773dae1-5954-4699-9028-e10fcf3115cf\"}":{"__typename":"Education","uuid":"a773dae1-5954-4699-9028-e10fcf3115cf","school":{"__ref":"School:{\"uuid\":\"183c9948-c298-4126-bbcf-4e6df0da2a57\"}"},"startYear":"0000","endYear":"0000","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"ea3744f2-eec7-4ba3-8b2d-6070c0756814\"}":{"__typename":"Education","uuid":"ea3744f2-eec7-4ba3-8b2d-6070c0756814","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"0000","endYear":null,"expectedGradYear":"0000","major":"Imagination (Cognitive Science) \u0026 Computer Science + M.A. American Studies","degree":null},"Testimonial:b21bd7fe-b38f-414f-8860-cb0c512f8faf":{"__typename":"Testimonial","id":"b21bd7fe-b38f-414f-8860-cb0c512f8faf","text":"Thank you Kyra for not only supporting and mentoring Sahhra every session but also for the detailed notes that you wrote to me every time you've met her. Your encouraging words and patience had great impacts on Sahhra's focus, interests and study skills. We appreciate you! \nThank you! \nSara","date":"2025-06-04 03:12:51.814+00","rating":5,"endorser":{"__typename":"Endorser","name":"Sara Mazaheri","tagline":"","avatar":null}},"Testimonial:bef32515-8025-42ed-956e-807b8e785756":{"__typename":"Testimonial","id":"bef32515-8025-42ed-956e-807b8e785756","text":"Our mentor has been solid gold for our daughter! This relationship, above most others in her academic world, is both academically and personally enriching, providing an experienced but youthful perspective on things that we, as the adults in her life, perhaps don't understand as well. It's one of the best decisions we've made on our daughters academic journey.","date":"2025-06-02 22:10:31.426+00","rating":5,"endorser":{"__typename":"Endorser","name":"Samantha Grant","tagline":"","avatar":null}},"Testimonial:a7564517-9b11-4090-b738-daeef6413223":{"__typename":"Testimonial","id":"a7564517-9b11-4090-b738-daeef6413223","text":"Kira is absolutely wonderful! I think she and Emma will remain friends long after Emma heads off to college!","date":"2025-06-02 01:06:24.051+00","rating":5,"endorser":{"__typename":"Endorser","name":"Tom Luce","tagline":"","avatar":null}},"Testimonial:bcd501c7-404c-4e12-a9ad-0440c4069dbc":{"__typename":"Testimonial","id":"bcd501c7-404c-4e12-a9ad-0440c4069dbc","text":"Kira has been such an incredible presence in our daughter’s life this entire year. It’s striking how much of a difference having someone like Kira has made in terms of providing support for attention to detail and accountability check-ins alongside sage advice, and a knowledgeable approach that garnered trust and encouraged performance. Kira has been instrumental in helping our daughter live up to her full potential. This relationship has been one of the most important of our daughter’s academic journey so far!!","date":"2025-05-27 01:30:56.6+00","rating":5,"endorser":{"__typename":"Endorser","name":"Samantha Grant","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"bbc04d86-2389-4b76-a1b5-f0383e71a60b\"}":{"__typename":"MentorPublicProfile","uuid":"bbc04d86-2389-4b76-a1b5-f0383e71a60b","displayName":"Kira C.","slug":"kira-clarke","biography":"\u003cp\u003eHello! My name is Kira, and I am a recent graduate of Brown University. I graduated with concurrent degrees — a BSc in \u003cem\u003eComputer Science\u003c/em\u003e and \u003cem\u003eImagination\u003c/em\u003e (a cognitive science independent major) and an MA in \u003cem\u003eAmerican Studies\u003c/em\u003e. I’m currently traveling and working before grad school. I was born in Santa Monica and grew up in Japan and Canada. \u003cbr\u003e\u003cbr\u003eI’m fascinated by the ideas and thoughts that people hold in their minds and how they choose to express them. I became interested in film and television because it’s such an accessible entry into another person’s experience. Whether through Cultural Studies, Cognitive Science (philosophy + psychology + neuroscience), or through technology, I enjoy diving into questions about concepts we take for granted. What\u0026nbsp;is imagination? How does it work? What is beauty? What can ugliness do? They never get boring and don’t have a particular answer, so I get to keep digging. I believe that all kinds of learning can be projects of understanding others and the person one wants to be.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI’m now a Curious Cardinals mentor because I hope to share even a fraction of the understanding I had (and have) the fortune of receiving. My mentors and parents have been very patient with me throughout my life. They knew how to work with me and allowed me to build confidence (although it’s something I am still working on). It took me time to understand some subjects; I like to think that I learn slowly but surely, and I’m really grateful my mentors saw that as a strength early on. I hope to be as empathetic, individual, and patient in my approach when I mentor — something I’ve practiced through TAships, peer mentorship programs, and as a summer counselor. One of my favorite exercises (to teach and to learn from) is dissecting an interesting item in the news and looking at its societal impact from various angles to glean relevant new angles.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eWhen I'm not studying or working, I'm dancing ballet, listening to music, cooking and baking, learning a new piano piece, reading up on fashion history, or talking to loved ones. I also love experiencing movies and shows before I start dissecting them. I’m still pretty proud of the fact that I walked on to the varsity equestrian team at Brown in my junior year of college; I once managed to canter by accident (even though I didn’t know how to do it) during a walk-trot.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8f705bcb-a422-4c12-b63e-4ff239287adc\"}"}],"causesSupported":[],"major":"Imagination (Cognitive Science) \u0026 Computer Science + M.A. American Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"575f118a-e55e-4f24-abd8-999a3e8db2be\"}"},{"__ref":"DeepDives:{\"uuid\":\"bbcc2693-d07a-421b-96f3-0d803d2493b7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e0a144f5-3804-4cb3-bf11-a9a91811fee0/-/preview/-/format/jpg/","https://ucarecdn.com/1fec7933-7e1a-468e-9326-9c79de4d2e0e/-/preview/-/format/jpg/","https://ucarecdn.com/83775ff6-78b8-441f-ad64-595d15a06066/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a773dae1-5954-4699-9028-e10fcf3115cf\"}"},{"__ref":"Education:{\"uuid\":\"ea3744f2-eec7-4ba3-8b2d-6070c0756814\"}"}],"hiredAt":"2023-11-25T14:12:33.695Z","topics":["Algebra I","Algebra II","Geometry","Pre-Algebra","Writing","Japanese","Academic Coaching","Computer Science","Executive Function","Reading","Creative Writing","Fashion / Cosmetics","Film / Theater","Video / Photography","Business / Entrepreneurship","Web Design","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials"
