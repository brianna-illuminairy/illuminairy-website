xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"8ee21438-f0c1-4fa2-a6d8-404e6ebeb940\"}":{"__typename":"School","uuid":"8ee21438-f0c1-4fa2-a6d8-404e6ebeb940","name":"Hillsdale High School","city":"San Mateo","type":"HIGH","state":"California","country":"United States","zip":"94403"},"Education:{\"uuid\":\"f22ff8c2-6d78-4108-9a5d-2e0f054968dd\"}":{"__typename":"Education","uuid":"f22ff8c2-6d78-4108-9a5d-2e0f054968dd","school":{"__ref":"School:{\"uuid\":\"8ee21438-f0c1-4fa2-a6d8-404e6ebeb940\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"74d0fb28-fac3-4cf9-9ed3-95efbc521715\"}":{"__typename":"Education","uuid":"74d0fb28-fac3-4cf9-9ed3-95efbc521715","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Applied Math + Statistics","degree":null},"MentorPublicProfile:{\"uuid\":\"f5077ebf-dfe4-4237-ac15-a947f5fc1edb\"}":{"__typename":"MentorPublicProfile","uuid":"f5077ebf-dfe4-4237-ac15-a947f5fc1edb","displayName":"Arjun M.","slug":"arjun-mathu","biography":"\u003cp\u003eHi, I'm Arjun, and I'm studying Applied Math and Statistics at UC Berkeley with a minor in Computer Science. I’ve always enjoyed the challenge of solving a tricky problem. The satisfaction of a speedy calculation and the sweetness of a clever solution was like candy growing up. But what really pulled me in was when I realized that math isn’t just about right answers. It’s about why those answers work, how the ideas intertwine with each other, and what they reveal about the world around us.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat realization came during my junior year of high school, in a Calculus class. My teacher, Mr. Loskutoff, inspired me. His energy, creativity, and love for teaching completely transformed the way I saw the subject. Detailed proofs that I once skipped over in favor of a quick formula became my obsessions. Energetic conversations about fascinating concepts found their way into lunch table discussion amidst heated fantasy football debates and arguments about the “sandwich-ness” of a hotdog. He didn’t just teach me Calculus. He showed me what great teaching looks like, and I knew I wanted to pass that forward.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe summer after that, I went to India to teach myself. My students were used to memorizing formulas without really understanding them, and I wanted to flip that experience. Instead of just drilling through problems, we talked about the meaning behind the math. \u003cem\u003eWhy\u003c/em\u003e do integrals work? \u003cem\u003eWhat\u003c/em\u003e are infinite series actually doing? Watching my students grow more confident and curious reminded me why I love teaching in the first place.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, I’ve continued building that passion. I’ve worked on projects in data science and deep learning, studied the intersection of math and AI, and spent a lot of time helping friends and peers make sense of difficult topics. I believe learning should be meaningful, not just efficient. When we connect to the \"why\" behind what we're doing, everything becomes more exciting.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a Curious Cardinals mentor, I aim to create that same experience for my students. Whether you're prepping for a math competition, exploring coding for the first time, or trying to build something of your own, I’m here to help you not just understand what you're doing, but genuinely enjoy it. In particular, I love working with curious students who like to ask big questions and think deeply about the world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy goal is simple. I want to help you learn in a way that makes you feel smart, supported, and excited to keep going.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLet's learn something amazing together!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Math + Statistics","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/78c747f8-4453-4e68-af0f-b9561001e2fe/-/preview/-/format/jpg/","https://ucarecdn.com/6a5a108b-8175-4b80-a727-3b58096dc6c0/-/preview/-/format/jpg/","https://ucarecdn.com/164414a6-b8fc-45dc-b66a-7d8574921aa1/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f22ff8c2-6d78-4108-9a5d-2e0f054968dd\"}"},{"__ref":"Education:{\"uuid\":\"74d0fb28-fac3-4cf9-9ed3-95efbc521715\"}"}],"hiredAt":"2025-07-07T12:43:42.042Z","topics":["Algebra I","Algebra II","Calculus","Geometry","Precalculus / Trigonometry","Statistics","Computer Science","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Machine Learning / AI","Robotics / Electronics / CAD","Sports Analytics","Web Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"arjun-mathu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f5077ebf-dfe4-4237-ac15-a947f5fc1edb\"}"}}},"_sentryTraceData":"df98434e661a433da67466a20ee8e9a0-a04e99615fb3689b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=df98434e661a433da6746
