xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"610b104f-8f8f-4b61-80c2-ab47e8058a05\"}":{"__typename":"DeepDives","uuid":"610b104f-8f8f-4b61-80c2-ab47e8058a05","content":"\u003cp\u003eThe most important thing about being a high school student is to not compare yourself to others! High school is about personal growth, and everyone's strengths and passions are different. The more you focus on yourself, the stronger you will be for the future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"d144c127-54e8-45bc-9340-455cae9f75a0\"}":{"__typename":"DeepDives","uuid":"d144c127-54e8-45bc-9340-455cae9f75a0","content":"\u003cp\u003eMy greatest source of motivation is that I want to show \u003cem\u003emyself\u003c/em\u003e how far I can go. In high school and middle school, I was convinced that I didn't have what it would take to be a top student. Math was intimidating, and I didn't have a clear idea of my strengths. Throughout high school and college, I motivated myself by thinking about how I wanted to show my younger self what I am capable of. Now, I study math in college, and do research on topics that my younger self couldn't even dream of! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a1bd83a9-b468-40e7-9c4c-042accbc79d9\"}":{"__typename":"DeepDives","uuid":"a1bd83a9-b468-40e7-9c4c-042accbc79d9","content":"\u003cp\u003eMentorship is important to me because I personally did not have a very good network of people to look up to when I was in middle and high school. After going through those important years and figuring things out along the way, I want others to be better set up to pursue what they love with confidence and assurance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"e9a9134f-acc8-4714-9395-43a2e8650aa0\"}":{"__typename":"School","uuid":"e9a9134f-acc8-4714-9395-43a2e8650aa0","name":"Naperville North High School","city":"Naperville","type":"HIGH","state":"Illinois","country":"United States","zip":"60563"},"Education:{\"uuid\":\"33b52700-7620-4960-a5d7-45d40ac4c90e\"}":{"__typename":"Education","uuid":"33b52700-7620-4960-a5d7-45d40ac4c90e","school":{"__ref":"School:{\"uuid\":\"e9a9134f-acc8-4714-9395-43a2e8650aa0\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"43f902ef-b1a3-4453-8bd5-ec39e2a33559\"}":{"__typename":"Education","uuid":"43f902ef-b1a3-4453-8bd5-ec39e2a33559","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Applied Math, Earth and Planetary Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"c80b3830-6bbe-4dec-9d61-0dcced22c17a\"}":{"__typename":"MentorPublicProfile","uuid":"c80b3830-6bbe-4dec-9d61-0dcced22c17a","displayName":"Ella X.","slug":"ella-xu","biography":"\u003cp\u003e\u003cstrong\u003eElla, Earth and Climate Science\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eHi there! I'm Ella, a senior at Yale double-majoring in Applied Math and Earth Science, and I help high school students turn their curiosity about Earth and Environmental Sciences into actionable goals and projects!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn high school I was a student who loved all things STEM-- biology, chemistry, math-- and I wanted to apply my curiosity into something with BIG impact: climate science. Through years of independent study and discovering my passions, I’ve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eQualified for the US Earth Science Olympiad (USESO) camp and national team\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConducted academic research with professors at UChicago and Yale\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked with climate tech companies to design methods of decreasing the amount of CO2 being released into our atmosphere!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences taught me not only how to think about climate solutions, but also how to share them in ways that open doors to research programs, internships, and college acceptances.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMy specialty\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn the past, I’ve helped students:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBreak into academic research \u003c/strong\u003eat top universities\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eQualify for USESO camp\u003c/strong\u003e and beyond\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLaunch \u003cstrong\u003ecommunity-focused sustainability initiatives\u003c/strong\u003e (recycling programs, school clubs, etc)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCraft unique narratives for students in college applications\u003c/strong\u003e across disciplines\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also help students develop skills that make all the difference in their personal success. I’ve helped past mentees learn how to network with experts and gain more confidence in speaking about their work publicly!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’ve been tutoring high school students ever since I’ve came to college, helping them with everything from crafting study plans to applying for college. Students who I’ve tutored across many years have developed a strong sense of their personal passions, and have used their ambitions to get into universities like\u003cstrong\u003e MIT, Stanford, Northwestern, and more\u003c/strong\u003e!\u003c/p\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTurning your interests into projects or long term study goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMapping out study plans (reading textbooks, practice tests, etc)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReviewing concepts from class or self-study to gain a deeper understanding of what you’re learning\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eOutside of school\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eSome of my hobbies include \u003cstrong\u003ebaking, running, birdwatching, and playing badminton\u003c/strong\u003e! I love collecting hobbies, and want to hear about yours too!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re passionate about anything related to sustainability and Earth sciences, and/or your goal is long term personal development in preparation for college, I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"02MW00y6nOfdJ3746WlXhc76tYdpGUQ02mfn2bN8i97BS00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Math, Earth and Planetary Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"610b104f-8f8f-4b61-80c2-ab47e8058a05\"}"},{"__ref":"DeepDives:{\"uuid\":\"d144c127-54e8-45bc-9340-455cae9f75a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"a1bd83a9-b468-40e7-9c4c-042accbc79d9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5976f7ac-b5b4-4dc2-9d23-530b958ac733/-/preview/-/format/jpg/","https://ucarecdn.com/d9a86c4e-be8c-4a5c-9862-79a30aaf0a1b/-/preview/-/format/jpg/","https://ucarecdn.com/e6cadd37-ee56-4ce7-ba9a-21d7256fb7c8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"33b52700-7620-4960-a5d7-45d40ac4c90e\"}"},{"__ref":"Education:{\"uuid\":\"43f902ef-b1a3-4453-8bd5-ec39e2a33559\"}"}],"hiredAt":"2026-01-28T18:24:43.832Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Biology","Chemistry","Physics","Academic Coaching","College Essay Writing","Executive Function","STEM Project"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ella-xu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c80b3830-6bbe-4dec-9d61-0dcced22c17a\"}"}}},"_sentryTraceData":"9f38acef0f324f959dd21a4e697c9dd7-8b5fcd90d34369db-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5
