xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7ece9f90-3b73-4441-828b-0ac5124489b9\"}":{"__typename":"Favorites","uuid":"7ece9f90-3b73-4441-828b-0ac5124489b9","photoUrl":"https://ucarecdn.com/96c3ca5e-6037-442d-a3ef-c27368c5ef76/","title":"Hadestown","type":"PLAY"},"Favorites:{\"uuid\":\"40c99f0e-9c0d-4738-aefc-e5c4145ea042\"}":{"__typename":"Favorites","uuid":"40c99f0e-9c0d-4738-aefc-e5c4145ea042","photoUrl":"https://ucarecdn.com/da4f452d-8255-4a60-86de-760a35a428b3/","title":"Formula 1 ","type":"SPORT"},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"2b8cb541-8ce4-4ebb-a22a-28637a3a4deb\"}":{"__typename":"DeepDives","uuid":"2b8cb541-8ce4-4ebb-a22a-28637a3a4deb","content":"\u003cp\u003eHere's one out of my dream journal (yes, I write down the dreams that I remember).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI dreamt that I went to IHOP at midnight with old friends I made through theatre, and the pancakes we ordered were \u003cem\u003ereally good\u003c/em\u003e. So good that we order another round of pancakes for takeaway. We also got mini syrups packages and butter to take on the go. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWe're driving down the freeway and stop by a Trader Joe's, but there's a baby elephant loose in the store. No matter to us, we buy scrapbooking materials and leave. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd that was it! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ca6e24e2-9bd9-48c4-bad1-b0e7c62f97ab\"}":{"__typename":"DeepDives","uuid":"ca6e24e2-9bd9-48c4-bad1-b0e7c62f97ab","content":"\u003cp\u003eI hope to reach a moment where I am able to comfortably introduce new experiences for my family. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy parents and grandparents have spent decades working in kitchens and construction sites, and I recognize that their hard work meant I could do something different than they did. I'd like to try repaying them in experiences that they weren't able to have or wouldn't ever dream they could have. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want to ask them if there was anything they wanted to do when they were younger, and help them reach that goal. I'd also love to take them traveling more frequently, both domestically and abroad. I'm excited to progress in my career and hopefully accomplish this goal! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"8767dbbf-565d-4a51-bb01-701c7685beb0\"}":{"__typename":"DeepDives","uuid":"8767dbbf-565d-4a51-bb01-701c7685beb0","content":"\u003cp\u003eI'm a \u003cem\u003ehuge\u003c/em\u003e believer in paying it forward. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a first-generation student, I struggled to feel confident in my decision to pursue a nontraditional career path (aka anything that wasn't medical school to my family). I didn't even \u003cem\u003eknow\u003c/em\u003e mentorship existed as a concept until I was in undergrad! Still, I realized that I'd received invaluable support from mentor figures throughout high school and college, which ultimately shaped my academic and career pathways and opened up opportunities for me. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want to be a mentor because I know firsthand the impact that guidance can bring for children and young adults (like yourself or your children) who have ambitions that are bigger than they know what to do with. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also want to help students achieve things I didn't even know were possible as a K-12 student. Ultimately, my goal is to help current students be more successful than I was.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI hope that the knowledge that I've learned through my experiences and through what my mentors have taught me, will soon help you achieve your own goals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"64dcb027-ecbe-4be8-9135-6ccac7aa2e19\"}":{"__typename":"School","uuid":"64dcb027-ecbe-4be8-9135-6ccac7aa2e19","name":"Centennial High School","city":"Corona","type":"HIGH","state":"California","country":"United States","zip":"92881"},"Education:{\"uuid\":\"9b99d0c0-6090-4866-8541-b340138c09fb\"}":{"__typename":"Education","uuid":"9b99d0c0-6090-4866-8541-b340138c09fb","school":{"__ref":"School:{\"uuid\":\"64dcb027-ecbe-4be8-9135-6ccac7aa2e19\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"42b19aeb-ad33-45fa-a162-db4fd978d7db\"}":{"__typename":"School","uuid":"42b19aeb-ad33-45fa-a162-db4fd978d7db","name":"The George Washington University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20052"},"Education:{\"uuid\":\"3c72db17-81bf-476d-98a8-b34489f7e4c2\"}":{"__typename":"Education","uuid":"3c72db17-81bf-476d-98a8-b34489f7e4c2","school":{"__ref":"School:{\"uuid\":\"42b19aeb-ad33-45fa-a162-db4fd978d7db\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2022","major":"International Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"8af790c7-3f74-403f-956e-107f29567b17\"}":{"__typename":"MentorPublicProfile","uuid":"8af790c7-3f74-403f-956e-107f29567b17","displayName":"Vivian K.","slug":"vivian-kong","biography":"\u003cp\u003eHi, I’m Vivian! I recently graduated from University College London with my Master’s degree in Global Migration. Prior to moving to London, I studied International Affairs at the George Washington University with a Concentration in International Environmental Studies and a Minor in Spanish \u0026amp; Latin American Languages, Literatures \u0026amp; Cultures. I’m dedicated to helping students explore different academic and professional interests by incorporating them into a cohesive personal narrative.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a high school student, I knew I had an interest in domestic and international politics, but I wasn’t sure how I could best explore that interest when I started college or working. My academic and professional journeys became clearer once I sought out different opportunities during college and didn’t restrict myself to one path.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eSince then, I’ve:\u003c/u\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eSupported a legal organization in Mexico in submitting reports to UN Special Procedures and Working Groups to initiate reporting on human rights violations in high-profile feminicide cases.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked as the Director of Partnerships for a London tech startup focusing on international customer demographic research, marketing campaigns, and social media collabs.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eIn high school, I:\u003c/u\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWon the Mojave Environmental Educational Consortium award at the Riverside County science fair for researching bioplastic over a 2-year period.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIntroduced monthly volunteer events and promoted graduation with honors as International Thespian Society chapter President, resulting in a publication in \u003cem\u003eThe Press Enterprise\u003c/em\u003e.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eVolunteered 500+ hours with local health clinics, churches, libraries, and political campaigns.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eAt GWU, I:\u003c/u\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePublished an article I wrote as a fellow on cultural censorship in South Korea in the Undergraduate Review.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEdited and prepared a manuscript for an award-winning book on Mexican Indigenous and regional dance styles in celebrations, festivals, and films as a research assistant.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWon numerous awards as both attorney and witness with Mock Trial, where I also captained teams and served on the Executive Board.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve been teaching and mentoring students since 2021. I worked as a Writing Consultant at the George Washington Writing Center after successfully passing a 6-month pedagogy course and practicum, which taught me how to personalize my teaching techniques to each student. I’ve also volunteered with D.C. public schools and the Latin American Youth Center to help migrant youth with assignments and college applications in both English and Spanish. Additionally, I’ve mentored first-generation students throughout high school and into their first year at college.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI work best with students who have established interests and want to strengthen their foundation, but if you feel like you’ve lost your North Star, I can help you look for that too!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eHere are some, but not all, of the areas I can help you with:\u003c/u\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePersonal statements \u003c/strong\u003efor college (or other) applications\u0026nbsp; \u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects, \u003c/strong\u003edepending on your vision and interests\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch guidance, \u003c/strong\u003eall the way from brainstorming up to publishing an article\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePortfolio building \u003c/strong\u003eon a creative website or more traditional means\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWriting and editing skills-building \u003c/strong\u003efor any assignment (I’m a harsh critic!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSubject guidance \u003c/strong\u003ein the humanities and social sciences\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCareer guidance,\u003c/strong\u003e including internship applications, fellowships, and networking 101\u0026nbsp; \u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also love supporting students with broader skills like effective studying, organization, and time management strategies. In the past, I’ve specialized in teaching students of all ages (including adults!) who use English as a Second Language and Deaf or Hard of Hearing students as well. I’ve also coached students to become more confident in public speaking, work through imposter syndrome when networking, and balance their academic and extracurricular time commitments while \u003cem\u003ealso\u003c/em\u003e getting 8 hours of sleep every night.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cu\u003eA typical session with me might involve:\u003c/u\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eLearning how to turn a general interest into an actionable project\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTalking through qualitative research methods and analysis for topics you’re interested in\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing mock interviews and presentations so you feel confident and prepared\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eChecking in on realistic milestones for a passion project we designed together\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePersonal Research Interests\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have varied research interests that I’ve explored through schooling and work. If you share some of these interests or are curious to learn more, please reach out!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eMultilateral political and business interests between East Asia, Latin America, and the USA\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMultijurisdictional cases in domestic and/or international law, specifically within environmental and migration law\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFood geographies, or “gastropolitics” across international borders\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCultural and political critiques in literature or cinema\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePeacebuilding and democracy movements led by grassroots activists\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFeminist political ecology\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWhere and how diaspora participate in a wider geopolitical worldmaking beyond the state\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNegotiating belonging, exclusion, and inequality in urban environments\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGender relations in human rights violations, displacement, and militarization\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSide Quests\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOutside of work and school, I love the arts, food, music, and nature. I’m a fan of different music genres. You can catch me listening to Bad Bunny in the morning, Olivia Rodrigo during lunch, and Bruce Springsteen in the evening. I try to see as much live music and theatre as I can. I've seen Mitski and Laufey live, and I’ve seen close to 10 plays and musicals on the West End so far!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m a firm believer that you don’t have to do just one thing. My friends call me a “serial hobbyist” because I tend to try my hand at anything I’m interested in.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI run a book club, am a member of a local ceramics studio, bake specialty cakes with fun flavors, design wedding stationery suites, and cook as a private chef. At the moment, I’m also launching a multimedia design boutique and developing a Substack!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"Hawjss00N8zP6z6p6p4ZFSubTSAAoP53wqfTNSXbjOfY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7ece9f90-3b73-4441-828b-0ac5124489b9\"}"},{"__ref":"Favorites:{\"uuid\":\"40c99f0e-9c0d-4738-aefc-e5c4145ea042\"}"}],"causesSupported":[],"major":"International Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2b8cb541-8ce4-4ebb-a22a-28637a3a4deb\"}"},{"__ref":"DeepDives:{\"uuid\":\"ca6e24e2-9bd9-48c4-bad1-b0e7c62f97ab\"}"},{"__ref":"DeepDives:{\"uuid\":\"8767dbbf-565d-4a51-bb01-701c7685beb0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ed11e70c-39ef-4044-b3b6-0a53b98f8fe1/-/preview/-/format/jpg/","https://ucarecdn.com/9bd6b5c5-91f4-447a-9ccd-05ad47b7c4a6/-/preview/-/format/jpg/","https://ucarecdn.com/a2bc2010-c2ff-4bb3-b5e1-c6246939eb5d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9b99d0c0-6090-4866-8541-b340138c09fb\"}"},{"__ref":"Education:{\"uuid\":\"3c72db17-81bf-476d-98a8-b34489f7e4c2\"}"}],"hiredAt":"2026-01-06T04:00:04.622Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","Visual Arts / Graphic Design","Film / Theater","Sports Journalism","History Project","Fashion / Cosmetics","Business / Entrepreneurship","Law / Government / Policy","Sustainability","Journalism","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"vivian-kong\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8af79
