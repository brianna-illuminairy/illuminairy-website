xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"8a7c1e35-b7df-459e-8c76-d6a7b7254e91\"}":{"__typename":"DeepDives","uuid":"8a7c1e35-b7df-459e-8c76-d6a7b7254e91","content":"\u003cp\u003eI hope to become a labor law attorney in the future. I’ll be starting my post-grad career in legal compliance, which I see as the perfect foundation for developing the skills I’ll bring to law school in a few years. My goal is to eventually go into practice and work directly on issues I care about. It’s definitely a big dream, but it’s one I’m genuinely excited about, and I’m confident in the path I’m building toward it!!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"efc7b8bf-86dc-4df0-b4c1-f737065c4deb\"}":{"__typename":"DeepDives","uuid":"efc7b8bf-86dc-4df0-b4c1-f737065c4deb","content":"\u003cp\u003eIn middle school and high school, I was definitely the student who took my goals seriously. I cared a lot about doing well, not because anyone told me to, but because I genuinely loved learning and wanted to make my future self proud. I was organized, motivated, and always the person who color-coded their planner and started assignments early. Looking back, that discipline helped shape the work ethic I have now. I’ve always been someone who puts my grades and long-term goals first!!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0fbde2cf-e65d-4dec-b43b-721d28ee23f4\"}":{"__typename":"DeepDives","uuid":"0fbde2cf-e65d-4dec-b43b-721d28ee23f4","content":"\u003cp\u003eI know Industrial and Labor Relations isn’t a major most people have heard of ... and honestly, that’s part of what drew me to it. When I was researching Cornell, I came across ILR for the first time and immediately felt curious. As I learned more, I realized how perfectly it aligned with my broader interests in policy, law, and business.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eYes, we study workplaces, labor laws, and labor relations, but the major is so much more flexible and interdisciplinary than people expect. It gives you the foundation to explore anything from business strategy to public policy to ethics and organizational behavior. I chose ILR because it opened doors to every area I was already passionate about, while still giving me the freedom to discover new ones.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"de45cd94-478c-440c-8159-6bb79708b304\"}":{"__typename":"DeepDives","uuid":"de45cd94-478c-440c-8159-6bb79708b304","content":"\u003cp\u003eGrowing up, I had a mentor who completely changed the trajectory of my confidence. She pushed me to speak up, own my passions, and not shrink myself. That kind of support lit a spark in me...a spark that hasn’t gone out. Today, I mentor because I want to be that person for someone else. I want to help students feel bold, capable, and excited about their ideas, and show them that their dreams are worth pursuing, whether they’re huge or just starting to take shape.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"3aa56f3c-1009-4591-8665-4937f95d479a\"}":{"__typename":"School","uuid":"3aa56f3c-1009-4591-8665-4937f95d479a","name":"Queens High School for the Sciences","city":"Queens","type":"HIGH","state":"New York","country":"United States","zip":"11451"},"Education:{\"uuid\":\"415e4c38-b63d-4575-a355-14e199af22a7\"}":{"__typename":"Education","uuid":"415e4c38-b63d-4575-a355-14e199af22a7","school":{"__ref":"School:{\"uuid\":\"3aa56f3c-1009-4591-8665-4937f95d479a\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"d3235639-b837-481e-b7ff-d6c06491636b\"}":{"__typename":"Education","uuid":"d3235639-b837-481e-b7ff-d6c06491636b","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Industrial and Labor Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"d04f19a9-5d99-4ff5-b9da-029b626a5fbe\"}":{"__typename":"MentorPublicProfile","uuid":"d04f19a9-5d99-4ff5-b9da-029b626a5fbe","displayName":"Catherine  L.","slug":"catherine-lee","biography":"\u003cp\u003e\u003cstrong\u003eCatherine, Business \u0026amp; Social Impact (Passion Project)\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eHi! I’m Catherine, a senior at Cornell University’s School of Industrial and Labor Relations, and I love helping students explore projects at the intersection of \u003cstrong\u003ebusiness, ethics, social impact, and public policy\u003c/strong\u003e!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eA few years ago, I was a student who knew I cared deeply about people, fairness, and how organizations work, but I didn’t yet know how to turn those interests into real projects or professional experiences. Since then, I’ve had the chance to explore that curiosity through a wide range of roles. I’ve:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWorked at the \u003cstrong\u003eNYC Mayor’s Office of Management and Budget\u003c/strong\u003e on compliance and monitoring, helping city agencies correctly implement federal labor standards\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInterned at a \u003cstrong\u003ereal estate law firm\u003c/strong\u003e, where I handled transaction documents and learned the importance of accuracy and trust\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCurrently conducting \u003cstrong\u003ehonors thesis research\u003c/strong\u003e on how U.S. prisons, while deeply rooted in racialized control, have also become sites of intellectual and cultural resistance for incarcerated Afro-Latinx individuals\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAnd soon, I’ll be joining \u003cstrong\u003eGoldman Sachs\u003c/strong\u003e as a Compliance Analyst supporting the Policy Governance team\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences taught me how to break down complex ideas, communicate clearly, and guide students through meaningful, well-structured projects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eI mentor students who want to explore:\u003c/em\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBusiness or policy-related passion projects\u003c/strong\u003e (social impact, workplace ethics, organizational behavior, compliance, or community-based research)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHuman-centered or ethics-focused projects\u003c/strong\u003e, like designing initiatives that help small businesses, workers, or local communities\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch projects\u003c/strong\u003e involving social issues, inequality, or public policy\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cem\u003eI also love helping students:\u003c/em\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTurn a broad interest (“I like business” or “I care about fairness”) into a \u003cstrong\u003edefined project\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCreate \u003cstrong\u003eorganized plans\u003c/strong\u003e with milestones\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStrengthen\u003c/strong\u003e their writing, presentations, and communication skills\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’ve been a peer mentor in both high school and college, guiding a lot of students through research ideas and presentations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eMapping out a plan you can realistically complete\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePracticing how to share your project in a way that feels confident and natural\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eOutside of school\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOutside of Cornell, I love \u003cstrong\u003etrying new restaurants, baking cookies, biking, puzzles, and taking nature walks\u003c/strong\u003e around Ithaca and my hometown. I’m also a passionate lover of \u003cstrong\u003ecoffee, matcha, and bubble tea\u003c/strong\u003e ... my friends trust my drink recommendations more than Yelp.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re excited to explore a passion project, build confidence, and learn something new, I’d love to help you make it happen!\u003c/p\u003e","teachingVideoPlaybackId":"p02Xe00ZPDHsJ6EeOQvx9bHDVWVZqmmDa02hElKW9JgLl00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Industrial and Labor Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8a7c1e35-b7df-459e-8c76-d6a7b7254e91\"}"},{"__ref":"DeepDives:{\"uuid\":\"efc7b8bf-86dc-4df0-b4c1-f737065c4deb\"}"},{"__ref":"DeepDives:{\"uuid\":\"0fbde2cf-e65d-4dec-b43b-721d28ee23f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"de45cd94-478c-440c-8159-6bb79708b304\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2112dddb-bdb3-47bc-bbfa-af576fb0c564/-/preview/-/format/jpg/","https://ucarecdn.com/3d573fa5-4d7b-4b43-a963-8e9aa5531b03/-/preview/-/format/jpg/","https://ucarecdn.com/f885280e-e1bb-4ddf-bba7-9271c8b3445b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"415e4c38-b63d-4575-a355-14e199af22a7\"}"},{"__ref":"Education:{\"uuid\":\"d3235639-b837-481e-b7ff-d6c06491636b\"}"}],"hiredAt":"2025-
