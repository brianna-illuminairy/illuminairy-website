xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d3dc9d48-b57b-435e-b593-e984e35210f4\"}":{"__typename":"Favorites","uuid":"d3dc9d48-b57b-435e-b593-e984e35210f4","photoUrl":"https://ucarecdn.com/f2c11eb8-0af0-4252-9bb2-8e62683d0f8d/","title":"Interstellar","type":"MOVIE"},"Favorites:{\"uuid\":\"eea67515-d77f-4696-94b1-98f687a1fe71\"}":{"__typename":"Favorites","uuid":"eea67515-d77f-4696-94b1-98f687a1fe71","photoUrl":"https://ucarecdn.com/f2c11eb8-0af0-4252-9bb2-8e62683d0f8d/","title":"Queen","type":"ARTIST"},"Favorites:{\"uuid\":\"c82d7cb3-0e1e-4f70-96da-062ac6662725\"}":{"__typename":"Favorites","uuid":"c82d7cb3-0e1e-4f70-96da-062ac6662725","photoUrl":"https://ucarecdn.com/f2c11eb8-0af0-4252-9bb2-8e62683d0f8d/","title":"Giovanni's Room","type":"BOOK"},"CausesSupported:{\"uuid\":\"3808fdd1-c0cb-4eb4-bbd8-12e4bca69100\"}":{"__typename":"CausesSupported","uuid":"3808fdd1-c0cb-4eb4-bbd8-12e4bca69100","name":"HIV/AIDS Caregiving","description":"\u003cp\u003eI co-founded a student organization to train HIV/AIDS hospice caregivers.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9b2030ac-fbc0-4460-82b6-86f1111b51b1\"}":{"__typename":"DeepDives","uuid":"9b2030ac-fbc0-4460-82b6-86f1111b51b1","content":"\u003cp\u003eTo me, mentorship is\u0026nbsp;\u003cstrong\u003eaccompaniment.\u0026nbsp;\u003c/strong\u003eFinding your passion and pursuing it is not an easy task. It requires stepping out of your comfort zone, doing things you have never done before, and figuring out what you do\u0026nbsp;\u003cstrong\u003enot\u003c/strong\u003e\u0026nbsp;enjoy. Oftentimes, you have to make your own path for your future. This entire process can be overwhelming and lonely. I want to provide both intellectual and emotional support as students navigate their journey so they can find their passion, pursue it, and have fun in the process.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"04f7eba1-c3ac-4b27-a9fa-9b58ff817272\"}":{"__typename":"DeepDives","uuid":"04f7eba1-c3ac-4b27-a9fa-9b58ff817272","content":"\u003cp\u003eDuring my spare time, I love running, reading, and cooking while listening to Queen. I am also a fan of watching Netflix shows and movies that changes how you see the world and discussing these shows with my friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4c407de3-7e44-4b10-914c-41b5e2098b64\"}":{"__typename":"DeepDives","uuid":"4c407de3-7e44-4b10-914c-41b5e2098b64","content":"\u003cp\u003eI want to be a physician-anthropologist who specializes in providing medical care, particularly for communities who are suffering from preventable and treatable infectious diseases. I believe social theory from medical anthropology can help physicians materialize the social and structural forms of care that many patients need to truly to heal. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"4b8b3ed5-038c-49df-8ac5-be3cba0557b9\"}":{"__typename":"School","uuid":"4b8b3ed5-038c-49df-8ac5-be3cba0557b9","name":"School for the Talented and Gifted","city":"Dallas","type":"HIGH","state":"Texas","country":"United States","zip":"75203"},"Education:{\"uuid\":\"f7d4022a-5017-448f-aa64-a3b4fb67a2b7\"}":{"__typename":"Education","uuid":"f7d4022a-5017-448f-aa64-a3b4fb67a2b7","school":{"__ref":"School:{\"uuid\":\"4b8b3ed5-038c-49df-8ac5-be3cba0557b9\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}":{"__typename":"School","uuid":"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41","name":"Rice University","city":"Houston","type":"COLLEGE","state":"Texas","country":"United States","zip":"77005"},"Education:{\"uuid\":\"044215dd-7867-4aec-b65d-002f114e468e\"}":{"__typename":"Education","uuid":"044215dd-7867-4aec-b65d-002f114e468e","school":{"__ref":"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Socioculutral Anthropology","degree":null},"MentorPublicProfile:{\"uuid\":\"2a7da53a-18ab-4660-8fdd-7844c0a059c1\"}":{"__typename":"MentorPublicProfile","uuid":"2a7da53a-18ab-4660-8fdd-7844c0a059c1","displayName":"Sumin Y.","slug":"sumin-yoon","biography":"\u003cp\u003eSumin is a senior at Rice University majoring in Sociocultural Anthropology and minoring in Biochemistry and Cell Biology on the premedical track. He is passionate about global health equity, medical anthropology, and gardening (particularly growing lettuce). At Rice, he is curious about the intersection between health and politics. He completed his senior thesis examining the evolution of HIV/AIDS care services in Houston and currently leads undergraduates as HIV/AIDS hospice caregivers. He pursued his interests internationally as he worked with NGOs in Uganda to research Tuberculosis care infrastructure to increase care access in rural communities. He is also a science nerd who has experience working in a stem cell lab researching gastrulation. In his free time, you can find Sumin training for the next 10K, reading, learning how to cook Korean food, and watching A24 films with his friends.\u003c/p\u003e","teachingVideoPlaybackId":"km6H7dkrfPFgHdB55X8LWijHXAL4MJqZJXQGHTkVCFM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI completed my honors thesis in medical anthropology researching the evolution of the HIV/AIDS epidemic in interrogating the existence of an AIDS-specific hospice in 2023. I was awarded the  Best Undergraduate Thesis by the Rice Anthropology Department and the W.H.R Rivers Prize by the Society for Medical Anthropology. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d3dc9d48-b57b-435e-b593-e984e35210f4\"}"},{"__ref":"Favorites:{\"uuid\":\"eea67515-d77f-4696-94b1-98f687a1fe71\"}"},{"__ref":"Favorites:{\"uuid\":\"c82d7cb3-0e1e-4f70-96da-062ac6662725\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"3808fdd1-c0cb-4eb4-bbd8-12e4bca69100\"}"}],"major":"Socioculutral Anthropology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9b2030ac-fbc0-4460-82b6-86f1111b51b1\"}"},{"__ref":"DeepDives:{\"uuid\":\"04f7eba1-c3ac-4b27-a9fa-9b58ff817272\"}"},{"__ref":"DeepDives:{\"uuid\":\"4c407de3-7e44-4b10-914c-41b5e2098b64\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5af0e0d6-322c-473f-ae5e-e0bb96c30244/-/preview/-/format/jpg/","https://ucarecdn.com/0de04c1e-0fe6-45b4-a2a1-d9cd7c06f9c3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f7d4022a-5017-448f-aa64-a3b4fb67a2b7\"}"},{"__ref":"Education:{\"uuid\":\"044215dd-7867-4aec-b65d-002f114e468e\"}"}],"hiredAt":"2023-11-15T22:56:46.121Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Global Health","World Cultures","Race \u0026 Ethnicity","Writing","Biology","Chemistry","Academic Coaching","College Essay Writing"],"communityBadges":[],"restrictedPr
