xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"54701ae9-2e1a-44b4-8af2-d9a5aedc88bf\"}":{"__typename":"DeepDives","uuid":"54701ae9-2e1a-44b4-8af2-d9a5aedc88bf","content":"\u003cp\u003eBe creative and solve problems in a different way than everyone else. This goes for math problems, but it also applies to ideas for inventions and dreams for your career.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"288bd46a-f2c2-4c13-ac05-6c27545f7339\"}":{"__typename":"DeepDives","uuid":"288bd46a-f2c2-4c13-ac05-6c27545f7339","content":"\u003cp\u003eMentorship matters to me because I had teachers and older students who actually showed up for me. They gave me hard tasks, pushed me in good ways, and made being a woman in engineering feel possible instead of scary. Without the mentors who helped me explore career paths, build projects, or just survive confusing lectures, I honestly would not be where I am now.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat is why I care about helping younger students. I want to be the person who makes things feel a little less overwhelming and a lot more doable. I like helping students figure out what they’re interested in, especially when it comes to college paths, STEM topics, and hands‑on projects. My goal is to make learning feel personal and fun, not like a checklist. I want students to feel supported, curious, and confident as they grow into whatever they want to become\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"acb8422c-1120-41f2-835c-5f21691bb2a1\"}":{"__typename":"DeepDives","uuid":"acb8422c-1120-41f2-835c-5f21691bb2a1","content":"\u003cp\u003eI want to have a direct impact on other people. I hope there is at least one person who remembers me for the way I helped move their life in a positive direction, whether through guidance or through medical innovation. I have a drive to put in the time and effort and stay dedicated to medicine, and I hope that it can pay off so others can actually experience and see the results without high costs or limited accessibility.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"68cfdab5-c46c-4f7f-a8c6-aa38296056bd\"}":{"__typename":"DeepDives","uuid":"68cfdab5-c46c-4f7f-a8c6-aa38296056bd","content":"\u003cp\u003eI chose my major because in high school I loved robotics and I loved drawing and designing things. I still love those things, but I also shifted toward wanting my work to shape medical procedures and help real patients. I am really interested in clinical trials that use machine learning in medical settings to improve access to care.\u003c/p\u003e\u003cp\u003eBiomedical engineering felt right for me because it gives me every tool and discipline I could need to help a person. I get the widest range of knowledge possible, which lets me find user centered problems and actually solve them\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"bea3f6c5-c4d1-4079-ab2e-2f08311a231f\"}":{"__typename":"School","uuid":"bea3f6c5-c4d1-4079-ab2e-2f08311a231f","name":"Arnold High School","city":"Panama City Beach","type":"HIGH","state":"Florida","country":"United States","zip":"32407"},"Education:{\"uuid\":\"897c09ae-ee37-471b-a29a-c34ff33dc939\"}":{"__typename":"Education","uuid":"897c09ae-ee37-471b-a29a-c34ff33dc939","school":{"__ref":"School:{\"uuid\":\"bea3f6c5-c4d1-4079-ab2e-2f08311a231f\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"0130cf7d-222b-433d-bb6a-98bff7c50a05\"}":{"__typename":"Education","uuid":"0130cf7d-222b-433d-bb6a-98bff7c50a05","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"bb35b7e8-8096-4d9e-971e-3cf11dbad566\"}":{"__typename":"MentorPublicProfile","uuid":"bb35b7e8-8096-4d9e-971e-3cf11dbad566","displayName":"Ashley S.","slug":"ashley-steen","biography":"\u003cp\u003eI grew up in Panama City Beach, Florida, where the ocean and the outdoors shaped a lot of how I see the world. I always liked understanding how things work and how people work, and that combination eventually pulled me toward biomedical engineering. I live in Atlanta now and study Biomedical Engineering at Georgia Tech, which is known for being the biggest and best technology school in the South. I am on the pre‑med track because I hope to become either an interventional radiologist or a cardiothoracic surgeon. I also have a minor in the applications of artificial intelligence because I enjoy seeing how engineering and computing can support medicine.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I care about most is building things that actually help people. I like user centered design and the idea that a device should make sense to the person who needs it. In biomedical engineering, I get to work with every part of the design process. I build circuits, draw parts in computer aided modeling programs, write code for robotic components, and run the math that helps us test whether an idea will fail or succeed. I also enjoy presenting my work and explaining why a device or research project matters and how it could improve someone’s life in a cost effective way.\u003c/p\u003e\u003cp\u003eAcademically and professionally, I spend my time working on projects that connect engineering with real human problems. I have interned for the Department of Defense twice and for a biotech startup once. I have worked on hydrogels for burn wounds, machine learning programs for underwater vehicles, and organ on a chip research for cancer studies. I have also helped with bone marrow products that were sent to a leukemia patient, which showed me how engineering and medicine can come together in a very direct way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Georgia Tech, my projects have included concussion research, blood glucose monitoring devices for gestational diabetes, surgical alignment tools, and machine learning systems that map hand motions to prosthetic signals. I enjoy having a wide range of experiences because biomedical engineers use every tool available to solve human centered problems, and that is exactly the kind of work I want to keep doing.\u003c/p\u003e","teachingVideoPlaybackId":"02OIpzJpvuX00Wa9tE02600RbYVWh01c2tqF00T5KvD00Nw02DI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"54701ae9-2e1a-44b4-8af2-d9a5aedc88bf\"}"},{"__ref":"DeepDives:{\"uuid\":\"288bd46a-f2c2-4c13-ac05-6c27545f7339\"}"},{"__ref":"DeepDives:{\"uuid\":\"acb8422c-1120-41f2-835c-5f21691bb2a1\"}"},{"__ref":"DeepDives:{\"uuid\":\"68cfdab5-c46c-4f7f-a8c6-aa38296056bd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4c7f3038-2271-453c-af13-f317c11ac940/-/preview/-/format/jpg/","https://ucarecdn.com/de84947e-3e9f-4d5e-9cbf-41535a15d103/-/preview/-/format/jpg/","https://ucarecdn.com/980ceb82-48dd-4b8f-8b76-d93f0a04f674/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"897c09ae-ee37-471b-a29a-c34ff33dc939\"}"},{"__ref":"Education:{\"uuid\":\"0130cf7d-222b-433d-bb6a-98bff7c50a05\"}"}],"hiredAt":"2026-03-07T03:16:11.817Z","topics":["Algebra II","Algebra I","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Economics","History","Reading","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Machine Learning / AI","Aviation / Aerospace","Public Speaking","Law / Government / Policy","Debate"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ashley-steen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bb35b7e8-8096-4d9e-971e-3cf11dbad566\"}"}}},"_sentryTraceData":"562c5bbc74564e688477a84455367120-8795be07e9ba5f7f-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=562c5bbc74564e
