xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fa5b55b3-ceb9-49dc-a484-f8a7e0a0cdcf\"}":{"__typename":"Favorites","uuid":"fa5b55b3-ceb9-49dc-a484-f8a7e0a0cdcf","photoUrl":"https://ucarecdn.com/80284268-d2eb-4035-8654-353c52ae7e7f/","title":"La Paz, Bolivia","type":"CITY"},"Favorites:{\"uuid\":\"29865b6c-2887-4bbd-a58c-aecaa03cfaec\"}":{"__typename":"Favorites","uuid":"29865b6c-2887-4bbd-a58c-aecaa03cfaec","photoUrl":"https://ucarecdn.com/5f10417c-8dd1-4d55-923e-9c4e2031543a/","title":"Tennis","type":"SPORT"},"Favorites:{\"uuid\":\"2e082d3b-ae9b-403c-9067-8b26c6a2963e\"}":{"__typename":"Favorites","uuid":"2e082d3b-ae9b-403c-9067-8b26c6a2963e","photoUrl":"https://ucarecdn.com/7a733ab1-57fc-4811-85c2-fb75a98abe60/","title":"Me Rehúso by Danny Ocean","type":"SONG"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c3141d0d-d0dc-4d68-91f8-3bb96116a3e6\"}":{"__typename":"DeepDives","uuid":"c3141d0d-d0dc-4d68-91f8-3bb96116a3e6","content":"\u003cp\u003eBecause figuring things out alone is overrated. I’ve had some incredible mentors who helped me see possibilities I never even considered, and I know how much of a difference it makes to have someone in your corner. I also love talking to people, asking big questions, and breaking down complex ideas in a way that actually makes sense. Mentorship is a mix of all of that, it’s learning, teaching, and growing at the same time. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"36591ae9-62fa-4f34-aee2-25f6cde90e22\"}":{"__typename":"DeepDives","uuid":"36591ae9-62fa-4f34-aee2-25f6cde90e22","content":"\u003cp\u003eFirst, stop stressing so much about having it all figured out. Nobody does, not even the adults who seem like they do. You don’t have to pick one perfect path, just follow what excites you, and you’ll connect the dots later. Also, being \"bad\" at something at first doesn’t mean you’ll always be bad at it. Keep trying, ask questions, and don’t let fear of failure stop you from doing cool things. Oh, and prioritize sleep while you can because college and life have other plans.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"cdedeebe-0e77-43c4-ab3f-7f9958cda8ab\"}":{"__typename":"DeepDives","uuid":"cdedeebe-0e77-43c4-ab3f-7f9958cda8ab","content":"\u003cp\u003eI’d love to create something that bridges aerospace and sustainability, whether that’s a technology, a company, or a new way of thinking about how we use space for Earth’s benefit. Space is amazing, but at the end of the day, this planet is home. If I can contribute something meaningful that helps us take better care of it while still pushing boundaries beyond it, I’ll be happy :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"68987c59-abeb-4f49-a906-cdfb22c014f8\"}":{"__typename":"DeepDives","uuid":"68987c59-abeb-4f49-a906-cdfb22c014f8","content":"\u003cp\u003eGrowing up between cultures and speaking multiple languages, I’ve always had to navigate different ways of thinking and learning. It’s made me super aware that there’s no one “right” way to understand something. Sometimes you just need to hear it explained differently, or in a way that actually connects to your life. So when I teach, I try to break things down in a way that makes sense for you, not just in the way it’s traditionally taught.\u003c/p\u003e\u003cp\u003eAlso, coming from cultures that value both discipline and a little bit of chaos, I like to keep things structured but flexible. Learning should feel exciting, not like a chore. If that means using space travel analogies for math problems or debating the meaning of life while learning physics, I’m all for it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"a2f8edd3-3a4c-4c23-b3b2-c256d4a4ff4f\"}":{"__typename":"School","uuid":"a2f8edd3-3a4c-4c23-b3b2-c256d4a4ff4f","name":"Colegio Amor de Dios","city":"La Paz","type":"HIGH","state":"La Paz","country":"Bolivia","zip":"00000"},"Education:{\"uuid\":\"7347834e-be45-44b3-b6d6-cbb59623127f\"}":{"__typename":"Education","uuid":"7347834e-be45-44b3-b6d6-cbb59623127f","school":{"__ref":"School:{\"uuid\":\"a2f8edd3-3a4c-4c23-b3b2-c256d4a4ff4f\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"38c8e34c-74ec-420f-8df2-cfee7a3e7dfc\"}":{"__typename":"Education","uuid":"38c8e34c-74ec-420f-8df2-cfee7a3e7dfc","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2026","major":"MS in Aerospace Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"d5f4f9ed-a2ac-4b6d-b0bc-77790c142541\"}":{"__typename":"MentorPublicProfile","uuid":"d5f4f9ed-a2ac-4b6d-b0bc-77790c142541","displayName":"Alina S.","slug":"alina-santander","biography":"\u003cp\u003eI’m half Latina, half Russian, and 100% fueled by curiosity. I’m a mechatronics engineer and an aerospace engineer-in-the-making, passionate about both space and our home planet.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love science and technology, but I’m equally obsessed with philosophy, politics, humanity and all the big, mind-bending questions about life and the universe. My favorite way to learn is through conversations. Especially the kind that leave you questioning everything. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not engineering or overthinking existence, you’ll probably find me painting or drawing, using art as another way to explore ideas or relief stress.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile I don’t actively chase adrenaline, I did once jump out of a plane (with a parachute, thankfully, wouldn’t be writing this otherwise).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also a big advocate for more women getting into STEM :) \u003c/p\u003e\u003cp\u003eI’m always learning, questioning, and creating, and I can’t wait to share that excitement with you. Let’s think bigger, question everything, and have some fun figuring things out together!\u003c/p\u003e","teachingVideoPlaybackId":"02SXjVvYoJsn2o2wPeXupEKNKvp500kD00wUouFYD00Rcrs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"fa5b55b3-ceb9-49dc-a484-f8a7e0a0cdcf\"}"},{"__ref":"Favorites:{\"uuid\":\"29865b6c-2887-4bbd-a58c-aecaa03cfaec\"}"},{"__ref":"Favorites:{\"uuid\":\"2e082d3b-ae9b-403c-9067-8b26c6a2963e\"}"}],"causesSupported":[],"major":"MS in Aerospace Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c3141d0d-d0dc-4d68-91f8-3bb96116a3e6\"}"},{"__ref":"DeepDives:{\"uuid\":\"36591ae9-62fa-4f34-aee2-25f6cde90e22\"}"},{"__ref":"DeepDives:{\"uuid\":\"cdedeebe-0e77-43c4-ab3f-7f9958cda8ab\"}"},{"__ref":"DeepDives:{\"uuid\":\"68987c59-abeb-4f49-a906-cdfb22c014f8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6b07b226-c733-47a1-82fc-027d346c5b54/-/preview/-/format/jpg/","https://ucarecdn.com/e8c0706a-8dbe-4d90-b545-c322e55d6d9b/-/preview/-/format/jpg/","https://ucarecdn.com/80c6142a-b56f-4e02-ab13-346054a3495c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7347834e-be45-44b3-b6d6-cbb59623127f\"}"},{"__ref":"Education:{\"uuid\":\"38c8e34c-74ec-420f-8df2-cfee7a3e7dfc\"}"}],"hiredAt":"2025-02-18T10:22:20.515Z","topics":["STEM Project","Aviation / Aerospace","Robotics / Electronics / CAD","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alina-santander\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d5f4f9ed-a2ac-4b6d-b0bc-77790c142541\"}"}}},"_sentryTraceData":"27789adf869c4f2f8573de22e2571e5d-9ac90443d46456c6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=27789adf869c4f2f8573de22e2571e5d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alina-santander"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (functio
