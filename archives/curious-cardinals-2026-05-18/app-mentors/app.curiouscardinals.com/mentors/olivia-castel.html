xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"dec2430d-c767-47d9-987a-5884dcbcb349\"}":{"__typename":"DeepDives","uuid":"dec2430d-c767-47d9-987a-5884dcbcb349","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I would say that these are the perfect years for exploration. While it is important to dedicate yourself to certain hobbies, if I could go back in time, I would say that this would be the time to try new things and to get outside of your comfort zone. Personally, I would have pushed myself to live in a new country for a short period of time or try out a niche hobby. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"75c17da7-eb81-483f-8894-6fc965d3cef3\"}":{"__typename":"DeepDives","uuid":"75c17da7-eb81-483f-8894-6fc965d3cef3","content":"\u003cp\u003eIn my spare time, I like to do yoga because I find it to be very relaxing and it serves as the perfect phone-free time. I also enjoy hanging out with my friends and playing board games like Catan with them. I could spend hours playing board games. When I am home, I love to take my dog, Bear, on long walks with my younger brother and parents.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"999a007c-9e1f-44c5-b4aa-f864eb63f011\"}":{"__typename":"DeepDives","uuid":"999a007c-9e1f-44c5-b4aa-f864eb63f011","content":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn 2020, I launched EmBracelets, an organization that aims to simultaneously raise money and awareness for organizations focused on community empowerment. We identify a “focus organization” for which we raise money during a specified period of time. We then design and sell beaded bracelets whose messages align with the mission of the focus organization. EmBracelets supports organizations that specifically address racial, gender, and educational inequalities. When you purchase a bracelet, 75% of the proceeds are donated to the focus organization, and 25% of the proceeds are used for supplies and labor costs.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was inspired to start EmBracelets in April 2020 when I was attending the many Black Lives Matter protests in Washington, DC, so I made Black Lives Matter bracelets for my friends and me to wear. At one of the protests, I learned about Campaign Zero, an organization aiming to end police brutality in the United States. I admired the direct approach Campaign Zero took toward ending police brutality and eagerly wanted to get involved. After a couple of days, came up with the idea to start selling Black Lives Matter bracelets on my neighborhood listserv to raise money for Campaign Zero. This idea eventually evolved into EmBracelets.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eSince then, we have raised over $5,000 for Campaign Zero, Fairfight, an organization that aims to end the disenfranchisement of U.S. citizens, and Girl Rising, which is an organization that advances girls’ right to quality education. We have also expanded our team and recruited eight volunteers. For our most recent project, we raised funds for Endarofta Secondary School, which is in the Karutu region of Tanzania and accommodates 400 boys and girls from all around Tanzania. We have helped them in two ways: raising funds to build a dining hall and holding a supplies drive for books, sports equipment, and school supplies. We are hoping to launch a virtual tutoring program with students from the Endarofta Secondary School and high school students from the DC area this upcoming summer.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"87c12f12-bba1-4366-bd1c-d2285cf75161\"}":{"__typename":"DeepDives","uuid":"87c12f12-bba1-4366-bd1c-d2285cf75161","content":"\u003cp\u003eIn high school, I spent my summers doing a variety of activities. Among these, I spent a couple weeks in the Dominican republic running a camp for local children in a small town, I interned for a venture builder firm as well as an accountant, and I joined plenty of startup programs for high-schoolers.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}":{"__typename":"School","uuid":"e5a76254-778b-4843-9fe4-18689765e318","name":"Sidwell Friends School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20016"},"Education:{\"uuid\":\"37dcc78c-c9d9-4c19-978b-42e0bd5ddcc5\"}":{"__typename":"Education","uuid":"37dcc78c-c9d9-4c19-978b-42e0bd5ddcc5","school":{"__ref":"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}"},"startYear":"2010","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"6183ccb3-5131-4bc4-a93a-6df5f6548637\"}":{"__typename":"Education","uuid":"6183ccb3-5131-4bc4-a93a-6df5f6548637","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Applied Mathematics, International Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"1aae665e-ee23-4f48-96d9-adf74cf7b813\"}":{"__typename":"MentorPublicProfile","uuid":"1aae665e-ee23-4f48-96d9-adf74cf7b813","displayName":"Olivia C.","slug":"olivia-castel","biography":"\u003cp\u003eOlivia is a third-year student at Brown University studying Applied Mathematics and International and Public Affairs. Olivia is part of several student organizations at Brown, such as the Future of Sustainable Investing Conference, the Brown Consulting Club, the Brown Art Review, and the Brown Circle of Women. She was also a production assistant for a Brown Motion Pictures film! Outside of school, she is a mathematics tutor for kids from her hometown and a tutor for Woonsocket High School.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe grew up outside of the DC area in Chevy Chase, Maryland, and attended Sidwell Friends School. In middle school, Olivia began co-leading Girls Who Start, an international nonprofit that aims to inspire girls to become entrepreneurs. Since then, she has helped to grow the organization, led many events featuring inspiring female entrepreneurs, and founded the Girls Who Start publication, which serves as a platform for girls to write about entrepreneurs that inspire them.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, Olivia started EmBracelets, which is an organization that sells seed bead bracelets to raise awareness and funds for organizations centered around community empowerment. Through EmBracelets, Olivia and a team of eight others raised over $5,000 dollars for Campaign Zero, Fairfight, an organization that aims to end the disenfranchisement of U.S. citizens, and Girl Rising, which is an organization that advances girls’ right to quality education.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the summers, Olivia has interned for McKinsey and Company, a management consulting firm, Girl Rising, and Kupanda Capital, a venture builder firm. This upcoming summer, Olivia will be an Events intern at Hermes in New York City. After graduation, Olivia will return to McKinsey and Company as a full-time business analyst.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her free time, you could find Olivia doing yoga, making beaded bracelets, and playing board games with her friends.\u0026nbsp;\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Mathematics, International Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dec2430d-c767-47d9-987a-5884dcbcb349\"}"},{"__ref":"DeepDives:{\"uuid\":\"75c17da7-eb81-483f-8894-6fc965d3cef3\"}"},{"__ref":"DeepDives:{\"uuid\":\"999a007c-9e1f-44c5-b4aa-f864eb63f011\"}"},{"__ref":"DeepDives:{\"uuid\":\"87c12f12-bba1-4366-bd1c-d2285cf75161\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/11c4d06d-1fb6-46ac-a287-7819c928006d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"37dcc78c-c9d9-4c19-978b-42e0bd5ddcc5\"}"},{"__ref":"Education:{\"uuid\":\"6183ccb3-5131-4bc4-a93a-6df5f6548637\"}"}],"hiredAt":"2024-03-06T10:48:37.330Z","topics"
