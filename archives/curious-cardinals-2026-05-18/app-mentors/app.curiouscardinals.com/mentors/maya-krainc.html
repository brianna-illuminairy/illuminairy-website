xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"887c8585-ab55-47a5-8a06-2d91e6338142\"}":{"__typename":"Favorites","uuid":"887c8585-ab55-47a5-8a06-2d91e6338142","photoUrl":"https://ucarecdn.com/1721773d-b548-405d-b270-ccd6049c3f85/","title":"Outline by Rachel Cusk","type":"BOOK"},"Favorites:{\"uuid\":\"24f12cee-3ddc-4480-995f-277779c086e3\"}":{"__typename":"Favorites","uuid":"24f12cee-3ddc-4480-995f-277779c086e3","photoUrl":"https://ucarecdn.com/a135a543-b8b0-4dfd-9dca-02d7d01d6641/","title":"Florence, Italy","type":"CITY"},"CausesSupported:{\"uuid\":\"9325dc3a-0edf-4245-a2df-dbec24297170\"}":{"__typename":"CausesSupported","uuid":"9325dc3a-0edf-4245-a2df-dbec24297170","name":"American Foundation for Suicide Prevention","description":"","photoUrl":""},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"cdb1d514-ebd6-40a6-82c5-7929fb951421\"}":{"__typename":"DeepDives","uuid":"cdb1d514-ebd6-40a6-82c5-7929fb951421","content":"\u003cp\u003eAs a first-generation American with Slovenian heritage, my identity deeply influences my teaching style. Growing up in a bilingual household, I developed a profound appreciation for the nuances of language and the importance of cultural context in communication. My family's heritage instilled in me a strong work ethic, a commitment to education, and a respect for diverse perspectives. These values are reflected in my teaching approach, where I emphasize patience, empathy, and a personalized learning experience. Understanding the challenges and rewards of learning a new language firsthand, I am uniquely equipped to guide my students through their own language-learning journeys with sensitivity and insight. This multicultural background allows me to create a supportive and inclusive environment where every student feels valued and motivated to succeed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1fde0cc1-c8a8-46bc-a0d2-c32f92d67920\"}":{"__typename":"DeepDives","uuid":"1fde0cc1-c8a8-46bc-a0d2-c32f92d67920","content":"\u003cp\u003eMy grandfather is a sculptor from Serbia, whose work largely exists in public spaces and private collections across former-Yugoslavia. A talented artist with significant acclaim in the region, he has  never publicized his work much. To preserve a record of his beautiful work, I have begun putting together a catalog of his sculptures and writing an accompanying biography of his life and career, which I hope to independently publish one day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"3f6b6005-92b2-4774-aeaf-6f4b69204ace\"}":{"__typename":"School","uuid":"3f6b6005-92b2-4774-aeaf-6f4b69204ace","name":"Latin School of Chicago","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60610"},"Education:{\"uuid\":\"e69849e3-8db7-4fed-95eb-8ba549800b7d\"}":{"__typename":"Education","uuid":"e69849e3-8db7-4fed-95eb-8ba549800b7d","school":{"__ref":"School:{\"uuid\":\"3f6b6005-92b2-4774-aeaf-6f4b69204ace\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}":{"__typename":"School","uuid":"891dad70-4e24-4602-8353-1e8140b8eb0c","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60201"},"Education:{\"uuid\":\"f2807d93-807c-4a31-aa56-190283d49fc6\"}":{"__typename":"Education","uuid":"f2807d93-807c-4a31-aa56-190283d49fc6","school":{"__ref":"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Journalism, Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"98ddeb77-add7-4035-a278-abf0ce224c57\"}":{"__typename":"MentorPublicProfile","uuid":"98ddeb77-add7-4035-a278-abf0ce224c57","displayName":"Maya K.","slug":"maya-krainc","biography":"\u003cp\u003eI’m a rising senior at Northwestern University studying journalism and political science. I love all things writing—at NU I get lots of opportunities to do it for fun, writing about student life, art and fashion for magazines. I've been writing since high school, where I learned all about fiction, essays, short stories, poetry, and political journalism, which inspired me to pursue my current majors.\u0026nbsp;When I'm not writing, I love to listen to music, make art, read, and do yoga!\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eBeyond those subjects, I have always loved learning and speaking new languages, like French and Italian. Putting it into practice has always been my favorite way to learn about new cultures, as well connect to my own. I’m a first generation American since both of my parents are from Slovenia. Seeing family there is a big part of my life, as well bringing as much of the culture to our home in Chicago as possible.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAt the core of all the things I love to study and do is working with people and hearing their stories. I hope to bring this interpersonal approach to my studies and hobbies to my teaching as well, to help students learn and realize their goals.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"887c8585-ab55-47a5-8a06-2d91e6338142\"}"},{"__ref":"Favorites:{\"uuid\":\"24f12cee-3ddc-4480-995f-277779c086e3\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"9325dc3a-0edf-4245-a2df-dbec24297170\"}"}],"major":"Journalism, Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cdb1d514-ebd6-40a6-82c5-7929fb951421\"}"},{"__ref":"DeepDives:{\"uuid\":\"1fde0cc1-c8a8-46bc-a0d2-c32f92d67920\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7cdea2a2-8894-4fb8-b53d-6a717145a211/-/preview/-/format/jpg/","https://ucarecdn.com/484e6c72-b503-44de-ae3e-b3fb3fa1f1bd/-/preview/-/format/jpg/","https://ucarecdn.com/6c5a0a9f-cd61-4004-b62c-95d4596f31e8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e69849e3-8db7-4fed-95eb-8ba549800b7d\"}"},{"__ref":"Education:{\"uuid\":\"f2807d93-807c-4a31-aa56-190283d49fc6\"}"}],"hiredAt":"2023-08-20T21:31:56.505Z","topics":["Journalism","Law / Government / Policy","World Cultures","Literature","Fashion / Cosmetics","Cooking","History Project","Writing","French","Italian","Visual Arts / Graphic Design"],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maya-krainc\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"98ddeb77-add7-4035-a278-abf0ce224c57\"}"}}},"_sentryTraceData":"3d07c50515c342a8a7ad04456b72a842-bdd3fbd76892572a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3d07c50515c342a8a7ad04456b72a842,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/
