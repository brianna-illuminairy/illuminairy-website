xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"303ce6d8-d25a-4029-a154-0e2329c9d75e\"}":{"__typename":"Favorites","uuid":"303ce6d8-d25a-4029-a154-0e2329c9d75e","photoUrl":"https://ucarecdn.com/e1fade68-f3c4-4d14-9cb4-2a814f68f181/","title":"Shohei Ohtani","type":"ATHLETE"},"Favorites:{\"uuid\":\"71443841-d809-4bee-bc0c-1ec0ef85fdf3\"}":{"__typename":"Favorites","uuid":"71443841-d809-4bee-bc0c-1ec0ef85fdf3","photoUrl":"https://ucarecdn.com/dc9088f4-df0a-457d-977b-1dfeab7e2a02/","title":"Call Me If You Get Lost -- Tyler, The Creator","type":"ALBUM"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"ddd2c1da-43a0-4d69-b413-b2671e9e1675\"}":{"__typename":"DeepDives","uuid":"ddd2c1da-43a0-4d69-b413-b2671e9e1675","content":"\u003cp\u003eBaseball, camping with my friends, playing music around the Bay Area with my band, and hanging out with my dog. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c2d9f9fa-b808-4f0c-851d-fe5f252787b6\"}":{"__typename":"DeepDives","uuid":"c2d9f9fa-b808-4f0c-851d-fe5f252787b6","content":"\u003cp\u003eIt is extremely fun and satisfying to mentor someone passionate and excited about what they're doing. Mentorship also gives me inspiration to do things that I am excited about too. Lastly, I am able to build relationships with people who are often passionate about something that I also enjoy. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"be0ef9f2-e4f4-4483-b556-6bca98073480\"}":{"__typename":"DeepDives","uuid":"be0ef9f2-e4f4-4483-b556-6bca98073480","content":"\u003cp\u003eWithout a doubt my family. I wouldn't have been able to accomplish much without their support and advice. Specifically my parents, who have been great to talk to and help me with anything I need. So when I think about all of the time and resources spent on my personal growth and development, I am very motivated. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"f2aec547-809d-4d08-b3ff-09b5ee68d959\"}":{"__typename":"DeepDives","uuid":"f2aec547-809d-4d08-b3ff-09b5ee68d959","content":"\u003cp\u003eI play 4 instruments! Piano, guitar, bass, and drums.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"349a376a-3fa9-44f1-82c9-0e399c4a1271\"}":{"__typename":"School","uuid":"349a376a-3fa9-44f1-82c9-0e399c4a1271","name":"Marin Academy","city":"San Rafael","type":"HIGH","state":"California","country":"United States","zip":"94901"},"Education:{\"uuid\":\"4ace3402-9e46-4162-aaf2-34ed397c0671\"}":{"__typename":"Education","uuid":"4ace3402-9e46-4162-aaf2-34ed397c0671","school":{"__ref":"School:{\"uuid\":\"349a376a-3fa9-44f1-82c9-0e399c4a1271\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"80f872a5-6798-4202-a5d3-903a2f26ccb1\"}":{"__typename":"Education","uuid":"80f872a5-6798-4202-a5d3-903a2f26ccb1","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Applied Math-Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"c528ce30-da46-413c-80ce-4e029ebc2c8c\"}":{"__typename":"MentorPublicProfile","uuid":"c528ce30-da46-413c-80ce-4e029ebc2c8c","displayName":"Jacob Y.","slug":"jacob-young","biography":"\u003cp\u003eHi! My name is Jacob Young, I am a recent graduate of Brown University, where I majored in Applied Math-Economics. I was also a student-athlete on the baseball team and a TA, and a member of multiple bands throughout college. Through these experiences, I have developed a deep appreciation for the power of curiosity, resilience, and mentorship when it comes to learning. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I enjoy math, finance, and problem solving. I was a Teacher's Assistant for Investments I, helping students navigate financial models, market theory, and even sometimes job recruiting. My experience as a TA was one of the highlights of my time at Brown and led me to a passion of teaching and education. I was fortunate enough to win the Outstanding TA award for the Economics department and continue my passion as a Teach For America corps member in 2026. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, I was a pitcher for Brown University's baseball team. Balancing Division 1 academics and athletics was challenging but also very exciting. I was our closer in 2024, and also played every summer across the country in California, New York, and Connecticut. I'm excited to continue playing and use my last year of eligibility next year while attending graduate school. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love working with students who are driven, open-minded, and unafraid to wrestle with big questions. Whether we’re diving into math, economics, or even baseball, I aim to foster a collaborative environment where students feel both supported and challenged. I'm excited to work with you, and let's do this!\u003c/p\u003e","teachingVideoPlaybackId":"44KJv3NPUYbIu02b00ZR2q2dCqcm3Ygu8CayoHObGRaVQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"303ce6d8-d25a-4029-a154-0e2329c9d75e\"}"},{"__ref":"Favorites:{\"uuid\":\"71443841-d809-4bee-bc0c-1ec0ef85fdf3\"}"}],"causesSupported":[],"major":"Applied Math-Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ddd2c1da-43a0-4d69-b413-b2671e9e1675\"}"},{"__ref":"DeepDives:{\"uuid\":\"c2d9f9fa-b808-4f0c-851d-fe5f252787b6\"}"},{"__ref":"DeepDives:{\"uuid\":\"be0ef9f2-e4f4-4483-b556-6bca98073480\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2aec547-809d-4d08-b3ff-09b5ee68d959\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9977d254-8cab-4f1d-a765-018da625aa31/-/preview/-/format/jpg/","https://ucarecdn.com/31dc66b7-8f61-4100-9d13-f2bbefee64ee/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4ace3402-9e46-4162-aaf2-34ed397c0671\"}"},{"__ref":"Education:{\"uuid\":\"80f872a5-6798-4202-a5d3-903a2f26ccb1\"}"}],"hiredAt":"2025-06-12T14:01:47.264Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Economics","Academic Coaching","Music","Finance / Investing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jacob-young\"}})":{"__ref":"M
