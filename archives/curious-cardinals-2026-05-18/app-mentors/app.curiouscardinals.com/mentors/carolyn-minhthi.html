hose organizations, such as Co-President of the Stanford Real Estate Club and VP of Recruiting of Stanford Finance. She dedicates her time encouraging underrepresented groups to explore finance as a possible career path and adopting mentees to help them through the recruiting process for various firms such as Goldman Sachs, Morgan Stanley, and KKR. She’s also the Culture Night Director of Stanford Vietnamese Association, where she plans the biggest Vietnamese event of the year at Stanford’s campus to showcase Vietnamese culture and Vietnamese students’ talents. Outside of her organizations, Carolyn likes going out for boba runs, dancing with her friends, watching basketball and soccer highlights, and playing Brawl Stars, a mobile-app battle arena game similar to Clash of Clans. As a mentor at Curious Cardinals, Carolyn hopes to inspire the next generation of underrepresented communities to pursue careers in finance, explore their family and ethnic histories, and engage in social activism.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/673b6d9f-26d3-45f7-9d02-1908d5b169c9/-/crop/1052x1053/0,0/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ee1155e4-ac5e-4e4e-bfb5-f0dddfd8de74\"}"}],"hiredAt":"2022-11-17T18:38:40.000Z","topics":["Finance / Investing","Economics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"carolyn-minhthi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"457ed5a7-8a4c-483c-b30f-cc3787aee5ee\"}"}}},"_sentryTraceData":"afd6f58c5a5e4fdd8e7a6cc8e055df5d-9cd3ee2d29b6ac3f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public
