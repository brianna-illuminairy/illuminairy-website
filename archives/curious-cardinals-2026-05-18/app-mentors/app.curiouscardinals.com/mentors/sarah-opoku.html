xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3ce3bbde-7200-4e30-bbc3-405bca71be8f\"}":{"__typename":"Favorites","uuid":"3ce3bbde-7200-4e30-bbc3-405bca71be8f","photoUrl":"https://ucarecdn.com/0ac07fdd-9073-4f1f-b318-bf790d99ad0c/","title":"Never Enough - Daniel Caesar","type":"ALBUM"},"Favorites:{\"uuid\":\"0209f204-d275-4f2f-872a-1c758dd5ed37\"}":{"__typename":"Favorites","uuid":"0209f204-d275-4f2f-872a-1c758dd5ed37","photoUrl":"https://ucarecdn.com/98a54744-6906-4085-8c78-064967b5a98a/","title":"Claude Monet","type":"ARTIST"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fecb1ede-e755-416a-ac2a-8c56ffe133fb\"}":{"__typename":"DeepDives","uuid":"fecb1ede-e755-416a-ac2a-8c56ffe133fb","content":"\u003cp\u003eI chose Physical Chemistry because I’m drawn to the “why” behind how things work at the most fundamental level—especially in nature and the atmosphere. I’ve always been curious about the invisible processes that shape our world, and that curiosity naturally expanded beyond Earth to space. Astrochemistry fascinates me because it explores how molecules behave in extreme environments and what that can tell us about the universe. The unknowns in space chemistry feel limitless, and I’m excited by how much we still have to discover.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt the same time, I’ve always loved math for its clarity—there’s a right answer, and there’s a method to get there. Working through a difficult problem is satisfying because it rewards persistence and logic. That structure has helped me approach scientific questions with more confidence, especially in areas like quantum mechanics, thermodynamics, and kinetics.\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePhysical chemistry is the perfect intersection of these two passions. It gives me the mathematical tools to model real systems and the scientific framework to study phenomena ranging from cloud behavior in Earth’s atmosphere to unexplained energy bursts in outer space. It’s a field that challenges me to think critically and creatively, and it gives me the flexibility to explore both theoretical questions and real-world applications.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUltimately, I chose this major because it allows me to study the universe from a molecular perspective while sharpening the analytical skills I value. Physical chemistry helps me connect ideas across disciplines—and that’s what keeps me excited to keep learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"6aaab6c4-01bd-41a0-98ae-9b9bd3946e5d\"}":{"__typename":"DeepDives","uuid":"6aaab6c4-01bd-41a0-98ae-9b9bd3946e5d","content":"\u003cp\u003eAs a high school student, I was definitely a theater kid through and through. I went to an arts high school, so a big part of my identity was tied to creativity—whether I was performing in a show, making flyers, or making hyper-specific playlists for every mood. Music was (and still is) a huge part of how I processed the world and connected with people. I loved the collaborative energy of theater and the way it brought together people with totally different strengths to tell a story.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLooking back, I was someone who wanted to explore everything—creative, academic, and in-between. That mix of curiosity and expression helped shape the kind of learner and collaborator I am today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"198af115-8819-4113-9041-f8a132058d43\"}":{"__typename":"DeepDives","uuid":"198af115-8819-4113-9041-f8a132058d43","content":"\u003cp\u003eIn my spare time, I’ve recently started getting into reading more—it’s a nice way to unwind and explore new ideas. I also spend a lot of time watching TV with my roommates; it’s fun to have those shared shows and just relax together after a busy day. Cooking is another favorite—I love trying out new recipes and experimenting in the kitchen. When I want to get outside, I enjoy going on walks to clear my mind and get some fresh air.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also into painting, which lets me be creative in a different way than my academic work. And of course, I like playing video games as a way to have fun and challenge myself. Lastly, I enjoy going shopping now and then, whether it’s for something practical or just to browse and find little things that make me happy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"cd813d77-5ab2-4eef-9c9c-cf229fc01f31\"}":{"__typename":"DeepDives","uuid":"cd813d77-5ab2-4eef-9c9c-cf229fc01f31","content":"\u003cp\u003eMy greatest source of motivation is seeing the progress I’ve made in my life. I used to struggle a lot with confidence in my abilities, whether it was academically or in other areas. Looking back at what I’ve accomplished despite those doubts motivates me every day. It reminds me that the challenges I face now are just part of the journey, and that one day, I’ll look back on today’s struggles the same way — as moments that helped me grow and get stronger. That perspective keeps me moving forward and believing in my potential, even when things feel tough.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"5d092c42-8d0e-4c01-972f-6579d256b269\"}":{"__typename":"School","uuid":"5d092c42-8d0e-4c01-972f-6579d256b269","name":"School for Creative and Performing Arts","city":"Cincinnati","type":"HIGH","state":"Ohio","country":"USA","zip":"45202"},"Education:{\"uuid\":\"b1d66b1e-7694-48bf-aac7-dabf80d5c298\"}":{"__typename":"Education","uuid":"b1d66b1e-7694-48bf-aac7-dabf80d5c298","school":{"__ref":"School:{\"uuid\":\"5d092c42-8d0e-4c01-972f-6579d256b269\"}"},"startYear":"2020","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"e06c9020-ffcd-4f54-aebd-c6232d7a983d\"}":{"__typename":"Education","uuid":"e06c9020-ffcd-4f54-aebd-c6232d7a983d","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"589f6308-58ec-4391-a5e4-1a5f9bdbf0a7\"}":{"__typename":"MentorPublicProfile","uuid":"589f6308-58ec-4391-a5e4-1a5f9bdbf0a7","displayName":"Sarah O.","slug":"sarah-opoku","biography":"\u003cp\u003eHi! I’m Sarah, I'm from Cincinnati, OH, and I’m currently a senior at Northwestern University studying Physical Chemistry. I’m especially interested in how science intersects with everyday life—whether that’s through research, teaching, or helping others feel more confident in academic spaces. I’ve always been someone who enjoys asking “why” and “how,” and college has given me the chance to explore those questions in depth—especially through hands-on experiences in labs, collaborative group projects, and meaningful conversations with peers and professors.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I focus much of my time on space-focused chemistry and atmospheric science. I’ve had the chance to work on research involving mysterious energy bursts from outer space, as well as cloud behavior and the chemistry that influences it here on Earth. In these projects, I’ve contributed to everything from data collection and analysis to presenting findings in a way that sparks curiosity in others. These experiences have not only deepened my curiosity and strengthened my problem-solving skills, but also taught me how to break down complex scientific ideas into clear, approachable explanations—a skill I bring directly into mentoring. Connecting theoretical concepts to real-world questions has made me more adaptable as a teacher, and more empathetic to the challenges students face when learning difficult material.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI care deeply about making science more approachable and less intimidating—especially for students who might not immediately see themselves in STEM fields. Through mentoring, tutoring, and explaining tough concepts in ways that actually make sense, I’ve seen students move from confusion to confidence. One of my favorite approaches is using analogies that connect science to everyday experiences, helping students realize they already have the tools to understand challenging topics. That transformation is one of the most rewarding parts of being a mentor, and it’s something I’m committed to fostering in every interaction.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I stay involved in activities that help me recharge and keep perspective. I play on an intramural soccer team, snowboard when I can, love visiting art museums, and unwind with video games and time with friends. These experiences keep me balanced and remind me that strong mentorship isn’t just about academics—it’s also about listening, adapting, and creating a supportive environment where students feel heard.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe that balance is essential for success. School can be intense, and I’ve learned how important it is to care for yourself mentally, emotionally, and socially while still pushing toward your goals. Whether it’s building better study habits, preparing for a tough exam, or figuring out how to ask the right questions, I want students to feel like they have someone in their corner. I know firsthand how valuable that support can be, and I’m excited to bring that energy, patience, and problem-solving mindset to the students I work with in the future.\u003c/p\u003e","teachingVideoPlaybackId":"blBG34boUJGVf1LhGBFyL2cMK9GKDDNQcTIKHcn8ga4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3ce3bbde-7200-4e30-bbc3-405bca71be8f\"}"},{"__ref":"Favorites:{\"uuid\":\"0209f204-d275-4f2f-872a-1c758dd5ed37\"}"}],"causesSupported":[],"major":"Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fecb1ede-e755-416a-ac2a-8c56ffe133fb\"}"},{"__ref":"DeepDives:{\"uuid\":\"6aaab6c4-01bd-41a0-98ae-9b9bd3946e5d\"}"},{"__ref":"DeepDives:{\"uuid\":\"198af115-8819-4113-9041-f8a132058d43\"}"},{"__ref":"DeepDives:{\"uuid\":\"cd813d77-5ab2-4eef-9c9c-cf229fc01f31\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/086c5ea6-70c8-4534-9c6a-89732da1b98f/-/preview/-/format/jpg/","https://ucarecdn.com/6632e48d-bb32-424f-9542-0ca5dcd67f16/-/preview/-/format/jpg/","https://ucarecdn.com/f63812f1-9146-42ed-85d9-de9f7c627a43/-/preview/-/format/jpg/"],"pronouns
