xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"13a276c7-9d2c-4ebb-914d-e674cdac4d5c\"}":{"__typename":"Favorites","uuid":"13a276c7-9d2c-4ebb-914d-e674cdac4d5c","photoUrl":"https://ucarecdn.com/0c0c566f-f14f-4b54-8726-bede9f741a19/","title":"The Seven Husbands of Evelyn Hugo","type":"BOOK"},"Favorites:{\"uuid\":\"7450c956-246e-4797-8182-67f4e01a64d3\"}":{"__typename":"Favorites","uuid":"7450c956-246e-4797-8182-67f4e01a64d3","photoUrl":"https://ucarecdn.com/2da8535c-5687-4735-945a-d6f9fdf7e786/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"1dcfb498-fa3b-43a2-bddc-661837ca2469\"}":{"__typename":"Favorites","uuid":"1dcfb498-fa3b-43a2-bddc-661837ca2469","photoUrl":"https://ucarecdn.com/49ce3025-c631-473e-8274-4a716c100080/","title":"Madrid","type":"CITY"},"CausesSupported:{\"uuid\":\"8cdcd52a-9524-4342-a497-8109e34c0877\"}":{"__typename":"CausesSupported","uuid":"8cdcd52a-9524-4342-a497-8109e34c0877","name":"Dahnoun Mutual Aid","description":"\u003cp\u003eI help fundraise whenever I can!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/ba2bac10-5ea8-4fdc-9aef-a28663e47f36/"},"CausesSupported:{\"uuid\":\"b2a77789-bf1d-4848-82ef-cea4b4844f0c\"}":{"__typename":"CausesSupported","uuid":"b2a77789-bf1d-4848-82ef-cea4b4844f0c","name":"Alzheimer's Association","description":"\u003cp\u003eI lost my grandma to Alzheimer's and support all the work this association does\u003c/p\u003e","photoUrl":"https://ucarecdn.com/d48ec542-a6c0-4d94-b47a-5e982e664725/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7f5ac2f1-394d-4f08-8079-64d01eb3e2a5\"}":{"__typename":"DeepDives","uuid":"7f5ac2f1-394d-4f08-8079-64d01eb3e2a5","content":"\u003cp\u003eIn my free time, I love to go climbing (top-rope and bouldering), try all the good eats in SF with my friends (noodles are my favorite), play with my roommate's cat Toully, go to concerts around the city, and travel the world when I'm able to! Recently, I traveled around Europe and fell in love with Madrid and Amsterdam.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d4910868-6b6a-4797-aa17-541ce1589514\"}":{"__typename":"DeepDives","uuid":"d4910868-6b6a-4797-aa17-541ce1589514","content":"\u003cp\u003eI grew up camping with my family and every summer we would take a camping trip to Shaver Lake, which is in the mountains in California. We would go around the 4th of July and spend 1-2 weeks playing water sports, fishing, hanging around the campfire, and going on hikes and day trips in the area. My parents still go every summer and I try to make it when I can!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"193228e6-3940-4320-9624-03f477361ea2\"}":{"__typename":"DeepDives","uuid":"193228e6-3940-4320-9624-03f477361ea2","content":"\u003cp\u003eI was a pretty shy kid growing up, but things that brought me out of my shell included music, tv shows, swim team, and laughing with my friends. I was super studious throughout middle/high school but always found time to go to concerts, see a movie, or go to the beach with pals. I loved swimming, whether for school or in the ocean, and I still do :).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6a454e33-a7a1-41e5-ad46-d762243a1970\"}":{"__typename":"DeepDives","uuid":"6a454e33-a7a1-41e5-ad46-d762243a1970","content":"\u003cp\u003eI didn't know my major existed until my sophomore year of college when I took an introduction to Informatics course out of curiosity. Through this class, I discovered what UX and human-centered design are and was fascinated by the intersection between technology and art. I loved being able to express my creative side through the design aspect while also exercising my people skills in a way that was innovative and technology-driven. It was so cool to learn how design has such an impact on tech and the way people experience it, and how I could be a part of that. Creating beautiful tech crafted around people's psychological, emotional, and physical needs is something I learned I loved and thus decided to major in HCI (human-computer interaction).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"11924481-640e-4cfb-8cf7-41673119fd37\"}":{"__typename":"School","uuid":"11924481-640e-4cfb-8cf7-41673119fd37","name":"Westlake High School","city":"Thousand Oaks","type":"HIGH","state":"California","country":"United States","zip":"91362"},"Education:{\"uuid\":\"c4b436c1-3fe2-4e8d-aaa7-d9bbc57870f9\"}":{"__typename":"Education","uuid":"c4b436c1-3fe2-4e8d-aaa7-d9bbc57870f9","school":{"__ref":"School:{\"uuid\":\"11924481-640e-4cfb-8cf7-41673119fd37\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2a02358a-dc1b-4555-a7a9-d087e5dbc17d\"}":{"__typename":"School","uuid":"2a02358a-dc1b-4555-a7a9-d087e5dbc17d","name":"University of Washington","city":"Seattle","type":"COLLEGE","state":"Washington","country":"United States","zip":"98195"},"Education:{\"uuid\":\"d1d56eea-d7c7-4d71-b90e-16021ae92199\"}":{"__typename":"Education","uuid":"d1d56eea-d7c7-4d71-b90e-16021ae92199","school":{"__ref":"School:{\"uuid\":\"2a02358a-dc1b-4555-a7a9-d087e5dbc17d\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"Informatics: Human-Computer Interaction","degree":null},"MentorPublicProfile:{\"uuid\":\"343800d9-dab0-426b-837d-84d28e9a8baf\"}":{"__typename":"MentorPublicProfile","uuid":"343800d9-dab0-426b-837d-84d28e9a8baf","displayName":"Lia K.","slug":"lia-kitahata","biography":"\u003cp\u003eHi yall my name is Lia (she/her)! I’m from SoCal but went to UW in Seattle (class of ‘21), where I studied Informatics with a concentration in Human-Computer Interaction (HCI) and a minor in Spanish. I discovered my affinity and love for User Experience (UX) design during my sophomore year of college after taking an Introduction to Informatics course and learning about what UX/UI is and how it ties design into tech. It beautifully mixes technological innovation, creativity, psychology, and a deep understanding of people and their needs. Through this, I found that my passion lies in the intersection of technology, art, and social good. My goal is to design for the betterment of people and society. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThough my focus is in the world of tech, I've always had a deep love for liberal arts and also enjoy reading, writing, and consuming various forms of the arts. I'm particularly drawn to languages and learning about other cultures, thus inspiring me to do a minor in Spanish. Post-grad, I worked remotely for a Spanish-English bilingual SaaS startup for about 2.5 years as a UX Designer. But recently, I left to expand my skillset at other companies and be able to dedicate my time to a greater variety of roles—like mentoring here at Curious Cardinals! I'm so thrilled to be back in an academic environment among such an impressive and dedicated group of other mentors and students.  \u003c/p\u003e\u003cbr\u003e\u003cp\u003eA bit about me outside of my career/academia: About a year ago, I moved to SF and have been loving it! In my free time, I love rock climbing, going on long walks around the city, getting involved in the queer community, picking up new hobbies (currently attempting crocheting and surfing), and attending lots of live shows/concerts. I'm extremely proud of the positive, warm community I've built here and across the world, and am constantly surrounded by brilliant people who inspire me to be a better version of myself. And I can't wait to include you in that community!\u003c/p\u003e","teachingVideoPlaybackId":"sJr0100KAb7eoSHWMVLT3hmzETB7MYvFD00ymRkjqM4oeM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"13a276c7-9d2c-4ebb-914d-e674cdac4d5c\"}"},{"__ref":"Favorites:{\"uuid\":\"7450c956-246e-4797-8182-67f4e01a64d3\"}"},{"__ref":"Favorites:{\"uuid\":\"1dcfb498-fa3b-43a2-bddc-661837ca2469\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8cdcd52a-9524-4342-a497-8109e34c0877\"}"},{"__ref":"CausesSupported:{\"uuid\":\"b2a77789-bf1d-4848-82ef-cea4b4844f0c\"}"}],"major":"Informatics: Human-Computer Interaction","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7f5ac2f1-394d-4f08-8079-64d01eb3e2a5\"}"},{"__ref":"DeepDives:{\"uuid\":\"d4910868-6b6a-4797-aa17-541ce1589514\"}"},{"__ref":"DeepDives:{\"uuid\":\"193228e6-3940-4320-9624-03f477361ea2\"}"},{"__ref":"DeepDives:{\"uuid\":\"6a454e33-a7a1-41e5-ad46-d762243a1970\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/af5e2535-1bc3-454e-b6b1-35d18831b890/-/preview/-/format/jpg/","https://ucarecdn.com/9115845d-06f6-43bc-abfe-f8369ea8c96d/-/preview/-/format/jpg/","https://u
