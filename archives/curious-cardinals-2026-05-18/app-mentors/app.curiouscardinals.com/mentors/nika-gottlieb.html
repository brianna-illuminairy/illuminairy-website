"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"be7dfc1d-1243-4a5f-9781-c0bec16c8d69\"}":{"__typename":"DeepDives","uuid":"be7dfc1d-1243-4a5f-9781-c0bec16c8d69","content":null,"videoPlaybackId":"HX02dG00Uj3k3BjoBOKeHCbyhtjqJyiTmz3uENKjS6iTo","question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"854c9b18-6748-4057-835c-14400b2f8ce3\"}":{"__typename":"DeepDives","uuid":"854c9b18-6748-4057-835c-14400b2f8ce3","content":null,"videoPlaybackId":"xj5cJLezz2jViZTjIFG01ErrkToY3eDTpzhYbxWz66iA","question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"1ad3e188-3f6f-4465-9f4d-e918973266d7\"}":{"__typename":"School","uuid":"1ad3e188-3f6f-4465-9f4d-e918973266d7","name":"The Madeira School","city":"McLean","type":"HIGH","state":"Virginia","country":"United States","zip":"22102"},"Education:{\"uuid\":\"cd87c9d8-1765-43c7-8e3b-b6511f1bb009\"}":{"__typename":"Education","uuid":"cd87c9d8-1765-43c7-8e3b-b6511f1bb009","school":{"__ref":"School:{\"uuid\":\"1ad3e188-3f6f-4465-9f4d-e918973266d7\"}"},"startYear":"2016","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e33b553b-d2f0-4167-8ef5-8cdea7fc8167\"}":{"__typename":"School","uuid":"e33b553b-d2f0-4167-8ef5-8cdea7fc8167","name":"University of Toronto","city":"Toronto","type":"COLLEGE","state":"Ontario","country":"Canada","zip":"M5S 1A1"},"Education:{\"uuid\":\"50393a4b-5123-40e8-8778-835a132a3809\"}":{"__typename":"Education","uuid":"50393a4b-5123-40e8-8778-835a132a3809","school":{"__ref":"School:{\"uuid\":\"e33b553b-d2f0-4167-8ef5-8cdea7fc8167\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Human Biology \u0026 European Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"ea039f64-5263-4ef9-99df-050e816e5441\"}":{"__typename":"MentorPublicProfile","uuid":"ea039f64-5263-4ef9-99df-050e816e5441","displayName":"Nika G.","slug":"nika-gottlieb","biography":"\u003cp\u003e\u003cstrong\u003eHi! I’m Nika and I’m a neuroscience researcher who helps students turn their curiosity about the brain and body into projects they’re proud of!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’m a cognitive neuroscience researcher who just completed a\u003cstrong\u003e Dual Master’s \u003c/strong\u003ebetween three of the world’s leading research institutions for brain science: \u003cstrong\u003eUniversity College London (UCL)\u003c/strong\u003e, \u003cstrong\u003eSorbonne University,\u003c/strong\u003e and\u003cstrong\u003e École Normale Supérieure in Paris\u003c/strong\u003e. My research focuses on how we perceive emotion, adapt to uncertainty, and make sense of the world — especially through attention, surprise, and visual perception. Along the way, I’ve presented my work at international psychology and neuroscience conferences and earned recognition on the Dean’s List for finishing in the top 5% of all brain sciences graduate students at UCL.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut I didn’t start out in science. In college, I began in a non-STEM program and later switched to Human Biology. At first, I thought I didn’t have a “science brain.” From there, I had to teach myself everything — from coding in R to analyzing brain scans to writing scientific papers. That experience taught me how to approach any complex problem with structure, creativity, and confidence — and that’s exactly what I love mentoring students to do. I believe anyone who’s curious about science can develop a science brain!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI mentor students who want to explore Academic Mentorship or Passion Projects in the following areas:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eIntro to research methods\u003c/strong\u003e — how to ask great questions, design a study, read/write scientific papers, and use statistics for research.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eScientific communication\u003c/strong\u003e — from simplifying journal articles to creating engaging explainers (videos, zines, blog posts, or presentations).\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHuman Biology, Psychology, neuroscience, or human biology \u003c/strong\u003e— academic mentorship, or passion projects in research: literature reviews, behavior experiments, or original study design.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCognitive neuroscience \u0026amp; psychology deep dives\u003c/strong\u003e — including but not limited to: emotion, memory, perception, attention, mental health, and mood disorders.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic mentorship for neurodivergent students (ADHD, multi-interested learners)\u003c/strong\u003e — executive functioning, organization, and confidence in academic spaces.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help you\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve learned from some of the world’s leading scientists how to design and run health and neuroscience projects: literature reviews, behavioral experiments, conference presentations, and more. Before graduate school, I worked as a \u003cstrong\u003emath tutor\u003c/strong\u003e and a \u003cstrong\u003edebate/public speaking coach\u003c/strong\u003e, so I know how to explain complex ideas in clear, engaging ways.\u003c/p\u003e\u003cp\u003eJust as importantly, I understand what it feels like to break into research without a roadmap. Because I had to teach myself these systems, I’m especially effective at mentoring students who are:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eNew to research\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInterdisciplinary thinkers\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNeurodivergent or figuring out how they learn best\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eA session with me might look like:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking down dense science concepts into clear, simple takeaways\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorming a mini passion project you’re genuinely excited about\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing academic writing or presentation skills\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding an organization system that works for \u003cem\u003eyour\u003c/em\u003e brain\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTalking honestly about grad school, research, and careers in science\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside of research\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not studying brains, I’m vintage shopping or thrift flipping my finds, visiting museums with a good playlist, and playing music (classical guitar + learning banjo). I also love experimenting in the kitchen (ask me about my elaborate rice cooker meals), and doing photography. I’m also a \u003cem\u003eStar Trek\u003c/em\u003e fan (Deep Space 9 forever) and love curating niche Spotify playlists!\u003c/p\u003e","teachingVideoPlaybackId":"x6Z2d3q787yBE8E3JU1GG00bt2SncBxmvuNbE00H7YvH8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"59520a6e-ad10-4905-982e-85ed19e5b83c\"}"},{"__ref":"Favorites:{\"uuid\":\"0c008bf7-ee53-46ee-a959-0399ca24c25e\"}"},{"__ref":"Favorites:{\"uuid\":\"ba1cf197-664f-47b8-b025-a8ad034c2f5e\"}"}],"causesSupported":[],"major":"Human Biology \u0026 European Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ef817521-8138-45fc-96ff-5b817f78d4ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"5e0970be-ed1d-4d5f-ba6b-5be40d92c4a3\"}"},{"__ref":"DeepDives:{\"uuid\":\"be7dfc1d-1243-4a5f-9781-c0bec16c8d69\"}"},{"__ref":"DeepDives:{\"uuid\":\"854c9b18-6748-4057-835c-14400b2f8ce3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b42555f1-2b23-4858-830d-4b2b88b41dd7/-/preview/-/format/jpg/","https://ucarecdn.com/19e6d7a3-ec16-43dd-94b9-2feed38193c3/-/preview/-/format/jpg/","https://ucarecdn.com/060fd375-6e1f-44eb-90b6-2a2b4bad322a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cd87c9d8-1765-43c7-8e3b-b6511f1bb009\"}"},{"__ref":"Education:{\"uuid\":\"50393a4b-5123-40e8-8778-835a132a3809\"}"}],"hiredAt":"2025-09-26T08:19:00.364Z","topics":["Algebra I","Algebra II","K-5 Grade Math","Pre-Algebra","Statistics","6-8 Grade Science","Biology","Writing","French","Academic Coaching","College Essay Writing","Executive Function","History","Reading","Fashion / Cosmetics","Film / Theater","Video / Photography","Visual Arts / Graphic Design","Medicine / Health","STEM Project","Debate","Law / Government / Policy","Public Speaking"],"communityBadges"
