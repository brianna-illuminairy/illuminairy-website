xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e9ff97a4-8adb-48d0-bd99-a2ae59cb7091\"}":{"__typename":"Favorites","uuid":"e9ff97a4-8adb-48d0-bd99-a2ae59cb7091","photoUrl":"https://ucarecdn.com/0c5a8415-da33-4b1b-b90b-b8a2c2da8cbb/","title":"Olivia Rodrigo ","type":"ARTIST"},"Favorites:{\"uuid\":\"cd066642-b584-472d-9cd3-b4ae0828da8b\"}":{"__typename":"Favorites","uuid":"cd066642-b584-472d-9cd3-b4ae0828da8b","photoUrl":"https://ucarecdn.com/61693645-b9a2-4044-bbce-c162e00cda43/","title":"Deadpool \u0026 Wolverine ","type":"MOVIE"},"Favorites:{\"uuid\":\"095f6f59-dc3a-444d-b013-c4c63bf94775\"}":{"__typename":"Favorites","uuid":"095f6f59-dc3a-444d-b013-c4c63bf94775","photoUrl":"https://ucarecdn.com/0b749366-f389-4034-984f-e2c6fb1fa6ee/","title":"New Orleans, Louisiana, United States","type":"CITY"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"cdfe2b5b-3a13-45fb-86dc-bd4397ac88e1\"}":{"__typename":"DeepDives","uuid":"cdfe2b5b-3a13-45fb-86dc-bd4397ac88e1","content":"\u003cp\u003e\u003cem\u003eThe future.\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs long as I could remember, even since I was going to elementary school, my Mom and Dad instilled the desire of sacrificing today for a better tomorrow. After all, the best way to predict your future is by being disciplined enough to take accountability and create it yourself. I can’t even tell you how many times I’ve sat in a long car ride, looking out the window, and imagining the dream version of myself as well as what I wanted my future to look like. But, I turned this daydreaming to action through a plan that began with setting clear, achievable goals. This took form in the shape of planning my classes, helping others, or creating opportunities in my environment.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eRegardless of the challenges and uncertainties I continue to face along the way, my motivation remains absolute. Every time I think about my future, I am reminded of the countless possibilities and the potential for growth and fulfillment. Persevering through struggle has taught me that anything is possible with hard work, determination, and most importantly, heart. My future is not just a distant dream that the little middle school version of myself imagined while resting his head on the car, instead, it’s an attainable reality that I am committed to shaping through my efforts, discipline, and unwavering belief in the power of using today to create a better tomorrow.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"726783b5-b340-4036-8237-94eb4092ce8b\"}":{"__typename":"DeepDives","uuid":"726783b5-b340-4036-8237-94eb4092ce8b","content":"\u003cp\u003eGrowing up, I often found myself in the role of\u0026nbsp; “little brother”—looking up to my older siblings, learning from their experiences, and mirroring their interests and behaviors. This dynamic has created a natural inclination in me towards fostering supportive and nurturing relationships.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn many ways, my approach to teaching mirrors how an older sibling would interact with their younger siblings. I strive to create an environment where my students feel supported and understood, much like how I felt with my siblings. This involves a balance of guidance and encouragement, where I aim to instill confidence and foster a sense of belonging. I teach with the same care and attentiveness that an older brother might offer: patiently explaining concepts while providing analogies that my student will be able to recognize, providing constructive feedback, and celebrating each student’s progress.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis sibling-like dynamic extends to the trust I build with my students as well. Just as I looked up to my siblings and felt motivated by their actions, I work to earn my students’ trust by being approachable, genuinely interested in their success, and holding myself to high standards to serve as an example. I listen actively to their concerns, offer personalized advice, and adapt my teaching methods to meet their individual needs.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBy developing these close, trusting relationships, I create an atmosphere where students feel comfortable to ask questions, express their thoughts, and take risks. Ultimately ,this supportive approach not only enhances their learning experience, but also empowers them to achieve their full potential.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5d7905be-abe7-4a3f-aef3-9703afb3922a\"}":{"__typename":"DeepDives","uuid":"5d7905be-abe7-4a3f-aef3-9703afb3922a","content":"\u003cp\u003eIf I could offer advice to my middle or high school self, I think it’d be to focus more on what I could do each day to improve, even if those improvements seemed small. For example, during the pandemic, I really wish I would’ve stuck with learning an instrument, because when I moved out, I’d be able to be the person who knew how to play anybody's favorite song!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring those years, I lost focus on the present because I was meticulously planning out my future, and in doing so, I didn’t always give myself the flexibility to adapt when things didn’t go as planned. When COVID-19 disrupted my plans, I was forced to navigate unexpected challenges and reevaluate my approach. It was through this struggle that I truly learned the value of adaptability and resilience. Embracing those tough moments paved the way for me to find a way to make progress each day, even if it felt like it was something small or pointless.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eHad I stuck strictly to my original plans without adapting to my circumstances, I might’ve missed out on important learning experiences and personal growth. So, my advice to my younger selves is to \u003cstrong\u003eembrace \u003c/strong\u003ethe struggle, be ready to \u003cstrong\u003eadapt \u003c/strong\u003eand create a new plan, and focus on continuous, incremental improvements. Sometimes, the detours and challenges lead to the most rewarding outcomes.\u003cem\u003e :)\u003c/em\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4c23d8c7-bbfa-43be-9bf9-f355e0334152\"}":{"__typename":"DeepDives","uuid":"4c23d8c7-bbfa-43be-9bf9-f355e0334152","content":"\u003cp\u003eI chose the Human Biology major at Stanford because it uniquely combines the rigorous study of biological sciences with a broader exploration of human experiences and societal contexts. This interdisciplinary approach is especially appealing, not only because I can create my own area of emphasis, but also because it aligns perfectly with my aspiration to attend medical school and deepen my understanding of what makes us human.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe Human Biology program stood out to me because it studies biological principles alongside social, behavioral, and ethical dimensions. My favorite part about the major is how flexible it is, because after taking the core classes, I’ll be able to tailor my classes to my interests. I’m particularly drawn to exploring the intersection between psychology, philosophy, biology, and neuroscience. During high school, I took classes in some of these disciplines, and it gave me two very different perspectives on the human experience, and so I want to continue exploring this distinction in the future. This multidisciplinary focus will allow me to understand how our mental and physical processes intertwine, and differentiate, with one another to shape who we are.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith this unique combination of classes, I will gain many new and interesting perspectives, which will help with patient care in the future because I’ll be able to integrate scientific knowledge with a compassionate understanding of the psychological and philosophical aspects of the human experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"604c873b-5b61-4901-b8d2-d765d97daf54\"}":{"__typename":"School","uuid":"604c873b-5b61-4901-b8d2-d765d97daf54","name":"Magnolia Science Academy-1","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91335"},"Education:{\"uuid\":\"8cea7d63-78e4-47cf-8989-4fdf3e71c5f9\"}":{"__typename":"Education","uuid":"8cea7d63-78e4-47cf-8989-4fdf3e71c5f9","school":{"__ref":"School:{\"uuid\":\"604c873b-5b61-4901-b8d2-d765d97daf54\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"53ed33ee-38e4-4563-b947-7558e43e2b51\"}":{"__typename":"Education","uuid":"53ed33ee-38e4-4563-b947-7558e43e2b51","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"4182ff87-22c0-40b0-81f2-470e894d6690\"}":{"__typename":"MentorPublicProfile","uuid":"4182ff87-22c0-40b0-81f2-470e894d6690","displayName":"Anthony A.","slug":"anthony-abasi","biography":"\u003cp\u003eHi, my name is Anthony Abasi! I’m a Human Biology major at Stanford University, interested in exploring the intersection between biology, neuroscience, philosophy, and psychology. I grew up in Reseda, California, as the youngest in a family of six. I have one older brother, two older sisters, and, most importantly, three cats.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring high school, I tried my best to get involved as much as I could. I played volleyball at the varsity level, and I participated in a program called Student’s Run Los Angeles (SRLA), which essentially trains high schoolers to run the Los Angeles Marathon. With SRLA, I’ve successfully completed two marathons throughout high school. Outside of sports, I was a Teacher’s Assistant for most of high school, tutoring and lecturing in topics ranging from Algebra I to Calculus. Additionally, I gained experience in leading and organizing lessons, classwork, and events, as the Student Government President in my senior year. I also worked as a SAT tutor, creating lessons and going through practice tests with my friends. Instead of just taking AP classes to challenge myself, I also took dual enrollment courses in various disciplines. In doing so, I learned the California community college system and helped my peers complete their general education requirements early to save time and money while in college. Not only was this a practical solution for my peers, but I also helped many of them reignite their curiosity and find the subjects that inspire them! Lastly, I was a volunteer at a nearby hospital once a week, which reaffirmed my desire to help people and become a physician.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my spare time, I often find myself listening to music whenever I can. My playlist is usually filled with Taylor Swift, Kendrick Lamar, Olivia Rodrigo, and The Weeknd. I try to fit music into my day to brighten my mood, especially by enjoying piano or violin versions of my favorite songs while studying or working. Finally, if you ever need an ice cream flavor recommendation, I’m definitely your guy because I used to be an ice cream scooper. (\u003cem\u003eP.S. Coffee Chocolate Chip is the way to go!)\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"acrQUSbI7vnr01I2PEUoC7ep00WI6JBr02a02IKYHd00DS00Q","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI graduated with thirteen associate degrees, which is something I’m really proud of! It wasn’t about chasing a number but about diving deep into subjects I’m passionate about and continuously challenging myself.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e9ff97a4-8adb-48d0-bd99-a2ae59cb7091\"}"},{"__ref":"Favorites:{\"uuid\":\"cd066642-b584-472d-9cd3-b4ae0828da8b\"}"},{"__ref":"Favorites:{\"uuid\":\"095f6f59-dc3a-444d-b013-c4c63bf94775\"}"}],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cdfe2b5b-3a13-45fb-86dc-bd4397ac88e1\"}"},{"__ref":"DeepDives:{\"uuid\":\"726783b5-b340-4036-8237-94eb4092ce8b\"}"},{"__ref":"DeepDives:{\"uuid\":\"5d7905be-abe7-4a3f-aef3-9703afb392
