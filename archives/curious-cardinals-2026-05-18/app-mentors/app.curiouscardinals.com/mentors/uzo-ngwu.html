xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c46cc906-038f-4b7e-aa0e-574a7cbfd37a\"}":{"__typename":"DeepDives","uuid":"c46cc906-038f-4b7e-aa0e-574a7cbfd37a","content":"\u003cp\u003eI'm deeply invested in lifting as I climb and passing along information that'll help those coming after me. I also know from personal experience that sometimes all people need to actualize their full potential is a push in the right direction or a voice to say \"I believe in you.\" I hope to be that push and that voice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d470554f-490d-4af3-a916-2fc2e1397eb2\"}":{"__typename":"DeepDives","uuid":"d470554f-490d-4af3-a916-2fc2e1397eb2","content":"\u003cp\u003eThe simple answer is to be a film director, but the more expansive answer is to occupy a role that allows me to tell compelling stories and express my creativity fully and authentically.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a149d38d-489f-409f-8e6b-d39fd2b6288e\"}":{"__typename":"DeepDives","uuid":"a149d38d-489f-409f-8e6b-d39fd2b6288e","content":"\u003cp\u003eI recently created an animated short film called \"Fairies in the Grass\" that was based on a poem I wrote about how I used to search for fairies in the grass when I was a kid.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"8638dfd9-a0a0-4438-9d14-e6dabff35227\"}":{"__typename":"DeepDives","uuid":"8638dfd9-a0a0-4438-9d14-e6dabff35227","content":"\u003cp\u003eI was your typical overachiever. I was a theatre, band, choir and speech \u0026amp; debate kid. I loved to act, sing and be the center of attention (I still do).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"dfb59006-9415-4915-85fe-dee59e8ad181\"}":{"__typename":"School","uuid":"dfb59006-9415-4915-85fe-dee59e8ad181","name":"Apple Valley High School","city":"Apple Valley","type":"HIGH","state":"Minnesota","country":"United States","zip":"55124"},"Education:{\"uuid\":\"f7815ced-7115-4ab2-b5b1-b11431f70716\"}":{"__typename":"Education","uuid":"f7815ced-7115-4ab2-b5b1-b11431f70716","school":{"__ref":"School:{\"uuid\":\"dfb59006-9415-4915-85fe-dee59e8ad181\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"1d6ab459-5e04-4857-bdfe-5ef7f8bdf0f2\"}":{"__typename":"Education","uuid":"1d6ab459-5e04-4857-bdfe-5ef7f8bdf0f2","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Art, Film and Visual Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"94588c2e-9799-40b3-8b66-db6e1677f223\"}":{"__typename":"MentorPublicProfile","uuid":"94588c2e-9799-40b3-8b66-db6e1677f223","displayName":"Uzo N.","slug":"uzo-ngwu","biography":"\u003cp\u003eHello and welcome to my profile! My name is Uzo and I'm a Nigerian-American multidisciplinary artist from Minnesota. This past spring I graduated from Harvard College with high honors with a degree in Art, Film and Visual Studies. I also took classes at Berklee College of Music as part of the Harvard-Berklee dual degree program.\u003cbr\u003e\u003cbr\u003eAs an AFVS major, I've taken classes ranging from documentary and narrative filmmaking to photography to animation to drawing and painting to screenwriting. Throughout my time at Harvard, I have been the President of an acapella group (The Harvard LowKeys\u003cem\u003e)\u003c/em\u003e, played the Witch in Harvard's production of \u003cem\u003eInto the Woods\u003c/em\u003e, was a member of multiple affinity groups (Nigerian Students Association, Association of Black Harvard Women, Women in Business) and helped found a digital art and design organization with my friends called Harvard Design Collective. \u003cbr\u003e\u003cbr\u003eMy senior year was spent studying abroad in Paris, France at Paris College of Art where I studied film art and fine art. There I took classes ranging from filmmaking to fashion to printmaking. The absolute highlight of my year abroad was the open mics I frequented each weekend. \u003cbr\u003e\u003cbr\u003eI have since returned home and am now spending my time directing and producing an animated short film centered around my Nigerian heritage with the support of the Harvardwood Artist Launch fellowship. I also spend my time working on various freelance illustration projects, and in the past I've worked with clients such as Hulu, VH1 and MTV. \u003cbr\u003e\u003cbr\u003eAdditionally, I enjoy journaling each day, reading fantasy novels and learning how to crochet. I look forward to connecting with students and guiding them as they discover or nurture their creative voice.\u003cbr\u003e\u003cbr\u003eFor more information about my work, check out www.uzongwu.com.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Art, Film and Visual Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c46cc906-038f-4b7e-aa0e-574a7cbfd37a\"}"},{"__ref":"DeepDives:{\"uuid\":\"d470554f-490d-4af3-a916-2fc2e1397eb2\"}"},{"__ref":"DeepDives:{\"uuid\":\"a149d38d-489f-409f-8e6b-d39fd2b6288e\"}"},{"__ref":"DeepDives:{\"uuid\":\"8638dfd9-a0a0-4438-9d14-e6dabff35227\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7cce98cc-5573-421d-a024-4599ee1e0df3/-/preview/-/format/jpg/","https://ucarecdn.com/b3eac44a-3298-49a8-b258-416b45c2dfc5/-/preview/-/format/jpg/","https://ucarecdn.com/1a3e6966-1f45-44c4-9aab-994b9d3f6f22/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f7815ced-7115-4ab2-b5b1-b11431f70716\"}"},{"__ref":"Education:{\"uuid\":\"1d6ab459-5e04-4857-bdfe-5ef7f8bdf0f2\"}"}],"hiredAt":"2023-09-18T23:23:53.712Z","topics":[],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"uzo-ngwu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"94588c2e-9799-40b3-8b66-db6e1677f223\"}"}}},"_sentryTraceData":"f14c444463ee49dba05f5b4752c82481-b0f10656f4a78620-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128
