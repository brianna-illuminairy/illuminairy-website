js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b4f6b92d-5ffa-437b-b8bf-eb4c7a1ad9aa\"}":{"__typename":"DeepDives","uuid":"b4f6b92d-5ffa-437b-b8bf-eb4c7a1ad9aa","content":"\u003cp\u003eI find computer science really interesting because of how interconnected it is! I originally chose CS because I wanted an interdisciplinary college major and I knew data, a big part of computer science, could represent all kinds of things - DNA, maps, populations, even writing. I also had some experience with computers as a kid - I don't play video games much anymore, but I started when I was around 10 and so by high school I was tinkering with making apps, games, and machine learning models. In my bio I mentioned graphs- which are a key part of computational theory- as a prime example of how interconnected comp sci is, and just to list a few examples, it can model things like economic entities and transactions, even atoms and bonds, or stars in the sky - if you get creative, you can see them anywhere!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"6c30ff7d-81e8-43db-84c0-f9902c7a981c\"}":{"__typename":"DeepDives","uuid":"6c30ff7d-81e8-43db-84c0-f9902c7a981c","content":"\u003cp\u003eIf I could tell my middle or high school self anything, it'd be that it's not over. Graduation isn’t the end. You just keep learning! I used to think I knew myself pretty well, so things wouldn’t really change. But in high school I met people who saw things in me that I didn’t, and the same thing happened again in college. You think you’ve got it all figured out when you’re younger, but the truth is you keep changing, and there’s always more to figure out about yourself and about the world, and that especially becomes clear when you move to a new environment. So keep your mind sharp! There’s so much out there and even if you don't know what's next continue looking and you might even find something new that excites you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"f0c03825-e0fa-498d-bfcc-ac63a395c5b9\"}":{"__typename":"DeepDives","uuid":"f0c03825-e0fa-498d-bfcc-ac63a395c5b9","content":"\u003cp\u003eI’d say my biggest role model was probably my high school math teacher... Words won't do him justice. A lot of my earlier math teachers treated math like a manual; \"Just follow the steps,\" they said. I've never liked being someone who follows steps without understanding why.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBut my calculus teacher made learning feel exciting. He'd have such an engaging tone and every time we learned a new concept; He'd tell it like a story, build up suspense, then go “OOH” once we made the connection for why that concept was important. If a student made a connection, he'd let them keep one of his cute toys like an Albert Einstein figure and sometimes he'd draw this funny dinosaur on the board made of the letters M, M, and S (standing for math-makes-sense). It was a little ridiculous and the class always laughed at it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHe saw that I had a deep interest in math, so after class he'd expose me to concepts like number theory and discrete math to prime my interest further. We'd bond about math - he directed me to Wikipedia article and historical books about it. I'm grateful that he took the time to get to know me personally.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost of all, he he wanted his students to be strong in other areas of life. He was also a coach and encouraged us to be good athletes, speakers, and people in general. He was definitely one of the most inspiring people I've met.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"09ea9b7b-2272-43e3-9dfe-bc2bbdc0491f\"}":{"__typename":"DeepDives","uuid":"09ea9b7b-2272-43e3-9dfe-bc2bbdc0491f","content":"\u003cp\u003eI think something I’m really proud of is staying persistent through difficult and uncertain times. There have been periods in my life, like when my family was dealing with serious health issues, where it felt hard to focus on the future. I wasn’t sure if planning for college or setting long-term goals even made sense. But I’m proud of myself for continuing to work hard anyway. It might sound simple, but putting in effort when things feel unstable takes a lot of strength. A lot of the time, we work hard because we expect it to lead somewhere. For me, it wasn’t always clear where it would lead, but I kept going. And if my mentee were going through uncertainty too, I’d be proud of them just for pushing through, and I hope to be there for them so they have someone to tell them they're not looking at a dead end. I want my mentee to try their best, but they don’t need to have the highest achievement or the most impressive project. What matters most is their choice to keep going despite the challenges. That kind of persistence means a lot.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"e1ae1847-2fc2-4edc-9aef-389623b11377\"}":{"__typename":"School","uuid":"e1ae1847-2fc2-4edc-9aef-389623b11377","name":"Pacifica High School","city":"Oxnard","type":"HIGH","state":"California","country":"United States","zip":"93036"},"Education:{\"uuid\":\"471b17c6-913c-49fc-b8c0-e6d9634e8fd7\"}":{"__typename":"Education","uuid":"471b17c6-913c-49fc-b8c0-e6d9634e8fd7","school":{"__ref":"School:{\"uuid\":\"e1ae1847-2fc2-4edc-9aef-389623b11377\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"d19e0892-f788-43db-aba4-43573ed6da54\"}":{"__typename":"Education","uuid":"d19e0892-f788-43db-aba4-43573ed6da54","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"0a14faea-3aa4-4d13-8c9b-ee75515c8566\"}":{"__typename":"MentorPublicProfile","uuid":"0a14faea-3aa4-4d13-8c9b-ee75515c8566","displayName":"Keagan J.","slug":"keagan-jon","biography":"\u003cp\u003eHi! My name is Keagan Aromin, and I'm a Filipino American student at UC Berkeley studying Computer Science.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the most interesting things about computational theory to me is how ideas across many different fields can be represented with a graph: a data structure made up of nodes linked by lines. Think social networks, decision flow charts, or even city maps -- People, outcomes, and locations can all be modeled with a graph! I chose CS because of its broad applications, from data structures like graphs to product design and graphics, and I like how endlessly connected it is to other fields!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen it comes to college extracurriculars, I'm a bit of a nomad - I've been a part of cultural organizations, a design club, and a few dance clubs. I have also worked on a few software projects including an education platform for junior Berkeley administrators, a file sharing platform for producers, and I’m currently helping develop a marketplace site for a business-to-business XR startup!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I like playing volleyball and tennis for fun, learning dances, running, watching movies, and traveling wherever I can afford to. I’m also learning how to cook right now and I recently realized I’m really into thriller and action shows.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m a student with a solid work ethic and strong time management skills. I’ve had many mentors throughout my life, including older siblings, my high school math teacher, and even my “bigs” in some of my clubs. I really look up to them, and my mission as a mentor is to pass on the favor to someone younger. By providing guidance in my mentee’s career aspirations, passing on knowledge in my areas of expertise, and discussing and providing frameworks for exciting projects, I hope to help my mentee grow while being as involved and encouraging as possible!\u003c/p\u003e","teachingVideoPlaybackId":"cLh01GlcvrkRZyK9DjWiBpRzOPeL5302lvOadZlzOOVdI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b4f6b92d-5ffa-437b-b8bf-eb4c7a1ad9aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"6c30ff7d-81e8-43db-84c0-f9902c7a981c\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0c03825-e0fa-498d-bfcc-ac63a395c5b9\"}"},{"__ref":"DeepDives:{\"uuid\":\"09ea9b7b-2272-43e3-9dfe-bc2bbdc0491f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/05afba60-931c-429d-a31a-d8a3ec362abc/-/preview/-/format/jpg/","https://ucarecdn.com/a4f9e16b-5d78-4e72-8a36-33f52e6ce34f/-/preview/-/format/jpg/","https://ucarecdn.com/0223c93f-60a3-4df0-bc1f-0f755e5db9b8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"471b17c6-913c-49fc-b8c0-e6d9634e8fd7\"}"},{"__ref":"Education:{\"uuid\":\"d19e0892-f788-43db-aba4-43573ed6da54\"}"}],"hiredAt":"2025-05-29T16:17:31.617Z","topics":["Coding / Programming","Web Design","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/9a4c114f-3114-4d6c-908a-b4d35953934d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"keagan-jon\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0a14faea-3aa4-4d13-8c9b-ee75515c8566\"}"}}},"_sentryTraceData":"fbacf2c39ee14dc1975917423d021ba0-8abbaa3b578671ea-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=fbacf2c39ee14dc1975917423d021ba0,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"keagan-jon"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(win
