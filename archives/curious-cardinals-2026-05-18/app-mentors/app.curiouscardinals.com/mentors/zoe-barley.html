xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4d0aafda-f2a9-4239-ae93-ba0718df3885\"}":{"__typename":"Favorites","uuid":"4d0aafda-f2a9-4239-ae93-ba0718df3885","photoUrl":"https://ucarecdn.com/ac139b5e-d00d-45d0-833e-bb91fbdafe5d/","title":"Mamma Mia!","type":"MOVIE"},"Favorites:{\"uuid\":\"62edca6a-41a9-413d-8e89-92372bdace68\"}":{"__typename":"Favorites","uuid":"62edca6a-41a9-413d-8e89-92372bdace68","photoUrl":"https://ucarecdn.com/cc60c560-fae6-46f6-a6f0-07e8ec1eec92/","title":"ilona maher","type":"ATHLETE"},"Favorites:{\"uuid\":\"9ec3a408-dd1b-46d6-a4d0-4dc0524c756c\"}":{"__typename":"Favorites","uuid":"9ec3a408-dd1b-46d6-a4d0-4dc0524c756c","photoUrl":"https://ucarecdn.com/0b6afae7-a819-43f9-b304-ba3ee72dab02/","title":"The Goldfinch! (this changes daily! follow me on goodreads!)","type":"BOOK"},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"2120fd4d-8ee0-44ed-9922-f43541445807\"}":{"__typename":"DeepDives","uuid":"2120fd4d-8ee0-44ed-9922-f43541445807","content":"\u003cp\u003eAs a middle and high school student I was a very involved and dedicated student! I was a competitive dancer who trained upwards of 30 hours a week, but despite this big time commitment I aimed to maintain a strong network of friends \u0026amp; family, and stay involved with my community at school. \u003c/p\u003e\u003cp\u003e\u003cbr\u003eI have always been an extroverted and fun loving person who is happiest when spending time with people I love - this was true throughout middle and high school, but at times I did find myself struggling to balance all my commitments and understand how stressful it can be to have high standards throughout your youth. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also loved (and still do love) reading and writing both for pleasure and for school! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"216aec1d-4d2c-41d1-a8d9-2ba46f0071ff\"}":{"__typename":"DeepDives","uuid":"216aec1d-4d2c-41d1-a8d9-2ba46f0071ff","content":"\u003cp\u003eI chose this question because it is nearly impossible for me to pick just one! So I'll give one answer for my personal life and one answer for my professional life. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy personal role model is my mama! I am an only child and have always been incredibly close to her. She has shown me how to be a strong woman and balance family life and a successful career. I hope to one day be half the woman she is! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy professional role model is my high school counselor, Wendy. She helped me through countless decisions and meaningful transitions throughout high school in terms of both my academic and social life. I hope to return to school and get my Master's of Education with a focus in School Counseling so I can pay forward all the gifts she gave me! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"581614ff-c54c-4f61-97cd-27bde5c61a05\"}":{"__typename":"DeepDives","uuid":"581614ff-c54c-4f61-97cd-27bde5c61a05","content":"\u003cp\u003eI started college as a Dance Major - it was one of the few things I felt confident that I was good at, and frankly I was far too indecisive to try to pick one academic topic to dive into! Dance felt like a great way to not have to do so. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eHowever, after a year of studying dance in a conservatory style program, I found that I had lost much of my love for it and that I wasn't being academically stimulated in the ways that I crave. I was in a pretty bad place both mentally and physically so I decided to move home the summer after my freshman year and re-evaluate. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am very lucky to have grown up in a college town, and therefore I was able to take classes at our local university while living at home and getting my feet back under me. Just as I was starting to feel ready to return to school full time, the COVID-19 pandemic hit. While initially I was devastated that I couldn't move forward as I had initially planned - this ended up being a blessing in disguise for me. During COVID I was able to take many classes in a wide variety of subjects and ended up falling in love with Psychology and Gender Studies. \u003cbr\u003e\u003cbr\u003eIn December of 2020, I decided to transfer schools a second time and applied to a number of colleges which allowed me to pursue a degree in Psychology, had a robust Gender Studies program, and offered dance classes! I felt so fortunate to be accepted to Stanford and absolutely loved getting to finish out my nontraditional college journey on The Farm :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"d36633c5-a6aa-42de-9e3c-62ea7204c8b7\"}":{"__typename":"DeepDives","uuid":"d36633c5-a6aa-42de-9e3c-62ea7204c8b7","content":"\u003cp\u003eI firmly believe that young people have the power to change the world and should chase what they are passionate about with excitement and joy! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver the past seven years I have worked at the Rotary Youth Leadership Awards, a leadership camp which takes place year summer in Estes Park, CO. Without fail, it is my favorite week of the year. Getting to hear about the accomplishments of these high schoolers and help them understand how to overcome the challenges they are facing fulfills me beyond belief. I always say that camp counselor Zoë is the best version of Zoë and I'm constantly striving to find ways to make the RYLA magic show up in my everyday life. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship is something that every young person deserves access to and being able to provide this service for young folks through Curious Cardinals is something I am deeply looking forward to! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"85d9b5a9-d1d4-49a5-bf8d-d00aca6a1436\"}":{"__typename":"School","uuid":"85d9b5a9-d1d4-49a5-bf8d-d00aca6a1436","name":"Fairview High School","city":"Boulder","type":"HIGH","state":"Colorado","country":"United States","zip":"80305"},"Education:{\"uuid\":\"f38b2ece-960d-4326-819f-1173b3a9c903\"}":{"__typename":"Education","uuid":"f38b2ece-960d-4326-819f-1173b3a9c903","school":{"__ref":"School:{\"uuid\":\"85d9b5a9-d1d4-49a5-bf8d-d00aca6a1436\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"1efd8dae-135c-4c4e-828a-fc7b03df0570\"}":{"__typename":"Education","uuid":"1efd8dae-135c-4c4e-828a-fc7b03df0570","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2023","major":"Psychology","degree":null},"Testimonial:d432b07c-2dcb-441d-8c31-d5703ef18a90":{"__typename":"Testimonial","id":"d432b07c-2dcb-441d-8c31-d5703ef18a90","text":"Zoe brought energy, creativity and confidence to an 8 year old who was struggling with reading and writing. Zoe’s care, energy and passion are amazing gifts to everyone.","date":"2025-05-29 21:50:16.916+00","rating":5,"endorser":{"__typename":"Endorser","name":"Amanda Richardson","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"cad4af38-40d2-418a-a3e2-290455f4c9a9\"}":{"__typename":"MentorPublicProfile","uuid":"cad4af38-40d2-418a-a3e2-290455f4c9a9","displayName":"Zoe B.","slug":"zoe-barley","biography":"\u003cp\u003eHowdy, it's nice to meet you! My name is Zoë, and I am thrilled to be a part of your learning journey. I currently work for a food rescue organization, where I contribute to tackling climate change and hunger by keeping surplus food out of landfills and redirecting it to community members in need. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI live in the beautiful Boulder, CO and take full advantage of our blue skies and glorious mountains whenever I can. You'll often find me outside trail running, reading, hanging with my partner and friends, or simply soaking up the sun. I love to practice yoga, rock climb, camp, pet dogs, and explore local coffee shops. Beyond this, I am a semi-professional dancer and arts educator - which is a fancy way of saying that I spend a lot of time dancing in my kitchen while making dinner each night :)\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I hold a B.A. in Psychology with a minor in Feminist, Gender, and Sexuality Studies from Stanford University, where I graduated in 2023. My academic journey was uniquely shaped by transferring colleges twice (what can I say, I love filling out the Common App). Transferring was one of the best decisions of my life and also helped me build a lot of empathy for students navigating uncertainty along their pathways. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe that two minds are always better than one and subsequently love to work collaboratively with the students I tutor. I bring high energy, enthusiasm, and passion to every session, serving as both your academic cheerleader and emotional support as you work toward your goals. I’m a big nerd at heart and thrive on learning alongside my students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can’t wait to help you achieve your goals and make learning a fun and rewarding experience!\u003c/p\u003e","teachingVideoPlaybackId":"TNkLLnkqa00m00pQ38eSRrTRTT6qHjflLNZlQ00B002DhrI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4d0aafda-f2a9-4239-ae93-ba0718df3885\"}"},{"__ref":"Favorites:{\"uuid\":\"62edca6a-41a9-413d-8e89-92372bdace68\"}"},{"__ref":"Favorites:{\"uuid\":\"9ec3a408-dd1b-46d6-a4d0-4dc0524c756c\"}"}],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2120fd4d-8ee0-44ed-9922-f43541445807\"}"},{"__ref":"DeepDives:{\"uuid\":\"216aec1d-4d2c-41d1-a8d9-2ba46f0071ff\"}"},{"__ref":"DeepDives:{\"uuid\":\"581614ff-c54c-4f61-97cd-27bde5c61a05\"}"},{"__ref":"DeepDives:{\"uuid\":\"d36633c5-a6aa-42de-9e3c-62ea7204c8b7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b104b3bc-3c4f-484d-b9a0-b2fffec8df79/-/preview/-/format/jpg/","https://ucarecdn.com/a0b0dca2-0cc2-46dd-8336-b601b00f422d/-/preview/-/format/jpg/","https://ucarecdn.com/feb55d5f-b8df-46a1-ae69-52dde7a4c7a7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f38b2ece-960d-4326-819f-1173b3a9c903\"}"},{"__ref":"Education:{\"uuid\":\"1efd8dae-135c-4c4e-828a-fc7b03df0570\"}"}],"hiredAt":"2024-11-22T20:42:31.361Z","topic
