xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"40c1b77f-4b12-47b8-9b9e-2b30b86fa21a\"}":{"__typename":"Favorites","uuid":"40c1b77f-4b12-47b8-9b9e-2b30b86fa21a","photoUrl":"https://ucarecdn.com/0a5f67b1-1034-42c9-80e5-cae87a7f10e9/","title":"Americanah by Chimamanda Ngozi Adichie","type":"BOOK"},"Favorites:{\"uuid\":\"7ded5183-a6f2-421c-88b9-797d74341590\"}":{"__typename":"Favorites","uuid":"7ded5183-a6f2-421c-88b9-797d74341590","photoUrl":"https://ucarecdn.com/5b9a4904-6b55-4567-815f-0d0e873aded9/","title":"Barcelona, Spain","type":"CITY"},"Favorites:{\"uuid\":\"544d6663-4d17-488a-9800-4315a5ac0757\"}":{"__typename":"Favorites","uuid":"544d6663-4d17-488a-9800-4315a5ac0757","photoUrl":"https://ucarecdn.com/1bd263af-453d-4b9d-b9d6-1415ac2a7226/","title":"DAUGHTER by Beyonce","type":"SONG"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d075bf54-a4bd-4f08-aa33-c1ecb6a2daba\"}":{"__typename":"DeepDives","uuid":"d075bf54-a4bd-4f08-aa33-c1ecb6a2daba","content":"\u003cp\u003eRecently, I have been playing a lot of tennis and pickle ball! There are available courts near my house and I love going over there with either a friend or my mom. My goal is to eventually beat my mom in pickle ball! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"38dab342-8d85-4369-a10b-57658953ea58\"}":{"__typename":"DeepDives","uuid":"38dab342-8d85-4369-a10b-57658953ea58","content":"\u003cp\u003eIn high school I spent my summers as a  scooper at my favorite local ice cream shop in Brooklyn. It was always so fun chatting with the various customers and my co-workers. Plus, there was always free ice cream and toppings at the end of my shfit! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"e47543a6-90ec-4228-a74f-d9661aa49f45\"}":{"__typename":"DeepDives","uuid":"e47543a6-90ec-4228-a74f-d9661aa49f45","content":"\u003cp\u003eMy greatest source of motivation is envisioning what I can become. There are so many opportunities, jobs, and experiences I want to involve myself in and I am excited to partake in. Even if some don't always work out, I have at least tried to become something I have always wanted to! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"954923f8-f537-4a9c-8d7f-aad9fe90e0e5\"}":{"__typename":"DeepDives","uuid":"954923f8-f537-4a9c-8d7f-aad9fe90e0e5","content":"\u003cp\u003eI would tell myself to focus on one thing at a time. In High School, I found myself stressing about the smallest things (and sometimes still do!) but if remind myself to do one thing at a time and write down a to do a list it becomes so much more manageable. I am able to see what I have accomplished and what still needs to be done! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"daa069bd-25de-448f-8cc8-d3873d03c32f\"}":{"__typename":"Education","uuid":"daa069bd-25de-448f-8cc8-d3873d03c32f","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Social Policy and Global Health ","degree":"Bachelor of Science "},"School:{\"uuid\":\"66730aa8-703c-4112-ade3-a66ff04c3ed5\"}":{"__typename":"School","uuid":"66730aa8-703c-4112-ade3-a66ff04c3ed5","name":"M479 Beacon High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10036"},"Education:{\"uuid\":\"d61bb778-1e5c-43dc-886c-f75ee1ab9628\"}":{"__typename":"Education","uuid":"d61bb778-1e5c-43dc-886c-f75ee1ab9628","school":{"__ref":"School:{\"uuid\":\"66730aa8-703c-4112-ade3-a66ff04c3ed5\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"93106d2c-1105-42e1-a125-60f44074c089\"}":{"__typename":"MentorPublicProfile","uuid":"93106d2c-1105-42e1-a125-60f44074c089","displayName":"Paloma J.","slug":"paloma-jourdes","biography":"\u003cp\u003eHey there! It’s nice to meet you!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name Paloma and I am a Junior at Northwestern studying Social Policy, Global Health, and Data Science with R. I was born and raised in Brooklyn, New York but grew up in a multicultural and trilingual household. I am half French and half Puerto Rican and speak French, Spanish, and English.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis summer I worked with a non-profit that exposed humanitarian causes through artistic means.\u0026nbsp; I am \u003c/p\u003e\u003cp\u003epassionate about leveraging creative means like public art installations, short documentary films, and immersive performances to address social and political challenges. I am excited to help students understand how to confront social problems and how to create unique and meaningful change!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Northwestern, I am actively involved in various campus activities. I am part of AO Productions, where I help organize and execute events that bring singers, bands, comedians, and actors to the student body.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have always loved to be active and surrounded by friends. In high school I was on swim team and when I got to Northwestern I knew I wanted to continue being part of an athletic team. Since arriving at Northwestern, I have been part of Triathlon club and was elected to be part of the Leadership Board in my Freshman year. I have completed three Olympic distance triathlons in the past two years. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe that it is critical to have a school, social, and extracurricular balance and I want to help students achieve the same thing!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince middle school I have always enjoyed working with kids of various ages. During COVID, I volunteered as a tutor to help Elementary school students in algebra and ELA subjects. Throughout high school and college I have worked as a part time babysitter for families who have kids in elementary and middle school.\u0026nbsp; I have helped them with homework as well as supporting them through their extracurriculars and hobbies. \u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurious and passionate, I love to explore new cuisines, travel abroad, spend time with friends and family, cook elaborate yet comforting meals, run in my local park, and read memoirs and novels.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am looking forward to working together in finding fun, creative, and alternative ways to learn and understand familiar and unfamiliar topics!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"7lcSkSGSZ3G4m1uxef3qQWv01v8H01W6Qsnstl7028wU14","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"40c1b77f-4b12-47b8-9b9e-2b30b86fa21a\"}"},{"__ref":"Favorites:{\"uuid\":\"7ded5183-a6f2-421c-88b9-797d74341590\"}"},{"__ref":"Favorites:{\"uuid\":\"544d6663-4d17-488a-9800-4315a5ac0757\"}"}],"causesSupported":[],"major":"Social Policy and Global Health ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d075bf54-a4bd-4f08-aa33-c1ecb6a2daba\"}"},{"__ref":"DeepDives:{\"uuid\":\"38dab342-8d85-4369-a10b-57658953ea58\"}"},{"__ref":"DeepDives:{\"uuid\":\"e47543a6-90ec-4228-a74f-d9661aa49f45\"}"},{"__ref":"DeepDives:{\"uuid\":\"954923f8-f537-4a9c-8d7f-aad9fe90e0e5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cab5f41f-8ea5-42f2-a1f8-7449476014b5/-/preview/-/format/jpg/","https://ucarecdn.com/de6658de-56fe-41d6-93ff-9a42b853bd4c/-/preview/-/format/jpg/","https://ucarecdn.com/60ca0f0e-5679-4e56-9d7c-43be9ef4b4dd/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"daa069bd-25de-448f-8cc8-d3873d03c32f\"}"},{"__ref":"Education:{\"uuid\":\"d61bb778-1e5c-43dc-886c-f75ee1ab9628\"}"}],"hiredAt":"2024-08-01T22:53:26.837Z","topics":["Reading","K-5 Grade Math","Pre-Algebra","Spanish","French","Writing","College Essay Writing","Academic Coaching","Executive Function","Global Health","Statistics","Journalism","6-8 Grade Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"paloma-jourdes\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"93106d2c-1105-42e1-a125-60f44074c089\"}"}}},"_sentryTraceData":"934f405c59484151bcad8e
