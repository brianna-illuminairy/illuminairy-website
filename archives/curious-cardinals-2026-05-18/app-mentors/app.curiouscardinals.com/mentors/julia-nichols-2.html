xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1b022148-9d04-42db-a50a-26999c8dbf8e\"}":{"__typename":"Favorites","uuid":"1b022148-9d04-42db-a50a-26999c8dbf8e","photoUrl":"https://ucarecdn.com/f36959ee-5ea4-4d88-a7eb-0103cb043db3/","title":"Gracie Abrams","type":"ARTIST"},"Favorites:{\"uuid\":\"513f5107-95dd-42fd-a3ed-540644692d7c\"}":{"__typename":"Favorites","uuid":"513f5107-95dd-42fd-a3ed-540644692d7c","photoUrl":"https://ucarecdn.com/ce3dd337-936d-4812-b6a9-0f50b53bce9c/","title":"Allyson Felix","type":"ATHLETE"},"Favorites:{\"uuid\":\"75f9f6a5-997b-4bc2-8c42-f7d23177e756\"}":{"__typename":"Favorites","uuid":"75f9f6a5-997b-4bc2-8c42-f7d23177e756","photoUrl":"https://ucarecdn.com/bd4f9021-792b-4475-b1ff-2d6d7946cb20/","title":"Fomula 1","type":"SPORT"},"CausesSupported:{\"uuid\":\"26fffb8c-bb8d-4661-b38b-23bc972ae751\"}":{"__typename":"CausesSupported","uuid":"26fffb8c-bb8d-4661-b38b-23bc972ae751","name":"Jacksonville Speech and Hearing Center","description":"\u003cp\u003eThis is especially meaningful because my brother has a cochlear implant.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/22ae7272-699e-4a26-b789-a71e26c3f865/"},"CausesSupported:{\"uuid\":\"6de17696-10d1-49f4-8758-0aa0aef6a699\"}":{"__typename":"CausesSupported","uuid":"6de17696-10d1-49f4-8758-0aa0aef6a699","name":"Allison Brundick Haramis Foundation","description":"\u003cp\u003eThe first nonprofit I ever volunteered for starting in fourth grade. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/e36b07a3-0b0b-4c3b-922d-d70b2d97b3e1/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3bff6d7d-56d9-4456-be40-524f00d81a04\"}":{"__typename":"DeepDives","uuid":"3bff6d7d-56d9-4456-be40-524f00d81a04","content":"\u003cp\u003e\u003cstrong\u003e\"Everyone you meet is fighting a battle you know nothing about. Be kind, always.\"\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e~Anonymous\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c855206c-0c8b-4906-bd0e-7c6cfcbdb892\"}":{"__typename":"DeepDives","uuid":"c855206c-0c8b-4906-bd0e-7c6cfcbdb892","content":null,"videoPlaybackId":"L7VZkImHtLQi01GL0102faQKYbyWtoLsgJSlMAbW8VdJgA","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ee5562ec-7cf3-4327-8bb5-ebedb74538f6\"}":{"__typename":"DeepDives","uuid":"ee5562ec-7cf3-4327-8bb5-ebedb74538f6","content":"\u003cp\u003eMrs. Drew Haramis is someone I look to as an inspiring role model. She is one of those people who brightens every room she walks into, giving out hugs and hellos. In the face of tragedy, she made the brave decision to press on and do good, serving as a beacon of hope in the community. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eHer teenage daughter, Allison, was killed in a car accident in 2009. In order to carry on Allison’s legacy, Mr. and Mrs. Haramis founded Angels for Allison, a non-profit organization that alleviates the financial burden of funeral costs for families suffering with the loss of a child. Through Angels for Allison, Mrs. Haramis has been able to empathize with parents who have also lost a child. She transformed her grief into a force for good. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMrs. Haramis has always valued giving back, but after she lost Allison, she made it an even greater priority. She believes in the power of teaching children to learn to give back, which is how she’s personally impacted me. Angels for Allison is one of the few organizations that lets children of all ages volunteer. I was in third grade the first time I served at Angels for Allison, and it instilled a love of volunteering in me. While I didn’t understand the importance of the organization’s mission in elementary school, I understood that I was able to help Mrs. Haramis make a difference and that her pain was serving a purpose, which made a lasting impression. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5cd3f8d3-95c5-410e-9543-30a375c3f9d6\"}":{"__typename":"DeepDives","uuid":"5cd3f8d3-95c5-410e-9543-30a375c3f9d6","content":null,"videoPlaybackId":"rQw2fzDhL2l6abhGK7qtpBOCroq9n9D82100qNV8rdcI","question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"cc2f8ae9-7d56-4a91-9830-a7c4b2b911c5\"}":{"__typename":"Education","uuid":"cc2f8ae9-7d56-4a91-9830-a7c4b2b911c5","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Journalism","degree":null},"School:{\"uuid\":\"d7a8fec8-da20-4630-afcc-b28681c95a6b\"}":{"__typename":"School","uuid":"d7a8fec8-da20-4630-afcc-b28681c95a6b","name":"St. Johns Country Day School","city":"Orange Park","type":"HIGH","state":"Florida","country":"United States","zip":"32073"},"Education:{\"uuid\":\"1309ce3d-f93f-4ed4-9389-7c0ad51f837c\"}":{"__typename":"Education","uuid":"1309ce3d-f93f-4ed4-9389-7c0ad51f837c","school":{"__ref":"School:{\"uuid\":\"d7a8fec8-da20-4630-afcc-b28681c95a6b\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"Testimonial:d92fa7b3-6b6e-43ee-9f23-06ee223c2359":{"__typename":"Testimonial","id":"d92fa7b3-6b6e-43ee-9f23-06ee223c2359","text":"Julia was an incredible mentor to my daughter, Bethany, as she prepared for the AP Language exam. She stepped in with a thoughtful and strategic preparation plan, dedicating significant time to helping Bethany understand the technical expectations, grading her practice essays, and explaining what it would take to truly shine on the exam. Julia’s coaching and encouragement were key in building Bethany’s confidence. We are incredibly grateful for her mentorship and support.","date":"2025-05-31 06:23:28.362+00","rating":5,"endorser":{"__typename":"Endorser","name":"Deb Liu","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"248dd816-abe2-4d0c-915c-c6b058d1443d\"}":{"__typename":"MentorPublicProfile","uuid":"248dd816-abe2-4d0c-915c-c6b058d1443d","displayName":"Julia N.","slug":"julia-nichols-2","biography":"\u003cp\u003eHello! I’m Jules, and I studied journalism and psychology at Northwestern University.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI now work on the Curious Cardinals team full-time, supporting our community, but here’s a look at the journey that brought me here.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated at the top of my class in high school and maintained that momentum through college, earning Dean’s List honors each term. I love learning and helping others learn, whether through traditional academic guidance, supporting passion projects, or helping students perfect their college applications. Encouraging students to achieve their dreams is a top priority for me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to learning, I’m passionate about photography. I first picked up a camera in elementary school, capturing moments while bored on the sidelines of my younger brother’s soccer games. One of those early photos made it onto our holiday card, sparking my love for photography. That passion led to elective classes, a life-changing National Geographic Student Expedition to Portugal, a high school fellowship, and other opportunities. At Northwestern, I photographed everything from photojournalism to fine art, with a focus on dance and performance. I love capturing people in their element—whether it’s my brother racing go-karts at Daytona International Speedway, shadowing wedding photographers, or creating cover art for Northwestern’s fashion magazine, STITCH.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’d love to find your student’s sideline moment, helping cultivate a passion that can grow just as mine has. I also enjoy applying creativity to purposeful work, like my role on the executive board of \u003cem\u003eIf You’re Reading This\u003c/em\u003e, a nonprofit at Northwestern focused on reducing the stigma around mental health by sharing personal stories. This work blends my interests in psychology and mental health with photography, allowing me to use my talents to support a cause I believe in.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI strive to put meaningful content into the world, both personally and professionally. During my marketing internship at Deloitte, I contributed to the Team Deloitte Olympic athlete campaign and helped brainstorm plans for major events like COP28 and the One Young World Summit. My marketing and communications experience has shown me the power of elevating ideas to create real impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was born in Atlanta, Georgia, and raised in Jacksonville, Florida. I appreciate life’s little moments, like the peach hues of sunrise and sunset, the lyrics of sweet songs, flowers, and dairy-free cupcakes. I love deep conversations, dancing in the rain, singing off-key, taking scenic car rides, and being outdoors—especially boating and enjoying the beach.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to connecting with your curious cardinal, tapping into their potential, and inspiring growth.\u003c/p\u003e","teachingVideoPlaybackId":"ULQL009gPYjbYiDtwPjrrh8uRr3TYt028yfAcHWuzQ6Tk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I’m most proud of is seeing my mentees succeed. Watching them grow and accomplish their goals is incredibly rewarding. A standout experience was working with a student named Marlon in the Curious Cardinals Financial Aid Program. We collaborated on a photo essay to raise awareness about gentrification, and seeing him develop his creative voice and bring such an important issue to light was amazing. It’s moments like these, where I can help someone else thrive, that make me most proud.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"1b022148-9d04-42db-a50a-26999c8dbf8e\"}"},{"__ref":"Favorites:{\"uuid\":\"513f5107-95dd-42fd-a3ed-540644692d7c\"}"},{"__ref":"Favorites:{\"uuid\":\"75f9f6a5-997b-4bc2-8c42-f7d23177e756\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"26fffb8c-bb8d-4661-b38b-23bc972ae751\"}"},{"__ref":"CausesSupported:{\"uuid\":\"6de17696-10d1-49f4-8758-0aa0aef6a699\"}"}],"major":"Journalism","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3bff6d7d-56d9-4456-be40-524f00d81a04\"}"},{"__ref":"DeepDives:{\"uuid\":\"c855206c-0c8b-4906-bd0e-7c6cfcbdb892\"}"},{"__ref":"DeepDives:{\"uuid\":\"ee5562
