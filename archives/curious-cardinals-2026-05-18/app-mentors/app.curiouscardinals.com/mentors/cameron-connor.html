DeepDives","uuid":"a4b5240b-167a-4140-8eaf-984a44a2cbaa","content":"\u003cp\u003eAvoid distractions, but never get bored. Always be chasing your best self.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"3119ab0d-2742-4616-a3c1-28bee301266d\"}":{"__typename":"DeepDives","uuid":"3119ab0d-2742-4616-a3c1-28bee301266d","content":"\u003cp\u003eCoaching and mentorship has been a passion of mine for years now, and I gain fulfillment from bringing out the best in others. Now that I'm in college, it's more difficult to coach athletic teams and stay in relation with people I used to mentor back home, but I found that this is a great way for me to continue my love for coaching even when I'm somewhere else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a15c34bf-0a52-46bf-b73f-eb20303d368f\"}":{"__typename":"DeepDives","uuid":"a15c34bf-0a52-46bf-b73f-eb20303d368f","content":"\u003cp\u003eEvery breath of mine is a privilege and a gift. I should be living a very different life right now, potentially half as long. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a11fb9f8-2f71-4767-b643-9c202fe49ae5\"}":{"__typename":"DeepDives","uuid":"a11fb9f8-2f71-4767-b643-9c202fe49ae5","content":"\u003cp\u003eFor me, it's a source of ultimate fulfillment, and it pushes me to be a better version of myself. The better I am, the more wisdom I can pass down to younger generations later on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"25737837-6306-4339-88b4-c2485f79722b\"}":{"__typename":"School","uuid":"25737837-6306-4339-88b4-c2485f79722b","name":"Valor Christian High School","city":"Highlands Ranch","type":"HIGH","state":"Colorado","country":"United States","zip":"80126"},"Education:{\"uuid\":\"b9fbd2ac-4c98-433b-8459-bfcafc665ddf\"}":{"__typename":"Education","uuid":"b9fbd2ac-4c98-433b-8459-bfcafc665ddf","school":{"__ref":"School:{\"uuid\":\"25737837-6306-4339-88b4-c2485f79722b\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"1cce98d5-f3de-4954-878a-da3c214802c5\"}":{"__typename":"School","uuid":"1cce98d5-f3de-4954-878a-da3c214802c5","name":"Southern Methodist University","city":"Dallas","type":"COLLEGE","state":"Texas","country":"United States","zip":"75205"},"Education:{\"uuid\":\"a52f28ad-5ed9-4599-9778-5b15b5109c82\"}":{"__typename":"Education","uuid":"a52f28ad-5ed9-4599-9778-5b15b5109c82","school":{"__ref":"School:{\"uuid\":\"1cce98d5-f3de-4954-878a-da3c214802c5\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Finance","degree":null},"MentorPublicProfile:{\"uuid\":\"d8485dc6-0fc2-4956-aa9c-094fe6b61b3d\"}":{"__typename":"MentorPublicProfile","uuid":"d8485dc6-0fc2-4956-aa9c-094fe6b61b3d","displayName":"Cameron C.","slug":"cameron-connor","biography":"\u003cp\u003eCameron Connor, who recently completed his freshman year at Southern Methodist University, is pursuing a major in Finance with a minor in Sport Performance Leadership. Originally from Denver, Colorado, some of his interests are basketball, business, and coaching.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor over five years, Cam has passionately coached youth sports teams, motivated by his love for community service and athletics. His impressive track record includes losing only one game during his four-year tenure as a flag football coach and securing high placements while coaching in several competitive youth basketball tournaments.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTwo years ago, he embarked on a mission trip to Guatemala and Honduras. There, he contributed to building houses, providing food and resources to remote villages, and building friendships with many locals. One of the trip's challenges was communicating solely in Spanish for the entire eighteen days, even with fellow team members.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCam is also a five-time recipient of the Carson Scholarship, a prestigious national award recognizing individuals who demonstrate excellence in community service and academics. The fund, established by Dr. Ben Carson, a renowned neurosurgeon and politician, has allowed Cameron the privilege of meeting both Dr. Carson and a childhood hero, Dr. Bennet Omalu, at the scholarship ceremony.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHis commitment to community service is deeply personal, stemming from a life-changing open-heart surgery he underwent at two years old at the Children's Hospital. This experience has enabled him to see the unique potential in every kid, similar to the unexpected abilities he has discovered in himself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCameron is an avid sports enthusiast, with a particular passion for basketball and football. Aside from sports, he enjoys engaging in deeper discussions that foster relationships. Aspiring to be more than just a tutor, Cameron aims to be a role model and a support system for children striving to reach their fullest potential. He looks forward to the opportunity to get to know aspiring students and their families, helping them navigate their paths to success, both academically and personally.\u003c/p\u003e","teachingVideoPlaybackId":"UImD3eQ84Yj3S5bcfCb4xX1qhWJNNJ67DEZSgZOwXz4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"052e1b10-4f58-4fd2-8f61-fe255fedfb50\"}"},{"__ref":"Favorites:{\"uuid\":\"cc33e7cd-a656-4deb-a8bb-3aaa7f669e78\"}"},{"__ref":"Favorites:{\"uuid\":\"0732519f-d5da-45ad-8b5d-34ac17be22c7\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8404d1d9-6e02-46ba-a6ea-1385acd506fe\"}"},{"__ref":"CausesSupported:{\"uuid\":\"d1c55375-a95d-4a12-9384-60506014c57e\"}"}],"major":"Finance","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a4b5240b-167a-4140-8eaf-984a44a2cbaa\"}"},{"__ref":"DeepDives:{\"uuid\":\"3119ab0d-2742-4616-a3c1-28bee301266d\"}"},{"__ref":"DeepDives:{\"uuid\":\"a15c34bf-0a52-46bf-b73f-eb20303d368f\"}"},{"__ref":"DeepDives:{\"uuid\":\"a11fb9f8-2f71-4767-b643-9c202fe49ae5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ab46353e-a169-4aa1-9322-cecc44d0e594/-/preview/-/format/jpg/","https://ucarecdn.com/7322450d-9659-4e0e-b40b-475c8aa5ebc8/-/preview/-/format/jpg/","https://ucarecdn.com/dc6af376-7821-4f75-a54b-2163b188906f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b9fbd2ac-4c98-433b-8459-bfcafc665ddf\"}"},{"__ref":"Education:{\"uuid\":\"a52f28ad-5ed9-4599-9778-5b15b5109c82\"}"}],"hiredAt":"2024-06-15T05:04:49.104Z","topics":["Business / Entrepreneurship","Economics","Finance / Investing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"cameron-connor\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d8485dc6-0fc2-4956-aa9c-094fe6b61b3d\"}"}}},"_sentryTraceData":"9b743484387345d79024b3c95157b8f1-abd9f4197d933ee6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb6
