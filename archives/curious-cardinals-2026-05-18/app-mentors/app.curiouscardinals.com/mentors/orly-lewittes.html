xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"75dbb9ed-d751-487f-a110-ee51382345c0\"}":{"__typename":"Favorites","uuid":"75dbb9ed-d751-487f-a110-ee51382345c0","photoUrl":"https://ucarecdn.com/a9f105cf-34e7-467b-9f8e-847cf39a3068/","title":"Kristen Wiig","type":"ACTOR"},"Favorites:{\"uuid\":\"fc0ce5e0-44eb-48be-8063-013742c3376e\"}":{"__typename":"Favorites","uuid":"fc0ce5e0-44eb-48be-8063-013742c3376e","photoUrl":"https://ucarecdn.com/b22f1654-7224-4a5d-beac-1f59dc02f257/","title":"Bananagrams","type":"GAME"},"Favorites:{\"uuid\":\"23d9eadb-b3a6-41e1-b000-c89d1c4484db\"}":{"__typename":"Favorites","uuid":"23d9eadb-b3a6-41e1-b000-c89d1c4484db","photoUrl":"https://ucarecdn.com/7233e416-8dda-4b21-9b6e-aaded0e5616e/","title":"New York City","type":"CITY"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"28f98ec5-343b-4496-a2e2-f68d324b9787\"}":{"__typename":"DeepDives","uuid":"28f98ec5-343b-4496-a2e2-f68d324b9787","content":"\u003cp\u003eHaving been passionate about writing since before I could properly hold a pencil, I spent my high school summers primarily attending writing programs! My favorites were a creative writing intensive at Bard College, a film writing course at The School of The New York Times, and the Cherubs program at Northwestern University, which prepared me to study screenwriting at Northwestern. I also spent one summer living on a sailboat on the ocean, where I earned my scuba certification! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"898b8137-8f4f-4f64-a3d0-a9b9297a993f\"}":{"__typename":"DeepDives","uuid":"898b8137-8f4f-4f64-a3d0-a9b9297a993f","content":"\u003cp\u003eI am extremely proud of my year spent directing Mee-Ow Comedy, Northwestern's premier improv and sketch comedy group. In Mee-Ow's 50th year, I led the group as we endured four hour per day writers room sessions for a span of eight weeks and put up two shows, each with four sold out performances! As exhausting as the process felt, it was equally exhilarating and rewarding to lead the group to a super successful point. The pride I felt watching packed audiences laugh at all of our hard work was unmatched!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d4ad4fef-b63b-4194-b2c3-ff72179e4a74\"}":{"__typename":"DeepDives","uuid":"d4ad4fef-b63b-4194-b2c3-ff72179e4a74","content":"\u003cp\u003eI love to cook in my spare time! As a busy college student, my days can often be stressful; I look forward to coming home, popping on some music, and making myself dinner. Some of my specialties include hand rolled pasta, steak, and and homemade sushi! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"bd3ca199-c0bf-4a5c-b1f9-824b770c0b6a\"}":{"__typename":"DeepDives","uuid":"bd3ca199-c0bf-4a5c-b1f9-824b770c0b6a","content":"\u003cp\u003eWhen I first arrived at Northwestern, I had many dreams of pursuing comedy, but was quickly intimidated by the competitive and daunting nature of Northwestern's comedy landscape. It was only thanks to a select few older students who chose to be kind to me, and teach me what they had already learned, that I was ultimately able to enter the comedy scene with real confidence. Even as a senior, those same people still function as my mentors as I prepare to enter the even scarier post college world! I've felt so much gratitude for those individuals, that I have craved becoming that guiding force for younger people, too. I'm so excited that Curious Cardinals is awarding me the opportunity to mentor more students with whom I seek to form longtime relationships. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"07b4278b-80c7-4085-bc8c-dd188c16519f\"}":{"__typename":"Education","uuid":"07b4278b-80c7-4085-bc8c-dd188c16519f","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Radio/TV/Film","degree":null},"School:{\"uuid\":\"1ab65370-5ce6-429b-9789-b25aa3bded10\"}":{"__typename":"School","uuid":"1ab65370-5ce6-429b-9789-b25aa3bded10","name":"Highland Park High School","city":"Highland Park","type":"HIGH","state":"Illinois","country":"United States","zip":"60035"},"Education:{\"uuid\":\"3bd26731-9adb-4f9b-968c-ca08af0d6204\"}":{"__typename":"Education","uuid":"3bd26731-9adb-4f9b-968c-ca08af0d6204","school":{"__ref":"School:{\"uuid\":\"1ab65370-5ce6-429b-9789-b25aa3bded10\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"8c14c04b-16a7-46d9-84c2-6c8e08af40cb\"}":{"__typename":"MentorPublicProfile","uuid":"8c14c04b-16a7-46d9-84c2-6c8e08af40cb","displayName":"Orly L.","slug":"orly-lewittes","biography":"\u003cp\u003eOrly is a senior at Northwestern University studying Radio/TV/Film and U.S. History. Since before entering college, Orly has been extremely passionate about comedy and first performed stand up at age fourteen. At Northwestern, Orly spends her non-class time in numerous student groups. Most notably, she serves as the head writer, director, and general cast member of Mee-Ow Comedy, the nation's oldest student run sketch and improv group with notable alumni including Seth Meyers, Julia Louis-Dreyfus, Ana Gasteyer, Kristen Schaal, Dermot Mulroney, and others. She also performs with The Bix Musical Improv and writes for Northwestern Sketch Television, Northwestern's College Emmy award-winning filmed comedy show. Independently, Orly's feature screenplay, Strut, has won multiple awards in professional screenwriting competitions, and her short screenplay, Bat Zilla, sits in the top 4% of projects on an international screenwriting database.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAside from her creative work, Orly has interned for a number of TV/Film production companies such as Kelly Ripa's Milojo Productions, and Rob Reiner's Castle Rock Entertainment. For years, Orly has also worked as a private essay coach, helping students get into their top choice universities (including Northwestern, USC, U of Michigan, and Kellogg School of Management at Northwestern).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHaving grown up as the youngest of three siblings, Orly understands the value in having dedicated role models. As a young adult, she looks for mentorship opportunities wherever she can. Orly's knack for creativity and love for storytelling help her connect with people of all ages, and she hopes to distribute the ability to tell stories to younger students. She cherishes any opportunity to guide others in sharing their own narratives, whether it be through leading performance troupes or aiding students along their individual writing processes. Orly can't wait to hear your story!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my greatest achievements to date was watching my short screenplay, Bat Zilla, reach number 2 on an international ranking of comedy shorts on a platform which houses thousands of competitions. As a young writer, seeing that others have read and enjoyed my work - regardless of whether that recognition comes with prize money or not (it did not) - felt unbelievable.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"75dbb9ed-d751-487f-a110-ee51382345c0\"}"},{"__ref":"Favorites:{\"uuid\":\"fc0ce5e0-44eb-48be-8063-013742c3376e\"}"},{"__ref":"Favorites:{\"uuid\":\"23d9eadb-b3a6-41e1-b000-c89d1c4484db\"}"}],"causesSupported":[],"major":"Radio/TV/Film","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"28f98ec5-343b-4496-a2e2-f68d324b9787\"}"},{"__ref":"DeepDives:{\"uuid\":\"898b8137-8f4f-4f64-a3d0-a9b9297a993f\"}"},{"__ref":"DeepDives:{\"uuid\":\"d4ad4fef-b63b-4194-b2c3-ff72179e4a74\"}"},{"__ref":"DeepDives:{\"uuid\":\"bd3ca199-c0bf-4a5c-b1f9-824b770c0b6a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/231a9e66-669a-47d9-a1c9-19fc7ba46bc3/-/preview/-/format/jpg/","https://ucarecdn.com/a1f4a435-66ab-4ba1-a1ae-1122b6917449/-/preview/-/format/jpg/","https://ucarecdn.com/6c5a6174-3f60-4e07-b885-b94c9c53d4f0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"07b4278b-80c7-4085-bc8c-dd188c16519f\"}"},{"__ref":"Education:{\"uuid\":\"3bd26731-9adb-4f9b-968c-ca08af0d6204\"}"}],"hiredAt":"2024-04-15T17:49:49.654Z","topics":["Film / Theater","Creative Writing","Writing","College Essay Writing"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"orly-lewittes\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8c14c04b-16a7-46d9-84c2-6c8e08af40cb\"}"}}},"_sentryTraceData":"651df5a7179d4716890fca0e0a92ce0a-a42eb15accc6971b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=651df5a7179d4716890fca0e0a92ce0a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"orly-lewittes"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
