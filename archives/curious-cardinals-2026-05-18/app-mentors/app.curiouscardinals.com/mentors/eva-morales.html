xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3f047fab-c82f-49a0-a7f6-a0725c92548b\"}":{"__typename":"Favorites","uuid":"3f047fab-c82f-49a0-a7f6-a0725c92548b","photoUrl":"https://ucarecdn.com/e6640ecc-e540-48cf-af60-5fbdd43df74a/","title":"The Secret History","type":"BOOK"},"Favorites:{\"uuid\":\"58015df2-b098-4a97-9ec6-88255f8ef6d0\"}":{"__typename":"Favorites","uuid":"58015df2-b098-4a97-9ec6-88255f8ef6d0","photoUrl":"https://ucarecdn.com/83367c30-0f5d-4181-88c8-506721dae17f/","title":"Kyoto","type":"CITY"},"Favorites:{\"uuid\":\"45f7f75b-3639-45c4-81bc-051ae50304be\"}":{"__typename":"Favorites","uuid":"45f7f75b-3639-45c4-81bc-051ae50304be","photoUrl":"https://ucarecdn.com/827b6f8c-096f-4686-9527-2e72629542ff/","title":"Parachutes - Coldplay","type":"ALBUM"},"CausesSupported:{\"uuid\":\"f46025f4-2dd9-4392-a05b-42387a0503fa\"}":{"__typename":"CausesSupported","uuid":"f46025f4-2dd9-4392-a05b-42387a0503fa","name":"TOM","description":"","photoUrl":"https://ucarecdn.com/278f4398-c4df-4b5a-8294-cb800068ac7e/"},"CausesSupported:{\"uuid\":\"46b69d8a-a474-497e-bf35-39289a8f3565\"}":{"__typename":"CausesSupported","uuid":"46b69d8a-a474-497e-bf35-39289a8f3565","name":"Juanfe Foundation","description":"","photoUrl":"https://ucarecdn.com/2800c46a-1122-4f43-8026-5701e03eca44/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"0af5d12b-6a25-49e7-9657-3cb61660e79f\"}":{"__typename":"DeepDives","uuid":"0af5d12b-6a25-49e7-9657-3cb61660e79f","content":"\u003cp\u003eMy dream job is to manage a sustainable boutique hotel in Las Islas del Rosario, where I can merge my passion for hospitality, sustainability, and Colombia’s cultural richness. I imagine a place that not only offers unforgettable experiences to travelers but also uplifts local communities by showcasing Colombian artists, employing residents, and sourcing everything from food to furniture locally and ethically. I want the hotel to be a living story of Colombia’s beauty, resilience, and creativity, inviting guests to fall in love with our music, landscapes, and warmth while protecting the environment that makes it so special.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"e0c3bfa9-af44-4a3d-a38e-0e8d5a3bd43a\"}":{"__typename":"DeepDives","uuid":"e0c3bfa9-af44-4a3d-a38e-0e8d5a3bd43a","content":"\u003cp\u003eMy heritage and identity have taught me how to adapt, connect, and teach in a way that feels personal and flexible. Growing up between Colombia and the U.S. and studying in international schools exposed me to teachers from all over the world, places like Canada, the U.K., Mexico, the U.S., Colombia, and even Asia. Each had a different way of explaining, connecting, and challenging students, and I naturally picked up on what worked best for different types of learners. Traveling has deepened that even more. It’s shown me that learning is never one-size-fits-all. Some people need structure, others need storytelling; some thrive with repetition, others with visual cues or movement. I carry that cultural awareness and empathy into my teaching style, always looking for how you learn best, not just how I was taught.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"58941f57-1877-4f1a-a0e8-16fc2fd5aa9c\"}":{"__typename":"DeepDives","uuid":"58941f57-1877-4f1a-a0e8-16fc2fd5aa9c","content":"\u003cp\u003eI spent my high school summers exploring, learning, and giving back in ways that shaped who I am today. I had the chance to travel across Japan, Europe, the United States, and South America, which helped me better understand different cultures and ways of life. I interned at Estrategias Corporativas, a mergers and acquisitions advisory firm in Colombia, where I learned how to build company profiles and analyze financial data. I also dedicated time to service through the Juanfe Foundation, supporting teenage mothers, and through Cajitas de Amor, a nonprofit I co-founded to create care packages for children undergoing cancer treatment. I made sure to spend time with my family, especially during important and challenging moments, and stayed active by playing tennis and soccer. I also participated in TOM, Tikkun Olam Makers, helping develop practical projects for people with disabilities. My summers were a mix of purpose, curiosity, and connection, and each experience helped me grow in a different way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"430f6a65-787d-442a-8e72-edb73eb29074\"}":{"__typename":"DeepDives","uuid":"430f6a65-787d-442a-8e72-edb73eb29074","content":"\u003cp\u003eMentorship matters to me because it shaped who I am and how I show up for others. Growing up as the oldest sibling, I naturally stepped into a mentorship role. I helped my younger siblings navigate school, make decisions, and feel supported in everyday moments. It taught me patience, empathy, and the quiet power of being consistent for someone else.\u003c/p\u003e\u003cp\u003eAt the same time, I would not be at Penn today without the mentors who believed in me. From teachers who pushed me to think deeper and write with more clarity, to nonprofit leaders like Catalina Escobar, founder of the Juanfe Foundation, who showed me how to lead with both purpose and compassion, I learned how transformational mentorship can be.\u003c/p\u003e\u003cp\u003eMy parents were also my first mentors. They encouraged me to dream big, stay focused, and stay rooted in my values. Mentorship, for me, is about the cycle of giving and receiving. It is about recognizing potential in someone and helping them rise to meet it. That is the kind of mentor I strive to be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"1ce8ca04-1f38-4141-8fda-37c6538d3934\"}":{"__typename":"School","uuid":"1ce8ca04-1f38-4141-8fda-37c6538d3934","name":"Colegio Columbus School","city":"Envigado","type":"HIGH","state":"Antioquia","country":"Colombia","zip":"055420"},"Education:{\"uuid\":\"66efbc23-8451-4130-ae3a-8767fc9a7e2c\"}":{"__typename":"Education","uuid":"66efbc23-8451-4130-ae3a-8767fc9a7e2c","school":{"__ref":"School:{\"uuid\":\"1ce8ca04-1f38-4141-8fda-37c6538d3934\"}"},"startYear":"2013","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"04863b89-949f-4caf-abe4-9256822c411e\"}":{"__typename":"Education","uuid":"04863b89-949f-4caf-abe4-9256822c411e","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Finance, Marketing, and International Studies (Huntsman Program)","degree":null},"MentorPublicProfile:{\"uuid\":\"903b2934-060f-4d7f-80d2-dbd5012ab575\"}":{"__typename":"MentorPublicProfile","uuid":"903b2934-060f-4d7f-80d2-dbd5012ab575","displayName":"Eva M.","slug":"eva-morales","biography":"\u003cp\u003eHi! I’m Eva Morales, a student from Medellín, Colombia, the city of eternal spring! I'm a rising sophomore in the Huntsman Program at the University of Pennsylvania (College of Arts and Sciences + Wharton School), where I study International Studies and Business with a focus on Finance and Marketing.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI care deeply about mentorship, Latin America’s development, and making complex ideas feel human, relatable, and actionable.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBut I’m also just a person who loves blasting music, going on long walks with my two miniature dachshunds, reading for hours, spending time with my family, playing tennis, doing yoga and pilates, and going to the gym to clear my head.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in Medellín, going to boarding school in London, and now moving to the US, I’ve navigated different educational systems, responsibilities, and challenges. When my younger sister was diagnosed with cancer, I stepped in to care for my little brother at home while balancing school, leadership roles, and personal growth. That experience shaped how I show up: with empathy, clarity, and a fierce sense of purpose.\u003cbr\u003eI’m currently working with Atlantico, a venture capital firm in Brazil, where I’m co-authoring a report read by over 80,000 people and analyzing $100 million worth of startup opportunities across Latin America. I’ve interned in investment banking at Estrategias Corporativas, built ESG strategies for clients like CJ Foods and Mandarin Oriental, and co-led a documentary campaign with Educate Lanka in Sri Lanka.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond that, I lead Wharton Latino’s \u003cem\u003eEl Periódico\u003c/em\u003e publication, contribute to consulting and alumni engagement boards at Wharton, and founded \u003cem\u003eCajitas de Amor\u003c/em\u003e, a nonprofit delivering care packages to pediatric cancer patients in Colombia.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a tutor and mentor, I’m not just here to teach, I’m here to connect. I understand how hard it is to juggle expectations, doubt yourself, or feel lost in a subject that just isn’t clicking. My approach is human, structured, and filled with small confidence-building wins. Whether it’s economics, writing, college applications, history, or even organizing your ideas for a project, I’ll be your thought partner, accountability buddy, and your biggest cheerleader. Having worked with several tutors throughout my life, I know what support feels like when it works, and I do my best to pass that along.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe every student has a voice that matters and deserves to be heard and understood. If you’re looking for someone who will meet you where you are, and push you thoughtfully toward where you want to be, I’d love to work together.\u003c/p\u003e","teachingVideoPlaybackId":"Rq2aUo4IcW9sYd3TKexY8QatOZoCTnuLt27wC8wS00Rk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I am really proud of is leading national marketing for TOM, Tikkun Olam Makers, a global initiative that creates solutions for people with disabilities. I helped organize a Makeathon that brought together over 2000 attendees to develop accessible technologies for a more inclusive city. I led the sponsorship campaign, raising over 20,000 dollars to support the event, and worked alongside engineers, designers, and policy experts. Starting as a documenter and later stepping into a leadership role taught me how to turn purpose into action and bring people together to create lasting change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am equally proud of \u003cem\u003eCajitas de Amor\u003c/em\u003e, a nonprofit I co-founded to support children undergoing cancer treatment in Medellín. What started as a small idea inspired by my sister’s own battle with cancer has now reached over 300 children across Colombia. Each care package includes personalized gifts, educational tools, and comfort items designed to make the hospital experience feel less isolating. Seeing the smiles on those children's faces reminded me that small acts of love can ripple into something much greater. These two projects represent the heart of what I care about, building things that make life easier, kinder, and more human.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"3f047fab-c82f-49a0-a7f6-a0725c92548b\"}"},{"__ref":"Favorites:{\"uuid\":\"58015df2-b098-4a97-9ec6-88255f8ef6d0\"}"},{"__ref":"Favorites:{\"uuid\":\"45f7f75b-3639-45c4-81bc-051ae50304be\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"f46025f4-2dd9-4392-a05b-42387a0503fa\"}"},{"__ref":"CausesSupported:{\"uuid\":\"46b69d8a-a474-497e-bf35-39289a8f3565\"}"}],"major":"Finance, Marketing, and International Studies (Huntsman Program)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0af5d12b-6a25-49e7-9657-3cb61660e79f\"}"},{"__ref":"DeepDives:{\"uuid\":\"e0c3bfa9-af44-4a3d-a38e-0e8d5a3bd43a\"}"},{"__ref":"DeepDives:{\"uuid\":\"58941f57-1877-4f1a-a0e8-16fc2fd5aa9c\"}"},{"__ref":"DeepDives:{\"uuid\":\"430f6a65-787d-442a-8e72-edb73eb29074\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/302cb83b-7b18-4868-b0bc-126415f86970/-/preview/-/format/jpg/","https://ucarecdn.com/3521c78a-8bc1-4879-b114-b8737ba7eb1a/-/preview/-/format/jpg/","https://ucarecdn.com/e0f1988e-e339-4771-bdfb-a43712dfacb8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"66efbc23-8451-4130-ae3a-8767fc9a7e2c\"}"},{"__ref":"Education:{\"uuid\":\"04863b89-949f-4caf-abe4-9256822c411e\"}"}],"hiredAt":"2025-05-13T13:13:30.860Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Writing","Spanish","Academic Coaching","College Essay Writing","Reading","History","Creative Writing","History Project","Business / Entrepreneurship","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"eva-morales\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"903b2934-060f-4d7f-80d2-dbd5012ab575\"}"}}},"_sentryTraceData":"a9e5a44054364c2d9f934e3ba13f0a2b-a1c566f26395b242-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a9e5a44054364c2d9f934e3ba13f0a2b,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"eva-morales"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager
