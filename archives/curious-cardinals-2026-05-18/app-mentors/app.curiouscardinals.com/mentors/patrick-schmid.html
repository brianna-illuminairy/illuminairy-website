xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b0e1c02f-9c61-41ac-9ab1-450e0b0910d4\"}":{"__typename":"DeepDives","uuid":"b0e1c02f-9c61-41ac-9ab1-450e0b0910d4","content":"\u003cp\u003eMentorship matters to me because I struggled as a high school student. I was extremely stubborn (albeit maybe I still am), and lacked motivation both socially and academically. I was lucky to have a network of peer and adult mentors to help shape me into a person I am proud to be today, and look forward to the opportunity to do the same for another young student.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"174a0b35-f5a2-426f-8bbf-3def0758fab2\"}":{"__typename":"DeepDives","uuid":"174a0b35-f5a2-426f-8bbf-3def0758fab2","content":"\u003cp\u003eMy major choice is actually an interesting story. I initially applied to Northwestern as a history major. Yet, after advice from family and friends I took and Intro to Computer Science class my freshman fall after being too stubborn to take it in high school. Lo and behold I absolutely loved it, and immediately began taking classes in Computer Science and its related fields. It just so happened that my freshman year marked the creation of the Data Science major at Northwestern, and I applied on a whim and got it. It turned out to be the right decision for me, allowing me to blend the logical thinking I loved in programming with analytical skills I could apply in a multi-disciplinary capacity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"2f319bcf-259e-4dfe-96be-2bb0ab0b948f\"}":{"__typename":"School","uuid":"2f319bcf-259e-4dfe-96be-2bb0ab0b948f","name":"Colorado Academy","city":"Denver","type":"HIGH","state":"Colorado","country":"United States","zip":"80235"},"Education:{\"uuid\":\"63061cc3-d971-4ee7-9949-44edcc2ef47e\"}":{"__typename":"Education","uuid":"63061cc3-d971-4ee7-9949-44edcc2ef47e","school":{"__ref":"School:{\"uuid\":\"2f319bcf-259e-4dfe-96be-2bb0ab0b948f\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"2d247c3d-69cc-4852-82f2-bd4d18cf511a\"}":{"__typename":"Education","uuid":"2d247c3d-69cc-4852-82f2-bd4d18cf511a","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2ad2f203-7313-4646-9bcf-1e5ecdbab4f6\"}":{"__typename":"MentorPublicProfile","uuid":"2ad2f203-7313-4646-9bcf-1e5ecdbab4f6","displayName":"Patrick S.","slug":"patrick-schmid","biography":"\u003cp\u003eI am a current Senior at Northwestern University studying Data Science and Computer Science. Post-grad, I will be joining the Management Consultancy Insight2Profit as a Business Analyst. I have a strong academic and professional background in analytics and programming, yet also have a wide range of interests including graphic design, video game design, and historical study.\u003c/p
