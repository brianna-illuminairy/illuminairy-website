 your greatest source of motivation?"},"DeepDives:{\"uuid\":\"0251d187-5e25-4f70-b3ca-571f509819de\"}":{"__typename":"DeepDives","uuid":"0251d187-5e25-4f70-b3ca-571f509819de","content":"\u003cp\u003eMy greatest source of motivation is my twin sister. It helps me to see her working hard and striving to succeed. Having a companion to work through school with is a blessing and I am thankful to have someone pushing me along the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"9ca399cb-e914-48ef-bb67-eebc747bb50d\"}":{"__typename":"School","uuid":"9ca399cb-e914-48ef-bb67-eebc747bb50d","name":"Bronxville High School ","city":"Bronxville","type":"HIGH","state":"NY","country":"USA","zip":"10708"},"Education:{\"uuid\":\"edd11d05-5b21-493b-9b3d-869123b21c48\"}":{"__typename":"Education","uuid":"edd11d05-5b21-493b-9b3d-869123b21c48","school":{"__ref":"School:{\"uuid\":\"9ca399cb-e914-48ef-bb67-eebc747bb50d\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"a46bebba-9382-470e-8390-d759df5668c9\"}":{"__typename":"Education","uuid":"a46bebba-9382-470e-8390-d759df5668c9","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics \u0026 CS","degree":null},"MentorPublicProfile:{\"uuid\":\"d484eb3e-bf2a-432b-9e9a-a2daca2cfc3d\"}":{"__typename":"MentorPublicProfile","uuid":"d484eb3e-bf2a-432b-9e9a-a2daca2cfc3d","displayName":"Andrew W.","slug":"andrew-wilmott-1","biography":"\u003cp\u003eI am a student who genuinely enjoys learning and helping others build confidence in subjects that can feel intimidating at first. What I care about most is growth, both academic and personal. I believe that understanding comes from asking questions, breaking problems down, and being patient with yourself through the process. That mindset is what I try to bring into tutoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I spend most of my time focused on quantitative and problem solving based subjects. I enjoy working through material that requires logic, structure, and clear reasoning, and I like finding ways to explain those ideas in a way that actually makes sense to someone else. I think learning works best when it feels collaborative rather than stressful, and I aim to make sessions feel supportive instead of overwhelming.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of class, I stay very involved on campus. I am part of a project team where I work closely with others to build and analyze ideas from the ground up. That experience has taught me how to communicate clearly, work through confusion as a group, and adjust explanations based on who I am working with. I am also a member of a business fraternity, which has been a big part of how I spend my time. Through that, I have learned the importance of mentorship, accountability, and helping others succeed, especially those who are just getting started.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I try to keep a balanced life. I love sports and staying active, especially lacrosse and skiing. Being involved in athletics has taught me discipline, consistency, and how to push through challenges even when something does not come easily at first. I am also a big fan of music and enjoy artists like Coldplay, Dominic Fike, and Don Toliver. Music is something I use to unwind and reset, especially during busy weeks. I also follow Formula One closely and enjoy the mix of strategy, precision, and competition that comes with it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost importantly, I care a lot about my friends and the people around me. That carries over into tutoring. I want students to feel comfortable asking questions, making mistakes, and growing at their own pace. My goal as a tutor is not just to help someone get the right answer, but to help them understand how to think through problems on their own and feel more confident doing so.\u003c/p\u003e","teachingVideoPlaybackId":"i2ZaBoUVAMTjzthMXj4W5PkuBJNdrPIK4lXtRcK2JhI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement has been qualifying and competing in the sectional ski racing championship in New York State.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ed22e3b8-c558-4e1f-820c-5087ce6e3bb5\"}"},{"__ref":"Favorites:{\"uuid\":\"9d2af5ee-09e6-46d8-8cbb-a9580857b50c\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"35df9cb2-5cea-448e-91da-80a2f2161240\"}"}],"major":"Economics \u0026 CS","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bdb15d06-6cc8-4f5a-896b-383b6d30e838\"}"},{"__ref":"DeepDives:{\"uuid\":\"0251d187-5e25-4f70-b3ca-571f509819de\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dc25a665-6375-40ee-a5cf-58dace43ebe4/-/preview/-/format/jpg/","https://ucarecdn.com/deb9be1e-7c74-499a-9919-8c9c60d206d5/-/preview/-/format/jpg/","https://ucarecdn.com/66f66474-2bad-4d6e-9617-3fa08248b4ef/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"edd11d05-5b21-493b-9b3d-869123b21c48\"}"},{"__ref":"Education:{\"uuid\":\"a46bebba-9382-470e-8390-d759df5668c9\"}"}],"hiredAt":"2026-01-28T18:31:46.899Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Academic Coaching","Economics","Executive Function","K-6 Storybook","Business / Entrepreneurship","Finance / Investing"],"communityBadges":["https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/","https://ucarecdn.com/d7
