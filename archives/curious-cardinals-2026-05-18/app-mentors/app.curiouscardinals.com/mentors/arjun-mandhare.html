and I would love to one day start a fund/venture in the space.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e4042164-fcb7-4cd5-93e6-fb25995a09e6\"}":{"__typename":"DeepDives","uuid":"e4042164-fcb7-4cd5-93e6-fb25995a09e6","content":"\u003cp\u003eMy skillset is a combination of quantitative and qualitative, and I wanted to showcase that in my studies (Economics and Computer Science). I want to be able to approach problems from an economist's sense, but also be able to use logic and critical thinking skills that come from programming.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"ca7a7fcd-ecb0-4a30-b547-02bfa8fd2705\"}":{"__typename":"School","uuid":"ca7a7fcd-ecb0-4a30-b547-02bfa8fd2705","name":"Cary Academy","city":"Cary","type":"HIGH","state":"North Carolina","country":"United States","zip":"27513"},"Education:{\"uuid\":\"334a2992-fcc6-470f-91b8-e2c7e724a523\"}":{"__typename":"Education","uuid":"334a2992-fcc6-470f-91b8-e2c7e724a523","school":{"__ref":"School:{\"uuid\":\"ca7a7fcd-ecb0-4a30-b547-02bfa8fd2705\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"41d84732-c944-4681-aab4-9de497736b54\"}":{"__typename":"Education","uuid":"41d84732-c944-4681-aab4-9de497736b54","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expe
