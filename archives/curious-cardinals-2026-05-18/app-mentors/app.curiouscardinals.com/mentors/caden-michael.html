xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9fd8a2a1-0792-43ea-adf1-ffa831c526bb\"}":{"__typename":"Favorites","uuid":"9fd8a2a1-0792-43ea-adf1-ffa831c526bb","photoUrl":"https://ucarecdn.com/05f019a6-5e15-4f31-8d99-e282d48c2c40/","title":"First Love/Late Spring","type":"SONG"},"Favorites:{\"uuid\":\"3e960167-0dea-49ab-ae7c-79a19a4aaac6\"}":{"__typename":"Favorites","uuid":"3e960167-0dea-49ab-ae7c-79a19a4aaac6","photoUrl":"https://ucarecdn.com/ae8ce658-ddac-4b5b-bd04-db31c8519660/","title":"Budapest, Hungary","type":"CITY"},"Favorites:{\"uuid\":\"ab29c172-9a99-4d72-8ebf-6d65aadf9e56\"}":{"__typename":"Favorites","uuid":"ab29c172-9a99-4d72-8ebf-6d65aadf9e56","photoUrl":"https://ucarecdn.com/80c9445f-f626-4bef-bdfa-c2203c879951/","title":"The Secret History","type":"BOOK"},"CausesSupported:{\"uuid\":\"bbcb686d-83d1-4a91-a743-70b50dbe15cc\"}":{"__typename":"CausesSupported","uuid":"bbcb686d-83d1-4a91-a743-70b50dbe15cc","name":"United Nations","description":"\u003cp\u003eExecutive Board of United Nations Columbia\u003c/p\u003e","photoUrl":"https://ucarecdn.com/4aa05bb4-1c39-44b1-8048-e0fbe716c3ae/"},"CausesSupported:{\"uuid\":\"7808f62a-223d-44b8-a4a9-6c08ed5dbc3a\"}":{"__typename":"CausesSupported","uuid":"7808f62a-223d-44b8-a4a9-6c08ed5dbc3a","name":"#ICanHelp","description":"\u003cp\u003eDirector of Strategic Communications\u003c/p\u003e","photoUrl":"https://ucarecdn.com/42ade66a-cdef-42e9-9b7d-173c1a18abfd/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"9e14dc52-9ad7-4c40-9699-01f5f3e24ba0\"}":{"__typename":"DeepDives","uuid":"9e14dc52-9ad7-4c40-9699-01f5f3e24ba0","content":"\u003cp\u003eMy dream job would be the Director-General of the World Health Organization. In this job I could combine my passions in International Affairs with what will be my profession, medical science. I believe that to truly help people, we must improve upon entire systems, and address problems from the root. The scientists at universities have world-changing solutions that many would never even know about, and healthcare equity is far more achievable that most would imagine. It takes a leader to make all of these parts function together, not work against each other, and I hope that one day, I could be that leader.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1642e2b5-5693-4a27-a888-2252bbea39eb\"}":{"__typename":"DeepDives","uuid":"1642e2b5-5693-4a27-a888-2252bbea39eb","content":"\u003cp\u003eI would tell my high school self that it's okay for projects to start small, and I mean really small. It is okay if doing something you love means you are the only one who cares that you did it. A lot of what I did in high school felt somewhat pointless because its effects on the world were so small. Very few of the projects I completed ended up leading to bigger things, yet many of those projects are the ones that I was the most proud of. When you do what you love, things have a way of working out. I wouldn't want my younger self to be so worried all of the time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"45bbf42b-fdd9-45d2-a7ad-964f67119c33\"}":{"__typename":"DeepDives","uuid":"45bbf42b-fdd9-45d2-a7ad-964f67119c33","content":"\u003cp\u003eI was born in a military town which means that all throughout my childhood, friends would suddenly disappear to another state or even Germany or Korea. The military moved everyone around at random which meant that in my relationships to those around me, every minute of every day was something I had to hold on to. Now, as a mentor I really value making deep connections even when I know they are only temporary. My philosophy is that learning is most powerful when it is something that the student and mentor both love. If you are one of my students, we will grow together through academically challenging topics and big, hard-to-manage projects alike!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"03fa1db2-be95-4eed-bfb2-c8ed5af88300\"}":{"__typename":"School","uuid":"03fa1db2-be95-4eed-bfb2-c8ed5af88300","name":"Cumberland Polytechnic High School","city":"Fayetteville","type":"HIGH","state":"North Carolina","country":"United States","zip":"28303"},"Education:{\"uuid\":\"3001eefc-f62b-43c1-8678-4b80e548ad59\"}":{"__typename":"Education","uuid":"3001eefc-f62b-43c1-8678-4b80e548ad59","school":{"__ref":"School:{\"uuid\":\"03fa1db2-be95-4eed-bfb2-c8ed5af88300\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"654c680d-a5a6-40d7-951b-9090c583cade\"}":{"__typename":"Education","uuid":"654c680d-a5a6-40d7-951b-9090c583cade","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Medical Humanities","degree":null},"MentorPublicProfile:{\"uuid\":\"8e65150a-2bd5-4199-98d8-681923b6a0bb\"}":{"__typename":"MentorPublicProfile","uuid":"8e65150a-2bd5-4199-98d8-681923b6a0bb","displayName":"Caden K.","slug":"caden-michael","biography":"\u003cp\u003eThroughout high school I explored subjects in STEM including advanced mathematics as well as the humanities including subjects like philosophy, ethics, and literature. As someone who knew from a young age that I wanted to become a doctor, I made it a personal mission not to sacrifice my love of the liberal arts for the STEM courses that would take me to my career as a doctor. Because of this, I study Medical Humanities, a degree that involved a philosophical look on medicine, as well as comparative literature across two languages and cultures. In addition to this, I am very heavily involved in the United Nations, and I am on the executive board of UN Columbia. I hope to use my humanities centered education to serve humanity through public health policy. I have also done a good deal of activism to save humanities education in primary and secondary schools, projecting my voice through op-eds and speeches around the country. In my senior year of high school, an op-ed I published in a local paper was one of the top most read pieces of the year, and this led to me speaking at a national conference for educators on the topic. For me, it has always been about making my voice heard where my voice matters, and for the most part, this means starting local. Curiosity bears passion bears excellence, and I am someone who lives for the ride!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn my Junior year of high school, I worked as a psychometric tester, and I was exposed to the world of clinical psychology and medicine. When I stopped working as a psychometrist, I decided to make a YouTube video discussing the very concerning ways that I noticed discussion of mental health on social media was affecting the way that my patients viewed themselves. After this YouTube video was published, I was approached by the CEO of The Conversationalist to appear on an episode of POVz. I was able to get my message out to a good number of people from this episode, but then, to my utter surprise, the episode was featured on ABC News to thousands of viewers. I was just very excited that my small scale activism was able to make it so much further than I had ever hoped. It gave me confidence that our generation would not ignore the big issues that we find.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"9fd8a2a1-0792-43ea-adf1-ffa831c526bb\"}"},{"__ref":"Favorites:{\"uuid\":\"3e960167-0dea-49ab-ae7c-79a19a4aaac6\"}"},{"__ref":"Favorites:{\"uuid\":\"ab29c172-9a99-4d72-8ebf-6d65aadf9e56\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"bbcb686d-83d1-4a91-a743-70b50dbe15cc\"}"},{"__ref":"CausesSupported:{\"uuid\":\"7808f62a-223d-44b8-a4a9-6c08ed5dbc3a\"}"}],"major":"Medical Humanities","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9e14dc52-9ad7-4c40-9699-01f5f3e24ba0\"}"},{"__ref":"DeepDives:{\"uuid\":\"1642e2b5-5693-4a27-a888-2252bbea39eb\"}"},{"__ref":"DeepDives:{\"uuid\":\"45bbf42b-fdd9-45d2-a7ad-964f67119c33\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/919212b3-a298-49f8-bc12-1054facc52d0/-/preview/-/format/jpg/","https://ucarecdn.com/7363ba7c-ce75-4f71-8f40-1ac28eda0d6c/-/preview/-/format/jpg/","https://ucarecdn.com/e947dc25-6c0e-4983-bb4b-e3f52a81f94e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3001eefc-f62b-43c1-8678-4b80e548ad59\"}"},{"__ref":"Education:{\"uuid\":\"654c680d-a5a6-40d7-951b-9090c583cade\"}"}],"hiredAt":"2024-05-16T20:29:32.434Z","topics":["Creative Writing","History Project","Video / Photography","STEM Project","Public Speaking"],"communityBadg
