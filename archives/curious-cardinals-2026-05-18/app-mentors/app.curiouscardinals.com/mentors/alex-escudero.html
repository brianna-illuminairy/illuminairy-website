xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2d687863-ba7f-4dce-b5fa-19719e837e8b\"}":{"__typename":"DeepDives","uuid":"2d687863-ba7f-4dce-b5fa-19719e837e8b","content":"\u003cp\u003eI transitioned from product design to STS because I yearned for a deeper understanding of innovation. While product design gave me a solid foundation, I was hungry for more. STS blended design with science, communications, and anthropology, giving me a deeper understanding of how design fits into the bigger picture.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"0dd72028-e712-4da5-bfbb-9b8ee6f72cc5\"}":{"__typename":"DeepDives","uuid":"0dd72028-e712-4da5-bfbb-9b8ee6f72cc5","content":"\u003cp\u003eInspired by the mentors who shaped my own journey, I want to pay it forward by guiding others. I've always been a self-directed learner, taking on projects both inside and outside of school. Reflecting on my experiences, I realize the value of mentorship and am eager to offer that support to others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3de2dd0d-56f7-4976-a2e5-1ee813a31392\"}":{"__typename":"DeepDives","uuid":"3de2dd0d-56f7-4976-a2e5-1ee813a31392","content":"\u003cp\u003eDuring the COVID lockdown, my best friend and I founded Creator Tribe, a vibrant online community of college students working on passion projects. We hosted events, a podcast, and showcased our members' projects on Instagram. This led to exciting collaborations within our community and helped me meet people from all over the world!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"654c4ec4-2b66-4857-bb91-f0cafcd05c86\"}":{"__typename":"School","uuid":"654c4ec4-2b66-4857-bb91-f0cafcd05c86","name":"Los Gatos High School","city":"Los Gatos","type":"HIGH","state":"California","country":"United States","zip":"95030"},"Education:{\"uuid\":\"ee191026-b522-4aa0-9665-534053930d37\"}":{"__typename":"Education","uuid":"ee191026-b522-4aa0-9665-534053930d37","school":{"__ref":"School:{\"uuid\":\"654c4ec4-2b66-4857-bb91-f0cafcd05c86\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"15b6ccb0-6984-41b2-bb42-70d9c9540a77\"}":{"__typename":"Education","uuid":"15b6ccb0-6984-41b2-bb42-70d9c9540a77","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Science, Technology, and Society","degree":null},"MentorPublicProfile:{\"uuid\":\"136e1427-68b2-48ab-8590-d398247b9684\"}":{"__typename":"MentorPublicProfile","uuid":"136e1427-68b2-48ab-8590-d398247b9684","displayName":"Alex E.","slug":"alex-escudero","biography":"\u003cp\u003e🧩🌱🍏\u003c/p\u003e\u003cp\u003eHello there! I'm Alex, and I'm passionate about using design to empower creativity and create positive social impact. I love seeing young people's creativity blossom as they work on their own projects. I believe in the power of learning by doing, and I'm inspired by the transformative journey it can bring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated from Stanford in 2023 with a Bachelor of Science in Science, Technology, and Society, concentrating in Innovation and Organization. It was a comprehensive, interdisciplinary program that equipped me with a deep understanding of human-centered product design, sustainability, entrepreneurship, and technology ethics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was recognized for my product design work at Stanford, receiving awards and being nominated to speak at the STS graduation ceremony. Additionally, I was honored with the Stanford Award of Excellence for my active involvement in various extracurricular activities, including Stanford Wrestling, the BASES Entrepreneurship organization, serving as Design Chair of the Senior Cabinet, and acting as a peer advisor for my major.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I'm building my career in user experience (UX) design while also developing a mission-driven freelancing agency. My goal is to leverage bold, engaging design to amplify positive impact. I specialize in understanding user needs through empathy and bringing innovative ideas to life using compelling storytelling and visually stunning design.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've got a solid foundation in startups, business, and product design. This mix of skills lets me tackle a variety of projects and manage things from start to finish. \u003cem\u003e(hint: nothing is ever finished!)\u003c/em\u003e I'm excited to mentor students who are building their own products, projects, or businesses. I can also teach the fundamentals of product design to equip them with the skills needed to create amazing things. With my Stanford training, hands-on experience, and real-world know-how, I'll provide them with the tools and guidance necessary to \u003cstrong\u003econfidently\u003c/strong\u003e pursue their brilliant ideas and navigate the complexities of bringing them to fruition.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Science, Technology, and Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2d687863-ba7f-4dce-b5fa-19719e837e8b\"}"},{"__ref":"DeepDives:{\"uuid\":\"0dd72028-e712-4da5-bfbb-9b8ee6f72cc5\"}"},{"__ref":"DeepDives:{\"uuid\":\"3de2dd0d-56f7-4976-a2e5-1ee813a31392\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/57202566-106d-4359-baa1-2255a2ffacf7/-/preview/-/format/jpg/","https://ucarecdn.com/4d5c64da-5628-476e-949d-761415e24122/-/preview/-/format/jpg/","https://ucarecdn.com/6ddc1bc2-f8cb-4d3e-b156-1bd5cab5a34f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"ee191026-b522-4aa0-9665-534053930d37\"}"},{"__ref":"Education:{\"uuid\":\"15b6ccb0-6984-41b2-bb42-70d9c9540a77\"}"}],"hiredAt":"2024-08-19T10:59:02.171Z","topics":["Product Design","Web Design","Business / Entrepreneurship","Visual Arts / Graphic Design","Sustainability","Public Speaking","Executive Function","Academic Coaching"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alex-escudero\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"136e1427-68b2-48ab-8590-d398247b9684\"}"}}},"_sentryTraceData":"99e5be7ca4784b0d8988e90a20f6ad43-bf2fda803e5f40e2-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38
