xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6f907fb7-50b0-41c8-b89d-5065917da442\"}":{"__typename":"DeepDives","uuid":"6f907fb7-50b0-41c8-b89d-5065917da442","content":"\u003cp\u003eI decided to explore the intersection between biology and chemistry, my two favorite subjects in high school. By studying Molecular Biophysics \u0026amp; Biochemistry, I can develop a mechanistic understanding of how life works.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"fa8fc681-864c-4c4e-9d4a-01b9bcd8e126\"}":{"__typename":"DeepDives","uuid":"fa8fc681-864c-4c4e-9d4a-01b9bcd8e126","content":"\u003cp\u003eI enjoy picking up instruments at an introductory level, like piano and guitar. I'm also a big fan of competition reality TV; my favorites right now are The Traitors and Survivor!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a7266079-dcb0-4a5f-906a-6a8dfbfa1e4a\"}":{"__typename":"DeepDives","uuid":"a7266079-dcb0-4a5f-906a-6a8dfbfa1e4a","content":"\u003cp\u003eI would advise my high school self to be more confident about my abilities and look for more opportunities to apply them. Confidence can go a long way towards success!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"7934b236-a661-4c4a-949a-125bd298ca0f\"}":{"__typename":"DeepDives","uuid":"7934b236-a661-4c4a-949a-125bd298ca0f","content":"\u003cp\u003eThere are so many existing inequities in healthcare systems at the local, national, and global level. I hope to contribute in a meaningful way to improving equity in healthcare.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"71ce4396-68fb-4faa-88d5-d908060a48f6\"}":{"__typename":"School","uuid":"71ce4396-68fb-4faa-88d5-d908060a48f6","name":"Grassfield High School","city":"Chesapeake","type":"HIGH","state":"Virginia","country":"United States","zip":"23323"},"Education:{\"uuid\":\"7c611df9-64c4-4a10-82de-278a769fbbb6\"}":{"__typename":"Education","uuid":"7c611df9-64c4-4a10-82de-278a769fbbb6","school":{"__ref":"School:{\"uuid\":\"71ce4396-68fb-4faa-88d5-d908060a48f6\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"65c61822-b7de-4dc2-b5ba-76b9349b2e0b\"}":{"__typename":"Education","uuid":"65c61822-b7de-4dc2-b5ba-76b9349b2e0b","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Molecular Biophysics \u0026 Biochemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"00339ccd-eb31-4d3d-9733-9e965921bbe5\"}":{"__typename":"MentorPublicProfile","uuid":"00339ccd-eb31-4d3d-9733-9e965921bbe5","displayName":"Tiki K.","slug":"tiki-kazeem","biography":"\u003cp\u003eHi! I'm Tiki, and I’m a junior at Yale University studying Molecular Biophysics \u0026amp; Biochemistry on the pre-med track and pursuing a certificate in Global Health Studies. I'm so excited to help students grow their academic confidence!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAbout me:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I have:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWorked in research labs in molecular biology and immunology, acquiring skills in research technique, professional collaboration, and project design, and have presented my research at poster sessions and presentations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eVolunteered to help with the comfort and care of hospice patients\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLed orientation programs for first-year students\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAdvised younger students in peer mentorship programs\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBeen a literacy tutor for elementary-aged kids\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy academic interests lie at the intersection of medicine and public health.\u0026nbsp; I first realized my passion for public health as a high school student, and ever since, I’ve been exploring ways connect a biological understanding of disease with a socio-political understanding.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy specialization:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eMentoring K-12 students through -\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSubject guidance\u003c/strong\u003e (biology \u0026amp; chemistry at all grade levels)\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eCollege-readiness \u003c/strong\u003e(research experiences, internships, essay writing)\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eResearch mentorship \u003c/strong\u003e(project design, exploring where and how to present research)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePlanning a week-by-week roadmap to help you feel confident about reaching your goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInteractive and engaging subject-level guidance\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorming ways to connect your interests to tangible opportunities\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout my high school and college experience, I have taken on a variety of leadership roles, developing a keen sense of organization and attention to detail in the process. I am passionate about helping students build confidence in their skills, academic and beyond. I can break down challenging concepts in a manner that fosters engagement and a love of learning.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside of academics:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI love music! I sing in a jazz a cappella group, with which I have travelled domestically and internationally, performing for schools, retirement communities, and jazz clubs. I also play violin in a pops orchestra, where my favorite pieces to perform are musical numbers and movie soundtracks. Fittingly, in my free time, I love watching and performing in musical theatre shows. My favorite show right now is probably Hadestown!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you are interested in science, medicine, or health, I would love to work with you and help you turn your academic goals into reality!\u003c/p\u003e","teachingVideoPlaybackId":"nIczy02aW5E2ZTije01gk785xpWE00lDWE41GU5o1hXPqU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Molecular Biophysics \u0026 Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6f907fb7-50b0-41c8-b89d-5065917da442\"}"},{"__ref":"DeepDives:{\"uuid\":\"fa8fc681-864c-4c4e-9d4a-01b9bcd8e126\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7266079-dcb0-4a5f-906a-6a8dfbfa1e4a\"}"},{"__ref":"DeepDives:{\"uuid\":\"7934b236-a661-4c4a-949a-125bd298ca0f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5f753154-b4c5-471d-bf95-0a64845d8578/-/preview/-/format/jpg/","https://ucarecdn.com/e629ee0a-86bd-4a3b-b52a-4a02798a6193/-/preview/-/format/jpg/","https://ucarecdn.com/b32e6ac8-ff4e-491b-9a5c-38e8c54bbce3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7c611df9-64c4-4a10-82de-278a769fbbb6\"}"},{"__ref":"Education:{\"uuid\":\"65c61822-b7de-4dc2-b5ba-76b9349b2e0b\"}"}],"hiredAt":"2026-01-23T18:07:09.514Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Music","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tiki-kazeem\"}})":{"__ref":"Ment
