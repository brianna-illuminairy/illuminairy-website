xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0c29d1d6-307b-4aca-872d-a59a53e3caa5\"}":{"__typename":"Favorites","uuid":"0c29d1d6-307b-4aca-872d-a59a53e3caa5","photoUrl":"https://ucarecdn.com/0a300064-c702-4976-aace-eedea432a36f/","title":"The Book Thief","type":"BOOK"},"Favorites:{\"uuid\":\"d8bbb58c-9c20-40f2-85ae-3607b4ea7ed4\"}":{"__typename":"Favorites","uuid":"d8bbb58c-9c20-40f2-85ae-3607b4ea7ed4","photoUrl":"https://ucarecdn.com/0a300064-c702-4976-aace-eedea432a36f/","title":"Little Women","type":"MOVIE"},"Favorites:{\"uuid\":\"79826641-9a96-4491-8117-aba3d11b83ae\"}":{"__typename":"Favorites","uuid":"79826641-9a96-4491-8117-aba3d11b83ae","photoUrl":"https://ucarecdn.com/0a300064-c702-4976-aace-eedea432a36f/","title":"It's Called: Freefall","type":"SONG"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"87375d44-9f71-441a-a9cc-7d54a7e11c2f\"}":{"__typename":"DeepDives","uuid":"87375d44-9f71-441a-a9cc-7d54a7e11c2f","content":"\u003cp\u003eIt's cheesy, but my greatest role model really is my mom. Her name is Ana, and she immigrated to the U.S. from Brazil in order to further her education. By leaving behind her family, culture, and everything she knew, my mom sacrificed so much. This decision proves to me just how important education is, and she inspires me to challenge myself and aspire for great things. Love you mom!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f1da7c78-2373-4897-89da-114307039910\"}":{"__typename":"DeepDives","uuid":"f1da7c78-2373-4897-89da-114307039910","content":"\u003cp\u003eI believe climate change is the greatest threat faced by society today. In high school I decided to do my part as a global citizen in addressing this issue. Partnering with a local ski resort, I hosted a Ski-A-Thon, in which competitors skied as many laps in a day as they could, raising money with each mile. In the end, we raised thousands of dollars, all of which was donated to Protect Our Winters (POW). POW is a super awesome Colorado-based nonprofit that focuses on climate legislation. It was so cool to take a hobby I love-- skiing-- and use it to benefit a cause I'm passionate about-- the environment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9da59941-46f7-4da0-b98e-28c580a53443\"}":{"__typename":"DeepDives","uuid":"9da59941-46f7-4da0-b98e-28c580a53443","content":null,"videoPlaybackId":"BZCQ6P7RRpgn2pyNS01hKPttqjO1wI37MGJO00XnmJwrw","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8581491f-98e8-4e1b-8561-1f194ceb2752\"}":{"__typename":"DeepDives","uuid":"8581491f-98e8-4e1b-8561-1f194ceb2752","content":null,"videoPlaybackId":"jSXun4EXtJmHKtrD5TwrbXSYq01ltZADKzbhN2BhPbuM","question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"f1626514-879d-486a-a473-f8155d4b8565\"}":{"__typename":"Education","uuid":"f1626514-879d-486a-a473-f8155d4b8565","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"International Relations","degree":"B.A."},"School:{\"uuid\":\"54b11c84-d642-4f57-aa18-ee92ebe5cb22\"}":{"__typename":"School","uuid":"54b11c84-d642-4f57-aa18-ee92ebe5cb22","name":"Palisade High School","city":"Palisade","type":"HIGH","state":"Colorado","country":"United States","zip":"81526"},"Education:{\"uuid\":\"c1e1ccc5-7129-405c-9d80-8ebc0ca33c19\"}":{"__typename":"Education","uuid":"c1e1ccc5-7129-405c-9d80-8ebc0ca33c19","school":{"__ref":"School:{\"uuid\":\"54b11c84-d642-4f57-aa18-ee92ebe5cb22\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"a82b6165-9dd8-43e8-9d27-d5538fc799a6\"}":{"__typename":"MentorPublicProfile","uuid":"a82b6165-9dd8-43e8-9d27-d5538fc799a6","displayName":"Gabriela R.","slug":"gabriela-ferreira","biography":"\u003cp\u003eHi! My name is Gabi, I’m a junior at Stanford studying International Relations (IR). I’m from Colorado so I love all things outdoors– a fun fact about me is that my goal is to visit every national park!\u003c/p\u003e\u003cp\u003eI chose to study IR for a few reasons. First, I find geopolitics super interesting because there’s no over-arching international government system, which means there’s a lot of nuance when it comes to discussing politics on a global scale. Second, I’m a dual citizen of the U.S. and Brazil, and I would love to one day work between the countries, connecting my two cultures.\u003c/p\u003e\u003cp\u003eMy interest in IR led me to join the Society for International Affairs at Stanford. Within this student-led organization, I compete on the Model UN team, help organize events, edit for the Stanford Journal of International Affairs, and generally engage in conversations regarding current events and global cultures. My favorite event I helped organize was an international cooking night– I made Brazilian lemonade and it was soooo good.\u003c/p\u003e\u003cp\u003eDespite my international focus, I’m also interested in domestic U.S. politics. This past summer I interned for Colorado Senator John Hickenlooper in Washington D.C., specifically on the foreign affairs and environment/energy teams. Through this experience, I learned about policymaking, how the government functions, and how to get involved in politics as a student.\u003c/p\u003e\u003cp\u003eWithin my community, I do a lot of work related to equity in education. In high school, I was president of the Student Led Equity Council, a group that educates students and teachers on racial equity in the classroom. This involved creating a cultural competency continuum, presenting at conferences around Colorado, and receiving a $20,000 grant to support other districts in the state to start their own councils.\u003c/p\u003e\u003cp\u003eIn my free time, I love running, reading, puzzling, and listening to Taylor Swift. If anything mentioned in this bio interests you, I would love to be your mentor! I know that together we can do great things.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"8YF3U01TwlGA7Dg7gLY62xm1tEYe128g301DlYSlZ1BVw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0c29d1d6-307b-4aca-872d-a59a53e3caa5\"}"},{"__ref":"Favorites:{\"uuid\":\"d8bbb58c-9c20-40f2-85ae-3607b4ea7ed4\"}"},{"__ref":"Favorites:{\"uuid\":\"79826641-9a96-4491-8117-aba3d11b83ae\"}"}],"causesSupported":[],"major":"International Relations","deepDives":[{"_
