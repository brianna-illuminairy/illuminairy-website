xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bb7aa52a-9312-43a1-bb59-1ea97e232072\"}":{"__typename":"Favorites","uuid":"bb7aa52a-9312-43a1-bb59-1ea97e232072","photoUrl":"https://ucarecdn.com/719bd0c3-9c22-4c2f-aaf7-133525e9e984/","title":"Taylor Swift, Gracie Abrams, Ed Sheeran, The Weeknd, Olivia Dean ","type":"ARTIST"},"Favorites:{\"uuid\":\"1b4a01ab-cdb6-4957-826d-bfc1af21bd20\"}":{"__typename":"Favorites","uuid":"1b4a01ab-cdb6-4957-826d-bfc1af21bd20","photoUrl":"https://ucarecdn.com/6c89943c-fde8-44fb-85e2-7c187e25e524/","title":"Dubai!","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"64cf3a96-f9ff-4223-94f5-f936a906ae10\"}":{"__typename":"DeepDives","uuid":"64cf3a96-f9ff-4223-94f5-f936a906ae10","content":"\u003cp\u003eYour identity is your greatest strength, use it to make connections with people!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"9019b680-229f-4a38-ba9b-01fbe935b2f2\"}":{"__typename":"DeepDives","uuid":"9019b680-229f-4a38-ba9b-01fbe935b2f2","content":"\u003cp\u003eI was definitely the person who signed up for everything—theater, academics, sports, nonprofits, choir… if it existed, I was probably in it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e321eddc-4fa9-4345-a50a-e16c52e5c245\"}":{"__typename":"DeepDives","uuid":"e321eddc-4fa9-4345-a50a-e16c52e5c245","content":"\u003cp\u003eMentorship matters to me because so much of who I am today comes from the people who believed in me and helped shape my values. In high school, I led our Asian affinity group, and that experience deeply influenced how I think about supporting others. It was one of the first spaces where I saw how powerful it is to create community and make sure people feel seen and heard. Mentorship lets me do that for students, and is a way to show them that their perspectives matter and that their voice deserves space.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"05e13a4b-d7cc-4d04-b3c1-32c27f6a8a4c\"}":{"__typename":"DeepDives","uuid":"05e13a4b-d7cc-4d04-b3c1-32c27f6a8a4c","content":"\u003cp\u003eMy senior year of high school, I had the incredible opportunity to perform on the main stage of the Kennedy Center in Bernstein’s \u003cem\u003eMass\u003c/em\u003e!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"d60b71e1-936f-41e3-b35a-55bfb533485e\"}":{"__typename":"School","uuid":"d60b71e1-936f-41e3-b35a-55bfb533485e","name":"Bullis School","city":"Potomac","type":"HIGH","state":"Maryland","country":"United States","zip":"20854"},"Education:{\"uuid\":\"0f440261-ad4c-46fc-bee4-9eeb10955e3a\"}":{"__typename":"Education","uuid":"0f440261-ad4c-46fc-bee4-9eeb10955e3a","school":{"__ref":"School:{\"uuid\":\"d60b71e1-936f-41e3-b35a-55bfb533485e\"}"},"startYear":"2021","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}":{"__typename":"School","uuid":"67d96877-4245-4f9b-a557-94f9ecabd290","name":"Barnard College","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"8c0ea3d1-a5d7-4c81-880c-2023970e2f81\"}":{"__typename":"Education","uuid":"8c0ea3d1-a5d7-4c81-880c-2023970e2f81","school":{"__ref":"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Political Science - Human Rights ","degree":null},"MentorPublicProfile:{\"uuid\":\"64bacd2d-ee80-4eb9-98b4-c5b8f9a406af\"}":{"__typename":"MentorPublicProfile","uuid":"64bacd2d-ee80-4eb9-98b4-c5b8f9a406af","displayName":"Akshara S.","slug":"akshara-santoshkumar","biography":"\u003cp\u003eHi! My name is Akshara Santoshkumar, and I am a junior at Barnard College of Columbia University studying Political Science–Human Rights with a minor in Economics. A huge part of my identity comes from being a proud third-culture kid. I'm Indian American, born in the U.S. but raised mostly in the Middle East, and growing up between cultures pushed me to constantly think globally.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eRight now, I’m a Research Assistant with the Ambedkar Initiative at Columbia’s Institute for Comparative Literature and Society. I spend a lot of time in the archives digging into the writings of B.R. Ambedkar, anti-caste movements, and the broader intellectual history of equality. I also serve as a Senior Editor for the Columbia Undergraduate Political Review in the West Africa cohort, where I get to mentor writers, shape ideas, and help build thoughtful long-form pieces. And as a Speaking Fellow at Barnard, I coach students on public speaking and presentations, helping them find clarity, confidence, and their own communication style.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of schoolwork, I’m a performer at heart. I’m always at jazz concerts, checking out new live-music spots, or trying to see the latest musical (I just saw \u003cem\u003eThe Outsiders\u003c/em\u003e and loved it!) I also love running, traveling, football (go Liverpool and England!) cooking, and anything that gets me outside.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause I’ve explored so many different fields—research, writing, performance, and global politics—I’m well-equipped to teach a wide range of humanities subjects. I’ve worked with students on essay writing, AP Lit, AP Lang, AP Comparative Gov, APUSH, AP World, and pretty much every English or history class out there.\u0026nbsp; I’m also really passionate about organization and habit-building. Figuring out how \u003cem\u003eyou\u003c/em\u003e learn best can completely change your academic experience, and I love helping students find study systems, planning methods, and routines that make school feel less stressful and more manageable. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs someone with wide-ranging interests myself, I know how empowering it feels when your curiosity turns into something real—whether that’s a research paper, a podcast, a creative portfolio, or something completely outside the box. I especially enjoy helping students recognize the connections among their varied interests and showing them that their passions do not need to exist in separate spheres. In my experience, some of the most compelling projects emerge when ideas that initially seem unrelated are brought together in thoughtful and unexpected ways. I love guiding students through that process—helping them shape ideas, find their voice, and build something uniquely their own.\u003c/p\u003e","teachingVideoPlaybackId":"Fk42yyQ98lg3iAp8MONkAtCWbv9WReKuSukBN4BDPec","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__r
