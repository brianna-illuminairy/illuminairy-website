xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8fcfd08d-2620-4b99-a27b-f3757410bed7\"}":{"__typename":"Favorites","uuid":"8fcfd08d-2620-4b99-a27b-f3757410bed7","photoUrl":"https://ucarecdn.com/6c566cc0-e6ab-4d47-bfbe-39c48026d981/","title":"Guardians of the Galaxy Vol.1-3","type":"MOVIE"},"Favorites:{\"uuid\":\"ca11dda0-7dcf-44ab-80d8-d924686b0279\"}":{"__typename":"Favorites","uuid":"ca11dda0-7dcf-44ab-80d8-d924686b0279","photoUrl":"https://ucarecdn.com/5fca04af-cab7-46ba-a045-a0258fbeb45e/","title":"Hamilton","type":"PLAY"},"Favorites:{\"uuid\":\"fec1969d-6f3c-4a89-9e01-1242fe1a6291\"}":{"__typename":"Favorites","uuid":"fec1969d-6f3c-4a89-9e01-1242fe1a6291","photoUrl":"https://ucarecdn.com/be28dc4d-c94f-4e95-9cc9-0f366a8f94fc/","title":"New England Patriots","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5ef01700-080b-43ea-81aa-e8289e66f594\"}":{"__typename":"DeepDives","uuid":"5ef01700-080b-43ea-81aa-e8289e66f594","content":"\u003cp\u003eI would definitely tell my younger self to discuss mathematics more with others. Mathematics was much more of an individualized journey for myself in middle school and high school, but it certainly should not have been that way. Try to set up meet times with other students to go over homework together, once you both completed it to the best of your ability. Spend time discussing what you did not understand or were shaky on. Another piece of advice I would give my younger self is to make sense of things you simply take for granted. You might not think it matters all that much now, but later on in your math studies it is helpful, and sometimes essential, to have a strong foundation when learning more advanced topics.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"77ba9d23-bce4-4f98-9919-525e55b3ac74\"}":{"__typename":"DeepDives","uuid":"77ba9d23-bce4-4f98-9919-525e55b3ac74","content":"\u003cp\u003eMy greatest source of motivation is the impact that I can have on others. Knowing that I can be the mentor that makes math understandable, exciting, and interesting for students that may be missing that role model lights a spark inside of me. It is the reason that I shifted my career path towards becoming a high school math teacher, the reason I participated as a Math Teaching Fellow, and the reason why I became a mentor for Curious Cardinals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0e3cc6cd-0752-4616-9e0d-9c2f8beddd63\"}":{"__typename":"DeepDives","uuid":"0e3cc6cd-0752-4616-9e0d-9c2f8beddd63","content":"\u003cp\u003eOne thing I like to do in my spare time is expand my financial knowledge by studying real estate investing. One thing that is not taught enough in middle school and high school is financial literacy, which is essential to know as an adult in today's day and age. Away from academics, I enjoy playing flag football as an intramural at school. I also enjoy meeting up with friends to play some billiards (pool), or go by myself and meet new people. When I am home, I enjoy going out on the water in my kayak to fish, preferably bass. During the summers, I look forward to exploring the beauty of the U.S. National Parks with my family. I have been to 14 of the 63 National Parks thus far, my favorites being Zion and Yosemite.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"91c9dfc8-8a70-4944-9bf4-a2f69c2deb00\"}":{"__typename":"DeepDives","uuid":"91c9dfc8-8a70-4944-9bf4-a2f69c2deb00","content":"\u003cp\u003eIn high school, I spent my summers running my own lawn mowing service around my neighborhood, as well as the connecting neighborhoods. I invested in an electric Ryobi weed wacker, used the family push mower, and found a few clients that were in need of a young landscaper. Once I had a few clients and other neighbors saw my work, more clients reached out to me. Soon enough I had to create my own schedule and communicate with my clients weekly to stay organized. This job not only gave me some money over the summer but kept my mind active working on my communication and organizational skills. I was even able to expand the business to several painting jobs for the same clients giving me skills I could use later on in life when I have my own home.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"6a0a4cfe-bfef-4345-b4b6-a5456a984fc0\"}":{"__typename":"School","uuid":"6a0a4cfe-bfef-4345-b4b6-a5456a984fc0","name":"Tiverton High School","city":"Tiverton","type":"HIGH","state":"RI","country":"United States","zip":"02878"},"Education:{\"uuid\":\"db43575e-df9a-47e6-9645-7172e01beea9\"}":{"__typename":"Education","uuid":"db43575e-df9a-47e6-9645-7172e01beea9","school":{"__ref":"School:{\"uuid\":\"6a0a4cfe-bfef-4345-b4b6-a5456a984fc0\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"6d099a5c-a787-4587-8ede-9a714b1b34fd\"}":{"__typename":"Education","uuid":"6d099a5c-a787-4587-8ede-9a714b1b34fd","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"0ed45709-5d03-4122-bd28-d486a22e3b96\"}":{"__typename":"MentorPublicProfile","uuid":"0ed45709-5d03-4122-bd28-d486a22e3b96","displayName":"Jameson P.","slug":"jameson-peckham","biography":"\u003cp\u003eJameson Peckham is a junior at Brown University majoring in mathematics. He focuses his studies on calculus and statistics, while also indulging in education courses to prepare himself for a career as a high school math teacher. Math has always been one of his stronger subjects, but he did not realize his appreciation for teaching it until attending college. It is there that he has reflected on his current and past math teachers and mentors, and saw how influential they were in his enjoyment and understanding of the subject. It is also in college that his fellow classmates have pointed out similar traits in him. Hence the reasons why he has decided to go into math education and participated as a Math Teaching Fellow for the Brown University Math Department for the Spring 2023 semester.\u003cbr\u003e\u003cbr\u003eAs a Math Teaching Fellow, he was able to be a teaching assistant for a Linear Algebra course. As a teaching assistant, he attended every class session and walked around the classroom answering any questions that students had. He also asked any questions that he had in order to give students the opportunity to reflect on their understanding of the material and improve their verbal, mathematical communication skills. Another responsibility that Jameson had was grading problem sets. The main focus when grading was not whether the students were wrong or right, but rather emphasizing their ability to use mathematical language effectively in their writing, and show an understanding of the topic at hand.\u003cbr\u003e\u003cbr\u003eJameson became a mentor at Curious Cardinals for similar reasons. He cares about sharing his appreciation and knowledge of math with others in a meaningful and engaging way. He strongly believes that mathematics lives and thrives through the exchange of ideas from people pursuing the subject. Thus, Jameson will work to create a strong bond and partnership with each and every mentee, so that they both know that they are participating on a journey to learn mathematics together.\u003cbr\u003e\u003cbr\u003eOutside of academics, you will find Jameson playing flag football and billiards (pool) with friends, fresh water fishing out on his kayak, as well as exploring the beauty of the U.S. National Parks with his family.\u003cbr\u003e\u003cbr\u003eHe looks forward to working with you and wishes every one of you luck on your mathematical journey!\u003c/p\u003e","teachingVideoPlaybackId":"2XHfXzHzGPh00R02TR01rIcmqZIUw4h3cfbGLw5BcpBFb8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8fcfd08d-2620-4b99-a27b-f3757410bed7\"}"},{"__ref":"Favorites:{\"uuid\":\"ca11dda0-7dcf-44ab-80d8-d924686b0279\"}"},{"__ref":"Favorites:{\"uuid\":\"fec1969d-6f3c-4a89-9e01-1242fe1a6291\"}"}],"causesSupported":[],"major":"Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5ef01700-080b-43ea-81aa-e8289e66f594\"}"},{"__ref":"DeepDives:{\"uuid\":\"77ba9d23-bce4-4f98-9919-525e55b3ac74\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e3cc6cd-0752-
