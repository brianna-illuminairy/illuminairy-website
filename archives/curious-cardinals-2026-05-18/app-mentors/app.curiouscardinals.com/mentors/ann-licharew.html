xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"795a6b1b-a552-4ca7-af5e-8b4d578e0e36\"}":{"__typename":"Favorites","uuid":"795a6b1b-a552-4ca7-af5e-8b4d578e0e36","photoUrl":"https://ucarecdn.com/080ea96a-080e-420e-86ff-5f2cf9861b1b/","title":"Eddie Murphy","type":"ACTOR"},"Favorites:{\"uuid\":\"bceda466-86a4-4939-97a9-7e6125b237fa\"}":{"__typename":"Favorites","uuid":"bceda466-86a4-4939-97a9-7e6125b237fa","photoUrl":"https://ucarecdn.com/2682ae02-556c-4ecc-bb0d-178204530d00/","title":"Toronto","type":"CITY"},"Favorites:{\"uuid\":\"11e4785a-9281-4483-a8eb-ad67da62ab96\"}":{"__typename":"Favorites","uuid":"11e4785a-9281-4483-a8eb-ad67da62ab96","photoUrl":"https://ucarecdn.com/3579fb04-a8e3-4716-9600-5a90d55ffcec/","title":"Girlhood","type":"MOVIE"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"201efa4b-df3c-439d-b6c4-c3a0919d4d8d\"}":{"__typename":"DeepDives","uuid":"201efa4b-df3c-439d-b6c4-c3a0919d4d8d","content":"\u003cp\u003eGrowing up in high school, I never felt seen or as if people believed in me and my endeavors. I started mentoring in 2018 with the Big Brothers Big Sisters of Asheville, providing support for young students who come from broken families or don't have a lot of resources. During my two-year tenure with them before moving to college, I fell in love with mentoring and learned a lot about mentor-mentee relationships and how it can positively shape young peoples' lives. I discovered a passion for showing young people that they are truly seen, and that someone believes in their potential and are willing to nurture it. I have been mentoring ever since.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"9adffc70-0568-47a5-ac2d-18359757ddc8\"}":{"__typename":"DeepDives","uuid":"9adffc70-0568-47a5-ac2d-18359757ddc8","content":"\u003cp\u003eMy ultimate aspiration is for my documentaries to drive meaningful change—enough to one day earn a Pulitzer Prize or a Fulbright Prize for International Understanding. Just as much, I dream about making a documentary about Kendrick Lamar and his profound influence on hip-hop culture in the United States.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"61b49ea4-0f19-4c34-8500-4226c0ea1ebb\"}":{"__typename":"DeepDives","uuid":"61b49ea4-0f19-4c34-8500-4226c0ea1ebb","content":"\u003cp\u003eI love to train martial arts! I've practiced boxing, self-defense, filipino martial arts, ninjutsu, and the Afro-Brazilian art of capoeira.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"d08e8f21-b085-4ae2-8879-3fde29947856\"}":{"__typename":"School","uuid":"d08e8f21-b085-4ae2-8879-3fde29947856","name":"A.C. Reynolds High School","city":"Asheville","type":"HIGH","state":"North Carolina","country":"United States","zip":"28803"},"Education:{\"uuid\":\"11707831-80be-4e1f-83cd-c3343271a6f0\"}":{"__typename":"Education","uuid":"11707831-80be-4e1f-83cd-c3343271a6f0","school":{"__ref":"School:{\"uuid\":\"d08e8f21-b085-4ae2-8879-3fde29947856\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"7bc9b87e-14c6-40b1-b876-ced8bc9fda87\"}":{"__typename":"School","uuid":"7bc9b87e-14c6-40b1-b876-ced8bc9fda87","name":"University of North Carolina at Chapel Hill","city":"Chapel Hill","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27514"},"Education:{\"uuid\":\"03e4a4d4-0b09-4593-b52a-8b93c4deedff\"}":{"__typename":"Education","uuid":"03e4a4d4-0b09-4593-b52a-8b93c4deedff","school":{"__ref":"School:{\"uuid\":\"7bc9b87e-14c6-40b1-b876-ced8bc9fda87\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Media and Journalism","degree":null},"MentorPublicProfile:{\"uuid\":\"8bb7ea2a-6a45-4323-accf-779d1a574038\"}":{"__typename":"MentorPublicProfile","uuid":"8bb7ea2a-6a45-4323-accf-779d1a574038","displayName":"Ann L.","slug":"ann-licharew","biography":"\u003cp\u003eAt the heart of everything I do (whether I'm mentoring, making documentaries, or building a business) is the desire to ensure that people feel seen and valued. I started mentorship with Big Brothers Big Sisters of Asheville in 2018 and later served as a mentor with UNC’s Academic Advising Program as well as an Undergraduate Teaching Assistant in college. The same drive that shapes my mentoring is what grounds my work as a documentary filmmaker. I love helping young people find their passions through filmmaking and video-editing, sports and music journalism, writing and publishing journals, entrepreneurship, finance, foreign language teaching, portfolio and website building through WordPress and HTML, and navigating opportunities such as grants and fellowships. I enjoy encouraging students through coaching, building self-management and productivity skills, and overcoming procrastination.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy journey has carried me far from home. From Puerto Rico to Brazil, and across international fellowships in Europe, I’ve stayed constant in driving change through storytelling.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile pursuing a journalism degree at UNC Chapel Hill, I traveled to Vega Baja, Puerto Rico in 2023 to co-produce a documentary about gentrification and beach privatization. Our goal was to shine light on Puerto Rican stories that don’t often get mainland attention. That year I led Spanish translation efforts and screened my first professional doc in front of fellow Tar Heels.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat same year, I joined the likes of Ruth Bader Ginsburg, Makaziwe Mandela, and Hillary Clinton as a Salzburg Global Fellow. In Austria, I joined peers from Lebanon, Hong Kong, China, India, Argentina, the U.S., and beyond to reflect on the responsibilities of the youth in shaping the future of media. The experience showed me that mentorship is not only personal but also global. There is a responsibility and privilege to equip others with the skills and confidence to drive change wherever they are.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, as a 2025 Fulbright Scholar, I am directing a documentary highlighting Afro-Bahian culture in Salvador, Bahia, Brazil. This project fulfills a dream of mine first sparked during my freshman year of college, when I learned about Fulbright and felt called to Bahia. At the time, I never imagined I would be a video journalist. My identity makes this work a natural extension of who I am and a way to serve as a cultural ambassador while telling stories that celebrate resilience and joy.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis year I also launched my own production company, NUNU FILMS LLC, expanding my work into entrepreneurship. Through this step, I have deepened the ways I can mentor others. \u003c/p\u003e","teachingVideoPlaybackId":"00AhT97UKMPNTm1xuEvRs9bGvYGsJrMJKJQNb8ivxVl4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"795a6b1b-a552-4ca7-af5e-8b4d578e0e36\"}"},{"__ref":"Favorites:{\"uuid\":\"bceda466-86a4-4939-97a9-7e6125b237fa\"}"},{"__ref":"Favorites:{\"uuid\":\"11e4785a-9281-4483-a8eb-ad67da62ab96\"}"}],"causesSupported":[],"major":"Media and Journalism","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"201efa4b-df3c-439d-b6c4-c3a0919d4d8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"9adffc70-0568-47a5-ac2d-18359757ddc8\"}"},{"__ref":"DeepDives:{\"uuid\":\"61b49ea4-0f19-4c34-8500-4226c0ea1ebb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/feb29d5d-9e62-44b7-99e4-5927c12f7257/-/preview/-/format/jpg/","https://ucarecdn.com/8eb5dbc0-7280-476f-b204-c1ffeacaf8eb/-/preview/-/format/jpg/","https://ucarecdn.com/06a2319b-5eab-4366-bac2-a905f8b55ba6/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"11707831-80be-4e1f-83cd-c3343271a6f0\"}"},{"__ref":"Education:{\"uuid\":\"03e4a4d4-0b09-4593-b52a-8b93c4deedff\"}"}],"hiredAt":"2025-09-11T03:08:07.799Z","topics":["Video / Photography","Business / Entrepreneurship","Journalism","Web Design","Spanish","College Essay Writing","Academic Coaching","Executive Function"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ann-licharew\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8bb7ea2a-6a45-4323-accf-779d1a574038\"}"}}},"_sentryTraceData":"ca7614371e5c41a2bb1eb236a15bac12-910142c2384b929f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ca7614371e5c41a2bb1eb236a15bac12,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ann-licharew"},"buildId":"ZAcrs1hPe6xc
