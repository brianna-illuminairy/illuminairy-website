xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"51ff6279-0edf-477a-ab01-3481fa22a602\"}":{"__typename":"Favorites","uuid":"51ff6279-0edf-477a-ab01-3481fa22a602","photoUrl":"https://ucarecdn.com/f4f3492b-959b-42c8-b9e1-d4f903385c46/","title":"Red Sox","type":"SPORT"},"Favorites:{\"uuid\":\"083c58bf-23c6-4908-acf1-75e5cbe137dd\"}":{"__typename":"Favorites","uuid":"083c58bf-23c6-4908-acf1-75e5cbe137dd","photoUrl":"https://ucarecdn.com/6731eca5-c133-4256-9d17-bdb9cf351633/","title":"Lana Del Rey","type":"ARTIST"},"Favorites:{\"uuid\":\"32cf6032-92f3-4b89-888c-697e62eedaff\"}":{"__typename":"Favorites","uuid":"32cf6032-92f3-4b89-888c-697e62eedaff","photoUrl":"https://ucarecdn.com/bffe5cbe-d70a-48b9-bf4f-30816234b025/","title":"Pride and Prejudice","type":"MOVIE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"003dd0c0-7a07-4310-950a-6e3539b74d22\"}":{"__typename":"DeepDives","uuid":"003dd0c0-7a07-4310-950a-6e3539b74d22","content":"\u003cp\u003eI chose Operations Research and Engineering because it combines my love for problem-solving, mathematics, and finding efficient solutions to complex challenges. Optimization plays a significant role in everyday life, and I’ve always been fascinated by the idea of making systems work smarter and faster.\u003c/p\u003e\u003cp\u003eEven in simple tasks, like finding the quickest route to a destination, I enjoy analyzing different options and figuring out the most efficient path—whether it’s to save time or maximize productivity. This mindset extends to bigger decisions, like organizing projects or streamlining processes in group settings. Operations Research provides me with the tools to apply this problem-solving approach on a larger scale, allowing me to improve systems and processes in meaningful ways.\u003c/p\u003e\u003cp\u003eThrough my coursework and experiences, I’ve discovered how optimization can be applied across industries—from transportation and logistics to finance and healthcare. The ability to take data, identify patterns, and create actionable solutions is both exciting and deeply rewarding to me. I’m drawn to the practical impact of this field, where I can help make people’s lives easier and organizations more effective.\u003c/p\u003e\u003cp\u003eUltimately, Operations Research allows me to combine my analytical skills with my passion for efficiency, giving me the chance to make a tangible difference in the world\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2b66518d-71a2-456b-aaaa-aae286f37bb3\"}":{"__typename":"DeepDives","uuid":"2b66518d-71a2-456b-aaaa-aae286f37bb3","content":"\u003cp\u003eIn high school, I founded the Global Health Society, a passion project inspired by my interest in addressing pressing global health challenges. Our mission was rooted in the belief that small, local actions can spark broader change, captured in our motto, \u003cem\u003e“Starting Local to Go Global.”\u003c/em\u003e\u003c/p\u003e\u003cp\u003eThe Global Health Society focused on issues like nutrition and period poverty—topics that have profound impacts both locally and globally. We organized educational campaigns to raise awareness about these issues and collaborated with local organizations to make a tangible difference in our community. For example, we held drives to collect menstrual products for underserved populations and partnered with local food banks to address nutrition insecurity.\u003c/p\u003e\u003cp\u003eLeading this initiative was incredibly rewarding because it demonstrated the power of teamwork and grassroots action. It was inspiring to see how our efforts, though small in scale, contributed to a larger conversation about global health and human dignity. This experience not only deepened my commitment to social impact but also taught me valuable lessons about leadership, organization, and the importance of starting change in your own community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"f7ff14c9-9b04-4f1a-ae31-05041133b941\"}":{"__typename":"DeepDives","uuid":"f7ff14c9-9b04-4f1a-ae31-05041133b941","content":"\u003cp\u003eIn high school, I was super energetic and loved staying involved in all kinds of activities. Sports were a huge part of my life—I played both softball and soccer, which taught me so much about teamwork and staying determined.\u003c/p\u003e\u003cp\u003eI also got really into speech and debate, which was such a fun way to improve my public speaking and learn how to think on my feet. On top of that, I started the Global Health Society, a club that let me combine my passion for helping others with my love for working on meaningful projects with friends.\u003c/p\u003e\u003cp\u003eWhen I wasn’t busy with school or activities, I loved hanging out with my friends. We’d have baking nights where we’d experiment with recipes or host movie marathons. Those little moments were the perfect balance to everything else I had going on.\u003c/p\u003e\u003cp\u003eOverall, I’d say I was someone who loved staying active, trying new things, and making the most of my time with friends and the things I cared about. High school was definitely a mix of hard work and a lot of fun!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c47d2ca0-e41c-4516-83e3-1cbb68a761b5\"}":{"__typename":"DeepDives","uuid":"c47d2ca0-e41c-4516-83e3-1cbb68a761b5","content":"\u003cp\u003eIn my spare time, I love spending time with friends and finding fun ways to relax and connect. One of our favorite things to do is explore local coffee shops—we’re always on the hunt for the best latte or cozy spot to hang out and catch up.\u003c/p\u003e\u003cp\u003eI’m also in a sorority, and it’s such a great way to stay active around campus. We’re always organizing fun activities, whether it’s volunteering, going to campus events, or just spending time together. Hosting dinner parties with my sorority sisters is one of my favorite things—we’ll cook, share stories, and just enjoy each other’s company.\u003c/p\u003e\u003cp\u003eWhether I’m out with friends, at a coffee shop, or doing something fun with my sorority, I love spending my downtime creating memories and enjoying the little things in life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"43c5af56-eaff-43ae-8ed9-77026d543c73\"}":{"__typename":"School","uuid":"43c5af56-eaff-43ae-8ed9-77026d543c73","name":"The Bromfield School","city":"Harvard","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01451"},"Education:{\"uuid\":\"4c43fe5d-71f5-46d9-bbb5-b1846fe954cf\"}":{"__typename":"Education","uuid":"4c43fe5d-71f5-46d9-bbb5-b1846fe954cf","school":{"__ref":"School:{\"uuid\":\"43c5af56-eaff-43ae-8ed9-77026d543c73\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"5f54d465-f6d0-4b65-8a68-8ae12e093b01\"}":{"__typename":"Education","uuid":"5f54d465-f6d0-4b65-8a68-8ae12e093b01","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Operations Research Engineering ","degree":null},"MentorPublicProfile:{\"uuid\":\"c6b50351-1053-4f2a-9f63-8be70d298d32\"}":{"__typename":"MentorPublicProfile","uuid":"c6b50351-1053-4f2a-9f63-8be70d298d32","displayName":"Michelle M.","slug":"michelle-mazzu-1","biography":"\u003cp\u003eHi, I’m Michelle Mazzu! I’m from Central Massachusetts and currently a student at Cornell University, where I’m pursuing a degree in Operations Research and Engineering. My love for statistics and problem-solving led me to this field, as it allows me to apply analytical skills to real-world challenges in innovative and impactful ways.\u003c/p\u003e\u003cp\u003eAt Cornell, I’m the Business Captain of the ChemE Car project team, a role that has strengthened my passion for teamwork and goal-setting. One of my proudest achievements was leading our team to raise over $10,000 to support our projects. Being part of ChemE Car has taught me the importance of collaboration and persistence, values I aim to pass on to my mentees.\u003c/p\u003e\u003cp\u003eOutside of academics and leadership, I have a deep love for sports. Growing up, I played softball and continued to pursue my passion for the game by joining a college club team. I’m also an avid runner and enjoy the sense of freedom and accomplishment it brings.\u003c/p\u003e\u003cp\u003eFood is another big part of my life—I’m a dedicated home chef and baker who loves experimenting in the kitchen. Trying new recipes and exploring local restaurants brings me so much joy, and I’m always on the lookout for culinary adventures.\u003c/p\u003e\u003cp\u003eIn addition, I’m passionate about languages and culture. Growing up bilingual sparked my interest in learning Spanish, and I love practicing it while traveling to new places and immersing myself in different cultures. These experiences have shaped my global perspective, which I bring into my teaching and mentorship style.\u003c/p\u003e\u003cp\u003eAs a mentor, I aim to inspire curiosity, build confidence, and help students discover their unique strengths. Whether it’s through team projects, solving statistical puzzles, or simply sharing life lessons, I’m committed to fostering a supportive and engaging learning environment. I believe that success stems from both passion and perseverance, and I can’t wait to guide my mentees on their own exciting journeys!\u003c/p\u003e","teachingVideoPlaybackId":"b3gPnlIOxs4qeF4hJfJgKDyBdMMtqB02Sax5IojP22Pg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"51ff6279-0edf-477a-ab01-3481fa22a602\"}"},{"__ref":"Favorites:{\"uuid\":\"083c58bf-23c6-4908-acf1-75e5cbe137dd\"}"},{"__ref":"Favorites:{\"uuid\":\"32cf6032-92f3-4b89-888c-697e62eedaff\"}"}],"causesSupported":[],"major":"Operations Research Engineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"003dd0c0-7a07-4310-950a-6e3539b74d22\"}"},{"__ref":"DeepDives:{\"uuid\":\"2b66518d-71a2-456b-aaaa-aae286f37bb3\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7ff14c9-9b04-4f1a-ae31-05041133b941\"}"},{"__ref":"DeepDives:{\"uuid\":\"c47d2ca0-e41c-4516-83e3-1cbb68a761b5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/de7dcdc5-7b83-4e88-b3a8-f0359c1a4ae1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4c43fe5d-71f5-46d9-bbb5-b1846fe954cf\"}"},{"__ref":"
