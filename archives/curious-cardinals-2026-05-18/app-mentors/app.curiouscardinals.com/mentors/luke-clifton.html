xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e699ca8f-2101-4f6d-b6c5-51d7a31153a5\"}":{"__typename":"Favorites","uuid":"e699ca8f-2101-4f6d-b6c5-51d7a31153a5","photoUrl":"https://ucarecdn.com/d6628d56-152a-4298-9df3-4ad2a9f855e8/","title":"Let Me Tell You What I Mean by Joan Didion","type":"BOOK"},"Favorites:{\"uuid\":\"54bfb912-4840-46bc-b810-6e134963f8bc\"}":{"__typename":"Favorites","uuid":"54bfb912-4840-46bc-b810-6e134963f8bc","photoUrl":"https://ucarecdn.com/77b6e0a7-e583-4332-ae4c-4960846c5ee6/","title":"You've Got Mail by Nora Ephron","type":"MOVIE"},"Favorites:{\"uuid\":\"99fadc7e-62d0-4fac-979b-e3940d7e2d28\"}":{"__typename":"Favorites","uuid":"99fadc7e-62d0-4fac-979b-e3940d7e2d28","photoUrl":"https://ucarecdn.com/1559f639-f488-4aec-ac53-fd1700cf960b/","title":"Dale Chihuly ","type":"ARTIST"},"CausesSupported:{\"uuid\":\"b6f8d857-f2cc-4c1f-8219-6190dff01541\"}":{"__typename":"CausesSupported","uuid":"b6f8d857-f2cc-4c1f-8219-6190dff01541","name":"Elwyn Israel","description":"\u003cp\u003eVolunteer\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"abd3db5c-dcd4-40a6-9003-da3ebe9a7180\"}":{"__typename":"CausesSupported","uuid":"abd3db5c-dcd4-40a6-9003-da3ebe9a7180","name":"Magic Bus India","description":"\u003cp\u003eIntern\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b1cecc5d-2fd8-4ded-8ae9-be34701543d3\"}":{"__typename":"DeepDives","uuid":"b1cecc5d-2fd8-4ded-8ae9-be34701543d3","content":"\u003cp\u003eI would have told myself to stop getting such short haircuts. Kidding -- more seriously, I'd tell myself to relax. When I was in middle and high school, I was so anxious about my grades that I forgot to stop and look around every once and awhile. Now that I'm older, I see that my anxiety translated into hard work, but I also see how helpful it's been for me to relax and smell the roses. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring the pandemic, I started working at Trader Joe's.  My coworkers were genuinely so happy and talkative. Being in that environment taught me to surround myself with good people and relax. I also learned that I Iove trying new foods. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d78de0b3-025f-439d-9286-992c99e3f3a5\"}":{"__typename":"DeepDives","uuid":"d78de0b3-025f-439d-9286-992c99e3f3a5","content":"\u003cp\u003eGrowing up, I've had many mentors.  They oftentimes tell me things that I know and I'm like \"obviously... who cares?\" But deep down, I recognize that  hearing advice from an outside source makes all the difference. Having a mentor actually keep me accountable and validates my own positive self-talk. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor more tangible things, like applying to college or practicing a presentation, having a peer to look up to is a game-changer. You're able to learn from the mistakes of someone else who is older. And this is amazing because then you don't have to make the same mistakes they've made! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've been lucky to have amazing mentors throughout my childhood and it's important for me to return the favor to a younger generation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"79109531-acff-4758-9ed1-711d5d9e1ccb\"}":{"__typename":"DeepDives","uuid":"79109531-acff-4758-9ed1-711d5d9e1ccb","content":"\u003cp\u003eSimply put, I hope to write a movie that gets made one day. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut if I elaborate... I'll add that it's not because I want to be either rich or famous. Although, I will say, money is  important. The reason that I want to have one of my movies made is for the benefit of others. Whenever I watch a movie that I love, I think to myself: \"what if this hadn't been written?\" What a loss that would've been to society! What amazing characters that I would've never met. This reason alone motivates me to trust my instinct and to write characters and storylines that I know. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7cdd6567-7958-4557-8b9a-393b40c37c68\"}":{"__typename":"DeepDives","uuid":"7cdd6567-7958-4557-8b9a-393b40c37c68","content":"\u003cp\u003eI chose my major (English) because it was the major that I was the most scared of. The prospect of majoring in English to me looked like stepping in hot lava. Not only do English majors have the notorious reputation for being unemployed after graduation, I'd also have to have the tough conversation with my parents that I want to major in something that notoriously does not translate into a job after graduation. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs humans, we're taught to run away from fear. So obviously, I put off majoring in English for as long as I could. Although I loved product design, I knew that I would forever regret not swimming in the lava that is majoring in English. It turns out that my parents were not disappointed but rather glad that I was fulfilling this personal duty. Declaring English as my major at Stanford has been one of my best decisions to date. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"19561446-029f-4e60-837c-7fac5b0c8d1d\"}":{"__typename":"Education","uuid":"19561446-029f-4e60-837c-7fac5b0c8d1d","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English","degree":"Bachelor of Science"},"School:{\"uuid\":\"b6ec897b-dcf1-4ef4-a5cb-5cb6abb6987b\"}":{"__typename":"School","uuid":"b6ec897b-dcf1-4ef4-a5cb-5cb6abb6987b","name":"South Salem High School","city":"Salem","type":"HIGH","state":"Oregon","country":"United States","zip":"97302"},"Education:{\"uuid\":\"4f92ab90-770f-4e72-b205-0c4c534683f4\"}":{"__typename":"Education","uuid":"4f92ab90-770f-4e72-b205-0c4c534683f4","school":{"__ref":"School:{\"uuid\":\"b6ec897b-dcf1-4ef4-a5cb-5cb6abb6987b\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"51746e4a-f453-409f-846e-a890f8fcf10d\"}":{"__typename":"MentorPublicProfile","uuid":"51746e4a-f453-409f-846e-a890f8fcf10d","displayName":"Luke C.","slug":"luke-clifton","biography":"\u003cp\u003eHi, there! My name's Luke and in the first two photos you've caught me in... India! That's right, this past summer I was lucky enough to intern for a Mumbai-based nonprofit called Magic Bus India. I know what you might be thinking... \"He worked at \u003cem\u003eThe Magic School Bus\u003c/em\u003e?\" Although I wish I could call Ms. Frizzle my boss, my work this summer was a little different from playing a cartoon character, but just as equally cool. I spent my time recruiting 18-24 year-olds from impoverished areas to our skilling program so that they can go on to have meaningful careers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my summer gigs, I also go to school. I am majoring in English at Stanford and also have a lot of experience in Product Design. I spend a lot of my time writing, screenwriting, reading, and watching movies. In fact, my favorite screenplay right now's got to be \u003cem\u003eThe Royal Tenenbaums\u003c/em\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I've read too much and words stop making sense, I resort to sketching and creating. I love designing new products and have a lot of experience in need-finding, sketching, rapid-prototyping, and Fusion 360. Additionally, I recently started experimenting with a new medium: spray paint! In the third picture of me, I'm legally trying out graffiti. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eRecently, the Wordle was \"Neigh\" and I think it would be a dereliction for me not to mention that I ride horses. I'm actually learning to play polo right now at Stanford. Chances are, you might catch me with horses instead of books on a lucky afternoon!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAside from riding, I love exploring new places and writing about them. I lived in New York City two summers ago, Israel last summer, and most recently, India. I find that gathering with locals in cities I am new to is great for telling stories, either with a camera or pen.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNo matter where I've lived, I have to say that I'm a sucker for the American West. I love the California coast, Rocky Mountains, and Pacific Northwest. I grew up in the rainy (but beautiful) Salem, Oregon. I graduated with honors from South Salem High School as Valedictorian and the commencement speaker. In high school, I was the President of the Key Club (community service) and Model United Nations; Treasurer of National Honor Society; DECA Community Outreach Director; and participated in Environmental Club, German National Honor Society, and Youth \u0026amp; Government.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy high school experience was interrupted as the pandemic forced Oregon schools into over one year of online learning. I founded a nonprofit in 2020 called ConnectOregonStudents to supplement learning and peer support. As president, I worked with two of my friends to offer support and tutoring to students across Oregon, Southwest Washington, and Northern California. I also advocated for victims of eating disorders, having overcome one in my high school years.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA phrase that I dislike is “a jack of all trades is a master at none.” I am a firm believer in becoming a jack of many trades to eliminate trades that I dislike. After a bit of exploration, one can eventually find a trade to master! I hope to share findings along my journey to help my mentees locate their own passions!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eHonestly, living in India for two months is something that I'm pretty proud of. While I was hospitalized once with food poisoning, I'd say that the trip was a resounding success. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e699ca8f-2101-4f6d-b6c5-51d7a31153a5\"}"},{"__ref":"Favorites:{\"uuid\":\"54bfb912-4840-46bc-b810-6e134963f8bc\"}"},{"__ref":"Favorites:{\"uuid\":\"99fadc7e-62d0-4fac-979b-e3940d7e2d28\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b6f8d857-f2cc-4c1f-8219-6190dff01541\"}"},{"__ref":"CausesSupported:{\"uuid\":\"abd3db5c-dcd4-40a6-9003-da3ebe9a7180\"}"}],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b1cecc5d-2fd8-4ded-8ae9-be34701543d3\"}"},{"__ref":"DeepDives:{\"uuid\":\"d78de0b3-025f-439d-9286-992c99e3f3a5\"}"},{"__ref":"DeepDives:{\"uuid\":\"79109531-acff-4758-9ed1-711d5d9e1ccb\"}"},{"__ref":"DeepDives:{\"uuid\":\"7cdd6567-7958-4557-8b9a-393b40c37c68\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0be473c0-dbba-4c45-828a-169985a05f6a/-/preview/-/format/jpg/","https://ucarecdn.com/9805757c-3006-4ff3-8fec-b289c29e2244/-/preview/-/format/jpg/","https://ucarecdn.com/3fcc89ee-a36e-495a-8665-1797ef58281c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"19561446-029f-4e60-837c-7fac5b0c8d1d\"}"},{"__ref":"Education:{\"uuid\":\"4f92ab90-770f-4e72-b205-0c4c534683f4\"}"}],"hiredAt":"2023-02-15T01:12:54.521Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Business / Entrepreneurship","Web Design","Sustainability","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/9f7019f6-5b03-4f9f-a136-5aeaf2c62de6/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"luke-clifton\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"51746e4a-f453-409f-846e-a890f8fcf10d\"}"}}},"_sentryTraceData":"463d8f186d6e4dec9f49a95a404926a6-a55e6e9c6fa66281-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4
