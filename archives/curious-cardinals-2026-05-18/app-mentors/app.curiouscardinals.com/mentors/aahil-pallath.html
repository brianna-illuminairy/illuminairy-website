}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"9e27796a-8519-4017-ba8f-73e60a50c216\"}":{"__typename":"DeepDives","uuid":"9e27796a-8519-4017-ba8f-73e60a50c216","content":null,"videoPlaybackId":"zRA02PNDNfVXLSqpi13gv2gfZR00ndUU026LDn5BQqpnG8","question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7c9a1f54-d932-4bb3-901c-b25c96315eea\"}":{"__typename":"DeepDives","uuid":"7c9a1f54-d932-4bb3-901c-b25c96315eea","content":null,"videoPlaybackId":"DDpK7TdhllUsxlA02SSiecdIqjI2M1qCWc99SJYAPL01w","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"02adc620-31b4-46a7-b675-513fe7ab3beb\"}":{"__typename":"School","uuid":"02adc620-31b4-46a7-b675-513fe7ab3beb","name":"Henrico High School","city":"Richmond","type":"HIGH","state":"Virginia","country":"United States","zip":"23227"},"Education:{\"uuid\":\"fa986657-f01a-463f-bdf8-11a7581f689c\"}":{"__typename":"Education","uuid":"fa986657-f01a-463f-bdf8-11a7581f689c","school":{"__ref":"School:{\"uuid\":\"02adc620-31b4-46a7-b675-513fe7ab3beb\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0178f3bb-c43d-4bd8-b730-6b146040dc14\"}":{"__typename":"School","uuid":"0178f3bb-c43d-4bd8-b730-6b146040dc14","name":"University of Virginia","city":"Charlottesville","type":"COLLEGE","state":"Virginia","country":"United States","zip":"22904"},"Education:{\"uuid\":\"06934ff7-e0ef-4bc2-8b87-618cb2799d4d\"}":{"__typename":"Education","uuid":"06934ff7-e0ef-4bc2-8b87-618cb2799d4d","school":{"__ref":"School:{\"uuid\":\"0178f3bb-c43d-4bd8-b730-6b146040dc14\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"b0dcbfae-bd7d-48dc-9b54-902f4abc0678\"}":{"__typename":"MentorPublicProfile","uuid":"b0dcbfae-bd7d-48dc-9b54-902f4abc0678","displayName":"Aahil P.","slug":"aahil-pallath","biography":"\u003cp\u003eI'm a undergraduate student at UVA, a recognized public speaker, and someone who's able to toe the line between many fields of study and somehow bridge the gap between my major in neuroscience and future in the law.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEver since I was a kid I was obsessed with where we came from. The idea of consciousness and human existence as a whole was fascinating to me. Soon, I found myself knee-deep in evolutionary biology, ancient organisms, and the origins of our universe.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOnce I got myself out of the past and into the present, I started becoming all the more interested in human consciousness. In other words, I became more interested in how people think, how decisions are made, and how those decisions shape the world around us. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat’s what pushed me toward both neuroscience and public speaking. I wanted to understand the mind, and also learn how to communicate in a way that actually moves people. So I'm studying neuroscience and plan on going to law school. Two birds, one stone.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school, if you don't catch me studying for the LSAT, I spend time pushing metal in the gym, have my head stuffed inside of any book that's recently piqued my interest, or spend time with my friends and family.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also play volleyball, or practically any sport I can get my hands on, play video games as a substitute to constantly being on social media, and talk to as many people from as many walks of life that I can in my spare time.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm fundamentally curious in general, but have a particular curiosity towards getting to know people. It's certainly something that keeps life interesting. I'm just as excited to meet you, get to know you, as I am literally anyone else.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also spend a lot of time understanding the inner human world. What drives me, how I can be right to the people around me, and how I can continue to inspire myself to stay on the path towards becoming the man I want to be. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe that being curious and constantly seeking knowledge is one thing, but also being able to act on that knowledge when it counts is just as important.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA bit more about me: When I was in high school I won a total of five outstanding attorney awards in mock trial. In college, I competed at the national level. Placed highly and won many tournaments. Then I've directed plays. Volunteered. Raised money. Shadowed with doctors. Conducted chemistry research.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnd now I'm heeding the call to pay all of this forward towards (hopefully!) you.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"qkSUYMjeSMrK93MZFy2MzYBUtxujMmhpBH1v01PtO5Qk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"94838d4c-3193-406e-998e-a4b310df30ea\"}"},{"__ref":"Favorites:{\"uuid\":\"c4a7b298-76f5-4468-a789-16e957f383b7\"}"},{"__ref":"Favorites:{\"uuid\":\"abbfd2b7-f2be-411e-b46c-ee6cf4ead239\"}"}],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a5a974ab-f96f-4b4e-8449-86864f140275\"}"},{"__ref":"DeepDives:{\"uuid\":\"deefcdf
