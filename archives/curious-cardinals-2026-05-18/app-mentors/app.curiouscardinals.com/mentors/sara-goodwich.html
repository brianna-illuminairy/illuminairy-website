ght lead to.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8c63933a-82c2-4416-aaba-5cbcf6320fba\"}":{"__typename":"DeepDives","uuid":"8c63933a-82c2-4416-aaba-5cbcf6320fba","content":"\u003cp\u003eIt’s a chance to empower students, help them discover their strengths, and show them that they are capable of more than they think.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"34619cd3-4466-4953-8304-38c0eed7a0a7\"}":{"__typename":"DeepDives","uuid":"34619cd3-4466-4953-8304-38c0eed7a0a7","content":"\u003cp\u003eI had a strong passion for both math, science, and helping others in my community. Biomedical engineering was the perfect path to combine my strengths and interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"c30a2067-3efd-453b-a466-b2627db7b6fc\"}":{"__typename":"DeepDives","uuid":"c30a2067-3efd-453b-a466-b2627db7b6fc","content":"\u003cp\u003emy grandma (Nona) is my role model and the person I always look up to\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"2499e853-a83d-4c54-8ccb-b67fd10910d0\"}":{"__typename":"School","uuid":"2499e853-a83d-4c54-8ccb-b67fd10910d0","name":"Community School of Naples","city":"Naples","type":"HIGH","state":"Florida","country":"United States","zip":"34109"},"Education:{\"uuid\":\"69e7e420-b36e-46f7-9cf0-7948d99faff2\"}":{"__typename":"Education","uuid":"69e7e420-b36e-46f7-9cf0-7948d99faff2","school":{"__ref":"School:{\"uuid\":\"2499e853-a83d-4c54-8ccb-b67fd10910d0\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"c8bceaef-a6b1-4381-a4b2-89528f5be98b\"}":{"__typename":"Education","uuid":"c8bceaef-a6b1-4381-a4b2-89528f5be98b","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"34c119ef-99c0-4291-9933-f2fe9d51301a\"}":{"__typename":"MentorPublicProfile","uuid":"34c119ef-99c0-4291-9933-f2fe9d51301a","displayName":"Sara G.","slug":"sara-goodwich","biography":"\u003cp\u003eHi!! My name is Sara, and I am so excited to be part of Curious Cardinals!\u003cbr\u003e\u003cbr\u003eI am originally from Naples, Florida, but I currently live in Fort Lauderdale, Florida. When I am not working, you can usually find me at a workout class, trying a new restaurant, or hanging out with my family, friends, and my mini golden doodle (who I am SO obsessed with). I have also been a Make-A-Wish volunteer since I was 15, which has been such a meaningful part of my life and something I am still involved with today. Volunteering has taught me so much about empathy, community, and the importance of giving back.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI went to Vanderbilt University, where I majored in Biomedical Engineering and minored in Engineering Management. While I loved the challenge of my classes, some of my favorite experiences came outside of the classroom. At Vanderbilt, I was involved in research focused on kids with developmental disabilities. My project worked on creating new hearing assessments designed specifically for their needs, since the current method has not really been innovated since the 1980s and assumes typical development. That project eventually led to a published paper, which was a really exciting moment for me. It also showed me how science and engineering can directly improve and change people’s lives in meaningful ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I am a project engineer at a medical device company. I really enjoy the mix of problem-solving, teamwork, and impact. Every day is different, and it is rewarding to know that the projects I am working on are helping patients and making a difference in their quality of life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor me, mentorship is not just about sharing what I know. It’s about helping students find their passions, build confidence, and feel comfortable asking questions (no matter how big or small). As I have learned throughout my life and in my current job, there is truly no such thing as a silly question! I want to create a space where students feel supported while they explore new ideas and figure out what excites them most. Whether it is STEM topics, academic choices, or even life goals, I’m here to listen and guide them with encouragement.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am especially excited to be mentoring with Curious Cardinals because I know how powerful it can be to have someone in your corner who believes in you. I would love to play that role and cheer students on as they grow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am really looking forward to connecting, sharing my experiences, and also learning from the students I work with!\u003c/p
