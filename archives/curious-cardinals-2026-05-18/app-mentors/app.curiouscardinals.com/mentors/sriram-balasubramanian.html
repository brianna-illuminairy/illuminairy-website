xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e5d5d88d-7282-4bae-b62f-4d4fb2714697\"}":{"__typename":"DeepDives","uuid":"e5d5d88d-7282-4bae-b62f-4d4fb2714697","content":"\u003cp\u003eMentorship matters to me because throughout middle and high school, I handled much of my academics independently due to family circumstances. During that time, I would have greatly benefited from having someone to guide me through my classes, offer encouragement, and help me navigate challenges. That experience motivates me to be the mentor I once needed, someone who would not just give answers to homework but would provide support and confidence to students as they work toward their goals, while enabling them to truly absorb the content they learn.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5aab9dc9-26d7-4672-b040-5515442308df\"}":{"__typename":"DeepDives","uuid":"5aab9dc9-26d7-4672-b040-5515442308df","content":"\u003cp\u003eI chose to work in data science as for the longest time, I loved math and working with numbers, and also had an interest in coding, which data science combines statistics(which was my favorite field in math). In addition, being part of a family with a long history of health problems made me want to pursue a career where I could make a difference in the everyday lives of patients. Therefore, realized that I wanted to major in data science and specifically, work with healthcare data!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"3d400c8b-980c-4fe3-bd65-53e9b1fd3984\"}":{"__typename":"DeepDives","uuid":"3d400c8b-980c-4fe3-bd65-53e9b1fd3984","content":"\u003cp\u003eMy greatest source of motivation are my family members. Through everything I have been through and every obstacle I have faced, they have helped me through it all and have put a smile on my face no matter how big the obstacle. I want to spread this positiveness to this community through tutoring, which I find to make a strong and positive impact on students' learning and overall lives. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4c2be5c9-5cf6-4208-8af5-e70fa651bf83\"}":{"__typename":"DeepDives","uuid":"4c2be5c9-5cf6-4208-8af5-e70fa651bf83","content":"\u003cp\u003eIn my spare time, I love to exercise and meditate. While the two seem different at first glance(one is stressful to some extent and requires significant exertion, while in the other you just seemingly stay still), they are both similar in that they both provide you an escape from the business of the real world and help ground you. I find that exercising helps me keep up my discipline and motivation, while meditation gives me clarity, peace, and improves my focus and keeps me from procrastinating. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"a52f8a46-2251-4dc1-8f86-6b1a47099e18\"}":{"__typename":"School","uuid":"a52f8a46-2251-4dc1-8f86-6b1a47099e18","name":"Westview High School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92129"},"Education:{\"uuid\":\"13a89f33-72e4-4365-abd7-f91b8e6f242a\"}":{"__typename":"Education","uuid":"13a89f33-72e4-4365-abd7-f91b8e6f242a","school":{"__ref":"School:{\"uuid\":\"a52f8a46-2251-4dc1-8f86-6b1a47099e18\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"6ad5a0b2-75b4-495d-8e82-4a99506109f7\"}":{"__typename":"Education","uuid":"6ad5a0b2-75b4-495d-8e82-4a99506109f7","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"e2b9ce77-d527-4c52-a1db-4680263bd5db\"}":{"__typename":"MentorPublicProfile","uuid":"e2b9ce77-d527-4c52-a1db-4680263bd5db","displayName":"Sriram B.","slug":"sriram-balasubramanian","biography":"\u003cp\u003eI am a student at UC Berkeley studying Data Science with a focus in business applications. What motivates me most about my field is the ability to use data thoughtfully and responsibly to understand real-world problems and guide better decision-making. I am especially interested in how quantitative tools like coding, statistics, and analytical reasoning can take complex, messy information and turn it into insights that are actually useful. To me, data science isn’t just about numbers or models but it's also about asking the right questions and using evidence to support clear conclusions.\u003c/p\u003e\u003cp\u003eAcademically, my coursework spans mathematics, advanced data science, and computer science, along with Berkeley’s breadth classes that push me to think critically beyond technical subjects. Through classes in probability, statistics, machine learning, and programming, I have built a strong foundation in analyzing data using tools like Python. These courses have taught me how to approach problems methodically, test assumptions, and interpret results rather than just compute them. With my business focus, I’m constantly thinking about how these technical skills translate to real world metrics whether that involves evaluating performance, identifying trends, or understanding trade-offs in decision-making. I enjoy breaking down abstract concepts and figuring out how to explain not only how something works, but why it matters.\u003c/p\u003e\u003cp\u003eAlongside my coursework, I work as an intern at a startup called wombat3 media, where I apply what I learn in class to real problems. This experience has overall been very valuable in showing me how data science works outside of textbooks. I’ve learned how to deal with imperfect data and collaborate with people from different backgrounds, and communicate results clearly to non-technical audiences. These skills have shaped the way I approach tutoring, emphasizing clarity, patience, and adaptability.\u003c/p\u003e\u003cp\u003eOutside of academics and work, I also enjoy running and exercising, which play an important role in my life. Staying active helps me effectively manage stress, stay disciplined, and maintain focus which are qualities that directly support my academic and professional growth. Overall, I’m motivated, approachable, and committed to helping students build confidence in quantitative subjects by making challenging material feel understandable, relevant, and manageable.\u003c/p\u003e","teachingVideoPlaybackId":"M2BnMN9vNYnXYtGze4wtLGRi4I007Qq4kIvDGDUviVfk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e5d5d88d-7282-4bae-b62f-4d4fb2714697\"}"},{"__ref":"DeepDives:{\"uuid\":\"5aab9dc9-26d7-4672-b040-5515442308df\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d400c8b-980c-4fe3-bd65-53e9b1fd3984\"}"},{"__ref":"DeepDives:{\"uuid\":\"4c2be5c9-5cf6-4208-8af5-e70fa651bf83\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/372d24e2-411a-4f68-9a15-0480440f769a/-/preview/-/format/jpg/","https://ucarecdn.com/e12e668a-fdaa-4ffd-a3be-c8889f79354f/-/preview/-/format/jpg/","https://ucarecdn.com/45d9e94e-9b91-4c62-9879-5c2d06d95e44/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"13a89f33-72e4-4365-abd7-f91b8e6f242a\"}"},{"__ref":"Education:{\"uuid\":\"6ad5a0b2-75b4-495d-8e82-4a99506109f7\"}"}],"hiredAt":"2025-12-15T18:57:52.416Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Chemistry","Biology","Physics","6-8 Grade Science","Writing","Academic Coaching","College Essay Writing","Computer Science","History","Reading"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sriram-balasubramanian\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e2b9ce77-d527-4c52-a1db-4680263bd5db\"}"}}},"_sentryTraceData":"171d86db9a444bf08c3e0a3d017710c8-93c53b4c92e802cb-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=171d86db9a444bf08c3e0a3d017710c8,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sriram-balasubra
