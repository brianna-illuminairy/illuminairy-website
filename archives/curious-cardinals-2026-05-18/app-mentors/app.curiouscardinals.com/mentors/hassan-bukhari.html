xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"edf10b1d-98e6-4b38-affd-997e2df331a8\"}":{"__typename":"DeepDives","uuid":"edf10b1d-98e6-4b38-affd-997e2df331a8","content":"\u003cp\u003eStress is manageable; find the right tools for it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b287f877-e397-402b-aacb-7933064e87a8\"}":{"__typename":"DeepDives","uuid":"b287f877-e397-402b-aacb-7933064e87a8","content":"\u003cp\u003eI want to inspire and pass on the mentorship I have received. I want to help you build a passion project that not only enables you to learn and get into a top college but also shapes your interests and brings you one step closer to your dreams.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e1917f4e-be0b-44fe-bb50-a07e3f44624e\"}":{"__typename":"DeepDives","uuid":"e1917f4e-be0b-44fe-bb50-a07e3f44624e","content":"\u003cp\u003eHealthcare is evolving rapidly, creating an increasing demand for computational biologists to interpret complex biological data. I pursued my passion for computational biology by building a strong foundation in both biology and computer science, merging my majors to create a complete interdisciplinary experience. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"2e070995-3941-459b-b938-0fbd930ab1fe\"}":{"__typename":"DeepDives","uuid":"2e070995-3941-459b-b938-0fbd930ab1fe","content":"\u003cp\u003eI hope to create a univeristy focused on science of learning and project-based learning in Pakistan.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"abc28754-8503-4042-a3c9-2f878d117c64\"}":{"__typename":"School","uuid":"abc28754-8503-4042-a3c9-2f878d117c64","name":"The City School Rawal Campus","city":"Rawalpindi","type":"HIGH","state":"Islamabad Capital Territory","country":"Pakistan","zip":"46000"},"Education:{\"uuid\":\"c269b68a-d4ee-4508-9964-c81b8bbe7775\"}":{"__typename":"Education","uuid":"c269b68a-d4ee-4508-9964-c81b8bbe7775","school":{"__ref":"School:{\"uuid\":\"abc28754-8503-4042-a3c9-2f878d117c64\"}"},"startYear":"2016","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}":{"__typename":"School","uuid":"0a298df6-dac8-4a1d-8e35-77e7b609185d","name":"Minerva University","city":"San Francisco","type":"COLLEGE","state":"California","country":"United States","zip":"94103"},"Education:{\"uuid\":\"6ac2806a-bd84-4842-85d1-b4f11ce51097\"}":{"__typename":"Education","uuid":"6ac2806a-bd84-4842-85d1-b4f11ce51097","school":{"__ref":"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biochemistry and Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"76b4f34f-8b85-451f-ad3d-42643255db2c\"}":{"__typename":"MentorPublicProfile","uuid":"76b4f34f-8b85-451f-ad3d-42643255db2c","displayName":"Syed Hassan B.","slug":"hassan-bukhari","biography":"\u003cp\u003eHassan studied CS and Biochemistry at Minerva University, named the World's #1 Innovative University, where he had the unique opportunity to live in six countries (Korea, Taiwan, Argentina, Germany, the UK, and the U.S.) as part of his university curriculum. This experience shaped his global outlook and sparked a passion for building across borders. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHe is currently a bioinformatics researcher at UCSF, where he develops machine learning models and web applications to aid clinicians in interpreting complex genomic data. Hassan also co-founded a biotech startup using RNA therapeutics to treat liver fibrosis and supports operations at Labcore Scientific, a startup providing R\u0026amp;D services to early-stage life sciences companies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOver the past four years, Hassan has mentored students from 20+ countries and was recognized with the 2024 Impact Award for Research and Technology by Crimson Education. His students have received over 300 offers from top universities, including Brown, Cornell, Dartmouth, UPenn, Caltech, Duke, Johns Hopkins, Northwestern, CMU, NYU, Stanford, UCLA, UC Berkeley, and Oxford.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eHassan brings hands-on experience across several interdisciplinary fields, especially at the intersection of \u003cstrong\u003ebiology\u003c/strong\u003e, \u003cstrong\u003echemistry\u003c/strong\u003e, and \u003cstrong\u003ecomputer science\u003c/strong\u003e:\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDeveloped a melanoma diagnosis app with a San Francisco based startup.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWon multiple international hackathons including COVID-19 detection app, machine learning models to predict reversal of liver fibrosis.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eApplied data science techniques to analyze single-cell RNA-seq data for neurodegenerative disease models.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConducted research internships in biofuel and nanomaterial labs, synthesizing nanoparticles for biodiesel and bioplastics.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked with UCSF, USC, KGI, BMS on research projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eContributed to cell and tissue engineering at National Taiwan University.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePublished multiple papers in Q1 journals on IgG biosensors and Bioinformatics.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHe also bridges \u003cstrong\u003eneuroscience\u003c/strong\u003e, \u003cstrong\u003epsychology\u003c/strong\u003e, and \u003cstrong\u003ecreative\u003c/strong\u003e \u003cstrong\u003ewriting\u003c/strong\u003e in ways that bring science to life:\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePublished studies on traumatic brain injuries and receptive disorders.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCollaborated with psychologists on case studies.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExplored machine learning applications in linguistics and science communication\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFounded science and news journals, Young Global Scientist and Seriously.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePublished a poetry book, Bloom of Grief, on Amazon.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHis passion for building ideas into impact has also led to \u003cstrong\u003esuccessful passion projects:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e1. Launched a mental health podcast focused on U.S. healthcare.\u003c/p\u003e\u003cp\u003e2. Developed a Telegram bot for weather warnings.\u003c/p\u003e\u003cp\u003e3. Built a prosthetic limb simulator.\u003c/p\u003e\u003cp\u003e4. Engineered sustainable biopolymers for a clothing brand.\u003c/p\u003e\u003cp\u003e5. Built an EdTech startup for tutoring neurodivergent kids.\u003c/p\u003e\u003cp\u003e6. Developed and marketed an eczema cream, successfully sold in three countries.\u003c/p\u003e\u003cp\u003e7. Created a food startup, focusing on brain development and focus.\u003c/p\u003e\u003cp\u003e8. Published a book on Amazon about the genetics of race.\u003c/p\u003e\u003cp\u003e9. Researched early retirement due to sports injuries for a pre-med student.\u003c/p\u003e\u003cp\u003e10. Published a paper on breeding rare beetles in Japan\u003c/p\u003e\u003cp\u003e11. Published a paper on sustainable practices for plastic manafacturing in China and Singapore.\u003c/p\u003e\u003cp\u003e12. Supported students in founding clubs on mental health, biology, and physics olympiads.\u003c/p\u003e","teachingVideoPlaybackId":"02PVdF02yqAs7LQ01dzL5EKUcXAbQxSBi8Yj00Zmor9702o00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eHassan has received the 2024 Impact Award for Research and Technology by Crimson Education for his mentoring. Additionally, he has won first place at UCSF UREKA Ideathon for his research proposal on RNA therapy to treat liver fibrosis. \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Biochemistry and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"edf10b1d-98e6-4b38-affd-997e2df331a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"b287f877-e397
