xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"958f0cb1-25c7-40c5-9bf4-2bffb17a501c\"}":{"__typename":"Favorites","uuid":"958f0cb1-25c7-40c5-9bf4-2bffb17a501c","photoUrl":"https://ucarecdn.com/517d7163-0018-46e9-9ad8-889f7be38cbb/","title":"A Tree Grows in Brooklyn","type":"BOOK"},"Favorites:{\"uuid\":\"02c942a9-b22f-4a4f-875c-600a073b653f\"}":{"__typename":"Favorites","uuid":"02c942a9-b22f-4a4f-875c-600a073b653f","photoUrl":"https://ucarecdn.com/517d7163-0018-46e9-9ad8-889f7be38cbb/","title":"Mamma Mia!","type":"MOVIE"},"Favorites:{\"uuid\":\"1d820ff3-ceb1-413b-9404-11f8bc68b5e9\"}":{"__typename":"Favorites","uuid":"1d820ff3-ceb1-413b-9404-11f8bc68b5e9","photoUrl":"https://ucarecdn.com/517d7163-0018-46e9-9ad8-889f7be38cbb/","title":"Red (Taylor's Version)","type":"ALBUM"},"CausesSupported:{\"uuid\":\"b54dece6-c183-4864-b80b-9ad65ad3ec5a\"}":{"__typename":"CausesSupported","uuid":"b54dece6-c183-4864-b80b-9ad65ad3ec5a","name":"Camp Kesem","description":"\u003cp\u003eFormer Unit Leader and Counselor for Camp Kesem's Connecticut Chapter.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/602381b2-4edf-49cf-8bf0-c66cb000faee/"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1d8bf87f-ca0f-44c5-8d28-2791075725bc\"}":{"__typename":"DeepDives","uuid":"1d8bf87f-ca0f-44c5-8d28-2791075725bc","content":"\u003cp\u003eI want to write and publish a novel at some point in my life! I love reading fiction, but there is something about the writing process that unlocks type of excitement and creativity I can't find anywhere else. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f266f162-cb4a-4498-b30c-c24f1d2dc7f7\"}":{"__typename":"DeepDives","uuid":"f266f162-cb4a-4498-b30c-c24f1d2dc7f7","content":"\u003cp\u003eBe you! As a young person it is so easy to want to \"fit in,\" but embracing your own style, interests, and ideas is super cool! I wish I knew that sooner. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"d86b641e-5eb1-4315-9c34-4d021acdc799\"}":{"__typename":"DeepDives","uuid":"d86b641e-5eb1-4315-9c34-4d021acdc799","content":"\u003cp\u003eI have had several people throughout my life who have inspired me and shaped me into the person I am today. I want to pay it forward and be that person for someone else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"69e7c8eb-2498-49de-93dd-e1a7fe92c10f\"}":{"__typename":"DeepDives","uuid":"69e7c8eb-2498-49de-93dd-e1a7fe92c10f","content":"\u003cp\u003eI chose Cognitive Science as my major because of its interdisciplinary nature! This field uses many different lenses, such as neuroscience, philosophy, computer science, economics, and psychology to understand human nature, which sounded so fascinating to me from the beginning. My professors encouraged me to look at a problem from multiple perspectives, which  has been invaluable in my research career. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"f16409d3-d077-428b-91cc-9762f8f2db8b\"}":{"__typename":"School","uuid":"f16409d3-d077-428b-91cc-9762f8f2db8b","name":"Lake Highland Preparatory School","city":"Orlando","type":"HIGH","state":"Florida","country":"United States","zip":"32803"},"Education:{\"uuid\":\"506b210b-3ed1-456a-a7f7-06d9ed7c44d6\"}":{"__typename":"Education","uuid":"506b210b-3ed1-456a-a7f7-06d9ed7c44d6","school":{"__ref":"School:{\"uuid\":\"f16409d3-d077-428b-91cc-9762f8f2db8b\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"ac095636-c27b-489c-8ac5-6435a4da6d6e\"}":{"__typename":"Education","uuid":"ac095636-c27b-489c-8ac5-6435a4da6d6e","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"563710ad-0f10-411c-9e3b-2fefab385dd3\"}":{"__typename":"MentorPublicProfile","uuid":"563710ad-0f10-411c-9e3b-2fefab385dd3","displayName":"Mary B.","slug":"mary-baumann","biography":"\u003cp\u003eHello! I’m Mary Baumann, and I’m a graduate student at Vanderbilt studying clinical psychology!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was raised in sunny Orlando, Florida and spent every day outside playing softball after finishing my homework. I always challenged myself to excel in the classroom, but I also strived to be a well-rounded person beyond my academic achievements. Playing competitive softball taught me discipline and grit, but it also taught me that it is okay to fail. You can’t go your whole life without striking out, which was an important lesson to learn early in my life (cue “Shake It Off” by Taylor Swift). I value exploring outside of my comfort zone, as it builds confidence, encourages creativity, and expands perspective, and I intend to embody this philosophy as a mentor.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e“You cannot swim for new horizons until you have courage to lose sight of the shore.”\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis mindset ultimately helped me succeed in a very competitive collegiate environment, where I knew I could manage majoring in a STEM subject while also being a student-athlete and participating in other extracurricular activities.\u0026nbsp;\u003c/p\u003e\u003cp\u003eBeing in such a challenging environment, I had to find what motivates me from within instead of relying on external sources of motivation. This can be difficult to figure out alone, so this is something I strive to unlock in students as a mentor. I think finding one’s spark and motivation early in life can only serve to benefit them, and I’m here to help!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I found a passion for psychological science and wanted to learn more about ways to use research to improve mental health and wellbeing. Now as a PhD student at Vanderbilt, I’m able to develop my own research projects to reach this goal, which challenges me to think both critically and creatively. \u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my research, I am a fellow for Metro Nashville Public Schools, working under a grant which offers free tutoring to all public school students who need it. I am passionate about making resources like this accessible to children regardless of their background.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love going for long walks, playing various outdoor sports, reading fiction, or trying new recipes! It is my mission to bake the world’s best chocolate cake (my favorite food).\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"958f0cb1-25c7-40c5-9bf4-2bffb17a501c\"}"},{"__ref":"Favorites:{\"uuid\":\"02c942a9-b22f-4a4f-875c-600a073b653f\"}"},{"__ref":"Favorites:{\"uuid\":\"1d820ff3-ceb1-413b-9404-11f8bc68b5e9\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b54dece6-c183-4864-b80b-9ad65ad3ec5a\"}"}],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1d8bf87f-ca0f-44c5-8d28-2791075725bc\"}"},{"__ref":"DeepDives:{\"uuid\":\"f266f162-cb4a-4498-b30c-c24f1d2dc7f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"d86b641e-5eb1-4315-9c34-4d021acdc799\"}"},{"__ref":"DeepDives:{\"uuid\":\"69e7c8eb-2498-49de-93dd-e1a7fe92c10f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d3075dc9-3ec3-41cc-906a-7b45d3978e01/-/preview/-/format/jpg/","https://ucarecdn.com/7d47b5ca-af70-449f-9485-fd837b9ab7a9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"506b210b-3ed1-456a-a7f7-06d9ed7c44d6\"}"},{"__ref":"Education:{\"uuid\":\"ac095636-c27b-489c-8ac5-6435a4da6d6e\"}"}],"hiredAt":"2023-10-09T06:57:19.031Z","topics":["Reading","STEM Project","Statistics","Algebra I","Pre-Algebra","K-5 Grade Math","Academic Coaching","Executive Function","College Essay Writing","Creative Writing","Writing"],"communityBadges":["https://ucarecdn.com/3fe96660-66b0-4395-b48d-3044e8987993/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"in
