xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5d562280-4fea-423c-a09e-864737e5efc5\"}":{"__typename":"Favorites","uuid":"5d562280-4fea-423c-a09e-864737e5efc5","photoUrl":"https://ucarecdn.com/a4dc429e-27bf-4f60-9c3a-818b47943933/","title":"Stevie Wonder","type":"ARTIST"},"Favorites:{\"uuid\":\"d26c4405-f946-44e0-9519-8f17afe0a1ef\"}":{"__typename":"Favorites","uuid":"d26c4405-f946-44e0-9519-8f17afe0a1ef","photoUrl":"https://ucarecdn.com/1ce444a5-f66a-47e6-8586-0d268c4054a1/","title":"Homegoing by Yaa Gyasi","type":"BOOK"},"Favorites:{\"uuid\":\"af3ffe40-bbba-4113-85d3-7b174b5f0b48\"}":{"__typename":"Favorites","uuid":"af3ffe40-bbba-4113-85d3-7b174b5f0b48","photoUrl":"https://ucarecdn.com/8b50ee64-d5e7-4c21-a265-106e20cc0ea9/","title":"Allyson Felix","type":"ATHLETE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5282298d-b956-4a69-a40a-c12cacba4755\"}":{"__typename":"DeepDives","uuid":"5282298d-b956-4a69-a40a-c12cacba4755","content":"\u003cp\u003eMentorship matters because it is important to incentivize youth to be catalysts for change. Because of the constant access to news, it has become easy to \"doom scroll\" or lose hope in the joy of learning. I hope my mentee's work in curious cardinals will springboard their passion for public service or social justice work that will serve as a domino effect that will change other people's lives. Mentorship is essential for women of color to have mentors who will look like them with shared experiences to make the mentee feel seen and understood.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"3584c242-0b52-41d2-a0df-57c8b6f9b522\"}":{"__typename":"DeepDives","uuid":"3584c242-0b52-41d2-a0df-57c8b6f9b522","content":"\u003cp\u003eI delivered mail on a mailboat! I live on a 17-mile lake in upstate New York and would pick up the mail early in the morning, sort it, and deliver the mail during a 3-hour cruise every day!  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"e08a90ea-2bc7-4cc3-bb74-7a9ab05e3244\"}":{"__typename":"DeepDives","uuid":"e08a90ea-2bc7-4cc3-bb74-7a9ab05e3244","content":"\u003cp\u003eI am teaching my mentee about the lack of people of color's voices on climate change in the media. It is important to be cognizant when reading the news and, more importantly, know how to seek out media centered on those most impacted.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"d54d3f92-41b9-42cd-a531-cdb915fa0c83\"}":{"__typename":"Education","uuid":"d54d3f92-41b9-42cd-a531-cdb915fa0c83","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"International and Public Affairs","degree":"Bachelors"},"School:{\"uuid\":\"8294116e-a190-41eb-a458-e542ee61c042\"}":{"__typename":"School","uuid":"8294116e-a190-41eb-a458-e542ee61c042","name":"St. Paul's School","city":"Concord","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03301"},"Education:{\"uuid\":\"e8b8c96d-c757-41f7-be3c-c094612198c3\"}":{"__typename":"Education","uuid":"e8b8c96d-c757-41f7-be3c-c094612198c3","school":{"__ref":"School:{\"uuid\":\"8294116e-a190-41eb-a458-e542ee61c042\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"a3b42bce-da24-4f46-9d11-cf97a5107a71\"}":{"__typename":"MentorPublicProfile","uuid":"a3b42bce-da24-4f46-9d11-cf97a5107a71","displayName":"Cecilia M.","slug":"cecilia-marrinan","biography":"\u003cp\u003eCecilia Marrinan a senior majoring in international and public affairs at Brown University. In 2020 she graduated from St. Paul’s School and attended the German Language School in Prenzlauerberg, Berlin, the semester before college started. Outside of academics, Cecilia is the President of Brown College Democrats, loves to read, and is always looking for music recommendations. \u003cbr\u003e\u003cbr\u003eIn Summer of 2023, Cecilia interned in the White House Office of Public Engagement and in 2022, interned for National Geographic. There she helped develop National Geographic-funded project, Project 2892 Miles to Go: A Geographic Walk for Justice. \u003cbr\u003e\u003cbr\u003eFrom 2020 - 2022, Cecilia was a sprinter on Brown’s varsity track team (NCAA D1).  She is excited to guide her mentees toward discovering their full potential for academic and personal success. Additionally, she believes that teaching is a two-way street and is excited to be inspired by her mentee as well!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThis summer I interned in the White House Office of Public Engagement! was an honor to contribute to this Office’s mission to create a two-way dialogue at local, state, and national levels to translate citizens’ concerns into Administrative action.\u003cbr\u003e\u003cbr\u003eI supported various portfolios such as labor workers, global engagement, and private sector outreach and I conducted in-depth research analysis for strategic stakeholder engagement.\u0026nbsp;My firsthand observations of intentional public engagement reaffirmed my hope for a brighter future :) \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5d562280-4fea-423c-a09e-864737e5efc5\"}"},{"__ref":"Favorites:{\"uuid\":\"d26c4405-f946-44e0-9519-8f17afe0a1ef\"}"},{"__ref":"Favorites:{\"uuid\":\"af3ffe40-bbba-4113-85d3-7b174b5f0b48\"}"}],"causesSupported":[],"major":"International and Public Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5282298d-b956-4a69-a40a-c12cacba4755\"}"},{"__ref":"DeepDives:{\"uuid\":\"3584c242-0b52-41d2-a0df-57c8b6f9b522\"}"},{"__ref":"DeepDives:{\"uuid\":\"e08a90ea-2bc7-4cc3-bb74-7a9ab05e3244\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/49594691-b526-4785-8d8b-3145f21bffb5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d54d3f92-41b9-42cd-a531-cdb915fa0c83\"}"},{"__ref":"Education:{\"uuid\":\"e8b8c96d-c757-41f7-be3c-c094612198c3\"}"}],"hiredAt":"2023-01-28T00:54:19.580Z","topics":["Sustainability","Women \u0026 Gender Studies","Law / Government / Policy","Race \u0026 Ethnicity","Writing","Journalism"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"cecilia-marrinan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a3b42bce-da24-4f46-9d11-cf97a5107a71\"}"}}},"_sentryTraceData":"85b1e88ed4e647a18ce80e911dd248f0-a008fba24c28c
