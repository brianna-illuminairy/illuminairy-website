xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e11af1f3-94e0-4240-9da4-cb68fa593785\"}":{"__typename":"DeepDives","uuid":"e11af1f3-94e0-4240-9da4-cb68fa593785","content":"\u003cp\u003eI chose Cognitive Science because it’s an interdisciplinary field that brings together everything I’m passionate about: behavioral psychology, neuroscience, and language. It allows me to explore how the mind works from multiple angles, blending scientific research with human insight to better understand thought, emotion, and communication.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"3b56bbaf-d899-4130-b9cc-3629d9fca8c1\"}":{"__typename":"DeepDives","uuid":"3b56bbaf-d899-4130-b9cc-3629d9fca8c1","content":"\u003cp\u003eI am a trained acrobat!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"061dfd7d-1746-49c3-af88-56f6ce8ebe58\"}":{"__typename":"DeepDives","uuid":"061dfd7d-1746-49c3-af88-56f6ce8ebe58","content":"\u003cp\u003eIn short, I was a disorganized mess. I would often complete assignments late at night just before they were due and cram the morning of exams. Eventually, I had to learn how to adapt my schedule to my own learning style. Once I did, my academic performance improved significantly, and that shift led to the success I experienced later on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7f9f75fe-249d-42f9-abbe-e57e16c421dc\"}":{"__typename":"DeepDives","uuid":"7f9f75fe-249d-42f9-abbe-e57e16c421dc","content":"\u003cp\u003eIn my spare time, I love to explore. Being in new places, whether a different city or just an unfamiliar corner of campus, is one of my favorite things. College has given me countless opportunities to discover new environments, and I try to take full advantage of every chance to wander and learn.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"8d582739-7652-4fec-9820-9de212ae08d6\"}":{"__typename":"School","uuid":"8d582739-7652-4fec-9820-9de212ae08d6","name":"Crossroads School for Arts \u0026 Sciences","city":"Santa Monica","type":"HIGH","state":"California","country":"United States","zip":"90404"},"Education:{\"uuid\":\"41083a07-76fd-4098-9569-bda33385380e\"}":{"__typename":"Education","uuid":"41083a07-76fd-4098-9569-bda33385380e","school":{"__ref":"School:{\"uuid\":\"8d582739-7652-4fec-9820-9de212ae08d6\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"26a5aae1-be7c-466d-856a-850a07f86ff5\"}":{"__typename":"Education","uuid":"26a5aae1-be7c-466d-856a-850a07f86ff5","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"279bdbf8-eb17-435c-bb3f-22668ca83065\"}":{"__typename":"MentorPublicProfile","uuid":"279bdbf8-eb17-435c-bb3f-22668ca83065","displayName":"Brody West F.","slug":"brodywest-falchuk","biography":"\u003cp\u003eHello! My name is Brody, and I’m a current undergraduate at Yale University studying Cognitive Science. Cognitive Science sits at the intersection of psychology, neuroscience, and language—fields that have always fascinated me because they explore how we think, feel, and connect with one another. I spend most of my academic time working in Yale’s psychology and neuroscience research labs, where I help investigate everything from memory and attention to social cognition and emotional processing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond the classroom and lab, I’m passionate about creative expression and innovation. I currently work in as a perfumer doing research and development at companies like Diptyque and Heretic. Here, I combine my scientific background with design thinking to help bring new sensory experiences to life. This blend of art and science also fuels my love for writing—I’ve written screenplays and stage plays, and I’m always excited to help students develop their storytelling skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and work, I’m a member of one of Yale’s a cappella groups, The Bakers Dozen, which allows me to stay grounded and creative through music. I’m Proficient in English, Korean, Latin, and Italian, and I’m always eager to help students with language learning, classical studies, and cultural exchange.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love working with students who are curious, ambitious, and open to discovering new passions. Whether you’re struggling in a tough chemistry class, drafting your first play, prepping for psychology exams, or just need help getting organized and finding motivation, I’m here to help. I’m especially excited to support students who learn differently, who need extra encouragement, or who are searching for something they can feel truly proud of.\u003c/p\u003e","teachingVideoPlaybackId":"LdiEm101KfognRpZvJwAw7yi3VIPn4HgbpFon6wlIea8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e11af1f3-94e0-4240-9da4-cb68fa593785\"}"},{"__ref":"DeepDives:{\"uuid\":\"3b56bbaf-d899-4130-b9cc-3629d9fca8c1\"}"},{"__ref":"DeepDives:{\"uuid\":\"061dfd7d-1746-49c3-af88-56f6ce8ebe58\"}"},{"__ref":"DeepDives:{\"uuid\":\"7f9f75fe-249d-42f9-abbe-e57e16c421dc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2d581c8a-8cb9-407a-99f9-a0f3c3750dcf/-/preview/-/format/jpg/","https://ucarecdn.com/e33a47f1-b44e-4d3d-9ff3-cda9fe753b51/-/preview/-/format/jpg/","https://ucarecdn.com/7a409563-587f-455b-ae1c-3c5e993cbedd/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"41083a07-76fd-4098-9569-bda33385380e\"}"},{"__ref":"Education:{\"uuid\":\"26a5aae1-be7c-466d-856a-850a07f86ff5\"}"}],"hiredAt":"2025-05-07T12:55:06.226Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Physics","Writing","Latin","College Essay Writing","History","Executive Function","Academic Coaching","Reading","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Business / Entrepreneurship","Web Design","STEM Project","Public Speaking"],"communityBadges":
