xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a8ed30a0-03e6-410e-9311-2b64016820a7\"}":{"__typename":"DeepDives","uuid":"a8ed30a0-03e6-410e-9311-2b64016820a7","content":"\u003cp\u003eDon’t be afraid to ask questions or make mistakes—every step, even the missteps, helps you grow. Stay curious, be patient with yourself, and trust that you’re capable of more than you realize.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8453ea6a-c510-47b9-82df-0aaebb6a19bb\"}":{"__typename":"DeepDives","uuid":"8453ea6a-c510-47b9-82df-0aaebb6a19bb","content":"\u003cp\u003eMentorship matters to me because it’s the bridge between potential and achievement. Growing up, I didn’t always have someone to guide me through unfamiliar paths, and that made the journey feel daunting at times. As a first-generation college student, I know how transformative it is to have someone who believes in you, shares their experiences, and helps you navigate challenges. Mentorship is my way of paying it forward—helping others realize their abilities, build confidence, and open doors to opportunities they might not have imagined for themselves. It’s incredibly rewarding to see someone grow and succeed because of the support and encouragement you’ve shared.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7b689671-39c0-4223-9add-baa41ab4eff4\"}":{"__typename":"DeepDives","uuid":"7b689671-39c0-4223-9add-baa41ab4eff4","content":"\u003cp\u003eDuring my high school summers, I kept busy with a mix of work, fitness, and fun. I worked as a soccer referee, where I learned how to stay calm under pressure and make quick decisions—skills that help me even now. I also worked at McDonald’s, which taught me the value of hard work and teamwork.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work, I’m a foodie at heart, so I made it a goal to try food from as many places as I could, discovering new favorites along the way. I also balanced all the eating with regular gym sessions, building both strength and discipline. Those summers weren’t just about keeping busy—they helped me grow, try new things, and connect with people from all walks of life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"19b13e1c-0e13-48c6-aefb-af2a06cebd3c\"}":{"__typename":"DeepDives","uuid":"19b13e1c-0e13-48c6-aefb-af2a06cebd3c","content":"\u003cp\u003eOne of my favorite passion projects was creating predictive health analytics for endangered lemurs during my internship at the Duke Lemur Center. Combining my love for animals and my interest in data science, I used Python and R to analyze lemur health data, helping researchers make informed decisions to support conservation efforts. This project was especially meaningful because it merged technology and wildlife preservation—two areas I care deeply about. It showed me how powerful computer science can be in addressing real-world challenges and inspired me to explore more ways to make an impact through tech.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"e7121b3c-3947-4776-a952-e7e2c43d92e5\"}":{"__typename":"School","uuid":"e7121b3c-3947-4776-a952-e7e2c43d92e5","name":"J.R. Tucker High School","city":"Henrico","type":"HIGH","state":"Virginia","country":"United States","zip":"23294"},"Education:{\"uuid\":\"aacd6236-ef8e-4adb-a435-3ec97b47f2eb\"}":{"__typename":"Education","uuid":"aacd6236-ef8e-4adb-a435-3ec97b47f2eb","school":{"__ref":"School:{\"uuid\":\"e7121b3c-3947-4776-a952-e7e2c43d92e5\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"9cafe62e-30d3-454f-ad65-59f7cd1a7f11\"}":{"__typename":"Education","uuid":"9cafe62e-30d3-454f-ad65-59f7cd1a7f11","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"52b03471-316f-4380-9269-a4d2bb8bee74\"}":{"__typename":"MentorPublicProfile","uuid":"52b03471-316f-4380-9269-a4d2bb8bee74","displayName":"All K.","slug":"all-kibria","biography":"\u003cp\u003eHi, I’m \u003cstrong\u003eAll Kibria\u003c/strong\u003e, and I’m thrilled to mentor for Curious Cardinals! As a first-generation college student from a low-income background, I deeply understand the challenges that come with navigating new opportunities—especially in fields like computer science that can feel intimidating or out of reach at first. Growing up as the oldest sibling, I naturally took on a teaching and mentoring role early in life. Whether that meant tutoring younger students in math, teaching STEM camps for middle schoolers, or working collaboratively with peers in college, I’ve always found joy in helping others learn and grow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m currently pursuing a \u003cstrong\u003eBachelor of Science in Computer Science and Economics at Duke University\u003c/strong\u003e on a full academic scholarship. My journey into computer science wasn’t straightforward. I didn’t grow up knowing how to code, and for a long time I wasn’t even sure computer science was the right path for me. What changed was exposure—through classes, hackathons, mentorship, and hands-on experience, I discovered how powerful and creative technology can be when used to solve real-world problems. That realization completely reshaped how I saw myself and what I believed was possible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve interned at \u003cstrong\u003ePepsiCo\u003c/strong\u003e, where I worked on immersive and technical projects that combined creativity with engineering, and I’ll soon be interning at \u003cstrong\u003eNASA\u003c/strong\u003e and \u003cstrong\u003eChevron\u003c/strong\u003e, continuing to apply software and engineering skills in high-impact, real-world environments. Along the way, I’ve worked on projects ranging from predictive health analytics for endangered species to building engaging applications, gaining strong experience in Python, JavaScript, and other tools. These experiences have shown me that computer science isn’t just about writing code—it’s about problem-solving, curiosity, and persistence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to technology, I’m also a \u003cstrong\u003estudent photographer\u003c/strong\u003e, capturing everything from Duke basketball games to weddings. Photography has strengthened my creativity, attention to detail, and communication skills, and it’s taught me how to tell stories visually—skills that translate surprisingly well into technical work and mentoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics and internships, I’m passionate about making complex topics approachable and exciting. I know firsthand how overwhelming learning to code can feel, especially when you’re starting from scratch. But I truly believe that with the right guidance, patience, and encouragement, anyone can succeed. Mentorship has played a huge role in my own growth, and I’ve seen its impact through tutoring math, guiding students through hackathons, and supporting peers in challenging technical coursework.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf your child is curious about computer science, wants to build problem-solving skills, or simply needs someone who understands what it’s like to start with uncertainty, I’d love to help them grow their confidence and discover their potential. Let’s make learning fun, approachable, and empowering—together.\u003c/p\u003e","teachingVideoPlaybackId":"W7AoAOobAa02dmZThxsUBaX01VjyRXf85wfS9iVfZw56E","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a8ed30a0-03e6-410e-9311-2b64016820a7\"}"},{"__ref":"DeepDives:{\"uuid\":\"8453ea6a-c510-47b9-82df-0aaebb6a19bb\"}"},{"__ref":"DeepDives:{\"uuid\":\"7b689671-39c0-4223-9add-baa41ab4eff4\"}"},{"__ref":"DeepDives:{\"uuid\":\"19b13e1c-0e13-48c6-aefb-af2a06cebd3c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2d9f6c8d-9a0b-4cdd-a6f8-7177a1b02442/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"aacd6236-ef8e-4adb-a435-3ec97b47f2eb\"}"},{"__ref":"Education:{\"uuid\":\"9cafe62e-30d3-454f-ad65-59f7cd1a7f11\"}"}],"hiredAt":"2025-01-04T22:34:32.026Z","topics":["Computer Science","Economics","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Game Design","Machine Learning / AI","Robotics / Electronics / CAD","STEM Project","Web Design"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/","https://ucarecdn.com/c942d968-716c-4352-9dd1-9c8441a54458/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"all-kibria\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"52b03471-316f-4380-9269-a4d2bb8bee74\"}"}}},"_sentryTraceData":"089f2ffc24ce4ec9a9c9bbaa87d0c32a-9d1f4fb5c86617e0-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=089f2ffc24ce4ec9a9c9bbaa87d0c32a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"all-kibria"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
