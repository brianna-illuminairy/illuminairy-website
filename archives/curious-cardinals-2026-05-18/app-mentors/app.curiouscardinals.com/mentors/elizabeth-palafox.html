xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"aad3ca19-f2a4-4501-8e95-5840e534853c\"}":{"__typename":"Favorites","uuid":"aad3ca19-f2a4-4501-8e95-5840e534853c","photoUrl":"https://ucarecdn.com/30220cf0-300c-4e21-82d4-86c8a25660d3/","title":"Running!","type":"SPORT"},"Favorites:{\"uuid\":\"e69cabb2-63ca-41b1-b753-4b4a70388c82\"}":{"__typename":"Favorites","uuid":"e69cabb2-63ca-41b1-b753-4b4a70388c82","photoUrl":"https://ucarecdn.com/31ef7f2d-174e-4ef3-a10d-486e490746d3/","title":"Taylor Swift!","type":"ARTIST"},"Favorites:{\"uuid\":\"b1990272-6248-4eac-866c-0eb775f5b48f\"}":{"__typename":"Favorites","uuid":"b1990272-6248-4eac-866c-0eb775f5b48f","photoUrl":"https://ucarecdn.com/e3fd9058-58be-4d7a-b043-c1f5c064c9f2/","title":"FC Barcelona","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1b9f1ab2-584f-4b62-997e-de8434627879\"}":{"__typename":"DeepDives","uuid":"1b9f1ab2-584f-4b62-997e-de8434627879","content":"\u003cp\u003eI would encourage myself to be less afraid of failure and pursue any opportunity that seems interesting. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"125025ec-3eea-4926-bee3-d617b8140096\"}":{"__typename":"DeepDives","uuid":"125025ec-3eea-4926-bee3-d617b8140096","content":"\u003cp\u003eAfter working as a researcher, I would love to teach an introductory science course at the university level, focused on developing key skills to encourage students to believe in their abilities as future scientists. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"efaacedb-c4e5-4f2b-a9fa-b3a3e4448bf4\"}":{"__typename":"DeepDives","uuid":"efaacedb-c4e5-4f2b-a9fa-b3a3e4448bf4","content":"\u003cp\u003eI spent the majority of my summer volunteering at my elementary school's summer reading program, where I read with students and led arts and crafts activities. The last few weeks of my summer were dedicated to marching band camp, which consisted of practicing for 8 hours a week for three weeks!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e69980ad-59b7-4d76-8d96-588a2ce37c5c\"}":{"__typename":"DeepDives","uuid":"e69980ad-59b7-4d76-8d96-588a2ce37c5c","content":"\u003cp\u003eI refer to them as my \"silly little activities,\" but I love trying new things - from embroidering tote bags and jeans, learning to sew my own shirt, coloring in my anatomy coloring book, or even drawing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2ec275d4-9012-49e4-af09-101fd7d036ba\"}":{"__typename":"School","uuid":"2ec275d4-9012-49e4-af09-101fd7d036ba","name":"San Marcos High School","city":"San Marcos","type":"HIGH","state":"California","country":"United States","zip":"92078"},"Education:{\"uuid\":\"df392007-56e9-447e-a2f7-29ca49ac6844\"}":{"__typename":"Education","uuid":"df392007-56e9-447e-a2f7-29ca49ac6844","school":{"__ref":"School:{\"uuid\":\"2ec275d4-9012-49e4-af09-101fd7d036ba\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"20b70409-6072-49a5-966c-0d781ee4734b\"}":{"__typename":"Education","uuid":"20b70409-6072-49a5-966c-0d781ee4734b","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"879f07a7-e76b-458a-9844-b172b42ccc78\"}":{"__typename":"MentorPublicProfile","uuid":"879f07a7-e76b-458a-9844-b172b42ccc78","displayName":"Elizabeth P.","slug":"elizabeth-palafox","biography":"\u003cp\u003eHi! I'm a recent graduate from Stanford University, where I earned a Bachelor of Science in Chemistry with a minor in Biology, and a Master of Science in Bioengineering. I'm interested in the intersection of science, medicine, and health, and I plan to pursue graduate school in the near future!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my time as a student at Stanford University, I was driven by a passion for health equity and accessibility. I volunteered with the Cardinal Free Clinics, conducted a study on COVID-19 vaccine perceptions, and organized an Alternative Spring Break trip. My involvement with the Cardinal Free Clinics spanned four years, during which I served as Front Desk Chair, Course Coordinator for the clinic’s training course, and Recruitment Chair for prospective volunteers. Additionally, In collaboration with a team of undergraduates and medical students, I conducted a study on vaccine perceptions in agricultural communities, presenting our findings at multiple conferences and to the Stanford Vaccine Crew. Inspired by this experience, I partnered with another undergraduate to design a quarter-long course and lead a service-based learning trip through Stanford’s Alternative Spring Breaks program, focusing on Farmworker and Immigrant Health.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm also passionate about the field of bioscience and biotechnology, particularly in the development of therapeutics for disease treatment. I participated in several summer research programs, exploring my interests within the field of science. My main research experiences were in the \u003c/p\u003e\u003cp\u003e the Department of Chemistry and the Department of Bioengineering. My first project, under the Chemistry Department, focused on investigating a potential new mechanism underlying human cancers and metabolic diseases and contributing to a publication in the ACS Central Science journal. My second research experience, was in a protein engineering lab, where I am currently still work as a research assistant. My work focuses on testing a potential therapeutic for specific brain cancers. My interest in science is motivated by my love towards learning about biological processes and engineering new therapeutics to address medical diseases. I plan on continuing my work by pursuing a PhD in the biosciences, with the hope of making a meaningful contribution to the scientific community. \u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eDuring my final year at Stanford, I worked as a teaching assistant for Chemistry Department's general chemistry courses, composed primarily of first-year undergraduates. My responsibilities included teaching lab sessions, hosting office hours, and writing exam questions. I especially enjoyed making science engaging and approachable for students.  \u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI used my time at Stanford to explore my interests outside of academics. I joined a bachata dance team, Ritmo, the archery club, and worked as a Resident Assistant for undergraduate students and the high school summer session. I also enjoyed taking on small projects and new hobbies during my free time, especially those that get me outdoors and under the sun. I spent time sewing, embroidering, painting, and running.\u003c/p\u003e","teachingVideoPlaybackId":"1ij9eeo3B9mqM2fTp29I00ubnMQZ9qd4JkxYELcVgl100","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"aad3ca19-f2a4-4501-8e95-5840e534853c\"}"},{"__ref":"Favorites:{\"uuid\":\"e69cabb2-63ca-41b1-b753-4b4a70388c82\"}"},{"__ref":"Favorites:{\"uuid\":\"b1990272-6248-4eac-866c-0eb775f5b48f\"}"}],"causesSupported":[],"major":"Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1b9f1ab2-584f-4b62-997e-de8434627879\"}"},{"__ref":"DeepDives:{\"uuid\":\"125025ec-3eea-4926-bee3-d617b8140096\"}"},{"__ref":"DeepDives:{\"uuid\":\"efaacedb-c4e5-4f2b-a9fa-b3a3e4448bf4\"}"},{"__ref":"DeepDives:{\"uuid\":\"e69980ad-59b7-4d76-8d96-588a2ce37c5c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/88b68138-4173-4396-96ff-1c427bf0df9f/-/preview/-/format/jpg/","https://ucarecdn.com/780bf43b-1c59-423a-91e7-dd0aeef16261/-/preview/-/format/jpg/","https://ucarecdn.com/8fc03702-7320-41aa-83c4-e6437441ffaf/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"df392007-56e9-447e-a2f7-29ca49ac6844\"}"},{"__ref":"Education:{\"uuid\":\"20b70409-6072-49a5-966c-0d781ee4734b\"}"}],"hiredAt":"2025-09-08T18:38:06.124Z","topics":["Calculus","Statistics","Chemistry","Biology","Computer Science","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublic
