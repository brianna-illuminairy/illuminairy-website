xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a8b929f5-64c8-40dd-9b1f-c8367b5cee2b\"}":{"__typename":"DeepDives","uuid":"a8b929f5-64c8-40dd-9b1f-c8367b5cee2b","content":"\u003cp\u003eI have been active and apart of sport teams my entire life and when my collegiate soccer career came to an end in the fall of 2022, I decided to pick up running! I ran my first marathon this past February and I am currently training for my second marathon in October!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9f1a120b-e640-4f12-8bc6-58cee346033f\"}":{"__typename":"DeepDives","uuid":"9f1a120b-e640-4f12-8bc6-58cee346033f","content":"\u003cp\u003eI have always been interested in nature and how every organism seems to be in a balance with one another. I loved knowing how things worked within an organism, such as a plant or animal, and how it would interact with the environment around itself. Once I arrived to Colorado College, I still had the exciting yet daunting decision to determine what I would be studying for the next four years. During my first two years I was able to dive into the different classes that interested me such as biology, ecology, evolution, and chemistry as well as non STEM classes in order to solidify I wanted a major related to biology. Ultimately these passions led me to major in Organismal Biology and Ecology, a perfect mix of all my interests!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"9c355a46-d17f-47de-ab06-5e81b8a5d3fd\"}":{"__typename":"School","uuid":"9c355a46-d17f-47de-ab06-5e81b8a5d3fd","name":"Colorado College","city":"Colorado Springs","type":"COLLEGE","state":"Colorado","country":"United States","zip":"80903"},"Education:{\"uuid\":\"041172af-7331-45ac-803f-a5cd7baef761\"}":{"__typename":"Education","uuid":"041172af-7331-45ac-803f-a5cd7baef761","school":{"__ref":"School:{\"uuid\":\"9c355a46-d17f-47de-ab06-5e81b8a5d3fd\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Organismal biology and Ecology ","degree":"Bachelors "},"School:{\"uuid\":\"f8587fb5-b7e8-45fe-9f11-7ed5f0eaeb04\"}":{"__typename":"School","uuid":"f8587fb5-b7e8-45fe-9f11-7ed5f0eaeb04","name":"Dos Pueblos High School","city":"Goleta","type":"HIGH","state":"California","country":"United States","zip":"93117"},"Education:{\"uuid\":\"5f78c941-aba9-44b6-bad0-a1277128112c\"}":{"__typename":"Education","uuid":"5f78c941-aba9-44b6-bad0-a1277128112c","school":{"__ref":"School:{\"uuid\":\"f8587fb5-b7e8-45fe-9f11-7ed5f0eaeb04\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"e3968987-8c27-4cb6-9dd6-5476d67f9ada\"}":{"__typename":"MentorPublicProfile","uuid":"e3968987-8c27-4cb6-9dd6-5476d67f9ada","displayName":"Josie M.","slug":"josie-morales","biography":"\u003cp\u003eJosie is a recent graduate from Colorado College with a major in Organismal Biology and Ecology and a minor in Human Biology and Kinesiology. During her time at Colorado College she was a student-athlete for four years as she was a part of the Division 1 women's soccer team. Being a student-athlete has led Josie to master her time-management skills as well as gain valuable insight to the importance of confidence and leadership skills.\u003cbr\u003e\u003cbr\u003eDuring highschool, Josie was a part of three varsity sports including cross country, track, and soccer. Throughout her years of challenging herself in different activities, Josie was able to distinguish herself as an individual who prided herself in her relationship with her team and her opponent as she held herself to high standards on and off the field. She was the first recipient of the Phil Womble Sports and Ethics award which is awarded to an athlete who demonstrates the highest standards of ethics and sportsmanship. \u003cbr\u003e\u003cbr\u003eOutside of sports, Josie loves to travel, learn, and spend time outdoors. With her curious personality, she developed her love for biology and the human body with the hopes of gaining a deeper understanding of different mechanisms related to herself and the world around her. Josie is aspiring to be a Physician Assistant after her four years at Colorado College. She has been certified in phlebotomy as well as a medical assistant, which allows her to gain clinical experience in a hospital and to understand the importance of patient care. As a mentor Josie is hoping to develop a meaningful relationship with her mentee with her goal to not only help them with their curriculum but to help them find their confidence in and out of the classroom. She has experience with soccer training sessions ranging in various ages, which has allowed her to understand the importance of different individualistic learning styles.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Organismal biology and Ecology ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a8b929f5-64c8-40dd-9b1f-c8367b5cee2b\"}"},{"__ref":"DeepDives:{\"uuid\":\"9f1a120b-e640-4f12-8bc6-58cee346033f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/663cd0b8-0a84-40a8-b1f6-0a110f3ce05e/-/crop/3024x3026/0,504/-/previ
