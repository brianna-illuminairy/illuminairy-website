xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"24ea92e3-a530-4df1-b538-40cac1f2230e\"}":{"__typename":"DeepDives","uuid":"24ea92e3-a530-4df1-b538-40cac1f2230e","content":"\u003cp\u003eIn high school, I spent every summer working as a sleepaway camp counselor. Being a counselor at the camp I grew up in was such a special way for me to give back to my camp community. I was fortunate enough to be a counselor for the same group of girls for 4 summers and it has been so meaningful for me to watch them grow up! In addition to working as a camp counselor, I leveraged research in sports psychology best practices to revamp counselor training programs, ensuring they were both innovative and effective. I led a dynamic team of 20 individuals, guiding them through contemporary coaching theories to enhance and promote girls' participation in various activities. I spearheaded the development and implementation of a Sports for Development (SFD) Program, a key initiative aimed at advancing gender equity within the organization. This project is incredibly meaningful to me because I wanted to make sure that I left a positive impact behind after my last summer! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"d879bc9e-5be2-4527-a17d-dd6f40f545ab\"}":{"__typename":"DeepDives","uuid":"d879bc9e-5be2-4527-a17d-dd6f40f545ab","content":"\u003cp\u003eMy greatest role model is my mother. My mom was the first woman in or family to attend college. She worked so incredibly hard in high school to attend college, and her efforts opened doors for me that I otherwise wouldn't have had. My mom reminds me every day the importance of knowledge, discipline and being grateful for the opportunities I have. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"de3b725b-d80c-483a-8416-d41a5523ac02\"}":{"__typename":"School","uuid":"de3b725b-d80c-483a-8416-d41a5523ac02","name":"Harborfields High School","city":"Greenlawn","type":"HIGH","state":"New York","country":"United States","zip":"11740"},"Education:{\"uuid\":\"9c132ae6-c60f-49a7-b53d-a6fbeb0c5f2e\"}":{"__typename":"Education","uuid":"9c132ae6-c60f-49a7-b53d-a6fbeb0c5f2e","school":{"__ref":"School:{\"uuid\":\"de3b725b-d80c-483a-8416-d41a5523ac02\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"44835f26-4c3e-4625-a77f-24dccef483f8\"}":{"__typename":"Education","uuid":"44835f26-4c3e-4625-a77f-24dccef483f8","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Industrial Labor Relations (Pre-law)","degree":null},"MentorPublicProfile:{\"uuid\":\"ca418b21-e886-4653-92a7-b34573e276c2\"}":{"__typename":"MentorPublicProfile","uuid":"ca418b21-e886-4653-92a7-b34573e276c2","displayName":"Aliyah S.","slug":"aliyah-steinberg","biography":"\u003cp\u003e     Hi! My name is Aliyah and I’m from Long Island, NY. I’m currently studying Industrial and Labor Relations (focusing on pre-law and business) at Cornell University. Growing up, I’ve always been interested in sports. Throughout my childhood I played soccer and danced, and eventually gravitated towards cross country and track by the time I reached high school! My love of sports didn’t end there! I worked as a high school marketing advisor for the National Hockey League during my sophomore, junior, and senior year, which sparked my passion for sports business law. Currently, I’m the Vice President of Cornell’s Sports Business Society and spend a lot of time advocating for girls equity in sports!\u003c/p\u003e\u003cp\u003e     Academic mentorship means more to me as I experienced it first hand growing up. I was fortunate enough to have a mentor in my life that helped teach me techniques to organize my assignments and remember information with greater ease. Even now, I sometimes struggle maintaining focus, but the lessons and encouragement I gained from my mentor have helped me thrive in college and develop an incredible work ethic. With that said, I completely understand how stressful and time-consuming academics can be, and I’m eager to provide support in any way possible!\u0026nbsp;\u003c/p\u003e\u003cp\u003e     In my free time, I love to read, play sports, go on runs, and spend time with my two little sisters, who are my best friends! In addition to my family, running is a critical part of my life. Not only does it keep me active and healthy, but it plays a massive role in my work ethic, discipline, and positive attitude. Running has taught me that academic success can come from involvement in other activities, and is a lot more complex than studying flashcards and rereading passages (though this is important too)! As a mentor, I strive to find that balance with my mentees between academic and personal interests, because I know what a positive impact this balance can have!\u003c/p\u003e","teachingVideoPlaybackId":"lGNYovk49GJboBFFQYpwMhLSyO9wCPafB2ZENph00dhg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Industrial Labor Relations (Pre-law)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"24ea92e3-a530-4df1-b538-40cac1f2230e\"}"},{"__ref":"DeepDives:{\"uuid\":\"d879bc9e-5be2-4527-a17d-dd6f40f545ab\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c4a0f7f7-2b80-4c68-aaa9-927516a2ddb9/-/preview/-/format/jpg/","https://ucarecdn.com/d0979571-edad-40a1-88e1-91201e47d62e/-/preview/-/format/jpg/","https://ucarecdn.com/d2bcad5f-158a-4a09-82fe-7bc022e1c4c7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9c132ae6-c60f-49a7-b53d-a6fbeb0c5f2e\"}"},{"__ref":"Education:{\"uuid\":\"44835f26-4c3e-4625-a77f-24dccef483f8\"}"}],"hiredAt":"2025-01-25T01:18:04.673Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Writing","College Essay Writing","Reading","History","Economics","Academic Coaching"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"aliyah-steinberg\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ca418b21-e886-4653-92a7-b34573e276c2\"}"}}},"_sentryTraceData":"9bdbeafa196d4d26a833e9ec2e323891-b3d11d8f5a926814-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9bdbeafa196d4d26a833e9ec2e323891,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"aliyah-steinberg"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetIn
