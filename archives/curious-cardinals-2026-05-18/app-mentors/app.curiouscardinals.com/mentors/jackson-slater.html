xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bdf51e9c-5921-4fa3-97ab-d8c14d42012b\"}":{"__typename":"Favorites","uuid":"bdf51e9c-5921-4fa3-97ab-d8c14d42012b","photoUrl":"https://ucarecdn.com/3215ffe9-a4f3-45c2-a2e0-04584fe5493f/","title":"Outliers","type":"BOOK"},"Favorites:{\"uuid\":\"9a43d8a3-6208-4cde-8427-4e234bddc1e4\"}":{"__typename":"Favorites","uuid":"9a43d8a3-6208-4cde-8427-4e234bddc1e4","photoUrl":"https://ucarecdn.com/eff59be1-befc-4445-9af8-eb3f7c64c938/","title":"Christian Pulisic!","type":"ATHLETE"},"Favorites:{\"uuid\":\"768ddc7c-0531-4b59-8910-ba3e07f73938\"}":{"__typename":"Favorites","uuid":"768ddc7c-0531-4b59-8910-ba3e07f73938","photoUrl":"https://ucarecdn.com/2ec78ba7-5d19-4094-9368-bb291ff6f052/","title":"Zach Bryan","type":"ARTIST"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b3c324a5-cea9-426e-befb-2bdd28111c0b\"}":{"__typename":"DeepDives","uuid":"b3c324a5-cea9-426e-befb-2bdd28111c0b","content":"\u003cp\u003eI grew up admiring idols—camp counselors, coaches, teachers, team captains, Tom Brady, Captain America, my parents, and other student mentors—who taught me everything I know.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI wanted to have muscles like my counselors, be smart like my coaches and teachers, work hard and lead like my team captains and Tom Brady, be brave and resilient like Captain America, and be kind and give back like my parents and peer mentors.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI owe who I am today to those who came before me, and it is the ultimate honor to pay it forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"46fef23f-7e2a-4ca0-928c-5e6fde6c94c1\"}":{"__typename":"DeepDives","uuid":"46fef23f-7e2a-4ca0-928c-5e6fde6c94c1","content":"\u003cp\u003eThese, right now, are the golden days. Don’t take a single snow day, family dinner, soccer game, sunrise, or even a night spent studying for granted. Cherish these moments—one day you'll look back on them as the golden days.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ll cheat a little here and borrow a quote from Ferris Bueller —\u0026nbsp;he's right:\u003cbr\u003e\u003cbr\u003eLife moves pretty fast. If you don't stop and look around once in a while, you just might miss it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"94053589-7d36-4e4e-948d-050e97a2528b\"}":{"__typename":"DeepDives","uuid":"94053589-7d36-4e4e-948d-050e97a2528b","content":"\u003cp\u003eEver since I was little, I was taught to leave wherever I went better off than I found it, and that's my ultimate goal: to leave this place a little better than I stumbled into it!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEn route to that, I’d love to run an Iron Man, see an Orca in the wild, and run my own company, non-profit, or gym that makes fitness cool—exactly how it would do that, TBD. I'll circle back on that one once I get there.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2bbbb0d8-1c3d-4e44-8f28-89dbf088bb76\"}":{"__typename":"DeepDives","uuid":"2bbbb0d8-1c3d-4e44-8f28-89dbf088bb76","content":"\u003cp\u003eDream job?\u003cbr\u003e\u003cbr\u003eRunning my own wildlife reserve. Think massive open jungles with animals from all over—tigers, pandas, wolves, giraffes, you name it. You'd explore the park in Jeeps, like a real safari.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'd moonlight as the strength coach for the New England Patriots, and, in my tenure we would win the Super Bowl.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eZookeeper and athletic trainer for an NFL team? C'mon.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"f3adfd3a-5e69-4a48-aaa6-1e2fe941e309\"}":{"__typename":"School","uuid":"f3adfd3a-5e69-4a48-aaa6-1e2fe941e309","name":"Newton South High School","city":"Newton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02459"},"Education:{\"uuid\":\"f823aa3b-8717-4819-bdd9-d5a8f963225c\"}":{"__typename":"Education","uuid":"f823aa3b-8717-4819-bdd9-d5a8f963225c","school":{"__ref":"School:{\"uuid\":\"f3adfd3a-5e69-4a48-aaa6-1e2fe941e309\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"523cca2f-c733-4f7a-a4a5-d2ec9e0507f9\"}":{"__typename":"Education","uuid":"523cca2f-c733-4f7a-a4a5-d2ec9e0507f9","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"5bf997a1-6217-4167-8f5b-cb6510310c7c\"}":{"__typename":"MentorPublicProfile","uuid":"5bf997a1-6217-4167-8f5b-cb6510310c7c","displayName":"Jackson S.","slug":"jackson-slater","biography":"\u003cp\u003eHi!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Jackson, and I am a huge fan of Crocs, Peanut M\u0026amp;Ms, Malcolm Gladwell books, and learning exercise science on YouTube. Academically, I enjoy studying math, economics, and writing the most, and I would be eager to work with you on any of these subjects, a blend of them, or anything beyond!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI spent my formative years in Florida and later in Newton, Massachusetts! I currently study Economics and Business at Northwestern University, where, for fun, I play soccer and basketball as often as I can and follow my Boston sports teams and Chelsea.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've worked for years as a Summer Camp Counselor, Soccer Coach and Referee, and babysitter, so I love working with kids and keeping up with their energy. I'm also a huge animals guy, love exploring the outdoors, and will be moving to Denver after graduation to be near the mountains.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThough I’ll always call Boston home, I’m building new traditions with my Midwestern roommates. To their dismay, I really want to foster a dog and am not a big fan of fast food; however, to their delight, I love country music, road trips, and happen to be a half-decent Spikeball partner.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLet's crack the books! Please reach out :)\u003c/p\u003e","teachingVideoPlaybackId":"Q4tGGAuwSNbr01xVdPapFLA00iLmPNmeKICqGcKSaPofw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bdf51e9c-5921-4fa3-97ab-d8c14d42012b\"}"},{"__ref":"Favorites:{\"uuid\":\"9a43d8a3-6208-4cde-8427-4e234bddc1e4\"}"},{"
