xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c38127e7-91f2-4be5-8a5d-c7b21eb3314a\"}":{"__typename":"Favorites","uuid":"c38127e7-91f2-4be5-8a5d-c7b21eb3314a","photoUrl":"https://ucarecdn.com/3d053cb6-c9b7-444f-a281-73850d0491df/","title":"New York","type":"CITY"},"CausesSupported:{\"uuid\":\"1414271a-a730-449c-a6f6-9b4b2b33087e\"}":{"__typename":"CausesSupported","uuid":"1414271a-a730-449c-a6f6-9b4b2b33087e","name":"Ivy Native Conference at Cornell University","description":"\u003cp\u003eI am supporting fundraising efforts for the Ivy Native Conference at Cornell!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/0322b440-bfe9-4034-bcd6-300b1d23b8c3/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2e5e7d43-845d-4ff0-92bb-9d1e935a9695\"}":{"__typename":"DeepDives","uuid":"2e5e7d43-845d-4ff0-92bb-9d1e935a9695","content":"\u003cp\u003eMentorship matters to me because I know how transformative thoughtful guidance can be when it comes to exploring ideas and pursuing ambitious projects. I grew up in a high school where opportunities weren’t always obvious, which meant I learned to take initiative, follow my curiosity, and design meaningful projects on my own. That experience taught me how to identify what really matters, connect concepts across disciplines, and turn curiosity into tangible results.\u003c/p\u003e\u003cp\u003eWhen I work with students, I focus on helping them maximize the opportunities in front of them. Guiding them to ask the right questions, take creative risks, and think strategically about how their efforts lead to meaningful results outcomes. For programs like Curious Cardinals, this involves fostering independent thinking, intellectual curiosity, and confidence. At elite schools, these qualities differentiate students even in resource-rich settings.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, mentorship matters to me because it’s about fostering growth and helping students discover what they’re capable of when curiosity meets guidance. I’ve applied this approach in my own research, strategic projects, and community work, and I aim to help every student I mentor achieve the same sense of agency, clarity, and accomplishment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2e582b80-16b0-47a5-9498-b042834af422\"}":{"__typename":"DeepDives","uuid":"2e582b80-16b0-47a5-9498-b042834af422","content":"\u003cp\u003eDuring high school, I spent my summers balancing practical work experience with creative opportunities. On one hand, I worked fast food jobs, learning responsibility, time management, and how to work effectively in high-pressure environments. On the other hand, I sought out meaningful experiences that aligned with my interests in social impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne summer, I walked into a local spa looking for a secretarial job. Still, instead of hiring me for administrative work, the staff recognized my potential to contribute to their nonprofit, the Liberte Foundation for Women. That led to a self-created internship where I supported the organization’s programs, helping plan initiatives and learning firsthand about nonprofit operations. It was a formative experience that taught me the value of initiative, creativity, and approaching challenges with a solutions-focused mindset—skills I now bring to every project I take on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"ea9460a8-1600-419e-bbc7-2855cb28ce10\"}":{"__typename":"DeepDives","uuid":"ea9460a8-1600-419e-bbc7-2855cb28ce10","content":"\u003cp\u003eMy dream job is to empower tribal energy infrastructure, building systems that are sustainable, innovative, and fully under Indigenous control. I don’t just want to consult or advise; I want to shape the decisions, strategy, and long-term impact. And honestly, I have all the pieces in place to make it happen. I have conducted in-depth investment analysis at de Anda Capital, driven strategic communications at Legence, a Blackstone portfolio company, and worked on cutting-edge energy projects at Kairos Power. Additionally, I have been selected as a fellow in Cornell’s American Indian and Indigenous Studies Program, where I conduct research that directly informs community-driven solutions.\u003c/p\u003e\u003cp\u003eThis is not just a career goal; it is a mission. I have been building the skills, network, and credibility to not just participate in this space, but to lead it. If you are wondering whether I can make it happen, the answer is yes, and I intend to leave no stone unturned in doing so.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"aa6705d0-f708-4e38-8961-e2c3d8a551b4\"}":{"__typename":"DeepDives","uuid":"aa6705d0-f708-4e38-8961-e2c3d8a551b4","content":"\u003cp\u003eWhat’s not immediately visible about me is my resilience. I was rejected from my dream school early on, but instead of letting that define me, I used it as motivation to refine my goals, double down on my projects, and pursue every opportunity I could. That persistence paid off when I gained admission to Cornell through the regular decision round with a likely letter and was awarded the Cornell Tradition Fellowship. Experiences like that taught me how to turn setbacks into stepping stones, and that mindset now shapes everything I do, from research projects to internships to mentoring students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"a421545e-f729-4122-b38f-76f514a06eac\"}":{"__typename":"School","uuid":"a421545e-f729-4122-b38f-76f514a06eac","name":"Urbana High School","city":"Urbana","type":"HIGH","state":"Illinois","country":"United States","zip":"61801"},"Education:{\"uuid\":\"cda18ca8-c440-44ea-8794-d011a4a21351\"}":{"__typename":"Education","uuid":"cda18ca8-c440-44ea-8794-d011a4a21351","school":{"__ref":"School:{\"uuid\":\"a421545e-f729-4122-b38f-76f514a06eac\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"5c3f7183-71f3-49a6-8ec3-57431f830382\"}":{"__typename":"School","uuid":"5c3f7183-71f3-49a6-8ec3-57431f830382","name":"Cornell University School of Industrial and Labor Relations","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14853"},"Education:{\"uuid\":\"06618103-e7d5-4eb2-b6ab-b2f5f96f0cda\"}":{"__typename":"Education","uuid":"06618103-e7d5-4eb2-b6ab-b2f5f96f0cda","school":{"__ref":"School:{\"uuid\":\"5c3f7183-71f3-49a6-8ec3-57431f830382\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Industrial \u0026 Labor Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"48c9535d-e436-478c-b837-f6b371c2bafe\"}":{"__typename":"MentorPublicProfile","uuid":"48c9535d-e436-478c-b837-f6b371c2bafe","displayName":"Santi M.","slug":"santi-mckinn","biography":"\u003cp\u003eNice to meet you! I’m Santiago McKinn, a Maricopa Native American from Urbana, Illinois. Growing up in a small town, attending a Title I high school meant that resources were limited, and opportunities weren’t handed to me. That environment compelled me to think creatively about my learning and passion projects; finding ways to explore complex topics, design meaningful projects, and push beyond the traditional curriculum. It’s this resourcefulness that has shaped my approach to both learning and teaching, and it’s at the core of how I help students unlock their potential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m deeply passionate about understanding how energy infrastructure and social systems intersect, and I’ve spent the past several years turning that curiosity into real-world experience. In high school, I began exploring social inequality and community dynamics, and that interest naturally evolved into studying Industrial and Labor Relations at Cornell University, where I also pursue minors in Business and American Indian Studies. Over time, I’ve applied these interests in practical contexts—working on clean energy strategy with Kairos Power, conducting ESG investment analysis in New York, and developing community-focused research projects that analyze labor trends and social systems. Each of these experiences taught me how to break complex problems into manageable steps, analyze data critically, and communicate findings clearly—skills I now bring to every student I work with.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I love about tutoring is helping students translate curiosity into action. Whether it’s preparing for selective school applications, exploring advanced academic topics, or designing creative passion projects, my approach is hands-on, personalized, and rooted in strategy. I focus on helping students understand\u0026nbsp;\u003cem\u003ewhy\u003c/em\u003e\u0026nbsp;concepts matter, not just\u0026nbsp;\u003cem\u003ehow\u003c/em\u003e\u0026nbsp;to memorize them, and I work with families to develop actionable plans that align with each student’s strengths and ambitions. For students from smaller schools or less traditional backgrounds, I know firsthand that success comes from creativity, resilience, and targeted guidance. I bring that insight into every session.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of tutoring, I’ve led research fellowships, managed strategic communications for energy and tech startups, and written for organizations analyzing labor and sustainability trends. These experiences reinforce my teaching philosophy: complex subjects don’t have to be intimidating, and structured, engaging guidance can transform curiosity into real achievement.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re looking for a mentor who can help you navigate challenging academics, design standout passion projects, and gain the skills and confidence to thrive in selective schools, I’m here to make that happen. Together, we’ll turn potential into performance; breaking down big ideas, fostering creativity, and building the foundations for long-term success.\u003c/p\u003e","teachingVideoPlaybackId":"BbaDUNVHGycESbg5Ylksm02DFCJBpkvUpjqfQXQXgYt8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eHelped raise $1.4M pre-seed investment for Cornell-based startup Mavrik Technologies\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c38127e7-91f2-4be5-8a5d-c7b21eb3314a\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"1414271a-a730-449c-a6f6-9b4b2b33087e\"}"}],"major":"Industrial \u0026 Labor Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2e5e7d43-845d-4ff0-92bb-9d1e935a9695\"}"},{"__ref":"DeepDives:{\"uuid\":\"2e582b80-16b0-47a5-9498-b042834af422\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea9460a8-1600-419e-bbc7-2855cb28ce10\"}"},{"__ref":"DeepDives:{\"uuid\":\"aa6705d0-f708-4e38-8961-e2c3d8a551b4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/609117d2-3fb1-4137-8821-18f643a020c1/-/preview/-/format/jpg/","https://ucarecdn.com/03f0a52b-6aca-4c17-aa59-07441bab6b70/-/preview/-/format/jpg/","https://ucarecdn.com/d6a77094-87b4-4db3-ba51-136e973bb5c5/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cda18ca8-c440-44ea-8794-d011a4a21351\"}"},{"__ref":"Education:{\"uuid\":\"06618103-e7d5-4eb2-b6ab-b2f5f96f0cda\"}"}],"hiredAt":"2025-09-18T23:25:29.988Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics"],"communityBadges":["https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"santi-mckinn\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"48c9535d-e436-478c-b837-f6b371c2bafe\"}"}}},"_sentryTraceData":"5146952705a848958f128326d003af7f-aeca40fce2a58bbd-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=5146952705a848958f128326d003af7f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"santi-mckinn"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j
