xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e7180552-e36f-4a89-a938-1595d1c1f8c3\"}":{"__typename":"Favorites","uuid":"e7180552-e36f-4a89-a938-1595d1c1f8c3","photoUrl":"https://ucarecdn.com/e11e3851-5671-476f-a0dc-21edc0233b9d/","title":"The Lord of the Rings: Two Towers","type":"MOVIE"},"Favorites:{\"uuid\":\"33353957-704f-4979-b5c7-11a6e4fbc116\"}":{"__typename":"Favorites","uuid":"33353957-704f-4979-b5c7-11a6e4fbc116","photoUrl":"https://ucarecdn.com/703b9093-f94f-4f20-b6da-0b57ce5208d4/","title":"Michelle Yeoh","type":"ACTOR"},"Favorites:{\"uuid\":\"bf68b1d6-3491-4536-91cb-b11137caee96\"}":{"__typename":"Favorites","uuid":"bf68b1d6-3491-4536-91cb-b11137caee96","photoUrl":"https://ucarecdn.com/71942e20-9661-42a3-b4b8-0ba41196c806/","title":"Lianne La Havas (2020)","type":"ALBUM"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"d6887361-4595-4ab4-b915-f0dfaa987234\"}":{"__typename":"DeepDives","uuid":"d6887361-4595-4ab4-b915-f0dfaa987234","content":"\u003cp\u003eMy greatest source of motivation is to live a good life. To me, this means honoring my values and responsibilities to others while allowing myself the room to grow and change over time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9433757d-477f-4d73-ac59-6f294cf4b87f\"}":{"__typename":"DeepDives","uuid":"9433757d-477f-4d73-ac59-6f294cf4b87f","content":null,"videoPlaybackId":"EXn1GARrOxl5kUe8rk7w01dY9yyudWNKEcT5mNk6jIHQ","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"73597ebc-3e06-417f-8110-eb93dca8279d\"}":{"__typename":"DeepDives","uuid":"73597ebc-3e06-417f-8110-eb93dca8279d","content":"\u003cp\u003eA recent passion project of mine has been making beaded jewelry! I was looking for a way to exercise my creativity with a low-stakes, relaxing activity and have since made\u0026nbsp; both personal pieces and gifts for friends and family. I like to incorporate beads from broken/thrifted jewelry, to reduce waste, and cowrie shells, to honor my heritage as a Nigerian American.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"f6819778-7492-421c-ba14-c0502bbfa0dd\"}":{"__typename":"DeepDives","uuid":"f6819778-7492-421c-ba14-c0502bbfa0dd","content":null,"videoPlaybackId":"Fbnz5yg3wfxwcAj1J7m02kJBNcVhL8VGh1SCKkH2HV1Q","question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"9f4cf949-a5ca-4992-989b-88bd9b5052d9\"}":{"__typename":"School","uuid":"9f4cf949-a5ca-4992-989b-88bd9b5052d9","name":"Marietta High School","city":"Marietta","type":"HIGH","state":"Georgia","country":"United States","zip":"30064"},"Education:{\"uuid\":\"3ba75daf-de65-4c1f-a96a-049cfeb9720f\"}":{"__typename":"Education","uuid":"3ba75daf-de65-4c1f-a96a-049cfeb9720f","school":{"__ref":"School:{\"uuid\":\"9f4cf949-a5ca-4992-989b-88bd9b5052d9\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"ae517c88-6d62-4ddd-a0c2-3cfb756c1488\"}":{"__typename":"Education","uuid":"ae517c88-6d62-4ddd-a0c2-3cfb756c1488","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"3d32b532-8952-4cb3-bdc4-60fea54cbf9b\"}":{"__typename":"MentorPublicProfile","uuid":"3d32b532-8952-4cb3-bdc4-60fea54cbf9b","displayName":"Rayo O.","slug":"rayo-oyeyemi","biography":"\u003cp\u003eHello! My name is Rayo Oyeyemi, and I am a PhD student at Northwestern University studying neuroscience. Specifically, my research aims to better understand the mechanisms of neurodegenerative diseases like Alzheimer’s, with the goal of developing early detection methods and novel treatment pathways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my top priorities in life is honoring every part of myself and encouraging those around me to do the same. When I was an undergraduate at Yale University, this meant bringing just as much energy to my job as a neurobiology research assistant as I did to acting on stage in productions with the Yale Dramatic Association. I also pursued my interest in mental health advocacy by helping to found our college’s first mental health magazine and volunteering with the behavioral health department at HAVEN Free Clinic.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a current PhD student, I spend my evenings and weekends out in nature or up a wall (literally). I am proud to serve as a climbing mentor and meetup leader for two local Chicago organizations working to expand access to rock climbing for those underrepresented in the sport, including women and people of color. These groups, through fundraising and sponsorships from major outdoor brands like Arc’teryx, have provided a safe, welcoming community for new and experienced climbers alike.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy experiences with mentorship and teaching have varied widely, but all center on a key goal: increasing the accessibility of science communication and exploration for young learners. This passion comes from feeling a lack of representation in my own educational experiences growing up. I have my family to thank for providing me with many examples of talented, successful Black women, but as I began to figure out my own career path in STEM, I did not see myself reflected in the academic and professional world around me. I hope to be that representation for others in the roles and positions I hold now and to pass on the knowledge I’ve learned along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI cherish my mentorship experiences in my post-graduate life the most. While working at a biotech company, I volunteered as a STEM professional mentor. In this role, I had the honor of hosting lab tours, Q\u0026amp;As, and accessible learning experiences for middle and high school students, working to demystify the world of biomedical research. My later work as a STEM teacher and TA for Northwestern’s Center for Talent Development only deepened my commitment to supporting the educational journeys of students just beginning to decide who and what they want to be.\u003c/p\u003e","teachingVideoPlaybackId":"A3JuI401tJLPpLyYRIbWnJpWIPK1kCTWqJ4n01auS9lqY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e7180552-e36f-4a89-a938-1595d1c1f8c3\"}"},{"__ref":"Favorites:{\"uuid\":\"33353957-704f-4979-b5c7-11a6e4fbc116\"}"},{"__ref":"Favorites:{\"uuid\":\"bf68b1d6-3491-4536-91
