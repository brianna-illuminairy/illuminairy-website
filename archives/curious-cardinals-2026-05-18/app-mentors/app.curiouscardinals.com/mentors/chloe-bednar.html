xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f370417a-c4de-4416-a501-a0f3f7c7dca6\"}":{"__typename":"Favorites","uuid":"f370417a-c4de-4416-a501-a0f3f7c7dca6","photoUrl":"https://ucarecdn.com/0ef01a0a-318e-4a3d-bf67-8605e358515f/","title":"Flashing Lights","type":"SONG"},"Favorites:{\"uuid\":\"42b0fffb-4274-4c0a-ad51-01f4ca235d91\"}":{"__typename":"Favorites","uuid":"42b0fffb-4274-4c0a-ad51-01f4ca235d91","photoUrl":"https://ucarecdn.com/46eee06c-b86e-4528-86a3-2baaecd9d604/","title":"Lacrosse!","type":"SPORT"},"Favorites:{\"uuid\":\"a136712f-279b-4c1a-90e4-cb0e23de17c9\"}":{"__typename":"Favorites","uuid":"a136712f-279b-4c1a-90e4-cb0e23de17c9","photoUrl":"https://ucarecdn.com/223812c3-a710-428a-ab08-69a5a5055a81/","title":"When We Were Friends","type":"ALBUM"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"992abbe3-33fa-44ea-b6c2-bf42430115d6\"}":{"__typename":"DeepDives","uuid":"992abbe3-33fa-44ea-b6c2-bf42430115d6","content":"\u003cp\u003eOne of my passions in life is hiking and something that I want to accomplish in my lifetime is climbing the seven summits, which are the tallest mountains on each continent!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d38da39a-64f3-4e91-b1cf-d66f7a3fb245\"}":{"__typename":"DeepDives","uuid":"d38da39a-64f3-4e91-b1cf-d66f7a3fb245","content":"\u003cp\u003eMentorship matters to me because I believe having someone, specifically a positive influence, who you can come to for help or guidance in all aspects of life can really make for a transformative experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"48692502-31bc-4194-b1d6-3c1c98be8497\"}":{"__typename":"DeepDives","uuid":"48692502-31bc-4194-b1d6-3c1c98be8497","content":"\u003cp\u003eI chose to study mechanical engineering because I've always loved innovation, creativity, and building things, and engineering provides that kind of outlet where I can pursue my own passion projects and apply the concepts I'm learning in the classroom to my own life!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3a4c03c1-7208-4f41-85bd-b9d22428818d\"}":{"__typename":"DeepDives","uuid":"3a4c03c1-7208-4f41-85bd-b9d22428818d","content":"\u003cp\u003eI'd tell myself to be more open to opportunities because I find that there are so many opportunities to get involved, not only at school, but also in your community, whether it's sports, volunteering, or joining a club that interests you. Especially just exposing yourself to as many different things as you can to get a feel for what you like and don't like really helps weed out your interests, hobbies, and even potential career paths--not to mention all the cool people you'll meet along the way!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"e33c4b66-12c5-497c-a5b6-f0e59839065b\"}":{"__typename":"School","uuid":"e33c4b66-12c5-497c-a5b6-f0e59839065b","name":"Shattuck-St. Mary's School","city":"Faribault","type":"HIGH","state":"Minnesota","country":"United States","zip":"55021"},"Education:{\"uuid\":\"d704e82f-7d24-483e-9954-038646db2e4d\"}":{"__typename":"Education","uuid":"d704e82f-7d24-483e-9954-038646db2e4d","school":{"__ref":"School:{\"uuid\":\"e33c4b66-12c5-497c-a5b6-f0e59839065b\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"54c64994-d747-4bb0-a562-4e0945f19311\"}":{"__typename":"Education","uuid":"54c64994-d747-4bb0-a562-4e0945f19311","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"d7773993-1f30-44af-8016-e7247279fd96\"}":{"__typename":"MentorPublicProfile","uuid":"d7773993-1f30-44af-8016-e7247279fd96","displayName":"Chloe B.","slug":"chloe-bednar","biography":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi! I’m Chloe and I study mechanical engineering at Harvard University. In addition to taking classes, I’m also a defender on the varsity women's lacrosse team. Managing my time on the field and in the classroom has been the key to my success, and for me, it has also sparked interest in the intersection of engineering and athletics. My interest in engineering goes far beyond course material, as I’m someone who thoroughly enjoys problem-solving in general and lives by the motto of doing everything in my life with the utmost efficiency and strives to become at least 1% better each day so I’m always learning and improving.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve been interested in building and designing from an early age. It all started with legos, when my dad would challenge me to make the best Lego house, and from there, I would try to make little models of airplanes and cars using whatever materials I had around the house.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEntering into high school, I had the amazing opportunity to be a part of my school’s engineering center of excellence, as we called it, it was a program integrated into my academic schedule where I would take two engineering courses throughout the entire school year, one which focused on a particular branch of engineering, and the other was a lab period in which I would spend my time working on year-long independent engineering projects. \u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve always had an inquisitive mind, and this experience truly helped build a strong foundation for my academic inquiries thus far. It’s also really allowed me to hone my technical skills, as, now, studying at Harvard, I’m very familiar with the engineering design process, and have grown to have a passion for innovation.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond the classroom, I’m involved in various organizations including the Harvard Undergraduate Engineering Society, Christian Impact, and my school’s rock climbing club, and in my free time, besides playing lacrosse, you can probably catch me at the gym, in the makerspace, learning a new skill, or scaling a mountain somewhere!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy goal is to bring these skills to you! Whether it’s engineering, design, or flat out just making something cool, I’m here to help you expand upon your knowledge, dive deeper into your interests, and explore your passions!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"oaZ01YC4CLez6sQ0001TqCYM6HFXNv700PxioMRL8HY6qW8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my greatest achievements would probably have to be earning an innovation award through my school for my engineering project titled \"Passenger Seat Tray Table\" in which I designed a desk that served as a workspace that fully integrated into the passenger seat of a car.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f370417a-c4de-4416-a501-a0f3f7c7dca6\"}"},{"__ref":"Favorites:{\"uuid\":\"42b0fffb-4274-4c0a-ad51-01f4ca235d91\"}"},{"__ref":"Favorites:{\"uuid\":\"a136712f-279b-4c1a-90e4-cb0e23de17c9\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"992abbe3-33fa-44ea-b6c2-bf42430115d6\"}"},{"__ref":"DeepDives:{\"uuid\":\"d38da39a-64f3-4e91-b1cf-d66f7a3fb245\"}"},{"__ref":"DeepDives:{\"uuid\":\"48692502-31bc-4194-b1d6-3c1c98be8497\"}"},{"__ref":"DeepDives:{\"uuid\":\"3a4c03c1-7208-4f41-85bd-b9d22428818d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7a8da04f-d5bd-4afe-9398-e901aea2808d/-/preview/-/format/jpg/","https://ucarecdn.com/70fdb3bb-8439-46cb-89bc-b48692ccaf65/-/preview/-/format/jpg/","https://ucarecdn.com/d2efd5ad-8c8d-4a05-a735-df3084ed4d79/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d704e82f-7d24-483e-9954-038646db2e4d\"}"},{"__ref":"Education:{\"uuid\":\"54c64994-d747-4bb0-a562-4e0945f19311\"}"}],"hiredAt":"2025-05-14T14:25:06.607Z","topics":["Video / Photography","Visual Arts / Graphic Design","Fashion / Cosmetics","Film / Theater","Coding / Programming","Web Design","Robotics / Electronics / CAD","Game Design","Aviation / Aerospace","STEM Project"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibilit
