cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2022","major":"International Relations: World Economic Development \u0026 Human Rights","degree":null},"MentorPublicProfile:{\"uuid\":\"7afb7c7e-64a7-4264-b4cf-358f318b4d8c\"}":{"__typename":"MentorPublicProfile","uuid":"7afb7c7e-64a7-4264-b4cf-358f318b4d8c","displayName":"Johnathan B.","slug":"johnathan-bridges","biography":"\u003cp\u003eIf your child were to meet with me directly after I have a phone call with my mom, they might giggle from hearing the Southern accent that flares up on occasion, and I’d be laughing along with them! Hey there, I’m Johnathan and I graduated from Stanford University in ‘22, having studied International Relations with concentrations in World Economic Development and Human Rights. I’m from a super small mountain town in East Tennessee (hence the accent), but I currently live in New York City! From growing up in such a small place, virtually isolated from the outside world, I developed a passion for globalization and international politics and culture. Fast forward to my time at Stanford- from studying art and global economics in Paris, solo-backpacking through Egypt, representing my university in Saudi Arabia, and deep-diving into global supply chain ethics, I truly appreciate the practical application of classroom learning in the real world. Now, I’m working as a mentor and on the Family Team at Curious Cardinals to drive this forward- there’s nothing more fulfilling than enabling students to discover and develop how their interests fit into this big wide world!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a hyperactive guy, I have a lot of passions and interests- one of which is public speaking and teaching presentation skills. During my junior year of high school, I decided to push myself out of my comfort zone and run for a statewide position in the National Beta Club, meaning I’d have to give speeches to crowds of 10,000+ high schoolers. At the time, public speaking skills were not in my wheelhouse, but support from mentors and lots of hard work helped me unlock my potential. In turn, I discovered a new passion that I’d see through for the rest of my life. I taught the Public Speaking course at Stanford for five years; a critical aspect of successfully delivering a speech is building confidence and managing nerves, skills that are applicable to all parts of life!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I served as Class President all 4 years of undergrad, I spent a year at Amazon Web Services as a Program Manager / Project Manager for the Global Financial Services team, I was a counselor at Stanford Sierra Camp (three summers) to 9-10 \u0026amp; 13-14 year olds, I worked as a Product Manager at a biotech startup, and I was the Marketing Lead for the Midnight Family documentary. I believe in exploring all of ones curiosities, which reflects in my array of experiences.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI’d love to work with kids who are interested in fashion, photography, Egyptology, human rights, climate change, public speaking, and / or building time management habits. Reflecting on how my own life has transformed from positive mentorship, I’m driven to enable students to discover what they can accomplish and who they can become! I love music, and I'm currently learning to produce electronic beats. I also love creative writing, photography (I have 133,000 photos on my phone- YIKES), learning about innovative climate change solutions, playing spikeball and basketball, going to art museums, going hiking and camping, and picking up new, random skills. I’m so stoked to connect with your child, whatever their passions or hobbies may be, and to be a great role model supporting them through their academic and personal journeys. Curious Cardinals is the place to be!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"82edfb22-2304-4198-adea-8491fe6929bc\"}"},{"__ref":"Favorites:{\"uuid\":\"ab0ae485-c9bd-42e7-a7a7-ab3d7dc46043\"}"},{"__ref":"Favorites:{\"uuid\":\"037dc703-51b2-4a57-8272-2e1bcf5daadf\"}"}],"causesSupported":[],"major":"International Relations: World Economic Development \u0026 Human Rights","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/1ad1dc2d-2f29-42ff-9c8b-6c6bb22a919e/-/preview/-/format/jpg/","https://ucarecdn.com/872eb4d9-27b1-4e56-ad32-bfbd987c6b01/-/preview/-/format/jpg/","https://ucarecdn.com/2da9d862-b531-4cea-b13c-5f8bd1c47491/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f91fc91a-d386-45e8-a866-c649bd1f7046\"}"},{"__ref":"Education:{\"uuid\":\"f9356465-377f-47a3-85f9-3afaad9591f3\"}"}],"hiredAt":"2023-07-17T17:03:25.017Z","topics":["Reading","Sustainability","World Cultures","Public Speaking","History","Geography","Creative Writing","College Essay Writing","Writing","Video / Photography"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"johnathan-bridges\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7afb7c7e-64a7-4264-b4cf-358f318b4d8c\"}"}}},"_sentryTraceData":"d5f15ad3e1f343d29fce062374bc271a-a0def14ee87c64da-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d5f15ad3e1f343d29fce062374bc271a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug"
