on:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"467238b2-2da2-4a7e-af64-d7950fb143a0\"}":{"__typename":"School","uuid":"467238b2-2da2-4a7e-af64-d7950fb143a0","name":"Calabasas High School","city":"Calabasas","type":"HIGH","state":"California","country":"United States","zip":"91302"},"Education:{\"uuid\":\"6cd2e1d7-78cf-4935-bab7-d3a31715de41\"}":{"__typename":"Education","uuid":"6cd2e1d7-78cf-4935-bab7-d3a31715de41","school":{"__ref":"School:{\"uuid\":\"467238b2-2da2-4a7e-af64-d7950fb143a0\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"e803beca-5d60-45b5-a2ec-b9429cc68685\"}":{"__typename":"Education","uuid":"e803beca-5d60-45b5-a2ec-b9429cc68685","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"f7cbcc84-712f-4e84-99cf-3d6c80ecebe3\"}":{"__typename":"MentorPublicProfile","uuid":"f7cbcc84-712f-4e84-99cf-3d6c80ecebe3","displayName":"Anika K.","slug":"anika-kolanu","biography":"\u003cp\u003e\u003cstrong\u003eHi, I'm Anika – it's great to connect!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI recently earned my Bachelor of Science from Cornell University, and this fall, I'll be pursuing a Master of Science in Innovation Policy at the London School of Economics, a journey I’m truly excited about.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy interests sit at the intersection of technology and policy, where I’m passionate about shaping how innovation influences society and governance. I'm on the path to becoming a lawyer, with the goal of contributing to responsible, forward-thinking tech policy that serves the public good.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy love for big ideas began in high school, where my favorite subject was history – I was drawn to it because it felt like storytelling, rich with lessons about people, power, and progress. That same curiosity now drives my interest in how technology reshapes our world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m a creative at heart. I love expressing myself through graphic design and photography. Whether you're curious about navigating academia or cultivating your creative passions alongside professional goals, I’d love to connect and support you on your journey.\u003c/p\u003e","teachingVideoPlaybackId":"HoHi6700hNFxSVjjPt634Qm01GHCI8fX00S202PcsuCv5U00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"65ee0e47-4ca9-4e6b-bf8b-142bdc449611\"}"},{"__ref":"Favorites:{\"uuid\":\"2a527697-5dba-4632-b72b-c05db0b9a12e\"}"},{"__ref":"Favorites:{\"uuid\":\"9718a878-6aba-4124-89bd-b336de85be26\"}"}],"causesSupported":[],"major":"Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e7bf5965-cb84-4640-9d37-dc8522a9bc80\"}"},{"__ref":"DeepDives:{\"uuid\":\"9ca900ae-4a22-4b20-86c9-1bde6ff5b4f0\"}"},{"__ref":"DeepDives:{\"uuid\":\"1a000395-efe9-4032-9374-40c124da71c1\"}"},{"__ref":"DeepDives:{\"uuid\":\"5e2af2ab-d4a9-4137-9a67-aab140e7f4f3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/11f20dcb-abac-49e9-84fb-00755ac69f0d/-/preview/-/format/jpg/","https://ucarecdn.com/feb15958-d0a7-448b-8b83-9e1916038363/-/preview/-/format/jpg/","https://ucarecdn.com/add204e8-532d-4d34-bf8d-9aa309192a7d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6cd2e1d7-78cf-4935-bab7-d3a31715de41\"}"},{"__ref":"Education:{\"uuid\":\"e803beca-5d60-45b5-a2ec-b9429cc68685\"}"}],"hiredAt":"2025-05-29T23:45:27.552Z","topics":["K-5 Grade Ma
