","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"1c7b11ea-3a7c-4c86-b237-d388d331adc5\"}":{"__typename":"Education","uuid":"1c7b11ea-3a7c-4c86-b237-d388d331adc5","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Pre-Med, Human Development","degree":null},"MentorPublicProfile:{\"uuid\":\"ac2bd3f4-d950-44ae-a3d3-71a5a39c5c5e\"}":{"__typename":"MentorPublicProfile","uuid":"ac2bd3f4-d950-44ae-a3d3-71a5a39c5c5e","displayName":"Tobie B.","slug":"tobie-bertisch","biography":"\u003cp\u003eHello! My name is Tobie, and I recently graduated from Cornell University, where I studied Human Development (basically Psychology) on the Pre-Med track (3.9 GPA). I am a New York native, but for the past few months, I have been living in Utah working at a free, Spanish-speaking health clinic. I am getting plenty of clinical experience, learning about medicine from a hands-on approach, and perfecting my Phlebotomy skills. As all of the patients speak Spanish, I am now fluent! I also spent a semester abroad in Madrid, Spain living with a host mom so I have had plenty of time to work on my skills there as well. My future plan is to become a clinical psychologist or a doctor but in the meantime, I am enjoying all the mountain biking, hiking, fishing, camping and skiing Utah has to offer! Driven by my love for nature and working with students, I spent last summer in Rochester, NY working with underserved urban teens leading them in nature-based community service projects and I even created a weekly healthy cooking competition. I spent other summers working as an assistant nurse at a camp for special needs children and in a neurobiology lab working on RNA sequencing for Alzheimer's disease. In college, I worked as a TA for general chemistry and I have experience tutoring in AP-level Biology, Physics, Chemistry, Spanish and Math. I am interested in supporting students with passion projects as I have pursued many of my own! In college, I co-founded the first-ever ballet club at Cornell with a couple friends and it was a huge success and is still thriving after we graduated! I also presented my own psychological research projects at 6+ conferences, including the American Psychological Association Convention in Washington D.C. My studies focused on the importance of purpose and autonomy in youth development. Through independent reserch, I was able to measure all of the wonderful factors associated with a deep sense of purpose and social support. As your tutor, I would love to help you find your purpose and passion whether that is a business, research project, community service initiative or whatever your heart desires! In my free time, I run a cooking account and an art business where I make handmade watercolor cards and portraits. One of my favorite activities is hiking to a pretty spot then painting it! I am friendly and energetic but patient and would love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"e01vOmvHquUBzNJbl00300AD01SDUN5bsv2G1gzdg4mldMo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eDuring my senior year of college, four friends and I decided to start the first classical ballet club at Cornell. We started in September with five founding members and grew to include over 50 members in our first year. We performed Swan Lake in the spring, and tickets sold out in 24 hours! We sat people on the floor and had to turn away people in line at the door for fire safety reasons. One of my favorite events we did was Beginner Ballet. We taught super beginner classes to students who had never danced before, and it was so much fun. The students were so into it and improved tremendously over the few classes we held. It was so rewarding to see our dream come to life and to create such a thriving ballet community on campus. I am so grateful for the younger members who are keeping the club thriving and sending the graduated seniors updates about the club. They even told us that some freshmen wrote about Cornell Ballet Club in their application essays to Cornell!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a72e7af8-ad79-406a-be7f-c4fb7dcac835\"}"},{"__ref":"Favorites:{\"uuid\":\"919fcd82-0c28-4f4a-9726-773998b8d945\"}"},{"__ref":"Favorites:{\"uuid\":\"2a282fa8-3fea-4918-92cf-dfc9c2af13cc\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"a05846c4-16bf-44a9-bfc7-24becac257c9\"}"}],"major":"Pre-Med, Human Development","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"33ccb5f6-77dc-4889-b91f-5a23eb34a996\"}"},{"__ref":"DeepDives:{\"uuid\":\"488c446b-dae6-4a57-b7e5-88c6417c8bcd\"}"},{"__ref":"DeepDives:{\"uuid\":\"a752538c-135d-45cf-85cf-5ded33facaee\"}"},{"__ref":"DeepDives:{\"uuid\":\"51b9418c-6b2a-4037-a6d2-2d84a6ed8dca\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/93c82b3f-cfb3-4b0d-a85f-53cbdf490418/-/preview/-/format/jpg/","https://ucarecdn.com/613424ae-fae8-4cf2-9784-deec6d9bd667/-/preview/-/format/jpg/","https://ucarecdn.com/b96bf703-f968-4ab6-885f-e3340b442108/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9ab3fd7c-22ae-4478-9fae-9143e5b8f05a\"}"},{"__ref":"Education:{\"uuid\":\"1c7b11ea-3a7c-4c86-b237-d388d331adc5\"}"}],"hiredAt":"2025-09-21T22:50:17.380Z","topics":["Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Chemistry","Physics","Writing","Spanish","Academic Coaching","Executive Function","Fashion / Cosmetics","K-6 Storybook","Visual Arts / Graphic Design","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"
