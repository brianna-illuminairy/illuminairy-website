xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1e3f344a-c63f-4b54-96e6-3ca801b4878a\"}":{"__typename":"Favorites","uuid":"1e3f344a-c63f-4b54-96e6-3ca801b4878a","photoUrl":"https://ucarecdn.com/d4363940-c1a6-40bc-8dbb-d772a59328f7/","title":"Messi!","type":"ATHLETE"},"Favorites:{\"uuid\":\"c95d66a6-62d9-47c3-8cdf-b38f4cf4b4db\"}":{"__typename":"Favorites","uuid":"c95d66a6-62d9-47c3-8cdf-b38f4cf4b4db","photoUrl":"https://ucarecdn.com/ed63f5b8-6184-48e5-b14a-ee330d6f752f/","title":"Paris, France","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1bb8ca83-cbcb-4071-9602-3fd42a5e64e5\"}":{"__typename":"DeepDives","uuid":"1bb8ca83-cbcb-4071-9602-3fd42a5e64e5","content":"\u003cp\u003eEmbrace being nervous but excited! It usually means you are doing something right. As a teenager, I was always worried about perception, negative thoughts, or the worst outcomes. But with time I have learned, and what thus tell my middle or high school self, to embrace the nerves, choose to be excited, and show up wholeheartedly in everything you do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c42c1adc-9689-40be-b85e-dd854e60f4f7\"}":{"__typename":"DeepDives","uuid":"c42c1adc-9689-40be-b85e-dd854e60f4f7","content":"\u003cp\u003eA lawyer! I plan on pursuing a J.D. after my undergraduate education.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ecf2bff0-b43e-4885-ac48-d4c362036a5c\"}":{"__typename":"DeepDives","uuid":"ecf2bff0-b43e-4885-ac48-d4c362036a5c","content":"\u003cp\u003eMy mother. She taught me to be resilient, intelligent, kind, and incredibly thoughtful with others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"acaf92dd-10dd-4501-a652-29dea8f5f908\"}":{"__typename":"DeepDives","uuid":"acaf92dd-10dd-4501-a652-29dea8f5f908","content":"\u003cp\u003eWork out, watch sports, spend time with my friends, try new restaurants, and live a happy life!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"6e136bfd-a84f-4eb2-8869-58d56abac330\"}":{"__typename":"School","uuid":"6e136bfd-a84f-4eb2-8869-58d56abac330","name":"Luanda International School","city":"Talatona","type":"HIGH","state":"Luanda","country":"Angola","zip":"00000"},"Education:{\"uuid\":\"888c51e7-5da1-49aa-9096-682e763e5495\"}":{"__typename":"Education","uuid":"888c51e7-5da1-49aa-9096-682e763e5495","school":{"__ref":"School:{\"uuid\":\"6e136bfd-a84f-4eb2-8869-58d56abac330\"}"},"startYear":"2017","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"7861a936-8145-46c7-98c8-ce8f25550880\"}":{"__typename":"Education","uuid":"7861a936-8145-46c7-98c8-ce8f25550880","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"International and Public Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"9001aeaa-9c28-4559-9398-e143e324829b\"}":{"__typename":"MentorPublicProfile","uuid":"9001aeaa-9c28-4559-9398-e143e324829b","displayName":"Bruna M.","slug":"bruna-melo","biography":"\u003cp\u003eHi Parents and Students! My name is Bruna, and I am a senior at Brown University studying International and Public Affairs with a focus on law, policy, and global development. I have always been passionate about learning and mentoring, and I love helping students build genuine confidence and excellence in their academics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy background is interdisciplinary. In recent years, I have researched how music shaped nationalist movements in Angola, studied French literature at Sorbonne University in Paris (one of the oldest universities in the world!), and held various intern positions that focused on international law and sustainability policy. Across all these experiences, I also applied my language skills in English, Portuguese, and French. Ultimately, these experiences strengthened my ability to communicate, think critically, and break down complex topics into accessible, engaging ideas — exactly what I bring to tutoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Brown, I serve as Managing Editor of the Brown Undergraduate Law Review and a Writing Coach for entrepreneurship courses, where I help students strengthen essays and arguments. Before I began at Brown, however, I co-founded Girl Up Angola, a youth-led initiative that tackled period poverty in Angola, which ignited my commitment to passion projects and community-based education.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI look forward to working with students in a variety of subjects — from reading to history projects, French, writing, public speaking, and even creative areas like photography and fashion (my personal hobbies!). I also especially enjoy guiding students through college essay writing and academic coaching, since I know how empowering it feels to find your own voice.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy past experiences as a tutor include: 1) Math Tutoring (Pre-Algebra) at a local high school in Rhode Island 2) English Tutoring of a Francophone refugee family 3) Guiding younger students at my high school with college admissions to top universities in the United States.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAll in all, as a tutor, I care about creating a supportive, motivating environment where students genuinely connect with the material at hand. My goal is for every student I work with to walk away feeling capable, confident, and excited to learn.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my academic and professional life, I enjoy pilates, soccer (or football as I call it! Who here is a Benfica and PSG fan?!), spending time with friends and family, reading French literature, traveling to new places, and eating great food.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am excited to meet you and work with you and your student and watch them transform into young adults capable of changing the world :)\u003c/p\u003e","teachingVideoPlaybackId":"VEz1JOO01ZRWQ3Bp34uQyNAMtRqbRvZX31eTJ1wtI9io","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1e3f344a-c63f-4b54-96e6-3ca801b4878a\"}"},{"__ref":"Favorites:{\"uuid\":\"c95d66a6-62d9-47c3-8cdf-b38f4cf4b4db\"}"}],"causesSupported":[],"major":"International and Public Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1bb8ca83-cbcb-4071-9602-3fd42a5e64e5\"}"},{"__ref":"DeepDives:{\"uuid\":\"c4
