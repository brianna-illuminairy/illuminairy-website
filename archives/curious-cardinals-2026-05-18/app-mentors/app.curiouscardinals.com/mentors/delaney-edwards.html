"question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"e5760f41-c7f2-452a-bcd9-3bc447a622c1\"}":{"__typename":"DeepDives","uuid":"e5760f41-c7f2-452a-bcd9-3bc447a622c1","content":null,"videoPlaybackId":"te7KqcEK3iJY0242Hzx42jwCuwAu74gyX6FNj00i8MXVU","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"2e660c26-a72c-4fd8-ad68-bb5fa24c5407\"}":{"__typename":"DeepDives","uuid":"2e660c26-a72c-4fd8-ad68-bb5fa24c5407","content":null,"videoPlaybackId":"k01Pszv1401TX02yoa02BWxMZ00HzzvXzKQegNkDfHFmXhD4","question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"513886e6-80ad-4c76-8508-bd798bc34348\"}":{"__typename":"DeepDives","uuid":"513886e6-80ad-4c76-8508-bd798bc34348","content":"\u003cp\u003eMy dream job is to be a Product Designer for a non-profit or EdTech company.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"d5cfd745-2938-4f4b-826a-776fc8c1687a\"}":{"__typename":"School","uuid":"d5cfd745-2938-4f4b-826a-776fc8c1687a","name":"Mount Si High School","city":"Snoqualmie","type":"HIGH","state":"Washington","country":"United States","zip":"98065"},"Education:{\"uuid\":\"deef1223-a09d-4e88-ba07-3a131c01cb89\"}":{"__typename":"Education","uuid":"deef1223-a09d-4e88-ba07-3a131c01cb89","school":{"__ref":"School:{\"uuid\":\"d5cfd745-2938-4f4b-826a-776fc8c1687a\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2a02358a-dc1b-4555-a7a9-d087e5dbc17d\"}":{"__typename":"School","uuid":"2a02358a-dc1b-4555-a7a9-d087e5dbc17d","name":"University of Washington","city":"Seattle","type":"COLLEGE","state":"Washington","country":"United States","zip":"98195"},"Education:{\"uuid\":\"c65d073b-62ef-40e7-81ec-df7a86dc588f\"}":{"__typename":"Education","uuid":"c65d073b-62ef-40e7-81ec-df7a86dc588f","school":{"__ref":"School:{\"uuid\":\"2a02358a-dc1b-4555-a7a9-d087e5dbc17d\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Informatics","degree":null},"MentorPublicProfile:{\"uuid\":\"9aa4b136-dfb3-42ce-bd1c-ab48ab625472\"}":{"__typename":"MentorPublicProfile","uuid":"9aa4b136-dfb3-42ce-bd1c-ab48ab625472","displayName":"Delaney E.","slug":"delaney-edwards","biography":"\u003cp\u003eHey there! I'm Delaney, a recent University of Washington grad, with a degree in Informatics. Not sure what that is? You're not alone! Informatics is all about using information and technology to make the world a better place. This could look like designing screen readers to help the blind access information or creating a platform that helps people find unbiased, truthful news among all of the noise. These are the kinds of problems I would love to work on as a Product Designer. I want to design products with and for people!\u003cbr\u003e\u003cbr\u003eNow, how did I end up where I am today? Well, it all started back in elementary school when I joined a FIRST Lego League robotics team, where I got to tinker, engineer, program, collaborate, CAD model, 3D print, and even drive the robot. After about 10 years of being involved in FIRST robotics, I realized that engineering was not for me, but that I loved tech, and that's how I stumbled into pursuing design. Growing up, I was also involved in sports (softball, basketball, and soccer), loved to make stop-motion videos, and explored many other creative outlets. All of these things come together to form the collaborative, creative, storyteller that I am today. And that's how I plan to show up as a mentor as well!\u003cbr\u003e\u003cbr\u003eI believe mentorship is one of the most important relationships that young people can have, so I'm honored to get to play that role in your kid's life! As a mentor, my favorite way to teach is through hands-on learning. Rather than making your kid sit through a boring lecture, I'd rather see them working on something they're excited about doing. Obviously, I am there to guide them and answer their questions, but some of the fun is seeing them discover things for themselves!\u003cbr\u003e\u003cbr\u003eOutside of all of that, I'm a huge nerd (as you can tell by the photo of my friends and I dressed up for the Renaissance Faire)! Most nights, you can find me playing some sort of video game, recently that has included Valorant, Legend of Zelda: Tears of the Kingdom, and Omega Strikers. I'm also a huge board game nerd and love a good tabletop role-playing game like Dungeons and Dragons. As a side hustle/hobby, I run a sticker and stationery business called Made By Deli, turning my art into physical products that I sell at local art markets! I also enjoy cooking, reading, wakeboarding, and traveling.\u003c/p\u003e","teachingVideoPlaybackId":"02N016tMig02QMR1PPrlNyBoJEvnHlbUA00FA2CRZQ64Qoo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1652e2cd-05aa-4be6-a09f-c241e07e7131\"}"},{"__ref":"Favorites:{\"uuid\":\"815ecc10-a749-43fe-bda6-b877fad37933\"}"},{"__ref":"Favorites:{\"uuid\":\"2ae103e9-ca99-4c3f-a656-e22e95af5a00\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"69c1e085-22a7-409e-9926-d49ecf2a7f36\"}"}],"major":"Informatics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"07491751-ee10-439e-9f92-3d917f52abef\"}"},{"__ref":"DeepDives:{\"uuid\":\"e5760f41-c7f2-452a-bcd9-3bc447a622c1\"}"},{"__ref":"DeepDives:{\"uuid\":\"2e660c26-a72c-4fd8-ad68-bb5fa24c5407\"}"},{"__ref":"DeepDives:{\"uuid\":\"513886e6-80
