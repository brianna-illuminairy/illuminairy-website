xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5cec138a-69db-4920-b156-74d5bd617771\"}":{"__typename":"DeepDives","uuid":"5cec138a-69db-4920-b156-74d5bd617771","content":"\u003cp\u003e\"Embrace the mosaic.\" Over my college years, I've come to recognize the importance of accepting all parts of yourself, listening to where your curiosity guides you, and applying lessons from seemingly unrelated fields to each other. \u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eWe are all unique individuals with varied and equally deep life experiences, with many different interests and identities co-existing within us. Some of the greatest works of art and technology have been as a result of combining interests or thinking of connections that uniquely exist within us. For example, the idea for the iPhone stemmed from the novel thought to merge technology and caligraphy - the seamless design we associate with Apple came from an act of creativity and connection. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo many middle and high schoolers are pressured societally to fit into boxes - to choose just one interest or part of themselves and identify fully with it. There is bravery, intelligence, and creativity in resisting this pull - be a paradox! Embrace the mosaic of experiences that encompass you, and who knows, maybe you will have the idea for the next iPhone!\u003c/p\u003e\u003cp\u003e \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a0185041-9d6f-433b-a048-8a0d75c5fa19\"}":{"__typename":"DeepDives","uuid":"a0185041-9d6f-433b-a048-8a0d75c5fa19","content":"\u003cp\u003eMentorship is like a guiding light for me on the journey of both personal and professional growth. It represents the sharing of wisdom and experiences, helping to illuminate possibilities and unlock new opportunities. During my time in college and the start of my career, having mentors has been crucial. They've acted like a compass, guiding me through a world full of choices and encouraging me to step beyond the usual limits.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe real value of mentorship is its ability to connect, inspire, and empower. It creates a space where ideas and knowledge can flow freely, supporting a kind of growth that benefits both the mentor and the mentee. A mentor can see the combination of interests, abilities, and potential within us. They help sharpen this into a clearer vision of what we might achieve, pushing us to explore our interests more deeply and to see how our various experiences can connect.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt its heart, mentorship reflects the idea of 'embracing the mosaic' within us. It celebrates our individuality, urging us to weave together our different interests and experiences into a unified whole. It shows us that innovation and creativity often come from bringing diverse paths together. More than just getting guidance, mentorship is about continuing the cycle of learning and growing. It plays a crucial role in my life, shaping not only who I am now but also who I want to become.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"8a04f120-f031-4e5d-8692-fe7301b9a3e2\"}":{"__typename":"DeepDives","uuid":"8a04f120-f031-4e5d-8692-fe7301b9a3e2","content":"\u003cp\u003eMusic is a huge part of my life! From a young age, I trained in South Asian classical music, and went on to immersive myself in vocal performance, beatboxing, percussion, and music production! Whenever I have a free moment, I can often be found listening to or creating music. I've even taken a few music classes here at Brown!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"713cc3fe-70a0-43ac-ad2b-ce8057c63ce1\"}":{"__typename":"School","uuid":"713cc3fe-70a0-43ac-ad2b-ce8057c63ce1","name":"The Wheeler School","city":"Providence","type":"HIGH","state":"Rhode Island","country":"United States","zip":"02906"},"Education:{\"uuid\":\"43a4eefb-06fc-4e67-b599-64eb723b5f89\"}":{"__typename":"Education","uuid":"43a4eefb-06fc-4e67-b599-64eb723b5f89","school":{"__ref":"School:{\"uuid\":\"713cc3fe-70a0-43ac-ad2b-ce8057c63ce1\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"e3d161a3-5648-4577-960c-1e6fc054934b\"}":{"__typename":"Education","uuid":"e3d161a3-5648-4577-960c-1e6fc054934b","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science-Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"efdb8b44-0eba-4078-abb8-af54214ed450\"}":{"__typename":"MentorPublicProfile","uuid":"efdb8b44-0eba-4078-abb8-af54214ed450","displayName":"Arvind S.","slug":"arvind-sridhar","biography":"\u003cp\u003eHey there! My name is Arvind Sridhar - I'm a senior at Brown University studying Computer Science and Economics. My interest lies particularly in entrepreneurship - I've always viewed technology as a toolbox that allows us to tackle the world's most difficult challenges. I'm particularly invested in the study of creativity and how to cultivate it - what makes us creative? How do we access and communicate our creativity? How should we use art (technology included) to help others? These are questions I love to ask daily!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was a member of a nationally competitive singing group, the debate team, the varsity basketball team, and was one of the senior class presidents. At Brown, I have served as a co-president of the Brown Entrepreneurship Program, the largest entrepreneurship club at Brown consisting of 120 students, as well as President of the Brown Lecture Board, an organization dedicated to bringing in prominent speakers from all over the world to the university. Following my graduation from Brown, I will be pursuing a full-time career as a Product Manager at Adobe in San Fransisco, working at the intersection of AI, art, business, and ethics. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm particularly interested in helping students who want to access and exercise their creativity. Whether that be through technology and coding, writing, music, or speech, I'm here to help!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science-Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5cec138a-69db-4920-b156-74d5bd617771\"}"},{"__ref":"DeepDives:{\"uuid\":\"a0185041-9d6f-433b-a048-8a0d75c5fa19\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a04f120-f031-4e5d-8692-fe7301b9a3e2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4b167c41-e9ca-4037-bc40-fd61979a40c0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"43a4eefb-06fc-4e67-b599-64eb723b5f89\"}"},{"__ref":"Education:{\"uuid\":\"e3d161a3-5648-4577-960c-1e6fc054934b\"}"}],"hiredAt":"2024-01-17T14:30:27.959Z","topics":["Coding / Programming","Machine Learning / AI","Product Design","Finance / Investing","Business / Entrepreneurship","Negotiation","Music","College Essay Writing","Public Speaking"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"arvind-sridhar\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"efdb8b44-0eba-4078-abb8-af54214ed450\"}"}}},"_sentryTraceData":"c22404d69e9f42b6837b7dc7a0dee955-804615e3fc6e040a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c22404d69e9f42b6837b7dc7a0dee955,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"arvind-sridhar"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.h
