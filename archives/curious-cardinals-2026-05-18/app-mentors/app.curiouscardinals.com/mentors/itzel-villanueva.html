xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"dc342e09-89c9-43a0-b104-ffe8a7783d19\"}":{"__typename":"Favorites","uuid":"dc342e09-89c9-43a0-b104-ffe8a7783d19","photoUrl":"https://ucarecdn.com/de8b4a1b-5007-4087-acc4-75b7f545b354/","title":"MESSI","type":"ATHLETE"},"Favorites:{\"uuid\":\"a5fc3d46-80ee-40cb-bcf3-a7786c916e41\"}":{"__typename":"Favorites","uuid":"a5fc3d46-80ee-40cb-bcf3-a7786c916e41","photoUrl":"https://ucarecdn.com/de8b4a1b-5007-4087-acc4-75b7f545b354/","title":"Soccer","type":"SPORT"},"Favorites:{\"uuid\":\"8de9ff0e-3e6f-4bf6-bd11-e353db4c9fc4\"}":{"__typename":"Favorites","uuid":"8de9ff0e-3e6f-4bf6-bd11-e353db4c9fc4","photoUrl":"https://ucarecdn.com/de8b4a1b-5007-4087-acc4-75b7f545b354/","title":"Iron Man","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"48f76a89-9ad5-4d7f-8d1d-a41f8f2a8daf\"}":{"__typename":"DeepDives","uuid":"48f76a89-9ad5-4d7f-8d1d-a41f8f2a8daf","content":"\u003cp\u003eIn my free time, I love staying active—playing soccer, hitting the gym, or going for runs in DTLA. Photography is another passion of mine, adding a creative twist in my spare time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8d86582f-20d3-467e-84ad-c8a1aa04fdeb\"}":{"__typename":"DeepDives","uuid":"8d86582f-20d3-467e-84ad-c8a1aa04fdeb","content":"\u003cp\u003eI'm deep into a passion project, crafting an app for the USC Track and Field team. It's all about streamlining coaching tasks, from tracking times to managing schedules. But the real excitement comes from integrating high-tech analysis to enhance athlete performance—specifically, refining running form for those personal record victories. It's the perfect fusion of my love for sports and tech!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"13caee3c-8850-4d15-982a-43a2885fbf6e\"}":{"__typename":"DeepDives","uuid":"13caee3c-8850-4d15-982a-43a2885fbf6e","content":"\u003cp\u003eIf I could offer advice to my middle school/high school self, it would be this: never underestimate your abilities and embrace every opportunity that comes your way. Life-changing moments often arise from unexpected chances. Most importantly, enjoy precious moments with friends and family. Don't let school stress consume you—cherish these experiences because they'll become lasting memories. Remember, school is temporary, but the memories you create are lifelong.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"3c807699-e039-415a-8c8f-a84ca9f0e7a1\"}":{"__typename":"DeepDives","uuid":"3c807699-e039-415a-8c8f-a84ca9f0e7a1","content":"\u003cp\u003eSomething not immediately evident about me is my passion for baking and collecting stickers from my travels. It's a unique way I cherish memorable adventures with wonderful people, and though I don't often mention it, perfecting cakes is a delightful pastime that truly satisfies my sweet tooth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef\"}":{"__typename":"School","uuid":"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90089"},"Education:{\"uuid\":\"eaf6c356-a08e-454d-bff5-b1510d144639\"}":{"__typename":"Education","uuid":"eaf6c356-a08e-454d-bff5-b1510d144639","school":{"__ref":"School:{\"uuid\":\"d16e07a7-3fe0-48fa-9c86-2b6d06bfcdef\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"CSBA","degree":"Bachelor's of Science Computer Science Business Administration"},"School:{\"uuid\":\"092b9388-aa31-4847-ab7b-ae2addce2b09\"}":{"__typename":"School","uuid":"092b9388-aa31-4847-ab7b-ae2addce2b09","name":"Orange Vista High School","city":"Perris","type":"HIGH","state":"California","country":"United States","zip":"92571"},"Education:{\"uuid\":\"2c4a61cb-ce51-4484-a1ad-c51dda231a78\"}":{"__typename":"Education","uuid":"2c4a61cb-ce51-4484-a1ad-c51dda231a78","school":{"__ref":"School:{\"uuid\":\"092b9388-aa31-4847-ab7b-ae2addce2b09\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"f58c1a1b-a311-4810-b8a0-634ade23d781\"}":{"__typename":"MentorPublicProfile","uuid":"f58c1a1b-a311-4810-b8a0-634ade23d781","displayName":"Itzel V.","slug":"itzel-villanueva","biography":"\u003cp\u003eItzel is a Southern California native currently navigating her senior year at the University of Southern California. She's currently majoring in Computer Science Business Administration. Her deep-seated love for soccer ignited a passion for sports, culminating in rewarding volunteer and work experiences within the industry. This includes contributions to esteemed organizations such as the NFL Superbowl LVI and USC Track and Field, affording the privilege of collaborating with gold Olympic athletes.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eItzel's fervor for problem-solving led to two consecutive summer internships at Microsoft, engaging in both software engineering and product management. These experiences significantly expanded her skill set and seamlessly merged her interests in business and technology. \u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring high school, Itzel was actively involved in sports, serving as the captain of her soccer team and cross country. In addition, she contributed to student government as the VP of social media, playing a role in creating event wrap video edits and pictures. Notably, she was part of her high school's Scholar Program and graduated as a Valedictorian.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academic and professional pursuits, Itzel finds joy in exploring the realm of robotics. Collaborating with her team last year, she had the exciting opportunity to construct a small robotic soccer leg. During her free time, she continues to indulge in soccer games, walks with her golden retriever (Nala), and enjoys nature through hiking. A devoted supporter of Barcelona, she also tunes in to the Lakers during the basketball season. Itzel is genuinely thrilled about the possibility of meeting and connecting with you!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"dc342e09-89c9-43a0-b104-ffe8a7783d19\"}"},{"__ref":"Favorites:{\"uuid\":\"a5fc3d46-80ee-40cb-bcf3-a7786c916e41\"}"},{"__ref":"Favorites:{\"uuid\":\"8de9ff0e-3e6f-4bf6-bd11-e353db4c9fc4\"}"}],"causesSupported":[],"major":"CSBA","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"48f76a89-9ad5-4d7f-8d1d-a41f8f
