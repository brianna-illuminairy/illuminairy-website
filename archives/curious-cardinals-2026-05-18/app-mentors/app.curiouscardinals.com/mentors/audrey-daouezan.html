xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"97b7cee4-425c-4e82-8009-ebb4ee1c6183\"}":{"__typename":"DeepDives","uuid":"97b7cee4-425c-4e82-8009-ebb4ee1c6183","content":"\u003cp\u003eIf I had to give advice to my middle or high school self, I would tell myself to trust myself more and to try more things, without worrying so much about what others might think. Sometimes we tell ourselves that no one has done this before, or that it might be strange or risky, but if you truly feel passionate about something, you should trust that feeling and give it a try. That age is a time when you have both the time and the freedom to explore, to focus on yourself, and to fully commit to different projects. By trying many things and going all in, you can really build yourself and later choose the path that feels right for you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8d155f94-eccf-4950-8f0c-6712faa56210\"}":{"__typename":"DeepDives","uuid":"8d155f94-eccf-4950-8f0c-6712faa56210","content":"\u003cp\u003eMentorship matters to me because there have been people along my path who supported me during moments of doubt and inspired me to keep going. I saw firsthand how much of an impact their guidance had on my confidence and on my career. At the same time, there were moments when I would have really benefited from having a mentor, but couldn’t find one, and that experience stayed with me. It made me want to be that person for someone else.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve seen the role a mentor can play in shaping someone’s trajectory, especially in fields like science, where self-doubt is very common, and people often question their abilities. Being able to accompany someone, guide them, and share what I’ve learned feels very important to me. I want to help create the kind of support that builds confidence, reduces doubt, and allows people to move forward more smoothly.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"13f11c69-814a-4ad4-a316-3d6f537a9d0b\"}":{"__typename":"DeepDives","uuid":"13f11c69-814a-4ad4-a316-3d6f537a9d0b","content":"\u003cp\u003eMy greatest source of motivation is the desire to have a real impact in the world. I want to help people and build something that genuinely changes lives. For me, success means creating something meaningful and exceptional while bringing others along with me. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat’s why Curious Cardinals' mission resonates so strongly with me: as I build my own path, I also want to have the opportunity to help others build theirs. Being able to grow while empowering others is what motivates me most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"692e44a9-cdfa-4f96-ad77-09bd3570a476\"}":{"__typename":"DeepDives","uuid":"692e44a9-cdfa-4f96-ad77-09bd3570a476","content":"\u003cp\u003eOne passion project I’ve been involved in is music, and more specifically, the cello, which I studied for several years. Through this, I had the opportunity to perform concerts in community and youth centers for people who didn’t have access to music. I was incredibly proud to be able to share music in those settings and to encourage young people who had never been exposed to it before, sometimes even sparking new interests or vocations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat experience was the first time I truly realized how powerful transmitting knowledge and passion can be, especially to younger audiences. It showed me that sharing what you’ve learned can have a real impact, and it’s a big reason why I want to continue doing that today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"ddbefb60-fc86-46fd-b26a-b960d2bf1c79\"}":{"__typename":"School","uuid":"ddbefb60-fc86-46fd-b26a-b960d2bf1c79","name":"Rosa Parks High School","city":"La Roche-sur-Yon","type":"HIGH","state":"Pays de la Loire","country":"France","zip":"85000"},"Education:{\"uuid\":\"e8313b42-4baa-4be4-a57d-e3ce42327bb3\"}":{"__typename":"Education","uuid":"e8313b42-4baa-4be4-a57d-e3ce42327bb3","school":{"__ref":"School:{\"uuid\":\"ddbefb60-fc86-46fd-b26a-b960d2bf1c79\"}"},"startYear":"2012","endYear":"2015","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"5fb8a714-5500-413a-bc88-25ae31d899e4\"}":{"__typename":"Education","uuid":"5fb8a714-5500-413a-bc88-25ae31d899e4","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2026","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"ee02f0f7-cd12-4bef-950f-5b616d38d2d8\"}":{"__typename":"MentorPublicProfile","uuid":"ee02f0f7-cd12-4bef-950f-5b616d38d2d8","displayName":"Audrey D.","slug":"audrey-daouezan","biography":"\u003cp\u003eHii, this is Audrey!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m French, originally from the southwest of France, and I’d describe myself as an engineer-manager with a wide range of interests and a strong curiosity about the world. I enjoy learning across different subjects and exploring paths that combine science, problem-solving, and real-world impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver the years, I’ve had diverse professional experiences that helped shape how I think and what I care about. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI started my career working in banking, then moved into strategy roles, and later into venture capital. Through these experiences, I worked with many different teams and projects, and I saw how ideas grow from early stages into something concrete. This is also where I realized how much I enjoy helping people develop projects that can have a real impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic path reflects that mix. I earned a Master’s degree in Finance and Strategy from Sciences Po Paris, and later completed a Master’s in Chemical Engineering at Columbia University. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver time, I became especially interested in topics related to energy, climate, and AI. I’m drawn to science because it helps us understand our environment and gives us the tools to create practical solutions that can improve people’s lives. I love learning how things work and turning that knowledge into something tangible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eImpact is very important to me. I care deeply about helping people grow and gain confidence, especially at moments when they are unsure of themselves or their direction. I know from experience that having someone who listens, encourages, and believes in you can make a huge difference, particularly in scientific fields, where many students doubt their abilities. I want to help you on your journey and show you that you’re capable of more than you might think!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, music has played a big role in my life. I studied the cello for many years and had the chance to perform concerts in community and youth centers for people who didn’t have access to music. Sharing music in those environments and seeing how it could spark curiosity or confidence was incredibly meaningful. It was one of the first times I realized how powerful transmission can be.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also very active and love sports. They’ve taught me perseverance, discipline, and balance, skills that are just as important in school and personal projects as they are outside the classroom.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I’m very attentive, adaptable, and focused on building a real relationship with my students. I want to understand who you are, what excites you, and what you’re still figuring out. My goal is to help you explore your interests, build confidence, and move forward with clarity while working together on projects that truly matter to you.\u003c/p\u003e","teachingVideoPlaybackId":"oyNzIleaf88MFwYueybRgWnqwAnlLe01I6bmv7900c82s","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Chemical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"97b7cee4-425c-4e82-8009-ebb4ee1c6183\"}"},{"__ref":"DeepDives:{\"uuid\":\"8d155f94-eccf-4950-8f0c-6712faa56210\"}"},{"__ref":"DeepDives:{\"uuid\":\"13f11c69-814a-4ad4-a316-3d6f537a9d0b\"}"},{"__ref":"DeepDives:{\"uuid\":\"692e44a9-cdfa-4f96-ad77-09bd3570a476\"}"}],"active":t
