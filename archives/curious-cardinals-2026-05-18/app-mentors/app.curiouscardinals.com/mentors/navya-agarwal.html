5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f15d91d6-b81c-4d56-a187-0370e51a31a8\"}":{"__typename":"DeepDives","uuid":"f15d91d6-b81c-4d56-a187-0370e51a31a8","content":"\u003cp\u003eI created Project Limitless, a non-profit that brought together 250+ volunteers to create murals across India. These murals carried messages of social change/anecdotes from marginalized communities. I'm so grateful to have led this organization for 4 years and created change in a way that is true to my passions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"89267bb7-241f-49fd-8371-20ef72ed24ba\"}":{"__typename":"DeepDives","uuid":"89267bb7-241f-49fd-8371-20ef72ed24ba","content":"\u003cp\u003eI want to start my own sustainable fashion brand with designs by women from my ancestral state: Rajasthan, India!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"69ce23dc-67ff-4da8-97ff-295dfb56cc36\"}":{"__typename":"Education","uuid":"69ce23dc-67ff-4da8-97ff-295dfb56cc36","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"ECONOMICS + ART","degree":"BA"},"School:{\"uuid\":\"31606823-604a-4d56-90eb-632e2de1
