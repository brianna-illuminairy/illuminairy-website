xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3152d099-e879-48a1-bdc1-d072721b4651\"}":{"__typename":"DeepDives","uuid":"3152d099-e879-48a1-bdc1-d072721b4651","content":"\u003cp\u003eI wasn’t always sure I had the capability to pursue a career in STEM until I had a wonderful professor named Dr. Valerie Hower. Under her guidance, I not only passed Calculus 2, but I also finished at the top of my class. Before that point, I had never had the best score in a math class. By affording me tremendous patience and encouragement, Dr. Hower helped me discover my potential in a subject I had always been intimidated by. Since then, I have striven to do the same for my students: there is nothing quite like catalyzing their transformation from being unconfident in a subject to completely conquering it. Students often develop an appreciation and sometimes even a passion for what they’ve built proficiency in. I’ve had students actually comment on “the beauty” of problems like they’re 3Blue1Brown before, and I haven’t ever felt so proud.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"359efd4f-9d3f-4fba-8df2-932ff5a06bf1\"}":{"__typename":"DeepDives","uuid":"359efd4f-9d3f-4fba-8df2-932ff5a06bf1","content":"\u003cp\u003eIn my spare time I like to read popular speeches, classic books, and my favorite comedy routines to enhance my own capacity for expression. I also like scouring the internet for video games that masterfully leverage the player’s control and perspective to communicate ideas in a manner that other mediums can’t quite. In \u003cem\u003eEverything\u003c/em\u003e, your free reign to do and become whatever you want complements the scattered audio recordings of Alan Watts’ musings on life and the self. All good art provides the audience the tools necessary to arrive at their own conclusion, but there is something much more personal about that journey when you feel like the driving force behind it. I also love the \u003cem\u003eDark Souls \u003c/em\u003eseries, \u003cem\u003eAbzu\u003c/em\u003e, \u003cem\u003eThe Beginner’s Guide, Undertale, \u003c/em\u003eand \u003cem\u003eManifold Garden\u003c/em\u003e.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"d4bf2639-7e4a-424a-afbe-502031075592\"}":{"__typename":"Education","uuid":"d4bf2639-7e4a-424a-afbe-502031075592","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science","degree":"Bachelors"},"School:{\"uuid\":\"0c392a4e-3115-4e65-9060-88330d116dcf\"}":{"__typename":"School","uuid":"0c392a4e-3115-4e65-9060-88330d116dcf","name":"FAU High School","city":"Boca Raton","type":"HIGH","state":"Florida","country":"United States","zip":"33431"},"Education:{\"uuid\":\"55238d57-dcc2-4fc2-b5c1-d2ec6acafeb6\"}":{"__typename":"Education","uuid":"55238d57-dcc2-4fc2-b5c1-d2ec6acafeb6","school":{"__ref":"School:{\"uuid\":\"0c392a4e-3115-4e65-9060-88330d116dcf\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"c87d0fe6-6294-44f6-9fa3-2dd32ac9d774\"}":{"__typename":"MentorPublicProfile","uuid":"c87d0fe6-6294-44f6-9fa3-2dd32ac9d774","displayName":"Asher H.","slug":"asher-hensley","biography":"\u003cp\u003eI am a senior at Stanford University pursuing a Bachelor's in Computer Science with a specialization in Artificial Intelligence. Having mentored SAT prep classes of over 600 students for the past four years, I pride myself on my ability to create meaningful relationships with my students. \u003cbr\u003e\u003cbr\u003eI would describe my teaching style as highly adaptive; I will simplify a complex concept into easily digestible chunks and finally assemble them all in a scenario that will either take the form of a practice problem or a project. If a concept is too simple, I'll work in reverse and combine it with more difficult concepts to create a scenario.\u003cbr\u003e\u003cbr\u003eI like to have fun with my students and tie our lessons back to things that they're interested in. I love connecting through a mutual interest in music, movies, cars, video games, books, and thought-provoking hypotheticals. \u003cbr\u003e\u003cbr\u003eI firmly believe that anyone can find success in what they love, and I am determined to help you realize your aspirations!\u003c/p\u003e","teachingVideoPlaybackId":"Y95fUa6rM3glE6NfXGJ0200sLdlgkAJ2rzhbHzyHQg9Aw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3152d099-e879-48a1-bdc1-d072721b4651\"}"},{"__ref":"DeepDives:{\"uuid\":\"359efd4f-9d3f-4fba-8df2-932ff5a06bf1\"}"}],"active":true,"profilePhotos":["https://api.dicebear.com/7.x/initials/svg?seed=AH"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d4bf2639-7e4a-424a-afbe-502031075592\"}"},{"__ref":"Education:{\
