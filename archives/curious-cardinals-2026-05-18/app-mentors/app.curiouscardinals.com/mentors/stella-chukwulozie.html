xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c3823520-8724-486e-817a-b4da5cc3425c\"}":{"__typename":"DeepDives","uuid":"c3823520-8724-486e-817a-b4da5cc3425c","content":"\u003cp\u003eIf I could go back and give my middle or high school self one piece of advice, it would be to enjoy the present moment. Like many students, I was driven to succeed, placing a lot of pressure on myself. My days were packed with school, swim practice, and homework. While I thrived on being busy, I sometimes forgot to pause and appreciate the journey. I loved the challenge of pushing myself in school, the camaraderie of my swim team, and the close-knit group of friends I had. But looking back, I realize I was so focused on the next goal—achieving a certain grade, qualifying for a swim meet, or preparing for the future—that I missed out on fully experiencing the small, joyful moments along the way. I would tell my younger self that it’s okay to strive for excellence, but it’s equally important to savor the present and celebrate small victories.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"723b8522-090a-481e-896b-ba801d302dca\"}":{"__typename":"DeepDives","uuid":"723b8522-090a-481e-896b-ba801d302dca","content":"\u003cp\u003eEspecially in my middle and lower school years, I struggled in certain subjects and often felt disconnected from the way information was presented by teachers. When I finally found a way to make things click—whether through a YouTube video, a textbook, or a classmate's help—it was a moment of immense relief and pride. This experience taught me that everyone learns differently, and the key to understanding is finding the right approach. I also have two younger siblings who further taught me how uniquely each of our minds works. Mentoring my siblings and helping them overcome their own academic challenges made me realize that as gratifying as it was to reach my own understanding, guiding someone else to that point is even more rewarding. That’s why I’m passionate about mentorship—because I know firsthand the value of personalized learning and the joy of helping others succeed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d1cecdf7-490b-4f04-bef1-0d816e365815\"}":{"__typename":"DeepDives","uuid":"d1cecdf7-490b-4f04-bef1-0d816e365815","content":"\u003cp\u003eDuring my freshman year at Brown, I explored a wide range of subjects, taking courses in seven different departments. My goal was to let my passion guide my decision on what to study, and that approach led me to choose psychology as my major. I found myself naturally drawn to understanding the world through human interactions, decisions, and thoughts. It became clear to me that while various factors, like economics or the environment, are crucial in shaping our world, human behavior ultimately influences every aspect of life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis realization was strengthened by my passion for helping others and my desire to make the world a better place. During a conversation with friends studying different majors, I realized that while they saw economics or the environment as central to our world, I believed that understanding and improving human behavior was the key to positive change. Psychology allows me to explore and understand the complexities of the human mind, which I see as essential to creating meaningful impact in society.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2a96063d-1efc-4111-87d0-cb14548f91c1\"}":{"__typename":"DeepDives","uuid":"2a96063d-1efc-4111-87d0-cb14548f91c1","content":"\u003cp\u003eMy dream job is to be a pediatric psychiatrist. I have always loved children—their honesty, their colorful way of seeing the world, their authenticity, their playfulness, and their incredible intelligence. I believe that children’s challenges, successes, and opinions need to be taken more seriously by society. Working with children is not only fulfilling for me, but it also makes me a better person. I want to dedicate my career to helping children become the best versions of themselves, especially during the critical period when their minds are so malleable and open to growth. As a pediatric psychiatrist, I hope to make a lasting, positive impact on their mental health and well-being, guiding them through their challenges and helping them thrive.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"8fad325c-7b72-4874-978a-b1430f8ce3fd\"}":{"__typename":"School","uuid":"8fad325c-7b72-4874-978a-b1430f8ce3fd","name":"Ethical Culture Fieldston School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"1af7c9f7-cd71-40d9-acb2-05f349469dbd\"}":{"__typename":"Education","uuid":"1af7c9f7-cd71-40d9-acb2-05f349469dbd","school":{"__ref":"School:{\"uuid\":\"8fad325c-7b72-4874-978a-b1430f8ce3fd\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"0751a1db-04da-4bb5-a104-2b35f1f4bb91\"}":{"__typename":"Education","uuid":"0751a1db-04da-4bb5-a104-2b35f1f4bb91","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"psychology \u0026 pre-med","degree":null},"MentorPublicProfile:{\"uuid\":\"b02dd9d0-9298-457b-9794-ddf4f616acd7\"}":{"__typename":"MentorPublicProfile","uuid":"b02dd9d0-9298-457b-9794-ddf4f616acd7","displayName":"Stella C.","slug":"stella-chukwulozie","biography":"\u003cp\u003eHi, I'm Stella, a senior at Brown University majoring in psychology and taking pre-med courses. With a strong academic foundation, I’m passionate about combining my love for science, children, and mental health into a future career in pediatric psychiatry. My interest in this field is fueled by my experiences as a research assistant in Brown’s Causality and Mind Lab, where I help with studies on developmental psychology. I’ve also gained valuable hands-on experience in pediatric settings, including volunteering at NYU Langone Health. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAthletics have been a significant part of my life as well. After years of competitive swimming, I walked on to Brown’s Division I Varsity Swim Team, where I competed for two seasons. Balancing a demanding training schedule with my academics taught me discipline, resilience, and the importance of teamwork–all lessons I hope to share with my mentees.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my academic and athletic pursuits, I’m dedicated to personal wellness and leadership. I completed Brown Outdoor Leadership Training (BOLT), where I trained to lead students on backpacking trips. I also practice mindfulness through meditation, running, and the occasional polar plunge. In my free time, I enjoy connecting with friends, exploring fashion, and trying new foods.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to bring my diverse experiences and passion for learning to a mentorship role, where I hope to help students achieve their academic goals while fostering their personal growth.\u003c/p\u003e","teachingVideoPlaybackId":"u39rN02wlgHrxNSisJb3F738yECl1Yppxqdfan7zQV2U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"psychology \u0026 pre-med","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c3823520-8724-486e-817a-b4da5cc3425c\"}"},{"__ref":"DeepDives:{\"uuid\":\"723b8522-090a-481e-896b-ba801d302dca\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1cecdf7-490b-4f04-bef1-0d816e365815\"}"},{"__ref":"DeepDives:{\"uuid\":\"2a96063d-1efc-4111-87d0-cb14548f91c1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bad30788-5ffb-4799-8dc9-a4488b5ee52c/-/preview/-/format/jpg/","https://ucarecdn.com/6ec42021-cef9-493d-8094-aa94b1a14634/-/preview/-/format/jpg/","https://ucarecdn.com/6556fe23-9ffd-436e-b4db-8a8304ab3c82/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"1af7c9f7-cd71-40d9-acb2-05f349469dbd\"}"},{"__ref":"Education:{\"uuid\":\"0751a1db-04da-4bb5-a104-2b35f1f4bb91\"}"}],"hiredAt":"2024-08-26T23:02:02.503Z","topics":["K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Physics","Creative Writing","K-6 Storybook"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Q
