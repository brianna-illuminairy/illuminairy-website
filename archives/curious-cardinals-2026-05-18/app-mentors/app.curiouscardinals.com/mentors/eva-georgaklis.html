xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"17c60b66-f1e8-487d-82a5-373e0917add1\"}":{"__typename":"DeepDives","uuid":"17c60b66-f1e8-487d-82a5-373e0917add1","content":"\u003cp\u003eMentors are some of the most important people in our lives. The right mentor can provide reassurance during moments of self-doubt, guidance through challenges, and inspiration to keep going when things feel overwhelming. I was fortunate to grow up surrounded by incredible mentors—through school, sports, and at home—who consistently reminded me of who I was and what I was capable of, even when I struggled to see it myself. Their belief in me helped shape my confidence and direction.\u003c/p\u003e\u003cp\u003eI would not be where I am today without those mentors, and I want to pay that forward. By mentoring, I hope to offer the same sense of encouragement, reliability, and inspiration that was given to me, and to help young students realize that they belong, they are enough, and they can succeed. \u003c/p\u003e\u003cp\u003eBeing young can be scary, especially when you’re stepping into spaces where you don’t see many people who look like you. I remember how daunting it felt to pursue STEM as a Hispanic woman, often questioning whether I truly belonged. Those experiences are a big part of why I want to mentor.\u003c/p\u003e\u003cp\u003eI want to be a supportive and encouraging voice for young students who may feel uncertain or intimidated by higher education or technical fields. For students who don’t often see themselves represented, having someone believe in them can make all the difference. I want to remind them that they are capable, that their perspective matters, and that they absolutely deserve to be in these spaces.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4d7e0525-5d9a-40a9-ac91-2976e0fed1b5\"}":{"__typename":"DeepDives","uuid":"4d7e0525-5d9a-40a9-ac91-2976e0fed1b5","content":"\u003cp\u003eI chose my major because I not only love problem-solving, but I also love how, in computer science, you are constantly learning. You’re always discovering new technologies, languages, frameworks, and now even new AI assistants. The field is always evolving, and there is never a limit to what you can learn—or what you can do. The impact you can have simply by knowing how to code is profound, and you can influence virtually any industry in the future. I knew that studying computer science would open many doors for me, while also giving me the opportunity to continually challenge my mind and grow. It’s a field that inspires me every day and keeps me learning, exploring, and pushing my limits.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"833e5519-9450-4645-9e52-3e5b42168568\"}":{"__typename":"DeepDives","uuid":"833e5519-9450-4645-9e52-3e5b42168568","content":"\u003cp\u003eMy dad is my greatest role model and mentor. Growing up, he always made me feel like I could accomplish anything I set my mind to. He taught me the value of diligence, hard work, and determination, and he instilled in me a strong sense of confidence that has carried me through every challenge. I wouldn’t be where I am today without his guidance and support, knowing that I could tackle any challenge life threw at me. Beyond his lessons, he has been a constant source of encouragement, showing me what it means to be unconditionally loved and supported. I hope to one day lead with the same strength, grace, and authenticity that he exemplifies every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ef334fcf-0332-44cb-acd3-0c6b2d2af8db\"}":{"__typename":"DeepDives","uuid":"ef334fcf-0332-44cb-acd3-0c6b2d2af8db","content":"\u003cp\u003eIn my spare time, I love to run! Training adds structure to my day and gives me a goal to work toward. I have learned so much through running, from discipline and perseverance to patience and resilience, and I hope to one day complete all the major marathons. I believe that setting challenges for yourself is essential for personal growth, and running has taught me how rewarding it can be to push beyond your limits.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"e9742e01-48ef-4a94-90d5-9036b65d851f\"}":{"__typename":"Education","uuid":"e9742e01-48ef-4a94-90d5-9036b65d851f","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"School:{\"uuid\":\"fe49eeb1-55b5-43ed-999f-1e28165ceabb\"}":{"__typename":"School","uuid":"fe49eeb1-55b5-43ed-999f-1e28165ceabb","name":"Brookline High School","city":"Brookline","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02445"},"Education:{\"uuid\":\"4b6a1393-27a8-43b6-a71c-005c58f24a98\"}":{"__typename":"Education","uuid":"4b6a1393-27a8-43b6-a71c-005c58f24a98","school":{"__ref":"School:{\"uuid\":\"fe49eeb1-55b5-43ed-999f-1e28165ceabb\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"a3df86df-88b6-428b-a827-68e9d3a4bf6d\"}":{"__typename":"MentorPublicProfile","uuid":"a3df86df-88b6-428b-a827-68e9d3a4bf6d","displayName":"Eva G.","slug":"eva-georgaklis","biography":"\u003cp\u003eHi! My name is Eva, and I’m so glad you’re here :) I’m a senior at Columbia University studying Computer Science, with a strong interest in using technology to create meaningful, real-world impact. I’m especially passionate about sustainability and building tools that support underserved communities, and I’m motivated by the idea that thoughtful technology can help solve complex social challenges.\u003c/p\u003e\u003cp\u003eThrough my academic and professional experiences, I’ve had the opportunity to intern at both Apple and Microsoft, where I gained exposure to large-scale systems, collaborative engineering, and the responsibility that comes with building products used by millions of people. Working on teams at this scale taught me the importance of clear communication, ethical decision-making, and designing with users in mind.\u003c/p\u003e\u003cp\u003eOutside of the classroom and work, I love to travel, meet new people, and explore new places. One of the most formative experiences of my college career was studying abroad in Madrid, where I was able to immerse myself in a new culture, improve my Spanish, and gain a broader perspective on how people around the world interact with technology, community, and daily life. I grew up just outside of Boston as the youngest of four in a Mexican and Greek household, so I learned early on how to collaborate with others, advocate for myself, and compromise; skills that have been integral in both my academic and professional journey.\u003c/p\u003e\u003cp\u003eI’m also an avid runner, and you’ll often find me running in Central Park or along the West Side Highway. This April, I’ll be completing my fifth marathon in Jersey City, an experience that has taught me a lot about discipline, resilience, and the importance of showing up for yourself even when things get hard. In addition to running, I enjoy playing soccer, golf, and springboard diving, all of which have helped shape my appreciation for patience, focus, and continuous improvement. When I’m not training, I love exploring the NYC food scene and trying new restaurants, which I proudly rank on Beli; my favorite app :)\u003c/p\u003e\u003cp\u003eLooking ahead, I hope to continue working at the intersection of technology and social impact, while also helping encourage more young women to feel confident entering and thriving in the tech space. I believe representation matters, mentorship matters, and that there’s room in tech for many different voices, backgrounds, and paths forward.\u003c/p\u003e","teachingVideoPlaybackId":"bfG3ifmeXBn00sWFgSg3ZU02qtgxQiWb00QEkhdt7XIx4U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"17c60b66-f1e8-487d-82a5-373e0917add1\"}"},{"__ref":"DeepDives:{\"uuid\":\"4d7e0525-5d9a-40a9-ac91-2976e0fed1b5\"}"},{"__ref":"DeepDives:{\"uuid\":\"833e5519-9450-4645-9e52-3e5b42168568\"}"},{"__ref":"DeepDives:{\"uuid\":\"ef334fcf-0332-44cb-acd3-0c6b2d2af8db\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ef749189-eea9-49a0-98df-ff7a8347d399/-/preview/-/format/jpg/","https://ucarecdn.com/5a8a3e6c-4b52-408f-b17c-433310aae877/-/preview/-/format/jpg/","https://ucarecdn.com/d222b04b-da82-42ec-a3b5-19fb96c6b9ab/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e9742e01-48ef-4a94-90d5-9036b65d851f\"}"},{"__ref":"Education:{\"uuid\":\"4b6a1393-27a8-43b6-a71c-005c58f24a98\"}"}],"hiredAt":"2026-02-05T15:17:39.099Z","topics":["Pre-Algebra","Algebra I","K-5 Grade Math","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Physics","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Computer Science","Fashion / Cosmetics","Sports Journalism","K-6 Storybook","Web Design","STEM Project","Machine Learning / AI","Medicine / Health","Coding / Programming","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"eva-georgaklis\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a3df86df-88b6-428b-a827-68e9d3a4bf6d\"}"}}},"_sentryTraceData":"1c2d0e76445442d48f255c5237b1fb18-a3f43d47ba6f492c-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1c2d0e76445442d48f255c5237b1fb18,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"eva-georgaklis"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=
