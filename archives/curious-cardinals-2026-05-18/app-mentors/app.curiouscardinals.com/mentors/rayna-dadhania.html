xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"983fed86-0942-4c33-8ad5-d26a094cdda8\"}":{"__typename":"DeepDives","uuid":"983fed86-0942-4c33-8ad5-d26a094cdda8","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I would start by saying: don’t be afraid to take up space. Back then, I often felt like I had to prove myself constantly—through grades, activities, or trying to meet other people’s expectations. I’d remind myself that my voice matters, that it’s okay to share my perspective, and that I don’t need to have everything figured out right away.\u003c/p\u003e\u003cp\u003eI’d also tell my younger self to embrace curiosity and not fear change. At that age, I thought success meant following a strict plan, but I’ve since learned that some of the most meaningful opportunities come from unexpected directions. Trying new things—even if they don’t work out—teaches resilience and helps you discover passions you didn’t know you had.\u003c/p\u003e\u003cp\u003eFinally, I’d remind her of the importance of balance. Being busy doesn’t always equal being successful. Taking time for rest, reflection, and self-care is just as important as working hard. Some of the challenges that feel overwhelming in the moment are actually shaping you into someone stronger, more empathetic, and more determined.\u003c/p\u003e\u003cp\u003eIn short, I’d tell her to trust herself, be patient with the process, and not be afraid of the unknown. Everything she is going through now will prepare her for the future in ways she can’t yet imagine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d439ffb0-9b95-458c-bfa6-fda6a15469f7\"}":{"__typename":"DeepDives","uuid":"d439ffb0-9b95-458c-bfa6-fda6a15469f7","content":"\u003cp\u003eMentorship matters to me because I’ve seen firsthand how guidance, encouragement, and perspective from others can shape both personal and professional growth. At Cornell, I’ve been fortunate to learn from professors, teaching assistants, and peers who took the time to answer my questions, challenge me to think differently, and support me as I explored career paths in hospitality and real estate. Their mentorship not only gave me knowledge but also the confidence to take on leadership roles myself.\u003c/p\u003e\u003cp\u003eRunning my nonprofit, Maya’s Magical Mission, has also shown me the impact of mentorship in a different way. Supporting the special needs community has taught me that mentorship isn’t just about teaching—it’s about listening, uplifting others, and creating opportunities for people to succeed. I’ve realized that mentors can play a key role in helping others believe in their potential, especially when they may not see it themselves.\u003c/p\u003e\u003cp\u003eFor me, mentorship is about creating a cycle of growth. I have benefited from the wisdom of those ahead of me, and I want to pay that forward by supporting others who are just beginning their journeys. Whether it’s helping a classmate with a tough concept as a teaching assistant, encouraging a peer in a club, or guiding younger students, I believe mentorship builds stronger communities where everyone feels valued and supported.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"6fb82943-fe97-47cb-b4b3-055cb094545a\"}":{"__typename":"DeepDives","uuid":"6fb82943-fe97-47cb-b4b3-055cb094545a","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is creating better housing for people during long hospital stays. Growing up with my sister, I saw how much time families spend in and around hospitals and how challenging it can be to balance medical needs with a sense of normalcy. Housing is more than just a place to sleep—it shapes comfort, dignity, and emotional well-being.\u003c/p\u003e\u003cp\u003eThrough my studies in hospitality and real estate, I hope to reimagine spaces where families can live during these difficult times. My vision is to design housing that feels supportive, affordable, and healing, blending hospitality principles with healthcare needs. If I can make even a small difference in improving the quality of life for families going through such stressful experiences, I’ll feel I’ve honored both my sister’s memory and my personal mission.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"41d0066b-a136-4a54-87db-ac491b8ca5a3\"}":{"__typename":"DeepDives","uuid":"41d0066b-a136-4a54-87db-ac491b8ca5a3","content":"\u003cp\u003eI chose my major, Hotel Administration, because it combines my passion for hospitality, business, and service in a way that feels both personal and impactful. Growing up with my sister, who spent a great deal of time in and out of hospitals, I saw how much the built environment and the quality of care affect families during challenging times. That experience inspired me to think about how I could improve spaces and services for people, especially in settings where comfort and community are just as important as medical care.\u003c/p\u003e\u003cp\u003eWhen I discovered the Nolan School of Hotel Administration, I was drawn to its unique blend of business fundamentals—like finance, accounting, and real estate—with the human-centered values of service and hospitality. It gives me the opportunity to study hard numbers while always remembering the people behind them. I love that my coursework challenges me to think analytically about investments and operations while also encouraging me to consider the guest experience.\u003c/p\u003e\u003cp\u003eUltimately, I chose this major because it allows me to pursue my long-term goal: using hospitality and real estate to create supportive environments, such as housing for families during long hospital stays. I see Hotel Administration not just as a degree, but as the foundation for building a career that bridges business, service, and social impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"0184a532-8655-426c-8bf5-23752c2d177b\"}":{"__typename":"School","uuid":"0184a532-8655-426c-8bf5-23752c2d177b","name":"Kingsway Regional High School","city":"Woolwich Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08085"},"Education:{\"uuid\":\"1ee7668a-a8f0-4673-a9c4-0ee63d914f48\"}":{"__typename":"Education","uuid":"1ee7668a-a8f0-4673-a9c4-0ee63d914f48","school":{"__ref":"School:{\"uuid\":\"0184a532-8655-426c-8bf5-23752c2d177b\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"407f5660-1ab1-4c67-807b-55b15a527503\"}":{"__typename":"Education","uuid":"407f5660-1ab1-4c67-807b-55b15a527503","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Hotel Administration ","degree":null},"MentorPublicProfile:{\"uuid\":\"96b27e49-025e-44b5-85fb-a77090db468a\"}":{"__typename":"MentorPublicProfile","uuid":"96b27e49-025e-44b5-85fb-a77090db468a","displayName":"Rayna D.","slug":"rayna-dadhania","biography":"\u003cp\u003eMy name is Rayna, and I am currently a sophomore at Cornell University in the Peter and Stephanie Nolan School of Hotel Administration. I chose Cornell because of its unique ability to combine my interests in hospitality, real estate, and service with a strong foundation in business and finance. Academically, I enjoy the challenge of analyzing problems through both quantitative and qualitative lenses. I spend a great deal of time studying finance, economics, and accounting, while also balancing courses in writing, communications, and science. I have always loved learning across different disciplines, and I believe that my ability to think both critically and creatively allows me to approach challenges from unique perspectives.\u003c/p\u003e\u003cp\u003eOn campus, I am heavily involved in pre-professional organizations that allow me to develop practical skills and connect with peers who share my career interests. I am a teaching assistant for a business computing course, which has given me the opportunity to strengthen my own technical skills while mentoring other students. Serving as a TA has also helped me develop patience, leadership, and the ability to explain complex topics in clear and approachable ways. Outside of the classroom, I participate in clubs that focus on consulting, real estate, and finance. These experiences have pushed me to explore how hospitality and business intersect with other industries, while also preparing me for future career opportunities.\u003c/p\u003e\u003cp\u003eBeyond academics, one of the most meaningful parts of my life is my nonprofit, Maya’s Magical Mission. I founded this organization in honor of my sister, Maya, who had special needs. Through my nonprofit, I support and advocate for the special needs community by organizing events, raising awareness, and providing scholarships. Running the nonprofit has taught me valuable lessons in leadership, organization, and resilience. It has also given me the privilege of seeing the direct impact of service and the importance of advocating for those who may not always have a voice. This work is not only a source of pride but also a strong motivator in my academic and professional pursuits.\u003c/p\u003e\u003cp\u003ePersonally, I enjoy staying active and grounded through yoga and running. Both are practices that help me manage stress, build discipline, and maintain balance in a busy schedule. I also love math, English, and science, which reflects my curiosity across diverse subjects. Whether I am analyzing a financial model, writing a paper, or exploring a new idea, I bring passion and determination to everything I do.\u003c/p\u003e\u003cp\u003eOverall, I would describe myself as hardworking, service-driven, and eager to keep learning. My experiences in academics, extracurriculars, and nonprofit leadership have shaped me into someone who values perseverance, community, and creativity.\u003c/p\u003e","teachingVideoPlaybackId":"YyQoRjdgT7j4j2JHJgq1J5NY2BTyrxYHsDDg2O8BLTo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Hotel Administration ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"983fed86-0942-4c33-8ad5-d26a094cdda8\"}"},{"__ref":"DeepDives:{\"uuid\":\"d439ffb0-9b95-458c-bfa6-fda6a15469f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"6fb82943-fe97-47cb-b4b3-055cb094545a\"}"},{"__ref":"DeepDives:{\"uuid\":\"41d0066b-a136-4a54-87db-ac491b8ca5a3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/91ddcffa-cd3c-4bfc-aa2b-dca77df9f538/-/preview/-/format/jpg/","https://ucarecdn.com/60f69d71-caea-49da-9c1b-a023fc1eeffc/-/preview/-/format/jpg/","https://ucarecdn.com/67eb3e2a-9d70-4c0e-bc25-8e9a03d05598/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1ee7668a-a8f0-4673-a9c4-0ee63d914f48\"}"},{"__ref":"Education:{\"uuid\":\"407f5660-1ab1-4c67-807b-55b15a527503\"}"}],"hiredAt":"2025-09-23T15:41:51.106Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Statistics","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"rayna-dadhania\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"96b27e49-025e-44b5-85fb-a77090db468a\"}"}}},"_sentryTraceData":"5c3e139e5b7a4f4d87b9906f80f8b0a5-a597f5d3b2240e47-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=5c3e139e5b7a4f4d87b9906f80f8b0a5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"rayna-dadhania"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'
