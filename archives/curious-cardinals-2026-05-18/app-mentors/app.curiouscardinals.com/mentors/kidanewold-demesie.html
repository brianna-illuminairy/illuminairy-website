xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b31bc66c-c6fb-42d9-9578-58c28d44621e\"}":{"__typename":"DeepDives","uuid":"b31bc66c-c6fb-42d9-9578-58c28d44621e","content":"\u003cp\u003eMentorship matters to me because I’ve seen firsthand the impact it has had on my life. I wouldn’t be where I am today without the guidance and support of people who took the time to help me navigate challenges, whether it was applying to schools, exploring career paths, or simply believing in myself. Having mentors showed me what was possible and gave me the confidence to pursue opportunities I might have otherwise overlooked. That’s why I’m so passionate about paying it forward—because I know how life-changing it can be to have someone in your corner, pushing you to reach your full potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3617b5f5-2aea-4d02-8be0-9526d9e43ab0\"}":{"__typename":"DeepDives","uuid":"3617b5f5-2aea-4d02-8be0-9526d9e43ab0","content":"\u003cp\u003eIf I could give my middle or high school self advice, it would be to value mentorship more and not be afraid to ask for help\u003cstrong\u003e. \u003c/strong\u003eI used to think I had to figure everything out on my own, but the truth is, so many people are willing to guide and support you—you just have to reach out. Seeking advice, learning from others’ experiences, and building connections can open doors you never even knew existed. There’s no shame in not knowing something; the real mistake is not asking.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bb9ec521-e0c0-4e24-9cc0-045c364d4f4c\"}":{"__typename":"DeepDives","uuid":"bb9ec521-e0c0-4e24-9cc0-045c364d4f4c","content":"\u003cp\u003eI chose my major because I’ve always loved both natural and social sciences, and I was drawn to the way math and computer science break down complex problems into smaller, solvable pieces. There's something fascinating about taking a big challenge, breaking it into its core components, and systematically finding a solution. That same structured problem-solving approach applies not just to coding or equations, but also to understanding economic systems and human behavior. Studying both computer science and economics allowed me to merge my analytical mindset with my curiosity about how the world works, giving me the tools to tackle real-world challenges from multiple angles.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"737300b2-8a45-4271-8bcd-cad7b5062622\"}":{"__typename":"DeepDives","uuid":"737300b2-8a45-4271-8bcd-cad7b5062622","content":"\u003cp\u003eIn my spare time, I love staying active—I enjoy exercising, running, and playing soccer whenever I get the chance. It helps me clear my mind and stay energized. I also have a passion for trying out different restaurants, especially ones that offer cuisines from different countries. Exploring new foods and flavors is something I really enjoy, as it’s a great way to experience different cultures and connect with people through shared meals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"ad9c991c-64bc-401a-80bc-b9c6906f7e27\"}":{"__typename":"School","uuid":"ad9c991c-64bc-401a-80bc-b9c6906f7e27","name":"Saint Joseph High School","city":"Addis Ababa","type":"HIGH","state":"Ethiopia","country":"Ethiopia","zip":" Kifle Kirte 10, Woreda 01, House No. 1000"},"Education:{\"uuid\":\"e1a2b12b-4305-4784-86cd-9ca2ec4ccf0c\"}":{"__typename":"Education","uuid":"e1a2b12b-4305-4784-86cd-9ca2ec4ccf0c","school":{"__ref":"School:{\"uuid\":\"ad9c991c-64bc-401a-80bc-b9c6906f7e27\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"b85aa807-494f-4656-b7ca-e7439d815306\"}":{"__typename":"Education","uuid":"b85aa807-494f-4656-b7ca-e7439d815306","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2026","major":"Predoctoral Fellow","degree":null},"MentorPublicProfile:{\"uuid\":\"903061b7-21ac-4120-8187-69be0589621b\"}":{"__typename":"MentorPublicProfile","uuid":"903061b7-21ac-4120-8187-69be0589621b","displayName":"Kidanewold D.","slug":"kidanewold-demesie","biography":"\u003cp\u003eMy name is Kidan, and I am a first-generation student, born and raised in Ethiopia. I came to the U.S. on full scholarships for my education, and I’ve been fortunate enough to give back by mentoring other students like me—helping them access even better opportunities in high schools and colleges.\u003c/p\u003e\u003cp\u003eFor the past three years, I’ve served as the co-chair of professional development for EPYAA, a community club focused on supporting students in natural sciences like math, physics, and computer science. Along the way, I’ve gained experience in both industry and academia, interning at companies like Warner Bros. Discovery and USLI while also conducting research at the University of Pennsylvania. Currently, I’m continuing my research at Stanford University.\u003c/p\u003e\u003cp\u003eBeyond my academic and professional experiences, I’ve also published a paper on how information design structures can reduce bribery in game theory. But more than anything, I love mentoring and tutoring—because that’s how I got here, and I believe in paying it forward.\u003c/p\u003e\u003cp\u003eI’m also someone who finds joy in problem-solving, whether it’s in research, work, or everyday life. I love seeing people take on challenges, break them down, and find creative solutions. That mindset has shaped how I approach my own journey—whether in academics, mentoring, or my personal growth.\u003c/p\u003e\u003cp\u003eAt my core, I believe in the power of education, persistence, and community. I wouldn’t be where I am without the people who guided me along the way, and I hope to keep doing the same for others.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"vIX029hXABWsTTsaVvn5IQSwCMcoJgyVdrJs600vys5vI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Predoctoral Fellow","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b31bc66c-c6fb-42d9-9578-58c28d44621e\"}"},{"__ref":"DeepDives:{\"uuid\":\"3617b5f5-2aea-4d02-8be0-9526d9e43ab0\"}"},{"__ref":"DeepDives:{\"uuid\":\"bb9ec521-e0c0-4e24-9cc0-045c364d4f4c\"}"},{"__ref":"DeepDives:{\"uuid\":\"737300b2-8a45-4271-8bcd-cad7b5062622\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c53035c7-20bf-4dbc-810a-27bfe56de4eb/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e1a2b12b-4305-4784-86cd-9ca2ec4ccf0c\"}"},{"__ref":"Education:{\"uuid\":\"b85aa807-494f-4656-b7ca-e7439d815306\"}"}],"hiredAt":"2025-03-27T09:38:06.196Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Biology","Physics","6-8 Grade Science","Academic Coaching","Economics","Computer Science","Executive Function"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kidanewold-demesie\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"903061b7-21ac-4120-8187-69be0589621b\"}"}}},"_sentryTraceData":"b4eb22be0fa0404283efdd3feb0e43db-886decf7b2870c36-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b4eb22be0fa0404283efdd3feb0e43db,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"kidanewold-demesie"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height=
