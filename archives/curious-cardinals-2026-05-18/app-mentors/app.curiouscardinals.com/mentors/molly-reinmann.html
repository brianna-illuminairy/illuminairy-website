xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3117b147-aaeb-4c96-b5d3-821a8dc9e74b\"}":{"__typename":"Favorites","uuid":"3117b147-aaeb-4c96-b5d3-821a8dc9e74b","photoUrl":"https://ucarecdn.com/acdbf726-4d19-47e7-89ba-eee3cd361d30/","title":"A Visit From the Goon Squad","type":"BOOK"},"Favorites:{\"uuid\":\"2ec5ba59-e8ea-4acc-a08f-fc70250ac096\"}":{"__typename":"Favorites","uuid":"2ec5ba59-e8ea-4acc-a08f-fc70250ac096","photoUrl":"https://ucarecdn.com/acdbf726-4d19-47e7-89ba-eee3cd361d30/","title":"The Truman Show","type":"MOVIE"},"Favorites:{\"uuid\":\"24493076-44db-465d-8477-aeedec408da7\"}":{"__typename":"Favorites","uuid":"24493076-44db-465d-8477-aeedec408da7","photoUrl":"https://ucarecdn.com/acdbf726-4d19-47e7-89ba-eee3cd361d30/","title":"Nothing New by Taylor Swift + Phoebe Bridgers","type":"SONG"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"cf97c6f9-04cf-4273-ab54-8fb2e534d975\"}":{"__typename":"DeepDives","uuid":"cf97c6f9-04cf-4273-ab54-8fb2e534d975","content":"\u003cp\u003eMentoring has been a part of my life since I was three years and ten months old --- when my younger brother Zack was born. From a young age, he has had astounding academic passion and fascinating interests, and it has been a privilege to be his role model throughout our lives. Much of my time growing up was spent helping him with his math homework, or revising his creative writing, or talking to him about his newest idea for a video game. On car rides to school, we would often speak exclusively in Spanish to hone both of our language skills. Being Zack's academic mentor has defined much of my life.\u003cbr\u003e\u003cbr\u003eBut as much as I have mentored Zack, I have also learned from him. I have learned how rewarding it is to teach. I've learned the intricacies of how another mind works. I've learned about niches I didn't even know existed --- from the International Phonetic Alphabet to the history of different voting methods. \u003cbr\u003e\u003cbr\u003eI am choosing to spend my time mentoring because I know the formative impact mentorship can have, and I want to do everything I can to make that impact on as many students as possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f533e063-3bb1-4b1f-860d-16459cc3dc69\"}":{"__typename":"DeepDives","uuid":"f533e063-3bb1-4b1f-860d-16459cc3dc69","content":"\u003cp\u003eDream big! As a young student, I often found myself scaling back my goals to fit what I thought was feasible or reasonable. I thought that certain goals --- like getting my writing published or getting involved in politics --- were too unattainable for a young girl. But in retrospect, I wish I would have given myself more credit. I am extremely content with everything I've accomplished, but part of me always wonders what might have happened had I submitted that article to the writing contest or sent that email to my congressman.\u003cbr\u003e\u003cbr\u003e \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"186fe3a2-5c94-43bc-a5fb-b4137a7cd782\"}":{"__typename":"School","uuid":"186fe3a2-5c94-43bc-a5fb-b4137a7cd782","name":"Hackley School","city":"Tarrytown","type":"HIGH","state":"New York","country":"United States","zip":"10591"},"Education:{\"uuid\":\"2ceefe95-37bf-429a-8535-6381cd52d1c7\"}":{"__typename":"Education","uuid":"2ceefe95-37bf-429a-8535-6381cd52d1c7","school":{"__ref":"School:{\"uuid\":\"186fe3a2-5c94-43bc-a5fb-b4137a7cd782\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"67b50b0c-2af2-4527-9ad3-9a7ee95a3544\"}":{"__typename":"Education","uuid":"67b50b0c-2af2-4527-9ad3-9a7ee95a3544","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"American Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"bc87ab5b-8b50-494f-a755-551bd5de347f\"}":{"__typename":"MentorPublicProfile","uuid":"bc87ab5b-8b50-494f-a755-551bd5de347f","displayName":"Molly R.","slug":"molly-reinmann","biography":"\u003cp\u003eHi everyone! I'm Molly, a sophomore at Yale majoring in American Studies with a certificate in Education Studies. My academic, extracurricular, and leisurely involvements are all driven by my passion for storytelling.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy main extracurricular involvement at Yale is with the Yale Daily News, the country’s oldest college daily! I cover admissions, alumni and financial aid for the YDN — a fascinating beat, for which I meet regularly with Yale’s dean of admissions. I’ve also worked on long-form investigations at the News, and I run our TikTok account. Off-campus in New Haven, I am a mentor for the East Rock Record, a student newspaper based at the East Rock Community \u0026amp; Cultural Studies Magnet School. Beginning in middle school, I worked on a years-long project with the Holocaust and Human Rights Education Center of New York, collecting oral histories from Holocaust survivors in my area. I’ve also performed in and directed musicals for over a decade.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy in-class work at Yale and in high school has also approached the task of telling stories from myriad angles. Among others, I’ve taken a writing class on celebrity profiling, a seminar on early childhood literature, and a course on podcasting and longform narratives. In high school, I led a year-long research project investigating my school’s archives, the culmination of which was a published profile on my school’s first Black graduate.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eWhen I say that my leisurely involvements are driven by a love of storytelling, I mean that I spend most of my free time doing two things: reading and listening to Taylor Swift (our generation’s best storyteller). When I am not doing one of those things, you can find me on an outdoor walk, watching sit-coms with my family, or hanging out with my cat.\u003c/p\u003e","teachingVideoPlaybackId":"fo1TkxiW2kM5Q8d1C73dhyyHu9xi01zcKvjHjZeqzzv8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3117b147-aaeb-4c96-b5d3-821a8dc9e74b\"}"},{"__ref":"Favorites:{\"uuid\":\"2ec5ba59-e8ea-4acc-a08f-fc70250ac096\"}"},{"__ref":"Favorites:{\"uuid\":\"24493076-44db-465d-8477-aeedec408da7\"}"}],"causesSupported":[],"major":"American Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cf97c6f9-04cf-4273-ab54-8fb2e534d975\"}"},{"__ref":"DeepDives:{\"uuid\":\"f533e063-3bb1-4b1f-860d-16459cc3dc69\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c0ac9628-1a18-4855-a32c-8f88a3afbf85/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2ceefe95-37bf-429a-8535-6381cd52d1c7\"}"},{"__ref":"Education:{\"uuid\":\"67b50b0c-2af2-4527-9ad3-9a7ee95a3544\"}"}],"hiredAt":"2023-11-08T13:15:15.343Z","topics":["History Project","Literature","Women \
