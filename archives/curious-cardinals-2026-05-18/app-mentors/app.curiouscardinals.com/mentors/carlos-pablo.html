xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b5e5d0df-2fc3-48af-b11d-67e0f7b3a710\"}":{"__typename":"Favorites","uuid":"b5e5d0df-2fc3-48af-b11d-67e0f7b3a710","photoUrl":"https://ucarecdn.com/4f26524a-5487-486a-a7e0-39ea3a4e12fb/","title":"Before The Flood (Live) - Bob Dylan and The Band","type":"ALBUM"},"Favorites:{\"uuid\":\"3ec35a8b-9274-4869-8e50-bc70884f628f\"}":{"__typename":"Favorites","uuid":"3ec35a8b-9274-4869-8e50-bc70884f628f","photoUrl":"https://ucarecdn.com/d33e2945-ca58-4f50-a699-963fb91129f5/","title":"Lionel Messi","type":"ATHLETE"},"Favorites:{\"uuid\":\"7e07ef61-4b1f-4c66-9c88-ab93c4f77fae\"}":{"__typename":"Favorites","uuid":"7e07ef61-4b1f-4c66-9c88-ab93c4f77fae","photoUrl":"https://ucarecdn.com/29e8f463-8fb8-4af8-bb94-1606b4a8860e/","title":"Prague, Czech Republic","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a40d37a4-71ef-4bff-9809-6432a1e5139b\"}":{"__typename":"DeepDives","uuid":"a40d37a4-71ef-4bff-9809-6432a1e5139b","content":"\u003cp\u003eI would tell 14-year-old Carlos to focus on his 2 main passions (finance and music) and build on that theme to make the best possible college admissions profile. This is exactly what I did to get into every school I applied to, but I would have told myself to start earlier and believe in myself. I would have also told myself to figure out how I learn best at an earlier age. I am a visual and tactile learner at heart, and I didn't truly discover that until junior year of high school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3ca180bb-c0ea-4d30-ab64-5c0db0357d8c\"}":{"__typename":"DeepDives","uuid":"3ca180bb-c0ea-4d30-ab64-5c0db0357d8c","content":"\u003cp\u003eI believe the most important resource you can have in the professional world is an advocate. The pre-college version of this is a mentor - someone who tells you where your assumptions are wrong and who brings you to the next level. Being around people who know more than me helped me get into college and obtain top internships. However, I also value having mentees. This interest started in high school through the Junior Economic Club of Chicago, and now continues in college. Nothing is more exciting than seeing a mentee achieve things you couldn't when you were their age!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1fa68240-ada4-475e-8284-f8b2867c807e\"}":{"__typename":"DeepDives","uuid":"1fa68240-ada4-475e-8284-f8b2867c807e","content":"\u003cp\u003eWhile I've been interested in economics, I chose Economics-Philosophy at Columbia to ensure I leave college knowing how to think, not what to think. I will have plenty of time to learn more tangible skills  through internships and clubs, but in college, I have a once-in-a-lifetime opportunity to take courses in philosophy that elevate my mental frameworks and understanding. Also, reading ancient and pre-20th century works of philosophy helps contextualize how the world got to where it is today, which has allowed me to approach modern problems with a broader perspective. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"ed815bee-f701-4512-9cda-21174e07f58b\"}":{"__typename":"DeepDives","uuid":"ed815bee-f701-4512-9cda-21174e07f58b","content":"\u003cp\u003eI am extremely proud of the student I have become. At the start of high school, I didn't study and wasn't motivated to go to a top school. However, after being exposed to top institutions after touring colleges with my sister, I realized I wanted the access to professors and resources that top schools give you, which motivated me to focus more on school. When I started trying harder, I became more interested in the content and curious about where it led. This created a snowball effect that deepened a love for learning I previously didn't know I had (which now makes sense, as I come from a family of professors). I want to pass this passion for learning and problem-solving onto students approaching the college admissions process, especially.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"63ab2d32-6ad5-484f-ae9a-9251fbc82189\"}":{"__typename":"School","uuid":"63ab2d32-6ad5-484f-ae9a-9251fbc82189","name":"Whitney M. Young Magnet High School","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60607"},"Education:{\"uuid\":\"281bc595-579f-4c20-8249-99141f2350f5\"}":{"__typename":"Education","uuid":"281bc595-579f-4c20-8249-99141f2350f5","school":{"__ref":"School:{\"uuid\":\"63ab2d32-6ad5-484f-ae9a-9251fbc82189\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"0172d27d-5ee2-4615-9f50-b80611326d9f\"}":{"__typename":"Education","uuid":"0172d27d-5ee2-4615-9f50-b80611326d9f","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics-Philosophy","degree":null},"MentorPublicProfile:{\"uuid\":\"5274e7b0-f5ab-45ab-a400-bbd5d5a16d8d\"}":{"__typename":"MentorPublicProfile","uuid":"5274e7b0-f5ab-45ab-a400-bbd5d5a16d8d","displayName":"Carlos M.","slug":"carlos-pablo","biography":"\u003cp\u003eCarlos Murillo was born and raised in Chicago, IL, to a family of professors, sparking a deep curiosity and love of learning at an early age. He grew up playing drums and exploring countless hobbies, eventually discovering an interest in finance and investing early in high school. Throughout his high school years, Carlos pursued extracurriculars across economics, event planning, investing, entrepreneurship, jazz drumming, DJing, and more. He held key roles in the Junior Economic Club of Chicago and BPA/FBLA chapters at his high school. Carlos also served as president and co-founder of his high school’s investment club for three years. In class, Carlos especially enjoyed history, math, literature, and business classes. During the college admissions process, Carlos was admitted to 12 of the 13 schools he applied to and received multiple merit scholarships at top universities. He decided to attend Columbia to continue pursuing his curiosity through the core curriculum, while also being in the best finance and music city in the country. Before coming to college, Carlos spent his summer as a day camp counselor and attended many concerts and music festivals.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, Carlos is an Economics-Philosophy major and a Music minor. He has taken relevant courses such as Calculus 3, Intermediate Macro and Microeconomics, Calculus-Based Statistics, Literature Humanities, Contemporary Civilization, and more. As for extracurriculars, Carlos is the Alumni Coordinator and Business Director for Columbia Economics Society, the Senior Workshop Director for Columbia’s Global Equity Management chapter, VP of Education for BlackGen Capital, Instructor for Columbia DJ Collective, and a member of the Lions Sports Society. Carlos has also completed or received internships across Private Equity, Endowment Investment Management, Global Markets, and Investment Banking, and he mentors younger students to land similar internships. Carlos is also a member of Columbia’s Louis Armstrong Jazz Performance Program, participating in weekly lessons and ensemble rehearsals. He has also played drums for multiple bands, even recording an album during his freshman year. Outside of academics, extracurriculars, and internships, Carlos enjoys Formula 1, jazz, drumming, gaming, skiing, camping, exploring NYC, seeing movies, travelling, DJing, and watching Nottingham Forest games. Carlos looks forward to elevating your student to the next level!\u003c/p\u003e","teachingVideoPlaybackId":"DKGn5OPwbtNEupLuxJuxMMei5lYHXtXk01IPBnJXZ2pQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b5e5d0df-2fc3-48af-b11d-67e0f7b3a710\"}"},{"__ref":"Favorites:{\"uuid\":\"3ec35a8b-9274-4869-8e50-bc70884f628f\"}"},{"__ref":"Favorites:{\"uuid\":\"7e07ef61-4b1f-4c66-9c88-ab93c4f77fae\"}"}],"causesSupported":[],"major":"Economics-Philosophy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a40d37a4-71ef-4bff-9809-6432a1e5139b\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ca180bb-c0ea-4d30-ab64-5c0db0357d8c\"}"},{"__ref":"DeepDives:{\"uuid\":\"1fa68240-ada4-475e-8284-f8b2867c807e\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed815bee-f701-4512-9cda-21174e07f58b\"}"}],"active":true,
