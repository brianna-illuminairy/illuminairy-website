xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cf7b3944-e8e4-492c-9687-74023df140ef\"}":{"__typename":"Favorites","uuid":"cf7b3944-e8e4-492c-9687-74023df140ef","photoUrl":"https://ucarecdn.com/6928c7f0-57cc-4aa3-bacf-72772b1e69e6/","title":"Lionel Messi","type":"ATHLETE"},"Favorites:{\"uuid\":\"1b329ace-1e75-4406-9e17-24706c1803c4\"}":{"__typename":"Favorites","uuid":"1b329ace-1e75-4406-9e17-24706c1803c4","photoUrl":"https://ucarecdn.com/d0eeed6c-7f20-474d-8f6a-c8ff7acfc491/","title":"Mrs. Doubtfire","type":"MOVIE"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"003b426b-10cc-4743-ac97-b399edddac46\"}":{"__typename":"DeepDives","uuid":"003b426b-10cc-4743-ac97-b399edddac46","content":"\u003cp\u003eBecause I genuinely enjoy getting to know people and helping them grow. Mentorship allows me to build meaningful one-on-one relationships, understand what motivates each student, and support them in a way that’s personal and impactful. Seeing someone gain confidence, clarity, or pride in their progress is incredibly rewarding to me, and that’s what makes mentorship worth my time and energy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"a98cc08a-aa3c-4c20-ac9a-9044726dc35b\"}":{"__typename":"DeepDives","uuid":"a98cc08a-aa3c-4c20-ac9a-9044726dc35b","content":"\u003cp\u003eI started high school very introverted, especially as a new student who didn’t know many people. Over time, I pushed myself to get involved and discovered passions in leadership, service, and academics that helped me grow more confident and connected. Finding those interests changed my high school experience, and now I want to help other students discover what excites them and feel confident doing the same.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5599e25d-ed06-4181-9a4e-8c72e15a07f3\"}":{"__typename":"DeepDives","uuid":"5599e25d-ed06-4181-9a4e-8c72e15a07f3","content":"\u003cp\u003eI would tell my younger self to stop comparing my path to everyone else’s. Growth looks different for each person, and focusing on being the best version of \u003cem\u003eyourself\u003c/em\u003e matters far more than keeping up with others. Once I learned to measure progress by my own improvement instead of comparison, I became more confident, motivated, and open to discovering what I genuinely cared about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"17f53107-a6e2-46af-a547-30a02c4837cb\"}":{"__typename":"DeepDives","uuid":"17f53107-a6e2-46af-a547-30a02c4837cb","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is achieving financial independence early so I can dedicate the majority of my time to volunteering and giving back. Being able to focus fully on helping others and supporting my community would be incredibly meaningful to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"331047f2-38bd-4bec-98ad-97df4057d7e9\"}":{"__typename":"School","uuid":"331047f2-38bd-4bec-98ad-97df4057d7e9","name":"North Haven High School","city":"North Haven","type":"HIGH","state":"Connecticut","country":"United States","zip":"06473"},"Education:{\"uuid\":\"09985afc-81b2-4ad4-b7a8-d0d23921d4ae\"}":{"__typename":"Education","uuid":"09985afc-81b2-4ad4-b7a8-d0d23921d4ae","school":{"__ref":"School:{\"uuid\":\"331047f2-38bd-4bec-98ad-97df4057d7e9\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"9826fde7-15d2-4a08-8dd3-a92bc028f2d2\"}":{"__typename":"Education","uuid":"9826fde7-15d2-4a08-8dd3-a92bc028f2d2","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Electrical Engineering and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"b9d12f21-b104-47d2-bc19-1e9571eff2f9\"}":{"__typename":"MentorPublicProfile","uuid":"b9d12f21-b104-47d2-bc19-1e9571eff2f9","displayName":"Dami K.","slug":"dami-konigbagbe","biography":"\u003cp\u003eHi! I’m Dami, a Yale University Electrical Engineering student who enjoys helping students build confidence through learning, leadership, and curiosity. I recently graduated from North Haven High School, where I was deeply involved in academics, community service, and student leadership. Through these experiences, I learned that students thrive most when they feel supported, encouraged, and genuinely understood.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI enjoy working with students who are curious, motivated, or simply looking to gain confidence in math and problem-solving. My goal is to help students feel comfortable asking questions, making mistakes, and growing at their own pace.\u003c/p\u003e\u003chr\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eThroughout high school, I balanced leadership roles with academic involvement and service. I served as \u003cstrong\u003eClass President\u003c/strong\u003e, where I organized major class events, worked closely with faculty and administrators, and led multiple fundraising initiatives that raised over \u003cstrong\u003e$10,000\u003c/strong\u003e. One of my proudest accomplishments was founding a scholarship fund to support future graduating classes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside leadership, I volunteered consistently, including working directly with younger students in structured, supervised environments. These experiences taught me patience, clear communication, and the importance of creating a safe, supportive space for kids to learn and grow. I was also a member of the \u003cstrong\u003eMath Team\u003c/strong\u003e, where I developed strong problem-solving skills and learned how to break down challenging concepts step by step.\u003c/p\u003e\u003chr\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI enjoy supporting students through:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMath tutoring and enrichment\u003c/strong\u003e, with a focus on confidence and understanding\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSTEM exploration\u003c/strong\u003e, helping students learn through hands-on thinking and real examples\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLeadership development\u003c/strong\u003e, including student government, service projects, and initiative-building\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOrganization and study skills\u003c/strong\u003e, so students feel prepared and less overwhelmed\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003chr\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eWhat sessions with me look like\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eMy sessions are structured but flexible. We start by identifying goals, then work through material at a pace that feels comfortable. I focus on asking guiding questions, using clear explanations, and helping students connect ideas rather than memorize steps. I also check in often to make sure students feel confident and supported.\u003c/p\u003e\u003chr\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eWhy families work with me\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eAs someone who has worked closely with children and taken on significant leadership responsibilities, I understand the importance of trust, reliability, and communication. I aim to be a mentor students feel comfortable with and parents can rely on.\u003c/p\u003e\u003chr\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eOutside of academics\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eIn my free time, I enjoy volunteering, staying active on campus, and exploring new ideas. I love helping students discover their strengths and grow in confidence.\u003c/p\u003e","teachingVideoPlaybackId":"JZlPzI3QCQ388y4mSqS2KSwE7eC3ArvvLquqaUtZCEM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"cf7b3944-e8e4-492c-9687-74023df140ef\"}"},{"__ref":"Favorites:{\"uuid\":\"1b329ace-1e75-4406-9e17-24706c1803c4\"}"}],"causesSupported":[],"major":"Electrical Engineering and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"003b426b-10cc-4743-ac97-b399edddac46\"}"},{"__ref":"DeepDives:{\"uuid\":\"a98cc08a-aa3c-4c20-ac9a-9044726dc35b\"}"},{"__ref":"DeepDives:{\"uuid\":\"5599e25d-ed06-4181-9a4e-8c72e15a07f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"17f53107-a6e2-46af-a547-30a02c4837cb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e50001d7-e2de-408b-8653-9e610a529d48/-/preview/-/format/jpg/","https://ucarecdn.com/cb11aab1-d4ce-4703-8711-630e7266c840/-/preview/-/format/jpg/","https://ucarecdn.com/8cf02668-4204-4a30-8c18-b92a2645b585/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"09985afc-81b2-4ad4-b7a8-d0d23921d4ae\"}"},{"__ref":"Education:{\"uuid\":\"9826fde7-15d2-4a08-8dd3-a92bc028f2d2\"}"}],"hiredAt":"2026-01-07T16:13:47.200Z","topics":["Calculus","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","Physics","Academic Coaching","Executive Function","College Essay Writing"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"dami-konigbagbe\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b9d12f21-b104-47d2-bc19-1e9571eff2f9\"}"}}},"_sentryTraceData":"16c45f05609548babd55c288e370f503-98dd66b1ae0891e5-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=16c45f05609548babd55c288e370f503,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"dami-konigbagbe"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\
