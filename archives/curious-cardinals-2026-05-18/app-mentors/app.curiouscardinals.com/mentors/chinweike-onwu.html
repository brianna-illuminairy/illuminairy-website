ents. They have taught me the power of resilience and that life is truly what you make of it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"46e30276-537d-4a94-9f87-95121d187a65\"}":{"__typename":"DeepDives","uuid":"46e30276-537d-4a94-9f87-95121d187a65","content":"\u003cp\u003eGo for it! It’s absolutely natural to be nervous when stepping out of your comfort zone, but every experience is an opportunity for learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b0089b0a-945d-48b2-86a6-9a99b5edefd0\"}":{"__typename":"DeepDives","uuid":"b0089b0a-945d-48b2-86a6-9a99b5edefd0","content":"\u003cp\u003eI’ve recently been getting back into playing classical piano! There’s nothing like a soothing piano session to decompress after a long day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"517f5ceb-5716-4dd3-9e1d-2e9f3306f9a4\"}":{"__typename":"School","uuid":"517f5ceb-5716-4dd3-9e1d-2e9f3306f9a4","name":"Eton College","city":"Windsor","type":"HIGH","state":"England","country":"United Kingdom","zip":"SL4 6DW"},"Education:{\"uuid\":\"1ecdbaa6-357e-42e9-866e-200a3d7e47a1\"}":{"__typename":"Education","uuid":"1ecdbaa6-357e-42e9-866e-200a3d7e47a1","school":{"__ref":"School:{\"uuid\":\"517f5ceb-5716-4dd3-9e1d-2e9f3306f9a4\"}"},"startYear":"2019","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}":{"__typename":"School","uuid":"843cb79b-75a7-4415-89cc-0166c307ba4b","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"CT","country":"USA","zip":"06511"},"Education:{\"uuid\":\"f44390ee-6d18-4be1-a52a-4d3788a6c81d\"}":{"__typename":"Education","uuid":"f44390ee-6d18-4be1-a52a-4d3788a6c81d","school":{"__ref":"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Physics and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"3a3720b8-2e69-4447-b4ba-33f9a20a7c9c\"}":{"__typename":"MentorPublicProfile","uuid":"3a3720b8-2e69-4447-b4ba-33f9a20a7c9c","displayName":"Chin O.","slug":"chinweike-onwu","biography":"\u003cp\u003eHello! My name is Chin and I am a first-Year at Yale currently pursuing a degree in Physics and Economics. I consider myself a child of the world! Whilst originally hailing from Lagos, Nigeria, I have gone to school in the UK, France, and now the United States.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m all about exploring new things, often being called a jack of all trades. I’ve tried my hand at anything that strikes me as unique or interesting, all in the name of learning! I absolutely believe that our experiences are integral to who we become and it is incredibly important that we share those experiences with those around us.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA foundational belief of mine is in the strength of collaboration. At school, I am an avid participant in the theatre scene, having acted in numerous productions, as well as working on them behind the scenes. At Eton College, I directed the first all black play in the school’s nearly 600 year history. Such a milestone would not have been possible if not for the individual identities and contributions every person brought to the project. In collaborating and sharing experiences, the arts provide enrichment for all, helping people learn more about themselves and others whilst also developing into their best selves. Alongside my love for storytelling, sports have always been a big part of my life, so much so that friends have jokingly compared me to ‘Troy Bolton’. Whilst I’m currently a member of the Yale Men’s Rugby Team, you wouldn’t have been surprised to catch me on the track, the soccer pitch or playing water polo back at Eton.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of sports and the arts, I’ve also pursued independent astrophysics research. In my deep curiosity about the limitless possibilities of the universe, I have written research papers concerning the feasibility of wormholes, the search for dark matter, and even built an AI model that predicted the nature of exoplanets.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics and extracurriculars, I am a passionate film enthusiast. I love the variety in which stories can be told and you’ll always find me updating my Letterboxd (a film review application) after I watch a good movie. I believe my unique blend of academic work, athletics, and creative pursuits, combined with a focus on meaningful relationships, make me a great mentor to others!\u003c/p\u003e","teachingVideoPlaybackId":"RvbVks0074ixcZh1wCYvwAbjBwemUQYw2sR74m902Gr1U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b2640ec8-9e59-4a1a-bd23-42f943358a6e\"}"},{"__ref":"Favorites:{\"uuid\":\"8e53d513-f2f3-421f-a8a2-55440d5b42c4\"}"},{"__ref":"Favorites:{\"uuid\":\"5e072b07-3c91-4d74-90b9-126193b6f97f\"}"}],"causesSupported":[],"major":"Physics and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5dc521a9-07f9-4364-a85d-57c559133a3b\"}"},{"__ref":"DeepDives:{\"uuid\":\"18f246a5-b5ee-450c-bae0-fb68028655fc\"}"},{"__ref":"DeepDives:{\"uuid\":\"46e30276-537d-4a94-9f87-95121d187a65\"}"},{"__ref":"DeepDives:{\"uuid\":\"b0089b0a-945d-48b2-86a6-9a99b5edefd0\"}"}],"active":true
