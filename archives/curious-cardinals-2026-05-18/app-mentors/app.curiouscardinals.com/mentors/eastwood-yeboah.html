xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9ae49cf6-282d-4f79-81ca-ae62df61f15d\"}":{"__typename":"Favorites","uuid":"9ae49cf6-282d-4f79-81ca-ae62df61f15d","photoUrl":"https://ucarecdn.com/442cf4f9-387a-45aa-a9c4-8cf207d202d9/","title":"Athens","type":"CITY"},"Favorites:{\"uuid\":\"8509e2f6-f8f6-412c-ba6b-831e505555f7\"}":{"__typename":"Favorites","uuid":"8509e2f6-f8f6-412c-ba6b-831e505555f7","photoUrl":"https://ucarecdn.com/a514fd3d-6cb6-4579-ae70-d58f0a2403bc/","title":"Dreams - Fleetwood Mac","type":"SONG"},"Favorites:{\"uuid\":\"51255d33-9a57-4a03-a255-0bf1a3370921\"}":{"__typename":"Favorites","uuid":"51255d33-9a57-4a03-a255-0bf1a3370921","photoUrl":"https://ucarecdn.com/0eb45e2b-f3f2-40e3-9da3-d28ce43793f8/","title":"Florence Griffith-Joyner \"Flo-Jo\"","type":"ATHLETE"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1cbb670d-e5e1-4613-9c94-7012e3eeba04\"}":{"__typename":"DeepDives","uuid":"1cbb670d-e5e1-4613-9c94-7012e3eeba04","content":"\u003cp\u003eWhen I first started thinking about college, I didn’t realize just how common mental health challenges are in marginalized communities. I saw how limited access to resources and the stigma around mental health often keep people from getting the support they need. Over time, I realized that talking openly about mental health and making help more accessible should be a priority for everyone. That’s what led me to major in Psychology and Africana Studies—I want to become a mental health counselor and support communities that are often overlooked, helping people feel heard, understood, and empowered.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"7672cf67-f373-48f3-83cc-1668c2fb6fbb\"}":{"__typename":"DeepDives","uuid":"7672cf67-f373-48f3-83cc-1668c2fb6fbb","content":"\u003cp\u003eEver since I started learning about mental health disparities around the world, I’ve imagined a career where I could make a real impact. I picture myself as a Mental Health Technical Officer at the World Health Organization, working directly to bring accessible, culturally sensitive mental health support to communities that need it most. For me, it’s not just a job: it’s a chance to listen, learn, and create solutions that help people feel understood and supported, no matter where they live.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"e9c7d7f0-67fa-4f82-b151-87588502f98f\"}":{"__typename":"DeepDives","uuid":"e9c7d7f0-67fa-4f82-b151-87588502f98f","content":"\u003cp\u003eAs the son of Ghanaian immigrants, my heritage has given me a deep appreciation for diverse perspectives and experiences. I strive to create a space where students not only feel seen, but also comfortable sharing their thoughts without judgment, and where curiosity and questions are always welcomed!\u003cbr\u003e\u003cbr\u003eI want students to leave our time together with the knowledge, skills, and self-assurance to continue growing long after the classroom or mentorship ends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"57205078-71f1-4ccc-81a6-9e1fbec28efa\"}":{"__typename":"DeepDives","uuid":"57205078-71f1-4ccc-81a6-9e1fbec28efa","content":"\u003cp\u003eMy greatest role model is my mother. Growing up, I watched her balance hard work, compassion, and resilience. Whether supporting our family, pursuing her goals, or helping others, she showed me the importance of empathy by leading by example.\u003cbr\u003e\u003cbr\u003eMy mother showed me that real strength comes from kindness and dedication to others around you. Her guidance and values continue to inspire how I approach challenges, support my peers, and think about the impact I want to have in my own life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"134d35a3-800c-4677-a592-4f4cb1f1bb6c\"}":{"__typename":"School","uuid":"134d35a3-800c-4677-a592-4f4cb1f1bb6c","name":"Clarksburg High School","city":"Clarksburg","type":"HIGH","state":"Maryland","country":"United States","zip":"20871"},"Education:{\"uuid\":\"3e53b3b7-90fd-4178-beb3-4531069cd709\"}":{"__typename":"Education","uuid":"3e53b3b7-90fd-4178-beb3-4531069cd709","school":{"__ref":"School:{\"uuid\":\"134d35a3-800c-4677-a592-4f4cb1f1bb6c\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ac4bffe8-c959-4aa8-806b-c64d8c13eb33\"}":{"__typename":"School","uuid":"ac4bffe8-c959-4aa8-806b-c64d8c13eb33","name":"Union College","city":"Schenectady","type":"COLLEGE","state":"New York","country":"United States","zip":"12308"},"Education:{\"uuid\":\"5fac91ab-da62-4145-833d-f7482664fdc3\"}":{"__typename":"Education","uuid":"5fac91ab-da62-4145-833d-f7482664fdc3","school":{"__ref":"School:{\"uuid\":\"ac4bffe8-c959-4aa8-806b-c64d8c13eb33\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology; Africana Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"68de1995-d876-44ee-a3b6-26334d8529da\"}":{"__typename":"MentorPublicProfile","uuid":"68de1995-d876-44ee-a3b6-26334d8529da","displayName":"Eastwood Y.","slug":"eastwood-yeboah","biography":"\u003cp\u003eEastwood is a current Master's student at National Taiwan University, pursuing a degree in Global Health. He studies how culture, community, and policy shape mental health and well-being worldwide. Originally from Montgomery County, Maryland, he previously attended Union College in New York, where he graduated summa cum laude with a double major in Africana Studies and Psychology and a minor in Global Mental Health Parity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEastwood is passionate about helping young people and also improving access to mental health resources. He’s worked with youth through groups like the Boys \u0026amp; Girls Club and City Youth Now, and researched mental health equity in the US, Southeast Asia, and the South Pacific through the Obama-Chesky Voyager Scholarship for Public Service. Across his work in youth programming, research, and public service, Eastwood is driven by a clear idea: young people everywhere deserve safe, supportive spaces where they can grow, ask questions, and imagine their futures with confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHe enjoys mentoring students who are curious and eager to explore their interests. He takes a patient and encouraging approach, helping students feel supported while inspiring them to take charge of their learning and growth. He values helping students find their academic passions and link their interests to meaningful projects or future careers, especially in psychology, global health, leadership, and public service. Eastwood also helps students to develop effective organization and habit-building strategies that make school both manageable and exciting, from finding effective study methods to planning tasks and finishing projects efficiently, so students stay organized and achieve more without burnout.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, Eastwood enjoys photography, exploring the arts, discovering new music, and trying new foods wherever he travels. Having lived and studied in ten countries, he loves learning about new cultures and perspectives. He’s inspired by the ancient Greek idea “Know thyself” (Gnothi seauton), which means self-understanding is key to a meaningful life. Eastwood encourages students and families to explore widely, think about what excites them, and build the confidence to follow paths that truly fit who they are. If you’re passionate about the world and ready to make a difference, don’t hesitate to reach out! \u003c/p\u003e","teachingVideoPlaybackId":"007hrQTYz4bjHDJRfoJ7rf00VALD3xAVYViMKyZskncnE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9ae49cf6-282d-4f79-81ca-ae62df61f15d\"}"},{"__ref":"Favorites:{\"uuid\":\"8509e2f6-f8f6-412c-ba6b-831e505555f7\"}"},{"__ref":"Favorites:{\"uuid\":\"51255d33-9a57-4a03-a255-0bf1a3370921\"}"}],"causesSupported":[],"major":"Psychology; Africana Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1cbb670d-e5e1-4613-9c94-7012e3eeba04\"}"},{"__ref":"DeepDives:{\"uuid\":\"7672cf67-f373-48f3-83cc-1668c2fb6fbb\"}"},{"__ref":"DeepDives:{\"uuid\":\"e9c7d7f0-67fa-4f82-b151-87588502f98f\"}"},{"__ref":"DeepDives:{\"uuid\":\"57205078-71f1-4ccc-81a6-9e1fbec28efa\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/451beaad-b8fd-44bc-9bd3-7cd06cdad589/-/preview/-/format/jpg/","https://ucarecdn.com/af6f93cb-6c3a-419f-a43d-862d61546371/-/preview/-/format/jpg/","https://ucarecdn.com/99c7777c-6270-438c-bb65-3ff391420635/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"3e53b3b7-90fd-4178-beb3-4531069cd709\"}"},{"__ref":"Education:{\"uuid\":\"5fac91ab-da62-4145-833d-f7482664fdc3\"}"}],"hiredAt":"2026-03-09T14:26:52.701Z","topics":["K-5 Grade Math","Pre-Algebra","Statistics","6-8 Grade Science","Biology","Writing","Academic Coaching","College Essay Writing","History","Reading","Creative Writing","History Project","Video / Photography","Medicine / Health","STEM Project","Web Design","Law / Government / Policy","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"eastwood-yeboah\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"68de1995-d876-44ee-a3b6-26334d8529da\"}"}}},"_sentryTraceData":"b48235ddde3f4214a76b0f49793ffe6a-8498c1a6fdefd153-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b48235ddde3f4214a76b0f49793ffe6a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"eastwood-yeboah"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
