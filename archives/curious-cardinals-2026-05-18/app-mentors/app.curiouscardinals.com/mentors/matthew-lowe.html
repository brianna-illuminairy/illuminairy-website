xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b21c2800-8a2d-48d7-9ee6-4f155487b2ec\"}":{"__typename":"Favorites","uuid":"b21c2800-8a2d-48d7-9ee6-4f155487b2ec","photoUrl":"https://ucarecdn.com/e5ab0eef-611a-4c7d-91fe-654a764ed914/","title":"Basketball and Baseball","type":"SPORT"},"Favorites:{\"uuid\":\"32efa981-666c-48fb-a66c-41f95cc413ca\"}":{"__typename":"Favorites","uuid":"32efa981-666c-48fb-a66c-41f95cc413ca","photoUrl":"https://ucarecdn.com/4cbef4d3-e28d-4842-bf57-7a445c98a616/","title":"Tokyo","type":"CITY"},"Favorites:{\"uuid\":\"66328fd4-8a36-42a6-8464-c521884c09c5\"}":{"__typename":"Favorites","uuid":"66328fd4-8a36-42a6-8464-c521884c09c5","photoUrl":"https://ucarecdn.com/cdb81726-e97c-45d2-9bb2-5fc9ed1c3d2b/","title":"Fifa and 2K","type":"GAME"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"6c19ab15-d864-43e8-ac2f-0e2e060a5db4\"}":{"__typename":"DeepDives","uuid":"6c19ab15-d864-43e8-ac2f-0e2e060a5db4","content":"\u003cp\u003eGrowing up in Thailand while also being an American citizen gave me a unique perspective on culture, education, and communication from a very early age. Moving between different environments taught me how to adapt, stay open-minded, and connect with people from many different backgrounds. When I came to the University of Pennsylvania for college as an international student, I quickly realized how valuable those experiences were in helping me build relationships with people from all over the world.\u003c/p\u003e\u003cp\u003eBecause of my background, I naturally approach teaching and mentorship with empathy, curiosity, and flexibility. I understand that every student has different experiences, learning styles, strengths, and challenges, and I believe those differences should be embraced rather than overlooked. I never want students to feel pressured to fit into one “type” of learner or student. Instead, I focus on understanding what motivates them individually and creating an environment where they feel comfortable asking questions, expressing themselves, and growing confidently.\u003c/p\u003e\u003cp\u003eAt Penn, I also served on the board for the Assembly of International Students, which further strengthened my appreciation for diverse perspectives and communities. Being part of such an international environment taught me how important it is to listen, communicate openly, and learn from people with experiences very different from my own. Those values carry directly into my mentoring style today.\u003c/p\u003e\u003cp\u003eAbove all, my identity has taught me to genuinely enjoy meeting and working with all kinds of people. I believe some of the best learning happens when students feel understood, respected, and encouraged to be themselves, and that is the kind of environment I always strive to create as a mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a01825d2-d15a-46fa-8dde-f3d088d25f62\"}":{"__typename":"DeepDives","uuid":"a01825d2-d15a-46fa-8dde-f3d088d25f62","content":"\u003cp\u003eIn my spare time, my three biggest hobbies are DJing, basketball, and cooking. I love activities that are creative, social, and energetic, and all three have become important parts of my life both inside and outside of school.\u003c/p\u003e\u003cp\u003eI first learned how to DJ early in college and quickly fell in love with it. Since then, I’ve DJed parties and events while also teaching many of my friends how to DJ themselves. It started as a hobby, but eventually turned into something I could do professionally on the side as well. I enjoy the creativity of reading a crowd, building energy, and creating memorable experiences through music. DJing has also taught me a lot about confidence, adaptability, and communication.\u003c/p\u003e\u003cp\u003eBasketball has been a huge part of my life since elementary school. I grew up playing competitively and still love playing pickup games whenever I can. I enjoy the competitiveness, teamwork, and fast-paced nature of the game. Basketball has taught me a lot about discipline, leadership, and staying calm under pressure, which are skills I carry into academics and mentorship as well.\u003c/p\u003e\u003cp\u003eI’ve also loved cooking since I was around 10 years old. Cooking became a creative outlet for me and something I genuinely enjoy sharing with others. One of my favorite things to do is cook for friends, especially authentic Thai food and Japanese food. Growing up in Thailand gave me a deep appreciation for food and culture, and cooking is one of the ways I stay connected to that part of my identity. I enjoy experimenting with recipes, learning new techniques, and bringing people together through food.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"7883b2be-948e-4a2e-a721-8a4adbaab35f\"}":{"__typename":"DeepDives","uuid":"7883b2be-948e-4a2e-a721-8a4adbaab35f","content":"\u003cp\u003eOne passion project I worked on with a group of friends was Jalan Journey, a startup focused on helping students develop social and emotional skills through interactive game worlds. We were interested in exploring how technology and game design could create a more engaging and supportive environment for students who may struggle with social situations, confidence, communication, or emotional expression.\u003c/p\u003e\u003cp\u003eAs a team, we designed game-based experiences where students could interact with characters, make decisions, and navigate realistic social scenarios in a way that felt approachable and low-pressure. We wanted learning these skills to feel more interactive and natural rather than something taught only through traditional lessons or worksheets.\u003c/p\u003e\u003cp\u003eWorking on Jalan Journey was an exciting experience because it combined many of my interests: technology, entrepreneurship, education, and social impact. It also taught me a lot about collaboration, problem-solving, and building ideas with a team. Most importantly, it reinforced my belief that technology can be used to create meaningful experiences that genuinely help people grow and feel more confident.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9e7b7e8c-5ef7-4c22-8eb1-1aa8e1eac8bf\"}":{"__typename":"DeepDives","uuid":"9e7b7e8c-5ef7-4c22-8eb1-1aa8e1eac8bf","content":"\u003cp\u003eI chose to study Artificial Intelligence at the University of Pennsylvania because I’ve always been interested in both technology and business, and Penn offered a unique environment where I could explore both. One of the biggest reasons I wanted to come to Penn was its combination of strong engineering programs alongside the business opportunities and entrepreneurial culture surrounding the university.\u003c/p\u003e\u003cp\u003eWhen I was deciding on a major, I felt that AI was going to become an important part of almost every industry, especially at the intersection of business and technology. Since I’m interested in areas like product development, startups, consulting, and innovation, studying AI felt like the most future-oriented and versatile path I could take. I also liked that Artificial Intelligence was a relatively new major at Penn because it made the field feel exciting, evolving, and interdisciplinary.\u003c/p\u003e\u003cp\u003eMore than anything, I wanted a major that would teach me how to think critically, solve complex problems, and understand how emerging technologies can create real impact. AI gave me the opportunity to build technical skills while also exploring how technology can shape industries, businesses, and people’s everyday lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"174b7b35-d407-4eea-90d2-9af803a9aca8\"}":{"__typename":"School","uuid":"174b7b35-d407-4eea-90d2-9af803a9aca8","name":"RIS - Ruamrudee International School Bangkok","city":"Bangkok","type":"HIGH","state":"NA","country":"Thailand","zip":"10510"},"Education:{\"uuid\":\"34834233-f3ec-4dd1-aa06-922636f27437\"}":{"__typename":"Education","uuid":"34834233-f3ec-4dd1-aa06-922636f27437","school":{"__ref":"School:{\"uuid\":\"174b7b35-d407-4eea-90d2-9af803a9aca8\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"179cc2e6-0126-4477-8c88-d19c14b6a337\"}":{"__typename":"Education","uuid":"179cc2e6-0126-4477-8c88-d19c14b6a337","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Artificial Intelligence","degree":null},"MentorPublicProfile:{\"uuid\":\"33b20f35-ef0a-4dd6-b6a3-f577cdc30c99\"}":{"__typename":"MentorPublicProfile","uuid":"33b20f35-ef0a-4dd6-b6a3-f577cdc30c99","displayName":"Matthew L.","slug":"matthew-lowe","biography":"\u003cp\u003eI am currently a student at the University of Pennsylvania studying Artificial Intelligence with a strong interest in the intersection of engineering, business, and entrepreneurship. Ever since high school, I have been passionate about using technology and innovation to solve meaningful real-world problems while helping others grow along the way.\u003c/p\u003e\u003cp\u003eOne of the experiences that most shaped me was inventing the “Boostwalker,” a mobility-assistance device inspired by my grandmother’s battle with cancer. Through this project, I saw firsthand how engineering can directly improve people’s lives. I also founded and led a chapter of GoBabyGo, a nonprofit initiative that modifies toy cars for children with mobility disabilities, helping them gain greater independence and mobility. These experiences taught me the importance of empathy, leadership, and designing with people in mind.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout high school, I served as both President of the STEM Club and President of Student Council, where I loved building communities, organizing events, and mentoring younger students. Around the same time, I also started my own tutoring and college counseling business, working with students on academics, extracurricular strategy, college essays, and confidence-building. Teaching and mentorship quickly became something I genuinely enjoyed because I loved seeing students grow and realize their potential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Penn, I have continued exploring both the technical and business sides of innovation. I became involved in the startup and entrepreneurship space while also gaining professional experience through internships. Most recently, I worked as a Product Management Intern at Comcast, where I worked on strategy and engagement initiatives for the Xfinity app. I will also be joining Boston Consulting Group (BCG), where I am excited to further develop my problem-solving and leadership skills across a wide variety of industries and challenges.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to mentoring independently, I also have teaching experience at Penn as a Teaching Assistant for physics courses, where I helped students strengthen their understanding of technical concepts and problem-solving strategies. I understand that every student learns differently, so I focus on adapting my teaching style to each student’s individual goals and learning style. My approach emphasizes not only academic success, but also confidence, organization, communication, and long-term growth.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am especially passionate about mentoring students in STEM, business, entrepreneurship, writing, and college preparation. Whether I am helping a student improve academically, develop a passion project, prepare for college applications, or explore future career interests, I strive to create a supportive and motivating environment where students feel comfortable asking questions, challenging themselves, and growing with confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbove all, I want students and families to know that I genuinely care about mentorship. I know how overwhelming academics, college applications, and career planning can sometimes feel, and I hope to help students not only achieve strong results, but also discover their own interests, strengths, and passions along the way.\u003c/p\u003e","teachingVideoPlaybackId":"xn223kAKkbtCPvWQB4028OSFtBQllztlUI5cmgh2uBXY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m especially proud of is my work with GoBabyGo, a nonprofit initiative that modifies toy cars for children with mobility disabilities to help them gain greater independence and confidence. What started as a small engineering and service project eventually grew into something that created impact across multiple communities in Thailand.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver time, I helped launch six different GoBabyGo organizations throughout Thailand and worked with three nonprofits and three hospitals to expand access to these modified cars for families in need. Through these efforts, we were able to help over 100 children with disabilities receive customized mobility cars designed around their individual needs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the parts I’m most proud of was creating a detailed building manual and training process that taught more than 50 student leaders how to build and modify the cars themselves. I wanted the project to be sustainable and continue growing even beyond my direct involvement, so focusing on leadership development and knowledge-sharing became just as important as building the cars.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis experience taught me so much about leadership, teamwork, and the power of combining engineering with social impact. More importantly, it showed me how meaningful it can be when technology is used to directly improve people’s lives and bring communities together around a shared purpose.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b21c2800-8a2d-48d7-9ee6-4f155487b2ec\"}"},{"__ref":"Favorites:{\"uuid\":\"32efa981-666c-48fb-a66c-41f95cc413ca\"}"},{"__ref":"Favorites:{\"uuid\":\"66328fd4-8a36-42a6-8464-c521884c09c5\"}"}],"causesSupported":[],"major":"Artificial Intelligence","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6c19ab15-d864-43e8-ac2f-0e2e060a5db4\"}"},{"__ref":"DeepDives:{\"uuid\":\"a01825d2-d15a-46fa-8dde-f3d088d25f62\"}"},{"__ref":"DeepDives:{\"uuid\":\"7883b2be-948e-4a2e-a721-8a4adbaab35f\"}"},{"__ref":"DeepDives:{\"uuid\":\"9e7b7e8c-5ef7-4c22-8eb1-1aa8e1eac8bf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dba0553b-7503-4261-8b2f-0396becbe20b/-/preview/-/format/jpg/","https://ucarecdn.com/a20a2fb5-38ec-42d3-b1e4-3fdf3e9b0e03/-/preview/-/format/jpg/","https://ucarecdn.com/7d794dc7-d6f0-4c46-aed1-5842991d7c69/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"34834233-f3ec-4dd1-aa06-922636f27437\"}"},{"__ref":"Education:{\"uuid\":\"179cc2e6-0126-4477-8c88-d19c14b6a337\"}"}],"hiredAt":"2026-04-30T23:34:38.839Z","topics":["Statistics","Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Computer Science","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Medicine / Health","STEM Project","Machine Learning / AI","Web Design","Game Design","Public Speaking","Debate"],"communityBadges":["https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"matthew-lowe\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"33b20f35-ef0a-4dd6-b6a3-f577cdc30c99\"}"}}},"_sentryTraceData":"80358dba1993433f9ab01b135fc49061-9a224294d8c5dc22-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=80358dba1993433f9ab01b135fc49061,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"matthew-lowe"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"
