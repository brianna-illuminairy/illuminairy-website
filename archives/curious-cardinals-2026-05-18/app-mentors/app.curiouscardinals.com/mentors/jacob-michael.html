xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5fa27b88-0789-4f8e-b232-14a3f78959df\"}":{"__typename":"Favorites","uuid":"5fa27b88-0789-4f8e-b232-14a3f78959df","photoUrl":"https://ucarecdn.com/06e15fae-a4d8-43ed-b097-da30ca0acead/","title":"folklore","type":"ALBUM"},"Favorites:{\"uuid\":\"a51837d5-469c-48be-9922-603d797cdbbd\"}":{"__typename":"Favorites","uuid":"a51837d5-469c-48be-9922-603d797cdbbd","photoUrl":"https://ucarecdn.com/06e15fae-a4d8-43ed-b097-da30ca0acead/","title":"Manhattan Beach","type":"CITY"},"Favorites:{\"uuid\":\"b2c0bd2a-0e7d-446b-8698-c3dc57a15aea\"}":{"__typename":"Favorites","uuid":"b2c0bd2a-0e7d-446b-8698-c3dc57a15aea","photoUrl":"https://ucarecdn.com/06e15fae-a4d8-43ed-b097-da30ca0acead/","title":"(500) Days of Summer","type":"MOVIE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"fb75aac5-fb00-4821-a2d1-11ef73c98314\"}":{"__typename":"DeepDives","uuid":"fb75aac5-fb00-4821-a2d1-11ef73c98314","content":"\u003cp\u003eMy dream job is to be a physician who is also involved in academic medicine. Specifically, I'd like to be a pediatric surgeon, because I enjoy working with kids, and I've always been fascinated by the mouse surgeries we do in the lab. For the academic medicine part, I'd like to do research of some kind, and hopefully also do teaching. This might mean teaching medical students, or even teaching chemistry at the high school level. I'm not quite sure yet, but we will see what the future holds!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"c689585e-dc0c-4113-aa19-e70b9247ee79\"}":{"__typename":"DeepDives","uuid":"c689585e-dc0c-4113-aa19-e70b9247ee79","content":"\u003cp\u003eMy greatest role model and mentor is my high school chemistry teacher! I first took her AP chemistry class as a sophomore, a bit nervous about being in a class with all upperclassmen. She ended up being not only an incredible lecturer and teacher, but an even more incredible human being. She helped me succeed every step along the way, and was equally passionate about chemistry as she was about the wellbeing of each and everyone of her students. Mrs. Nielsen was a role model for the kind of teacher I wanted to be, and the kind of human too. Every day, as a teacher, student, and friend, I try and embody the characteristics that made Mrs. Nielsen such an incredible person: passion, empathy, hard work, and joy. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"fa8d04ed-9184-4aa8-b975-72814d3c137b\"}":{"__typename":"DeepDives","uuid":"fa8d04ed-9184-4aa8-b975-72814d3c137b","content":"\u003cp\u003eIn my spare time, I love to explore everything fashion. Wether it's scrolling Pinterest for new inspiration, watching videos about the latest trends, or reading runway reports to see what kind of clothes are showing up on the high fashion runways. Fashion is super interesting to me, because it's something that everyone takes part in. The clothes we wear –wether intentional or not– say something about who we are, or better yet, who we \u003cem\u003ewant\u003c/em\u003e to be. In addition, the intersection of fashion and culture is so interesting to me. There is so much history behind the fashion trends that we take for granted, and understanding and appreciating them gives so much more meaning to the clothes that we put on our body! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"12f34973-7718-4633-9fc3-ee8a0258273e\"}":{"__typename":"DeepDives","uuid":"12f34973-7718-4633-9fc3-ee8a0258273e","content":"\u003cp\u003eMy favorite thing to teach students is always the periodic table. For so many people the periodic table is puzzling - elements arranged in a skate-ramp shape for no apparent reason, with groups and periods that have \"trends\" that don't have anything to do with baggy jeans... When I teach the periodic table, my favorite moment is seeing students finally see the periodic table how I see it: a beautiful symphony of elements, arranged in a way that contains multitudes of useful information, hidden between the lines. From reading electron configurations, understanding ionic charges, visualizing atomic structure, and more –\u0026nbsp;the trusty periodic table is packed with information. It is truly one of the most genius inventions of our modern age, and understanding it will revolutionize how you look at chemistry. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"School:{\"uuid\":\"eee85709-a6fb-4ad3-bb89-ed7039032e58\"}":{"__typename":"School","uuid":"eee85709-a6fb-4ad3-bb89-ed7039032e58","name":"Mira Costa High School","city":"Manhattan Beach","type":"HIGH","state":"California","country":"United States","zip":"90266"},"Education:{\"uuid\":\"45b23ed9-e7d8-4a33-a401-e0960360f142\"}":{"__typename":"Education","uuid":"45b23ed9-e7d8-4a33-a401-e0960360f142","school":{"__ref":"School:{\"uuid\":\"eee85709-a6fb-4ad3-bb89-ed7039032e58\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"044207d0-883c-47e1-bc3d-4a0dea20dc14\"}":{"__typename":"Education","uuid":"044207d0-883c-47e1-bc3d-4a0dea20dc14","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"d518156c-a3e7-42c3-9ad0-f6c0890ec750\"}":{"__typename":"MentorPublicProfile","uuid":"d518156c-a3e7-42c3-9ad0-f6c0890ec750","displayName":"Jacob T.","slug":"jacob-michael","biography":"\u003cp\u003eNice to meet you, I’m Jacob! I was born and raised in sunny Southern California, in a small beach town called Manhattan Beach. I’ve grown up loving the ocean, playing beach volleyball, and exploring beautiful Los Angeles. My parents are both doctors, and they’ve instilled in me a love of medicine and science, and I hope to one day follow in their footsteps and become a doctor myself. In high school, I decided to take my passion for science to the next level, and embark on a research journey. For 2.5 years in high school, I worked in a research lab at UCLA, studying the molecular mechanisms behind Alzheimer’s Disease. Now at Stanford, I’m working in a research lab that studies the cellular biology of pediatric brain cancer. Working as a researcher, I found an incredible community of brilliant individuals, and was impassioned by the generation-spanning effort that is science. These incredible experiences have led me to now want to pursue an MD PhD, out of a newfound love for research. My experience as a researcher gave me a depth of knowledge in the field of chemistry, biology, and math, as I worked on not only wet lab experiments, but also experiments with computational biology. However, out of these three subjects, I’ve always had a particular love for chemistry. In high school, I ran a private tutoring business for three years, where I specialized in tutoring Honors and AP Chemistry. I later became the AP Chemistry TA for a teacher who is equally talented as she is kind, and who continues to inspire me to be a lifelong educator myself. Aside from chemistry, I have experience tutoring math, english, creative writing, spanish, SAT Test Prep, and PSAT Test prep. I scored a 1560 on the SAT, was a national merit scholar, and am a proud fluent Spanish speaker. Outside of school, I love discovering new music, experimenting with fashion, and trying new foods.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m beyond excited to work with your child to help them reach their fullest potential! Whether it’s finally understanding chemistry without memorizing, connecting them to research internships, or just helping them with their math homework, I’m here to help! I’m looking forward to meeting you, and I can’t wait to see what we can accomplish!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Q1p3ivkijaN1Le7uvygq102fmidQuggEsGxgXrZAUbhI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"5fa27b88-0789-4f8e-b232-14a3f78959df\"}"},{"__ref":"Favorites:{\"uuid\":\"a51837d5-469c-48be-9922-603d797cdbbd\"}"},{"__ref":"Favorites:{\"uuid\":\"b2c0bd2a-0e7d-446b-8698-c3dc57a15aea\"}"}],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fb75aac5-fb00-4821-a2d1-11ef73c98314\"}"},{"__ref":"DeepDives:{\"uuid\":\"c689585e-dc0c-4113
