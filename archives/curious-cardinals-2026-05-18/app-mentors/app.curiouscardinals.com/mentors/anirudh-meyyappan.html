xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"03b7917c-1ff1-4328-86c3-aa0e64b4690a\"}":{"__typename":"Favorites","uuid":"03b7917c-1ff1-4328-86c3-aa0e64b4690a","photoUrl":"https://ucarecdn.com/8a821d02-de6b-438c-a347-8d864f04ac94/","title":"Stephen Curry","type":"ATHLETE"},"Favorites:{\"uuid\":\"35f2a169-519e-4528-902b-f3a9153825dc\"}":{"__typename":"Favorites","uuid":"35f2a169-519e-4528-902b-f3a9153825dc","photoUrl":"https://ucarecdn.com/1245b5ec-344f-49a8-b066-dfb4cf217b16/","title":"Interstellar","type":"MOVIE"},"Favorites:{\"uuid\":\"c9373167-09df-4091-b95d-f818647f6ca7\"}":{"__typename":"Favorites","uuid":"c9373167-09df-4091-b95d-f818647f6ca7","photoUrl":"https://ucarecdn.com/e9728a29-633b-4245-b41a-cb01de9a640c/","title":"Red Dead Redemption II","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4851cb8d-8b0a-47df-9ff3-548f977880e2\"}":{"__typename":"DeepDives","uuid":"4851cb8d-8b0a-47df-9ff3-548f977880e2","content":"\u003cp\u003e\"You don’t need to find the perfect path, just a good one you care about.\" I’ve always been someone who overthinks things, who wants to make the “optimal” choice at every step. But the truth is, life doesn’t work like that. You’re not solving a math problem — you’re learning, growing, and figuring it out as you go.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEven now, I don’t have it all figured out. And I’ve learned that uncertainty is normal, not a sign that you’re doing something wrong. What matters more than perfect decisions is showing up every day, doing what feels meaningful, and giving it your full effort. If you're giving your 100% everyday, that's all you can ask for.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"801060d6-2994-4796-894f-feda4e769996\"}":{"__typename":"DeepDives","uuid":"801060d6-2994-4796-894f-feda4e769996","content":"\u003cp\u003eI love building apps to solve problems I personally run into. People often forget that programming is a way to take something that’s frustrating or missing in your day-to-day life and turn it into something useful and functional.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne example is a to-do list app I made because I didn’t like how the default Apple one was organized. I had a specific way I wanted to track things and nothing out there quite worked, so I built my own version that fit how I think and plan.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnother is a mindfulness app I created as a quick, low-pressure way to reflect and journal. I wanted something simple I could use regularly without feeling overwhelmed, so I made an app that lets me log how I’m feeling and write a few quick thoughts whenever I want.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese kinds of projects are exciting to me because they’re personal, practical, and things that I actually use everyday.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f425408b-1c87-4fed-a710-c099236a7224\"}":{"__typename":"DeepDives","uuid":"f425408b-1c87-4fed-a710-c099236a7224","content":"\u003cp\u003eMentorship matters to me because I wouldn’t be where I am without it. In high school, I had mentors who saw something in me before I had a chance to prove it. They gave me opportunities, encouraged my curiosity, and made me feel like I belonged in spaces that once felt out of reach. That support changed my trajectory.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow, I want to be that person for someone else. Mentorship isn’t just about teaching skills, it’s about creating a space where people feel safe to ask questions, take risks, and grow. It’s about showing someone that they’re capable, even when they’re doubting themselves. For me, there’s nothing more meaningful than helping someone find confidence, clarity, or direction.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"041954cb-5450-4be3-9caa-e434500d5ff5\"}":{"__typename":"DeepDives","uuid":"041954cb-5450-4be3-9caa-e434500d5ff5","content":"\u003cp\u003eSomething that isn’t obvious right away is how much I value creativity. People don’t always associate fields like computer science or math with creativity, but to me, it’s at the core of all of them. Research isn’t just about solving problems — it’s about \u003cem\u003efinding\u003c/em\u003e the right questions, looking at things from unexpected angles, and coming up with ideas that don’t exist yet.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI try to keep myself thinking in new ways all the time whether that’s by building random apps, going on walks, or exploring new hobbies. Staying creative helps me stay curious, and it keeps my work from becoming just another checklist. Some of the best breakthroughs come from the moments that don’t look “productive” at all.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"16cc7d2f-afc1-4ef0-9b3f-46d0b92a3ae4\"}":{"__typename":"School","uuid":"16cc7d2f-afc1-4ef0-9b3f-46d0b92a3ae4","name":"Saint Francis High School","city":"Mountain View","type":"HIGH","state":"California","country":"United States","zip":"94040"},"Education:{\"uuid\":\"01d710c7-0b16-49e3-9dd9-37bb2e106ba8\"}":{"__typename":"Education","uuid":"01d710c7-0b16-49e3-9dd9-37bb2e106ba8","school":{"__ref":"School:{\"uuid\":\"16cc7d2f-afc1-4ef0-9b3f-46d0b92a3ae4\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"84e510e2-96a1-444b-bd32-0fac1378153e\"}":{"__typename":"Education","uuid":"84e510e2-96a1-444b-bd32-0fac1378153e","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2029","major":"Biomedical Engineering","degree":null},"Testimonial:768638ab-6da9-43ae-be23-857dfbe8f903":{"__typename":"Testimonial","id":"768638ab-6da9-43ae-be23-857dfbe8f903","text":"My son Lucas was so lucky to have Anirudh as his mentor as he explored using AI to power an early dementia detection iOS app this summer.  The project was challenging as it required not only strong software development skills, but also creativity, patience and resilience navigating through different hurdles along the way.  Anirudh was extremely helpful in coaching Lucas all aspects of implementation, from project planning to debugging ML model setup and API integration.  The most difficult part of Phase 1 was to arrive at a speech analysis model with reasonable accuracy.  Lucas was stuck for a long time until he worked with Anirudh who came up with different ways, such as incorporating timestamps, to tune the model.  I was impressed to see Phase 1 of the app in action within 8 weeks, and before the new school year starts.  Without Anirudh's support, I don't think Lucas could have made so much progress so quickly.  Thank you so much Anirudh and I look forward to seeing you and Lucas get Phase 2  rolling!","date":"2025-08-15 07:21:02.263+00","rating":5,"endorser":{"__typename":"Endorser","name":"Vivian Lum","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"d0708a81-695e-47dd-b3b3-720c11c3e6cf\"}":{"__typename":"MentorPublicProfile","uuid":"d0708a81-695e-47dd-b3b3-720c11c3e6cf","displayName":"Anirudh N.","slug":"anirudh-meyyappan","biography":"\u003cp\u003eHey! I’m Ani — I’m currently a PhD student in neuroengineering at Columbia University, where I study how the brain and body work together during challenging tasks. My research is all about decoding signals from the brain (like EEG) and the body (like heart rate and pupil size) to understand things like focus, stress, and mental health. I’m especially interested in brain-computer interfaces (BCIs) and how we can use machine learning to build systems that respond to how someone is doing in real time.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore all this, I got my start way earlier than I expected thanks to a few mentors who took a chance on me in high school. They saw potential I didn’t yet see in myself and gave me opportunities to explore research, write code, and ask big questions. That early support completely changed my path, and it’s a big part of why I’m here now. I’ve never forgotten that and now I want to do the same for others.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn undergrad, I studied Computer Science and Cognitive Science at UC Berkeley (class of 2024), where I was on course staff for two CS classes. I held office hours every week, and one of my favorite parts was watching students go from stuck and frustrated to “wait… I got it!” That’s the kind of learning moment I love being a part of. Now as a PhD student, I’m continuing to teach and mentor, both in and out of the classroom.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re into neuroscience, machine learning, computer science, math, or still figuring out what excites you, I’m here to support you. I'm happy to provide academic support, or help you bring a passion project to life — whether that’s coding an app, exploring a research idea, or diving deeper into a topic you’re curious about. I focus on making complex things feel approachable and meeting people where they are. My goal is to help you build confidence, stay curious, and take real steps toward where \u003cem\u003eyou\u003c/em\u003e want to go.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of research, I’m into hiking, weightlifting, cooking, and biking through NYC. I’m also an Eagle Scout and a big fan of the Golden State Warriors.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re curious, motivated, or even just figuring things out (like I was!), I’d love to work with you. I believe in helping people build the confidence to ask big questions and take that first step, even when it feels uncertain.\u003c/p\u003e","teachingVideoPlaybackId":"61xACQIkT00xTwxSbRVg5qCmeoWWETDM021m301z6wr102s","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I’m really proud of is getting my first research paper published during my sophomore year of undergrad. It was the first time I got to see my name on Google Scholar and that moment honestly meant a lot. It made all the long nights, debugging, and imposter syndrome feel worth it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the time, I didn’t fully realize how big of a deal it was. I was just excited to be contributing to something real, something that might matter beyond a classroom assignment. That experience gave me a huge boost of confidence and helped me see that research wasn’t just for “experts”, it was something I could do too.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"03b7917c-1ff1-4328-86c3-aa0e64b4690a\"}"},{"__ref":"Favorites:{\"uuid\":\"35f2a169-519e-4528-902b-f3a9153825dc\"}"},{"__ref":"Favorites:{\"uuid\":\"c9373167-09df-4091-b95d-f818647f6ca7\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4851cb8d-8b0a-47df-9ff3-548f977880e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"801060d6-2994-4796-894f-feda4e769996\"}"},{"__ref":"DeepDives:{\"uuid\":\"f425408b-1c87-4fed-a710-c099236a7224\"}"},{"__ref":"DeepDives:{\"uuid\":\"041954cb-5450-4be3-9caa-e434500d5ff5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/495b382c-5cf7-4fa5-9566-3a0709e2be39/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"01d710c7-0b16-49e3-9dd9-37bb2e106ba8\"}"},{"__ref":"Education:{\"uuid\":\"84e510e2-96a1-444b-bd32-0fac1378153e\"}"}],"hiredAt":"2025-05-10T14:35:26.175Z","topics":["Statistics","Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Coding / Programming","Sports Analytics","Machine Learning / AI","STEM Project","Medicine / Health"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:768638ab-6da9-43ae-be23-857dfbe8f903"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anirudh-meyyappan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d0708a81-695e-47dd-b3b3-720c11c3e6cf\"}"}}},"_sentryTraceData":"dcda2538ac1f4485bac27a6e43ceb1be-a3ff7e3cb570ca4f-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=dcda2538ac1f4485bac27a6e43ceb1be,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"anirudh-meyyappan"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
