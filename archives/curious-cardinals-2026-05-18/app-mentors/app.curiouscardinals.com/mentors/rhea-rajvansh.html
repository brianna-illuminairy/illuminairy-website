xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3b404d44-e540-4639-b51b-98dc7667a6fd\"}":{"__typename":"DeepDives","uuid":"3b404d44-e540-4639-b51b-98dc7667a6fd","content":"\u003cp\u003eIt is inspiring women in my life that have helped me realize what I want to do in the future. While mentors can help you gain valuable soft and hard skillls, I think it is the source of encouragement and motivation that makes them special. I want to boost my mentee's confidence and provide emotional support during challenging times.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"8ee1bb34-5071-40e0-97f3-b38d5302eebb\"}":{"__typename":"DeepDives","uuid":"8ee1bb34-5071-40e0-97f3-b38d5302eebb","content":"\u003cp\u003eI have always been someone who appreciates balance. Even though I had an academically rigorous course-load in high school, I still enjoyed playing sports, hanging out with friends, and participating in creative extracurricular activities. In the process, I had the opportunity to interact with a wide variety of people. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7b82a78f-2d24-47ee-ba7a-e0350de8e738\"}":{"__typename":"DeepDives","uuid":"7b82a78f-2d24-47ee-ba7a-e0350de8e738","content":"\u003cp\u003eDuring my summers in high school I did lots of interesting things! \u003cbr\u003e- In the summer of 2020 and 2021, I worked and got a paper published through the Drake Lab.\u003cbr\u003e- In the summer of 2020 and 2021, I founded a non-profit aimed at piquing girls interest in STEM subjects. \u003cbr\u003e- In the summer of 2021, I collaborated with the Minnesota Coalition Against Sexual Assault and Planned Parenthood on several initiatives.\u003cbr\u003e - In the summer of 2021 and 2022 I competed in National Speech and Debate Association (NSDA) National Tournament. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"dd19e394-16af-453d-883b-e7a1dcf665a7\"}":{"__typename":"DeepDives","uuid":"dd19e394-16af-453d-883b-e7a1dcf665a7","content":"\u003cp\u003eWhile my bio covers several of my interests, one interest I did not mention is my love for films and film-making. One thing I hope to achieve in my life is to create a film that uncovers a societal issue in a creative way, akin to works like \"Parasite\" or \"Little Women.\". \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"0da2d945-475c-4b7f-be4e-ddf94df4d7c3\"}":{"__typename":"School","uuid":"0da2d945-475c-4b7f-be4e-ddf94df4d7c3","name":"Eastview High School","city":"Apple Valley","type":"HIGH","state":"Minnesota","country":"United States","zip":"55124"},"Education:{\"uuid\":\"c335c052-d180-4fee-b8af-2c9f0e9e6835\"}":{"__typename":"Education","uuid":"c335c052-d180-4fee-b8af-2c9f0e9e6835","school":{"__ref":"School:{\"uuid\":\"0da2d945-475c-4b7f-be4e-ddf94df4d7c3\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"8ac783b5-55b6-491d-a039-2abc9baea258\"}":{"__typename":"Education","uuid":"8ac783b5-55b6-491d-a039-2abc9baea258","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science \u0026 Economics; History of Science, Medicine, and Public Health","degree":null},"Testimonial:43993387-0051-47f0-8b39-c0294a185696":{"__typename":"Testimonial","id":"43993387-0051-47f0-8b39-c0294a185696","text":"Rhea has been an incredible mentor for my daughter through her medicine-focused project with Curious Cardinals. From the very beginning, Rhea created a space where my daughter felt truly heard, respected, and inspired. Her ability to connect on both a personal and intellectual level made a huge impact—my daughter not only gained valuable knowledge but also developed greater confidence in her abilities and interests.\n\nRhea’s thoughtful guidance, encouragement, and genuine enthusiasm for the subject matter made every session something my daughter looked forward to. I’m so grateful for the positive role model she’s been and the passion for learning she helped spark.    Lillian S.","date":"2025-07-08 16:15:10.203+00","rating":5,"endorser":{"__typename":"Endorser","name":"Lillian S. ","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"24c8bb74-4805-4362-8a88-ed289a899183\"}":{"__typename":"MentorPublicProfile","uuid":"24c8bb74-4805-4362-8a88-ed289a899183","displayName":"Rhea R.","slug":"rhea-rajvansh","biography":"\u003cp\u003eHi! I am Rhea Rajvansh and I am so excited to meet you! \u003cbr\u003e\u003cbr\u003eI grew up in the suburbs of Minnesota, and attended Eastview High School. I truly love being a Minnesotan; I cherish our breathtaking natural surroundings, embrace our enchanting winters, and humorously acknowledge our somewhat lackluster sports teams (hehe)! \u003cbr\u003e\u003cbr\u003eOne aspect of Minnesota that has always intrigued me is our healthcare landscape. The state boasts the renowned Mayo Clinic and ranks among the top in healthcare systems. Minnesota's remarkable healthcare environment has cultivated my appreciation for the field and motivated me to interrogate and shed light on healthcare systems. Consequently, during my high school years, I actively participated in various extracurricular activities, such as the Minnesota Youth Council and research at the Drake Lab, all centered around healthcare.\u003cbr\u003e\u003cbr\u003eNow, as a sophomore at Yale,  I am studying Computer Science and Economics and The History of Science, Medicine, and Public Health. The connection to the latter is self-evident, but my choice to major in Computer Science and Economics is driven by my belief that these skills will equip me to tackle future healthcare and public health challenges.\u003cbr\u003e\u003cbr\u003eBeyond my passion for public health, I am dedicated to empowering young girls to explore STEM fields. During high school, I established a non-profit organization with a primary focus on sparking the interest of young girls in STEM disciplines. I achieved this by organizing camps, producing educational videos, and designing interactive activities.\u003cbr\u003e\u003cbr\u003eAdditionally, at Yale, I am a member of the Yale Student Investment Group, our premier student-run investment group. The Yale Student Investment Group manages a portfolio of 400K AUM. Through my involvement in this group, I have acquired valuable skills in valuations and basic modeling, conducted comprehensive fundamental research on a diverse range of companies across various industries, and honed my abilities in both quantitative and qualitative analysis. Currently, I hold the position of Equity Analyst within the Small Cap group, where I regularly present weekly pitches on companies with a market capitalization of less than $3 billion.\u003cbr\u003e\u003cbr\u003eOutside of academics, you might spot me on a jog, engrossed in a mystery novel, or watching a vibrant Bollywood film. \u003c/p\u003e","teachingVideoPlaybackId":"Q00F89bafp5jNXrGgbDnONYEabeMBaDqMhqOeDp01Q5iw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science \u0026 Economics; History of Science, Medicine, and Public Health","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3b404d44-e540-4639-b51b-98dc7667a6fd\"}"},{"__ref":"DeepDives:{\"uuid\":\"8ee1bb34-5071-40e0-97f3-b38d5302eebb\"}"},{"__ref":"DeepDives:{\"uuid\":\"7b82a78f-2d24-47ee-ba7a-e0350de8e738\"}"},{"__ref":"DeepDives:{\"uuid\":\"dd19e394-16af-453d-883b-e7a1dcf665a7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7c517754-fc8d-4caa-86e4-c9db8edc9eee/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c335c052-d180-4fee-b8af-2c9f0e9e6835\"}"},{"__ref":"Education:{\"uuid\":\"8ac783b5-55b6-491d-a039-2abc9baea258\"}"}],"hiredAt":"2023-09-18T22:13:23.862Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","Algebra II","Statistics","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Fashion / Cosmetics","History Project","Finance / Investing","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Law / Government / Policy","Sustainability","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8
