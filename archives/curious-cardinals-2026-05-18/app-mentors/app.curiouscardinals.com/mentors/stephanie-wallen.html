xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0bd9eb5a-8d2d-4955-b906-7bc29e46b616\"}":{"__typename":"Favorites","uuid":"0bd9eb5a-8d2d-4955-b906-7bc29e46b616","photoUrl":"https://ucarecdn.com/fa6c5e7a-d9d8-4118-ac9d-8596e42fadc0/","title":"Star Wars: Episode III - Revenge of the Sith","type":"MOVIE"},"Favorites:{\"uuid\":\"5f3ff4ae-a8a0-45f3-b1c5-1311ff62416c\"}":{"__typename":"Favorites","uuid":"5f3ff4ae-a8a0-45f3-b1c5-1311ff62416c","photoUrl":"https://ucarecdn.com/45ecfc19-d99e-41e9-9b2d-b5c41d45b557/","title":"     Miami ","type":"CITY"},"Favorites:{\"uuid\":\"b7acce0a-e75d-43c4-a686-a13d2d0c8b7d\"}":{"__typename":"Favorites","uuid":"b7acce0a-e75d-43c4-a686-a13d2d0c8b7d","photoUrl":"https://ucarecdn.com/428f140b-d3b9-48c4-a507-c5a88d7c3518/","title":"Volleyball","type":"SPORT"},"CausesSupported:{\"uuid\":\"9a70b652-7492-4379-aa62-8903375c22bc\"}":{"__typename":"CausesSupported","uuid":"9a70b652-7492-4379-aa62-8903375c22bc","name":"Shake A Leg","description":"\u003cp\u003eGiving children with disabilities access to water sports.\u0026nbsp;\u003c/p\u003e","photoUrl":"https://ucarecdn.com/8855117c-cf43-4c33-8130-af622fac6d0e/"},"CausesSupported:{\"uuid\":\"f4f205c4-5410-4fc2-a979-fba68397ef50\"}":{"__typename":"CausesSupported","uuid":"f4f205c4-5410-4fc2-a979-fba68397ef50","name":"Code Art","description":"\u003cp\u003eProvide educational opportunities in computer science to girls.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/33a1e3d9-314f-4c4d-9cf8-8e648f0f9e27/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"25bff95c-dea4-4413-b788-6c743bc0fb8c\"}":{"__typename":"DeepDives","uuid":"25bff95c-dea4-4413-b788-6c743bc0fb8c","content":"\u003cp\u003eMentorship matters because it has the power to transform lives. A great mentor provides guidance, support, and encouragement, helping students build confidence, develop skills, and unlock their full potential. Having someone to believe in you, challenge you, and help you navigate obstacles can make all the difference in achieving success. For me, mentorship is especially important in STEM, where complex concepts can feel overwhelming. I’ve seen firsthand how having the right mentor can turn struggles into strengths—whether it’s mastering a tough math problem, building a robot, or pursuing a new passion. Mentorship is more than just teaching; it’s about inspiring curiosity, fostering resilience, and creating a supportive space for growth. I believe that everyone deserves access to guidance and opportunities, and that’s why I’m passionate about mentoring. I want to help students gain confidence, explore new ideas, and realize that they are capable of more than they ever imagined.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"577fdb48-4a98-4e6a-bd74-0ed2d693cf1f\"}":{"__typename":"DeepDives","uuid":"577fdb48-4a98-4e6a-bd74-0ed2d693cf1f","content":"\u003cp\u003eMy biggest motivation in overcoming challenges is the pride and fulfillment that comes from pushing my limits and accomplishing things that once seemed difficult. I thrive on challenges, seeing them as opportunities to grow, learn, and prove to myself what I’m capable of. This mindset extends to my passion for mentorship—there’s nothing more rewarding than watching my students tackle obstacles, build confidence, and achieve things they never thought possible. Their success motivates me to keep striving, both as a mentor and in my own pursuits. I genuinely love doing hard things, because every challenge overcome is a step toward something greater.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"cf4001d9-f028-411c-8e45-5a5c586713dd\"}":{"__typename":"DeepDives","uuid":"cf4001d9-f028-411c-8e45-5a5c586713dd","content":"\u003cp\u003eMechanical engineering is the perfect blend of my analytical and creative sides. I’m drawn to math because it offers clear answers, but I also love creating things where the possibilities are endless, and the only limit is your imagination. This balance of problem-solving and innovation is what excites me about mechanical engineering. One of my greatest interests is in aircraft. I’ve always been fascinated by how these incredible machines can glide through the sky, connecting people across the globe. The idea that engineering can create something that bridges vast distances and brings people closer together is what inspires me to pursue this field. I’m excited to combine creativity and technical skills to contribute to such meaningful innovations.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"93eca73e-4969-4ddc-93ff-6def82cb2ab1\"}":{"__typename":"DeepDives","uuid":"93eca73e-4969-4ddc-93ff-6def82cb2ab1","content":"\u003cp\u003eMy greatest role model is my mom. She is one of the hardest-working and most resilient people I know, and she has always encouraged me to pursue my dreams. Her dedication, perseverance, and unwavering support have shaped who I am today. No matter what challenges she faces, she approaches them with grace and determination, setting an example of strength and kindness. She has taught me the value of hard work, perseverance, and believing in myself, and I strive every day to make her proud by following my passions and pushing myself to achieve more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}":{"__typename":"School","uuid":"1dc8c564-7629-4af5-851c-69ed64a8870e","name":"Ransom Everglades High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33133"},"Education:{\"uuid\":\"4b1c8a86-060f-4a02-86be-31c1920239b1\"}":{"__typename":"Education","uuid":"4b1c8a86-060f-4a02-86be-31c1920239b1","school":{"__ref":"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}":{"__typename":"School","uuid":"11470c0e-6098-4972-92d0-60616358bd13","name":"California Institute of Technology","city":"Pasadena","type":"COLLEGE","state":"California","country":"United States","zip":"91125"},"Education:{\"uuid\":\"fd536278-f809-41e5-b19e-d457e06aebeb\"}":{"__typename":"Education","uuid":"fd536278-f809-41e5-b19e-d457e06aebeb","school":{"__ref":"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering ","degree":null},"MentorPublicProfile:{\"uuid\":\"5faedf66-8171-4a2a-9b7a-f2d7abd7a11d\"}":{"__typename":"MentorPublicProfile","uuid":"5faedf66-8171-4a2a-9b7a-f2d7abd7a11d","displayName":"Stephanie W.","slug":"stephanie-wallen","biography":"\u003cp\u003eHello! My name is Stephanie, and I am a student at Caltech, where I am studying Mechanical Engineering with a focus on aerospace. I’ve always been fascinated by engineering, problem-solving, and the endless possibilities of science and technology. But beyond my love for STEM, one of my greatest passions is mentoring and teaching. I believe that every student has the ability to succeed with the right support, and I love being part of that journey.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout high school, I was deeply involved in programming, robotics, and math teams. These experiences not only sharpened my technical skills but also reinforced my love for teaching and mentorship. Seeing students go from struggling with a topic to mastering it—and even developing a passion for it—is one of the most rewarding experiences for me. I also value health education and community outreach, which is why I served as a Peer Health Educator for the nonprofit Health Information Project (HIP). In this role, I gained even more experience teaching others by leading classroom instruction on health and safety, helping students develop a strong foundation in wellness and informed decision-making. Another passion of mine is traveling. Exploring new places, cultures, and perspectives has shaped the way I see the world and has fueled my curiosity for learning. While I love air travel, I also recognize the environmental challenges in the aerospace industry. To help make aviation more sustainable, I founded FlightCycle, a nonprofit dedicated to recycling cans used for airplane engine oil.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Caltech, I am a member of the Caltech Air and Outer Space (CAOS) club, where I had the opportunity to participate in NASA’s Big Idea Challenge. As part of this competition, my team and I designed, prototyped, and tested an inflatable guard shield to protect lunar devices from regolith impact. I contributed to optimizing the shield’s durability and effectiveness, and we presented our findings at the NASA Big Idea Forum, where I gained valuable experience in research, prototyping, testing, and technical communication. I am also currently working on CRATER, a lunar rover that my team is designing and improving to compete in upcoming challenges.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I love staying active and I compete on Caltech’s volleyball and water polo teams. I’ve also always been drawn to water sports like kayaking, and in high school, I volunteered at Shake A Leg, an organization dedicated to giving students with disabilities access to water sports. Being able to help others experience the joy of being on the water was an incredibly fulfilling experience. All of these experiences—whether in engineering, mentorship, athletics, or advocacy—have reinforced my belief that learning is most powerful when shared. I am passionate about helping students build confidence in math, engineering, and STEM. If you’re looking for a mentor who is not only knowledgeable but also deeply invested in your growth and success, I would love to be part of your journey.\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"IZiEFNZULvcjbdOIsRiTHplV00Fz7b3i6QVu4pEDgA14","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my proudest achievements is GLOBO, a high-altitude balloon prototype designed to monitor greenhouse gases and atmospheric conditions in real time. Over the past several months, my teammate and I have made incredible progress, and we are preparing to launch GLOBO in the coming weeks. This project has not only deepened my understanding of environmental monitoring and aerospace engineering but has also given me the opportunity to apply my skills to a real-world challenge with meaningful implications.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith rising levels of greenhouse gases like CO₂ and methane accelerating climate change, obtaining accurate, real-time emissions data is critical for developing effective mitigation strategies. Ground-based monitoring alone isn’t enough, so GLOBO aims to fill this gap by deploying advanced sensors in the upper atmosphere to continuously collect and transmit data. By measuring humidity, temperature, CO₂, methane, and other pollutants, GLOBO will provide valuable insights that can inform climate policy, environmental management, and targeted action against pollution.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis project has been an incredible learning experience. From designing and 3D-printing the payload frame to integrating sensors, I’ve developed hands-on expertise in engineering, problem-solving, and research. I’ve also learned the importance of collaboration and adaptability, as each phase of development required overcoming unexpected challenges—from sensor calibration to optimizing GLOBO’s GPS tracking system to ensure a successful launch and data recovery.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond its technical achievements, GLOBO represents something much bigger—a step toward more sustainable, cost-effective environmental monitoring. I take immense pride in what we’ve built, not just because of its scientific impact, but because of the journey it took to get here. This project has solidified my passion for engineering, space technology, and environmental sustainability, and I’m excited to see how GLOBO can contribute to climate science while paving the way for future innovations.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0bd9eb5a-8d2d-4955-b906-7bc29e46b616\"}"},{"__ref":"Favorites:{\"uuid\":\"5f3ff4ae-a8a0-45f3-b1c5-1311ff62416c\"}"},{"__ref":"Favorites:{\"uuid\":\"b7acce0a-e75d-43c4-a686-a13d2d0c8b7d\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"9a70b652-7492-4379-aa62-8903375c22bc\"}"},{"__ref":"CausesSupported:{\"uuid\":\"f4f205c4-5410-4fc2-a979-fba68397ef50\"}"}],"major":"Mechanical Engineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"25bff95c-dea4-4413-b788-6c743bc0fb8c\"}"},{"__ref":"DeepDives:{\"uuid\":\"577fdb48-4a98-4e6a-bd74-0ed2d693cf1f\"}"},{"__ref":"DeepDives:{\"uuid\":\"cf4001d9-f028-411c-8e45-5a5c586713dd\"}"},{"__ref":"DeepDives:{\"uuid\":\"93eca73e-4969-4ddc-93ff-6def82cb2ab1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f710a4e4-4efc-4ab7-b6c7-2c70d89b1cb6/-/preview/-/format/jpg/","https://ucarecdn.com/c785dd99-f3f0-4cc0-9a6c-357eb753b85f/-/preview/-/format/jpg/","https://ucarecdn.com/7a888a14-2ddd-4c81-a2d1-97b9b0813d64/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4b1c8a86-060f-4a02-86be-31c1920239b1\"}"},{"__ref":"Education:{\"uuid\":\"fd536278-f809-41e5-b19e-d457e06aebeb\"}"}],"hiredAt":"2025-03-14T14:04:39.462Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Calculus","Precalculus / Trigonometry","6-8 Grade Science","Physics","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Creative Writing","Coding / Programming","Robotics / Electronics / CAD","Game Design","STEM Project","Aviation / Aerospace","Sustainability"],"communityBadges":["https://ucarecdn.com/1e4a2735-1bb6-4525-bb3b-365dd5531407/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"stephanie-wallen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5faedf66-8171-4a2a-9b7a-f2d7abd7a11d\"}"}}},"_sentryTraceData":"8fcfbf4e192f4fbe9f8ac227d0e89605-b6cdab615dbf3165-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8fcfbf4e192f4fbe9f8ac227d0e89605,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mento
