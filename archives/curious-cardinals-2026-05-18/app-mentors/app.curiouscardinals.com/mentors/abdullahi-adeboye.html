xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8db1cf44-47bd-459d-9695-591a0f603fe1\"}":{"__typename":"Favorites","uuid":"8db1cf44-47bd-459d-9695-591a0f603fe1","photoUrl":"https://ucarecdn.com/d752fa1b-f45b-4d23-9935-31f3aa5456ba/","title":"Lionel Messi","type":"ATHLETE"},"Favorites:{\"uuid\":\"e1d289c9-94b6-4086-8b2e-3157568f42a9\"}":{"__typename":"Favorites","uuid":"e1d289c9-94b6-4086-8b2e-3157568f42a9","photoUrl":"https://ucarecdn.com/b56d8fd2-4b68-4dc7-a08f-349e4818f66c/","title":"Soccer","type":"SPORT"},"Favorites:{\"uuid\":\"9c450ad0-b695-4087-88dc-bfbdc9789e8b\"}":{"__typename":"Favorites","uuid":"9c450ad0-b695-4087-88dc-bfbdc9789e8b","photoUrl":"https://ucarecdn.com/4818ebe4-6de7-4fae-b720-3b905055667f/","title":"Chelsea","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d09c01da-7925-4736-80bb-4ec070929921\"}":{"__typename":"DeepDives","uuid":"d09c01da-7925-4736-80bb-4ec070929921","content":"\u003cp\u003eMentorship matters to me because it’s the kind of support I didn’t always have. As a first-generation college student, navigating high school, college applications, and internships often felt like guessing in the dark. I had to figure out how to apply to top schools, what admissions officers were really looking for, and how to turn my curiosity in STEM into concrete opportunities — all with minimal guidance. That process taught me resilience, but it also showed me how powerful it would have been to have someone a step ahead, showing me the ropes and making the path feel less overwhelming.\u003c/p\u003e\u003cp\u003eNow that I’ve had the chance to receive multiple internship offers, attend national engineering summits, and study on a full-ride scholarship at Caltech while playing NCAA soccer, I see mentorship as a way of “paying it forward.” I know what it feels like to have big dreams but no clear roadmap, and I want to be the kind of mentor I once needed.\u003c/p\u003e\u003cp\u003eMentorship also matters because it’s about more than academics — it’s about confidence, time management, and believing that you belong in spaces where you might not see many people like yourself. Whether I’m helping a student understand \u003cem\u003ewhy\u003c/em\u003e algebra is important, guiding them through a passion project, or reviewing college essays, I want them to walk away feeling more capable and excited about their future.\u003c/p\u003e\u003cp\u003eAt its core, mentorship is about connection. It’s a chance to remind students that their questions and ambitions matter, and that they don’t have to navigate their journeys alone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"20c30d9a-c03c-4562-ab6e-20d795476143\"}":{"__typename":"DeepDives","uuid":"20c30d9a-c03c-4562-ab6e-20d795476143","content":"\u003cp\u003eMy heritage and identity shape my teaching style in a very personal way. Growing up between Nigeria and the U.S., I’ve always been aware of the importance of access — whether that’s access to reliable electricity, to quality education, or to mentors who can guide you through new opportunities. Those experiences taught me not to take learning for granted, and they gave me a strong sense of responsibility to share knowledge with others.\u003c/p\u003e\u003cp\u003eAs a first-generation college student, I’ve had to navigate applications, internships, and academics with little guidance, often learning through trial and error. That perspective makes me patient with students who may feel uncertain or overwhelmed, because I know what it feels like to be in their shoes. Instead of expecting perfection, I focus on building confidence step by step and showing students how to break down challenges into approachable goals.\u003c/p\u003e\u003cp\u003eBeing a QuestBridge Scholar at Caltech, while also playing NCAA soccer, has reinforced the importance of persistence and time management. I bring that same mindset to teaching: helping students see that success isn’t just about raw talent, but also about discipline, organization, and believing in yourself even when the odds feel stacked against you.\u003c/p\u003e\u003cp\u003eUltimately, my background allows me to connect with students not only as a mentor but as someone who understands the cultural, academic, and personal hurdles they may face. I aim to make every session not just informative but also empowering — a space where students feel seen, supported, and encouraged to reach higher.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d6101a38-a5ae-4f95-ada1-356bf59e972a\"}":{"__typename":"DeepDives","uuid":"d6101a38-a5ae-4f95-ada1-356bf59e972a","content":"\u003cp\u003eI’ve always loved playing soccer from a young age since my dad was, and still is, really into the sport. Every chance I get, I try to train and practice as much as possible, and it’s been a big part of my life both on and off the field. More recently, I’ve been getting into basketball and football — whenever I’m back home in Houston, I play basketball with my friends, and it’s always an amazing experience that reminds me of home.\u003c/p\u003e\u003cp\u003eI’ve also developed a habit of trying out new restaurants with friends and rating them whenever our busy schedules line up. It’s become a fun way to combine hanging out with exploring new flavors and places. Beyond food, I really enjoy exploring the world more broadly, whether that’s through traveling or hiking. And when I want to just relax, I’ll turn on a series and enjoy taking a break for a while.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"500bec97-df5c-4f0f-98cf-53ad0de61f22\"}":{"__typename":"DeepDives","uuid":"500bec97-df5c-4f0f-98cf-53ad0de61f22","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I’d say: trust the process and believe that the work you’re putting in will pay off\u003cstrong\u003e.\u003c/strong\u003e Back then, I often felt like I was figuring things out completely on my own — whether it was preparing for college applications, managing sports and school, or trying to turn my curiosity in STEM into something tangible. I’d remind myself that not having all the answers doesn’t mean you’re on the wrong path; it just means you’re learning as you go.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eI’d also tell myself not to be afraid of aiming higher. As a first-generation student, I sometimes underestimated what opportunities were possible because I didn’t see many examples around me. If I could go back, I’d say: apply to that program, reach out to that mentor, and don’t be afraid to put yourself in rooms where you might feel out of place. You’ll grow into those spaces.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I’d remind myself that balance matters. Playing soccer, keeping up with academics, and finding time for friends taught me that discipline and time management are just as important as raw effort. I’d encourage my younger self to enjoy the journey more — to celebrate small wins, to not stress over every setback, and to realize that those challenges are the very things that will make the big milestones feel worth it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"c0c4a09e-aa90-4def-9e23-6161ef13d189\"}":{"__typename":"School","uuid":"c0c4a09e-aa90-4def-9e23-6161ef13d189","name":"Harmony School of Innovation - Sugar Land","city":"Sugar Land","type":"HIGH","state":"Texas","country":"United States","zip":"77498"},"Education:{\"uuid\":\"f71e924c-cea3-4fe9-95c5-29ba22b5dc02\"}":{"__typename":"Education","uuid":"f71e924c-cea3-4fe9-95c5-29ba22b5dc02","school":{"__ref":"School:{\"uuid\":\"c0c4a09e-aa90-4def-9e23-6161ef13d189\"}"},"startYear":"2021","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}":{"__typename":"School","uuid":"11470c0e-6098-4972-92d0-60616358bd13","name":"California Institute of Technology","city":"Pasadena","type":"COLLEGE","state":"California","country":"United States","zip":"91125"},"Education:{\"uuid\":\"5e7e0c5f-af69-4e87-94dd-1906dadda5b2\"}":{"__typename":"Education","uuid":"5e7e0c5f-af69-4e87-94dd-1906dadda5b2","school":{"__ref":"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering + Business","degree":null},"MentorPublicProfile:{\"uuid\":\"db8ccfca-fadf-4166-bb58-e95fda7faa17\"}":{"__typename":"MentorPublicProfile","uuid":"db8ccfca-fadf-4166-bb58-e95fda7faa17","displayName":"Abdullahi A.","slug":"abdullahi-adeboye","biography":"\u003cp\u003eHi! I’m Abdul, a sophomore at Caltech studying Mechanical Engineering and Business, Economics \u0026amp; Management. I’m passionate about STEM not just as a career path but as a way to ask “why” about the world — and I love helping students tap into that same curiosity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI recently completed a Building \u0026amp; Systems Engineering internship at UPS, where I worked on automation projects that processed over 40,000 packages per hour and collaborated with contractors to make large-scale logistics systems more efficient. Beyond UPS, I’ve conducted robotics research at Caltech’s Center for Autonomous Systems and Technologies, refining rover subsystems and running thruster performance tests. These experiences, along with research at NASA and industry summits with GE Vernova and Valero, have shaped how I approach problem-solving: breaking challenges into steps, building strong teams, and following through until the work makes a real impact.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eWho I mentor\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI especially enjoy working with:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMiddle and high school students\u003c/strong\u003e who are curious about STEM but unsure which direction to pursue\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStudents who want to understand the \u003cem\u003ewhy\u003c/em\u003e behind school subjects (like how algebra connects to real-world problems)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStudents preparing for \u003cstrong\u003ecollege applications\u003c/strong\u003e, from shaping STEM/charity passion projects to polishing essays and learning how to stand out to admissions officers\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStudents eager to strengthen \u003cstrong\u003eSTEM exploration and problem-solving skills\u003c/strong\u003e in a fun and approachable way\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eAs a first-generation QuestBridge Scholar on a full-ride at Caltech, I know what it’s like to navigate these paths with little guidance. I’ve personally worked through the challenges of figuring out college applications, building strong projects, and securing opportunities — from multiple internship offers as a freshman to being selected for national summits. I want to make those processes less intimidating for students who may feel overwhelmed or unsure where to start.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve also learned firsthand the importance of time management and discipline. Balancing one of the most rigorous academic environments in the country with playing NCAA DIII soccer has taught me how to stay organized, set priorities, and still make space for hobbies and friendships. These are the same skills I emphasize with students: how to succeed academically while still enjoying life outside the classroom.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eOutside the classroom\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI love working out, watching sports, and exploring new food spots with friends. I believe mentorship should be both inspiring and fun — whether we’re brainstorming a project, breaking down tough math, or reviewing a draft essay, I aim to make our time together encouraging and engaging.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re curious, motivated, and ready to explore your path, I’d love to help guide you there.\u003c/p\u003e","teachingVideoPlaybackId":"bBb32ciLcIHbrN88uzvosMTH6FV01PzOSr01nALJ0198SM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'd probably say something I've been really proud of recently was being able to secure a well paid internship during my freshman year. Many upperclassmen, peers, teachers told me it was all for naught, that companies don't hire freshmen. But throughout the endless rejection emails, failed coffee chats, and botched interviews, I persevered and stuck to it. That's what I'm most proud of myself for doing, believing in myself and sticking to my guts when no one else would, the internship really was just the icing on the cake.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"8db1cf44-47bd-459d-9695-591a0f603fe1\"}"},{"__ref":"Favorites:{\"uuid\":\"e1d289c9-94b6-4086-8b2e-3157568f42a9\"}"},{"__ref":"Favorites:{\"uuid\":\"9c450ad0-b695-4087-88dc-bfbdc9789e8b\"}"}],"causesSupported":[],"major":"Mechanical Engineering + Business","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d09c01da-7925-4736-80bb-4ec070929921\"}"},{"__ref":"DeepDives:{\"uuid\":\"20c30d9a-c03c-4562-ab6e-20d795476143\"}"},{"__ref":"DeepDives:{\"uuid\":\"d6101a38-a5ae-4f95-ada1-356bf59e972a\"}"},{"__ref":"DeepDives:{\"uuid\":\"500bec97-df5c-4f0f-98cf-53ad0de61f22\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/873c2886-be18-48b0-8663-c7eb0d374ad4/-/preview/-/format/jpg/","https://ucarecdn.com/9bff9999-cb8e-4b90-983a-0ac0aed15a22/-/preview/-/format/jpg/","https://ucarecdn.com/e9844821-252d-4b4a-9b29-bfb2a57f9807/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f71e924c-cea3-4fe9-95c5-29ba22b5dc02\"}"},{"__ref":"Education:{\"uuid\":\"5e7e0c5f-af69-4e87-94dd-1906dadda5b2\"}"}],"hiredAt":"2025-09-27T05:55:22.566Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Writing","College Essay Writing","Academic Coaching","Executive Function","Reading"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/1e4a2735-1bb6-4525-bb3b-365dd5531407/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"abdullahi-adeboye\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"db8ccfca-fadf-4166-bb58-e95fda7faa17\"}"}}},"_sentryTraceData":"01537c9472554b8bb279234484264946-8768d3e374dec651-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=01537c9472554b8bb279234484264946,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"abdullahi-adeboye"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
