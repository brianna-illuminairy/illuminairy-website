xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5f590704-a4d4-4728-a67f-d2faea3cf1fd\"}":{"__typename":"DeepDives","uuid":"5f590704-a4d4-4728-a67f-d2faea3cf1fd","content":"\u003cp\u003eIf I could give my middle or high school self one piece of advice, it would be this: you don’t need to understand everything all at once. Focus on the next clear step.\u003c/p\u003e\u003cp\u003eWhen I was a student, I often felt pressure to master an entire subject before feeling confident about it. But learning doesn’t really work that way. Understanding usually comes from engaging with ideas gradually, asking questions, testing your thinking, and allowing yourself to be curious even when things feel uncertain.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would also remind myself that feeling overwhelmed doesn’t mean you’re not capable. Often it simply means you’re trying to hold too many ideas at once. Breaking things into smaller parts, prioritising what matters most, and giving yourself permission to learn step by step makes a huge difference.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I would tell my younger self to explore widely. Some of the most interesting paths in life come from following questions rather than chasing perfect answers. Staying curious about science, people, ideas, and the world often leads you somewhere more meaningful than you expected.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat mindset is something I now try to pass on to the students I mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"95e29ac4-463c-4bdc-9e85-208277286c77\"}":{"__typename":"DeepDives","uuid":"95e29ac4-463c-4bdc-9e85-208277286c77","content":"\u003cp\u003eIt’s difficult for me to point to a single role model, because I’ve always tried to learn something valuable from many different people rather than following just one path.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my academic journey, I’ve been fortunate to learn from teachers, researchers, and mentors who each influenced me in different ways. Some showed me the importance of intellectual curiosity and asking thoughtful questions, while others demonstrated patience, clarity, and generosity when explaining complex ideas. I’ve also learned a lot from students themselves. Their perspectives often remind me how important it is to stay open-minded and adaptable.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eRather than trying to emulate one person entirely, I’ve found it more meaningful to observe the qualities that make someone a great mentor, such as curiosity, kindness, intellectual honesty, and the ability to encourage others to think for themselves, and try to cultivate those qualities in my own work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn many ways, this is also how I approach mentoring students. I encourage them to learn broadly, stay curious, and recognise that inspiration can come from many places, not just one.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"e3defc67-c2d2-4ff9-9c18-1564e1254f04\"}":{"__typename":"DeepDives","uuid":"e3defc67-c2d2-4ff9-9c18-1564e1254f04","content":"\u003cp\u003eMy greatest source of motivation is curiosity, both my own and the curiosity I see in others when something finally starts to make sense.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always been fascinated by how people learn and how complex ideas gradually become clearer through questioning, exploration, and discussion. That curiosity is what led me into neuroscience research, but it’s also what keeps me motivated when mentoring students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the most rewarding moments in learning is when a concept that once felt confusing suddenly becomes intuitive. Seeing that shift, when a student begins to feel more confident in their thinking and starts asking deeper questions, is incredibly motivating for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMore broadly, I’m motivated by the idea that education can empower people. When students feel capable of understanding difficult ideas and approaching problems thoughtfully, it often changes the way they see themselves and their potential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat combination of curiosity, growth, and helping others discover their own abilities is what continues to drive my work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3fe6b03f-f673-43b2-9021-e8b494cf64bf\"}":{"__typename":"DeepDives","uuid":"3fe6b03f-f673-43b2-9021-e8b494cf64bf","content":"\u003cp\u003eI really enjoy Jiu-Jitsu wrestling. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI initially started out of interest, but it quickly became something I really value because of the mindset it develops. Jiu-jitsu is a sport where progress comes from patience, learning from mistakes, and gradually refining your thinking rather than trying to force quick results.\u003c/p\u003e\u003cp\u003eIn many ways, I find that the mindset overlaps with learning and mentoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether someone is working through a difficult concept or developing a new skill, progress usually happens through small improvements, thoughtful practice, and a willingness to keep exploring when something doesn’t work the first time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt’s a reminder that growth is rarely linear, but with persistence and the right approach, things that once felt confusing can eventually become intuitive and develop into a flow state.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"43a51c9a-c1ea-41e4-a4ad-a1d2eff99699\"}":{"__typename":"School","uuid":"43a51c9a-c1ea-41e4-a4ad-a1d2eff99699","name":"Waldegrave School","city":"Twickenham","type":"HIGH","state":"England","country":"United Kingdom","zip":"TW2 5LH"},"Education:{\"uuid\":\"f7f01a67-4800-43e6-aaf5-a2ac11acf545\"}":{"__typename":"Education","uuid":"f7f01a67-4800-43e6-aaf5-a2ac11acf545","school":{"__ref":"School:{\"uuid\":\"43a51c9a-c1ea-41e4-a4ad-a1d2eff99699\"}"},"startYear":"2014","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3cc9af59-35ae-4cc6-ac10-d71dfa4c32e7\"}":{"__typename":"School","uuid":"3cc9af59-35ae-4cc6-ac10-d71dfa4c32e7","name":"Imperial College London/ University of Leicester","city":"London","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"SW7 2AZ"},"Education:{\"uuid\":\"58a24e01-7bf3-4f40-8404-d4aa79045344\"}":{"__typename":"Education","uuid":"58a24e01-7bf3-4f40-8404-d4aa79045344","school":{"__ref":"School:{\"uuid\":\"3cc9af59-35ae-4cc6-ac10-d71dfa4c32e7\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2025","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"ad4f12df-a0c8-4f99-9782-1c75119047e7\"}":{"__typename":"MentorPublicProfile","uuid":"ad4f12df-a0c8-4f99-9782-1c75119047e7","displayName":"Elara K.","slug":"elara-karimi","biography":"\u003cp\u003eHi! I’m Elara, a neuroscience researcher who loves helping students make sense of complex ideas and feel more confident in how they learn.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic journey has taken me through a Bachelor’s degree in Biology, a Master’s at Imperial College London, and, most recently, a PhD in Neuroscience at the University of Leicester. My research explores how the nervous system develops and adapts, particularly how environment and experience influence learning and behaviour. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eStudying the brain has sparked my deep interest not only in \u003cem\u003ewhat\u003c/em\u003e students learn, but also in \u003cem\u003ehow\u003c/em\u003e they learn best.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside my academic work, I’ve spent over 13 years mentoring and tutoring students across a range of ages and subjects, including biology, psychology, maths, and academic writing. I work with students from middle school through advanced high school, helping them build confidence in challenging subjects while also developing the skills that make learning feel manageable and meaningful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne pattern I’ve noticed again and again is that many students are highly capable but feel overwhelmed by the sheer amount of information they believe they need to master. My approach to mentorship focuses on helping students develop strategies that reduce that overwhelm, things like prioritisation, breaking complex topics into clear steps, and building strong executive functioning skills so they can study with clarity rather than stress.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also interested in how emerging technologies like AI are shaping the way students learn. I enjoy helping students use tools like AI thoughtfully and responsibly, while still strengthening their own reasoning, curiosity, and independent thinking.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of research and mentoring, I enjoy creating spaces where people can explore ideas together. I recently co-founded a small Writer’s Guild that brings people together to discuss books, exchange ideas, and develop their writing. I’ve also contributed to academic research projects and publications, which has strengthened my appreciation for clear communication and thoughtful inquiry.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentoring for me means creating a space where students feel comfortable exploring ideas, asking questions, and discovering what genuinely interests them. Whether we’re unpacking a challenging biology concept, improving writing and communication skills, or developing a STEM passion project, my goal is always the same: to help students feel curious, capable, and excited about learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs for hobbies, I enjoy Brazilian jiu-jitsu, reading across science and philosophy, and thinking about how education can better support curiosity and independent thinking.\u003c/p\u003e","teachingVideoPlaybackId":"AJigp8DbSckOs801X9vjBtdb5XJNbG61O00HqA9FgL7mg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5f590704-a4d4-4728-a67f-d2faea3cf1fd\"}"},{"__ref":"DeepDives:{\"uuid\":\"95e29ac4-463c-4bdc-9e85-208277286c77\"}"},{"__ref":"DeepDives:{\"uuid\":\"e3defc67-c2d2-4ff9-9c18-1564e1254f04\"}"},{"__ref":"DeepDives:{\"uuid\":\"3fe6b03f-f673-43b2-9021-e8b494cf64bf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2ef4f4f6-f491-41e2-9cc9-5e783ba6ed5c/-/preview/-/format/jpg/","https://ucarecdn.com/0bb932f0-eba0-4dca-9bdb-9adcbdb90043/-/preview/-/format/jpg/","https://ucarecdn.com/d2e33069-a56c-4055-8fd0-8fdb69a4e5e1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f7f01a67-4800-43e6-aaf5-a2ac11acf545\"}"},{"__ref":"Education:{\"uuid\":\"58a24e01-7bf3-4f40-8404-d4aa79045344\"}"}],"hiredAt":"2026-02-28T02:26:46.054Z","topics":["6-8 Grade Science","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Medicine / Health","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elara-karimi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ad4f12df-a0c8-4f99-9782-1c75119047e7\"}"}}},"_sentryTraceData":"ffc4234e82e24f24a5a5736882f7a8e0-8f21017626d392c8-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ffc4234e82e24f24a5a5736882f7a8e0,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"elara-karimi"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
