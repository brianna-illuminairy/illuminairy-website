xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e63f07e8-d681-4040-bc71-fd6f7c6d7041\"}":{"__typename":"DeepDives","uuid":"e63f07e8-d681-4040-bc71-fd6f7c6d7041","content":"\u003cp\u003eI hope to have a positive impact on communities around me that have been put aside for too long by society and not given the same opportunities I have. I aim to use sports and the platform I have in order to uplift those communities and leave a lasting memory of my work in my lifetime.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a1d6fc32-c466-47c8-a58c-8a6f801241f0\"}":{"__typename":"DeepDives","uuid":"a1d6fc32-c466-47c8-a58c-8a6f801241f0","content":"\u003cp\u003eMy dream job is to be a top executive at a professional club, more specifically a sporting director of a soccer team. I want to be able to run a team and make the all the important decisions regarding how the club will be run. This would be like playing real life Football Manager.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"bb8496d1-2ad4-4df6-9dd5-9df96cd47e39\"}":{"__typename":"DeepDives","uuid":"bb8496d1-2ad4-4df6-9dd5-9df96cd47e39","content":"\u003cp\u003eMy greatest source of motivation is to make my loved ones proud, especially my parents and grandmother. Knowing how hard they have worked and how much they have done and given up for me to be int he position I am today, I want to make sure I am able to show them my gratitude and appreciation. This has been the main driver for how I have lived so far and why I intent to continue working hard.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d2cc7023-a86d-4909-9aee-1045db7cb2ca\"}":{"__typename":"DeepDives","uuid":"d2cc7023-a86d-4909-9aee-1045db7cb2ca","content":"\u003cp\u003eI was a summer camp counselor in West Virginia while in high school. I got to meet all kinds of kids, eat a lot of s'mores, and sing \"Country Roads\" every night. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"874b1fe0-5fc6-428d-ab44-6b3425c037a0\"}":{"__typename":"School","uuid":"874b1fe0-5fc6-428d-ab44-6b3425c037a0","name":"Lycee Albert 1er","city":"Monaco","type":"HIGH","state":"Monaco","country":"Monaco","zip":"98000"},"Education:{\"uuid\":\"3893d723-d787-4d7e-9ecc-482f4d792df3\"}":{"__typename":"Education","uuid":"3893d723-d787-4d7e-9ecc-482f4d792df3","school":{"__ref":"School:{\"uuid\":\"874b1fe0-5fc6-428d-ab44-6b3425c037a0\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"014bfe21-0b87-4a5c-a23d-eee7b94933c5\"}":{"__typename":"Education","uuid":"014bfe21-0b87-4a5c-a23d-eee7b94933c5","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Journalism and Political Science","degree":null},"Testimonial:70de517d-b740-4402-b8e3-49d714ed3949":{"__typename":"Testimonial","id":"70de517d-b740-4402-b8e3-49d714ed3949","text":"I'm not even sure how to begin thanking Leo for his impact on our son over this past year.  Lucas began middle school with very little confidence in his writing ability. Leo not only helped him improve his writing technique, but also encouraged his love for writing.  He has become a true mentor in every sense of the word and Lucas looks forward to Tuesdays when they spend an hour together over zoom, checking in about school, discussing the latest professional sporting events and going through the writing process together. We are so grateful for his support of our son and truly believed he changed the trajectory for Lucas in terms of his writing confidence and ability. Thank you Leo!","date":"2025-06-06 21:32:39.175+00","rating":5,"endorser":{"__typename":"Endorser","name":"Sara","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"bb67ca59-add1-45f3-886a-5a82f3691c31\"}":{"__typename":"MentorPublicProfile","uuid":"bb67ca59-add1-45f3-886a-5a82f3691c31","displayName":"Leo P.","slug":"leonard-pasquier-1","biography":"\u003cp\u003eWhat's up! My name is Leo Pasquier and I am a rising senior at Northwestern, pursuing a double major in Journalism and Political Science.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI consider myself a \"citizen of the world.\"\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in Monaco, with roots in East Africa, and now going to college in the US, I have been exposed to various environments. This has greatly influenced my perception of the world and help me develop my curiosity, which I try to reflect on in my studies. My majors have given me the freedom to study and research basically any topic I am interesting in. I’ve written essays ranging from how the 1934 World Cup was used as a propaganda tool by Mussolini, to articles on lake sediments and how they can help predict climate change.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA passion of mine is history, and I love getting lost in the Wikipedia pages of random events or historical figures. International relations and geopolitics is another interest of mine that I hope to help my mentees with. I have journalism experience and have had stories published in my school’s sports publications. As the Student manager for the Northwestern Men's Soccer Team, and interning at an international soccer agency, I can even help you with all your sports-related projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love traveling and learning about different cultures. I believe there are lessons to be learned no matter where in the world you may be. I hope to help cultivate the curiosity of my mentees and force them to always go deeper in their research and keep an open mind. This does not only apply to an academic context but also their everyday lives, and perhaps we can discover their new passion together. I want to help students take advantage of every opportunity they may face, no matter how daunting they may be, and use my international experience to help them understand the world beyond their bubble, as I did growing up.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI hope to make meaningful connections with all my mentees and cannot wait to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"soikdESjyuhOcHhalaJhcfuxfU5YmFjER4RuMqOAzEk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Journalism and Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e63f07e8-d681-4040-bc71-fd6f7c6d7041\"}"},{"__ref":"DeepDives:{\"uuid\":\"a1d6fc32-c466-47c8-a58c-8a6f801241f0\"}"},{"__ref":"DeepDives:{\"uuid\":\"bb8496d1-2ad4-4df6-9dd5-9df96cd47e39\"}"},{"__ref":"DeepDives:{\"uuid\":\"d2cc7023-a86d-4909-9aee-1045db7cb2ca\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c1267079-f3fe-4be4-9211-c4b4c306ad0b/-/preview/-/format/jpg/","https://ucarecdn.com/714b146d-3c5b-4fa5-a21e-bf29c2d404c0/-/preview/-/format/jpg/","https://ucarecdn.com/f5b55dbc-4072-4b7e-be99-0ae8b6aff8c7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"3893d723-d787-4d7e-9ecc-482f4d792df3\"}"},{"__ref":"Education:{\"uuid\":\"014bfe21-0b87-4a5c-a23d-eee7b94933c5\"}"}],"hiredAt":"2024-06-17T23:08:12.024Z","topics":["Writing","Spanish","French","Executive Function","College Essay Writing","Reading","History","Sports Journalism","History Project","Sports Analytics","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:70de517d-b740-4402-b8e3-49d714ed3949"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"leonard-pasquier-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bb67ca59-add1-45f3-886a-5a82f3691c31\"}"}}},"_sentryTraceData":"2bf79cae5c564fc5ad68e218c9efe558-969bbbf8077bb8be-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2bf79cae5c564fc5ad68e218c9efe558,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mento
