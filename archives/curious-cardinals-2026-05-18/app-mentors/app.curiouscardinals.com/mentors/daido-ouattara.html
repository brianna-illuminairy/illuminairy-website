xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f2169500-318e-417f-8646-86382b8d2f62\"}":{"__typename":"Favorites","uuid":"f2169500-318e-417f-8646-86382b8d2f62","photoUrl":"https://ucarecdn.com/ba839c5a-62f0-489d-b330-b95fc0029106/","title":"ANTI","type":"ALBUM"},"Favorites:{\"uuid\":\"cd70bc54-0a0e-4a7e-bec7-1558544223de\"}":{"__typename":"Favorites","uuid":"cd70bc54-0a0e-4a7e-bec7-1558544223de","photoUrl":"https://ucarecdn.com/77fc91f5-88c5-4ac4-aa96-9f0a963648bb/","title":"Rihanna","type":"ARTIST"},"Favorites:{\"uuid\":\"08f8b227-caa9-4dbc-af9e-aa383a332c71\"}":{"__typename":"Favorites","uuid":"08f8b227-caa9-4dbc-af9e-aa383a332c71","photoUrl":"https://ucarecdn.com/12e9fe75-f3cf-4e5f-bd40-3a4672d44466/","title":"Milk and Honey by Rupi Kaur","type":"BOOK"},"CausesSupported:{\"uuid\":\"9bed4143-f7e6-4ad9-a3ed-3a05226d754e\"}":{"__typename":"CausesSupported","uuid":"9bed4143-f7e6-4ad9-a3ed-3a05226d754e","name":"The Legacy Project Chapter at Brown","description":"\u003cp\u003eI help honor the stories of older adults by preserving their memories in writing\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4a6cafae-9249-4b04-841a-8542e7bfc241\"}":{"__typename":"DeepDives","uuid":"4a6cafae-9249-4b04-841a-8542e7bfc241","content":"\u003cp\u003eI would tell my younger self to trust her curiosity instead of rushing to have everything figured out. In middle and high school, I wanted so badly to grow up quickly and “get it right” that I didn’t always give myself the space to explore, make mistakes, or sit with uncertainty. I used to think that not knowing something was embarrassing — when really, it’s how you learn who you are and what interests you.\u003c/p\u003e\u003cp\u003eLooking back, I wish I had allowed myself to follow the little things that sparked my curiosity, even when they felt random or unexpected. Curiosity isn’t a distraction; it’s a guide. And the more you let yourself follow it, the more confident and grounded you become.\u003c/p\u003e\u003cp\u003eSo I’d tell my younger self: slow down a bit. Ask questions. Try things just because they interest you. You don’t need to have your entire future planned — you just need to notice what excites you and let that help you take the next step. Everything else will fall into place as you grow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"dba5153c-ceec-4fae-9130-31465a760ae2\"}":{"__typename":"DeepDives","uuid":"dba5153c-ceec-4fae-9130-31465a760ae2","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to open my own medical practice that includes a free clinic for individuals and families who often struggle to access affordable, trustworthy care.\u003c/p\u003e\u003cp\u003eMy dream is to build a practice where high-quality care and community coexist — a space where I can treat patients clinically while also offering free or low-cost services to anyone who needs them, no questions asked.\u003c/p\u003e\u003cp\u003eMore than anything, I want to create a place where people feel respected, seen ,understood, and cared for regardless of background or circumstance. Building that kind of clinic would be the most meaningful accomplishment of my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e4401288-fd76-4e44-a169-9f9782808d47\"}":{"__typename":"DeepDives","uuid":"e4401288-fd76-4e44-a169-9f9782808d47","content":"\u003cp\u003eMentorship matters to me because young people deserve to feel guided, not pressured — supported, not judged. I know how powerful it is to have someone help you make sense of your curiosity, your goals, and your questions. Being able to show a student that they’re capable, that they belong, and that their story matters is what keeps me committed to mentoring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"1d5e4e8f-0f4c-4d4f-87bf-98823efcf8ba\"}":{"__typename":"DeepDives","uuid":"1d5e4e8f-0f4c-4d4f-87bf-98823efcf8ba","content":"\u003cp\u003eI spent my summers volunteering in the emergency room at my local hospital. It was my first introduction to the fast-paced reality of healthcare, and it opened my eyes to how many different kinds of people rely on the ER — each with their own story, needs, and worries. Being in that environment taught me a lot about interpersonal skills, staying grounded under pressure, and offering compassionate care even in tense or unpredictable moments. Those experiences shaped my interest in medicine and helped me understand the kind of physician I want to become\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"c0e66e9d-172c-4870-9e27-38b378156db4\"}":{"__typename":"School","uuid":"c0e66e9d-172c-4870-9e27-38b378156db4","name":"The Stony Brook School","city":"Stony Brook","type":"HIGH","state":"New York","country":"United States","zip":"11790"},"Education:{\"uuid\":\"3a8a3882-a2b3-4c22-9677-6deee0d91310\"}":{"__typename":"Education","uuid":"3a8a3882-a2b3-4c22-9677-6deee0d91310","school":{"__ref":"School:{\"uuid\":\"c0e66e9d-172c-4870-9e27-38b378156db4\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"6ae6d886-5f90-4c63-80b0-2ae839ffdeb6\"}":{"__typename":"Education","uuid":"6ae6d886-5f90-4c63-80b0-2ae839ffdeb6","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Public Health and Health and Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"a20ab471-4ab2-46b7-bfba-27eaee651c5c\"}":{"__typename":"MentorPublicProfile","uuid":"a20ab471-4ab2-46b7-bfba-27eaee651c5c","displayName":"Daido O.","slug":"daido-ouattara","biography":"\u003cp\u003eMy name is Daïdo, and I’m a senior at Brown University studying Public Health and Health \u0026amp; Human Biology. I’ve always been drawn to understanding people — how they learn, how they build confidence, and how their environments shape their opportunities. That curiosity guides nearly everything I do and is a major reason I hope to become a physician one day. I’m passionate about the kind of care that comes from really seeing people, listening to their stories, and meeting them where they are.\u003c/p\u003e\u003cp\u003eA big part of my life at Brown revolves around storytelling and intergenerational connection. I serve as President of The Legacy Project, where students partner with older adults in assisted-living communities to document their life stories. These narratives are eventually published as books — a process that has taught me so much about listening, writing, and honoring someone’s lived experiences. It’s also something I genuinely hope my future mentee will get to read someday.\u003c/p\u003e\u003cp\u003eAcademically, I’m interested in the intersection of health, science, and social impact. I’ve worked on community-based research and health programs that allow me to support families, children, and older adults in meaningful ways. I’m also a Community Coordinator on campus, creating spaces where residents feel grounded, supported, and connected. Whether I’m running a wellness event or working through a research question, I care most about helping people feel seen and encouraged to grow.\u003c/p\u003e\u003cp\u003eAs a first-generation student, I understand how overwhelming academic pathways, planning, and major decisions can feel. Because of that, I’m especially passionate about helping students navigate college applications, personal statements, and long-term academic planning. I love taking the pieces that make someone unique — their experiences, their ideas, their personality — and helping them shape those pieces into a story that feels powerful, genuine, and unmistakably theirs.\u003c/p\u003e\u003cp\u003eMy mentoring style is calm and collaborative, rooted in meeting students exactly where they are. Whether someone is working through a tricky STEM concept, polishing an essay, or trying to build better study habits, I focus on making learning feel manageable and empowering. I want my students to walk away feeling capable, prepared, and proud of themselves.\u003c/p\u003e\u003cp\u003eOutside of academics, you can usually find me at the gym, journaling, reading, or planning community events. I’m someone who loves bringing people together, whether it’s in a classroom, a residence hall, or a mentorship session.\u003c/p\u003e\u003cp\u003eMost of all, I want my students to feel inspired — not just by what they’re learning, but by who they’re becoming.\u003c/p\u003e","teachingVideoPlaybackId":"aBFsHXiRhiEd02iib41wWwmFOafik4IG9vQApNOeMJRQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I'm most proud of is winning the QuestBridge National College Match Scholarship to Brown University. It wasn’t just an award — it represented years of working hard, balancing school with part-time jobs in retail, and navigating everything as a first-generation student without a clear roadmap. There were so many moments where the future felt uncertain, but I kept pushing because I really believed education could change my life. Being matched to Brown felt like the first time all of that effort, sacrifice, and perseverance finally came full circle. It still means so much to me, not just because of the opportunity it opened, but because it reminded me that where you start never limits where you can go.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f2169500-318e-417f-8646-86382b8d2f62\"}"},{"__ref":"Favorites:{\"uuid\":\"cd70bc54-0a0e-4a7e-bec7-1558544223de\"}"},{"__ref":"Favorites:{\"uuid\":\"08f8b227-caa9-4dbc-af9e-aa383a332c71\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"9bed4143-f7e6-4ad9-a3ed-3a05226d754e\"}"}],"major":"Public Health and Health and Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4a6cafae-9249-4b04-841a-8542e7bfc241\"}"},{"__ref":"DeepDives:{\"uuid\":\"dba5153c-ceec-4fae-9130-31465a760ae2\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4401288-fd76-4e44-a169-9f9782808d47\"}"},{"__ref":"DeepDives:{\"uuid\":\"1d5e4e8f-0f4c-4d4f-87bf-98823efcf8ba\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3eebd1df-8057-44c0-bd39-0f93ca293f6c/-/preview/-/format/jpg/","https://ucarecdn.com/6cf24c9c-a12c-4c54-8280-6cafb22f02b3/-/preview/-/format/jpg/","https://ucarecdn.com/ef804284-6dfa-4cca-984d-bfe1c5c6f16a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3a8a3882-a2b3-4c22-9677-6deee0d91310\"}"},{"__ref":"Education:{\"uuid\":\"6ae6d886-5f90-4c63-80b0-2ae839ffdeb6\"}"}],"hiredAt":"2025-11-21T19:31:57.957Z","topics":["K-6 Storybook","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"daido-ouattara\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a20ab471-4ab2-46b7-bfba-27eaee651c5c\"}"}}},"_sentryTraceData":"fc8f8c2ce7d543c08b6ce3a6bf22a3dd-84e75884bdabfb15-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=fc8f8c2ce7d543c08b6ce3a6bf22a3dd,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"daido-ouattara"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
