xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"79f51113-ec51-4dee-88c4-6f3875090c05\"}":{"__typename":"Favorites","uuid":"79f51113-ec51-4dee-88c4-6f3875090c05","photoUrl":"https://ucarecdn.com/c80d2b8a-efc2-4f9b-bf44-8268d7464cc3/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"5e0eb1ca-52f7-46a8-939d-4dd7203cf506\"}":{"__typename":"Favorites","uuid":"5e0eb1ca-52f7-46a8-939d-4dd7203cf506","photoUrl":"https://ucarecdn.com/b399fb6f-bc0c-4b2c-bd0f-dbc5a09e8110/","title":"Soccer!","type":"SPORT"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"9826d98f-e99f-46cb-8c0c-d9985b6c12cf\"}":{"__typename":"DeepDives","uuid":"9826d98f-e99f-46cb-8c0c-d9985b6c12cf","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is finishing an Ironman. I love challenges, and training for something that pushes both physical and mental limits feels like a really meaningful goal!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"42a69fc0-04ec-491e-b7a4-a5ec1ef72312\"}":{"__typename":"DeepDives","uuid":"42a69fc0-04ec-491e-b7a4-a5ec1ef72312","content":"\u003cp\u003eAs a kid, I always said I wanted the job where I could make cyborgs and gain superpowers. As I got older, that curiosity and desire developed into a strong interest in bridging both engineering and biology to help people live healthier, quality lives. Now I’m excited to apply biomedical engineering to develop technologies that can improve how we diagnose, research, and care for patients.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0e7624e1-2f1f-41e9-9a36-42c02437ff71\"}":{"__typename":"DeepDives","uuid":"0e7624e1-2f1f-41e9-9a36-42c02437ff71","content":"\u003cp\u003eMentorship matters to me because learning from people who have already navigated the path you’re on can accelerate both personal and professional growth. Their perspective and encouragement can make a huge difference when tackling new challenges.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b0fa7eea-3033-48f8-8705-5775a0a9f8b4\"}":{"__typename":"DeepDives","uuid":"b0fa7eea-3033-48f8-8705-5775a0a9f8b4","content":"\u003cblockquote\u003e\u003cp\u003eI would tell my younger self that it’s okay to worry, but go for it anyway! You don’t have to have everything figured out to move forward. Try more things, ask more questions, and don’t be afraid to take on challenges that feel intimidating. A lot of the best opportunities come from simply being curious and willing to try.\u003c/p\u003e\u003c/blockquote\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"ead0cf2e-686d-49b4-8078-bad3d8858616\"}":{"__typename":"School","uuid":"ead0cf2e-686d-49b4-8078-bad3d8858616","name":"Palos Verdes Peninsula High School","city":"Rolling Hills Estates","type":"HIGH","state":"California","country":"United States","zip":"90274"},"Education:{\"uuid\":\"5e6ef537-4d12-4ce8-98b1-d1a04174ab9c\"}":{"__typename":"Education","uuid":"5e6ef537-4d12-4ce8-98b1-d1a04174ab9c","school":{"__ref":"School:{\"uuid\":\"ead0cf2e-686d-49b4-8078-bad3d8858616\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"9dd2e3cf-31c6-4f9b-8457-4d302c6add47\"}":{"__typename":"Education","uuid":"9dd2e3cf-31c6-4f9b-8457-4d302c6add47","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2026","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"6c553cd0-daee-44c9-81cc-e64de3ed9b0d\"}":{"__typename":"MentorPublicProfile","uuid":"6c553cd0-daee-44c9-81cc-e64de3ed9b0d","displayName":"Ethan S.","slug":"ethan-shen","biography":"\u003cp\u003eHi! My name is Ethan, and I am a biomedical engineering master’s student at Columbia University. I have always been fascinated by the intersection of engineering and medicine, particularly in how technology can help us better understand the human body and improve healthcare.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my studies, I’ve had the chance to work on several hands-on engineering and research projects. One project involved creating 3D visualizations and physical reconstructions of structures within human skin so researchers can better understand how sebaceous glands are organized and function. This type of work helps researchers studying acne by giving them a clearer picture of how these glands behave in three dimensions. I have also worked on research exploring polymer-based delivery systems that are designed to release medicine in more controlled and targeted ways.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve also worked on building a hemodynamic flow loop, which is a physical system designed to mimic how blood flows through the human vascular system. Systems like these allow researchers to study fluid flow under conditions similar to the body and test ideas for cardiovascular technologies. In addition, I’ve designed and built custom fixtures used to mechanically test biological tissues, which involves creating setups that allow researchers to measure how tissues stretch, compress, or respond to different forces.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAside from biomedical-specific projects, I enjoy exploring different types of engineering challenges. For example, I worked on a mechanical design project where we built a robotic crane system for a class competition. Projects like that require thinking about motion, balance, and control, and I enjoy the process of turning an idea into something that physically works.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I like spending time doing things that are both creative and active. I enjoy ceramics because it lets me step away from technical work and using creativity to build something with my hands. I also love staying active through sports and exercise, whether that means playing soccer, lifting weights, or going for runs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I hope to help students explore their curiosity and feel more confident tackling new ideas. Some of the most meaningful learning happens when you ask questions, experiment, and connect what you’re learning to the real world. My goal is to create a supportive environment where students feel comfortable exploring their interests and discovering what excites them!\u003c/p\u003e","teachingVideoPlaybackId":"agXGWQ51zwnqx00AEekhCIGANF16ka9xdme1dyKlIrSw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"79f51113-ec51-4dee-88c4-6f3875090c05\"}"},{"__ref":"Favorites:{\"uuid\":\"5e0eb1ca-52f7-46a8-939d-4dd7203cf506\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9826d98f-e99f-46cb-8c0c-d9985b6c12cf\"}"},{"__ref":"DeepDives:{\"uuid\":\"42a69fc0-04ec-491e-b7a4-a5ec1ef72312\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e7624e1-2f1f-41e9-9a36-42c02437ff71\"}"},{"__ref":"DeepDives:{\"uuid\":\"b0fa7eea-3033-48f8-8705-5775a0a9f8b4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e5fdcd5f-30ad-483c-ba00-9e65317f23ec/-/preview/-/format/jpg/","https://ucarecdn.com/46617a9a-5b07-4d59-8eb1-55c6d5aacf50/-/preview/-/format/jpg/","https://ucarecdn.com/9cee883d-f7f3-4c66-b50f-ca03af50b9a4/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5e6ef537-4d12-4ce8-98b1-d1a04174ab9c\"}"},{"__ref":"Education:{\"uuid\":\"9dd2e3cf-31c6-4f9b-8457-4d302c6add47\"}"}],"hiredAt":"2026-03-01T14:57:48.547Z","topics":["Algebra II","Algebra I","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","College Essay Writing","Reading","Academic Coaching","Executive Function","Music","Film / Theater","Business / Entrepreneurship","Robotics / Electronics / CAD","Medicine / Health","STEM Project","Machine Learning / AI","Sustainability"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/6fbd7257-e9de-4421-8a0b-bde4a854891b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ethan-shen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6c553cd0-daee-44c9-81cc-e64de3ed9b0d\"}"}}},"_sentryTraceData":"2ae6ebbae6cf43f
