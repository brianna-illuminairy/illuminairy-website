xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"89a4aa95-d43b-433c-8ccc-6af1ce4f2901\"}":{"__typename":"DeepDives","uuid":"89a4aa95-d43b-433c-8ccc-6af1ce4f2901","content":"\u003cp\u003eMake sure to keep pursuing what makes you happy and what keeps you engaged!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fadf322d-aa01-49e3-9d85-a7528a1afe8e\"}":{"__typename":"DeepDives","uuid":"fadf322d-aa01-49e3-9d85-a7528a1afe8e","content":"\u003cp\u003eEver since I was little, I had to know how things worked. I took apart electronics, toys, and appliances to know how they worked. Between doing this, and building things, I knew I wanted to be a mechanical engineer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"848958eb-5363-452b-a701-baabf8babf17\"}":{"__typename":"DeepDives","uuid":"848958eb-5363-452b-a701-baabf8babf17","content":"\u003cp\u003eI have such a strong passion for learning and there is no better feeling than seeing someone else have that same feeling and giving them the support and reassurance to continue their passion.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a5cc002d-c1e7-4527-ade2-35d804c4067b\"}":{"__typename":"DeepDives","uuid":"a5cc002d-c1e7-4527-ade2-35d804c4067b","content":"\u003cp\u003eI need to visit all 63 of the United States National Parks.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"4de95a11-5413-422e-9897-f143a5b28a6d\"}":{"__typename":"School","uuid":"4de95a11-5413-422e-9897-f143a5b28a6d","name":"John A. Ferguson Senior High School.","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33185"},"Education:{\"uuid\":\"223ad190-e4a9-4b71-b2a4-03350f331250\"}":{"__typename":"Education","uuid":"223ad190-e4a9-4b71-b2a4-03350f331250","school":{"__ref":"School:{\"uuid\":\"4de95a11-5413-422e-9897-f143a5b28a6d\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}":{"__typename":"School","uuid":"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a","name":"Massachusetts Institute of Technology","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02139"},"Education:{\"uuid\":\"77fa24bb-446b-4846-a073-e2d787f1f857\"}":{"__typename":"Education","uuid":"77fa24bb-446b-4846-a073-e2d787f1f857","school":{"__ref":"School:{\"uuid\":\"d28fa8d6-84ea-4b21-bb45-34e1c0b9025a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"1685087d-bc96-46c0-94b3-fe22ecaf5432\"}":{"__typename":"MentorPublicProfile","uuid":"1685087d-bc96-46c0-94b3-fe22ecaf5432","displayName":"Sebastian D.","slug":"sebastian-dejesus","biography":"\u003cp\u003eMy name is Sebastian De Jesus, and I am a 22-year-old master’s student in Mechanical Engineering. I was born in Manhattan and moved to Miami, Florida when I was 3 years old. I have an older brother and younger sister and grew up around a big rowdy family, so my outgoing personality was able to thrive. I make sure to keep in touch with my parents, siblings, aunts and uncles, cousins, and grandparents no matter how far away I am. I had my first spark of engineering in 5th grade when I started building circuits. This spark really made my curiosity take off and I had to know how things worked. In middle school and high school, I pursued my love for engineering and problem solving through clubs at school. I joined, competed, and had leadership positions in math honors society, science honors society, physics club, technology student association (robotics), Family Career and Community Leaders of America, badminton, and chess club. I even started a robotics club for the after-school care kids at my local elementary school! Outside of school I was in the Miami children’s chorus and would volunteer at my elementary school’s chorus/theater club. With these clubs I was able to travel around the country and the world to places like Orlando, Atlanta, California, and Australia. A typical weekend would be spent at a competition with friends, a chorus concert, or experimenting and building things at home. My passion and creativity took to MIT where I earned my Bachelor of Science in Mechanical Engineering. At MIT I very involved in maker spaces and machine shops and was a teaching assistant in ‘Physics I and II’, and a lab assistant for ‘Electronics for Mechanical Systems’ and ‘Design and Manufacturing II’. I also participated in research in mechanical design and worked at General Motors for a summer. Outside of academics I was in the Zeta Psi fraternity, Resonance of MIT acapella group, and Camp Kesem. Throughout college I became interested in climbing, running, hiking, working out, and traveling. As a very extroverted, passionate, focused, and well-rounded student who has 2 teachers as parents, I have an appreciation for learning and education that I try to pass on to all my mentees. Post graduation I took the 6-week road trip of my dreams and drove across the country from Virginia to California and back to hike and camp in 24 National Parks. I am now studying at Georgia Tech to complete my Master of Science degree in Mechanical Engineering. Today I spend my time outside of school running and working out, playing badminton, and playing board games with my friends.\u003c/p\u003e","teachingVideoPlaybackId":"gXIkCinUGqjCzvzxDVlMMgZhVabjFH02dcHe1NUuZ1ss","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"89a4aa95-d43b-433c-8ccc-6af1ce4f2901\"}"},{"__ref":"DeepDives:{\"uuid\":\"fadf322d-aa01-49e3-9d85-a7528a1afe8e\"}"},{"__ref":"DeepDives:{\"uuid\":\"848958eb-5363-452b-a701-baabf8babf17\"}"},{"__ref":"DeepDives:{\"uuid\":\"a5cc002d-c1e7-4527-ade2-35d804c4067b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/46720590-1bfd-4f01-9c05-3c82e203ccb8/-/preview/-/format/jpg/","https://ucarecdn.com/19ea32e9-79ba-4629-9dab-6cd6bf79b604/-/preview/-/format/jpg/","https://ucarecdn.com/7be6dfa2-8928-46e5-945b-13b7089b46aa/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"223ad190-e4a9-4b71-b2a4-03350f331250\"}"},{"__ref":"Education:{\"uuid\":\"77fa24bb-446b-4846-a073-e2d787f1f857\"}"}],"hiredAt":"2025-09-23T15:45:04.017Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Chemistry","Physics","Academic Coaching","Executive Function","Robotics / Electronics / CAD","
