xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4dfc5b6b-b8cb-481b-90a8-479776633048\"}":{"__typename":"Favorites","uuid":"4dfc5b6b-b8cb-481b-90a8-479776633048","photoUrl":"https://ucarecdn.com/56c4a9d7-8dbf-4589-a4c3-8f1667743580/","title":"Rugby","type":"SPORT"},"Favorites:{\"uuid\":\"021ecccd-4251-47d3-8e8b-b9e416b12395\"}":{"__typename":"Favorites","uuid":"021ecccd-4251-47d3-8e8b-b9e416b12395","photoUrl":"https://ucarecdn.com/cc41d0e4-04f3-46f2-a74a-074ca8527fa9/","title":"BOSTON!!!","type":"CITY"},"Favorites:{\"uuid\":\"da211a50-4503-4449-b218-8d7a683c8b35\"}":{"__typename":"Favorites","uuid":"da211a50-4503-4449-b218-8d7a683c8b35","photoUrl":"https://ucarecdn.com/095fede3-2661-460c-883d-4a554e49088c/","title":"Mt. Joy","type":"ALBUM"},"CausesSupported:{\"uuid\":\"726ec0ab-f1e8-4fe5-94fb-86499141f7ea\"}":{"__typename":"CausesSupported","uuid":"726ec0ab-f1e8-4fe5-94fb-86499141f7ea","name":"Period Equity","description":"\u003cp\u003ePeriod equity empowers education, dignity, \u0026amp; opportunity for all who menstruate.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/635ee8b8-05d7-4783-8dfe-ef8fa0380ede/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e3bfdf7d-6f17-4f7b-bf9f-9e50b5807c99\"}":{"__typename":"DeepDives","uuid":"e3bfdf7d-6f17-4f7b-bf9f-9e50b5807c99","content":"\u003cp\u003eIn my spare time, I love cooking—especially Brazilian food and trying out dishes from different cultures. Exploring new flavors is one of my favorite ways to learn about the world. I also really enjoy traveling, visiting museums, and diving into different cultures through art, history, and food.\u003c/p\u003e\u003cp\u003eI’m a pretty active person, both mentally and physically. Whether it’s hiking, biking, or going for a run, I love being outdoors—especially in New England when the seasons are changing. There’s something really energizing about being in nature and moving your body.\u003c/p\u003e\u003cp\u003eI also have a deep love for sports. I grew up playing soccer and still enjoy playing recreationally, and I’m a huge fan of Boston sports—catching a Celtics, Red Sox, or Bruins game always makes my day. Whether I’m on the move or soaking in a good game, I’m happiest when I’m staying active and engaged with the world around me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a8f55625-b9e8-4bd3-9a4b-f3190df4892d\"}":{"__typename":"DeepDives","uuid":"a8f55625-b9e8-4bd3-9a4b-f3190df4892d","content":"\u003cp\u003eI’d tell my younger self to keep looking at the big picture—and not to be afraid of asking \u003cem\u003ewhy\u003c/em\u003e. Stay curious, even when it feels easier to just go with the flow. Keep questioning the information you’re given, not to be difficult, but to understand the deeper motivations behind it. The people who grow into lifelong learners are the ones who don’t settle for surface-level answers—they dig, they reflect, and they ask again.\u003c/p\u003e\u003cp\u003eI’d remind myself that curiosity is a strength, not a distraction. If something keeps tugging at your mind, don’t let it go—follow it. That hunger to understand the “why” behind things will lead you to your most meaningful work. Keep trusting that instinct, and don’t be afraid to learn outside the lines.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"53b63336-b2d3-4626-bdc9-7f6ce2ce1df2\"}":{"__typename":"DeepDives","uuid":"53b63336-b2d3-4626-bdc9-7f6ce2ce1df2","content":"\u003cp\u003eMentorship matters to me because I’ve seen firsthand how powerful it can be in helping someone realize their own potential. I want to help students grow their confidence—not just in a subject, but in their ability to solve any problem they’re faced with. Resilience isn’t something you’re born with; it’s something you build through challenges, support, and consistent encouragement. That process often starts in the classroom or with a passion project, and I believe mentors can play a key role in showing students that they \u003cem\u003ecan\u003c/em\u003e do hard things.\u003c/p\u003e\u003cp\u003eI know what it feels like to doubt yourself. I was once that kid who wasn’t sure if I had what it took to figure things out on my own. It was through the guidance and belief of mentors that I started to believe in myself—and I carry that experience with me into every session I lead. As a mentor, I want to be the person who helps light that spark in others and reminds them that they are more capable than they think.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"25f879ed-e510-45ab-a2dc-9da6dbce16ca\"}":{"__typename":"DeepDives","uuid":"25f879ed-e510-45ab-a2dc-9da6dbce16ca","content":"\u003cp\u003eAs a high school student, I was driven— especially as a first-generation college student with big goals. I was focused, organized, and always curious, with a strong determination to attend a top college and make the most of every opportunity. I balanced a lot: I led two affinity groups, captained two varsity sports by senior year (while playing three year-round), and served as student body co-president, working with a team of six to support and represent our student community. I was also passionate about visual arts, which gave me a creative outlet alongside my academic and leadership commitments.\u003c/p\u003e\u003cp\u003eDespite my busy schedule, I always prioritized my family and my faith. They grounded me and gave me a sense of purpose in everything I did. Looking back, what made it all possible was the incredible support system I had—teachers, mentors, and loved ones who encouraged me to push forward and believe in myself. That foundation shaped who I am today and why I’m so passionate about helping others reach their potential too.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"209ce08e-75c3-4790-a2e3-6d5a5a977627\"}":{"__typename":"School","uuid":"209ce08e-75c3-4790-a2e3-6d5a5a977627","name":"St. Mark's School of Southborough","city":"Southborough","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01772"},"Education:{\"uuid\":\"6ef73e6d-9288-4aa1-b61d-e49ac07596ab\"}":{"__typename":"Education","uuid":"6ef73e6d-9288-4aa1-b61d-e49ac07596ab","school":{"__ref":"School:{\"uuid\":\"209ce08e-75c3-4790-a2e3-6d5a5a977627\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"a8b36934-9e7b-407f-b286-56fcc6d0000a\"}":{"__typename":"Education","uuid":"a8b36934-9e7b-407f-b286-56fcc6d0000a","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biology ","degree":null},"MentorPublicProfile:{\"uuid\":\"1d5e754e-4e9b-4a51-8653-cbacf0efd99d\"}":{"__typename":"MentorPublicProfile","uuid":"1d5e754e-4e9b-4a51-8653-cbacf0efd99d","displayName":"Laryssa B.","slug":"laryssa-barbosa","biography":"\u003cp\u003eHey there! I’m a student at Brown University, studying Biology and Entrepreneurship. I’ve always been curious—about how things work, how we learn, and how we can use knowledge to create real change. That love for learning is something I bring into every session, because I believe education should feel empowering, not overwhelming. Helping others discover that spark of understanding is one of the most rewarding parts of what I do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic interests sit at the intersection of science, business, and the environment. I’m especially drawn to exploring how large-scale systems—like corporations and industries—impact our ecosystems, and how we can make better, more sustainable decisions at both the cellular and societal levels. I’m excited by big questions and love helping students find the deeper meaning behind the material they’re studying, whether it’s biology, environmental science, or even the logic behind a tough math concept.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I’m a varsity rugby player for Brown. I’ve learned so much through sports—discipline, teamwork, leadership—and those lessons carry over into how I teach and mentor. I recently had the honor of captaining the first-ever USA National Collegiate Rugby team during an international tournament in Portugal, where we finished second overall. That experience pushed me to grow under pressure and taught me how to support a team through both challenges and victories.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I’m also involved in clubs like the Sustainable Business Society and Athletes in Action, a faith-based community for student-athletes. These groups have helped me stay grounded, inspired, and connected to causes I care about. Whether it’s conversations about social impact or late-night problem sets with friends, I genuinely enjoy being part of a learning community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I care deeply about meeting students where they are. I know that school isn’t always easy—and that sometimes, all it takes is a fresh explanation, a bit of patience, or someone in your corner to make all the difference. My approach is all about building confidence and curiosity, making sure you not only get the right answers but actually understand the \"why\" behind them.  I know from experience that learning isn’t always easy, but it \u003cem\u003ecan\u003c/em\u003e be meaningful—and even enjoyable—with the right support. \u003c/p\u003e\u003cp\u003eWhether you need help with tricky material, want to build stronger study habits, or just need someone to keep you on track and motivated, I’m here for it—and for you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m really looking forward to getting to know you and helping you reach your goals!\u003c/p\u003e","teachingVideoPlaybackId":"D026o2HfXBWadB1MTwIvxDT3H9Sx00pZC2F72uy3gUraY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4dfc5b6b-b8cb-481b-90a8-479776633048\"}"},{"__ref":"Favorites:{\"uuid\":\"021ecccd-4251-47d3-8e8b-b9e416b12395\"}"},{"__ref":"Favorites:{\"uuid\":\"da211a50-4503-4449-b218-8d7a683c8b35\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"726ec0ab-f1e8-4fe5-94fb-86499141f7ea\"}"}],"major":"Biology ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e3bfdf7d-6f17-4f7b-bf9f-9e50b5807c99\"}"},{"__ref":"DeepDives:{\"uuid\":\"a8f55625-b9e8-4bd3-9a4b-f3190df4892d\"}"},{"__ref":"DeepDives:{\"uuid\":\"53b63336-b2d3-4626-bdc
