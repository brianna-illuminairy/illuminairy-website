xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"262927f3-3ec5-480f-9f14-54ab619c2e44\"}":{"__typename":"DeepDives","uuid":"262927f3-3ec5-480f-9f14-54ab619c2e44","content":"\u003cp\u003eGrowing up, I could never decide on what I wanted to do - my dream job changed every day with each opportunity and experience I had! When I found the Huntsman Program at Penn, which would allow me to not just individually study these disciplines but take a true, interdisciplinary approach to my academics, I knew it was the perfect fit for someone like me who didn’t want to choose just one path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"af083826-e07b-4a6f-af08-796c7e26b624\"}":{"__typename":"DeepDives","uuid":"af083826-e07b-4a6f-af08-796c7e26b624","content":"\u003cp\u003eI spent my summers doing any and everything I could get my hands on! For me, balance was key - whether it was working at a local clothing boutique, studying Arabic online through a state-department scholarship, taking dance classes, or hanging with my friends, I loved getting to explore every aspect of my interests at any time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"eefcdbb6-94d3-49e5-8595-5acc8e151c7a\"}":{"__typename":"DeepDives","uuid":"eefcdbb6-94d3-49e5-8595-5acc8e151c7a","content":"\u003cp\u003eI would tell my middle or high school self to chill out! I was always so eager to keep pushing forward, whether in academics, extracurriculars, or my own personal projects that sometimes I would (unnecessarily) stress myself out. While motivation is important, so is balance!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"79b087aa-0bc2-4dd1-8645-272b08729523\"}":{"__typename":"DeepDives","uuid":"79b087aa-0bc2-4dd1-8645-272b08729523","content":"\u003cp\u003eMy greatest role models and mentors are my parents. Though it may sound cliché, they taught me how to cut through the noise growing up and focus on what truly matters - doing what I love, being good and kind to people, and working hard. Whenever I feel overwhelmed or lost, these are the values I come back to!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"6ce18e0b-66e2-4e9a-823d-b5ac8d851b4a\"}":{"__typename":"Education","uuid":"6ce18e0b-66e2-4e9a-823d-b5ac8d851b4a","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"7dadee02-5855-4543-bf48-0d7d69842cce\"}":{"__typename":"Education","uuid":"7dadee02-5855-4543-bf48-0d7d69842cce","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Business (Finance, Marketing) \u0026 International Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"69a788fb-da59-49e3-938d-5bb98832e509\"}":{"__typename":"MentorPublicProfile","uuid":"69a788fb-da59-49e3-938d-5bb98832e509","displayName":"Cory P.","slug":"cory-porter-1","biography":"\u003cp\u003eHi! I’m Cory, a senior in the Huntsman Program at the University of Pennsylvania. Here, I am dual enrolled in the Wharton School and College of Arts and Sciences, where I study Business (with concentrations in Finance and Marketing), International Studies, and French. As someone who has been able to explore many interests, both academically, extracurricularly, and professionally, I’m passionate about helping students create similarly expansive opportunities for exploration and self-discovery.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eA bit about me\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eMy involvements on campus and beyond have led me to:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePursue internships in marketing at both PepsiCo and Kosas Cosmetics, where I worked on brand strategy, consumer insights, and storytelling at the intersection of business and culture\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOrganize and lead the Ivy League Model United Nations Conference, a nationally recognized high school Model UN conference serving over 2,000 students across the East Coast and internationally\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTake on leadership roles across student organizations (President of the Kappa Alpha Theta Sorority and Sparks Dance Co. member) focused on mentorship, community building, and large-scale event planning\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eHow I can help you\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI love helping students turn their interests into concrete projects that build confidence, direction, and a strong sense of ownership over their path. Some ways I can help you!\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCollege readiness projects such as leadership initiatives, internships and resumes, research presentations, and narrative building for applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExecutive functioning and study skills including time management, organization systems, goal-setting, and accountability to help students follow through on projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePassion projects including content creation, community initiatives, clubs, or independent projects aligned with a student’s interests\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAcademic support in history, English, and French, as well as structured guidance in mathematics and analytical thinking\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough my academic work and leadership at Penn, I’ve learned how to balance interests with discipline and turn both my passions and help mentor others to create focused projects, applications, and leadership initiatives. I can help students move from ideas to execution with clarity and confidence.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eA session with me may involve:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming meaningful project or leadership ideas tied to interests and goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a clear, week-by-week plan for steady progress\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelping students identify the organization, time management, and study strategies that work best for them\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eRefining application materials such as essays, resumes, and project narratives\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down complex ideas into clear, actionable steps\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eOutside of academics, I love any and everything active! Having grown up as an avid dancer and skier, I still love to participate in these activities whenever possible and also\u0026nbsp; greatly enjoy running and hiking.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m excited to meet and work with you!\u003c/p\u003e","teachingVideoPlaybackId":"mBg73RFY4x8d2nno33JrPetXUipY00uhjqQkHxOYdgBY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business (Finance, Marketing) \u0026 International Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"262927f3-3ec5-480f-9f14-54ab619c2e44\"}"},{"__ref":"DeepDives:{\"uuid\":\"af083826-e07b-4a6f-af08-796c7e26b624\"}"},{"__ref":"DeepDives:{\"uuid\":\"eefcdbb6-94d3-49e5-8595-5acc8e151c7a\"}"},{"__ref":"DeepDives:{\"uuid\":\"79b087aa-0bc2-4dd1-8645-272b08729523\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/25f363b3-67c7-4bdd-87eb-d146389daf43/-/preview/-/format/jpg/","https://ucarecdn.com/efdb8dc0-0ecb-4
