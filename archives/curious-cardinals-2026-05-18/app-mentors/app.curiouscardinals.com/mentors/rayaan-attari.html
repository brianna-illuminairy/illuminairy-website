xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f48bba07-b437-46b4-86d0-343d27e48ceb\"}":{"__typename":"Favorites","uuid":"f48bba07-b437-46b4-86d0-343d27e48ceb","photoUrl":"https://ucarecdn.com/e2050ed6-73df-4416-9548-6a650ee1d648/","title":"Manchester United","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"c2037d29-b9d1-463e-b263-b48c58900e66\"}":{"__typename":"Favorites","uuid":"c2037d29-b9d1-463e-b263-b48c58900e66","photoUrl":"https://ucarecdn.com/68e867a7-35bb-4482-8ad1-a85323af3ad4/","title":"Dresden, Germany","type":"CITY"},"CausesSupported:{\"uuid\":\"cced4216-b3a6-409a-96aa-527e34c3ef60\"}":{"__typename":"CausesSupported","uuid":"cced4216-b3a6-409a-96aa-527e34c3ef60","name":"Down to Earth (DTE)","description":"\u003cp\u003eAssisted in the teaching and development of children in English and Math.\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"fff46382-c5d8-4c75-a8fa-f68274b3bd9f\"}":{"__typename":"CausesSupported","uuid":"fff46382-c5d8-4c75-a8fa-f68274b3bd9f","name":"Child Rights and You (CRY)","description":"\u003cp\u003eEngaged in advocacy and programs promoting children's rights and welfare.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"28ce3449-5f27-4cad-928b-909d971c0077\"}":{"__typename":"DeepDives","uuid":"28ce3449-5f27-4cad-928b-909d971c0077","content":"\u003cp\u003eIn middle and high school, I was curious, ambitious, and honestly a little all over the place. I loved learning how things worked and would dive deep into topics that caught my attention, especially computers and math, but I also remember feeling stuck or intimidated when something didn’t make sense right away. Over time I learned how to ask better questions, break big problems into smaller ones, and stay patient with myself. That shift in how I approached learning ended up being just as important as anything I studied.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4eba9aba-64bf-426b-941f-966e28363b59\"}":{"__typename":"DeepDives","uuid":"4eba9aba-64bf-426b-941f-966e28363b59","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is building technology that genuinely changes how people experience difficult moments in their lives. Working on healthcare systems showed me how the right tools can reduce stress for clinicians and give patients better, faster care, and that stuck with me. I want to create products that are not just impressive technically but are trusted, used every day, and make someone’s job or life meaningfully easier. If I can point to something years from now and say, people depended on this and it helped them, I would feel proud of that.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"d5227475-b0e7-4936-83b2-440ebdfad2a4\"}":{"__typename":"DeepDives","uuid":"d5227475-b0e7-4936-83b2-440ebdfad2a4","content":"\u003cp\u003eOut of everything I could spend my time on, mentorship is the one that feels the most lasting. Building products is exciting, but helping someone grow their confidence and skills changes how they approach challenges long after a project ends. I’ve worked with a lot of students, and I love the moment when they start thinking independently and surprising themselves with what they can figure out. Being part of that shift is incredibly rewarding, and it keeps me coming back.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"023cf28a-5cb4-40fa-ad06-29de90a2701f\"}":{"__typename":"School","uuid":"023cf28a-5cb4-40fa-ad06-29de90a2701f","name":"Grinnell College","city":"Grinnell","type":"HIGH","state":"Iowa","country":"United States","zip":"50112"},"Education:{\"uuid\":\"9bcabec4-1235-46cf-b190-a3eecc3c6de6\"}":{"__typename":"Education","uuid":"9bcabec4-1235-46cf-b190-a3eecc3c6de6","school":{"__ref":"School:{\"uuid\":\"023cf28a-5cb4-40fa-ad06-29de90a2701f\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"ea6bbce2-d57e-4204-a097-76674228a7b4\"}":{"__typename":"Education","uuid":"ea6bbce2-d57e-4204-a097-76674228a7b4","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2025","major":"Computer Science, AI/ML","degree":null},"MentorPublicProfile:{\"uuid\":\"b8c59777-93a1-4087-988e-b050eaba2d12\"}":{"__typename":"MentorPublicProfile","uuid":"b8c59777-93a1-4087-988e-b050eaba2d12","displayName":"Rayaan A.","slug":"rayaan-attari","biography":"\u003cp\u003eHi, I’m Rayaan. I am a software and machine learning engineer who loves helping students build the confidence to tackle hard problems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI studied Computer Science and Mathematics at Columbia where I focused on machine learning and robotics. Since graduating, I have worked in both industry and research. I’ve built software for healthcare systems and developed AI that makes decisions using messy, incomplete data. A big part of my job has been turning ambiguity into clear steps forward, and I bring that same mindset to teaching. I love taking complex, intimidating ideas and breaking them down until they finally click.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTeaching has always run parallel to my engineering work. I have mentored hundreds of students in programming and math, from beginners writing their first lines of code to advanced undergraduates preparing for technical interviews. I have worked with students who feel ahead, students who feel behind, and students who are not sure where they stand yet. This experience taught me how to adjust quickly to different learning styles and personalities. I make sure students feel safe asking “basic” questions because that is usually where the real learning happens.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy sessions are hands-on and conversation-driven. I ask students to talk through their logic, make predictions, and try an approach before we refine it together. If we get stuck, we do not panic. We slow down, find the exact step where it stopped making sense, and rebuild from there. Sometimes that means reviewing fundamentals. Sometimes it means practicing how to read a problem more carefully. Either way, the goal is steady progress. I want students to leave knowing not just what to do, but why it works, and to feel more independent the next time they face something unfamiliar.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also try to share how these skills show up in the real world. Writing clean code, thinking clearly, and being comfortable with uncertainty are things I use every day as an engineer. Students often find it motivating to see how the material connects to actual systems people rely on.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I am not debugging code, I am usually outside. As you can see from my profile pictures, I love hiking and being in nature. Those shots are from the peaks of Acadia and Shenandoah National Parks. I find that climbing a mountain and solving a math problem are pretty similar. You find your footing, take it one step at a time, and keep going even when it feels steep.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am excited to meet you and hear what you want to build.\u003c/p\u003e","teachingVideoPlaybackId":"WmfSwks001zmaLsmNELEYXZM95YJvJ02274eEYJl7BAL8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI’m really proud of winning a scholarship in high school to study German in Germany for three months. It was my first time traveling alone, and I loved immersing myself in a new culture, meeting people from all over, and pushing myself to learn a language in a completely new environment. By the end of the program, I completed the B1-level German exam, and the experience inspired me to continue studying even more advanced German in college. That trip taught me a lot about curiosity, adaptability, and the confidence that comes from stepping out of your comfort zone.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f48bba07-b437-46b4-86d0-343d27e48ceb\"}"},{"__ref":"Favorites:{\"uuid\":\"c2037d29-b9d1-463e-b263-b48c58900e66\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"cced4216-b3a6-409a-96aa-527e34c3ef60\"}"},{"__ref":"CausesSupported:{\"uuid\":\"fff46382-c5d8-4c75-a8fa-f68274b3bd9f\"}"}],"major":"Computer Science, AI/ML","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"28ce3449-5f27-4cad-928b-909d971c0077\"}"},{"__ref":"DeepDives:{\"uuid\":\"4eba9aba-64bf-426b-941f-966e28363b59\"}"},{"__ref":"DeepDives:{\"uuid\":\"d5227475-b0e7-4936-83b2-440ebdfad2a4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/77620832-09c5-4e58-9d60-739c6d517bf2/-/preview/-/format/jpg/","https://ucarecdn.com/512c9709-52ea-49c7-8996-4753bda2dab1/-/preview/-/format/jpg/","https://ucarecdn.com/ab9a6663-88bd-4426-ab0a-1c093d783bf7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"9bcabec4-1235-46cf-b190-a3eecc3c6de6\"}"},{"__ref":"Education:{\"uuid\":\"ea6bbce2-d57e-4204-a097-76674228a7b4\"}"}],"hiredAt":"2026-02-09T23:51:09.208Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","German","Academic Coaching","Computer Science","Sports Journalism","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Machine Learning / AI","Robotics / Electronics / CAD","Sports Analytics","STEM Project","Web Design"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"rayaan-attari\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b8c59777-93a1-4087-988e-b050eaba2d12\"}"}}},"_sentryTraceData":"edc80825240e42b0b4f9450d3a80fc71-a6d84e03a2ae6bf5-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=edc80825240e42b0b4f9450d3a80fc71,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"rayaan-attari"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Dat
