xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"dae04a0c-3e36-49bb-b6fe-bda9a9f6d495\"}":{"__typename":"Favorites","uuid":"dae04a0c-3e36-49bb-b6fe-bda9a9f6d495","photoUrl":"https://ucarecdn.com/4a8adc84-abe4-4cc8-85c5-64116c68347f/","title":"Green Bay Packers","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"6b996d29-2133-429b-978e-482483a2013f\"}":{"__typename":"Favorites","uuid":"6b996d29-2133-429b-978e-482483a2013f","photoUrl":"https://ucarecdn.com/4910bc09-2aca-4f2b-aee7-6e3f7bba6238/","title":"Giannis Antetokoumpo","type":"ATHLETE"},"Favorites:{\"uuid\":\"e2155f9f-5bc1-4cd6-ac69-58764db65263\"}":{"__typename":"Favorites","uuid":"e2155f9f-5bc1-4cd6-ac69-58764db65263","photoUrl":"https://ucarecdn.com/bef5f2ae-c476-48a8-b9ab-e5d4129347e2/","title":"Chicago","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4c631305-ea7c-4a06-86ba-5c0490917737\"}":{"__typename":"DeepDives","uuid":"4c631305-ea7c-4a06-86ba-5c0490917737","content":"\u003cp\u003eThe \"AHA!\" moment, which, in the words of my 10th-grade chemistry teacher, was the moment all the pieces of a concept come together to create complete understanding. As a student, these moments were pivotal and made learning exciting for me.\u003cbr\u003e\u003cbr\u003eAs a mentor, I hope to do the same thing my teacher did for me: directly help students to turn confusion into clarity. It would truly be a privilege for me to create as many \"AHA!\" moments as I can for students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b4a6191e-405e-4a7c-928d-c9a5f18e9f0a\"}":{"__typename":"DeepDives","uuid":"b4a6191e-405e-4a7c-928d-c9a5f18e9f0a","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to run a marathon! I love all forms of being active, and running is always a way to unwind for me, so being able to train for a marathon and run it is something I definitely have on my bucket list.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"66a27ebd-945c-47b5-9389-246595491bcc\"}":{"__typename":"DeepDives","uuid":"66a27ebd-945c-47b5-9389-246595491bcc","content":"\u003cp\u003e\u0026nbsp;\u0026nbsp;\u0026nbsp;When I first received the news that a global pandemic was causing school to be online for two weeks, I was ecstatic. Classes would be much more relaxed, and I would be able to do all my work in the comfort of my own room. However, as the days became weeks and the weeks turned into months, quarantine began to feel dull and repetitive, and I felt lonely and detached from the comfort of seeing my friends and family.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy sister and I decided that we needed to do something enjoyable as a remedy for our boredom during quarantine, and we agreed that baking was something we both enjoyed and (more importantly) was possible with the strict government regulations. We would hold weekly baking competitions using the ingredients in our home, and our MasterChef judges (mom and dad) would decide a winner on the premises of taste and presentation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat started off as cookies and brownies spiraled into raspberry ganache mousse cake and tiramisu, with our creativity increasing every time we baked together. These competitions brought out the competitive spirit in both of us, as we were always trying to make the best dessert possible, creating not only sweet treats but also invaluable memories. As a result of the pandemic, we grew closer and were able to bond over baking.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough these competitions, I learned that baking is a way for me to express my creativity and a method to calm me down in times of difficulty. I can now confidently say that if the world ever goes on lockdown again, as long as I have my sister (and a baking oven), I will be perfectly fine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"963c21f3-51b9-4593-8bfd-43f2ec17f773\"}":{"__typename":"DeepDives","uuid":"963c21f3-51b9-4593-8bfd-43f2ec17f773","content":"\u003cp\u003eNeuroscience–a word derived from the Greek and Latin words \u003cem\u003eneuro\u003c/em\u003e and \u003cem\u003escientia\u003c/em\u003e, meaning study and life. To me, neuroscience is not just the study of the brain, but the crossroads of ingenuity and discovery, knowledge and creativity. At Northwestern, I look forward to pursuing a major in Neuroscience. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis past summer, I participated in a summer research program researching blood clotting and its effect on placental abruption during childbirth. Through learning valuable research skills like micropipetting, genotyping, and ultraviolet imaging, I got my first hands-on experience in scientific research and was able to broaden my understanding of biology outside of the classroom.\u0026nbsp; This invaluable experience has shown me that cellular biology is a strong academic interest of mine, and I am excited to apply the skills learned in the lab within and beyond the classroom at Northwestern.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"e8f3b8c1-679f-4df5-8089-8b7521b25e24\"}":{"__typename":"School","uuid":"e8f3b8c1-679f-4df5-8089-8b7521b25e24","name":"Brookfield Academy","city":"Brookfield","type":"HIGH","state":"Wisconsin","country":"United States","zip":"53045"},"Education:{\"uuid\":\"5731e7da-2491-4f52-af00-4ecf808600b9\"}":{"__typename":"Education","uuid":"5731e7da-2491-4f52-af00-4ecf808600b9","school":{"__ref":"School:{\"uuid\":\"e8f3b8c1-679f-4df5-8089-8b7521b25e24\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"f3f27198-d1bc-4d3a-bbbd-7f8f39ef58ac\"}":{"__typename":"Education","uuid":"f3f27198-d1bc-4d3a-bbbd-7f8f39ef58ac","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"b5e262a1-9f55-435c-be29-656b6351a614\"}":{"__typename":"MentorPublicProfile","uuid":"b5e262a1-9f55-435c-be29-656b6351a614","displayName":"Rohan S.","slug":"rohan-singh","biography":"\u003cp\u003eHello! My name is Rohan Singh, and I am a passionate student, mentor, and aspiring physician who loves helping others learn and grow. I am currently a freshman at Northwestern University studying Neuroscience on the pre-med track. Neuroscience has always fascinated me because it sits at the intersection of discovery, creativity, and problem-solving. To me, science is not just about memorizing facts; it is about asking questions, exploring ideas, and understanding how the world works. As a tutor, I strive to bring that same sense of curiosity and excitement into every session so that students feel empowered rather than intimidated by challenging material.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, one of the most meaningful parts of my life has been mentoring students through sports and community programs. I coached more than sixty children through the Milwaukee Tennis and Education Foundation, where I helped introduce kids to tennis while supporting their personal and academic development. I have also volunteered with ACEing Autism, where I help neurodivergent children learn tennis in an encouraging and supportive environment. This experience taught me patience, adaptability, and the importance of meeting students where they are in their learning journey. Every student learns differently, and one of my strengths as a tutor is recognizing those differences and adjusting my teaching style to fit each individual.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eHow I can help \u003cstrong\u003eyour\u003c/strong\u003e student:\u003c/p\u003e\u003cp\u003eI specialize in guiding K-12 students through:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects\u003c/strong\u003e (starting a club/ nonprofit, creating a blog/website about a passion) \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch mentorship\u003c/strong\u003e (learning about the research process, developing a research project, presentation of findings) - I myself have just gone through this process of finding research at Northwestern! Having done research in high school, I am qualified to assist your student in developing and building a passion for research. \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e Subject guidance\u003c/strong\u003e (math, physics, chemistry, biology) - as a pre-med, I have taken all these classes multiple times and am very passionate about teaching them. \u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eBeyond academics and mentoring, I enjoy music, sports, and staying active. My Spotify playlist ranges from artists like Michael Jackson to Nirvana and Kendrick Lamar, and I love how music can capture different emotions and perspectives. I also enjoy playing tennis, biking, solving puzzles, and exploring new ideas across disciplines.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a tutor, my goal is not just to help students improve their grades but to help them build confidence and develop a genuine understanding of what they are learning. I believe that when students feel supported and encouraged, they can achieve far more than they initially expect. I aim to create a learning environment that is engaging, supportive, and focused on helping every student reach their full potential.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am excited to make my impact through Curious Cardinals, and I hope that I can learn as much as my students as they learn from me!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"5EUWoEf8SiGki00LZPYWiEhsdHmjAd1005zGJ2jYk8eaE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWinning 3 State Championships in Tennis!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"dae04a0c-3e36-49bb-b6fe-bda9a9f6d495\"}"},{"__ref":"Favorites:{\"uuid\":\"6b996d29-2133-429b-978e-482483a2013f\"}"},{"__ref":"Favorites:{\"uuid\":\"e2155f9f-5bc1-4cd6-ac69-58764db65263\"}"}],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"Deep
