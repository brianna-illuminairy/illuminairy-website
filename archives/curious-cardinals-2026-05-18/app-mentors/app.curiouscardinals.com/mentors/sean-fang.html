xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"13496636-f23a-403a-9178-01e397e01b38\"}":{"__typename":"Favorites","uuid":"13496636-f23a-403a-9178-01e397e01b38","photoUrl":"https://ucarecdn.com/febd357d-5fb0-43ef-bf7c-4d0ed541a374/","title":"Bruno Mars","type":"ARTIST"},"Favorites:{\"uuid\":\"9e1698b4-d5c1-4d9e-971a-fdfb1dcc6fda\"}":{"__typename":"Favorites","uuid":"9e1698b4-d5c1-4d9e-971a-fdfb1dcc6fda","photoUrl":"https://ucarecdn.com/538d7c27-e565-47a2-a87f-bb73fed68a2c/","title":"Philadelphia 76ers","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"1229c004-ee8e-4f29-b877-dfc26f4d59ac\"}":{"__typename":"Favorites","uuid":"1229c004-ee8e-4f29-b877-dfc26f4d59ac","photoUrl":"https://ucarecdn.com/c504b788-e93d-4987-8b14-3ced476368f5/","title":"New Super Mario Bros 2","type":"GAME"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"fbfc3862-1732-46b5-a6c8-3792059cf86c\"}":{"__typename":"DeepDives","uuid":"fbfc3862-1732-46b5-a6c8-3792059cf86c","content":"\u003cp\u003eMy dream job is to be the person making a cool tech product and deciding what kinds of things to include in it (the fancy word for it is Product Management). I would love to do this job because it lets me build something starting from 0 to 100.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"f2e44955-d2d4-4fc1-91c5-e3cd500a2320\"}":{"__typename":"DeepDives","uuid":"f2e44955-d2d4-4fc1-91c5-e3cd500a2320","content":"\u003cp\u003eI think I was a very different high school student than how I am today. I was much more shy and not as outgoing. Once I came to college however, I definitely became more comfortable in my own shell. That is why I think every student can and will grow; it just sometimes takes a mentor to point you in the right direction.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"6769706e-12db-4722-b3e3-0d59085002b5\"}":{"__typename":"DeepDives","uuid":"6769706e-12db-4722-b3e3-0d59085002b5","content":"\u003cp\u003eI made a lot of mistakes growing up. From not being as proactive about working on the things I love to not putting in enough time for friends, I've done pretty much everything wrong at some point or another. That's why I think mentorship is super important. I wish I had someone there when I was younger to tell me how I could improve before I made mistakes. I hope I can be that for one of you guys.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"975dd955-cae4-4d6d-914b-ee24293f7f2c\"}":{"__typename":"DeepDives","uuid":"975dd955-cae4-4d6d-914b-ee24293f7f2c","content":"\u003cp\u003eI want to go to space at least once in my lifetime. Who knows, in a few years if they build space hotels, I'd love to stay in one!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"9bebfd2c-df1f-49eb-81cd-cdddeb7078d5\"}":{"__typename":"School","uuid":"9bebfd2c-df1f-49eb-81cd-cdddeb7078d5","name":"Maggie L Walker Governor’s School","city":"Richmond","type":"HIGH","state":"Virginia","country":"United States","zip":"23220"},"Education:{\"uuid\":\"a57793d0-f2c3-4754-aaa4-b97a17f860bf\"}":{"__typename":"Education","uuid":"a57793d0-f2c3-4754-aaa4-b97a17f860bf","school":{"__ref":"School:{\"uuid\":\"9bebfd2c-df1f-49eb-81cd-cdddeb7078d5\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"c7193a94-722a-4543-8f1c-de871aa360c6\"}":{"__typename":"Education","uuid":"c7193a94-722a-4543-8f1c-de871aa360c6","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science/Robotics","degree":null},"MentorPublicProfile:{\"uuid\":\"de664631-d2c3-49f4-a5fa-00b8d5d696d5\"}":{"__typename":"MentorPublicProfile","uuid":"de664631-d2c3-49f4-a5fa-00b8d5d696d5","displayName":"Sean F.","slug":"sean-fang","biography":"\u003cp\u003eHey! 👋 Welcome to my page. My name is Sean, and I'm a college student who loves to stay curious and have fun while learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSuper happy that you've found my page, so while you're exploring, I'll tell you a bit about myself. I grew up in a city called Richmond, Virginia, and I'm super proud of it! I love to hang out in the city and hike around the quiet river trails.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my academics, I enjoy messing with cameras and robotic arms, which is why I chose to study computer science and robotics. However, what really got me into tech and computers was discovering Scratch in middle school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEven today, some of my favorite hobbies are building my own websites, apps, and games.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you have any questions, feel free to contact me, and hope that we can have fun while learning in a lesson soon!\u003c/p\u003e","teachingVideoPlaybackId":"jS5pRAy901JP8bZs01Cu02Xgi3GxYSTj3Les8fVvgArud4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI think one of my proudest moments was getting into college. Going to college was always a goal I wanted to achieve. When I got into my dream college, I was super proud of not only the result, but also all the personal growth I had made that could help me achieve this.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"13496636-f23a-403a-9178-01e397e01b38\"}"},{"__ref":"Favorites:{\"uuid\":\"9e1698b4-d5c1-4d9e-971a-fdfb1dcc6fda\"}"},{"__ref":"Favorites:{\"uuid\":\"1229c004-ee8e-4f29-b877-dfc26f4d59ac\"}"}],"causesSupported":[],"major":"Computer Science/Robotics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fbfc3862-1732-46b5-a6c8-3792059cf86c\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2e44955-d2d4-4fc1-91c5-e3cd500a2320\"}"},{"__ref":"DeepDives:{\"uuid\":\"6769706e-12db-4722-b3e3-0d59085002b5\"}"},{"__ref":"DeepDives:{\"uuid\":\"975dd955-cae4-4d6d-914b-ee24293f7f2c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d0034dd4-5934-407b-8e52-cefd20da9f2a/-/preview/-/format/jpg/","https://ucarecdn.com/4928107d-d84c-449c-8c5f-1ff6b43e17d1/-/preview/-/format/jpg/","https://ucarecdn.com/96f9c4d0-6b61-42df-90f2-5700e842be25/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a57793d0-f2c3-4754-aaa4-b97a17f860bf\"}"},{"__ref":"Education:{\"uuid\":\"c7193a94-722a-4543-8f1c-de871aa
