xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"eef03d59-d1e9-447f-b0d5-a8142d0b5192\"}":{"__typename":"DeepDives","uuid":"eef03d59-d1e9-447f-b0d5-a8142d0b5192","content":"\u003cp\u003eMy greatest source of motivation is the people I work with. I always try to surround myself with people who are as excited about the project as I am, which incentivizes me to do my job faster and better. Deadlines are good motivators for class, but outside of class, the best way is through talented and excited people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"bb3f8afd-d83a-45ca-a3e5-50668f1d96c8\"}":{"__typename":"DeepDives","uuid":"bb3f8afd-d83a-45ca-a3e5-50668f1d96c8","content":"\u003cp\u003eIn the dream, I woke and was in my bed. This made me think it was all real, because I was in my bed. I awoke because of some noise in the hallway of my dorm, and I was super mad at the people making the noise. I slither out of my bed and open the door to see two rows of people lining the hallway walls, cheering people on who were running and sliding down the hallway. I asked what their deal was, and they asked why I was in my underwear. I was sleeping, so that was why, but they never told me what their deal was. I went out to give them a piece of my mind, but then a blond man rushed into my room and shut the door, which automatically locks. I panicked and woke up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"68d641ab-1d89-4c45-8e38-6cf7a92266da\"}":{"__typename":"DeepDives","uuid":"68d641ab-1d89-4c45-8e38-6cf7a92266da","content":"\u003cp\u003eIn the immediate future, my dream job is to work for a network television show. They get consistent work and have to write prolifically, which is a good thing to have to do in your career as a writer. Then, I hope to write one or two huge movies and a Broadway show that I can retire on. Then I'd get a steady teaching job, because that's what it's all about, right? After the teaching job, I'd be a wise old man that people go to for advice and favors.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"268635e9-3148-4c91-8f11-c76749d814e5\"}":{"__typename":"DeepDives","uuid":"268635e9-3148-4c91-8f11-c76749d814e5","content":"\u003cp\u003eI would tell my middle school self to learn the piano, because that's the best instrument! The saxophone may be cool, but it's ultimately useless unless you're the best at it. I play the saxophone at an OK level, but I can't actually do anything cool. Everyone is so impressed by the piano, and I'd be the coolest kid on the block if I could play it half as well as I can play the saxophone now. I also play the accordion, and that's somehow less cool than everything I could have picked. My grandfather played it professionally, though, so my hands were tied. Play the piano young Jimmy!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"b957a4ec-7b06-48d4-ac4f-fda021e92f1e\"}":{"__typename":"School","uuid":"b957a4ec-7b06-48d4-ac4f-fda021e92f1e","name":"Cheyenne Mountain High School","city":"Colorado Springs","type":"HIGH","state":"Colorado","country":"United States","zip":"80906"},"Education:{\"uuid\":\"114ad2c9-b03f-48e1-9445-a598a02a9c4e\"}":{"__typename":"Education","uuid":"114ad2c9-b03f-48e1-9445-a598a02a9c4e","school":{"__ref":"School:{\"uuid\":\"b957a4ec-7b06-48d4-ac4f-fda021e92f1e\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"4116ed07-4417-48c2-99a6-2efca267df36\"}":{"__typename":"Education","uuid":"4116ed07-4417-48c2-99a6-2efca267df36","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Film and Media Studies, History","degree":null},"MentorPublicProfile:{\"uuid\":\"d2aa2b5c-b5ac-46e9-9a8e-7949a4958bb5\"}":{"__typename":"MentorPublicProfile","uuid":"d2aa2b5c-b5ac-46e9-9a8e-7949a4958bb5","displayName":"Jimmy H.","slug":"jimmy-hayward","biography":"\u003cp\u003eHello all! I'm Jimmy Hayward, a Film and History major at Columbia University. I'm doing my thesis in screenwriting, which is the thing I hope to teach. Movies are everything to me, I love all of them. I watch everything that is recommended me, and I've almost seen all of the movies ever. I got into screenwriting because a great teacher said \"go to where you feel like you're making the movie,\" so I poured all my resources and energy into writing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm from Colorado Springs, Colorado, and I grew up doing many things. I swam and danced ballet in my youth and in high school, and I play the saxophone and the accordion mostly in Jazz ensembles but also in theater pits. My grandfather was an engineer-turned-professional accordion player, and he inspired me to do many things before finding the thing I wanted to do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love writing in general, but I like script writing especially because it has rules. Classes in prose and general fiction writing are mostly the teacher saying \"tell me your truth,\" and agreeing with everything that comes out. Because screenwriting is such a commercial medium, teachers will tell you where your script is slow and guide you to fixing it. I found this incredibly useful, and I hope I can bring this energy to my students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe greatest of all movies is one called \u003cem\u003eThree Idiots\u003c/em\u003e. It has a great story, a lean script despite its length, and satisfying arcs for all of the characters. The movie \u003cem\u003eCoco\u003c/em\u003e is also probably the best movie ever made. The message is so wonderful, the script is happy and sad and tense, and there are no slow moments. These are simple stories that have been polished to perfection, which is why they are the greatest movies ever made.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was a STEM and Math kid in high school, despite the dance and music I often participated in. I thought I would go into STEM or Math, but I found a creative and lasting expression of problem-solving in screenwriting. If the story is boring at any point, there are ways to fix it, and you can learn them. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI hope to work in the entertainment industry when I graduate, either screenwriting or playwriting. I've written many short films, worked extensively in student theater, and I'm writing an original musical with my roommate (who is also a Curious Cardinals mentor!).\u003c/p\u003e","teachingVideoPlaybackId":"8tsrr5WppYsS00d01MNfymI2cRPOHB9oM2M9Pqe01Ljt58","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Film and Media Studies, History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"eef03d59-d1e9-447f-b0d5-a8142d0b5192\"}"},{"__ref":"DeepDives:{\"uuid\":\"bb3f8afd-d83a-45ca-a3e5-50668f1d96c8\"}"},{"__ref":"DeepDives:{\"uuid\":\"68d641ab-1d89-4c45-8e38-6cf7a92266da\"}"},{"__ref":"DeepDives:{\"uuid\":\"268635e9-3148-4c91-8f11-c76749d814e5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c82ca2c6-6f11-47a9-8884-96165e5b0a7a/-/preview/-/format/jpg/","https://ucarecdn.com/35777b42-c664-4551-b7a9-d01e056772c8/-/preview/-/format/jpg/","https://ucarecdn.com/abca5bdc-ca73-4dce-b5f9-b4d085ca36b9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"114ad2c9-b03f-48e1-9445-a598a02a9c4e\"}"},{"__ref":"Education:{\"uuid\":\"4116ed07-4417-48c2-99a6-2efca267df36\"}"}],"hiredAt":"2026-04-16T17:33:07.465Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jimmy-hayward\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d2aa2b5c-b5ac-46e9-9a8e-7949a4958bb5\"}"}}},"_sentryTraceData":"e6911c341943443dbc5d1463e5a8b47f-87f51aac19c26b96-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e6911c341943443dbc5d1463e5a8b47f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jimmy-hayward"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"i
