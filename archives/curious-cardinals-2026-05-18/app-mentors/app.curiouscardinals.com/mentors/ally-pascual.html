on:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ea41dc0d-755a-4b9b-b336-178c2c3241cb\"}":{"__typename":"DeepDives","uuid":"ea41dc0d-755a-4b9b-b336-178c2c3241cb","content":"\u003cp\u003eMy mom!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"8865332e-9296-47c3-a3ff-e32c8fb463f7\"}":{"__typename":"School","uuid":"8865332e-9296-47c3-a3ff-e32c8fb463f7","name":"High School","city":"N/A","type":"HIGH","state":"CA","country":"N/A","zip":"N/A"},"Education:{\"uuid\":\"816b22f4-a245-4c40-9d76-08b3998bce32\"}":{"__typename":"Education","uuid":"816b22f4-a245-4c40-9d76-08b3998bce32","school":{"__ref":"School:{\"uuid\":\"8865332e-9296-47c3-a3ff-e32c8fb463f7\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"2a463fc1-2bb4-471d-b9bd-c58cda1dca73\"}":{"__typename":"Education","uuid":"2a463fc1-2bb4-471d-b9bd-c58cda1dca73","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2027","major":"Statistics \u0026 Data Science, Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"b9dc90f8-19f2-44b8-a41b-fcb199f9867e\"}":{"__typename":"MentorPublicProfile","uuid":"b9dc90f8-19f2-44b8-a41b-fcb199f9867e","displayName":"Ally K.","slug":"ally-pascual","biography":"\u003cp\u003eHello! My name is Ally, and I'm deeply passionate about helping students succeed academically and develop their unique interests. Throughout high school, I personally faced challenges in these areas, but through dedication, time, and valuable experience, I successfully overcame them. My aspiration is to share this acquired wisdom with my students, whether that involves providing guidance on exciting passion projects or meticulously incorporating effective study habits into our academic tutoring sessions. I believe that fostering both academic discipline and personal passion is key to a fulfilling educational journey.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCurrently, as a student at Yale, I thoroughly enjoy delving into the pertinent application areas of Statistics. This includes crucial fields like economics, natural language processing, and the increasingly vital area of AI ethics, all in addition to mastering the underlying mathematical theory that supports these applications. Beyond my own coursework, you will frequently find me actively tutoring high school students in the greater New Haven area, specifically focusing on complex mathematics and essential financial literacy skills. My free time is typically dedicated to conducting impactful research at the School of Medicine, serving as a dedicated Teaching Assistant for various Statistics classes to support my peers, and indulging my creative side through painting. These activities allow me to engage with the material from different perspectives and give back to the community.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am always looking for ways to expand my understanding and help others achieve their full potential. My experiences have taught me the profound value of persistence and the importance of a well-rounded skill set. I am committed to making a tangible, positive difference in the lives of my students, empowering them with the tools and confidence they need to navigate their academic and personal endeavors successfully. The intersection of my academic pursuits and my tutoring work provides a rich environment for continuous learning and growth.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFinally, here are a few fun facts about me that offer a peek into my life outside of academics:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI am the second eldest in my family of four sisters!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLooking ahead, I have a strong ambition to become a teacher in the future, continuing my dedication to education.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI truly enjoy reading memoirs, as they provide fascinating insights into diverse life experiences.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"X4zXLVbN1BYpugw9S5A4wtAGRX3PQbb7DFVw3Xtwfu4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics \u0026 Data Science, Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a1c55cbb-8b37-4fac-9e04-97613f590d12\"}"},{"__ref":"DeepDives:{\"uuid\":\"bcbe041f-db36-4050-83a7-c953666ae889\"}"},{"__ref":"DeepDives:{\"uuid\":\"fc86339a-b07c-4fab-a71c-af30cd392174\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea41dc0d-755a-4b9b-b336-178c2c3241cb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/87ffbc7e-2171-446e-89cd-702e09caef56/-/preview/-/format/jpg/","https://ucarecdn.com/dc9f2d23-d699-4475-b20c-89d09a339301/-/preview/-/format/jpg/","https://ucarecdn.com/89642236-ae67-42eb-9b89-6650b72fa3b1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"816b22f4-a245-4c40-9d76-08b3998bce32\"}"},{"__ref":"Education:{\"uuid\":\"2a463fc1-2bb4-471d-b9bd-c58cda1dca73\"}"}],"hiredAt":"2026-01-21T16:02:59.524Z","topics":["K-5 Grade Math","Algebra I","Pre-Algebra","Algebra II","Geometry","Calculus","Precalculus / Trigonometry","Statistics","Biology","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Scien
