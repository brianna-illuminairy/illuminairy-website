d\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2f26b0a1-8b08-4b0c-9ff3-d2e28c1e7144\"}":{"__typename":"MentorPublicProfile","uuid":"2f26b0a1-8b08-4b0c-9ff3-d2e28c1e7144","displayName":"Sydney W.","slug":"sydney-wood","biography":"\u003cp\u003eHi! Let's talk about the boring stuff first: I am a pre-health senior at the University of Southern California majoring in Cognitive Science and minoring in music industry. My classes consist mostly of psychology, linguistics, and music business. I recently chose to pursue the dental path, so I am in the process of applying to Post-Baccs back east!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am currently balancing 3 campus jobs: Student Ambassador (Tour Guide), Lifeguard, and Teaching Assistant for the USC swim class. I have been a Lifeguard for 6 years and worked at a country club in Philly for 5 summers.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt USC, I served as the Director of Philanthropy for my sorority, Alpha Phi. Community service and philanthropy have been an incredibly important aspect of my upbringing – I attended a Quaker school Kindergarten-12th grade which instilled in me the importance of helping others. My other involvements consist of Club Triathlon, USiL (Undergraduate Students in Linguistics), and CubeSC (USC’s Rubik’s Cube club).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow for what you really care about... the fun stuff!\u003c/p\u003e\u003cp\u003e1) If mermaids were real (which, who says they're not?!), I think I would like to be one. I love the water. I love swimming. Mermaid life seems pretty cool.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e2) I am a sucker for live music. Whether its a big-time artist at the largest stadium in the city, or a new artist still building momentum at a small, intimate venue – if you invite me, I'm there. While I enjoy all genres of music, my favorites are country/contemporary country/folk. My favorite concert I've ever been to was Zach Bryan (I've seen him twice, and looking to see him again...)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e3) I am a HUGE Philly sports fan but am pretty indifferent about any game where a Philly team isn't playing. I will start an E-A-G-L-E-S chant at a game, but not watch other teams play even if the game is on right in front of me (Super Bowl Excluded).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e4) Dessert is my favorite meal. Currently on the hunt to find delicious treats that aren't terrible for my health (please let me know if you have any ideas).\u003c/p\u003e","teachingVideoPlaybackId":"oDIqctJpEU36nYyecW7GhTCzVtTsKLGuSnyo01u02fvko","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"14a98a9e-4cb6-44a9-b246-1049abef9b8c\"}"},{"__ref":"Favorites:{\"uuid\":\"934244e6-cc75-4fa8-9373-e6d35d1ee52a\"}"},{"__ref":"Favorites:{\"uuid\":\"cf405168-8410-4ac5-9ee6-0b9b3f39e524\"}"}],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"60918319-ccd1-4205-a41a-388e9d6fca04\"}"},{"__ref":"DeepDives:{\"uuid\":\"e25ef130-c86a-4685-be74-319c56233b92\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9fb72da-459f-45a6-b6cd-302caf8f4fb7\"}"},{"__ref":"DeepDives:{\"uuid\":\"75fc3b99-4970-468c-a9d5-0a20d4987ce0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/742894da-f675-41cb-9332-25d3af76a1d6/-/preview/-/format/jpg/","https://ucarecdn.com/96b39718-4dc8-4e40-b977-b5467ff48f73/-/preview/-/format/jpg/","https://ucarecdn.com/49e41cf8-aa9c-470c-8b88-18c4c455e799/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b4080800-3083-47fc-8a2d-78425f2ee45c\"}"},{"__ref":"Education:{
