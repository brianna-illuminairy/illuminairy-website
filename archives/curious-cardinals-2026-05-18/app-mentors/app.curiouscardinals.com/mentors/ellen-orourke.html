":{"__typename":"DeepDives","uuid":"6b6beab3-e263-4ea9-a12e-2c0407cfe2b9","content":"\u003cp\u003eresearch niche topics - horseshoe crabs are a particular favorite!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9a10d05f-1436-44ed-84bf-867f8319a147\"}":{"__typename":"DeepDives","uuid":"9a10d05f-1436-44ed-84bf-867f8319a147","content":"\u003cp\u003eI'm teaching myself animation!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"aafb1186-e2f7-4c7a-9629-26f166662643\"}":{"__typename":"DeepDives","uuid":"aafb1186-e2f7-4c7a-9629-26f166662643","content":"\u003cp\u003e\u003cstrong\u003eI discovered my cats could speak english but simply chose not to...\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d91ffe8c-de43-4f96-8fa3-06037ddc4107\"}":{"__typename":"DeepDives","uuid":"d91ffe8c-de43-4f96-8fa3-06037ddc4107","content":"\u003cp\u003eI hope to write, illustrate, and publish a children's book\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}":{"__typename":"School","uuid":"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5","name":"Choate Rosemary Hall","city":"Wallingford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06492"},"Education:{\"uuid\":\"974f3c2e-3ab6-4e77-b0dd-5255bd43af55\"}":{"__typename":"Education","uuid":"974f3c2e-3ab6-4e77-b0dd-5255bd43af55","school":{"__ref":"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"f88f4230-5337-4fc7-bbc9-b7923b1a12a4\"}":{"__typename":"Education","uuid":"f88f4230-5337-4fc7-bbc9-b7923b1a12a4","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Environmental Studies, Minor in English","degree":null},"MentorPublicProfile:{\"uuid\":\"f1b8b73b-4541-4fdf-b676-021b52d2466f\"}":{"__typename":"MentorPublicProfile","uuid":"f1b8b73b-4541-4fdf-b676-021b52d2466f","displayName":"Ellen O.","slug":"ellen-orourke","biography":"\u003cp\u003eHi folks! My name is Ellen!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI graduated Cum Laude from Dartmouth College this past July, where I studied Environmental Studies and English. After graduation, I moved to DC, and I'm currently interning in Congress. I love sun-riking mountains, reading Mary Oliver’s poetry, skiing in Vermont, baking french treats, and petting my two senile cats! Above, you can see one of the two aforementioned cats–named Prestwick (after the town my grandparents met in Scotland). The other one is an orange tabby named Bombus (the latin name for Bumble Bee)!\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhile at Dartmouth, I found my niche through combining my love of writing with my passion for environmental justice issues. I truly love interdisciplinary learning, and strong writing skills help students succeed in all subjects. I got to hone my own writing skills while doing things like developing user personas for a digital archive, assisting on an NSF-funded water quality governance modeling project, and writing a long-form literary piece on horseshoe crabs!\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003eSince 2020, I’ve been helping students from elementary to highschool ages with their academics, mostly around writing! In that time, I’ve covered everything from reviewing grammatical rules to helping draft personal statements. I particularly love helping students find their “voice” in writing; I want them to feel connected to and proud of the work they create.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI promise to make lessons in writing approachable, meaningful, and fun. I was drawn to working with Curious Cardinals because of their emphasis on mentor/mentee relationships. I really get to know the students that I work with, and I take pride in tailoring my approach to each individual.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eMy own highschool experience taught me the value of mentorship. I actually went to a boarding school, where I got to live off campus for two years in an Environmental Immersion Program. While there, a typical day included things like traversing the woods to identify plants in the morning, then heading inside to learn R as a tool for population modeling in the afternoon. My teachers there were incredible, constantly supporting my development beyond the classroom with conversations on everything from book recommendations to college application advice. I hope to have similar relationships with my mentees!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOther than that, I am a big-believer in cultivating positive mental health! I am especially passionate about supporting LGBTQ+ young people, I recently started volunteering with the Trevor Project, an LGBTQ+ youth crisis service.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAlso, I devour books, and my taste in genres is eclectic! I like everything from fantasy (big LOTR fan!) to nonfiction. I would love to talk about books with mentees, and exchange recommendations! A life-dream of mine is to write a young adult fiction book!\u0026nbsp; My current read is “Why Fish Don’t Exist: A Story of Love, Loss, and the Hidden Order of Life,” by Lulu Miller.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d26b3551-c19b-4923-9915-74fb8011c930\"}"},{"__ref":"Favorites:{\"uuid\":\"3d901c19-dcd7-437f-b616-ba4106dd1ddd\"}"},{"__ref":"Favorites:{\"uuid\":\"f8e829e9-5d18-492e-87df-27600a51ca8a\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"ffec3dac-365c-4d3b-9c28-5383e89a12f7\"}"},{"__ref":"CausesSupported:{\"uuid\":\"7fd6e124-071c-41d4-945f-fc3ae25b48c1\"}"}],"major":"Environmental Studies, Minor in English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6b6beab3-e263-4ea9-a12e-2c0407cfe2b9\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a10d05f-1436-44ed-84bf-867f8319a147\"}"},{"__ref":"DeepDives:{\"uuid\":\"aafb1186-e2f7-4c7a-9629-26f166662643\"}"},{"__ref":"DeepDives:{\"uuid\":\"d91ffe8c-de43-4f96-8fa3-06037ddc4107\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0d652ed3-bb27-43d9-83f4-309ec9d7d265/-/preview/-/format/jpg/","https://ucarecdn.com/dad904c5-92a3-41fa-86f6-da56fcee69ad/-/preview/-/format/jpg/","https://ucarecdn.com/60fd8b13-b9a3-44d6-982e-a904f083e13b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"974f3c2e-3ab6-4e77-b0dd-5255bd43af55\"}"},{"__ref":"Education:{\"uuid\":\"f88f4230-5337-4fc7-bbc9-b7923b1a12a4\"}"}],"hiredAt":"202
