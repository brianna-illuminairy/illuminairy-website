xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b1f53364-9795-4a5f-b013-48dcbadb6bba\"}":{"__typename":"DeepDives","uuid":"b1f53364-9795-4a5f-b013-48dcbadb6bba","content":"\u003cp\u003eI would tell my younger self to never, ever let anyone put limits on what you can do. No one and nothing, whether it be other people or an institution, can define who you are as a person and as a scholar. You carve your own path and you must own it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"22ac64bb-0b73-41a4-92ac-612d50b499d1\"}":{"__typename":"DeepDives","uuid":"22ac64bb-0b73-41a4-92ac-612d50b499d1","content":"\u003cp\u003eI chose computer science as it is an absolutely fascinating field filled with the 20th and 21st centuries' greatest innovations and innovators. I am concentrating on AI for its amazing potential to revolutionize education access. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5d255471-9c72-4ad2-bb60-74032557a5cd\"}":{"__typename":"DeepDives","uuid":"5d255471-9c72-4ad2-bb60-74032557a5cd","content":"\u003cp\u003eMentorship means the absolute world to me. I come from a first generation low income background and I know the difficulties of navigating your undergrad. I mentor FLI students from my local community to help them apply to elite private colleges. This has instilled in me the belief that we can slowly but steadily narrow the achievement gap across the country with a concerted effort. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"61ff9594-4cf8-48c7-8bff-e803ac0d211c\"}":{"__typename":"DeepDives","uuid":"61ff9594-4cf8-48c7-8bff-e803ac0d211c","content":"\u003cp\u003eI want to narrow the achievement gap in education through technology entrepreneurship. I want to impact a million students by the time I am 30! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"d54ab599-828a-43ac-a323-1f9e90756e25\"}":{"__typename":"School","uuid":"d54ab599-828a-43ac-a323-1f9e90756e25","name":"Patriot High School","city":"Jurupa Valley","type":"HIGH","state":"California","country":"United States","zip":"92509"},"Education:{\"uuid\":\"edc61f8f-5d91-42ce-b17a-10280ccb225c\"}":{"__typename":"Education","uuid":"edc61f8f-5d91-42ce-b17a-10280ccb225c","school":{"__ref":"School:{\"uuid\":\"d54ab599-828a-43ac-a323-1f9e90756e25\"}"},"startYear":"2020","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7f5b2cd5-afd9-42fa-9f1a-e53940ef4d9e\"}":{"__typename":"Education","uuid":"7f5b2cd5-afd9-42fa-9f1a-e53940ef4d9e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"cc5c8b3e-31af-4301-b6ff-5766deab51e3\"}":{"__typename":"MentorPublicProfile","uuid":"cc5c8b3e-31af-4301-b6ff-5766deab51e3","displayName":"Matthew D.","slug":"matthew-darshan","biography":"\u003cp\u003eAs a first generation, junior at Stanford University, I cannot overstate my belief in the limitless potential of the human mind. My time at Stanford has allowed me an incredible opportunity for exploration. This insatiable curiosity and a hyperactive mind has brought me to love and admire many fields from Mathematics, Computer Science, Artificial Intelligence to Entrepreneurship, Data Science and beyond. Through this exploration and some incredible influences in my life, I’ve converged on the study of Computer Science on the Artificial Intelligence Track because I believe in the transformative potential of these fields to revolutionize education. By emulating the brain's efficiency, adaptability, and processing power in artificial systems, we can develop AI-driven tools that push the boundaries of learning. It is my mission to bring these experiences and technologies to the way products are engineered and designed. And above all, to bring opportunity and accessibility to marginalized and disadvantaged communities everywhere. \u003cbr\u003e\u003cbr\u003eIf you would like to schedule a call with me or be in touch please feel free to reach out at any time:\u003cbr\u003emtorre04@stanford.edu\u003c/p\u003e","teachingVideoPlaybackId":"f00JvizmfKAbZL6xB2RG3yTxJq8UgleCoMm01Xe6yYEwY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eXfund Ethics Fellow for Stanford Technology and Ventures Program \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBusiness Leadership Program (Technology Track) @ Synchrony Financial \u003c/p\u003e\u003cbr\u003e\u003cp\u003eLaunched Demystifyd (June 2024) Startup for International Students and Young Professionals \u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowth Equity Investments Intern @ Adams Street Partners \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b1f53364-9795-4a5f-b013-48dcbadb6bba\"}"},{"__ref":"DeepDives:{\"uuid\":\"22ac64bb-0b73-41a4-92ac-612d50b499d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"5d255471-9c72-4ad2-bb60-74032557a5cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"61ff9594-4cf8-48c7-8bff-e803ac0d211c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1c0bee9e-dde1-4265-a90d-19be196698fb/-/preview/-/format/jpg/","https://ucarecdn.com/027cf902-65b5-40ec-8305-b218f7d51f36/-/preview/-/format/jpg/","https://ucarecdn.com/9db5fed6-45eb-43da-905b-b401aa211e4c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"edc61f8f-5d91-42ce-b17a-10280ccb225c\"}"},{"__ref":"Education:{\"uuid\":\"7f5b2cd5-afd9-42fa-9f1a-e53940ef4d9e\"}"}],"hiredAt":"2025-03-26T01:08:36.518Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Writing","Academic Coaching","College Essay Writing","Computer Science","Executive Function","History","Reading","Sports Journalism","Business / Entrepreneurship","Finance / Investing","Machine Learning / AI","Sports Analytics","STEM Project","Journalism","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"matthew-darshan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"cc5c8b3e-31af-4301-b6ff-5766deab51e3\"
