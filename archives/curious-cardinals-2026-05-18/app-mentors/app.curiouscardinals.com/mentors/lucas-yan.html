xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"755dfcbc-eabd-4178-b1ca-0a9b8ab9b3ff\"}":{"__typename":"Favorites","uuid":"755dfcbc-eabd-4178-b1ca-0a9b8ab9b3ff","photoUrl":"https://ucarecdn.com/dc818b8d-3732-4839-bf90-b8331274e891/","title":"The Lumineers","type":"ARTIST"},"Favorites:{\"uuid\":\"5a4d6398-e6d9-47b5-87af-6cd59b9c55a9\"}":{"__typename":"Favorites","uuid":"5a4d6398-e6d9-47b5-87af-6cd59b9c55a9","photoUrl":"https://ucarecdn.com/1270a6ae-ddb3-4883-bedb-8149297d70a7/","title":"Soccer","type":"SPORT"},"Favorites:{\"uuid\":\"ecd729e1-ca24-452c-978d-6423bdf6da53\"}":{"__typename":"Favorites","uuid":"ecd729e1-ca24-452c-978d-6423bdf6da53","photoUrl":"https://ucarecdn.com/fa81d6bc-f48c-49e6-b5b1-26ec6652cfea/","title":"Freakonomics","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d34e7a4f-bd88-4d3a-a5ea-c55e3bfdc7d8\"}":{"__typename":"DeepDives","uuid":"d34e7a4f-bd88-4d3a-a5ea-c55e3bfdc7d8","content":"\u003cp\u003eFrom sports to music to academics, I've always had the privilege of being mentored by really accomplished, yet equally compassionate and supportive, mentors. They have inspired me to constantly push to grow as a student and person, and are also part of the reason why I hope to pay that warmth and guidance forward by mentoring the next generation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"95ae628b-b80e-4e16-bd21-1c317b583f73\"}":{"__typename":"DeepDives","uuid":"95ae628b-b80e-4e16-bd21-1c317b583f73","content":"\u003cblockquote\u003e\u003cp\u003eWhen I was eight, I used to play a game where I would guesstimate roughly how much money a nearby restaurant would make every day. My guesses were probably way off, but this sparked my interest in numbers and businesses, with this curiosity later evolving into what is now my double major: Econ and Statistics \u0026amp; Data Science. These days, I like to read the news every morning to keep up with global affairs and see how economic trends and data shape the world around us.\u003c/p\u003e\u003cbr\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"4390ea48-af37-4707-b55a-f85d4655acec\"}":{"__typename":"DeepDives","uuid":"4390ea48-af37-4707-b55a-f85d4655acec","content":"\u003cp\u003eGrowing up in a family that speaks five different languages at home and has roots across four countries, multicultural identity and perspectives has always been central to who I am. I naturally seek to understand different viewpoints, and I'm always looking to help foster inclusive spaces where people from all backgrounds feel empowered to share their talents and experiences. \u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"7aee4ee5-805b-46d4-87b5-ce1898df5fc0\"}":{"__typename":"DeepDives","uuid":"7aee4ee5-805b-46d4-87b5-ce1898df5fc0","content":"\u003cp\u003eMy dream job is to run an international sports franchise! I would love to manage a portfolio of sports club that compete at the highest level and brings fan together through unforgettable experiences. In addition, I would love for each club to reflect the unique local culture and community, making every team a source of pride for its people and region.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"f11c48b9-7488-49d4-8b72-3d7149eeeec8\"}":{"__typename":"Education","uuid":"f11c48b9-7488-49d4-8b72-3d7149eeeec8","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics and Statistics \u0026 Data Science","degree":null},"School:{\"uuid\":\"e252aed8-d336-4744-84c7-1f8020d7de15\"}":{"__typename":"School","uuid":"e252aed8-d336-4744-84c7-1f8020d7de15","name":"Chinese International School","city":"Hong Kong","type":"HIGH","state":"Hong Kong Island","country":"Hong Kong","zip":"00000"},"Education:{\"uuid\":\"13eeeeed-fa25-4e0b-ae08-554ce87d0222\"}":{"__typename":"Education","uuid":"13eeeeed-fa25-4e0b-ae08-554ce87d0222","school":{"__ref":"School:{\"uuid\":\"e252aed8-d336-4744-84c7-1f8020d7de15\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"79db57b1-987f-46c4-a6a7-47c9578dea5e\"}":{"__typename":"MentorPublicProfile","uuid":"79db57b1-987f-46c4-a6a7-47c9578dea5e","displayName":"Lucas Y.","slug":"lucas-yan","biography":"\u003cp\u003eHi! I’m Lucas, a third-year undergraduate student at Yale University. At Yale, I’m double-majoring in Economics and Statistics \u0026amp; Data Science (S\u0026amp;DS), with a minor in Japanese. I’m passionate about developing interdisciplinary thinking across STEM and the social sciences, and I look forward to helping students turn their curiosities into meaningful projects and lifelong learning.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eA bit about me:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eGrowing up in a multicultural family and city, I have always had a keen interest in understanding how different cultures, technologies, and economies shape the world we live in today. At the same time, I also love analytical thinking: breaking down complex problems into smaller pieces, spotting patterns, and using logic and data to make sense of them. By combining these interests, I’ve learned to develop an interdisciplinary mindset that blends quantitative analysis with real-world, human perspectives. This approach has been shaped by experiences including:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLearning to speak five languages growing up\u003c/strong\u003e: English, Mandarin, Japanese, Spanish, Cantonese\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearching statistics and econometrics \u003c/strong\u003ewhile helping publish a college-level textbook with a Pitzer College professor\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eInterning with companies \u003c/strong\u003efrom software startups to multinational investment firms\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eServing as a freshman mentor and academic tutor\u003c/strong\u003e\u003cem\u003e \u003c/em\u003ewhile working with Yale’s Cultural Centers and Economics Department\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I will help students discover and build connections between diverse interests, balancing both interdisciplinary exploration and intellectual depth to support goal-driven learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eHow I can help you:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI work with students of all ages who want to explore and develop:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCore school subjects\u003c/strong\u003e: math, English, science, and social studies\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSTEM and social sciences\u003c/strong\u003e: statistics, computer science, physics, economics, geography\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects: \u003c/strong\u003ewriting college-level research papers, running “lemonade stand” businesses, launching apps, starting school clubs or nonprofits\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege pathways:\u003c/strong\u003e discovering your best-fit major, refining your CV, curating your college list, writing admissions essays\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLong-term skills:\u003c/strong\u003e critical thinking, problem solving, effective communication, leadership\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eWhy I’m qualified to help:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI bring a strong academic foundation and real teaching experience to my mentorship. Through my roles as a Yale freshman mentor, TA for economics classes, and student leader across various extracurricular clubs on campus, I’ve learned how to support students from wide-ranging backgrounds by adapting my approach to their goals, learning styles, and strengths. Prior to college, I also gained hands-on teaching experience through leading a STEM education charity and coaching youth soccer on the weekend. Together, these experiences shape my structured, supportive, and motivating approach to mentorship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session might look like:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eRevisiting previous material to check understanding and progress\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSetting a clear outline and learning goal for the session\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorming ideas, questions, or approaches together\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorking through examples or problems together\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConnecting concepts to real-world applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWrapping up with clear takeaways and next steps\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eFun facts:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI used to play professional soccer in high school\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI like to go on hikes (e.g., Catskills, Andes, Mt Fuji)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI play the guitar and a traditional Chinese instrument called the \u003cem\u003eYangqin\u003c/em\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIn my free time, I like to cook, listen to podcasts, and go on runs\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf exploring a new interest, deepening your current learning, or turning ideas into meaningful passion projects sounds like something you want to pursue, I’m excited to work with you to achieve your long-term goals!\u003c/p\u003e","teachingVideoPlaybackId":"HlAtbkD5FAotW3soQWsggka1gyz5a01mZPVa14f4AMZ00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"755dfcbc-eabd-4178-b1ca-0a9b8ab9b3ff\"}"},{"__ref":"Favorites:{\"uuid\":\"5a4d6398-e6d9-47b5-87af-6cd59b9c55a9\"}"},{"__ref":"Favorites:{\"uuid\":\"ecd729e1-ca24-452c-978d-6423bdf6da53\"}"}],"causesSupported":[],"major":"Economics and Statistics \u0026 Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d34e7a4f-bd88-4d3a-a5ea-c55e3bfdc7d8\"}"},{"__ref":"DeepDives:{\"uuid\":\"95ae628b-b80e-4e16-bd21-1c317b583f73\"}"},{"__ref":"DeepDives:{\"uuid\":\"4390ea48-af37-4707-b55a-f85d4655acec\"}"},{"__ref":"DeepDives:{\"uuid\":\"7aee4ee5-805b-46d4-87b5-ce1898df5fc0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/65e502de-3b0d-45df-8f04-0e03cba403d8/-/preview/-/format/jpg/","https://ucarecdn.com/9b7aab53-b857-4eae-9948-53d7c996ddf1/-/preview/-/format/jpg/","https://ucarecdn.com/dca7ac10-9ea5-467f-b994-751e47d55f85/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"f11c48b9-7488-49d4-8b72-3d7149eeeec8\"}"},{"__ref":"Education:{\"uuid\":\"13eeeeed-fa25-4e0b-ae08-554ce87d0222\"}"}],"hiredAt":"2026-01-19T18:57:01.822Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Physics","Writing","Japanese","Mandarin Chinese","Academic Coaching","College Essay Writing","Computer Science","Economics","Executive Function","History","Reading","Creative Writing","History Project","K-6 Storybook","Sports Journalism","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Sports Analytics","STEM Project","Debate","Journalism","Law / Government / Policy",
