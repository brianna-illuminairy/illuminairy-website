"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"67517712-a511-4e0f-b5eb-3f8487aeea15\"}":{"__typename":"DeepDives","uuid":"67517712-a511-4e0f-b5eb-3f8487aeea15","content":"\u003cp\u003eI love to cook, read, and go on outdoor runs! I also love a good true crime podcast.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"828d1714-54b1-45ae-9e76-50935db85a85\"}":{"__typename":"DeepDives","uuid":"828d1714-54b1-45ae-9e76-50935db85a85","content":"\u003cp\u003eIn high school, I started a voting rights organization called We Will Vote USA. The goal of this org was to give high school seniors the tools necessary to register to vote. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3c040e31-a063-40b8-aec0-66e18baab776\"}":{"__typename":"DeepDives","uuid":"3c040e31-a063-40b8-aec0-66e18baab776","content":"\u003cp\u003eWork smarter not necessarily harder. The biggest piece of advice I would give my younger self would be to stay organized and efficient. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"2c60f2ef-6f07-4b95-90f4-afa0aca6b07b\"}":{"__typename":"Education","uuid":"2c60f2ef-6f07-4b95-90f4-afa0aca6b07b","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"political science and history","degree":"BA"},"School:{\"uuid\":\"3f6b6005-92b2-4774-aeaf-6f4b69204ace\"}":{"__typename":"School","uuid":"3f6b6005-92b2-4774-aeaf-6f4b69204ace","name":"Latin School of Chicago","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60610"},"Education:{\"uuid\":\"accb70a5-7ea7-4a0b-8973-db0b2ed38bd1\"}":{"__typename":"Education","uuid":"accb70a5-7ea7-4a0b-8973-db0b2ed38bd1","school":{"__ref":"School:{\"uuid\":\"3f6b6005-92b2-4774-aeaf-6f4b69204ace\"}"},"startYear":"2008","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"e7d0636a-dbab-4d66-a968-140f06c2262c\"}":{"__typename":"MentorPublicProfile","uuid":"e7d0636a-dbab-4d66-a968-140f06c2262c","displayName":"Nina B.","slug":"nina-michelle","biography":"\u003cp\u003eI am passionate about the law, politics, and government; currently, I am planning to double major in Political Science and History. I am fascinated with American politics and government in particular.\u003cbr\u003e\u003cbr\u003eThis past summer, I interned as a Staff Attorney in Criminal Court; in this role, I researched case law and wrote various memos/orders for my judges. In turn, I have sharpened my tutoring skills in these areas. I also am a student Hoover Fellow this year working on researching the separation of powers. For these reasons, I would love to help students with any writing assignments, research projects, etc. \u003cbr\u003e\u003cbr\u003eIn high school, I was a tutor to six middle school students in an underfunded school district in Chicago's Uptown neighborhood. I would meet with each student for two hours each week, honing my teaching strategies and techniques. I also served as a Teaching Assistant for a junior English class in which we read various books dissecting the American family structure. I created various lesson plans, conducted sessions on textual analyses of complex novels, and held office hours in which I helped students draft and edit their essay assignments. Finally, I served as my high school newspaper's Managing Editor; for this reason, I have a great deal of experience helping my peers improve their writing structure, clarity, concision, and overall argumentation.\u003cbr\u003e\u003cbr\u003e\u003cbr\u003eOutside of the classroom, I love to run, cook, and read. My favorite books are All the King's Men and The Color Purple. I am the youngest of four kids so I enjoy collaboration and working with others. I hope to work with you soon!\u003c/p\u003e","teachingVideoPlaybackId":"nqRUPRNvClIU87BGSHNHI1aSxtqcYbEaj3qkm5aLkX4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1814251c-03a5-4e25-a869-a06ea054c8d2\"}"},{"__ref":"Favorites:{\"uuid\":\"3653b0a5-194c-4f3b-b6b5-91edb3dba586\"}"},{"__ref":"Favorites:{\"uuid\":\"a9a17bbc-d480-47c6-82d3-e0e591ae6780\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"593e4839-7a9c-4a63-9a5b-4a33d44376fb\"}"}],"major":"political science and history","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0083f2c6-6737-49fc-9f4c-8fb6f46087f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"67517712-a511-4e0f-b5eb-3f8487aeea15\"}"},{"__ref":"DeepDives:{\"uuid\":\"828d1714-54b1-45ae-9e76-50935db85a85\"}"},{"__ref":"DeepDives:{\"uuid\":\"3c040e31-a063-40b8-aec0-66e18baab776\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/307e0b20-68ad-47a1-9338-3c42441989ba/-/preview/-/format/jpg/","https://ucarecdn.com/216f8117-f0b0-4f77-897e-5fcab4c241ae/-/preview/-/format/jpg/","https://ucarecdn.com/71d82cb5
