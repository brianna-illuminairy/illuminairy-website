xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f9470df2-c664-4e5c-84c1-54d0e3f13d19\"}":{"__typename":"Favorites","uuid":"f9470df2-c664-4e5c-84c1-54d0e3f13d19","photoUrl":"https://ucarecdn.com/f1016991-4a2a-41a2-9485-b0cd083787dd/","title":"James Gandolfini (The Sopranos)","type":"ACTOR"},"Favorites:{\"uuid\":\"91997edc-0f60-48e6-ba85-9f8ea2ff0e75\"}":{"__typename":"Favorites","uuid":"91997edc-0f60-48e6-ba85-9f8ea2ff0e75","photoUrl":"https://ucarecdn.com/f1016991-4a2a-41a2-9485-b0cd083787dd/","title":"Blue (Joni Mitchell)","type":"ALBUM"},"Favorites:{\"uuid\":\"6f569f4c-49b5-4c63-892f-7cdc16be5ef5\"}":{"__typename":"Favorites","uuid":"6f569f4c-49b5-4c63-892f-7cdc16be5ef5","photoUrl":"https://ucarecdn.com/f1016991-4a2a-41a2-9485-b0cd083787dd/","title":"Tennis!","type":"SPORT"},"CausesSupported:{\"uuid\":\"c489a5eb-0870-45f3-8084-1d88452a04db\"}":{"__typename":"CausesSupported","uuid":"c489a5eb-0870-45f3-8084-1d88452a04db","name":"ASTEP (Artists Striving To End Poverty)","description":"","photoUrl":"https://ucarecdn.com/8501f63a-072a-4f57-bcab-89e63de24879/"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"504764b1-0618-4161-b071-d45e8fa11d01\"}":{"__typename":"DeepDives","uuid":"504764b1-0618-4161-b071-d45e8fa11d01","content":"\u003cp\u003eEvery success has a source, and for me, that source has always been those who've believed in me. This is the thing I'm most grateful for in the world. Parents, teachers, teammates, castmates (even mentees!). At this point in my life, I feel as though I am the product of everyone who's ever given me the time of day, and there's nothing more I'm more grateful for in the world.\u003cbr\u003e\u003cbr\u003eMentorship turns this gratitude outward. As lucky as I am to feel so nurtured, I am even luckier, and frankly, motivated to offer that same feeling onto others. I want to foster that same sense of possibility that others have fostered in me: the ability of look at the world not as a fixed set of conditions, but as a constantly evolving and growing thing. To be (and the pun is semi-intended) curious.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"6f78ce0d-9ad9-4334-85a1-5bfe6d8af348\"}":{"__typename":"DeepDives","uuid":"6f78ce0d-9ad9-4334-85a1-5bfe6d8af348","content":null,"videoPlaybackId":"oRae1OY7UQG8PkeYLkS2KVfrTSf7ignITyys019GGfQo","question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8dedec9f-d30a-46df-84bb-a9bbf799943b\"}":{"__typename":"DeepDives","uuid":"8dedec9f-d30a-46df-84bb-a9bbf799943b","content":"\u003cp\u003eI love cooking! I think it's an awesome way to exercise curiosity and creativity in a fun, low-stakes way. Few things make me happier than walking into the kitchen with nothing close to an idea of a meal, and just letting my instincts for which types of flavors work together take over. It is an endlessly comforting and exhilarating way to spend time, and at the end of it, I get to eat dinner! Working from recipes is also a super fun way to cook as well -- right now, I'm working on perfecting my version of this roasted vegetable and walnut spread called Phkali, which is a traditional dish from Georgia (the country, not the state!), where my family is from.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"cfdadc05-0298-43a9-bfdb-352aa7ef1d7f\"}":{"__typename":"School","uuid":"cfdadc05-0298-43a9-bfdb-352aa7ef1d7f","name":"Germantown Academy","city":"Fort Washington","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19034"},"Education:{\"uuid\":\"8714fef9-a6b2-411c-ac2b-2b6f813ffe47\"}":{"__typename":"Education","uuid":"8714fef9-a6b2-411c-ac2b-2b6f813ffe47","school":{"__ref":"School:{\"uuid\":\"cfdadc05-0298-43a9-bfdb-352aa7ef1d7f\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"d1cd9156-6d29-4d1d-9609-1dee88c7fbf7\"}":{"__typename":"Education","uuid":"d1cd9156-6d29-4d1d-9609-1dee88c7fbf7","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"English (Creative Writing)","degree":null},"MentorPublicProfile:{\"uuid\":\"e15ee70b-8368-4543-8513-f5b801ad93d1\"}":{"__typename":"MentorPublicProfile","uuid":"e15ee70b-8368-4543-8513-f5b801ad93d1","displayName":"Danny R.","slug":"daniel-ari","biography":"\u003cp\u003eI’ve always made it my mission to make people feel heard. I think when people feel heard, they’re able to become the fullest possible versions of themselves, and that’s always my goal when I set foot in a room.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAs an artist and teacher, it’s really important to me to make people feel connected by means of their imaginations. Not just expanding \u003cem\u003ewhat\u003c/em\u003e someone thinks or imagines, but expanding \u003cem\u003ehow\u003c/em\u003e they think about things. In some ways, it’s kind of like the quote about catching someone a fish vs. teaching them to fish, except with less fishing. Unfortunately, I don’t teach fishing.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eThere’s a quote I love from the poet Ocean Vuong that I’m semi-paraphrasing, and it says that people become their best selves when they are learning. I think this is a profound observation, and it’s as true of teachers as it of students, coaches as it of athletes, mentors as it of mentees.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAs a mentor (and as a person more broadly), I really try to help people tap into the version of themselves that they strive to be, and in a lot of ways, I think it’s because that's what people do for me. They make me feel grounded, challenged, hopeful. They broaden my world.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI say all of this to contextualize where I come from, what I do, and where I hope to go. I’m originally from Rydal, a small neighborhood at the edge of Northeast Philadelphia. I’m a recent graduate of Stanford University, where I studied English and minored in Music, and I’m currently getting my Masters in Songwriting and Music Production from the Berklee School of Music.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eOutside of school, I’m a musician, actor, teacher, brother to three siblings, son to two parents, tennis player, Philadelphia 76ers superfan, hobby-chef, and a lot of other things. But when I think about who is walking into the room in every single room that I walk into, I think that person is someone who wants people to feel more like themselves.\u003c/p\u003e","teachingVideoPlaybackId":"000284AbCJNQTGiQj5Uoy7QHYT02Ybs3JdKBp4qa8k00Va8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething \"big\" and something \"small,\" cause one without the other doesn't feel like me, and they both mean just as much to me :)\u003cbr\u003e\u003cbr\u003e1. I graduated Phi Beta Kappa in college, which meant a lot to me because I matured and changed so much while I was there, but never felt like I lost sight of who I was or was being \"somebody else.\" Even though awards are just awards, and external affirmation is not especially sustaining, PBK really affirmed my faith in myself and the way I approached my undergrad. \u003cbr\u003e\u003cbr\u003e2. I come from a large family, but still feel like I have a unique relationship with each person (and both of the dogs, too). I am close to my mom differently than how I'm close to my dad, and the way I interact with each of my brothers is distinct and specific. This makes me feel really proud because it wasn't always the case -- I used to appreciate them as a collective, but the now the relationships are as unique as ever, and that feels special to me.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f9470df2-c664-4e5c-84c1-54d0e3f13d19\"}"},{"__ref":"Favorites:{\"uuid\":\"91997edc-0f60-48e6-ba85-9f8ea2ff0e75\"}"},{"__ref":"Favorites:{\"uuid\":\"6f569f4c-49b5-4c63-892f-7cdc16be5ef5\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"c489a5eb-0870-45f3-8084-1d88452a04db\"}"}],"major":"English (Creative Writing)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"504764b1-0618-4161-b071-d45e8fa11d01\"}"},{"__ref":"DeepDives:{\"uuid\":\"6f78ce0d-9ad9-4334-85a1-5bfe6d8af348\"}"},{"__ref":"DeepDives:{\"uuid\":\"8dedec9f-d30a-46df-84bb-a9bbf799943b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6168327d-050d-4f32-b60c-40d0b7ace453/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8714fef9-a6b2-411c-ac2b-2b6f813ffe47\"}"},{"__ref":"Education:{\"uuid\":\"d1cd9156-6d29-4d1d-9609-1dee88c7fbf7\"}"}],"hiredAt":"2023-10-21T11:07:25.897Z","topics":["Music","Writing","Film / Theater"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"daniel-ari\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e15ee70b-8368-4543-8513-f5b801ad93d1\"}"}}},"_sentryTraceData":"fc03965b7a1a4981b803ccca2fb13fd5-b1218101210fd57a-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=fc03965b7a1a4981b803ccca2fb13fd5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"daniel-ari"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
