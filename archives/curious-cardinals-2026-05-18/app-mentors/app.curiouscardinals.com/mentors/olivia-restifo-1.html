xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"46ae8fbb-cdb5-4b08-b956-04819aaa99fe\"}":{"__typename":"DeepDives","uuid":"46ae8fbb-cdb5-4b08-b956-04819aaa99fe","content":"\u003cp\u003eI would tell my younger self that as cheesy as it seems, the most important thing in your life is you. Investing in yourself, whether that means teaching yourself a new skill, learning a new language, or whatever makes you feel fulfilled and ready for the future, is the best thing you can do to become a well rounded and thoughtful person.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"2d7bb0ce-3f10-423b-b18a-d21e92837b8d\"}":{"__typename":"DeepDives","uuid":"2d7bb0ce-3f10-423b-b18a-d21e92837b8d","content":"\u003cp\u003eIn high school and middle school, I was  loud and outspoken and always up to something out of the box, whether it was starting a duct tape wallet business or making homemade caramels for my friends and family. Even though I was talkative, I was definitely afraid to truly express myself with no barriers or fear of judgement. I know how it feels to be insecure in your academics, social life, or anything else, because I have probably been there sometime in my life. Luckily, there is always a place for you to be your true self, and I promise I won't judge :).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"0429bdcd-9258-4db4-b4a1-f8d83396b5bf\"}":{"__typename":"DeepDives","uuid":"0429bdcd-9258-4db4-b4a1-f8d83396b5bf","content":"\u003cp\u003eMy relationships with my friends. I currently live with five of my best friends who I have known for years, and each of these friendships took a lot of love and trust to build up. They are my closest confidants and I am so happy that I'm able to have their companionship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"737f759c-5d65-485a-94ec-13667a14a42e\"}":{"__typename":"DeepDives","uuid":"737f759c-5d65-485a-94ec-13667a14a42e","content":"\u003cp\u003eI lived in a world of giants, where everything was massive and the possibilities were endless- you could grab the clouds and play with the stars. Even though we could do huge things, the one most sought after and priceless thing was to be able to reach down to the ground and pick a tiny flower. It was a really odd dream, and I recall stomping over fields of the precious little flowers by accident. There's a metaphor in there somewhere, I'm sure of it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}":{"__typename":"School","uuid":"e5a76254-778b-4843-9fe4-18689765e318","name":"Sidwell Friends School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20016"},"Education:{\"uuid\":\"042e9cfc-4371-4012-91ca-210cddfcbf6e\"}":{"__typename":"Education","uuid":"042e9cfc-4371-4012-91ca-210cddfcbf6e","school":{"__ref":"School:{\"uuid\":\"e5a76254-778b-4843-9fe4-18689765e318\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"8544f35c-5907-4809-b6d5-4a105d35088b\"}":{"__typename":"Education","uuid":"8544f35c-5907-4809-b6d5-4a105d35088b","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Molecular, Cell, and Developmental Biology","degree":"BS"},"MentorPublicProfile:{\"uuid\":\"6ba461cc-ef76-4e9f-bf80-1495df33a7cc\"}":{"__typename":"MentorPublicProfile","uuid":"6ba461cc-ef76-4e9f-bf80-1495df33a7cc","displayName":"Olivia R.","slug":"olivia-restifo-1","biography":"\u003cp\u003eHello! My name is Olivia and I am a self proclaimed and proud science geek. My studies focus on molecular biology and clinical research, but I love chemistry, biology, math, and more. My love of science began in high school, where I was able to work in a research lab at the National Institutes of Health and was a co-author on a paper about the treatment of lung cancer. I continued working at the National Institutes of Health after starting college at UCLA, where I am the president of a club called Health and Wellness Advocates that promotes health literacy in underserved communities. I love to draw, paint, and crochet, and I believe that science and creativity are deeply intertwined in a way that is often overlooked. I have worked in a variety of research labs and all of them have required me to think outside of the box and use creativity to visualize and solve problems. I am also involved in the Beta Xi chapter of Kappa Alpha Theta, where I am a member of the bylaws committee. I love to spend time with friends and family, especially doing activities like making fun T-shirts, doing puzzles, playing board games, or taking long walks with no map or destination, just to explore. I worked as my school’s math tutor during my time at Sidwell Friends School, and I loved that I was able to work with students to find ways to make big concepts click. I am excited to form relationships with my mentees where we are able to work with their skills rather than against them, using things that come naturally to them to build upon their schoolwork that may seem harder to grasp at first. One thing that I have learned through my years at school is that science is for everyone, and it is pretty fun to understand the way the world around you works. That’s all from me!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Molecular, Cell, and Developmental Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"46ae8fbb-cdb5-4b08-b956-04819aaa99fe\"}"},{"__ref":"DeepDives:{\"uuid\":\"2d7bb0ce-3f10-423b-b18a-d21e92837b8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"0429bdcd-9258-4db4-b4a1-f8d83396b5bf\"}"},{"__ref":"DeepDives:{\"uuid\":\"737f759c-5d65-485a-94ec-13667a14a42e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ba030007-1601-44d4-a95b-11e6bb69df00/-/preview/-/format/jpg/","https://ucarecdn.com/796ed35d-461c-4fdb-8615-a6cdd495ed42/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"042e9cfc-4371-4012-91ca-210cddfcbf6e\"}"},{"__ref":"Education:{\"uuid\":\"8544f35c-5907-4809-b6d5-4a105d35088b\"}"}],"hiredAt":"2023-12-05T23:40:09.042Z","topics":["Pre-
