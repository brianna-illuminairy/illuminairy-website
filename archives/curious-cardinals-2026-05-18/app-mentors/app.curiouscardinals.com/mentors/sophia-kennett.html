xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c248b834-bd78-43db-adb3-c52331b50425\"}":{"__typename":"DeepDives","uuid":"c248b834-bd78-43db-adb3-c52331b50425","content":null,"videoPlaybackId":"fwISvStSk6D9Cxm0001012r5L02tmtbb9kRAA7jM5hq9lMg","question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"dceff7eb-614a-490c-ad40-88ea04869301\"}":{"__typename":"DeepDives","uuid":"dceff7eb-614a-490c-ad40-88ea04869301","content":null,"videoPlaybackId":"o02pmpMXXXbOY8LOEQfVIfGODzd6s4aCxYP3ohFK1sjQ","question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2a2b62c0-bba8-4142-b019-2fb4cb700301\"}":{"__typename":"DeepDives","uuid":"2a2b62c0-bba8-4142-b019-2fb4cb700301","content":null,"videoPlaybackId":"Utt2qrO1qAUUnuMN0016sI6PFUVlgqbvKkiCdvBgxwdY","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"cf509aca-c2ec-491e-810e-69e935c7b626\"}":{"__typename":"School","uuid":"cf509aca-c2ec-491e-810e-69e935c7b626","name":"Breese Central Community High School","city":"Breese","type":"HIGH","state":"Illinois","country":"United States","zip":"62230"},"Education:{\"uuid\":\"fd2a8ab9-8dd0-4b5d-a3e9-f23d0c8238bc\"}":{"__typename":"Education","uuid":"fd2a8ab9-8dd0-4b5d-a3e9-f23d0c8238bc","school":{"__ref":"School:{\"uuid\":\"cf509aca-c2ec-491e-810e-69e935c7b626\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"8bc92c79-465d-4197-a24d-f1de3bd6e448\"}":{"__typename":"Education","uuid":"8bc92c79-465d-4197-a24d-f1de3bd6e448","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Bioengineering","degree":null},"MentorPublicProfile:{\"uuid\":\"af454152-88ca-4735-96c0-e1c50b19d4bc\"}":{"__typename":"MentorPublicProfile","uuid":"af454152-88ca-4735-96c0-e1c50b19d4bc","displayName":"Sophia K.","slug":"sophia-kennett","biography":"\u003cp\u003eHello to all potential students and families!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a high school student, and honestly even before that, I was always very driven and focused. I made a list when I was 10 years old of everything I would do to get into Stanford with a focus on being premed, and year by year I checked off everything. I never strayed from the path. And now, in the middle picture, you can see me working on building a flight model for an experiment that will be sent to space. You wouldn’t know it from the photo alone, but it was actually taken in Germany. I’ve completed two years at Stanford, spent one quarter studying abroad in Berlin, and fell in love with Germany so much that I’ve been on a leave of absence working at a space biotech startup, something I never thought would be part of my college plan. It’s definitely something that would blow younger Sophia’s mind.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe point is, I went from being very strict and focused on long-term goals to now allowing myself to explore new things and figure things out as I go, because I believe as long as you’re doing something, that something will point you closer to what you really want. It doesn’t have to be perfect!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI care a lot about mentoring students because I didn’t have one during the college application process, and it definitely would have been helpful. I do have mentors now, though, and I feel responsible for sharing all the knowledge I’ve collected to help others achieve their goals. Especially right now, living in Germany, I miss that aspect of mentoring in my life, and with extra time, what better way to spend it?\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA quick background on what I study: bioengineering with premed classes (though I’m still undecided if medicine is the path for me), and hopefully I’ll be starting a coterm in aerospace engineering when I go back to Stanford. At school, I spend my time in lots of classes and projects, my favorite one so far being dissecting a human arm with the Chief of Plastic Surgery! I also do research in the Systems Neuroscience and Pain lab, volunteer as an EMT, TA for the EMT class, and volunteer at the hospital with kids by playing sports with them. On top of that, I work on various projects for Stanford Health Consulting Group and Google Student Developers Club, with plans to be more active in Stanford Flight Club, Stanford Space Initiative, and new research when I return.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of that, I’m a very competitive person. I love playing games like Settlers of Catan, Codenames, and Monopoly Deal. You can always find me playing sports too, whether that’s rec basketball, beach volleyball, boxing, spikeball, you name it. Traveling is another priority of mine at the moment; I’ve been to 13 countries and counting, and while at Stanford I love doing spontaneous weekend trips with friends to places like Hawaii, Yosemite, or Lake Tahoe.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am experienced in mentoring students in a wide range of subjects, including math, science, biology, chemistry, physics, and college essay writing. I also help with academic coaching, executive functioning, organization, exploring passions, and finding new opportunities, whatever a student might need. Students interested in premed, biotech, or aerospace, (or even the intersection of all three), are especially welcome!\u003c/p\u003e","teachingVideoPlaybackId":"NzgImYAPrg9gUuxD9Q8m00eGjrFsPdgHAnWBA200KTwGk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Bioengineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c248b834-bd78-43db-adb3-c52331b50425\"}"},{"__ref":"DeepDives:{\"uuid\":\"dceff7eb-614a-490c-ad40-88ea04869301\"}"},{"__ref":"DeepDives:{\"uuid\":\"2a2b62c0-bba8-4142-b019-2fb4cb700301\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/45623bca-59c3-4c14-97a8-3112f49d9f79/-/preview/-/format/jpg/","https://ucarecdn.com/f5d015dc-50c2-4540-afff-3930c63e55ca/-/preview/-/format/jpg/","https://ucarecdn.com/947f46a4-427f-4b45-9324-4d8b65a25f4f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fd2a8ab9-8dd0-4b5d-a3e9-f23d0c8238bc\"}"},{"__ref":"Education:{\"uuid\":\"8bc92c79-465d-4197-a24d-f1de3bd6e448\"}"}],"hiredAt":"2025-09-04T19:00:22.358Z","topics":["Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Medicine / Health","STEM Project","Aviation / Aerospace","K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorP
