xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"bcbc8e61-7ed2-411c-8417-edd01c4b488e\"}":{"__typename":"DeepDives","uuid":"bcbc8e61-7ed2-411c-8417-edd01c4b488e","content":"\u003cp\u003eMy dream job is what I'm doing now! As a scientist in the beauty industry, I get to work with all types of chemicals and machines to formulate skincare products.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"8fa09378-49aa-48e1-ae1d-31618512bf2d\"}":{"__typename":"DeepDives","uuid":"8fa09378-49aa-48e1-ae1d-31618512bf2d","content":"\u003cp\u003eI was always going to camps in the summers. Most of the camps were focused around STEM, which meant I was always working on hands-on projects. I also loved to babysit and tutor the kids in my neighborhood!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"17b27ace-f2b3-4099-9405-818060c821ea\"}":{"__typename":"DeepDives","uuid":"17b27ace-f2b3-4099-9405-818060c821ea","content":"\u003cp\u003eI chose my major because I actually couldn't make a decision! It sounds silly, but I had so many interests that picking just math or biology or chemistry didn't seem right. I picked biomedical engineering because it was a perfect blend of so many different things. Through my major I was able to take classes in anatomy, physics, computer science, biology, physiology, and so much more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"46396539-bc22-4171-9fd6-80fdf1869a6a\"}":{"__typename":"DeepDives","uuid":"46396539-bc22-4171-9fd6-80fdf1869a6a","content":"\u003cp\u003eI love playing pickleball with my friends especially on a nice day outside. I also love food, which means cooking and trying new restaurants are usually what you can find me doing in my spare time. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"94cd136f-1eb2-4e1a-9fab-3a7f55045954\"}":{"__typename":"School","uuid":"94cd136f-1eb2-4e1a-9fab-3a7f55045954","name":"John Overton High School","city":"Nashville","type":"HIGH","state":"Tennessee","country":"United States","zip":"37220"},"Education:{\"uuid\":\"5429ac7b-310d-4c9d-a103-c44578e75005\"}":{"__typename":"Education","uuid":"5429ac7b-310d-4c9d-a103-c44578e75005","school":{"__ref":"School:{\"uuid\":\"94cd136f-1eb2-4e1a-9fab-3a7f55045954\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"4f1d1d4b-2139-42d4-ab08-f4a1c5ba53f5\"}":{"__typename":"Education","uuid":"4f1d1d4b-2139-42d4-ab08-f4a1c5ba53f5","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"bcab1199-cc4e-49a8-8c9f-94141096a3a2\"}":{"__typename":"MentorPublicProfile","uuid":"bcab1199-cc4e-49a8-8c9f-94141096a3a2","displayName":"Ashley K.","slug":"ashley-kwak","biography":"\u003cp\u003eHi!\u003c/p\u003e\u003cp\u003eMy name is Ashley, and I recently graduated from Yale in 2024 as a Biomedical Engineering major. For my senior thesis, I worked in a dermatology lab and helped develop a sunscreen using bioadhesive nanoparticles. This led me to my current job, where I am a scientist for a beauty company on the skincare team. At Yale, I was very involved in the entrepreneurship world. I helped start Yale's first Young Entrepreneurs Program, where we helped middle and high school students develop their own ventures. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've been tutoring since I was in high school (almost 10 years now) in all different subjects. I've tutored in one-on-one sessions and over Zoom in various subjects. I have also taught ACT math and science courses for up to 15 students for a few summers. With my range of experiences, I am confident that I can use my skills to keep your child engaged, interested, and passionate about what they are learning! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a student, I was always excited to create something from scratch. I've started several student organizations and have spearheaded my own research projects. I am hoping to bring this entrepreneurial spirit to my future mentees. Whether I'm helping them start their own organization, venture, or research project, I know the structure and guidance I provide will allow for them to bring their ideas to life!\u003c/p\u003e","teachingVideoPlaybackId":"ylho00UtCB8HKgSD2Zjrp7nfFb4VyMSNvxAaId00b015jE","teachingVideoDescr
