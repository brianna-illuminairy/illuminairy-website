xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"fad5d61f-4aac-4bff-b143-5da0ace59443\"}":{"__typename":"CausesSupported","uuid":"fad5d61f-4aac-4bff-b143-5da0ace59443","name":"Urban Resources Initiative","description":"\u003cp\u003eNon-profit that greens low tree area of New Haven, CT.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/f61e25b5-0595-4d2a-9fb0-cb41cb2ce56b/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e84651e7-4895-4303-8c2c-ad8fc531fa21\"}":{"__typename":"DeepDives","uuid":"e84651e7-4895-4303-8c2c-ad8fc531fa21","content":"\u003cp\u003eMy most rewarding high school project, an architectural research book and lamp series, grew to be so much more with the help of my academic mentor. He helped the project grow into the foundation for a class and permanent exhibition at my high school. It reached far more people and made much more of an impact than it would have otherwise, with just me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4461f26c-5d62-4119-9038-295f9f2e88f1\"}":{"__typename":"DeepDives","uuid":"4461f26c-5d62-4119-9038-295f9f2e88f1","content":"\u003cp\u003eReally reflect on what academic success means to you so that you can set yourself on the right path. Challenge your assumptions about what you think you need to do to get there. As long as you are learning and mastering the things that interest you, you are on the right path!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e3790bbc-6beb-41db-b5ce-98537a6cb85c\"}":{"__typename":"DeepDives","uuid":"e3790bbc-6beb-41db-b5ce-98537a6cb85c","content":"\u003cp\u003eI would love to design and help renovate my own fixer upper one day. There are many, many hand drawings and 3D models on my computer of ideas that are ready to see the real world. I just need the time and resources. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"bf5d6800-7211-4fdd-b818-bc87d4dd18f5\"}":{"__typename":"DeepDives","uuid":"bf5d6800-7211-4fdd-b818-bc87d4dd18f5","content":"\u003cp\u003eI'm currently trying to hone the design of a floating park that I designed for my senior studio. It's called Living Edges, and uses mangroves to clean river pollution and combat sea level rise in Miami, Florida.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"304838a5-7f2d-4c7e-918e-bc52af6ab6e8\"}":{"__typename":"School","uuid":"304838a5-7f2d-4c7e-918e-bc52af6ab6e8","name":"Convent \u0026 Stuart Hall","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94115"},"Education:{\"uuid\":\"6f4f55d4-0bab-47e8-b34f-575207e195ab\"}":{"__typename":"Education","uuid":"6f4f55d4-0bab-47e8-b34f-575207e195ab","school":{"__ref":"School:{\"uuid\":\"304838a5-7f2d-4c7e-918e-bc52af6ab6e8\"}"},"startYear":"2005","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b53be540-78de-4e95-b714-e3764f0e9268\"}":{"__typename":"Education","uuid":"b53be540-78de-4e95-b714-e3764f0e9268","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Architecture, design track","degree":null},"MentorPublicProfile:{\"uuid\":\"ba8616f6-c657-4de1-a9a3-2d344285a6e6\"}":{"__typename":"MentorPublicProfile","uuid":"ba8616f6-c657-4de1-a9a3-2d344285a6e6","displayName":"Leet M.","slug":"leet-miller","biography":"\u003cp\u003eHello! My name is Leet and I just graduated this May from Yale with a B.A. in architecture,\u0026nbsp;with distinction.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince graduation, I have been working for\u0026nbsp;a non profit that plants\u0026nbsp;trees in New Haven, CT. After two desk-bound architecture\u0026nbsp;internships, I decided that this summer I wanted to\u0026nbsp;exercise my green thumb and spend time outside in the incredible state of Connecticut. I am looking forward to heading back to my hometown, San Francisco, this fall.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAway from the classroom at Yale, I loved workouts with club\u0026nbsp;running, discussions and field trips with my architecture-urban studies interest group,\u0026nbsp;and I had a blast growing my own photography business and website portfolio. I took graduation portraits and photographed club events. I also love all things outdoors, from camping and hiking, to sports like tennis, skiing, and biking.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFrom a young age, I was always interested in the built world and making things. Wood blocks were my first tools, which later\u0026nbsp;became Minecraft, and eventually computer programs like Sketchup and Rhino that I used for real world projects. In high school, at my childhood home, my parents let me design-build three projects: a living\u0026nbsp;wall. a water recycling mechanism for our backyard during a drought, and a home library.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile both the living wall and the bookshelves were successes (90% parent approval rating), the water recycling system had some unfortunate issues. In fact, one of the issues caused it to flood my family dinner... not just once, but on three separate occasions. Rest assured, I will not help your child flood your home!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe point is that my mission is to translate your child's love for architecture, design, photography, or 'making things' into projects that give back, make an impact, or encourage them to have fun\u0026nbsp;while building their interests. I am excited to provide advice, inspiration, and tools to students who don't know where to start on their passion projects or assignments that could benefit from creativity. I cannot wait to help students on their journeys towards producing incredible things! Let's create.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"2usPHV3zdNqn4jjanB00GztgGkVcN01F6vagu9mB5otOM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"fad5d61f-4aac-4bff-b143-5da0ace59443\"}"}],"major":"Architecture, design track","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e84651e7-4895-4303-8c2c-ad8fc531fa21\"}"},{"_
