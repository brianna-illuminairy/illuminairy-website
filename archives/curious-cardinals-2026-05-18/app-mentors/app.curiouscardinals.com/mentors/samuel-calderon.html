xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c8742f6d-255f-4c69-a068-d9170d4c6d58\"}":{"__typename":"Favorites","uuid":"c8742f6d-255f-4c69-a068-d9170d4c6d58","photoUrl":"https://ucarecdn.com/ab045108-2df8-4997-b543-106765eef742/","title":"Kingdom Hearts ","type":"GAME"},"Favorites:{\"uuid\":\"2059613f-e816-4856-88d2-716b2b76885d\"}":{"__typename":"Favorites","uuid":"2059613f-e816-4856-88d2-716b2b76885d","photoUrl":"https://ucarecdn.com/bea6c23f-f96e-4634-8f08-6c878fe9a967/","title":"Rugby","type":"SPORT"},"Favorites:{\"uuid\":\"f23d9bda-ff08-4509-8ffb-44e545960660\"}":{"__typename":"Favorites","uuid":"f23d9bda-ff08-4509-8ffb-44e545960660","photoUrl":"https://ucarecdn.com/c9443883-8c29-48ba-9528-0e52ba4904b6/","title":"Singapore","type":"CITY"},"CausesSupported:{\"uuid\":\"3bc42252-3597-4d7b-bf3f-8bd964234e1b\"}":{"__typename":"CausesSupported","uuid":"3bc42252-3597-4d7b-bf3f-8bd964234e1b","name":"Summer Search ","description":"\u003cp\u003eSupports low income students with mentorship and adventurous experiences\u003c/p\u003e","photoUrl":"https://ucarecdn.com/77bac2c5-e363-45ba-a3f4-ef920cb7b2af/"},"CausesSupported:{\"uuid\":\"c2e2d0ea-2454-498d-8a31-7e68ce0aa542\"}":{"__typename":"CausesSupported","uuid":"c2e2d0ea-2454-498d-8a31-7e68ce0aa542","name":"FEN PAC","description":"\u003cp\u003eFull Employment Now-Political Action Committee, fights for dignified job access\u003c/p\u003e","photoUrl":"https://ucarecdn.com/122b7b97-909c-490f-80eb-f03603136879/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"208611d0-7272-4e93-b48b-bf6ae14e8998\"}":{"__typename":"DeepDives","uuid":"208611d0-7272-4e93-b48b-bf6ae14e8998","content":"\u003cp\u003eKeep moving forward. In life you will live many chapters and you will adapty uniquely to each of them. Embrace this change and what life has to offer you. Sometimes in the seemingly random moments you will see clearly the path ahead of you. Keep moving forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"092b24d4-1c26-44ac-9f52-d1bba390d08d\"}":{"__typename":"DeepDives","uuid":"092b24d4-1c26-44ac-9f52-d1bba390d08d","content":"\u003cp\u003eI believe in the power of people to create meaningful things. I want to be a mentor because I believe that when people are inspired, receive guidance, and have support they can achieve anything they put their mind to. I aspire to be apart of the process of someone becoming the best version of themselves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"16f9227e-0adf-4744-acc3-8eda9c224b48\"}":{"__typename":"School","uuid":"16f9227e-0adf-4744-acc3-8eda9c224b48","name":"University Heights Secondary School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10455"},"Education:{\"uuid\":\"4345a666-87f5-45ee-b580-580332b8d013\"}":{"__typename":"Education","uuid":"4345a666-87f5-45ee-b580-580332b8d013","school":{"__ref":"School:{\"uuid\":\"16f9227e-0adf-4744-acc3-8eda9c224b48\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"f0e22fa0-7eac-49c9-a2ce-e098d93848d0\"}":{"__typename":"School","uuid":"f0e22fa0-7eac-49c9-a2ce-e098d93848d0","name":"Hobart and William Smith Colleges","city":"Geneva","type":"COLLEGE","state":"New York","country":"United States","zip":"14456"},"Education:{\"uuid\":\"7cc2e0e6-d832-4346-a8b7-983e865f4a7f\"}":{"__typename":"Education","uuid":"7cc2e0e6-d832-4346-a8b7-983e865f4a7f","school":{"__ref":"School:{\"uuid\":\"f0e22fa0-7eac-49c9-a2ce-e098d93848d0\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"International Relations ","degree":null},"MentorPublicProfile:{\"uuid\":\"101511a1-a69d-430e-926c-d859c255137d\"}":{"__typename":"MentorPublicProfile","uuid":"101511a1-a69d-430e-926c-d859c255137d","displayName":"Samuel C.","slug":"samuel-calderon","biography":"\u003cp\u003eI deeply care about nature and the ability to experience the world in its fullness standing at the top of a mountain, taking in a wide horizon, and understanding how interconnected people and the environment truly are. Traveling, hiking, and immersing myself in new landscapes have shaped how I see the world and strengthened my commitment to environmental justice. I believe protecting nature is inseparable from protecting people, and that a just world is one where communities and ecosystems are both cared for and respected.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I studied International Relations, which gave me the tools to understand how global systems political, economic, and historical shape everyday life. I studied abroad in Brazil and Chile, where I was exposed to different political traditions, social movements, and approaches to development. Those experiences prepared me to later work in Guatemala, where I spent three years as a Peace Corps Volunteer focused on community economic development. Living and working abroad pushed me to adapt quickly, learn new languages, and live within a different cultural and institutional context while remaining accountable to the communities I served.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMuch of my academic time is spent reading philosophy and political histories, trying to understand how the systems that define our modern world were built and how they might be reimagined. I’m especially interested in how power, extraction, and inequality have shaped both human societies and our relationship with the natural world. Outside of formal study, I spend my time exploring new places, trying new foods, and visiting meaningful landmarks both natural and man-made as a way of learning directly from the world around me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I currently work with a political action committee, collaborating with diverse people to grow the organization and advance a more just economic and political agenda. I’m motivated by collective work and the belief that change happens through relationships as much as policy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my most meaningful accomplishments is having traveled to 13 countries, with the most formative experience being the three years I spent living in Guatemala. Looking ahead, I am preparing to pursue a master’s degree in public policy at the Hertie School of International Relations in Berlin, where I hope to continue building the skills and perspective needed to contribute to a more just, sustainable world.\u003c/p\u003e","teachingVideoPlaybackId":"lWmE5rDgvVUxGeQco4y023kMWIkqsIAEf6nxPcaxl01H00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'm really proud of being the first person in my family to go to graduate college, travel internationally, and live abroad. I take pride on being able to bring back gifts and trinkets to my family. I have spend 3 years in Latin America, and I plan on spending 2 years in both Europe and Asia. I'm excited for the adventures in store for me!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c8742f6d-255f-4c69-a068-d9170d4c6d58\"}"},{"__ref":"Favorites:{\"uuid\":\"2059613f-e816-4856-88d2-716b2b76885d\"}"},{"__ref":"Favorites:{\"uuid\":\"f23d9bda-ff08-4509-8ffb-44e545960660\"}"}],"causesSup
