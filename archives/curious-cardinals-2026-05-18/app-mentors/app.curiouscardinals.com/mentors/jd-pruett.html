xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"52db5708-b972-4621-8107-489d0a9eb46e\"}":{"__typename":"Favorites","uuid":"52db5708-b972-4621-8107-489d0a9eb46e","photoUrl":"https://ucarecdn.com/8da59d6b-627d-468f-9b57-d430dedded47/","title":"4 Your Eyez Only, J. Cole","type":"ALBUM"},"Favorites:{\"uuid\":\"1541b2b4-f3d0-4263-8211-53e3498edfc9\"}":{"__typename":"Favorites","uuid":"1541b2b4-f3d0-4263-8211-53e3498edfc9","photoUrl":"https://ucarecdn.com/6ac8f1e4-1dfb-4add-9fde-7d5f8c2b3770/","title":"The Overstory, Richard Powers","type":"BOOK"},"Favorites:{\"uuid\":\"feb46e97-d9cc-4e32-bd5f-c7b4532cbf47\"}":{"__typename":"Favorites","uuid":"feb46e97-d9cc-4e32-bd5f-c7b4532cbf47","photoUrl":"https://ucarecdn.com/16c22f1e-9346-4ec1-9d1a-75e82c30d967/","title":"Soccer","type":"SPORT"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"8b700fc3-4fba-4a70-9c7f-5d519a228089\"}":{"__typename":"DeepDives","uuid":"8b700fc3-4fba-4a70-9c7f-5d519a228089","content":null,"videoPlaybackId":"w1JKjM84KnGUpZOzsjvs6H4yYWgyJvqnO8GAUgKZPZk","question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c378a1e9-8ddb-4305-9108-8bb30ee6596f\"}":{"__typename":"DeepDives","uuid":"c378a1e9-8ddb-4305-9108-8bb30ee6596f","content":null,"videoPlaybackId":"BUasVFxUNZa249gy202YvHBxgpQnSsvRCccHFLMVa00og","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"57a9aaaa-3dd8-4929-94b7-fd38d9e9e749\"}":{"__typename":"DeepDives","uuid":"57a9aaaa-3dd8-4929-94b7-fd38d9e9e749","content":"\u003cp\u003eMy first summer I spent doing theater. I acted in a few productions, built sets, and worked backstage. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy second summer I attended a program for the ACLU where I was (temporarily) inspired to be a civil rights lawyer. If I weren't on my current path now, my dream would be to be an ACLU lawyer. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy third summer I did a research project at a marine station in Koh Seh, Cambodia, studying and designing a marine protected area for that region. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy last summer I travelled, saw friends, and watched movies. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c6bf309c-d9db-45ad-8a3c-d74e68fb374a\"}":{"__typename":"DeepDives","uuid":"c6bf309c-d9db-45ad-8a3c-d74e68fb374a","content":"\u003cp\u003eI would tell myself that, while it might be unfair, some people's passions find them and other people have to work and search for years to build theirs.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was really hung up for years on finding the perfect thing for me. I loved everything I did - theater, civil rights law, marine conservation — but I always thought the grass might be greener elsewhere. So, I gave up on progress I'd made to start over doing something else.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCuriosity and exploration are absolutely necessary through middle school and high school, but there comes a point where exploration becomes a kind of self-defense mechanism, shielding one from having to \"commit\" to one particular version of oneself and their interests.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'd tell myself to explore broadly and let my curiosities guide me. But that eventually, I should stick with something long enough to let my love and mastery for it grow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"b360f032-967f-4640-a221-b479acd53cda\"}":{"__typename":"School","uuid":"b360f032-967f-4640-a221-b479acd53cda","name":"Northampton High School","city":"Northampton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01060"},"Education:{\"uuid\":\"9b5533e6-02a5-482f-8789-4c3893abc0df\"}":{"__typename":"Education","uuid":"9b5533e6-02a5-482f-8789-4c3893abc0df","school":{"__ref":"School:{\"uuid\":\"b360f032-967f-4640-a221-b479acd53cda\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"9ab5f46e-ab1e-4a5a-9739-2f67fbd36082\"}":{"__typename":"Education","uuid":"9ab5f46e-ab1e-4a5a-9739-2f67fbd36082","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2025","major":"Economics, Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"fe4be440-5d28-4dfe-bb79-12ff622ea2f6\"}":{"__typename":"MentorPublicProfile","uuid":"fe4be440-5d28-4dfe-bb79-12ff622ea2f6","displayName":"JD P.","slug":"jd-pruett","biography":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi :) I'm JD, a neuroscientist in training with a passion for statistics, ethics, and writing. My journey from aimless student to focused researcher was shaped by a professor whose mentorship was more than just guidance. He offered a relationship that helped me navigate the scary process of deciding who to be. I hope to bring that same spirit of mentorship to my students.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI majored in economics and minored in biology at Stanford. Through econ, I discovered a love for stats. Stats and econometrics became my tool for exploring real-world questions in environmental economics, sports, and political polling. Currently, I’m working on publishing my honors thesis, which introduces new methods for analyzing political survey data to improve poll accuracy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow, I’m pursuing a master’s in neuroscience, also at Stanford. While the transition from econ to neuro can seem odd, I was drawn to econ for what it can say about why large groups of people make decisions the way they do — deciding where to live, what to drive, how many kids to have, etc. Neuro takes that interest in decision making one step further - asking at the \u003cem\u003eindividual \u003c/em\u003elevel what we can say about how humans emote, think, and perceive. Now, I apply statistical methods to study how behavioral interventions for binge eating disorders can change people’s brains.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of class, I spend most of my time doing Ethics Bowl, writing, or playing soccer. Ethics Bowl is kinda like debate but weirder and with a philosophy twist. We compete with other teams to build philosophical frameworks that answer hard moral questions about modern dilemmas. It’s where I’ve made my closest friends and what’s taught me to write succinct arguments to difficult questions.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also keep busy with writing projects; I currently have an advance for a book that blends personal essays with discussions of psychoanalysis and developmental psychology.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFinally, I’ve spent the past three years deepening my understanding of personal finance, particularly in real estate investing and options trading. I’m happy to share what I’ve learned about smart money practices.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’d describe myself as warm and easygoing, and my teaching style as supportive but I also expect students to be comfortable with the initial struggle that is always part of understanding. I take great joy in teaching stats, building projects in R or Python, discussing ethics, and helping others find their voice on the page. I believe passions are grown as often as they are found, and I’m excited to help students build confidence and skills around their interests.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"swYZDpfvgB00ujUyWvYPE6nYA02lvdRcnUx4tNJUYs2008","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI took a class that was co-taught by a favorite economics professor of mine and Steve Ballmer, the former CEO of Microsoft. The class was quite demanding, requiring a data-driven essay each week. I worked my ass off and spent most of my Thanksgiving break working on my final project. After the class ended, Steve called me up and asked if I wanted to work for him directly over the summer turning my project proposal into a reality.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI worked for him at his foundation's HQ in Seattle, figuring out how much it would cost to put every kid in Washington State, Los Angeles, and Detroit into a funded afterschool program. I spent the summer meeting and learning from afterschool programs and city officials across the country, eventually writing a $400 million proposal. That proposal is now (slowly) being put into practice, serving as part of the foundation's strategy for afterschool investment.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI learned a lot from Steve that summer, particularly 1) how to write a financial model and 2) how to make the case for your philanthropic cause when there are always competing causes that are after the same grant money.\u003cbr\u003e\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"52db5708-b972-4621-8107-489d0a9eb46e\"}"},{"__ref":"Favorites:{\"uuid\":\"1541b2b4-f3d0-4263-8211-53e3498edfc9\"}"},{"__ref":"Favorites:{\"uuid\":\"feb46e97-d9cc-4e32-bd5f-c7b4532cbf47\"}"}],"causesSupported":[],"major":"Economics, Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8b700fc3-4fba-4a70-9c7f-5d519a228089\"}"},{"__ref":"DeepDives:{\"uuid\":\"c378a1e9-8ddb-4305-9108-8bb30ee6596f\"}"},{"__ref":"DeepDives:{\"uuid\":\"57a9aaaa-3dd8-4929-94b7-fd38d9e9e749\"}"},{"__ref":"DeepDives:{\"uuid\":\"c6bf309c-d9db-45ad-8a3c-d74e68fb374a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/78f5e11f-30b2-45c8-b0c5-caac4994305b/-/preview/-/format/jpg/","https://ucarecdn.com/79c3621d-2be5-4e4e-a2f2-0b3feda06bc0/-/preview/-/format/jpg/","https://ucarecdn.com/8ecc0754-d673-47fc-857a-93213adb35a9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"9b5533e6-02a5-482f-8789-4c3893abc0df\"}"},{"__ref":"Education:{\"uuid\":\"9ab5f46e-ab1e-4a5a-9739-2f67fbd36082\"}"}],"hiredAt":"2024-08-14T03:01:42.293Z","topics":["Debate","Business / Entrepreneurship","Statistics","Medicine / Health","Economics"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibi
