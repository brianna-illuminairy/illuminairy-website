xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8aa65059-1461-486e-a985-d9c31b78791e\"}":{"__typename":"Favorites","uuid":"8aa65059-1461-486e-a985-d9c31b78791e","photoUrl":"https://ucarecdn.com/04fb0868-b13a-4098-85ec-465e3219a2aa/","title":"Latch by Sam Smith \u0026 Disclosure","type":"SONG"},"Favorites:{\"uuid\":\"659d2698-0a3e-4f08-8dce-0e3dbfe30721\"}":{"__typename":"Favorites","uuid":"659d2698-0a3e-4f08-8dce-0e3dbfe30721","photoUrl":"https://ucarecdn.com/a0480e7a-9c44-43d8-93e5-517cef431350/","title":"Lorde Melodrama","type":"ALBUM"},"Favorites:{\"uuid\":\"1c9e535f-86f0-4ed6-b7f1-5cc9cb945c31\"}":{"__typename":"Favorites","uuid":"1c9e535f-86f0-4ed6-b7f1-5cc9cb945c31","photoUrl":"https://ucarecdn.com/d9cc62d7-aa5e-42f6-8a20-1ca13555d2e7/","title":"Jennifer Lawrence","type":"ACTOR"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"b7ee57ac-315e-4067-b5ed-b62480fc7b87\"}":{"__typename":"DeepDives","uuid":"b7ee57ac-315e-4067-b5ed-b62480fc7b87","content":"\u003cp\u003eMentorship matters a lot to me because I truly wouldn’t be where I am today without the mentors I’ve had in my own life. In high school, my sister was one of my biggest mentors, and so were my teachers who supported me and believed in me during important years of growth. Their guidance helped me build confidence and push myself academically and personally.\u003c/p\u003e\u003cp\u003eWhen I came to Yale, one of the best pieces of advice I received was to find a mentor. I was lucky to find that in upperclassmen who took the time to check in on me, encourage me, and help me navigate Yale as a freshman. Even though many of them have graduated, I still stay in touch with them, and their impact has lasted far beyond just college advice.\u003c/p\u003e\u003cp\u003eThat’s why I want to mentor now — I want to be that steady, supportive figure for someone else. I care about how students are doing not only academically, but also socially and professionally. I want students to feel like they have someone in their corner, reminding them that they’re capable of more than they think and that they don’t have to figure everything out alone. I hope I can be someone students can lean on as they grow, learn, and gain confidence in themselves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"1343daf8-0827-4fac-8c50-e90a8a6068ab\"}":{"__typename":"DeepDives","uuid":"1343daf8-0827-4fac-8c50-e90a8a6068ab","content":"\u003cp\u003eSomething I am extremely proud of is how much I’ve grown in college, both academically and personally. Over the past few years, I’ve become more confident in my ability to step into unfamiliar situations, learn quickly, and challenge myself in new ways. Whether it’s in the classroom, through hands-on projects, or in research, I’ve learned how to stay curious, persistent, and open to growth even when things feel difficult at first.\u003c/p\u003e\u003cp\u003eI’m also proud of how I’ve pushed myself to explore interests outside of STEM. During my time studying abroad at Oxford, I had the opportunity to serve as a tour guide at the Ashmolean Museum, which deepened my appreciation for art, history, and storytelling. More recently, I’ve gotten into bookbinding, which has been a creative and rewarding way to learn something completely new.\u003c/p\u003e\u003cp\u003eCollege has taught me that growth doesn’t only come from one path — it comes from trying new things, meeting new people, and allowing yourself to evolve. I’m proud of the person I’ve become through both my academic experiences and the hobbies and communities that have shaped me along the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e1c8d211-6b97-45d3-8379-3427466dbc94\"}":{"__typename":"DeepDives","uuid":"e1c8d211-6b97-45d3-8379-3427466dbc94","content":"\u003cp\u003eIn my spare time, I love reading. My suitemates and I are huge Emily Henry fans, and I also really enjoy books by authors like R.F. Kuang (who is currently doing her PhD at Yale!), so it’s especially exciting to follow her work. Reading has always been one of my favorite ways to relax and escape into different worlds.\u003c/p\u003e\u003cp\u003eI also love doing pottery, which has been a fun and creative hobby for me. Outside of that, I really enjoy spending time with my friends — whether that’s hanging out around campus, trying new places to eat, or just unwinding together after a busy week.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"8e552eb4-58ba-4720-ae78-f21726b66bb1\"}":{"__typename":"DeepDives","uuid":"8e552eb4-58ba-4720-ae78-f21726b66bb1","content":"\u003cp\u003eAs a high school student, I was ambitious but also realistic about my goals. I worked hard in school and cared a lot about doing well, but I also tried to stay grounded and focused on steady growth rather than perfection.\u003c/p\u003e\u003cp\u003eI was really involved in sports throughout high school. I played volleyball and softball during 9th and 10th grade, and then I transferred schools when my family moved. At my new high school, I joined the badminton team during my junior and senior years. That experience taught me a lot about adapting to change and putting myself out there in a new environment.\u003c/p\u003e\u003cp\u003eTransferring schools helped me understand what it feels like to be in a new place, meet new people, and start over socially and academically. It made me more resilient and open to stepping outside my comfort zone.\u003c/p\u003e\u003cp\u003eAcademically, I especially loved math, and I enjoyed the challenge of problem-solving. I was also involved in several honor societies, which reflected how much I valued learning and pushing myself in school.\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoyed being part of my community. I volunteered through Key Club, which gave me opportunities to give back and stay connected to causes beyond the classroom. I was also pretty social and loved being around friends and staying involved in different activities.\u003c/p\u003e\u003cp\u003eOverall, high school was a time when I learned how to balance working hard with building community, exploring my interests, and growing through new experiences.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"5339e1f9-67b8-43b2-8d60-46a105448b85\"}":{"__typename":"School","uuid":"5339e1f9-67b8-43b2-8d60-46a105448b85","name":"Calhoun High School","city":"Merrick","type":"HIGH","state":"New York","country":"United States","zip":"11566"},"Education:{\"uuid\":\"5d2009a3-5643-40f2-a424-323988e30307\"}":{"__typename":"Education","uuid":"5d2009a3-5643-40f2-a424-323988e30307","school":{"__ref":"School:{\"uuid\":\"5339e1f9-67b8-43b2-8d60-46a105448b85\"}"},"startYear":"2021","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"769b5f19-2efc-4272-90cd-61fed9ab32e1\"}":{"__typename":"Education","uuid":"769b5f19-2efc-4272-90cd-61fed9ab32e1","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"5a630ca9-687b-4da7-9f96-8b6b830acf8a\"}":{"__typename":"MentorPublicProfile","uuid":"5a630ca9-687b-4da7-9f96-8b6b830acf8a","displayName":"Sundeep K.","slug":"sundeep-kaur","biography":"\u003cp\u003eHi! My name is Sundeep Kaur, and I’m a junior at Yale University studying Chemical Engineering. I’ve always been fascinated by how chemistry shapes the world around us — from clean energy technologies to the materials we use in everyday life. What excites me most about science is that it allows us to solve real problems, ask meaningful questions, and create systems that can improve people’s lives. I’m also deeply interested in skincare and cosmetic science, and I love understanding how ingredients, formulations, and chemistry come together to create products we use every day.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, I spend much of my time exploring chemical systems through both coursework and hands-on research. I currently work in a lab focused on redox flow batteries, where I run experiments and analyze how energy-storage molecules perform and degrade over time. This research has taught me that science is not just about getting the “right answer,” but about curiosity, persistence, and learning how to problem-solve when results don’t go as expected. I’m especially interested in sustainability and the role that chemistry can play in building a cleaner energy future.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the lab, I’m involved in ChemE Car, where we design and build small chemical-powered vehicles for competitions. My team recently placed fifth nationally at the ChemE Car competition, which was an incredible experience and a testament to collaboration, creativity, and persistence. I love working with others on engineering projects, troubleshooting challenges, and turning ideas into something real.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my favorite parts of Yale is that I’ve been able to combine my love of STEM with my passion for the humanities. I love writing and am a staff writer for Symposia, where I get to highlight student stories and research happening across campus. I’m also deeply interested in art history, and I’m pursuing Yale’s Collections: Objects, Research, Society certificate. This interest was inspired by my study abroad experience at Oxford, where I became fascinated by how history, culture, and storytelling shape the way we understand the world. I love being able to explore both scientific innovation and historical perspectives during my time at Yale.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not studying, I enjoy hobbies that help me recharge. I love pottery and working creatively with my hands, staying active through working out, and listening to music throughout my day.\u003c/p\u003e\u003cp\u003eAs a mentor, I care deeply about helping students feel supported and confident in their learning. STEM subjects can feel intimidating at first, but I truly believe they become exciting when you start asking questions and connecting ideas to the real world. I want students to feel comfortable exploring, making mistakes, and growing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m really looking forward to meeting Curious Cardinals students and helping make learning feel approachable, encouraging, and inspiring.\u003c/p\u003e","teachingVideoPlaybackId":"HYN6TOwQ0033NFIB02Ozb7y5mlOZAY25uUKSJfjPf6Ni8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8aa65059-1461-486e-a985-d9c31b78791e\"}"},{"__ref":"Favorites:{\"uuid\":\"659d2698-0a3e-4f08-8dce-0e3dbfe30721\"}"},{"__ref":"Favorites:{\"uuid\":\"1c9e535f-86f0-4ed6-b7f1-5cc9cb945c31\"}"}],"causesSupported":[],"major":"Chemical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b7ee57ac-315e-4067-b5ed-b62480fc7b87\"}"},{"__ref":"DeepDives:{\"uuid\":\"1343daf8-0827-4fac-8c50-e90a8a6068ab\"}"},{"__ref":"DeepDives:{\"uuid\":\"e1c8d211-6b97-45d3-8379-3427466dbc94\"}"},{"__ref":"DeepDives:{\"uuid\":\"8e552eb4-58ba-4720-ae78-f21726b66bb1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c451434e-62b4-4e2f-bea2-bc1f614732fa/-/preview/-/format/jpg/","https://ucarecdn.com/e43c5e26-0aec-45a6-b84d-a287da95ae68/-/preview/-/format/jpg/","https://ucarecdn.com/8d6f50d0-52a2-44ea-bdc5-9d5b6f93d1b1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5d2009a3-5643-40f2-a424-323988e30307\"}"},{"__ref":"Education:{\"uuid\":\"769b5f19-2efc-4272-90cd-61fed9ab32e1\"}"}],"hiredAt":"2026-02-11T19:01:34.811Z","topics":["Algebra I","Algebra II","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Chemistry","Physics","College Essay Writing","Academic Coaching","History"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sundeep-kaur\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5a630ca9-687b-4da7-9f96-8b6b830acf8a\"}"}}},"_sentryTraceData":"0aca4891d97c4942bab8bfe5f8f7068d-86690685d8b58c76-1","_sentryBaggage":"sentry-environment=vercel-pr
