xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"853f3a36-1690-496d-82e3-dca3678c1414\"}":{"__typename":"DeepDives","uuid":"853f3a36-1690-496d-82e3-dca3678c1414","content":"\u003cp\u003eWhen I started college, I wasn’t sure what direction I wanted to take and often felt uncertain about how my interests could translate into a meaningful career. I had passions in many different areas but struggled to see how they could all fit together. Discovering Leadership Studies changed that. The program immediately resonated with me because it combined everything I was curious about—history, politics, ethics, and human behavior—while also surrounding me with a community of professors and peers who both challenged and supported me. It gave me a clear sense of purpose and belonging, and I knew I had found the perfect fit!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"71cd361d-3549-4252-85e6-f4445c16f69f\"}":{"__typename":"DeepDives","uuid":"71cd361d-3549-4252-85e6-f4445c16f69f","content":"\u003cp\u003eI am extremely proud of creating Envee, a salad dressing brand I founded and led as CEO. What started as just an idea in a brainstorming session turned into a product we actually brought to life—developing the recipe, building the brand, and sharing it with real customers. There were countless challenges along the way, from figuring out production to pitching the concept, but each obstacle pushed me to grow as a leader and problem-solver. Seeing Envee go from a concept on paper to something people could taste and enjoy was incredibly rewarding. It showed me that with creativity, persistence, and the right team, I could turn a vision into reality. That experience gave me the confidence to keep pursuing entrepreneurship and to trust my ability to build something from the ground up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"96b6f3fc-0764-47d7-8da1-ed8f2c0a8e5f\"}":{"__typename":"DeepDives","uuid":"96b6f3fc-0764-47d7-8da1-ed8f2c0a8e5f","content":"\u003cp\u003eIn high school, I spent my summers balancing work, friends, and adventure. I worked in local boutiques and as a waitress, which taught me responsibility, time management, and how to connect with all kinds of people. I also babysat for several families, which helped me develop patience and reliability. Outside of work, I loved spending time with friends, being outdoors as much as possible, and exploring new places—I’ve always loved to travel and discover new experiences. Those summers were a mix of learning, growing, and making memories, and they really shaped my independence and curiosity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4205dcdb-5fcb-4bc9-a01b-b4a8739fadb0\"}":{"__typename":"DeepDives","uuid":"4205dcdb-5fcb-4bc9-a01b-b4a8739fadb0","content":"\u003cp\u003eIf I could give my younger self advice, I’d tell myself to trust the process and embrace the uncertainty of figuring out what I want to do with my life. I’d remind myself that it’s okay to explore different interests, make mistakes, and change directions—every experience teaches you something valuable. I’d also tell myself to take more risks, speak up for my ideas, and not be afraid to start something new, because the confidence and skills you build along the way will shape your future in ways you can’t yet imagine. Finally, I’d remind myself to enjoy the journey and make time for the people and experiences that bring me joy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"57210b71-3a07-458a-9f3c-4c7ac2d9f907\"}":{"__typename":"School","uuid":"57210b71-3a07-458a-9f3c-4c7ac2d9f907","name":"Charlotte Country Day School","city":"Charlotte","type":"HIGH","state":"North Carolina","country":"United States","zip":"28226"},"Education:{\"uuid\":\"7fa9a392-db41-4639-b01a-8362311b947b\"}":{"__typename":"Education","uuid":"7fa9a392-db41-4639-b01a-8362311b947b","school":{"__ref":"School:{\"uuid\":\"57210b71-3a07-458a-9f3c-4c7ac2d9f907\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"eb9a1443-ba35-4e38-bccc-83651844125e\"}":{"__typename":"School","uuid":"eb9a1443-ba35-4e38-bccc-83651844125e","name":"University of Richmond","city":"Richmond","type":"COLLEGE","state":"Virginia","country":"United States","zip":"23173"},"Education:{\"uuid\":\"73b12a18-6efd-4cfd-96ce-e507f7309c88\"}":{"__typename":"Education","uuid":"73b12a18-6efd-4cfd-96ce-e507f7309c88","school":{"__ref":"School:{\"uuid\":\"eb9a1443-ba35-4e38-bccc-83651844125e\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Leadership Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"9931f4ca-3b76-425d-b83e-6fbffcd502d5\"}":{"__typename":"MentorPublicProfile","uuid":"9931f4ca-3b76-425d-b83e-6fbffcd502d5","displayName":"Lindsay B.","slug":"lindsay-batten","biography":"\u003cp\u003eHi! My name is Lindsay Batten, and I’m excited to share a little bit about myself as a mentor. At the heart of everything I do, I care about helping people find their voice, build confidence, and discover what excites them. I really believe that learning works best when it feels meaningful and fun, and my goal is to support students not only in their academics but also in how they see themselves and their potential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI studied Leadership Studies at the University of Richmond, where I earned my Bachelor of Arts. Leadership Studies is a unique, interdisciplinary program that combines philosophy, politics, history, and organizational behavior to examine how people influence one another and how communities create change. This field has shaped the way I think about learning and teaching—I believe education is most impactful when it is collaborative and when students see the real-world value of what they’re learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I work full time at Brunswick Group, a global strategic advisory firm. In my role, I help Fortune 100 clients navigate complex challenges by developing strong communication strategies. The work requires problem-solving, collaboration, and the ability to stay calm under pressure—skills that are just as important for students learning to manage busy schedules, big projects, or test preparation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore joining Brunswick, I was the founder and CEO of Envee, a student-founded food startup. Envee is a nut-free salad dressing that combines the flavors of pesto and Caesar, and leading the company was one of the most challenging and rewarding experiences I’ve had. As CEO, I oversaw everything from product development and branding to selling the product nationwide. Working with my team to launch a product from scratch taught me valuable lessons about leadership, perseverance, and creativity. It was a true entrepreneurial experience, and I love sharing what I learned from it with students—especially when it comes to problem-solving and thinking outside the box.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work, I’m passionate about animal welfare and support local shelters, which has taught me compassion and patience. I also love traveling and seeking out new adventures, having lived in both Italy and Australia. These experiences remind me how important it is to be brave, adaptable, and open to growth—qualities I encourage in students as well.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I want families to know that I’ll meet each student where they are and help them grow from there. Whether we’re working on academic skills, passion projects, study habits, or building confidence, I’ll bring my experiences in leadership, business, and communications to guide them. Most importantly, I want students to feel supported, encouraged, and excited about their future, knowing they have someone in their corner who believes in them.\u003c/p\u003e","teachingVideoPlaybackId":"w4GpGi1Zi8HlpjzcMrXWr00p39j4Ps6qfML44ngkK6Bw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Leadership Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"853f3a36-1690-496d-82e3-dca3678c1414\"}"},{"__ref":"DeepDives:{\"uuid\":\"71cd361d-3549-4252-85e6-f4445c16f69f\"}"},{"__ref":"DeepDives:{\"uuid\":\"96b6f3fc-0764-47d7-8da1-ed8f2c0a8e5f\"}"},{"__ref":"DeepDives:{\"uuid\":\"4205dcdb-5fcb-4bc9-a01b-b4a8739fadb0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f0deca6e-0583-40b1-bbbc-126aaf408533/-/preview/-/format/jpg/","https://ucarecdn.com/76a1692f-2ec9-41ba-ac71-4faccb62acfa/-/preview/-/format/jpg/","https://ucarecdn.com/94a697e7-b51e-4929-b621-d4301ea54454/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7fa9a392-db41-4639-b01a-8362311b947b\"}"},{"__ref":"Education:{\"uuid\":\"73b12a18-6efd-4cfd-96ce-e507f7309c88\"}"}],"hiredAt":"2025-09-30T19:46:44.911Z","topics":["Law / Government / Policy","Journalism","Public Speaking","K-5 Grade Math","6-8 Grade Science","Writing","Executive Function","College Essay Writing","Reading","History","Academic Coaching","Creative Writing","Sports Journalism","History Project","K-6 Storybook","Fashion / Cosmetics","Business / Entrepreneurship"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lindsay-batten\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9931f4ca-3b76-425d-b83e-6fbffcd502d5\"}"}}},"_sentryTraceData":"95ea173d508a4c76a5e91263643ced55-8e4c98481cbd2585-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=95ea173d508a4c76a5e91263643ced55,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"lindsay-batten"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.
