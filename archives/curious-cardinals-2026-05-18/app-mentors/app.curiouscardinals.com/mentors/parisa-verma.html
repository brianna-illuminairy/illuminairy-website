xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e0531462-2863-4e0c-8680-d8fcb6780478\"}":{"__typename":"Favorites","uuid":"e0531462-2863-4e0c-8680-d8fcb6780478","photoUrl":"https://ucarecdn.com/266e7e1c-561b-46c6-baea-2ac1e4e109b1/","title":"Frankenstein","type":"BOOK"},"Favorites:{\"uuid\":\"6ca875d1-9534-4ffd-b98e-80b7b0037681\"}":{"__typename":"Favorites","uuid":"6ca875d1-9534-4ffd-b98e-80b7b0037681","photoUrl":"https://ucarecdn.com/80be9679-7554-4d0a-a939-0f08c854e321/","title":"They're all too good!","type":"ALBUM"},"Favorites:{\"uuid\":\"9a8cf316-bee8-46fe-bdb3-f4a240197e6e\"}":{"__typename":"Favorites","uuid":"9a8cf316-bee8-46fe-bdb3-f4a240197e6e","photoUrl":"https://ucarecdn.com/9e6fd913-a9b1-452b-874b-98d9f14b305e/","title":"NYC","type":"CITY"},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"c1331a9f-3ff2-4f86-a729-3243c8d32b0b\"}":{"__typename":"DeepDives","uuid":"c1331a9f-3ff2-4f86-a729-3243c8d32b0b","content":"\u003cp\u003eAs a middle and high school student, I was deeply curious, motivated, and driven, but I was also very results-oriented and held myself to very high standards. I loved challenging myself and striving toward excellence, but didn’t always know how or when to slow down and explore my passions without pressure. Over time, I learned that meaningful growth often comes not from chasing outcomes, but from aiming high while giving myself room to experiment, reflect, and enjoy the learning process. Soon enough, this realization gave way to my passion for research!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d60f259e-880d-424c-9454-feb2ac711592\"}":{"__typename":"DeepDives","uuid":"d60f259e-880d-424c-9454-feb2ac711592","content":"\u003cp\u003eI chose to major in Cognitive Science (CogSci) because its interdisciplinary approach mirrors how I have always naturally thought about the world and my place in it. When I first arrived at Yale, I didn’t even know what CogSci was, but I quickly learned it offers a language and framework for investigating questions I had been asking for years: how humans perceive, learn, communicate, and make meaning. CogSci’s integration of neuroscience, psychology, linguistics, computer science, and philosophy allows me to study the mind as a dynamic system shaped by biology, experience, and culture. This breadth has been especially important to me as someone interested in medicine, music, and language – fields often treated as separate. CogSci has given me the tools to comprehensively synthesize my interests. I am greatly looking forward to beginning my CogSci thesis project in the coming months: investigating whether a 10-12 week program of violin-based music mindfulness I design leads to improvements in symptoms and mood in individuals with generalized anxiety disorder and major depressive disorder, and if so, how this improvement manifests functionally in the brain. This project encapsulates what drew me to Cognitive Science in the first place: the ability to integrate neuroscience, creativity, and human experience into a single, rigorous line of inquiry.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"fc7eedfc-0ce9-4848-812b-b931bb037b6c\"}":{"__typename":"DeepDives","uuid":"fc7eedfc-0ce9-4848-812b-b931bb037b6c","content":"\u003cp\u003eOne passion project I’m most proud of is an organization I founded this year: Yale Musicians United in Service and Empowerment (Yale MUSE). Yale MUSE has its roots in my very first experiences volunteering at Yale New Haven Hospital (YNHH). I first began at YNHH nearly two years ago as a Patient Aide in Women’s OB-GYN Oncology, where my role involved bringing patients small comforts—blankets, food, magazines—and offering a listening ear. Over time, I realized that what patients valued most was not the items themselves, but conversation, presence, and human connection. While volunteering, I learned that the hospital had a small, informal program for student musicians who occasionally performed at patients’ bedsides. I signed up immediately, and since then have witnessed the profound effect these moments of music have had on patients countless times. I wanted to expand this idea into something more structured, sustainable, and inclusive; so, I founded Yale MUSE to train and coordinate student musicians to bring live instrumental music directly to patients across fifteen hospital units, leveraging the power of music to foster connection and healing in clinical spaces for as many patients as possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0b37cc9f-1f6b-47c4-8157-dfe04ede78cf\"}":{"__typename":"DeepDives","uuid":"0b37cc9f-1f6b-47c4-8157-dfe04ede78cf","content":"\u003cp\u003eI would tell my middle and high school self that it’s okay not to have everything figured out yet, and for your interests to not fit into a “cookie cutter” model. I’d remind myself that exploration is not wasted time, and that trying things without immediately excelling at them is often how you discover what truly excites you. Most importantly, I’d say to trust that interests don’t need to compete with each other; over time, they can come together in ways you can’t yet imagine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"d4a4a9f9-026b-4218-9817-ad3b1b2c8ade\"}":{"__typename":"Education","uuid":"d4a4a9f9-026b-4218-9817-ad3b1b2c8ade","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"d9360193-7e8c-475e-9844-c7a09a3a3578\"}":{"__typename":"Education","uuid":"d9360193-7e8c-475e-9844-c7a09a3a3578","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"e109b274-9679-4d64-b8ce-2843c0fbb1d6\"}":{"__typename":"MentorPublicProfile","uuid":"e109b274-9679-4d64-b8ce-2843c0fbb1d6","displayName":"Parisa V.","slug":"parisa-verma","biography":"\u003cp\u003eHi there! I’m Parisa, a pre-med junior at Yale University majoring in Cognitive Science with minors in Chinese Language and Global Health. I help students turn big, interdisciplinary interests— especially in medicine, neuroscience, and music— into passion projects of any form!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eA bit about me\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eSince elementary school, I have loved science, music, and languages, but I often felt pulled in different directions by my interests. Once I started college, I realized the solution lay in blending all three. Since my first year at Yale, I’ve:\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eConducted clinical and translational research \u003c/strong\u003eat Mount Sinai’s Icahn School of Medicine, contributing as first and second author to published case reports on \u003cstrong\u003erare oncologic\u003c/strong\u003e and \u003cstrong\u003eendocrine\u003c/strong\u003e conditions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFounded Yale Musicians United in Service and Empowerment\u003c/strong\u003e (Yale MUSE), bringing live instrumental music to patients’ bedsides at Yale New Haven Hospital\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCo-developed a Personalized Music Playlist Program at Yale New Haven Hospital \u003c/strong\u003eto support wellbeing and \u003cstrong\u003eneurorehabilitation\u003c/strong\u003e in geriatric patients\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEarned an Advanced Chinese Language Certificate\u003c/strong\u003e and \u003cstrong\u003econducted Mandarin-language research\u003c/strong\u003e for a Yale Foreign Policy Institute × German Marshall Fund project examining \u003cstrong\u003eCross-Strait relations\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eConducted research in the Language, Learning, and Multisensory Brain (LLAMB) Lab \u003c/strong\u003eat the Yale Child Study Center, investigating the \u003cstrong\u003eneural mechanisms of language acquisition\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePerformed internationally as a violinist with the \u003cstrong\u003eYale Symphony Orchestra\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese experiences taught me that projects don’t need to fit neatly into one category—combining your interests often makes your work stronger \u003cem\u003eand\u003c/em\u003e more impactful to a wider audience!\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eWhat I specialize in\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI mentor students who want to explore:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMedicine \u0026amp; neuroscience passion projects\u003c/strong\u003e (spanning literature reviews and retrospective case-based analyses to empirical research or educational projects)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHealth \u0026amp; creativity projects \u003c/strong\u003e(music, sound, or art as tools for wellbeing or mediums for healthcare innovation)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eGlobal health \u0026amp; health equity topics\u003c/strong\u003e (policy briefs, health awareness campaigns, comparative analyses)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch skill-building \u003c/strong\u003e(asking the right questions, narrowing scope, designing, executing, and sharing a feasible project)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege-readiness\u003c/strong\u003e (creating an application narrative, identifying appropriate and meaningful extracurricular and/or competitive opportunities, curating a portfolio for audition and non-audition programs)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eWhy I’m qualified to help you\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eThroughout high school and college, I’ve mentored peers in academic subjects (neuroscience, biology, English, History, music) and guided several students through research project design, execution, and presentation. Through mentorship I have given and received, I’ve learned how to move from big ambitions and uncertainty to a clear starting point, with a plan for turning ideas into action.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might involve:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eNarrowing a broad interest into a specific, compelling project while balancing scientific rigor, precision, and creativity\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing how to communicate complex ideas clearly to different audiences, across science, music, and more\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConnecting your project to opportunities like competitions, publications, or future research paths\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eOutside of academics\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn my free time, you can usually find me listening to music (any genre!) or podcasts (I’m a big Huberman Lab fan). I also love weight lifting and Pilates, watching movies and TV shows (again—any genre), cooking and baking, fashion, and traveling.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you have big ideas, interdisciplinary interests, or a sense that you want to create something meaningful but don’t quite know how yet, I’d love to work with you and help make it happen.\u003c/p\u003e","teachingVideoPlaybackId":"OBn01OkgsyI59PliYFNAjtbTN9jQAGm38NVVXMQX65NA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e0531462-2863-4e0c-8680-d8fcb6780478\"}"},{"__ref":"Favorites:{\"uuid\":\"6ca875d1-9534-4ffd-b98e-80b7b0037681\"}"},{"__ref":"Favorites:{\"uuid\":\"9a8cf316-bee8-46fe-bdb3-f4a240197e6e\"}"}],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c1331a9f-3ff2-4f86-a729-3243c8d32b0b\"}"},{"__ref":"DeepDives:{\"uuid\":\"d60f259e-880d-424c-9454-feb2ac711592\"}"},{"__ref":"DeepDives:{\"uuid\":\"fc7eedfc-0ce9-4848-812b-b931bb037b6c\"}"},{"__ref":"DeepDives:{\"uuid\":\"0b37cc9f-1f6b-47c4-8157-dfe04ede78cf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/44fb2b40-47d0-43a2-9934-789dc00053e6/-/preview/-/format/jpg/","https://ucarecdn.com/127824fc-d3d4-4c5e-81f4-446868d23f93/-/preview/-/format/jpg/","https://ucarecdn.com/55f97b33-9693-4d38-81a2-2c61c3544bca/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d4a4a9f9-026b-4218-9817-ad3b1b2c8ade\"}"},{"__ref":"Education:{\"uuid\":\"d9360193-7e8c-475e-9844-c7a09a3a3578\"}"}],"hiredAt":"2026-01-21T19:33:37.617Z","topics":["6-8 Grade Science","Biology","Writing","Spanish","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Reading","Music","Medicine / Health","STEM Project","Public Speaking","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug
