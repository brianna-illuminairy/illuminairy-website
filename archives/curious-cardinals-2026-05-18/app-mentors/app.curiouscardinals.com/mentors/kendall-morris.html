xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d3414bab-921f-415a-b42f-bb385813b82c\"}":{"__typename":"DeepDives","uuid":"d3414bab-921f-415a-b42f-bb385813b82c","content":"\u003cp\u003eMy dream job is to become a pediatric surgeon. I have always had a knack for working with kids, coming from a large family with several cousins. I hope to provide the help and care these children need to get healthy again!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"db224c61-01cd-44a1-ac9b-c71094cbdc61\"}":{"__typename":"DeepDives","uuid":"db224c61-01cd-44a1-ac9b-c71094cbdc61","content":"\u003cp\u003eI chose biology because I have always wanted to go to medical school. This subject allowed me to prepare myself for the future, while getting to explore topics I had always been interested in including environmental toxicology, biochemistry, and human anatomy. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d63ab1e8-5bf3-4d01-9c68-439ee9c0ac3b\"}":{"__typename":"DeepDives","uuid":"d63ab1e8-5bf3-4d01-9c68-439ee9c0ac3b","content":"\u003cp\u003eI hope to contribute to finding a way to protect and save the coral reefs. With the ocean temperature rising, reefs are dying at an alarming rate. I hope to help rebuild coral reefs through action and research, and find away to restore these ecosystems in our oceans.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"256cd787-7711-44e0-8f6b-1fdfcf3eca1c\"}":{"__typename":"School","uuid":"256cd787-7711-44e0-8f6b-1fdfcf3eca1c","name":"Brebeuf Jesuit Preparatory School","city":"Indianapolis","type":"HIGH","state":"Indiana","country":"United States","zip":"46268"},"Education:{\"uuid\":\"536a7e55-23aa-4758-ace5-bf2a41ed0f07\"}":{"__typename":"Education","uuid":"536a7e55-23aa-4758-ace5-bf2a41ed0f07","school":{"__ref":"School:{\"uuid\":\"256cd787-7711-44e0-8f6b-1fdfcf3eca1c\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}":{"__typename":"School","uuid":"9a91466f-187b-4e9b-8a98-c02cef7bf621","name":"University of Michigan","city":"Ann Arbor","type":"COLLEGE","state":"Michigan","country":"United States","zip":"48109"},"Education:{\"uuid\":\"34867cbc-a1a0-42e9-83e9-6d7523622acd\"}":{"__typename":"Education","uuid":"34867cbc-a1a0-42e9-83e9-6d7523622acd","school":{"__ref":"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"783cfb8b-792d-4993-b64d-bf2c4858feab\"}":{"__typename":"MentorPublicProfile","uuid":"783cfb8b-792d-4993-b64d-bf2c4858feab","displayName":"Kendall M.","slug":"kendall-morris","biography":"\u003cbr\u003e\u003cp\u003eKendall received a bachelor’s degree in Biology from the University of Michigan. She grew up in Indianapolis and loved the sciences from a young age. Currently, she is applying to medical school and working in dermatology as a medical assistant in Washington D.C.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eKendall’s interest in the sciences began in middle school, allowing her to dive deeper into several different subjects from anatomy to chemistry to mathematics. Over time she has been involved in pre-medical student organizations, Dance Marathon - fundraising for Ann Arbor’s children’s hospital, and led philanthropy for a non-profit sending medical mission trips all over the world. She has worked in healthcare over the past four years, participated in cardiovascular research, and studied abroad in Denmark studying clinical human health and disease. With a strong scientific background, she has learned the in’s and out’s of how to study and learn difficult material.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Curious Cardinals, Kendall is focused on providing guidance in STEM subjects along with History and Spanish related courses. She hopes to help students with their material while simultaneously helping students find the drive and motivation to pursue topics and subjects they are passionate about.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, Kendall enjoys traveling and exploring new cultures, running, baking fall recipes, and spending time with her friends and family. \u003c/p\u003e","teachingVideoPlaybackId":"Y9anDkPFcwE1iNVGA1lDJaCkyhlNoCY01neN1Z72NCbo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d3414bab-921f-415a-b42f-bb385813b82c\"}"},{"__ref":"DeepDives:{\"uuid\":\"db224c61-01cd-44a1-ac9b-c71094cbdc61\"}"},{"__ref":"DeepDives:{\"uuid\":\"d63ab1e8-5bf3-4d01-9c68-439ee9c0ac3b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/09529a6a-e362-4af8-bc68-ea07f7ef723a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"536a7e55-2
