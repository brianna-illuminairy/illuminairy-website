xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7baf8645-72d0-4401-85ad-85c8ae3ee15b\"}":{"__typename":"Favorites","uuid":"7baf8645-72d0-4401-85ad-85c8ae3ee15b","photoUrl":"https://ucarecdn.com/7b0e7556-db4d-47bf-98f0-6dabd962fdb6/","title":"Joaquin Sorolla","type":"ARTIST"},"Favorites:{\"uuid\":\"10d6b215-7e5b-4035-9b1b-1bfab2473eae\"}":{"__typename":"Favorites","uuid":"10d6b215-7e5b-4035-9b1b-1bfab2473eae","photoUrl":"https://ucarecdn.com/ed6fc168-ad3f-49f8-b8f6-77979a531cec/","title":"Paris","type":"CITY"},"Favorites:{\"uuid\":\"fbb4d511-5f73-458b-876f-b6fdbfd8c2c7\"}":{"__typename":"Favorites","uuid":"fbb4d511-5f73-458b-876f-b6fdbfd8c2c7","photoUrl":"https://ucarecdn.com/b8bc009d-2c90-4543-aff0-f54367ae258d/","title":"A Star Is Born","type":"MOVIE"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1d044b35-7234-48b6-9a03-370dc5d670ee\"}":{"__typename":"DeepDives","uuid":"1d044b35-7234-48b6-9a03-370dc5d670ee","content":"\u003cp\u003eI'd love to sail to Antarctica one day! Not only would it be a dream to check off the 7th continent, but I've always been fascinated by penguins, glacial landscapes, and the idea of doing a Polar Plunge. Plus, how cool would it be to go to the bottom of the world?\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"234456ef-1539-41c6-87f0-702915b613a9\"}":{"__typename":"DeepDives","uuid":"234456ef-1539-41c6-87f0-702915b613a9","content":"\u003cp\u003eAlthough Global Affairs and Art may sound like total opposites, I'm interested in exploring their intersections. I firmly believe that art informs a country's culture, and understanding these nation-to-nation differences is a key aspect of building diplomatic bridges. Given our increasingly interconnected world, it's important to understand things from both a creative and an analytical perspective. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b513823f-21c7-46c5-9662-2429e9c89eb4\"}":{"__typename":"DeepDives","uuid":"b513823f-21c7-46c5-9662-2429e9c89eb4","content":"\u003cp\u003eFor me, high school was a time to try everything! The best time to make mistakes with minimal consequences is when you're young. \u003c/p\u003e\u003cbr\u003e\u003cp\u003e2018 - policy debate camp\u003c/p\u003e\u003cp\u003e2019 - Yale Young Global Scholars\u003c/p\u003e\u003cp\u003e2020 - online classes at my local uni\u003c/p\u003e\u003cp\u003e2021 - biomedical engineering research internship in a lab \u003c/p\u003e\u003cp\u003e2022 - graduated! backpacking europe! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d0decd05-0e4d-4887-afd2-d21d1ea7994f\"}":{"__typename":"DeepDives","uuid":"d0decd05-0e4d-4887-afd2-d21d1ea7994f","content":"\u003cp\u003eFrom leading painting courses to elementary schoolers to tutoring for college apps, I've always had a love for teaching! As a social butterfly, I enjoy getting to know other students on a personal level. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI remember, when I was a kid, I always felt overlooked by adults and dismissed for being \"too young to understand\". Personally, I think youth have some of the most creative minds, and it would be a shame to let those great ideas go to waste. One of the most fulfilling things as a teacher is when I actually learn something from my students in return - whether that be about cultural perspectives, hobbies, or life in general!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"81226523-8fd2-4caf-97d1-d334f10d2f94\"}":{"__typename":"School","uuid":"81226523-8fd2-4caf-97d1-d334f10d2f94","name":"Lincoln East High School","city":"Lincoln","type":"HIGH","state":"Nebraska","country":"United States","zip":"68510"},"Education:{\"uuid\":\"e29f80ce-11e6-4aeb-84ab-f7d1d1f68d58\"}":{"__typename":"Education","uuid":"e29f80ce-11e6-4aeb-84ab-f7d1d1f68d58","school":{"__ref":"School:{\"uuid\":\"81226523-8fd2-4caf-97d1-d334f10d2f94\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"033d2c94-cf92-4d1a-89e2-bcc2173cda9d\"}":{"__typename":"Education","uuid":"033d2c94-cf92-4d1a-89e2-bcc2173cda9d","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Global Affairs, Art, French","degree":null},"MentorPublicProfile:{\"uuid\":\"d1491982-1d3f-4768-843f-464c12395edd\"}":{"__typename":"MentorPublicProfile","uuid":"d1491982-1d3f-4768-843f-464c12395edd","displayName":"Clarissa T.","slug":"clarissa-tan-1","biography":"\u003cp\u003eHello!! I'm an adventurous, extroverted girl who is always full of energy! I was born in California, grew up in China, and moved to Lincoln/Nebraska. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, I've organized 4 Model UN conferences in Taiwan, Korea, China, and Brazil. Though I never competed in MUN as a delegate, I loved the public speaking, research, and fast-paced nature of debate in high school! I'm passionate about sustainability, and conduct research for the Environmental Performance Index - a report ranking 180 countries on progress towards climate change. In my free time, I write a travel column for the Yale Daily News. I stay active by being on the dance team and running 5Ks. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs an artist, I'm interested in painting, drawing, photography, and graphic design. I enjoy teaching workshops on technology (ex. InDesign, Lightroom, Figma), magazine layout, basic design principles, how to use cameras, or anything creative! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have extensive experience crafting proposals for funding, and am passionate about designing and executing independent projects. My freshman summer, I interned at Asia Society France and helped organize art exhibits in Paris. My sophomore summer, I interviewed artists around Southeast Asia regarding Europe's historical influences due to colonization. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not in school, most of my life is spent in hostels or on night buses. I'm a solo female backpacker who has been to nearly 50 countries. I love hiking, getting to know people from different cultural backgrounds, trying global cuisines, and learning about local history and politics. As a Worldpackers Ambassador, I've volunteered at a surf camp in Portugal, guided tours in Laos, taught yoga in Indonesia, and grew sustainable farms in Australia. My super ambitious dream is to one day visit all 193 countries! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m constantly amazed by the power of human connection that leads me from one unique story to the next. I’m shaped by the enriching places I’ve called home and the global citizens I’ve called friends—it is this love for society that drives me to teach.\u0026nbsp;Can't wait to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"EUrvgVMAb2gYcNLlFPdcKi7Bi8AiQYSzB00UiaBUHLM4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7baf8645-72d0-4401-85ad-85c8ae3ee15b\"}"},{"__ref":"Favorites:{\"uuid\":\"10d6b215-7e5b-4035-9b1b-1bfab2473eae\"}"},{"__ref":"Favorites:{\"uuid\":\"fbb4d511-5f73-458b-876f-b6fdbfd8c2c7\"}"}],"causesSupported":[],"major":"Global Affairs, Art, French","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1d044b35-7234-48b6-9a03-370dc5d670ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"234456ef-1539-41c6-87f0-702915b613a9\"}"},{"__ref":"DeepDives:{\"uuid\":\"b513823f-21c7-46c5-9662-2429e9c89eb4\"}"},{"__ref":"DeepDives:{\"uuid\":\"d0decd05-0e4d-4887-afd2-d21d1ea7994f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8aa3ba39-85c5-445d-8312-eb868fd8f07d/-/preview/-/format/jpg/","https://ucarecdn.com/c42b2957-0740-4553-aa43-d29812bc5207/-/preview/-/format/jpg/","https://ucarecdn.com/34a0aad3-f576-4564-a6de-3a4f88d21b21/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e29f80ce-11e6-4aeb-84ab-f7d1d1f68d58\"}"},{"__ref":"Education:{\"uuid\":\"033d2c94-cf92-4d1a-89e2-bcc2173cda9d\"}"}],"hiredAt":"2024-10-04T09:09:37.376Z","topics":["Music","Visual Arts / Graphic Design","Law / Government / Policy","World Cultures","Race \u0026 Ethnicity","Debate","Public Speaking","Writing","French","Mandarin Chinese","Video / Photography"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":
