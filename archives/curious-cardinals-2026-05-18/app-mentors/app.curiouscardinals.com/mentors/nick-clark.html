xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"029ef9f1-41cf-40c2-9740-7167c092f893\"}":{"__typename":"Favorites","uuid":"029ef9f1-41cf-40c2-9740-7167c092f893","photoUrl":"https://ucarecdn.com/79954c9a-672d-4a37-9371-fcdf05bc7307/","title":"NYC","type":"CITY"},"Favorites:{\"uuid\":\"eaf37389-b8f4-4c85-86be-78fd6de60944\"}":{"__typename":"Favorites","uuid":"eaf37389-b8f4-4c85-86be-78fd6de60944","photoUrl":"https://ucarecdn.com/41c89c30-9b7b-4d35-a94b-ec04b943bf06/","title":"Tennis","type":"SPORT"},"Favorites:{\"uuid\":\"006932a7-d342-4233-ae88-c9d5b3562263\"}":{"__typename":"Favorites","uuid":"006932a7-d342-4233-ae88-c9d5b3562263","photoUrl":"https://ucarecdn.com/803aa3af-9694-4cba-9368-214529033155/","title":"Miley Cyrus","type":"ARTIST"},"CausesSupported:{\"uuid\":\"699ac1da-9e6a-453a-b169-bae18d253123\"}":{"__typename":"CausesSupported","uuid":"699ac1da-9e6a-453a-b169-bae18d253123","name":"Team Impact ","description":"\u003cp\u003eCoordinate activities \u0026amp; foster connection with Team Impact honorary teammate\u003c/p\u003e","photoUrl":"https://ucarecdn.com/93e06a06-8724-4e19-b03f-fe564717c4aa/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1fe6ba74-08e5-4441-a77d-2270e866c8d2\"}":{"__typename":"DeepDives","uuid":"1fe6ba74-08e5-4441-a77d-2270e866c8d2","content":"\u003cp\u003eMentorship has played such a meaningful role in my life. I honestly wouldn’t be where I am today without the people who took the time to believe in me, guide me, and remind me of what I was capable of, even when I couldn’t quite see it myself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a Division I swimmer, I learned early on how much growth can come from having someone in your corner, someone who’s been through it, who gets it, and who’s there to support you both in the tough moments and the wins. That experience shaped how I view mentorship: not just as teaching or tutoring, but as building a relationship rooted in trust, encouragement, and growth.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether it was coaching younger swimmers, helping teammates stay motivated through tough seasons, or tutoring students in math, I’ve always loved the feeling of helping someone have that “aha” moment or take a step they didn’t think they could. It’s incredibly rewarding to be part of someone’s journey and to celebrate the little victories.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship matters to me because it’s a two-way street. I learn just as much from the students I work with as they do from me. And in a world that can sometimes feel overly fast-paced or performance-driven, it’s a rare and special thing to slow down, connect, and invest in someone else’s growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"acc744e9-b300-48bf-98ee-f7938bdfc7e3\"}":{"__typename":"DeepDives","uuid":"acc744e9-b300-48bf-98ee-f7938bdfc7e3","content":"\u003cp\u003eIn high school, I was a little more reserved than I am now, but just as driven and full of ambition. I had big dreams, like attending Brown University and swimming at the Division I level, and those goals fueled a lot of my focus and motivation, both in the classroom and in the pool.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI definitely looked up to people around me—older teammates, friends, and mentors who had already walked the path I hoped to follow. Their advice and encouragement gave me the confidence to believe that my dreams were within reach. I wasn’t afraid to work hard, but I also really valued guidance. Having people who believed in me and took the time to share their experiences made a huge difference.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, I’ve grown a lot—not just in confidence, but in how I carry myself, connect with others, and navigate challenges. Looking back, I see how important that stage of life was for shaping who I am today. That’s a big part of why I care so deeply about mentorship now. I remember what it felt like to be that high school student: full of drive but still figuring things out, and I love the idea of being someone that students today can look to the same way I once did.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"776bf233-2969-4d9a-ad46-0823528b0462\"}":{"__typename":"DeepDives","uuid":"776bf233-2969-4d9a-ad46-0823528b0462","content":"\u003cp\u003eIn my spare time, I’m almost always doing something that helps me unwind. I absolutely love thrifting with my friends. There’s something so fun about digging through racks, finding hidden gems, and seeing who can put together the best outfit. I’m also a huge foodie. Going out to eat is one of my favorite ways to spend time, especially because food has always been a big part of how my family connects and celebrates. Some of my best memories involve meals shared around the table.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnother one of my passions is tennis. I seriously could play all day if I had the time. I love the strategy, the rhythm of the game, and even just practicing solo and tweaking small parts of my technique. There’s always something new to learn, and that keeps it exciting.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also really into fashion and style. Whether it’s scrolling through lookbooks or spending a \u003cem\u003elittle\u003c/em\u003e too much time online shopping, I find a lot of creativity and self-expression in how people dress. It’s like a fun puzzle figuring out how to pull together pieces that feel totally “you.”\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"3ac519b7-4eac-489c-a751-2e25d5aad574\"}":{"__typename":"DeepDives","uuid":"3ac519b7-4eac-489c-a751-2e25d5aad574","content":"\u003cp\u003eIn high school, my summers were a mix of dedication and fun. A big part of my time was spent training for swimming—early mornings, long practices, and lots of time at the pool. But outside of that, I really made the most of the downtime. I loved taking day trips to the Jersey Shore with my friends. Being in the sun, listening to music, and being by the ocean was really special to me. I’m from Philly, so my family would often go out to restaurants in the city together—those outings always felt special and brought us closer.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I wasn’t out and about, I spent a lot of time reading or playing random Xbox games to unwind. But honestly, the moments I remember most fondly are the little ones, like going to the neighborhood pool with my friends, grabbing late night ice cream, or staying out a little too late playing pickup sports in someone’s backyard. Those summers were a perfect balance of working toward my goals and just enjoying being a teenager.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"adbf2357-0987-4eff-9cb1-f31d808fc948\"}":{"__typename":"School","uuid":"adbf2357-0987-4eff-9cb1-f31d808fc948","name":"North Penn High School","city":"Lansdale","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19446"},"Education:{\"uuid\":\"5ddee394-870b-4069-b98a-921f16d8a0eb\"}":{"__typename":"Education","uuid":"5ddee394-870b-4069-b98a-921f16d8a0eb","school":{"__ref":"School:{\"uuid\":\"adbf2357-0987-4eff-9cb1-f31d808fc948\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"881caf2c-9934-4cd1-bfa4-9abcc78c0fd9\"}":{"__typename":"Education","uuid":"881caf2c-9934-4cd1-bfa4-9abcc78c0fd9","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Applied Mathematics \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"add1878d-acdf-4c90-9ac8-944cc53964a6\"}":{"__typename":"MentorPublicProfile","uuid":"add1878d-acdf-4c90-9ac8-944cc53964a6","displayName":"Nick C.","slug":"nick-clark","biography":"\u003cp\u003eI’m a graduating senior at Brown University studying Applied Mathematics and Economics. I’ve always been passionate about numbers, patterns, and problem-solving, and those interests have driven both my academic path and professional experiences. But what truly lights me up is applying what I’ve learned to help others grow, whether that’s in the classroom, on a sports team, or in a one-on-one mentoring relationship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the most defining parts of my college experience has been competing as a Division I student-athlete on Brown’s Swimming and Diving team. Balancing high-level athletics with academics taught me discipline, time management, and how to be both a leader and a supportive teammate. These lessons carried over to many other aspects of my life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the pool, I’ve pursued internships across finance, operations, and strategy at global healthcare companies like Merck and Organon, where I conducted data analysis to support decision-making and improve business outcomes. Come January of next year, I am so proud to say that I will be joining OC\u0026amp;C Strategy Consultants as an Associate Consultant, a role I was determined to pursue throughout college.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout all of my experiences, teaching and mentorship have remained a keystone. I’ve served as an assistant coach for my local summer swim team, where I ran practices, led private lessons, and fostered an inclusive team environment. At Brown, I’m involved with Team IMPACT, where I mentor children with serious illnesses through team-based support. I’m also an advocate with the Student-Athlete Gay Alliance, where I work to create community and visibility for LGBTQ+ athletes on campus.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo me, mentorship is about more than academic achievement. It’s about building relationships rooted in trust, encouragement, and curiosity. I love helping students see the connections between what they’re learning and the bigger picture, whether that’s in math, economics, or life beyond school.\u003c/p\u003e","teachingVideoPlaybackId":"bguBHK402IF00PhgO015G02FH7Ui300ZjdYSwPB01FpVXp95U","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m incredibly proud of is completing my four-year career as a Division I swimmer at Brown. Swimming at the collegiate level had been a dream of mine for as long as I can remember, and getting to actually live it out was one of the hardest but most rewarding experiences of my life. In particular, balancing the demands of academics, training, and personal-life was so challenging yet so gratifying.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere were moments of triumph, like dropping time in events I’d been grinding on for seasons and moments of challenge, like pushing through injuries, tough training cycles, and even the mental hurdles of self-doubt. But through it all, I kept showing up because I believed in myself, and I believed in the team.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing part of a tight-knit group, working toward shared goals, and learning how to lead, support, and be supported shaped so much of who I am today. I gained resilience, discipline, and a deep appreciation for growth that takes time and patience. Finishing my senior season, knowing I had given everything I had, made me feel proud not just of the results, but of the journey itself.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"029ef9f1-41cf-40c2-9740-7167c092f893\"}"},{"__ref":"Favorites:{\"uuid\":\"eaf37389-b8f4-4c85-86be-78fd6de60944\"}"},{"__ref":"Favorites:{\"uuid\":\"006932a7-d342-4233-ae88-c9d5b3562263\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"699ac1da-9e6a-453a-b169-bae18d253123\"}"}],"major":"Applied Mathematics \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1fe6ba74-08e5-4441-a77d-2270e866c8d2\"}"},{"__ref":"DeepDives:{\"uuid\":\"acc744e9-b300-48bf-98ee-f7938bdfc7e3\"}"},{"__ref":"DeepDives:{\"uuid\":\"776bf233-2969-4d9a-ad46-0823528b0462\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ac519b7-4eac-489c-a751-2e25d5aad574\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/96f0aa4a-315c-4abd-b365-6d644e25b8e2/-/preview/-/format/jpg/","https://ucarecdn.com/8396ee8f-7a9f-4814-b0a2-dbf25f186a86/-/preview/-/format/jpg/","https://ucarecdn.com/344abedd-2659-46b5-b7d7-20c90cd6e1a3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5ddee394-870b-4069-b98a-921f16d8a0eb\"}
