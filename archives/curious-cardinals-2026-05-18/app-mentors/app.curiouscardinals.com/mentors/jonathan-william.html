xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ed5b35ba-d0e2-4716-af57-76e55eb3741a\"}":{"__typename":"DeepDives","uuid":"ed5b35ba-d0e2-4716-af57-76e55eb3741a","content":"\u003cp\u003eOne passion project I worked on was a research paper on vaccine hesitancy, which I published in the \u003cem\u003eJournal of Student Research\u003c/em\u003e and later presented at a conference at the University of Washington. My research examined the factors contributing to vaccine skepticism in Eastern European populations, including misinformation, cultural influences, and historical context. I analyzed survey data to understand public perception and explored ways public health messaging could be improved to build trust and encourage higher vaccination rates. \u003c/p\u003e\u003cbr\u003e\u003cp\u003ePresenting at the conference gave me the opportunity to discuss my findings with researchers, healthcare professionals, and students, sparking conversations about real-world solutions. This project allowed me to combine my interests in public health and data-driven analysis, and it was a rewarding experience to contribute to a topic with meaningful societal impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"c23716f6-66ab-4607-a37c-722b399bf765\"}":{"__typename":"DeepDives","uuid":"c23716f6-66ab-4607-a37c-722b399bf765","content":"\u003cp\u003eOne of my proudest moments was receiving the American Heart Association's Heartsaver Hero Award for helping save my grandfather's life. In August 2016, while driving on I-405 in Irvine, California, my grandfather suddenly went into cardiac arrest, causing our car to swerve across multiple lanes and come to a stop on the shoulder. My brother Daniel and I quickly assessed the situation; Daniel called 911 and began administering CPR, a skill he had recently learned in a health class. I assisted by positioning our grandfather's head to maintain blood flow and worked to calm our grandmother. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOur combined efforts, along with the assistance of a passerby, helped stabilize him until paramedics arrived. Thankfully, our grandfather made a full recovery. This experience underscored the importance of emergency preparedness and the life-saving potential of CPR training.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8baf8f70-95d9-4257-b00c-804e2d20d9a0\"}":{"__typename":"DeepDives","uuid":"8baf8f70-95d9-4257-b00c-804e2d20d9a0","content":"\u003cp\u003eI would tell my middle/high school self to be open to unexpected opportunities and not be afraid to take on challenges outside of my comfort zone. Some of the most meaningful experiences I’ve had—whether it was publishing research, founding a nonprofit, or stepping into leadership roles—weren’t things I originally planned. They came from following my interests, saying yes to opportunities, and being willing to learn along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d also remind myself that failure isn’t the opposite of success—it’s part of the process. Whether it was school, projects, or competitions, there were plenty of times things didn’t go perfectly. Looking back, those moments were some of the biggest learning experiences.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"3ff999d9-8518-46d5-8d28-40af4af7fc8a\"}":{"__typename":"DeepDives","uuid":"3ff999d9-8518-46d5-8d28-40af4af7fc8a","content":"\u003cp\u003eMy greatest source of motivation comes from the ability to take action and create meaningful change—whether that’s through research, nonprofit work, or helping others in ways big or small. I’ve always been drawn to projects that have a real-world impact, like publishing research on vaccine hesitancy or founding \u003cem\u003eThe Road to Rights\u003c/em\u003e to bring human rights education to schools in Russia. Seeing how ideas can turn into something tangible keeps me motivated to keep learning and pushing forward.\u003c/p\u003e\u003cp\u003eI’m also motivated by challenges that require problem-solving and persistence—whether it’s figuring out how to secure funding for an organization, navigating a complex research topic, or stepping into leadership roles that require new skills. The process of working through obstacles and seeing progress, no matter how small, is what drives me to take on new opportunities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"86e526bf-de73-4dcd-bf7c-8fb096e16c34\"}":{"__typename":"School","uuid":"86e526bf-de73-4dcd-bf7c-8fb096e16c34","name":"Bellevue High School","city":"Bellevue","type":"HIGH","state":"Washington","country":"United States","zip":"98004"},"Education:{\"uuid\":\"073ed925-ed8f-4b1e-ac94-ce137556719e\"}":{"__typename":"Education","uuid":"073ed925-ed8f-4b1e-ac94-ce137556719e","school":{"__ref":"School:{\"uuid\":\"86e526bf-de73-4dcd-bf7c-8fb096e16c34\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"5a98a06b-4aad-4ba6-84b5-f35d88e2f2a5\"}":{"__typename":"Education","uuid":"5a98a06b-4aad-4ba6-84b5-f35d88e2f2a5","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"69dbdaf8-b647-4f69-8aec-4c0b293dcac8\"}":{"__typename":"MentorPublicProfile","uuid":"69dbdaf8-b647-4f69-8aec-4c0b293dcac8","displayName":"Jonathan T.","slug":"jonathan-william","biography":"\u003cp\u003eHi, I’m Jonathan! I’m a student at Stanford University, studying Economics and International Relations. I’ve worked in tech, venture capital, and business development.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Dremio, a data lakehouse company, I worked on partnerships with AWS, Microsoft, and Google Cloud, helping build solutions for big data analytics. At Seamless Ventures, a venture capital firm, I sourced startups in healthcare, sustainability, and industrial technology. Before that, I worked at SPIA Technik, an airplane interior design engineering firm based in Ukraine, where I conducted market research and helped secure $73,000 in cloud funding for the company during the war.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work, I founded \u003cem\u003eThe Road to Rights\u003c/em\u003e, a nonprofit focused on bringing human rights education to schools in Russia. At Stanford, I help lead BASES (Business Association of Stanford Entrepreneurial Students), where I connect students with alumni and organize speaker series with industry leaders. I’m also a member of Stanford Finance and Stanford Consulting, where I’ve worked on projects related to investment banking and business strategy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy swimming, playing basketball, and traveling. I’m always happy to chat about school, careers, or anything in between—feel free to reach out!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ed5b35ba-d0e2-4716-af57-76e55eb3741a\"}"},{"__ref":"DeepDives:{\"uuid\":\"c23716f6-66ab-4607-a37c-722b399bf765\"}"},{"__ref":"DeepDives:{\"uuid\":\"8baf8f70-95d9-4257-b00c-804e2d20d9a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ff999d9-8518-46d5-8d28-40af4af7fc8a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/96268166-cbda-47eb-967e-e84b9cbebb89/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"073ed925-ed8f-4b1e-ac94-ce137556719e\"}"},{"__ref":"Education:{\"uuid\":\"5a98a06b-4aad-4ba6-84b5-f35d88e2f2a5\"}"}],"hiredAt":"2025-02-13T20:51:36.483Z","topics":["Calculus","Algebra I","Creative Writing","History Project","Business / Entrepreneurship","Finance / Investing","Law / Government / Policy","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jonathan-william\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"69dbdaf8-b647-4f69-8aec-4c0b293dcac8\"}"}}},"_sentryTraceData":"1db1e1bb6b9a4e9fa60244feac066a45-886dd6f30cf9f4f2-0","_sentryBagga
