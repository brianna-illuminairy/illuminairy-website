y growth as a person.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c780ee6c-6080-4d36-b0dc-14dcd5d95360\"}":{"__typename":"DeepDives","uuid":"c780ee6c-6080-4d36-b0dc-14dcd5d95360","content":"\u003cp\u003eIn my spare time, I do crafts or activities that involves working with my hands! I picked up knitting and crocheting this way. I like listening to podcasts while crafting with my cat sitting somewhere near by!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"661a9dc6-5201-401f-9770-b207e504f786\"}":{"__typename":"School","uuid":"661a9dc6-5201-401f-9770-b207e504f786","name":"Irvine High School","city":"Irvine","type":"HIGH","state":"California","country":"United States","zip":"92604"},"Education:{\"uuid\":\"b1829360-6425-4c91-b2c3-4503f281a715\"}":{"__typename":"Education","uuid":"b1829360-6425-4c91-b2c3-4503f281a715","school":{"__ref":"School:{\"uuid\":\"661a9dc6-5201-401f-9770-b207e504f786\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dce7d1c4-a7c2-4709-b1bc-26b1c68f5801\"}":{"__typename":"School","uuid":"dce7d1c4-a7c2-4709-b1bc-26b1c68f5801","name":"Pepperdine University","city":"Malibu","type":"COLLEGE","state":"California","country":"United States","zip":"90263"},"Education:{\"uuid\":\"ece9fcf3-1dff-4d31-9916-4d9242a502c9\"}":{"__typename":"Education","uuid":"ece9fcf3-1dff-4d31-9916-4d9242a502c9","school":{"__ref":"School:{\"uuid\":\"dce7d1c4-a7c2-4709-b1bc-26b1c68f5801\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"BA in Art and Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"7ee53f1c-6b2e-4eae-b2fa-2a5a6728e439\"}":{"__typename":"MentorPublicProfile","uuid":"7ee53f1c-6b2e-4eae-b2fa-2a5a6728e439","displayName":"HeeJoo R.","slug":"heejoo-roh","biography":"\u003cp\u003eHeeJoo is a Pepperdine University graduate with a BA in Art and Psychology. They are currently pursuing an MA in Mental Health and Counseling at Boston College.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eThey have an ample amount of research experience in psychology, having published an article in a mainstream psychological journal as a recent grad. They are passionate about teaching their mentees about what they can do to be involved with research at their school.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eIn art, they have experience in curating and exhibiting their body of work. They work in both digital and traditional media. Because of this, they are proficient in Procreate, Clip Studio Paint, oil painting, and other basic art materials. They have experience in talking to other artists about their passion, and helping them translate that feeling into a visual end goal.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eTheir artistic background also gives them expertise in subjects such as Art History, from antiquated art to contemporary. Subjects they are proficient in mentoring are: essay writing, psychology, art history, and art (such as portfolio building or teaching techniques).\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eIn their free time, HeeJoo likes to crochet and explore new crafts, and listen to podcasts :)\u003c/p\u003e","teachingVideoPlaybackId":"TWtSofe3x01eai5Dh00Wd801lDFXQPUKBLHELDIgiWsrZk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy most proudest achievement is having my year-long research project published in a psychology journal. Collecting data and analyzing numbers felt like it was all worth it to share my findings with the greater scientific community!\u003c/p\u003e","favorites":[{"__ref":"Fa
