xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e8fb2cc3-f6f6-461d-8012-e35bcece6648\"}":{"__typename":"DeepDives","uuid":"e8fb2cc3-f6f6-461d-8012-e35bcece6648","content":"\u003cp\u003eI chose my majors completely by chance! When I came to Northwestern, I was completely undecided on what I wanted to do. I randomly signed up for Computer Science and Cognitive Science introductory survey courses and fell in love with them! All it took was me getting out of my comfort zone and trying new things for me find two new passions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"76aba212-8e32-4a63-8e7e-d76329ac366e\"}":{"__typename":"DeepDives","uuid":"76aba212-8e32-4a63-8e7e-d76329ac366e","content":"\u003cp\u003eI would tell my high school or middle school self that comparison is the thief of joy. This is a pretty common saying, but I truly believe if I spent less time trying to worry what everyone was doing (both academically and socially), I would have been able to find out \"who I really am\" a little bit sooner.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"c76e4e4f-6904-41e7-8612-b11ffd3c83c3\"}":{"__typename":"DeepDives","uuid":"c76e4e4f-6904-41e7-8612-b11ffd3c83c3","content":"\u003cp\u003eI love to joke around and keep things light-hearted! Even if I am in the middle of a tense group project or work assignment, I think that keeping things fun (not unserious or off topic, just fun!) can make all the work get done just a little easier.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"64fb8c28-d824-4bac-a687-a440d51e1230\"}":{"__typename":"School","uuid":"64fb8c28-d824-4bac-a687-a440d51e1230","name":"Piedmont High School","city":"Piedmont","type":"HIGH","state":"California","country":"United States","zip":"94611"},"Education:{\"uuid\":\"45a8c972-1fab-423d-a34d-f26de86f52e6\"}":{"__typename":"Education","uuid":"45a8c972-1fab-423d-a34d-f26de86f52e6","school":{"__ref":"School:{\"uuid\":\"64fb8c28-d824-4bac-a687-a440d51e1230\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"6faee56f-c17d-413a-99a1-cae539a769c4\"}":{"__typename":"Education","uuid":"6faee56f-c17d-413a-99a1-cae539a769c4","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science/Cognitive Science","degree":null},"Testimonial:97b50b01-1929-4b95-aac1-80fc780c258e":{"__typename":"Testimonial","id":"97b50b01-1929-4b95-aac1-80fc780c258e","text":"Hunter Disco was a wonderful mentor to my son. He was able to help him along his programming journey. He was patient, kind and knowledgeable. We were lucky to have him!","date":"2025-05-20 18:19:50.27+00","rating":5,"endorser":{"__typename":"Endorser","name":"Katie Peck","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"f2a408b4-0c40-4a04-95f2-21e06865d7fd\"}":{"__typename":"MentorPublicProfile","uuid":"f2a408b4-0c40-4a04-95f2-21e06865d7fd","displayName":"Hunter D.","slug":"hunter-disco","biography":"\u003cp\u003e     Hi everyone! My name is Hunter Disco and I am currently a Senior at Northwestern University studying Computer Science, Cognitive Science, and French. I am originally from the Bay Area in California and am happy to say I haven't been overpowered by the Lake Michigan cold yet!\u003c/p\u003e\u003cp\u003e     I am passionate about all three of the things I study - I would love to make the barrier to entry for computer science and programming lower, I think everyone has the ability to learn another language and in doing so unlock a different side of who they are, and I think studying how we (humans) think can help with all aspects of life. I would love to mentor you or your child in any of these domains - but I am also excited to help with any passion projects that my mentees may have.\u003c/p\u003e\u003cp\u003e     Finally, outside of the classroom I am a huge soccer fan and sports nerd. I played soccer through high school and still like to get involved with intramural teams on campus! I'm looking forward to connecting with you through that. In addition, I think that travelling is a great way to step out of our comfort zones and learn more about ourselves. I recently completed a study abroad semester in France during which I visited 10+ countries!\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePlease don't hesitate to reach out!\u003c/p\u003e","teachingVideoPlaybackId":"00fuBQaElkk8BuZwmeMHwI7SkYM6oV5ci9u009QZRFuIg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science/Cognitive Science
