xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f10b43aa-9a99-40d5-b07b-7223c6dbda85\"}":{"__typename":"Favorites","uuid":"f10b43aa-9a99-40d5-b07b-7223c6dbda85","photoUrl":"https://ucarecdn.com/2db8cd8d-8668-492e-a7f2-b1734ae3367a/","title":"Kicker","type":"ALBUM"},"Favorites:{\"uuid\":\"d7eca494-0eb1-4eec-aa66-59b2c32234e2\"}":{"__typename":"Favorites","uuid":"d7eca494-0eb1-4eec-aa66-59b2c32234e2","photoUrl":"https://ucarecdn.com/d9075569-4004-482b-9f60-794a6a1c3636/","title":"The Omnivore's Dilemna","type":"BOOK"},"Favorites:{\"uuid\":\"610a7b5e-ff49-4530-a0d1-a4d00b1afbcb\"}":{"__typename":"Favorites","uuid":"610a7b5e-ff49-4530-a0d1-a4d00b1afbcb","photoUrl":"https://ucarecdn.com/6302914c-45d7-46cf-80c0-7090f3ecfb42/","title":"The Author","type":"SONG"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"5aa3efb2-dfa6-4623-ae9f-896c52c33442\"}":{"__typename":"DeepDives","uuid":"5aa3efb2-dfa6-4623-ae9f-896c52c33442","content":"\u003cp\u003eMy dream job is to lead research in the cultivated meat sector! As someone getting a degree in food science but has most of their experience in cell biology, I hope to combine these fields in order to best convert cells to food. In doing so, I could help contribute to a sustainable, but also delicious addition to the food system.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"33fa3122-d327-4a45-b18c-6b04f09ed15e\"}":{"__typename":"DeepDives","uuid":"33fa3122-d327-4a45-b18c-6b04f09ed15e","content":"\u003cp\u003eOne passion project I’m especially proud of was developing a snack designed specifically for kids. We started by thinking about what makes a snack fun, approachable, and enjoyable, but also mindful of nutrition and accessibility. During the ideation phase, we explored a wide range of formats before landing on a meringue-style cookie as a way to create something light, appealing, and naturally flexible in terms of ingredients.\u003c/p\u003e\u003cp\u003eFrom there, the challenge became how to make it unique and meaningful. We worked to design a version that was high in protein, vegan, allergen-friendly, and sugar-free, which pushed us to think creatively about ingredient functionality and texture. The process involved a lot of testing and rethinking, but it taught me how strong ideation can guide a project from a broad goal into a clear, differentiated product.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"96bd33ed-8e16-46d2-aecd-40e029abdf67\"}":{"__typename":"DeepDives","uuid":"96bd33ed-8e16-46d2-aecd-40e029abdf67","content":"\u003cp\u003eBack in middle and high school, my academic focus was always in biology and chemistry. I spent lots of time studying just the theory behind these subjects, but could never gain exposure to why these subjects are important. Around the time I began thinking about college apps I started really getting into cooking, and food science seemed like a natural bridge for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt that point, I had a choice: keep studying biology and chemistry in a way that felt too theoretical, or find a path where those subjects had a clear purpose. Food science stood out because it made the “why” obvious. It let me connect molecular ideas to real constraints (taste, cost, nutrition, shelf life, sustainability) and it made me excited to learn more because every concept had an application. That’s why I chose it: it matched how I naturally learn and what I wanted my work to impact.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"ecb746ac-9f64-4b94-a141-95e19f549130\"}":{"__typename":"DeepDives","uuid":"ecb746ac-9f64-4b94-a141-95e19f549130","content":"\u003cp\u003eOut of all the things I could be doing, I chose mentorship because I remember how long it took me to understand why the things I was learning actually mattered. I didn’t struggle with biology or chemistry, but I struggled to see their purpose and didn’t have much guidance on how to connect those subjects to the real world. Mentorship gives me the chance to offer students the kind of support I wish I’d had: helping them make those connections earlier and build confidence by turning curiosity into something tangible. I enjoy guiding students through the thinking process and helping them realize they’re capable of more than they think.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"f5898d3c-e56c-495e-9861-83ce5477e0a9\"}":{"__typename":"School","uuid":"f5898d3c-e56c-495e-9861-83ce5477e0a9","name":"The Bishop’s School","city":"San Diego","type":"HIGH","state":"California","country":"United States","zip":"92037"},"Education:{\"uuid\":\"bf3a219a-fb25-49bf-945e-e627f07cb99a\"}":{"__typename":"Education","uuid":"bf3a219a-fb25-49bf-945e-e627f07cb99a","school":{"__ref":"School:{\"uuid\":\"f5898d3c-e56c-495e-9861-83ce5477e0a9\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"addafdce-1e4f-49fc-ac75-86a098d4888b\"}":{"__typename":"Education","uuid":"addafdce-1e4f-49fc-ac75-86a098d4888b","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Food Science","degree":null},"MentorPublicProfile:{\"uuid\":\"5844879c-bb92-40d1-820c-fedcfc1b6042\"}":{"__typename":"MentorPublicProfile","uuid":"5844879c-bb92-40d1-820c-fedcfc1b6042","displayName":"Eric L.","slug":"eric-li","biography":"\u003cp\u003eHi! I'm Eric, a senior at Cornell University studying food science, and I work at the intersection between science, food and creativity, helping students build things they are proud of! \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMy history:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I was younger, I loved science but felt boxed in by traditional classes. I didn't want to just memorize, but rather to build, test, and create something meaningful. This led me to food science, where I could combine my scientific knowledge with real-world impact and interactions. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, I've:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCompleted multiple \u003cstrong\u003eindustry internships in alternative protein\u003c/strong\u003e, contributing to projects in lab-grown meat, artificial breast milk, and fermentation\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCollaborated with a \u003cstrong\u003emajor food company\u003c/strong\u003e to develop a snack product using upcycled ingredients\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCo-led a product development team and developed a \u003cstrong\u003ehigh protein, vegan, allergen-friendly, and sugar free meringue cookie\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat I specialize in:\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI mentor middle and high school students who are curious about science and want to explore it beyond the classroom. I work especially well with students who enjoy asking “why” and want help turning that curiosity into something concrete.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI support students with:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eScience and research passion projects\u003c/strong\u003e, helping students turn curiosity in biology, chemistry, or food science into clear, well-scoped projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eProduct and innovation projects\u003c/strong\u003e, such as designing a food concept, prototype, or sustainability-focused idea from start to finish\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStrengthening academic foundations through application\u003c/strong\u003e, helping students deepen their understanding of core science subjects by using them in real-world and project-based contexts\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eBy the end of our work together, students leave with clearer thinking, stronger foundations, and tangible progress they can see.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy am I qualified, and what would a session look like?:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003eThrough my broad experiences in research, industry, and product development, I've learned how to break problems down in a way that can suit anybody. In addition, I’ve spent a lot of time working through projects that didn’t go as planned, which helps me guide students through challenges with clarity, patience, and confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical lesson with me might include:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eExploring a \u003cstrong\u003eniche up-and coming technology\u003c/strong\u003e related to your topic\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAn \u003cstrong\u003einteractive breakdown\u003c/strong\u003e of what went well, what didn't, and why in a product development project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing how to \u003cstrong\u003epitch an idea or product\u003c/strong\u003e to different audiences, fiends, family, judges, or anyone else!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eFun Facts!\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I spend lots of time cooking/baking, developing recipes and trying out all sorts of flavor combinations. In fact, every year I bake a crepe cake for my birthday with layers equal to the age I'm turning - most recently with fig leaf crepes, lemon balm \u0026amp; bay leaf pastry cream, and poached quince! \u003c/p\u003e\u003cp\u003eI've also played jazz saxophone for 11 years now and recently started writing my own songs as well. I love the community aspect of music, and would love to know what songs are meaningful to you. :)\u003c/p\u003e","teachingVideoPlaybackId":"Vk28XFwFWsPyMi2PwJiEsVe4xseUewt9gJztb5v00lJ8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is sticking with saxophone for over a decade and continuing to grow as a musician. I’ve played for 11 years, moving from structured classical training into jazz, which pushed me to get comfortable with improvisation, listening closely to others, and learning through trial and error.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver time, that growth led me to earn a spot in Cornell’s top jazz ensemble and multiple small-group combos, where collaboration and accountability matter just as much as individual skill. I’ve also had the opportunity to perform in local venues, including bars and community spaces, which taught me how to connect with different audiences and show up consistently as a musician. Being able to share music outside of the classroom and see people respond to it has been especially meaningful to me.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f10b43aa-9a99-40d5-b07b-7223c6dbda85\"}"},{"__ref":"Favorites:{\"uuid\":\"d7eca494-0eb1-4eec-aa66-59b2c32234e2\"}"},{"__ref":"Favorites:{\"uuid\":\"610a7b5e-ff49-4530-a0d1-a4d00b1afbcb\"}"}],"causesSupported":[],"major":"Food Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5aa3efb2-dfa6-4623-ae9f-896c52c33442\"}"},{"__ref":"DeepDives:{\"uuid\":\"33fa3122-d327-4a45-b18c-6b04f09ed15e\"}"},{"__ref":"DeepDives:{\"uuid\":\"96bd33ed-8e16-46d2-aecd-40e029abdf67\"}"},{"__ref":"DeepDives:{\"uuid\":\"ecb746ac-9f64-4b94-a141-95e19f549130\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/78c0df3f-0d03-4b52-9dff-85cb9a085f4a/-/preview/-/format/jpg/","https://ucarecdn.com/c29be684-8986-4053-8001-a3774ae5a87a/-/preview/-/format/jpg/","https://ucarecdn.com/7896e89e-e088-4569-9828-2156a6edad7c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"bf3a219a-fb25-49bf-945e-e627f07cb99a\"}"},{"__ref":"Education:{\"uuid\":\"addafdce-1e4f-49fc-ac75-86a098d4888b\"}"}],"hiredAt":"2025-12-21T22:13:45.571Z","topics":["Algebra I","Algebra II","Geometry","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Chemistry","Academic Coaching","College Essay Writing","Executive Function","Music","Video / Photography","Machine Learning / AI","Medicine / Health","STEM Project","Sustainability"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"eric-li\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5844879c-bb92-40d1-820c-fedcfc1b6042\"}"}}},"_sentryTraceData":"32fc6c613b924044818631b1f9d9eb2c-a5c7ac68a3a8bbb0-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=32fc6c613b924044818631b1f9d9eb2c,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"eric-li"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
