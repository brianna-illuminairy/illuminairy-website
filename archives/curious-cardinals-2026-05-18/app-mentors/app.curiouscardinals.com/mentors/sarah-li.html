"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Nursing and Healthcare Management","degree":null},"MentorPublicProfile:{\"uuid\":\"f9cc15a5-e831-460b-bfd5-9b4e9d46cb01\"}":{"__typename":"MentorPublicProfile","uuid":"f9cc15a5-e831-460b-bfd5-9b4e9d46cb01","displayName":"Sarah L.","slug":"sarah-li","biography":"\u003cp\u003eHi! I’m Sarah Li, a freshman at the University of Pennsylvania in the dual-degree Nursing and Healthcare Management program between Wharton and Penn Nursing. It’s a pretty intense combo, but I genuinely love what I’m learning about, whether I’m diving into the nerves that help us breathe or exploring game theory in price-discriminating monopolies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m originally from Midland, Michigan, where I went to a public high school. One of my favorite parts was leading the Genes in Diseases and Symptoms club. I taught my team how to write research abstracts, successfully publishing two, and was delighted when we won First Prize “The Best Research – Oral Presentations II” in the 11th Annual High School Research Conference. I also volunteered over 250 hours at my local hospital, which really inspired me to pursue a career in healthcare.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m a musician at heart. I’ve played piano since I was five (even performed at Carnegie Hall twice!) and picked up viola in eighth grade, which I love because there’s just something magical about playing in an orchestra. When I’m not studying or practicing music, I’m probably cafe hopping with friends to determine which has the best boba, watching C-dramas late at night, or making pipe cleaner flower bouquets (you can see my first one ever in my profile pictures!)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my mission is to empower my mentees, ensure they feel acknowledged, and support them in achieving their goals. I want my mentees to feel seen and supported—whether they're trying to build better study habits or working towards getting into their dream school. I know goals can shift as people grow, and I’m here for that journey, bumps and all.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA lot of the time, the biggest hurdles we face come from within, like self-doubt, fear of messing up, or just being scared to try something new. That’s where I come in. I want to encourage my mentees to take chances, believe in themselves, and lean into the uncomfortable moments because that’s where real growth happens.\u0026nbsp; And honestly, I always end up learning just as much from my mentees as they do from me—sometimes even more :)\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"4iu8maSL3rOeqQ01ydmH9U7go023k02UKI6waD6QmG49F4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6b294c44-6dc5-48eb-86c0-ea9585c7e62a\"}"},{"__ref":"Favorites:{\"uuid\":\"b75d5c51-926f-4c07-a440-5cb1876aba99\"}"},{"__ref":"Favorites:{\"uuid\":\"6405b6e2-3994-4517-83a9-bb917b5ad013\"}"}],"causesSupported":[],"major":"Nursing and Healthcare Management","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1e9b5b39-4816-4985-8b8f-199fcf4372c6\"}"},{"__ref":"DeepDives:{\"uuid\":\"707d6e1e-e550-4b89-9759-b6a393d84f76\"}"},{"__ref":"DeepDives:{\"uuid\":\"f375bcb3-da7c-417f-a877-a5d253d817f5\"}"},{"__ref":"DeepDives:{\"uuid\":\"5e06046a-ba6f-4417-bb6a-4188d703062c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3cdf4726-e70d-46d2-bf58-bfbab341e17e/-/preview/-/format/jpg/","https://ucarecdn.com/56529bb0-dbce-48d6-a0d1-c65735a229b3/-/preview/-/format/jpg/","https://ucarecdn.com/b1dbabbe-c92b-4d9d-85ee-109ae516e067/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8bbeb439-b8e6-4181-a21c-7b09d11b4b2d\"}"},{"__ref":"Education:{\"uuid\":\"1d548655-0844-4fa1-9caf-b56bb951c4f0\"}"}],"hiredAt":"2025-04-18T09:12:15
