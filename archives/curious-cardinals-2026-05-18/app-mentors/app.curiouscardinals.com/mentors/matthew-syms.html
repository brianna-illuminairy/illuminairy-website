xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"96b39343-78c1-4cb1-99d9-1fa154508186\"}":{"__typename":"Favorites","uuid":"96b39343-78c1-4cb1-99d9-1fa154508186","photoUrl":"https://ucarecdn.com/67381196-b1ec-40e2-9f52-fb87a1878e4b/","title":"Wish You Were Here - Pink Floyd","type":"ALBUM"},"Favorites:{\"uuid\":\"872f0ad4-fc2c-46c7-9166-402ef3b0ae08\"}":{"__typename":"Favorites","uuid":"872f0ad4-fc2c-46c7-9166-402ef3b0ae08","photoUrl":"https://ucarecdn.com/6c636c77-267e-4afa-80bf-f14a0ecfd86a/","title":"Edward Norton","type":"ACTOR"},"Favorites:{\"uuid\":\"93609d44-40c3-4093-a2c4-c440e948c772\"}":{"__typename":"Favorites","uuid":"93609d44-40c3-4093-a2c4-c440e948c772","photoUrl":"https://ucarecdn.com/703aee50-841e-4ed3-a7ed-4c3c90c31b66/","title":"The 13 1/2 Lives of Captain Bluebear by Walter Moers","type":"BOOK"},"CausesSupported:{\"uuid\":\"9b0fa7ac-3737-47f6-9fea-e06ad9c7f267\"}":{"__typename":"CausesSupported","uuid":"9b0fa7ac-3737-47f6-9fea-e06ad9c7f267","name":"Boy Scouts of America (BSA)","description":"","photoUrl":"https://ucarecdn.com/934ccd91-934e-443a-a7f2-1884be499ab9/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4e40a1a7-551c-418f-a0c9-5bf8b67b2338\"}":{"__typename":"DeepDives","uuid":"4e40a1a7-551c-418f-a0c9-5bf8b67b2338","content":"\u003cp\u003eI’ve always loved Taylor Mali’s poem “What Teachers Make.” I think it perfectly encapsulates the power of mentorship. In it, Mali expresses the idea that the right guidance can completely change how someone sees themselves and what they’re capable of: “[a teacher] can make a C+ feel like a Congressional Medal of Honor and an A-­ feel like a slap in the face.” Mentorship matters to me because I’ve had teachers, coaches, and neighbors who saw potential in me that I didn’t yet see in myself. I want to be that person for someone else. It’s not about lecturing; it’s about helping someone recognize their own potential and giving them the spark to run with it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6bf1ce5a-8cd3-4532-acd6-deac6a8c2d4a\"}":{"__typename":"DeepDives","uuid":"6bf1ce5a-8cd3-4532-acd6-deac6a8c2d4a","content":"\u003cp\u003eI spent my summers working as a lifeguard and instructor at Camp Emerald Bay, a Boy Scout camp off the coast of California. I taught motorboating, canoeing, kayaking, sailing, snorkeling, rowing, swimming, and lifesaving, and it was easily one of the best leadership experiences of my life. Living and working with the same team all summer taught me a lot about community, responsibility, and keeping your cool under pressure, especially when you’re teaching a bunch of teens to steer a 2-horsepower motorboat through the ocean!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"dc7354ab-9f20-4390-8820-b311e92ee96f\"}":{"__typename":"DeepDives","uuid":"dc7354ab-9f20-4390-8820-b311e92ee96f","content":"\u003cp\u003eMy greatest role model is my grandfather, who immigrated from Italy during WWII and worked as a barber in Long Island, NY. He never complained, no matter how hard things got. Despite all the sacrifices he made, all he ever asked for was a bowl of pasta and good company. His humility, work ethic, and quiet joy are constant reminders of what really matters. He’s the reason I try to approach life with humor, patience, and gratitude, no matter what I’m doing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1d9cb277-25b3-4210-aa9b-5cd50d8cbd1a\"}":{"__typename":"DeepDives","uuid":"1d9cb277-25b3-4210-aa9b-5cd50d8cbd1a","content":"\u003cp\u003eProfessionally, I’d love to write, perform, or create something that genuinely connects with people: something that makes them laugh. I think laughter keeps people grounded; it’s one of the best ways to find perspective and stay human, no matter what you’re going through. I’ve always admired art that brings people together through humor and shared experience.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn a lighter note, I’ve also always wanted to compete on Survivor. I grew up watching Jeopardy and Wheel of Fortune with my parents, but Survivor combines all my favorite things. It has the outdoors, strategy, and a bit of chaos. It’s the ultimate test of creativity, teamwork, and resilience, and I like to think I’d hold my own out there (though I’d definitely miss a bed, water, real food…).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}":{"__typename":"School","uuid":"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5","name":"Choate Rosemary Hall","city":"Wallingford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06492"},"Education:{\"uuid\":\"f2e4a233-3101-4d85-9f7e-d70e29e4d202\"}":{"__typename":"Education","uuid":"f2e4a233-3101-4d85-9f7e-d70e29e4d202","school":{"__ref":"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}"},"startYear":"2019","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"dceda567-7587-4131-a5f7-0b46d25a279a\"}":{"__typename":"Education","uuid":"dceda567-7587-4131-a5f7-0b46d25a279a","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Government Modified w/ Philosophy \u0026 Human-Centered Design (Engineering)","degree":null},"MentorPublicProfile:{\"uuid\":\"acc702b4-dfcc-400f-95d7-906f0832850d\"}":{"__typename":"MentorPublicProfile","uuid":"acc702b4-dfcc-400f-95d7-906f0832850d","displayName":"Matthew S.","slug":"matthew-syms","biography":"\u003cp\u003eHey! I’m Matthew, a Dartmouth student from the rugged Southwest of Arizona. I grew up attending a tiny school where I performed plays on the same local stage Emma Stone got her start. Performing from a young age sparked my love for acting, comedic writing, and creative expression. Most importantly, it taught me discipline, collaboration, and how to push myself while having fun.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese skills eventually opened the door for me to transfer to boarding school at Choate, where I was thrown into the freezing East Coast. I was not ready! Naturally, I then decided to go even farther north to Dartmouth, nestled in the woods of New Hampshire. There, I performed in improv, a cappella, stage plays, and student-written films, exploring different ways to make people laugh, think, and feel. Now I’m back in the sunny West, working in Hollywood as a production assistant, reviewing and developing scripts for studios.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve long admired comedians like Andy Kaufman, PDD, Conan O’Brien, and Robin Williams; that same sense of play, experimentation, and risk-taking guides how I approach mentorship. I work with young creators and learners on whatever sparks their curiosity: writing, storytelling, creative projects, research, academic exploration, and more! Having navigated different schools, creative programs, and unconventional paths myself, I love sharing the little tips, tricks, and behind-the-scenes insights that can make challenging projects more manageable and exciting. My goal is to help mentees expand their horizons, gain confidence, and see new possibilities for what they can accomplish.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy love for exploration also stems from my experience as an Eagle Scout and Red Cross lifeguard. I’ve spent over a decade volunteering, hiking, swimming, skiing, and snowboarding, and I enjoy challenging myself outdoors. This spring, I canoed 400 miles from Dartmouth to the ocean. When I’m not outdoors, I’m usually playing endless games on chess.com, watching football (I’m torn between the Cardinals and the Eagles – either way, Go Birds!), or practicing Italian with my family.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I bring energy, humor, and creativity into every session. I write short stories, design posters, and perform sketch comedy, and I love helping you tackle projects in ways that are fun, hands-on, and a little unexpected. Whether we’re unpacking your story for college, brainstorming a creative project, or experimenting with something new, I focus on making the process engaging and approachable. If you enjoy storytelling, creativity, and a mentor who’s a little goofy, I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"obYP9GHAc6cQMZpbpWu500tU8NnZrVtEDxRSdsuCjFqE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"96b39343-78c1-4cb1-99d9-1fa154508186\"}"},{"__ref":"Favorites:{\"uuid\":\"872f0ad4-fc2c-46c7-9166-402ef3b0ae08\"}"},{"__ref":"Favorites:{\"uuid\":\"93609d44-40c3-4093-a2c4-c440e948c772\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"9b0fa7ac-3737-47f6-9fea-e06ad9c7f267\"}"}],"major":"Government Modified w/ Philosophy \u0026 Human-Centered Design (Engineering)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4e40a1a7-551c-418f-a0c9-5bf8b67b2338\"}"},{"__ref":"DeepDives:{\"uuid\":\"6bf1ce5a-8cd3-4532-acd6-deac6a8c2d4a\"}"},{"__ref":"DeepDives:{\"uuid\":\"dc7354ab-9f20-4390-8820-b311e92ee96f\"}"},{"__ref":"DeepDives:{\"uuid\":\"1d9cb277-25b3-4210-aa9b-5cd50d8cbd1a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a19122a2-fb80-4224-8a37-3d9347ff783c/-/preview/-/format/jpg/","https://ucarecdn.com/4b0aad8d-8582-4bca-9d48-911e83586e98/-/preview/-/format/jpg/","https://ucarecdn.com/63326c8e-440c-48dc-bdd8-808d0a2daa35/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f2e4a233-3101-4d85-9f7e-d70e29e4d202\"}"},{"__ref":"Education:{\"uuid\":\"dceda567-7587-4131-a5f7-0b46d25a279a\"}"}],"hiredAt":"2025-10-31T17:33:57.774Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Biology","6-8 Grade Science","Writing","College Essay Writing","Reading","History","Academic Coaching","K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Law / Government / Policy","Debate","Public Speaking","Journalism"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/ceacbeeb-af28-4003-96cf-d977276b04ef/"],"restrictedProfileVisibility":false,"displayCampaignVisibi
