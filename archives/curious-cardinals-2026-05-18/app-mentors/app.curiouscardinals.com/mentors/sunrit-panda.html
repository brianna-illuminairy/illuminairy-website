xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e15517b9-0b7f-4aec-bac6-f95606b0d5dc\"}":{"__typename":"Favorites","uuid":"e15517b9-0b7f-4aec-bac6-f95606b0d5dc","photoUrl":"https://ucarecdn.com/e1fe42eb-19a6-4d57-8e10-39659898ceff/","title":"Michelle Yeoh","type":"ACTOR"},"Favorites:{\"uuid\":\"2c55b1ac-c052-4bee-977a-946893562920\"}":{"__typename":"Favorites","uuid":"2c55b1ac-c052-4bee-977a-946893562920","photoUrl":"https://ucarecdn.com/ffe28bdf-4336-4b0a-b033-0ac309f6c0c9/","title":"The Poisonwood Bible","type":"BOOK"},"Favorites:{\"uuid\":\"6802c484-f684-4155-a6d1-61efb6c81943\"}":{"__typename":"Favorites","uuid":"6802c484-f684-4155-a6d1-61efb6c81943","photoUrl":"https://ucarecdn.com/d76f6699-4488-4bf3-a9a6-b2d4f79c3ab1/","title":"Kolkata","type":"CITY"},"CausesSupported:{\"uuid\":\"53067dff-2e36-4d2f-9d76-7396fec3d8b7\"}":{"__typename":"CausesSupported","uuid":"53067dff-2e36-4d2f-9d76-7396fec3d8b7","name":"Impact Investment Exchange Foundation","description":"\u003cp\u003eConnecting the world's back-streets to wall street. Emerging markets in SE Asia.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/be30876f-1b0d-4303-a91e-068f688340bc/"},"CausesSupported:{\"uuid\":\"820623b6-332c-45be-a2a9-eb1d3a9ccdb5\"}":{"__typename":"CausesSupported","uuid":"820623b6-332c-45be-a2a9-eb1d3a9ccdb5","name":"Scholars of Finance","description":"\u003cp\u003eSocial impact in finance by supporting character and integrity in the industry.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/72cf4add-1735-482e-bf6b-222ab40b4dd3/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"552dd155-55a9-4c81-97b6-2d6d9eba1910\"}":{"__typename":"DeepDives","uuid":"552dd155-55a9-4c81-97b6-2d6d9eba1910","content":"\u003cp\u003eMy major has a fancy name and is part of the engineering school but at the end of the day it is\u003cem\u003e Applied Math\u003c/em\u003e. Including but not limited to statistics, optimization, machine learning, probability, and a lot more. Want to know the math behind people lining up at the grocery checkout? Or what about how epidemiologist create models to predict the next COVID outbreak? That's what I'm learning\u003cbr\u003e\u003cbr\u003eI've always thought that engineering teaches an incredibly practical way to consume the world around us. I don't plan on ever directly using the poisson distribution, bayesian regression, or any of the other techniques fill up my class-time. But because I've spent hours grinding on these concepts, I can look at a real-life problem of any form, dissect it logically, and solve it practically--all in my head. In my opinion, having an intuition for how numbers work is supremely useful for literally anything you want to accomplish.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"4c8c9a11-cb9b-4063-b522-1c0907ba9479\"}":{"__typename":"DeepDives","uuid":"4c8c9a11-cb9b-4063-b522-1c0907ba9479","content":"\u003cp\u003eNot exact a silly dream, but I lucid dream \u003cem\u003ea lot\u003c/em\u003e. Sometimes it's silly and I can reenact my day and choose to add in some surprises. Sometimes, I'm really stressed and I'll end up deciding to work in my dream. But it's the best when I visit people in my dreams.\u003cbr\u003e\u003cbr\u003eIt's happened a few times where I decide to visit a really close friend in my dream. And, the next day they tell me that they dreamt of me. Something weird and supernatural going on there... I'm sure science will figure it out in the next 50 years.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"6477a652-1e82-46c6-a3be-4e2c1e875184\"}":{"__typename":"DeepDives","uuid":"6477a652-1e82-46c6-a3be-4e2c1e875184","content":"\u003cp\u003eI had dreamed of being a doctor since I was in middle school. Sure it may have started with Grey's Anatomy, but from my perspective at the time, medicine was the best way to help people. I have since transitioned into finance, which at a first glance seems antithetical to medicine. However, my exploration of impact finance has sold me on the power of capital to multiply any individual impact that I may have created as a physician. The large issues facing our society, including those related to healthcare, have an undeniable connection to finance. We need to think critically about how Wall Street affects Main Street. And ultimately, I want to end up in a position in my career where I can sign a contract or hold a meeting and immediately millions of lives are materially improved. In my lifetime, I want to look back and know for certain that my actions have made the world a more equitable and just place.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"3808d4b6-0c7d-40ed-b1c7-c2e9db3f8936\"}":{"__typename":"DeepDives","uuid":"3808d4b6-0c7d-40ed-b1c7-c2e9db3f8936","content":"\u003cp\u003e\u003cstrong\u003e2017\u003c/strong\u003e\u003cbr\u003eTook bio classes as part of a program at my highschool that allowed students to take AP classes in 9th grade. Talked out some (in retrospect) childish 8th grade drama.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e2018\u003cbr\u003e\u003c/strong\u003eNothing. I think the most significant event was that my dad got a six flags season pass so we went there every other weekend.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e2019\u003c/strong\u003e\u003cbr\u003eCompleted at the Australian Open Taekwondo championship. Completed a cancer research internship at my local medical school. Studied for and took my SATs. Attended some seminars at UPittsburgh and Memorial Sloan Kettering Cancer Center.\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e2020\u003c/strong\u003e\u003cbr\u003eStarted an international mental health textline during the pandemic. Planned a virtual TEDx conference. Started an independent research project on mental health with a local professor. Completed 37 college applications.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"6fe6ae26-3a9b-412e-a266-13be230f0862\"}":{"__typename":"School","uuid":"6fe6ae26-3a9b-412e-a266-13be230f0862","name":"Edison High School","city":"Edison","type":"HIGH","state":"NJ","country":"USA","zip":"08817"},"Education:{\"uuid\":\"765f3f8a-cd17-44a4-b651-d4962d102d9f\"}":{"__typename":"Education","uuid":"765f3f8a-cd17-44a4-b651-d4962d102d9f","school":{"__ref":"School:{\"uuid\":\"6fe6ae26-3a9b-412e-a266-13be230f0862\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b91e9529-ef75-4c83-a386-e9100aaff98e\"}":{"__typename":"School","uuid":"b91e9529-ef75-4c83-a386-e9100aaff98e","name":"Princeton University - School of Engineering","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"b093e1b1-405f-411a-bf5b-7e6a6e208c4c\"}":{"__typename":"Education","uuid":"b093e1b1-405f-411a-bf5b-7e6a6e208c4c","school":{"__ref":"School:{\"uuid\":\"b91e9529-ef75-4c83-a386-e9100aaff98e\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Operations Research \u0026 Financial Engineering • minoring in Computer Science, Statistics \u0026 Machine Learning, Optimization \u0026 Quantitative Decision Science, Finance, and Environmental Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"5c2d055c-fac7-474f-8626-eca53bd3ff18\"}":{"__typename":"MentorPublicProfile","uuid":"5c2d055c-fac7-474f-8626-eca53bd3ff18","displayName":"Sunrit P.","slug":"sunrit-panda","biography":"\u003cp\u003eI'm a Fulbright-Nehru scholar with Princeton University's Center for Policy Research on Energy and Environment and IIT Kharagpur's Agricultural Engineering Department\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my engineering education at Princeton University, I took an interdisciplinary course of study with 5 minor subjects.I've delved into niche non-math subjects such as Ethics in Finance, Nature in Greco-Roman Antiquity, and Chinese language. I've consistently published posters and given talks at academic conference on my work. Finally, I completed my senior independent research on two subjects: remote sensing of methane emissions using satellite data and Europe-Indian carbon trade regulations. My interests right now are at the intersection of finance, sustainability, and global development—and I am the co-founder of a social enterprise aiming to solve large-scale environmental issues in the global south. Most recently, I spoke at the United Nations COP29 Climate Finance conference.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn college, I used to be on the cheerleading team, am a\u0026nbsp;\u003cem\u003ecasual\u003c/em\u003e\u0026nbsp;member of the Taekwondo club team, and try to fill my free time with spin classes. I also help lead Princeton's South Asian Student Association and Indian classical music group, Swara. Throughout school, I've worked part-time for the Office of Sustainability, a Singapore-based impact investment firm, and as a private tutor. Finally, my biggest pre-professional commitment was Scholars of Finance, a national nonprofit organization dedicated to integrity and social impact in financial services. Though only involved as an advisor now, I was the president of the Princeton chapter and was employed part-time by the national organization for a year and a half. I've also worked for startups and participated in various other cool initiatives including a summer of ecological restoration on Moloka'i, Hawai'i, and an Artificial Intelligence education project in Rural India.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eBefore college, I rigorously trained for over a decade in Hindustani Vocal Classical music with performances on TV, radio, and across the world. I am also a 2nd degree black belt Taekwondo instructor and competitor in the USAT Circuit. I spent summer 2021 as the general manager of my local Taekwondo center where I succeeded in saving the business from bankruptcy. \u003cbr\u003e\u003cbr\u003eIn high school, I founded and led the iSTEM and TEDx clubs. Through iSTEM club I created STEM-based community service initiatives, and I'm also leading a IEEE-in-epics grant project to bring clean drinking water to a drought-stricken village in rural West Bengal. With TEDx, I worked with 15 speakers to host two conferences in fields ranging from theatre to medical research to civil engineering. Details of these initiatives are published in three poster papers in the proceedings of the IEEE Integrated STEM Education Conference. I also have diverse experiences in the world of science and healthcare. My commitment to mental health motivated him to found a peer-counseling textline that worked with numerous teens in 7 countries during the pandemic. I also conducted caloric restriction and Fibroblast Growth Factor 21 oncology research at Rutgers New Jersey Medical School. Finally, bridging my interests in health care and English literature, I gave an oral presentation at the University of Pittsburgh Humanities in Healthcare conference, the abstract of which is published on HealthPivot.org. \u003cbr\u003e\u003cbr\u003eI'm passionate about mentoring students because I've benefited from life-changing guidance throughout my journey. I consistently give talks at college camps for underprivileged students, am actively involved in sustainability community service, and always look for opportunities to pass along everything that I have learned.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003e\u003cem\u003eI measure my success by the impact I have on others. \u003c/em\u003e\u003cbr\u003e\u003cbr\u003eIn particular, I mentored a Cameroonian international student through Curious Cardinals for his college transfer applications. During that process, I learned about his recovery from sickle cell disease, the organization he started to support hundred of African families afflicted by the illness, and his dreams for the future of sickle cell disease treatment. Even after our engagement officially ended, I continued to meet with him regularly and forward him opportunities. I got to meet him in New York when he attended a conference I had encouraged him to apply for. And since then, he has created a Stanford research program to promote African student scientists, secured a contract with one of the world's largest genomic companies to develop a cheaper sickle cell disease test, and been named a Future Nobel Laureate by the Nobel Prize Museum.\u003cbr\u003e\u003cbr\u003eFor me, my proudest moment is having contributed to the success of a future world-maker such as himself.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e15517b9-0b7f-4aec-bac6-f95606b0d5dc\"}"},{"__ref":"Favorites:{\"uuid\":\"2c55b1ac-c052-4bee-977a-946893562920\"}"},{"__ref":"Favorites:{\"uuid\":\"6802c484-f684-4155-a6d1-61efb6c81943\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"53067dff-2e36-4d2f-9d76-7396fec3d8b7\"}"},{"__ref":"CausesSupported:{\"uuid\":\"820623b6-332c-45be-a2a9-eb1d3a9ccdb5\"}"}],"major":"Operations Research \u0026 Financial Engineering • minoring in Computer Science, Statistics \u0026 Machine Learning, Optimization \u0026 Quantitative Decision Science, Finance, and Environmental Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"552dd155-55a9-4c81-97b6-2d6d9eba1910\"}"},{"__ref":"DeepDives:{\"uuid\":\"4c8c9a11-cb9b-4063-b522-1c0907ba9479\"}"},{"__ref":"DeepDives:{\"uuid\":\"6477a652-1e82-46c6-a3be-4e2c1e875184\"}"},{"__ref":"DeepDives:{\"uuid\":\"3808d4b6-0c7d-40ed-b1c7-c2e9db3f8936\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a1970ba4-2db5-45b1-a79b-6ba02326efcf/-/preview/-/format/jpg/","https://ucarecdn.com/169f9645-78b1-458f-93cf-7d1aeeac4b3c/-/preview/-/format/jpg/","https://ucarecdn.com/22536d3d-df78-41e8-9887-7084b9ef35e1/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"765f3f8a-cd17-44a4-b651-d4962d102d9f\"}"},{"__ref":"Education:{\"uuid\":\"b093e1b1-405f-411a-bf5b-7e6a6e208c4c\"}"}],"hiredAt":"2022-01-06T02:41:05.000Z","topics":["Biology","Chemistry","Physics","Writing","Academic Coaching","College Essay Writing","Computer Science","Economics","Executive Function","History","Reading","History Project","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Machine Learning / AI","STEM Project","Law / Government / Policy","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sunrit-panda\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5c2d055c-fac7-474f-8626-eca53bd3ff18\"}"}}},"_sentryTraceData":"d0112afc126b4cda8f09c46772e1ae4d-9b3203221d93218e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d0112afc126b4cda8f09c46772e1ae4d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sunrit-panda"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
