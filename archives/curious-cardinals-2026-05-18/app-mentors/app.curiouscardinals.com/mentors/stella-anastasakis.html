xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9f554d5b-88a5-4cef-81fd-c49d6ca98ef0\"}":{"__typename":"Favorites","uuid":"9f554d5b-88a5-4cef-81fd-c49d6ca98ef0","photoUrl":"https://ucarecdn.com/71cbc065-7fbc-49bb-a666-ecd003b58944/","title":"Lessons in Chemistry","type":"BOOK"},"Favorites:{\"uuid\":\"35e778a4-1bd7-489e-bae4-20c88b06d8c4\"}":{"__typename":"Favorites","uuid":"35e778a4-1bd7-489e-bae4-20c88b06d8c4","photoUrl":"https://ucarecdn.com/d0be1661-5b8c-4b11-987c-ba46cca9c07c/","title":"Seattle, WA","type":"CITY"},"Favorites:{\"uuid\":\"d8d154ac-8217-47dd-9aa6-0671f7c4f422\"}":{"__typename":"Favorites","uuid":"d8d154ac-8217-47dd-9aa6-0671f7c4f422","photoUrl":"https://ucarecdn.com/cc2cd2ab-f6c6-445e-8b6e-f97a2ace0770/","title":"Cascadia","type":"GAME"},"CausesSupported:{\"uuid\":\"6a22dc9e-1394-44db-88e2-353a5cb1e16c\"}":{"__typename":"CausesSupported","uuid":"6a22dc9e-1394-44db-88e2-353a5cb1e16c","name":"ASPCA","description":"\u003cp\u003eI am a huge animal lover and this organization does such great work for animals!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/eb120827-4889-4f0b-82f3-a910fcb7488d/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b59e4886-ed6b-4588-ae56-3770ab0456e5\"}":{"__typename":"DeepDives","uuid":"b59e4886-ed6b-4588-ae56-3770ab0456e5","content":"\u003cp\u003eI chose Chemical Engineering as my undergraduate major because it provides so many opportunities and application areas! Whether you are interested in energy, manufacturing, materials, medicine, data science, or even space travel, ChemE is a major that lets you pursue any of these. It's a perfect blend of math, chemistry, and physics. As a chemical engineer, you learn how to think in a way that no one else does!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor graduate school, I chose Bioengineering to focus more deeply on synthetic biology! BioE is a broad major as well, and isn't just limited to health. You can study things on a nanoscale all the way to an entire ecosystem scale. I love that the major lets you research microbes, plants, fungi, viruses, and humans, all incorporating fundamental principles of biology, chemistry, physics, and math!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1131fd49-24d6-4bc6-828c-41a7d8965fff\"}":{"__typename":"DeepDives","uuid":"1131fd49-24d6-4bc6-828c-41a7d8965fff","content":"\u003cp\u003eBe curious! The world is your oyster. There are so many opportunities out there, and you'll never know what you like (and don't like) if you don't try things! If an exciting opportunity presents itself to you, go for it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3f580eb0-4cf0-482b-8c17-cc110316a1de\"}":{"__typename":"DeepDives","uuid":"3f580eb0-4cf0-482b-8c17-cc110316a1de","content":"\u003cp\u003eI've had some amazing mentors throughout my years of school, and I hope to give back by being a mentor too! I think it is so important to see other people like you in various roles that you aspire to reach. Especially as a woman in STEM, I know what it's like to be in a class where you feel alone and isolated. I want to teach and mentor young people in STEM in an accessible way, so everyone feels like they belong in these incredible fields.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"eb523364-dc7c-4647-bca5-d8a783b2a6f4\"}":{"__typename":"DeepDives","uuid":"eb523364-dc7c-4647-bca5-d8a783b2a6f4","content":"\u003cp\u003eI'm super proud to have finished my undergraduate degree in ChemE, and now to be pursuing a PhD at Stanford! The journey has been winding and quite challenging, but I've learned so much along the way and have met incredible people. I'm proud to say I'm an engineer, because I get to work on problems that will change the world!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"06ffadbf-5818-4d87-b798-6124ce649de8\"}":{"__typename":"School","uuid":"06ffadbf-5818-4d87-b798-6124ce649de8","name":"Jesuit High School","city":"Portland","type":"HIGH","state":"Oregon","country":"United States","zip":"97225"},"Education:{\"uuid\":\"a97ba5d0-4fb2-42aa-8a5d-1a6ec9b2a75b\"}":{"__typename":"Education","uuid":"a97ba5d0-4fb2-42aa-8a5d-1a6ec9b2a75b","school":{"__ref":"School:{\"uuid\":\"06ffadbf-5818-4d87-b798-6124ce649de8\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2a02358a-dc1b-4555-a7a9-d087e5dbc17d\"}":{"__typename":"School","uuid":"2a02358a-dc1b-4555-a7a9-d087e5dbc17d","name":"University of Washington","city":"Seattle","type":"COLLEGE","state":"Washington","country":"United States","zip":"98195"},"Education:{\"uuid\":\"f2fb034f-5272-45f8-807b-1bf4422b3abd\"}":{"__typename":"Education","uuid":"f2fb034f-5272-45f8-807b-1bf4422b3abd","school":{"__ref":"School:{\"uuid\":\"2a02358a-dc1b-4555-a7a9-d087e5dbc17d\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"1f3efc62-c167-4c5b-b3c1-38ded454b654\"}":{"__typename":"MentorPublicProfile","uuid":"1f3efc62-c167-4c5b-b3c1-38ded454b654","displayName":"Stella A.","slug":"stella-anastasakis","biography":"\u003cp\u003eHello, my name is Stella! I'm a first-year PhD student in Bioengineering at Stanford University. I recently graduated from the University of Washington with a B.S. in Chemical Engineering, where I developed a strong foundation in problem-solving and experimental design. My academic journey has been driven by a deep curiosity about how we can merge engineering and biology to solve real-world problems, particularly those in human health and sustainability. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm passionate about making science feel approachable, engaging, and exciting. Throughout my undergraduate studies and now in graduate school, I've been deeply interested in synthetic biology, particularly its applications in sustainability, medicine, and biotechnology innovation. This field has major potential to create meaningful impact, and I enjoy exploring how complex biological systems can be engineered for novel purposes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I spend much of my time pursuing research, which has strengthened my technical skills and my ability to think creatively. As a result, chemistry, biology, math, and coding have been some of my favorite subjects to study and teach! I've held numerous tutoring and mentorship roles over the years. I've tutored ages 6-16 in various STEM courses, both in-person and virtually. During these tutoring sessions, I strive to engage my students and empower them to think critically. I also emphasize developing strong study skills to set my students up for success. During my undergraduate years, I also served as an engineering ambassador and outreach director, where I helped design hands-on activities and programs that introduced students to the world of STEM in a fun, accessible way! As someone who has navigated challenging STEM coursework, I especially enjoy mentoring students through technical material and the learning process itself. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the lab and the classroom, I love spending time outdoors and staying active! In the spring and summer, you'll often find me hiking, biking, or running. I also love to cook and bake, as well as play piano and guitar. I think having creative outlets alongside academic work is essential to success!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm excited to support you on your journey, whether that means helping you tackle challenging coursework, providing mentorship as you apply for college, or simply guiding you through a passion project of your own! \u003c/p\u003e","teachingVideoPlaybackId":"GZnEUqq1zwoBUUrmCVLA6k3VoR5jGrg93ue01ImvwC3M","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI'm proud of my research experience and the contributions I've made to my field. I've presented at multiple conferences and am an author on two research papers currently, with more to come in graduate school!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"9f554d5b-88a5-4cef-81fd-c49d6ca98ef0\"}"},{"__ref":"Favorites:{\"uuid\":\"35e778a4-1bd7-489e-bae4-20c88b06d8c4\"}"},{"__ref":"Favorites:{\"uuid\":\"d8d154ac-8217-47dd-9aa6-0671f7c4f422\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"6a22dc9e-1394-44db-88e2-353a5cb1e16c\"}"}],"major":"Chemical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b59e4886-ed6b-4588-ae56-3770ab0456e5\"}"},{"__ref":"DeepDives:{\"uuid\":\"1131fd49-24d6-4bc6-828c-41a7d8965fff\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f580eb0-4cf0-482b-8c17-cc110316a1de\"}"},{"__ref":
