xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c5c20b5f-8820-4962-8676-2cef3bb93d2a\"}":{"__typename":"Favorites","uuid":"c5c20b5f-8820-4962-8676-2cef3bb93d2a","photoUrl":"https://ucarecdn.com/47c09676-424f-4d42-9038-6a19996a61b6/","title":"Rumours by Fleetwood Mac","type":"ALBUM"},"Favorites:{\"uuid\":\"ad2cc5b2-9f84-4efe-91e1-e9242fb8fb2f\"}":{"__typename":"Favorites","uuid":"ad2cc5b2-9f84-4efe-91e1-e9242fb8fb2f","photoUrl":"https://ucarecdn.com/139e1709-d5e6-42b8-b9f1-1b6358b71349/","title":"Katie Ledecky (Fun fact: she went to my high school!)","type":"ATHLETE"},"Favorites:{\"uuid\":\"1f9c6500-0b6f-4425-a5f5-c1fec9717291\"}":{"__typename":"Favorites","uuid":"1f9c6500-0b6f-4425-a5f5-c1fec9717291","photoUrl":"https://ucarecdn.com/e4c6903e-3b5f-40ff-8c8e-2be85ffadf4b/","title":"Taylor Swift (I've been to the Eras Tour twice!)","type":"ARTIST"},"CausesSupported:{\"uuid\":\"ba2c7775-b027-4f52-8bf7-73efa6995403\"}":{"__typename":"CausesSupported","uuid":"ba2c7775-b027-4f52-8bf7-73efa6995403","name":"So Others Might Eat","description":"\u003cp\u003eSOME is a charity near to my heart, and I love running its annual Turkey Trot!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/6b0da283-673d-463d-90cd-7c75f8580e12/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"84db4f38-0779-49ab-b354-a87c22e96304\"}":{"__typename":"DeepDives","uuid":"84db4f38-0779-49ab-b354-a87c22e96304","content":"\u003cp\u003eI've always been drawn to journalism and the power of storytelling in making a difference in the lives of others. When I got into Northwestern's prestigious Medill School of Journalism, I knew I couldn't pass up the opportunity! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"37266a78-9090-4dcb-9692-8b15205783af\"}":{"__typename":"DeepDives","uuid":"37266a78-9090-4dcb-9692-8b15205783af","content":"\u003cp\u003eSummer swim league was everything to me as a high schooler in the summer! I always felt at home at our local community pool, cheering my heart out during weekend meets and helping younger swimmers develop a love for the water just like I had. I also worked at a local smoothie shop for 3 summers in high school, where I gained invaluable experience with customer service and fine-tuned my blender skills (which come in handy today!). \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"76e072e9-db19-4b3d-b47a-99c777e2f4aa\"}":{"__typename":"DeepDives","uuid":"76e072e9-db19-4b3d-b47a-99c777e2f4aa","content":"\u003cp\u003eCherish your friendships! I'm still close with many of my middle and high school friends, who knew me during a transformative time in life and have been my side ever since. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"3aac0277-85f0-46b2-9a7f-5485acf06067\"}":{"__typename":"DeepDives","uuid":"3aac0277-85f0-46b2-9a7f-5485acf06067","content":"\u003cp\u003eMy mom is my greatest role model! She was the most involved parent when I was growing up, never failing to attend our soccer games or make school pickup, while maintaining an intensive career as a consultant. As one of the only female partners at her firm, my mom inspires me to live and lead boldly. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"93e8e6d0-0219-48a2-9fc4-7f0ce667b291\"}":{"__typename":"School","uuid":"93e8e6d0-0219-48a2-9fc4-7f0ce667b291","name":"Stone Ridge School of the Sacred Heart","city":"Bethesda","type":"HIGH","state":"Maryland","country":"United States","zip":"20814"},"Education:{\"uuid\":\"4535edc4-a174-4417-bb35-4647d1914a01\"}":{"__typename":"Education","uuid":"4535edc4-a174-4417-bb35-4647d1914a01","school":{"__ref":"School:{\"uuid\":\"93e8e6d0-0219-48a2-9fc4-7f0ce667b291\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"df36287e-9569-4bee-ad87-82740efbc634\"}":{"__typename":"Education","uuid":"df36287e-9569-4bee-ad87-82740efbc634","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Journalism","degree":null},"MentorPublicProfile:{\"uuid\":\"77024ad8-5726-44ad-9697-d9187ff51c6c\"}":{"__typename":"MentorPublicProfile","uuid":"77024ad8-5726-44ad-9697-d9187ff51c6c","displayName":"Kate W.","slug":"kate-walter","biography":"\u003cp\u003eHello! My name is Kate Walter and I’m a master’s student at Northwestern University’s Medill School of Journalism with a specialization in Media Management and Leadership and a concentration in Business Journalism. I recently completed my undergraduate education at Northwestern, where I studied journalism, political science, and Integrated Marketing Communications.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my time at Northwestern, I've been involved with our school newspaper, The Daily Northwestern, club swim as a practice coordinator, the Center for Civic Engagement, and Northwestern Career Advancement. I also love to run, help coach swim practices, travel, explore new restaurants in Chicago, and max out my card at the Evanston Library.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a native of the Washington, D.C. area, I'm interested in politics and very passionate about the beautiful Cherry Blossoms :) I've spent my summers in college interning for my congresswoman in the U.S. House of Representatives and at ABC and CBS News. I also babysat and coached swim lessons at our local pool for many years!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOver my time at Northwestern, I've developed a passion for mentoring and forming meaningful connections to help guide others, whether that's through babysitting or serving as a Career Ambassador at Northwestern Career Advancement. I can't wait to continue this purposeful work as a Curious Cardinals mentor.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentors in my own life, from swim coaches to professors at Northwestern, have helped me realize my self-confidence and grow both personally and professionally. I'd love to give back and have a similar impact on my mentees.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"02qEQyFOjydE22rPRlXdBydnKuKaCPqrNQZqPPRjrS2w","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing named my high school's salutatorian is one of my greatest achievements so far! I was incredibly nervous to give a speech at graduation and practiced for hours in front of my dog, but standing on the stage and speaking to my peers reminded me of all the hard work that led to that moment.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c5c20b5f-8820-4962-8676-2cef3bb93d2a\"}"},{"__ref":"Favorites:{\"uuid\":\"ad2cc5b2-9f84-4efe-91e1-e9242fb8fb2f\"}"},{"__ref":"Favorites:{\"uuid\":\"1f9c6500-0b6f-4425-a5f5-c1fec9717291\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"ba2c7775-b027-4f52-8bf7-73efa6995403\"}"}],"major":"Journalism","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"84db4f38-0779-49ab-b354-a87c22e96304\"}"},{"__ref":"DeepDives:{\"uuid\":\"37266a78-9090-4dcb-9692-8b15205783af\"}"},{"__ref":"DeepDives:{\"uuid\":\"76e072e9-db19-4b3d-b47a-99c777e2f4aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"3aac0277-85f0-46b2-9a7f-5485acf06067\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/da2532ae-7b8a-49bf-8f7e-d52c9ac09ded/-/preview/-/format/jpg/","https://ucarecdn.com/4fe3a13c-f9cd-4ed7-9a17-05a9be39e887/-/preview/-/format/jpg/","https://ucarecdn.com/444d4a1f-4246-4463-a548-2d47d05f0687/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4535edc4-a174-4417-bb35-4647d1914a01\"}"},{"__ref":"Education:{\"uuid\":\"df36287e-9569-4bee-ad87-82740efbc634\"}"}],"hiredAt":"2025-04-16T23:27:21.266Z","topics":["6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Sports Journalism","History Project","Business / Entrepreneurship","Law / Government / Policy","Journalism"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kate-walter\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"77024ad8-5726-44ad-969
