xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0d60cec2-8609-46b3-8db4-f86301f010a1\"}":{"__typename":"Favorites","uuid":"0d60cec2-8609-46b3-8db4-f86301f010a1","photoUrl":"https://ucarecdn.com/7a57f416-e60b-431e-8419-3d37a2e98c04/","title":"Frida Kahlo","type":"ARTIST"},"Favorites:{\"uuid\":\"d457c844-0a8b-4aab-aebb-00d83fc7eba0\"}":{"__typename":"Favorites","uuid":"d457c844-0a8b-4aab-aebb-00d83fc7eba0","photoUrl":"https://ucarecdn.com/74c0c861-0193-4a78-8c03-f855d1fec45d/","title":"Their Eyes Were Watching God","type":"BOOK"},"Favorites:{\"uuid\":\"edebcce2-0994-4dbe-8f01-eaa3e7751e7a\"}":{"__typename":"Favorites","uuid":"edebcce2-0994-4dbe-8f01-eaa3e7751e7a","photoUrl":"https://ucarecdn.com/f305a7b8-ddfb-4b4e-a5ff-85dfcd1d0db7/","title":"\"Because,\" The Beatles","type":"SONG"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0db5d7e3-b2c2-4e1c-96d7-4edc7b07949e\"}":{"__typename":"DeepDives","uuid":"0db5d7e3-b2c2-4e1c-96d7-4edc7b07949e","content":"\u003cp\u003eI absolutely love to cook. For two years at Stanford, I lived in a co-operatively-run home where students cooked and cleaned for themselves. There, I worked in teams of four to direct and execute meals for 50+ students! Asking me about my time there-- or anything having to do with food-- is the easiest way to get me excited.\u003cbr\u003e\u003cbr\u003eI also love to read nonfiction, crochet and embroider, and write a lot about random history topics! Ask me about the history of L.A., Mexican food, and fashion!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"e5422d50-cfd9-411f-934c-b90123506aa2\"}":{"__typename":"DeepDives","uuid":"e5422d50-cfd9-411f-934c-b90123506aa2","content":"\u003cp\u003eIn high school, I started a youth blog called YouthCake. Dedicated to empowering the stories of underrepresented youth in South Los Angeles, the website featured stories from student contributors on fashion, film, politics, music, and more! My favorite features involved profiles on local fashion icons, updates on local grassroots organizing, and an opinion piece on the Met Gala!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"58072757-05c5-4541-ae47-b7dcc863f3af\"}":{"__typename":"DeepDives","uuid":"58072757-05c5-4541-ae47-b7dcc863f3af","content":"\u003cp\u003eIt began when someone in middle school noticed my (almost compulsive) need to Wikipedia \u003cem\u003eevery \u003c/em\u003etopic that seemed even mildly interesting to me. A landmark, C-list celebrity, favorite dish. There, I recognized there was something inside me that always sought context: how did this come to be the way I am now witnessing it? Perhaps it was personal, my own story automatically spanning generations and countries. I realized that History was the perfect home for this drive, a combination of curious energy with the in-depth reading, writing, and analyzing I had a talent in.\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"182df4f3-cb12-438d-a5e8-7efdfec21140\"}":{"__typename":"DeepDives","uuid":"182df4f3-cb12-438d-a5e8-7efdfec21140","content":"\u003cp\u003eI believe that inter-generational relationships are uniquely generative.\u003cbr\u003e\u003cbr\u003eBeing the oldest sister of four, I have both expertise in and love for what makes this youngest generation tick. As our world is on the precipice of monumental changes, cultivating intellectual and personal rapport with young thinkers is not only special but vital. My goal in mentorship is to center the imaginations of my mentee, guiding its path using my experience and knowledge. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"3d5ab3f4-37fb-4d1e-a16e-c1f95a326237\"}":{"__typename":"School","uuid":"3d5ab3f4-37fb-4d1e-a16e-c1f95a326237","name":"Harbor Teacher Preparation Academy","city":"Wilmington","type":"HIGH","state":"CA","country":"United States","zip":"90744"},"Education:{\"uuid\":\"09db5caf-9ce6-46bc-b392-df432c7f688f\"}":{"__typename":"Education","uuid":"09db5caf-9ce6-46bc-b392-df432c7f688f","school":{"__ref":"School:{\"uuid\":\"3d5ab3f4-37fb-4d1e-a16e-c1f95a326237\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"62173290-1903-4020-9333-08d8efb45e5f\"}":{"__typename":"Education","uuid":"62173290-1903-4020-9333-08d8efb45e5f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"History (Honors), Art Practice","degree":null},"MentorPublicProfile:{\"uuid\":\"83df0087-19ce-4f0f-96f0-92b056976631\"}":{"__typename":"MentorPublicProfile","uuid":"83df0087-19ce-4f0f-96f0-92b056976631","displayName":"Stephanie C.","slug":"stephanie-castaneda","biography":"\u003cp\u003eHi! I'm Stephanie, a recent graduate with a B.A. in History (Honors) and a minor in Art Practice! Born, raised, and now based in Los Angeles, my background as a Mexican-American informs much of what I do: my History research focuses on immigrant communities in California, and my art mediums are inspired by the crochet and embroidery traditions of my family. \u003c/p\u003e\u003cp\u003e\u003cbr\u003eIn high school, I was involved in a myriad of activities grounded in the intersections of History and Art. I co-led Harbor Political Action Committee, focusing on issues such as anti-Black discrimination and dress codes at my high school. I also served as the second-ever captain of my school's policy debate team, helping to cultivate a legacy that now includes several national titles. After school, I worked at the Museum of Contemporary Art in Los Angeles and helped develop Teen Night, an art and live music extravaganza catered to the students of Los Angeles. I also founded and ran a youth blog, YouthCake, for students in South Los Angeles to tell their own stories on politics, art, film, music, and more. I received acceptances to colleges including Stanford, Columbia, Brown, U.C. Berkeley, UCLA, and USC.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAt Stanford, I worked for two years at El Centro Chicano y Latino as a Social Media Specialist and later Archivist in collaboration with Green Library. There, I processed archival material of Chicano life on campus spanning 50 years, making it available for scholars to use for research. I was also involved in theater, as a Graphic Designer and Makeup Artist for productions including Heathers, Gaeities (a Stanford tradition), and original student production Mary Magdalene, Daughter, Boatperson for Stanford's Asian-American Theater Troupe. During the summers, I held internships as a Research Assistant at the Center for Spatial and Textual Analysis and as a Fellow at Equality California, an LGBTQ+ rights nonprofit. \u003c/p\u003e\u003cp\u003e\u003cbr\u003eAs the oldest of four, teaching students is an intuitive skill-- so many of my skills and values were internalized silently, lessons learned from being an older sister. I have experience in individual mentorships particularly in \u003cstrong\u003eEthnic Studies, Art History, and Writing (Essay and Creative)\u003c/strong\u003e, helping young learners \u003cstrong\u003efind their voice and hone their interests\u003c/strong\u003e. I have also managed classrooms of students ages 7-15 at the Palo Art Center, assistant teaching Collage and Printmaking in addition to running gallery tours. I currently have my California credential in Substitute Teaching. \u003c/p\u003e","teachingVideoPlaybackId":"F2wzyXbCCEWCn2W36QqU01sCEupIMRb6sD5NK5DhQ02Zg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn my last year at Stanford, I completed an 80-page history thesis on Mexico! It was so special to research and write \u003cbr\u003eabout my ancestral home. The thesis ended up winning the Robert M. Golden Medal for Excellence in the Humanities and Creative Arts, an achievement I will never forget.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0d60cec2-8609-46b3-8db4-f86301f010a1\"}"},{"__ref":"Favorites:{\"uuid\":\"d457c844-0a8b-4aab-aebb-00d83fc7eba0\"}"},{"__ref":"Favorites:{\"uuid\":\"edebcce2-0994-4dbe-8f01-eaa3e7751e7a\"}"}],"causesSupported":[],"major":"History (Honors), Art Practice","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0db5d7e3-b2c2-4e1c-96d7-4edc7b07949e\"}"},{"__ref":"DeepDives:{\"uuid\":\"e5422d50-cfd9-411f-934c-b90123506aa2\"}"},{"__ref":"DeepDives:{\"uuid\":\"58072757-05c5-4541-ae47-b7dcc863f3af\"}"},{"__ref":"DeepDives:{\"uuid\":\"182df4f3-cb12-438d-a5e8-7efdfec21140\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/af8972ae-ba66-47ce-85e4-c83286c0b985/-/preview/-/format/jpg/","https://ucarecdn.com/59e88fd0-cd7b-4fe7-a0dd-9c5d7a9ecfc5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"09db5caf-9ce6-46bc-b392-df432c7f688f\"}"},{"__ref":"Education:{\"uuid\":\"62173290-1903-4020-9333-08d8efb45e5f\"}"}],"hiredAt":"2023-08-03T21:07:40.250Z","topics":["History Project","Visual Arts / Graphic Design","Literature","Fashion / Cosmetics","Cooking","World Cultures","Women \u0026 Gender Studies","Race \u0026 Ethnicity","Writing"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"stephanie-castaneda\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"83df0087-19ce-4f0f-96f0-92b056976631\"}"}}},"_sentryTraceData":"466204b6c42a47d68156bbfa707a2295-bcbc35f95196d34a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=466204b6c42a47d68156bbfa707a2295,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"stephanie-castaneda"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https:
