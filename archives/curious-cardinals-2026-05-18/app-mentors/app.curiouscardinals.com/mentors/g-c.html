xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cd70c289-a4f1-482b-ab71-00b172ace7dd\"}":{"__typename":"Favorites","uuid":"cd70c289-a4f1-482b-ab71-00b172ace7dd","photoUrl":"https://ucarecdn.com/af20df67-f65d-43fa-8033-0b2e082609b2/","title":"Lake Bled, Slovenia","type":"CITY"},"Favorites:{\"uuid\":\"b28daec6-6de5-4384-a8da-b5dc6e06d813\"}":{"__typename":"Favorites","uuid":"b28daec6-6de5-4384-a8da-b5dc6e06d813","photoUrl":"https://ucarecdn.com/83b14b8c-67bc-4a0b-8323-24170936020f/","title":"The Lorax","type":"MOVIE"},"Favorites:{\"uuid\":\"f4942645-19bb-4c7c-a4d5-e52b06a0e73b\"}":{"__typename":"Favorites","uuid":"f4942645-19bb-4c7c-a4d5-e52b06a0e73b","photoUrl":"https://ucarecdn.com/6ebfabd6-6c1b-4e05-84b9-1d4c1ea9c21b/","title":"Basketball","type":"SPORT"},"CausesSupported:{\"uuid\":\"80446b2a-cbca-42c1-a8ab-4af1efd3665a\"}":{"__typename":"CausesSupported","uuid":"80446b2a-cbca-42c1-a8ab-4af1efd3665a","name":"International Rescue Committee","description":"\u003cp\u003eI was a Refugee Resettlement Intern for the IRC!\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c8057f73-928c-49d8-8a4c-76f724e8f599\"}":{"__typename":"DeepDives","uuid":"c8057f73-928c-49d8-8a4c-76f724e8f599","content":"\u003cp\u003eI got to work on a project mapping the projected range shift of the Boreal Forest biome using QGIS and climate models published by the International Panel on Climate Change (IPCC)! Seeing the project come together and starting to understand some of the ecological implications of climate change was super interesting, and helped me to understand how much work there is to be done to mitigate climate risk and adapt to changing environments and conditions!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a275ef05-f75c-48bd-97c1-ee4c1982a767\"}":{"__typename":"DeepDives","uuid":"a275ef05-f75c-48bd-97c1-ee4c1982a767","content":"\u003cp\u003eI would tell my middle or high school self to not be afraid to put myself out there! I grew up very shy and easily embarrassed, and it wasn't until I began college that I started to understand that other people never really care that much about what you are doing. Putting yourself out there and being confident in who you are is the best thing you can do for yourself, and for others!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c052a8d0-0203-4bd0-bcd5-d142b7f83a92\"}":{"__typename":"DeepDives","uuid":"c052a8d0-0203-4bd0-bcd5-d142b7f83a92","content":"\u003cp\u003eWhen you study something as multidisciplinary as International Relations, you start realize that everything is connected in some way, but as I was doing research and learning about topics from security, to migration, to development, I realized that every single facet of international relations was connected to the environment, yet few people were focused on this intersection. I became fascinated with the impact of climate and environment, especially on security, and wanted to expand my knowledge in both the science and policy spaces so that I could effectively communicate between the two in order to tackle some of these huge cross-cutting problems!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"671ad5a8-f6db-4803-ab9a-2852d78e960a\"}":{"__typename":"DeepDives","uuid":"671ad5a8-f6db-4803-ab9a-2852d78e960a","content":"\u003cp\u003eI believe that mentors shape so much of your life, be that personal, academic, or professional. When we reflect on ourselves, especially the best parts of ourselves, often, you can pick out traits that are similar to those who mentored you! For example, my discipline comes from my swim coach in middle school, my generosity is a product of my mom and my bus driver in high school, who both always elevated the needs of others above their own, and my ambition was instilled by my A.P. Euro teacher in high school. These people all have a part in creating me, and I hope to share the best of my personality and character with others!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"10ee3945-ad8f-4fc0-b5ca-bcecb4416e3f\"}":{"__typename":"School","uuid":"10ee3945-ad8f-4fc0-b5ca-bcecb4416e3f","name":"Malibu High School","city":"Malibu","type":"HIGH","state":"California","country":"United States","zip":"90265"},"Education:{\"uuid\":\"0dee6659-f812-4911-bc9c-cf91153dde42\"}":{"__typename":"Education","uuid":"0dee6659-f812-4911-bc9c-cf91153dde42","school":{"__ref":"School:{\"uuid\":\"10ee3945-ad8f-4fc0-b5ca-bcecb4416e3f\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"677916dd-9ea8-41d8-8aae-2208a4fe869b\"}":{"__typename":"Education","uuid":"677916dd-9ea8-41d8-8aae-2208a4fe869b","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2026","major":"Environment \u0026 International Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"0b921de8-144f-4528-87c9-912bcea691b8\"}":{"__typename":"MentorPublicProfile","uuid":"0b921de8-144f-4528-87c9-912bcea691b8","displayName":"Grace C.","slug":"g-c","biography":"\u003cp\u003eHi! My name is Grace, and I am currently an M.S. Candidate at Georgetown University studying Environment and International Affairs. My undergrad background in International Relations and French, with a minor in Art History. I have professional experience working in the NGO and International Development sector, especially working with refugees through organizations like the International Rescue Committee and the Jesuit Refugee Service.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe that learning is a life-long journey, and am committed to helping students pursue their curiosity at any age. I worked as a Climate Literacy Fellow, teaching K-8 students science lessons about climate and the environment, worked as a TA for undergraduate first-year seminars, and tutored all levels of French. I also have experience working with data visualization software like QGIS and R to help students take projects to the next level. \u003cstrong\u003eI hope to motivate students of all levels to explore their interests, expand their perspectives, and to think about actionable, interdisciplinary solutions to tackle big problems, especially related to climate change, the environment, or international affairs.\u0026nbsp;\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up, I was very shy and struggled in public speaking and presentations. In high school, I joined Model UN, where I was forced to confront my anxiety around public speaking and learn how to interface with others in a professional and diplomatic way. Now, presenting and public speaking are some of my favorite ways to communicate. I would be happy to work with students that also face similar fears, helping them to become more effective communicators.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond school and work, I am a lover of the outdoors, especially the beach! I grew up in Malibu, CA, and my favorite pastimes at home all involve the ocean. I also enjoy winter sports, and took up snowboarding three seasons ago, though I haven’t been able to hit the slopes as much as I would like. When I can’t go to the beach or the mountains, I enjoy doing watercolors, watching college basketball, and doing yoga!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I hope to aid students in turning curiosity into complex understanding, and to create projects that provide holistic opportunities for growth, skill-building, and learning.\u0026nbsp;I am so excited to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"FE2Hch8i3X702LvACZArQsmL8P01Z3tetpd9021MiFFiQc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement is living and working in the Kakuma Refugee Camp in Kenya for seven months! It was a massive change and very challenging at times, but it has had a massive impact on how I view the world, and my own resilience.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"cd70c289-a4f1-482b-ab71-00b172ace7dd\"}"},{"__ref":"Favorites:{\"uuid\":\"b28daec6-6de5-4384-a8da-b5dc6e06d813\"}"},{"__ref":"Favorites:{\"uuid\":\"f4942645-19bb-4c7c-a4d5-e52b06a0e73b\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"80446b2a-cbca-42c1-a8ab-4af1efd3665a\"}"}],"major":"Environment \u0026 International Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c8057f73-928c-49d8-8a4c-76f724e8f599\"}"},{"__ref":"DeepDives:{\"uuid\":\"a275ef05-f75c-48bd-97c1-ee4c1982a767\"}"},{"__ref":"DeepDives:{\"uuid\":\"c052a8d0-0203-4bd0-bcd5-d142b7f83a92\"}"},{"__ref":"DeepDives:{\"uuid\":\"671ad5a8-f6db-4803-ab9a-2852d78e960a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2bd96a48-7c6f-4b77-8a2d-67aecb834348/-/preview/-/format/jpg/","https://ucarecdn.com/c883f996-a3f1-4397-aa78-2871727ba9fc/-/preview/-/format/jpg/","https://ucarecdn.com/5922e0d7-9038-4d3b-9a7e-9f226771037b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0dee6659-f812-4911-bc9c-cf91153dde42\"}"},{"__ref":"Education:{\"uuid\":\"677916dd-9ea8-41d8-8aae-2208a4fe869b\"}"}],"hiredAt":"2026-01-18T05:34:59.031Z","topics":["6-8 Grade Science","Writing","French","Reading","History","Executive Function","Academic Coaching","K-6 Storybook","Creative Writing","History Project","Video / Photography","STEM Project","Sustainability","Law / Government / Policy","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/d441189b-003a-4aab-82f0-564452e913e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"g-c\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0b921de8-144f-4528-87c9-912bcea691b8\"}"}}},"_sentryTraceData":"f4cf1d0fd03c4bbca87131ef58f3ee87-b3abafdb21b4d3c9-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f4cf1d0fd03c4bbca87131ef58f3ee87,sentry-sample_rate=0.2,sentry-transaction=%2Fmentor
