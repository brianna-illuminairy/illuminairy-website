mentor can really serve as a north star during those times.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d47f1645-482c-4f45-8c64-4de1ec9fdc79\"}":{"__typename":"DeepDives","uuid":"d47f1645-482c-4f45-8c64-4de1ec9fdc79","content":"\u003cp\u003ePut yourself out there! No one is watching you as closely as you think.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}":{"__typename":"School","uuid":"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5","name":"Choate Rosemary Hall","city":"Wallingford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06492"},"Education:{\"uuid\":\"6d32398a-d669-4345-b32d-94950b044fda\"}":{"__typename":"Education","uuid":"6d32398a-d669-4345-b32d-94950b044fda","school":{"__ref":"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}":{"__typename":"School","uuid":"843cb79b-75a7-4415-89cc-0166c307ba4b","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"CT","country":"USA","zip":"06511"},"Education:{\"uuid\":\"4184780c-39bf-422a-bba7-3a7ff91ee2cf\"}":{"__typename":"Education","uuid":"4184780c-39bf-422a-bba7-3a7ff91ee2cf","school":{"__ref":"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Ethics, Politics and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"59a7da5b-9ce5-4ba5-95c3-c1590082a277\"}":{"__typename":"MentorPublicProfile","uuid":"59a7da5b-9ce5-4ba5-95c3-c1590082a277","displayName":"Aubrie W.","slug":"aubrie-williams","biography":"\u003cp\u003eAubrie is a student at Yale majoring in Ethics, Politics, and Economics. She’s especially drawn to political philosophy and economics, and loves exploring how theory meets reality—whether through a close reading of Hobbes or a discussion on how education shapes civic engagement. At Yale, she is an associate editor for \u003cem\u003eThe Politic\u003c/em\u003e, the university’s political and cultural journal, where she’s written about international affairs, education policy, and the intersection of law and social justice.\u003c/p\u003e\u003cp\u003eIn high school, Aubrie balanced her love for writing and leadership with a deep interest in education. She worked closely with local organizations, tutored younger students, and grew passionate about helping others stay organized, motivated, and confident in their learning. That same passion carries into her current role on a legal aid team, where she works with lawyers and families navigating Connecticut’s special education system—an experience that has given her insight into both education policy and the importance of strong student support systems.\u003c/p\u003e\u003cp\u003eShe’s also taught international relations to high school students in New Haven through a civic education initiative, and finds joy in creating lessons that are exciting, discussion-based, and empower students to take ownership of their learning. Executive functioning—planning, time management, and self-advocacy—is a particular interest of hers, and she loves helping students find systems that work for \u003cem\u003ethem\u003c/em\u003e.\u003c/p\u003e\u003cp\u003eAubrie is a strong believer that learning doesn’t need to feel intimidating to be meaningful. She sees mentorship as a space for creativity, confidence-building, and finding joy in new ideas. When she’s not teaching or writing, you can find her out on a run, trying new cafes or ticking off places on her New Haven bucket list with friends. She’s thrilled to be joining the Curious Cardinals community and can’t wait to support students in becoming more curious, capable, and confident.\u003c/p\u003e","teachingVideoPlaybackId":"601AoYakVIukccjZBadEpYmFfvJjTGL5xcjRbKaL8R5Y","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Ethics, Politics and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3d53403a-ac76-4c2b-909d-7bd6ab2eac3e\"}"},{"__ref":"DeepDives:{\"uuid\":\"b72a703c-8273-48ba-bf4f-e90c627e21fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"00ab3902-8770-4987-952c-68d8a6da67ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"d47f1645-482c-4f45-8c64-4de1ec9fdc79\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/52a3ac52-6333-44dd-9d40-458fea3501ea/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6d32398a-d669-4345-b32d-94950b044fda\"}"},{"__ref":"Education:{\"uuid\":\"4184780c-39bf-422a-bba7-3a7ff91ee2cf\"}"}],"hiredAt":"2025-05-06T11:29:51.533Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","K-6 Storybook","Creative Writing","Fashion / Cosmetics","History Project","Business / Entrepreneurship","Law / Government / Policy","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"aubrie-williams\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"59a7da5b-9ce5-4ba5-95c3-c1590082a277\"}"}}},"_sentryTraceData":"8ca0e58e2b6f4b509d32461efb2fec92-8080e21d911ac2ce-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8ca0e58e2b6f4b509d
