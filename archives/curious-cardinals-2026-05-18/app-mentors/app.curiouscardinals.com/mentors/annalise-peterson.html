xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a2c6f960-0a28-46c6-aa87-dd97a18c1f45\"}":{"__typename":"DeepDives","uuid":"a2c6f960-0a28-46c6-aa87-dd97a18c1f45","content":"\u003cp\u003eMentorship matters to me because it's a way to share the life lessons (and academic lessons) I've accumulated over the years. It's super gratifying to make the trickiness of middle and high school a little easier for people! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fcf93a24-2cee-4141-8d64-87f5fd64e93c\"}":{"__typename":"DeepDives","uuid":"fcf93a24-2cee-4141-8d64-87f5fd64e93c","content":"\u003cp\u003eJournalism gives me a reason to always learn through my work; every story is different, and usually I end up learning something niche that I wouldn't have thought about otherwise. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f5c0934c-0e34-4931-840d-f052f540300c\"}":{"__typename":"DeepDives","uuid":"f5c0934c-0e34-4931-840d-f052f540300c","content":"\u003cp\u003eI love hiking and backpacking. When I was studying abroad in Taiwan, I spent four days in the Taiwanese mountains, and it was one of the coolest experiences of my life. I'm always encouraging people to get outside and connect with nature more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"5e4759d4-e8d9-4a4e-a329-31b0b751147b\"}":{"__typename":"DeepDives","uuid":"5e4759d4-e8d9-4a4e-a329-31b0b751147b","content":"\u003cp\u003eSomething people don't always know about me is that I was raised by a single parent! I'm so grateful for my mom's hard work in raising my sisters and I, and her diligence has shaped how I approach the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"961a6ecb-b214-4fe6-b99b-4275b44e6bf8\"}":{"__typename":"School","uuid":"961a6ecb-b214-4fe6-b99b-4275b44e6bf8","name":"Amherst-Pelham Regional High School","city":"Amherst","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01002"},"Education:{\"uuid\":\"ee67f348-3d03-4e7c-8ecb-b64f9aaf536e\"}":{"__typename":"Education","uuid":"ee67f348-3d03-4e7c-8ecb-b64f9aaf536e","school":{"__ref":"School:{\"uuid\":\"961a6ecb-b214-4fe6-b99b-4275b44e6bf8\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"499a35a6-f245-4ae6-81eb-36b51a8318e4\"}":{"__typename":"Education","uuid":"499a35a6-f245-4ae6-81eb-36b51a8318e4","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Journalism and Legal Studies","degree":null},"Testimonial:abf5c1e7-1a03-488e-b730-598ca314c7bd":{"__typename":"Testimonial","id":"abf5c1e7-1a03-488e-b730-598ca314c7bd","text":"Annalise has been such a warm and supportive person for our daughter to spend time with. We are very thankful she has a mentor who has taken the time to get to know her, and appreciates the unique, fun person that she is. Thank you, Annalise, for your time and effort.","date":"2025-07-03 18:24:51.462+00","rating":5,"endorser":{"__typename":"Endorser","name":"Melody Westervelt","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"b471cf7b-7bf3-4074-b0a4-f641ce2679e0\"}":{"__typename":"MentorPublicProfile","uuid":"b471cf7b-7bf3-4074-b0a4-f641ce2679e0","displayName":"Annalise P.","slug":"annalise-peterson","biography":"\u003cp\u003eHi everyone! My name is Annalise, and I'm a senior at Northwestern University, originally from Western Massachusetts. I study journalism with a focus on investigative multimedia work (e.g. podcasts, documentaries). My training includes feature writing, photography, audio editing and video production. I've worked with Foreign Policy Magazine's podcast branch, and more recently interned with an investigative documentary team.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy love of journalism started back in high school, when I launched an original column for my local newspaper focused on area youth. I think you're never too young to pursue ambitious projects, and would love to help others do the same.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBesides media work, I have an adjunct major in legal studies and am passionate about criminal justice reform. I work closely with the Northwestern Prison Education Program, which brings education resources to incarcerated communities in Illinois. I also study and speak Mandarin Chinese!\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not working, I love being outside hiking and backpacking, and am always pushing women to become more confident in the outdoors. I was also a varsity cross country runner in high school, and more recently have taken up rock climbing. So excited to meet and work with you!\u003c/p\u003e","teachingVideoPlaybackId":"9t5642FImSw3E98V7s00gDskKbc5L1q6cq8RuO021eZaw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Journalism and Legal Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a2c6f960-0a28-46c6-aa87-dd97a18c1f45\"}"},{"__ref":"DeepDives:{\"uuid\":\"fcf93a24-2cee-4141-8d64-87f5fd64e93c\"}"},{"__ref":"DeepDives:{\"uuid\":\"f5c0934c-0e34-4931-840d-f052f540300c\"}"},{"__ref":"DeepDives:{\"uuid\":\"5e4759d4-e8d9-4a4e-a329-31b0b751147b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e1e18e74-ffa1-4cb0-afa6-30cef634e1f3/-/preview/-/format/jpg/","https://ucarecdn.com/172a4309-19a0-4606-93e4-855e962e038f/-/preview/-/format/jpg/","https://ucarecdn.com/6565e108-236a-49bc-b14d-be345a3f2dc8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ee67f348-3d03-4e7c-8ecb-b64f9aaf536e\"}"},{"__ref":"Education:{\"uuid\":\"499a35a6-f245-4ae6-81eb-36b51a8318e4\"}"}],"hiredAt":"2024-08-29T19:04:45.939Z","topics":["Journalism","Public Speaking","Video / Photography","Creative Writing","Writing","History Project"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:abf5c1e7-1a03-488e-b730-598ca314c7bd"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"annalise-peterson\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b471cf7b-7bf3-4074-b0a4-f641ce2679e0\"}"}}},"_sentryTraceData":"eee8195a0bfe4ca4aedd175c564bb778-a232cda10
