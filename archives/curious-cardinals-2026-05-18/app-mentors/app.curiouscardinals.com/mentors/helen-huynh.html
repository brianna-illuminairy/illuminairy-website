xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d4ee10bc-53d2-4ae9-92c2-7d8a551055ca\"}":{"__typename":"Favorites","uuid":"d4ee10bc-53d2-4ae9-92c2-7d8a551055ca","photoUrl":"https://ucarecdn.com/40c22e1b-4855-445f-b115-7d154786e4cb/","title":"The Brothers Karamazov","type":"BOOK"},"Favorites:{\"uuid\":\"afc50f92-b3e7-4b30-9bba-9c97c81bf064\"}":{"__typename":"Favorites","uuid":"afc50f92-b3e7-4b30-9bba-9c97c81bf064","photoUrl":"https://ucarecdn.com/ebb7793d-336f-492a-80ee-c9e75fdad329/","title":"Ben Tre, Vietnam","type":"CITY"},"Favorites:{\"uuid\":\"3d75a550-20a4-41a7-8713-b654236c7db7\"}":{"__typename":"Favorites","uuid":"3d75a550-20a4-41a7-8713-b654236c7db7","photoUrl":"https://ucarecdn.com/50d7c617-e9f1-4a33-9206-13cc353fd43a/","title":"G Houston's In Aeternum Vive","type":"SONG"},"CausesSupported:{\"uuid\":\"5ec34527-af7d-4060-884c-2b9565dffffa\"}":{"__typename":"CausesSupported","uuid":"5ec34527-af7d-4060-884c-2b9565dffffa","name":"National Alliance for Mental Illness in New Hampshire","description":"\u003cp\u003eI created my own clothing brand and raised $1,500 to NAMI New Hampshire!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/678d54e3-a383-4ee7-b28f-73906d01cd87/"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"3437f741-75ba-4607-b8c9-f28c8bc4f259\"}":{"__typename":"DeepDives","uuid":"3437f741-75ba-4607-b8c9-f28c8bc4f259","content":"\u003cp\u003eDuring my sophomore year of high school, I participated in a similar education program and designed my own passion project. My project revolved around textiles and merchandise, learning how to sew a garment from scratch and screen-print.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese 8-weeks truly changed my self-perception. I felt limitless. From there, I pursued my interests deeply and authentically. I think this is the key to fulfillment and success.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI hope I can give this experience to someone else as a mentor--like the previous mentors before me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"5a17cb8c-841a-432b-854d-d04e761e0881\"}":{"__typename":"DeepDives","uuid":"5a17cb8c-841a-432b-854d-d04e761e0881","content":"\u003cp\u003eThere is nothing that motivates me more than hearing someone talk about what they love doing.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my first year in college, I interned at an arts non-profit and cultural hotspot NXTHVN with a resident fellow and sculpture-artist Anindita Dutta. She is the most passionate person I've ever met, and it was a blessing to witness her work. I got to help out with a few projects as her studio assistant. Her work was featured in The New York Times and exhibited at one of the most prolific galleries in NYC.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLike those around me, I am motivated to find my own calling in life--slowly and authentically.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e0e84c3b-2eb0-49a9-a6f0-d35779737af1\"}":{"__typename":"DeepDives","uuid":"e0e84c3b-2eb0-49a9-a6f0-d35779737af1","content":"\u003cp\u003eI take the train to NYC. I run into a few friends, and stay for the weekend. Sometimes, I'll attend lectures or speaker events. A few months ago, I received a signed copy of The Fraud by Zadie Smith. Other times, I found some indie musician to support.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf I'm homesick, I'll spend the day shopping in Boston. Maybe, I'll sit in the public library for a while. Phone up a few friends nearby and laugh for a while.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI don't have much spare time, but when I do I try to be engaged and present. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"7b897668-83d7-44aa-9259-05f2af83418b\"}":{"__typename":"School","uuid":"7b897668-83d7-44aa-9259-05f2af83418b","name":"Central High School","city":"Manchester","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03104"},"Education:{\"uuid\":\"05f88443-fe9c-435e-aca8-5807e89b94f9\"}":{"__typename":"Education","uuid":"05f88443-fe9c-435e-aca8-5807e89b94f9","school":{"__ref":"School:{\"uuid\":\"7b897668-83d7-44aa-9259-05f2af83418b\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"c9591080-ed09-40e8-9848-927102730d00\"}":{"__typename":"Education","uuid":"c9591080-ed09-40e8-9848-927102730d00","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Sociology, Statistics","degree":null},"MentorPublicProfile:{\"uuid\":\"91574291-0604-40eb-92f8-4577a2157774\"}":{"__typename":"MentorPublicProfile","uuid":"91574291-0604-40eb-92f8-4577a2157774","displayName":"helen h.","slug":"helen-huynh","biography":"\u003cp\u003eHelen is a sophomore at Yale University majoring in Sociology. She is a first-generation college student from Manchester, New Hampshire. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eHer background motivated her educational pursuits. Helen was selected as a Reinvention Fellow for the nation's largest education non-profit, Teach For America, and worked in the Reinvention Lab for two years conducting research interviews and promoting youth-adult co-creation in classrooms. She helped distribute $40,000 in grants schools and individual organizations innovating education. Helen continued her education non-profit interests at GripTape as a mentor and state ambassador. Now, she provides marketing and brand strategy for literacy start-up Storyshares, which was featured in Forbes 30 under 30 Education. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, Helen is an artist and reader. She writes for several student-led publications such as The Yale Daily News and DOWN Magazine, and founded the largest undergraduate art collective on campus. Helen is an oil painter, but enjoys the iterative process of research-led digital design. Currently, she is reading a collection of essays by Jean-Paul Sartre and Herman Melville's Moby Dick. Russian literature, however, remains her favorite genre.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHelen is interested in the world we live in. Whether through coding data visualizations or analyzing literature, she's interested in discovering parts of a truth.\u003c/p\u003e","teachingVideoPlaybackId":"ruHzer00YySIlKhOpkyI02Lgw4tRrijQmLUpdC9400l4Vs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am the daughter of two Vietnamese refugees. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am extremely independent and disciplined, but lead my life with empathy. I think my dedication to people is what makes my parents most proud of me. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd, I share an equal pride for my family. I am eternally grateful for them. I want this to be my greatest achievement in life. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d4ee10bc-53d2-4ae9-92c2-7d8a551055ca\"}"},{"__ref":"Favorites:{\"uuid\":\"afc50f92-b3e7-4b30-9bba-9c97c81bf064\"}"},{"__ref":"Favorites:{\"uuid\":\"3d75a550-20a4-41a7-8713-b654236c7db7\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5ec34527-af7d-4060-884c-2b9565dffffa\"}"}],"major":"Sociology, Statistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3437f741-75ba-4607-b8c9-f28c8bc4f259\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a17cb8c-841a-432b-854d-d04e761e0881\"}"},{"__ref":"DeepDives:{\"uuid\":\"e0e84c3b-2eb0-49a9-a6f0-d35779737af1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5c359a73-7cf6-41dc-9ee9-28400b1d5949/-/preview/-/format/jpg/","https://ucarecdn.com/820f8c31-1dc9-4199-afaa-c4c153bbe493/-/preview/-/format/jpg/","https://ucarecdn.com/2a83384b-b809-4c73-8221-9127b54e2a26/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"05f88443-fe9c-435e-aca8-5807e89b94f9\"}"},{"__ref":"Education:{\"uuid\":\"c9591080-ed09-40e8-9848-927102730d00\"}"}],"hiredAt":"2024-03-19T07:45:51.182Z","topics":["Visual Arts / Graphic Design","History Project","Business / Entrepreneurship","Literature","Creative Writing","History","Reading","Writing"],"communityBadges":["https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"helen-huynh\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"91574291-0604-40eb-92f8-4577a2157774\"}"}}},"_sentryTraceData":"442392cf56f341eba64e58e9284cff45-a50b11b1bbcaa388-0","_sentryBaggag
