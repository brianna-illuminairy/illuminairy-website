xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7663d4ea-b6b4-4e68-9145-180456eb3eae\"}":{"__typename":"DeepDives","uuid":"7663d4ea-b6b4-4e68-9145-180456eb3eae","content":"\u003cp\u003eIf I could give advice to my middle or high school self, it would first be to stay actively curious and to not be afraid to ask questions. Some of the most valuable opportunities I have had came from simply reaching out to people to show interest in something they had done, and being willing to learn from those with more experience than me. There are so many paths you can take, none of them have to be figured out in middle or high school. Trying new activities and challenges is one of the best ways to discover what you enjoy and what you’re good at.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would also remind myself that hard work really does pay off, even when the results don’t come immediately. It can be easy to feel discouraged when things don't go perfectly, but consistency and effort matter more than any single grade or decision. Staying motivated and trusting the process made a huge difference for me, and I would encourage any student to do the same.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1c35da11-2838-4275-9680-92829497060e\"}":{"__typename":"DeepDives","uuid":"1c35da11-2838-4275-9680-92829497060e","content":"\u003cp\u003eMentorship matters to me because I know firsthand how much of a difference the right guidance can make in a student’s life. Having someone who listens while offering honest advice can make challenges feel much less daunting. I believe that every student deserves access to that kind of support, regardless of their background or goals. A good mentor doesn’t just help with academics—they help students build confidence and see possibilities for themselves that they may have never considered.\u003c/p\u003e\u003cp\u003eThrough my own experiences as a tutor, mentor, and student, I have learned that growth happens most when there is trust and consistency involved. I try to create an environment where students feel comfortable asking questions and setting ambitious goals. The opportunity to play even a small role in someone’s progress is incredibly meaningful to me, and it motivates me to be the kind of mentor I have been lucky to have myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"f5b958a4-039d-493a-886c-18dbefe546dd\"}":{"__typename":"DeepDives","uuid":"f5b958a4-039d-493a-886c-18dbefe546dd","content":"\u003cp\u003eMy greatest source of motivation is the desire to build a life where I can be both successful and fulfilled, and have the means to give back to the communities that have supported me along the way. I have been indescribably fortunate to have teachers, mentors, friends, and family who encouraged me to aim high, and that support has played an immense role in where I am today. Because of that, I feel a strong responsibility to make the most of the opportunities I’ve been given.\u003c/p\u003e\u003cp\u003eWhile maybe an obvious add-on, I am also motivated by the idea of paying that support forward. Whether through service work or my future career, I am determined to use what I learn to help others reach their own goals. Knowing that my effort now can create opportunities not just for myself but for others keeps me focused.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"f49feee9-cef8-4c64-aeca-de0b336f03da\"}":{"__typename":"DeepDives","uuid":"f49feee9-cef8-4c64-aeca-de0b336f03da","content":"\u003cp\u003eAs a middle school and high school student, I was a bit on the shy side. I cared a lot about doing well in school and had big goals for myself, but I didn’t always know the path I wanted to take to get there. I knew that I wanted to make an impact in whatever field I ended up in, but I sometimes felt overwhelmed trying to figure out the perfect career that would bring together all of my interests.\u003c/p\u003e\u003cp\u003eOver time I learned that it is okay not to have everything figured out right away. Trying different activities and opportunities helped me become more confident and comfortable taking risks, and looking back I realize that feeling uncertain was actually an important part of my growth. Those experiences helped me become more curious and more willing to step outside my comfort zone, which are qualities that still impact who I am today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"3f6b6005-92b2-4774-aeaf-6f4b69204ace\"}":{"__typename":"School","uuid":"3f6b6005-92b2-4774-aeaf-6f4b69204ace","name":"Latin School of Chicago","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60610"},"Education:{\"uuid\":\"7623b392-1c1f-4b7c-811d-d5fab945f15d\"}":{"__typename":"Education","uuid":"7623b392-1c1f-4b7c-811d-d5fab945f15d","school":{"__ref":"School:{\"uuid\":\"3f6b6005-92b2-4774-aeaf-6f4b69204ace\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"04c9b4c4-fefd-4e20-855b-44cfdf760234\"}":{"__typename":"Education","uuid":"04c9b4c4-fefd-4e20-855b-44cfdf760234","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Public and International Affairs, Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"78575579-3da9-49b2-820f-a01955bef099\"}":{"__typename":"MentorPublicProfile","uuid":"78575579-3da9-49b2-820f-a01955bef099","displayName":"McKenna F.","slug":"mckenna-fellows","biography":"\u003cp\u003eHi! I’m McKenna, a student at Princeton University studying Public and International Affairs and Computer Science. I am passionate about helping students pursue what they love while developing the skills they need to succeed independently, academically or otherwise. Through my experiences as a tutor and mentor, I have come to believe that one of the most valuable resources a student can have is a supportive, empathetic mentor who is invested in their growth. Everyone learns differently, and I enjoy helping students discover the strategies that allow them to do their best, most purposeful work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic interests combine problem-solving with an understanding of real-world issues. Studying public policy and computer science has taught me to both think critically and approach challenges from multiple perspectives, and I am excited to help students strengthen these same skills—whether through the development of a passion project, working through a difficult concept, or building stronger organizational and time-management systems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA large part of my mentorship style centers on motivation and accountability. Many students struggle not because they lack skills, but because they have yet to find the right system to help them manage their time and responsibilities. So, when getting to know a mentee, my first priorities are to try to understand their schedule, general likes and dislikes, and learning style so that we can tailor a realistic plan to their specific needs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eService and mentorship have been important parts of my life for many years. In 2016, I partnered with the early childhood education nonprofit VOCEL to found my annual service project, ‘The Gift of Warmth,’ which coordinates donations of winter essentials to hundreds of families in Chicago each year. Spearheading this initiative for nearly a decade now has taught me not only what it takes to organize large projects, but how to collaborate with communities and allocate resources thoughtfully. Separately, but still under the service umbrella, I have also served as a college advising mentor for high-achieving students in under-resourced schools and teach English as a Second Language classes through a community program at Princeton.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academics and mentoring, I love to read, run long distances, spend time with my dog and connect with people new and old. Above all, I hope to establish an environment where students feel comfortable asking questions and using me as a supportive resource to both build on their existing skill sets and explore new ones.\u003c/p\u003e","teachingVideoPlaybackId":"OKmJIO02A91llid9nfbvkLqYRqoPLpc6i17qPHJihJ0000","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Public and International Affairs, Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7663d4ea-b6b4-4e68-9145-180456eb3eae\"}"},{"__ref":"DeepDives:{\"uuid\":\"1c35da11-2838-4275-9680-92829497060e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f5b958a4-039d-493a-886c-18dbefe546dd\"}"},{"__ref":"DeepDives:{\"uuid\":\"f49feee9-cef8-4c64-aeca-de0b336f03da\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1e8fa73c-a351-48e9-8c34-b89b40d5933e/-/preview/-/format/jpg/","https://ucarecdn.com/8d47ec17-80ab-4871-8ebb-6a915d51ef80/-/preview/-/format/jpg/","https://ucarecdn.com/67490ea5-96a9-4b49-9607-df603b62aaff/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7623b392-1c1f-4b7c-811d-d5fab945f15d\"}"},{"__ref":"Education:{\"uuid\":\"04c9b4c4-fefd-4e20-855b-44cfdf760234\"}"}],"hiredAt":"2026-03-01T14:50:30.707Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","Precalculus / Trigonometry","Algebra II","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Computer Science","K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Sports Journalism","History Project","Video / Photography","Fashion / Cosmetics","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Journalism","Public Speaking","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mckenna-fellows\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"78575579-3da9-49b2-820f-a01955bef099\"}"}}},"_sentryTraceData":"ff786fd768294f0e8ce99455d2c554ca-b4d512b98afd4023-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7
