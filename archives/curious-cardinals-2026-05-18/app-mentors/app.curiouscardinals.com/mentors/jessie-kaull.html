:{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2023","major":"MA: Sustainability, BA: Environmental Science","degree":null},"MentorPublicProfile:{\"uuid\":\"671fd691-2fc8-4474-8899-532b0b65cc24\"}":{"__typename":"MentorPublicProfile","uuid":"671fd691-2fc8-4474-8899-532b0b65cc24","displayName":"Jessie K.","slug":"jessie-kaull","biography":"\u003cp\u003eThe outdoors have always been Jessie’s favorite “classroom” setting, so she made a promise to herself to seek out hands-on learning experiences for the rest of her life. Over the years she’s kept this promise, scuba diving at the Island School and in Belize, practicing sustainable farming while WWOOFing in Washington, exploring spirituality and creative writing in Big Sur, and studying abroad during college (twice!) - in Australia and sailing 3,000 miles in the Pacific Ocean with Stanford@Sea.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile in Switzerland for high school, when she wasn’t playing on an entirely French-speaking basketball team (yes, that was her first exposure to learning French and yes, her basketball vocabulary was quite strong), she satisfied her curiosity with science, geography, math, history, writing \u0026amp; Spanish. After finishing the International Baccalaureate diploma, Jessie returned to her home state of CA to attend Stanford University.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWith the world of learning at her fingertips, she was able to explore her interests in ecology and biology (human, marine and terrestrial), environmental justice and scientific communication, food systems and fisheries, international relations and diplomacy, sustainability and systems-level change, design thinking and entrepreneurship. She found community in the women’s club basketball team, among the Stanford Sierra Camp staff for 3 summers, and through her involvement with The Farmlink Project. Jessie loves teaching and has experience working with students from ages 4-18. Outside of the classroom, you can find her running with her dog, cooking with family, and laughing uncontrollably with friends.\u003c/p\u003e","teachingVideoPlaybackId":"Igm8rmTv2kCtMxRxo00XuYDksuTbc02izTxd4CtOOCL1A","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"25ba7901-245f-48d0-a208-c054a35b5d64\"}"},{"__ref":"Favorites:{\"uuid\":\"0e33b460-a713-4b86-9510-52d844778b22\"}"},{"__ref":"Favorites:{\"uuid\":\"83271d63-9c81-4c9f-a554-10712b128cfe\"}"}],"causesSupported":[],"major":"MA: Sustainability, BA: Environmental Science","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/0e13935a-57c9-49dc-a1fa-11b925d8bc48/-/preview/-/format/jpg/","https://ucarecdn.com/a4ad111d-95c7-45ba-a202-8e1a6feb3c5c/-/preview/-/format/jpg/","https://ucarecdn.com/b75f0b3d-2aad-4f7c-b96d-e4888dd18444/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f33588fd-1a1a-4578-ae3f-6be3c057f458\"}"},{"__ref":"Education:{\"uuid\":\"d42dd1f9-9fff-4836-b8a2-cec6b03630b4\"}"}],"hiredAt":"2023-12-20T01:10:56.094Z","topics":["Public Speaking","STEM Project","Business / Entrepreneurship","6-8 Grade Science","Biology","Academic Coaching","Executive Function","Geography","College Essay Writing","Sustainability"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jessie-kaull\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"671fd691-2fc8-4474-8899-532b0b65cc24\"}"}}},"_sentryTraceData":"aab4d9aa53e4422fb0c78745316a50cf-93f844d008f69ce4-0","_sentryBaggage":"s
