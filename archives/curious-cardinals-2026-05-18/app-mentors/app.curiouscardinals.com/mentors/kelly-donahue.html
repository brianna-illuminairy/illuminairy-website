xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"abb8709a-e379-4871-be89-cac9b894e986\"}":{"__typename":"DeepDives","uuid":"abb8709a-e379-4871-be89-cac9b894e986","content":"\u003cp\u003eI chose to major in Psychology because I have always been so interested in understanding human behavior, how people think and make choices, and how people interact with others. I took AP Psychology in high school which sparked my interest in pursuing psychology as a major, and taking my first couple courses at Cornell really reinforced my passion for it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"a5851bd3-3862-4b98-a555-278d74d974d8\"}":{"__typename":"DeepDives","uuid":"a5851bd3-3862-4b98-a555-278d74d974d8","content":"\u003cp\u003eSomething I am extremely proud of is reaching the top of Mount Whitney, the tallest mountain in the continental United States. I completed the hike my sophomore year of high school with my dad and my sister and it was 3 days of hiking over 15 miles (mostly uphill) each day. There were so many points in the trip where I wanted to give up or stop hiking for the day, but I didn't and when I finally reached the top of the mountain, I was extremely proud of what I had done and was in such awe at what I saw around me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"21700437-8a3e-4744-b592-583ff5ce6490\"}":{"__typename":"DeepDives","uuid":"21700437-8a3e-4744-b592-583ff5ce6490","content":"\u003cp\u003eMy dream job would be working for National Geographic, getting to travel around the world and take photographs of nature and animals. I love watching the National Geographic animal documentaries and would love for that to be my job.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a8541d56-4daf-4751-8ac3-46e29859dd12\"}":{"__typename":"DeepDives","uuid":"a8541d56-4daf-4751-8ac3-46e29859dd12","content":"\u003cp\u003eIn high school, I spent most of my summers spending time at the beach when possible or visiting family in New York. When I visited family in New York, my cousins and I would spend all day at the lake, swimming, tubing, and water skiing, which was always so much fun. I also spent a lot of time babysitting and spending time with my friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"ba688ee5-620b-467d-9c59-30738174d560\"}":{"__typename":"School","uuid":"ba688ee5-620b-467d-9c59-30738174d560","name":"Palos Verdes High School","city":"Palos Verdes Estates","type":"HIGH","state":"California","country":"United States","zip":"90274"},"Education:{\"uuid\":\"b5624736-a40d-4033-8107-8312b166c49e\"}":{"__typename":"Education","uuid":"b5624736-a40d-4033-8107-8312b166c49e","school":{"__ref":"School:{\"uuid\":\"ba688ee5-620b-467d-9c59-30738174d560\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"afea163f-de13-44a6-9d55-7e40f73725a9\"}":{"__typename":"Education","uuid":"afea163f-de13-44a6-9d55-7e40f73725a9","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"7761ae45-74ed-4e6c-924d-52969e1eb7cb\"}":{"__typename":"MentorPublicProfile","uuid":"7761ae45-74ed-4e6c-924d-52969e1eb7cb","displayName":"Kelly D.","slug":"kelly-donahue","biography":"\u003cp\u003eHi! I'm Kelly Donahue, and I am currently a sophomore at Cornell University, majoring in Psychology and minoring in Business. I am originally from a city outside Los Angeles called Palos Verdes, where I lived my entire life. In high school, I was a part of my school's varsity volleyball team, where we went to the Division 1 state championships 2 years in a row which was such an exciting experience. I was also involved in numerous volunteer-based extracurriculars and sports teams outside of school. My favorite subjects in high school were Psychology, History (specifically US History), and Math. I am currently pursuing a career in real estate and have an internship this summer that I am extremely excited about. Outside of school, I love playing volleyball, reading, making new foods, singing karaoke, playing with my dogs when I can, and listening to all kinds of music (my favorite artists are Rihanna and Chris Stapleton, so very different kinds of music).\u003c/p\u003e\u003cp\u003eI have always loved working with students, helping them feel more confident, less overwhelmed, and excited about learning new things. I completely understand that school can be tough, especially when a subject doesn't make sense right away or when students are balancing so many different things at once. My focus is on creating a personalized approach to learning for each student that is engaging and encouraging for them. Whether students need help understanding homework or subjects, preparing for a test, improving their organizational skills, or building better study habits in general, I am here to support them with patience and positivity. My sessions are always and will always be encouraging, positive, and designed to help students succeed, be confident in their abilities, and feel good about the progress they have made.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThank you so much for considering me, and I look forward to the opportunity to work with your family!\u003c/p\u003e","teachingVideoPlaybackId":"lZuMYbkOfDpsigKAg50100F8EU4B2Ge1EE6UriHGdEt7Y","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"abb8709a-e379-4871-be89-cac9b894e986\"}"},{"__ref":"DeepDives:{\"uuid\":\"a5851bd3-3862-4b98-a555-278d74d974d8\"}"},{"__ref":"DeepDives:{\"uuid\":\"21700437-8a3e-4744-b592-583ff5ce6490\"}"},{"__ref":"DeepDives:{\"uuid\":\"a8541d56-4daf-4751-8ac3-46e29859dd12\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fbaeb365-8204-4a34-a443-04377c5f305d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b5624736-a40d-4033-8107-8312b166c49e\"}"},{"__ref":"Education:{\"uuid\":\"afea163f-de13-44a6-9d55-7e40f73725a9\"}"}],"hiredAt":"2025-04-22T22:11:05.577Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","6-8 Grade Science","Writing","Reading","College Essay Writing","Economics","History"],"communityBadges":["https://
