on:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"00293859-0250-4dda-90e3-4020aaf2c5bc\"}":{"__typename":"DeepDives","uuid":"00293859-0250-4dda-90e3-4020aaf2c5bc","content":null,"videoPlaybackId":"v1PUBxyoZ101HUImXnQq01aVTSrIfcY02F9OIpQLNY8s7w","question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"854711b0-93da-48f6-82c1-4579afb57dc0\"}":{"__typename":"DeepDives","uuid":"854711b0-93da-48f6-82c1-4579afb57dc0","content":null,"videoPlaybackId":"pFEJ8ypgm85JDz6CbSWjl02LebsVD00tfLJXI1SEt39bU","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"b4519943-7747-4939-b581-33c208b7493e\"}":{"__typename":"School","uuid":"b4519943-7747-4939-b581-33c208b7493e","name":"Marquette High School","city":"Chesterfield","type":"HIGH","state":"Missouri","country":"United States","zip":"63017"},"Education:{\"uuid\":\"2f23b8e7-9dcf-4267-ae60-2c84b2e47de3\"}":{"__typename":"Education","uuid":"2f23b8e7-9dcf-4267-ae60-2c84b2e47de3","school":{"__ref":"School:{\"uuid\":\"b4519943-7747-4939-b581-33c208b7493e\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"258912ed-3993-47e0-bdcf-13f91cf4c9d4\"}":{"__typename":"School","uuid":"258912ed-3993-47e0-bdcf-13f91cf4c9d4","name":"The University of Texas at Dallas","city":"Richardson","type":"COLLEGE","state":"Texas","country":"United States","zip":"75080"},"Education:{\"uuid\":\"d30c0d07-10b4-455b-bc31-06ab82c89dec\"}":{"__typename":"Education","uuid":"d30c0d07-10b4-455b-bc31-06ab82c89dec","school":{"__ref":"School:{\"uuid\":\"258912ed-3993-47e0-bdcf-13f91cf4c9d4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"b4c12c96-4bac-48d9-9768-b580513136b0\"}":{"__typename":"MentorPublicProfile","uuid":"b4c12c96-4bac-48d9-9768-b580513136b0","displayName":"Daniel V.","slug":"daniel-vayman","biography":"\u003cp\u003eAs a young kid, I didn't have much ambition. I was introverted, played video games constantly, and didn't venture out of my comfort zone. It was only by chance that I discovered the world of computer science in high school. Since I was so used to the computer screen, it was the easiest place to soothe my creative itch--not canvas or clay. Quickly I became obsessed after my first programming class, starting from game development and high school robotics to self-driving cars and making rockets fly at SpaceX! But I never had a mentor to ease the learning process or help me find my spark, which is why I'm here.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd sure, I concede I still play video games from time to time (nothing wrong with that), but it was--and still is--a difficult journey.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eComputer science is an intense, complicated field, which can discourage early learners (I'm still discouraged sometimes). I never had someone to cater the learning process and make it easy to see the fun of programming and its usefulness. \u003cstrong\u003e\u003cu\u003eThat's why I'm here as a mentor.\u003c/u\u003e\u003c/strong\u003e I give students a deep, conceptual understanding of topics. For example, I'll teach not just the formulas they'll use, but how those formulas were found in the first place and what relationships they represent. That way it satisfies their curiosity and makes them more equipped as students. I rarely had teachers do that for me in school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cu\u003eSo what am I doing now\u003c/u\u003e other than playing video games? Well it's my third and last year at UT Dallas studying Computer Science. Recently, I interned at SpaceX writing flight software for their starship rocket. (Turns out rocket science is actually pretty difficult haha). Before that I interned at Cisco writing software features for their network firewall products.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my time at university, I led our autonomous driving research lab called Nova, where a bunch of students work under a professor's lab to design, develop, and test a self-driving car! Luckily we successfully demonstrated level 4 autonomous driving after only one year.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore that, really where it all started, was in high school. I led my competitive robotics team for three years and I had so much fun. It sparked my interest in control systems and vehicle software.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also enjoy seeing a potential for impact in my work in computer science. That's why, after I graduate, I'm looking to join strong teams solving the toughest problems today: self-driving, space travel, and nuclear energy. We'll see where I end up. Thanks so much for reading! I hope I can be of service.\u003c/p\u003e","teachingVideoPlaybackId":"ncPxktrMI1PeaMeX6ButbWERep02WM02d1e8TAosvmqmA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eCouple of things here, I couldn't decide between the two. First I'm super proud to have led UTD's autonomous driving research lab as Project Lead. It's such a unique and amazing experience for undergraduates to get industry experience in a cutting-edge field. I'm lucky to have been in a position to support the program and also improve my technical and leadership skills. \u003cbr\u003e\u003cbr\u003eSecond, I'm super proud to have interned at SpaceX as a flight software engineer. It was a dream role of mine for a long time. Though I didn't have prior experience in rocketry, I've been obsessed with space for so long. Contributing software that was flown to orbit multiple times felt surreal. The best part was being surrounded by some of the best engineers and smartest problem solvers on the planet.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"30b8091c-9bb5-4fb4-8204-91aa4c17bb15\"}"},{"__ref":"Favorites:{\"uuid\":\"2faae590-00ae-4836-a0e7-2f7453aeb18d\"}"},{"__ref":"Favorites:{\"uuid\":\"7a8ba208-4e77-4362-ac32-bb9976fe8474\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2f288ced-2210-46c2-82e6-5b9cff8d3589\"}"},{"__ref":"DeepDives:{\"uuid\":\"fee89b8a-405a-4664-9d5e-431c7cd73b9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"00293859-0250-4dda-90e3-4020aaf2c5bc\"}"},{"__ref":"DeepDives:{\"uuid\":\"854711b0-93da-48f6-82c1-4579afb57dc0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5282c5a9-2cec-4829-98e9-49e4fe0eee39/-/preview/-/format/jpg/","https://ucarecdn.com/e546917c-ca55-4cea-a59c-af4ce1b5f670/-/preview/-/format/jpg/","https://ucarecdn.com/740a407a-d1fd-46eb-b082-8af5c8f0067c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2f23b8e7-9dcf-4267-ae60-2c84b2e47de3\"}"},{"__ref":"Education:{\"uuid\":\"d30c0d07-10b4-455b-bc31-06ab82c89dec\"}"}],"hiredAt":"2025-02-05T12:24:48.675Z","topics":[],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/ac9566a7-da83-4384-8db1-04fe48d7e720/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"daniel-vayman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b4c12c96-4bac-48d9-9768-b580513136b0\"}"}}},"_sentryTraceData":"3b199823f1bc46399a214762bf4a9046-9882c3596852aee9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746
