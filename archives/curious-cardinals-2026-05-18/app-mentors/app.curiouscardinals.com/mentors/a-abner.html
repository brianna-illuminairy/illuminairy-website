xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bfb6d479-da63-45f9-97c2-37542c7402f6\"}":{"__typename":"Favorites","uuid":"bfb6d479-da63-45f9-97c2-37542c7402f6","photoUrl":"https://ucarecdn.com/7e05f1b0-887d-40d3-b6de-42e3fc611944/","title":"The Glass Castle","type":"BOOK"},"Favorites:{\"uuid\":\"43109d15-a65d-4dd6-8540-6a6be2b319be\"}":{"__typename":"Favorites","uuid":"43109d15-a65d-4dd6-8540-6a6be2b319be","photoUrl":"https://ucarecdn.com/fc039aa3-923a-443c-a6b7-e01452cb9db4/","title":"Tennis","type":"SPORT"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"19a6e61c-c651-46b3-a9c1-746d6192620b\"}":{"__typename":"DeepDives","uuid":"19a6e61c-c651-46b3-a9c1-746d6192620b","content":"\u003cp\u003eI was always interested in studying languages and when I learned about linguistics being the study of languages, I knew since middle school I wanted to study it. However, originally I only wanted it to be a secondary/minor, but I realized that if this has been a passion of mine since middle school, I should focus on this instead of other interests that I lost interest in over time. No regrets!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c745a8e6-0549-4c7d-b796-52d86e2525a0\"}":{"__typename":"DeepDives","uuid":"c745a8e6-0549-4c7d-b796-52d86e2525a0","content":"\u003cp\u003eI spent my summers mostly doing marching band camp! My high school had a very competitive marching band and starting in June, we would have daily practices. I did marching band for 6 years, four years playing the flute, and two years as drum major (the one on the podium conducting). I didn't always love the practices after school or in the summer, but I look back on these memories very fondly now~\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a0e285a6-d61f-4ca1-8366-e7cdad6d6911\"}":{"__typename":"DeepDives","uuid":"a0e285a6-d61f-4ca1-8366-e7cdad6d6911","content":"\u003cp\u003eI love reading and being active! I love hiking, figure skating, tennis, and trying anything new! In terms of reading, I especially love fiction and memoirs. Something that I do often that combines the two is reading while walking around (it's completely safe, I swear). \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"0fb2d6e9-8587-4061-ae73-6363c89668d5\"}":{"__typename":"DeepDives","uuid":"0fb2d6e9-8587-4061-ae73-6363c89668d5","content":"\u003cp\u003eThis is something that I wish I had had growing up! A lot of passions and interests weren't feasible for me to do, mostly stemming from the fact that I grew up in a rural area and there weren't a lot of teachers/options to pursue these passions. Curious Cardinals is completely virtual, which means students everywhere can have guidance on their unique interests. I want to be the mentor that I wanted growing up :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"e5ac93db-e985-403d-8398-11d9669e7db5\"}":{"__typename":"School","uuid":"e5ac93db-e985-403d-8398-11d9669e7db5","name":"Fort Chiswell High School","city":"Max Meadows","type":"HIGH","state":"Virginia","country":"United States","zip":"24360"},"Education:{\"uuid\":\"59150fc5-defa-45ac-9da9-3f4c9e8d1edf\"}":{"__typename":"Education","uuid":"59150fc5-defa-45ac-9da9-3f4c9e8d1edf","school":{"__ref":"School:{\"uuid\":\"e5ac93db-e985-403d-8398-11d9669e7db5\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"8cf28952-366e-4077-b433-91b595abecd7\"}":{"__typename":"Education","uuid":"8cf28952-366e-4077-b433-91b595abecd7","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Linguistics","degree":null},"MentorPublicProfile:{\"uuid\":\"b764c938-7d75-47a4-b897-033a18588852\"}":{"__typename":"MentorPublicProfile","uuid":"b764c938-7d75-47a4-b897-033a18588852","displayName":"Aspen A.","slug":"a-abner","biography":"\u003cp\u003eI grew up in a rural area in Virginia, and I am the first to be accepted into an Ivy from my hometown. My high school only offered French and Spanish, so the first thing I did at Harvard was take as many language classes as possible! I have taken French, German, Chinese, Korean, and Russian while at Harvard. I love learning these different languages to learn more about cultures and interact with new people. \u003cbr\u003e\u003cbr\u003eFor extracurriculars at Harvard, I participate in Harvard Model United Nations, helping to staff the Boston conferences. This past summer, I directed at Harvard's international conference in China, which was an amazing experience. For this upcoming Boston conference, I am the Under-Secretary-General of Operations, which basically means I will be taking a lot of photos and updating the website (but still fun). Besides that, I do figure skating, play tennis, and do photography on Harvard's campus. \u003c/p\u003e","teachingVideoPlaybackId":"BLRj5Zt5d02kEngAib4sCIUSR3cTVik98JH1YxZnVzV4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing the Secretary General of HMUN China 2024 was a great experience as a leader. I enjoyed working with a local host team to prepare for the conference and working closely with 14 other Harvard students as I helped them navigate the visa process, working and traveling in a foreign country, and working with the delegates. We worked with middle and high schoolers to prepare them for an English conference and directed the conference on various UN committee topics. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"bfb6d479-da63-45f9-97c2-37542c7402f6\"}"},{"__ref":"Favorites:{\"uuid\":\"43109d15-a65d-4dd6-8540-6a6be2b319be\"}"}],"causesSupported":[],"major":"Linguistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"19a6e61c-c651-46b3-a9c1-746d6192620b\"}"},{"__ref":"DeepDives:{\"uuid\":\"c745a8e6-0549-4c7d-b796-52d86e2525a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"a0e285a6-d61f-4ca1-8366-e7cdad6d6911\"}"},{"__ref":"DeepDives:{\"uuid\":\"0fb2d6e9-8587-4061-ae73-6363c89668d5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2a2b83a1-98f1-4558-8eb5-e88b5b4d344e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"59150fc5-defa-45ac-9da9-3f4c9e8d1edf\"}"},{"__ref":"Education:{\"uuid\":\"8cf28952-366e-4077-b433-91b595abecd7\"}"}],"hiredAt":"2023-11-03T13:20:08.385Z","topics":["History Project","Music","Visual Ar
