ate":"CA","country":"United States","zip":"92124"},"Education:{\"uuid\":\"72ddb695-f42d-4116-8fc7-47b491cb165d\"}":{"__typename":"Education","uuid":"72ddb695-f42d-4116-8fc7-47b491cb165d","school":{"__ref":"School:{\"uuid\":\"ca76b70e-d581-4dff-96f1-0cf878f01bce\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"92a68275-2814-460c-8d32-ba267943138c\"}":{"__typename":"MentorPublicProfile","uuid":"92a68275-2814-460c-8d32-ba267943138c","displayName":"Bianca C.","slug":"bianca-caetanoferrara","biography":"\u003cp\u003eBianca recently graduated from Stanford University with a degree in Human Biology with a concentration in Human Systems and Innovations in Disease Interventions. She is interested in the study of Exercise Physiology and was a TA for a challenging Exercise Phyz course at Stanford. Her background playing soccer along with having 4 knee surgeries led to her interest in combining her love for sport and science together. Bianca played soccer at a competitive level growing up and even got to play for the U17 Brazilian National Team in the U17 Women’s World Cup in Jordan. She also played for the Varsity Women’s Team at Stanford where she won a National Championship her sophomore year. She has experience working at different sport and healthcare startups and is interested in entrepreneurship. Bianca is an incoming student at the USC Physician Assistant Program starting in the fall of 2025 at the USC Keck School of Medicine. Bianca loves to work with students and has been a mentor for young girls in sport for years. In her free time, she loves to cook, explore nature, do improv, and connect with friends and family.\u003c/p\u003e","teachingVideoPlaybackId":"toRSB3AxJ7I4QvdRxV3JehwNdGbAvPPLVYLzA7r6Xsg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7315ae81-4fae-416a-b33b-8ebfeaa
