xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"99b1aa37-a9b5-4064-9508-012b610a107b\"}":{"__typename":"Favorites","uuid":"99b1aa37-a9b5-4064-9508-012b610a107b","photoUrl":"https://ucarecdn.com/7183d90e-1e1a-4fb1-a14f-bc23bcb6c5de/","title":"Stephen Curry","type":"ATHLETE"},"Favorites:{\"uuid\":\"e54bed18-ec35-4c9d-97df-88ed994d7b65\"}":{"__typename":"Favorites","uuid":"e54bed18-ec35-4c9d-97df-88ed994d7b65","photoUrl":"https://ucarecdn.com/4f1b7670-a2e3-426d-9f27-0a49d2a157ad/","title":"Baseball","type":"SPORT"},"Favorites:{\"uuid\":\"5d756f21-27c3-4bf2-a196-774628372a0d\"}":{"__typename":"Favorites","uuid":"5d756f21-27c3-4bf2-a196-774628372a0d","photoUrl":"https://ucarecdn.com/b20402cf-d1c5-4304-a02d-6bbd33a94c1d/","title":"Adam Sandler","type":"ACTOR"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ced35bb8-1153-413b-a3c8-2eeee407e6b5\"}":{"__typename":"DeepDives","uuid":"ced35bb8-1153-413b-a3c8-2eeee407e6b5","content":"\u003cp\u003eMy greatest role model and mentor would be my dad. While my mom is absolutely amazing and I love her to death and she taught me so much about life, my dad was the one who always pushed me to keep challenging myself and become the best version of myself. He gave me the freedom to pursue my interests but he made sure that I became the best at what I enjoyed. He grew up poor and worked extremely hard to give me and my sister an easier life than the one he was given, and I will forever look up to his work ethic and drive to always keep working and bettering himself.\u003c/p\u003e\u003ch6\u003e\u003c/h6\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"c22b5cff-35cf-46e3-b44b-9c52ad8cac91\"}":{"__typename":"School","uuid":"c22b5cff-35cf-46e3-b44b-9c52ad8cac91","name":"Saratoga High School","city":"Saratoga","type":"HIGH","state":"California","country":"United States","zip":"95070"},"Education:{\"uuid\":\"24042257-a8c9-4022-b994-21f8b778a931\"}":{"__typename":"Education","uuid":"24042257-a8c9-4022-b994-21f8b778a931","school":{"__ref":"School:{\"uuid\":\"c22b5cff-35cf-46e3-b44b-9c52ad8cac91\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"7f9500e1-0f2f-4506-8733-f4d3e9e0305d\"}":{"__typename":"Education","uuid":"7f9500e1-0f2f-4506-8733-f4d3e9e0305d","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"c995f201-ccda-4177-86e5-01c3ee25f5bd\"}":{"__typename":"MentorPublicProfile","uuid":"c995f201-ccda-4177-86e5-01c3ee25f5bd","displayName":"Abhinav K.","slug":"abhinav-kiran","biography":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi, my name is Abhinav Kiran, and I am a freshman studying Data Science at UC Berkeley. My academic passions include machine learning, artificial intelligence, robotics, and mathematics. During high school, I had the opportunity to intern at Evodyne Robotics, where I balanced two roles: serving as a teaching assistant for middle school robotics classes and working as a software developer. One of my proudest accomplishments during this time was developing a lane detection system for a robotic race car. These experiences reinforced my interest in AI and robotics, as well as my desire to pursue meaningful technological innovation. Looking ahead, I hope to attend graduate school and eventually join a start-up that is exploring groundbreaking applications of artificial intelligence.\u003c/p\u003e\u003cp\u003eOutside of academics, I am deeply passionate about sports and fitness. I play baseball for Berkeley’s club baseball team, enjoy playing pick-up basketball, and go to the gym. Watching sports(Go Giants, Niners and Warriors!) is another one of my favorite pastimes. Beyond athletics, I enjoy listening to music, playing board games, and playing video games with friends.\u003c/p\u003e\u003cp\u003eAs a mentor, my mission is to inspire my mentees to be the best version of themselves and to guide them toward achieving their goals. Mentors have played a significant role in shaping who I am today, including my middle school baseball coach and a college student I interned with as a high schooler. They set examples of the person and student I aspire to be, and I strive to provide that same inspiration to my mentees.\u003c/p\u003e\u003cp\u003eAs an older brother and former basketball and baseball coach, I know the pride and fulfillment that comes from helping others reach difficult milestones. I aim to make my sessions engaging and interactive. While traditional lessons may deliver the most information, I believe that a mix of mini activities and games are extremely effective in reinforcing understanding and making learning enjoyable. My ultimate goal is for my mentees to feel accomplished, confident, and excited about their progress, and I will always emphasize their growth whenever they are struggling.\u003c/p\u003e","teachingVideoPlaybackId":"N3UawukURLGkcJ00syBrnWIZLTPyOJkA2Tnx01Ni9auHk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"99b1aa37-a9b5-4064-9508-012b610a107b\"}"},{"__ref":"Favorites:{\"uuid\":\"e54bed18-ec35
