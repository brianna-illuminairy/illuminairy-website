xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fa087c85-3c08-4017-8dbc-33093641d43e\"}":{"__typename":"Favorites","uuid":"fa087c85-3c08-4017-8dbc-33093641d43e","photoUrl":"https://ucarecdn.com/5c566ba0-943b-454f-ae72-d5f1bb1279ad/","title":"Heard It In a Past Life by Maggie Rogers ","type":"ALBUM"},"Favorites:{\"uuid\":\"b05f7436-9f9e-4b87-b10c-a9680b9f17e2\"}":{"__typename":"Favorites","uuid":"b05f7436-9f9e-4b87-b10c-a9680b9f17e2","photoUrl":"https://ucarecdn.com/8e53e7cf-4ffd-41ae-bf0f-25bf825a493e/","title":"Braiding Sweetgrass by Robin Wall Kimmerer ","type":"BOOK"},"Favorites:{\"uuid\":\"fbe87d85-6820-45e5-bdf3-594e8f24a98d\"}":{"__typename":"Favorites","uuid":"fbe87d85-6820-45e5-bdf3-594e8f24a98d","photoUrl":"https://ucarecdn.com/2515f669-222e-4ab7-a0cd-e62f846952a0/","title":"Amsterdam, Netherlands ","type":"CITY"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"b3914f9a-5272-442c-abf5-c75127789ee0\"}":{"__typename":"DeepDives","uuid":"b3914f9a-5272-442c-abf5-c75127789ee0","content":"\u003cp\u003eDuring my senior year of high school, I served as the Editor-in-Chief for Marlborough School's award-winning student newspaper, \u003cem\u003eThe UltraViolet\u003c/em\u003e. Throughout my time as Editor-in-Chief, my team covered the 2024 presidential election as well as the devastating Palisades and Eaton fires in real time. Throughout a chaotic year full of tragedies for many in my community, I led the production of multiple magazines and newspapers that detailed the impacts of these events. We provided live coverage of the election for our school in November through an election map and gave a platform to those affected by the fires to share their stories in January. I am incredibly proud of the work done by my team. I believe that these projects demonstrated my genuine commitment to my community and my belief in the power of writing as a tool to address important social issues.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"55008aec-2792-464b-bc35-cb935235d7fc\"}":{"__typename":"DeepDives","uuid":"55008aec-2792-464b-bc35-cb935235d7fc","content":"\u003cp\u003eIn my spare time, I love going on long walks, listening to music, and trying new restaurants or workout classes. I am happiest on a nice day outdoors, especially when a walk turns into a meaningful conversation with friends. There is nothing better than the perfect playlist for a specific moment, and I am always eager to discover a new cuisine, hole in the wall restaurant, or coffee shop wherever I am.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"38b2a5ef-bf5c-48e4-82d8-e1dcb6203453\"}":{"__typename":"DeepDives","uuid":"38b2a5ef-bf5c-48e4-82d8-e1dcb6203453","content":"\u003cp\u003eBetween writing and editing for my school’s newspaper, researching the effects of social pressure on youth engagement in climate action, and taking literary theory courses focused on gender and sexuality, my academic interests span a wide range of disciplines. Because of this, choosing a single path has been both exciting and challenging.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a freshman, I know my focus may continue to evolve, and I am grateful to attend a university that encourages intellectual exploration. Majoring in Sociology allows me to examine how different social systems and identities intersect and shape lived experience. My minor in English strengthens my analytical thinking and writing, while my Environmental \u0026amp; Sustainability Studies minor reflects my longstanding commitment to climate justice and education. Together, these areas of study allow me to explore complex social issues from multiple perspectives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}":{"__typename":"School","uuid":"693ea7b8-def0-456d-88a4-4055bd090a62","name":"Marlborough School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90004"},"Education:{\"uuid\":\"d3709d05-fe33-4498-9a86-512c2e159904\"}":{"__typename":"Education","uuid":"d3709d05-fe33-4498-9a86-512c2e159904","school":{"__ref":"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}"},"startYear":"2019","endYear":"2015","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"ffaffa83-c001-4110-bac2-cc53c5e0869f\"}":{"__typename":"Education","uuid":"ffaffa83-c001-4110-bac2-cc53c5e0869f","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"a9fe78df-ecbd-452e-bf9d-7b3f5be978ce\"}":{"__typename":"MentorPublicProfile","uuid":"a9fe78df-ecbd-452e-bf9d-7b3f5be978ce","displayName":"Millie R.","slug":"millie-reich-1","biography":"\u003cp\u003eHi!!\u003c/p\u003e\u003cp\u003eI am a current freshman at Vanderbilt University majoring in Sociology and minoring in English and Environmental \u0026amp; Sustainability Studies. I am passionate about helping students discover their strengths in writing and communication while empowering them to create meaningful change in their communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, I often wanted to be challenged beyond the level of my coursework. I was fortunate to have a strong support system and access to opportunities that pushed me intellectually. In seventh grade, I began attending a competitive all-girls school where I was surrounded by older students who balanced academic excellence, a fulfilling social life, and rich extracurricular involvement. From a young age, I knew I wanted to embody that same balance of ambition, curiosity, and engagement, and to help other students do the same.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I developed a deep passion for writing. Coming from a family of readers and writers, I always valued self-expression and the sense of community built through language. I joined my school newspaper in seventh grade and remained involved through my senior year, eventually serving as Editor-in-Chief. Through this experience, I learned how to lead a team, mentor younger students, manage competing priorities, and teach writing in an engaging and supportive way. These skills strengthened my executive functioning abilities and deepened my commitment to mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond journalism, I expanded my mentorship experience through Future Fighters, an environmental leadership group for elementary school girls. Over two years, I helped design and teach lessons about environmental issues, organized community engagement activities, and guided students in writing speeches that they presented at City Hall and at school. Working with these students, I saw the same wide-eyed curiosity and desire to learn that I had at their age. It became my goal to be the mentor I once needed, someone who helps young people understand complex global challenges and channel their emotions into informed, meaningful action. This experience strengthened my ability to translate complex material into accessible lessons while building genuine connections with students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTogether, these experiences have prepared me to provide both academic mentorship and passion project guidance. I am particularly well equipped to support middle and high school students in English, writing, journalism, and environmental science. More importantly, I aim to help students build confidence, feel intellectually challenged, and use their skills to make a real impact!!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"PGL2NnKQOtEEVAEaTEuezESu01SRDZ02T00hpytKV00gGdw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"fa087c85-3c08-4017-8dbc-33093641d43e\"}"},{"__ref":"Favorites:{\"uuid\":\"b05f7436-9f9e-4b87-b10c-a9680b9f17e2\"}"},{"__ref":"Favorites:{\"uuid\":\"fbe87d85-6820-45e5-bdf3-594e8f24a98d\"}"}],"causesSupported":[],"major":"Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b3914f9a-5272-442c-abf5-c75127789ee0\"}"},{"__ref":"DeepDives:{\"uuid\":\"55008aec-2792-464b-bc35-cb935235d7fc\"}"},{"__ref":"DeepDives:{\"uuid\":\"38b2a5ef-bf5c-48e4-82d8-e1dcb6203453\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/baf6114b-33c1-4a43-b32b-ae60774ecec0/-/preview/-/format/jpg/","https://ucarecdn.com/17211f2b-f401-46c0-8dcd-ca869c09fd13/-/preview/-/format/jpg/","https://ucarecdn.com/6bd32141-5832-402d-be7d-c35440ffa2a7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d3709d05-fe33-4498-9a86-512c2e159904\"}"},{"__ref":"Education:{\"uu
