xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"75cd9612-1939-448e-b182-b30d7b864bfb\"}":{"__typename":"DeepDives","uuid":"75cd9612-1939-448e-b182-b30d7b864bfb","content":"\u003cp\u003eMy dream job is to be a world traveller! I would meet new people, savor delicious foods, learn new languages, see beautiful sights, listen to people's experiences and wisdom, and become more aware of the complex and striking spectrum of the human condition. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"14e28b3e-ddb8-4bd0-9d07-3e200d527d94\"}":{"__typename":"DeepDives","uuid":"14e28b3e-ddb8-4bd0-9d07-3e200d527d94","content":"\u003cp\u003eComing from a multicultural background, I intimately understand the complex and beautiful landscape that comes with being a child of immigrants. I acknowledge that academic pressure from family members is a blessing and a display of deep love, and at the same time, I also recognize the importance of pursuing your passions in a balanced and realistic way! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"9dd59651-7481-4a41-a05b-f70de8647e16\"}":{"__typename":"DeepDives","uuid":"9dd59651-7481-4a41-a05b-f70de8647e16","content":"\u003cp\u003eMy mom is my biggest source of inspiration! She immigrated to the US from South Korea entirely on her own, and I owe everything to her! She has sacrificed so much so that I could have a beautiful and privileged life. She is my entire world, and I feel so blessed to be her daughter! Everything I do is for her! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"afc95ed6-2de8-412d-b45d-6797950943a8\"}":{"__typename":"DeepDives","uuid":"afc95ed6-2de8-412d-b45d-6797950943a8","content":"\u003cp\u003eI'm incredibly grateful to have had numerous mentors throughout my life. Without them, I would not be where I am today. I am passionate about continuing the cycle of supporting bright students to pay this act of service forward!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"d0a6d500-f63d-4978-94e4-69d81e93781d\"}":{"__typename":"School","uuid":"d0a6d500-f63d-4978-94e4-69d81e93781d","name":"Huntington Beach High School","city":"Huntington Beach","type":"HIGH","state":"California","country":"United States","zip":"92648"},"Education:{\"uuid\":\"cf5e211d-98c1-49e2-b539-7160deae92e9\"}":{"__typename":"Education","uuid":"cf5e211d-98c1-49e2-b539-7160deae92e9","school":{"__ref":"School:{\"uuid\":\"d0a6d500-f63d-4978-94e4-69d81e93781d\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"a56487a0-562a-400c-8687-83b3d4260490\"}":{"__typename":"Education","uuid":"a56487a0-562a-400c-8687-83b3d4260490","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"000582b3-d1be-4841-8d85-07211ce59a94\"}":{"__typename":"MentorPublicProfile","uuid":"000582b3-d1be-4841-8d85-07211ce59a94","displayName":"Chanel N.","slug":"chanel-nejad","biography":"\u003cp\u003eHello, my name is Chanel Nejad! I’m a daughter of Iranian and Korean immigrants, a Southern Californian native, a recent graduate from UCLA, and I would describe myself as bubbly, empathetic, people-centric, and justice-oriented.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm currently living in New York City for a Public Affairs Fellowship through Coro New York! I plan to attend law school in the near future. I'm passionate about using the law to create more fair and just policies, specifically to solve mass incarceration. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my academic and professional life, I enjoy spending time with my friends and family, trying new coffee spots, cooking, playing chess, dancing, swimming in the ocean, and styling outfits for my friends and myself!\u003c/p\u003e","teachingVideoPlaybackId":"K7l4eu3AcoTiBKi01bFJ6dKm00pRwFLzNrrCnJ2NIaMgQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eDuring my junior year of high school, I attended a Model UN conference in New York City. Based on my efforts in committee, I was selected to represent my committee by speaking at the U.N. General Assembly. This will be a day I'll never forget!\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Political Science","deepDives":[{"_
