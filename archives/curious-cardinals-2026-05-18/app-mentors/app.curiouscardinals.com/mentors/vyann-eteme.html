xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c2c62d1e-446c-412d-9415-97e25733d5f4\"}":{"__typename":"DeepDives","uuid":"c2c62d1e-446c-412d-9415-97e25733d5f4","content":"\u003cp\u003eWhen I first arrived at Yale I was vehemently against majoring in anything related to STEM. It wasn't until I was faced with the reality of high Black maternal and infant mortality rates that I decided to pursue a double major in both HSHM and Music. The former is a wonderful field of study that will equip me with the necessary tools for a career in medicine and reproductive health (specifically midwifery and gynecology). \u003cbr\u003e\u003cbr\u003eMusic has been an integral aspect of my life since before I was born. I grew up singing and playing classical piano and eventually fell in love with jazz. Throughout this time I have also developed a deep desire to compose something I hope to do professionally. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"03b24cf3-ebfc-4ffe-a8ec-bd84487e7236\"}":{"__typename":"DeepDives","uuid":"03b24cf3-ebfc-4ffe-a8ec-bd84487e7236","content":"\u003cp\u003eGet more sleep! Trust your intuition, do the things that scare you. Try and fail and try and fail, it's better to do this than to spend your life wondering. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"de568c3e-045a-4b53-8673-6eb1008f58b1\"}":{"__typename":"DeepDives","uuid":"de568c3e-045a-4b53-8673-6eb1008f58b1","content":"\u003cp\u003eLove \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"11a568e2-d226-4ce0-a1b1-809f19ba831a\"}":{"__typename":"DeepDives","uuid":"11a568e2-d226-4ce0-a1b1-809f19ba831a","content":"\u003cp\u003eFriends and foes alike are very aware of my obsessive adoration of plants and all things green (fun fact: for a brief time in high school I wanted to be a botanist).\u003cbr\u003eMy leafy loves have practically overtaken my dorm (and my parents' house), and I must say, after the loss of some brave and strong soldiers, my track record of keeping my babies alive is pretty good (as of now).\u003cbr\u003e\u003cbr\u003eI spend way too much time examining the leaves of my Global Pothos and West African Fiddle Leaf Fig, searching frantically for any critters that seek to crunch and destroy.\u003cbr\u003e\u003cbr\u003eThe magical transformation from droopy dull herb to shiny and perky flora is one my favorite things to witness. I dunk them in a bowl of water and bam! They drink their fill, I turn the humidifier on, spray tea tree oil and watch them bask in sunlight.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9250d15c-1e69-43a9-b122-716a0bc0022b\"}":{"__typename":"School","uuid":"9250d15c-1e69-43a9-b122-716a0bc0022b","name":"The Park School of Baltimore","city":"Baltimore","type":"HIGH","state":"Maryland","country":"United States","zip":"21208"},"Education:{\"uuid\":\"5b879f83-ea8b-4400-b3a9-d8a72b9afbb8\"}":{"__typename":"Education","uuid":"5b879f83-ea8b-4400-b3a9-d8a72b9afbb8","school":{"__ref":"School:{\"uuid\":\"9250d15c-1e69-43a9-b122-716a0bc0022b\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"61c88443-e923-493e-90bf-0c2ef909f22e\"}":{"__typename":"Education","uuid":"61c88443-e923-493e-90bf-0c2ef909f22e","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"History of Science, Medicine, and Public Health (HSHM) and Music ","degree":"B.A, B.A "},"MentorPublicProfile:{\"uuid\":\"1a000786-a442-480a-badf-9d637ef6ed6b\"}":{"__typename":"MentorPublicProfile","uuid":"1a000786-a442-480a-badf-9d637ef6ed6b","displayName":"Vyann E.","slug":"vyann-eteme","biography":"\u003cp\u003eVyann E. is a recent graduate of Yale College. She majored in History of Science, Medicine and Public Health and Music with a focus in Composition. She is currently working at the Center for Biological Diversity in California as a Gender and Reproductive Justice Intern. She will be completing a MSPH in Reproductive Health from Johns Hopkins University in 2028. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eShe was born and raised in Baltimore, Maryland, the \"Charm\" city that produced legends such as Billie Holiday, Edgar Allen Poe and Jada Pinkett Smith.\u0026nbsp;\u003c/p\u003e\u003cp\u003eShe is very passionate about food, both its consumption and preparation (but eating wins), and she adores sci-fi movies.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eVyann believes very strongly that teaching is a form of mentorship that should foster a connection between the mentor and mentee, but most importantly, the content being taught and the real world. She believes that when learning anything, it is vital that mentees be immersed in the culture, history, and significance of a certain topic.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince childhood, Vyann has been obsessed with all things dinosaurs. For a very long time she wanted to work as a paleontologist and dreamed of venturing out to the desert to discover creatures from the lost-world. Now, her professional desires have evolved (much like the dinosaurs), but her love for these prehistoric giants remains.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school Vyann was a very serious member of the Mock Trial team, serving both as a witness and lawyer. She was also a columnist in the school newspaper, a member of the jazz collective, and an active participant in events for the affinity group, Black Female Forum.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, Vyann continued her involvement in affinity spaces across campus; she serves as the Internal Community Projects Chair for the newly founded student organization GAASA (Generational African American Students’ Association), as well as the music director for the a cappella group, Shades of Yale. Vyann has also served as the music director for numerous student productions by Yale theater majors and enthusiasts.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eVyann is an aspiring professional jazz singer, signed singer-songwriter, and nurse-midwife. She hopes to establish a birthing clinic in the center of her beloved hometown of Baltimore. She grew up entirely surrounded by a family of musicians and medical professionals, and considers them some of the most important mentors in life. She hopes to be the same for her future mentees.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"ycNhe7Kzt00s02OCmnyqRXBCuOmS1pUOeycqkeFVqEWZQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History of Science, Medicine, and Public Health (HSHM) and Music ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c2c62d1e-446c-412d-9415-97e25733d5f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"03b24cf3-ebfc-4ffe-a8ec-bd84487e7236\"}"},{"__ref":"DeepDives:{\"uuid\":\"de568c3e-045a-4b53-8673-6eb1008f58b1\"}"},{"__ref":"DeepDives:{\"uuid\":\"11a568e2-d226-4ce0-a1b1-809f19ba831a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3fd157bf-ac00-4ec5-ac30-2ac69a162b7b/-/preview/-/format/jpg/","https://ucarecdn.com/4ee36039-7a14-462a-b5a1-640e3b5ee5e7/-/preview/-/format/jpg/","https://ucarecdn.com/344f864e-f3c5-4cab-976b-1c00bb88d254/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5b879f83-ea8b-4400-b3a9-d8a72b9afbb8\"}"},{"__ref":"Education:{\"uuid\":\"61c88443-e923-493e-90bf-0c2ef909f22e\"}"}],"hiredAt":"2023-11-07T20:52:54.472Z","topics":["Writing","French","Reading","History","Creative Writing","Music","History Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"vyann-eteme\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1a000786-a442-480a-badf-9d637ef6ed6b\"}"}}},"_sentryTraceData":"523e008f1a97473fa91da743861b3843-882c1cbfc13d4439-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-re
