xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f905fcf0-cd7d-4f5c-87dc-88d5a3699860\"}":{"__typename":"Favorites","uuid":"f905fcf0-cd7d-4f5c-87dc-88d5a3699860","photoUrl":"https://ucarecdn.com/3b69d51b-721d-40d4-b350-a6f51b7dd3ff/","title":"Margot Robbie","type":"ACTOR"},"Favorites:{\"uuid\":\"cda5a82e-3c83-46e0-be57-ce9ed2c588f6\"}":{"__typename":"Favorites","uuid":"cda5a82e-3c83-46e0-be57-ce9ed2c588f6","photoUrl":"https://ucarecdn.com/e5f5c3bf-20cd-4c12-bb0a-e4da48954121/","title":"SOS- SZA","type":"ALBUM"},"Favorites:{\"uuid\":\"ed65116c-612c-434b-ac67-37006a6dc44f\"}":{"__typename":"Favorites","uuid":"ed65116c-612c-434b-ac67-37006a6dc44f","photoUrl":"https://ucarecdn.com/80630f6b-0d73-42d4-a4c8-bd1f04173476/","title":"Frank Ocean","type":"ARTIST"},"CausesSupported:{\"uuid\":\"3c3efdcd-008a-40cd-b9d8-77425e7a2ebc\"}":{"__typename":"CausesSupported","uuid":"3c3efdcd-008a-40cd-b9d8-77425e7a2ebc","name":"Tanzania Humanitarian Aid Trip","description":"\u003cp\u003eFundraised and traveled to Tanzania with school to support education and health.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/e8f74146-dfd8-417e-ac22-7320a82bb96a/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d959411a-9e96-4db5-9f63-708a13a53612\"}":{"__typename":"DeepDives","uuid":"d959411a-9e96-4db5-9f63-708a13a53612","content":"\u003cp\u003e\u003cstrong\u003eIt’s okay not to have it all figured out.\u003c/strong\u003e\u003cbr\u003eYou might feel pressured to have a clear plan for your future, but life will surprise you with opportunities you never imagined. Stay open to change, and trust that you'll find your path by exploring your passions and learning from your experiences.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eDon’t fear failure; it’s part of growth.\u003c/strong\u003e\u003cbr\u003eFailing is a sign that you’re trying. Every \"failure\" will teach you something and help you improve. Be kind to yourself during tough times and focus on progress, not perfection.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eSpeak up for what matters to you.\u003c/strong\u003e\u003cbr\u003eWhether it’s standing against injustice, asking for help, or sharing your ideas, your voice matters. \u003c/p\u003e\u003cp\u003e\u003cstrong\u003eValue your relationships.\u003c/strong\u003e\u003cbr\u003eInvest time and energy in the people who truly support and inspire you. These connections will shape who you are and help you navigate challenges.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eTake care of your well-being.\u003c/strong\u003e\u003cbr\u003eAcademic and extracurricular success are important, but not at the expense of your mental and physical health. Create boundaries, find hobbies that recharge you, and learn to balance work with rest.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eBe curious and never stop learning.\u003c/strong\u003e\u003cbr\u003eWhether it’s a subject in school, a skill outside of class, or just the world around you, always stay curious. You’ll discover so much about yourself and others by being open to learning from every opportunity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"503324b9-79f9-4aa2-b7ca-a3f7c649a821\"}":{"__typename":"DeepDives","uuid":"503324b9-79f9-4aa2-b7ca-a3f7c649a821","content":"\u003cp\u003eMy dream job is to be a self-made entrepreneur who weaves together my passions for sustainable fashion, education, and social impact. I envision building a fashion brand that sets new industry standards for sustainability, inclusivity, and ethical practices. This brand wouldn’t just sell clothes; it would tell a story, empowering people to feel confident and aligned with values that prioritize our planet and humanity. \u003c/p\u003e\u003cp\u003eIn addition to fashion, I dream of creating platforms that make education more accessible and engaging, particularly for underrepresented communities. I want to inspire others to think outside the box and pursue paths that align with their passions. This could take the form of mentoring, launching a nonprofit, or designing tools that make learning and self-discovery more interactive.\u003c/p\u003e\u003cp\u003eUltimately, I see myself working at the intersection of creativity, technology, and purpose. Whether it’s through fashion, education, or other ventures, I aspire to build businesses that challenge norms, inspire change, and empower individuals to make a positive impact. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"52ea5c31-9444-48ed-9da6-98a0504fd635\"}":{"__typename":"DeepDives","uuid":"52ea5c31-9444-48ed-9da6-98a0504fd635","content":"\u003cp\u003e- I worked as a law intern at Onal Gallant and Partners, where I assisted in preparing client documents, conducting research, and ensuring compliance with legal standards. This experience strengthened my interest in law and justice, which I further explored at the New York Times Summer Academy by participating in a law course. Activities like mock trials and mental mapping helped me better understand legal systems and sharpen my analytical skills.\u003cbr\u003e- Through Peace Islands and other initiatives, I took part in various humanitarian projects, interfaith dialogue programs, and building bridges between different communities\u003cbr\u003e- I had the opportunity to attend the FBI Teen Academy, where I gained insights into federal law enforcement and developed a deeper appreciation for ethical leadership. \u003c/p\u003e\u003cp\u003e- Preparing for and excelling in the SAT during these months also improved my time management and study habits.\u003cbr\u003e- Attending religious and spiritual camps during the summers was an essential part of my personal development. These camps provided a space for strengthening my values and connecting with like-minded peers. They enriched my understanding of faith and instilled a sense of purpose in my daily life.\u003c/p\u003e\u003cp\u003e- I also made sure to spend lots of times with friends and family, whether travelling abroad or not!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"7657dbc5-978f-49fd-8597-ff38251a9761\"}":{"__typename":"DeepDives","uuid":"7657dbc5-978f-49fd-8597-ff38251a9761","content":"\u003cp\u003eSomething about me that isn’t obvious right away is that I boxed for two years! It’s not only a great workout but also an amazing way to build discipline, mental toughness, and confidence. Boxing taught me how to stay calm under pressure, set goals, and push past my limits, both physically and mentally. I am currently working on joining the equestrian and figure skating team at Princeton!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"0ef00f91-f83a-442e-8985-4d4d4a041f7a\"}":{"__typename":"School","uuid":"0ef00f91-f83a-442e-8985-4d4d4a041f7a","name":"Pioneer Academy","city":"Wayne","type":"HIGH","state":"New Jersey","country":"United States","zip":"07470"},"Education:{\"uuid\":\"42b1bbdd-5abb-4b73-a985-ca2c22ed3327\"}":{"__typename":"Education","uuid":"42b1bbdd-5abb-4b73-a985-ca2c22ed3327","school":{"__ref":"School:{\"uuid\":\"0ef00f91-f83a-442e-8985-4d4d4a041f7a\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"c80005c5-7fd7-4d95-b635-89dfa14dd8d4\"}":{"__typename":"Education","uuid":"c80005c5-7fd7-4d95-b635-89dfa14dd8d4","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Public and International Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"47bc9832-153e-4f26-8668-eadf8eebefe3\"}":{"__typename":"MentorPublicProfile","uuid":"47bc9832-153e-4f26-8668-eadf8eebefe3","displayName":"Suheyla A.","slug":"suheyla-akman","biography":"\u003cp\u003eHello! My name is Suheyla Akman, and I’m an A.B. Candidate at Princeton University’s School of Public \u0026amp; International Affairs, pursuing a certificate in Entrepreneurship. Whether it’s developing sustainable practices, driving social change, or mentoring others, I love finding creative solutions to challenges.\u003c/p\u003e\u003cp\u003eMy journey has been shaped by my dedication to education, leadership, and community service. I have led impactful initiatives like founding PeaceBuilders, which provides food and resources to underserved communities in New Jersey, and co-led fundraising efforts for earthquake relief along with a humanitarian aid project in Tanzania. I’ve also had the honor of mentoring refugee children english, helping them build language skills and confidence for integration into new communities.\u003c/p\u003e\u003cp\u003eBeyond academics, I’ve honed my skills in creative problem-solving and teamwork through experiences like managing social media campaigns to raise awareness about mental health and global issues, designing costumes for theatre productions, and conducting legal research as a law intern. My diverse background also includes writing a published article on nonviolent communication and earning awards like the Presidential and Congressional Award.\u003c/p\u003e\u003cp\u003eAs a Curious Cardinals mentor, I aim to inspire students by sharing my knowledge and experiences while fostering curiosity, creativity, and resilience. I believe that education is not just about knowledge but about using it to create meaningful change in the world.\u003c/p\u003e\u003cp\u003eWhen I’m not busy with school or projects, I enjoy exploring fashion or photography. I’m fluent in Turkish and English, with an elementary proficiency in Arabic, and I’m always excited to connect with students.\u003c/p\u003e\u003cp\u003eLet’s embark on a journey of discovery and growth together!\u003c/p\u003e","teachingVideoPlaybackId":"02CMMIFsPM4xC02gz1r5VeVVCjYvopgYTCxSLeWW6Jzd00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I’m most proud of is founding PeaceBuilders, an organization dedicated to providing food and resources to underserved and at-risk communities in Northern New Jersey. What started as a small idea branched off from a previous organization, Bridging Hopes, and grew into a community-driven initiative that brought tangible change to people’s lives.\u003c/p\u003e\u003cp\u003eThrough PeaceBuilders, I organized fundraisers, coordinated volunteer efforts, and built partnerships to amplify our impact. \u003c/p\u003e\u003cp\u003eLeading this effort taught me the power of collaboration, empathy, and staying committed to a cause bigger than myself.\u003c/p\u003e\u003cp\u003eWhat makes me most proud isn’t just the success of the projects but the relationships I built and the lessons I learned. Seeing the smiles of those we helped and hearing their stories was a reward in itself, and it’s a reminder of the kind of work I want to dedicate my life to.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f905fcf0-cd7d-4f5c-87dc-88d5a3699860\"}"},{"__ref":"Favorites:{\"uuid\":\"cda5a82e-3c83-46e0-be57-ce9ed2c588f6\"}"},{"__ref":"Favorites:{\"uuid\":\"ed65116c-612c-434b-ac67-37006a6dc44f\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"3c3efdcd-008a-40cd-b9d8-77425e7a2ebc\"}"}],"major":"Public and International Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d959411a-9e96-4db5-9f63-708a13a53612\"}"},{"__ref":"DeepDives:{\"uuid\":\"503324b9-79f9-4aa2-b7ca-a3f7c649a821\"}"},{"__ref":"DeepDives:{\"uuid\":\"52ea5c31-9444-48ed-9da6-98a0504fd635\"}"},{"__ref":"DeepDives:{\"uuid\":\"7657dbc5-978f-49fd-8597-ff38251a9761\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/717cb0f9-ede2-4891-b964-8aa5547d31f4/-/preview/-/format/jpg/","https://ucarecdn.com/f97fb452-46e0-4050-8c13-c750af3b3fed/-/preview/-/format/jpg/","https://ucarecdn.com/bb126693-b956-4941-88be-edde9829b848/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"42b1bbdd-5abb-4b73-a985-ca2c22ed3327\"}"},{"__ref":"Education:{\"uuid\":\"c80005c5-7fd7-4d95-b635-89dfa14dd8d4\"}"}],"hiredAt":"2024-12-23T11:14:48.741Z","topics":["K-5 Grade Math","6-8 Grade Science","Writing","College Essay Writing","Economics","History","Academic Coaching","Executive Function"],"communityBadges":["https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/","https://ucarecdn.com/4f6b2e92-2aa8-4328-90be-11c5a7d63bc7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"
