xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7063e764-1c3e-4f2f-a665-0f63a0a2a25f\"}":{"__typename":"Favorites","uuid":"7063e764-1c3e-4f2f-a665-0f63a0a2a25f","photoUrl":"https://ucarecdn.com/cf06f213-790d-4a0f-a018-4131ed63fc02/","title":"Little Fires Everywhere","type":"BOOK"},"Favorites:{\"uuid\":\"cfd1b093-2e5f-4082-9172-8df2b0b181a5\"}":{"__typename":"Favorites","uuid":"cfd1b093-2e5f-4082-9172-8df2b0b181a5","photoUrl":"https://ucarecdn.com/f29d7fcb-36c6-45d5-99cd-0abe135fc71e/","title":"Philadelphia","type":"CITY"},"Favorites:{\"uuid\":\"ba0eae9d-b4b3-4246-9706-a6afcff46fca\"}":{"__typename":"Favorites","uuid":"ba0eae9d-b4b3-4246-9706-a6afcff46fca","photoUrl":"https://ucarecdn.com/4bb1d2ad-1d6c-401c-acbe-af0d1eb84baa/","title":"Avatar","type":"MOVIE"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"201538d3-3fd7-4cb2-89a5-827fb50bda50\"}":{"__typename":"DeepDives","uuid":"201538d3-3fd7-4cb2-89a5-827fb50bda50","content":"\u003cp\u003eIn high school, I spent my summers working as a waitress at a local Mexican restaurant. I was also a member and captain of my school's cross country team, so I completed summer training and led captain's practices. In between working and running, I spent time with my family and at the beach with friends!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"de3eebab-bd7a-44cd-a708-39696287a968\"}":{"__typename":"DeepDives","uuid":"de3eebab-bd7a-44cd-a708-39696287a968","content":"\u003cp\u003eMy dream job is to work with animals hands-on and outside! Whether I become a wildlife biologist, a veterinarian, or a conservation scientist, I want to pursue my passion of protecting Earth and the animals that live here.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"683ff138-57fe-44e8-bbc0-1052caf146d2\"}":{"__typename":"DeepDives","uuid":"683ff138-57fe-44e8-bbc0-1052caf146d2","content":"\u003cp\u003eMentorship matters to me because young people are the future our of planet and everyone deserves to feel supported and guided as they work towards their life goals. I definitely want to be a part of that! Additionally, when I was younger, I was often the only person of color in my classes and certain experiences really affected my confidence in school. I want to work to make sure that other kids do not have the same experience as I did and that they have a supportive mentor who can assist them in whatever areas they are struggling in without any judgment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"08cdb87e-f7e0-418d-98c0-f4ab32e72341\"}":{"__typename":"School","uuid":"08cdb87e-f7e0-418d-98c0-f4ab32e72341","name":"Haverford High School","city":"Havertown","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19083"},"Education:{\"uuid\":\"17ac1437-b76f-49ae-b5e4-b6442de5b1df\"}":{"__typename":"Education","uuid":"17ac1437-b76f-49ae-b5e4-b6442de5b1df","school":{"__ref":"School:{\"uuid\":\"08cdb87e-f7e0-418d-98c0-f4ab32e72341\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"7f28d227-de96-41d5-a892-9245f7f24ddf\"}":{"__typename":"Education","uuid":"7f28d227-de96-41d5-a892-9245f7f24ddf","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Ecology, Evolution, and Organismal Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"e7e88588-6161-440f-9c8e-3014ead0248c\"}":{"__typename":"MentorPublicProfile","uuid":"e7e88588-6161-440f-9c8e-3014ead0248c","displayName":"Katya S.","slug":"katya-scott","biography":"\u003cp\u003eHi! My name is Katya and I am a junior at Brown University. I am studying Ecology, Evolution, and Organismal Biology (it's a mouthful, I know) and am hoping to pursue a career in wildlife conservation or veterinary medicine. I love being outside and spending time with animals! I am from Philadelphia, PA, and although I love the city, I have found ways to appreciate nature since I was young.  \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to being a Curious Cardinals mentor, I also work part-time as a veterinary technician assistant at Brown's Center for Animals Resources and Education (CARE). I am also the Logistics Coordinator for a student-led, campus-based food distribution program called the Brown Market Shares Program. We partner with local farms to bring weekly produce to the Brown community in an effort to combat food insecurity and promote sustainable food practices! It is something that I am super passionate about and am excited to continue working on during the rest of my time at Brown.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy cultural identity is a large part of who I am and how I interact with the world around me. My mom is Ukrainian and my dad is Black, and I highly value diversity and inclusion. I speak both Ukrainian and Spanish fluently and would love to learn another language soon! In my free time, I enjoy reading, exercising, listening to music, and spending time with my friends and family. Finally, I love connecting with kids and making sure that they feel supported as they move throughout life. It can be challenging to navigate the world as a young person today, and I am excited to build meaningful relationships as we all continue to grow together :)\u003c/p\u003e","teachingVideoPlaybackId":"u7JZHz23ZPbd02hz6hQne95wQjk9UT6EPmzrmhAgQ00Qo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7063e764-1c3e-4f2f-a665-0f63a0a2a25f\"}"},{"__ref":"Favorites:{\"uuid\":\"cfd1b093-2e5f-4082-9172-8df2b0b181a5\"}"},{"__ref":"Favorites:{\"uuid\":\"ba0eae9d-b4b3-4246-9706-a6afcff46fca\"}"}],"causesSupported":[],"major":"Ecology, Evolution, and Organismal Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"201538d3-3fd7-4cb2-89a5-827fb50bda50\"}"},{"__ref":"DeepDives:{\"uuid\":\"de3eebab-bd7a-44cd-a708-39696287a968\"}"},{"__ref":"DeepDives:{\"uuid\":\"683ff138-57fe-44e8-bbc0-1052caf146d2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/38468247-e6a4-48f7-a796-33b49a7d3600/-/preview/-/format/jpg/","https://ucarecdn.com/a92658b6-1ee3-4d75-aba8-2e23f4f4be39/-/preview/-/format/jpg/","https://ucarecdn.com/a3d88eb4-62fd-49d1-a57d-b661d77475dd/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"17ac1437-b76f-49ae-b5e4-b6442de5b1df\"}"},{"__ref":"Education:{\"uuid\":\"7f28d227-de96-41d5-a892-9245f7f24ddf\"}"}],"hiredAt":"2024-09-26T13:21:28.903Z","topics":["Spanish","STEM Project","6-8 Grade Science","Sustainability","World Cultures","Race \u0026 Ethnicity","Reading","Writing","Executive Function","Public Speaking"],"communityBadg
