73-e7bab4bf6f85\"}":{"__typename":"DeepDives","uuid":"5361ac0e-4f26-4a73-9073-e7bab4bf6f85","content":null,"videoPlaybackId":"rlHy00tGuo1gR3PzFn6Q6stJMgtDu5hxXoqGsa4k3Cok","question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"80f3d60b-b267-4e6b-879e-c2447df1b633\"}":{"__typename":"School","uuid":"80f3d60b-b267-4e6b-879e-c2447df1b633","name":"Western School of Technology \u0026 Environmental Science","city":"Catonsville","type":"HIGH","state":"Maryland","country":"United States","zip":"21228"},"Education:{\"uuid\":\"e5c9f250-0fa6-421a-82fd-0f45e0ed9339\"}":{"__typename":"Education","uuid":"e5c9f250-0fa6-421a-82fd-0f45e0ed9339","school":{"__ref":"School:{\"uuid\":\"80f3d60b-b267-4e6b-879e-c2447df1b633\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"6adad7a9-3fe9-41be-a15e-4aea6e4369bd\"}":{"__typename":"Education","uuid":"6adad7a9-3fe9-41be-a15e-4aea6e4369bd","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"28144d7c-8d9f-4340-a770-20168dbea84b\"}":{"__typename":"MentorPublicProfile","uuid":"28144d7c-8d9f-4340-a770-20168dbea84b","displayName":"Tijesunimi B.","slug":"tijesunimi-borode","biography":"\u003cp\u003eHi! My name is Tijesunimi “Tijesu” Borode, and I am a Class of 2024 graduate from Harvard University with a Bachelor’s degree in Neuroscience, a secondary concentration in Global Health and Health Policy, and a language citation in Yoruba.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am passionate about learning new things and find the opportunity to discover new concepts exciting and rewarding! As the eldest daughter of 3, I always could “read” people and get a gauge for what might be on someone's mind at any given moment, but as I grew older, I found myself wondering, “Why do people think the way that they do?”. This curiosity, coupled with my early introduction to neuroanatomy, fueled a deep interest in Psychology and its various applications. Shows like “Brain Games” and books like “Animal Farm” further pushed this interest, leading me to study neuroscience in college on the Mind, Brain, and Behavior thesis track.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to my studies, I was very involved on my campus, taking leadership roles in organizations such as the Nigerian Students Association and the Black Premedical Society while throwing myself into Model Congress, the Global Alliance for Medical Innovation, and various research opportunities. I’ve had the chance to not only meet amazing people but also to be a part of various projects and witness firsthand the importance of collaboration, research, and planning for the success of any endeavor.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love watching video essays on niche topics, full-length retrospectives, and analyses of TV shows and movies, reading books, traveling, and listening to music in my free time.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve found my most enjoyable moments to be ones in which I am doing something that I find fulfilling, so I have made it a goal to help those around me in their journeys to a similar feeling. As a Nigerian-American, I have a deep faith in the idea that there are many roads one can take along one’s journey, and I look forward to discovering my roads! I plan to work in consulting post-grad and have long-term aspirations to attain a PhD!\u003c/p\u003e\
