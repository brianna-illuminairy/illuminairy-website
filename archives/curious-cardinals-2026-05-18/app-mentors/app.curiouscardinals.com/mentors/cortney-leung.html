xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3417d69b-0a69-4132-a5ff-82b0529e2dee\"}":{"__typename":"Favorites","uuid":"3417d69b-0a69-4132-a5ff-82b0529e2dee","photoUrl":"https://ucarecdn.com/59897b16-d23f-46eb-956c-b5e051ffa404/","title":"Field Hockey","type":"SPORT"},"Favorites:{\"uuid\":\"4f4eeeb9-df58-48f3-9a00-ff47fef7f23e\"}":{"__typename":"Favorites","uuid":"4f4eeeb9-df58-48f3-9a00-ff47fef7f23e","photoUrl":"https://ucarecdn.com/292dd2ee-0a26-42da-905e-19f2b9a78c7a/","title":"Crazy Rich Asians","type":"MOVIE"},"Favorites:{\"uuid\":\"4ef3a4c3-51a0-4a1d-b3e9-564330cd7777\"}":{"__typename":"Favorites","uuid":"4ef3a4c3-51a0-4a1d-b3e9-564330cd7777","photoUrl":"https://ucarecdn.com/2e758312-a0a8-47a3-9593-20ef97b33635/","title":"Hong Kong","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8bf01a09-b3d6-47a0-9685-8b3249cff4b3\"}":{"__typename":"DeepDives","uuid":"8bf01a09-b3d6-47a0-9685-8b3249cff4b3","content":"\u003cp\u003eI would tell my high school self that everything always works out in the end. It is important to always try your best and try to complete even the hardest tasks with a smile. In the end, what is meant for you will come to you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7f84524b-603d-4a22-91de-5725f231b4fa\"}":{"__typename":"DeepDives","uuid":"7f84524b-603d-4a22-91de-5725f231b4fa","content":"\u003cp\u003eI chose to major in Nursing because it fit with the type of person I am. I always cared deeply about others and wanted others to reach the fullest potential. As the first person in the medical field in my family, I would be able to help answer questions and care for my family and friends with the proper education. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"65265f6b-2419-4559-985d-7ea16f728d7c\"}":{"__typename":"DeepDives","uuid":"65265f6b-2419-4559-985d-7ea16f728d7c","content":"\u003cp\u003eMy greatest source of inspiration would have to be my parents. As immigrants, they sacrificed so much and worked incredibly hard to get me where I am today. Their determination, resilience, and unwavering support have shaped who I am today and continue to motivate me everyday. I want to make them proud and be in a position to be able to support them with whatever goals or dreams they may have had to put on hold. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a634e920-09b1-4d56-9c7e-6efc2166893d\"}":{"__typename":"DeepDives","uuid":"a634e920-09b1-4d56-9c7e-6efc2166893d","content":"\u003cp\u003eI hope to start my own business one day! Whether it is a business that could change the world or just a small bakery and flower shop, I want to be able to build something from scratch and call it. my own. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"552501ff-019d-4b50-a9e5-76a530148910\"}":{"__typename":"School","uuid":"552501ff-019d-4b50-a9e5-76a530148910","name":"Weston High School","city":"Weston","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02493"},"Education:{\"uuid\":\"898c3cd7-850d-452f-b3e5-da601ec4fe8d\"}":{"__typename":"Education","uuid":"898c3cd7-850d-452f-b3e5-da601ec4fe8d","school":{"__ref":"School:{\"uuid\":\"552501ff-019d-4b50-a9e5-76a530148910\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"8cbb0304-6850-41f9-a525-5a6f44816093\"}":{"__typename":"Education","uuid":"8cbb0304-6850-41f9-a525-5a6f44816093","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Nursing","degree":null},"MentorPublicProfile:{\"uuid\":\"f1fe5d0a-2468-4a46-9df0-371736e9119e\"}":{"__typename":"MentorPublicProfile","uuid":"f1fe5d0a-2468-4a46-9df0-371736e9119e","displayName":"Cortney L.","slug":"cortney-leung","biography":"\u003cp\u003eHello! My name is Cortney Leung and I am a nursing student at the University of Pennsylvania.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was born and raised in a small town just outside of Boston. I spent my childhood participating in a wide variety of activities - from tennis, field hockey, and dance to archery, piano, and violin. I’ve always loved trying new things and staying active, and that curiosity has carried into all aspects of my life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my greatest joys is traveling. I've been fortunate enough to explore many parts of the world, including Europe, Asia, and Australia. While I enjoy learning about different cultures, I’ll admit that the food is always my favorite part of the journey. That love for food inspired my passion for baking and cooking. Whether I’m testing out a new sourdough recipe or recreating a dish I tried abroad, I find the kitchen to be one of the most comforting and creative spaces.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have always been passionate about helping and advocating for others. Throughout high school, I was deeply involved in leadership and advocacy. I served on the student government, student council, and I had the unique honor of being the student representative for my school district, even participating in the interview process for superintendent candidates as the advocate for students. I was also the proud captain of my field hockey team and was honored to be named Player of the Year in my league.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I love spending time outdoors, whether it's walking, running, biking, hiking, or just playing sports with friends. I also love to read, build puzzles and Lego, arrange flower bouquets, experiment with sourdough baking, and watch movies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have a strong work ethic and dedication to everything I commit to. As a mentor, I strive to make each session meaningful, engaging, and tailored to your child's unique learning style. My goal is to help students grow their skills, but also in their confidence.\u003c/p\u003e","teachingVideoPlaybackId":"ThxDypTCGLIc8FbxVCoAv6o2irvfCOcN4i01qemRAHf4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3417d69b-0a69-4132-a5ff-82b0529e2dee\"}"},{"__ref":"Favorites:{\"uuid\":\"4f4eeeb9-df58-48f3-9a00-ff47fef7f23e\"}"},{"__ref":"Favorites:{\"uuid\":\"4ef3a4c3-51a0-4a1d-b3e9-564330cd7777\"}"}],"causesSupported":[],"major":"Nursing","deepDive
