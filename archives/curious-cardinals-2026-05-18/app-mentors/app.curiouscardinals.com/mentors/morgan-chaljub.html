xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cbfde4c6-9f77-4ae9-bbfc-8e0796ba96b0\"}":{"__typename":"DeepDives","uuid":"cbfde4c6-9f77-4ae9-bbfc-8e0796ba96b0","content":"\u003cp\u003eFun fact about me is that I’m from an island in Texas. Growing up, I always loved spending time outdoors, especially at the beach! In my free time, I enjoy trying new activities, hanging out with friends, and traveling to new places. In college, my active lifestyle even led me to work at a Pure Barre fitness studio. Going to undergrad in Chicago, some of my favorite activities were walking along Lake Michigan, going to Cubs games, and exploring different neighborhoods and restaurants.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f4a7b88a-4f89-44e7-bf41-2b74fbc0b3ff\"}":{"__typename":"DeepDives","uuid":"f4a7b88a-4f89-44e7-bf41-2b74fbc0b3ff","content":"\u003cp\u003eI chose to major in Neuroscience and Global Health because I wanted to understand both the biology of the brain and the bigger systems that shape people’s health. Neuroscience let me dive into questions about memory, the brain’s intricate communication with the body, and the hidden pathways that drive behavior and health. Global Health pushed me to think about access to care and community well-being. Together, they gave me a balance of science and real-world impact that I knew would prepare me for medicine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"b80521ce-552b-4833-9ba0-161406ee4b0f\"}":{"__typename":"DeepDives","uuid":"b80521ce-552b-4833-9ba0-161406ee4b0f","content":"\u003cp\u003eIn high school, I balanced academics with sports, playing varsity and club volleyball during the year. My summers were spent working with Galveston Island Beach Patrol as a certified lifeguard, where I gained experience in emergency response and teaching water safety to beachgoers. I liked working in my community, whether that meant organizing a back-to-school review after the pandemic, serving as the high school representative on the Vision Galveston steering committee, or planning beach cleanups to keep the island I grew up on safe. Those experiences taught me responsibility, teamwork, and how much I enjoyed bringing people together to make a difference.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"feeffb6f-a32d-4f49-bd84-70a7fe092c70\"}":{"__typename":"School","uuid":"feeffb6f-a32d-4f49-bd84-70a7fe092c70","name":"Ball High School","city":"Galveston","type":"HIGH","state":"Texas","country":"United States","zip":"77550"},"Education:{\"uuid\":\"0da22c31-f388-4be4-ab1e-cb6958687c76\"}":{"__typename":"Education","uuid":"0da22c31-f388-4be4-ab1e-cb6958687c76","school":{"__ref":"School:{\"uuid\":\"feeffb6f-a32d-4f49-bd84-70a7fe092c70\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"1296c4b1-8cbf-4361-a6b2-c721005541a3\"}":{"__typename":"Education","uuid":"1296c4b1-8cbf-4361-a6b2-c721005541a3","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Neuroscience ","degree":null},"MentorPublicProfile:{\"uuid\":\"3f45964f-a146-45d9-81c3-5aa6adc9c3ec\"}":{"__typename":"MentorPublicProfile","uuid":"3f45964f-a146-45d9-81c3-5aa6adc9c3ec","displayName":"Morgan C.","slug":"morgan-chaljub","biography":"\u003cp\u003eHi! I'm Morgan, and I recently graduated from Northwestern University with a B.A. in Neuroscience and Global Health. Some courses I especially enjoyed were \u003cem\u003eGlobal Bioethics\u003c/em\u003e, \u003cem\u003eDevelopmental Neuroscience\u003c/em\u003e, and \u003cem\u003eSpinal Cord Injury, Regeneration, and Recovery\u003c/em\u003e. I also loved exploring other fields through classes like \u003cem\u003eThe Secrets of Hispanic Gastronomy \u003c/em\u003eand \u003cem\u003eMusic and Dance\u003c/em\u003e. Exploring different subjects has been one of my favorite parts of learning because it strengthened my passion for science while also challenging me to think in new ways.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Northwestern, I worked as a research assistant in a neuroscience lab, where I studied brain circuits involved in stress and mentored younger students on experiments and analysis. Beyond the lab, I organized cognitive activities for patients with neurological disorders like Alzheimer's disease and dementia. In addition, I served as Vice President of the Pre-Surgical Society, where I co-led a health literacy workshop at a local elementary school and helped led volunteer opportunities for students. Teaching health concepts in simple, engaging ways showed me how education can empower young students to take charge of their well-being. I also expanded this focus on community health by designing projects that addressed food insecurity and mental health. Through a Zero Hunger Campaign, I connected students with campus food resources and organized efforts to repurpose dining hall food for the local community.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTeaching and mentorship have always been central to my work. I tutored in a before-school program supporting middle schoolers and mentored pre-medical students at Northwestern. This past year, I worked as a Patient Champion and helped older adults navigate barriers to medication access and insurance services. Across these roles, I learned how to adapt my communication to different ages and needs, which is a skill I bring into every mentoring session.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am passionate about mentoring students in the sciences, especially biology and neuroscience. Having just applied to medical school, I understand what it’s like to navigate the pre-health path in high school and college. I support students by helping them tackle challenging coursework, find volunteer and project opportunities, and set long-term goals. I also specialize in guiding pre-med and STEM passion projects, helping students turn their interests into meaningful, hands-on work outside the classroom.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I love being outside and trying new activities! I enjoy playing pickleball, spending time in the ceramics studio, or visiting new coffee shops with friends. I've found that balancing academics and extracurriculars is key for long-term success, and it's a lesson I encourage my students to practice too.\u003c/p\u003e","teachingVideoPlaybackId":"F02sOChs38a5Z02AOLGgnBprfvG00dYOwT8MREH8wl2Jgw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cbfde4c6-9f77-4ae9-bbfc-8e0796ba96b0\"}"},{"__ref":"DeepDives:{\"uuid\":\"f4a7b88a-4f89-44e7-bf41-2b74fbc0b3ff\"}"},{"__ref":"DeepDives:{\"uuid\":\"b80521ce-552b-4833-9ba0-161406ee4b0f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/08fc07a4-53ec-4146-89cd-0bc293918693/-/preview/-/format/jpg/","https://ucarecdn.com/8ce0fec7-d16d-442d-9462-b04fc17504e3/-/preview/-/format/jpg/","https://ucarecdn.com/d5e9e2eb-688e-41ae-bceb-e7a50988d64d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0da22c31-f388-4be4-ab1e-cb6958687c76\"}"},{"__ref":"Education:{\"uuid\":\"1296c4b1-8cbf-4361-a6b2-c721005541a3\"}"}],"hiredAt":"2025-09-21T18:34:03.715Z","topics":["Algebra I","Algebra II","Pre-Algebra","Biology","Spanish","K-6 Storybook","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"morgan-chaljub\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3f45964f-a146-45d9-81c3-5aa6adc9c3ec\"}"}}},"_sentryTraceData":"d1e4795717b14d23aed154e874cf9d88-9eb67bdc47e857f8-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d1e4795717b14d23aed154e874cf9d88,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"morgan-chaljub"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.sta
