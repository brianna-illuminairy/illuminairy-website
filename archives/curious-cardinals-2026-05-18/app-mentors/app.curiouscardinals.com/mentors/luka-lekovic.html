chose Mathematics because I love problem solving, from logic puzzles and brain teasers to science topics and math problems. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"4baa679a-111f-4eaf-8215-3c84abb31312\"}":{"__typename":"DeepDives","uuid":"4baa679a-111f-4eaf-8215-3c84abb31312","content":"\u003cp\u003eAt multiple crossroads in my life, I have leaned on the advice of mentors to open my eyes to new horizons, and I hope to pass that guidance on the future students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"8c759b4c-125d-48bc-bd95-a62522e0e975\"}":{"__typename":"School","uuid":"8c759b4c-125d-48bc-bd95-a62522e0e975","name":"Loyola High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90006"},"Education:{\"uuid\":\"b0881fed-bbcb-40a1-b523-8f2728010077\"}":{"__typename":"Education","uuid":"b0881fed-bbcb-40a1-b523-8f2728010077","school":{"__ref":"School:{\"uuid\":\"8c759b4c-125d-48bc-bd95-a62522e0e975\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"236b41df-9b7c-4a20-8fd1-ee21c7f44625\"}":{"__typename":"Education","uuid":"236b41df-9b7c-4a20-8fd1-ee21c7f44625","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"657cf44f-022a-45fa-9c07-8060091589b9\"}":{"__typename":"MentorPublicProfile","uuid":"657cf44f-022a-45fa-9c07-8060091589b9","displayName":"Luka L.","slug":"luka-lekovic","biography":"\u003cp\u003eHello! My name is Luka, and I recently graduated from the University of Pennsylvania, where I majored in Mathematics. This year, I am continuing my academic journey at Penn by pursuing a Master’s degree in Applied Math and Computational Science, with a special focus on Machine Learning. My time at Penn has been a journey of exploration and discovery, particularly through my research in generative deep learning, where I’ve delved into applications in biology and language modeling.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore college, I graduated Summa Cum Laude from Loyola High School and scored a 35 on the ACT. During those years, I balanced my academic pursuits with a passion for athletics, competing on the swim and water polo teams.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eInterestingly, when I first arrived at Penn, my plan was to major in Philosophy—a subject that still holds a special place in my heart. However, my trajectory changed when a mentor of mine convinced me to take a certain applied math class. This course helped me see the beauty and practicality of Mathematics, particularly its applications in statistics and machine learning. This unexpected shift opened up a new world for me, blending logical reasoning with real-world problem-solving, and I hope to pass this mentorship and passion for learning on to future students.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academics, I have always sought balance in my life. At Penn, I was a member of the club Rugby team, which allowed me to stay active and engaged outside the classroom. I also love playing chess, reading good books, and teaching—it is incredibly rewarding to help others navigate their own academic journeys and discover the excitement in learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to working with you, sharing my knowledge and experiences, and helping you achieve your academic goals.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a98a437a-5e3e-40d6-8eaa-064fdb19aef5\"}"},{"__ref":"DeepDives:{\"uuid\":\"506462f5-41a7-4586-9832-fab4c9c6b0c0\"}"},{"__ref":"DeepDives:{\"uuid\":\"6c007198-fe60-4d82-896d-e711cdd21374\"}"},{"__ref":"DeepDives:{\"uuid\":\"4baa679a-111f-4eaf-8215-3c84abb31312\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a95bc9ed-963c-4cae-a333-4ae6bc84e41a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b0881fed-bbcb-40a1-b523-8f2728010077\"}"},{"__ref":"Education:{\"uuid\":\"236b41df-9b7c-4a20-8fd1-ee21c7f44625\"}"}],"hiredAt":"2024-08-27T21:00:40.490Z","topics":["Coding / Programming","Machine Learning / AI","Statistics","Physics","Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"luka-lekovic\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"657cf44f-022a-45fa-9c07-8060091589b9\"}"}}},"_sentryTraceData":"52ac64977a094dea890769ea8c5af471-a2c662671b531572-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=52ac64977a094dea890769ea8c5af471,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page"
