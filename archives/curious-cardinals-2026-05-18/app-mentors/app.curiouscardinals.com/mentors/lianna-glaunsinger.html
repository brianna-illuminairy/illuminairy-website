xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"26f073fe-b2ed-4fe9-adad-da4051d095f4\"}":{"__typename":"Favorites","uuid":"26f073fe-b2ed-4fe9-adad-da4051d095f4","photoUrl":"https://ucarecdn.com/a19c9808-774d-47ac-8904-055b73a89be6/","title":"folklore","type":"ALBUM"},"Favorites:{\"uuid\":\"82904438-da1f-4d3f-bc3b-fe8ac9b4041f\"}":{"__typename":"Favorites","uuid":"82904438-da1f-4d3f-bc3b-fe8ac9b4041f","photoUrl":"https://ucarecdn.com/9d19a2de-bc1c-4fca-848e-fc0c35b108a0/","title":"Le Fabuleux Destin d'Amelie Poulain","type":"MOVIE"},"Favorites:{\"uuid\":\"a3750ddc-4f22-4a70-a7d7-666fa8d14fbb\"}":{"__typename":"Favorites","uuid":"a3750ddc-4f22-4a70-a7d7-666fa8d14fbb","photoUrl":"https://ucarecdn.com/36092484-7a3b-4490-a306-a08ab0962e71/","title":"Coco Gauff","type":"ATHLETE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"81307d8c-c5cf-4e64-af4f-484d20634a9c\"}":{"__typename":"DeepDives","uuid":"81307d8c-c5cf-4e64-af4f-484d20634a9c","content":"\u003cp\u003eI would love to be a political officer for the US Foreign Service. Though the prospect of moving countries every few years may sound daunting to many, I would relish the opportunity to experience new cultures and environments. The challenges of working in complex and often unpredictable political environments can be demanding, but I believe they also offer immense personal growth. I'm constantly seeking ways to make a tangible positive social impact, and a position as a political officer is a powerful way to promote global peace and stability.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b5d9eb09-7ebe-4427-98fc-464525917e03\"}":{"__typename":"DeepDives","uuid":"b5d9eb09-7ebe-4427-98fc-464525917e03","content":"\u003cp\u003eI’m the kind of person who thrives on staying busy! Even during the summertime, I can never sit still. I love exploring different career paths, so I’ve spent my summers diving into internships and shadowing opportunities.\u003c/p\u003e\u003cp\u003eDuring the COVID lockdowns in my freshman summer, I volunteered as a dispatcher for an organization that delivered food to underserved communities. The next summer, I juggled two roles—working as a news reporter for the Daily Californian (UC Berkeley's student newspaper) while interning at my local councilmember's office. For the next two years, I was the lead intern at the Berkeley Mayor's Office, where I coordinated statewide anti-discrimination campaigns and conducted legislative research.\u003c/p\u003e\u003cp\u003eWhen I wasn’t working, I was off on adventures with my family, often hiking and camping through the Arizona mountains with my grandparents during vacation weeks.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"a5d49209-c043-4a3b-8e85-9ffe7f85c8b0\"}":{"__typename":"DeepDives","uuid":"a5d49209-c043-4a3b-8e85-9ffe7f85c8b0","content":"\u003cp\u003eI’m a firm believer that mentorship is a two-way street. When I teach, I’m not just sharing my knowledge—I’m also learning from my students and gaining new insights into the material. During the school year, it’s easy to get caught up in the details of my academic focus, but breaking down complex subjects for others helps me step back and see the bigger picture. It’s a rewarding way to deepen my own understanding while helping others grow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"377d7653-f87b-4f5e-bd37-781b2d1c44cd\"}":{"__typename":"School","uuid":"377d7653-f87b-4f5e-bd37-781b2d1c44cd","name":"Berkeley High School","city":"Berkeley","type":"HIGH","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"989f607c-a84d-4774-b877-4d84397ea738\"}":{"__typename":"Education","uuid":"989f607c-a84d-4774-b877-4d84397ea738","school":{"__ref":"School:{\"uuid\":\"377d7653-f87b-4f5e-bd37-781b2d1c44cd\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"903bd5e9-8143-47d9-85be-7d07118dffee\"}":{"__typename":"Education","uuid":"903bd5e9-8143-47d9-85be-7d07118dffee","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"International Relations","degree":null},"Testimonial:90344816-f9b1-4b07-93e0-d6ebce854f6e":{"__typename":"Testimonial","id":"90344816-f9b1-4b07-93e0-d6ebce854f6e","text":"Lianna has been an incredible mentor—like an older sibling our daughter never had. She’s helped our daughter start navigating challenges with confidence and embrace new ones, especially when school guidance fell short. Curious Cardinals, and Lianna in particular, have been invaluable in preparing her not just for college, but for life. We highly recommend Lianna and Curious Cardinals to any family seeking a compassionate and intelligent mentor who genuinely empowers children to believe in themselves.","date":"2025-08-19 22:24:19.343+00","rating":5,"endorser":{"__typename":"Endorser","name":"Sanjit Mandal","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"1e4df66f-4abb-43cd-b007-0f2bc2ce2e39\"}":{"__typename":"MentorPublicProfile","uuid":"1e4df66f-4abb-43cd-b007-0f2bc2ce2e39","displayName":"Lianna L.","slug":"lianna-glaunsinger","biography":"\u003cp\u003eHi! I’m Lianna, a second-year student at Stanford studying International Relations and Human Rights. One of my greatest passions is criminal justice reform—a journey which began with a transformative visit to San Quentin Prison in the Bay Area a few years ago. Since then, my focus has broadened from examining the American criminal justice system to combating global injustices.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis past summer, I worked with International Bridges to Justice, a nonprofit dedicated to protecting basic legal rights in developing countries. As a research intern, I supported teams working on the ground to ensure that individuals facing criminal charges receive fair trials, competent legal representation, and protection from torture—essential safeguards in the fight for human dignity. My passion for international affairs is matched by my interest in world history and cultures—I love traveling, and had the awesome opportunity to visit six countries this summer alone!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs an activist, I believe in the power of storytelling to drive social change. Through investigative journalism, I’ve shed light on critical issues in my community, from a failing Title IX system to the mistreatment of female athletes and the rise of anti-Asian American hate. In 2021, my award-winning editorial exposed the lack of resources dedicated to combating sexual harassment in my school district—a cause that remains close to my heart.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond journalism, my creative spirit thrives in writing fantasy fiction, even if my novels remain tucked away in a drawer for now. When I’m not immersed in my studies or working on a new project, you’ll find me at the piano, with a watercolor brush in hand, or running along nearby trails. Staying active is my go-to way to decompress, and I’m currently training for a triathlon—another adventure I can’t wait to tackle.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI look forward to seeing what projects we create together!\u003c/p\u003e","teachingVideoPlaybackId":"q4VJseZHzMxmwOgiOBldvCtYnw8cnFtDGe3sYoBtb8c","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"26f073fe-b2ed-4fe9-adad-da4051d095f4\"}"},{"__ref":"Favorites:{\"uuid\":\"82904438-da1f-4d3f-bc3b-fe8ac9b4041f\"}"},{"__ref":"Favorites:{\"uuid\":\"a3750ddc-4f22-4a70-a7d7-666fa8d14fbb\"}"}],"causesSupported":[],"major":"International Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"81307d8c-c5cf-4e64-af4f-484d20634a9c\"}"},{"__ref":"DeepDives:{\"uuid\":\"b5d9eb09-7ebe-4427-98fc-464525917e03\"}"},{"__ref":"DeepDives:{\"uuid\":\"a5d49209-c043-4a3b-8e85-9ffe7f85c8b0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dd2ccaf6-a063-4317-afa1-8fe7fee49cf9/-/preview/-/format/jpg/","https://ucarecdn.com/c9b2568e-6602-41f4-8a65-eba5beb09355/-/preview/-/format/jpg/","https://ucarecdn.com/9fed7dd2-9c49-4852-adee-9fba8e0403f6/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"989f607c-a84d-4774-b877-4d84397ea738\"}"},{"__ref":"Education:{\"uuid\":\"903bd5e9-8143-47d9-85be-7d07118dffee\"}"}],"hiredAt":"2024-08-30T11:41:22.829Z","topics":["Music","Law / Government / Policy","Journalism","World Cultures","Public Speaking","Writing"],"communityBadges":["https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-224962
