"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8f11fb6c-e3f1-4a50-ad36-bca497c11669\"}":{"__typename":"DeepDives","uuid":"8f11fb6c-e3f1-4a50-ad36-bca497c11669","content":"\u003cp\u003ePainting, building Legos with my little brother, watching reality tv, and spending time with my furballs.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"c6bcc114-5e06-461a-a530-c9199eaee7ec\"}":{"__typename":"School","uuid":"c6bcc114-5e06-461a-a530-c9199eaee7ec","name":" ","city":" ","type":"HIGH","state":" ","country":" ","zip":" "},"Education:{\"uuid\":\"a6a3f995-edb5-4e82-897a-336f3e0f16af\"}":{"__typename":"Education","uuid":"a6a3f995-edb5-4e82-897a-336f3e0f16af","school":{"__ref":"School:{\"uuid\":\"c6bcc114-5e06-461a-a530-c9199eaee7ec\"}"},"startYear":" ","endYear":" ","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"8a081885-f30d-4076-8e05-b2bc3f225a9a\"}":{"__typename":"Education","uuid":"8a081885-f30d-4076-8e05-b2bc3f225a9a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Management Science \u0026 Engineering","degree":"B.A."},"MentorPublicProfile:{\"uuid\":\"c5ee4981-1c5c-4fe2-9394-6e40ff73684c\"}":{"__typename":"MentorPublicProfile","uuid":"c5ee4981-1c5c-4fe2-9394-6e40ff73684c","displayName":"Seth H.","slug":"lee-qin","biography":"\u003cp\u003eHi there! I'm an undergraduate at Stanford University majoring in Management Science and Engineering. Though I am currently based in California, I have had the opportunity to spend my childhood in the beautiful city of Shanghai, China and become fluent in Chinese.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy first love in life was definitely math, as I was supposedly obsessed with numbers before I could even speak. My passion drove me to self study my way up the math curriculum in and outside of class from childhood to high school. Today, I am captivated by the endless applications in various industries and find immense joy in unraveling the complexities of STEM subjects.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of STEM, my love for learning extends to various other areas such as writing and rhetoric, public speaking, art, and the social sciences. Having consistently placed atop various disciplines from literature to economics over 5 years as President of Academic Decathlon, I am happy to not only help students grasp key concepts but also foster a genuine passion for learning and exploration.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHaving launched various organizations and personal projects such as interscholastic speech \u0026amp; debate and mock trial in addition to being President of two social advocacy groups, all while navigating through the academic rigors of IB and AP before graduating as valedictorian, I understand the challenges students face firsthand. As your mentor, I'm here to offer guidance, support, and personalized strategies to help you achieve your personal and academic goals. Beyond academics, I'm committed to nurturing personal growth by sharing experiences in leadership, problem-solving, and more soft skills that will go a long way. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe that education is not merely about the acquisition of knowledge but also about empowering individuals to realize one's full potential and cultivating essential skills that will take you far in life. Through collaboration, patience, and a holistic approach to learning, I'm dedicated to helping you succeed in and outside of school. I look forward to embarking on this journey with you together!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"EeItMJT02zbGj4I02JR1USDv66HFLwhh63c01cYAU02aJls","teachingVideoDescription":null,"greatestAchievement":"\u003cbr\u003e","favorites":[],"causesSupported":[],"major":"Management Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d54a6653-4dfb-4e42-acae-8ae93c20ce69\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd30305f-3294-4382-99e7-316b942f58d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"2b01d7aa-cfb3-45d8-987e-822b9ac33887\"}"},{"__ref":"DeepDives:{\"uuid\":\"8f11fb6c-e3f1-4a50-ad36-bca497c11669\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/255451b4-ea98-4c9b-b70b-8b147647719c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a6a3f995-edb5-4e82-897a-336f3e0f16af\"}"},{"__ref":"Education:{\"uuid\":\"8a081885-f30d-4076-8e05-b2bc3f225a9a\"}"}],"hiredAt":"2024-02-22T00:58:11.666Z","topics":["History Project","Literature","Algebra I","Algebra II","Calculus","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Statistics","Writing","Mandarin Chinese","Physics","Chemistry","STEM Project","Biology","6-8 Grade Science","Computer Science","Coding / Programming","Academic Coaching","Executive Function","Visual Arts / Graphic Design"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lee-qin\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c5ee4981-1c5c-4fe2-9394-6e40ff73684c\"}"}}},"_sentryTraceData":"771db766d21643bdbeb7b206447df88b-85654f25d5f3210a-1","_sentryBaggage":"
