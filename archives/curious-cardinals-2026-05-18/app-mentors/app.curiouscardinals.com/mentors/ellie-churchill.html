xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1dbe768b-e6d3-4c28-b2cb-f697778d1a2b\"}":{"__typename":"DeepDives","uuid":"1dbe768b-e6d3-4c28-b2cb-f697778d1a2b","content":"\u003cp\u003eFind a why. I spent far too much time pushing myself purely for fear of failure, or a desire to prove my abilities. While I am grateful for the self discipline I built, I wasted so much time and energy on perfection when I could have done so much more if I just focused on my passions, self growth, and getting better at/learning more about what really matters to me, rather than creating a polished perception of myself for the world to see.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f37dddfd-ce53-4050-bbff-c8c0771354e4\"}":{"__typename":"DeepDives","uuid":"f37dddfd-ce53-4050-bbff-c8c0771354e4","content":"\u003cp\u003eI study psychology not just because it is intrinsically fascinating to me, but because I think it is perhaps the most applicable field out there. Everything we do in life involves not just other people but \u003cem\u003eour own brains. \u003c/em\u003eI hope to go to law school and apply what I've learned in psychology to that field, but understanding the inner functioning of yourself and others is vital to discovering the root causes of any larger societal issues. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"97ac3327-d7c6-4dac-8bce-252f322885bb\"}":{"__typename":"DeepDives","uuid":"97ac3327-d7c6-4dac-8bce-252f322885bb","content":"\u003cp\u003eI have a deep appreciation for spontaneity and adventure. I think I can give off a rather polished, put-together vibe, in a way that would make it seem as if I have my whole life planned out and structured. However, a lot of my best moments are in that last minute trip I decided to take and was unprepared for, or that time I dropped myself in a city to explore with no plans nor knowledge of my surroundings, etc. I like a sense of stability, but I also love to interrupt it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"332be498-079e-483b-9115-1ac7f96ffaf6\"}":{"__typename":"DeepDives","uuid":"332be498-079e-483b-9115-1ac7f96ffaf6","content":"\u003cp\u003eA deep sense of trust in myself. Like everyone else, I have moments where I doubt my abilities or feel unsure. But, on a grander scale I trust myself to be strong through hard times, to figure out ways around, out of, and through sticky situations, and to stay true to my values. I did not always feel this way so I am proud of getting to this point, as trusting myself allows me to give to others. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"26b4498a-2633-45e6-a6e0-99d87f97394a\"}":{"__typename":"School","uuid":"26b4498a-2633-45e6-a6e0-99d87f97394a","name":"Somerville High School","city":"Somerville","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02143"},"Education:{\"uuid\":\"e87f1085-b65b-49b5-bbb1-380f18c8a329\"}":{"__typename":"Education","uuid":"e87f1085-b65b-49b5-bbb1-380f18c8a329","school":{"__ref":"School:{\"uuid\":\"26b4498a-2633-45e6-a6e0-99d87f97394a\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"e5e1498e-d88c-4a77-b994-619ce97e6280\"}":{"__typename":"Education","uuid":"e5e1498e-d88c-4a77-b994-619ce97e6280","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Psychology","degree":null},"Testimonial:58e74f0d-bce9-4c67-93e8-60ff3dbd4f8b":{"__typename":"Testimonial","id":"58e74f0d-bce9-4c67-93e8-60ff3dbd4f8b","text":"We cannot say enough outstanding things about Ellie!  Our daughter was first hesitant about entering any mentoring program, but after her very first time of meeting Ellie, she was all in. Ellie has gone above and beyond our expectations of a mentor. She is so incredibly mature, but also knows how make my middle schooler feel comfortable. She is a unique combination of someone who is a gifted and observant listener, but also a strong leader who compassionately inspires and leads. I've also been very impressed by how she excels in keeping a big picture perspective while at the same time is conscientious about the details and being organized with each session. We are beyond grateful for Ellie, and feel so lucky that our daughter can be in under her mentorship.","date":"2025-05-25 20:04:40.542+00","rating":5,"endorser":{"__typename":"Endorser","name":"J Yoo","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"85f4a3cc-aa2c-477e-8135-576e79fd0b0f\"}":{"__typename":"MentorPublicProfile","uuid":"85f4a3cc-aa2c-477e-8135-576e79fd0b0f","displayName":"Ellie C.","slug":"ellie-churchill","biography":"\u003cp\u003eHi there! My name is Ellie Churchill. I am originally from the Boston area and now am an undergrad at Stanford University, studying Psychology and Human Biology. I am super interested in all things human behavior, and how these learnings can help us solve greater societal issues. I hope to get a law degree after graduating, as I am fascinated by using insights on the human brain for legal reforms. Right now, my degree is giving me tons of background social psychology, mindsets, motivation, value alignment and pathfinding, brain development, and everyday behavioral functioning. I would love to use what I have already learned (and learn in the future) to help people find motivation and figure out how to make school and life work for them. There is so much I wish I could tell my younger self on this front, and I'm incredibly passionate about bringing that energy to my mentees, complimented by personal experience and my academic background.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to psychology and its insights into executive functioning and pathfinding, I bring a strong background in all things social sciences and humanities, as well as math and science on some levels. I spent my freshman year at Stanford in a residential liberal arts program, where I learned immensely about philosophical reasoning, comprehending dense and ancient texts, and received tons of vigorous writing training. This experience provided tons of knowledge and experience about reading, writing in any subject (English, social sciences, college applications, etc.) and overall critical thinking.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eApart from academics, I am part of a research team studying the psychology of punishment in U.S. culture, the Stanford A.C.L.U. chapter, and Cardinal Ballet Company. I attribute tons of my personal growth and leadership skills to ballet, and it acts as a super important escape for me now. I also love enjoying local hikes, and spend a lot of time outside walking dogs for extra cash. Above all, I am fundamentally a people person and can't wait to meet new people through this experience. \u003c/p\u003e","teachingVideoPlaybackId":"oFaVwFR01kCUqhuvpZ013NAUdxvHSbFMOoQduPtrhjC02Q","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1dbe768b-e6d3-4c28-b2cb-f697778d1a2b\"}"},{"__ref":"DeepDives:{\"uuid\":\"f37dddfd-ce53-4050-bbff-c8c0771354e4\"}"},{"__ref":"DeepDives:{\"uuid\":\"97ac3327-d7c6-4dac-8bce-252f322885bb\"}"},{"__ref":"DeepDives:{\"uuid\":\"332be498-079e-483b-9115-1ac7f96ffaf6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/223cac1c-606f-4fb8-8088-658d43e6fcba/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"e87f1085-b65b-49b5-bbb1-380f18c8a329\"}"},{"__ref":"Education:{\"uuid\":\"e5e1498e-d88c-4a77-b994-619ce97e6280\"}"}],"hiredAt":"2025-02-19T19:59:09.510Z","topics":["Algebra I","Algebra II","Geometry","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:58e74f0d-bce9-4c67-93e8-60ff3dbd4f8b"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ellie-churchill\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"85f4a3cc-aa2c-477e-8135-576e79fd0b0f\"}"}}},"_sentryTraceData":"bf2c3afc4bca45b99846782f5659b46f-94bb235f0d696ba3-0","_sentryBaggage":"sentry-environment=vercel-product
