xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"cc4b7e10-8a0c-4ec0-ad53-cedf1db67ccc\"}":{"__typename":"DeepDives","uuid":"cc4b7e10-8a0c-4ec0-ad53-cedf1db67ccc","content":"\u003cp\u003eI really enjoy designing and coding video games. Currently, I am working on a mobile game publishing studio that I plan on launching next year.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"91aeb16d-4982-4dc2-84f7-9cbd495cce0c\"}":{"__typename":"DeepDives","uuid":"91aeb16d-4982-4dc2-84f7-9cbd495cce0c","content":"\u003cp\u003eI want to be a software engineer! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"d3c884ac-e87e-4b88-87a6-deb95ef91c16\"}":{"__typename":"DeepDives","uuid":"d3c884ac-e87e-4b88-87a6-deb95ef91c16","content":"\u003cp\u003eWhen I first started at Stanford I had never coded before. I am now applying for a masters in Computer Science, and a year after learning how to code, I got a CS internship at Google.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"5068f92d-3e10-45d0-ae6f-abab74dfd31f\"}":{"__typename":"DeepDives","uuid":"5068f92d-3e10-45d0-ae6f-abab74dfd31f","content":"\u003cp\u003eI would love to start my own company. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"b31ae597-6bc6-4dba-b699-bf3b19088c96\"}":{"__typename":"School","uuid":"b31ae597-6bc6-4dba-b699-bf3b19088c96","name":"King's College London Mathematics School","city":"London","type":"HIGH","state":"England","country":"United Kingdom","zip":"SE11 6NJ"},"Education:{\"uuid\":\"655814d5-a3e4-4cbb-b4a1-762912c4e84d\"}":{"__typename":"Education","uuid":"655814d5-a3e4-4cbb-b4a1-762912c4e84d","school":{"__ref":"School:{\"uuid\":\"b31ae597-6bc6-4dba-b699-bf3b19088c96\"}"},"startYear":"2019","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"dd10e8f0-077a-4c26-b560-152b3b2fee9e\"}":{"__typename":"Education","uuid":"dd10e8f0-077a-4c26-b560-152b3b2fee9e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2025","endYear":"2025","expectedGradYear":"2026","major":"Computer Science Masters","degree":"Bachelors of Science"},"MentorPublicProfile:{\"uuid\":\"7f409a26-fe28-4a5a-a34f-ee767dc6da3b\"}":{"__typename":"MentorPublicProfile","uuid":"7f409a26-fe28-4a5a-a34f-ee767dc6da3b","displayName":"Anya V.","slug":"anya-von-diessl","biography":"\u003cp\u003e\u003cstrong\u003eHello!\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm Anya. I’m originally from\u0026nbsp;\u003cstrong\u003eLondon, England\u003c/strong\u003e, and earned my\u0026nbsp;\u003cstrong\u003eB.S. in Mathematics from Stanford University\u003c/strong\u003e, where I’m now pursuing my\u0026nbsp;\u003cstrong\u003emaster’s in Computer Science at Stanford\u003c/strong\u003e. When I first started at Stanford, I had never written a single line of code. What began as a spark of curiosity turned into a deep love for problem-solving, creativity, and innovation through technology. My time at Stanford has been transformative, not just academically, but personally. It’s a place that has constantly pushed me to think critically, explore new frontiers, and connect math’s elegance with computer science’s practical impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne of the most meaningful parts of my journey has been becoming part of the\u0026nbsp;\u003cstrong\u003eStanford Women in Computer Science (WiCS)\u003c/strong\u003e\u0026nbsp;community. It’s an inspiring network that celebrates inclusion, mentorship, and empowerment in tech. One of my favorite moments was participating in a WiCS speaker series, where I shared insights about my path into technology and the lessons I’ve learned along the way. It reminded me how powerful representation and shared stories can be for students who are just beginning to find their place in STEM.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy passion for math and technology grew even stronger during my\u0026nbsp;\u003cstrong\u003einternship at Google\u003c/strong\u003e, where I worked on a\u0026nbsp;\u003cstrong\u003efraud detection system\u003c/strong\u003e\u0026nbsp;that combined creativity with technical precision. Using\u0026nbsp;\u003cstrong\u003eTypeScript, HTML, and CSS\u003c/strong\u003e, I built an intuitive user interface that helped streamline internal workflows. It was exhilarating to see my code translate into something that people used every day; a tangible reminder of how math, logic, and design can come together to solve real-world problems. That experience solidified my interest in human-centered technology and the beauty of using computation to make systems smarter and more efficient.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBack at Stanford, I’ve loved continuing this theme through teaching. As a\u0026nbsp;\u003cstrong\u003eCS105 Teaching Fellow\u003c/strong\u003e, I get to help students bridge theory with hands-on application, guiding them as they build their first websites and learn the art of debugging. Teaching has taught me patience, empathy, and how to meet students where they are. There’s something uniquely rewarding about watching a student’s eyes light up when a concept finally clicks.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond teaching, I’ve immersed myself in\u0026nbsp;\u003cstrong\u003eresearch\u003c/strong\u003e\u0026nbsp;that sits at the intersection of\u0026nbsp;\u003cstrong\u003eartificial intelligence, healthcare, and statistics\u003c/strong\u003e. Under\u0026nbsp;\u003cstrong\u003eProfessor Adeli’s research lab\u003c/strong\u003e, I explored\u0026nbsp;\u003cstrong\u003econfounder-free deep learning models for medical applications\u003c/strong\u003e, developing methods that improve model robustness and interpretability in clinical settings. This experience deepened my appreciation for the responsibility that comes with building AI systems, especially in healthcare, where the implications reach real people and their well-being. It also reaffirmed my belief that math is more than numbers; it’s a language for understanding complexity and uncovering truth in data.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBut where my heart truly lies is in\u0026nbsp;\u003cstrong\u003ementoring and education\u003c/strong\u003e. As a\u0026nbsp;\u003cstrong\u003eMathematics Tutor\u003c/strong\u003e\u0026nbsp;at Stanford's Center for Teaching and Learning, I’ve worked with students from all backgrounds to make math less intimidating and more empowering. I believe learning should feel like discovery, not obligation. Beyond Stanford, I’ve been developing a\u0026nbsp;\u003cstrong\u003ecomputer science curriculum for Curious Cardinals\u003c/strong\u003e, designed around creativity and exploration. My goal is to help students see code not as a barrier, but as a tool for self-expression and problem-solving.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeing part of the\u0026nbsp;\u003cstrong\u003eCurious Cardinals mentoring team\u003c/strong\u003e\u0026nbsp;feels like the perfect convergence of everything I care about: teaching, learning, and inspiring the next generation of thinkers. I love working with students who remind me of my younger self: curious, eager, and sometimes a bit uncertain. Guiding them as they gain confidence in their abilities is one of the most fulfilling parts of what I do.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEvery step of this journey, from London to Stanford, from math to machine learning, has taught me that growth happens when we embrace challenges and stay curious. I can’t wait to continue sharing my love for math, computer science, and mentorship with others, and to see where this ever-evolving journey leads next.\u003c/p\u003e","teachingVideoPlaybackId":"Qzlz7q6BNr00zkP5Izmb2raQJzhR4rXMESfWgFOYlxCM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science Masters","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cc4b7e10-8a0c-4ec0-ad53-cedf1db67ccc\"}"},{"__ref":"DeepDives:{\"uuid\":\"91aeb16d-4982-4dc2-84f7-9cbd495cce0c\"}"},{"__ref":"DeepDives:{\"uuid\":\"d3c884ac-e87e-4b88-87a6-deb95ef91c16\"}"},{"__ref":"DeepDives:{\"uuid\":\"5068f92d-
