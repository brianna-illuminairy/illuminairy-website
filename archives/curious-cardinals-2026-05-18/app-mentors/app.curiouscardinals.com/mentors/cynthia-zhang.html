xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ad1f6aba-90ef-43f1-8b77-fdb6adc67ad8\"}":{"__typename":"DeepDives","uuid":"ad1f6aba-90ef-43f1-8b77-fdb6adc67ad8","content":"\u003cp\u003eMentorship matters to me because it’s one of the most powerful ways to spark excitement, confidence, and growth in someone’s journey. I’ve been so lucky to have mentors who pushed me to dream bigger, take risks, and believe in myself—and I know how life-changing that support can be. I’m passionate about being that source of energy and encouragement for others: helping students discover what lights them up, tackle challenges with confidence, and realize that they’re capable of way more than they think. Watching someone grow into their potential is the best feeling in the world, and I can’t wait to be part of that journey!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"2faab0f5-4c87-40d1-b98c-437b3ec62c0f\"}":{"__typename":"DeepDives","uuid":"2faab0f5-4c87-40d1-b98c-437b3ec62c0f","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to visit every continent! I love exploring new places, meeting people from different backgrounds, and experiencing new cultures — it’s one of the best ways to stay curious and keep learning outside of a classroom. Every trip feels like its own little adventure, and I’m excited to keep expanding my perspective with each new place I visit.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d301bb07-68b6-4114-81e7-4560068f0666\"}":{"__typename":"DeepDives","uuid":"d301bb07-68b6-4114-81e7-4560068f0666","content":"\u003cp\u003eIn my spare time, I love dancing! I did ballet competitively for 12 years, and now in college, I’m part of several dance groups, including Penn Ballet and Pan Asian Dance troupe. I've also been expanding into K-pop and hip-hop styles, which has been such a fun way to push myself creatively and try something new. Dance has always been one of my biggest passions - it’s where I feel the most energized, expressive, and connected to a community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1e6f26d8-d6fe-42f4-bdc7-b5437f173982\"}":{"__typename":"DeepDives","uuid":"1e6f26d8-d6fe-42f4-bdc7-b5437f173982","content":"\u003cp\u003eMy greatest source of motivation is the idea of growth — both for myself and for the people around me. I’m driven by the excitement of learning new things, taking on challenges that push me out of my comfort zone, and seeing how far I can go when I put my heart into something. I’m also really motivated by the opportunity to make a positive impact, whether that's helping a mentee gain confidence or contributing to a bigger project or cause. Knowing that even small actions can create real change keeps me energized and moving forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"f8d98bb0-9141-40fe-bda3-b44df6db4b35\"}":{"__typename":"School","uuid":"f8d98bb0-9141-40fe-bda3-b44df6db4b35","name":"Palo Alto High School","city":"Palo Alto","type":"HIGH","state":"California","country":"United States","zip":"94301"},"Education:{\"uuid\":\"93cb79f0-41f0-41fa-bf2d-eafd17a98b9f\"}":{"__typename":"Education","uuid":"93cb79f0-41f0-41fa-bf2d-eafd17a98b9f","school":{"__ref":"School:{\"uuid\":\"f8d98bb0-9141-40fe-bda3-b44df6db4b35\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"371c8c7d-93bd-4060-90ad-43219db717b4\"}":{"__typename":"Education","uuid":"371c8c7d-93bd-4060-90ad-43219db717b4","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science, Buisness, Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"bf66b737-2a05-4360-8c72-2bf33cb8a59b\"}":{"__typename":"MentorPublicProfile","uuid":"bf66b737-2a05-4360-8c72-2bf33cb8a59b","displayName":"Cynthia Z.","slug":"cynthia-zhang","biography":"\u003cp\u003eHi, I'm Cynthia Zhang! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm currently a student at the University of Pennsylvania in the Jerome Fisher Program in Management \u0026amp; Technology, where I'm pursuing a dual degree in Computer Science and Finance and an accelerated masters in Data Science. Growing up in California, I developed an early passion for problem solving, creativity, and technology, and today, I’m excited to share that journey with the next generation of learners.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout high school and college, I’ve been lucky to explore my interests deeply: winning national awards in math competitions like the MIT Math Prize for Girls, working on AI and data science projects, and interning as a software engineer at companies like Microsoft. Beyond academics, I founded Tech Girls Club to empower young women in STEM, organizing international conferences and hackathons to create spaces for innovation and confidence-building.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not working on projects or exploring new ideas, you’ll often find me dancing with the Pan-Asian Dance Troupe and Penn Ballet, watching TV with my friends, reading and listening to music, playing card games, traveling, or discovering new coffee shops with friends. My friends would describe me as energetic, thoughtful, and someone who’s always ready to celebrate their small (and big) wins.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I believe the most powerful learning happens when curiosity leads the way. I aim to create an environment where students feel supported to explore, ask questions, and grow beyond what they imagined possible. Whether it's building a passion project, navigating technical subjects, or boosting confidence in new challenges, I’m here to guide and cheer them on every step of the way. I’m especially excited to mentor students interested in technology, computer science, math, or just beginning their exploration into these fields!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science, Buisness, Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ad1f6aba-90ef-43f1-8b77-fdb6adc67ad8\"}"},{"__ref":"DeepDives:{\"uuid\":\"2faab0f5-4c87-40d1-b98c-437b3ec62c0f\"}"},{"__ref":"DeepDives:{\"uuid\":\"d301bb07-68b6-4114-81e7-4560068f0666\"}"}
