xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3d8c8ebd-7645-4afb-8640-449bffafa0aa\"}":{"__typename":"DeepDives","uuid":"3d8c8ebd-7645-4afb-8640-449bffafa0aa","content":"\u003cp\u003eWhile there are far too few shelters to address homelessness, there are even fewer that can accommodate families with special needs. Through my work with FamiliesFirst, a special needs shelter, I learned that many families cannot access traditional shelters due to a lack of accessibility or specialized care. To support them, I organized a holiday resource drive in my community, providing gifts of essential items like hearing aids, sensory-friendly clothing, and everyday necessities. I’m passionate about continuing my work and raising awareness for shelters like FamiliesFirst, ensuring that families with special needs can enjoy the same experience as everyone else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"ec57710b-a76a-4942-9779-30b01d4858d3\"}":{"__typename":"DeepDives","uuid":"ec57710b-a76a-4942-9779-30b01d4858d3","content":"\u003cp\u003eSomething that isn’t immediately obvious about me (or hopefully is) is my love for working out. Whether it's lifting weights or doing cardio, I thrive on the feeling of pushing my body to its limits. Outside of the gym, I stay active by playing soccer, badminton, and swimming. This commitment to physical fitness keeps me disciplined and focused, qualities I carry over into all aspects of my life, including mentorship. I believe that just as physical training strengthens the body, intellectual challenges and problem-solving strengthen the mind, and I aim to cultivate both in my students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"6096d016-dd60-4d4f-bf44-817438f2ec8e\"}":{"__typename":"DeepDives","uuid":"6096d016-dd60-4d4f-bf44-817438f2ec8e","content":"\u003cp\u003eMy greatest role model is my father. Despite his busy schedule and the responsibilities of caring for my siblings, he always found time to organize lessons for me, teaching me more than what I would learn in class. His dedication to my education made him the first and most impactful mentor in my life, shaping both my success and the way I think today. What stands out most to me is his unmatched passion for learning—despite having a successful career, he constantly seeks to expand his knowledge, diving into new subjects like machine learning or brewery. His drive for continuous self-improvement is something I aspire to, and it inspires me to encourage the same curiosity and dedication in the students I mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"873ad55c-bbf8-496b-8986-78acbdef756a\"}":{"__typename":"DeepDives","uuid":"873ad55c-bbf8-496b-8986-78acbdef756a","content":"\u003cp\u003eOut of all the things I could be doing, I choose mentorship because it allows me to give back in a meaningful way. I’ve been fortunate to have incredible mentors who helped me unlock my potential, and now I want to be that same guiding force for others. Mentorship is not just about passing on knowledge—it’s about helping students discover their own strengths, building their confidence, and showing them what’s possible. Watching someone grow, knowing you had a part in their journey, is incredibly rewarding. It’s that impact that keeps me passionate about being a mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"edacbf48-64ba-487d-96b1-cb12cd981246\"}":{"__typename":"School","uuid":"edacbf48-64ba-487d-96b1-cb12cd981246","name":"American Heritage Schools, Broward Campus","city":"Plantation","type":"HIGH","state":"Florida","country":"United States","zip":"33325"},"Education:{\"uuid\":\"84f82faf-0959-4c09-babf-6483f2a18b75\"}":{"__typename":"Education","uuid":"84f82faf-0959-4c09-babf-6483f2a18b75","school":{"__ref":"School:{\"uuid\":\"edacbf48-64ba-487d-96b1-cb12cd981246\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"1d1142fc-2010-41ea-a012-496b81130992\"}":{"__typename":"Education","uuid":"1d1142fc-2010-41ea-a012-496b81130992","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mathematics","degree":null},"Testimonial:e6959a20-5b4a-46b2-9c47-59497f8e18d4":{"__typename":"Testimonial","id":"e6959a20-5b4a-46b2-9c47-59497f8e18d4","text":"Mason has been a positive force in Aidan’s academic journey. Since he’s been working with Mason, his grades and confidence have improved. Mason is prepared, responsive and diligent in his role. More importantly, he cares about Aidan as a student and a person.  We are fortunate to be connected with Mason.","date":"2025-05-24 20:51:04.664+00","rating":5,"endorser":{"__typename":"Endorser","name":"lupe garcia","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"73eacf72-aee7-43e7-9c81-499c5bf20f1c\"}":{"__typename":"MentorPublicProfile","uuid":"73eacf72-aee7-43e7-9c81-499c5bf20f1c","displayName":"Mason C.","slug":"mason-cheng","biography":"\u003cp\u003eHi! I’m Mason Cheng, a sophmore at Cornell University majoring in Mathematics with a concentration in Computer Science and Economics. I’m passionate about problem-solving, whether through numbers, innovative thinking, or exploring intersections between technical and business fields, and I’m excited to share that passion with others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in South Florida, where I attended American Heritage Broward for middle and high school. Throughout my time there, I was heavily involved in both math and debate. As part of the American Heritage Math Competition Team, I qualified for the American Invitational Mathematics Exam (AIME) and placed in the top tier of FAMAT state and national competitions. Additionally, my love for debate led me to become captain of the Lincoln-Douglas team, where I not only competed but also led our team to success. I’ve championed tournaments in three separate debate events, alongside qualifying for nationals four times and states five times. By the end of high school, I had been ranked as high as 16th in the world in Lincoln-Douglas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my competitive achievements, I’ve been deeply committed to mentorship. My motivation stems from the guidance I received from my own mentors—my parents, teachers, and coaches. As the oldest of four siblings, I’ve always found joy in helping others grow, and I know firsthand how rewarding it is to see someone unlock their full potential. Whether it’s through tutoring, coaching, or simply offering advice, I aim to provide the same level of support and encouragement that was given to me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Cornell, I’ve continued to blend my technical and communication skills. I currently serve as a teaching assistant for a discrete mathematics course. I also work as a project manager with Cornell’s Cayuga Healthcare Consulting group, where I lead a team analyzing strategies for medical technology companies. My past internships include working as a software engineer at an AI-driven clinical tool startup and as a biodefense strategy consultant researching pharmaceutical market expansion frameworks. Across these roles, I’ve discovered how powerful interdisciplinary problem-solving can be—whether through programming, economics, or strategic research.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship has remained a central part of my journey. I’ve worked with students at Curious Cardinals, supporting subjects ranging from algebra to chemistry, and helping students strengthen their executive functioning skills. Earlier, I volunteered at NOVA Debate Camp, coached internationally with Outreach Debate, and served as a counselor at the Alternative Education Foundation for children with special needs. These experiences deepened my commitment to accessibility and inclusivity in education, reminding me that leadership means uplifting others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love traveling around the world with my family, exploring new foods and cultures. My favorite so far has been the crawfish boils in China! I’m also a philosophy enthusiast, particularly intrigued by existentialism, where I find ways to connect deep, abstract thinking to everyday life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor with Curious Cardinals, my goal is to ignite curiosity, encourage critical thinking, and help students achieve their full potential, both academically and personally. Whether we’re solving challenging math problems, exploring business and STEM intersections, or honing public speaking skills, I’m committed to creating an engaging and supportive environment where students can thrive and develop a love for learning.g and supportive environment where students can thrive and develop a love for learning.\u003c/p\u003e","teachingVideoPlaybackId":"DHl5WnefWqHBVl846TBqcSbri01O01bumsVlhpX7XxL1I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3d8c8ebd-7645-4afb-8640-449bffafa0aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec57710b-a76a-4942-9779-30b01d4858d3\"}"},{"__ref":"DeepDives:{\"uuid\":\"6096d016-dd60-4d4f-bf44-817438f2ec8e\"}"},{"__ref":"DeepDives:{\"uuid\":\"873ad55c-bbf8-496b-8986-78acbdef756a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bcfe7b1c-cac4-4e04-900e-2b771f3d0348/-/preview/-/format/jpg/","https://ucarecdn.com/2497939f-7e6e-4e5e-a86a-9edbb97073ee/-/preview/-/format/jpg/","https://ucarecdn.com/e55dd3ab-aea6-406c-a5a0-cb9ea822f78c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"84f82faf-0959-4c09-babf-6483f2a18b75\"}"},{"__ref":"Education:{\"uuid\":\"1d1142fc-2010-41ea-a012-496b81130992\"}"}],"hiredAt":"2024-10-10T12:20:38.131Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Chemistry","Economics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:e6959a20-5b4a-46b2-9c47-59497f8e18d4"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mason-cheng\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"73eacf72-aee7-43e7-9c81-499c5bf20f1c\"}"}}},"_sentryTraceData":"12f2074bb737463da17fe42003335b24-8361e3b2374a02c8-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=12f2074bb737463da17fe42003335b24,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"mason-cheng"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
