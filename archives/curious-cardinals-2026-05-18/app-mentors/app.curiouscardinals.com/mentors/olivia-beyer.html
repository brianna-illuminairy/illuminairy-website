xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"998fb304-43da-4a68-ba66-2fa235efc0f2\"}":{"__typename":"Favorites","uuid":"998fb304-43da-4a68-ba66-2fa235efc0f2","photoUrl":"https://ucarecdn.com/7d38ac75-6493-4b05-9235-35ee455ed138/","title":"Tennis","type":"SPORT"},"Favorites:{\"uuid\":\"f2dce61b-8a42-4246-bc8f-7c57fff21586\"}":{"__typename":"Favorites","uuid":"f2dce61b-8a42-4246-bc8f-7c57fff21586","photoUrl":"https://ucarecdn.com/5afbdd7f-0830-4005-8fe3-e49f6d0f20f1/","title":"Ribs by Lorde","type":"SONG"},"Favorites:{\"uuid\":\"b609503e-7f5a-46f1-ba39-e6e361a8efe0\"}":{"__typename":"Favorites","uuid":"b609503e-7f5a-46f1-ba39-e6e361a8efe0","photoUrl":"https://ucarecdn.com/05f41aa5-202d-4663-beb2-1cb10fd79e07/","title":"Hamilton","type":"PLAY"},"CausesSupported:{\"uuid\":\"616e5b5e-238f-4d5f-b322-f29ee7377fc3\"}":{"__typename":"CausesSupported","uuid":"616e5b5e-238f-4d5f-b322-f29ee7377fc3","name":"WIZO","description":"\u003cp\u003eThis charity supports a century-long legacy of empowering women in Israel.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/8bca81a1-cdb2-420d-b780-8db8bf611c05/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"79a54a97-adce-41f2-8aa5-88f86d96607b\"}":{"__typename":"DeepDives","uuid":"79a54a97-adce-41f2-8aa5-88f86d96607b","content":"\u003cp\u003eHard work pays off, keep going!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"f3c97a96-18bc-46c8-9b6d-e0b2ae79da8e\"}":{"__typename":"DeepDives","uuid":"f3c97a96-18bc-46c8-9b6d-e0b2ae79da8e","content":"\u003cp\u003eIn high school, I was an extremely driven student both in and outside of the classroom. I loved learning and enjoyed all my classes. Outside of the classroom, I led the Women in STEM Club, was the Executive Editor for Riverdale’s Newspaper, and spearheaded several campaigns. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"15076810-be9c-4955-8daf-084a28215285\"}":{"__typename":"DeepDives","uuid":"15076810-be9c-4955-8daf-084a28215285","content":"\u003cp\u003eMentorship matters to me because it’s the most powerful way to help someone realize their potential and feel seen in their passions. I’ve been lucky to have mentors who encouraged me to think boldly and explore deeply, and I want to pass that forward. Supporting students as they grow confidence, curiosity, and clarity in their goals is one of the most rewarding things I can do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"52b53292-4cf6-4ac1-8f2c-b18746ea9d0b\"}":{"__typename":"DeepDives","uuid":"52b53292-4cf6-4ac1-8f2c-b18746ea9d0b","content":"\u003cp\u003eI hope to build a fulfilling career in international venture capital, where I can help innovative ideas grow across borders. Through this work, I aim to connect with and learn from people around the world, building bridges between cultures and industries. My ultimate goal is to create meaningful global impact by empowering entrepreneurs and driving solutions to shared challenges.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"9c1cbb7d-e179-46a1-b298-01830bc6e907\"}":{"__typename":"Education","uuid":"9c1cbb7d-e179-46a1-b298-01830bc6e907","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2011","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"f7dffdb1-728d-47a2-811c-0fc8f35c0a8e\"}":{"__typename":"Education","uuid":"f7dffdb1-728d-47a2-811c-0fc8f35c0a8e","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"International Relations and Chinese","degree":null},"MentorPublicProfile:{\"uuid\":\"d9ac2539-53b6-466c-9466-2e8d2c8c70bb\"}":{"__typename":"MentorPublicProfile","uuid":"d9ac2539-53b6-466c-9466-2e8d2c8c70bb","displayName":"Olivia B.","slug":"olivia-beyer","biography":"\u003cp\u003eMy name is Olivia Beyer and I am currently a rising junior at the University of Pennsylvania majoring in International Relations and minoring in Chinese. My background in mentorship, writing, international relations, finance, and global history has shaped the way I support students in building confidence, pursuing ambitious goals, and developing projects that reflect their passions. I am especially passionate about helping students connect academic success with larger personal, professional, and creative ambitions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my time at Riverdale Country School in New York City, I developed a strong foundation in communication, leadership, and academic excellence. I served as Co-Executive Editor for two school newspapers, where I led editorial direction, wrote extensively, and strengthened my ability to communicate complex ideas clearly and effectively. I also founded and led the school’s Women in STEM Club, organizing initiatives that encouraged young women to pursue leadership and innovation in science and technology. My academic interests in international affairs began early, and my policy brief on China’s economy was selected by the American Academy of International Culture. Additionally, I founded a bilingual English-Chinese newspaper, combining my passions for language, journalism, and cultural exchange while creating an original platform for student voices. Beyond academics, I served as captain of the varsity tennis team, where I developed teamwork, discipline, and mentorship skills that continue to influence my leadership style today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, as a student at the University of Pennsylvania, I continue to expand these interests through finance, policy, and entrepreneurship. I previously worked as an Associate at IDA Ventures, where I researched startups, analyzed markets, and contributed to venture capital investment decisions. As a Girls Who Invest Scholar in the selective Intensive Program, I am further strengthening my knowledge of investment strategy, financial modeling, and the broader financial industry through rigorous coursework and professional development. These experiences have prepared me to join Goldman Sachs as a 2027 Summer Analyst in Investment Banking, where I will continue developing my expertise in finance and global markets.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I bring structure, encouragement, and strategic thinking to every student relationship. Whether helping students strengthen academics, launch passion projects, or prepare for future opportunities, my goal is to help them think boldly, stay organized, and realize their fullest potential.\u003c/p\u003e","teachingVideoPlaybackId":"Cc02C3v0202DpBSFHYJVQhiAApCVlXOzCqZ00AFvzZXYJ01A","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSpeaking at my high school graduation.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"998fb304-43da-4a68-ba66-2fa235efc0f2\"}"},{"__ref":"Favorites:{\"uuid\":\"f2dce61b-8a42-4246-bc8f-7c57fff21586\"}"},{"__ref":"Favorites:{\"uuid\":\"b609503e-7f5a-46f1-ba39-e6e361a8efe0\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"616e5b5e-238f-4d5f-b322-f29ee7377fc3\"}"}],"major":"International Relations and Chinese","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"79a54a97-adce-41f2-8aa5-88f86d96607b\"}"},{"__ref":"DeepDives:{\"uuid\":\"f3c97a96-18bc-46c8-9b6d-e0b2ae79da8e\"}"},{"__ref":"DeepDives:{\"uuid\":\"15076810-be9c-4955-8daf-084a28215285\"}"},{"__ref":"DeepDives:{\"uuid\":\"52b53292-4cf6-4ac1-8f2c-b18746ea9d0b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fbf3fc87-0017-4dcd-9eaf-e8657fb20648/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9c1cbb7d-e179-46a1-b298-01830bc6e907\"}"},{"__ref":"Education:{\"uuid\":\"f7dffdb1-728d-47a2-811c-0fc8f35c0a8e\"}"}],"hiredAt":"2025-04-15T12:53:05.562Z","topics":["K-5 Grade Math","6-8 Grade Science","Writing","Mandarin Chinese","Academic Coaching","College Essay Writing","History","Reading","Creative Writing","History Project","K-6 Storybook","Business / Entrepreneurship","Finance / Investing","Web Design","Journalism","Public Speaking","Sustaina
