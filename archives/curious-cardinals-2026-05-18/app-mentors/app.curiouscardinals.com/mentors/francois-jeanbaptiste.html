xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2af43364-76b9-4bb3-9940-0c283b7328e2\"}":{"__typename":"Favorites","uuid":"2af43364-76b9-4bb3-9940-0c283b7328e2","photoUrl":"https://ucarecdn.com/3d5ecc61-d4a8-47d4-9d0a-ecc5a97fc9ea/","title":"Denzel Washington","type":"ACTOR"},"Favorites:{\"uuid\":\"8f2d72b9-0764-45e6-a5a7-d4e6c7582bbc\"}":{"__typename":"Favorites","uuid":"8f2d72b9-0764-45e6-a5a7-d4e6c7582bbc","photoUrl":"https://ucarecdn.com/1013f0be-49da-4b8c-bc1c-8a73979ec00c/","title":"College Dropout","type":"ALBUM"},"Favorites:{\"uuid\":\"fefd4ee9-0a9a-41e3-8c30-3b3895e4181d\"}":{"__typename":"Favorites","uuid":"fefd4ee9-0a9a-41e3-8c30-3b3895e4181d","photoUrl":"https://ucarecdn.com/a5ab05a2-72dd-45a7-9ad3-01a06a8c3d3f/","title":"Their Eyes Were Watching God - Zora Neale Hurston","type":"BOOK"},"CausesSupported:{\"uuid\":\"b314bd76-7a26-4196-9a6d-2e47a5306bbb\"}":{"__typename":"CausesSupported","uuid":"b314bd76-7a26-4196-9a6d-2e47a5306bbb","name":"Toni's Kitchen","description":"\u003cp\u003eI help cook and clean a local soup kitchen.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/78edbdfa-e132-4f8b-994a-95384c5bb5f2/"},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"11aa9e18-6077-494b-b939-a62b784a0ae6\"}":{"__typename":"DeepDives","uuid":"11aa9e18-6077-494b-b939-a62b784a0ae6","content":"\u003cp\u003eI had a dream where I was much taller than I actually am. I had to duck to get through doorways, and I remember taking forever to reach my chair at school—it was comically slow. When I woke up, I immediately started laughing, because… woah!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"3a532e4c-3a7c-4978-a333-200982227c66\"}":{"__typename":"DeepDives","uuid":"3a532e4c-3a7c-4978-a333-200982227c66","content":"\u003cp\u003eThis would be the perfect time to say I was an all-American who discovered cures for multiple diseases and had a 6.2 GPA. But that was not me at all. I was well-rounded, yes, but I also had a goal. From a young age, I knew what I wanted to do and who I wanted to be, and I stuck to it. I was involved in Mock Trial, Model UN, Debate Team, and Student Council. I also played football and threw shot put and discus. On top of my mountain of extracurriculars, I somehow kept up with my grades. If I had to pick one word my high school peers would use to describe me, it would be adaptable.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"323c1a64-fd8c-4b2a-82a9-62dc6a9a8cec\"}":{"__typename":"DeepDives","uuid":"323c1a64-fd8c-4b2a-82a9-62dc6a9a8cec","content":"\u003cp\u003eSomething about me that isn’t obvious right away is that I speak \u003cstrong\u003eChinese at an intermediate level\u003c/strong\u003e. I studied Mandarin for three years in high school and have continued learning it at Princeton, not just as a language requirement, but because I genuinely enjoy the challenge. Learning Chinese has pushed me to become comfortable with being uncomfortable—grappling with new sounds, tones, characters, and ways of thinking that don’t map neatly onto English.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eContinuing Chinese in college has been especially meaningful because it reminds me that learning doesn’t stop when something gets difficult or inconvenient. It’s a quiet but important part of who I am—one that reflects my curiosity, discipline, and willingness to engage deeply with cultures and perspectives different from my own.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"2fbdd7c6-d924-44e9-9e78-5be39bad109f\"}":{"__typename":"School","uuid":"2fbdd7c6-d924-44e9-9e78-5be39bad109f","name":"Seton Hall Preparatory School","city":"West Orange","type":"HIGH","state":"New Jersey","country":"United States","zip":"07052"},"Education:{\"uuid\":\"f7e78805-a1bf-4225-b7c1-99d48f2c7dde\"}":{"__typename":"Education","uuid":"f7e78805-a1bf-4225-b7c1-99d48f2c7dde","school":{"__ref":"School:{\"uuid\":\"2fbdd7c6-d924-44e9-9e78-5be39bad109f\"}"},"startYear":"2022","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"f4bd2b94-27c7-4c1b-91fb-4b234e8a4a6b\"}":{"__typename":"Education","uuid":"f4bd2b94-27c7-4c1b-91fb-4b234e8a4a6b","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Public \u0026 Int'l Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"a05db6ee-0faf-49ec-bd8e-f8a62644d9ee\"}":{"__typename":"MentorPublicProfile","uuid":"a05db6ee-0faf-49ec-bd8e-f8a62644d9ee","displayName":"Francois J.","slug":"francois-jeanbaptiste","biography":"\u003cp\u003eI’m \u003cstrong\u003eFrancois Jean-Baptiste III\u003c/strong\u003e, a student leader, mentor, and advocate who is deeply passionate about education, public service, and helping young people develop confidence in their ideas and voices. I care most about creating spaces where students feel supported, challenged, and empowered to think critically about the world around them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I’m especially interested in \u003cstrong\u003ehistory, law, government, and public policy\u003c/strong\u003e, with a strong focus on how these systems shape real communities. I enjoy research-driven work and translating complex ideas into clear, accessible language. This interest took on real-world form through my participation in the \u003cstrong\u003eSummer Work Experience Program (SWEP)\u003c/strong\u003e, where I worked on a team focused on expanding access to mental health resources in my community. Through research, data analysis, and community canvassing, I helped identify gaps in existing mental health programs and develop practical solutions to address them. As part of this work, I contributed to a \u003cstrong\u003epolicy brief presented to city councilmembers\u003c/strong\u003e, with plans to present the brief at the congressional level in the future. This project also led to me being featured on \u003cstrong\u003ePIX11 News\u003c/strong\u003e, highlighting the impact of youth-led advocacy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore college, I served as a \u003cstrong\u003ePeer Leader in high school\u003c/strong\u003e, a role awarded to a select group of seniors committed to leadership and service. In this position, I mentored incoming freshmen from dozens of different towns and backgrounds, helping them navigate their first year academically and socially. Acting as a “big brother” figure, I focused on building trust, easing transitions, and fostering a sense of belonging—skills that continue to shape my approach to mentoring today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I’m an \u003cstrong\u003eEagle Scout\u003c/strong\u003e, an achievement that reflects years of dedication to service, responsibility, and leadership. I’m also a member of the \u003cstrong\u003ePrinceton rugby team\u003c/strong\u003e, where I apply teamwork, discipline, and resilience in a demanding, collaborative environment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m particularly passionate about mentoring students in \u003cstrong\u003ehistory projects, creative writing, law, government and policy, debate, and public speaking\u003c/strong\u003e. I enjoy helping students research deeply, structure strong arguments, and communicate with clarity and confidence—whether through writing, discussion, or presentation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStudents and families can expect me to be patient, dependable, and intentional. I believe mentorship is about more than academic success; it’s about helping students believe in their own potential and develop skills that will serve them well far beyond the classroom.\u003c/p\u003e","teachingVideoPlaybackId":"JODAq2w2EIjhv7IzvC2DWXaxlyy87XFVKac3CD75ueQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I am really proud of is being an Eagle Scout. I started the journey when I was in 7th grade, and after 5 trying years I succeeded in earned the rank.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"2af43364-76b9-4bb3-9940-0c283b7328e2\"}"},{"__ref":"Favorites:{\"uuid\":\"8f2d72b9-0764-45e6-a5a7-d4e6c7582bbc\"}"},{"__ref":"Favorites:{\"uuid\":\"fefd4ee9-0a9a-41e3-8c30-3b3895e4181d\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b314bd76-7a26-4196-9a6d-2e47a5306bbb\"}"}],"major":"Public \u0026 Int'l Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"11aa9e18-6077-494b-b939-a62b784a0ae6\"}"},{"__ref":"DeepDives:{\"uuid\":\"3a532e4c-3a7c-4978-a333-200982227c66\"}"},{"__ref":"DeepDives:{\"uuid\":\"323c1a64-fd8c-4b2a-82a9-62dc6a9a8cec\"}"}],"active":true,"profilePhotos":["https://ucare
