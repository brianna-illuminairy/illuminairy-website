xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d646fb96-85a4-4276-aa10-8a720e3f73e5\"}":{"__typename":"DeepDives","uuid":"d646fb96-85a4-4276-aa10-8a720e3f73e5","content":"\u003cp\u003eI really want to create a personal music project of my own in any form! Whether it be creating a small youtube channel, producing a music, or becoming a musical artist myself, I could only imagine how exciting it would be when I get to truly utilize this tool for moving people's hearts.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6c703534-2971-4121-bb05-a4a8b9b1487e\"}":{"__typename":"DeepDives","uuid":"6c703534-2971-4121-bb05-a4a8b9b1487e","content":"\u003cp\u003eI decided to study computer science because its broad application in almost any field opens up near infinite possibilities for me. I personally don't clearly know what I want to do with computer science, and I definitely do not want to code my entire life. However, that's why I decided to learn the \"science behind computers\" that I love, not coding so that I would know which path I truly desire to follow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7a75225e-84a4-46c4-b10e-2c50a904ece0\"}":{"__typename":"DeepDives","uuid":"7a75225e-84a4-46c4-b10e-2c50a904ece0","content":"\u003cp\u003eMost of my spare time would be spending time with God reading the Bible, listening to music, or scrolling through youtube to search for random videos that catch my attention. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"2caa8fc7-cf19-45b3-add4-a7a3ebf4a35b\"}":{"__typename":"DeepDives","uuid":"2caa8fc7-cf19-45b3-add4-a7a3ebf4a35b","content":"\u003cp\u003eAs a Christian, my greatest source of motivation is the reminder that God is always near me. To be able to have confidence and peace in God even in realizing my weakness motivates me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"3b92a4f6-ab04-4769-b55b-06b8cbac6ecd\"}":{"__typename":"School","uuid":"3b92a4f6-ab04-4769-b55b-06b8cbac6ecd","name":"Los Angeles High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90019"},"Education:{\"uuid\":\"d638695f-bdce-4a2d-8dbe-2b354172299c\"}":{"__typename":"Education","uuid":"d638695f-bdce-4a2d-8dbe-2b354172299c","school":{"__ref":"School:{\"uuid\":\"3b92a4f6-ab04-4769-b55b-06b8cbac6ecd\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"890743be-b311-4d85-932d-6537140085d7\"}":{"__typename":"Education","uuid":"890743be-b311-4d85-932d-6537140085d7","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"fc125bf9-1ba4-4b7e-a357-aa62785e66c1\"}":{"__typename":"MentorPublicProfile","uuid":"fc125bf9-1ba4-4b7e-a357-aa62785e66c1","displayName":"Brian S.","slug":"brian-seo-1","biography":"\u003cp\u003eHi! My name is Brian Seo, and I’m studying Computer Science at Princeton University!\u003c/p\u003e\u003cbr\u003e\u003cp\u003e“The confidence of a runner comes from the faith that there is a finish line ahead in the direction they are sprinting.”\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAsking “why” is essential, as without a solid purpose or direction, all runners run a meaningless race, unaware of their destination. I study Computer Science because I find immense joy in unraveling the complexities of technology and exploring how it can address real-world challenges. My focus goes beyond learning to code; I am delving into the “science behind computers” to better define and achieve my career goals. Just as runners may not always see their destination clearly, the journey of life and career can be uncertain. Therefore, I would love to provide clarity in their direction and pave their path straighter that they may run knowing and trusting that they will meet a finish line at the end of the race course.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my academic pursuits, I am deeply passionate about singing and enjoying good food! I believe that music possesses a unique and almost magical power to inspire and touch the human heart with even the simplest melody and lyrics. One of my biggest dreams is to create a meaningful project centered around this passion, regardless of its size. While I may not build a career in music, the excitement from this dream adds purpose and energy to my life. I am actively involved in an East Asian a cappella group and dedicate my spare time to studying music. In this race, my faith also plays a vital role, as my desire is to glorify the Lord through my gift, and I could only imagine how joyful it would be offering the talents I deeply love to God. This also reveals a big part of my identity, loving Jesus. I may lose all other identities, but this is the one identity that I will never lose in His enduring love.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am dedicated to discovering mentees’ passions and setting meaningful goals together. By sharing my own experiences and interests, I look forward to inspiring them with clarity and being inspired by their enthusiasm and zeal!\u003c/p\u003e","teachingVideoPlaybackId":"8Ceo9WLNgKegwIXba49R6aLro15fe7X5labO7GMKR01Y","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI take a lot of joy in being able to see how I have gone through personal growth by self-initiative over time. In such light, a significant part of my growth that I am proud of was when I decided to renovate the Mathematics, Engineering, Science, and Achievement(MESA) community. Although the MESA/Robotics team has a proven track record of offering career opportunities for students who want to pursue academics in engineering, this once thriving club had only seven team members with waning interest after COVID-19. Knowing that this club had transformed many of my friends' career trajectories, I decided to commit to resurrecting this great club and seize the opportunity to recapture the STEM field within my school. Through active participation in club rush and morning announcements, I increased awareness of opportunities that MESA could offer, which increased the member count by nearly 500%. In addition, to ensure the significance of MESA doesn't depreciate, I consistently organized events and strategies, such as fundraising and assigning members to three different competition teams. Over one academic year, we prepared for and participated in the Jet Propulsion Laboratory Invention Challenge, FIRST Tech Challenge Robotics, official MESA competition, and the International Bridge Competition, which are among the highest-achieving competitions in the Nation. Now, the succeeding generation is upholding this significance and creating a legacy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d646fb96-85a4-4276-aa10-8a720e3f73e5\"}"},{"__ref":"DeepDives:{\"uuid\":\"6c703534-2971-4121-bb05-a4a8b9b1487e\"}"},{"__ref":"DeepDives:{\"uuid\":\"7a75225e-84a4-46c4-b10e-2c50a904ece0\"}"},{"__ref":"DeepDives:{\"uuid\":\"2caa8fc7-cf19-45b3-add4-a7a3ebf4a35b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6b0b4b6f-d2a0-4a67-87e6-2b7d7289602c/-/preview/-/format/jpg/","https://ucarecdn.com/fa833fbc-5c11-4fd8-90b5-2242fc5178e0/-/preview/-/format/jpg/","https://ucarecdn.com/24a325ac-2079-4337-bdb1-cbed60e7e98b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d638695f-bdce-4a2d-8dbe-2b354172299c\"}"},{"__ref":"Education:{\"uuid\":\"890743be-b311-4d85-932d-6537140085d7\"}"}],"hiredAt":"2024-06-21T09:27:36.017Z","topics":["Geometry","Algebra II","Precalculus / Trigonometry","Algebra I","Pre-Algebra","K-5 Grade Math","Computer Science"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"brian-seo-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fc125bf9-1ba4-4b7e-a357-aa62785e66c1\"}"}}},"_sentryTraceData":"5d76c0bb3cdd45f78e2d11
