xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"96c903a8-0b2f-4d46-ab2a-21c3aeed6994\"}":{"__typename":"Favorites","uuid":"96c903a8-0b2f-4d46-ab2a-21c3aeed6994","photoUrl":"https://ucarecdn.com/45b12722-ed76-4c38-a66c-7376e9be21d5/","title":"Dutch Blitz","type":"GAME"},"Favorites:{\"uuid\":\"6b0918ae-c3ae-4feb-ba13-70af35b7cd86\"}":{"__typename":"Favorites","uuid":"6b0918ae-c3ae-4feb-ba13-70af35b7cd86","photoUrl":"https://ucarecdn.com/6aa1e183-eba6-40e8-82e0-af3eb6002659/","title":"Mexico City","type":"CITY"},"Favorites:{\"uuid\":\"bf2ed6fb-6a3d-4568-9b88-d834c5df0ed5\"}":{"__typename":"Favorites","uuid":"bf2ed6fb-6a3d-4568-9b88-d834c5df0ed5","photoUrl":"https://ucarecdn.com/f6a4125d-79e1-49cb-896c-58780648a547/","title":"Chilco","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"18ef673d-f2b4-4778-88f1-2a85359b9626\"}":{"__typename":"DeepDives","uuid":"18ef673d-f2b4-4778-88f1-2a85359b9626","content":"\u003cp\u003eI really enjoyed science and the humanities in high school and wanted to study something that would allow me to have both. I think looking at the human aspect of biology (especially in relation to the environment and disease transmission, which is what I focused on) is extremely important. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"a97c7aaa-bf30-4e44-99e3-0976f852f3f7\"}":{"__typename":"DeepDives","uuid":"a97c7aaa-bf30-4e44-99e3-0976f852f3f7","content":"\u003cp\u003eI learn a lot from my friends! I think it is nice to have daily reminders and examples of what to aspire to - be it related to confidence, particular skills or knowledge, or even humor. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"51ca78d8-ad76-4963-beac-6c5b99c86121\"}":{"__typename":"DeepDives","uuid":"51ca78d8-ad76-4963-beac-6c5b99c86121","content":"\u003cp\u003eTo ask more questions! There are so many interesting things to learn, people to meet, and experiences to be had that come out of curiosity and the willingness to explore it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"46095586-5fa8-46f4-8bd1-5094e3192781\"}":{"__typename":"DeepDives","uuid":"46095586-5fa8-46f4-8bd1-5094e3192781","content":"\u003cp\u003eMy most recent personal project was my farewell to undergrad. I compiled poems from some of my closest friends from Stanford and printed them at the printshop, ending with 10 little books that I bound by hand and gifted to each of them. It was a project that joined some of the things I most love (poetry, printing, and friends) and one I feel proud of. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"8a5debc5-2798-4ee5-a588-d77864d39ca7\"}":{"__typename":"School","uuid":"8a5debc5-2798-4ee5-a588-d77864d39ca7","name":"Mater Dei High School","city":"Chula Vista","type":"HIGH","state":"California","country":"United States","zip":"91913"},"Education:{\"uuid\":\"043bd946-449f-42a6-ab8a-c765af38e739\"}":{"__typename":"Education","uuid":"043bd946-449f-42a6-ab8a-c765af38e739","school":{"__ref":"School:{\"uuid\":\"8a5debc5-2798-4ee5-a588-d77864d39ca7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"2e6ea203-4b56-443d-8ca9-03760b82b8e9\"}":{"__typename":"Education","uuid":"2e6ea203-4b56-443d-8ca9-03760b82b8e9","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Human Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"f7256104-92f9-463e-8940-8c2a36ea932f\"}":{"__typename":"MentorPublicProfile","uuid":"f7256104-92f9-463e-8940-8c2a36ea932f","displayName":"Galia S.","slug":"galia-santanaoikawa","biography":"\u003cp\u003eHi! :) My name is Galia, I grew up in Mexico, studied Human Biology and Sustainable Architecture at Stanford and am currently doing my masters in Urban Design and City Planning in London!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am available for Academic Mentoring as well as Passion Project help and am able to help students with subjects / topics related to language learning (Spanish and Portuguese), literature, biology, and urban studies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've tutored for some of these subjects informally in the past and helped mentor international freshmen at Stanford the past two years. I'm a native Spanish speaker and am certified Advanced for Portuguese. I feel confident in my ability to help students learn or practice either language, especially understanding and having recently encountered the difficulties and common problems that come in the process. For literature, I am able to help with test preparation for college admissions, as well as with writing and literary analysis. My main accomplishment in this area has been winning the Outstanding Undergraduate Essay Award the past two years for essays I wrote for some of my Latin American literature classes at Stanford. My most recent teaching experience was as the studio assistant at Stanford's Community Printshop, helping students learn how to use our different machines, come up with and work through projects ranging from individual prints to self bound books. In terms of skills I can help students practice or develop, organization, time management, and analytical thinking are ones that come easily to me.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love going on walks, reading (I really enjoy fiction and poetry), doing ceramics, printing (I love letterpress!), and spending time outdoors with my dogs (one pictured above!). One other fun fact about me is that for the past three years, I lived in a cooperative house on campus, which means I lived with around 30 other students in a self-maintained house. Three of us would take turns either cooking dinner for everyone each night or helping clean and maintain the house. It is one of the things I most enjoyed about Stanford and it helped me learn how to build community and engage with people different from myself.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI hope at least one of the things I have shared resonates with you and I'm excited for the possibility of working together soon!\u003c/p\u003e","teachingVideoPlaybackId":"AvO1iOxyXdMBMZyftYwDakuEwlFlZWXH00U0223bPQAUk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"96c903a8-0b2f-4d46-ab2a-21c3aeed6994\"}"},{"__ref":"Favorites:{\"uuid\":\"6b0918ae-c3ae-4feb-ba13-70af35b7cd86\"}"},{"__ref":"Favorites:{\"uuid\":\"bf2ed6fb-6a3d-4568-9b88-d834c5df0ed5\"}"}],"causesSupported":[],"major":"Human Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"18ef673d-f2b4-4778-88f1-2a85359b9626\"}"},{"__ref":"DeepDives:{\"uuid\":\"a97c7aaa-bf30-4e44-99e3-0976f852f3f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"51ca78d8-ad76-4963-beac-6c5b99c86121\"}"},{"__ref":"DeepDives:{\"uuid\":\"46095586-5fa8-46f4-8bd1-5094e3192781\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/753b4a0a-ef41-46e6-b56c-89972b52a2fd/-/preview/-/format/jpg/","https://ucarecdn.com/3ac41d2f-43c8-440c-807d-ff15090df6ac/-/preview/-/format/jpg/","https://ucarecdn.com/c62979c8-5649-421f-b76c-d91ebbd01373/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"043bd946-449f-42a6-ab8a-c765af38e739\"}"},{"__ref":"Education:{\"uuid\":\"2e6ea203-4b56-443d-8ca9-03760b82b8e9\"}"}],"hiredAt":"2026-01-28T18:09:58.176Z","topics":["K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","Writing","Spanish","Executive Function","Reading","Academic Coaching","College Essay Writing","K-6 Storybook","Video / Photography","Visual Arts / Graphic Design","Creative Writing","Medicine / Health","STEM Project","Sustainability"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"galia-santanaoikawa\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f7256104-92f9-463e-8940-8c2a36ea932f\"}"}}},"_sentryTraceData":"72c43836ab364a69b20c9c142404e62a-b8a2c245af53fc0d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4
