xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0cc9e25e-bf25-4bba-b810-074846e3c1fe\"}":{"__typename":"Favorites","uuid":"0cc9e25e-bf25-4bba-b810-074846e3c1fe","photoUrl":"https://ucarecdn.com/0ef3980d-e8f2-4580-8c38-7e1e8ec0d501/","title":"Kevin Garnett","type":"ATHLETE"},"Favorites:{\"uuid\":\"738529a2-fecb-4cc5-abab-06ef02c636af\"}":{"__typename":"Favorites","uuid":"738529a2-fecb-4cc5-abab-06ef02c636af","photoUrl":"https://ucarecdn.com/a2b25c54-91f4-4a19-af21-3b1151fc70f0/","title":"Moonrise Kingdom","type":"MOVIE"},"Favorites:{\"uuid\":\"1f148bc5-7216-40e1-9fd1-a935f1d87a73\"}":{"__typename":"Favorites","uuid":"1f148bc5-7216-40e1-9fd1-a935f1d87a73","photoUrl":"https://ucarecdn.com/bbd662af-7321-4d42-9abb-38f141cc6d03/","title":"Kolyma Tales","type":"BOOK"},"CausesSupported:{\"uuid\":\"47a7ea77-774c-44c9-891a-51ae35fac8f9\"}":{"__typename":"CausesSupported","uuid":"47a7ea77-774c-44c9-891a-51ae35fac8f9","name":"The Exoneration Initiative","description":"\u003cp\u003eThey connect good lawyers doing pro-bono work with prisoners seeking exoneration\u003c/p\u003e","photoUrl":"https://ucarecdn.com/a912bcd9-a8e1-431f-a7a6-775987e42c55/"},"CausesSupported:{\"uuid\":\"b121b289-6b94-4077-b91f-215258d17db9\"}":{"__typename":"CausesSupported","uuid":"b121b289-6b94-4077-b91f-215258d17db9","name":"Jumpstart","description":"\u003cp\u003eProvide literacy and language tutoring for kids of underprivileged communities\u003c/p\u003e","photoUrl":"https://ucarecdn.com/4fe3a986-8024-4213-aa29-80d7311f9d38/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"fbd52228-a230-49fa-b56e-4857592278ec\"}":{"__typename":"DeepDives","uuid":"fbd52228-a230-49fa-b56e-4857592278ec","content":"\u003cp\u003eMy piece of advice for my younger self would be to remain intellectually curious when outside of the classroom. While I've had the privilege of having great teachers, so of my best and most enjoyable learning has been through exploring topics I enjoy on my own. This is a relatively new pursuit for me, but one that I wish I had begun earlier as it has made my learning process during the school year much better.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e842083a-879a-4d58-9695-c97feaf88335\"}":{"__typename":"DeepDives","uuid":"e842083a-879a-4d58-9695-c97feaf88335","content":"\u003cp\u003eMentorship matters to me because it is a reward to see students improve upon their shortcomings. School can be challenging and frustrating, so being allowed to make that day0to-day process slightly easier or more fun is a perfect reward for me. I also have had the privilege of being taught by brilliant teachers, and see mentorship as a good way to redistribute the knowledge they've given me over the years.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2842d1ca-2f3f-4ed9-8df5-d552f7dfe5d6\"}":{"__typename":"DeepDives","uuid":"2842d1ca-2f3f-4ed9-8df5-d552f7dfe5d6","content":"\u003cp\u003eMy dream job is to be a criminal justice attorney. Having gotten to work with an inmate seeking exoneration, my life's path was changed quite a bit. While I'd always loved the idea of law, I'd never seen how the law can be used to break people down. Having now seen that, I would like to pursue a career in criminal justice as I want to use the powers of the state and law to build up individuals and communities rather than tear them down.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"08f8aaa0-b564-49de-8a05-d4380824dc9f\"}":{"__typename":"DeepDives","uuid":"08f8aaa0-b564-49de-8a05-d4380824dc9f","content":"\u003cp\u003eI tore both of my ACLs while in high school, and my physical therapist was a constant source of encouragement and hope. My physical therapist would be wide awake at 5:30am every Monday, Wednesday, and Friday, waiting for me to begin PT. Without fail he was always energetic and excited about whatever progress I made on that day or in that week. His commitment to someone else, his overwhelmingly positive attitude, and source of energy were all aspects of him that I admire and hope to replicate in the future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"76060d15-f70e-45ca-8392-6deb701d11c0\"}":{"__typename":"School","uuid":"76060d15-f70e-45ca-8392-6deb701d11c0","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37240"},"Education:{\"uuid\":\"8ebe5959-ade3-49df-98c4-2b610781c62a\"}":{"__typename":"Education","uuid":"8ebe5959-ade3-49df-98c4-2b610781c62a","school":{"__ref":"School:{\"uuid\":\"76060d15-f70e-45ca-8392-6deb701d11c0\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Political Science/History","degree":"N/A"},"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}":{"__typename":"School","uuid":"375c6521-abfd-4666-859e-1190f187c648","name":"Collegiate School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10069"},"Education:{\"uuid\":\"afdcc5a4-cef9-4666-9afb-e40dc52ce8da\"}":{"__typename":"Education","uuid":"afdcc5a4-cef9-4666-9afb-e40dc52ce8da","school":{"__ref":"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}"},"startYear":"2008","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"f826127c-6c79-4c5a-955c-49e88cfc4a61\"}":{"__typename":"MentorPublicProfile","uuid":"f826127c-6c79-4c5a-955c-49e88cfc4a61","displayName":"Charlie H.","slug":"charlie-herrman","biography":"Charlie is a student at Vanderbilt University with a double-major in Political Science and History and on course to graduate in 2025. Charlie attended Collegiate School for high school in NYC, focusing on the humanities and partaking in activities including participation in criminal justice reform, newspaper publishing, curation of a sports blog, and playing basketball and soccer competitively. I describe myself as a curious and inquisitive student, translating these skills to my teaching style by letting the student lead. My priority as a mentor is to help people enjoy the material they engage with, as I believe with greater interest comes better results. I also seek to develop more technical writing and reading skills, as well as developing a distinct voice and writing style.","teachingVideoPlaybackId":"getWE021lSqpaVbtdIRt2EUUBGX00CxQ02nTfnmSTEq01YQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was completing my ACL recovery within seven months. As a sophomore in high school I had torn my ACL playing basketball, and my only hope was to be back for my junior year season. With surgery in June and the average ACL recovery roughly 9 months, I knew I'd have to work my tail off to be back on the team by January. However, after PT four days a week for seven months, I was finally healthy enough to play, and I completed my goal. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0cc9e25e-bf25-4bba-b810-074846e3c1fe\"}"},{"__ref":"Favorites:{\"uuid\":\"738529a2-fecb-4cc5-abab-06ef02c636af\"}"},{"__ref":"Favorites:{\"uuid\":\"1f148bc5-7216-40e1-9fd1-a935f1d87a73\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"47a7ea77-774c-44c9-891a-51ae35fac8f9\"}"},{"__ref":"CausesSupported:{\"uuid\":\"b121b289-6b94-4077-b91f-215258d17db9\"}"}],"major":"Political Science/History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fbd52228-a230-49fa-b56e-4857592278ec\"}"},{"__ref":"DeepDives:{\"uuid\":\"e842083a-879a-4d58-9695-c97feaf88335\"}"},{"__ref":"DeepDives:{\"uuid\":\"2842d1ca-2f3f-4ed9-8df5-d552f7dfe5d6\"}"},{"__ref":"DeepDives:{\"uuid\":\"08f8aaa0-b564-49de-8a05-d4380824dc9f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/73521a68-cd9b-4057-a124-664ccd078c49/-/crop/485x485/84,200/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8ebe5959-ade3-49df-98c4-2b610781c62a\"}"},{"__ref":"Education:{\"uuid\":\"afdcc5a4-cef9-4666-9afb-e40dc52ce8da\"}"}],"hiredAt":"2022-11-28T20:40:39.000Z","topics":["Writing","History Project","Journalism","Race \u0026 Ethnicity","Law / Government / Policy","World Cultures","History","Literature","Public Speaking"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/3fe96660-66b0-4395-b48d-3044e8987993/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"charlie-herrman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f826127c-6c79-4c5a-955c-49e88cfc4a61\"}"}}},"_sentryTraceData":"2f16aa56274e471e9bfedec66d23708b-9f912ff50bab367d-0","_sentryBaggage":"sentry-envir
