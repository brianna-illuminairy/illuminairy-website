ntration","degree":null},"MentorPublicProfile:{\"uuid\":\"0b14c347-294b-4372-b7a8-bd343b6fa9e5\"}":{"__typename":"MentorPublicProfile","uuid":"0b14c347-294b-4372-b7a8-bd343b6fa9e5","displayName":"Ciara O.","slug":"ciara-ortizdiaz","biography":"\u003cp\u003eHi! My name is Ciara Ortiz-Diaz, and I am a senior at Yale University majoring in History of Art and Art with a concentration in painting and printmaking. Coming from an under-resourced high school, I did not have the opportunity to take History of Art courses or art classes. This shaped me into someone who leans into curiosity and embraces the unfamiliar. In both my academic pursuits and personal endeavors, I have continuously pushed myself beyond familiar boundaries.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLooking back on my academic journey, I see a pattern of diverse interests. I distinctly remember beginning high school with a keen interest in environmental studies; however, my curiosity soon pulled me towards public health, then education policy. Before I knew it, I was taking my first History of Art and Studio Art courses during my first semester at Yale. Since then, I've discovered a field that truly satisfies my curiosity, and I am eager to learn more. This experience has fueled my passion for making art history and art education accessible! Since then, I've discovered a field that truly satisfies my curiosity, and I am eager to learn more. This experience has fueled my passion for making art history and art education accessible!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my time at Yale, I have had the opportunity to study at the Film and TV School of the Academy of Performing Arts (FAMU) in Prague and received various fellowships that permitted me to conduct archival art history research and make art in Europe. Currently, I am a Fulbright-Harriet Hale Woolley Award in the Arts semi-finalist. Furthermore, some of my extracurricular activities at Yale include costume designing, working on student film sets, and prose editing for the student publication DOWN.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy teaching philosophy centers around creating accessible paths to art and art history for students of all backgrounds, drawing from my own experience of discovering these fields despite limited early exposure. My approach emphasizes cultivating curiosity, embracing unfamiliar perspectives, and empowering students to forge their own meaningful connections with artistic traditions, just as I have done throughout my academic journey.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I am not in the print shop or in my studio, I am probably reading, listening to music, watching a movie, or spending time with my friends!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you are looking for a tutor who is committed to helping you lean into your curiosity and embrace the unfamiliar, I would be honored to be part of your journey!\u003c/p\u003e\u003cbr\u003e\u003cp\u003exC\u003c/p\u003e","teachingVideoPlaybackId":"IwAVTtDfOr4MlhLREXtt6ej02yiS6pH00yul48XRZs7Ds","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am really proud of solo traveling across Europe for two months after my sophomore year. I had to navigate different countries, cultures, and languages independently–shaping me into who I am today. I had an incredible experience and learned so much about myself and the world around me (:\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"4979a819-39d1-405b-a599-f133c278d06d\"}"},{"__ref":"Favorites:{\"uuid\":\"a8015898-17f1-4f46-bcef-062a1fe3d07b\"}"},{"__ref":"Favorites:{\"uuid\":\"b0a4a5f6-401a-4e60-812d-d0befbb39dc0\"}"}],"causesSupported":[],"major":"History of Art and Art painting/printmaking concentration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e228456c-dada-4369-9643-1a521758435a\"}"},{"__ref":"DeepDives:{\"uuid\":\"422f0b2e-62d0-4b51-98d8-9efeb1f37e44\"}"},{"__ref":"DeepDives:{\"uuid\":\"b14f4e1b-5823-4807-a6ae-5a87a5597161\"}"
