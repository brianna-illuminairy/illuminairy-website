d Curious Cardinals because, as a FLI student, he recognizes and understands how inaccessible a quality education and mentorship can be. He is beyond thankful to be where he is and honored for the opportunity to share his knowledge and skills to anyone that would like to explore a certain topic or personal passion. In high school, Alex primarily focused his time as captain of Brophy College Preparatory's Quiz Bowl and Science Bowl teams and as president of the Future Physician club. What really excited Alex, however, was writing, and he felt the most comfortable studying the elements of comedy and writing for his high school's satire newspaper. Alex has gone through the gauntlet of trying out new projects: from starting and co-hosting a satirical podcast to meeting the founders of JUUL and tackling the e-cigarette epidemic to researching less invasive biodevices to monitor longitudinal health, Alex always works to make sure what he does is, if anything, exciting to him! In his free time, Alex loves watching movies, enjoying live music, and traveling to new places. In the same vein, he is currently living in the Canary Islands (Spain) as a Fulbright Scholar, teaching English, biology, and math to middle school students.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History, Human Biology, Epidemiology","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/3e062f02-5fdf-4e7a-97f1-a31beb7f3250/-/crop/926x925/10,14/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0741ebd6-6b57-4873-a1b1-2377c1ca4dd3\"}"},{"__ref":"Education:{\"uuid\":\"415a167e-21fd-4f5f-bd5f-9334e83e47f4\"}"}],"hiredAt":"2022-11-02T23:06:52.000Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","6-8 Grade Science","Biology","Writing","Academic Coaching","College Essay Writing","Executive Function","History","Creativ
