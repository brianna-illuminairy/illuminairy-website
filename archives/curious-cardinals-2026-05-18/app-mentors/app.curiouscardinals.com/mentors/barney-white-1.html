xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fb276c77-e2cb-44e6-a079-4f89fb6ef281\"}":{"__typename":"Favorites","uuid":"fb276c77-e2cb-44e6-a079-4f89fb6ef281","photoUrl":"https://ucarecdn.com/4675defd-6c17-46cf-b372-89116006aca1/","title":"Jon Bernthal","type":"ACTOR"},"Favorites:{\"uuid\":\"c3870491-5b4f-48f4-915b-667d9edb2f56\"}":{"__typename":"Favorites","uuid":"c3870491-5b4f-48f4-915b-667d9edb2f56","photoUrl":"https://ucarecdn.com/256f25db-89ab-478d-b5f4-2e85d0c05c66/","title":"Drake ","type":"ARTIST"},"Favorites:{\"uuid\":\"bfd8ea7d-f5ec-4537-bc51-4afe464440f5\"}":{"__typename":"Favorites","uuid":"bfd8ea7d-f5ec-4537-bc51-4afe464440f5","photoUrl":"https://ucarecdn.com/b9533831-e636-4e27-a6e0-ace32bdce24b/","title":"CHELSEA","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"21340dc2-c126-4955-8d97-879b348cf484\"}":{"__typename":"CausesSupported","uuid":"21340dc2-c126-4955-8d97-879b348cf484","name":"Cerebal Palsy Trust","description":"\u003cp\u003eRunning a half marathon to raise money for CPT\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5cf275e9-cc80-4433-83a4-36610acf2caa\"}":{"__typename":"DeepDives","uuid":"5cf275e9-cc80-4433-83a4-36610acf2caa","content":"\u003cp\u003eTry anything you enjoy! You have more time than you realise and when you're younger. Finding your passion or hobby and being able to pursue it when you have I believe is vital for sucess!!! Whether it be in any department (music, travelling, business, sports etc) it's the prime for you to explore and really find what interests you. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a32514cf-3a01-451b-aed4-50aca2b6a254\"}":{"__typename":"DeepDives","uuid":"a32514cf-3a01-451b-aed4-50aca2b6a254","content":"\u003cp\u003eBeing able to guide and help people has always been a massive thing for me. I love learning and discovering new boundaries, and it brings me so much satisfaction seeing others enjoying new areas or building on one's they have little knowledge of. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d5b61346-7566-4466-ba66-08d799dc8288\"}":{"__typename":"DeepDives","uuid":"d5b61346-7566-4466-ba66-08d799dc8288","content":"\u003cp\u003eTo run a marathon. Running has always been a despised activity of mine only up until this year. After lots of self drive and commitment, I now not only enjoy it but find it easier!! It bring so much mental clarity and fulfilment to my day. It's a humungous goal of mine that I want to run one before I'm 21 but little steps go a long way and if you don't push yourself outside of you're comfort zone, are you taking life too steadily? \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a20556b3-05af-4408-bbb9-9a983555e771\"}":{"__typename":"DeepDives","uuid":"a20556b3-05af-4408-bbb9-9a983555e771","content":"\u003cp\u003eAt school, I really enjoyed the subjects of physics and maths. There was a big challenge for me to take on, being dyslexic and covering lots of content, but I could really resonant with these subject and eventually came to great grips with them. I love building and fixing random things and thought this combination led me to my decision of studying Mechanical and Electrical engineering at university. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"d9e55d6a-e709-435a-b992-32f254f9e8a5\"}":{"__typename":"School","uuid":"d9e55d6a-e709-435a-b992-32f254f9e8a5","name":"Wellington College","city":"Crowthorne","type":"HIGH","state":"Berkshire","country":"United Kingdom","zip":"RG45 7PU"},"Education:{\"uuid\":\"9decadc8-df9a-4a6e-9b31-51bfa2e8db77\"}":{"__typename":"Education","uuid":"9decadc8-df9a-4a6e-9b31-51bfa2e8db77","school":{"__ref":"School:{\"uuid\":\"d9e55d6a-e709-435a-b992-32f254f9e8a5\"}"},"startYear":"2018","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"789daf65-2263-4f88-a48d-5a9450ee32b5\"}":{"__typename":"School","uuid":"789daf65-2263-4f88-a48d-5a9450ee32b5","name":"University of Bath","city":"Bath","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"BA2 7AY"},"Education:{\"uuid\":\"8f5466b1-42ac-467d-87b1-c6497dc60127\"}":{"__typename":"Education","uuid":"8f5466b1-42ac-467d-87b1-c6497dc60127","school":{"__ref":"School:{\"uuid\":\"789daf65-2263-4f88-a48d-5a9450ee32b5\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Integrated Mechanical and Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"c33e96c9-aa78-437d-87cf-09dbc66c5191\"}":{"__typename":"MentorPublicProfile","uuid":"c33e96c9-aa78-437d-87cf-09dbc66c5191","displayName":"Barney W.","slug":"barney-white-1","biography":"\u003cp\u003eHi, I’m Barney, and I’m thrilled at the opportunity to support students through peer mentoring! Now at university, I bring both experience and enthusiasm to every session, driven by a genuine passion for helping others succeed.\u003c/p\u003e\u003cp\u003eMy mentoring journey began by supporting my younger siblings with their academics, which quickly grew into a deep interest in teaching and guiding others. I’ve since taken on key leadership roles, Head of my boarding house and Head of School, which have strengthened my communication skills and taught me how to support students with a wide range of learning styles and needs. As captain of my college’s second rugby team, I’ve also developed valuable skills in teamwork, motivation, and resilience, qualities that sit at the heart of my mentoring style.\u003c/p\u003e\u003cp\u003eOutside the classroom, I’m a huge sports enthusiast; rugby, football (soccer), hockey, and tennis are my favourites. I LOVEEE sports! I find them not only a great outlet for stress but also a brilliant way to bring energy and creativity into learning. I often use sports-based analogies to make complex concepts more relatable and engaging.\u003c/p\u003e\u003cp\u003eMy approach to mentoring is friendly, flexible, and goal-oriented. I make a conscious effort to understand each student’s individual learning style and tailor our sessions accordingly. Being slightly dyslexic myself, I know how challenging learning can be at times, and I’m passionate about using a variety of methods, such as mini quizzes, research tasks, constant questioning, and my personal favourite: acronyms! To keep sessions dynamic and exciting.\u003c/p\u003e\u003cp\u003eWhether you’re aiming to boost confidence, master a tricky topic, or simply find joy in learning, I’d love to help you get there!\u003c/p\u003e","teachingVideoPlaybackId":"bqy9FKgEomkluTHGOKiG6hGg8c01hNuKf72WgkJDzMUk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am currently on a journey of cutting out my favourite foods - chocolate and sweets. Starting the new year, I wanted to really challenge myself. I had never really taken care of the food I eat and it came to my realisation one day that I was consuming at least 2+ chocolate bars a day as well as a whole bag of sweets. The typical 'new year, new me' decided to take on the challenge of cutting them completely out of my life for 2025 and I'm not sure if I'm going to go back! I have since lost 10kg passively purely from cutting these out my diet, as well as picked up running and am aiming to do a half marathon this year. I hope this continues for me, as it's been a massive game changer to my lifestyle and the way I treat my body. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"fb276c77-e2cb-44e6-a079-4f89fb6ef281\"}"},{"__ref":"Favorites:{\"uuid\":\"c3870491-5b4f-48f4-915b-667d9edb2f56\"}"},{"__ref":"Favorites:{\"uuid\":\"bfd8ea7d-f5ec-4537-bc51-4afe464440f5\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"21340dc2-c126-4955-8d97-879b348cf484\"}"}],"major":"Integrated Mechanical and Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5cf275e9-cc80-4433-83a4-36610acf2caa\"}"},{"__ref":"DeepDives:{\"uuid\":\"a32514cf-3a01-451b-aed4-50aca2b6a254\"}"},{"__ref":"DeepDives:{\"uuid\":\"d5b61346-7566-4466-ba66-08d799dc8288\"}"},{"__ref":"DeepDives:{\"uuid\":\"a20556b3-05af-4408-bbb9-9a983555e771\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/401fa95b-325b-4ecf-81a1-aa680b678d9a/-/preview/-/format/jpg/","https://ucarecdn.com/43a8c142-e1b4-4d73-b947-f239b4f97d11/-/preview/-/format/jpg/","https://ucarecdn.com/b31bc05d-83f1-4f4b-a68d-2e9dd91dfad3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"9decadc8-df9a-4a6e-9b31-51bfa2e8db77\"}"},{"__ref":"Education:{\"uuid\":\"8f5466b1-42ac-467d-87b1-c6497dc60127\"}"}],"hiredAt":"2025-05-28T14:37:59.741Z","topics":["Algebra I","Algebra II","Calculus"
