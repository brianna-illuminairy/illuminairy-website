xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"dfee49dc-1d53-43dd-af97-8b0bab286fb9\"}":{"__typename":"DeepDives","uuid":"dfee49dc-1d53-43dd-af97-8b0bab286fb9","content":"\u003cp\u003e1) Be Nerdy! The world is full of incredible cool things, it is okay to get excited about them! If something is interesting to you, actively pursue it.\u003cbr\u003e2) Do things you are bad at! There is so much fun and beauty in learning something new, watching yourself improve is always fulfilling. Also, give yourself credit when you see yourself improving. \u003cbr\u003e3) Don't try to plan too far ahead. Do what excites you now and see where it takes you.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1adf3af3-93f4-45a4-b97c-f2e93f8a2183\"}":{"__typename":"DeepDives","uuid":"1adf3af3-93f4-45a4-b97c-f2e93f8a2183","content":"\u003cp\u003eI hope to ski every continent. I grew up in Colorado skiing every winter, and I have a love for the sport and for the feeling of going fast. I also love to travel, explore, and try new things. So, I hope to combine these loves through skiing my way across the world!  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"248b7357-a241-4765-a11f-d17d5875e105\"}":{"__typename":"DeepDives","uuid":"248b7357-a241-4765-a11f-d17d5875e105","content":"\u003cp\u003eI am a woman and a member of the LGBTQIA community. I have seen the ways these identities can impact academic pursuits of the sciences and careers in STEM. I firmly believe in the power of diverse minds - there is beauty and power in in the unique ways someone learns. When tutoring, I aim to understand how someone learns and help them better understand how their unique mind can be a powerful tool in accomplishing their dreams.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"36bfa101-7eab-40db-a72a-52dd71133f71\"}":{"__typename":"DeepDives","uuid":"36bfa101-7eab-40db-a72a-52dd71133f71","content":"\u003cp\u003eI was uncomfortable in my body and with my identity. I was interested in pushing the bounds of what I am capable of, but unsure of how to do that. I was intimidated by the world and my place within it - not really grasping the extent of the impact I was and am capable of making.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"5f9f79c0-1d42-402c-af7f-7b5888ddbce7\"}":{"__typename":"School","uuid":"5f9f79c0-1d42-402c-af7f-7b5888ddbce7","name":"The Classical Academy - North Campus","city":"Colorado Springs","type":"HIGH","state":"Colorado","country":"United States","zip":"80921"},"Education:{\"uuid\":\"311e2957-2e85-414b-bb8b-cfa44cac6c74\"}":{"__typename":"Education","uuid":"311e2957-2e85-414b-bb8b-cfa44cac6c74","school":{"__ref":"School:{\"uuid\":\"5f9f79c0-1d42-402c-af7f-7b5888ddbce7\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"7ce405c0-a51b-4761-b466-e4b54e0c415b\"}":{"__typename":"Education","uuid":"7ce405c0-a51b-4761-b466-e4b54e0c415b","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Environmental Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"bb12dbdc-bf73-42ea-a754-51002f647498\"}":{"__typename":"MentorPublicProfile","uuid":"bb12dbdc-bf73-42ea-a754-51002f647498","displayName":"Catherine C.","slug":"catherine-casson","biography":"\u003cp\u003e👋 Hello, I'm Katie Casson! I'm a student at Dartmouth College, currently pursuing a degree in Environmental Engineering. I was originally born in Colorado Springs, Colorado, but currently live in New Hampshire while attending school and will be moving to New York City next year as I jump into my post-graduate career in Water Resource Engineering. \u003cbr\u003e 🌏 \u003cstrong\u003eBackground:\u003c/strong\u003e I hold a liberal arts degree in Engineering Sciences, providing me with a unique blend of interdisciplinary knowledge that enables me to answer questions across a wide range of subject matter. My liberal arts degree has enriched my education by exposing me to a wide range of academic subjects. Complementing this liberal arts foundation, my accredited engineering degree also equips me with a strong technical foundation. I chose Dartmouth Engineering because I believe that engineering, especially environmental engineering, is incredibly interdisciplinary and having experience across topics, and knowledge across seemingly random academic fields will make me a better, more effective engineer. As a neurodivergent, queer, female engineer with a liberal arts degree, I do not approach technical problems or projects in a classical way. I am constantly learning where my unique perspective and brain fits within the STEM world and I am eager to mentor others looking to do the same! \u0026nbsp; 🌱\u003c/p\u003e\u003cp\u003e🚗 \u003cstrong\u003eInterests:\u003c/strong\u003e\u0026nbsp; In full disclosure…I'm a bit of an adrenaline junkie and love anything that lets me go fast, push my body, and explore our incredible Earth. I enjoy climbing (bouldering and top-rope), skiing, backpacking, whitewater rafting, and skydiving! Despite being an engineering major, I also have a soft spot for reading, painting, and writing short creative pieces. I love silly little adventures and long days crafting. 🏔️\u003c/p\u003e\u003cp\u003e🌟 \u003cstrong\u003ePassion:\u003c/strong\u003e From designing eco-friendly buildings to managing water resources, I'm your go-to person for all things sustainable. I believe in the power of understanding how your mind works because through this understanding, you can truly drive impact in this world and accomplish all you could dream of. I'm particularly interested in ecological design techniques, which involve looking at the incredible ways nature has already solved problems and harnessing these awesome, and extremely effective processes in the things I engineer. Such designs often provide great solutions that do not negatively impact our world in the ways that technological solutions often do! 🌟\u003c/p\u003e\u003cp\u003e🌠 \u003cstrong\u003eMentorship Philosophy:\u003c/strong\u003e I believe in the power of innovative thinking and creativity. Together, we'll explore science, math, and the world of sustainability from all angles, fostering deep understanding and problem-solving skills. I am eager to meet the needs of my mentees and adjust our time together accordingly - I want to encourage and uplift awesome thinkers so that they too realize how freaking cool STEM, sustainability, and our world really is. 🌠\u003c/p\u003e","teachingVideoPlaybackId":"xjKPcOL7P7dwLDf4NhJ4Mqpwkv500jVQGcK2yglzku6Q","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Environmental Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dfee49dc-1d53-43dd-af97-8b0bab286fb9\"}"},{"__ref":"DeepDives:{\"uuid\":\"1adf3af3-93f4-45a4-b97c-f2e93f8a2183\"}"},{"__ref":"DeepDives:{\"uuid\":\"248b7357-a241-4765-a11f-d17d5875e105\"}"},{"__ref":"DeepDives:{\"uuid\":\"36bfa101-7eab-40db-a72a-52dd71133f71\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d0931963-2ad0-44c1-8faf-5816b8f69fa2/-/preview/-/format/jpg/","https://ucarecdn.com/2a72e927-f0c2-4c1c-8ad3-5bc7949c2b47/-/preview/-/format/jpg/","https://ucarecdn.com/70f2399b-6ef1-4cf9-b910-dae13aca853b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"311e2957-2e85-414b-bb8b-cfa44cac6c74\"}"},{"__ref":"Education:{\"uuid\":\"7ce405c0-a51b-4761-b466-e4b54e0c415b\"}"}],"hiredAt":"2023-10-25T08:34:41.043Z","topics":["Web Design","Product Design","History Project","Literature","Architecture","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","Geometry","Calculus","Algebra II","Algebra I","Chemistry","Biology","6-8 Grade Science","Physics","Writing","STEM Project"],"communityBadges":["https://ucarecdn.com/ceacbeeb-af28-4003-96cf-d977276b04ef/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"catherine-casson\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bb12dbdc-bf73-42ea-a754-51002f647498\"}"}}},"_sentryTraceData":"89c9c20641f04dc0a24a8367dcb18912-9e774d400088948e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=89c9c20641f04dc0a24a8367dcb18912,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"catherine-casson"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
