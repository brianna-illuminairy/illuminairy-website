xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9125380b-f255-4886-91b3-eed897634d2f\"}":{"__typename":"DeepDives","uuid":"9125380b-f255-4886-91b3-eed897634d2f","content":"\u003cp\u003eI chose to study Economics and International and Public Affairs because I’m interested in how systems, financial, political, and social, shape the way people live. Economics helps me understand incentives and decision-making, while Public Affairs challenges me to think about policy, equity, and global impact. Together, these majors let me explore how resources can be better directed to support people and communities, and how I can be part of building smarter, more inclusive solutions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e4516153-d991-4e32-8fdf-7bf0bd97a957\"}":{"__typename":"DeepDives","uuid":"e4516153-d991-4e32-8fdf-7bf0bd97a957","content":"\u003cp\u003eI’d tell my middle and high school self to stop trying so hard to have everything figured out. Some of the best things in my life, from my college path to my mentors to the projects I’ve loved most, came from being open to uncertainty and following curiosity, not a rigid plan. I’d also say: don’t be afraid to speak up. Your perspective has value, even if you’re still learning. And most importantly, asking questions isn’t a sign of weakness — it’s how growth starts.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"726de60a-715d-4a44-8a93-f1c14c58828c\"}":{"__typename":"DeepDives","uuid":"726de60a-715d-4a44-8a93-f1c14c58828c","content":"\u003cp\u003eMentorship matters to me because I know how much of a difference it made in my own life. Having someone just a few steps ahead who believed in me, challenged me, and took the time to listen gave me the confidence to take risks and grow. As a mentor now, I try to be that person for others. I want students to feel seen, supported, and empowered, not just to do well, but to believe they can shape their own path. Mentorship is how knowledge becomes confidence, and confidence becomes possibility.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"27e88177-500d-4666-9ca4-8b731cd36d28\"}":{"__typename":"DeepDives","uuid":"27e88177-500d-4666-9ca4-8b731cd36d28","content":"\u003cp\u003eI hope to help rethink how we use capital to create social impact. Whether through investing, public policy, or community innovation, I want to build systems that give more people the opportunity to thrive, especially those historically left out. I believe financial tools can serve the public good, and I want to spend my life helping prove that at scale. At a more personal level, I hope to always stay involved in teaching and mentorship. No matter what I do professionally, I want to keep showing up for students the way others showed up for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"28dc9414-39f2-4281-9471-f58ee71688b7\"}":{"__typename":"School","uuid":"28dc9414-39f2-4281-9471-f58ee71688b7","name":"The Hotchkiss School","city":"Lakeville","type":"HIGH","state":"Connecticut ","country":"USA","zip":"06039"},"Education:{\"uuid\":\"bb7ef86e-309c-4081-9771-63b3efb42000\"}":{"__typename":"Education","uuid":"bb7ef86e-309c-4081-9771-63b3efb42000","school":{"__ref":"School:{\"uuid\":\"28dc9414-39f2-4281-9471-f58ee71688b7\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"11029af9-488d-46f9-bc7b-f24018f31f21\"}":{"__typename":"Education","uuid":"11029af9-488d-46f9-bc7b-f24018f31f21","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Business Economics and International and Public Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"3878e380-a53c-418e-8997-355d565fc309\"}":{"__typename":"MentorPublicProfile","uuid":"3878e380-a53c-418e-8997-355d565fc309","displayName":"Jason S.","slug":"jason-shan","biography":"\u003cp\u003eHi! I’m Jason Shan, a student at Brown University studying Economics and International and Public Affairs. I care deeply about helping young people become confident, curious, and capable thinkers. Whether through academics, personal development, or communication skills, I aim to support students in becoming more self-assured and independent learners.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve been involved in speech and debate for over 10 years, and it’s played a huge role in shaping how I think, speak, and mentor. I’ve had the privilege of competing around the world, from South Africa to London and Panama. I was a finalist at the 2023 World Individual Public Speaking and Debating Championships in high school as a member of Team USA, and I recently attended the 2025 World University Debate Championships. These experiences taught me how to think under pressure, communicate with clarity, and approach challenges from multiple perspectives. For the past five years, I’ve been coaching and teaching debate to younger students, helping them grow not just as speakers but as confident individuals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Brown, I serve as President of 180 Degrees Consulting, where I lead over 40 students in advising nonprofits and social impact organizations. I’ve managed projects for clients around the world, from mental health nonprofits in Madagascar to local community organizations in Rhode Island. I also serve as Vice President of Engagement for the Brown Debating Union, organizing workshops and mentoring new members. On top of that, I’m a Peer Career Advisor at Brown’s Career Center, where I support students in finding internships, writing resumes, and exploring different academic or professional paths.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I’ve worked across both business and mission-driven sectors. I interned at Warner Bros Discovery on the ad sales research and strategy team, where I used audience data to guide media strategy. I also work at Top Tier Impact, a global climate innovation network, researching startups and organizing events that bring together investors and entrepreneurs building a more sustainable world.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat sets me apart as a mentor is my commitment to making students feel seen, heard, and supported. I don’t just focus on getting the right answer. I help students understand the “why” behind what they’re learning, ask better questions, and grow more confident over time. I believe mentorship should build long-term skills and self-belief. I care about helping students find their voice, take ownership of their ideas, and believe in their ability to succeed. I would be honored to work with your student and help them grow into their full potential.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I’m most proud of is qualifying for the 2023 World Individual Public Speaking and Debating Championships in South Africa, where I placed 14th Overall and 2nd among American speakers. It was the result of years of practice across a variety of events, including parliamentary debate, impromptu speaking, after dinner speaking, and interpretive reading.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEach event tested a different part of my skill set. Impromptu speaking challenged me to organize my thoughts in real time. After dinner speaking pushed me to combine humor and argument with intention. Interpretive reading required emotional connection and performance. Parliamentary debate demanded strategic thinking and teamwork. Together, they helped me become a more versatile and thoughtful communicator.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMore than the rankings, I’m proud of the growth that experience represented. It took consistency, patience, and a willingness to improve through feedback. Those are the same values I bring into mentorship. I work with students not just to improve their skills, but to build confidence, clarity, and a mindset that helps them succeed in whatever they choose to pursue.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Business Economics and International and Public Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9125380b-f255-4886-91b3-eed897634d2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4516153-d991-4e32-8fdf-7bf0bd97a957\"}"},{"__ref":"DeepDives:{\"uuid\":\"726de60a-715d-4a44-8a93-f1c14c58828c\"}"},{"__ref":"DeepDives:{\"uuid\":\"27e88177-500d-4666-9ca4-8b731cd36d28\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ff522001-830c-4c23-8323-3b29a6050964/-/preview/-/format/jpg/","https://ucarecdn.com/5d353888-4d75-4ee3-b167-9a0216e7af4d/-/preview/-/format/jpg/","https://ucarecdn.com/f65355d1-3249-4e71-8972-ffb6df53a72f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"bb7ef86e-309c-4081-9771-63b3efb42000\"}"},{"__ref":"Education:{\"uuid\":\"11029af9-488d-46f9-bc7b-f24018f31f21\"}"}],"hiredAt":"2025-07-07T12:13:58.272Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Writing","Academic Coaching","College Essay Writing","Economics","Reading","History","Business / Entrepreneurship","Finance / Investing","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jason-shan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3878e380-a53c-418e-8997-355d565fc309\"}"}}},"_sentryTraceData":"83e6abb6b4334c3198a355c3378eaa29-8b2681745664a3fb-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=83e6abb6b4334c3198a355c3378eaa29,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jason-shan"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerously
