js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"dd1c26b0-0b80-4c20-9351-e1a4ccbb041f\"}":{"__typename":"DeepDives","uuid":"dd1c26b0-0b80-4c20-9351-e1a4ccbb041f","content":"\u003cp\u003eI would tell myself to keep working hard and fully commit to what I’m doing. While I think I did work hard, I’ve come to realize there is absolutely no substitute for it. There are no shortcuts when it comes to getting better or achieving something meaningful.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere will be times where it means staying up late, putting in extra time, or missing out on other things, but that’s part of it. If you really want to do something well, you have to be willing to put in the work when it’s not easy or convenient.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d also remind myself that the effort compounds over time. The small things you do consistently end up making a big difference, even if you don’t see it right away. Staying disciplined and showing up every day matters more than anything else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"01861609-2c5b-4764-ba92-57a07be6c9bb\"}":{"__typename":"DeepDives","uuid":"01861609-2c5b-4764-ba92-57a07be6c9bb","content":"\u003cp\u003eIn high school, I was very involved both inside and outside the classroom. I balanced academics with athletics, and I was also committed to playing the saxophone, which was a big part of my experience. Learning an instrument taught me patience and consistency, especially since progress comes from showing up every day and improving little by little. It also gave me a different way to challenge myself outside of sports and academics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI took my classes seriously and focused on actually understanding material rather than just memorizing it. I was especially drawn to subjects that involved problem solving, where I could think through ideas step by step and figure things out for myself. Over time, I became more confident in how I approached school and more intentional about how I worked through challenges.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing an athlete also shaped a lot of my mindset. It taught me discipline, accountability, and how to perform under pressure. Balancing practices, games, and schoolwork helped me build strong time management habits and stay consistent even when things got busy.\u003c/p\u003e\u003cp\u003eOverall, I would describe myself as someone who was motivated, curious, and always trying to improve. I liked pushing myself in different areas and figuring out how to get better over time, whether that was in the classroom, on the field, or through music.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"17c46160-e1e3-4ff9-ac04-31d1f249a5de\"}":{"__typename":"DeepDives","uuid":"17c46160-e1e3-4ff9-ac04-31d1f249a5de","content":"\u003cp\u003eI’m a big believer in giving back, especially because I’ve seen how much of a difference it can make. One thing I’ve learned is that having someone you can ask questions to, or get advice from who has already gone through the same process, is one of the most valuable things you can have. Whether it was older students, teammates, or mentors, I’ve been in that position where someone helped me think through decisions and gave me perspective I wouldn’t have had on my own.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat’s a big reason why I’m interested in mentorship. I want to be able to provide that same kind of support for someone else, whether that’s helping with school, talking through goals, or just being someone they can go to with questions. I know how helpful it was for me, and I want to pass that along.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the end of the day, mentorship isn’t just about teaching something specific. It’s about helping someone feel more confident, more prepared, and more comfortable figuring things out for themselves. That’s what I try to bring to it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1ffb0a81-3ff7-4c5d-8185-1b0962706468\"}":{"__typename":"DeepDives","uuid":"1ffb0a81-3ff7-4c5d-8185-1b0962706468","content":"\u003cp\u003eMy biggest source of motivation is my family. They’ve poured so much into me over the years, whether it’s time, support, or opportunities, and that’s something I don’t take for granted. It’s a big reason why I push myself to do well and make the most of what I’ve been given.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA lot of what drives me is the idea of being able to give that same level of support to my own family one day. I want to be in a position where I can provide, create opportunities, and be there for others in the same way they’ve been there for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat sense of responsibility and gratitude is what keeps me focused and motivated every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"b9044f77-252e-406d-91e7-d31a33350824\"}":{"__typename":"School","uuid":"b9044f77-252e-406d-91e7-d31a33350824","name":"Hebron High School","city":"Carrollton","type":"HIGH","state":"Texas","country":"United States","zip":"75010"},"Education:{\"uuid\":\"41a2c09b-78ed-4001-915e-5cc9983a2c6d\"}":{"__typename":"Education","uuid":"41a2c09b-78ed-4001-915e-5cc9983a2c6d","school":{"__ref":"School:{\"uuid\":\"b9044f77-252e-406d-91e7-d31a33350824\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"7a62a960-ec87-4fdf-b67c-77059c1178a6\"}":{"__typename":"Education","uuid":"7a62a960-ec87-4fdf-b67c-77059c1178a6","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"9f7ae4a5-e65a-4602-a36a-a832a6687f29\"}":{"__typename":"MentorPublicProfile","uuid":"9f7ae4a5-e65a-4602-a36a-a832a6687f29","displayName":"Luke S.","slug":"luke-sharp","biography":"\u003cp\u003eI’m currently a freshman at the University of Pennsylvania studying Economics, originally from the Dallas area. I’m interested in finance and investing, but more broadly I enjoy understanding how people make decisions and how complex systems actually work in practice. I like taking ideas that seem complicated at first and breaking them down into something clear and intuitive, especially in a way that actually sticks.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Penn, I’m involved in the Wharton Investment and Trading Group, where I work on both real estate and technology investing teams. Through this, I’ve built financial models, analyzed companies, and developed investment ideas, focusing not just on what a company does, but why it performs the way it does over time. I’ve also spent time learning how investors think in practice, focusing on how they ask questions, break down businesses, and make decisions. That process has helped me become more structured and intentional in how I approach problems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I’m a varsity sprint football athlete, which has been one of the most formative parts of my experience so far. Balancing athletics, academics, and other commitments has taught me discipline, time management, and how to stay consistent even when things get busy. Being part of a team has also reinforced the importance of accountability and showing up for others. I’m also involved in community work through Big Brothers Big Sisters, where I mentor a younger student in West Philadelphia. That experience has strengthened my ability to communicate clearly and connect with someone at a different stage in their life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was involved across athletics and other activities, and I made the decision to step away from certain commitments to focus on where I could make the biggest impact. That experience taught me the value of prioritization and being fully committed to what I choose to pursue, which is something I carry with me now.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my goal is to make things make sense. Whether it’s explaining a concept, helping with schoolwork, or talking through bigger goals, I focus on clarity, structure, and building real understanding, not just memorization. I want students to leave sessions feeling more confident, more capable, and better equipped to think for themselves and solve problems independently.\u003c/p\u003e","teachingVideoPlaybackId":"XhE6RA7N4wfFURE02hbYnZBhXYZXBb1XAnCBKHKbcvrY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dd1c26b0-0b80-4c20-9351-e1a4ccbb041f\"}"},{"__ref":"DeepDives:{\"uuid\":\"01861609-2c5b-4764-ba92-57a07be6c9bb\"}"},{"__ref":"DeepDives:{\"uuid\":\"17c46160-e1e3-4ff9-ac04-31d1f249a5de\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ffb0a81-3ff7-4c5d-8185-1b0962706468\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f4a5a1ad-735c-45ab-97b8-9e7858d5a3f2/-/preview/-/format/jpg/","https://ucarecdn.com/96fcfd16-97f7-4297-88fa-e82ceb933fe0/-/preview/-/format/jpg/","https://ucarecdn.com/a36df5d3-00e8-405e-80f2-776c54807721/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"41a2c09b-78ed-4001-915e-5cc9983a2c6d\"}"},{"__ref":"Education:{\"uuid\":\"7a62a960-ec87-4fdf-b67c-77059c1178a6\"}"}],"hiredAt":"2026-04-14T20:33:05.756Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"luke-sharp\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9f7ae4a5-e65a-4602-a36a-a832a6687f29\"}"}}},"_sentryTraceData":"a168eaae78014503b00a4723a6b8c66d-8288930d93e56083-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=a168eaae78014503b00a4723a6b8c66d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"luke-sharp"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strateg
