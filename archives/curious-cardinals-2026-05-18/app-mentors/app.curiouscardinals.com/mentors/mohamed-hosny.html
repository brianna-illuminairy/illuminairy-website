xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c42492da-72ab-4f48-8ca2-01448b990e45\"}":{"__typename":"Favorites","uuid":"c42492da-72ab-4f48-8ca2-01448b990e45","photoUrl":"https://ucarecdn.com/923298b3-3214-4782-ba84-cf02c669ef9c/","title":"Good Will Hunting","type":"MOVIE"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2fbb03e6-6b2e-4edc-ad4a-c404fa369457\"}":{"__typename":"DeepDives","uuid":"2fbb03e6-6b2e-4edc-ad4a-c404fa369457","content":"\u003cp\u003eI aspire to one day become a systems engineer at a company like NVIDIA or a similar organization specializing in semiconductors and hardware.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat excites me most about this field is the opportunity to contribute to the development of systems where software and hardware work seamlessly together to create cutting-edge solutions. I find a lot of satisfaction in exploring how software can directly control and optimize hardware performance, as well as how hardware innovations enable new possibilities for software capabilities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSuch a role would be incredibly fulfilling because it aligns perfectly with my technical interests while fueling my curiosity and passion for innovation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"6431ff99-0743-4518-a2b6-fcd03e420a3c\"}":{"__typename":"DeepDives","uuid":"6431ff99-0743-4518-a2b6-fcd03e420a3c","content":"\u003cp\u003eI'm currently building a project where I create my own version of Dropbox, a cloud storage system that allows me to securely store and access my files from any device. The project focuses on implementing core features like user authentication, file uploads, sharing, and synchronization across devices, while also emphasizing privacy and data security. I’m using technologies like encryption for secure storage and authentication to ensure that my files are protected. It's a rewarding experience, as I’m learning more about cloud infrastructure, file management, and building systems that balance efficiency and security. Ultimately, I want to have complete control over my own cloud storage solution.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"88e0e195-62aa-48c7-9120-3870f988e8b5\"}":{"__typename":"DeepDives","uuid":"88e0e195-62aa-48c7-9120-3870f988e8b5","content":"\u003cp\u003eComing from a French high school education, navigating the college application process in the US was particularly challenging for me, especially since I wasn't sure what exactly I wanted to pursue. This uncertainty made the college application process difficult, and I faced many challenges along the way. However, once I arrived at Berkeley, the transition to the college system became much smoother, largely thanks to peer mentorship and academic tutoring. The knowledge I gained and the lived experiences of other students had a profound impact on my college journey, helping me discover my passion for what I'm pursuing today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI truly believe that student mentoring offers an insider’s perspective that resonates deeply with students, helping them feel more motivated and supported. Because of my own experiences, I want to ensure that more students receive this type of mentoring, tutoring, and guidance as they work towards their future, whether it's preparing for college, planning a career after high school, or exploring new areas of science and innovation out of curiosity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my time at Berkeley, I've had the privilege of mentoring students, both through academic internships where I tutored one-on-one in office hours and through my role in the Computer Science Mentors club. In both capacities, I’ve had the opportunity to support students and contribute to the development of content for introductory electrical engineering and computer science courses. From this experience, I've learned so much from students. It would be an understatement to say that some of the students I’ve mentored have taught me game changing study strategies, life hacks, and even new insights into various subjects. For me, mentoring is a two-way street—an opportunity to give back but also to learn. It’s changed my life and continues to play a significant role in shaping who I am.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost importantly, it’s incredibly rewarding to see young students learn new things, build, and grow as individuals. Seeing them succeed or achieve their goals, knowing that I may have had a positive impact on their journey, gives me a huge sense of fulfillment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e9fae2ad-52b5-441f-9572-426c6af566d4\"}":{"__typename":"DeepDives","uuid":"e9fae2ad-52b5-441f-9572-426c6af566d4","content":"\u003cp\u003eI chose my major because of my early curiosity about math and science. Growing up, I participated in La Course Aux Nombres, a French mathematics competition that emphasizes mental arithmetic and problem-solving skills. This experience sparked my interest in mathematics and led me to focus on STEM courses in high school, particularly math and physics. When applying to college, I wanted to expand those skills and use them to build cool stuff, so I decided to apply to engineering colleges to explore the world of science and technology.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Berkeley, the excitement around computer science classes in the dorms made me very curious, so I decided to take an introductory computer science course alongside a bioengineering course. I quickly realized that I was spending most of the semester deeply engaged with the CS class and thoroughly enjoying it. The following semester, I took another CS and electrical engineering class, where I discovered my passion for technology—especially how coding can be seen from a hardware perspective—and knew I wanted to pursue a career in it. That’s when I made the decision to major in Electrical Engineering \u0026amp; Computer Sciences (EECS).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"36f3b0e2-1c8f-4b25-a5f5-088e231b8120\"}":{"__typename":"School","uuid":"36f3b0e2-1c8f-4b25-a5f5-088e231b8120","name":"Lycée Français","city":"Paris","type":"HIGH","state":"France","country":"France","zip":"70123"},"Education:{\"uuid\":\"befeb0e2-7359-4c85-8408-1687d523b9e9\"}":{"__typename":"Education","uuid":"befeb0e2-7359-4c85-8408-1687d523b9e9","school":{"__ref":"School:{\"uuid\":\"36f3b0e2-1c8f-4b25-a5f5-088e231b8120\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":"2022","major":"Electrical Engineering \u0026 Computer Sciences","degree":null},"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}":{"__typename":"School","uuid":"dff4a26a-20c2-4281-9c2a-b500907e0661","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"382b297b-9626-4e79-bc79-8c6a20b0a69e\"}":{"__typename":"Education","uuid":"382b297b-9626-4e79-bc79-8c6a20b0a69e","school":{"__ref":"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}"},"startYear":"2022","endYear":"2026","expectedGradYear":"2025","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"50ddd2c8-2445-4bcc-9ee3-19e7f151666e\"}":{"__typename":"MentorPublicProfile","uuid":"50ddd2c8-2445-4bcc-9ee3-19e7f151666e","displayName":"Mohamed H.","slug":"mohamed-hosny","biography":"\u003cp\u003eHey! My name is Mohamed Hosny. Currently, I live in the San Francisco Bay Area, in Berkeley to be more specific, and study Electrical Engineering and Computer Sciences at UC Berkeley. I speak English and Arabic.\u003cbr\u003ePS: If you’re passionate about learning new languages like I am, I’d love to hear about any unique languages you think I should explore next and are easy to learn.\u003cbr\u003eGrowing up, playing water polo was a cornerstone of my life. I spent my summers attending camps and tournaments in Italy, Greece, Switzerland, Dubai, France, etc. These experiences helped me immerse myself in different cultures, broadening my perspective and teaching me invaluable lessons that continue to shape my outlook on life. They also taught me the value of teamwork, adaptability, and discipline—qualities I now bring into both engineering and mentorship.\u003cbr\u003eWhen I started college, I hadn’t written a single line of code. Seeing Python on a screen was very intimidating, but this challenge fueled my determination to learn and improve. Every moment at Berkeley has been a learning experience. Whether through personal or class projects, research, or internships, I’ve had countless opportunities to apply what I’ve learned and grow as an engineer.\u003cbr\u003eIn the beginning, I struggled with imposter syndrome, surrounded by peers who had years of coding and engineering experience. However, through mentorship and curiosity, I overcame these challenges. Older students guided me, teaching me how to start building projects, shift my perspective on coding, and view computer science as a career of endless growth. Through determination and consistent effort, I achieved meaningful progress and began to see the results of my hard work.\u003cbr\u003eThis journey inspired me to pay it forward by mentoring others. As an academic tutor in UC Berkeley’s Electrical Engineering and Computer Sciences department, I supported students with their computer science and robotics projects. I’ve also held multiple tutoring positions, helping students in mathematics, electrical engineering, and computer science. These roles allowed me to give back, deepen my understanding, and make a meaningful impact.\u003cbr\u003eDrawing from my personal journey, tutoring experience, and technical skills, I’m confident in my ability to inspire students and equip them with the tools needed to succeed. Lastly, the one thing I can guarantee is that every student I mentor will leave knowing how to code and think like an engineer—no prior experience required. Together, we will aim to inspire more students to explore STEM and pursue careers in this very exciting field. \u003c/p\u003e","teachingVideoPlaybackId":"3sIUnaxV0202Cq8OA54jlJQLJR02wgZIe5dMvVDtBUO7VA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI built a voice controlled car :)\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c42492da-72ab-4f48-8ca2-01448b990e45\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2fbb03e6-6b2e-4edc-ad4a-c404fa369457\"}"},{"__ref":"DeepDives:{\"uuid\":\"6431ff99-0743-4518-a2b6-fcd03e420a3c\"}"}
