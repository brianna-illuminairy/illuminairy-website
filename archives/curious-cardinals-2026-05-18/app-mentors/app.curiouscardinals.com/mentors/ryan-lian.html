xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"d0d20b81-c8bc-4f3a-8a2d-86c51e18fc2d\"}":{"__typename":"School","uuid":"d0d20b81-c8bc-4f3a-8a2d-86c51e18fc2d","name":"Albany High School","city":"Albany","type":"HIGH","state":"California","country":"United States","zip":"94706"},"Education:{\"uuid\":\"ee88fa68-d8bd-4a0e-9fdb-5413ab1675d6\"}":{"__typename":"Education","uuid":"ee88fa68-d8bd-4a0e-9fdb-5413ab1675d6","school":{"__ref":"School:{\"uuid\":\"d0d20b81-c8bc-4f3a-8a2d-86c51e18fc2d\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"46d97944-156a-476a-9363-a78912ae6cd1\"}":{"__typename":"Education","uuid":"46d97944-156a-476a-9363-a78912ae6cd1","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Design \u0026 Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"58437671-20cd-46f1-b67c-97f8a325d47e\"}":{"__typename":"MentorPublicProfile","uuid":"58437671-20cd-46f1-b67c-97f8a325d47e","displayName":"Ryan L.","slug":"ryan-lian","biography":"\u003cp\u003eRyan is currently a junior at Stanford passionate about AI and Design. Interested in the intersection of research and product, he hopes to reimagine the next generation of creative tools, make creativity accessible to all, and give back to the community. Outside of classes, he is conducting research at the Stanford AI Lab, finishing up an independent art project, and working as an art gallery attendant and studio assistant. He loves painting, cooking, baking, hiking, and spending quality time with his friends. \u003cbr\u003e\u003cbr\u003eBefore coming to Stanford, Ryan was obsessed with math, art, and learning. In eighth grade, out of boredom, he decided to self-study some math with Khan Academy and the mentorship of his math teacher. This initial exploration spiraled into a passion, and he ended up finishing all of high school math in 6 months. Ryan soon exhausted all of the community college courses freshman year of high school, and went onto self-studying through books and auditing graduate level courses at Yale. While immersed the elegant world of pure math, he also became captivated by the emotions and narratives in art, and started channeling his creativity into portrait painting. This love for learning inspired him to also dabble in anything from chemistry to oceanography. Ryan found learning communities in student organizations like the math club and science bowl, and gave back through student government, club presidency, and various committees in his school district. \u003cbr\u003e\u003cbr\u003eMentors and communities have played a quintessential role in Ryan's learning journey, and he has always wanted to inspire and help others in the same way. He worked as an instructor at Mathnasium for four years, served as a peer tutor at my high school, and worked as a TA for UC Berkeley's summer pre-calculus course. Most recently, he was a head TA for Stanford's worldwide, free, and online CS course, Code-in-Place. \u003cbr\u003e\u003cbr\u003eAt Curious Cardinals, he hopes to inspire and foster a supportive and curious community with more students!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Design \u0026 Computer Science","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/d1a3678a-ad54-4a6d-9c17-d3aa90576
