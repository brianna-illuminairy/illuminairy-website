xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"0a41188a-405b-4f4f-9f61-6337a5cdc289\"}":{"__typename":"School","uuid":"0a41188a-405b-4f4f-9f61-6337a5cdc289","name":"Francis W. Parker School","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60614"},"Education:{\"uuid\":\"604d2601-e166-4455-b30f-3fc7af3a3b40\"}":{"__typename":"Education","uuid":"604d2601-e166-4455-b30f-3fc7af3a3b40","school":{"__ref":"School:{\"uuid\":\"0a41188a-405b-4f4f-9f61-6337a5cdc289\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"45425620-06cd-406a-81fb-652bd00a5be5\"}":{"__typename":"Education","uuid":"45425620-06cd-406a-81fb-652bd00a5be5","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Near Eastern Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"837e7ccb-38ac-49c8-a006-af9209d99ffd\"}":{"__typename":"MentorPublicProfile","uuid":"837e7ccb-38ac-49c8-a006-af9209d99ffd","displayName":"Samuel K.","slug":"samuel-kagan","biography":"\u003cp\u003eHello 👋, my name is Sam. I graduated from Princeton in 2024, earning a degree in Near Eastern Studies with a minor in Journalism. I completed my studies \u003cem\u003esumma cum laude\u003c/em\u003e and was elected to Phi Beta Kappa.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy senior thesis, which examined the jurisprudential foundations of free expression law in the Middle East, was recognized with the Near Eastern Studies Department Prize for an Outstanding Senior Thesis. During a leave of absence from college in 2021, I relocated to Jerusalem, where I volunteered with an archaeological association and studied political conflict in the region.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Princeton, I was a John C. Bogle Fellow and received the Martin A. Dale Summer Award. I served as President of the Orange Key Guide Service and founded the award-winning Data section of The Daily Princetonian. I also participated in the Making An Exoneree program, where I sought the release of a wrongfully incarcerated individual through legal advocacy and reinvestigation.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, I taught extensively. I volunteered with Princeton's Community House, providing tutor-mentorship for low-income students in Mercer County. I also worked on Zoom, providing academic support to students with a variety of academic needs. Some of my favorite relationships included work in the craft of writing, executive functioning, and Model United Nations. Last spring, I won a Fulbright grant for teaching.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy professional experience includes evaluating acquisitions data on Capital One’s Upmarket Advanced Analytics team and contributing to policy development in the Office of Congressman Mike Quigley during the COVID-19 pandemic.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond school and work, I'm an avid runner and restless traveler. I've been to a baseball game at every stadium in the MLB, love anything by Ezra Klein or Michael Lewis, and often complete the (full-size!) New York Times crossword; I can always find something to buy at Uniqlo and I have an abiding passion for the Chicago bagel scene.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm excited to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"fhwZQ61ek8V02ZtaPActhWOvMTq00xyl800j4hVtNVYwsk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Near Eastern Studies","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/332e6576-c90e-4991-89d9-a69a8ac13793/-/preview/-/format/jpg/","https://ucarecdn.com/b674e9e3-39c9-46ee-9a4f-56e5f4ed59ec/-/preview/-/format/jpg/","https://ucarecdn.com/9e9ee0c4-7d19-49bb-967f-42b37c134bcb/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"604d2601-e166-4455-b30f-3fc7af3a3b40\"}"},{"__ref":"Education:{\"uuid\":\"45425620-06cd-406a-81fb-652bd00a5be5\"}"}],"hiredAt":"2024-07-24T15:39:10.460Z","topics":["Algebra I","Pre-Algebra","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","Sports Journalism","History Project","Business / Entrepreneurship","Finance / Investing","Law / Government / Policy","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/c280a6f3-ba14-4f52-b8c8-42e4bf341725/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"samuel-kagan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"837e7ccb-38ac-49c8-a006-af9209d99ffd\"}"}}},"_sentryTraceData":"875f97aecbef4d6bbe7421ce4bcc1393-b053dfac0349dc42-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=875f97aecbef4d6bbe7421ce4bcc1393,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"samuel-kagan"},"buildI
