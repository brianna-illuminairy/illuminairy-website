xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"128e8416-78c6-45d8-8e52-3b28008f0de2\"}":{"__typename":"DeepDives","uuid":"128e8416-78c6-45d8-8e52-3b28008f0de2","content":"\u003cp\u003ePursue your interests! While I did begin making music at fourteen, I had interest in doing so even earlier and stopped myself out of fear. There were also a few extracurricular activities that I never did purely out of fear, which I definitely regret. I would tell myself to always go after the things that excited me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7078123f-5a27-4b34-97cd-f9ef1c804a8f\"}":{"__typename":"DeepDives","uuid":"7078123f-5a27-4b34-97cd-f9ef1c804a8f","content":"\u003cp\u003eI never had a mentor for music or any of my hobbies, and I know that I could have really benefited from that guidance when I was younger. With the knowledge and experience I have now, I want to be that helping hand that I never had.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"65234013-6a66-433f-b2f9-e6ff7f0b0906\"}":{"__typename":"DeepDives","uuid":"65234013-6a66-433f-b2f9-e6ff7f0b0906","content":"\u003cp\u003eMy dream job would truly be to make music full time and integrate it with my work in therapy. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"8a58754a-942c-4be3-86eb-c55440940819\"}":{"__typename":"School","uuid":"8a58754a-942c-4be3-86eb-c55440940819","name":"West Orange High School","city":"West Orange","type":"HIGH","state":"New Jersey","country":"United States","zip":"07052"},"Education:{\"uuid\":\"25c18745-8cee-422d-a429-2754fa268e59\"}":{"__typename":"Education","uuid":"25c18745-8cee-422d-a429-2754fa268e59","school":{"__ref":"School:{\"uuid\":\"8a58754a-942c-4be3-86eb-c55440940819\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"c83aa5b5-e8c3-4692-a957-f17b62c548da\"}":{"__typename":"Education","uuid":"c83aa5b5-e8c3-4692-a957-f17b62c548da","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2027","major":"Professional Counseling","degree":null},"MentorPublicProfile:{\"uuid\":\"32b0bd66-d3d8-4803-b894-bbe246e76b93\"}":{"__typename":"MentorPublicProfile","uuid":"32b0bd66-d3d8-4803-b894-bbe246e76b93","displayName":"Kofi O.","slug":"kofi-opoku","biography":"\u003cp\u003eHello! My name is Kofi, and I'm currently a grad student in the University of Pennsylvania's Professional Counseling program. My interest in psychology first developed from my incredible AP Psychology teacher in high school, who opened my eyes to the power of authentic teaching and mentorship. After high school, I attended the University of Rochester to earn my Bachelor's Degree in Psychology and worked at several mental health organizations that specialized in serving the local community through research, social-emotional programs, and volunteer work. Much of my experience leading up to graduate school has been working with children and adolescents, who are the populations I have had the most joy in working with, as I learn just as much from them each day. I'm currently working to become a therapist, but in my free time, I am an avid gym goer, soccer lover, guitarist, producer, and writer. I began making music at 14, have released three albums and three EPs, accumulated tens of thousands of streams, and both produced and featured for numerous artists nationwide. I started to take music more seriously during the pandemic, and began experimenting and developing my sound day by day until I released my first project with no funding, no outside help, and no resources outside of my mind and the internet. For me, authenticity is the most important part of someone's character as well as the most important component to any piece of art. As your child's mentor, it is my aim to nourish their true passions and interests into concrete plans that they can then transform and execute. I not only want your child to come away with a finished piece they can be proud of, but also the skills to keep creating and releasing their art when no one is around to help. So much of the arts have been ensnared by monetary obsession and a lack of integrity, and I want our mentorship space to be a place in which they can focus on what's important: making meaningful work. I hope to help your child achieve their creative dreams and turn bright ideas into fully fledged projects!\u003c/p\u003e","teachingVideoPlaybackId":"WuNNgJPKL1uktECd9YhX025Ke15rEAeBiEX1tdt927Ls","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Professional Counseling","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"128e8416-78c6-45d8-8e52-3b28008f0de2\"}"},{"__ref":"DeepDives:{\"uuid\":\"7078123f-5a27-4b34-97cd-f9ef1c804a8f\"}"},{"__ref":"DeepDives:{\"uuid\":\"65234013-6a66-433f-b2f9-e6ff7f0b0906\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c246514a-42e5-4477-805f-a341ac3dbb10/-/preview/-/format/jpg/","https://ucarecdn.com/f8f13044-baf6-4a5e-b71b-b92aee8a5148/-/preview/-/format/jpg/","https://ucarecdn.com/b426d258-e9b9-451e-9457-ad721de6cef0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"25c18745-8cee-422d-a429-2754fa268e59\"}"},{"__ref":"Education:{\"uuid\":\"c83aa5b5-e8c3-4692-a957-f17b62c548da\"}"}],"hiredAt":"2026-02-02T18:54:24.083Z","topics":["Writing","College Essay Writing","Reading","Academic Coaching","Executive Function","Creative Writing","Music","Film / Theater","Sports Journalism","Video / Photography","Debate","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kofi-opoku\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"32b0bd66-d3d8-4803-b894-bbe246e76b93\"}"}}},"_sentryTraceData":"9f6dee8f783b4596a48624b4ecaf3003-9310f4d755a77b34-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9f6dee8f783b4596a48624b4ecaf3003,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"kofi-opoku"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=
