xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ccfc1d2a-68c0-40ef-90c1-2bd7f3d65dbf\"}":{"__typename":"Favorites","uuid":"ccfc1d2a-68c0-40ef-90c1-2bd7f3d65dbf","photoUrl":"https://ucarecdn.com/0786eb8f-4d28-4ec3-b0e3-165fd505288e/","title":"New York Times Spelling Bee","type":"GAME"},"Favorites:{\"uuid\":\"22df6bdd-9caa-418e-aed0-6a02cd7cb0e1\"}":{"__typename":"Favorites","uuid":"22df6bdd-9caa-418e-aed0-6a02cd7cb0e1","photoUrl":"https://ucarecdn.com/3b3bd565-c5d2-42e9-bced-ed472dc010e3/","title":"Chicago","type":"CITY"},"Favorites:{\"uuid\":\"0e0a6039-8b5e-4db6-9de8-488417fe6c30\"}":{"__typename":"Favorites","uuid":"0e0a6039-8b5e-4db6-9de8-488417fe6c30","photoUrl":"https://ucarecdn.com/71048684-2d93-4cb4-b62b-452488deaf92/","title":"The Wolves by Sarah DeLappe","type":"PLAY"},"CausesSupported:{\"uuid\":\"3eb56204-3a3f-4bc5-a0b2-abed94192ac5\"}":{"__typename":"CausesSupported","uuid":"3eb56204-3a3f-4bc5-a0b2-abed94192ac5","name":"Wreaths Across America","description":"\u003cp\u003eHonors veterans like my grandfather who served in the Vietnam War\u003c/p\u003e","photoUrl":"https://ucarecdn.com/d99c961e-b3f3-4f2c-801d-184b0653b02d/"},"CausesSupported:{\"uuid\":\"bb7783cc-7295-424e-9076-00e54bcc717c\"}":{"__typename":"CausesSupported","uuid":"bb7783cc-7295-424e-9076-00e54bcc717c","name":"PAWS Chicago","description":"\u003cp\u003eI am a volunteer at PAWS Chicago, caring for dogs in the animal shelter\u003c/p\u003e","photoUrl":"https://ucarecdn.com/6796f3ec-8528-4ab9-a86e-c873f5452a1d/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"de88e6ac-60be-4305-a452-a7783568f356\"}":{"__typename":"DeepDives","uuid":"de88e6ac-60be-4305-a452-a7783568f356","content":"\u003cp\u003eI would tell my middle or high school self that rest is important! I was a very busy, motivated student, but I did not always remember to take breaks. In the end, it is all about balance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"95feffaf-e4ee-4f80-8048-92a6478b203f\"}":{"__typename":"DeepDives","uuid":"95feffaf-e4ee-4f80-8048-92a6478b203f","content":"\u003cp\u003eI have experienced how meaningful it is to know that you have a mentor cheering you on and always willing to offer guidance. Mentoring relationships offer the mentor and mentee mutual opportunities for learning, and I appreciate this shared growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"2f4e2f24-2aa0-40d5-9d8e-b09697dee77e\"}":{"__typename":"DeepDives","uuid":"2f4e2f24-2aa0-40d5-9d8e-b09697dee77e","content":"\u003cp\u003eI enjoy crafts, podcasts, and puzzles! I also love spending time with my family and my dog, Miles.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a3bf025b-814c-47aa-875d-9dca2f8457e8\"}":{"__typename":"DeepDives","uuid":"a3bf025b-814c-47aa-875d-9dca2f8457e8","content":"\u003cp\u003eI worked at several outdoor theatres, performing in productions ranging from musicals, to Shakespeare, to a thriller!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"b0a51d7c-22bc-4c56-a634-626486fd68f2\"}":{"__typename":"School","uuid":"b0a51d7c-22bc-4c56-a634-626486fd68f2","name":"Cuyahoga Valley Christian Academy","city":"Cuyahoga Falls","type":"HIGH","state":"Ohio","country":"United States","zip":"44224"},"Education:{\"uuid\":\"dc404cb7-e898-482c-bcfc-7571f3c5bf07\"}":{"__typename":"Education","uuid":"dc404cb7-e898-482c-bcfc-7571f3c5bf07","school":{"__ref":"School:{\"uuid\":\"b0a51d7c-22bc-4c56-a634-626486fd68f2\"}"},"startYear":"2018","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"f5924bd2-9425-4d18-b11a-697d4610f32a\"}":{"__typename":"Education","uuid":"f5924bd2-9425-4d18-b11a-697d4610f32a","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Theatre (Entrepreneurship minor, Integrated Marketing Communications certificate)","degree":null},"MentorPublicProfile:{\"uuid\":\"1d4d9352-4198-4565-b467-3204ddb143ff\"}":{"__typename":"MentorPublicProfile","uuid":"1d4d9352-4198-4565-b467-3204ddb143ff","displayName":"Elise P.","slug":"elise-pakiela","biography":"\u003cp\u003eHi there! My name is Elise Pakiela (she/her), and I am a recent magna cum laude graduate of \u003cstrong\u003eNorthwestern University. \u003c/strong\u003eI was a student in the \u003cstrong\u003eSchool of Communication \u003c/strong\u003eand studied \u003cstrong\u003etheatre management, entrepreneurship, and integrated marketing communications\u003c/strong\u003e. Growing up in \u003cstrong\u003eCleveland, OH,\u003c/strong\u003e I was a busy student frequently found completing my homework in dark auditoriums as I balanced my academic commitments with my work onstage in professional theatre productions. \u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile I enjoyed performing, I have always been fascinated with the business side of the arts and began to explore this in earnest during high school. Thanks to a particularly caring mentor I met during my first year at Northwestern, I realized that I could have a \u003cstrong\u003ecareer in theatre management\u003c/strong\u003e which fulfills both the artistic and logical sides of my brain. I finally could read plays and case studies about theatres for homework while also taking courses in the \u003cstrong\u003eFarley Center for Entrepreneurship \u0026amp; Innovation\u003c/strong\u003e that helped me hone my business skills. I currently work as an arts administrator at a nonprofit organization in Chicago. \u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eAs a Curious Cardinals mentor, my goal is to empower students by providing them with resources for success and making concepts accessible.\u003c/u\u003e\u003c/strong\u003e I held a similar role at Northwestern, serving as a peer mentor in the \u003cstrong\u003eOffice of Academic Support and Learning Advancement\u003c/strong\u003e for three years. There, I led weekly sessions on executive functioning, study skills, and personal wellness for students of any major. I learned how to tailor my approach to each student, working with them to better understand their individual learning styles. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnother of my favorite college experiences was my time as an executive board member of \u003cstrong\u003eSeesaw Theatre\u003c/strong\u003e, an organization that creates multisensory theatre for neurodivergent audiences. Producing Seesaw Theatre’s Inclusive Theatre Festival ignited my passion for accessibility, and I would welcome the chance to mentor neurodivergent students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of work, I enjoy doing any kind of puzzle, listening to podcasts, reading books, and crafting. I love taking long walks with my dog, Miles, and volunteer at the local animal shelter. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThank you for taking a moment to learn more about me!\u003c/p\u003e","teachingVideoPlaybackId":"5FX01Vgx70102jIJSLI01Ml9DQ35sT402lBu8ENNJPXBANRc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI was \u003cstrong\u003eone of the producers of Theatre Communications Group's National Conference in Chicago\u003c/strong\u003e. The event is known as one of the largest gatherings of nonprofit theatre professionals in the United States, and I definitely put my project management skills to the test as we had 1000 attendees in-person and via Zoom.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHaving learned about Theatre Communications Group in college, it was so inspiring to collaborate with industry role models and thought leaders. I also took on the challenge of creating our event app, showcasing over 100 sessions. Overall, it was very joyful to share with attendees from across the country (and world!) what makes the Chicago theatre industry unique.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ccfc1d2a-68c0-40ef-90c1-2bd7f3d65dbf\"}"},{"__ref":"Favorites:{\"uuid\":\"22df6bdd-9caa-418e-aed0-6a02cd7cb0e1\"}"},{"__ref":"Favorites:{\"uuid\":\"0e0a6039-8b5e-4db6-9de8-488417fe6c30\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"3eb56204-3a3f-4bc5-a0b2-abed94192ac5\"}"},{"__ref":"CausesSupported:{\"uuid\":\"bb7783cc-7295-424e-9076-00e54bcc717c\"}"}],"major":"Theatre (Entrepreneurship minor, Integrated Marketing Communications certificate)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"de88e6ac-60be-4305-a452-a7783568f356\"}"},{"__ref":"DeepDives:{\"uuid\":\"95feffaf-e4ee-4f80-8048-92a6478b203f\"}"},{"__ref":"DeepDives:{\"uuid\":\"2f4e2f24-2aa0-40d5-9d8e-b09697dee77e\"}"},{"__ref":"DeepDives:{\"uuid\":\"a3bf025b-814c-47aa-875d-9dca2f8457e8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0a8e9421-b848-4ea2-8568-ae9b6511a2c8/-/preview/-/format/jpg/","https://ucarecdn.com/603a6cfc-8466-4fc2-bf3a-cc04c27f0c79/-/preview/-/format/jpg/","https://ucarecdn.com/5b415f29-9b5e-45e0-8231-516bf1554a56/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"dc404cb7-e898-482c-bcfc-7571f3c5bf07\"}"},{"__ref":"Education:{\"uuid\":\"f5924bd2-9425-4d18-b11a-697d4610f32a\"}"}],"hiredAt":"2025-01-25T01:18:04.440Z","topics":["K-5 Grade Math","Pre-Algebra","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Film / Theater","History Project","Business / Entrepreneurship","Web Design","Public Speaking"],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elise-pakiela\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1d4d9352-4198-4565-b467-3204ddb143ff\"}"}}},"_sentryTraceData":"e7e2e163aa8b45338dbf87eb7e5d81ac-8facc8efb262315b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e7e2e163aa8b45338dbf87eb7e5d81ac,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"elise-pakiela"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader"
