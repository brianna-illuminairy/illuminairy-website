xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"feba1d1e-1d42-42ea-8c0d-30432a6bd92a\"}":{"__typename":"DeepDives","uuid":"feba1d1e-1d42-42ea-8c0d-30432a6bd92a","content":"\u003cp\u003eI have taken German since the 6th grade, and is a passion I have carried into college, performing multiple interdisciplinary projects during high school and taking a German class at Cornell. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4c352b5f-6436-4ee1-a060-9fa07ac60c66\"}":{"__typename":"DeepDives","uuid":"4c352b5f-6436-4ee1-a060-9fa07ac60c66","content":"\u003cp\u003eI actually transferred into the Hotel School, and am deeply motivated by the interaction of guest experiences and local communities. This has fueled my interest further to explore Real Estate and combine my interests in Hospitality and Finance. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"bb847839-e4d0-4168-b490-bfe559d3f4b0\"}":{"__typename":"DeepDives","uuid":"bb847839-e4d0-4168-b490-bfe559d3f4b0","content":"\u003cp\u003eI was president of 3 clubs senior year and often led school assemblies. Balancing that with 15+ AP and dual enrollment courses while maintaining a high GPA only captures my academic performance, but reflects my level of dedication to my coursework during high school. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6a6d2491-66b3-45a2-8c49-2a4bbb1aa116\"}":{"__typename":"DeepDives","uuid":"6a6d2491-66b3-45a2-8c49-2a4bbb1aa116","content":"\u003cp\u003eWithout the proper mentorship, I do not believe I would have been as academically motivated as I was during high school. Having the right mentor can be the difference between excellence and taking not proper advantage of an opportunity. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"9bebfd2c-df1f-49eb-81cd-cdddeb7078d5\"}":{"__typename":"School","uuid":"9bebfd2c-df1f-49eb-81cd-cdddeb7078d5","name":"Maggie L Walker Governor’s School","city":"Richmond","type":"HIGH","state":"Virginia","country":"United States","zip":"23220"},"Education:{\"uuid\":\"535f7b0d-3045-495c-8bd6-1a39ca44fb42\"}":{"__typename":"Education","uuid":"535f7b0d-3045-495c-8bd6-1a39ca44fb42","school":{"__ref":"School:{\"uuid\":\"9bebfd2c-df1f-49eb-81cd-cdddeb7078d5\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"c6634561-a5fd-4817-8d4d-7c085ac99039\"}":{"__typename":"Education","uuid":"c6634561-a5fd-4817-8d4d-7c085ac99039","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Hotel Administration","degree":null},"MentorPublicProfile:{\"uuid\":\"1150a6b2-f48e-4ceb-895e-df783e2e0a95\"}":{"__typename":"MentorPublicProfile","uuid":"1150a6b2-f48e-4ceb-895e-df783e2e0a95","displayName":"Shabaz W.","slug":"shabaz-wali","biography":"\u003cp\u003eHi, my name is Shabaz Wali, and I am a sophomore studying Hotel Administration at Cornell University. I am particularly interested in hospitality finance and real estate, and I am passionate about helping students build the academic and personal skills needed to succeed in competitive environments.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eComing from a rigorous high school and now studying at Cornell, I understand firsthand the importance of time management, organization, and balancing academics with extracurricular commitments. I am also committed to fostering confidence, curiosity, and independent thinking in every student I work with, and I would be grateful for the chance to help current students build these skills as they navigate school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I have always had a strong interest in both quantitative and humanities-based subjects. In high school, I completed 16 AP and dual enrollment courses in high school, with strong interests from AP German and Chemistry. I also conducted extensive research projects across disciplines, which strengthened my ability to break down complex topics and communicate them clearly—skills I bring into my tutoring approach.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my most impactful academic experiences was completing multiple math modeling projects, including an analysis of national automobile accident data. These projects introduced me to problem-solving with real-world applications and helped build the Excel and analytical skills I continue to use today at Cornell and heading into the professional industry. Additionally, I wrote a 15-page capstone research paper for a course on Feminism in the MENA region, which included a travel component to Morocco. This experience deepened my appreciation for experiential learning and global perspectives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I enjoy photography and traveling, using both as ways to better understand different cultures and communities. These interests tie closely to my long-term goal of working in hospitality and real estate, where I hope to explore how local dynamics influence development. Also, I am the youngest of 3 brothers, and enjoy swimming, photography, and walking with my 10 year old golden retriever, Brody.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, I strive to be both supportive and adaptable - whether helping students master challenging material, improve study habits, or explore new academic interests. Happy to connect and discuss the opportunity further!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also committed to fostering confidence, curiosity, and independent thinking in every student I work with.\u003c/p\u003e","teachingVideoPlaybackId":"jCabTNE3Vm4cYRK8hcMf3q68KJqNHHBnOi02z41pD02O00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Hotel Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"feba1d1e-1d42-42ea-8c0d-30432a6bd92a\"}"},{"__ref":"DeepDives:{\"uuid\":\"4c352b5f-6436-4ee1-a060-9fa07ac60c66\"}"},{"__ref":"DeepDives:{\"uuid\":\"bb847839-e4d0-4168-b490-bfe559d3f4b0\"}"},{"__ref":"DeepDives:{\"uuid\":\"6a6d2491-66b3-45a2-8c49-2a4bbb1aa116\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9c595e0c-6a1f-4d1d-998e-f4bf3ae13f6a/-/preview/-/format/jpg/","https://ucarecdn.com/496ed401-e592-422c-9de9-35322c419b59/-/preview/-/format/jpg/","https://ucarecdn.com/892e82c1-4fdf-4ab0-898a-ce476dac367b/-/p
