xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8cfd9541-64f7-4dc6-85bd-9104b85afd20\"}":{"__typename":"Favorites","uuid":"8cfd9541-64f7-4dc6-85bd-9104b85afd20","photoUrl":"https://ucarecdn.com/d7887091-87a7-42b7-a11f-f2e37a5b5e29/","title":"Aaron Judge ","type":"ATHLETE"},"Favorites:{\"uuid\":\"024a145b-2543-4498-860b-54f3d8bc67a6\"}":{"__typename":"Favorites","uuid":"024a145b-2543-4498-860b-54f3d8bc67a6","photoUrl":"https://ucarecdn.com/d7315bf9-fc8d-4892-b50d-8f6e2e8db10e/","title":"The Intelligent Investor","type":"BOOK"},"Favorites:{\"uuid\":\"8a114321-0ba4-4161-900c-ce78eb811305\"}":{"__typename":"Favorites","uuid":"8a114321-0ba4-4161-900c-ce78eb811305","photoUrl":"https://ucarecdn.com/83053def-082b-48db-b981-ed92e1453c89/","title":"The Notebook ","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"58c23baf-a9e3-4444-a63f-3b0305798acf\"}":{"__typename":"DeepDives","uuid":"58c23baf-a9e3-4444-a63f-3b0305798acf","content":"\u003cp\u003eI'm a passionate sports enthusiast who loves watching, playing, and learning about all kinds of sports. In my free time, you’ll often find me watching the Yankees, attending Yale games, or heading to the gym to play pick-up basketball or any sport I can jump into with others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8bfc55b8-c37d-4a90-a0d7-2453ef5f217e\"}":{"__typename":"DeepDives","uuid":"8bfc55b8-c37d-4a90-a0d7-2453ef5f217e","content":"\u003cp\u003eOne of my most exciting passion projects in high school involved creating mini-hearts from stem cells. I spent a year working and learning in a research lab, where I gained hands-on experience with various lab techniques and deepened my understanding of organ development and the challenges of replicating organs for drug testing. I love sharing my experience and the fascinating research I was exposed to, so feel free to ask me more about it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a29bfbb9-9b46-49a4-9f9b-f571e3a21b5d\"}":{"__typename":"DeepDives","uuid":"a29bfbb9-9b46-49a4-9f9b-f571e3a21b5d","content":"\u003cp\u003eMy dream job is to become the Chief Financial Officer (CFO) of a major sports organization like the MLB, NFL, or NBA. Combining my passion for sports with my interest in business and finance. I would love to oversee budgeting, investments, and long-term planning to help a sports organization grow sustainably, reach new audiences, and maximize its impact both on and off the field.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"e4407894-0d55-48cb-9b01-d33ef6489222\"}":{"__typename":"DeepDives","uuid":"e4407894-0d55-48cb-9b01-d33ef6489222","content":"\u003cp\u003eI once had a dream that I was being chased by a giant thumb. Everything started turning into a thumb. My head became a thumb, the buildings around me all became thumbs and we all started running from the giant thumb. In the end of the dream we all found out the giant thumb was not trying to harm us but had something stuck under it's nail and wanted help getting it out.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"34201a16-9a55-48ec-b10d-6fffe158d62c\"}":{"__typename":"School","uuid":"34201a16-9a55-48ec-b10d-6fffe158d62c","name":"High School for Mathematics, Science and Engineering at City College","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10031"},"Education:{\"uuid\":\"f358355c-1e3d-4d20-b555-1d1d37f49f9a\"}":{"__typename":"Education","uuid":"f358355c-1e3d-4d20-b555-1d1d37f49f9a","school":{"__ref":"School:{\"uuid\":\"34201a16-9a55-48ec-b10d-6fffe158d62c\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"77214836-a1ac-4d84-bc6e-7aff9658070d\"}":{"__typename":"Education","uuid":"77214836-a1ac-4d84-bc6e-7aff9658070d","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics ","degree":null},"MentorPublicProfile:{\"uuid\":\"7632a88a-858b-4e83-83c7-248ed96df08e\"}":{"__typename":"MentorPublicProfile","uuid":"7632a88a-858b-4e83-83c7-248ed96df08e","displayName":"Raymon M.","slug":"raymon-morillo","biography":"\u003cp\u003eMy name is Raymon, and I am a freshman at Yale University majoring in Economics. I have always been drawn to understanding how decisions are made, resources are allocated, and incentives shape outcomes. Studying economics has deepened my interest in the intersection of financial strategy and organizational behavior, and I am particularly fascinated by how economic principles apply across industries, from corporate finance to consumer behavior. At Yale, I am building a strong foundation in economic theory, quantitative methods, and data analysis, and I am eager to continue exploring specialized areas such as financial markets, and strategic management. I am also excited to engage in research and real-world projects that allow me to apply economic insights to practical challenges.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eOne of my long-term goals is to integrate my academic interests with my passion for the business side of the sports industry. I am captivated by how sports organizations operate as dynamic business managing brand equity, negotiating player contracts, balancing financial constraints, and adapting to shifts in media, technology, and fan engagement. My aspiration is to pursue a career where I can help shape the financial strategies and operational decisions that drive growth and innovation in the world of sports.\u003c/p\u003e\u003cp\u003eSports have always played a central role in my life, not only as a form of recreation but also as a way of developing critical skills such as teamwork, leadership, and resilience. I grew up playing baseball and basketball, and I have always enjoyed the camaraderie and competition that sports foster. At Yale, I continue to fuel this passion by playing on the rugby team, an experience that has strengthened my commitment to discipline, collaboration, and continuous improvement.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eBeyond academics and athletics, I have a deep appreciation for the outdoors. I enjoy hiking, exploring parks, and spending time in nature as a way to stay balanced and grounded. I also love dogs and find that few things are more enjoyable than spending a day outside with a dog by my side.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"PQ2qxt6J8Pc01AHpCZqjpQ7Q2Vf43vCfF4qymMJm2jds","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8cfd9541-64f7-4dc6-85bd-9104b85afd20\"}"},{"__ref":"Favorites:{\"uuid\":\"024a145b-2543-4498-860b-54f3d8bc67a6\"}"},{"__ref":"Favorites:{\"uuid\":\"8a114321-0ba4-4161-900c-ce78eb811305\"}"}],"causesSupported":[],"major":"Economics ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"58c23baf-a9e3-4444-a63f-3b0305798acf\"}"},{"__ref":"DeepDives:{\"uuid\":\"8bfc55b8-c37d-4a90-a0d7-2453ef5f217e\"}"},{"__ref":"DeepDives:{\"uuid\":\"a29bfbb9-9b46-49a4-9f9b-f571e3a21b5d\"}"},{"__ref":"DeepDives:{\"uuid\":\"e4407894-0d55-48cb-9b01-d33ef6489222\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a7905ed8-130b-40d3-863f-32ea5f0b97f0/-/preview/-/format/jpg/","https://ucarecdn.com/384a841a-f679-4ac3-92ef-09d94ef6e2dc/-/preview/-/format/jpg/","https://ucarecdn.com/0d3781ac-b014-4413-92e7-4e1bed0ff7ac/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f358355c-1e3d-4d20-b555-1d1d37f49f9a\"}"},{"__ref":"Education:{\"uuid\":\"77214836-a1ac-4d84-bc6e-7aff9658070d\"}"}],"hiredAt":"2025-04-22T00:24:52.538Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Calculus","Algebra II","Precalculus / Trigonometry","6-8 Grade Science","Biology","Economics","History","Academic Coaching","Executive Function","Business / Entrepreneurship","Finance / Investing","Medicine / Health"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"raymon-morillo\"}})":{"__ref":"MentorPublicProfi
