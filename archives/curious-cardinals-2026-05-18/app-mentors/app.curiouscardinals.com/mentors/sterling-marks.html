xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ffa8e10e-904c-4196-bffd-7504a7946a8b\"}":{"__typename":"Favorites","uuid":"ffa8e10e-904c-4196-bffd-7504a7946a8b","photoUrl":"https://ucarecdn.com/3dc86098-59f8-4773-abd5-fad31cd8cd9b/","title":"Francis McDormand","type":"ACTOR"},"Favorites:{\"uuid\":\"b824cc59-c91f-4a82-8a15-e11dac768810\"}":{"__typename":"Favorites","uuid":"b824cc59-c91f-4a82-8a15-e11dac768810","photoUrl":"https://ucarecdn.com/286a2bf5-876b-42d3-8efb-0a7eb0348031/","title":"Evan Finds the Third Room, by Khruangabin","type":"SONG"},"Favorites:{\"uuid\":\"77d38201-cd66-4da8-bb7f-65d675d25165\"}":{"__typename":"Favorites","uuid":"77d38201-cd66-4da8-bb7f-65d675d25165","photoUrl":"https://ucarecdn.com/114c140b-05e5-4092-945f-4f95ea96ac30/","title":"Autobiography of Red, by Anne Carson","type":"BOOK"},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"be4c1e49-9f87-470d-af7d-5b35c92479ed\"}":{"__typename":"DeepDives","uuid":"be4c1e49-9f87-470d-af7d-5b35c92479ed","content":"\u003cp\u003eShy, awkward, perpetually anxious. I feared being perceived or even looked at. No one told me it was ok to be who I was or offered me the freedom to figure that out. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"9b490f56-83ec-49f1-9820-1dc7073775fa\"}":{"__typename":"DeepDives","uuid":"9b490f56-83ec-49f1-9820-1dc7073775fa","content":"\u003cp\u003eThe sober reality that our individual success is dependent on our individual effort. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6ce178f7-97ed-4d57-8b43-1c41ae7fd3fc\"}":{"__typename":"DeepDives","uuid":"6ce178f7-97ed-4d57-8b43-1c41ae7fd3fc","content":"\u003cp\u003eThe first go round, it was Poly Sci... but now I'm pursuing my dreams of being a professional novelist/journalist. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd yet, I still haven't abandoned those aspirations of law school. I intend to apply as my time at Columbia draws to an end. An artist myself, and in the age of AI, Intellectual Property law is beckoning to me \u003cstrong\u003ebrightly\u003c/strong\u003e.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7f7ae149-c60e-4eb8-bf23-75bb224fb322\"}":{"__typename":"DeepDives","uuid":"7f7ae149-c60e-4eb8-bf23-75bb224fb322","content":"\u003cp\u003eI love live music! That's what first came to mind. I'm a frequenter of the live Jazz series at Sispteria. I also love getting silly with my nieces and nephews. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHere's what else:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eRunning + fitness training\u003c/p\u003e\u003cp\u003e—I completed my first olympic triathlon last year\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWriting\u003c/p\u003e\u003cp\u003e—for craft.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSkateboarding\u003c/p\u003e\u003cp\u003e—I prefer to cruise on my Penny.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eRummaging through CU's Butler Library archives\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGardening\u003c/p\u003e\u003cp\u003e—Home, in NC, I have an expansive garden\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCuddling with my mischievous Basset Hound, Beau\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMaking others laugh\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f33f40de-78cc-4c30-bfeb-1b442cf05f8a\"}":{"__typename":"School","uuid":"f33f40de-78cc-4c30-bfeb-1b442cf05f8a","name":"East Chapel Hill High School","city":"Chapel Hill","type":"HIGH","state":"North Carolina","country":"United States","zip":"27514"},"Education:{\"uuid\":\"aa41f973-e375-4d39-bf88-86caf038ef5a\"}":{"__typename":"Education","uuid":"aa41f973-e375-4d39-bf88-86caf038ef5a","school":{"__ref":"School:{\"uuid\":\"f33f40de-78cc-4c30-bfeb-1b442cf05f8a\"}"},"startYear":"2011","endYear":"2014","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"e86ed2bb-e3b1-4fbc-a4ad-f05d7ebc7e7d\"}":{"__typename":"Education","uuid":"e86ed2bb-e3b1-4fbc-a4ad-f05d7ebc7e7d","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2027","major":"Journalism/Creative Writing + Poli Sci","degree":null},"MentorPublicProfile:{\"uuid\":\"37bc6964-5b46-4287-afd9-24f848d7cde3\"}":{"__typename":"MentorPublicProfile","uuid":"37bc6964-5b46-4287-afd9-24f848d7cde3","displayName":"Sterling M.","slug":"sterling-marks","biography":"\u003cp\u003eI’m a writer, thinker, and lifelong student of humanity. You’ll see me let my hair down in spaces where creativity, culture, and empathy intersect. Further, my academic passion lies at the intersection of these things: exploring how stories, art, and culture shape our understanding of the world. Whether unpacking a film, analyzing a performance piece, or building an argument, I care deeply about asking thoughtful questions—and influencing others to do the same. While studying at Columbia University, I continually challenge myself intellectually and sharpen the skills I bring to mentorship.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I’ve worn \u003cstrong\u003emany \u003c/strong\u003ehats: fashion stylist, creative director, photographer, journalist, screenwriter, actor, social media manager, and executive assistant to entertainment industry titans. I also contribute to the research and conservation work of renowned Dr. Gabby Wild, something that keeps me grounded in meaningful, real-world change. These experiences have given me a unique perspective on creativity, philanthropy, and business.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in a troubled home meant that I lacked space to express myself or pursue creative desires. I know firsthand how circumstance can limit opportunity and personal growth. Mentorship called to me because I want students to have the guidance, encouragement, and creative freedom I longed for. I’ve also been shaped by mentors who saw my potential, challenged me, and invested in my growth—something I seek to pass along. If I had to define my mentorship by a singular goal, it’d be: helping precocious minds ignite (or sustain) an internal fire of curiosity, and then build the confidence to explore it. For this reason, my first demo was titled \u003cem\u003eHow to Fail Spectacularly and with Style\u003c/em\u003e. Basically, we all need to give ourselves permission to be bad at something, otherwise we’d never try something new.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHaving navigated major scholarly, professional, and personal transitions, I’m skilled in working with individuals of diverse backgrounds. My preferred style of coaching and learning is always discussion-based. My proficiencies are: writing (literally anything), reading comprehension, creating a business, creating content for social media, photography, directing films, \u0026amp; developing passion projects. With me, you’ll find that learning is engaging, empowering, and personal.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e-A final note: I have an OCD and ADHD diagnoses that I’ve learned to turn into a superpower. Neurodivergent mentees are always welcome ♥️ \u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"LFOJBpCi4ZpZst93UmT9BNsDIZiSkizeDghmUC7UfVE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing a recipient of Columbia University's PTK scholarship, joining a diverse community of outstanding scholars who have been acknowledged for academic excellence.  \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ffa8e10e-904c-4196-bffd-7504a7946a8b\"}"},{"__ref":"Favorites:{\"uuid\":\"b824cc59-c91f-4a82-8a15-e11dac768810\"}"},{"__ref":"Favorites:{\"uuid\":\"77d38201-cd66-4da8-bb7f-65d675d25165\"}"}],"causesSupported":[],"major":"Journalism/Creative Writing + Poli Sci","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"be4c1e49-9f87-470d-af7d-5b35c92479ed\"}"},{"__ref":"DeepDives:{\"uuid\":\"9b490f56-83ec-49f1-9820-1dc7073775fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"6ce178f7-97ed-4d57-8b43-1c41ae7fd3fc\"}"},{"__ref":"DeepDives:{\"uuid\":\"7f7ae149-c60e-4eb8-bf23-75bb224fb322\"}"}],"active":tru
