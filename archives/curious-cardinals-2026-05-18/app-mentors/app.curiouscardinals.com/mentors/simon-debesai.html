xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"ea274e0f-907c-458c-8414-70677757a7a7\"}":{"__typename":"DeepDives","uuid":"ea274e0f-907c-458c-8414-70677757a7a7","content":"\u003cp\u003eI'm extremely proud of my parents. My family immigrated to the United states in the 80s and worked extremely hard to provide for me. My father, who was unable to graduate from high school, continued to persevere through a lack of job security and narrowed opportunity because he wanted me to live a better life than he did. My mother, despite not being educated in the United States, took particular responsibility in ensuring my education- even if it meant taking significant time away from her career. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"42b3de67-bbb7-4474-9eec-7897f236dbbb\"}":{"__typename":"DeepDives","uuid":"42b3de67-bbb7-4474-9eec-7897f236dbbb","content":"\u003cp\u003eMy dream job is one that centers around providing support to the less fortunate, specifically those who live on the African continent. I would love to work in humanitarian relief or advocacy, either helping to alleviate the struggles that marginalized people are going through or working to eliminate the cause of said struggle. \u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"481b227e-2ef2-43e6-8dd2-ddab5d89ca9d\"}":{"__typename":"DeepDives","uuid":"481b227e-2ef2-43e6-8dd2-ddab5d89ca9d","content":"\u003cp\u003eI am a fairly laid back person. I think my idealism and the scale of my goals may indicate that I am an intense person, but while I believe that the issues in this world should be taken seriously, I try not to take myself too seriously. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"df866675-4ccb-4826-a1d0-61de24cefcd1\"}":{"__typename":"School","uuid":"df866675-4ccb-4826-a1d0-61de24cefcd1","name":"Springbrook High School","city":"Silver Spring","type":"HIGH","state":"Maryland","country":"United States","zip":"20904"},"Education:{\"uuid\":\"ad38b30b-472f-44e8-8a34-02c4162cdde8\"}":{"__typename":"Education","uuid":"ad38b30b-472f-44e8-8a34-02c4162cdde8","school":{"__ref":"School:{\"uuid\":\"df866675-4ccb-4826-a1d0-61de24cefcd1\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"62d10dd7-8870-4f6d-b9aa-046a16e26cd4\"}":{"__typename":"Education","uuid":"62d10dd7-8870-4f6d-b9aa-046a16e26cd4","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"e8a0cba9-cac1-4b17-a33c-5659f1327bd2\"}":{"__typename":"MentorPublicProfile","uuid":"e8a0cba9-cac1-4b17-a33c-5659f1327bd2","displayName":"Simon D.","slug":"simon-debesai","biography":"\u003cp\u003eHello! I am a recent graduate from Yale based in Silver Spring, studying History with a concentration in 20th century social change movements and revolutions, I have a deep passion for future work in the realm of international affairs. More specifically, I'm interested in human rights advocacy in Africa and means of sustainable global development for disenfranchised regions. While at Yale, I participated in many service and affinity organizations on campus, leading both the Black Men’s Union and Yale chapter of Kappa Alpha Psi Fraternity Inc. as president. In addition, I participated in numerous on-campus research projects including a survey on reactions to policing in Cincinnati Ohio and a general research assistant role at the Yale School of Management. Some of my professional experiences include summer internships at policy think tanks like the German Marshall Fund and the Woodrow Wilson Center. After graduating, I have been applying to numerous fellowships to help fund a masters degree in international relations as well as general public sector work in the DC area to obtain more experience. Outside of work, I enjoy having fun with the people I love, through a variety of different activities. I enjoy new experiences as long as they're a venue for me to spend time with the people I love. Some of my niche interests include, roller skating and cane twirling- a form of artistic expression that is specific to my fraternity.   I used to swim and run track so I have a deep respect for athletics in general. I'm a big foodie; I also love to cook and experiment with different recipes so I can always give dinner suggestions.  \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ea274e0f-907c-
