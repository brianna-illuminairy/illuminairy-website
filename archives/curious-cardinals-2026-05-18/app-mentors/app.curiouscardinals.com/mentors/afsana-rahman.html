xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"39b78fa2-6a11-493c-8ad1-4559fa1af658\"}":{"__typename":"Favorites","uuid":"39b78fa2-6a11-493c-8ad1-4559fa1af658","photoUrl":"https://ucarecdn.com/dd37f0e8-f992-41c7-972a-e4ed92d811f0/","title":"Boy Alone","type":"ALBUM"},"Favorites:{\"uuid\":\"1a9d88fe-76be-4707-81aa-1f53d0ac3ae2\"}":{"__typename":"Favorites","uuid":"1a9d88fe-76be-4707-81aa-1f53d0ac3ae2","photoUrl":"https://ucarecdn.com/f608f2f8-7f6d-4f41-acea-1af4149af3f6/","title":"The Weeknd","type":"ARTIST"},"Favorites:{\"uuid\":\"965bd5bb-7f2e-42e5-a2b0-458fec3c1530\"}":{"__typename":"Favorites","uuid":"965bd5bb-7f2e-42e5-a2b0-458fec3c1530","photoUrl":"https://ucarecdn.com/c4cc97a4-e8ee-4eeb-a336-3371d69830bb/","title":"The Giver","type":"BOOK"},"CausesSupported:{\"uuid\":\"69bc3b90-4054-405b-86ea-2304d2b0b841\"}":{"__typename":"CausesSupported","uuid":"69bc3b90-4054-405b-86ea-2304d2b0b841","name":"","description":"","photoUrl":"https://ucarecdn.com/05d8d0ad-e8c3-42d9-b78e-1718fa3f2175/"},"CausesSupported:{\"uuid\":\"8fd2150f-afc4-4814-836c-783af5853024\"}":{"__typename":"CausesSupported","uuid":"8fd2150f-afc4-4814-836c-783af5853024","name":"","description":"","photoUrl":"https://ucarecdn.com/17c242c8-90be-451b-a43b-543836aa8852/"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"09baae6e-5ebf-4a6e-8fe1-c2ab35a73fe9\"}":{"__typename":"DeepDives","uuid":"09baae6e-5ebf-4a6e-8fe1-c2ab35a73fe9","content":null,"videoPlaybackId":"OzF1QXltl2DI1g02xIZzLCdxWCYUAZHITj37yfBEJmVY","question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"734dd5e7-139a-4419-a19c-abe7e8deb58a\"}":{"__typename":"DeepDives","uuid":"734dd5e7-139a-4419-a19c-abe7e8deb58a","content":null,"videoPlaybackId":"9900gxKlRFyLkHraFk4024rcS8syUNEU2PunXbT792r5c","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"99847c93-c2c6-4285-8aef-8c4d85168441\"}":{"__typename":"DeepDives","uuid":"99847c93-c2c6-4285-8aef-8c4d85168441","content":"\u003cp\u003eThis might sound very blunt, but \u003cstrong\u003eknow your own worth, inside and out\u003c/strong\u003e. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI spent so much time in middle school copying my friends’ clubs, snacks, and even sneakers, because I thought that’s how I belonged. It wasn’t until I won that NYC-wide hackathon in 8th grade that I realized I didn’t actually want to be a lawyer; everyone else did. What I \u003cem\u003ereally \u003c/em\u003ewanted to do was code.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOnce I stopped chasing someone else’s version of ‘cool,’ I discovered what lit me up. I launched our Computer Science Honor Society, organized my school’s first student-run hackathon, and dove into data-science research in 9th grade. Sure, I stayed friends with people whose interests were different from mine, but I also learned \u003cstrong\u003ewhat set me apart, and why that’s a superpower, not a setback\u003c/strong\u003e.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo here’s the advice: \u003cstrong\u003e\u003cu\u003egive yourself permission to follow your own curiosity\u003c/u\u003e\u003c/strong\u003e. Celebrate your wins, no matter how small, and let them guide you. The earlier you own your strengths and weaknesses, the sooner you’ll build experiences, and self-confidence, that are truly yours.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"93a43bf4-bed2-400d-950d-5600bc24785a\"}":{"__typename":"DeepDives","uuid":"93a43bf4-bed2-400d-950d-5600bc24785a","content":"\u003cp\u003eI absolutely \u003cstrong\u003eLOVE\u003c/strong\u003e photography! Photography has been \"my thing\" since high school, where I was everyone’s go-to event photographer. In college, people kept asking me to take their portraits or repost shots that I’d taken, and I realized the real thrill wasn’t just capturing the image, but seeing my friends light up when they saw it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think that every photo I take tells a story that might otherwise go unnoticed. Whether it’s Manhattanhenge glowing over the skyline, a sunlit low beach on campus, or my best friend’s birthday dinner, every photo has a different memory attached to it. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eRight now, my \u003cstrong\u003eSony RX100\u003c/strong\u003e is my favorite for its compact, professional quality; if I need something more official, I’ll grab my Nikon Z5.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut honestly, it’s not about the gear, it’s about freezing those tiny moments that make you pause and feel something. So on my spare time, you’ll find me meandering the city streets or scouting campus corners for that perfect shot. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think photography isn’t just a hobby to me, but more of a way to share the way that I see the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"0ee18e14-c74a-4b86-ac1e-e3fd8e8a0360\"}":{"__typename":"School","uuid":"0ee18e14-c74a-4b86-ac1e-e3fd8e8a0360","name":"The Young Women's Leadership school of Astoria","city":"Long Island City","type":"HIGH","state":"New York","country":"United States","zip":"11102"},"Education:{\"uuid\":\"39058801-124d-446e-9f11-8b83a86d9425\"}":{"__typename":"Education","uuid":"39058801-124d-446e-9f11-8b83a86d9425","school":{"__ref":"School:{\"uuid\":\"0ee18e14-c74a-4b86-ac1e-e3fd8e8a0360\"}"},"startYear":"2016","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"f9c598a7-b43a-418b-8ed4-72905f984884\"}":{"__typename":"Education","uuid":"f9c598a7-b43a-418b-8ed4-72905f984884","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Financial Engineering \u0026 Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"d2d27c00-09b6-4459-a4f0-0d868acd3e7e\"}":{"__typename":"MentorPublicProfile","uuid":"d2d27c00-09b6-4459-a4f0-0d868acd3e7e","displayName":"Afsana R.","slug":"afsana-rahman","biography":"\u003cp\u003e“You can sacrifice everything for success, or trust that real success will find you without personal sacrifice,” a stranger told me on the 1 train after overhearing my friend and me debate staying on campus over spring break. That moment stuck, and now I try to balance hard work with staying true to myself.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHey! I’m Afsana Rahman, a first-generation QuestBridge Scholar at Columbia Engineering, where I’m pursuing a Bachelor’s of Science in \u003cstrong\u003eFinancial Engineering with a minor in Computer Science\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI fell in love with coding in 6th grade at my small all-girls school, where nobody expected us to write a single line of code. Determined to change that narrative, I taught myself Python after class, rallied friends to launch a seven-year SWE track, and founded our Computer Science Honor Society in 10th grade. That was my first “aha” moment—seeing \u003cstrong\u003etechnology unlock confidence and opportunity for every student\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eToday, I bring that spark to every project. Before my first year at Columbia, I interned at Bloomberg as a Software Engineer, automating policy-violation detection in chat rooms. I then joined Amazon as a Software Development Engineer intern the following summer, building tools to automate cloud-alarm workflows for AWS’s database systems. This summer, I’m interning at Exiger as an Application Supporter, shifting into more client-focused technical roles. I'm also serving as a product and proposal strategist at NASA through the NPWEE fellowship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus, I serve as Social Media Coordinator for Undergraduate Student Life, crafting digital-growth strategies and creating content for campus events and student spotlights. I’m also active in Columbia's Organization for Rising Entrepreneurs where I mentor local NYC high schoolers in entrepreneurship and giving them access to the same networking opportunities we enjoy. You can also find me facilitating fun outings as social chair of Club Bangla or creating instagram content for the Data Science society and the industrial engineering club.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I unplug, you’ll find me \u003cstrong\u003echasing sunrises on long runs through Central Park\u003c/strong\u003e or roaming Manhattan’s streets with my beloved Sony RX100! I’m also a diehard matcha fanatic and avid sticker collector. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI thrive on turning complex algorithms into hands-on projects and asking “why?” until we land on the best solution. As your mentor, I’ll blend relatable examples with immersive labs so you can own every “aha” moment because, as that stranger reminded me, \u003cu\u003etrue success happens when what you build genuinely serves others…without sacrificing your own passion.\u003c/u\u003e\u003c/p\u003e","teachingVideoPlaybackId":"102CyaNuJpwRVneTet7uWMUu4HtWnFP7k9T00brEMg9yw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"39b78fa2-6a11-493c-8ad1-4559fa1af658\"}"},{"__ref":"Favorites:{\"uuid\":\"1a9d88fe-76be-4707-81aa-1f53d0ac3ae2\"}"},{"__ref":"Favorites:{\"uuid\":\"965bd5bb-7f2e-42e5-a2b0-458fec3c1530\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"69bc3b90-4054-405b-86ea-2304d2b0b841\"}"},{"__ref":"CausesSupported:{\"uuid\":\"8fd2150f-afc4-4814-836c-783af5853024\"}"}],"major":"Financial Engineering \u0026 Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"09baae6e-5ebf-4a6e-8fe1-c2ab35a73fe9\"}"},{"__ref":"DeepDives:{\"uuid\":\"734dd5e7-139a-4419-a19c-abe7e8deb58a\"}"},{"__ref":"DeepDives:{\"uuid\":\"99847c93-c2c6-4285-8aef-8c4d85168441\"}"},{"__ref":"DeepDives:{\"uuid\":\"93a43bf4-bed2-400d-950d-5600bc24785a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/23abfb76-ac31-4dea-98e0-4e18131875de/-/preview/-/format/jpg/","https://ucarecdn.com/9d7aab5e-c38e-45c9-844f-83847418fa5c/-/preview/-/format/jpg/","https://ucarecdn.com/ceb2f965-60af-4e3a-97b7-cc2d438d1892/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"39058801-124d-446e-9f11-8b83a86d9425\"}"},{"__ref":"Education:{\"uuid\":\"f9c598a7-b43a-418b-8ed4-72905f98488
