xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ed8af354-e547-48e8-9f8d-f244d7971e06\"}":{"__typename":"DeepDives","uuid":"ed8af354-e547-48e8-9f8d-f244d7971e06","content":"\u003cp\u003eI think one passion projects involved creating and performing my first stand-up comedy routine. Comedy was something that I always enjoyed watching, but it had never occurred to me to try it myself. Throughout high school and middle school, I never pursued any kind of performance art or theatre. But in my sophomore year of college, I decided to audition for a comedy troupe on campus. I got in, and in the first show, prepared a 10 minute stand-up to perform to a crowd of roughly 150 people. After a lot of pitching ideas, editing, and getting input from others, I felt ready to deliver it. While I was incredibly nervous leading up to the performance, I had such a fun time doing it, and felt immense pride afterward. Ultimately, I learned that if you have something you're interested in, pursue it no matter how daunting it may seem!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"0ccf3216-aed5-4a74-adf8-722b5b0b7f7b\"}":{"__typename":"School","uuid":"0ccf3216-aed5-4a74-adf8-722b5b0b7f7b","name":"Fairfield Warde High School","city":"Fairfield","type":"HIGH","state":"Connecticut","country":"United States","zip":"06825"},"Education:{\"uuid\":\"3b9b03f4-ea7a-4989-ab91-60014528cac5\"}":{"__typename":"Education","uuid":"3b9b03f4-ea7a-4989-ab91-6001452
