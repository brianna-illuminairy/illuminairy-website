xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"81e0a112-700e-4824-9a3d-20ab9a661fc9\"}":{"__typename":"DeepDives","uuid":"81e0a112-700e-4824-9a3d-20ab9a661fc9","content":"\u003cp\u003eAfter I finished high school, I volunteered as a chess teacher with an organization that provided extracurricular chess classes for 6-12-year-old kids from underprivileged backgrounds. Throughout the year, we practiced chess by playing with one another, playing together against a computer, and eventually playing as a team in an inter-organizational chess competition where we won second place. Most children have never played chess before starting my class. Yet, the energy created in the classroom inspired the kids to practice chess a lot in their spare time, resulting in the second-place achievement. This experience has taught me the power of doing and learning things together. Today, I see my art as a medium of community-building around different causes through collective creation. In my work as an artist, specifically as a theater director, I have always emphasized the interpersonal connections we develop while working on a project. To make good art, everyone involved should care about what we are doing and the cause we have gathered around. I believe that teaching those tools for community-building through artistic practices harbors the potential to engender real change, be that creating new friendships between collaborators or informing viewers about different overlooked issues. And this is something important for me to share with others: hence mentorship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"502bda88-d5d7-4605-8626-490429e62459\"}":{"__typename":"School","uuid":"502bda88-d5d7-4605-8626-490429e62459","name":"Ironi Aleph High School","city":"Tel Aviv-Yafo","type":"HIGH","state":"Tel Aviv District","country":"Israel","zip":"6473804"},"Education:{\"uuid\":\"33a83f75-0a3d-4fcb-9fee-543b1dd25016\"}":{"__typename":"Education","uuid":"33a83f75-0a3d-4fcb-9fee-543b1dd25016","school":{"__ref":"School:{\"uuid\":\"502bda88-d5d7-4605-8626-490429e62459\"}"},"startYear":"2012","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7d2ee0da-738b-46ab-9889-f75f8eefb455\"}":{"__typename":"Education","uuid":"7d2ee0da-738b-46ab-9889-f75f8eefb455","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Symbolic Systems \u0026 German Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"b7fd8451-6b05-43a5-909e-868d377711e3\"}":{"__typename":"MentorPublicProfile","uuid":"b7fd8451-6b05-43a5-909e-868d377711e3","displayName":"Yonatan L.","slug":"yonatan-laderman","biography":"\u003cp\u003eHi! My name is Yonatan. I recently graduated with distinction from Stanford University after pursuing a B.S. in Symbolic Systems and an M.A. in German Studies.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a Mentor at Curious Cardinals, I wish to help my mentee become who they want to be. Undergoing myself a journey of discovery without much support at the time, I want to be a resource for anyone who is experiencing the same thing. Whether it is through writing college applications, mentoring an artistic passion project, or providing better tools for reading and writing, I hope to inspire my mentee to develop their own unique perspective of the world, build tools to orient one's relationships, passions, and intuitions, and establish methods of critical thinking allowing them to better understand themselves, their beliefs, and reality. At the end of the day, I am here to support my mentee's academic as well as personal growth, encourage them to find their own path and realize their dreams, and see how beautiful the world we live in is.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn not too many words, I would love to share how I got to where I am. Perhaps, that could serve as a reminder of the non-linear path life takes us and testify to my capability of mentoring someone who is just embarking on the journey of figuring things out.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI used to love playing sports. I was playing Basketball competitively from second grade all the way through ninth grade. I was committed to being an athlete, until I suffered an injury in my knees. I could not play Basketball anymore, and found myself searching for new passions. I was interested in the sciences and was fond of math, but I did not really like school until I was exposed to how beautiful and intricate reality through enrolling in an advance Physics program for high-schoolers. Learning the \"big picture\" ideas of physics made me fall in love with thinking and develop a curiosity about how reality works.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBorn and raised in Israel, I was required to serve in the Israeli military. Nonetheless, I firmly held pacifist beliefs and was opposed to the violence that stems from militaristic systems. In the process of getting an exemption from military service, I realized that I wanted to explore my academic interests by pursuing an undergraduate education. Being still young and unsure of what I wish to study, I applied to American colleges where students are encouraged to experiment with different disciplines before declaring a major. I was admitted to Stanford as a Physics major, but ended up much more interested in studying Consciousness through the tradition of Analytic Philosophy in order to understand a bit better what lies at the heart of our experience as Humans. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to taking classes, I got involved with Theater groups on campus, and I began to directing and writing plays. Though starting as a hobby, theater slowly took more of my time, since more and more people started to respond to my approach to theater-making. Eventually, I was selected to participate in the Planet Earth New Works Festival as a student-director, commissioned by Popgun Art Gallery in NYC to write and direct a site-specific play in their gallery, and was chosen to be the only student Assistant Director in Stanford's 2023 Fall MainStage show.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFalling in love with the Theater as a microcosmos of reality, I pursued a Master's Degree at Stanford in German Studies, concentrating on Performance and Media Studies. I learned more about dramaturgy, performance theory, phenomenology, and aesthetics. I have written many academic papers investigating topics ranging from Media Interventions in the Internet, Fascist Aesthetics, and the Political in Medieval Mysticism.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my time at Stanford I received the Chappell Lougee scholarship, completed a Creative Honors Thesis, and was inducted to the German National Honor Society.\u003c/p\u003e","teachingVideoPlaybackId":"9XXo2UDRbQSAd00bwLwWHtO017rFFZyq5P01sLCzbBVCZ00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems \u0026 German Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"81e0a112-700e-4824-9a3d-20ab9a661fc9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2acad351-2b2e-444c-b6f9-2a32dfd35227/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"33a83f75-0a3d-4fcb-9fee-543b1dd25016\"}"},{"__ref":"Education:{\"uuid\":\"7d2ee0da-738b-46ab-9889-f75f8eefb455\"}"}],"hiredAt":"2024-10-26T11:35:54.638Z","topics":["Film / Theater","Creative Writing","Writing","Reading","Academic Coaching","College Essay Writing"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"yonatan-laderman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b7fd8451-6b05-43a5-909e-868d377711e3\"}"}}},"_sentryTraceData":"beab79a215724a5fa3c0cabb70061b3e-a3a68d112037c176-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=beab79a215724a5fa3c0cabb70061b3e,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"yonatan-laderman"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:h
