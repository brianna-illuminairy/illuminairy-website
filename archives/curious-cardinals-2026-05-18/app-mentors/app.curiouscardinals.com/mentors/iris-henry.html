xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"702e9a79-515c-4cc7-8428-d08f1b03223c\"}":{"__typename":"Favorites","uuid":"702e9a79-515c-4cc7-8428-d08f1b03223c","photoUrl":"https://ucarecdn.com/a61aebe3-7496-4e04-9ee9-3574dbe17619/","title":"Spiderland - Slint","type":"ALBUM"},"Favorites:{\"uuid\":\"15afacae-dc4c-444f-a4f0-c782374bdfe4\"}":{"__typename":"Favorites","uuid":"15afacae-dc4c-444f-a4f0-c782374bdfe4","photoUrl":"https://ucarecdn.com/55efad46-5ab7-4150-a611-863c5cf968c9/","title":"What We Do in the Shadows","type":"MOVIE"},"Favorites:{\"uuid\":\"e13f7915-edf6-4224-b4dd-795d98881be2\"}":{"__typename":"Favorites","uuid":"e13f7915-edf6-4224-b4dd-795d98881be2","photoUrl":"https://ucarecdn.com/82afc156-7e79-4c26-824b-e3350d2e2437/","title":"The Psychopath Test - Jon Ronson","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0a2b58b0-c03a-49c8-be47-b4d9bd05c907\"}":{"__typename":"DeepDives","uuid":"0a2b58b0-c03a-49c8-be47-b4d9bd05c907","content":"\u003cp\u003eMentorship holds significance for me due to my personal journey with learning math and physics. Discovering my passion for these subjects at a young age ignited a drive to explore them further. However, lacking formal guidance, I turned to online resources, teaching myself the intricacies of these disciplines. Through this process, I came to value explanations that were both clear and comprehensive, tailored to the learner's interests.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I transitioned into tutoring, I discovered the immense joy in helping children unlock their potential in math and physics. Witnessing their curiosity sparked and understanding deepened became incredibly rewarding. Mentorship became not just about imparting knowledge but also about nurturing a genuine interest in these subjects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentoring others is also a two-way street. As I guide students through familiar topics, I often uncover new perspectives and insights myself. It's a dynamic process of mutual learning and growth. Ultimately, mentorship allows me to foster the same curiosity and drive for learning in other kids, helping them onto a lifetime path of discovery.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"92848e30-6177-4070-83aa-0fa772669a53\"}":{"__typename":"DeepDives","uuid":"92848e30-6177-4070-83aa-0fa772669a53","content":"\u003cp\u003eMy upbringing in a low income community in Durham, NC, alongside my immigrant mother and grandmother from Russia, profoundly shapes my approach to teaching. Growing up in poverty, I learned the value of self-reliance and determination at an early age, as I juggled various jobs alongside my academic pursuits. This self-driven academic journey not only fueled my passion for learning but also informed my teaching philosophy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHaving experienced financial hardship firsthand, I have a deep understanding of the challenges faced by students from underprivileged backgrounds. I have always been drawn to helping those around me, particularly children in my community, with their schoolwork. Through these experiences, I have come to appreciate the importance of education and curiosity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy heritage and background instill in me a sense of empathy and cultural awareness that influences my teaching style. I am attuned to the diverse needs of my students, whether they lack engagement in school or simply lack access to necessary resources. I strive to create a supportive and inclusive learning environment where every student feels valued and empowered to explore their interests.\u003c/p\u003e\u003cp\u003eI am committed to equity, empathy, and individualized support, ensuring that all students have the opportunity to thrive academically and beyond.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"12357c73-fe08-4459-9c56-33bf3f3ccff8\"}":{"__typename":"School","uuid":"12357c73-fe08-4459-9c56-33bf3f3ccff8","name":"North Carolina School of Science and Mathematics - Durham","city":"Durham","type":"HIGH","state":"North Carolina","country":"United States","zip":"27705"},"Education:{\"uuid\":\"04fbf772-0846-45b8-88f2-2e426563306b\"}":{"__typename":"Education","uuid":"04fbf772-0846-45b8-88f2-2e426563306b","school":{"__ref":"School:{\"uuid\":\"12357c73-fe08-4459-9c56-33bf3f3ccff8\"}"},"startYear":"2021","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"0097d180-19df-443d-be81-74aa9124dabd\"}":{"__typename":"Education","uuid":"0097d180-19df-443d-be81-74aa9124dabd","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mathematics and Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"c49ba4c9-dd78-405d-8b30-7525807dc950\"}":{"__typename":"MentorPublicProfile","uuid":"c49ba4c9-dd78-405d-8b30-7525807dc950","displayName":"Iris H.","slug":"iris-henry","biography":"\u003cp\u003eHey y'all! I'm Iris Henry, hailing from Durham, NC, and currently pursuing majors in physics and mathematics at Yale University. I believe that the marriage of creativity with mathematics and physics is the essence of innovation. From Einstein's challenge to Newtonian Gravity, birthing General Relativity, to Schrodinger, Bohr, and Heisenberg's radical reimagining of nature's reality and locality in Quantum Physics, history shows us that breakthroughs in these fields stem from critical exploration of our universe and mathematical principles.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy own fascination with these subjects ignited during elementary school while watching a documentary on Quantum Physics. Since that pivotal moment, I've embarked on a journey of self-teaching through platforms like Khan Academy. By the end of middle school, I had already completed high school physics and Pre-Calculus, allowing me to delve into Calculus and AP Physics C ahead of schedule. By ninth grade, I began tutoring in Calculus and Physics, both online and in person, eventually expanding into areas like Multivariable Calculus, Graph Theory, and Electricity/Magnetism.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've also dedicated time to working with younger children, volunteering at a local elementary school teaching math and chess. My passion lies in assisting others in uncovering their own interests and avenues for research, especially among low-income or struggling learners, by providing them with the necessary resources to fuel their curiosity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, you'll often find me at WYBC—Yale's radio station—or at The Acorn, a student-run coffee shop where I serve as a barista. I enjoy immersing myself in music, playing guitar, and expressing myself through drawing and painting. I'm also part of a band at Yale, where we create post-punk/post-hardcore music!\u003c/p\u003e\u003cp\u003eI'm genuinely excited about the opportunity to work with your child, nurturing their curiosity and fostering a love for learning.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"702e9a79-515c-4cc7-8428-d08f1b03223c\"}"},{"__ref":"Favorites:{\"uuid\":\"15afacae-dc4c-444f-a4f0-c782374bdfe4\"}"},{"__ref":"Favorites:{\"uuid\":\"e13f7915-edf6-4224-b4dd-795d98881be2\"}"}],"causesSupported":[],"major":"Mathematics and Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0a2b58b0-c03a-49c8-be47-b4d9bd05c907\"}"},{"__ref":"DeepDives:{\"uuid\":\"92848e30-6177-4070-83aa-0fa772669a53\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bdac48e3-963e-4cc1-a055-b0db81a24f7b/-/preview/-/format/jpg/","https://ucarecdn.com/91381e34-3f86-4abc-a733-93ed59c7c540/-/preview/-/format/jpg/","https://ucarecdn.com/eda6dd94-d0ea-4b6f-9c97-9b1caa004d09/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"04fbf772-0846-45b8-88f2-2e426563306b\"}"},{"__ref":"Education:{\"uuid\":\"0097d180-19df-443d-be81-74aa9124dabd\"}"}],"hiredAt":"2024-06-10T21:30:11.981Z","topics":["K-5 Grade Math","Pre-Algebra","Calculus","Algebra II","Algebra I","Physics","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"iris-henry\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c49ba4c9-dd78-405d-8b30-7525807dc950\"}"}}},"_sentryTraceData":"5323eab21efe4680a7fa6d78293fdd94-96b2eccb2710975a-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=5323eab21efe4680a7fa6d78293fdd94,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":
