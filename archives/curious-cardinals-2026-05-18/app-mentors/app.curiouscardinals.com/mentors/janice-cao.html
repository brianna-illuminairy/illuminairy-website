xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"48d85227-72ba-480e-a0b7-67827b1838f2\"}":{"__typename":"Favorites","uuid":"48d85227-72ba-480e-a0b7-67827b1838f2","photoUrl":"https://ucarecdn.com/c048957b-7bfa-481f-9704-27bd8d1c744d/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"0f589e43-d7af-4df3-8f33-01f4ba206037\"}":{"__typename":"Favorites","uuid":"0f589e43-d7af-4df3-8f33-01f4ba206037","photoUrl":"https://ucarecdn.com/b4a5a924-ef27-4517-8cd9-f2f35a771102/","title":"Wicked","type":"MOVIE"},"Favorites:{\"uuid\":\"9023ddfa-1411-4847-8fb6-3024fed89191\"}":{"__typename":"Favorites","uuid":"9023ddfa-1411-4847-8fb6-3024fed89191","photoUrl":"https://ucarecdn.com/b7128a7a-d15d-4f48-9c21-99752f4bb5a9/","title":"Simone Biles","type":"ATHLETE"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"eda9956a-e5fe-4452-98c6-ba831af598f2\"}":{"__typename":"DeepDives","uuid":"eda9956a-e5fe-4452-98c6-ba831af598f2","content":"\u003cp\u003eIn high school, I took on a passion project that combined my love for storytelling and environmental advocacy by creating a short film for the National Geographic x Slingshot Challenge. The competition challenged participants to devise and propose a solution to any environmental issue, and I focused on tackling plastic waste in New York City. I researched the topic, crafted a script, and filmed around Manhattan to bring my vision to life. While I might laugh at the video’s imperfections now, I’m grateful for the experience—it taught me how to channel my environmental passions into a tangible creation and inspired me to continue finding innovative ways to make a difference.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0ea49315-550b-4177-9d34-494425e43df3\"}":{"__typename":"DeepDives","uuid":"0ea49315-550b-4177-9d34-494425e43df3","content":"\u003cp\u003eMentorship matters to me because it granted me the very opportunities I'm exposed to now. As a first generation college student, I never would've thought that I could attend a college that truly embraced my curiosities. This was only possible, however, with the support I had in high school from my upperclassmen friend. Since they took a chance on me and my potential, they provided not only educational, but relatable, support that empowered me to continue learning and taking advantage of the boundless opportunities the world has to offer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"1ea50c49-abb3-44b5-9506-a5f0e94d32af\"}":{"__typename":"DeepDives","uuid":"1ea50c49-abb3-44b5-9506-a5f0e94d32af","content":"\u003cp\u003eIn high school, I was always on-the-go. After school, I met with my clubs, mostly community service clubs, and we planned events that would take place in school or around the city. I was mainly devoted to Key Club, and as Treasurer, I loved planning and facilitating fundraisers that would both engage the members and work towards benefitting the community and the causes we cared for as a club. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9c3c2984-2876-47c9-b003-b55f1d1f96b5\"}":{"__typename":"DeepDives","uuid":"9c3c2984-2876-47c9-b003-b55f1d1f96b5","content":"\u003cp\u003eYou are only in middle school and high school once! Make every day count by learning, making memories, and strengthening friendships the most you can. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}":{"__typename":"School","uuid":"7f9a6683-e17a-47fa-9e6d-534e82c727e1","name":"Brooklyn Technical High School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11217"},"Education:{\"uuid\":\"dd059e04-a64d-479a-8cd6-6cebc611701d\"}":{"__typename":"Education","uuid":"dd059e04-a64d-479a-8cd6-6cebc611701d","school":{"__ref":"School:{\"uuid\":\"7f9a6683-e17a-47fa-9e6d-534e82c727e1\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"bcbf836d-0d25-4b12-8517-421b84b8595f\"}":{"__typename":"Education","uuid":"bcbf836d-0d25-4b12-8517-421b84b8595f","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"ESG Factors for Business","degree":null},"MentorPublicProfile:{\"uuid\":\"02822df1-7f89-4bb2-800e-15f455c506d4\"}":{"__typename":"MentorPublicProfile","uuid":"02822df1-7f89-4bb2-800e-15f455c506d4","displayName":"Janice C.","slug":"janice-cao","biography":"\u003cp\u003eHi! I'm Janice, a sophomore at UPenn from Brooklyn, NY. My main academic interest lies at the intersection of business management and the environment. I'm a big advocate for the planet, and sustainability is one of my core values.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis passion began with a Buzzfeed video featuring a woman who fit 5 years of trash into a mason jar, recycling or composting everything else. It made me aware of my own daily waste, sparking environmentally-minded endeavors like producing a short film for a National Geographic Challenge, creating a business prototype to expand electric vehicle charging infrastructure, and making climate advocacy videos for classes. At Penn, I’ve continued to pursue my interests through the ESG (environmental, social, governance) space. I’m the Events Lead for Penn Climate Ventures, and I became a Turner ESG Fellow this year to deepen my understanding of the ESG industry.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school, I love staying active, particularly through running and swimming. Fun fact: I’m running the half-marathon this spring! I’m a casual sports fan, occasionally watching NBA games but always tuning into Olympic ice skating and gymnastics. I also enjoy cozy nights in baking or scrapbooking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a first-generation college student, I find mentorship essential to academic success and wellbeing. While I didn’t grow up with immediate access to educational resources, upperclassmen friends who soon became my role models and mentors helped me navigate high school and the increasingly complicated college application process. Now, I aim to provide the same support for younger students and mentor individuals from all socioeconomic backgrounds.\u003c/p\u003e","teachingVideoPlaybackId":"BG
