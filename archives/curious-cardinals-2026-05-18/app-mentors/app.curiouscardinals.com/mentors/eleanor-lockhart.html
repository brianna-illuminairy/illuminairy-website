xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"62eeb64f-766a-4f07-940d-5dbf1d8326ec\"}":{"__typename":"Favorites","uuid":"62eeb64f-766a-4f07-940d-5dbf1d8326ec","photoUrl":"https://ucarecdn.com/f4445a3f-596b-4977-8f6f-3fa84039ec52/","title":"Amsterdam","type":"CITY"},"Favorites:{\"uuid\":\"d19102e6-41d9-44ec-a725-e0779164e0fe\"}":{"__typename":"Favorites","uuid":"d19102e6-41d9-44ec-a725-e0779164e0fe","photoUrl":"https://ucarecdn.com/f4445a3f-596b-4977-8f6f-3fa84039ec52/","title":"Dallas Cowboys","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"3afcc29e-3041-4261-a159-297bab7cd019\"}":{"__typename":"Favorites","uuid":"3afcc29e-3041-4261-a159-297bab7cd019","photoUrl":"https://ucarecdn.com/f4445a3f-596b-4977-8f6f-3fa84039ec52/","title":"Crew! I'm a coxswain","type":"SPORT"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3d19219a-329a-4709-b036-a989d5d8c600\"}":{"__typename":"DeepDives","uuid":"3d19219a-329a-4709-b036-a989d5d8c600","content":"\u003cp\u003eFor me, Cognitive Science is the perfect balance between my passionate love for philosophy and psychology and my more analytical, rational aptitude towards math and economics. I believe that this major enables me to be an incredibly well-rounded student and, consequently, mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"9732e0b9-d514-43c9-88f5-0cdb7e0a72f8\"}":{"__typename":"DeepDives","uuid":"9732e0b9-d514-43c9-88f5-0cdb7e0a72f8","content":"\u003cp\u003eMy parents. I admire every sacrifice that they have ever made for me, from attending soccer games to moving to Dallas in order to allow me to pursue the best education they could find. I am incredibly grateful, every day, for the endless support they give me and confidence they hold in my abilities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"c24b694e-8675-4b69-a495-6f74d739cca0\"}":{"__typename":"School","uuid":"c24b694e-8675-4b69-a495-6f74d739cca0","name":"The Hockaday School","city":"Dallas","type":"HIGH","state":"Texas","country":"United States","zip":"75229"},"Education:{\"uuid\":\"6fb0286f-17bf-4890-83f8-a1d6cfd142b9\"}":{"__typename":"Education","uuid":"6fb0286f-17bf-4890-83f8-a1d6cfd142b9","school":{"__ref":"School:{\"uuid\":\"c24b694e-8675-4b69-a495-6f74d739cca0\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b2cf6d7f-5c71-4f32-b89c-8cd628ea12c0\"}":{"__typename":"Education","uuid":"b2cf6d7f-5c71-4f32-b89c-8cd628ea12c0","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"c97caa8f-f4ab-453a-bc3c-c697023bbc07\"}":{"__typename":"MentorPublicProfile","uuid":"c97caa8f-f4ab-453a-bc3c-c697023bbc07","displayName":"Eleanor L.","slug":"eleanor-lockhart","biography":"\u003cp\u003eEleanor is a current sophomore at Yale studying Cognitive Science with a focus in Behavioral Economics. She grew up in Dallas, Texas - and she is proud to be a fifth-generation Texan! Her central academic passions lie in biology and math, especially calculus.\u003cbr\u003e\u003cbr\u003eHer interest in Cognitive Science arose as a combination of her pre-med background and her relatively-newfound love of the study of economics. In high school, she worked as a Certified Nurse Aide in Alzheimer's care facilities and has a collective 4 years of experience tutoring at Mathnasium and with private clients. She also frequenly worked and volunteered with Planned Parenthood as a trained educator, traveling to juvenile detention centers and runaway shelters to facilitate conversations surrounding sexual health and personal safety. This STEM-heavy background influenced her love of studying and teaching the sciences.\u003cbr\u003e\u003cbr\u003eAt Yale, she is a coxswain on the Men's Heavyweight Crew team and sings soprano in the all-athlete UnorthoJocks A Capella group. Curious Cardinals is her outlet for her desire to give back as a mentor in gratitude for all of the older women who supported her throughout her academic career - she understands firsthand the incomparable impact that a well-matched mentor can have on the life of a high schooler, and she fully dedicates herself to supporting those whom she mentors.\u003cbr\u003e\u003cbr\u003eWhen not at practice or in class, Eleanor loves to write, read biographies, and explore everything New Haven has to offer. She can't wait to meet you!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"62eeb64f-766a-4f07-940d-5dbf1d8326ec\"}"},{"__ref":"Favorites:{\"uuid\":\"d19102e6-41d9-44ec-a725-e0779164e0fe\"}"},{"__ref":"Favorites:{\"uuid\":\"3afcc29e-3041-4261-a159-297bab7cd019\"}"}],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3d19219a-329a-4709-b036-a989d5d8c600\"}"},{"__ref":"DeepDives:{\"uuid
