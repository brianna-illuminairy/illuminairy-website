xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b3213add-d84b-4bd7-871b-f916d576d1ef\"}":{"__typename":"Favorites","uuid":"b3213add-d84b-4bd7-871b-f916d576d1ef","photoUrl":"https://ucarecdn.com/29449d01-95ef-43cc-8b53-08932a288bce/","title":"A Moon Shaped Pool - Radiohead","type":"ALBUM"},"Favorites:{\"uuid\":\"fa1be72a-fad4-4be2-9c0d-5792b958370f\"}":{"__typename":"Favorites","uuid":"fa1be72a-fad4-4be2-9c0d-5792b958370f","photoUrl":"https://ucarecdn.com/cafdcf6a-8899-452e-8e45-03128e5e1855/","title":"Baldur's Gate 3","type":"GAME"},"Favorites:{\"uuid\":\"17be54bf-ca2f-4656-8d3e-93dce63888f7\"}":{"__typename":"Favorites","uuid":"17be54bf-ca2f-4656-8d3e-93dce63888f7","photoUrl":"https://ucarecdn.com/494349a8-49a6-4e7e-8c34-36a718e64452/","title":"Virgil van Dijk","type":"ATHLETE"},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"91b358a8-274d-4f8b-b4d9-71930a9fbef0\"}":{"__typename":"DeepDives","uuid":"91b358a8-274d-4f8b-b4d9-71930a9fbef0","content":"\u003cp\u003eWell, I was very excited about school, but also very shy! In high school, I really began to focus on computer science and music. Half the time outside of class I'd be working on some personal coding project, and the other half I'd be composing or practicing classical percussion. It was my interests outside of school that really helped develop my identity and sense of self. After going to college, I feel like I've learned about so many incredible hobbies and activities that I wasn't even aware of when I was younger! I'd love to be able to share these ideas.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0e90a18a-99cd-42cc-b007-974fd213ca8b\"}":{"__typename":"DeepDives","uuid":"0e90a18a-99cd-42cc-b007-974fd213ca8b","content":"\u003cp\u003eSo much of the reason I feel confident in what I do and have had the opportunity to explore what I love is because of the incredible mentors I've met in my life. Whether that's a high school teacher, a professor, or just an upperclassman, so many people have taken the time to help me pursue what I want. I love teaching: finding ways to make information exciting and straightforward. And I love mentoring: giving mentees the long-term tools to find their path. There is really no better feeling than sharing a lightbulb moment with a student, and seeing them understand who they want to be over time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ff04100d-ba4b-43a6-a6d3-00a322baae14\"}":{"__typename":"DeepDives","uuid":"ff04100d-ba4b-43a6-a6d3-00a322baae14","content":"\u003cp\u003eI love animals! I grew up enchanted by nature documentaries, but never found a way to bring that interest into the classroom. In college, however, I could study evolutionary biology, and combine that with the math and science I had studied so hard in high school - the perfect combination! I found I could explore my innate interests in ecology along with the skills I had learned along the way, and got my bachelor's in Integrative Biology and Computer Science, and my master's in Applied Math. Luckily for me, I never had to compromise my interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"0ece6d99-ffd0-4c6b-b9db-cf639365e10c\"}":{"__typename":"DeepDives","uuid":"0ece6d99-ffd0-4c6b-b9db-cf639365e10c","content":"\u003cp\u003eI'm always iterating on my personal website, and what I want it to be. In the process, I get to learn new coding frameworks and techniques! Currently, I'm revamping it to host both a project portfolio and a set of articles written about a wide range of topics - evolutionary ecology, college admissions, data visualization; you name it, hopefully I'll have an article on it at some point!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"d74d5e1e-ec77-4ab4-a284-288ae31dbb8d\"}":{"__typename":"Education","uuid":"d74d5e1e-ec77-4ab4-a284-288ae31dbb8d","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"3d30bae3-ad79-4fe3-8cf8-4cb7a894644d\"}":{"__typename":"Education","uuid":"3d30bae3-ad79-4fe3-8cf8-4cb7a894644d","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Biology and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"31f98639-2615-45e0-a8f8-9cb14ec2917b\"}":{"__typename":"MentorPublicProfile","uuid":"31f98639-2615-45e0-a8f8-9cb14ec2917b","displayName":"Chase V.","slug":"chase-vanamburg","biography":"\u003cp\u003eWhat is it that you truly love doing? What is the topic you can't stop talking about, the dream that continues to drive you, the passion you want to spend your life pursuing? As a mentor, I aim to give my mentees the tools to answer exactly these questions. And, once they begin to find an answer, to give them the tools to understand and excel at the path they choose to follow.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHi! I’m Chase, a recent graduate of Harvard University with a B.A. in Biology and Computer Science and an M.S. in Applied Math. Currently, I’m working at a design studio where I transform complex biological datasets into beautiful and effective visualizations.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, I hit the ground running with my love for animals and the natural world. I studied ecology, evolution, cellular biology, and so many other fields in the life sciences! At the same time, I was exploring how math and computer science could be used to understand and model the world we live in. I brought these fields together in a few different research projects. I first explored cellular biology research in genetics and evolution, learning what it means to work in a lab and how to effectively design a technical and precise experiment. After that, I was lucky enough to travel to Laikipia, Kenya, where I studied the ecology of ants and acacia trees. We began several research projects at the field station, including analysis of plant physiology in response to climate change and using state-of-the-art machine learning models\u0026nbsp; to study the distribution of tree species across savannah landscapes.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs the science got more complicated, I realized it became harder and harder to explain to students, friends, and family. I shifted toward design and data visualization as a way to communicate complex scientific ideas. Now, I continue to use my background in science to create aesthetic and clear visuals. For example, we can visually explore the process of constructing an evolutionary tree using viral genetics data.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLearning is about doing. Whether that’s writing an essay about your local community, training a cutting-edge machine learning model to study your sleep habits, or building an artist’s portfolio online, I always ground new concepts in relevant and understandable examples. As someone who has studied both theories of learning and design, I bring those ideas to meet my mentees where they are at; if you’re not getting it and feeling confident, I need to learn how to engage you. My approach is very student-focused, unique for every student, and always designed to be fun.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love running around Boston, watching Liverpool (the best football/soccer team in the world) trounce their way through the Premier League and Champions League, and exploring different concert venues in my area.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to work together, and would love to give you the tools to achieve all of your goals!\u003c/p\u003e","teachingVideoPlaybackId":"Mz8Jty5G9bGqPm5R0100xt6b5xfAvscs1NXZr02z4MHE9M","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b3213add-d84b-4bd7-871b-f916d576d1ef\"}"},{"__ref":"Favorites:{\"uuid\":\"fa1be72a-fad4-4be2-9c0d-5792b958370f\"}"},{"__ref":"Favorites:{\"uuid\":\"17be54bf-ca2f-4656-8d3e-93dce63888f7\"}"}],"causesSupported":[],"major":"Biology and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"91b358a8-274d-4f8b-b4d9-71930a9fbef0\"}"},{"__ref":"DeepDives:{\"uuid\":\"0e90a18a-99cd-42cc-b007-974fd213ca8b\"}"},{"__ref":"DeepDives:{\"uuid\":\"ff04100d-ba4b-43a6-a6d3-00a322baae14\"}"},{"__ref":"DeepDives:{\"uuid\":\"0ece6d99-ffd0-4c6b-b9db-cf639365e10c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cc3020df-41fa-431f-a2ff-825a5c0f757f/-/preview/-/format/jpg/","https://ucarecdn.com/d17406da-c0d0-472e-a857-d54e080bf1f3/-/preview/-/format/jpg/","https://ucarecdn.com/f6734624-da20-4a98-9f62-2fc640cfc89e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d74d5e1e-ec77-4ab4-a284-288ae31dbb8d\"}"},{"__ref":"Education:{\"uuid\":\"3d30bae3-ad79-4fe3-8cf8-4cb7a894644d\"}"}],"hiredAt":"2024-11-11T21:56:36.492Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Executive Function","College Essay Writing","Computer Science","Academic Coaching","Music","Visual Arts / Graphic Design","K-6 Storybook","Coding / Programming","Web Design","STEM Project","Machine Learning / AI","Sustainability"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"chase-vanamburg\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"31f98639-2615-45e0-a8f8-9cb14ec2917b\"}"}}},"_sentryTraceData":"0b20df19bd174158b163cc22a46f0f08-be6d059fcc6419c5-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry
