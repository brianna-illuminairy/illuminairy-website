xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2f260f8c-38b1-4bac-bea4-61064785c4e3\"}":{"__typename":"Favorites","uuid":"2f260f8c-38b1-4bac-bea4-61064785c4e3","photoUrl":"https://ucarecdn.com/394dfe13-759c-4e27-b8b5-9ac45f9f037b/","title":"Star Wars","type":"MOVIE"},"Favorites:{\"uuid\":\"2c8987b1-15c2-4736-9c3f-3247863c8428\"}":{"__typename":"Favorites","uuid":"2c8987b1-15c2-4736-9c3f-3247863c8428","photoUrl":"https://ucarecdn.com/f7f75e3c-e877-450d-80d1-e979527bebae/","title":"Call of Duty","type":"GAME"},"Favorites:{\"uuid\":\"3afed103-1777-4e6a-a408-258c46deaa81\"}":{"__typename":"Favorites","uuid":"3afed103-1777-4e6a-a408-258c46deaa81","photoUrl":"https://ucarecdn.com/924d326d-6719-4de9-9a9e-7cd9fb952c80/","title":"Flawed Mangoes","type":"ARTIST"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"604c0f5f-214c-434d-93b0-91731c5def33\"}":{"__typename":"DeepDives","uuid":"604c0f5f-214c-434d-93b0-91731c5def33","content":"\u003cp\u003eGrowing up, my biggest mentors were my parents. As high school teachers, they understood the ins and outs of academics and taught me how to approach school from a teacher’s perspective: how to choose meaningful courses, seek leadership opportunities, and view every teacher and professor as a potential mentor. By sophomore year, I also participated in a leadership and peer-mentorship program, where I saw firsthand how powerful guidance from others can be. Mentorship shaped the student I am today: conversations with pre-med mentors helped me realize that path wasn’t right for me, while veterinary mentors helped me discover the passions that motivate me now. Because mentorship gave me clarity, confidence, and direction, it matters deeply to me, and it’s why I want to pay it forward by helping others grow through shared knowledge and curiosity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"5066467b-9802-41b5-8c18-e8fc4bbdd84a\"}":{"__typename":"DeepDives","uuid":"5066467b-9802-41b5-8c18-e8fc4bbdd84a","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is running a marathon. In middle and high school, I ran cross country and track, and during that time my mom completed multiple marathons. Watching her achieve that goal was incredibly powerful. It showed me what dedication, resilience, and a willingness to challenge yourself can look like. For me, a marathon represents more than physical endurance; it’s about committing to a long-term goal, pushing through setbacks, and trusting the process. I hope to one day follow in her footsteps and complete a marathon of my own.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"19614dbd-c41f-4009-b588-4d60fd1e3f13\"}":{"__typename":"DeepDives","uuid":"19614dbd-c41f-4009-b588-4d60fd1e3f13","content":"\u003cp\u003eIn middle school, I was driven by curiosity. I loved science and also gravitated toward creative outlets like visual arts and writing. I was focused, but learning still felt exploratory and low-pressure.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, that changed as expectations increased. With guidance from my parents, I set ambitious academic goals and became very driven, balancing challenging coursework, extracurriculars, volunteering, and leadership. While I didn’t always feel perfect, the experience taught me how pressure can shape motivation, and how important it is to balance high expectations with self-compassion. That perspective helps me connect with students who feel similar pressure today.\u003c/p\u003e\u003chr\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"97f5ba69-bae3-4e23-866c-fd1cedccd6ed\"}":{"__typename":"DeepDives","uuid":"97f5ba69-bae3-4e23-866c-fd1cedccd6ed","content":"\u003cp\u003eOne passion project I’m especially proud of is founding my high school’s Anatomy Club. When my school stopped offering anatomy as a course, I noticed a gap for students interested in science and medicine and decided to create that opportunity myself. I began developing the club at the end of my junior year and officially launched it my senior year, offering hands-on anatomy lessons, suturing workshops, and mentorship from science teachers. By the end of the year, the club had over 20 consistent members and became a lasting space for students to explore their interests beyond the classroom. In college, I attempted to create a similar community for students interested in veterinary medicine at Yale. While that effort didn’t fully take off due to the small number of pre-veterinary students, it reinforced my belief in building access where it doesn’t yet exist, and my willingness to keep trying. That drive to create opportunities for others continues to motivate me today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"9aa199a0-58ab-47a3-bc96-c2aa415af362\"}":{"__typename":"School","uuid":"9aa199a0-58ab-47a3-bc96-c2aa415af362","name":"Hollins High School","city":"St. Petersburg","type":"HIGH","state":"Florida","country":"United States","zip":"33709"},"Education:{\"uuid\":\"31c743ce-6f71-4aea-8b72-6f0aedd9e0bd\"}":{"__typename":"Education","uuid":"31c743ce-6f71-4aea-8b72-6f0aedd9e0bd","school":{"__ref":"School:{\"uuid\":\"9aa199a0-58ab-47a3-bc96-c2aa415af362\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"19f46075-ae8d-4bb0-8265-df9a802ce0d2\"}":{"__typename":"Education","uuid":"19f46075-ae8d-4bb0-8265-df9a802ce0d2","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Molecular, Cellular, \u0026 Developmental Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"42931176-9742-4f73-b287-76afdbebb6e7\"}":{"__typename":"MentorPublicProfile","uuid":"42931176-9742-4f73-b287-76afdbebb6e7","displayName":"Mia P.","slug":"mia-pineda","biography":"\u003ch3\u003eGreetings! I’m Mia 👋\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m a senior at Yale University majoring in Molecular, Cellular, \u0026amp; Developmental Biology (MCDB), with a passion for mentoring curious students who are exploring STEM, medicine, and animal health.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eThrough high school and my first two years at Yale, I was convinced that medical school and earning an MD was my ultimate goal. I followed the pre-med track, volunteering in hospitals and working as a pathology office assistant. While I gained valuable clinical exposure, I began to realize that something wasn’t quite clicking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough reflection and hands-on experience, I discovered that my goal wasn’t to leave medicine, but to approach it differently. That realization led me to veterinary medicine, a path that blends science, medicine, animals, and hands-on problem solving in a way that feels deeply aligned.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlong the way, I’ve built a strong foundation across research, leadership, clinical work, and animal health, including:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHands-on veterinary and wildlife experience abroad\u003c/strong\u003e in Costa Rica, Thailand, and South Africa, assisting with procedures, enrichment planning, conservation projects, and field research\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch experience in microbiology and cell biology labs at Yale\u003c/strong\u003e, working with bacterial cultures, DNA extraction, PCR, sequencing, and more\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eClinical exposure in a hospital setting\u003c/strong\u003e as a Pathology Office Assistant at Yale New Haven Hospital\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eLeadership and mentorship roles through Yale Medical Professions Outreach and Yale Summer Session\u003c/strong\u003e, mentoring students academically, personally, and through the transition to college life\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy experiences have shown me that it’s okay to change direction as your interests evolve. I’m especially passionate about helping students who feel unsure or pressured to have it all figured out, because curiosity and openness go a long way!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI’m comfortable working with curious students of all ages, with the most experience mentoring high school students. I can support you with:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eExploring interests\u003c/strong\u003e in STEM, medicine, veterinary medicine, and animal \u0026amp; human health\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects\u003c/strong\u003e, including starting a club or nonprofit, developing a research project or report\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch mentorship\u003c/strong\u003e, from learning how to design and test a research model to presenting findings with confidence and professionalism\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePortfolio building\u003c/strong\u003e, including identifying and pursuing internships, volunteer roles, externships, and leadership opportunities to strengthen your résumé\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSubject guidance\u003c/strong\u003e across the life sciences (zoology, microbiology, ecology, cell biology, physiology, biochemistry, molecular biology, anatomy, genetics, immunology), as well as chemistry, math, writing, and visual arts\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to mentor\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eAs a former Yale counselor and current senior with hands-on experience, I understand both the academic expectations students face and the uncertainty that can come with figuring out their path. I’ve navigated self-doubt, changed directions thoughtfully, and developed strong skills in goal-setting, communication, and self-advocacy, tools I aim to help students cultivate.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might include:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTalking through interests, goals, and questions about STEM, medicine, or other pathways\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorming passion projects or extracurricular ideas that feel authentic and exciting\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a clear, step-by-step plan for research, clubs, or academic growth\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down complex concepts into approachable, visual explanations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReflecting on experiences and learning how to communicate them confidently\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eOutside of academics\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOutside of school\u003cstrong\u003e,\u003c/strong\u003e I’m an avid cinephile (definitely tell me your favorites!), love listening to music (everything except country 😅), enjoy games like \u003cem\u003eSettlers of Catan\u003c/em\u003e, have a strong appreciation for the visual arts (fun fact: both of my parents were art teachers!), and love spending time outdoors in nature. I believe learning should feel meaningful, not rigid, and that growth often comes from asking honest questions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re curious, unsure, excited, or somewhere in between, I’d love to support you as you explore what \u003cem\u003eyour\u003c/em\u003e path could look like 💙\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"12zgMjHNQnlPqhllOrrYZh59K8wIGWMW7VZ2H8IPgkw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2f260f8c-38b1-4bac-bea4-61064785c4e3\"}"},{"__ref":"Favorites:{\"uuid\":\"2c8987b1-15c2-4736-9c3f-3247863c8428\"}"},{"__ref":"Favorites:{\"uuid\":\"3afed103-1777-4e6a-a408-258c46deaa81\"}"}],"causesSupported":[],"major":"Molecular, Cellular, \u0026 Developmental Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"604c0f5f-214c-434d-93b0-91731c5def33\"}"},{"__ref":"DeepDives:{\"uuid\":\"5066467b-9802-41b5-8c18-e8fc4bbdd84a\"}"},{"__ref":"DeepDives:{\"uuid\":\"19614dbd-c41f-4009-b588-4d60fd1e3f13\"}"},{"__ref":"DeepDives:{\"uuid\":\"97f5ba69-bae3-4e23-866c-fd1cedccd6ed\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f604273f-d6cd-4d56-ade1-ee3ba53360ff/-/preview/-/format/jpg/","https://ucarecdn.com/17b25005-848a-4823-973c-2826e019c660/-/preview/-/format/jpg/","https://ucarecdn.com/731af880-e88c-449d-b06c-74b5e0481ab0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"31c743ce-6f71-4aea-8b72-6f0aedd9e0bd\"}"},{"__ref":"Education:{\"uuid\":\"19f46075-ae8d-4bb0-8265-df9a802ce0d2\"}"}],"hiredAt":"2025-12-19T01:42:03.301Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","College Essay Writing","Reading","Creative Writing","Visual Arts / Graphic Design","History Project","Video / Photography","Medicine / Health","STEM Project","Sustainability","Public Speaking","Journalism"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query
