xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"abe21817-69fb-483c-8384-ff04dbabf24e\"}":{"__typename":"Favorites","uuid":"abe21817-69fb-483c-8384-ff04dbabf24e","photoUrl":"https://ucarecdn.com/a766bfcd-c906-4f80-beef-d02f3e94b685/","title":"Anything by Taylor Swift!","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ec43fecb-2894-4210-a4bd-eb3c5b8b142d\"}":{"__typename":"DeepDives","uuid":"ec43fecb-2894-4210-a4bd-eb3c5b8b142d","content":"\u003cp\u003eDon't be afraid to ask questions! Being curious helps you learn and understand things better. It’s okay not to know everything, because that’s how you grow!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b0fd7800-40ce-45de-b0bc-e33486cfeb34\"}":{"__typename":"DeepDives","uuid":"b0fd7800-40ce-45de-b0bc-e33486cfeb34","content":"\u003cp\u003eMy dream job is to be a doctor. I’m still figuring out what kind, but cardiology has always inspired me — helping people with their hearts feels so important. I’m excited to keep exploring and learn which field fits me best!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7f9a2deb-4ab2-4db0-8ff7-685899dae616\"}":{"__typename":"DeepDives","uuid":"7f9a2deb-4ab2-4db0-8ff7-685899dae616","content":"\u003cp\u003eMentorship matters to me because I remember feeling lost in high school, unsure of who to turn to for help. I want to be there for students who feel the same way, offering guidance and support so they don’t have to go through it alone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"33d7fca6-013f-4d52-8af8-78d312d8351d\"}":{"__typename":"DeepDives","uuid":"33d7fca6-013f-4d52-8af8-78d312d8351d","content":"\u003cp\u003eIn my spare time, I love taking my two dogs to the beach for a swim—they’re the best! I also like running with my sister, playing pickleball with my friends, and spending time in the kitchen cooking with my mom. It’s all about having fun and making memories with the people (and pets) I love!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"794f5cb3-bb24-43f2-a75a-dc0e6f8110a2\"}":{"__typename":"School","uuid":"794f5cb3-bb24-43f2-a75a-dc0e6f8110a2","name":"St. Saviour High School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11215"},"Education:{\"uuid\":\"b74910d7-fb72-4974-938f-d06e3d9bf9ab\"}":{"__typename":"Education","uuid":"b74910d7-fb72-4974-938f-d06e3d9bf9ab","school":{"__ref":"School:{\"uuid\":\"794f5cb3-bb24-43f2-a75a-dc0e6f8110a2\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"f6dae442-2c28-43e2-aff3-1057bfee4d3f\"}":{"__typename":"Education","uuid":"f6dae442-2c28-43e2-aff3-1057bfee4d3f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"6a4d6b6c-095e-4494-a2be-8636b13c4816\"}":{"__typename":"MentorPublicProfile","uuid":"6a4d6b6c-095e-4494-a2be-8636b13c4816","displayName":"Catherine K.","slug":"catherine-kindschuh-1","biography":"\u003cp\u003eI’m Catherine, a senior at Stanford University studying Biology with the goal of attending medical school. Ever since I was a kid, I’ve been fascinated by science and its ability to uncover the mysteries of the world. What excites me most is how science connects to medicine and empowers us to care for others. I love sharing that sense of discovery with students and helping them feel comfortable asking questions and exploring new ideas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of class, I work in a cardiology lab where I help create mini heart organs— an experience that deepens my understanding of biology in a hands-on way. I also volunteer at Stanford Children’s Hospital, where I support young patients and work to make their hospital experience less overwhelming. These experiences have taught me the importance of patience, encouragement, and creating a positive environment for learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, my goal is to help children build confidence in their abilities and develop a genuine curiosity for learning. I understand how important it is to create a safe space where they feel empowered to ask questions without fear. I love working with kids, helping them discover their strengths, and guiding them through challenging concepts in a way that’s fun
