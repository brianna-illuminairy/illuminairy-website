xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ffba4e72-f5ec-47da-a26e-66d6f4f467a5\"}":{"__typename":"DeepDives","uuid":"ffba4e72-f5ec-47da-a26e-66d6f4f467a5","content":"\u003cp\u003eDon't focus on other people's expectations of you. School can be so stressful, but it is important to take a step back and recognize that it will all work out! Just follow your passions and stay curious.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"5b81ce2b-f0a3-4e13-b4ac-c361e151871b\"}":{"__typename":"DeepDives","uuid":"5b81ce2b-f0a3-4e13-b4ac-c361e151871b","content":"\u003cp\u003eI hope to visit nearly every country in the world. I think that one of the best things someone can learn is other cultures. I want to go abroad in college, and I try to travel every summer. I really enjoy talking to people from different countries and hearing their stories!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"9daada30-5ee0-4c7d-a5c3-2c71d4756610\"}":{"__typename":"DeepDives","uuid":"9daada30-5ee0-4c7d-a5c3-2c71d4756610","content":"\u003cp\u003eMy greatest role model is my grandmother. She passed away a few years ago, but she was a trailblazer by every sense of the word. She escaped an arranged marriage in India in the 1950s, went to America, and put herself through school at NYU. Later on, she supported her family by starting a restaurant in San Francisco. She was a constant source of love in my life and is a reminder of the importance of hard work. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"a98c211d-9fac-4ca1-9e05-08565f03508f\"}":{"__typename":"DeepDives","uuid":"a98c211d-9fac-4ca1-9e05-08565f03508f","content":"\u003cp\u003eI had many interests as a high school student. I kept my days busy by doing a lot of extracurriculars. I think what was important was that I stuck to things that I enjoyed and had a genuine passion for. Academically, I got good grades, but I wasn't the best student because I lacked organization. I think talking and learning from older people was really helpful. I was a very curious student, though, and I when I was interested in a subject (like math or history), I devoted a lot of time to it. However, sometimes I struggled dedicating myself to other topics I felt less passionate about. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"253abe40-1366-4d5e-a26f-1ffc1d5c36db\"}":{"__typename":"School","uuid":"253abe40-1366-4d5e-a26f-1ffc1d5c36db","name":"Aragon High School","city":"San Mateo","type":"HIGH","state":"California","country":"United States","zip":"94402"},"Education:{\"uuid\":\"7d3f03a5-9a50-476b-8098-a250bd5a6e44\"}":{"__typename":"Education","uuid":"7d3f03a5-9a50-476b-8098-a250bd5a6e44","school":{"__ref":"School:{\"uuid\":\"253abe40-1366-4d5e-a26f-1ffc1d5c36db\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"bd0d6eef-ef04-4dee-800a-29dac16eb1ca\"}":{"__typename":"Education","uuid":"bd0d6eef-ef04-4dee-800a-29dac16eb1ca","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Undeclared","degree":null},"Testimonial:4c607d09-c99b-4478-a91c-57724273a8f0":{"__typename":"Testimonial","id":"4c607d09-c99b-4478-a91c-57724273a8f0","text":"Niki has been a wonderful support for my son. He goes above and beyond to not only help my son stay organized and on task, but also is able to assist in a wide range of subjects on a week-by-week basis. There has never been a problem Niki couldn’t help answer! He also encourages his curiosity and interests outside of the classroom. \nEach week, my son looks forward to their time together. \nThank you Niki!","date":"2025-06-07 00:43:17.761+00","rating":5,"endorser":{"__typename":"Endorser","name":"Heather Willis","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"104a9413-a292-4492-9d67-df9081b7cfdb\"}":{"__typename":"MentorPublicProfile","uuid":"104a9413-a292-4492-9d67-df9081b7cfdb","displayName":"Niki Y.","slug":"niki-yoon","biography":"\u003cp\u003eHi! My name is Niki and I am a freshman at Stanford. I have lived in the Bay Area all my life (Berkeley, Palo Alto, and San Mateo), but I love to travel, and I try to go to a new country every year. I am half Korean and half Indian, so I also have grown up learning to cook with my parents. Some of my other hobbies are bread-baking, playing the cello, trying to teach myself guitar (kind of struggling), going on hikes, and playing soccer (fútbol).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have always have had a wide range of academic interests -- my favorite subjects throughout high school were math and social studies. During two of my high school summers, I worked with a Stanford Law and Economics professor compiling and analyzing data relating to the issue of gun control, which was an experience that really started my interest in interdisciplinary fields. My major is still undeclared, but I am interested in economics, management science and engineering, environmental science, and an interdisciplinary major called symbolic systems (look it up if you are curious)! I want to emphasize that students should be driven by whatever interests them -- mentors should be there to help feed their curiosity! School can be stressful sometimes, so I also want to bring a easy going environment where my mentee and I can work on whatever they need. I believe that sometimes, tutoring is just about providing a comfortable space and encouraging confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passion for tutoring started in high school when I volunteered at a company called Homework Central, which worked with students at local elementary schools. There, I learned how important it was to create a relaxed, patient environment. It felt great to see how just an hour of dedicated time could make a big difference in a student's day. I want to be a tutor that doesn't just help with homework, but is a resource for students to go to for any curiosities they may have -- big or small. Please reach out if you have any questions!\u003c/p\u003e","teachingVideoPlaybackId":"8L02cztk6bwCSefYBFZmq7OCmtQ2E9Pou025E5xz6sJt00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Undeclared","deepDives":[{"__ref":
