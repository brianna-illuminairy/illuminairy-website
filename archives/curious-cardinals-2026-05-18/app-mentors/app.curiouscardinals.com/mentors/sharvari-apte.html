xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6dbe5966-3aaa-439c-a3a5-8dfbf542e79d\"}":{"__typename":"DeepDives","uuid":"6dbe5966-3aaa-439c-a3a5-8dfbf542e79d","content":"\u003cp\u003eMentorship matters to me because it represents the same kind of guidance and inspiration that shaped my own path in bioengineering. I’ve been fortunate to learn from mentors who not only shared technical knowledge but also helped me see the broader impact of engineering in medicine. Their encouragement and perspective gave me the confidence to pursue opportunities I might not have otherwise considered.\u003c/p\u003e\u003cp\u003eAs I’ve grown in my career, I’ve realized how meaningful it is to give that support back to others. Working with students interested in biomedical engineering has reminded me of the excitement and curiosity that first drew me to the field. Helping them navigate academic challenges, explore career options, and secure internships is incredibly rewarding. Mentorship, to me, is about building a bridge, connecting experience with potential, and ensuring that the next generation of engineers is equipped and inspired to make a difference in human health.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"91a874a2-6920-4a37-9781-a29d6f47a41b\"}":{"__typename":"DeepDives","uuid":"91a874a2-6920-4a37-9781-a29d6f47a41b","content":"\u003cp\u003eI chose to major in bioengineering because I’ve personally experienced how life-changing medical technology can be. When I was seven, I had heart surgery to receive an implant that helped regulate my heartbeat, and that experience sparked my fascination with how engineering and medicine come together to improve lives. Bioengineering felt like the perfect way to combine my love of problem-solving and innovation with my desire to make a real impact on human health. Through this field, I can help design technologies that not only push the boundaries of science but also directly improve patient care which is something that’s deeply meaningful to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"2b46a3d4-e4fd-4e7e-8602-dceecb8dcf7d\"}":{"__typename":"School","uuid":"2b46a3d4-e4fd-4e7e-8602-dceecb8dcf7d","name":"Owen J Roberts High School","city":"Pottstown","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19465"},"Education:{\"uuid\":\"221eeb94-2b13-467a-b84c-7e2155896725\"}":{"__typename":"Education","uuid":"221eeb94-2b13-467a-b84c-7e2155896725","school":{"__ref":"School:{\"uuid\":\"2b46a3d4-e4fd-4e7e-8602-dceecb8dcf7d\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"bd39a659-4712-402e-893a-f4991ce9b272\"}":{"__typename":"Education","uuid":"bd39a659-4712-402e-893a-f4991ce9b272","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2023","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"755b59c7-cc41-486f-915f-a4988e585b1c\"}":{"__typename":"MentorPublicProfile","uuid":"755b59c7-cc41-486f-915f-a4988e585b1c","displayName":"Sharvari A.","slug":"sharvari-apte","biography":"\u003cp\u003eMy journey into bioengineering began with a very personal experience. At the age of seven, I underwent heart surgery to receive an implant that helped regulate my cardiac function. That event left a lasting impression on me, not just because of its impact on my health, but because it revealed how engineering and medicine could come together to save and improve lives. This early encounter with medical technology inspired my curiosity and ultimately led me to pursue a career in biomedical engineering.\u003c/p\u003e\u003cp\u003eI am currently an engineer at a biomedical company, where I work on the development of spinal and cranial robotic platforms. These systems integrate advanced robotics, imaging, and navigation technologies to enhance surgical precision and patient safety. In my role, I collaborate closely with surgeons, scientists, and other engineers to design, test, and refine robotic systems that meet clinical needs and push the boundaries of what is possible in the operating room. This work allows me to see firsthand how engineering innovation can directly impact patient outcomes, the same kind of innovation that once impacted my own life.\u003c/p\u003e\u003cp\u003eI earned my Bachelor’s degree in Bioengineering from the University of Delaware, where I developed a strong foundation in biomechanics, materials science, and biomedical systems. I later completed my Master’s degree in Bioengineering at the University of Pennsylvania, focusing on advanced biomedical technologies and the translation of engineering research into clinical practice. Through these experiences, I gained a deep appreciation for the interdisciplinary nature of biomedical engineering and the power of collaboration between engineers, clinicians, and researchers.\u003c/p\u003e\u003cp\u003eMy professional and academic paths have both been guided by a single motivation: to improve human health through technology. Whether developing robotic platforms, optimizing system performance, or supporting clinical validation, I approach each challenge with the same sense of purpose that first drew me to this field. Biomedical engineering is more than a discipline — it’s a bridge between scientific discovery and human need, and I am continually inspired by how collaboration and innovation can lead to real clinical impact. Beyond my technical work, I have had the opportunity to mentor and work with students interested in bioengineering, helping them explore their interests, strengthen their technical skills, and gain valuable industry experience. Many of these students have gone on to secure internships and pursue advanced studies in related fields, which has been one of the most rewarding aspects of my professional journey.\u003c/p\u003e\u003cp\u003eI hope to share that perspective with students who are exploring this field, showing how curiosity, creativity, and compassion can come together to make a meaningful impact. My own journey began as a patient, and today I am proud to contribute as an engineer helping shape the next generation of medical technology.\u003c/p\u003e","teachingVideoPlaybackId":"3dm1aSnjqrEbiHT8IuHWl00R94lg6OE025IS2pI38ZLIk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6dbe5966-3aaa-439c-a3a5-8dfbf542e79d\"}"},{"__ref":"DeepDives:{\"uuid\":\"91a874a2-6920-4a37-9781-a29d6f47a41b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0678aa95-3f42-4d5b-9472-45279d49e312/-/preview/-/format/jpg/","https://ucarecdn.com/ba66eafc-a990-40e5-81a1-759e936ae5b0/-/preview/-/format/jpg/","https://ucarecdn.com/2d3c0cd4-1d90-4985-b7d6-8700d34561a5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMAL
