or immigrants in the U.S. and help pave the path for Latinos to pursue STEM related careers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6619d2fd-ff54-4776-89d3-006441908962\"}":{"__typename":"DeepDives","uuid":"6619d2fd-ff54-4776-89d3-006441908962","content":"\u003cp\u003eAstronaut\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"d1e30d3f-e51c-4077-971c-766e15560259\"}":{"__typename":"DeepDives","uuid":"d1e30d3f-e51c-4077-971c-766e15560259","content":"\u003cp\u003eI am a proud Mexican-American and the son \u0026amp; grandson of former farmworkers. I take a lot of pride in my heritage and it drives the passion and work ethic I live my life with.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"460d3d9f-4e01-461d-b35b-b8668a95d2fb\"}":{"__typename":"School","uuid":"460d3d9f-4e01-461d-b35b-b8668a95d2fb","name":"Alisal High School","city":"Salinas","type":"HIGH","state":"California","country":"United States","zip":"93905"},"Education:{\"uuid\":\"4a70adca-766b-4d06-bfaa-31513d42dff6\"}":{"__typename":"Education","uuid":"4a70adca-766b-4d06-bfaa-31513d42dff6","school":{"__ref":"School:{\"uuid\":\"460d3d9f-4e01-461d-b35b-b8668a95d2fb\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"5848b4b8-3389-479d-bd9c-7b5eddd1aeab\"}":{"__typename":"Education","uuid":"5848b4b8-3389-479d-bd9c-7b5eddd1aeab","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"2e36fbbc-7ad3-476a-a784-0da7160c2b18\"}":{"__typename":"MentorPublicProfile","uuid":"2e36fbbc-7ad3-476a-a784-0da7160c2b18","displayName":"Josue G.","slug":"josue-gilsilva","biography":"\u003cp\u003eJosué graduated with a degree in Mechanical Engineering with a concentration in Product Realization at Stanford University. He is currently enrolled in a Mechanical Engineering Masters program at Stanford. In 2019, he graduated from Alisal High School in Salinas, California as the Valedictorian and four year captain of the Varsity basketball team. Growing up in a community of predominantly Latino immigrants opened his eyes to the large inequalities in society. He has been involved in various forms of activism in his community, including helping found the Monterey County Black and Brown Solidarity Coalition, where they organized a 14-mile march to speak against police brutality and systematic racism. In addition, Josué’s passion for engineering and design came from when he joined the Robotics club in high school and his team won first place at a regional competition. This opened his eyes to the myriad of creative projects that can be done through engineering. Since then, he has addressed the socioeconomic inequity in solar energy through his internship with Shake Energy Collaborative, designed a fingertip haptic device that brings haptics to virtual reality, and even worked on designing new Fitbit watches at Google. He is a board member for the Stanford Social Entrepreneurship Student Association and is passionate about social entrepreneurship. He also walked-on to the Men’s Basketball Team at Stanford and founded a custom shoe painting business with his dad and brother. Whether you have a design idea or want to learn Spanish, Josué is eager to speak with students about any of his passions. He is a big believer in “learning by doing”, and he is excited to collaborate with students on any curiosities they might have!\u003c/p\u003e","teachingVideoPlaybackId":"TzBa5X2n01bWco3q1C018olhF02xU3b6SwUJlq02bAFfcSU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"350502dc-41bd-4396-b3a7-2e0e1e55eb19\"}"},{"__ref":"Favorites:{\"uuid\":\"55b593be-7a83-493b-a3e8-71324909902d\"}"},{"__ref":"Favorites:{\"uuid\":\"caaa561c-f883-4f52-8ea6-06a51d967a23\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a84009cb-ad21-424d-b0d9-1fe0be0b4b24\"}"},{"__ref":"DeepDives:{\"uuid\":\"3740999c-a551-407e-a09c-8d29869b8502\"}"},{"__ref":"DeepDives:{\"uuid\":\"6619d2fd-ff54-4776-89d3-006441908962\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1e30d3f-e51c-4077-971c-766e15560259\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f7b9cdd7-0de7-4418-9086-2bb6bc27537b/-/preview/-/format/jpg/","https://ucarecdn.com/a0b8ddc6-e672-4c62-88b7-c785b3e2b4a1/-/preview/-/format/jpg/","https://ucarecdn.com/ff7ca66d-8715-4b6d-adc4-eb6dff63cafc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4a70adca-766b-4d06-bfaa-31513d42dff6\"}"},{"__ref":"Education:{\"uuid\":\"5848b4b8-3389-479d-bd9c-7b5eddd1aeab\"}"}],"hiredAt":"2021-07-31T18:37:10.000Z","topics":["Sports Journalism","Visual Arts / Graphic Design","Business / Entrepreneurship","Sustainability","Journalism","Spanish"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__ty
