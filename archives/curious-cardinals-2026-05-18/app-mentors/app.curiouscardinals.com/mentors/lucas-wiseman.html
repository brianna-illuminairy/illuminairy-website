xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7003ea40-0bb8-4576-ae73-c461802c72c7\"}":{"__typename":"Favorites","uuid":"7003ea40-0bb8-4576-ae73-c461802c72c7","photoUrl":"https://ucarecdn.com/ad383b3b-5ddd-442e-b36e-d6d4a76e1279/","title":"Rugby","type":"SPORT"},"Favorites:{\"uuid\":\"7e79b537-927b-40dd-b86e-587adae36557\"}":{"__typename":"Favorites","uuid":"7e79b537-927b-40dd-b86e-587adae36557","photoUrl":"https://ucarecdn.com/9da4c25f-a697-418a-a8cc-1e2a0abc5a44/","title":"Mexico City","type":"CITY"},"Favorites:{\"uuid\":\"35ac03a2-6a99-4eac-808b-91967c75e3f7\"}":{"__typename":"Favorites","uuid":"35ac03a2-6a99-4eac-808b-91967c75e3f7","photoUrl":"https://ucarecdn.com/1c495253-0014-4fc1-87af-bc5bb39c94e5/","title":"Godspeed by James Blake \u0026 Frank Ocean","type":"SONG"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"1dcadc29-73ba-4535-ad75-4ecb51705f0f\"}":{"__typename":"DeepDives","uuid":"1dcadc29-73ba-4535-ad75-4ecb51705f0f","content":"\u003cp\u003eI was born in NYC, raised in Mexico City, now live in the US, my parents live in London, my mother is Spanish (although her parents lived in Russia for 20 years), my father was born and raised in Mexico but his parents are Scottish and American. Throughout my life, I have had a confused sense of home and identity, which I think is the reason why I’m interested in so many different things. Although at times it feels disorienting, it has made me someone who loves to learn about different cultures, and explore different ways of learning. I see so much value in the intersection between disciplines, and love exploring the outcomes of combining opposing disciplines. For instance, I remember talking to a friend who studied mechanical engineering about an architecture project that I was stuck on — I had to create a model inspired by a world globe. He then went on to lecture me about the fact that all 2D maps of the earth were inaccurate because it was impossible to perfectly project a 3D object into 2D space. This then gave me the idea to make a series of maps with oranges. I drew several mini earth globes on oranges, peeled them, flattened them, and scanned them, and ended up with semi-accurate representations of the earth. The professors loved the project, and it remains one of my personal favorites. This to me, is the perfect example of two disciplines unexpectedly coming together and creating a new idea.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"fae3cb6e-113d-48ac-9147-3efd551d7c4f\"}":{"__typename":"DeepDives","uuid":"fae3cb6e-113d-48ac-9147-3efd551d7c4f","content":"\u003cp\u003eMy most recent passion project has been centered around postcards. In the past year, I have grown quite a significant Latin American audience that enjoys my narrative videos and my music. Although it has been a blessing to see so much support for my projects, I have always felt frustrated by the fact that the interactions are mostly virtual. In search for a way to connect with my audience in the real world, I decided to design 200 postcards, put them up for sale on my website, and make a video about them. The plan was to write a handwritten message to any person who bought one, and send it to their house! Unexpectedly, two hours after uploading my video announcing the idea, they sold out. I spent the next week carefully handwriting every address, coming up with individualized messages, and posting hundreds of postcards — something that my right hand will never forgive me for.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7fdc1cb7-cedf-42da-85c2-9758149cca88\"}":{"__typename":"DeepDives","uuid":"7fdc1cb7-cedf-42da-85c2-9758149cca88","content":"\u003cp\u003eI always thought about my summers as opportunities to do things that I had never done before, which meant that throughout my time in High School, every summer was completely different. First I decided to spend two months alone in New York City working at a carpentry shop with no friends, family, or any knowledge of woodworking — this turned out to be one of the best summers of my life and the topic of my common app essay that got me into Yale! Another summer I decided to try out the corporate life, and worked as a marketing intern in Reckitt Benckiser, a multinational consumer goods company focused on health and hygiene products in Mexico. Although I learned a lot, it was not as exciting as carpentry. The next summer I came back to New York City, but this time helped build a bagel bakery in the Brooklyn Navy Yard. This summer was wonderful, but not because of the job, rather because it gave me the stability and freedom to make music in the evenings music and explore the city — I now had a few friends from my carpentry days. Finally, I spent a summer working for a restaurant company in Mexico City, which at first I thought was going to be a corporate job, but my boss (righty so) insisted that I needed to have first-hand experience working in a restaurant to make any real decisions, so instead I spent the summer cycling through every position in one of his establishments; I was a sous-chef, a waiter, a host, a bartender, and a baker.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"026ecdaf-8dae-4e26-b112-a976534e3f6f\"}":{"__typename":"DeepDives","uuid":"026ecdaf-8dae-4e26-b112-a976534e3f6f","content":"\u003cp\u003eI came into Yale confident that I only wanted to major in Economics. I had always felt drawn to the subject because it provided me with the tools necessary to think critically about some of the issues that I cared most about. Living in Mexico, and seeing the consequences of a nation riddled with income inequality, corruption, and poverty, I always wanted to understand how a country with so much potential could end up in a situation like that. Perhaps I also chose to study economics to rebel against my parents, who are both artists…\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHowever, in my first semester at Yale, I took an architecture seminar that changed the way I saw the world. It made me aware of the fact that in an urban environment, most things that you see are intentionally designed; the shape and size of every window, the carvings on every door, the shape of every door knob, and the positioning of every brick. This class opened my eyes to a world of design, of problem solving, of socio-political discourses, of philosophy, and of beauty that I had never seen before. I could not get enough of it, and quickly realized that I also wanted to study architecture.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"43e4d7e7-0f3c-4123-8c2b-4fbc82a70bff\"}":{"__typename":"School","uuid":"43e4d7e7-0f3c-4123-8c2b-4fbc82a70bff","name":"Greengates School Mexico","city":"Naucalpan de Juárez","type":"HIGH","state":"Estado de México","country":"Mexico","zip":"53200"},"Education:{\"uuid\":\"5a6fe54f-d6dd-4eef-8377-b061adfb9957\"}":{"__typename":"Education","uuid":"5a6fe54f-d6dd-4eef-8377-b061adfb9957","school":{"__ref":"School:{\"uuid\":\"43e4d7e7-0f3c-4123-8c2b-4fbc82a70bff\"}"},"startYear":"2011","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"bcfaba90-0187-46e5-80c5-4285392a4f6b\"}":{"__typename":"Education","uuid":"bcfaba90-0187-46e5-80c5-4285392a4f6b","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Architecture \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"4f8560eb-6920-40d8-98ca-f7c6061d1742\"}":{"__typename":"MentorPublicProfile","uuid":"4f8560eb-6920-40d8-98ca-f7c6061d1742","displayName":"Lucas W.","slug":"lucas-wiseman","biography":"\u003cp\u003eHi! My name is Lucas and I’m a recent Yale grad from Mexico City. I attended an international high school where I went through the International Baccalaureate (IB) program.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have always been interested in projects outside of school. I have been making music since I was 10 years old. At first, I learned how to play the electric bass and joined a rock band. However, after a few years, I fell in love with electronic music, and shifted my focus towards learning how to produce music on my computer. I was enamoured by the process, and spent countless evenings composing (not so great) songs. Eventually, my production skills improved, and at 17, I released my first official single on Spotify, which now has over 2 million streams! Since then, I have continued to release music under the name ‘Wacomo’, and am now a full time musician.\u003c/p\u003e\u003cp\u003eIn addition to music, I’m also incredibly passionate about video production and storytelling. Since 2020, I have written, shot, edited, and published over 200 short-form videos on social media. In these videos, I tell stories about my friends, my music, and explore concepts that catch my eye. I now have an audience of over 700,000 followers, which has become an indispensable source of support for my musical career and the development of many of my projects. This year, I also founded an agency called Wacomo Creatives, which helps artists work through every step of the content creation process and translate their vision into compelling audio-visual content. For this project, I had to design a website (wacomocreatives.com), develop a business plan, and create an effective framework that could guarantee results. Since the launch of the agency, I’ve had the opportunity to work alongside some truly amazing artists.\u003c/p\u003e\u003cp\u003eAt Yale, I double majored in Architecture and Economics. I found myself particularly interested in my architecture classes, which led to many late nights drawing, designing on Rhino, and building models at the woodshop. Even after graduating, I have maintained friendships with many of my past professors. Outside of the classroom, rugby was a big part of my life. I have been playing the sport for over 10 years, and played as the starting fly-half throughout my entire time at Yale. Although it was a challenge at first, I managed to create a healthy balance between the substantial demands of a student athlete, my interest in academics, and my love for music and videos.\u003c/p\u003e\u003cp\u003eI have always loved the process of bringing my ideas to life. Whether it be creating a song, a drawing, a business, a video, or a story, I believe that embracing my creativity and making an effort to execute my ideas has given me a greater sense of self understanding and confidence. Technically speaking, it has also taught me how to use a great variety of softwares for creation, such as Photoshop, Premier Pro, DaVinci Resolve, Ableton Live, Pro Tools, Rhino, WIX (for website design), and InDesign. I would love to help your child embrace their creativity and make them excited about whatever their passion may be! My goal is to work collaboratively with your child, and serve as a guide who might help them learn how to use a specific software, who can explain to them a new concept, who can assist them in creating roadmaps for their passion projects, and who they can trust to bounce ideas off of.\u003c/p\u003e","teachingVideoPlaybackId":"OSKX01gHkD4dAAQD005800H78Ys0101cli4cxmUW4ZhsY01qM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7003ea40-0bb8-4576-ae73-c461802c72c7\"}"},{"__ref":"Favorites:{\"uuid\":\"7e79b537-927b-40dd-b86e-587adae36557\"}"},{"__ref":"Favorites:{\"uuid\":\"35ac03a2-6a99-4eac-808b-91967c75e3f7\"}"}],"causesSupported":[],"major":"Architecture \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1dcadc29-73ba-4535-ad75-4ecb51705f0f\"}"},{"__ref":"DeepDives:{\"uuid\":\"fae3cb6e-113d-48ac-9147-3efd551d7c4f\"}"},{"__ref":"DeepDives:{\"uuid\":\"7fdc1cb7-cedf-42da-85c2-9758149cca88\"}"},{"__ref":"DeepDives:{\"uuid\":\"026ecdaf-8dae-4e26-b112-a976534e3f6f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/79426601-5cfc-48d6-892f-52c76c524778/-/preview/-/format/jpg/","https://ucarecdn.com/268e9d02-bdde-4f68-b156-2c9a93056805/-/preview/-/format/jpg/","https://ucarecdn.com/147ae70a-fb2b-42bc-88d1-7973b85d0b4d/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5a6fe54f-d6dd-4eef-8377-b061adfb9957\"}"},{"__ref":"Education:{\"uuid\":\"bcfaba90-0187-46e5-80c5-4285392a4f6b\"}"}],"h
