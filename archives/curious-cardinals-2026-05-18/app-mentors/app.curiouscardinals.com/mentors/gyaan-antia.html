xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"03827bfb-ec12-469e-8b23-123d04b3b872\"}":{"__typename":"DeepDives","uuid":"03827bfb-ec12-469e-8b23-123d04b3b872","content":"\u003cp\u003eRecently, I was watching a YouTube video on a math problem that ended with a line I really resonate with: \"Never stop learning, for those that stop learning, stop living.\" My greatest accomplishment will be the continuous pursuit of learning throughout my lifetime, so that I never stop living.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"17728f45-41f4-4b30-9e1e-ad2c49acf690\"}":{"__typename":"DeepDives","uuid":"17728f45-41f4-4b30-9e1e-ad2c49acf690","content":"\u003cp\u003eI am currently implementing a machine learning research paper on generating images using Diffusion Transformers. I am working on my own understanding of these models, and I believe the ability to implement research papers will be invaluable for my career.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3d8f5d42-e44c-4eea-9d61-075b60e52c47\"}":{"__typename":"DeepDives","uuid":"3d8f5d42-e44c-4eea-9d61-075b60e52c47","content":"\u003cp\u003eI have been obsessed with technology since I got my first iPod Touch at 8 years old. I had to figure out how that thing worked. When I first got to college, I thought I would study computer science, because that was the closest I could get to learning how to make an iPod (so I thought). About a month into my first semester, I learned that they offered both a Computer Science AND Computer Engineering major. The difference was that the engineers got to learn how computers actually work from the ground up. Needless to say, I ended up an engineer. Along the way, I discovered a love for other new technologies, namely Machine Learning and Robotics, and ended up majoring in Computer Engineering for my Master's as well.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"39c4afb3-f285-42c5-ad3b-544dec9a13aa\"}":{"__typename":"DeepDives","uuid":"39c4afb3-f285-42c5-ad3b-544dec9a13aa","content":"\u003cp\u003eI was definitely not the greatest studier in high school, so I would share some of the study tips and tricks that I've learned throughout college and grad school. I would also tell my younger self that failure is okay! Especially as an engineer, you are bound to fail at some point in your career. As long as you can learn from your mistakes, you will be just fine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"965b72c5-044e-4763-8211-b693d0cdb652\"}":{"__typename":"School","uuid":"965b72c5-044e-4763-8211-b693d0cdb652","name":"Newton North High School","city":"Newton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02460"},"Education:{\"uuid\":\"36a854f2-1ea9-4c2a-a043-0c8b78163b6c\"}":{"__typename":"Education","uuid":"36a854f2-1ea9-4c2a-a043-0c8b78163b6c","school":{"__ref":"School:{\"uuid\":\"965b72c5-044e-4763-8211-b693d0cdb652\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}":{"__typename":"School","uuid":"891dad70-4e24-4602-8353-1e8140b8eb0c","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60201"},"Education:{\"uuid\":\"3b52f21f-0a67-412e-96b8-db1f925a0394\"}":{"__typename":"Education","uuid":"3b52f21f-0a67-412e-96b8-db1f925a0394","school":{"__ref":"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"6ec580a0-c316-4d1e-af4a-dbaac0a0b861\"}":{"__typename":"MentorPublicProfile","uuid":"6ec580a0-c316-4d1e-af4a-dbaac0a0b861","displayName":"Gyaan A.","slug":"gyaan-antia","biography":"\u003cp\u003eHi, I'm Gyaan! I went to high school outside of Boston, Massachussets and then went to Northwestern University in Evanston, IL, where I earned a Bachelor's and Master's degree in Computer Engineering. I wrote my Master's Thesis on Machine Learning and Robotics, and I love keeping up to date with the latest in these areas.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've had two software engineering internships, including one at Amazon Web Services (AWS), where I learned a lot about writing professional grade software. During my Master's program, I worked in a lab writing machine learning code and overseeing part of the robotics development as well. I was also a project manager for a coding club in college, leading a team of four students to create a machine learning-based asset price predictor.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I coached private/group tennis lessons for ages 4-70+. In college, I tutored some friends through their coding classes. These opportunities showed me the power of teaching and what a difference it can make in people's lives. \u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am passionate about Machine Learning, Coding, Math, and Robotics, and can teach them all! I will draw on my prior experiences in industry, teaching, and project managing to give your child the practical skills they will need for the future in an engaging and structured manner. I look forward to meeting you and your child!\u003c/p\u003e","teachingVideoPlaybackId":"yDkHstXFnuXoLbPlhjdPW5lA2XDb4jcP00rcAsOj02Eng","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"03827bfb-ec12-469e-8b23-123d04b3b872\"}"},{"__ref":"DeepDives:{\"uuid\":\"17728f45-41f4-4b30-9e1e-ad2c49acf690\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d8f5d42-e44c-4eea-9d61-075b60e52c47\"}"},{"__ref":"DeepDives:{\"uuid\":\"39c4afb3-f285-42c5-ad3b-544dec9a13aa\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f8b73e74-3947-400b-b604-c58d021e9c92/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"36a854f2-1ea9-4c2a-a043-0c8b78163b6c\"}"},{"__ref":"Education:{\"uuid\":\"3b52f21f-0a67-412e-96b8-db1f925a0394\"}"}],"hiredAt":"2024-09-11T04:20:40.589Z","topics":["Coding / Programming"],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gyaan-antia\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6ec580a0-c316
