xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fdcf7558-761e-4509-bb06-d90ad9cc197b\"}":{"__typename":"Favorites","uuid":"fdcf7558-761e-4509-bb06-d90ad9cc197b","photoUrl":"https://ucarecdn.com/e80a6a0d-5bb5-4500-82f2-7936fa33e966/","title":"Boxing","type":"SPORT"},"Favorites:{\"uuid\":\"1685846f-c2d4-4b64-b64d-ff4bd7bf58a6\"}":{"__typename":"Favorites","uuid":"1685846f-c2d4-4b64-b64d-ff4bd7bf58a6","photoUrl":"https://ucarecdn.com/e80a6a0d-5bb5-4500-82f2-7936fa33e966/","title":"Paris, France","type":"CITY"},"Favorites:{\"uuid\":\"89db8113-c040-4f4a-b0ac-d54900e2a6c6\"}":{"__typename":"Favorites","uuid":"89db8113-c040-4f4a-b0ac-d54900e2a6c6","photoUrl":"https://ucarecdn.com/e80a6a0d-5bb5-4500-82f2-7936fa33e966/","title":"Ferris Bueller's Day Off","type":"MOVIE"},"CausesSupported:{\"uuid\":\"982686a2-2fa9-4b37-b5d6-1533961bddd9\"}":{"__typename":"CausesSupported","uuid":"982686a2-2fa9-4b37-b5d6-1533961bddd9","name":"World Without Exploitation","description":"\u003cp\u003eWorldWE fights sex trade, aiding survivors via laws and support services.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/ba6caaa0-78cb-4e8f-a29a-c7c0241a7963/"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c77e41c4-e98c-414c-a2c5-af1781b37cb1\"}":{"__typename":"DeepDives","uuid":"c77e41c4-e98c-414c-a2c5-af1781b37cb1","content":"\u003cp\u003eWhen I was younger, I thought that I was going to be a filmmaker. I used to shoot and edit movies with my friends on the weekends, go to film camps in the summers, volunteer on film and television sets, and I even acted in some plays, commercials, and short films too. I’ve had my own films screened at half a dozen film festivals and have even won a few awards! In high school, I spent three years as the director of the NYC Teen Film Festival, a citywide youth film festival run by students \u003cem\u003efor\u003c/em\u003e students. I loved getting to watch so many incredible student-made films, meet talented teen filmmakers, and work with the industry professionals who volunteered to judge the festival’s submissions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile I no longer consider filmmaking as a professional aspiration, I apply my talents to countless endeavors in my everyday life, from developing videos promoting activism, freelance editing work, and personal creative projects with friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"dce51cc2-aaa5-42aa-8f5b-43d31734409a\"}":{"__typename":"DeepDives","uuid":"dce51cc2-aaa5-42aa-8f5b-43d31734409a","content":"\u003cp\u003eMy dream job is real estate development. Before I was born, my mom and dad co-founded a small real estate development business in Brooklyn. Over the years, they grew it into an incredible company, making phenomenal achievements such as the construction of workforce housing, three large-scale homeless shelters, and the country’s first battered women's shelter that welcomes pets (many women are afraid to leave abusive relationships to seek refuge in shelters if it means that they cannot bring their pets with them). The summer before college, I was struggling to figure out what I should study so I decided to spend a year exploring my interests and potential career pursuits. After receiving approval from Cornell to defer for a gap year, I asked my dad for the opportunity to work for his company. He agreed and assigned me to work construction in the basement of a 228-unit half-apartment half-hotel building in the center of Philadelphia. A couple of weeks into my role as a construction worker, my dad gave me a call informing me that the building’s management company had been let go. He asked me if I would be willing to move into the building for a week or two to help tour prospective tenants while he secured a new management company to take over. I of course agreed right away and moved into a vacant apartment that afternoon. After three days of a successful wave of tours, he called me again and invited me to permanently relocate to Philly to act full-time as the assistant general manager of the entire building under the supervision of his colleague. I of course agreed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor ten months of my gap year, I lived and worked at that Philly property, clocking no less than 130 hours a week engaging with tenants, overseeing the 20-person construction team building additional apartment units, managing the building’s maintenance staff through all their tickets and tasks, and helping the hotel team create new processes and procedures to maximize their success. I conducted hundreds of tours for prospective tenants, hired dozens of new employees, collaborated with city officials to expand the building’s services, and worked with the Department of Labor and Licenses to pass inspections and obtain permits to open new units, a cafe, and a parking garage. While in Philly, my dad also asked me to spearhead the renovation of a 3,000-square-foot single-family home that he had bought but never had the time to renovate himself. Collaborating with a local architect and construction team that I’d sourced myself, I did a complete gut of the building down to its foundations, remodeled it, and built it back new. A ton of the effort that went into that house was with my own two hands—jackhammers, nail guns, saws, operating heavy machinery, ordering hardware and supplies, laying the brick and mortar, framing the rooms and walls, designing the kitchen. You name it, I’ve done it. My dad only finally released me from my position in Philly once I had selected and trained the management company that would replace me, bringing an end to an incredible, indelible experience. I spent the rest of my gap year backpacking alone through Europe where I visited over 12 countries and 25 different cities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can’t begin to express the impact that year had on me. I learned how to problem-solve, delegate, and lead adults far more accomplished and knowledgeable than me. Through literal fires and floods, I gained confidence and resiliency and showed myself just what I could accomplish, despite my inexperience, through hard work and patience alone. Not being aware of how deep a water my dad was throwing me into let me skip past the anxieties of whether or not I was qualified and pushed me to deliver no matter the challenge. I found a truly fulfilling niche in real estate through my time in Philly, one which I hope to spend the rest of my life pursuing. My ultimate professional aspiration is to combine real estate with my work related to gender-based violence in a similar way as my parents do with the shelters and workforce housing they develop.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6d184860-4537-430b-a5cb-99b7b694c9ea\"}":{"__typename":"DeepDives","uuid":"6d184860-4537-430b-a5cb-99b7b694c9ea","content":"\u003cp\u003eI first explored my interests in scientific research throughout high school, where I worked for three years in a neuroscience lab studying the long-lasting effects of early-life stress in rodents. While that experience ultimately showed me that I wasn’t cut out for the scientist life, it cultivated my curiosity and taught me a ton about productive collaboration. It also helped me see the value self-reflection and exploration have in enhancing my understanding of the world, not just in STEM but in day-to-day life, too.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eComing to Cornell, I wanted to study in a field that allowed me to continuously reflect on meaningful and challenging questions about the world and my place in it. A dual major in philosophy and cognitive science was a natural choice for me, as they encourage a great deal of introspection that I believe will continue to contribute to my maturity and personal growth. I’m also interested in pursuing a J.D. after undergraduate school and believe that these two majors do an incredible job of preparing me to think critically and articulate confidently—two important traits for any law student.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve had the opportunity to explore my interest in philosophy outside of the classroom, too. I serve as an editor for \u003cem\u003eLogos\u003c/em\u003e, the scholastic journal of philosophy at Cornell, where my peers and I evaluate scholarly submissions from across the nation and organize an annual, prestigious philosophy conference in partnership with the University of Pennsylvania. Being a member of the small but mighty community of philosophers at Cornell has been a particularly enriching aspect of my time here so far.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"d7920a6a-e9e5-42bb-bd03-13658a295ba6\"}":{"__typename":"DeepDives","uuid":"d7920a6a-e9e5-42bb-bd03-13658a295ba6","content":"\u003cp\u003eI’m most proud of the activism work I do. One of my greatest passions from a young age has been fighting against gender-based violence. I first became involved in middle school, when I was a production assistant for the filming of a PSA on a legislative bill meant to combat sex trafficking. I’ve advocated for survivors of the sex trade ever since, working with World Without Exploitation, the largest anti-trafficking coalition in the country. Our work includes raising awareness of the commercial sex trade, creating legislative change to protect survivors, and fighting for exit services for individuals engaged in the sex trade.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn 2019, I co-founded World Without Exploitation’s Youth Coalition, which engages in education, advocacy, and activism on high school and college campuses. I had the opportunity to apply my skills in filmmaking as the coalition’s original videographer, creating educational content and promotional videos. My favorite project was a short documentary that I developed where I interviewed survivors of the sex trade on the legislation that helps keep survivors safe. In 2022, I was awarded World Without Exploitation’s Igniting Change award for helping the organization expose an illicit massage parlor in my neighborhood.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile on my gap year last year, I had the incredible experience of spending over three months in Paris working for an NGO with a very similar mission to World Without Exploitation. Coming to college this year, I quickly found my place as a member of the executive board of Cornell’s Students Against the Sexual Solicitation of Youth, or ‘SASSY,’ with a similar mission of raising awareness of sexual exploitation and human trafficking in the Cornell and Ithaca Community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"c2caa136-fabf-4d3a-b784-dfed38db9d71\"}":{"__typename":"School","uuid":"c2caa136-fabf-4d3a-b784-dfed38db9d71","name":"The Packer Collegiate Institute","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11201"},"Education:{\"uuid\":\"8c82de6f-ca63-4ee5-b3ee-ff71342733b0\"}":{"__typename":"Education","uuid":"8c82de6f-ca63-4ee5-b3ee-ff71342733b0","school":{"__ref":"School:{\"uuid\":\"c2caa136-fabf-4d3a-b784-dfed38db9d71\"}"},"startYear":"2009","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"0b631b4a-2bd9-4bd9-8eb5-70269c5874dd\"}":{"__typename":"Education","uuid":"0b631b4a-2bd9-4bd9-8eb5-70269c5874dd","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Philosophy \u0026 Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"a0e24ef8-2f50-4f36-a2bb-da0fc98efafe\"}":{"__typename":"MentorPublicProfile","uuid":"a0e24ef8-2f50-4f36-a2bb-da0fc98efafe","displayName":"Matthew K.","slug":"matthew-kodsi","biography":"\u003cp\u003eHey! My name is Matt, and I am a junior at Cornell University’s College of Arts \u0026amp; Sciences. I’m currently studying philosophy and cognitive science and pursuing a pre-law track with a minor in Law \u0026amp; Society and Real Estate.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up in Brooklyn, New York, and attended Packer Collegiate Institute for thirteen years. At Packer, I was a Peer Support leader helping freshmen adjust to the change in workload and social life that comes with entering high school. I also sat on our school’s Judiciary Council for four years where I addressed cases of academic and behavioral violations within the student body. On the council, our goal was to allow students to be heard by their peers in a constructive setting and gain perspective on their actions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy first dream career prospect began in middle school with my excitement for filmmaking. I remained a dedicated young director for years, making short movies with friends and going to film camp in the summers. As I got older, my interests expanded, leading me to new areas of excitement and engagement—though my love for filmmaking still remains. In ninth grade, an older friend aware of my enthusiasm for STEM suggested that I apply for our school’s independent science research program. I was accepted into the select program and, like all things I set my mind to, I poured all my energy and excitement into it. I worked for three years in a neuroscience lab before finally concluding that scientific life wasn’t for me either.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFollowing in my parent’s footsteps, my true professional aspiration lies in marrying my passion for real estate with advocacy against gender-based violence. Drawing from the hands-on experience I gained working in real estate development throughout my gap year, I envision creating safe, empowering spaces for survivors of human trafficking and gender-based violence. I’m motivated my desire to aid those in disadvantaged situations by implementing survivor-informed legislation and neighborhood infrastructure initiatives to strengthen communities. Whether it's developing housing that doubles as a sanctuary for those escaping abusive situations or utilizing film to shed light on their circumstances. Ultimately, my aim is to integrate the compassion of advocacy with the concrete results of real estate development in order to construct environments that are not just physically safe but also promote healing and empowerment.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond academics and career pursuits, I really like to play the piano and guitar, even if I’m not too good, and I also love to box. There are few things better than getting in the ring and sparring at my neighborhood gym when I’m back in Brooklyn.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"fdcf7558-761e-4509-bb06-d90ad9cc197b\"}"},{"__ref":"Favorites:{\"uuid\":\"1685846f-c2d4-4b64-b64d-ff4bd7bf58a6\"}"},{"__ref":"Favorites:{\"uuid\":\"89db8113-c040-4f4a-b0ac-d54900e2a6c6\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"982686a2-2fa9-4b37-b5d6-1533961bddd9\"}"}],"major":"Philosophy \u0026 Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c77e41c4-e98c-414c-a2c5-af1781b37cb1\"}"},{"__ref":"DeepDives:{\"uuid\":\"dce51cc2-aaa5-42aa-8f5b-43d31734409a\"}"},{"__ref":"DeepDives:{\"uuid\":\"6d184860-4537-430b-a5cb-99b7b694c9ea\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7920a6a-e9e5-42bb-bd03-13658a295ba6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cdfcfa7a-ea80-4477-8e3b-799554222bea/-/preview/-/format/jpg/","https://ucarecdn.com/aca25899-d263-4e47-b47c-f91e3ad00f03/-/preview/-/format/jpg/","https://ucarecdn.com/b54a8dbb-90d2-435f-908f-962d0f7825a8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8c82de6f-ca63-4ee5-b3ee-ff71342733b0\"}"},{"__ref":"Education:{\"uuid\":\"0b631b4a-2bd9-4bd9-8eb5-70269c5874dd\"}"}],"hiredAt":"2024-04-13T00:46:57.998Z","topics":["Creative Writing","Video / Photography","Film / Theater","K-6 Storybook","History Project","Business / Entrepreneurship","Finance / Investing","Web Design","Law / Government / Policy","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},
