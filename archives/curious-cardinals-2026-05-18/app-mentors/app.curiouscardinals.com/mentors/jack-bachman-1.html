xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b27eb035-abde-447e-9811-30d5c50e52a0\"}":{"__typename":"DeepDives","uuid":"b27eb035-abde-447e-9811-30d5c50e52a0","content":"\u003cp\u003eSay \"yes\" to everything! My middle and high school years were so formative to who I am today. These years don't define you, but they can set the foundation for a wonderful academic career. I said yes to every club, every extra credit opportunity, and everything that was out of my comfort zone in these years, and it led me to Brown, one of the greatest gifts in the world. I am thrilled to be the person I am today because I said \"yes\" to so much when I was younger!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"895c31f7-e291-4373-be58-103445522f72\"}":{"__typename":"DeepDives","uuid":"895c31f7-e291-4373-be58-103445522f72","content":"\u003cp\u003eIn my involvements, whether that's being a tour guide, leading Brown Lecture Board, or performing in my a cappella group, I aim to entertain and bring joy to those around me. It brings me so much pride that I've been able to carve out an academic and extra-curricular path that brings joy to both me and those that it serves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"d46b542f-94bc-4585-bd92-9869153a399b\"}":{"__typename":"DeepDives","uuid":"d46b542f-94bc-4585-bd92-9869153a399b","content":"\u003cp\u003eI have three brothers: one older, one twin, and one younger. I have a reoccurring dream that I am stuck in my twin's body, and my twin is stuck in mine. In this dream, we try to explain to our family that we have switched bodies, but because we're already so similar, no one believes us. You would think it's a funny dream, but it's actually quite terrifying!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3963f442-e71e-42c0-9295-e48aa7f3c4e2\"}":{"__typename":"DeepDives","uuid":"3963f442-e71e-42c0-9295-e48aa7f3c4e2","content":"\u003cp\u003eMy majors, Economics and English, provide me with the perfect opportunity to explore all of my academic and career-interests. With these majors, I hope to graduate and pursue a career in entertainment finance, helping to shepherd the talents of artists, writers, and producers to the forefront of popular culture.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"2c457665-dc24-46f8-b684-fcb56e189263\"}":{"__typename":"Education","uuid":"2c457665-dc24-46f8-b684-fcb56e189263","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Business Economics/English","degree":null},"School:{\"uuid\":\"adbf2357-0987-4eff-9cb1-f31d808fc948\"}":{"__typename":"School","uuid":"adbf2357-0987-4eff-9cb1-f31d808fc948","name":"North Penn High School","city":"Lansdale","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19446"},"Education:{\"uuid\":\"a76ad7f2-b51a-4590-89bd-b5349724553d\"}":{"__typename":"Education","uuid":"a76ad7f2-b51a-4590-89bd-b5349724553d","school":{"__ref":"School:{\"uuid\":\"adbf2357-0987-4eff-9cb1-f31d808fc948\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ba63e90e-c28b-4882-a727-caebaf6096c2\"}":{"__typename":"MentorPublicProfile","uuid":"ba63e90e-c28b-4882-a727-caebaf6096c2","displayName":"Jack B.","slug":"jack-bachman-1","biography":"\u003cp\u003eJack is a junior at Brown University studying Business Economics and English. His academic interests live at the intersection of storytelling and strategy - he’s equally passionate about writing screenplays and analyzing economic trends. At Brown, he’s completed coursework in microeconomics, econometrics, digital media, and labor economics, and has served as a Teaching Assistant for courses in managerial decision-making and nonprofit management. Two summers ago, Jack worked as a policy intern with the Pennsylvania House of Representatives, and last summer, he was a business development intern at Live Nation in New York City. In summer of 2026, Jack will be an Associate Consultant Intern with Bain \u0026amp; Co. in NYC! Whether it's breaking down complex math homework or refining a thesis statement, Jack is excited to help students sharpen their skills and find joy in learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOriginally from Philadelphia, Jack grew up doing theater and writing scripts in his notes app. That love for entertainment stuck: he currently serves as the Vice President of Logistics for Brown Lecture Board, where he’s helped bring major figures like Colin Jost and JoJo Siwa to campus -- ask to see his pictures with them! He is also the director of Special Events for the Brown Entrepreneurship program, where he plans and attends recruiting trips that connect Brown students to start-ups and VC firms across the country. Outside of class, you can find him giving campus tours or performing with \u003cem\u003eThe Jabberwocks\u003c/em\u003e, Brown’s oldest a cappella group, where he tours, records, and sings arrangements with his closest friends. Last year, \u003cem\u003eThe Jabberwocks \u003c/em\u003etook a 10-day trip to Seoul, South Korea! He plays tennis at school every week, and Toni Morrison, James Baldwin, and George Orwell are some of his favorite authors!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eJack has years of experience tutoring students in everything from high school economics and math to essay writing, college application prep, and creative writing. He specializes in economics, film, and TV, but is just as comfortable helping students structure a strong analytical argument or brainstorm their very first screenplay. In addition to homework help and teaching lessons, Jack is well-versed in passion project construction. He has produced multiple short films and written countless screenplays. He’s happy to help you write your own book, conduct archival research, conduct economic research, and so much more!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eJack is a creative and proactive student that is both excited and passionate about helping others find their niche and complete their academic goals. If you’re looking for help in school or simply want to explore your passions in a new way, he’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"zphPWr7mAfAushud01oX6Gc01I02h1WviSAHG022ITNTEwc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business Economics/English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b27eb035-abde-447e-9811-30d5c50e52a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"895c31f7-e291-4373-be58-103445522f72\"}"},{"__ref":"DeepDives:{\"uuid\":\"d46b542f-94bc-4585-bd92-9869153a399b\"}"},{"__ref":"DeepDives:{\"uuid\":\"3963f442-e71e-42c0-9295-e48aa7f3c4e2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/32535448-566e-4d1f-86d4-cbf16859c2e0/-/preview/-/format/jpg/","https://ucarecdn.com/6fda2750-2b5d-4101-8f22-7e7b17890862/-/preview/-/format/jpg/","https://ucarecdn.com/46ec1e48-6397-47ca-83b9-b0a8fac7c97b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2c457665-dc24-46f8-b684-fcb56e189263\"}"},{"__ref":"Education:{\"uuid\":\"a76ad7f2-b51a-4590-89bd-b5349724553d\"}"}],"hiredAt":"2025-06-11T19:21:32.539Z","topics":["Business / Entrepreneurship","Law / Government / Policy","Journalism","Economics","Finance / Investing","College Essay Writing","Academic Coaching","Algebra I","Algebra II","Creative Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jack-bachman-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ba63e90e-c28b-4882-a727-caebaf6096c2\"}"}}},"_sentryTraceData":"74f2b16c65b6484e86750558378936ba-951494cebe75d134-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=74f2b16c65b6484e86750558378936ba,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jack-bachman-1"},"buildId":"ZAcrs1hPe6xcPE
