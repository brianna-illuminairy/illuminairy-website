xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"85ad6aaf-66f1-469d-8719-fe79ac10516a\"}":{"__typename":"Favorites","uuid":"85ad6aaf-66f1-469d-8719-fe79ac10516a","photoUrl":"https://ucarecdn.com/ab683f2d-0936-4a7d-b6a2-fa5d2492ffa9/","title":"Meryl Streep","type":"ACTOR"},"Favorites:{\"uuid\":\"ad0cf359-8d08-40c1-9649-2ebe22fc034d\"}":{"__typename":"Favorites","uuid":"ad0cf359-8d08-40c1-9649-2ebe22fc034d","photoUrl":"https://ucarecdn.com/9de19c62-be01-4479-bd1f-36ac0e1c6c5a/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"ab890bf6-4657-4461-97c3-bc1ce5f3ce72\"}":{"__typename":"Favorites","uuid":"ab890bf6-4657-4461-97c3-bc1ce5f3ce72","photoUrl":"https://ucarecdn.com/6d47cd82-169b-464b-bb06-f63a50581795/","title":"Midnight in Paris","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"326e5135-aa2a-4e7d-be88-06a7f4835c1f\"}":{"__typename":"DeepDives","uuid":"326e5135-aa2a-4e7d-be88-06a7f4835c1f","content":"\u003cp\u003eYou don't need to blend in because you're born to stand out. Every person has their own niche; don't shy away from it. Embrace it! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"89752353-0e53-4609-b49d-19c31f180086\"}":{"__typename":"DeepDives","uuid":"89752353-0e53-4609-b49d-19c31f180086","content":"\u003cp\u003eI wouldn't be the person I am today without all the mentors I've encountered in the past. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt every pivotal moment in my life — from working as a journalist, to applying to college, to interning at a hedge fund — there was always someone who took the time to guide me, believed in me, and pushed me to go out of my comfort zone. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThose mentors helped me build confidence in my own voice and judgment. They shaped how I approach challenges, opportunities, and growth. I want to be that person for someone else — someone who will always have faith in someone even if they can't see it for themselves at first. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d30525b2-a943-400c-848e-726a9144165b\"}":{"__typename":"DeepDives","uuid":"d30525b2-a943-400c-848e-726a9144165b","content":"\u003cp\u003eI want to become one of the best in my field, whatever that field may be. My mother is a solo violinist — not the most traditional career path — but she became one of the best at what she does. Watching her taught me the importance of loving your work. When you truly love what you do, your job isn’t just a way to make ends meet; it becomes your passion, your purpose, and something that brings you fully to life. That’s the kind of fulfillment I hope to find for myself too.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c9755816-d5e1-4530-85e6-97b50439de9d\"}":{"__typename":"DeepDives","uuid":"c9755816-d5e1-4530-85e6-97b50439de9d","content":"\u003cp\u003eMentorship matters to me because nothing brings me more fulfillment than seeing someone grow. I think this value comes from my family, especially my mother and grandmother, who have always led with generosity and care for others. Watching them taught me that the most meaningful work is often quiet and selfless — and mentorship allows me to live that lesson by helping others grow into themselves.\u003c/p\u003e\u003ch3\u003e\u003c/h3\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"8294116e-a190-41eb-a458-e542ee61c042\"}":{"__typename":"School","uuid":"8294116e-a190-41eb-a458-e542ee61c042","name":"St. Paul's School","city":"Concord","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03301"},"Education:{\"uuid\":\"cc2035eb-422c-4d3c-aeb6-67eff6234581\"}":{"__typename":"Education","uuid":"cc2035eb-422c-4d3c-aeb6-67eff6234581","school":{"__ref":"School:{\"uuid\":\"8294116e-a190-41eb-a458-e542ee61c042\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"fd043c78-5e50-4acd-b355-9ea74bd1fe91\"}":{"__typename":"Education","uuid":"fd043c78-5e50-4acd-b355-9ea74bd1fe91","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Symbolic Systems","degree":null},"MentorPublicProfile:{\"uuid\":\"becc42e5-2d8d-445c-a01b-4da9a872aed4\"}":{"__typename":"MentorPublicProfile","uuid":"becc42e5-2d8d-445c-a01b-4da9a872aed4","displayName":"Clara K.","slug":"clara-ki","biography":"\u003ch3\u003e\u003cstrong\u003e🌟 Hi! I’m Clara.\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI’m a current student at Stanford University from Hong Kong, majoring in Symbolic Systems and pursuing a Master’s in Computer Science. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re wondering \u003cem\u003e“what even is Symbolic Systems?”\u003c/em\u003e — you’re not alone. It’s an interdisciplinary major that blends math, computer science, linguistics, psychology, and philosophy to understand how humans think, learn, and communicate. In many ways, it perfectly reflects how I approach mentorship: blending logic with creativity, structure with curiosity, and rigor with confidence-building.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also attended boarding school in New Hampshire, which taught me early on how to learn independently, take ownership of my interests, and turn curiosity into meaningful passion projects. Being away from home at a young age pushed me to manage my time, self-advocate, and build confidence in unfamiliar environments—skills I now love helping students develop for themselves.\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e🚀 What I’ve Done So Far\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’ve always been drawn to turning ideas into real outcomes.\u003c/p\u003e\u003cp\u003eDuring my gap year, I wrote my own 100,000-word book and worked at one of the largest newspaper companies in Hong Kong, where I strengthened my storytelling, writing, and critical-thinking skills. I later designed and coded a friendship-matching app centered on mutual skill-building, combining psychology, design, and engineering to help people form more meaningful connections.\u003c/p\u003e\u003cp\u003eIn addition, I run a nonprofit organization that teaches English, Math, and Film to underserved communities through hands-on educational kits. Through this work, I’ve learned how to make complex ideas accessible, engaging, and empowering for students with different learning styles.\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e🎯 What I Specialize In\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI specialize in Passion Project and Academic Mentorship for middle school and high school students, especially those who want to build confidence and stand out authentically.\u003c/p\u003e\u003cp\u003eSubjects and areas I support most include creative writing and storytelling, college essays and high school applications, math with an emphasis on conceptual understanding, and public speaking and presentations. I particularly enjoy helping students discover their interests, shape them into strong projects, and communicate their ideas clearly and confidently.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eCore focus:\u003c/strong\u003e\u003cbr\u003eConfidence-building — helping students trust their voice, ideas, and ability to grow.\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e🧠 My Mentorship Approach\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eMy teaching is grounded in a growth mindset. I believe that with consistent effort, reflection, and belief in oneself, students are capable of far more than they often realize. I create a supportive, low-pressure space where students feel safe to try, make mistakes, and improve. Sessions with me are structured but flexible, focused on helping students understand why things work—not just what to do—so they gain confidence that lasts beyond a single assignment.\u003c/p\u003e\u003cbr\u003e\u003chr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003e😄 Fun Facts\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI once ran a fan account for my love of Percy Jackson ⚡\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI love baking (banana chocolate chip cookies are my specialty 🍪)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI enjoy editing short videos to capture the small moments in life—and we can make one together too!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"csnhBdgHSTKOg01i17ruq3I02MZmsnCNp00gIbCwFlpRFo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"85ad6aaf-66f1-469d-8719-fe79ac10516a\"}"},{"__ref":"Favorites:{\"uuid\":\"ad0cf359-8d08-40c1-9649-2ebe22fc034d\"}"},{"__ref":"Favorites:{\"uuid\":\"ab890bf6-4657-4461-97c3-bc1ce5f3ce72\"}"}],"causesSupported":[],"major":"Symbolic Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"326e5135-aa2a-4e7d-be88-06a7f4835c1f\"}"},{"__ref":"DeepDives:{\"uuid\":\"89752353-0e53-4609-b49d-19c31f180086\"}"},{"__ref":"DeepDives:{\"uuid\":\"d30525b2-a943-400c-848e-726a9144165b\"}"},{"__ref":"DeepDives:{\"uuid\":\"c9755816-d5e1-4530-85e6-97b50439de9d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/03b4f3f0-09b1-4c73-8347-609054f7633f/-/preview/-/format/jpg/","https://ucarecdn.com/31eb1424-400c-4d34-b6eb-469a626de314/-/preview/-/format/jpg/","https://ucarecdn.com/e91d96f2-e39a-4c8d-b0dd-51a2927951e9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cc2035eb-422c-4d3c-aeb6-67eff6234581\"}"},{"__ref":"Education:{\"uuid\":\"fd043c78-5e50-4acd-b355-9ea74bd1fe91\"}"}],"hiredAt":"2025-12-28T05:58:37.678Z","topics":["Writing","Mandarin Chinese","Academic Coaching","College Essay Writing","Creative Writing","Business / Entrepreneurship","Finance / Investing","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/d441189b-003a-4aab-82f0-564452e913e7/","https://ucarecdn.com/4898ea96-6627-4c32-80af-8dd44881bd39/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":t
