45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"95303954-0eda-41e0-8ca5-c1e1fd906f85\"}":{"__typename":"DeepDives","uuid":"95303954-0eda-41e0-8ca5-c1e1fd906f85","content":"\u003cp\u003eIn my spare time, I often visit the many repertory theaters in New York City. It's been incredible to explore the history of film through these screenings. I am also in a book club with two of my closest friends from college, which has been a fantastic way to stay in touch (they both live in Chicago) and expose myself to new genres that they love but I'm much less familiar with. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"3021fc44-3177-4fd6-84bc-422ac75073b5\"}":{"__typename":"School","uuid":"3021fc44-3177-4fd6-84bc-422ac75073b5","name":"West Morris Mendham High School","city":"Mendham Borough","type":"HIGH","state":"New Jersey","country":"United States","zip":"07945"},"Education:{\"uuid\":\"c555ac61-1fdc-4faf-9da9-58c009818505\"}":{"__typename":"Education","uuid":"c555ac61-1fdc-4faf-9da9-58c009818505","school":{"__ref":"School:{\"uuid\":\"3021fc44-3177-4fd6-84bc-422ac75073b5\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"212a85c8-56e3-4a42-a52e-4c8293af3f87\"}":{"__typename":"Education","uuid":"212a85c8-56e3-4a42-a52e-4c8293af3f87","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Radio/Television/Film","degree":null},"MentorPublicProfile:{\"uuid\":\"64b15f4b-3f53-4233-87a6-c71b7b8f6fe3\"}":{"__typename":"MentorPub
