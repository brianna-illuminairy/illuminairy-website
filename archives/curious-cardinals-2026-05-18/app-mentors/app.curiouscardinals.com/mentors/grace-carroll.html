xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5899f682-1435-47a0-aeb8-3b150c3f6578\"}":{"__typename":"DeepDives","uuid":"5899f682-1435-47a0-aeb8-3b150c3f6578","content":"\u003cp\u003eA bit of everything! I worked as a retail sale associate, I wrote for local newspapers, I spent a month backpacking in Alaska and a month making podcasts in Taipei. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ee84cb7a-1a1b-495b-a850-1a3d2e330ba3\"}":{"__typename":"DeepDives","uuid":"ee84cb7a-1a1b-495b-a850-1a3d2e330ba3","content":"\u003cp\u003eI am who I am because of powerful mentors. My older brother, in particular, played an outsized role in my high school career; he was constantly directing me towards writers, musicians and artists that sparked new passions, new interests or new ways of thinking. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"bec958c7-2556-436d-aa8a-8996da49381d\"}":{"__typename":"DeepDives","uuid":"bec958c7-2556-436d-aa8a-8996da49381d","content":"\u003cp\u003eLanguage is everywhere! The world is always going to need good writers and strong communicators. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}":{"__typename":"School","uuid":"62e59c56-ee46-4213-b082-758af3ff99db","name":"Phillips Exeter Academy","city":"Exeter","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03833"},"Education:{\"uuid\":\"332d72ea-d239-4e6c-9d56-f7d00f8a9a4e\"}":{"__typename":"Education","uuid":"332d72ea-d239-4e6c-9d56-f7d00f8a9a4e","school":{"__ref":"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}"},"startYear":"2016","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4f2de06b-33c6-4d16-a7af-963881b60622\"}":{"__typename":"Education","uuid":"4f2de06b-33c6-4d16-a7af-963881b60622","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"f153c755-72d7-49b0-82f8-76a783d0d6ee\"}":{"__typename":"MentorPublicProfile","uuid":"f153c755-72d7-49b0-82f8-76a783d0d6ee","displayName":"Grace C.","slug":"grace-carroll","biography":"\u003cp\u003eI’m in my final year of an interdisciplinary English degree at Stanford, fusing my love of literature with my passion for journalism and nonfiction writing. In addition to a long stint at the Stanford Daily, most notably a tenure editing the Daily’s longform magazine, I’ve worked as a freelance journalist for newsrooms in New York City, Northern California, and Taipei, Taiwan. I discovered my love of journalism in high school and it’s made my world bigger and broader in a million ways, while also giving me the tools to create positive change in my communities and hold power to account.\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was recently recognized by the Society of Professional Journalists for a longform investigation into misconduct at Stanford. Some voices on the page that really inspire me include Joan Didion, John McPhee, Janet Malcolm and Renata Adler. Beyond journalism, I’m a voracious reader — some recent favorites include \u003cem\u003eTo the Lighthouse \u003c/em\u003eby Virginia Woolf and \u003cem\u003eSlaughterhouse Five \u003c/em\u003eby Kurt Vonnegut. I’m particularly excited about the intersections between writing and cultural criticism, art history and social justice.\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up between Hong Kong and San Francisco, and have studied Mandarin Chinese since I was five years old. Like journalism, speaking Mandarin has enabled me to travel, explore and broaden the horizons of my world. I hope to eventually work as an international journalist with a focus on US-China relations.\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eMy teaching style has been heavily influenced by my experience as an outdoor educator! I spent three months backpacking through the Rocky Mountains with NOLS during the pandemic, and returned to NOLS to help lead courses in the Adirondacks. I just returned from a summer teaching at The Island School in Eleuthera, The Bahamas, facilitating incredible learnings for a group of sixty high schoolers, exploring the island on land and by sea and teaching classes about the economic and ethical impacts of the tourism industry. When not writing, reading or teaching, you can find me running on Crissy Field or hiking in the Marin Headlands.\u003c/p\u003e","teachingVideoPlaybackId":"c8eZym01tMVNiB01XBw1G8TAH01fO02XSGN26QFFs2B00h9s","teachingVideoDescrip
