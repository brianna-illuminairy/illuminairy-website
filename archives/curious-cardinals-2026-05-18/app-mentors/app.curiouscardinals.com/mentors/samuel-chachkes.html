ctor when he received the summer 2022 “Counselor of the Summer” award from among 40 other cabin leaders.\n\nSam has a creative approach to teaching and understands that learning neither starts nor ends in a classroom. To that end, Sam took a semester off from college last fall in order to work as the Campaign Manager for a successful State Senate campaign. Between his classes and his extracurricular work on film projects and political initiatives, Sam enjoys baking, running, hosting dance parties with his friends, and writing screenplays.\n\nSam believes that learning, above all, should be fun, and he is excited to help students become engaged, passionate scholars!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Politics, Philosophy, and Economics","deepDives":[],"active":true,"profilePhotos":["https://api.dicebear.com/7.x/initials/svg?seed=SC","https://ucarecdn.com/592b413e-7d4b-4313-95d0-d28f78c03ff0/-/crop/573x571/44,22/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"577c02ec-b2b6-461b-b316-45153bc151d9\"}"}],"hiredAt":"2023-06-03T21:02:57.895Z","topics":["Film / Theater","Creative Writing","World Cultures","Public Speaking","Law / Government / Policy","Debate","Statistics","Reading","History","Executive Function","Economics","College Essay Writing","Academic Coaching","Writing","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"samuel-chachkes\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"526303d2-bbba-4175-8437-9e9c0b086c34\"}"}}},"_sentryTraceData":"2f1009a4aec44406a3b70fd234aa6a6e-b69a003b77e8a441-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-tr
