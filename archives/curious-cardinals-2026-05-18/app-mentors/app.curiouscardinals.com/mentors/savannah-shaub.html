xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"750853b6-e1be-4539-9c13-aed71db837b9\"}":{"__typename":"Favorites","uuid":"750853b6-e1be-4539-9c13-aed71db837b9","photoUrl":"https://ucarecdn.com/ed9395a9-e4c3-4268-9833-630e8a37779d/","title":"Demon Copperhead by Barbara Kingsolver","type":"BOOK"},"Favorites:{\"uuid\":\"352ba53b-5c48-48ba-8d2c-a6c199d02a92\"}":{"__typename":"Favorites","uuid":"352ba53b-5c48-48ba-8d2c-a6c199d02a92","photoUrl":"https://ucarecdn.com/5c77b7b5-3f6e-47d7-8dab-4d497e51b127/","title":"Paris, France!!","type":"CITY"},"Favorites:{\"uuid\":\"a917c788-bf04-4956-83db-39b9372f9f52\"}":{"__typename":"Favorites","uuid":"a917c788-bf04-4956-83db-39b9372f9f52","photoUrl":"https://ucarecdn.com/2ce5c1c6-5547-4e23-9fd3-9b3492b482e4/","title":"Water Polo (especially Harvard Westlake...)","type":"SPORT"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6f30c075-102e-4e0b-b8e9-e39365c4a38f\"}":{"__typename":"DeepDives","uuid":"6f30c075-102e-4e0b-b8e9-e39365c4a38f","content":"\u003cp\u003eIn coming to Cornell University, I intended to pursue a track in applied economics and Mandarin. I was attracted to the conventionality of the pairing and contended that its post-college \u003cem\u003esafeness\u003c/em\u003e was perfect for me. In constructing my schedule for my freshmen fall, I enrolled in an introductory philosophy course for no reason other than that the course description seemed \"cool\". Within a week of the course, I was in love. I remember calling my Dad one morning, and when he asked what it was that I loved so much about the course, I responded, \"I feel that philosophy makes me a better, more well-rounded person.\" The course pushed me into collecting my most profound thoughts and ideas and forces me to grapple with introspective and existential questions of my own life and the way I want to live.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eNow having declared a philosophy major and exploring upper-level  courses, I still hold this to be true. I am most passionate about metaphysical philosophy, and am currently fixated on the question: what is human agency? I entwine my international studies of East Asia and the Middle East to compare and explore the fundamental differences in the human experience as a consequence of religious and social factors. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"37b16338-6070-4c18-841b-9a3f88967ff7\"}":{"__typename":"School","uuid":"37b16338-6070-4c18-841b-9a3f88967ff7","name":"Harvard-Westlake School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90077"},"Education:{\"uuid\":\"3cb2c3f0-9379-4679-922d-0fb6d2f2c818\"}":{"__typename":"Education","uuid":"3cb2c3f0-9379-4679-922d-0fb6d2f2c818","school":{"__ref":"School:{\"uuid\":\"37b16338-6070-4c18-841b-9a3f88967ff7\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"cf52ddb3-aa2b-4706-955d-87042ecf0d44\"}":{"__typename":"Education","uuid":"cf52ddb3-aa2b-4706-955d-87042ecf0d44","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Philosophy, Cognitive Science, and Mandarin ","degree":null},"Testimonial:c6c43b42-c52b-4490-a442-5e0e40201c37":{"__typename":"Testimonial","id":"c6c43b42-c52b-4490-a442-5e0e40201c37","text":"Savannah has made the difference with Maya. She understands where Maya is coming from and she is able to communicate effectively with her - while inspiring Maya to launch her own business!","date":"2025-05-30 21:31:46.054+00","rating":5,"endorser":{"__typename":"Endorser","name":"Ricardo Dias ","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"4a9b33a8-9bd7-48d0-8142-7a224f0d1bbe\"}":{"__typename":"MentorPublicProfile","uuid":"4a9b33a8-9bd7-48d0-8142-7a224f0d1bbe","displayName":"Savannah S.","slug":"savannah-shaub","biography":"\u003cp\u003eHi! My name is Savannah Shaub, and I am a third-year undergraduate student at Cornell University in the College of Arts \u0026amp; Sciences. I am a Dean’s List Scholar with academic interests spanning the humanities and social sciences, with particular focus on classical and contemporary metaphysics, developmental psychology, and global politics (including Southeast Asia and U.S.–China relations). I am especially interested in how institutions, identity, and social systems shape human development and opportunity.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI grew up between the Upper West Side in New York City and Los Angeles, and attended Harvard-Westlake School in West LA. I played competitive water polo for seven years, an experience that shaped how I approach hard work, consistency, and leadership. My upper school years also deepened my interest in foreign affairs, languages, and cross-cultural comparisons. Over the last several years, I have studied and explored China through its linguistic, political, economic, and social structures, and I remain strongly interested in the evolving nature of American–Chinese foreign policy and its broader implications.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus, I am an Editorial Editor for Cornell’s fashion magazine, \u003cem\u003eThread\u003c/em\u003e, and the Business Operations Manager for the Cornell Fashion Collective, which produces Cornell’s annual fashion show. I also serve as Vice President of LOGOS, Cornell’s academic journal of philosophy, where I contribute to student-led intellectual programming and editorial work. Outside of campus organizations, I volunteer with Prison Express in the Ithaca area, a nonprofit that promotes rehabilitation through education and creative expression. Through this work, I package curated reading materials for incarcerated writers and provide careful edits and feedback on prisoner poetry and essays to support clarity, craft, and growth.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I care deeply about helping young women build confidence, agency, and practical independence. I am especially interested in supporting students in developing strong communication skills, disciplined work habits, and foundational financial literacy—including goal-setting, understanding value, and making thoughtful long-term decisions. I aim to be a steady, encouraging presence who helps students take their ideas seriously and follow through with structure and ambition.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not in the library, you can find me on a pilates reformer, cooking, reading, or running near the ocean. I love fashion, traveling, hot yoga, Lana Del Rey, and (always) 72% dark chocolate chips. I’m excited to meet your daughter and can’t wait to work together !!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"750853b6-e1be-4539-9c13-aed71db837b9\"}"},{"__ref":"Favorites:{\"uuid\":\"352ba53b-5c48-48ba-8d2c-a6c199d02a92\"}"},{"__ref":"Favorites:{\"uuid\":\"a917c788-bf04-4956-83db-39b9372f9f52\"}"}],"causesSupported":[],"major":"Philosophy, Cognitive Science, and Mandarin ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6f30c075-102e-4e0b-b8e9-e39365c4a38f\"}"}],"active":true,"profilePhotos":["ht
