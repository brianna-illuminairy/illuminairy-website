xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"e32ec705-6386-4090-ab4b-69c82fc34f7f\"}":{"__typename":"DeepDives","uuid":"e32ec705-6386-4090-ab4b-69c82fc34f7f","content":"\u003cp\u003eOut of everything I could be doing, I choose mentorship through tutoring because I know how transformative it can be, both academically and personally. I’m especially drawn to the chance to connect with students one-on-one, meet them where they are, and help them grow in confidence, curiosity, and independence. Being part of that journey is incredibly rewarding\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a8f90e68-a703-44a5-8097-894416076076\"}":{"__typename":"DeepDives","uuid":"a8f90e68-a703-44a5-8097-894416076076","content":"\u003cp\u003eIn my spare time, I enjoy hanging out with my friends and family, running, cooking/baking, and watching sports (especially the Yankees, Knicks, or Duke Basketball!!!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"eadc449a-77bf-4ace-b1bc-b10bd9679685\"}":{"__typename":"DeepDives","uuid":"eadc449a-77bf-4ace-b1bc-b10bd9679685","content":"\u003cp\u003eMy greatest role model is my mom. She’s the most selfless and driven person I know. Watching her balance her work, our family, and giving back to our community taught me what it means to lead with both strength and compassion. She’s always believed in me and her support is the reason I value mentorship so much. I bring the same encouragement and care she gives me to the students I work with\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"6500b055-e723-40c7-958f-44beb1099225\"}":{"__typename":"DeepDives","uuid":"6500b055-e723-40c7-958f-44beb1099225","content":"\u003cp\u003eSomething I’m very passionate about that I created in the past is a peer tutoring organization called Virtual Help \u0026amp; Hugs. When the COVID pandemic broke out, my sister and I started a free virtual tutoring program to support younger students struggling with remote learning. We built a network of over 50 volunteer tutors and matched them with families in need. It was incredibly rewarding to see the impact and how happy the students were. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"3691c1c9-6f89-4dec-b50e-00e4f89ef733\"}":{"__typename":"School","uuid":"3691c1c9-6f89-4dec-b50e-00e4f89ef733","name":"John L Miller North High School","city":"Great Neck","type":"HIGH","state":"New York","country":"United States","zip":"11023"},"Education:{\"uuid\":\"ce5e5ce2-efb6-493e-a83a-36847d3a310a\"}":{"__typename":"Education","uuid":"ce5e5ce2-efb6-493e-a83a-36847d3a310a","school":{"__ref":"School:{\"uuid\":\"3691c1c9-6f89-4dec-b50e-00e4f89ef733\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"2015f8d5-b229-40ef-b3d4-4d0b3393d9d8\"}":{"__typename":"Education","uuid":"2015f8d5-b229-40ef-b3d4-4d0b3393d9d8","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"617f20cd-cf0e-463c-812a-4c2d6ffa9990\"}":{"__typename":"MentorPublicProfile","uuid":"617f20cd-cf0e-463c-812a-4c2d6ffa9990","displayName":"Jules A.","slug":"jules-ahdoot","biography":"\u003cp\u003eHi! I’m Jules, a student at Duke University studying Economics and Computer Science, with a deep love for helping others unlock their potential. I grew up in Great Neck, NY, in a household shaped by my Jewish and Persian heritage and a curiosity for how people, ideas, and systems all connect. Growing up really helped me realize that my favorite moments weren’t just about learning something new, but actually about helping someone else “get it” too.\u003c/p\u003e\u003cp\u003eI’ve mentored and tutored students for years, from launching a free peer tutoring initiative during the COVID pandemic to helping friends grasp complex economic concepts before exams. In high school, I thrived at the intersection of leadership and impact. I co-founded a youth fellowship that brought together teens from diverse backgrounds to explore community-building, led a business club as Vice President with over 250 members, and placed in the top 10 internationally for a marketing campaign. I also participated in Seeds of Peace, where I engaged in deep conversations around identity, leadership, and social justice with students from across the country. Since coming to Duke, I’ve continued growing those passions: I interned at an investment bank, led a winning consulting project for an AI ed-tech startup, and helped build student engagement around Middle East education and outreach. Long term, I’m excited to keep working where business, social impact, and mentorship come together, especially in roles that let me support the next generation of curious, creative thinkers.\u003c/p\u003e\u003cp\u003eMy teaching style is patient, engaging, and supportive. I believe learning works best when students feel seen, heard, and confident. I love working with curious students who want to get ahead, build better study habits, or simply feel less stressed about school. I specialize in subjects like writing, economics, public speaking, math, and test prep, and I’m passionate about mentoring students who want to build confidence in their thinking and communication skills.\u0026nbsp; I make sure to personalize my approach for each student, adapting how I teach based on how they learn best so sessions feel approachable, effective, and enjoyable.\u003c/p\u003e\u003cp\u003eWhen I’m not mentoring or focusing on my school work, I’m probably cheering on the Yankees or spending time with my family and friends. I’ve been told I bring humor, entertainment and warmth to everything I do, and that is exactly the energy I aim to bring to every Curious Cardinals session.\u003c/p\u003e\u003cp\u003eIf you’re looking for a mentor who’s relatable, driven, and genuinely invested in your child’s growth, I’d be thrilled to work together!\u003c/p\u003e","teachingVideoPlaybackId":"DBUPxGTWNOI735OfXxWmOHN4JSJjNmtH4zO9n3r5qL00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e32ec705-6386-4090-ab4b-69c82fc34f7f\"}"},{"__ref":"DeepDives:{\"uuid\":\"a8f90e68-a703-44a5-8097-894416076076\"}"},{"__ref":"DeepDives:{\"uuid\":\"eadc449a-77bf-4ace-b1bc-b10bd9679685\"}"},{"__ref":"DeepDives:{\"uuid\":\"6500b055-e723-40c7-958f-44beb1099225\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e22237fd-164b-4082-a768-a0f9138127b7/-/preview/-/format/jpg/","https://ucarecdn.com/10c7ff0c-2942-4cbf-8913-7f9eecdff300/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ce5e5ce2-efb6-493e-a83a-36847d3a310a\"}"},{"__ref":"Education:{\"uuid\":\"2015f8d5-b229-40ef-b3d4-4d0b3393d9d8\"}"}],"hiredAt":"2025-04-29T16:58:54.794Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","College Essay Writing","Reading","Economics"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jules-ahdoot\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"617f20cd-cf0e-463c-812a-4c2d6ffa9990\"}"}}},"_sentryTraceData":"131b36b031c84f7b85a792365a690124-b16647a286743997-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=131b36b031c84f7b85a792365a690124,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jules-ahdoot"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'}
