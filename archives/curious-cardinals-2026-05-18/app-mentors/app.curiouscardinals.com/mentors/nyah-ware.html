xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cf98d64d-f160-4726-a6f4-1ed5eec0d1c5\"}":{"__typename":"DeepDives","uuid":"cf98d64d-f160-4726-a6f4-1ed5eec0d1c5","content":"\u003cp\u003eIn my spare time I love to explore and go on adventures. One of my favorite adventures was going on a “beach tour”. Me and a friend went to three different beaches in half moon bay listening to music, reading, taking pictures, and painting the beautiful scenery. We even found an outdoor piano to play on. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"37955512-89bf-4ee5-b340-990d0ae01562\"}":{"__typename":"DeepDives","uuid":"37955512-89bf-4ee5-b340-990d0ae01562","content":"\u003cp\u003eMentorship matters to me because I am someone who has grown through the mentorship of others. I remember being in 8th grade, writing a speech for graduation, when someone from my future high school came in to work with me and other students. He was top of his class and headed to the University of Pennsylvania, and in the single hour we spent together, he planted a seed that shaped how I approached high school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"a16740e4-6d93-497e-836a-5971ca70e903\"}":{"__typename":"School","uuid":"a16740e4-6d93-497e-836a-5971ca70e903","name":"Southland High School","city":"Richton Park","type":"HIGH","state":"Illinois","country":"United States","zip":"60471"},"Education:{\"uuid\":\"b70daf88-eba9-4de5-974f-3307451ef767\"}":{"__typename":"Education","uuid":"b70daf88-eba9-4de5-974f-3307451ef767","school":{"__ref":"School:{\"uuid\":\"a16740e4-6d93-497e-836a-5971ca70e903\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"206fa873-658e-416a-887a-ed2796131d1c\"}":{"__typename":"Education","uuid":"206fa873-658e-416a-887a-ed2796131d1c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Bioengineering ","degree":null},"MentorPublicProfile:{\"uuid\":\"5c34f52c-8ba5-4e6d-9811-8359a29c4ba7\"}":{"__typename":"MentorPublicProfile","uuid":"5c34f52c-8ba5-4e6d-9811-8359a29c4ba7","displayName":"Nyah W.","slug":"nyah-ware","biography":"\u003cp\u003eHi! I am a recent Stanford graduate in \u003cstrong\u003eBioengineering\u003c/strong\u003e with a minor in\u003cstrong\u003e Art Practice\u003c/strong\u003e focused on \u003cstrong\u003ephotography\u003c/strong\u003e. I am someone who has done a little bit of everything and I really enjoy helping people learn how to communicate clearly and confidently, whether that is through speaking, storytelling, or visuals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I studied bioengineering and conducted \u003cstrong\u003e3D Bioprinting research.\u003c/strong\u003e (Think 3D printing with stem cells and gels!) Alongside that, I built a creative practice in photography, which lets me slow down, notice details, and tell stories in a visual way. I love being in spaces where science and creativity meet and learning how skills from one area can help in another.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of classes, communication and performance have always been a big part of my life. In college, I played the \u003cstrong\u003eFairy Godmother\u003c/strong\u003e in the musical \u003cem\u003eCinderella\u003c/em\u003e. I also worked as a tutor in oral communication, helping students organize their thoughts and feel more comfortable speaking in front of others. In addition, I created a workshop for students to have a blueprint for Content, Delivery and Slide design in regard to developing researched based arguments.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have been \u003cstrong\u003ecoaching competitive speech for almost eight years\u003c/strong\u003e and have experience private tutoring students at the elementary and middle school levels. Competitive speech and drama have shaped a lot of who I am. I have earned six state awards and am a \u003cstrong\u003eNational Champion in Prepared prompt/ Impromptu speaking.\u003c/strong\u003e While those accomplishments are exciting, what matters most to me is helping students find their voice and feel proud of how they express themselves.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring the pandemic passion projects kept me grounded. I worked on a \u003cstrong\u003epodcast, youtube series, zoom play, short story\u003c/strong\u003e and conducted \u003cstrong\u003eindependent research on how plants can grow without soil. \u003c/strong\u003eThese projects reinforced my belief that curiosity and creativity are powerful tools for learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have a wide range of interests and love working with curious students who are excited to try new things. I am happy to meet you wherever you are, whether you want to build confidence, improve communication skills, start a photography project, or put together a portfolio. I would love the opportunity to guide you through a project where you are able to explore a current passion or even find a new one!\u003c/p\u003e","teachingVideoPlaybackId":"IJai3ZojadQG201D264NSmfPoJxkHcYcR5h9IVoFXGDk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Bioengineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cf98d64d-f160-4726-a6f4-1ed5eec0d1c5\"}"},{"__ref":"DeepDives:{\"uuid\":\"37955512-89bf-4ee5-b340-990d0ae01562\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/aabb77da-a05d-45b6-81eb-6f5fb0e20827/-/preview/-/format/jpg/","https://ucarecdn.com/abd353fe-bb63-4d35-b83d-759de8e676a6/-/preview/-/format/jpg/","https://ucarecdn.com/602578a7-a210-43d4-8b40-7e527e0b826c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b70daf88-eba9-4de5-974f-3307451ef767\"}"},{"__ref":"Education:{\"uuid\":\"206fa873-658e-416a-887a-ed2796131d1c\"}"}],"hiredAt":"2026-01-15T15:11:04.838Z","topics":["Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Medicine / Health","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nyah-ware\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5c34f52c-8ba5-4e6d-9811-8359a29c4ba7\"}"}}},"_sentryTraceData":"5d464dcb184644648037f0451aa846bd-9f64b8193b13cd73-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-p
