xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"32dda8b8-e983-4f8a-9c1d-26405aa929ce\"}":{"__typename":"DeepDives","uuid":"32dda8b8-e983-4f8a-9c1d-26405aa929ce","content":"\u003cp\u003eYou don’t need to be the “smartest” person in the room. Showing up, practicing a little every day, and not quitting will take you further than raw ability.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c549b025-e1dc-4643-a60e-f53bd88b9df5\"}":{"__typename":"DeepDives","uuid":"c549b025-e1dc-4643-a60e-f53bd88b9df5","content":"\u003cp\u003eI want to be someone younger students can look at and think, “If they can do it, maybe I can too.”\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"d9a2ceca-78d3-4c1b-b08a-94d4a2167a8d\"}":{"__typename":"DeepDives","uuid":"d9a2ceca-78d3-4c1b-b08a-94d4a2167a8d","content":"\u003cp\u003eI once dreamed I could suddenly speak every language in the world, but only while riding a bicycle(that's how I used to go to school). The moment I stopped pedaling, I forgot everything.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"c61eccb4-17d4-4a0b-8989-6dc1c53c7957\"}":{"__typename":"DeepDives","uuid":"c61eccb4-17d4-4a0b-8989-6dc1c53c7957","content":"\u003cp\u003eI’m proud of how much I’ve learned over time—not just academically, but about resilience, self-discipline, and believing in myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"d4abd90a-4359-46f3-a0d2-874302fa89f8\"}":{"__typename":"School","uuid":"d4abd90a-4359-46f3-a0d2-874302fa89f8","name":"Dembe Sembel secondary school","city":"Asmara","type":"HIGH","state":"Maekel","country":"Eritrea","zip":"00000"},"Education:{\"uuid\":\"cdb87277-94d8-4d91-8c87-904a030f6aff\"}":{"__typename":"Education","uuid":"cdb87277-94d8-4d91-8c87-904a030f6aff","school":{"__ref":"School:{\"uuid\":\"d4abd90a-4359-46f3-a0d2-874302fa89f8\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"0f2a2144-5a32-408a-9a4c-cf5348ccb70e\"}":{"__typename":"Education","uuid":"0f2a2144-5a32-408a-9a4c-cf5348ccb70e","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2027","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"d2904385-2f54-420c-bbbc-4c26f463943c\"}":{"__typename":"MentorPublicProfile","uuid":"d2904385-2f54-420c-bbbc-4c26f463943c","displayName":"Selam Z.","slug":"selam-zeray","biography":"\u003cp\u003e\u003cstrong\u003eHi! My name is Selam, and I’m excited to be a Curious Cardinals mentor.\u003c/strong\u003e\u003cbr\u003eI am passionate about helping students grow not only academically, but also in confidence, curiosity, and self-belief. I care deeply about creating a supportive learning environment where students feel safe asking questions, making mistakes, and discovering what they are capable of over time.\u003c/p\u003e\u003cp\u003eAcademically, I have a strong background and interest in STEM-related subjects. I enjoy mentoring students in K–5 math, middle school math and science, and advanced topics such as Pre-Algebra, Algebra I \u0026amp; II, Geometry, Precalculus/Trigonometry, Calculus, and Statistics. I also support students in grades 6–8 science and Biology. One of my favorite parts of teaching is helping students see connections between concepts and real-life applications, which makes learning more meaningful and less intimidating.\u003c/p\u003e\u003cp\u003eIn addition to traditional academics, I am passionate about academic coaching and executive function skills such as organization, time management, goal-setting, and study strategies. I understand that success in school is not just about knowing the material, but also about learning how to plan, focus, and stay motivated. I enjoy helping students build these skills so they can become more independent and confident learners.\u003c/p\u003e\u003cp\u003eI also have a strong interest in technology and creative problem-solving. I enjoy mentoring students in computer science, coding and programming, web design, machine learning and AI, and STEM-based projects. I believe early exposure to technology and creative thinking can open doors for students and help them see new possibilities for their futures. Alongside technology, I value creativity and enjoy supporting students in visual arts and graphic design as another way to express ideas and build confidence.\u003c/p\u003e\u003cp\u003eOne experience I am especially proud of is pushing through challenges in my own learning journey and using those experiences to support others. I know what it feels like to struggle, feel unsure, or think you are “not good at” a subject. That understanding helps me approach mentoring with patience, empathy, and encouragement.\u003c/p\u003e\u003cp\u003eAs a mentor, my goal is to meet students where they are and help them move forward at their own pace. I want students and families to know that I am invested in growth, consistency, and long-term confidence. I’m excited to learn alongside my mentees and support them as they develop skills that will serve them both inside and outside the classroom.\u003c/p\u003e","teachingVideoPlaybackId":"RLNQX99BxY00A2D7kjrnSEpxwJ02tYaM7O9MB1D3HL8XE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"32dda8b8-e983-4f8a-9c1d-26405aa929ce\"}"},{"__ref":"DeepDives:{\"uuid\":\"c549b025-e1dc-4643-a60e-f53bd88b9df5\"}"},{"__ref":"DeepDives:{\"uuid\":\"d9a2ceca-78d3-4c1b-b08a-94d4a2167a8d\"}"},{"__ref":"DeepDives:{\"uuid\":\"c61eccb4-17d4-4a0b-8989-6dc1c53c7957\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/feeedfb7-46c6-43f7-af83-3420a4ec479c/-/preview/-/format/jpg/","https://ucarecdn.com/7511443c-949e-4116-8928-43945d209d87/-/preview/-/format/jpg/","https://ucarecdn.com/36498d4c-7fba-49b3-94bc-f3ecbbe46e8d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cdb87277-94d8-4d91-8c87-904a030f6aff\"}"},{"__ref":"Education:{\"uuid\":\"0f2a2144-5a32-408a-9a4c-cf5348ccb70e\"}"}],"hiredAt":"2026-02-05T03:57:19.191Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Biology","
