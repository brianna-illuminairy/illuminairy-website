xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"14821909-bcf0-4c9e-8012-ccb7b1365282\"}":{"__typename":"DeepDives","uuid":"14821909-bcf0-4c9e-8012-ccb7b1365282","content":"\u003cp\u003eA passion project I am currently working on is choreographing original pieces for my contemporary dance repertoire class, and partnering with a fellow student to create dynamic movement for her thesis, a new music album. Both projects challenge me to think creatively and work across disciplines, which I find really rewarding!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"dfa61d63-6ef1-4a31-baa6-41741b05bf55\"}":{"__typename":"DeepDives","uuid":"dfa61d63-6ef1-4a31-baa6-41741b05bf55","content":"\u003cp\u003eI would tell her that you don’t have to blend in to belong. I’d say that the things that make you feel different and maybe uncomfortable now, will one day be your greatest strengths. Don’t quiet yourself to make things easier. Stay curious, stay grounded, and trust that your voice has value.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"69eda633-e0a8-43d6-8e9c-dd523087419c\"}":{"__typename":"DeepDives","uuid":"69eda633-e0a8-43d6-8e9c-dd523087419c","content":"\u003cp\u003eMentorship matters to me because I understand the challenges of navigating academic and personal growth without consistent support. I developed resilience, but also recognized the limits of going it alone. My experiences working with youth, many facing learning differences and systemic barriers, have reinforced the importance of guidance that meets students where they are. It’s such a beautiful thing when people of different ages can learn from each other, and I’m incredibly grateful for the mentors who have guided me along the way, so I’d love to be that support for someone else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"97ed7f7a-e926-44a2-9dfc-dcce1dd28682\"}":{"__typename":"DeepDives","uuid":"97ed7f7a-e926-44a2-9dfc-dcce1dd28682","content":"\u003cp\u003eDuring middle and high school, I spent every summer at Chimney Corners Camp. First as a camper, then as part of their Aides/Reach leadership program, where I ran activities and mentored younger kids. When I wasn’t at camp, I worked at school-run summer programs and a local doctor’s office. Each experience taught me something different about how to lead, listen, and how to show up for people in all kinds of settings.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}":{"__typename":"School","uuid":"2ff73c87-6442-482c-8d92-863dfb263ea0","name":"The Dalton School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"d8e91a9c-4f63-465c-87f1-1a2fbb6406e0\"}":{"__typename":"Education","uuid":"d8e91a9c-4f63-465c-87f1-1a2fbb6406e0","school":{"__ref":"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}"},"startYear":"2010","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"239e7018-97dd-47c5-8d78-3eaacd52217e\"}":{"__typename":"Education","uuid":"239e7018-97dd-47c5-8d78-3eaacd52217e","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"International and Public Affairs/Urban Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"ab45daff-d477-4b68-8f23-fd41139f38b0\"}":{"__typename":"MentorPublicProfile","uuid":"ab45daff-d477-4b68-8f23-fd41139f38b0","displayName":"Moana M.","slug":"moana-m","biography":"\u003cp\u003eHi! I’m Moana, a third-year student at Brown University, where I study Urban Studies and International \u0026amp; Public Affairs. I split my time between Providence and New York City, and I’ve always been interested in how people build and experience community. I come from a Haitian and German background, which has shaped my worldview and given me an appreciation for the richness of different cultures, languages, and perspectives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m in New York, you’ll usually find me in the East Village or Brooklyn—neighborhoods I love for their history, energy, and the mix of people who call them home. My academic work focuses on how cities can be inclusive, accessible, and resilient, especially in the face of climate change. I’m passionate about connecting classroom theory with real-world projects, and I’m always looking for ways to engage more deeply with the communities around me. I believe that good urban design can transform lives and foster equity across generations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of class, I stay pretty active. I dance with Brown’s Contemporary Dance Studio Project and am always working on creative projects, from painting to choreographing new pieces with friends. I also contribute to WBRU, Brown’s student-run radio station, where I help with content creation and event organizing. These creative outlets keep me energized and help me think across disciplines, which I’ve found really helpful when working with students from diverse academic and personal backgrounds.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the most formative experiences I’ve had was working at an occupational therapy clinic in Germany, where I supported children with diverse learning needs. I helped with exercises in focus, coordination, and motor skills, and it taught me a lot about patience, flexibility, and how to communicate effectively across differences. These lessons deeply inform the way I approach tutoring and mentoring, where I prioritize empathy and curiosity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve spent several years tutoring both privately and through peer programs, working with students of all ages on everything from math and science to personal essays and arts-based projects. I love helping students develop their voice, especially when it comes to writing, storytelling, and tackling challenges with confidence. I’m fluent in German and have experience with French, Haitian Creole, and Mandarin. Language learning is a big part of my life and something I find genuinely exciting.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love reading, yoga, figuring out how my sewing machine works (it’s a process), making choreography with friends, and photography. I always enjoy the process of learning and tend to have lots of hobbies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eExcited to meet and start working with you!\u003c/p\u003e","teachingVideoPlaybackId":"AVc6IkAg00VZ027EA2l723tMnWeLPRRA2IKAFW024W502yE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"International and Public Affairs/Urban Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"14821909-bcf0-4c9e-8012-ccb7b1365282\"}"},{"__ref":"DeepDives:{\"uuid\":\"dfa61d63-6ef1-4a31-baa6-41741b05bf55\"}"},{"__ref":"DeepDives:{\"uuid\":\"69eda633-e0a8-43d6-8e9c-dd523087419c\"}"},{"__ref":"DeepDives:{\"uuid\":\"97ed7f7a-e926-44a2-9dfc-dcce1dd28682\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0f93d6bc-0763-4ada-a92c-34d9d707d6bf/-/preview/-/format/jpg/","https://ucarecdn.com/09f1f570-3c84-4a18-b84a-ccafeb35d3e0/-/preview/-/format/jpg/","https://ucarecdn.com/0f1c2722-027d-4fba-8cd0-93a21aa7fda4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d8e91a9c-4f63-465c-87f1-1a2fbb6406e0\"}"},{"__ref":"Education:{\"uuid\":\"239e7018-97dd-47c5-8d78-3eaacd52217e\"}"}],"hiredAt":"2025-06-28T07:02:43.799Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Writing","College Essay Writing","Executive Function","Academic Coaching","Reading","History","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Film / Theater","History Project","Journalism","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"moana-m\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ab45daff-d477-4b68-8f23-fd41139f38b0\"}"}}},"_sentryTraceData":"33ff62244c7b48e59e5e418eaf22235c-a7356467b1b91439-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb750
