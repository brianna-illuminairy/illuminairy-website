xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4101457a-3d35-47ac-8d37-aa3682d10f21\"}":{"__typename":"Favorites","uuid":"4101457a-3d35-47ac-8d37-aa3682d10f21","photoUrl":"https://ucarecdn.com/bdefef59-a5b2-4b92-a0f5-9a940e772390/","title":"Mamma Mia","type":"MOVIE"},"Favorites:{\"uuid\":\"6265ac4b-6aa7-496a-90c5-c92de139030c\"}":{"__typename":"Favorites","uuid":"6265ac4b-6aa7-496a-90c5-c92de139030c","photoUrl":"https://ucarecdn.com/ce7ec04d-8e29-4ae9-924e-ee5c34a8584a/","title":"Didier Drogba","type":"ATHLETE"},"Favorites:{\"uuid\":\"51eb5ff2-3fe2-469f-9ddf-4febd9b5f763\"}":{"__typename":"Favorites","uuid":"51eb5ff2-3fe2-469f-9ddf-4febd9b5f763","photoUrl":"https://ucarecdn.com/234ca2f4-5f32-43f4-a117-ab2214aaa2b7/","title":"Rumours","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"373e3026-f33f-43af-a8a8-f0b9f3ce3191\"}":{"__typename":"DeepDives","uuid":"373e3026-f33f-43af-a8a8-f0b9f3ce3191","content":"\u003cp\u003eTake a breath and appreciate the amazing people around you. Things may feel very stressful or overwhelming, but enjoy the days and give yourself grace. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"16166e9c-5e5c-4e8b-af84-084be67243cf\"}":{"__typename":"DeepDives","uuid":"16166e9c-5e5c-4e8b-af84-084be67243cf","content":"\u003cp\u003eI've grown up constantly surrounded by mentors who inspired me and helped me not only discover what I am passionate about, but also pursue those passions. I love connecting with people and knowing that I have support when I need someone to lean on. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3ebb8a19-7072-4764-894a-ea059b510f4e\"}":{"__typename":"DeepDives","uuid":"3ebb8a19-7072-4764-894a-ea059b510f4e","content":"\u003cp\u003eI have always loved school, but when I look back at my favorite classes and teachers from high school, it's clear that English had the biggest impact on me. There is nothing I enjoy more than deep diving into a great piece of literature and being able to discuss it with my peers and teachers.  Books connect us to the world around us and the people in it, and I truly believe they make me a more empathetic, caring person.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"83a2d2a8-c5e5-4aae-b586-57252923de2f\"}":{"__typename":"DeepDives","uuid":"83a2d2a8-c5e5-4aae-b586-57252923de2f","content":"\u003cp\u003eYou can always find me absorbed in something music-related. I grew up singing, and while many hobbies come and go, music is one that always remains. Few things make me happier than learning a new song on the guitar and singing along. Music speaks to me in incredibly deep ways, and I am always eager to learn a new technique or instrument - I just started piano lessons too! Plus, it's been proven time and time again that music makes you smarter ;)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"18c0ecf7-f1a1-4c46-9c48-9a039e40496b\"}":{"__typename":"Education","uuid":"18c0ecf7-f1a1-4c46-9c48-9a039e40496b","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"English","degree":"B.A."},"School:{\"uuid\":\"5aeb9d77-2d33-4919-ad26-86841cc64477\"}":{"__typename":"School","uuid":"5aeb9d77-2d33-4919-ad26-86841cc64477","name":"Trinity School ","city":"New York","type":"HIGH","state":"NY","country":"United States","zip":"10024"},"Education:{\"uuid\":\"9bc7ec56-0117-41a4-8b42-55b87d409da7\"}":{"__typename":"Education","uuid":"9bc7ec56-0117-41a4-8b42-55b87d409da7","school":{"__ref":"School:{\"uuid\":\"5aeb9d77-2d33-4919-ad26-86841cc64477\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"Testimonial:afd6dddc-b276-41f1-b34f-230e659407ee":{"__typename":"Testimonial","id":"afd6dddc-b276-41f1-b34f-230e659407ee","text":"Anna is the most amazing and committed mentor.  She has developed a deep and trusting relationship with my daughter and has truly helped build up her confidence as well as hone her writing skills.  They have worked together for three years and I know my daughter hopes to continue.","date":"2025-05-28 01:39:53.695+00","rating":5,"endorser":{"__typename":"Endorser","name":"Talia Day","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"06ade1de-adeb-4d4b-8046-2b7d41d4494a\"}":{"__typename":"MentorPublicProfile","uuid":"06ade1de-adeb-4d4b-8046-2b7d41d4494a","displayName":"Anna S.","slug":"anna-sorensen","biography":"Anna is currently studying at Duke University, focusing on English, Journalism, and History. Anna loves literature and enjoys exploring questions of morality, empathy, and narrative in her classes and writing. Anna is passionate about the intersections of politics and journalism, and she is inspired to explore the basis and influence of news across the world. Anna enjoys studying history because it helps her draw connections across cultures and time, enabling her to understand who we all are and how we live in the world together. Anna grew up in NYC and most recently graduated Cum Laude from Trinity School. Anna has experience in a Writing Lab and Modern Language tutoring program, where she developed close relationships with her tutees and felt herself grow as a student through her mentorship. She is excited to continue her journey at Curious Cardinals, make connections with new students, and hopefully inspire their passions for learning. \nAnna lived in London for three years, where she developed a passion for global travel (she’s been to over 25 countries!  Some of her favorite trips include Vietnam, where she was able to directly immerse herself in the history by visiting the Cu Chi Tunnels, and Norway, where she fell in love with the nature, Scandinavian lifestyle, and cuisine. Outside of school, Anna has many different hobbies. Anna loves reading, and her favorite books include The Glass Castle, The Great Gatsby, and Beloved. She has played sports her whole life, and currently enjoys swimming and playing soccer at Duke. Anna is incredibly passionate about music; she has sung in a choir since age 7, and sings and plays guitar almost every day for her family and friends. A fun fact about Anna is that she loves swimming in cold water (often the ocean) during the Winter!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI performed with the NY Choral Society when I was just 12 in an opera by Mendelssohn called Elijah! I also performed a world premier piece written by my mentor and friend Dr. Barry Rose, and sang in the Notre Dame with my choir. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"4101457a-3d35-47ac-8d37-aa3682d10f21\"}"},{"__ref":"Favorites:{\"uuid\":\"6265ac4b-6aa7-496a-90c5-c92de139030c\"}"},{"__ref":"Favorites:{\"uuid\":\"51eb5ff2-3fe2-469f-9ddf-4febd9b5f763\"}"}],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"373e3026-f33f-43af-a8a8-f0b9f3ce3191\"}"},{"__ref":"DeepDives:{\"uuid\":\"16166e9c-5e5c-4e8b-af84-084be67243cf\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ebb8a19-7072-4764-894a-ea059b510f4e\"}"},{"__ref":"DeepDives:{\"uuid\":\"83a2d2a8-c5e5-4aae-b586-57252923de2f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/87686713-79d9-46d7-923c-f303b44f2133/-/crop/692x693/0,64/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"18c0ecf7-f1a1-4c46-9c48-9a039e40496b\"}"},{"__ref":"Education:{\"uuid\":\"9bc7ec56-0117-41a4-8b42-55b87d409da7\"}"}],"hiredAt":"2023-01-13T01:42:29.000Z","topics":["Writing","French","College Essay Writing","Reading","History","Academic Coaching"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:afd6dddc-b276-41f1-b34f-230e659407ee"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anna-sorensen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"06ade1de-adeb-4d4b-8046-2b7d41d4494a\"}"}}},"_sentryTraceData":"c159ca1eec0f416ebe5e3652315e12f6-a3660d40e6bebd3d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38
