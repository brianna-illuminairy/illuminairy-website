xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a839656d-fc0e-45b8-bd4f-26ba5cf6825f\"}":{"__typename":"Favorites","uuid":"a839656d-fc0e-45b8-bd4f-26ba5cf6825f","photoUrl":"https://ucarecdn.com/34fa3a6a-5ffd-4ac0-8b6d-4867d9d46e1a/","title":"Lionel Messi","type":"ATHLETE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"52bd1a15-9baf-43fe-9de2-4cbb4e4786b2\"}":{"__typename":"DeepDives","uuid":"52bd1a15-9baf-43fe-9de2-4cbb4e4786b2","content":"\u003cp\u003eIn my spare time, I enjoy spending time with my family and staying active. One of my favorite activities is playing ice hockey with my brothers, which gives us a chance to connect, compete, and have fun together. Family has always been an important part of my life, and I value the time we share both on and off the ice.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"157c785d-fec2-401e-8b54-48a94e8d7019\"}":{"__typename":"DeepDives","uuid":"157c785d-fec2-401e-8b54-48a94e8d7019","content":"\u003cp\u003eI chose to major in Computer Science because I have always been fascinated by how technology can solve real-world problems and transform the way we live. In high school, I worked on a blockchain project that sparked my curiosity about how complex systems can be designed and built. Later, seeing the incredible ways artificial intelligence is changing industries and everyday life inspired me to dive deeper into this field. I wanted to pursue Computer Science to explore these technologies further and to contribute to innovative solutions that have a meaningful impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"18a80737-27f3-44f1-a729-8a9918b92426\"}":{"__typename":"DeepDives","uuid":"18a80737-27f3-44f1-a729-8a9918b92426","content":"\u003cp\u003eOne passion project I worked on was creating an electronic voting system using blockchain technology. I was fascinated by the idea of combining security, transparency, and decentralization to make voting more reliable and tamper-resistant. This project allowed me to apply concepts I had learned in programming and computer science while tackling a real-world problem. It was exciting to see how innovative technology can be used to improve systems that impact society, and the experience strengthened my interest in exploring the possibilities of emerging technologies like blockchain and artificial intelligence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"a2bc0bcc-3c47-48ff-8706-098dcc1f7cae\"}":{"__typename":"DeepDives","uuid":"a2bc0bcc-3c47-48ff-8706-098dcc1f7cae","content":"\u003cp\u003eAs a high school student, I was driven by a strong curiosity and a desire to always learn. I wasn’t afraid to make mistakes, because I saw them as opportunities to grow and improve. Whether exploring new technologies, tackling challenging projects, or diving into subjects outside my comfort zone, I approached learning with enthusiasm and a willingness to push myself further.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65\"}":{"__typename":"School","uuid":"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65","name":"Tenafly High School","city":"Tenafly","type":"HIGH","state":"New Jersey","country":"United States","zip":"07670"},"Education:{\"uuid\":\"a0849d23-d8e2-414d-86ca-82b7a8cb10d0\"}":{"__typename":"Education","uuid":"a0849d23-d8e2-414d-86ca-82b7a8cb10d0","school":{"__ref":"School:{\"uuid\":\"6d20e2ea-ef56-4b45-a9fc-1e3551cd1f65\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"864f64f7-d93e-4813-bd3f-e0cb958cbb1d\"}":{"__typename":"Education","uuid":"864f64f7-d93e-4813-bd3f-e0cb958cbb1d","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"768b0bd3-eeff-4996-829e-4f528a37c2ac\"}":{"__typename":"MentorPublicProfile","uuid":"768b0bd3-eeff-4996-829e-4f528a37c2ac","displayName":"Dylan W.","slug":"dylan-weiss","biography":"\u003cp\u003eHello! My name is Dylan, and I am currently a Computer Science major at the University of Pennsylvania. Alongside my studies, I am conducting artificial intelligence research at JPMorgan, where I explore cutting-edge technology and its applications in the real world. My academic path has given me strong experience in math, computer science, and problem-solving, and I enjoy sharing that knowledge with students in a way that makes learning both approachable and rewarding.\u003c/p\u003e\u003cp\u003eAs a tutor, my goal is to do more than simply explain concepts. I aim to help students build the confidence and skills to approach challenges independently. I know how overwhelming difficult subjects can seem, but I believe that with patience, clarity, and encouragement, any student can succeed. Since every student learns differently, I adjust my teaching style to fit their needs, whether the focus is preparing for an exam, developing study strategies, or gaining confidence in class.\u003c/p\u003e\u003cp\u003eOutside of academics, I am passionate about ice hockey, which has taught me the importance of teamwork, perseverance, and discipline. These qualities shape how I approach tutoring as well. I also have a strong interest in geography, and a few years ago I had the honor of representing Team USA at an international geography championship. That experience deepened my curiosity about the world and showed me how fulfilling it can be to engage deeply with a subject.\u003c/p\u003e\u003cp\u003eWhat excites me most about tutoring is the chance to mentor students and see them grow. I enjoy celebrating progress at every stage, whether it is mastering a tough concept, improving grades, or simply feeling more confident about learning. For me, the greatest reward comes from watching a student move from uncertainty to the realization that they are capable of success.\u003c/p\u003e\u003cp\u003eLooking ahead, I want my students to see learning not just as something they have to do, but as something they can truly enjoy and benefit from. The ability to think critically, solve problems creatively, and remain resilient when faced with challenges are skills that extend far beyond the classroom. By fostering these qualities, I hope to help students feel prepared not only for their next test or assignment, but also for the larger goals they will pursue in the future.\u003c/p\u003e\u003cp\u003eI also look forward to working with students of all backgrounds and learning styles. Every student brings their own unique strengths and challenges, and part of what I enjoy most is finding ways to connect with them as individuals. Whether a student is striving to excel at the highest level or simply trying to gain confidence in a subject they find difficult, I am committed to meeting them where they are and helping them make steady progress toward their goals.\u003c/p\u003e\u003cp\u003eI look forward to supporting students in their academic journeys and helping them discover their own potential.\u003c/p\u003e","teachingVideoPlaybackId":"2GkGpn5kkGbcrUT1jdfabZFwTF01u4MO6HbA47duvfUU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eRepresenting Team USA in International Geography Bee!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a839656d-fc0e-45b8-bd4f-26ba5cf6825f\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"52bd1a15-9baf-43fe-9de2-4cbb4e4786b2\"}"},{"__ref":"DeepDives:{\"uuid\":\"157c785d-fec2-401e-8b54-48a94e8d7019\"}"},{"__ref":"DeepDives:{\"uuid\":\"18a80737-27f3-44f1-a729-8a9918b92426\"}"},{"__ref":"DeepDives:{\"uuid\":\"a2bc0bcc-3c47-48ff-8706-098dcc1f7cae\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ce04706a-9675-4a82-8c15-b94125d11a8a/-/preview/-/format/jpg/","https://ucarecdn.com/6ea7ad00-fb4c-4066-bcb6-4a3bdcfa8c2c/-/preview/-/format/jpg/","https://ucarecdn.com/a09b1d3a-923b-47ec-b05d-8c5c63476299/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"a0849d23-d8e2-414d-86ca-82b7a8cb10d0\"}"},{"__ref":"Education:{\"uuid\":\"864f64f7-d93e-4813-bd3f-e0cb958cbb1d\"}"}],"hiredAt":"2025-09-06T15:31:49.531Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Statistics","Geometry","6-8 Grade Science","Writing","Acade
