xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6c0cee5f-846b-46e0-8315-b31e1d36602c\"}":{"__typename":"Favorites","uuid":"6c0cee5f-846b-46e0-8315-b31e1d36602c","photoUrl":"https://ucarecdn.com/90d2401c-c14b-454d-b986-7b5d7d6c8d56/","title":"Folie à Deux","type":"ALBUM"},"Favorites:{\"uuid\":\"e9cbbbd4-8391-4282-aaa2-64e6d0958c9f\"}":{"__typename":"Favorites","uuid":"e9cbbbd4-8391-4282-aaa2-64e6d0958c9f","photoUrl":"https://ucarecdn.com/1d21b0f2-1ab8-4ce2-b8bd-8e4f2cbba35c/","title":"Surf's Up","type":"MOVIE"},"Favorites:{\"uuid\":\"d47dbd30-14a4-466e-86ce-f19f1f406b70\"}":{"__typename":"Favorites","uuid":"d47dbd30-14a4-466e-86ce-f19f1f406b70","photoUrl":"https://ucarecdn.com/2e18d331-5f74-4f1d-a807-9f5a9c861361/","title":"New York City, NY","type":"CITY"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"7ac9ae6f-0b42-4db1-8b54-1c47ab39ba82\"}":{"__typename":"DeepDives","uuid":"7ac9ae6f-0b42-4db1-8b54-1c47ab39ba82","content":"\u003cp\u003eI was pretty introverted in high school. I loved reading, making art, and spending time with friends, but I usually preferred quieter, creative activities on my own.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was also very studious. Learning didn’t always click for me right away, so I spent a lot of extra time after school reviewing material and making sure I truly understood it. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMath, especially calculus, was my favorite subject, and I was so motivated by it that I took an extra algebra class over the summer just so I could take a college level 3D calculus course during my senior year!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI attended a technical magnet high school where the coursework was very challenging, but building resilience through that experience opened the door for me to attend Carnegie Mellon University 🌟\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"45d0bee6-6c78-4239-8a14-16099ae45001\"}":{"__typename":"DeepDives","uuid":"45d0bee6-6c78-4239-8a14-16099ae45001","content":null,"videoPlaybackId":"RUtzooBdq2TxQnNt00IHCm8hYk6HJsps8k5qGhYhRtFA","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e622584b-1adb-4705-8af2-e41dc58ff133\"}":{"__typename":"DeepDives","uuid":"e622584b-1adb-4705-8af2-e41dc58ff133","content":"\u003cp\u003eMentorship matters deeply to me because I see so much of myself in the students I work with. I see someone young, full of passion, and ready to take on the world. However, I also see those same students navigating a modern landscape that can feel overwhelming at times.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith so many paths, resources, and voices pulling you in different directions, it’s easy to feel lost without guidance. Mentorship provides that steady support. It’s about helping someone focus their energy, make confident choices, and feel cared for by someone who’s been there before.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor me, mentoring is a way to make sure that younger versions of myself and students like them are supported, encouraged, and never navigate that journey alone 🌱☀️\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"7423aeb9-7372-4a4e-8e5b-69b76e6bdf54\"}":{"__typename":"DeepDives","uuid":"7423aeb9-7372-4a4e-8e5b-69b76e6bdf54","content":null,"videoPlaybackId":"q1xbFJIH00yTd7gWiLJ31BaJ58p249vaBbOkLCXarnFc","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"68c2a125-410c-474f-ba33-90ecfffd74cf\"}":{"__typename":"School","uuid":"68c2a125-410c-474f-ba33-90ecfffd74cf","name":"Bergen Tech","city":"Teterboro","type":"HIGH","state":"New Jersey","country":"United States","zip":"07652"},"Education:{\"uuid\":\"14af2be2-b25f-4adc-92ec-b89b8cf90acd\"}":{"__typename":"Education","uuid":"14af2be2-b25f-4adc-92ec-b89b8cf90acd","school":{"__ref":"School:{\"uuid\":\"68c2a125-410c-474f-ba33-90ecfffd74cf\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"de98e727-1873-4fd2-8767-5194ff19547b\"}":{"__typename":"Education","uuid":"de98e727-1873-4fd2-8767-5194ff19547b","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Human Computer Interaction","degree":null},"MentorPublicProfile:{\"uuid\":\"00d4b5ac-76bd-4002-b467-6d17d609de92\"}":{"__typename":"MentorPublicProfile","uuid":"00d4b5ac-76bd-4002-b467-6d17d609de92","displayName":"Janelle T.","slug":"janelle-tecson","biography":"\u003cp\u003eHi! I’m Janelle 👋. I’m a \u003cstrong\u003eUX Designer at Capital One\u003c/strong\u003e and a recent graduate of \u003cstrong\u003eCarnegie Mellon University\u003c/strong\u003e, where I studied \u003cstrong\u003eHuman-Computer Interaction and Game Design\u003c/strong\u003e in the School of Computer Science. I help students turn their creativity and curiosity into \u003cstrong\u003ethoughtful, interactive products\u003c/strong\u003e; from websites and games to portfolios they’re proud to share.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up, I was always creating, from drawing on any surface I could find to tinkering with technology whenever I got the chance. Discovering UX design helped me merge my love for \u003cstrong\u003eart and programming\u003c/strong\u003e into one field, and now I love helping students do the same with their own interests 😊!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eA bit about what I’ve done so far 🏆\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHere are a few highlights from my academic and professional journey:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAt \u003cstrong\u003eCapital One\u003c/strong\u003e, I designed an \u003cstrong\u003eend-to-end product overview experience\u003c/strong\u003e and am currently \u003cstrong\u003eleading the design of a brand-new experience\u003c/strong\u003e for my product, with a targeted launch in the coming months.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFor my \u003cstrong\u003esenior capstone at CMU\u003c/strong\u003e, my team designed and validated the technical feasibility of a \u003cstrong\u003egamified university onboarding app\u003c/strong\u003e, which earned the \u003cstrong\u003eBest Capstone Project Award\u003c/strong\u003e.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOutside of tech, I’m the \u003cstrong\u003edrummer for an indie rock band\u003c/strong\u003e, where I led our \u003cstrong\u003ebranding, merch design, and marketing strategy\u003c/strong\u003e. This work quadrupled our following in the greater Pittsburgh area and increased show bookings and revenue.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences taught me how to take ideas from “what if?” to “this actually works,” and how to communicate those ideas clearly to others 🌟\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eWhat I specialize in 🎯\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI mentor students who want to explore or build projects in:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eUI / UX Design \u0026amp; Research\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWebsite design and creation\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEducational game design\u003c/strong\u003e (digital, physical, or hybrid!)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also support broader skills that are essential for student success, including:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePortfolio reviews and storytelling\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNetworking and pitching your work\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFoundational programming and math support\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI work especially well with middle school and high school students who are exploring creative technology for the first time or preparing for internships, college applications, or passion projects.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eWhy I’m qualified to mentor you 🎓\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Carnegie Mellon, I served as a \u003cstrong\u003eteaching assistant for multiple HCI and design courses\u003c/strong\u003e, where I mentored both undergraduate and \u003cstrong\u003eMaster’s-level students\u003c/strong\u003e. I worked closely with professors, gave structured critiques, and helped students refine complex design concepts into \u003cstrong\u003eclear, user-centered solutions\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also spent multiple summers teaching with \u003cstrong\u003eGirls Who Code\u003c/strong\u003e, where I instructed high school girls and non-binary folk in web design, game design, AI / Machine Learning, and data science. I taught lessons, held office hours, and provided detailed, actionable feedback where I always focused on building confidence alongside technical skill.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhat a session with me looks like 📝\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me may involve:\u0026nbsp;\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eExploring interests and identifying meaningful problems\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConducting research and brainstorming solutions\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a clear, step-by-step plan with milestones (and mini celebrations 🎉)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGiving thoughtful feedback and critiques\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing how to \u003cstrong\u003epitch and present\u003c/strong\u003e your work with confidence\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eMy goal is for students to leave each session with clarity, momentum, and pride in what they’re building.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eFun facts about me 😁\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI was a\u003cstrong\u003e co-designer\u003c/strong\u003e for a \u003cstrong\u003eclothing company\u003c/strong\u003e that focused on the Asian American identity.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI love \u003cstrong\u003ecrocheting, hiking, traveling, and cosplaying.\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI’ve built a \u003cstrong\u003ewearable Chainsaw Man helmet\u003c/strong\u003e and an \u003cstrong\u003e8-foot Soul Eater scythe prop\u003c/strong\u003e for my cosplays!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re a student who loves creating, experimenting, and learning by doing, I’d love to work with you and help bring your ideas to life!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"96K7Ytlk8oeiYYraOnSArKbQ1C01yqXwPiDcIqg00uYx00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6c0cee5f-846b-46e0-8315-b31e1d36602c\"}"},{"__ref":"Favorites:{\"uuid\":\"e9cbbbd4-8391-4282-aaa2-64e6d0958c9f\"}"},{"__ref":"Favorites:{\"uuid\":\"d47dbd30-14a4-466e-86ce-f19f1f406b70\"}"}],"causesSupported":[],"major":"Human Computer Interaction","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7ac9ae6f-0b42-4db1-8b54-1c47ab39ba82\"}"},{"__ref":"DeepD
