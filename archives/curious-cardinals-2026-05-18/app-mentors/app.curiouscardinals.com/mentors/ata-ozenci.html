xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4f008554-2d1d-4b7a-bd31-1a990a2e64a3\"}":{"__typename":"Favorites","uuid":"4f008554-2d1d-4b7a-bd31-1a990a2e64a3","photoUrl":"https://ucarecdn.com/3d61f77d-8610-4853-88df-a54c95217cf8/","title":"Eric Clapton","type":"ARTIST"},"Favorites:{\"uuid\":\"fa91cd91-872c-4a03-850d-bc310362c004\"}":{"__typename":"Favorites","uuid":"fa91cd91-872c-4a03-850d-bc310362c004","photoUrl":"https://ucarecdn.com/e68fc37f-11e9-41b8-9bed-9df7d14ad987/","title":"Izmir","type":"CITY"},"Favorites:{\"uuid\":\"d7c45982-faaa-4ad6-833f-8937b89c8cfe\"}":{"__typename":"Favorites","uuid":"d7c45982-faaa-4ad6-833f-8937b89c8cfe","photoUrl":"https://ucarecdn.com/e2c3439a-4207-4419-9521-4c819e997139/","title":"Inglorius Basterds","type":"MOVIE"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"fc591324-59b1-4adc-a7d7-491115795e91\"}":{"__typename":"DeepDives","uuid":"fc591324-59b1-4adc-a7d7-491115795e91","content":"\u003cp\u003eI am incredibly proud that through Curious Cardinals I get to use my skills to actually help students. It means a lot that the team saw potential in me and trusted me to mentor others. It is a great feeling to know that what I have learned through robotics, rocketry, and engineering can genuinely make a difference for someone else. And the most rewarding part is seeing students grow more confident and capable with every project.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"b74267ad-23c3-4321-a480-5be1b0112391\"}":{"__typename":"DeepDives","uuid":"b74267ad-23c3-4321-a480-5be1b0112391","content":"\u003cp\u003eIn high school I was energetic, opinionated, and very quick to jump into an answer. I worked well in teams, although my confidence sometimes came across as arrogance, especially when I was absolutely convinced I was right. I also had a habit of clashing with authority because I spoke my mind a little too freely. But despite that, I built really strong relationships with my teachers and friends. They understood how I worked, and I grew a lot through those interactions. Looking back, I am grateful for how much patience they had with me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"0c191b4b-9795-4dda-bb8a-0f71385bac82\"}":{"__typename":"DeepDives","uuid":"0c191b4b-9795-4dda-bb8a-0f71385bac82","content":"\u003cp\u003eMy biggest source of motivation has always been my mom. She was working on her professorship in embryology while raising me as a baby, and I grew up watching her balance research, lectures, and a very inquisitive toddler who did not exactly respect academic deadlines. At some point I realized that if she could manage both a demanding scientific career and a small version of me running around, then I should be able to hold myself to a similar standard. It set the tone for how I approach work. I feel a responsibility to put in real effort, to stay curious, and to actually follow through on the things I care about. It keeps me moving, even on days when engineering math is winning the battle.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1040d615-7b7d-47c9-8e59-d24b4c898c0d\"}":{"__typename":"DeepDives","uuid":"1040d615-7b7d-47c9-8e59-d24b4c898c0d","content":"\u003cp\u003eI spend most of my free time playing guitar, recording music, or watching concerts. Music is a completely different pace from engineering, and for me it is the most underrated way to unwind. It is creative, it is expressive, and it forces me to slow down. Even on busy weeks, I try to make time for it. It feels like a reset button.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e1dfb10a-5182-4554-91f2-045473902370\"}":{"__typename":"School","uuid":"e1dfb10a-5182-4554-91f2-045473902370","name":"Özel İzmir Amerikan Koleji","city":"Izmir ","type":"HIGH","state":"Izmir","country":"Türkiye","zip":"35290"},"Education:{\"uuid\":\"a3012834-14b9-4411-84dd-b42ba689c717\"}":{"__typename":"Education","uuid":"a3012834-14b9-4411-84dd-b42ba689c717","school":{"__ref":"School:{\"uuid\":\"e1dfb10a-5182-4554-91f2-045473902370\"}"},"startYear":"2019","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"68eead64-19d1-4cbd-be9e-b0faa1401403\"}":{"__typename":"School","uuid":"68eead64-19d1-4cbd-be9e-b0faa1401403","name":"Twente Üniversitesi","city":"Enschede","type":"COLLEGE","state":"Overijssel","country":"Hollanda","zip":"7522 NB"},"Education:{\"uuid\":\"c55d0447-b872-408e-87d8-f9170b3e000e\"}":{"__typename":"Education","uuid":"c55d0447-b872-408e-87d8-f9170b3e000e","school":{"__ref":"School:{\"uuid\":\"68eead64-19d1-4cbd-be9e-b0faa1401403\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"e375b4cc-0dce-49f4-8a68-0e4007de2c06\"}":{"__typename":"MentorPublicProfile","uuid":"e375b4cc-0dce-49f4-8a68-0e4007de2c06","displayName":"Ata O.","slug":"ata-ozenci","biography":"\u003cp\u003eHi, I am Ata. I am a second year mechanical engineering student in the Netherlands, and \u003cstrong\u003emost of what I enjoy revolves around robotics, rocketry, and building things that work, not “just because,” but for a functional purpose.\u003c/strong\u003e I have always preferred practical engineering over theory, and that remains the case even today. I like math and physics when they help explain something real, whether that is a mechanism, a load path, or a design that finally behaves the way you intended. \u003cstrong\u003eAt the very least, I like systems that explode in the correct direction, which is something engineers learn to appreciate before running out of fingers to count with.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eMy interest in engineering really took shape during five years of competitive robotics. \u003cstrong\u003eI served as the mechanics team captain,\u003c/strong\u003e which meant designing parts, machining components, wiring systems, and making sure the robot did not decide to fall apart moments before a match, and learning to fix it when it inadvertently decided to fall apart anyway, without panicking. \u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAlongside robotics, I spent five years in Model United Nations.\u003c/strong\u003e I attended more than sixteen conferences and helped organize events at my school. MUN is probably where I developed my habit of arguing with confidence. Friends call it arrogance. I prefer to think of it as very committed diplomacy.\u003c/p\u003e\u003cp\u003eTeaching has always been an important part of what I do. \u003cstrong\u003eI co-founded a robotics education program where we taught STEM to younger students.\u003c/strong\u003e I realized that I genuinely enjoy explaining concepts in a hands-on, intuitive way. I like helping people understand ideas by building something or observing how a system behaves rather than memorizing definitions.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eResearch has also played a major role in my path.\u003c/strong\u003e I have worked on MATLAB based modeling at Boğaziçi University, created an augmented reality orienteering application during a summer at Koç University, and spent a summer at Harvard working on mechanical modeling of cell structures. Each project helped me see how theory and experimentation come together in real engineering.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eRight now, I work on mechanical design for landing systems on a university rocketry team called RISE. \u003c/strong\u003eThis includes shock absorbing legs and emergency recovery mechanisms. \u003cstrong\u003eI also support materials research at the Thermoplastic Composites Research Center.\u003c/strong\u003e Much of the work involves advanced systems, precision testing, and the occasional moment when someone quietly mentions that certain details are better kept off the record. When people start saying not for general circulation, I take that as a sign that things are getting interesting.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAs a mentor, I enjoy helping students turn ideas into working results. My approach is practical and hands on. \u003c/strong\u003eIf a student wants robotics, rocketry, or simply a clearer and more intuitive understanding of engineering, I enjoy guiding them through the process and keeping it fun along the way.\u003c/p\u003e","teachingVideoPlaybackId":"V37bUkkJLfwRJuExXw5IS6fbbRvL5Bc102T3AZk52LJI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4f008554-2d1d-4b7a-bd31-1a990a2e64a3\"}"},{"__ref":"Favorites:{\"uuid\":\"fa91cd91-872c-4a03-850d-bc310362c004\"}"},{"__ref":"Favorites:{\"uuid\":\"d7c45982-faaa-4ad6-833f-8937b89c8cfe\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fc591324-59b1-4adc-a7d7-491115795e91\"}"},{"__ref":"DeepDives:{\"uuid\":\"b74267ad-23c3-4321-a480-5be1b0112391\"}"},{"__ref":"DeepDives:{\"uuid\":\"0c191b4b-9795-4dda-bb8a-0f71385bac82\"}"},{"__ref":"DeepDives:{\"uuid\":\"1040d615-7b7d-47c9-8e59-d24b4c898c0d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2d99bf39-41c9-42ec-95cc-4b7335d0e5f3/-/preview/-/format/jpg/","https://ucarecdn.com/7c7da2b4-6d40-4e8c-992b-a46426b337a1/-/preview/-/format/jpg/","https://ucarecdn.com/1a2f27f0-98e0-4445-90cd-f11de16c58bd/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a3012834-14b9-4411-84dd-b42ba689c717\"}"},{"__ref":"Education:{\"uuid\":\"c55d0447-b872-408e-87d8-f9170b3e000e\"}"}],"hiredAt":"2025-12-04T16:06:15.848Z","topics":["Public Speaking","Debate","K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Physics","Academic Coaching","Executive Function","Music","Robotics / Electronics / CAD","STEM Project","Aviation / Aerospace"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ata-ozenci\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e375b4cc-0dce-49f4-8a68-0e4007de2c06\"}"}}},"_sentryTraceData":"8da735c27f9044ea8503eb6d5ec46d9f-bd0a5e45f63c2396-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8da735c27f9044ea8503eb6d5ec46d9f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ata-ozenci"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"script
