xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f893fc7c-5945-4035-ac7f-e17e92daaf26\"}":{"__typename":"Favorites","uuid":"f893fc7c-5945-4035-ac7f-e17e92daaf26","photoUrl":"https://ucarecdn.com/c142b1f0-7ca1-4253-8dae-fc07f86da4d4/","title":"Sparkle - RADWIMPS","type":"SONG"},"Favorites:{\"uuid\":\"def9691d-e5c7-469e-88af-03deded3a947\"}":{"__typename":"Favorites","uuid":"def9691d-e5c7-469e-88af-03deded3a947","photoUrl":"https://ucarecdn.com/af407b18-8d26-4f71-a3a7-f4ecd61c3d95/","title":"Stick Season - Noah Kahan","type":"ALBUM"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"db290359-83b0-4688-813f-ec13880afe32\"}":{"__typename":"DeepDives","uuid":"db290359-83b0-4688-813f-ec13880afe32","content":"\u003cp\u003eI've always been drawn to designing, building, and testing — from initially coding Scratch games and EV3 robots to creating web apps and building circuits in physics labs. I love solving problems through trial and error and bringing ideas to life. What ultimately led me to Electrical and Computer Engineering was my fascination with robotics. Watching videos from Boston Dynamics and various university labs, I saw how robots can greatly improve lives. That’s why I chose ECE!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3b810915-68bf-4303-a5bc-c631accca704\"}":{"__typename":"DeepDives","uuid":"3b810915-68bf-4303-a5bc-c631accca704","content":"\u003cp\u003eI believe mentorship is essential to pursuing any goal. The mentors in my life have challenged me to grow while also making me feel heard, supported, and valued. Mentorship also brings perspective — during a high school research project, my mentor, an ecology researcher, introduced me to tools and resources I wouldn’t have discovered on my own. That experience showed me the important role human connection and the sharing of knowledge play in growth and learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9a534088-9ee1-45ca-bb61-44d55c5d5468\"}":{"__typename":"DeepDives","uuid":"9a534088-9ee1-45ca-bb61-44d55c5d5468","content":null,"videoPlaybackId":"Zff5MuqqlQW4g00jythwjkjJ7iqII38k73iyYVsotncA","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"df3fed94-0e8e-46e5-9498-ad834b9b0c48\"}":{"__typename":"DeepDives","uuid":"df3fed94-0e8e-46e5-9498-ad834b9b0c48","content":"\u003cp\u003eI hope to become fluent in Cantonese! It’s an important part of my heritage, and it’s just such a pretty language! It’s also fascinating because it’s believed to be a closer representation of how ancient Chinese was pronounced, and I also really appreciate the beauty of classical Chinese.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"5a3a7cfd-9c99-4231-a3f6-9c7f8382c8cb\"}":{"__typename":"School","uuid":"5a3a7cfd-9c99-4231-a3f6-9c7f8382c8cb","name":"Westlake High School","city":"Austin","type":"HIGH","state":"Texas","country":"United States","zip":"78746"},"Education:{\"uuid\":\"a844d8ad-21b0-4f56-accd-e2137bc238ab\"}":{"__typename":"Education","uuid":"a844d8ad-21b0-4f56-accd-e2137bc238ab","school":{"__ref":"School:{\"uuid\":\"5a3a7cfd-9c99-4231-a3f6-9c7f8382c8cb\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"868d6ddf-d1a1-4b1e-8c33-7f0d32e00bf6\"}":{"__typename":"Education","uuid":"868d6ddf-d1a1-4b1e-8c33-7f0d32e00bf6","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"94d594e9-77e4-455d-bd4e-9cb13f18b7db\"}":{"__typename":"MentorPublicProfile","uuid":"94d594e9-77e4-455d-bd4e-9cb13f18b7db","displayName":"Christal C.","slug":"christal-chen-1","biography":"\u003cp\u003eWhether I’m building a robot with a team, mentoring students, drawing graphic novels, or delivering a speech, I’m driven by the joy of turning ideas into reality and the meaningful relationships that form in the process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Princeton, I’m a member of the Robotics Club, where my subteam is building a real-world version of WALL-E—a dream come true for a lifelong Disney Animation and Pixar fan. I also serve as an advisor through Matriculate, guiding high-achieving, low-income high school students through the college application process. I love learning about their passions and talents, and I’m grateful for the chance to support and encourage them along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I contribute to building fun, welcoming communities through leadership roles in our Chinese Language Association, Birding Society, and Christian Dance Company. I love exploring my interests and learning new skills—especially when I can also help create spaces that celebrate culture, sustainability, and faith.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was an avid Speech and Debate competitor and team officer, specializing in Informative Speaking and earning the title of state champion. After giving over 200 speeches across the country, I not only learned techniques in delivery and performance, but also gained insight into the power of storytelling, inspiration, and human connection.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy many forms of art, from drawing and creative writing to editing vlogs. I also love spending time with friends and family—whether we’re watching movies and TV shows or playing badminton and volleyball.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I’m excited to share what I love and help turn imagination into impact!\u003c/p\u003e","teachingVideoPlaybackId":"2Rpsd8DepOCXIWMuOyEuPR22u01Yi1211lXDbMnOH5dg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f893fc7c-5945-4035-ac7f-e17e92daaf26\"}"},{"__ref":"Favorites:{\"uuid\":\"def9691d-e5c7-469e-88af-03deded3a947\"}"}],"causesSupported":[],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"db290359-83b0-4688-813f-ec13880afe32\"}"},{"__ref":"DeepDives:{\"uuid\":\"3b810915-68bf-4303-a5bc-c631accca704\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a534088-9ee1-45ca-bb61-44d55c5d5468\"}"},{"__ref":"DeepDives:{\"uuid\":\"df3fed94-0e8e-46e5-9498-ad834b9b0c48\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/445a83d4-b13b-4b3f-b12b-93685798a067/-/preview/-/format/jpg/","https://u
