xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f27348ff-ac10-422e-b0dd-2773a7691e02\"}":{"__typename":"Favorites","uuid":"f27348ff-ac10-422e-b0dd-2773a7691e02","photoUrl":"https://ucarecdn.com/e7a70caf-abf7-4fe3-952e-14f757732bf5/","title":"Noah Kahan","type":"ARTIST"},"Favorites:{\"uuid\":\"ec2fb6a6-d766-4251-95dd-49a72dc332f9\"}":{"__typename":"Favorites","uuid":"ec2fb6a6-d766-4251-95dd-49a72dc332f9","photoUrl":"https://ucarecdn.com/95bb6544-26db-4324-bad0-7e1df2d800a4/","title":"Soccer or Rugby","type":"SPORT"},"Favorites:{\"uuid\":\"cd23cf97-7cfe-4770-8570-5377159ddc73\"}":{"__typename":"Favorites","uuid":"cd23cf97-7cfe-4770-8570-5377159ddc73","photoUrl":"https://ucarecdn.com/3cf14e9b-922d-4d8d-9664-7a44cb16dcf2/","title":"Terraforming Mars","type":"GAME"},"CausesSupported:{\"uuid\":\"18388d81-cfb9-478d-9780-ec688caf51a1\"}":{"__typename":"CausesSupported","uuid":"18388d81-cfb9-478d-9780-ec688caf51a1","name":"BEAM (Brown Elementary Afterschool Mentoring)","description":"\u003cp\u003eWorking with William D'Abate to tutor students. I am a site leader.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/a95f0115-f7bd-4bf9-bb5b-98be0c55e5a5/"},"CausesSupported:{\"uuid\":\"7730b7da-8cb5-4332-ac1a-3be40b51aa06\"}":{"__typename":"CausesSupported","uuid":"7730b7da-8cb5-4332-ac1a-3be40b51aa06","name":"Care Closet LBC","description":"\u003cp\u003eWorking with the unhoused to help clean Long Beach.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/ecd78b41-0cdf-498c-8cba-da266a19655c/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d2fef98e-619f-4389-a39c-14d7523e8b9a\"}":{"__typename":"DeepDives","uuid":"d2fef98e-619f-4389-a39c-14d7523e8b9a","content":"\u003cp\u003eMy dream job is to become an architect and build my own sustainable architecture firm!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"201d4b46-2601-4ab0-ac58-93d9d3182f84\"}":{"__typename":"DeepDives","uuid":"201d4b46-2601-4ab0-ac58-93d9d3182f84","content":"\u003cp\u003eIn my spare time, I love to do puzzles and play board games. Legos are my favorite, along with 3D puzzles (if you have never heard of these, look them up, they are amazing and a perfect gift). In terms of my favorite board game, that would have to be Terraforming Mars. I am obsessed with this long board game because of both the play but also the beautiful pieces. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"0f2d863c-da48-491f-85ea-757264d5eb5c\"}":{"__typename":"DeepDives","uuid":"0f2d863c-da48-491f-85ea-757264d5eb5c","content":"\u003cp\u003eMy identity is something that I take a lot of pride in. Being queer and black while also having a few learning disabilities have taught me a lot about being inclusive. Everyone deserves the chance to grow and learn from the incredible mentors at Curious Cardinals! I am here to be an inclusive mentor. What I mean by this is that I am here to find the one or two things that generate a child's spark, and connect with them through that. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f291b9ef-d50b-4c6c-98d0-10e767a36133\"}":{"__typename":"DeepDives","uuid":"f291b9ef-d50b-4c6c-98d0-10e767a36133","content":"\u003cp\u003eI chose architecture because of the Louvre in France. As much as I like art, nothing in the museum was as appealing as the architecture I had seen outside. Both the grand building and the pyramid took my breath away; I knew architecture was my calling at that moment. Additionally, I chose urban studies because I wanted to learn more about sustainability. As I took more urban studies classes, I learned that it is a great intersection point between sustainability and architecture. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"c33083ea-2a52-45bb-bb6e-1a1891a6a16e\"}":{"__typename":"School","uuid":"c33083ea-2a52-45bb-bb6e-1a1891a6a16e","name":"Millikan High School","city":"Long Beach","type":"HIGH","state":"California","country":"United States","zip":"90815"},"Education:{\"uuid\":\"d1af4df6-8f37-492a-ab96-d469cfd3ca71\"}":{"__typename":"Education","uuid":"d1af4df6-8f37-492a-ab96-d469cfd3ca71","school":{"__ref":"School:{\"uuid\":\"c33083ea-2a52-45bb-bb6e-1a1891a6a16e\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"467e0bdb-c05c-49fb-81fb-c2baf5f60c36\"}":{"__typename":"Education","uuid":"467e0bdb-c05c-49fb-81fb-c2baf5f60c36","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Architecture and Urban Studies ","degree":null},"MentorPublicProfile:{\"uuid\":\"0c218874-5a58-476c-bcef-e845302b6316\"}":{"__typename":"MentorPublicProfile","uuid":"0c218874-5a58-476c-bcef-e845302b6316","displayName":"Court C.","slug":"court-cummings","biography":"\u003cp\u003eHello! My name is Court Cummings, and I’m currently a senior at Brown University, where I’m majoring in Architecture and Urban Studies. I was born and raised in Long Beach, California—just a short drive from Los Angeles—and I bring a strong sense of community, creativity, and compassion into every space I work in.\u003c/p\u003e\u003cp\u003eFrom a young age, I’ve been shaped by experiences that helped me understand the value of service, teamwork, and learning. I attended public school while playing competitive club soccer for over 14 years. That time on the field taught me how to lead with focus, be open to feedback, and show up with consistency. In my senior year of high school, I set a record for the most goals scored in a single season—an achievement that built my confidence and helped me take on leadership roles in other areas of my life.\u003c/p\u003e\u003cp\u003eOutside of sports, I’ve always been drawn to giving back. During high school and in my gap year before college, I worked with a nonprofit organization called Care Closet LBC. That experience deeply shaped how I view my role in my community and inspired me to continue supporting others, particularly through mentorship and education. It was here that I learned how small actions—like organizing clothing drives or distributing essentials—can make a powerful difference.\u003c/p\u003e\u003cp\u003eAt Brown, I’ve continued that work through programs like Brown Elementary Afterschool Mentoring (BEAM). As a volunteer, I’ve had the opportunity to work with children of different ages, academic abilities, and social skill levels. Each student has taught me something new, and I’ve learned how to meet kids where they are—with patience, flexibility, and care. I also worked with younger students at a local private school, The Wheeler School, supporting enrichment activities and building strong one-on-one relationships that help kids feel seen and supported.\u003c/p\u003e\u003cp\u003eIn addition to my academic and mentoring work, I’ve been an athlete throughout college, competing on both the varsity and club soccer teams, and currently playing on the varsity rugby team. I also build sets for the university’s theater department—a hands-on role that requires precision, creativity, and a strong sense of safety and responsibility.\u003c/p\u003e\u003cp\u003eMy academic interests lie at the intersection of design, equity, and environmental justice. Brown’s open curriculum has allowed me to explore how buildings, cities, and infrastructure shape our lives—and how they can be reimagined in response to climate change. With buildings being one of the largest contributors to carbon emissions, I hope to one day help create sustainable, inclusive spaces that prioritize both people and the planet.\u003c/p\u003e\u003cp\u003eAs a mentor and educator, I bring a high-energy, student-centered teaching style that focuses on building meaningful relationships. I use humor, games, and hands-on activities to make lessons fun and engaging. More importantly, I work hard to create safe, inclusive environments where every child feels comfortable being themselves. As a Black, queer, and non-binary educator, I understand how important it is for young people to feel affirmed—and I strive to be the kind of role model I wish I had growing up.\u003c/p\u003e\u003cp\u003eOutside of school, I’m a proud dog parent (despite being allergic to most animals—thankfully, my poodles are hypoallergenic!), and I love finding joy in small moments. Whether I’m teaching, coaching, or just getting to know your child, I aim to lead with empathy, enthusiasm, and a deep belief in their potential.\u003c/p\u003e\u003cp\u003eI look forward to getting to know your child and supporting them in ways that are educational, meaningful, and fun!\u003c/p\u003e","teachingVideoPlaybackId":"oWFdUhRvPp3Vk5qpjhnsY02W7GXx00Y8I7URAGpmJcbuc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am very proud of my community service work with Care Closet LBC. This non-profit organization provides food and money to the unhoused within Long Beach in exchange for their help in making Long Beach's streets clean. By cleaning up trash around my city, I learned how to respect my city, both its members and the environment. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f27348ff-ac10-422e-b0dd-2773a7691e02\"}"},{"__ref":"Favorites:{\"uuid\":\"ec2fb6a6-d766-4251-95dd-49a72dc332f9\"}"},{"__ref":"Favorites:{\"uuid\":\"cd23cf97-7cfe-4770-8570-5377159ddc73\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"18388d81-cfb9-478d-9780-ec688caf51a1\"}"},{"__ref":"CausesSupported:{\"uuid\":\"7730b7da-8cb5-4332-ac1a-3be40b51aa06\"}"}],"major":"Architecture and Urban Studies ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d2fef98e-619f-4389-a39c-14d7523e8b9a\"}"},{"__ref":"DeepDives:{\"uuid\":\"201d4b46-2601-4ab0-ac58-93d9d3182f84\"}"},{"__ref":"DeepDives:{\"uuid\":\"0f2d863c-da48-491f-85ea-757264d5eb5c\"}"},{"__ref":"DeepDives:{\"uuid\":\"f291b9ef-d50b-4c6c-98d0-10e767a36133\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/479483ae-065d-47eb-8820-3926f6971e71/-/preview/-/format/jpg/","https://ucarecdn.com/86571d41-8f8d-4cb5-9d8c-c9a3001a5f25/-/preview/-/format/jpg/","https://ucarecdn.com/6c5dd1a8-5dc5-4af2-ab64-b1a4e2cdcb00/-/preview/-/format/jpg/"],"pronouns":"THEY_THEM","gender":"NON_BINARY","education":[{"__ref":"Education:{\"uuid\":\"d1af4df6-8f37-492a-ab96-d469cfd3ca71\"}"},{"__ref":"Education:{\"uuid\":\"467e0bdb-c05c-49fb-81fb-c2baf5f60c36\"}"}],"hiredAt":"2025-06-23T22:23:18.925Z","topics":["Visual Arts / Graphic Design","Film / Theater","Sports Journalism","Business / Entrepreneurship","Sports Analytics","Robotics / Electronics / CAD","Sustainability"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"court-cummings\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0c218874-5a58-476c-bcef-e845302b6316\"}"}}},"_sentryTraceData":"87b415a0f78242489c42e0329c15c383-97e619f3c4caadad-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=87b415a0f78242489c42e0329c15c383,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"court-cummings"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
