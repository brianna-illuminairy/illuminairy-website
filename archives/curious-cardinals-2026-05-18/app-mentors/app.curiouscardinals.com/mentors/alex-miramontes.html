xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"24011b4f-69cd-4c3c-9957-d77f0103f872\"}":{"__typename":"Favorites","uuid":"24011b4f-69cd-4c3c-9957-d77f0103f872","photoUrl":"https://ucarecdn.com/5d616e98-9c51-4995-aedb-e5aec5a4ee01/","title":"Soccer","type":"SPORT"},"CausesSupported:{\"uuid\":\"8e04b178-6a6f-4a4f-ab6e-a7676440c301\"}":{"__typename":"CausesSupported","uuid":"8e04b178-6a6f-4a4f-ab6e-a7676440c301","name":"Hispanic Scholarship Fund","description":"\u003cp\u003eI support HSF for empowering Latino students with education and resources. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/46b3f7a7-ae57-4d08-9492-fafa3db69062/"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"9dd3e6dc-c943-4552-89f4-1a9d8eb04d39\"}":{"__typename":"DeepDives","uuid":"9dd3e6dc-c943-4552-89f4-1a9d8eb04d39","content":"\u003ch6\u003eChatGPT said:\u003c/h6\u003e\u003cp\u003eMy Mexican heritage deeply influences my teaching style by shaping the way I connect with students and approach problem-solving. Growing up in a tight-knit, hardworking community, I learned the value of patience, adaptability, and meeting people where they are. I strive to create an inclusive and supportive learning environment where students feel encouraged to ask questions and take risks. My background has also taught me to think creatively when explaining concepts—whether through storytelling, real-world applications, or breaking down complex ideas into more approachable steps. I want students to see learning not just as a requirement, but as something engaging, empowering, and relevant to their own lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"31e5c631-ecb4-4399-803e-106d05cb8b83\"}":{"__typename":"DeepDives","uuid":"31e5c631-ecb4-4399-803e-106d05cb8b83","content":"\u003cp\u003eIn my spare time, I love playing sports, especially soccer and basketball. Competing and staying active have always been a big part of my life, and I enjoy the teamwork and strategy that come with the game. I’m also really into fashion—I like keeping up with trends, experimenting with different styles, and seeing how clothing can be a form of self-expression. When I’m not on the court or thinking about outfits, I enjoy working on hands-on projects, whether that’s fixing things, brainstorming new ideas, or just figuring out how stuff works. And of course, I always make time to hang out with friends, whether that’s just kicking back or debating random topics for no reason.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"e5a066db-2111-4b53-9a24-9b838d4826eb\"}":{"__typename":"DeepDives","uuid":"e5a066db-2111-4b53-9a24-9b838d4826eb","content":"\u003cp\u003eMentorship is important to me because I know firsthand how valuable it is to have someone who believes in you, pushes you to grow, and helps you navigate challenges. I didn’t always have a clear path laid out for me—I had to figure things out through trial and error, whether in academics, work, or personal growth. Now, I want to be the kind of mentor I would have appreciated: someone who listens, challenges, and supports.\u003c/p\u003e\u003cp\u003eI enjoy seeing people develop confidence in their abilities, whether it’s mastering a difficult concept, tackling a project, or discovering a new passion. Mentorship isn’t just about teaching—it’s about guiding, sharing perspectives, and helping someone unlock their potential. I believe learning is most meaningful when it’s personal and connected to real experiences, and I want to help others see the value in their own journeys.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"46edd14a-52f5-4870-b4bb-b5609cfa6ca0\"}":{"__typename":"DeepDives","uuid":"46edd14a-52f5-4870-b4bb-b5609cfa6ca0","content":"\u003cp\u003e’d tell my middle and high school self to stop stressing so much about having everything figured out. It’s easy to think you need a perfect plan, but the truth is, the best opportunities come from staying open to new experiences and adapting along the way. I’d remind myself that failure isn’t the end of the world—it’s just part of learning.\u003c/p\u003e\u003cp\u003eI’d also say to trust my instincts more and not be afraid to take up space. Whether it was in academics, sports, or personal interests, I sometimes held back instead of fully going for things. Looking back, I realize that growth happens when you step out of your comfort zone, ask questions, and take risks. Lastly, I’d tell myself to enjoy the moment. Some of the best memories come from the little things—late-night conversations, random adventures, and just being present.\u003c/p\u003e\u003cp\u003e4o\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2f319bcf-259e-4dfe-96be-2bb0ab0b948f\"}":{"__typename":"School","uuid":"2f319bcf-259e-4dfe-96be-2bb0ab0b948f","name":"Colorado Academy","city":"Denver","type":"HIGH","state":"Colorado","country":"United States","zip":"80235"},"Education:{\"uuid\":\"a9a71354-3bc2-40cb-9766-6f6a18ba9725\"}":{"__typename":"Education","uuid":"a9a71354-3bc2-40cb-9766-6f6a18ba9725","school":{"__ref":"School:{\"uuid\":\"2f319bcf-259e-4dfe-96be-2bb0ab0b948f\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"4b1db9cb-6df0-4539-a953-612a8448be79\"}":{"__typename":"Education","uuid":"4b1db9cb-6df0-4539-a953-612a8448be79","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"a1c5e3b9-c627-4919-844b-c07de09910b3\"}":{"__typename":"MentorPublicProfile","uuid":"a1c5e3b9-c627-4919-844b-c07de09910b3","displayName":"Alex M.","slug":"alex-miramontes","biography":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi! My name is Alex, and I’m a freshman at Harvard studying mechanical engineering. I grew up in Denver, Colorado, where I spent much of my time working in my family’s trucking business, learning how to repair semi-trucks, manage financial operations, and handle logistics. Over the years, I saw how problem-solving, efficiency, and adaptability could determine success in a fast-moving industry. I wasn’t just fixing trucks—I was helping keep a business running. Through that experience, I developed a passion for both engineering and business, realizing how technical knowledge and strategic thinking work together to solve real-world problems. It was in that environment that I learned resilience, innovation, and hands-on problem-solving—values that continue to shape my aspirations.\u003c/p\u003e\u003cp\u003eI’ve always been fascinated by how things work, whether mechanical systems, business operations, or abstract problem-solving. At Harvard, I’m excited to explore design, automation, and manufacturing while refining my technical skills. Whether optimizing a mechanical system or brainstorming a new design, I thrive in environments where I can take concepts and turn them into tangible solutions. I’m particularly interested in the intersection of engineering and entrepreneurship—how technology can drive meaningful change in different industries.\u003c/p\u003e\u003cp\u003eBeyond academics, I have a wide range of interests that keep me engaged and motivated. Sports have always played a big role in my life—I love playing soccer and basketball, both of which have taught me teamwork, discipline, and adaptability. Competing has given me a mindset that carries over into other areas of my life: pushing through challenges, learning from mistakes, and continuously improving. Fashion is another passion of mine. I love seeing how style reflects identity and culture, and I enjoy following trends, exploring unique designs, and expressing myself through what I wear.\u003c/p\u003e\u003cp\u003eAt my core, I take immense pride in my Mexican heritage. My background influences my values, work ethic, and how I connect with people. Whether through music, traditions, or my perspective on the world, I always find ways to celebrate my culture. It has given me a strong sense of identity and appreciation for perseverance.\u003c/p\u003e\u003cp\u003eI’m always looking for new ways to grow—through hands-on projects, collaborating with others, or learning from different perspectives. I believe some of the best ideas come from unexpected places, and I enjoy surrounding myself with people who challenge me to think differently. As I continue my journey at Harvard, I hope to apply my skills in meaningful ways while staying open to new opportunities. I don’t have everything figured out yet, but I’m excited to keep exploring, pushing boundaries, and seeing where the road takes me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Nn9aYOw5q9ky6SyySgn1W65m8QCI4hPRzN7R01001CBtw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I’m most proud of is helping my dad expand his trucking business. A few years ago, our family faced a huge setback when my dad was scammed out of over tens of thousands of dollars. Instead of letting that situation define us, I worked with him to turn things around. I took on responsibilities beyond just mechanical repairs—I managed finances, contacted contractors, and helped streamline operations.\u003c/p\u003e\u003cp\u003eRather than taking legal action against the company that scammed us, we leveraged the situation to negotiate better deals with bigger employers. We secured higher commission percentages, optimized payment tracking, and gradually scaled up. Over time, we were able to buy more trucks and significantly grow the business. Seeing my dad regain his confidence and our business thrive after such a tough situation made all the hard work worth it. It wasn’t just about financial success—it was about resilience, problem-solving, and refusing to let obstacles define our future.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"24011b4f-69cd-4c3c-9957-d77f0103f872\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8e04b178-6a6f-4a4f-ab6e-a7676440c301\"}"}],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9dd3e6dc-c943-4552-89f4-1a9d8eb04d39\"}"},{"__ref":"DeepDives:{\"uuid\":\"31e5c631-ecb4-4399-803e-106d05cb8b83\"}"},{"__ref":"DeepDives:{\"uuid\":\"e5a066db-2111-4b53-9a24-9b838d4826eb\"}"},{"__ref":"DeepDives:{\"uuid\":\"46edd14a-52f5-4870-b4bb-b5609cfa6ca0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b6aa2c4f-3a42-4404-a506-2b0d338464fb/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a9a71354-3bc2-40cb-9766-6f6a18ba9725\"}"},{"__ref":"Education:{\"uuid\":\"4b1db9cb-6df0-4539-a953-612a8448be79\"}"}],"hiredAt":"2025-03-14T14:00:46.279Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Writing","French","Spanish","Academic Coaching","College Essay Writing","Reading","Computer Science","Executive Function"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/9f7019f6-5b03-4f9f-a136-5aeaf2c62de6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alex-miramontes\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a1c5e3b9-c627-4919-844b-c07de09910b3\"}"}}},"_sentryTraceData":"bcdf61d23eca48ccbddb7d80e76770f4-86e8c00f82334468-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=bcdf61d23eca48ccbddb7d80e76770f4,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alex-miramontes"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'http
