 art making. I interacted with local elementary school students to finalize the book before production, which only made the project that much more meaningful. The process combined all of my passions: writing, reading, and art creation!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"01831ef0-9215-4046-b17a-aa872bac9664\"}":{"__typename":"DeepDives","uuid":"01831ef0-9215-4046-b17a-aa872bac9664","content":"\u003cp\u003eI have tap danced for more than 15 years.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"10d95050-cf74-4616-bae0-0b3bde790bda\"}":{"__typename":"DeepDives","uuid":"10d95050-cf74-4616-bae0-0b3bde790bda","content":"\u003cp\u003eI love playing pickup basketball, going on runs, playing Scrabble (or any strategy board game), going on runs, reading, journaling, meditating, and attempting the NYT crossword puzzle. Fun fact: last summer, I played a game of Scrabble every day! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"07ea5161-5fe1-401a-99f0-c58b854e36b5\"}":{"__typename":"School","uuid":"07ea5161-5fe1-401a-99f0-c58b854e36b5","name":"Metuchen High School","city":"Metuchen","type":"HIGH","state":"New Jersey","country":"United States","zip":"08840"},"Education:{\"uuid\":\"095adfbb-6377-48bc-896a-86c88467dac3\"}":{"__typename":"Education","uuid":"095adfbb-6377-48bc-896a-86c88467dac3","school":{"__ref":"School:{\"uuid\":\"07ea5161-5fe1-401a-99f0-c58b854e36b5\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"15315b11-7bf2-4020-82c4-0c15c96084aa\"}":{"__typename":"Education","uuid":"15315b11-7bf2-4020-82c4-0c15c96084aa","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"127be6e3-16e6-4159-8c9e-51b275896a21\"}":{"__typename":"MentorPublicProfile","uuid":"127be6e3-16e6-4159-8c9e-51b275896a21","displayName":"Chase K.","slug":"chase-klavon","biography":"\u003cp\u003eHi, I am Chase! I am a junior at Stanford University where I am double majoring in English and American Studies while minoring in Psychology. Within my English major, I am pursuing an emphasis in Creative Writing.\u003cbr\u003e\u003cbr\u003eAt Stanford, I spend my time as a manager for the Stanford Women's Basketball team, a peer advisor for the Creative Writing and American Studies departments, an artist in the Arbitrary Ink art collective, a teammate on the Stanford Club Basketball Team, and a writer for The Flourish, Stanford's Mental Health Publication. In my free time, I enjoy playing basketball, going on runs, playing board games (especially Scrabble or Catan), attempting the NYT crossword puzzle, and journaling!\u003cbr\u003e\u003cbr\u003eWriting has always been my outlet. Ever since a young age, I have had a love for words that has only grown as I was introduced to poetry, short stories, and creative non-fiction. I believe that both reading and writing can provide an intense joy that allows you to lose all sense of time. Nothing compares to the feeling of losing yourself in a book or finding your flow state while writing an essay, a poem, or even a song. I am passionate about making writing and literary analysis both fun and rewarding. Whether we explore creative writing, essay editing, literary analysis, or even grammar, I hope I can be of help to you in your learning journey!\u003c/p\u003e","teachingVideoPlaybackId":"KDws4OQo16Z3fKe4X3JxhMz4z1SD00rUm3x9DbX9EW9I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2d4b74e4-b206-4b16-8e1e-0eef0fda7dba\"}"},{"__ref":"Favorites:{\"uuid\":\"a99d094f-0354-4d7d-b76a-3d3c5bae2dd8\"}"},{"__ref":"Favorites:{\"uuid\":\"78e8fc20-18ee-408d-8adc-29b5591c814d\"}"}],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1473c2dc-c329-42c2-8298-e1a2441296cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"33c97c57-26c7-4595-a19a-88ec39aaf3df\"}"},{"__ref":"DeepDives:{\"uuid\":\"01831ef0-9215-4046-b17a-aa872bac9664\"}"},{"__ref":"DeepDives:{\"uuid\":\"10d95050-cf74-4616-bae0-0b3bde790bda\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f7693e35-327e-47c3-bbc1-b6f4e6d77c8d/-/preview/-/format/jpg/","https://ucarecdn.com/f44c70e3-d358-49aa-b8a4-221218867923/-/preview/-/format/jpg/","https://ucarecdn.com/d60b0308-61a8-4435-b51a-f80ddd1ea3fe/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"095adfbb-6377-48bc-896a-86c88467dac3\"}"},{"__ref":"Education:{\"uuid\":\"15315b11-7bf2-4020-82c4-0c15c96084aa\"}"}],"hiredAt":"2023-12-29T02:06:45.632Z","topics":["Writing","College Essay Writing","Reading","K-6 Storybook","Creative Writing","Sports Journalism","Journalism"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"
