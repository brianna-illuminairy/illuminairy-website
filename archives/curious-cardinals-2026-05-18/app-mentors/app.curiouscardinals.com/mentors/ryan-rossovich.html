xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9ba5df58-8b14-4067-927c-518e9831820c\"}":{"__typename":"DeepDives","uuid":"9ba5df58-8b14-4067-927c-518e9831820c","content":"\u003cp\u003eYou may have a plan for the future, but that will likely change. In high school, I planed on going to college and becoming a scientist. I did go to college, and I am currently studying to become an engineer (yes, not a scientist, but close enough). In between my college career, I joined the military. I would have never guessed that I would have become a Marine. Paths are not always linear, and that is perfectly fine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"57d07196-787b-4cb1-87e2-e4fc241bc074\"}":{"__typename":"DeepDives","uuid":"57d07196-787b-4cb1-87e2-e4fc241bc074","content":"\u003cp\u003eWhen I was in my sophomore year of high school, I had the best Chemistry teacher. He made the subject so interesting, and just made me genuinely curious. So at that point, I decided to study Chemistry. After some time in college, taking other STEM classes, I found a love for all of STEM. I switched to Chemical Engineering, as I see it more interdisciplinary (uses more subjects), and I just like learning as much as possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"7205ee86-db07-4c9c-9bdb-364670ea3aca\"}":{"__typename":"DeepDives","uuid":"7205ee86-db07-4c9c-9bdb-364670ea3aca","content":"\u003cp\u003eEver since my senior year of high school, I have decorated my car for Christmas. It started off as a joke, but has grown into a full on moving display. It can be best described as a parade float that is driving up and down the streets of my county. I have taken it to parades, tree lightings, and other holiday events, and people have also made it a tradition to see it every year.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"61729e72-39f0-4830-bcb7-b32184c3e16a\"}":{"__typename":"DeepDives","uuid":"61729e72-39f0-4830-bcb7-b32184c3e16a","content":"\u003cp\u003eHonestly, I was not the greatest high school student. I don't mean this as I almost failed out, I mean this as in I didn't really apply myself. I did not do sports, I did not really do a whole lot of clubs, and I can't even blame this on video games (I didn't play, nor do I currently play). I was on my robotics (FRC) team all four years, only as a general member. I took only two AP classes and one concurrent enrollment class. So clearly I was not the greatest student in high school, but that is not, and never is, the full picture of who someone is.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"949d61c3-a331-4b93-a498-e17e7ca7e668\"}":{"__typename":"School","uuid":"949d61c3-a331-4b93-a498-e17e7ca7e668","name":"Mills High School","city":"Millbrae","type":"HIGH","state":"California","country":"United States","zip":"94030"},"Education:{\"uuid\":\"9ed72d9d-9ccf-4e52-85f8-8174b422c609\"}":{"__typename":"Education","uuid":"9ed72d9d-9ccf-4e52-85f8-8174b422c609","school":{"__ref":"School:{\"uuid\":\"949d61c3-a331-4b93-a498-e17e7ca7e668\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"dc34f029-2792-45aa-8da6-80986c6cd798\"}":{"__typename":"Education","uuid":"dc34f029-2792-45aa-8da6-80986c6cd798","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"e08ac85d-9c92-4a02-9f31-fa54edbbb1c0\"}":{"__typename":"MentorPublicProfile","uuid":"e08ac85d-9c92-4a02-9f31-fa54edbbb1c0","displayName":"Ryan R.","slug":"ryan-rossovich","biography":"\u003cp\u003eI am a Stanford transfer student studying Chemical Engineering. I have completed three years at community college. I primarily went to Skyline College in San Bruno, while also attending College of San Mateo and Cañada College in Redwood City. During my time at these community colleges, I earned 8 Associate degrees and 4 certificates. I hold an Associate degree in Chemistry from Cañada College. The other Associate degrees are from Skyline College and include Biology, Math, Natural Sciences, and Physics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter my first year at community college, I joined the Marine reserves. I did this because I was not getting what I wanted to get out of college, with it being online (I graduated high school in 2020). I joined with the intention of going back to school, which is what I did. Despite this, it had taught me many valuable skills and has only made me a better person overall.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was on the robotics team, and was able to go to the world champs in Houston, TX one year.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, I was a Peer Mentor for two years, helping students get adjusted to college life, along with any other forms of help that is needed (like study skills and stress management). I was also a STEM tutor, focusing on Chemistry, Physics, and Math, for a year. With regards to clubs, I was the Vice President of the Engineering and Robotics Club at Skyline, in which we built a solar powered boat for a competition. I was also the Secretary for the Data Science Club at Skyline, in which we advocate and lead projects and workshops about data science. My first role was being the Commissioner of Activities for the Honors Club. I also held roles in some smaller clubs, like the Vice President of the Newton Club.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStarting in high school, I have decorated my car for Christmas every year. It has grown bigger every year, even winning \"Best Decorated\" car the first time we took it to a parade. I have also taken it to local tree lightings and other events, meeting the mayors and councils of nearby cities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOther than the car, outside of school, I like to watch science YouTube videos, like Veritasium, Stand Up Maths, and The Royal Institution. I also like TV and movies, especially comedies. Ace Ventura is probably my favorite movie and I am currently invested in a British series called Taskmaster.\u003c/p\u003e","teachingVideoPlaybackId":"PB2jHzVRVzqDtTwVQAdCpStcYD34wXcjtMvlnYaTD800","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Chemical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9ba5df58-8b14-4067-927c-518e9831820c\"}"},{"__ref":"DeepDives:{\"uuid\":\"57d07196-787b-4cb1-87e2-e4fc241bc074\"}"},{"__ref":"DeepDives:{\"uuid\":\"7205ee86-db07-4c9c-9bdb-364670ea3aca\"}"},{"__ref":"DeepDives:{\"uuid\":\"61729e72-39f0-4830-bcb7-b32184c3e16a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0f690225-64d3-4d04-b06f-877b615513ea/-/preview/-/format/jpg/","https://ucarecdn.com/d8c984f6-aa5f-4d91-8676-0336518ba55a/-/preview/-/format/jpg/","https://ucarecdn.com/01063b69-3bc0-48da-a267-00221433ac1c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"9ed72d9d-9ccf-4e52-85f8-8174b422c609\"}"},{"__ref":"Education:{\"uuid\":\"dc34f029-2792-45aa-8da6-80986c6cd798\"}"}],"hiredAt":"2025-10-20T23:23:06.679Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","6-8 Grade Science","Chemistry","Biology","Physics","Academic Coaching","Executive Function","College Essay Writing","Visual Arts / Graphic Design","STEM Project","Robotics / Electronics / CAD","Aviation / Aerospace"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ryan-rossovich\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e08ac85d-9c92-4a02-9f31-fa54edbbb1c0\"}"}}},"_sentryTraceData":"f7303358bc964fdbba2c19e763f03b31-8a8d1812266c2ffd-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f7303358bc964fdbba2c19e763f03b31,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N
