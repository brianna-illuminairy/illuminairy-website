xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3290b179-8423-4461-9987-1a949d6af9bd\"}":{"__typename":"DeepDives","uuid":"3290b179-8423-4461-9987-1a949d6af9bd","content":"\u003cp\u003eMentorship matters to me because one thoughtful mentor can completely change how a student sees themselves. I’ve seen how the right guidance at the right moment can turn uncertainty into confidence and curiosity into direction. I care deeply about creating that kind of space for students, where asking questions is encouraged, mistakes are part of the process, and ideas are taken seriously. Helping students realize they’re capable of more than they thought is one of the most rewarding parts of my work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8069995a-76e5-40c9-b726-081b49557323\"}":{"__typename":"DeepDives","uuid":"8069995a-76e5-40c9-b726-081b49557323","content":"\u003cp\u003eI’ve always been deeply curious about the natural world, especially the parts we\u0026nbsp;\u003cem\u003ecan’t\u003c/em\u003e\u0026nbsp;see. Studying biochemistry and then microbiology lets me understand how tiny, invisible systems shape health, disease, and life on a global scale. I was drawn to the idea that answering big questions often starts at the smallest level, and that curiosity has kept me motivated through years of research and discovery.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1a610589-15e4-4e07-9537-fb0f2c2c4efc\"}":{"__typename":"DeepDives","uuid":"1a610589-15e4-4e07-9537-fb0f2c2c4efc","content":"\u003cp\u003eOne of my favorite passion projects is the\u0026nbsp;Yale Journal of Biology and Medicine Podcast, which I helped build almost entirely from scratch. I developed the podcast structure, recruited and trained a student team, and led the project as it grew from just a couple of episodes per year to a full production with dozens of episodes annually. It combined science, storytelling, and mentorship, and showed me how powerful student-led creative projects can be when given the right support!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0f01d9b5-d842-4942-b04f-2ec2761a389e\"}":{"__typename":"DeepDives","uuid":"0f01d9b5-d842-4942-b04f-2ec2761a389e","content":"\u003cp\u003eOutside of work, I love staying active and creative. I enjoy hiking and backpacking, snowboarding, practicing martial arts, and working with ceramics. I also love reading (especially sci-fi and philosophy) and exploring new ways to blend creativity with analytical thinking.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"5205187e-15a4-45b1-897e-b2373f4f07d9\"}":{"__typename":"School","uuid":"5205187e-15a4-45b1-897e-b2373f4f07d9","name":"Public School #57","city":"Moscow","type":"HIGH","state":"N/A","country":"Russia","zip":"119019"},"Education:{\"uuid\":\"3d8649d2-d33f-4f04-8b72-4bfa23106f64\"}":{"__typename":"Education","uuid":"3d8649d2-d33f-4f04-8b72-4bfa23106f64","school":{"__ref":"School:{\"uuid\":\"5205187e-15a4-45b1-897e-b2373f4f07d9\"}"},"startYear":"2007","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c1091c79-5f09-4976-aaca-b523511c4954\"}":{"__typename":"School","uuid":"c1091c79-5f09-4976-aaca-b523511c4954","name":"Virginia Tech","city":"Blacksburg","type":"COLLEGE","state":"Virginia","country":"United States","zip":"24061"},"Education:{\"uuid\":\"312b3730-d877-4dc6-9b4b-c50af13c0ee7\"}":{"__typename":"Education","uuid":"312b3730-d877-4dc6-9b4b-c50af13c0ee7","school":{"__ref":"School:{\"uuid\":\"c1091c79-5f09-4976-aaca-b523511c4954\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2022","major":"Biochemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"2d34f84e-232d-47d8-8e40-444e18370fe8\"}":{"__typename":"MentorPublicProfile","uuid":"2d34f84e-232d-47d8-8e40-444e18370fe8","displayName":"Mara K.","slug":"mara-kushelman","biography":"\u003ch2\u003eHi! I’m Mara 👋\u003c/h2\u003e\u003cp\u003eI’m a PhD candidate in \u003cstrong\u003eMicrobiology at Yale University\u003c/strong\u003e, where I study infectious diseases, vaccines, and how science can be translated into real-world impact. Alongside my research career, I’ve spent years mentoring students and building creative, student-facing science projects -- especially those that combine \u003cstrong\u003ecuriosity, communication, and real-world relevance\u003c/strong\u003e. I love helping students turn big, messy ideas into polished projects they’re genuinely proud of.\u003c/p\u003e\u003ch2\u003e\u003c/h2\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch2\u003e🌟 \u003cstrong\u003eWhat I Specialize In\u003c/strong\u003e\u003c/h2\u003e\u003ch3\u003e\u003cstrong\u003ePassion Project Mentorship (High School | Ages 13–18)\u003c/strong\u003e\u003cbr\u003e\u003c/h3\u003e\u003cp\u003eI guide students through end-to-end passion projects, from idea generation to a polished final deliverable. I work particularly well with students who are curious, self-motivated, and interested in applying what they learn to the real world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eTypes of Projects I Support:\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch \u0026amp; academic projects\u003c/strong\u003e\u003cbr\u003eBiology, medicine, microbiology, global health, or biotech; literature reviews, mini meta-analyses, or data-driven projects.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePodcast \u0026amp; media projects\u003c/strong\u003e\u003cbr\u003eDesigning and launching a podcast from scratch—topic development, research, interviews, scripting, and production.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBusiness \u0026amp; entrepreneurship projects\u003c/strong\u003e\u003cbr\u003eStartup ideas, market research, competitive analysis, business plans, pitch decks, or case-study–style projects.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFinance \u0026amp; investing explorations\u003c/strong\u003e\u003cbr\u003eIntroductory investing projects, personal finance frameworks, or research-driven explorations of markets and companies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch3\u003e\u003cstrong\u003eSkills Students Build:\u003c/strong\u003e\u003c/h3\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCritical thinking and structured problem-solving\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLong-term planning and time management\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eClear communication and confidence presenting ideas\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLearning how to turn interests into real outcomes\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch2\u003e🎓 \u003cstrong\u003eWhy I’m Qualified to Mentor These Projects:\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI combine research depth, teaching experience, and real-world business exposure.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAs a PhD researcher, I design and lead original research projects, some resulting in peer-reviewed publications and international conference presentations.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAs a Graduate Fellow at Yale’s Graduate Writing Lab, I coach students one-on-one on clarity, structure, and persuasive communication.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI’ve worked as a consultant and venture associate, supporting science and health-tech startups through market analysis, commercialization strategy, and competitive research.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAs Podcast Coordinator for the Yale Journal of Biology and Medicine, I built a program from 2 to 30 episodes per year, mentoring a 15-person student team across research, hosting, and production.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eSessions are collaborative and practical -- we brainstorm, plan milestones, refine ideas, and polish final products together!\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003chr\u003e\u003ch2\u003e\u003cstrong\u003e🏆 Highlights\u003c/strong\u003e\u003c/h2\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePhD researcher at Yale University\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMultiple competitive research fellowships and awards\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eScience startup consultant and venture associate\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEditor for a scientific journal\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilder of a high-output academic podcast program\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"iRTNnI5Tnx8LGuvRwRMmRm9nurEGJyVnBSiroHLCcrw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3290b179-8423-4461-9987-1a949d6af9bd\"}"},{"__ref":"DeepDives:{\"uuid\":\"8069995a-76e5-40c9-b726-081b49557323\"}"},{"__ref":"DeepDives:{\"uuid\":\"1a610589-15e4-4e07-9537-fb0f2c2c4efc\"}"},{"__ref":"DeepDives:{\"uuid\":\"0f01d9b5-d842-4942-b04f-2ec2761a389e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7386c5c3-bf04-4f65-9e3e-9eddea77e00c/-/preview/-/format/jpg/","https://ucarecdn.com/4aea4788-1443-4755-bfd8-6d279a764800/-/preview/-/format/jpg/","https://ucarecdn.com/d3d0d744-8c7b-4fae-83e4-91921eec30c5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3d8649d2-d33f-4f04-8b72-4bfa23106f64\"}"},{"__ref":"Education:{\"uuid\":\"312b3730-d877-4dc6-9b4b-c50af13c0ee7\"}"}],"hiredAt":"2026-01-14T23:41:18.018Z","topics":["Business / Entrepreneurship","Finance / Investing","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mara-kushelman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2d34f84e-232d-47d8-8e40-444e18370fe8\"}"}}},"_sentryTraceData":"3549335a96f240c2af014cd269adde28-9837cfceafabdb14-
