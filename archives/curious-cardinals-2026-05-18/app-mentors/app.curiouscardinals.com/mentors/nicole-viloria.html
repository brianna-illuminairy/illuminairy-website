xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cd68b639-5976-4dcf-8d74-01d02769ba33\"}":{"__typename":"Favorites","uuid":"cd68b639-5976-4dcf-8d74-01d02769ba33","photoUrl":"https://ucarecdn.com/b43e5f3e-d259-4d0f-bf15-4a7a7195209a/","title":"Adam Sandler","type":"ACTOR"},"Favorites:{\"uuid\":\"2e5548f7-0fd3-4bda-9850-037035ef1a65\"}":{"__typename":"Favorites","uuid":"2e5548f7-0fd3-4bda-9850-037035ef1a65","photoUrl":"https://ucarecdn.com/046ab103-5318-400d-924e-9f69a52cacee/","title":"The Kite Runner","type":"BOOK"},"Favorites:{\"uuid\":\"ff8e9159-8868-44a8-b111-5116729bfb5e\"}":{"__typename":"Favorites","uuid":"ff8e9159-8868-44a8-b111-5116729bfb5e","photoUrl":"https://ucarecdn.com/355303f2-5f36-42c8-b58b-e6e32add2d8f/","title":"Los Angeles","type":"CITY"},"CausesSupported:{\"uuid\":\"32a31d91-88c6-4378-919f-d16f7940cecb\"}":{"__typename":"CausesSupported","uuid":"32a31d91-88c6-4378-919f-d16f7940cecb","name":"Venezuela's Freedom","description":"\u003cp\u003eAs a Venezuelan, I always do my best to speak up for my country! \u003c/p\u003e","photoUrl":"https://ucarecdn.com/ae8a3662-3e5e-4a03-9309-42e551a89f0c/"},"CausesSupported:{\"uuid\":\"b0d650b2-9550-4d76-9068-afd88226631a\"}":{"__typename":"CausesSupported","uuid":"b0d650b2-9550-4d76-9068-afd88226631a","name":"ENGin (Ukrainian nonprofit that pairs up Ukrainians with English speakers to practice)","description":"\u003cp\u003eI have fallen in love with Ukrainian culture through supporting my 3 students!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/e001f2f0-4b74-4c3d-9ba5-df2e53c49795/"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4a20c876-e764-40bd-87f0-c64a7f4a2e07\"}":{"__typename":"DeepDives","uuid":"4a20c876-e764-40bd-87f0-c64a7f4a2e07","content":"\u003cp\u003eI wish to make films with Venezuelan characters who make non-Venezuelans see us as fun, hardworking, and overall human instead of sticking to preconceived notions and stereotypes of us! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"8b61495f-569f-47f3-b815-200a8cb11d1f\"}":{"__typename":"DeepDives","uuid":"8b61495f-569f-47f3-b815-200a8cb11d1f","content":"\u003cp\u003eI have always been a very imaginative person, living life through my favorite stories! I was doing a lot of writing, reading, and watching in high school... more than socializing. But, especially, I spent most of my time studying for my AP classes and being involved in as many extracurriculars as possible. Eventually, I realized I couldn't live in my bubble forever and had to balance my academic and social life more, which turned into my awakening as a more extroverted person who always takes risks that inspire her writing! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"72824f49-5d53-450b-9bf3-bd6f0cc4e737\"}":{"__typename":"DeepDives","uuid":"72824f49-5d53-450b-9bf3-bd6f0cc4e737","content":"\u003cp\u003eI chose to major in Comparative Literature based on my different loves: stories, languages, and writing! Throughout my years in college, I was able to analyze stories in English, Spanish, and French while I was writing my own in those languages as well. Through Yale's interdisciplinary approach (meaning that it encourages the study of different fields regardless of the major), I also had the chance of analyzing and making films across languages and cultures! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"80aee5a6-5639-4c58-af05-ffc4c51dc68c\"}":{"__typename":"DeepDives","uuid":"80aee5a6-5639-4c58-af05-ffc4c51dc68c","content":"\u003cp\u003eI would not be where I am today without the different mentors I have had throughout the years, both professors and older peers. Every time I get the chance to give back, I do it because it comes out of my heart and motivational spirit to want to see others achieve their dreams, regardless of the resources they have! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"3e483384-64c3-4c80-b6c4-a5d04359fadd\"}":{"__typename":"School","uuid":"3e483384-64c3-4c80-b6c4-a5d04359fadd","name":"Felix Varela Senior High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33196"},"Education:{\"uuid\":\"965d9566-a147-420d-8ad6-5ee5b657470f\"}":{"__typename":"Education","uuid":"965d9566-a147-420d-8ad6-5ee5b657470f","school":{"__ref":"School:{\"uuid\":\"3e483384-64c3-4c80-b6c4-a5d04359fadd\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a09b6854-c71a-41e8-808c-8055b83ac9b3\"}":{"__typename":"Education","uuid":"a09b6854-c71a-41e8-808c-8055b83ac9b3","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2025","major":"Comparative Literature with a Concentration in Film and an Advanced French Language Certificate","degree":null},"MentorPublicProfile:{\"uuid\":\"3249c6a4-8931-4bf4-8399-5de751f12b35\"}":{"__typename":"MentorPublicProfile","uuid":"3249c6a4-8931-4bf4-8399-5de751f12b35","displayName":"Nicole V.","slug":"nicole-viloria","biography":"\u003cp\u003eHi! I’m Nicole, a writer and a filmmaker from Venezuela. I just graduated from Yale University with a Bachelor’s degree in Comparative Literature, with a Concentration in Film, and an Advanced French Language certificate. I truly believe we can do anything we set our minds to, but I know it’s not easy to change your mind overnight, so I am passionate about mentoring students so they can slowly believe in themselves!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf it had not been for my mentor, I would have never made it to Yale! Before getting there, I earned an Associate’s degree in English Literature at Miami Dade Honors College, where I was extremely active in different activities, such as being:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eEditor-in-chief of \u003cem\u003eUrbana \u003c/em\u003eLiterary \u0026amp; Arts Magazine, which won multiple awards, such as the Pacemaker by Scholastic\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePresident of the English Honor Society, hosting events and campaigns to promote English learning across students in Perú, Nicaragua, and Ukraine, and also raising $1,200 to support them\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eVolunteer Training Lead of ENGin, a Ukrainian nonprofit, where I trained 5,000+ volunteers to teach English to Ukrainian students online\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnd many more! BUT! While I was engaged in different literacy initiatives, I was always writing on the side, which flourished when I transferred to Yale.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, my filmmaking career took off:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI received a grant that allowed me to write and direct my first short film, where I led a cast and crew of 30+ people. It has won three awards so far!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI received three grants to write and direct my thesis short film about Venezuela in Miami, leading a cast and crew of more than 50 people. The film is in post-production!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI became Co-Executive Director of Diverso, a student nonprofit that supports underrepresented students to enter the film industry. We have had Oscar winners as panelists, such as Chloe Zhao and The Daniels!\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAfter graduating, I am currently the assistant of a Hollywood writer and showrunner, I just got into a Fellowship program that will finance my new short film, and I am still leading Diverso!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHOW CAN I HELP YOU?\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eRegardless of your resources, I can support you to:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDiscover what is that thing you’re passionate about and how you can harness your love for it into a cool project!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBe more confident and build studying and organization systems to make you a successful leader who gets into a top university!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eIf you’re not sure what “your thing is,” we can discover it together and do something cool that makes you excited about life and your future!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI can mentor you through your college application process, supporting you to write the BEST personal statement and answer questions the best way possible, based on my experience (besides Yale, I also got into Princeton, Amherst College, and Emerson College)!\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWHY AM I QUALIFIED TO HELP?\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have supported students in middle school, high school, and college across different areas:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI have taught English to Hispanic middle school students and Ukrainian young adults\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI have tutored middle school and high school students in writing, history, and public speaking\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI have mentored middle school, high school, and college students to improve their portfolios (artistic, academic, professional, etc), college applications (students I have mentored have gotten into Cornell University, Vanderbilt University, Boston University, University of Richmond, etc), and to pursue their passion projects (animation portfolio, starting a nonprofit, building a social media presence, etc)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA cool lesson with me might involve:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDesigning a Pinterest board manifesting the ideal YOU! + taking fun personality tests to discover who you REALLY are and what sparks your interest!\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a realistic and strategic week-by-week roadmap to achieve your goals, including healthier habits personalized to you to make you a more successful person!\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGuiding you through my past college applications, essays, materials, extracurriculars, etc as examples to highlight strengths and weaknesses as we brainstorm what areas to work on for you\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching you how to execute a short film, from idea development to pre-production, shooting, and post-production!\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBesides writing and directing, I love motivating people to follow their creative dreams on my Instagram and TikTok, I recently started learning how to surf (I love sidequests!), and I am a fan of watching movies and reviewing them on Letterboxd!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re ready to unleash your ultimate potential, do extremely ambitious projects, and be the coolest you can with great confidence, I’d love to work with you!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"8uQ02T9Xk502FNn44U6o3RE1La7S02z9AmdRwCL02XKE8wU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eHaving gotten into Yale as a transfer student with an acceptance rate of 1% will always be my biggest achievement! This reminds me daily that I always need to try, even if I may think it's not going to happen. Anything is possible!! \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"cd68b639-5976-4dcf-8d74-01d02769ba33\"}"},{"__ref":"Favorites:{\"uuid\":\"2e5548f7-0fd3-4bda-9850-037035ef1a65\"}"},{"__ref":"Favorites:{\"u
