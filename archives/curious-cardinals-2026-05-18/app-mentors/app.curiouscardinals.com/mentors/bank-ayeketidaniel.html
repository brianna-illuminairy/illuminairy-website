viduals and groups anticipate and adapt to changes in their environment because responding positively to change determines one’s success and longevity. This fuels my academic interests and my mentorship as well. I want to help my mentees explore and learn about various disciplines and help them grow. I am passionate about mentoring students in various realms:\u003c/p\u003e\u003cbr\u003e\u003cul\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSocial sciences: History, Government \u0026amp; Policy\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWriting: Creative Writing, Essay Writing, College Admissions Essays, Literary Analysis\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDebate and public speaking\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eArts: Drawing \u0026amp; Painting, Architecture\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBusiness: Entrepreneurship, Venture Capital, Sustainability\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eI spent high school competitively speaking and debating, and after years of hard work and competitive success, I love helping students engage in academic + extracurricular journeys and articulate their experiences and themselves. Regardless of what area of mentorship we engage in, I believe building confidence is key.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Harvard College, I support college founders through a venture capital organization, cultivate interest in architecture and design through a club I helped found, provide tours as a member of a service organization, and spend my free time working out and hanging out with friends!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e","teachingVideoPlaybackId":"601GYM1KXneIdfe01q9ph2aVB2JrZnt025gj7Uk5kDnens","teachingVideoDescription":null,"greatestAch
