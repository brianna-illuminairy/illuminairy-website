xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6e4ff93a-66e8-4d8a-80db-70704f70f006\"}":{"__typename":"Favorites","uuid":"6e4ff93a-66e8-4d8a-80db-70704f70f006","photoUrl":"https://ucarecdn.com/4c15bc28-096a-4878-bea0-84a509f1092d/","title":"Rumors - Fleetwood Mac","type":"ALBUM"},"Favorites:{\"uuid\":\"22d12d08-a9ec-4ec2-8f1d-197e5c80a79f\"}":{"__typename":"Favorites","uuid":"22d12d08-a9ec-4ec2-8f1d-197e5c80a79f","photoUrl":"https://ucarecdn.com/704b1410-6677-4f5f-be7b-4de6783401da/","title":"Elon Musk - Walter Isaacson","type":"BOOK"},"Favorites:{\"uuid\":\"0f44f3e8-3963-44dc-8a32-97e6e5da3d28\"}":{"__typename":"Favorites","uuid":"0f44f3e8-3963-44dc-8a32-97e6e5da3d28","photoUrl":"https://ucarecdn.com/5708f096-f8f7-4a42-9d34-2e6bf40f4421/","title":"Into The Wild","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"702a2536-f5d2-4eef-b9e6-d840488cc343\"}":{"__typename":"DeepDives","uuid":"702a2536-f5d2-4eef-b9e6-d840488cc343","content":"\u003cp\u003eIn my spare time, I enjoy playing golf, spending time with and training my Belgian Malinois, and staying active through challenging fitness regimens. I’m also an avid reader, particularly of biographies, where I draw inspiration from the lives of people I admire. These activities keep me balanced and continually striving for personal growth both mentally and physically.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"9fc47ce1-755c-4031-879a-20ab33911db2\"}":{"__typename":"DeepDives","uuid":"9fc47ce1-755c-4031-879a-20ab33911db2","content":"\u003cp\u003eMy biggest source of motivation comes from understanding that tackling difficult challenges helps me grow as a person. I'm constantly seeking out new ways to push myself, whether it's through academics, fitness, or personal development, because I believe that improvement comes from stepping out of your comfort zone and embracing hard work. I view every challenge as a stress test-- the biggest fear in my life is the fear of being average.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"fdda6051-e72e-439f-badb-7840b1ef47a8\"}":{"__typename":"DeepDives","uuid":"fdda6051-e72e-439f-badb-7840b1ef47a8","content":"\u003cp\u003eMy dream job is to be on the buy side of private equity in the entertainment sector, where I would be involved in identifying, evaluating, and investing in media companies or entertainment-related assets. In this role, I would focus on assessing opportunities in film, television, music, and digital media, leveraging my financial expertise to make informed decisions on acquisitions or partnerships. My goal would be to contribute to the growth and success of innovative entertainment companies by analyzing their financial health, potential for growth, and alignment with cultural trends. This role excites me because it allows me to combine my passion for storytelling, culture, and media with my financial skills, providing a unique opportunity to shape the future of the entertainment industry while delivering solid returns on investments.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"137e06e3-adaa-441a-b789-ee1dcc73e79e\"}":{"__typename":"DeepDives","uuid":"137e06e3-adaa-441a-b789-ee1dcc73e79e","content":"\u003cp\u003eOne of my key life goals is to support and raise a happy family with emotionally intelligent and intellectually curious members. I aspire to create a nurturing environment where my family can grow, learn, and thrive together. Encouraging emotional intelligence and a love for learning will be at the core of this, as I believe these qualities are essential for leading fulfilling and meaningful lives. This goal motivates me to continually develop myself so I can be the best version of myself for my future family.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"c6bfd0d1-66cc-4fbd-94e3-ba9451ef5327\"}":{"__typename":"School","uuid":"c6bfd0d1-66cc-4fbd-94e3-ba9451ef5327","name":"Kinkaid School","city":"Houston","type":"HIGH","state":"Texas","country":"United States","zip":"77024"},"Education:{\"uuid\":\"de183a2b-4c19-4b77-931e-648a6946c230\"}":{"__typename":"Education","uuid":"de183a2b-4c19-4b77-931e-648a6946c230","school":{"__ref":"School:{\"uuid\":\"c6bfd0d1-66cc-4fbd-94e3-ba9451ef5327\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bc77f602-b393-4fa6-9e11-df16e522c65d\"}":{"__typename":"School","uuid":"bc77f602-b393-4fa6-9e11-df16e522c65d","name":"The University of Texas at Austin","city":"Austin","type":"COLLEGE","state":"Texas","country":"United States","zip":"78712"},"Education:{\"uuid\":\"289d1aab-ea51-4ada-827b-e2df2f12f33d\"}":{"__typename":"Education",
