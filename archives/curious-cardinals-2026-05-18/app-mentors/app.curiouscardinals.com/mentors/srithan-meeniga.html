xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8043a8f2-2fe8-4a9a-baca-cc60aca4e802\"}":{"__typename":"Favorites","uuid":"8043a8f2-2fe8-4a9a-baca-cc60aca4e802","photoUrl":"https://ucarecdn.com/369e626d-c083-4200-8d82-b0c69b27e50f/","title":"Drake","type":"ARTIST"},"Favorites:{\"uuid\":\"b3e2696f-38ff-4752-8b13-c392d3be5f0d\"}":{"__typename":"Favorites","uuid":"b3e2696f-38ff-4752-8b13-c392d3be5f0d","photoUrl":"https://ucarecdn.com/672d7edf-f693-48b0-881e-951395ad8b39/","title":"Stephen Curry ","type":"ATHLETE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b33ea2a0-c8c7-461f-b6cf-0f2deafa4e48\"}":{"__typename":"DeepDives","uuid":"b33ea2a0-c8c7-461f-b6cf-0f2deafa4e48","content":"\u003cp\u003eIf I could give advice to my middle or high school self, it would be to remember that while academics are important, they shouldn't define your entire life. Coming from a highly competitive high school, I know how easy it is to get caught up in the pressure to always be at the top and to focus only on grades and performance. But it’s equally important to find activities outside of school that help you relax and recharge. For me, basketball, working out, and fishing were the things that gave me an escape from the stress and allowed me to find balance. You don’t have to be consumed by your studies and taking time to unwind and enjoy life is essential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a teenager, it’s easy to think you have to put everything into school and that success means overworking yourself. But trust me, your well-being is far more important. Without it, you risk burning out, and no amount of academic success is worth sacrificing your mental and physical health. Living a balanced life, where you can engage in hobbies and passions, will help you succeed both in school and in life. Don’t forget to take care of yourself. You’ll be much better off in the long run.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"72454178-a449-475c-b53c-1f8af1976a5a\"}":{"__typename":"DeepDives","uuid":"72454178-a449-475c-b53c-1f8af1976a5a","content":"\u003cp\u003eOne of the passion projects I’m most proud of is SportsHealthBayArea, an organization I created to help athletes understand the importance of injury prevention, specifically through proper warm-up, cool-down, and recovery techniques. As an athlete myself with a strong interest in medicine, I saw firsthand how injuries can sideline athletes, affecting their performance and long-term health. After experiencing an injury, I became passionate about finding ways to prevent them and decided to create a platform focused on injury prevention.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI started by writing over 25 blogs, sharing valuable insights on recovery from various injuries, and emphasizing the critical role of warm-ups and cool-downs before and after physical activity. I also hosted seminars and interviews with professionals at rehabilitation centers, actively engaging with athletes, coaches, and healthcare providers. Through these interactions, I was able to raise awareness about the importance of injury prevention and help athletes better understand how to take care of their bodies for long-term health. This project allowed me to combine my passion for sports with my interest in medicine, and it’s been rewarding to see the impact it has had on the athletic community.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d22eb7b4-4d71-4fd4-8094-2ad7b3268922\"}":{"__typename":"DeepDives","uuid":"d22eb7b4-4d71-4fd4-8094-2ad7b3268922","content":"\u003cp\u003eI’ve always envisioned myself starting my own private practice as an orthopedic surgeon, specializing in treating athletes and working closely with sports teams. As someone who has experienced injuries firsthand, I understand how important it is to get the right care, not just to recover but to perform at the highest level. I want to be the kind of surgeon who not only heals injuries but helps athletes prevent them in the first place, supporting them in maintaining their long-term health and careers. Working closely with sports teams, I’d love to be a part of their success stories, helping them overcome challenges and stay at the top of their game.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut while this path excites me, I also have a deep love for the ocean and its incredible ecosystems. I envision going back to college to earn a degree in marine biology. After years of working as an orthopedic surgeon, I’d transition into a career as a marine biologist, dedicating my time to studying and protecting marine life. The idea of working on conservation efforts and exploring the wonders of the ocean fascinates me. I want to retire as someone who has contributed to both the world of sports medicine and the preservation of our oceans, making a meaningful impact on both athletes and the environment. It's a dream that brings together my love for healing and my curiosity about the natural world, and I can't wait to make it a reality.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9e68e6ec-24cf-4abb-abc3-b9a50a2adbd5\"}":{"__typename":"DeepDives","uuid":"9e68e6ec-24cf-4abb-abc3-b9a50a2adbd5","content":"\u003cp\u003eMentorship matters to me because I’ve personally experienced the power of having someone to look up to and turn to for guidance. Throughout my life, I’ve been fortunate to have older friends who were always willing to help me with an open heart. They cared about my growth, both academically and personally and that kind of support helped me succeed throughout my life. I believe this kind of support, both academically and personally, is vital for a student to grow.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo me, mentorship is about building a relationship where the person being mentored feels comfortable enough to ask questions, share struggles, and grow. It’s about being a guide, but also being a friend—someone who can be trusted not just for academic or professional support, but for personal guidance as well. I want to be the kind of mentor who isn’t just there to teach but to listen, encourage, and offer a safe space for my mentees to express themselves. I think when you create that kind of connection, it allows people to thrive in ways they wouldn’t have on their own.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"6810ca29-631d-407e-923a-a6520048561f\"}":{"__typename":"School","uuid":"6810ca29-631d-407e-923a-a6520048561f","name":"Mission San José High School","city":"Fremont","type":"HIGH","state":"California","country":"United States","zip":"94539"},"Education:{\"uuid\":\"bc3bb4b9-77ce-4d89-ae45-79ba59de891b\"}":{"__typename":"Education","uuid":"bc3bb4b9-77ce-4d89-ae45-79ba59de891b","school":{"__ref":"School:{\"uuid\":\"6810ca29-631d-407e-923a-a6520048561f\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"89f004da-cd21-46cd-93f8-e2af386e322e\"}":{"__typename":"Education","uuid":"89f004da-cd21-46cd-93f8-e2af386e322e","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Molecular and Cellular Biology and Business Administration","degree":null},"MentorPublicProfile:{\"uuid\":\"b8ce1ed0-fc1b-4c99-be10-fd13009efc65\"}":{"__typename":"MentorPublicProfile","uuid":"b8ce1ed0-fc1b-4c99-be10-fd13009efc65","displayName":"Srithan M.","slug":"srithan-meeniga","biography":"\u003cp\u003eHi! My name is Srithan Meeniga, and I am currently studying Molecular and Cellular Biology at the University of California, Berkeley. As a mentor I care about being viewed as more than just a teacher to my students. I want to relate to my students on a personal level and be someone who they can look up to. My goal is to create an environment where my students feel comfortable both academically and also with anything else going on in their lives. As a mentor, I will be very supportive so my students will be excited to meet and learn about the topic of their choice.\u0026nbsp; I want to be viewed as a friend who happens to be helping them navigate them in their future studies and careers.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn terms of my academic pursuits, I plan to start my own private practice, specifically Orthopedic related, in the future, but I also intend to double major in Business. I believe that everything in today’s world is closely tied to business, and gaining a strong understanding of this sector will be crucial to my long-term success. To gain more experience in the field of Business Administration, I am currently consulting for large companies to better understand decisions they have to make on a daily basis, as it aligns with my interests and future goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I spend my time staying active and pursuing hobbies like playing basketball, going to the gym, and fishing. Spending time outdoors helps me unwind and maintain balance in my life. Professionally, I enjoy participating in research and working on consulting cases for large companies, as I find both areas to be intellectually stimulating and rewarding.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my unique accomplishments is founding my own organization called SportsHealthBayArea, which is dedicated to educating athletes about the importance of proper warm-up, cool-down, and recovery techniques for injury prevention. I am also very involved in research, specifically cancer and sports health research. Through Oncology research, I completed 150+ hours investigating CPT-1 inhibition with etomoxir. I ran cell-proliferation assays across 5+ conditions, built dose response curves, and analyzed how disrupted fatty-acid β-oxidation slows tumor growth. I co-authored and presented a poster at a regional conference of 200+ researchers. In sports medicine,\u0026nbsp; I designed a centralized database and analytics workflow for women’s field hockey headgear safety, expanding outreach to 700+ U.S. high schools. The shared database increased our group’s research throughput roughly 4× and informed practical helmet safety recommendations.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am very excited to meet you all and look forward to the opportunities ahead!\u003c/p\u003e","teachingVideoPlaybackId":"01jTQwXqg3uOR14yRtJtoAAUrXCof1SM02pOLWrXaBlGo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8043a8f2-2fe8-4a9a-baca-cc60aca4e802\"}"},{"__ref":"Favorites:{\"uuid\":\"b3e2696f-38ff-4752-8b13-c392d3be5f0d\"}"}],"causesSupported":[],"major":"Molecular and Cellular Biology and Business Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b33ea2a0-c8c7-461f-b6cf-0f2deafa4e48\"}"},{"__ref":"DeepDives:{\"uuid\":\"72454178-a449-475c-b53c-1f8af1976a5a\"}"},{"__ref":"DeepDives:{\"uuid\":\"d22eb7b4-4d71-4fd4-8094-2ad7b3268922\"}"},{"__ref":"DeepDives:{\"uuid\":\"9e68e6ec-24cf-4abb-abc3-b9a50a2adbd5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f33fbb96-0b36-44f0-8638-f5383191b8a1/-/preview/-/format/jpg/","https://ucarecdn.com/dbe4bf6f-21d5-4389-8923-cf3196bc8953/-/preview/-/format/jpg/","https://ucarecdn.com/ca3e846c-7a65-49b9-a1bc-0f2d85b9eee2/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"bc3bb4b9-77ce-4d89-ae45-79ba59de891b\"}"},{"__ref":"Education:{\"uuid\":\"89f004da-cd21-46cd-93f8-e2af386e322e\"}"}],"hiredAt":"2025-10-19T17:52:21.855Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Fashion / Cosmetics","Sports Journalism","Business / Entrepreneurship","Medicine / Health","Sports Analytics","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"srithan-meeniga\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b8ce1ed0-
