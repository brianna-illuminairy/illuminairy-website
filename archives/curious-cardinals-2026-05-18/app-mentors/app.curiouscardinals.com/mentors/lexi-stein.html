xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"13ad3c79-8264-4056-9a52-9887a62624d2\"}":{"__typename":"DeepDives","uuid":"13ad3c79-8264-4056-9a52-9887a62624d2","content":"\u003cp\u003eThe advice I would give my middle or high school self is to explore a variety of topics that spark your interest. Once you discover what excites you, focus on deepening your understanding of that subject and finding ways to commit to it. By building a niche around something you're passionate about, you'll not only develop a unique skill set but also create a strong foundation that can guide your future education and career choices. But most importantly, don't be too hard on yourself and make sure you enjoy high school and middle school because those memories and experiences will stick with you longer than one exam!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1c835914-cbc3-4fc5-995f-595fb7aa665d\"}":{"__typename":"DeepDives","uuid":"1c835914-cbc3-4fc5-995f-595fb7aa665d","content":"\u003cp\u003eI initially chose nursing as my major because I wanted to be directly involved in patient care and make a tangible difference in people’s lives. However, I realized I was drawn to understanding the broader factors that shape health outcomes. This led me to transfer to the College of Arts and Sciences to  major in Health and Societies. This a major offers a more holistic perspective on health by examining the systemic, cultural, and structural influences on public health. This interdisciplinary approach aligns more closely with my long-term goals of creating equitable health solutions and driving meaningful change in communities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"8d030b69-c2f8-48d4-a48d-d0f291f150fd\"}":{"__typename":"DeepDives","uuid":"8d030b69-c2f8-48d4-a48d-d0f291f150fd","content":"\u003cp\u003emaking my family and friends smile \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"c3091424-f6e8-4c8d-a612-7436e1679989\"}":{"__typename":"DeepDives","uuid":"c3091424-f6e8-4c8d-a612-7436e1679989","content":"\u003cp\u003esocial, focused, determined, and friendly!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"ebe5e575-6532-4978-8c24-9de0e98cd08e\"}":{"__typename":"School","uuid":"ebe5e575-6532-4978-8c24-9de0e98cd08e","name":"Horace Mann School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"150a0f95-c201-4908-a6e1-41f4b42f0701\"}":{"__typename":"Education","uuid":"150a0f95-c201-4908-a6e1-41f4b42f0701","school":{"__ref":"School:{\"uuid\":\"ebe5e575-6532-4978-8c24-9de0e98cd08e\"}"},"startYear":"2006","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"ae31c943-dc31-4b50-8ac0-77eff4cfddbe\"}":{"__typename":"Education","uuid":"ae31c943-dc31-4b50-8ac0-77eff4cfddbe","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Health and Societies ","degree":null},"MentorPublicProfile:{\"uuid\":\"e0d154d7-01a6-4f4f-813c-5c9f4abd6e0c\"}":{"__typename":"MentorPublicProfile","uuid":"e0d154d7-01a6-4f4f-813c-5c9f4abd6e0c","displayName":"Alexis S.","slug":"lexi-stein","biography":"\u003cp\u003eHi! My name is Lexi, and I am a senior at the University of Pennsylvania studying Health and Societies with a minor in Nutrition. My academic focus combines the disciplines of history, sociology, and anthropology to explore the complexities of public health. This interdisciplinary lens has fueled my passion for understanding how societal structures, cultural norms, and historical contexts influence health outcomes, particularly in underserved communities. My interest in nutrition aligns seamlessly with my studies in public health, as I believe access to nutritious food is fundamental to achieving equitable health outcomes.\u003c/p\u003e\u003cp\u003eProfessionally, I’ve gained valuable experience as an intern in the Finance and Operations program at Northwell Hospital's Cancer Institute. Additionally, I recently accepted a full-time position at Lenox Hill Hospital, where I will continue developing my skills in healthcare management and leadership. These opportunities have strengthened my ability to analyze complex problems, collaborate across teams, and create solutions that improve patient outcomes.\u003c/p\u003e\u003cp\u003eOutside of work and academics, I enjoy teaching and learning about various subjects and love helping mentees build organizational skills to stay on top of their projects. In my free time, I love exploring Philadelphia—trying out new workout classes or restaurants—and I’ll never turn down the chance to watch \u003cem\u003eFriends\u003c/em\u003e. As an avid reader, I’m always excited to share and receive great book recommendations.\u003c/p\u003e\u003cp\u003eWhile this is just a short introduction, I look forward to connecting with mentees in the future and learning more about them!\u003c/p\u003e","teachingVideoPlaybackId":"00PzT2SlrKerwpLhxSlKaZUqLS6undciygIXt9F3rqZM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Health and Societies ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"13ad3c79-8264-4056-9a52-9887a62624d2\"}"},{"__ref":"DeepDives:{\"uuid\":\"1c835914-cbc3-4fc5-995f-595fb7aa665d\"}"},{"__ref":"DeepDives:{\"uuid\":\"8d030b69-c2f8-48d4-a48d-d0f291f150fd\"}"},{"__ref":"DeepDives:{\"uuid\":\"c3091424-f6e8-4c8d-a612-7436e1679989\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/342dd232-e7d8-48d7-b660-1c69f36b5681/-/preview/-/format/jpg/","https://ucarecdn.com/a23f6883-2725-487e-adec-4ad4d5539d22/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"150a0f95-c201-4908-a6e1-41f4b42f0701\"}"},{"__ref":"Education:{\"uuid\":\"ae31c943-dc31-4b50-8ac0-77eff4cfddbe\"}"}],"hiredAt":"2024-11-21T10:57:20.077Z","topics":["K-5 Grade Math","Geometry","6-8 Grade Science","Chemistry","Biology","Writing","American Sign Language","Academic Coaching","Reading","History","K-6 Storybook","Creative Writing","Fashion / Cosmetics","History Project","Video / Photography","Business / Entrepreneurship","Medicine / Health","Public Speaking"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6
