js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"bff4f770-0f9c-4367-86a4-4a5b17c99073\"}":{"__typename":"DeepDives","uuid":"bff4f770-0f9c-4367-86a4-4a5b17c99073","content":"\u003cp\u003eTo my high school self: worry less about the future. My tendency to plan extensively is a double-edged sword. While it kept me organized and focused in school, it sometimes also hindered my ability to live in the present. I would advise my high school self to notice when looking too far forward causes stress and take those opportunities to return to the present moment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"120dec83-1ad5-4b1c-905e-cf13dce026e7\"}":{"__typename":"DeepDives","uuid":"120dec83-1ad5-4b1c-905e-cf13dce026e7","content":"\u003cp\u003eI believe that mentorship is a catalyst to self-confidence. Having someone who believes in you, offers guidance, and listens with intention creates a strong sense of trust. The mentors I’ve had through my youth inspire me to make the same impact on the next generation. I view mentorship as a collaborative; I find that in addition to sharing knowledge with my mentee, I glean a wealth of new ideas from them as well.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"6653b8dd-a18e-4a20-963c-b01d79a1ef52\"}":{"__typename":"DeepDives","uuid":"6653b8dd-a18e-4a20-963c-b01d79a1ef52","content":"\u003cp\u003eI am an extroverted introvert. Through elementary and middle school, my shyness was no secret. However, I learned how to advocate for myself, ask questions, and initiate conversations. Now, people are surprised when I tell them that I am actually quite introverted. My explanation is that I gain energy from time spent alone and while I enjoy being around people, it is not where I “recharge”. Recognizing this about myself has helped me strike a healthy balance between social and solitary time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9d6da3c0-a65b-4318-9f14-9cb8c6a2ca42\"}":{"__typename":"DeepDives","uuid":"9d6da3c0-a65b-4318-9f14-9cb8c6a2ca42","content":"\u003cp\u003eI am a puzzle fanatic! My mornings always begin with the NYT mini crossword, followed by Wordle, Connections, Letter Boxed, Strands, and Spelling Bee (yes, in that order exactly!) all while sipping on a first cup of coffee. Later in the day I might tackle the main crossword or perhaps I’ll whip out my Sudoku book when I have a spare moment. During the pandemic, I passed much of the time solving thousand piece wooden jigsaw puzzles spread across the dining room table.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"bd82ae8e-4c65-48e5-936a-925785a9fba1\"}":{"__typename":"School","uuid":"bd82ae8e-4c65-48e5-936a-925785a9fba1","name":"Sonoma Academy","city":"Santa Rosa","type":"HIGH","state":"California","country":"United States","zip":"95404"},"Education:{\"uuid\":\"7c35ec10-02e9-4a54-9986-d4632785b96d\"}":{"__typename":"Education","uuid":"7c35ec10-02e9-4a54-9986-d4632785b96d","school":{"__ref":"School:{\"uuid\":\"bd82ae8e-4c65-48e5-936a-925785a9fba1\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"3a9dc963-5b39-43ca-a9aa-137f90229f8e\"}":{"__typename":"Education","uuid":"3a9dc963-5b39-43ca-a9aa-137f90229f8e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"fc86deae-0aa8-4cf3-a7fc-661a8c8ce18c\"}":{"__typename":"MentorPublicProfile","uuid":"fc86deae-0aa8-4cf3-a7fc-661a8c8ce18c","displayName":"Sara B.","slug":"sara-boyers","biography":"\u003cp\u003eHi! My name is Sara, and I’m an undergraduate at Stanford University. I am from Santa Rosa, CA and graduated from Sonoma Academy in 2021. In high school, I focused heavily on STEM classes, but balanced my course load by choosing extracurriculars in the visual arts. I’ve always had diverse interests and found a passion for interdisciplinary studies during high school. I was also an active member of my community, taking the lead as a TA during my Sophomore and Junior years as well as engaging as a Student Sustainability Leader. During the pandemic, I became a peer tutor for French and Pre-Calculus at my high school. With the lack of in person classes, extra support became crucial for many students; tutoring was a fantastic way to help and connect with peers in a time of social distancing.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI took a gap year before starting at Stanford in the fall of 2022 and am currently pursuing a degree in computer science. At the beginning of my Freshman year, I was entirely undecided about my major and took that as an opportunity to take a wide variety of classes. It was at Stanford that I took my first ever computer science class, and I immediately love it! Though I felt “behind” compared to those who had more extensive background in the subject, I turned that into motivation, asking more questions and engaging more deeply in the course. In addition to the black and white aspects of computer science, I am equally interested in the gray areas, particularly questions around ethics. Like in high school, I love finding connections between subjects. Computer science not only allows me to satisfy my love of puzzle solving and number crunching, but also gives me the space to ponder real, philosophical questions as the field rapidly develops.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I love spending time in nature, solving NYT crossword puzzles, thrift shopping, photography, and rock climbing. You’ll find me, book in hand, at a local coffee shop, or perhaps on a hike along the coast, soaking in the California sun. I’m an introvert at heart, but that doesn’t stop me from sparking conversation with a stranger about where they found their rad vintage sweater or retro Nike kicks.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to meeting and working with you!\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"x5rY2izDSd2ldxMJROFsWvtbGhkQwYApwzrPTwZk02f4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bff4f7
