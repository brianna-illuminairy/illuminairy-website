xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"815c0f74-0a30-4c46-93c9-83063e37ff75\"}":{"__typename":"Favorites","uuid":"815c0f74-0a30-4c46-93c9-83063e37ff75","photoUrl":"https://ucarecdn.com/7b9dd928-cf07-436f-bd07-f25d93a24336/","title":"Stick Season: We'll All Be Here Forever ","type":"ALBUM"},"Favorites:{\"uuid\":\"0c1cfbac-6b78-4814-bafd-2812b88c8887\"}":{"__typename":"Favorites","uuid":"0c1cfbac-6b78-4814-bafd-2812b88c8887","photoUrl":"https://ucarecdn.com/52e41b76-5da7-41ee-8217-f35674ca8d3f/","title":"Something Rotten","type":"PLAY"},"Favorites:{\"uuid\":\"dbe736a8-2e37-4117-bb59-f560fd30229b\"}":{"__typename":"Favorites","uuid":"dbe736a8-2e37-4117-bb59-f560fd30229b","photoUrl":"https://ucarecdn.com/52e41b76-5da7-41ee-8217-f35674ca8d3f/","title":"Dodgers","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"3965d6d2-514d-4ac9-9df6-46f02dddcb22\"}":{"__typename":"CausesSupported","uuid":"3965d6d2-514d-4ac9-9df6-46f02dddcb22","name":"HELP Outreach","description":"\u003cp\u003eA local non-profit in my hometown that distributes ~400 meals every Sunday! \u003c/p\u003e","photoUrl":"https://ucarecdn.com/d309c593-a604-4a74-bb05-7318034661f6/"},"CausesSupported:{\"uuid\":\"8e553460-0b0e-4736-a226-783372d88698\"}":{"__typename":"CausesSupported","uuid":"8e553460-0b0e-4736-a226-783372d88698","name":"Social Promise ","description":"\u003ch2\u003eSocial Promise helps provide education for youth and improve health in Uganda! \u003c/h2\u003e","photoUrl":"https://ucarecdn.com/cd128e73-436f-42d3-a0d3-495b16047af3/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7888a7b1-f278-41f4-87a6-75ff4ec4a72d\"}":{"__typename":"DeepDives","uuid":"7888a7b1-f278-41f4-87a6-75ff4ec4a72d","content":"\u003cp\u003eI love to read, travel, dance, write, take photos, and practice martial arts in my spare time! Outside of hobbies, I'm very passionate about giving back to my community and spending time with friends and family. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"dcaeceda-bdd4-4a96-a2a6-7b57aea98890\"}":{"__typename":"DeepDives","uuid":"dcaeceda-bdd4-4a96-a2a6-7b57aea98890","content":"\u003cp\u003e\u003cstrong\u003eDo what you love!!!!\u003c/strong\u003e I tell all of my students this! Your passion for a subject, project, pastime, or idea is what will make it successful! I spent a lot of my years doing things that I loved, but I would tell myself to pursue those passions more intensely. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"a126fed1-67c5-4fb2-a617-abd20482af18\"}":{"__typename":"DeepDives","uuid":"a126fed1-67c5-4fb2-a617-abd20482af18","content":"\u003cp\u003eIn high school, I was very passionate about leadership, and very involved in my school's community! I was a member of the \u003cstrong\u003eInternational Thespian Society\u003c/strong\u003e and president of my school's Troupe 2757. I was the \u003cstrong\u003ecaptain of the varsity swim team\u003c/strong\u003e for two years, and president of a club called Block V.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I was a \u003cstrong\u003edancer and martial artist.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI received my \u003cstrong\u003eblack belt in Shaolin Kenpo \u003c/strong\u003eright before I started high school, and spent my high school years practicing a blend of Shaolin and American Kenpo. At my dance studio, I practiced Jazz, Ballet, and Hip-Hop.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also was—and still am—an avid volunteer. I was a United States Ambassador at the \u003cstrong\u003eHugh O'Brian Youth (HOBY) World Leadership Congress\u003c/strong\u003e, and the \u003cstrong\u003eAlbert Schwietzer Leadership for Life International conference in Ireland\u003c/strong\u003e. Both conferences focused on service based leadership. Becuase of my community service efforts, in 2019 I received the \u003cstrong\u003eUnited States President's Volunteer Service Award\u003c/strong\u003e.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"43766678-9927-4c84-93bc-7f03af20180d\"}":{"__typename":"DeepDives","uuid":"43766678-9927-4c84-93bc-7f03af20180d","content":"\u003cp\u003eI have ADHD, and because of it, I'm very organized. Learning to cope with my ADHD to fit my lifestyle and education has helped me to learn some really amazing techniques for time management, stress management (which I spent a whole semester studying in a class at Harvard), and executive functioning. One of my favorite things to do is share these strategies with other people so they can manage their workloads and commitments without compromising on other things, like sleep or time outside of work, which lots of students do. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"a4702a1e-7719-4412-9e98-a2f14d13eb7e\"}":{"__typename":"School","uuid":"a4702a1e-7719-4412-9e98-a2f14d13eb7e","name":"Victor Valley High School","city":"Victorville","type":"HIGH","state":"California","country":"United States","zip":"92395"},"Education:{\"uuid\":\"f22f20e9-4fca-4efc-a20b-68523db39af4\"}":{"__typename":"Education","uuid":"f22f20e9-4fca-4efc-a20b-68523db39af4","school":{"__ref":"School:{\"uuid\":\"a4702a1e-7719-4412-9e98-a2f14d13eb7e\"}"},"startYear":"2017","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"7e11ac89-7ca1-4fe8-a8a3-c974564ca44c\"}":{"__typename":"Education","uuid":"7e11ac89-7ca1-4fe8-a8a3-c974564ca44c","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"Government: Public and Foreign Policy","degree":null},"MentorPublicProfile:{\"uuid\":\"022aeb82-1107-45d6-aca9-ef5aa42ea8f0\"}":{"__typename":"MentorPublicProfile","uuid":"022aeb82-1107-45d6-aca9-ef5aa42ea8f0","displayName":"Samantha W.","slug":"samantha-wilhoit","biography":"\u003cp\u003eSamantha, a first-generation Indigenous student, is a Junior at Harvard pursuing Government with a specialization in Public and Foreign Policy on the honors track. Admitted to Harvard at 16, she relocated from Southern California to Boston, and now divides her time between both coasts. At Harvard, Samantha serves as the Deputy Director of US Government Policy for the Harvard Undergraduate Foreign Policy Initiative and Chief of Staff for Harvard Model Congress San Francisco. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eHer academic interests extend to international relations, US Foreign Policy, and classical literature and mythology, while her passions outside the classroom lie in public service and community engagement. Samantha finds fulfillment in practicing martial arts, dance, creative writing, photography, travel, and cherishing moments with loved ones.\u003c/p\u003e\u003cp\u003eHer dedication to education transcends borders, having taught high school and college students from diverse backgrounds across the country and aborad, including in Dubai, India, Jordan, and more. \u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eDespite no one in my family ever attending college, I was admitted to Harvard when I was 16! I'm very proud of how hard I worked to achieve my goals. My college experience has completely changed my life as a result of those years of effort and dedication. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"815c0f74-0a30-4c46-93c9-83063e37ff75\"}"},{"__ref":"Favorites:{\"uuid\":\"0c1cfbac-6b78-4814-bafd-2812b88c8887\"}"},{"__ref":"Favorites:{\"uuid\":\"dbe736a8-2e37-4117-bb59-f560fd30229b\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"3965d6d2-514d-4ac9-9df6-46f02dddcb22\"}"},{"__ref":"CausesSupported:{\"uuid\":\"8e553460-0b0e-4736-a226-783372d88698\"}"}],"major":"Government: Public and Foreign Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7888a7b1-f278-41f4-87a6-75ff4ec4a72d\"}"},{"__ref":"DeepDives:{\"uuid\":\"dcaeceda-bdd4-4a96-a2a6-7b57aea98890\"}"},{"__ref":"DeepDives:{\"uuid\":\"a126fed1-67c5-4fb2-a617-abd20482af18\"}"},{"__ref":"DeepDives:{\"uuid\":\"43766678-9927-4c84-93bc-7f03af20180d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/205799fe-01e6-41f9-9fa9-2618c80814e6/-/preview/-/format/jpg/","https://ucarecdn.com/ac29006f-2c8f-49d2-887b-ea225a93182e/-/preview/-/format/jpg/","https://ucarecdn.com/510c55ae-2143-4313-aade
