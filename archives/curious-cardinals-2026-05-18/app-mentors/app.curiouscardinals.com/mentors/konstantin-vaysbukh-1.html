xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0f7e18c3-3d6e-43b8-ad36-c6cc40ba11f8\"}":{"__typename":"DeepDives","uuid":"0f7e18c3-3d6e-43b8-ad36-c6cc40ba11f8","content":"\u003cp\u003eMentorship matters to me because I know what it feels like to be lost. When I was younger, I struggled with motivation and direction, especially when it came to school. I was fortunate to have an environment filled with coaches, teachers, and mentors who believed in me, pushed me, and showed me the right path. Their support helped me find purpose and confidence, and I wouldn’t be where I am today without them. That experience inspires me to pay it forward and be that positive influence for someone else.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8c8db2c7-d69b-4e81-bc2e-a0070742f613\"}":{"__typename":"DeepDives","uuid":"8c8db2c7-d69b-4e81-bc2e-a0070742f613","content":"\u003cp\u003eI hope to go to the Olympics one day!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6fe37f9c-9a5a-4b3f-a692-6ec2665c806a\"}":{"__typename":"DeepDives","uuid":"6fe37f9c-9a5a-4b3f-a692-6ec2665c806a","content":"\u003cp\u003eI chose Statistics and Data Science because I wanted a major where I could apply math to real-world scenarios. I’ve always enjoyed solving problems and finding patterns, and this field allows me to take those skills and use them to make sense of complex data, uncover insights, and tackle real challenges. It’s exciting to see how math can be used to understand and improve the world around us.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cb609a4f-6ab7-4153-bbe8-70f1143a07af\"}":{"__typename":"DeepDives","uuid":"cb609a4f-6ab7-4153-bbe8-70f1143a07af","content":"\u003cp\u003eIn my spare time, I love hanging out with friends, whether it’s playing basketball or volleyball, grabbing food, or just relaxing. I also really enjoy watching shows—sometimes it’s a great way to unwind and recharge after a busy day. Staying active and spending time with people I care about helps me keep a good balance in life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"63d265ce-f302-4399-b80f-96ea8a7fd806\"}":{"__typename":"School","uuid":"63d265ce-f302-4399-b80f-96ea8a7fd806","name":"Wantagh High School","city":"Wantagh","type":"HIGH","state":"New York","country":"United States","zip":"11793"},"Education:{\"uuid\":\"ad14e794-aba4-4b9c-9ed3-4101701ccb87\"}":{"__typename":"Education","uuid":"ad14e794-aba4-4b9c-9ed3-4101701ccb87","school":{"__ref":"School:{\"uuid\":\"63d265ce-f302-4399-b80f-96ea8a7fd806\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"5f9a34b1-7e0e-42b8-ae50-0311b48471db\"}":{"__typename":"Education","uuid":"5f9a34b1-7e0e-42b8-ae50-0311b48471db","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Statistics and Data Science ","degree":null},"Testimonial:0b083b06-0ec2-4ad1-9bbc-cd25ff7b7b9e":{"__typename":"Testimonial","id":"0b083b06-0ec2-4ad1-9bbc-cd25ff7b7b9e","text":"Konstantin was a brilliant mentor for our 12 year old son.  They delved into global finance and created a portfolio of companies as a vehicle for understanding ways of investing and analyzing companies.  Konstantin encouraged our son to keep exploring.  Thank you!","date":"2025-06-10 01:01:33.237+00","rating":5,"endorser":{"__typename":"Endorser","name":"Jeffrey Clifford","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"e5351cf7-00af-4e27-bf0f-7daa83653728\"}":{"__typename":"MentorPublicProfile","uuid":"e5351cf7-00af-4e27-bf0f-7daa83653728","displayName":"Konstantin V.","slug":"konstantin-vaysbukh-1","biography":"\u003cp\u003e\u003cstrong\u003eHi, I’m Konstantin Vaysbukh!\u003c/strong\u003e\u003cbr\u003eI’m from New York and Latvia, and I’m currently a sophomore at Yale University studying Statistics and Data Science. I’ve always enjoyed math and love the challenge of solving problems and uncovering patterns—it’s one of the reasons I chose my major.\u003c/p\u003e\u003cp\u003eSports have also played a huge role in my life. I competed on the U.S. fencing team and now fence for Yale’s varsity team. When I’m not on the strip, you’ll find me playing basketball or volleyball, whether it’s a pickup game with friends or just enjoying time on the court.\u003c/p\u003e\u003cp\u003eI wouldn’t be where I am today without the mentors who showed me the right path and pushed me to grow, both academically and in sports. Their guidance and support have inspired me to become a mentor myself. I want to help students navigate their own challenges, build confidence, and find what excites them—whether that’s in school, sports, or life in general.\u003c/p\u003e\u003cp\u003eAt home, I spend time helping my younger brother with his math homework, and I’ve learned how powerful it can be to have someone patient and supportive on your side. As a mentor, I aim to be that person for my students.\u003c/p\u003e\u003cp\u003eWhether it’s building good habits, tackling challenges head-on, or finding motivation, I’m here to help students succeed while keeping the process engaging and positive. Let’s work together to achieve your goals and make learning an enjoyable experience!\u003c/p\u003e","teachingVideoPlaybackId":"VAs2G6mU9D01e02va1AMFzVUTUnVPtfzujTJGz6500TnDo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics and Data Science ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0f7e18c3-3d6e-43b8-ad36-c6cc40ba11f8\"}"},{"__ref":"DeepDives:{\"uuid\":\"8c8db2c7-d69b-4e81-bc2e-a0070742f613\"}"},{"__ref":"DeepDives:{\"uuid\":\"6fe37f9c-9a5a-4b3f-a692-6ec2665c806a\"}"},{"__ref":"DeepDives:{\"uuid\":\"cb609a4f-6ab7-4153-bbe8-70f1143a07af\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e353fe55-479d-4130-b69a-67a49f796633/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"ad14e794-aba4-4b9c-9ed3-4101701ccb87\"}"},{"__ref":"Education:{\"uuid\":\"5f9a34b1-7e0e-42b8-ae50-0311b48471db\"}"}],"hiredAt":"2024-12-10T16:26:27.466Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","6-8 Grade Science","Writing","History"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"te
