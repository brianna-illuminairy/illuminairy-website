xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b1d29e97-49c8-4504-b1cb-fa7984cd8705\"}":{"__typename":"DeepDives","uuid":"b1d29e97-49c8-4504-b1cb-fa7984cd8705","content":"\u003cp\u003e\u003cstrong\u003e1. Don’t rush the journey.\u003c/strong\u003e\u003cbr\u003eYou don’t need to have everything figured out right away. The things you’re interested in will change and evolve—and that’s a good thing. Instead of worrying about having a perfect plan, focus on being curious and open to learning.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e2. Confidence comes with practice.\u003c/strong\u003e\u003cbr\u003eIt’s okay to be nervous, whether it’s speaking up in class, joining a new club, or trying out for something that feels out of reach. The more you practice stepping out of your comfort zone, the easier it gets—and the confidence builds over time.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e3. Comparison steals joy.\u003c/strong\u003e\u003cbr\u003eIt’s easy to look around and feel like everyone else has it together, but people only show a part of their lives. Focus on your own growth instead of measuring it against others. You’ll realize you’re already making progress in your own unique way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"8a18e435-2a57-4d8a-b265-0c0db01a9d2b\"}":{"__typename":"DeepDives","uuid":"8a18e435-2a57-4d8a-b265-0c0db01a9d2b","content":"\u003cp\u003eFor me, the greatest source of motivation would be growth paired with impact. The feeling that I’m continuously learning, stretching my limits, and then using that growth to help others or make something meaningful drives me more than anything. When I can see that my work—whether it’s solving a problem, creating something, or supporting someone—is contributing to a bigger purpose, it pushes me forward even on hard days.\u003c/p\u003e\u003cp\u003eI’d also add that motivation isn’t always loud or dramatic—it can come from small things: the curiosity to understand something new, the resilience of people I admire, or even the vision of who I want my future self to be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"847b5815-f108-408d-b078-0676a3656240\"}":{"__typename":"DeepDives","uuid":"847b5815-f108-408d-b078-0676a3656240","content":"\u003cp\u003eFor me, mentorship isn’t just about passing down knowledge, it’s about building a relationship where both people grow. I’ve had mentors who challenged me, gave me confidence, and opened doors I didn’t even know existed. Paying that forward feels not only meaningful but necessary.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt’s also about impact: when you mentor, you’re not only sharing skills or advice, you’re helping someone see possibilities they may not have considered for themselves. That blend of teaching, listening, and empowering is energizing. It turns what could just be another task into something that leaves a lasting mark.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"46480cf3-63de-4a5d-8ca5-2fe28b228354\"}":{"__typename":"DeepDives","uuid":"46480cf3-63de-4a5d-8ca5-2fe28b228354","content":"\u003cp\u003eBeing from Morocco, I carry with me a deep appreciation for storytelling, community, and resilience, all of which show up in how I teach. Moroccan culture is built on complex traditions, where stories, proverbs, and conversations over shared meals become powerful ways of passing down knowledge. That makes me naturally lean on analogies, narratives, and real-world examples when I explain concepts, because I know they stick better than abstract facts alone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"9f309dc0-6297-4a29-8636-a8bff353fcf6\"}":{"__typename":"School","uuid":"9f309dc0-6297-4a29-8636-a8bff353fcf6","name":"Edward R. Murrow High School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11230"},"Education:{\"uuid\":\"d5f4f9f8-30a3-4b51-8960-edac73bb0a31\"}":{"__typename":"Education","uuid":"d5f4f9f8-30a3-4b51-8960-edac73bb0a31","school":{"__ref":"School:{\"uuid\":\"9f309dc0-6297-4a29-8636-a8bff353fcf6\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"133348fd-612f-44fc-84cd-08d390238403\"}":{"__typename":"Education","uuid":"133348fd-612f-44fc-84cd-08d390238403","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Neuroscience and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"5958e60a-369f-49d2-a3ae-89a10c9113c4\"}":{"__typename":"MentorPublicProfile","uuid":"5958e60a-369f-49d2-a3ae-89a10c9113c4","displayName":"Salma E.","slug":"salma-elhandaoui","biography":"\u003cp\u003eI am Salma Elhandaoui, a sophomore at Vanderbilt University majoring in Neuroscience and Economics. As a first-generation student who grew up in Morocco and now lives in New York City, I’ve always been motivated by curiosity, resilience, and the drive to bridge worlds—whether between cultures, disciplines, or people. These experiences shape how I approach both learning and teaching: with openness, creativity, and empathy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I am fascinated by the brain and how neurological disorders like Alzheimer’s disease affect families. I plan to pursue neurosurgery with a focus on health equity, ensuring that scientific and medical advances are accessible to diverse communities. My coursework at Vanderbilt, along with research experiences such as developing preprocessing pipelines for fMRI and EEG data, has grounded me in both theory and practice. At the same time, I explore intersections with environmental science and public health, looking at how climate change and health disparities overlap. I’m particularly drawn to questions of equity, access, and the role innovation can play in creating fairer health systems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond the classroom, I am a passionate entrepreneur and innovator. I founded several initiatives, including the Domino Robotic Surgical Systems Initiative (DRSSI), which I started in high school and am now scaling through Stanford’s HATCH program. I also created PARAEDU, an educational resource project, and aWEAR, a sustainable fashion venture. These projects gave me hands-on experience in leadership, design, and systems thinking. As a Map the System team lead at Vanderbilt, I guided peers in analyzing food insecurity through stakeholder mapping and systems models, coordinating with mentors and community partners to design meaningful solutions. The experience taught me not only about research, but about collaboration, persistence, and the power of storytelling to inspire action.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also spend much of my time in writing and communication. As a staff writer for The Vanderbilt Hustler, I cover stories on campus culture, policy, and student voices. Writing allows me to share narratives that matter, while my involvement in the Debate Team and student associations has strengthened my ability to connect with different perspectives. Outside of academics and professional work, I enjoy creative outlets like painting and crochet, which help me stay balanced and remind me of the importance of joy in learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I care about most is helping others see possibilities in themselves and in the world around them. Whether through mentoring, leading a team, or simply having conversations, I strive to create spaces where curiosity grows into confidence and bold ideas take root. For future students and families, I hope to model that learning is not just about academics—it’s about discovering passions, building resilience, and creating meaningful change.\u003c/p\u003e","teachingVideoPlaybackId":"cMIUUSsW2nTZia00g3hmS6XvxM2RcZd5p00BtRxH004UKU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b1d29e97-49c8-4504-b1cb-fa7984cd8705\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a18e435-2a57-4d8a-b265-0c0db01a9d2b\"}"},{"__ref":"DeepDives:{\"uuid\":\"847b5815-f108-408d-b078-0676a3656240\"}"},{"__ref":"DeepDives:{\"uuid\":\"46480cf3-63de-4a5d-8ca5-2fe28b228354\"}"}],"active":true,"profilePho
