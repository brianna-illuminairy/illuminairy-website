xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"49abbfb6-9ac3-4f3c-821b-f9abe90664d5\"}":{"__typename":"Favorites","uuid":"49abbfb6-9ac3-4f3c-821b-f9abe90664d5","photoUrl":"https://ucarecdn.com/92d90243-b790-4e46-8309-7e2baba2080b/","title":"Loyle Carner","type":"ARTIST"},"Favorites:{\"uuid\":\"fa942067-4ad1-431d-8de9-65fa1858289e\"}":{"__typename":"Favorites","uuid":"fa942067-4ad1-431d-8de9-65fa1858289e","photoUrl":"https://ucarecdn.com/92d90243-b790-4e46-8309-7e2baba2080b/","title":"Jude Bellingham","type":"ATHLETE"},"Favorites:{\"uuid\":\"d1a7f6bc-3406-47f0-9c4b-4ae0cd4c44f0\"}":{"__typename":"Favorites","uuid":"d1a7f6bc-3406-47f0-9c4b-4ae0cd4c44f0","photoUrl":"https://ucarecdn.com/7a107360-8b3a-4d36-920a-641ebc1d0e16/","title":"Lords of the Bow - Conn Iggulden","type":"BOOK"},"CausesSupported:{\"uuid\":\"68f89b2d-e2a1-4500-9c27-06c1ca7fb150\"}":{"__typename":"CausesSupported","uuid":"68f89b2d-e2a1-4500-9c27-06c1ca7fb150","name":"Allegra's Ambition","description":"\u003cp\u003ehttps://www.allegrasambition.org.uk/\u003c/p\u003e","photoUrl":"https://ucarecdn.com/c5b7dfde-a9c4-4b6c-a885-a52defdcba93/"},"CausesSupported:{\"uuid\":\"41d75bbe-cc6e-4dc5-8e69-0f3ac72d42ee\"}":{"__typename":"CausesSupported","uuid":"41d75bbe-cc6e-4dc5-8e69-0f3ac72d42ee","name":"Cerebral Palsy Trust","description":"\u003cp\u003ehttps://cerebralpalsytrust.co.uk/\u003c/p\u003e","photoUrl":"https://ucarecdn.com/031773bc-0b64-449d-a296-709ffe6d8c11/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d3cefdc6-5ca8-4056-93bb-c7560dbf5bca\"}":{"__typename":"DeepDives","uuid":"d3cefdc6-5ca8-4056-93bb-c7560dbf5bca","content":"\u003cp\u003eI love to play sports and exercise! In sophomore year, my soccer team won the school-wide intramural league (not as successful at flag football or basketball). I also play as much golf as I can, frequently go to the gym, and like to get in the sauna for 10-15 minutes or so when possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b9cfea44-c1e4-4e0b-bab3-f796c5505dda\"}":{"__typename":"DeepDives","uuid":"b9cfea44-c1e4-4e0b-bab3-f796c5505dda","content":"\u003cp\u003eIf one day I can be the manager for Tottenham Hotspur or England, I will have completed life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a589544e-090b-498a-84b2-3081d842955c\"}":{"__typename":"DeepDives","uuid":"a589544e-090b-498a-84b2-3081d842955c","content":"\u003cp\u003eI really enjoy the analytical side of history. A quick question that you might want to ask yourself if interested in history is: what can I deduce or interpret from a source that is hundreds of years old, and what can it tell me about the way in which our world works now? If this question interests you, give it a try!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor International Studies, I think it's a very similar question, but I enjoy the dynamism of foreign policy, contemporary statecraft, and game theory. In my opinion, the constant evolution of new threats induces the constant evolution of technology, systems, and institutions, and I find it fascinating to watch how things unfold in real time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d120a96e-c23f-4342-9cfc-dec30da9f800\"}":{"__typename":"DeepDives","uuid":"d120a96e-c23f-4342-9cfc-dec30da9f800","content":"\u003cp\u003eI would like to be able to travel to every continent, and each of the wonders of the world. It's an ambitious goal, but it's achievable!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}":{"__typename":"School","uuid":"891dad70-4e24-4602-8353-1e8140b8eb0c","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60201"},"Education:{\"uuid\":\"1805b96d-b6af-41f6-bb15-57af3dc35205\"}":{"__typename":"Education","uuid":"1805b96d-b6af-41f6-bb15-57af3dc35205","school":{"__ref":"School:{\"uuid\":\"891dad70-4e24-4602-8353-1e8140b8eb0c\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"History and International Studies","degree":null},"School:{\"uuid\":\"d9e55d6a-e709-435a-b992-32f254f9e8a5\"}":{"__typename":"School","uuid":"d9e55d6a-e709-435a-b992-32f254f9e8a5","name":"Wellington College","city":"Crowthorne","type":"HIGH","state":"Berkshire","country":"United Kingdom","zip":"RG45 7PU"},"Education:{\"uuid\":\"11c95824-c1e3-443a-a5a3-fe836cd42b5f\"}":{"__typename":"Education","uuid":"11c95824-c1e3-443a-a5a3-fe836cd42b5f","school":{"__ref":"School:{\"uuid\":\"d9e55d6a-e709-435a-b992-32f254f9e8a5\"}"},"startYear":"2018","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"a93770c9-5c5d-41b8-8f7b-2f1244f99ff8\"}":{"__typename":"MentorPublicProfile","uuid":"a93770c9-5c5d-41b8-8f7b-2f1244f99ff8","displayName":"Linus B.","slug":"linus-bray","biography":"\u003cp\u003eHi! My name is Linus Bray, and I am an undergraduate at Northwestern University! Currently, I am a Junior double-majoring in History and International Studies, and I am hoping to also get a minor in Economics. \u003cbr\u003e\u003cbr\u003eMy primary academic interest lies in how people, states, and societies interact, and Studying History and International Studies enables me to critically analyse contemporary events with an added layer of historical context, so I really enjoy being able to do both of those subjects. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a historian, I think that one of the most interesting research projects I've done so far is on the relationship between the Sultan Murad III and Elizabeth I in the late 1500s. Content warning: history! Elizabeth's famous father, Henry VIII had left the Catholic Church and founded the Church of England in order to divorce his first wife, and Elizabeth's religious policy led to England being totally isolated from Catholic Europe. To trade, keep England afloat, and maintain the necessary naval presence to defend amphibious assaults, Elizabeth began corresponding with Sultan Murad III, head-of-state of the Ottoman Empire. This was the first recorded communication between England and the Ottomans! A long-lasting legacy of Henry's Break from Rome and the advent of Anglo-Ottoman relations was the formation of the Turkey Company, one of the earliest joint-stock companies that had a dual-mandate as a commercial and governmental actor. Two similar companies that would soon be formed were the Dutch and British East India Companies...\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, I play lots of sports, and watch them all! Right now, I'm mostly playing rugby at Northwestern, but I'm also a huge Spurs fan and a Steelers guy. Sports have made up a huge part of my life, and I think that it is so cool to learn a bit more about what happens behind the scenes, whether that be through analytics, front-office strategy, or performance optimisation. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo switch off, I love to watch movies, and right now my top 3 are Django Unchained, Hacksaw Ridge, and The Prestige. I also listen to a lot of music, and Loyle Carner, Fleetwood Mac, and Dave are some of my favourite artists. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eLonger-term, I think that I'd like to live in a slightly quieter city with great access to nature so that I can pick up some new hobbies, keep playing golf, but also be in a cosmopolitan and fun area. Next summer, I'll most likely be interning in Salt Lake City, so I guess it'll be a nice practice run!\u003cbr\u003e\u003cbr\u003eI'm very happy to talk about anything, whether it be sports, music, film, or something completely random as I love to learn!\u003c/p\u003e","teachingVideoPlaybackId":"5d43XJE8SUu01ty1UmPst00yYYg5Ap9Lm4dgQJnn01h1fM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"49abbfb6-9ac3-4f3c-821b-f9abe90664d5\"}"},{"__ref":"Favorites:{\"uuid\":\"fa942067-4ad1-431d-8de9-65fa1858289e\"}"},{"__ref":"Favorites:{\"uuid\":\"d1a7f6bc-3406-47f0-9c4b-4ae0cd4c44f0\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"68f89b2d-e2a1-4500-9c27-06c1ca7fb150\"}"},{"__ref":"CausesSupported:{\"uuid\":\"41d75bbe-cc6e-4dc5-8e69-0f3ac72d42ee\"}"}],"major":"History and International Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d3cefdc6-5ca8-4056-93bb-c7560dbf5bca\"}"},{"__ref":"DeepDives:{\"uuid\":\"b9cfea44-c1e4-4e0b-bab3-f796c5505dda\"}"},{"__ref":"DeepDives:{\"uuid\":\"a589544e-090b-498a-84b2-3081d842955c\"}"},{"__ref":"DeepDives:{\"uuid\":\"d120a96e-c23f-4342-9cfc-dec30da9f800\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4cbb417f-12b1-4513-ba0f-07249e50ba4d/-/preview/-/forma
