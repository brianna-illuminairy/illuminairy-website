xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"0a9227e3-f1d3-4df8-8c5d-7a2e5bd876f8\"}":{"__typename":"DeepDives","uuid":"0a9227e3-f1d3-4df8-8c5d-7a2e5bd876f8","content":"\u003cp\u003eI once had this dream that every time I flipped over my hands they were a different myriad of kaleidoscopic colors. That was the entire dream. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI went through a 3-month phase where I would wake up to myself dancing in my sleep. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c93de494-2063-463a-b2fc-2952350c0236\"}":{"__typename":"DeepDives","uuid":"c93de494-2063-463a-b2fc-2952350c0236","content":"\u003cp\u003eFirst, I want to pursue research based in quantum physics and engineering.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSecond, I love the way a material's performance and functionality is based equally on structure, process, and properties. It allows me to appreciate the complexity in nature in really unique ways. Materials science is the oldest science: humans turning to nature to create tools.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThird, I'm generally passionate about critical infrastructure and what safety and protection mean in the digital age. Semi-conductor chips drive modern electronics and is an example of a material, silicon, engineered through creating transistors- mixing in other elements- to form an integrated circuit.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"84b50e35-34c0-434f-9d28-637eb35e489d\"}":{"__typename":"DeepDives","uuid":"84b50e35-34c0-434f-9d28-637eb35e489d","content":"\u003cp\u003eI was very busy as a middle school student/ high school student! I was into musical theater, singing, dance, music, and performance. I was very outgoing in those spaces but more quiet and introspective when it came to social life and academics. In middle school, I played roles like the mad hatter from Alice in Wonderland. In high school, I even acted in traditionally male roles and had to learn how to dance in more masculine ways. I competed as a classical pianist and singer. I loved playing pieces by composers from the romantic period. I was also involved in social activism, facilitating unconscious bias workshops in schools all over Washington D.C., and made speeches in various community spaces advocating for racial and environmental justice. I really appreciated my teachers, especially English and piano teachers.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"ee79c3da-9856-412c-a973-b7d9b07456db\"}":{"__typename":"School","uuid":"ee79c3da-9856-412c-a973-b7d9b07456db","name":"Charles E Smith Jewish Day School--Annette M. and Theodore N. Lerner Family Upper School Campus","city":"Rockville","type":"HIGH","state":"Maryland","country":"United States","zip":"20852"},"Education:{\"uuid\":\"32ebd4cf-3fe7-4a58-8405-83776da59830\"}":{"__typename":"Education","uuid":"32ebd4cf-3fe7-4a58-8405-83776da59830","school":{"__ref":"School:{\"uuid\":\"ee79c3da-9856-412c-a973-b7d9b07456db\"}"},"startYear":"2016","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"d8b888fd-542c-4d9f-8db3-a2b4ab3fd146\"}":{"__typename":"Education","uuid":"d8b888fd-542c-4d9f-8db3-a2b4ab3fd146","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2027","major":"Masters in Materials Science and Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"9e692474-b0be-4a81-ac30-36b13f390dbd\"}":{"__typename":"MentorPublicProfile","uuid":"9e692474-b0be-4a81-ac30-36b13f390dbd","displayName":"Nicole S.","slug":"nicole-schwartz","biography":"\u003cp\u003eOverall Summary: I’m currently a graduate student at University of Pennsylvania engineering school in Materials Science and Engineering, passionate about quantum mechanics, quantum computing, and critical infrastructure. I am also an ICF ACC accredited coach, trained with a specialization in neurodivergence. I care about sustainable materials, waste, dance, and, most importantly, you. The work I care most about is showing young people their potential, what makes them spark, and the ability to understand and appreciate their own mind, strengths, AND weaknesses. I hold high standards for my students because I believe in them. I also value the idea that self-awareness and reflection is not separate from learning and is, in fact, essential for learning. I keep a kind and encouraging space and curate sessions around the students’ interests and joys.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have an extensive professional background in academic tutoring to struggling K-6th graders, teaching reading and writing to high schoolers, and personal and professional coaching to ages 16-18 years old. I recently completed a year-long fellowship as a reading specialist in a school to help 2nd graders reach grade-level reading capabilities. I worked daily, one-on-one and two-on-one with students who struggled with dyslexia, hyperlexia, autism, and ADHD. Prior to this experience, I was doing in-home tutoring in computer science and math to 5th-8th graders, and IELTS preparation to international students remotely. For the last 3.5 years, I have been coaching people in areas of personal and professional development and passion projects.\u0026nbsp; I have also guest-taught dance workshops and prose and poetry workshops.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have a knowledge base in computation (computer architecture and networks, programming languages: python and java), machine learning, in addition to the experience of being a multi-media artist and writer. As a scholarship recipient with the SANS technology institute, I have several cybersecurity certifications as well.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSome other facts about me:\u003c/p\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003eOver the last 7 years, I have volunteered at various organic farms and urban farms that advocate for equitable food access and open wellness spaces.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDuring my undergraduate degree, I did research in AI ethics and racially biased machine learning algorithms.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI have performed at the Athens Dance Festival, and participated in several other experimental choreographic projects both at Duke University and in Athens, surrounding themes of healing, community, and social activism.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI spent a lot of my college experience producing and directing a show called Me Too Monologues, where I was responsible for working one-on-one with actors to read and perform anonymously submitted stories from community members, specifically the experiences of marginalized communities.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI love music: jazz, jazz funk, R\u0026amp;B, alternative R\u0026amp;B, deep house, any instrumental music including classical music, and any and all live music!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e","teachingVideoPlaybackId":"vOCS2l81phX2012hNldmfvnr3nq301xlYesO1qfQgXXO8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Masters in Materials Science and Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0a9227e3-f1d3-4df8-8c5d-7a2e5bd876f8\"}"},{"__ref":"DeepDives:{\"uuid\":\"c93de494-2063-463a-b2fc-2952350c0236\"}"},{"__ref":"DeepDives:{\"uuid\":\"84b50e35-34c0-434f-9d28-637eb35e489d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/eb12e8e2-856a-4ecc-9db8-220fa6a55840/-/preview/-/format/jpg/","https://ucarecdn.com/ed2a4187-4459-4de1-815d-95fe0249358a/-/preview/-/format/jpg/","https://ucarecdn.com/892840c2-11e2-4c93-acd1-f8e9ab961704/-/preview/-/format/jpg/"],"pronouns":"OTHER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"32ebd4cf-3fe7-4a58-8405-83776da59830\"}"},{"__ref":"Education:{\"uuid\":\"d8b888fd-542c-4d9f-8db3-a2b4ab3fd146\"}"}],"hiredAt":"2025-09-27T05:33:12.484Z","topics":["Physics","Writing","Academic Coaching","College Essay Writing","Computer Science","Reading","Creative Writing","Film / Theater","Music","Business / Entrepreneurship","STEM Project","Public Speaking","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentor
