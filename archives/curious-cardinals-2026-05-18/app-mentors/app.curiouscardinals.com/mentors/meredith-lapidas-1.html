xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9d83b714-a779-49a6-ae1e-bdd6b67a911d\"}":{"__typename":"Favorites","uuid":"9d83b714-a779-49a6-ae1e-bdd6b67a911d","photoUrl":"https://ucarecdn.com/d642aa5e-157f-48ff-a9fb-48f265eb6002/","title":"Kings of Convenience","type":"ARTIST"},"Favorites:{\"uuid\":\"ae8c4af5-6070-4a66-9155-f86a3b03b0cc\"}":{"__typename":"Favorites","uuid":"ae8c4af5-6070-4a66-9155-f86a3b03b0cc","photoUrl":"https://ucarecdn.com/e58203bd-5797-4748-bedf-a425426a94fb/","title":"Rocky Trail","type":"SONG"},"Favorites:{\"uuid\":\"e0da8bdf-8114-461a-8c19-6ac3bc67f616\"}":{"__typename":"Favorites","uuid":"e0da8bdf-8114-461a-8c19-6ac3bc67f616","photoUrl":"https://ucarecdn.com/cd6f5603-d3a8-4f0d-b948-8345e23b2ae0/","title":"The Starless Sea","type":"BOOK"},"CausesSupported:{\"uuid\":\"d5283092-7be6-49e0-baba-d576538d36ff\"}":{"__typename":"CausesSupported","uuid":"d5283092-7be6-49e0-baba-d576538d36ff","name":"Environmental Activism","description":"\u003cp\u003eI worked with USC's Environmental Student Assembly to create green solutions.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/90f30d52-a465-4265-a7c0-f162466448fe/"},"CausesSupported:{\"uuid\":\"f5033005-9c16-4c3d-8d13-fbba50c622fd\"}":{"__typename":"CausesSupported","uuid":"f5033005-9c16-4c3d-8d13-fbba50c622fd","name":"LGBTQ+ Ally","description":"\u003cp\u003eI support LGBTQ+ rights because my family and friends deserve it.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/e2d6fa72-f705-4361-9bea-28625fe3ef3d/"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"37213e39-7d73-4f45-aeaf-7e048ce8ddd7\"}":{"__typename":"DeepDives","uuid":"37213e39-7d73-4f45-aeaf-7e048ce8ddd7","content":"\u003cp\u003eI wrote, designed, and published two poetry books throughout college, and I'm currently writing the third poetry book to be published, as well as a children's book! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"804e6bcc-f2e5-42dd-afd9-2b43257472af\"}":{"__typename":"School","uuid":"804e6bcc-f2e5-42dd-afd9-2b43257472af","name":"Algonquin Regional High School","city":"Northborough","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01532"},"Education:{\"uuid\":\"108842ae-1766-4185-8a31-a9ed4903b5a9\"}":{"__typename":"Education","uuid":"108842ae-1766-4185-8a31-a9ed4903b5a9","school":{"__ref":"School:{\"uuid\":\"804e6bcc-f2e5-42dd-afd9-2b43257472af\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"092a143f-56ff-4f14-9410-cb4924b181f7\"}":{"__typename":"Education","uuid":"092a143f-56ff-4f14-9410-cb4924b181f7","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Industrial and Systems Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"df0ea7c0-22db-4d44-90b2-fbce82dfd578\"}":{"__typename":"MentorPublicProfile","uuid":"df0ea7c0-22db-4d44-90b2-fbce82dfd578","displayName":"Meredith L.","slug":"meredith-lapidas-1","biography":"\u003cp\u003eHey! You can call me \u003cstrong\u003eMere\u003c/strong\u003e (pronounced “\u003cem\u003em-air\u003c/em\u003e”), and I’m a recent graduate of \u003cstrong\u003eindustrial and systems engineering\u003c/strong\u003e, with a course emphasis in \u003cstrong\u003ecreative writing\u003c/strong\u003e, from \u003cstrong\u003ethe University of Southern California\u003c/strong\u003e in Los Angeles. I’m originally from the Boston area, but I'm am currently stationed in Palo Alto.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eI value being a multipotentialite\u003c/strong\u003e, or \u003cem\u003esomeone with many interests and creative pursuits\u003c/em\u003e. While the Shakespeare quote, \"\u003cem\u003eJack of all trades, master of none\u003c/em\u003e” is used as a figure of speech to mock multipotentialites, I think a more progressive way of looking at it is this; \u003cem\u003eone becomes a master of none as a corollary to insufficient planning and balance\u003c/em\u003e. \u003cstrong\u003eAs your child’s mentor, I hope to champion their myriad of passions by inspiring the multipotentialite outlook and encouraging balance and time management skills.\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am an \u003cstrong\u003eengineer\u003c/strong\u003e, while I am also a researcher and problem-solver, for people, the environment, and for change. I am a \u003cstrong\u003ewriter\u003c/strong\u003e, while I am also a storyteller, and a published author. I a \u003cstrong\u003eproduct designer\u003c/strong\u003e, while I am also a prototyper, and a web designer. Ai am a r\u003cstrong\u003eunner\u003c/strong\u003e, a \u003cstrong\u003econtortionist\u003c/strong\u003e, a \u003cstrong\u003ecoach\u003c/strong\u003e, a \u003cstrong\u003eweb-designer\u003c/strong\u003e, a \u003cstrong\u003ecrochet enthusiast\u003c/strong\u003e…etc. Overall, I believe that \u003cem\u003elife is too short to dismiss pursuing these passions\u003c/em\u003e!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a \u003cstrong\u003epoet\u003c/strong\u003e, it’s befitting that I present you with \u003cstrong\u003ea few quotes that represent my other values\u003c/strong\u003e:\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e→\u003c/strong\u003e\u0026nbsp;“\u003cem\u003ePatience is the road to wisdom\u003c/em\u003e” (Kao Kalia Yang)\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e→\u003c/strong\u003e\u0026nbsp;“\u003cem\u003eThe worst enemy to creativity is self-doubt\u003c/em\u003e” (Sylvia Plath).\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e→\u003c/strong\u003e\u0026nbsp;“\u003cem\u003eEducation is not preparation for life; education is life itself\u003c/em\u003e” (John Dewey)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I began \u003cstrong\u003ewriting \u003c/strong\u003eand\u003cstrong\u003e digitally designing\u003c/strong\u003e for passion projects, creating \u003cstrong\u003epoetry \u003c/strong\u003eand\u003cstrong\u003e novels\u003c/strong\u003e in-between studying for \u003cstrong\u003eAP courses\u003c/strong\u003e, working as a \u003cstrong\u003ewriting tutor\u003c/strong\u003e through the school’s writing center, and leading my class as the \u003cstrong\u003estudent government Vice President\u003c/strong\u003e. On the weekends, I worked as a \u003cstrong\u003eprivate contortion coach\u003c/strong\u003e, helping 4 school-aged students to develop highly professional flexibility skills, strength, and form. Being a leader, a tutor, and a private coach provided me with \u003cem\u003econfidence in my mentorship abilities\u003c/em\u003e; I am a \u003cstrong\u003eproactive communicator, \u003c/strong\u003ea \u003cstrong\u003epatient teacher, \u003c/strong\u003eand a \u003cstrong\u003esystems-design oriented thinker\u003c/strong\u003e. \u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn university, I continued to teach and write. I worked as \u003cstrong\u003ea student teacher \u003c/strong\u003efor\u003cstrong\u003e \u003c/strong\u003eUSC’s Viterbi Impact Program, helping elementary students with \u003cstrong\u003eSTEM project\u003c/strong\u003e, from biology to computer science. It was in university where I also \u003cstrong\u003epublished\u003c/strong\u003e my first 2 books, \u003cem\u003eMidnight Trepidations\u003c/em\u003e and \u003cem\u003eWest ’Til Morning\u003c/em\u003e.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I wasn’t writing for my passion projects during university, I was researching for, designing for, managing a team for, or writing for \u003cstrong\u003emy start-up project’s commercialization plan\u003c/strong\u003e; a human-centric UI design solution for low-income California residents to manage utility waste (aka\u0026nbsp;\u003cem\u003eEkohome\u003c/em\u003e). I spent \u003cstrong\u003e3 years \u003c/strong\u003eworking as a\u003cstrong\u003e project manager, researcher, technical writer, and UI/UX designer\u003c/strong\u003e for the project.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOverall, I hope to inspire young women in STEM and writing fields to be \u003cem\u003ecreative\u003c/em\u003e, be \u003cem\u003ebrave\u003c/em\u003e, be \u003cem\u003eleaders\u003c/em\u003e, and to never doubt \u003cem\u003ethe benefits of being a complex person\u003c/em\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI can't wait to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"RECH01YVAJglSdpdihyY57500L8CjCUcEzP00jy22Ucm4E","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eAfter 3 years of \u003cem\u003eproject management\u003c/em\u003e, \u003cem\u003eresearch\u003c/em\u003e, \u003cem\u003etechnical writing\u003c/em\u003e, and \u003cem\u003eUI/UX design\u003c/em\u003e for \u003cstrong\u003emy start-up\u003c/strong\u003e, I submitted the \u003cstrong\u003ecommercialization plan\u003c/strong\u003e into the W.V.T Rusch Honors Program, USC’s Min Family Challenge Program competition, and the USC Grand Challenges Scholars Program.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs \u003cstrong\u003efounder\u003c/strong\u003e, I am beyond proud to say that \u003cem\u003emy team thrived in making it to the \u003c/em\u003e\u003cstrong\u003e\u003cem\u003esemi-finals of the M.F.C. competition\u003c/em\u003e\u003c/strong\u003e. Furthermore, the project’s quality and depth also earned me the \u003cstrong\u003eUSC Honors certification\u003c/strong\u003e and a \u003cstrong\u003especial award for USC’s Grand Challenges Scholars Program\u003c/strong\u003e.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"9d83b714-a779-49a6-ae1e-bdd6b67a911d\"}"},{"__ref":"Favorites:{\"uuid\":\"ae8c4af5-6070-4a66-9155-f86a3b03b0cc\"}"},{"__ref":"Favorites:{\"uuid\":\"e0da8bdf-8114-461a-8c19-6ac3bc67f616\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"d5283092-7be6-49e0-baba-d576538d36ff\"}"},{"__ref":"CausesSupported:{\"uuid\":\"f5033005-9c16-4c3d-8d13-fbba50c622fd\"}"}],"major":"Industrial and Systems Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"37213e39-7d73-4f45-aeaf-7e048ce8ddd7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fb8a22b9-1fe9-445d-b3d7-34db892c7dac/-/preview/-/format/jpg/","https://ucarecdn.com/770f17f5-f8a4-4c5a-8f58-d31c6b328ceb/-/preview/-/format/jpg/","https://ucarecdn.com/8a8412c4-6c85-4d7a-b4f6-277ed198eab8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"108842ae-1766-4185-8a31-a9ed4903b5a9\"}"},{"__ref":"Education:{\"uuid\":\"092a143f-56ff-4f14-9410-cb4924b181f7\"}"}],"hiredAt":"2024-08-20T21:44:02.595Z","topics":["Product Design","Web Design","Writing","College Essay Writing","Reading","Physics","6-8 Grade Science","Chemistry","Biology","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","Calculus","Algebra II","Algebra I"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecd
