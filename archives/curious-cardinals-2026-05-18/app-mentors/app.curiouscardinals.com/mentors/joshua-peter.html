age \u0026 Composition. He was also Captain of the Debate Team, Yearbook editor, and stage managed 8 student productions. He is a dedicated and experienced mentor, passionate about helping students achieve their academic goals. Throughout his time at Penn, he demonstrated a strong academic record and took coursework related to the history of capitalism and its interaction with our political system. His history background has honed his ability to quickly absorb and synthesize relevant information, and he is eager to share this knowledge with students because he finds few skills more important than efficient reading and writing.\n\nJosh has gained professional experience in different fields, currently working as an Operations Consultant for non-profit firms. This, along with his previous experiences working in IT and corporate risk management, has helped him to develop a strong analytical and problem-solving skillset. He also has experience in club leadership positions such as an Associate Editor for the Penn Undergraduate Law Journal, VP of External Affairs for Penn Reflect, and a Board Member for the History Undergraduate Advisory Board (HUAB). These experiences helped train his ability to form partnerships, moderate live discussions, and organize large events.\n\nJosh's diverse background and experience make him an excellent mentor for students looking to improve their academic performance and reach their full potential. He is excited to work with students and engage with their academic curiosity. In his free time, Josh is a sports stats nerd who watches his favorite NBA, NFL, and MLB teams as often as he can, and is an avid amateur cook with a propensity for outside-the-box recipes. Whether you need help writing a blog, doing academic/independent research, or want to workshop a business plan, Josh is eager and excited to work with students and help them cultivate their curiosity.\n","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievemen
