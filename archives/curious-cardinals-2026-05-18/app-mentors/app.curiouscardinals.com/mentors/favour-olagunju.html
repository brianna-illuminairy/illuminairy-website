js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4c674845-5aaf-4062-b0b4-796ed2615cfb\"}":{"__typename":"DeepDives","uuid":"4c674845-5aaf-4062-b0b4-796ed2615cfb","content":"\u003cp\u003eI would tell my middle and high school self that you don’t need to have everything figured out to be doing well. It’s okay to be curious, to try different things, and to change direction as you learn more about yourself. Growth isn’t about being perfect or always ahead- it’s about being consistent and willing to ask for help when you need it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d also remind myself that struggling doesn’t mean you’re bad at something; it usually means you’re learning. Some of the moments that felt the hardest academically were actually the ones that helped me build discipline, confidence, and problem-solving skills later on. Instead of avoiding challenges, I’d tell myself to lean into them and trust that understanding comes with time and effort.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFinally, I’d say this: your voice matters. Speak up, ask questions, and don’t shrink yourself to fit into spaces that weren’t built with you in mind. The habits you build, the kindness you show yourself, and the way you treat others will matter far more in the long run than any single grade or test score.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6713c95e-7c3d-4532-9490-b23b18e2b376\"}":{"__typename":"DeepDives","uuid":"6713c95e-7c3d-4532-9490-b23b18e2b376","content":"\u003cp\u003eMentorship matters to me because I’ve seen how powerful it can be when someone truly believes in you and takes the time to guide you. Having a mentor can change how a student sees themselves- not just their grades, but their confidence, their mindset, and what they think is possible for their future.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI care deeply about mentorship because a mentor can provide clarity, encouragement, and consistency in moments when students are doubting themselves. Sometimes all it takes is one person explaining something differently, asking the right questions, or reminding a student that they are capable.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor me, mentorship is about more than academics. It’s about helping students build confidence, learn how to problem-solve, and develop skills they’ll carry with them long after a class ends. I want students to feel seen, heard, and supported- not judged or rushed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeing a mentor allows me to be the kind of support I once needed: patient, encouraging, and invested in both growth and well-being. That’s why mentorship matters so much to me-it creates lasting impact that extends far beyond the classroom.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"aeb97474-5ec8-4846-ad1e-4ef45f11de32\"}":{"__typename":"DeepDives","uuid":"aeb97474-5ec8-4846-ad1e-4ef45f11de32","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is building technology that meaningfully improves people’s lives, especially in healthcare and underserved communities. I want to create tools that expand access to care, improve outcomes, and make systems work better for people who are often overlooked. Growing up with strong ties to Nigeria has shaped how I think about impact and access, and it motivates me to build solutions that are practical, scalable, and globally relevant. If I can use technology to make healthcare more accessible and improve quality of life for people both in the U.S. and back home, I’ll feel that I’ve made a real difference.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"5b454b48-ddae-489f-a404-7ff3c337f876\"}":{"__typename":"DeepDives","uuid":"5b454b48-ddae-489f-a404-7ff3c337f876","content":"\u003cp\u003eAs a high school student at Choate Rosemary Hall, I was highly involved across academics, leadership, and community service. I participated in an Advanced Robotics Concentration Team within the Engineering program while also taking on leadership roles that allowed me to support and engage with the broader school community, including serving as a Dorm Prefect and as a member of the Student Planning and Engagement Committee (SCOPE).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCommunity service and advocacy were central to my experience. I served as President of Girl Up and President of Love Your Locs, and as Vice President of the Africana Club, where I focused on empowerment, identity, and community-building initiatives. I was also actively involved in the Wellness Committee, the Bystander Education Program, and as a Pathways Mentor for Students of Color, supporting peer development and inclusion across campus.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to leadership and service, I stayed engaged in academic and creative spaces. I worked as a Writing Tutor at the School’s Writing Center, participated in the Melatones A Cappella Group, served as a Boarpen School Spirit Leader, and was an active member of the Black Student Alliance, Choate Women in Business, and the Economics Club.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, I was a student who balanced strong academic interests with deep involvement in leadership, service, and community. I enjoyed staying busy, giving back, and creating spaces where others felt supported, values that continue to guide how I approach mentorship today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"703af1b7-12f2-43b5-a792-010cc27d9b1f\"}":{"__typename":"Education","uuid":"703af1b7-12f2-43b5-a792-010cc27d9b1f","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Computer Science","degree":null},"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}":{"__typename":"School","uuid":"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5","name":"Choate Rosemary Hall","city":"Wallingford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06492"},"Education:{\"uuid\":\"ad2f1614-143d-4233-a8b3-6f847085ac93\"}":{"__typename":"Education","uuid":"ad2f1614-143d-4233-a8b3-6f847085ac93","school":{"__ref":"School:{\"uuid\":\"4b71ca43-152a-4d73-9fa0-63d5dfacf0b5\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"47049abf-cc56-4631-b44e-05cefab5de07\"}":{"__typename":"MentorPublicProfile","uuid":"47049abf-cc56-4631-b44e-05cefab5de07","displayName":"Favour  O.","slug":"favour-olagunju","biography":"\u003cp\u003eHi! I'm \u003cstrong\u003eFavour Olagunju\u003c/strong\u003e, and I'm a freshman at Columbia University in New York City, studying Computer Science with a minor in Economics. Before college, I attended Choate Rosemary Hall, a private boarding school in Wallingford, Connecticut. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m someone who genuinely enjoys helping students grow- academically and personally. I love working with students across a wide range of subjects, including \u003cstrong\u003eK–5 Math, Pre-Algebra, Algebra I \u0026amp; II, Geometry, Precalculus/Trigonometry, Calculus, middle-school science, Chemistry, Biology, Physics, Writing, Spanish, Economics, and Computer Science.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I tutor, my goal is never just to get through homework. I focus on helping students actually understand what they’re learning and feel\u003cstrong\u003e confident\u003c/strong\u003e explaining it themselves. In math and science, that means breaking things down step by step and showing students how to think through problems instead of memorizing formulas. In writing and language-based subjects, I help students organize their ideas, strengthen their voice, and communicate clearly.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also care a lot about the skills that don’t always get taught in school- things like organization, time management, study habits, and confidence. Many students are capable but feel overwhelmed or stuck, and a little structure and encouragement can make a huge difference. I enjoy helping students build systems that work for \u003cem\u003ethem\u003c/em\u003e and watching their confidence grow over time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I’ve been fortunate to receive recognition for both achievement and community engagement. I’m a Davis Scholar at Columbia Engineering through the Columbia University Undergraduate Scholars Program and a Dean’s List recipient at Columbia University. Prior to college, I was named to the Dean’s List at Choate Rosemary Hall every term from Fall 2021 through Spring 2025, maintaining a 4.0 GPA and earning a 1500 SAT score. I also received the John Kirby Simon ’79 Award for Excellence in Community Service, the College Board National African American Recognition Program honor, and the Ray Brown and Marjorie Brampton Harvey Prize for leadership and positive contributions to campus life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I mentor students interested in technology, business, and entrepreneurship, including coding, web design, robotics, CAD, and introductory machine learning and AI. I love helping students explore these interests in a way that feels exciting and accessible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbove all, I aim to create a\u003cstrong\u003e supportive space\u003c/strong\u003e where students feel comfortable asking questions, making mistakes, and pushing themselves. I want students to leave each session feeling more confident, capable, and \u003cstrong\u003emotivated \u003c/strong\u003ethan when they started. \u003c/p\u003e","teachingVideoPlaybackId":"lqojYWNCeMvaZzIwltKkDpJJYjeGiIsR5NVY7JUX4ts","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is co-founding Reach for the Stars, a global, student-led nonprofit that provided free virtual academic support to over 350 students across multiple countries during the COVID-19 pandemic. I helped build and launch the organization’s website and led external affairs, coordinating outreach, partnerships, and programs while mobilizing 75+ student volunteers to tutor students worldwide. Seeing students gain confidence and access to support during such a difficult time made the impact of this work especially meaningful to me.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4c674845-5aaf-4062-b0b4-796ed2615cfb\"}"},{"__ref":"DeepDives:{\"uuid\":\"6713c95e-7c3d-4532-9490-b23b18e2b376\"}"},{"__ref":"DeepDives:{\"uuid\":\"aeb97474-5ec8-4846-ad1e-4ef45f11de32\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b454b48-ddae-489f-a404-7ff3c337f876\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c7d57602-fd06-47e3-9deb-98ab0dd234cf/-/preview/-/format/jpg/","https://ucarecdn.com/6360239e-7b6a-448f-a1a4-a0b5eb8ed2ac/-/preview/-/format/jpg/","https://ucarecdn.com/8f766878-b643-483d-8da2-74ae1a2cbd14/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"703af1b7-12f2-43b5-a792-010cc27d9b1f\"}"},{"__ref":"Education:{\"uuid\":\"ad2f1614-143d-4233-a8b3-6f847085ac93\"}"}],"hiredAt":"2026-02-05T04:00:37.003Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Chemistry","Biology","6-8 Grade Science","Physics","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Economics","Computer Science","Business / Entrepreneurship","Coding / Programming","Web Design","Robotics / Electronics / CAD","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"favour-olagunju\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"47049abf-cc56-4631-b44e-05cefab5de07\"}"}}},"_sentryTraceData":"4a7d5a2c4182441abab880992e54a74b-864aee28564f8980-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4a7d5a2c4182441aba
