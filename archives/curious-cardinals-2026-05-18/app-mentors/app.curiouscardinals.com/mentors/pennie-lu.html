xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"9bf4f55d-6687-4ced-9b31-add3a1956479\"}":{"__typename":"CausesSupported","uuid":"9bf4f55d-6687-4ced-9b31-add3a1956479","name":"American Red Cross","description":"\u003cp\u003eAs a blood donor, I believe their mission is vital and reflects humanitarian aid\u003c/p\u003e","photoUrl":"https://ucarecdn.com/40b854eb-6212-4bd0-bb4b-481b843ecc04/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1f9811ac-8814-4eb8-b7da-76c0bd09f6b8\"}":{"__typename":"DeepDives","uuid":"1f9811ac-8814-4eb8-b7da-76c0bd09f6b8","content":"\u003cp\u003eStart building good habits early. It is that serious, and I wish I had gotten into a rhythm of waking up early and going to bed earlier, separating my work and rest spaces, and taking full advantage of my teachers' after school help hours. Also, setting aside time to do things that make me happy without feeling guilty about \"wasted\" time. At the end of the day, if it added value to my life and motivated me to start and end each day strong, then it was worthwhile. In that same sense, if I could redo it all over again, I would explore more options and take the time to consider every possible career path I could take. I love science and medicine, but I can't help but wonder what other fields and fascinating jobs I'm missing out on.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ff6174af-1205-4edc-a009-5587bbc11647\"}":{"__typename":"DeepDives","uuid":"ff6174af-1205-4edc-a009-5587bbc11647","content":"\u003cp\u003eI originally wanted to apply with Neuroscience, but Cornell only offers a Neuro minor. When I did some more research into Cognitive Science, I found that it encompasses the intersectionality of so many fields that are relevant in modern life. From computer science to psychology, linguistics to philosophy, it honestly hit all of the check marks I wanted to learn about while in college. One of the things I promised my mom was that I would branch out and try exploring as many different fields as I could during my time in college. As a pre-med student, I knew I would be required to take biology, chemistry, etc. classes, so I wanted to pick a major that would offer new perspectives and insights to build my framework of \"Why Medicine.\" \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"7acd2302-2c3c-4ae1-a27b-e411a74984c8\"}":{"__typename":"DeepDives","uuid":"7acd2302-2c3c-4ae1-a27b-e411a74984c8","content":"\u003cp\u003eOne time in elementary school (the fact that it still sticks with me to this day is testament enough to how strongly it affected me) I dreamed that I was in a zombie apocalypse-type world. For some reason, me and my friends (and some random kid from my Chinese school) were the only people who hadn't been affected and we were running away from all these people who were trying to stab us with needles. We were probably running for most of the dream and I remember trying to climb up the escalator, except I couldn't run and my legs were glued to the slowly moving steps as the zombies closed in around us. When my alarm went off, one of the zombies had just gotten to me and had jabbed a needle into my leg. I have no idea why the needles were necessary to \"change\" people but it definitely instilled a little fear of needles in me. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"66034136-4f79-404e-a522-554b7d9590ad\"}":{"__typename":"DeepDives","uuid":"66034136-4f79-404e-a522-554b7d9590ad","content":"\u003cp\u003eIt wasn't until sophomore year summer that I started volunteering at a local hospital, and that solidified my interest to pursue medicine. \u003c/p\u003e\u003cp\u003eJunior year summer, I attended an all-expenses paid summer program called the \u003cstrong\u003eNew Jersey Scholars Program\u003c/strong\u003e (NJSP) at the Lawrenceville School where around 39 students would get the opportunity to work with 4 professors/teachers in the fields of sociology, environment/sustainability, art, and literature to discuss borders, both literal and metaphorical. There was this one trip we took to Philadelphia where we visited the \u003cstrong\u003eMütter Museum\u003c/strong\u003e and it was like a collection of weird and absolutely riveting medical discoveries. I love the friends I made during this program, and we even went on a ski trip together this past winter break! We went up to Killington, Vermont and spent the day skiing before going back to the house and cooking dinner together. \u003c/p\u003e\u003cp\u003eThe summer before college, I mostly worked at my job at a shop in Princeton so I would have some spending money for food and anything I would want to do while at college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"8be68124-4f40-4609-8a74-2ef38c893a02\"}":{"__typename":"School","uuid":"8be68124-4f40-4609-8a74-2ef38c893a02","name":"Montgomery High School","city":"Montgomery","type":"HIGH","state":"New Jersey","country":"United States","zip":"08558"},"Education:{\"uuid\":\"554608c5-26fe-4569-a87e-6e63e1fb560b\"}":{"__typename":"Education","uuid":"554608c5-26fe-4569-a87e-6e63e1fb560b","school":{"__ref":"School:{\"uuid\":\"8be68124-4f40-4609-8a74-2ef38c893a02\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"c07aac0d-b80d-4679-af3c-f3f04cdcb883\"}":{"__typename":"Education","uuid":"c07aac0d-b80d-4679-af3c-f3f04cdcb883","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Cognitive Science and Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"17028c43-77d4-4703-9413-f66311708fe4\"}":{"__typename":"MentorPublicProfile","uuid":"17028c43-77d4-4703-9413-f66311708fe4","displayName":"Pennie L.","slug":"pennie-lu","biography":"\u003cp\u003eHey! My name is Pennie and I’m a freshman at Cornell University majoring in Cognitive Science and Sociology, with a minor in Business. I’m currently on the pre-med track as well!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI grew up in Minnesota but moved in the middle of 6th grade to New Jersey. This change definitely shaped me into the person I am today, as it helped me step out of my comfort zone and find new friends and communities. I never thought I would call NJ home, but I can’t imagine living anywhere else now.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne of my biggest accomplishments was attending the New Jersey Scholars Program, and the opportunities that have opened up since are amazing. I got to present my work at the AERA conference in Philadelphia last summer and afterwards, my mentor treated us to breakfast at one of his favorite restaurants!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI would say I’m kind of a daredevil and I love anything to do with adrenaline rushes, from roller coasters to skiing down black diamonds! This past summer, we took a family vacation to Yellowstone and while at the Arches National Park, I got to go skydiving! It was seriously the highlight of my life. Aside from that, I love settling down with a long book or movie. My current favorites are \u003cem\u003eAnd Then There Were None\u003c/em\u003e by Agatha Christie and Ocean’s 8. There’s a good chance I’ve read any book your child is interested in (in elementary school I was at the library every week and checking out 50+ books). Additionally, I love playing tennis and figure skating. At Cornell, I’m on the figure skating and synchro team! We have a show every semester and I’m looking forward to making many more happy memories.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eYou wouldn’t know it, but I can be a bit of a musical buff. I love listening to the Hamilton, Heathers, and Epic soundtracks! In my free time, I also watch a lot of YouTube gaming videos by Markiplier and Ludwig. I’ll usually put on one of their videos in the background while I do chores or work on easy homework so I can take brain breaks in between difficult assignments.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I’m committed to finding the best path forward for your child and becoming a pillar of support for their growth. I truly believe that we all make progress at different rates, and the best part of my job is being able to draw out the uniqueness of each mentee I work with. Personally, my favorite memory was when I was able to help a 3rd grader memorize her times table. It had eluded her grasp for several months before we broke through and finally got it down pat!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhew! Thanks for reading through and I look forward to getting to know you and your kid!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"LXs00dPcxbpOWRUrcpDSYM01zcyv3aj9CecsO01BGO7bXk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"9bf4f55d-6687-4ced-9b31-add3a1956479\"}"}],"major":"Cognitive Science and Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1f9811ac-8814-4eb8-b7da-76c0bd09f6b8\"}"},{"__ref":"DeepDives:{\"uuid\":\"ff6174af-1205-4edc-a009-5587bbc11647\"}"},{"__ref":"DeepDives:{\"uuid\":\"7acd2302-2c3c-4ae1-a27b-e411a74984c8\"}"},{"__ref":"DeepDives:{\"uuid\":\"66034136-4f79-404e-a522-554b7d9590ad\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a9299ccc-4a00-42fd-8234-b333a761c7fe/-/preview/-/format/jpg/","https://ucarecdn.com/d52e0e45-c5ac-477f-9be1-89c8b996c86c/-/preview/-/format/jpg/","https://ucarecdn.com/2fa4ada3-b22b-4ba6-9831-cbd045abafb5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"554608c5-26fe-4569-a87e-6e63e1fb560b\"}"},{"__ref":"Education:{\"uuid\":\"c07aac0d-b80d-4679-af3c-f3f04cdcb883\"}"}],"hiredAt":"2025-01-30T18:17:53.245Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Statistics","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Mandarin Chinese","Academic Coaching","Executive Function","Economics","Reading"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisi
