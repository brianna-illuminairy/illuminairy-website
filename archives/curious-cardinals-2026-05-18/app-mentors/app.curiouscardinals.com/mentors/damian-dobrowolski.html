tion:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b5050ac8-d810-4cad-9d4a-80b6f19e56a3\"}":{"__typename":"DeepDives","uuid":"b5050ac8-d810-4cad-9d4a-80b6f19e56a3","content":"\u003cp\u003eMy dream job is helping people \u0026amp; making the world a better place together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"d5e9bc01-ff87-4713-89be-e27fb45167f5\"}":{"__typename":"DeepDives","uuid":"d5e9bc01-ff87-4713-89be-e27fb45167f5","content":"\u003cp\u003eOnce I was a bird and I wanted to help the animals have their voices heard by the human world so I flew over to the Capitol and sang a beautiful song and they made me the President of the United States\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"0317d3f6-2d9b-41d0-ae28-b5892108123a\"}":{"__typename":"School","uuid":"0317d3f6-2d9b-41d0-ae28-b5892108123a","name":"Palisades Charter High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90272"},"Education:{\"uuid\":\"e73be78e-80f2-4032-8605-3da402e590ce\"}":{"__typename":"Education","uuid":"e73be78e-80f2-4032-8605-3da402e590ce","school":{"__ref":"School:{\"uuid\":\"0317d3f6-2d9b-41d0-ae28-b5892108123a\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"03d390db-141f-40b2-9f25-347f58db2971\"}":{"__typename":"School","uuid":"03d390db-141f-40b2-9f25-347f58db2971","name":"Northwestern University (+ Bard College first 2 years)","city":"Evanston","type":"COLLEGE","state":"IL","country":"United States","zip":"60201"},"Education:{\"uuid\":\"b245a2d5-b3d0-4621-b61d-dde26dafac15\"}":{"__typename":"Education","uuid":"b245a2d5-b3d0-4621-b61d-dde26dafac15","school":{"__ref":"School:{\"uuid\":\"03d390db-141f-40b2-9f25-347f58db2971\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science \u0026 Philosophy","degree":null},"MentorPublicProfile:{\"uuid\":\"09f9150c-23f2-477d-b5b9-34532f706c25\"}":{"__typename":"MentorPublicProfile","uuid":"09f9150c-23f2-477d-b5b9-34532f706c25","displayName":"Damian D.","slug":"damian-dobrowolski","biography":"\u003cp\u003eHi! :) I’m Damian, a 4th-year undergraduate at Northwestern studying Computer Science \u0026amp; Philosophy, \u0026amp; I \u003cstrong\u003einspire students\u003c/strong\u003e to become \u003cstrong\u003epassionate about learning\u003c/strong\u003e \u0026amp; find ways to \u003cstrong\u003emanage\u003c/strong\u003e their \u003cstrong\u003eworkload\u003c/strong\u003e, \u003cstrong\u003ecalendar\u003c/strong\u003e, \u0026amp; \u003cstrong\u003estress levels\u003c/strong\u003e! I was born in Los Angeles but my parents are from Germany \u0026amp; Poland—I speak both languages \u0026amp; visit my family there every year.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eA bit about me\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eNot too long ago, I was a shy, indecisive, \u003cem\u003eprocrastinating\u003c/em\u003e high-school student with a love for all subjects but \u003cem\u003eno idea\u003c/em\u003e what I wanted to do with my life.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince then, I’ve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuilt \u0026amp; designed\u003c/strong\u003e an \u003cstrong\u003eartistic, real-time, physics-model wind animation \u003c/strong\u003ethat displays 10,000 particles blowing across the screen based on live conditions \u0026amp; lists weather data for anyone in the computer lab where it runs 24/7 to see, all powered by a Raspberry Pi 5 (a mini-computer the size of a credit card!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWritten a senior thesis \u003c/strong\u003eon\u003cstrong\u003e applied machine learning \u003c/strong\u003ein\u003cstrong\u003e environmental science\u003c/strong\u003e on creating a model to predict freight-truck idling to improve emissions inventories. My project was accepted for presentation at the AGU conference \u0026amp; I was awarded a $5000 grant for summer research.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePresided over Northwestern's Zen Society\u003c/strong\u003e: guiding a weekly 15-person meditation group to teach mindfulness practices for de-stressing, improving academic performance, \u0026amp; loving the moment\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eWritten\u003c/strong\u003e a \u003cstrong\u003e25-page political science research paper\u003c/strong\u003e on the backsliding of democracy in Poland during the previous administration\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked\u003cstrong\u003e \u003c/strong\u003eas a \u003cstrong\u003eSoftware Developer\u003c/strong\u003e, \u003cstrong\u003eIT Specialist\u003c/strong\u003e, \u003cstrong\u003eProduct/UX Researcher\u003c/strong\u003e, \u003cstrong\u003eJournalist\u003c/strong\u003e, \u003cstrong\u003eAI Model Validator\u003c/strong\u003e, \u0026amp; more\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eApplied\u003c/strong\u003e to \u003cstrong\u003e60+\u003c/strong\u003e \u003cstrong\u003euniversities\u003c/strong\u003e (incl. for my 1st college \u0026amp; then to transfer)\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences taught me not only how to find my path, achieve things in life, \u0026amp; let go of the anxieties that hold us back, but also how to share these gifts that open doors to academic/professional prowess, physical/mental/emotional aptitude, \u0026amp; a fulfilling life.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eWhat I specialize in\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI mentor students who aspire to:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eConquer academics \u0026amp; goals\u003c/strong\u003e: by taking control of their success through planned, actionable steps that promote discipline, empowerment, \u0026amp; hard work\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOvercome stress/anxiety, procrastination, \u0026amp; insecurity\u003c/strong\u003e:\u003cstrong\u003e \u003c/strong\u003eby accomplishing step-by-step tasks to build confidence \u0026amp; create momentum, planning their schedules/workloads effectively, leading them to bring out their own abilities \u0026amp; find out for themselves that they are capable of so much more than they know\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eIgnite a passion\u003c/strong\u003e: from a fun side project to loving that subject in school that was never fun, I strive to build up my students' love for learning \u0026amp; exploration\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eWhy I’m qualified to help you\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAssistant Teacher\u003c/strong\u003e (3 yrs) in a German School: I volunteered in a 3rd-grade classroom to help students w/ homework, lead lessons, \u0026amp; run activities\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBooks\u0026amp;Breakfast Mentor/Tutor \u003c/strong\u003e(1 yr): I volunteer in a program that provides free breakfast + academic, social, \u0026amp; emotional support to underprivileged students before school\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMindful meditation guide\u003c/strong\u003e (2 yrs) \u003cstrong\u003efor stressed-out students\u003c/strong\u003e at Northwestern: leading people to find their inner peace \u0026amp; embrace the way things are right now \u0026lt;3\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eI used to struggle\u003c/strong\u003e greatly w/ procrastination, focus, \u0026amp; motivation: now I consider \u003cstrong\u003ediscipline\u003c/strong\u003e, \u003cstrong\u003eorganization\u003c/strong\u003e, \u0026amp; \u003cstrong\u003edrive\u003c/strong\u003e to be my greatest strengths\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eA typical session with me might involve:\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eOrganization \u003c/strong\u003e\u0026amp;\u003cstrong\u003e time management\u003c/strong\u003e for homework tasks to plan a work agenda \u0026amp; use strategies to stick to it \u0026amp; get it done!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCreating a project plan\u003c/strong\u003e for an academic or creative pursuit that lights you up, but you don't know where to even start\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMindfulness practice \u003c/strong\u003efor \u003cstrong\u003estress reduction\u003c/strong\u003e: using scientific techniques to improve memory, cognition, \u0026amp; performance both academically \u0026amp; in day-to-day life\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eGeneral tutoring \u003c/strong\u003e\u0026amp; \u003cstrong\u003eacademic help\u003c/strong\u003e for a range of subjects from math to English\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eApplication support\u003c/strong\u003e (planning, essay writing, funding help) for anything from internships to grants to college admissions\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003e\u003cu\u003eOutside of school \u0026amp; work...\u003c/u\u003e\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI’m a big fan of \u003cstrong\u003ereading books \u003c/strong\u003e(favs are sci-fi \u0026amp; classics), \u003cstrong\u003echoral singing \u003c/strong\u003e(I'll sing happy birthday to you like they did it in the 1600s), \u003cstrong\u003ehiking\u003c/strong\u003e, \u003cstrong\u003eyoga\u003c/strong\u003e, \u003cstrong\u003eweightlifting \u003c/strong\u003e(I'll be your virtual gym bro), \u003cstrong\u003eplaying piano\u003c/strong\u003e \u003cstrong\u003e\u0026amp; trumpet\u003c/strong\u003e, \u0026amp; \u003cstrong\u003eeverything art \u003c/strong\u003e(film, museums, theater, doing photography, writing poetry, music).\u003c/p\u003e","teachingVideoPlaybackId":"LsJj60016mHN00kLjXajjYzDiyaxYLaWw4aRGQQA3pZWI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I did that I am very proud of is going off my phone for two years during the pandemic. No Snapchat, no Instagram, no TikTok, no texting. Instead, I went on a walk every day, lifted weights, read for an hour before bed, \u0026amp; stared at the sky \u0026amp; the trees around me...\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIt changed my life.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0c92fe05-5d5c-4c39-89e7-72cf601e9bac\"}"},{"__ref":"Favorites:{\"uuid\":\"9ec037d2-a7ac-4a2a-879c-bb9684eec28a\"}"},{"__ref":"Favorites:{\"uui
