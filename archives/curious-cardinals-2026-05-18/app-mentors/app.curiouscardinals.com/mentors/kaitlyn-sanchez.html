xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"ed2fa909-c08c-4841-b205-d1190d546f07\"}":{"__typename":"CausesSupported","uuid":"ed2fa909-c08c-4841-b205-d1190d546f07","name":"Hispanic Scholarship Fund","description":"\u003cp\u003eServed as a mentor to rising high school seniors and volunteer at a College Camp\u003c/p\u003e","photoUrl":"https://ucarecdn.com/7f191db9-6bc8-45a0-8058-da332c388d28/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"41aae499-32d4-4468-ac8c-60116c181611\"}":{"__typename":"DeepDives","uuid":"41aae499-32d4-4468-ac8c-60116c181611","content":"\u003cp\u003eI would tell myself to always do what you love. It will take you a lot further than you realize.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"17465119-8208-47db-93a7-6ec488131b57\"}":{"__typename":"DeepDives","uuid":"17465119-8208-47db-93a7-6ec488131b57","content":"\u003cp\u003eIn high school, one of my favorite experiences was competing in the California Forestry Challenge each year. For a weekend, we would learn all about forestry, ecology, wildfires, etc. out in the mountains. We would then complete tests as a team and create a presentation with recommendations for local project sites. This experience inspired me to pursue Earth Systems and learn more about our environment. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"32dd42f6-ba34-4740-bab0-9d2d8e4f233c\"}":{"__typename":"DeepDives","uuid":"32dd42f6-ba34-4740-bab0-9d2d8e4f233c","content":"\u003cp\u003eGrowing up, I watched my mom teach students of all ages which instilled in me the value of education and the value of a good mentor. I have been blessed to have a few mentors throughout my academic journey and I am excited to pay it forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"595b9da7-dc23-490a-8180-ebc4fcbf87af\"}":{"__typename":"DeepDives","uuid":"595b9da7-dc23-490a-8180-ebc4fcbf87af","content":"\u003cp\u003eIn high school, I spent my summers playing on my school's volleyball and basketball teams, reading a book by the pool, or hanging out with my friends and family.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"c353259d-224c-45ad-a58b-2fd0ad50e87a\"}":{"__typename":"School","uuid":"c353259d-224c-45ad-a58b-2fd0ad50e87a","name":"John W. North High School","city":"Riverside","type":"HIGH","state":"California","country":"United States","zip":"92507"},"Education:{\"uuid\":\"1e5bc280-0b1a-4fe8-b129-814d6caa1b33\"}":{"__typename":"Education","uuid":"1e5bc280-0b1a-4fe8-b129-814d6caa1b33","school":{"__ref":"School:{\"uuid\":\"c353259d-224c-45ad-a58b-2fd0ad50e87a\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a6f51bec-7e0c-4d62-864c-88315629d722\"}":{"__typename":"Education","uuid":"a6f51bec-7e0c-4d62-864c-88315629d722","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Earth Systems, Minor in Education","degree":null},"MentorPublicProfile:{\"uuid\":\"be60e299-4fdf-42ac-8c7f-0e5fc0e32eba\"}":{"__typename":"MentorPublicProfile","uuid":"be60e299-4fdf-42ac-8c7f-0e5fc0e32eba","displayName":"Kaitlyn S.","slug":"kaitlyn-sanchez","biography":"\u003cp\u003eHey! I'm Kaitlyn, and I recently graduated from Stanford with a B.S. in Earth Systems, a minor in Education, and a Master's in Sustainability Science and Practice. If it has anything to do with the environment, climate, or sustainability, I'm obsessed with it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic journey has taken me far beyond the classroom. This past summer, I interned in Auckland, New Zealand, where I got hands-on experience tackling real-world sustainability challenges down under. I researched global approaches to economic development through a climate lens to provide insights for Auckland's future, alongside investigating global best practices for creating a positive energy district in the region. I also attended classes at the University of Auckland, where I explored regional sustainability challenges and deepened my understanding of Māori history and culture.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBack home in California, my research has focused on some of the most pressing issues facing the state. I have conducted research on wildfire insurance exploring how climate risk is reshaping financial systems, and on electric vehicle charging infrastructure, examining how California can build equitable and accessible clean energy networks for the future. These projects reflect my belief that solving the climate crisis requires connecting science, policy, and real communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, I explored the intersection of science, policy, and human behavior, because tackling the climate crisis isn't just about knowing the science, it's about understanding people. That's where my education minor truly comes in. One of my favorite projects was collaborating with the nursery school on campus to write a children's book about sustainable habits for my senior capstone, bringing environmental education to the youngest learners.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passion for working with students runs deep. I've worked hands-on with children at a nursery school, tutored Paris elementary school students in English, and mentored high school students through the college application process, helping them find and tell their own unique stories. I love working with students of all ages and backgrounds.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether you're curious about climate change, ecosystems, environmental policy, sustainability, or navigating your path to higher education, I would love to be your guide. I believe every student has the potential to become the next generation of environmental leaders, and I can't wait to help you get there!\u003c/p\u003e","teachingVideoPlaybackId":"k9DDnqjPd100Qj5W004nubGd1sV3DYlt6amb02s9QP9gRA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my proudest achievements is funding my entire undergraduate and graduate education as a low-income student. \u003c/p\u003e","favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"ed2fa909-c08c-4841-b205-d1190d546f07\"}"}],"major":"Earth Systems, Minor in Education","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"41aae4
