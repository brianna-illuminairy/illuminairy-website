xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7c9168d7-8be2-47e4-bfef-6b8e26d345de\"}":{"__typename":"DeepDives","uuid":"7c9168d7-8be2-47e4-bfef-6b8e26d345de","content":"\u003cp\u003eBe active in your curiosity! I wish I spent more time actively researching what I was interested in, so I would tell myself to really leverage the internet to find out more about what I like.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a18ca1ea-abec-40a7-9f0f-3c1269f118f5\"}":{"__typename":"DeepDives","uuid":"a18ca1ea-abec-40a7-9f0f-3c1269f118f5","content":"\u003cp\u003eI chose mechanical engineering as my main major because I enjoy solving problems and I like how broad this field can be. I was conflicted for the longest time as to what major I should choose, but I'm very glad that I chose mechanical engineering as it gave me the ability to explore many other topics within the field, like medical devices. My interests in medicine and biology are why I chose to pick up an additional major in biomedical engineering. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6c3565b1-cc8f-46c2-8086-b64370ca700d\"}":{"__typename":"DeepDives","uuid":"6c3565b1-cc8f-46c2-8086-b64370ca700d","content":"\u003cp\u003eMentorship is important to me because I think there are some things that are nearly impossible to learn by yourself, and this is especially true depending on your background. I've benefited so much from my mentors and they've changed the trajectory of my life, so I hope to have the same effect on others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"39c13cc5-3e47-4b70-b624-5353a160a770\"}":{"__typename":"DeepDives","uuid":"39c13cc5-3e47-4b70-b624-5353a160a770","content":"\u003cp\u003eIn high school, I was pretty shy and reserved. I only really outgrew my awkwardness towards the end of junior year. Finding like minded peers and really diving into my hobbies at the time (playing saxophone) really helped me grow into the person I am now.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"3a6cd579-f73c-4dbf-81b9-3e9b0118f19f\"}":{"__typename":"School","uuid":"3a6cd579-f73c-4dbf-81b9-3e9b0118f19f","name":"East Pennsboro Area High School","city":"Enola","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"17025"},"Education:{\"uuid\":\"f82d6681-e45e-4c20-a597-65ebe6191c9a\"}":{"__typename":"Education","uuid":"f82d6681-e45e-4c20-a597-65ebe6191c9a","school":{"__ref":"School:{\"uuid\":\"3a6cd579-f73c-4dbf-81b9-3e9b0118f19f\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}":{"__typename":"School","uuid":"dad8bc54-012c-4228-a2da-00f9cb6cd3c1","name":"Carnegie Mellon University","city":"Pittsburgh","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"15213"},"Education:{\"uuid\":\"8718eb61-25ba-4a89-8cf8-5e1463e77ba8\"}":{"__typename":"Education","uuid":"8718eb61-25ba-4a89-8cf8-5e1463e77ba8","school":{"__ref":"School:{\"uuid\":\"dad8bc54-012c-4228-a2da-00f9cb6cd3c1\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Mechanical Engineering, Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"1e0ee74f-6269-4ece-8078-775ffa003cf3\"}":{"__typename":"MentorPublicProfile","uuid":"1e0ee74f-6269-4ece-8078-775ffa003cf3","displayName":"Lameck B.","slug":"lameck-beni","biography":"\u003cp\u003eHello! My name is Lameck Beni and I'm a current PhD student in Bioengineering at the University of Pennsylvania. For my bachelors degree, I studied mechanical and biomedical engineering at Carnegie Mellon University and also earned an advanced masters degree in mechanical engineering with a concentration in medical devices as a joint bachelors-masters degree. I now use this training to research new medical devices for a variety of uses from vaccine development to disease diagnosis.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m passionate about making improvements to the healthcare system that’s accessible by all instead of only those who can afford it. That’s why the main focus of my PhD research will be in microfluidics, which is the manipulation of very small volumes of fluid, which drives down the cost of experiments and therapies, ultimately making healthcare more accessible.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore attending UPenn, I spent 3 years tutoring college students at CMU's student academic success center in pretty much every required STEM course for mechanical engineering students from Physics I and Calculus up to Heat Transfer and Fluid Dynamics. Throughout these years, I tutored for an average of 8 hours each week and also led supplemental instruction sessions to help larger groups review class topics. I think my strength lies in adjusting my mentorship methods to my specific students, best catering to their needs and prioritizing their growth. I also like to focus on more general skills that are useful for more than just the classroom, like time management and effective study techniques. Because of these efforts and some of my other community engagement activities, I won the Overall Excellence in Mechanical Engineering award at my graduation along with an award for maintaining a perfect GPA throughout college.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm excited to continue mentoring students in these areas and also pulling from my experience completing many engineering projects to guide students in their passion projects. I’ve done a range of projects throughout my time in college, from robotics and mechatronics to design and fabrication. Even my current research work uses my experience in mechatronics to improve a vaccine production robot. I’ve also done several medical device projects and have spent many years researching similar topics. I’m also looking forward to working with high school students because I take a lot of pride in my ability to explain complex topics in a way that is easier to understand.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I like to bake desserts, watch movies, and go on hikes. Banana bread is my go-to baked good and my favorite movie has to be The Departed.\u0026nbsp;I'm also pretty big into video games.\u003c/p\u003e","teachingVideoPlaybackId":"fP01jVbD9oq8DhvadELkafaM1Tbz3CrEVQXbV9ewq2xc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering, Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7c9168d7-8be2-47e4-bfef-6b8e26d345de\"}"},{"__ref":"DeepDives:{\"uuid\":\"a18ca1ea-abec-40a7-9f0f-3c1269f118f5\"}"},{"__ref":"DeepDives:{\"uuid\":\"6c3565b1-cc8f-46c2-8086-b64370ca700d\"}"},{"__ref":"DeepDives:{\"uuid\":\"39c13cc5-3e47-4b70-b624-5353a160a770\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c5838c73-6e7e-4318-8f8e-b0382a81d1dc/-/preview/-/format/jpg/","https://ucarecdn.com/3b6ad1fe-f5cf-465e-8f56-1292090040b3/-/preview/-/format/jpg/","https://ucarecdn.com/8387e38a-55cf-43cb-8bfb-c6f15de66428/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"f82d6681-e45e-4c20-a597-65ebe6191c9a\"}"},{"__ref":"Education:{\"uuid\":\"8718eb61-25ba-4a89-8cf8-5e1463e77ba8\"}"}],"hiredAt":"2025-09-21T22:53:18.374Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Pre-Algebra","6-8 Grade Science","Chemistry","Biology","Physics","Academic Coaching","Executive Function","College Essay Writing","Medicine / Health","Robotics / Electronics / CAD","STEM Project"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/754f9a3e-f5c4-4576-8cdd-2cdf8c2e4e63/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lameck-beni\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1e0ee74f-6269-4ece-8078-775ffa003cf3\"}"}}},"_sentryTraceData":"5da77c3f32194206b88b2cd4f24a3a36-b9f360fa04e14bbb-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=5da77c3f32194206b88b2cd4f24a3a36,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"lameck-beni"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":
