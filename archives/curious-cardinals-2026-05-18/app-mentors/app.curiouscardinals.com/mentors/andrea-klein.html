xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f9dfdfbb-f337-4f78-a7ed-a72c437c1256\"}":{"__typename":"DeepDives","uuid":"f9dfdfbb-f337-4f78-a7ed-a72c437c1256","content":"\u003cp\u003eTry new things! In middle school and high school, I was always really good at science and always thought I would do that as a career. Having explored more interests in college, I've discovered that I'm also equally strong in math! Being able to explore is ultimately what brought me to my current major.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"b40b33f9-f57c-406b-b2f2-6cadec8e911d\"}":{"__typename":"DeepDives","uuid":"b40b33f9-f57c-406b-b2f2-6cadec8e911d","content":"\u003cp\u003eMy parents - they sacrificed everything by immigrating to this country to give me a better future and I'm so happy to be able to make the most of it each day :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"81697363-a77f-4511-8e9b-cb1616a3ab6e\"}":{"__typename":"DeepDives","uuid":"81697363-a77f-4511-8e9b-cb1616a3ab6e","content":"\u003cp\u003eI've played tennis for seven years but recently I just started to learn the guitar.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0f6be5bd-b185-452d-aa63-dacbdb67f79e\"}":{"__typename":"DeepDives","uuid":"0f6be5bd-b185-452d-aa63-dacbdb67f79e","content":"\u003cp\u003eMentorship matters to me because as an only child whose parents immigrated here, I often was the first in my family to figure out the school system, college application process, and later career search. While I found many professional mentors, I never found someone constant. That's what I hope to be for other people, a constant presence that helps them develop their interests while providing the support I never had.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"67d72f2a-7885-42b3-8b16-578e094e8915\"}":{"__typename":"School","uuid":"67d72f2a-7885-42b3-8b16-578e094e8915","name":"Eastchester High School","city":"Eastchester","type":"HIGH","state":"New York","country":"United States","zip":"10709"},"Education:{\"uuid\":\"f32a778e-6d88-4ff3-91f3-354668bf4d95\"}":{"__typename":"Education","uuid":"f32a778e-6d88-4ff3-91f3-354668bf4d95","school":{"__ref":"School:{\"uuid\":\"67d72f2a-7885-42b3-8b16-578e094e8915\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"3e020254-47ab-4970-b680-f905587bbfa3\"}":{"__typename":"Education","uuid":"3e020254-47ab-4970-b680-f905587bbfa3","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Applied Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"b41ae5b7-997a-41f8-8fd5-91647df2538c\"}":{"__typename":"MentorPublicProfile","uuid":"b41ae5b7-997a-41f8-8fd5-91647df2538c","displayName":"Andrea K.","slug":"andrea-klein","biography":"\u003cp\u003eI’m currently a student at Brown University studying statistics and public health, and one of my favorite things is helping students realize they are capable of far more than they think they are! I’ve always loved subjects like math and science, but I also know how overwhelming they can feel at first. A huge part of why I enjoy tutoring is getting to watch something “click” for someone, when a concept that once felt intimidating suddenly starts to make sense!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I spend a lot of my time working in research at the intersection of healthcare, data science, and biology. I’ve worked on projects involving brain imaging, cardiac modeling, and predictive health research using large medical datasets. I also love coding and computational problem-solving, especially using Python and R to answer real-world questions in medicine and public health. What excites me most is that I get to use math and statistics not just in theory, but to study things that can actually improve people’s lives!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of research, I genuinely love mentoring and teaching. I try to make sessions feel collaborative, encouraging, and low-pressure because I know students learn best when they feel comfortable asking questions. I’m a big believer that there’s no such thing as being “bad” at math or science. Often it just takes someone explaining it in the right way! I also love helping students with organization, study strategies, confidence-building, and navigating academic stress, especially in challenging STEM courses.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I’m someone who loves creative projects, meeting new people, and finding connections between completely different fields. I’m fascinated by healthcare innovation, psychology, and entrepreneurship, and I’m always excited to talk with students about future goals, college paths, or careers in STEM and medicine. I also know firsthand how important supportive mentors can be, and I try to create the kind of encouraging environment that makes students feel comfortable growing, making mistakes, and asking questions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want students to leave sessions not only understanding the material better, but also feeling more confident in themselves. Learning should feel challenging in a rewarding way, not discouraging, and I aim to create an environment where students feel supported, motivated, and genuinely excited to grow!\u003c/p\u003e","teachingVideoPlaybackId":"I4zMKRLg18NgIJ5gteRvIlpBnV3Zy9jxX7lseGgIOnQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eEarning an award presented by the Romanian-American ambassador for service towards my Balkan heritage!\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Applied Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f9dfdfbb-f337-4f78-a7ed-a72c437c1256\"}"},{"__ref":"DeepDives:{\"uuid\":\"b40b33f9-f57c-406b-b2f2-6cadec8e911d\"}"},{"__ref":"DeepDives:{\"uuid\":\"81697363-a77f-4511-8e9b-cb1616a3ab6e\"}"},{"__ref":"DeepDives:{\"uuid\":\"0f6be5bd-b185-452d-aa63-dacbdb67f79e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bfdf8975-1df1-4aa2-ac0c-5def01c8bfa6/-/preview/-/format/jpg/","https://ucarecdn.com/85c97983-aa5a-4de1-843e-4a3f4a5dd28e/-/preview/-/format/jpg/","https://ucarecdn.com/32ab08fa-7394-4c8b-b6a0-e15fb337adef/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","educati
