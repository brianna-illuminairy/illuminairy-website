xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0464ea36-dde7-4f59-ae2e-e1d9a7e81ca9\"}":{"__typename":"DeepDives","uuid":"0464ea36-dde7-4f59-ae2e-e1d9a7e81ca9","content":"\u003cp\u003eHonestly? I picked Computer Science because it felt like the one place where I could mix being creative with actually \u003cem\u003ebuilding stuff that works\u003c/em\u003e. I’ve always had way too many ideas floating around in my head, and coding felt like the closest thing to magic—like you think of something, type it out, and suddenly it’s real.\u003c/p\u003e\u003cp\u003eThe first time I built something that solved a real problem (a payment tracking app for my dance academy) I was like… wait, this is so cool?? And I haven’t really stopped since. Now I love that CS lets me do a bit of everything—design, problem solving, impact, and even some storytelling. It’s the perfect major for someone like me who doesn’t want to pick just one lane.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"e60f3036-eec8-4081-acac-97ffc591efe6\"}":{"__typename":"DeepDives","uuid":"e60f3036-eec8-4081-acac-97ffc591efe6","content":"\u003cp\u003eSomething that isn’t obvious right away is that I can be a little reserved at first, but once I warm up, I’m actually very outgoing and energetic. I love connecting with people and bringing positive energy into conversations, and once I feel comfortable, I’m the type who can keep a lively discussion going for hours. I think that balance—starting off thoughtful and then opening up—helps me connect with people in a way that feels genuine and authentic to myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c7ce61dd-69bc-455a-9ffd-88c9a5ff6118\"}":{"__typename":"DeepDives","uuid":"c7ce61dd-69bc-455a-9ffd-88c9a5ff6118","content":"\u003cp\u003eOut of all the things I could be doing, I chose mentorship because I know how much it meant to have people believe in me and guide me when I was figuring out my own path. The support I’ve been given—whether from teachers, mentors, or peers—has made such a difference in my life, and I want to pay that forward. Mentorship feels like the best way to not only share what I’ve learned, but also to encourage students to believe in themselves and explore their passions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"df615419-2ae2-473b-84e5-932284cbcd2c\"}":{"__typename":"DeepDives","uuid":"df615419-2ae2-473b-84e5-932284cbcd2c","content":"\u003cp\u003eIf I could give my middle or high school self advice, I’d say: stop stressing so much about being perfect. The things that feel overwhelming now—grades, resumes, figuring out exactly what you want to do—aren’t the things that will define you. What matters more is staying curious, trying new things, and trusting that it’s okay to take a less “linear” path. I’d remind myself that confidence comes with experience, and it’s better to dive in and learn than to hold back because you’re afraid of making mistakes. Most of the growth happens outside of your comfort zone, and it’s okay to not have it all figured out yet.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"0bfda57b-830f-484c-84b4-2b5aedf9b4bf\"}":{"__typename":"School","uuid":"0bfda57b-830f-484c-84b4-2b5aedf9b4bf","name":"Dougherty Valley High School","city":"San Ramon","type":"HIGH","state":"California","country":"United States","zip":"94582"},"Education:{\"uuid\":\"ec857559-65ba-42cc-8ef5-dcc83465d8ae\"}":{"__typename":"Education","uuid":"ec857559-65ba-42cc-8ef5-dcc83465d8ae","school":{"__ref":"School:{\"uuid\":\"0bfda57b-830f-484c-84b4-2b5aedf9b4bf\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"b0d5bb10-3ff1-4c4f-bdfb-793b052b1410\"}":{"__typename":"Education","uuid":"b0d5bb10-3ff1-4c4f-bdfb-793b052b1410","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Computer Science \u0026 Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"393e9b30-761c-4aa0-8617-899c885fef5d\"}":{"__typename":"MentorPublicProfile","uuid":"393e9b30-761c-4aa0-8617-899c885fef5d","displayName":"Anusha L.","slug":"anusha-ladha","biography":"\u003cp\u003eHi! I’m Anusha, a Computer Science student at UCLA who’s always been drawn to the intersection of creativity, technology, and community. I love building projects that feel meaningful—not just coding for the sake of it, but coding as a way to solve problems, tell stories, or bring people together. Over the past few years, I’ve gotten to explore this in so many different ways: creating apps for nonprofits through Nova (our tech-for-social-good club at UCLA), designing tools for my dance academy to make their lives easier, and even experimenting with personal projects like a clothing swap app for students or a grade forecasting tool that makes academics a little less stressful.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat excites me most about tech is how flexible and open-ended it is. One day I might be debugging a stubborn piece of code, and the next I’m brainstorming with a team about how to use data to fight pollution or make libraries more accessible. I love that balance between the technical and the creative—where you’re not just writing code but also imagining the “why” behind what you’re building.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of tech, I’ve spent years doing Kathak (a classical Indian dance), and that’s been a huge part of how I see creativity. Dance taught me patience, discipline, and how to express myself without words—lessons that I’ve definitely carried into other parts of my life. I also love staying active, whether that’s lifting at the gym, swimming (I swam competitively for 10 years), or just trying new fitness goals like learning a handstand or muscle-up. Moving my body has always been a way to recharge and keep balance alongside school and projects.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTravel is another big passion of mine. I recently spent the summer in Europe, studying medieval art history in Spain and exploring different cities on my own. I loved wandering through cathedrals and museums, but also finding little cafés, writing, and reflecting on what I want to create next. I think curiosity is what connects all the things I do—whether it’s dance, tech, travel, or fitness, I’m always chasing that feeling of discovery.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I want to bring that same energy to students: showing that learning doesn’t have to feel rigid or intimidating, and that curiosity can take you further than you think. I know how much it meant to me to have people believe in me and encourage me early on, and I’d love to pay that forward—helping others see how their unique interests and ideas can connect with tech in exciting ways.\u003c/p\u003e","teachingVideoPlaybackId":"fioZsCb01iljd2xpsy5fwbY02a00Mt8uwCNP8E02jFBKlSY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0464ea36-dde7-4f59-ae2e-e1d9a7e81ca9\"}"},{"__ref":"DeepDives:{\"uuid\":\"e60f3036-eec8-4081-acac-97ffc591efe6\"}"},{"__ref":"DeepDives:{\"uuid\":\"c7ce61dd-69bc-455a-9ffd-88c9a5ff6118\"}"},{"__ref":"DeepDives:{\"uuid\":\"df615419-2ae2-473b-84e5-932284cbcd2c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5b4e7e99-b0c2-48fe-853b-89d3cbef6aea/-/preview/-/format/jpg/","https://ucarecdn.com/592d2aec-77d1-451d-80de-8063c887c6d7/-/preview/-/format/jpg/","https://ucarecdn.com/d3489779-e2a9-4c66-a9db-8533f6ba5152/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ec857559-65ba-42cc-8ef5-dcc83465d8ae\"}"},{"__ref":"Education:{\"uuid\":\"b0d5bb10-3ff1-4c4f-bdfb-793b052b1410\"}"}],"hiredAt":"2025-09-10T17:49:18.424Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Coding / Programming","Web Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROO
