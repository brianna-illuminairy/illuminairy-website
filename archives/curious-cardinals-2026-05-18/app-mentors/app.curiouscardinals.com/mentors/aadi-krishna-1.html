xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"224f5056-36de-4308-9953-8db54a821ce3\"}":{"__typename":"DeepDives","uuid":"224f5056-36de-4308-9953-8db54a821ce3","content":"\u003cp\u003eI came to Yale looking to understand the world - people and systems - the best I could. Fascinated by why things exist the way they do, I naturally gravitated to philosophy, and paired it with Yale's combined Ethics, Politics, and Economics major, recognizing Politics and Economics to be a practical manifestation of the philosophical underpinnings of society. On the other hand, I was eager to develop a systematic problem-solving approach and develop my toolkit to create impactful change, choosing to double major in Computer Science. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9be29bf9-80a4-4704-a581-884b89c4d6c7\"}":{"__typename":"DeepDives","uuid":"9be29bf9-80a4-4704-a581-884b89c4d6c7","content":"\u003cp\u003eVery meaningful mentors have guided me throughout my life, shaping who I am today and helping me take advantage of various opportunities. It is this gratitude that guides my desire for mentorship - I want to be that force for others\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"22c6a1e5-f86b-4f01-a863-b7653e2fe662\"}":{"__typename":"DeepDives","uuid":"22c6a1e5-f86b-4f01-a863-b7653e2fe662","content":"\u003cp\u003eLaunch a social impact AI startup that meaningfully influences lives!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"4efbcf32-5626-4ea6-be9f-1fc160df5a20\"}":{"__typename":"DeepDives","uuid":"4efbcf32-5626-4ea6-be9f-1fc160df5a20","content":"\u003cp\u003eWorking on various passion projects: from writing research papers to coordinating remote volunteering projects and developing a business plan for a startup.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"09cbe553-5555-4b0d-a2e2-efb1d6bd821d\"}":{"__typename":"School","uuid":"09cbe553-5555-4b0d-a2e2-efb1d6bd821d","name":"Shiv Nadar School, Noida","city":"Noida","type":"HIGH","state":"Uttar Pradesh","country":"India","zip":"201304"},"Education:{\"uuid\":\"8235ec23-2984-4217-9c54-a5f49662d14b\"}":{"__typename":"Education","uuid":"8235ec23-2984-4217-9c54-a5f49662d14b","school":{"__ref":"School:{\"uuid\":\"09cbe553-5555-4b0d-a2e2-efb1d6bd821d\"}"},"startYear":"2020","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"43e83bc1-9149-416d-804f-9997adbed3cd\"}":{"__typename":"Education","uuid":"43e83bc1-9149-416d-804f-9997adbed3cd","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science and Ethics, Politics, and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"aa1acb82-4da5-4315-9c9f-34f6579a4cb6\"}":{"__typename":"MentorPublicProfile","uuid":"aa1acb82-4da5-4315-9c9f-34f6579a4cb6","displayName":"Aadi K.","slug":"aadi-krishna-1","biography":"\u003cp\u003eHi! I’m studying Computer Science and Ethics, Politics, and Economics at Yale University, and I grew up in Delhi, India. I love engaging with topics across all fields and teaching ideas. “Develop a passion for learning. If you do, you will never cease to grow” - Anthony J. D’Angelo—I try to approach my life with this philosophy, particularly engaging with systems of knowledge and problem-solving approaches.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love doing research, having published or presented over 10 research papers across Astrophysics, Philosophy, Computer Science, and Bioinformatics. I started doing sole-author research in high school, charting my own path to find conferences and journals to publish my work. In college, I spent my first two summers doing Astrophysics research with labs at Yale, Taiwan, and India. I still work in research labs, thoroughly enjoying deep dives into new problems and presenting insights to the larger community.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEntrepreneurship remains my biggest passion, having worked on various projects, including increasing government transparency by developing AI systems based on digitized government documents. Most recently, I founded Yale Pitchbook—the first platform connecting Yale founders with resources, talent, and investment opportunities. Through the platform, we house the largest database of Yale startups (90+) and connect them with leading VCs worldwide, helping ventures raise over 100k to date. I love brainstorming, working on, and supporting interesting ideas, regardless of the domain!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m a huge sports buff and grew up playing Badminton and Cricket very competitively in India, and captained the Yale Badminton Team. Beyond academics and extracurriculars, I love traveling, Wikipedia deep dives, new experiences, and following as many sports as I can.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduation, I will join Boston Consulting Group to do management consulting in Houston.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a Curious Cardinals mentor, I’m excited to be a warm, practical sounding board - someone who will meet you where you are, help you clarify what you want, and then break it into real, doable next steps. I especially enjoy bridging technical rigor with creative problem-solving. Whether you’re aiming to publish original research, launch an AI-driven venture, or balance elite athletics with high-level academics, I’d love to help you navigate the process! Can’t wait to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"UOzUgziKzToNIPh12De3Kx7dR5kH1Uk1T8iAhYazlSs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science and Ethics, Politics, and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"224f5056-36de-4308-9953-8db54a821ce3\"}"},{"__ref":"DeepDives:{\"uuid\":\"9be29bf9-80a4-4704-a581-884b89c4d6c7\"}"},{"__ref":"DeepDives:{\"uuid\":\"22c6a1e5-f86b-4f01-a863-b7653e2fe662\"}"},{"__ref":"DeepDives:{\"uuid\":\"4efbcf32-5626-4ea6-be9f-1fc160df5a20\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6f37e282-351d-477b-b71d-480ab7494c7c/-/preview/-/format/jpg/","https://ucarecdn.com/18e94339-0916-49fd-bb9a-7efda51ff715/-/preview/-/format/jpg/","https://ucarecdn.com/b338a3f5-92e4-4593-b27f-4e06bef6bfc6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"
