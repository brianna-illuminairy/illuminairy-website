xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"88dacce5-61e0-44e9-9d58-039141d63f40\"}":{"__typename":"DeepDives","uuid":"88dacce5-61e0-44e9-9d58-039141d63f40","content":"\u003cp\u003eJust reach out! This applies to your teachers, friends, and older students. As someone who was always on the shier side, I found reaching out to people and asking questions to be daunting. However, making connections with people that I was initially afraid to connect with always creates opportunities for growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a056a53f-78cb-40ce-b450-ae11546834fe\"}":{"__typename":"DeepDives","uuid":"a056a53f-78cb-40ce-b450-ae11546834fe","content":"\u003cp\u003ePassion. When I enjoy something, I find that working hard at it is actually something that I look forward to. If you have interest in a field of study, it makes it so much easier to want to make an impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"f851df7b-6f16-45f4-b64d-61aaaf4e1368\"}":{"__typename":"DeepDives","uuid":"f851df7b-6f16-45f4-b64d-61aaaf4e1368","content":"\u003cp\u003eI don't know how it happened, but I was DJing at a party, and Alexander Hamilton was there. It was awesome.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"932c17f8-3fff-4388-bf8b-1bc93acc725a\"}":{"__typename":"DeepDives","uuid":"932c17f8-3fff-4388-bf8b-1bc93acc725a","content":"\u003cp\u003eWhen I was in high school, I worked with my school to create a novel English elective where seniors at my high school could learn jointly with students at a minimum security prison in Maine. I was inspired by documentarian Lynn Novick's film, \u003cem\u003eCollege Behind Bars\u003c/em\u003e, which is about students at maximum security prisons pursuing an education through Bard College's Prison education initiative. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"f373e68d-438c-4513-a15a-b41ad7975767\"}":{"__typename":"School","uuid":"f373e68d-438c-4513-a15a-b41ad7975767","name":"The Horace Mann School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"8c1d9f87-e72d-475b-8802-c19df8d7dec0\"}":{"__typename":"Education","uuid":"8c1d9f87-e72d-475b-8802-c19df8d7dec0","school":{"__ref":"School:{\"uuid\":\"f373e68d-438c-4513-a15a-b41ad7975767\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"552178a3-738e-435f-a741-cf88d52b601a\"}":{"__typename":"Education","uuid":"552178a3-738e-435f-a741-cf88d52b601a","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"History and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"0dbea6d8-3003-461b-a4ea-aa12062e36c5\"}":{"__typename":"MentorPublicProfile","uuid":"0dbea6d8-3003-461b-a4ea-aa12062e36c5","displayName":"Simon S.","slug":"simon-schackner","biography":"\u003cp\u003e\u003cem\u003eSimon Schackner is currently a senior at the University of Pennsylvania studying History and Economics. He came to this interest through a history class titled Contemporary US History that he took in his junior year at the Horace Mann School. In the class, he was given the opportunity to write a research paper on a topic of my choice. Being from New York City and loving the hip-hop scene, he wrote the paper on the birth of hip-hop. Through the researching and writing process, he became fascinated by the link between housing issues, the generally poor economic conditions of the Bronx in the 1970s, and the rise of hip-hop.\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eMore generally, Simon is a humanities student at heart. He believes that understanding complex texts, and being able to convey complex ideas through writing, is an essential life skill. In high school, he was the senior editor for my school’s political magazine, The Review. As a college student, Simon remains interested in policy and law. He serves as an executive editor for the Penn Undergraduate Law Journal, which publishes undergraduate research from students around the country on issues related to the legal field. The summer following his freshman year, he worked as an intern for US Congressman Ritchie Torres, who represents the South Bronx and Riverdale in New York City. The following summer, he interned at the Manhattan District Attorney’s office. Following graduation, Simon plans to attend law school.\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eHe is very passionate about teaching, and has always felt that explaining ideas to others is one of the best ways to reinforce his own learning. He currently works as a volunteer at a middle school in West Philadelphia, providing mentorship in English and History. He enjoys learning about the US education system as a whole, and has done extensive research in the field of education for incarcerated Americans. In high school, he worked with my school to create an English elective where seniors at my school could learn jointly with an incarcerated community (visit \u003cu\u003ehttps://www.pressherald.com/2025/02/04/maine-correctional-center-hosts-prison-education-program-with-nyc-high-school/\u003c/u\u003e to learn more).\u0026nbsp;\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eOutside of the classroom, he loves to stay active and enjoy the outdoors. Some of his interests include playing tennis, hiking, and running. He has also picked up DJing during his time at college, and honing his craft is currently one of his favorite pastimes.\u003c/em\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"88dacce5-61e0-44e9-9d58-039141d63f40\"}"},{"__ref":"DeepDives:{\"uuid\":\"a056a53f-78cb-40ce-b450-ae11546834fe\"}"},{"__ref":"DeepDives:{\"uuid\":\"f851df7b-6f16-45f4-b64d-61aaaf4e1368\"}"},{"__ref":"DeepDives:{\"uuid\":\"932c17f8-3fff-4388-bf8b-1bc93acc725a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5ecbbdc3-8993-4082-8c5d-ea81832ad4cc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8c1d9f87-e72d-475b-8802-c19df8d
