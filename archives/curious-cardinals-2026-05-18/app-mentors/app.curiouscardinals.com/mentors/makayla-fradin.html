xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"97b4300a-a32d-48cc-b129-de79b1baec2c\"}":{"__typename":"DeepDives","uuid":"97b4300a-a32d-48cc-b129-de79b1baec2c","content":"\u003cp\u003eEveryone knows someone in their life who is virtuous. Someone to look up to and emulate their style of handling situations. A role model is someone who has influenced your life in a huge way. My role model is my grandfather, Richard Kresloff. He fills this role, not due to his success as a doctor or the unconditional love and support he provides me. No, it is the obvious trust his patients have in him, knowing he is always going to do his best to care for them. Over the years, I frequently hear from friends, teachers, and other acquaintances about my grandfather, their doctor. Their feedback is almost universally focused on how warm and caring he is as a doctor, and how deeply they trust him. This inspires me to create the same feeling in my patients one day. Not just a doctor, but one who will make Dr. Richard Kresloff proud. Additionally, my Papa has taught me to not get caught up in the craziness of my everyday life and to focus on the things that truly matter. He motivates me to not only work hard but be a good person, a mensch, as he would say.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"df1505ec-a1b1-46a9-a2b1-8ac842980985\"}":{"__typename":"DeepDives","uuid":"df1505ec-a1b1-46a9-a2b1-8ac842980985","content":"\u003cp\u003eAt the University of Pennsylvania, I chose my major to give me a new perspective that allows me to be a unique asset as a future physician. The motto of my major is \"Look back; Look around; Look ahead.” This encompasses exactly what I am able to do: study the big picture and understand issues to create change in the world. Many colleges present information in a bubble, sheltered from the outside world. The students and teachers I am surrounded by offer diverse viewpoints and engage in debate regarding “why” a particular innovation arose and whether positive impacts outweigh potential negatives. Science, technology, and society has taught me to analyze an issue critically rather than memorizing facts. I can offer a different perspective on medicine, including its societal impact and social determinants on health and disease. I am eager to conduct research while promoting the understanding of the conditions I am studying among young patients and their families. My diversity stems from my way of thinking. I am lucky to attend an institution that encourages academic debate and collaboration with peers with unique backgrounds that\u0026nbsp;have an impact on each other’s thinking.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"0ad4160b-bfeb-4e1d-b98a-efe9cfffa19a\"}":{"__typename":"School","uuid":"0ad4160b-bfeb-4e1d-b98a-efe9cfffa19a","name":"Penn Charter","city":"Philadelphia","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19144"},"Education:{\"uuid\":\"034a8046-4a79-42b9-aa73-f4cb56395ca1\"}":{"__typename":"Education","uuid":"034a8046-4a79-42b9-aa73-f4cb56395ca1","school":{"__ref":"School:{\"uuid\":\"0ad4160b-bfeb-4e1d-b98a-efe9cfffa19a\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"fdfc0d92-4bad-4bd6-a58d-fd4cf0734993\"}":{"__typename":"Education","uuid":"fdfc0d92-4bad-4bd6-a58d-fd4cf0734993","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Science, Technology, and Society","degree":null},"MentorPublicProfile:{\"uuid\":\"89b09abf-5548-4e6a-a25a-65f879e2b2ed\"}":{"__typename":"MentorPublicProfile","uuid":"89b09abf-5548-4e6a-a25a-65f879e2b2ed","displayName":"Makayla F.","slug":"makayla-fradin","biography":"\u003cp\u003eMakayla is a rising junior at The University of Pennsylvania. She is majoring in science, technology, and society with a concentration in biotechnology and biomedicine. She is also minoring in chemistry and medical sociology. Makayla is an aspiring doctor of tomorrow. She wants to be on the front lines helping patients, as well as immersed in research about the future of medical technologies and treatments. Throughout college, Makayla has spent her summers taking classes such as statistics and physics while partaking in research in Ophthalmology at the Hospital of the University of Pennsylvania.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMakayla grew up in Cherry Hill, NJ, and attended high school at William Penn Charter in Philadelphia. Her academic journey has been profoundly shaped by the principle of educating students to live lives that make a difference instilled in her by the small Quaker community at Penn Charter. At Penn, Makayla continues to embody these principles in community service as the Philanthropy chair of the Kappa Alpha Theta Fraternity and being chosen to work on the fundraising board of Medicine, Education, and Development for Low-Income Families Everywhere (MEDLIFE).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring her free time, Makayla can often be found playing pickleball with her dad, cooking with friends, trying new things at the grocery store and restaurants, and playing with her two dogs. Notably, she dedicates four hours weekly to volunteering at the Children’s Hospital of Pennsylvania working with children at the inpatient facility.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMakayla has previous tutoring experience in helping 7-14-year-olds learn how to code javascript, mentoring and teaching elementary-aged students in an after-school program at Penn Charter, and tutoring Penn students through the Weingarten Center in Calculus.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eExcited to further her dedication to academic mentorship, Makayla is eager to help students grasp challenging subjects and develop a genuine passion for learning. As a tutor, she aims to share her enthusiasm for academic pursuits, inspiring fellow students on their path to success in demanding courses.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Science, Technology, and Society","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"97b4300a-a32d-48cc-b129-de79b1baec2c\"}"},{"__ref":"DeepDives:{\"uuid\":\"df1505ec-a1b1-46a9-a2b1-8ac842980985\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/12ca60a5-8192-460a-9399-3b112f85e717/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"034a8046-4a79-42b9-aa73-f4cb56395ca1\"}"},{"__ref":"Education:{\"uuid\":\"fdfc0d92-4bad-4bd6-a58d-fd4cf0734993\"}"}],"hiredAt":"2023-11-25T14:05:58.886Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","
