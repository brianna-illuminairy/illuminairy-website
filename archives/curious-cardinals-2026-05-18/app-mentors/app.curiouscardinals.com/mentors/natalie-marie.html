xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"2e10bf67-c9bc-47ad-87e1-9843e4395ca3\"}":{"__typename":"Favorites","uuid":"2e10bf67-c9bc-47ad-87e1-9843e4395ca3","photoUrl":"https://ucarecdn.com/254a01fa-2c8f-4758-956e-b61af341b045/","title":"Ctrl - SZA","type":"ALBUM"},"Favorites:{\"uuid\":\"0bfe668b-124f-421d-bcc2-10ab2a82e955\"}":{"__typename":"Favorites","uuid":"0bfe668b-124f-421d-bcc2-10ab2a82e955","photoUrl":"https://ucarecdn.com/263e16ee-bbe8-4d12-9290-ca88d2185bdf/","title":"Slouching Towards Bethlehem - Joan Didion","type":"BOOK"},"Favorites:{\"uuid\":\"a7ad50f8-c7bd-4959-a896-78342cce0239\"}":{"__typename":"Favorites","uuid":"a7ad50f8-c7bd-4959-a896-78342cce0239","photoUrl":"https://ucarecdn.com/c68511bf-e491-4bae-9393-2e1e575625de/","title":"Silver Linings Playbook","type":"MOVIE"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f0911a97-5d39-4997-a533-d26d595b9206\"}":{"__typename":"DeepDives","uuid":"f0911a97-5d39-4997-a533-d26d595b9206","content":"\u003cp\u003eI'm currently in the recording stages of my first solo EP (a.k.a extended play, think of it as a shorter album). The project is called \"Abigail, Again\" and consists of 8 songs about growing up, discovering a love for music, love, heartbreak, and so much more! The project started last summer, which I spent at home learning to play the guitar. Since then, I've gotten to see the ins and outs of a recording studio and the music production process! I can't wait to share it :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"360f04a7-b703-4541-8306-5a07f5591f7a\"}":{"__typename":"DeepDives","uuid":"360f04a7-b703-4541-8306-5a07f5591f7a","content":null,"videoPlaybackId":"W53JnMyYXw1XvbcQT67XhwDlbE7wwjzh83uhdXGPt5w","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5b40893b-b2dd-4ec9-965d-e3c9c7048aa9\"}":{"__typename":"DeepDives","uuid":"5b40893b-b2dd-4ec9-965d-e3c9c7048aa9","content":null,"videoPlaybackId":"VNyBaT90002qvtTE39lDqjlsGzG02furgJyW7HpRxfFy400","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"73fc6e3b-5dc9-4379-880a-0e7e361fdf28\"}":{"__typename":"DeepDives","uuid":"73fc6e3b-5dc9-4379-880a-0e7e361fdf28","content":"\u003cp\u003eMy greatest source of motivation comes from the amazing people in my life. Nothing inspires me more than seeing people that I love do things that make them feel fulfilled, talking to coworkers and peers about the paths that got them to where they are, and meeting new people who are excited to learn and grow — which is big reason why I'm so excited to meet you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"3dc1ee83-165d-4b8f-b83a-e3062ce2f4bc\"}":{"__typename":"School","uuid":"3dc1ee83-165d-4b8f-b83a-e3062ce2f4bc","name":"Marshall High School","city":"Marshall","type":"HIGH","state":"MI","country":"United States","zip":"49068"},"Education:{\"uuid\":\"9c0e7f34-c1ab-4754-9dfd-3987f93a21f6\"}":{"__typename":"Education","uuid":"9c0e7f34-c1ab-4754-9dfd-3987f93a21f6","school":{"__ref":"School:{\"uuid\":\"3dc1ee83-165d-4b8f-b83a-e3062ce2f4bc\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"90e3edca-2318-49b2-b31c-f85ed693f13e\"}":{"__typename":"Education","uuid":"90e3edca-2318-49b2-b31c-f85ed693f13e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Psychology - Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"6d13643a-0136-4600-9800-bd70dea4ae1b\"}":{"__typename":"MentorPublicProfile","uuid":"6d13643a-0136-4600-9800-bd70dea4ae1b","displayName":"Natalie S.","slug":"natalie-marie","biography":"\u003cp\u003eHey there! I'm Natalie, and I'm so excited you’re here.\u003cbr\u003e\u003cbr\u003eI went to high school in a small town called Marshall, Michigan where I was Class President, Drum Major of the marching band, and Team Captain of the swim team. I was also heavily involved with community service, serving as President of my town’s National Honors Society chapter. Throughout my childhood, I was extremely passionate about reading and creative writing, and published two short books through Miller College’s Children’s Literature Project. The first book recounted the stories of my sister, Sarah, battling a life-threatening illness at the age of 6. The second book was a fictional story about a swimmer with one leg who leans on her inner-strength and the inspiration from those around her to overcome the odds, qualifying for Nationals.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI received my acceptance from Stanford in 2018, and moved to California to start my college career. At Stanford, I became Music Director of Mixed Company A Cappella, Saxophone Section Leader of the Leland Stanford Junior University Marching Band (LSJUMB), and started a student band, called Girl Band, as the lead vocalist and rhythm guitarist. One of my most precious memories at Stanford was getting to headline for a sold-out audience at the Guild Theater in Menlo Park, where the Chainsmokers had played the week prior!\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, my academic passions led me to pursue mathematics and statistics. When my stepfather was diagnosed with early-onset Alzheimer's Disease in 2015, I became fascinated with the human brain, and specifically neuro-degeneration. At Stanford, I continued to pursue my love for math and my curiosity in neuroscience by studying the ways in which technology (particularly AI) can help improve the research, diagnosis, and treatment process of neuro-degenerative diseases. I also pursued academic interests in social psychology, creative writing, film, linguistics, philosophy, and music.\u0026nbsp;\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve been lucky to have amazing professional experiences, including a full-time Research Analyst position at Mach49—a Silicon Valley incubator/accelerator—during my 2020/2021 gap year, and an internship at Apple on the Business Markets team the following summer, where I got to build internal tools to enhance team productivity, and visit Infinite Loop!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSome of my favorite activities include exploring California with friends, playing guitar in a San Francisco park, reading Joan Didion, writing poetry, hiking, swimming, and recording my upcoming solo album, titled “Abigail, Again,” which touches on themes of childhood and growing up, love and loss, and exploration of one’s passions.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe times I cherish most in life, however, are those spent learning from those around me. As a Curious Cardinals Mentor, my mission is just that: to learn. In my opinion, the path to knowledge is (1) always a 2-way street and (2) never entirely linear. With collaboration and a shared commitment to unlocking passions and potential, I believe there is truly nothing out of scope. I’m so excited to work together with the brilliant CC mentees to help them become comfortable with daunting subjects, find new passions, explore existing ones, and—most importantly—to learn.\u003c/p\u003e","teachingVideoPlaybackId":"Eyk02yFeainHF02S2008CGlQSsWRRh44ER7O4CjfVS3QKM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2e10bf67-c9bc-47ad-87e1-9843e4395ca3\"}"},{"__ref":"Favorites:{\"uuid\":\"0bfe668b-124f-421d-bcc2-10ab2a82e955\"}"},{"__ref":"Favorites:{\"uuid\":\"a7ad50f8-c7bd-4959-a896-78342cce0239\"}"}],"causesSupported":[],"major":"Psychology - Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f0911a97-5d39-4997-a533-d26d595b9206\"}"},{"__ref":"DeepDives:{\"uuid\":\"360f04a7-b703-4541-8306-5a07f5591f7a\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b40893b-b2dd-4ec9-965d-e3c9c7048aa9\"}"},{"__ref":"DeepDives:{\"uuid\":\"73fc6e3b-5dc9-4379-880a-0e7e361fdf28\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/36e9485c-00d3-4482-9da1-5a62eb2c17bf/-/preview/-/format/jpg/","https://ucarecdn.com/bb46cffa-1731-4908-bb19-ee9100ffd89c/-/preview/-/format/jpg/","https://ucarecdn.com/f09b6b43-1fe7-43e7-906d-c90fb4c38cbc/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9c0e7f34-c1ab-4754-9dfd-3987f93a21f6\"}"},{"__ref":"Education:{\"uuid\":\"90e3edca-2318-49b2-b31c-f85ed693f13e\"}"}],"hiredAt":"2023-07-27T21:38:21.3
