xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"19a3cb04-d1fc-43db-9fdf-c5f0b2d40e58\"}":{"__typename":"Favorites","uuid":"19a3cb04-d1fc-43db-9fdf-c5f0b2d40e58","photoUrl":"https://ucarecdn.com/8d00f734-9a8c-49ac-842a-e78dd68333a4/","title":"Bridge Over Troubled Water","type":"ALBUM"},"Favorites:{\"uuid\":\"6f80ff1a-04de-489f-9d3f-d01e14e66194\"}":{"__typename":"Favorites","uuid":"6f80ff1a-04de-489f-9d3f-d01e14e66194","photoUrl":"https://ucarecdn.com/8d00f734-9a8c-49ac-842a-e78dd68333a4/","title":"Network","type":"MOVIE"},"Favorites:{\"uuid\":\"faff282d-4604-4ab2-a7d4-8c5e88525a88\"}":{"__typename":"Favorites","uuid":"faff282d-4604-4ab2-a7d4-8c5e88525a88","photoUrl":"https://ucarecdn.com/8d00f734-9a8c-49ac-842a-e78dd68333a4/","title":"New York Jets","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"73cc0ad2-e958-47fa-9f40-433ef78a34b0\"}":{"__typename":"DeepDives","uuid":"73cc0ad2-e958-47fa-9f40-433ef78a34b0","content":"\u003cp\u003eI'm currently working on a stage musical adaptation of the 1990 film \u003cem\u003eMetropolitan\u003c/em\u003e in collaboration with its writer/director, Whit Stillman.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"f64f6378-db6e-4915-8493-32e7b5754fee\"}":{"__typename":"DeepDives","uuid":"f64f6378-db6e-4915-8493-32e7b5754fee","content":"\u003cp\u003eThe person in my life who's had more of an impact on me than anyone else has been my grandfather.  He was a theater critic, amateur pianist, and aesthete of the old school, as well as a completely good and kind person.  He taught me to seek joy and to love art as a source of character and growth.  He's not with us anymore, but I think of him always.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"89fc0643-282f-4b15-b0eb-93aded585728\"}":{"__typename":"DeepDives","uuid":"89fc0643-282f-4b15-b0eb-93aded585728","content":"\u003cp\u003eMy favorite things to do are to go to art museums, the theater, and the movies!  I also love bar trivia.  (I consider myself a valuable member of my team, but I always say Everyone is an asset! because you can never tell when something might come up that only you would know.)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"160be640-1ce8-496e-8ced-251ae157f3a3\"}":{"__typename":"DeepDives","uuid":"160be640-1ce8-496e-8ced-251ae157f3a3","content":"\u003cp\u003eAs I create more and more, as I engage with the beautiful things in life more deeply, I find myself more and more connected to other people.  As I learn, I find they learn more about me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"6944ca0d-22ba-4e77-9e4c-72e6f08615ab\"}":{"__typename":"School","uuid":"6944ca0d-22ba-4e77-9e4c-72e6f08615ab","name":"Montclair High School","city":"Montclair","type":"HIGH","state":"New Jersey","country":"United States","zip":"07042"},"Education:{\"uuid\":\"d3fcd66e-7a53-4317-9641-2ab2564d613a\"}":{"__typename":"Education","uuid":"d3fcd66e-7a53-4317-9641-2ab2564d613a","school":{"__ref":"School:{\"uuid\":\"6944ca0d-22ba-4e77-9e4c-72e6f08615ab\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"17528bc9-335c-48ae-b292-a6af874c0b91\"}":{"__typename":"Education","uuid":"17528bc9-335c-48ae-b292-a6af874c0b91","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Literary Arts","degree":null},"Testimonial:d22eeaaf-8d26-4060-8e8f-2b58154ddf1a":{"__typename":"Testimonial","id":"d22eeaaf-8d26-4060-8e8f-2b58154ddf1a","text":"James is absolutely the best tutor one can wish for. He tutors both my kids 12 and 15 and they say they learn more from him than they learn in school (my daughter attends a rigorous college preparatory school). They both love working with him. He’s remarkable!","date":"2025-07-04 15:52:41.931+00","rating":5,"endorser":{"__typename":"Endorser","name":"Nilou Davidov ","tagline":"","avatar":null}},"Testimonial:216e66e6-7876-48c5-87d2-153238b92dcf":{"__typename":"Testimonial","id":"216e66e6-7876-48c5-87d2-153238b92dcf","text":"James is the REAL DEAL! Not only does he know his AP materials backwards and forwards, but more importantly, he gets my daughter! We've used him twice for different subjects and about to embark on a third for college essays! Thank you Curious Cardinals for such a perfect match!","date":"2025-06-06 17:20:24.462+00","rating":5,"endorser":{"__typename":"Endorser","name":"Dyanne C.","tagline":"","avatar":null}},"Testimonial:80c1b2da-dccd-49c9-9aec-235acb5af9dd":{"__typename":"Testimonial","id":"80c1b2da-dccd-49c9-9aec-235acb5af9dd","text":"Huge thanks to James who helped transform Teddy from a student who wants to get his homework done to a student who wants to learn. Bravo!","date":"2025-05-29 22:02:35.958+00","rating":5,"endorser":{"__typename":"Endorser","name":"Megan Bradley","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"7f5054f7-a287-4684-899d-3b1174268744\"}":{"__typename":"MentorPublicProfile","uuid":"7f5054f7-a287-4684-899d-3b1174268744","displayName":"James F.","slug":"james-feinberg","biography":"\u003cp\u003eI want you to learn the things that thrill you, that make your heart soar and expand your mind. I want to help you set off on a journey that \u003cem\u003eyou\u003c/em\u003e start, no one else -- because growing and learning just feels good.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was a Phi Beta Kappa creative writing concentrator at Brown -- in my undergraduate and postgraduate life, I've been focused above all on writing. I wrote for the NBC television show \u003cem\u003eThe Blacklist\u003c/em\u003e and have worked extensively in the musical theater. I am an experienced copy editor and cultural critic for publications like the \u003cem\u003eBroadway Journal\u003c/em\u003e and \u003cem\u003eDigitalTrends, \u003c/em\u003eand I'm a working writer of musical theater and screenplays working with Broadway producers and Academy Award-nominated filmmakers. I'm also an award-winning writer of short stories.  If you need help with a writing project in any area, or are interested in the background of the theatrical or film art forms, I'd love to talk about it with you!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a longtime member of the Met and MoMA, I love art and architecture history, which I studied extensively in my undergraduate years.  (My favorite painter is Edward Hopper, and I once wrote a musical about Claes Oldenburg.)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love to read novels and plays, and I love history! -- politics, both domestic and international, and how it shapes human lives.  (My specialties are American and European political history.)  I've worked as a researcher in these fields including for Academy Award-nominated filmmaker Kahane Cooperman and Emmy winner Michael Kantor. I can't wait to discuss stories true and imagined with you.\u003c/p\u003e","teachingVideoPlaybackId":"hUrsW02kaCAQu1Y1724dEleFqnNHoYthJ00RNSr278o84","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"19a3cb04-d1fc-43db-9fdf-c5f0b2d40e58\"}"},{"__ref":"Favorites:{\"uuid\":\"6f80ff1a-04de-489f-9d3f-d01e14e66194\"}"},{"__ref":"Favorites:{\"uuid\":\"faff282d-4604-4ab2-a7d4-8c5e88525a88\"}"}],"causesSupported":[],"major":"Literary Arts","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"73cc0ad2-e958-47fa-9f40-433ef78a34b0\"}"},{"__ref":"DeepDives:{\"uuid\":\"f64f6378-db6e-4915-8493-32e7b5754fee\"}"},{"__ref":"DeepDives:{\"uuid\":\"89fc0643-282f-4b15-b0eb-93aded585728\"}"},{"__ref":"DeepDives:{\"uuid\":\"160be640-1ce8-496e-8ced-251ae157f3a3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/09aaedd8-9ea2-41fa-befa-9cc161b36f36/-/preview/-/format/jpg/","https://ucarecdn.com/5e672897-eafd-4770-8aa0-8adf4a03d9ce/-/preview/-/format/jpg/","https://ucarecdn.com/e161a831-f548-4f07-b1d4-5a494b9c3d67/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"d3fcd66e-7a53-4317-9641-2ab2564d613a\"}"},{"__ref":"Education:{\"uuid\":\"17528bc9-335c-48ae-b292-a6af874c0b91\"}"}],"hiredAt":"2024-02-15T11:44:11.159Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","Film / Theater","History Project","Law / Gov
