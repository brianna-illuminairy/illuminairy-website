xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"7a07cb91-ec0c-4d2e-b627-2eca5c17ab33\"}":{"__typename":"DeepDives","uuid":"7a07cb91-ec0c-4d2e-b627-2eca5c17ab33","content":"\u003cp\u003eMy dream job would be a professor. To me, being a professor would be the best of both worlds, giving me the opportunity to teach and research. Because of how important mentorship is to me, being a professor would be the perfect way to prepare the next generation of scientists in such a crucial part of life. Additionally my passion for learning would be satisfied with the fascinating research I would conduct with fellow professors and engaged students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"698bf726-ef99-4d9f-8b2c-16cfadf874fe\"}":{"__typename":"DeepDives","uuid":"698bf726-ef99-4d9f-8b2c-16cfadf874fe","content":"\u003cp\u003eThroughout high school, I spent my summers doing very different things and working many jobs. I spent the majority of my summers working as a camp counselor for the Mini Pedals mountain bike camp. There, I coordinating elementary-schoolers and taught mountain biking skills to them. I also spent many summers working as a lifeguard at my local pool. Additionally, in high school I interned with Johns Hopkins APL and worked as a mechanic for a local bike shop.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0f64ab56-8078-4084-a2a7-57004096e10b\"}":{"__typename":"DeepDives","uuid":"0f64ab56-8078-4084-a2a7-57004096e10b","content":"\u003cp\u003eI was drawn to physics after my time working at APL and my electricity and magnetism class which I took the following year. I was somewhat bored by physics when taking AP Physics 1 in high school, but I quickly became more interested when the topics got more technical. I added my mathematics major in a similar fashion. I was not particularly interested in math until my calculus three class in college. For both of these topics, I love the problem solving focus of them - applying techniques in classes to real world applications (such as the research I am involved with).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"20caa2f0-c290-4733-8873-f856f58b696b\"}":{"__typename":"DeepDives","uuid":"20caa2f0-c290-4733-8873-f856f58b696b","content":"\u003cp\u003eMentorship is vital for me because I want to foster the same love and passion for learning that I have. I believe that being inspired to learn is key for all aspects of life and is an invaluable trait to have. For many, this love of learning is stifled out in school, with an overemphasis on tests and memorization. To me, this misses the point of learning and is why good mentors are important. Additionally, I believe that mentorship is key to giving back. I was lucky enough to grow up with inspiring mentors who fostered a passion for learning in me. Because of this, I believe that it is vital to give back and mentor the next generation of learners.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"9f76a2b7-b8b1-49f8-a6de-656e106fbf36\"}":{"__typename":"School","uuid":"9f76a2b7-b8b1-49f8-a6de-656e106fbf36","name":"Centennial High School","city":"Ellicott City","type":"HIGH","state":"Maryland","country":"United States","zip":"21042"},"Education:{\"uuid\":\"6fa10ca9-776b-442e-8aee-00f4494593ce\"}":{"__typename":"Education","uuid":"6fa10ca9-776b-442e-8aee-00f4494593ce","school":{"__ref":"School:{\"uuid\":\"9f76a2b7-b8b1-49f8-a6de-656e106fbf36\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"363a3954-974c-4a83-8149-91e84dc4c03b\"}":{"__typename":"School","uuid":"363a3954-974c-4a83-8149-91e84dc4c03b","name":"University of North Carolina at Chapel Hill","city":"Chapel Hill","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27599"},"Education:{\"uuid\":\"6d6c3ebd-9079-41a1-8502-f1c50c0baf92\"}":{"__typename":"Education","uuid":"6d6c3ebd-9079-41a1-8502-f1c50c0baf92","school":{"__ref":"School:{\"uuid\":\"363a3954-974c-4a83-8149-91e84dc4c03b\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Physics and Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"117b7afd-1c00-487a-ac37-b2df93115e90\"}":{"__typename":"MentorPublicProfile","uuid":"117b7afd-1c00-487a-ac37-b2df93115e90","displayName":"Oliver S.","slug":"oliver-snydal","biography":"\u003cp\u003eHi! My name is Oliver Snydal, and I’m a sophomore at the University of North Carolina at Chapel Hill, where I’m pursuing a double major in Physics and Mathematics. I love exploring the ways math can model and explain physical systems and I love learning about how our world works. For me, studying these subjects isn’t just about solving equations—it’s about developing a way of thinking that combines creativity, problem-solving, and persistence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy interest in physics began in high school, when I interned at the Johns Hopkins Applied Physics Laboratory. There, I worked with a team of fellow interns to map electromagnetic interference from super low frequency sources like powerlines. That experience introduced me to real scientific research, where collaboration and curiosity drive progress. Since then, I’ve expanded my experiences through an engineering internship at Parsons and by conducting research at UNC’s Physical Mathematics Lab, where I study speed oscillations in hydrodynamic systems and their analogues in quantum mechanics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I have always had a passion for learning. In high school, I graduated with a 4.86 weighted GPA and was an active member of both the National Math Honors Society and the Science National Honors Society. I also built a strong foundation in computer science, particularly in Java, Python, and Matlab, which I continue to use in my coursework and research. At UNC, I’ve found the balance of rigor and exploration I was hoping for, and I especially enjoy classes that connect abstract math to real-world applications.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I spend much of my time staying active. Throughout high school, I was a competitive cyclist and mountain biker, winning state championships in both disciplines and even competing nationally on the road. Those experiences taught me discipline, resilience, and how to perform under pressure—skills that I carry with me into my academic and professional work. These days, I still enjoy biking, along with skiing, running, and going to the gym. Beyond STEM and athletics, I also have a passion for history and love learning about how past events shape the present.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbove all, I care about making learning accessible and enjoyable for others. Through tutoring and teaching experiences in math and physics, I’ve found that approachability and clarity are the most valuable traits a mentor can have. These traits are the cornerstones to my teaching philosophy, inspiring me to create an open environment where questions and open dialogue are paramount to our success.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re looking for support in math, physics, or computer science, I’d be excited to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"01yAoaJjUVxGNYxpbHW02GPkTgbkOz01uGSBiQqL62JZGk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Physics and Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7a07cb91-ec0c-4d2e-b627-2eca5c17ab33\"}"},{"__ref":"DeepDives:{\"uuid\":\"698bf726-ef99-4d9f-8b2c-16cfadf874fe\"}"},{"__ref":"DeepDives:{\"uuid\":\"0f64ab56-8078-4084-a2a7-57004096e10b\"}"},{"__ref":"DeepDives:{\"uuid\":\"20caa2f0-c290-4733-8873-f856f58b696b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/01875f7a-fff6-4216-bb89-91df15f0f7ee/-/preview/-/format/jpg/","https://ucarecdn.com/653a7cca-5d70-4010-a4ef-55bbfa02c932/-/preview/-/format/jpg/","https://ucarecdn.com/8627f3da-395e-4e4f-95bf-d2ff07bd72fe/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6fa10ca9-776b-442e-8aee-00f4494593ce\"}"},{"__ref":"Education:{\"uuid\":\"6d6c3ebd-9079-41a1-8502-f1c50c0baf92\"}"}],"hiredAt":"2025-09-24T03:20:31.783Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Physics","Computer Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"oliver-snydal\"}})":{"__ref":"Me
