xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"47540a4b-84f0-4b3f-9d00-d89c496ad807\"}":{"__typename":"Favorites","uuid":"47540a4b-84f0-4b3f-9d00-d89c496ad807","photoUrl":"https://ucarecdn.com/535d95e2-5fd4-4dda-bc65-10385b5cd3f6/","title":"SZA, Daniel Caesar, Sade","type":"ARTIST"},"Favorites:{\"uuid\":\"cc5102fe-b3c3-4e28-a505-cf5588e1605d\"}":{"__typename":"Favorites","uuid":"cc5102fe-b3c3-4e28-a505-cf5588e1605d","photoUrl":"https://ucarecdn.com/0a894efc-8f66-4083-94c7-f56d56e52993/","title":"Parasite","type":"MOVIE"},"Favorites:{\"uuid\":\"30a7986f-e4b4-45e2-a162-36cbb9d5a3b1\"}":{"__typename":"Favorites","uuid":"30a7986f-e4b4-45e2-a162-36cbb9d5a3b1","photoUrl":"https://ucarecdn.com/e1792203-df55-45c8-86df-469ec3d92a6b/","title":"Tokyo","type":"CITY"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"11961da1-2a1d-483c-9976-ee1205b6a49d\"}":{"__typename":"DeepDives","uuid":"11961da1-2a1d-483c-9976-ee1205b6a49d","content":"\u003cp\u003eI love political science, math, and psychology, and I feel that economics is a great combination of all of those. I also read in a Macroeconomics textbook once that Economics majors make the most money.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6d87e7f9-330b-4cb2-aebc-6001bfb8bb5d\"}":{"__typename":"DeepDives","uuid":"6d87e7f9-330b-4cb2-aebc-6001bfb8bb5d","content":"\u003cp\u003eAs an oldest child, I didn't have much guidance in high school and college apps. I hope to use my experiences to be that resource for someone, and help in any way I can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b55b0c5a-eca2-45fd-8032-ba5237ff6bb5\"}":{"__typename":"DeepDives","uuid":"b55b0c5a-eca2-45fd-8032-ba5237ff6bb5","content":"\u003cp\u003eI would tell myself to care less about what other people think, and to always say yes to opportunities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d7758095-33fc-4019-8c72-58e03ba9ef03\"}":{"__typename":"DeepDives","uuid":"d7758095-33fc-4019-8c72-58e03ba9ef03","content":"\u003cp\u003eI want to travel the world and experience everything it has to offer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"4644a285-22bf-4856-91b2-4f682df7518a\"}":{"__typename":"School","uuid":"4644a285-22bf-4856-91b2-4f682df7518a","name":"Stevenson High School","city":"Lincolnshire","type":"HIGH","state":"Illinois","country":"United States","zip":"60069"},"Education:{\"uuid\":\"9228c02e-3661-42b1-ab2e-11882a1b7286\"}":{"__typename":"Education","uuid":"9228c02e-3661-42b1-ab2e-11882a1b7286","school":{"__ref":"School:{\"uuid\":\"4644a285-22bf-4856-91b2-4f682df7518a\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"9fb63827-f72c-430b-a75d-bdda2fa70681\"}":{"__typename":"Education","uuid":"9fb63827-f72c-430b-a75d-bdda2fa70681","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"2e1b320d-fbc8-4e3c-a9ee-558397e70737\"}":{"__typename":"MentorPublicProfile","uuid":"2e1b320d-fbc8-4e3c-a9ee-558397e70737","displayName":"Sydney L.","slug":"sydney-lam","biography":"\u003cp\u003eHi! My name is Sydney, and I am from the Chicagoland area. I am currently a sophomore at Cornell University studying Economics and Information Science, and I am passionate about education, social impact, and the intersection of law and business.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I discovered my love for public speaking through Model UN, which also sparked my interest in policy and advocacy. That interest grew through internships with the U.S. Congress and the Illinois State Legislature, where I worked alongside policymakers on campaigns and legislative research. Since then, I have spent my summers gaining hands-on experience in both business and legal settings, most recently interning at an intellectual property and entertainment law firm in Chicago.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Cornell, I am involved in a social impact consulting club, where I currently serve as a Project Manager. This past semester, I led a team of analysts to work with OverDrive on beta testing, marketing initiatives, and launch strategy for a new edtech platform. From this experience, I developed strong communication and professional skills, and learned how to manage a project from start to finish. I also discovered how rewarding it is to collaborate with clients to support their goals—something I hope to bring into my work with students of all ages.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs the oldest of three siblings, mentorship has always been important to me. From helping freshmen acclimate to high school, tutoring peers in math, and teaching public speaking and diplomacy skills through Model UN, I have loved supporting others as they grow in confidence and find their voice.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics and mentoring, I enjoy staying active through volleyball, pickleball, and trying new sports. I play piano and viola, and love listening to music (Daniel Caesar, SZA, Sade). I also have a YouTube channel where I edit and post videos of my life and travels! I am definitely an extrovert and bring that same curiosity and openness into my work as a mentor, always aiming to make students feel supported, confident, and capable.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMost of all, I am here to help you succeed. I am so excited to meet you and begin this journey of learning together!\u003c/p\u003e","teachingVideoPlaybackId":"EXUX91q2qyCigmrVDKHchmeKTfjwKFnj9gUC9FOuF7E","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOvercoming my fear of public speaking and becoming more confident in myself. I used to be a really shy person, but stepping out of my comfort zone has opened up so many opportunities for me!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"47540a4b-84f0-4b3f-9d00-d89c496ad807\"}"},{"__ref":"Favorites:{\"uuid\":\"cc5102fe-b3c3-4e28-a505-cf5588e1605d\"}"},{"__ref":"Favorites:{\"uuid\":\"30a7986f-e4b4-45e2-a162-36cbb9d5a3b1\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":
