pename":"DeepDives","uuid":"8fab3552-91c6-442b-b7c7-5929aeacfb75","content":null,"videoPlaybackId":"ybMUNMjmII2HuK78f9jif9RJL6g4Ho7eUX7rTPA9GqY","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"d387a014-6037-4b91-a4c2-65b9b4ed2ece\"}":{"__typename":"School","uuid":"d387a014-6037-4b91-a4c2-65b9b4ed2ece","name":"Taft High School","city":"Tarzana","type":"HIGH","state":"California","country":"United States","zip":"91364"},"Education:{\"uuid\":\"ee043bbb-05df-4bbf-b729-99505ab52aa0\"}":{"__typename":"Education","uuid":"ee043bbb-05df-4bbf-b729-99505ab52aa0","school":{"__ref":"School:{\"uuid\":\"d387a014-6037-4b91-a4c2-65b9b4ed2ece\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"6d3770e0-dd25-4f2c-84ca-b2506118fc74\"}":{"__typename":"Education","uuid":"6d3770e0-dd25-4f2c-84ca-b2506118fc74","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Music","degree":null},"MentorPublicProfile:{\"uuid\":\"bf9febf4-b9d5-485e-acfd-ec91bb207451\"}":{"__typename":"MentorPublicProfile","uuid":"bf9febf4-b9d5-485e-acfd-ec91bb207451","displayName":"Julien D.","slug":"julien-deculus","biography":"\u003cp\u003eFrom the moment my parents sat me down on the drum stool and placed sticks in my hands when I was two, music has been the love of my life. Much of my musical foundation is owed to my dad’s influence. Every morning on the way to school he played 60’s and 70’s soul music. He also ran his own professional zydeco band, which I got to play in! (For those who are unfamiliar, zydeco music is an upbeat traditional music belonging to the Afro-french Creole culture of Louisiana) These musical influences molded me into a very old soul. Once I learned the guitar at age 10, my songwriting and music creation journey began. I dove headfirst into John Mayer, Stevie Wonder, and Steely Dan. While simultaneously learning jazz, I started building a deeper understanding of how great musicians create popular songs with complex musical ideas. This concept has shaped my songwriting art. It wasn’t until after I had recorded an E.P. in my dad’s friend’s studio junior year of high school when I became interested in production. I slowly began transforming my acoustic songs into GarageBand demos. Since being at Brown however, my affinity for production has skyrocketed from being surrounded by others with similar interests. My latest summer internship was at a record label and music publisher, which gave me a much\u0026nbsp;broader perspective on the music industry and a much narrower vision for my future. While still holding true to my old soul roots, I have grown to love pop music and aim to be a professional pop writer and producer. The world of music production perpetually expands the deeper I dig into it, and I am truly becoming more and more obsessed with music every day. The concept of taking raw sounds and creating a compelling piece of art displayed as audio that sounds like gold is enticing to me. Aside from my ongoing production journey, I also run my own band at Brown, run the designated rehearsal rooms at Brown for student bands, and study entrepreneurship. All three of these endeavors help to test and develop my leadership skills and my ability to accomplish goals. Outside of music, I am a sports fan, as I played baseball throughout middle and high school, a rom-com and action movie lover, a major foodie, and a sucker for laughter.\u003c/p\u003e","teachingVideoPlaybackId":"8sRIUfWExqOghMucuSjrYplnh2uI3ylAXa85uN8iGO00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"ca
