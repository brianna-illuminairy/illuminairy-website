xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"56966bb8-980e-41b1-91ef-89b696709163\"}":{"__typename":"DeepDives","uuid":"56966bb8-980e-41b1-91ef-89b696709163","content":"\u003cp\u003e\u003cbr\u003eMentorship matters to me because a good mentor can make a huge difference in someone’s life. As an upperclassman in ROTC, I helped mentor and develop freshman and sophomore cadets. For me, one of the most important aspects of mentorship is helping a mentee establish goals and challenging them to take risks to achieve those goals. Often, I would see younger cadets struggle to perform academically or in ROTC because they did not have established goals or have anyone who encouraged them to take risks. It was these cadets I would reach out to and take under my wing, often seeing them perform better soon thereafter. Therefore, I’ve seen the effect that just a little bit of encouragement and support from a mentor can have on someone, and I hope to bring that to whoever comes my way.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d0f0884b-1404-4e7b-b365-83dc617cc0aa\"}":{"__typename":"DeepDives","uuid":"d0f0884b-1404-4e7b-b365-83dc617cc0aa","content":"\u003cp\u003eThroughout high school, I spent my summers as a lifeguard at my local swimming pool. In my neighborhood, the swimming pool is a central part of the community. Every summer, families and friends would gather to swim, barbeque, and hang out. It was also a bit of a ritual of passing for the teenagers in the neighborhood to become lifeguards. When I became a lifeguard, I felt extremely proud that I had passed this rite, but also nervous that I was trusted with the care of so many lives. These summers were some of the best of my life, as I became closer to the families in my community and got to hang out at the pool all summer. What isn’t there to love!?\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"abad8b4f-a4ac-4b22-a29f-93fe9a0cf91e\"}":{"__typename":"DeepDives","uuid":"abad8b4f-a4ac-4b22-a29f-93fe9a0cf91e","content":"\u003cp\u003eI’ve always admired people who are fluent in more than one language, whether it comes from a rich cultural background or years of dedicated study. I don't think there is anything more beautiful than traveling to a country and speaking its native language. It allows for deeper cultural immersion, providing new insights into a worldview that can only be fully appreciated through its own words.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat’s why I hope to become fluent in at least two languages in my lifetime. I studied French in high school and Italian in college; however, mastery of either is still far away. My goal is to refine my skills in these languages, and hopefully others, so that I can travel the world, connect more deeply with people from other countries, and learn new things.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3782e02d-bb97-491a-a861-fa7a23661350\"}":{"__typename":"DeepDives","uuid":"3782e02d-bb97-491a-a861-fa7a23661350","content":"\u003cp\u003eIn High School, I was shy and didn’t step out of my comfort zone very often. I tended to continue doing what I had done in the past, without trying many new things. If I were to advise my younger self, I would tell him to take more risks and try new things! For example, asking out a girl from class, or trying a new sport. I think new experiences and taking risks are what allow us to grow and build our character, and this is something I wish I had realized earlier.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"c56e7ab2-e06e-4eac-9a03-e7b77ff4a0da\"}":{"__typename":"School","uuid":"c56e7ab2-e06e-4eac-9a03-e7b77ff4a0da","name":"Walter Johnson High School","city":"Bethesda","type":"HIGH","state":"Maryland","country":"United States","zip":"20814"},"Education:{\"uuid\":\"0f20a010-b6b2-468c-ad94-371451b79f7f\"}":{"__typename":"Education","uuid":"0f20a010-b6b2-468c-ad94-371451b79f7f","school":{"__ref":"School:{\"uuid\":\"c56e7ab2-e06e-4eac-9a03-e7b77ff4a0da\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1b89da69-566e-4d93-bda4-17fc6b05b1d1\"}":{"__typename":"Education","uuid":"1b89da69-566e-4d93-bda4-17fc6b05b1d1","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Physics","degree":null},"Testimonial:64537cf2-f0ed-4919-9294-5055dd136e08":{"__typename":"Testimonial","id":"64537cf2-f0ed-4919-9294-5055dd136e08","text":"Eli has been an exceptional mentor for Pax. From the very first session, he established a professional yet warm connection that immediately put Pax at ease and sparked his excitement for learning. What has impressed me most is how thoughtfully Eli weaves Pax’s love of science and engineering into his writing practice—suddenly, grammar and sentence structure aren’t just rules, but tools to bring his ideas to life.\n\nPax looks forward to every session with Eli. Their discussions around books like The Martian have not only expanded his vocabulary and comprehension but also encouraged him to see storytelling through the lens of science, which is exactly the type of learning experience he craves. Eli’s ability to guide Pax through editing, citations, and deeper analysis—while still keeping the sessions engaging—has been remarkable.\n\nAs a parent, I’ve been grateful to witness Pax’s growing confidence and enjoyment in reading and writing, subjects he once approached with hesitation. Eli’s mentorship has been professional, inspiring, and tailored in a way that truly honors Pax’s curiosity and creativity. I couldn’t recommend him more highly.","date":"2025-08-25 14:45:24.698+00","rating":5,"endorser":{"__typename":"Endorser","name":"Nina Wallin","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"7e210233-dcea-4847-9956-713f209fc5a9\"}":{"__typename":"MentorPublicProfile","uuid":"7e210233-dcea-4847-9956-713f209fc5a9","displayName":"Eli B.","slug":"eli-bader","biography":"\u003cp\u003e\u003cbr\u003eEli is originally from Kensington, Maryland, and recently graduated from Yale University, where he earned a B.S. in Physics. He first developed a passion for physics in high school through AP Physics, where he discovered that interactions in the physical world could be predicted and calculated using scientific principles. Eli’s passion for physics extends beyond the classroom, as he worked in an astrophysics and radio astronomy lab from his sophomore year until graduation. He will also work as an assistant researcher at NYU’s Center for Quantum Information Physics this summer.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, Eli was part of the AFROTC program and was commissioned into the Air Force as a Second Lieutenant in May 2025. He will continue as an Intelligence Officer in the Air National Guard. During his time in AFROTC, Eli served as a Flight Commander, directly responsible for the mentorship and development of 15 cadets, as well as Vice Wing Commander, the second in command of the unit. In AFROTC, Eli mentored and taught younger cadets, empowering them to take risks and learn from their mistakes.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEli also dedicated (probably too much) time to Yale intramural sports and served as the Intramural Secretary for his residential college. He studied Italian for three years and was a member of the Yale Italian Club, a group that facilitated language practice and exchange between undergraduate students.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn his free time, Eli enjoys playing cards with friends, reading, and completing all of the New York Times games and puzzles. He also loves to stay active, enjoying rock climbing, snowboarding, and hiking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHe is incredibly excited to begin a mentorship journey with whoever comes his way!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"x3HQ3TFV3sPDoyqDzp02vO6GNFWuU1fZMPaOErYZSUBk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"56966bb8-980e-41b1-91ef-89b696709163\"}"},{"__ref":"DeepDives:{\"uuid\":\"d0f0884b-1404-4e7b-b365-83dc617cc0aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"abad8b4f-a4ac-4b22-a29f-93fe9a0cf91e\"}"},{"__ref":"DeepDives:{\"uuid\":\"3782e02d-bb97-491a-a861-fa7a23661350\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1dbd9db1-138f-4aae-8dff-72666c4c6fc0/-/preview/-/format/jpg/","https://ucarecdn.com/9f914487-0804-4b8b-abfa-01956ccb8385/-/preview/-/format/jpg/","https://ucarecdn.com/054e510d-a042-481d-a799-e422e5dc8903/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"0f20a010-b6b2-468c-ad94-371451b79f7f\"}"},{"__ref":"Education:{\"uuid\":\"1b89da69-566e-4d93-bda4-17fc6b05b1d1\"}"}],"hiredAt":"2025-05-14T14:58:57.611Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Writing","Executive Function","Academic Coaching","History","College Essay Writing","Reading"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:64537cf2-f0ed-4919-9294-5055dd136e08"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"eli-bader\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7e210233-dcea-4847-9956-713f209fc5a9\"}"}}},"_sentryTraceData":"fc1b6df4fa6c4a21bea6384344837f01-9bb5872be23f5049-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=fc1b6df4fa6c4a21bea6384344837f01,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"eli-bader"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerously
