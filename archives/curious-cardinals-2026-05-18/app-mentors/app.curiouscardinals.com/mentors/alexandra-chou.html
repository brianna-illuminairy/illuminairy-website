xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"53a221d2-bc04-4b29-8287-d97bc435a5cf\"}":{"__typename":"DeepDives","uuid":"53a221d2-bc04-4b29-8287-d97bc435a5cf","content":"\u003cp\u003eDon’t be afraid to ask questions. When I was younger, I often felt intimidated to ask my mentors or teachers for help, thinking it was a sign of weakness. But over time, I’ve realized that couldn’t be further from the truth! Asking questions is one of the most important ways to learn and grow—it shows you’re engaged, curious, and eager to deepen your understanding. There’s no such thing as a stupid question; every question brings you one step closer to confidence, and success!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"52657960-cf50-4dac-9772-3348e4eceb51\"}":{"__typename":"DeepDives","uuid":"52657960-cf50-4dac-9772-3348e4eceb51","content":"\u003cp\u003eMentorship matters to me because having someone believe in you, guide you, and encourage you can make all the difference in your growth. From my own experience—going to a traditional local school in Hong Kong—I know that learning isn’t always a linear path; there are moments of doubt, confusion, and frustration. A good mentor helps you navigate those challenges, not by giving you the answers, but by building your confidence to find them on your own. I see mentorship as a way to support students not just academically, but also to empower them to believe in themselves and pursue a\u0026nbsp;subject/topic they are passionate about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"1ed9d874-df0d-457b-b8cd-d912f0cdfc2f\"}":{"__typename":"DeepDives","uuid":"1ed9d874-df0d-457b-b8cd-d912f0cdfc2f","content":"\u003cp\u003eThis is always a tough question to answer, but I hope my future job will combine my passions for cities, creativity, and community impact. Currently, I am interested in working in fields like real estate development, urban planning consulting, or creative roles in marketing and communications. I’ve always been interested in how people experience cities, and I’d love to be part of a field where I can help shape that experience and make an impact.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"8d5cff1e-932f-4740-9adc-60ca527af990\"}":{"__typename":"DeepDives","uuid":"8d5cff1e-932f-4740-9adc-60ca527af990","content":"\u003cp\u003eFor all four years of high school, I volunteered with Ronald McDonald House Charities, a global organization that supports children suffering from cancer. I first reached out to them during COVID, when they mentioned they needed extra help. I co-created bilingual activity booklets for the children, filled with mazes, crossword puzzles, and math problems. Our goal was to make the booklets both fun and educational, providing a small source of joy and learning during a very isolating time. It was an incredibly rewarding experience, and it made me so happy to see how excited the children were about our booklets!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"28dc9414-39f2-4281-9471-f58ee71688b7\"}":{"__typename":"School","uuid":"28dc9414-39f2-4281-9471-f58ee71688b7","name":"The Hotchkiss School","city":"Lakeville","type":"HIGH","state":"Connecticut ","country":"USA","zip":"06039"},"Education:{\"uuid\":\"46846b3e-b874-4c7e-b661-c4d256c8c357\"}":{"__typename":"Education","uuid":"46846b3e-b874-4c7e-b661-c4d256c8c357","school":{"__ref":"School:{\"uuid\":\"28dc9414-39f2-4281-9471-f58ee71688b7\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"6dc30b8d-f8fc-4bbe-bb94-4e64051fcfe4\"}":{"__typename":"Education","uuid":"6dc30b8d-f8fc-4bbe-bb94-4e64051fcfe4","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Urban and Regional Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"90854219-3ad3-4c94-adb2-dff11ab73fc3\"}":{"__typename":"MentorPublicProfile","uuid":"90854219-3ad3-4c94-adb2-dff11ab73fc3","displayName":"Alexandra C.","slug":"alexandra-chou","biography":"\u003cp\u003eHi! I’m Alex, a sophomore at Cornell’s Architecture, Art, and Planning School, majoring in Urban and Regional Studies with a minor in Business. I grew up in Hong Kong and later attended The Hotchkiss School in Connecticut, where I was Editor-in-Chief of the Yearbook, a Head Admissions Tour Guide, and a Dormitory Proctor. At Cornell, I am a member of the Cornell Real Estate Club and serve as an Operations Associate for The Cornell Wardrobe, a student-run organization that provides professional attire to students.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy interest in Urban Planning began by living in Hong Kong and now studying in the US, where I became intrigued by how cities function, grow, and differ from one another. Photography became a creative outlet for me to explore these ideas. In high school, I curated a photography portfolio that documented the lives of domestic workers in Hong Kong, showcasing the urban and social inequalities they face on a daily basis.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCommunity work is something I am also passionate about. I’ve volunteered with Ronald McDonald House Charities in Hong Kong for several years, creating bilingual (English and Chinese) activity booklets to support children with cancer during COVID. I also helped produce marketing videos to illustrate the organization’s facilities and programs.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my free time, I love trying new restaurants (I’m a big fan of Beli), drinking matcha, playing squash and pickleball, or browsing for my next favorite read. As a mentor, I hope to not only help students grow academically, but also build confidence and skills that will stay with them beyond the classroom!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"ViwEvJUR4UNgGfyxXQ02SjIef3UvJ4gUkb1p4I1tHhuE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Urban and Regional Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"53a221d2-bc04-4b29-8287-d97bc435a5cf\"}"},{"__ref":"DeepDives:{\"uuid\":\"52657960-cf50-4dac-9772-3348e4eceb51\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ed9d874-df0d-457b-b8cd-d912f0cdfc2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"8d5cff1e-932f-4740-9adc-60ca527af990\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4e2479a1-1660-41fe-87d0-866aef16fb7a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"46846b3e-b874-4c7e-b661-c4d256c8c357\"}"},{"__ref":"Education:{\"uuid\":\"6dc30b8d-f8fc-4bbe-bb94-4e64051fcfe4\"}"}],"hiredAt":"2025-04-23T09:29:19.529Z","topics":["K-5 Grade Math","6-8 Grade Science","Writing","Mandarin Chinese","Executive Function","History","Reading","Creative Writing","Fashion / Cosmetics","History Project","K-6 Storybook","Video / Photography","Business / Entrepreneurship","Journalism","Law / Government / Policy","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexandra-chou\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"90854219-3ad3-4c94-adb2-dff11ab73fc3\"}"}}},"_sentryTraceData":"0e5bdf2eac5a4eee937c2a31474551c0-90a9b8f9a907233f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=0e5bdf2eac5a4eee937c2a31474551c0,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"alexandra-chou"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5
