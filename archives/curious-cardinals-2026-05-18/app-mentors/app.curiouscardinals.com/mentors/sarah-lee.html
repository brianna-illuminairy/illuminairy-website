ackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d1f1744d-c94c-4adb-826e-796a1207e2e0\"}":{"__typename":"DeepDives","uuid":"d1f1744d-c94c-4adb-826e-796a1207e2e0","content":"\u003cp\u003eYour mental health comes first, always.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"05a0be8a-5af8-4ae8-89c9-06ebc52c7e8e\"}":{"__typename":"School","uuid":"05a0be8a-5af8-4ae8-89c9-06ebc52c7e8e","name":"Arcadia High School","city":"Arcadia","type":"HIGH","state":"California","country":"United States","zip":"91006"},"Education:{\"uuid\":\"46393261-1953-4f39-8878-aed8529e6e50\"}":{"__typename":"Education","uuid":"46393261-1953-4f39-8878-aed8529e6e50","school":{"__ref":"School:{\"uuid\":\"05a0be8a-5af8-4ae8-89c9-06ebc52c7e8e\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7d93351b-74ba-4547-a2c0-5936fc38edc9\"}":{"__typename":"Education","uuid":"7d93351b-74ba-4547-a2c0-5936fc38edc9","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"International Relations and Human Rights","degree":null},"MentorPublicProfile:{\"uuid\":\"f7ca9145-9aa1-4824-9379-08dcd8ef8906\"}":{"__typename":"MentorPublicProfile","uuid":"f7ca9145-9aa1-4824-9379-08dcd8ef8906","displayName":"Sarah L.","slug":"sarah-lee","biography":"\u003cp\u003eHi there! My name is Sarah. When I think about my North Star for how I approach education, career, and mentorship, I think about a quote from one of my greatest role models: Chanel Miller. “Stay tender with your power.”\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI seek to integrate tenderness and humanity into all I learn and accomplish, centered around my passions for human rights, storytelling, and written advocacy. At Stanford, I dedicated myself to studying diverse communities, cultures, and ways of being, ultimately graduating in June 2023 with an M.A. in Public Policy, a B.A. in International Relations with Honors in Democracy, Development, and the Rule of Law, and a minor in Human Rights. From writing my thesis on the role of civil society in content governance to dissecting the impacts of misinformation on U.S. elections, I’m particularly fascinated by the evolving intersection between technology, human rights, and democracy. How do we exist with each other, and the technologies we create, in this new digital era?\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eStill, so much of what I learned during my college years stemmed from experiences beyond the classroom and research. Throughout my summers, I interned at a variety of legal aid nonprofits and human rights and democracy-focused NGOs, aiming to support missions that I believed in—that legal services should be accessible for all, that civilian communities in conflict zones have a right to autonomy and protection, and that human rights defenders under repressive regimes need access to rapid response funds. Last summer, I worked at a speechwriting firm, honing my strategic advocacy skills by crafting narratives of impact and calls to action. I now work as as a tech policy associate at a woman-owned startup in San Francisco, with the goal of applying to law school in a few years.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOne of my greatest joys is helping others tap into their own superpowers—including their voices, empathy, and authenticity. On campus, I worked as a peer writing tutor at Stanford’s writing center, collaborating 1:1 with students to better communicate their stories, messages, and curiosities with a variety of audiences. Finally, for four years, I also served as a Families Coordinator, Unit Leader, and cabin counselor for Camp Kesem, a sleepaway camp and year-long community for children affected by a parent’s cancer. There, I learned how magic arises when you provide a space for kids to be their most authentic selves, and to embrace vulnerability—and tenderness—with mentors, peers, and community.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI remember having no idea what I wanted to do with my life in middle school or high school. (That feeling still comes up even now!) But I found classes, communities, and activities that resonated with me because they made me \u003cem\u003efeel\u003c/em\u003e something—AP U.S. History, speech and debate, Constitution Team, student government, and volunteer groups. I let myself lead with tenderness, and as a result, I felt empowered to leave the world a little better than how I left it. That philosophy has carried me forward to this moment, and it’s what I’d like to bring to mentoring your student, whether in honing their writing skills or learning about how our government works. I hope that they can learn not only how systems and institutions are, but what they \u003cem\u003ecan\u003c/em\u003e be. And most of all, I hope to help them recognize and develop their own superpowers toward whatever change they’d like to make.\u003c/p\u003e","teachingVideoPlaybackId":"BRIo1RpfbJSjg4c2UF100l6UfcGYzs3KMLvAbhd02Hlik","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c92b2e57-b869-427e-b982-84a02e5bcd3c\"}"},{"__ref":"Favorites:{\"uuid\":\"056b02d3-2fdd-4f52-9f1a-e6fa059d8b8f\"}"},{"__ref":"Favorites:{\"uuid\":\"01d4ff48-c695-44fe-82c5-b6e6c737da1b\"}"}],"causesSupported":[],"major":"International Relations and Human Rights","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"99f925a8-93a6-420a-b7b6-510ec721fab8\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f61885b-2b79-413b-9dd9-cf2a15b8ac1b\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1f1744d-c94c-4adb-826e-796a1207e2e0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0bf22674-445e-49cc-a571-5dc3faff3cbb/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"46393261-1953-4f39-8878-aed8529e6e50\"}"},{"__ref":"Education:{\"uuid\":\"7d93351b-74ba-4547-a2c0-5936fc38edc9\"}"}],"hiredAt":"2023-07-12T20:08:53.833Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sarah-lee\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f7ca9145-9aa1-4824-9379-08dcd8ef8906\"}"}}},"_sentryTraceData":"b30d4bb6fbaa4cada2fffd1a35f03515-ac32d747dde619ff-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b30d4bb6fbaa4cada2fffd1a35f03515,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sarah-lee"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gt
