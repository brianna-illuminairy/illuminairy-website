xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1684e414-7b41-4abc-b77c-5c276dfd6532\"}":{"__typename":"Favorites","uuid":"1684e414-7b41-4abc-b77c-5c276dfd6532","photoUrl":"https://ucarecdn.com/8c5c6bfc-5a82-4430-96af-afcc31037278/","title":"Noah Kahan","type":"ARTIST"},"Favorites:{\"uuid\":\"85760e34-d3ea-47ba-aab9-8d32a301e850\"}":{"__typename":"Favorites","uuid":"85760e34-d3ea-47ba-aab9-8d32a301e850","photoUrl":"https://ucarecdn.com/86122ce9-6742-4c1d-9f10-2c26c59caf3e/","title":"Boston, Massachusetts","type":"CITY"},"Favorites:{\"uuid\":\"2a39d94a-cda1-4f72-aa09-4cae5328edca\"}":{"__typename":"Favorites","uuid":"2a39d94a-cda1-4f72-aa09-4cae5328edca","photoUrl":"https://ucarecdn.com/670c9086-5daa-4e9f-a4fa-2eb576e80038/","title":"Soccer","type":"SPORT"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"7af220b2-d397-4693-8664-79009e0dc5ca\"}":{"__typename":"DeepDives","uuid":"7af220b2-d397-4693-8664-79009e0dc5ca","content":"\u003cp\u003eMy greatest role model is my dad. He has always modeled consistency, integrity, and a strong work ethic in everything he does. What I admire most is not just his professional drive, but the way he shows up for the people around him — steady, thoughtful, and dependable. Watching him balance ambition with humility has shaped how I approach both my goals and my relationships, and he continues to influence the way I lead, work, and support others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"98d4d7fe-9b0c-4fe4-9cf0-10104c4fbfc1\"}":{"__typename":"DeepDives","uuid":"98d4d7fe-9b0c-4fe4-9cf0-10104c4fbfc1","content":"\u003cp\u003eMentorship matters to me because I’ve seen firsthand how much it can shape someone’s path. I’ve had coaches, professors, and advisors who challenged me, believed in me, and helped me navigate moments that felt uncertain. Their guidance gave me confidence and clarity when I needed it most.\u003c/p\u003e\u003cp\u003eI wouldn’t be where I am without people who invested in my growth, and I feel a strong responsibility to return that favor. I want to help others build confidence, overcome challenges, and realize their potential — just like my mentors did for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e37e2232-58ef-4b42-9eda-ae341c5630fa\"}":{"__typename":"DeepDives","uuid":"e37e2232-58ef-4b42-9eda-ae341c5630fa","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to live and work abroad for an extended period of time. Not just travel, but fully immerse myself in another country’s culture, language, and way of life. I’d love to spend a few years working internationally, whether in Europe or Latin America, and truly understand how people think, work, and build community in a different context.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0083f1d3-8762-4692-a308-6544d7b8f5e4\"}":{"__typename":"DeepDives","uuid":"0083f1d3-8762-4692-a308-6544d7b8f5e4","content":"\u003cp\u003eIn my spare time, I like to stay active and spend time outdoors. A lot of my week is structured around academics and training, so I enjoy doing things that help me reset like running, lifting, or just getting outside for a walk. I also really value time with friends and teammates, whether that’s grabbing coffee, watching a game, or just unwinding after a long day.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"5263e901-e6bd-4a00-97c7-bcfcb898dd35\"}":{"__typename":"School","uuid":"5263e901-e6bd-4a00-97c7-bcfcb898dd35","name":"Noble and Greenough School","city":"Dedham","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02026"},"Education:{\"uuid\":\"79cd1faf-a211-4f88-a24a-5a3430839d9c\"}":{"__typename":"Education","uuid":"79cd1faf-a211-4f88-a24a-5a3430839d9c","school":{"__ref":"School:{\"uuid\":\"5263e901-e6bd-4a00-97c7-bcfcb898dd35\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"adb52e44-0d62-4814-a1af-f1ca63442230\"}":{"__typename":"School","uuid":"adb52e44-0d62-4814-a1af-f1ca63442230","name":"Trinity College","city":"Hartford","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06106"},"Education:{\"uuid\":\"c3c894fb-1dc8-444f-8a5c-987a0a78970a\"}":{"__typename":"Education","uuid":"c3c894fb-1dc8-444f-8a5c-987a0a78970a","school":{"__ref":"School:{\"uuid\":\"adb52e44-0d62-4814-a1af-f1ca63442230\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"3b5128c4-1b2b-4fe6-8c26-d6fcd0ed31d9\"}":{"__typename":"MentorPublicProfile","uuid":"3b5128c4-1b2b-4fe6-8c26-d6fcd0ed31d9","displayName":"Owen M.","slug":"owen-myers","biography":"\u003cp\u003eHi! I’m Owen, a junior at Trinity College pursuing a B.S. in Economics with minors in Applied Mathematics and Hispanic Studies. I care deeply about helping students build confidence in their abilities — especially in subjects that can initially feel intimidating like math, economics, and writing. I believe learning is most powerful when it shifts from memorizing steps to truly understanding why something works. That moment when a concept “clicks” is what I love most about teaching.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I spend much of my time working in quantitative and analytical spaces. I serve as a Teaching Assistant for Econometrics, where I help lead Stata programming labs, hold office hours, and support students in applying statistical methods to real-world data. This role has strengthened my ability to break down complex material into clear, manageable steps and meet students where they are. My coursework spans macroeconomics, microeconomics, statistics, advanced calculus, differential equations, and mathematical economics, and I enjoy helping students see the connections between these disciplines. I have received faculty honors in every semester, and I am also on merit scholarship. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond the classroom, I’m a two-sport varsity athlete, competing in both men’s rowing and men’s soccer. Balancing high-level athletics with academics has taught me discipline, resilience, and time management, but more importantly, it has shown me how powerful steady effort and accountability can be. Being part of teams that depend on trust and communication has shaped how I approach mentorship. Growth happens best when people feel supported and challenged at the same time.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I’ve been deeply involved in career development work. I previously worked at the Stanford Life Design Lab, where I helped support programming focused on intentional career exploration and personal development. That experience shaped how I think about long-term growth and decision-making. At Trinity, I’ve continued this work as an intern in the Career \u0026amp; Life Design Center, where I assist students with resume writing, networking strategies, and internship preparation. Helping students navigate big decisions has reinforced my belief that confidence comes from preparation, reflection, and consistent action.\u003c/p\u003e\u003cp\u003eThrough internships in finance and investment analysis, I’ve also gained experience in research, financial modeling, and client communication, which allows me to connect academic concepts to real-world applications.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAbove all, I care about helping students not only succeed academically, but also grow into confident, curious, and resilient learners. Whether that means mastering algebra, refining an essay, preparing for an internship, or building study systems that actually work, I aim to be both a mentor and a role model who makes learning feel empowering.\u003c/p\u003e","teachingVideoPlaybackId":"ZISoEgcJDXlTDKKrL61011n01Csk8LPJCm889tH8EZZDY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am on the rowing team at Trinity, and I was part of the crew that won the national championship last year. It was an amazing experience.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"1684e414-7b41-4abc-b77c-5c276dfd6532\"}"},{"__ref":"Favorites:{\"uuid\":\"85760e34-d3ea-47ba-aab9-8d32a301e850\"}"},{"__ref":"Favorites:{\"uuid\":\"2a39d94a-cda1-4f72-aa09-4cae5328edca\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7af220b2-d397-4693-8664-79009e0dc5ca\"}"},{"__ref":"DeepDives:{\"uuid\":\"98d4d7fe-9b0c-4fe4-9cf0-10104c4fbfc1\"}"},{"__ref":"DeepDives:{\"uuid\":\"e37e2232-
