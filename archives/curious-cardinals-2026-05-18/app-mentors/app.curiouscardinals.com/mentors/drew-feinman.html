xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"680de6e1-5aee-4c1c-8396-7169e41604bf\"}":{"__typename":"Favorites","uuid":"680de6e1-5aee-4c1c-8396-7169e41604bf","photoUrl":"https://ucarecdn.com/08d9ffec-0ba1-4a30-b007-ebb7894b6310/","title":"Jennifer Coolidge","type":"ACTOR"},"Favorites:{\"uuid\":\"10fdda2e-338a-4464-9b38-35ed5f21e430\"}":{"__typename":"Favorites","uuid":"10fdda2e-338a-4464-9b38-35ed5f21e430","photoUrl":"https://ucarecdn.com/08d9ffec-0ba1-4a30-b007-ebb7894b6310/","title":"Ctrl by SZA","type":"ALBUM"},"Favorites:{\"uuid\":\"6f14d91a-1580-4bb7-acef-29f08b99de7e\"}":{"__typename":"Favorites","uuid":"6f14d91a-1580-4bb7-acef-29f08b99de7e","photoUrl":"https://ucarecdn.com/08d9ffec-0ba1-4a30-b007-ebb7894b6310/","title":"Swing Time by Zadie Smith","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"43a256b6-af19-4e98-a9c7-f06ed2c4de0e\"}":{"__typename":"DeepDives","uuid":"43a256b6-af19-4e98-a9c7-f06ed2c4de0e","content":"\u003cp\u003eStay weird! What makes you stand out is what makes you interesting. Your friends are the people who love you for this and support you to grow even more.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d0a23fa2-e013-4a3f-b8d6-792ec8a7d1db\"}":{"__typename":"DeepDives","uuid":"d0a23fa2-e013-4a3f-b8d6-792ec8a7d1db","content":"\u003cp\u003eA real mentorship takes time and trust in order to fully develop. A mentor should understand what type of support their mentee needs, and adjust their own approach for the greatest impact. If the relationship is good, then a mentee should trust the taste of their mentor, allowing the mentee to come to the mentor with bigger questions. I've had several important mentors in my life, who have exposed me to opportunities and paths that I never even imagined. It took time to get to know them well, but I still rely on their judgment even today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"898c4d7f-efa6-41dc-b8b6-474dcff942fd\"}":{"__typename":"DeepDives","uuid":"898c4d7f-efa6-41dc-b8b6-474dcff942fd","content":"\u003cp\u003eI hope to write my own sitcom!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8a805ec4-531d-48e1-b359-d306fc635c0f\"}":{"__typename":"DeepDives","uuid":"8a805ec4-531d-48e1-b359-d306fc635c0f","content":"\u003cp\u003eDuring my last year at Stanford, I wrote, acted, and produced a web-series which was recently published on YouTube. I created it with a good friend of mine, and we starred in it together. What made the project so special is the creative autonomy we had to make something that was truly ours, from top to bottom. We knew how to write it, but to actually make the series proved extremely difficult. However, we were dedicated to making it happen, allowing us to overcome a lot of scary roadblocks that might have stopped us from trying something like this in the future. This Spring, we held a premier of the first episode for fifty close friends. I didn't watch the episode, but rather the people I cared about as they laughed at something we had poured our heart in soul into. I will remember that moment for a long time. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"8d582739-7652-4fec-9820-9de212ae08d6\"}":{"__typename":"School","uuid":"8d582739-7652-4fec-9820-9de212ae08d6","name":"Crossroads School for Arts \u0026 Sciences","city":"Santa Monica","type":"HIGH","state":"California","country":"United States","zip":"90404"},"Education:{\"uuid\":\"fd2916c5-2cf2-4cce-8d9c-7bdc3934f541\"}":{"__typename":"Education","uuid":"fd2916c5-2cf2-4cce-8d9c-7bdc3934f541","school":{"__ref":"School:{\"uuid\":\"8d582739-7652-4fec-9820-9de212ae08d6\"}"},"startYear":"2006","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7e956a92-f0aa-4534-8ce2-9e929acd0146\"}":{"__typename":"Education","uuid":"7e956a92-f0aa-4534-8ce2-9e929acd0146","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"English with an Emphasis in Creative Writing","degree":null},"MentorPublicProfile:{\"uuid\":\"eddae927-e939-41c8-a0f2-f743b86ad36d\"}":{"__typename":"MentorPublicProfile","uuid":"eddae927-e939-41c8-a0f2-f743b86ad36d","displayName":"Drew F.","slug":"drew-feinman","biography":"\u003cp\u003eCa Caw! Ca Caw! Are you curious what that sound is? Then you must be a cardinal. I'm Drew, and I'm a recent graduate from Stanford University, where I studied English with an emphasis in Creative Writing (that's why I knew how to spell Ca Caw). I learned how to write in my high-school's Theatre Conservatory, where I took classes in acting, directing, improv, and producing. At Stanford, I found my niche in Stanford's premier (and only) sketch comedy group, the Robber Barons. To culminate my time in school, I wrote, acted, and produced a web-series which was recently published on YouTube. In January, I'll start work at United Talent Agency in their mailroom!\u003cbr\u003e\u003cbr\u003eOutside of that, I'm an avid knitter, am conversational in French, and, and I'm a certified Yoga instructor.\u003c/p\u003e","teachingVideoPlaybackId":"JoQw6NTJJ45MG3swhupyDhyvvr02S01HDa3UDZExBwVRQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"680de6e1-5aee-4c1c-8396-7169e41604bf\"}"},{"__ref":"Favorites:{\"uuid\":\"10fdda2e-338a-4464-9b38-35ed5f21e430\"}"},{"__ref":"Favorites:{\"uuid\":\"6f14d91a-1580-4bb7-acef-29f08b99de7e\"}"}],"causesSupported":[],"major":"English with an Emphasis in Creative Writing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"43a256b6-af19-4e98-a9c7-f06ed2c4de0e\"}"},{"__ref":"DeepDives:{\"uuid\":\"d0a23fa2-e013-4a3f-b8d6-792ec8a7d1db\"}"},{"__ref":"DeepDives:{\"uuid\":\"898c4d7f-efa6-41dc-b8b6-474dcff942fd\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a805ec4-531d-48e1-b359-d306fc635c0f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4edded1b-5e92-4de3-bacf-783031869fa6/-/preview/-/format/jpg/","https://ucarecdn.com/e8b500c9-efcb-4760-89c3-e30b9b25fd8a/-/preview/-/format/jpg/","https://ucarecdn.com/37d89d60-282c-470c-92b8-6cf52fdf73d1/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"fd2916c5-2cf2-4cce-8d9c-7bdc3934f541\"}"},{"__ref":"Education:{\"uuid\":\"7e956a92-f0aa-4534-8ce2-9e929acd0146\"}"}],"hiredAt
