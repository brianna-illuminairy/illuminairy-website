xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ea806844-7f9d-45f0-b456-3fb15b1a25aa\"}":{"__typename":"DeepDives","uuid":"ea806844-7f9d-45f0-b456-3fb15b1a25aa","content":"\u003cp\u003eYou are surrounded by potential mentors. So many of the adults you admire love you and want you to succeed-- but they can't step into the mentor role until you ask! Think outside the box; ask people you think are cool to let you shadow them at their job one day, teach you a new skill, or talk to you about the lessons they've learned in their lives. Asking people for favors is scary, especially when you can't offer them anything in return right now. But don't underestimate how much joy being a mentor can bring to people. Sometimes small favors are exactly what's needed to bring a relationship to the next level! And one day, you'll have the chance to return the favor by serving as a mentor to others. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"55a5b3cf-1193-4e41-b93c-390ea46b3301\"}":{"__typename":"DeepDives","uuid":"55a5b3cf-1193-4e41-b93c-390ea46b3301","content":"\u003cp\u003eI've been really lucky in my life; so many amazing people have loved me and educated me into the person I am today. I also believe every advantage life gives you comes with a responsibility to pay it forward. For me, that means helping the next generation to become kind and curious people. I wear many hats--teacher, NGO worker, daughter, friend-- but the most meaningful hat to me is that of mentor. I love working to help my mentees learn what makes them special and needed in this world. In turn, their growth gives me inspiration to continue my work in human rights and to help make the world a better place.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"56caa0e5-2e5c-4b2a-9ee8-93852a89d86a\"}":{"__typename":"DeepDives","uuid":"56caa0e5-2e5c-4b2a-9ee8-93852a89d86a","content":"\u003cp\u003eBeing Jewish is just one aspect of my identity, but it has had a huge impact on my teaching style! At its core, Judaism is about asking really difficult questions and understanding that there is almost always no one, correct answer. The Rabbis who wrote the Talmud believed that no question was out of bound, because only though open and free debate and curiosity could you actually make progress in understanding the world and yourself. As a teacher, this is also my philosophy. I utilize the Socratic Method to ask my students to consider a wide variety of approaches. While their answers are important to me, much more important is their capacity to ask thought-provoking and difficult questions. This is the skill I most try to cultivate in my classes.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"e67be047-571d-494b-9e74-85a43f3387c8\"}":{"__typename":"DeepDives","uuid":"e67be047-571d-494b-9e74-85a43f3387c8","content":"\u003cp\u003eI talked a LOT and I loved school. But sometimes, I could be a little bit forgetful. I forgot to write my name on top of my homework so frequently, that my teachers started giving me assignments with my name already on them! And I lost my stuff so often that the school's lost and found practically doubled as my second wardrobe! So I was a bit scatterbrained, but I had a big heart. Middle School was the time I learned to love debate, community service, and language. In essence, those were the years I grew into the person I am now! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"d993d7a0-6526-4de3-892a-c04a6201ea2f\"}":{"__typename":"School","uuid":"d993d7a0-6526-4de3-892a-c04a6201ea2f","name":"Kent Place School","city":"Summit","type":"HIGH","state":"New Jersey","country":"United States","zip":"07902"},"Education:{\"uuid\":\"5046f971-0044-4032-b3bb-7beaa4f89e8f\"}":{"__typename":"Education","uuid":"5046f971-0044-4032-b3bb-7beaa4f89e8f","school":{"__ref":"School:{\"uuid\":\"d993d7a0-6526-4de3-892a-c04a6201ea2f\"}"},"startYear":"2011","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"882ff596-fa3e-45f7-b36b-590bb7516bd1\"}":{"__typename":"Education","uuid":"882ff596-fa3e-45f7-b36b-590bb7516bd1","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Global Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"e9ebd22c-af6f-4003-b51e-edd3cafb674a\"}":{"__typename":"MentorPublicProfile","uuid":"e9ebd22c-af6f-4003-b51e-edd3cafb674a","displayName":"Sophie H.","slug":"sophie-huttner","biography":"\u003cp\u003eIn middle and high school, I became fascinated by world cultures and history. I wanted to explore the world and understand people who were really different from me, so I started learning languages. That led me to become a translator and interpreter for new immigrants-- and that opened up a whole new world for me in human rights advocacy work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I learned more languages and met people from so many backgrounds, I realized how powerful it is when someone feels truly heard and understood. Those early experiences shaped the way I think about empathy and responsibility.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, I studied Global Affairs with a focus on migration and women's rights. Then I received a Rhodes Scholarship to study at Oxford, where I earned two Master's degrees in Public Policy and Refugee Studies.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my Rhodes Scholarship, I wrote two theses-- one on Refugee Law and one on Venture Philanthropy-- and made friends from all over the world. Along the way, I worked for the US State Department in Colombia and for an organization fighting poverty here at home in the US. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also cultivated a love of teaching! I have over ten years of experience as a teacher and mentor, including:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDesigning and teaching an original ethics and philosophy course for 70+ middle school students\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMentoring students on elite college applications and essays\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eRunning a summer drama course for middle schoolers\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching English Literature to kids in China\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching kindergarteners how to read\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDesigning a technology course for senior citizens at the local public library\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching English language to brand new immigrants\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching Spanish to Yale Students\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching Judaic studies to 15+ Hebrew School students\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTutoring SSAT prep for kids applying to private schools\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePhew! That's a lot. Can you tell I adore teaching and mentoring? I am lucky to have had lots of different passions, but education is the common denominator across it all. Nothing makes me happier than helping a student learn to trust their own voice and ask good questions. The world is changing fast, but those two skills will never lose their value.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of education, I love to travel the world. I have been to 26 countries (currently writing this from Ethiopia!) and I adore exploring new places every chance I get. I am also famous for my dinner parties--I pride myself in bringing lots of great people together for interesting conversations and good food! And I have four dogs who I love to walk and cuddle.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat's me! What about you? What do you care about, and what brings you here to Curious Cardinals? I can't wait to hear more.\u003c/p\u003e","teachingVideoPlaybackId":"0000V015yHkT9339MSvjUonjK02jLRLWyMSzgiIsW6cEcWU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement has been learning five languages (Spanish, Portuguese, French, and Hebrew)-- oh, and English, but that one was easy! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI used those skills to become an interpreter and teacher for new immigrants and to do research on human rights and refugee issues at Oxford as a Rhodes Scholar. I also use them to travel the world, exploring 26 countries and counting!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e","favorites":[],"causesSupported":[],"major":"Global Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ea806844-7f9d-45f0-b456-3fb15b1a25aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"55a5b3cf-1193-4e41-b93c-390ea46b3301\"}"},{"__ref":"DeepDives:{\"uuid\":\"56caa0e5-2e5c-4b2a-9ee8-93852a89d86a\"}"},{"__ref":"DeepDives:{\"uuid\":\"e67be047-571d-494b-9e74-85a43f3387c8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/35477476-e6fc-422d-ac0c-9070d2f1d285/-/preview/-/format/jpg/","https://ucarecdn.com/379c4f46-56a5-45a2-8311-939094e23b03/-/preview/-/format/jpg/","https://ucarecdn.com/1bc098a4-96cb-4975-8acb-4d027442e611/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5046f971-0044-4032-b3bb-7beaa4f89e8f\"}"},{"__ref":"Education:{\"uuid\":\"882ff596-fa3e-45f7-b36b-590bb7516bd1\"}"}],"hiredAt":"2025-12-02T19:04:23.847Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Writing","Spanish","Academic Coaching","College Essay Writing","Reading","History","Executive Function"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sophie-huttner\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e9ebd22c-af6f-4003-b51e-edd3cafb674a\"}"}}},"_sentryTraceData":"b486d8950b1d47dd86cbeeb9a71a6ab0-8350b8e8ac5dd4a1-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6d
