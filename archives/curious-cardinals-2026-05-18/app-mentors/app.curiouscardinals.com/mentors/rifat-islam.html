xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"28909a61-dc83-4db1-9122-560e6490f491\"}":{"__typename":"DeepDives","uuid":"28909a61-dc83-4db1-9122-560e6490f491","content":"\u003cp\u003eWorking within the Nuclear Regulatory Commission (NRC) in the USA would be a dream job as it represents a unique vantage point, requiring regulatory, business, and scientific acumen to drive our nation's energy and environmental reforms. To help spearhead the acceleration of safe and responsible nuclear technology while safeguarding public health and the environment, all to shape a more sustainable, clean energy future, would be an immense privilege. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"521b096b-8b07-4a74-ad10-24fd04aa2ac1\"}":{"__typename":"DeepDives","uuid":"521b096b-8b07-4a74-ad10-24fd04aa2ac1","content":"\u003cp\u003eEP\u0026amp;E is a truly interdisciplinary major, and for my focus on public policy, I like the economic background combined with policy praxis and real-world considerations. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8bdcda96-a997-44fe-b117-1d7c6083baae\"}":{"__typename":"DeepDives","uuid":"8bdcda96-a997-44fe-b117-1d7c6083baae","content":"\u003cp\u003eI had amazing mentors in the forms of teachers and my tennis coach, who always inspired me to try my best and not let myself be limited by a lack of self-confidence. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"49ddd9e2-c45c-43c7-8146-e0d50f0913c1\"}":{"__typename":"DeepDives","uuid":"49ddd9e2-c45c-43c7-8146-e0d50f0913c1","content":"\u003cp\u003eI want to build a school in Bangladesh, where my family is from originally, helping educate and providing extra curricular opportunities to village children who lack access to extra tuition and funds for books/clothes/laptop. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}":{"__typename":"School","uuid":"375c6521-abfd-4666-859e-1190f187c648","name":"Collegiate School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10069"},"Education:{\"uuid\":\"b9635120-6406-497d-b8ae-b55bbad55f73\"}":{"__typename":"Education","uuid":"b9635120-6406-497d-b8ae-b55bbad55f73","school":{"__ref":"School:{\"uuid\":\"375c6521-abfd-4666-859e-1190f187c648\"}"},"startYear":"2013","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}":{"__typename":"School","uuid":"843cb79b-75a7-4415-89cc-0166c307ba4b","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"CT","country":"USA","zip":"06511"},"Education:{\"uuid\":\"4cc99660-32a1-49a0-be45-f652f6ed1780\"}":{"__typename":"Education","uuid":"4cc99660-32a1-49a0-be45-f652f6ed1780","school":{"__ref":"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024.5","major":"Ethics, Politics, \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"33483ac2-85a2-4b78-9b3b-1faaf915a28e\"}":{"__typename":"MentorPublicProfile","uuid":"33483ac2-85a2-4b78-9b3b-1faaf915a28e","displayName":"RIFAT I.","slug":"rifat-islam","biography":"\u003cp\u003eRifat is born and raised in Queens, NYC and is a student at Yale University. He has helped students with ISEE as well as ACT/SAT exam prep to prepare strong Ivy League applications. He helps ocate and nurture their passions in projects in social entrepreneurship, personal essay writing, public policy, and social justice initiatives, overall creating awareness about issues they care about and leveraging social media and local community activism to define their personal brands and be impactful on a blog/TikTok/Instagram of their own making. \u003cbr\u003e\u003cbr\u003eHe specializes in reading/writing enrichment for 3+ yrs, focusing on history and great books in the English literary canon, from classical and medieval times to the present. He serves as a first-year counselor for Yale South Asian Society and on the Advocacy Council for Middle Eastern and North African Association at Yale, guiding students in his free time through all the rungs of a uniquely tailored and comprehensive college admissions strategy. He has tutored students in subjects including high school English, AP English Language and Composition, AP English Literature and Composition, creative writing, SAT and ACT preparation, the SAT Literature Subject Test, global affairs, social studies, and U.S. history.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHaving graduated from Collegiate School and studying Ethics, Politics, \u0026amp; Economics at Yale University currently, Rifat was awarded a Scholastic Regional Writing Honors Winner in the New York City area and a travel scholarship to attend Middlebury’s National Young Writer's Conference. He was selected to study with Yale's Directed Studies, an honors intensive humanities program for first-years dedicated to plumbing new depths in literature, history, and philosophy through extensive writing and seminar discussion with leading faculty. At the same time, he has taken finance coursework at SOM and sat in selective seminars with distinguished journalists, including the NYT's Ross Douthat. He was shortlisted for the Interschool Entrepreneurship Trailblazer Award which honors the top student business proposals out of NYC independent schools. His writing has been published in Scholastic, the web, as well as school literary magazines. He has also helped students become writing finalists and ready sample pieces to be accepted at the prestigious Iowa Young Writers’ Studio, Kenyon Review Young Writers Workshop, Middlebury Young Writers Conference, and Adroit Journal Summer Mentorship Program. On the debate side, he has participated in the NSDA National Speech and Debate Tournament as well as its pre-qualifiers in Harvard and Yale. Overall, Rifat loves teaching and enjoys helping students become stronger writers, more engaged readers and community organizers, and potent communicators in their activist causes. \u003cbr\u003e\u003cbr\u003eRifat will spend the dedicated time every minute at Curious Cardinals to make sure students are having a blast and expanding new horizons in their local organizing potential and original grassroots passion projects, whether it be local or national, as well as writing poise and personality. Students are prepared for ISEE/AP Lit/SAT/ACT Reading etc. When the time comes (seniors!), he also provides college admissions essay coaching services but welcomes questions about college admissions during other times. \u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId"
