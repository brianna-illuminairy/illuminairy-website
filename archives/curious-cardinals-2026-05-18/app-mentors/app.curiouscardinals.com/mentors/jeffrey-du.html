xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"db6b5e96-1a5a-40e9-8d4c-7953a8491c55\"}":{"__typename":"DeepDives","uuid":"db6b5e96-1a5a-40e9-8d4c-7953a8491c55","content":"\u003cp\u003eExplore!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e9371831-0ade-4158-9b43-6592cf467f40\"}":{"__typename":"DeepDives","uuid":"e9371831-0ade-4158-9b43-6592cf467f40","content":"\u003cp\u003eReleasing an EP/album!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"88f327b3-34fb-4285-9b9d-7ce8a11b34f9\"}":{"__typename":"DeepDives","uuid":"88f327b3-34fb-4285-9b9d-7ce8a11b34f9","content":"\u003cp\u003eI completed two internships: one as a data science intern at a local university contractor and one as a legal intern at an immigration law firm. Internships are fantastic opportunities to explore and discover what you do and don't like, and in my case, I realized I enjoyed coding and conducting data analysis more than reading legal documents!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b8ff1145-0dfc-47e8-9c04-e7427dfc1963\"}":{"__typename":"DeepDives","uuid":"b8ff1145-0dfc-47e8-9c04-e7427dfc1963","content":"\u003cp\u003eI'm quite active in Duke's arts scene, where I sing in an acapella group, perform in musical theatre, and play music at a local retirement home!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"050696ed-c1f1-46ca-baea-98955cce197c\"}":{"__typename":"School","uuid":"050696ed-c1f1-46ca-baea-98955cce197c","name":"River Hill High School","city":"Clarksville","type":"HIGH","state":"Maryland","country":"United States","zip":"20777"},"Education:{\"uuid\":\"6fa9314c-6d99-4747-959a-09c9ef04665e\"}":{"__typename":"Education","uuid":"6fa9314c-6d99-4747-959a-09c9ef04665e","school":{"__ref":"School:{\"uuid\":\"050696ed-c1f1-46ca-baea-98955cce197c\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"52b41b41-494f-454f-b098-695363cc6e55\"}":{"__typename":"Education","uuid":"52b41b41-494f-454f-b098-695363cc6e55","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Economics, Statistics, Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"9e509748-ae55-432e-978f-fec5dc590d45\"}":{"__typename":"MentorPublicProfile","uuid":"9e509748-ae55-432e-978f-fec5dc590d45","displayName":"Jeffrey D.","slug":"jeffrey-du","biography":"\u003cp\u003eHi everyone! I'm a senior at Duke University with majors in economics and statistics and a minor in mathematics. I've been incredibly fortunate to discover and explore so many different interests—academically, socially, musically, and physically—while at Duke, and I really think that all these diverse experiences have fueled a desire to continuously learn, innovate, and challenge myself. I entered college thinking I wanted to be an immigration lawyer and left with a fervent curiosity for finance and data science, which I am now pursuing post-graduation as an analyst for an investment firm. I really enjoy getting nitty gritty into a topic and doing extensive research on topics of interest, and investing is a perfect platform to do so; I get to combine my theoretical background in economic research with quantitative statistical and mathematical methods to identify investment opportunities. Of course, the markets are incredibly humbling, which allows me to continuously refine my research process and frameworks in order to learn and adapt to ever-changing conditions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my professional interests, I spend a lot (A LOT) of my time on musical endeavors. At Duke, I’m part of an acapella group and perform in musicals throughout the year through Hoof ‘n’ Horn, Duke’s student-run musical theater organization. Most recently, I played Anatole Kuragin in \u003cem\u003eNatasha, Pierre, and the Great Comet of 1812\u003c/em\u003e and Bobby in \u003cem\u003eA Chorus Line\u003c/em\u003e. I am also a competitive powerlifter and chess player, recently representing Duke at various collegiate national tournaments.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"PaKYeDVnXLjXdAQGeI7I7202Z6QS9Ug5n5PHnEA7R3hs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"ca
