xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4836d934-765a-4894-9274-cb4a83b6afba\"}":{"__typename":"Favorites","uuid":"4836d934-765a-4894-9274-cb4a83b6afba","photoUrl":"https://ucarecdn.com/7f499c97-cd68-426e-afae-e339720075b9/","title":"Jaws","type":"MOVIE"},"Favorites:{\"uuid\":\"20ee0a0d-52ad-4ebf-a968-c318d77b55b3\"}":{"__typename":"Favorites","uuid":"20ee0a0d-52ad-4ebf-a968-c318d77b55b3","photoUrl":"https://ucarecdn.com/55e5e747-4153-40f4-99dc-9c2fb9937bc2/","title":"Novak Djokovic","type":"ATHLETE"},"Favorites:{\"uuid\":\"29db0131-40be-4d2f-abc4-d7697ec3bc02\"}":{"__typename":"Favorites","uuid":"29db0131-40be-4d2f-abc4-d7697ec3bc02","photoUrl":"https://ucarecdn.com/425dd962-bbc1-43d7-a076-eadb3ffef9d5/","title":"New York Mets","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b6314aa2-8653-4639-b0ef-014816a3c798\"}":{"__typename":"DeepDives","uuid":"b6314aa2-8653-4639-b0ef-014816a3c798","content":"\u003cp\u003eMy dream job is to be CEO of the Association of Tennis Professionals (ATP). Having played tennis my whole life and also being passionate about business and economics, I would love to help grow the sport and broaden the international tennis audience. There are lots of exciting opportunities for growth with the ATP, but also areas for reform to improve equity for both fans and players. Getting to travel around the world helping run the tournaments I grew up watching would be a dream come true. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9c957e74-14bc-4ece-bfaa-c3309520a9d9\"}":{"__typename":"DeepDives","uuid":"9c957e74-14bc-4ece-bfaa-c3309520a9d9","content":"\u003cp\u003eI had an amazing teacher for my high school AP economics class who first inspired my passion for econ. I came to realize that viewing the world and everyday life through an economic lens allowed me to blend quantitative analysis with qualitative creativity to solve problems. My tennis teammates probably didn't love all the econ jokes I made about whether it was talking about how players are too \u003cem\u003erisk-averse\u003c/em\u003e under pressure or how ordering at large group dinners is a \u003cem\u003emoral hazard\u003c/em\u003e. The economic lens has shaped my view of the world and people make economic decisions every day whether it's the Chairman of the Fed setting interest rates or a gym-goer deciding whether to exercise today or tomorrow.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"edafffe8-1921-4ae8-9e36-7ca1c505cbe3\"}":{"__typename":"DeepDives","uuid":"edafffe8-1921-4ae8-9e36-7ca1c505cbe3","content":"\u003cp\u003eThe biggest passion project of my academic career was my senior economics thesis on the risk-reward trade-off on tennis serves. This was the culmination of my liberal arts education as it was a great way to combine my passions in life (tennis and sport) and in learning (economics and statistics). While I spent a significant amount of time on it, it didn't feel like it and I always looked forward to cranking out some more regressions in pursuit of the optimal strategy. My thesis, which really was at the end of the day, a passion project, is why I am drawn to mentoring. I see the power of personal passions to drive learning on a deep level. Feeling that personal attachment and ownership of learning is what I was able to find in my passion projects and what I hope to instill in others. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5b7600f1-8156-450f-9fd7-25153383179a\"}":{"__typename":"DeepDives","uuid":"5b7600f1-8156-450f-9fd7-25153383179a","content":"\u003cp\u003eI love watching classic movies. I have seen all of the Oscar Best Picture Winners and the American Film Institute Top 100 classic films. I think in the past 5 years I've seen over 600 movies. Some of my favorite classics are Jaws, Casablanca, and The Graduate. Recently, I have been watching some more TV like Game of Thrones, Survivor, and The Bear. I used to perform magic tricks (mostly cards) when I was younger. I also enjoy playing tennis and other sports with family and friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"ced6899d-dc32-46a1-900b-d170258478da\"}":{"__typename":"Education","uuid":"ced6899d-dc32-46a1-900b-d170258478da","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2014","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"e4aed488-caa5-4e6a-ae64-befc6624f7ed\"}":{"__typename":"Education","uuid":"e4aed488-caa5-4e6a-ae64-befc6624f7ed","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"3640ce20-6132-45e7-af1a-ebc877000839\"}":{"__typename":"MentorPublicProfile","uuid":"3640ce20-6132-45e7-af1a-ebc877000839","displayName":"David A.","slug":"david-arkow","biography":"\u003cp\u003eI just graduated from Harvard with a major in Economics and a minor in Statistics. I was on the Varsity Tennis Team, President of the Harvard Sports Analytics Collective, and Vice President of TAMID Consulting. I was also a Teaching Assistant for Harvard’s Introductory Micro and Macroeconomics and Sports Economics courses. I’ve loved sports my whole life and have sought to connect it to all of my academic pursuits, whether it was researching my senior economics thesis about the risk-reward trade-off on tennis serves or writing a creative journalism profile on a professional tennis player. The subjects I am most passionate about teaching are economics, statistics, and sports analytics. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough I’m from LA, I’m a NY sports fan of the Knicks, Jets, Mets, and Islanders, who unfortunately have not won a championship in my lifetime (the probability of which is only 5%). Outside of econ, stats, and sports, I also enjoy classic movies and have seen all of the Oscar Best Picture winners (happy to give some recs). I believe in teaching students through a medium of which they are passionate about, which for me has been sports since they can connect with it on a deeper level. I would love to help mentor your child connecting with them on their passions, whether it be sports, movies, or something else and helping them develop an economic and data-driven perspective to problem solving.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"EJ8obygOh9pc74h1mISoTMQAT4b1XdM8b2oBZV3cea8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4836d934-765a-4894-9274-cb4a83b6afba\"}"},{"__ref":"Favorites:{\"uuid\":\"20ee0a0d-52ad-4ebf-a968-c318d77b55b3\"}"},{"__ref":"Favorites:{\"uuid\":\"29db0131-40be-4d2f-abc4-d7697ec3bc02\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b6314aa2-8653-4639-b0ef-014816a3c798\"}"},{"__ref":"DeepDives:{\"uuid\":\"9c957e74-14bc-4ece-bfaa-c3309520a9d9\"}"},{"__ref":"DeepDives:{\"uuid\":\"edafffe8-1921-4ae8-9e36-7ca1c505cbe3\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b7600f1-8156-450f-9fd7-25153383179a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4fcfac7c-d012-4aa2-a1a1-591b279f354a/-/preview/-/format/jpg/","https://ucarecdn.com/210a3d90-b0ef-4f38-b184-16841b07ad12/-/preview/-/format/jpg/","https://ucarecdn.com/8f739740-1ccf-42e3-993f-99f14cc920d6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"ced6899d-dc32-46a1-900b-d170258478da\"}"},{"__ref":"Education:{\"uuid\":\"e4aed488-caa5-4e6a-ae64-befc6624f7ed\"}"}],"hiredAt":"2024-06-04T00:23:35.973Z","topics":["Statistics","Sports Analytics","Finance / Investing","Business / Entrepreneurship","Economics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"david-arkow\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3640ce20-6132-45e7-af1a-ebc877000839\"}"}}},"_sentryTraceData":"a36f17aa2f2f4396bf8c78c354ab1b82-99e6f5b1fe21c4f2-0","_sentryBaggage":"se
