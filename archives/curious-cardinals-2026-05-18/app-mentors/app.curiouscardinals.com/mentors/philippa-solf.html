xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"131547dc-14ad-41a8-8c17-961110d2e812\"}":{"__typename":"Favorites","uuid":"131547dc-14ad-41a8-8c17-961110d2e812","photoUrl":"https://ucarecdn.com/62ada7ed-dfa2-4f3f-b3b4-0d1025513ff2/","title":"Jannik Sinner","type":"ATHLETE"},"Favorites:{\"uuid\":\"9287e075-be00-4903-9e2c-5ce4186b4801\"}":{"__typename":"Favorites","uuid":"9287e075-be00-4903-9e2c-5ce4186b4801","photoUrl":"https://ucarecdn.com/5c69f2ed-da34-4c1f-acf1-08eb25b93524/","title":"Madrid","type":"CITY"},"Favorites:{\"uuid\":\"64acb3f4-39be-4052-9345-80609a0510fa\"}":{"__typename":"Favorites","uuid":"64acb3f4-39be-4052-9345-80609a0510fa","photoUrl":"https://ucarecdn.com/ebd5d21e-1738-4b1d-8218-c5e7041bcb0b/","title":"Rowing","type":"SPORT"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f5fb4637-8698-4b40-af5c-5e5de1f91db7\"}":{"__typename":"DeepDives","uuid":"f5fb4637-8698-4b40-af5c-5e5de1f91db7","content":"\u003cblockquote\u003e\u003cp\u003eThere isn’t a path laid out for you - you get to build it yourself. That can feel scary, but it’s also empowering. If you work hard, stay curious, and set a goal you genuinely care about, you’ll be surprised by how much is actually within your control.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b7e81268-ccdb-4b11-b04e-c25d3acbf61c\"}":{"__typename":"DeepDives","uuid":"b7e81268-ccdb-4b11-b04e-c25d3acbf61c","content":"\u003cblockquote\u003e\u003cp\u003eIn my spare time, I row - very intensely. I actually started rowing at 25, which sounds late but turned out to be a great reminder that it’s never too late to begin something new. I got into it quickly and now row as part the top teams at Oxford, which has been both challenging and incredibly rewarding.\u003c/p\u003e\u003c/blockquote\u003e\u003cblockquote\u003e\u003cbr\u003e\u003c/blockquote\u003e\u003cblockquote\u003e\u003cp\u003eOutside of sport, I love a very Oxford tradition: going to Evensong. Hearing the choirs sing in chapels around the city is one of my favourite ways to slow down and reset — it’s calm, beautiful, and a perfect contrast to busy days.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4b9d91e7-0d2f-4078-a1e0-c77aff9dd8f4\"}":{"__typename":"DeepDives","uuid":"4b9d91e7-0d2f-4078-a1e0-c77aff9dd8f4","content":"\u003cblockquote\u003e\u003cp\u003eOne passion project that really stuck with me started during Covid. I’d struggled with acne as a teenager and realised I didn’t actually understand \u003cem\u003ewhy\u003c/em\u003e certain skincare products worked or didn’t. So I decided to figure it out properly.\u003c/p\u003e\u003c/blockquote\u003e\u003cblockquote\u003e\u003cbr\u003e\u003c/blockquote\u003e\u003cblockquote\u003e\u003cp\u003eI spent months reading scientific papers, watching dermatology lectures and videos, and learning the chemistry and biology behind skincare ingredients. Over time, I became genuinely knowledgeable about the science of skincare, and I started helping friends troubleshoot their skin issues in a much more informed way. It turned into something I still really enjoy: a reminder that following a personal curiosity can lead to real expertise and practical impact.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"985eb9c7-3c93-445f-989b-b1e1c787ad71\"}":{"__typename":"DeepDives","uuid":"985eb9c7-3c93-445f-989b-b1e1c787ad71","content":"\u003cblockquote\u003e\u003cp\u003eOne thing I’m extremely proud of is a charity cycling adventure I did when I was 19, in the summer after starting my undergraduate degree. Together with my friend Teresa, I cycled 1,800 km from Munich to Athens to raise money for the education of children with disabilities.\u003c/p\u003e\u003c/blockquote\u003e\u003cblockquote\u003e\u003cbr\u003e\u003c/blockquote\u003e\u003cblockquote\u003e\u003cp\u003eThe journey was chaotic at times, often exhausting, and completely outside my comfort zone — but it was also an incredible amount of fun and a true adventure. In the end, we raised over €10,000, which made all the challenges worth it. It’s something I’ll always be proud of, not just because of the distance we covered, but because it showed me what’s possible when you commit to a goal and see it through.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"c6b94913-04d9-4872-a819-9db29311ecbb\"}":{"__typename":"School","uuid":"c6b94913-04d9-4872-a819-9db29311ecbb","name":"London School of Economics and Political Science ","city":"London","type":"HIGH","state":"London","country":"United Kingdom","zip":"WC2A 2AE"},"Education:{\"uuid\":\"67cedd0a-99f6-43b6-900b-e83ac3b9016c\"}":{"__typename":"Education","uuid":"67cedd0a-99f6-43b6-900b-e83ac3b9016c","school":{"__ref":"School:{\"uuid\":\"c6b94913-04d9-4872-a819-9db29311ecbb\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"5064ea8b-245f-4413-8607-20fb7fd5e204\"}":{"__typename":"School","uuid":"5064ea8b-245f-4413-8607-20fb7fd5e204","name":"University of Oxford","city":"Oxford","type":"COLLEGE","state":"Oxfordshire","country":"United Kingdom","zip":"OX2 6JF"},"Education:{\"uuid\":\"a45f0c8f-f0d2-4b02-9b37-f321628a5b42\"}":{"__typename":"Education","uuid":"a45f0c8f-f0d2-4b02-9b37-f321628a5b42","school":{"__ref":"School:{\"uuid\":\"5064ea8b-245f-4413-8607-20fb7fd5e204\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2026","major":"Modern Middle Eastern Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"bcecd2cd-c29e-47cb-acb2-17d00a50d1dd\"}":{"__typename":"MentorPublicProfile","uuid":"bcecd2cd-c29e-47cb-acb2-17d00a50d1dd","displayName":"Philippa S.","slug":"philippa-solf","biography":"\u003cp\u003eHi! I’m Pippa - a graduate student at the \u003cstrong\u003eUniversity of Oxford \u003c/strong\u003eand a \u003cstrong\u003estrategy consultant. \u003c/strong\u003eI help students turn big interests into focused, confident academic work and meaningful passion projects!\u003cbr\u003e\u003cbr\u003eI wasn’t always a top student. For much of my early schooling, I struggled with confidence and structure, and it wasn’t until the final years of high school that I learned \u003cstrong\u003ehow to manage my time\u003c/strong\u003e and \u003cstrong\u003eapproach academic work effectively\u003c/strong\u003e. That shift completely changed my trajectory! \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince then, I’ve studied \u003cstrong\u003eInternational Relations and History\u003c/strong\u003e at the \u003cstrong\u003eLondon School of Economics\u003c/strong\u003e and worked for two years at a large global strategy consulting firm after my undergraduate degree. I am now completing a master's degree in \u003cstrong\u003eMiddle Eastern Studies\u003c/strong\u003e - which essentially combines history and politics of the region (and I am also attempting to learn Arabic). I am currently writing my thesis on European interventionism in Ottoman Syria in 1860. \u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have lived in several different countries (incl. Germany, Chile and United States) which has made me adaptable to different learning styles and academic expectations. I’ve tutored students for more than five years, from middle school math to undergraduate-level essay writing. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI speak German, English and Spanish fluently; my French and Arabic is at an intermediate level.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects\u003c/strong\u003e everything from history to sports, nutrition, skincare, journalism or charity work\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic tutoring\u003c/strong\u003e on all subjects outlined above\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eUniversity preparation\u003c/strong\u003e, including personal statements and structured writing\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePath finding \u003c/strong\u003eto support mentees in figuring out what they are passionate about and how to get there\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eA big part of my mentoring focuses on confidence building and ensuring that the mentee stays curious about learning! This is mostly related to helping the student to ask the right questions, encouraging them to think clearly, etc. - I believe that these skills that often matter more than raw ability.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eWhy I’m qualified to help you\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eBecause I didn’t always find school easy, I’m very intentional about how I mentor. I focus not just on \u003cem\u003ewhat\u003c/em\u003e to do, but \u003cem\u003ehow\u003c/em\u003e to work calmly, strategically, and with confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTurning a broad interest into a clear, manageable project (e.g., the student likes a niche subject that the school curriculum doesn't cover)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking an overwhelming amount of work into realistic steps (e.g., how to get started on an essay that the student is dreading)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorking together on academic challenges and ending with a clear plan forward\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eFun facts\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI once cycled from Munich to Athens for charity (it took 3 weeks) \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI know everything there is to know about skincare (a passion project of mine that I developed during Covid) \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI learned how to row last year and now row with the Oxford University Boat Club\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI went to a secret historical archive for the first time a few weeks ago and LOVED it!! \u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"G901dQ1MdQTGxCAhxfYhzeDJ7957S4qS00pQOVwjPKCKE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"131547dc-14ad-41a8-8c17-961110d2e812\"}"},{"__ref":"Favorites:{\"uuid\":\"9287e075-be00-4903-9e2c-5ce4186b4801\"}"},{"__ref":"Favorites:{\"uuid\":\"64acb3f4-39be-4052-9345-80609a0510fa\"}"}],"causesSupported":[],"major":"Modern Middle Eastern Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f5fb4637-8698-4b40-af5c-5e5de1f91db7\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7e81268-ccdb-4b11-b04e-c25d3acbf61c\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b9d91e7-0d2f-4078-a1e0-c77aff9dd8f4\"}"},{"__ref":"DeepDives:{\"uuid\":\"985eb9c7-3c93-445f-989b-b1e1c787ad71\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cf281944-41c3-4a12-83fb-7c7045127ee5/-/preview/-/format/jpg/","https://ucarecdn.com/e8d6130b-ec31-4a7a-bf85-3824d091f5d0/-/preview/-/format/jpg/","https://ucarecdn.com/7de5bd42-d342-4006-9db1-2ee09aaab1f7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"67cedd0a-99f6-43b6-900b-e83ac3b9016c\"}"},{"__ref":"Education:{\"uuid\":\"a45f0c8f-f0d2-4b02-9b37-f321628a5b42\"}"}],"hiredAt":"2026-01-21T16:08:55.181Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Writing","Spanish","German","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","Film / Theater","Sports Journalism","History Project","Business / Entrepreneurship","Finance / Investing","Sports Analytics","Medicine / Health","Law / Government / Policy","Journalism","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProf
