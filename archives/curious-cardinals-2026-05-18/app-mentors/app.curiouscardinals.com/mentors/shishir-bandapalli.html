:"0848648d-40b4-46b2-bbff-d581987fbe6c","content":"\u003cp\u003eAstronaut\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4af48a19-2768-4541-8c35-e6eac1cc5f06\"}":{"__typename":"DeepDives","uuid":"4af48a19-2768-4541-8c35-e6eac1cc5f06","content":"\u003cp\u003ePlay basketball, explore random obscure places (think abandoned), stargaze, play videogames, or volunteer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"60b9a068-0209-42a7-8c52-6869027eeda6\"}":{"__typename":"DeepDives","uuid":"60b9a068-0209-42a7-8c52-6869027eeda6","content":"\u003cp\u003eI have always been passionate about space and space exploration, and have also always been curious about tinkering and reverse engineering, so Mechanical Engineering with a focus on aerospace seemed like the perfect fit!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"4644a285-22bf-4856-91b2-4f682df7518a\"}":{"__typename":"School","uuid":"4644a285-22bf-4856-91b2-4f682df7518a","name":"Stevenson High School","city":"Lincolnshire","type":"HIGH","state":"Illinois","country":"United States","zip":"60069"},"Education:{\"uuid\":\"1b5ddc75-b4d6-43c4-aaa6-d4d1992fc6e8\"}":{"__typename":"Education","uuid":"1b5ddc75-b4d6-43c4-aaa6-d4d1992fc6e8","school":{"__ref":"School:{\"uuid\":\"4644a285-22bf-4856-91b2-4f682df7518a\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"306307fc-dfc0-4258-bf2d-698a37b6fa0b\"}":{"__typename":"Education","uuid":"306307fc-dfc0-4258-bf2d-698a37b6fa0b","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":"BS/MS"},"MentorPublicProfile:{\"uuid\":\"aea05f4b-7f24-4565-bd07-2488b0c2b2f3\"}":{"__typename":"MentorPublicProfile","uuid":"aea05f4b-7f24-4565-bd07-2488b0c2b2f3","displayName":"Shishir B.","slug":"shishir-bandapalli","biography":"\u003cp\u003eShishir is a junior at Northwestern University working towards his BS/MS in Mechanical Engineering, with a focus on aerospace and robotics. He is passionate about pushing humanity forwards through space exploration, and hopes to foster interest in the field in others. He also believes that anyone, in any field, benefits from an active sense of curiosity. \u003cbr\u003e\u003cbr\u003eAt Northwestern, he's involved with NUSTARS, Northwestern's competitive Rocketry team, and Engineers Without Borders, where he is working to create water treatment and delivery systems for a village in rural Ecuador. With course experience in topics from fluid mechanics and robotics to psychology and American history, Shishir approaches problems holistically. Shishir's project experience makes him well suited for guiding others through complicated projects of their own.\u003cbr\u003e\u003cbr\u003eShishir has participated in research, from helping develop a dark matter detector in high school to prototyping haptic devices that restore feeling for those with unfeeling or paralyzed limbs at the Querrey Simpson Institute for Bioelectronics at Northwestern.\u003cbr\u003e\u003cbr\u003eThese research and project experiences culminated with an internship with Boeing in the summer of 2023, where Shishir worked in the Research \u0026amp; Technology division in Seattle on proprietary aircraft development. Through this internship, Shishir learned the ins-and-outs of the aerospace industry, as well as the prototyping design cycle. He is looking to continue his experience with Boeing next summer, in Boeing's Phantom Works division in St. Louis.\u003cbr\u003e\u003cbr\u003eOutside of work, you can catch Shishir playing basketball, stargazing, cooking, or playing videogames. He is passionate about music (current favorites are Marvin Gaye, Tame Impala, Jordan Ward, Frank Ocean, The Internet and Baby Keem), as well as fashion.\u003c/p\u003e","teachingVideoPlaybackId":"lO7MKlrX8HmYkY013ShJb37CU3LB3amatOsRsHymCLOs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3799e593-a1f2-4f74-8908-0fd3056d3b85\"}"},{"__ref":"Favorites:{\"uuid\":\"6bfc4eea-2824-4059-86a6-83709a58dec8\"}"},{"__ref":"Favorites:{\"uuid\":\"43c31a05-1ad3-40ab-8aa4-176ca630c676\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b1be91fe-c391-426c-90e4-38b3c7c04881\"}"},{"__ref":"DeepDives:{\"uuid\":\"0848648d-40b4-46b2-bbff-d581987fbe6c\"}"},{"__ref":"DeepDives:{\"uuid\":\"4af48a19-2768-4541-8c35-e6eac1cc5f06\"}"},{"__ref":"DeepDives:{\"uuid\":\"60b9a068-0209-42a7-8c52-6869027eeda6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f1ae09a4-1103-45e3-a392-511bfc357a16/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1b5ddc75-b4d6-43c4-aaa6-d4d1992fc6e8\"}"},{"__ref":"Education:{\"uuid\":\"306307fc-dfc0-4258-bf2d-698a37b6fa0b\"}"}],"hiredAt":"2023-11-01T16:52:11.458Z","topics":[],"communityBadges":["https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/7603176c-18e9-427e-b2ca-d
