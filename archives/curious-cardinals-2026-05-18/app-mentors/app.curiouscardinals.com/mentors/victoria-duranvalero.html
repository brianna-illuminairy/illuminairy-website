xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d20a4946-c076-4901-93d9-fa546b169283\"}":{"__typename":"Favorites","uuid":"d20a4946-c076-4901-93d9-fa546b169283","photoUrl":"https://ucarecdn.com/7e5656ff-f5b9-4cca-843c-87cc06ff2765/","title":"Tennis! ","type":"SPORT"},"Favorites:{\"uuid\":\"4165248f-fb09-4d69-8c55-bca16ac8e22c\"}":{"__typename":"Favorites","uuid":"4165248f-fb09-4d69-8c55-bca16ac8e22c","photoUrl":"https://ucarecdn.com/454e6ad2-7a73-4ad3-a79b-8028ebe3d2a6/","title":"The Alchemist, Paulo Coelho","type":"BOOK"},"Favorites:{\"uuid\":\"f62b24a9-88c6-433d-805b-46dced0e3c26\"}":{"__typename":"Favorites","uuid":"f62b24a9-88c6-433d-805b-46dced0e3c26","photoUrl":"https://ucarecdn.com/e4dd683e-a529-4d85-bc3c-3fd8df78d8f8/","title":"Golden State Warriors","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"fcb05747-d5b3-47ee-8f77-cda4fd820b29\"}":{"__typename":"CausesSupported","uuid":"fcb05747-d5b3-47ee-8f77-cda4fd820b29","name":"Best Buddies","description":"\u003cp\u003ePresident of my high school's chapter for three years.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/326200a4-8714-4cc2-a4f9-239d1138ebe1/"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"de4d6415-a9f3-4802-b11e-67cb8203cabc\"}":{"__typename":"DeepDives","uuid":"de4d6415-a9f3-4802-b11e-67cb8203cabc","content":"\u003cp\u003eMy heritage and identity have deeply influenced my teaching style in both subtle and significant ways. As a Latina with Spanish and Mexican roots, I’ve grown up in a multicultural environment where education was not only valued but seen as a powerful tool for opportunity and empowerment. I’ve seen firsthand how language, culture, and representation can make students feel seen, heard, and capable, and I bring that awareness into every interaction I have as a mentor.\u003c/p\u003e\u003cp\u003eBeing bilingual and bicultural allows me to connect with students from a variety of backgrounds. I understand how valuable it is when a student sees a bit of themselves in their teacher or tutor, whether that’s through shared language or lived experiences. That shared understanding helps build trust and creates a safe space where students feel encouraged to ask questions, make mistakes, and grow with confidence.\u003c/p\u003e\u003cp\u003eI also approach teaching with a lot of empathy. Coming from a family and community where not everyone had equal access to the same educational resources, I understand how important it is to meet students where they are and celebrate progress at every level. I try to bring warmth, patience, and encouragement into each session, while also challenging students to stretch themselves and see what they’re truly capable of.\u003c/p\u003e\u003cp\u003eAt the end of the day, I want my students to feel empowered. To me, that means not just to do well in school, but to believe in their potential beyond it. That’s something I’ve carried with me from my own upbringing, and it’s at the heart of how I teach.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"15fb78b9-4594-460a-bf6a-fc5a26985f8c\"}":{"__typename":"DeepDives","uuid":"15fb78b9-4594-460a-bf6a-fc5a26985f8c","content":"\u003cp\u003eAs a high school student, I was curious, driven, and always juggling a lot of interests. I cared deeply about doing well academically, especially in math and science, but I also made time for creative outlets like music—I played flute in the school band and also played in All City—and stayed active in clubs like Best Buddies, which I was involved in for all three years as chapter president. Best Buddies was perhaps my most formative experience in high school, a club dedicated to fostering one to one friendships and job opportunities for general ed and special ed students. I loved being involved in my community and helping others, whether it was through fundraising for Best Buddies, tutoring my mother's students or organizing events. I was definitely a bit of a perfectionist, but I’ve learned over time that growth comes from asking for help, which is something I try to pass on to students I work with now.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"0e4f229d-0fe7-492d-aceb-fb665e9e0f4b\"}":{"__typename":"DeepDives","uuid":"0e4f229d-0fe7-492d-aceb-fb665e9e0f4b","content":"\u003cp\u003eI spent my summers in high school exploring a mix of academic and personal interests. I participated in programs like NexGeneGirls, where I got to dive into hands-on STEM research and connect with inspiring women in science, which really shaped my passion for applied learning. With NexGeneGirls, I interned under a mentor from Horizon Therapeutics where we researched rare metabolic diseases in newborns. I also took summer classes and sought out learning opportunities like Google CodeNext (an amazing remote program during covid!) to keep challenging myself. At the same time, I made space for family. Visiting my grandparents in Los Angeles was always a highlight. During the COVID summers, when travel and programs were limited, I used the time to focus on personal growth, take online courses, and reflect on what I wanted my future to look like. Those summers helped me grow in so many different ways, both academically and personally. A fun fact about my high school summers is that I was actually supposed to study abroad in Japan. I had taken several Japanese language courses but due to the lockdown I was unable to visit for three years. Still on my bucket list though!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"10381147-dcb6-4579-af0b-352865fd14e7\"}":{"__typename":"DeepDives","uuid":"10381147-dcb6-4579-af0b-352865fd14e7","content":"\u003cp\u003eWhile I come off as analytical because of my applied math major, I also love writing, music, and learning languages. I play the flute, journal regularly, and studied abroad in Italy last summer, where I learned Italian. I enjoy connecting with people not just through logic and problem-solving, but through stories, culture, and shared experiences. That balance of structure and creativity really shapes how I approach both learning and mentoring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"49b879c0-ab38-42db-90b9-9e3f9233d12e\"}":{"__typename":"School","uuid":"49b879c0-ab38-42db-90b9-9e3f9233d12e","name":"Galileo Academy of Science and Technology","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94109"},"Education:{\"uuid\":\"e4cbd2ef-7307-4ea4-aaaf-b81289ee04de\"}":{"__typename":"Education","uuid":"e4cbd2ef-7307-4ea4-aaaf-b81289ee04de","school":{"__ref":"School:{\"uuid\":\"49b879c0-ab38-42db-90b9-9e3f9233d12e\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"cf5d68f3-5c5e-4b26-ba1c-f5aeee7b0ebc\"}":{"__typename":"Education","uuid":"cf5d68f3-5c5e-4b26-ba1c-f5aeee7b0ebc","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Applied Math","degree":null},"MentorPublicProfile:{\"uuid\":\"ebef493f-2ad2-4759-a012-0b13341fd97b\"}":{"__typename":"MentorPublicProfile","uuid":"ebef493f-2ad2-4759-a012-0b13341fd97b","displayName":"Victoria D.","slug":"victoria-duranvalero","biography":"\u003cp\u003eHello everyone! My name is Victoria, and I’m a rising junior at Yale majoring in Applied Math. I was born and raised in San Francisco, California with Spanish and Mexican heritage.\u003c/p\u003e\u003cp\u003eMy passion for teaching (and learning!) started early, thanks to my mom, who is a third-grade Spanish bilingual teacher. In high school, I spent many afternoons in her classroom, helping her students with reading, math, and anything else they needed. Watching her foster curiosity and confidence in her students inspired me to want to do the same. Education is not just about absorbing knowledge, but about empowering others to think independently and grow into their full potential.\u003c/p\u003e\u003cp\u003eThat passion is what drew me to Curious Cardinals. I’m so excited to help students explore new topics, challenge themselves, and find joy in learning, just like I’ve always tried to do myself.\u003c/p\u003e\u003cp\u003eWhen I’m not in class or tutoring, I love staying active and creative. You can often find me on the tennis court, hiking in nature, or playing the flute. I also love languages. I speak Spanish and Italian, and I recently completed an incredible semester abroad in Spain, where I connected to my roots and had a chance to intern at a Spanish research institute while traveling to many places in Europe. It was an unforgettable experience that inspired me to live and learn in global communities.\u003c/p\u003e\u003cp\u003eI’m so excited to get started with Curious Cardinals and to meet students who are eager to learn and grow. Whether it’s helping you understand a tricky math problem, guiding you through a creative project, or just cheering you on as you chase your goals, I’m here to support you every step of the way :)\u003c/p\u003e","teachingVideoPlaybackId":"802Emtoe6CBmXHlvo01U02T90001IbuvbSU01XKBkOelwx2V8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I'm really proud of is getting into Yale University. As the first person from my public high school to be accepted in 70 years, it felt like a huge win not just for me, but for my community. It was surreal. \u003c/p\u003e\u003cp\u003eGetting into Yale was the result of years of late nights, self-motivation, and staying focused even when there weren’t many people around me who’d walked this path. But more than anything, it gave visibility to Latino students at my high school—we're capable, ambitious, and belong in those spaces, too. That’s what I’m most proud of: opening that door and showing others it’s possible.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d20a4946-c076-4901-93d9-fa546b169283\"}"},{"__ref":"Favorites:{\"uuid\":\"4165248f-fb09-4d69-8c55-bca16ac8e22c\"}"},{"__ref":"Favorites:{\"uuid\":\"f62b24a9-88c6-433d-805b-46dced0e3c26\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"fcb05747-d5b3-47ee-8f77-cda4fd820b29\"}"}],"major":"Applied Math","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"de4d6415-a9f3-4802-b11e-67cb8203cabc\"}"},{"__ref":"DeepDives:{\"uuid\":\"15fb78b9-4594-460a-bf6a-fc5a26985f8c\"}"},{"__ref":"DeepDive
