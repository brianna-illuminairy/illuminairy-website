xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7a44df80-b050-4ec7-b998-9c8b4fd96df9\"}":{"__typename":"DeepDives","uuid":"7a44df80-b050-4ec7-b998-9c8b4fd96df9","content":"\u003cp\u003eIf I were to meet my freshman year self, I would tell her to spend as much time as she can outside.  I would encourage her to journal or doodle or record something small daily. I would tell her that anything I get excited about, either inside or outside of the classroom, is important and worthy of my time. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"41ba93e1-3f97-482c-b3f4-db0412cb5ad9\"}":{"__typename":"DeepDives","uuid":"41ba93e1-3f97-482c-b3f4-db0412cb5ad9","content":"\u003cp\u003eMentorship matters to me because it is a unique kind of relationship that is collaborative and symbiotic in nature. Through connections and time spent with my own mentors, I have learned that both people bring something important to the conversation and can learn from every interaction. No matter the difference in age or experience, I believe that mentors, just like their mentees, are continually learning. I am excited by this process of mutual learning and sharing. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4670fd48-d1b7-41c7-b7b8-98b8b05bf40c\"}":{"__typename":"DeepDives","uuid":"4670fd48-d1b7-41c7-b7b8-98b8b05bf40c","content":"\u003cp\u003eMy dream job is situated at the intersection of food innovation and health. I would love to work at an organization like the World Food Program, through the United Nations, and use human-centered design and technology to make growing, distributing, and digesting food more sustainable, efficient, and delicious for all. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"f5c72c4e-7d31-4bae-9c75-aa71578cb476\"}":{"__typename":"DeepDives","uuid":"f5c72c4e-7d31-4bae-9c75-aa71578cb476","content":"\u003cp\u003eI hope to swim in every ocean on Earth. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}":{"__typename":"School","uuid":"841c38e6-da3b-4744-a827-f0417ef23547","name":"Georgetown University","city":"Washington","type":"COLLEGE","state":"District of Columbia","country":"United States","zip":"20057"},"Education:{\"uuid\":\"f1ddac3d-dc5c-4a07-ae53-d7c8dc90efe8\"}":{"__typename":"Education","uuid":"f1ddac3d-dc5c-4a07-ae53-d7c8dc90efe8","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Global Health","degree":"Bachelors of Science "},"School:{\"uuid\":\"d91174d1-e485-45fe-8fe2-dcf4d76a755e\"}":{"__typename":"School","u
