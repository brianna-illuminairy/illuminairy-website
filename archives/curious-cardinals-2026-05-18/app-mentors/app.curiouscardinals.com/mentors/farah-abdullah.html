xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a7ed25d4-889b-4e91-be28-ca17647ef6b8\"}":{"__typename":"DeepDives","uuid":"a7ed25d4-889b-4e91-be28-ca17647ef6b8","content":"\u003cp\u003eI would tell my high school self:\u003c/p\u003e\u003cp\u003e\"You belong here. Keep exploring, keep asking questions, and don’t be afraid to take up space.\"\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere were times when I doubted myself—when I thought I wasn’t smart enough to pursue engineering or that I had to have everything figured out from the start. But looking back, I realize that growth comes from embracing challenges, making mistakes, and learning along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d remind myself that it’s okay to pivot, to struggle, and to not always have the right answers. What matters most is staying curious, seeking out opportunities, and surrounding yourself with people who uplift and inspire you. Engineering isn’t just about getting things right the first time, it’s about problem-solving, perseverance, and creativity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd most importantly, you don’t have to do it alone. Find mentors, ask for help, and be open to learning from those around you. The path ahead might not always be clear, but trust that you are capable, and that every challenge is just another step toward something greater.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0a0de61e-354c-4282-a515-4dd01d0884ba\"}":{"__typename":"DeepDives","uuid":"0a0de61e-354c-4282-a515-4dd01d0884ba","content":"\u003cp\u003eMentorship matters to me because I wouldn’t be where I am today without the guidance, encouragement, and support of mentors who helped me navigate my journey in STEM. As a West Indian woman in engineering, I’ve faced moments of doubt, imposter syndrome, and the challenge of being in spaces where representation is limited. But through mentorship, I’ve learned that I belong here—that my voice, ideas, and contributions matter.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, I want to be that source of support for others. I know firsthand how transformative it is to have someone who believes in you, helps you break down intimidating concepts, and reassures you that setbacks are part of the learning process. Mentorship isn’t just about teaching technical skills; it’s about instilling confidence, fostering curiosity, and making STEM more inclusive.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want to empower students to embrace challenges, ask bold questions, and see the magic in problem-solving. Whether it’s guiding young students in coding workshops, helping first-year students adjust to college, or sharing my experiences navigating the tech world, I strive to create spaces where students feel encouraged, capable, and excited to explore STEM. Seeing a student have that \u003cem\u003e\"aha!\"\u003c/em\u003e moment, overcome a challenge, or feel inspired to pursue a new passion is what makes mentorship so fulfilling for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1cda9bd6-5510-4182-ad35-46c095e6c615\"}":{"__typename":"DeepDives","uuid":"1cda9bd6-5510-4182-ad35-46c095e6c615","content":"\u003cp\u003eIn my spare time, I love exploring new places, whether it's checking out hidden cafes or just strolling through a neighborhood I’ve never visited before. I’m also a big fan of trying out new food, especially street food from different cultures.\u0026nbsp; I’m always up for watching the latest binge-worthy TV shows or getting into video games that are fun to play just for the experience, not necessarily for winning. If I’m feeling adventurous, I’ll try something completely random like karaoke or just head to a local park to watch the sunset and people-watch.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"44f6f614-30e4-469e-b269-cbd797b01b45\"}":{"__typename":"DeepDives","uuid":"44f6f614-30e4-469e-b269-cbd797b01b45","content":"\u003cp\u003eI originally applied to college as a Biomedical Engineering major because I was fascinated by medical technology and its impact on people’s lives. But once I got deeper into the coursework, I quickly realized that biology wasn’t my strong suit.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo, I pivoted to Computer Science, thinking coding and problem-solving would be a better fit. While I enjoyed programming, I soon realized that I learn best when I can interact with things hands-on. I didn’t want to just write software, I wanted to understand the systems that power it, the hardware, the circuits, and the way everything comes together. That’s when I found Electrical and Computer Engineering (ECE), a perfect balance of hardware and software, theory and application.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, as an ECE major, I get to work with digital logic, circuit design, and embedded systems, which are things I can physically build, test, and troubleshoot. It’s the best of both worlds, allowing me to develop both my coding skills and my passion for hands-on engineering. Looking back, my journey through different majors helped me realize that engineering is about finding where your curiosity thrives, and for me, that’s in the intersection of electronics, computing, and innovation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"42ad5b7f-98e4-4150-a033-6763367d6aa1\"}":{"__typename":"School","uuid":"42ad5b7f-98e4-4150-a033-6763367d6aa1","name":"Richmond Hill High School","city":"Jamaica","type":"HIGH","state":"New York","country":"United States","zip":"11418"},"Education:{\"uuid\":\"cff43c20-546a-463c-8172-4e1b73290c16\"}":{"__typename":"Education","uuid":"cff43c20-546a-463c-8172-4e1b73290c16","school":{"__ref":"School:{\"uuid\":\"42ad5b7f-98e4-4150-a033-6763367d6aa1\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"87acaaaa-75a8-4744-8a18-7e5d8797236d\"}":{"__typename":"Education","uuid":"87acaaaa-75a8-4744-8a18-7e5d8797236d","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Electrical and Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"3234b87c-7b52-4c69-bde4-c22e6ad18a28\"}":{"__typename":"MentorPublicProfile","uuid":"3234b87c-7b52-4c69-bde4-c22e6ad18a28","displayName":"Farah A.","slug":"farah-abdullah","biography":"\u003cp\u003eHi! I’m Farah, a sophomore studying Electrical and Computer Engineering with a minor in Business at Cornell University. I was born and raised in Guyana, but I currently live in New York City. I have always been fascinated by how things work. From tinkering with robotics in high school to coding my first program, I realized that engineering is the perfect blend of logic and creativity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond the technical side, I’m deeply passionate about making STEM more accessible and inclusive. As a West Indian woman in tech, I’ve navigated spaces where representation is limited, which is why I’m dedicated to mentorship. Through organizations like the Society of Women Engineers, Women in Computing, Empowering Young Engineers and Scientists, and CUEmpower, I empower students—especially those from underrepresented backgrounds—by creating supportive learning environments, leading hands-on STEM workshops, and providing mentorship that helps them build confidence in their technical skills. Whether it’s teaching young girls how to code in Python, guiding first-year students through their transition to college, or sharing my experiences navigating the tech world as a woman of color, I strive to show students that they belong in STEM and that their ideas matter.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was a peer mentor and tutor, helping students build confidence in Algebra 1 and 2. At Cornell, I continue to teach and lead STEM workshops for young girls through the Girl Scouts Committee and EYES (Empowering Young Engineers and Scientists). These experiences have shown me the power of mentorship—not just in teaching technical skills but in helping students see their potential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not studying, you’ll find me exploring challenges, sketching, baking, solving puzzles, or getting lost in a good sci-fi novel. My friends would describe me as curious, energetic, and always eager to share what I’ve learned.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my goal is to spark curiosity, build confidence, and show students that STEM is not just a subject—it’s a world of possibilities. I love breaking down complex concepts into engaging lessons, helping students develop problem-solving skills, and most importantly, making learning fun. If you’re looking for a mentor who will challenge, support, and inspire you, let’s embark on this journey together!\u003c/p\u003e","teachingVideoPlaybackId":"CKQs2WtXzYOO51LGOuTdE1L2J01HWHuxD6Kdklw1d69U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a7ed25d4-889b-4e91-be28-ca17647ef6b8\"}"},{"__ref":"DeepDives:{\"uuid\":\"0a0de61e-354c-4282-a515-4dd01d0884ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"1cda9bd6-5510-4182-ad35-46c095e6c615\"}"},{"__ref":"DeepDives:{\"uuid\":\"44f6f614-30e4-469e-b269-cbd797b01b45\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/64f89a63-2c0c-4f21-bbcb-ef89d9f8368c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cff43c20-546a-463c-8172-4e1b73290c16\"}"},{"__ref":"Education:{\"uuid\":\"87acaaaa-75a8-4744-8a18-7e5d8797236d\"}"}],"hiredAt":"2025-02-11T13:10:40.469Z","topics":[],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"farah-abdullah\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3234b87c-7b52-4c69-bde4-c22e6ad18a28\"}"}}},"_sentryTraceData":"41fd1cf59f3544e6a548dc1b636606ec-87d6f0b285ad75e6-1","_sentryBaggage":"sentry-environment=ver
