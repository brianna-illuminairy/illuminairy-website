xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"56b8d3a8-f62e-4741-a7ff-ee577ef7cff3\"}":{"__typename":"Favorites","uuid":"56b8d3a8-f62e-4741-a7ff-ee577ef7cff3","photoUrl":"https://ucarecdn.com/e53aad0e-e4f7-42f4-ad9d-25c69b14cb90/","title":"Pride and Prejudice","type":"BOOK"},"Favorites:{\"uuid\":\"8d558ec9-22b0-42eb-8732-7e898a2964e7\"}":{"__typename":"Favorites","uuid":"8d558ec9-22b0-42eb-8732-7e898a2964e7","photoUrl":"https://ucarecdn.com/f03edba9-532f-44b7-ada8-8d23caade77c/","title":"evermore","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b15c5a92-b478-4040-8fcc-4b9e36761bbd\"}":{"__typename":"DeepDives","uuid":"b15c5a92-b478-4040-8fcc-4b9e36761bbd","content":"\u003cp\u003eEvery experience you have (good or bad) is a chance to learn and grow!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"9a188a30-d097-4cb1-8ec7-806486332794\"}":{"__typename":"DeepDives","uuid":"9a188a30-d097-4cb1-8ec7-806486332794","content":"\u003cp\u003eI believe the best way to build a strong future is to build strong individuals who feel passionately about making a difference in the world around them. No matter how many inventions we create, or how many crises we find ourselves solving, nothing makes as big of an impact as empowering a generation to take the reins for their own future and feel confident in their passions and ideas. Mentorship is, in my opinion, a growth experience for everyone involved, because a mentor learns how to think from the perspective of others, and the mentee learns lessons from the mentor that can help guide them to their own success. If nothing else, I want the people I mentor to know they have someone who has their back, someone they can trust and ask questions without feeling alone or helpless. I know that having mentors in my life has helped me in making major decisions that have pushed me to develop my strengths, and it would be an honor to be a part of someone else's journey. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c804d65e-4ab8-42ad-9707-5a3892321f30\"}":{"__typename":"DeepDives","uuid":"c804d65e-4ab8-42ad-9707-5a3892321f30","content":"\u003cp\u003eI chose my major because I love to design and build things, and so engineering was a natural subject I gravitated towards. I've always loved space, and I've had so many formative experiences that relate to rocketry and aerospace, like when I was looking at planets through my telescope when I was young, or when I went to so many science museums just to look at the rockets and spacecraft that were there. I love the creativity and freedom I get as an engineer, and I love being able to solve problems that help advance the future of technology and space exploration!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"62d27ea8-8316-4dc0-8303-00924d46ce6a\"}":{"__typename":"DeepDives","uuid":"62d27ea8-8316-4dc0-8303-00924d46ce6a","content":"\u003cp\u003eMy failures. Oddly enough, every time I feel like I've \"failed\" at something, it pushes me to be that much better and work even harder to pursue my definition of success. I truly believe that failure isn't definitive, and it's what you do after \"failing\" that matters, and so I strive to overcome every challenge by giving it every effort I have. I'm motivated by my own drive and my determination to do the best I possibly can.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"f717a8a0-5684-43d7-9536-d375b1b6f23c\"}":{"__typename":"School","uuid":"f717a8a0-5684-43d7-9536-d375b1b6f23c","name":"Freedom High School","city":"Chantilly","type":"HIGH","state":"Virginia","country":"United States","zip":"20152"},"Education:{\"uuid\":\"421ca45c-231a-4444-a147-2f81f76c1097\"}":{"__typename":"Education","uuid":"421ca45c-231a-4444-a147-2f81f76c1097","school":{"__ref":"School:{\"uuid\":\"f717a8a0-5684-43d7-9536-d375b1b6f23c\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"1a640a9b-2672-4b67-9095-8a4fd070817b\"}":{"__typename":"Education","uuid":"1a640a9b-2672-4b67-9095-8a4fd070817b","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Aerospace Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"e2ecfb57-50d3-4cad-a6aa-1f554afb8d29\"}":{"__typename":"MentorPublicProfile","uuid":"e2ecfb57-50d3-4cad-a6aa-1f554afb8d29","displayName":"Nandini K.","slug":"nandini-kotamurthy","biography":"\u003cp\u003eHi! I'm Nandini, a sophomore at Georgia Tech studying Aerospace Engineering with a focus on space systems.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a lifelong learner, I'm constantly exploring new topics by Googling or reading anything I can get my hands on. As an engineer, I approach everything with a slew of questions, breaking it down, putting it back together, and asking, \"Why does this work this way?\" I believe that critically examining the world around me and staying actively engaged helps me grow and evolve, which I apply to the core engineering principles I'm learning in college.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my coursework, I'm involved in several student organizations on campus. As part of the Georgia Tech Experimental Rocketry team, I'm working on building a two-stage solid rocket, where I design and experiment with new technologies to improve our efforts. I'm also conducting research at the Aerospace Systems Design Laboratory, tackling questions like, \"Should we use nuclear reactors in rockets?\" and \"How can we generate power on the Moon?\", and venturing out of my comfort zone to learn about new engineering subjects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a South Asian woman in engineering, I draw on the diverse ideas and perspectives from my upbringing. I bring this understanding into my teaching by finding common ground with others, and connecting on both an academic and personal level. Through my involvement in the Society of Women Engineers, I've engaged with engineers from various backgrounds and am committed to increasing minority representation in engineering.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not working on rocket motors or diving into technical reports, I enjoy taking long walks around campus while listening to carefully curated playlists, writing stories and poems in my journal, or getting lost in books. I'm passionate about sharing my love for STEM and hope to inspire others to stay curious and ask more questions!\u003c/p\u003e","teachingVideoPlaybackId":"Q9hNB1EZvPi1JRU59WkJTTJqS2WCJy8ZdGV1kIsv5vg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"56b8d3a8-f62e-4741-a7ff-ee577ef7cff3\"}"},{"__ref":"Favorites:{\"uuid\":\"8d558ec9-22b0-42eb-8732-7e898a2964e7\"}"}],"causesSupported":[],"major":"Aerospace Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b15c5a92-b478-4040-8fcc-4b9e36761bbd\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a188a30-d097-4cb1-8ec7-806486332794\"}"},{"__ref":"DeepDives:{\"uuid\":\"c804d65e-4ab8-42ad-9707-5a3892321f30\"}"},{"__ref":"DeepDives:{\"uuid\":\"62d27ea8-8316-4dc0-8303-00924d46ce6a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/347c0a01-bd01-4144-8a57-3e6fdb114c3d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"421ca45c-231a-4444-a147-2f81f76c1097\"}"},{"__ref":"Education:{\"uuid\":\"1a640a9b-2672-4b67-9095-8a4fd070817b\"}"}],"hiredAt":"2024-09-13T02:36:43.343Z","topics":["Aviation / Aerospace","Physics","Algebra I","Algebra II","Calculus","Geometry","Statistics","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","STEM Project"],"communityBadges":["https://ucarecdn.com/113d5871-8410-43cf-8c06-3005496319c6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nandini-kotamurthy\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e2ecfb57-50d3-4cad-a6aa-1f554afb8d29\"}"}}},"_sentryTraceData":"ac7284f251b442e18690b5145307b607-a89a68032303b708-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ac7284f251b442e18690b5145307b607,sent
