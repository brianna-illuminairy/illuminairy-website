xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"838f6865-e3e5-458c-acd0-4901aa6c3b51\"}":{"__typename":"DeepDives","uuid":"838f6865-e3e5-458c-acd0-4901aa6c3b51","content":"\u003cp\u003eI chose mentorship because I love helping younger students feel confident exploring their interests—whether in science, dance, or something entirely new. I've been lucky to have mentors who shaped my journey, and I want to give that same encouragement and guidance to others. Mentorship is a way for me to share what I’ve learned, spark curiosity, and help students realize their potential in both academic and creative spaces.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7e4f7d18-f636-4e48-82dc-390679ff23a0\"}":{"__typename":"DeepDives","uuid":"7e4f7d18-f636-4e48-82dc-390679ff23a0","content":"\u003cp\u003eI chose Neuroscience because I’ve always been fascinated by how the brain works, how it controls everything from memory and emotion to movement and perception. I’m also on the pre-med track, and neuroscience bridges my interests in medicine, psychology, and biology. It allows me to explore the science behind behavior and cognition while also preparing me to make a meaningful impact in health care, especially in areas like mental health and neurodegenerative diseases.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"a9464fc2-b607-4d59-bd48-173d169c3c4e\"}":{"__typename":"DeepDives","uuid":"a9464fc2-b607-4d59-bd48-173d169c3c4e","content":"\u003cp\u003eMy greatest role model is a former dance teammate who later became my teacher. She was a few years older than me and someone I admired from the moment I joined the team at age seven for her talent, work ethic, confidence, and kindness. When she transitioned into a teaching role, she continued to inspire me by always pushing me to be my best, both technically and mentally. She believed in me even when I doubted myself, and the way she balanced discipline with encouragement left a lasting impact. She showed me what it means to lead with both strength and empathy, and I carry that with me in everything I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"707a6b9f-90e8-4907-89da-749f44d2e154\"}":{"__typename":"DeepDives","uuid":"707a6b9f-90e8-4907-89da-749f44d2e154","content":"\u003cp\u003eMy dream job is to become a pediatric cardiologist or neurologist. I’ve always been fascinated by the complexity of the heart and brain, and I’m drawn to pediatrics because I love working with kids. I think that kids are incredibly resilient, hopeful, and strong in the face of challenges. Being able to combine my passion for science with compassionate, hands-on care for children and their families would be deeply meaningful and fulfilling for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"4b07ef42-819f-461f-9ee3-364ff16a926a\"}":{"__typename":"School","uuid":"4b07ef42-819f-461f-9ee3-364ff16a926a","name":"Guilford High School","city":"Guilford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06437"},"Education:{\"uuid\":\"0d15c40d-a624-469b-b1ab-188b356f156e\"}":{"__typename":"Education","uuid":"0d15c40d-a624-469b-b1ab-188b356f156e","school":{"__ref":"School:{\"uuid\":\"4b07ef42-819f-461f-9ee3-364ff16a926a\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a98b8da2-3897-4a1c-b7bd-808cc6c6569f\"}":{"__typename":"Education","uuid":"a98b8da2-3897-4a1c-b7bd-808cc6c6569f","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"b96fc861-09e3-4f5c-b0a3-5ac4c9943f6c\"}":{"__typename":"MentorPublicProfile","uuid":"b96fc861-09e3-4f5c-b0a3-5ac4c9943f6c","displayName":"Juliana M.","slug":"juliana-montgomery","biography":"\u003cp\u003eI’m thrilled to be joining Curious Cardinals as a mentor! I’m currently a student at Yale University majoring in Neuroscience on the pre-medical track, with a strong interest in public health and the brain’s role in behavior and cognition. Science and medicine have always been passions of mine, and I’m excited to be starting a research assistant position in a neuroscience lab at Yale that focuses on brain mapping. I love connecting complex scientific topics to real-world problems and am eager to help students do the same through their own explorations and projects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m deeply passionate about dance. I’ve been a dancer for over 15 years, training and competing in jazz, contemporary, tap, ballet, and more. At Yale, I continue to dance as a member of Yale Dancers, a student-led company. A fun fact: I won the World Tap Championships in Germany when I was both 11 and 15. It was an experience that taught me a lot about discipline, joy, and creativity. I would love to work with students who are excited about dance and help them turn their interests into meaningful passion projects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not in the lab or the studio, you’ll probably find me on a run, baking with friends, listening to music, or enjoying a good rom-com movie night. I care deeply about making learning approachable and exciting, and I love connecting with students to help them feel more confident in their academic and creative pursuits.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether you’re curious about STEM topics, passionate about the arts, or just trying to figure out where your interests might lead, I’m here to help guide, encourage, and cheer you on.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"838f6865-e3e5-458c-acd0-4901aa6c3b51\"}"},{"__ref":"DeepDives:{\"uuid\":\"7e4f7d18-f636-4e48-82dc-390679ff23a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"a9464fc2-b607-4d59-bd48-173d169c3c4e\"}"},{"__ref":"DeepDives:{\"uuid\":\"707a6b9f-90e8-4907-89da-749f44d2e154\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a9483117-d9e0-4245-ade5-fcbcba30d1fb/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0d15c40d-a624-469b-b1ab-188b356f156e\"}"},{"__ref":"Education:{\"uuid\":\"a98b8da2-3897-4a1c-b7bd-808cc6c6569f\
