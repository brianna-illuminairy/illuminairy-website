xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"efcb93d1-24f4-49a9-b45d-7248b0ac6449\"}":{"__typename":"CausesSupported","uuid":"efcb93d1-24f4-49a9-b45d-7248b0ac6449","name":"Project 150","description":"\u003cp\u003eI aided homeless high school students, raising over $200k in money and clothes.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/9fa09faa-e627-42b0-afc7-8d83be394c48/"},"CausesSupported:{\"uuid\":\"fd17eab2-36ab-4305-99c1-481c92fc4bc3\"}":{"__typename":"CausesSupported","uuid":"fd17eab2-36ab-4305-99c1-481c92fc4bc3","name":"ATLAS Project","description":"\u003cp\u003eA nonprofit leadership development program I am a coach and in the support staff\u003c/p\u003e","photoUrl":"https://ucarecdn.com/d9085372-d65d-4b0c-8276-0466297d115e/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"881fb108-923e-446d-a807-a063ed1f8494\"}":{"__typename":"DeepDives","uuid":"881fb108-923e-446d-a807-a063ed1f8494","content":"\u003cp\u003eMentorship matters because I believe every human is capable of living their dreams. We can all achieve more than we ever dreamed of, but some things take time. With guidance, one's journey can be transformed. Its about giving back to others what they gave to you.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"5fc87e58-06f1-4763-8be2-ea7212af4d1c\"}":{"__typename":"DeepDives","uuid":"5fc87e58-06f1-4763-8be2-ea7212af4d1c","content":"\u003cp\u003eOne thing I will accomplish in my life is being an astronaut. Experiencing the view of the planet from outer space. Its a crazy dream and will be met with many obstacles. Its what makes life thrilling, doing the unreasonable and uncommon.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"b5a07c20-3cd2-40b8-8793-66a591e67909\"}":{"__typename":"DeepDives","uuid":"b5a07c20-3cd2-40b8-8793-66a591e67909","content":"\u003cp\u003eI had a rollercoaster of an upbringing. Being born in a middle class family but then house hopping and not having enough for food some days. I've experienced many aspects of life, which has taught me gratitude. I approach teaching with patience, meeting the student where they are at. I know that everyone starts at different points, but where they end up has no limit. My life is a testament and it reflects on my style of teaching. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"d7634456-c4a3-4bf0-9a21-7aa64f2329a5\"}":{"__typename":"DeepDives","uuid":"d7634456-c4a3-4bf0-9a21-7aa64f2329a5","content":"\u003cp\u003eI am proud of completely turning around my life and achieving so much in the past year. Others can't believe I used to be a big time introvert, I have truly transformed myself in such a short time, it gives me confidence to achieve anything in life! From paying rent at 16 and flunking in school. I am now attending the top program in the nation for my major and working at NASA.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"91810e02-1866-48c5-ac58-49e0212b7e19\"}":{"__typename":"School","uuid":"91810e02-1866-48c5-ac58-49e0212b7e19","name":"Frontier High School","city":"Bakersfield","type":"HIGH","state":"California","country":"United States","zip":"93314"},"Education:{\"uuid\":\"cbb9cde4-e829-4870-9ebd-dc1d565d47e7\"}":{"__typename":"Education","uuid":"cbb9cde4-e829-4870-9ebd-dc1d565d47e7","school":{"__ref":"School:{\"uuid\":\"91810e02-1866-48c5-ac58-49e0212b7e19\"}"},"startYear":"2021","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"f9bc3ea5-1eb5-4236-84cc-8ff1c0d48dfa\"}":{"__typename":"Education","uuid":"f9bc3ea5-1eb5-4236-84cc-8ff1c0d48dfa","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Electrical Engineering and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"5588c125-7e21-4a38-8745-1dcf4dde4656\"}":{"__typename":"MentorPublicProfile","uuid":"5588c125-7e21-4a38-8745-1dcf4dde4656","displayName":"Harlan P.","slug":"harlan-thien","biography":"\u003cp\u003eHi! My name is Harlan Phillips, and I am excited to be part of the Curious Cardinals community. My passion for mentoring spans personal training, life and relationship coaching, academic tutoring, and leadership development. It drives me to explore new frontiers and inspire others to reach their full potential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am currently studying Electrical Engineering and Computer Sciences at the University of California, Berkeley. Before transferring to Berkeley, I attended Bakersfield College, where I founded the Code Society, raising nearly $10k to fund hackathon participation and partnering with Kern Medical to develop a web application to streamline their check-in process. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a peer mentor for the Mathematics, Engineering, Science, and Achievement (MESA) program, I hosted academic workshops on topics such as Calculus and Computer Science fundamentals, and provided one-on-one mentoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eExtracurricularly, I have been involved in NASA’s Community College Aerospace Scholars (NCAS), working on a team to design a lunar rover. Volunteering is a significant part of my life, exemplified by my work with Project 150, a non-profit organization supporting homeless high school students. Leading a team, I raised over $200,000 in donations, clothes, and food by partnering with local businesses and organizations. Additionally, I enjoy attending hackathons, recently developing a virtual personal trainer using machine learning and computer vision at LA Hacks.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, my journey began with an internship at NASA, where I developed automation scripts that revolutionized data intake processes for space radiation experiments. My work led to two return offers and a presentation at the 2023 American Society for Gravitational and Space Research (ASGSR) conference. I have published work in NASA’s technical report servers and developed an officially disclosed invention called “SBGAT-BOT” (Space Biology Graphical Abstract Tool Bot), which uses machine learning to create graphical representations of space radiation experiments, reducing the development time from hours to minutes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also interned at the Bureau of Land Management, researching and optimizing infrared and magnetic sensors to accurately detect various vehicles and animals. Currently, I am interning at Cornell University in the Astronomy department, developing a full-stack web application to classify astronomical phenomena, streamlining the process with machine learning algorithms and contributing to our understanding of the universe.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the fall, I will be working at NASA's Johnson Space Center. These diverse experiences have not only honed my technical skills but also instilled a deep sense of purpose and excitement for STEM and learning. I am passionate about sharing my knowledge and inspiring others to pursue their dreams. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am excited to bring my expertise, enthusiasm, and dedication to Curious Cardinals, and I look forward to helping you reach your goals. Together, we can explore new frontiers, innovate, and make a lasting impact in the world!\u003c/p\u003e","teachingVideoPlaybackId":"N0100D027101cZuxIpOBvMfn667kvf1soBeqO1RjNJ02GlzE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"efcb93d1-24f4-49a9-b45d-7248b0ac6449\"}"},{"__ref":"CausesSupported:{\"uuid\":\"fd17eab2-36ab-4305-99c1-481c92fc4bc3\"}"}],"major":"Electrical Engineering and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"881fb108-923e-446d-a807-a063ed1f8494\"}"},{"__ref":"DeepDives:{\"uuid\":\"5fc87e58-06f1-4763-8be2-ea7212af4d1c\"}"},{"__ref":"DeepDives:{\"uuid\":\"b5a07c20-3cd2-40b8-8793-66a591e67909\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7634456-c4a3-4bf0-9a21-7aa64f2329a5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4f46c5b6-d4b0-4c01-9285-6c9c5da06f36/-/preview/-/format/jpg/","https://ucarecdn.com/9d9d98b1-45cd-486e-a5f2-0fd41563051d/-/preview/-/format/jpg/","https://ucarecdn.com/b0d6f160-d7b5-4aa8-9f5d-75187c9508f9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cbb9cde4-e829-4870-9ebd-dc1d565d47e7\"}"},{"__ref":"Education:{\"uuid\":\"f9bc3ea5-1eb5-4236-84cc-8ff1c0d48dfa\"}"}],"hiredAt":"2024-06-30T19:53:56.324Z","topics":["Coding / Programming","Machine Learning / AI","Public Speaking","Calculus","Academic Coaching","Business / Entrepreneurship","STEM Project"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"harlan-thien\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5588c125-7e21-4a38-8745-1dcf4dde4656\"}"}}},"_sentryTraceData":"f25e07440e914bf8b68b0b9ab7ab6496-886a87fbcdff4d7e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f25e07440e914bf8b68b0b9ab7ab6496,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"harlan-thien"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></no
