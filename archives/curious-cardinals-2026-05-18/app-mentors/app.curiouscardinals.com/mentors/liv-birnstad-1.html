time off, I love pouring into my friendships, reading, and writing. But, when I really want to unwind, I love to play video games! Many people don't expect that from me, but I love diving into puzzle games! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"6652208c-b419-4473-a65f-2da59d80d25d\"}":{"__typename":"School","uuid":"6652208c-b419-4473-a65f-2da59d80d25d","name":"Capital City Public Charter School","city":"Washington","type":"HIGH","state":"District of Columbia","country":"United States","zip":"20011"},"Education:{\"uuid\":\"3729a99f-177c-4527-a831-3bed5a7e8be6\"}":{"__typename":"Education","uuid":"3729a99f-177c-4527-a831-3bed5a7e8be6","school":{"__ref":"School:{\"uuid\":\"6652208c-b419-4473-a65f-2da59d80d25d\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"4aa6c418-3db6-484c-b391-b665dc088450\"}":{"__typename":"Education","uuid":"4aa6c418-3db6-484c-b391-b665dc088450","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"History \u0026 Literature, Education","degree":null},"MentorPublicProfile:{\"uuid\":\"bfa57df9-17bc-43f8-b5e4-65018bed582c\"}":{"__typename":"MentorPublicProfile","uuid":"bfa57df9-17bc-43f8-b5e4-65018bed582c","displayName":"Liv B.","slug":"liv-birnstad-1","biography":"\u003cp\u003eHi Curious Cardinals families! My name is Liv and I am Junior at Harvard studying History and Literature, with a minor in Education Studies, and a language citation in Norwegian. My occupational goal is to enter the classroom as a teacher for students learning English as a second language.\u003c/p\u003e\u003cp\u003eGrowing up in the capital, I was emersed in political structures! I am passionate about increasing youth voice in politics, education justice, and public speaking/advocacy. For the past three years, I have been working with high school students as a debate coach. As a coach, I work with students in writing arguments ranging from political advocacies to critical theory and poetry – working with students really brings me so much joy :)! I most enjoy teaching through hands-on activities like games, stimulatory tasks, and project-based learning.\u003c/p\u003e\u003cp\u003eIn my capacity as a coach, I also support students with college and scholarship applications.  In high school, I attended a Title 1 school and attend college on a scholarship.  During high school, I was named the National Debater of the Year, a Coca-Cola Scholar, and a David M. Rubenstein Economic Club Scholar and have had a lot of experience working with students through scholarship processes. In this vein, I also support students with interview skills, project management, and resume writing.\u003c/p\u003e\u003cp\u003eOutside of debate and school, I have managed a handful of campaigns in local board of education races. This, coupled with my time as a senatorial education policy intern, has given me a unique perspective on how local and national policy functions. Additionally, I have consulted education policy organizations on how they can best include student voice in their practices. Part of my goal in this position is to ensure that student feedback on proposed policies is accurately interpreted by policymakers. During high school, I served two terms on the DC State Board of Education as a student representative where I learned about how youth engagement in the political process works.\u003c/p\u003e\u003cp\u003eI am passionate about working with young people in the areas of history, English/literature, debate, public speaking, law/government/policy, academic coaching, executive function, and passion projects! Feel free to reach out if you have any questions about my areas of expertise. I am excited to get to work with Curious Cardinals families!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"w302iw60233g02XcM015vY7t42aOUnmSgQGQvPLztqO949M","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was winning National Debater of the Year in 2023. Debate empowered me to use my voice for social change, so being recognized at a national-level made me feel incredibly heard! When I was recognized with this award, I was coaching a group of middle school students who celebrated with me! Being surrounded by the next generation of debaters as I was selected made me feel an overwhelming sense of gratitude, making this my greatest achievement! \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a19d3f1e-7398-40dc-867f-3d84aad31803\"}"},{"__ref":"Favorites:{\"uuid\":\"d8868f4b-818a-4110-9b5f-a8f4cf50c521\"}"},{"__ref":"Favorites:{\"uuid\":\"63b0e464-c560-467e-bad9-61fbee2cbfb5\"}"}],"causesSupported":[],"major":"History \u0026 Literature, Education","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"54435785-26d1-4562-8d63-dc0da0394daa\"}"},{"__ref":"DeepDives:{\"uuid\":\"86f2d411-2472-4579-9958-b66b28dc9906\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7d4e298c-fa14-4e2a-be55-92d763cafe1b/-/preview/-/format/jpg/","https://ucarecdn.com/c502bde1-5e33-436a-b04a-ccd8579164e8/-/preview/-/format/jpg/","https://ucarecdn.com/15815e9a-3f7d-4fb2-bbb4-90e467ad1084/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3729a99f-177c-4527-a831-3bed5a7e8be6\"}"},{"__ref":"Education:{\"uuid\":\"4aa6c418-3db6-484c-b391-b665dc088450\"}"}],"hiredAt":"2026-02-02T21:54:38.005Z","topics":["K-5 Grade Math","Writing","College Essay Writing","Reading","Executive Function","Academic Coaching","History","K
