xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"855ea808-af20-48e9-bff2-a3ba661e85b9\"}":{"__typename":"Favorites","uuid":"855ea808-af20-48e9-bff2-a3ba661e85b9","photoUrl":"https://ucarecdn.com/13676619-beb0-4b3f-9f84-1204d3a11a70/","title":"Emma Roberts","type":"ACTOR"},"Favorites:{\"uuid\":\"fe8cbf4c-83cd-4fca-b7c8-ca0faab6683c\"}":{"__typename":"Favorites","uuid":"fe8cbf4c-83cd-4fca-b7c8-ca0faab6683c","photoUrl":"https://ucarecdn.com/2129cf4c-681c-458a-9bea-68681eecab11/","title":"Let Go","type":"ALBUM"},"Favorites:{\"uuid\":\"9cb1d799-18c4-488d-9651-114367651586\"}":{"__typename":"Favorites","uuid":"9cb1d799-18c4-488d-9651-114367651586","photoUrl":"https://ucarecdn.com/d6cf9b89-e4c0-4a4c-b731-24b03363de03/","title":"Lana Del Rey","type":"ARTIST"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"506ee65b-d44e-45cc-b479-51be76adb2a8\"}":{"__typename":"DeepDives","uuid":"506ee65b-d44e-45cc-b479-51be76adb2a8","content":"\u003cp\u003eAs a Mexican-American from Salinas, California, my heritage and upbringing play a major role in how I approach teaching and mentoring. Coming from a community with limited resources and opportunities, I understand what it’s like to navigate school without always having the support or tools needed to succeed. That experience helps me connect with students,especially those from similar backgrounds, on a deeper level. I know how important it is to have someone who believes in you and pushes you to reach your potential. I strive to be that person for my mentees, especially for Latino students who may feel like they’re starting at a disadvantage. My goal is to give students the resources, guidance, and encouragement that I didn’t always have growing up, and to show them that they’re just as capable of succeeding.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d41f8399-cd9d-4268-8d17-c978cbf9cd67\"}":{"__typename":"DeepDives","uuid":"d41f8399-cd9d-4268-8d17-c978cbf9cd67","content":"\u003cp\u003eIn my spare time I love collecting vinyl records of my favorite artists like No Doubt, Lana Del Rey, and Charli XCX. Music is a big part of my life, and I love listening to music while going on walks in my neighborhood, especially when it's sunny. I also love spending time with friends and family, whether that’s hanging out at the beach, trying new places to eat, or just enjoying each other’s company. I grew up playing Nintendo games, and they’ve stayed a favorite way for me to unwind. Recently, I’ve also started learning how to skateboard which has been really fun and challenging.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9e74cb74-4534-4d03-8050-8bd966d70388\"}":{"__typename":"DeepDives","uuid":"9e74cb74-4534-4d03-8050-8bd966d70388","content":"\u003cp\u003eDuring high school, I spent my summers doing volunteer work with organizations like the Salvation Army and The First Tee of Monterey County, where I helped support youth programs and community events. One of the most memorable experiences I had was traveling to London and Paris through a local program called Dream Academy, which opened my eyes to new cultures and perspectives.\u003c/p\u003e\u003cp\u003eIf I could give any advice about summer planning, it’s this: don’t overwork yourself or stress too much about how every detail will look on a college application. If you’re already thinking about that, you’re probably on the right track. Focus on doing what you're passionate about, and try to give back to your community in ways that feel meaningful to you. Colleges really do appreciate genuine volunteer work and experiences that align with your academic interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a2a9532e-3ad2-427f-afb3-68ac65274d84\"}":{"__typename":"DeepDives","uuid":"a2a9532e-3ad2-427f-afb3-68ac65274d84","content":"\u003cp\u003eMentorship matters to me because I know how important it is to have someone who believes in you and helps guide you, especially when you’re navigating school or opportunities without a lot of support. Coming from a community where resources weren’t always available, I’ve seen how easy it is for students to fall behind, not because they’re not capable, but because they don’t have access to the right tools or encouragement.\u003c/p\u003e\u003cp\u003eHaving a mentor can make a huge difference. It’s not just about academics, it’s about feeling seen, supported, and confident enough to pursue your goals. I want to be that person for others. Mentorship creates a space where students can ask questions, learn without judgment, and feel like their dreams are valid. This is the kind of impact I hope to make.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"0a537c92-8dc2-4e7b-b1d2-45a0c02ff0cf\"}":{"__typename":"School","uuid":"0a537c92-8dc2-4e7b-b1d2-45a0c02ff0cf","name":"Rancho San Juan High School","city":"Salinas","type":"HIGH","state":"California","country":"United States","zip":"93906"},"Education:{\"uuid\":\"9d0330bd-452c-4c19-8db2-71a837b4afe1\"}":{"__typename":"Education","uuid":"9d0330bd-452c-4c19-8db2-71a837b4afe1","school":{"__ref":"School:{\"uuid\":\"0a537c92-8dc2-4e7b-b1d2-45a0c02ff0cf\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"9a3756ac-cb59-4f5b-9729-db3f85125cb7\"}":{"__typename":"Education","uuid":"9a3756ac-cb59-4f5b-9729-db3f85125cb7","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science and Engineering Sciences (Mechanical)","degree":null},"MentorPublicProfile:{\"uuid\":\"11159b6c-ee02-4cf3-8949-3b04540cd990\"}":{"__typename":"MentorPublicProfile","uuid":"11159b6c-ee02-4cf3-8949-3b04540cd990","displayName":"Daniel C.","slug":"daniel-coria","biography":"\u003cp\u003eHi! My name is Daniel Coria, and I’m currently studying Computer Science and Mechanical Engineering at Yale University. I’m passionate about making STEM subjects, especially math and coding, more accessible and enjoyable for younger students. Math can be one of the most intimidating subjects in school, but I truly believe that with the right support and mindset, anyone can grow to enjoy it. I love helping students reach that “aha” moment, when something that once felt confusing finally clicks for them in math. Those moments are what motivate me to keep teaching and mentoring.\u003c/p\u003e\u003cp\u003eGrowing up, I didn’t have the chance to learn coding until college, so I’m especially driven to provide that opportunity to younger students now. I volunteer teaching basic programming skills, and it’s incredibly rewarding to watch students begin to understand and even get excited about technology. My background in computer science gives me a solid foundation in logic, problem-solving, and software, while my mechanical engineering studies have given me strong skills in physics and advanced math. I’ve taken courses like thermodynamics, statics and deformation, and more, which have deepened my technical knowledge and confidence in engineering.\u003c/p\u003e\u003cp\u003eOutside of academics, I work as a student tech at Yale, where I help fix computers and support campus tech services. It’s a great way to apply my skills in a hands-on environment while also helping others. When I’m not studying or working, I love to swim, play video games, hang out with friends, and listen to music. I’m a huge Lana Del Rey fan! I’m originally from Salinas, California, so I love being near the coast and spending time at the beach whenever I can.\u003c/p\u003e\u003cp\u003eUltimately, I care deeply about helping others learn, especially in subjects that are often seen as “too hard” or “not for everyone.” Whether it’s through tutoring math or introducing someone to the world of coding, I’m always excited to share what I know and make learning feel just a little bit easier and a lot more fun.\u003c/p\u003e","teachingVideoPlaybackId":"FvW125y021M02GXS4P9jyFb5QYFDNdDQV1VutmidX2iiE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"855ea808-af20-48e9-bff2-a3ba661e85b9\"}"},{"__ref":"Favorites:{\"uuid\":\"fe8cbf4c-83cd-4fca-b7c8-ca0faab6683c\"}"},{"__ref":"Favorites:{\"uuid\":\"9cb1d799-18c4-488d-9651-114367651586\"}"}],"causesSupported":[],"major":"Computer Science and Engineering Sciences (Mechanical)","deepDives":[{"__re
