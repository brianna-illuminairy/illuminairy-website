xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b7fee5e0-0402-44c3-b053-b2ff09fed9b9\"}":{"__typename":"Favorites","uuid":"b7fee5e0-0402-44c3-b053-b2ff09fed9b9","photoUrl":"https://ucarecdn.com/025b1733-b014-42d9-b967-b4c3adecbce0/","title":"Miseducation of Lauryn Hill","type":"ALBUM"},"Favorites:{\"uuid\":\"3f4ad947-2d6b-4fbb-8d9a-3e3444ccef50\"}":{"__typename":"Favorites","uuid":"3f4ad947-2d6b-4fbb-8d9a-3e3444ccef50","photoUrl":"https://ucarecdn.com/4e893fc7-bfd0-4d3c-97ab-4c139ddd109a/","title":"Rio de Janeiro","type":"CITY"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"055745db-5570-4222-aa74-28f2730d6b5c\"}":{"__typename":"DeepDives","uuid":"055745db-5570-4222-aa74-28f2730d6b5c","content":"\u003cp\u003eI am an aspiring startup founder :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a1e877ea-3842-4723-a970-c04740eda54f\"}":{"__typename":"DeepDives","uuid":"a1e877ea-3842-4723-a970-c04740eda54f","content":"\u003cp\u003eI have had a lot of incredible mentors and resources that poured into me and guided me to the success I experience today. It is important for me to pass it down to the next generation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1a950b6f-124f-4702-a4b1-2f10949b62e4\"}":{"__typename":"DeepDives","uuid":"1a950b6f-124f-4702-a4b1-2f10949b62e4","content":"\u003cp\u003eI chose International Business because I’m energized by working across cultures and navigating diverse teams—no two days or perspectives are ever the same. I paired it with Finance as a more technical foundation, believing that strong financial knowledge is both essential and a global equalizer. Across countries and industries, access to sound financial practices can empower individuals, strengthen organizations, and unlock opportunity. Together, these fields allow me to bridge cultural understanding with analytical rigor and apply global ideas in practical, impactful ways.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"457567c5-d539-4d61-a075-a3c0a873e063\"}":{"__typename":"DeepDives","uuid":"457567c5-d539-4d61-a075-a3c0a873e063","content":"\u003cp\u003eOutside of work, I enjoy long walks on the beach, exploring new restaurants, and playing tennis and beach volleyball. I’m also passionate about cooking, travel, and women’s basketball. In my free time, I create travel content, write creatively, and make a point to read at least one book each month.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"37aedd6c-21db-4db6-8f50-bc8b911f4ad7\"}":{"__typename":"School","uuid":"37aedd6c-21db-4db6-8f50-bc8b911f4ad7","name":"The Seven Hills School - Hillsdale Campus","city":"Cincinnati","type":"HIGH","state":"Ohio","country":"United States","zip":"45227"},"Education:{\"uuid\":\"026390aa-062f-43e5-8bf6-421a41b03d4e\"}":{"__typename":"Education","uuid":"026390aa-062f-43e5-8bf6-421a41b03d4e","school":{"__ref":"School:{\"uuid\":\"37aedd6c-21db-4db6-8f50-bc8b911f4ad7\"}"},"startYear":"2014","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b693b79d-45d3-4243-83de-09465b7b8de3\"}":{"__typename":"School","uuid":"b693b79d-45d3-4243-83de-09465b7b8de3","name":"University of South Carolina","city":"Columbia","type":"COLLEGE","state":"South Carolina","country":"United States","zip":"29208"},"Education:{\"uuid\":\"1fe2686e-c761-428a-a94b-aa8760157d62\"}":{"__typename":"Education","uuid":"1fe2686e-c761-428a-a94b-aa8760157d62","school":{"__ref":"School:{\"uuid\":\"b693b79d-45d3-4243-83de-09465b7b8de3\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"Finance, International Business, and Management","degree":null},"MentorPublicProfile:{\"uuid\":\"0e8c22f8-7b29-458b-a663-c24d9bd39de7\"}":{"__typename":"MentorPublicProfile","uuid":"0e8c22f8-7b29-458b-a663-c24d9bd39de7","displayName":"Ashley L.","slug":"ashley-labrie","biography":"\u003cp\u003e\u003cstrong\u003eHi! I’m Ashley\u003c/strong\u003e—a Fulbright Scholar currently based in Rio de Janeiro, Brazil. I conduct research on Rio’s startup ecosystem in partnership with a leading business incubator, where my work focuses on commercialization strategies and funding pathways for early-stage entrepreneurs across Brazil. My research explores how founders turn ideas into viable businesses and how they navigate connections to global capital networks, especially between Brazil and the United States. This work allows me to translate real-world business concepts into practical lessons that students can understand and apply.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore Fulbright, I spent five years at JPMorgan, most recently working as a banker for startups in Los Angeles. In that role, I supported hundreds of entrepreneurs across different industries, helping them grow their businesses through tailored financial solutions. I gained deep insight into what differentiates strong ideas from scalable ventures, how founders think under pressure, and what investors look for when evaluating opportunities. These experiences shape how I mentor students—by emphasizing critical thinking, clarity of communication, and thoughtful execution rather than shortcuts or surface-level success.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI graduated \u003cem\u003emagna cum laude\u003c/em\u003e from the University of South Carolina with a degree in International Business and Finance and a minor in Portuguese, and I studied abroad in Singapore and Germany. I’m a Fulbright Scholar, a Critical Language Scholarship recipient, and an AmeriCorps alum. During college, I completed internships at MetLife, Shell, and JPMorgan and received return offers from each, giving me extensive experience navigating competitive academic and professional pathways. I also volunteered for six months as a high school college and career counselor, where I supported students with applications, goal-setting, and confidence-building. Currently, I volunteer as an English teacher for students of a wide age range here in Rio, which has strengthened my ability to adapt my teaching style to different learning needs.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor parents: my mentoring style is structured, encouraging, and outcomes-oriented. For students: our sessions are collaborative and practical—we break big ideas into manageable steps and always end with a clear plan forward. \u003cstrong\u003eI love mentoring students interested in entrepreneurship, business, finance, writing, content creation, and applications for college, fellowships, or internships.\u003c/strong\u003e I also enjoy working with students who are still exploring their interests and need help finding direction.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of work, I enjoy learning languages and travel content creation. I’m an avid reader—especially historical fiction—and love writing both personal reflective pieces and analytical think pieces. I’m a big believer that you don’t have to fit into one box, and I’m excited to support students who are curious, creative, and ready to explore what’s possible.\u003c/p\u003e","teachingVideoPlaybackId":"bv53JI8LqnOv6cMVevBSbsOVEsmx3jXebMlfqPE02LhY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b7fee5e0-0402-44c3-b053-b2ff09fed9b9\"}"},{"__ref":"Favorites:{\"uuid\":\"3f4ad947-2d6b-4fbb-8d9a-3e3444ccef50\"}"}],"causesSupported":[],"major":"Finance, International Business, and Management","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"055745db-5570-4222-aa74-28f2730d6b5c\"}"},{"__ref":"DeepDives:{\"uuid\":\"a1e877ea-3842-4723-a970-c04740eda54f\"}"},{"__ref":"DeepDives:{\"uuid\":\"1a950b6f-124f-4702-a4b1-2f10949b62e4\"}"},{"__ref":"DeepDives:{\"uuid\":\"457567c5-d539-4d61-a075-a3c0a873e063\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/795e61bb-e0ff-4a02-81f6-c5806a099fc6/-/preview/-/format/jpg/","https://ucarecdn.com/3e1b9111-43bf-4300-9058-9e9d303d760f/-/preview/-/format/jpg/","https://ucarecdn.com/d95e8064-177e-4ad2-9cd5-1fe35a949a7a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"026390aa-062f-43e5-8bf6-421a41b03d4e\"}"},{"__ref":"Education:{\"uuid\":\"1fe2686e-c761-428a-a94b-aa8760157d62\"}"}],"hiredAt":"2025-12-21T16:47:13.191Z","topics":["Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","History","Economics","Creative Writing","Business / Entrepreneurship","Finance / Investing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorP
