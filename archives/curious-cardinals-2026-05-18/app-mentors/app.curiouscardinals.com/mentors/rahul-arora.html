xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"9d19a11a-4f93-439f-be8a-df03088a5e49\"}":{"__typename":"DeepDives","uuid":"9d19a11a-4f93-439f-be8a-df03088a5e49","content":"\u003cp\u003eAs a high school student, I was curious and always experimenting. I gravitated toward STEM subjects like math, science, and computer science, because I genuinely enjoyed figuring out how things worked. I spent a lot of time building things outside of class and exploring new ideas whenever something caught my interest.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, I wasn’t someone who had everything perfectly figured out. I learned a lot through trial and error, juggling academics with extracurriculars and self-directed projects. What really shaped me was learning how to break down difficult problems, and stay persistent even when things didn’t click right away. I became more confident over time by putting myself out there, and learning from both successes and mistakes.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThose experiences are a big reason I enjoy mentoring today - I understand what it feels like to be motivated but unsure, ambitious but still learning how to channel that energy productively.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"20ebce13-2bde-4f2e-978c-5f9393ff2909\"}":{"__typename":"DeepDives","uuid":"20ebce13-2bde-4f2e-978c-5f9393ff2909","content":"\u003cp\u003eOne passion project I’ve worked on is Poll.It, a platform I built to help people better understand current events through interactive technology. \u003c/p\u003e\u003cbr\u003e\u003cp\u003ePoll.It takes complex news topics and turns them into short summaries and swipe-based polls making it easier and more engaging to learn about what’s happening in the world. The idea came from noticing how overwhelming and polarized traditional news can feel, particularly for students. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI wanted to build something that encouraged media literacy rather than passive consumption. From a technical perspective, I designed and built the platform end-to-end, working on everything from the frontend experience to backend logic, content generation, and user engagement systems. The project also involved using AI to summarize information and generate thoughtful questions that prompt users to think rather than just react.\u003c/p\u003e\u003cbr\u003e\u003cp\u003ePoll.It gained significant traction on social media, reaching tens of thousands of users and over a million views, which taught me a lot about building for real audiences and iterating based on feedback. More importantly, it reinforced my belief that technology can be used to educate, inform, and empower people\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1f7fcecf-7d01-4ca1-9f8d-66f0d924c469\"}":{"__typename":"DeepDives","uuid":"1f7fcecf-7d01-4ca1-9f8d-66f0d924c469","content":"\u003cp\u003eI chose my major because it sits at the intersection of how things work and how decisions get made. Computer Science gives me the tools to build systems and analyze problems, and turn ideas into real products. I’ve always enjoyed building - whether that meant coding websites, creating apps, or experimenting with new technologies. Computer Science gave structure to that curiosity. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver time, I became especially interested in how data and algorithms influence behavior, markets, and outcomes. Pairing CS with Financial Engineering lets me study both the technical side of building systems and the economic logic behind them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis combination also reflects the kinds of projects I enjoy working on. Ultimately, I chose my major because it allows me to build things that are both technically strong and grounded in real-world impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7a45a2c8-a63f-4a2b-b319-cef76f3c4cba\"}":{"__typename":"DeepDives","uuid":"7a45a2c8-a63f-4a2b-b319-cef76f3c4cba","content":"\u003cp\u003eIn my spare time, I like to explore. I enjoy walking around the city, trying new food spots, and discovering new hobbies to try. I spend a lot of time hanging out with classmates, whether that’s grabbing coffee, having long conversations, or just unwinding together after a busy week.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also like staying active by going on runs or getting outside whenever I can. It’s a good way for me to reset and clear my head. Having that balance outside of academics helps me stay energized, and it’s something I really value.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"48a4b02e-6066-4465-a432-e45d54f76380\"}":{"__typename":"School","uuid":"48a4b02e-6066-4465-a432-e45d54f76380","name":"Rye Country Day School","city":"Rye","type":"HIGH","state":"New York","country":"United States","zip":"10580"},"Education:{\"uuid\":\"825476ac-d725-4720-ae0d-4f3c86ea0840\"}":{"__typename":"Education","uuid":"825476ac-d725-4720-ae0d-4f3c86ea0840","school":{"__ref":"School:{\"uuid\":\"48a4b02e-6066-4465-a432-e45d54f76380\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"70ff240c-f356-4d8f-8ca1-cfccb90c0b7b\"}":{"__typename":"Education","uuid":"70ff240c-f356-4d8f-8ca1-cfccb90c0b7b","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Computer Science/Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"7798a466-77db-4de3-8e3d-0fe7c3aee20f\"}":{"__typename":"MentorPublicProfile","uuid":"7798a466-77db-4de3-8e3d-0fe7c3aee20f","displayName":"Rahul A.","slug":"rahul-arora","biography":"\u003cp\u003eHello everyone! My name is \u003cstrong\u003eRahul\u003c/strong\u003e, and I’m an \u003cstrong\u003eengineering student at Columbia University in New York\u003c/strong\u003e, studying \u003cstrong\u003eComputer Science and Financial Engineering\u003c/strong\u003e. I’m deeply interested in the intersection of \u003cstrong\u003etechnology and economics\u003c/strong\u003e, and I love building projects that apply technical skills to real-world problems. I’ve been building websites and apps for as long as I can remember, and that early curiosity eventually grew into a strong passion for understanding how software, data, and systems shape the world around us. Over time, I’ve also become especially excited about \u003cstrong\u003eAI tools\u003c/strong\u003e and how they can accelerate both the building and learning process, making it easier for people to turn ideas into reality.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I’m passionate about \u003cstrong\u003eSTEM\u003c/strong\u003e, particularly \u003cstrong\u003emath, science, and statistics\u003c/strong\u003e, because they form the foundation for clear thinking and strong problem-solving. I enjoy working through challenging problems, understanding why solutions work, and connecting abstract concepts to practical applications. Outside of class, I’m currently building a \u003cstrong\u003esports prediction market platform\u003c/strong\u003e that aims to let fans trade on their favorite athletes in a way similar to how people invest in stocks. This project has pushed me to think deeply about probability, data modeling, incentives, and system design, while also teaching me how to take an idea from concept to implementation. Through this experience, I’ve learned a lot about \u003cstrong\u003edata-driven decision making, technical execution, and entrepreneurship\u003c/strong\u003e, and I’ve grown to really enjoy the process of building from the ground up.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMore broadly, I believe technology is going to have a major impact on all of our lives, and I’m always open to new ideas and creative ways of applying it. As a mentor, I’d love to \u003cstrong\u003ebuild and explore projects alongside my students\u003c/strong\u003e - whether that’s in computer science, the arts, humanities, or finance and economics. I enjoy sharing what I know, collaborating, and meeting students where they are, using their existing interests as a foundation to develop strong technical and analytical skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, my goal is to help students feel \u003cstrong\u003econfident, curious, and equipped to thrive in an AI-driven world\u003c/strong\u003e, not just by learning tools or concepts, but by developing the mindset needed to adapt, build, and think independently.\u003c/p\u003e","teachingVideoPlaybackId":"GQVSnMVD600MttnKKb2WlSWQzZaRomdFn02vIqiueuFfQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science/Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9d19a11a-4f93-439f-be8a-df03088a5e49\"}"},{"__ref":"DeepDives:{\"uuid\":\"20ebce13-2bde-4f2e-978c-5f9393ff2909\"}"},{"__ref":"DeepDives:{\"uuid\":\"1f7fcecf-7d01-4ca1-9f8d-66f0d924c469\"}"},{"__ref":"DeepDives:{\"uuid\":\"7a45a2c8-a63f-4a2b-b319-cef76f3c4cba\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/287326dc-afb6-465a-ba7a-6a64050a3f8f/-/preview/-/format/jpg/","https://ucarecdn.com/8aa43312-9496-4172-9bba-0fde09c447bc/-/preview/-/format/jpg/","https://ucarecdn.com/e5e735ba-c600-4995-8ad1-5bdf6e14843d/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"825476ac-d725-4720-ae0d-4f3c86ea0840\"}"},{"__ref":"Education:{\"uuid\":\"70ff240c-f356-4d8f-8ca1-cfccb90c0b7b\"}"}],"hiredAt":"2026-01-23T18:16:43.303Z","topics":["Statistics","Calculus","Precalculus / Trigonometry","Geometry","Algebra I","Algebra II","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Physics","Chemistry","Spanish","Academic Coaching","College Essay Writing","Executive Function","Economics","Computer Science","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Web Design","Robotics / Electronics / CAD","Sports Analytics","Medicine / Health","Machine Learning / AI","Aviation / Aerospace","STEM Project","Game Design"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfil
