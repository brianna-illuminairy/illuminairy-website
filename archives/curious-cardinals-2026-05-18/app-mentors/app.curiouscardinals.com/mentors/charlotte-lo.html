xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"15eab858-6073-4013-9a78-9ab66871335e\"}":{"__typename":"Favorites","uuid":"15eab858-6073-4013-9a78-9ab66871335e","photoUrl":"https://ucarecdn.com/c18a3855-a426-4bcc-9c0c-31dfa656f006/","title":"Roger Federer ","type":"ATHLETE"},"Favorites:{\"uuid\":\"cf2f3140-db43-4ee8-846c-061a8ecbb1f8\"}":{"__typename":"Favorites","uuid":"cf2f3140-db43-4ee8-846c-061a8ecbb1f8","photoUrl":"https://ucarecdn.com/c18a3855-a426-4bcc-9c0c-31dfa656f006/","title":"Just Go With It","type":"MOVIE"},"Favorites:{\"uuid\":\"df0e288b-e2d1-4a8e-a6b1-c2833a749eec\"}":{"__typename":"Favorites","uuid":"df0e288b-e2d1-4a8e-a6b1-c2833a749eec","photoUrl":"https://ucarecdn.com/c18a3855-a426-4bcc-9c0c-31dfa656f006/","title":"Taipei, Taiwan","type":"CITY"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"66e420f5-8980-4761-b651-a044a02de397\"}":{"__typename":"DeepDives","uuid":"66e420f5-8980-4761-b651-a044a02de397","content":"\u003cp\u003eI love to cook and bake in my spare time. Recently, I've baked a lot of loaf cakes (apple spice, chocolate chip, and pumpkin). I also love to cook and explore recipes from all cuisines, but particularly love cooking Chinese and Taiwanese foods which I grew up eating! \u003cbr\u003e\u003cbr\u003eDuring the last couple of months, I've also been learning to watercolor. I use gouache paints, which are a more opaque version of watercolors! I love how I can get a wide range of colors and intensities to paint beautiful scenes. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"68fddbaf-dee0-4f7d-b0f6-48d2a957ea85\"}":{"__typename":"DeepDives","uuid":"68fddbaf-dee0-4f7d-b0f6-48d2a957ea85","content":"\u003cp\u003eOne thing I feared a lot in middle school and high school was failure. But, I've learned throughout the years that failure is such an important opportunity to reflect on how I can improve and also remind myself if I'm on the path that I want to be on. \u003cbr\u003e\u003cbr\u003eOne piece of advice I would give to my middle or high school self would be to embrace opportunities that are outside of my comfort zone. Even though I might fail, the lessons I learn from new experiences are the best ones yet!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"be435fec-7d93-49c5-b1e1-cbff1f4dfd71\"}":{"__typename":"DeepDives","uuid":"be435fec-7d93-49c5-b1e1-cbff1f4dfd71","content":"\u003cp\u003eI was interested in medicine beginning in high school, but wasn't sure if it was the path for me. As I went through college and had the opportunity not just to study science more deeply, but also to gain some clinical experiences, I realized that I wanted to become a physician. Next year, I will be attending medical school to officially start my journey towards becoming a physician!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"2f6deb71-f312-4839-9e91-25e2ea69459f\"}":{"__typename":"DeepDives","uuid":"2f6deb71-f312-4839-9e91-25e2ea69459f","content":"\u003cp\u003eMusic has always been a big part of my life. One of my proudest accomplishments was when I travelled to Europe and went on tour with my orchestra as a high schooler. We even performed in the Musikverein's Golden Hall, which is home to the Vienna Philharmonic. The opportunity to play amazing symphonies with my orchestra abroad is still one of my greatest achievements.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"f41ec8b9-5509-4e50-aeff-091b22b4019a\"}":{"__typename":"School","uuid":"f41ec8b9-5509-4e50-aeff-091b22b4019a","name":"Shaker Heights High School","city":"Shaker Heights","type":"HIGH","state":"Ohio","country":"United States","zip":"44120"},"Education:{\"uuid\":\"871f4e7a-8856-4d00-9d48-7b78396b04bb\"}":{"__typename":"Education","uuid":"871f4e7a-8856-4d00-9d48-7b78396b04bb","school":{"__ref":"School:{\"uuid\":\"f41ec8b9-5509-4e50-aeff-091b22b4019a\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}":{"__typename":"School","uuid":"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41","name":"Rice University","city":"Houston","type":"COLLEGE","state":"Texas","country":"United States","zip":"77005"},"Education:{\"uuid\":\"3d2544f9-b18d-4e3f-b04e-a0ffaef5f162\"}":{"__typename":"Education","uuid":"3d2544f9-b18d-4e3f-b04e-a0ffaef5f162","school":{"__ref":"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Sports Medicine and Exercise Physiology; Biochemistry and Cell Biology Minor","degree":null},"Testimonial:a3cfb881-1a8c-4cf8-a9ca-bf752433a23e":{"__typename":"Testimonial","id":"a3cfb881-1a8c-4cf8-a9ca-bf752433a23e","text":"Charlotte is brilliant, kind, and supportive.  She is the PERFECT mentor.  I recommend her 1000000%!","date":"2025-05-30 22:23:56.155+00","rating":5,"endorser":{"__typename":"Endorser","name":"Gayle Greenberg ","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"6aa61b95-c517-4388-8014-cea1b91c686c\"}":{"__typename":"MentorPublicProfile","uuid":"6aa61b95-c517-4388-8014-cea1b91c686c","displayName":"Charlotte L.","slug":"charlotte-lo","biography":"\u003cp\u003eCharlotte is a current medical student at the Northwestern University Feinberg School of Medicine. She is also a graduate from Rice University (Class of 2023). She was born and raised in Cleveland, Ohio where she grew up with her parents and two older sisters. At Rice, she majored in Sports Medicine and Exercise Physiology and minored in Biochemistry. She chose her major because she loved how the classes allowed her to study the big picture of the more detailed biology and biochemistry that she was already studying in her minor. In addition, Charlotte has always enjoyed sports (she played soccer and ran cross-country and track throughout her childhood and high school) and she thought the major would be such an interesting look into the science behind sports.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, Charlotte served as an EMT for Rice University, which helped her solidify her decision to pursue a career as a physician. She also enjoyed serving as a teaching assistant and academic mentor during college, which is a large reason why she is so excited to be a part of Curious Cardinals! \u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, Charlotte loves to cook, run, play viola and piano, and paint watercolors! You can often find her exploring a new restaurant around Chicago or calling one of her older sisters for a chat. She is content with a steaming cup of tea and a good book in front of her.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo Charlotte, mentorship is all about forming personal connections and helping inspire and guide mentees. Her top priority is to help mentees find their passions, learn to think critically, and enjoy the process of learning. Charlotte understands that each mentee has their own strengths, weaknesses, and ways of learning. Her goal is to work with each mentee’s unique skills and interests to help them gain a deeper understanding of what sparks passion inside of them. She also can’t wait to learn more about mentees’ interests outside of the classroom to form a personal relationship with them and create a friendly and fun learning environment!\u003c/p\u003e","teachingVideoPlaybackId":"R2N01Qpq5C33HxsAue82WRzLjf1Y4MaoQl14tPDsIL7I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"15eab858-6073-4013-9a78-9ab66871335e\"}"},{"__ref":"Favorites:{\"uuid\":\"cf2f3140-db43-4ee8-846c-061a8ecbb1f8\"}"},{"__ref":"Favorites:{\"uuid\":\"df0e288b-e2d1-4a8e-a6b1-c2833a749eec\"}"}],"causesSupported":[],"major":"Sports Medicine and Exercise Physiology; Biochemistry and Cell Biology Minor","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"66e420f5-8980-4761-b651-a044a02de397\"}"},{"__ref":"DeepDives:{\"uuid\":\"68fddbaf-dee0-4f7d-b0f6-48d2a957ea85\"}"},{"__ref":"DeepDives:{\"uuid\":\"be435fec-7d93-49c5-b1e1-cbff1f4dfd71\"}"},{"__ref":"DeepDives:{\"uuid\":\"2f6deb71-f312-4839-9e91-25e2ea69459f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ada5bb07-7070-4886-abd0-2a6ac53fddba/-/preview/-/format/jpg/","https://ucarecdn.com/310faded-7c9a-4042-a86d-529c16ca16f5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"871f4e7a-8856-4d00-9d48-7b78396b04bb\"}"},{"__ref":"Education:{\"uuid\":\"3d2544f9-b18d-4e3f-b04e-a0ffaef5f162\"}"}],"hiredAt":"2023-12-15T22:40:56.200Z","topics":["STEM Project","Medicine / Health","Algebra I","Alg
