xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6c52394a-3f86-4c64-bbcc-bd5d6c2179f3\"}":{"__typename":"Favorites","uuid":"6c52394a-3f86-4c64-bbcc-bd5d6c2179f3","photoUrl":"https://ucarecdn.com/9c1d421e-6a24-48f6-afd7-13d07f99a8c6/","title":"Adam Sandler ","type":"ACTOR"},"Favorites:{\"uuid\":\"eafdf88d-e8f1-434a-b1e3-a431a66ad38d\"}":{"__typename":"Favorites","uuid":"eafdf88d-e8f1-434a-b1e3-a431a66ad38d","photoUrl":"https://ucarecdn.com/d66291ad-7db4-48b2-bff2-741c8f9264c8/","title":"Led Zeppelin ","type":"ARTIST"},"Favorites:{\"uuid\":\"517cfd69-f4e9-41f3-8c11-6ccba6b16073\"}":{"__typename":"Favorites","uuid":"517cfd69-f4e9-41f3-8c11-6ccba6b16073","photoUrl":"https://ucarecdn.com/5f9aa05d-ca77-41ea-a381-b347d3062762/","title":"Animal Farm","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9f84f3f3-4224-4721-a508-ef48579932ba\"}":{"__typename":"DeepDives","uuid":"9f84f3f3-4224-4721-a508-ef48579932ba","content":"\u003cp\u003eI would love to go back and tell myself that all the work I was doing and the colossal effort that I was putting into it was enough. I think that often times we get far too caught up in worrying about if our efforts are paying off, and consequently our academic motivation may start to dwindle. During my high school career, there is no denying that I feel victim to this mentality more than a few times. Now in retrospect, I can confidently say that my personal application in all of my school work and extracurriculars was more than enough to enable me to achieve my goals. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"fa689f71-26cd-4361-b4f4-e04f17334b88\"}":{"__typename":"DeepDives","uuid":"fa689f71-26cd-4361-b4f4-e04f17334b88","content":"\u003cp\u003eWhile I possess a number of different goals and aspirations in my lifetime, I would say my primary focus is to make a noticeable difference in the world around me. While granted this may sound very broad, I specifically want to found a company that houses a product or service that improves the lives of those in my community and beyond. At this current moment, the idea of pursuing an entrepreneurial career path is a wildly attractive venture. While I currently possess minimal experience with providing professional services, I hope that experiences such as mentoring with Curious Cardinals will help further my path towards entrepreneurship.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"786ca624-e891-48e4-b3c1-4637a50c2896\"}":{"__typename":"DeepDives","uuid":"786ca624-e891-48e4-b3c1-4637a50c2896","content":"\u003cp\u003eAs students around the world, we are constantly dealing with the pile up of our numerous separate obligations. Responsibilities such as school work, extracurriculars, and personal work can often compound unexpectedly and result in great deals of stress and worry; it is a predicament that people of all ages can relate to. As a result, many of us are forced to seek for external sources of motivation to keep us focused on our daily tasks at hand. For me, I have found that my strongest source of motivation is the personal belief of bettering myself everyday and the long-term sense of accomplishment I will feel after all my work is finished. I am not simply focused on that feeling of relief that many like myself experience after a long homework session in the library, but instead I look to my far future and imagine how triumphant I will feel in retrospect. My typical everyday tasks, anything from doing homework to exercising in the gym, these minute actions all compile to make me a better version of myself every day, and in the long run I can do nothing but look forward to the accomplished person I will become however many years from now. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5cd8c76c-0006-4c77-ab58-f23b0ea792a6\"}":{"__typename":"DeepDives","uuid":"5cd8c76c-0006-4c77-ab58-f23b0ea792a6","content":"\u003cp\u003eAfter graduating high school, my immediate plan was to attend university and pursue a rather unique degree in chemical engineering. Having heavily enjoyed the totality of my STEM classes throughout high school, especially chemistry and physics, I was initially set on a rather niche major despite not understanding much of its intricacies. However, once I arrived at Stanford and met with a number of chemical engineering students, I swiftly discovered that this discipline was not  something I would like to pursue long-term. At the same time, I became acquainted with several other management science and engineering students, many of whom had past experience with financial and investment banking internships. Speaking with them, I learned much about the field of big business, financial analysis, venture capital, and much more, and I was instantly invested. To me, this discipline seems not only much more fulfilling and enjoyable, but also more time-proof as well. I firmly believe that, if I pursue this career path to the fullest, I will easily succeed in any field of the business realm from investment banking to venture capital, making constant breakthroughs and improving the lives of millions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"8dfb15e5-111b-4145-be65-b552c7754534\"}":{"__typename":"School","uuid":"8dfb15e5-111b-4145-be65-b552c7754534","name":"St Viator High School","city":"Arlington Heights","type":"HIGH","state":"Illinois","country":"United States","zip":"60004"},"Education:{\"uuid\":\"f9c0a753-6b29-4d18-8610-5945b9e927ca\"}":{"__typename":"Education","uuid":"f9c0a753-6b29-4d18-8610-5945b9e927ca","school":{"__ref":"School:{\"uuid\":\"8dfb15e5-111b-4145-be65-b552c7754534\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"9f9e2e76-ebf3-4518-8e8e-a23aaab6559b\"}":{"__typename":"Education","uuid":"9f9e2e76-ebf3-4518-8e8e-a23aaab6559b","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Management Science \u0026 Engineering","degree":null},"Testimonial:34761766-592e-412c-a46d-7406338eb190":{"__typename":"Testimonial","id":"34761766-592e-412c-a46d-7406338eb190","text":"Tom was a great mentor and helped my son with a summer YouTube video project and executive functioning throughout the school year. He was easy to communicate with and glad that he could serve as a role model for my son. Thank you!","date":"2025-06-22 00:30:34.09+00","rating":5,"endorser":{"__typename":"Endorser","name":"Susan Kwok","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"c0a68e1e-adff-4481-9128-4cdf8c671cf2\"}":{"__typename":"MentorPublicProfile","uuid":"c0a68e1e-adff-4481-9128-4cdf8c671cf2","displayName":"Thomas S.","slug":"thomas-sneed","biography":"\u003cp\u003eHello, my name is Tom Sneed and I am a current junior at Stanford University! Right now, I am on track to major in Management Science and Engineering, Stanford's main business school track degree, with a dual minor in Computer Science. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout high school, I was always incredibly interested in STEM centered learning, specifically the areas of organic chemistry and integral calculus. During my free time, I was a trampoline gymnast, a sport which I came to love very dearly after retiring from a ten year career. Additionally, I always enjoyed attending weekend camping trips with my fellow Boy Scouts, an organization of which I was involved with until I turned 18 and earned my Eagle Scout rank. Here at Stanford, I am extremely excited to take advantage of the numerous advanced educational opportunities presented to me. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I was recommended for Curious Cardinals by a fellow colleague of mine earlier this year, I gained swift interest, as being able to mentor younger students and help them further their academic repertoire was a privilege I did not have access to growing up. As of now, I have been a mentor for over half a year, working with several students of different ages on a variety of different projects each month! My experience so far with Curious Cardinals is something I will cherish for the rest of my life, and I look forward to continue the journey impacting countless new students along the way! \u003c/p\u003e","teachingVideoPlaybackId":"7sdXv8o81xbYNAwbyaeouxw016sQTYXY600Gow4LNbGRQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn my opinion, my greatest achievement was the completion of my Eagle Scout project and subsequent earning of my Eagle Scout rank on January 25, 2022. For those that are unfamiliar, the Eagle Scout rank is the pinnacle of any Boy Scout's scouting career. Starting at the age of 11, my parents enrolled me in my local Boy Scout troop. At that age, I was unaware of the journey that awaited me, for I did not understand the concept of self-betterment and good citizenship that scouting taught (I was just excited to go camping with my friends!). However, I swiftly learned just how fulfilling and meaningful these next 7 years of my life would be. As I continued through scouting, I traversed through the prior 6 ranks of scouting very swiftly through learning several different basic camping skills, anything from knot tying, starting fires, identifying types of fauna, etc.. Once I reached the base of the Eagle Rank, my core skills of leadership, project planning, and organization were truly tested. For my project, I planned to map out miles of trails at my local park and install multiple trail maps and mile markers at different locations. Although the concept seemed simple, the entire process took myriads of effort and coordination; I very quickly learned how challenging any type of community service project can amount to. In the end, my project amassed around 110 hours of community service total and required nearly $600 of funds in the budget and several dozen nonprofit volunteers to be completed. In ultimatum, the sense of accomplishment I felt when I finally received my Eagle Scout certification was like nothing I had ever felt before. To this day, I continue to reminisce of the fulfillment from this experience and use it as motivation to continue chasing my dreams and aspirations, no matter how substantial they may seem. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"6c52394a-3f86-4c64-bbcc-bd5d6c2179f3\"}"},{"__ref":"Favorites:{\"uuid\":\"eafdf88d-e8f1-434a-b1e3-a431a66ad38d\"}"},{"__ref":"Favorites:{\"uuid\":\"517cfd69-f4e9-41f3-8c11-6ccba6b16073\"}"}],"causesSupported":[],"major":"Management Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9f84f3f3-4224-4721-a508-ef48579932ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"fa689f71-26cd-4361-b4f4-e04f17334b88\"}"},{"__ref":"DeepDives:{\"uuid\":\"786ca624-e891-48e4-b3c1-4637a50c2896\"}"},{"__ref":"DeepDives:{\"uuid\":\"5cd8c76c-0006-4c77-ab58-f23b0ea792a6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/db7afeb4-1f34-4a97-8e70-7dbd2225ee3a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f9c0a753-6b29-4d18-8610-5945b9e927ca\"}"},{"__ref":"Education:{\"uuid\":\"9f9e2e76-ebf3-4518-8e8e-a23aaab6559b\"}"}],"hiredAt":"2023-11-08T10:23:26.487Z","topics":["K-5 Grade Math","Algebra I","Geometry","Precalculus / Trigonometry","Calculus","Algebra II","Pre-Algebra","Statistics","6-8 Grade Science","Chemistry","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Computer Science"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:34761766-592e-412c-a46d-7406338eb190"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"thomas-sneed\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c0a68e1e-adff-4481-9128-4cdf8c671cf2\"}"}}},"_sentryTraceData":"b1620a7dd7394a3e89a4273ea0600355-954927770bb9f205-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b1620a7dd7394a3e89a4273ea0600355,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug
