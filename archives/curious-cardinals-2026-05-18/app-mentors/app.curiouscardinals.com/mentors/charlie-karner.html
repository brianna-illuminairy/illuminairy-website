xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"ddadd6ed-d8e1-4610-80d4-bacb5240b956\"}":{"__typename":"CausesSupported","uuid":"ddadd6ed-d8e1-4610-80d4-bacb5240b956","name":"Black Lives Matter","description":"\u003cp\u003eBLM fights institutional injustice, supporting Black communities directly.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/f3911d6a-0fe8-46a1-bfe0-d70a1b98dd33/"},"CausesSupported:{\"uuid\":\"d1a426f6-5dd9-4ee2-8231-1a06d84cb4a0\"}":{"__typename":"CausesSupported","uuid":"d1a426f6-5dd9-4ee2-8231-1a06d84cb4a0","name":"Save the Children","description":"\u003cp\u003eThis charity supports uplifting children in the world facing unjust violence.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/066daed8-b211-47c2-b060-e364758e192d/"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e8a49808-3366-4a26-8688-99373b52f583\"}":{"__typename":"DeepDives","uuid":"e8a49808-3366-4a26-8688-99373b52f583","content":"\u003cp\u003eI think about this question often, and I have determined that my most important accomplishments have been realized through love for the world around me; prioritizing community care and working to build networks of support that last long beyond my lifetime feels incredibly important to me. In other words, I would love to leave the world a better place than when I found it so generations after me can continue to grow and thrive.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b57227ce-dfcb-4270-b45d-5c86a5ffefac\"}":{"__typename":"DeepDives","uuid":"b57227ce-dfcb-4270-b45d-5c86a5ffefac","content":"\u003cp\u003eI chose to study music because I am planning on performing and producing music as my career after college, but I am also very interested in how music interacts with the social sciences! I would love to learn more about how music can be used as a tool for bringing people together and sparking positive change in our world :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"4056aa7e-8b0d-45bd-aa9c-0763d1c9b54f\"}":{"__typename":"DeepDives","uuid":"4056aa7e-8b0d-45bd-aa9c-0763d1c9b54f","content":"\u003cp\u003eFirst and foremost, I would give little me a big hug. I would tell myself that I can carve my own path independent of what others are doing, that I can be who I am without shame, and that I can continue to grow and change. I think high school and middle school can feel like times with many external pressures, and I would advise myself to tune into my own dreams, desires, and goals rather than looking outward for validation of my capabilities. A mentorship like Curious Cardinals certainly would help inspire this mindset!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0934374c-4552-4e93-b39d-b31b85f14af9\"}":{"__typename":"DeepDives","uuid":"0934374c-4552-4e93-b39d-b31b85f14af9","content":"\u003cp\u003eI love creating and connecting with those around me, but I also love reflecting and connecting with myself. So, you'll often either find me walking with a friend to photosynthesize in the sun (like a plant!) or sitting at a cafe—headphones on—alone with my journal and my thoughts. A balance between the two feels so necessary, and I love when I can lean into both sides of myself.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSecondly, I'm currently learning how to play guitar and piano. I am also figuring out how to work with Logic Pro so that I can begin producing and creating on a more regular basis.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThirdly, I want to read independently more often! I believe that reading holds so much untapped creative inspiration.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFinally, I try to spend as much time as possible in nature, whether that's traversing hiking trails or meditating near the water. Fun fact: I took a gap year prior to college and road tripped across the US with the primary goal of visiting National and State Parks!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"d94c77cf-3660-4a96-9a95-50a78da85b2e\"}":{"__typename":"School","uuid":"d94c77cf-3660-4a96-9a95-50a78da85b2e","name":"Central High School","city":"Burlington","type":"HIGH","state":"Illinois","country":"United States","zip":"60109"},"Education:{\"uuid\":\"33984045-d7e4-44f2-92a5-76a51731b676\"}":{"__typename":"Education","uuid":"33984045-d7e4-44f2-92a5-76a51731b676","school":{"__ref":"School:{\"uuid\":\"d94c77cf-3660-4a96-9a95-50a78da85b2e\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"c7bca8a7-b6c3-4cb4-bacb-439d1a608ff4\"}":{"__typename":"Education","uuid":"c7bca8a7-b6c3-4cb4-bacb-439d1a608ff4","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Music","degree":null},"MentorPublicProfile:{\"uuid\":\"b82fdacc-bead-4c6f-a537-e3d12b9a59e5\"}":{"__typename":"MentorPublicProfile","uuid":"b82fdacc-bead-4c6f-a537-e3d12b9a59e5","displayName":"Charlie K.","slug":"charlie-karner","biography":"\u003cp\u003eHi everyone! My name is Charlie, and I am a student at Yale University studying music; specifically, I am interested in the way that music intersects with the social sciences. I would be a senior this year, but, instead, I am taking a gap year to participate in an a cappella group called the Yale Whiffenpoofs. Throughout this year, I will spend my time touring with 13 other students to share our music both domestically and internationally, alongside helping to create a studio-recorded album that you’ll soon find on all streaming platforms (#staytuned)! Although this is an exciting and music-filled experience, it certainly doesn’t mean that I have stopped learning from the world around me—on the contrary, I am excited to lean into self-directed discovery by reading, exploring Yale’s archives, and engaging in community-based care and organizing. Furthermore, participating in the Whiffs does not mark my first pivot from the traditional 4-year college experience: I recently studied abroad for a semester in Milan, Italy, as well as for a summer in Bilbao, Spain. I am beyond grateful for these opportunities, not only for the cultural immersion that I have been privileged to experience but also for the deep and intentional self-reflection that my path has inspired within me. I am excited to meet you, learn from your experiences as well, and provide support for you to create your own self-defined path, too!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow, you may be reading this and wondering, “How can Charlie help my high school or middle school student navigate their experiences if he’s on a gap year?” To answer that question, let’s take it back a few years: I value my experiences prior to college as instrumental in shaping my personality today. My involvement in music groups throughout high school—marching band, concert band, show choir, many musical (and non-musical) theater productions, the Honors Performance Series at Carnegie Hall, classical vocal competitions, the Institute for American Musical Theater Bootcamp, and more—opened doors for more musical training and, perhaps more importantly, taught me about the importance of interpersonal awareness and emotional regulation. I also prioritized intellectual and academic pursuits, including student council, the National Honors Society, the Worldwide Youth in Science and Engineering Program, and an internship at Fermilab accelerator laboratory, further solidifying my desire to seek a range of unique experiences throughout my life.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eStaying true to my desire for exploration and personal expansion, I participated in various organizations like the Yale Undergraduate Prison Project, Yale Effective Altruism, the Yale Endowment Justice Collective, the Yale Artists’ Cabaret, the Yale Songwriters Collective, and Doox of Yale (my undergraduate a cappella group) throughout my first three years here at Yale. I plan on continuing to try new experiences throughout this year, and I hope to inspire evolution and growth in other students through the Curious Cardinals mentorship program. I hope to talk to you soon, and I wish you all the best!\u003c/p\u003e","teachingVideoPlaybackId":"NySDYKKJhAx01Y01OsxG2OhIHUDgo006wKktr01MKDqAlps","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"ddadd6ed-d8e1-4610-80d4-bacb5240b956\"}"},{"__ref":"CausesSupported:{\"uuid\":\"d1a426f6-5dd9-4ee2-8231-1a06d84cb4a0\"}"}],"major":"Music","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e8a49808-3366-4a26-8688-99373b52f583\"}"},{"__ref":"DeepDives:{\"uuid\":\"b57227ce-dfcb-4270-b45d-5c86a5ffefac\"}"},{"__ref":"DeepDives:{\"uuid\":\"4056aa7e-8b0d-45bd-aa9c-0763d1c9b54f\"}"},{"__ref":"DeepDives:{\"uuid\":\"0934374c-4552-4e93-b39d-b31b85f14af9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2db8c0b1-c39b-404a-b3dc-a2871cc08b2c/-/preview/-/format/jpg/","https://ucarecdn.com/4f5e70b0-40c5-470a-8a7b-68ceac508821/-/preview/-/format/jpg/","https://ucarecdn.com/db67174a-e02c-44fc-842a-77b63643168e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"PREFER_NOT_TO_SAY","education":[{"__ref":"Education:{\"uuid\":\"33984045-d7e4-44f2-92a5-76a51731b676\"}"},{"__ref":"Education:{\"uuid\":\"c7bca8a7-b6c3-4cb4-bacb-439d1a608ff4\"}"}],"hiredAt":"2024-11-05T15:19:12.501Z","topics":["Music","Film / Theater","Creative Writing","Video / Photography","History Project","Public Speaking","Journalism","Reading","History","Executive Function","Academic Coaching","Writing"],"communityBadges":["https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"charlie-karner\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b82fdacc-bead-4c6f-a537-e3d12b9a59e5\"}"}}},"_sentryTraceData":"ed1d1ed19b25418f889b4e5ea2629019-a09c898d1f07fcc3-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ed1d1ed19b25418f8
