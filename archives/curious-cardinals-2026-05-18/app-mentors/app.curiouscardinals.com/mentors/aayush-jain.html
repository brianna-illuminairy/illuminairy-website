id\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e3e12232-69ad-4267-82c4-f3c548680f17\"}":{"__typename":"DeepDives","uuid":"e3e12232-69ad-4267-82c4-f3c548680f17","content":"\u003cp\u003eBuilding solutions to the most pressing problems we face in society today, whether it be revamping our healthcare infrastructure or rethinking education.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f49eea94-949d-42fc-a49b-8960776fa5b6\"}":{"__typename":"DeepDives","uuid":"f49eea94-949d-42fc-a49b-8960776fa5b6","content":"\u003cp\u003eSpent my days handling tumor cells and developing a computational models to analyze those same cells, and nights painting and cruising down Beale Street. Building up my arts education non-profit, Tennessee Arts Initiative, and attended Tennessee's Governor's School for the Arts on a full-ride merit scholarship. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"6ab1cff0-0300-49b7-a60a-1b18d63d7199\"}":{"__typename":"DeepDives","uuid":"6ab1cff0-0300-49b7-a60a-1b18d63d7199","content":"\u003cp\u003ePlaying tennis, painting, cooking, and trying out new restaurants and cafes with friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"de41e65d-76b3-489a-b94f-c7da1154cd00\"}":{"__typename":"Education","uuid":"de41e65d-76b3-489a-b94f-c7da1154cd00","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":"Bachelors"},"School:{\"uuid\":\"eede09df-ce5e-4eb1-85f2-439aa31f30ca\"}":{"__typename":"School","uuid":"eede09df-ce5e-4eb1-85f2-439aa31f30ca","name":"White Station High School","city":"Memphis","type":"HIGH","state":"Tennessee","country":"United States","zip":"38117"},"Education:{\"uuid\":\"0f622850-3c39-42ca-80f3-f09bd2c9c270\"}":{"__typename":"Education","uuid":"0f622850-3c39-42ca-80f3-f09bd2c9c270","school":{"__ref":"School:{\"uuid\":\"eede09df-ce5e-4eb1-85f2-439aa31f30ca\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"05f45c3f-90af-4182-a60c-b182909f4677\"}":{"__typename":"MentorPublicProfile","uuid":"05f45c3f-90af-4182-a60c-b182909f4677","displayName":"Aayush J.","slug":"aayush-jain","biography":"\u003cp\u003eAayush is a rising junior at Stanford University studying Computer Science and Philosophy. He's passionate about using software to boost accessibility in industries from healthcare to education, and loves mentoring students and guiding them as they carve out their own paths. He has worked at startups and enterprises like Apple and Glean. On campus, he directs the $100k Startup Challenge run by BASES, Stanford's largest entrepreneurial organization, and invests in student founders as an Investment Partner at Impact First Ventures.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, Aayush delved into computational biology research at St. Jude Children’s Research Hospital and the University of Memphis. He authored and co-authored papers in journals including the Journal of Cancer and International Journal of Molecular Sciences, garnering 150+ citations. His love for biology earned him a Top 50 placement in the USA Biology Olympiad and a Silver Medal in the British Biology Olympiad, and his passion for art and poetry led to him being named a National YoungArts Winner and a National Scholastic Art and Writing Awards Gold Medalist.\u0026nbsp;His art has been exhibited at the Pratt Manhattan Gallery, Memphis International Airport, and Brooks Museum of Art, among others, and has been sold to businesses like Gus's Fried Chicken and private customers. He also loves building, starting and scaling multiple small businesses, including a digital home portrait Etsy shop, a college merch Redbubble shop, and is currently building education technology software.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen applying to college, he got into Stanford, Harvard, Penn's M\u0026amp;T Program, Cornell Engineering, Northwestern, WashU, Rice, and UCLA Computer Science, among others. He also received numerous scholarships, such as the Hunter R. Rawlings III Cornell Presidential Research Scholarship, the Cornelius Vanderbilt Scholarship, the UC Regents Scholarship, and more.\u003c/p\u003e","teachingVideoPlaybackId":"502coMGmakXaaLqR1roV4l01W73D92IhhOeyKUClfXOYs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003e\u003cbr\u003eI'd say my greatest achievement isn't a single honor or activity, but rather the work ethic, mindset, and relationships I've developed along the way.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"df0caba8-1cb0-4c2b-a8bf-ede48fec68b3\"}"},{"__ref":"Favorites:{\"uuid\":\"06400d78-f724-4adc-9d42-cdbd39872a3d\"}"},{"__ref":"Favorites:{\"uuid\":\"0347b0b3-37ec-4f23-b673-4409bc1e2
