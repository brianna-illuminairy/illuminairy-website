xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"1895beb0-d4a5-4062-9a11-6e5a24b9760e\"}":{"__typename":"CausesSupported","uuid":"1895beb0-d4a5-4062-9a11-6e5a24b9760e","name":"The Alzheimer's Association","description":"\u003cp\u003eI ran the Philadelphia half marathon with The Alzheimer's Association!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/663c2497-20d6-4235-a06f-8dd06c47b2ce/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"cf706faa-7681-4ca2-bc0b-7d8200c12be7\"}":{"__typename":"DeepDives","uuid":"cf706faa-7681-4ca2-bc0b-7d8200c12be7","content":"\u003cp\u003eAdvocate for yourself! This is something my parents have instilled in me from a young age, but I would tell my younger self to really value these words. As somewhat of an introvert, I have had to train myself to counteract my tendency to only take what is given to me. However, it's important not to be afraid to express your goals and take initiative—whether it be in school, extracurriculars, or personal growth. Ask questions and seek out opportunities that excite you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"6af2ec7c-7c07-4f61-81ae-affc1db368c8\"}":{"__typename":"DeepDives","uuid":"6af2ec7c-7c07-4f61-81ae-affc1db368c8","content":"\u003cp\u003eI hope to run the NYC marathon! I recently ran the Philly half marathon and it was life changing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c93851bb-94ad-4a50-b414-c32fcc5124ae\"}":{"__typename":"DeepDives","uuid":"c93851bb-94ad-4a50-b414-c32fcc5124ae","content":"\u003cp\u003eHaving someone to look up to––someone who can relate to your experiences, ease your concerns, and offer guidance––can make a world of a difference. I always wished for an older sibling to serve as my role model, but instead, I've found fulfillment in being that person for my younger brother. Now, I hope to support other students in the same way, helping them navigate challenges while empowering them to forge their own paths.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f884d805-b968-43e3-ae89-31ede7ff151c\"}":{"__typename":"DeepDives","uuid":"f884d805-b968-43e3-ae89-31ede7ff151c","content":"\u003cp\u003eMy dream job is to be an entertainment lawyer at a firm where I can work on exciting deals at the intersection of media, law, and business––like representing Stevie Wonder in a deal licensing his music for a new HBO miniseries. I'm passionate about protecting artists' creative rights, helping them expand into new creative mediums, and bringing compelling projects to life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"87dc4f3c-9aad-4b95-ab58-b516397c0bd1\"}":{"__typename":"Education","uuid":"87dc4f3c-9aad-4b95-ab58-b516397c0bd1","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"6824f6c3-f27a-4b03-bc6f-1e9875a943dd\"}":{"__typename":"Education","uuid":"6824f6c3-f27a-4b03-bc6f-1e9875a943dd","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Philosophy, Politics and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"50cb4325-6b85-4ecc-a863-c8079e96bcf3\"}":{"__typename":"MentorPublicProfile","uuid":"50cb4325-6b85-4ecc-a863-c8079e96bcf3","displayName":"Gaby C.","slug":"gaby-cohen","biography":"\u003cp\u003eHi! My name is Gaby Cohen, and I’m thrilled to be part of the Curious Cardinals team. Throughout my academic and professional journey, I’ve learned the importance of strong mentorship and advocacy, and I’m excited to be that support system for students navigating their own paths.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m a senior at the University of Pennsylvania studying Philosophy, Politics, and Economics (PPE) with a concentration in Public Policy and Governance. I am also pursuing a minor in Cinema Studies as I have a passion for film and television. I’ve explored my interests through a variety of experiences, from conducting research on the intersection of media and politics to writing and editing for the Penn Undergraduate Law Journal. I’m also involved with the Wharton Undergraduate Media and Entertainment Club’s Consulting Committee, where I help advise and strategize for a local Philadelphia production company. Most recently, I worked at NBCUniversal in Advertising Sales Data Measurement \u0026amp; Insights, where I led the creation of an internal SharePoint portal to streamline legal and vendor contract management.\u0026nbsp;After graduation, I plan to work for Paul, Weiss as an IP/Entertainment Paralegal before attending law school!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I love running, watching new (and old) movies, and trying new restaurants. I’m passionate about storytelling and problem solving in all their forms—whether through media, law, or mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my goal is to empower students to advocate for themselves, ask questions, and approach challenges with confidence. I hope to support them not just in academics—whether it’s writing, research, public speaking, or college essay prep—but also in developing the skills and mindset to succeed beyond the classroom. I’m excited to help students explore their passions, refine their goals, and gain the confidence to carve out their own unique paths!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFeel free to reach out with any questions!\u003c/p\u003e","teachingVideoPlaybackId":"KE4PSewEajwArc0202pq01VUCWDWJBucy017sHRyxntD9qk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"1895beb0-d4a5-4062-9a11-6e5a24b9760e\"}"}],"major":"Philosophy, Politics and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cf706faa-7681-4ca2-bc0b-7d8200c12be7\"}"},{"__ref":"DeepDives:{\"uuid\":\"6af2ec7c-7c07-4f61-81ae-affc1db368c8\"}"},{"__ref":"DeepDives:{\"uuid\":\"c93851bb-94ad-4a50-b414-c32fcc5124ae\"}"},{"__ref":"DeepDives:{\"uuid\":\"f884d805-b968-43e3-ae89-31
