hool":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Public Relations and Advertising ","degree":null},"MentorPublicProfile:{\"uuid\":\"64ca8872-842d-4685-ae71-8db1a1fb5e66\"}":{"__typename":"MentorPublicProfile","uuid":"64ca8872-842d-4685-ae71-8db1a1fb5e66","displayName":"Vianca   R.","slug":"vianca-ruiz","biography":"\u003cp\u003eHello! My name is Vianca, and I am a senior at the University of Southern California, where I am pursuing a degree in Public Relations and Advertising with a minor in Entrepreneurship. My goal is to one day own my own business and inspire others through my journey. My time at USC has been filled with invaluable memories, personal growth, and academic achievements, and I am excited to share my story with others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my academic journey, I have been fortunate to receive several prestigious scholarships, including the Dean's Account Scholarship, the Laura A. Platt Scholarship, the Hispanic Heritage Award, and the Hispanic Youth Award. These honors represent not only my dedication to education but also the values of perseverance and resilience that have shaped my life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrowing up, my parents divorced when I was just three years old. This experience brought its fair share of challenges during my adolescence, but it also taught me the importance of perspective, perseverance, and adaptability. These lessons have become the foundation of how I approach life, turning obstacles into opportunities for growth. They also sparked my passion for personal development, a love that has transformed my life and driven me to help others on their own journeys of growth and self-discovery.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not studying or working toward my goals, you can often find me spending time with my family, exploring the outdoors, or diving into books and practices centered on self-improvement. I believe that personal development and mentorship have the power to create lasting change, and I am passionate about sharing that with others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs someone who values authenticity, connection, and growth, I strive to create meaningful relationships and inspire others to embrace their potential. Whether through academic achievements, outdoor adventures, or my dreams of entrepreneurship, I am committed to making an impact in the lives of those I meet. I’m excited to share my experiences and insights with my future students and their families, and I hope to inspire them to pursue their own paths with confidence and determination.\u003c/p\u003e","teachingVideoPlaybackId":"iE02g8VGvxuu1M36pjeUxuAmZ9s3RgLd6w963QAfKxL4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"53e9a06f-0211-4979-9ddd-bc67257739b6\"}"}],"causesSupported":[],"major":"Public Relations and Advertising ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"37f6e7ea-8f6e-486c-a3ff-55b8afe876e0\"}"},{"__ref":"DeepDives:{\"uuid\":\"3caeb4bf-7f3c-4827-9cc0-e987b6b4205a\"}"},{"__ref":"DeepDives:{\"uuid\":\"191f7188-51e9-4391-87f3-ee1e9ee7edf8\"}"},{"__ref":"DeepDives:{\"uuid\":\"5ca54f17-ade9-4a60-9766-0a445e966f38\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6979321e-5e7c-4273-899d-98cc2944d171/-/preview/-/format/jpg/","https://ucarecdn.com/fbb56ab5-e7d6-46a7-a9fd-59eb9a1d2e52/-/preview/-/format/jpg/","https://ucarecdn.com/33321998-e851-4b88-b189-79f889fee7b9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b3f580b9-3e5b-4a6e-9041-ab1a92a12b6e\"}"},{"__ref":"Education:{\"uuid\":\"a47dff9a-fe38-43b1-9b89-131111887189\"}"}],"hiredAt":"2024-11-28T12:32:31.567Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Biology","Physics","Writing","Academic Coaching","Executive Function","Col
