js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d763fd25-a28c-4a70-9f13-cd4ea5a8097f\"}":{"__typename":"DeepDives","uuid":"d763fd25-a28c-4a70-9f13-cd4ea5a8097f","content":"\u003cp\u003eI would tell my middle or high school self that it’s okay not to have everything figured out yet—and that uncertainty isn’t a weakness, it’s a starting point. I spent a lot of time worrying about choosing the “right” path too early, when what mattered more was learning how to learn, staying curious, and being willing to try things I wasn’t immediately good at.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d also remind myself that struggling doesn’t mean I’m failing. The moments when concepts felt confusing or progress felt slow were often the ones that built the strongest foundation later on. Asking for help, taking feedback seriously, and being patient with myself would save a lot of unnecessary stress.\u003c/p\u003e\u003cp\u003eAnother piece of advice would be to focus less on comparison. It’s easy to measure success by grades, awards, or what others seem to be doing, but real growth comes from understanding what genuinely interests you and investing time there. Small projects, side interests, and quiet consistency often matter more than flashy achievements.\u003c/p\u003e\u003cp\u003eFinally, I’d say: trust that effort compounds. The skills you build, the habits you form, and the curiosity you protect will open doors you can’t yet see. Keep going, even when the path feels unclear—it will make sense later.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"48139046-9b24-41e1-b32a-beca458b0564\"}":{"__typename":"DeepDives","uuid":"48139046-9b24-41e1-b32a-beca458b0564","content":"\u003cp\u003eMentorship matters to me because so much of my own growth was shaped by people who took the time to guide me when the path wasn’t obvious. As a student navigating economics, data science, and now financial engineering, I’ve learned that talent alone isn’t enough—direction, encouragement, and honest feedback make the difference between feeling stuck and moving forward with confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my academic and professional journey, mentors helped me translate abstract interests into concrete opportunities: turning coursework into research, research into internships, and internships into long-term goals. From completing an honors thesis at UC Berkeley to working on quantitative modeling and portfolio optimization in industry settings, I saw how mentorship accelerates learning by helping students focus on what actually matters, avoid common pitfalls, and aim higher than they might on their own.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship also matters to me because I enjoy being that bridge for others. Many students—especially those drawn to technical or quantitative fields—feel intimidated or unsure where to start. I care about helping them break down complex ideas, build confidence through small wins, and see themselves as capable problem-solvers. To me, mentorship isn’t about giving answers; it’s about empowering students with the tools, perspective, and confidence to navigate challenges long after the mentoring relationship ends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"2af32a76-dc60-47b8-8034-1544ab5dd2d9\"}":{"__typename":"DeepDives","uuid":"2af32a76-dc60-47b8-8034-1544ab5dd2d9","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to help make complex, technical fields feel accessible rather than intimidating—especially for students who don’t immediately see themselves belonging in them. I’ve spent much of my academic and professional journey working at the intersection of finance, data, and machine learning, fields that can often feel opaque or reserved for a narrow group of people. I want to change how those subjects are experienced by the people learning them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough research, teaching, and mentorship, I hope to build pathways that allow students to move from curiosity to confidence. That might mean helping a student design their first meaningful project, guiding them through research or applications, or simply showing them that struggling with hard material is part of the process, not a sign they don’t belong. I care deeply about translating theory into intuition and real-world impact, whether through financial modeling, risk analysis, or data-driven decision-making.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I want my work to leave people feeling more capable than when they started. If, years from now, students I’ve mentored are tackling problems they once thought were out of reach—and mentoring others in turn—I would consider that a lifelong accomplishment worth pursuing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d7ef00df-1b8a-4542-9b6b-52b39d00be29\"}":{"__typename":"DeepDives","uuid":"d7ef00df-1b8a-4542-9b6b-52b39d00be29","content":"\u003cp\u003eI chose my major because I’ve always been drawn to understanding how complex systems work and how data can be used to make better decisions under uncertainty. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eEconomics first gave me a framework for thinking about incentives, markets, and human behavior, while data science gave me the tools to test those ideas rigorously. Over time, I realized I was most energized when theory met real-world impact—especially in finance, where quantitative models directly inform decisions that matter.\u003c/p\u003e\u003cp\u003eThat curiosity naturally led me to pursue Financial Engineering, where I could deepen my technical skills while applying them to asset management, risk, and forecasting. I enjoy working with time series, optimization, and machine learning because they force you to think carefully about assumptions, trade-offs, and uncertainty rather than searching for a single “right” answer. Whether I’m building forecasting models, optimizing portfolios, or stress testing scenarios, I like the challenge of turning messy data into structured insight.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMore importantly, this major reflects how I like to learn: by building, testing, and refining. It allows me to combine analytical rigor with creativity, and it aligns with my goal of using quantitative tools not just to model the world, but to understand it more deeply.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}":{"__typename":"School","uuid":"dff4a26a-20c2-4281-9c2a-b500907e0661","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"049c4bf9-2ca2-46bf-9cff-f6022c67316e\"}":{"__typename":"Education","uuid":"049c4bf9-2ca2-46bf-9cff-f6022c67316e","school":{"__ref":"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Economics and Data Science","degree":null},"School:{\"uuid\":\"85f82775-355f-4a1a-ad6c-664e9d5812b9\"}":{"__typename":"School","uuid":"85f82775-355f-4a1a-ad6c-664e9d5812b9","name":"Monta Vista High School","city":"Cupertino","type":"HIGH","state":"California","country":"United States","zip":"95014"},"Education:{\"uuid\":\"c6408152-a0ce-448c-a3d3-b799203d194a\"}":{"__typename":"Education","uuid":"c6408152-a0ce-448c-a3d3-b799203d194a","school":{"__ref":"School:{\"uuid\":\"85f82775-355f-4a1a-ad6c-664e9d5812b9\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"2b046326-397a-4a03-899f-22c34df5d975\"}":{"__typename":"MentorPublicProfile","uuid":"2b046326-397a-4a03-899f-22c34df5d975","displayName":"Jasmine L.","slug":"jasmine-lee","biography":"\u003cp\u003eI recently graduated as a Master’s student in Financial Engineering at Columbia University, concentrating in Asset Management and Machine Learning, with a background in Economics and Data Science from UC Berkeley. At my core, I care deeply about helping students turn intellectual curiosity into real, tangible outcomes—whether that’s mastering difficult quantitative concepts, building impressive projects, or gaining clarity about what they want to pursue next.\u003c/p\u003e\u003cp\u003eAcademically, I’m fascinated by the intersection of finance, data, and decision-making under uncertainty. My coursework spans asset pricing, term structures, optimization, machine learning, stochastic processes, and time series analysis, and I enjoy translating abstract mathematical ideas into intuition and real-world applications. At Berkeley, I completed an honors thesis examining how gender, education, and family structure shaped unemployment outcomes in Indonesia over several decades—an experience that sharpened my ability to ask meaningful questions, work with messy data, and communicate insights clearly.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I’ve worked across quantitative finance, risk, and applied machine learning. Most recently, I interned in Model Risk Quantitative Research at Charles Schwab, where I built time-series forecasting models for net interest revenue using Kalman filters, SARIMA, and regime-switching techniques, and enhanced forecasts with machine learning models like Random Forests and XGBoost. I’ve also conducted stress testing and Monte Carlo simulations to assess interest rate risk under adverse scenarios. In parallel, I served as a quantitative research consultant for portfolio construction, designing optimization and rebalancing strategies that improved returns while significantly reducing drawdowns.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of finance, I’ve applied data science in more creative and user-focused settings, including a consulting project with Spotify where I helped design and train automated response systems using exploratory data analysis and machine learning. Earlier experiences in risk management at Wells Fargo and economic research at Berkeley’s Stone Center further shaped my analytical rigor and attention to detail.\u003c/p\u003e\u003cp\u003eAs a mentor, I’m especially excited to work with students who feel overwhelmed, unsure where to start, or intimidated by technical subjects. I know firsthand what it’s like to juggle high expectations, ambitious goals, and self-doubt. I enjoy breaking down complex ideas, helping students build confidence, and guiding them toward projects, research, or applications that genuinely reflect their interests and strengths. My goal is not just to teach skills, but to help students see themselves as capable, curious thinkers who can do hard things—and do them well.\u003c/p\u003e","teachingVideoPlaybackId":"8AJFfmVHEgtr6JcWylY1k3hZL3H8PHQKdQ00RBxa9eRU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is how I’ve learned to take ideas that once felt intimidating and turn them into something concrete and useful. A moment that stands out was building a dynamic portfolio rebalancing strategy during a consulting project, where I designed and tested an optimization framework that adjusted to different market conditions. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat started as a messy problem—uncertain data, competing objectives, and no clear “right” answer—became a working system that improved returns while reducing downside risk.\u003c/p\u003e\u003cp\u003eWhat made this especially meaningful to me wasn’t just the technical outcome, but the process. I had to teach myself new tools, sit with confusion, and iterate through many versions that didn’t work before finding one that did. That experience changed how I approach challenges: instead of being discouraged by complexity, I now see it as something I can break down and learn step by step.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond the project itself, this was a moment when my parents truly understood what I was working toward—not just a grade or title, but a skillset and mindset I could carry forward. It confirmed for me that persistence, curiosity, and patience compound over time, and that doing hard things well is something to be proud of.\u003c/p\u003e\u003cbr\u003e","favorites":[],"causesSupported":[],"major":"Economics and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d763fd25-a28c-4a70-9f13-cd4ea5a8097f\"}"},{"__ref":"DeepDives:{\"uuid\":\"48139046-9b24-41e1-b32a-beca458b0564\"}"},{"__ref":"DeepDives:{\"uuid\":\"2af32a76-dc60-47b8-8034-1544ab5dd2d9\"}"},{"__ref":"DeepDives:{\"uuid\":\"d7ef00df-1b8a-4542-9b6b-52b39d00be29\"}"}],"active":true,"prof
