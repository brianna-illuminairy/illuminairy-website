04-9bf1-1564cfc1cb58\"}":{"__typename":"DeepDives","uuid":"34a0bd8f-8f90-4f04-9bf1-1564cfc1cb58","content":"\u003cp\u003eI wouldn't be where I am today without mentorship! I owe everything I have now to the mentors I've had in life, from my family to my teachers to my friends. I enjoy mentoring  others because it is a way for me to give back and show gratitude for the mentorship I've received thus far.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"99b25e38-4442-4233-894d-cf5a742408a7\"}":{"__typename":"DeepDives","uuid":"99b25e38-4442-4233-894d-cf5a742408a7","content":"\u003cul\u003e\u003cli\u003e\u003cp\u003e- Read (then add to my Goodreads profile)\u003cbr\u003e- Play Legend of Zelda games\u003cbr\u003e- Learn new cooking recipes\u003cbr\u003e- Go on hikes with friends\u003cbr\u003e- Program and tinker with electronics (specifically embedded software!)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ba46dac9-be6a-4a9e-8118-73d1d116f7fa\"}":{"__typename":"DeepDives","uuid":"ba46dac9-be6a-4a9e-8118-73d1d116f7fa","content":"\u003cp\u003eOne of my high school percussion directors, Mr. Hanrahan. An incredible musician, incredible instructor, and incredible person who taught me the importance of diligent practice, holding yourself to high standards, and having passion for your craft. I don't see him as often now that I've left high school, but I still keep in touch, and the lessons he taught me (drum)stick with me every day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"37d9ec64-bb5f-43b6-a3d5-3ae3ae5b3c7d\"}":{"__typename":"School","uuid":"37d9ec64-bb5f-43b6-a3d5-3ae3ae5b3c7d","name":"Lone Star High School","city":"Frisco","type":"HIGH","state":"Texas","country":"United States","zip":"75033"},"Education:{\"uuid\":\"19882668-55d3-4c2c-9dda-60eea3faf700\"}":{"__typename":"Education","uuid":"19882668-55d3-4c2c-9dda-60eea3faf700","school":{"__ref":"School:{\"uuid\":\"37d9ec64-bb5f-43b6-a3d5-3ae3ae5b3c7d\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"294bb274-029a-43b5-a23e-d15fdc478df9\"}":{"__typename":"Education","uuid":"294bb274-029a-43b5-a23e-d15fdc478df9","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"4d3d532a-bb48-476f-b447-f1c84721e8d0\"}":{"__typename":"MentorPublicProfile","uuid":"4d3d532a-bb48-476f-b447-f1c84721e8d0","displayName":"Naomi M.","slug":"naomi-grace","biography":"\u003cp\u003eHey y’all, I’m Naomi! 👋\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was born and raised in Dallas, Texas, but currently attend school in California at Stanford University. I am a senior studying electrical engineering and am planning to complete a fifth-year master’s degree in computer science; par for the course, I enjoy tinkering with electronics, programming, and understanding digital technologies, and I spent this past summer conducting semiconductor + digital architecture research in the Stanford Nanoelectronics Lab.\u003cbr\u003e\u003cbr\u003eBeyond bits and bytes, I am also heavily involved in the arts! I compose poetry primarily for my own enjoyment, but have also submitted works to competitions and journals. A poem of mine was recently published in the winter 2022 issue of Stanford's creative literary journal, \u003cem\u003eLeland Quarterly\u003c/em\u003e. Additionally, I enjoy performing as a symphonic percussionist and solo marimbist, and am a member of the Stanford Symphony Orchestra. Other activities I enjoy include hiking/backpacking, snowboarding, reading Tolkien, and cooking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAsk me about:\u003c/p\u003e\u003cp\u003e- Finding your passions (I was pre-med when applying to college, then a mechanical engineering major in my freshman year, and am now an enthusiastic EE major!)\u003c/p\u003e\u003cp\u003e- Taking time away from school (I took a gap year during the COVID-19 pandemic)\u003c/p\u003e\u003cp\u003e- Balancing academics with intensive extracurriculars, like music\u003c/p\u003e\u003cp\u003e- Anything and everything else, from what you’re learning in school to life in general\u003cbr\u003e\u003cbr\u003eI'm here to help in any way that I can! Looking forward to meeting you.\u003c/p\u003e","teachingVideoPlaybackId":"02XU012onGvp9tUQ00LO00J88RIZNBaqZUX00hSQ9ohAAhRg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy senior year of high school, I placed 5th at the Percussive Arts Society international marimba solo competition in the high school division! There was a lot to be grateful for through that experience: the opportunity to perform in front of an international crowd; the ability to see how much I had grown as a percussionist through practice; and the joy of working with mentors who encouraged me every step of the way. I no longer participate in the competitive percussion circuit, so I look
