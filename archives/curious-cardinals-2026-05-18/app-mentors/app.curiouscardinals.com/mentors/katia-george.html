xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"83b68e2f-424c-4877-9c77-dd4eff89cd04\"}":{"__typename":"Favorites","uuid":"83b68e2f-424c-4877-9c77-dd4eff89cd04","photoUrl":"https://ucarecdn.com/8e576533-ea56-4642-bf22-5b138aa20de2/","title":"Mood Valiant by Hiatus Kaiyote","type":"ALBUM"},"Favorites:{\"uuid\":\"2bb40c86-9a55-4e37-8c9f-21e6de0507ce\"}":{"__typename":"Favorites","uuid":"2bb40c86-9a55-4e37-8c9f-21e6de0507ce","photoUrl":"https://ucarecdn.com/a9c25f33-8aa1-4d07-b271-0ffe34494d22/","title":"Roman Holiday","type":"MOVIE"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"98e5dd96-661f-4610-a7b1-f93caca3ef35\"}":{"__typename":"DeepDives","uuid":"98e5dd96-661f-4610-a7b1-f93caca3ef35","content":"\u003cp\u003eLive, a wellness collective for creatives in NYC seeking to find collaborators and artistic kinship\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"57719511-7f79-499e-bfc8-fdd432521248\"}":{"__typename":"DeepDives","uuid":"57719511-7f79-499e-bfc8-fdd432521248","content":"\u003cp\u003eAn encouraging spirit in your corner is often the difference between being good and being great. My goal is to set the tone as an example, but also as a person who's rooting for you to be YOU!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"8a921d7b-1ab8-4b6e-adb2-1b53ec341644\"}":{"__typename":"DeepDives","uuid":"8a921d7b-1ab8-4b6e-adb2-1b53ec341644","content":"\u003cp\u003eI am proud of my ability to balance and pursue my many passion from law, to wellness, to entertainment, to youth development. Each thing teaches me something about the other and I don't feel completely myself without tapping into the many interests that make up myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e3fd93d4-f73f-44d4-8b44-d6d7aca5eef6\"}":{"__typename":"DeepDives","uuid":"e3fd93d4-f73f-44d4-8b44-d6d7aca5eef6","content":"\u003cp\u003eAn Intellectual Property Attorney, specializing in protecting artists and their ecosystems of creation from fashion to music to dance. I hope to run my own agency to help artists realize their entrepreneurial potential. In addition to that, running my wellness collective, Live, for have artistic home. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"519cd397-d1b9-4515-a333-9458f2d22309\"}":{"__typename":"School","uuid":"519cd397-d1b9-4515-a333-9458f2d22309","name":"South Pointe High School","city":"Rock Hill","type":"HIGH","state":"South Carolina","country":"United States","zip":"29730"},"Education:{\"uuid\":\"b2e5c454-28d3-44ca-8f9d-c3641616e823\"}":{"__typename":"Education","uuid":"b2e5c454-28d3-44ca-8f9d-c3641616e823","school":{"__ref":"School:{\"uuid\":\"519cd397-d1b9-4515-a333-9458f2d22309\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"018e4e67-c994-48e1-963f-a97329605b09\"}":{"__typename":"Education","uuid":"018e4e67-c994-48e1-963f-a97329605b09","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Religious Studies and Ethnography","degree":null},"MentorPublicProfile:{\"uuid\":\"4acd5978-6fd3-445b-8bb8-07453bfcbfba\"}":{"__typename":"MentorPublicProfile","uuid":"4acd5978-6fd3-445b-8bb8-07453bfcbfba","displayName":"Katia G.","slug":"katia-george","biography":"\u003cp\u003eI care deeply about helping students feel confident in their thinking and capable in their academic work. Learning should feel empowering and I believe students do their best when they feel understood and encouraged to ask questions. As a tutor, my goal is to help students strengthen their skills while also \u003cstrong\u003ebuilding confidence, independence, and curiosity.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am a recent graduate of \u003cstrong\u003eYale University (B.A. ’25)\u003c/strong\u003e, where I pursued an interdisciplinary course of study centered on critical reading, analytical writing, and research-based inquiry. My academic training emphasized clear communication, strong argumentation, and the ability to synthesize complex ideas—skills that are essential across subjects, particularly in writing-intensive courses, humanities, and test preparation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically and professionally, I spend much of my time writing, researching, and mentoring. I have experience supporting students through\u003cstrong\u003e one-on-one academic guidance, writing feedback, and study strategy development\u003c/strong\u003e. I enjoy helping students break down large or overwhelming assignments into manageable steps and develop personalized approaches that fit their learning styles and goals. I also look forward to helping students build the passion project of their wildest dreams.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside my academic work, I am also a \u003cstrong\u003echoreographer and performer\u003c/strong\u003e, which strongly shapes how I approach tutoring. This creative background allows me to think flexibly and meet students where they are. I often draw on creative problem-solving and pattern recognition to help students stay engaged, think critically, and approach their work with greater ease and confidence.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne of my greatest strengths as a tutor comes from \u003cstrong\u003ebalancing a rigorous academic workload within a highly selective university environment while maintaining creative, leadership, and professional commitments\u003c/strong\u003e. At Yale I served on the \u003cstrong\u003eYale College Council as a Senator, led the Black Student Alliance, two dance teams, several theatre productions, community service in New Haven, served as an Ethnography Hub Graduate Fellow (as an undergraduate!), and curated Yale's 2025 Class Day. \u003c/strong\u003eThis experience has made me especially effective at working with students who feel overwhelmed, stuck, or unsure of how to approach their work. I prioritize creating a supportive, structured, and encouraging environment where students feel comfortable asking questions and learning from mistakes.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUltimately, my goal is to help students not only succeed academically, but develop the tools and confidence they need to thrive long-term.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am attentive, patient, and highly responsive to feedback, and I value clear communication with both students and families. I aim to make learning feel approachable and collaborative, helping students build habits that support long-term academic success both inside and outside the classroom.\u003c/p\u003e","teachingVideoPlaybackId":"Uc28jn525xnGLRFJJA4y01dEHHTn5CBt00hH95L8y3j18","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"83b68e2f-424c-4877-9c77-dd4eff89cd04\"}"},{"__ref":"Favorites:{\"uuid\":\"2bb40c86-9a55-4e37-8c9f-21e6de0507ce\"}"}],"causesSupported":[],"major":"Religious Studies and Ethnography","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"98e5dd96-661f-4610-a7b1-f93caca3ef35\"}"},{"__ref":"DeepDives:{\"uuid\":\"57719511-7f79-499e-bfc8-fdd432521248\"}"},{"__ref":"DeepDives:{\"uuid\":\"8a921d7b-1ab8-4b6e-adb2-1b53ec341644\"}"},{"__ref":"DeepDives:{\"uuid\":\"e3fd93d4-f73f-44d4-8b44-d6d7aca5eef6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6a53f1b9-bf3d-49a6-9df2-e2099a5a5612/-/preview/-/format/jpg/","https://ucarecdn.com/3d0917cf-f465-48cf-b808-50b9a29f9e4c/-/preview/-/format/jpg/","https://ucarecdn.com/e7da5ac7-9052-41be-bb8e-6fedd82650f0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b2e5c454-28d3-44ca-8f9d-c3641616e823\"}"},{"__ref":"Education:{\"uuid\":\"018e4e67-c994-48e1-963f-a97329605b09\"}"}],"hiredAt":"2026-02-05T03:57:31.832Z","topics":["College Essay Writing","Executive Function","Creative Writing","Fashion / Cosmetics","Film / Theater","Visual Arts / Graphic Design","Business / Entrepreneurship","Debate","Journalism","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVis
