xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f359e14b-d3f5-4e8f-b439-c56a93e8087c\"}":{"__typename":"DeepDives","uuid":"f359e14b-d3f5-4e8f-b439-c56a93e8087c","content":"\u003cp\u003eHistory, as much as one might call it a study of society or an analysis of the individual, is really an exploration of context. It encompasses nearly every field of study, and allows us to observe the world's greatest triumphs and most troubling circumstances. As a history major focusing on pre-modern France, my studies have shaped my appreciation for aesthetic, political, and intellectual history, while provided me with the talking points to engage in novel interactions with individuals across the world. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"88f9cb33-76a6-49e5-a45b-429e370de5f4\"}":{"__typename":"DeepDives","uuid":"88f9cb33-76a6-49e5-a45b-429e370de5f4","content":"\u003cp\u003eDefinitely the importance of open-mindedness and the importance of intellectual humility. Often we can be blinded by our pre-conceived notions about the ways of the world, and our insecurities. But success is not predicated on the \"quantity\" of our knowledge and how much we \"think\" we know, but our ability to embrace other perspectives and work to create mutual understanding and partnership. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2754ad52-169e-4996-a397-6ef7d4693b26\"}":{"__typename":"School","uuid":"2754ad52-169e-4996-a397-6ef7d4693b26","name":"Olympia High School","city":"Olympia","type":"HIGH","state":"Washington","country":"United States","zip":"98501"},"Education:{\"uuid\":\"0251952a-a89a-4884-9bd3-91cdf1945e7e\"}":{"__typename":"Education","uuid":"0251952a-a89a-4884-9bd3-91cdf1945e7e","school":{"__ref":"School:{\"uuid\":\"2754ad52-169e-4996-a397-6ef7d4693b26\"}"},"startYear":"2018","endYear":" 2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"e0374784-64af-48b1-ba08-df32f7fb64d2\"}":{"__typename":"Education","uuid":"e0374784-64af-48b1-ba08-df32f7fb64d2","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"d6d86e2a-3d1e-44c5-a19f-ace585e622ab\"}":{"__typename":"MentorPublicProfile","uuid":"d6d86e2a-3d1e-44c5-a19f-ace585e622ab","displayName":"Michael Z.","slug":"michael-zhao-1","biography":"\u003cp\u003eMichael is an undergraduate student at Yale College studying History while pursuing a pre-med workload, and a certificate in French. Originally from Olympia, Washington, Michael enjoys meeting people from places both far and near!\u003c/p\u003e\u003cp\u003eIn high school, he explored the arts and the sciences, served as the concertmaster of his school's symphony orchestra, and took a rigorous AP workload. In his junior year, he received a grant from, America's Promise Alliance, allowing him to found a community initiative to teach elementary school students about biology and Washington State history.\u003c/p\u003e\u003cp\u003eAt Yale, Michael has had the pleasure of embracing novel enterprises while pursuing pre-existing passions to a much greater degree. Along with rigorous pre-med coursework, he has enjoyed exploring the humanities and his niche interests including medieval French history through intellectual, religious, and political facets. Outside of class, Michael enjoys working as a research assistant at the Yale School of Medicine, where he studies skin disorders like ichthyosis, and 3-D \u003cem\u003ein vitro\u003c/em\u003e skin models to study disease pathogenesis. He is also a team lead for the Urban Philanthropic Fund, working as a consultant for local New Haven non-profits.\u003c/p\u003e\u003cp\u003eDuring the summer of 2023, Michael had the pleasure of serving as a fellow with the Yale President's Public Service Fellowship, where, for 11 weeks, he worked as an intern with the Downtown Evening Soup Kitchen. There, he was involved in leading a number of initiatives concerning volunteer outreach, pursuing novel partnerships with other local organizations, and managing a clothing closet! In his free time, Michael enjoys reading the classics, and has a keen interest in French literature. He also enjoys baking, running, book collecting, and playing piano. He is always enthusiastic about working with students, and is thrilled by the prospect of inspiring curiosity and passion in the arts and sciences in the lives of others.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f359e14b-d3f5-4e8f-b439-c56a93e8087c\"}"},{"__ref":"DeepDives:{\"uuid\":\"88f9cb33-76a6-49e5-a45b-429e370de5f4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/44b80153-b149-462b-bee5-50a0d373b9d5/-/preview/-/format/jpg/","https://ucare
