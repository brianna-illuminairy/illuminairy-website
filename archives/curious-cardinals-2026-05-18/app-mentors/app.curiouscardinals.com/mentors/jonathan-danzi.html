xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"571c47ba-2865-412d-b831-775210d734b2\"}":{"__typename":"Favorites","uuid":"571c47ba-2865-412d-b831-775210d734b2","photoUrl":"https://ucarecdn.com/7c4be670-2053-43b2-b735-a68b27aab730/","title":"Lord of the Rings","type":"MOVIE"},"Favorites:{\"uuid\":\"9e9d3220-efff-45a7-b059-7e61386abfe6\"}":{"__typename":"Favorites","uuid":"9e9d3220-efff-45a7-b059-7e61386abfe6","photoUrl":"https://ucarecdn.com/eac92fca-568e-433a-a30d-ceba9dd2e1df/","title":"Fortnite ","type":"GAME"},"Favorites:{\"uuid\":\"ff34038d-d9ff-4003-a61f-53bf3eeafc84\"}":{"__typename":"Favorites","uuid":"ff34038d-d9ff-4003-a61f-53bf3eeafc84","photoUrl":"https://ucarecdn.com/e6ad8f67-573d-478c-9ba0-88215e4be278/","title":"Soccer","type":"SPORT"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"201bcdaa-2b8e-4660-97e3-5f555be1b000\"}":{"__typename":"DeepDives","uuid":"201bcdaa-2b8e-4660-97e3-5f555be1b000","content":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a high school student, I was involved in everything I could fit into my schedule. I played varsity Tennis and Soccer as well as playing the Trumpet in the wind ensemble and jazz band. I was a member of the National Honor Society, Music Honor Society, Athletes Helping Athletes, and Peer Support. I was not always so passionate about school and liked to just do what it took to get by. It was not until I found my passion that I started to take pride in my school work, work, and daily life. This changed my life forever!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"b1ce3f9c-8770-4a99-b8c8-ce4d7714122f\"}":{"__typename":"School","uuid":"b1ce3f9c-8770-4a99-b8c8-ce4d7714122f","name":"Purdue University","city":"West Lafayette","type":"COLLEGE","state":"Indiana","country":"United States","zip":"47907"},"Education:{\"uuid\":\"6dadd10e-ef50-4226-9c31-ece12292c650\"}":{"__typename":"Education","uuid":"6dadd10e-ef50-4226-9c31-ece12292c650","school":{"__ref":"School:{\"uuid\":\"b1ce3f9c-8770-4a99-b8c8-ce4d7714122f\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2021","major":"Communications","degree":null},"School:{\"uuid\":\"f12f4bd6-dca0-4a8b-aa08-ccdf75fa9017\"}":{"__typename":"School","uuid":"f12f4bd6-dca0-4a8b-aa08-ccdf75fa9017","name":"Bay Shore High School","city":"Bay Shore","type":"HIGH","state":"New York","country":"United States","zip":"11706"},"Education:{\"uuid\":\"73fbe6c1-9c45-47f2-82e9-6568690ffc86\"}":{"__typename":"Education","uuid":"73fbe6c1-9c45-47f2-82e9-6568690ffc86","school":{"__ref":"School:{\"uuid\":\"f12f4bd6-dca0-4a8b-aa08-ccdf75fa9017\"}"},"startYear":"203","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"59dc8b28-20d4-43ee-a4cb-7dd208ba612e\"}":{"__typename":"MentorPublicProfile","uuid":"59dc8b28-20d4-43ee-a4cb-7dd208ba612e","displayName":"Jonathan D.","slug":"jonathan-danzi","biography":"\u003cp\u003eHey, my name is Jonathan Danzi. I am professional gamer, content creator, and entrepreneur based in New York City. I’ve been passionate about gaming ever since I picked up my first controller, and I've turned that passion into a career.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI started my gaming journey as most kids do, with my siblings on the couch! In highschool I found my best friends through gaming, and we created some of the best memories of our childhood. It wasn’t until college where I tore my ACL playing soccer that I started to treat gaming as a job.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eThroughout my career I competed at the highest levels of Fortnite in North America. Some of my achievements include becoming a 3x Collegiate Champion, Ranking #1 in Zero Build, and #8 in Build. During this time I also signed with Tier 1 Esports organizations such as Cloud 9 and Paris Saint Germain.\u0026nbsp; Not only was I a competitor but I was also a content creator amassing over 100,000 supporters across my social medias. As part of my content creation efforts, I worked with brands such as Alienware, the NFL, Sour Patch Kids, Mio Energy, Honda, Team Liquid, Paris Saint Germain, Epic Games, and Dell.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough I loved traveling and competing around the world, in 2024 I decided it was time to transition out of playing and enter the business side of the industry. I am now building my own UGC gaming studio and building maps that live in the Fortnite Universe. \u003cbr\u003e\u003cbr\u003eTeaching and inspiring kids has always been a passion of mine. I’m proud to say that I built the curriculum for Cloud 9’s “Fortnite Training Grounds”, an online gaming camp for kids that was designed to improve their gameplay while having fun and making friends. I was also a leader at Camp Dudley, whose mission was to develop moral, personal, physical, and leadership skills in the spirit of fellowship and fun, enabling boys and girls to lead lives characterized by devotion to others.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eGaming is AWESOME and can teach you real life skills that can be applied in many different career paths. I take pride in teaching parents and kids about the wonderful things that can come from video games such as discipline, hard work, cooperation, problem solving, and especially time management.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"ia502eEMI5uXUsZbwg02zeKj2SAVGx6WYc00mnFI3CvGg00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement is having the courage to go against the norm and pursue my dreams!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy second greatest achievement was becoming a 3x Collegiate Fortnite Champion and ranking #1 in North America in 2023.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"571c47ba-2865-412d-b831-775210d734b2\"}"},{"__ref":"Favorites:{\"uuid\":\"9e9d3220-efff-45a7-b059-7e61386abfe6\"}"},{"__ref":"Favorites:{\"uuid\":\"ff34038d-d9ff-4003-a61f-53bf3eeafc84\"}"}],"causesSupported":[],"major":"Communications","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"201bcdaa-2b8e-4660-97e3-5f555be1b000\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b90ba76f-773b-4fdd-895e-15007803ddc5/-/preview/-/format/jpg/","https://ucarecdn.com/f6308c98-3645-4e4d-9451-4031f4261851/-/preview/-/format/jpg/","https://ucarecdn.com/8dc51b8c-700d-4b76-ba7a-456f1ac10849/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6dadd10e-ef50-4226-9c31-ece12292c650\"}"},{"__ref":"Education:{\"uuid\":\"73fbe6c1-9c45-47f2-82e9-6568690ffc86\"}"}],"hiredAt":"2024-06-11T16:38:46.479Z","topics":["Video / Photography","Visual Arts / Graphic Design","Film / Theater","Business / Entrepreneurship","Game Design","Academic Coaching","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jonathan-danzi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"59dc8b28-20d4-43ee-a4cb-7dd208ba612e\"}"}}},"_sentryTraceData":"27616c28a46a4a2ea643c764feed6553-9495fa2e1837e57c-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=27616c28a46a4a2ea643c764feed6553,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,
