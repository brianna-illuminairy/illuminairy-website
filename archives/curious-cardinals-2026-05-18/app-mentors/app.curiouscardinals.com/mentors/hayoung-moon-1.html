xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"a62aa236-5c89-48c3-9d49-ed3f4ad745aa\"}":{"__typename":"DeepDives","uuid":"a62aa236-5c89-48c3-9d49-ed3f4ad745aa","content":"\u003cp\u003eMy greatest source of motivation is the accountability I have gained from the numerous sacrifices my family has made for me to pursue my dreams. In coming to terms with the poor conditions and numerous hardships my parents and my grandparents made for me to have the opportunities I have had, I have found a steadfast source of comfort and determination in becoming a better person every single day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"aec1a7a6-c7e5-4059-9744-2e579680de7b\"}":{"__typename":"DeepDives","uuid":"aec1a7a6-c7e5-4059-9744-2e579680de7b","content":"\u003cp\u003eI often times chuckle when I think back to myself in middle and high school; How wide-eyed and enthusiastic I was! I only hope that I feel the same way about my current self in another 5 years. I would advise myself to constantly find pockets of quiet in my hectic schedule to have time to reflect on myself and be transparent in acknowledging my potential areas of growth. At the same time, I would plead with my younger self to hold onto that passion and never once let it slip away.!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"2e208615-9825-4d3a-bd11-5ebca538a90f\"}":{"__typename":"DeepDives","uuid":"2e208615-9825-4d3a-bd11-5ebca538a90f","content":"\u003cp\u003eAs a first-generation Korean immigrant from a low socio-economic background, I so frequently felt the need to adapt to new surroundings and environments. During these times of adjustment and transition, I was able to find communities and mentors who were able to commit to me and devote their efforts to unlocking my potential. Now that I am in a position to be a guide myself, I am adamant that I will also play a similar role and commit myself to developing amazing ideas and bright minds with students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"64508d93-863a-452a-8878-4509990a79e1\"}":{"__typename":"DeepDives","uuid":"64508d93-863a-452a-8878-4509990a79e1","content":"\u003cp\u003eMy mother used to tell me that the world is filled with people with good intentions that don't have the position to make an impact, and then there are also others who are in the position to make a tangible impact but don't have good intentions. I want to strive to be the few that have both good intentions and the skillset necessary to effectuate those good intentions. This is why I chose Economics; In a field that is so outcome-driven, I felt that I could hold my ground on my ethical integrity and make a positive impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3986bfb4-bb1a-45a5-a75e-9f1949a670e5\"}":{"__typename":"School","uuid":"3986bfb4-bb1a-45a5-a75e-9f1949a670e5","name":"Midway High School","city":"Waco","type":"HIGH","state":"Texas","country":"United States","zip":"76712"},"Education:{\"uuid\":\"6a2ed991-180a-45b4-8882-e6a966f95415\"}":{"__typename":"Education","uuid":"6a2ed991-180a-45b4-8882-e6a966f95415","school":{"__ref":"School:{\"uuid\":\"3986bfb4-bb1a-45a5-a75e-9f1949a670e5\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"0969c04f-cd77-42c0-9b95-f9f865e72b91\"}":{"__typename":"Education","uuid":"0969c04f-cd77-42c0-9b95-f9f865e72b91","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"0bb7d609-3d4d-4e12-b1d6-b0499f8fa24e\"}":{"__typename":"MentorPublicProfile","uuid":"0bb7d609-3d4d-4e12-b1d6-b0499f8fa24e","displayName":"Hayoung M.","slug":"hayoung-moon-1","biography":"\u003cp\u003eHayoung is a recent Harvard graduate, finishing with high honors in Economics and a minor in Global Health. Hayoung was born and raised in Seoul, South Korea, and moved to the States at the age of 8, where he spent most of his time until high school in Texas. At Harvard, Hayoung specialized in Corporate Reorganizations, earning a \u003cem\u003esumma cum laude \u003c/em\u003edistinction on his senior thesis on the subject. Hayoung also was in leadership positions in the undergraduate real estate investing club, fashion magazine, and finance clubs, amongst others. Additionally, Hayoung was one of 5 students in his class to be accepted into the prestigious Harvard-New England Conservatory dual degree program, where he studied Cello Performance alongside his academic endeavors. Hayoung made his solo debut at Carnegie Hall at the age of 13, and has performed with numerous orchestras. He is now at the Yale School of Music for graduate school. \u003c/p\u003e","teachingVideoPlaybackId":"2gDJOUKn4NYvLrZoHxS02301XZG3pj8GsXOarAw02v3nU8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a62aa236-5c89-48c3-9d49-ed3f4ad745aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"aec1a7a6-c7e5-4059-9744-2e579680de7b\"}"},{"__ref":"DeepDives:{\"uuid\":\"2e208615-9825-4d3a-bd11-5ebca538a90f\"}"},{"__ref":"DeepDives:{\"uuid\":\"64508d93-863a-452a-8878-4509990a79e1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f962bb82-96b6-4578-ab82-1ff09f5c6430/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"6a2ed991-180a-45b4-8882-e6a966f95415\"}"},{"__ref":"Education:{\"uuid\":\"0969c04f-cd77-42c0-9b95-f9f865e72b91\"}"}],"hiredAt":"2025-01-25T01:18:04.399Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Calculus","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Music","Sports Journalism","Business / Entrepreneurship","Finance / Investing","Sports Analytics","Law / Government / Policy"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hayoung-moon-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0bb7d609-3d4d-4e12-b1d6-b0499f8fa24e\"}"}}},"_sentryTraceData":"97671b570e5e421ea
