xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ab695e39-17da-425d-9a67-db9bf39f172a\"}":{"__typename":"Favorites","uuid":"ab695e39-17da-425d-9a67-db9bf39f172a","photoUrl":"https://ucarecdn.com/f1977d51-24ab-4fd3-84ad-ac7008795367/","title":"Never Enough - Daniel Caesar","type":"ALBUM"},"Favorites:{\"uuid\":\"938ee84b-ceba-4256-8e63-c9e3e23eb3e5\"}":{"__typename":"Favorites","uuid":"938ee84b-ceba-4256-8e63-c9e3e23eb3e5","photoUrl":"https://ucarecdn.com/a8227ce7-d5b4-4cd0-b907-b0d4f752e6e7/","title":"Sydney McLaughlin","type":"ATHLETE"},"Favorites:{\"uuid\":\"e81cd266-0adb-4762-ade3-a55b268ad2e8\"}":{"__typename":"Favorites","uuid":"e81cd266-0adb-4762-ade3-a55b268ad2e8","photoUrl":"https://ucarecdn.com/11d57e49-db5f-43b0-ba0e-6feff36142ac/","title":"Warriors (My entire childhood)","type":"BOOK"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"7fa07136-15a1-471e-97fb-8c01152f6137\"}":{"__typename":"DeepDives","uuid":"7fa07136-15a1-471e-97fb-8c01152f6137","content":"\u003cp\u003e\u0026nbsp;My background has shaped the way I approach teaching and mentoring in a big way. I grew up in Shanghai, where I attended a British international school that gave me early exposure to different cultures and ways of learning. At 14, I moved halfway across the world to attend Phillips Exeter Academy in New Hampshire, an environment where independence, critical thinking, and open discussion were emphasized. Now at Brown University, with a semester abroad at UNSW in Sydney, I’ve experienced firsthand how education changes across settings—whether it’s the rigor of boarding school, the freedom of Brown’s Open Curriculum, or the experiential, outdoors-oriented lifestyle I’ve embraced in Australia while surfing daily. Because of these experiences, my teaching style blends structure with curiosity: I value discipline and rigor, but I also want students to feel free to explore their own ideas and passions. I know what it’s like to adapt to new cultures, new systems, and new expectations, so I try to meet students where they are and help them build confidence in their own unique learning journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"9ddb9028-2a71-4433-8905-2b4f50a78b8b\"}":{"__typename":"DeepDives","uuid":"9ddb9028-2a71-4433-8905-2b4f50a78b8b","content":"\u003cp\u003eAt first glance, many people see me through my academic and professional interests—finance, mathematics, economics. But something that might not be obvious is how central writing and creativity are in my life. I’m a published poet, and since starting college I’ve made it a point to take at least one poetry or creative writing class every semester. I’m also a member of Brown’s spoken word club, which has given me the chance to share my work in performance settings and connect with a creative community on campus. Poetry gives me space to reflect and explore ideas that don’t always surface in data or equations, and I think this balance between the analytical and the creative makes me a more well-rounded mentor. It allows me to approach problems with both structure and imagination, precision and empathy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"573be042-8ffe-4d9f-98aa-d0436617b19a\"}":{"__typename":"DeepDives","uuid":"573be042-8ffe-4d9f-98aa-d0436617b19a","content":"\u003cp\u003e\u0026nbsp;In middle school, I was the student who was always at the top of the class or the best on the soccer team, but a lot of that came from the structure my parents gave me. They put me in after-school tutoring programs and private soccer lessons, so I always had external motivation pushing me forward. But when I moved to the U.S. for boarding school at 14, everything changed. Suddenly, I was halfway across the world from my parents, and the responsibility to perform academically and athletically fell entirely on me. At first, I struggled—I wasn’t the best in class or on the soccer field, and it was a tough adjustment. But over time, I learned discipline and self-motivation. I realized that to succeed, I had to want it for myself, not because someone else told me to. That shift in mindset was transformative, and it’s something I try to instill in students today. My goal as a mentor is to help students build that same sense of independence—because once you find the drive within yourself, you can reach a much higher level than when you’re simply following instructions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}":{"__typename":"School","uuid":"62e59c56-ee46-4213-b082-758af3ff99db","name":"Phillips Exeter Academy","city":"Exeter","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03833"},"Education:{\"uuid\":\"670c5e99-1ef2-49e2-9197-52ed9d3467f4\"}":{"__typename":"Education","uuid":"670c5e99-1ef2-49e2-9197-52ed9d3467f4","school":{"__ref":"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"df8750c0-985b-453b-91de-f446068cdb15\"}":{"__typename":"Education","uuid":"df8750c0-985b-453b-91de-f446068cdb15","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Mathematics \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"09e53d8c-8ff8-4aed-a0cf-d6134841334e\"}":{"__typename":"MentorPublicProfile","uuid":"09e53d8c-8ff8-4aed-a0cf-d6134841334e","displayName":"Maxwell L.","slug":"maxwell-li","biography":"\u003cp\u003e\u003cstrong\u003e​​Hey there!\u003c/strong\u003e \u003cstrong\u003eGlad you clicked on my profile.\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eMy name is Maxwell Li, and I’m currently a Junior at Brown University studying Applied Mathematics–Economics. I’m passionate about helping students unlock their potential both inside and outside the classroom, and I see mentorship as a chance to share not just academic skills but also the strategies, resilience, and curiosity that make learning meaningful.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, I’ve always been drawn to the intersection of quantitative problem-solving and big-picture thinking. That’s what led me to studying Applied Math–Econ at Brown, where I explore everything from corporate finance and econometrics to policy and data science. I chose to study at Brown because of its Open Curriculum, which allows me to combine my love of mathematics, economics, and even creative writing in ways that would have been impossible elsewhere. I believe this kind of intellectual curiosity—pursuing your interests across disciplines—is one of the most important lessons I can pass on to students.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I’ve gained hands-on experience in the world of finance and investing. This past summer, I interned at a private equity firm in Boston, where I evaluated companies, built financial models, and worked directly with business owners on growth strategies. Next summer, I’ll be working in investment banking in New York City. These experiences have taught me discipline, attention to detail, and how to learn quickly in challenging environments—all skills that translate directly into strong study habits and mentorship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I was a member of the varsity track team my freshman in college, where I ran the 110mh and 400mh. This experience reinforced the value of consistency, time management, and pushing past limits. In high school, I served as Co-Editor-in-Chief of our Asian literary magazine, where I curated and published student work. Writing has remained an important part of my life, and I continue to explore poetry as a creative outlet alongside my academic and professional commitments.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in Shanghai, I was immersed in a fast-paced, global city from an early age, which gave me an appreciation for diverse perspectives and cultures. At 14, I moved across the world to attend boarding school at Phillips Exeter Academy in New Hampshire, where I learned to thrive in a rigorous, discussion-based academic environment. Now, as I spend my junior fall semester studying abroad in Sydney, Australia (and surfing nearly every day), I continue to embrace new ways of living and learning. These experiences have shaped not just my worldview but also my approach to education: I see learning as something that happens in dialogue with the world around you, strengthened by curiosity, openness, and the willingness to step outside your comfort zone.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat I care about most as a mentor is helping students uncover and pursue their passions. I believe that you can only truly excel at something if you’re genuinely interested in it, and part of my role is to guide students toward finding what excites them—whether that’s a subject, a career path, or simply a way of learning that feels authentic. Beyond our sessions, I hope to be a steady mentor figure they can lean on for support with classes, college applications, internship searches, or simply navigating the bigger questions of where they want to go in life. My goal is not just to teach but to empower students to build confidence, curiosity, and direction that last well beyond our time together.\u003c/p\u003e","teachingVideoPlaybackId":"JVnKITEXB4zQtSTDEApl2xWtO1xk8NP02OmpkQyy401hY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne achievement I'm particularly proud of is getting my research paper in economics and political science published and presented at the \u003cem\u003e10th International Conference on Computational Social Science at UPenn\u003c/em\u003e. In that work, I used machine learning and bayesian statistics to uncover patterns in how underrepresented communities engage in campaigns and elections, and highlighted the growing influence of various demographic groups in shaping political outcomes. Having the paper accepted to an international conference and presented to an audience full of professors and world-class researchers was incredibly meaningful, because it showed me that ideas developed as a student can still contribute to conversation in academia. More than just the recognition, it gave me the confidence that rigorous analysis paired with a sense of purpose can make a real-world impact.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ab695e39-17da-425d-9a67-db9bf39f172a\"}"},{"__ref":"Favorites:{\"uuid\":\"938ee84b-ceba-4256-8e63-c9e3e23eb3e5\"}"},{"__ref":"Favorites:{\"uuid\":\"e81cd266-0adb-4762-ade3-a55b268ad2e8\"}"}],"causesSupported":[],"major":"Mathematics \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7fa07136-15a1-471e-97fb-8c01152f6137\"}"},{"__ref":"DeepDives:{\"uuid\":\"9ddb9028-2a71-4433-8905-2b4f50a78b8b\"}"},{"__ref":"DeepDives:{\"uuid\":\"573be042-8ffe-4d9f-98aa-d0436617b19a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bd462a9f-526e-4804-bdd6-3aa5fe1c1a5e/-/preview/-/format/jpg/","https://ucarecdn.com/11dcb6d5-cbdd-4fdd-9eee-ce4a7eae5640/-/preview/-/format/jpg/","https://ucarecdn.com/35536441-49ea-4330-a207-6e404159d1a1/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"670c5e99-1ef2-49e2-9197-52ed9d3467f4\"}"},{"__ref":"Education:{\"uuid\":\"df8750c0-985b-453b-91de-f446068cdb15\"}"}],"hiredAt":"2025-09-05T01:57:44.331Z","topics":["Precalculus / Trigonometry","Geometry","Algebra I","Pre-Algebra","K-5 Grade Math","Algebra II","Writing","College Essay Writing","Academic Coaching","Economics","Reading","Executive Function","Creative Writing","K-6 Storybook","Finance / Investing","Business / Entrepreneurship","STEM Project","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maxwell-li\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"09e53d8c-8ff8-4aed-a0cf-d6134841334e\"}"}}},"_sentryTraceData":"1b30828d75884a00a9543f8094b02b6d-afe5ccebe0d272ff-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1b30828d75884a00a9543f8094b02b6d,sentry-sample_rate=0.2,sentr
