xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"639b685a-ac0c-4d91-93d2-67e33fb5477c\"}":{"__typename":"Favorites","uuid":"639b685a-ac0c-4d91-93d2-67e33fb5477c","photoUrl":"https://ucarecdn.com/ae225329-8633-45b0-b5ae-da8ff989fa37/","title":"Mamma Mia","type":"MOVIE"},"Favorites:{\"uuid\":\"b7565dce-63c0-4ec6-974b-c73d5d8f2442\"}":{"__typename":"Favorites","uuid":"b7565dce-63c0-4ec6-974b-c73d5d8f2442","photoUrl":"https://ucarecdn.com/5cfcc6c4-bce9-44f7-a783-594b56f8054d/","title":"Silent Patient","type":"BOOK"},"CausesSupported:{\"uuid\":\"137c99e5-1108-461b-af8b-6722531e0fcd\"}":{"__typename":"CausesSupported","uuid":"137c99e5-1108-461b-af8b-6722531e0fcd","name":"CONIN - Peruvian NGO","description":"\u003cp\u003eOrganize fundraisers, set up mentoring program, host annual kids event\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4fecbfbc-27ef-4b02-aba3-79a691c3ff77\"}":{"__typename":"DeepDives","uuid":"4fecbfbc-27ef-4b02-aba3-79a691c3ff77","content":"\u003cp\u003eOne of my passion projects was \u003cem\u003eQuotidien\u003c/em\u003e, a website I built myself during the pandemic while living in Lima, Peru (2020–2021). During the military lockdown, many of my classmates were feeling unmotivated and disconnected, so I launched the site to share mental health resources, motivational content, and entertainment. Through social media and a mailing list, I grew the platform to over 100 subscribers. I also had to adapt quickly, updating content to stay relevant and compliant with constantly changing government biosecurity regulations. It was both a creative outlet and a way to bring people together during an isolating time.\u003c/p\u003e\u003cp\u003eLater in high school, I became president of my school’s community service club, which gave me a lot of exposure to how much support was needed in underserved communities. From there, I co-founded \u003cem\u003eCreciendo Juntos\u003c/em\u003e, a tutoring and mentoring program for children, and soon after launched \u003cem\u003eHila\u003c/em\u003e, a handmade knitted fashion initiative in Pamplona, Peru. I collaborated with eight women artisans to sell their designs on social media, led the branding and marketing process, and organized photoshoots to showcase over 40 designs. I also managed the financial side of the project by planning costs of production, tracking margins, and making sure sales maximized profitability.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a0fa9e3c-acea-468f-87af-a5f3ae053d9e\"}":{"__typename":"DeepDives","uuid":"a0fa9e3c-acea-468f-87af-a5f3ae053d9e","content":"\u003cp\u003eIn high school, I spent many of my summers at the beach with family and friends. When I was home, I worked as a saleswoman at the annual summer fair, which was a fun way to earn some extra cash, connect with people, and explore my love for the fashion world. I was also always on the lookout for opportunities to travel and meet new people. One summer I attended a bioscience course at Yale, and another I went to a ski camp in Switzerland.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"12161957-c659-4c99-82c8-d0ea79acd0e1\"}":{"__typename":"DeepDives","uuid":"12161957-c659-4c99-82c8-d0ea79acd0e1","content":"\u003cp\u003eI love spending time in the kitchen, whether I’m cooking or baking for family and friends. I enjoy reading too, especially romantic novels and psychology books on self-growth. I’m a big matcha fan and always up for exploring new places with friends. In my free time, I like going on long walks with my mom, my best friend, or while listening to a favorite podcast. Above all, I love traveling, discovering new places, and meeting new people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"a3b495df-3c69-4326-8fab-e0a732de2aa5\"}":{"__typename":"DeepDives","uuid":"a3b495df-3c69-4326-8fab-e0a732de2aa5","content":"\u003cp\u003eSomething that isn’t obvious right away is that I’m actually really fun and outgoing. Once you get to know me, you’ll constantly hear me making jokes and trying to bring positive energy to the people around me. I love creating an environment where people feel comfortable, can laugh, and enjoy themselves, whether it’s in class, with friends, or at work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"683d5b48-8150-4663-b667-dcff53867d37\"}":{"__typename":"School","uuid":"683d5b48-8150-4663-b667-dcff53867d37","name":"San Silvestre School","city":"Miraflores","type":"HIGH","state":"Provincia de Lima","country":"Peru","zip":"15074"},"Education:{\"uuid\":\"32a2a6df-1a63-410b-8b42-106b46cd493b\"}":{"__typename":"Education","uuid":"32a2a6df-1a63-410b-8b42-106b46cd493b","school":{"__ref":"School:{\"uuid\":\"683d5b48-8150-4663-b667-dcff53867d37\"}"},"startYear":"2015","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"948f4d20-db8d-4d41-a8f8-6c808a1b28a1\"}":{"__typename":"Education","uuid":"948f4d20-db8d-4d41-a8f8-6c808a1b28a1","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Double Major in Psychology and Economics,minor in Business and Integrated Marketing Certificate ","degree":null},"MentorPublicProfile:{\"uuid\":\"ab626c51-3c6a-4415-9a0a-e5b93e0bc1e4\"}":{"__typename":"MentorPublicProfile","uuid":"ab626c51-3c6a-4415-9a0a-e5b93e0bc1e4","displayName":"Maria Z.","slug":"maria-zavala","biography":"\u003cp\u003eMy name is Maria Zavala, and I am a junior at Northwestern University studying Economics and Psychology with a minor in Business Institutions. I was born in Chicago and raised in Lima, Peru, and that bicultural perspective has shaped both my academic interests and the way I see the world.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOne of my greatest passions is making learning feel exciting and meaningful. I believe education should be less about memorizing facts and more about opening a window to see the world in a new way. I enjoy teaching concepts in psychology, such as cognitive biases, that help students understand their own decision-making, or connecting in economics market models with real-world events so students immediately see the relevance of what they are learning. My goal as a mentor is to inspire curiosity and confidence while equipping students with tools to think critically and creatively.\u003c/p\u003e\u003cp\u003eI have built strong research experience through both coursework and lab work. I have written papers on cognitive biases, cultural psychology, bilingualism and memory, psychotherapy effectiveness, probability overestimation, and the spread of misinformation. Beyond writing, I have learned how to design research proposals, conduct literature reviews, plan studies, and implement them. Currently, I am a research assistant in the School of Education and Social Policy, which has given me valuable hands-on exposure to academic research.\u003c/p\u003e\u003cp\u003eProfessionally, I have explored my interest in business and finance through summer internships. I worked in corporate strategy and business transformation at a multinational beauty company, and I completed a wealth management internship at a boutique advisory firm. These roles allowed me to combine analytical skills with my interest in people. At Northwestern, I also apply these skills in the Marketing Club, where I work with small and medium-sized businesses in the Chicago area on projects ranging from merchandise design to expanding audience reach.\u003c/p\u003e\u003cp\u003eOutside of academics and work, I have always been committed to giving back and have combined this with my entrepreneurial spirit. I co-founded Creciendo Juntos, a tutoring and mentoring program for children from underserved areas in Peru. In high school, I also founded a handmade knitted fashion project to support women in Pamplona, an impoverished community. I encouraged eight women artisans to sell their designs through social media. I led the branding process, developing the name, logo, color palette, packaging, and storytelling, and created accounts to showcase over 40 designs. The project provided women with financial independence, enabling them to earn more than the minimum wage while working from home.\u003c/p\u003e\u003cp\u003eAs a daughter and friend, I love baking, cooking for others, reading romantic novels, and spending time with my younger brothers. As a mentor, I strive to be approachable, enthusiastic, and supportive, always meeting students where they are. I know what it feels like to be challenged by a subject or to doubt your abilities, and I also know the rewarding feeling of overcoming those doubts. My goal is to help students experience that same growth: to spark their curiosity, support their goals, and help them build skills that will serve them well beyond the classroom.\u003c/p\u003e","teachingVideoPlaybackId":"2q451xzhJL9Dw502in1YxPdfsPNs5c367XItjBdpfL01s","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I am most proud of is building a small social enterprise in Peru called Hila, which connected women artisans with customers through handmade knitwear.\u003c/p\u003e\u003cp\u003eI started Hila with the goal of creating a source of income for women in Pamplona who often faced limited and inflexible work opportunities. What began as a simple idea quickly turned into something much more complex. I worked on everything from product design and branding to coordinating production and managing sales through social media. More importantly, I built relationships with the artisans and worked to ensure they were fairly compensated, earning above minimum wage while being able to work from home.\u003c/p\u003e\u003cp\u003eWhat I am most proud of is not just that the business functioned, but that it created real impact. The women we worked with were able to generate income on their own terms, and I was able to see firsthand how business can be used as a tool for empowerment.\u003c/p\u003e\u003cp\u003eThis experience showed me that meaningful change often comes from small, intentional initiatives, and it pushed me to keep pursuing opportunities where I can combine analytical thinking with real-world impact.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"639b685a-ac0c-4d91-93d2-67e33fb5477c\"}"},{"__ref":"Favorites:{\"uuid\":\"b7565dce-63c0-4ec6-974b-c73d5d8f2442\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"137c99e5-1108-461b-af8b-6722531e0fcd\"}"}],"major":"Double Major in Psychology and Economics,minor in Business and Integrated Marketing Certificate ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4fecbfbc-27ef-4b02-aba3-79a691c3ff77\"}"},{"__ref":"DeepDives:{\"uuid\":\"a0fa9e3c-acea-468f-87af-a5f3ae053d9e\"}"},{"__ref":"DeepDives:{\"uuid\":\"12161957-c659-4c99-82c8-d0ea79acd0e1\"}"},{"__ref":"DeepDives:{\"uuid\":\"a3b495df-3c69-4326-8fab-e0a732de2aa5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9be65be1-ec89-421b-83a3-d6bf9d15b1a6/-/preview/-/format/jpg/","https://ucarecdn.com/8dd7bd4b-6c94-46c9-bd85-6cd957466994/-/preview/-/format/jpg/","https://ucarecdn.com/5509d31c-126d-470a-a012-9797bdb9b8c7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"32a2a6df-1a63-410b-8b42-106b46cd493b\"}"},{"__ref":"Education:{\"uuid\":\"948f4d20-db8d-4d41-a8f8-6c808a1b28a1\"}"}],"hiredAt":"2025-09-27T05:33:27.126Z","topics":["K-5 Grade Math","Pre-Algebra","Spanish","Academic Coaching","Economics","Executive Function","Fashion / Cosmetics","K-6 Storybook","Business / Entrepreneurship"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maria-zavala\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ab626c51-3c6a-4415-9a0a-e5b93e0bc1e4\"}"}}},"_sentryTraceData":"428696038d894f9b898a6ac91e7295ab-a2fca5dd15efcd9f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=428696038d894f9b898a6ac91e7295ab,sentry-sample_r
