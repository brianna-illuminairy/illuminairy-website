xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f733a707-ea1d-4913-819d-7613eaaf2c3b\"}":{"__typename":"DeepDives","uuid":"f733a707-ea1d-4913-819d-7613eaaf2c3b","content":"\u003cp\u003eI love being able to talk to students about what they're interested in and see them grow, of course, but mentorship also matters to me because I myself learn so much from my students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"46793b97-0b26-42a5-a691-4924492d57b3\"}":{"__typename":"DeepDives","uuid":"46793b97-0b26-42a5-a691-4924492d57b3","content":"\u003cp\u003eIt's not so much what I do as who I do it with — any job where I can work with passionate and creative people is a dream job for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"3f08f5ce-cf57-4a53-8fc6-6e06cf966303\"}":{"__typename":"DeepDives","uuid":"3f08f5ce-cf57-4a53-8fc6-6e06cf966303","content":"\u003cp\u003eI was really shy and mostly kept to myself for a lot of high school, but I \u003cem\u003ethink\u003c/em\u003e I started to come out of my shell a little by the end.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"8b5db8a8-11c8-4b10-ba96-16f87c65fa01\"}":{"__typename":"DeepDives","uuid":"8b5db8a8-11c8-4b10-ba96-16f87c65fa01","content":"\u003cp\u003eI only did an official summer program ONE summer out of high school, after my junior year, called the Telluride Association Summer Program, which was awesome. I always was and still am dedicated to summer being mostly free time, so I did various things — I wrote a lot and spent hours with friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"51a26eb3-3c88-46e7-a5c1-4f93d584330a\"}":{"__typename":"Education","uuid":"51a26eb3-3c88-46e7-a5c1-4f93d584330a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Symbolic Systems, Comparative Literature","degree":"Bachelor of Arts \u0026 Bachelor of Sciences"},"School:{\"uuid\":\"0bfda57b-830f-484c-84b4-2b5aedf9b4bf\"}":{"__typename":"School","uuid":"0bfda57b-830f-484c-84b4-2b5aedf9b4bf","name":"Dougherty Valley High School","city":"San Ramon","type":"HIGH","state":"California","country":"United States","zip":"94582"},"Education:{\"uuid\":\"5aa87223-948b-4ea5-a663-2e7e6791a30e\"}":{"__typename":"Education","uuid":"5aa87223-948b-4ea5-a663-2e7e6791a30e","school":{"__ref":"School:{\"uuid\":\"0bfda57b-830f-484c-84b4-2b5aedf9b4bf\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ef004457-c360-48cd-80fd-578f6cc8a129\"}":{"__typename":"MentorPublicProfile","uuid":"ef004457-c360-48cd-80fd-578f6cc8a129","displayName":"Armaan R.","slug":"armaan-rashid-1","biography":"Armaan recently graduated from Stanford University, with a B.S. in Symbolic Systems and a B.A. in Comparative Literature, and is attending Chalmers University of Technology in Gothenburg, Sweden this fall for a Master’s in Computer Science. Born and raised in the SF Bay Area, he mostly worked on writing and journalism-related activities in high school. As the co-editor of his school newspaper, he and a fellow student journalist enlisted the Student Press Law Center to successfully sue the county court to open court documents to the public that had been illegally redacted, and he also won the highest rank in the National High School Journalism Convention’s Write-off competition two years in a row. He then entered college with ambitions to be a writer, studying Arabic and creative writing, before (predictably) changing his mind a bunch of times. Since then, he’s been a journalist, editor, camp counselor, barista, researcher, programmer, graphic designer and tutor in the past, and right now he’s working on projects in machine learning at the Recurse Center. He’s recently finished a project building an algorithm that detects ChatGPT-generated text, and is currently building a model to efficiently prove theorems in logic. \n\nArmaan loves tutoring and working with students not just to help them succeed, but also because he loves learning about how every student thinks about and understand the world differently. Since he’s changed fields so many times, he is very familiar with the experience of having to learn a new “language” (i.e., C++, quantum physics, formal logic), that experienced specialists around him already know, in a very short amount of time. To that end, he’s particularly interested in helping students who feel behind compared to their peers, or that they can’t break into some field because someone they know has already been doing it for five years. In addition to traditional academic mentorship, he’s most interested in working with students on passion projects or exploratory learning journeys to learn about things they may not be able to within school. He is available for tutoring in writing and literature, philosophy, mathematics, programming, formal logic, and machine learning, but is also open to exploring new topics with students who are interested. He’s also available for tutoring on standardized exams like the SAT and AP Exams, having achieved a perfect SAT score in high school, and has experience helping students who struggle with tests and test anxiety in general. He firmly believes that every student is unique and works to adapt his teaching to different learning styles as best as he can.\n\nIn his free time, Armaan loves listening to music, taking walks outdoors, being bad at video games, and drinking too much coffee, and debating whether astrology is real or not.","teachingVideoPlaybackId":"GiatEi70100v9IHUMIwL7PQKY01rwws00EFJpQZI4TAJELY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems, Comparative Literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f733a707-ea1d-4913-819d-7613eaaf2c3b\"}"},{"__ref":"DeepDives:{\"uuid\":\"46793b97-0b26-42a5-a691-4924492d57b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f08f5ce-cf57-4a53-8fc6-6e06cf966303\"}"},{"__ref":"DeepDives:{\"uuid\":\"8b5db8a8-11c8-4b10-ba96-16f87c65fa01\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2ffb74d5-985f-470c-bdcd-72e07901cfbc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"51a26eb3-3c88-46e7-a5c1-4f93d584330a\"}"},{"__ref":"Education:{\"uuid\":\"5aa87223-948b-
