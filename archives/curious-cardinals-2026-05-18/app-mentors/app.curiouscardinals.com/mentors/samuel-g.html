xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"80dea29a-8edc-433c-92bd-17b62e3325db\"}":{"__typename":"Favorites","uuid":"80dea29a-8edc-433c-92bd-17b62e3325db","photoUrl":"https://ucarecdn.com/7125bd61-fdb5-484c-b50c-8ca1549f8a29/","title":"Jackie Chan","type":"ACTOR"},"Favorites:{\"uuid\":\"1934746b-f4b2-43c0-87f0-968d3a6972a8\"}":{"__typename":"Favorites","uuid":"1934746b-f4b2-43c0-87f0-968d3a6972a8","photoUrl":"https://ucarecdn.com/14a5c7b6-7bf9-40d1-a8f6-924399f726d4/","title":"Monster Hunter","type":"GAME"},"Favorites:{\"uuid\":\"6fc658cd-1c10-457c-a44f-e0fa9bce53c9\"}":{"__typename":"Favorites","uuid":"6fc658cd-1c10-457c-a44f-e0fa9bce53c9","photoUrl":"https://ucarecdn.com/cb39f6fb-0742-41fd-ab84-a5470cec34cf/","title":"Kung fu Panda","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e179bdf5-546e-4502-90db-2060951bcd45\"}":{"__typename":"DeepDives","uuid":"e179bdf5-546e-4502-90db-2060951bcd45","content":"\u003cp\u003eTry everything. Don't let the fear of failure stop you from trying something new. Embrace failure and let it guide on the path you were meant to take.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c11ba55a-e9c3-4a4c-88ca-2b06282d5564\"}":{"__typename":"DeepDives","uuid":"c11ba55a-e9c3-4a4c-88ca-2b06282d5564","content":"\u003cp\u003eOne of the things I wished I had growing up was someone who could guide me in my academic ventures. My parents were immigrants and didn't quite understand the lay of the land so it was put upon me to find my own way. I hope to be able to help others find their way and become successful in their lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"06decc09-83e0-423c-a5ea-eae2f98d02a0\"}":{"__typename":"DeepDives","uuid":"06decc09-83e0-423c-a5ea-eae2f98d02a0","content":"\u003cp\u003ePhysics and Math are two grueling subjects and yet I find myself constantly entranced by them. The allure of uncovering the language of the universe was irresistible and I felt drawn towards both of the fields. Physics helps me explain the workings of the universe and Math holds a language that can explain the phenomena in a beautiful way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"9eb68bf7-f8a3-4328-af01-5f8ad4077d11\"}":{"__typename":"DeepDives","uuid":"9eb68bf7-f8a3-4328-af01-5f8ad4077d11","content":"\u003cp\u003eMy greatest source of motivation are my parents. They both came from incredibly humble beginnings and gave me an opportunity that they themselves would've never dreamed possible. I hope that through my life I'm able to maximize that opportunity that was given to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"1c315744-af8c-4ed1-9b0e-f4ba012b2cf5\"}":{"__typename":"School","uuid":"1c315744-af8c-4ed1-9b0e-f4ba012b2cf5","name":"Cox Mill High School","city":"Concord","type":"HIGH","state":"NC ","country":"United States","zip":"28027"},"Education:{\"uuid\":\"7c5adc91-7d5d-42ed-a738-f655dd5beaa8\"}":{"__typename":"Education","uuid":"7c5adc91-7d5d-42ed-a738-f655dd5beaa8","school":{"__ref":"School:{\"uuid\":\"1c315744-af8c-4ed1-9b0e-f4ba012b2cf5\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"14f078d6-9f0d-48d6-8046-d16c83afe836\"}":{"__typename":"Education","uuid":"14f078d6-9f0d-48d6-8046-d16c83afe836","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Physics and Math","degree":null},"MentorPublicProfile:{\"uuid\":\"d925cdbf-e79a-4ab5-9d31-fc906ffca54e\"}":{"__typename":"MentorPublicProfile","uuid":"d925cdbf-e79a-4ab5-9d31-fc906ffca54e","displayName":"Samuel G.","slug":"samuel-g","biography":"\u003cp\u003eI love the process of learning, whether it's exploring new recipes in the kitchen, pushing my limits at the gym, or diving into the stories and experiences of the people around me. This curiosity doesn't just stay in the personal realm; it carries over into my academic life. As a double major in Physics and Mathematics at Duke University, with a minor in Statistics, I’m constantly fascinated by how abstract concepts come together to shape the world around us.\u003c/p\u003e\u003cp\u003eWhat excites me most is the challenge of problem-solving, whether I’m grappling with a complex physics equation or experimenting with different ways to improve my workout routi
