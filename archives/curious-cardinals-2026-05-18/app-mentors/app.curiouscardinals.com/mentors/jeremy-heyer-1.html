xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"668138a7-23ee-4431-a0eb-bcbc48ed5fe2\"}":{"__typename":"Favorites","uuid":"668138a7-23ee-4431-a0eb-bcbc48ed5fe2","photoUrl":"https://ucarecdn.com/5260fb51-ce29-4806-b35b-daa88304ec96/","title":"Swimming","type":"ALBUM"},"Favorites:{\"uuid\":\"1616d249-9ead-4ca4-998f-65920abae638\"}":{"__typename":"Favorites","uuid":"1616d249-9ead-4ca4-998f-65920abae638","photoUrl":"https://ucarecdn.com/0afb146b-733e-4570-abf6-4c4051fbe403/","title":"SF 49ers","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5102d352-df21-4196-817d-4e8ec9835916\"}":{"__typename":"DeepDives","uuid":"5102d352-df21-4196-817d-4e8ec9835916","content":"\u003cp\u003eMentorship holds a special place in my heart because I've experienced firsthand the challenges of adapting to teaching styles that don't align with my personal learning preferences. As I was moving through school, I often found myself in classrooms where the one-size-fits-all teaching approach didn't cater to individual learning differences. This was especially pronounced in larger class settings where personalized attention was scarce, sometimes making it difficult for students like me to fully grasp complex concepts. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe mentorship bridges this gap by providing tailored guidance that adapts to the unique needs of each student. It's not just about delivering content; it's about understanding how a student learns and interacting in a way that resonates with them. This personalized approach ensures that learning becomes more intuitive and accessible, allowing students to explore subjects in depth, at their own pace, and in ways that are most effective for them.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b41ee710-7e6e-4829-ae87-cb85fe4c90c0\"}":{"__typename":"DeepDives","uuid":"b41ee710-7e6e-4829-ae87-cb85fe4c90c0","content":"\u003cp\u003eIn my spare time, I'm drawn to the strategic intricacies of games that require deep statistical thinking, particularly card games, with poker being my favorite. Poker, for me, isn't just a game; it's a fascinating intersection of psychology, probability, and decision-making. Each hand offers a new set of challenges and opportunities to apply theoretical concepts from my studies in a practical, real-world setting.\u003c/p\u003e\u003cp\u003eExploring these games allows me to sharpen my analytical skills while also providing a fun and engaging way to relax and unwind. This hobby not only enhances my critical thinking and problem-solving abilities but also offers a playful venue to explore the mathematical frameworks of my academic and personal interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"74d893cd-4e05-4c43-954b-80d864120c23\"}":{"__typename":"DeepDives","uuid":"74d893cd-4e05-4c43-954b-80d864120c23","content":"\u003cp\u003eIf I could offer advice to my middle and high school self, it would center on the importance of celebrating the small wins each day. During those formative years, it's easy to become fixated on grand achievements or to fall into the trap of comparing yourself to others. However, the true progress lies in the accumulation of small, daily victories that build your skills and confidence steadily over time.\u003c/p\u003e\u003cp\u003eI would emphasize the principle of incremental improvement; I read in the book Atomic Habits that if you get 1% better at something each day for a year, you will be 37 times better at the end. By getting slightly better each day you remove the pressure of monumental goals and instead cultivate a mindset geared towards continuous improvement.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b566ec70-52fc-48eb-9747-af2f24e04b57\"}":{"__typename":"DeepDives","uuid":"b566ec70-52fc-48eb-9747-af2f24e04b57","content":"\u003cp\u003eI chose to major in Management Science and Engineering (MS\u0026amp;E) at Stanford because it perfectly aligns with my passion for solving complex problems through an integrated approach that combines business acumen with technical prowess. The appeal of MS\u0026amp;E lies in its unique blend of engineering, economics, and management, offering a holistic perspective that prepares students to tackle multifaceted challenges in various industries. Additionally, my interest in personal finance and entrepreneurship finds a solid foundation in MS\u0026amp;E, as the major encompasses critical aspects like decision analysis, risk management, and data science—skills essential for leadership in business and technology. The curriculum offers a robust framework that stimulates innovative thinking and practical problem-solving skills, which are crucial for my future aspirations, including attending law school and fostering technological advancements in legal practices.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"d14c2bb4-ce34-481b-8f35-dd80d837f961\"}":{"__typename":"School","uuid":"d14c2bb4-ce34-481b-8f35-dd80d837f961","name":"Tustin High School","city":"Tustin","type":"HIGH","state":"California","country":"United States","zip":"92780"},"Education:{\"uuid\":\"b4074269-ba47-4772-a382-f2bbe8eda7bf\"}":{"__typename":"Education","uuid":"b4074269-ba47-4772-a382-f2bbe8eda7bf","school":{"__ref":"School:{\"uuid\":\"d14c2bb4-ce34-481b-8f35-dd80d837f961\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"6dc02713-9507-4f58-8d6d-c5d8231be2fc\"}":{"__typename":"Education","uuid":"6dc02713-9507-4f58-8d6d-c5d8231be2fc","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"MS\u0026E","degree":null},"MentorPublicProfile:{\"uuid\":\"ed5dfb2e-672e-4e06-abfc-b870d04b1a9e\"}":{"__typename":"MentorPublicProfile","uuid":"ed5dfb2e-672e-4e06-abfc-b870d04b1a9e","displayName":"Jeremy H.","slug":"jeremy-heyer-1","biography":"\u003cp\u003eHi everyone! My name is Jeremy, and I am currently a junior attending Stanford. My family is from Hawaii, but I grew up in Orange County, CA. I am an MS\u0026amp;E major which is kind of a more business focused engineering major. I am really interested in personal finance and founded a club designed to foster financial literacy among my peers. I am passionate about using the principles of engineering and data science to find innovative solutions to complicated problems, and after I graduate I plan to take use what I have learned to help me as I attend law school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom, I love everything about the outdoors, from snowboarding to camping. I enjoy reading and have read almost every book of every series written by Rick Riordan. I am a huge sports fan and love all of the bay area teams, but have a special place in my heart for football and the San Francisco 49ers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor for Curious Cardinals, I'm excited to help students explore their interests, tackle challenging concepts, and discover the joy in learning. I pride myself in approaching difficult problems in a way that is directly tailored to my students' learning style. Now that you know a little about me, I'm excited to meet and get to know you!\u003c/p\u003e","teachingVideoPlaybackId":"3omcrfDAmFWSquGng9H2Ml3Nb5ew53BLpLvm2URaJ02E","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"668138a7-23ee-4431-a0eb-bcbc48ed5fe2\"}"},{"__ref":"Favorites:{\"uuid\":\"1616d249-9ead-4ca4-998f-65920abae638\"}"}],"causesSupported":[],"major":"MS\u0026E","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5102d352-df21-4196-817d-4e8ec9835916\"}"},{"__ref":"DeepDives:{\"uuid\":\"b41ee710-7e6e-4829-ae87-cb85fe4c90c0\"}"},{"__ref":"DeepDives:{\"uuid\":\"74d893cd-4e05-4c43-954b-80d864120c23\"}"},{"__ref":"DeepDives:{\"uuid\":\"b566ec70-52fc-48eb-9747-af2f24e04b57\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/986902b8-a0e7-4474-a275-ec945d3f3ad9/-/preview/-/format/jpg/","https://ucarecdn.com/6ae5bf0c-b965-4a7c-b56f-3cdd1d9a62f9/-/preview/-/format/jpg/","https://ucarecdn.com/b5b3872d-deb4-4cf8-9d7d-8df41be197a3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b4074269-ba47-4772-a382-f2bbe8eda7bf\"}"},{"__ref":"Education:{\"uuid\":\"6dc02713-9507-4f58-8d6d-c5d8231be2f
