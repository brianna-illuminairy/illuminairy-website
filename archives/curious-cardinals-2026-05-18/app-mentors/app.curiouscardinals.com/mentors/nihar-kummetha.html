uestion":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2dcedf25-4fdb-4af8-b91d-022a869a8357\"}":{"__typename":"DeepDives","uuid":"2dcedf25-4fdb-4af8-b91d-022a869a8357","content":"\u003cp\u003eUNC \u0026amp; Johns Hopkins Intern, VA Volunteer, Kumon Employee, Physician Shadowing\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1c6d69d9-52a8-49b0-8f35-7fdfc4ea1cf4\"}":{"__typename":"DeepDives","uuid":"1c6d69d9-52a8-49b0-8f35-7fdfc4ea1cf4","content":"\u003cp\u003eEat, travel, eat while traveling, travel while eating\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6f7270f9-556e-4582-b81e-c3aca8e34564\"}":{"__typename":"DeepDives","uuid":"6f7270f9-556e-4582-b81e-c3aca8e34564","content":"\u003cp\u003ePhysician, scientist, policy-maker\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"12357c73-fe08-4459-9c56-33bf3f3ccff8\"}":{"__typename":"School","uuid":"12357c73-fe08-4459-9c56-33bf3f3ccff8","name":"North Carolina School of Science and Mathematics - Durham","city":"Durham","type":"HIGH","state":"North Carolina","country":"United States","zip":"27705"},"Education:{\"uuid\":\"c4d3dabe-5713-4dab-a80e-5186da556112\"}":{"__typename":"Education","uuid":"c4d3dabe-5713-4dab-a80e-5186da556112","school":{"__ref":"School:{\"uuid\":\"12357c73-fe08-4459-9c56-33bf3f3ccff8\"}"},"startYear":"2023","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"1162e14b-c31e-4f58-841b-d6bb5a7d0738\"}":{"__typename":"Education","uuid":"1162e14b-c31e-4f58-841b-d6bb5a7d0738","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Biochemistry (pre-med) and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"5575beef-e6f0-4b35-8272-9bd67f55f3e7\"}":{"__typename":"MentorPublicProfile","uuid":"5575beef-e6f0-4b35-8272-9bd67f55f3e7","displayName":"Nihar K.","slug":"nihar-kummetha","biography":"\u003cp\u003eI am a passionate student, researcher, and mentor with a strong commitment to education, health equity, and helping others reach their full potential. My academic interests center on biochemistry, public health, and public policy. I plan to pursue a career as a physician-scientist focused on making healthcare more accessible and effective.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am a current undergraduate student in Biochemistry and Economics at the University of Pennsylvania. In addition to the biology, physics, chemistry, and economics courses I take for my major, I engage in liberal arts and sciences coursework spanning a multitude of disciplines, including management, writing, statistics, and computer science.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up with a range of health conditions, I've become acutely aware of how biology, nutrition, and medical decision-making directly affect quality of life. This experience motivated me to pursue hands-on research and mentorship opportunities early on. I have conducted long-term research in drug design, including work on a quinoline-based Histamine H2 receptor antagonist for GERD. This research named me a Scholar in the 2025 Regeneron Science Talent Search, the nation’s oldest and most prestigious science research competition for high school seniors. My research also named me a 2025 NC International Science Challenge Scholar, earning me an all-expenses-paid trip to Japan, where I presented my work. My research also earned awards in the science fair and other STEM research competitions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my high school summers, I participated in science research internships. I have completed a Brain Sciences internship at Johns Hopkins University, where I co-presented a literature review on virtual reality and the cingulate gyrus. I also completed a nutrition internship at UNC.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of research, I have been passionate about teaching and tutoring. I have served as a chemistry teaching assistant for AP Chemistry, Biochemistry, and advanced research chemistry, supporting students through challenging material while helping them develop confidence and problem-solving skills. I have also worked as a paid Kumon instructor and volunteered as a tutor for community organizations supporting low-income and first-generation students. Lastly, I provide college counseling and SAT/PSAT tutoring to students all over the country. These experiences have shaped my tutoring philosophy: learning should be rigorous, supportive, and tailored to each student’s goals and learning style. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I am deeply involved in service and leadership, particularly in mental health advocacy. I have contributed hundreds of volunteer hours working with veterans through the VA, helping with mental health initiatives, nutrition education, and technology access. I was named the Disabled American Veterans' Top Scholar, earning a $30,000 scholarship. I have also lobbied at the state and federal level with American Foundation for Suicide Prevention, contributing to policy efforts that promote mental health awareness and access to care.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOther awards of mine include the 2025 U.S. Presidential Scholar, awarded to one graduating high school male and female student per state by the President of the United States. I've also been awarded $10,000 from the Taco Bell Live Mas Scholarship and one of 2,500 graduating high school seniors to be awarded the $2500 National Merit Scholarship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a passion project mentor, I strive to be patient, organized, and encouraging. I focus not only on helping students dream big, but also on teaching them how to think critically and approach challenges with confidence. My goal is to empower every student I work with to succeed while feeling supported and understood.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"JO3Y6EdowFSHNrLU2rFgQWYuMq3lNqo01gzG9NWJL1uE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eU.S. Presidential Scholar\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"87e63678-6641-4adb-8493-3191e7ed20c3\"}"},{"__ref":"Favorites:{\"uuid\":\"8549f3ed-d2db-4dfa-95ba-0163c4792573\"}"},{"__ref":"Favorites:{\"uuid\":\"66e65f61-a30a-48a7-8cd6-abbf8f2d42d9\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"49beaf76-b8a4-4cc7-b2c6-9c69371ebad0\"}"},{"__ref":"CausesSupported:{\"uuid\":\"147a7dcf-1d20-4902-9d65-2b3e5b761520\"}"}],"major":"Biochemistry (pre-med) and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"df949863-47e4-4a5c-9cf9-f3d361b33b71\"}"},{"__ref":"DeepDives:{\"uuid\":\"2dcedf25-4fdb-4af8-b91d-022a869a8357\"}"}
