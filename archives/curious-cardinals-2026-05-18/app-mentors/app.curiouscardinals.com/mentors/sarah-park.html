xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a1efd90c-cb85-4d28-82e6-c422617e123d\"}":{"__typename":"DeepDives","uuid":"a1efd90c-cb85-4d28-82e6-c422617e123d","content":"\u003cp\u003eDon't be afraid to take risks! You need to be willing to take risks, make mistakes, etc to succeed!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"3dfe4a6b-c712-4e83-af60-bb3d3b32c80f\"}":{"__typename":"DeepDives","uuid":"3dfe4a6b-c712-4e83-af60-bb3d3b32c80f","content":"\u003cp\u003eBeing able to inspire younger students to follow their passions!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8ce90d1f-7957-404b-805f-8bf25952a8a2\"}":{"__typename":"DeepDives","uuid":"8ce90d1f-7957-404b-805f-8bf25952a8a2","content":"\u003cp\u003eTennis! Have been playing my whole life and was captain in HS.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"7736dbca-1761-4a6c-88b6-c8de25385e78\"}":{"__typename":"School","uuid":"7736dbca-1761-4a6c-88b6-c8de25385e78","name":"Clark High School","city":"Las Vegas","type":"HIGH","state":"Nevada","country":"United States","zip":"89102"},"Education:{\"uuid\":\"a4fe6892-786b-40a4-8557-a1d37bafac07\"}":{"__typename":"Education","uuid":"a4fe6892-786b-40a4-8557-a1d37bafac07","school":{"__ref":"School:{\"uuid\":\"7736dbca-1761-4a6c-88b6-c8de25385e78\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"34e08ab5-ce71-487d-ade5-5c91ffc39b28\"}":{"__typename":"Education","uuid":"34e08ab5-ce71-487d-ade5-5c91ffc39b28","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"274304b0-0f2f-473f-a289-e2039188faf1\"}":{"__typename":"MentorPublicProfile","uuid":"274304b0-0f2f-473f-a289-e2039188faf1","displayName":"Sarah P.","slug":"sarah-park","biography":"\u003cp\u003eHi, I’m Sarah! I’m a junior at Harvard studying Economics, Environmental Science, and Spanish. I love working at the intersection of policy, sustainability, and global perspectives, and I’m always excited to connect with people who are curious about making an impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBack in high school, I threw myself into a wide range of activities that shaped who I am today. I was heavily involved in debate, which taught me how to think critically, communicate effectively, and build confidence in speaking to large audiences. Alongside debate, I worked extensively in politics - first through creating a local High School Democrats chapter, and later by volunteering with my state Democratic Party, and working directly with state legislators. These experiences showed me how much young people can influence policy when they are willing to step up and get involved.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, I was deeply passionate about climate advocacy. I founded my own nonprofit organization dedicated to raising awareness about climate change and mobilizing youth to take action in their communities. Through this work, I had the incredible opportunity to serve as a TEDx speaker, where I shared my perspective on youth leadership and the urgent need for climate solutions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was also fortunate to be selected as a U.S. Senate Youth Program Delegate and to serve as a U.S. Senate Page. Both of these experiences gave me a behind-the-scenes look at how our government works and inspired me to keep finding ways to bridge my interests in policy, sustainability, and leadership. If you’re curious about either of those programs, I’m happy to answer any questions and share what I learned.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOver time, I’ve found a passion for helping other students create and grow their own projects. Whether it’s launching a nonprofit, designing a passion project, speaking in public, or getting their work featured in the news, I love mentoring people through the process of turning ideas into action.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also enjoy helping students with the college admissions journey. I applied to Harvard early and was fortunate to be admitted, and I know how overwhelming the process can feel. I can offer advice on crafting essays, choosing recommenders, making school lists, and approaching applications with authenticity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost of all, I want to encourage people to dream big, take initiative, and believe in their ability to create change - even before college. I'd love to help you in your journey and happy to be a resource in this process.\u003c/p\u003e","teachingVideoPlaybackId":"HrKzOf1k7tLetCLyH6P1xTInTmXnDhEehbah01l7o3pk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a1efd90c-cb85-4d28-82e6-c422617e123d\"}"},{"__ref":"DeepDives:{\"uuid\":\"3dfe4a6b-c712-4e83-af60-bb3d3b32c80f\"}"},{"__ref":"DeepDives:{\"uuid\":\"8ce90d1f-7957-404b-805f-8bf25952a8a2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/54531fcb-c5ce-4fa1-9329-ad93aae8adba/-/preview/-/format/jpg/","https://ucarecdn.com/87210f41-0434-4aec-8c3f-b18a728ff12a/-/preview/-/format/jpg/","https://ucarecdn.com/5c8dcb7c-dfad-4699-acee-c9905861119b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a4fe6892-786b-40a4-8557-a1d37bafac07\"}"},{"__ref":"Education:{\"uuid\":\"34e08ab5-ce71-487d-ade5-5c91ffc39b28\"}"}],"hiredAt":"2025-09-10T17:30:55.753Z","topics":["K-5 Grade Math","Writing","History Project","Fashion / Cosmetics","Business / Entrepreneurship","Finance / Investing","Law / Government / Policy","Sustainability","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sarah-park\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"274304b0-0f2f-473f-a289-e2039188faf1\"}"}}},"_sentryTraceData":"bdeebd20f32c403db8ce95bef3e50250-80e592a6c6f710c1-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=bdeebd20f32c403db8ce95bef3e50250,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sarah-park"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"mark
