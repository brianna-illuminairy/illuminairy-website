xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"7a4519d9-5547-4968-b80c-01f7fad264a7\"}":{"__typename":"DeepDives","uuid":"7a4519d9-5547-4968-b80c-01f7fad264a7","content":"\u003cp\u003eMy greatest role model is my dad. He is incredibly hard-working and has found great success in life because of that, but what I admire most about him is his patience and kindness towards people in his life. He taught me that being compassionate and empathetic is the most important thing to live your life with, and I try to bring that kindness to the world every day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"52d7552b-84e6-4cfe-885b-3c1c0c4982d5\"}":{"__typename":"DeepDives","uuid":"52d7552b-84e6-4cfe-885b-3c1c0c4982d5","content":"\u003cp\u003eI chose my major because I loved making music on my laptop in high school, and wanted to explore the larger intersection of technology and music. Studying in my major ended up opening a massive world of sound and audio technology that I fell in love with and immersed myself in more and more each year. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"96f91698-5011-49fb-9bc2-54554258cb0e\"}":{"__typename":"DeepDives","uuid":"96f91698-5011-49fb-9bc2-54554258cb0e","content":"\u003cp\u003eMentorship is important to me because of all the wonderful mentors I've had in my own life. Growing up, I often struggled with insecurity and a lack of confidence, which made me scared to pursue things out of my comfort zone. However, I had so many amazing teachers and role models who believed in me and pushed me to pursue my passions, which ultimately led me to become the confident and expressive person I am today. I would love to give that kind of support and guidance to someone else through this mentorship program!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"68141ea2-2a40-4fa6-8210-f67025ba978a\"}":{"__typename":"DeepDives","uuid":"68141ea2-2a40-4fa6-8210-f67025ba978a","content":"\u003cp\u003eOne time I had a dream that I was at a Paramore concert (one of my favorite bands in high school!). I was having a wonderful time in the audience when suddenly I was teleported onstage and had to sing and play guitar to save the show! It was both a nightmare and a dream come true :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"015da320-1cc8-41d5-bb87-8d2f8cc76a30\"}":{"__typename":"School","uuid":"015da320-1cc8-41d5-bb87-8d2f8cc76a30","name":"The Baldwin School","city":"Bryn Mawr","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19010"},"Education:{\"uuid\":\"76d5a039-e8f3-463a-a00e-e536e47d5622\"}":{"__typename":"Education","uuid":"76d5a039-e8f3-463a-a00e-e536e47d5622","school":{"__ref":"School:{\"uuid\":\"015da320-1cc8-41d5-bb87-8d2f8cc76a30\"}"},"startYear":"2008","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a93bfc9c-4311-44cd-a06a-cd2ae7ac5337\"}":{"__typename":"Education","uuid":"a93bfc9c-4311-44cd-a06a-cd2ae7ac5337","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computing and the Arts (music track)","degree":null},"MentorPublicProfile:{\"uuid\":\"d8b5a130-ce9d-45d5-8d26-b96cf5c62c31\"}":{"__typename":"MentorPublicProfile","uuid":"d8b5a130-ce9d-45d5-8d26-b96cf5c62c31","displayName":"Grace H.","slug":"grace-halak","biography":"\u003cp\u003eHi, I'm Grace! I'm studying Computing and the Arts at Yale, which is an interdisciplinary major that explores the intersection of computer science and art of various mediums. I'm on the music track, which means I study things like sound synthesis, digital music creation and production, and audio systems. I'm a musician (electric guitar!) and record and produce my own music. I am also deeply interested in film and hope to pursue a career in sound mixing/editing for movies and TV after I graduate. Other than music and film, I've also dabbled in sound for theater (ex. mixing and engineering musicals and plays), setting up live performances, and coding interactive audio systems for video games.\u003c/p\u003e\u003cp\u003eBecause of my major, I am super passionate about the interplay between technology and creativity. In this day and age, when so many students have such increased access to technology and the Internet, I believe it's really important and exciting for young people to learn how to harness these powerful tools for their own passions and pursuits. Mastering the tools of a craft, whether it's music, art, writing, or anything else, can unlock such a deep passion and interest in the discipline and also gives you the power and confidence to realize your visions and improve your skills. When I was in high school, I always had a latent interest in music but wasn't confident or knowledgable enough to try and create my own. However, my guitar teacher saw this passion in me and encouraged me to write and share my original music. He then taught me how to record and produce songs on my laptop, guiding me through the technical aspects of creating music while fostering the personal joy of creating something that was truly special to me. At the end of my high school career, I had completed an album of original songs with his help. It was so rewarding to not only become skilled in something I loved so much, but also to have a tangible, finished product that was proof of my progress and growth. I would love to give a young student like myself a similar opportunity to take something they're passionate about and turn it into a sustainable skill and finished product.\u003c/p\u003e","teachingVideoPlaybackId":"vqP5Z01YLtYCAxpVU00KxbNvVBzhHIz4XBAc5sko022hZE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computing and the Arts (music track)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7a4519d9-5547-4968-b80c-01f7fad264a7\"}"},{"__ref":"DeepDives:{\"uuid\":\"52d7552b-84e6-4cfe-885b-3c1c0c4982d5\"}"},{"__ref":"DeepDives:{\"uuid\":\"96f91698-5011-49fb-9bc2-54554258cb0e\"}"},{"__ref":"DeepDives:{\"uuid\":\"68141ea2-2a40-4fa6-8210-f67025ba978a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b8062d84-c963-429b-9d23-edc871458835/-/preview/-/format/jpg/","https://ucarecdn.com/f9c8fb29-25bc-4f12-b9ec-8d4e04381906/-/preview/-/format/jpg/","https://ucarecdn.com/5e57bde8-562b-4592-8a0b-9b3ead97f1a5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"76d5a039-e8f3-463a-a00e-e536e47d5622\"}"},{"__ref":"Education:{\"uuid\":\"a93bfc9c-4311-44cd-a06a-cd2ae7ac5337\"}"}],"hiredAt":"2026-01-21T19:37:01.088Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science","Creative Writing","Music","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Coding / Programming","Web Design","Game Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"grace-halak\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d8b5a130-ce9d-45d5-8d26-b96cf5c62c31\"}"}}},"_sentryTraceData":"3d22008441a9449fab6703217a9c4ea9-850cc7ff6b9f70cc-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3d22008441a9449fab6703217a9c4ea9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"grace-halak"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:
