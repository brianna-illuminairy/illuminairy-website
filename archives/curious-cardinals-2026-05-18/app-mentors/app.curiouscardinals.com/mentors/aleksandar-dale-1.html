xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"73f76f71-f66b-4134-be4e-c97a8db902b6\"}":{"__typename":"Favorites","uuid":"73f76f71-f66b-4134-be4e-c97a8db902b6","photoUrl":"https://ucarecdn.com/1c695a83-9a70-4a09-8e15-0e7d9e1410c9/","title":"Cleveland Browns","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"0d2fbada-3d76-47b8-a7bf-9ccaa67c784a\"}":{"__typename":"Favorites","uuid":"0d2fbada-3d76-47b8-a7bf-9ccaa67c784a","photoUrl":"https://ucarecdn.com/1c695a83-9a70-4a09-8e15-0e7d9e1410c9/","title":"Man on the Moon: The End of Day","type":"ALBUM"},"Favorites:{\"uuid\":\"2e157352-d734-42ce-a979-4c2e0c039928\"}":{"__typename":"Favorites","uuid":"2e157352-d734-42ce-a979-4c2e0c039928","photoUrl":"https://ucarecdn.com/1c695a83-9a70-4a09-8e15-0e7d9e1410c9/","title":"The Empire Strikes Back","type":"MOVIE"},"CausesSupported:{\"uuid\":\"f1cfa5dc-d1aa-4875-8da7-aea1f6ee7392\"}":{"__typename":"CausesSupported","uuid":"f1cfa5dc-d1aa-4875-8da7-aea1f6ee7392","name":"Luv Michael","description":"\u003cp\u003ehttps://luvmichael.com/\u003c/p\u003e","photoUrl":"https://ucarecdn.com/a23bc048-229d-4293-a156-3156789e3f04/"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"674d20ca-f956-4b71-bf54-20be70e0dd78\"}":{"__typename":"DeepDives","uuid":"674d20ca-f956-4b71-bf54-20be70e0dd78","content":"\u003cp\u003eMy biggest mentor and inspiration is my mom. She has sacrificed so much for me and works hard every day to provide me and my brother with the best opportunities possible. Not only is she a great mom, but she is also a brilliant researcher who inspired me to pursue science. She showed me the beauty in pursuing your curiosity and questions and that learning is the most beautiful thing in the world. She helped show me that failure is an integral part of the learning process and is okay. My mom has also inspired me to be a great teacher because she has helped so many kids achieve their dreams by pushing them and believing in them. I hope to one day have the same positive impact on kids' lives as my mom has.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"dd5952a2-ce67-4df8-9dc5-bd47482a8dd1\"}":{"__typename":"DeepDives","uuid":"dd5952a2-ce67-4df8-9dc5-bd47482a8dd1","content":"\u003cp\u003eI spent my summers in high school going to football practice and doing research. The summer heading into my Senior year, I worked in a Cancer research lab from 9-4 at the University of Illinois at Chicago. In that Lab, I researched Hepatocellular Carcinoma, a type of liver cancer. In that Lab, I learned how to do Sanger Sequencing, PCR, gel electrophoresis, and DNA purification. I would then head to football practice from 4:15 to 7:30, where I played Linebacker and Tight End. If I was not in the Lab or the Gridiron, you could catch me swimming with my brother in Lake Michigan, cooling off from the hot and humid Chicago Summers.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6067dfb1-c126-4c82-b17f-35241d8721cd\"}":{"__typename":"DeepDives","uuid":"6067dfb1-c126-4c82-b17f-35241d8721cd","content":"\u003cp\u003eMy dream job is to be a cancer researcher, become a professor, and teach the next generation of scientists. I have seen the way that cancer has affected so many families, and I want to do research that can help these families in an affordable and less invasive way. I also have find many of the biological and structural aspects of cancers fascinating and want to gain a more extensive understanding of how they work. As a teacher, I would like to challenge kids to think critically, truly understand what they are learning, and not just memorize facts from a textbook. I want to push kids to believe that no dream is too great with the proper support and mindset.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3e55c998-8a36-4b47-b3b7-313f29a47d07\"}":{"__typename":"DeepDives","uuid":"3e55c998-8a36-4b47-b3b7-313f29a47d07","content":"\u003cp\u003eWhen I am not studying for exams or in the lab, I like to stay active. I currently play Rugby with the Northwestern Men's Rugby Club and am a frequent gymgoer. I also love to watch anime and read manga ranging from Naruto to Erased. I am a huge sports fan and love the Cleveland Browns and Chelsea FC. I like to read books, too, with some of my favorite books being All Quiet On the Western Front and 1984. On the weekends, I like to go and play basketball or soccer with my friends, and sometimes, if I am really tired, nothing beats a good nap.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"63ab2d32-6ad5-484f-ae9a-9251fbc82189\"}":{"__typename":"School","uuid":"63ab2d32-6ad5-484f-ae9a-9251fbc82189","name":"Whitney M. Young Magnet High School","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60607"},"Education:{\"uuid\":\"f6bd8929-83f3-4691-83aa-69036fde97bc\"}":{"__typename":"Education","uuid":"f6bd8929-83f3-4691-83aa-69036fde97bc","school":{"__ref":"School:{\"uuid\":\"63ab2d32-6ad5-484f-ae9a-9251fbc82189\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"53306f03-7811-41b9-ab6a-b2ab92144d76\"}":{"__typename":"Education","uuid":"53306f03-7811-41b9-ab6a-b2ab92144d76","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biology and Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"399a1038-5331-4be9-8808-27b5d56ad0ff\"}":{"__typename":"MentorPublicProfile","uuid":"399a1038-5331-4be9-8808-27b5d56ad0ff","displayName":"Aleksandar D.","slug":"aleksandar-dale-1","biography":"\u003cp\u003eHello! Welcome to my profile. My name is Aleksandar Dale, and I am a freshman studying Biology and Data Science at Northwestern University. I am a local kid born and raised in Chicago, so if you have any questions about the best city in the world, feel free to ask me. Even though I am from Chicago, my mom's side of the family is from Serbia, so I am very familiar with the Balkans and go to Belgrade often. My dad is Black from Cleveland, and my mom is from Serbia, so I know the struggles of growing up with a mixed racial identity, so if you have any questions or struggles about growing up with a mixed racial identity, I am always happy to help.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am a huge sports fan! I currently play Rugby for the Northwestern Rugby Club, but I am new to the sport, so I am still learning all the rules. The NFL teams I support are the Browns and the Bears. I am also a huge Chelsea fan. My sports teams are not doing so well right now, but I still remain loyal to them no matter what. In high school, I was an All-State Water polo and Football player, so I am always down to talk about sports or what it's like to be a student-athlete.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love everything science-related, ranging from environmental science to structural biology and even science fiction. I am currently working in a Biophysics lab at Northwestern, studying the protein structure of ABC transporters in bacteria and cancer cells. I have also worked in two other previous labs studying Liver Cancer cells and Phytochrome proteins. I love investigating how the structure of molecules and organisms helps dictate their function. I hope to use my understanding of proteins to help create meaningful and affordable cancer treatments for people in the future.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo relax, I love to go to the gym or watch anime and read manga. Some of my favorite anime are Naruto, One Piece, Parasyte, and Fullmetal Alchemist: Brotherhood. I also enjoy going to the movies with my brother and my dad. Some of my favorite movies are Star Wars: The Empire Strikes Back, Batman the Dark Knight, Seven, and Despicable Me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"tvYf6Qr4NAaU01Zt9Ys8iCja5NFwkfk8R6EHpLtSoprI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne achievement I am really proud of is being awarded as an All-State Linebacker and Water polo player in my senior year of High School despite tearing my labrum in my hip.\u003c/p\u003e\u003cbr\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"73f76f71-f66b-4134-be4e-c97a8db902b6\"}"},{"__ref":"Favorites:{\"uuid\":\"0d2fbada-3d76-47b8-a7bf-9ccaa67c784a\"}"},{"__ref":"Favorites:{\"uuid\
