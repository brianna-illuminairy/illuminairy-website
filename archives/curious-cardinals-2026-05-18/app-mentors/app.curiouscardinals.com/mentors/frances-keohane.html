xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"57736165-e563-4b44-ab0e-b86b803fa379\"}":{"__typename":"Favorites","uuid":"57736165-e563-4b44-ab0e-b86b803fa379","photoUrl":"https://ucarecdn.com/440c3b97-8336-40c1-9ffb-f301ee756ca6/","title":"Tottenham Hotspur","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"168030a0-bb53-44ef-84eb-2293d27137c6\"}":{"__typename":"Favorites","uuid":"168030a0-bb53-44ef-84eb-2293d27137c6","photoUrl":"https://ucarecdn.com/5dfcae92-680c-4b1b-8099-57f5029770eb/","title":"Catan","type":"GAME"},"Favorites:{\"uuid\":\"5245c613-d707-4758-92f9-314b5727138a\"}":{"__typename":"Favorites","uuid":"5245c613-d707-4758-92f9-314b5727138a","photoUrl":"https://ucarecdn.com/e66bda94-fa77-4e8d-8f08-615db4356afc/","title":"Ocean's Eleven","type":"MOVIE"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"977514cc-ca2e-4594-aa1c-4c209d53a6a8\"}":{"__typename":"DeepDives","uuid":"977514cc-ca2e-4594-aa1c-4c209d53a6a8","content":"\u003cp\u003eRight after graduating college (May 2025), some friends and I traveled to Kings Canyon, Sequoia, and Yosemite National Parks to do some hiking and camping together before we all went our separate post-grad ways. About halfway through the trip, we managed to get permits to hike Half Dome: a 16-mile trail with an elevation gain of over 5,500ft, the pinnacle of which consists of a half-mile section in which hikers hoist themselves up the side of Half Dome via cables. While I have pretty extensive hiking experience, this challenge was a new and greater one, both physically and mentally. Our group woke up at 4am and was on the trail by 5. Though we had various ailments—two girls had hurt knees, one had mono and bronchitis, another had a slight ankle issue—we managed to, together, hike the 16 miles and summit Half Dome, cheering each other on all the while. Though I am incredibly proud of myself for the hike—not only for traveling 16 miles, but also for overcoming a fear of heights to ascend and descend the cables—I am most proud of our group for our camaraderie, grit, and determination. It is an experience I will never forget.\u0026nbsp;And, two days later, we did a 20-mile hike! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"b7d5143a-999b-4971-8a4c-bf3ec04359cd\"}":{"__typename":"DeepDives","uuid":"b7d5143a-999b-4971-8a4c-bf3ec04359cd","content":"\u003cbr\u003e\u003cp\u003eMy greatest role model is my maternal grandmother, Isabella . She helped raise me, and, to this day, I view her as not only a mentor and a maternal figure, but also a close confidant—even, at times, a friend. My grandmother grew up in Queens. She bears—and has imparted to her grandchildren—a deep love for New York City and for \u003cem\u003eNew Yorkers\u003c/em\u003e. Indeed, her care for the land and the people around her, for the neighbors she knows and has yet to meet, is striking, unique, and a quality I hope to emulate myself and encourage in others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy grandma did not receive a traditional college education, and the level of secondary schooling she enjoyed was far from that which she provided to her children and grandchildren. Yet, she is the wisest and most thoughtful person I know. Often citing her want of college experience, she encourages us to read, to be observant, to always engage with the people around us so that we might learn from them. Her understanding of learning as something ongoing and flexible—as something interpersonal that exists not only in, but also beyond, the classroom—has been an incredibly important tenet of my own life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5b566e17-6920-499f-8eeb-2668bf764634\"}":{"__typename":"DeepDives","uuid":"5b566e17-6920-499f-8eeb-2668bf764634","content":"\u003cp\u003eSince sophomore year of college, I have been a leader for Yale’s First-year Outdoor Orientation Trips (FOOT), 4-day backpacking trips for incoming freshmen across the northeastern seaboard. Although the trips themselves are exhilarating and enjoyable, I have found that it is the time beyond the trips—with the freshmen whom I have led and also with the community of FOOT leaders—that is most impactful. These trips foster a close relationship between FOOT leader and incoming student, a tie that, in its best form, blossoms into mentorship during the school year. When I was an incoming freshmen, I looked up to my FOOT leaders immensely; they guided me through my first few weeks of school, offering advice about classes to take, social spaces to explore, areas of campus to study in. Later in college, this mentor-mentee relationship drifted into a close friendship; I am still in touch with and look up to my FOOT leaders, and I credit much of my college success to their guidance.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the leadership position, I found that the mentor role was just as impactful and fruitful as had been the mentee one. I was able to give back: to help ease my freshmen into their first few weeks and months of college, to make them feel like they belonged. Some of my favorite experiences at college have been when one prior freshman invited me to his violin concert, or when I attended another one’s swim meet, or when I got a random text from a third asking for advice.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship matters because it fosters community; it encourages people—both mentors and mentees—to learn and grow with one another; it allows people to step out of their conform zone, to push themselves because they feel supported by someone who will catch them if they fall.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"33c3ae29-b16a-4ee6-af1a-1b9a7af57f89\"}":{"__typename":"DeepDives","uuid":"33c3ae29-b16a-4ee6-af1a-1b9a7af57f89","content":"\u003cp\u003eFor my senior history thesis, I wrote about a prison newspaper—\u003cem\u003eThe Interim\u003c/em\u003e—that was published in Nashville’s Tennessee State Penitentiary from 1976 through 1991. I managed to get in contact with one of the editors, who is still incarcerated in Tennessee. We wrote back and forth for months, chatting not just about the paper, but also about writing more broadly, about journalism, and about life in and beyond prison. In one of his letters, the former editor asked me, frankly, why and how I got interested in prison issues. It seems strange, he wrote, that someone from New York City and Yale should take interest in issues that are far from and do not affect her. He wrote that he was moved by my engagement.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my lifetime, I want to make as many people as I can feel seen,\u0026nbsp;looked after, and cared about. While it was heartbreaking to read that the editor was surprised that anyone cared, his words were only more fuel for me to pursue work that allows me to engage with and support the directly impacted—in my case, those behind bars across the United States.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"DeepDives:{\"uuid\":\"d36f3ed0-0f42-498e-ad37-62ed4dac19fa\"}":{"__typename":"DeepDives","uuid":"d36f3ed0-0f42-498e-ad37-62ed4dac19fa","content":"\u003cp\u003eRight after graduating college (May 2025), some friends and I traveled to Kings Canyon, Sequoia, and Yosemite National Parks to do some hiking and camping together before we all went our separate post-grad ways. About halfway through the trip, we managed to get permits to hike Half Dome: a 16-mile trail with an elevation gain of over 5,500ft, the pinnacle of which consists of a half-mile section in which hikers hoist themselves up the side of Half Dome via cables. While I have pretty extensive hiking experience, this challenge was a new and greater one, both physically and mentally. Our group woke up at 4am and was on the trail by 5. Though we had various ailments—two girls had hurt knees, one had mono and bronchitis, another had a slight ankle issue—we managed to, together, hike the 16 miles and summit Half Dome, cheering each other on all the while. Though I am incredibly proud of myself for the hike—not only for traveling 16 miles, but also for overcoming a fear of heights to ascend and descend the cables—I am most proud of our group for our camaraderie, grit, and determination. It is an experience I will never forget.\u0026nbsp;And, two days later, we did a 20-mile hike! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"DeepDives:{\"uuid\":\"aafc6387-5f2a-426b-946a-787e970d3a58\"}":{"__typename":"DeepDives","uuid":"aafc6387-5f2a-426b-946a-787e970d3a58","content":"\u003cbr\u003e\u003cp\u003eMy greatest ro "7f14dc7b-81d8-4dbf-a0ea-86373a1979e6\"}":{"__typename":"MentorPublicProfile","uuid":"7f14dc7b-81d8-4dbf-a0ea-86373a1979e6","displayName":"Frances K.","slug":"frances-keohane","biography":"\u003cp\u003eMy name is Frances, and I am a recent graduate from Yale University. Although born in New Haven, CT, I grew up in New York and consider myself a born-and-bred city gal. Despite my urban inclinations, however, I love the outdoors; I grew up hiking, backpacking, running, and spending as much time out of the house as possible. In college, I have led First-year Outdoor Orientation Trips, 4-day backpacking trips for incoming students. My favorite trip was to the White Mountains in New Hampshire.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy professional and academic interests are quite intertwined. A history major, I love learning about all time periods across different places. I also love political science, literature, and the humanities. My particular interest, however, lies in criminal justice and criminal justice reform — not only in the field of history, but also in those of political philosophy, political science, sociology, and, of course, law. When COVID-19 hit in the spring of my senior year of high school, I took a gap year before college and worked for PEN America’s Prison and Justice Writing Program, where I spent the year working with incarcerated writers around the United States and focusing on the pandemic behind bars. Next year, I am pursuing an Msc in Criminology and Criminal Justice at Oxford to continue this work and interest.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eExtracurricularly, my two main loves have been soccer and piano. I played defensive center midfield for both club and high school, and I have continued to play through college (on Yale’s club team). I supplement my field time with watching; I am an avid Tottenham Hotspur fan. Though I no longer play piano as seriously as I did through high school, I am still a big classical music fan. My favorite composers to listen to and play include Debussy, Beethoven, and Brahms. Beyond soccer and piano, I love running, baking, reading, writing, and playing various board and card games (including Catan and Hearts).\u003c/p\u003e","teachingVideoPlaybackId":"702XwlhxLCASc00oYf6Zl1XjhKmEqwV3HHJ7mO6lCOSm00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"57736165-e563-4b44-ab0e-b86b803fa379\"}"},{"__ref":"Favorites:{\"uuid\":\"168030a0-bb53-44ef-84eb-2293d27137c6\"}"},{"__ref":"Favorites:{\"uuid\":\"5245c613-d707-4758-92f9-314b5727138a\"}"}],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"977514cc-ca2e-4594-aa1c-4c209d53a6a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7d5143a-999b-4971-8a4c-bf3ec04359cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"5b566e17-6920-499f-8eeb-2668bf764634\"}"},{"__ref":"DeepDives:{\"uuid\":\"33c3ae29-b16a-4ee6-af1a-1b9a7af57f89\"}"},{"__ref":"DeepDives:{\"uuid\":\"d36f3ed0-0f42-498e-ad37-62ed4dac19fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"aafc6387-5f2a-426b-946a-787e970d3a58\"}"},{"__ref":"DeepDives:{\"uuid\":\"838d81e1-9fc7-4e46-b93d-7fa2f8c6ed6d\"}"},{"__ref":"DeepDives:{\"uuid\":\"e2060702-48b4-4797-ad23-45a14fa195dd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/394ed160-a869-4d2e-aa03-6998f8d1d4e1/-/preview/-/format/jpg/","https://ucarecdn.com/8c5b0d60-aa61-4406-89c8-8a872a973956/-/preview/-/format/jpg/","https://ucarecdn.com/c59de9de-f74d-4a5a-981c-280ed452edaf/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"44064163-2363-4da9-a12a-a574b133b47c\"}"},{"__ref":"Education:{\"uuid\":\"dc072458-9343-42d6-80c3-8b1c09f3b51a\"}"}],"hiredAt":"2025-05-26T09:58:06.976Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Writing","Academic Coaching","College Essay Writing","Reading","History","Executive Function","K-6 Storybook","Creative Writing","Music","History Project","Law / Governm
