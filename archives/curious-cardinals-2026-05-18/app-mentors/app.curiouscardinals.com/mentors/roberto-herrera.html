xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c75c176c-d0d4-4402-bb8e-4f8d7544e070\"}":{"__typename":"DeepDives","uuid":"c75c176c-d0d4-4402-bb8e-4f8d7544e070","content":"\u003cp\u003e\u003cstrong\u003eYour path doesn’t have to look like anyone else’s. \u003c/strong\u003eThere’s no “right” way to grow up or succeed. Life’s not linear. Your story will be uniquely yours—and that’s the best part.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b63ac1a0-5f4b-4361-89c8-4f3f6a9acddf\"}":{"__typename":"DeepDives","uuid":"b63ac1a0-5f4b-4361-89c8-4f3f6a9acddf","content":"\u003cp\u003e\u003cstrong\u003eMentorship is a two-way street.\u003c/strong\u003e Being a mentor sharpens your thinking, deepens your empathy, and often teaches the mentor more than expected. \u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"7bb489e7-b0b1-42df-8367-c4a42a56929c\"}":{"__typename":"DeepDives","uuid":"7bb489e7-b0b1-42df-8367-c4a42a56929c","content":"\u003cp\u003eIn high school, I was scrappy—I figured things out on my own and made stuff happen. I was pretty pushy too, always asking questions and challenging rules that didn’t make sense. And I was super curious, constantly poking around to see how things worked or how far I could go.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ea8abd34-6ca4-46f2-a65a-a3908c301403\"}":{"__typename":"DeepDives","uuid":"ea8abd34-6ca4-46f2-a65a-a3908c301403","content":"\u003cp\u003eIn my spare time, I love getting lost in a good book—it’s how I unwind and keep learning. I also play golf whenever I can; it’s my way of relaxing, challenging myself, and spending time outdoors. Reading keeps my mind sharp, and golf keeps me humble.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"7ecc43ad-777d-4d9c-8999-997e40751c21\"}":{"__typename":"School","uuid":"7ecc43ad-777d-4d9c-8999-997e40751c21","name":"Carol Morgan School","city":"Santo Domingo","type":"HIGH","state":"Distrito Nacional","country":"Dominican Republic","zip":"10903"},"Education:{\"uuid\":\"2d358b4b-02d8-45cf-910e-db1fcc05cf58\"}":{"__typename":"Education","uuid":"2d358b4b-02d8-45cf-910e-db1fcc05cf58","school":{"__ref":"School:{\"uuid\":\"7ecc43ad-777d-4d9c-8999-997e40751c21\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b1ce3f9c-8770-4a99-b8c8-ce4d7714122f\"}":{"__typename":"School","uuid":"b1ce3f9c-8770-4a99-b8c8-ce4d7714122f","name":"Purdue University","city":"West Lafayette","type":"COLLEGE","state":"Indiana","country":"United States","zip":"47907"},"Education:{\"uuid\":\"8268be26-bd15-480a-a00e-7ea7cddb32bf\"}":{"__typename":"Education","uuid":"8268be26-bd15-480a-a00e-7ea7cddb32bf","school":{"__ref":"School:{\"uuid\":\"b1ce3f9c-8770-4a99-b8c8-ce4d7714122f\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Industrial Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"66ee7fa1-a820-419b-907d-98742b76045a\"}":{"__typename":"MentorPublicProfile","uuid":"66ee7fa1-a820-419b-907d-98742b76045a","displayName":"Roberto H.","slug":"roberto-herrera","biography":"\u003cp\u003eHi there! My name is Roberto Herrera, and I recently graduated from Purdue University with a Bachelors of Science in Industrial Engineering, and with minors in Management and Finance through the Daniels School of Business. I was drawn to industrial engineering because it combines a strong technical foundation with incredible flexibility—it’s a discipline that allows you to optimize systems, solve real-world problems, and apply your skills across industries. That adaptability has guided my own journey, and I hope to inspire students to explore their own paths with curiosity and confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout college, I’ve gained experience across several industries, including aviation, manufacturing, consumer goods, and consulting. I’ve interned as a Quality Engineer at Textron Aviation, a Manufacturing Engineer at Procter \u0026amp; Gamble, and as a Summer Analyst at Accenture. Each role sharpened a different part of my skill set—from process improvement and systems thinking to communication, leadership, and working with cross-functional teams. Currently, I’m learning more about intellectual property as a Patent Intern at the Purdue Research Foundation, where I support technology commercialization and innovation transfer. In September I am starting my full time role as an Industry X Analyst in Accenture! I will be moving to a new city for the role at Accenture !\u003c/p\u003e\u003cp\u003e\u003cbr\u003eOutside of academics,  I served as the President of SHPE (Society of Hispanic Professional Engineers) at Purdue, where I led our chapter in providing mentorship, resources, and a supportive community for underrepresented students in STEM. This leadership role has been one of the most meaningful parts of my college experience—it’s taught me how to build up those around me while continuing to grow myself.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen it comes to mentoring, I start by listening. I’ve found that every student brings their own strengths, challenges, and learning style, so I take the time to understand where you’re at and how I can help you move forward. I get especially excited when working with students who are curious and motivated to grow their knowledge—whether it’s in engineering, college prep, professional development, or just building confidence. My goal is to help students realize that with consistency, support, and effort, they can accomplish more than they thought possible.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I enjoy golfing, reading, and watching YouTube! I’m also a certified Lean Six Sigma Green Belt and a certified sommelier—because I believe learning doesn’t have to stop at the classroom. If you’re someone who’s eager to grow, explore new ideas, and push your limits, I’d love to support your journey.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"o4RI4l6KO02BEL3iFeh9vze02ax00uWmsiYc8gZ4ttnNxk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Industrial Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c75c176c-d0d4-4402-bb8e-4f8d7544e070\"}"},{"__ref":"DeepDives:{\"uuid\":\"b63ac1a0-5f4b-4361-89c8-4f3f6a9acddf\"}"},{"__ref":"DeepDives:{\"uuid\":\"7bb489e7-b0b1-42df-8367-c4a42a56929c\"}"},{"__ref":"DeepDives:{\"uuid\":\"ea8abd34-6ca4-46f2-a65a-a3908c301403\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/679daa0e-c391-4b42-a872-19076a335106/-/preview/-/format/jpg/","https://ucarecdn.com/6
