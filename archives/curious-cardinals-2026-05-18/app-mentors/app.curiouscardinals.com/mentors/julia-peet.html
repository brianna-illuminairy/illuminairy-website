xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"05caf3e7-fe56-4f03-8398-62fc10b0d0ed\"}":{"__typename":"Favorites","uuid":"05caf3e7-fe56-4f03-8398-62fc10b0d0ed","photoUrl":"https://ucarecdn.com/42cc74b7-a388-4132-9907-4ab96976ce45/","title":"Chicago","type":"CITY"},"Favorites:{\"uuid\":\"b74e196f-280e-455e-8508-dd4a5136e4c3\"}":{"__typename":"Favorites","uuid":"b74e196f-280e-455e-8508-dd4a5136e4c3","photoUrl":"https://ucarecdn.com/dc7d97fb-69a9-49c0-b5bd-e1b3961ac653/","title":"Cubs","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ad3f735b-9a55-4ad8-99b0-8f7b624b8e9f\"}":{"__typename":"DeepDives","uuid":"ad3f735b-9a55-4ad8-99b0-8f7b624b8e9f","content":"\u003cp\u003eMy biggest advice to my middle and high school self would be DO WHAT YOU LOVE! Too many of my friends joined extracurriculars that they thought would look good to colleges, but found them uninteresting and a time-suck from things they were passionate about. I believe that following your interests is way more important and (bonus!) colleges think it is more interesting to see someone follow their passions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"23bc9599-0f9b-4c8b-9aee-628d07419fd4\"}":{"__typename":"DeepDives","uuid":"23bc9599-0f9b-4c8b-9aee-628d07419fd4","content":"\u003cp\u003eI have had close relationships with teachers throughout my time in school but I have never felt that I had a mentor-someone I can talk about anything with, not just academics. I am still looking for a mentor and in the meantime I want to act as one and give you a place to talk about your interests, things you find difficult, and things you want to learn more about!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"53f32e3d-df07-478d-a9ec-210bf58b16d8\"}":{"__typename":"DeepDives","uuid":"53f32e3d-df07-478d-a9ec-210bf58b16d8","content":"\u003cp\u003eI went into college thinking I would do the Ethics, Politics, and Economics major. I quickly realized that Economics wasn't for me, at the same time that the Art History class I was taking for fun became my favorite class. I wanted to hold onto the Political Science aspect of my original major while adding something more artistic and imaginative to my time at school, giving space for Art History to become my second major.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"8e44ad2f-9136-468d-9883-5149caa264b5\"}":{"__typename":"DeepDives","uuid":"8e44ad2f-9136-468d-9883-5149caa264b5","content":"\u003cp\u003eI went to the same school from Pre-K to 12th grade. There were 88 kids in my grade and I was never in a class of more than 17 students. This gave me the opportunity to have a very personal and tailored education. I want to bring this one-on-one teaching style to my mentees, allowing them to focus on what they specifically need help with or want to learn/work towards.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"0a41188a-405b-4f4f-9f61-6337a5cdc289\"}":{"__typename":"School","uuid":"0a41188a-405b-4f4f-9f61-6337a5cdc289","name":"Francis W. Parker School","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60614"},"Education:{\"uuid\":\"f93e9319-e1a2-4d1a-95bd-e3981b3b1c7e\"}":{"__typename":"Education","uuid":"f93e9319-e1a2-4d1a-95bd-e3981b3b1c7e","school":{"__ref":"School:{\"uuid\":\"0a41188a-405b-4f4f-9f61-6337a5cdc289\"}"},"startYear":"2010","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"552a971c-a3d8-4839-90ae-76b34c772598\"}":{"__typename":"Education","uuid":"552a971c-a3d8-4839-90ae-76b34c772598","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Political Science and Art History","degree":null},"MentorPublicProfile:{\"uuid\":\"d8f89d9f-bef2-4f68-84ff-101646f14fb3\"}":{"__typename":"MentorPublicProfile","uuid":"d8f89d9f-bef2-4f68-84ff-101646f14fb3","displayName":"Julia P.","slug":"julia-peet","biography":"\u003cp\u003eHi! My name is Julia and I am a First Year at Yale double-majoring in Political Science and Art History, and minoring in Spanish. I love school, especially my art history classes because they combine interesting visuals and information about the past. I am a fan of learning by doing- a textbook just doesn't do it for me. From Kahoots to detailed slideshows, and everything in between, I like to make learning fun. I know I don't always get everything right and it's 100% okay if you don't either. Sometimes I have to repeat something 10 times before I understand or memorize it. That's just part of the process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of the classroom I am a submission reviewer for The Yale Review (I vet submissions for the country's oldest literary magazine), I am part of The Women's Network (which brings in incredible female speakers and teaches members about networking!), and am a member of the Club Ski Team (I love the outdoors!). \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school I was the Editor in Chief of the Yearbook and part of the Model UN team so I am familiar with all kinds of online programs and debate terminology-more than I probably need. A highlight of my high school experience was taking on two independent studies, one in Climate Change Policy and one in Art History. For the first one I had to opportunity to go to the United Nations COP Conference in Egypt where I acted as a sponge to learn as much as I could about how people worldwide are tackling climate change. It was incredible rewarding to hear from people in-person instead of in books or articles. For my art history independent study I got to spend a lot, and I mean a lot, of time at the Chicago Art Institute where I enjoyed many famous paintings and got to know the galleries like the back of my hand.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am from Chicago and love the sights, sounds, and FOOD of the city, but I'm just as comfortable climbing a mountain or taking the hook out of a fishes mouth. I am a die-hard Chicago Cubs and Bears fan, and am continuously disappointed, and enjoy watching tennis, soccer, and more! You will almost always find me listening to music- from Zach Bryan to Gracie Abrams to J. Cole, I'm a fan of all genres (and can't do homework about it).\u003c/p\u003e","teachingVideoPlaybackId":"kz5mYVZHBIMFeQzcy6L901r1900NorQfGcFS86mYhkp3k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"05caf3e7-fe56-4f03-8398-62fc10b0d0ed\"}"},{"__ref":"Favorites:{\"uuid\":\"b74e196f-280e-455e-8508-dd4a5136e4c3\"}"}],"causesSupported":[],"major":"Political Science and Art History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ad3f735b-9a55-4ad8-99b0-8f7b624b8e9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"23bc9599-0f9b-4c8b-9aee-628d07419fd4\"}"},{"__ref":"DeepDives:{\"uuid\":\"53f32e3d-df07-478d-a9ec-210bf58b16d8\"}"},{"__ref":"DeepDives:{\"uuid\":\"8e44ad2f-9136-468d-9883-5149caa264b5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0a63c671-31ca-420c-8c75-9e0f4de13f85/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f93e9319-e1a2-4d1a-95bd-e3981b3b1c7e\"}"},{"__ref":"Education:{\"uuid\":\"552a971c-a3d8-4839-90ae-76b34c772598\"}"}],"hiredAt":"2025-03-26T01:04:01.081Z","topics":["K-5 Grade Math","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","History Project","Video / Photography","Business / Entrepreneurship","Web Design","Machine Learning / AI","Law / Government / Policy","Sustainability","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"julia-peet\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d8f89d9f-bef2-4f68-84ff-101646f14fb3\"}"}}},"_sentryTraceData":"1ab4292a0fe34e0e899db9f7d2d541f8-8d0ca31519293912-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1ab4292a0fe34e0e8
