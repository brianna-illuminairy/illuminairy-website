xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"1ce676f3-b061-4e51-a8c1-7c5660f6b6e6\"}":{"__typename":"DeepDives","uuid":"1ce676f3-b061-4e51-a8c1-7c5660f6b6e6","content":"\u003cp\u003eI was the student who was always running around doing something. If I was not at school building some machine with my science olympiad team or painting posters for student government, I was at orchestra practice playing my cello or in my room making a rug. I loved to learn all different crafts and skills, so whenever people asked how I was doing, I would often respond with an update with yet another project. Even now in college, my apartment always is smelling like freshly baked bread or the bitter wafts of my acrylic paints. I always wanted to keep life interesting and lively. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"56e877b7-e03d-41db-a2c8-c24333da9876\"}":{"__typename":"DeepDives","uuid":"56e877b7-e03d-41db-a2c8-c24333da9876","content":"\u003cp\u003eI would give anyone the advice to just try. I think failure is terrifying for a lot of people, myself included, but you will never know how much you can succeed if you don't fail a few times. I am proud to say that I have failed in my life; I broke my arm once trying to do a cool trick on my bike or I got rejected from a science camp in high school. But, my arm healed and I happily attended a different research camp. Failure is inevitable, so I would want to keep reminding my younger self not to let failure bring me down too much because each failure only brings me closer to success. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"d1791e48-b1c9-4d8b-8a05-4ee704fb55bd\"}":{"__typename":"DeepDives","uuid":"d1791e48-b1c9-4d8b-8a05-4ee704fb55bd","content":"\u003cp\u003eI come from La Habra, California, which is a melting pot of different cultures. Lots of families have migrated from all over, my family included. My parents originally come from South Korea and I am very proud of my heritage. Being from such a diverse and vibrant background, I know that every student comes with a unique story. Everyone comes from a different cultural or educational background. I acknowledge this and tailor my lessons to fit each student. Everyone learns differently and relates to the lessons differently. I want to ensure that every student feels welcome to be themselves and ask whatever questions they want. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"ea454828-ec80-4cd1-adbd-7eac52f2703d\"}":{"__typename":"Education","uuid":"ea454828-ec80-4cd1-adbd-7eac52f2703d","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Sociology","degree":"Bachelor's of Arts"},"School:{\"uuid\":\"2dea79ea-d07a-4073-9220-720878d9e326\"}":{"__typename":"School","uuid":"2dea79ea-d07a-4073-9220-720878d9e326","name":"Sonora High School","city":"La Habra","type":"HIGH","state":"California","country":"United States","zip":"90631"},"Education:{\"uuid\":\"ecf85596-49b8-433e-9017-ed6ec81a56ab\"}":{"__typename":"Education","uuid":"ecf85596-49b8-433e-9017-ed6ec81a56ab","school":{"__ref":"School:{\"uuid\":\"2dea79ea-d07a-4073-9220-720878d9e326\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ab9e3e90-b736-40ac-bef8-cb317ddd5741\"}":{"__typename":"MentorPublicProfile","uuid":"ab9e3e90-b736-40ac-bef8-cb317ddd5741","displayName":"Ellen H.","slug":"ellen-hwang","biography":"\u003cp\u003eEllen is a senior premed student at Harvard University majoring in sociology with a minor in French. She originally hails from sunny Southern California where she can see the nightly fireworks of Disneyland from her backyard. Ever since she was young, Ellen immersed herself in the arts, whether it be playing her instruments (cello and piano), acrylic painting or pottery! In high school, Ellen stayed active in her school by being the publicist of her student government as well as being the Communications Officer in her Army JROTC program; outside of her campus, she volunteered weekly at a local hospital clinic and played in a youth orchestra. Continuing on her artistic journey in college, Ellen was involved with the Harvard Project International Relations as their Director of Design and Multimedia, creating social media graphics, and merchandise as well as streaming and recording fireside chats and executive seminars for thousands of international delegates. She currently is involved with multiple international diplomacy clubs like Harvard World Model UN, Hacia Democracy, and Harvard National Model United Nations where she not only chairs committees but plans the logistics and administrative details of the conferences. Over this past summer, Ellen was conducting research for the Albert Einstein Institution. Ellen grew up with a myriad of eclectic hobbies, constantly staying busy and learning more. She hopes she can spark a passion for being a jack of all trades!\u003c/p\u003e","teachingVideoPlaybackId":"YQ8YhOoqlN1tBlKrqj2OM4MdKs8reBFa5C4ysu02WIIY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1ce676f3-b061-4e51-a8c1-7c5660f6b6e6\"}"},{"__ref":"DeepDives:{\"uuid\":\"56e877b7-e03d-41db-a2c8-c24333da9876\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1791e48-b1c9-4d8b-8a05-4ee704fb55bd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c2a04fc8-58a4-4d63-9722-8d10696fa27c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ea454828-ec80-4cd1-adbd-7eac52f2703d\"}"},{"__ref":"Education:{\"uuid\":\"ecf85596-49b8-433e-9017-ed6ec81a56ab\"}"}],"hiredAt":"2022-10-18T20:01:19.000Z","topics":["Algebra I","Philosophy","Race \u0026 Ethnicity","Video / Photography","Calculus","Public Speaking","Women \u0026 Gender Studies","Pre-Algebra","World Cultures","History Project","Cooking","History","Algebra II","6-8 Grade Science","Fashion / Cosmetics","Visual Arts / Graphic Design","Precalculus / Trigonometry","Biology","Film / Theater","STEM Project","K-5 Grade Math","Global Health","Literature","Writing","Geometry","Journalism","Sustainability","Music"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ellen-h
