xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1fb4bfd7-3221-4fd4-bcaa-e7910b45575e\"}":{"__typename":"DeepDives","uuid":"1fb4bfd7-3221-4fd4-bcaa-e7910b45575e","content":"\u003cp\u003eYou're not lazy. You just haven't found work that hits the same way as video games yet. Figure out what actually hooks you about games, because that same thing is what your future work needs to have.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"72c73844-50e1-4bcc-ae15-79441758947f\"}":{"__typename":"DeepDives","uuid":"72c73844-50e1-4bcc-ae15-79441758947f","content":"\u003cp\u003eI love 3D printing stuff for my friends and family, watching anime, and playing video games (shoutout Brawl Stars)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"60d6b4f6-6568-4547-a7fd-486ea8acb1a9\"}":{"__typename":"DeepDives","uuid":"60d6b4f6-6568-4547-a7fd-486ea8acb1a9","content":"\u003cp\u003eMentorship matters to me because it allows for a student to progress at their own pace. I always felt that the way public education was designed never really worked for me, and I want to provide a better alternative for the future generation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6832e825-f4e9-4cef-9508-26333e5ff690\"}":{"__typename":"DeepDives","uuid":"6832e825-f4e9-4cef-9508-26333e5ff690","content":"\u003cp\u003eI chose information science because it allows me to study software with a focus on application. Not every school has this major, but it focuses on what I love most about coding: the impact. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"c641b950-e48e-4651-bab8-73e47c67759d\"}":{"__typename":"School","uuid":"c641b950-e48e-4651-bab8-73e47c67759d","name":"Jericho High School","city":"Jericho","type":"HIGH","state":"New York","country":"United States","zip":"11753"},"Education:{\"uuid\":\"1bf4e919-f65a-4d86-8b47-7b4096d7b0f1\"}":{"__typename":"Education","uuid":"1bf4e919-f65a-4d86-8b47-7b4096d7b0f1","school":{"__ref":"School:{\"uuid\":\"c641b950-e48e-4651-bab8-73e47c67759d\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"059eee63-03bd-4e73-b69b-e3c439493874\"}":{"__typename":"Education","uuid":"059eee63-03bd-4e73-b69b-e3c439493874","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2028","major":"Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"c645b3ff-7be9-4008-850e-fdfad4b883da\"}":{"__typename":"MentorPublicProfile","uuid":"c645b3ff-7be9-4008-850e-fdfad4b883da","displayName":"william c.","slug":"william-chen","biography":"\u003cp\u003eHi, I'm William Chen, a second-year Information Science student at Cornell University, and I love building things, whether that's a tool that saves my parents hours of work every day, a 3D printing business, or just a fun desktop pet app I made for myself.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy journey started when I automated my parents' wholesale invoicing process using Python. That project made me realize how much I loved coding: not only is it fun, but it also allowed my parents to come home an hour earlier everyday. Since then I've gone in a lot of directions:\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eRunning an eBay reselling business that transitioned to a 3D printing shop that's generated over $5K in revenue (ebay store: https://www.ebay.com/usr/plastic_love_shop)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding software that uses AI to automatically research and list new products for my 3D printing store, so I can add inventory without lifting a finger. Check out this project and others on my website! ( wchen.site )\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStreaming games on Twitch, running a YouTube channel, and doing video editing and graphic design for school clubs. That last part stuck with me more than I expected. I don't do graphic design the same way anymore, but the eye I developed for layout, color, and visual hierarchy carried over directly into web design. It's part of what helped me land a role at Cornell DTI, a product and design club where roughly one in a hundred applicants gets in. (Media Portfolio: https://www.behance.net/gallery/217031915/William-Chens-Media-Portfolio)\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThat was me not too long ago. I had no idea I could start a business from a 3D printer, build software people actually use every day, or that messing around in Photoshop for a club would eventually shape how I think about designing for the web. Most students don't know what they're capable of until someone shows them what's possible, and the best way I've seen that happen is through actually building something.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis is why I want to help students find their thing through project-based learning instead of boring lectures. Whether you want to launch a YouTube channel, start a 3D printing side hustle, build your first website, or just find something that makes you excited to open your laptop, I want to help you find that spark. You don't need a plan. You just need a starting point.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"l7FS2oxRaZGAHjaffKXh8Ygf02cUw7PSayadSU9VsdwU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1fb4bfd7-3221-4fd4-bcaa-e7910b45575e\"}"},{"__ref":"DeepDives:{\"uuid\":\"72c73844-50e1-4bcc-ae15-79441758947f\"}"},{"__ref":"DeepDives:{\"uuid\":\"60d6b4f6-6568-4547-a7fd-486ea8acb1a9\"}"},{"__ref":"DeepDives:{\"uuid\":\"6832e825-f4e9-4cef-9508-26333e5ff690\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2d0c8bdc-def9-445c-8bfd-702774a30d92/-/preview/-/format/jpg/","https://ucarecdn.com/26363748-9e7e-4926-92df-b6c0aadfe596/-/preview/-/format/jpg/","https://ucarecdn.com/71bc95ba-fea0-4b78-a936-e2f1e0349dd9/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1bf4e919-f65a-4d86-8b47-7b4096d7b0f1\"}"},{"__ref":"Education:{\"uuid\":\"059eee63-03bd-4e73-b69b-e3c439493874\"}"}],"hired
