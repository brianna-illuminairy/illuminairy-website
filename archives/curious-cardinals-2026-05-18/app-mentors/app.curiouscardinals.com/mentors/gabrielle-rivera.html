xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"643f84a2-9726-4411-8145-43541b116b17\"}":{"__typename":"Favorites","uuid":"643f84a2-9726-4411-8145-43541b116b17","photoUrl":"https://ucarecdn.com/0581aba8-5ea7-4619-a8c8-f9292a1e4241/","title":"Hairspray","type":"PLAY"},"Favorites:{\"uuid\":\"a3d4d483-89a8-40b5-a7c4-d3fdbb3efba0\"}":{"__typename":"Favorites","uuid":"a3d4d483-89a8-40b5-a7c4-d3fdbb3efba0","photoUrl":"https://ucarecdn.com/15c8cdcc-6262-4d16-9ecf-87f09249ffb4/","title":"The Time Machine","type":"BOOK"},"Favorites:{\"uuid\":\"d5be7a70-ae76-410f-b7e9-b4eb7c505152\"}":{"__typename":"Favorites","uuid":"d5be7a70-ae76-410f-b7e9-b4eb7c505152","photoUrl":"https://ucarecdn.com/188b8256-b303-43b2-8042-72c5bd39cf92/","title":"Volleyball \u0026 Golf","type":"SPORT"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"cd8ca13f-0c78-4ec9-b390-30c7b9627128\"}":{"__typename":"DeepDives","uuid":"cd8ca13f-0c78-4ec9-b390-30c7b9627128","content":"\u003cp\u003eKeep pushing yourself, hard work really does pay off. And don't worry so much about trying to \"fit in,\" quirkiness is cute and you will make the greatest friends by just being uniquely you! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"beee8637-2d3c-4cbe-97dd-eca34e92bab2\"}":{"__typename":"DeepDives","uuid":"beee8637-2d3c-4cbe-97dd-eca34e92bab2","content":"\u003cblockquote\u003e\u003cp\u003eMentorship matters deeply to me because I know firsthand how transformative a truly supportive mentor can be. As a student, I often struggled to find guidance, and navigating unfamiliar paths without that support can feel isolating and overwhelming. Having someone who has already walked that road, learned from challenges, and is willing to share those lessons is invaluable. If I can be that person for even one student to offer guidance, encouragement, and reassurance, that is incredibly meaningful and rewarding to me.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"af28d44c-7e7a-415d-9cd3-362a7e911393\"}":{"__typename":"DeepDives","uuid":"af28d44c-7e7a-415d-9cd3-362a7e911393","content":"\u003cblockquote\u003e\u003cp\u003eMy dream job is to pursue meaningful scientific questions about how biological systems develop and function, with a focus on translating that understanding into real-world impact. I envision running my own research lab or studying human health in space at NASA, and I’m particularly drawn to work that could help prevent or treat diseases before birth. Ultimately, I want a career centered on discovery, innovation, and pushing the boundaries of what’s possible in human health.\u003c/p\u003e\u003c/blockquote\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"fea12e0d-b52c-4b87-a05c-a9a62d26c74c\"}":{"__typename":"DeepDives","uuid":"fea12e0d-b52c-4b87-a05c-a9a62d26c74c","content":"\u003cblockquote\u003e\u003cp\u003eSomething that isn’t obvious right away about me is that I spent much of my early life and teen years managing a chronic illness. Living with it required me to grow up quickly, adapt constantly, and advocate for myself in ways many people never have to. It shaped how I approach challenges—with resilience, patience, and empathy—and sparked my curiosity about the human body. That experience continues to influence how I think about science, health, and the kind of impact I want my work to have.\u003c/p\u003e\u003c/blockquote\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"9ed6df2d-da6f-42df-a876-11bb80a36e5b\"}":{"__typename":"School","uuid":"9ed6df2d-da6f-42df-a876-11bb80a36e5b","name":"School of the Holy Child","city":"Rye","type":"HIGH","state":"New York","country":"United States","zip":"10580"},"Education:{\"uuid\":\"60e7843d-ae14-42a9-b064-b79c5394e09e\"}":{"__typename":"Education","uuid":"60e7843d-ae14-42a9-b064-b79c5394e09e","school":{"__ref":"School:{\"uuid\":\"9ed6df2d-da6f-42df-a876-11bb80a36e5b\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}":{"__typename":"School","uuid":"67d96877-4245-4f9b-a557-94f9ecabd290","name":"Barnard College","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"1133bf2a-20cb-4f18-b505-e9719b2a5285\"}":{"__typename":"Education","uuid":"1133bf2a-20cb-4f18-b505-e9719b2a5285","school":{"__ref":"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Biochemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"603db158-d591-4f10-bb30-6d7720be1db9\"}":{"__typename":"MentorPublicProfile","uuid":"603db158-d591-4f10-bb30-6d7720be1db9","displayName":"Gabrielle R.","slug":"gabrielle-rivera","biography":"\u003cp\u003eHi, I'm Gabrielle! I'm a scientist, mentor, and lifelong learner who believes curiosity is the foundation of meaningful education. I care deeply about helping students feel supported and empowered in their learning, especially those who are still discovering their interests or building confidence in academic settings. My goal as a mentor is to create a space where students feel comfortable asking questions and making mistakes, exploring new ideas, and growing at their own pace. There is nothing more rewarding to me than helping a student have an \"a-ha\" moment!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI studied biochemistry at Barnard College of Columbia University, and earned a master’s degree in biomedical engineering from Columbia Engineering. During my academic training, I also worked on rocket engineering projects, helping design and build experimental payloads for high-altitude and aerospace research. These experiences strengthened my love for interdisciplinary problem-solving and showed me how creativity, engineering, and science come together to answer big questions. I am currently preparing to apply to PhD programs, with the goal of continuing research at the intersection of biology, engineering, and discovery.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I work as a scientist in the biotechnology industry, collaborating with interdisciplinary teams to solve complex biological problems. This work has reinforced my belief that learning is not about memorization, but about curiosity, persistence, and creative thinking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also have extensive tutoring experience across a wide range of subjects and age groups. At the college level, I have tutored Ordinary Differential Equations, Probability, and General Chemistry I and II. I have also developed and tailored individualized curricula for younger students in Physics, Biology, Latin, Chemistry, Geometry, and Algebra I, adapting lessons to different learning styles and academic goals. In addition to tutoring, I have mentored high school students through the process of securing research internships and preparing college applications, supporting them with academic planning, application strategy, and building confidence in presenting their interests and experiences. I have served as a Matriculate advisor, a mentor with the Columbia Space Initiative, and a mentor with Research Girl, Inc., and I currently work as a scientist with the Letters to a Pre-Scientist outreach program, supporting students as they explore pathways into STEM.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my academic and professional work, I enjoy baking, golfing, and reading. I even have my own home bakery, The Biomed Baker, where I combine my love for science with my cake-making skills! I love Pilates and cycling, and believe that exercise is medicine. I enjoy watching sci-fi film and television and going to the movies! I also play the piano.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I strive to meet students where they are and adapt to different learning styles, creating a warm, encouraging environment where curiosity is celebrated. As someone who found incredible mentors, I know I wouldn't be where I am today without them. I hope to carry on their work and be that mentor for someone else! I’m excited to be part of the Curious Cardinals community and look forward to supporting students as they grow in confidence and a genuine love of learning!\u003c/p\u003e","teachingVideoPlaybackId":"sT88MP9idjajgWBBA7PhgbYWCtLf6LCsFvHREq02sgNI","teachingVideoDescription":null,"greatestAchievement":"\u003cblockquote\u003e\u003cp\u003eBeing part of the first-ever student-led rocketry team at Columbia University to successfully launch a rocket!\u003c/p\u003e\u003c/blockquote\u003e\u003cbr\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"643f84a2-9726-4411-8145-43541b116b17\"}"},{"__ref":"Favorites:{\"uuid\":\"a3d4d483-89a8-40b5-a7c4-d3fdbb3efba0\"}"},{"__ref":"Favorites:{\"uuid\":\"d5be7a70-ae76-410f-b7e9-b4eb7c505152\"}"}],"causesSupported":[],"major":"Biochemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cd8ca13f-0c78-4ec9-b390-30c7b9627128\"}"},{"__ref":"DeepDives:{\"uuid\":\"beee8637-2d3c-4cbe-97dd-eca34e92bab2\"}"},{"__ref":"DeepDives:{\"uuid\":\"af28d44c-7e7a-415d-9cd3-362a7e911393\"}"},{"__ref":"DeepDives:{\"uuid\":\"fea12e0d-b52c-4b87-a05c-a9a62d26c74c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4df9ec63-3f88-444c-b98d-c4d59dfddf8a/-/preview/-/format/jpg/","https://ucarecdn.com/80423091-d4e7-46c0-aff0-a31b6bc366f9/-/preview/-/format/jpg/","https://ucarecdn.com/bb781dce-dc5c-4788-9019-7a6c4bd600cb/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"60e7843d-ae14-42a9-b064-b79c5394e09e\"}"},{"__ref":"Education:{\"uuid\":\"1133bf2a-20cb-4f18-b505-e9719b2a5285\"}"}],"hiredAt":"2025-12-14T21:37:12.518Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Latin","Academic Coaching","Executive Function","College Essay Writing","Reading","K-6 Storybook","Creative Writing","Medicine / Health","STEM Project","Aviation / Aerospace","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/9f7019f6-5b03-4f9f-a136-5aeaf2c62de6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gabrielle-rivera\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"603db158-d591-4f10-bb30-6d7720be1db9\"
