xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5c5f4f57-8d2c-4e2c-93bf-cdb70188b88d\"}":{"__typename":"Favorites","uuid":"5c5f4f57-8d2c-4e2c-93bf-cdb70188b88d","photoUrl":"https://ucarecdn.com/58e6d6f6-704c-4db5-bd96-a7b511f80bb9/","title":"Ladybird","type":"MOVIE"},"Favorites:{\"uuid\":\"e55438db-c919-43b6-b395-b0defd4dcecd\"}":{"__typename":"Favorites","uuid":"e55438db-c919-43b6-b395-b0defd4dcecd","photoUrl":"https://ucarecdn.com/78dc9524-b39f-4df5-a04b-9c057b3a1046/","title":"Dublin, Ireland","type":"CITY"},"Favorites:{\"uuid\":\"6989de4a-05f6-409d-bef4-e6f4384f451b\"}":{"__typename":"Favorites","uuid":"6989de4a-05f6-409d-bef4-e6f4384f451b","photoUrl":"https://ucarecdn.com/3d9570c3-3a58-4848-9059-025c5d50713e/","title":"Dragon New Warm Mountain I Believe in You, by Big Thief","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2f9c2e5a-ae75-457a-843b-5f66db0492ba\"}":{"__typename":"DeepDives","uuid":"2f9c2e5a-ae75-457a-843b-5f66db0492ba","content":"\u003cp\u003eDon't be afraid to ask questions or pursue things that challenge you! I was often stressed about the outcomes of my academic and extracurricular pursuits, which led to a fear of taking risks and admitting vulnerability. In college, my coaches, professors, and mentors have helped me find value in the \u003cem\u003eprocess\u003c/em\u003e of learning, not only in the results. I have always been a curious, adventurous person, and I wish that I had allowed myself to follow my whims and find joy in challenging moments as a younger student.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"243660e6-40cd-4df7-ae22-d466fa973ec8\"}":{"__typename":"DeepDives","uuid":"243660e6-40cd-4df7-ae22-d466fa973ec8","content":"\u003cp\u003eA high school English teacher and cross country and track coach! I am so excited to spend the rest of my life sharing the things I love with other people. I know from firsthand experience that teachers and coaches can change lives on the daily. I love the idea of combining these two roles in order to practice different forms of mentorship and help students reach their full potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"2e3d6afa-a248-4be2-abcd-34ab23330e64\"}":{"__typename":"DeepDives","uuid":"2e3d6afa-a248-4be2-abcd-34ab23330e64","content":"\u003cp\u003eAn original collection of poetry. I spend one hour every day writing. Sometimes it is productive and sometimes less so, sometimes it happens very early in the morning or late at night. I don't always want to do it, but my mentors have instilled in me the importance of self-accountability and building a daily practice if I want writing to be a serious part of my life. I love that this allows me to draw on skills I have developed as an athlete: patience, endurance, and discipline. Hopefully someday it will be out in the world!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"9c84dd12-5f7f-46c0-a7b1-4ddf88c1be48\"}":{"__typename":"DeepDives","uuid":"9c84dd12-5f7f-46c0-a7b1-4ddf88c1be48","content":"\u003cp\u003eI have worked on a variety of organic farms! My favorite was a small, no-kill goat dairy. I was lucky enough to be there during kidding season and got to assist some of the mother goats during their births. It was my responsibility to care for the newborn goat kids right after they were born, which included drying them off with hair dryers and dressing them in little sweaters. This was as cute as it sounds! Farming is very hard and rewarding work, and I am so grateful for all that I have learned from the strong, passionate farmers I have been lucky enough to work with.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"961a6ecb-b214-4fe6-b99b-4275b44e6bf8\"}":{"__typename":"School","uuid":"961a6ecb-b214-4fe6-b99b-4275b44e6bf8","name":"Amherst-Pelham Regional High School","city":"Amherst","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01002"},"Education:{\"uuid\":\"25cf5cc7-0875-4425-93c9-028d0b13e427\"}":{"__typename":"Education","uuid":"25cf5cc7-0875-4425-93c9-028d0b13e427","school":{"__ref":"School:{\"uuid\":\"961a6ecb-b214-4fe6-b99b-4275b44e6bf8\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b63e4cda-0471-4074-8eee-9c99086df8cb\"}":{"__typename":"School","uuid":"b63e4cda-0471-4074-8eee-9c99086df8cb","name":"Williams College","city":"Williamstown","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"01267"},"Education:{\"uuid\":\"7f98d9e3-72bd-400b-a4c3-64f1f68b41a1\"}":{"__typename":"Education","uuid":"7f98d9e3-72bd-400b-a4c3-64f1f68b41a1","school":{"__ref":"School:{\"uuid\":\"b63e4cda-0471-4074-8eee-9c99086df8cb\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"d88c3fcd-efa3-43d1-bbed-75cdab073019\"}":{"__typename":"MentorPublicProfile","uuid":"d88c3fcd-efa3-43d1-bbed-75cdab073019","displayName":"Charlotte S.","slug":"charlotte-staudenmayer","biography":"\u003cp\u003eHello! I studied English at Williams College, and I am very passionate about both literature and creative writing (fiction and poetry). I have always loved to read and write, and these things are most meaningful to me when I get to discuss them with other people. Being an English major has been immensely valuable in helping me develop skills such as critical thinking and clear writing, and it has also made my world a much more interesting and vibrant place.\u003c/p\u003e\u003cp\u003eAfter graduation, I plan to pursue a career teaching high school English in hopes of helping others find the value in engaging seriously with literature. I have spent the past two summers assistant teaching English classes, including a college essay workshop, at a pre-college summer program for high-achieving high school students, an experience which has completely affirmed my love for teaching. I have had the opportunity to read fiction and poetry in multiple reading series. I have published non-fiction writing in a variety of newspapers and online platforms, and I am currently in the process of publishing some of my poetry in literary journals. Recently, I had the exciting opportunity to interview elite female runners who had qualified for the U.S. Olympic Marathon Trials and wrote a series of articles for a popular online running publication. Across all of my writing experiences, I have developed a passion for work that is community-facing with a tangible impact, especially that which allows me to use my writing to engage with my other passions and meet inspiring people.\u003c/p\u003e\u003cp\u003eOutside of the classroom, I am a captain of the cross country team and a member of the track team, host a radio show, and work for my school’s sustainability office. Being a student-athlete has helped me cultivate important time management skills and find a healthy balance in college. I strongly believes that my academic pursuits have made me a better athlete and vice versa. I love listening to and discussing music as much as books, and my radio show has been a wonderful creative outlet for me. One of the most important things my English major has taught me is how essential it is to make space for engaging with the arts, and I am always looking for ways to put this into practice in my daily life and community. I also enjoy all outdoor activities, and love that my campus job allows me to connect with environmental initiatives on campus. In my free time, I love to spend time with my friends and family, hike, cook, and, of course, read, everything from old poetry to small literary magazines to contemporary literary criticism.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"1PTtfGrIfNNzyhkusm027BFwaHMiCLhSI1YhJ01cGa4OE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003ePlacing third at the National Championship meet with my cross country team! We went in as underdogs: we weren't even ranked in the top 10 until very late in the season, but we all believed in each other and knew we could do something special on the day. Even more than the results of the race, I am proud of the fact that we accomplished this feat through building an inclusive, supportive culture. Cross country is a grueling sport, but the sense of camaraderie that it builds is unmatched. My team found success through making the process fun and building each other up rather than tearing each other down.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5c5f4f57-8d2c-4e2c-93bf-cdb70188b88d\"}"},{"__ref":"Favorites:{\"uuid\":\"e55438db-c919-43b6-b395-b0defd4dcecd\"}"},{"__ref":"Favorites:{\"uuid\":\"6989de4a-05f6-409d-bef4-e6f4384f451b\"}"}],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2f9c2e5a-ae75-457a-843b-5f66db0492ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"243660e6-40cd-4df7-ae22-d466fa973ec8\"}"},{"__ref":"DeepDives:{\"uuid\":\"2e3d6afa-a248-4be2-abcd-34ab23330e64\"}"},{"__ref":"DeepDives:{\"uuid\":\"9c84dd12-5f7f-46c0-a7b1-4ddf88c1be48\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ba546939-dfba-43f0-a686-eb6473fcf2be/-/preview/-/format/jpg/","https://ucarecdn.com/f886d94d-9e55-4f67-8f53-7a261dab805f/-/preview/-/format/jpg/","https://ucarecdn.com/d73f18d5-9e61-4ade-941b-8423dc22ec2f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"25cf5cc7-0875-4425-93c9-028d0b13e427\"}"},{"__ref":"Education:{\"uuid\":\"7f98d9e3-72bd-400b-a4c3-64f1f68b41a1\"}"}],"hiredAt":"2025-09-13T02:10:54.625Z","topics":["Writing","College Essay Writing","Reading"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"charlotte-staudenmayer\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d88c3fcd-efa3-43d1-bbed-75cdab073019\"}"}}},"_sentryTraceData":"3b39e54ef7984e2b87588f8f73563c42-aaa3ae708f0379c6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3b39e54ef7984e2b87588f8f73563c42,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"charlotte-staudenmayer"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (fun
