xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"18db07b3-a915-4acc-b2b3-d9d8756c0256\"}":{"__typename":"DeepDives","uuid":"18db07b3-a915-4acc-b2b3-d9d8756c0256","content":"\u003cp\u003eI would remind myself that neither my age nor inexperience matters. If I had an idea for a website, product, or company, I could bring that idea to life regardless of my age, provided I had a solid action plan. If I were not well-versed in an advanced topic, I could still learn about it, regardless of my age or prior knowledge. The world offers countless opportunities, and I shouldn't impose limits on myself, especially when many people do not adhere to such constraints.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e6bd1f48-29ee-44d7-8ce1-033e7444b2b1\"}":{"__typename":"DeepDives","uuid":"e6bd1f48-29ee-44d7-8ce1-033e7444b2b1","content":"\u003cp\u003eMentorship holds immense importance to me due to the firsthand observation of its significant impact on one's career. Growing up with limited resources, I had no mentors and received minimal support throughout my education. As a result, when applying to college, preparing for the SAT, and striving to create meaningful projects, I faced these challenges on my own, without any guidance. Although I managed to achieve considerable success independently, my situation dramatically improved upon my arrival at Duke, where I found consistent mentorship and support. This invaluable guidance has empowered me to achieve far more in my professional career than I could have alone, as was the case during my high school years.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"da39de07-11d9-4fda-b2cf-b5c4529f23e0\"}":{"__typename":"DeepDives","uuid":"da39de07-11d9-4fda-b2cf-b5c4529f23e0","content":"\u003cp\u003eI chose my major because I want options and job security when I graduate. Shortly after beginning my studies at Duke, I discovered the immense value and versatility of an engineering degree, a realization that equally applied to a computer science degree. These fields equip me with a broad range of technical skills that are otherwise challenging to acquire. If I require additional skills for fields like business or finance, I can turn to books as a resource, allowing me to learn these skills much more quickly and cost-effectively.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"7d2997cf-d440-46c6-ae42-14afe781c4da\"}":{"__typename":"DeepDives","uuid":"7d2997cf-d440-46c6-ae42-14afe781c4da","content":"\u003cp\u003eI am currently working on a project to develop an app aimed at enhancing the sense of connectivity often sought in social media platforms. This project serves as a practical learning experience for foundational computer science skills in app and software development. I plan to market the app once it's done so I can gain insights into the startup ecosystem and product development processes. While the project's success in generating revenue remains uncertain, my primary goal is to acquire valuable skills. Any financial gain would be a welcome bonus. A crucial lesson I've learned throughout these past few years is the significance of knowledge and that the best way to gain knowledge is through application and creation. So, I dedicate much of my free time to pursuing various interests through different projects to broaden my learning and skill set.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"35d1b595-abe1-4742-978c-1a8b3f822b77\"}":{"__typename":"School","uuid":"35d1b595-abe1-4742-978c-1a8b3f822b77","name":"Glenda Dawson High School","city":"Pearland","type":"HIGH","state":"Texas","country":"United States","zip":"77581"},"Education:{\"uuid\":\"8299614e-8d3d-4075-bf88-9b553fc6e3f6\"}":{"__typename":"Education","uuid":"8299614e-8d3d-4075-bf88-9b553fc6e3f6","school":{"__ref":"School:{\"uuid\":\"35d1b595-abe1-4742-978c-1a8b3f822b77\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"de3ac2b3-be0f-42c3-a12d-0c32302193d4\"}":{"__typename":"Education","uuid":"de3ac2b3-be0f-42c3-a12d-0c32302193d4","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biomedical Engineering and Computer Science With a Certificate in Innovation and Entrepreneurship ","degree":null},"Testimonial:5c5c1dad-75de-4a41-8f48-aa3ed120fbd2":{"__typename":"Testimonial","id":"5c5c1dad-75de-4a41-8f48-aa3ed120fbd2","text":"Hakeem has been a remarkable mentor to my son, Daylen. As a college student at Duke, he brings not only academic excellence but also integrity, consistency, and heart. He leads by example, showing my son what it means to pursue greatness with humility. I’m deeply grateful for the investment he’s made—Hakeem’s presence in Daylen’s life is making a lasting difference.\n\nTheir sessions go beyond surface-level advice—Hakeem challenges Daylen to think critically, manage his time intentionally, and set goals rooted in purpose. He creates a space where questions are welcomed and growth is inevitable. Each conversation leaves Daylen more confident, capable, and committed to his future.\n— Donald Knight","date":"2025-06-06 18:15:31.083+00","rating":5,"endorser":{"__typename":"Endorser","name":"Donald Knight","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"7501995d-6720-4526-ad51-ea9f6036f101\"}":{"__typename":"MentorPublicProfile","uuid":"7501995d-6720-4526-ad51-ea9f6036f101","displayName":"Hakeem S.","slug":"hakeem-shittabey","biography":"\u003cp\u003eI am a sophomore at Duke University, majoring in Biomedical Engineering and Computer Science, with a certificate in Innovation and Entrepreneurship. I'm from Pearland, Texas, a town within the greater Houston area. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I took 18 AP classes and was involved in many small clubs covering a diverse range of subjects. Since enrolling at Duke, I have significantly expanded my involvement. I have engaged in cutting-edge genetic research, volunteered to teach children how to code, developed complex computer science projects, and more. Due to these experiences, I am confident in my ability to teach a variety of STEM subjects as well as many non-STEM subjects such as product design, innovation, entrepreneurship, and many soft skills. In addition to teaching various subjects, I aim to empower students to become independent learners, ensuring their success in education regardless of their assigned teacher. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy hobbies include playing video games, watching TV, and weightlifting. I have competed in multiple powerlifting events, consistently achieving a 1000+ pound total. In my spare time, I connect with mentors to learn soft skills and work on personal projects related to AI and machine learning, computer science, and startups. \u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"PMg1T0237z6800j6jW3fL3rkJMCIGR8Hu5Kf4WCU01fd02o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering and Computer Science With a Certificate in Innovation and Entrepreneurship ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"18db07b3-a915-4acc-b2b3-d9d8756c0256\"}"},{"__ref":"DeepDives:{\"uuid\":\"e6bd1f48-29ee-44d7-8ce1-033e7444b2b1\"}"},{"__ref":"DeepDives:{\"uuid\":\"da39de07-11d9-4fda-b2cf-b5c4529f23e0\"}"},{"__ref":"DeepDives:{\"uuid\":\"7d2997cf-d440-46c6-ae42-14afe781c4da\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d2ce1a01-87cb-4cf7-aba7-4209d2ea8f21/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8299614e-8d3d-4075-bf88-9b553fc6e3f6\"}"},{"__ref":"Education:{\"uuid\":\"de3ac2b3-be0f-42c3-a12d-0c32302193d4\"}"}],"hiredAt":"2024-03-11T17:46:48.005Z","topics":["Coding / Programming","Machine Learning / AI","Web Design"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/","https://ucarecdn.com/c942d968-716c-4352-9dd1-9c8441a54458/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:5c5c1dad-75de-4a41-8f48-aa3ed120fbd2"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hake
