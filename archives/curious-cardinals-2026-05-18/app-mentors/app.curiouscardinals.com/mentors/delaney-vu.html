xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"13d3fa46-e4d2-4422-9bc8-f32d0190c874\"}":{"__typename":"Favorites","uuid":"13d3fa46-e4d2-4422-9bc8-f32d0190c874","photoUrl":"https://ucarecdn.com/06313154-da72-422d-a183-105908880641/","title":"Zach Bryan","type":"ARTIST"},"Favorites:{\"uuid\":\"0e9d5f84-2b20-4e1e-8a65-b1a1574d4158\"}":{"__typename":"Favorites","uuid":"0e9d5f84-2b20-4e1e-8a65-b1a1574d4158","photoUrl":"https://ucarecdn.com/06313154-da72-422d-a183-105908880641/","title":"A Little Life","type":"BOOK"},"Favorites:{\"uuid\":\"cc2067d2-f265-4d70-901d-cf449f88d3cb\"}":{"__typename":"Favorites","uuid":"cc2067d2-f265-4d70-901d-cf449f88d3cb","photoUrl":"https://ucarecdn.com/06313154-da72-422d-a183-105908880641/","title":"New York","type":"CITY"},"CausesSupported:{\"uuid\":\"52aa4647-acf6-4a06-a443-76e02bc20345\"}":{"__typename":"CausesSupported","uuid":"52aa4647-acf6-4a06-a443-76e02bc20345","name":"Camp Kesem","description":"\u003cp\u003eI volunteer as a camp counselor to support kids affected by a parent's cancer. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/3c385bb5-5b3f-453c-94cc-f6fbc24076d6/"},"CausesSupported:{\"uuid\":\"61c207f2-5dc9-4efa-92cc-48a5fd435aa6\"}":{"__typename":"CausesSupported","uuid":"61c207f2-5dc9-4efa-92cc-48a5fd435aa6","name":"One Love Foundation","description":"\u003cp\u003eI support One Love's mission to end relationship abuse.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/497eeeb9-6c75-412f-b891-25fdea44e876/"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"51778d43-6cf3-433e-a67a-43a137e0c64f\"}":{"__typename":"DeepDives","uuid":"51778d43-6cf3-433e-a67a-43a137e0c64f","content":"\u003cp\u003eMy greatest role model is my mom! She is a teacher and she is absolutely incredible. I've had the pleasure of working as a teaching aide in her classroom and getting to see her in action. She is so patient and facilitates such a warm and welcoming environment in her classroom. Her students respect her and adore her. I have the utmost admiration for her dedication to her students and have learned so much from her!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"9b4a9a67-6f65-44fd-a296-d5d19e93d3d7\"}":{"__typename":"DeepDives","uuid":"9b4a9a67-6f65-44fd-a296-d5d19e93d3d7","content":"\u003cp\u003eI aspire to become a clinical psychologist working with youth impacted by community violence and incarceration. I am very interested in the intersection of mental health and the justice system. I hope to combine clinical work with advocacy and ultimately contribute to a comprehensive approach that not only promotes individual healing, but broader social transformation. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"4a88e30a-0767-4536-ae7e-d362fca9543a\"}":{"__typename":"DeepDives","uuid":"4a88e30a-0767-4536-ae7e-d362fca9543a","content":"\u003cp\u003eAs a middle school/high school student, I was extremely driven and put a lot of effort into my school work. My discipline translated to other areas of my life as well as I dedicated a lot of time to extracurriculars such as sports, music, and volunteering. I am also a big sister to 3 siblings! So, I always looked out for them and tried to set the best example.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"f2a9ab0e-da2a-4eeb-82fe-7420ed8000bf\"}":{"__typename":"DeepDives","uuid":"f2a9ab0e-da2a-4eeb-82fe-7420ed8000bf","content":"\u003cp\u003eThrough firsthand experience, I've seen how impactful education can be, reaching beyond its role in academic achievement. I believe it is important to explore education as a means of empowerment. As a mentor, I am committed to fostering an environment that not only promotes academic success, but curiosity, personal growth and resilience. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"adef5cf8-2739-441e-b49a-c760b2e61a11\"}":{"__typename":"Education","uuid":"adef5cf8-2739-441e-b49a-c760b2e61a11","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Psychology","degree":"B.A."},"School:{\"uuid\":\"63e35d5b-f7c4-4bfe-9a3a-23a507ccecee\"}":{"__typename":"School","uuid":"63e35d5b-f7c4-4bfe-9a3a-23a507ccecee","name":"Rocky Point High School","city":"Rocky Point","type":"HIGH","state":"New York","country":"United States","zip":"11778"},"Education:{\"uuid\":\"b1217fff-0a7f-42c7-ac1b-56eb3da3c402\"}":{"__typename":"Education","uuid":"b1217fff-0a7f-42c7-ac1b-56eb3da3c402","school":{"__ref":"School:{\"uuid\":\"63e35d5b-f7c4-4bfe-9a3a-23a507ccecee\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ea910498-d14a-47ec-8b4b-15f9e313bf78\"}":{"__typename":"MentorPublicProfile","uuid":"ea910498-d14a-47ec-8b4b-15f9e313bf78","displayName":"Delaney V.","slug":"delaney-vu","biography":"\u003cp\u003eDelaney is from Long Island, New York and she loves hiking, sports, cooking, and spending time with friends and family. She is a senior at Yale University majoring in psychology and has dedicated a lot of her time to researching the brain networks associated with emotion regulation in children with disruptive behavior. She is very interested in the intersection of mental health and the justice system. After graduation, she plans to pursue a doctoral degree in clinical psychology and hopes to work with youth affected by community violence and incarceration. \u003cbr\u003e\u003cbr\u003eApart from her academics, Delaney is a part of the Yale Women's Lacrosse Team. She also volunteers as a camp counselor for Camp Kesem, a non-profit that supports kids affected by a parent's cancer diagnosis. She helps to fundraise all year in order to provide kids with a free, week-long summer camp that helps them escape the challenges of coping with a parent's cancer diagnosis. \u003cbr\u003e\u003cbr\u003eDelaney has extensive teaching experience. She has worked as a teaching aide at a school that functions as a sanctuary for students with mental and developmental disorders, learning disabilities, trauma, unstable home lives, and experience with the justice system. She also worked as a teacher for MeshEd, a company that aims to increase educational opportunities for students of different socioeconomic backgrounds. In this role, she taught after-school enrichment programs and helped students cultivate passion projects that involved social justice and environmental sustainability goals. \u003cbr\u003e\u003cbr\u003eDelaney is extremely patient, kind, and passionate about exploring education as a means of empowerment. She incorporates this passion into her teaching style by encouraging students to be creative and curious!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"13d3fa46-e4d2-4422-9bc8-f32d0190c874\"}"},{"__ref":"Favorites:{\"uuid\":\"0e9d5f84-2b20-4e1e-8a65-b1a1574d4158\"}"},{"__ref":"Favorites:{\"uuid\":\"cc2067d2-f265-4d70-901d-cf449f88d3cb\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"52aa4647-acf6-4a06-a443-76e02bc20345\"}"},{"__ref":"CausesSupported:{\"uuid\":\"61c207f2-5dc9-4efa-92cc-48a5fd435aa6\"}"}],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"51778d43-6cf3-433e-a67a-43a137e0c64f\"}"},{"__ref":"DeepDives:{\"uuid\":\"9b4a9a67-6f65-44fd-a296-d5d19e93d3d7\"}"},{"__ref":"DeepDives:{\"uuid\":\"4a88e30a-0767-4536-ae7e-d362fca9543a\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2a9ab0e-da2a-4eeb-82fe-7420ed8000bf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/07f32ec4-a78a-4898-b3e5-b54c548b79c6/-/preview/-/format/jpg/","https://ucarecdn.com/6442d232-e099-4f6f-b8d0-e493455cc673/-/preview/-/format/jpg/","https://ucarecdn.com/0e1a7805-a956-4bb9-bab5-c9c8b4f6663a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"adef5cf8-2739-441e-b49a-c760b2e61a11\"}"},{"__ref":"Education:{\"uuid\":\"b1217fff-0a7f-42c7-ac1b-56eb3da3c402\"}"}],"hiredAt":"2024-01-02T19:15:02.705Z","topics":["K-6 Storybook","Creative Writing","History Project","Law / Government / Policy","Sustainability"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query",
