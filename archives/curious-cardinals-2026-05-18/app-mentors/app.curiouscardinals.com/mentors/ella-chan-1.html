xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8cbb0708-1781-4235-b2d8-1f6df8f5efbe\"}":{"__typename":"Favorites","uuid":"8cbb0708-1781-4235-b2d8-1f6df8f5efbe","photoUrl":"https://ucarecdn.com/b3958bac-b702-49c2-9a63-d6e2c566be9f/","title":"La La Land","type":"MOVIE"},"Favorites:{\"uuid\":\"f001d6ab-69fc-4d0e-807c-a3a76cb6bed4\"}":{"__typename":"Favorites","uuid":"f001d6ab-69fc-4d0e-807c-a3a76cb6bed4","photoUrl":"https://ucarecdn.com/0b64d3fc-2ee1-41d8-b997-450e14e8d76b/","title":"Hamilton ","type":"PLAY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"dc69958d-d367-4ef0-88a0-5a6f9972a58c\"}":{"__typename":"DeepDives","uuid":"dc69958d-d367-4ef0-88a0-5a6f9972a58c","content":"\u003cp\u003eThis mentorship matters to me because I’ve experienced firsthand how transformative it can be. When I was a junior in high school, I worked with a mentor through Curious Cardinals. At the time, I was struggling with confidence in my academics, especially when it came to studying, test-taking, and figuring out what I even wanted to pursue in the future. I didn’t really know how to translate my interests into goals, and I doubted whether I was capable of achieving what I wanted.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWorking with my mentor completely changed that. She helped me build structure, break things into manageable steps, and most importantly, start believing in myself and my abilities. Over time, I became more confident, more organized, and significantly stronger academically.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat experience showed me how powerful mentorship can be in helping someone find clarity and direction. Now, I want to offer that same kind of support to others: to help students improve academically and also feel capable, confident, and excited about what they’re building.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"df1e32e5-61d7-4fe3-bfb8-e21072c79270\"}":{"__typename":"DeepDives","uuid":"df1e32e5-61d7-4fe3-bfb8-e21072c79270","content":"\u003cp\u003eAs a Chinese American and the middle child between two brothers, my identity has shaped the way I approach learning and teaching in important ways. Growing up, I learned to be independent and self-driven, but also to recognize the value of leaning on people I trust for support and guidance when I need it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also experienced a fair amount of academic pressure from my family, which was difficult at first. Over time, I came to understand that my outcomes are ultimately shaped by the effort and intention I put into my work. That mindset has stayed with me and continues to guide how I approach challenges.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of this, my teaching style is a balance of encouragement and accountability. I won’t hesitate to push students when I see their potential, but I’ll also make sure they feel supported, guided, and equipped with the tools to become more independent and confident learners over time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"957a37d8-5fa2-425c-96fb-d151a838d9cc\"}":{"__typename":"DeepDives","uuid":"957a37d8-5fa2-425c-96fb-d151a838d9cc","content":"\u003cp\u003eI tried to spend my summers in high school balancing both enjoyment and personal growth. As college became closer, I naturally became more intentional about how I used my time, but I also made sure to leave space for rest, travel, and finding myself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome summers, I traveled with my family to places like Japan, Taiwan, and Hawaii, which gave me a chance to step outside my routine and experience different cultures and perspectives. I also took part in academic and extracurricular experiences that helped I think truly shaped my interests today. For example, I attended the School of The New York Times summer program in New York, where I met incredible people, built lasting friendships, and really fell in love with the city; an experience that later influenced my decision to apply to NYU.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition, I shadowed in University of Wisconsin-Madison hospital, which was one of the most formative experiences for me. It gave me a real look into the healthcare field and helped me realize my interest in pursuing a pre-health path. It was inspiring to see the dedication and teamwork of professionals in such a high-stakes environment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside all of this, I also spent time with friends and focused on becoming more independent and confident in myself. Overall, my summers were a mix of exploration, learning, and growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5fe1b445-4a1f-4324-857a-f61b4744b4ad\"}":{"__typename":"DeepDives","uuid":"5fe1b445-4a1f-4324-857a-f61b4744b4ad","content":"\u003cp\u003eI would definitely tell my middle and high school self to trust in my own capabilities more and not get so caught up in stress or comparison. At the time, I often compared myself to others and worried a lot about college and the future, which ended up affecting both my relationships and my academic performance more than I realized.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLooking back, I’ve learned that everyone ends up where they’re meant to be, and that constantly measuring yourself against others only takes away from your own growth. I would remind myself to focus more on my own progress, stay present, and trust that consistent effort and self-belief matter far more than perfection or comparison.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"008fe15a-8cb8-499e-8640-0656d4d62c96\"}":{"__typename":"School","uuid":"008fe15a-8cb8-499e-8640-0656d4d62c96","name":"Homestead High School","city":"Cupertino","type":"HIGH","state":"California","country":"United States","zip":"95014"},"Education:{\"uuid\":\"ec5ecf5b-8efd-47e8-9a95-c7ca6684a1b3\"}":{"__typename":"Education","uuid":"ec5ecf5b-8efd-47e8-9a95-c7ca6684a1b3","school":{"__ref":"School:{\"uuid\":\"008fe15a-8cb8-499e-8640-0656d4d62c96\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}":{"__typename":"School","uuid":"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5","name":"New York University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10012"},"Education:{\"uuid\":\"d339017c-6e7e-4974-9ae6-6d06831296a7\"}":{"__typename":"Education","uuid":"d339017c-6e7e-4974-9ae6-6d06831296a7","school":{"__ref":"School:{\"uuid\":\"9ae68c0d-9aba-409a-8f88-a3f8cc5726a5\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Pre Health - Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"28d5708a-7c9b-4c79-9179-0f5fb9744673\"}":{"__typename":"MentorPublicProfile","uuid":"28d5708a-7c9b-4c79-9179-0f5fb9744673","displayName":"Ella C.","slug":"ella-chan-1","biography":"\u003cp\u003eHi! I’m Ella, a student at NYU studying Global Liberal Studies abroad in my first year, and I plan to pursue a pre-health track, majoring in neuroscience, after this year. I help students turn their ideas, whether in social impact, writing, or science, into meaningful projects they’re proud of.\u003cbr\u003e\u003cbr\u003eA bit about me\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was always drawn to projects that connected academics to the real world. Since then, I’ve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eConducted healthcare research at the University of Wisconsin Hospital and co-authored an abstract presented at a national medical conference\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eServed as Lifestyle Editor of my school newspaper, publishing articles on topics like mental health, sustainability, and global conflicts\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLed climate advocacy initiatives, including presenting a proposal adopted by my city’s Climate Action Plan\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEarned recognition for my work in journalism, leadership, and community service, including the President’s Volunteer Service Award (Gold) and the Youth Journalism International Award for Excellence\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences all taught me how to take an idea and turn it into something tangible and impactful.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat I specialize in\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love working with students who want to bring their interests beyond the classroom. I can help with:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePassion projects with real-world impact\u003c/p\u003e\u003cp\u003e(nonprofits, advocacy campaigns, community initiatives)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWriting \u0026amp; journalism\u003c/p\u003e\u003cp\u003e(articles, research papers, blogs, storytelling)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHealth \u0026amp; science exploration\u003c/p\u003e\u003cp\u003e(introductory research ideas, public health topics)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLeadership \u0026amp; project development\u003c/p\u003e\u003cp\u003e(turning ideas into structured, achievable plans, getting involved with local communities)\u003c/p\u003e\u003cp\u003eI also support students in building important skills like communication, confidence, and presenting their work effectively.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhy I'm qualified to help you\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve spent years mentoring and teaching students in different settings:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTaught swimming to students ages 3–14 for 4 years, including coaching pre-competitive swimmers\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorked as a camp counselor for children in transitional housing\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMentored younger students through school programs as Lifestyle editor for my school paper\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLed many philanthropy initiatives through volunteer organizations with different communities\u003c/p\u003e\u003cp\u003eThrough these experiences, I've learned how to adapt to different learning styles and make sessions structured and engaging.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming and refining your project idea\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a clear step-by-step plan with goals and small tasks for the week\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGiving feedback on writing, presentations, or research\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelping you build your confidence in sharing your work\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I love traveling, playing guitar, creative writing, listening to all genres of music, and trying out new cafes and restaurants (living in New York makes it a hobby).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re driven to explore, willing to put in the work, and excited to create something meaningful, I’d be happy to support you along the way and see what we can do together!\u003c/p\u003e","teachingVideoPlaybackId":"lHGDUqcyofO00UUm9q8wsz2EP8Akym01FjV4K1yuDIIns","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8cbb0708-1781-4235-b2d8-1f6df8f5efbe\"}"},{"__ref":"Favorites:{\"uuid\":\"f001d6ab-69fc-4d0e-807c-a3a76cb6bed4\"}"}],"causesSupported":[],"major":"Pre Health - Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dc69958d-d367-4ef0-88a0-5a6f9972a58c\"}"},{"__ref":"DeepDives:{\"uuid\":\"df1e32e5-61d7-4fe3-bfb8-e21072c79270\"}"},{"__ref":"DeepDives:{\"uuid\":\"957a37d8-5fa2-425c-96fb-d151a838d9cc\"}"},{"__ref":"DeepDives:{\"uuid\":\"5fe1b445-4a1f-4324-857a-f61b4744b4ad\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8cd4a68b-9871-4258-b8de-5cbac1a0a88a/-/preview/-/format/jpg/","htt
