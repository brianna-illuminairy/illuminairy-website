xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"549f237c-ca3a-4bbb-8982-8d7c4b4e5c24\"}":{"__typename":"DeepDives","uuid":"549f237c-ca3a-4bbb-8982-8d7c4b4e5c24","content":"\u003cp\u003eTake everything day by day! It is easy to get caught up in the big picture, but try to focus on what you can do each day to reach your goals. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"78f9e269-bb1a-4b76-a458-5c6f4aa6c8f0\"}":{"__typename":"DeepDives","uuid":"78f9e269-bb1a-4b76-a458-5c6f4aa6c8f0","content":"\u003cp\u003eI have had very influential mentors who have helped me get to where I am today. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"d3e9e251-1fbb-4a16-ba4a-f8eb946d202f\"}":{"__typename":"DeepDives","uuid":"d3e9e251-1fbb-4a16-ba4a-f8eb946d202f","content":"\u003cp\u003eI went on a 14-day backpacking trip!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f7ad3ad4-f202-4a31-a447-4f12e6cadba5\"}":{"__typename":"DeepDives","uuid":"f7ad3ad4-f202-4a31-a447-4f12e6cadba5","content":"\u003cp\u003eThrough my journalism major, I have learned to ask strong questions and simplify complicated concepts into easy and digestible pieces of information. I have also been able to explore many subjects and interest areas through my classes (ie: law, business, sports).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3e9bf0b0-777f-4af4-aa0f-8cde12241e76\"}":{"__typename":"School","uuid":"3e9bf0b0-777f-4af4-aa0f-8cde12241e76","name":"UWC-USA","city":"Montezuma","type":"HIGH","state":"NM","country":"United States","zip":"87731"},"Education:{\"uuid\":\"88648b2f-a7f8-45d2-acac-42969327192d\"}":{"__typename":"Education","uuid":"88648b2f-a7f8-45d2-acac-42969327192d","school":{"__ref":"School:{\"uuid\":\"3e9bf0b0-777f-4af4-aa0f-8cde12241e76\"}"},"startYear":"2020","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"afa5e42d-b2d9-4cc0-842c-94091edc858a\"}":{"__typename":"Education","uuid":"afa5e42d-b2d9-4cc0-842c-94091edc858a","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Journalism, minoring in Business Institutions","degree":null},"MentorPublicProfile:{\"uuid\":\"01869619-f87f-440a-a9b8-c64a1460a82b\"}":{"__typename":"MentorPublicProfile","uuid":"01869619-f87f-440a-a9b8-c64a1460a82b","displayName":"Natasha M.","slug":"natasha-marangu","biography":"\u003cp\u003eHi, my name is Natasha Marangu and I’m a senior at Northwestern studying Journalism and Business Institutions from the San Francisco Bay Area. I’m also an incoming investment banking analyst at Morgan Stanley within the transportation group. I’m passionate about journalism, business, and international relations. I love helping students discover and develop their own interests in these areas and beyond.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough journalism, I’ve written for my high school newspaper and the Northwestern Business Review, which taught me how to research deeply, write clearly, and tell compelling stories. I can help you with everything from writing skills to research papers, or guide you in starting your own publication or media project. I’m happy to share any and everything I’ve learned through my bachelor’s degree in journalism.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn business, I’ve explored multiple paths, from venture capital to entrepreneurship to wealth management to a credit investing to investment banking, which has given me insight into various career options. As co-president of Northwestern’s Women in Business, a mentor in the investment banking club, and a sector leader in Northwestern Capital Management, I’ve learned that the best way to understand finance is by diving in, asking questions, and connecting concepts to real-world applications. Whether you’re interested in business careers, or working on a finance-related project, I'm here to break down complex topics and help you build confidence.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy interest in international relations began at an international boarding school, where I developed a deep curiosity about global affairs. I’ve been taking Spanish since I was four years old and studied abroad in Spain to continue practicing and improving. I also interned at California’s State Senate, which gave me invaluable policy and research experience, especially meaningful given that California has the fourth largest economy in the world. This experience showed me how policy and international relations intersect in powerful ways.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I believe in meeting students where they are and helping them discover their own voice and interests. Whether you would like tutoring in a subject, to explore business concepts, or develop a passion project, I'm here to provide guidance while encouraging you to think critically and creatively. I remember how overwhelming middle and high school can feel with balancing applications, academics, and trying to figure out what you actually want to study. That’s why I’m here to help you navigate it all.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy sailing on Lake Michigan through Club Sailing, and I started a pick-up tennis organization here on campus. I also love fashion, journaling, workout classes, board and card games, traveling, listening to podcasts, and perfecting my at-home matcha recipe.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThanks for taking the time to learn more about me! I’d love to help you explore your interests, strengthen your skills, or bring your passion project to life. Whether you’re certain about your path or still figuring things out, I’m excited to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"LvCbrHeYKdoafaXpdWBfxuyYluMuUZiy1OHVN7fAYoY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Journalism, minoring in Business Institutions","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"549f237c-ca3a-4bbb-8982-8d7c4b4e5c24\"}"},{"__ref":"DeepDives:{\"uuid\":\"78f9e269-bb1a-4b76-a458-5c6f4aa6c8f0\"}"},{"__ref":"DeepDives:{\"uuid\":\"d3e9e251-1fbb-4a16-ba4a-f8eb946d
