xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"dfeb1609-665f-4371-964a-91b00e26bab7\"}":{"__typename":"DeepDives","uuid":"dfeb1609-665f-4371-964a-91b00e26bab7","content":"\u003cp\u003eI attended a LOT of camps, around 2-3 each summer. They fell into three categories:\u003c/p\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003eDebate camp! It's an intensive experience of usually 2+ weeks where all you're thinking about is debate. This is definitely a great way to socialize and to fall in love with the activity (as well as get good at it).\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWriting camp! I went to Kenyon, which is one of the two super competitive camps, the other being Iowa. Again it's a great chance to write more densely than I've ever before and to meet people who are just as passionate about their craft.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePolitics camp! I attended Texas Girls State, which is a weeklong mock-elections experience that ended up changing my life. I'll spare you the details, but I'd recommend it to anyone with even the slightest interest in government. I also know quite a few other politics camps, so if you're interested, please contact me!\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"6b1002c7-7819-4396-a86c-325d7d0281a7\"}":{"__typename":"DeepDives","uuid":"6b1002c7-7819-4396-a86c-325d7d0281a7","content":"\u003cp\u003eMy middle school debate coach, Bryan Benitez. When I first started debate as an eleven-year-old, I truly did not care for economics or international affairs, but he made debate fun and inspired me to really grind out the activity that ultimately shaped me as a person in terms of aspirations, goals, and personality. He ended up going to Stanford, which is part of the reason I want to go there for law school. I hope to be as influential for my students as he was for me: someone who encourages students to enjoy learning and makes each session something to look forward to rather than just an academic obligation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"641d91cd-7b08-4b89-a80d-3d8e8cd091f5\"}":{"__typename":"DeepDives","uuid":"641d91cd-7b08-4b89-a80d-3d8e8cd091f5","content":"\u003cp\u003eHave fun! I was a really intense teenager, and I would often have mental breakdowns over losing a debate round or getting a C on an assignment, which took a huge toll on my mental health, especially with undiagnosed ADHD. I began to neglect my social life in lieu of pursuing academic achievements, which I really regret now. I'd tell that intense teenager to spend more time with friends and join more clubs at school, reach out of your comfort zone to meet people you normally wouldn't, and if things go awry, don't sweat it! Just try your best, enjoy the moment, and everything will work out in its own way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3917bc5e-3df3-42f2-8ac9-53d6ee85b6f6\"}":{"__typename":"DeepDives","uuid":"3917bc5e-3df3-42f2-8ac9-53d6ee85b6f6","content":"\u003cp\u003eMy podcast about the toxic competitiveness of the debate community, rebelliously named (excuse my language) \"F*ck the Framing.\" In it, my debate partner Rina and I talk about our own experiences as queer women of color, as well as speak up for the hundreds of debaters who told us about their own experiences in a survey I'd sent out beforehand. At first, a lot of debaters reacted negatively, saying that \"what happens in-round should stay in-round,\" but soon, more and more debaters came up to us saying that they felt seen with our platform and that \"everyone knew these issues existed, but no one talked about it before.\" By the end of my senior year, the podcast accrued over two thousand downloads. My goal for everything has always to create a better community, and although the podcast ended with Rina and I's debate career, many have come up to us at tournaments and told us about the lasting impact it had on both them individually and the community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"29c1e4ca-1f65-4ff0-81a1-b6466b82e2ac\"}":{"__typename":"School","uuid":"29c1e4ca-1f65-4ff0-81a1-b6466b82e2ac","name":"Dulles High School","city":"Sugar Land","type":"HIGH","state":"Texas","country":"United States","zip":"77478"},"Education:{\"uuid\":\"f5f3afbd-2dd8-4a03-829d-f1837d1903b1\"}":{"__typename":"Education","uuid":"f5f3afbd-2dd8-4a03-829d-f1837d1903b1","school":{"__ref":"School:{\"uuid\":\"29c1e4ca-1f65-4ff0-81a1-b6466b82e2ac\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"56eb1e8f-d8b6-42c3-a7de-057b36ab8032\"}":{"__typename":"Education","uuid":"56eb1e8f-d8b6-42c3-a7de-057b36ab8032","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Political Science + Applied Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"59363017-8610-427c-9cd2-582164fcb92d\"}":{"__typename":"MentorPublicProfile","uuid":"59363017-8610-427c-9cd2-582164fcb92d","displayName":"Sherry H.","slug":"sherry-huang","biography":"\u003cp\u003eHello, I'm Sherry! I was originally born in Shanghai, China, but I moved to the suburbs of Houston when I was about five, and I've lived there since with my parents and our dog. I plan on double-majoring in political science and math \u0026amp; philosophy at Yale. After college, I want to break into quantitative trading or pursue a JD and PhD dual degree and work as a lawyer with labor unions. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm passionate about all things politics and international affairs, as well as mathematical logic. I also have experience in biology, history, computer science, and physics; I pride myself on my interdisciplinary-ness. I think every subject connects to a broad skill of problem-solving, and I hope to not only help students train that skill but also connect it to different passions, subjects, and personalities. I think a good mentor really helps any topic come to life, and I aspire to be that for each student I talk with. Specifically, though, I'm interested in critical theory (think modern Plato), ethnographic study (think culture and people), and conceptual math.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I focused on debate competition and coaching, founding and running my own 501c3 nonprofit, hosting two podcasts (one critiquing the toxic debate community, one examining modern political events), and self-publishing a poetry chapbook. Many of these connected to my belief that storytelling is key in building radical empathy to shape the world into a more understanding home, through both concrete advocacy and abstract media, as well as intellectually stimulating disagreements when debating philosophical viewpoints or current events.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I enjoy movie hopping (ask for my Letterboxd), playing piano (my favorite composer is Beethoven), hanging out with friends, exploring different music genres (I've recently been listening to 2hollis...LOL), and searching for the best matcha latte. I think any hobby or idea you're passionate about can turn into a fruitful project, so I'm interested in getting to know everyone to your core. I have plenty of experience mentoring students, from revising essays that got into Johns Hopkins, UCLA, and Georgetown, among other schools, to jobs teaching English and debate. I'm super excited to be at Curious Cardinals and to meet and work with everyone!!\u003c/p\u003e","teachingVideoPlaybackId":"axMI3ULrL02aEufEvz7K8P9nGpFHrTc7njbErnE1iurk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Political Science + Applied Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dfeb1609-665f-4371-964a-91b00e26bab7\"}"},{"__ref":"DeepDives:{\"uuid\":\"6b1002c7-7819-4396-a86c-325d7d0281a7\"}"},{"__ref":"DeepDives:{\"uuid\":\"641d91cd-7b08-4b89-a80d-3d8e8cd091f5\"}"},{"__ref":"DeepDives:{\"uuid\":\"3917bc5e-3df3-42f2-8ac9-53d6ee85b6f6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5e48b557-1c08-4cb2-824c-13b4ef2f5595/-/preview/-/format/jpg/","https://ucarecdn.com/9c5df451-5202-4106-be90-58dc21f53344/-/preview/-/format/jpg/","https://ucarecdn.com/b586c816-4ea3-4cf5-aba5-5bd05fd52e27/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f5f3afbd-2dd8-4a03-829d-f1837d1903b1\"}"},{"__ref":"Education:{\"uuid\":\"56eb1e8f-d8b6-42c3-a7de-057b36ab8032\"}"}],"hiredAt":"2026-01-15T15:27:04.130Z","topics":["Algebra II","Precalculus / Trigonometry","Calculus","Biology","Writing","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","History Project","K-6 Storybook","Music","Law / Government / Policy","Journalism","Debate","Public Speaking","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sherry-huang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"59363017-8610-427c-9cd2-582164fcb92d\"}"}}},"_sentryTraceData":"657ea9f453f3411aa3d9d62acc8454e8-b45b4c10814ebc65-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=657ea9f453f3411aa3d9d62acc8454e8,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sherry-huang"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><nosc
