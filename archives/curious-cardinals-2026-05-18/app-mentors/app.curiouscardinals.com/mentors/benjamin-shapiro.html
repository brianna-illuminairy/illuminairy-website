xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"a061279e-4573-4660-809e-00d8cea459ce\"}":{"__typename":"DeepDives","uuid":"a061279e-4573-4660-809e-00d8cea459ce","content":"\u003cp\u003eI am a menace at crossword puzzles. I compete every year at the American Crossword Puzzle Tournament\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}":{"__typename":"School","uuid":"2ff73c87-6442-482c-8d92-863dfb263ea0","name":"The Dalton School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"cc94fe45-2a3f-4223-8bc3-3109f115a9d6\"}":{"__typename":"Education","uuid":"cc94fe45-2a3f-4223-8bc3-3109f115a9d6","school":{"__ref":"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}"},"startYear":"2011","endYear":"2015","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"17878daa-6e50-432e-8073-f1ba1f5d8cb0\"}":{"__typename":"Education","uuid":"17878daa-6e50-432e-8073-f1ba1f5d8cb0","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2015","endYear":null,"expectedGradYear":"2019","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"94e3db0e-5665-4199-8064-50f4a53dd72a\"}":{"__typename":"MentorPublicProfile","uuid":"94e3db0e-5665-4199-8064-50f4a53dd72a","displayName":"Benjamin S.","slug":"benjamin-shapiro","biography":"\u003cp\u003eHello! My name is Ben, and for the last four years I have taught AP World and AP Euro at an NYC high school. I know these exams better than I know my own sister. I've never met a DBQ prompt I didn't like. I've never come across a source I couldn't analyze. 9 out of 10 students who took my class passed the AP exam; 6 out of 10 earned a 4 or 5. As a group, they outperformed the national average by 14%. Apologies for the brag, I'm just very proud of my students. But for me, scores come second to the history. We're in this for the love of the game. I'm not just here to get you good grades, I'm here to share my love of history. I'm not here to make you memorize dates. I'm here to tell you the story. My job is to give you the tools and knowledge necessary to develop your own personal take on the past. Many students feel uncomfortable crafting historical arguments. \"What can I say that hasn't already been said?\" To that I would say...everything. You would be shocked to hear some of the hot takes that have come out of my classroom. There are no wrong answers so long as you back up your opinion with evidence. That kind of intellectual freedom only exists in the humanities, and particularly in history.\u0026nbsp;\u003c/p\u003e\u003cp\u003ePersonally, I go crazy for the Holy Roman Empire and the Cold War. I am of the firm belief that the 20th century is the greatest story ever told. At Northwestern University, I majored in European history. I was also one of two students to receive a certificate in Holocaust studies. My favorite class was a discussion seminar called “History of Modern Europe.” That professor made me want to teach. He was less of a teacher and more of a storyteller. It was one of few classes I looked forward to simply because I was eager to know what happened next. When history reads like a novel, you just can’t look away. I But generally speaking...if it happened in the past, I want to know about it. You might not consider yourself a \"history person.\" Please. I've heard that before. I've converted many a history-phobic student in my career, and I'm ready to do it again. Any topic, any skill, any discussion. I'll make it interesting for you. Let's get historical together. I’m excited to meet you. \u003c/p\u003e","teachingVideoPlaybackId":"mpEPfebtGLCX4EYVzJ1kP00C4VqZitxV4SDmAlPaBEEA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a061279e-4573-4660-809e-00d8cea459ce\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/42be121d-0dcc-4c67-a4cc-d877559e522b/-/preview/-/format/jpg/","https://ucarecdn.com/30598236-6e5d-4b30-8da7-2df06fa9fd72/-/preview/-/format/jpg/","https://ucarecdn.com/3081ef4d-9f8a-40df-a748-0390c2eee021/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cc94fe45-2a3f-4223-8bc3-3109f115a9d6\"}"},{"__ref":"Education:{\"uuid\":\"17878daa-6e50-432e-8073-f1ba1f5d8cb0\"}"}],"hiredAt":"2025-07-06T12:43:57.022Z","topics":["Algebra I","K-5 Grade Math","Pre-Algebra","Algebra II","6-8 Grade Science","Writing","Spanish","History"],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"benjamin-shapiro\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"94e3db0e-5665-4199-8064-50f4a53dd72a\"}"}}},"_sentryTraceData":"2aee512f8be5455e908a060ea29c0dcd-a0afcbc1b049c57d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2aee512f8be5455e908a060ea
