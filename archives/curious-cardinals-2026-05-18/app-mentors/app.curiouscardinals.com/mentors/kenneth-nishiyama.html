xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c3c3baaa-4d02-41b4-ad1c-cf877b310deb\"}":{"__typename":"DeepDives","uuid":"c3c3baaa-4d02-41b4-ad1c-cf877b310deb","content":"\u003cp\u003eSome advice I would give to my high school self is to try everything. As you get older, the room for failure begins to get thinner, and I believe that high school is a great time to try new things and even if you fail or dislike the things you try, it is the perfect time to find your passion. Your passion doesn't have to be academics, it just has to be something that you truly enjoy!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2f34c995-7021-499a-9a8f-275aa4bd4b95\"}":{"__typename":"School","uuid":"2f34c995-7021-499a-9a8f-275aa4bd4b95","name":"Mountain View High School","city":"Mountain View","type":"HIGH","state":"California","country":"United States","zip":"94040"},"Education:{\"uuid\":\"16efefb3-b326-480e-8275-d797cefc574c\"}":{"__typename":"Education","uuid":"16efefb3-b326-480e-8275-d797cefc574c","school":{"__ref":"School:{\"uuid\":\"2f34c995-7021-499a-9a8f-275aa4bd4b95\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"145f3c64-80d5-42bc-ae5e-bf1b0a6f86e0\"}":{"__typename":"Education","uuid":"145f3c64-80d5-42bc-ae5e-bf1b0a6f86e0","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering/CS","degree":null},"MentorPublicProfile:{\"uuid\":\"2cb104a1-edc2-4f0b-b285-dd543b6e2875\"}":{"__typename":"MentorPublicProfile","uuid":"2cb104a1-edc2-4f0b-b285-dd543b6e2875","displayName":"Kenneth N.","slug":"kenneth-nishiyama","biography":"\u003cp\u003eHello! My name is Kenneth, and I am currently majoring in Mechanical Engineering and Computer Science at Georgia Tech. Academically and professionally, I spend much of my time working on hands-on engineering projects that combine hardware and software. Some of my project themes consists of robotics, wearable technology, artificial intelligence/machine learning, applied engineering design, and even construction. I enjoy taking ideas from concept to prototype, and many of my personal and academic projects can be found at:\u003c/p\u003e\u003cbr\u003e\u003cp\u003ekennethnishiyama.com\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis year, I will be conducting research abroad as a nominated researcher at the Tokyo Institute of Technology, where my work will focus on improving human-robot control interfaces using AI. I am excited to explore how intuitive interfaces and intelligent feedback systems can make robotics more accessible, precise, and effective in real-world applications.\u003c/p\u003e\u003cp\u003eOutside of academics, I enjoy staying active by playing basketball and going to the gym. Sports have been an important part of my life, helping me stay disciplined, motivated, and balanced. I am also a big fan of the Golden State Warriors and the San Francisco 49ers, and I often watch games with my parents and friends.\u003c/p\u003e\u003cp\u003eMy path into engineering was not always straightforward. In middle school and high school, I was not the strongest student academically and often struggled to keep up with my peers. At one point, I even received a letter from my school stating my grades might not be good enough to graduate. However, what kept me motivated was my passion for engineering through my high school robotics team. Joining the team gave me a sense of purpose and direction. Over time, I took on many roles, including hardware, electrical, software, and eventually team captain. While the experience was challenging, it taught me perseverance, leadership, and the importance of clear communication.\u003c/p\u003e\u003cp\u003eThe mentors on my robotics team played a critical role in shaping who I am today. Their guidance, high expectations, and support helped me develop not only technical skills, but also the self-discipline and mindset needed to grow as an engineer and as a person.\u003c/p\u003e\u003cp\u003eAs someone who has experienced a rough path firsthand, I understand that many students, especially those who are closer to college may face many pressures both academically and mentally and might not know what direction they want to go. However, as previously mentioned, the mentors on my robotics team, while strict motivated and pushed me to truly shape the skills I have gained to this day, and I truly believe that having someone who can guide students on their interest significantly improves their determination in the path they want to take in the future.\u003c/p\u003e","teachingVideoPlaybackId":"D8HLmOA72361L00w5yeUBxG9Pw00PNMkdJNlDElsrKqag","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering/CS","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c3c3baaa-4d02-41b4-ad1c-cf877b310deb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/98d3a219-dbfa-4ea9-a497-c9e8f19cdc67/-/preview/-/format/jpg/","https://ucarecdn.com/ea263d52-7430-408d-83d6-0b43bd29b62e/-/preview/-/format/jpg/","https://ucarecdn.com/37a1aecc-743c-4651-9d
