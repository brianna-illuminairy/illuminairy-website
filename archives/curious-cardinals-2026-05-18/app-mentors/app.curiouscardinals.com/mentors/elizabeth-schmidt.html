xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d7264445-8bc4-45e7-92d8-91e1ffb43063\"}":{"__typename":"Favorites","uuid":"d7264445-8bc4-45e7-92d8-91e1ffb43063","photoUrl":"https://ucarecdn.com/f8700a3b-dc5b-44de-bb98-1f359a1baa38/","title":"Formula 1","type":"SPORT"},"Favorites:{\"uuid\":\"77033b0b-2677-493b-b757-82352d18f5e1\"}":{"__typename":"Favorites","uuid":"77033b0b-2677-493b-b757-82352d18f5e1","photoUrl":"https://ucarecdn.com/770259f2-6278-4bd9-98ed-75298a7672d0/","title":"Boston","type":"CITY"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"26820b9d-8778-4ab2-b93b-33d2e789b8db\"}":{"__typename":"DeepDives","uuid":"26820b9d-8778-4ab2-b93b-33d2e789b8db","content":"\u003cp\u003eI actually chose my major by the end of my Freshman year because I decided I wanted a major that could be applicable to a lot of different fields if I decided I wanted to change my career or research trajectory. I decided on Materials Science because learning the fundamentals of multiple fields like physics and chemistry would give me a solid foundation for whichever field I landed in after graduation. I also loved the interdisciplinary learning goals and the ability to explore lots of different subjects through my major!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"20dab6a5-ec75-42a9-940d-8379301fcc1a\"}":{"__typename":"DeepDives","uuid":"20dab6a5-ec75-42a9-940d-8379301fcc1a","content":"\u003cp\u003eMy dream job is to become a professor at a research university or institute! Over the past four years, I’ve grown extremely passionate about research due to the ability to constantly learn and grow within my career as well as the ability to constantly try new things. As a professor, I’d also be able to advise my own students and provide a training ground for them to begin their own careers which is something I’m also very passionate about. The combination of research and mentorship makes a professorship my dream job!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e5cb6a1d-684e-408a-aa70-1ff6f0ba4836\"}":{"__typename":"DeepDives","uuid":"e5cb6a1d-684e-408a-aa70-1ff6f0ba4836","content":"\u003cp\u003eMentorship matters to me because I’ve personally experienced how transformative and inspiring it can be to push forward my career and growth as a person. My entire career trajectory has changed multiple times for the better because of the incredible mentors I’ve had along the way. When I began research in my freshman year, I had no prior exposure to a scientific research environment. I felt out of place and terrified at first, but thanks to the patience, encouragement, and guidance of my mentors, I was able to learn quickly and grow confident in a space that initially felt overwhelming and unfamiliar. My mentors taught me everything from how to run bench protocols to understanding the core scientific questions driving our work and their belief in me pushed me to reach farther than I thought I could, and that’s an impact I hope to pass on to others. Mentorship isn’t just about teaching skills, it’s about helping someone see what they’re capable of. This is why I joined Curious Cardinals as a mentor!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"97e44ae6-018c-4f0f-94a6-1e3b54560667\"}":{"__typename":"DeepDives","uuid":"97e44ae6-018c-4f0f-94a6-1e3b54560667","content":"\u003cp\u003eBelieve in yourself! That’s what I would tell my middle or high school self. I would tell myself not to let the fear of failure or judgment hold you back and to follow your passions. In high school, I spent far too much time second-guessing myself or hesitating to pursue opportunities I was genuinely passionate about because I was afraid I wouldn’t be good enough or that others would judge me for my passions. Looking back, I wish I had realized sooner that those fears are small compared to the excitement and fulfillment that come from doing what you love. The times I did follow my interests, I was happier, more confident, and more motivated. So my advice would be: take that jump into the unknown, you’ll grow from the experience no matter the outcome, and you’ll be proud you tried and happier for it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"cef26db5-5110-44ee-8aa2-a656f7a195eb\"}":{"__typename":"Education","uuid":"cef26db5-5110-44ee-8aa2-a656f7a195eb","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Materials Science and Engineering","degree":"Undergraduate"},"School:{\"uuid\":\"60aecc30-f270-4120-b569-d6767a99c97e\"}":{"__typename":"School","uuid":"60aecc30-f270-4120-b569-d6767a99c97e","name":"W.B.Ray High School","city":"Corpus Christi","type":"HIGH","state":"Texas","country":"United States","zip":"78411"},"Education:{\"uuid\":\"db085fdb-22f7-491f-acc0-9d1d50530d2c\"}":{"__typename":"Education","uuid":"db085fdb-22f7-491f-acc0-9d1d50530d2c","school":{"__ref":"School:{\"uuid\":\"60aecc30-f270-4120-b569-d6767a99c97e\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"05457e28-cc41-47a5-b6e4-7432aa09aa92\"}":{"__typename":"MentorPublicProfile","uuid":"05457e28-cc41-47a5-b6e4-7432aa09aa92","displayName":"Elizabeth S.","slug":"elizabeth-schmidt","biography":"\u003cp\u003eHi, my name is Liz and I graduated from Stanford with a degree in Materials Science and Engineering! Fun fact about me, but while my degree is in Materials Science, I’m actually more of a biologist considering my research and projected career path! One thing that I’ve loved more than anything about my Stanford journey was the ability to explore new ideas and multiple different academic paths at once through both the flexibility of my major and my research. As a freshman, I was determined to try everything from applied physics/materials science to synthetic biology to finally settling on chemical and molecular biology. This drive has led me to join the labs of Guosong Hong and Carolyn Bertozzi where I’ve pursued projects like creating optically transparent windows in live mice for bioimaging purposes and characterizing mitochondrial proteins that have appeared on the cell surface in certain cell types. Now that I've graduated, I'll be joining the lab of Dr. Ryan Flynn at Boston Children's Hospital as a Research Assistant. As an undergraduate, I received a lot of help along the way on my journey through research and as a high schooler, I never would have applied to schools like Stanford if it wasn’t for programs like MITES Semester and mentors urging me to push myself beyond what I thought was possible for myself. Now, I feel like it’s my turn to give that same push to other students who are eager and excited to explore new concepts and projects! I remember high school as the point where I decided to pursue my dreams of becoming a scientist and hopefully, I can bring that confidence and passion to my mentees!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs your Curious Cardinals mentor, I’m here to help my mentees embrace their curiosity, challenge themselves, and discover how capable they truly are to tackle their passions. I believe and have seen through myself that the most meaningful learning happens when someone feels empowered to ask questions, follow their passions, and explore topics that genuinely excite them, whether it be in classes, research opportunities/projects, or something entirely new to them. My goal is to create a supportive and encouraging space where students feel heard and inspired to pursue their passions with confidence so I’m deeply committed to helping each of my mentees find their unique voice, build self-belief, and realize that their dreams are not only valid but entirely possible. If you're ready to dive into your interests and grow with a mentor who’s fully invested in your journey, I’d be thrilled to work with you as your Curious Cardinals mentor!\u003c/p\u003e","teachingVideoPlaybackId":"02Enwmfa4F500hcStLCejpQ2XY6y1QMPD3wS7YMnuHnXQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d7264445-8bc4-45e7-92d8-91e1ffb43063\"}"},{"__ref":"Favorites:{\"uuid\":\"77033b0b-2677-493b-b757-82352d18f5e1\"}"}],"causesSupported":[],"major":"Materials Science and Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"26820b9d-8778-4ab2-b93b-33d2e789b8db\"}"},{"__ref":"DeepDives:{\"uuid\":\"20dab6a5-ec75-42a9-940d-8379301fcc1a\"}"},{"__ref":"DeepDives:{\"uuid\":\"e5cb6a1d-684e-408a-aa70-1ff6f0ba4836\"}"},{"__ref":"DeepDives:{\"uuid\":\"97e44ae6-018c-4f0f-94a6-1e3b54560667\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/656e9e9e-7afc-4a8c-8702-f4ea33e0eb34/-/preview/-/format/jpg/","https://ucarecdn.com/c2d5c756-5758-4c57-ae07-d0bc4629b862/-/preview/-/format/jpg/","https://ucarecdn.com/d42153ac-9ee0-4293-a4a9-fee2eb71c5bd/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cef26db5-5110-44ee-8aa2-a656f7a195eb\"}"},{"__ref":"Education:{\"uuid\":\"db085fdb-22f7-491f-acc0-9d1d50530d2c\"}"}],"hiredAt":"2025-05-08T19:01:32.658Z","topics":["STEM Project","Medicine / Health","Biology","College Essay Writing","Writing","Reading","History","History Project","Academic Coaching","6-8 Grade Science","Literature"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elizabeth-schmidt\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"05457e28-cc41-47a5-b6e4-7432aa09aa92\"}"}}},"_sentryTraceData":"07e0ae1b2aba4ee3924c0d706060555f-8fedd5d4909ccd10-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=07e0ae1b2aba4ee3924c0d706060555f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"elizabeth-schmidt"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'g
