xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"83efa83b-e56d-4f41-9697-0ec26515d12d\"}":{"__typename":"DeepDives","uuid":"83efa83b-e56d-4f41-9697-0ec26515d12d","content":"\u003cp\u003eTo me, a mentor is someone who not only helps a student grow academically or professionally, but also as a person. Having walked similar steps as the students, I hope to provide insight in what has helped me get to where I am today. I appreciate the opportunity to connect with a student at a personal level and see them grow over a long period of time.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"39c89345-2aa3-43b2-9e9a-6bca75f0c0f7\"}":{"__typename":"DeepDives","uuid":"39c89345-2aa3-43b2-9e9a-6bca75f0c0f7","content":"\u003cp\u003eIn my spare time, I love engaging in any type of physical activity, whether that be starting my day with a cycle class at 6am or going on a bonding hike with my business team. Routine matters a lot to me and I think that these activities are a wonderful opportunity to connect with professional groups I'm involved with in a more personal setting!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"38078de1-9511-4269-9538-d4e02f5cdc83\"}":{"__typename":"DeepDives","uuid":"38078de1-9511-4269-9538-d4e02f5cdc83","content":"\u003cp\u003eGive yourself time to explore what you truly enjoy doing! It's extremely easy to get caught up in the hustle of schoolwork and focusing on getting into college, but the process is so much more enjoyable when you have a broader goal of what you want to achieve using your education!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1deca00d-5956-4128-b1a3-79213b638ab8\"}":{"__typename":"DeepDives","uuid":"1deca00d-5956-4128-b1a3-79213b638ab8","content":"\u003cp\u003eI think that my greatest source of motivation comes from the diverse range of people I interact with everyday. Whether that's at dinner with my best friends or a new person I meet in a line getting groceries, these unique conversations inspire me to not only better myself but also find new ways to interact with my community. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"58b56ced-6df3-43bd-98ea-b35e66529f2f\"}":{"__typename":"School","uuid":"58b56ced-6df3-43bd-98ea-b35e66529f2f","name":"West Ranch High School","city":"Santa Clarita","type":"HIGH","state":"California","country":"United States","zip":"91381"},"Education:{\"uuid\":\"c48dec16-0a65-4ee8-8f2d-d3a012b7c88b\"}":{"__typename":"Education","uuid":"c48dec16-0a65-4ee8-8f2d-d3a012b7c88b","school":{"__ref":"School:{\"uuid\":\"58b56ced-6df3-43bd-98ea-b35e66529f2f\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b510c710-b2cb-4a62-91df-9e3ec3f1b242\"}":{"__typename":"Education","uuid":"b510c710-b2cb-4a62-91df-9e3ec3f1b242","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Statistics \u0026 Data Science + Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"69fa08c6-b9e6-4f36-b78b-31c0d6241afa\"}":{"__typename":"MentorPublicProfile","uuid":"69fa08c6-b9e6-4f36-b78b-31c0d6241afa","displayName":"Alyssa C.","slug":"alyssa-chang","biography":"\u003cp\u003eAlyssa is a sophomore at Yale from LA studying Statistics \u0026amp; Data Science + Economics. On campus, she is the Director of Strategy \u0026amp; Product of the Yale Daily News Business Board, VP of Marketing for the Women's Network, VP of MathCounts Outreach, and on executive board of Branford College Council.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAcademically, she has always enjoyed exploring what lies at the intersection of qualitative and quantitative fields and this has been reflected in her major and extracurricular activities. She loves opportunities to learn and experiment with new things as someone who enjoys exploring new languages and writing different genres including poetry and short fiction.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSomething she cares about deeply is a sense of community and forming strong long-term relationships in both personal and professional lives, prioritizing empathy over judgment. She has led and assisted various passion projects over the years, many of which have been featured on media platforms like CBS News and the Kelly Clarkson show.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her free time, she enjoys traveling and immersing herself in diverse cultures, participating in various workouts—from cycling to hiking in Yosemite—and exploring new museums. As an avid photographer and writer, she is currently working on publishing a poetry collection, complemented by her own visual works.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlyssa is looking forward to helping Curious Cardinal students find and work towards their passions!\u003c/p\u003e","teachingVideoPlaybackId":"zP1S1hSyt00yX5IXpyv2oXwZcDmkg9VG1fSivH7Q7daE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics \u0026 Data Science + Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"83efa83b-e56d-4f41-9697-0ec26515d12d\"}"},{"__ref":"DeepDives:{\"uuid\":\"39c89345-2aa3-43b2-9e9a-6bca75f0c0f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"38078de1-9511-4269-9538-d4e02f5cdc83\"}"},{"__ref":"DeepDives:{\"uuid\":\"1deca00d-5956-4128-b1a3-79213b638ab8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f2c2271b-b103-41bb-8200-234cf187d903/-/preview/-/format/jpg/","https://ucarecdn.com/de6f209f-6d97-474d-89a5-ea585adc46df/-/preview/-/format/jpg/","https://ucarecdn.com/4ec95de2-3c8d-442e-ad8b-fa8f6e9d1f64/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c48dec16-0a65-4ee8-8f2d-d3a012b7c88b\"}"},{"__ref":"Education:{\"uuid\":\"b510c710-b2cb-4a62-91df-9e3ec3f1b242\"}"}],"hiredAt":"2025-02-08T03:00:28.082Z","topics":["K-5 Grade Math","Algebra I","Statistics","Pre-Algebra","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","Video / Photography","Visual Arts / Graphic Design","Fashion / Cosmetics","Music","Creative Writing","Business / Entrepreneurship","Finance / Investing","Journalism","Sust
