xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"7561218a-79f4-429e-b8f6-cf0627fd9503\"}":{"__typename":"DeepDives","uuid":"7561218a-79f4-429e-b8f6-cf0627fd9503","content":"\u003cp\u003eI would tell myself to continue following my passions and interests. The times when I was most engaged and enjoyed learning were when I was genuinely curious about a subject, not when I was trying to meet expectations. When you are doing something you love, the work comes naturally. Even if you're in a class that may not seem interesting to you at first, make it interesting. Find some way to connect it to your curiosity so you can get excited about learning each time you go to class.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"42a02cd4-bcf8-4c8a-97c7-3fbad2894b63\"}":{"__typename":"DeepDives","uuid":"42a02cd4-bcf8-4c8a-97c7-3fbad2894b63","content":"\u003cp\u003eI love to play and listen to music! My favorite type of music is jazz, so I'm often listening to my huge jazz playlist :) My favorite musicians are Sonny Clark, Charles Mingus, and Gary Burton. I love to explore different jazz clubs in NYC and jam to music with friends!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"41474594-5338-40a3-9104-cb930af83a61\"}":{"__typename":"DeepDives","uuid":"41474594-5338-40a3-9104-cb930af83a61","content":"\u003cp\u003eI would not be where I am today without good mentors in my life. I believe mentorship is vital to have a source of inspiration, give you advice during hard times, and guide you through unfamiliar territory. My mentors helped me turn a spark of curiosity into a full-fledged passion for biology that I plan to pursue for the rest of my life. I hope to foster this same passion in others and help mentees convert their interests into true ambitions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"bfb98c22-cf27-4870-ad76-2096aca99724\"}":{"__typename":"DeepDives","uuid":"bfb98c22-cf27-4870-ad76-2096aca99724","content":"\u003cp\u003eMy biggest motivation in research is the idea that you are doing something novel. The experiments you run will reveal data that no one else has ever seen before. Essentially, you are expanding society's scope of knowledge each time you get new data. The idea that research truly benefits and furthers our society is the key factor in why I am constantly motivated to run the next experiment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"a6984b7a-45a3-4a85-8c9e-9d84eeb3e3f2\"}":{"__typename":"School","uuid":"a6984b7a-45a3-4a85-8c9e-9d84eeb3e3f2","name":"Agoura High School","city":"Agoura Hills","type":"HIGH","state":"California","country":"United States","zip":"91301"},"Education:{\"uuid\":\"5dfe7671-87cd-4dc8-a4ec-1489e59e474b\"}":{"__typename":"Education","uuid":"5dfe7671-87cd-4dc8-a4ec-1489e59e474b","school":{"__ref":"School:{\"uuid\":\"a6984b7a-45a3-4a85-8c9e-9d84eeb3e3f2\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"561ff185-4f94-4e89-88b6-6e91a4fbdf1d\"}":{"__typename":"Education","uuid":"561ff185-4f94-4e89-88b6-6e91a4fbdf1d","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"b421a0bb-4e36-47b9-a6fd-8c4b8c14b163\"}":{"__typename":"MentorPublicProfile","uuid":"b421a0bb-4e36-47b9-a6fd-8c4b8c14b163","displayName":"Christian F.","slug":"christian-fonkalsrud","biography":"\u003cp\u003eHello! I'm Christian, an undergraduate at Cornell University in the class of 2029. I’m pursuing a Bachelor of Science in Biological Sciences with a concentration in Genetics, Genomics, and Development. I’m also working towards a minor in Fungal Biology. My love for biology stems from the idea of editing life to benefit society. This ranges from genetically modifying bacteria to degrade plastic and repurpose it into traditionally petroleum-based products to curing genetic diseases in humans using cutting-edge CRISPR technology. I love discussing the theory, applications, and ethics of gene editing and synthetic biology, so please reach out if this also interests you!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my favorite topics in biology is gene regulation: how cells choose what parts of the DNA to transcribe. DNA is the blueprint for life; it tells our body how to build the proteins that we need to live. But every cell in our body has the same exact set of instructions (DNA). If every cell in our body has the same DNA, then how do we have different types of cells? Our heart cells are very different from our lung cells, which are very different from our neurons, so how do all of these different cell types arise from the same set of instructions? The answer is through gene regulation. Cells can turn genes on or off depending on different environmental cues. This field is called epigenetics, and I find this incredibly intriguing and plan to pursue a PhD in this field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m currently conducting research to elucidate the genetic pathways that fungi use to sense and utilize nutrients in their environment. I use tools from molecular genetics, functional genomics, and epigenetics in my projects. This research will help optimize the use of fungi in turning agricultural waste into biofuels. In addition, I previously worked in a plant lab where I helped characterize a protein that facilitates epigenetic inheritance. I was published as a co-author on this project here: \u003cu\u003ehttps://www.pnas.org/doi/10.1073/pnas.2526408122\u003c/u\u003e. If you have any questions about research, such as how to get involved, how to find what best fits your interests, or what everyday life in research looks like, I would be happy to chat!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to genetics, I love spending time outdoors, either hiking, backpacking, or canoeing. I also love to play jazz piano or vibraphone whenever I get the chance! :)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"HV7gjQQZ02LHN01MR9e6H7acpI013b7ndr89ePhLsJCrYI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7561218a-79f4-429e-b8f
