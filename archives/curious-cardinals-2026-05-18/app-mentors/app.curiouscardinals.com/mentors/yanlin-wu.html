xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7387b395-9f2e-4446-9ffa-494c41f3f2c6\"}":{"__typename":"Favorites","uuid":"7387b395-9f2e-4446-9ffa-494c41f3f2c6","photoUrl":"https://ucarecdn.com/98e6e1d6-7b83-48b1-be11-fa3a47be9461/","title":"Climbing","type":"SPORT"},"Favorites:{\"uuid\":\"7f0d56d0-9a70-4dc7-a2c1-b0b3996ca764\"}":{"__typename":"Favorites","uuid":"7f0d56d0-9a70-4dc7-a2c1-b0b3996ca764","photoUrl":"https://ucarecdn.com/97ab3165-daee-43ea-977f-84bdef5056b5/","title":"Olivia Dean","type":"ARTIST"},"Favorites:{\"uuid\":\"7e42878e-1722-4fd6-a777-e66ac37e36c2\"}":{"__typename":"Favorites","uuid":"7e42878e-1722-4fd6-a777-e66ac37e36c2","photoUrl":"https://ucarecdn.com/75aa5402-9cbd-4923-9b64-4defba1d4bf2/","title":"The Art of Loving","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c2ec5e58-6108-4437-be81-938fbc37504a\"}":{"__typename":"DeepDives","uuid":"c2ec5e58-6108-4437-be81-938fbc37504a","content":"\u003cp\u003eInstead of breaking classes into 45 mins and have 8 lessons per day, each class should be made 1 hour 15mins and less sessions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"cbb79a68-d1df-4320-be75-29f26ffd9e80\"}":{"__typename":"DeepDives","uuid":"cbb79a68-d1df-4320-be75-29f26ffd9e80","content":"\u003cp\u003eMentorship matters to me because it’s one of the most powerful ways to create lasting impact. I’ve seen how a single mentor can help a student gain confidence, discover their interests, and realize they’re capable of more than they thought. As someone who’s benefited from supportive mentors myself, I want to be that guiding presence for others—someone who listens, encourages, and helps turn curiosity into action.\u003c/p\u003e\u003cp\u003eThrough teaching \u003cstrong\u003eAP Statistics\u003c/strong\u003e and working as a \u003cstrong\u003eCS peer tutor\u003c/strong\u003e, I’ve learned that mentorship isn’t just about explaining content—it’s about helping students develop \u003cstrong\u003eclarity, resilience, and ownership\u003c/strong\u003e of their learning. Watching a student go from confusion to excitement, or from hesitation to building their first project, is what inspires me most.\u003c/p\u003e\u003cp\u003eTo me, mentorship is not a one-way transfer of knowledge—it’s a \u003cstrong\u003ecollaborative journey\u003c/strong\u003e where both mentor and mentee grow together. It’s about helping students see the bigger picture, connect their passions to real-world opportunities, and build the confidence to create meaningful change.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"3b6680be-dac8-4fff-8c37-e5514230a322\"}":{"__typename":"DeepDives","uuid":"3b6680be-dac8-4fff-8c37-e5514230a322","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to build \u003cstrong\u003eaccessible, technology-driven learning systems\u003c/strong\u003e that empower students—especially those in underrepresented or underserved communities—to learn confidently and creatively. I want to combine \u003cstrong\u003eAI\u003c/strong\u003e, \u003cstrong\u003eeducation\u003c/strong\u003e, and \u003cstrong\u003ehuman-centered design\u003c/strong\u003e to create platforms that adapt to each learner’s needs, helping them not only master skills but also discover their passions.\u003c/p\u003e\u003cp\u003eBeyond technology, I hope to inspire a generation of young people to see themselves as \u003cstrong\u003ebuilders and problem-solvers\u003c/strong\u003e—to believe they can use their ideas to make a real difference. If even a few of my students go on to create change in their own ways, I’ll feel I’ve made a meaningful impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"58a80948-789e-469e-95a6-4dc63f2abddd\"}":{"__typename":"DeepDives","uuid":"58a80948-789e-469e-95a6-4dc63f2abddd","content":"\u003cp\u003eI chose to major in \u003cstrong\u003eComputer Science\u003c/strong\u003e because I’ve always been fascinated by how technology can turn ideas into real solutions. Coding feels like a creative language—it allows me to build tools that solve problems, tell stories, and make an impact at scale.\u003c/p\u003e\u003cp\u003eOver time, I’ve become especially drawn to how \u003cstrong\u003eAI and data\u003c/strong\u003e can be used to make learning more adaptive and inclusive. Through projects like \u003cstrong\u003eChatSign\u003c/strong\u003e and research in \u003cstrong\u003eAI-driven education\u003c/strong\u003e, I’ve seen how computer science can empower communities and open doors for others. Choosing this major has given me both the \u003cstrong\u003etechnical foundation\u003c/strong\u003e and the \u003cstrong\u003ecreative freedom\u003c/strong\u003e to explore how technology can make the world more connected, efficient, and equitable.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"98c3ab74-1074-4ebe-9dff-eb54775b60d0\"}":{"__typename":"School","uuid":"98c3ab74-1074-4ebe-9dff-eb54775b60d0","name":"Chongqing Yucai International School","city":"Chongqing","type":"HIGH","state":"China","country":"China","zip":"400069"},"Education:{\"uuid\":\"4a6846c1-e010-402d-bf5f-9ba026376c5e\"}":{"__typename":"Education","uuid":"4a6846c1-e010-402d-bf5f-9ba026376c5e","school":{"__ref":"School:{\"uuid\":\"98c3ab74-1074-4ebe-9dff-eb54775b60d0\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2439dcda-39cc-4bff-b046-40e2be53598f\"}":{"__typename":"School","uuid":"2439dcda-39cc-4bff-b046-40e2be53598f","name":"New York University ","city":"New York","type":"COLLEGE","state":"New York","country":"America","zip":"10012"},"Education:{\"uuid\":\"17d0aa6b-239c-45f5-a587-c29bb7a2f5e1\"}":{"__typename":"Education","uuid":"17d0aa6b-239c-45f5-a587-c29bb7a2f5e1","school":{"__ref":"School:{\"uuid\":\"2439dcda-39cc-4bff-b046-40e2be53598f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"cc0f53aa-90bf-451b-a783-04c9e4c4078c\"}":{"__typename":"MentorPublicProfile","uuid":"cc0f53aa-90bf-451b-a783-04c9e4c4078c","displayName":"Vanessa W.","slug":"yanlin-wu","biography":"\u003ch3\u003e\u003cstrong\u003eProfile Bio\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eHi there! I’m \u003cstrong\u003eVanessa Wu\u003c/strong\u003e, a Computer Science major with minors in Mathematics and Economics at \u003cstrong\u003eNew York University\u003c/strong\u003e. I’m passionate about building technology that actually helps people and guiding students as they explore coding, data, and AI in ways that feel creative and meaningful.\u003c/p\u003e\u003cp\u003eOver the past few years, I’ve worked across AI research, product development, and education. I helped build \u003cstrong\u003eChatSign\u003c/strong\u003e, a two-way sign-language translation app that became a \u003cstrong\u003efinalist out of 200+ proposals\u003c/strong\u003e in the Abu Dhabi Ma’an Social Incubator. As part of that project, I interviewed 30+ Deaf and hard-of-hearing community members, identified key communication challenges, and designed early prototypes to improve accessibility.\u003c/p\u003e\u003cp\u003eProfessionally, I interned as a \u003cstrong\u003eProduct Manager at Tencent Cloud\u003c/strong\u003e, where I worked on AI-powered knowledge systems, user-habit analytics, and internal dashboards used by enterprise teams. I also have experience in \u003cstrong\u003edata analysis\u003c/strong\u003e and \u003cstrong\u003eAI-driven adaptive learning\u003c/strong\u003e, combining research with hands-on engineering.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e🎓 \u003cstrong\u003eMentorship \u0026amp; Teaching Experience\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI’ve spent the last two years mentoring and supporting students—from high schoolers to undergraduates—helping them build confidence in STEM, one step at a time.\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHigh School Math Tutor (3 years):\u003c/strong\u003e Tutored Grades 9–12, including but not limited to \u003cstrong\u003eIB Math\u003c/strong\u003e, \u003cstrong\u003eA-Level Math\u003c/strong\u003e, \u003cstrong\u003eAP Calculus\u003c/strong\u003e, and \u003cstrong\u003eSAT math\u003c/strong\u003e helping students strengthen fundamentals, build exam strategy, and achieve strong results.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAP Statistics Tutor (2 years):\u003c/strong\u003e Helped students master AP content with clear intuition, problem breakdown, and real-world examples.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eNYU Computer Science Peer Tutor (1.5 years):\u003c/strong\u003e Guided students through debugging, algorithms, Unix tools, and project design; helped them turn confusion into clarity.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences taught me how to meet students where they are, simplify difficult ideas, and create a supportive space where they can grow through curiosity—not pressure.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e💡 \u003cstrong\u003eWhat I Offer as a Mentor\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eI love helping students discover what excites them and turning that spark into a real project. I mentor students in:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion Projects\u003c/strong\u003e that combine technology, creativity, and social impact\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCoding fundamentals\u003c/strong\u003e (Python and project-based learning)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAI/ML exploration\u003c/strong\u003e, including beginner-friendly hands-on projects\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAcademic support\u003c/strong\u003e in Computer Science, coding, AI, and AP Statistics\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eMy approach is patient, structured, and encouraging. Whether a student wants to build their first app, explore AI, or prepare a science-fair project, I guide them from brainstorming to a polished final product—making sure they understand both \u003cem\u003ehow\u003c/em\u003e and \u003cem\u003ewhy\u003c/em\u003e things work.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e🌱 \u003cstrong\u003eBeyond the Classroom\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003eOutside academics, I enjoy traveling, rock climbing, gym training, and creative storytelling through technology. I also love thinking about AI ethics, design, and how tech can support different communities.\u003c/p\u003e\u003cp\u003eIf your child is curious about coding, AI, or launching their own project, I’d love to help them turn that curiosity into something real and meaningful.\u003c/p\u003e","teachingVideoPlaybackId":"km7NthYemHarSQ114DhCHshV1Om1SOqr7oS3eV1fjE8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is co-founding \u003cstrong\u003eChatSign\u003c/strong\u003e, a two-way sign language translation app designed to help bridge communication between Deaf and hearing communities. Our team started with a simple idea: technology should make the world more inclusive. We spent months researching, prototyping, and testing with real users — and eventually, ChatSign was selected as one of \u003cstrong\u003e13 finalists out of over 200 proposals\u003c/strong\u003e by the \u003cstrong\u003eAbu Dhabi Ma’an Social Incubator\u003c/strong\u003e. What makes me proud isn’t just the recognition — it’s seeing how a small idea turned into something that could make a real difference in people’s lives. It taught me how powerful technology can be when guided by empathy, and it shaped how I approach every project I take on: with curiosity, persistence, and a focus on impact.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"7387b395-9f2e-4446-9ffa-494c41f3f2c6\"}"},{"__ref":"Favorites:{\"uuid\":\"7f0d56d0-9a70-4dc7-a2c1-b0b3996ca764\"}"},{"__ref":"Favorites:{\"uuid\":\"7e42878e-1722-4fd6-a777-e66ac37e36c2\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c2ec5e58-6108-4437-be81-938fbc37504a\"}"},{"__ref":"DeepDives:{\"uuid\":\"cbb79a68-d1df-4320-be75-29f26ffd9e80\"}"},{"__ref":"DeepDives:{\"uuid\":\"3b6680be-dac8-4fff-8c37-e5514230a322\"}"},{"__ref":"DeepDives:{\"uuid\":\"58a80948-789e-469e-95a6-4dc63f2abddd\"}"}],"active":true,"pr
