xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"2dc410fc-f31c-4106-8729-63b732b16ada\"}":{"__typename":"Education","uuid":"2dc410fc-f31c-4106-8729-63b732b16ada","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Molecular, Cell, \u0026 Developmental Biology","degree":"Bachelor of Science"},"School:{\"uuid\":\"a4127478-b536-4a5a-8f9c-476355f5096c\"}":{"__typename":"School","uuid":"a4127478-b536-4a5a-8f9c-476355f5096c","name":"Mayfield Senior School","city":"Pasadena","type":"HIGH","state":"California","country":"United States","zip":"91105"},"Education:{\"uuid\":\"f90f7808-5c5f-4b65-97cd-88c3b8df75c8\"}":{"__typename":"Education","uuid":"f90f7808-5c5f-4b65-97cd-88c3b8df75c8","school":{"__ref":"School:{\"uuid\":\"a4127478-b536-4a5a-8f9c-476355f5096c\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"Testimonial:a212efb9-5718-459d-9748-bf63947ef579":{"__typename":"Testimonial","id":"a212efb9-5718-459d-9748-bf63947ef579","text":"Halle is very supportive and encouraging of Molly and understands her objectives.","date":"2025-05-29 23:00:43.227+00","rating":5,"endorser":{"__typename":"Endorser","name":"Ali Marshall","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"0edc0229-85a9-41d5-81fb-a6bd9ca209a6\"}":{"__typename":"MentorPublicProfile","uuid":"0edc0229-85a9-41d5-81fb-a6bd9ca209a6","displayName":"Halle V.","slug":"halle-villalobos","biography":"\u003cp\u003eHi! I’m Halle, a Master’s student in Biostatistics at the UCLA Fielding School of Public Health. I recently graduated from UCLA with a B.S. in Molecular, Cell, and Developmental Biology [MCDB], and I’m currently on the path toward medical school. My goal is to become a compassionate, research-informed physician who combines clinical care with analytical thinking to make a meaningful impact on patients' lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI chose to major in MCDB to understand the biological foundations of health and disease, and I’m pursuing a degree in Biostatistics to build the data-driven skills essential for modern medicine and public health. This combination allows me to approach healthcare with both scientific depth and quantitative precision.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my undergraduate years, I sought out opportunities to grow both in and out of the classroom. I volunteered at the Ronald Reagan UCLA Medical Center in various units, but I especially loved my time in the Pediatric ICU, where I had the chance to interact with patients and observe medical procedures firsthand. Working closely with doctors, nurses, and families deepened my desire to pursue a career in medicine and affirmed my passion for patient-centered care.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my time as an undergraduate at UCLA, I also became a Learning Assistant for multivariable calculus, supporting over 150 students and helping them engage with difficult material through active learning techniques. That experience sparked my love for education, which I’ve continued as a Teaching Assistant for an undergraduate introductory biology lab. In that role, I lead hands-on experiments and guide over 70 students per quarter in building scientific confidence and curiosity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eToday, I tutor a range of subjects including math, chemistry, physics, biology, and creative writing. I aim to create a supportive, engaging learning environment that meets students where they are and helps them grow into confident, capable learners. Whether you're navigating complex equations or crafting your next essay, I’m here to help your child succeed!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Molecular, Cell, \u0026 Developmental Biology","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/50603754-f22d-4c23-9192-787c8bfba717/-/preview/-/format/jpg/","https://ucarecdn.com/9b1f8e83-3d2c-43a0-b5e7-2c052195e8f5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2dc410fc-f31c-4106-8729-63b732b16ada\"}"},{"__ref":"Education:{\"uuid\":\"f90f7808-5c5f-4b65-97cd-88c3b8df75c8\"}"}],"hiredAt":"2022-08-10T04:51:52.000Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing"],"communityBadges":["https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:a212efb9-5718-459d-9748-bf63947ef579"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"halle-villalobos\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0edc0229-85a9-41d5-81fb-a6bd9ca209a6\"}"}}},"_sentryTraceData":"cd09e077afd44ba0b0445c1271b8dcd5-9b5e129d6e630745-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=cd09e077afd44ba0b0445c1271b8dcd5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]",
