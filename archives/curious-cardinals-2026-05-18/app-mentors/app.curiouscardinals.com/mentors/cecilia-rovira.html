Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c1789ab1-e1ef-4706-ad0a-fea1f17c3f9e\"}":{"__typename":"DeepDives","uuid":"c1789ab1-e1ef-4706-ad0a-fea1f17c3f9e","content":"\u003cp\u003eNever let others dim your light!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1cc2b092-f82f-4b36-963b-73371408c473\"}":{"__typename":"DeepDives","uuid":"1cc2b092-f82f-4b36-963b-73371408c473","content":"\u003cp\u003eDesigning a water bottle brand for diabetes patients with a group of Penn students and helping doctors at the children hospital develop VR training equipment for complex surgeries in order to help other doctors in Tanzania!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"df30284e-e3e7-4803-8718-07761cdb38da\"}":{"__typename":"School","uuid":"df30284e-e3e7-4803-8718-07761cdb38da","name":"Academia del Perpetuo Socorro","city":"San Juan","type":"HIGH","state":"San Juan","country":"Puerto Rico","zip":"00907"},"Education:{\"uuid\":\"d3ed8d60-f95d-4b5e-827a-0d8d969991bc\"}":{"__typename":"Education","uuid":"d3ed8d60-f95d-4b5e-827a-0d8d969991bc","school":{"__ref":"School:{\"uuid\":\"df30284e-e3e7-4803-8718-07761cdb38da\"}"},"startYear":"2012","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"d545442f-2725-49bc-8762-a1492a0c3741\"}":{"__typename":"Education","uuid":"d545442f-2725-49bc-8762-a1492a0c3741","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"62c35ed5-8c6a-4414-9040-bf5e090ef6f6\"}":{"__typename":"MentorPublicProfile","uuid":"62c35ed5-8c6a-4414-9040-bf5e090ef6f6","displayName":"Cecilia R.","slug":"cecilia-rovira","biography":"\u003cp\u003eHi, I'm Cecilia — a freshman studying Psychology at the University of Pennsylvania, originally from Puerto Rico, and hoping to minor in Health Communications, Neuroscience, and Healthcare Management!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm a firm believer that the best learning happens when a student feels genuinely seen. My goal isn't just to help students understand material — it's to help them build the confidence to tackle challenges in a way that works for \u003cem\u003ethem\u003c/em\u003e. Every student has a different brain, a different story, and a different way of clicking with information, and I think finding that is half the magic.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs an extremely visual learner, I always struggled with standard textbooks and traditional studying. But I never let that stop me. I started making my own videos on topics, drawing out scenes from books to memorize them, and creating study systems that actually fit my brain. That experience is exactly what shapes the way I teach — and why I love helping students find \u003cem\u003etheir\u003c/em\u003e version of that click.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also have Type 1 diabetes, which in high school led me to co-found T1DOSE, a platform dedicated to sharing the realities of T1D life. We interviewed young athletes and professionals, raised funds through sports tournaments, and hosted events for younger kids in the diabetes community. It reminded me early on how much a supportive community can change someone's experience — in health and in learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not studying, you'll find me out on a run, painting with watercolors, junk journaling, or buried in a good autobiography. I love making art in any form — whether it's sketching, collaging, or just doodling through a problem. There's something about creating something from scratch that teaches you more about patience and problem-solving than any textbook can. I also love puzzles, trying new food, and saying yes to things that scare me a little. I genuinely think curiosity is a superpower, and I try to bring that energy into every session.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI work with students in K–5 Math, Pre-Algebra, Algebra I \u0026amp; II, Biology, Spanish, Reading, Writing, College Essays, Creative Writing, Visual Arts, Public Speaking, Executive Function, Academic Coaching, Business \u0026amp; Entrepreneurship, and more. No judgment, just progress.\u003c/p\u003e\u003cp\u003eI especially love working with students who might feel like school just \"isn't for them\" — because I truly believe the right mentor can change that story. If you're looking for someone who shows up as a real human who genuinely cares, I'd love to connect!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"OomNeY6BHcISLtjhtqhck2VUcNFt010013RJI4Sq02cvfQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2d7eb532-106c-4af8-8dee-b060f53cade7\"}"},{"__ref":"Favorites:{\"uuid\":\"11acfc79-320c-41b3-ad5f-90099dcd8b51\"}"},{"__ref":"Favorites:{\"uuid\":\"bf652fd3-ed4a-4996-a83c-ba716e8211ec\"}"}],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"620ad768-2746-47c9-bb0
