xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"648b8c0f-800e-4887-84f4-b752d770571b\"}":{"__typename":"Favorites","uuid":"648b8c0f-800e-4887-84f4-b752d770571b","photoUrl":"https://ucarecdn.com/738f6048-3a68-4f48-a2be-0bff8e62f1cd/","title":"The Melodic Blue","type":"ALBUM"},"Favorites:{\"uuid\":\"18b3c376-6ca0-48bb-ae45-f4c1adb6eb6b\"}":{"__typename":"Favorites","uuid":"18b3c376-6ca0-48bb-ae45-f4c1adb6eb6b","photoUrl":"https://ucarecdn.com/be22e081-75df-4f9d-a195-8bc06908f1e6/","title":"Harrison Ford","type":"ACTOR"},"Favorites:{\"uuid\":\"2ccbabc4-bcfe-47d5-a8cd-984a6a5b1bb8\"}":{"__typename":"Favorites","uuid":"2ccbabc4-bcfe-47d5-a8cd-984a6a5b1bb8","photoUrl":"https://ucarecdn.com/16aa54a3-dc15-495b-a726-637b280fff2e/","title":"J.J. Watt","type":"ATHLETE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"478f0d16-d06d-488c-ab56-4485f7239704\"}":{"__typename":"DeepDives","uuid":"478f0d16-d06d-488c-ab56-4485f7239704","content":"\u003cp\u003eMentorship matters to me because I know how powerful it can be to have someone who believes in you, challenges you, and helps you see what you’re capable of. A good mentor can make a big goal feel possible, and I want to be that kind of support for students as they grow in both confidence and creativity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ae1e38d0-bda0-4802-98d9-de680589f660\"}":{"__typename":"DeepDives","uuid":"ae1e38d0-bda0-4802-98d9-de680589f660","content":"\u003cp\u003eI’d tell my middle and high school self not to be afraid of having a lot of different interests. For a while, I think I felt pressure to fit into one lane, but some of the most meaningful parts of my life have come from leaning into all of them - athletics, academics, law, and storytelling. I’d also remind myself that growth takes time, and that confidence usually comes from doing the work, not from having everything figured out right away.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"48603ff0-5893-4d15-b659-879f00f4c7a8\"}":{"__typename":"DeepDives","uuid":"48603ff0-5893-4d15-b659-879f00f4c7a8","content":"\u003cp\u003eMy greatest source of motivation is the desire to keep growing and see how far I can push myself. I’m motivated by challenging goals, whether that’s in academics, athletics, or creative work, and by the idea that consistent effort can turn something difficult into something meaningful. I also care a lot about making the most of the opportunities I’ve been given and setting an example for others through the way I work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"816af4d5-82e9-4d67-8556-0d3dde9ba16b\"}":{"__typename":"DeepDives","uuid":"816af4d5-82e9-4d67-8556-0d3dde9ba16b","content":"\u003cp\u003eIn my spare time, I love being outdoors, especially back home in Alaska. Some of my favorite things to do are fishing, hunting, backcountry skiing, snowmobiling, hiking, and camping. More than anything, I just love spending time in the mountains - that’s where I feel the most grounded and clear-headed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9985bf09-567b-4636-8295-2d6f11f9d426\"}":{"__typename":"School","uuid":"9985bf09-567b-4636-8295-2d6f11f9d426","name":"Dimond High School","city":"Anchorage","type":"HIGH","state":"Alaska","country":"United States","zip":"99502"},"Education:{\"uuid\":\"4471dfc2-cee2-40a1-89e7-f752770d06d4\"}":{"__typename":"Education","uuid":"4471dfc2-cee2-40a1-89e7-f752770d06d4","school":{"__ref":"School:{\"uuid\":\"9985bf09-567b-4636-8295-2d6f11f9d426\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"f710c506-8fa9-4f5e-b390-1fb80ab53bb2\"}":{"__typename":"Education","uuid":"f710c506-8fa9-4f5e-b390-1fb80ab53bb2","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Performing \u0026 Media Arts and Government","degree":null},"MentorPublicProfile:{\"uuid\":\"abe127c9-c1af-49de-9c38-0833f8a0304e\"}":{"__typename":"MentorPublicProfile","uuid":"abe127c9-c1af-49de-9c38-0833f8a0304e","displayName":"James R.","slug":"james-reinbold","biography":"\u003cp\u003eHi! I’m James, a senior at Cornell University double-majoring in \u003cstrong\u003ePerforming \u0026amp; Media Arts (Acting/Film)\u003c/strong\u003e and \u003cstrong\u003eGovernment\u003c/strong\u003e, and I help students turn personal ideas into compelling creative projects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStorytelling has been a huge part of my life for years, both on stage and on screen. At Cornell, I’ve:\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePerformed in \u003cstrong\u003eseven theatrical productions\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCo-created two short films\u003c/strong\u003e, including \u003cem\u003eAthlete\u003c/em\u003e, a film exploring the pressures of Division I athletics that is currently circulating in film festivals.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eActed in \u003cstrong\u003efour short films\u003c/strong\u003e.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWritten \u003cstrong\u003efour original screenplays\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI know how intimidating it can feel to turn creative ideas into real projects, and I’m here to help you push past that uncertainty and discover what you’re capable of creating.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eProjects we can do\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI mentor students who want to explore:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eShort film production\u003c/strong\u003e from story idea to final cut.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStory development\u003c/strong\u003e, including finding themes from personal experiences and building them into a filmable concept.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eScreenwriting\u003c/strong\u003e, including structure, dialogue, and character development.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCinematography\u003c/strong\u003e, including shot composition, camera angles, lighting, visual storytelling, and planning how each shot supports the emotion of the scene.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eActing and performance\u003c/strong\u003e, especially scene work, emotional beats, and character choices.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDirecting\u003c/strong\u003e, including working with actors, shaping performances, planning scenes, blocking, and bringing a script to life on set.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eEditing\u003c/strong\u003e, including assembling a rough cut, pacing, transitions, sound design, music integration, and refining the final story.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI’m especially helpful for students who simply have a deep love for film and storytelling and need guidance in breaking their creative ideas and goals into clear, manageable steps.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eMy mentorship style\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eI like to make sessions collaborative, creative, and hands-on. I’m not interested in just giving advice or lecturing. I want to work side by side with students to help them create something they’re genuinely proud of. A session with me might include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming a story idea based on your own experiences and interests.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a protagonist, conflict, and a clear narrative arc.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLearning the fundamentals of screenplay formatting and writing dialogue.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHands-on camera work to understand shot composition, lighting, and framing techniques.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorking through various acting methods, tools for emotional clarity, and authentic performance.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eApply skills learned about screenwriting, cinematography, and acting to direct and shoot the short film.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAssembling the film through the use of editing tools such as Adobe Premiere, DaVinci Resolve, and Pro Tools.\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eBecause I’ve worked across acting, writing, and film, I can help students think about the full picture of a project, not just one piece of it.\u003c/p\u003e\u003cbr\u003e\u003ch3\u003e\u003cstrong\u003eA little more about me\u003c/strong\u003e\u003c/h3\u003e\u003cbr\u003e\u003cp\u003eOutside of film, I’m passionate about football, law, and the outdoors. At Cornell, I’ve competed as a \u003cstrong\u003eDivision I football player for all four years\u003c/strong\u003e, started on both sides of the ball during my career, and in 2025 was named a \u003cstrong\u003eFirst-Team Academic All-American\u003c/strong\u003e (first in program history), a \u003cstrong\u003eSecond-Team All-Ivy League selection\u003c/strong\u003e, a \u003cstrong\u003eWilliam V. Campbell Trophy semi-finalist\u003c/strong\u003e, and the recipient of Cornell Football’s \u003cstrong\u003eScholar-Athlete Award\u003c/strong\u003e for the highest GPA on the team.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMoreover, I have a strong background in government and law. I’ve worked at leading law firms, including \u003cstrong\u003eTroutman Pepper Locke\u003c/strong\u003e in New York City and \u003cstrong\u003eBirch Horton Bittner \u0026amp; Cherot\u003c/strong\u003e in Anchorage, and I served as a law clerk for a district court judge at the \u003cstrong\u003eAnchorage Trial Court\u003c/strong\u003e.\u0026nbsp;\u003c/p\u003e\u003cp\u003eFurthermore, I’m proudly a born and raised \u003cstrong\u003eAlaskan\u003c/strong\u003e, and I love anything outdoors, especially fishing, hunting, backcountry skiing, snowmobiling, hiking, and camping. I try to spend as much time in the mountains as I can!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLiving at the intersection of so many different passions has made me especially excited to work with students who are trying to bring multiple sides of themselves into one meaningful project. In my own creative work, I’ve drawn on my passion for football, my experience in law, and my love for Alaska in three different screenplays I’ve written. If you want to turn your own interests and experiences into a creative project, I’d love to help!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Up00kkiOTo00mxE4wu00uSdd9NojbkGojTvyee9fxbTKHs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"648b8c0f-800e-4887-84f4-b752d770571b\"}"},{"__ref":"Favorites:{\"uuid\":\"18b3c376-6ca0-48bb-ae45-f4c1adb6eb6b\"}"},{"__ref":"Favorites:{\"uuid\":\"2ccbabc4-bcfe-47d5-a8cd-984a6a5b1bb8\"}"}],"causesSupported":[],"major":"Performing \u0026 Media Arts and Government","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"478f0d16-d06d-488c-ab56-4485f7239704\"}"},{"__ref":"DeepDives:{\"uuid\":\"ae1e38d0-bda0-4802-98d9-de680589f660\"}"},{"__ref":"DeepDives:{\"uuid\":\"48603ff0-5893-4d15-b659-879f00f4c7a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"816af4d5-82e9-4d67-8556-0d3dde9ba16b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/11e036e5-6708-4e96-b206-26e841118dfd/-/preview/-/format/jpg/","https://ucarecdn.com/d1597d50-d811-41c4-8baa-8685f65597f0/-/preview/-/format/jpg/","https://ucarecdn.com/1d124de6-3d73-410a-a07d-83fe7bf6d9a6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4471dfc2-cee2-40a1-89e7-f752770d06d4\"}"},{"__ref":"Education:{\"uuid\":\"f710c506-8fa9-4f5e-b390-1fb80ab53bb2\"}"}],"hiredAt":"2026-03-29T22:55:01.148Z","topics":["Creative Writing","Film / Theater","Video / Photography","History Project","Sports Journalism","Music","Law / Government / Policy","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"james-reinbold\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"abe127c9-c1af-49de-9c38-0833f8a0304e\"}"}}},"_sentryTraceData":"50ba4355ef114952b40e2f008fa5494f-b173b01515973091-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=50ba4355ef114952b40e2f008fa5494f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"james-reinbold"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
