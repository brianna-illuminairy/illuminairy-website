xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bfb9a033-b35c-46cf-83cd-d73a601aafe4\"}":{"__typename":"Favorites","uuid":"bfb9a033-b35c-46cf-83cd-d73a601aafe4","photoUrl":"https://ucarecdn.com/7436ad5a-fb7a-458d-9a26-6b09e3470bf6/","title":"Skyrim","type":"GAME"},"Favorites:{\"uuid\":\"0bf908f6-dede-4be5-83e6-80b1c30b929e\"}":{"__typename":"Favorites","uuid":"0bf908f6-dede-4be5-83e6-80b1c30b929e","photoUrl":"https://ucarecdn.com/a4c99e99-b1fc-4b43-bc0b-95b7979c7e85/","title":"Arrival","type":"MOVIE"},"Favorites:{\"uuid\":\"e562fb76-d6f9-48a0-b55e-85eb835179bd\"}":{"__typename":"Favorites","uuid":"e562fb76-d6f9-48a0-b55e-85eb835179bd","photoUrl":"https://ucarecdn.com/cfb0c2b4-497b-491a-bf12-a5273832c64c/","title":"Let It Happen - Tame Impala","type":"SONG"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"a28003aa-fad2-49bc-b183-cb23c0a8f964\"}":{"__typename":"DeepDives","uuid":"a28003aa-fad2-49bc-b183-cb23c0a8f964","content":"\u003cp\u003eI didn't always value fitness, and there was a time when I couldn't imagine ever enjoying exercise. Eventually I decided that I needed a change, and I've since fallen in love with the gym— now it's often the highlight of my day! \u003cbr\u003e\u003cbr\u003eIn a way, working out has taught me more about discipline, determination, and hard work than anything else, and I'm proud to know that it all came from my own effort.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d945007a-5a02-4238-b41a-e01faf1ec06e\"}":{"__typename":"DeepDives","uuid":"d945007a-5a02-4238-b41a-e01faf1ec06e","content":"\u003cp\u003eI chose my major because I believe in character development. Any good story in film, TV, or otherwise has to have its characters change in order to be successful, and people are no different! I've changed immensely in my life based on decisions of what I want to be, and I want to inspire others to be the main characters in their own story.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"6f279ef8-4e0e-499c-84a8-9740c543f1fe\"}":{"__typename":"School","uuid":"6f279ef8-4e0e-499c-84a8-9740c543f1fe","name":"The Kinkaid School","city":"Houston","type":"HIGH","state":"TX","country":"United States","zip":"77024"},"Education:{\"uuid\":\"e4ae7f00-3161-4185-b2d4-c3f25d42436f\"}":{"__typename":"Education","uuid":"e4ae7f00-3161-4185-b2d4-c3f25d42436f","school":{"__ref":"School:{\"uuid\":\"6f279ef8-4e0e-499c-84a8-9740c543f1fe\"}"},"startYear":"2007","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"241a0511-585c-4eaf-a493-ccec700aa277\"}":{"__typename":"Education","uuid":"241a0511-585c-4eaf-a493-ccec700aa277","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Radio, Television, Film (RTVF), Business Institutions","degree":null},"MentorPublicProfile:{\"uuid\":\"574a3c7d-994f-4234-a126-6745c257b01e\"}":{"__typename":"MentorPublicProfile","uuid":"574a3c7d-994f-4234-a126-6745c257b01e","displayName":"Matthew M.","slug":"matthew-moseley","biography":"\u003cp\u003eHey! My name is Matthew, and I'm a film and business student at Northwestern University— originally from Houston, Texas. I knew I had to work in Hollywood ever since I saw \u003cem\u003eGame of Thrones\u003c/em\u003e in high school, and haven't looked back since!\u003cbr\u003e\u003cbr\u003eI started shooting videos in my eighth grade \"TV\" class, and learned the basics of screenwriting, shot listing, cinematography, sound recording, editing, and directing in high school (I even did some acting too!). It's my passion to guide others through this same introductory stage, plus all of the tips from college that I wish I knew when I started. I'm grateful to have been apart of the 2021 All American High School Film Festival Official Selection for my short film, \u003cem\u003eMidnight Snack\u003c/em\u003e.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Northwestern, my organizational skills, self-discipline, and attention to detail have led me to the business side of filmmaking. I'm proud to have produced the feature length film MIXED SIGNALS with the student-run production company Applause for a Cause, and to be the Co-President of Northwestern's oldest student-run production company, Studio 22. I'm also a campus ambassador for Warner Bros. Pictures, I've worked for an Emmy-winning talent manager, I've interned at Universal Television, and I'll begin work as an Agent Trainee at United Talent Agency after graduation!\u003cbr\u003e\u003cbr\u003eOtherwise, I'm passionate about living a healthy lifestyle, self-improvement, growth mindset, reading, absolutely any HBO original series, and Texas BBQ! In my free time you can find me lifting weights, scrolling through Beli, catching up on industry news, and counting down the days until George R.R. Martin releases \u003cem\u003eThe Winds of Winter\u003c/em\u003e— I need my signed copy!\u003c/p\u003e","teachingVideoPlaybackId":"qV01klhZUhMDwLO9CPSwZHfgqm02c2WnTeyclZhC3Ku9o","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI made a feature length movie with my friends in college, and organized the premiere at our local AMC. It took us a whole year to go from script-selection to screening, but at the end we sold out the theater, and simultaneously raised over $3000 for a local beneficiary called 826 Chicago!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"bfb9a033-b35c-46cf-83cd-d73a601aafe4\"}"},{"__ref":"Favorites:{\"uuid\":\"0bf908f6-dede-4be5-83e6-80b1c30b929e\"}"},{"__ref":"Favorites:{\"uuid\":\"e562fb76-d6f9-48a0-b55e-85eb835179bd\"}"}],"causesSupported":[],"major":"Radio, Television, Film (RTVF), Business Institutions","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a28003aa-fad2-49bc-b183-cb23c0a8f964\"}"},{"__ref":"DeepDives:{\"uuid\":\"d945007a-5a02-4238-b41a-e01faf1ec06e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ed03d29a-7a8b-4ecf-924a-0b129079ae03/-/preview/-/format/jpg/","https://ucarecdn.com/2c3f14fa-8d8e-40cd-b02b-d9221c066a89/-/preview/-/format/jpg/","https://ucarecdn.com/f81e578f-d4bd-450f-9eec-ea2aaf10e034/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e4ae7f00-3161-4185-b2d4-c3f25d42436f\"}"},{"__ref":"Education:{\"uuid\":\"241a0511-585c-4eaf-a493-ccec700aa277\"}"}],"hiredAt":"2023-08-09T04:13:53.723Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Writing","French","Academic Coaching","Executive Function","Reading","Creative Writing","K-6 Storybook","Film / Theater","Video / Photography"],"communityBadges":["https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\
