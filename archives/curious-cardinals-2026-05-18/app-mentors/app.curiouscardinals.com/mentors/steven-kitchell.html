xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f5103670-a627-4913-852e-7c2954795fd1\"}":{"__typename":"Favorites","uuid":"f5103670-a627-4913-852e-7c2954795fd1","photoUrl":"https://ucarecdn.com/be05116d-ce1c-44ff-b404-2a4f3f46a9aa/","title":"Chicago Bears","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"6162e6d5-dbe2-4dcb-835c-5900f8d6b52d\"}":{"__typename":"Favorites","uuid":"6162e6d5-dbe2-4dcb-835c-5900f8d6b52d","photoUrl":"https://ucarecdn.com/2615cfdb-ae1d-48ff-a646-e512a98bdb93/","title":"The Martian","type":"BOOK"},"Favorites:{\"uuid\":\"f8e2dc43-b6d7-4730-9ba8-f47f5483e4e0\"}":{"__typename":"Favorites","uuid":"f8e2dc43-b6d7-4730-9ba8-f47f5483e4e0","photoUrl":"https://ucarecdn.com/c1be802c-843c-4bf7-809b-f6ad8faeac07/","title":"Luke Combs","type":"ARTIST"},"CausesSupported:{\"uuid\":\"fcc3f494-e68b-4aaa-9d64-0d2bb0f60304\"}":{"__typename":"CausesSupported","uuid":"fcc3f494-e68b-4aaa-9d64-0d2bb0f60304","name":"Filter of Hope","description":"\u003cp\u003eI went to the Dominican Republic with Filter of Hope this past Spring Break!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/4c3d32e8-a84b-4ac3-8440-6063641ba43f/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"824519cc-9f34-41ea-8b8b-c987cc3d4080\"}":{"__typename":"DeepDives","uuid":"824519cc-9f34-41ea-8b8b-c987cc3d4080","content":"\u003cp\u003eI would tell my high school self to spend more time on the things that I’m passionate about. In high school, I tried to do everything just for the sake of achievement, and I was super busy. I wish I spent more time going deeper in the areas that I was really passionate about. Thankfully, I’ve had a great chance to do this in college!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"99376a2e-1df7-42c8-88c3-6a9852a825b1\"}":{"__typename":"DeepDives","uuid":"99376a2e-1df7-42c8-88c3-6a9852a825b1","content":"\u003cp\u003eI chose my major (Applied Math) because I had no idea what I wanted to do, but I knew I loved math! After taking calculus, I had become enamored by the idea of using math to solve real world problems… I just wasn’t sure which problems. After freshman year I had the opportunity to work with a professor doing Computational Fluid Dynamics research, and felt like using simulation to solve aerospace problems was a pretty cool application of math, so I added a Masters in Mechanical Engineering!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"5cddaf70-eaa0-4fc6-a220-e903a9cbe951\"}":{"__typename":"DeepDives","uuid":"5cddaf70-eaa0-4fc6-a220-e903a9cbe951","content":"\u003cp\u003eLast year I started a Hybrid Rocket team at Northwestern with a few other students. It’s been a unique challenge to use all that we have learned in lecture to try and build a real rocket engine, but a super rewarding experience! I’m excited to see where the team will go in the future!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"32e29c28-c6de-4ab6-8248-bf59c6ebc038\"}":{"__typename":"DeepDives","uuid":"32e29c28-c6de-4ab6-8248-bf59c6ebc038","content":"\u003cp\u003eWhen I was a kid, I wanted to be an astronaut, but now I think I’d be scared to actually go into space! Now I would love to work on the engineering side and help build a rocket that takes astronauts to space. I would also love to help design roller coasters at Disneyland, because Disney has always been such a fun place for me and designing a roller coaster sounds awesome!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"256afd42-260c-4c11-b9fc-092531a97a4e\"}":{"__typename":"School","uuid":"256afd42-260c-4c11-b9fc-092531a97a4e","name":"Newbury Park High School","city":"Thousand Oaks","type":"HIGH","state":"California","country":"United States","zip":"91320"},"Education:{\"uuid\":\"aa4ac3bd-df92-4cad-9f82-a7107cad5922\"}":{"__typename":"Education","uuid":"aa4ac3bd-df92-4cad-9f82-a7107cad5922","school":{"__ref":"School:{\"uuid\":\"256afd42-260c-4c11-b9fc-092531a97a4e\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"0012ad89-76c8-4a60-aaf1-905ebde65ce6\"}":{"__typename":"Education","uuid":"0012ad89-76c8-4a60-aaf1-905ebde65ce6","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering and Applied Math","degree":null},"MentorPublicProfile:{\"uuid\":\"fb8dfc1c-a2f7-4e75-8cca-1565a91d8e74\"}":{"__typename":"MentorPublicProfile","uuid":"fb8dfc1c-a2f7-4e75-8cca-1565a91d8e74","displayName":"Steven K.","slug":"steven-kitchell","biography":"\u003cp\u003eHey, there! My name is Steven and I'm a senior at Northwestern University studying Mechanical Engineering and Applied Math. I studied Applied Math just because I loved calculus so much in High School, but while in college I became interested in aerospace applications what I was learning in my math classes and started looking into Mechanical Engineering too! My areas of expertise are aerodynamics and propulsion, specifically Computational Fluid Dynamics simulations.\u003cbr\u003e\u003cbr\u003eOutside of class, I love to exercise and watch sports. I enjoy long distance running and lifting weights, and am a huge fan of all Chicago sports teams, particularly the Bears (Bear Down!). I also love being in nature, and enjoy hiking, camping, and visiting National Parks! I also enjoy volunteering with my church and eating sweets.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have been mentoring ever since high school, and I am particularly passionate about teaching math and science concepts. Learning math changed the way that I see the world, and I love helping students go from thinking \"When will I ever use this?\" to seeing that \"Math is everywhere!\" In everything from airplanes flying, cars driving, baseballs spinning, or hot dogs cooking, math underlies everything in our world, and I love helping students get excited about the way that math and science can help them understand everything!\u003c/p\u003e","teachingVideoPlaybackId":"N72MGlmjFOLaw9cJucLM6RQKU6nESXJQnLCjCYf4T7Q","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement so far was getting the chance to present my research on Hybrid Rockets at a conference hosted by the American Institute of Aeronautics and Astronautics (AIAA). Presenting at this conference also meant that the paper we wrote about our work got published! This was a huge accomplishments since I started working on hybrid rockets just as a passion project with a few of my friends and never expected that we would be presenting research at a legitimate conference. The whole experience was a great chance to meet others in the aerospace field and see what other cool things are happening around the industry, and I'm hopeful to produce more research in the future! \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f5103670-a627-4913-852e-7c2954795fd1\"}"},{"__ref":"Favorites:{\"uuid\":\"6162e6d5-dbe2-4dcb-835c-5900f8d6b52d\"}"},{"__ref":"Favorites:{\"uuid\":\"f8e2dc43-b6d7-4730-9ba8-f47f5483e4e0\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"fcc3f494-e68b-4aaa-9d64-0d2bb0f60304\"}"}],"major":"Mechanical Engineering and Applied Math","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"824519cc-9f34-41ea-8b8b-c987cc3d4080\"}"},{"__ref":"DeepDives:{\"uuid\":\"99376a2e-1df7-42c8-88c3-6a9852a825b1\"}"},{"__ref":"DeepDives:{\"uuid\":\"5cddaf70-eaa0-4fc6-a220-e903a9cbe951\"}"},{"__ref":"DeepDives:{\"uuid\":\"32e29c28-c6de-4ab6-8248-bf59c6ebc038\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a58ef5dc-9233-44a7-9682-207b6eefd263/-/preview/-/format/jpg/","https://ucarecdn.com/168f6f92-c5e4-4e3f-bda9-14d51dc8c881/-/preview/-/format/jpg/","https://ucarecdn.com/a29a0a49-c2c3-4877-aab7-3e0fcb34343a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"aa4ac3bd-df92-4cad-9f82-a7107cad5922\"}"},{"__ref":"Education:{\"uuid\":\"0012ad89-76c8-4a60-aaf1-905ebde65ce6\"}"}],"hiredAt":"2025-04-08T07:14:55.165Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Physics","College Essay Writing","History"],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibi
