xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e3c54255-4307-45a7-99b1-cf842cf35924\"}":{"__typename":"Favorites","uuid":"e3c54255-4307-45a7-99b1-cf842cf35924","photoUrl":"https://ucarecdn.com/144c0550-2a85-4c14-97ff-00a8a5571261/","title":"The Chainsmokers ","type":"ARTIST"},"Favorites:{\"uuid\":\"ee3647e6-27d1-4dbd-b772-6d1d2e554e63\"}":{"__typename":"Favorites","uuid":"ee3647e6-27d1-4dbd-b772-6d1d2e554e63","photoUrl":"https://ucarecdn.com/6f0ea171-53f8-4796-8e57-b13c709cfedb/","title":"The Great Gatsby","type":"BOOK"},"Favorites:{\"uuid\":\"1eac1476-feb4-40db-9069-c9052e81cf35\"}":{"__typename":"Favorites","uuid":"1eac1476-feb4-40db-9069-c9052e81cf35","photoUrl":"https://ucarecdn.com/51d1ddab-e0eb-4f8b-a005-183145bcf840/","title":"New York City ","type":"CITY"},"CausesSupported:{\"uuid\":\"0d7eddc7-7e38-41eb-91bf-8180bbf7f934\"}":{"__typename":"CausesSupported","uuid":"0d7eddc7-7e38-41eb-91bf-8180bbf7f934","name":"The One Love Foundation ","description":"\u003cp\u003eOne Love empowers young people to build safe, respectful relationships. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/c1be8c38-f2bd-4015-b957-5ceaa12c5202/"},"CausesSupported:{\"uuid\":\"646d85d1-56f0-43dd-87fe-55d4cb2ecd35\"}":{"__typename":"CausesSupported","uuid":"646d85d1-56f0-43dd-87fe-55d4cb2ecd35","name":"The Hallie225 Foundation","description":"\u003cp\u003eHallie 225 drives progress in cancer research I deeply believe in. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/daeaffac-78d4-434c-bc9e-ed482f6c1127/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"79f6d47b-8f92-4a1d-8325-8565ebce4eef\"}":{"__typename":"DeepDives","uuid":"79f6d47b-8f92-4a1d-8325-8565ebce4eef","content":"\u003cp\u003eIf I could give advice to my middle or high school self, I’d say: don’t be afraid of subjects that feel hard at first. The classes that challenge you the most often end up shaping your future in surprising ways.\u003c/p\u003e\u003cp\u003eFor me, that class was AP Physics. At the beginning, I really disliked it and felt like I was constantly struggling. But I pushed through, worked hard, and eventually did really well. In fact, my physics teacher ended up writing one of my college recommendation letters, which is something I never would have imagined at the start.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5bd02f3d-66ec-4f4d-8c20-86d4c397d7f3\"}":{"__typename":"DeepDives","uuid":"5bd02f3d-66ec-4f4d-8c20-86d4c397d7f3","content":"\u003cp\u003eI chose biomedical engineering because I’ve always been fascinated by the intersection of science, problem-solving, and helping people. In high school, I loved math and science, but I wasn’t sure how to connect them to something bigger.\u003c/p\u003e\u003cp\u003eWhat drew me to biomedical engineering was the idea of applying engineering skills to real human health problems. I liked the thought that the projects I’d work on, whether it’s designing devices, studying biomechanics, or working with new medical technologies, could make a direct difference in people’s lives.\u003c/p\u003e\u003cp\u003eAnother big reason was curiosity. I wanted a major that would challenge me and let me learn a little bit of everything (coding, biology, physics, business, statistics) and biomedical engineering gave me that mix.\u003c/p\u003e\u003cp\u003eNow, as I’ve gone through college, I’ve realized I also love how broad the field is. It doesn’t box me into one path. I can go into management, research, product design, or even consulting. That flexibility, plus the focus on improving lives, is why I chose biomedical engineering. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f87614bf-5940-4ef1-8da3-17f2b8d7dc57\"}":{"__typename":"DeepDives","uuid":"f87614bf-5940-4ef1-8da3-17f2b8d7dc57","content":"\u003cp\u003eIn high school, one of the most impactful summers I had was when I participated in the NYU Girls in STEM program. It was a really unique experience because I got paired with a research mentor and worked on a project studying autism. It was the first time I got to do real research, not just school assignments, and I was able to bring what I learned back into the classroom later on.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, I took an intensive data science class through NYU, which gave me tools I still use today. It was challenging, but also exciting because it combined coding, problem-solving, and real-world data analysis.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond the academics, I met a lot of amazing people in the program, peers who were just as curious as I was, and even the NYC program director ended up writing me a recommendation letter for NYU when I applied to colleges. I didn’t end up going there, but it meant a lot to have their support.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, G-STEM was such a cool program and I’d highly recommend it to anyone. It made me realize how much I love hands-on research and data-driven problem-solving, and it definitely influenced the path I’m on now!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b86f6dd4-6cdc-41d3-bd9c-9fb35e58833c\"}":{"__typename":"DeepDives","uuid":"b86f6dd4-6cdc-41d3-bd9c-9fb35e58833c","content":"\u003cp\u003eOne thing I really hope to accomplish in my lifetime is to make a meaningful impact on healthcare. Whether that’s through improving how hospitals run, developing new technologies, or creating products that make care more accessible, I want to use my skills to make the system better for patients and families.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor me, it’s not just about a specific job title or role, it’s about knowing that the work I do helps people live healthier lives. I’ve seen how much of a difference good healthcare can make, and I’d love to be part of shaping that on a larger scale.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf I can look back one day and see that something I helped build, whether it’s a product, a program, or even just a small improvement in how care is delivered, truly made life easier for others, that’s what I would consider a real accomplishment. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"575aaf39-b6f4-4e81-99d3-578c5efb96ed\"}":{"__typename":"School","uuid":"575aaf39-b6f4-4e81-99d3-578c5efb96ed","name":"Half Hollow Hills High School East","city":"Dix Hills","type":"HIGH","state":"New York","country":"United States","zip":"11746"},"Education:{\"uuid\":\"226b3397-3382-4136-8c91-fc1cd70e0d52\"}":{"__typename":"Education","uuid":"226b3397-3382-4136-8c91-fc1cd70e0d52","school":{"__ref":"School:{\"uuid\":\"575aaf39-b6f4-4e81-99d3-578c5efb96ed\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"622cf1ac-eb8e-4718-99fe-aec842239f04\"}":{"__typename":"School","uuid":"622cf1ac-eb8e-4718-99fe-aec842239f04","name":"University of Virginia","city":"Charlottesville","type":"COLLEGE","state":"Virginia","country":"United States","zip":"22903"},"Education:{\"uuid\":\"21fa66e6-4c99-491d-8923-1221145bc699\"}":{"__typename":"Education","uuid":"21fa66e6-4c99-491d-8923-1221145bc699","school":{"__ref":"School:{\"uuid\":\"622cf1ac-eb8e-4718-99fe-aec842239f04\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"7f8be7d2-8a1c-4d40-aa1a-6546115727ed\"}":{"__typename":"MentorPublicProfile","uuid":"7f8be7d2-8a1c-4d40-aa1a-6546115727ed","displayName":"Sophia R.","slug":"sophia-raziel","biography":"\u003cp\u003eHi, my name is Sophia Raziel! I am a 4th year biomedical engineering student with a minor in Business at the University of Virginia. I love learning how science and technology can be used to solve real problems and help people, whether in healthcare, research, or even everyday life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my classes, I study everything from how blood flows through the body to how cells behave under different conditions. Sometimes it feels like detective work; we run experiments, collect data, and try to figure out what the results mean. One of my favorite parts of studying engineering is that it’s not just about memorizing; it’s about asking questions and working with others to design better answers. Earlier in college, I was a physics teaching assistant, helping other students in the classroom, which showed me how much I enjoy mentoring and explaining ideas in ways that make sense. I've also been an engineering peer advisor, giving tours and welcoming new students to UVA's engineering school during welcome week. Both of these experiences showed me how much I enjoy mentoring and supporting others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis past summer, I interned in healthcare management at one of the largest hospitals in New York. I got to see the behind the scenes of how a hospital runs; things like scheduling surgeries, planning budgets and improving how patients move through the system. It was eye opening to see how many different pieces need to fit together for a hospital to take care of patients every single day.\u003c/p\u003e\u003cp\u003eOutside of school, I love staying active. I run, go on long walks, and love pilates. Cooking is another favorite of mine, I like trying new recipes and making meals for friends or family. I also really love coffee and am always on the hunt for the best coffee shops around Virginia.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love to travel. Recently, I studied abroad for a semester in Madrid, where I was able to experience life in a completely different culture. On weekends, I had the chance to travel around Europe, trying new foods, visiting museums and meeting people from all over the world. Living abroad taught me to be independent, flexible, and open to new perspectives. It was one of the most exciting experiences of my life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up on Long Island with my two older sisters, who now live in New York City. Visiting them is one of my favorite things to do because we spend time exploring the city together, trying new restaurants and shopping around.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat matters most to me is connecting with people and helping others learn and grow. Whether it is explaining a tricky physics concept, welcoming a new student or sharing my own experiences. I know how important it is to have role models and mentors, and I hope to be that for future students.\u003c/p\u003e","teachingVideoPlaybackId":"1X8YrA2KDCgnk4uY02eBXx01NzR6KGi6cK02uwW3lSeNg4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I’m most proud of was during my junior year, when I was on the girls’ golf team and competing at the Suffolk County Golf Championships. On the very last hole, even though I was tired, I managed to score an eagle, which in golf means finishing two strokes under par. It was such an exciting moment, and it helped me finish the season ranked as one of the top 30 golfers in Suffolk County. That experience taught me how preparation, focus, and composure under pressure can lead to results I never imagined. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e3c54255-4307-45a7-99b1-cf842cf35924\"}"},{"__ref":"Favorites:{\"uuid\":\"ee3647e6-27d1-4dbd-b772-6d1d2e554e63\"}"},{"__ref":"Favorites:{\"uuid\":\"1eac1476-feb4-40db-9069-c9052e81cf35\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0d7eddc7-7e38-41eb-91bf-8180bbf7f934\"}"},{"__ref":"CausesSupported:{\"uuid\":\"646d85d1-56f0-43dd-87fe-55d4cb2ecd35\"}"}],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"79f6d47b-8f92-4a1d-8325-8565ebce4eef\"}"},{"__ref":"DeepDives:{\"uuid\":\"5bd02f3d-66ec-4f4d-8c20-86d4c397d7f3\"}"},{"__ref":"DeepDives:{\"uuid\":\"f87614bf-5940-4ef1-8da3-17f2b8d7dc57\"}"},{"__ref":"DeepDives:{\"uuid\":\"b86f6dd4-6cdc-41d3-bd9c-9fb35e58833c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cfa7ae1e-9b1b-48c2-b4c8-9ab7a6009c5c/-/preview/-/format/jpg/","https://ucarecdn.com/e98dccb2-c7c8-4fa7-bb8b-1d83450bff1b/-/preview/-/format/jpg/","https://ucarecdn.com/230e03b2-e026-458e-949b-4493df2f117a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"226b3397-3382-4136-8c91-fc1cd70e0d52\"}"},{"__ref":"Education:{\"uuid\":\"21fa66e6-4c99-491d-8923-1221145bc699\"}"}],"hiredAt":"2025-09-16T17:17:02.649Z","topics":["Statistics","Calculus","Precalculus / Trigonometry","Algebra II","Algebra I","Pre-Algebra","Chemistry","Biology","Physics","6-8 Grade Science","Spanish","College Essay Writing","Academic Coaching","Economics","Computer Science","Fashion / Cosmetics","Music","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Medicine / Health","Web Design","Robotics / Electronics / CAD","STEM Project","Machine Learning / AI","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sophia-raziel\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7f8be7d2-8a1c-4d40-aa1a-6546115727ed\"}"}}},"_sentryTraceData":"83e04af1e70247e68704a880a36c404e-8c1e1ae98d8abdeb-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=83e04af1e70247e68704a880a36c404e,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sophia-raziel"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
