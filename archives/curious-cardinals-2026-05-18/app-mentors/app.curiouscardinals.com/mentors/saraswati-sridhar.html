xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"782d6a61-4a5f-4b58-8a41-c1955d22de37\"}":{"__typename":"Favorites","uuid":"782d6a61-4a5f-4b58-8a41-c1955d22de37","photoUrl":"https://ucarecdn.com/574e518d-dcae-493b-aa35-6b52cf0e0304/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"fe2d55f7-0748-4137-89d0-8603b1e1b4eb\"}":{"__typename":"Favorites","uuid":"fe2d55f7-0748-4137-89d0-8603b1e1b4eb","photoUrl":"https://ucarecdn.com/82a1c404-6e55-4524-98d0-18ebfe8910e3/","title":"Sour, by Olivia Rodrigo","type":"ALBUM"},"Favorites:{\"uuid\":\"240d06ff-31be-4e1f-97d2-eba2b57eee80\"}":{"__typename":"Favorites","uuid":"240d06ff-31be-4e1f-97d2-eba2b57eee80","photoUrl":"https://ucarecdn.com/4ac6caff-d031-4edb-93b1-1d8eee1953ca/","title":"Hamlet","type":"PLAY"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b9813d2e-e745-4516-b355-9c9aae647322\"}":{"__typename":"DeepDives","uuid":"b9813d2e-e745-4516-b355-9c9aae647322","content":"\u003cp\u003eMy dream job is to be a physician (currently, I'm thinking of either a medical or surgical oncologist, and I am not yet sure of whether I want to work with pediatric or adult patients, but I am open to this changing in the near future!), who is engaged in cutting-edge research and discovers and creates new things that transforms the way we care for patients and treat diseases. I also hope to advance the medical field for women and people with young families who want to pursue the field through mentorship and policy change.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"bd52cd81-22ad-4956-a102-f94ebd3011d7\"}":{"__typename":"DeepDives","uuid":"bd52cd81-22ad-4956-a102-f94ebd3011d7","content":"\u003cp\u003eThe biggest advice I would give my middle or high school self is that it is okay to be imperfect and not have all of the answers. In fact, I would even go far as to say that it is far more important to have humility and recognition of what we don't know.\u0026nbsp;Additionally, I would say that what you know is far less important than how you interact with and treat people. Finally, I would tell myself not to be afraid of trying things that bring me joy, making new friends and meeting new people, and admitting my mistakes. I would tell myself that making mistakes is a normal part of being a human, and that people are generally super appreciative when you are honest about your mistakes and make your best effort to fix it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"45e94724-af41-47b7-bfd2-41aec75c2f3c\"}":{"__typename":"DeepDives","uuid":"45e94724-af41-47b7-bfd2-41aec75c2f3c","content":"\u003cp\u003eI chose my major because I had a deep passion for Biology and life science from an early age, and began pursuing this passion through my school Science Team. Additionally, I had a lot of exposure to Math and Engineering, as my parents were both engineers. I also enjoyed reading scientific publications and technology magazines, and learning about new research and innovation in these fields. This field allowed me to combine both passions for biology and engineering in order to improve human health. Over time, in high school, I became involved in a variety of projects, including projects related to computational biology in immuno-oncology, as well as a major years-long project where I developed a Brain Computer Interface to identify and implement biomarkers of cognitive decline, a project that was later presented at various competitions and conferences. Eventually, I began learning to find my place in this field in the context of how I could learn cool new things and grow while helping others!\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2e911175-ee97-4315-bf6f-bf890b4782c1\"}":{"__typename":"DeepDives","uuid":"2e911175-ee97-4315-bf6f-bf890b4782c1","content":"\u003cp\u003eAs a high school student, I spent my summers doing many cool and interesting things. I often spent my summers visiting family in India and traveling to temples and other historical and vacation sites throughout India. Additionally, I spent time continuing my academic pursuits by self-studying math and science, and reading biology and medical textbooks. I also enjoyed reading medical memoirs by authors like Atul Gawande and was obsessed with Enid Blyton's books. Many of my STEM-related passion projects started out from work I did during the summers. For example, I took computer programming courses at my local college campus and interned at the Monell Center on a genetics project. The previous summer, I also worked on a project about key genetic and transcriptional players in cancer, that I later presented at the Puerto Rico Cancer Research Meeting and at CMBE conference at the Biomedical Engineering Society. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"2faa3d55-bd49-4632-8b12-1f278f6024c6\"}":{"__typename":"School","uuid":"2faa3d55-bd49-4632-8b12-1f278f6024c6","name":"Southwestern Educational Society","city":"Mayagüez","type":"HIGH","state":"Mayagüez","country":"Puerto Rico","zip":"00682"},"Education:{\"uuid\":\"69409b0c-2902-47cd-ad74-cb6c3f420666\"}":{"__typename":"Education","uuid":"69409b0c-2902-47cd-ad74-cb6c3f420666","school":{"__ref":"School:{\"uuid\":\"2faa3d55-bd49-4632-8b12-1f278f6024c6\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"404d03ee-1a04-4a1a-b0c6-16c365074ae7\"}":{"__typename":"Education","uuid":"404d03ee-1a04-4a1a-b0c6-16c365074ae7","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Bioengineering","degree":null},"MentorPublicProfile:{\"uuid\":\"a12ba20b-8c9b-4009-af01-3aac9c3db31f\"}":{"__typename":"MentorPublicProfile","uuid":"a12ba20b-8c9b-4009-af01-3aac9c3db31f","displayName":"Saraswati S.","slug":"saraswati-sridhar","biography":"\u003cp\u003eHi! My name is Saraswati, but I also go by Sara, and I am originally from Mayaguez, Puerto Rico. I am a recent graduate of the University of Pennsylvania, and I majored in Bioengineering with minors in Chemistry and Neuroscience. Currently, I am pursuing my Master's degree in Bioengineering, studying ways to combine radiation and immunotherapy to improve the treatment of solid tumors, and applying to medical school. Additionally, as a lifelong learner, I am passionate about teaching and mentorship, which I have been doing since middle school! I enjoy mentorship because it allows me to share my knowledge and skills with others, helping my mentees realize their full potential and dreams, while also challenging myself to grow and think outside the box in the process. Outside of my academics, I have been involved in biomedical and pediatric clinical research at the Children’s Hospital of Philadelphia, where I have conducted pediatric brain cancer research and where I currently work on research related to pediatric kidney transplantation outcomes and lymphatic dysfunction in premature infants with chronic kidney disease. I am also passionate about writing and have written, edited and designed for multiple student publications at Penn, in addition to interning at health-tech startups. I also volunteer in my university’s affiliated hospitals, spending time with patients in a variety of units, including the pediatric ICU, a variety of adult inpatient units, and affiliated elderly and rehabilitation homes. Additionally, I am also involved in entrepreneurship activities, such as consulting clubs and case competitions and in my free time, I enjoy reading (particularly The Classics), solving puzzles, watching movies, travelling, hiking, and swimming.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOver the years, I have tutored a wide range of subjects, including Language Arts and STEM subjects for kids at a variety of grade levels, and have also advised a variety of students undergoing the college application process, including general advising and help with college essays through 2 organizations. Additionally, as someone who published two research papers, carried out several passion/service projects, and successfully participated in multiple prestigious STEM competitions in middle and high school, such as Broadcom MASTERS, Intel ISEF, National Science Bowl, Regeneron STS and EngineerGirl Ambassadors, I can help students develop and execute research projects and other passion projects, including service/outreach projects, that they can then use to apply to these competitions or obtain scholarships. If you want to work on any competition or opportunity outside of this list, I would be game for that as well! Other projects I would be happy to help with include writing- and speech-related activities since I had experience with this during my high school years and can provide good feedback.\u0026nbsp;\u003c/p\u003e\u003cp\u003eFinally, I had many experiences navigating complicated STEM and other coursework at Penn, as well as self-studying for standardized tests and other college-related courses and subjects while working on the aforementioned projects as a high school student in a somewhat low-resource environment. As a result, I learned a lot about executive functioning and habits important to achieving academic success that I have implemented in my own life, as well as my experiences tutoring and mentoring students. I am super excited to meet my future mentees and their families, and help them accomplish things they never thought possible before!\u003c/p\u003e","teachingVideoPlaybackId":"nf85XeMZ6wS2FQ38NPP2gSMsy2XRBBNKAehw00lKbni00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"782d6a61-4a5f-4b58-8a41-c1955d22de37\"}"},{"__ref":"Favorites:{\"uuid\":\"fe2d55f7-0748-4137-89d0-8603b1e1b4eb\"}"},{"__ref":"Favorites:{\"uuid\":\"240d06ff-31be-4e1f-97d2-eba2b57eee80\"}"}],"causesSupported":[],"major":"Bioengineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b9813d2e-e745-4516-b355-9c9aae647322\"}"},{"__ref":"DeepDives:{\"uuid\":\"bd52cd81-22ad-4956-a102-f94ebd3011d7\"}"},{"__ref":"DeepDives:{\"uuid\":\"45e94724-af41-47b7-bfd2-41aec75c2f3c\"}"},{"__ref":"DeepDives:{\"uuid\":\"2e911175-ee97-4315-bf6f-bf890b4782c1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/40cf99e5-05c8-4561-b25a-c56cc45fa3e8/-/preview/-/format/jpg/","https://ucarecdn.com/aca30afc-5dfd-405a-ade2-85589a935f50/-/previe
