xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d37ab200-725e-4f16-895f-89bcc669a55d\"}":{"__typename":"Favorites","uuid":"d37ab200-725e-4f16-895f-89bcc669a55d","photoUrl":"https://ucarecdn.com/fd0224a2-c266-4404-964e-3343b299d354/","title":"Paris","type":"CITY"},"Favorites:{\"uuid\":\"1d52144d-148b-4553-93e0-246d81556f34\"}":{"__typename":"Favorites","uuid":"1d52144d-148b-4553-93e0-246d81556f34","photoUrl":"https://ucarecdn.com/fd0224a2-c266-4404-964e-3343b299d354/","title":"The Godfather Part II","type":"MOVIE"},"Favorites:{\"uuid\":\"b3437fc2-db69-4d5d-b0a0-7ab95d9f5672\"}":{"__typename":"Favorites","uuid":"b3437fc2-db69-4d5d-b0a0-7ab95d9f5672","photoUrl":"https://ucarecdn.com/fd0224a2-c266-4404-964e-3343b299d354/","title":"Fine Line, Harry Styles","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3e4d5221-caf4-41a2-a965-8ab2d791bc39\"}":{"__typename":"DeepDives","uuid":"3e4d5221-caf4-41a2-a965-8ab2d791bc39","content":"\u003cp\u003eI would tell my middle and high school self to be proud of who you are, not who you think you want to be, but who you truly are. Learning about yourself and your values is a life long process, and it's more than OK to not have all the answers yet! Become comfortable with questioning things, and with uncertainty.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0c4c8b92-c3df-423e-8ff4-f8072c6ad916\"}":{"__typename":"DeepDives","uuid":"0c4c8b92-c3df-423e-8ff4-f8072c6ad916","content":"\u003cp\u003eI chose Culture and Politics (CULP) because of the unique opportunity this major provides for students to self-direct their path of study. Once I started college, I realized that my interests–including my longtime commitment to language study, literature, art and art history, acting, writing, and film–all fall under the umbrella of storytelling. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough Culture and Politics, I have been able to explore how storytelling interacts with politics, how we can use art as a tool for positive social change, and how culture is essential to the study of any society, time period, or language.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"35a0f50a-c14c-4938-9984-456d3b2b3422\"}":{"__typename":"DeepDives","uuid":"35a0f50a-c14c-4938-9984-456d3b2b3422","content":"\u003cp\u003eI have always found joy in exploring museums. I grew up in New York City not far from the Metropolitan Museum of Art, and have spent \u003cem\u003ecountless \u003c/em\u003ehours there since I was a kid. I'm so grateful that going on school field trips usually meant walking around the incredible halls of the Met, and I have so many memories of wandering around with my friends, family, or just by myself. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my senior year of high school, I took an elective art class, where I focused on black and white film photography. The subject of my long-term project was photographing inside museums and galleries, and I ended up walking to the Met from school at least twice (if not more) per week!  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"fa57981d-cd5c-4bec-adae-1dcea32de3b9\"}":{"__typename":"DeepDives","uuid":"fa57981d-cd5c-4bec-adae-1dcea32de3b9","content":"\u003cp\u003eDuring my junior year, I, alongside three of my peers, created a short documentary called “Mother.” The documentary focused on the issue of Black maternal mortality, and the injustices that exist in reproductive care in the American healthcare system, particularly in the Washington, DC/Maryland area. I am very passionate about being involved in sharing stories that can hopefully educate and make a positive social impact. I learned so much during this process, and my team and I are incredibly grateful to all of the participants who were willing to share their stories and expertise with us.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122\"}":{"__typename":"School","uuid":"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122","name":"Spence School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"7b019df5-6f36-4ee0-b530-f5c2f0a15166\"}":{"__typename":"Education","uuid":"7b019df5-6f36-4ee0-b530-f5c2f0a15166","school":{"__ref":"School:{\"uuid\":\"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122\"}"},"startYear":"2013","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"125da95c-5531-44a3-98f7-fbdec1601c2b\"}":{"__typename":"School","uuid":"125da95c-5531-44a3-98f7-fbdec1601c2b","name":"Georgetown University School of Foreign Service","city":"washington","type":"COLLEGE","state":"dc","country":"United States","zip":"20057"},"Education:{\"uuid\":\"5d20a026-94e9-4ca0-a360-d312bdcf8795\"}":{"__typename":"Education","uuid":"5d20a026-94e9-4ca0-a360-d312bdcf8795","school":{"__ref":"School:{\"uuid\":\"125da95c-5531-44a3-98f7-fbdec1601c2b\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Culture and Politics","degree":null},"MentorPublicProfile:{\"uuid\":\"23fdb36d-09ad-488e-be3c-16af82c83c02\"}":{"__typename":"MentorPublicProfile","uuid":"23fdb36d-09ad-488e-be3c-16af82c83c02","displayName":"Mackenzie R.","slug":"mackenzie-rabin","biography":"\u003cp\u003eI am a Master's Student in Public Policy, Cultural Policy and Management at Sciences Po, Paris. I graduated from Georgetown University's School of Foreign Service (SFS), where I majored in Culture and Politics.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have dedicated my studies to understanding the nexus of politics and storytelling, and have an affinity for the study of all things related to culture and cultural heritage, and understanding the importance of the arts in policy and social justice.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eI am fluent in French and I'm particularly passionate about mentoring this subject! Additionally, I speak Italian and enjoy supporting learners as they develop their skills and deepen their understanding of language study.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eI also mentor students in the areas of\u0026nbsp;Art History, History, Literature, International Relations, Government \u0026amp; Policy, Geopolitics, Geography, Journalism, World Cultures, Cultural Heritage, Current Events, Film Studies, Theater, Video Production, Documentary, Photography, Food History, Cooking, Women \u0026amp; Gender Studies, Public Speaking, Essay Writing, Creative Writing, Poetry, Grammar \u0026amp; Spelling, and Literary Analysis.\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my time at Georgetown, I was part of several different clubs and organizations. Most notably, I founded and was President of Georgetown Women in Film, which is the first and only organization at Georgetown dedicated to supporting, educating, and empowering women filmmakers and students interested in entertainment. I was a Peer Mentor for the Culture and Politics Program, and love to talk to students about designing their course of study.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love to visit local museums here in Paris, read, watch documentaries, write poetry, and cook!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d37ab200-725e-4f16-895f-89bcc669a55d\"}"},{"__ref":"Favorites:{\"uuid\":\"1d52144d-148b-4553-93e0-246d81556f34\"}"},{"__ref":"Favorites:{\"uuid\":\"b3437fc2-db69-4d5d-b0a0-7ab95d9f5672\"}"}],"causesSupported":[],"major":"Culture and Politics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3e4d5221-caf4-41a2-a965-8ab2d791bc39\"}"},{"__ref":"DeepDives:{\"uuid\":\"0c4c8b92-c3df-423e-8ff4-f8072c6ad916\"}"},{"__ref":"DeepDives:{\"uuid\":\"35a0f50a-c14c-4938-9984-456d3b2b3422\"}"},{"__ref":"DeepDives:{\"uuid\":\"fa57981d-cd5c-4bec-adae-1dcea32de3b9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0927c7d0-7eb9-4914-977c-ba47e9d0cebb/-/preview/-/format/jpg/","https://ucarecdn.com/2ad9cd4c-0d19-4846-933c-d96c36a6255b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7b019df5-6f36-4ee0-b530-f5c2f0a15166\"}"},{"__ref":"Education:{\"uuid\":\"5d20a026-94e9-4ca0-a360-d312bdcf8795\"}"}],"hiredAt":"2024-02-07T00:14:04.643Z","topics":["Writing","French","Reading","History","Creative Writing","History Project","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/4898ea96-6627-4c32-80af-8dd44881bd39/","https://ucarecdn.com/7e9ab2cb-d457-4e4e-9f2d-4946a44b3ea9/"]
