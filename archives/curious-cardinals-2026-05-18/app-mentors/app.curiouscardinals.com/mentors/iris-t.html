xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f05075d9-6733-46e1-8aa9-ced2df49d6bf\"}":{"__typename":"DeepDives","uuid":"f05075d9-6733-46e1-8aa9-ced2df49d6bf","content":"\u003cp\u003eWriting novels, doing chemistry research at the local university, and hanging out with my friends :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"e4186b77-4ee9-4ff6-8924-31bf9c62add3\"}":{"__typename":"DeepDives","uuid":"e4186b77-4ee9-4ff6-8924-31bf9c62add3","content":"\u003cp\u003eI wrote a social needs screen for a free clinic that has been implemented into workflow and has helped over a hundred patients connect to social needs resources!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f06668d5-f209-4077-b6a1-dbc2f68b5118\"}":{"__typename":"DeepDives","uuid":"f06668d5-f209-4077-b6a1-dbc2f68b5118","content":"\u003cp\u003eI love creative writing! I've been working on the third draft of a novel I've been writing for around 4 years lately. I also love listening to music and spending time outdoors with my friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"516f460c-6c66-46cd-baa9-2c7b2b14e107\"}":{"__typename":"DeepDives","uuid":"516f460c-6c66-46cd-baa9-2c7b2b14e107","content":"\u003cp\u003eI'm very grateful to the mentors I've had in my life so far who've really given me the advice to pursue my passions. I want to be able to give back to other students in the same way and help guide them towards achieving their goals. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"507f17d3-bc05-4b5c-abd6-9ad110075be1\"}":{"__typename":"School","uuid":"507f17d3-bc05-4b5c-abd6-9ad110075be1","name":"Clovis North High School","city":"Fresno","type":"HIGH","state":"California","country":"United States","zip":"93730"},"Education:{\"uuid\":\"839adcee-ff45-4acc-a1dc-754246b2e74f\"}":{"__typename":"Education","uuid":"839adcee-ff45-4acc-a1dc-754246b2e74f","school":{"__ref":"School:{\"uuid\":\"507f17d3-bc05-4b5c-abd6-9ad110075be1\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"65aa63a6-6b71-4ffd-a851-cc8423e669cf\"}":{"__typename":"Education","uuid":"65aa63a6-6b71-4ffd-a851-cc8423e669cf","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"BioEngineering","degree":null},"MentorPublicProfile:{\"uuid\":\"c0ccc0b0-6284-466a-92ff-33d37b0e3ea5\"}":{"__typename":"MentorPublicProfile","uuid":"c0ccc0b0-6284-466a-92ff-33d37b0e3ea5","displayName":"Iris T.","slug":"iris-t","biography":"\u003cp\u003eAs a bioengineering B.S. candidate at Stanford University (class of 2025) and a pre-med student, Iris aims to help students build confidence in STEM subjects and their educational journeys. She’s passionate about science, medicine, and community service and eager to engage students in unique volunteering and leadership opportunities.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of class, Iris volunteers with the Cardinal Free Clinics and developed a comprehensive social needs screen implemented into clinic workflow. She also volunteers with the United Effort Organization in Mountain View and works one-on-one with unhoused individual to connect them to affordable housing. She is president of the Stanford Housing Equity Project: a student-run initiative that advocates for housing equity through research, community service, and innovative projects. Passionate about women’s health, Iris fundraises menstrual care and feminine hygiene products as the co-founder of SupplyHer.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIris is also available to help students build their research skills. When mentoring a student, Iris is able to provide guidance through the multiple facets of research—finding a topic, reaching out to labs, synthesizing ideas, and all the steps in between.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eYou can also find her in creative writing classes, working on short stories and writing novels. She always excited to work with students to tap into their creative side, and loves reading and watching her favorite TV shows.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"
