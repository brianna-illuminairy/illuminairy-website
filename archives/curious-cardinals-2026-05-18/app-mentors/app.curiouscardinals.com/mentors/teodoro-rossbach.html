xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"45e3084c-e227-4a5e-a312-6311f151a3d6\"}":{"__typename":"DeepDives","uuid":"45e3084c-e227-4a5e-a312-6311f151a3d6","content":"\u003cbr\u003e\u003cp\u003eI’ve always been fascinated with how things came to be and have wanted to unravel how the world I live in has developed over the ages. Appreciating the evolution of societies and cultures is of great importance because the past provides the crucial context for decisions we make today. I agree strongly with the sentiment you can’t really deal with first-rate political problems without history.”\u0026nbsp; However, there is more to it than history. Studying the classics is just as critical because the ancient world laid the foundations for language, the legal system and even democracy. The cases fought by Cicero two millennia ago are almost indistinguishable from those of today. We can learn from mistakes made in Rome just as we can from more recent ones: The way in which Caesar seized power at the fall of the Roman Republic or Crassus’ hubristic campaign in Parthia can serve as lessons about populism and imperial overreach today. Armed with the History major, I feel that I will have greater insight and wisdom to understand how we got to where we are today and be better equipped to drive progress in our society.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"af03b7e5-d91d-41da-862c-70eec0651293\"}":{"__typename":"School","uuid":"af03b7e5-d91d-41da-862c-70eec0651293","name":"St Paul's Juniors","city":"London","type":"HIGH","state":"England","country":"United Kingdom","zip":"SW13 9JT"},"Education:{\"uuid\":\"b7f81a63-b836-427f-94a9-a8fdbaf08691\"}":{"__typename":"Education","uuid":"b7f81a63-b836-427f-94a9-a8fdbaf08691","school":{"__ref":"School:{\"uuid\":\"af03b7e5-d91d-41da-862c-70eec0651293\"}"},"startYear":"2019","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"f48f78d0-bc65-4e37-98a3-a664024c99bc\"}":{"__typename":"Education","uuid":"f48f78d0-bc65-4e37-98a3-a664024c99bc","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"111929ea-ae9d-4997-a54f-2c7ced9fd8a9\"}":{"__typename":"MentorPublicProfile","uuid":"111929ea-ae9d-4997-a54f-2c7ced9fd8a9","displayName":"Teodoro R.","slug":"teodoro-rossbach","biography":"\u003cp\u003eHi! My name is Teodoro Rossbach (Teo for short), and I'm studying History and Economics at Yale. I’ve always cared deeply about refugee and immigration issues, shaped in part by my own family's history. That early awareness sparked a broader passion for social justice, whether through law, policymaking, or community service. After college, I plan to attend law school to continue working on issues that sit at the intersection of people, policy, and equity.\u003c/p\u003e\u003cp\u003eIn high school, while living in London, I founded a free tutoring program for Ukrainian refugee students. I saw how difficult it can be for displaced students to adjust to a new education system, and I wanted to provide academic support and a sense of stability during a challenging time. It was one of the most meaningful things I’ve done and showed me how powerful mentorship can be. That experience inspired me to join Curious Cardinals, where I can continue supporting students one-on-one.\u003c/p\u003e\u003cp\u003eAt Yale, I founded and help run Casa Shalom, a Hispanic affinity association dedicated to building community spaces through events, guest speakers, and community dinners. The process of starting the organisation, recruiting members and writing its constitution has taught me a lot about entrepeneurship and how to turn passionate ideas into reality. I would love to help apply these things to your own passion projects as a mentor!\u003c/p\u003e\u003cp\u003eI am also involved in campus as a consulting analyst at TAMID, a pre-professional consulting club which works on projects with local businesses. This, as well as my role last year in the Yale Policy Institute where I helped draft a formal policy solicitation to the U.S. government, have been great opportunities to take what I study in the classroom and apply it to real-world problems. The latter experience especially deepened my understanding of international law and reaffirmed my commitment to a career in public service and policy reform.\u003c/p\u003e\u003cp\u003eI also serve as a hiking trip leader for Yale’s first-year orientation program. Each fall, I lead a group of incoming students on a multi-day backpacking trip through the wilderness. Being able to guide and support students in their difficult transition away from home and towards the friends they will hold for life is something I truly enjoy, and I am still close with many of the students I led this year.\u003c/p\u003e\u003cp\u003eI was a competitive rower throughout high school and now play on the Yale Rugby Team. These sports have taught me how to lead by example and how essential teamwork is to any kind of success. In them, as in life, there’s no way to succeed unless everyone is working together. That mindset continues to shape how I approach group work, leadership, and even tutoring.\u003c/p\u003e\u003cp\u003eWhether I’m tutoring, writing policy, out in nature, or on the field, I always bring a focus on connection, curiosity, and growth. I’m excited to bring those same values to my work as a tutor.\u003c/p\u003e","teachingVideoPlaybackId":"FVmtljofM9Z2SCweD4UQiQqLOUfo4NZOXUu3XchIGag","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"45e3084c-e227-4a5e-a312-6311f151a3d6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/db001a2a-553b-4fe5-acf5-d11a92d4542a/-/preview/-/format/jpg/","https://ucarecdn.com/65c34a9c-9c65-454f-868f-e15c8a01e684/-/preview/-/format/jpg/","https://ucarecdn.com/71468247-e147-4327-ae61-5eae83373e88/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b7f81a63-b836-427f-94a9-a8fdbaf08691\"}"},{"__ref":"Education:{\"uuid\":\"f48f78d0-bc65-4e37-98a3-a664024c99bc\"}"}],"hiredAt":"2025-04-16T23:42:16.199Z","topics":["Algebra I","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Physics","Writing","French","German","Latin","Spanish","College Essay Writing","Economics","History","Reading","Creative Writing","History Project","K-6 Storybook","Sports Journalism","Sports Analytics","Web Design","Journalism","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"teodoro-rossbach\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"111929ea-ae9d-4997-a54f-2c7ced9fd8a9\"}"}}},"_sentryTraceData":"e34a88a7061744fa941371851dd49b50-b32c56f1b98f
