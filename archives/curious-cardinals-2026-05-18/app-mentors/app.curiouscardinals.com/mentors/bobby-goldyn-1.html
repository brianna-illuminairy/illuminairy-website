xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"709a36d7-9b15-45e8-bd7a-a6cdec4ec255\"}":{"__typename":"Favorites","uuid":"709a36d7-9b15-45e8-bd7a-a6cdec4ec255","photoUrl":"https://ucarecdn.com/8d664e3e-bf82-4ff3-b6d1-cfe2389e9906/","title":"In Rainbows by Radiohead","type":"ALBUM"},"Favorites:{\"uuid\":\"57bbd703-1b53-4bc9-8031-488128306118\"}":{"__typename":"Favorites","uuid":"57bbd703-1b53-4bc9-8031-488128306118","photoUrl":"https://ucarecdn.com/f7085cf6-6545-4c39-a25f-cc3778ad27fa/","title":"One Hundred Years of Solitude by Gabriel Garcia Marquez","type":"BOOK"},"Favorites:{\"uuid\":\"6f1dda60-e150-4255-94ed-e27f8a6e7345\"}":{"__typename":"Favorites","uuid":"6f1dda60-e150-4255-94ed-e27f8a6e7345","photoUrl":"https://ucarecdn.com/f7d352fc-bf4a-4ef0-8d57-3355a3764814/","title":"Whiplash","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1d836eea-92e9-4986-9749-47ccdfd379bf\"}":{"__typename":"DeepDives","uuid":"1d836eea-92e9-4986-9749-47ccdfd379bf","content":"\u003cp\u003eSometimes, nothing makes me happier than surfing. I never feel more justified as a human than when I lug my surfboard out of the water, drenched in saltwater, feeling completely exhausted, having once more barely escaped getting completely destroyed by the waves. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d3af9bf0-ba89-4a4f-aa08-e3b2d840b23e\"}":{"__typename":"DeepDives","uuid":"d3af9bf0-ba89-4a4f-aa08-e3b2d840b23e","content":"\u003cp\u003eI think I would tell her to dance a little bit more. For me, so much of high school was spent feeling awkward. I think if I had sometimes let it all out on the dance floor, I could have had more self-confidence and a higher quality of life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"bd964c77-7c6e-4237-bffc-72abf38431c6\"}":{"__typename":"DeepDives","uuid":"bd964c77-7c6e-4237-bffc-72abf38431c6","content":"\u003cp\u003eI often feel like my hometown of Maui lacks certain opportunities for youth, which puts local kids behind those on the mainland. In my lifetime, I hope to go home for a little while and focus on creating educationally enriching extracurricular activities for youth, such as speech and debate or Model United Nations (both of which my high school lacked). \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"20b0b6f2-6a4d-4c4d-9d42-a7148e3c1b26\"}":{"__typename":"DeepDives","uuid":"20b0b6f2-6a4d-4c4d-9d42-a7148e3c1b26","content":"\u003cp\u003eI chose to study English for a very simple reason: there is nothing I love more than reading books. I can’t imagine feeling satisfied in life if I haven’t read every single book in the literary canon. So that is my current project!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"3f77384b-8234-4118-8281-81b184b3bff9\"}":{"__typename":"School","uuid":"3f77384b-8234-4118-8281-81b184b3bff9","name":"Seabury Hall","city":"Makawao","type":"HIGH","state":"Hawaii","country":"United States","zip":"96768"},"Education:{\"uuid\":\"90794378-7277-4954-86d6-ca8d6b7be873\"}":{"__typename":"Education","uuid":"90794378-7277-4954-86d6-ca8d6b7be873","school":{"__ref":"School:{\"uuid\":\"3f77384b-8234-4118-8281-81b184b3bff9\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"57e752f2-3883-4ef4-9008-bc45e6c92059\"}":{"__typename":"Education","uuid":"57e752f2-3883-4ef4-9008-bc45e6c92059","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"58631e69-d169-4989-a8d5-65ee7bec3041\"}":{"__typename":"MentorPublicProfile","uuid":"58631e69-d169-4989-a8d5-65ee7bec3041","displayName":"Bobby G.","slug":"bobby-goldyn-1","biography":"\u003cp\u003eHi! My name is Bobby, and I’m from Maui, Hawaii. I’m majoring in English with a minor in music at Columbia University. I picked Columbia because I care deeply about my education, and because I love everything that New York City has to offer: food, concerts, book tours, Broadway, pizza, theaters: you name it.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy greatest love has always been music. I’ve been playing the piano since I was four, and have completed through level 10 in the Certificate of Merit program. Additionally, I have published music on Spotify and won the YoungArts competition twice in the songwriting category. I sing, play piano, guitar, bass, and ukulele, and love to nerd out about anything music (theory, production, lyricism, etc.). I did theater throughout high school; my favorite role was playing Morticia in The Adams Family. One of my favorite hobbies is singing with Columbia’s oldest a cappella group, Notes and Keys.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI’m also quite passionate about service. I come from a small island with a strong community but not enough resources. After noticing a lack of musical education opportunities on Maui, I founded a 501(c)(3) organization with my sister called Keiki Kupuna. Keiki Kupuna is Maui’s only free children’s choir; made up of 25 talented youth, Keiki Kupuna brings polished shows to senior homes on Maui every month, and has raised over $50,000. Additionally, I earned the gold medal for the Congressional Award in my junior year of high school for my community service and extracurricular activities.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eNow, in New York City, I’ve shifted my focus to writing, as I publish weekly articles for the Columbia Daily Spectator. I’ve always loved to write: I have published poetry in the Washington Post and I won multiple essay contests in high school. I also enjoy writing for fun, and love journaling, poetry, and song-writing. My favorite thing is this whole world might be reading and talking about books.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of all this, I’m obsessed with surfing, hiking, camping, being outdoors, and lately I’ve been trying (and failing) to spearfish. Nothing makes me happier than lying in the grass, climbing a mountain, or dunking my head in the ocean.\u003c/p\u003e","teachingVideoPlaybackId":"E7GYvXx02c013XOx2x02CFA5gJheucW7ZhvgSCli9GjxNY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"709a36d7-9b15-45e8-bd7a-a6cdec4ec255\"}"},{"__ref
