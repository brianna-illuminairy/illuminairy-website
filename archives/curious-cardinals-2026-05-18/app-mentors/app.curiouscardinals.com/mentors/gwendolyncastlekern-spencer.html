xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ac4c3af4-9f5c-4413-9807-3249be80eafb\"}":{"__typename":"Favorites","uuid":"ac4c3af4-9f5c-4413-9807-3249be80eafb","photoUrl":"https://ucarecdn.com/75136dcb-0b32-4840-951b-e33abe9033bb/","title":"Harry's House by Harry Styles","type":"ALBUM"},"Favorites:{\"uuid\":\"e5195043-ed38-4b47-a19d-221bd397c1b8\"}":{"__typename":"Favorites","uuid":"e5195043-ed38-4b47-a19d-221bd397c1b8","photoUrl":"https://ucarecdn.com/75136dcb-0b32-4840-951b-e33abe9033bb/","title":"Ocean's 11","type":"MOVIE"},"Favorites:{\"uuid\":\"c814a860-7440-49f3-861f-2d5e9ae33b49\"}":{"__typename":"Favorites","uuid":"c814a860-7440-49f3-861f-2d5e9ae33b49","photoUrl":"https://ucarecdn.com/75136dcb-0b32-4840-951b-e33abe9033bb/","title":"Volleyball!","type":"SPORT"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c4c99ea7-68a2-4409-9bc4-11cdd0127fd3\"}":{"__typename":"DeepDives","uuid":"c4c99ea7-68a2-4409-9bc4-11cdd0127fd3","content":"\u003cp\u003eMy dream job is to be a full time screenwriter-director! I am hope to do a little bit of TV and movie writing throughout my career. Writing for a living would be absolutely magical, and the cool thing about writing for TV is that you write as a team, riffing off of each other's jokes, ideas, and character choices!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"1f4037d4-accc-48bd-997a-f182abc4c39e\"}":{"__typename":"DeepDives","uuid":"1f4037d4-accc-48bd-997a-f182abc4c39e","content":"\u003cp\u003eMany of my summers in high school were dedicated to Maui Surfer Girls-- a surf camp in Maui, hence the name, for young women. The camp is focused around empowering girls to surf, but also to be daring, adventurous, and kind. While I \u003cem\u003edid\u003c/em\u003e learn how to surf, I think the most value I got out of the camp was actually the relationships I made with other girls and the confidence I built in myself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1b742df7-e54f-4dc5-9c1c-50885dbc1900\"}":{"__typename":"DeepDives","uuid":"1b742df7-e54f-4dc5-9c1c-50885dbc1900","content":"\u003cp\u003eDon't be afraid to stand up for yourself and to advocate for your needs! Whether it's clarification on a math problem from a teacher, or support from a friend during a rough time, people \u003cem\u003ewant\u003c/em\u003e to see you thrive. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"acc162be-1fe8-40f2-b048-44b38f0d7129\"}":{"__typename":"School","uuid":"acc162be-1fe8-40f2-b048-44b38f0d7129","name":"Woodside Priory School","city":"Portola Valley","type":"HIGH","state":"California","country":"United States","zip":"94028"},"Education:{\"uuid\":\"099a0e22-b0ae-4a4d-889d-8ffdef15f361\"}":{"__typename":"Education","uuid":"099a0e22-b0ae-4a4d-889d-8ffdef15f361","school":{"__ref":"School:{\"uuid\":\"acc162be-1fe8-40f2-b048-44b38f0d7129\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"e3ac1ea1-4267-45dc-a305-45c911f45355\"}":{"__typename":"Education","uuid":"e3ac1ea1-4267-45dc-a305-45c911f45355","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Film Media Studies, Screenwriting track; English, Creative Writing track","degree":null},"MentorPublicProfile:{\"uuid\":\"6755fd64-03ff-4a93-accd-2b0f6f8bbd9f\"}":{"__typename":"MentorPublicProfile","uuid":"6755fd64-03ff-4a93-accd-2b0f6f8bbd9f","displayName":"Gwen S.","slug":"gwendolyncastlekern-spencer","biography":"\u003cp\u003eMy most recent employment at Stanford Sierra Camp as a professional photographer made me a grittier worker, more flexible creative, more vibrant version of myself. I was able to thrive in my resilience as I was determined to produce my best work whether the task was creating a slideshow for the end of every week at camp, capturing memories during family portraits, or making beds during housekeeping. \u003cbr\u003e\u003cbr\u003eMy previous professional roles have been focused on empowerment, motivation, and teamwork as a camp counselor and assistant volleyball coach. While I’m a classically trained artist of 10 years, in the past few years I discovered my deep passion for screenwriting and I’ve been hooked since then. Over the past year I’ve written, directed, and/or produced over 10 projects. \u003cbr\u003e\u003cbr\u003eI take pride in my humor, kindness, follow-through, creativity, and enthusiasm. I’m also a bisexual woman, so queer perspective, self discovery, and fluidity are a through line in much of my work and worldview! Another recurring theme of mine is connection, family, and how to cope through laughter since my family is grieving my dad’s ALS diagnosis and continuous journey with his terminal illness. Because of my background, I bring fresh perspectives on time and place with an emphasis on the elusivity of the “now.” My work aims to unveil truths about growing with grief, to question social norms, and to tell atypical stories about atypical people.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a middle schooler, I was a HUGE Hamilton nerd (I memorized the entire soundtrack and, at one point, was capable of performing the entire show by myself). I was also a little shy, but as soon as I started to play volleyball, my confidence began to change. I was also very into current events, specifically ones that had to do with feminism,  queerness, and social justice. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passion for social justice continued through high school where I organized a letter writing campaign for the 2020 election and got even more involved in clubs and organizations advocating for social progress. I came into my own a lot in high school, which is also where I discovered my knack for creative and analytical writing. My two favorite classes I ever took were APUSH and AP Literature. For a while, I thought my career path was going to be through the neuroscience track, specifically with a focus on gender in the brain, and even more specifically what it looks like to be transgender or nonbinary in the brain. Though I'm more on a writing path now, I still am wildly interested in neuroscience, psych, and sociology and would love to explore it more!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am BEYOND stoked to work with students in creative fields, especially in art and writing! I'm also a very curious person myself and I've been finding a lot of interest in the ethics of AI from a philosophical perspective. I'm a huge movie buff (film media studies woop woop!) but I don't limit myself to the film canon, if you will. My all time favorite movie is Ocean's 11, and I'm a huge Marvel and Star Wars fan. Not to mention, my dad and I have watched The Office 9 times all the way through, and are currently working on our 10th! \u003c/p\u003e","teachingVideoPlaybackId":"q6uMifQ017IwG02gClHLA9V8wchN2IgzqKj02Mt8lHfDdo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing able to introduce my screenwriting idol, Michael Schur, for a talk he gave at Stanford my freshman year. It was a moment where I was able to see my future ahead of me, and showcase my writing skills to one of the biggest writers in the industry!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ac4c3af4-9f5c-4413-9807-3249be80eafb\"}"},{"__ref":"Favorites:{\"uuid\":\"e5195043-ed38-4b47-a19d-221bd397c1b8\"}"},{"__ref":"Favorites:{\"uuid\":\"c814a860-7440-49f3-861f-2d5e9ae33b49\"}"}],"causesSupported":[],"major":"Film Media Studies, Screenwriting track; English, Creative Writing track","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c4c99ea7-68a2-4409-9bc4-11cdd0127fd3\"}"},{"__ref":"DeepDives:{\"uuid\":\"1f4037d4-accc-48bd-997a-f182abc4c39e\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b742df7-e54f-4dc5-9c1c-50885dbc1900\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6a76ee7b-f1ca-4163-a771-0713af9e1f4d/-/preview/-/format/jpg/","https://ucarecdn.com/ad304591-0db6-4dd5-b3ef-0da52b77b4d3/-/preview/-/format/jpg/","https://ucarecdn.com/4ab3cd11-9856-47f0-a268-76d13895f350/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"099a0e22-b0ae-4a4d-889d-8ffdef15f361\"}"},{"__ref":"Education:{\"uuid\":\"e3ac1ea1-4267-45dc-a305-45c911f45355\"}"}],"hiredAt":"2024-01-26T09:12:50.514Z","topics":["Creative Writing","Visual Arts / Graphic Design","Video / Photography","Literature","Film / Theater","Women \u0026 Gender Studies","Law / Government / Policy","Public Speaking","Writing","College Essay Writing"],"communityBadges":["https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/e
