xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"73c3428a-11cf-4052-93ce-cd554b33821f\"}":{"__typename":"Favorites","uuid":"73c3428a-11cf-4052-93ce-cd554b33821f","photoUrl":"https://ucarecdn.com/3e2b4ccf-15bc-4a27-bdf4-d70139972b5a/","title":"Aaron Judge","type":"ATHLETE"},"Favorites:{\"uuid\":\"60249199-8851-41f1-be6a-5aa1c223645e\"}":{"__typename":"Favorites","uuid":"60249199-8851-41f1-be6a-5aa1c223645e","photoUrl":"https://ucarecdn.com/569e0649-217a-4aa0-bbc1-ed5fb0f44b64/","title":"Whiplash","type":"MOVIE"},"Favorites:{\"uuid\":\"3a99ff31-3a22-4b23-b32a-1a202affb534\"}":{"__typename":"Favorites","uuid":"3a99ff31-3a22-4b23-b32a-1a202affb534","photoUrl":"https://ucarecdn.com/c1313f14-f448-456f-8650-c079b9fa1476/","title":"Rome","type":"CITY"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c95936c8-a150-4031-9903-f38a836274fd\"}":{"__typename":"DeepDives","uuid":"c95936c8-a150-4031-9903-f38a836274fd","content":"\u003cp\u003eAs someone who loves traveling and experiencing different cultures, one of my goals in life is to visit 50 countries and all seven continents. While I'm nowhere even close to my goal quite yet, it's always fun checking one off the list!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"bc0a7bea-7823-42b2-a1cb-bf0c5dbc12a6\"}":{"__typename":"DeepDives","uuid":"bc0a7bea-7823-42b2-a1cb-bf0c5dbc12a6","content":"\u003cp\u003eIn high school, I was pretty hard on myself when I wasn't good at things at first. But what I've realized is that learning anything, just like life as a whole, is a process. It's important to embrace the downs as much as we embrace the ups. I'd tell myself to be more patient and take things step by step.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"9e2b527d-ecbd-4d8a-b600-b56226cd97c1\"}":{"__typename":"DeepDives","uuid":"9e2b527d-ecbd-4d8a-b600-b56226cd97c1","content":"\u003cp\u003eMy two greatest mentors have been my two music teachers. The first is my dad, who taught me to play the piano when I was four. He's probably the most disciplined and supportive guy I know. The other was the smartest guy I've ever met - my voice teacher in high school. He taught me the importance of hard work and self-esteem. He passed away a couple of years ago from ALS, but I take what I learned from him with me every single day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"1aaaabdb-9c95-439e-b63d-8d83eb3f74fb\"}":{"__typename":"DeepDives","uuid":"1aaaabdb-9c95-439e-b63d-8d83eb3f74fb","content":"\u003cp\u003eWhen I was a little kid, I was the runner-up in a spaghetti-eating competition. Our hands were tied behind our backs, so we wolfed the pasta down caveman-style. Not too shabby, tasted great.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"e2bff428-180f-47f4-a06d-c839fa2f02e0\"}":{"__typename":"School","uuid":"e2bff428-180f-47f4-a06d-c839fa2f02e0","name":"Paul D. Schreiber High School","city":"Port Washington","type":"HIGH","state":"New York","country":"United States","zip":"11050"},"Education:{\"uuid\":\"bd10a5b9-06f9-436e-8813-47b1ae2e4018\"}":{"__typename":"Education","uuid":"bd10a5b9-06f9-436e-8813-47b1ae2e4018","school":{"__ref":"School:{\"uuid\":\"e2bff428-180f-47f4-a06d-c839fa2f02e0\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"e7269a4e-fb7b-4690-93d7-25ec2f93fa9f\"}":{"__typename":"Education","uuid":"e7269a4e-fb7b-4690-93d7-25ec2f93fa9f","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Journalism \u0026 International Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"af64250f-10fb-4dda-948d-a960f926037c\"}":{"__typename":"MentorPublicProfile","uuid":"af64250f-10fb-4dda-948d-a960f926037c","displayName":"Michael C.","slug":"michael-capobianco","biography":"\u003cp\u003eHey! My name is Michael Capobianco. I’m a rising junior from the New York area studying Journalism and International Studies at Northwestern University.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I was a little kid, I’d run around my house with a toy microphone impersonating the broadcaster for my favorite team, the New York Yankees. I probably spent more time during recess commentating a wiffle ball game than I did playing. My voice has always been a fundamental part of me, and when schools shut down during COVID, I created a sports podcast with one of my friends. What began as an outlet during lockdown became both a legitimate multimedia platform, and a foundation for me to realize my dream.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile I don’t exactly share the same dream that I had a few years ago, I love journalism, producing, and most importantly, telling people’s stories. Last summer, I traveled to the rural Italian legion where my grandfather emigrated from to make a documentary on a trio of villages that are looking to save themselves from depopulation. It was an incredibly fulfilling experience that made me both honored to represent my heritage and proud to share inspiring stories.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe next project that I’ll be working on revolves around two semi-professional basketball players on Long Island who are using the lessons they’ve learned from the game to carve out new paths in their lives. My goal out of college is to produce long-form content for a sports network, so I’d love to work with mentees interested in media, film, and anything else journalism-related!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of class, I love to play the piano. Music has always been my outlet when I’m stressed and need a mental reset. My taste is pretty much everywhere, from old-school hip-hop to jazz to ‘90s rock. My go-to Netflix binge is \u003cem\u003eHow I Met Your Mother\u003c/em\u003e, and I’m always game to talk about sports.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m someone who believes that the best teaching and learning can only come from a great relationship between students and teachers. I’m super excited to connect with my mentees over an extended period of time and be alongside them as a support system as they chase their goals and dreams!\u003c/p\u003e","teachingVideoPlaybackId":"2zpVe1jxeahBNbqLITtD7021Aa402gY02JMIaIeanO3TkM","teachingVideoDescription":null,"greatestAchievement":null,"fa
