xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"da87d623-63ba-4925-86a0-ea5216375918\"}":{"__typename":"Favorites","uuid":"da87d623-63ba-4925-86a0-ea5216375918","photoUrl":"https://ucarecdn.com/46d0a111-fef1-48be-826a-24c272286a7f/","title":"[X X] - LOONA","type":"ALBUM"},"Favorites:{\"uuid\":\"d86192c8-f963-4906-9b38-239fc2dadaf0\"}":{"__typename":"Favorites","uuid":"d86192c8-f963-4906-9b38-239fc2dadaf0","photoUrl":"https://ucarecdn.com/80c48d38-6453-4986-8507-37308b77d9c6/","title":"Omniscient Reader's Viewpoint","type":"BOOK"},"Favorites:{\"uuid\":\"416886b2-e496-4901-b3b0-8656811160ab\"}":{"__typename":"Favorites","uuid":"416886b2-e496-4901-b3b0-8656811160ab","photoUrl":"https://ucarecdn.com/9ebba4a5-e69b-4dd4-9ab8-75b7e9791e88/","title":"Honkai Impact 3rd","type":"GAME"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f0683d2c-d6cb-44eb-8a28-68a4f30af452\"}":{"__typename":"DeepDives","uuid":"f0683d2c-d6cb-44eb-8a28-68a4f30af452","content":"\u003cp\u003eI chose to major in computer science because I love the process of breaking complex problems into smaller pieces and solving them step by step. While building a smart medication dispenser, I spent countless hours debugging code, testing hardware, and refining the system until everything finally worked. One moment that stuck with me was watching a red Skittle I was using as a test “pill” drop perfectly into the tray after so many failed attempts. That small success captured what I enjoy most about computer science: turning an abstract idea into something real.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring the project, I often found myself looking back at the flowcharts I created at the beginning, where the entire system was broken down into simple components. Seeing how each part connected made the problem feel like a puzzle waiting to be solved. That experience made me realize how much I enjoy studying logic, algorithms, and systems that work together to accomplish a goal.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a5c08cc4-65b8-412f-8388-3e77cf84a5b5\"}":{"__typename":"DeepDives","uuid":"a5c08cc4-65b8-412f-8388-3e77cf84a5b5","content":"\u003cp\u003eMentorship matters to me because I know how powerful it is to have someone in your corner when you’re learning something challenging. When I was figuring out math concepts or debugging code that refused to cooperate, what helped most wasn’t just getting the answer. It was having someone explain the reasoning and remind me that struggling didn’t mean I wasn’t capable. That kind of support changes how you see yourself.\u003c/p\u003e\u003cp\u003eI care about mentoring because I want to be that person for someone else. Learning can feel intimidating, especially when you think everyone else understands something you don’t. A good mentor makes difficult things feel approachable and turns confusion into progress, step by step. I love watching the moment when something finally clicks for a student because you can literally see their confidence grow.\u003c/p\u003e\u003cp\u003eMentorship also matters to me because it’s a two way process. Teaching forces me to think more clearly and explain ideas in ways that actually make sense, which deepens my own understanding too.\u003c/p\u003e\u003cp\u003eAt its core, mentorship is about encouragement, patience, and trust. Sometimes, all someone needs is one person who believes they can do it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"3ad4b827-ba22-4881-ae0a-d83f6c9964dd\"}":{"__typename":"DeepDives","uuid":"3ad4b827-ba22-4881-ae0a-d83f6c9964dd","content":"\u003cp\u003eI was the kind of high school student who genuinely loved learning but also had a running mental countdown clock labeled “college applications.” I cared a lot about doing well, sometimes too much, and I definitely had moments where I convinced myself that one imperfect test score would somehow derail my entire future. Looking back, it was a little dramatic, but at the time it felt very real.\u003c/p\u003e\u003cp\u003eAcademically, I was curious and pretty driven. If something interested me, I went all in. I liked understanding how things worked, especially in math and computer science, and I was the student who would keep poking at a problem long after everyone else had moved on just because I wanted to see if I could crack it. I was not satisfied with memorizing steps. I wanted the logic behind them. That mindset helped me build strong problem solving skills, but it also meant I occasionally overcomplicated things because I was determined to find the most elegant solution possible.\u003c/p\u003e\u003cp\u003eOutside of class, I spent a lot of time building projects and experimenting with ideas. I liked the process of creating something from scratch and slowly improving it. At the same time, I was also figuring out how to balance ambition with realism. I wanted to aim high, and yes, I absolutely had that classic “can I actually get into a top school?” anxiety. There were nights when I refreshed application portals more times than I would like to admit. But I also learned how to laugh at myself and keep perspective. Stress and humor ended up being a surprisingly effective combination.\u003c/p\u003e\u003cp\u003eSocially, I was supportive and collaborative. I liked helping classmates understand material and explaining concepts in different ways until something clicked for them. Teaching others actually helped me learn better too, which I did not expect at first.\u003c/p\u003e\u003cp\u003eIf I had to sum it up, I was motivated, curious, slightly anxious, and very determined. I took my goals seriously, but I also learned that growth comes from mistakes, not perfection. I am honestly kind of glad high school me did not have everything figured out automatically, because figuring it out along the way turned out to be a really valuable journey, one I'd like to share with my students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"560a17fa-16fe-4611-aace-d3576c0d5f5a\"}":{"__typename":"DeepDives","uuid":"560a17fa-16fe-4611-aace-d3576c0d5f5a","content":"\u003cp\u003eSomething about me that isn’t obvious right away is that while I do absolutely love classic novels like The Brothers Karamazov by Dostoyevsky, unlike your stereotypical, hoity-toity reading addict, I’m also a webnovel addict. Not in a casual “I read sometimes” way. More like the “I’ll read one more chapter” at midnight, and it's suddenly 3 AM, and I’ve spent the last hour thinking about a webnovel character’s themes and psychology after binging over 300 chapters in one go. Stories stick with me. I like taking them apart and figuring out why they work. \u003c/p\u003e\u003cp\u003eThe series that did the most damage to my sleep schedule is Omniscient Reader’s Viewpoint. The main character, Kim Dokja, is one of the most interesting protagonists I’ve come across. He spends the entire story saving people, but the way he does it is complicated. Every time he sacrifices himself to protect someone, the people around him are forced to watch it happen. They survive, but they’re left shouldering the aftermath. The story keeps implicitly asking whether that kind of self-sacrifice is actually noble, or if it’s just another way of hurting the people you care about. \u003c/p\u003e\u003cp\u003eThe premise also flips the typical fantasy trope of an isekai. Dokja is the only person who has read the story that becomes reality, so he knows what’s going to happen. That sounds like the ultimate advantage, but it mostly turns into pressure. He feels responsible for every bad outcome because he could have prevented it. Instead of empowering him, the knowledge traps him. \u003c/p\u003e\u003cp\u003eI think that’s why the story stuck with me. It takes ideas that sound heroic on paper and pushes them until they start to look uncomfortable. Selflessness, sacrifice, and love are all twisted into negative traits in a very realistic way.\u003c/p\u003e\u003cp\u003eMost people don’t expect this from me at first because I come across as pretty technical. I genuinely love what a lot of people consider \"webnovel slop,\" and I think that kind of affinity for messy narratives and complex characters has helped a lot with my analytical skills in areas like computer science.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"d3a9463f-411f-4922-a15f-3129b74563ab\"}":{"__typename":"School","uuid":"d3a9463f-411f-4922-a15f-3129b74563ab","name":"Alabama School of Cyber Technology and Engineering","city":"Huntsville","type":"HIGH","state":"Alabama","country":"United States","zip":"35805"},"Education:{\"uuid\":\"9576b7c9-c08a-4b4a-b026-430188d78f94\"}":{"__typename":"Education","uuid":"9576b7c9-c08a-4b4a-b026-430188d78f94","school":{"__ref":"School:{\"uuid\":\"d3a9463f-411f-4922-a15f-3129b74563ab\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"1fee8d82-b903-46fe-a562-be17a16e5d49\"}":{"__typename":"Education","uuid":"1fee8d82-b903-46fe-a562-be17a16e5d49","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"44844108-eb60-438f-a099-6fc057133fea\"}":{"__typename":"MentorPublicProfile","uuid":"44844108-eb60-438f-a099-6fc057133fea","displayName":"Ella R.","slug":"ella-raybosh","biography":"\u003cp\u003eHello! I'm Ella Raybosh, a first-year Computer Science student at Columbia Engineering, and I love helping people turn curiosity into real outcomes they can be proud of.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eAbout Me\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNot long ago, I was the student who wanted to build things but did not know where to start. I learned by experimenting, breaking code, fixing it, and asking a lot of questions. Since then, I have:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBuilt full-stack applications that generate user interfaces and HTTP requests directly from API specifications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreated a real-time AI-powered pill dispenser that combines Java servers, Python services, and computer vision for live recognition and hardware control\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDeveloped autonomous vehicle software that detects and identifies obstacles using sensor data\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eUsed Unity to create fun video games to play\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAnd more!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough these experiences, I learned how systems actually work under the surface and how to explain complex ideas in simple language.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy Specialties\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI work best with students who want structured guidance, especially in:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eProgramming and computer science\u003c/strong\u003e from beginner concepts to project-based learning\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMath support\u003c/strong\u003e, including algebra/calculus, problem-solving strategies, and building strong foundations for advanced topics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege essay development\u003c/strong\u003e from brainstorming ideas to refining tone, structure, and clarity\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eProject planning\u003c/strong\u003e so interests turn into tangible results\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI focus on helping students understand why something works, not just how, and on building confidence as well. For instance, many people think coding is unapproachable and too difficult to grasp (black-and-green code from The Matrix and the like), but I have seen how quickly that mindset can change once someone builds their first working project.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eQualifications\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have hands-on experience developing real systems in professional environments, including enterprise API platforms and autonomous navigation software. These roles strengthened my analytical thinking, attention to detail, and ability to explain technical ideas in accessible ways. I bring that same mindset when helping students improve their writing or tackle challenging math concepts. On the ACT, I scored a perfect 36, with a 36 STEM sub-score as well.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I guide someone, I break problems into manageable steps and explain the reasoning behind each decision. A typical session might include:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTurning a general interest into a clear project plan\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWalking through code together and debugging line by line\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing how to explain your work so others understand it\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down a difficult math problem step by step until it makes sense\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTurning essay ideas into a clear narrative with a strong voice and purpose\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch3\u003e\u003cstrong\u003eOutside of coding\u003c/strong\u003e\u003c/h3\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond computer science, I enjoy creative projects that combine storytelling and design. I am currently developing a psychological RPG with branching dialogue and player choice systems, which lets me explore the artistic side of building interactive experiences. I also love archery, digital art, video games (HSR, PJSK, HSR, PTN, Genshin, ZATO, Love Curse, WWM, HI3), K-pop (LOONA, Dreamcatcher, tripleS, ARTMS), webnovels (ORV, GSGW/GDCG) and more.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you are curious, motivated, and ready to learn by doing, I would love to help you build something meaningful.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"tbtxs46Ap465W1KbIva01uKSbdSGYfFOL97oaNBhlP9w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"da87d623-63ba-4925-86a0-ea5216375918\"}"},{"__ref":"Favorites:{\"uuid\":\"d86192c8-f963-4906-9b38-239fc2dadaf0\"}"},{"__ref":"Favorites:{\"uuid\":\"416886b2-e496-4901-b3b0-8656811160ab\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f0683d2c-d6cb-44eb-8a28-68a4f30af452\"}"},{"__ref":"DeepDives:{\"uuid\":\"a5c08cc4-65b8-412f-8388-3e77cf84a5b5\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ad4b827-ba22-4881-ae0a-d83f6c9964dd\"}"},{"__ref":"DeepDives:{\"uuid\":\"560a17fa-16fe-4611-aace-d3576c0d5f5a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bb8d132b-39f6-41b0-88d0-b4616f3c3cb3/-/preview/-/format/jpg/","https://ucarecdn.com/7436c6ca-2d6f-45cd-84f5-88f11b41bad2/-/preview/-/format/jpg/","https://ucarecdn.com/ad005e0e-0d09-4cfe-87c9-07d06743d8bb/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9576b7c9-c08a-4b4a-b026-430188d78f94\"}"},{"__ref":"Education:{\"uuid\":\"1fee8d82-b903-46fe-a562-be17a16e5d49\"}"}],"hiredAt":"2026-02-11T23:47:30.523Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","K-5 Grade Math","6-8 Grade Science","Writing","College Essay Writing","Computer Science","Reading","Academic Coaching","Exec
