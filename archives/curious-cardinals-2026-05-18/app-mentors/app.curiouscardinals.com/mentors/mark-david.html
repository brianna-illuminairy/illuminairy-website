xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"728376a0-b456-4ae0-a33d-7006437653a8\"}":{"__typename":"DeepDives","uuid":"728376a0-b456-4ae0-a33d-7006437653a8","content":"\u003cp\u003ePlay guitar and chess, read, go on runs and work out.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"26b7750d-7905-4a67-aac9-dcb64e80247d\"}":{"__typename":"DeepDives","uuid":"26b7750d-7905-4a67-aac9-dcb64e80247d","content":"\u003cp\u003eMy family. They inspire me to push forward and keep going no matter what obstacles stand in my way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a2cfbde2-4142-4ed4-b915-4312b91a5920\"}":{"__typename":"DeepDives","uuid":"a2cfbde2-4142-4ed4-b915-4312b91a5920","content":"\u003cp\u003eI want to climb Mount Everest someday.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3b8d0a8d-8a21-4822-ba5b-afa39e219732\"}":{"__typename":"DeepDives","uuid":"3b8d0a8d-8a21-4822-ba5b-afa39e219732","content":"\u003cp\u003eDon't stress as much. Everything ultimately works out in the end.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"e4cc4a14-e2c5-4cb4-8dae-249471021cb1\"}":{"__typename":"School","uuid":"e4cc4a14-e2c5-4cb4-8dae-249471021cb1","name":"Lowell High School","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94132"},"Education:{\"uuid\":\"98f112da-b865-46e7-8edd-df6011f10d21\"}":{"__typename":"Education","uuid":"98f112da-b865-46e7-8edd-df6011f10d21","school":{"__ref":"School:{\"uuid\":\"e4cc4a14-e2c5-4cb4-8dae-249471021cb1\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"8d6f1196-f880-481c-8b06-adf7e1a5490c\"}":{"__typename":"Education","uuid":"8d6f1196-f880-481c-8b06-adf7e1a5490c","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"ce9000a7-7317-47bb-8d56-1974c935278c\"}":{"__typename":"MentorPublicProfile","uuid":"ce9000a7-7317-47bb-8d56-1974c935278c","displayName":"Mark P.","slug":"mark-david","biography":"\u003cp\u003eHi, I’m Mark, and I’m genuinely excited to be a tutor with Curious Cardinals. I'm a junior at UC Berkeley from San Francisco, and I care deeply about helping younger students discover both confidence and genuine enjoyment in school. I know what its like to feel overwhelmed by content, and believe “maybe I’m just not a math person” or “maybe I just don’t get this kind of class.” Over time, I figured out systems, routines, tricks, and strategies that actually worked for me. Those same techniques transformed the way I worked. I want to help other students experience this too.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I spend most of my time working on data analysis, problem solving, and modeling. I love seeing how math actually links to the real world and how concepts on paper connect to actual decisions. I'm also a passionate linguistics nerd, and I'm taking mainly linguistics classes this semester.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of class, I'm involved in many different things. I'm in two student consulting clubs on campus, and I'm in the student leadership forum of my college within Berkeley. In my free time I like to play guitar and chess. I love listening to music, and especially classic rock that I can play on my guitar. I also like to work out and run, and more recently I've started swimming more too. I also love mountain biking and skiing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the biggest things I care about in tutoring is helping students feel that they’re not defined by one quiz or one difficult week. School can feel really pressurized, especially when you’re trying to balance different classes, sports, and everything else going on in life. I firmly believe that when students feel supported and are given tools that actually match the way \u003cem\u003ethey\u003c/em\u003e think, everything becomes more manageable. Sometimes the difference between stress and success isn’t intelligence. It’s structure, clarity, and someone who can walk alongside you while you process new material in a way that makes sense.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also love seeing how students grow when they begin to connect what they learn in class to the world around them. Whether it’s tying a statistics question to sports data, or linking a linguistics concept to everyday speech, those moments where something suddenly feels real are my favorite moments to teach.\u003c/p\u003e\u003cp\u003eUltimately, my goal is to help students develop not only stronger grades, but a deeper confidence that lasts longer than one semester. I want to help students build skills they can use in every subject moving forward, and hopefully also help them discover that learning can actually be something they look forward to, and not just something to get through.\u003c/p\u003e","teachingVideoPlaybackId":"KuvI41qqQc5LnJ3vIr7wj32sfCpLnOJG01b4djnDvHIY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI won first place in the National Military History Bee in High School, and took second place in the country in the National History Bee.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"728376a0-b456-4ae0-a33d-7006437653a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"26b7750d-7905-4a67-aac9-dcb64e80247d\"}"},{"__ref":"DeepDives:{\"uuid\":\"a2cfbde2-4142-4ed4-b915-4312b91a5920\"}"},{"__ref":"DeepDives:{\"uuid\":\"3b8d0a8d-8a21-4822-ba5b-afa39e219732\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/26c9a54c-b9a6-45b9-a4e5-9cec6c1c1748/-/preview/-/format/jpg/","https://ucarecdn.com/52588d22-2510-4dd5-8c6d-88d5b3550484/-/preview/-/format/jpg/","https://ucarecdn.com/fb00a051-1684-4e7d-bfcc-461995b22db8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"98f112da-b865-46e7-8edd-df6011f10d21\"}"},{"__ref":"Education:{\"uuid\":\"8d6f1196-f880-481c-8b06-adf7e1a5490c\"}"}],"hiredAt":"2025-10-21T20:42:47.385Z","topics":["History"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/","h
