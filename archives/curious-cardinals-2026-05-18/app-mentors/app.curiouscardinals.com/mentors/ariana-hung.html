xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"988f1726-078c-4c42-adeb-1f1a84539349\"}":{"__typename":"DeepDives","uuid":"988f1726-078c-4c42-adeb-1f1a84539349","content":"\u003cp\u003eYou are doing amazing. This sounds cliché, but it is always nice to look back on everything you have done so far and celebrate yourself. I wish I had done this more often, rather than just keeping my nose to the grindstone and constantly being so overwhelmed every day. It is important to take a break sometimes. Step back, admire how far you have come, and use that as motivation to keep pushing through the hard times. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f2897c6f-cfa1-4d68-b194-b87fcb7b91db\"}":{"__typename":"DeepDives","uuid":"f2897c6f-cfa1-4d68-b194-b87fcb7b91db","content":"\u003cp\u003eTo me, mentorship means more than being successful at teaching a student about a specific topic. It means being someone a student can rely on and turn to for guidance, support, and reassurance. Mentorship is about building trust and creating a space where questions feel welcome and uncertainty feels manageable rather than overwhelming.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHaving a peer mentor in college has done wonders for easing many of my own worries, whether it was about housing, course selection, or simply adjusting to a new environment. Knowing that there was someone who had already gone through similar experiences made challenges feel more approachable and less isolating. That experience showed me how impactful mentorship can be, not just academically, but personally as well.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBecause of this, I want to be that same source of support for someone else. I hope to offer not only academic guidance, but also encouragement and understanding. I want my mentee to feel comfortable asking questions, expressing concerns, and navigating their own path with more confidence.\u003c/p\u003e\u003cp\u003eUltimately, mentorship, to me, is about connection. It is about sharing knowledge, but also about listening, supporting, and helping someone grow into their own independence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e14a3e61-2d95-4d6e-a42b-18d681c2e3f9\"}":{"__typename":"DeepDives","uuid":"e14a3e61-2d95-4d6e-a42b-18d681c2e3f9","content":"\u003cp\u003eOne thing I would like to accomplish is solo traveling at least once in my lifetime. I have never traveled completely on my own, and the idea of it feels both exciting and intimidating. I rarely do things alone or sit in silence for extended periods of time, so stepping into an unfamiliar environment without the comfort of familiarity would challenge me in new ways. I love exploring different cultures, cuisines, and languages so traveling while being more comfortable doing activities alone will challenge me while still feeling both fulfilled and excited by the experience. I want to meet new people, make exciting connections and memories, and be able to bring them back home to share with my family and friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"d5d28a7e-b48f-4d2e-92a1-f04ed4137939\"}":{"__typename":"DeepDives","uuid":"d5d28a7e-b48f-4d2e-92a1-f04ed4137939","content":"\u003cp\u003e\"An apple a day keeps the doctor away\", but unfortunately, this saying does not apply to me. Instead, an apple a day may actually make me see the doctor more often because I am allergic to stone fruits. Sometimes, I feel like I am missing out on the plums and peaches. Do I still take my chances? Why would I not?\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"6f6b77ca-22c2-4770-b795-d285d89f9dca\"}":{"__typename":"School","uuid":"6f6b77ca-22c2-4770-b795-d285d89f9dca","name":"Coney Island Prep Charter School High School","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11223"},"Education:{\"uuid\":\"78fb7814-8d1a-49cc-8a61-0041c35a6f5e\"}":{"__typename":"Education","uuid":"78fb7814-8d1a-49cc-8a61-0041c35a6f5e","school":{"__ref":"School:{\"uuid\":\"6f6b77ca-22c2-4770-b795-d285d89f9dca\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"f7122edd-5f0a-482f-9f76-aa3b71547b67\"}":{"__typename":"Education","uuid":"f7122edd-5f0a-482f-9f76-aa3b71547b67","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Government and Anthropology","degree":null},"MentorPublicProfile:{\"uuid\":\"d6d87640-558e-48ed-85e2-c60f584d8b8e\"}":{"__typename":"MentorPublicProfile","uuid":"d6d87640-558e-48ed-85e2-c60f584d8b8e","displayName":"Ariana H.","slug":"ariana-hung","biography":"\u003cp\u003eHi! My name is Ariana, and I am from Brooklyn, NY. Growing up in such a culturally diverse environment has allowed me to explore different cuisines, be exposed to different languages, and meet people from a wide range of backgrounds. There is truly nothing more fulfilling than being surrounded by so many cultures that constantly encourage me to keep an open mind and learn something new every day. With this upbringing, I’ve developed a love for exploring new things, whether it is a sport, a hobby, or a new show, and I am always open to chatting about what excites others and exchanging ideas.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I loved learning French and had amazing opportunities to become a teacher’s assistant and to participate in a study abroad program where I immersed myself in Francophone culture during the summer of my junior year. I assisted in developing lesson plans for French 1, French 2, and French 3, as well as teaching 90-minute courses for French 3. These experiences challenged me to think not only about language itself, but also about how it is taught and used to connect people. Additionally, although my study abroad program did not require French as a prerequisite, my language skills allowed me to become someone my peers could rely on when they needed support navigating both the language and daily communication in new environments.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFurthermore, I currently hold the Director of Curriculum position in my advocacy club at Cornell University, where our mission is to make civic engagement and education more accessible to students on campus. In this role, I develop and organize educational content that we bring to different student organizations. We have taught topics like professionalism, leadership development, and advocacy, and we have hosted panels on social issues relevant to both our campus and the wider world. For example, we recently held a farmworker awareness panel in recognition of National Farmworker Awareness Week, where we highlighted the working conditions farmworkers face, and discussed why these challenges persist today, as well as how awareness can lead to change. We aim to make education in persuasion, argumentation, and advocacy more accessible to people on and off campus. \u003c/p\u003e","teachingVideoPlaybackId":"VcN259Dm8j38jEkiZyMiNfc57TSviFn6cgh8o6yiCYI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing the first person in my family to go to college, not to mention an Ivy League! It was incredibly stressful and overwhelming going through the college application process and the high school senior year journey. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI could not turn to my parents for help because they barely spoke English, let alone help me with my application. I sought out countless teachers for advice on how to strengthen my profile, spent days in office hours to ensure I was still on top of my schoolwork, and spent what felt like forever dreaming and hoping my dreams would come true. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I got my acceptance to Cornell University, everything felt worth it. That is what I am proud of. My determination and my perseverance brought about a result that makes me proud of being an FGLI (first-generation low-income) student. \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Government and Anthropology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"988f1726-078c-4c42-adeb-1f1a84539349\"}"},{"__ref":"DeepDives:{\"uuid\":\"f2897c6f-cfa1-4d68-b194-b87fcb7b91db\"}"},{"__ref":"DeepDives:{\"uuid\":\"e14a3e61-2d95-4d6e-a42b-18d681c2e3f9\"}"},{"__ref":"DeepDives:{\"uuid\":\"d5d28a7e-b48f-4d2e-92a1-f04ed4137939\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9e9820d4-a9dc-4c08-8427-c8684b7db40f/-/preview/-/format/jpg/","https://ucarecdn.com/1cd6fbc4-3707-4b8a-b380-69691ec22f1a/-/preview/-/format/jpg/","https://ucarecdn.com/2af97311-05db-4b41-8b03-c11afa50bbb4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"78fb7814-8d1a-49cc-8a61-0041c35a6f5e\"}"},{"__ref":"Education:{\"uuid\":\"f7122edd-5f0a-482f-9f76-aa3b71547b67\"}"}],"hiredAt":"2026-04-11T04:42:24.743Z","topics":[],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ariana-hung\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d6d87640-558e-48ed-85e2-c60f584d8b8e\"}"}}},"_sentryTraceData":"29601d1608714e99b457d597780fa3f2-88a5bf14aa0be10d-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=29601d1608714e99b457d597780fa3f2,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ariana-hung"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager
