xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"165282c1-5b50-4fd2-beef-49f27e26f933\"}":{"__typename":"Favorites","uuid":"165282c1-5b50-4fd2-beef-49f27e26f933","photoUrl":"https://ucarecdn.com/19c36648-5bb1-49b7-b16a-cf08f38d417b/","title":"Sza","type":"ARTIST"},"Favorites:{\"uuid\":\"0c423a1e-0457-425e-89b4-6350e49c053c\"}":{"__typename":"Favorites","uuid":"0c423a1e-0457-425e-89b4-6350e49c053c","photoUrl":"https://ucarecdn.com/b024ff08-7a03-46e8-8809-09cfd6007b42/","title":"Knives Out","type":"MOVIE"},"Favorites:{\"uuid\":\"4e6a47e1-c5e2-4781-8d1e-106251032280\"}":{"__typename":"Favorites","uuid":"4e6a47e1-c5e2-4781-8d1e-106251032280","photoUrl":"https://ucarecdn.com/3504ebbb-6378-4b25-8fd3-c07cb2d835aa/","title":"NYC","type":"CITY"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3a58954d-4033-4c56-bddc-98535c103e6e\"}":{"__typename":"DeepDives","uuid":"3a58954d-4033-4c56-bddc-98535c103e6e","content":"\u003cp\u003eIn my spare time I like to go for walks, listen to music, spend time with friends, and make pottery!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9bf0ebcb-1585-42f9-9194-e5c3b9f9066a\"}":{"__typename":"DeepDives","uuid":"9bf0ebcb-1585-42f9-9194-e5c3b9f9066a","content":"\u003cp\u003eI would tell my middle and high school self to step out of her comfort zone more. I was a pretty shy kid during those years and often hesitant to take risks. If I had challenged myself to try more extracurriculars, connect with my teachers, and explore new opportunities, I could have discovered new passions and built meaningful connections.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"7ca08370-ea4b-4ec5-a701-2fec894e53dd\"}":{"__typename":"DeepDives","uuid":"7ca08370-ea4b-4ec5-a701-2fec894e53dd","content":"\u003cp\u003eI choose to mentor because of the impact my own mentors had on me growing up. Whether it was teachers who met with me weekly to support my academic growth or older students who served as role models and confidants, their guidance made a difference in my life. I hope to have that same impact on other students!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"3b17ce76-818b-49d8-a5e9-e78e397a9971\"}":{"__typename":"School","uuid":"3b17ce76-818b-49d8-a5e9-e78e397a9971","name":"Trinity School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10024"},"Education:{\"uuid\":\"ee31c53b-2d29-4fc9-8392-38a98b3c1b4d\"}":{"__typename":"Education","uuid":"ee31c53b-2d29-4fc9-8392-38a98b3c1b4d","school":{"__ref":"School:{\"uuid\":\"3b17ce76-818b-49d8-a5e9-e78e397a9971\"}"},"startYear":"2015","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bf414d61-018f-48e0-9c3c-98b3ed3a37ca\"}":{"__typename":"School","uuid":"bf414d61-018f-48e0-9c3c-98b3ed3a37ca","name":"Tufts University","city":"Medford","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02155"},"Education:{\"uuid\":\"7d74f512-675d-4d45-a1b8-2a393d9f6cb6\"}":{"__typename":"Education","uuid":"7d74f512-675d-4d45-a1b8-2a393d9f6cb6","school":{"__ref":"School:{\"uuid\":\"bf414d61-018f-48e0-9c3c-98b3ed3a37ca\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"81bc24bf-d3b1-4848-8bf3-d4bd87c9d453\"}":{"__typename":"MentorPublicProfile","uuid":"81bc24bf-d3b1-4848-8bf3-d4bd87c9d453","displayName":"Mia G.","slug":"mia-goldblum","biography":"\u003cp\u003eMy name is Mia Goldblum, and I am a student at Tufts University pursuing a Bachelor's degree in Political Science.\u003c/p\u003e\u003cp\u003eI am passionate about civic engagement, menstrual equity, social justice and the ways in which knowledge, leadership, and collaboration can create meaningful change. Growing up in New York City, I have always been fascinated by the systems that shape our world—whether through law, politics, or community engagement. I believe that true progress comes not just from individual success but from collective action and shared understanding.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo far at Tufts I have had the opportunity to explore different academic interests by taking classes like Sociology, Western Political Thought, Dinosaurs, and even a one-semester class taught by other Tufts students on the impact of the Supreme Court.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my studies, I am actively involved in organizations that promote civic engagement and menstrual equity. My work with Days for Girls in high school and PERIOD in college—both organizations dedicated to ending menstrual poverty and breaking period stigma—has allowed me to advocate for change and make an impact in my community. At school I have also been involved with Jumbovote, a club that aims to improve civic engagement at Tufts.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn the past I have been a day camp counselor, a math mentor and a spanish tutor which is why I hope to continue this type of mentorship with Curious Cardinals. I have also been on the student side of these relationships, and experienced first hand how much a strong role model and mentor can make a difference.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and extracurriculars, I enjoy listening to music, making pottery, and exploring NYC and Boston. I can’t wait to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"ZKohQHD8y8iA02S6eCXtIwHL2ogk8R02ED01X0101FSYRk01w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"165282c1-5b50-4fd2-beef-49f27e26f933\"}"},{"__ref":"Favorites:{\"uuid\":\"0c423a1e-0457-425e-89b4-6350e49c053c\"}"},{"__ref":"Favorites:{\"uuid\":\"4e6a47e1-c5e2-4781-8d1e-106251032280\"}"}],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3a58954d-4033-4c56-bddc-98535c103e6e\"}"},{"__ref":"DeepDives:{\"uuid\":\"9bf0ebcb-1585-42f9-9194-e5c3b9f9066a\"}"},{"__ref":"DeepDives:{\"uuid\":\"7ca08370-ea4b-4ec5-a701-2fec894e53dd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/34231915-8ce1-43ba-b59b-41e2e7395b93/-/preview/-/format/jpg/","https://ucarecdn.com/db7ab179-10d3-4a83-ba6f-b8cba555324b/-/preview/-/format/jpg/","https://ucarecdn.com/a28899ad-d291-4f07-af19-46f6b4f0ee36/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ee31c53b-2d29-4fc9-8392-38a98b3c1b4d\"}"},{"__ref":"Education:{\"uuid\":\"7d74f512-675d-4d45-a1b8-2a393d9f6cb6\"}"}],"hiredAt":"2025-03-05T02:08:47.331Z","topics":["K-5 Grade Math"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mia-goldblum\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"81bc24bf-d3b1-4848-8bf3-d4bd87c9d453\"}"}}},"_sentryTraceData
