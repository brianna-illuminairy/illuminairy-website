xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3acdeb83-f839-4aa0-bf4b-a64396dda153\"}":{"__typename":"Favorites","uuid":"3acdeb83-f839-4aa0-bf4b-a64396dda153","photoUrl":"https://ucarecdn.com/fae7c8d8-746d-4038-b47f-52fdaf7d06a6/","title":"Martin Lawrence","type":"ACTOR"},"Favorites:{\"uuid\":\"e61c67ca-0564-4dd3-90d4-968c4c89b870\"}":{"__typename":"Favorites","uuid":"e61c67ca-0564-4dd3-90d4-968c4c89b870","photoUrl":"https://ucarecdn.com/f9b6af53-786b-40f5-a61f-d35055e47057/","title":"J Cole - Friday Night Lights","type":"ALBUM"},"Favorites:{\"uuid\":\"fe5f3750-f864-437d-be74-fb6a17f8ab65\"}":{"__typename":"Favorites","uuid":"fe5f3750-f864-437d-be74-fb6a17f8ab65","photoUrl":"https://ucarecdn.com/115acf85-5226-4685-a9d5-30f9a6ee9be9/","title":"Christian Pulisic","type":"ATHLETE"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"38709a62-1258-416d-ba8d-e9153e679d90\"}":{"__typename":"DeepDives","uuid":"38709a62-1258-416d-ba8d-e9153e679d90","content":"\u003cp\u003eMentorship matters to me because it’s a two-way street of growth—I’ve learned just as much from the students I’ve worked with as I hope they’ve learned from me. I’ve seen how consistent support can unlock confidence and direction. Having had great mentors in my own life, I know how transformative it is to have someone believe in you and help connect the dots between your interests and your potential. I see mentorship not just as teaching, but as empowering—helping curious learners build the tools and courage to pursue their own path, inside and outside the classroom.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cc5298e6-abb3-4494-9c67-78aacbdcde4d\"}":{"__typename":"DeepDives","uuid":"cc5298e6-abb3-4494-9c67-78aacbdcde4d","content":"\u003cp\u003eIn my spare time, I love playing basketball, exploring new ideas for my startup Village, and watching documentaries. I also really value just hanging out with friends, whether grabbing food or exploring around New Haven.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"501c433a-7034-4d21-8762-d6405a60725a\"}":{"__typename":"DeepDives","uuid":"501c433a-7034-4d21-8762-d6405a60725a","content":"\u003cp\u003eA passion project I’m actively building is Village, a digital marketplace where college students can monetize their skills and local clients can find affordable, reliable talent. The idea clicked for me and my co-founder after we worked a moving job and saw firsthand how disconnected local demand was from student supply.\u003c/p\u003e\u003cp\u003eTo turn this vision into reality, we spoke with students and small business owners to validate the need. We then mapped out our platform’s core features: student profiles, service listings, a secure messaging system, and a review structure. On the technical side, I taught myself to code the front-end and back-end using AI tools in order to accelerate development and be able to troubleshoot in real-time. After testing a functional prototype, I navigated the Apple review process to successfully publish Village on the App Store.\u003c/p\u003e\u003cp\u003eThe platform directly addresses a two-sided problem: it gives students a centralized, trusted space to offer services like tutoring, design, or moving help, while providing local individuals and small businesses with vetted, affordable talent right in their community. Village turns scattered opportunity into connected, mutual growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"7c02c4d8-2eeb-4c9a-870f-ddda8f408cb3\"}":{"__typename":"DeepDives","uuid":"7c02c4d8-2eeb-4c9a-870f-ddda8f408cb3","content":"\u003cp\u003eMy greatest role model is my grandfather on my mom's side. He has lived in the same city as my family my whole life, and his journey has always inspired me. Born in Iran, he moved to the U.S. in his 20s, learned English, and eventually became a statistics professor at Marquette University.\u003c/p\u003e\u003cp\u003eFrom him, I’ve learned the deep value of hard work, loyalty, and caring for family—but just as importantly, he’s shown me how to live with joy and kindness. He has a wonderful sense of humor and believes in treating everyone with respect, whether family or stranger. He has this special way of making people’s days brighter, and watching him do that throughout my childhood taught me that small acts of kindness really do matter. He’s not just a mentor in ambition, but in character.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"39744398-5f71-4d27-aaca-47d377883bad\"}":{"__typename":"School","uuid":"39744398-5f71-4d27-aaca-47d377883bad","name":"University School of Milwaukee","city":"River Hills","type":"HIGH","state":"Wisconsin","country":"United States","zip":"53217"},"Education:{\"uuid\":\"d26ae1e8-9233-4e30-a5a4-cd8015f227e9\"}":{"__typename":"Education","uuid":"d26ae1e8-9233-4e30-a5a4-cd8015f227e9","school":{"__ref":"School:{\"uuid\":\"39744398-5f71-4d27-aaca-47d377883bad\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b07a24cd-19bd-40e5-bf02-d7cbc6ec8e70\"}":{"__typename":"Education","uuid":"b07a24cd-19bd-40e5-bf02-d7cbc6ec8e70","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2028","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"cabe75ac-c7ea-46cc-b6fd-28e7e6d6d492\"}":{"__typename":"MentorPublicProfile","uuid":"cabe75ac-c7ea-46cc-b6fd-28e7e6d6d492","displayName":"Zadan M.","slug":"zadan-mason","biography":"\u003cp\u003eHey! I’m Zadan, a Yale undergraduate studying Cognitive Science, and I’m truly passionate about the power of mentorship and hands-on, engaging learning. My own journey in education has been shaped by meaningful experiences both inside and outside the classroom, and nothing excites me more than helping students unlock their curiosity and confidence.\u003c/p\u003e\u003cp\u003eMy tutoring path really took shape through several direct experiences. In New Haven, I provide 1:1 tutoring to local middle and high schoolers with the Yale Urban Improvement Corps. Before that, I worked with middle schoolers in Madison, WI through the AVID program, supporting students who are often the first in their families to set their sights on college. I also coordinated and mentored high schoolers through the MSCR after-school program at Vel Phillips Memorial High School, where I helped organize activities and support teachers. My commitment to mentoring actually started back in high school in Milwaukee, where I served as a Co-Leader for Operation DREAM, a non-profit providing developmental support and mentorship for boys.\u003c/p\u003e\u003cp\u003eBeyond traditional education, I’m deeply interested in entrepreneurship and real-world skill-building. I’m a co-founder of Village, a digital platform designed to help college students become micro-entrepreneurs by teaching them how to monetize their skills. That blend of education and initiative really drives me. This mindset was also shaped by earlier experiences, from door-to-door canvassing for Wisconsin Public Radio to internships in legal and policy spaces, like with the Yale AI Policy Initiative.\u003c/p\u003e\u003cp\u003eMy academic interests are pretty wide-ranging, and I enjoy connecting ideas across fields. I’ve assisted in research across diverse topics—from sports medicine and cardiac emergency preparedness to economic studies on income inequality and homelessness policy. These experiences have honed my ability to take complicated subjects and break them down into relatable, understandable concepts, a skill I bring into every tutoring session.\u003c/p\u003e\u003cp\u003eWhen I’m not studying or tutoring, you can usually find me on the basketball court playing with the Yale Club Basketball team, or unwinding with a thought-provoking documentary or movie. I believe learning happens everywhere, and I strive to bring that energy and adaptability into my mentoring.\u003c/p\u003e\u003cp\u003eUltimately, I’m all about building genuine connections, fostering curiosity, and helping students not only reach their academic goals but also get excited about their own potential and interests.\u003c/p\u003e","teachingVideoPlaybackId":"jzJq5VjylQxsg1UkaWeG211rdeF5Y9Kzq500RQhbPZz00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"u
