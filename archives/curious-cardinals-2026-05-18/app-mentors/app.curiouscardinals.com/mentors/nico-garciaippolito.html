xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b30a4447-eec9-49ac-b887-990c3e54b757\"}":{"__typename":"DeepDives","uuid":"b30a4447-eec9-49ac-b887-990c3e54b757","content":"\u003cp\u003eAs the oldest of two, I never had an older brother or sister that blazed that path for me in terms of navigating high school and college. I feel like it's super important to have someone older you can rely on that went through the same journey just a few years ago. I hope I can be that someone to a mentee at CC!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"eb611706-c252-4e12-83ff-53dd95beffcb\"}":{"__typename":"DeepDives","uuid":"eb611706-c252-4e12-83ff-53dd95beffcb","content":"\u003cp\u003eGrowing up in one culture at home and learning another outside of my house helped me become adaptable. As a mentor, this allows me to adjust to various learning styles and accommodate diverse perspectives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"1e7793bc-f8a3-4d35-a4d8-135f0f292f58\"}":{"__typename":"DeepDives","uuid":"1e7793bc-f8a3-4d35-a4d8-135f0f292f58","content":"\u003cp\u003eOver the summers, I was a camp counselor for a variety of different summer camps. I began as a counselor for my old preschool in their day camp my freshman summer, and then worked as a tennis camp counselor for my high school coach for the rest of the summers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"f2ecef35-8b7c-444b-ab98-10be0739b1b5\"}":{"__typename":"School","uuid":"f2ecef35-8b7c-444b-ab98-10be0739b1b5","name":"St. Stephen's and St. Agnes Upper School","city":"Alexandria","type":"HIGH","state":"Virginia","country":"United States","zip":"22304"},"Education:{\"uuid\":\"0cc8d23e-6273-47a7-9e60-038bd7d60d07\"}":{"__typename":"Education","uuid":"0cc8d23e-6273-47a7-9e60-038bd7d60d07","school":{"__ref":"School:{\"uuid\":\"f2ecef35-8b7c-444b-ab98-10be0739b1b5\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"4529dba0-7db0-474c-a49d-14d216f250dd\"}":{"__typename":"Education","uuid":"4529dba0-7db0-474c-a49d-14d216f250dd","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Industrial Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"6d0bb20d-f004-4f51-a02c-9e0a0e0b57c6\"}":{"__typename":"MentorPublicProfile","uuid":"6d0bb20d-f004-4f51-a02c-9e0a0e0b57c6","displayName":"Nico G.","slug":"nico-garciaippolito","biography":"\u003cp\u003eHey everyone!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy name is Nico Garcia-Ippolito, and I'm currently a senior at Northwestern University studying Industrial Engineering.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was born and raised in Alexandria, Virginia (a DC suburb), but my parents are both from Bogotá, Colombia. Through this, I grew up appreciating cultural differences in music, traditions, and food. I also grew up speaking Spanish at home.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHere at Northwestern, I aim to balance technical rigor with social engagement to become as well-rounded an individual as possible. I'm majoring in IE purely because of my passion for math and statistics, where finding that \"one right answer\" is crucial for informed decision-making. Outside the classroom, I've immersed myself in Northwestern's entrepreneurship ecosystem: I work part-time at the Querrey InQbation Lab, an incubator for startups born from Northwestern University research, and I'm currently trying my luck at a startup with a few friends.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I’ve enjoyed working in diverse roles across several industries, each offering new challenges and insights. Recently, I helped identify strategic initiatives at Cavnue, a transportation technology startup focused on building smarter roadways. I also had the opportunity to develop a product launch plan for a wound care product at Medline Industries, a medical equipment company. These experiences not only broadened my skill set but also confirmed my passion for creating a tangible, positive impact in fields that directly improve lives and communities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy true passion lies in sports. Growing up, soccer was more than just a pastime. Although it began as a connection to my family's South American heritage, it turned into a burning obsession. My childhood was filled with either watching or playing soccer, from club teams to school. I learned so much from the sport—not only the game itself but also the importance of sportsmanship, collaboration, and leadership. Here at Northwestern, I'm an intramural soccer referee and part of the Men's Club Soccer team.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my goal is not only to help my mentees gain expertise in their specific areas of interest but also to support them in becoming well-rounded individuals. Please feel free to reach out with any questions—I’m excited to start working with you!\u003c/p\u003e","teachingVideoPlaybackId":"fJMJhh5ImMrOhg3K8mu301z01jnrKjG6b00Px6bXfmvt4s","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Industrial Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b30a4447-eec9-49ac-b887-990c3e54b757\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb611706-c252-4e12-83ff-53dd95beffcb\"}"},{"__ref":"DeepDives:{\"uuid\":\"1e7793bc-f8a3-4d35-a4d8-135f0f292f58\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/365e64f9-7875-4f33-becf-4d95ff8fbbee/-/preview/-/format/jpg/","https://ucarecdn.com/84c2f817-7fa5-4988-81ee-14fa18595ba3/-/preview/-/format/jpg/","https://ucarecdn.com/f0aa50e6-76eb-495f-bd12-96f85aa2d9e8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"0cc8d23e-6273-47a7-9e60-038bd7d60d07\"}"},{"__ref":"Education:{\"uuid\":\"4529dba0-7db0-474c-a49d-14d216f250dd\"}"}],"hiredAt":"2024-10-31T03:46:35.711Z","topics":["Spanish","Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nico-garciaippolito\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6d0bb20d-f004-4f51-a02c-9e0a0e0b57c6\"}"}}},"_sentryTraceData":"2709f5920ca5498aa6a2ad5964516c1e-918d479c02b2555c-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc400851
