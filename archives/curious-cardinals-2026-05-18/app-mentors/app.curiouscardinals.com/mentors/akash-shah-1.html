61","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Symbolic Systems (AI)","degree":null},"MentorPublicProfile:{\"uuid\":\"5c86de9b-fc5c-4171-b7ff-68d23e8a8d8e\"}":{"__typename":"MentorPublicProfile","uuid":"5c86de9b-fc5c-4171-b7ff-68d23e8a8d8e","displayName":"Akash S.","slug":"akash-shah-1","biography":"\u003cp\u003eHello! I am a computer science student at Stanford, concentrating in artificial intelligence, with a deep passion for both technology and music. Since I was seven, music has been omnipresent in my life—I started with piano and singing, picked up the flute at twelve, and more recently, I’ve been learning guitar. At Stanford, I continue to explore my love for music through elective classes, performing with my a cappella group, the Mendicants, and playing jazz.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn the technical side, I’ve worked several internships in software/data, gaining experience with real-world applications of AI and engineering. I’m especially excited about the intersection of AI and music—while generative music models are advancing rapidly, I believe that the current state of these models is not truly music as I understand it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics and work, I like to keep a balanced life. I split my time between studying, building meaningful relationships, exercising, and having fun. A fun fact about me: I trained and competed in MMA throughout high school! I’ve also spent time tutoring and running summer camps focused on STEM concepts, which has been a rewarding way to share my love for learning with others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether through code, music, or mentorship, I enjoy creating and connecting with people—and I'm looking forward to meeting you!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"Mw7M3016YaCk01ebMKBXnWLzD00H02CARqT6QeNo100rFUFM","teachingVideoDescription":nul
