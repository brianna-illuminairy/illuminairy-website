xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"84bef004-7247-4dfa-a5ba-d7e3d7f2640a\"}":{"__typename":"DeepDives","uuid":"84bef004-7247-4dfa-a5ba-d7e3d7f2640a","content":"\u003cp\u003eMy biggest piece of advice would be to calm down. I know that’s easier to say now, having gone through the college admissions process, but that’s exactly why I would tell myself this. Everything does work out. If you take a breath, trust yourself, and follow what genuinely excites you, you will end up exactly where you’re meant to be.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"7c1ce1ab-ff8e-4d49-84ce-40cb344e50a8\"}":{"__typename":"DeepDives","uuid":"7c1ce1ab-ff8e-4d49-84ce-40cb344e50a8","content":"\u003cp\u003eMy dream job is teaching. Growing up, one of my favorite books and movies was \u003cem\u003eMatilda\u003c/em\u003e, and I deeply admired Miss Honey. Because of her, I’ve realized that one day I want to channel the same care, patience, and belief in students—especially for students in Indiana.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"4e2e0a30-36a2-4e9b-b8bb-731f8c98a163\"}":{"__typename":"DeepDives","uuid":"4e2e0a30-36a2-4e9b-b8bb-731f8c98a163","content":"\u003cblockquote\u003e\u003cp\u003eIn high school, I was always in motion. One day you could find me on the softball field, the next in an International Baccalaureate classroom, and by spring I might be wearing a crown as prom queen. Somewhere in between, I was leading a nonprofit and serving as class president, guided mostly by curiosity and a willingness to try anything that called my name. Looking back, that constant exploring was a gift. By stepping into so many different worlds, I learned not only what I was good at, but what truly lit me up. It was through wandering that I eventually found direction—and the passions I now hold with intention.\u003c/p\u003e\u003c/blockquote\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e3c88964-1b15-4426-9e21-4b95a8f7ddf4\"}":{"__typename":"DeepDives","uuid":"e3c88964-1b15-4426-9e21-4b95a8f7ddf4","content":"\u003cp\u003eIn my spare time, I’m usually doing one of two things. I’m either preparing for cheerleading games—practicing routines, staying conditioned, and getting into the right mindset for game day—or I’m unwinding on Discord with friends, playing Valorant. Both spaces are important to me: cheerleading gives me structure, teamwork, and energy, while gaming offers a way to relax, connect, and have fun with people I care about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"dc1c219e-2537-4691-b220-e073ca3194f2\"}":{"__typename":"School","uuid":"dc1c219e-2537-4691-b220-e073ca3194f2","name":"Pike High School","city":"Indianapolis","type":"HIGH","state":"Indiana","country":"United States","zip":"46268"},"Education:{\"uuid\":\"2c43d67f-48da-454c-bf58-2d4fb607fc3f\"}":{"__typename":"Education","uuid":"2c43d67f-48da-454c-bf58-2d4fb607fc3f","school":{"__ref":"School:{\"uuid\":\"dc1c219e-2537-4691-b220-e073ca3194f2\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"82da2778-afd2-40fd-9b5e-fed7c9d45f49\"}":{"__typename":"Education","uuid":"82da2778-afd2-40fd-9b5e-fed7c9d45f49","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Ethics, Politics, and Economics and History","degree":null},"MentorPublicProfile:{\"uuid\":\"bea24457-03ea-4aac-82f3-07cb8ce2d05e\"}":{"__typename":"MentorPublicProfile","uuid":"bea24457-03ea-4aac-82f3-07cb8ce2d05e","displayName":"Dieynaba N.","slug":"dieynaba-ndiaye","biography":"\u003chr\u003e\u003chr\u003e\u003cp\u003e\u003cstrong\u003eHi!\u003c/strong\u003e My name is \u003cstrong\u003eDieynaba Ndiaye\u003c/strong\u003e, and I’m from \u003cstrong\u003eIndianapolis, Indiana\u003c/strong\u003e. I’m currently a \u003cstrong\u003esecond-year student at Yale University\u003c/strong\u003e, where I’m majoring in \u003cstrong\u003eEthics, Politics, and Economics (EPE)\u003c/strong\u003e and \u003cstrong\u003eHistory\u003c/strong\u003e. Outside the classroom, I’m a proud member of the \u003cstrong\u003eYale Cheerleading Team\u003c/strong\u003e, where I’ve learned the importance of teamwork, discipline, and leadership while representing the university at athletic and community events.Academically, I’m passionate about understanding how economic systems, political structures, and ethical frameworks shape the way societies function and interact. I’m particularly interested in the intersection of \u003cstrong\u003efinance, policy, and sustainability\u003c/strong\u003e, and I hope to pursue a career that allows me to combine analytical thinking with meaningful impact. I’m fascinated by how responsible economic and political decision-making can improve lives and strengthen communities. At Yale, I’m involved in several \u003cstrong\u003ebusiness and professional organizations\u003c/strong\u003e that have allowed me to develop valuable leadership and collaboration skills while gaining hands-on experience in finance and entrepreneurship. These experiences have strengthened my ability to think critically, communicate effectively, and approach challenges from multiple perspectives. Beyond academics, I founded and currently run my own \u003cstrong\u003enonprofit organization\u003c/strong\u003e, which has become a deeply fulfilling part of my life. Through this work, I’ve learned to balance leadership and empathy while empowering others and giving back to my community. The experience has shaped my understanding of the impact young people can have when they take initiative and work collectively toward positive change. In my free time, I love \u003cstrong\u003ewriting\u003c/strong\u003e, whether it’s journaling, reflective essays, or creative pieces. Writing allows me to process my thoughts, explore new ideas, and express myself authentically. It’s also something I hope to continue developing as a lifelong skill, especially as I grow in both academic and professional settings. I also played the string bass for 10 years for various symphony orchestra’s, so I’ve grown to love classical music. Outside of school and work, I find joy in \u003cstrong\u003etraveling\u003c/strong\u003e, \u003cstrong\u003ehorseback riding\u003c/strong\u003e, and \u003cstrong\u003espending time with my family\u003c/strong\u003e. Traveling allows me to explore new cultures and perspectives, while horseback riding gives me a sense of freedom and mindfulness. My family is my greatest source of inspiration—they’ve taught me the value of hard work, compassion, and resilience. I’m fluent in \u003cstrong\u003eEnglish, Spanish, and French\u003c/strong\u003e, and I hope to learn \u003cstrong\u003eChinese\u003c/strong\u003e in the future to deepen my global understanding and communication skills. I’m so excited to be working with \u003cstrong\u003eCurious Cardinals\u003c/strong\u003e and to bring my enthusiasm for learning, creativity, and mentorship to this community. I look forward to connecting with others, sharing experiences, and continuing to grow both personally and professionally through this opportunity.\u003c/p\u003e","teachingVideoPlaybackId":"TFSBqgfpUHuL8lSWXdomfUE9At5RYCt01OmI6eWXO00ic","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Ethics, Politics, and Economics and History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"84bef004-7247-4dfa-a5ba-d7e3d7f2640a\"}"},{"__ref":"DeepDives:{\"uuid\":\"7c1ce1ab-ff8e-4d49-84ce-40cb344e50a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"4e2e0a30-36a2-4e9b-b8bb-731f8c98a163\"}"},{"__ref":"DeepDives:{\"uuid\":\"e3c88964-1b15-4426-9e21-4b95a8f7ddf4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d084deda-4646-4fb8-87e8-cbd03cc653d8/-/preview/-/format/jpg/","https://ucarecdn.com/0b077125-19a0-40a9-822a-1d256e89f605/-/preview/-/format/jpg/","https://ucarecdn.com/94c81f9e-bbbc-4875-893d-830427021a44/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2c43d67f-48da-454c-bf58-2d4fb607fc3f\"}"},{"__ref":"Education:{\"uuid\":\"82da2778-afd2-40fd-9b5e-fed7c9d45f49\"}"}],"hiredAt":"2025-11-06T16:09:09.332Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","P
