e applications, brand identities, and editorial layouts. She led the design program at the DALI Lab, a Dartmouth innovation hub filled with designers, developers and project managers working with external clients to build digital solutions. Her favorite projects have been TactTiles, a modular therapeutic sensory toy for autistic children to self-regulate mood zones, and Flourish, an AI-driven symptom tracking app for patients with chronic illnesses to reclaim control over their health. She looks forward to working with young makers and guiding them to build their dreams!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science, Studio Art and Product Design","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/e13652e2-eb3b-40d9-bb75-09bd63cc72a9/-/crop/692x692/0,76/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d2757efe-736b-4222-88ff-fb05a9bbab33\"}"}],"hiredAt":"2022-09-19T17:37:01.000Z","topics":["Cooking","Algebra II","Visual Arts / Graphic Design","Biology","Writing","K-5 Grade Math","Public Speaking","Product Design","Algebra I","Coding / Programming","Geometry","STEM Project","Pre-Algebra","Web Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"carson-levine\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"870ba7e0-f71b-4fff-824c-bfe14d2b4171\"}"}}},"_sentryTraceData":"ce91d2c815324b1b92ee03fc2ea03224-ba9aa412b5d4259a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ce91d2c815324b1b92ee03fc2ea03224,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[s
