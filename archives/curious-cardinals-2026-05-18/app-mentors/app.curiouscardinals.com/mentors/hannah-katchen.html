xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b04c89f8-05fa-4bde-98c7-288d77230ad1\"}":{"__typename":"DeepDives","uuid":"b04c89f8-05fa-4bde-98c7-288d77230ad1","content":"\u003cp\u003eI wish I had asked more questions instead of trying to figure everything out on my own. Looking back, the people around me — in my community, my family, my hometown — had so much knowledge, experience, and perspective to share, and I was too stubborn or too proud to tap into it. There's this pressure when you're young to seem like you have it all together, but the reality is that the most interesting people I've met are the ones who are always asking, always curious, always willing to learn from whoever's in the room. I could have saved myself a lot of unnecessary struggle, and learned so much more, if I'd just asked a few more questions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d72cca20-7387-4517-831c-10a6f201b4fe\"}":{"__typename":"DeepDives","uuid":"d72cca20-7387-4517-831c-10a6f201b4fe","content":"\u003cp\u003eI chose Classics because I became obsessed with thinking about how Western thought traces back to ancient Greece and Rome. The more I learned, the more I realized that philosophy, law, politics, art, and even the way universities are structured all have deep roots in the ancient world — and I wanted to understand why. Studying Classics felt like getting access to the source code of Western academia, which I find both fascinating and worth interrogating. Classics gives me the tools to ask questions rigorously, and I love that it sits right at the intersection of language, philosophy, and history all at once.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a4b6c739-c091-4c3e-ba18-f49ff0a3d47d\"}":{"__typename":"DeepDives","uuid":"a4b6c739-c091-4c3e-ba18-f49ff0a3d47d","content":"\u003cp\u003eMy dream is to go back to Alaska and teach. Whether that looks like a high school philosophy classroom or a university course on Alaska Native studies, I want to be the kind of educator who opens doors for students the way certain teachers opened them for me. There's something that feels really full-circle about it — spending my time at Cornell studying the foundations of Western thought while also writing about Alaska Native history, and hoping to bring both of those worlds back home. Alaska deserves educators who take its history and its people seriously, and I think my background in Classics helps because I understand how powerful it is when a culture's knowledge and philosophy get treated as worth studying. I want students in Alaska to feel that about their own heritage.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b9d213e5-47cb-4dd3-98ed-840f2ee26e8b\"}":{"__typename":"DeepDives","uuid":"b9d213e5-47cb-4dd3-98ed-840f2ee26e8b","content":"\u003cp\u003eMy high school summers were pretty much perfect. I spent my mornings and afternoons working at a quaint neighborhood bakery, which is honestly where my love of food and baking really took root. Then as soon as my shift was done, I was out the door. My friends and I spent every spare moment hiking and camping all over Alaska. We explored mountains, forests, coastlines, through boats, bikes, skis, and planes. Looking back, those summers gave me two things I still carry everywhere: a deep love for being outside and a serious appreciation for really good bread.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"0c9165c2-daf3-4930-b58d-7e35f095ea96\"}":{"__typename":"School","uuid":"0c9165c2-daf3-4930-b58d-7e35f095ea96","name":"Service High School","city":"Anchorage","type":"HIGH","state":"Alaska","country":"United States","zip":"99507"},"Education:{\"uuid\":\"cafb83d7-fc53-49af-aec0-34502f1259c5\"}":{"__typename":"Education","uuid":"cafb83d7-fc53-49af-aec0-34502f1259c5","school":{"__ref":"School:{\"uuid\":\"0c9165c2-daf3-4930-b58d-7e35f095ea96\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"13f85e78-de0a-4bc0-9e68-32aef5e2a2a7\"}":{"__typename":"Education","uuid":"13f85e78-de0a-4bc0-9e68-32aef5e2a2a7","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Classics","degree":null},"MentorPublicProfile:{\"uuid\":\"89e8683e-5abb-46e3-b2b0-796653ae8ae2\"}":{"__typename":"MentorPublicProfile","uuid":"89e8683e-5abb-46e3-b2b0-796653ae8ae2","displayName":"Hannah K.","slug":"hannah-katchen","biography":"\u003cp\u003eHi!! I'm a Classics major with an Art History minor, drawn to the discipline because I can't stop asking a fundamental question: why is Western academia so thoroughly rooted in Greek and Roman thought? Studying philosophy, language, and culture from the ancient world isn't just an academic exercise for me — it's a way of tracing how we think, argue, and build knowledge today.\u003c/p\u003e\u003cp\u003eOutside the classroom, I spend a lot of my time in Ithaca tutoring students and writing articles on Alaska Native history and art for an undergraduate research publication — work that feels like the natural flip side of my Classics studies, interrogating which histories get centered and which get pushed to the margins. I grew up in Alaska, and that background shapes everything about how I approach the ancient world. In the future I hope to produce research centering around Alaska Native studies and one day become a teacher or professor.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOutside of school, I live for being outdoors. I ski, hike, and bike wherever and whenever I can, but growing up in Alaska took that to a whole other level. I've kayaked among sea otters, ice climbed through glaciers, skated on lakes tucked away in the mountains, snowshoed to huts deep in mountain valleys, and I’ve skied out of a plane! I've spent nights in cabins perched on snowy peaks, on the rocky shore of an island in Kachemak Bay, and deep in buggy forests miles from anything resembling civilization. Alaska has a way of making you feel very small and very alive at the same time, and I wouldn't trade that for anything.\u003c/p\u003e\u003cp\u003eI'm also completely obsessed with food. My friends and I have made trips to NYC purely for food tours — no museums, no shopping, just eating our way through the city. That love of food eventually turned into something more: I'm currently working on my own cookbook tracing the history of cakes from all over the world, because it turns out that what people bake says a lot about who they are, where they come from, and what they celebrate. It's basically Classics, but with more butter.\u003c/p\u003e","teachingVideoPlaybackId":"VXEFYWrSXprMLZAeEfXng8egPW8dPrLv2XB22jJnzfg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Classics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b04c89f8-05fa-4bde-98c7-288d77230ad1\"}"},{"__ref":"DeepDives:{\"uuid\":\"d72cca20-7387-4517-831c-10a6f201b4fe\"}"},{"__ref":"DeepDives:{\"uuid\":\"a4b6c739-c091-4c3e-ba18-f49ff0a3d47d\"}"},{"__ref":"DeepDives:{\"uuid\":\"b9d213e5-47cb-4dd3-98ed-840f2ee26e8b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/da16e886-0b77-4ae4-b275-709960347345/-/preview/-/format/jpg/","https://ucarecdn.com/74f717f6-7114-43bb-81d6-d21ff9ebe0db/-/preview/-/format/jpg/","https://ucarecdn.com/947f170a-2b78-4f21-be1f-8401c92ca461/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cafb83d7-fc53-49af-aec0-34502f1259c5\"}"},{"__ref":"Education:{\"uuid\":\"13f85e78-de0a-4bc0-9e68-32aef5e2a2a7\"}"}],"hiredAt":"2026-03-18T23:51:38.858Z","topics":["K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","Writing","College Essay Writing","Reading","History","Academic Coaching","Executive Function","K-6 Storybook","Creative Writing","History Project","Law / Government / Policy","Journalism","Debate","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hannah-katchen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"89e8683e-5abb-46e3-b2b0-796653ae8ae2\"}"}}},"_sentryTraceData":"af805d5f54e945a893414c7710107cca-8b6187671102e3ee
