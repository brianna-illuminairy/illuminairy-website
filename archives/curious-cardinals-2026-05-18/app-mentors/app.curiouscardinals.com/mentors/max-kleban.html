xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"11550260-22af-4040-ac4b-7f105719739a\"}":{"__typename":"DeepDives","uuid":"11550260-22af-4040-ac4b-7f105719739a","content":"\u003cp\u003eOutside of various retail jobs, I spent my summers training with the cross country team.  Five days a week I would get up at 5:30 am (I know) to run workouts with the team to be prepared for the season in the fall.  I have no idea how I did that because now I sometimes find it difficult to get out of bed for my 10am classes.  I had never run before high school and I wanted to show myself that I could do something difficult.  I became really close with my teammates, and they helped motivate me and show me that even though I may not have been the fastest, by putting in the hard work and discipline, I could be an important part of the team.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"37b887db-5fef-4c93-ab3a-78a5e0f8c49c\"}":{"__typename":"DeepDives","uuid":"37b887db-5fef-4c93-ab3a-78a5e0f8c49c","content":"\u003cp\u003eTo have a show on Broadway\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6b056159-2984-435e-808a-202977a697c6\"}":{"__typename":"DeepDives","uuid":"6b056159-2984-435e-808a-202977a697c6","content":"\u003cp\u003eOne on one education I believe is so vital in really becoming great at something.  After coming to college, I have had some amazing mentors who have helped me with my writing by giving specific, individualized feedback on my work.  By them getting to know me, rather than just teach me, they really have come to understand the way I think and engage with my art and are more equipped to challenge me and help me grow as an artist, something I want to be able to share with others!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7769aff1-1153-4f1b-8f99-4f534737235a\"}":{"__typename":"DeepDives","uuid":"7769aff1-1153-4f1b-8f99-4f534737235a","content":"\u003cp\u003eI really love going to museums.  Going to school in NYC means I have access to so many cool museums I never had the chance to go to back home in Alabama.  I particularly love going to the Met, it's so enormous.  I've been a dozen times and still haven't seen everything!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"68fe7cf2-ce94-4d1f-8f17-f736b708a0f9\"}":{"__typename":"School","uuid":"68fe7cf2-ce94-4d1f-8f17-f736b708a0f9","name":"St. Michael Catholic High School","city":"Fairhope","type":"HIGH","state":"Alabama","country":"United States","zip":"36532"},"Education:{\"uuid\":\"2cdc11f0-c298-4e56-8f6d-65c33d47941e\"}":{"__typename":"Education","uuid":"2cdc11f0-c298-4e56-8f6d-65c33d47941e","school":{"__ref":"School:{\"uuid\":\"68fe7cf2-ce94-4d1f-8f17-f736b708a0f9\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"4ef314ee-8cb4-4be8-83dc-39a4968d9857\"}":{"__typename":"Education","uuid":"4ef314ee-8cb4-4be8-83dc-39a4968d9857","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Music","degree":null},"MentorPublicProfile:{\"uuid\":\"2b89704e-53bb-4964-9345-fc2f66958c27\"}":{"__typename":"MentorPublicProfile","uuid":"2b89704e-53bb-4964-9345-fc2f66958c27","displayName":"Max K.","slug":"max-kleban","biography":"\u003cp\u003eMy name is Max Kleban, and I am a junior at Columbia University majoring in Music with a focus in Composition. I am a composer, dramatic storyteller, and music director. I have composed, music directed, and conducted two full-length musicals, including the 132nd Annual Varsity Show, an annual original musical that boasts alumni including Richard Rodgers, Oscar Hammerstein, Greta Gerwig, and others. In addition to composing this year’s Varsity Show, I have orchestrated the past two Varsity Shows, arranging scores for up to eighteen musicians at a time.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also a New York Youth Symphony Musical Theatre Songwriting Fellow, where I study under composer Michael Kooman, and an executive board member of First Stages, a Columbia/Barnard student organization dedicated to original musical theatre education, development, and production. Through First Stages, I have had the opportunity to lead educational masterclasses with various Broadway professionals, including composer of Wicked Stephen Schwartz, Tony Award-winning musical theatre and opera composer Jeanine Tesori, and Tony, Grammy, Emmy, and Pulitzer Prize-winning composer Tom Kitt.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond my work in musical theatre, I have experience in contemporary classical composition, studying under composers such as Marcos Balter and Zosha Di Castri. My works have been performed by YarnWire, an award-winning professional percussion ensemble. Even in my abstract pieces, I employ musical storytelling techniques and seek to connect with my audience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside Columbia, I give piano lessons to students ages 5-17 at the Salvation Army. This work is particularly meaningful to me because I discovered my own passion for music through piano lessons as a young child. In my hometown of Gulf Shores, Alabama, I began studying classical piano when I was six years old. After years of playing Chopin, Mozart, Beethoven, and Bach, I ventured into jazz piano and realized my love for the Great American Songbook, the foundation of American musical theatre. While I continued playing piano at home, I learned percussion and tuba in my high school’s wind band. These experiences in diverse musical genres and instruments gave me a well-rounded education in music that has shaped my compositional style today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not writing musicals, leading rehearsal rooms, and practicing piano, I can be found going for long walks in Riverside Park, cooking Italian and Puerto Rican dishes with my girlfriend, and tap dancing in Dormeshia’s tap classes. I am so excited to be working with Curious Cardinals so that I may continue to foster the passion of young musicians!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"Qr001pYaKcsWxlYVWvIYZI00mwzv6daNzKaF13T003c00EY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Music","deepDives":[{"__ref":"DeepDives:{\"uuid\"
