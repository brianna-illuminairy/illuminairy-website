s","zip":"20057"},"Education:{\"uuid\":\"4e52ad51-ec95-470c-933a-2cd15a0d45c8\"}":{"__typename":"Education","uuid":"4e52ad51-ec95-470c-933a-2cd15a0d45c8","school":{"__ref":"School:{\"uuid\":\"841c38e6-da3b-4744-a827-f0417ef23547\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Finance + CS","degree":null},"MentorPublicProfile:{\"uuid\":\"1d963e29-e52b-4a5e-a2f5-9e0a58aa73de\"}":{"__typename":"MentorPublicProfile","uuid":"1d963e29-e52b-4a5e-a2f5-9e0a58aa73de","displayName":"Sean S.","slug":"sean-summers","biography":"\u003cp\u003eSean is a senior at Georgetown University, where he is majoring in Finance.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in Richmond, Sean developed an early interest in entrepreneurship and international markets. Throughout high school, he was an active student leader, serving as student body president each year and attending an entrepreneurship-focused academy. He also founded a tutoring club to help his peers excel academically and ran a successful candy business, which gave him hands-on experience in managing and growing a small venture. Throughout high school, Sean developed a passion for business, finance, technology, and history, which set the foundation for his later decision to pursue an entrepreneurial path beyond traditional career roles. His love for history even led him to run a historical meme page that gathered a huge following in high school, blending humor with historical events to engage a wide audience.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Georgetown, Sean's passion for finance led him to take on leadership roles, including serving as the President of BlackGen Capital and founding a PC club on campus. He also gained hands-on experience through internships in investment banking at RBC and in real estate private equity. During his junior summer, Sean chose to forgo offers from Centerview Partners and McKinsey to work on a startup in the Middle East, which gave him invaluable insights into entrepreneurship and international business.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCurrently, Sean is preparing to embark on his journey in global entrepreneurship, where he plans to explore and build businesses internationally. He is passionate about mentoring and empowering others to think independently, which he has already done by mentoring peers into competitive finance roles. Sean looks forward to using his experiences to help students grow academically, develop new skills, and achieve their personal and professional goals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn his free time, Sean enjoys traveling, coding, and learning about different cultures. He is excited to work with ambitious students and provide guidance that can help them succeed!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"i0000KKdWLsVo4011dCeVYklW01RqohKMMkwN01owVfh900Q8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing able to walk away from offers from top banks and consulting firms for my junior year summer to work on a start up in the Middle East\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f63568f3-4d97-4374-a175-ffc8ad74db7c\"}"},{"__ref":"Favorites:{\"uuid\":\"55f39bfd-2ee1-4e66-9b5a-3ceefd4d8376\"}"}],"causesSupported":[],"major":"Finance + CS","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c2b3590b-0d27-4e47-b2de-c12e38f6289a\"}"},{"__ref":"DeepDives:{\"uuid\":\"db609185-1c09-42ba-809a-dd4d0b8f875f\"}"},{"__ref":"DeepDives:{\"uuid\":\"8153e563-bd05-482f-8154-68c23ac6cd3d\"}"},{"__ref":"DeepDives:{\"uuid\":\"56b33df7-1a25-4764-b657-0d437588c731\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ccfb14c6-e455-4204-8bcf-e5608eb57935/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4220c8a7-c1ea-4cd4-b520-2658800b7f7e\"}"},{"__ref":"Education
