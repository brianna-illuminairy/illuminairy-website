\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f8023b3f-5a5e-4675-870e-c91adbc3882d\"}":{"__typename":"DeepDives","uuid":"f8023b3f-5a5e-4675-870e-c91adbc3882d","content":"\u003cp\u003eI chose my major because of my incredible teachers and professors that believed in my writing capabilities and pushed me towards success!\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8f9f7b09-3fe9-4fab-b316-dbeaad138c5e\"}":{"__typename":"DeepDives","uuid":"8f9f7b09-3fe9-4fab-b316-dbeaad138c5e","content":"\u003cp\u003eMentorship matters to me because it is a key facet in any development stage of life. Everyone needs a mentor truly!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"da4c4421-5b10-498e-b02c-f73f0794c1b7\"}":{"__typename":"DeepDives","uuid":"da4c4421-5b10-498e-b02c-f73f0794c1b7","content":"\u003cp\u003eI would tell my high school self that her dreams are not too large and her aspirations are not overwhelming....all she needs is a little bit of faith and a great mentor. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"675c0954-677e-4a77-8d50-86894618d928\"}":{"__typename":"School","uuid":"675c0954-677e-4a77-8d50-86894618d928","name":"Saint Andrew's School","city":"Boca Raton","type":"HIGH","state":"Florida","country":"United States","zip":"33434"},"Education:{\"uuid\":\"0fa60ce0-bc5e-4e1c-a8e8-6f6e662d14d1\"}":{"__typename":"Education","uuid":"0fa60ce0-bc5e-4e1c-a8e8-6f6e662d14d1","school":{"__ref":"School:{\"uuid\":\"675c0954-677e-4a77-8d50-86894618d928\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"60c8dfb6-f079-46b2-82ea-b14f29624b35\"}":{"__typename":"School","uuid":"60c8dfb6-f079-46b2-82ea-b14f29624b35","name":"University of Miami","city":"Coral Gables","type":"COLLEGE","state":"Florida","country":"United States","zip":"33146"},"Education:{\"uuid\":\"1a854f7b-eeec-41ad-a2a9-4ada57d37aca\"}":{"__typename":"Education","uuid":"1a854f7b-eeec-41ad-a2a9-4ada57d37aca","school":{"__ref":"School:{\"uuid\":\"60c8dfb6-f079-46b2-82ea-b14f29624b35\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Journalism ","degree":null},"MentorPublicProfile:{\"uuid\":\"d16f800f-f190-4054-bae0-6168747bc870\"}":{"__typename":"MentorPublicProfile","uuid":"d16f800f-f190-4054-bae0-6168747bc870","displayName":"Chase F.","slug":"chase-finizio","biography":"\u003cp\u003eI am a seasoned writer with a B.A. in Journalism and a minor in Strategic Communication, Public Relations, and Advertising. I am currently a master’s student at Columbia University, where I am continuing to strengthen my skills in communication, critical thinking, and working with diverse populations in meaningful and impactful ways. My academic background has provided me with a strong foundation in storytelling, effective communication, and understanding how to connect with different audiences. I am especially passionate about using these skills to support and empower young people as they navigate both academic and personal growth.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, I am committed to continuously growing alongside the students I work with, always seeking new ways to better support, understand, and connect with them. I value open communication not only with students but also with families, recognizing the importance of a collaborative approach in fostering a student’s success. I am eager to bring my passion, dedication, and experience into this role, and I look forward to building meaningful relationships that leave a lasting, positive impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to my academic experience, I have been deeply involved in athletics, particularly equestrian sports, which have played a significant role in shaping my discipline, resilience, and work ethic. Through sports, I have developed strong time management skills and the ability to persevere through challenges while maintaining focus and motivation.\u003c/p\u003e\u003cp\u003eI am extremely passionate about helping future generations build a diverse and educationally informed skill set. I strive to create a supportive and engaging environment where young people feel encouraged to express themselves, build confidence, and explore their interests. I believe mentorship goes beyond academic support and includes fostering personal growth and self-awareness. I am particularly interested in helping students strengthen their academic abilities, develop communication skills, and explore potential passions or career paths.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI aim to meet each individual where they are, recognizing their strengths while supporting their growth in areas of challenge. Through my experiences, I bring strong communication skills, adaptability, patience, and a genuine commitment to helping others succeed both academically and personally. I am excited about the opportunity to contribute as a mentor and make a meaningful impact. I would be honored and grateful to be a small part of your child’s journey.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe I bring a unique perspective to mentorship that includes real-world experience both inside and outside of influential classroom settings. Mentors have been of immense value to me throughout my own educational journey, and I hope to pass along that same inspiration to any student I am fortunate enough to work with here at the Curious Cardinals community!\u003c/p\u003e","teachingVideoPlaybackId":"qb78cOagb02Xtv87JfAHmkOjWHTyod4EVlsGwAHzFrX8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWinning top 10 in the Nation for horseback-riding and my 4.0 at Columbia!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"785804b5-1732-44d8-a5b2-224b84f217cc\"}"},{"__ref":"Favorites:{\"uuid\":\"f6a20510-a73f-49c7-9250-299a5340e645\"}"},{"__ref":"Favorites:{\"uuid\":\"53af4c84-8993-4732-bc57-3e28ce2e2d8f\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"93dc89ed-3e50-4ddb-8936-5e7a5bf4a0bc\"}"},{"__ref":"CausesSupported:{\"uuid\":\"6ffc39d7-b4b1-40d5-831d-cc94552385af\"}"}],"major":"Journalism ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2e781cc4-0752-4622-a707-2bfe30b08737\"}"},{"__ref":"DeepDives:{\"uuid\":\"f8023b3f-5a5e-4675-870e-c91adbc3882d\"}"},{"__ref":"DeepDives:{\"uuid\":\"8f9f7b09-3fe9-4fab-b316-dbeaad138c5e\"}"},{"__ref":"DeepDives:{\"uuid\":\"da4c4421-5b10-498e-b02c-f73f0794c1b7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fda82838-55ae-48ce-9741-875848a85c95/-/preview/-/format/jpg/","https://ucarecdn.com/15c7b1c2-3938-4ce0-b405-99323f3592e8/-/preview/-/format/jpg/","https://ucarecdn.com/48db4065-7e30-4530-98db-bceeff330bb0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0fa60ce0-bc5e-4e1c-a8e8-6f6e662d14d1\"}"},{"__ref":"Education:{\"uuid\":\"1a854f7b-eeec-41ad-a2a9-4ada57d37aca\"}"}],"hiredAt":"2026-04-06T20:36:11.956Z","topics":["K-5 Grade Math","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","K-6 Storybook","Creative Writing","History Project","Fashion / Cosmetics","Journalism"],"communityBadg
