xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"34617e84-7c0c-41b4-b1a8-e1286aa7993a\"}":{"__typename":"Favorites","uuid":"34617e84-7c0c-41b4-b1a8-e1286aa7993a","photoUrl":"https://ucarecdn.com/d9cbb8d6-0fed-4116-957a-ac23f7d60c04/","title":"There Will Be Blood","type":"MOVIE"},"Favorites:{\"uuid\":\"1cb262c9-1497-4638-9770-a9fc87db6e34\"}":{"__typename":"Favorites","uuid":"1cb262c9-1497-4638-9770-a9fc87db6e34","photoUrl":"https://ucarecdn.com/d9cbb8d6-0fed-4116-957a-ac23f7d60c04/","title":"Skyrim","type":"GAME"},"Favorites:{\"uuid\":\"251f6c1b-49dd-4278-a214-36151e0ad3c8\"}":{"__typename":"Favorites","uuid":"251f6c1b-49dd-4278-a214-36151e0ad3c8","photoUrl":"https://ucarecdn.com/d9cbb8d6-0fed-4116-957a-ac23f7d60c04/","title":"Alex Pereira","type":"ATHLETE"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"fa952fd8-ee28-42b5-85f0-d1be0e251c80\"}":{"__typename":"DeepDives","uuid":"fa952fd8-ee28-42b5-85f0-d1be0e251c80","content":"\u003cp\u003eFor the first half of my high-school education, I spent my summers at band camp. I was a part of my school's concert and marching band, and I remember the summers I spent there fondly. Rehearsing under the South Carolina sun, trying to get the drumline together, repeating sets over and over again. The exhaustion made riffing with my friends all the more enjoyable, and at the end we had a collective work to be proud of. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy final summer, I was a part of an initiative -- \"Bike to the Future.\" We interviewed policy officials, advocates, and city workers on bike and pedestrian infrastructure in Greenville and Atlanta. We collated our findings, wrote policy briefs, and presented them to the South Carolina DOT. We then put our research into practice and made temporary alterations to our city's biking infrastructure to make it safer to commute.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3727fc51-93b7-494b-a7c6-83b98a1d311f\"}":{"__typename":"DeepDives","uuid":"3727fc51-93b7-494b-a7c6-83b98a1d311f","content":"\u003cp\u003eStaying in shape is a big part of maintaining my personal well-being, and that's been the case since I got into wrestling in high-school. I enjoy focusing on strength training and trying to push myself past what I'm capable of. Wrestling also imparted on me an interest in combat sports. There's something about the autonomy that being able to handle yourself affords you that I find reassuring. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"1870cd66-efbb-46ab-93fd-281940dd0395\"}":{"__typename":"DeepDives","uuid":"1870cd66-efbb-46ab-93fd-281940dd0395","content":"\u003cp\u003eIf I could have any job in the world, I'd be a stand-up comedian. Hold your laughter. Despite the cliché, I've had a knack for making people laugh for most of my life (intentional or otherwise), and it'd be a dream to make that into a career.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI've actually gotten into comedy in the last year, and I've put considerable effort into writing material that I'm proud of, which culminated in an hour-long special that I put together. My goal with the special, and with comedy in general, is to speak to some broader purpose in the subtext of the material. George Carlin was my favorite comedian as a kid, and his approach to stand-up has shaped the way I write and perform.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2458b194-31ae-4c27-8b45-f809a4ec2e78\"}":{"__typename":"DeepDives","uuid":"2458b194-31ae-4c27-8b45-f809a4ec2e78","content":null,"videoPlaybackId":"p6wPGdr2KttL002br00ym42ZJixVYo5pCg500M6kiauo00k","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"f5016e05-249e-4811-b96e-d93f836676f8\"}":{"__typename":"School","uuid":"f5016e05-249e-4811-b96e-d93f836676f8","name":"South Carolina Governor's School for Science and Mathematics","city":"Hartsville","type":"HIGH","state":"South Carolina","country":"United States","zip":"29550"},"Education:{\"uuid\":\"b033c0ed-59e0-4a75-ba96-7718c202c6d6\"}":{"__typename":"Education","uuid":"b033c0ed-59e0-4a75-ba96-7718c202c6d6","school":{"__ref":"School:{\"uuid\":\"f5016e05-249e-4811-b96e-d93f836676f8\"}"},"startYear":"2018","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"c87c3653-41ac-426a-a56b-c4dbaa824289\"}":{"__typename":"Education","uuid":"c87c3653-41ac-426a-a56b-c4dbaa824289","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"500a30a7-d588-4161-84fe-f7e09f57f06b\"}":{"__typename":"MentorPublicProfile","uuid":"500a30a7-d588-4161-84fe-f7e09f57f06b","displayName":"Zeke M.","slug":"zeke-mcdavid","biography":"\u003cp\u003eHello! My name is Zeke. I’m passionate about family, writing, and expression. This is what each of those things mean to me:\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eApplying to college, I was daunted by a world that my family had never been a part of. But my mother and sister have been my rocks my whole life, and it was through their support that I have the fortune of being the first in my family to attend college. Their encouragement has never wavered, and it is for that reason that I’ve always felt I could do anything.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eSo, what do I do? In academics, I’ve explored political science, philosophy, and writing with the most depth. If I had to choose which of those subjects I’ve enjoyed the most, it would be writing, hands-down. To me, writing is one of the most fundamental skills a student can have. Writing is not only eloquent prose, but critical thinking. It is argument, information, creative expression. It is a policy brief, a lab report, a short story. Good writing is the foundation for communication, and education is the communication of ideas. I like to think I’ve made the most of my education because I’m not too shabby at writing.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eWriting goes beyond my academic interests and into what I do for fulfillment. For three years, I was a part of the mock trial team at Yale, where I sharpened my flair for the dramatic in the courtroom (a la Law and Order). After becoming an ace attorney, I traded in my tie for a clown nose and took to comedy. Sketch and stand-up, specifically. Funnily enough, through portraying dramatic witnesses and being a doofus on stage, I’ve found performance art to be an incredibly rewarding mode of expression. So rewarding, in fact, that I recently wrote, produced, and performed an hour-long set of stand-up material in a college theater (which I’m very proud of).\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eBeyond that, I enjoy working out and training in mixed martial arts. I keep up with the UFC, am a pizza connoisseur, and listen to incompatible genres of music.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThat’s about all I have for now, but I hope I can get to know you better through mentorship! Hope to speak soon.\u003c/p\u003e","teachingVideoPlaybackId":"25jWt3xrdiiaywjgvZjfvRsxq5004p6hDYN9lRiWD8Ok","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"34617e84-7c0c-41b4-b1a8-e1286aa7993a\"}"},{"__ref":"Favorites:{\"uuid\":\"1cb262c9-1497-4638-9770-a9fc87db6e34\"}"},{"__ref":"Favorites:{\"uuid\":\"251f6c1b-49dd-4278-a214-36151e0ad3c8\"}"}],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fa952fd8-ee28-42b5-85f0-d1be0e251c80\"}"},{"__ref":"DeepDives:{\"uuid\":\"3727fc51-93b7-494b-a7c6-83b98a1d311f\"}"},{"__ref":"DeepDives:{\"uuid\":\"1870cd66-efbb-46ab-93fd-281940dd0395\"}"},{"__ref":"DeepDives:{\"uuid\":\"2458b194-31ae-4c27-8b45-f809a4ec2e78\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9336a981-dc8f-43bf-bc68-e146dbf28aa3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"b033c0ed-59e0-4a75-ba96-7718c202c6d6\"}"},{"__ref":"Education:{\"uuid\":\"c87c3653-41ac-426a-a56b-c4dbaa824289\"}"}],"hiredAt":"2024-05-11T19:47:56.658Z","topics":["K-6 Storybook","Creative Writing","Film / Theater","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUER
