9d\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"844b9326-d963-48ce-9f7a-ff813ec7b14f\"}":{"__typename":"DeepDives","uuid":"844b9326-d963-48ce-9f7a-ff813ec7b14f","content":null,"videoPlaybackId":"7sapBvBKMNKZmXyRzlDeWy5GLRHla2qF012pzJRcVt200","question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"9a8872d0-f677-4d78-9184-b671bc342fd9\"}":{"__typename":"School","uuid":"9a8872d0-f677-4d78-9184-b671bc342fd9","name":"Hunter College Campus Schools","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"adc7f3ae-e447-40ad-b8a0-4bee7ea3acd0\"}":{"__typename":"Education","uuid":"adc7f3ae-e447-40ad-b8a0-4bee7ea3acd0","school":{"__ref":"School:{\"uuid\":\"9a8872d0-f677-4d78-9184-b671bc342fd9\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"0df8f52c-99f3-4dc0-ad98-9f8b9c92f69b\"}":{"__typename":"Education","uuid":"0df8f52c-99f3-4dc0-ad98-9f8b9c92f69b","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2027","major":"Industrial Labor Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"4a7d6fe8-863b-4fb3-9425-6d914f7245d3\"}":{"__typename":"MentorPublicProfile","uuid":"4a7d6fe8-863b-4fb3-9425-6d914f7245d3","displayName":"Chris H.","slug":"chris-huang","biography":"\u003cp\u003eHi! My name is Chris Huang and I'm currently a junior studying Industrial Labor Relations with minors in Business and Data Science at Cornell University. I’m a native New Yorker having grown up in Brooklyn and I love everything New York sports, F1, rock climbing, and reading.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in a now gentrified, low-income, first-generation immigrant community, I have been shaped to commit myself to expanding opportunities for marginalized groups. This passion for helping others pushed me to work at a nonprofit in Queens, New York where I spent two years doing labor advocacy and organizing food distributions during the pandemic. This work in the nonprofit industry inspired me to pursue social sciences and business, as they both teach me to understand the operations and strategy behind things. In my freshman year, I went to the University of Notre Dame, studying Strategic Management. However, I had always been more interested in sociology and social science which is what pushed me to transfer to Cornell. Here, at Cornell, I’m learning a variety of coursework from economics, psychology, sociology, and law with a specific focus on labor and employment. In addition to that, I’m a project manager for two social impact consulting clubs on campus, meaning that I manage a team of analysts and am in constant communication with the client. For me, I chose clients that resonated with social impact issues that I’m the most passionate about: affordable housing and healthcare.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I’ve spent a lot of time in leadership and analytical roles. I have worked as a research analyst at Trivest Advisors, a hedge fund in Hong Kong, where I led a research project outlining where technology companies were building out AI data centers and creating investment strategies based on who had the best leverage in the market. Additionally, I have worked with professional consultants from McKinsey to KPMG analysts on a semester-long case project, analyzing social impact practices and how to implement AI into restaurant operations.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am fluent in Cantonese and grounded in my heritage and my cultural background. I have had experiences with mentoring students on a variety of subjects, ranging from Geometry to AP Microeconomics. In each of my experiences working with students, I have loved building personal connections with them; to me, being a tutor is more than just inspiring a student, but rather it’s about building a personal connection and relationship with a student.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAbove all, I care about using business thinking to create fairer and more inclusive workplaces and I hope to build a career that advances social equity, empowers underrepresented communities, and transform organizations through purpose-driven strategy.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"XuONsd2tqzIOM19Hb00QNHBnr02zDeCYSv9BfBUNRRsiQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eThis isn't about an award or accolade but something I'm deeply proud of myself for is learning how to overcome my social anxiety. After the pandemic and coming back to school, being around so many people again suddenly made me anxious and overwhelmed. I avoided opportunities to hang out with people or speaking up in group settings because I feared being judged. The turning point really came when I realized that my anxiety was limiting the impact I wanted to make in the world. Consequently, I started taking small but intentional steps from volunteering to speak during meetings and putting myself in uncomfortable situations to make myself become more adaptable. Over time, I built confidence by applying myself consistently even when it felt hard. I found myself not only becoming more comfortable engaging with others but being able to form more meaningful relationships. I'm proud of my growth because of the fact that I was able to push myself every day beyond my comfort zone. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a47220fa-c103-4326-9b5b-149464588a78\"}"},{"__ref":"Favorites:{\"uuid\":\"4e87efde-7a0a-4512-88ec-88a260fc042f\"}"},{"__ref":"Favorites:{\"uuid\":\"4859d59d-bcc0-41d6-a372-b5051fdc3ac5\"}"}],"causesSupported":[],"major":"Industrial Labor Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"19e43538-880a-498e-90d4-49d15d862263\"}"},{"__ref":"DeepDives:{\"uuid\":\"a52673e8-3654-4dc5-a34c-d8e311e84ccd\"}"},{"__ref":"DeepDives:{\"uuid\":\"844b9326-d963-48ce-9f7a-ff813ec7b14f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b126273c-52ae-4dd0-bf2c-81584a677041/-/preview/-/format/jpg/","https://ucarecdn.com/987e353d-a383-4838-a67a-cdfd9967a63b/-/preview/-/format/jpg/","https://ucarecdn.com/ff2df505-9dc4-4138-bdb8-c79801c6774e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"adc7f3ae-e447-40ad-b8a0-4bee7ea3acd0\"}"},{"__ref":"Education:{\"uuid\":\"0df8f52c-99f3-4dc0-ad98-9f8b9c92f69b\"}"}],"hiredAt":"2025-12-02T17:43:25.774Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Statistics","Chemistry","6-8 Grade Science","Writing","Academic Coaching","College Essay Writing","Economics","Reading"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"chris-huang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4a7d6fe8-863b-4fb3-9425-6d914f7245d3\"}"}}},"_sentryTraceData":"7a370d003a52441f98cf760bd9f21b9c-a57bef8b2aa162a5-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500d
