my state government, solving food insecurity issues, developing my creative writing skills, understanding more about history impacting the present day, and finding real-world business opportunities!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8b6043a1-03ae-4026-b3fe-6ba76a7ee3ef\"}":{"__typename":"DeepDives","uuid":"8b6043a1-03ae-4026-b3fe-6ba76a7ee3ef","content":"\u003cp\u003eI chose my major because it's a combination of subjects I am passionate about - combining the history that I believe is shaping modern day politics, economics that drives my understanding of business, and creative writing that expresses my ability to communicate effectively!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6095a431-652a-4f89-b05c-d5bd5bbc5e10\"}":{"__typename":"DeepDives","uuid":"6095a431-652a-4f89-b05c-d5bd5bbc5e10","content":"\u003cp\u003eI spent my summers working at a bank, building my own businesses, working in history research at a local museum, and writing essays/stories!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"78b6b8a0-ccc6-4eba-9faf-d73e544af03a\"}":{"__typename":"School","uuid":"78b6b8a0-ccc6-4eba-9faf-d73e544af03a","name":"Northwest High School","city":"Grand Island","type":"HIGH","state":"Nebraska","country":"United States","zip":"68803"},"Education:{\"uuid\":\"32225393-bd27-4cf7-a9df-edfd3340eb3f\"}":{"__typename":"Education","uuid":"32225393-bd27-4cf7-a9df-edfd3340eb3f","school":{"__ref":"School:{\"uuid\":\"78b6b8a0-ccc6-4eba-9faf-d73e544af03a\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"231ca137-026d-498f-97f8-d935af3d8f49\"}":{"__typename":"Education","uuid":"231ca137-026d-498f-97f8-d935af3d8f49","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"History, Economics, Creative Writing","degree":null},"MentorPublicProfile:{\"uuid\":\"078f26a7-e17d-488b-a950-e44b2ea2d357\"}":{"__typename":"MentorPublicProfile","uuid":"078f26a7-e17d-488b-a950-e44b2ea2d357","displayName":"Emelia R.","slug":"emelia-richling","biography":"\u003cp\u003eMy name is Emelia Richling, and I am a junior at Stanford University who is passionate about spreading education accessibility. At college, I balance my time between serving as Head of Education for Stanford Women in Finance, VP of Marketing for Stanford Women in Business, assistant editor for Stanford's literary magazine, writing short stories/novels, and talking to younger students from my high school/my siblings as they navigate their experiences because it's so important for me to give back to my amazing community! I also work in the Stanford Art Library as an archival and data assistant, conduct economics and history research, and currently work as an investment banking analyst in Tech M\u0026amp;A. I will work in investment banking this summer in New York City as well.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I explored my passions as a Borlaug scholar where I studied food insecurity and how it related to healthcare/economic issues as well as working with state governors and senators to promote legislation and write amendments for bills on food insecurity, mental health, and increasing access to language education. I also wrote over 100+ published articles and won several state and national writing awards (more than happy to help you write college essays!). I also worked at a bank, founded a tutoring business, played piano, and helped conduct research at a local history museum. I won second in the nation for my project of building a business and analyzing its risks, financial statements, marketing plan, etc...\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love playing tennis, reading books, going on hikes, and spending time finding new coffee shops.\u003c/p\u003e","teachingVideoPlaybackId":"102VhWcLk56LfmEnpzkw9YzL2xvh801BbOeaTMc2ue9g00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWinning an international research award!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"636536a0-822d-4d49-be32-d4a7adcdf6b0\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"33c74e60-d261-4486-b53f-94a887627639\"}"}],"major":"History, Economics, Creative Writing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4498c013-9aaa-4fb6-9026-cd876c7e3c52\"}"},{"__ref":"DeepDives:{\"uuid\":\"acdda522-f6d7-4200-a097-b1304dfe538a\"}"},{"__ref":"DeepDives:{\"uuid\":\"8b6043a1-03ae-4026-b3fe-6ba76a7ee3ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"6095a431-652a-4f89-b05c-d5bd5bbc5e10\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/00561232-7a4c-4f9f-8996-aa8bcbf4230e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"32225393-bd27-4cf7-a9df-edfd3340eb3f\"}"},{"__ref":"Education:{\"uuid\":\"231ca137-026d-498f-97f8-d935af3d8f49\"}"}],"hiredAt":"2024-05-11T20:01:54.910Z","topics":["Creative Writing","Fashion / Cosmetics","Hi
