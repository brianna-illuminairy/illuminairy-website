ar":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"2c81cf86-9700-4b7f-88e5-e1220a243f48\"}":{"__typename":"Education","uuid":"2c81cf86-9700-4b7f-88e5-e1220a243f48","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"e422fb1a-dbb3-458c-a879-0464436262bd\"}":{"__typename":"MentorPublicProfile","uuid":"e422fb1a-dbb3-458c-a879-0464436262bd","displayName":"Kavi G.","slug":"kavi-gasper","biography":"\u003cp\u003eI’m a sophomore at Harvard University, originally from Providence, RI. Over the years, I’ve worked in a variety of software, machine learning, and research roles—all while pursuing personal projects on the side. In high school, I was deeply involved in both athletics and the arts: I played squash and tennis competitively and was passionate about music and theater. Balancing these interests taught me how to manage a packed schedule without giving up the things I love.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my proudest accomplishments was writing, producing, and professionally recording three original songs while juggling three different theater jobs. Experiences like this helped me develop one of my greatest strengths: staying creative and active even with a heavy course load.\u003c/p\u003e\u003cp\u003eI chose to study computer science because of the limitless potential to build, explore, and imagine. Every course I take feels like an opportunity to level up my skills and bring more ambitious ideas to life. Lately, I’ve been diving into AI-powered social media analysis, using machine learning to explore political bias in online trends—something I never would have imagined doing before college.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough it all, I’ve learned that the barrier to creating something meaningful in computer science is surprisingly low when you have a little guidance. That’s a big part of why I’m excited to mentor others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of CS, I’m still all about theater and music. I’ve worked both onstage and backstage in professional, regional, and academic productions. I’m also a jazz pianist and self-taught guitarist. If I’m not coding or studying, I’m usually writing a new song or practicing scales on the piano.\u003c/p\u003e","teachingVideoPlaybackId":"025ucoeOSNk00dPYRl5kxkcA8rl1LhUM01Y9B6zxSc7bZ00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"2a392563-36be-45c4-b6bb-c20abb6c33b0\"}"},{"__ref":"Favorites:{\"uuid\":\"579a225e-9df8-410c-a23d-21dc168f2f84\"}"},{"__ref":"Favorites:{\"uuid\":\"ca16b2b1-41df-429e-9cc3-5a25f50e7afd\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7e79eaa7-fcd0-431a-a257-d8bc1c815ca0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/48970089-8e67-4bdf-bb6a-c5ee50ef5bee/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8a2efdd2-a79a-4550-9a36-748bb9bd2d69\"}"},{"__ref":"Education:{\"uuid\":\"2c81cf86-9700-4b7f-88e5-e1220a243f48\"}"}],"hiredAt":"2025-04-01T18:42:33.611Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Writing","Academic Coaching","College Essay Writing","Computer Science","Executive Function","Creative Writing","Film / Theater","Music","Business / Entrepreneurship","Coding / Programming","Game Design","Machine Learning / AI","Web Design"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfile
