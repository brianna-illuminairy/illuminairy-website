xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"367a1812-d9ae-41de-9186-7814c9b34e4a\"}":{"__typename":"Favorites","uuid":"367a1812-d9ae-41de-9186-7814c9b34e4a","photoUrl":"https://ucarecdn.com/a6aa2c98-d03a-4cec-b774-796035de7fb3/","title":"Rowing","type":"SPORT"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"48f04b7a-fa9a-4437-9138-677ab63aa10b\"}":{"__typename":"DeepDives","uuid":"48f04b7a-fa9a-4437-9138-677ab63aa10b","content":"\u003cp\u003eMy interest in Latin America came from my family being from Venezuela and the time I spent there as a kid. The situation in Venezuela and the ensuing migration crisis encouraged me to look at policy through a human lens and further understand migration patterns, policy, and on-the-ground realities of forced displacement.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"af79b141-ca1a-4eda-9b04-0e6606276f31\"}":{"__typename":"DeepDives","uuid":"af79b141-ca1a-4eda-9b04-0e6606276f31","content":"\u003cp\u003eI volunteered at my church and led human rights summer institutes. I also worked at my local library!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"6594f9b7-94d5-43b9-9c02-86874da095fa\"}":{"__typename":"DeepDives","uuid":"6594f9b7-94d5-43b9-9c02-86874da095fa","content":"\u003cp\u003eI helped a student develop a bilingual (English and Spanish) website to help NYC Latin American immigrants learn more about resources available to them, particularly access to education.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4d72b1f3-6543-4f14-9a19-21a2a112a91e\"}":{"__typename":"DeepDives","uuid":"4d72b1f3-6543-4f14-9a19-21a2a112a91e","content":"\u003cp\u003eI love to sing, bake, visit new coffee shops and museums, and travel!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"df908fcb-1f22-48c5-ab0a-e2add7632966\"}":{"__typename":"School","uuid":"df908fcb-1f22-48c5-ab0a-e2add7632966","name":"Minnetonka High School","city":"Minnetonka","type":"HIGH","state":"Minnesota","country":"United States","zip":"55345"},"Education:{\"uuid\":\"84b59455-811a-4f83-9bfd-3b2ef22a47e6\"}":{"__typename":"Education","uuid":"84b59455-811a-4f83-9bfd-3b2ef22a47e6","school":{"__ref":"School:{\"uuid\":\"df908fcb-1f22-48c5-ab0a-e2add7632966\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"0563628a-a02f-4864-9f17-5fd2e33b74e7\"}":{"__typename":"Education","uuid":"0563628a-a02f-4864-9f17-5fd2e33b74e7","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Political Science; Latin American \u0026 Caribbean Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"bff6afe0-f4fe-47b2-9633-7c2265061674\"}":{"__typename":"MentorPublicProfile","uuid":"bff6afe0-f4fe-47b2-9633-7c2265061674","displayName":"Astrid L.","slug":"astrid-liden","biography":"\u003cp\u003eHi! I'm Astrid, and I am a Rhodes Scholar and current Master of Public Policy student at the University of Oxford, where I specialize in forced migration policy. Last year, I completed an MSc in Refugee \u0026amp; Forced Migration Studies. I currently work with the United Nations High Commissioner for Refugees (UNHCR) in Colombia, bringing practical field experience to my academic pursuits and deepening my understanding of migration challenges in Latin America.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI graduated Phi Beta Kappa from Columbia University, where I double majored in Political Science and Latin American and Caribbean Studies. My academic journey began in Minnesota, where I grew up and attended Minnetonka High School, completing the rigorous International Baccalaureate program that prepared me well for university-level studies.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout high school and college, I maintained active involvement in diverse extracurricular activities that shaped my leadership skills and global perspective. I participated extensively in Model United Nations, which sparked my interest in international affairs and diplomacy. My passion for music led me to join choral groups and eventually serve as director of my college a cappella group, developing valuable leadership and organizational abilities. I also worked as a campus tour guide and engaged in non-profit college advising, experiences that ignited my enthusiasm for helping students navigate their educational journeys.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy research experience includes conducting fieldwork in Santiago, Chile for my honors thesis, which provided me with firsthand insight into Latin American political and social dynamics. I have held various internships with NGOs focusing on refugee resettlement, migration policy implementation, and local community migrant engagement, building a comprehensive understanding of migration issues from multiple perspectives.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWorking with Columbia's Institute of Latin American Studies further enriched my regional expertise and research capabilities. These experiences, combined with my current role at UNHCR, have given me deep insights into policy development, implementation challenges, and the human stories behind migration statistics.\u003c/p\u003e\u003cp\u003eMy academic and professional background encompasses politics, global affairs, human rights, migration studies, history, and policy analysis. As a native Spanish speaker who is also proficient in Portuguese, I bring valuable multilingual capabilities to my work and can offer instruction in Spanish language and culture.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am particularly passionate about helping students with college applications, scholarship searches, and academic mentoring. Having navigated the competitive scholarship landscape myself as a Rhodes Scholar, I understand the complexities of crafting compelling applications and can provide guidance on everything from personal statements to interview preparation. I also offer expertise in history, policy studies, and Spanish language instruction.\u003c/p\u003e\u003cp\u003eI'm excited to work with students across all these areas and help them reach their full potential, whether they're applying to college, seeking scholarships, or deepening their knowledge in specific academic subjects!\u003c/p\u003e","teachingVideoPlaybackId":"kmtMVjTosIRdbKdQWOTyQNX8DID02ACM2M00u00saK5ZMw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement was graduating from my first Masters at Oxford as Rhodes Scholar and being able to celebrate that milestone with my mom, who has been such an integral part of my entire academic journey :)\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"367a1812-d9ae-41de-9186-7814c9b34e4a\"}"}],"causesSupported":[],"major":"Political Science; Latin American \u0026 Caribbean Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"48f04b7a-fa9a-4437-9138-677ab63aa10b\"}"},{"__ref":"DeepDives:{\"uuid\":\"af79b141-ca1a-4eda-9b04-0e6606276f31\"}"},{"__ref":"DeepDives:{\"uuid\":\"6594f9b7-94d5-43b9-9c02-86874da095fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"4d72b1f3-6543-4f14-9a19-21a2a112a91e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1f68698b-886d-4208-b8dd-103ec48a433e/-/preview/-/format/jpg/","https://ucarecdn.com/8a017f0c-c1ec-44ec-8fbd-98c3fdd70f58/-/preview/-/format/jpg/","https://ucarecdn.com/0bc04170-8f09-4168-a696-0135ac28844c/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"84b59455-811a-4f83-9bfd-3b2ef22a47e6\"}"},{"__ref":"Education:{\"uuid\":\"0563628a-a02f-4864-9f17-5fd2e33b74e7\"}"}],"hiredAt":"2024-02-07T00:19:35.795Z","topics":[],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/9f7019f6-5b03-4f9f-a136-5aeaf2c62de6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"astrid-liden\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bff6afe0-f4fe-47b2-9633-7c2265061674\"}"}}},"_sentryTraceData":"788003a22b624ed49d1be41c3c1d1e89-84f9ff8625b8bfc3-1","_sentryBaggage":"sentry-environment=
