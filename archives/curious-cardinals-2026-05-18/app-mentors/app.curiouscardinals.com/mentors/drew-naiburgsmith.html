xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8212e8f8-d38f-4f91-aee0-d247c7c34457\"}":{"__typename":"DeepDives","uuid":"8212e8f8-d38f-4f91-aee0-d247c7c34457","content":"\u003cp\u003eDo what you love and call it work!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"e89bda01-147c-435d-8415-df579f385c0e\"}":{"__typename":"DeepDives","uuid":"e89bda01-147c-435d-8415-df579f385c0e","content":"\u003cp\u003eDevoting yourself to a creative endeavor is both brave and challenging. It is also the most rewarding. Growing up, I always wished I had a mentor in a creative field to show me that my dreams are not just dreams—but practically achievable. I hope to be that guiding and supportive resource for my mentees. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9b405e6d-2dd0-4890-9e18-009914ef0b69\"}":{"__typename":"DeepDives","uuid":"9b405e6d-2dd0-4890-9e18-009914ef0b69","content":"\u003cp\u003eI just finished writing a vertical mini-series, and I plan to shoot and star in it in the new year!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"819396ea-edf6-4960-a154-9493ceee5daa\"}":{"__typename":"DeepDives","uuid":"819396ea-edf6-4960-a154-9493ceee5daa","content":"\u003cp\u003eOne of my professors at Penn has been the best mentor I could imagine. I took an intro film course with her my freshman year, and it totally changed my life. From that point on, I made sure to take a course with her every semester—even TAing my junior and senior years. Some of my fondest memories are sitting on her couch discussing film, life, poetry, and the changing tides of the industry. Even now, after graduation, I send her everything I write! She is an invaluable resource, as we call to discuss feedback—balancing celebrating achievements while always striving to be better! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"c641b950-e48e-4651-bab8-73e47c67759d\"}":{"__typename":"School","uuid":"c641b950-e48e-4651-bab8-73e47c67759d","name":"Jericho High School","city":"Jericho","type":"HIGH","state":"New York","country":"United States","zip":"11753"},"Education:{\"uuid\":\"5ed71ef5-0486-4e55-8972-38a62a87d2f9\"}":{"__typename":"Education","uuid":"5ed71ef5-0486-4e55-8972-38a62a87d2f9","school":{"__ref":"School:{\"uuid\":\"c641b950-e48e-4651-bab8-73e47c67759d\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"ade46a67-a844-4802-89da-c95d52bc225d\"}":{"__typename":"Education","uuid":"ade46a67-a844-4802-89da-c95d52bc225d","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Cinema and Media Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"be684c6b-3a1a-4ae4-bf79-47b94b56b266\"}":{"__typename":"MentorPublicProfile","uuid":"be684c6b-3a1a-4ae4-bf79-47b94b56b266","displayName":"Drew N.","slug":"drew-naiburgsmith","biography":"\u003cp\u003eHi! I’m Drew — a writer, director, producer, and creative mentor who is passionate about comedy, storytelling, and helping students turn ideas into finished projects they are proud to share. I love working with curious, driven students and supporting them at every stage of the creative process, from early brainstorming to final polish.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated from the University of Pennsylvania with a degree in Cinema \u0026amp; Media Studies and served as Director and Head Writer of Bloomers, Penn’s musical sketch comedy troupe. In that role, I led teams of writers and performers, developed original material, and helped shape projects from the page to live performance. Since graduating, I have written and produced short films, pilots, sketches, and essays, with work that has screened and won awards at international festivals. My short film Wait received Best Script, Best Woman Filmmaker, and Best Short Film, and I am currently circulating my newest short film on the festival circuit.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI mentor middle school, high school, an  college students who are passionate about film and television, screenwriting, sketch comedy, creative writing, and independent passion projects of all kinds. I am especially excited to help students explore comedy and storytelling, while also building practical skills like structure, planning, revision, and follow-through. I enjoy helping students shape big ideas into realistic, achievable projects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy mentorship style is collaborative, supportive, and hands-on. Sessions may include brainstorming and outlining ideas, workshopping scripts or writing, developing project plans, or practicing pitching and presentation skills. Along the way, I help students develop transferable skills such as time management, creative confidence, critical thinking, and creative leadership.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am based in Los Angeles, where I write scripts, pitch film and television projects, perform improv and sketch comedy, and continue creating and filming new work. Outside of mentoring, I enjoy long runs, comedy shows with friends, and watching lots of television—for research, of course.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost importantly, I love working with students who are excited to create something original, and my goal is always for students to leave sessions feeling confident, motivated, and proud of what they are building. I can’t wait to meet you! Let’s do this!\u003c/p\u003e","teachingVideoPlaybackId":"zr7QDfMLMlWMx94XoRuSqxmk01NZNQwAL49xw4ijT02Zg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Cinema and Media Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8212e8f8-d38f-4f91-aee0-d247c7c34457\"}"},{"__ref":"DeepDives:{\"uuid\":\"e89bda01-147c-435d-8415-df579f385c0e\"}"},{"__ref":"DeepDives:{\"uuid\":\"9b405e6d-2dd0-4890-9e18-009914ef0b69\"}"},{"__ref":"DeepDives:{\"uuid\":\"819396ea-edf6-4960-a154-9493ceee5daa\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c57fd430-f28d-4d2c-8cbc-5ca272218893/-/preview/-/format/jpg/","https://ucarecdn.com/ee28ef01-9e81-49d4-9c84-2e43b70acdf8/-/preview/-/format/jpg/","https://ucarecdn.com/8fba960a-3152-44d7-8e4e-a65ad7d15b00/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5ed71ef5-0486-4e55-8972-38a62a87d2f9\"}"},{"__ref":"Education:{\"uuid\":\"ade46a67-a844-4802-89da-c95d52bc225d\"}"}],"hiredAt":"2025-12-02T17:51:43.206Z","topics":["Writing","College Essay Writing","Academic Coaching","Reading","Creative Writing","Film / Theater","Public Speaking"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"drew-naiburgsmith\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"be684c6b-3a1a-4ae4-bf79-47b94b56b266\"}"}}},"_sentryTraceData":"69b9fa68959b442795f9f5b0ff2a5e21-9345357581803150-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=69b9fa68959b442795f9f5b0ff2a5e21,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"drew-naiburgsmith"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
