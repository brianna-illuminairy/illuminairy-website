xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"28fefe3f-74f5-4ff0-9615-88bbd2f082ed\"}":{"__typename":"Favorites","uuid":"28fefe3f-74f5-4ff0-9615-88bbd2f082ed","photoUrl":"https://ucarecdn.com/867997fe-ab74-4617-b445-00033e06ac66/","title":"Is This It","type":"ALBUM"},"Favorites:{\"uuid\":\"3bec6efb-ee3f-44fe-9f89-4f4e302ec917\"}":{"__typename":"Favorites","uuid":"3bec6efb-ee3f-44fe-9f89-4f4e302ec917","photoUrl":"https://ucarecdn.com/d0e18625-5766-4d7b-a2e5-be0243efce1a/","title":"The Overstory","type":"BOOK"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e745b93f-a658-4032-81c2-8f0ea7f15c9f\"}":{"__typename":"DeepDives","uuid":"e745b93f-a658-4032-81c2-8f0ea7f15c9f","content":"\u003cp\u003eI attended Johns Hopkins Center for Talented Youth (Saratoga Springs campus if anyone also has gone!!), a academic summer camp where I was able to take college-level classes such as Philosophy of Mind and Cognitive Psychology. I credit CTY with re-igniting my passion for learning at a time where I was feeling burnt out and uninspired by the curriculum at my public high school (and actually inspired me to transfer schools to Phillips Academy!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"dd3e0745-581a-4579-85c8-bd2dfc8e73b1\"}":{"__typename":"DeepDives","uuid":"dd3e0745-581a-4579-85c8-bd2dfc8e73b1","content":"\u003cp\u003eMy parents are both Russian immigrants, and I am first-generation in the US. I grew up with a lot of emphasis being placed on my academic achievements, which definitely led to me feeling a lot of  anxiety in middle and high school. I remember being far too hard on myself when I didn't achieve certain external metrics. When I was in college, I learned that I need to set intrinsic goals for myself and my learning, and not rely on my grades and my professor's learning goals. This frameshift was \u003cem\u003ehuge\u003c/em\u003e for both my happiness and my academic performance! I would encourage any of my mentees to look inwards and foster their own learning goals and metrics on a subject.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"62c4f2b4-f26b-40f7-8613-d74e091d49cd\"}":{"__typename":"DeepDives","uuid":"62c4f2b4-f26b-40f7-8613-d74e091d49cd","content":"\u003cp\u003eI am incredibly proud of myself for moving to a foreign country! Starting my Fulbright year after graduating Dartmouth was an incredibly challenging experience. Leaving an environment and a community where I had felt safety and belonging to move halfway across the globe was a big risk, but one that ultimately paid off. One year later, I can gladly say that I am more resilient, well-travelled, and compassionate. I have gotten to know both myself and the world around me better, which is an incredible takeaway to have had. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7c33f192-1882-4b3e-a59e-cfb51036c7e1\"}":{"__typename":"DeepDives","uuid":"7c33f192-1882-4b3e-a59e-cfb51036c7e1","content":"\u003cp\u003eGrowing up, I attended an all-girls summer camp in New Hampshire. Having near-peer mentors who were invested in my wellbeing and growth had a huge impact on my personal development. Being on the other side of the equation ( as a camp counselor, freshman orientation trips leader, undergraduate residential advisor, or any of the other leadership roles I've had) is an equally rewarding experience. I love making profound connections with people, learning about what makes them tick, and helping them solve problems. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"98257c72-57ec-4e19-bca8-fb555ec7d23b\"}":{"__typename":"School","uuid":"98257c72-57ec-4e19-bca8-fb555ec7d23b","name":"Phillips Academy — Andover","city":"Andover","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01810"},"Education:{\"uuid\":\"847b4b0d-ebf7-44e3-a8ef-e00559268ee5\"}":{"__typename":"Education","uuid":"847b4b0d-ebf7-44e3-a8ef-e00559268ee5","school":{"__ref":"School:{\"uuid\":\"98257c72-57ec-4e19-bca8-fb555ec7d23b\"}"},"startYear":"2016","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"b39309e8-5e42-4ff6-a194-f5be522a5b57\"}":{"__typename":"Education","uuid":"b39309e8-5e42-4ff6-a194-f5be522a5b57","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Biology, Art History","degree":null},"MentorPublicProfile:{\"uuid\":\"dbdad320-3c35-4e2e-985f-00c82cee7428\"}":{"__typename":"MentorPublicProfile","uuid":"dbdad320-3c35-4e2e-985f-00c82cee7428","displayName":"Leeza P.","slug":"leeza-petrov","biography":"\u003cp\u003eHello! I’m Leeza Petrov, a multidisciplinary thinker, lifelong learner, and passionate educator.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eBorn and raised outside of Boston, MA, I graduated from Dartmouth College in the spring of 2023 with a degree in Biology and Art History. My curiosity lies at the intersection of art and science, and I’m passionate about how we can learn from both disciplines to think more creatively, deeply, and analytically. I’ve applied these skills across various research projects, from exploring patient experiences in high-stress care settings at Dartmouth’s public health think tank, to receiving a Rauner Historical Accountability Fellowship wherein I studied Dartmouth’s history of sexual education and queer acceptance during the AIDS crisis.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eThroughout my academic journey, I’ve been fortunate to learn from remarkable educators whose impact on their students and communities deeply inspired me. My enthusiasm for teaching took root during my time as a peer tutor and learning fellow for Russian and Sociology courses and solidified during a museum education internship at the Montshire Museum of Science. After my graduation from Dartmouth, I was honored to receive a Fulbright English Teaching Assistantship grant, which afforded me the opportunity to further explore my interest in education and cultural engagement in Belgium.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am currently pursuing a Master of Arts in Arts and Heritage: Management, Policy, and Education at Maastricht University in the Netherlands. This program allows me to deepen my teaching skills while exploring the cultural sector, with the goal of eventually working in public programming or community engagement within a museum.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eOutside of the classroom, I’m an avid hiker, rock climber, and runner. If I’m not spending time outside, you can often find me gallery hopping, thrift shopping, or solving the New York Times Crossword. I love to travel (and since moving to Western Europe, I’ve certainly been taking advantage of cheap RyanAir flights) and practice some of the languages other than English that I speak—Russian, French, and now a bit of Dutch. I also ran a radio show in undergrad and I love podcasts and podcasting!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs a mentor, I will draw on my diverse background and practical teaching experience to craft engaging, practical, and interdisciplinary lessons. I’m sensitive to different learning styles and understand the needs of students with learning disabilities, having navigated my own experience with ADHD during my undergraduate years. The core tenet of my pedagogical philosophy is to include hands-on work. I believe that a learning experience is always more meaningful when it is participatory. Growing up, I was drawn to science because of the project-based, interactive nature of the curriculum, but I’ve learned over the years that there are creative ways to bring active and practical learning into even the most theoretical subjects.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI look forward to hearing from you!\u003c/p\u003e","teachingVideoPlaybackId":"CEtfBFuE7rJz7Nfi51W668gPWNSHedEZsE1DurnVjrU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"28fefe3f-74f5-4ff0-9615-88bbd2f082ed\"}"},{"__ref":"Favorites:{\"uuid\":\"3bec6efb-ee3f-44fe-9f89-4f4e302ec917\"}"}],"causesSupported":[],"major":"Biology, Art History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e745b93f-a658-4032-81c2-8f0ea7f15c9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"dd3e0745-581a-4579-85c8-bd2dfc8e73b1\"}"},{"__ref":"DeepDives:{\"uuid\":\"62c4f2b4-f26b-40f7-8613-d74e091d49cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"7c33f192-1882-4b3e-a59e-cfb51036c7e1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/00fd238f-7dc1-4d8c-bfba-1d9393c09657/-/preview/-/format/jpg/","https://ucarecdn.com/16a247fc-8859-4903-b6fb-da46714b8e1d/-/preview/-/format/jpg/","https://ucarecdn.com/2f83d251-dc9c-4768-973a-8e1161027715/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"847b4b0d-ebf7-44e3-a8ef-e00559268ee5\"}"},{"__ref":"Education:{\"uuid\":\"b39309e8-5e42-4ff6-a194-f5be522a5b57\"}"}],"hiredAt":"2024-09-12T00:28:49.024Z","topics":["K-5 Grade Math","6-8 Grade Science","Chemistry","Biology","Writing","French","Academic Coaching","Executive Function","College Essay Writing","Reading","K-6 Storybook","Creative Writing","History Project","Medicine / Health","STEM Project","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/ceacbeeb-af28-4003-96cf-d977276b04ef/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"leeza-petrov\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"dbdad320-3c35-4e2e-985f-00c82cee7428\"}"}}},"_sentryTraceData":"b2dcdcd91c8b4eb380dfb6fb554dc85c-97465fba5bec59f4-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b2dcdcd91c8b4eb380dfb6fb554dc85c,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"leeza-petrov"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manag
