xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2519cab1-734a-4d68-b410-7dfc9679dcf8\"}":{"__typename":"DeepDives","uuid":"2519cab1-734a-4d68-b410-7dfc9679dcf8","content":"\u003cp\u003eIf I could give my middle or high school self some advice, I’d say to follow what interests you. If something catches your attention, like why the sky changes color or how birds can fly, take the time to explore it. Don’t be afraid to ask questions or learn more outside of class. You don’t need to have everything figured out right away. What matters most is that you keep learning and growing. Being curious and open to new ideas will help you discover what you really enjoy and where you want to go.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"8aaf79aa-30f8-4610-8581-2bf27edaf3f2\"}":{"__typename":"DeepDives","uuid":"8aaf79aa-30f8-4610-8581-2bf27edaf3f2","content":"\u003cp\u003eIn high school, I spent my summers taking on projects that pushed me to learn more and apply what I was passionate about. The first summer, I thought CAD software was interesting, so I learned it through videos online, and the following year placed 9th nationally in a CAD competition. I then used that CAD experience to conduct a research study the following summer, leading to an academic publication in a peer-reviewed international journal. That experience gave me the confidence to reach out to engineering professors at a local university, where I interned in a lab working with composite materials the following summer. I continued to intern there for the remainder of my high school summers, providing me early exposure to the world of academic research, which definitely helped prepare me for the more advanced work I now do in college. These experiences taught me the value of seeking out opportunities, asking good questions, and learning by doing. I also made time to stay active and balanced by playing tennis, going to the gym, and spending time playing videogames with friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"adcfdc30-8c24-425e-a95d-a52d28a48b0c\"}":{"__typename":"DeepDives","uuid":"adcfdc30-8c24-425e-a95d-a52d28a48b0c","content":"\u003cp\u003eI chose Mechanical Engineering because I’ve always loved learning how things work. Growing up, I was the kind of person who took things apart just to see what was inside. Over time, that turned into a strong interest in physics, math, and building things. Mechanical Engineering brings all of that together. I like that it helps me understand real-world systems and gives me the tools to design and improve them. It’s a major that constantly challenges me and lets me keep learning in hands-on ways.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"a6fc266f-014d-4dca-aa96-b6d35c175667\"}":{"__typename":"DeepDives","uuid":"a6fc266f-014d-4dca-aa96-b6d35c175667","content":"\u003cp\u003eWhen I was younger, I was lucky to have several people in my life who gave me advice, encouragement, and mentorship. Their support made a big difference in how I approached challenges, pursued opportunities, and built confidence in myself. Looking back, I know I wouldn’t be where I am today without them. That’s a big part of why I choose to mentor now. I want to be that same source of guidance for the next generation and help students feel supported as they learn and grow. It’s incredibly rewarding to help someone understand something new, discover what they enjoy, or feel proud of their progress. I love sharing what I’ve learned from my experiences with others so that they can also learn from them as well.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"b50b8c34-b8ac-437f-9034-504699e94ff2\"}":{"__typename":"School","uuid":"b50b8c34-b8ac-437f-9034-504699e94ff2","name":"Newark Charter High School","city":"Newark","type":"HIGH","state":"Delaware","country":"United States","zip":"19711"},"Education:{\"uuid\":\"07a759a3-d0fc-4e30-b53a-529b9b76d739\"}":{"__typename":"Education","uuid":"07a759a3-d0fc-4e30-b53a-529b9b76d739","school":{"__ref":"School:{\"uuid\":\"b50b8c34-b8ac-437f-9034-504699e94ff2\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"ea7d07df-f11d-4371-bf10-08e1d2cc0b94\"}":{"__typename":"Education","uuid":"ea7d07df-f11d-4371-bf10-08e1d2cc0b94","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"aea2677f-644a-4d7e-8e6c-c9443a480208\"}":{"__typename":"MentorPublicProfile","uuid":"aea2677f-644a-4d7e-8e6c-c9443a480208","displayName":"Alexander B.","slug":"alexander-barry","biography":"\u003cp\u003eHi! I’m Alexander Barry, but you can call me Alex. I'm currently a Mechanical Engineering student at Cornell University with a strong passion for science, especially physics and math. I’ve always loved asking questions and figuring out how things work. That curiosity is what led me to study engineering, and it’s also what inspires me to help younger students explore their own interests and build confidence in the learning process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, I get to apply what I learn in real, hands-on ways. I’m part of a team that builds drones from scratch, which has taught me a lot about problem solving, teamwork, and creativity. I also work in a research lab where we study aerodynamics and how objects move through the air. These experiences have helped me connect classroom learning to real-world challenges, and I enjoy helping others see how exciting and useful that can be.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I care a lot about personal growth. I spend a lot of my free time at the gym, playing tennis with friends, cooking meals, or trying out new things that challenge me. I also enjoy playing competitive video games from time to time, which helps me stay sharp and think strategically. I try to live a balanced life and stay curious in everything I do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I’m patient, encouraging, and focused on building confidence. I understand that learning something new can feel challenging, especially in subjects like math and science. But I also know how rewarding it is when things finally make sense. I want to help students feel proud of their progress and comfortable asking questions along the way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d love to be a part of your child's learning journey. I’m here to support, guide, and grow alongside them.\u003c/p\u003e","teachingVideoPlaybackId":"5kTcY5cwhrcncFjdL8902lrc2xcEuQ4TdsYnqy2LOPJ4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2519cab1-734a-4d68-b410-7dfc9679dcf8\"}"},{"__ref":"DeepDives:{\"uuid\":\"8aaf79aa-30f8-4610-8581-2bf27edaf3f2\"}"},{"__ref":"DeepDives:{\"uuid\":\"adcfdc30-8c24-425e-a95d-a52d28a48b0c\"}"},{"__ref":"DeepDives:{\"uuid\":\"a6fc266f-014d-4dca-aa96-b6d35c175667\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3b0ff867-c1ea-4314-b6f1-3c6c12e6852f/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"07a759a3-d0fc-4e30-b53a-529b9b76d739\"}"},{"__ref":"Education:{\"uuid\":\"ea7d07df-f11d-4371-bf10-08e1d2cc0b94\"}"}],"hiredAt":"2025-05-06T13:18:36.686Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","Physics","Computer Science"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexander-barry\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"aea2677f-644a-4d7e-8e6c-c9443a480208\"}"}}},"_sentryTraceData":"e8499a1494db42b2ba5f20f387a98187-95559c300347cd50-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e8499a1494db42b2ba5f20f387a98187,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/me
