xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7f10e292-a6f9-472f-b97c-7bd6c0448828\"}":{"__typename":"DeepDives","uuid":"7f10e292-a6f9-472f-b97c-7bd6c0448828","content":"\u003cp\u003eArt! I love to play the guitar, sketch up new airplane designs, and take photos!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"37aa615b-850c-4557-a661-687b9802a1b2\"}":{"__typename":"DeepDives","uuid":"37aa615b-850c-4557-a661-687b9802a1b2","content":"\u003cp\u003eKeep doing the things you love, take big and uncomfortable risks, and be silly! Everything else will fall into place eventually! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"785b2cf0-4e14-4af2-8546-676d0a8366f8\"}":{"__typename":"DeepDives","uuid":"785b2cf0-4e14-4af2-8546-676d0a8366f8","content":"\u003cp\u003eCo-founder and CEO of an aerospace startup that makes trans-atlantic flights as cheap as a meal, and cross-continental journeys quicker than your commute!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f4255a74-6fb7-4809-afb1-849b5e7ada27\"}":{"__typename":"DeepDives","uuid":"f4255a74-6fb7-4809-afb1-849b5e7ada27","content":"\u003cp\u003eI am currently working with some of my brilliant buddies at Stanford to create a solar-powered airplane that flies autonomously for days on end! You guessed it, we're aiming for a world record ;)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"d94ae872-181c-4f17-bd6d-13d21533125b\"}":{"__typename":"School","uuid":"d94ae872-181c-4f17-bd6d-13d21533125b","name":"Sage Hill School","city":"Newport Beach","type":"HIGH","state":"California","country":"United States","zip":"92657"},"Education:{\"uuid\":\"397b2c86-c09a-48bd-a996-69b8a513e6c5\"}":{"__typename":"Education","uuid":"397b2c86-c09a-48bd-a996-69b8a513e6c5","school":{"__ref":"School:{\"uuid\":\"d94ae872-181c-4f17-bd6d-13d21533125b\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"b182bcc7-6b10-462b-8b88-b69bcd5af759\"}":{"__typename":"Education","uuid":"b182bcc7-6b10-462b-8b88-b69bcd5af759","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Aeronautics and Astronautics","degree":null},"Testimonial:9d2d250e-fa87-4b39-96f0-6b8bb94d48f8":{"__typename":"Testimonial","id":"9d2d250e-fa87-4b39-96f0-6b8bb94d48f8","text":"Working with Adam has been one of the most inspiring and impactful experiences of my life. His deep knowledge, patience, and passion for rocketry helped me go from a curious beginner to a certified rocketeer. Adam guided me through every step of the process — from understanding the science behind rockets to actually building and launching them. His mentorship didn’t just prepare me for certification; it sparked the creation of my very own rocket team. Adam believed in me from day one, and his support has truly launched both my skills and my confidence to new heights. I’m incredibly grateful for everything he’s taught me.","date":"2025-06-01 04:46:13.899+00","rating":5,"endorser":{"__typename":"Endorser","name":"Arav Arora","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"ca5c99dd-83ee-49d4-af79-2192fa8703fe\"}":{"__typename":"MentorPublicProfile","uuid":"ca5c99dd-83ee-49d4-af79-2192fa8703fe","displayName":"Adam Y.","slug":"adam-yang","biography":"\u003cp\u003eHey! I'm Adam, and I am a student at Stanford University studying aeronautics and astronautics.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'd like to think I'm a simple guy: I \u003cem\u003elove\u003c/em\u003e anything that flies. Ask me about planes, drones, rockets, satellites and more and watch me go on and on for hours on end! At Stanford, my research interest focuses on making aviation wayyyy more affordable, and wayyyy faster (Think New York to London for less than 20 dollars, or China to Los Angeles in 1 hour!)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my studies, I am actively involved in campus aerospace engineering groups, like building a self-landing rocket (like SpaceX) with the Student Space Initiative, or making a solar airplane to break a world record with the Stanford flight club.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy interests aren't confined to engineering alone; I'm equally excited about the intersection of engineering and business. In high school, I launched a venture-backed startup to make engineering education fun, accessible, and easy to understand, quickly attracting a following of over 36,000 people online within the first six months.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I like to design, build, and fly my own racing drones, take photos of beautiful scenery, and swim in the sun!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI make it my personal mission to teach all my mentees not only the technical skills to turn their ideas into reality, but also how to communicate it to the rest of the world for maximum social \u003cem\u003eimpact\u003c/em\u003e. By the end of our time, I want my mentees to have something tangible that they can confidently say: “I built this, and it's awesome!” So come along for the ride, and let's go make things happen!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Aeronautics and Astronautics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7f10e292-a6f9-472f-b97c-7bd6c0448828\"}"},{"__ref":"DeepDives:{\"uuid\":\"37aa615b-850c-4557-a661-687b9802a1b2\"}"},{"__ref":"DeepDives:{\"uuid\":\"785b2cf0-4e14-4af2-8546-676d0a8366f8\"}"},{"__ref":"DeepDives:{\"uuid\":\"f4255a74-6fb7-4809-afb1-849b5e7ada27\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9a792f05-02e1-46c0-8b7a-2249248b3319/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"397b2c86-c09a-48bd-a996-69b8a513e6c5\"}"},{"__ref":"Education:{\"uuid\":\"b182bcc7-6b10-462b-8b88-b69bcd5af759\"}"}],"hiredAt":"2024-04-04T23:19:33.519Z","topics":["Video / Photography","Visual Arts / Graphic Design","Business / Entrepreneurship","Robotics / Electronics / CAD","STEM Project","Aviation / Aerospace","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.
