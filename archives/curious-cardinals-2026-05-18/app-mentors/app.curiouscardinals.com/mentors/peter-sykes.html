xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2a4ecb25-51ee-49d0-9d9c-1b9732701f95\"}":{"__typename":"DeepDives","uuid":"2a4ecb25-51ee-49d0-9d9c-1b9732701f95","content":"\u003cp\u003eDuring my summers in high school, I spent my time training for the upcoming cross country season and participating in piano competitions. I loved going on long runs with my teammates, and our summer practices were where I made many of my closest friends. The extra time in the summer allowed me to practice more piano pieces and compete in various competitions. One international competition I participated in required me to learn a 45-minute set (memorized!). I placed second in this competition, and it was so rewarding to see all my hard work pay off.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"deb472be-2963-4ae3-9723-45a92a18780a\"}":{"__typename":"DeepDives","uuid":"deb472be-2963-4ae3-9723-45a92a18780a","content":"\u003cp\u003eNever be afraid to be yourself. When I was in high school, I let my fear of judgement direct the activities I participated in and the things I did and didn’t do. Looking back, I regret that I didn’t take advantage of the opportunities I had then just because I was scared of what other people would think of me. Life is too short to not do the things you love, so do them while you can no matter what other people say.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"cfa39d48-631f-42a9-975b-472735be0a32\"}":{"__typename":"DeepDives","uuid":"cfa39d48-631f-42a9-975b-472735be0a32","content":"\u003cp\u003eMy greatest role model is Dr. Jeff Douma, the director of the Yale Glee Club. The Glee Club is the largest undergraduate choir at Yale, and I have sung in it for the past four years. Jeff is our conductor and one of the best musicians I have ever met. He conducts the glee club with clarity and expression, and his insights during rehearsal reflect his musical knowledge. Jeff is also incredibly kind, and he leads the Glee Club with positivity and compassion. I aspire to be a musician and leader like him.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"311fc5a5-0e46-4111-ac07-c3ef19a2856b\"}":{"__typename":"DeepDives","uuid":"311fc5a5-0e46-4111-ac07-c3ef19a2856b","content":"\u003cp\u003eI chose to major in music because it is my lifelong passion. At Yale, I have learned about music theory, music history, and musical cultures from around the world, as well as grown as a musician myself. This has introduced me to new musical perspectives and ideas and given me a deeper appreciation for music. I also chose to major in computer science because I love math and logical thinking. Computer science allows me to apply this love for logic towards solving real world problems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"a59500a5-02d3-4c70-ac7b-7ead5e1c9a7a\"}":{"__typename":"School","uuid":"a59500a5-02d3-4c70-ac7b-7ead5e1c9a7a","name":"Harvard-Westlake School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"7ad0f50b-61f6-4cf3-acbc-3043e8712d80\"}":{"__typename":"Education","uuid":"7ad0f50b-61f6-4cf3-acbc-3043e8712d80","school":{"__ref":"School:{\"uuid\":\"a59500a5-02d3-4c70-ac7b-7ead5e1c9a7a\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"e2a0b007-6558-48ad-b095-fb9e563acd56\"}":{"__typename":"Education","uuid":"e2a0b007-6558-48ad-b095-fb9e563acd56","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2025","major":"Music and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"e2faf7a7-cdb7-4e1c-a64b-c803e3f2ef9e\"}":{"__typename":"MentorPublicProfile","uuid":"e2faf7a7-cdb7-4e1c-a64b-c803e3f2ef9e","displayName":"Peter S.","slug":"peter-sykes","biography":"\u003cp\u003eHello! My name is Peter Sykes, and I am double majoring in music and computer science at Yale University. I am originally from Los Angeles, CA and graduated from Harvard-Westlake School in 2019.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI have been passionate about music for as long as I can remember. I began playing piano when I was four years old and continued studying classical piano throughout high school and college. In high school, I began singing in choir and fell in love with group singing. I am currently the music director of the Yale Whiffenpoofs, the oldest collegiate a cappella group in the country. As music director, I lead rehearsals, oversee the recording of a full studio album, and conduct and sing with the group in over 200 performances around the world. I firmly believe in music’s ability to bring people closer together, and my musical experiences have helped connect me with my closest friends.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am also interested in math and computer science. Math has been my favorite subject for my entire life, and I love exploring the patterns behind numbers. I had never taken computer science before starting college, but enjoyed my introductory courses so much I added it as a second major. I am fascinated by the logic behind computers and finding creative solutions to problems.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eOutside of class, I enjoy doing yoga, reading, baking (banana bread and pumpkin bread are my favorites), and hiking. I am a leader for Yale’s First-Year Outdoor Orientation Trips and have led incoming Yale students on backpacking trips throughout the Northeast. In my profile photos above you can see the view from one of my favorite hikes, Mt. Monadnock in New Hampshire.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eAfter graduating, I hope to continue to work with students as a teacher. I love seeing that moment when all the pieces click and a student is excited about learning. As a mentor, I am committed to helping students pursue their passions and grow both as learners and as people.\u003c/p\u003e","teachingVideoPlaybackId":"7OZuu4ffdgdmjWlWOHx6gVmGscH16HA4JBqjA22FsYY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Music and Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2a4ecb25-51ee-49d0-9d9c-1b9732701f95\"}"},{"__ref":"DeepD
