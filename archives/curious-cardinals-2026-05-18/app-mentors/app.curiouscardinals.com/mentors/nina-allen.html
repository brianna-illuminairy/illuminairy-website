xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"0a47cad4-d2a6-4795-a90f-f6134e11ae67\"}":{"__typename":"DeepDives","uuid":"0a47cad4-d2a6-4795-a90f-f6134e11ae67","content":"\u003cp\u003eOut of all the things I could be doing, mentorship is what feels most meaningful. Believe me, I know how cliché this sounds, yet I also know how powerful it is to have someone believe in your ideas before they feel “ready” or “real.” Growing up, I had big visions but didn’t always have the language, tools, or confidence to bring them to life. It was the mentors in my life—teachers, coaches, and community leaders—who helped me see that I could build something impactful, even as a teenager.\u003c/p\u003e\u003cp\u003eMentorship allows me to pay that forward. I love helping students take ownership of their interests and turn them into projects, stories, or ventures they’re proud of, whether it’s figuring out how to structure a passion project, pitch an idea, or just work through self-doubt. \u003c/p\u003e\u003cp\u003eThis is especially true for students who come from underrepresented backgrounds, or who haven’t been told their interests matter, I want to be a mentor who listens, empowers, and pushes them to dream big—on their own terms.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ed884c05-ce2e-4398-84d8-89b828eaba3f\"}":{"__typename":"DeepDives","uuid":"ed884c05-ce2e-4398-84d8-89b828eaba3f","content":"\u003cp\u003eI chose to major in Political Science and Ethnicity, Race, and Migration because together, they give me the tools to better understand how power operates—who makes the rules, who’s affected by them, and how systems can be changed. These majors have taught me to ask deeper questions about the world: not just what’s happening, but \u003cem\u003ewhy\u003c/em\u003e it’s happening, who benefits, and what voices are missing from the conversation.\u003c/p\u003e\u003cp\u003ePolitical Science gives me a framework for analyzing institutions, laws, and global dynamics, while ER\u0026amp;M grounds that analysis in lived experience—race, identity, migration, and history. I’ve learned to see patterns, unpack narratives, and think critically about justice, representation, and belonging.\u003c/p\u003e\u003cp\u003eMore than anything, these majors have changed how I move through the world. They’ve made me more observant, more empathetic, and more confident in challenging the status quo. I chose them because I wanted to be equipped not just to study problems, but to imagine and advocate for better solutions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"f4640283-1c5e-4c43-93d3-f8c7b991cbb1\"}":{"__typename":"DeepDives","uuid":"f4640283-1c5e-4c43-93d3-f8c7b991cbb1","content":"\u003cp\u003eIn high school, I was definitely a high achiever—but on \u003cem\u003emy\u003c/em\u003e terms. I gave 110% to the things I cared about and... let’s just say, \u003cem\u003eselective energy\u003c/em\u003e to the things I didn’t. I was the kind of student who could stay up all night perfecting a project I loved, but would procrastinate a math worksheet for days if it didn’t feel meaningful. It sometimes drove my parents a little crazy, but it taught me something important early on: people work differently, and passion is a powerful motivator.\u003c/p\u003e\u003cp\u003eThat’s why I totally get students who light up when they're excited about something—and why I love helping them figure out how to channel that energy into something real. I’ve always believed that when you care about what you’re doing, the work doesn’t feel like work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a75210a8-8c5a-49ae-ad69-f42cf52abc11\"}":{"__typename":"DeepDives","uuid":"a75210a8-8c5a-49ae-ad69-f42cf52abc11","content":"\u003cp\u003eOne of my favorite passion projects was a clothing recycling brand I started in my freshman year of high school, which eventually evolved into a nonprofit during the pandemic. I’ve always loved fashion and thrifting, so I began upcycling clothes I found, reworking them into new pieces, and selling them online. What started as a creative outlet quickly grew into something with a purpose: I donated all the profits to an organization supporting mental health for women.\u003c/p\u003e\u003cp\u003eIt was a way for me to stay creatively engaged during lockdown while also giving back. I learned how to build a brand, run a small operation from my bedroom floor, and use style as a form of storytelling and impact. It showed me that passion projects don’t have to start big to matter—and that creativity and community can go hand in hand.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"a4de3fda-4a12-45d5-bd1d-24ec3f3d0a95\"}":{"__typename":"School","uuid":"a4de3fda-4a12-45d5-bd1d-24ec3f3d0a95","name":"Bethesda Chevy Chase High School","city":"Bethesda","type":"HIGH","state":"Maryland","country":"United States","zip":"20814"},"Education:{\"uuid\":\"bf0f3b1b-125a-4978-a233-2f4f4d87c5ed\"}":{"__typename":"Education","uuid":"bf0f3b1b-125a-4978-a233-2f4f4d87c5ed","school":{"__ref":"School:{\"uuid\":\"a4de3fda-4a12-45d5-bd1d-24ec3f3d0a95\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"113f7e1e-e6d5-4a72-b983-ce0dfc326f3c\"}":{"__typename":"Education","uuid":"113f7e1e-e6d5-4a72-b983-ce0dfc326f3c","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"60a108e1-c1b3-439d-af90-95a458457b79\"}":{"__typename":"MentorPublicProfile","uuid":"60a108e1-c1b3-439d-af90-95a458457b79","displayName":"Nina A.","slug":"nina-allen","biography":"\u003cp\u003eNina is a rising junior at Yale University, double-majoring in Political Science and Ethnicity, Race, and Migration. She’s especially passionate about the intersection of public policy, social justice, and youth advocacy. Born and raised in Washington, D.C., Nina grew up surrounded by activism, government, and a strong belief that young people can—and should—be changemakers. In high school, she launched \u003cem\u003eDripDrop\u003c/em\u003e, a youth-led nonprofit aimed at making water safety education more accessible to underserved minority communities, combining her interests in community organizing and marketing.\u003c/p\u003e\u003cp\u003eShe attended a public high school where she immersed herself in outreach and leadership. During her four years, Nina led the Leukemia and Lymphoma Society’s Student Visionaries team, raising over $120,000 in just seven weeks. She also served as an editor for her school newspaper and stayed connected to her love of swimming through both her nonprofit work and coaching at local pools.\u003c/p\u003e\u003cp\u003eIn her summers away from Yale, Nina has expanded her marketing and branding skills through internships across various sectors. She has worked with an education-focused company, helped start a grassroots podcast, and interned at a real estate group. Across these roles, she contributed to content creation, branding strategy, and audience analysis—learning how to turn complex missions into clear, compelling messages. These experiences deepened her understanding of how branding can amplify purpose, and gave her the tools to teach others how to confidently pitch and grow their own ideas.\u003c/p\u003e\u003cp\u003eIn her free time, Nina loves exploring New Haven’s food scene, updating her ever-evolving playlist (expect a mix of genres), and working on her anthology of essays. \u003c/p\u003e\u003cp\u003eNina is most excited to help Curious Cardinals students discover what excites them and turn that spark into something meaningful and marketable. Whether it’s launching a passion project, preparing for college, or building confidence in a new interest, she believes every student has something powerful to say—and she’s here to help them say it.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0a47cad4-d2a6-4795-a90f-f6134e11ae67\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed884c05-ce2e-4398-84d8-89b828eaba3f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f4640283-1c5e-4c43-93d3-f8c7b991cbb1\"}"},{"__ref":"DeepDives:{\"uuid\":\"a75210a8-8c5a-49ae-ad69-f42cf52abc11\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b1164c99-0a41-40c2-80f9-b31507f25fc0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"bf0f3b1b-125a-4978-a233-2f4f4d87c5ed\"}"},{"__ref":"Education:{\"uuid\":\"113f7e1e-e6d5-4a72-b983-ce0dfc326f3c\"}"}],"hiredAt":"2025-05-20T08:43:10.858Z","topics":["Writing","College Essay Writing","History","Reading","Creative Writing","Fashion / Cosmetics","Video / Photography","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nina-allen\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"60a108e1-c1b3-439d-af90-95a458457b79\"}"}}},"_sentryTraceData":"e44af70ff18943228ed8a85a6e196938-950105db153e0368-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=e44af70ff18943228ed8a85a6e196938,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"nina-allen"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style
