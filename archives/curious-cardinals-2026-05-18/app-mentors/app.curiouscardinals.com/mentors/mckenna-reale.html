xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"6bcd7f09-f866-4dc1-a5ef-a52c3f521846\"}":{"__typename":"Favorites","uuid":"6bcd7f09-f866-4dc1-a5ef-a52c3f521846","photoUrl":"https://ucarecdn.com/95f8e2ab-4417-4462-b442-596d8c1a0a07/","title":"melodrama (lorde)","type":"ALBUM"},"Favorites:{\"uuid\":\"2978762e-c774-4625-991c-19f4aff81a9b\"}":{"__typename":"Favorites","uuid":"2978762e-c774-4625-991c-19f4aff81a9b","photoUrl":"https://ucarecdn.com/b860e084-d759-4c01-9bc4-8f647a9b370a/","title":"new york","type":"CITY"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e8361d32-3cb5-45cc-8843-74b6f10901fc\"}":{"__typename":"DeepDives","uuid":"e8361d32-3cb5-45cc-8843-74b6f10901fc","content":"\u003cp\u003eI am extremely proud of how I've built my knowledge of science! I came into my undergrad studies having taken only one biology class in high school. In college, I took introductory biology and liked the subject so much that I decided to choose it as my major. I've now worked in three research labs and contributed to two research papers currently being published. Me from six years ago would be so proud of how far I've come!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"d2c133db-7053-48e0-bff1-4f3db86260dd\"}":{"__typename":"DeepDives","uuid":"d2c133db-7053-48e0-bff1-4f3db86260dd","content":"\u003cp\u003eA silly dream I once had (and still have!) is to live above a cafe. I've always been fascinated by apartments above businesses. There would be something fun to me about being able to walk down steps and be at a cafe or back up them and be at home.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"f20ef17a-1a6d-48d9-9346-9c6e5d922b71\"}":{"__typename":"DeepDives","uuid":"f20ef17a-1a6d-48d9-9346-9c6e5d922b71","content":"\u003cp\u003eI would love to travel to all seven continents! So far, I have been to three (North America, Europe, and Asia), but I'd love the opportunity to travel to more. I'm not sure yet how I will pull off visiting Antarctica, but I have a lifetime to plan!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5edd6775-2e4b-40da-b2f1-eb27fc6d7b1b\"}":{"__typename":"DeepDives","uuid":"5edd6775-2e4b-40da-b2f1-eb27fc6d7b1b","content":"\u003cp\u003eI love to knit my own sweaters! I love the creative outlet that knitting brings me, and I find it fascinating to learn how garments are created. Knitting and sewing patterns are the original algorithms, and as someone who loves taking concepts apart to see how they work, I've loved exploring this connection throughout my computer science studies.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"beb8108f-840f-4d06-871c-e8b1efc648db\"}":{"__typename":"School","uuid":"beb8108f-840f-4d06-871c-e8b1efc648db","name":"Chico High School","city":"Chico","type":"HIGH","state":"California","country":"United States","zip":"95926"},"Education:{\"uuid\":\"cdee5f78-37ab-4ed8-aefb-9b736e2098a3\"}":{"__typename":"Education","uuid":"cdee5f78-37ab-4ed8-aefb-9b736e2098a3","school":{"__ref":"School:{\"uuid\":\"beb8108f-840f-4d06-871c-e8b1efc648db\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"7d5def75-d6a1-41cb-bbb5-4624ee9def4b\"}":{"__typename":"Education","uuid":"7d5def75-d6a1-41cb-bbb5-4624ee9def4b","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Human Developmental and Regenerative Biology","degree":null},"Testimonial:09fa6dc7-0549-4d5f-bd48-a76ed57de871":{"__typename":"Testimonial","id":"09fa6dc7-0549-4d5f-bd48-a76ed57de871","text":"Our daughter has really enjoyed working with McKenna! Thank you McKenna for your encouraging presence, organization and flexibility. You are a role model!","date":"2025-08-24 17:41:47.984+00","rating":5,"endorser":{"__typename":"Endorser","name":"AM","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"c026126f-4c3d-45c3-baa6-d35b3ebe1b53\"}":{"__typename":"MentorPublicProfile","uuid":"c026126f-4c3d-45c3-baa6-d35b3ebe1b53","displayName":"McKenna R.","slug":"mckenna-reale","biography":"\u003cp\u003eHi! I'm McKenna, and I'm a software engineer originally from Chico, California. I went to Harvard for undergrad, where I majored in Human Developmental and Regenerative Biology. During my time in college, I worked on computational projects in two different scientific research labs. I realized through these experiences how much I enjoy coding. This led me to move to Philadelphia after graduation to get my Masters in Computer Information Technology at the University of Pennsylvania (Penn), where I gained more hands-on coding experience. \u003c/p\u003e\u003cp\u003eNow as a software engineer in a computational biology research lab, I love applying my computer science experience to biological problems. I currently work on developing computational tools for applications in cancer research. Because so much of computer science can feel intangible and theoretical, I love working on problems that have applications to such tangible issues.\u003c/p\u003e\u003cp\u003eWhen I'm not coding, I love curating Spotify playlists, going for walks around Philly, doing my own nails, and knitting my winter sweater wardrobe. I am a violinist and love playing chamber music. I am also a huge coffee fan and look forward to the brown sugar oat milk latte I make for myself every morning!\u003c/p\u003e\u003cp\u003eI'm especially excited to mentor others who are interested in computer science, biology, or the intersection of these fields, or who are curious about the scientific research process. Looking forward to meeting you!\u003c/p\u003e","teachingVideoPlaybackId":"prLA502xlANDDoAqQhv2JhChRvdWT5NKnZTVuf6KC00rg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"6bcd7f09-f866-4dc1-a5ef-a52c3f521846\"}"},{"__ref":"Favorites:{\"uuid\":\"2978762e-c774-4625-991c-19f4aff81a9b\"}"}],"causesSupported":[],"major":"Human Developmental and Regenerative Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e8361d32-3cb5-45cc-8843-74b6f10901fc\"}"},{"__ref":"DeepDives:{\"uuid\":\"d2c133db-7053-48e0-bff1-4f3db86260dd\"}"},{"__ref":"DeepDives:{\"uuid\":\"f20ef17a-1a6d-48d9-9346-9c6e5d922b71\"}"},{"__ref":"DeepDives:{\"uuid\":\"5edd6775-2e4b-40da-b2f1-eb27fc6d7b1b\"}"}],"active":true,"profilePhotos":["https:
