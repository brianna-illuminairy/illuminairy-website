xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"986f0b2c-8af9-424d-a0b7-1bf76449cb21\"}":{"__typename":"Favorites","uuid":"986f0b2c-8af9-424d-a0b7-1bf76449cb21","photoUrl":"https://ucarecdn.com/8e269e4f-14ad-477c-8520-63637c1bb02b/","title":"10 Things I Hate About You","type":"MOVIE"},"Favorites:{\"uuid\":\"d9c48318-8917-468f-ba80-cecf6f6fd68a\"}":{"__typename":"Favorites","uuid":"d9c48318-8917-468f-ba80-cecf6f6fd68a","photoUrl":"https://ucarecdn.com/fc1de9aa-874e-4b50-9271-40c5af933af4/","title":"Skyward","type":"BOOK"},"Favorites:{\"uuid\":\"044f563b-a632-4339-8374-07b42c81c788\"}":{"__typename":"Favorites","uuid":"044f563b-a632-4339-8374-07b42c81c788","photoUrl":"https://ucarecdn.com/94831dcd-6690-4c80-b31e-db7318efc5ff/","title":"Duke Basketball","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"02a9784a-ab0b-4172-ae49-13699f6df436\"}":{"__typename":"DeepDives","uuid":"02a9784a-ab0b-4172-ae49-13699f6df436","content":"\u003cp\u003eIf I could give my younger self one piece of advice, it would be to relax and trust the process. Things have a way of working out the way they’re supposed to, and it’s so important to believe in yourself and the path you’re on. I’d also remind myself to make more time for joy, try new things, and say yes to random opportunities. Some of the most exciting and meaningful parts of my life have come from moments I never could’ve predicted. Trust your instincts, stay curious, and don’t be afraid to have a little fun along the way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"4b05a02a-b976-47f3-a5ef-6172d475c26a\"}":{"__typename":"Education","uuid":"4b05a02a-b976-47f3-a5ef-6172d475c26a","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Electrical and Computer Engineering","degree":null},"School:{\"uuid\":\"67d72f2a-7885-42b3-8b16-578e094e8915\"}":{"__typename":"School","uuid":"67d72f2a-7885-42b3-8b16-578e094e8915","name":"Eastchester High School","city":"Eastchester","type":"HIGH","state":"New York","country":"United States","zip":"10709"},"Education:{\"uuid\":\"8c235ca8-8b38-4376-b9ea-47d590ca2b9d\"}":{"__typename":"Education","uuid":"8c235ca8-8b38-4376-b9ea-47d590ca2b9d","school":{"__ref":"School:{\"uuid\":\"67d72f2a-7885-42b3-8b16-578e094e8915\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"d622e975-3c65-429f-ace5-52cad98b7a1c\"}":{"__typename":"MentorPublicProfile","uuid":"d622e975-3c65-429f-ace5-52cad98b7a1c","displayName":"Milla R.","slug":"milla-reichenberg","biography":"\u003cp\u003eHi! I’m Milla, and I’m studying Electrical and Computer Engineering at Duke University. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in New York, which has given me some incredible opportunities. One of my favorite experiences has been at Kode With Klossy, an all-girls coding camp. I got to work on projects with real engineers from Microsoft and Apple, and even had the chance to meet some truly inspiring women, like the programmer of Apple Pay and Carolina Herrera herself. These encounters were incredible, getting to see a space for women and girls in a field where we’re still underrepresented. Being the only girl in the room is something I’ve gotten used to, but it’s also something I want to change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Duke, I’m involved in two business clubs, where I explore the intersection of technology and entrepreneurship. I also play in the Duke Marching Band, which means I’ve had the surreal experience of traveling with one of the top college basketball teams in the country. I was a competitive dancer in high school, so balancing athletics and academics is something I’m very familiar with. Go Blue Devils!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of class, I love music, especially concerts. With my friends, I love to explore new places, try new foods, go on long walks, and work out. I also love to read, especially sci-fi fantasy books. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I’m passionate about creating supportive, empowering spaces where students feel seen and heard. I was an assistant teacher at my dance studio for seven years, and I’ve become skilled at the flexibility and adaptation needed as a teacher. Whether I’m tutoring math or teaching two-year-olds how to jump, I love the journey it takes to learn. I want my mentees to walk away not only with their goals accomplished, but more confidence in themselves and their abilities. I’m so excited for my time with Curious Cardinals!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"986f0b2c-8af9-424d-a0b7-1bf76449cb21\"}"},{"__ref":"Favorites:{\"uuid\":\"d9c48318-8917-468f-ba80-cecf6f6fd68a\"}"},{"__ref":"Favorites:{\"uuid\":\"044f563b-a632-4339-8374-07b42c81c788\"}"}],"causesSupported":[],"major":"Electrical and Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"02a9784a-ab0b-4172-ae49-13699f6df436\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/069cc0ed-58f1-4307-b5ea-da49bd0
