xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6789212b-0cf9-4e99-b45a-3bbad2700ac2\"}":{"__typename":"DeepDives","uuid":"6789212b-0cf9-4e99-b45a-3bbad2700ac2","content":"\u003cp\u003eI chose my major because I am fascinated by creative composition--writing! I mostly write in the form of songs, but find that I love to study composition and writing through the lens of literature.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"099901d0-527f-45a7-97e3-9fa025dfc459\"}":{"__typename":"DeepDives","uuid":"099901d0-527f-45a7-97e3-9fa025dfc459","content":"\u003cp\u003eDuring the height of the Covid lockdown and my senior year of high school, I made a studio album with my high school band which has been streamed over 150,000 times!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"17407ecc-7450-43ab-8528-ca2cd8284707\"}":{"__typename":"DeepDives","uuid":"17407ecc-7450-43ab-8528-ca2cd8284707","content":null,"videoPlaybackId":"JktUYOUO74KB02BQXrvmGfFAw9vJqxwhK72cy3l01GkSQ","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"b45e49d5-ffe6-4495-871b-bbe33aa50fb3\"}":{"__typename":"School","uuid":"b45e49d5-ffe6-4495-871b-bbe33aa50fb3","name":"Glenbrook South High School","city":"Glenview","type":"HIGH","state":"Illinois","country":"United States","zip":"60026"},"Education:{\"uuid\":\"053d06f1-db3c-42c6-b3d6-f817fb439c33\"}":{"__typename":"Education","uuid":"053d06f1-db3c-42c6-b3d6-f817fb439c33","school":{"__ref":"School:{\"uuid\":\"b45e49d5-ffe6-4495-871b-bbe33aa50fb3\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"f474f0d0-c6aa-4564-9cd2-aba4a648d7db\"}":{"__typename":"Education","uuid":"f474f0d0-c6aa-4564-9cd2-aba4a648d7db","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English, Nonfiction Writing","degree":null},"MentorPublicProfile:{\"uuid\":\"966b86ab-a9ea-4392-95ea-e1d4b068eff6\"}":{"__typename":"MentorPublicProfile","uuid":"966b86ab-a9ea-4392-95ea-e1d4b068eff6","displayName":"Lev S.","slug":"lev-sheinfeld","biography":"\u003cp\u003eHi! My name is Lev and I’m a musician, writer and English student at Brown. I am a firm believer that learning should be fun, creative, and rooted in genuine curiosity. As an instructor, then, I consider it my foremost job to help you find and develop that curiosity and passion.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI first found my passion for writing at 14 when I wrote my first song. Since then, I have filled my life with all things writing, music, and art. I have written countless songs and have released an EP, album, and single, with a new solo project currently in the works. I spent the past two summers performing this original music regularly at various iconic venues in Chicago, and am currently pursuing my creative projects in NYC. This love of writing also underlies my choice to study English at Brown and lies at the heart of my upcoming thesis, a collection of essays on the relationship between art and the artist. I believe that writing is a intensive form of reading, and reading an intensive form of observing and experiencing. To be a writer to me is to pay attention to and find wonder in the world around you. This is my approach to learning and teaching, from history to music to writing your college essay.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of class, I sing in Brown’s premier a cappella group, the Jabberwocks. Last year, I was the group’s music director and this year, I will be president. The Jabberwocks is a wonderful community of singers that competes, records, and goes on tour twice a year, domestically and internationally. This past June, we took to Seoul, South Korea for our summer tour which was a blast (pictured above)! I also will be taking over hosting duties for Electric Hour, a biweekly songwriting showcase at Brown. I am additionally involved in The Round, Brown’s poetry magazine, and other on campus publications.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePhew, that was a lot. Most importantly, I’m excited to meet you! I have extensive experience in tutoring and mentorship programs precisely because I love working with and learning from younger students. In my life, I have experienced firsthand the transformative power of a wonderful mentor, instructor, or teacher. Since high school, I have made it my business to pay it forward. My senior year as Choir President, I founded a peer mentorship program within the choir program. I was also a leader in Peer Group, a year-long program which entailed leading weekly mentorship meetings for a group of 10 freshmen and undergoing rigorous leadership training. I also freelance tutored two students for a year over Covid, and was a swim instructor at the JCC for children ages 4-6. I have a real love for connecting with and inspiring younger people, and have found that inspiration to be reciprocal. I am thrilled to help with anything creative, humanities, music, or writing. I can't wait to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"JAepqPdLToXGdpFkun2202mvowOCJJBVYPVKAIqyb4CU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English, Nonfiction Writing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6789212b-0cf9-4e99-b45a-3bbad2700ac2\"}"},{"__ref":"DeepDives:{\"uuid\":\"099901d0-527f-45a7-97e3-9fa025dfc459\"}"},{"__ref":"DeepDives:{\"uuid\":\"17407ecc-7450-43ab-8528-ca2cd8284707\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ca127bc8-86ff-49b2-8258-007f18fb0869/-/preview/-/format/jpg/","https://ucarecdn.com/e9c13be2-d848-4fb4-87cf-8ebed26be6c7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"053d06f1-db3c-42c6-b3d6-f817fb439c33\"}"},{"__ref":"Education:{\"uuid\":\"f474f0d0-c6aa-4564-9cd2-aba4a648d7db\"}"}],"hiredAt":"2024-07-19T10:25:57.496Z","topics":["Music","Literature","Creative Writing","Business / Entrepreneurship","Reading","Executive Function","College Essay Writing","Academic Coaching","Writing","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lev-sheinfeld\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"966b86ab-a9ea-4392-95ea-e1d4b068eff6\"}"}}},"_sentryTraceData":"d07fc8527f1a4e4a8b5858e6b28c9fa5-9a85ea6a5543b434-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513
