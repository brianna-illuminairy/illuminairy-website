xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"57cf17a5-37fa-4ec6-9f2f-01a4d361b8f5\"}":{"__typename":"DeepDives","uuid":"57cf17a5-37fa-4ec6-9f2f-01a4d361b8f5","content":"\u003cp\u003eMy greatest source of motivation is the quote \"Hard work beats talent, when talent refuses to work hard.\" I wouldn’t say I’m naturally good at science or math, and definitely not physics, even though my grades might make it look easy. Everything I’ve achieved academically has come from hard work. In high school, after moving to a completely new school system, I decided to take AP Chemistry. At first it was really intimidating, especially when it felt like everyone around me already knew what was going on. But I stayed after class and during lunch to practice and understand the material. Over time, my effort paid off and I started to excel. That experience taught me that I can’t control whether I’m naturally talented, but I can control how hard I work. When I lose motivation, I remind myself that by outworking others I can achieve more than talent alone ever would.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b9811cc4-aedd-44b5-b6f7-736a36547a04\"}":{"__typename":"DeepDives","uuid":"b9811cc4-aedd-44b5-b6f7-736a36547a04","content":"\u003cp\u003eResearch doesn’t follow a normal 9-to-5 schedule, so a lot of my time outside the lab is still spent thinking about my project, reviewing literature, coming up with questions, and planning experiments. Those long days can be intense, but sometimes I have days where I’m completely free. Since I’ve only been living in São Paulo for a few months, I try to make the most of that time by practicing my Portuguese with people I meet and exploring the city. Brazil has such an active culture, so I play a lot of volleyball, go on hikes, and try to stay moving whenever I can. I also love traveling, I recently visited the Amazon and Rio, and both were so differently beautiful. I enjoy experiencing the music, food, culture, and liveliness of the people here. When I’m back in the U.S., I spend time reading, painting and drawing and watching cartoons or anime while catching up with my two little sisters. Balancing research with these activities helps me stay energized and curious while enjoying life outside the lab.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"afeab0e9-158a-4d20-a360-fbbe2876cab5\"}":{"__typename":"DeepDives","uuid":"afeab0e9-158a-4d20-a360-fbbe2876cab5","content":"\u003cp\u003eIf I could give my middle or high school self advice, it would be not to feel pressured to know exactly what you want to do. When I was in high school, I felt an immense amount of pressure to have it all figured out, but I’ve learned that having many interests is a strength, not a problem. Now is the time to explore, try different things, and follow what excites you without worrying about picking just one path. Give your best effort to everything you try, even if it ends up not being your “thing,” because doing well in something can open doors and create connections you never expected. For example, in college I decided to take Portuguese just for fun because I was interested in its connection to the African diaspora. That curiosity and willingness to try something new eventually led me to my current Fulbright research in malaria in Brazil. The advice I would give myself is to stay curious, take risks, and not limit yourself by feeling like you need to choose one path too early, you never know where following your interests might lead.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"89fa8df9-4e6d-4a34-bb2c-6a7ee47ee8cd\"}":{"__typename":"School","uuid":"89fa8df9-4e6d-4a34-bb2c-6a7ee47ee8cd","name":"Thomas S. Wootton High School","city":"Rockville","type":"HIGH","state":"Maryland","country":"United States","zip":"20850"},"Education:{\"uuid\":\"19f418a4-4867-42a6-86b5-1c6a2b0dc7f5\"}":{"__typename":"Education","uuid":"19f418a4-4867-42a6-86b5-1c6a2b0dc7f5","school":{"__ref":"School:{\"uuid\":\"89fa8df9-4e6d-4a34-bb2c-6a7ee47ee8cd\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"363a3954-974c-4a83-8149-91e84dc4c03b\"}":{"__typename":"School","uuid":"363a3954-974c-4a83-8149-91e84dc4c03b","name":"University of North Carolina at Chapel Hill","city":"Chapel Hill","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27599"},"Education:{\"uuid\":\"6214aa90-1eb2-4251-a164-8e2ff04403c6\"}":{"__typename":"Education","uuid":"6214aa90-1eb2-4251-a164-8e2ff04403c6","school":{"__ref":"School:{\"uuid\":\"363a3954-974c-4a83-8149-91e84dc4c03b\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2023","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"5640f92d-8496-41e0-84e0-4223c470212d\"}":{"__typename":"MentorPublicProfile","uuid":"5640f92d-8496-41e0-84e0-4223c470212d","displayName":"Eliyambuya B.","slug":"eliyambuya-baker","biography":"\u003cp\u003eHello!\u003c/p\u003e\u003cp\u003eMy name is Eliyambuya, though everyone calls me Ellie. I am a Tanzanian-American, an artist, an activist, and most importantly, a scientist. I was born in Washington, D.C., and grew up in several countries, including Tanzania and Germany, before returning to the United States for high school in Maryland. Moving so frequently was challenging but it taught me resilience, independence, and how to adapt to new environments. These experiences were crucial in helping me pursue biomedical research, especially since I had no guidance as I was the first in my family to enter this field. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated in 2023 with a Bachelor of Science in Biology from the University of North Carolina. At UNC, I continued to explore my interests in African American Diaspora studies and language learning, while being actively involved in the African Student Union and the Black Student Movement. I also founded a club to support local artists and provide creative opportunities to people who lack access to resources. I also played volleyball throughout college, which taught me teamwork, perseverance, and how to balance multiple commitments. During this time, I conducted research in a cell biology and biochemistry lab and worked as a lab technician across three different research labs. These experiences provided me with hands-on technical skills and introduced me to the process of designing and analyzing experiments. More importantly, this exposure allowed me to see for the first time the possibilities of a career in biomedical science, giving me the clarity and motivation to pursue this path professionally while continuing to explore ways I could combine science with mentorship and community engagement.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduation, I moved to New York to work at Memorial Sloan Kettering as a Bridge Scholar in a cancer immunology lab for two years. The program supports students from underrepresented backgrounds in research and medicine. At MSK, I was part of a community that understood the challenges of entering this field without built-in support, and I was exposed to rigorous science, strong mentorship, and a collaborative research environment. The program’s focus on supporting students from underrepresented backgrounds reinforced my belief that mentorship is not just helpful but essential for opening doors in science.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I am a Fulbright Scholar living in São Paulo, Brazil, where I am using computational biology to study genetic susceptibility to malaria. This project allows me to integrate my scientific training with global health perspectives while learning to design and execute research independently. These experiences have prepared me to pursue a PhD in Infectious Disease and Immunology at UC Berkeley after my Fulbright program. Throughout my academic journey, I have recognized the immense value of guidance and support in helping students navigate scientific pathways, particularly for those who may not have access to mentorship or resources. I am passionate about providing students with the encouragement, knowledge, and practical tools to explore science and medicine confidently, helping them develop the skills and clarity to follow their own paths.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"WKZNzqHR6RtjOa02ZYnwJdQQ2PDW6D021LGtVUYG601G2o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"57cf17a5-37fa-4ec6-9f2f-01a4d361b8f5\"}"},{"__ref":"DeepDives:{\"uuid\":\"b9811cc4-aedd-44b5-b6f7-736a36547a04\"}"},{"__ref":"DeepDives:{\"uuid\":\"afeab0e9-158a-4d20-a360-fbbe2876cab5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2e88f0ff-5c8b-4691-9a4a-0589f365a883/-/preview/-/format/jpg/","https://ucarecdn.com/1fe9c5e5-727a-4158-855d-71eb8b81249d/-/preview/-/format/jpg/","https://ucarecdn.com/0821c1b7-3c57-4592-b6a0-47e80841cc28/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"19f418a4-4867-42a6-86b5-1c6a2b0dc7f5\"}"},{"__ref":"Education:{\"uuid\":\"6214aa90-1eb2-4251-a164-8e2ff04403c6\"}"}],"hiredAt":"2025-11-29T02:02:50.275Z","topics":["Statistics","6-8 Grade Science","Chemistry","Biology","Academic Coaching","College Essay Writing","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"eliyambuya-baker\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5640f92d-8496-41e0-84e0-4223c470212d\"}"}}},"_sentryTraceData":"82aa2bc3ea02437980072c530dca53dd-882043928ab61fce-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=82aa2bc3ea02437980072c530dca53dd,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"eliyambuya-baker"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns
