xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"d862e720-f21c-40ec-90be-8a992622c39a\"}":{"__typename":"DeepDives","uuid":"d862e720-f21c-40ec-90be-8a992622c39a","content":"\u003cp\u003eMy greatest role model is my mom. I am incredibly grateful for her and the example she has set throughout my life. She raised four children largely on her own while working to support our family, and no matter how challenging things became, she always put us first. One of the biggest sacrifices she made was leaving her entire family in South Korea to build a better life for her children, a decision that required much courage and selflessness. What stands out most to me is not just how hard she worked, but the consistency with the love and support she showed every day even when she had tiring days at work. Her strength, selflessness, and consistency continue to motivate me every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"55185909-9a64-48fb-b638-7b32a718068b\"}":{"__typename":"DeepDives","uuid":"55185909-9a64-48fb-b638-7b32a718068b","content":"\u003cp\u003eSomething that isn’t obvious about me right away is how much I am driven by human connection. Outside of my academics and structured commitments, I genuinely enjoy talking with people, including strangers. I make an effort to start conversations and offer small, sincere compliments because I believe those moments of positivity matter more than we often realize. Building connections, even brief ones, energizes me and shapes how I approach teamwork, leadership, and everyday interactions. It’s something I value deeply, even if it doesn’t immediately show on paper.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"175ccfc8-424c-4e8a-80b6-a4842583865d\"}":{"__typename":"DeepDives","uuid":"175ccfc8-424c-4e8a-80b6-a4842583865d","content":"\u003cp\u003eMy mom definitely used to describe me as a troublemaker in middle school and early high school which I agree with (I say used to, since that was until my little sister was in high school- thanks Emily. I was always naturally strong in STEM, but I did not yet know how to learn or push myself intentionally. I often relied on getting by with the least amount of effort possible, and I was more focused on spending time with friends than developing good habits. Truthfully, I would work as hard as possible to do as little work as possible. I remember going to the library in my sophomore year without my phone to reassure my mom, only to watch football or hang out instead of actually studying.\u003c/p\u003e\u003cp\u003eLooking back, that version of me lacked discipline and direction, but it also makes my growth clearer. Over time, I learned how to take ownership of my work, challenge myself, and value consistency. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"935029b6-af4d-4165-bfda-9e5842efa76c\"}":{"__typename":"DeepDives","uuid":"935029b6-af4d-4165-bfda-9e5842efa76c","content":"\u003cp\u003eSomething I am extremely proud of is the person I have grown into. I try to be intentional about showing up with kindness and leaving a positive impact, even in small, everyday interactions. I have been told by others that I bring positive energy and approach people with openness, and that matters to me because it reflects the values I work to live by. It is something I continue to work on, but I am proud of the consistency with which I try to lead with empathy and positivity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"245beacc-ee3a-493d-b877-1d01e540d195\"}":{"__typename":"School","uuid":"245beacc-ee3a-493d-b877-1d01e540d195","name":"Cherry Creek High School","city":"Greenwood Village","type":"HIGH","state":"Colorado","country":"United States","zip":"80111"},"Education:{\"uuid\":\"ce790e4c-6f52-4364-b6e6-b6a9a630fd21\"}":{"__typename":"Education","uuid":"ce790e4c-6f52-4364-b6e6-b6a9a630fd21","school":{"__ref":"School:{\"uuid\":\"245beacc-ee3a-493d-b877-1d01e540d195\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"c312a0e8-dac3-4b84-97fb-b80355323caf\"}":{"__typename":"Education","uuid":"c312a0e8-dac3-4b84-97fb-b80355323caf","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"8836aafe-74f0-494c-8ec1-fca8f684a01b\"}":{"__typename":"MentorPublicProfile","uuid":"8836aafe-74f0-494c-8ec1-fca8f684a01b","displayName":"Andrew H.","slug":"andrew-hong","biography":"\u003chr\u003e\u003cp\u003eI am a senior at Northwestern University studying mechanical engineering and business, where I have been named to the Dean’s List 7 times. I have always been drawn to challenging myself academically, but I care just as much about who I am outside the classroom. I am motivated by learning, growth, and building meaningful connections with the people around me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I love singing, exploring the city, and spending intentional time with others without distractions. Singing has been a constant in my life and is something I turn to both as a creative outlet and a way to stay grounded during busy weeks. I also enjoy being active, whether that means going on runs, lifting weights, or playing sports. Growing up in Denver shaped a lot of this, as I learned early on to value staying active, spending time outdoors, and maintaining balance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my strengths is time management. I balance a demanding academic courseload alongside a work-study job at the university library and weekly voice lessons, which has taught me how to prioritize effectively and stay disciplined with my time. I am also very people-oriented and enjoy meeting new people, building connections, and having meaningful conversations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I have developed a strong interest in consulting and problem-solving at the intersection of technology, engineering, and business. I am currently a Teaching Assistant for a nonprofit consulting class, where I support student teams as they work with real organizations to solve strategic challenges. Through this role and my prior tech consulting internship experience, I have enjoyed learning how to break down complex problems, collaborate with diverse teams, and translate analysis into actionable recommendations. After graduation, I will be working in tech consulting in Denver, which I am excited about as both a professional opportunity and a return to home.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt a personal level, one of my goals this year is to be more present in my day-to-day life. I am intentionally trying to read more often and spend less time on my phone. Overall, I strive to be someone who is curious, disciplined, and people-oriented, someone who works hard, stays active, and values community as much as achievement.\u003c/p\u003e","teachingVideoPlaybackId":"ULgu01bDJH5GUlWuKaW3Gusmf3oB1DyNgbceRirFaN4w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d862e720-f21c-40ec-90be-8a992622c39a\"}"},{"__ref":"DeepDives:{\"uuid\":\"55185909-9a64-48fb-b638-7b32a718068b\"}"},{"__ref":"DeepDives:{\"uuid\":\"175ccfc8-424c-4e8a-80b6-a4842583865d\"}"},{"__ref":"DeepDives:{\"uuid\":\"935029b6-af4d-4165-bfda-9e5842efa76c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fb49bcbe-0895-48c9-9dfc-bcc9235d5dac/-/preview/-/format/jpg/","https://ucarecdn.com/91461065-4e69-437e-b61c-4436ce30e666/-/preview/-/format/jpg/","https://ucarecdn.com/5068c28a-47bc-42e9-a748-dda3d70f9c56/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"ce790e4c-6f52-4364-b6e6-b6a9a630fd21\"}"},{"__ref":"Education:{\"uuid\":\"c312a0e8-dac3-4b84-97fb-b80355323caf\"}"}],"hiredAt":"2026-01-05T18:54:27.282Z","topics":["Calculus","Geometry","Precalculus / Trigonometry","Algebra II","Algebra I","Pre-Algebra","Physics","6-8 Grade Science","Biology"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mento
