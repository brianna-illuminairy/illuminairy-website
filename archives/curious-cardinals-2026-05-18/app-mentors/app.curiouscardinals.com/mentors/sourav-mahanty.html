xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"85ab2871-abd2-4bb2-8d7c-96bccb6f4c3e\"}":{"__typename":"Favorites","uuid":"85ab2871-abd2-4bb2-8d7c-96bccb6f4c3e","photoUrl":"https://ucarecdn.com/c7ad57e8-46db-455d-a93c-b5217d91fa62/","title":"Interstellar","type":"MOVIE"},"Favorites:{\"uuid\":\"21dced64-3a0c-4684-b8d0-c51927b95a11\"}":{"__typename":"Favorites","uuid":"21dced64-3a0c-4684-b8d0-c51927b95a11","photoUrl":"https://ucarecdn.com/bb9bb4e5-d16f-4032-8068-66f5a952e7e3/","title":"Basketball","type":"SPORT"},"Favorites:{\"uuid\":\"ff9c9106-d6a1-4473-a1fd-89dd9aab030f\"}":{"__typename":"Favorites","uuid":"ff9c9106-d6a1-4473-a1fd-89dd9aab030f","photoUrl":"https://ucarecdn.com/bb9bb4e5-d16f-4032-8068-66f5a952e7e3/","title":"Battlefield 2042","type":"GAME"},"CausesSupported:{\"uuid\":\"b1b16327-0130-4d90-bf45-22e0cb29d1e0\"}":{"__typename":"CausesSupported","uuid":"b1b16327-0130-4d90-bf45-22e0cb29d1e0","name":"The Kramden Institute","description":"\u003cp\u003eThis organization is devoted to bridging the digital divide in NC.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/4cc3c6b0-7824-4e3a-873a-8a6c9a8bea1a/"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a81e8040-d7bd-4b03-a282-fadf61d30a3d\"}":{"__typename":"DeepDives","uuid":"a81e8040-d7bd-4b03-a282-fadf61d30a3d","content":"\u003cp\u003eMy friends started getting really into sports betting in college, and I always wondered if I could use math and computer science to create an advantage. After working with a friend over the last year or so, we were able to create an application using python and a few web libraries that accurately finds and notifies us about bets we can place with a 100% guarantee of risk-free profit. This experiment into the world of gambling actually helped me to garner very strong skills in analytical thinking and creative problem solving, as we had to get data from different sources, format all the data in the same way, and then extrapolate decisions out of it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"86f6d067-deca-4a52-b340-405b44dde541\"}":{"__typename":"DeepDives","uuid":"86f6d067-deca-4a52-b340-405b44dde541","content":"\u003cp\u003eMentorship is something that benefits both parties. I truly believe one of the best ways to learn and improve your skills in something is to teach that subject to somebody else. In addition, I held a lead volunteer role at a non-profit organization for over 4 years in high school, and this allowed me to see first-hand the benefits that result from using your knowledge to help others. In addition, you have the ability to form life-long friendships with those that you are mentoring. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"9b4fae0c-4844-4e76-b594-da3a58e6bc80\"}":{"__typename":"School","uuid":"9b4fae0c-4844-4e76-b594-da3a58e6bc80","name":"Carrboro High School","city":"Carrboro","type":"HIGH","state":"North Carolina","country":"United States","zip":"27510"},"Education:{\"uuid\":\"3f119bbb-f0f2-49e6-89aa-95923c053433\"}":{"__typename":"Education","uuid":"3f119bbb-f0f2-49e6-89aa-95923c053433","school":{"__ref":"School:{\"uuid\":\"9b4fae0c-4844-4e76-b594-da3a58e6bc80\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"be7d3550-f5ad-4aa2-af0f-3e28685c847f\"}":{"__typename":"Education","uuid":"be7d3550-f5ad-4aa2-af0f-3e28685c847f","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Joint Degree in Business and Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"3b37d69c-6bd2-4874-a553-66c8d5774551\"}":{"__typename":"MentorPublicProfile","uuid":"3b37d69c-6bd2-4874-a553-66c8d5774551","displayName":"Sourav M.","slug":"sourav-mahanty","biography":"\u003cp\u003eI was born in Chapel Hill (a tar heel fan by blood!), and I've always been interested in technology and business. I currently work for Mastercard as a Business Operations Intern, and I am looking forward to returning full-time. I love music, travel, and food, and I try to make new friends wherever I go! I've been a teaching assistant for two computer science classes at WashU, as well a personal tutor for students. I live, breath, and believe in computer science. \u003c/p\u003e","teachingVideoPlaybackId":"oucDJo2jHoipuL01aM4yoSABGLvNJEsZ7byPlYBkUTKg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my greatest achievements has been securing one of my dream job at Mastercard as a Business Operations Engineer. I've always wanted to combine computer science and business, and this opportunity gave me the chance to do so. I was only able to gain employment at Mastercard from valiant efforts and long nights of preparation, and it was something I NEVER imagined happening. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"85ab2871-abd2-4bb2-8d7c-96bccb6f4c3e\"}"
