wKiQP91m8Y8t9qh201MfaZJS8fUXbZXvHaxu8ZM","question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"5c2198bf-0447-4b3c-bdee-33a621ba8853\"}":{"__typename":"School","uuid":"5c2198bf-0447-4b3c-bdee-33a621ba8853","name":"Cherry Hill East High School","city":"Cherry Hill Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08003"},"Education:{\"uuid\":\"f8b3c8ac-0fc3-480c-acde-24c1af65feea\"}":{"__typename":"Education","uuid":"f8b3c8ac-0fc3-480c-acde-24c1af65feea","school":{"__ref":"School:{\"uuid\":\"5c2198bf-0447-4b3c-bdee-33a621ba8853\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"a0b45d0a-4509-4982-922c-3b604bf8c837\"}":{"__typename":"Education","uuid":"a0b45d0a-4509-4982-922c-3b604bf8c837","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Aerospace Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"d0454f00-dc56-4053-8e3f-442f1746b98a\"}":{"__typename":"MentorPublicProfile","uuid":"d0454f00-dc56-4053-8e3f-442f1746b98a","displayName":"Riva S.","slug":"riva-sharma","biography":"\u003cp\u003eThroughout my career, I have often found myself at the other end of this question: “Why did you choose to do Aerospace?” At first, I found it surprising. It transported me back to my childhood, when I would often hear adults ask what I wanted to be when I grew up.\u003c/p\u003e\u003cp\u003eAerospace is such a fun and fulfilling major that it kind of felt like an obvious answer. Who would not want to learn rocket science? There is an assumption that those in this major grew up star crossed with an interest in space, and typically this is true. I have heard many recollections of people who would read up on historical aerospace events, tinker with rocket models, and aspire to one day build their own rockets(I even heard of a guy who built an engine out of his garage!! Quite shocking, though he did end up almost setting his house on fire, if I recall)\u003c/p\u003e\u003cp\u003eI will admit, I was not one of those people, and that is okay. I am sure many people out there can relate to having no clue where to start and feeling intimidated. That is why I am so excited to share with others what my experience has been in a field that is always changing and growing. I think, as silly as it sounds, my incentive for studying aerospace has always been linked to my desire to learn more. The power behind aerospace vehicles was something I wanted to understand.\u003c/p\u003e\u003cp\u003eIn aerospace, you are constantly learning something new and get the chance to be part of revolutionary technology that will quite literally go down in the history books\u003c/p\u003e\u003cbr\u003e\u003cp\u003e.\u003c/p\u003e\u003cp\u003eBut truth be told, rocket science...is rocket science. It is hard, but not in the way you would traditionally expect. The hardest part about engineering is the intellectual discomfort of feeling out of your depth, the humiliation of realizing you knew far less than you thought, and the struggle of pushing forward despite feeling unqualified. As a student with ADHD, it is a feeling I battled with long before college.\u003c/p\u003e\u003cp\u003eA lesson I like to share with my students is that a big part of being confidently smart is being confidently stupid. That is how you grow. Aerospace is a field where you must accept that there will always be things you do not know. That reality is both frustrating and motivating, because it forces you to keep learning and keep adapting.\u003c/p\u003e\u003cp\u003eThe challenge of working in the rocket and hypersonics industry was not just technical, it was personal. If I wanted to see results, I had to put in the work. I notice with my students that they are confident and excited to learn when it is a subject they are familiar with or understand, because it is inherently rewarding to understand something. I like to recreate the feeling of finally understanding a math problem after hours of trying, without the hours of trying, through intentional teaching and reinforcement via real projects where classroom skills can be applied to technical work.\u003c/p\u003e\u003cp\u003eWorking in this industry taught me that no matter how difficult the task, every step helped me grow as an engineer. Each challenge reinforced my problem solving skills, my ability to adapt, and my confidence in tackling unfamiliar problems. There were times when things did not go according to plan and I had to problem solve on the fly, learning how to anticipate roadblocks before they became major issues. These are the skills I intend to give to my students. I want to share the fun side of engineering to fuel their passion, and then give them exactly what they need to survive in these environments.\u003c/p\u003e\u003cp\u003eAll in all, my passion is really just my curiosity. So instead of asking people “Why do you do it?” I think we should start asking, “What makes you curious?” I can guarantee you will get a much more fun and fulfilling answer.\u003c/p\u003e","teachingVideoPlaybackId":"O00mVTdUdBIBjw51CSCApot7qQSd00029k01aWI02MbeUnr00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eCheck out my portfolio and Linkedin for more on who I am and what I've done!\u003c/p\u003e\u003cbr\u003e\u003cp\u003ehttps://rsharma405.wixsite.com/rivas-revelations\u003c/p\u003e\u003cbr\u003e\u003cp\u003ehttps://www.linkedin.com/in/riva-sharma-0132951aa/\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0dba09f5-d7c3-4ab6-b8b7-aa8936fb1689\"}"},{"__ref":"Favorites:{\"uuid\":\"15bca527-a
