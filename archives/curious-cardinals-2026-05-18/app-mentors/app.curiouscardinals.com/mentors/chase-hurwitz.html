xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"6ee9b49f-edff-4a84-955d-ef0b541d1144\"}":{"__typename":"Education","uuid":"6ee9b49f-edff-4a84-955d-ef0b541d1144","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":"B.S."},"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}":{"__typename":"School","uuid":"70146acc-a4ce-459e-8969-b791ab43dfb2","name":"Menlo School","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"d2729168-c0c5-4c41-9184-effeee7a69e4\"}":{"__typename":"Education","uuid":"d2729168-c0c5-4c41-9184-effeee7a69e4","school":{"__ref":"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"061c500e-a3bb-4cf8-89ef-d316687cba25\"}":{"__typename":"MentorPublicProfile","uuid":"061c500e-a3bb-4cf8-89ef-d316687cba25","displayName":"Chase H.","slug":"chase-hurwitz","biography":"Chase Hurwitz is a first-year student at Washington University in St. Louis currently pursuing a B.S. in Computer Science, and a second major in Sociology. He's always loved learning about STEM, humanities, and social sciences, and these two majors allow him to combine the best of all these topics.\n\nChase was born and raised in the Bay Area, California which had a huge impact on his personality and interests. Chase grew up around some of the best natural environments in the world and thus loves backpacking, skiing, surfing, and other outdoor activities. He also grew up playing all types of sports like soccer, football, basketball, and baseball.\n\nGoing to school in the heart of Silicon Valley instilled within him a deep interest in computer science and technology. He also had some incredible opportunities to serve the community. From 2019-2022, he was one of three directors of an educational 501(c)(3) non-profit. They served over 200,000 students internationally, and watching that impact grow over time was one of the most rewarding things he did in high school. In addition to that, Chase was the varsity baseball captain, co-founder of the chess club, English department TA, and Editorial Board member of his student newspaper (for which he won many awards).\n\nChase’s mom is from London and almost all his family still lives there, including grandparents, uncles, and cousins. Chase has been lucky enough to visit them around once a year for most of his life, and he is also incredibly grateful to have traveled much of the world. Some of Chase’s favorite countries he’s visited are Italy, Cambodia, South Africa, and Argentina. Travel has changed Chase’s perspective on society and life more than any other experience he’s had. Travel has given him a deep respect, admiration, and love for different cultures.\n\nChase describes his personality as optimistic, flexible, and driven. Throughout his life he has tried to shoulder every opportunity with dedication and energy, but also with ample amounts of adaptability to take challenges and failures in stride. He seeks to stay passionate even when subjects get difficult.\n\nThis is the same approach he brings to mentoring. Chase love to create a positive environment that pushes students to be their very best. He provides an interactive, step-by-step lesson that is not just comprehensible, but exciting for students. Some of his most rewarding experiences in learning are those \"aha\" moments — times when a difficult concept suddenly clicks. Pushing through these barriers not only improves one as a student, but as a human in general. He loves being apart and helping others through those types of moments.\n\nBeyond academics, he has a ton of different interests. Chess, sports, student journalism, film, music, entrepreneurship, community service, artificial intelligence, and barbecuing are all things that excite him. Please ask him about any of these!\n\nChase couldn't be more excited to be a mentor at Curious Cardinals!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/4808c593-97b9-4623-abbc-7c3218907115/-/crop/2476x2478/0,27/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6ee9b49f-edff-4a84-955d-ef0b541d1144\"}"},{"__ref":"Education:{\"uuid\":\"d2729168-c0c5-4c41-9184-effeee7a69e4\"}"}],"hiredAt":"2023-04-04T19:02:46.961Z","topics":["Coding / Programming","History Project","Video / Photography","Sustainability","Global Health","Journalism","K-5 Grade Math","Writing","Biology","Creative Writing","Sports Journalism","6-8 Grade Science"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"chase-hurwitz\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"061c500e-a3bb-4cf8-89ef-d316687cba25\"}"}}},"_sentryTraceData":"f67ef4b9b3b74c8f8112f3ae5d793039-b529dee8e0cac6dc-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f67ef4b
