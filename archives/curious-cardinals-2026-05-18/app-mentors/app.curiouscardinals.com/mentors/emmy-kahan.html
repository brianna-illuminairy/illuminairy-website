sting my older brother who has autism. Mentorship, to me, is about friendship, understanding, and social responsibility, all things that drive me as a person and a scholar. Mentorship is the most meaningful use of my time. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"9a93e4f5-7658-45cf-a48f-29d795c92656\"}":{"__typename":"School","uuid":"9a93e4f5-7658-45cf-a48f-29d795c92656","name":"Horace Greeley High School","city":"Chappaqua","type":"HIGH","state":"New York","country":"United States","zip":"10514"},"Education:{\"uuid\":\"52871b6f-ea46-449e-91c8-ebc62298d779\"}":{"__typename":"Education","uuid":"52871b6f-ea46-449e-91c8-ebc62298d779","school":{"__ref":"School:{\"uuid\":\"9a93e4f5-7658-45cf-a48f-29d795c92656\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"dc61a796-ecfb-4b25-8111-f12e0e556587\"}":{"__typename":"Education","uuid":"dc61a796-ecfb-4b25-8111-f12e0e556587","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"db83849c-83fc-41bf-bd07-5b7592240766\"}":{"__typename":"MentorPublicProfile","uuid":"db83849c-83fc-41bf-bd07-5b7592240766","displayName":"Emmy K.","slug":"emmy-kahan","biography":"\u003cp\u003eHello! My name is Emmy and I am a sophomore at Columbia. I grew up just outside of NYC and graduated summa cum laude from my high school where I was the Chair of Peer Leadership (a program of student leaders in their junior and senior years teaching a class of freshmen), the President of Students Against Destructive Decisions (SADD), the President of a special education inclusion program called Ambassadors, and a member of student council. I transferred from Boston College to Columbia this year, so I am certainly no stranger to the college process, and at BC I was on the Executive Board of our chapter of College Democrats. \u003cbr\u003e\u003cbr\u003eMy educational path is truly driven by passion and empathy, leaning into government, literature, and history to connect with the world meaningfully and make change. I grew up as a competitive dancer, and the arts were where I found my largest means of connection and self-expression. Eventually, what began as movement, became a voice that I use either vocally or in my writing and I hope to empower my mentees to follow their passions to see where they are unexpectedly taken and to help my mentee harness their voice - whatever that voice may be and whoever it may speak for.\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1060db6a-47d7-4389-8fa3-f7f4a47a57bf\"}"},{"__ref":"Favorites:{\"uuid\":\"d74df472-0a48-4f93-825f-87707f8b4609\"}"},{"__ref":"Favorites:{\"uuid\":\"f5207d5a-15e9-4a72-a5b6-9aca1cdbe507\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"4914c787-870c-4651-81c4-6af0b38332ce\"}"}],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b67fb727-bd6a-49b3-ba85-6b2709271747\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/929a7ee5-5ba7-467a-9afd-a356f3fddc45/-/preview/-/format/jpg/","https://ucarecdn.com/d2bd0ed6-0e4a-4499-89e7-a3f6af3bffc8/-/preview/-/format/jpg/","https://ucarecdn.com/8e16c7b1-5052-47da-96e6-58ebaea2630a/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"52871b6f-ea46-449e-91c8-ebc62298d779\"}"},{"__ref":"Education:{\"uuid\":\"dc61a796-ecfb-4b25-8111-f12e0e556587\"}"}
