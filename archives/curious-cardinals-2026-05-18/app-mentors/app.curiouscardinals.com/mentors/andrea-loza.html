xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"24d55dce-774f-41ad-a1b2-15353fb85f49\"}":{"__typename":"Favorites","uuid":"24d55dce-774f-41ad-a1b2-15353fb85f49","photoUrl":"https://ucarecdn.com/26916081-5e8b-4f72-8c82-b1f0d1c1e19c/","title":"Dresden, Germany","type":"CITY"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"8550d291-cd06-405e-9112-5fa2b23a8a19\"}":{"__typename":"DeepDives","uuid":"8550d291-cd06-405e-9112-5fa2b23a8a19","content":"\u003cp\u003eMy heritage and identity have shaped my perspective on adaptability and communication. Having grown up in Bolivia and attended high school in the U.S., I've learned to appreciate and navigate different cultural norms and communication styles. This experience has made me a more empathetic and flexible mentor. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI understand that every student learns at a different pace and in their own way, and I strive to create a supportive environment where we can find a personalized approach that works for them. My goal is to foster an inclusive and understanding space where students feel comfortable sharing their authentic selves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"e071cb23-d750-4c12-af67-a8c428789cf2\"}":{"__typename":"DeepDives","uuid":"e071cb23-d750-4c12-af67-a8c428789cf2","content":"\u003cp\u003eIn my last two years of high school, I conducted research on the challenges immigrant students face when transitioning into the American school system. While tutoring English-learning students, I saw firsthand how families struggled with the lack of accessible information. This experience prompted me to create a tangible solution: a multilingual app prototype designed to help new families navigate the public education system more efficiently. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI pitched the app to the International Welcome Center in my County and successfully convinced them to support its implementation. The app was tailored to bridge crucial information gaps, providing direct access to essential logistics like drill procedures and a glossary of educational terms. The most rewarding part of this project was seeing families become empowered and confidently advocate for their children’s educational goals. To ensure a great user experience, I focused on early-stage feedback from a diverse group of families to make the initial prototype as intuitive as possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cf1a4bbd-32bb-453c-b171-322a0993e306\"}":{"__typename":"DeepDives","uuid":"cf1a4bbd-32bb-453c-b171-322a0993e306","content":"\u003cp\u003eI love to explore new coffee shops, take nature walks, and listen to my favorite podcasts. I also enjoy sidequesting with friends and playing pool. I'm a classical music fan and play the violin. My biggest passion is traveling and experiencing new places and cultures.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8f153636-e1d3-4319-b610-4dc02afdf557\"}":{"__typename":"DeepDives","uuid":"8f153636-e1d3-4319-b610-4dc02afdf557","content":"\u003cp\u003eMentorship matters to me because I believe in the power of a supportive community. I've been fortunate to have had incredible mentors who have guided me, and now I hope to be that person for someone else.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my role as a counselor for the Yale LAUNCH program, a pre-orientation camp focused on entrepreneurship, I guided incoming students and helped them connect with the resources they needed. This showed me how crucial it is for students to have a personal connection as they navigate a new environment.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThrough my work on the board of Latina Women at Yale, I have seen how a supportive community can help students feel more confident and empowered to achieve their goals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorship is not just about providing answers; it's about helping people find a system that works for them, build critical life skills, and discover their own unique strengths.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"40c488b6-9d80-475e-a18e-a6de6f3ecf2a\"}":{"__typename":"School","uuid":"40c488b6-9d80-475e-a18e-a6de6f3ecf2a","name":"Governor's School","city":"Stafford","type":"HIGH","state":"Virginia","country":"United States","zip":"22556"},"Education:{\"uuid\":\"1c56407c-cab1-476e-8ed9-2ac7e44819dd\"}":{"__typename":"Education","uuid":"1c56407c-cab1-476e-8ed9-2ac7e44819dd","school":{"__ref":"School:{\"uuid\":\"40c488b6-9d80-475e-a18e-a6de6f3ecf2a\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"8400ca27-9733-43d5-a935-1f70240aee0b\"}":{"__typename":"Education","uuid":"8400ca27-9733-43d5-a935-1f70240aee0b","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Statistics and Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"6141e331-ad91-465b-815c-2c5325af7a53\"}":{"__typename":"MentorPublicProfile","uuid":"6141e331-ad91-465b-815c-2c5325af7a53","displayName":"Andrea L.","slug":"andrea-loza","biography":"\u003cp\u003eHi! My name is Andrea, and I'm a student at Yale University, majoring in Statistics and Data Science with a minor in German.\u003c/p\u003e\u003cp\u003eI'm passionate about helping students navigate their academic journeys, whether it's mastering a new language, supporting them with STEM courses, tackling college applications, or building strong study habits.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was born in Germany and grew up in Bolivia, where my family is from, before going to high school in northern Virginia. Living across multiple countries is what developed my love for language and intercultural communication.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI can help students strengthen their math and data skills, from foundational concepts to more advanced topics. I also have experience helping students prepare for the AP Spanish Language and AP Spanish Literature exams. A fun fact: my email reply from my own AP exam is now used by the College Board as a sample for a perfect score of 5. I am also an interpreter and translator for the Yale Interpretation Network, teaching Spanish to K-12 students across all proficiency levels from A1 to C2.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also have experience with college admissions and application strategy, having been accepted to schools like Yale (with a likely letter), Stanford, Princeton, Cornell, Northwestern, and Duke. I enjoy guiding students in crafting applications that highlight their authentic selves.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, I mentor students in developing essential life skills like organization and habit-building. Whether it's creating a study schedule, organizing your notes, or learning new time management techniques, I can help you build the habits you need to thrive. Currently, I'm a Pedagogical Partner at the Yale Poorvu Center for Teaching and Learning, where I work directly with a professor through a semester-long partnership to enhance the student learning experience, giving me real insight into what makes learning stick.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I'm actively involved in multiple communities. At Yale's innovation center, Tsai CITY, I'm a fellow. I also serve as the Professional Events Coordinator for Latina Women at Yale (LWAY), organizing everything from professional photoshoots to networking events with Yale deans.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA mentoring session with me is a collaborative space where we'll set goals, work through challenges, and celebrate wins together. I look forward to working with you. Reach out with any questions! :)\u003c/p\u003e","teachingVideoPlaybackId":"afWZUIKMShuvps9EOMmmTidH7MQov02so6sJIrbbmPQM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"24d55dce-774f-41ad-a1b2-15353fb85f49\"}"}],"causesSupported":[],"major":"Statistics and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8550d291-cd06-405e-9112-5fa2b23a8a19\"}"},{"__ref":"DeepDives:{\"uuid\":\"e071cb23-d750-4c12-af67-a8c428789cf2\"}"},{"__ref":"DeepDives:{\"uuid\
