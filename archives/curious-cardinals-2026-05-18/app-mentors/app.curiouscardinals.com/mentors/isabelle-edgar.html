xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b86de86b-e875-4e22-a635-c5e505efb58d\"}":{"__typename":"Favorites","uuid":"b86de86b-e875-4e22-a635-c5e505efb58d","photoUrl":"https://ucarecdn.com/b1713f0c-e20b-4ca0-9809-20deb7487545/","title":"What the Living Do","type":"BOOK"},"Favorites:{\"uuid\":\"f8cd97b8-6473-425b-bccf-70ceadb32105\"}":{"__typename":"Favorites","uuid":"f8cd97b8-6473-425b-bccf-70ceadb32105","photoUrl":"https://ucarecdn.com/558d5a0c-5722-43f9-872f-edccf4219d65/","title":"School of Rock","type":"MOVIE"},"Favorites:{\"uuid\":\"bbc6b632-8e10-4429-aad6-cef21aa6e6c6\"}":{"__typename":"Favorites","uuid":"bbc6b632-8e10-4429-aad6-cef21aa6e6c6","photoUrl":"https://ucarecdn.com/952dc92e-6900-449f-8803-a37fea743ca5/","title":"Blue","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ca6fc208-7e57-487c-9408-b7dd6e4e3843\"}":{"__typename":"DeepDives","uuid":"ca6fc208-7e57-487c-9408-b7dd6e4e3843","content":"\u003cp\u003eI was (and am!) a soft spoken person. If I could go back and time and speak to my middle/high school self I would tell her that you absolutely do not have to be the loudest voice in the room in order to be a leader or to voice your opinion. I am inspired by quiet leaders and those who lead by example and try my best every day to remember and embody this. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5d30a4e3-0a8a-41d4-962c-436dcf5eb580\"}":{"__typename":"DeepDives","uuid":"5d30a4e3-0a8a-41d4-962c-436dcf5eb580","content":"\u003cp\u003eIn my spare time, I love spending time in nature. I go on backpacking trips with friends a lot and most recently hiked to these beautiful hot springs in Big Sur in California! Anytime there is an opportunity to swim in a river or the ocean, I am there (fun fact: I used to teach swim lessons at a beach in my hometown!) I also love gardening and learning about the native plants that grow in the area where I live. My favorite part of visiting home in the summer is making a whole meal only out of food from our garden! In addition to working at the farm in college, I also volunteered at a local food justice organization. I love any opportunity to be in community with others while engaging with the earth!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a03d8c42-42a4-40d1-a7da-a67b5459b3b6\"}":{"__typename":"DeepDives","uuid":"a03d8c42-42a4-40d1-a7da-a67b5459b3b6","content":"\u003cp\u003eSometimes it takes the care of another to see what you already have within you! I am so grateful for the mentors I have had along the way who helped and pushed me to achieve goals however big or small. Most importantly though, these mentors allowed me to see that I am capable myself and gave me confidence to take steps on my own. Some of my greatest experiences have been when I helped another person to feel this way. For many years I have worked as a teacher and choreographer for high school students. I love helping the students find their own artistry and individuality within the athleticism it takes to dance. It is so rewarding to see a student unlock a new understanding or overcome a challenge on their own. I believe mentorship is essential in opening up possibilities and allowing you to see and nurture what you already have in order to grow towards your goals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ec780e99-804e-46ca-8f37-87678bb229dd\"}":{"__typename":"DeepDives","uuid":"ec780e99-804e-46ca-8f37-87678bb229dd","content":"\u003cp\u003eMy grandmother was a children's book author and I grew up surrounded by stories! I wanted to follow in her footsteps and become a writer. I knew I wanted to be an English major when I heard this definition of poetry by W.H Auden \"Poetry might be defined as the clear expression of mixed feelings.\" I find the attempt to put language to a feeling or experience endlessly interesting. Humans are full of stories and stories are what connect us all. The English major allowed me to join a community of people who are value stories, craft, attention to detail and most importantly, nuance. I believe that the study of stories allows us to feel more connected to the world around us. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"e271b324-2bda-4f32-b44a-21e20b4c86e9\"}":{"__typename":"School","uuid":"e271b324-2bda-4f32-b44a-21e20b4c86e9","name":"Falmouth High School","city":"Falmouth","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02540"},"Education:{\"uuid\":\"d3cbe82b-458a-4e71-ad85-58715ed325e9\"}":{"__typename":"Education","uuid":"d3cbe82b-458a-4e71-ad85-58715ed325e9","school":{"__ref":"School:{\"uuid\":\"e271b324-2bda-4f32-b44a-21e20b4c86e9\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"c23fd8a9-3ff0-4455-9881-adee9ce41783\"}":{"__typename":"Education","uuid":"c23fd8a9-3ff0-4455-9881-adee9ce41783","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"ef555b28-567c-4ca6-8b36-b0f6b1436ac2\"}":{"__typename":"MentorPublicProfile","uuid":"ef555b28-567c-4ca6-8b36-b0f6b1436ac2","displayName":"Isabelle E.","slug":"isabelle-edgar","biography":"\u003cp\u003eIsabelle graduated Phi Beta Kappa from Stanford University in 2024. She studied English with a creative writing emphasis and loves writing — poetry, short stories, journalism and more! Her writing has been published in a number of nationally recognized journals! Isabelle grew up in a small town called Woods Hole, on Cape Cod in Massachusetts. It was interesting growing up in a tourist town because in the winter it empties out and is very quiet. Some of Isabelle’s favorite things about her home are the little ways that the natural world shows that the seasons are changing: the way the grapes on the path to the beach by her house start to smell fragrant in September, signaling the start of a school year, or the honeysuckle blossoms in spring or the way the cranberry bogs freeze over in winter allowing for ice skating.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIsabelle is a contemporary dancer. She trained in classical ballet and then moved to contemporary work when she got older. She took a gap year after high school and trained with a contemporary dance company in Chicago called Hubbard Street. During her time in Chicago, Isabelle also helped found an artist collective called Little Fire with some of her good friends. She is passionate about building community in arts spaces. She is currently working with a dance company in the Bay Area creating a new work premiering and touring in 2025! She is endlessly passionate about the arts and along with extensive experience in dance and writing,\u0026nbsp; has explored acting, music (guitar and singing), and photography (film and DSLR).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIsabelle graduated salutatorian a semester early from Falmouth High School. During her time in high school, Isabelle was a dance teacher, wellness mentor at the local elementary school and the Vice President of her school's chapter of National Honors Society. She spent her Junior year at the High Mountain Institute — an outdoor education high school in Colorado where she pursued her studies while on backpacking trips in the Rocky Mountains!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSome of Isabelle’s favorite and most influential parts of college were connected to one on one mentorship. She is still connected to her two closest writing mentors from college who pushed her to understand who she is as a writer. Isabelle is thrilled to have the opportunity to provide this mentorship to others — helping a student to see what story/gift they have to share. Outside of the classroom, Isabelle was a producer for a creative writing podcast through the Stanford Storytelling project, a desk editor for The Stanford Daily and Leland Quarterly and a cofounder of Stanford’s first contemporary concert dance group. Her favorite job in college was working at the O’Donahue Family Stanford Educational Farm where she was in charge of making flower bouquets! Isabelle is so excited to connect and share her passions with Curious Cardinals!\u003c/p\u003e","teachingVideoPlaybackId":"qBixc01WFqRWaz2hT2EH98g2AstCw02HWlcP6RC6Fr6zk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b86de86b-e875-4e22-a635-c5e505efb58d\"}"},{"__ref":"Favorites:{\"uuid\":\"f8cd97b8-6473-425b-bccf-70ceadb32105\"}"},{"__ref":"Favorites:{\"uuid\":\"bbc6b632-8e10-4429-aad6-cef21aa6e6c6\"}"}],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ca6fc208-7e57-487c-9408-b7dd6e4e3843\"}"},{"__ref":"DeepDives:{\"uuid\":\"5d30a4e3-0a8a-41d4-962c-436dcf5eb580\"}"},{"__ref":"DeepDives:{\"uuid\":\"a03d8c42-42a4-40d1-a7da-a67b5459b3b6\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec780e99-804e-46ca-8f37-87678bb229dd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d8404561-8671-4562-b4fe-0ff36fc5e840/-/preview/-/format/jpg/","https://ucarecdn.com/17bf28ff-1a17-4b46-9337-55a932114b7f/-/preview/-/format/jpg/","https://ucarecdn.com/b0d43764-7761-49f1-8a2b-0cd447728466/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d3cbe82b-458a-4e71-ad85-58715ed325e9\"}"},{"__ref":"Education:{\"uuid\":\"c23fd8a9-3ff0-4455-9881-adee9ce41783\"}"}],"hiredAt":"2024-09-10T09:13:16.227Z","topics":["Music","Visual Arts / Graphic Design","Video / Photography","Literature","Cooking","K-5 Grade Math","Reading","Executive Function","Academic Coaching","Writing","6-8 Grade Science","Film / Theater"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isabelle-edgar\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ef555b28-567c-4ca6-8b36-b0f6b1436ac2\"}"}}},"_sentryTraceData":"f00d1200070d45ae9fbaf7ce0b4d6cf3-9609a68a41bd675a-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f00d1200070d45ae9fbaf7ce0b4d6cf3,sentry-sample_
