xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0dca03ad-1759-411f-ad71-6431347e084d\"}":{"__typename":"Favorites","uuid":"0dca03ad-1759-411f-ad71-6431347e084d","photoUrl":"https://ucarecdn.com/9d2fa945-cc73-4d33-ab6e-092bcef6718b/","title":"Barcelona","type":"CITY"},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"178fcc44-eab4-4e49-aeb8-7b7e67a2cf34\"}":{"__typename":"DeepDives","uuid":"178fcc44-eab4-4e49-aeb8-7b7e67a2cf34","content":"\u003cp\u003eCuriosity has always been my companion. Nicknamed ‘Curious George’ by my mom at eleven, my innate curiosity led me to fall in love with the thought-provoking nature of learning. From challenging myself with math subjects beyond the confines of my grade level to always raising my hand in class, I learned to always wonder ‘why’ when faced with a problem.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"01131bcd-327f-4bf8-b20d-28fe80f0a1c3\"}":{"__typename":"DeepDives","uuid":"01131bcd-327f-4bf8-b20d-28fe80f0a1c3","content":"\u003cp\u003eBiomedical Computation captures my interest because of its interdisciplinary focus on biology and computer science. I am drawn to biology for the intricate and orderly mechanisms which make up life, and have always fascinated me. However, in an ever-changing world, I find it crucial to approach Biology through the lens of technological innovation and application, which I felt Biomedical Computation most comprehensively combined.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"19e70b91-12fd-4163-be11-36e806cc0e68\"}":{"__typename":"DeepDives","uuid":"19e70b91-12fd-4163-be11-36e806cc0e68","content":"\u003cp\u003eWhen I’m not tired, I like to grab a soccer ball and start juggling. I’ve been playing soccer since I was a kid, so it feels natural to pick up a ball and dribble around. I also enjoy cooking for family and friends, usually utilizing the eye while skipping the measurements, and making up recipes as I go.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f332595d-1198-46e8-bbe3-ae71127b5963\"}":{"__typename":"School","uuid":"f332595d-1198-46e8-bbe3-ae71127b5963","name":"Clayton Valley High School","city":"Concord","type":"HIGH","state":"California","country":"United States","zip":"94521"},"Education:{\"uuid\":\"dc1a9b5b-b97e-4f9e-b378-bb400d925e15\"}":{"__typename":"Education","uuid":"dc1a9b5b-b97e-4f9e-b378-bb400d925e15","school":{"__ref":"School:{\"uuid\":\"f332595d-1198-46e8-bbe3-ae71127b5963\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"56f37a6d-473e-4acc-9016-07f589578d5c\"}":{"__typename":"Education","uuid":"56f37a6d-473e-4acc-9016-07f589578d5c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Biomedical Computation","degree":null},"MentorPublicProfile:{\"uuid\":\"bdff07b7-1e8b-42a1-bab8-1723e3d65708\"}":{"__typename":"MentorPublicProfile","uuid":"bdff07b7-1e8b-42a1-bab8-1723e3d65708","displayName":"Naod A.","slug":"naod-araya","biography":"\u003cp\u003eHello! My name is Naod Araya, and I am currently a first-year Biomedical Computation major on the pre-med track at Stanford University. I’m from the Bay Area, and I am also a first-generation Eritrean.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlthough Biomedical Computation may seem niche, its interdisciplinary nature combines my passion for biology with the intellectually stimulating challenge of computer science, pushing me to tackle new problems at the intersection of these fields. In high school, I was a research intern at Lawrence Berkeley National Laboratory, where I had the opportunity to explore bioinformatics, igniting my interest in the field. At Stanford, I intend to continue engaging in academic research across various disciplines. While I love STEM, I have also developed a deep appreciation for writing and diving into random historical topics over the years. This innate curiosity has shaped my approach to tutoring, where I aim to not only help others grasp concepts but also inspire a broader perspective on learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship comes naturally to me, shaped by my diverse experiences. In high school, I founded and sustained a STEM organization called STEM4Kids, which provided free tutoring programs accessible to all children in the area. Outside of academics, I served as a coach for my local soccer team after playing for most of my life, mentoring kids aged 6-12 both on and off the field. These experiences taught me to mentor with empathy, understanding, and purpose. As a mentor for Curious Cardinals, I will bring this same mindset, working collaboratively with my mentees to break down concepts and support their growth.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, you’ll often find me playing soccer, spending time with friends, cooking, hiking, or capturing the beauty of nature through photography.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI especially wanted to be a mentor at Curious Cardinals because I believe in the power of guidance in creating hands-on, curiosity-driven learning environments. I’m excited to use my skills in mentorship and problem-solving to help you grow as a student.\u003c/p\u003e","teachingVideoPlaybackId":"O1dBYQiL8FmF9qhTWF9X5jiiwILQhj022EX3HLOydbRI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"0dca03ad-1759-411f-ad71-6431347e084d\"}"}],"causesSupported":[],"major":"Biomedical Computation","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"178fcc44-eab4-4e49-aeb8-7b7e67a2cf34\"}"},{"__ref":"DeepDives:{\"uuid\":\"01131bcd-327f-4bf8-b20d-28fe80f0a1c3\"}"},{"__ref":"DeepDives:{\"uuid\":\"19e70b91-12fd-4163-be11-36e806cc0e68\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d73637fe-684d-4e10-b49d-ac4ea6fabe80/-/preview/-/format/jpg/","https://ucarecdn.com/8f28d9f2-2dae-4d5f-b410-a3135ee8e40d/-/preview/-/format/jpg/","https://ucarecdn.com/a13cd586-6b52-46a3-99e4-5a91ed4bed33/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"dc1a9b5b-b97e-4f9e-b378-bb400d925e15\"}"},{"__ref":"Education:{\"uuid\":\"56f37a6d-473e-4acc-9016-07f589578d5c\"}"}],"hiredAt":"2024-12-11T07:26:57.982Z","topics":["Algebra I","Algebra II","Calculus","Biology","Writing","Academic Coaching","College Essay Writing","History"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUE
