xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2f523335-ba15-4e13-ba37-f543e5ed6568\"}":{"__typename":"DeepDives","uuid":"2f523335-ba15-4e13-ba37-f543e5ed6568","content":"\u003cp\u003eIn fifth grade, as I was getting involved with robotics and discovering a love for physics, my uncle, now a commercial airline pilot, flew his hand-built Van’s RV-9 to St. Louis. He took me up in the plane and, for a few seconds, handed me the stick. The sensitivity, the feeling of control, and the freedom were addictive.\u003c/p\u003e\u003cp\u003eEven then, I knew I wanted to pursue engineering. I wanted to work in a field that pushes humanity farther than it ever thought possible, one that breaks boundaries, connects people face-to-face, and lets us criss-cross the globe. Aerospace engineering felt niche, but that was part of the appeal. It shaped the way I think in systems, while still giving me room to explore everything from manufacturing and product strategy to M\u0026amp;A and finance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"3445ef65-5ba6-4225-8399-1a153e15ed68\"}":{"__typename":"DeepDives","uuid":"3445ef65-5ba6-4225-8399-1a153e15ed68","content":"\u003cp\u003eMy greatest mentor is a family friend I call Sukant uncle. Sukant Uncle isn't technically my uncle, but rather my father's close friend from work, who was essentially a part of our family. I always looked up to him, from his physique to his leadership abilities. One day he invited me on his weekly Saturday morning hike with my dad, and a new relationship was born.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter every hike at a local reservation, we would sit down with a cup of chai, talk about philosophy, life, and overall goals we have for ourselves. He gave me the mental strength and ambition to start running. Even though he moved away, every-time I run the trails they whisper lessons he's instilled in me. He would listen with a level of attention I couldn't even conjure, and still provide rich, authentic perspectives. He never lost his child-side, always playing games with us kids, and treating us as one of his own. That very ability, to listen, treat others with high regard, and to never lose that child side, is what I found so admirable about him.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHe taught me the value in truly challenging yourself and embarking on little adventures, and chasing goals everyday. We still plan our own adventures and most recently completed the Grand Canyon Rim2Rim trail-run.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSukant Uncle is a mentor I run with. A mentor I chatted with. A mentor that crafted me into who I am today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4b876fd8-80ab-44b1-ac2c-bccaed50c3e4\"}":{"__typename":"DeepDives","uuid":"4b876fd8-80ab-44b1-ac2c-bccaed50c3e4","content":"\u003cp\u003eI love reading, exploring new house-music sets, going on group cycling rides with friends, perfecting my espresso pull, weightlifting, and photographing the outdoors.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"fb7c2832-9ca2-4a28-b2f6-9a9e023bcc7d\"}":{"__typename":"DeepDives","uuid":"fb7c2832-9ca2-4a28-b2f6-9a9e023bcc7d","content":"\u003cp\u003eSeeing my ancestors and roots in my family’s village in Gujarat, India. Visiting and understanding where my family began, and how people live and work there today, grounds me. It gives me perspective and a deep sense of gratitude, and it pushes me to make the most of the opportunities I’ve been given.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also motivated by the idea captured in the phrase, \u003cem\u003e“so many books, so little time.”\u003c/em\u003e It reminds me that the only certainty in life is its finiteness, and that urgency should be met with intention. I want to live fully in the present while building something lasting, whether that’s a company, a product, or positive impact across people, as a testament to my presence for however long I’m on this Earth.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, looking up at the stars, or the Milky Way, if you’re lucky enough to be somewhere with low light pollution, fills me with wonder about what lies beyond. That sense of curiosity balances my connection to my roots: one keeps me grounded in where I come from, and the other pulls me forward into the unknown. Together, they motivate me to explore, to build, and to push boundaries while never losing sight of what matters.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"b4519943-7747-4939-b581-33c208b7493e\"}":{"__typename":"School","uuid":"b4519943-7747-4939-b581-33c208b7493e","name":"Marquette High School","city":"Chesterfield","type":"HIGH","state":"Missouri","country":"United States","zip":"63017"},"Education:{\"uuid\":\"8f3f1080-1d29-4edb-8ab0-7fae6764e65a\"}":{"__typename":"Education","uuid":"8f3f1080-1d29-4edb-8ab0-7fae6764e65a","school":{"__ref":"School:{\"uuid\":\"b4519943-7747-4939-b581-33c208b7493e\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"bd7064d9-773d-4e39-bcdd-286923515829\"}":{"__typename":"Education","uuid":"bd7064d9-773d-4e39-bcdd-286923515829","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Aerospace Engineering(Minor: Pre-Law)","degree":null},"MentorPublicProfile:{\"uuid\":\"5d63ae61-874c-4c91-abb1-af3bf49490b7\"}":{"__typename":"MentorPublicProfile","uuid":"5d63ae61-874c-4c91-abb1-af3bf49490b7","displayName":"Sid S.","slug":"sid-suratia","biography":"\u003cp\u003eHey, I’m Sid! I’m a senior studying Aerospace Engineering at Georgia Tech, with a minor in Law, Science \u0026amp; Technology. I was born in India and grew up in St. Louis, Missouri, surrounded by a big, close-knit family that I’m incredibly grateful for.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up, I was obsessed with robotics, physics, math, and mountain biking. That curiosity naturally led me to R/C airplanes, and, eventually, aerospace. Along the way, I also became fascinated by businesses: how they’re founded, how they grow, and how leaders tell compelling stories. I found my voice through public speaking and leadership, shaped heavily by over 13 years of Tae Kwon Do, earning my 3rd Degree Black Belt.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I loved building communities, helping grow my school’s Ultimate Frisbee team to the state level, competing nationally with a club team, and launching a teaching initiative with KEEN, a nonprofit where I taught youth with disabilities basic self-defense and Tae Kwon Do. Summers were a mix of learning and adventure: interning at a local aerospace manufacturer, joining a cross-country listening tour exploring rural economic disparities, and working as an outfitter at a ski and outdoor gear shop (where I learned a lot about gear but also people).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring COVID, I picked up running and photography, both of which stuck. I’ve run multiple half-marathons, trail-run across the Grand Canyon with a family friend, and fallen in love with photography as a way to slow down and see differently. My work has since been viewed over 17 million times, with more than 170,000 downloads.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, I pushed even further, researching hybrid-electric aircraft cost modeling, exploring Atlanta on runs, diving into electronic music, and training as a bikepacking instructor with Outdoor Recreation Georgia Tech. That led to a two-week, self-supported cycling expedition across rural Norway. I’ve also had the chance to represent the U.S. abroad through GE Aerospace in Poland and, in a surreal moment, won a life-changing Dr Pepper scholarship at the 2024 Big Ten Championship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve interned across manufacturing, aerospace startups, and aerospace \u0026amp; defense strategy consulting. Now, I lead Georgia Tech AE Ambassadors,\u0026nbsp; guiding prospective students, staying involved on campus, have gotten into cycling and weight-lifting, and I’m headed to Denver to join Boom Supersonic as a Commercial Analyst.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m excited to keep exploring the outdoors, on foot or bike, meeting new people, and helping make the world more dramatically accessible.\u003c/p\u003e","teachingVideoPlaybackId":"hneUOUtM9144DQ02aiy1WPQoacIyPpGMluR1Pk2kmivo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Aerospace Engineering(Minor: Pre-Law)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2f523335-ba15-4e13-ba37-f543e5ed6568\"}"},{"__ref":"DeepDives:{\"uuid\":\"3445ef65-5ba6-4225-8399-1a153e15ed68\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b876fd8-80ab-44b1-ac2c-bccaed50c3e4\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb7c2832-9ca2-4a28-b2f6-9a9e023bcc7d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/816989c5-eb6e-4da8-9ee2-b49c9055d809/-/preview/-/format/jpg/","https://ucarecdn.com/847d05e0-d12e-4a28-bb6d-3d8582cecaea/-/preview/-/format/jpg/","https://ucarecdn.com/0387ae87-ba57-4322-84e8-6079906c4ad6/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8f3f1080-1d29-4edb-8ab0-7fae6764e65a\"}"},{"__ref":"Education:{\"uuid\":\"bd7064d9-773d-4e39-bcdd-286923515829\"}"}],"hiredAt":"2026-01-21T19:37:39.920Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Physics","Writing","Academic Coaching","College Essay Writing","Economics","Executive Function","Creative Writing","Video / Photography","Business / Entrepreneurship","Aviation / Aerospace","STEM Project","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/113d5871-8410-43cf-8c06-3005496319c6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sid-suratia\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5d63ae61-874c-4c91-abb1-af3bf49490b7\"}"}}},"_sentryTraceData":"d
