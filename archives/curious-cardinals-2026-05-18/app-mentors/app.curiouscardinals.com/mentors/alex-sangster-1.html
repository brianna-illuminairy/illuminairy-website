xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8857328b-2d33-443a-9851-634e17aeeef3\"}":{"__typename":"DeepDives","uuid":"8857328b-2d33-443a-9851-634e17aeeef3","content":"\u003cp\u003ePretty early on I knew that I wanted to do something in STEM, and more specifically engineering because I absolutely cannot stand the sight of blood. Going into my freshman year of high school, I joined this summer program that offered 2 week classes in various college subjects. What the total shocker was that there was only one engineering class, Materials Science. What I soon learned was that materials science is a mix between chemistry and physics and can be applied to almost all types of engineering. One of the last classes of this course was focused on real life applications, specifically failures. Something that I feel very strongly about when choosing your major is seeing the real life applications of how your major can be used outside of studying. This specific lesson was talking about the Challenger explosion and how it all came down to an o ring at the wrong operating temperature. I was hooked after that. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f6b78e90-078a-47d7-9d5e-39d376ec8e2d\"}":{"__typename":"DeepDives","uuid":"f6b78e90-078a-47d7-9d5e-39d376ec8e2d","content":"\u003cp\u003eOne piece of advice that I'd give to my younger self is to not be afraid to try new things and to ask for help.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you don't try new things, how can you grow as a person? Putting yourself in uncomfortable positions is how you can learn more about your present self and can also help you learn how you want to be in the future. I used to be an introvert with a capital I. But then I put myself out in more social situations and decided that I like interacting with people, and became an extrovert. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlso, coming from an Asian household, it was very difficult learning how to ask for help. Whether it is from friends, teachers, or mentors. What I've learned from this is that growth can be challenging, but there are people around you who can make the transition less painful. To put it simply... no pain, no gain, but Advil doesn't hurt. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"fc4688eb-c231-4837-80e3-6be8403c9eb2\"}":{"__typename":"DeepDives","uuid":"fc4688eb-c231-4837-80e3-6be8403c9eb2","content":"\u003cp\u003eMy greatest source of motivation in mentoring is my little sister. I struggled a lot discovering who I was in high school, socially and academically. And my goal is to help my sister become a strong, confident, brilliant woman who knows what she wants and how to get there. At first, it was just her, but then this motivation slowly grew to all of my younger friends, and then my mentees. I truly want to see everyone succeed and be their happiest selves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"4a9a0c71-1351-47c1-86c5-fa17d0448f09\"}":{"__typename":"DeepDives","uuid":"4a9a0c71-1351-47c1-86c5-fa17d0448f09","content":"\u003cp\u003eDuring most of my high school summers, I was involved in some sort of research. I was first working with prosthetics at UC Berkeley doing at much in person stuff as I could given the pandemic. I then transitioned to being fully in person at lab at UCLA woking on batteries.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond research, I've held almost every job under the sun: boba shop, retail, concert venue (and technically not high school but also mechanic).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}":{"__typename":"School","uuid":"693ea7b8-def0-456d-88a4-4055bd090a62","name":"Marlborough School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90004"},"Education:{\"uuid\":\"f06857e5-875b-4650-8a7b-a4c57854f108\"}":{"__typename":"Education","uuid":"f06857e5-875b-4650-8a7b-a4c57854f108","school":{"__ref":"School:{\"uuid\":\"693ea7b8-def0-456d-88a4-4055bd090a62\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"c78f7bed-7886-4939-8782-b8f7555b7fa2\"}":{"__typename":"Education","uuid":"c78f7bed-7886-4939-8782-b8f7555b7fa2","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Materials Science and Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"4577db7f-6462-4b91-84c3-d6066056c7fc\"}":{"__typename":"MentorPublicProfile","uuid":"4577db7f-6462-4b91-84c3-d6066056c7fc","displayName":"Alex S.","slug":"alex-sangster-1","biography":"\u003cp\u003eHello! My name is Alex and I'm an Asian American girl studying Materials Science and Business at Northwestern University. I was born and raised in Los Angeles but finally experienced my first true winter in Chicago (brrr).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eComing from an all girls high school taught me to be very confident and vocal when I'm passionate about something, and this absolutely includes academics. One of my goals is to help introduce engineering to younger students to help them learn about how diverse and how many different pathways there are. Did you know, there were only 5 people who committed to engineering subjects from my high school? I've already started this huge task through a club based at Marlborough school but available to the general Los Angeles community called SWENext.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of this club, I have tons of experience working with younger kids. I was a tutor through my high school for grades 7-12. Beyond academics, I was a student instructor for all sorts of mixed martial arts for about 4 years.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI would say that I have two loves. The first is music... more like listening to music. I thought that I'd have some sort of career in the music business when I was a kid until I learned that I have absolutely no talent for instruments and that I'm totally tune deaf. My second love is car racing. I think it is such a beautiful blend between peak human athletic performance and peak technological advancement. I'll cut myself off here otherwise I will not shut up about racing :)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy mission as a mentor is to make learning enjoyable for my mentees. I know that everyone has different learning styles and I want to cater to each and every child to make sure that they are not only learning from our sessions, but also creating positive memories to associate with learning and growth.\u003c/p\u003e","teachingVideoPlaybackId":"vTp6qUsO1PGZTdSi028nwPoLt3LbgonmSXeufNh8Q1Ik","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Materials Science and Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8857328b-2d33-443a-9851-634e17aeeef3\"}"},{"__ref":"DeepDives:{\"uuid\":\"f6b78e90-078a-47d7-9d5e-39d376ec8e2d\"}"},{"__ref":"DeepDives:{\"uuid\":\"fc4688eb-c231-4837-80e3-6be8403c9eb2\"}"},{"__ref":"DeepDives:{\"uuid\":\"4a9a0c71-1351-47c1-86c5-fa17d0448f09\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/178a2e5a-5e45-430a-867a-9a005e1007b3/-/preview/-/format/jpg/","https://ucarecdn.com/7dc10d62-9876-498f-bda0-266754779530/-/preview/-/format/jpg/","https://ucarecdn.com/14bc513b-cc34-4d01-9f6f-ca02819a8d49/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f06857e5-875b-4650-8a7b-a4c57854f108\"}"},{"__ref":"Education:{\"uuid\":\"c78f7bed-7886-4939-8782-b8f7555b7fa2\"}"}],"hiredAt":"2024-08-07T10:30:59.883Z","topics":[],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alex-sangster-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4577db7f-6462-4b91-84c3-d6066056c7fc\"}"}}},"_sentryTraceData":"169ba3a2640a46c79b13ac226070a054-9f2910872ed20b17-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=169ba3a2640a46c
