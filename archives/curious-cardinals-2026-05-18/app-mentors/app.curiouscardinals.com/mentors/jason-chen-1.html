xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b27e4871-beae-4921-806d-5766e7065488\"}":{"__typename":"DeepDives","uuid":"b27e4871-beae-4921-806d-5766e7065488","content":"\u003cp\u003eMy dream job is to create my own tech startup. I always thought that my dream job would be to go into big tech/quant and make a lot of money, but then I realized that trying to solve problems I found meaningful was infinitely more satisfying. I'd rather work on a project I love for 12 hours than work on something I don't like for 30 minutes. When I did my science research project, I spent 300 hours total from start to finish and had a blast creating the application and writing the paper. Creating a startup would allow me to work on solutions I found meaningful, and that's something I look forward to. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"1a1eb868-c143-410e-a180-8fadb534d691\"}":{"__typename":"DeepDives","uuid":"1a1eb868-c143-410e-a180-8fadb534d691","content":"\u003cp\u003eOne of the things I’m most proud of is starting a successful summer class during my junior year of high school. As a middle schooler, I had enrolled in a MathCounts course taught by two high school students who made learning incredibly fun and engaging. Their energy and teaching style inspired me to push myself in MathCounts and planted the seed for what I’d do years later.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFast forward four years—right after public libraries reopened for room bookings post-COVID—I had a sudden thought: \u003cem\u003e“I can do that.”\u003c/em\u003e At first, I was skeptical. I had never organized something like this on my own before, so I was unsure about the logistics and whether anyone would even sign up.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBut after creating the curriculum and reaching out to parents, I was able to run a two-week CS class with 10 students. By the end, my students were able to solve basic LeetCode problems, which made me incredibly proud.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe whole experience gave me so much joy—and the confidence that I could not only break down complex concepts, but also organize and lead something impactful from the ground up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"24262303-b055-493e-a18c-7dc905bb2ec2\"}":{"__typename":"DeepDives","uuid":"24262303-b055-493e-a18c-7dc905bb2ec2","content":"\u003cp\u003eMy greatest source of motivation is my potential. I have FOMO (fear of missing out) that I won't be able to do everything I want to do because I didn't work hard enough. I'm afraid of looking back when I'm older and regretting not taking risks or working for what i'm passionate about. My belief that if I work hard enough, I can achieve anything I want drives me to push myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6dc4e660-a081-419e-88c1-05cbc47b700a\"}":{"__typename":"DeepDives","uuid":"6dc4e660-a081-419e-88c1-05cbc47b700a","content":"\u003cp\u003e2021 (sophomore): It was COVID, so I took an online Machine Learning course, took a Georgia Tech Industrial Design Course (foreshadowing my future haha), prepped for the SAT, biked around the reservoir I lived by, and hooped with my friends.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e2022 (junior): I hosted my 2 week summer camp, competed at the national debate tournament for USX, built the first version of my notes website, started my tutoring business, and completed a Natural Language Processing course at Columbia. The biggest thing I gained from this summer was living in NYC for Columbia's summer program. This was the first time I got to experience true city life, and it opened my eyes to a lot of differences in lifestyle.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e2023 (senior): I went to a lot of grad parties, volunteered for Steel City Codes summer camp, and visited my grandparents in China for the first time in four years. It was a pretty fun summer before college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"245beacc-ee3a-493d-b877-1d01e540d195\"}":{"__typename":"School","uuid":"245beacc-ee3a-493d-b877-1d01e540d195","name":"Cherry Creek High School","city":"Greenwood Village","type":"HIGH","state":"Colorado","country":"United States","zip":"80111"},"Education:{\"uuid\":\"a1efd35e-3281-496e-9e65-fbbfac7e37b0\"}":{"__typename":"Education","uuid":"a1efd35e-3281-496e-9e65-fbbfac7e37b0","school":{"__ref":"School:{\"uuid\":\"245beacc-ee3a-493d-b877-1d01e540d195\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"60ad88cb-1edc-4a6f-ad3d-750726102c24\"}":{"__typename":"Education","uuid":"60ad88cb-1edc-4a6f-ad3d-750726102c24","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"0977a558-30d9-4538-a6f1-99a13640838f\"}":{"__typename":"MentorPublicProfile","uuid":"0977a558-30d9-4538-a6f1-99a13640838f","displayName":"Jason C.","slug":"jason-chen-1","biography":"\u003cp\u003eHi! I'm Jason, and I'm currently a junior studying CS at Georgia Tech. I'm particularly interested in AI and the entrepreneurial possibilities that CS provides, as I love solving problems with technology.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was born in Ohio and moved to Colorado in first grade. I’ve always been interested in teaching and STEM. In middle school, I was really into Mathcounts and basketball. Back then, like many other middle schoolers, my dream was to make the NBA. Unfortunately, that didn’t seem feasible after I got cut from the freshman team, so I pivoted toward CS in high school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I completed my first major AI/ML project by trying to detect political bias in news headlines for an independent research project. I also started teaching weekly, set up my own curriculum, and ran a tutoring service that operated during the summer and throughout my senior year. On top of that, I was a part of Speech and Debate and participated in the national level tournament twice. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy first experience with building a successful online platform was during senior year when I created an online notes website using WordPress that gained thousands of users first semester after its launch. Even though I didn’t have strong technical CS skills at the time, that experience gave me the confidence that I could create useful applications.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, I’ve been working on sharpening my web development skills through personal projects and internships. Last year, I interned as a software developer at a company called Otek, and this year, I’ll be interning at Amazon in Boston.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of tech, you’ll find me playing basketball, reading at coffee shops, exploring hiking trails, or searching for great new food. I also love traveling (I recently studied abroad in France), and I hope to visit Japan in the near future.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI signed up for Curious Cardinals because I want to get back into teaching. Teaching has always been something I enjoyed because it feels great knowing others can benefit from my knowledge. I haven’t officially mentored or tutored since senior year of high school, but I’m excited to return to it now that I’m more knowledgeable.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"6PNMx6kRzbkjpIn3f3cveZOIpB00Bfe3w00MscYWDJ0002s","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b27e4871-beae-4921-806d-5766e7065488\"}"},{"__ref":"DeepDives:{\"uuid\":\"1a1eb868-c143-410e-a180-8fadb534d691\"}"},{"__ref":"DeepDives:{\"uuid\":\"24262303-b055-493e-a18c-7dc905bb2ec2\"}"},{"__ref":"DeepDives:{\"uuid\":\"6dc4e660-a081-419e-88c1-05cbc47b700a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3a25ccf3-26c9-4953-9314-ae4d517a78b8/-/preview/-/format/jpg/","https://ucarecdn.com/21dc4225-3d16-444e-80f1-fd78909578be/-/preview/-/format/jpg/","https://ucarecdn.com/23d00038-1c43-4780-a688-24cf72ee29ab/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a1efd35e-3281-496e-9e65-fbbfac7e37b0\"}"},{"__ref":"Education:{\"uuid\":\"60ad88cb-1edc-4a6f-ad3d-750726102c24\"}"}],"hiredAt":"2025-04-09T10:48:29.512Z","topics":["Computer Science","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Machine Learning / AI","Web Design","Public Speaking"],"communityBadges":["https://ucarecdn.com/113d5871-8410-43cf-8c06-3005496319c6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jason-chen-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0977a558-30d9-4538-a6f1-99a13640838f\"}"}}},"_sentryTraceData":"8769cad99cbd4b4e91238e5ff4b1c799-b86d38b47a440f31-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8769cad99cbd4b4e91238e5ff4b1c799,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jason-chen-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
