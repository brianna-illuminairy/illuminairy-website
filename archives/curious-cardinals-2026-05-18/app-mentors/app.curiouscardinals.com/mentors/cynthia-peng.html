xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"118cc2ab-95d7-43fc-aa23-e67a494f059a\"}":{"__typename":"Favorites","uuid":"118cc2ab-95d7-43fc-aa23-e67a494f059a","photoUrl":"https://ucarecdn.com/07a69b67-78bb-4420-b5d4-8e39dcd02fcf/","title":"San Francisco","type":"CITY"},"Favorites:{\"uuid\":\"e923ee56-97e9-4734-8540-fe9287b335c5\"}":{"__typename":"Favorites","uuid":"e923ee56-97e9-4734-8540-fe9287b335c5","photoUrl":"https://ucarecdn.com/ef177e11-1f57-45c5-82d9-a0f6e05b630f/","title":"Come From Away","type":"PLAY"},"Favorites:{\"uuid\":\"dd61a4a7-c582-4c86-a8c8-a61fc55976fa\"}":{"__typename":"Favorites","uuid":"dd61a4a7-c582-4c86-a8c8-a61fc55976fa","photoUrl":"https://ucarecdn.com/494594e4-b7a0-4c98-8899-a4527fc6ccdf/","title":"Golf","type":"SPORT"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"303b0afa-c87a-41fc-b324-820134f82c0e\"}":{"__typename":"DeepDives","uuid":"303b0afa-c87a-41fc-b324-820134f82c0e","content":"\u003cp\u003eI owe my becoming to the mentors I could seek guidance from -- artists, academics, entrepreneurs who I encountered through my journey. I want to pass it forward to the younger generation, especially those interested in being an Artist (not limited to Visual Arts).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a175cfbe-4b1b-4d8f-9615-e635faf65a57\"}":{"__typename":"DeepDives","uuid":"a175cfbe-4b1b-4d8f-9615-e635faf65a57","content":"\u003cp\u003ean artist and scientist - let me explain. With empirical methods and training in clinical psychology, I hope to work with adults exploring the power of the mind. With an artist at heart, I hope to take those stories and share as writings and paintings to allow those stories enter the public discourse.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ab75518d-bd21-41f8-9afc-751dc46afad0\"}":{"__typename":"DeepDives","uuid":"ab75518d-bd21-41f8-9afc-751dc46afad0","content":"\u003cp\u003eYou do not need to prove anyone of your worth. You bring light and creativity in the world just by existing. Follow your heart and curiosity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"60f32b23-15dd-479f-8f89-21a9908cbaad\"}":{"__typename":"DeepDives","uuid":"60f32b23-15dd-479f-8f89-21a9908cbaad","content":"\u003cp\u003ereading, writing, painting, cooking, and going to the forest.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"f11685e2-48f8-47cb-b6e6-845b0d6f938f\"}":{"__typename":"School","uuid":"f11685e2-48f8-47cb-b6e6-845b0d6f938f","name":"Meadowridge School","city":"Maple Ridge","type":"HIGH","state":"British Columbia","country":"Canada","zip":"V4R 1N1"},"Education:{\"uuid\":\"91e35d30-bfe0-42eb-8e64-b4b363402d9a\"}":{"__typename":"Education","uuid":"91e35d30-bfe0-42eb-8e64-b4b363402d9a","school":{"__ref":"School:{\"uuid\":\"f11685e2-48f8-47cb-b6e6-845b0d6f938f\"}"},"startYear":"2013","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}":{"__typename":"School","uuid":"0a298df6-dac8-4a1d-8e35-77e7b609185d","name":"Minerva University","city":"San Francisco","type":"COLLEGE","state":"California","country":"United States","zip":"94103"},"Education:{\"uuid\":\"302a098c-674d-4156-9133-b197201d87a8\"}":{"__typename":"Education","uuid":"302a098c-674d-4156-9133-b197201d87a8","school":{"__ref":"School:{\"uuid\":\"0a298df6-dac8-4a1d-8e35-77e7b609185d\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"6c545cd7-de47-4e6a-9a66-940c67b62441\"}":{"__typename":"MentorPublicProfile","uuid":"6c545cd7-de47-4e6a-9a66-940c67b62441","displayName":"Cynthia P.","slug":"cynthia-peng","biography":"\u003cp\u003eCynthia graduated with a B.S. in Psychology from Minerva University, where she had the privilege to travel and learn around the world in seven different countries on four continents. Cynthia’s graduation project was a creative non-fiction centered on a snack she found in Japan, Korean, and Taiwan – which motivated her to continue writing in larger scopes. Currently, she is based in Canada, working on her debut novel inspired by her mother's immigrant story. In the past, she has worked with social impact startups and conducted Global Health research. Before Minerva University, she was at Emory University studying Global Health and Chemistry.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCynthia is passionate about education across age groups and contexts. She has taught Social Psychology as a Course Assistant at the College Level, Mathematics at the High School Level, Robotics at the Elementary School Level, and Outdoor Education at the pre-school Level. She owes her development to her education and carries the responsibility of passing it forward by serving as a guide to learners' vast curiosities. She aspires to master the craft of asking the right questions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCynthia loves to spend alone time reading, writing, painting, cooking, and forest bathing. Besides, she loves spending quality time with loved ones, nerding out on shared interests, such as food.\u003cbr\u003e\u003cbr\u003eCynthia believes that the most important thing to learn in today's age is understanding oneself at the bodily, conscious, and subconscious levels. She is eager to connect with students who are curious to learn more about the complexities of the human mind, behaviors, and, in turn, generate a sense of self-awareness that equips them to become compassionate and kind humans, writers, artists, and future leaders.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eExamples of projects I can guide you with:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eA Collection of Short Stories inspired by your family recipes\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStarting a Substack/Newsletter\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding your Portfolio of reports for journalism\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWriting a Novel\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat I can help with in a session:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eHelping you gain clarity over what you can do to overcome procrastination on your creative projects (with the right questions and tools)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSharing habits and strategies that combat the inner critics that discourage the artist self\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSetting up accountability systems (beyond the mentorship) to set you up for success as a lifelong artist\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eIf you are working on a creative project, want to geek out on the unfathomable things about the human experience (with a social sciences lens), shares good humor from everyday stories (no dad jokes from me unfortunately), or are deeply curious about different cultures and places, I look forward to learning with you.\u003c/p\u003e","teachingVideoPlaybackId":"2YlnmZLPBxIq6C8L00JhDED9oPyIL2Tg01nvK4bcdltkQ","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"118cc2ab-95d7-43fc-aa23-e67a494f059a\"}"},{"__ref":"Favorites:{\"uuid\":\"e923ee56-97e9-4734-8540-fe9287b335c5\"}"},{"__ref":"Favorites:{\"uuid\":\"dd61a4a7-c582-4c86-a8c8-a61fc55976fa\"}"}],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"303b0afa-c87a-41fc-b324-820134f82c0e\"}"},{"__ref":"DeepDives:{\"uuid\":\"a175cfbe-4b1b-4d8f-9615-e635faf65a57\"}"},{"__ref":"DeepDives:{\"uuid\":\"ab75518d-bd21-41f8-9afc-751dc46afad0\"}"},{"__ref":"DeepDives:{\"uuid\":\"60f32b23-15dd-479f-8f89-21a9908cbaad\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4e767e4d-a40a-43e5-a35a-5e2b6848f810/-/preview/-/format/jpg/","https://ucarecdn.com/271733fb-cc80-471f-853b-9a419403c381/-/preview/-/format/jpg/","https://ucarecdn.com/2f2826cd-bbdb-4cb9-a564-f2e06ad98253/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"91e35d30-bfe0-42eb-8e64-b4b363402d9a\"}"},{"__ref":"Education:{\"uuid\":\"302a098c-674d-4156-9133-b197201d87a8\"}"}],"hiredAt":"2025-09-16T19:40:36.740Z","topics":["Creative Writing","Visual Arts / Graphic Design","K-6 Storybook","Sustainability"],"communityBadges":["https://ucarecdn.com/f5ae8359-9f55-41d8-a96b-8f3dc3ad05db/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[
