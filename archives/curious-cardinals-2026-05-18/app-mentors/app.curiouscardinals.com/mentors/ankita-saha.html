xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d0c9ec33-3356-465f-917b-609f1a92525a\"}":{"__typename":"DeepDives","uuid":"d0c9ec33-3356-465f-917b-609f1a92525a","content":"\u003cp\u003eProduct Manager\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"e740bd23-4886-45e0-b280-b187cf0dda93\"}":{"__typename":"School","uuid":"e740bd23-4886-45e0-b280-b187cf0dda93","name":"Stuyvesant High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10282"},"Education:{\"uuid\":\"11f4bd0e-9061-4b05-8200-4cbdceb1f6a0\"}":{"__typename":"Education","uuid":"11f4bd0e-9061-4b05-8200-4cbdceb1f6a0","school":{"__ref":"School:{\"uuid\":\"e740bd23-4886-45e0-b280-b187cf0dda93\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"72ad48c5-e5fd-4702-86cc-ef32affba7f2\"}":{"__typename":"Education","uuid":"72ad48c5-e5fd-4702-86cc-ef32affba7f2","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"4fa89738-a400-4e0d-80ed-bcd0e1ccdb3f\"}":{"__typename":"MentorPublicProfile","uuid":"4fa89738-a400-4e0d-80ed-bcd0e1ccdb3f","displayName":"Ankita S.","slug":"ankita-saha","biography":"\u003cp\u003eMy name is Ankita, and I’m a freshman at Columbia SEAS studying computer science and applied mathematics. I’m originally from Queens, New York, and I’ve always been drawn to opportunities that combine analytical thinking with creativity and collaboration. I’m particularly interested in how technology can be used to uncover patterns in complex systems, especially in areas like markets and media.\u003c/p\u003e\u003cp\u003eAt BAM, I worked on a project focused on analyzing the relevancy of tweets over time and identifying which topics were most popular. The objective was to understand how conversations evolved and whether shifts in sentiment or topic concentration could reveal broader trends. I built charts and comparative visualizations to track engagement, frequency, and thematic changes across time periods. A significant portion of the work involved using prompt engineering techniques to measure similarity between tweets and categorize them using vector embeddings. I also incorporated sentiment analysis to better understand tone and polarity within discussions.\u003c/p\u003e\u003cp\u003eThis project required me to learn several new Python libraries and tools that I hadn’t previously used. Rather than simply applying predefined methods, I had to experiment with different similarity thresholds, refine prompts, and think critically about how to structure the data to produce meaningful outputs. It pushed me beyond just coding—forcing me to think about methodology, interpretation, and the reliability of results.\u003c/p\u003e\u003cp\u003eFrom the experience, I drew two key conclusions. First, I saw how indirect data sources like social media can offer valuable insight into markets when analyzed thoughtfully. While a tweet alone may seem insignificant, aggregated patterns can reflect shifts in public perception that may precede broader movements. Second, I learned the importance of balancing independence with collaboration. I made a conscious effort to problem-solve on my own and deepen my technical understanding, but I also learned when seeking feedback could prevent inefficiencies and strengthen the final product.\u003c/p\u003e\u003cp\u003eOutside of BAM, I’m involved in product management at The Columbia Daily Spectator, serve on the curriculum committee for Girls Who Code, and work as an engineering school tour guide. These roles have strengthened my ability to communicate technical concepts clearly, collaborate across teams, and think strategically about building impactful solutions—skills I’m excited to continue developing in future opportunities.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"Ofbxy9FjAhTEQwNxvRTXg01rDggtWAUC4a00ZyScxm6nc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d0c9ec33-3356-465f-917b-609f1a92525a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/eaede993-4957-4361-ade8-d68286a2df60/-/preview/-/format/jpg/","https://ucarecdn.com/23f633fd-fec7-42f2-a3b1-838828f736bb/-/preview/-/format/jpg/","https://ucarecdn.com/730fb4b9-3a87-4422-8994-246a0d057f6f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"11f4bd0e-9061-4b05-8200-4cbdceb1f6a0\"}"},{"__ref":"Education:{\"uuid\":\"72ad48c5-e5fd-4702-86cc-ef32affba7f2\"}"}],"hiredAt":"2026-02-18T18:31:52.383Z","topics":["K-6 Storybook","Fashion / Cosmetics","Creative Writing","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Web Design","STEM Project","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ankita-saha\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4fa89738-a400-4e0d-80ed-bcd0e1ccdb3f\"}
