xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"68cfeea2-2659-456f-a909-a60dc59e57c7\"}":{"__typename":"Favorites","uuid":"68cfeea2-2659-456f-a909-a60dc59e57c7","photoUrl":"https://ucarecdn.com/b648b6b3-b70e-43cb-9ba1-3a1729baabf1/","title":"The Picture of Dorian Gray by Oscar Wilde","type":"BOOK"},"Favorites:{\"uuid\":\"53142130-e365-43e9-b64f-067d394f443a\"}":{"__typename":"Favorites","uuid":"53142130-e365-43e9-b64f-067d394f443a","photoUrl":"https://ucarecdn.com/8568297c-fde0-44c8-b2eb-159874ae871e/","title":"Interstellar","type":"MOVIE"},"Favorites:{\"uuid\":\"484413c4-05c3-4441-9d86-bc06da189686\"}":{"__typename":"Favorites","uuid":"484413c4-05c3-4441-9d86-bc06da189686","photoUrl":"https://ucarecdn.com/a5f8665f-efb0-44e7-9804-c49e8c1bc6e4/","title":"Timothée Chalamet","type":"ACTOR"},"CausesSupported:{\"uuid\":\"5fbd54d2-22e5-41ad-b2ca-c56dc21ffb96\"}":{"__typename":"CausesSupported","uuid":"5fbd54d2-22e5-41ad-b2ca-c56dc21ffb96","name":"Jane Goodall Institute","description":"\u003cp\u003eI am a Chimp Guardian!!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/a9f25f71-2ecd-4638-84a2-4d25a2f00aa3/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"312e5cd2-4e2f-46ad-a599-b372b8d58f2f\"}":{"__typename":"DeepDives","uuid":"312e5cd2-4e2f-46ad-a599-b372b8d58f2f","content":"\u003cp\u003eDon't be so hard on yourself. Entering your teenage years is scary and it sometimes can feel like the world is crashing down on you with so many expectations. Turn off the noise and listen to yourself. What do you love to do? What topic or area of study excites you? What do you want to explore? Our purpose in life is much greater than we could ever imagine and the world is your oyster. Go beyond yourself rather than beyond others. This is YOUR journey. Take the pressure off. You are doing amazing and it only takes one time for something to work out. Celebrate your failures and learn to love the lessons that come out of them. :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"81a4458e-a914-4d16-b3dd-8299a3a92035\"}":{"__typename":"DeepDives","uuid":"81a4458e-a914-4d16-b3dd-8299a3a92035","content":"\u003cp\u003eI got to college thinking I had to become a computer scientist. I had spent years in high school filling my schedule with extracurriculars that demonstrated only one of my interests I thought would get me into a good school. By the end of my freshman year at Cornell, my classes did not excite me anymore. I felt like I was leaving behind my passion for conservation, animals, and sustainability, but I was so consumed by the words of others telling me things like job security, prestige, and practicality that I ignored my own interests.\u003c/p\u003e\u003cp\u003eIt took a lot of reflection, but I eventually realized that I didn't have to choose between passion and practicality. I shifted my focus to an interdisciplinary approach and created my own major, combining economics, business, and information science to explore how financial tools and technology can drive sustainability and conservation efforts. It was the best decision I have ever made. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c3005070-d955-4732-b0f7-80bfac6d8bb2\"}":{"__typename":"DeepDives","uuid":"c3005070-d955-4732-b0f7-80bfac6d8bb2","content":"\u003cp\u003eI believe that knowledge is a transformative force, capable of reshaping lives and opening new opportunities. One of the most valuable aspects of my own journey has been the ability to learn from my failures and use those lessons to guide others. Mentorship allows me to equip students with the critical thinking skills and strategies they need to succeed, fostering independence and confidence in their own abilities.\u003c/p\u003e\u003cp\u003eWhat brings me the greatest fulfillment is witnessing students take ownership of their learning, continuously building on the foundational tools they have acquired. Mentorship is not about offering answers but about helping individuals discover their own pathways to success. It is about creating a supportive environment where students feel confident enough to take risks, challenge their own assumptions, and refine their interests. I strive to cultivate a space where curiosity is encouraged and failures are seen as stepping stones rather than setbacks. By instilling this mindset, I hope to not only guide students in their academic and professional pursuits but also inspire them to become mentors for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5c00a845-77ff-4f70-b3b7-397e48f404a9\"}":{"__typename":"DeepDives","uuid":"5c00a845-77ff-4f70-b3b7-397e48f404a9","content":"\u003cp\u003eIn my spare time, I immerse myself in activities that inspire curiosity, creativity, and a sense of connection with the world around me. I love reading classic novels, drawn to their timeless themes and deep explorations of human nature. My fascination with the universe and our place in it keeps me constantly learning—whether through books, documentaries, or conversations that challenge my perspective.\u003c/p\u003e\u003cp\u003eWhen I’m home, I often find myself curled up with a book, reading alongside my cat (pictured above!). I also love trying new things, whether it's traveling to new places, picking up new skills, or taking on challenges that push me outside my comfort zone. Skiing, for example, was terrifying at first, but once I overcame the initial fear, it felt freeing. Cooking has also been a passion of mine since I was nine years old. I love mastering different cuisines, and sharing meals with loved ones. I especially love being in nature and spending time with family and friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"b4937850-2903-4616-8745-01900ed913bf\"}":{"__typename":"School","uuid":"b4937850-2903-4616-8745-01900ed913bf","name":"Byram Hills High School","city":"Armonk","type":"HIGH","state":"New York","country":"United States","zip":"10504"},"Education:{\"uuid\":\"d822c2c4-0288-464b-8879-b04b2a38270a\"}":{"__typename":"Education","uuid":"d822c2c4-0288-464b-8879-b04b2a38270a","school":{"__ref":"School:{\"uuid\":\"b4937850-2903-4616-8745-01900ed913bf\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"eb89a608-89d7-4b6d-ada4-1f2f76b46314\"}":{"__typename":"Education","uuid":"eb89a608-89d7-4b6d-ada4-1f2f76b46314","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Interdisciplinary Studies - Economics, Business, and Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"bd9c7e1d-972e-47e9-b044-72d0d15cc67d\"}":{"__typename":"MentorPublicProfile","uuid":"bd9c7e1d-972e-47e9-b044-72d0d15cc67d","displayName":"Sofia C.","slug":"sofia-cobos","biography":"\u003cp\u003eHi, I’m Sofia! I’m a junior majoring in Interdisciplinary Studies, focusing on Sustainable Business and Economic Policy. I’m passionate about finding ways to create a better world through conservation and investment strategies that protect our earth and support sustainable agriculture. I believe that by combining innovative ideas with practical solutions, we can protect the environment while helping communities thrive. I’ve always loved learning across all fields—whether it’s economics, environmental science, or even history and psychology. I enjoy connecting ideas from different areas to solve problems and see the bigger picture. For me, learning isn’t just about studying—it’s about staying curious and finding ways to make a difference. Outside of academics, I care deeply about education accessibility and helping students discover study techniques that work for them. As someone who believes every student learns differently, I focus on creating adaptable strategies—especially for students with ADHD. Whether it’s breaking down tough concepts or finding creative ways to stay organized, I love helping others feel confident in their learning journey.\u003c/p\u003e","teachingVideoPlaybackId":"H8w02Bpc01WBDWv2PdcOv44ZmXMxFswQa02LNjr36n1BpQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my proudest achievements is getting accepted into Cornell University, a goal that once seemed unattainable. Growing up, I was not a straight-A student, and my undiagnosed ADHD often made school feel overwhelming. My struggles led me to believe that the Ivy League was beyond my reach, a sentiment reinforced by teachers who doubted my potential and by being excluded from advanced classes. These experiences left me questioning my abilities. However, everything changed during a visit to Cornell in my freshman year of high school. I vividly remember telling myself, \"I will go to Cornell.\" This moment of determination became a turning point. I resolved to challenge myself academically and seek learning opportunities beyond what my high school offered and in my junior year, I was finally diagnosed with ADHD. With the support of an incredible network of people, I learned strategies to manage my condition and thrive academically. When it came time to apply for college, I poured everything into my application and chose to apply Regular Decision to Cornell. Not only was I accepted, but I also received a likely letter—a moment I’ll never forget. Opening that letter and running down the stairs in tears to share the news with my parents remains one of the happiest moments of my life. This journey taught me resilience and the power of self-belief. Despite the doubts of others and the challenges posed by ADHD, I proved that no obstacle is insurmountable when you refuse to give up on your dreams.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"68cfeea2-2659-456f-a909-a60dc59e57c7\"}"},{"__ref":"Favorites:{\"uuid\":\"53142130-e365-43e9-b64f-067d394f443a\"}"},{"__ref":"Favorites:{\"uuid\":\"484413c4-05c3-4441-9d86-bc06da189686\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5fbd54d2-22e5-41ad-b2ca-c56dc21ffb96\"}"}],"major":"Interdisciplinary Studies - Economics, Business, and Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"312e5cd2-4e2f-46ad-a599-b372b8d58f2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"81a4458e-a914-4d16-b3dd-8299a3a92035\"}"},{"__ref":"DeepDives:{\"uuid\":\"c3005070-d955-4732-b0f7-80bfac6d8bb2\"}"},{"__ref":"DeepDives:{\"uuid\":\"5c00a845-77ff-4f
