xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ccefc42f-ffc1-4d2d-a7f5-93dfbf885255\"}":{"__typename":"Favorites","uuid":"ccefc42f-ffc1-4d2d-a7f5-93dfbf885255","photoUrl":"https://ucarecdn.com/5f6194fc-4ae5-4d1f-b9b8-972f001aea82/","title":"Long Distance Running!","type":"SPORT"},"Favorites:{\"uuid\":\"f5c1169f-1b3f-401e-b308-cd5d0be32834\"}":{"__typename":"Favorites","uuid":"f5c1169f-1b3f-401e-b308-cd5d0be32834","photoUrl":"https://ucarecdn.com/1e8ef275-35d3-46d6-a142-c4e093686be6/","title":"Wish You Were Here","type":"ALBUM"},"Favorites:{\"uuid\":\"4006b89b-7a37-4d22-827b-a9e0b8a62a23\"}":{"__typename":"Favorites","uuid":"4006b89b-7a37-4d22-827b-a9e0b8a62a23","photoUrl":"https://ucarecdn.com/2247e45c-9804-4399-934f-0e27f95b1a0c/","title":"One Hundred Years of Solitude","type":"BOOK"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"4d67d051-a735-498f-857b-eeb7a795c29d\"}":{"__typename":"DeepDives","uuid":"4d67d051-a735-498f-857b-eeb7a795c29d","content":"\u003cp\u003eDuring my sophomore winter at Dartmouth, I was feeling very lost (it was COVID times). I was just feeling aimless, and I didn't want to just look forward to classes and social stuff - I needed something else to drive me. I reached out to a Dartmouth alum who does research in Madagascar and asked if I could help out with some of his research for free. He began to mentor me and said \"one day, I'll take you to Madagascar.\" Well, my junior summer he did!! I am currently working on publishing my own paper on our findings there in a peer-reviewed journal. I could talk for HOURS about my research (but nobody would want to listen); it was by far one of my best parts of my college education - and hopefully, I can continue to do research with him! Sometimes, it's all about putting yourself out there - and asking if anyone needs free labor in exchange for mentorship (trust me, it'll benefit you in the long run)!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f87892a7-137d-470b-b86e-ce524daf87cd\"}":{"__typename":"DeepDives","uuid":"f87892a7-137d-470b-b86e-ce524daf87cd","content":"\u003cp\u003eIn middle school and high school, whenever I wasn't studying, I was swimming, running, or playing tennis. Being a student-athlete was my whole identity. It shaped who I am as a person today; I would not have the drive nor the endurance had it not been for hour long runs followed by two hour long swim practices. But it also meant that when it was time for me to go off to college, I had no idea who I was anymore. Since I was not talented enough to be an athlete at Dartmouth, I had to accept that I was losing a part of my identity. It's hard to go from being an overachiever in a small high school where everyone knows you and your accomplishments, to a nobody at a good college. But I learned to love being a nobody and surrounding myself with equally (and more) talented people! So the advice I would give my younger self would be this: embrace not being the best. It means there is still more for you to learn and accomplish. Embrace the impermanence of your identity; identities are meant to change. You are who you are not because of what you do, but because of your values. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"1839b535-cb5b-4b78-bea4-e1e50e8f1d0c\"}":{"__typename":"DeepDives","uuid":"1839b535-cb5b-4b78-bea4-e1e50e8f1d0c","content":"\u003cp\u003eMy dream job is very specific: it is to work for APOPO, the organization that trains \"heroRATS.\" These rats are trained to detect landmines and positive tuberculosis samples using their sense of smell. I know, this is a very specific job. But this NGO saves thousands and thousands of lives with this innovative solution. I also - and I know this is a unique opinion - LOVE rats. In fact, I love all animals! During college in one of my \"off terms\" (a term where you don't take classes, because you have to take classes your sophomore summer at Dartmouth) I worked at a wildlife rehabilitation center. From this experience, I learned that every being on this earth is equally valuable and deserving of life and health. No matter if it's a squirrel, or a duck, or an opossum. Using rats to save lives of people in war-torn and TB-prevalent countries is beneficial to everyone - including the rats - and I would love to be a part of it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"41eec09f-6fa5-4e3f-bb72-817a5d45c58b\"}":{"__typename":"DeepDives","uuid":"41eec09f-6fa5-4e3f-bb72-817a5d45c58b","content":"\u003cp\u003eGoing into college, I had absolutely no idea what I wanted to do. Not a clue. My first term, I took Astronomy, Global Health and Society, and Chinese 4. I just wanted to try a little bit of everything. That winter, I took Emerging Infectious Diseases, Tibetan Buddhism, Drawing, and a writing class. Eventually in the spring term, I took my first environmental studies class (though it was virtual, as we were sent home due to the pandemic). While taking it, I realized it was exactly what I had been looking for. I had wanted a major where I could try a little bit of everything, and I liked science but was always more adept at social sciences. Environmental studies was the perfect blend of everything, and most importantly, it felt like a major I was proud to say I was pursuing because it was aimed at benefitting others. But the moral of the story is, try a little bit of everything! Some of my favorite classes were in the religion department, and I still hope to one day combine religion with sustainability. Even if you think you know what you want to do, it's worth it to step back and re-evaluate. Sometimes, you don't even know what you have been searching for until you find it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"7839f648-3029-40e9-97e1-d5464118ae24\"}":{"__typename":"School","uuid":"7839f648-3029-40e9-97e1-d5464118ae24","name":"Worcester Academy","city":"Worcester","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01604"},"Education:{\"uuid\":\"8adc09cc-816c-4537-bdcf-f448a4cf568c\"}":{"__typename":"Education","uuid":"8adc09cc-816c-4537-bdcf-f448a4cf568c","school":{"__ref":"School:{\"uuid\":\"7839f648-3029-40e9-97e1-d5464118ae24\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"bb52810d-5dd2-4d75-9ec3-a3fd7050e36d\"}":{"__typename":"Education","uuid":"bb52810d-5dd2-4d75-9ec3-a3fd7050e36d","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Environmental Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"e1a56a69-ba96-4a57-862d-02c112a8c058\"}":{"__typename":"MentorPublicProfile","uuid":"e1a56a69-ba96-4a57-862d-02c112a8c058","displayName":"Fiona P.","slug":"fiona-price-1","biography":"\u003cp\u003eHi there! I'm a recent graduate from Dartmouth College passionate about conservation and global health. In college, I majored in environmental studies. I was also involved with two research projects, one of which was about sustainable rice farming in the Dominic Republic, and the other was about community biodiversity monitoring in Madagascar (that's a picture of me with a lemur!). I have been to both countries for my research and am eager to continue exploring the world through the lens of sustainability and natural resource management in the future. Outside of my academics, I was also an intern at the Sustainability Office where my role was mentoring first-year students and teaching them how to implement their own sustainability initiatives. Additionally, I was an executive of my sorority; my role was to make the new members feel comfortable and included. Both of these roles provided me with the skills required to be an effective mentor, and I would love to keep mentoring in my post-grad life. \u003cbr\u003eAfter college, I spent a year in Washington D.C. continuing my passion for environmental studies by doing climate consulting! In my free time, I managed to first author a paper on my Madagascar research (https://www.sciencedirect.com/science/article/pii/S0006320723004780). I also enjoy knitting, drawing, trying to teach myself how to be a semi-decent vegetarian chef, and hopefully mentoring you!\u003c/p\u003e\u003cp\u003eNow, I am headed to the Nicholas School at Duke University to pursue a master's of Environmental Management!\u003c/p\u003e","teachingVideoPlaybackId":"YlUPxX38NtA3mhBFXVq2Khgj7EAZUeZbvAOHl9kO3Xc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI've done two half marathons - both in the pouring rain (which meant I couldn't even listen to music and had to be alone with my THOUGHTS)! Proof that when you stop being an \"athlete\" after graduating high school, you don't really have to stop! \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ccefc42f-ffc1-4d2d-a7f5-93dfbf885255\"}"},{"__ref":"Favorites:{\"uuid\":\"f5c1169f-1b3f-401e-b308-cd5d0be32834\"}"},{"__ref":"Favorites:{\"uuid\":\"4006b89b-7a37-4d22-827b-a9e0b8a62a23\"}"}],"causesSupported":[],"major":"Environmental Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4d67d051-a735-498f-857b-eeb7a795c29d\"}"},{"__ref":"DeepDives:{\"uuid\":\"f87892a7-137d-470b-b86e-ce524daf87cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"1839b535-cb5b-4b78-bea4-e1e50e8f1d0c\"}"},{"__ref":"DeepDives:{\"uuid\":\"41eec09f-6fa5-4e3f-bb72-817a5d45c58b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/43081d79-c361-47b1-aab7-21c7cbc1adf9/-/preview/-/format/jpg/","https://ucarecdn.com/c257f394-6b9a-4630-9af2-a0b6c3029a83/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8adc09cc-816c-4537-bdcf-f448a4cf568c\"}"},{"__ref":"Education:{\"uuid\":\"bb52810d-5dd2-4d75-9ec3-a3fd7050e36d\"}"}],"hiredAt":"2023-08-02T16:05:18.092Z","topics":["6-8 Grade Science","Biology","Writing","Academic Coaching","History","College Essay Writing","Executive Function","Reading","Creative Writing","Visual Arts / Graphic Design","History Project","Medicine / Health","Game Design","Law / Government / Policy","Sustainability","Debate","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/ceacbeeb-af28-4003-96cf-d977276b04ef/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentor
