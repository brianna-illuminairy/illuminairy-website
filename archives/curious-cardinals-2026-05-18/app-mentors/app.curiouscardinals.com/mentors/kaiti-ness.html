xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"b4a00168-e47d-49e3-91ae-3798e15a3db9\"}":{"__typename":"DeepDives","uuid":"b4a00168-e47d-49e3-91ae-3798e15a3db9","content":"\u003cp\u003eAs a committee director of a campus organization that advocates for menstrual equity around the Baltimore community and at the Johns Hopkins' campus, myself and others started  education workshops at Baltimore schools that teach young students about the importance of menstrual hygiene and menstrual/sexual health. We provide free menstrual products while offering more sustainable alternatives to single-use products. With our workshops, we hope to break the social stigma around menstruation to ultimately empower and uplift those in our community. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e3e34505-fc93-4765-ab1b-6ed4f8205f26\"}":{"__typename":"DeepDives","uuid":"e3e34505-fc93-4765-ab1b-6ed4f8205f26","content":"\u003cp\u003eI love to explore farmers markets in the cities that I travel to and live in! I love to browse the local produce, products, and clothing that many smaller, family owned businesses provide and learn more about the history of their business. It allows me to try things out of my comfort zone while indulging in the various commodities that the local town/city offers. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b21a853a-56be-44a3-98fa-a3ffeccbd5d1\"}":{"__typename":"DeepDives","uuid":"b21a853a-56be-44a3-98fa-a3ffeccbd5d1","content":"\u003cp\u003eI spent many mornings in the hot Dallas summer running with friends while watching the sunrise. It was a great way to build relationships while simultaneously enjoying the beauty all around. We would run along lakes, parks, and even the city streets, exploring places we had never been to before. In preparation for the fall cross country seasons, it was also a great way to bond with future teammates, young and old, and tell fun stories. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"5511ffa5-b897-4705-881a-fe922585bff3\"}":{"__typename":"DeepDives","uuid":"5511ffa5-b897-4705-881a-fe922585bff3","content":"\u003cp\u003eMy greatest role model growing up was my grandmother. She was the definition of hard work paying off, as she worked incredibly hard providing for her family and setting up a life for them in America after immigrating from Mexico. She had many life experiences and lessons she shared with me growing up, and always instilled in me the confidence I never knew I had. She always encouraged me to take risks, ask questions, and help others. The lessons she has taught me are what I try to embody every day while hoping to instill these same values in the students I mentor.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"e3a7e210-8e3e-498f-af74-57a9976df470\"}":{"__typename":"School","uuid":"e3a7e210-8e3e-498f-af74-57a9976df470","name":"Johns Hopkins University","city":"Baltimore","type":"COLLEGE","state":"Maryland","country":"United States","zip":"21218"},"Education:{\"uuid\":\"711f373c-432b-4b69-92d0-42c125022d05\"}":{"__typename":"Education","uuid":"711f373c-432b-4b69-92d0-42c125022d05","school":{"__ref":"School:{\"uuid\":\"e3a7e210-8e3e-498f-af74-57a9976df470\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Molecular and Cellular Biology, Spanish","degree":null},"School:{\"uuid\":\"18307014-d6e8-43f7-a50f-3636c16c2f38\"}":{"__typename":"School","uuid":"18307014-d6e8-43f7-a50f-3636c16c2f38","name":"Greenhill School","city":"Dallas ","type":"HIGH","state":"Texas","country":"USA","zip":"75001"},"Education:{\"uuid\":\"8fbd68ab-ff0c-41ed-a7b5-f8c7a9fd7d35\"}":{"__typename":"Education","uuid":"8fbd68ab-ff0c-41ed-a7b5-f8c7a9fd7d35","school":{"__ref":"School:{\"uuid\":\"18307014-d6e8-43f7-a50f-3636c16c2f38\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"Testimonial:c4d85302-1169-46bb-acd4-e29c7483d19a":{"__typename":"Testimonial","id":"c4d85302-1169-46bb-acd4-e29c7483d19a","text":"Kaiti has been an amazing, patient, and inspiring mentor for Kelilah. She was able to cover multiple subject matters and always communicative about progress she sees Kelilah makes and provide specific guidance on how to address challenges to improve. Seeing someone like Kaiti juggling between tutoring and school successfully serves a great role model for Kelilah.  We're very lucky to have found Kaiti.","date":"2025-05-30 02:29:31.184+00","rating":5,"endorser":{"__typename":"Endorser","name":"Shanshan","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"1014474b-31fd-4cad-9242-b057593f9cba\"}":{"__typename":"MentorPublicProfile","uuid":"1014474b-31fd-4cad-9242-b057593f9cba","displayName":"Kaiti N.","slug":"kaiti-ness","biography":"\u003cp\u003eKaiti is a current senior at Johns Hopkins University that is studying Molecular and Cellular Biology and Spanish. Her pursuit to speak fluent Spanish stems from her desire to be able to speak to the various Spanish speaking communities all over the world, including her own family. As someone interested in medicine, she wanted to combine her studies of health and language to expand the communities she will be able to reach while further bridging the language barrier gaps. \u003cbr\u003e\u003cbr\u003eShe spent the summer of 2022 studying abroad in Salamanca, Spain, where she was able to live with a host family and practice her Spanish speaking abilities, while simultaneously exploring and learning more about the Spanish culture. \u003cbr\u003e\u003cbr\u003eHer interest in the health professions sparked in high school, where she participated in volunteering and research opportunities. In college, she wanted to build on these experiences and develop her ability to interact and communicate with patients. She currently volunteers at the Baltimore City Health Department Immunization Clinic as a Spanish interpreter. In this role, she helps interpret doctor-patient interactions while helping families fill out clinic documentation. This position has challenged her to build her communication abilities with Spanish speaking families while providing the best possible care. \u003cbr\u003e\u003cbr\u003eOne of the ways she has combined her interest in public health and education is through her role as an education director for a student-run nonprofit organization that advocates for menstrual and sexual equity. She leads education workshops at a variety of Baltimore elementary and middle schools while organizing menstrual product drives to donate to a multitude of schools and shelters. \u003cbr\u003e\u003cbr\u003eOutside of school, she runs on the varsity cross country and track and field teams at Hopkins. It provides her a great outlet at the end of the day to exercise her mind and body while building relationships with teammates of all ages. She also loves to go on walks with her dogs and cook! \u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"TUq2pTi6ZzTcysXyJnj2etizvoewhNLHBQ1NhEANiD8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Molecular and Cellular Biology, Spanish","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b4a00168-e47d-49e3-91ae-3798e15a3db9\"}"},{"__ref":"DeepDives:{\"uuid\":\"e3e34505-fc93-4765-ab1b-6ed4f8205f26\"}"},{"__ref":"DeepDives:{\"uuid\":\"b21a853a-56be-44a3-98fa-a3ffeccbd5d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"5511ffa5-b897-4705-881a-fe922585bff3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/29d74b9d-5d82-4b91-8478-84212372cd49/-/preview/-/format/jpg/","https://ucarecdn.com/fb41d096-5286-445b-bc76-de4b944a6d45/-/preview/-/format/jpg/","https://ucarecdn.com/3e2cb680-f800-409f-8c7b-8dd2fe5661e9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"711f373c-432b-4b69-92d0-42c125022d05\"}"},{"__ref":"Education:{\"uuid\":\"8fbd68ab-ff0c-41ed-a7b5-f8c7a9fd7d35\"}"}],"hiredAt":"2023-09-09T16:25:29.007Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","K-5 Grade Math","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History"],"communityBadges":["https://ucarecdn.com/4d492211-7b83-4aa5-a016-8991edde1bb6/","https://ucarecdn.com/d6e4ee1f-e382-4643-ba2c-be1b241e6cb1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:c4d85302-1169-46bb-acd4-e29c7483d19a"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\
