xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2a8b8011-f3da-4447-9ffa-0059a1addad1\"}":{"__typename":"DeepDives","uuid":"2a8b8011-f3da-4447-9ffa-0059a1addad1","content":"\u003cp\u003eFocus on what excites you enough that you forget to focus!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"39c04a37-179d-4f26-9916-79132b421d0d\"}":{"__typename":"DeepDives","uuid":"39c04a37-179d-4f26-9916-79132b421d0d","content":"\u003cp\u003eI have been lucky as to have had a handful of incredible mentors in my life. Mentorship can be transformative, and I know that first hand. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"17ab20e5-f4f3-4b74-bb7e-ba13d9e8a8ca\"}":{"__typename":"DeepDives","uuid":"17ab20e5-f4f3-4b74-bb7e-ba13d9e8a8ca","content":"\u003cp\u003eRight now, I'm creating a community of digital creators who want to add civic engagement into their content. My organization connects them to causes that they care about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}":{"__typename":"School","uuid":"2ff73c87-6442-482c-8d92-863dfb263ea0","name":"The Dalton School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"35b5cc17-853d-41fd-8b52-7ab2548bbdaf\"}":{"__typename":"Education","uuid":"35b5cc17-853d-41fd-8b52-7ab2548bbdaf","school":{"__ref":"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}"},"startYear":"2005","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"3cbd734c-ca5a-4d30-9a78-63603aa5c9df\"}":{"__typename":"Education","uuid":"3cbd734c-ca5a-4d30-9a78-63603aa5c9df","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"abe1c553-0be7-4e13-94d8-ac65a5339a65\"}":{"__typename":"MentorPublicProfile","uuid":"abe1c553-0be7-4e13-94d8-ac65a5339a65","displayName":"Olivia G.","slug":"olivia-gopnikparker-1","biography":"\u003cp\u003eI’m Olivia, a recent Harvard graduate with a degree in History and a special focus in Art History. I grew up in New York City, where many of my Sundays were spent wandering from museum to museum, soaking in as much art as I possibly could. Those early experiences sparked a lifelong love of history, culture, and storytelling. When I wasn’t in a gallery, I was often involved in political work. I volunteered on campaigns and advocated for causes I cared deeply about. Outside of academics and activism, I played lacrosse and wrote comedy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Harvard, I continued to balance different passions. I served as treasurer of the \u003cem\u003eHarvard Lampoon\u003c/em\u003e, where I learned to combine humor with organization and leadership. Outside of the \u003cem\u003eLampoon\u003c/em\u003e, I also helped to put on and manage student art shows all throughout campus, and served as a leader in the Franklin Fellowship -- an organization that still shapes my life to this day. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile at Harvard, I also explored professional opportunities in both the art world and geopolitical research. Alongside my studies, I also worked as a researcher at a geopolitical and macroeconomic advisory, where I learned not only how to make a mean Excel sheet, but also how to truly contextualize daily events into the larger schema of geopolitics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince graduating, I’ve worked primarily in the art world, but I never left my passion for politics behind, and just this year I founded an organization that helps to match digital creators with causes that they care about, helping to connect culture with civic impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I draw on all of these experiences. I know firsthand that learning is not just about memorizing facts—it’s about finding connections and developing your own voice. I love taking the time to understand each student’s strengths, interests, and learning style so that together we can create a project or plan that feels meaningful and exciting.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want your Curious Cardinals experience to be truly transformative—something that not only helps you succeed in the classroom but also sparks new ways of thinking and creating. Together, we’ll craft a project that is uniquely yours: one that pushes you to grow and equips you with skills you can carry far beyond our time together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost of all, I believe learning should be engaging, collaborative, and inspiring. I can’t wait to get to know you, learn what excites you, and design the right project to make your Curious Cardinals journey as rewarding as possible.\u003c/p\u003e","teachingVideoPlaybackId":"FqpeIJc2Xe01bHZupBW01k1QPhMevX8zE369Ou005Kgorg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2a8b8011-f3da-4447-9ffa-0059a1addad1\"}"},{"__ref":"DeepDives:{\"uuid\":\"39c04a37-179d-4f26-9916-79132b421d0d\"}"},{"__ref":"DeepDives:{\"uuid\":\"17ab20e5-f4f3-4b74-bb7e-ba13d9e8a8ca\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1f5d662f-2381-4987-bddf-cc14e5b8c833/-/preview/-/format/jpg/","https://ucarecdn.com/c3c2b10b-f799-452c-9e92-4c247d88303b/-/preview/-/format/jpg/","https://ucarecdn.com/344fdf28-5eef-4089-871f-32a4195f968e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"35b5cc17-853d-41fd-8b52-7ab2548bbdaf\"}"},{"__ref":"Education:{\"uuid\":\"3cbd734c-ca5a-4d30-9a78-63603aa5c9df\"}"}],"hiredAt":"2025-08-12T02:04:14.287Z","topics":["History Project","Fashion / Cosmetics","Creative Writing","Film / Theater","Visual Arts / Graphic Design","Video / Photography","Law / Government / Policy","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"olivia-gopnikparker-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"abe1c553-0be7-4e13-94d8-ac65a5339a65\"}"}}},"_sentryTraceData":"ed44241a73754b40a0f2f7524ab83075-926602c01fbf463d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ed44241a73754b40a0f2f7524ab83075,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5B
