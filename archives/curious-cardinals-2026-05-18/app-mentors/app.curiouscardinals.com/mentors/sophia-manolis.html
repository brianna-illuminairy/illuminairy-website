xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a6afce1f-4385-4493-ae67-4d8cabd5c189\"}":{"__typename":"DeepDives","uuid":"a6afce1f-4385-4493-ae67-4d8cabd5c189","content":"\u003cp\u003eIn my sophomore year, I designed my own community-engaged research project about the impact of a citywide urban sustainability initiative in Amsterdam, NL! I first built a partnership with Amsterdam professors from a local university, who mentored me on the project and connected me to neighborhood sustainability groups. Then I applied for and received funding from a Stanford grant. While living in Amsterdam, I immersed myself in these initiatives, interviewed 24 people involved with them, and explored how people experienced and perceived social inequities in their neighborhoods and sustainability projects. I ended up giving a talk about my findings at the Amsterdam University, and won an award from Stanford for research projects that exemplify the most intellectual vitality, passionate interest in niche subjects, and spirit of intellectual adventure! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also had a LOT of fun exploring Amsterdam and the surrounding European countries :) \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"036d16ee-bb16-419e-9929-3b622daa874e\"}":{"__typename":"DeepDives","uuid":"036d16ee-bb16-419e-9929-3b622daa874e","content":"\u003cp\u003eI've always wanted to thru-hike a long distance trail (which means hiking the entire thing in one season). This month (August 2024) I'm hiking the Superior Hiking Trail, which runs 300 miles along the coast of Lake Superior in Minnesota!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"fb619ffc-6903-4c97-96d8-c4514cff49d1\"}":{"__typename":"DeepDives","uuid":"fb619ffc-6903-4c97-96d8-c4514cff49d1","content":"\u003cp\u003eOne of the hardest challenges I recently faced was experiencing chronic, debilitating migraines for about a year and a half before I could get effective treatment. This humbled me, by reminding me in a very physical way to to never again take my health for granted, and to let go of expectations about the type of person I am supposed to be or the life I'm supposed to have. As I genuinely accepted the painful reality of my situation, I experienced an immensely powerful appreciation for being alive that I will never forget. While this in no way meant to justify the suffering I or anyone experiences, it motivated me to always embrace the truths of my experience (even when they're hard) and adapt to change, without losing that baseline gratitude for the miracle of existence.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"250c5874-e6ec-4754-8a7e-a9502bc17c4d\"}":{"__typename":"DeepDives","uuid":"250c5874-e6ec-4754-8a7e-a9502bc17c4d","content":"\u003cp\u003eIn my last quarter at Stanford, I took a class called \"Regenerative Leadership.\" Having spent the last seven years immersed in nonprofit spaces and social movements, I'd done many leadership trainings before and thought I knew a lot about it! But in this class, I learned how indigenous ways of knowing and being can redefine what we think leadership is. We learned from Indigenous leaders about the importance of individual and collective healing, how to define and live into our values, listening deeply to the wisdom and truths carried forth by all beings, and creating cultures of ecological flourishing.\u003c/p\u003e\u003cp\u003eBecause of this class, I realized my dream is to be a leadership coach who combines skills in personal/collective healing with the knowledge I've gained researching and organizing for equitable social impact and transformation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"799d4f23-1953-4a53-92fa-ec96f8385c74\"}":{"__typename":"School","uuid":"799d4f23-1953-4a53-92fa-ec96f8385c74","name":"South High School","city":"Minneapolis","type":"HIGH","state":"Minnesota","country":"United States","zip":"55407"},"Education:{\"uuid\":\"df63466a-5043-423b-9829-172bb3966332\"}":{"__typename":"Education","uuid":"df63466a-5043-423b-9829-172bb3966332","school":{"__ref":"School:{\"uuid\":\"799d4f23-1953-4a53-92fa-ec96f8385c74\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"fca1ce76-948b-4f43-9bb3-09aa7245a69a\"}":{"__typename":"Education","uuid":"fca1ce76-948b-4f43-9bb3-09aa7245a69a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Urban Studies and Sociology","degree":null},"MentorPublicProfile:{\"uuid\":\"20e27abe-0b67-45e4-b31f-5ce3af7a2e8a\"}":{"__typename":"MentorPublicProfile","uuid":"20e27abe-0b67-45e4-b31f-5ce3af7a2e8a","displayName":"Sophia M.","slug":"sophia-manolis","biography":"\u003cp\u003eHello! My name is Sophia and I am a deep thinker, passionate learner, and free-spirited adventurer. I was born and raised in Minneapolis, Minnesota, a place I'm very loyal to. Growing up, I was taught to use my voice to dream and advocate for a better world, and to never stop learning or critically thinking even if you think you know something really well. I became curious about the social and environmental issues I witnessed around me in Minneapolis and threw myself into environmental justice activism. In those days, you could often find me organizing cross-sector coalitions to support just climate policy, leading climate justice education workshops with other young people, or writing in my school's newspaper about the gentrification taking place in our surrounding neighborhood.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI graduated with Honors and distinction from Stanford University in June 2024, with majors in Urban Studies and Sociology. While in college, I wanted to deeply explore the root causes of economic and environmental injustices, so I studied the history of capitalism and the state of poverty and inequality in the U.S. I also used my sociology skills to conduct community-engaged research projects, which center and uplift community expertise in understanding local problems and the solutions required to create lasting, equitable change. I led and collaborated on projects exploring how homelessness prevention programs in Minneapolis could be equitably redesigned, how Minneapolis residents experience affordable housing policy, and more!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond that, I care a lot about holistic wellness and healing! I believe all humans should be valued for who we are, not what we do. I strive to cultivate compassion for myself and others, express myself authentically, live creatively, and be as present as I can through it all.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time you'll probably find me hanging out outside, reading, writing in my journal, or dancing! One of my favorite things about being me is how intensely I experience awe for the small and large delights of life: whether it's watching a beautiful sunset, digging my hands into soil while I weed my family's garden, laughing with people I love, or feeling a gentle breeze on my skin as I go on a morning walk.\u003c/p\u003e","teachingVideoPlaybackId":"332LSBbQl8pGo8rRLAz5U7saX8IDNLJ6023x4kExQH1Y","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Urban Studies and Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a6afce1f-4385-4493-ae67-4d8cabd5c189\"}"},{"__ref":"DeepDives:{\"uuid\":\"036d16ee-bb16-419e-9929-3b622daa874e\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb619ffc-6903-4c97-96d8-c4514cff49d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"250c5874-e6ec-4754-8a7e-a9502bc17c4d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a8e923a4-2f95-4cf7-a4c6-d5f48f7161e6/-/preview/-/format/jpg/","https://ucarecdn.com/e2732ee3-073b-4e1c-9a56-6d956063eda7/-/preview/-/format/jpg/","https://ucarecdn.com/613d3be6-4f98-4c64-9723-8ac298bc265d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"df63466a-5043-423b-9829-172bb3966332\"}"},{"__ref":"Education:{\"uuid\":\"fca1ce76-948b-4f43-9bb3-09aa7245a69a\"}"}],"hiredAt":"2024-08-06T00:37:55.418Z","topics":["Academic Coaching","Executive Function","Literature","History Project","Video / Phot
