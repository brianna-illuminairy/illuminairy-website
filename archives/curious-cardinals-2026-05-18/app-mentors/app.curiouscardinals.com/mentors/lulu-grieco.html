xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"fc8ebba4-9600-4658-9312-6d592829cceb\"}":{"__typename":"DeepDives","uuid":"fc8ebba4-9600-4658-9312-6d592829cceb","content":"\u003cp\u003eOne time I had this insane dream about a zombie apocalypse, but the zombies were unaware that they were zombies and would get really mad if you tried to tell them. It was a weird mix of trying to survive the end of the world while also trying to act super normal in front of my best friend who had unfortunately been turned.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"6dd0015b-b9f5-4519-be41-16c7bb519572\"}":{"__typename":"DeepDives","uuid":"6dd0015b-b9f5-4519-be41-16c7bb519572","content":"\u003cp\u003eI believe mentorship is a two-way street, mentors often gain as much as their mentees. There’s something incredible about connecting with someone and helping them achieve a goal, whether it’s acing a biology exam or completing their first short film. Watching someone reach a milestone they can be proud of is both rewarding and heartwarming. Mentorship is also dynamic and ever-changing; it’s never boring or routine. Both mentor and mentee are constantly learning from each other and growing together, which makes the experience uniquely fulfilling.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"0c3ec23b-a6d1-4b3f-a712-2f560a74cf25\"}":{"__typename":"DeepDives","uuid":"0c3ec23b-a6d1-4b3f-a712-2f560a74cf25","content":"\u003cp\u003eI have always been very interested in the way people's brains work. I was quite nosy as a child, and would always question everyone about everything. Wondering why people chose to do the things they did. I would ask my friends why they were writing with their left hand instead of their right. Or I would ask my mom to take me through her morning and tell me what led her to choosing to wear the shirt that she had on. To my parents dismay, I would even ask strangers at restaurants why they decided to get a different menu item than me. When I got older and understood boundaries a bit more, I also began to learn that there were answers for all these questions I was always asking everyone, and the answer were within the interworking of their brains. When I got to senior year, I took AP Psych and was hooked immediately. That's when I really decided that psychology was the major for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"c7053c86-4935-4f60-9a50-395c0558dc15\"}":{"__typename":"DeepDives","uuid":"c7053c86-4935-4f60-9a50-395c0558dc15","content":"\u003cp\u003eMy greatest role model is my mom. She is truly one of the most hardworking people I've ever met and is able to balance running a business and taking care of our family with such grace. My whole life she's always told me to pursue literally whatever I wanted. Whatever I was the most passionate about was what my mom would drive me to do. No matter what life throws at her, she always manages to put up such a strong face and never lets anything take her down. She strongly believes that every door that closes is just leading to where your life is supposed to take you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"118ce07f-8196-4cdd-a99d-648a0d470792\"}":{"__typename":"School","uuid":"118ce07f-8196-4cdd-a99d-648a0d470792","name":"Campbell Hall","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91607"},"Education:{\"uuid\":\"938acd2b-76ad-4669-b90d-c8b1389b4e86\"}":{"__typename":"Education","uuid":"938acd2b-76ad-4669-b90d-c8b1389b4e86","school":{"__ref":"School:{\"uuid\":\"118ce07f-8196-4cdd-a99d-648a0d470792\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"0f76d005-8d09-4e8a-ae36-e003c35a1fcf\"}":{"__typename":"Education","uuid":"0f76d005-8d09-4e8a-ae36-e003c35a1fcf","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"e93232e2-25be-407c-9098-86f2552525b8\"}":{"__typename":"MentorPublicProfile","uuid":"e93232e2-25be-407c-9098-86f2552525b8","displayName":"Lulu G.","slug":"lulu-grieco","biography":"\u003cp\u003eLulu is a sophomore at Brown University studying Psychology, where she’s endlessly fascinated by the inner workings of the brain and how people think, feel, and connect. Her interests span a wide creative spectrum—film, acting, dance, visual art, English, and history are just a few of the areas that light her up. She believes that curiosity is at its best when it crosses boundaries, and she loves exploring how science and art can inform one another. Lulu has been working with kids for as long as she can remember. What began as watching her younger brother and his friends at age twelve evolved into a lifelong passion for mentoring and caretaking. Since then, she’s worked as a babysitter, camp counselor, nanny, and tutor, finding joy in helping young people discover what excites them most. She’s especially drawn to creating learning spaces that are playful, imaginative, and supportive—places where kids can express themselves freely and learn by doing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, Lulu was a competitive dancer, balancing rehearsals and performances with her leadership roles as co-president of both the Black Student Union and the Mixed Ethnicity affinity group. Those experiences deepened her commitment to community, collaboration, and amplifying diverse voices—values she continues to carry into her academic and creative pursuits. In college, she is heavily involved in film and theatre productions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMore recently, she worked with\u003cem\u003e Art of Elysium\u003c/em\u003e, a nonprofit that focuses on service through art. Over the summer, she visited homeless shelters to teach storytelling and storyboarding workshops, helping participants bring their ideas to life. She also helped plan music events to raise funds for the organization. In addition, Lulu interned with the hair care brand \u003cem\u003eOurX\u003c/em\u003e and the hair extension company \u003cem\u003eBELLAMI\u003c/em\u003e, where she contributed to their social media and creative marketing efforts. She helped brainstorm campaigns, create mood boards, and analyze audience engagement—all of which gave her a deeper appreciation for how creativity, communication, and strategy work together to bring ideas to life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen she’s not in class or mentoring, you can usually find Lulu acting in one of her friends’ short films, painting, drawing, or diving into conversations with her friends that somehow manage to feel both deep and delightfully unserious. As a Curious Cardinals mentor, Lulu is excited to bring her curiosity, creativity, and empathy to every session. Whether she’s helping a student craft a story, unpack a historical theme, or explore the psychology of character, she aims to make learning feel inspiring, personal, and fun.\u003c/p\u003e","teachingVideoPlaybackId":"DxW6iVFwylV7qf7zJp5009odaiqrY9nXvS1501mFncp1I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fc8ebba4-9600-4658-9312-6d592829cceb\"}"},{"__ref":"DeepDives:{\"uuid\":\"6dd0015b-b9f5-4519-be41-16c7bb519572\"}"},{"__ref":"DeepDives:{\"uuid\":\"0c3ec23b-a6d1-4b3f-a712-2f560a74cf25\"}"},{"__ref":"DeepDives:{\"uuid\":\"c7053c86-4935-4f60-9a50-395c0558dc15\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e5238585-dcdf-4df5-aaa3-b5888fbd0f45/-/preview/-/format/jpg/","https://ucarecdn.com/8674adf4-3437-4e83-9434-dbf44343e105/-/preview/-/format/jpg/","https://ucarecdn.com/4c9318fc-1bc7-4992-9970-507c9e83cbef/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"938acd2b-76ad-4669-b90d-c8b1389b4e86\"}"},{"__ref":"Education:{\"uuid\":\"0f76d005-8d09-4e8a-ae36-e003c35a1fcf\"}"}],"hiredAt":"2025-11-06T02:50:33.717Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","6-8 Grade Science","Biology","Writing","Academic Coaching","College Essay Writing","Reading","History"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/f77b6ceb-6fd8-4b
