xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a86bb5a1-44c6-4b46-ac54-4a2fcab53277\"}":{"__typename":"Favorites","uuid":"a86bb5a1-44c6-4b46-ac54-4a2fcab53277","photoUrl":"https://ucarecdn.com/b0e658c1-8051-4b95-b329-f7099e6e612c/","title":"IGOR - Tyler the Creator","type":"ALBUM"},"Favorites:{\"uuid\":\"d99346a7-ed16-49f5-9e70-72d562850132\"}":{"__typename":"Favorites","uuid":"d99346a7-ed16-49f5-9e70-72d562850132","photoUrl":"https://ucarecdn.com/2c3474e9-2b0d-40c3-9d55-b85f5d0675eb/","title":"Tyler the Creator","type":"ARTIST"},"Favorites:{\"uuid\":\"41104bfe-52ba-4660-a96a-95bb8d840aea\"}":{"__typename":"Favorites","uuid":"41104bfe-52ba-4660-a96a-95bb8d840aea","photoUrl":"https://ucarecdn.com/73686c0d-cab5-449d-9e34-96b960562942/","title":"The Alchemist","type":"BOOK"},"CausesSupported:{\"uuid\":\"28e579b7-27f0-4001-8514-50a77288c352\"}":{"__typename":"CausesSupported","uuid":"28e579b7-27f0-4001-8514-50a77288c352","name":"St. Jude Children's Research Hospital","description":"\u003cp\u003eSt. Jude cared for me as a kid. I felt safe and loved. That's why I give back.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/f6fa0762-c63f-4389-aee6-39b6632d5095/"},"CausesSupported:{\"uuid\":\"1277e1dc-6276-4889-8b22-9f861d9cd538\"}":{"__typename":"CausesSupported","uuid":"1277e1dc-6276-4889-8b22-9f861d9cd538","name":"Aquatic Life Institute","description":"\u003cp\u003eCreating a better future for the trillions of farmed and wild-caught aquatic ani\u003c/p\u003e","photoUrl":"https://ucarecdn.com/82d6a64a-f16b-4f5e-bcab-cbe92d1b273d/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e80bdd7c-b0c0-4bc7-bf28-918ae93ad9f9\"}":{"__typename":"DeepDives","uuid":"e80bdd7c-b0c0-4bc7-bf28-918ae93ad9f9","content":"\u003cp\u003eDon't be afraid to do things that feel out of your league. The opportunities that will change your life are the ones you'll almost talk yourself out of. Apply anyway. Show up anyway. You'll surprise yourself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"47f7b1ed-095c-4ba8-ae2c-6edd4f9d1ddf\"}":{"__typename":"DeepDives","uuid":"47f7b1ed-095c-4ba8-ae2c-6edd4f9d1ddf","content":"\u003cp\u003eBecause I wished I had someone in my corner who had actually been confused, who had tried different things, and who could tell me \"hey, it's okay that you don't have it all figured out yet.\" I want to be that person for someone else.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1ef0516d-38f4-4fd9-a843-f929937992f8\"}":{"__typename":"DeepDives","uuid":"1ef0516d-38f4-4fd9-a843-f929937992f8","content":"\u003cp\u003eIt started with one physics class in high school. I fell in love with circuits and had this idea that I wanted to build things, but I also still really wanted to be involved in video games somehow. Computer Engineering felt like the perfect middle ground between Computer Science and Electrical Engineering. It let me chase both passions at once.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"6f7285a1-b4fb-441c-a035-bffa05b1bda2\"}":{"__typename":"DeepDives","uuid":"6f7285a1-b4fb-441c-a035-bffa05b1bda2","content":"\u003cp\u003eI'm actually really laid back (some of my closest friends and family might even say that I'm lazy!) But I have moments when I completely lock in and end up achieving things I didn't even expect of myself. I think that's something a lot of students can relate to more than they'd admit.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"4fca2368-95f5-4e81-927d-b328e393d75b\"}":{"__typename":"School","uuid":"4fca2368-95f5-4e81-927d-b328e393d75b","name":"California State University, Fullerton","city":"Fullerton","type":"HIGH","state":"California","country":"United States","zip":"90631"},"Education:{\"uuid\":\"55741567-59ed-4b97-8f49-0cc05aa31d86\"}":{"__typename":"Education","uuid":"55741567-59ed-4b97-8f49-0cc05aa31d86","school":{"__ref":"School:{\"uuid\":\"4fca2368-95f5-4e81-927d-b328e393d75b\"}"},"startYear":"2020","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"0f7ded51-9e2a-44aa-a043-a4bb20f0b40b\"}":{"__typename":"Education","uuid":"0f7ded51-9e2a-44aa-a043-a4bb20f0b40b","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2026","major":"Computer Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"ce9e4eee-5988-43e3-9fd3-a19984d058a8\"}":{"__typename":"MentorPublicProfile","uuid":"ce9e4eee-5988-43e3-9fd3-a19984d058a8","displayName":"Kristine V.","slug":"kristine-vergara","biography":"\u003cp\u003e\u003cstrong\u003eHi, I'm Kristine!\u003c/strong\u003e \u003cbr\u003eI'm a Master's student in Computer Engineering at Columbia University, and I'm here to help middle schoolers, high schoolers, and college applicants figure out their next move, \u003cstrong\u003ewith confidence!\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHere's the thing — I was \u003cem\u003ethat\u003c/em\u003e student who had no idea what she wanted to do. And I mean that in the best way possible.\u003c/p\u003e\u003cp\u003eBefore landing at Columbia, I explored more paths than most people expect from an engineer. I spent time in the \u003cstrong\u003emedical field\u003c/strong\u003e, dove into \u003cstrong\u003eresearch\u003c/strong\u003e, and even spent time building skills in the \u003cstrong\u003evideo game and animation industry\u003c/strong\u003e. I wasn't lost, I was learning what I was made of. Every twist and turn taught me something about myself, and eventually it all clicked into place. Now I use everything I've learned to help students like you find \u003cem\u003etheir\u003c/em\u003e path, even if it's not a straight line.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA little about me:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e🎮 Video game enthusiast and someone who actually devloped my skills for the gaming industry!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e🛸 Designed and built my own drone from scratch with friends!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e🔬 Has experience in the medical field and research\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eA Columbia engineer who still makes time to bake, listen to music and have fun!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePassionate about helping students from all backgrounds discover opportunities they never knew existed\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI'm not your typical \"sit down and take notes\" mentor. I want our sessions to feel like talking to someone who \u003cem\u003egets it\u003c/em\u003e. Someone who has explored, pivoted, figured it out, and came out the other side with real, useful advice.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHere's what I can help you with:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuilding confidence\u003c/strong\u003e — so you walk into interviews, applications, and new spaces knowing your worth!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege applications\u003c/strong\u003e — from crafting your personal story to picking the right schools\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFinding your edge\u003c/strong\u003e — internships, pre-college programs, competitions, and extracurriculars that set you apart \u003cem\u003eand\u003c/em\u003e genuinely excite you\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003eMy goal for every student I work with:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eLeave our sessions knowing more about yourself, more about what's possible, and with a clear, actionable plan to get there. I don't just want to check boxes with you, I want to help you build a future you're actually excited about. And if you're still figuring out what that looks like? That's totally okay! That's exactly what I'm here for.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether you're in 7th grade just starting to think about your path, or a senior racing against application deadlines, there's something we can work on together.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eLet's build your story, the right way!\u003c/strong\u003e 🚀\u003c/p\u003e","teachingVideoPlaybackId":"6ZmCF1HWorm1k4qXQUiisN7up6f5vUTlf3xHBER2wy8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGrowing up as the firstborn daughter in a Hispanic household, I faced challenges that pushed me to work twice as hard to carve out my own path. Without a roadmap, I built myself up from nothing, from: developing programs, drones, video games, and animations, conducting research aimed at giving back to my community, and presenting my work at conferences. What makes me most proud is not just what I have built, but my commitment to making sure others don't have to figure it out alone. I am passionate about sharing my knowledge and mentoring the next generation, because every milestone I reach is an opportunity to open a door for someone else.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a86bb5a1-44c6-4b46-ac54-4a2fcab53277\"}"},{"__ref":"Favorites:{\"uuid\":\"d99346a7-ed16-49f5-9e70-72d562850132\"}"},{"__ref":"Favorites:{\"uuid\":\"41104bfe-52ba-4660-a96a-95bb8d840aea\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"28e579b7-27f0-4001-8514-50a77288c352\"}"},{"__ref":"CausesSupported:{\"uuid\":\"1277e1dc-6276-4889-8b22-9f861d9cd538\"}"}],"major":"Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e80bdd7c-b0c0-4bc7-bf28-918ae93ad9f9\"}"},{"__ref":"DeepDives:{\"uuid\":\"47f7b1ed-095c-4ba8-ae2c-6edd4f9d1ddf\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ef0516d-38f4-4fd9-a843-f929937992f8\"}"},{"__ref":"DeepDives:{\"uuid\":\"6f7285a1-b4fb-441c-a035-bffa05b1bda2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/584086a2-0bc1-402c-805c-7f29c7e689d5/-/preview/-/format/jpg/","https://ucarecdn.com/9b881dc2-3657-47d5-8f1f-388a99c1bc09/-/preview/-/format/jpg/","https://ucarecdn.com/69981ff5-5c54-4e56-b454-4354e5502a21/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"E
