xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"55f296d1-73b9-4c2b-a1d0-823ec41451c9\"}":{"__typename":"Favorites","uuid":"55f296d1-73b9-4c2b-a1d0-823ec41451c9","photoUrl":"https://ucarecdn.com/ebda717f-d2f3-4116-8a2a-c21163d03fd9/","title":"CJ Stroud","type":"ATHLETE"},"Favorites:{\"uuid\":\"fb9f37b9-558c-4bbd-b722-4322a2cd6f94\"}":{"__typename":"Favorites","uuid":"fb9f37b9-558c-4bbd-b722-4322a2cd6f94","photoUrl":"https://ucarecdn.com/e765ed31-5d92-47ba-8c16-db772f45481c/","title":"The Melodic Blue","type":"ALBUM"},"Favorites:{\"uuid\":\"7b961427-bc40-4a31-9f96-ff327420f6d7\"}":{"__typename":"Favorites","uuid":"7b961427-bc40-4a31-9f96-ff327420f6d7","photoUrl":"https://ucarecdn.com/7538995f-e98c-4af9-b3d5-abbd44e57051/","title":"Don Toliver","type":"ARTIST"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2791ed9c-de60-4175-8fc8-1f11a7441ace\"}":{"__typename":"DeepDives","uuid":"2791ed9c-de60-4175-8fc8-1f11a7441ace","content":"\u003cp\u003eSurprisingly enough, I didn’t spend a lot of time on sports analytics during my high school summers. I was a competitive debater, so my summers were spent attending camps and researching potential arguments. Additionally, I did psychology and neuroscience research and spent my free time creating content for my football account. I also spent my weekends travelling around Massachusetts and playing competitive cricket.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile these activities may seem completely different, having experience in different areas allowed me to comfortably narrow down my main interests and pursue my true passions in college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a98ac367-f479-4fef-97d5-39048ca05138\"}":{"__typename":"DeepDives","uuid":"a98ac367-f479-4fef-97d5-39048ca05138","content":"\u003cp\u003eAs of right now, I am double majoring in Quantitative Social Science and Mathematical Data Science.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eQuantitative Social Science (QSS) is a really interesting major that is relatively unique to Dartmouth. I knew I wanted coding experience, but was never interested in pure computer science. QSS is essentially data science with a focus in any social science discipline. This can range from psychology to anthropology to economics. QSS allows me to receive an interdisciplinary education and also shows me the practical applications of data analytics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI chose to major in Mathematical Data Science because I am passionate about machine learning and realized I needed the mathematical expertise to understand how certain aspects of machine learning are possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3cd7d745-f397-40de-ae18-e2e5b2f43ee1\"}":{"__typename":"DeepDives","uuid":"3cd7d745-f397-40de-ae18-e2e5b2f43ee1","content":"\u003cp\u003eMy passion project last year was creating a metric that measures the value of every single player in the National Football League. Pro Football Reference has a statistic called “Approximate Value”, which measures how good a player’s season truly was. This statistic is standardized across every position. While this statistic is good at measuring a player’s individual season, it does not tell us how valuable the player currently is.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI modified this statistic by weighing a player’s last five seasons and also added factors that account for age and position. I called this final statistic “Present Approximate Value” or PAV for short. I was also able to find the expected PAV for every draft pick in the NFL Draft. Using this creation, I was able to evaluate past trades and propose future trades that I deemed fair.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI ended up publishing my work to the Dartmouth Sports Analytics journal and presented my research at conferences in Ohio State and UConn.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"621b3d7b-4d6c-436e-a769-24f2bdb4768e\"}":{"__typename":"DeepDives","uuid":"621b3d7b-4d6c-436e-a769-24f2bdb4768e","content":"\u003cp\u003eI believe that my role as a mentor is equipping my mentee with the tools to turn an interest into a tangible product. Everyone has interests and I know that trying to follow those interests can be daunting. Especially in sports analytics where there is so much content and it may be difficult to find a place to start.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy job is to guide my mentee through the entire process. From coming up with a topic, to finding the data for analysis, to finding places to showcase work. My enthusiasm for sports shows no bounds and I am excited to share my passions with like-minded mentees.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"52f855e9-a7b3-4fb7-80fe-e7cf052e2686\"}":{"__typename":"School","uuid":"52f855e9-a7b3-4fb7-80fe-e7cf052e2686","name":"Lexington High School","city":"Lexington","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02421"},"Education:{\"uuid\":\"8feb2844-f308-4890-ad4d-a3fe99fdea86\"}":{"__typename":"Education","uuid":"8feb2844-f308-4890-ad4d-a3fe99fdea86","school":{"__ref":"School:{\"uuid\":\"52f855e9-a7b3-4fb7-80fe-e7cf052e2686\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"7fd4902c-7f45-48d4-a6f4-e16e8047fbce\"}":{"__typename":"Education","uuid":"7fd4902c-7f45-48d4-a6f4-e16e8047fbce","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"a4c7824d-e504-4b3d-a45e-81493c6e2248\"}":{"__typename":"MentorPublicProfile","uuid":"a4c7824d-e504-4b3d-a45e-81493c6e2248","displayName":"Atul V.","slug":"atul-venkatesh","biography":"\u003cp\u003eAtul is a sophomore at Dartmouth College majoring in Quantitative Social Science and Mathematical Data Science. Atul has lived his entire life in the suburbs of Boston. As a result, he is a diehard fan of the Boston Celtics, Boston Red Sox, Boston Bruins, and weirdly enough, the Green Bay Packers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAtul took his interest in sports to the next level as a high school freshman, where he created an Instagram account to post opinions, statistics, and infographics related to the National Football League. Fast forward over four years and the account, named gridirongridlock, has grown to over 13,000 followers. In the midst of the busy life of a college student, Atul always sets time aside to make a daily post.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEntering college, Atul was introduced to the world of sports analytics. It was at this moment he realized that sports could be more than a hobby.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAtul is most passionate about machine learning, data analytics, and its intersection with sports analytics. He has conducted research on everything from Major League Baseball to the Professional Women’s Hockey League and has presented his work to professional teams and experts in the industry.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, Atul is captain of Dartmouth’s Club Ultimate Frisbee team and Head of Research for Dartmouth Sports Analytics. When not immersing himself in sports, Atul enjoys lifting weights, listening to music, and hanging out with friends.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAtul is excited to share his passion, teaching everything he knows and uncovering the mysteries of sports analytics one step at a time!\u003c/p\u003e","teachingVideoPlaybackId":"00XiS014a6El7Jr4dzkGNkA5UEYJVhRWWkRHD138r9i6Q","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement so far is getting my football analytics account to 10,000 followers. It represented the culmination of four years of hard work and truly reflected my love for the sport!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"55f296d1-73b9-4c2b-a1d0-823ec41451c9\"}"},{"__ref":"Favorites:{\"uuid\":\"fb9f37b9-558c-4bbd-b722-4322a2cd6f94\"}"},{"__ref":"Favorites:{\"
