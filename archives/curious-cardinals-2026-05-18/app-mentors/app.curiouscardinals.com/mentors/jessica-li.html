xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a1d8650f-5286-4af9-9c6d-ac624df6449a\"}":{"__typename":"Favorites","uuid":"a1d8650f-5286-4af9-9c6d-ac624df6449a","photoUrl":"https://ucarecdn.com/d4a05879-c287-4a6e-ae85-6596dfad7bc0/","title":"Fly Me To The Moon by Count Basie and Frank Sinatra","type":"SONG"},"Favorites:{\"uuid\":\"02450b90-d259-4bb6-930f-85972ad8b91d\"}":{"__typename":"Favorites","uuid":"02450b90-d259-4bb6-930f-85972ad8b91d","photoUrl":"https://ucarecdn.com/d4a05879-c287-4a6e-ae85-6596dfad7bc0/","title":"Fred Again","type":"ARTIST"},"Favorites:{\"uuid\":\"6147986d-da79-47cb-aae4-83e30a479077\"}":{"__typename":"Favorites","uuid":"6147986d-da79-47cb-aae4-83e30a479077","photoUrl":"https://ucarecdn.com/d4a05879-c287-4a6e-ae85-6596dfad7bc0/","title":"New York","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"eb690daf-2cdb-4542-aeba-f5af73910d7c\"}":{"__typename":"DeepDives","uuid":"eb690daf-2cdb-4542-aeba-f5af73910d7c","content":"\u003cp\u003eEverything will work out at the end. Academics are important, but so is your mental health. Go spend more time with your friends and family, try new things, and join more organizations!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"28e4a4da-bd51-4b1f-bf61-ff37477c6d4a\"}":{"__typename":"DeepDives","uuid":"28e4a4da-bd51-4b1f-bf61-ff37477c6d4a","content":"\u003cp\u003eIn my lifetime, I hope to have a career that allows me to help marginalized and underrepresented groups. I want to do my part and help spread some joy in the world!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c4df2a14-844d-440c-905e-f5105b17ed9c\"}":{"__typename":"DeepDives","uuid":"c4df2a14-844d-440c-905e-f5105b17ed9c","content":"\u003cp\u003eMy dream job is to become a dentist and provide services to those who cannot afford proper dental care. I also hope to be a dentist that people can go to without fear or anxiousness.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e342caf9-f047-4c6e-8d96-0bb2702b1f65\"}":{"__typename":"DeepDives","uuid":"e342caf9-f047-4c6e-8d96-0bb2702b1f65","content":"\u003cp\u003eIn high school, I spend my summers by studying for the SAT, traveling with family, and volunteering at nearby non-profit organizations. Throughout the four years, I volunteered at DOROT where I visited senior citizens in NYC, and I participated in the Leukemia and Lymphoma Society's Student of the Year Program where I raised about $10,000 with a team for a child diagnosed with leukemia. Having been raised in a household where we love to give back, I used my time to help those who could use an extra hand or just needed company.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"2c8893e7-5a78-4fd2-9ad4-ddc354b50d57\"}":{"__typename":"School","uuid":"2c8893e7-5a78-4fd2-9ad4-ddc354b50d57","name":"Bayside High School","city":"Bayside","type":"HIGH","state":"New York","country":"United States","zip":"11361"},"Education:{\"uuid\":\"4b6c8fdb-b109-45c6-95fb-5066d394f111\"}":{"__typename":"Education","uuid":"4b6c8fdb-b109-45c6-95fb-5066d394f111","school":{"__ref":"School:{\"uuid\":\"2c8893e7-5a78-4fd2-9ad4-ddc354b50d57\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"03a2abb2-bd5a-415e-b813-d39bcd0ebfd1\"}":{"__typename":"Education","uuid":"03a2abb2-bd5a-415e-b813-d39bcd0ebfd1","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"d0529f75-7ec0-4339-969a-ea89893bbdcc\"}":{"__typename":"MentorPublicProfile","uuid":"d0529f75-7ec0-4339-969a-ea89893bbdcc","displayName":"Jessica L.","slug":"jessica-li","biography":"\u003cp\u003eJessica is a senior at Cornell University majoring in Biological Sciences with a concentration in Molecular and Cell Biology and minoring in Creative Writing and Human Development. Originally from Queens, New York, Jessica is on the pre-dental track and will be studying at the Stony Brook School of Dental Medicine this upcoming semester for her DDS.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eAt Cornell, she has been a part of a plethora of publication magazines. Although she is studying in the sciences, she enjoys writing whether that is creative nonfiction, prose, or poetry. This past year, she was the Editorial Lead of Collective X, a publication magazine that focuses on underrepresented groups on campus, as well as the writer and editor for the Cornell Healthcare Review. Throughout her college career, she has been published in Thread Magazine, Creme de Cornell, Collective X, and the Cornell Healthcare Review. Currently, she is continuing her interest that stemmed from high school as the Secretary of the Cornell Elderly Partnership, a club where students collectively volunteer at nearby senior citizen centers in Ithaca. On top of that, she is a Document Conversion Assistant at the Student Disabilities Services Center at her campus. Hoping to improve accessibility for all individuals, she aims to help make everything around her more inclusive whether that is writing or learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eBeyond academics, she loves to spend time with her friends and family. You will most likely find Jessica exploring new hikes, knitting at a cafe, writing in the library, or learning how to DJ. She likes the thrill of trying new things and is always open to suggestions and willing to learn with you!\u003c/p\u003e","teachingVideoPlaybackId":"oJpPdOMi8HEoC6lmMBmjG7RhTkbkdmYOgOJRkIk9aPg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a1d8650f-5286-4af9-9c6d-ac624df6449a\"}"},{"__ref":"Favorites:{\"uuid\":\"02450b90-d259-4bb6-930f-85972ad8b91d\"}"},{"__ref":"Favorites:{\"uuid\":\"6147986d-da79-47cb-aae4-83e30a479077\"}"}],"causesSupported":[],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"eb690daf-2cdb-4542-aeba-f5af73910d7c\"}"},{"__ref":"DeepDives:{\"uuid\":\"28e4a4da-bd51-4b1f-bf61-ff37477c6d4a\"}"},{"__ref":"DeepDives:{\"uuid\":\"c4df2a14-844d-440c-905e-f5105b17ed9c\"}"},{"__ref":"DeepDives:{\"uuid\":\"e342caf9-f047-4c6e-8d96-0bb2702b1f65\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f726af1a-bcb7-4062-9477-92b761734253/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gende
