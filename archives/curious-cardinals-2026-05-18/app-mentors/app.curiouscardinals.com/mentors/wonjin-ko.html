ed from Brown University in May 2025 with a degree in Chemical Biology.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOne of the best parts of my college experience was Brown’s open curriculum, which encouraged me to explore diverse interests beyond my major. I had the opportunity to take classes in art, entrepreneurship, and data science, which gave me a lot more perspective into what I really wanted to study and pursue. I really believe that education is most helpful and real when it combines multiple perspectives, and I want to implement that into everything I learn and teach.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA lot of my undergraduate experience focused on research. I’ve worked in computational chemistry, building computer models of molecules; in translational research, designing hydrogel scaffolds to improve tendon healing; and now in clinical research, where I study surgical outcomes with orthopedic surgeons at the American Hip Institute in Chicago. This last role has been really exciting because it blends medicine and statistics, and allows me to see how data can improve patient care. In addition to research, I also work as a medical assistant and scribe, which gives me firsthand experience in patient care.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the lab and clinic, I’ve always enjoyed teaching and mentoring. At Brown, I worked as an Undergraduate Teaching Assistant for both General Chemistry and Organic Chemistry Lab, where I led review sessions, guided experiments, and helped students understand difficult concepts. I also developed communication skills as a Managing Editor of Brown’s science publication, The Triple Helix, where I translated complex research into accessible and engaging stories for the general public. These experiences grew my interest in mentoring after college, helping students translate interests into real-world applications.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also on the pre-medical track and currently in my gap years before medical school. A passion of mine is addressing health disparities and the social determinants of health. I’ve volunteered at homeless shelters in Los Angeles, worked with Connect for Health in Providence to connect underserved patients with essential resources, and served as a hospice volunteer offering comfort to patients facing terminal illness.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I’ve always been active in sports. In high school, I swam varsity and played water polo, and I’ve continued to stay involved through club swim and intramural sports. I still love playing basketball and pickup games with friends.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, I’m excited to work with Curious Cardinals mentees to share my experiences and help them explore their own passions, whether in science, medicine, or beyond!\u003c/p\u003e","teachingVideoPlaybackId":"wecXzt3dSVS1Pba00tsmz3ObaUNuodAf7qkDrwWnGCmE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"90ab43e5-9741-4725-bda2-bb21e593f477\"}"},{"__ref":"Favorites:{\"uuid\":\"7ac0839f-5c59-471f-b0f5-a659d90d2897\"}"},{"__ref":"Favorites:{\"uuid\":\"e08ccb2a-f8b1-4d25-851b-851cfd111c46\"}"}],"causesSupported":[],"major":"Chemical Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"521de2ad-9307-497c-9632-f4babfb00f5b\"}"},{"__ref":"DeepDives:{\"uuid\":\"eef51dbb-31ef-45fb-b1e2-137cbea0d019\"}"},{"__ref":"DeepDives:{\"uuid\":\"429b4a9b-534f-4e50-921e-a3421e29df7f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fe4f0ee4-d514-4a9a-b54e-fead55bca677/-/preview/-/format/jpg/","https://ucarecdn.com/8b7c4950-9e17-4b6e-8ecf-bb22f937c93f/-/preview/-/format/jpg/","https://ucarecdn.com/eda3fb96-2c5c-4e72-bec3-80fefca2ab42/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"410d7af4-b0c1-4f27-9f22-a899d18a9907\"}"},{"__ref":"Education:{\"uuid\":\"b51912e9-7a64-4529-b7ca-7
