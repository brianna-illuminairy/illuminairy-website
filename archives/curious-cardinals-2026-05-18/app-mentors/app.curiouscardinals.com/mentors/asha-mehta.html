8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Physics and Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"27628642-55c5-49c6-85f5-5c55831027b6\"}":{"__typename":"MentorPublicProfile","uuid":"27628642-55c5-49c6-85f5-5c55831027b6","displayName":"Asha M.","slug":"asha-mehta","biography":"\u003cp\u003eHi! My name is Asha and I study physics and political science at Northwestern University. Academically, I'm passionate about the intersection of transportation, community, and the environment - although I am fascinated by absolutely everything. I also love learning languages, and dream of working abroad in an embassy for a year or two. Outside of academics, I really enjoy hiking, rock climbing, writing, and hanging out with my dogs (my ideal day involves all four!). I mostly write creatively, specifically fantasy/magical realism novels, and have dabbled in playwriting, composing, visual art, and songwriting as well. \u003c/p\u003e\u003cp\u003eI'm in my third year of undergrad right now, and hope to go on to pursue a joint JD/MPP - ie. I'd like to study the law, and then learn how to change it. I don't see myself as someone who sticks to one straightforward path her whole life; I aspire to jump throughout different fields within policy over the course of my life, and I hope to never stray from my love of creative writing or the outdoors.\u003c/p\u003e\u003cp\u003eWhen I was in high school, during the pandemic, I kept hearing stories of people stuck in horrible home situations, aggravated by lockdown. I was so frustrated and unhappy, because I believed I was too young to do anything to help them. Bored, and home alone, I started making TikToks with my mom talking about our lives, hoping our stories would reach and inspire some people. We had no idea just how much it would blow up. Armed with this newfound platform, with which I could share my voice and make a genuine impact, I found a sense of empowerment that most teenagers are not lucky enough to find. With it, I created an online safe space for youth stuck in bad household environments, which reached over 100,000 people. I got to make a genuine impact on the world - I got to see that that was possible, even at a young age.\u003c/p\u003e\u003cp\u003eWhether it's activism, art, research, volunteering, or anything else - I want to help young people find the opportunity that I did to get started on life, and on pursuing their passions. I hope to find that spark of inspiration, passion, and motivation within my students and show them they don't have to stifle it until they're older. I believe that every single young person is equally capable of pursuing a passion project as an adult.\u003c/p\u003e","teachingVideoPlaybackId":"UcAXNN8VNYCnMOQPR9oOTsI02B5rrhulkP3y02yX33Z02Q","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBuilding codes might not be the most glamorous thing, but I'm very proud that, alongside the EV Charging for All Coalition, I was able to advocate for adding an EV charging clause to the 2026 California building codes. It's a small thing, but it'll (hopefully) have a pretty big impact.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e01658df-fed7-434d-a972-bd203814d602\"}"},{"__ref":"Favorites:{\"uuid\":\"8c8955f8-ac08-472c-ba33-496dd5792dc7\"}"},{"__ref":"Favorites:{\"uuid\":\"138bbe26-f62c-483e-8ccb-2797f73c5e95\"}"}],"causesSupported":[],"major":"Physics and Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c96af7d1-8c5d-41ec-8c98-4726886785de\"}"},{"__ref":"DeepDives:{\"uuid\":\"b647fca5-ff60-497b-b44b-0a1519948f62\"}"},{"__ref":"DeepDives:{\"uuid\":\"14350e71-7952-46e8-84a5-5b890b7161d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"25708adb-3df6-4d3c-a5e4-bd6d4fafd9ee\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4f186a77-cff0-4581-a4de-13a04c685c94/-/preview/-/format/jpg/","https://ucarecdn.com/f7e96706-523c-46a0-b726-1516c2affdaa/-/preview/-/fo
