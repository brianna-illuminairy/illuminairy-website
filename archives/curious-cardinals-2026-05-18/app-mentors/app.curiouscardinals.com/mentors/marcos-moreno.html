xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"187194ae-e3bb-4e1f-8ede-b9e564bd438e\"}":{"__typename":"Favorites","uuid":"187194ae-e3bb-4e1f-8ede-b9e564bd438e","photoUrl":"https://ucarecdn.com/81484c34-9707-4839-b77b-37c84dca47aa/","title":"Baseball","type":"SPORT"},"Favorites:{\"uuid\":\"426200de-1d51-40d4-8418-90ac3962fc39\"}":{"__typename":"Favorites","uuid":"426200de-1d51-40d4-8418-90ac3962fc39","photoUrl":"https://ucarecdn.com/df4a7b1f-514a-4497-8bfb-177177462d88/","title":"Batman Arkham Series","type":"GAME"},"Favorites:{\"uuid\":\"2a62c687-462a-47be-8a00-70572c9c63b4\"}":{"__typename":"Favorites","uuid":"2a62c687-462a-47be-8a00-70572c9c63b4","photoUrl":"https://ucarecdn.com/15620f8d-0f0f-4429-97d1-eac82af25608/","title":"Kendrick Lamar","type":"ARTIST"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"0fa44d18-241a-4968-ae24-f95b193a9f1a\"}":{"__typename":"DeepDives","uuid":"0fa44d18-241a-4968-ae24-f95b193a9f1a","content":"\u003cp\u003eMy dream job is to be a Senior Software Engineer at Spotify. Overall, I love music and am constantly using the mobile/computer app and have some improvements I'd like to implement. It would also be really cool to implement changes to something that my family and friends use.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"4675dbb6-fc39-40a3-88fe-1c4381be3a06\"}":{"__typename":"DeepDives","uuid":"4675dbb6-fc39-40a3-88fe-1c4381be3a06","content":"\u003cp\u003eMy greatest source of motivation is my family. To begin, my parents didn't attend university and worked really hard to raise myself and siblings. I aspire to make them proud and show them that the American Dream still exists. In addition, I have two younger siblings that I know look up to me. Because of this, I know i have to be the example and shoe them that they can achieve a lot despite any obstacles that present themselves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"a9b456b3-8d3c-4da6-bf36-d45864a0c680\"}":{"__typename":"DeepDives","uuid":"a9b456b3-8d3c-4da6-bf36-d45864a0c680","content":"\u003cp\u003eDuring my high school summers,  usually spent them working to help my family and looking forward to car events. For example, I spent two summers at a small local insurance office as a filer and janitor and another summer I worked at Shoe Palace. However, my uncle would take me to car meets every weekend in and outside our city. Growing up, these were core memories for me and inspired my hobby of cars too!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"4dbc66d4-8b0b-4cb2-ba15-d5959526ce85\"}":{"__typename":"DeepDives","uuid":"4dbc66d4-8b0b-4cb2-ba15-d5959526ce85","content":"\u003cp\u003eAs a high school student I was very nerdy to put it simply. I started the Mathletics club, was apart of the Robotics club, and also co-founded a local tutoring org. I was very much into gaming, legos, and videography. I wasn't very good at English since it wasn't my first language, but I made up for it in Math and Science subjects.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"460d3d9f-4e01-461d-b35b-b8668a95d2fb\"}":{"__typename":"School","uuid":"460d3d9f-4e01-461d-b35b-b8668a95d2fb","name":"Alisal High School","city":"Salinas","type":"HIGH","state":"California","country":"United States","zip":"93905"},"Education:{\"uuid\":\"43ed6a70-db54-4cc8-8c1f-9446d18acc83\"}":{"__typename":"Education","uuid":"43ed6a70-db54-4cc8-8c1f-9446d18acc83","school":{"__ref":"School:{\"uuid\":\"460d3d9f-4e01-461d-b35b-b8668a95d2fb\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"d0a8cb57-6cc6-4e48-9198-4cceccf03008\"}":{"__typename":"Education","uuid":"d0a8cb57-6cc6-4e48-9198-4cceccf03008","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"2217c850-6989-4eee-a791-bb7f3bf77ae6\"}":{"__typename":"MentorPublicProfile","uuid":"2217c850-6989-4eee-a791-bb7f3bf77ae6","displayName":"Marcos M.","slug":"marcos-moreno","biography":"\u003cp\u003eHello, my name is Marcos Moreno Hernandez and I’m a senior at UC Berkeley studying Computer Science. Growing up, I spent countless hours immersed in gaming, and my curiosity about the mechanics behind these digital worlds led me to explore coding, hardware, and software development. This curiosity blossomed into a full-blown passion, and I eventually pursued it academically by majoring in CS at one of the most prestigious universities for computer science in the world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a student at UC Berkeley, I’ve gained a solid understanding of the theoretical and practical aspects of computer science. My education has given me knowledge that I can draw from in a wide range of areas within technology. I have also built software for various organizations ranging from local non-profits to interning in San Francisco. But despite my technical knowledge, it’s not just about coding for me, it’s about helping others understand and enjoy it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve always found great joy in teaching, which is why I am excited to be part of the Curious Cardinals mentorship program. Through previous mentorship opportunities with other organizations, I’ve learned how rewarding it is to guide students through their struggles and celebrate their successes. I believe that every student has unique strengths, and I’m passionate about helping them build confidence in their abilities, whether they’re struggling with math, computer science concepts, or any other subject.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy teaching approach is rooted in patience, encouragement, and creativity. I aim to break down complex topics into manageable chunks and make learning fun and accessible. I’m here to help students not just get better grades but also develop a genuine love for learning, just as I did. Whether you're struggling with coding assignments, preparing for exams, or just curious about computer science in general, I’m excited to work with you and help you succeed!\u003c/p\u003e","teachingVideoPlaybackId":"8p00aoFC6lUKAfMRROjmZt4kDiP15eYfA01ez84XrCYLw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"F
