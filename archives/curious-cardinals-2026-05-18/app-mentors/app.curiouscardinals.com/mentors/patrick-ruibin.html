xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"8b0d7339-9e24-4398-8840-e5aef72efcb0\"}":{"__typename":"DeepDives","uuid":"8b0d7339-9e24-4398-8840-e5aef72efcb0","content":"\u003cp\u003eMentorship matters to me because I am forever indebted to all the mentors I had during my educational progression. It takes a village, and I would not be the same person both inside and outside the classroom without mentors. I also derive deep joy and meaning from engaging in mentoring, as it is a way to give back in a personally fulfilling way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f7015742-12fe-429d-a5fc-a99549e98cc7\"}":{"__typename":"DeepDives","uuid":"f7015742-12fe-429d-a5fc-a99549e98cc7","content":"\u003cp\u003eChoosing my major required a convoluted journey and lots of reflection. While computer science isn't exactly the most unique choice, I started Stanford in Structured Liberal Education, one of the most rigorous humanities spaces on campus. I also had interests in theoretical math and statistics that pulled me in other directions. Over time, I've realized that doing Human-Computer Interaction, a subfield of CS, gives me the best shot at using my interests in math, statistics, and pedagogy to benefit as many people as possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"2baed1f4-70aa-49bf-ad6a-7fb3882b36fd\"}":{"__typename":"DeepDives","uuid":"2baed1f4-70aa-49bf-ad6a-7fb3882b36fd","content":"\u003cp\u003eI'm the son of a professor, so I guess teaching is in the blood. I've experienced one-on-one mentoring since my earliest waking memories. I still have a list of the books my dad read to me before bed as early as I can recall, dense books about history, culture, medical conditions, etc. Not your standard bedtime fare. While a lot of the details are fuzzy, I am left with the teaching philosophy that kids are capable of far, far more than they get credit for, and thoughtful and kind exposure to hard concepts will delight instead of challenge.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c23aa487-9164-4fa9-935b-0f31903bc394\"}":{"__typename":"DeepDives","uuid":"c23aa487-9164-4fa9-935b-0f31903bc394","content":"\u003cp\u003eIn my lifetime, I hope to get my academic interests to connect in a way that tangibly benefits others. I like dabbling in the humanities, I like theoretical statistics and math, I like data science, I like computer science, and so on. While I could spin a really nice narrative on how everything meshes perfectly together, that would not be respectful to the nuances of what actual learning is like. For example, I've taken a LOT of both theoretical and applied statistics courses, but I still don't know enough to have them perfectly fit together and improve my understanding of both. Nevertheless, I know the answer is out there and will come with time, and I hope to one day work on projects that help others while using every academic muscle I've so painstakingly developed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"be375ad9-dc4c-42eb-9347-d2d1e24d00df\"}":{"__typename":"School","uuid":"be375ad9-dc4c-42eb-9347-d2d1e24d00df","name":"West Lafayette Junior/Senior High School","city":"West Lafayette","type":"HIGH","state":"Indiana","country":"United States","zip":"47906"},"Education:{\"uuid\":\"1d4a945a-cbbe-40a9-a9ce-987e04df7f5d\"}":{"__typename":"Education","uuid":"1d4a945a-cbbe-40a9-a9ce-987e04df7f5d","school":{"__ref":"School:{\"uuid\":\"be375ad9-dc4c-42eb-9347-d2d1e24d00df\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"acece96a-8480-474a-98d2-674e6244c3ea\"}":{"__typename":"Education","uuid":"acece96a-8480-474a-98d2-674e6244c3ea","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"42ca3890-a303-48d2-a097-a8f9cdad6693\"}":{"__typename":"MentorPublicProfile","uuid":"42ca3890-a303-48d2-a097-a8f9cdad6693","displayName":"Patrick L.","slug":"patrick-ruibin","biography":"\u003cp\u003eHi! I've benefitted immensely from close mentoring relationships, both academically and otherwise. When you find that someone both cares about your growth and is knowledgeable enough to help you with it, something really special happens. I'm really passionate about sharing that joy with others. In high school, I coached the math club, and I teach elementary schoolers around Stanford to read. Through these experiences, I've gotten both sides of the mentor-mentee relationship, and I hope to work as a team with you so we can both grow together!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy academic interests are related to computation in all of its forms. While I'm majoring in computer science, I'm also planning to minor in both math and statistics. I am especially passionate about introducing students to statistics early as not a lot of focus goes into studying this in most high schools. In a world where AI and huge datasets are becoming increasingly important, it would be a huge disservice not to learn statistics and other discrete math.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have been fortunate to be a part of some excellent research teams, mostly focused on Human-Computer Interactions, one of the most interdisciplinary subfields of computer science. In high school, I was a researcher for Professor Ming Yin's lab at Purdue University. I co-authored 2 papers, one of which won the Best Paper award in CSCW 2022, and the other recently accepted to CHI 2025 after a long revision process. I hope to put my research experience at service to any prospective mentees looking at a more individualized project outside of their existing coursework.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also have taken part in a year long humanities intensive, so I can draw upon less quantitative knowledge as needed! This experience taught me that writing papers can be fun, and in my final project I got the chance to analyze one of my favorite comic books, The Sandman, through a Nietzschean lens. While my professional interests are in STEM, my experience of humanities pedagogy, small classes, and feeling closer to my instructors has definitely formed the way I approach education. Good teaching practices carry over regardless of topic, and I would be super excited to share my best try at a mutually rewarding educational relationship with any prospective mentees!\u003c/p\u003e","teachingVideoPlaybackId":"ItKRrCPrExUf01BxxPJBdaTtO4LriNBwmAcV02CFa8y7U","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8b0d7339-9e24-4398-8840-e5aef72efcb0\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7015742-12fe-429d-a5fc-a99549e98cc7\"}"},{"__ref":"DeepDives:{\"uuid\":\"2baed1f4-70aa-49bf-ad6a-7fb3882b36fd\"}"},{"__ref":"DeepDives:{\"uuid\":\"c23aa487-9164-4fa9-935b-0f31903bc394\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/93e79687-57f6-406d-a4e1-4b57aab53002/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1d4a945a-cbbe-40a9-a9ce-987e04df7f5d\"}"},{"__ref":"Education:{\"uuid\":\"acece96a-8480-474a-98d2-674e6244c3ea\"}"}],"hiredAt":"2025-03-23T15:53:54.428Z","topics":["Coding / Programming","Machine Learning / AI","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Writing","Algebra I","Algebra II"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"patrick-ruibin\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"42ca3890-a303-48d2-a097-a8f9cdad6693\"}"}}},"_sentryTraceData":"818df6c40ac3439eb4cce50b059d103d-97db53fd797b9077-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=818df6c40ac3439eb4cce50b059d103d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"patrick-ruibin"},"buildId":"ZAcrs1hPe6xcPEu
