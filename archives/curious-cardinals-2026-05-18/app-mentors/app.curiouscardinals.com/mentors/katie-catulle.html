xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e538d89f-8699-4bc1-9697-b4016eb911db\"}":{"__typename":"Favorites","uuid":"e538d89f-8699-4bc1-9697-b4016eb911db","photoUrl":"https://ucarecdn.com/39c421fa-ef89-4117-8d4f-ce3a2ed3a7ce/","title":"Dublin","type":"CITY"},"Favorites:{\"uuid\":\"0e8312da-201f-40b2-8c34-139e5937374d\"}":{"__typename":"Favorites","uuid":"0e8312da-201f-40b2-8c34-139e5937374d","photoUrl":"https://ucarecdn.com/df421488-a562-4920-a322-c8efe6d191f8/","title":"The Waves","type":"BOOK"},"Favorites:{\"uuid\":\"9594e3ea-3ecd-4c42-92fe-3c6ba13438d0\"}":{"__typename":"Favorites","uuid":"9594e3ea-3ecd-4c42-92fe-3c6ba13438d0","photoUrl":"https://ucarecdn.com/a34178db-a23c-4df6-9f7d-e4c9f05f3bb2/","title":"Taylor Swift","type":"ARTIST"},"CausesSupported:{\"uuid\":\"1e0d020b-e697-4277-a2fe-08357bb7e57a\"}":{"__typename":"CausesSupported","uuid":"1e0d020b-e697-4277-a2fe-08357bb7e57a","name":"Landon's Library","description":"\u003cp\u003ePromotes early childhood literacy in my hometown.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/d1fac531-8576-497a-8f7b-9374a0a95d23/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"0e132860-270f-4f0a-a0ff-b0cd86ef311f\"}":{"__typename":"DeepDives","uuid":"0e132860-270f-4f0a-a0ff-b0cd86ef311f","content":"\u003cp\u003eI would tell my younger self not to be afraid to be myself. I wish I had fully embraced who I was—all of my passions, talents, quirks, and individuality to the fullest of my ability. It can be scary, but so worth it!! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9e47c7fe-a604-4486-90b0-953833c66622\"}":{"__typename":"DeepDives","uuid":"9e47c7fe-a604-4486-90b0-953833c66622","content":"\u003cp\u003eI am currently writing a novel—a somewhat daunting task that requires much patience and dedication. The revision process has been a lot of work, but it has been so much fun. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"9a58d000-5da0-4d03-b240-9e3ca51d9f20\"}":{"__typename":"DeepDives","uuid":"9a58d000-5da0-4d03-b240-9e3ca51d9f20","content":"\u003cp\u003eOnce I had a dream that every container in my dorm was replaced with a sterile clear jar, and all of my pens, makeup brushes, q-tips, etc. were gone. I haven't been able to look at a mason jar the same way since...\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"3748b5f0-0d76-4fa7-b4c9-0dad32df01b8\"}":{"__typename":"DeepDives","uuid":"3748b5f0-0d76-4fa7-b4c9-0dad32df01b8","content":"\u003cp\u003eImagination. It is my greatest source of entertainment, and when I am entertained, I am motivated. Imagination, for me, is the source of happiness, something no one can take away. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"0b160bcf-1e3d-4770-9917-188c8109820e\"}":{"__typename":"School","uuid":"0b160bcf-1e3d-4770-9917-188c8109820e","name":"Southern Garrett High School","city":"Oakland","type":"HIGH","state":"Maryland","country":"United States","zip":"21550"},"Education:{\"uuid\":\"253cb51f-67aa-4493-a6ed-1eca127a7845\"}":{"__typename":"Education","uuid":"253cb51f-67aa-4493-a6ed-1eca127a7845","school":{"__ref":"School:{\"uuid\":\"0b160bcf-1e3d-4770-9917-188c8109820e\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"2ec3c13e-f434-4496-ad2b-b73ff4aa0726\"}":{"__typename":"Education","uuid":"2ec3c13e-f434-4496-ad2b-b73ff4aa0726","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"578be865-afa0-4ea4-a146-b6c1d377293a\"}":{"__typename":"MentorPublicProfile","uuid":"578be865-afa0-4ea4-a146-b6c1d377293a","displayName":"Katie C.","slug":"katie-catulle","biography":"\u003cp\u003eAfter graduating from Harvard with a degree in English, Katie is now pursuing an MPhil on a fellowship at Cambridge University in the same field. Katie loves to read almost as much as she loves to write, and she looks forward to working with mentees also looking to unlock their passion for the written word. Her favorite writers include Virginia Woolf, Emily Dickinson, and the Bronte Sisters, though she once told a professor that she fell in love by reading The Selection Series.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond her academic work, Katie is passionate about her creative writing. Her poems and short stories have appeared in Forever Mag, The Harvard Advocate, and Poetry Ireland Review, to name a few. While at Harvard, she was a member of the fiction board on the oldest continuously published collegiate literary magazine, and she also co-founded a creative writing club in her residential community.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOriginally from a small town in the western corner of Maryland, Katie is passionate about educational accessibility for learners from all places and backgrounds. As the first person in her high school to go to Harvard, she understands the challenges (and rewards!) of new experiences, and she is excited to help mentees reach their goals.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eKatie has been working with students for over four years, and has helped learners of all ages (K-12), in a variety of subjects, from critical reading skills, creative writing, math, and politics. She approaches mentorship from a student centered approach, meeting students where they are at and matching their specific needs and interests with their learning goals.\u003c/p\u003e","teachingVideoPlaybackId":"O1J01jOjy2Nxeo4wmBanu3EYM400biJ5BJxpbPwmz8kbg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIt has been my lifelong dream to travel, and last summer, through a variety of funding opportunities and programs, I was able to visit South Korea, Italy, France, and Greece. I had such a fun time and met so many amazing people. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e538d89f-8699-4bc1-9697-b4016eb911db\"}"},{"__ref":"Favorites:{\"uuid\":\"0e8312da-201f-40b2-8c34-139e5937374d\"}"},{"__ref":"Favorites:{\"uuid\":\"9594e3ea-3ecd-4c42-92fe-3c6ba13438d0\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"1e0d020b-e697-4277-a2fe-08357bb7e57a\"}"}],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0e132860-270f-4f0a-a0ff-b0cd86ef
