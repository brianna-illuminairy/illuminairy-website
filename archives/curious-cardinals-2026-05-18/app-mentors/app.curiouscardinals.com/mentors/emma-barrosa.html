xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f8f4a834-34fd-4300-8a89-323ba4064b1e\"}":{"__typename":"Favorites","uuid":"f8f4a834-34fd-4300-8a89-323ba4064b1e","photoUrl":"https://ucarecdn.com/23a70194-14dd-4a1d-9b28-e4b441ccd3b8/","title":"Siddhartha by Hermann Hesse ","type":"BOOK"},"Favorites:{\"uuid\":\"52db8366-a1f7-44ca-adb2-c63ee38586f1\"}":{"__typename":"Favorites","uuid":"52db8366-a1f7-44ca-adb2-c63ee38586f1","photoUrl":"https://ucarecdn.com/0aa5aa45-404e-4099-87cb-741c28efd59f/","title":"Band of Brothers ","type":"MOVIE"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"81116601-abc1-43f1-bfa7-d265c6c1a60f\"}":{"__typename":"DeepDives","uuid":"81116601-abc1-43f1-bfa7-d265c6c1a60f","content":"\u003cp\u003eAs a researcher for the Hoover Institution, I've been working on a paper about an all-female British unit in World War II that wargamed new anti-submarine tactics for escort commanders to use in the Battle of the Atlantic. This team of 18 to 25 year-old women helped turn the tide in the war, producing 7+ new tactics. My paper will be featured in the Hoover Wargaming Archive in March. I've spent copious amounts of time in British archives, flying out to London twice in the past year to visit the unit's old wargaming space in Liverpool and the Imperial War Museum Archive. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"62c2e379-c227-4c92-b99c-3b4fa8c10f01\"}":{"__typename":"DeepDives","uuid":"62c2e379-c227-4c92-b99c-3b4fa8c10f01","content":"\u003cp\u003eI love passion projects! Every Saturday, I set aside 1-3 hours to just work on my passion projects. At the moment I am:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ecreating a small league of Stanford RC plane and drone enthusiasts \u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ehand carving a large block of wood for my upcoming relief print\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003etraining for a trail run on Angel Island\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eperfecting my latte art at On Call Cafe\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003elearning two new languages (currently German and Russian)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"6b42cd2d-7983-407d-970e-e466d04cd333\"}":{"__typename":"School","uuid":"6b42cd2d-7983-407d-970e-e466d04cd333","name":"Glendora High School","city":"Glendora","type":"HIGH","state":"California","country":"United States","zip":"91741"},"Education:{\"uuid\":\"77cabc97-f6f8-470d-917c-b1123b87ad41\"}":{"__typename":"Education","uuid":"77cabc97-f6f8-470d-917c-b1123b87ad41","school":{"__ref":"School:{\"uuid\":\"6b42cd2d-7983-407d-970e-e466d04cd333\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"1a1c02b1-6b4a-4089-823f-ae343eb362f2\"}":{"__typename":"Education","uuid":"1a1c02b1-6b4a-4089-823f-ae343eb362f2","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"International Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"b4fa2251-0383-475b-b63c-0f12811746d3\"}":{"__typename":"MentorPublicProfile","uuid":"b4fa2251-0383-475b-b63c-0f12811746d3","displayName":"Emma B.","slug":"emma-barrosa","biography":"\u003cp\u003eEmma is a Senior at Stanford University pursing degrees in International Relations and Data Science. She grew up in Southern California and attended Glendora High School where she graduated valedictorian. In high school, Emma loved her AP History courses. She debated on her high school's ethics bowl team and held for state-wide positions in California's YMCA Youth and Government program. Emma is a champion of the phrase \"get out of your comfort zone.\" While shy in elementary school, Emma found that making the uncomfortable comfortable instilled life-changing self-confidence. In middle school, she started small, leading fundraisers at school to raise money for Malala Yousafzai's women's empowerment nonprofit. From public speaking to donor events, she gradually grew more confident in herself and her abilities. Emma is passionate about helping every student discover their unique spark that ignites their potential. At Stanford, you may find her leafing through recently-declassified wargames in the Hoover Archives, whittling a new piece in the printmaking lab, or practicing her German over coffee with a friend. Last summer, she discovered her passion for the defense field while working at NATO's Cyber Defense Center in Tallinn, Estonia. Drawing from my own journey and academic achievements, I bring both empathy and expertise to my tutoring, helping students build not just knowledge, but the confidence to excel in their academic pursuits and beyond.\u003c/p\u003e","teachingVideoPlaybackId":"ZuHfaY00e2fsepzmXEYlkdbUV8W500BPHnpU91kbxyj34","teachingVid
