xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"83b66a03-a4f8-4683-9462-995d1466873f\"}":{"__typename":"Favorites","uuid":"83b66a03-a4f8-4683-9462-995d1466873f","photoUrl":"https://ucarecdn.com/21f08730-9406-41d8-80c5-6f03b0cfe91d/","title":"Stephen Curry ","type":"ATHLETE"},"Favorites:{\"uuid\":\"f667defa-3be0-4de1-a47a-0c7bb9fc3529\"}":{"__typename":"Favorites","uuid":"f667defa-3be0-4de1-a47a-0c7bb9fc3529","photoUrl":"https://ucarecdn.com/00e94699-65cf-435d-8afb-75b1c82c9d97/","title":"The Great Gatsby","type":"BOOK"},"Favorites:{\"uuid\":\"d38ac32c-d9f2-4b38-983b-773f578db873\"}":{"__typename":"Favorites","uuid":"d38ac32c-d9f2-4b38-983b-773f578db873","photoUrl":"https://ucarecdn.com/31f0f8f4-4d5c-4808-ab13-6f9f0221d6f6/","title":"Basketball","type":"SPORT"},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"d2e381a3-bd0c-4376-bc06-09ef8a00ea4b\"}":{"__typename":"DeepDives","uuid":"d2e381a3-bd0c-4376-bc06-09ef8a00ea4b","content":"\u003cp\u003eGrowing up in South Africa, I was obsessed with Stephen Curry. I would watch his highlights on repeat and genuinely believed that one day I would play in the NBA. Never mind that I was thousands of miles away from the nearest basketball academy, had no coach, no court nearby, and absolutely no roadmap for how a kid from South Africa breaks into American professional sports. The dream was completely ridiculous. I loved it anyway.\u003c/p\u003e\u003cp\u003eBut somewhere along the way, that silly dream quietly transformed into a real one. If I was going to make it to America, I realized I needed a different kind of shot. I started teaching myself computer science with whatever free resources I could find online, because a US university felt like the most honest path I could actually chase. There was no guidance counselor pointing me toward Stanford. No professional guidance. No template to follow. Just stubbornness and a Wi Fi connection.\u003c/p\u003e\u003cp\u003eLooking back, I think the NBA dream was never really about basketball. It was about believing that someone from where I was could compete at the highest level anywhere in the world. Stanford ended up being my version of that.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"db0d48d4-b8dd-485b-b968-8f6099f16cba\"}":{"__typename":"DeepDives","uuid":"db0d48d4-b8dd-485b-b968-8f6099f16cba","content":"\u003cp\u003eStop stressing about your grades so much.\u003c/p\u003e\u003cp\u003eI spent so many years optimizing for report cards, convinced that a perfect GPA was the ticket to everything I wanted. What I didn't realize was that my most meaningful work, the research that won an international award, the startup that raised a million dollars, the community of 1,200 founders I helped build, none of it came from chasing grades. It came from following genuine curiosity down paths that had no guaranteed outcome.\u003c/p\u003e\u003cp\u003eI would tell my younger self to be unapologetically ambitious. Not the polished, safe kind of ambitious that earns approval from teachers and parents. The kind that makes people a little uncomfortable. The kind that says \"I want to build something that has never existed\" and means it fully, even when nobody around you has a roadmap for what that looks like.\u003c/p\u003e\u003cp\u003eGrowing up in South Africa with a dream of studying in the United States, I had every reason to play it small. There was no template for what I wanted to do. But I've learned that the absence of a worn path is actually an invitation, not a warning.\u003c/p\u003e\u003cp\u003eSo the advice is simple: listen to your own heart loudly, walk the road that nobody has walked before you, and trust that your curiosity is smarter than anyone's doubt, including your own.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"edf5e49d-7c8f-48c8-87bd-afcf44f981da\"}":{"__typename":"DeepDives","uuid":"edf5e49d-7c8f-48c8-87bd-afcf44f981da","content":"\u003cp\u003eWhen I first walked into a robotics lab as an undergrad with no research background, no connections, and no idea what I was doing, I figured it out mostly alone. Trial and error. Cold emails that went unanswered. Months of feeling like everyone around me already knew something I didn't. Eventually I found my footing, co authored an award winning paper, built venture backed products, and made it to Stanford. But the road was so much harder than it needed to be.\u003c/p\u003e\u003cp\u003eThat's exactly why mentorship matters to me.\u003c/p\u003e\u003cp\u003eI look back at that version of myself, a kid from South Africa with enormous ambition and almost zero guidance, and I wish someone had been there. Not to hand me the answers, but to say \"your curiosity is valid, here is how to point it at something real.\" Someone who had already navigated the gap between a big dream and a concrete first step.\u003c/p\u003e\u003cp\u003eThe moment I started mentoring others, I realized that the most valuable thing I could offer wasn't my credentials. It was the honest, unfiltered version of the journey. The wrong turns, the moments of doubt, the things I wish someone had told me at the very beginning.\u003c/p\u003e\u003cp\u003eMentorship matters because nobody should have to figure everything out alone. And the people with the most unconventional paths, the ones who look least like they belong, are often the ones who need that steady hand the most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"0508bdd1-c6ac-47ca-aa63-6bf068183edc\"}":{"__typename":"School","uuid":"0508bdd1-c6ac-47ca-aa63-6bf068183edc","name":"Reddam House Bedfordview","city":"Johannesburg","type":"HIGH","state":"Gauteng","country":"South Africa","zip":"2198"},"Education:{\"uuid\":\"645f1015-fbf6-4f79-9243-761acc731b71\"}":{"__typename":"Education","uuid":"645f1015-fbf6-4f79-9243-761acc731b71","school":{"__ref":"School:{\"uuid\":\"0508bdd1-c6ac-47ca-aa63-6bf068183edc\"}"},"startYear":"2014","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"17cbfd34-0929-43b5-b281-455e125451a7\"}":{"__typename":"School","uuid":"17cbfd34-0929-43b5-b281-455e125451a7","name":"University of Wisconsin–Madison","city":"Madison","type":"COLLEGE","state":"Wisconsin","country":"United States","zip":"53706"},"Education:{\"uuid\":\"28dc95dd-01c8-4e3f-90e7-0c3465359009\"}":{"__typename":"Education","uuid":"28dc95dd-01c8-4e3f-90e7-0c3465359009","school":{"__ref":"School:{\"uuid\":\"17cbfd34-0929-43b5-b281-455e125451a7\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Computer SCience","degree":null},"MentorPublicProfile:{\"uuid\":\"03e9bf95-b42e-4176-9699-13c0ffd380e4\"}":{"__typename":"MentorPublicProfile","uuid":"03e9bf95-b42e-4176-9699-13c0ffd380e4","displayName":"Hunter Z.","slug":"hunter-zhang","biography":"\u003cp\u003eHi! I'm Hunter originally from Johannesburg, South Africa, now based here in Palo Alto with a master's in Computer Science from Stanford.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMy Philosophy\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI firmly believe in learning by doing. Looking back at my own journey, the most growth happened when I was actively building things that fascinated me, not sitting in classrooms or reading textbooks. I want to give my mentees that same experience: help them get started on their own passion projects, and be the mentor who gives them direction, pointers, advice, and answers to the unknown unknowns they don't even know to ask about yet. This is something I wish I had when I first started.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlongside building, I teach a problem-solving framework that has guided everything I've done:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFirst Principles Thinking\u003c/strong\u003e: break complex problems into fundamental, actionable pieces\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003e80/20 Rule\u003c/strong\u003e: identify the 20% of actions that drive 80% of impact, then execute with focus and speed\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eReverse Engineering\u003c/strong\u003e: start with the ideal end-state, then work backward to design the most efficient path there\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat I Offer\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e🚀 \u003cstrong\u003eEntrepreneurship\u003c/strong\u003e: I co-founded and exited my own startup, where I was person #1 on the founding team and served as Chief Product Officer: shaping product vision, leading the team, and helping raise $375K at an $8M valuation. I help my mentees take a potential business idea from 0 → 1: find a real problem, validate it, build a solution, and put it into the world. My product is still live on the App Store (4.9/5.0) with over 5,000 users in just three months since launch: https://apps.apple.com/us/app/tbg-picks/id6751080617\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e🔧 \u003cstrong\u003eDeep Tech\u003c/strong\u003e: Hardware basics (CAD, electrical engineering fundamentals, and sensor engineering) and software (AI/ML, AR/VR development, robotics simulation with MuJoCo \u0026amp; Unity, robotics teleoperation). If you are up to the challenge, I also teach the basics of quantum mechanics: a subject I'm personally very passionate about. I specialize in helping kids start their own technical project from scratch, the way professionals do, just at their level.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eResearch Thinking\u003c/strong\u003e: I teach my mentees how to think like researchers: asking sharp questions, designing experiments, and communicating findings clearly. My own research earned the ACM Best System Paper award, given to the top 1% of researchers at the ACM/IEEE Conference on Human-Robot Interaction: https://dl.acm.org/doi/10.1145/3568162.3576982\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"bsAS62DF8kxWkXSXspEe500XizDD8CZrhlTkSFd00g8XE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003e• Won ACM Best System Paper Award at HRI 2023, top 1% across IEEE, ACM, SIGCHI, and HRI\u003c/p\u003e\u003cp\u003e• Raised a $1M seed round at $8M valuation as CPO of TBG Picks, scaling to 5,000+ active downloads while personally building the full stack infrastructure\u003c/p\u003e\u003cp\u003e• Co-founded Stanford Founders, growing it into the largest cross disciplinary graduate entrepreneurship org in the Bay Area with 1,200+ active members\u003c/p\u003e\u003cp\u003e• Co-founded Immerse The Bay, the second largest AR hackathon globally, bringing together 319 participants from 82 universities across 10 countries\u003c/p\u003e\u003cbr\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"83b66a03-a4f8-4683-9462-995d1466873f\"}"},{"__ref":"Favorites:{\"uuid\":\"f667defa-3be0-4de1-a47a-0c7bb9fc3529\"}"},{"__ref":"Favorites:{\"uuid\":\"d38ac32c-d9f2-4b38-983b-773f578db873\"}"}],"causesSupported":[],"major":"Computer SCience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d2e381a3-bd0c-4376-bc06-09ef8a00ea4b\"}"},{"__ref":"DeepDives:{\"uuid\":\"db0d48d4-b8dd-485b-b968-8f6099f16cba\"}"},{"__ref":"DeepDives:{\"uuid\":\"edf5e49d-7c8f-48c8-87bd-afcf44f981da\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6bc48682-b798-42e7-a6d5-e820dc93977e/-/preview/-/format/jpg/","https://ucarecdn.com/ec4f116e-098f-4ba8-b2d3-2b6c5be28a9b/-/preview/-/format/jpg/","https://ucarecdn.com/84bfe2b2-3598-4da0-92bb-ac424729f282/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"645f1015-fbf6-4f79-9243-761acc731b71\"}"},{"__ref":"Education:{\"uuid\":\"28dc95dd-01c8-4e3f-90e7-0c3465359009\"}"}],"hiredAt":"2026-03-05T18:08:25.160Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Physics","Writing","Mandarin Chinese","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science","Creative Writing","Visual Arts / Graphic Design","Business / Entrepreneurship","Coding / Programming","Web Design","Robotics / Electronics / CAD","Game Design","STEM Project","Machine Learning / AI","Public Speaking"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hunter-zhang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"03e9bf95-b42e-4176-9699-13c0ffd380e4\"}"}}},"_sentryTraceData":"4ec77c55aa904563a14ed1205238d0fb-967d2d1757283e1d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,s
