xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"666179cf-da23-4a04-861c-536f5702e299\"}":{"__typename":"DeepDives","uuid":"666179cf-da23-4a04-861c-536f5702e299","content":"\u003cp\u003eI would tell myself to focus solely on that which I am passionate about and brings my joy. A few times throughout high school I found myself working on things just because they would look good when applying to college, and this is something that I regret. If you work on something that truly makes you happy, that is the best result you could ever get. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"6c29f466-f538-425e-8405-8333f3d6f13f\"}":{"__typename":"DeepDives","uuid":"6c29f466-f538-425e-8405-8333f3d6f13f","content":"\u003cp\u003eMy greatest source of motivation is my parents. They work so hard and are so selfless that I feel like if I am any different, then I have strayed from my core values. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"d3894658-97b8-4ef3-8384-7778b4307851\"}":{"__typename":"DeepDives","uuid":"d3894658-97b8-4ef3-8384-7778b4307851","content":"\u003cp\u003eWhen I was in middle school, I was extremely overwhelmed with a math class that I was taking. I was too embarrassed to tell my parents, and so I fought on with no help and ultimately did not do well in the class. For some reason, I thought that seeking out mentorship meant that I was not good enough on my own. Now, years later, I know that this is not the case, and I want to be available for kids and to let them know that tutoring is not a sign of weakness. Rather, it is a tool for growth and discovering what they are capable of. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"54bcf991-909d-43e8-ae60-e64060e32340\"}":{"__typename":"DeepDives","uuid":"54bcf991-909d-43e8-ae60-e64060e32340","content":"\u003cp\u003eIn my spare time, I love to be around other people. I love to talk, listen, and engage in deep conversation with the people I love. I also love to exercise, and I try to work out or play a sport at least once a day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"492edc9f-26e2-4722-806e-d96b523b3369\"}":{"__typename":"School","uuid":"492edc9f-26e2-4722-806e-d96b523b3369","name":"Gilman School","city":"Baltimore","type":"HIGH","state":"Maryland","country":"United States","zip":"21210"},"Education:{\"uuid\":\"19a82d7d-d0ed-461b-80c7-e7d7a8ab18ae\"}":{"__typename":"Education","uuid":"19a82d7d-d0ed-461b-80c7-e7d7a8ab18ae","school":{"__ref":"School:{\"uuid\":\"492edc9f-26e2-4722-806e-d96b523b3369\"}"},"startYear":"2017","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"34172baa-7c42-4635-87f2-68dab89bc731\"}":{"__typename":"Education","uuid":"34172baa-7c42-4635-87f2-68dab89bc731","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics/Global Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"0c36b297-0c48-469e-b4e4-b6b8ecbd34b1\"}":{"__typename":"MentorPublicProfile","uuid":"0c36b297-0c48-469e-b4e4-b6b8ecbd34b1","displayName":"Andreas K.","slug":"andreas-karakousis","biography":"\u003cp\u003eHi! My name is Andreas Karakousis, and I’m currently a student at Yale University, where I’m planning to major in Economics and Global Affairs.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOver the years, I have found that I love to connect with different people from all around the world. Whether through language, culture, or food, I am always eager to learn what makes each part of the world so unique. A big part of who I am comes from my background–my dad is Greek and my mom is Uruguayan, so I grew up speaking both Greek and Spanish at home. The mix of cultures made me really curious about the world, and so I continued to study and learn languages in school. I took Latin to learn the roots of the languages we speak today, and French simply because I loved how it sounds. Here at Yale, I am still taking French and would love to go on an exchange in Paris someday.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOne of my favorite experiences was spending a summer in South Africa on an exchange program for my high school. I got to go on safaris, try bungee jumping (definitely one of the scariest things I’ve done!), and most importantly, learn about a culture totally different from my own. It was an amazing summer and I still keep in touch with people I met along the way.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAll of these experiences are what led me to pursue economics and global affairs, as I am able to dive deep into how the world works and how countries can work together to solve large problems.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAt Yale, aside from my studies, I love playing club soccer and basketball, volunteering whenever I get the chance, and hanging out with friends.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI look forward to meeting you and your child, and hope to be a part of their learning journey!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"w4RVYex8Ch02wg1hWB5chUf428Pjo5qlzAjEUp02svg5g","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics/Global Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"666179cf-da23-4a04-861c-536f5702e299\"}"},{"__ref":"DeepDives:{\"uuid\":\"6c29f466-f538-425e-8405-8333f3d6f13f\"}"},{"__ref":"DeepDives:{\"uuid\":\"d3894658-97b8-4ef3-8384-7778b4307851\"}"},{"__ref":"DeepDives:{\"uuid\":\"54bcf991-909d-43e8-ae60-e64060e32340\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dc9f646d-c36a-4304-931f-c50265ef5d13/-/preview/-/format/jpg/","https://ucarecdn.com/2f2dfddc-f298-4df4-9ca3-089ba3091552/-/preview/-/format/jpg/","https://ucarecdn.com/46852ab1-3646-4677-9293-c624f4fbc635/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"19a82d7d-d0ed-461b-80c7-e7d7a8ab18ae\"}"},{"__ref":"Education:{\"uuid\":\"34172baa-7c42-4635-87f2-68dab89bc731\"}"}],"hiredAt":"2025-04-30T16:50:48.140Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Spanish","French","Latin","College Essay Writing","Academic Coaching","Reading","History","Economics","Executive
