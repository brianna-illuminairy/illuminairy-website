xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5cc2dd44-5dcf-44c0-a9f2-9e020a6d4fc0\"}":{"__typename":"Favorites","uuid":"5cc2dd44-5dcf-44c0-a9f2-9e020a6d4fc0","photoUrl":"https://ucarecdn.com/ecfd6f7a-70e3-47c5-b56c-9dbd6ad1789d/","title":"Marcus King","type":"ARTIST"},"Favorites:{\"uuid\":\"eddfec1d-96bb-4e64-a090-1dff57d65766\"}":{"__typename":"Favorites","uuid":"eddfec1d-96bb-4e64-a090-1dff57d65766","photoUrl":"https://ucarecdn.com/931db24c-af1c-4c4b-a336-fa6849295b36/","title":"St. Louis Cardinals","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"cd15ed27-30ee-4f02-8a17-c125b2bda0eb\"}":{"__typename":"Favorites","uuid":"cd15ed27-30ee-4f02-8a17-c125b2bda0eb","photoUrl":"https://ucarecdn.com/12b79fdf-27ae-4398-bee6-39abcd0c0447/","title":"Imaginary Appalachia (Colter Wall)","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a7d0b1eb-004f-4ada-a936-cdc172b716f7\"}":{"__typename":"DeepDives","uuid":"a7d0b1eb-004f-4ada-a936-cdc172b716f7","content":"\u003cp\u003eI would tell my younger self to take challenging math classes at my community college. Compared to some of my classmates at Duke, my high school didn't offer the greatest math/engineering/computer science resources. I wish I would have taken a step outside of my comfort zone and built those skills early!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6badfbe8-bf28-4e6a-b5db-8ea36bd21735\"}":{"__typename":"DeepDives","uuid":"6badfbe8-bf28-4e6a-b5db-8ea36bd21735","content":"\u003cp\u003eWhen you meet a mentor who shares your interests and is willing to show you the ropes, that person becomes a very influential figure in your life. For me, that person was a physician at FMC Butner. He took a chance on me, and I ran with it. Mentorship is a two way street- that's what makes it special. The mentor has to meet the student where they are, but the student ultimately has to make it their own.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"3f8ea473-f3ef-40cf-8ee9-e0c8e61701a1\"}":{"__typename":"DeepDives","uuid":"3f8ea473-f3ef-40cf-8ee9-e0c8e61701a1","content":"\u003cp\u003eI play the tuba! I have played since middle school and love it's big, fat, and deep tone. Every band needs a tuba, especially in central IL where there are no tuba players (it is nice to be needed). In particular I love sousa marches and jazz/gospel music like a \"A closer walk with thee\".\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"33976b84-738f-4a7d-aceb-31ae92d34d10\"}":{"__typename":"DeepDives","uuid":"33976b84-738f-4a7d-aceb-31ae92d34d10","content":"\u003cp\u003eMy dream job is to be a physician that is able to work with people both outside and inside of prison. I am not sure exactly in what capacity yet, but I love working with my hands and hope that surgery is in my future!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"720d72d6-3d31-4103-a006-e49c45481668\"}":{"__typename":"School","uuid":"720d72d6-3d31-4103-a006-e49c45481668","name":"Glenwood High School","city":"Chatham","type":"HIGH","state":"Illinois","country":"United States","zip":"62629"},"Education:{\"uuid\":\"f2e9ee92-6a5e-4eb1-a565-359d0157e29b\"}":{"__typename":"Education","uuid":"f2e9ee92-6a5e-4eb1-a565-359d0157e29b","school":{"__ref":"School:{\"uuid\":\"720d72d6-3d31-4103-a006-e49c45481668\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"6dddf5a2-0da2-4883-9242-8f2b3cca86f5\"}":{"__typename":"Education","uuid":"6dddf5a2-0da2-4883-9242-8f2b3cca86f5","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Health \u0026 Incarceration","degree":null},"MentorPublicProfile:{\"uuid\":\"9331ecea-9c7e-4fa6-8866-717371ef442b\"}":{"__typename":"MentorPublicProfile","uuid":"9331ecea-9c7e-4fa6-8866-717371ef442b","displayName":"Will L.","slug":"will-lieber","biography":"\u003cp\u003eHi! I'm Will. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm a 5th generation Illinoian from Springfield, IL. I start off with where I am from because my academic journey is deeply intertwined with my family and my upbringing. My family farms and is passionate about rural healthcare. Caring for animals and appreciating the science of life on the farm drew me to medicine, but more importantly, it instilled in me a value for community. Farming would not be possible without our neighbors.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis emphasis on steadfast loyalty to one's community as well as my upbringing in the church lead me to the American prison system, where I have spent much of my time working to improve healthcare access for the incarcerated and those re-entering society. It is work I truly enjoy and find incredibly meaningful. I am currently applying to medical school to continue to pursue this path. At Duke, I became the first transfer student awarded a merit scholarship for public service—a testament to how others recognize authentic, values-driven work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe that flourishing as a student means knowing your story—your roots, values, and aspirations. As a tutor, I’ll work closely with students and families to help them uncover their own path, grow meaningfully, and succeed on their own terms. \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy senior year of college, I started a tutoring program for the children of adults taking night classes after getting released from incarceration. I worked with a community partner to identify this need, and I am proud of the way it grew into a mutually beneficial program!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"5cc2dd44-5dcf-44c0-a9f2-9e020a6d4fc0\"}"},{"__ref":"Favorites:{\"uuid\":\"eddfec1d-96bb-4e64-a090-1dff57d65766\"}"},{"__ref":"Favorites:{\"uuid\":\"cd15ed27-30ee-4f02-8a17-c125b2bda0eb\"}"}],"causesSupported":[],"major":"Health \u0026 Incarceration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a7d0b1eb-004f-4ada-a936-cdc172b716f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"6badfbe8-bf28-4e6a-b5db-8ea36bd21735\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f8ea473-f3ef-40cf-8ee9-e0c8e61701a1\"}"},{"__ref":"DeepDives:{\"uuid\":\"33976b84-738f-4a7d-aceb-31ae92d34d10\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/63fdc353-4baa-42fb-aca7-b6124242807a/-/p
