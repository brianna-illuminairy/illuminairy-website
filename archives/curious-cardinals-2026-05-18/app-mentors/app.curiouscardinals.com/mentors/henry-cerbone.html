xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"12decb5b-13ae-4a53-b724-fc9c02c4883f\"}":{"__typename":"DeepDives","uuid":"12decb5b-13ae-4a53-b724-fc9c02c4883f","content":"\u003cp\u003eMy dream job involves getting to design and build robots AND work with animals. This is born from a desire to both push our understanding of the world and better apply that understanding to existing within it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fdaa6c2a-5f71-4c26-9f33-7bb391094145\"}":{"__typename":"DeepDives","uuid":"fdaa6c2a-5f71-4c26-9f33-7bb391094145","content":"\u003cp\u003eThis is a bit of a trick question because I designed my own major! The Ontology of Autonomous Systems spans robotics, computer science, biology, mathematics, and philosophy! In my major, I focused on taking ideas from biology and philosophy and applying them to the other fields (and vice versa!)\u003cbr\u003e\u003cbr\u003eMy elevator pitch for my degree was something like, \"I'm interested in understanding how animals exist in the world and using that understanding to help robots better exist in the world too!\"\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ee83e45a-28a2-46f5-a7e9-0932f7503463\"}":{"__typename":"DeepDives","uuid":"ee83e45a-28a2-46f5-a7e9-0932f7503463","content":"\u003cp\u003eI am the person I am today because of my mentors. When anyone asks why I do something part of the answer usually involves a mentor pointing me to a resource, giving me advice, or opening up my eyes to something new. I want to help spread that to the next generation!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"9e1dc100-832a-41f9-9b32-e58fc1a3650c\"}":{"__typename":"DeepDives","uuid":"9e1dc100-832a-41f9-9b32-e58fc1a3650c","content":"\u003cp\u003eI was a MASSIVE nerd in high school! I spent most of my summers doing robotics. Freshman year, I competed in a virtual satellite competition that culminated in my code being flown on the International Space Station. Sophomore year, I coached a team in the same competition and did a different competition. Junior year, I worked as an intern for NASA. Senior year, I worked for the same NASA group as a contractor and did graduate robotics research in a lab. This was all interspersed with lots of kayaking, hiking, and swimming in wild and wonderful WV!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"f086411e-c8f7-485f-834c-65c50753080d\"}":{"__typename":"Education","uuid":"f086411e-c8f7-485f-834c-65c50753080d","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Ontology of Autonomous Systems (Robotics/Philosophy/Biology)","degree":null},"School:{\"uuid\":\"c04b4be4-7b21-4f04-93a8-b11860acf977\"}":{"__typename":"School","uuid":"c04b4be4-7b21-4f04-93a8-b11860acf977","name":"Preston High School","city":"Kingwood","type":"HIGH","state":"WV","country":"United States","zip":"26537"},"Education:{\"uuid\":\"fc66ab84-359b-4902-9457-f1bb1470ce4a\"}":{"__typename":"Education","uuid":"fc66ab84-359b-4902-9457-f1bb1470ce4a","school":{"__ref":"School:{\"uuid\":\"c04b4be4-7b21-4f04-93a8-b11860acf977\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"97daa5bb-0c21-49ee-8a39-21e572ccbac5\"}":{"__typename":"MentorPublicProfile","uuid":"97daa5bb-0c21-49ee-8a39-21e572ccbac5","displayName":"Henry C.","slug":"henry-cerbone","biography":"\u003cp\u003eHi! My name is Henry, and I’m currently a PhD student at Oxford researching perception and control during flight in hawks. I’m part of the Oxford Flight Group under Graham Taylor as a Rhodes Scholar. I spent last summer in Japan researching ants at the Okinawa Institute of Science and Technology (OIST). I recently received my undergraduate degree in robotics, philosophy, and biology from Harvard University. While at Harvard, I also received my master’s in computer science. During my undergraduate career, I primarily worked under Professor Robert Wood in the Harvard Microrobotics Lab. As I spent more time looking to biology for inspiration for robotics, I found myself drawn in by fundamental questions of form and function in organisms. This led me to do fieldwork in Arizona under Deborah Gordon (working with harvester ants) and write an undergraduate thesis on the water-running of basilisk lizards. I am interested in utilizing modern techniques such as 3D imaging, motion capture, and robotic models to better understand how animals exist in the world. I have previously done research in robotics (EPFL, Harvard), biology (Harvard, Stanford), and philosophy (Harvard). I have ongoing research projects in evolutionary graph theory w/ Martin Nowak, adaptation in birds of prey w/ Scott Edwards, and philosophy of biology.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Ontology of Autonomous Systems (Robotics/Philosophy/Biology)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"12decb5b-13ae-4a53-b724-fc9c02c4883f\"}"},{"__ref":"DeepDives:{\"uuid\":\"fdaa6c2a-5f71-4c26-9f33-7bb391094145\"}"},{"__ref":"DeepDives:{\"uuid\":\"ee83e45a-28a2-46f5-a7e9-0932f7503463\"}"},{"__ref":"DeepDives:{\"uuid\":\"9e1dc100-832a-41f9-9b32-e58fc1a3650c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/df4ebaf8-608d-4440-9962-c565b0e47bc9/-/preview/-/format/jpg/","https://ucarecdn.com/11496401-28fe-4bf6-b88f-3a0663feb428/-/preview/-/format/jpg/","https://ucarecdn.com/44005ce8-8e07-4ed0-9c0a-89ee1739cb02/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"f086411e-c8f7-485f-834c-65c50753080d\"}"},{"__ref":"Education:{\"uuid\":\"fc66ab84-359b-4902-9457-f1bb1470ce4a\"}"}],"hiredAt":"2023-07-21T13:55:30.310Z","topics":["Video / Photography","Creative Writing","Coding / Programming","Robotics / Electronics / CAD","STEM Project","Machine Learning / AI","Sustainability"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"henry-cerbone\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"97daa5bb-0c21-49ee-
