9\"}"},"startYear":"2013","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"d63c3e5f-4c17-44d2-ace5-1fc18c294be7\"}":{"__typename":"Education","uuid":"d63c3e5f-4c17-44d2-ace5-1fc18c294be7","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"History of Science, Medicine, and Public Health","degree":null},"MentorPublicProfile:{\"uuid\":\"ac082ff0-4659-4c45-81df-52e699e71a2e\"}":{"__typename":"MentorPublicProfile","uuid":"ac082ff0-4659-4c45-81df-52e699e71a2e","displayName":"Lucy H.","slug":"lucy-harvey","biography":"\u003cp\u003eHi! My name is Lucy and I am a senior studying the History of Science, Medicine and Public Health at Yale University. I focus on bioethics and public health, as the human stories and impacts of health inequities have always hit close to home for me.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI went to West Point Grey Academy in Vancouver, Canada for high school, where I was very involved in the Model UN scene. This is where my love for teaching began.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI was an over-active kid, to my parents dismay, and was enrolled in every sport you can possibly imagine. But nothing truly clicked until I found myself at a Circus summer camp at the age of 7. I was hooked. I performed with CircusWest from the ages of 7-17, learning to juggle, clown and even unicycle. My true passions in Circus Arts lay in German Wheel, Aerial Hoop, and Stacking Bike. I performed and traveled constantly, while also maintaining a hefty load of AP’s, as learning and expanding my world-view was always extremely important to me.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI left the circus world and graduated High-School set on Yale, but eventually decided to take a year off first. On this year, I was able to try the one thing that had always interested me but I never had the chance to pursue, which was Filmmaking.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI have always loved movies. I cry at almost every single one I watch. There is something about the ability of a filmmaker to make the audience FEEL that resonates so strongly with me, and set me on this path. This is why after Yale I plan to move to LA to pursue work in Film and TV Development.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I am the events coordinator for FUSE magazine, the only on campus publication for culture and fashion. I also run the podcast for The Yale Layer, Yale’s undergraduate mental health publication. When I’m not on my couch with my roommates doing homework, you can find me on a walk in East Rock park, or hunting down New Haven’s best almond croissant!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bb4b9b23-7821-470d-9a74-6e70f1cbb7ff\"}"},{"__ref":"Favorites:{\"uuid\":\"607c5c84-6b4d-43dc-af5a-ad26e46fafbc\"}"},{"__ref":"Favorites:{\"uuid\":\"5b576044-6d06-4161-bac5-c7bfe7f0d867\"}"},{"__ref":"Favorites:{\"uuid\":\"615c0ed9-8c5e-4486-be43-64eafe9184bc\"}"}],"causesSupported":[],"major":"History of Science, Medicine, and Public Health","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0ce28628-c9a9-4553-8be7-ca5235aa7eb6\"}"},{"__ref":"DeepDives:{\"uuid\":\"87868a5a-4ea5-46a8-ac6a-c9199b8d5166\"}"},{"__ref":"DeepDives:{\"uuid\":\"7ccca03c-0554-480d-983c-0154e0dd0bc9\"}"},{"__ref":"DeepDives:{\"uuid\":\"8aebaf78-01d2-4b0f-8bee-70b56d69e58e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6cae59b4-157a-4c3d-bf94
