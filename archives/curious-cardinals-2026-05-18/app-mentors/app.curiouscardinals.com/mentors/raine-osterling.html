08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"426d1170-3ef2-4d61-b8cb-ca06d60db925\"}":{"__typename":"Education","uuid":"426d1170-3ef2-4d61-b8cb-ca06d60db925","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"03a6c95b-f5eb-4dad-a92f-6c1dff2218b7\"}":{"__typename":"MentorPublicProfile","uuid":"03a6c95b-f5eb-4dad-a92f-6c1dff2218b7","displayName":"Raine  O.","slug":"raine-osterling","biography":"\u003cp\u003eHi hi hi! My name is Raine, and I love teddy bears (ask me about my collection)! I’m a \u003cstrong\u003eMechanical Engineering\u003c/strong\u003e student at Stanford University pursuing a minor in \u003cstrong\u003eComputer Science \u003c/strong\u003eand a \u003cstrong\u003eNotation in Science Communication\u003c/strong\u003e. I believe that making and creating are some of the most powerful ways we learn. Whether I’m building medical devices in the lab, sewing custom tote bags in the makerspace, or spinning tracks as a DJ, I’m always chasing that mix of curiosity, creativity, and care.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, I’ve had the chance to explore biomedical engineering across several labs. In the \u003cstrong\u003eStanford Soft Tissue Biomechanics Lab\u003c/strong\u003e, I designed CT-compatible traction devices to improve osteoarthritis imaging. In the \u003cstrong\u003eFeig Lab\u003c/strong\u003e, I synthesized pH-responsive hydrogels and contributed illustrations for publications on ingestible devices. With the \u003cstrong\u003eNeurosystems and Pain Lab\u003c/strong\u003e, I analyzed fMRI data from chronic pain patients, even volunteering as a subject myself to better understand the study. Most recently, I joined the \u003cstrong\u003eNeuromuscular Insight Lab\u003c/strong\u003e, where I’ll be working on projects that study muscle coordination and rehabilitation.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOff campus, I continue to deepen my technical expertise as a Clinical Research Assistant at \u003cstrong\u003eEvommune\u003c/strong\u003e, where I study autoimmune disease models by processing biomarker data to evaluate small-molecule inhibitors for arthritis treatment. Across these experiences, I’ve been fortunate to contribute to scientific publications that bridge rigorous research with clear communication.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond research, I’m an engineer for the \u003cstrong\u003eStanford Solar Car Project\u003c/strong\u003e, collaborating with teammates to design, fabricate, and test components for a solar-powered race car. I also invest deeply in community and mentorship. As Outreach Chair and Mentor at \u003cstrong\u003eStanford’s Graduate School of Education\u003c/strong\u003e makerspace (the Makery), I help students bring their ideas to life with technical expertise in 3D printing, laser cutting, and hands-on fabrication. I serve as a leader in \u003cstrong\u003eStanford FLIP (First-Generation and/or Low-Income Partnership)\u003c/strong\u003e, where I’ve created workshops that blend creativity and community building, including one where students stitched their own teddy bears :))\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond engineering, I stay connected to culture and movement through \u003cstrong\u003eStanford Kayumanggi (KAYU)\u003c/strong\u003e, the Filipino dance troupe, and I practice \u003cstrong\u003earchery\u003c/strong\u003e, a sport that keeps me grounded and focused.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I bring together technical expertise, creativity, and community. Just like teddy bears, learning should offer both comfort and courage, a safe space to try new things, and a reminder that challenges can be embraced with curiosity and care. My goal is to help every student I work with build knowledge they can hold onto, the way one might hold onto a favorite bear: with confidence, warmth, and a sense of possibility.\u003c/p\u003e","teachingVideoPlaybackId":"wJxkg2cLuGF102YssWdqNkq025BE00jzhTgGgRANlo00nA00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"792fe455-9706-41b2-95ca-7821300e5757\"}"},{"__ref":"Favorites:{\"uuid\":\"961d8b11-ae7d-43b5-b95c-8cf5d8e698c1\"}"},{"__ref":"Favorites:{\"uuid\":\"80de837c-d8cc-4ca3-8a3a-47c7bf572326\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"d717a4a3-2119-47ea-a3c8-dfafcb65f6c0\"}"}],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9331b26c-a674-4f5c-94ac-117d6a46fe7a\"}"},{"__ref":"DeepDives:{\"uuid\":\"8325b71d-35b0-432f-84b7-d526a30af03d\"}"},{"__ref":"DeepDives:{\"uuid\":\"1671d99c-8af2-4f41-8621-60ed222ff0c7\"}"},{"__ref":"DeepDives:{\"uuid\":\"51ce89e8-2650-4b55-b14a-3d8d519bdbe3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/80833e46-0393-478e-a66f-edb21b0f9ce2/-/preview/-/format/jpg/","https://ucarecdn.com/b4a7ffef-a293-4d4e-850b-740f1a91f651/-/preview/-/format/jpg/","https://ucarecdn.com/a850c36b-b7e4-4c43-84a3-083d5953479b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"62d94f02-f60a-4de2-bd3c-57cf7d88f6c4\"}"},{"__ref":"Education:{\"uuid\":\"426d1170-3ef2-4d61-b8cb-ca06d60db925\"}"}],"hiredAt":"2025-08-29T04:35:59.737Z","topics":[],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"raine-osterling\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"03a6c95b-f5eb-4d
