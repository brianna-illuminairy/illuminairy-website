xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"05584bcf-2fa5-4a9f-9e3d-2425d7007b3a\"}":{"__typename":"DeepDives","uuid":"05584bcf-2fa5-4a9f-9e3d-2425d7007b3a","content":"\u003cp\u003eI'm an assistant figure skating coach right now, as I've skated for almost five years, and I would love to become a full staff coach!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"a40e42b2-cbe2-44da-9b0e-03526eb63fc1\"}":{"__typename":"DeepDives","uuid":"a40e42b2-cbe2-44da-9b0e-03526eb63fc1","content":"\u003cp\u003eI'm autistic - usually in academic settings, people don't notice it because my special interests are largely academic. I can engage and talk for hours about any of those! It might seem random, but I just wanted to put it out there in case neurodivergence is a factor in your decision.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"9ee223af-cc4e-4074-ae90-5ecdfa0c30b5\"}":{"__typename":"DeepDives","uuid":"9ee223af-cc4e-4074-ae90-5ecdfa0c30b5","content":"\u003cp\u003eI love simple teaching aids that I can repeatedly return to and expand upon. Since I've tutored lots of math students through Curious Cardinals, especially high schoolers, the unit circle is a personal favorite. Pretty much everything in trigonometry has a clear link to that circle, and it's saved me and my students so much time by connecting with what they already know well.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"5c80c46e-f00c-4ec6-9e5b-13af4922fb86\"}":{"__typename":"DeepDives","uuid":"5c80c46e-f00c-4ec6-9e5b-13af4922fb86","content":"\u003cp\u003eCurrently, my two best answers for this are go to space and compete internationally as a figure skater (likely through adult competitions or theatre on ice). Landing an axel/doubles, holding a political office, and competing in the Gay Games with my hockey team (all LGTBQ+ and allies) would also make my bucket list.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"b207dad3-ce99-4043-844d-02d391bdeb6a\"}":{"__typename":"School","uuid":"b207dad3-ce99-4043-844d-02d391bdeb6a","name":"Clarke County High School","city":"Berryville","type":"HIGH","state":"Virginia","country":"United States","zip":"22611"},"Education:{\"uuid\":\"b81d8b30-3dbd-4d16-aab2-1b30724b6eb2\"}":{"__typename":"Education","uuid":"b81d8b30-3dbd-4d16-aab2-1b30724b6eb2","school":{"__ref":"School:{\"uuid\":\"b207dad3-ce99-4043-844d-02d391bdeb6a\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"3cd7af14-ceb4-49d2-8d76-ddecd73148a7\"}":{"__typename":"Education","uuid":"3cd7af14-ceb4-49d2-8d76-ddecd73148a7","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2022","major":"Aeronautics and Astronautics","degree":null},"Testimonial:c737e1c4-8b29-4e5b-bb94-5edf13b8196b":{"__typename":"Testimonial","id":"c737e1c4-8b29-4e5b-bb94-5edf13b8196b","text":"Julia is an expert mathematician with patience, insight and a kind way of guiding those for whom math does not come naturally. Sawyer relied on her for many years as she navigating the challenges of high school math.","date":"2025-06-09 10:07:05.283+00","rating":5,"endorser":{"__typename":"Endorser","name":"Tory Woodruff","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"7aa70b18-7267-465e-af51-ae9d51890056\"}":{"__typename":"MentorPublicProfile","uuid":"7aa70b18-7267-465e-af51-ae9d51890056","displayName":"Julia T.","slug":"julia-thompson","biography":"Julia is pursuing a major in Aeronautics and Astronautics at Stanford University with minors in Biology, Chemistry, Computer Science, Political Science, and Symbolic Systems. Since their freshman fall in 2017, they have led multiple student groups successfully. Currently, they are the co-president of the Stanford Student Space Initiative, Fascinate Publication, and Alpha Chi Omega, the captain of the Model UN team, and the financial officer of Health Education for Lifetime Partnerships, Stanford Applied Cybersecurity, and Student Alliance for Justice in Education. \n\nIn their free time, they belong to a space-themed cover band, The Artemis Generation, where they play guitar. In addition, they figure skate and rollerblade regularly, and they love to watch and play baseball. Crafts are another hobby of theirs, and they sold handmade bracelets and other creations in high school to raise $2,000 for mental health awareness.\n\nTheir previous work with students is wide-ranging, including tutoring through the National Honors Society in high school, coaching gymnastics for two years, and leading health education workshops for middle school students. They look forward to inspiring more students through Curious Cardinals!","teachingVideoPlaybackId":"mPe2S027A2pMs5lnXs5z00aPXCkrYsLG6J00z8DUy3ozPo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eBeing the co-president of the Stanford Student Space Initiative is my greatest achievement because between leadership, engineering, logistics, public speaking, and more, this experience challenged me in so many different ways. To make things even more intense, I was co-president throughout 2020, so managing a team of 300 students with a six-figure budget was massively complicated by COVID.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Aeronautics and Astronautics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"05584bcf-2fa5-4a9f-9e3d-2425d7007b3a\"}"},{"__ref":"DeepDives:{\"uuid\":\"a40e42b2-cbe2-44da-9b0e-03526eb63fc1\"}"},{"__ref":"DeepDives:{\"uuid\":\"9ee223af-cc4e-4074-ae90-5ecdfa0c30b5\"}"},{"__ref":"DeepDives:{\"uuid\":\"5c80c46e-f00c-4ec6-9e5b-13af4922fb86\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f0aad0cd-3c74-4dbd-912d-8f3902aa954f/-/crop/892x890/222,0/-/preview/-/format/jpg/"],"pronouns":"THEY_THEM","gender":"NON_BINARY","education":[{"__ref":"Education:{\"uuid\":\"b81d8b30-3dbd-4d16-aab2-1b30724b6eb2\"}"},{"__ref":"Education:{\"uuid\":\"3cd7af14-ceb4-49d2-8d76-ddecd73148a7\"}"}],"hiredAt":"2021-11-02T17:57:50.000Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Biology","Chemistry","Physics","Writing","French","Academic Coaching","College Essay Writing","Comp
