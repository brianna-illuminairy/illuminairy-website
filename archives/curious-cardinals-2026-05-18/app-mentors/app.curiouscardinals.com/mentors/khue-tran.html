your greatest source of motivation?"},"DeepDives:{\"uuid\":\"2e8c9c22-c242-4d79-81a4-9fa2fff2de14\"}":{"__typename":"DeepDives","uuid":"2e8c9c22-c242-4d79-81a4-9fa2fff2de14","content":"\u003cp\u003eMy greatest source of motivation would have to be the people around me: my family, friends, peers, and mentors. Each have a different method of encouragement, but I am very grateful to have so much support in my endeavors. They celebrate my victories, push me to try harder, but also remind me of my worth when I'm feeling unaccomplished.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c86fc6c0-03f0-464f-8837-0bb64747ef01\"}":{"__typename":"DeepDives","uuid":"c86fc6c0-03f0-464f-8837-0bb64747ef01","content":"\u003cp\u003eAs a traditional artist, I am often found creating something or other. I could be working on a painting or simply scrapbooking in my journal. I also love listening to music (k-pop and v-pop, but also western hits here and there), cooking, learning languages, and reading comics.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"c0789785-2f01-43fa-876c-2171e1a789cb\"}":{"__typename":"DeepDives","uuid":"c0789785-2f01-43fa-876c-2171e1a789cb","content":"\u003cp\u003eAs a middle school student, I was timid and insecure, never straying too far from my comfort zone. I had interests that I did not share with my classmates for fear of being judged and skills that I did not develop on because I was influenced by what others thought of me. However, after the pandemic, I realized how much I enjoyed social interaction and pushed myself to be more outgoing, exploring new things and truly deepening my passions. My high school years have taught me a lot about being myself, combating impostor syndrome, and self-advocating.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"3955fea5-d273-47ed-b4b1-11929333c44a\"}":{"__typename":"School","uuid":"3955fea5-d273-47ed-b4b1-11929333c44a","name":"Hillgrove High School","city":"Powder Springs","type":"HIGH","state":"Georgia","country":"United States","zip":"30127"},"Education:{\"uuid\":\"14b80183-6786-43fa-a00b-9866efb46f25\"}":{"__typename":"Education","uuid":"14b80183-6786-43fa-a00b-9866efb46f25","school":{"__ref":"School:{\"uuid\":\"3955fea5-d273-47ed-b4b1-11929333c44a\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e3a7e210-8e3e-498f-af74-57a9976df470\"}":{"__typename":"School","uuid":"e3a7e210-8e3e-498f-af74-57a9976df470","name":"Johns Hopkins University","city":"Baltimore","type":"COLLEGE","state":"Maryland","country":"United States","zip":"21218"},"Education:{\"uuid\":\"8ae7cfd7-3c1a-410c-a8d6-17c385e19250\"}":{"__typename":"Education","uuid":"8ae7cfd7-3c1a-410c-a8d6-17c385e19250","school":{"__ref":"School:{\"uuid\":\"e3a7e210-8e3e-498f-af74-57a9976df470\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Chemical \u0026 Biomolecular Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"98de8514-5805-4334-b9a7-1a7a0714777b\"}":{"__typename":"MentorPublicProfile","uuid":"98de8514-5805-4334-b9a7-1a7a0714777b","displayName":"Khue T.","slug":"khue-tran","biography":"\u003cp\u003e\u003cstrong\u003eAbout Me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eHello! My name is Khue Tran and I am a Chemical and Biomolecular Engineering 2nd year at Johns Hopkins University with concentrations in Molecular and Cellular Bioengineering as well as Data Science and Machine Learning. I am also pursuing minors in Psychology and Applied Mathematics \u0026amp; Statistics. I hope to bridge gaps between chemical engineering, data science, and communications sectors and I’d love to help students with interdisciplinary interests find their balance too!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eMy Experience \u0026amp; Specialties\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eMy teaching and mentoring experience includes:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAssistant director of my high school orchestra\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003etutoring at a Title I elementary school\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eteaching English to underserved communities (14-18yrs old) in Vietnam\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ementoring incoming college first years for UNCF STEM Scholars\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eprivate SAT tutoring\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFly Girls Women in STEM initiative drone and block coding operator\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching arts/crafts to patients and caregivers at a children’s hospital (4-18yrs old)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eAs a result, my specialties with academic mentorship lie in chemistry, mathematics and psychology while my specialties with passion projects lie in professional writing and communications, public speaking, project management, professional development, and team organization. Some general life skills or advice I can offer include leadership, time management, critical thinking, combating impostor syndrome/building confidence, and setting achievable goals. For college readiness, I am also available for college essay writing/applications, scholarship search/applications.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat to Expect\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eFor academic mentorship, we could work on general chemistry, algebra, pre-calculus, calculus I, calculus II, and psychology (general or social, research methods). For passion projects, we could work on building a portfolio (creative, professional, etc.), volunteering/community service, visual arts, and exploring research areas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eAchievements\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDean’s List Recognition 2024-2025\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWrote a nomination that won my professor the Hopkins Career Impact Award 2024\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCenter for Student Success Community Organizer Award 2024\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eUNCF STEM Scholar 2024-present\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eJudge William F. Cooper Scholarship 2024-present\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eQuestBridge Scholar 2023\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eQuestBridge Quest for Excellence Award 2023\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGeorgia Certificate of Merit 2023\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eFun Facts\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eOutside of academics, I am:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eResearching musical timbre perception using EEG in the Laboratory for Computational Audio Perception at Hopkins\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHosting arts/entertainment events as part of Hopkins Organization for Programming\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eVolunteering at Kennedy Krieger Institute working with patients and caretakers\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCoordinating cultural events for the Vietnamese Student Association\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eManaging operations and recruitment for the FGLI podcast branch at Hopkins\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eVolunteering at the Hopkins Center for Educational Outreach\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTeaching English to students in Vietnam with Pacific Links Foundation\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eHobbies/Interests:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eArts/crafts (I am a traditional artist specializing in acrylics!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eScrapbook journaling\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePhotography\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMusic (I am a classical violinist, have been learning to sing, and am an avid enjoyer of k-pop!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eReading\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCooking\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLanguages, etymology, culture\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAnimals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHistory\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBadminton/pickleball/tennis\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTaking walks/trails\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDance (not a dancer myself, but I enjoy the sport)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGames (board, video, card, you name it!)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"001Kj02h76btrhHcAx59AZ01GcWPODaySUeGMp8QJcnKl00
