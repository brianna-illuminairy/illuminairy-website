xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"896a06c5-f249-4189-b39e-86b0581732b5\"}":{"__typename":"Favorites","uuid":"896a06c5-f249-4189-b39e-86b0581732b5","photoUrl":"https://ucarecdn.com/33bf092c-c6fb-4496-858d-76c77aadc98e/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"0048cbb4-9664-4321-8dc9-105faadb9b18\"}":{"__typename":"Favorites","uuid":"0048cbb4-9664-4321-8dc9-105faadb9b18","photoUrl":"https://ucarecdn.com/39ddaaa4-123b-44a9-9575-305bd20b29f9/","title":"Ctrl","type":"ALBUM"},"Favorites:{\"uuid\":\"f4b6e4bf-67f7-4b66-b192-f59333b04ae3\"}":{"__typename":"Favorites","uuid":"f4b6e4bf-67f7-4b66-b192-f59333b04ae3","photoUrl":"https://ucarecdn.com/f28523ad-f55b-4384-882c-149fa7991f81/","title":"Serena Williams","type":"ATHLETE"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"790f78c0-d8d0-4933-a446-2e1b074f016b\"}":{"__typename":"DeepDives","uuid":"790f78c0-d8d0-4933-a446-2e1b074f016b","content":"\u003cp\u003eDuring the summers, I volunteered as an academic tutor and squash coach for City Squash in the Bronx. City Squash provides academic support, mentorship opportunities and squash training to help students fulfill their personal, academic, and athletic goals. The students are incredibly talented and I loved working with them both on and off the courts. Many of the students I worked with are currently enrolled in universities across the country, and it is incredibly exciting to see where their passions take them!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"69d967fc-b290-4f40-8a3d-8c6fceb886d8\"}":{"__typename":"DeepDives","uuid":"69d967fc-b290-4f40-8a3d-8c6fceb886d8","content":"\u003cp\u003eMy dream job is working at a legal aid organization, to hopefully increase access to affordable housing. During the summer of 2021, I worked at a legal aid nonprofit in New Haven, CT, where I worked under the guidance of the Executive Director to support the housing unit after the Covid-19 pandemic exacerbated New Haven's housing crisis. My responsibilities included shadowing law school interns in the housing unit, assisting with researching case facts and client information for eviction cases, and creating a portfolio of public-facing fundraising resources to support the housing unit. I am so inspired by the work of the Executive Director, who has been an incredibly mentor to me, and I hope to follow in her footsteps. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"629576bb-ebdf-4d5e-abab-21ef04d16f2a\"}":{"__typename":"DeepDives","uuid":"629576bb-ebdf-4d5e-abab-21ef04d16f2a","content":"\u003cp\u003eWhen I was in middle school, I signed up to take a workshop by local pop artist Michael Albert, where I learned about the technique of art collage. I was blown away by how artists have used mundane items like cereal boxes to create incredible works of art. I became passionate about creating collages and exploring the world of pop art. I also became interested in learning about the history of pop art, and particularly the use of pop art to support social movements and political causes. I've continued to learn about both artists, such as Robert Rauschenberg, as well as different techniques that inspired the pop art movement.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1a116126-a22f-4c47-897c-9806c20c654a\"}":{"__typename":"DeepDives","uuid":"1a116126-a22f-4c47-897c-9806c20c654a","content":"\u003cp\u003eIn my spare time, I enjoy cooking and baking new recipes, (particularly any kinds of desserts!) reading fiction, poetry, and historical fiction, seeing live music, and hiking in national parks across the country (my favorite is Acadia National Park!) I also love playing golf, tennis, and squash. I'm so excited to connect with others who may have similar interests and think about ways to explore different passions!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"88e5b078-bfe4-46e7-b7a0-037d65d29801\"}":{"__typename":"School","uuid":"88e5b078-bfe4-46e7-b7a0-037d65d29801","name":"Scarsdale High School","city":"Scarsdale","type":"HIGH","state":"New York","country":"United States","zip":"10583"},"Education:{\"uuid\":\"fe00b290-4b86-4247-9c55-a04aa86291f2\"}":{"__typename":"Education","uuid":"fe00b290-4b86-4247-9c55-a04aa86291f2","school":{"__ref":"School:{\"uuid\":\"88e5b078-bfe4-46e7-b7a0-037d65d29801\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"0cd89aba-afd0-4d94-b825-99a04e1fbd00\"}":{"__typename":"Education","uuid":"0cd89aba-afd0-4d94-b825-99a04e1fbd00","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"5c7ac1c9-4fa7-4863-8d0c-375e0f8a07c8\"}":{"__typename":"MentorPublicProfile","uuid":"5c7ac1c9-4fa7-4863-8d0c-375e0f8a07c8","displayName":"Katie B.","slug":"katie-bowen","biography":"\u003cp\u003eKatie is a dedicated and experienced tutor, passionate about topics related to law, public policy, and democracy. As a Political Science major, Katie studied political theory and contemporary politics to understand what we should ask for - and expect - from our governments and institutions. She is excited to work with students to help them unlock their full potential and pursue their passions.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eKatie graduated cum laude from Yale and with distinction in the Political Science major. She has seven years of tutoring experience in both virtual and classroom settings, working with students across different age groups and educational backgrounds.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eHer interest in politics began in high school, when she was selected to participate in the League of Women Voters’ Inside Albany Conference, which convenes high school students across New York State to learn about how citizens can participate in policy making. Katie was also involved in her high school’s Model UN Club and took AP US History, AP English Literature, AP Spanish Literature, and AP Constitutional Law. During her senior year, she was the Grand Prize winner of the New York Civil Liberties Union (NYCLU) Bill of Rights Essay Contest.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAt Yale, Katie continued to explore interests in politics both inside and outside of the classroom. Her favorite classes included the Moral Foundations of Politics, Contesting Injustice, Introduction to International Relations, and Contemporary Spanish Politics. She was the Publisher of The Politic - the undergraduate newspaper on politics and culture - conducted research for the Undergraduate Legal Aid Society, and tutored for Squash Haven. Katie’s tutoring style emphasizes creating a collaborative and engaging learning environment. Through personalized attention, Katie strives to empower students, helping them build confidence in their abilities.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAfter working for a year at a communications agency, Katie is currently applying to law school. Outside of these commitments, Katie can be found baking, spending time outside, and grabbing coffee with friends. Katie is excited to connect with students and inspire a genuine love for learning.\u003c/p\u003e","teachingVideoPlaybackId":"u0244tLTsDBSUHGcT43p1jVQVGaz3uh8hGT6eY15a2yI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"896a06c5-f249-4189-b39e-86b0581732b5\"}"},{"__ref":"Favorites:{\"uuid\":\"0048cbb4-9664-4321-8dc9-105faadb9b18\"}"},{"__ref":"Favorites:{\"uuid\":\"f4b6e4bf-67f7-4b66-b192-f59333b04ae3\"}"}],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"790f78c0-d8d0-4933-a446-2e1b074f016b\"}"},{"__ref":"DeepDives:{\"uuid\":\"69d967fc-b290-4f40-8a3d-8c6fceb886d8\"}"},{"__ref":"DeepDives:{\"uuid\":\"629576bb-ebdf-4d5e-abab-21ef04d16f2a\"}"},{"__ref":"DeepDives:{\"uuid\":\"1a116126-a22f-4c47-897c-9806c20c654a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/258177e6-4122-4183-88e3-fcbfa4b06bb1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fe00b29
