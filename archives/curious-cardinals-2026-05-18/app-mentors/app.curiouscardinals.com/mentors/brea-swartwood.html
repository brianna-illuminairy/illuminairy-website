xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cd51a9c5-9091-4535-8f58-bc49fbc92bf6\"}":{"__typename":"Favorites","uuid":"cd51a9c5-9091-4535-8f58-bc49fbc92bf6","photoUrl":"https://ucarecdn.com/e29152c7-9416-4e0f-9027-5a1fca241d37/","title":"Honolulu, HI","type":"CITY"},"Favorites:{\"uuid\":\"93cc7738-8e42-4ff6-befc-5f5d02ba0cdb\"}":{"__typename":"Favorites","uuid":"93cc7738-8e42-4ff6-befc-5f5d02ba0cdb","photoUrl":"https://ucarecdn.com/2e76f1b8-bd7a-405c-8b92-0f5985ad6d0f/","title":"swimming","type":"SPORT"},"Favorites:{\"uuid\":\"df00113d-87ec-4cdb-91f1-7ebbe4570a9c\"}":{"__typename":"Favorites","uuid":"df00113d-87ec-4cdb-91f1-7ebbe4570a9c","photoUrl":"https://ucarecdn.com/7278d225-91ef-40af-9e5d-9b973246d978/","title":"Stardew Valley","type":"GAME"},"CausesSupported:{\"uuid\":\"76efa459-0dac-4d2a-8f33-dd6222727dec\"}":{"__typename":"CausesSupported","uuid":"76efa459-0dac-4d2a-8f33-dd6222727dec","name":"Renewable Energy Development and Sustainability","description":"\u003cp\u003eWe should project and support our planet!\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"aa858081-a606-4b4e-a77f-bc735a139627\"}":{"__typename":"DeepDives","uuid":"aa858081-a606-4b4e-a77f-bc735a139627","content":"\u003cp\u003eMy advice to myself would be to try the best you can, but not stress about things that can't be controlled. I used to get stressed often and forget the bigger picture, when all along, I (and any other student in middle or high school) was well on my way to reach my goals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"e3a89166-d8ec-4b6b-b9ae-cc953229c402\"}":{"__typename":"DeepDives","uuid":"e3a89166-d8ec-4b6b-b9ae-cc953229c402","content":"\u003cp\u003eI hope to write a book someday. I really enjoy reading books, and writing a book that someone else can enjoy is something that I want to accomplish.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"507ad326-0db7-43ff-af15-fec725eddf86\"}":{"__typename":"DeepDives","uuid":"507ad326-0db7-43ff-af15-fec725eddf86","content":"\u003cp\u003eI chose my major because I always really liked mathematics and solving problems. Large-scale simulation and application has always been interesting to me, and I like spending hours thinking about problems. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"abe1e5be-0a58-4d56-9004-981302c30d8a\"}":{"__typename":"DeepDives","uuid":"abe1e5be-0a58-4d56-9004-981302c30d8a","content":"\u003cp\u003eI love being a mentor because I've always had a passion for teaching. I have two younger siblings and when we were growing up, we would spend hours talking about everything from music to food to games to school. I especially liked our academic discussions and how we bonded from learning from one another. I now would like to teach and discuss with others!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"4dcead98-e6bf-4cc8-95ae-882b4cdc7a8a\"}":{"__typename":"School","uuid":"4dcead98-e6bf-4cc8-95ae-882b4cdc7a8a","name":"Mililani High School","city":"Mililani","type":"HIGH","state":"Hawaii","country":"United States","zip":"96789"},"Education:{\"uuid\":\"8dfeaf6b-9325-4363-b9e1-c29a5d3614cd\"}":{"__typename":"Education","uuid":"8dfeaf6b-9325-4363-b9e1-c29a5d3614cd","school":{"__ref":"School:{\"uuid\":\"4dcead98-e6bf-4cc8-95ae-882b4cdc7a8a\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}":{"__typename":"School","uuid":"11470c0e-6098-4972-92d0-60616358bd13","name":"California Institute of Technology","city":"Pasadena","type":"COLLEGE","state":"California","country":"United States","zip":"91125"},"Education:{\"uuid\":\"625d8afd-1a05-49bf-bcca-03dd44d64a28\"}":{"__typename":"Education","uuid":"625d8afd-1a05-49bf-bcca-03dd44d64a28","school":{"__ref":"School:{\"uuid\":\"11470c0e-6098-4972-92d0-60616358bd13\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Applied and Computational Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"28b9b35f-d6e7-436a-85b8-7e4a01c7b9f1\"}":{"__typename":"MentorPublicProfile","uuid":"28b9b35f-d6e7-436a-85b8-7e4a01c7b9f1","displayName":"Brea S.","slug":"brea-swartwood","biography":"\u003cp\u003eHi! My name is Brea and I will be starting my PhD at Stanford in Computational and Mathematical Engineering in the fall of 2024!\u003c/p\u003e\u003cp\u003eI really like working on projects (whether academic, educational, or just for fun) because I think you can learn valuable skills. Most of my projects have been research projects in Caltech's SURF program. I did three projects in Caltech's SURF Program. 1) a project involving machine learning and MRI images, 2) a project on private capital market research, and 3) a project on stability analysis and constructing a manifold. Through these very different projects, I learned different valuable skills - from technical skills to learning how to cold email and communicate with others that are very far away!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor me, high school was fun because I liked learning with others everyday and seeing my friends. We would always share interesting stories with each other.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, I learned how to become much more independent, and I think that was a great experience for me. While the workload was first tough, I learned how to manage myself. \u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI really think that learning should be fun! If you decide to work with me, I can promise that \"instead of feeling like you need to work, you'll feel like you're improving yourself\". I am extremely patient, as patience is the only way to learn - it's okay if it takes a little time to understand something!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I enjoy swimming, surfing, and playing video games. I've been swimming since I was 6 and swam competitively throughout high school and college. Being active and enjoying the outdoors is important to me.\u003c/p\u003e","teachingVideoPlaybackId":"fQTGlZTxdqURIpu7ZzqQxP7dSPg6IrLdlH702WMkwpZQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI just had my research project from last summer published! It's now in Nonlinear Analysis: Real World Applications and will be live shortly.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"cd51a9c5-9091-4535-8f58-bc49fbc92bf6\"}"},{"__ref":"Favorites:{\"uuid\":\"93cc7738-8e42-4ff6-befc-5f5d02ba0cdb\"}"},{"__ref":"Favorites:{\"uuid\":\"df00113d-87ec-4cdb-91f1-7ebbe4570a9c\"}"
