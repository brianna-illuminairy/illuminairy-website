xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b577dd5e-de15-4cbc-bfc8-bb2dab66c06a\"}":{"__typename":"Favorites","uuid":"b577dd5e-de15-4cbc-bfc8-bb2dab66c06a","photoUrl":"https://ucarecdn.com/356b2ace-bb8a-4b70-bcd4-c574a2fb320d/","title":"Never Let Me Go By Kazuo Ishiguro","type":"BOOK"},"Favorites:{\"uuid\":\"ce12be37-2e81-41bb-b0a7-814f6618a2a6\"}":{"__typename":"Favorites","uuid":"ce12be37-2e81-41bb-b0a7-814f6618a2a6","photoUrl":"https://ucarecdn.com/42123882-9c59-46df-8578-ae9ccef30ffb/","title":"Yoshitomo Nara","type":"ARTIST"},"Favorites:{\"uuid\":\"cf1b2d4e-39b7-4e7c-a33f-d8b58b11fe76\"}":{"__typename":"Favorites","uuid":"cf1b2d4e-39b7-4e7c-a33f-d8b58b11fe76","photoUrl":"https://ucarecdn.com/6d6ccc0f-e73c-459e-8b0b-c9310aed7fcb/","title":"Brooklyn and Kyoto","type":"CITY"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"077fc702-1111-4ab7-a732-566d8e87c1a7\"}":{"__typename":"DeepDives","uuid":"077fc702-1111-4ab7-a732-566d8e87c1a7","content":"\u003cp\u003eGoing to an arts high school, I loved both my studio art classes and my academic classes, but thought that I could only choose one to pursue in the future. If I could give my high school self a piece of advice, it would be that it is possible to pursue both! Being passionate about art AND academics allows you to bring a unique perspective to both sides of your studies. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"ca8e684b-e808-43ed-8f86-64126b75003c\"}":{"__typename":"DeepDives","uuid":"ca8e684b-e808-43ed-8f86-64126b75003c","content":"\u003cp\u003eIn high school, I spent my summer interning at museums like the Metropolitan Museum of Art and the Guggenheim, as well as doing studio art programs in places like the Noguchi Museum in Queens, NY. I also had the opportunity to travel to Japan for three weeks through the Japan Society Junior Fellows Program, an exchange program between US and Japanese high school students. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"07235327-812d-4292-8e70-1854515ba30f\"}":{"__typename":"DeepDives","uuid":"07235327-812d-4292-8e70-1854515ba30f","content":"\u003cp\u003eI am extremely proud of my undergraduate thesis, which was on Japanese student protest history. My thesis took two years to complete, including a period of two months of research at the Kyoto University Archives in Japan.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"693f0b4e-52f1-4858-82b2-7321f3aed04a\"}":{"__typename":"DeepDives","uuid":"693f0b4e-52f1-4858-82b2-7321f3aed04a","content":"\u003cp\u003eRecently, in my spare time I have been studying handmade shoemaking with a professional shoemaker in Kyoto! I LOVE shoes and am passionate about traditional craft, sustainable/slow fashion, and design--shoemaking is the perfect intersection of these interests!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"ddebc148-8bab-4e23-9552-c72acf8954ba\"}":{"__typename":"School","uuid":"ddebc148-8bab-4e23-9552-c72acf8954ba","name":"Fiorello H. LaGuardia High School of Music \u0026 Art and Performing Arts","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10023"},"Education:{\"uuid\":\"76825c6f-cf26-4a2f-986c-0cd1ef4457da\"}":{"__typename":"Education","uuid":"76825c6f-cf26-4a2f-986c-0cd1ef4457da","school":{"__ref":"School:{\"uuid\":\"ddebc148-8bab-4e23-9552-c72acf8954ba\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"cb27cb69-446e-4382-a42c-782b130e7fad\"}":{"__typename":"Education","uuid":"cb27cb69-446e-4382-a42c-782b130e7fad","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"History \u0026 Visual Art","degree":null},"MentorPublicProfile:{\"uuid\":\"cf0f53a4-dd63-4a58-bd09-f25740fa4dd4\"}":{"__typename":"MentorPublicProfile","uuid":"cf0f53a4-dd63-4a58-bd09-f25740fa4dd4","displayName":"Lola S.","slug":"lola-simon","biography":"\u003cp\u003eMy name is Lola and I am a recent graduate of Brown University and a current Fulbright Fellow to Japan. I am from Brooklyn, NY and went to LaGuardia HS, an arts high school in NYC, where I found my passion for both art and academics. At Brown, I majored in History and Visual Art, with an emphasis on modern history and painting/drawing/printmaking. My combined interests in visual art and history gave me so many wonderful opportunities at Brown, from studying a traditional form of printmaking in Japan to participating in an archaeological excavation in Italy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my time at Brown, I had two solo art shows and won multiple grants and awards to support my art practice. I also wrote an honors history thesis using archival materials I collected while studying abroad in Kyoto, Japan. My thesis won the history department award for an outstanding honors thesis. I am currently back in Kyoto continuing my research this year through the Fulbright Program. In addition to my historical research, I am also currently working as an artist in Kyoto, where I have my own painting studio.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, outside of classes, I was an editor at the weekly Brown-RISD publication The College Hill Independent, which I also wrote articles and illustrated for. I am interested in the environment and sustainability, and lived in the Brown University Environmental Program House for two years. I also helped start and manage the student garden club, bringing together students to grow fresh produce and build community centered around sustainable farming. I have been studying Japanese for over seven years, and worked as a TA for the Brown Japanese program. I am a strong advocate for the study of foreign languages, and believe learning languages opens doors for you, academically, professionally, and personally.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have tutored since I was in high school, and have worked with students middle school to college-aged in subjects ranging from algebra to creative writing to beginner Japanese. I am excited to share my knowledge and passion for visual art, sustainability, history, writing, language study, and research with you!\u003c/p\u003e","teachingVideoPlaybackId":"KhpRmP1ebRamuhT1DoXG4nmi9MCLKvWRvlD7w5Vz1ZM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement is receiving a fully funded research fellowship through the Fulbright Program to spend a year conducting historical research at Kyoto University in Japan! It has been a lifelong dream of mine to spend time living in Japan--I have studied Japanese since I was in thirteen years old. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"b577dd5e-de15-4cbc-bfc8-bb2dab66c06a\"}"},{"__ref":"Favorites:{\"uuid\":\"ce12be37-2e81-41bb-b0a7-814f6618a2a6\"}"},{"__ref":"Favorites:{\"uuid\":\"cf1b2d4e-39b7-4e7c-a33f-d8b58b11fe76\"}"}],"causesSupported":[],"major":"History \u0026 Visual Art","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"077fc702-1111-4ab7-a732-566d8e87c1a7\"}"},{"__ref":"DeepDives:{\"uuid\":\"ca8e684b-e808-43ed-8f86-64126b75003c\"}"},{"__ref":"DeepDives:{\"uuid\":\"07235327-812d-4292-8e70-1854515ba30f\"}"},{"__ref":"DeepDives:{\"uuid\":\"693f0b4e-52f1-4858-82b2-7321f3aed04a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a34c80ab-0c27-4ad9-8a11-03b5b8e301cb/-/preview/-/format/jpg/","https://ucarecdn.com/d25e8746-dc81-4663-bdae-790140aea7ac/-/preview/-/format/jpg/","https://ucarecdn.com/9324dce8-c84f-4b58-b979-5f50dbb7b3c5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"76825c6f-cf26-4a2f-986c-0cd1ef4457da\"}"},{"__ref":"Education:{\"uuid\":\"cb27cb69-446e-4382-a42c-782b130e7fad\"}"}],"hiredAt":"2024-08-06T00:21:07.190Z","topics":["Writing","Japanese","College Essay Writing","History","Creative Writing","History Project","Video / Photography","Visual Arts / Graphic Design"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lola-si
