xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"1c9511ef-8b69-4fc9-b4e9-dc1d046e54c8\"}":{"__typename":"DeepDives","uuid":"1c9511ef-8b69-4fc9-b4e9-dc1d046e54c8","content":"\u003cp\u003eMy greatest mentor is my dad. When I was little, he would always stay up with me and help me with challenging math problems. As I got older, this became a kind of tradition—working on complex problems together. He helped me realize that I was capable of much more than I originally thought, and building that confidence in myself has helped me excel in all types of ways growing up.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"29dc380f-745d-48d3-b3c5-3f08aea13c35\"}":{"__typename":"DeepDives","uuid":"29dc380f-745d-48d3-b3c5-3f08aea13c35","content":"\u003cp\u003eI would tell myself nothing is out of reach! There was so much I was able to try that I never imagined possible, and I owe this all to having mentors along the way. This is exactly why I want to be a mentor as well, because helping others reach their full potential is an amazing feeling.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b7267406-f791-4e6e-80d0-1a58c9b64160\"}":{"__typename":"DeepDives","uuid":"b7267406-f791-4e6e-80d0-1a58c9b64160","content":"\u003cp\u003eI want to run a marathon!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"de05f86d-add7-46e1-aa79-220b30bb6a90\"}":{"__typename":"DeepDives","uuid":"de05f86d-add7-46e1-aa79-220b30bb6a90","content":"\u003cp\u003eMentorship to me is such a gift. I love learning, and find that explaining concepts to others mutually benefits both parties. I also love hearing questions I've never thought about, and working through them logically together. Additionally, I've always loved working with passionate, excited students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"0fd07654-0b9f-4b12-bcc1-70d0ac9b8fb8\"}":{"__typename":"School","uuid":"0fd07654-0b9f-4b12-bcc1-70d0ac9b8fb8","name":"St. Andrews School ","city":"Middletown","type":"HIGH","state":"DE","country":"USA","zip":"19709"},"Education:{\"uuid\":\"b5e9ab68-961f-4242-8f84-60f80624970d\"}":{"__typename":"Education","uuid":"b5e9ab68-961f-4242-8f84-60f80624970d","school":{"__ref":"School:{\"uuid\":\"0fd07654-0b9f-4b12-bcc1-70d0ac9b8fb8\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1408b6c8-9724-4a73-a5d6-c30fb834a8f4\"}":{"__typename":"Education","uuid":"1408b6c8-9724-4a73-a5d6-c30fb834a8f4","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Applied Math and Political Science","degree":null},"MentorPublicProfile:{\"uuid\":\"041bd2c1-dcec-4083-941a-8e8152797096\"}":{"__typename":"MentorPublicProfile","uuid":"041bd2c1-dcec-4083-941a-8e8152797096","displayName":"Pearl M.","slug":"pearl-mallick","biography":"\u003cp\u003eHi! I’m Pearl, and I’m really excited about the possibility of being your mentor.\u003c/p\u003e\u003cp\u003eI love teaching, and I’ve held mentorship roles for most of my life: everything from SAT tutoring to physics and math tutoring, plus teaching at the elementary school level. I’m originally from Boston, but I’ve also lived in the Philippines, Finland, and South Africa. After high school, I took a gap year to keep traveling and learning from new cultures, which I’m still so grateful I did.\u003c/p\u003e\u003cp\u003eNow I’m a junior at Yale University studying math and political science. I’ve loved math for as long as I can remember, and one of my favorite things is helping people realize what they’re capable of. I’ve also seen firsthand how much easier math becomes when you have someone who’s willing to slow down, explain things clearly, and break confusing concepts into simpler steps— so that’s exactly the kind of mentor I try to be. I really believe strong foundations at any level make a huge difference long-term, and I love helping students build that confidence early.\u003c/p\u003e\u003cp\u003eOutside of school, I’ve done lots of different things: I founded “High Schoolers for Carbon Dividends” and helped a bill reach Congress, researched and wrote documents connected to Supreme Court cases, built websites, and worked in both astrophysics and genetics labs. Right now, alongside school and Curious Cardinals, I also work in a genetics lab at Harvard University. All of that has made me pretty adaptable—whether you want support with schoolwork, a bigger academic goal, or a passion project, I’m happy to meet you where you are and figure out what’s most helpful.\u003c/p\u003e\u003cp\u003eMore than anything, I care about helping people reach their full potential, build real confidence, and work through the material that feel frustrating or confusing. I try to create a super easygoing environment where you can be totally honest about what isn’t making sense, because clearing up that confusion is exactly what I’m here for. I genuinely find a lot of joy in helping others.\u003c/p\u003e\u003cp\u003eA few fun facts about me: I was a competitive dancer growing up, I play guitar, and I competed on Yale’s Division 1 crew team.\u003c/p\u003e\u003cp\u003eI’m really looking forward to meeting you!\u003c/p\u003e","teachingVideoPlaybackId":"9vFWXeU4YsjwihsEBrlYfEIr00ejZqHsJj8x021oDt9HM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Math and Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1c9511ef-8b69-4fc9-b4e9-dc1d046e54c8\"}"},{"__ref":"DeepDives:{\"uuid\":\"29dc380f-745d-48d3-b3c5-3f08aea13c35\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7267406-f791-4e6e-80d0-1a58c9b64160\"}"},{"__ref":"DeepDives:{\"uuid\":\"de05f86d-add7-46e1-aa79-220b30bb6a90\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b1bdaad9-5916-4638-9b5f-db12cb8009cd/-/preview/-/format/jpg/","https://ucarecdn.com/36362cfa-30fe-4d4f-bed5-145524d52b7e/-/preview/-/format/jpg/","https://ucarecdn.com/0d40e5ab-32b6-4226-9a1c-60f6b8da9aef/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b5e9ab68-961f-4242-8f84-60f80624970d\"}"},{"__ref":"Education:{\"uuid\":\"1408b6c8-9724-4a73-a5d6-c30fb834a8f4\"}"}],"hiredAt":"2025-12-23T09:53:49.147Z","topics":["K-5 Grade Math","Pre-Algebra","A
