xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ca678a91-0619-4933-a715-721ba855dc06\"}":{"__typename":"Favorites","uuid":"ca678a91-0619-4933-a715-721ba855dc06","photoUrl":"https://ucarecdn.com/b71e4e5e-2251-4469-8957-b23147dfc7b5/","title":"Vincent Van Gogh","type":"ARTIST"},"Favorites:{\"uuid\":\"598edad2-5551-402f-b2bd-10eb54498217\"}":{"__typename":"Favorites","uuid":"598edad2-5551-402f-b2bd-10eb54498217","photoUrl":"https://ucarecdn.com/5da36885-a357-48d8-af3b-3f781fee2501/","title":"La Bamba ","type":"MOVIE"},"Favorites:{\"uuid\":\"286799e6-2b7e-4f0d-ac35-1cabd5ed92e7\"}":{"__typename":"Favorites","uuid":"286799e6-2b7e-4f0d-ac35-1cabd5ed92e7","photoUrl":"https://ucarecdn.com/25818ccb-25ca-49be-94e3-b36eb20d3894/","title":"Minecraft","type":"GAME"},"CausesSupported:{\"uuid\":\"3a0f7781-824a-4e74-9923-a0e9235e742d\"}":{"__typename":"CausesSupported","uuid":"3a0f7781-824a-4e74-9923-a0e9235e742d","name":"Sojourner House","description":"\u003cp\u003eFundraising and hosting DV awareness workshops at Sojourner House.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/1b3f04d6-79e4-4258-a9bc-8872917f15ea/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"674ba744-b057-4fa2-956a-d2ef091b7b2e\"}":{"__typename":"DeepDives","uuid":"674ba744-b057-4fa2-956a-d2ef091b7b2e","content":"\u003cp\u003eMentorship matters to me because I have lived firsthand what it can unlock.\u003c/p\u003e\u003cp\u003eI come from a community where higher education was not always emphasized as the default path. There was talent everywhere, intelligence, creativity, resilience, but many students simply didn’t have someone consistently reinforcing that their goals were possible. What we often lacked wasn’t ability. It was exposure, structure, and someone willing to take a chance on us.\u003c/p\u003e\u003cp\u003eThroughout my life, a long line of mentors chose to take that chance on me. Teachers, coaches, and advisors pushed me to think bigger, apply to places I wasn’t sure I belonged, and pursue opportunities that felt out of reach. Their belief in me slowly became my own belief in myself.\u003c/p\u003e\u003cp\u003eToday, I am studying Mechanical Engineering at Brown University, my dream school, and preparing to enter the aerospace field, my dream industry. I’ve had the opportunity to contribute to real research projects and collaborate with experts, including researchers connected to NASA initiatives, an organization I have dreamed of working with for years. None of that happened in isolation. It happened because people invested in me before I fully knew how to invest in myself.\u003c/p\u003e\u003cp\u003eThat is why mentorship matters so deeply to me. Education is important, but empowerment is transformative. When a student begins to believe they are capable, when they feel seen, supported, and challenged, their trajectory can change.\u003c/p\u003e\u003cp\u003eI mentor because I want to be the person who takes a chance on someone else.\u003c/p\u003e\u003cp\u003eEvery student has potential. Sometimes they just need someone steady in their corner, helping them build confidence, direction, and momentum. If I can help even one student see themselves differently and pursue something bigger than they thought possible, then I’m honoring the people who did that for me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"a9fa10ce-7be0-40a6-befc-c85b5a48755f\"}":{"__typename":"DeepDives","uuid":"a9fa10ce-7be0-40a6-befc-c85b5a48755f","content":"\u003cp\u003eIn high school, I was incredibly driven and very determined to shape my future through my education.\u003c/p\u003e\u003cp\u003eI believed that college was my pathway to opportunity, so I treated it that way. I worked multiple jobs to save money for applications and extracurriculars; I was a cashier at the county fair, a small-time baker, a tutor, and even a background actor for various shows and films. If there was a way to earn and invest in my future, I would take it.\u003c/p\u003e\u003cp\u003eAt school, I immersed myself in leadership and academics. I was captain of my cheer, color guard, and debate teams. I served as an officer in the National Honor Society and participated in several volunteer organizations. Academically, I graduated as valedictorian and ranked first in my class all four years. I was honored to earn the Gates Scholarship, QuestBridge Scholarship, and the Hispanic Scholarship Fund Scholarship, which allowed me to attend college on a full ride. I also became the first student from my high school in over a decade to attend an Ivy League institution.\u003c/p\u003e\u003cp\u003eI am proud of what I accomplished. But I also worked myself to the bone.\u003c/p\u003e\u003cp\u003eI often left the house before breakfast, returned after dinner, studied through lunch, and rarely gave myself space to rest. I didn’t know there was another way to succeed. I thought exhaustion was the price of achievement.\u003c/p\u003e\u003cp\u003eWhat I’ve learned since then, through college, mentorship, and experience, is that students can be ambitious and well-rounded without sacrificing their health and well-being. Sleep, balance, and a social life are not distractions from success; they are part of it.\u003c/p\u003e\u003cp\u003eBecause of my experience, I’m especially passionate about helping students build strong resumes and big goals in sustainable ways. I want them to challenge themselves and also take care of themselves. Success should feel empowering, not punishing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"260a1d6e-1233-44cb-a140-bb52098eeb0f\"}":{"__typename":"DeepDives","uuid":"260a1d6e-1233-44cb-a140-bb52098eeb0f","content":"\u003cp\u003eMy greatest source of motivation is my family.\u003c/p\u003e\u003cp\u003eThey taught me the values that shaped everything I’ve accomplished: hard work, accountability, and the importance of strong support systems. I may have put in countless hours of effort to get where I am today, but I would not be here without them.\u003c/p\u003e\u003cp\u003eMy parents valued my education above everything else. Even in a community where college was not the norm and where people like us were rarely expected to attend, let alone pursue ambitious careers, I never doubted that I would go. It was never a question of if, but where. Neither of my parents attended college, yet they built a home where academic success was expected, supported, and celebrated.\u003c/p\u003e\u003cp\u003eThey drove me to school before sunrise, practices after school, and competitions on weekends. They supported my biggest dreams without ever making me feel naive for having them. They gave me love, encouragement, and quiet confidence. As I’ve grown, now attending interviews, conferences, and working alongside experts in my field, they’ve continued to offer whatever guidance they can, even when the territory is unfamiliar to them. The financial sacrifices, time, and unwavering belief they have poured into me are things I can never fully repay, and they have never once asked me to.\u003c/p\u003e\u003cp\u003eMy older brothers were another source of motivation. They brought friendly competition but also stepped in as mentors, helping me navigate financial aid, college applications, and the complexities of being a first-generation college student. They helped fill knowledge gaps my parents couldn’t, so I wouldn’t have to figure everything out alone.\u003c/p\u003e\u003cp\u003eAnd my younger sister motivates me in a different way. For the past eleven years she’s been alive, I’ve tried to be someone she can look up to; someone who shows her that through hard work, resilience, and belief in yourself, you can build a future bigger than your circumstances. Knowing she is watching pushes me to keep growing.\u003c/p\u003e\u003cp\u003eBecause of my family, I believe deeply that success is never a solo effort. It takes belief, support, and a team. That’s something I carry into mentorship. I don’t just want students to work hard; I want them to feel supported while they do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"56bb7046-2b66-4b2a-b9bb-222a17a16cb7\"}":{"__typename":"DeepDives","uuid":"56bb7046-2b66-4b2a-b9bb-222a17a16cb7","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to contribute meaningfully to the future of space exploration.\u003c/p\u003e\u003cp\u003eI’ve dreamed for years of working with NASA and dedicating myself to research that advances our understanding of space; whether that’s through mission design, aerospace systems, or long-duration exploration initiatives. Space represents possibility, curiosity, and the courage to push beyond known limits. Being part of that effort would mean contributing to something larger than myself.\u003c/p\u003e\u003cp\u003eAt the same time, I never want to abandon my creative side. Writing has always been a part of who I am, and I hope to continue telling stories alongside my technical work. Whether through creative writing or nonfiction projects, storytelling allows me to explore humanity, perspective, and meaning in ways that complement engineering.\u003c/p\u003e\u003cp\u003eBut above all, what I hope to accomplish is simpler and more personal: I want to become someone others can look up to.\u003c/p\u003e\u003cp\u003eIf I can build a career rooted in integrity, curiosity, and excellence, and then use that experience to mentor, guide, and uplift the next generation, I will consider that a success. The mentors in my life changed my trajectory by believing in me before I fully believed in myself. I hope to do the same for future students one day.\u003c/p\u003e\u003cp\u003eIf even one person can look at my journey and think, “If she did it, maybe I can too,” that would mean everything to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"d0d5ab56-dd27-4320-942e-fabf384b435b\"}":{"__typename":"School","uuid":"d0d5ab56-dd27-4320-942e-fabf384b435b","name":"Pomona Catholic School","city":"Pomona","type":"HIGH","state":"California","country":"United States","zip":"91768"},"Education:{\"uuid\":\"b59079ce-814e-4736-9045-fbd678e2c99d\"}":{"__typename":"Education","uuid":"b59079ce-814e-4736-9045-fbd678e2c99d","school":{"__ref":"School:{\"uuid\":\"d0d5ab56-dd27-4320-942e-fabf384b435b\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"f9aeafbc-e23f-457a-9b27-048574af723c\"}":{"__typename":"Education","uuid":"f9aeafbc-e23f-457a-9b27-048574af723c","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering ","degree":null},"MentorPublicProfile:{\"uuid\":\"6651fbf2-95b5-4c41-a6fa-dcd9bbe3a32e\"}":{"__typename":"MentorPublicProfile","uuid":"6651fbf2-95b5-4c41-a6fa-dcd9bbe3a32e","displayName":"Savannah H.","slug":"savannah-herrera","biography":"\u003cp\u003eHi! I’m Savannah, a Mechanical Engineering student at Brown University who is passionate about helping students build confidence, curiosity, and momentum in their academic journeys.\u003c/p\u003e\u003cp\u003eMy path hasn’t been perfectly linear. I had struggled with ADHD and spent much of high school and early college figuring out how to manage motivation, time, and structure. It wasn’t until my sophomore year that I discovered my passion for advancing lunar and Mars research. Once I did, everything clicked. Since then, I’ve worked on space systems design projects, contributed to research initiatives, and taken on leadership roles that challenge me both academically and personally.\u003c/p\u003e\u003cp\u003eAt Brown, I study mechanical engineering, where I apply math and science to real-world problems. I’ve worked on satellite design concepts, biological experiments for space environments, and long-duration mission architecture projects. I collaborate on real research papers and have had the opportunity to work alongside experts in the aerospace field, including researchers connected to NASA initiatives. These experiences have strengthened both my technical skills and my ability to think critically, communicate clearly, and solve complex problems. My experiences have cultivated into a love for helping students make complex STEM concepts feel approachable and empowering rather than intimidating.\u003c/p\u003e\u003cp\u003eAt the same time, I’ve always had a deep love for history and writing. I’m particularly strong in analytical and argumentative writing, and I enjoy helping students structure essays, develop clear theses, and strengthen their voice. In my free time, I write creatively and am currently working on a non-fiction biography project; an experience that has deepened my appreciation for research, storytelling, and revision. Whether a student needs help with technical writing, historical analysis, or creative expression, I enjoy guiding them through the process.\u003c/p\u003e\u003cp\u003eBecause of my own journey, I especially connect with students who feel stuck, overwhelmed, or unsure of their direction. I work well with students who want to improve study skills, build accountability, explore new interests, or develop an impressive passion project but don’t know where to start.\u003c/p\u003e\u003cp\u003eMy mentoring style is collaborative and empowering. I don’t just provide answers, I ask thoughtful questions, help students develop systems that work for them, and break big goals into achievable steps. My goal is always to help students feel capable, confident, and excited about what they’re building.\u003c/p\u003e\u003cp\u003eEvery student has potential. Sometimes they just need the right structure, strategy, and support to unlock it, and I would be honored to help them find their path.\u003c/p\u003e","teachingVideoPlaybackId":"LHxnP3jVLB01GDd01zvXdRzNEAG15R8IBovjMhkwATOLs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m really proud of is becoming the first student from my high school in over a decade to attend an Ivy League university.\u003c/p\u003e\u003cp\u003eWhere I grew up, students had potential, but there wasn’t always a strong culture of pursuing higher education at an elite level. Many of us didn’t have access to mentors who had navigated the college admissions process, and as a first-generation college student, my family and I had to figure out much of it on our own.\u003c/p\u003e\u003cp\u003eI worked multiple jobs throughout high school, balanced leadership roles, and pushed myself academically, not just because I wanted to succeed, but because I believed education could change the trajectory of my life. Earning valedictorian, receiving full-ride scholarships like the Gates Scholarship and QuestBridge, and ultimately attending Brown University felt like more than personal accomplishments. It felt like opening a door.\u003c/p\u003e\u003cp\u003eWhat I’m most proud of isn’t just the recognition; it’s that I showed students in my community that it’s possible. I’ve since had younger students reach out asking how they can apply to competitive colleges or pursue scholarships they didn’t know existed. Knowing that my journey expanded someone else’s sense of what’s achievable means more to me than any title.\u003c/p\u003e\u003cp\u003eThat experience reinforced something I carry into mentorship: talent is everywhere, but opportunity and guidance are not. When students are given both, they can exceed even their own expectations.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ca678a91-0619-4933-a715-721ba855dc06\"}"},{"__ref":"Favorites:{\"uuid\":\"598edad2-5551-402f-b2bd-10eb54498217\"}"},{"__ref":"Favorites:{\"uuid\":\"286799e6-2b7e-4f0d-ac35-1cabd5ed92e7\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"3a0f7781-824a-4e74-9923-a0e9235e742d\"}"}],"major":"Mechanical Engineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"674ba744-b057-4fa2-956a-d2ef091b7b2e\"}"},{"__ref":"DeepDives:{\"uuid\":\"a9fa10ce-7be0-40a6-befc-c85b5a48755f\"}"},{"__ref":"DeepDives:{\"uuid\":\"260a1d6e-1233-44cb-a140-bb52098eeb0f\"}"},{"__ref":"DeepDives:{\"uuid\":\"56bb7046-2b66-4b2a-b9bb-222a17a16cb7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6bfebf78-ca92-4e29-8156-db9fc2311bb6/-/preview/-/format/jpg/","https://ucarecdn.com/f9ed973f-11bd-4852-8ddf-c3ec85285771/-/preview/-/format/jpg/","https://ucarecdn.com/d3366341-68df-4bde-aabc-00820202e240/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b59079ce-814e-4736-9045-fbd678e2c99d\"}"},{"__ref":"Education:{\"uuid\":\"f9aeafbc-e23f-457a-9b27-048574af723c\"}"}],"hiredAt":"2026-02-17T21:08:38.116Z","topics":["Algebra I","Algebra II","Calculus","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Biology","Chemistry","Physics","Writing","Academic Coaching","College Essay Writing","History","Reading","Creative Writing","History Project","K-6 Storybook","Robotics / Electronics / CAD","STEM Project","Debate","Journalism","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"savannah-herrera\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6651fbf2-95b5-4c41-a6fa-dcd9bbe3a32e\"}"}}},"_sentryTraceData":"7dbe605b40054e2784a32e1dafeb6a4d-82aa3ef00a4ea7b7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7dbe605b40054e2784a32e1dafeb6a4d,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"savannah-herrera"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
