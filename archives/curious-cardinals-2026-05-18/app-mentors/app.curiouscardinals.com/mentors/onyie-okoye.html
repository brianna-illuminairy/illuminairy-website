xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"bb0bac32-881e-4df1-a45b-8ca5bcb7d624\"}":{"__typename":"DeepDives","uuid":"bb0bac32-881e-4df1-a45b-8ca5bcb7d624","content":"\u003cp\u003eMy greatest sources of motivation are my peers at Stanford University. Often, with the pressures of the world and the industry, we may feel as if we need to follow a certain path to find success and stability in life. However, watching the people around me take risks, pursue their unique, personal dreams, and find fulfillment in that process motivates me to continue walking my unique path and fulfill myself in doing so.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"0b8a9eef-2a14-432e-bbaf-4a3ec4296d3d\"}":{"__typename":"DeepDives","uuid":"0b8a9eef-2a14-432e-bbaf-4a3ec4296d3d","content":"\u003cp\u003eFor a long time, I've been very invested in language learning. My time in online language learning communities made me realize two things: most language learning apps are very ineffective, and most effective language learning courses are inaccessible. Those learning languages very distant from their native language and lacking the time or resources to take a formal course often must piece together their entire language learning journey by hand.\u003cbr\u003e\u003cbr\u003eAs a result, I decided I would begin the development of a language-learning app to address a lot of concerns in modern language learning - mainly, combining guided instruction with a level of freedom to be curious. The first feature I'm implementing is spaced repetition and sentence-mining supplemented vocabulary study, and I'll continue to build the rest of the app from the point!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"677ae844-b4b7-4ed3-86b9-41499b671fd8\"}":{"__typename":"DeepDives","uuid":"677ae844-b4b7-4ed3-86b9-41499b671fd8","content":"\u003cp\u003eOne of my favorite hobbies in my free time is drawing - I'm always looking for an excuse to draw something, and thinking of new subjects to illustrate!\u003cbr\u003e\u003cbr\u003eSince I was in 6th grade, drawing as been my primary vehicle of self-expression: I drew the worlds I came up with, my perception of the world around me, characters and scenes from the shows and movies that had the greatest impact on me, and characters that I came up with myself.\u003cbr\u003e\u003cbr\u003eFor my friend's birthdays, I'm always sure to draw them and include them as their present! For the most part, I'm used to drawing digitally, however, I'm beginning to branch out into more traditional art forms such as oil and watercolor painting, colored pencils, markers, and charcoal. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ee604681-e057-48a6-9a19-9fa11547b76d\"}":{"__typename":"DeepDives","uuid":"ee604681-e057-48a6-9a19-9fa11547b76d","content":"\u003cp\u003eMentorship matters to me because I believe that it's our duty to bring about the full potential of every person in our younger generations.\u003cbr\u003e\u003cbr\u003eMany people never self-actualize because they never had the option: they may have lacked the support, education, guidance, or self-confidence to explore their interests and skills fully, and never barely get a glimpse of the greatness they are capable of.\u003cbr\u003e\u003cbr\u003eEvery person has a unique, valuable perspective to offer the world, and I believe that a mentor has the important job of listening and understanding that perspective, then encouraging and guiding their mentee in taking that perspective to the real world without getting lost.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"5a5e3eea-a53f-4090-97a2-47c0761bba84\"}":{"__typename":"School","uuid":"5a5e3eea-a53f-4090-97a2-47c0761bba84","name":"Tahoma High School","city":"Maple Valley","type":"HIGH","state":"Washington","country":"United States","zip":"98038"},"Education:{\"uuid\":\"284712e3-ef5f-47bc-aab4-3a9c863fe914\"}":{"__typename":"Education","uuid":"284712e3-ef5f-47bc-aab4-3a9c863fe914","school":{"__ref":"School:{\"uuid\":\"5a5e3eea-a53f-4090-97a2-47c0761bba84\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"c13b20a8-fc40-45a8-abd4-a8b37fb0d060\"}":{"__typename":"Education","uuid":"c13b20a8-fc40-45a8-abd4-a8b37fb0d060","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"63844e01-14df-449f-ab71-1ea36356e019\"}":{"__typename":"MentorPublicProfile","uuid":"63844e01-14df-449f-ab71-1ea36356e019","displayName":"Onyie O.","slug":"onyie-okoye","biography":"\u003cp\u003eHello! My name is Onyie Okoye, and I'm currently a sophomore at Stanford University majoring in Computer Science - likely specializing in Computer Systems, and minoring in Art Practice and Astronomy!\u003cbr\u003e\u003cbr\u003eIn my free time, I like to spend time drawing, working on game development, reading (\"A Brief History of Time\" is my favorite book!), practicing creative writing, solving coding and math problems, and studying languages. I'm in my second year of formal Japanese study, and I'm planning on studying Mandarin and French in the future!\u003cbr\u003e\u003cbr\u003eLast summer, I was a software engineering intern at NASA's Jet Propulsion Laboratory, where I helped develop and maintain the suite of tools used to plan the activities of the Curiosity Rover on Mars! Additionally, in high school, I was a computational biology intern at the Institute of Systems Biology, where I analyzed the relationship between various lifestyle factors and the diversity of the human gut microbiome.\u003cbr\u003e\u003cbr\u003eI'm very passionate about applying your academic interests to projects! A lot of games, apps, and websites are phenomenally crafted compositions of complex, organized code, and elegant, creative design. When you take a moment to appreciate the intricate physics of games like Outer Wilds or the expanse of the open world of Breath of the Wild, you truly realize that these are products of intellectual passion!\u003cbr\u003e\u003cbr\u003eRight now, I am working on two projects. One is a 2D story-based video game in Unity, using C#. The other is a language-learning platform for iOS, Android, and the web. So far, these projects have been an enthralling journey of planning, programming, designing, writing, and collaborating; it's an exciting way to engage my curiosity and further explore my academic interests, as well as develop my understanding of entrepreneurship and business!\u003cbr\u003e\u003cbr\u003eOne of the things I value and promote most is curiosity! You'll never get bored of learning more, so always continue your pursuit of knowledge!\u003c/p\u003e","teachingVideoPlaybackId":"5JfRZPc02l01tXbfmw9kStuFVUZaRcshzo01oqCIjLOQYU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bb0bac32-881e-4df1-a45b-8ca5bcb7d624\"}"},{"__ref":"DeepDives:{\"uuid\":\"0b8a9eef-2a14-432e-bbaf-4a3ec4296d3d\"}"},{"__ref":"DeepDives:{\"uuid\":\"677ae844-b4b7-4ed3-86b9-41499b671fd8\"}"},{"__ref":"DeepDives:{\"uuid\":\"ee604681-e057-48a6-9a19-9fa11547b76d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2a0dd9cc-04e3-4664-830e-b51f151cecaf/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"284712e3-ef5f-47bc-aab4-3a9c863fe914\"}"},{"__ref":"Education:{\"uuid\":\"c13b20a8-fc40-45a8-abd4-a8b37fb0d060\"}"}],"hiredAt":"2023-11-14T13:55:51.879Z","topics":["Algebra I","Algebra II","Calculus","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Geometry","Coding / Programming","Visual Arts / Graphic Design","Physics","Business / Entrepreneurship","Game Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"onyie-okoye\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"63844e01-14df-449f-ab71-1ea36356e019\"}"}}},"_sentryTraceData":"3865ddec274f47569a0b857421ada8ba-a2cb2b8cf11d958c-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500
