xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"883d7b4b-cfc2-40ad-b484-706a59a5dce8\"}":{"__typename":"DeepDives","uuid":"883d7b4b-cfc2-40ad-b484-706a59a5dce8","content":"\u003cp\u003eAfter my first year of high school, I spent eight weeks at a summer camp in New Hampshire for my seventh and last summer there. I had gone to this summer camp since I was nine years old and had made very close friends there over the years. After my sophomore year of high school, I knew I wanted to do something new and different that involved traveling, meeting new people, and putting myself in situations I had never experienced before. First, I went to Spain for three weeks— where I lived as a child— and stayed with an old friend, first in Madrid, and then in the north of Spain where we completed an eight day hiking trip with six of her friends. While I had never previously met these friends, the long days of hiking allowed me to both get to know them on a deep level and practice my Spanish. After this trip, I went to a two-week Jewish summer camp in Hungary called Szarvas, as part of a group of twenty American teen fellows. Szarvas is a summer camp that brings together Jews from around Eastern Europe, the United States, and Israel, and the American teen fellowship focuses on leadership and building meaningful connections. While it was only two weeks long, I made close friendships that I still have to this day. The summer after my junior year of high school, I decided to work as a lab intern at Weill Cornell Medical school, in the vascular biology department. Back then, I was interested in pursuing Pre Med in college and wanted to further explore that interest. Several of the lab assistants were from Italy and spoke Italian in the lab, and I was able to learn and pick up a little Italian throughout the summer.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f1b14190-96e1-4e25-912d-d1d4cb874811\"}":{"__typename":"DeepDives","uuid":"f1b14190-96e1-4e25-912d-d1d4cb874811","content":"\u003cp\u003eDuring Covid, I spent a lot of my free time cooking and baking, and over time I began creating and documenting my own recipes. Back then, I was a fully plant-based eater, and I strived to create innovative recipes without any animal products. After several months, I decided to compile several recipes and photos of the dishes into a document. I had worked on several publications in the past, including my high school’s newspaper and literary magazine publications, and had experience with using Adobe Indesign, so I used these skills in order to put together a mini cookbook with twenty recipes— ten savory and ten sweet— that I then sold over instagram. Some of my favorite recipes from this cookbook include my sweet potato - spelt flour gnocchi and a pomegranate tart. It has been very rewarding to receive feedback on the cookbook and hear about people using the recipes for weeknight dinners. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9b1b2cee-1c8d-4afc-afe3-5605e2766cd0\"}":{"__typename":"DeepDives","uuid":"9b1b2cee-1c8d-4afc-afe3-5605e2766cd0","content":"\u003cp\u003eDuring my first year at Yale, I enrolled in two philosophy courses that spanned works from Ancient Greece to modern times, and I realized that I wanted to study an applied version of philosophy throughout the rest of my time in college. My Ethics, Politics, and Economics major allowed me to use a philosophical/theoretical lens in order to study the intersection of these disciplines. My favorite aspect of the major was the ability to further understand and break down the process of individual and collective decision making, especially in the political sphere, as well as the ability to holistically understand a historical event through multiple angles (ethical, political, and economic implications). Two of my favorite classes within the major were “Moral Choices in Politics” and “Business Ethics and Law”.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c5f68294-dc13-48a4-a9a6-dd500638d32b\"}":{"__typename":"DeepDives","uuid":"c5f68294-dc13-48a4-a9a6-dd500638d32b","content":"\u003cp\u003eMentorship has allowed me to learn, develop greater perspective, and make decisions that have brought me from one stage of my life to another. I have sought one-on-one mentorship from my parents and grandparents, as well as peers who are only a bit older than me, in order to evaluate and learn about different academic and creative paths I have been interested in. I believe that mentorship is a lifelong journey with relationships that continue to evolve and grow, and my appreciation for it is the reason I have tutored in the past, and why I want to continue building long lasting relationships through teaching, mentoring, and developing passion projects.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"4f8b1a13-39ae-488a-9be2-5e9100ca9898\"}":{"__typename":"School","uuid":"4f8b1a13-39ae-488a-9be2-5e9100ca9898","name":"The Ramaz School Upper School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10075"},"Education:{\"uuid\":\"99f66d1d-7f5c-4c95-a987-63bee6a2b672\"}":{"__typename":"Education","uuid":"99f66d1d-7f5c-4c95-a987-63bee6a2b672","school":{"__ref":"School:{\"uuid\":\"4f8b1a13-39ae-488a-9be2-5e9100ca9898\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"c1c78e31-4eb1-45be-a7b1-1ff2eafe0bc1\"}":{"__typename":"Education","uuid":"c1c78e31-4eb1-45be-a7b1-1ff2eafe0bc1","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Ethics, Politics, \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"1912beca-b55c-4e41-a2a0-eb2cda66a364\"}":{"__typename":"MentorPublicProfile","uuid":"1912beca-b55c-4e41-a2a0-eb2cda66a364","displayName":"Julia L.","slug":"julia-levi","biography":"\u003cp\u003eHi! My name is Julia, and I studied Ethics, Politics, \u0026amp; Economics at Yale— I just finished my degree in December but will officially graduate in spring 2024. I have several places I call home; while I grew up in NYC, I was born in Madrid and lived there until I was seven, and I also lived in Israel during my gap year between high school and college. At Yale, I loved studying philosophy and applying it to my everyday life, as well as learning about the different elements of forming an argument. I am also super interested in behavioral economics, decision making (both in everyday life and politics), foreign policy, and international law. Throughout college, I have been part of several extracurriculars, including the Urban Philanthropic Fund, where I led a team in the rebranding and website remodeling of Emerge CT, a New Haven nonprofit, which helps formerly incarcerated people reenter the workforce and their communities. I have also written several articles for the Yale Daily News and the Yale Globalist and especially love writing restaurant reviews. Throughout college, I have tutored English, essay writing, and math at various levels. I have always loved to write, and in high school, I led the school newspaper and literary magazine publications during my senior year. I took this love for writing into college, developing several essay writing methods that work for both short and long assignments.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also love to pursue creative passion projects; I love to write, cook, and create my own recipes, and during Covid, I developed a cookbook that I sold featuring twenty original recipes using Adobe Indesign and original photography. I also pursued a second creative project and made, photographed, and sold original jewelry over the course of four months using a combination of old and new pieces. I believe that it is super important to have a range of interests and passions that you pursue at a deep level, and I always seek to strike a balance between my creative and academic interests. I also love taking long walks, skiing, being in nature, and trying new restaurants/ food spots for cooking inspiration.\u003c/p\u003e","teachingVideoPlaybackId":"WGv01X00mAh2f1FMjwKdYfODjAr4B7gB8ZVqhLqdd7T00Y","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Ethics, Politics, \u0026 Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"883d7b4b-cfc2-40ad-b484-706a59a5dce8\"}"},{"__ref":"DeepDives:{\"uuid\":\"f1b14190-96e1-4e25-912d-d1d4cb874811\"}"},{"__ref":"DeepDives:{\"uuid\":\"9b1b2cee-1c8d-4afc-afe3-5605e2766cd0\"}"},{"__ref":"DeepDives:{\"uuid\":\"c5f68294-dc13-48a4-a9a6-dd500638d32b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1700db0d-cbad-4af1-b004-19d462dcf011/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"99f66d1d-7f5c-4c95-a987-63bee6a2b672\"}"},{"__ref":"Education:{\"uuid\":\"c1c78e31-4eb1-45be-a7b1-1ff2eafe0bc1\"}"}],"hiredAt":"2024-02-05T00:02:13.112Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Writing","Academic Coaching","College Essay Writing","Reading","Executive Function"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"julia-levi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"1912beca-b55c-4e41-a2a0-eb2cda66a364\"}"}}},"_sentryTraceData":"b0a40a84ea504a31a8b0c8835904bb44-978dd8e28bc841c6-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b0a40a84ea504a31a8b0c8835904bb44,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"julia-levi"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push
