xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"fe20b198-07d5-4bd0-a919-229472c71985\"}":{"__typename":"DeepDives","uuid":"fe20b198-07d5-4bd0-a919-229472c71985","content":"\u003cp\u003eI chose my major because tech gives you endless creative freedom—you're only limited by your imagination. My first project was a Python script that automatically updated my parents’ restaurant prices on DoorDash. It showed me how even small tools can make a real-world impact, and I’ve been hooked ever since.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"849631c2-d4a1-4cc9-988e-70fef0608ece\"}":{"__typename":"DeepDives","uuid":"849631c2-d4a1-4cc9-988e-70fef0608ece","content":"\u003cp\u003eWatching my immigrant parents work tirelessly in our family restaurant taught me the value of hard work and resourcefulness. It also inspired me to use technology to make life easier for others. That’s why my teaching style is empathetic and solutions-oriented—I want to empower students to build tools that matter, just like I did when I created a Python script to help my parents manage DoorDash pricing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"3e888038-625c-4f72-8d56-68f7f56d9000\"}":{ have helped me grow as both a developer and a teammate, and they’ve shown me how impactful technology can be when paired with purpose.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I’m all about balance and creativity. I love playing the drums, watching Duke basketball (go Blue Devils!), and hitting the gym. Whether I’m coding or playing music, I enjoy learning new things, pushing my limits, and staying curious.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I aim to bring energy, encouragement, and clarity to every session. I want students to walk away not only understanding the “how” of coding, but also the “why”—and hopefully, feeling inspired to keep building.\u003c/p\u003e","teachingVideoPlaybackId":"IQM6UfXAc4gKWWZkBjPNd7lvRClJP01DDT01gxV6QbKss","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fe20b198-07d5-4bd0-a919-229472c71985\"}"},{"__ref":"DeepDives:{\"uuid\":\"849631c2-d4a1-4cc9-988e-70fef0608ece\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a87044fa-0664-4096-ac1b-f5008b4eac8b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c984c957-4bee-42a6-8576-edb24d3f6a33\"}"},{"__ref":"Education:{\"uuid\":\"73fed6a1-261b-44a6-8d37-c084e34455ce\"}"}],"hiredAt":"2025-06-05T01:15:51.729Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Creative Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"brandon-cheng\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"15720d30-3ea9-4846-8c83-054b7ec38534\"}"}}},"_sentryTraceData":"a6959ce5c59d4fcf9c3d19c53e26fd19-ac38a913cc7a7d0e-0","_sentryBaggage":"sentry-environment=vercel-production,sentr
