xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"75da179b-7900-4154-8c02-c97b497a6214\"}":{"__typename":"Favorites","uuid":"75da179b-7900-4154-8c02-c97b497a6214","photoUrl":"https://ucarecdn.com/76dbe6be-33a6-4023-8d30-2204fcf9f484/","title":"Everything Everywhere All At Once","type":"MOVIE"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"aae9fd71-94f7-4220-9d43-ae2fd979e70a\"}":{"__typename":"DeepDives","uuid":"aae9fd71-94f7-4220-9d43-ae2fd979e70a","content":"\u003cp\u003eThere's so much I love doing in my spare time! First of all, I love spending time with family through watching Cdramas and playing cards/mahjong. I also enjoy playing volleyball and badminton with friends and have been trying to stay consistent with going to the gym! After a long day of classes, my introverted self loves to turn on a fun episode of Running Man and indulge in Honey Mustard Dot's Pretzels while laying on the couch. Sometimes I get this sudden urge to sing, so I would karaoke for 3 hours straight. I also love to dance (not professionally)! I have always admired those who dance very well and have been slowly learning some Kpop choreo that seems really fun :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f9d40786-a991-46df-ae96-4e7e4dddaff0\"}":{"__typename":"DeepDives","uuid":"f9d40786-a991-46df-ae96-4e7e4dddaff0","content":"\u003cp\u003eMy advice would be to branch out more! Not only socially but also extracurricularly! Looking back, I feel that I have focused too much of my extracurriculars on health and medicine related activities. While those were rewarding, I wish I spent more time exploring my hobbies, such as dancing and sports. I also wish I had been more confident in myself and spoke more to friends who I usually do not talk to. Sometimes the best friendships spark in the most random ways! I wish I could tell myself to not be afraid and go talk to the people I want to get to know better. I think the key to that is to be confident in yourself and understand there's nothing to lose. :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"224fd291-fa46-428c-87fc-4a1d4248e056\"}":{"__typename":"DeepDives","uuid":"224fd291-fa46-428c-87fc-4a1d4248e056","content":"\u003cp\u003eDuring the summer, I traveled to China to visit my relatives. It was such a fun and eye opening experience truly experiencing Chinese culture and observing how different the culture was in comparison to American culture. Besides travelling, I also was involved in research camps and jobs. I attended biological research camps through the University of Michigan and worked as a teaching assistant for University of Michigan through their Math Corps program for 2 summers!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a9d29d34-0e90-4ae8-98b6-cc255b4cabcb\"}":{"__typename":"DeepDives","uuid":"a9d29d34-0e90-4ae8-98b6-cc255b4cabcb","content":"\u003cp\u003eI chose the Health Sciences major because it was the only major that holistically covered aspects of public health in addition to population/community health. I have an avid interest in all things health related, and this major does not just focus on the super sciency subjects but also ties in social determinants of health and brings conversations around health through a different lens. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"12a8d8be-2886-4fd9-9ace-64618c6b2b53\"}":{"__typename":"School","uuid":"12a8d8be-2886-4fd9-9ace-64618c6b2b53","name":"Washtenaw International High School \u0026 Middle Academy","city":"Ypsilanti","type":"HIGH","state":"Michigan","country":"United States","zip":"48197"},"Education:{\"uuid\":\"f7dc2919-a659-45e1-949b-4de8abf42eec\"}":{"__typename":"Education","uuid":"f7dc2919-a659-45e1-949b-4de8abf42eec","school":{"__ref":"School:{\"uuid\":\"12a8d8be-2886-4fd9-9ace-64618c6b2b53\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}":{"__typename":"School","uuid":"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41","name":"Rice University","city":"Houston","type":"COLLEGE","state":"Texas","country":"United States","zip":"77005"},"Education:{\"uuid\":\"0c431377-53ee-41fe-aab9-9b45841914f1\"}":{"__typename":"Education","uuid":"0c431377-53ee-41fe-aab9-9b45841914f1","school":{"__ref":"School:{\"uuid\":\"80ce3cfb-e7bd-4cc2-87cf-fc4a80b6de41\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Health Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"044534d5-bc7d-4ad2-9abf-5eb4d17e5a75\"}":{"__typename":"MentorPublicProfile","uuid":"044534d5-bc7d-4ad2-9abf-5eb4d17e5a75","displayName":"Jade X.","slug":"jade-xu-1","biography":"\u003cp\u003eI'm Jade! I major in Health Sciences on the pre health track at Rice. Besides medicine, my passions lie in healthcare disparities, specifically in food insecurity and healthcare access. I am also involved in on campus organizations like Kids Are Scientists Too, Hearts 4 Homeless, and Food Recovery Network! In my free time, I love lounging around on the couch watching reality TV shows (current fave is Running Man!). I also enjoy staying active by playing volleyball and badminton! Recently I've been trying out yoga :) One thing about me is that I can't go a day without playing Spotify music. My current go-tos are Chinese R\u0026amp;B, KPop, and Bruno Mars!\u003c/p\u003e","teachingVideoPlaybackId":"wNRIY2onDRS6RBRVnIDrrzDR6iD302M0087mlIfY62wdI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"75da179b-7900-4154-8c02-c97b497a6214\"}"}],"causesSupported":[],"major":"Health Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"aae9fd71-94f7-4220-9d43-ae2fd979e70a\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9d40786-a991-46df-ae96-4e7e4dddaff0\"}"},{"__ref":"DeepDives:{\"uuid\":\"224fd291-fa46-428c-87fc-4a1d4248e056\"}"},{"__ref":"DeepDives:{\"uuid\":\"a9d29d34-0e90-4ae8-98b6-cc255b4cabcb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7fa767e1-675e-4794-82d1-8a839d4ce361/-/preview/-/format/jpg/","https://ucarecdn.com/d9447988-40a9-4fea-a02c-75647cc9abeb/-/preview/-/format/jpg/","https://ucarecdn.com/db7335ca-6fb0-4015-9b5a-3bb01b0653f9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f7dc2919-a659-45e1-949b-4de8abf42eec\"}"},{"__ref":"Education:{\"uuid\":\"0c431377-53ee-41fe-aab9-9b45841914f1\"}"}],"hiredAt":"2024-09-12T01:44:57.858Z","topics":["K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Calculus","Algebra II","Algebra I","Geometry","Physics","Chemistry","Biology","Mandarin Chinese","Medicine / Health","Music","STEM Project","6-8 Grade Science"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jade-xu-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"044534d5-bc7d-4ad2-9abf-5eb4d17e5a75\"}"}}},"_sentryTraceData":"07c305007ec040738f2703c6e505c386-a4d64abc55f9da5b-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=07c305007ec040738f2703c6e505c386,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"jade-xu-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
