xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"26539135-dfe0-44c9-b2cd-775001b9dd9b\"}":{"__typename":"DeepDives","uuid":"26539135-dfe0-44c9-b2cd-775001b9dd9b","content":"\u003cp\u003eI chose International and Public Affairs because I wanted to learn more about all sorts of different problems... I chose Computer Science to help me get a better idea of how to solve them!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"a7ead4ca-7ce1-4df0-9c03-6d229f1a9a3b\"}":{"__typename":"DeepDives","uuid":"a7ead4ca-7ce1-4df0-9c03-6d229f1a9a3b","content":"\u003cp\u003eMy Grandma! I think of all she had to do to set herself up for success and it encourages me to take advantage of the opportunities I have now.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"b1d87abd-cbf6-4e56-b87d-f17a09d8af82\"}":{"__typename":"DeepDives","uuid":"b1d87abd-cbf6-4e56-b87d-f17a09d8af82","content":"\u003cp\u003eI manage the student-run coffee shop at school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a3c91336-b091-4966-90e9-4009ec067c40\"}":{"__typename":"DeepDives","uuid":"a3c91336-b091-4966-90e9-4009ec067c40","content":"\u003cp\u003eRolling with the punches will teach you more than any easy success. It's all a part of the plot!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"ec4e165d-8a4c-4cb4-8a1a-b07921e316ab\"}":{"__typename":"School","uuid":"ec4e165d-8a4c-4cb4-8a1a-b07921e316ab","name":"Redondo Union High School","city":"Redondo Beach","type":"HIGH","state":"CA","country":"United States","zip":"90277"},"Education:{\"uuid\":\"02ea08d4-aaa2-48a1-90d5-40880affc9d6\"}":{"__typename":"Education","uuid":"02ea08d4-aaa2-48a1-90d5-40880affc9d6","school":{"__ref":"School:{\"uuid\":\"ec4e165d-8a4c-4cb4-8a1a-b07921e316ab\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"26ebb160-06f4-4e90-bdc5-ac2af343ae56\"}":{"__typename":"School","uuid":"26ebb160-06f4-4e90-bdc5-ac2af343ae56","name":"Brown University","city":"Providence","type":"COLLEGE","state":"CA","country":"United States","zip":"90277"},"Education:{\"uuid\":\"8ce76b9e-3b45-474f-9848-89d01ba6682d\"}":{"__typename":"Education","uuid":"8ce76b9e-3b45-474f-9848-89d01ba6682d","school":{"__ref":"School:{\"uuid\":\"26ebb160-06f4-4e90-bdc5-ac2af343ae56\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"International \u0026 Public Affairs; Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"9748af83-bc8a-4aed-8030-d8090350936b\"}":{"__typename":"MentorPublicProfile","uuid":"9748af83-bc8a-4aed-8030-d8090350936b","displayName":"Ben R.","slug":"ben-ringel","biography":"\u003cp\u003eHi! I’m Ben Ringel, a student at Brown University studying International \u0026amp; Public Affairs and Computer Science. At heart, I care deeply about using data, policy, and storytelling to make systems more just and accessible, especially in areas like housing, education, and democracy. I’ve worked at the Brennan Center for Justice, Arnold Ventures, and in Congress, and I’m currently helping a local housing nonprofit use data to shape long-term strategy.\u003c/p\u003e\u003cp\u003eSome of my most meaningful experiences, though, have come from building community, whether it’s helping new Brown students find their footing as a Peer Advisor, running a student-led coffee shop, or mentoring others through public service work. Through Brown’s Swearer Center, I support students partnering with Providence nonprofits and serve as a teaching assistant for courses in Education and Native American Studies. I’ve also facilitated events that bring together diverse groups of students to talk about politics, policy, and organizing.\u003c/p\u003e\u003cp\u003eAs a tutor, I specialize in guiding high schoolers through independent passion projects—whether you want to design a research paper, build a civic campaign, conduct interviews, or explore a personal interest in depth. I love helping students figure out what drives them, and then work together to bring structure, rigor, and purpose to their ideas. I’ve advised students interested in everything from environmental justice to political journalism to AI ethics, and no two projects are ever the same. I really value curiosity and believe learning should feel both challenging and fun.\u003c/p\u003e\u003cp\u003eI understand how overwhelming it can feel to start with just an idea, or no idea at all, and try to turn it into something meaningful. That’s where I come in. I’ll help you shape a research question, design a plan, stay organized, and keep momentum, all while building the skills and confidence to own your project fully. Whether you’re applying to college, preparing for a competition, or just pursuing something because it matters to you, I’ll meet you where you are and support you along the way.\u003c/p\u003e\u003cp\u003eWhen I’m not working or studying, I spend time reading literary fiction, hanging with friends, drinking coffee, and organizing around issues like affordable housing and educational equity. I also knit (slowly), journal often, and try to run or take long walks when I can. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re excited to explore something that matters to you and want someone in your corner to help make it real, I’d love to work with you! Looking forward to it.\u003c/p\u003e","teachingVideoPlaybackId":"xZDqLwO6gutPdEjHS602lFJ3TU3ln49dTVVI00EPSft02A","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"International \u0026 Public Affairs; Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"26539135-dfe0-44c9-b2cd-775001b9dd9b\"}"},{"__ref":"DeepDives:{\"uuid\":\"a7ead4ca-7ce1-4df0-9c03-6d229f1a9a3b\"}"},{"__ref":"DeepDives:{\"uuid\":\"b1d87abd-cbf6-4e56-b87d-f17a09d8af82\"}"},{"__ref":"DeepDives:{\"uuid\":\"a3c91336-b091-4966-90e9-4009ec067c40\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/59b124ad-7260-4070-897d-04f59ba8a5e6/-/preview/-/format/jpg/","https://ucarecdn.com/f276ba8c-0f8a-4540-a3f3-74b841d57ca6/-/preview/-/format/jpg/","https://ucarecdn.com/152dadc8-21e1-4fbc-9acd-93098f75a0e3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"02ea08d4-aaa2-48a1-90d5-40880affc9d6\"}"},{"__ref":"Education:{\"uuid\":\"8ce76b9e-3b45-474f-9848-89d01ba6682d\"}"}],"hiredAt":"2025-07-30T16:42:18.391Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Writing","Spanish","Computer Science","Economics","His
