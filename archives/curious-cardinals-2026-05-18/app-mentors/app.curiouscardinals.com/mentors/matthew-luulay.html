xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"14d54056-91ee-4d54-9e69-146311490d8c\"}":{"__typename":"DeepDives","uuid":"14d54056-91ee-4d54-9e69-146311490d8c","content":null,"videoPlaybackId":"mHeeySFhlJnnlfVfqGl3bGeXvsvDpHwHGucnjzjhgHQ","question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"7d22325d-c755-46e3-adbc-01f61a6b833b\"}":{"__typename":"School","uuid":"7d22325d-c755-46e3-adbc-01f61a6b833b","name":"Kennesaw Mountain High School","city":"Kennesaw","type":"HIGH","state":"Georgia","country":"United States","zip":"30152"},"Education:{\"uuid\":\"0058cddb-69c1-44ea-b95c-cccd8aca7ea2\"}":{"__typename":"Education","uuid":"0058cddb-69c1-44ea-b95c-cccd8aca7ea2","school":{"__ref":"School:{\"uuid\":\"7d22325d-c755-46e3-adbc-01f61a6b833b\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"57a7304a-8fc4-47cd-baa8-f852bdcbf18c\"}":{"__typename":"Education","uuid":"57a7304a-8fc4-47cd-baa8-f852bdcbf18c","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Statistics and Data science ","degree":null},"MentorPublicProfile:{\"uuid\":\"5c710f43-0b6f-44dc-a67c-e0297eac6eb7\"}":{"__typename":"MentorPublicProfile","uuid":"5c710f43-0b6f-44dc-a67c-e0297eac6eb7","displayName":"Matthew L.","slug":"matthew-luulay","biography":"\u003cp\u003e“To fail less, you must fail more.”\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHi! I’m Matthew, a statistics and data science major at Yale University. I’m passionate about helping students uncover the stories behind numbers and develop confidence in their own curiosity. Growing up, I didn’t have many mentors guiding me, so I learned how to navigate challenges by following my curiosity and building my own path. Because of that experience, I’m excited to help students discover that same sense of agency as they explore their interests and ideas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I’m deeply interested in understanding how data shapes the world around us. At Yale, I conducted research with a professor on jury bias in the criminal justice system, studying how patterns in data can reveal hidden biases in legal decision-making. I was also part of Yale’s Moot Court team—our constitutional law team—where I developed strong skills in public speaking, argumentation, and analytical thinking. In addition, I was involved in BlackGen, a student organization that prepares and supports students pursuing careers in finance. I also served as Solidarity Chair and Alumni Relations Chair for Yale’s Black Men’s Union, where I worked on alumni outreach and fundraising efforts. Beyond campus, I interned with the New Georgia Project, supporting civic engagement and voter outreach initiatives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEntrepreneurship has also been an important part of my journey. I served as Head of Business Development at a startup and later launched my own venture. These experiences taught me how to take an idea from concept to execution, and they continue to shape the way I approach problem-solving, creativity, and mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I’m a big fan of creative and technical hobbies. I love reading—especially science fiction, graphic novels, and comic books—and I’m a huge film enthusiast, particularly when it comes to sci-fi and fantasy movies. I also enjoy playing games, producing music, and building things, from assembling custom PCs to experimenting with 3D printing. When I’m looking to relax, you’ll often find me at a pool table working on my 8-ball game.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor with Curious Cardinals, my goal is to create a space where students feel comfortable experimenting, asking questions, and taking intellectual risks. Sessions with me are interactive and project-focused: together we might explore a new topic, break down a complex problem, or design a project that turns a student’s curiosity into something tangible. I especially enjoy working with curious students who have many interests but want help figuring out how to turn those interests into meaningful work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I believe every student has a unique way of seeing the world. With curiosity, persistence, and the right guidance, those perspectives can grow into ideas, projects, and achievements that make a real impact.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI hope students I work with leave our sessions with a completed project, a clearer sense of their interests, and the confidence to pursue ambitious ideas.\u003c/p\u003e","teachingVideoPlaybackId":"9uIQ89vDft6ffhwgHk0101g2Xe4UXWk8vSm2m9HF5m6MA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Statistics and Data science ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"14d54056-91ee-4d54-9e69-146311490d8c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/379e3436-088f-46c1-adf3-c3167f7569f9/-/preview/-/format/jpg/","https://ucarecdn.com/f00fb97d-8059-49c4-8b75-a434331d32ae/-/preview/-/format/jpg/","https://ucarecdn.com/18a9f02a-2cf6-4a9f-a469-a8bae70f75c3/-/preview/-/fo
