-4ec3-88c3-50067637f7fe\"}":{"__typename":"DeepDives","uuid":"7c7e5ad5-1153-4ec3-88c3-50067637f7fe","content":"\u003cp\u003eAprendalo.org: I created my own nonprofit in high school that teaches English across Latin America to low-income students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"2597d701-8e3b-456b-b6d8-6df48a8c16fe\"}":{"__typename":"DeepDives","uuid":"2597d701-8e3b-456b-b6d8-6df48a8c16fe","content":"\u003cp\u003eI am a proud Queer South Asian American. I try to bring a diverse, unique perspective to the table given my identity. I focus on power structures in my work/research at Stanford.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"2fbdd7c6-d924-44e9-9e78-5be39bad109f\"}":{"__typename":"School","uuid":"2fbdd7c6-d924-44e9-9e78-5be39bad109f","name":"Seton Hall Preparatory School","city":"West Orange","type":"HIGH","state":"New Jersey","country":"United States","zip":"07052"},"Education:{\"uuid\":\"5e07c68a-575b-4263-a1c2-e14bb257a5a2\"}":{"__typename":"Education","uuid":"5e07c68a-575b-4263-a1c2-e14bb257a5a2","school":{"__ref":"School:{\"uuid\":\"2fbdd7c6-d924-44e9-9e78-5be39bad109f\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a157a877-0263-444f-ba95-bb9dba0e139a\"}":{"__typename":"Education","uuid":"a157a877-0263-444f-ba95-bb9dba0e139a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2025","major":"Spanish, Education ","degree":"Undergrad BA"},"MentorPublicProfile:{\"uuid\":\"88511479-63a7-4a55-ad02-e8f72d257f41\"}":{"__typename":"MentorPublicProfile","uuid":"88511479-63a7-4a55-ad02-e8f72d257f41","displayName":"Ronak S.","slug":"ronak-shetty","biography":"\u003cp\u003eRonak Shetty is a graduate of Stanford University with a multidisciplinary background spanning Spanish and Portuguese language and culture, education, technology, business strategy, marketing, politics, and public service. His academic and professional journey reflects a commitment to bridging cultural understanding, promoting equitable education, and fostering innovation across multiple fields. At the core of Ronak’s work is his belief in the transformative power of language and education as tools for empowerment and societal change.\u003c/p\u003e\u003cp\u003eThrough his non-profit, \u003cstrong\u003eAprendalo.org\u003c/strong\u003e, Ronak has combined his linguistic expertise with his passion for education, developing programs that help students learn English as a second language while engaging with global cultures. His publications and podcasts further demonstrate a dedication to exploring complex social, political, and educational issues, with an emphasis on fostering optimism for structural change and highlighting opportunities for meaningful impact. These endeavors reflect not only his interest in world cultures and language learning but also a broader commitment to advocating for inclusive and forward-thinking educational practices.\u003c/p\u003e\u003cp\u003eRonak’s professional experience at \u003cstrong\u003eUC Berkeley Haas School of Business\u003c/strong\u003e underscores his passion for mentorship and teaching. There, he has guided students to question established norms, think critically, and develop innovative solutions to contemporary challenges. His approach emphasizes creativity, collaborative problem-solving, and the application of strategic thinking to real-world contexts, encouraging students to challenge the status quo while fostering practical, impactful results.\u003c/p\u003e\u003cp\u003eAt Stanford, Ronak continues to expand his impact through active engagement with several initiatives. With \u003cstrong\u003eAprendalo ESL\u003c/strong\u003e, he works directly with learners to enhance language acquisition while promoting cross-cultural understanding. His involvement with \u003cstrong\u003eHabla ESL\u003c/strong\u003e and \u003cstrong\u003eEl Centro\u003c/strong\u003e reflects a commitment to supporting diverse communities and fostering inclusive learning environments. Additionally, his participation in the \u003cstrong\u003eStanford Latin American Politics Club\u003c/strong\u003e allows him to integrate his interests in politics, culture, and public service, applying academic insights to contemporary issues in Latin America and beyond.\u003c/p\u003e\u003cp\u003eThrough these combined experiences, Ronak has developed a unique perspective that blends cultural literacy, educational innovation, and strategic thinking. His work consistently emphasizes empowerment, equity, and global awareness, reflecting a dedication to creating meaningful change in education, society, and the lives of the individuals he mentors. Whether through teaching, advocacy, or program development, Ronak continues to demonstrate a commitment to bridging cultures, expanding educational opportunities, and inspiring others to engage critically with the world around them.\u003c/p\u003e","teachingVideoPlaybackId":"A5OeBQeSSwPIOb00cbezu6b0001XwtdKq99URfsDhsOjOY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8671b326-d127-478e-a9d0-13161e211bad\"}"}],"major":"Spanish, Education ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"28286941-3430-
