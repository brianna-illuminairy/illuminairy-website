xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0ee3320e-903d-4a11-97cf-cadb7358c1c2\"}":{"__typename":"Favorites","uuid":"0ee3320e-903d-4a11-97cf-cadb7358c1c2","photoUrl":"https://ucarecdn.com/dc771124-db39-4eb1-8e8e-af53a68aed35/","title":"Adam Sandler ‼️","type":"ACTOR"},"Favorites:{\"uuid\":\"044fc528-bc71-4a4f-86ff-e4e94652abdc\"}":{"__typename":"Favorites","uuid":"044fc528-bc71-4a4f-86ff-e4e94652abdc","photoUrl":"https://ucarecdn.com/0ed98e0e-d9f7-44f1-8aab-f20dfcc49cd6/","title":"Stick Season 🎶 (Noah Kahan)","type":"ALBUM"},"Favorites:{\"uuid\":\"f85c67f9-c771-4a8d-bc55-266628c53a2e\"}":{"__typename":"Favorites","uuid":"f85c67f9-c771-4a8d-bc55-266628c53a2e","photoUrl":"https://ucarecdn.com/71ec2a4a-23dc-410e-924f-c467208cf51c/","title":"Roger Federer 🎾","type":"ATHLETE"},"CausesSupported:{\"uuid\":\"a4b9e7fb-9658-49e2-a737-590c78b08d88\"}":{"__typename":"CausesSupported","uuid":"a4b9e7fb-9658-49e2-a737-590c78b08d88","name":"Make-A-Wish Foundation","description":"\u003cp\u003eEveryone deserves the chance to have a dream come true! \u003c/p\u003e","photoUrl":"https://ucarecdn.com/7d382d9c-433b-4066-a011-854398185784/"},"CausesSupported:{\"uuid\":\"78d95c50-5168-4c45-8ff2-0dd7fff4f72f\"}":{"__typename":"CausesSupported","uuid":"78d95c50-5168-4c45-8ff2-0dd7fff4f72f","name":"Animal Rescue Mission, New Mexico","description":"\u003cp\u003eI love dogs, and I think they all deserve a home!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/24bb2e54-b75b-4b1b-9333-331e268ae3f8/"},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"2794b870-2a83-43be-a170-9f91642b010b\"}":{"__typename":"DeepDives","uuid":"2794b870-2a83-43be-a170-9f91642b010b","content":null,"videoPlaybackId":"nTFwB00vQh9PLHMuoRivNOdDhauu02JcGw00UgBZxSpWDk","question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a70fc731-580b-4c19-9571-69d740fe1f0b\"}":{"__typename":"DeepDives","uuid":"a70fc731-580b-4c19-9571-69d740fe1f0b","content":"\u003cp\u003eIt wasn’t until I was in Beijing, China, teaching at a summer camp for middle school students, that I realized just how central mentorship was to the work I wanted to do. As the only American college student—and the only English speaker—I taught classes each day with the help of a translator who relayed my words to the students. I quickly noticed that many of them approached learning with visible anxiety, as if every small mistake was a reflection of their worth. Every movement felt monitored, every setback treated as a failure. That’s no way to learn—\u003cstrong\u003e\u003cem\u003eand it’s certainly no way to live.\u003c/em\u003e\u003c/strong\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFrom that moment on, my goal for the rest of the camp was simple: \u003cstrong\u003e\u003cem\u003eto be a light in the room.\u003c/em\u003e\u003c/strong\u003e Too often, our youth are weighed down by negativity—whether from the constant pressure of social media or the fear-driven messaging they absorb from the world around them. But perfection is not the goal. They don’t need criticism or impossible expectations. They just need someone who believes in them, someone who will walk beside them when the path feels uncertain.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor my Curious Cardinals mentees, \u003cstrong\u003e\u003cem\u003eI hope to be that person. A hand to reach for. A reminder that they are more than enough.\u003c/em\u003e\u003c/strong\u003e And a light they can count on—no matter what room they walk into.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"fe41150e-dbef-4907-887d-5a56c4a29095\"}":{"__typename":"DeepDives","uuid":"fe41150e-dbef-4907-887d-5a56c4a29095","content":null,"videoPlaybackId":"02ymvSxnO2bGxFT9oAFPa6MWydvEU34xuetpX4AYshMQ","question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"92636715-5488-43d3-8e9d-3457902693b5\"}":{"__typename":"DeepDives","uuid":"92636715-5488-43d3-8e9d-3457902693b5","content":"\u003cp\u003eMy dream job is to become an international lawyer working for the U.S. Department of State. As someone who grew up in a military family, I’ve seen firsthand the cost of war—not just on service members like my father, but on entire families and communities. My father deployed twice during my childhood, and I remember the silence in our home during those months, the worry in my mother’s eyes, and the weight that conflict placed on all of us. I don’t want future families to live in that uncertainty.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat’s why I hope to work on international law and diplomacy—to be someone who can help prevent the very wars my father had to fight in. Whether it’s negotiating peaceful agreements, building global coalitions, or advocating for human rights, I want to use the law as a tool for peace. To me, it’s not just a career—it’s a calling to make the world safer, more stable, and more just.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"6b4435f9-a632-4f23-8f24-6d261a6fb34a\"}":{"__typename":"School","uuid":"6b4435f9-a632-4f23-8f24-6d261a6fb34a","name":"Estrella Foothills High School","city":"Goodyear","type":"HIGH","state":"Arizona","country":"United States","zip":"85338"},"Education:{\"uuid\":\"aa4eb08d-b2af-4cc2-a077-9fd32d7d5f47\"}":{"__typename":"Education","uuid":"aa4eb08d-b2af-4cc2-a077-9fd32d7d5f47","school":{"__ref":"School:{\"uuid\":\"6b4435f9-a632-4f23-8f24-6d261a6fb34a\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"a0184354-034f-44f9-a60a-f1f4445c03f1\"}":{"__typename":"Education","uuid":"a0184354-034f-44f9-a60a-f1f4445c03f1","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Ethics, Politics, \u0026 Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"b04a86a0-b831-40e4-aeb2-60d2f84c5c71\"}":{"__typename":"MentorPublicProfile","uuid":"b04a86a0-b831-40e4-aeb2-60d2f84c5c71","displayName":"Noah K.","slug":"noah-killeen-1","biography":"\u003cp\u003eHi! My name is Noah, and I’m a student at Yale University majoring in Ethics, Politics, and Economics. I’ve always believed that \u003cstrong\u003ementorship can be transformative\u003c/strong\u003e, which is why teaching and empowering younger students has become a defining part of my college experience. \u003cbr\u003e\u003cbr\u003eThe summer before I started college, I \u003cstrong\u003eworked as a private academic support tutor\u003c/strong\u003e. I helped high school students become proficient in subjects they found challenging and ensured they entered the fall semester feeling confident and prepared. That experience solidified my passion for personalized teaching and showed me how powerful one-on-one support can be.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eFrom the moment I arrived at Yale, I’ve prioritized opportunities to support others—whether through classroom instruction, mentorship programs, or admissions work. During my first year, \u003cstrong\u003eI traveled to Singapore, India, and China to teach international relations and public speaking\u003c/strong\u003e to middle and high school students. It was an unforgettable experience, and one that made me realize how much I enjoy \u003cem\u003eworking with students from diverse backgrounds and\u003c/em\u003e \u003cem\u003ehelping them build confidence in their voice and ideas\u003c/em\u003e.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn campus, I serve as a \u003cstrong\u003eRecruitment Coordinator for the Yale Office of Undergraduate Admissions\u003c/strong\u003e, where I help organize programs that introduce prospective students—particularly those from underrepresented communities—to life at Yale. In that role, I’ve had the privilege of mentoring hundreds of high school students as they navigate the complexities of the college application process. I’ve also led student panels, hosted events, and worked closely with admissions officers to ensure prospective students feel supported and seen. Beyond admissions, I’m the \u003cstrong\u003ePresident of the Yale Democracy Project and actively involved in consulting and pre-law organizations\u003c/strong\u003e, which have sharpened my communication, strategy, and research skills.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I’ve worked as a \u003cstrong\u003eLegislative Intern in the U.S. House of Representatives\u003c/strong\u003e, where I conducted policy research and helped craft memos on critical bills. I also served as a \u003cstrong\u003eStrategy Intern at the Pew Research Center\u003c/strong\u003e, focusing on expanding public engagement and media strategies for global research projects. After college, I’ll be joining \u003cstrong\u003ethe\u003c/strong\u003e \u003cstrong\u003eBoston Consulting Group (BCG) as an Associate\u003c/strong\u003e, where I hope to continue combining analytical thinking with mission-driven work.\u003c/p\u003e\u003cp\u003eWhen I’m not teaching or studying, you can usually find me working out, playing pickleball with friends, or off-roading and exploring new trails in Arizona—my home state. \u003cem\u003eI love staying active, traveling, and having late-night debates about philosophy, politics, and what makes a good life\u003c/em\u003e.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cem\u003eI’m so excited to meet you\u003c/em\u003e\u003c/strong\u003e and support you through your own academic and personal journey. Whether it’s high school essays, public speaking, or building confidence in class, I’m here to help however I can!\u003c/p\u003e","teachingVideoPlaybackId":"McQqjuQ00XLtwG7OuR01F1Sn5SdLVMtxybvkV5nluBQ1c","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of my proudest achievements was graduating as valedictorian of my high school and receiving the most Ivy League acceptances in my school’s history—despite the fact that we hadn’t sent a single student to an Ivy League institution in over five years. Coming from a household without access to these kinds of educational opportunities, it was an incredible honor to become the first in my family to break that barrier. That moment wasn’t just about where I was going—it was about proving what was possible for others like me.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0ee3320e-903d-4a11-97cf-cadb7358c1c2\"}"},{"__ref":"Favorites:{\"uuid\":\"044fc528-bc71-4a4f-86ff-e4e94652abdc\"}"},{"__ref":"Favorites:{\"uuid\":\"f85c67f9-c771-4a8d-bc55-2666
