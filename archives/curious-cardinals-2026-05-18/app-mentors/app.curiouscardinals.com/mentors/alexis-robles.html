xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"571b5178-9458-4614-b7c1-2e4edce2f8cb\"}":{"__typename":"DeepDives","uuid":"571b5178-9458-4614-b7c1-2e4edce2f8cb","content":"\u003cp\u003eTo my younger self, I'd say embrace every opportunity with an open heart and mind. Don't shy away from challenges, especially those that seem intimidating. It's okay to stumble on exams or not ace every test; what's truly valuable is the learning journey. Embrace your curiosity, try different things, and find your passion. Remember, the path to discovering what you love is often paved with trials and errors. So, dive into experiences, learn from them, and keep growing!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"8c4bee7c-ef42-44db-97da-5f4f04e2a74b\"}":{"__typename":"DeepDives","uuid":"8c4bee7c-ef42-44db-97da-5f4f04e2a74b","content":"\u003cp\u003eOne of my lifelong aspirations is to start a company that addresses a significant health issue. I envision creating a venture that combines my technical acumen with a desire to make a tangible, positive impact on people's lives. By leveraging technology and innovative approaches, I aim to tackle health challenges and contribute to a healthier, happier society.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"a358d953-f26e-4e7b-8cdc-470b97bc6d17\"}":{"__typename":"DeepDives","uuid":"a358d953-f26e-4e7b-8cdc-470b97bc6d17","content":"\u003cp\u003eI'm deeply passionate about technology's potential to solve real-world problems. A project close to my heart is 'hostU', a platform I co-founded and lead, and more recently, 'Billed.' Billed is an innovative mobile app I'm currently developing to simplify bill splitting in restaurants. It's designed to be user-friendly, allowing diners to effortlessly calculate bills, taxes, and tips, and integrate with payment services like Venmo. Leading a diverse team of developers, designers, and strategists, we're working to make dining experiences smoother and more enjoyable.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"8731f478-93b6-4cb5-9e04-474bd762cd9b\"}":{"__typename":"DeepDives","uuid":"8731f478-93b6-4cb5-9e04-474bd762cd9b","content":"\u003cp\u003eDuring my high school summers, I found a balance between sports and academic enrichment. In the wake of COVID-19, I played soccer every morning, staying active and connected with my passion for sports. In the following summers, I attended CTY (Johns Hopkins Center for Talented Youth), where I delved into physics and computer science. These experiences not only enhanced my academic skills but also helped me grow personally, exploring areas that later shaped my career interests.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"ae70f450-1207-4e53-9800-c916be0455e6\"}":{"__typename":"School","uuid":"ae70f450-1207-4e53-9800-c916be0455e6","name":"Lynnfield High School","city":"Lynnfield","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01940"},"Education:{\"uuid\":\"9e55a090-3b92-4e61-8040-0f15832f7615\"}":{"__typename":"Education","uuid":"9e55a090-3b92-4e61-8040-0f15832f7615","school":{"__ref":"School:{\"uuid\":\"ae70f450-1207-4e53-9800-c916be0455e6\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"02b71a11-b862-4e4c-95e4-34a6fb60a1e7\"}":{"__typename":"Education","uuid":"02b71a11-b862-4e4c-95e4-34a6fb60a1e7","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"4db1f698-cb85-4e14-ae78-2a963f6f6d19\"}":{"__typename":"MentorPublicProfile","uuid":"4db1f698-cb85-4e14-ae78-2a963f6f6d19","displayName":"Alexis R.","slug":"alexis-robles","biography":"\u003cp\u003eHello! I'm Alexis Robles, a passionate mentor currently pursuing a Computer Science Bachelor's degree and a combined Applied Math Master's at Northwestern University, and I'm thrilled to be a part of the Curious Cardinals team. My journey in learning and teaching is driven by a deep belief in the transformative power of education and a commitment to making a positive impact in the lives of young learners.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt the heart of my academic pursuits is a love for computer science, where I've honed my skills in problem-solving and logical thinking. But my interests don't stop at the technical; I am equally passionate about understanding the broader implications of technology in our daily lives and how it shapes the future. This balance of technical know-how and thoughtful reflection is what I bring to my mentoring sessions.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond the classroom, my world is filled with diverse experiences and hobbies. I've co-founded a platform named hostU during my time at Northwestern, an experience that taught me the value of teamwork, creativity, and resilience. Additionally, I'm actively involved in Kappa Theta Pi, a professional technology fraternity, where I lead tech workshops and mentor peers, helping them navigate the complex landscape of technology careers.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy journey has also been deeply influenced by my Mexican heritage and the values instilled in me by my family. These experiences have taught me the importance of community, empathy, and hard work—values I strive to pass on to my mentees.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I'm not delving into the world of technology, you'll find me exploring my artistic side through music. I'm an avid drummer and enjoy various music styles, from jazz to contemporary R\u0026amp;B. This creative outlet has been a wonderful way to express myself and connect with others on a different level.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs your mentor, I'm here to support and guide you, whether it's tackling challenging academic concepts, exploring new areas of interest, or just figuring out the right path for you. I believe in a personalized approach to learning, where each session is tailored to your unique needs and goals.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI look forward to the opportunity to be a part of your learning journey, sharing my knowledge, experiences, and, most importantly, learning from you too. Together, let's make this an enriching and enjoyable experience!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"571b5178-9458-4614-b7c1-2e4edce2f8cb\"}"},{"__ref":"DeepDives:{\"uuid\":\"8c4bee7c-ef42-44db-97da-5f4f04e2a74b\"}"},{"__ref":"DeepDives:{\"uuid\":\"a358d953-f26e-4e7b-8cdc-470b97bc6d17\"}"},{"__ref":"DeepDives:{\"uuid\":\"8731f478-93b6-4cb5-9e04-474bd762cd9b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/1ad83b1f-9081-40a5-a154-3d3b7655c6f2/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"9e55a090-3b92-4e61-8040-0f15832f7615\"}"},{"__ref":"Education:{\"uuid\":\"02b71a11-b862-4e4c-95e4-34a6fb60a1e7\"}"}],"hiredAt":"2024-01-17T15:13:08.531Z","topics":["Coding / Programming","Machine Learning / AI","Web Design","Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexis-robles\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4db1f698-cb85-4e14-ae78-2a963f6f6d19\"}"}}},"_sentryTraceData":"64cb9a2da47e4692aceb9d191aacd1af-8d2a4bb36021eee4-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=64cb9a2da47e4692aceb9d191aacd1af,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug
