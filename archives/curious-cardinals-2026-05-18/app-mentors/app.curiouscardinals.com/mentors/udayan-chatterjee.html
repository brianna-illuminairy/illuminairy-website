xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"36a28eac-b9dc-4a6f-bf84-8e1a287e82ff\"}":{"__typename":"DeepDives","uuid":"36a28eac-b9dc-4a6f-bf84-8e1a287e82ff","content":"\u003cp\u003eI chose Mechanical Engineering because I have always been fascinated by how things work in the real world. Even before college, I enjoyed taking things apart, understanding the mechanism behind them, and imagining how they could be improved. Mechanical Engineering felt like the perfect foundation for someone who loves building, experimenting, and solving problems with a hands-on approach.\u003c/p\u003e\u003cp\u003eWhat I also liked was that Mechanical Engineering is incredibly broad. It touches physics, design, materials, manufacturing, thermodynamics, robotics, and even basic principles that show up in  product design. I knew that choosing this major would give me the freedom to explore many directions, rather than limiting me to a narrow path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"23bc1a7f-3b53-4927-9fe6-1e32e0a9e199\"}":{"__typename":"DeepDives","uuid":"23bc1a7f-3b53-4927-9fe6-1e32e0a9e199","content":"\u003cp\u003eIn my spare time, I like working on side projects that let me explore new ideas or technologies. I enjoy building things just for fun, whether it is experimenting with AI models, trying out a new coding framework, or sketching out product ideas that I might develop someday. Creating things relaxes me and keeps my curiosity alive.\u003c/p\u003e\u003cp\u003eI also enjoy reading, especially books that help me understand people better. As a Analyst and someone who loves solving problems, I find it interesting to learn how people think, make decisions, and react to the world around them. It helps me in my work, but I genuinely enjoy it on a personal level as well.\u003c/p\u003e\u003cp\u003eAnother big part of my free time goes into learning something new. It could be watching tutorials, taking online courses, exploring mechanical design concepts, or diving into case studies. I like the feeling of becoming a little better every day.\u003c/p\u003e\u003cp\u003eWhen I want to unwind, I listen to music, go for long walks, or catch up with friends. I prefer meaningful conversations over anything else, and these moments help me recharge.\u003c/p\u003e\u003cp\u003eOverall, my free time is a mix of building, learning, and relaxing. I like staying curious, working on things that excite me, and staying connected to people who matter to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"34ea862e-dbd3-4fff-89a4-470d2a0e08b6\"}":{"__typename":"DeepDives","uuid":"34ea862e-dbd3-4fff-89a4-470d2a0e08b6","content":"\u003cp\u003eOne of the passion projects I’m most proud of is an attentiveness device I built for teen drivers. The idea came from noticing how easily young drivers can get distracted, especially during long or stressful drives. I wanted to create something that could keep them safe in real time and also help them understand their driving habits afterward.\u003c/p\u003e\u003cp\u003eI built a system that used sensors like accelerometers, gyroscopes, and cameras to track things such as sudden braking, sharp turns, head movements, and signs of distraction. If the device detected risky behavior, it gave haptic or audio feedback to bring the driver’s focus back to the road. In extreme cases, it could also alert parents or emergency services. I designed the system to not only prevent accidents, but also teach better habits through post-drive reports.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"0e8545fe-75cd-4eb5-ac71-1165961ec58f\"}":{"__typename":"School","uuid":"0e8545fe-75cd-4eb5-ac71-1165961ec58f","name":"Auxilium Convent School","city":"Kolkata","type":"HIGH","state":"West Bengal","country":"India","zip":"700028"},"Education:{\"uuid\":\"c969abd5-efae-4079-a634-2a06c8c3bf6c\"}":{"__typename":"Education","uuid":"c969abd5-efae-4079-a634-2a06c8c3bf6c","school":{"__ref":"School:{\"uuid\":\"0e8545fe-75cd-4eb5-ac71-1165961ec58f\"}"},"startYear":"2007","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"7c59cab7-9902-496f-b774-a537d308e580\"}":{"__typename":"School","uuid":"7c59cab7-9902-496f-b774-a537d308e580","name":"Indian Institute of Technology (Indian School of Mines), Dhanbad","city":"Kalyanpur","type":"COLLEGE","state":"Jharkhand","country":"India","zip":"826007"},"Education:{\"uuid\":\"1ff2afc1-0d09-44ad-be7e-44153541368e\"}":{"__typename":"Education","uuid":"1ff2afc1-0d09-44ad-be7e-44153541368e","school":{"__ref":"School:{\"uuid\":\"7c59cab7-9902-496f-b774-a537d308e580\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"2f26a3ec-0027-41cc-b2d9-ec1857625c18\"}":{"__typename":"MentorPublicProfile","uuid":"2f26a3ec-0027-41cc-b2d9-ec1857625c18","displayName":"Udayan C.","slug":"udayan-chatterjee","biography":"\u003cp\u003eHi! I’m Udayan, and I’m someone who genuinely loves building things. That includes ideas, projects, products, and confidence in the people I work with. I studied Mechanical Engineering at IIT (ISM) Dhanbad, although my interests have always gone far beyond what is taught in the classroom. I have a strong curiosity about how things work, and an even stronger curiosity about how to make them work better for people.\u003c/p\u003e\u003cp\u003eThat curiosity has shaped nearly everything I do. Over the past few years, I have worked on a wide range of projects in areas like AI, health technology, education, cybersecurity, and safety systems. Some of the projects that mean the most to me include creating an attentiveness device to help teen drivers stay safe, designing a self-cleaning toilet seat for airports, building a memory dump based malware detection system using deep learning, and developing a complete online code editor using React and Node. I enjoy working at the intersection of engineering and impact, where technology can genuinely solve meaningful problems.\u003c/p\u003e\u003cp\u003eProfessionally, I work as a product manager. This means I spend my time understanding people, identifying real problems, and turning ideas into practical solutions that improve users’ lives. I love this role because it gives me the chance to blend empathy, creativity, leadership, and structured problem-solving. These skills are things I have developed over the years through research, teamwork, and many hackathons.\u003c/p\u003e\u003cp\u003eMentorship has always been a constant part of my journey. I have guided juniors in coding, helped classmates with mechanical design concepts, and supported teammates in breaking down complicated challenges. I try to teach in a way that removes fear and replaces it with curiosity. I know what it feels like to be confused and overwhelmed, and I also know how satisfying it is when something finally makes sense. Because of that, I try to bring patience, clarity, and encouragement into every conversation.\u003c/p\u003e\u003cp\u003eI care deeply about making learning feel empowering. I want students to feel confident enough to ask questions, experiment, fail safely, and keep exploring. I enjoy showing how concepts connect to real things in the world, such as how a camera recognizes a face, how sensors measure motion, or how apps understand what you need. Students today have incredible imagination, and I love being the person who helps them use it.\u003c/p\u003e\u003cp\u003eOutside of academics, I am almost always working on something new. I spend my time building ideas, participating in hackathons, or developing myself. I enjoy solving problems that matter, collaborating with people from many backgrounds, and thinking about how technology can improve everyday life.\u003c/p\u003e","teachingVideoPlaybackId":"3ujD01JFTF7xDu02orn72nRHap2dflHpQJwfDT6wxJrB4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething I am truly proud of is a CPR-training device I designed as part of a challenge where my team ended up being the Runner-Up at the Amdocs Talent Tank competition. It was one of those projects where the impact felt real from the very beginning, because we were building something that could actually help save lives.\u003c/p\u003e\u003cp\u003eThe idea was simple but powerful. Most people know CPR only in theory, and even when they practice, they have no clear feedback on whether they are applying the right pressure, maintaining the correct rhythm, or responding quickly enough. We wanted to solve that by creating a device that could train someone to deliver near-perfect CPR through real-time feedback.\u003c/p\u003e\u003cp\u003eWe built a compact prototype that used pressure sensors and motion data to measure compression depth, frequency, and technique. Whenever the user deviated from the ideal range, the device provided instant alerts. Over time, it helped people learn the correct muscle memory, because it turned CPR practice into something measurable and trackable.\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"36a28eac-b9dc-4a6f-bf84-8e1a287e82ff\"}"},{"__ref":"DeepDives:{\"uuid\":\"23bc1a7f-3b53-4927-9fe6-1e32e0a9e199\"}"},{"__ref":"DeepDives:{\"uuid\":\"34ea862e-dbd3-4fff-89a4-470d2a0e08b6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d7ffeb4e-226a-45ba-b3b5-31c40a520630/-/preview/-/format/jpg/","https://ucarecdn.com/018bad1c-4062-45bd-b5f9-42a22fafd42e/-/preview/-/format/jpg/","https://ucarecdn.com/962d478a-a058-4456-85a0-c176962015d8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c969abd5-efae-4079-a634-2a06c8c3bf6c\"}"},{"__ref":"Education:{\"uuid\":\"1ff2afc1-0d09-44ad-be7e-44153541368e\"}"}],"hiredAt":"2025-11-06T16:14:21.982Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Computer Science","Coding / Programming","Sports Analytics","Robotics / Electronics / CAD","STEM Project","Machine Learning / AI","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"udayan-chatterjee\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2f26a3ec-0027-41cc-b2d9-ec1857625c18\"}"}}},"_sentryTraceData":"ef15745f7e2b4a9ea8818fa55dad35ec-8f773fc3aefcdfb7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ef15745f7e2b4a9ea8818fa55dad35ec,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"pag
