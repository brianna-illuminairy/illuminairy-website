oes mentorship matter to you?"},"DeepDives:{\"uuid\":\"2c33da77-01a4-44c2-b41e-2421d17bdc66\"}":{"__typename":"DeepDives","uuid":"2c33da77-01a4-44c2-b41e-2421d17bdc66","content":"\u003cp\u003eMentorship matters to me because so many people in my life have helped me get to where I am now, and it feels right to pay that forward to others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"ffc6e569-f1a6-4906-8c21-f512dbd9985d\"}":{"__typename":"School","uuid":"ffc6e569-f1a6-4906-8c21-f512dbd9985d","name":"Lakeside High School","city":"Atlanta","type":"HIGH","state":"Georgia","country":"United States","zip":"30345"},"Education:{\"uuid\":\"070c7bdf-64a5-4ed8-94c9-718e21f83dd9\"}":{"__typename":"Education","uuid":"070c7bdf-64a5-4ed8-94c9-718e21f83dd9","school":{"__ref":"School:{\"uuid\":\"ffc6e569-f1a6-4906-8c21-f512dbd9985d\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"a1c9eefd-ba11-4668-ad09-051c33d4f274\"}":{"__typename":"Education","uuid":"a1c9eefd-ba11-4668-ad09-051c33d4f274","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"41796916-7f75-45fe-8e74-fd32fd901e91\"}":{"__typename":"MentorPublicProfile","uuid":"41796916-7f75-45fe-8e74-fd32fd901e91","displayName":"Kaylee C.","slug":"kaylee-cornelius","biography":"\u003cp\u003eHi! My name is Kaylee Cornelius, and I am a recent Harvard grad who is now living in D.C. I have LOVED math and science since elementary school which is why I ended up studying electrical engineering in college. Since high school, I have been very involved with organizations that support minorities in STEM, like the National Society of Black Engineers. During the summer before my junior year of high school, I interned at the Georgia Tech Research Institute where she worked with a team of 5 other aspiring engineers to create a Heat Exhaustion Monitoring System embedded into a hard hat. I have worked on a ton of personal projects (everything from robotics to circuit design) throughout the years, so I have the most experience in science subjects and computer science. For my senior thesis, I worked with other students on a project supporting the Jet Propulsion Laboratory’s manufacturing of Europa Clipper, a spacecraft intent on studying the inner structure of Europa for signs of life. One of Europa Clipper’s primary instruments, REASON or (Radar for Europa Assessment and Sounding: Ocean to Near-surface), requires calibration while en route to Jupiter, so I helped design the power system that will allow a CubeSat to calibrate REASON during flight. I would not have been able to complete any projects without lots of help from teachers and mentors along the way, so I am very excited to be a mentor for Curious Cardinals so that I can help others learn, grow, and innovate too. I am extremely passionate about climate issues and the renewable energy sector (i.e. how we will get to net zero) is what interests me the most at this moment, but I also love coding for personal projects during my free time. For fun, I enjoy reading 📚 and playing golf 🏌🏾‍♀️!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"edeef5b3-ca09-446f-b17b-ddecfe116d6d\"}"},{"__ref":"Favorites:{\"uuid\":\"22cc29a7-2a1a-48d0-996a-e320038f1961\"}"},{"__ref":"Favorites:{\"uuid\":\"454866f6-23d4-4bf5-8c6b-3e9659cfaec9\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"
