xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"23d6c1fa-f9e1-4f79-8b75-ca1af55aa59e\"}":{"__typename":"Favorites","uuid":"23d6c1fa-f9e1-4f79-8b75-ca1af55aa59e","photoUrl":"https://ucarecdn.com/5526bea9-b934-43bf-a044-8f712a841c1a/","title":"Stephen Curry","type":"ATHLETE"},"Favorites:{\"uuid\":\"01ff4221-ccd8-49d0-b4c5-dca0fd43de23\"}":{"__typename":"Favorites","uuid":"01ff4221-ccd8-49d0-b4c5-dca0fd43de23","photoUrl":"https://ucarecdn.com/5526bea9-b934-43bf-a044-8f712a841c1a/","title":"Outliers: The Story of Success","type":"BOOK"},"Favorites:{\"uuid\":\"2ac026c5-e076-4ee7-a8d7-4256c102926c\"}":{"__typename":"Favorites","uuid":"2ac026c5-e076-4ee7-a8d7-4256c102926c","photoUrl":"https://ucarecdn.com/5526bea9-b934-43bf-a044-8f712a841c1a/","title":"The Shawshank Redemption","type":"MOVIE"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"1c50de5b-d4e7-4827-a58a-d681fbc8a446\"}":{"__typename":"DeepDives","uuid":"1c50de5b-d4e7-4827-a58a-d681fbc8a446","content":"\u003cp\u003eA significant achievement that I hope to accomplish is somehow retiring my parents so that they don't need to work anymore. My parents are a huge part of my life and a significant inspiration to me. They have worked incredibly hard ever since I can remember and deserve a break. Hopefully, one day I will have the means to allow them not to work anymore and regain the freedom to relax as well.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9157de1a-8cd1-4341-b67a-ace924ad0095\"}":{"__typename":"DeepDives","uuid":"9157de1a-8cd1-4341-b67a-ace924ad0095","content":"\u003cp\u003eAn idea I have for a passion project, and I'm continuing to work on its implementation as I develop it further, is a mobile app that functions as a tracker of places you've traveled to. I got this idea while traveling to and from the different colleges that I attend. The concept is that all these trips, whether by plane, train, or car, will be represented as lines on a global map. Each trip is depicted by a line, and the app will show the amalgamation of all the different journeys you've taken ever since you started logging them into the app.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7d566999-8f2e-423e-8a84-5f0d852802d5\"}":{"__typename":"DeepDives","uuid":"7d566999-8f2e-423e-8a84-5f0d852802d5","content":"\u003cp\u003eIn the summer while I was in high school, I spent a lot of time outside playing basketball with my friends. We could be at the park on the court for hours until the sun set, playing long games of 3v3 or 4v4 that went up to 50 points! We were all just happy to be playing a fun sport with each other and making memories that we would remember for the rest of our lives. Afterward, we would go to a fast-food restaurant like Portillo's or Chick-Fil-A to get some much-needed food after our long sessions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"17f3afea-c712-4bbe-863d-fecb250dd632\"}":{"__typename":"DeepDives","uuid":"17f3afea-c712-4bbe-863d-fecb250dd632","content":"\u003cp\u003eMentorship matters to me because I believe one of the best ways to utilize the experience I've gained is by sharing it with others who have not gone through it. Engaging in mentorship allows me to share my knowledge and experiences with others, providing guidance and support to individuals navigating similar paths. Through mentorship, I find fulfillment in making a positive impact on someone's life, contributing to their professional and personal development, and building meaningful connections within my community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"4bc6f86f-a761-4cd1-b2c9-fb7e4b53f403\"}":{"__typename":"Education","uuid":"4bc6f86f-a761-4cd1-b2c9-fb7e4b53f403","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Electrical Engineering","degree":null},"School:{\"uuid\":\"19a0ecba-b106-438c-a2af-19e98808e4c2\"}":{"__typename":"School","uuid":"19a0ecba-b106-438c-a2af-19e98808e4c2","name":"Vernon Hills High School","city":"Vernon Hills","type":"HIGH","state":"IL","country":"USA","zip":"60061"},"Education:{\"uuid\":\"4577a690-5a93-49ea-a673-9555a83171cc\"}":{"__typename":"Education","uuid":"4577a690-5a93-49ea-a673-9555a83171cc","school":{"__ref":"School:{\"uuid\":\"19a0ecba-b106-438c-a2af-19e98808e4c2\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"2f449e4b-6b76-4268-8b6a-854623ff3aa7\"}":{"__typename":"MentorPublicProfile","uuid":"2f449e4b-6b76-4268-8b6a-854623ff3aa7","displayName":"Brandon C.","slug":"brandon-carido","biography":"\u003cp\u003eHello and welcome! Thank you for stopping by :)\u003cbr\u003e\u003cbr\u003eMy name is Brandon Carido, and I am currently enrolled in the Dartmouth Dual-Degree Engineering Program, which means I attend two different colleges: Dartmouth College and Vassar College. At Vassar, I am studying Computer Science, and at Dartmouth, I am studying Electrical Engineering.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am passionate about Electronics and Embedded Systems, specifically the intersection where software and hardware work in harmony to push all of the different electronics we use to actually work for us like magic.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, I love playing basketball, as well as watching professional teams play in the NBA. I also enjoy playing music, whether it be on the piano or on my drum set.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you ever want advice on what it's like going to two different schools or you want perspective on what it's like attending a small liberal arts school compared to a medium-sized school, I am happy to answer any of those questions as well!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am thankful for the opportunity to work with you, and I can't wait to inspire you to learn even more about the world!\u003c/p\u003e","teachingVideoPlaybackId":"01fZHOIJuITiwEM0201Iazv73jIqVGctON96OtRJOLUtJ8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"23d6c1fa-f9e1-4f79-8b75-ca1af55aa59e\"}"},{"__ref":"Favorites:{\"uuid\":\"01ff4221-ccd8-49d0-b4c5-dca0fd43de23\"}"},{"__ref":"Favorites:{\"uuid\":\"2ac026c5-e076-4ee
