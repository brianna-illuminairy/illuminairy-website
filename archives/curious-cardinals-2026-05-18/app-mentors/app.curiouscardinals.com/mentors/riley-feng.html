xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8099c30a-6362-4e26-ab4e-0ca9d1731176\"}":{"__typename":"Favorites","uuid":"8099c30a-6362-4e26-ab4e-0ca9d1731176","photoUrl":"https://ucarecdn.com/a3db77bc-9e1f-47df-bcc2-2b947d2be44d/","title":"La La Land","type":"MOVIE"},"Favorites:{\"uuid\":\"c519de9f-6a93-4de0-9366-61e660a0662e\"}":{"__typename":"Favorites","uuid":"c519de9f-6a93-4de0-9366-61e660a0662e","photoUrl":"https://ucarecdn.com/a3db77bc-9e1f-47df-bcc2-2b947d2be44d/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"e05d351a-d863-4575-8adf-79ea9b1ffd6d\"}":{"__typename":"Favorites","uuid":"e05d351a-d863-4575-8adf-79ea9b1ffd6d","photoUrl":"https://ucarecdn.com/a3db77bc-9e1f-47df-bcc2-2b947d2be44d/","title":"Gymnastics","type":"SPORT"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"395d9dee-8134-421a-830b-b4d4610a9269\"}":{"__typename":"DeepDives","uuid":"395d9dee-8134-421a-830b-b4d4610a9269","content":"\u003cp\u003eI always knew that I wanted my major to be interdisciplinary because going into college and until this day, there are so many subjects I'm interested in. I found that Management Science \u0026amp; Engineering came pretty intuitively to me because it was a good blend of math and technical classes, while also teaching me softer skills like how to navigate conflict and tough decisions in the workplace. Mostly, I liked that it was technical with an emphasis on business, since I always had a feel I'd want to do something business or finance related after college. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"0c7d9f36-c1b2-4cde-babe-1959b38478df\"}":{"__typename":"DeepDives","uuid":"0c7d9f36-c1b2-4cde-babe-1959b38478df","content":"\u003cp\u003ePilates, hiking, getting in the sun, surfing (under 4ft waves only...the ocean is scary), baking, hanging out with my friends, reading the news, thinking about new business ideas, planning outfits and trying new makeup looks, yoga, trying new restaurants, photography on my film cameras, reading, watching rom-coms, and journaling. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"d927a2c3-89a3-4d19-bd67-4c08c1b7f1bc\"}":{"__typename":"DeepDives","uuid":"d927a2c3-89a3-4d19-bd67-4c08c1b7f1bc","content":"\u003cp\u003eWhen I took my gap year after high school, I wanted to have a place to document all of my experiences and learning, so I started an online blog. I wrote about the trips I took, my personal goals, how I was preparing for college, etc. Eventually, when I got to college I continued writing for the blog and wrote about my adjustment to being a Stanford student. My blog gained a lot of traction, mostly amongst people in my circles but also strangers from around the world were reading it too! I don't have my blog anymore, but I'd absolutely start a different one in the future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7cfa58da-0460-442c-bf03-496f39c471e5\"}":{"__typename":"Education","uuid":"7cfa58da-0460-442c-bf03-496f39c471e5","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Management Science \u0026 Engineering","degree":"B.S."},"School:{\"uuid\":\"173329c9-bbda-4a0b-8234-7d8fec3d841a\"}":{"__typename":"School","uuid":"173329c9-bbda-4a0b-8234-7d8fec3d841a","name":"Brookfield Central High School","city":"Brookfield","type":"HIGH","state":"Wisconsin","country":"United States","zip":"53005"},"Education:{\"uuid\":\"ff4f0519-1fba-432a-8ad8-585a648d4f90\"}":{"__typename":"Education","uuid":"ff4f0519-1fba-432a-8ad8-585a648d4f90","school":{"__ref":"School:{\"uuid\":\"173329c9-bbda-4a0b-8234-7d8fec3d841a\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"3e868adc-862c-4a6a-ae07-3a1fe3a4eeec\"}":{"__typename":"MentorPublicProfile","uuid":"3e868adc-862c-4a6a-ae07-3a1fe3a4eeec","displayName":"Riley F.","slug":"riley-feng","biography":"\u003cp\u003eRiley is current a junior majoring in Management Science \u0026amp; Engineering at Stanford University with a concentration in Finance \u0026amp; Decision. She is also planning to minor in psychology. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eRiley grew up in the suburbs of Milwaukee, Wisconsin. Riley is passionate about working with kids: in high school she tutored math and english to middle schoolers, babysat kids from 3 months old to 14 years old, and helped coordinate a Dance Marathon for the Children's Miracle Network in her hometown, raising over $9000. Outside of the Dance Marathon, she served as president of her high school's Key Club and spent her senior year traveling around the country helping to expand local Key Club's outreach as a Key Club International Trustee. Riley is also passionate about uplifting young women, as the the Distinguished Young Woman of Wisconsin in 2020, she spent a year helping elementary and middle school girls each \"be your best self.\" \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, Riley is still involved in Philanthropy as she served as her sorority's head of fundraising last year. She is also a Project Director for Stanford Consulting, where she is currently leading a team of consultants to help a AI-driven data analytics company gain new clients in private equity and venture capital. As a project director, she has become stellar at breaking down large tasks into manageable steps for her team and brings this same structured approach to her Curious Cardinal mentees. Outside of academia, Riley has interned at a health and wellness startup, private equity firm and will work in growth equity in the summer of 2024. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn her free time, Riley loves to hike the Stanford dish, attend reformer pilates classes, bake and try new sweet treats, play around on the piano, and read the Wall Street Journal. \u003c/p\u003e","teachingVideoPlaybackId":"91mMSULRRnrOjIVFYmHOXX00OT02Yck02P9KS1bkbXvn1s","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"8099c30a-6362-4e26-ab4e-0ca9d1731176\"}"},{"__ref":"Favorites:{\"uuid\":\"c519de9f-6a93-4de0-9366-61e660a0662e\"}"},{"__ref":"Favorites:{\"uuid\":\"e05d351a-d863-4575-8adf-79ea9b1ffd6d\"}"}],"causesSupported":[],"major":"Management Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"395d9dee-8134-421a-830b-b4d4610a9269\"}"},{"__ref":"DeepDives:{\"uuid\":\"0c7d9f36-c1b2-4cde-babe-1959b38478df\"}"},{"__ref":"DeepDives:{\"uuid\":\"d927a2c3-89a3-4d19-bd67-4c08c1b7f1bc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/51b69ec5-ec1e-45b7-90bd-86962b6a8e60/
