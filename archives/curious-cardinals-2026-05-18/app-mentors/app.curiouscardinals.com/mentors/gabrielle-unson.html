xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"62e2ef8c-fd5d-43c5-bcaf-33e16f247849\"}":{"__typename":"Favorites","uuid":"62e2ef8c-fd5d-43c5-bcaf-33e16f247849","photoUrl":"https://ucarecdn.com/148e6d95-fe2c-4046-9416-13d8c26ff588/","title":"Omar Apollo","type":"ARTIST"},"Favorites:{\"uuid\":\"974eba25-0de8-4e76-9958-9214563870ce\"}":{"__typename":"Favorites","uuid":"974eba25-0de8-4e76-9958-9214563870ce","photoUrl":"https://ucarecdn.com/a2b79127-e615-4a67-ac8d-ef6fd4d0973c/","title":"Sunisa Lee","type":"ATHLETE"},"Favorites:{\"uuid\":\"c66c0f0b-89e8-4fef-b0e9-a89198da0b22\"}":{"__typename":"Favorites","uuid":"c66c0f0b-89e8-4fef-b0e9-a89198da0b22","photoUrl":"https://ucarecdn.com/88c6afa7-0228-416b-8579-1df5c8d9cf89/","title":"NYT Crossword","type":"GAME"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"37057500-bc77-4c1e-84e0-04d1cbc835cb\"}":{"__typename":"DeepDives","uuid":"37057500-bc77-4c1e-84e0-04d1cbc835cb","content":"\u003cp\u003eI'm a double major in Neuroscience \u0026amp; Social Policy with a minor in Business.  I've always been very curious and I realized that I didn't have to limit exploring my different interests academically.  While juggling my different studies can be difficult, I want to emphasize that you shouldn't feel contained to a specific area or niche!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"1cf5b255-8814-4361-9a72-042a6a3a787b\"}":{"__typename":"DeepDives","uuid":"1cf5b255-8814-4361-9a72-042a6a3a787b","content":"\u003cp\u003eI played a water sport but can't swim! Literally a sink or swim situation, I have always loved challenging myself and refusing to be held back by perceived limitations.  Rowing has been one of the most impactful activities of my life- and it takes courage to do something scary!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"1e40168e-9f2a-4b4b-a112-e99a93aaab3c\"}":{"__typename":"DeepDives","uuid":"1e40168e-9f2a-4b4b-a112-e99a93aaab3c","content":"\u003cp\u003eComing into high school, I was a very shy, soft-spoken student.  With ADHD, I really struggled learning how to adjust my learning practices to make them work \u003cem\u003efor me\u003c/em\u003e, especially in STEM courses.  I'm really passionate about mapping how to adjust our environment and habits to maximize learning and disproving that natural ability in a course subject does not equate the ability to excel!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"cee2fc9e-d4a0-478a-a765-a9a733f2c495\"}":{"__typename":"DeepDives","uuid":"cee2fc9e-d4a0-478a-a765-a9a733f2c495","content":"\u003cp\u003eMentorship matters to me because I believe it's essential towards creating innovators.  Throughout my academic and professional experience, I've sought mentorship and found that my mentors have equipped me with invaluable insights and practices I've utilized throughout all areas of my life, both personally and professionally.  I hope to do the same for my mentees!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"7733a6b8-8792-49de-9d04-33393cc9109c\"}":{"__typename":"School","uuid":"7733a6b8-8792-49de-9d04-33393cc9109c","name":"Syosset High School","city":"Syosset","type":"HIGH","state":"New York","country":"United States","zip":"11791"},"Education:{\"uuid\":\"fa99d260-5aa4-4f38-9b75-9dc112771981\"}":{"__typename":"Education","uuid":"fa99d260-5aa4-4f38-9b75-9dc112771981","school":{"__ref":"School:{\"uuid\":\"7733a6b8-8792-49de-9d04-33393cc9109c\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"3a56d5c6-5c63-420f-8180-1cd62ab9d1fb\"}":{"__typename":"Education","uuid":"3a56d5c6-5c63-420f-8180-1cd62ab9d1fb","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Neuroscience \u0026 Social Policy, minor in Business","degree":null},"MentorPublicProfile:{\"uuid\":\"febe024a-f009-4a93-9484-6c7a3ccefd35\"}":{"__typename":"MentorPublicProfile","uuid":"febe024a-f009-4a93-9484-6c7a3ccefd35","displayName":"Gabrielle U.","slug":"gabrielle-unson","biography":"\u003cp\u003eHi! I’m Gabrielle, a fourth-year at Northwestern University double-majoring in Neuroscience \u0026amp; Social Policy with a Business minor. I help students with both academic mentoring and their passion projects!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm interested in all things STEM, policy, and business but am very passionate about issues in the healthscape at the intersection of all three! While these topics are what I'm most passionate about, I also advise outside of these subjects as well!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA little bit about my academic journey- I initially struggled a lot throughout my STEM classes in high school and early college. Having ADHD, I've learned how to tailor my learning and study habits so I can learn what I'm passionate about both in and out of the classroom! I've always had a lot of interests- and I love that I've been able to explore them and cross-connect them through my academic studies. Additionally, I'm a transfer student from Georgetown, where I majored in Health Care Management \u0026amp; Policy, so I can provide some insight into the transfer process as well!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I've been involved on and off campus. Regarding research, I've worked for RUSH Medical Center and on a study concerning Artificial Intelligence, building infrastructure, and public perceptions in New York. On campus, I helped relaunch my school's Design for America chapter where we use human-centered design to help create solutions for local non-profits. If you have questions on how to connect/work with local non-profits or research labs I'd love to share my own experiences!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I've spent a lot of my time in the healthspace at the intersection of policy and strategy. I'm very passionate about startups and high-impact work: I've worked at a MedDevice startup, Accountable Care Organization (ACO) startup, as well as a NYC health insurer providing federal and state insurance plans. After graduation, I will be working in consulting in NYC and then applying to medical school!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy teaching experience has covered all sorts of topics and age ranges! In college, I've taught engineering afterschool programs for K-5 students and have loved being hands-on and adapting my style for my students. Additionally, I act as a course moderator for the Kellogg School of Management- especially in the Marketing Department.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor fun, I love to craft, draw, and make clothing. I also used to be a Division I rower at Georgetown and can speak more about athletics in college! I'm hoping to run a marathon next year and love to chat about running tips! Please feel free to reach out!\u003c/p\u003e","teachingVideoPlaybackId":"EYUVw8OnCzA02LY7I5LEVZ8oSqCsZ1kTTTopPeHmhEBU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"62e2ef8c-fd5d-43c5-bcaf-33e16f247849\"}"},{"__ref":"Favorites:{\"uuid\":\"974eba25-0de8-4e76-9958-9214563870ce\"}"},{"__ref":"Favorites:{\"uuid\":\"c66c0f0b-89e8-4fef-b0e9-a89198da0b22\"}"}],"causesSupported":[],"major":"Neuroscience \u0026 Social Policy, minor in Business","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"37057500-bc77-4c1e-84e0-04d1cbc835cb\"}"},{"__ref":"DeepDives:{\"uuid\":\"1cf5b255-8814-4361-9a72-042a6a3a787b\"}"},{"__ref":"DeepDives:{\"uuid\":\"1e40168e-9f2a-4b4b-a112-e99a93aaab3c\"}"},{"__ref":"DeepDives:{\"uuid\":\"cee2fc9e-d4a0-478a-a765-a9a733f2c495\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fb8a6cfe-3484-42c2-96cd-9b9f326380f2/-/preview/-/format/jpg/","https://ucarecdn.com/75a97f51-0249-4c2f-a0b4-847a8d01943b/-/preview/-/format/jpg/","https://ucarecdn.com/129d2873-e933-4541-9e13-947a321cfe6f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"fa99d260-5aa4-4f38-9b75-9dc112771981\"}"},{"__ref":"Education:{\"uuid\":\"3a56d5c6-5c63-420f-8180-1cd62ab9d1fb\"}"}],"hiredAt":"2025-10-31T17:43:18.353Z","topics":["K-5 Grade Math",
