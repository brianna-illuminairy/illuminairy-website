xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"d217f9bd-c59d-4c76-9760-3abd7d12a17b\"}":{"__typename":"DeepDives","uuid":"d217f9bd-c59d-4c76-9760-3abd7d12a17b","content":"\u003cp\u003eMy dream is to become a dentist or oral surgeon who specializes in reconstructive care, changing lives by restoring a feature that is often overlooked in overall health. Oral health is the gateway to speaking, eating, and breathing properly, and I want to help patients regain that confidence and functionality. Ultimately, I hope to travel to underserved communities worldwide, using my skills to provide essential care to those who need it most.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"13433f3d-9ea7-49e6-87c8-8cf8191e0ad9\"}":{"__typename":"DeepDives","uuid":"13433f3d-9ea7-49e6-87c8-8cf8191e0ad9","content":"\u003cp\u003eI would tell my younger self that while you can’t always control your circumstances, you have immense power over your mindset -- and that shift changes outcomes more than you think. Instead of viewing a challenge as a barrier, try seeing it as a puzzle to be solved; once you realize that your perspective dictates your performance, you stop being a passenger in your own life and start being the driver.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9fbab0e4-2d6d-4537-b163-930e30a2e71f\"}":{"__typename":"DeepDives","uuid":"9fbab0e4-2d6d-4537-b163-930e30a2e71f","content":"\u003cp\u003eMentorship is personal to me, largely because of the responsibility I’ve always felt to guide and support my younger sister. Through her, and the many students I’ve worked with since, I’ve realized that mentorship is a two-way street. I have learned just as much about my own patience and leadership as my mentees have learned from the material. There is nothing more rewarding than watching someone else’s confidence grow and knowing you played a small part in that spark.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"db77e381-b24e-464b-bd3e-3fc74cc981c6\"}":{"__typename":"DeepDives","uuid":"db77e381-b24e-464b-bd3e-3fc74cc981c6","content":"\u003cp\u003eAs a pre-dental student, I knew a strong foundation in biology was essential, but I wanted to step outside the traditional bubble and explore Ecology and Evolutionary Biology. I’ve always been fascinated by the ocean’s intricate ecosystems and marine organisms, and this major allows me to dive deep into those passions, studying the natural world in a way I might not get to once I enter the specialized world of dental school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"4b07ef42-819f-461f-9ee3-364ff16a926a\"}":{"__typename":"School","uuid":"4b07ef42-819f-461f-9ee3-364ff16a926a","name":"Guilford High School","city":"Guilford","type":"HIGH","state":"Connecticut","country":"United States","zip":"06437"},"Education:{\"uuid\":\"ade87b11-1f8c-448e-9d22-0d3400cdf74d\"}":{"__typename":"Education","uuid":"ade87b11-1f8c-448e-9d22-0d3400cdf74d","school":{"__ref":"School:{\"uuid\":\"4b07ef42-819f-461f-9ee3-364ff16a926a\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"c3d556e3-ea7b-434c-9e6d-c340d6a76ac8\"}":{"__typename":"Education","uuid":"c3d556e3-ea7b-434c-9e6d-c340d6a76ac8","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Ecology and Evolutionary Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"8b8ce935-ef7b-4e85-b6b1-673c43b56738\"}":{"__typename":"MentorPublicProfile","uuid":"8b8ce935-ef7b-4e85-b6b1-673c43b56738","displayName":"Sydney H.","slug":"sydney-hahn","biography":"\u003ch2\u003e\u003cstrong\u003eHi! My name is Sydney!🌟\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI’m a first-year student at \u003cstrong\u003eYale University\u003c/strong\u003e prospectively majoring in \u003cstrong\u003eEcology and Evolutionary Biology\u003c/strong\u003e on a pre-dental track. I developed a deep-rooted passion for mentorship early on in my hometown of Guilford, CT. During my senior year, I founded my own senior-freshman mentorship program to help younger students navigate the complexities of high school, and I’ve spent years as a peer tutor and youth soccer coach. My academic journey has been defined by a love for challenge, earning me excellence awards in Calculus and Spanish, as well as the \u003cstrong\u003eSt. Michael’s College Book Award\u003c/strong\u003e and a Guilford Soccer Scholarship. I believe that the best learning happens when a student feels empowered and seen, and I’m excited to bring that same energy to our sessions!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my work as a mentor, I specialize in \u003cstrong\u003eAcademic Mentorship\u003c/strong\u003e and \u003cstrong\u003eSTEM Passion Projects\u003c/strong\u003e, particularly within the life sciences and research. I’ve had the incredible opportunity to work virtually for a \u003cstrong\u003eYale research lab\u003c/strong\u003e focused on reconstructive oncology, where I’ve aided in the research process for academic papers and managed educational social media platforms. This experience allows me to help students bridge the gap between classroom theory and real-world scientific inquiry. Beyond the lab, I’ve led peer ministry at my local church and currently volunteer with \u003cstrong\u003eGirls on the Run\u003c/strong\u003e, where I use physical activity as a tool for confidence-building in young girls. Whether we are tackling a complex biology concept or designing a custom project, I draw on my years of experience to ensure every session is both productive and inspiring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I am definitely \u003cstrong\u003ehigh-energy\u003c/strong\u003e and personality-driven. I make it a priority to get to know my mentees as individuals before we dive into the material, as I believe the best teaching is tailored to a person’s \"niche self.\" My time on the soccer field and in the classroom has taught me incredible patience: I understand that everyone approaches challenges differently, and I love the puzzle of finding the exact explanation that makes a concept click.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not in the library or the lab, you can usually find me staying active, reading, or traveling. I am a dedicated \u003cstrong\u003ebaker\u003c/strong\u003e and a true \u003cstrong\u003etea connoisseur\u003c/strong\u003e -- I’m always on the hunt for a new blend to add to my collection! Also, if you ever want to talk \u003cstrong\u003eHarry Potter\u003c/strong\u003e theory, I’m your person; I was a massive nerd for the series all throughout middle and high school and can still discuss the Wizarding World for hours. I can’t wait to meet you and start exploring your passions together!\u003c/p\u003e","teachingVideoPlaybackId":"cwFCExKPpyvg3Kd0016ZTsyHieGNvW00KAyVA1dcZOSws","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Ecology and Evolutionary Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d217f9bd-c59d-4c76-9760-3abd7d12a17b\"}"},{"__ref":"DeepDives:{\"uuid\":\"13433f3d-9ea7-49e6-87c8-8cf8191e0ad9\"}"},{"__ref":"DeepDives:{\"uuid\":\"9fbab0e4-2d6d-4537-b163-930e30a2e71f\"}"},{"__ref":"DeepDives:{\"uuid\":\"db77e381-b24e-464b-bd3e-3fc74cc981c6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a7984de0-5767-4eed-a9ad-73465af61712/-/preview/-/format/jpg/","https://ucarecdn.com/fa0c5d8a-9faa-4fa9-aa09-a4a87fe5102d/-/preview/-/format/jpg/","https://ucarecdn.com/5f8fca28-4cc5-4000-b6db-f22bc47d3ae9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ade87b11-1f8c-448e-9d22-0d3400cdf74d\"}"},{"__ref":"Education:{\"uuid\":\"c3d556e3-ea7b-434c-9e6d-c340d6a76ac8\"}"}],"hiredAt":"2026-03-16T22:57:32.426Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","Biology","Chemistry","Writing","Spanish","Executive Function","Reading","Fashion / Cosmetics","Medicine / Health","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sydney-hahn\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8b8ce935-ef7b-4e85-b6b
