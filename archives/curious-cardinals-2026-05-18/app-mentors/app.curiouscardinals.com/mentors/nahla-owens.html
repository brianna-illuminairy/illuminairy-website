xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4518bc07-dffc-4f48-9c0b-afa3dee87487\"}":{"__typename":"Favorites","uuid":"4518bc07-dffc-4f48-9c0b-afa3dee87487","photoUrl":"https://ucarecdn.com/a5d5c208-59d7-438a-9e5e-de0ebfe247ad/","title":"Hit Me Hard and Soft - Billie Eilish","type":"ALBUM"},"Favorites:{\"uuid\":\"38bbe4ff-b6f8-48a8-81ee-8a05048b0436\"}":{"__typename":"Favorites","uuid":"38bbe4ff-b6f8-48a8-81ee-8a05048b0436","photoUrl":"https://ucarecdn.com/be57f566-d13d-452a-b78a-f56ee6633b32/","title":"Washington, D.C.","type":"CITY"},"Favorites:{\"uuid\":\"9bb0107d-d2da-4a6c-9c4c-7f15935c4a6e\"}":{"__typename":"Favorites","uuid":"9bb0107d-d2da-4a6c-9c4c-7f15935c4a6e","photoUrl":"https://ucarecdn.com/503f9eac-f219-4238-82c7-152411936058/","title":"Just Mercy - Bryan Stevenson","type":"BOOK"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"30111b4c-2bf6-46c9-ae34-bac5e8f0512a\"}":{"__typename":"DeepDives","uuid":"30111b4c-2bf6-46c9-ae34-bac5e8f0512a","content":"\u003cp\u003eBreathe and take it all in! I know that high school, particularly, can sometimes feel like a high-stakes pressure cooker with college and the future right on the horizon. But this time in adulthood is less about doing everything perfectly to get the \"perfect\" future outcome and more about learning as much as you possibly can about yourself and the world! Choosing to be a student of the world around you instead of being crushed by its pressures is what ultimately led me to find and wholeheartedly pursue my passions! I know this is easier said than done so looking forward to getting into how exactly to do this in a mentorship session!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"30718f11-ca91-41f8-94da-d7b4e19eb0eb\"}":{"__typename":"DeepDives","uuid":"30718f11-ca91-41f8-94da-d7b4e19eb0eb","content":"\u003cp\u003eWhile \"Social Studies\" may sound like the subject that you studied in elementary school, at Harvard, it's a build-your-own style honors program in the social sciences! I knew that my passion for Social Innovation and Organizational Behavior involved multiple disciplines and skills, and I wanted to have the freedom to take all of the courses that would support me in pursuing that. As a result of choosing the Social Studies program, I've been able to explore my interests in a number of courses at the graduate level ranging from master's to doctoral!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"682669f6-e57c-4a6d-ac73-676fcd8f7989\"}":{"__typename":"DeepDives","uuid":"682669f6-e57c-4a6d-ac73-676fcd8f7989","content":"\u003cp\u003eI knew as a high schooler, I wanted to jump at every opportunity to explore potential future paths (mostly because I didn't know exactly what I wanted to do). While some clicked (and others didn't), I learned so much about myself and made lifelong friends. During my freshman summer, I did an architecture-intensive program at the University of Houston (and discovered that I did not want to be an architect). The following summer I did a pre-college program at Carleton College and participated in a program in Washington, D.C. with the American Civil Liberties Union that helped me fall in love with political advocacy. My junior summer I volunteered for an array of non-profits and worked on political campaigns! After I graduated, I got my first real job at a smoothie shop and ran a mentorship program for local high school students! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"3ccd2817-d395-42d2-ae1a-5ef62c4ca1e0\"}":{"__typename":"DeepDives","uuid":"3ccd2817-d395-42d2-ae1a-5ef62c4ca1e0","content":"\u003cp\u003eMentorship was pivotal for me in terms of exploring my interests and, ultimately, in both being admitted to and navigating Harvard! I'm honored and excited to convey some of the things I've learned in a one-on-one format that is responsive to the needs and interests of my mentee :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}":{"__typename":"School","uuid":"62e59c56-ee46-4213-b082-758af3ff99db","name":"Phillips Exeter Academy","city":"Exeter","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03833"},"Education:{\"uuid\":\"ae9bf46a-fdca-4784-aafe-d03f0f86f0a6\"}":{"__typename":"Education","uuid":"ae9bf46a-fdca-4784-aafe-d03f0f86f0a6","school":{"__ref":"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"bf9371f6-dc78-4ddc-8b32-1fd9ed10f3b3\"}":{"__typename":"Education","uuid":"bf9371f6-dc78-4ddc-8b32-1fd9ed10f3b3","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Social Studies (Focus on Leadership and Social Change)","degree":null},"MentorPublicProfile:{\"uuid\":\"fe97ee73-624b-4396-8920-b27765638543\"}":{"__typename":"MentorPublicProfile","uuid":"fe97ee73-624b-4396-8920-b27765638543","displayName":"Nahla O.","slug":"nahla-owens","biography":"\u003cp\u003eHi all! My name is Nahla, and I’m originally from Houston, Texas. I recently graduated from Harvard, where I studied Social Studies with a focus on Organizational Leadership \u0026amp; Social Innovation and earned a Secondary in Mind, Brain, and Behavior (a blend of psychology and neuroscience). I'm currently pursuing my MBA and working at an entrepreneurship center in Mexico City, Mexico as a part of a post-graduate fellowship.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy passion for public policy, advocacy, and social innovation stems from my early experiences as a youth leader in the American Civil Liberties Union and as a youth representative at the 66th, 67th, and 68th UN Commission on the Status of Women. In these roles, I had the privilege of delivering speeches to key stakeholders, drafting recommendations that were adopted in the Commission’s agreed conclusions, and collaborating with both civil society organizations and member states to expand educational opportunities for minority women across the globe. These experiences sparked my commitment to creating more equitable systems, especially through education and civic engagement.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCurrently, I am based in Mexico City as a Fulbright Binational Business Fellow, where I work at the intersection of the private sector and public policy. My work explores how innovative practices from business and social entrepreneurship can be applied to strengthen government administration and expand opportunities for underserved communities. Living and working in Mexico has also deepened my cross-cultural perspective and affirmed my belief in the importance of global citizenship and collaboration.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of my professional projects, I’ve found some of my most meaningful experiences come from mentorship and teaching. At Harvard, I served as President of Harvard Model Congress, where I organized national and international conferences that introduced high school students to policymaking and leadership. I also taught civic engagement to 5th graders through the CIVICS program and led workshops on leadership and advocacy for students from diverse backgrounds. Through Curious Cardinals, I continue mentoring students one-on-one, supporting them in building confidence, discovering their passions, and navigating both academic challenges and personal growth.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I strive to be approachable, encouraging, and flexible. I know that the journey through school, college applications, and beyond can be stressful, and I aim to make the process not only manageable but also exciting. My favorite part of mentoring is helping students connect their unique interests to broader opportunities — whether that means building a strong college application narrative, exploring new academic fields, or finding their voice as a leader.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not working, you can usually find me rehearsing with a hip-hop dance group, exploring Mexico City’s vibrant neighborhoods, or spending time with friends and family. I’m always excited to learn from others, and I look forward to working with mentees who are curious, motivated, and eager to grow.\u003c/p\u003e","teachingVideoPlaybackId":"CU00B8vKqJ85IIojn00LwiTiZwWXNIdRQwOJBqKV00pm7Q","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4518bc07-dffc-4f48-9c0b-afa3dee87487\"}"},{"__ref":"Favorites:{\"uuid\":\"38bbe4ff-b6f8-48a8-81ee-8a05048b0436\"}"},{"__ref":"Favorites:{\"uuid\":\"9bb0107d-d2da-4a6c-9c4c-7f15935c4a6e\"}"}],"causesSupported":[],"major":"Social Studies (Focus on Leadership and Social Change)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"30111b4c-2bf6-46c9-ae34-bac5e8f0512a\"}"},{"__ref":"DeepDives:{\"uuid\":\"30718f11-ca91-41f8-94da-d7b4e19eb0eb\"}"},{"__ref":"DeepDives:{\"uuid\":\"682669f6-e57c-4a6d-ac73-676fcd8f7989\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ccd2817-d395-42d2-ae1a-5ef62c4ca1e0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/28028b25-068e-473e-85be-e17898d6d2e3/-/preview/-/format/jpg/","https://ucarecdn.com/46e7ed69-f257-4434-86e5-477f29db7a50/-/preview/-/format/jpg/","https://ucarecdn.com/64a3c624-9200-49e3-8a69-f93c552684bf/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ae9bf46a-fdca-4784-aafe-d03f0f86f0a6\"}"},{"__ref":"Education:{\"uuid\":\"bf9371f6-dc78-4ddc-8b32-1fd9ed10f3b3\"}"}],"hiredAt":"2024-11-20T18:33:50.235Z","topics":["Writing","Academic Coaching","College Essay Writing","Executive Function","History","Reading","History Project","Business / Entrepreneurship","Debate","Journalism","Law / Government / Policy","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nahla-owens\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fe97ee73-624b-4396-8920-b27765638543\"}"}}},"_sentryTraceDat
