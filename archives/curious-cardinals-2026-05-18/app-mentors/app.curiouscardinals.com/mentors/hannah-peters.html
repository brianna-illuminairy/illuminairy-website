xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"31a74b9a-1d2b-4ca9-8068-1fe892232dff\"}":{"__typename":"Favorites","uuid":"31a74b9a-1d2b-4ca9-8068-1fe892232dff","photoUrl":"https://ucarecdn.com/e7f776ee-04e4-4b03-80e3-d4ef048b6aad/","title":"Noah Kahan","type":"ARTIST"},"Favorites:{\"uuid\":\"7ed8a435-7118-4eef-9042-ff46c2e20bad\"}":{"__typename":"Favorites","uuid":"7ed8a435-7118-4eef-9042-ff46c2e20bad","photoUrl":"https://ucarecdn.com/835e9084-a6b6-4782-9ed0-288a74b52db1/","title":"Boston","type":"CITY"},"Favorites:{\"uuid\":\"3128c17a-67a5-4820-af0e-66fd13f70e3e\"}":{"__typename":"Favorites","uuid":"3128c17a-67a5-4820-af0e-66fd13f70e3e","photoUrl":"https://ucarecdn.com/fa729ebe-181b-410f-b196-579a9fc11176/","title":"Rowing","type":"SPORT"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"91c3ff07-e9d5-432e-aa8a-dd514280c62e\"}":{"__typename":"DeepDives","uuid":"91c3ff07-e9d5-432e-aa8a-dd514280c62e","content":"\u003cp\u003eIn my spare time, you can usually find me singing Broadway songs while I bake, or going on a run and catching up with friends and family over the phone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"367d972c-7590-421a-a8d0-1316b06361da\"}":{"__typename":"DeepDives","uuid":"367d972c-7590-421a-a8d0-1316b06361da","content":"\u003cp\u003eI grew up with a complex learning profile, so middle school was really about figuring out how to navigate the classroom in ways that helped me succeed. By high school, I had built more confidence and discipline with those skills and started to really grow into myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"628a6d6b-3435-45b0-a903-edf2be0b5c19\"}":{"__typename":"DeepDives","uuid":"628a6d6b-3435-45b0-a903-edf2be0b5c19","content":"\u003cp\u003eSomething people don’t always realize about me right away is that I’m a huge theater kid. I did a cappella in high school, and even now in college I’m always finding ways to keep the arts in my life. You can usually catch me dancing in my room or around my sorority house, still holding onto that love of music, creativity, and performance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"3957513d-2fb1-43db-b95e-86aba110bd25\"}":{"__typename":"DeepDives","uuid":"3957513d-2fb1-43db-b95e-86aba110bd25","content":"\u003cp\u003eOne of my proudest accomplishments was making the U.S. rowing team in high school and racing the double for Team USA in Italy in 2022. Training at that level pushed me harder than anything else I’d done, and representing the U.S. on the international stage was an unforgettable experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"5263e901-e6bd-4a00-97c7-bcfcb898dd35\"}":{"__typename":"School","uuid":"5263e901-e6bd-4a00-97c7-bcfcb898dd35","name":"Noble and Greenough School","city":"Dedham","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02026"},"Education:{\"uuid\":\"1331a99d-4c7b-49d8-9705-722d53d54af5\"}":{"__typename":"Education","uuid":"1331a99d-4c7b-49d8-9705-722d53d54af5","school":{"__ref":"School:{\"uuid\":\"5263e901-e6bd-4a00-97c7-bcfcb898dd35\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"5a453462-a643-4001-98fb-590da7347591\"}":{"__typename":"Education","uuid":"5a453462-a643-4001-98fb-590da7347591","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Product Design","degree":null},"MentorPublicProfile:{\"uuid\":\"edb65feb-d46b-4d52-9ab8-64d9af9e1a00\"}":{"__typename":"MentorPublicProfile","uuid":"edb65feb-d46b-4d52-9ab8-64d9af9e1a00","displayName":"Hannah P.","slug":"hannah-peters","biography":"\u003cp\u003eHi, I’m Hannah! I’m a junior at Stanford studying Design with a focus on healthcare and health technology, alongside Psychology and Chemistry. I’ve always been drawn to the places where creativity and science overlap, and I love thinking about how human-centered design can make healthcare more intuitive, empathetic, and effective. Whether it’s improving a patient experience, reimagining a system, or making information easier to understand, I’m fascinated by how thoughtful design can change the way people access care.\u003c/p\u003e\u003cp\u003eAcademically, I’m someone who likes to understand how things work from multiple angles. I’m equally energized by the human side and the technical side of learning, whether that means diving into how the brain processes information, studying the chemistry behind living systems, or designing solutions to everyday challenges. I’ve learned that a big idea doesn’t have to feel intimidating if you can break it down the right way. What excites me most is taking complex or overwhelming topics and turning them into clear, manageable pieces that make learning feel engaging, doable, and even fun.\u003c/p\u003e\u003cp\u003eOutside of class, a big part of my life is rowing. I’m on the Stanford Lightweight Rowing Team, and it has been one of the most grounding and defining parts of my college experience. Waking up early, training with teammates who care deeply about a shared goal, and learning how to push myself physically and mentally has taught me so much about discipline, teamwork, and showing up for others. I’ve grown a lot from being part of something that depends so much on trust, communication, and resilience.\u003c/p\u003e\u003cp\u003eI’m also involved in biodesign projects at Stanford, where small, interdisciplinary teams come together to brainstorm creative solutions to real healthcare problems. I love the mix of collaboration, problem-solving, and imagination because it is a space where everyone brings something different to the table and ideas can turn into tangible impact.\u003c/p\u003e\u003cp\u003eWhen I’m not in class, rowing, or working on a project, I try to make time for the things that make me feel like myself. I love running, baking, singing, and hiking. Those are the things that keep me balanced, happy, and connected to the world outside of school.\u003c/p\u003e\u003cp\u003eAt the heart of everything I do, I care about creating encouraging and inclusive spaces where people feel supported and confident in their ability to grow. I’m excited to share what I’ve learned, learn alongside others, and help students discover their strengths in ways that feel personal and empowering.\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"d2mBwuC9FSJqqrbJblMA5r4sd0200WiI53yMB9CGY0101IM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"31a74b9a-1d2b-4ca9-8068-1fe892232dff\"}"},{"__ref":"Favorites:{\"uuid\":\"7ed8a435-7118-4eef-9042-ff46c2e20bad\"}"},{"__ref":"Favorites:{\"uuid\":\"3128c17a-67a5-4820-af0e-66fd13f70e3e\"}"}],"causesSupported":[],"major":"Product Design","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"91c3ff07-e9d5-432e-aa8a-dd514280c62e\"}"},{"__ref":"DeepDives:{\"uuid\":\"367d972c-7590-421a-a8d0-1316b06361da\"}"},{"__ref":"DeepDives:{\"uuid\":\"628a6d6b-3435-45b0-a903-edf2be0b5c19\"}"},{"__ref":"DeepDives:{\"uuid\":\"3957513d-2fb1-43db-b95e-86aba110bd25\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ca07dc2d-22b7-4dbf-9e67-9127d9212069/-/preview/-/format/jpg/","https://ucarecdn.com/0855de6c-8e8f-4422-ae44-822f1ebd486f/-/preview/-/format/jpg/","https://ucarecdn.com/1192698c-b953-4be9-90bc-8b2d8086ccf7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1331a99d-4c7b-49d8-9705-722d53d54af5\"}"},{"__ref":"Education:{\"uuid\":\"5a453462-a643-4001-98fb-590da7347591\"}"}],"hiredAt":"2025-09-23T15:31:41.620Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Chemistry","Biology","Physics","6-8 Grade Science","Academic Coaching","Executive Function","History"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hannah-peters\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"edb65feb-d46b-4d52-9ab8-64d9af9e1a00\"}"}}},"_sentryTraceData":"f846332173a64af6b15da91a6c96b26f-a4ff68fb30d98ffd-0","_sentryBaggage":"sentry-e
