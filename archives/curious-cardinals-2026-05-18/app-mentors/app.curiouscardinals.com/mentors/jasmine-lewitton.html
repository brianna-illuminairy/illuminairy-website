xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c6c7438d-d3f8-4267-8a41-d9c350a5acf4\"}":{"__typename":"DeepDives","uuid":"c6c7438d-d3f8-4267-8a41-d9c350a5acf4","content":"\u003cp\u003eI would like to help genetically engineer organisms to make them compatible with environments on other planets. This would eventually allow humanity to travel farther across the universe. I hope to see the first human colony set foot on another planet because of my work in my lifetime.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1d90a6cf-3132-4a6a-9374-e8672fab2535\"}":{"__typename":"DeepDives","uuid":"1d90a6cf-3132-4a6a-9374-e8672fab2535","content":"\u003cp\u003eI love to go for long runs around campus while I listen to music. On days when I don't quite have the energy to run, I enjoy curling up with a hot cup of Rooibos tea and my guitar or a really good book.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"962fa4b0-8b0d-4fa1-bb5d-43af569b9abc\"}":{"__typename":"DeepDives","uuid":"962fa4b0-8b0d-4fa1-bb5d-43af569b9abc","content":"\u003cp\u003eRhino Camp! \u003cbr\u003e\u003cbr\u003eRhino Camp is a project I created a couple of years ago that brings people from different backgrounds to my family's reserve to get hands-on experience with rhino conservation and learn both how my family is saving the rhino from extinction and why we got into it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1ec20bca-9e2e-4f60-b823-c62c6e0bcbc2\"}":{"__typename":"DeepDives","uuid":"1ec20bca-9e2e-4f60-b823-c62c6e0bcbc2","content":"\u003cp\u003e\"Embrace the suck.\"\u003cbr\u003e\u003cbr\u003eThis is a Navy SEAL saying that my dad used to tell me when I was struggling to make it through tough times. It encourages you not to simply push through the challenges that come up, but rather gratefully accept them as an opportunity to make yourself stronger. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"2b601998-c2ef-48a8-9800-3b255b793436\"}":{"__typename":"Education","uuid":"2b601998-c2ef-48a8-9800-3b255b793436","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Bioengineering","degree":"Biochemistry or Neurobiology (still deciding)"},"School:{\"uuid\":\"03401c59-f2b8-4eb6-b315-f7b90b938c8f\"}":{"__typename":"School","uuid":"03401c59-f2b8-4eb6-b315-f7b90b938c8f","name":"St Mary's School, Waverley","city":"Johannesburg","type":"HIGH","state":"Gauteng","country":"South Africa","zip":"2090"},"Education:{\"uuid\":\"b0b11d89-95de-4c75-b7c1-4c5a31e8d42c\"}":{"__typename":"Education","uuid":"b0b11d89-95de-4c75-b7c1-4c5a31e8d42c","school":{"__ref":"School:{\"uuid\":\"03401c59-f2b8-4eb6-b315-f7b90b938c8f\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"Testimonial:f463c31b-9c88-4838-9483-68c7ec36dcae":{"__typename":"Testimonial","id":"f463c31b-9c88-4838-9483-68c7ec36dcae","text":"Jaz was such an amazing mentor for Namah. Namah looked forward to their weekly sessions and was able to use the time to not only learn physics but also to learn about study skills and to improve his executive function skills. Jaz was responsive to Namah’s needs and was able to help Namah in multiple areas throughout his junior year helping Namah to grow during a pivotal academic period. We are so grateful to Curious Cardinals for finding and matching Jaz to Namah so that Namah actually looked forward to mentoring sessions each week. thank you!!","date":"2025-06-02 22:53:01.322+00","rating":5,"endorser":{"__typename":"Endorser","name":"Tami Horton","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"16bb247b-8021-456c-87c7-0bb21207647f\"}":{"__typename":"MentorPublicProfile","uuid":"16bb247b-8021-456c-87c7-0bb21207647f","displayName":"Jasmine L.","slug":"jasmine-lewitton","biography":"\u003cp\u003eHi!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Jasmine, but everyone calls me Jas. :)\u003cbr\u003e\u003cbr\u003eI am 23 years old and currently a senior at Stanford University. I am also an older sister to three wonderful little sisters (who are nineteen, eight, and four years old, respectively). My hobbies include things like running around campus with my favorite songs playing in my earphones, drinking the largest cup of coffee I can get my hands on while reading a good book, or trying out a new recipe in the kitchen.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile my life resembles those of my peers in many ways, I had a fairly unique upbringing. I grew up in South Africa where I had the privilege of splitting my time between Johannesburg, a major city where I attended school, and Limpopo, in the far more rural areas of the country where my family owns a rhino reserve.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn fact, my family owns the world’s third largest private rhino reserve in the world. We protect around 200 rhino along with an entire African ecosystem on thousands of acres of wild land.\u0026nbsp;\u003c/p\u003e\u003cp\u003eRhino conservation has been my dad’s entire career for the last five years. And it is this reserve and his mission – saving rhino from extinction through sustainable conservation models – that inspired me to pursue the career I am currently working toward. I have grown up watching my dad work every day to create a better world for his daughters than the one he inherited, and that ignited a desire in me to do the same. However, instead of conservation, I chose to make my mark in the world of genetic engineering.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eUltimately, I would like to genetically engineer organisms to make them compatible with worlds beyond our little blue ball so that humanity can spread farther out into the universe. This includes things like creating a variety of wheat that can grow on Mars or potentially altering the biology of more complex organisms like mammals to make them capable of breathing the air on a planet in a different galaxy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eTo eventually reach that goal, I am currently pursuing a major in Bioengineering and considering a Computer Science minor. I hope to one day work for organizations like NASA or Spacex and write my name in the book of history.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"AxIbes5Hn01HNYGxfPmpRUIFssQT1Cq6QrTYRoUVSegM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Bioengineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c6c7438d-d3f8-4267-8a41-d9c350a5acf4\"}"},{"__ref":"DeepDives:{\"uuid\":\"1d90a6cf-3132-4a6a-9374-e8672fab2535\"}"},{"__ref":"DeepDives:{\"uuid\":\"962fa4b0-8b0d-4fa1-bb5d-43af569b9abc\"}"},{"__ref":"DeepDives:{\"uuid\":\"1ec20bca-9e2e-4f60-b823-c62c6e0bcbc2\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f89b18ef-4326-4f67-92f9-8d447bfb1e78/-/preview/-/format/jpg/","https://ucarecdn.com/20009900-611f-4f4e-8ea6-1db40f19ba58/-/preview/-/format/jpg/","https://ucarecdn.com/a8a231e9-61be-4dba-8078-19fa56d95381/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2b601998-c2ef-48a8-9800-3b255b793436\"}"},{"__ref":"Education:{\"uuid\":\"b0b11d89-95de-4c75-b7c1-4c5a31e8d42c\"}"}],"hiredAt":"2023-09-26T16:10:39.493Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Biology","Chemistry","Physics","Writing","Academic Coaching","College Essay Writing","Executive Function","Reading","Creative Writing","K-6 Storybook","STEM Project","Journalism","Public Speaking","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:f463c31b-9c88-4838-9483-68c7ec36dcae"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jasmine-lewitton\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"16bb247b-8021-456c-87c7-0bb21207647f\"}"}}},"_sentryTraceData":"bab716f0e7124a4ba3b82f9190e60196-8b6970a069548973-0","_sen
