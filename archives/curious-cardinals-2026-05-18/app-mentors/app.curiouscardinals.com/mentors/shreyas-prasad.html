xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"019a0921-38c0-49b0-bf28-7b1c1109427f\"}":{"__typename":"Education","uuid":"019a0921-38c0-49b0-bf28-7b1c1109427f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":null,"endYear":"2022","expectedGradYear":null,"major":"Biomedical Computation","degree":"BS"},"MentorPublicProfile:{\"uuid\":\"2d65153d-7ab0-41ec-b6e0-a7500630e592\"}":{"__typename":"MentorPublicProfile","uuid":"2d65153d-7ab0-41ec-b6e0-a7500630e592","displayName":"Shreyas P.","slug":"shreyas-prasad","biography":"Shreyas is wrapping up his degree at Stanford University where he studied biomedical computation. Academically, Shreyas is interested in bridging three things: the language that make up the genetic code, the code that runs our computer, and the rules that govern society. He loves living at the bleeding edge of topics from biosecurity to the regulatory concerns of artificial intelligence. During his time at Stanford, he was the Senior Class President, a student representative on the Board of Trustees, the Vice Provost’s Student Advisory Group, and a Resident Assistant for two years. He was an Investment Partner at Dorm Room Fund where he invested in student-led startups and helped build the entrepreneurial ecosystem across colleges nationwide. Alongside his TA, he co-authored a book on the regulatory implications and challenges with artificial intelligence, where it rose to one of the top 50 science and technology law books on Amazon. He also conducted research with a professor at the Graduate School of Business on the impacts of technology on micro-entrepreneurs in Rwanda and Kenya where he was able to conduct field research. \n\n Outside of class, Shreyas is almost always working on a side project or two. Prior to Stanford, he started two companies: one which was acquired by an ed-tech company in Chicago and another that had $75k in annual revenue. During college, he has pursued numerous entrepreneurial ventures which have taken him across America and even the world. Prior to the pandemic, his company had a contract to launch his product to teach English to over 5M students in China. Although the pandemic changed many of the company’s plans, he got invaluable experience. He has cumulatively raised $150k for his various ventures. He was named Philadelphia’s Young Entrepreneur of the Year, one of the Top 6 Young Entrepreneurs by the US Chamber of Commerce, and his mom thinks he’s a winner in her books. He also had the unique opportunity to work on Special Projects for the billionaire owner of the Cleveland Cavaliers. Prior to Stanford, he gave 5 TEDx talks across the country on gearing education to focus more on extra-curricular pursuits.\n\nHe enjoys volunteering and has worked on technology projects for the EPA, the Department of Defense, the US Marine Corp Reserves, the National Center for State Courts and the Governor’s Office of California. He is immensely passionate about public service and used to compete in national constitutional speech competitions. You can regularly find him reading historical documents related to American democracy and good luck finding him without his pocket Constitution. Shreyas loves juggling, building with Legos, and singing in the shower. \n\nShreyas is hoping to share a love of learning and curiosity with students that he hopes can lead them to get excited by the challenges and problems the world faces no matter how big or small. \n\n","teachingVideoP
