xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"1efed8e4-1e69-4b31-8aaa-8f1053fbe10b\"}":{"__typename":"DeepDives","uuid":"1efed8e4-1e69-4b31-8aaa-8f1053fbe10b","content":"\u003cp\u003eFrom ages 8-14 on my daily walk to school, I passed sleek storefront displays with makeshift cardboard beds right outside. My native city embeds me not only in extensive cultural diversity but also in sobering socio-economic disparities. This exposure has prompted my interest in the intersection of architectural design and ethics. Through the lenses of urban sustainability and ethical construction, I hope to explore architecture’s full potential for transforming the built environment.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"8fad325c-7b72-4874-978a-b1430f8ce3fd\"}":{"__typename":"School","uuid":"8fad325c-7b72-4874-978a-b1430f8ce3fd","name":"Ethical Culture Fieldston School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"cb85187b-f6c3-48da-82ac-ec5899aa2842\"}":{"__typename":"Education","uuid":"cb85187b-f6c3-48da-82ac-ec5899aa2842","school":{"__ref":"School:{\"uuid\":\"8fad325c-7b72-4874-978a-b1430f8ce3fd\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"429d6654-2a02-4647-9e53-28e8316e1faa\"}":{"__typename":"Education","uuid":"429d6654-2a02-4647-9e53-28e8316e1faa","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Architecture","degree":null},"MentorPublicProfile:{\"uuid\":\"bae65770-3662-4ac7-bcee-190552a37905\"}":{"__typename":"MentorPublicProfile","uuid":"bae65770-3662-4ac7-bcee-190552a37905","displayName":"Aidan G.","slug":"aidan-ginor","biography":"\u003cp\u003eHi, I’m Aidan Ginor. I’m a sophomore at the University of Pennsylvania, studying Architecture with a minor in Urban Real Estate and Development at the Wharton School. I’ve always been fascinated by how design shapes the places we live and how architecture can transform a community. My focus right now is on learning how urban planning and development can make cities more vibrant, functional, and accessible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve had some pretty exciting experiences so far that have helped me bridge the gap between theory and practice. This past summer, I interned at Jamestown Limited Partners, where I got hands-on experience in asset management and development. I worked on everything from financial modeling to designing a new floor plan for a self-storage facility, which taught me a lot about balancing creative ideas with business needs. One of my favorite moments was getting an expansion proposal approved—seeing something I worked on go from idea to implementation was incredibly rewarding. Before that, I spent time at Jeff Koons LLC, where I learned about the world of contemporary art and how to manage the logistics behind a creative studio.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout high school, I received a few Scholastic Art \u0026amp; Writing Awards, including two Gold Keys and three Silver Keys, recognizing my artistic work amongst all submissions in New York State. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I’m involved in the Wharton Undergraduate Real Estate Club, where I get to connect with professionals and help other students learn more about the industry. I also head up the Architecture Committee for Chabad at Penn, which has given me the chance to work on a project expanding our outdoor space. It’s been a great learning experience—especially figuring out all the zoning and legal aspects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond school and work, I love to create. I play guitar, dabble in sketch comedy, and spend time painting and drawing. I’ve found that these creative outlets help me bring fresh perspectives to my architecture work and keep me inspired. I’m excited to keep learning and see where my passion for urban development takes me next!\u003c/p\u003e","teachingVideoPlaybackId":"5802gR01KdaxIbdmWfixUpBMYuJ4ALxaiSdL99xm6Wa00k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Architecture","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1efed8e4-1e69-4b31-8aaa-8f1053fbe10b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ffcaf43c-d9cb-4916-9819-17aea77c2ebf/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cb85187b-f6c3-48da-82ac-ec5899aa2842\"}"},{"__ref":"Education:{\"uuid\":\"429d6654-2a02-4647-9e53-28e8316e1faa\"}"}],"hiredAt":"2024-10-09T12:30:47.377Z","topics":["Architecture","Visual Arts / Graphic Design","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Algebra I","Algebra II"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"aidan-ginor\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"bae65770-3662-4ac7-bcee-190552a37905\"}"}}},"_sentryTraceData":"67d34bf4e0b84302915182400a6d79d6-b5d575415d9995bd-0","_
