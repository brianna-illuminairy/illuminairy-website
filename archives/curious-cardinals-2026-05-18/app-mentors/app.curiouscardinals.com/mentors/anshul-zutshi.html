xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b44fe7c7-815a-4ab1-9eb7-444292012575\"}":{"__typename":"Favorites","uuid":"b44fe7c7-815a-4ab1-9eb7-444292012575","photoUrl":"https://ucarecdn.com/3d0c0033-0896-4fce-99fb-11f962181ea8/","title":"The Ruins of Gorlan's (Ranger's Apprentice)","type":"BOOK"},"Favorites:{\"uuid\":\"f6735962-6c49-4212-956d-68a39266ab4d\"}":{"__typename":"Favorites","uuid":"f6735962-6c49-4212-956d-68a39266ab4d","photoUrl":"https://ucarecdn.com/dbf3661d-18c0-49d2-9ca2-375a044e2a11/","title":"Klay Thompson","type":"ATHLETE"},"Favorites:{\"uuid\":\"c847f598-e434-48de-9fd4-a2eb88457f5c\"}":{"__typename":"Favorites","uuid":"c847f598-e434-48de-9fd4-a2eb88457f5c","photoUrl":"https://ucarecdn.com/bc8618da-45e9-49ef-b587-a03c45fd333f/","title":"Melodic Blue","type":"ALBUM"},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"913e7a37-9fef-45db-ab41-1af6a774d0e1\"}":{"__typename":"DeepDives","uuid":"913e7a37-9fef-45db-ab41-1af6a774d0e1","content":"\u003cp\u003eWhen I was young, similar to many kids, I was fascinated by space and wanted to become an astronaut when I grew up. I wanted to explore the deep cosmos and understand how life started and whether we were truly alone. I often designed and drew rocket ships and methods of communication with aliens if I were to meet them. Although I still have a fascination for space, my eyes are no longer set on the stars but the world around me. I hope to retain this childlike curiosity and desire to learn throughout my life and impart some of those ideals onto my students as well.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"26065508-3471-40f8-98e2-174c673ff0a5\"}":{"__typename":"School","uuid":"26065508-3471-40f8-98e2-174c673ff0a5","name":"Archbishop Mitty High School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95129"},"Education:{\"uuid\":\"a53369fa-e6f9-47aa-8c06-45dbca5d0e5c\"}":{"__typename":"Education","uuid":"a53369fa-e6f9-47aa-8c06-45dbca5d0e5c","school":{"__ref":"School:{\"uuid\":\"26065508-3471-40f8-98e2-174c673ff0a5\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"817d3b3c-b985-4e67-9ef8-9f2963d326c6\"}":{"__typename":"Education","uuid":"817d3b3c-b985-4e67-9ef8-9f2963d326c6","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Computer Science, Applied Mathematics, Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"857973db-d3f0-44ab-acb8-ecab0037f438\"}":{"__typename":"MentorPublicProfile","uuid":"857973db-d3f0-44ab-acb8-ecab0037f438","displayName":"Anshul Z.","slug":"anshul-zutshi","biography":"\u003cp\u003eHi! My name is Anshul and I graduated from UC Berkeley in 2023 double majoring in computer science and applied mathematics. I have continued my education in graduate school at UC Berkeley, where I am currently studying data science and machine learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI began teaching from an early age as I had a younger sister and cousins that I frequently taught math and science to when growing up. I really fell in love with teaching when trying to get my younger sister to understand chain rule in calculus, the base of derivations. Due to her struggling to understand the concept, I found myself trying many different approaches from example problems to analogies to her interests. Although this process was long and arduous, once she understood the concept and had her \"aha\" moment I found myself so happy it was as if I had learned the concept for the first time. This thrill of teaching continued for me throughout high school in which I did SAT/ACT prep and math tutoring for all ages. I also competed in international math competitions like the AMC and AIME and did some freelance tutoring to assist other students in competition-level math. Once I reached college, I continued my passion for teaching, leading a discussion section for one of the core computer science classes at UC Berkeley that blended math and CS. \u003cbr\u003e\u003cbr\u003eAs for my interests, I really enjoy watching and playing various sports from golf to basketball (Go Warriors!). I also love playing cards and board games with friends like Catan and Poker. I am a big fan of sci-fi and fantasy books; I recently finished reading Speaker for the Dead, the sequel to Ender's Game, which was amazing. I and am currently reading the fifth book in the Stormlight archives by Brandon Sanderson which has been my favorite fantasy series I have read so far. I also have been practicing muay thai in my free time and have been trying to learn the guitar with little success so far.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I pride myself on getting to know my students, understand their needs and struggles, and developing a plan to best address their weaknesses and utilize their strengths. I believe that all students are unique and, as a result, require a custom teaching approach. My main focus as a mentor is to help my students better understand the underlying concepts so they can solve similar problems which is why I frequently utilize leading questions and tackling sub-questions when teaching. I hope to help my students and build a meaningful connection with them as we both continue to grow.\u003c/p\u003e","teachingVideoPlaybackId":"WeEyitdbb00Ssk1heHUz2L8IPW00y02p023afdUrJXijEDo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b44fe7c7-815a-4ab1-9eb7-444292012575\"}"},{"__ref":"Favorites:{\"uuid\":\"f6735962-6c49-4212-956d-68a39266ab4d\"}"},{"__ref":"Favorites:{\"uuid\":\"c847f598-e434-48de-9fd4-a2eb88457f5c\"}"}],"causesSupported":[],"major":"Computer Science, Applied Mathematics, Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"913e7a37-9fef-45db-ab41-1af6a774d0e1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2f0dc402-dad0-4220-9691-40c532e4c946/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"a53369fa-e6f9-47aa-8c06-45dbca5d0e5c\"}"},{"__ref":"Education:{\"uuid\":\"817d3b3c-b985-4e67-9ef8-9f2963d326c6\"}"}],"hiredAt":"2025-01-09T09:40:29.636Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Physics","College Essay Writing","Economics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"anshul-zutshi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"857973db-d3f0-44ab-acb8-ecab0037f438\"}"}}},"_sentryTraceData":"2d4dac244e3c4630b85aba6cea89dfad-b3bd1bd990777b35-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2d4dac244e3c4630b85aba6cea89dfad,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query
