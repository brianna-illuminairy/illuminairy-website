xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4560dce7-a39b-4faf-8cd7-88da262ef930\"}":{"__typename":"Favorites","uuid":"4560dce7-a39b-4faf-8cd7-88da262ef930","photoUrl":"https://ucarecdn.com/8f393436-df04-48b9-8a0d-bdfd4f8ffb56/","title":"Simone Biles","type":"ATHLETE"},"Favorites:{\"uuid\":\"7d307a14-e83e-4e38-96e5-326573509082\"}":{"__typename":"Favorites","uuid":"7d307a14-e83e-4e38-96e5-326573509082","photoUrl":"https://ucarecdn.com/1f356655-4770-4011-98ac-131a03154812/","title":"Mariokart","type":"GAME"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4d496fe7-78d0-424e-9602-56d5cb8e46b3\"}":{"__typename":"DeepDives","uuid":"4d496fe7-78d0-424e-9602-56d5cb8e46b3","content":"\u003cp\u003eI hope that I create something, whether that be a medical device, tool, or develop research that will help improve the lives of those facing complex diseases. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"05575531-7bcd-4fc1-80d8-0bab1a809a4a\"}":{"__typename":"DeepDives","uuid":"05575531-7bcd-4fc1-80d8-0bab1a809a4a","content":"\u003cp\u003eIn high school, I created my own website using HTML and CSS!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"748f2d1a-eb32-422c-92ea-0e8c0e5d2a9d\"}":{"__typename":"DeepDives","uuid":"748f2d1a-eb32-422c-92ea-0e8c0e5d2a9d","content":"\u003cp\u003eI did ballet and tap dancing when I was younger for ten years!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"f1d07f94-be0c-4860-ad18-2b22362de303\"}":{"__typename":"DeepDives","uuid":"f1d07f94-be0c-4860-ad18-2b22362de303","content":"\u003cp\u003eWhen I was in high school, I was a very ambitious student who had a lot of passions and wanted to accomplish everything all at once. Of course, it is impossible to do \u003cstrong\u003eeverything\u003c/strong\u003e, but I was determined to try my best to!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"62f9fe82-bcd6-41a6-a9b3-179f0b1c5f84\"}":{"__typename":"School","uuid":"62f9fe82-bcd6-41a6-a9b3-179f0b1c5f84","name":"MOT Charter High School","city":"Middletown","type":"HIGH","state":"Delaware","country":"United States","zip":"19709"},"Education:{\"uuid\":\"a97f53e4-d0e6-4369-a6f1-8676c0b1a733\"}":{"__typename":"Education","uuid":"a97f53e4-d0e6-4369-a6f1-8676c0b1a733","school":{"__ref":"School:{\"uuid\":\"62f9fe82-bcd6-41a6-a9b3-179f0b1c5f84\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"77954e87-47b3-401c-b907-60514e14993a\"}":{"__typename":"Education","uuid":"77954e87-47b3-401c-b907-60514e14993a","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"db71c813-9b5c-49dd-a0a1-c271067d4fbd\"}":{"__typename":"MentorPublicProfile","uuid":"db71c813-9b5c-49dd-a0a1-c271067d4fbd","displayName":"Leila A.","slug":"leila-abdallahi","biography":"\u003cp\u003eHi! My name is Leila, and I am currently a junior at Cornell University studying Biological Sciences on the pre-med track. I grew up in Dover, Delaware, where I spent most of my childhood developing a deep curiosity about how the human body works and how science and math can be used to improve people’s lives. From an early age, I knew I wanted to pursue a career in medicine. I was especially fascinated not just by patient care, but by the tools, technologies, and problem-solving that make modern healthcare possible.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring high school, I majored in engineering and biotechnology, where I was introduced to biomedical engineering. This allowed me to combine my interest in medicine with my growing passion for engineering. I gained hands-on experience with project management, computer-aided design (CAD), and 3D printing, which strengthened my ability to think critically and design solutions. For my senior capstone project, I used a brain-computer interface device to study how different types of music could improve sleep quality for individuals with sleep disorders such as insomnia. Experiences like this sparked my interest in how innovation and technology can transform patient care and inspired me to continue exploring this field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Cornell, I have continued to build on these interests by joining an engineering project team that designs and develops medical devices. I also work in a research lab where I am developing a device that allows us to study ovarian conditions through ultrasound in live mice. Through these experiences, I have learned how to identify real-world challenges in healthcare and think through practical, creative solutions, while also strengthening my ability to collaborate and communicate effectively.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I am very passionate about mentorship and education. I believe STEM can feel intimidating without the right support, and I want to help students build both confidence and curiosity. As a first-generation college student, I understand how difficult it can be to navigate school, college applications, and career paths on your own, which motivates me to be a supportive and approachable mentor. Outside of school, I enjoy listening to music, reading, and playing games on my Nintendo Switch!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThrough mentorship, I hope to help students not only succeed academically, but also explore their interests, build passion projects, and gain confidence in their abilities. Whether that means working through a difficult class, preparing for college, or working on a creative STEM project, I aim to provide guidance that is tailored to each student’s goals. I joined Curious Cardinals because I want to be the kind of mentor I wish I had growing up, and I would be honored to be part of your child’s journey!\u003c/p\u003e","teachingVideoPlaybackId":"MzomyZDM29D8AogJlLrAU638p8MTQQgqKEgQ3iEMluU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4560dce7-a39b-4faf-8cd7-88da262ef930\"}"},{"__ref":"Favorites:{\"uuid\":\"7d307a14-e83e-4e38-96e5-326573509082\"}"}],"causesSupported":[],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4d496fe7-78d0-424e-9602-56d5cb8e46b3\"}"},{"__ref
