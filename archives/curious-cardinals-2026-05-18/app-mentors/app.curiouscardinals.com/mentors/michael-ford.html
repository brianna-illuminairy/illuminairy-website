xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ac08e679-efd8-47c2-97bb-d5df77bde29d\"}":{"__typename":"Favorites","uuid":"ac08e679-efd8-47c2-97bb-d5df77bde29d","photoUrl":"https://ucarecdn.com/3d4d588e-7e0e-44cd-8773-a90667050eac/","title":"Dune","type":"BOOK"},"Favorites:{\"uuid\":\"ab12d3ae-155d-4a5b-aa42-f831751ff715\"}":{"__typename":"Favorites","uuid":"ab12d3ae-155d-4a5b-aa42-f831751ff715","photoUrl":"https://ucarecdn.com/3d4d588e-7e0e-44cd-8773-a90667050eac/","title":"Sid Meier's Civilization 6","type":"GAME"},"Favorites:{\"uuid\":\"0234b4e3-554e-4db9-a55d-88a964434882\"}":{"__typename":"Favorites","uuid":"0234b4e3-554e-4db9-a55d-88a964434882","photoUrl":"https://ucarecdn.com/3d4d588e-7e0e-44cd-8773-a90667050eac/","title":"The Lord of the Rings: The Return of the King","type":"MOVIE"},"CausesSupported:{\"uuid\":\"de75b757-08cf-4fc8-a844-b07137e43b6b\"}":{"__typename":"CausesSupported","uuid":"de75b757-08cf-4fc8-a844-b07137e43b6b","name":"Gamers Outreach ","description":"\u003cp\u003eUses video games to provide entertainment for hospitalized children\u003c/p\u003e","photoUrl":"https://ucarecdn.com/5e81883b-6299-4e14-a841-fab03bdc7aa7/"},"CausesSupported:{\"uuid\":\"1af5f893-5bf7-4cbc-a94b-f1aceec65f5b\"}":{"__typename":"CausesSupported","uuid":"1af5f893-5bf7-4cbc-a94b-f1aceec65f5b","name":"The Trevor Project","description":"\u003cp\u003eSuicide prevention and crisis intervention for LGBTQ+ youth\u003c/p\u003e","photoUrl":"https://ucarecdn.com/5d560172-8ca6-4b37-9360-753cb92ae282/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"cadd6ee2-e752-43dc-81dc-e30af340197b\"}":{"__typename":"DeepDives","uuid":"cadd6ee2-e752-43dc-81dc-e30af340197b","content":"\u003cp\u003eFor as long as I can remember, I've always loved the idea of interactive media! Providing a way for the audience to not only enjoy and appreciate media, but to influence and contribute to it with their own decisions, gives games an incredible ability to immerse audiences in their world and engage them in their stories. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"d39ff568-907a-4fd9-ac33-f4fd24aee5f2\"}":{"__typename":"DeepDives","uuid":"d39ff568-907a-4fd9-ac33-f4fd24aee5f2","content":"\u003cp\u003eWhen I think of my favorite games, books, or movies, they're the ones that I am able to not only enjoy, but actually draw from to inspire my own work, and my ultimate goal in all my work is to create something that inspires others to explore their own creativity and create things themselves. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"a10a1049-f860-4d46-9ef0-7473c38e2b72\"}":{"__typename":"DeepDives","uuid":"a10a1049-f860-4d46-9ef0-7473c38e2b72","content":"\u003cp\u003eI see mentorship as a way for me to inspire and empower others to pursue their own projects and explore their creativity. I want to not only help teach the skills and practices needed to pursue these projects, but to also provide the encouragement to do so!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"952c5c86-ecf0-4f44-bb2c-c771f262bbae\"}":{"__typename":"DeepDives","uuid":"952c5c86-ecf0-4f44-bb2c-c771f262bbae","content":"\u003cp\u003eAs a high school student, I was very excited about exploring new and different ways to teach and learn material. Our school had a Latin teacher who believed very strongly in teaching through interactive experiences, and I enjoyed helping him design and host events for the middle schoolers that were fun and whacky but also educational (like having them navigate an obstacle course while conjugating verbs) \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"dd11b422-c0a4-41c5-a658-ec42f1451082\"}":{"__typename":"School","uuid":"dd11b422-c0a4-41c5-a658-ec42f1451082","name":"BASIS Chandler","city":"Chandler","type":"HIGH","state":"Arizona","country":"USA","zip":"85248"},"Education:{\"uuid\":\"df3b4db6-24eb-46f4-8548-5fe3a08005ae\"}":{"__typename":"Education","uuid":"df3b4db6-24eb-46f4-8548-5fe3a08005ae","school":{"__ref":"School:{\"uuid\":\"dd11b422-c0a4-41c5-a658-ec42f1451082\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"287cf8d8-2af1-4092-80ee-33568275bdcd\"}":{"__typename":"Education","uuid":"287cf8d8-2af1-4092-80ee-33568275bdcd","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Interactive Media and Game Design","degree":null},"Testimonial:9c724d5e-f1b7-4a7f-8ebb-402f299cf483":{"__typename":"Testimonial","id":"9c724d5e-f1b7-4a7f-8ebb-402f299cf483","text":"Thank you, Michael, for being an incredible mentor! Your guidance and advice have been instrumental in my development as a game designer. I have had a lot of fun working with you and I am grateful for your mentorship.","date":"2025-06-05 16:28:26.878+00","rating":5,"endorser":{"__typename":"Endorser","name":"Siva Ridley","tagline":"","avatar":null}},"Testimonial:f224d3fe-79b0-4881-b22b-57a98aaac691":{"__typename":"Testimonial","id":"f224d3fe-79b0-4881-b22b-57a98aaac691","text":"Michael has been a guide, an encourager, and a true thought partner for our autistic son. I love hearing them at the end of the hall especially when my son get excited. Michael often laughs at him and is a genius at getting him back on track.  My son's confidence has grown so much in the year and a half they have worked together, and so has his excitement about learning. Michael creates a safe space. We're so grateful for the positive impact he's had not only on our son’s gaming and coding skills but also his focus and attention skills AND his self-belief and sense of purpose.\n\nMy son struggles to stay committed to anything and Curious Cardinals is the first program he's done consistenly for almost a year and a half! He recently reminded me of this. \n\nMichael has been such an important part of his journey!","date":"2025-05-26 18:36:45.018+00","rating":5,"endorser":{"__typename":"Endorser","name":"Adriane","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"2ae90c26-4b7a-45ff-b075-c0cdddda6b9c\"}":{"__typename":"MentorPublicProfile","uuid":"2ae90c26-4b7a-45ff-b075-c0cdddda6b9c","displayName":"Michael F.","slug":"michael-ford","biography":"\u003cp\u003eHowdy! I'm Mike! I grew up and went to High School in Phoenix, Arizona, and then moved to Los Angeles to study Interactive Media and Game Design at the University of Southern California. I graduated in May of 2023 with my Bachelor's Degree and a minor in Video Game Programming. \u003cbr\u003e\u003cbr\u003eIn high school, I was the President of my school's Tri-M Music Honors Society, a National Merit Semifinalist, AP Scholar, and founder of the school's Quidditch team!\u003cbr\u003e\u003cbr\u003eIn my free time, I like to both make and play all kinds of games, but if I had to pick, my current favorites would be Hearthstone, Hades, and Civilization 6! \u003c/p\u003e","teachingVideoPlaybackId":"YNq00kICPg1mt93omjLcxWStWm4xKEpYnjoyOybSJyX4","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement so far is \u003cem\u003eAmbush!, \u003c/em\u003ea card game that I designed, prototyped, created, crowdfunded and sold with a friend. I had so much fun coming up with all the different cards, playtesting the game over and over again to find and fix problems, and dressing up as a knight to take silly pictures and market the game on social media. I learned so much about game design and business and am so proud of the final product!\u003cbr\u003e\u003cbr\u003ehttps://www.thegamecrafter.com/games/ambush-first-edition-2021-\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ac08e679-efd8-47c2-97bb-d5df77bde29d\"}"},{"__ref":"Favorites:{\"uuid\":\"ab12d3ae-155d-4a5b-aa42-f831751ff715\"}"},{"__ref":"Favorites:{\"uuid\":\"0234b4e3-554e-4db9-a55d-88a964434882\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"de75b757-08cf-4fc8-a844-b07137e43b6b\"}"},{"__ref":"CausesSupported:{\"uuid\":\"1af5f893-5bf7-4cbc-a94b-f1aceec65f5b\"}"}],"major":"Interactive Media and Game Design","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cadd6ee2-e752-43dc-81dc-e30af340197b\"}"},{"__ref":"DeepDives:{\"uuid\":\"d39ff568-907a-4fd9-ac33-f4fd24aee5f2\"}"},{"__ref":"DeepDives:{\"uuid\":\"a10a1049-f860-4d46-9ef0-7473c38e2b72\"}"},{"__ref":"DeepDives:{\"uuid\":\"952c5c86-ecf0-4f44-bb
