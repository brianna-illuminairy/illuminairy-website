xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ee6b2366-feee-4d15-8e5d-5f20b23f884b\"}":{"__typename":"DeepDives","uuid":"ee6b2366-feee-4d15-8e5d-5f20b23f884b","content":"\u003cp\u003eBack in high school, my weaker subject was French class, particularly the kind focused on writing essays and literary analysis, similar to what English class looks like in other schools.\u0026nbsp; I had a tutor who helped me build the foundation I was missing, and that support made a huge difference. It gave me confidence in an area that used to feel overwhelming. At the same time, my school didn’t offer any exploratory or in-depth courses in engineering or physics, so I had to wait until college to really explore those subjects properly. That’s a big reason mentorship matters to me. I want to help students build strong foundations where they need support, but also give them the chance to explore beyond the basics and discover what subjects ,like mechanical engineering, might spark their curiosity.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"55882414-f769-4241-acf4-923fce45854e\"}":{"__typename":"DeepDives","uuid":"55882414-f769-4241-acf4-923fce45854e","content":"\u003cp\u003eI’d love to work on a project that has a real, positive impact on people’s daily lives. Something that improves health, accessibility, or quality of life in a tangible way. Through robotics, I think there’s huge potential to create tools and systems that help people live better, whether by supporting mobility, enabling care, or making technology more accessible to everyone. I hope to take the skills I’ve developed in robotics and engineering and apply them to something meaningful that can achieve this kind of impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f0ab3cb2-6ced-4bee-b3f4-4f17665ca9dc\"}":{"__typename":"DeepDives","uuid":"f0ab3cb2-6ced-4bee-b3f4-4f17665ca9dc","content":"\u003cp\u003eIn high school, I always enjoyed math and physics and loved problem solving, so I came into college curious about both computer science and mechanical engineering. I took classes in both early on, and while I found CS interesting, I was much more drawn to mechanical engineering. I loved the puzzle-solving aspect of it, figuring out how things fit together and actually building something from the ground up. The hands-on side of the major was a huge plus for me too. After taking the main introductory course, I knew this was what I wanted to pursue. It felt like the perfect mix of creativity, logic, and physical problem solving.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"3927bb66-e8a1-4bd8-b405-a15945df1e1b\"}":{"__typename":"DeepDives","uuid":"3927bb66-e8a1-4bd8-b405-a15945df1e1b","content":"\u003cp\u003eBoth of my parents are Lebanese, and I was born and raised in London, where I attended a French school. Growing up in this multicultural environment exposed me to a blend of languages, customs, and perspectives from an early age. I think it made me more open-minded, understanding, and adaptable. These are qualities I bring into my teaching. I feel comfortable connecting with students from different backgrounds and adjusting my style to meet them where they are.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"71f406bf-636e-4ca2-b6d4-3f5a71d09410\"}":{"__typename":"School","uuid":"71f406bf-636e-4ca2-b6d4-3f5a71d09410","name":"Lycée Français Charles de Gaulle de Londres","city":"London","type":"HIGH","state":"England","country":"United Kingdom","zip":"SW7 2DG"},"Education:{\"uuid\":\"b5ea6605-d69a-4758-b7fc-836bbb846b57\"}":{"__typename":"Education","uuid":"b5ea6605-d69a-4758-b7fc-836bbb846b57","school":{"__ref":"School:{\"uuid\":\"71f406bf-636e-4ca2-b6d4-3f5a71d09410\"}"},"startYear":"2013","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"8774eaa0-795c-417a-be39-5325bd319b0d\"}":{"__typename":"Education","uuid":"8774eaa0-795c-417a-be39-5325bd319b0d","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Mechanical Engineering ","degree":null},"MentorPublicProfile:{\"uuid\":\"c00e71f7-a8be-48f0-9287-109522d66311\"}":{"__typename":"MentorPublicProfile","uuid":"c00e71f7-a8be-48f0-9287-109522d66311","displayName":"Karim R.","slug":"karim-rishani","biography":"\u003cp\u003eHi! My name is Karim, and I'm a Master's student in Mechanical Engineering at Stanford University, focusing on robotics. I grew up in London and studied in the French school system before coming to California for college. I’ve always been curious about how things work, but I didn’t have access to engineering classes in school, which is part of what drives me to mentor now. I want to help students discover and enjoy engineering early, in a way that feels exciting, creative, and hands-on. I also enjoy helping students strengthen their foundations in math, and I’m happy to work with French-speaking students as well.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Stanford, I’ve worked on a variety of projects, from an autonomous robot that completes a parkour course to building a physical, interactive Fruit Ninja-style game. I love creating things and breaking down complex ideas into clear, engaging concepts. Completing these kinds of hands-on projects has been one of the most fulfilling parts of my own learning, and I’m excited to help students bring their own ideas to life in a similar way. Outside the classroom, I enjoy surfing, skating, photography, and anything that gets me near the seaside. I also used to enjoy playing PS4 with friends in my free time, though that’s a bit harder to keep up with these days.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy goal is to help students discover new interests and build confidence as they explore engineering, math, and physics, while enjoying the process of learning and creating. Whether we’re starting from the basics or diving into advanced topics or a passion project, I aim to make every session supportive, engaging, and fun.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"u2e9n00hn3p100eOOFNrTewiXxUWYCWldWLM01Qa9F01Hr4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ee6b2366-feee-4d15-8e5d-5f20b23f884b\"}"},{"__ref":"DeepDives:{\"uuid\":\"55882414-f769-4241-acf4-923fce45854e\"}"},{"__ref":"DeepDives:{\"uuid\":\"f0ab3cb2-6ced-4bee-b3f4-4f17665ca9dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"3927bb66-e8a1-4bd8-b405-a15945df1e1b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/02ec1330-8f66-43c1-b101-7a71b9cf4980/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b5ea6605-d69a-4758-b7fc-836bbb846b57\"}"},{"__ref":"Education:{\"uuid\":\"8774eaa0-795c-417a-be39-5325bd319b0d\"}"}],"hiredAt":"2025-04-30T23:12:49.392Z","topics":["Precalculus / Trigonometry","Calculus","Statistics","Geometry","Algebra I","Algebra II","Physics","French","Robotics / Electronics / CAD","STEM Project","Aviation / Aerospace"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"karim-rishani\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c00e71f7-a8be-48f0-9287-109522d66311\"}"}}},"_sentryTraceData":"131fb2d78e084f079ef8028d2e789a2b-920a117e6925113d-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=131fb2d78e084f079ef8028d2e789a2b,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"karim-rishani"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});
