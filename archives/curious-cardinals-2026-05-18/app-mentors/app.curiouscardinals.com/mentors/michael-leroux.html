1e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"6f900db6-0095-4d99-b311-b95b4cab334f\"}":{"__typename":"MentorPublicProfile","uuid":"6f900db6-0095-4d99-b311-b95b4cab334f","displayName":"Michael L.","slug":"michael-leroux","biography":"\u003cp\u003eHi! I’m Michael, a Columbia University student with a 3.9 GPA who loves maths, engineering, and figuring out how things work. I’ve always learned best by doing - experimenting, building, and testing ideas for myself. That mindset has shaped both how I approach school and how I explore projects outside the classroom. When I can actively use what I’m learning, it sticks, and that’s what’s helped me grow both academically and creatively.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI genuinely love teaching and mentoring students. I’ve worked as a one-on-one tutor in Maths and English, designing personalized lesson plans, adapting explanations to match different learning styles, and supporting neurodiverse learners so they can grow in both confidence and ability. I especially enjoy individual tutoring because it lets me understand how each student thinks and tailor sessions towards them. I’ve also taught maths at Coombe Boys’ School, where I supported GCSE students in both small-group and full-class settings, helping them work through challenging topics and feel more confident academically.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of tutoring and studying, I spend a lot of time working on engineering projects. Some of my past builds include a motion-activated mechanical dog door and an integrated produce management, ordering, and delivery system designed to be implemented for a packed lunch business idea my mum had. Right now, I’m developing an arcade-style version of the game Piano Tiles, combining programming, electronics, and design. I also studied advanced CAD and motion analysis at a Brown University summer program and completed a civil engineering internship where I tested soil and rock stability for reconstruction engineers, which gave me \u003c/p\u003e\u003cp\u003ereal-world experience applying technical skills.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also completed an entrepreneurship program at Tufts University where I developed and pitched a business idea to professionals. This will allow me to help students go beyond building projects, turning their ideas into real ventures. Engineering isn’t just about solving problems - it can also be about creating opportunities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside academics, I stay active through rugby and previously trained as a boxer which taught me discipline, resilience, and patience - qualities I bring into both my teaching and project work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I mentor because I enjoy helping students discover what they’re capable of. Whether I’m guiding someone through a maths problem or supporting them in building their own engineering project, my goal is always the same: to make learning engaging, empowering, and genuinely exciting.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"fiHQdT41r8cS02cjsfXRqhOvvOUsCW1fAwSDKEFBNl28","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a072e02e-f01f-43c8-a5b1-5b80a79a13d6\"}"},{"__ref":"Favorites:{\"uuid\":\"2c90ccc6-9096-40e0-a95f-b39ba3e4a25c\"}"},{"__ref":"Favorites:{\"uuid\":\"41cf3553-9f75-41cd-9e84-c838efa7d28c\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f2093f52-769f-4224-a9b0-578e4cf8261f\"}"},{"__ref":"DeepDives:{\"uuid\":\"41598e78-4030-490b-af31-9d67449e59ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"c3e02fcc-325a-4550-bd06-6a6eeafd7602\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb2f6e52-6f74-4e94-ba35-e86fcf4e40ee\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/aa
