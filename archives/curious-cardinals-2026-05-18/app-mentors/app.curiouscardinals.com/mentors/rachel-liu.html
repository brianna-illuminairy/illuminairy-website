xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"9383189f-7427-457e-8874-6165789a4520\"}":{"__typename":"DeepDives","uuid":"9383189f-7427-457e-8874-6165789a4520","content":"\u003cp\u003eThe only reason I've gotten where I am is because of the unwavering support of the mentors I've had in the past. I've been given so much, and I want to give back this privilege and opportunity because I know just how much a great mentor can push, inspire, and change a young mind.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"6fc522db-607c-4474-b162-0dabad8d341f\"}":{"__typename":"DeepDives","uuid":"6fc522db-607c-4474-b162-0dabad8d341f","content":"\u003cp\u003eEach summer in high school, I volunteered with a local Atlanta summer camp for under-resourced kids, called Odyssey. The children were loud and curious and simply hilarious, filling me with their boundless energy. I cleaned up their ketchup spills at lunch, pushed them on the swings at recess, and clapped when they showed me their newest science experiments. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"9643f1f8-2fad-4da8-bd7c-de6bc1085ee3\"}":{"__typename":"Education","uuid":"9643f1f8-2fad-4da8-bd7c-de6bc1085ee3","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"computer science","degree":"bachelor's of science"},"School:{\"uuid\":\"4a609567-9e8b-4dd2-a4da-4ee9aca5a179\"}":{"__typename":"School","uuid":"4a609567-9e8b-4dd2-a4da-4ee9aca5a179","name":"The Westminster Schools","city":"Atlanta","type":"HIGH","state":"Georgia","country":"United States","zip":"30327"},"Education:{\"uuid\":\"994354d9-18af-4eaf-98e8-a701c216f484\"}":{"__typename":"Education","uuid":"994354d9-18af-4eaf-98e8-a701c216f484","school":{"__ref":"School:{\"uuid\":\"4a609567-9e8b-4dd2-a4da-4ee9aca5a179\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"7f74ea2f-975b-46ba-bcef-27ef4321040f\"}":{"__typename":"MentorPublicProfile","uuid":"7f74ea2f-975b-46ba-bcef-27ef4321040f","displayName":"Rachel L.","slug":"rachel-liu","biography":"Rachel is a sophomore at Stanford studying Computer Science, with a double minor in Arts Practice and Creative Nonfiction Writing. She loves the logical aspect of her coding classes, but balances that out by channeling her creative side into painting, reading, or writing. For her work in memoir writing, she’s won several Scholastic Gold Keys, and her artwork is being displayed at the Capitol as the first place winner of the Congressional Arts Award. Aside from her academic and creative pursuits, Rachel is the Recruitment Director of Stanford’s entrepreneurship club ASES, as well as a consultant for Stanford Marketing Group. She’s also tutor for Habla, where she teaches English to some of Stanford’s housing and dining staff members who only speak Spanish. In high school, her passion for teaching and community service led her to commit over 1,100 hours to working with students. At various under-resourced schools around her home in Atlanta, she organized volunteers and taught classes to elementary schoolers in various subjects, ranging from health/wellness to art to scientific experiments. In her free time, she enjoys running on the cross-country team, going to art museums, and trying new foods with her friends! Rachel is super excited to work with the students at Curious Cardinals and spread her passion for service, arts, and computer science!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"computer science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9383189f-7427-457e-8874-6165789a4520\"}"},{"__ref":"DeepDives:{\"uuid\":\"6fc522db-607c-4474-b162-0dabad8d341f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e2caf52e-8c45-457d-8421-25cbe802ab8a/-/crop/447x447/116,243/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9643f1f8-2fad-4da8-bd7c-de6bc1085ee3\"}"},{"__ref":"Education:{\"uuid\":\"994354d9-18af-4eaf-98e8-a701c216f484\"}"}],"hiredAt":"2022-11-15T00:16:52.000Z","topics":["Visual Arts / Graphic Design","Geometry","Reading","6-8 Grade Science","Coding / Programming","Pre-Algebra","Computer Science","History Project","Algebra I","College Essay Writing","K-5 Grade Math","Precalculus / Trigonometry","Calculus","Algebra II","Writing","Video / Photography"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"rachel-liu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7f74ea2f-975b-46ba-bcef-27ef4321040f\"}"}}},"_sentryTraceData":"b62190552f964221b06f29aec67eabe3-bdfe1d867fe66104-0","_sentryBaggage":"sentry-environment=vercel-
