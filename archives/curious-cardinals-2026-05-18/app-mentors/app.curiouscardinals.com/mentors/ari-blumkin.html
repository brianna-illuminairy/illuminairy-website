xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"527e32bf-cd86-414c-9104-43a0cbb1e9a4\"}":{"__typename":"Favorites","uuid":"527e32bf-cd86-414c-9104-43a0cbb1e9a4","photoUrl":"https://ucarecdn.com/95ff0a7e-e4fe-49fc-b6e9-7463fc93eb67/","title":"Amsterdam, Netherlands","type":"CITY"},"Favorites:{\"uuid\":\"062c34fa-74c1-477d-9566-1fccf4816b91\"}":{"__typename":"Favorites","uuid":"062c34fa-74c1-477d-9566-1fccf4816b91","photoUrl":"https://ucarecdn.com/95ff0a7e-e4fe-49fc-b6e9-7463fc93eb67/","title":"A Tribe Called Quest","type":"ARTIST"},"Favorites:{\"uuid\":\"4cc23c2a-48e8-4902-b128-2a589caa9671\"}":{"__typename":"Favorites","uuid":"4cc23c2a-48e8-4902-b128-2a589caa9671","photoUrl":"https://ucarecdn.com/95ff0a7e-e4fe-49fc-b6e9-7463fc93eb67/","title":"Siddhartha - Hermann Hesse","type":"BOOK"},"CausesSupported:{\"uuid\":\"7e31e99d-59b9-4431-8586-91fda793b108\"}":{"__typename":"CausesSupported","uuid":"7e31e99d-59b9-4431-8586-91fda793b108","name":"Friends of Kids With Cancer","description":"\u003cp\u003ePresident of the LINUS Foundation, fundraising through galas and campus events.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/7735be27-e536-42ca-b44f-43ba358b14cd/"},"CausesSupported:{\"uuid\":\"042cc823-f6f7-4e3c-9e5e-fe755729d7c6\"}":{"__typename":"CausesSupported","uuid":"042cc823-f6f7-4e3c-9e5e-fe755729d7c6","name":"Operation Food Search","description":"\u003cp\u003eWorked as a Team Lead/Strategy Consultant to revamp data collection methodology.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/f043eb0d-7952-4625-baf5-00b7a974c9d5/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"bcfb62c9-fb25-4a12-8cde-1c2f459a5e0e\"}":{"__typename":"DeepDives","uuid":"bcfb62c9-fb25-4a12-8cde-1c2f459a5e0e","content":"\u003cp\u003eMy dream job is to be working for a fintech and/or sustainable energy startup in a legal counsel role. Ideally, I want to pursue a role that allows me to travel the world and meet people from all backgrounds while continuing to push my comfort zone every single day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5a072941-0a5e-4d3c-8bdf-8c5fa6aa5cf9\"}":{"__typename":"DeepDives","uuid":"5a072941-0a5e-4d3c-8bdf-8c5fa6aa5cf9","content":"\u003cp\u003eIf I could tell my younger self one thing, it would be to stop putting so much pressure on myself. At this point in my personal and professional life, I understand that great things come to those who are patient, disciplined, and grateful. I truly believe that these three attributes, paired with a strong support system, create more 'diamonds' than pressure ever could.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"ec57d8fd-9e23-49c6-9eeb-bd5cbad8c6d2\"}":{"__typename":"DeepDives","uuid":"ec57d8fd-9e23-49c6-9eeb-bd5cbad8c6d2","content":"\u003cp\u003eWithout a doubt, my greatest role model and mentor is my mom. At the age of 17, she emigrated to the United States (on her own!) as a religious refugee from the former Soviet Union. With no resources other than her baseline English skills, she went on to earn BA, JD, and MPA degrees. In the process, she supported her family in their emigration process, giving them a new life and a place to call home in the United States. Her story of hard work and resilience inspires me to be a better version of myself every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"2527d472-571b-4a6c-89bd-b925b478712c\"}":{"__typename":"DeepDives","uuid":"2527d472-571b-4a6c-89bd-b925b478712c","content":"\u003cp\u003eSomething about me that isn't immediately obvious is that I played saxophone for eight years of my life. Throughout my childhood and young adult years, I was a member of several orchestras and jazz bands. In the process, I played with and learned from some of the most talented individuals I have ever met.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"965b72c5-044e-4763-8211-b693d0cdb652\"}":{"__typename":"School","uuid":"965b72c5-044e-4763-8211-b693d0cdb652","name":"Newton North High School","city":"Newton","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02460"},"Education:{\"uuid\":\"cf5f9e65-a5a5-4c12-bcc8-9b0f5338c327\"}":{"__typename":"Education","uuid":"cf5f9e65-a5a5-4c12-bcc8-9b0f5338c327","school":{"__ref":"School:{\"uuid\":\"965b72c5-044e-4763-8211-b693d0cdb652\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"e60e8e72-564f-49fb-802e-a710f62118c8\"}":{"__typename":"Education","uuid":"e60e8e72-564f-49fb-802e-a710f62118c8","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Economics \u0026 Strategy","degree":null},"MentorPublicProfile:{\"uuid\":\"6d776647-7650-4242-bb3f-a8d09580ab4d\"}":{"__typename":"MentorPublicProfile","uuid":"6d776647-7650-4242-bb3f-a8d09580ab4d","displayName":"Ari B.","slug":"ari-blumkin","biography":"\u003cp\u003eAri is a senior at Washington University in St. Louis studying Economics \u0026amp; Strategy with minors in Philosophy and Business Analytics. He is a first-generation American and is proficient in both Russian and Spanish.\u003cbr\u003e\u003cbr\u003eOriginally from Newton, MA (just outside Boston), Ari grew up as a passionate New England sports fan. He spent his summers sailing on Cape Cod and his winters skiing/snowboarding in New Hampshire and Maine.\u003cbr\u003e\u003cbr\u003eOn campus, Ari is deeply involved in the Center for Experiential Learning (CEL), where he has worked as a Strategy Consultant for non-profits and small businesses in the St. Louis community. He returned to the CEL this year as a CEL Scholar, overseeing client relationships and consulting projects for over 30 students. Ari is also a member of TAMID @ WashU, where he was selected as a Project Manager for a Series C retail-tech startup in Israel.\u003cbr\u003e\u003cbr\u003eOutside of school, Ari is Co-President of the LINUS Foundation, raising money for local charitable organizations through galas and student events.\u003cbr\u003e\u003cbr\u003eThis past summer, Ari worked as a Private Equity Summer Analyst in New York City. His sophomore summer, Ari was a Securities Finance Summer Analyst in Boston. His freshman year, Ari interned at Boston University as a Financial Literacy and Research Assistant.\u003cbr\u003e\u003cbr\u003eIn his free time, Ari enjoys spending quality time with his family and friends (and dog!), reading philosophy/literature, playing pickup basketball, and listening to good music. He recently picked up DJ-ing with his younger brother and now has a great affinity for house music.\u003cbr\u003e\u003cbr\u003eAri is incredibly excited to be joining the Curious Cardinals team as a Mentor!\u003c/p\u003e","teachingVideoPlaybackId":"9X5JTCGSPModTOPk7QVmAGenCGbBrCnv5d4aLPr6ua8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eIn my senior year of high school, my Spanish teacher nominated me to represent my school in the National Spanish Exam and the Spanish Seal of Biliteracy test. \u003cbr\u003e\u003cbr\u003eAlthough I had performed well in the course, I was not confident that my reading/speaking skills were nearly at the level necessary to sit for these exams. Nevertheless, my professor was confident that I had the ability and work ethic to pass both of the tests. \u003cbr\u003e\u003cbr\u003eGrowing up speaking both English and Russian with my family, I always had a love for language as the purest form of connection with others. I realized that my experience with Spanish was no different, and I dedicated myself to proving my teacher right. \u003cbr\u003e\u003cbr\u003eAfter weeks of preparation, I earned a Silver Medal on the National Spanish Exam and achieved Spanish Biliteracy. This experience showed me that sometimes, all it takes is the support of a trusted mentor to instill confidence and help you recognize your full potential.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"527e32bf-cd86-414c-9104-43a0cbb1e9a4\"}"},{"__ref":"Favorites:{\"uuid\":\"062c34fa-74c1-477d-9566-1fccf4816b91\"}"},{"__ref":"Favorites:{\"uuid\":\"4cc23c2a-48e8-4902-b128-2a589caa9671\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"7e31e99d-59b9-4431-8586-91fda793b108\"}"},{"__ref":"CausesSupported:{\"uuid\":\"042cc823-f6f7-4e3c-9e5e-fe755729d7c6\"}"}],"major":"Economics \u0026 Strategy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"bcfb62c9-fb25-4a12-8cde-1c2f459a5e0e\"}"},{"__ref":"DeepDives:{\"uuid\":\"5a072941-0a5e-4d3c-8bdf-8c5fa6aa5cf9\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec57d8fd-9e23-49c6-9eeb-bd5cbad8c6d2\"}"},{"__ref":"DeepDives:{\"uuid\":\"2527d472-571b-4a6c-89bd-b925b478712c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7cdf9cb0-bcad-4142-a3da-2234cf1405ce/-/preview/-/format/jpg/","https://ucarecdn.com/1ab18c1a-8d17-44be-925d-73f2fb63ce1d/-/preview/-/format/jpg/","https://ucarecdn.com/26e1691f-68f0-4b30-87df-39c85b70e0c3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cf5f9e65-a5a5-4c12-bcc8-9b0f5338c327\"}"},{"__ref":"Education:{\"uuid\":\"e60e8e72-564f-49fb-802e-a710f62118c8\"}"}],"hiredAt":"2023-09-22T15:59:21.381Z","topics":["Finance / Investing","Business / Entrepreneurship","Economics","Sports Analytics","Philosophy","Music","Sustainability","World Cultures","Academic Coaching","Executive Function","College Essay Writing","Reading","Public Speaking","Journalism"],"communityBadges":["https://ucarecdn.com/09da5bb5-3efa-4fae-89ff-19db3c27efba/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ari-blumkin\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"6d776647-7650-4242-bb3f-a8d09580ab4d\"}"}}},"_sentryTraceData":"8a7babef735d4ecda5979ea85b1603c7-88f4fd273bd70268-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8a7babef735d4ecda5979ea85b1603c7,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ari-blumkin"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-
