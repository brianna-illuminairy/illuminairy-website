xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f4c2698e-f980-4f1b-a233-78b6d34c6b89\"}":{"__typename":"Favorites","uuid":"f4c2698e-f980-4f1b-a233-78b6d34c6b89","photoUrl":"https://ucarecdn.com/d439fa76-568f-466d-a603-cc4f50dc672b/","title":"USB - fred again..","type":"ALBUM"},"Favorites:{\"uuid\":\"3f0b9b63-6587-4da0-9063-1c8473a7605c\"}":{"__typename":"Favorites","uuid":"3f0b9b63-6587-4da0-9063-1c8473a7605c","photoUrl":"https://ucarecdn.com/8db15ba5-b215-4bcf-bbea-7b8c616d9e16/","title":"End of Summer - Tame Impala","type":"SONG"},"Favorites:{\"uuid\":\"2ece3405-6ec6-471a-92db-42e71fd1bee9\"}":{"__typename":"Favorites","uuid":"2ece3405-6ec6-471a-92db-42e71fd1bee9","photoUrl":"https://ucarecdn.com/e8f3558d-34bd-49f9-9b8f-2da6eb63a9ff/","title":"Ohio State Football","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a70aec0a-abae-4413-afdb-cc1197c68303\"}":{"__typename":"DeepDives","uuid":"a70aec0a-abae-4413-afdb-cc1197c68303","content":"\u003cp\u003eDon't be ashamed to try everything! You don't need to have an exact plan for your entire life, and the only way you know that you like something is just to try it. Everything will eventually work out if you give it a chance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"5dbba6fc-15b4-48d5-b441-e66e3de3e246\"}":{"__typename":"DeepDives","uuid":"5dbba6fc-15b4-48d5-b441-e66e3de3e246","content":"\u003cp\u003eGetting into Northwestern! I could not have imagined getting into my dream school if it were not for the support of my mentors and peers around me\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"902e11b3-df32-4c4e-ad04-575b26a07112\"}":{"__typename":"DeepDives","uuid":"902e11b3-df32-4c4e-ad04-575b26a07112","content":"\u003cp\u003eI want to travel to all of the countries in the world. If I am being realistic, however, I would want to go to all seven continents (including Antarctica)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"27fa67dd-1e1b-4f25-8f1c-89a462620c7e\"}":{"__typename":"DeepDives","uuid":"27fa67dd-1e1b-4f25-8f1c-89a462620c7e","content":"\u003cp\u003eI would take a couple of classes at Ohio State to keep my brain stimulated and get ahead in my high school coursework. I participated in medical/healthcare related programs around the area. I also ran competitive outdoor track summer league on a team. Beyond that, I would spend the time with my friends outdoors a lot!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"51b4dc32-64bb-448b-9a5b-c07ddf3f6222\"}":{"__typename":"School","uuid":"51b4dc32-64bb-448b-9a5b-c07ddf3f6222","name":"Olentangy High School","city":"Lewis Center","type":"HIGH","state":"Ohio","country":"United States","zip":"43035"},"Education:{\"uuid\":\"7822bb1d-35a2-4d2c-9ed2-fe4ceb4b55b1\"}":{"__typename":"Education","uuid":"7822bb1d-35a2-4d2c-9ed2-fe4ceb4b55b1","school":{"__ref":"School:{\"uuid\":\"51b4dc32-64bb-448b-9a5b-c07ddf3f6222\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"0c1d560c-5af7-4a45-b305-5a0ac4085e0b\"}":{"__typename":"Education","uuid":"0c1d560c-5af7-4a45-b305-5a0ac4085e0b","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biomedical Engineering (BS/MS)","degree":null},"MentorPublicProfile:{\"uuid\":\"847fdc00-4efc-4ea6-8fa6-6db237fe35f4\"}":{"__typename":"MentorPublicProfile","uuid":"847fdc00-4efc-4ea6-8fa6-6db237fe35f4","displayName":"Michael K.","slug":"michael-kim","biography":"\u003cp\u003e\u003cstrong\u003eHi! I’m Michael\u003c/strong\u003e, a Biomedical Engineering BS/MS student with interests in STEM, healthcare, and business. I work with \u003cstrong\u003emiddle and high school students\u003c/strong\u003e to help them explore their interests, build confidence, and create projects they’re proud of.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eIn high school, I was especially interested in biology and healthcare, but I didn’t fully understand how many paths existed beyond the traditional ones. I knew I wanted to work in healthcare, but I hadn’t yet discovered how science could connect with engineering, research, and business.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, I began exploring those intersections through engineering coursework, research, clinical exposure, and leadership experiences:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBiomedical engineering capstone project\u003c/strong\u003e, developing a method and device to quantify aspiration in pediatric patients for a pulmonologist client\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eMichael Jaharis Undergraduate Research Fellow (2023 \u0026amp; 2025)\u003c/strong\u003e, supporting independent undergraduate research\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eAward-recognized research\u003c/strong\u003e, including \u003cstrong\u003e3rd place in the Natural Sciences category\u003c/strong\u003e at the Northwestern University Undergraduate Research Expo\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHands-on research experience\u003c/strong\u003e, designing projects, analyzing results, and presenting findings\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eInvolvement in physical therapy settings\u003c/strong\u003e, gaining firsthand exposure to patient care and rehabilitation\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBusiness fraternity leadership\u003c/strong\u003e, where I helped pilot a healthcare-focused business sector\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eThese experiences showed me that meaningful impact often comes from combining biology, engineering, and clear thinking. I enjoy helping students explore those connections for themselves.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003eHow I can help you\u003c/h2\u003e\u003cp\u003eI specialize in guiding \u003cstrong\u003emiddle and high school students\u003c/strong\u003e through:\u003c/p\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCollege-readiness projects\u003c/strong\u003e, including research experiences, science fair projects, competitions, and presentations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects\u003c/strong\u003e, such as starting a club or designing a STEM or healthcare-related project\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eResearch mentorship\u003c/strong\u003e, learning how to ask good questions, design a project, analyze results, and present findings with confidence\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSTEM subject support\u003c/strong\u003e, especially in biology, chemistry, math, and introductory engineering concepts\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eStudy skills \u0026amp; organization\u003c/strong\u003e, including time management, exam preparation, and handling demanding coursework\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eExploring healthcare, engineering, and business paths\u003c/strong\u003e, and understanding how different interests can fit together\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eWhy I’m qualified to help\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eThrough competitive research fellowships, award-recognized projects, and hands-on healthcare experience, I’ve guided students through complex material and long-term projects. I’ve also worked as an \u003cstrong\u003eacademic mentor through a local foundation\u003c/strong\u003e and at \u003cstrong\u003eKumon\u003c/strong\u003e, supporting students across different ages and learning styles. I bring clear communication, patience, and a structured, supportive approach to every session.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eA typical session with me might involve\u003c/strong\u003e\u003c/h2\u003e\u003cbr\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming project ideas based on a student’s interests and goals\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating a clear, step-by-step plan so progress feels manageable\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down challenging concepts into simple, understandable pieces\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWorking through problems together to build confidence and independence\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePreparing for presentations, projects, or assessments with structured feedback\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eOutside of school and work\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI enjoy lifting, running, trying new restaurants, listening to new music, watching Ohio State football, and playing Fortnite with friends. I like staying active and balancing busy weeks with things that help me unwind and reset.\u003c/p\u003e","teachingVideoPlaybackId":"00kt02PZqfFOMDPa56uwf3MLmTZwcXRZBAg02va02NK5qPM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGetting into Northwestern!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd being an All-State Orchestra Violinist\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f4c2698e-f980-4f1b-a233-78b6d34c6b89\"}"},{"__ref":"Favorites:{\"uuid\":\"3f0b9b63-6587-4da0-9063-1c8473a7605c\"}"},{"__ref":"Favorites:{\"uuid\":\"2ece3405-6ec6-471a-92db-42e71fd1bee9\"}"}],"causesSupported":[],"major":"Biomedical Engineering (BS/MS)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a70aec0a-abae-4413-afdb-cc1197c68303\"}"},{"__ref":"DeepDives:{\"uuid\":\"5dbba6fc-15b4-48d5-b441-e66e3de3e246\"}"},{"__ref":"DeepDives:{\"uuid\":\"902e11b3-df32-4c4e-ad04-575b26a07112\"}"},{"__ref":"DeepDives:{\"uuid\":\"27fa67dd-1e1b-4f25-8f1c-8
