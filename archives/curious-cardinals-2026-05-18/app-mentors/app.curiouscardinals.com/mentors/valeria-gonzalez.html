 “Just A Thought,” a book featuring teen experiences with mental health and collaborated on a national campaign to “Stop the Stigma” surrounding mental illness. \nSince high school, Valeria has taken her leadership far beyond the classroom. Within her first month at Stanford, Valeria walked onto the Stanford Men’s Rowing team to be a coxswain. This past summer, she interned at Alliance for Safety and Justice, a nonprofit organization that works to create criminal justice reform through giving crime survivors agency in community healing and shaping public safety policy. In her free time, Valeria enjoys kickboxing, chasing sunrises and sunsets, and learning from her mom who is a pastry chef. Valeria looks forward to working with students to delve deeper into their interests through writing. ","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":null,"deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/bb2cb797-fb0a-4db0-a9be-aff71b0e79dc/-/crop/714x713/12,0/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"f73eecfc-a8ce-4003-b194-47b0a8c62c68\"}"}],"hiredAt":"2021-10-04T04:00:19.000Z","topics":["Women \u0026 Gender Studies","Film / Theater","Journalism","Writing","Philosophy","Business / Entrepreneurship","Race \u0026 Ethnicity","Law / Government / Policy","Creative Writing","Public Speaking","Spanish"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"valeria-gonzalez\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"044dfcb0-55d9-4907-b1b1-ae4a44895389\"}"}}},"_sentryTraceData":"61e8139a3e9b46a1ab6f498e2896eef9-a9f3e8842040c55a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cd
