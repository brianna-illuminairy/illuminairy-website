xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"37f6c8df-acc6-4d42-ac9a-d8da90ba7f49\"}":{"__typename":"Favorites","uuid":"37f6c8df-acc6-4d42-ac9a-d8da90ba7f49","photoUrl":"https://ucarecdn.com/787eebdc-86a7-4405-84b2-8afa0a837e77/","title":"Little Women","type":"MOVIE"},"Favorites:{\"uuid\":\"04bed588-6eed-41c0-ba03-17e8a2a6765b\"}":{"__typename":"Favorites","uuid":"04bed588-6eed-41c0-ba03-17e8a2a6765b","photoUrl":"https://ucarecdn.com/787eebdc-86a7-4405-84b2-8afa0a837e77/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"8abacba2-b026-432c-8207-407cf0a19fb1\"}":{"__typename":"Favorites","uuid":"8abacba2-b026-432c-8207-407cf0a19fb1","photoUrl":"https://ucarecdn.com/787eebdc-86a7-4405-84b2-8afa0a837e77/","title":"Firefly Lane by Kristin Hannah","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"069c0449-66c4-40c5-9ead-9a26ea9b8ef3\"}":{"__typename":"DeepDives","uuid":"069c0449-66c4-40c5-9ead-9a26ea9b8ef3","content":"\u003cp\u003eI chose to major in Management Science and Engineering because I got to explore with purpose. By tailoring my course plan towards career interests in business and towards skillsets I wanted to strengthen, I developed well-rounded problem solving methods! A wonderful surprise from MS\u0026amp;E has been my professors whose radiant energy is not only inspiring, but also motivating.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a8ba5a95-0df9-4f9c-98a5-8f889c1c8d4f\"}":{"__typename":"DeepDives","uuid":"a8ba5a95-0df9-4f9c-98a5-8f889c1c8d4f","content":"\u003cp\u003eI would tell my middle or high school self that everyone has their own pace at which they learn a subject and it's okay if it takes you a little more time than your peers. Do not be hesitant about asking questions and walk others through your thinking process. Staying positive and being your own cheerleader is important to mastering new topics!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f1171ee4-cce3-4065-8cda-305feb33c8b5\"}":{"__typename":"DeepDives","uuid":"f1171ee4-cce3-4065-8cda-305feb33c8b5","content":"\u003cp\u003e\u003cbr\u003eDuring high school, I spent my summers volunteering at a local hospital in the NICU, tutoring students at Kumon on math, fundraising for a non-profit focused on empowering students in need with resources, and traveling. During the lockdown summer, I learned how to play a new instrument, taught my younger sibling soccer, tried new baking/cooking recipes, and read over 50 books.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"15fe1402-5052-443e-9a39-5a1aec44bdc3\"}":{"__typename":"School","uuid":"15fe1402-5052-443e-9a39-5a1aec44bdc3","name":"Peak to Peak Charter School","city":"Lafayette","type":"HIGH","state":"Colorado","country":"United States","zip":"80026"},"Education:{\"uuid\":\"948f4cc3-e827-4188-a12f-6d26a38e9110\"}":{"__typename":"Education","uuid":"948f4cc3-e827-4188-a12f-6d26a38e9110","school":{"__ref":"School:{\"uuid\":\"15fe1402-5052-443e-9a39-5a1aec44bdc3\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"16b0f976-36d4-489e-84f8-05a13527198c\"}":{"__typename":"Education","uuid":"16b0f976-36d4-489e-84f8-05a13527198c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Management Science \u0026 Engineering","degree":"Bachelor of Science"},"MentorPublicProfile:{\"uuid\":\"b657496d-4a73-487e-8895-c1497302e21a\"}":{"__typename":"MentorPublicProfile","uuid":"b657496d-4a73-487e-8895-c1497302e21a","displayName":"Sweta K.","slug":"sweta-karki","biography":"\u003cp\u003eSweta Karki is a recent graduate of Stanford University where she earned her degree in Management Science \u0026amp; Engineering, an interdisciplinary program that combines mathematics, computer science, economics, and entrepreneurship. Her academic foundation reflects both analytical rigor and creative problem-solving which she brings into her teaching and mentoring style.\u003c/p\u003e\u003cp\u003eSweta is fluent in English and Nepali, and also studied Spanish for over six years, earning a Seal of Biliteracy. Her passion for language learning sparked her tutoring journey during her sophomore year of high school, when she began helping peers in Spanish. She quickly discovered that she enjoyed creating personalized study sessions tailored to individual learning styles whether that meant designing practice activities, reinforcing grammar concepts, or encouraging conversational fluency.\u003c/p\u003e\u003cp\u003eAt Stanford, Sweta continued to expand her leadership and mentorship skills. She served on the board of Stanford Women in Finance, where she organized weekly workshops to prepare members for recruitment and to introduce them to key concepts in the finance industry. She studied abroad at Oxford University, where she completed a tutorial in Financial Economics with a PhD mentor. This immersive experience deepened her curiosity and sharpened her learning approach. Engaging in one-on-one discussions, reflecting on assignments, and asking targeted questions showed her how powerful direct, personalized learning could be, something she now strives to replicate in her own tutoring.\u003c/p\u003e\u003cp\u003eSweta is particularly interested in how different education systems prepare students for higher education and the workforce. This perspective shapes her belief that strong mentorship goes beyond academic skills; it’s about helping students build confidence, curiosity, and a lifelong toolkit for success. She hopes to empower her mentees to feel confident about the content and approach learning with motivation and resilience.\u003c/p\u003e\u003cp\u003eAs a mentor and tutor, Sweta values kindness, patience, and clear communication. She creates a supportive environment where students feel comfortable engaging with new material, asking questions, and exploring their interests. Beyond academics, she loves learning new skills herself, from playing pickleball to studying the strategies behind chess, and she brings that same spirit of exploration into her work with students.\u003c/p\u003e\u003cp\u003eWith her interdisciplinary background, global perspective, and genuine enthusiasm for learning, Sweta is committed to helping students thrive both inside and outside the classroom.\u003c/p\u003e\u003cp\u003eSweta is an adaptable and attentive mentor who takes the time to understand each student, encouraging them to grow in ways that feel meaningful. She encourages students to break down challenges into smaller, manageable steps and celebrates progress along the way.\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"37f6c8df-acc6-4d42-ac9a-d8da90ba7f49\"}"},{"__ref":"Favorites:{\"uuid\":\"04bed588-6eed-41c0-ba03-17e8a2a6765b\"}"},{"__ref":"Favorites:{\"uuid\":\"8abacba2-b026-432c-8207-407cf0a19fb1\"}"}],"causesSupported":[],"major":"Management Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"069c0449-66c4-40c5-9ead-9a26ea9b8ef3\"}"},{"__ref":"DeepDives:{\"uuid\":\"a8ba5a95-0df9-4f9c-98a5-8f889c1c8d4f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f1171ee4-cce3-4065-8cda-305feb33c8b5\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/df23c710-5a5e-49a3-bc9f-aabc8b08bd87/-/preview/-/format/jpg/","https://ucarecdn.com/e9a54689-9951-4db0-b74e-8eb9757359bc/-/preview/-/format/jpg/","https://ucarecdn.com/8115509f-ed31-463d-b29f-a06926310d2d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"948f4cc3-e827-4188-a12f-6d26a38e9110\"}"},{"__ref":"Education:{\"uuid\":\"16b0f976-36d4-489e-84f8-05a13527198c\"}"}],"hiredAt":"2023-09-17T12:06:12.986Z","topics":["Literature","K-5 Grade Math","Cooking","Spanish","Pre-Algebra","Writing","Music","Algebra I","Business / Entrepreneurship","Finance / Investing","Sustainability","College Essay Writing","Academic Coaching"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sweta-karki\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b657496d-4a73-487e-8895-c1497302e21a\"}"}}},"_sentryTraceData":"0cd75e1f62d8458fa5eb3c76ebe6c9b0-9a9db15ff60053e2-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_ke
