xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"690e5964-ef50-4883-8cde-1af6cac40228\"}":{"__typename":"DeepDives","uuid":"690e5964-ef50-4883-8cde-1af6cac40228","content":"\u003cp\u003eI started my college career at Wesleyan University, a small liberal arts school in Connecticut. And while Wesleyan is a great institution, I could tell right away that it was not the right fit for me. I knew that I could make it work for four years, but did I really want my college experience to be about \"making it work?\"\u003cbr\u003e\u003cbr\u003eThen COVID hit, and I was gifted unprecedented time to reflect. I decided to take a gap year and apply to transfer schools. During my gap year, I did an 87-day wilderness adventure (through NOLS if you are familiar with the program). This involved backpacking, skiing, whitewater canoeing, rock climbing, and wilderness medicine training. Midway through the course I got temporary access to my phone, and found out that I had been accepted to Northwestern. \u003cbr\u003e\u003cbr\u003eI've been at Northwestern for 2.5 years now, and am so happy here. I love being surrounded by more people, having access to Chicago, and have made friends that I know I will cherish for life. \u003cbr\u003e\u003cbr\u003eTransferring was a leap into the unknown, and it paid off in a big way. And as a mentor, I strive to make sure that my mentees are in a learning environment that is conducive to their thriving. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7008a5ec-3319-42e4-80ed-707d6090e94e\"}":{"__typename":"DeepDives","uuid":"7008a5ec-3319-42e4-80ed-707d6090e94e","content":"\u003cp\u003eEver since I can remember, I spent my summers at summer camp. These were always the happiest weeks of my year - whether at sleep-away camp or day camp, I always felt like I was the best version of myself at camp. My best friends and memories were forged at camp.\u003cbr\u003e\u003cbr\u003eAs I got older, I transitioned into a different role at camp - working as a counselor. Now my motivation was recreating the experience that I was given as a kid, ensuring that my campers had an equally amazing time. \u003cbr\u003e\u003cbr\u003eWe did it all at camp. I led backpacking trips, sports, dance routines, song sessions, conversations about contemporary masculinity, and so much more. Camp will always have a special place in my heart. As a mentor, I strive to create an environment that is fun, authentic, and where we can both be the best versions of ourselves. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"2278409f-5652-4967-844d-9bbed866bb43\"}":{"__typename":"DeepDives","uuid":"2278409f-5652-4967-844d-9bbed866bb43","content":null,"videoPlaybackId":"kguWG8X5FxivJbHhxQIIEN3HjwhjAiXTZrcsLyu6p00Q","question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"70f4a49b-1fc5-4557-b3cd-b60e6f4886b1\"}":{"__typename":"DeepDives","uuid":"70f4a49b-1fc5-4557-b3cd-b60e6f4886b1","content":null,"videoPlaybackId":"kUqngPqFXRVwVZbgz4cikS7E12XhmBuLNn02gBVzHMZc","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"377d7653-f87b-4f5e-bd37-781b2d1c44cd\"}":{"__typename":"School","uuid":"377d7653-f87b-4f5e-bd37-781b2d1c44cd","name":"Berkeley High School","city":"Berkeley","type":"HIGH","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"123e3d93-2a93-41de-b3b6-10b1f77c2bf8\"}":{"__typename":"Education","uuid":"123e3d93-2a93-41de-b3b6-10b1f77c2bf8","school":{"__ref":"School:{\"uuid\":\"377d7653-f87b-4f5e-bd37-781b2d1c44cd\"}"},"startYear":"2016","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"f08a723d-c93d-4249-abc2-b8c9589696f6\"}":{"__typename":"Education","uuid":"f08a723d-c93d-4249-abc2-b8c9589696f6","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"3c475613-03d2-4051-9398-853dc0959d47\"}":{"__typename":"MentorPublicProfile","uuid":"3c475613-03d2-4051-9398-853dc0959d47","displayName":"Seth P.","slug":"seth-pierson","biography":"\u003cp\u003eHey everyone! My name is Seth Pierson, and I am so excited to get started as a Curious Cardinals mentor. Believe it or not, I am just starting as a mentor this January, and my enthusiasm is through the roof.\u003cbr\u003e\u003cbr\u003eI'll start with a little bit about myself. I'm currently a senior majoring in psychology and minoring in business at Northwestern University. My main passion lies in positive psychology. When the pandemic began, I watched global happiness levels plummet, and become increasingly interested in mental health and well-being. This passion led me to conduct research in two positive psychology labs, investigating the impact of a growth mindset on navigating transition, and the impact of music on well-being. I also studied abroad in Copenhagen to learn from a society that has well-being down to a science!\u003cbr\u003e\u003cbr\u003eWhen I'm not in the classroom, I love playing sports (soccer, basketball, tennis, football), being outside (hiking, surfing, backpacking), playing board games, reading, and spending time with my friends. I've played soccer since I was 5, and continue to play on the club team at Northwestern. I've found that some of the best friends you'll ever make and some of the most important lessons you'll ever learn are found through team sports. \u003cbr\u003e\u003cbr\u003eDuring COVID I also took a gap year, giving me the opportunity to tutor a \"pod\" of first-graders and coach a soccer team of fourth-graders. In high school I was a peer mentor and tutor, something that I've carried into college. I've also been a summer camp counselor for five years, working with kids ranging from third grade to entering high school. While each of these experiences were quite different, they have all helped to inform my mentoring style. \u003cbr\u003e\u003cbr\u003eI'm a strong listener. And I am great at connecting with people. I know that each student learns differently, and it is my job to get to know them so that I can support them the best that I can. I'm an incredibly hard worker, communicative, and when I make a commitment, I see it through. I can't wait to start working with your family! \u003cbr\u003e\u003cbr\u003e- Seth\u003c/p\u003e","teachingVideoPlaybackId":"CnPmi6n6BvWhPUFUMJ7Wys00r8i9AatpfvDI00LDC9iDk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"690e5964-ef50-4883-8cde-1af6cac40228\"}"},{"__ref":"DeepDives:{\"uuid\":\"7008a5ec-3319-42e4-80ed-707d6090e94e\"}"},{"__ref":"DeepDives:{\"uuid\":\"2278409f-5652-4967-844d-9bbed866bb43\"}"},{"__ref":"DeepDives:{\"uuid\":\"70f4a49b-1fc5-4557-b3cd-b60e6f4886b1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9db4e16f-981d-4ae3-b5e4-e711fcedfb77/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"123e3d93-2a93-41de-b3b6-10b1f77c2bf8\"}"},{"__ref":"Education:{\"uuid\":\"f08a723d-c93d-4249-abc2-b8c9589696f6\"}"}],"hiredAt":"2024-01-17T14:49:07.408Z","topics":["Sports Journalism","Literature","History Project","STEM Project","K-5 Grade Math","Pre-Algebra","Writing","Reading","History","Academic Coaching"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"seth-pierson\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3c475613-03d2-4051-9398-853dc0959d47\"}"}}},"_sentryTraceData":"1817a48bb72b407bb1bf9d11d5809074-b7c1a9cd130fe883-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1817a48bb72b407bb1bf9d11d5809074,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"seth-pierson"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\
