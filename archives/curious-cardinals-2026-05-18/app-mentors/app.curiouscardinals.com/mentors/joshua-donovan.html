xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"46e62686-2cac-4124-a1f8-0e0100d43090\"}":{"__typename":"Favorites","uuid":"46e62686-2cac-4124-a1f8-0e0100d43090","photoUrl":"https://ucarecdn.com/728b958d-b05e-40d2-9796-1b0b99527a22/","title":"A Storm of Swords","type":"BOOK"},"Favorites:{\"uuid\":\"74149e5a-4a31-44fb-9f5f-1b0692d61481\"}":{"__typename":"Favorites","uuid":"74149e5a-4a31-44fb-9f5f-1b0692d61481","photoUrl":"https://ucarecdn.com/a37f3bf4-d693-4fef-92ae-ea7ff21177ba/","title":"Patriots","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"1952b4b4-841e-4d2e-b751-dbff3fec39af\"}":{"__typename":"DeepDives","uuid":"1952b4b4-841e-4d2e-b751-dbff3fec39af","content":"\u003cp\u003eBe adaptable! Life will through challenge after challenge at you, and what's most important is you carry on and find new ways to push forward!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"1657e950-a76d-4412-9af4-0bb4faf92659\"}":{"__typename":"DeepDives","uuid":"1657e950-a76d-4412-9af4-0bb4faf92659","content":"\u003cp\u003eMy dream job is to run a company in the Consumer \u0026amp; Retail space, working with brands everyone knows and loves!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"0a3465a8-44ef-4ca3-8b5d-1d0f6d47fd53\"}":{"__typename":"DeepDives","uuid":"0a3465a8-44ef-4ca3-8b5d-1d0f6d47fd53","content":"\u003cp\u003eThe opportunity I was given to speak at my high school graduation. It was an unbelievable experience to speak in front of over 2000 people about having your own source of motivation! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b64fb052-6fad-44f4-b0a6-03a058d6a382\"}":{"__typename":"DeepDives","uuid":"b64fb052-6fad-44f4-b0a6-03a058d6a382","content":"\u003cp\u003eI played travel lacrosse, flying around the country to compete, and worked at a local surveying company drafting up land surveys!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"c51ec2a4-7bd9-43cd-88f8-39ef8404ce12\"}":{"__typename":"School","uuid":"c51ec2a4-7bd9-43cd-88f8-39ef8404ce12","name":"Lake Mary High School","city":"Lake Mary","type":"HIGH","state":"Florida","country":"United States","zip":"32746"},"Education:{\"uuid\":\"8d798d63-2a24-49cb-ae3d-0295a702ff70\"}":{"__typename":"Education","uuid":"8d798d63-2a24-49cb-ae3d-0295a702ff70","school":{"__ref":"School:{\"uuid\":\"c51ec2a4-7bd9-43cd-88f8-39ef8404ce12\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}":{"__typename":"School","uuid":"843cb79b-75a7-4415-89cc-0166c307ba4b","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"CT","country":"USA","zip":"06511"},"Education:{\"uuid\":\"8fff38ea-9033-4022-9957-e46a0955767f\"}":{"__typename":"Education","uuid":"8fff38ea-9033-4022-9957-e46a0955767f","school":{"__ref":"School:{\"uuid\":\"843cb79b-75a7-4415-89cc-0166c307ba4b\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"3daf0167-90d5-4b9e-9d45-7bfd90e27144\"}":{"__typename":"MentorPublicProfile","uuid":"3daf0167-90d5-4b9e-9d45-7bfd90e27144","displayName":"Joshua D.","slug":"joshua-donovan","biography":"\u003cp\u003eHi! My name is Josh, and I am a senior at Yale University pursuing a degree in economics. I grew up in Orlando, Florida, where I attended a large public high school.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve had a wide range of interests over the years—from math and science to history and economics—exploring them through classes, extracurriculars, and the occasional 10-minute YouTube video. Over the past few years, my favorites include Modern Architectural Design, Microeconomic Theory, Greek Art and Architecture, and Medieval European History!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I participated in activities from Academic Decathlon to varsity lacrosse, where I was a two-time captain and two-time All-American. I also participated in a four-year dual-enrollment drafting program, where I learned architectural and engineering design and then applied those skills as a drafter at a local surveying company.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I’ve further explored my interests in economics, business, and finance. On campus, I’ve spent time in clubs such as the Yale Undergraduate Consulting Group, where I worked on a project for Google, and TAMID at Yale, as a member of the investment group. I also helped launch the Yale Undergraduate Hedge Fund Association and the Yale chapter of Paragon Global Investments. I am also a member of Sigma Nu, Club Golf, and Club Lacrosse.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOver the summers, I spend my time interning in business and finance. This past summer, I worked at Bank of America doing Consumer \u0026amp; Retail Investment Banking. I will be returning there full-time next year! In the past, I spent time at a hedge fund as a sector summer analyst, at a sports device startup in the marketing department, and at the insurance company Prudential Financial in corporate treasury. These roles have given me a breadth of experience across different spheres of finance, and I have been lucky to have the chance to pass that down to former Cardinals!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of school and work, I’m passionate about many things. I love to spend my school breaks exploring and photographing nature, often taking trips with friends and family to national parks. In general, I enjoy the outdoors and all things sports-related, such as hiking, intramural sports, fantasy football, and more! I also spend some free time hanging out with friends, in the gym, or playing the occasional video game.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI love helping students explore their interests and develop their skills. In high school, I tutored middle school math students and coached fifth- and sixth-grade lacrosse teams. In college, I am proud to be a mentor for First Generation Investors, where we go to underserved high schools and teach personal finance to seniors. At Curious Cardinals, I have worked with multiple high school students—from freshman to senior year—on creating clubs on campus, preparing for college applications, and working on SAT and ACT prep.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve deeply enjoyed each of these experiences and appreciated the relationships I’ve been able to build through them. I was lucky enough to have mentors of my own along the way, and I’m eager to continue paying it forward by helping students pursue their unique passions and goals!\u003c/p\u003e","teachingVideoPlaybackId":"KVr01r02gGCeRMN6pDZeslnulQI7U5ObQH8pSKMhXfMP00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"46e62686-2cac-4124-a1f8-0e0100d43090\"}"},{"__ref":"Favorites:{\"uuid\":\"74149e5a-4a31-44fb-9f5f-1b0692d61481\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1952b4b4-841e-4d2e-b751-dbff3fec39af\"}"},{"__ref":"DeepDives:{\"uuid\":\"1657e950-a76d-4412-9af4-0bb4faf92659\"}"},{"__ref":"DeepDives:{\"uuid\":\"0a3465a8-44ef-4ca3-8b5d-1d0f6d47fd53\"}"},{"__ref":"DeepDives:{\"uuid\":\"b64fb052-6fad-44f4-b0a6-03a058d6a382\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e446a29c-fed2-401b-a480-023ea19735b1/-/preview/-/format/jpg/","https://ucarecdn.com/dbbe6387-1753-44b6-ac1d-13c6c2b39aee/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8d798d63-2a24-49cb-ae3d-0295a702ff70\"}"},{"__ref":"Education:{\"uuid\":\"8fff38ea-9033-4022-9957-e46a0955767f\"}"}],"hiredAt":"2024-05-24T14:13:46.220Z","topics":["Algebra I","Algebra II","Calculus","Geometry","Precalculus / Trigonometry","Statistics","Biology","Physics","Academic Coaching","Economics","History","Business / Entrepreneurship","Finance / Investing","Robotics / Electronics / CAD"],"communityBadges":["https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"joshua-donovan\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"3daf0167-90d5-4b9e-9d45-7bfd90e27144\"}"}}},"_sentryTraceData":"2082f621eab34fc580e23d70f7
