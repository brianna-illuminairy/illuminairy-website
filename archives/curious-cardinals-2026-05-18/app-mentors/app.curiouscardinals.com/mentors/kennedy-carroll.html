xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"806f03a2-3a19-41d1-9aa8-01bc2734df4d\"}":{"__typename":"DeepDives","uuid":"806f03a2-3a19-41d1-9aa8-01bc2734df4d","content":"\u003cp\u003eBe courageous and try everything! You have so much time to figure out what matters to you, so use every chance you get. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7a505fe4-8208-40f4-ab3b-fa553142d750\"}":{"__typename":"DeepDives","uuid":"7a505fe4-8208-40f4-ab3b-fa553142d750","content":"\u003cp\u003eI have always loved being in the car since I was young, so unsurprisingly, I often go on road trips with my family and friends. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"8432c646-2087-47b5-bb83-7301d248ca39\"}":{"__typename":"DeepDives","uuid":"8432c646-2087-47b5-bb83-7301d248ca39","content":"\u003cp\u003eMentorship has taught me a great deal about myself that I would have never discovered on my own. It opens you up to another perspective, lesson, and guidance that can be fundamental to your personal life and even aspirations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"3e1caee4-9477-4f85-a90f-001440d4ff80\"}":{"__typename":"DeepDives","uuid":"3e1caee4-9477-4f85-a90f-001440d4ff80","content":"\u003cp\u003eAs a Black woman, academic spaces are not always kind or generous when some people believe that you should not be taking up space or that you are not credible. I think I teach with the goal of working through fear to take risks and sometimes be wrong, despite possibly feeling unworthy. Others should not determine one's growth; rather, you should make those decisions. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"93e8e6d0-0219-48a2-9fc4-7f0ce667b291\"}":{"__typename":"School","uuid":"93e8e6d0-0219-48a2-9fc4-7f0ce667b291","name":"Stone Ridge School of the Sacred Heart","city":"Bethesda","type":"HIGH","state":"Maryland","country":"United States","zip":"20814"},"Education:{\"uuid\":\"785edc54-dfdc-4b67-b739-ab46a6c157bd\"}":{"__typename":"Education","uuid":"785edc54-dfdc-4b67-b739-ab46a6c157bd","school":{"__ref":"School:{\"uuid\":\"93e8e6d0-0219-48a2-9fc4-7f0ce667b291\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"7a098606-ee7f-4993-8e96-11df9a876843\"}":{"__typename":"Education","uuid":"7a098606-ee7f-4993-8e96-11df9a876843","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Medical Anthropology","degree":null},"MentorPublicProfile:{\"uuid\":\"8dc80c9e-6cb4-4b79-be42-38d9bc346b8e\"}":{"__typename":"MentorPublicProfile","uuid":"8dc80c9e-6cb4-4b79-be42-38d9bc346b8e","displayName":"Kennedy C.","slug":"kennedy-carroll","biography":"\u003cp\u003eHi! My name is Kennedy Carroll, and I am from Bowie, Maryland, just 15 minutes outside of DC. Being from PG county is a source of pride for me, and I absolutely adore the communities that I have grown up and lived in for all of my life.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I want to inspire students to embrace their educational journeys because everyone should feel confident to take on academic pursuits or personal hobbies and interests. I hope to instill that you can forever be a lifelong learner if you are willing to absorb and decipher information. I also look forward to learning from students as a mentor, because our youth truly have so much to offer in this world– we just have to be willing to listen!\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am a rising senior at Princeton, studying Medical Anthropology and African American Studies on a pre-med track. For those interested, medical anthropology is a perspective of medicine from biosocial to therapeutic systems to cultural ideas about illness and practices of health and well-being. I hope to apply to medical school in the next few years. I am passionate about health equity and improving standards of care and access in the medical field. This summer I am working as a medical scribe at a local practice that primarily serves Black patients with hypertension and diabetes. I recently completed independent work, a 35-page junior paper titled “Channeling Lineages: Black Feminist Theory as Precedent for Black Disability Studies and the Intersections of Blackness and Disability within Anthropology.”\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my junior semester, I had the opportunity to study abroad in London. This was hands down one of the best decisions I have made while in college. I got to visit 9 other countries like Morocco, the Netherlands, Greece, and Portugal. It felt like I was restarting college in a new place, so it was definitely a transformative experience.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I'm not in class or doing homework, you can find me in a dance studio, primarily doing hip-hop and occasionally African and Caribbean styles. RNB is my favorite music genre from the oldies to the current era. I love taking road trips and driving anywhere possible because it calms me down, even in bumper-to-bumper traffic. I dislike cooking in any capacity but will bake any chance I get. Taking from my mom, I love event planning and curating spaces for connection, which has flourished as president of the Black Women’s Association on campus.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"ErfMhtUyJND01x6wMt2doXiAykwi3zvAnz602Uz02lL4c4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Medical Anthropology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"806f03a2-3a19-41d1-9aa8-01bc2734df4d\"}"},{"__ref":"DeepDives:{\"uuid\":\"7a505fe4-8208-40f4-ab3b-fa553142d750\"}"},{"__ref":"DeepDives:{\"uuid\":\"8432c646-2087-47b5-bb83-7301d248ca39\"}"},{"__ref":"DeepDives:{\"uuid\":\"3e1caee4-9477-4f85-a90f-001440d4ff80\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/38cf7327-5daf-4094-8bd2-0fba03decccf/-/preview/-/format/jpg/","https://ucarecdn.com/189a88b6-d9e9-45d3-94a6-d09a4eefbe0a/-/preview/-/format/jpg/","https://ucarecdn.com/bc3dc04c-8ec1-4644-a35b-12bae7fa4f37/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"785edc54-dfdc-4b67-b739-ab46a6c157bd\"}"},{"__ref":"Education:{\"uuid\":\"7a098606-ee7f-4993-8e96-11df9a876843\"}"}],"hiredAt":"2025-07-02T17:37:48.534Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","K-5 Grade Math","6-8 Grade Science","Biology","Physics","Writing","Academic Coaching","Reading","College Essay Writing","K-6 Storybook","Creative Writing","History Project","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kennedy-carroll\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"8dc80c9e-6cb4-4b79-be42-38d9bc346b8e\"}"}}},"_sentryTraceData":"29a479f309894271a2a8d5eff523a74c-bd09d58c58b73bad-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=29a479f309894271a2a8d5eff523a74c,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"kennedy-carroll"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
