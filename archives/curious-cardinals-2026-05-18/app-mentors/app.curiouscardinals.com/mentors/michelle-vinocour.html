xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e4ae36b4-9fb0-491f-8649-594230a494e7\"}":{"__typename":"DeepDives","uuid":"e4ae36b4-9fb0-491f-8649-594230a494e7","content":"\u003cp\u003eI chose Symbolic Systems because I’ve always been drawn to questions that don’t fit neatly into one discipline. I wanted to study technology, but I also cared about the human, societal, and creative dimensions behind it. Symbolic Systems is inherently interdisciplinary-- it blends computer science, psychology, linguistics, and philosophy, and that gave me the freedom to explore how different fields can come together to answer complex questions.\u003c/p\u003e\u003cp\u003eOne of the themes that fascinated me most was the parallel between minds and machines. Learning how humans perceive, reason, and learn helped me understand how we might design machines that can do the same. \u003c/p\u003e\u003cp\u003eFor me, Symbolic Systems allowed me to work at the intersection of disciplines, and challenged me to ask the big-picture questions about how technology can and should shape the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"935f37c6-c6a7-4ecc-ac83-ff1a4553bbad\"}":{"__typename":"DeepDives","uuid":"935f37c6-c6a7-4ecc-ac83-ff1a4553bbad","content":"\u003cp\u003eMy greatest role model is my mom. She showed me what it means to lead with both strength and empathy. Watching her balance her career and our family taught me the value of independence, resilience, and pursuing your goals unapologetically. She was my first example of female empowerment, and she continues to inspire me to create opportunities for other women to thrive.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d603b248-3e9a-40e7-b2e3-1aaef0328caa\"}":{"__typename":"DeepDives","uuid":"d603b248-3e9a-40e7-b2e3-1aaef0328caa","content":"\u003cp\u003eMentorship matters to me because so much of who I am today is the result of people who went out of their way to guide and support me. From my first ballet teacher, who spent extra hours rehearsing my solo, to older friends who took the time to read my college essays, I’ve been fortunate to have mentors who invested in my growth. Those acts of generosity not only shaped my opportunities but also showed me the power of believing in someone before they fully believe in themselves. I see mentorship as a way to pay that forward—helping others reach milestones they might not have thought possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b881d9d1-c4e1-4977-a83e-b8e5bdac66b3\"}":{"__typename":"DeepDives","uuid":"b881d9d1-c4e1-4977-a83e-b8e5bdac66b3","content":"\u003cp\u003eI spent my high school summers at ballet intensives, which were some of the most formative experiences of my teen years. I trained in New York City at the American Ballet Theatre, in Miami at the Joffrey Ballet School, and in Barcelona at a summer program that brought together dancers from around the world. Those summers taught me discipline, resilience, and how to keep pushing myself creatively, even in new settings.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"07fcf3b1-1984-43f2-aafb-b31bab7ebb3b\"}":{"__typename":"Education","uuid":"07fcf3b1-1984-43f2-aafb-b31bab7ebb3b","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Symbolic Systems","degree":"BS"},"School:{\"uuid\":\"adbd46c4-6b2b-4736-b9f1-fc1ef674c781\"}":{"__typename":"School","uuid":"adbd46c4-6b2b-4736-b9f1-fc1ef674c781","name":"Lincoln School","city":"San Jose","type":"HIGH","state":"_","country":"Costa Rica","zip":"0000"},"Education:{\"uuid\":\"c3bf14f2-be34-45fe-8142-5bf15d98624d\"}":{"__typename":"Education","uuid":"c3bf14f2-be34-45fe-8142-5bf15d98624d","school":{"__ref":"School:{\"uuid\":\"adbd46c4-6b2b-4736-b9f1-fc1ef674c781\"}"},"startYear":"2005","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"01f9a436-55e6-411d-95cf-d6176ba58b66\"}":{"__typename":"MentorPublicProfile","uuid":"01f9a436-55e6-411d-95cf-d6176ba58b66","displayName":"Michelle V.","slug":"michelle-vinocour","biography":"\u003cp\u003eOriginally from Costa Rica, Michelle is a recent Stanford graduate with a B.S. in Symbolic Systems and an M.S. in Management Science \u0026amp; Engineering. At Stanford, she focused on Human-Centered AI, exploring how technology can be designed and used to solve real-world problems and expand access to opportunity. She also completed a minor in Education, deepening her understanding of how people learn and how technology can be integrated into teaching in meaningful ways.\u003c/p\u003e\u003cp\u003eMichelle is passionate about the intersection of creativity, learning, and artificial intelligence—and as a graduate student, she taught Stanford courses on Artificial Intelligence and Organizational Behavior. She also mentored student founders as the Managing Director of Cardinal Ventures, the university’s premier student-run startup accelerator. Beyond her academic and professional roles, Michelle served as President of Stanford Latino, the largest Latinx student organization on campus, where she led initiatives to strengthen community, celebrate culture, and expand professional opportunities for Latinx students. Her passion for technology in emerging economies led her to work at startups in Mexico City and start \u003cem\u003eTech Latino\u003c/em\u003e, a newsletter highlighting innovation, startups, and venture capital across Latin America.\u003c/p\u003e\u003cp\u003eHer entrepreneurial spirit extends beyond technology. While in college, Michelle founded a ballet-inspired fashion brand, blending her artistic background with business and design. She also lived in the inaugural HackHerHouse, a women-led entrepreneurial community that was later featured on CNBC for empowering women in tech and business. These experiences gave her firsthand insight into product development, branding, creative leadership, and building inclusive spaces—skills she continues to draw on in her career.\u003c/p\u003e\u003cp\u003eThe experience gave her firsthand insight into product development, branding, and creative leadership—skills she continues to draw on in her career.\u003c/p\u003e\u003cp\u003eAfter graduation, Michelle has built conversational agents for enterprises and is currently working at Google Labs building Jules, Google’s autonomous coding agent. Her work bridges AI capabilities with user-centered design, aiming to make cutting-edge technology intuitive, accessible, and impactful.\u003c/p\u003e\u003cp\u003eOutside of her academic and professional life, Michelle trained in ballet for over a decade, a discipline that has shaped her approach to problem-solving with its emphasis on precision, creativity, and resilience. Today, she still finds joy in dance, yoga, reading, and exploring new restaurants.\u003c/p\u003e\u003cp\u003eMichelle is excited to join Curious Cardinals as a mentor and help students not only understand the technology shaping their futures, but also learn how to apply it in ways that help them reach their goals. She believes that by combining creativity, critical thinking, and technical skills, both children and adults can not only adapt to the world of the future, but also play a defining role in shaping it.\u003c/p\u003e","teachingVideoPlaybackId":"Jo00OtUGo6K4802kZ602kN81roxdcUwsk6skoZYqdCvVa00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Symbolic Systems","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e4ae36b4-9fb0-491f-8649-594230a494e7\"}"},{"__ref":"DeepDives:{\"uuid\":\"935f37c6-c6a7-4ecc-ac83-ff1a4553bbad\"}"},{"__ref":"DeepDives:{\"uuid\":\"d603b248-3e9a-40e7-b2e3-1aaef0328caa\"}"},{"__ref":"DeepDives:{\"uuid\":\"b881d9d1-c4e1-4977-a83e-b8e5bdac66b3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7decab5a-f5e6-4bfc-9932-e802f88e69fe/-/preview/-/format/jpg/","https://ucarecdn.com/97807d61-b3e7-43da-92ee-492940108f56/-/preview/-/format/jpg/","https://ucarecdn.com/7f33eb72-d0ae-40f5-a662-614a8c5e0d3e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"07fcf3b1-1984-43f2-aafb-b31bab7ebb3b\"}"},{"__ref":"Education:{\"uuid\":\"c3bf14f2-be34-45fe-8142-5bf15d98624d\"}"}],"hiredAt":"2025-08-06T02:56:21.682Z","topics":["Fa
