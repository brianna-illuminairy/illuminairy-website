xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"7edf2093-92ea-4257-9486-8196e3d70245\"}":{"__typename":"DeepDives","uuid":"7edf2093-92ea-4257-9486-8196e3d70245","content":"\u003cp\u003ePublish a novel! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"96947c9f-1d37-4c16-ae5b-d57b614f1be1\"}":{"__typename":"DeepDives","uuid":"96947c9f-1d37-4c16-ae5b-d57b614f1be1","content":"\u003cp\u003eHigh-achieving, athletic know-it-all with braces. I loved every part of school but occasionally struggled socially, and always felt a bit of an oddball, marching to the beat of my own drum. (I still march to the beat of my own drum, but I rarely feel like an oddball anymore!) \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e164da90-1917-47ef-9383-d7182fea6592\"}":{"__typename":"DeepDives","uuid":"e164da90-1917-47ef-9383-d7182fea6592","content":"\u003cp\u003eDance, run, do cartwheels in strange places! I write fiction and am a voracious reader. I love most sports and play tennis, volleyball and football whenever I can. Additionally: consume French literature and media, dabble in translation, audition for plays I know I won't be cast in. Art museums, new restaurants, old thrift stores. Did I mention reading? \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"55b8fd85-07f2-47ab-898c-b66c5e066637\"}":{"__typename":"DeepDives","uuid":"55b8fd85-07f2-47ab-898c-b66c5e066637","content":"\u003cp\u003eMentorship is many things. It's advice and guidance on a project that you can't always get from a teacher or a parent -- tailored prompts, exercises, feedback and planning. It's understanding the specific pressures of school and providing a different voice of support, from a closer generation, to manage that. It's being a role model, an advocate and a cheerleader (and occasionally an unabashed gossip!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"b72f2d5d-c2b8-4bb8-9596-33553de198e2\"}":{"__typename":"School","uuid":"b72f2d5d-c2b8-4bb8-9596-33553de198e2","name":"Glenbrook North High School","city":"Northbrook","type":"HIGH","state":"Illinois","country":"United States","zip":"60062"},"Education:{\"uuid\":\"0d1c0f48-06e6-4f79-bb83-3ece506b43a9\"}":{"__typename":"Education","uuid":"0d1c0f48-06e6-4f79-bb83-3ece506b43a9","school":{"__ref":"School:{\"uuid\":\"b72f2d5d-c2b8-4bb8-9596-33553de198e2\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"66220921-62b9-449f-915b-5ac300b4e0a3\"}":{"__typename":"Education","uuid":"66220921-62b9-449f-915b-5ac300b4e0a3","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English, French","degree":null},"MentorPublicProfile:{\"uuid\":\"a41bd40c-ee8a-4409-b277-ac59fae6709b\"}":{"__typename":"MentorPublicProfile","uuid":"a41bd40c-ee8a-4409-b277-ac59fae6709b","displayName":"Haley S.","slug":"haley-sandlow-1","biography":"\u003cp\u003eToday, when I think about what gets me out of bed in the morning, the answer feels so simple: stories. But it wasn't always this easy to acknowledge my love of storytelling. My interests and skills are pulled in all different directions: reading and critical analysis, creative writing, environmental science and organic agriculture, French language and culture, journalism, theatre. But the through line of all these disciplines I've been studying for 8 years or more is communication, and even moreso, stories.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis is the reason I've studied English at Brown, to look closely at celebrated stories and think critically about what they mean. It's why I've studied French, too, spending my Junior spring semester in Paris, living with a host family and working as a TA at a high school. After the spring I stuck around France for three months, staying and working at three different organic farms where I made sorbet and jam, bottled wine and tended to vines, and tended to bees. My experiences abroad learning a different language and culture have widened my bases for stories, and pushed me to be uncomfortable, creative and curious, to pursue my passions and deepen my understanding of the world around me.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eJournalism and creative writing are two no-brainers when it comes to stories, and it’s no wonder that’s where my professional and personal careers are headed. I worked for my university's newspaper and trained countless new writers in the craft of fair and truthful storytelling. I spent a summer in Charlottesville, Virginia writing articles for the local newspaper. Now, I'm a reporter at the local newspaper on Martha's Vineyard, where I give the same care to my stories about local politics as I do to my stories on farming, my features on local authors and speakers, and much more. I absolutely adore it.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e(I am also a daily writer of fiction. I wrote my first novel-length work last year, which is sitting in my drafts waiting for a revision. I hope to publish my very first short story soon.)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about so much in this fascinating, complicated world we live in. It is that intense drive to discover that led me to teaching, first in a high school in France, then as a sex education instructor in Providence high schools,  as an accelerated French tutor for high schoolers, and now as a Curious Cardinals mentor. Passion is precious, and deserves  to be nurtured carefully, making room for the natural lulls in interest that every student experiences as well as the stressors they experience in their day-to-day lives. But if I’ve learned how to speak French, edit a struggling article and tell a good story, I’ve also learned how to manage being a student. I've succeeded in academic spaces and figured out how to pursue passion while still being a human, first and foremost. I prioritize kindness, joy, care and curiosity. I am so excited to work with you and to share all that I’ve learned!\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"DLPzhhifMClh005KMnE1BZMHl02gXG1OQKYM0101AJ02AX98","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English, French","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7edf2093-92ea-4257-9486-8196e3d70245\"}"},{"__ref":"DeepDives:{\"uuid\":\"96947c9f-1d37-4c16-ae5b-d57b614f1be1\"}"},{"__ref":"DeepDives:{\"uuid\":\"e164da90-1917-47ef-9383-d7182fea6592\"}"},{"__ref":"DeepDives:{\"uuid\":\"55b8fd85-07f2-47ab-898c-b66c5e066637\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8f429748-4316-4a96-91ad-c5eaccd3854f/-/preview/-/format/jpg/","https://ucarecdn.com/0acc8f66-b600-4ee1-bcb5-f75d05e3dfb3/-/preview/-/format/jpg/","https://ucarecdn.com/7a152a98-f190-481f-b7fd-dac44ffcc810/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0d1c0f48-06e6-4f79-bb83-3ece506b43a9\"}"},{"__ref":"Education:{\"uuid\":\"66220921-62b9-449f-915b-5ac300b4e0a3\"}"}],"hiredAt":"2025-02-27T17:11:04.219Z","topics":["Writing","French","Academic Coaching","College Essay Writing","Reading","Creative Writing","Film / Theater","K-6 Storybook","Sports Journalism","Visual Arts / Graphic Design","Journalism","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"haley-sandlow-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a41bd40c-ee8a-4409-b277-ac59fae6709b\"}"}}},"_sentryTraceData":"9bcd99dcbb95456aac3128faccfa90b4-a7b2f6089e5d0e85-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9bcd99dcbb95456aac3128faccfa90b4,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"haley-sandlow-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"
