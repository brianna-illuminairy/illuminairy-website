xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"c1dd79d0-8361-43e8-9202-a8592e2e558e\"}":{"__typename":"DeepDives","uuid":"c1dd79d0-8361-43e8-9202-a8592e2e558e","content":"\u003cp\u003eMentorship has been such an important influence at the points of inflection throughout my life. Having inspiring teachers who believed in me in high school encouraged me to pursue subjects I may not have otherwise studied (physics and Latin!), and meeting the philosophy professor who would later become my senior thesis advisor was what gave me the confidence I needed to flourish academically in college. Whereas academic goals and career paths can sometimes feel intimidating and detached from reality, black-and-white templates that dictate what your life should look like, I believe that meeting people who you aspire to can be one of the best ways of imagining your future, by creating fulfilling mentorships that provide guidance, confidence, and support.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"a4c99666-4f02-46ef-812d-d847b984c53d\"}":{"__typename":"DeepDives","uuid":"a4c99666-4f02-46ef-812d-d847b984c53d","content":"\u003cp\u003eI have quite a mixed cultural heritage, which has meant that my identity has always felt malleable, rather than fixed or self-defining. As a result, I love learning about other cultures and lived experiences different to my own, and am really open to pursuing different ways of learning to suit people's diverse interests, preferences, and idiosyncrasies. For instance, working with artists who learn best through visualisation has taught me to draw ideas as well as discuss them; teaching people whose first language isn't English has encouraged me to never take grammatical conventions for granted; and teaching writers has taught me to ask questions rather than provide answers, to help young people improve their writing while still preserving their own unique voice and literary style. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"8b6038bf-552e-4e4d-937f-a91f43e4b8e8\"}":{"__typename":"DeepDives","uuid":"8b6038bf-552e-4e4d-937f-a91f43e4b8e8","content":"\u003cp\u003eI spent one summer interning as a research assistant at a nanophysics lab in Sweden, working on ways of deionising seawater to provide drinking water for communities most impacted by climate change. I spent another living in Berlin, learning about the politics of the Syrian refugee crisis in Germany. I spent the summer of my junior year in high school camping north of the Arctic Circle, and my last summer studying 19th-century feminist literature at a pre-college summer program at Harvard.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5fce63fe-4a74-4013-a8c2-ca51c95bd389\"}":{"__typename":"DeepDives","uuid":"5fce63fe-4a74-4013-a8c2-ca51c95bd389","content":"\u003cp\u003eI love cooking, baking, going on long runs, live music, travelling, crocheting, and hosting fun and elaborate dinner parties for my friends!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"7ac600a5-6a16-48e6-906a-b23328d14ca6\"}":{"__typename":"School","uuid":"7ac600a5-6a16-48e6-906a-b23328d14ca6","name":"St Paul's Girls' School","city":"London","type":"HIGH","state":"England","country":"United Kingdom","zip":"W6 7BS"},"Education:{\"uuid\":\"11723880-a2cf-4f6e-a8fa-904b21d698e5\"}":{"__typename":"Education","uuid":"11723880-a2cf-4f6e-a8fa-904b21d698e5","school":{"__ref":"School:{\"uuid\":\"7ac600a5-6a16-48e6-906a-b23328d14ca6\"}"},"startYear":"2012","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"0a76b11a-1fbb-48cd-aae7-aa24a2540b02\"}":{"__typename":"Education","uuid":"0a76b11a-1fbb-48cd-aae7-aa24a2540b02","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Philosophy \u0026 Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"ebbfe1b5-1056-4209-a4ff-2b53a14f787a\"}":{"__typename":"MentorPublicProfile","uuid":"ebbfe1b5-1056-4209-a4ff-2b53a14f787a","displayName":"Ilyana B.","slug":"ilyana-benjelloun-1","biography":"\u003cp\u003eHi! My name is Ilyana and I'm a recent Yale grad from London, England. In high school, I was most involved in debate and journalism. I was the chief editor of my school newspaper and started a linguistics magazine and blog for literature and opinion pieces in languages other than English. I spent most of my weekends catching trains at unholy hours to participate in debate tournaments across the country. In response to the striking gender disparity I encountered, I convened the SPGS Women's Open, a free debate competition for women and non-binary debaters, through which I hoped to promote greater inclusion in the debate. In my senior year of high school, I co-founded a tutoring non-profit for young people affected by the Grenfell Tower disaster, a devastating fire that disrupted the education of many children in West London. This was a profoundly moving experience that kindled my interest in pedagogy and mentorship. I continued teaching at Yale, where I worked my on-campus job as a writing partner at Yale's Centre for Teaching and Learning.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I am most passionate about criminal justice and legislative advocacy. At Yale, where I double majored in philosophy and cognitive science, I became more engaged in grassroots social organizing during the pandemic, where I worked remotely as a research assistant for criminal legal and human rights clinics at Yale Law School, and exchanged letters with people in prison to raise awareness of the dangerous public health conditions in these facilities. My experience in legislative advocacy began during my freshman year of college when I co-founded a non-profit dedicated to reducing the barriers to entry for justice-impacted people to higher education. I testified before government committees, wrote articles and reports, and organized conferences and meetings with Yale leadership to change admissions policies and enable justice-impacted people to pursue the higher education they need to better their lives and imagine a more hopeful future after prison. These experiences were what motivated me to pursue impact litigation as an intern at the ACLU, and now, as a paralegal for the ACLU's Criminal Law Reform Project in New York, where I will be working this year.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAs your child's mentor, I hope to encourage them to organically and independently develop their interests and curiosity. With over 6 years of experience as an educator, I promise to teach in a way that is engaging, creative, and inspiring -- pursuing topics that your child is interested in; relating abstract, theoretical concepts to real-world applications and experiences; and working together with your child to turn their burgeoning ideas into material projects they can be proud of and excited about. Through my academic and extracurricular experiences, I have accumulated skills across various software, including Photoshop and Adobe InDesign, and so I would also love to work collaboratively with your child on designing passion projects outside of their classes -- whether it be a blog about an issue they care about, a website advertising a company they want to start, or an arts magazine. My goal is to make your child excited about learning and pursuing their passions!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e","teachingVideoPlaybackId":"I8USaMxC98wNlnuMRWDTRaiwmX16Q3qMD7lg02Kt6OWY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Philosophy \u0026 Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c1dd79d0-8361-43e8-9202-a8592e2e558e\"}"},{"__ref":"DeepDives:{\"uuid\":\"a4c99666-4f02-46ef-812d-d847b984c53d\"}"},{"__ref":"DeepDives:{\"uuid\":\"8b6038bf-552e-4e4d-937f-a91f43e4b8e8\"}"},{"__ref":"DeepDives:{\"uuid\":\"5fce63fe-4a74-4013-a8c2-ca51c95bd389\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c3e72094-ea5d-413f-a45c-ba83efa7eb42/-/preview/-/format/jpg/","https://ucarecdn.com/1e706c9e-fb0e-475e-be92-cfe480eb0376/-/preview/-/format/jpg/","https://ucarecdn.com/a3695876-d694-4b7b-a3be-42a120eec18f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"11723880-a2cf-4f6e-a8fa-904b21d698e5\"}"},{"__ref":"Education:{\"uuid\":\"0a76b11a-1fbb-48cd-aae7-aa24a2540b02\"}"}],"hiredAt":"2023-07-12T21:00:47.651Z","topics":["History Project","Philosophy","Literature","Women \u0026 Gender Studies","Race \u0026 Ethnicity","Debate","Writing","French"],"communityBadges":["https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ilyana-benjelloun-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ebbfe1b5-1056-4209-a4ff-2b53a14f787a\"}"}}},"_sentryTraceData":"6d62d1a2a2db47a3aa102ff3a0567215-b8685d5138d54a97-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=6d62d1a2a2db47a3aa102ff3a0567215,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"ilyana-benjelloun-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
