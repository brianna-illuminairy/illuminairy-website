xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"11cacea3-ca83-4f04-aa61-9ce5f8aabbdf\"}":{"__typename":"Favorites","uuid":"11cacea3-ca83-4f04-aa61-9ce5f8aabbdf","photoUrl":"https://ucarecdn.com/3e91097b-8e72-47a2-904f-9374fc7bbd81/","title":"Hamilton","type":"PLAY"},"Favorites:{\"uuid\":\"26bf0631-5519-47cc-9aac-7c316e8a0d2d\"}":{"__typename":"Favorites","uuid":"26bf0631-5519-47cc-9aac-7c316e8a0d2d","photoUrl":"https://ucarecdn.com/5f54bc40-823f-431f-99c1-8d4c0f73296c/","title":"Volleyball","type":"SPORT"},"Favorites:{\"uuid\":\"5dee4219-fdd1-4fb9-a0de-317a498c2534\"}":{"__typename":"Favorites","uuid":"5dee4219-fdd1-4fb9-a0de-317a498c2534","photoUrl":"https://ucarecdn.com/513c0c0f-75f2-449a-bb52-1f6d26872174/","title":"Madrid","type":"CITY"},"CausesSupported:{\"uuid\":\"4336027d-a957-45db-9b8e-1a7ef577d5ce\"}":{"__typename":"CausesSupported","uuid":"4336027d-a957-45db-9b8e-1a7ef577d5ce","name":"Kode with Klossy","description":"\u003cbr\u003e\u003cp\u003eI worked with this organization to teach girls how to build their own apps!\u003c/p\u003e\u003cbr\u003e","photoUrl":"https://ucarecdn.com/885e6fdc-82c1-435f-8c69-5d22efdbac8b/"},"CausesSupported:{\"uuid\":\"f041e484-bfc9-4192-8206-c6e7e721dace\"}":{"__typename":"CausesSupported","uuid":"f041e484-bfc9-4192-8206-c6e7e721dace","name":"Make-A-Wish Foundation","description":"\u003cbr\u003e\u003cp\u003eI've gotten to volunteer with this cause and meet so many inspiring Wish Kids!\u003c/p\u003e\u003cbr\u003e","photoUrl":"https://ucarecdn.com/495c81a9-6d2e-4bbd-a3b8-66d179bbbb5b/"},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"3a349c41-5151-4254-9b7c-c28c6285c539\"}":{"__typename":"DeepDives","uuid":"3a349c41-5151-4254-9b7c-c28c6285c539","content":"\u003cp\u003eIn high school, I was a pretty adventurous student! I didn't have a single favorite subject or excel in one particular area, which made it difficult for me to envision a clear path for my future. Because of this uncertainty about what I liked or what I was best at, I pursued every opportunity that came my way. From non-profit work to computer science classes to volleyball, I explored every activity I could in the pursuit of finding what I loved. This exploration led me to meet so many amazing people and discover unique opportunities—eventually sparking my interest in strategy work and technology innovation, careers I had never known existed!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1e6c3774-9c24-48eb-814e-8500825480ec\"}":{"__typename":"DeepDives","uuid":"1e6c3774-9c24-48eb-814e-8500825480ec","content":"\u003cp\u003eA passion project I worked on in high school was an event I helped organize called a 'Street Store.' This is an event we held annually at a local homeless shelter, where less fortunate members of the community could come into the store and, with the help of volunteers, find outfits that fit them and that they enjoy wearing. After months of collecting and sorting donated clothes from my town, it was amazing to see the look on people's faces when we helped them find an outfit they were excited to wear!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f901e63b-0ac3-40d2-a735-9683c619833b\"}":{"__typename":"DeepDives","uuid":"f901e63b-0ac3-40d2-a735-9683c619833b","content":"\u003cp\u003eI am a huge foodie (my Instagram Explore page solely containing videos of pasta, will prove this), and trying out local cuisine and discovering new recipes has become a favorite hobby of mine! Over my four years of college, I've been lucky enough to live in Nashville, Tel Aviv, Madrid, Boston, and NYC, so one of my favorite ways to explore these new places and cultures has been through the food scene!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"34013094-e461-4629-90bd-592126b66cd3\"}":{"__typename":"DeepDives","uuid":"34013094-e461-4629-90bd-592126b66cd3","content":"\u003cp\u003eMentorship matters to me because it has opened doors to opportunities I once thought were out of reach. Through the support of mentors (be it friends, older classmates, my amazing mom), I've gained the confidence, knowledge, and connections needed to pursue my goals. It's not just about learning from someone else's experience; it's about being empowered to create a future and take action I never thought was possible!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"ce85016b-af03-43c9-924e-10cba27b3b1f\"}":{"__typename":"School","uuid":"ce85016b-af03-43c9-924e-10cba27b3b1f","name":"Ashland High School","city":"Ashland","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01721"},"Education:{\"uuid\":\"aa2878fc-20e1-47eb-9bbe-0b6c91488404\"}":{"__typename":"Education","uuid":"aa2878fc-20e1-47eb-9bbe-0b6c91488404","school":{"__ref":"School:{\"uuid\":\"ce85016b-af03-43c9-924e-10cba27b3b1f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}":{"__typename":"School","uuid":"b08ee93f-feae-4e43-97fb-f48dcc167ea8","name":"Vanderbilt University","city":"Nashville","type":"COLLEGE","state":"Tennessee","country":"United States","zip":"37235"},"Education:{\"uuid\":\"1a95f26e-ae47-4aea-a52b-6f5209319bd6\"}":{"__typename":"Education","uuid":"1a95f26e-ae47-4aea-a52b-6f5209319bd6","school":{"__ref":"School:{\"uuid\":\"b08ee93f-feae-4e43-97fb-f48dcc167ea8\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Human and Organizational Development with a Computer Science Minor","degree":null},"MentorPublicProfile:{\"uuid\":\"a58d46e3-ab30-4af6-aba9-7295ca09cb25\"}":{"__typename":"MentorPublicProfile","uuid":"a58d46e3-ab30-4af6-aba9-7295ca09cb25","displayName":"Rebecca D.","slug":"rebecca-debenedictis","biography":"\u003cp\u003eHi everyone! My name is Rebecca and I’m currently a student at Vanderbilt University, majoring in Human and Organizational Development and minoring in Computer Science. I am originally from a small town in Massachusetts, and I have a passion for traveling, cooking, and coming up with the perfect coffee recipes (current obsession is blueberry coffee with oat milk). The photo in my profile is from one of my favorite travel experiences—riding a four-wheeler through the Moroccan desert! I have been lucky enough over the past three years to have lived/worked in Nashville, Tel Aviv, Madrid, NYC, and Boston, which has let me see so many amazing places and meet so many new people!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am passionate about the fields of technology, business, and non-profit work, and want to use innovation to change the world for the better. Through my time at school I have gotten to consult with local non-profits, giving them strategy advice to help expand the amazing work they do in the Nashville area. I am also very passionate about female empowerment, and have taken active leadership roles on campus in Women in Business, and Women in Computing!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love mentoring and teaching other students, and have been a Computer Science Teaching Assistant for  introductory coding courses at Vanderbilt for the past two and a half years. I also spent two summers working with 100+ girls as an Instructor Assistant at Kode with Klossy - teaching them how to build apps!\u003cbr\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"ROd5wZ8YJGxiEg68B02UjPl1FgAH00FpZs9xqxPHX67Tk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"11cacea3-ca83-4f04-aa61-9ce5f8aabbdf\"}"},{"__ref":"Favorites:{\"uuid\":\"26bf0631-5519-47cc-9aac-7c316e8a0d2d\"}"},{"__ref":"Favorites:{\"uuid\":\"5dee4219-fdd1-4fb9-a0de-317a498c2534\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"4336027d-a957-45db-9b8e-1a7ef577d5ce\"}"},{"__ref":"CausesSupported:{\"uuid\":\"f041e484-bfc9-4192-8206-c6e7e721dace\"}"}],"major":"Human and Organizational Development with a Computer Science Minor","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3a349c41-5151-4254-9b7c-c28c6285c539\"}"},{"__ref":"DeepDives:{\"uuid\":\"1e6c3774-9c24-48eb-814e-8500825480ec\"}"},{"__ref":"DeepDives:{\"uuid\":\"f901e63b-0ac3-40d2-a735-9683c619833b\"}"},{"__ref":"DeepDives:{\"uuid\":\"34013094-e461-4629-90bd-592126b66cd3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e85fb712-b1d1-4f57-9340-81fd64e18ee5/-/preview/-/format/jpg/","https://ucarecdn.com/6e7f5475-4c20-4b93-b9fd-231ded6da239/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"aa2878fc-20e1-47eb-9bbe-0b6c91488404\"}"},{"__ref":"E
