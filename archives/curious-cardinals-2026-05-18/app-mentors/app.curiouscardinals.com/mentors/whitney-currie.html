xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"814d04bc-1804-430e-9db6-4d720518c6ba\"}":{"__typename":"DeepDives","uuid":"814d04bc-1804-430e-9db6-4d720518c6ba","content":"\u003cp\u003eMy dream job is to become a Physical Medicine and Rehabilitation Physician. To me, becoming a doctor is such a privileged to work alongside individuals at a vulnerable time in their life, building this relationship founded on trust. As an athlete, I understand how health plays a significant role in achieving goals and living to one's potential, and I hope to be an active listener and advocate for my patients to care for this holistic well-being. I am interesting in PM\u0026amp;R due to the complex intersectionality of Neurological and Musculoskeletal systems, and believe its an area of medicine where the physician relationships strengthens through a continuity of care!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"ca5e0158-e621-47a6-a02d-a88dc90f9b30\"}":{"__typename":"DeepDives","uuid":"ca5e0158-e621-47a6-a02d-a88dc90f9b30","content":"\u003cp\u003eI am really proud of starting Athletes in Pre-Health because it created a space for student-athletes who were passionate about healthcare to support one another. Balancing sports and pre-health academics can be challenging, and I wanted to build a community where people could share resources, connect with mentors, and feel encouraged. Seeing it grow into a supportive network that continues to help others has been one of my favorite accomplishments.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"53a7d8de-dd36-45fa-9cb6-e0f3655212d1\"}":{"__typename":"DeepDives","uuid":"53a7d8de-dd36-45fa-9cb6-e0f3655212d1","content":"\u003cp\u003emy family is my greatest source of motivation. No family is perfect, but I never once doubted the love and care they had for me and my future. I was blessed that my mom was able to be very involved in raising me, and she sacrificed a lot of her professional career to be there for my siblings and me. On the other hand, my dad build a successful career off of his dedication and hard work, and I try to model his perseverance and ethic in the work I do as well.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9414dd10-3e3f-493b-8d86-c38947dfa338\"}":{"__typename":"DeepDives","uuid":"9414dd10-3e3f-493b-8d86-c38947dfa338","content":"\u003cp\u003eMentorship matters to me because it has shaped who I am. As the youngest of four, I always looked up to my older siblings as my first mentors, and they showed me the value of guidance and encouragement. Later, as an ASLA tutor at Northwestern, I realized that mentorship is not just about teaching—it is about learning alongside someone, sharing curiosity, and growing together. Getting to work with students and watch them explore their own interests feels full circle for me, and it continues to fuel my own drive to keep learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"dbd7feae-121d-4eaa-b79e-2a51fbcfaf8a\"}":{"__typename":"School","uuid":"dbd7feae-121d-4eaa-b79e-2a51fbcfaf8a","name":"Forest Hill Central","city":"Grand Rapids","type":"HIGH","state":"Michigan","country":"United States","zip":"49546"},"Education:{\"uuid\":\"9934f9ae-dafe-4956-bc59-569764cf6511\"}":{"__typename":"Education","uuid":"9934f9ae-dafe-4956-bc59-569764cf6511","school":{"__ref":"School:{\"uuid\":\"dbd7feae-121d-4eaa-b79e-2a51fbcfaf8a\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"d133a45b-9127-4d63-a2c7-d6662ea42a28\"}":{"__typename":"Education","uuid":"d133a45b-9127-4d63-a2c7-d6662ea42a28","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biology and Global Health","degree":null},"MentorPublicProfile:{\"uuid\":\"68e31501-4e94-4db6-8486-b62abc91b725\"}":{"__typename":"MentorPublicProfile","uuid":"68e31501-4e94-4db6-8486-b62abc91b725","displayName":"Whitney C.","slug":"whitney-currie","biography":"\u003cp\u003eHi, my name is Whitney! I am originally from Grand Rapids, Michigan, but I live in Chicago now. I graduated from Northwestern University, where I double majored in Biology and Global Health with a concentration in Human Health and Disease. While I loved what I studied, one of the most memorable parts of my time at Northwestern was being a student-athlete. I ran Cross Country and Track for the university and competing at that level taught me so much about balance, teamwork, and pushing myself beyond what I thought was possible. I ran the 6k for cross country, and the 5k and 10k for track, and loved the way running allowed me to show consistent progress and focus on long-term development. My biggest strengths in running are being consistent and resilient, and I used those to push myself and my teammates towards our goals.  \u003c/p\u003e\u003cp\u003eI also enjoyed being involved on campus in other ways. I founded and served as president of Athletes in Pre-Health, a group that created a community for student-athletes who were interested in healthcare. I also worked as an Academic Support peer mentor, which gave me the chance to connect with other Northwestern students and support them in their academic journeys. Both of these roles were really rewarding because they let me combine leadership with mentorship, two things I truly enjoy.\u003c/p\u003e\u003cp\u003eOutside of school, I’ve always loved finding ways to give back through athletics. Coaching for Special Olympics has been one of the most meaningful experiences in my life. I love encouraging athletes, celebrating their progress, and watching the pure joy that comes from competing and being part of a team. I am also part of RunYourCity, an international nonprofit that helps children get involved in running. As an executive member, I’ve been able to help grow programs that make running accessible and fun for kids, which combines my passion for health with my love for the sport.\u003c/p\u003e\u003cp\u003eWhen I am not working or volunteering, you can usually find me running along the lakefront, exploring new coffee shops, or spending time with friends and family. I love being outdoors, staying active, and connecting with people who inspire me.\u003c/p\u003e\u003cp\u003eOverall, I would describe myself as someone who is passionate about health, community, and making space for others to succeed. I feel the most energized when I am combining my love for science with my love for people, and I always try to bring enthusiasm, curiosity, and kindness into the work that I do.\u003c/p\u003e","teachingVideoPlaybackId":"B8Xuey5OYNesok5d5p01rRadLJ02CHupu6VbmFPMf00zmw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology and Global Health","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"814d04bc-1804-430e-9db6-4d720518c6ba\"}"},{"__ref":"DeepDives:{\"uuid\":\"ca5e0158-e621-47a6-a02d-a88dc90f9b30\"}"},{"__ref":"DeepDives:{\"uuid\":\"53a7d8de-dd36-45fa-9cb6-e0f3655212d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"9414dd10-3e3f-493b-8d86-c38947dfa338\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/73f51e88-f342-4a82-84fa-5a1db91af4a5/-/preview/-/format/jpg/","https://ucarecdn.com/43be40cc-a557-40c1-a836-57ea35116f4f/-/preview/-/format/jpg/","https://ucarecdn.com/12ae1538-0a97-482e-876d-c492a78565f1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9934f9ae-dafe-4956-bc59-569764cf6511\"}"},{"__ref":"Education:{\"uuid\":\"d133a45b-9127-4d63-a2c7-d6662ea42a28\"}"}],"hiredAt":"2025-09-04T19:21:19.445Z","topics":["Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Fashion / Cosmetics","K-6 Storybook","Medicine / Health","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"whitney-currie\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"68e31501-4e94-4db6-8486-b62abc91b725\"}"}}},"_sentryTraceData":"2f2211a080db476986e75c0cfa4c45c6-947b7551970eb292-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,
