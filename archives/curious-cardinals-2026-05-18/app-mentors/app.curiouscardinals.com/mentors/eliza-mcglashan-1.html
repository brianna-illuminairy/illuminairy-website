":{"__typename":"DeepDives","uuid":"fc7fa785-bfc8-40e3-85a9-9a673e53e0d9","content":null,"videoPlaybackId":"UZyJI3eMPFexOPiKMFj4x7PMJNZ3tYITfiKzvK01z34I","question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"91979609-7422-4e43-a298-b60518f6e327\"}":{"__typename":"DeepDives","uuid":"91979609-7422-4e43-a298-b60518f6e327","content":null,"videoPlaybackId":"wkLr00hfYTBuOPG6O9702vXKj5Iwl79kNds3cbiEHFjUQ","question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"37571ef9-d521-4aaf-951d-620a8783d720\"}":{"__typename":"DeepDives","uuid":"37571ef9-d521-4aaf-951d-620a8783d720","content":"\u003cp\u003eHere are some of the niche things I enjoy:\u003c/p\u003e\u003col class=\"list-decimal list-inside\"\u003e\u003cli\u003e\u003cp\u003e Doing coloring books\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eGeography games (My record time to put every country in the world on a map is 11 minutes 37 seconds)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePickleball\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWatching Premier League and playing fantasy soccer\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDancing!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBaking, especially banana bread and pies\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAnything involving a lake (paddle boarding, kayaking, waterskiing, wakeboarding, swimming, sunbathing, ANYTHING!)\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"377d7653-f87b-4f5e-bd37-781b2d1c44cd\"}":{"__typename":"School","uuid":"377d7653-f87b-4f5e-bd37-781b2d1c44cd","name":"Berkeley High School","city":"Berkeley","type":"HIGH","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"0631aca3-513c-42e2-b84d-8af9cc5b75fb\"}":{"__typename":"Education","uuid":"0631aca3-513c-42e2-b84d-8af9cc5b75fb","school":{"__ref":"School:{\"uuid\":\"377d7653-f87b-4f5e-bd37-781b2d1c44cd\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"45b8fcc4-6135-414d-b489-09e4240912a1\"}":{"__typename":"Education","uuid":"45b8fcc4-6135-414d-b489-09e4240912a1","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Political Science","degree":null},"Testimonial:d56381b1-1f19-4483-9714-8d0fde64f73b":{"__typename":"Testimonial","id":"d56381b1-1f19-4483-9714-8d0fde64f73b","text":"Eliza has been a game-changer in guiding my daughter through the college application process. From personalized study plans to expert guidance on essay writing to time management, her approach has been both strategic and supportive throughout the journey.  \n\nWhere Eliza truly shines is in helping my child find her voice, identify her personal narrative, and being able to articulate her strengths. Most importantly, my daughter has become more confident - not just in college, but about herself and what she brings to the table. \n\nThe detailed session notes and actionable suggestions for us as parents to better support our child are incredibly helpful too. We highly recommend Eliza!","date":"2025-05-28 03:53:05.39+00","rating":5,"endorser":{"__typename":"Endorser","name":"Jenn C","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"13c29039-4bab-416c-91af-e1d01652d75e\"}":{"__typename":"MentorPublicProfile","uuid":"13c29039-4bab-416c-91af-e1d01652d75e","displayName":"Eliza M.","slug":"eliza-mcglashan-1","biography":"\u003cp\u003eHi! My name is Eliza McGlashan and I’m currently a first year at UCLA studying Political Science and Statistics \u0026amp; Data Science.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy drive and ambition make me who I am. Growing up in Berkeley, CA and now attending UCLA, I’ve always attended the largest public schools. In these environments, I’ve learned to advocate for myself and take initiative – whether that means joining a new organization, pushing myself in challenging courses, or stepping into leadership roles. This mindset has led me to serve as class president at my high school of 4,000 students, take on leadership positions in Youth and Government, captain my swim team, and become involved in organizations like the United Nations Association, the Fellowship for International Service and Health, and the Global Development Lab here at UCLA. Continuously striving for more has shaped not only my achievements but also my approach to leadership, education, and mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I dedicated myself to swimming and water polo throughout high school, going undefeated for four years and winning three league championships. But swimming is nothing if not grueling, and the 6 a.m. practices and 20-hour training weeks instilled in me the value of hard work, discipline, and effective time management. Balancing rigorous training with school, a job, extracurriculars, and meaningful time with friends and family has taught me that the key to sustained motivation is finding intrinsic drive in everything you do and channeling your energy into what truly inspires you.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, it's deeply important to me to learn about your child as a holistic person. I’m committed to getting to know each individual student’s learning style, passions, and even weaknesses to be able to best serve them. I believe that a lesson learned may be temporary, but a love for learning is lifelong. My approach to teaching is not only to establish what a child needs to know, but also to focus on helping them find excitement in discovery, confidence in their abilities, and the skills to continue learning on their own.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love to travel, ski (snow and water), swim, read, try new things, and hang out with my dog. I love the outdoors and am always seeking an adventure. Above all, I’m at my happiest when I’m surrounded by friends and family. My community has made me who I am today, which is why I truly believe in the power of mentorship – not just as a way to teach, but as a way to inspire and uplift others.\u003c/p\u003e","teachingVideoPlaybackId":"X01DfrVJKuwMaDnWbYGq86Nc01bQgyJ025Khl45i98Cdg4","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1fb20a78-72e3-4e4b-9495-f8dd52338b83\"}"},{"__ref":"Favorites:{\"uuid\":\"c5c0025b-0c8d-41c6-8b1d-b5fb9e3071e1\"}"},{"__ref":"Favorites:{\"uuid\":\"2ffb7dde-5052-4ce3-952c-0c482c8e1659\"}"},{"__ref":"Favorites:{\"uuid\":\"257b7b79-5cc2-4df3-9943-e1b38cc567d6\"}"}],"causesSupported":[],"major":"Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1174464e-b19b-454e-9ade-186c6716fe61\"}"},{"__ref":"DeepDives:{\"uuid\":\"fc7fa785-bfc8-40e3-85a9-9a673e53e0d9\"}"},{"__ref":"DeepDives:{\"uuid\":\"91979609-7422-4e43-a298-b60518f6e327\"}"},{"__ref":"DeepDives:{\"uuid\":\"37571ef9-d521-4aaf-951d-620a8783d720\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/02964120-79eb-4b30-8ade-8244e0145224/-/preview/-/format/jpg/"
