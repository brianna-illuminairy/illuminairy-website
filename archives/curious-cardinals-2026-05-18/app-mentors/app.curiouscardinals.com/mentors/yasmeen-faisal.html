xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"45c8c242-7aff-4790-89f3-4c48f4c06b77\"}":{"__typename":"Education","uuid":"45c8c242-7aff-4790-89f3-4c48f4c06b77","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":null,"endYear":"2020","expectedGradYear":null,"major":"Psychology","degree":"B.A."},"MentorPublicProfile:{\"uuid\":\"304840b8-0baf-4d1a-8730-c22c2accd022\"}":{"__typename":"MentorPublicProfile","uuid":"304840b8-0baf-4d1a-8730-c22c2accd022","displayName":"Yasmeen F.","slug":"yasmeen-faisal","biography":"\u003cp\u003eYasmeen, is a proud native of Los Angeles and UC Berkeley alum with a B.A. in Psychology, Music, and Human-Centered. 🎓 During high school, she studied as a Vocal/Music major at the Los Angeles County High School for the Performing Arts, where she played the lead role in her musical theater shows! She was fortunate to be selected as a Posse Scholar, earning a full-tuition scholarship to UC Berkeley based on my academic achievements, community engagement, and leadership qualities. 💡 Yasmeen's passion for empowering young people and helping them reach their full potential stems from life experiences. While in college, she volunteered as a swimming instructor for children with physical and cognitive challenges, tailoring aquatic activities to improve their physical mobility, social skills, and emotional well-being. After graduating, she continued to focus on youth development, working as an RBT at Children's Healthcare of Atlanta, where she provided direct client care to strengthen the social, language, and emotional development of children with autism spectrum disorder. As a researcher, she worked in a UC Berkeley clinical psychology lab conducting a longitudinal study on the development of ADHD in women with a childhood diagnosis of ADHD. Currently, Yasmeen is a Lab Manager for the Developmental Personality Neuroscience lab at UNC-Chapel Hill, where they study the neurobehavioral systems underlying personality and individual differences, focusing on disadvantageous decision-making in young people. \u003c/p\u003e\u003cp\u003e🎨 Yasmeen is also passionate about integrating art and science to uplift communities. She is working with a doctor and an artist to help build their social media presence by designing and posting creative content such as videos and infographics! She is also collaborating with researchers for a project combining art and leveraging scientific communication to engage communities and drive meaningful impact! Outside work, Yasmeen loves to play piano, sing, mix music with her DJ board, travel, try new restaurants, and hang out with friends! \u003c/p\u003e\u003cp\u003e👩‍👧‍👦 Friends describe her as outgoing, caring, and always eager to bring people together. In August, She be starting law school to pursue a career dedicated to international human rights and implementing system-wide policy reform to support vulnerable children's physical, mental, and psychosocial needs. She is excited about what's to come! As a mentor, her mission is to inspire young people to believe in themselves and leverage their unique skill set to achieve their goals ✨ Yasmeen is patient and diligent in helping her mentees work through challenges and reach their desired results. She believes in shaping lessons that tap into creativity and problem-solving skills, which are essential for executing meaningful solutions and projects. Yasmeen is excited to work with mentees and support them in their academic endeavors and passion projects! 😊\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/95299040-0b90-4ab9-818e-a7f9be0a64ea/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"45c8c242-7aff-4790-89f3-4c48f4c06b77\"}"}],"hiredAt":"2023-01-23T23:55:41.000Z","topics":["Writing","Global Health","Music","Video / Photography","College Essay Writing","Film / Theater"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"yasmeen-faisal\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"304840b8-0baf-4d1a-8730-c22c2accd022\"}"}}},"_sentryTraceData":"0a458a1c799640d2aae5875165036aaf-b120b040a26d4967-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=0a458a1c799640d2aae5875165036aaf,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"yasmeen-faisal"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM
