pDives","uuid":"3b5020e0-ef03-4247-a9aa-49389645b183","content":"\u003cp\u003eI hope to create work that I am proud of. I really just want to have the ability to make people feel something, or think about something differently. Whether that be through the performing arts or experiential design, I want to create something that makes me fulfilled and that brings people together.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fddf7ce5-9191-4d4c-80b6-8e4c1e52f08c\"}":{"__typename":"DeepDives","uuid":"fddf7ce5-9191-4d4c-80b6-8e4c1e52f08c","content":"\u003cp\u003eMentorship is everything to me. Being able to help the next generation be excited about their passions and work on something productive and meaningful to them is so important to me. By helping others and learning from them, I am in turn becoming inspired.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"68f0dd5e-326d-488c-8d04-ef45cad680af\"}":{"__typename":"School","uuid":"68f0dd5e-326d-488c-8d04-ef45cad680af","name":"Pacific Ridge School","city":"Carlsbad","type":"HIGH","state":"California","country":"United States","zip":"92009"},"Education:{\"uuid\":\"248d9252-690e-4609-8ccb-0dc88ae29b8e\"}":{"__typename":"Education","uuid":"248d9252-690e-4609-8ccb-0dc88ae29b8e","school":{"__ref":"School:{\"uuid\":\"68f0dd5e-326d-488c-8d04-ef45cad680af\"}"},"startYear":"2015","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"30876a0c-79a8-4b1f-a0ef-7fcb77a6c411\"}":{"__typename":"Education","uuid":"30876a0c-79a8-4b1f-a0ef-7fcb77a6c411","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Design Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"6a5cd556-f094-4b3e-9991-e7ffcb8b0280\"}":{"__typename":"MentorPublicProfile","uuid":"6a5cd556-f094-4b3e-9991-e7ffcb8b0280","displayName":"Brianna I.","slug":"brianna-ilit","biography":"\u003cp\u003eBrianna Freeman is a Stanford student from San Diego majoring in design engineering. She has a deep passion for the performing arts, having directed the musical \u003cem\u003eA Chorus Line\u003c/em\u003e with Stanford’s Rams Head Theatrical Society, competed in international dance competitions such as the Youth America Grand Prix, and created student short films, where she has experience both behind and in front of the camera. At Stanford, she is active on three dance teams—ballet, hip-hop, and contemporary—and also enjoys singing jazz standards at local coffee shops and performing with friends.\u003c/p\u003e\u003cp\u003eBrianna has interned at Paramount Pictures, where she gained experience in script coverage. Academically, she is studying graphic design using Figma, computer-aided design for laser-cutting, and design thinking from IDEO founder David Kelley. She is particularly interested in how these disciplines can be combined to create meaningful and immersive experiences, such as innovative theater that seamlessly integrates performance with creative set design.\u003c/p\u003e\u003cp\u003eBrianna’s favorite movie is \u003cem\u003eLa La Land\u003c/em\u003e, and she is enthusiastic about guiding her mentees in exploring their creativity and passions. Her goal is to be their biggest supporter, helping them navigate their creative process, and most importantly, to create something they a
