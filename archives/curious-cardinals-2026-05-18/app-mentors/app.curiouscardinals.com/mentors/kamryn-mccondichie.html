xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f60beba8-fdb7-403a-95d6-b35ee6ec7b3d\"}":{"__typename":"Favorites","uuid":"f60beba8-fdb7-403a-95d6-b35ee6ec7b3d","photoUrl":"https://ucarecdn.com/81c66af9-66d8-433d-82bc-5dc742436f06/","title":"\"I Can Wait\" - teeawgo, Alan Wonders","type":"SONG"},"Favorites:{\"uuid\":\"fad88d66-61ea-4779-b19f-6ff766c7aefc\"}":{"__typename":"Favorites","uuid":"fad88d66-61ea-4779-b19f-6ff766c7aefc","photoUrl":"https://ucarecdn.com/17ab04a3-e5c0-46c2-91ca-bb28e5851f37/","title":"Spiderman: Into the Spiderverse","type":"MOVIE"},"Favorites:{\"uuid\":\"c96a5db8-75dc-4ea3-8912-c2bb5bff6651\"}":{"__typename":"Favorites","uuid":"c96a5db8-75dc-4ea3-8912-c2bb5bff6651","photoUrl":"https://ucarecdn.com/f61cdb35-2594-4ba7-a82e-14fb8c94991f/","title":"Hadestown","type":"PLAY"},"CausesSupported:{\"uuid\":\"528aab8c-bcbe-4735-8d0e-29a5ce64decb\"}":{"__typename":"CausesSupported","uuid":"528aab8c-bcbe-4735-8d0e-29a5ce64decb","name":"Center for Intersectional Justice","description":"\u003cp\u003eNone of us are free until ALL of us are free.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/296eebf5-68de-4d69-bc32-ea47602cbb7f/"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"839e080c-0f30-47e3-aee2-6c92880a9494\"}":{"__typename":"DeepDives","uuid":"839e080c-0f30-47e3-aee2-6c92880a9494","content":"\u003cp\u003eMy greatest source of inspiration is my desire to improve the wellbeing of all conscious beings, human and nonhuman. I believe deeply that we have the technology, material resources, and psychological capabilities necessary to eliminate the systems and structures that perpetuate and profit from the destruction of the environment, the displacement of indigenous peoples, the disenfranchisement of hundreds of millions of voices, the impoverishment of the global south and our own communities, and the disintegration of genuine connections within and between individuals due to arbitrary tribal distinctions. I educate in the hopes of drawing into focus where our problems lie, what potential solutions exist, and what questions remain unanswered. To me, a majority of our problems arise due to lacking sufficient understanding of the theoretical systems dictating our material structures and a deficient understanding of the material structures dictating our theoretical systems. The solution, then, must be expanding the sphere of our collective understanding - both in terms of widening our theoretical scope and increasing the number of individuals participating in the construction and excavation of knowledge.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9a5efb9f-c0f3-410b-87af-0a870aa0653e\"}":{"__typename":"DeepDives","uuid":"9a5efb9f-c0f3-410b-87af-0a870aa0653e","content":"\u003cp\u003eMy main passion project at the moment is the creation of a digital syllabus consisting of YouTube videos on the subjects pertinent to the intersection of my philosophical, political, and personal interests. This digital syllabus - who I refer to as Phil - is an exploration of many subjects: ranging from videos explaining the material sciences of physics, neuroscience, cognitive science, linguistics, and artificial intelligence, to debates pertaining to free will and responsibility, consciousness, egalitarianism, religion, and AI-ethics, to video essays on critical theories of race, gender, sexuality, class, and disability in the realms of literary, legal, economic, political, historical, educational, and cultural critique as they pertain to media such as anime, video games, art, and music. In creating Phil, I am synthesizing education and entertainment into a comprehensive, yet digestible, selection of work that informs many of my thoughts and actions.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"592b1bcd-175f-4a63-8caa-aef9966515f9\"}":{"__typename":"DeepDives","uuid":"592b1bcd-175f-4a63-8caa-aef9966515f9","content":"\u003cp\u003eThe thing I hope most to achieve within my life is to become an educator. More specifically, I would like to become a professor, public speaker, politician, or author who proliferates ideas that transcend my material existence through the alteration of the hearts and minds of the individuals I come into contact with. I want to normalize schools of thought that unveil many of the commonly held illusions dominating humanity’s self-perception, our relationships with one another, and our relationship to the rest of the natural world. I want to denaturalize the notion of “the self” as a divisive, suffering-inducing, and socially contingent construction fabricated to maintain structures and systems of domination. I want to normalize the idea of universalizing democracy, free association, and mutual aid to encompass all of our interpersonal and structural relationships whether those be our educational institutions, workplaces, or governments or our familial, fraternal, or professional relationships. Most of all, I want to normalize the possibility that we are capable of the collective pursuit of knowledge and distribution of material and social resources for the benefit of all; this, I believe, will be achieved through my becoming an educator.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"568ec34c-bab1-432b-bbba-8ae3cc21971b\"}":{"__typename":"DeepDives","uuid":"568ec34c-bab1-432b-bbba-8ae3cc21971b","content":"\u003cp\u003eIn my free time, I enjoy reading books, playing piano, listening to music, playing video games, and watching YouTube.\u003c/p\u003e\u003cp\u003eMy favorite book genres are historical fiction, science fiction, and - naturally - philosophical texts. Some of my favorite works of textual fiction include classics like \u003cem\u003e1984 \u003c/em\u003eand \u003cem\u003eAnimal Farm \u003c/em\u003eby George Orwell, \u003cem\u003eBrave New World \u003c/em\u003eby Aldous Huxley, the \u003cem\u003eEnder’s Game \u003c/em\u003eand \u003cem\u003eEnder’s Shadow \u003c/em\u003eseries by Orson Scott Card, and \u003cem\u003eFrankenstein \u003c/em\u003eby Mary Shelley. My more eccentric book picks are \u003cem\u003eFour Views on Free Will \u003c/em\u003eby Robert Kane, John Martin Fischer, Manuel Vargas, and Derk Pereboom, \u003cem\u003eAre Prisons Obsolete \u003c/em\u003eby Angela Davis, and, the book I am currently reading, \u003cem\u003eCritique and Praxis\u003c/em\u003e by Bernard Harcourt.\u003c/p\u003e\u003cp\u003eMy most freeing activity is playing the piano; I can hardly live without it. I enjoy playing classical music from Beethoven to Chopin, 80s (like Queen, Aerosmith, Michael Jackson, and The Eagles) and contemporary pop music (like Taylor Swift, Fall Out Boy, Maroon 5, and Bruno Mars), and video game music (Pokemon, Legend of Zelda, and Super Mario). As a listener, my music taste can most succinctly be described as “chill indie hip-hop”. My favorite artists are love-sadKID, Samsa, teeawgo, again\u0026amp;again, and Abhi the Nomad.\u003c/p\u003e\u003cp\u003eLastly, my favorite video games are \u003cem\u003eSuper Smash Brothers Ultimate\u003c/em\u003e, \u003cem\u003eTetris, \u003c/em\u003eand \u003cem\u003eValorant\u003c/em\u003e. And I love YouTube channels like Philosophy Tube, F.D Signifier, Alex O’Conner, Sisuphus 55, and Knowing Better.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"d93053dd-57a7-41f4-bf54-cc4551988504\"}":{"__typename":"School","uuid":"d93053dd-57a7-41f4-bf54-cc4551988504","name":"Damien High School","city":"La Verne","type":"HIGH","state":"California","country":"United States","zip":"91750"},"Education:{\"uuid\":\"cb0aa23c-3449-4a8f-83a3-22f5b8e2f90c\"}":{"__typename":"Education","uuid":"cb0aa23c-3449-4a8f-83a3-22f5b8e2f90c","school":{"__ref":"School:{\"uuid\":\"d93053dd-57a7-41f4-bf54-cc4551988504\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"ef37e237-3bf6-4c8f-ac36-0f651249099f\"}":{"__typename":"Education","uuid":"ef37e237-3bf6-4c8f-ac36-0f651249099f","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Philosophy","degree":null},"MentorPublicProfile:{\"uuid\":\"e5cd22c2-8cf4-4084-88b7-4952f3e62632\"}":{"__typename":"MentorPublicProfile","uuid":"e5cd22c2-8cf4-4084-88b7-4952f3e62632","displayName":"Kamryn M.","slug":"kamryn-mccondichie","biography":"\u003cp\u003eHi! My name is Kam and I am a recent Stanford graduate with a degree in philosophy! With six years of experience as an educator in both one-on-one and group settings, I am passionate about helping mentees of all ages not only to excel academically but personally. Beyond assistance in the subjects listed above, I am interested more deeply in assisting in the process of helping students become who they want to be. To me, this existentialist project is most readily undergone through working with students on the college application process, particularly the personal statements and supplementary questions, engaging in book clubs, or applying abstract concepts to everyday circumstances and interpersonal relationships. Whether we are working together on solving the deep questions in life or simply prepping for a class, I hope to inspire my mentee to develop critical reflection skills that allow them to more fully understand themselves, their relation to their friends, family, and educators, and their relationship to education itself.\u003c/p\u003e\u003cp\u003eAs a philosopher rooted deeply in the Socratic, Hegelian, and Freirean schools of thought, I aim to not merely lecture mentees on the subjects that interest them, but also interrogate their intuitions on subjects so that they can come to their own independent understanding about which positions and knowledge speak most readily to their lived experiences and methods of learning. Whether those methods of learning are through reading, writing, discussing, ranting, listening, watching videos, or playing games, I aim to support my mentee's growth in a way that encourages their academic or personal development and cultivates a love for the acquisition of knowledge.\u003c/p\u003e\u003cp\u003eMy truest loves in life are philosophy, education, and freedom. I am interested in analyzing the essence of human freedom. This analysis is undergone through the lenses of both the natural sciences and political sciences: In the natural sciences, I am interested in the philosophy of physics, neuroscience, cognitive science, psychology, and linguistics, trying to understand the material structure of the human mind and intentional action. In the political sciences, I am interested in intersectional critical theory as it pertains to the realms of literary, legal, economic, political, historical, and educational critique, attempting to understand the interlocking cultural systems and structures that facilitate or hinder human freedom. Ultimately, my goal in life is to receive a Ph.D. and become a professor and author, educating and contributing to the field of philosophy in the hopes of understanding freedom and how to actualize it for all individuals.\u003c/p\u003e\u003cp\u003eIn my free time, I enjoy reading books, playing piano, playing video games, spending time with my friends and family, and watching YouTube videos about philosophy, politics, video games, anime, and music theory. In the interim period between receiving my undergraduate degree and attending graduate school, I am learning how to cook and am learning to speak Mandarin. I look forward to getting to know you!\u003c/p\u003e","teachingVideoPlaybackId":"hSwynUMd8mbd8ySc8xI7cXDVsgg4Gwkf4txYKExS9HE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003e5 years ago I wrote the following words:\u003c/p\u003e\u003cp\u003e“Epiphanies are comparable to the nature of the world. They may dawn upon the mindscape of the human psyche, like the rising of the sun in the still of a May morning, illuminating the heart and mind with serenity and security in the future; or, like the raindrops of a gentle June drizzle, they can employ a playful twist to the idea of what happiness is in one’s current condition. The beauty of nature pales in comparison to the beauty of an eye-opening epiphany; however, again like nature, an epiphany can also be a cataclysmic catastrophe that demolishes one’s mental facilities, damages one’s faith in the future, and destroys one’s fortitude and tenacity. These natural disasters encased in the mind of man can strike suddenly, like a blazing bolt of lightning, blinding and paralyzing the victim in a stupor of shocking revelation, leaving them incapacitated and unable to move forward; or they can crash and recede in relentless waves, slowly suffocating the submerged sufferer in a seemingly ceaseless sea of sadness.…[T]his final classification of epiphany has already began cascading its chilling waters onto my pyre of persistence reducing the once conflagrating flame into a faint and fleeting fire... ‘What is the point?’..., ‘Why am I doing this?’..., “Does any of this matter?” .... I look into the mirror after an indefinite amount of time and realize I am drowning, and the deafening sound of self-doubt is blaring mercilessly in my ears ‘Why? Why? Why? Why? Why!’”\u003c/p\u003e\u003cp\u003eAiring my grievances with the world, its ethics, and, ultimately, with myself in prose was the first step to \u003cstrong\u003ethe accomplishment I am most proud of: overcoming the debilitating depression that afflicted me during my adolescence.\u003c/strong\u003e Through this epiphany that questions have power, I have gradually transformed the incessant question of \"Why?\" buzzing around in my head into the productive outlet of philosophy, thereby transfiguring myself into an individual who, rather than being frozen by my fears and sadness, is empowered and invigorated by the drive to overcome the material and cultural circumstances that result in depression.\u003c/p\u003e\u003cp\u003eThis overcoming of my depression is small in the grand scheme of my aims in life, but it was the catalyst for my perpetuation, my self-realization, and my eventual self-actualization as a philosopher. My next greatest achievement will be as an educator and mentor, expanding the sphere of self-realization and self-actualization, one person at a time.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f60beba8-fdb7-403a-95d6-b35ee6ec7b3d\"}"},{"__ref":"Favorites:{\"uuid\":\"fad88d66-61ea-4779-b19f-6ff766c7aefc\"}"},{"__ref":"Favorites:{\"uuid\":\"c96a5db8-75dc-4ea3-8912-c2bb5bff6651\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"528aab8c-bcbe-4735-8d0e-29a5ce64decb\"}"}],"major":"Philosophy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"839e080c-0f30-47e3-aee2-6c92880a9494\"}"},{"__ref":"DeepDives:{\"uuid\":\"9a5efb9f-c0f3-410b-87af-0a870aa0653e\"}"},{"__ref":"DeepDives:{\"uuid\":\"592b1bcd-175f-4a63-8caa-aef9966515f9\"}"},{"__ref":"DeepDives:{\"uuid\":\"568ec34c-bab1-432b-bbba-8ae3cc21971b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6973f2ea-2186-44e5-8c1c-fa37b5dfaf5a/-/preview/-/format/jpg/","https://ucarecdn.com/a5e55671-8918-4fc8-a4ea-f0b0cd457cb6/-/preview/-/format/jpg/","https://ucarecdn.com/9486b32f-e438-40a4-86fa-96c1bbdf0af1/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cb0aa23c-3449-4a8f-83a3-22f5b8e2f90c\"}"},{"__ref":"Education:{\"uuid\":\"ef37e237-3bf6-4c8f-ac36-0f651249099f\"}"}],"hiredAt":"2023-07-06T20:01:18.204Z","topics":["Algebra I","Algebra II","Pre-Algebra","Calculus","6-8 Grade Science","Biology","Physics","Writing","German","Academic Coaching","Reading","History","College Essay Writing","Executive Function","Creative Writing","History Project","Law / Government / Policy","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kamryn-mccondichie\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"e5cd22c2-8cf4-4084-88b7-4952f3e62632\"}"}}},"_sentryTraceData":"fae3c24d4d5d47f0b3a92b79d48fdd84-9580239
