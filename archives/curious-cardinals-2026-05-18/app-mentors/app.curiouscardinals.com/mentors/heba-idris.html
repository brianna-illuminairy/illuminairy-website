xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d77ea64f-c354-4f55-93e1-c31cf2b4173c\"}":{"__typename":"Favorites","uuid":"d77ea64f-c354-4f55-93e1-c31cf2b4173c","photoUrl":"https://ucarecdn.com/c741555e-98e4-4259-97f3-3aa2968572a5/","title":"Noah Kahan","type":"ARTIST"},"Favorites:{\"uuid\":\"914894ff-362a-4ae8-add2-16992fc4bb23\"}":{"__typename":"Favorites","uuid":"914894ff-362a-4ae8-add2-16992fc4bb23","photoUrl":"https://ucarecdn.com/b1a73bc7-f076-427a-9de5-921bb1e033a4/","title":"Penn Badgley","type":"ACTOR"},"Favorites:{\"uuid\":\"f1cda996-b797-4922-b500-7719c1cfb6fc\"}":{"__typename":"Favorites","uuid":"f1cda996-b797-4922-b500-7719c1cfb6fc","photoUrl":"https://ucarecdn.com/267e155c-313e-4202-b055-b83b95429db4/","title":"Love","type":"SONG"},"CausesSupported:{\"uuid\":\"4d5b95ad-dc47-43bd-ad72-4db449199859\"}":{"__typename":"CausesSupported","uuid":"4d5b95ad-dc47-43bd-ad72-4db449199859","name":"Mental Health","description":"\u003cp\u003eMental health matters—everyone deserves support, care, and understanding.\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5289c013-5a97-4b35-bdd0-d60fe93bd373\"}":{"__typename":"DeepDives","uuid":"5289c013-5a97-4b35-bdd0-d60fe93bd373","content":"\u003cp\u003eIf I could give my middle or high school self one piece of advice, it would be this: just do it. As simple as it sounds, it’s powerful. My parents always told me, “You miss 100% of the shots you don’t take,” and they were right. Don’t overthink, don’t hesitate—take the opportunity. You’ll grow so much more by trying than by wondering \u003cem\u003ewhat if\u003c/em\u003e.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"d734afcf-f245-4d4f-bd4c-569da3c14f35\"}":{"__typename":"DeepDives","uuid":"d734afcf-f245-4d4f-bd4c-569da3c14f35","content":"\u003cp\u003eHelping my student build a mental health website for low-income teenagers in Los Angeles, which became successful enough that she presented it at the summer symposium, is something I'm incredibly proud of. Watching her discover a deeper passion for psychology through that process is exactly what mentorship means to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"98fd6efc-c15e-459e-8e5e-8ea6fbbf6c49\"}":{"__typename":"DeepDives","uuid":"98fd6efc-c15e-459e-8e5e-8ea6fbbf6c49","content":"\u003cp\u003eGrowing up Sudanese and as a Black hijabi, I rarely saw anyone who looked like me in medicine or academia, which made those spaces feel distant at times. That experience drives me to mentor with intention, because representation matters and I want every student I work with to feel like their path is possible regardless of who they are.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"fe08363a-6418-4163-a3b0-6bc056a311ee\"}":{"__typename":"DeepDives","uuid":"fe08363a-6418-4163-a3b0-6bc056a311ee","content":"\u003cp\u003eVisiting all continents definitely, and yes, even Antarctica.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"caba9070-7a32-4bdc-bbb7-564c10d4ff87\"}":{"__typename":"School","uuid":"caba9070-7a32-4bdc-bbb7-564c10d4ff87","name":"Fort Hamilton High School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"11209"},"Education:{\"uuid\":\"5f921874-9d47-4f22-8f00-5de5cb5571fd\"}":{"__typename":"Education","uuid":"5f921874-9d47-4f22-8f00-5de5cb5571fd","school":{"__ref":"School:{\"uuid\":\"caba9070-7a32-4bdc-bbb7-564c10d4ff87\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"b88984ff-369c-4f90-b89e-579abe2d47fe\"}":{"__typename":"Education","uuid":"b88984ff-369c-4f90-b89e-579abe2d47fe","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Human Development and Biology Major, Business Minor","degree":null},"MentorPublicProfile:{\"uuid\":\"3759014c-d886-4671-b960-2f1a04cea89a\"}":{"__typename":"MentorPublicProfile","uuid":"3759014c-d886-4671-b960-2f1a04cea89a","displayName":"Heba I.","slug":"heba-idris","biography":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi everyone! My name is Heba Idris, and I’m a sophomore at Cornell University studying Human development and Biological sciences with a minor in business on the pre-dental track. I’ve always been passionate about science, especially biology, and I chose this path because I love hands-on learning and solving real-world problems. After finishing my undergraduate degree, I plan to attend dental or and pursue a career in oral health. I’m excited about the idea of helping people through both science and care, and I bring that same excitement and curiosity into everything I do.\u003c/p\u003e\u003cp\u003eOne of the biggest reasons I joined Curious Cardinals is because I truly love teaching and connecting with others. I’ve spent so much time helping my younger sister, from figuring out long division to tackling tricky history packets, and those moments made me realize how rewarding it is to support someone’s learning journey. Whether it’s breaking down a tough topic or helping someone feel more confident in what they’re passionate about, I’m here for it. I want to create a space where learning feels fun, motivating, and meaningful.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, I try to stay active and creative. I’ve been playing lacrosse my whole life, and I even go back to my high school to help coach the team. I also love to sing and am working with one of my closest friends at Cornell to start a band, we’re doing covers now, but hopefully originals soon! In my free time, I’m always looking for new cafes to try (I’m a total foodie), I love biking and skating when the weather is nice, and I’m always watching mystery and crime shows like \u003cem\u003eLaw \u0026amp; Order\u003c/em\u003e. Music-wise, I’m a huge fan of Harry Styles and Noah Kahan. On campus, I’m involved in Rho Psi Eta, a pre-health sorority that helps students prepare for careers in medicine, dentistry, veterinary care, and research.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnd just for fun, here’s a little something that makes me unique: I’m a total geography geek. I know all 196 countries and their flags! I’m all about learning in and out of the classroom, and I love bringing energy, creativity, and care to every space I’m in. I can’t wait to help students feel confident, curious, and excited about what they’re learning.\u003c/p\u003e","teachingVideoPlaybackId":"EdxixJLWEPPKupX024icVo2xW66apyVRzK2qC1022jRiM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eDuring my senior year of high school, I had won City Championships in NYC with my Lacrosse team.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d77ea64f-c354-4f55-93e1-c31cf2b4173c\"}"},{"__ref":"Favorites:{\"uuid\":\"914894ff-362a-4ae8-add2-16992fc4bb23\"}"},{"__ref":"Favorites:{\"uuid\":\"f1cda996-b797-4922-b500-7719c1cfb6fc\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"4d5b95ad-dc47-43bd-ad72-4db449199859\"}"}],"major":"Human Development and Biology Major, Business Minor","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5289c013-5a97-4b35-bdd0-d60fe93bd373\"}"},{"__ref":"DeepDives:{\"uuid\":\"d734afcf-f245-4d4f-bd4c-569da3c14f35\"}"},{"__ref":"DeepDives:{\"uuid\":\"98fd6efc-c15e-459e-8e5e-8ea6fbbf6c49\"}"},{"__ref":"DeepDives:{\"uuid\":\"fe08363a-6418-4163-a3b0-6bc056a311ee\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/30adc97d-918c-4d49-959e-aa15ae9fe493/-/preview/-/format/jpg/","https://ucarecdn.com/34696412-ec15-44ce-975d-5a9425422a41/-/preview/-/format/jpg/","https://ucarecdn.com/71e22cc1-f3af-422e-b800-1c1a8d8fcfbe/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5f921874-9d47-4f22-8f00-5de5cb5571fd\"}"},{"__ref":"Education:{\"uuid\":\"b88984ff-369c-4f90-b89e-579abe2d47fe\"}"}],"hiredAt":"2025-04-22T00:22:13.232Z","topics":["Algebra I","Algebra II","K-5 Grade Math","Pre-Algebra","Statistics","6-8 Grade Science","Biology","Writing","Academic Coaching","College Essay Writing","History","Reading","Creative Writing","History Project","Medicine / Health","STEM Project","Debate","Sustainabili
