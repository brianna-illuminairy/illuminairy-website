xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c9598ccd-e120-4041-afc1-3b4fbc87cd4e\"}":{"__typename":"Favorites","uuid":"c9598ccd-e120-4041-afc1-3b4fbc87cd4e","photoUrl":"https://ucarecdn.com/95793c8b-57df-4d9a-8ec5-dd98dc7fa19f/","title":"Matt Damon","type":"ACTOR"},"Favorites:{\"uuid\":\"f6b397fc-92ea-41aa-bd1a-4247ac87d233\"}":{"__typename":"Favorites","uuid":"f6b397fc-92ea-41aa-bd1a-4247ac87d233","photoUrl":"https://ucarecdn.com/12b88f71-18ad-4084-9405-fe074dedb37f/","title":"Hamilton","type":"PLAY"},"Favorites:{\"uuid\":\"636d66d5-7f34-4d35-b2fa-c46e4cbca898\"}":{"__typename":"Favorites","uuid":"636d66d5-7f34-4d35-b2fa-c46e4cbca898","photoUrl":"https://ucarecdn.com/655b37ae-3db4-4058-8928-d628a657562f/","title":"Interstellar","type":"MOVIE"},"CausesSupported:{\"uuid\":\"76817cb4-ea17-45a8-ae86-d9ed0fe7e711\"}":{"__typename":"CausesSupported","uuid":"76817cb4-ea17-45a8-ae86-d9ed0fe7e711","name":"American Red Cross","description":"\u003cp\u003eI volunteered with the American Red Cross and helped managed blood drives.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/953ab424-debd-4089-903e-1e5775e31f97/"},"CausesSupported:{\"uuid\":\"9c7fb610-aba5-401a-bc2a-efad174f71a9\"}":{"__typename":"CausesSupported","uuid":"9c7fb610-aba5-401a-bc2a-efad174f71a9","name":"Melody Mission","description":"\u003cp\u003eI helped start a nonprofit bringing young musicians to nursing homes / hospitals\u003c/p\u003e","photoUrl":"https://ucarecdn.com/ea4d732c-e1a5-4d93-8e8d-5221fd3519d3/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6911cf73-9a06-4ce1-ae03-486aac1efb58\"}":{"__typename":"DeepDives","uuid":"6911cf73-9a06-4ce1-ae03-486aac1efb58","content":"\u003cp\u003eMy dream job is to work in \u003cstrong\u003epatent law\u003c/strong\u003e, at the intersection of technology, law, and innovation. I’ve always been fascinated by how new ideas come to life, whether it’s a breakthrough invention or a piece of software, and patent law sits right at that crossroad.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m someone who loves exploring different fields and building different skills, and patent law is a place where I can combine them: understanding cutting-edge tech, thinking strategically like an entrepreneur, and applying legal frameworks to protect and encourage innovation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m especially interested in emerging fields like artificial intelligence, where the law is often years behind the technology. As AI grows more powerful, we need clear, forward-thinking policies to both protect people and make space for safe, groundbreaking innovation. I want to be part of the group of legal experts helping the law keep up with the pace of change, so we can safeguard creativity and make sure the future is built responsibly.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f9e2b71e-8cdd-42ea-a985-4fa5daf844ac\"}":{"__typename":"DeepDives","uuid":"f9e2b71e-8cdd-42ea-a985-4fa5daf844ac","content":"\u003cp\u003eMentorship matters to me because, as the oldest kid in my extended family, I didn’t really have built-in role models to show me the way. I had to actively go out and find mentors, through internships, through my schools, and those relationships were so important for my professional and academic growth.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, being the oldest meant I naturally became the mentor for everyone else, helping with school applications, extracurriculars, or just homework. I saw firsthand how much easier their path was because they had me as a resource. That experience taught me that mentorship can take years of trial-and-error and turn it into a clear path forward. It’s something that shapes lives, and it’s something I want to both give and receive throughout my career.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"fbdfa673-499b-4056-93f7-ab38b831b462\"}":{"__typename":"DeepDives","uuid":"fbdfa673-499b-4056-93f7-ab38b831b462","content":"\u003cp\u003eIn high school, I used my summers to explore and try completely different things so I could figure out what I liked—and what I didn’t. I interned at \u003cstrong\u003eBank of America\u003c/strong\u003e through the Student Leader program, where I helped a nonprofit build their business and learned about financial literacy and how to network. I also did \u003cstrong\u003echemistry research\u003c/strong\u003e at the University of New Hampshire on the synthesis and application of single-chain nanoparticles. And I spent a lot of time practicing for and competing in piano competitions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThose experiences showed me \u003cstrong\u003ehow valuable it is to use summers to explore, experiment, and grow\u003c/strong\u003e. It wasn’t always easy to find those opportunities, and that’s why I’d love to help a mentee navigate their summers, so they can discover their interests and access opportunities that will shape their academic and personal development.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"1f089222-f2b1-40e2-888f-995596c03b0b\"}":{"__typename":"DeepDives","uuid":"1f089222-f2b1-40e2-888f-995596c03b0b","content":"\u003cp\u003eOn the outside, I was a high-achieving student who excelled in my academic classes, participated heavily in extracurriculars and in leadership roles, and seemed to have it all together. However, behind the scenes, I was often cramming last minute, pulling all-nighters, and procrastinating because I struggled to manage my time and focus effectively. It wasn’t until college that I was diagnosed with ADHD, which finally gave me clarity on why I worked the way I did and why some traditional study methods just didn’t click for me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSince then, I’ve learned a lot about different strategies and tools to manage not just ADHD, but also time, energy, and priorities in a way that feels sustainable and less stressful. This includes breaking down big tasks into smaller steps, using timers to stay focused, prioritizing self-care, and creating flexible schedules that adapt to my energy levels.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEven if my mentee doesn’t have ADHD, these strategies are really useful for anyone juggling schoolwork and other responsibilities. I know firsthand what it feels like to look like you have it all together on the outside but feel overwhelmed and behind on the inside. I want to help them discover systems that actually work for their unique style and make balancing everything more manageable and less exhausting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"98257c72-57ec-4e19-bca8-fb555ec7d23b\"}":{"__typename":"School","uuid":"98257c72-57ec-4e19-bca8-fb555ec7d23b","name":"Phillips Academy — Andover","city":"Andover","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01810"},"Education:{\"uuid\":\"298b8f47-659d-4438-b50b-ef1abc3cc76a\"}":{"__typename":"Education","uuid":"298b8f47-659d-4438-b50b-ef1abc3cc76a","school":{"__ref":"School:{\"uuid\":\"98257c72-57ec-4e19-bca8-fb555ec7d23b\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"d9a9202e-81ff-43f4-ac43-e8acbb10a4d5\"}":{"__typename":"Education","uuid":"d9a9202e-81ff-43f4-ac43-e8acbb10a4d5","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Computer Science, Entrepreneurship, and Design","degree":null},"MentorPublicProfile:{\"uuid\":\"6faaf334-267d-4917-9958-a60348f3425b\"}":{"__typename":"MentorPublicProfile","uuid":"6faaf334-267d-4917-9958-a60348f3425b","displayName":"Alessandra M.","slug":"alessandra-mariano","biography":"\u003cp\u003eHi! I’m currently a Computer Science student at Northwestern with a passion for exploring how technology, design, and entrepreneurship come together to solve real-world problems. I’m pursuing a career as a patent lawyer—a path that combines my love for engineering, innovation, and the law to protect creative ideas and inventions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my journey, I’ve worn many hats. I helped start a nonprofit organization, which gave me firsthand experience in leadership, teamwork, and making an impact in my community. I love leading teams to build cool products, from websites to apps, where I combine creativity with technical skills to bring ideas to life. Professionally, I’ve held a wide variety of roles including UI/UX designer, software engineer, e-commerce specialist, and product manager at various nonprofits, startups, and companies. I enjoy exploring diverse experiences, which has led me to experiment with different roles and reflect deeply on my strengths and interests. Through this journey, I’ve built a broad set of skills across technology and business sectors. Currently, I’m working at an AI startup, which is incredibly exciting given the rapid growth and impact of AI today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eVolunteering in various nonprofits such as the American Red Cross or in local Chicago events is something I deeply enjoy. It’s rewarding to give back while sharpening my skills and meeting inspiring people.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my academic and professional interests, I was a competitive pianist for 12 years (I considered pursuing a career as a concert pianist at one point!), performing and competing at local, national, and international levels. My dedication to piano helped me earn over $1.5 million in scholarship offers for college.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFrom attending top schools like Phillips Academy Andover and Northwestern, I have also developed a passion for crafting strong applications for college and prep school admissions—it's a process I love helping others navigate.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was diagnosed with ADHD in college, which helped me better understand how I learn and work best. Because of that, I’ve developed a lot of strategies to manage focus, time, and energy that I’m excited to share. Even if my mentee doesn’t have ADHD, these tools can help anyone balance school, activities, and life more effectively. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to connect with you through Curious Cardinals! I'll share what I’ve learned, support you on their academic and personal journeys, and help you develop and discover your passions and strengths.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re interested in math, computer science, entrepreneurship, design, nonprofits, or want support with applications and finding your path, I’d love to connect! I’m here to listen, encourage, and help you grow.\u003c/p\u003e","teachingVideoPlaybackId":"uVss8KzBCZ9XdsoMS1cjrO8w01Ju1c6CuVNxrPijONWo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI received $1.5 million in scholarship offers for college!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also won the Boston Pops annual competition and performed a concerto as their soloist.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c9598ccd-e120-4041-afc1-3b4fbc87cd4e\"}"},{"__ref":"Favorites:{\"uuid\":\"f6b397fc-92ea-41aa-bd1a-4247ac87d233\"}"},{"__ref":"Favorites:{\"uuid\":\"636d66d5-7f34-4d35-b2fa-c46e4cbca898\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"76817cb4-ea17-45a8-ae86-d9ed0fe7e711\"}"},{"__ref":"CausesSupported:{\"uuid\":\"9c7fb610-aba5-401a-bc2a-efad174f71a9\"}"}],"major":"Computer Science, Entrepreneurship, and Design","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6911cf73-9a06-4ce1-ae03-486aac1efb58\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9e2b71e-8cdd-42ea-a985-4fa5daf844ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"fbdfa673-499b-4056-93f7-ab38b831b462\"}"},{"__ref":"DeepDives:{\"uuid\":\"1f089222-f2b1-40e2-888f-995596c03b0b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6a5eaef6-95c3-47b5-9706-017e9b5e3c75/-/preview/-/format/jpg/","https://ucarecdn.com/c58d395c-216a-4a8a-8944-1398e90816b9/-/preview/-/format/jpg/","https://ucarecdn.com/2d6d436c-4ec9-47c3-bc4a-6d5df20ded63/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"298b8f47-659d-4438-b50b-ef1abc3cc76a\"}"},{"__ref":"Education:{\"uuid\":\"d9a9202e-81ff-43f4-ac43-e8acbb10a4d5\"}"}],"hiredAt":"2025-08-05T18:06:53.186Z","topics":["K-5 Grade Math","Pre-Algebra","Al
