xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"571c8755-b60c-4ed0-9991-32b135b0d091\"}":{"__typename":"DeepDives","uuid":"571c8755-b60c-4ed0-9991-32b135b0d091","content":"\u003cp\u003eIf I could give a couple pieces of advice to my middle or high school self it would be the following:\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003col\u003e\u003cli\u003e\u003cp\u003e1) Don’t take yourself too seriously. Work hard and love harder, but remember it’s okay to mess up and “fail” sometimes. Effort is what counts. In my opinion, there’s no such thing as true failure. Either you succeed and grow, or you learn and grow, and both are necessary! I wish I spent more time with this “growth” mindset, instead of placing myself under extreme pressure and expectation that only stressed me out and made me unhappy at times.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e2) Cultivate deep relationships and really get to KNOW people. Relationships are the bread of life!! Having a strong support network is an invaluable resource to helping you achieve success and accomplish your dreams. The best times in my life have come from conversations with others where I truly felt seen or heard. Cherish those people who support you in your life and seek to be that for others, you never know how helpful and fulfilling that’ll become.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e3) Get out of your own head and your comfort zone and into the WORLD!!! Your potential is limited to the size of the environment you put yourself in. Surround yourself with people who say YES to life and ADVENTURE and who are DO-ERS, and your potential is limitless. Too many people are sitting around waiting for the “perfect” time or moment to accomplish their dreams. Spoiler alert: it doesn’t exist, and the time is now. Go out into the world and DO!\u003c/p\u003e\u003c/li\u003e\u003c/ol\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"5dc0fd56-b432-48df-8758-78819cdab2e9\"}":{"__typename":"Education","uuid":"5dc0fd56-b432-48df-8758-78819cdab2e9","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"International Relations","degree":"B.A."},"School:{\"uuid\":\"960fa318-5ddb-4db9-a8d7-dfed69451092\"}":{"__typename":"School","uuid":"960fa318-5ddb-4db9-a8d7-dfed69451092","name":"Highland Park High School","city":"Dallas","type":"HIGH","state":"Texas","country":"United States","zip":"75205"},"Education:{\"uuid\":\"92a78ee6-e523-40d3-8e0e-00c3b44b73aa\"}":{"__typename":"Education","uuid":"92a78ee6-e523-40d3-8e0e-00c3b44b73aa","school":{"__ref":"School:{\"uuid\":\"960fa318-5ddb-4db9-a8d7-dfed69451092\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"2b906f54-ff0c-4da3-a828-cfb950f81630\"}":{"__typename":"MentorPublicProfile","uuid":"2b906f54-ff0c-4da3-a828-cfb950f81630","displayName":"Ava T.","slug":"ava-stewart","biography":"\u003cp\u003eHi Curious Cardinals families!!! My name is Ava Tiffany, and I am currently a rising second-year student (sophomore) at Stanford University. I am originally from Dallas, TX –\u0026nbsp; born and raised :) – but I am SO grateful to now call Stanford home. I’m an oldest child to the T – mature, responsible, organized – and I have a younger brother, Reece, and a younger sister, Gray, who I miss SO much in college.\u003c/p\u003e\u003cp\u003eI’m an extremely outgoing ENFJ (Myers-Briggs) personality type, but I’ll let you know I love to rejuvenate with some country music (I know, I know, it’s controversial) and a journal. Fun fact: I have filled 12 journals throughout my life and I am currently working on my 13th! Long walks with friends started as a quarantine habit, but it is now one of my favorite hobbies. I love the color yellow (like Sunshine), my favorite book is \u003cem\u003eEverybody, Always\u003c/em\u003e by Bob Goff, and I would eat Kraft mac-n-cheese and strawberries every day for the rest of my life if it were socially acceptable LOL.\u003c/p\u003e\u003cp\u003eWhen I’m not studying or participating in extracurriculars, you can 100% find me binge-watching Criminal Minds (I’m on season 11/15), listening to positive psychology podcasts, or watching Instagram travel reels in my free time. My Dad grew up overseas and soaking up his many stories throughout my childhood has inspired my aspirations to travel and interact with the world – it’s one of the main reasons I was drawn to study International Relations!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eSpeaking of IR! I’m currently pursuing a major in International Relations with a primary specialization in International History and Culture and a secondary specialization in Social Development and Human Well-Being. I’m also looking to pursue minors in Data Science and Psychology (social psych is my fav) or Philosophy. I’m fascinated by human behavior and organization, and studying the intersection between history, culture, society, human-decision making, and data collection is the perfect confluence of all my interests – I am excited and grateful to be able to pursue these academic interests while at Stanford.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eMy deep passion for human well-being and success has always drawn me to organizations and communities focused on cultivating people’s best selves. This is one of the main reasons I joined Curious Cardinals; I truly believe this community wants the absolute best – academically and holistically – for their team, their mentors, and their mentees and their families. I can’t wait to make meaningful connections through this experience.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eExtracurricularly, I have extensive experience with Student Government. I served on the Student Government of my middle school and high school all throughout and was elected to serve as the \u003cstrong\u003e\u003cem\u003eStudent Body President\u003c/em\u003e\u003c/strong\u003e my senior year. As Student Body President, I was the primary liaison between the Student Government, the Student Body (2,500 students), and the Administration, and oversaw all of StuCo's activities.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eUnder my leadership, my high school's student council conducted various initiatives that personally mean a lot to me. After some devastating events in our student body and community, my council decided we wanted to heavily emphasize Mental Health and Wellness in the student body. Last year, I introduced a passion project of mine, \"\u003cstrong\u003e\u003cem\u003eWellness Wednesdays,\u003c/em\u003e\u003c/strong\u003e\" a bi-monthly initiative that brought acclaimed speakers to the high school during all student lunches to speak on topics critical for Mental Health and Wellness Education. While piloting this program, we similarly led our annual Homecoming Dance, Inclusion Week, and 7th Race to End Racism Forum (a leadership forum where representatives from over 30+ Texas high schools come to talk about ways to increase Diversity, Equity, and Inclusion on their campuses). I am continuing my Mental Health and Wellness advocacy work as a member of the 25th Undergraduate Senate (a branch of the Associated Students of Stanford University (ASSU) – Stanford’s Student Government), where I’m currently serving as the Communications Committee Chair and Mental Health Committee Chair.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI always lead and contribute with my heart first; \u003cstrong\u003e\u003cem\u003emy enthusiasm, inquisitive nature, and hard-working personality\u003c/em\u003e\u003c/strong\u003e, my deep desire to serve, and my willingness to take initiative are just a couple of reasons why I believe I would make a great mentor for you! Other strengths of mine include written and oral communication, scheduling and time management, and leadership and inspiration.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eIn addition to Student Government, I’ve had extensive teaching and other leadership experience that I believe prepares me well to be the best mentor for you! I started my own business in 2016 teaching dance lessons in my community and teaching my own choreography. I continue it into the present day and it's been a wonderful way to continue my passion for dance while mentoring my peers and students younger than me. I’ve choreographed over 30 routines (group routines, trios, duos, and solos) and taught styles from ballet, jazz, contemporary, drill prep, high kick, and strengthening and conditioning. I’m continuing my love of dance at Stanford as a member of the Innovative Styles dance company and as a Stanford Dollie (band dancer).\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI was a two-year Lieutenant on my high school’s dance team (the Highland Park Belles), where our main responsibility was teaching the team. Every week we would learn new routines from a choreographer’s video, change the choreography according to the team’s needs, teach the team a unified part of the choreography to try out with, judge the tryouts, and then finally set the routine. When setting the routine we would need to memorize around 20-30 different parts and teach them efficiently and effectively to be able to perform the routine on Friday night. Through this experience, and also my prior experience teaching dance, I really honed my ability to read people, project with my voice, and make learning, whether it's dance or psychology or anything, innovative and engaging!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI’ve not only had dance experience, but academic teaching experience. I taught at a non-profit in high school called PASS (Performing Arts and Scholastic Success) where I taught dance and tutored students in math, science, and reading skills. I helped my students with their homework, studied with them for their tests, and ensured they had fun. I also served as an Ambassador for my high school junior and senior years, where we had a study buddy program. I tutored two high school students, one freshman in Geometry and Biology, and one Sophomore in Algebra II and Chemistry. I’ve also tutored my siblings, my friends, and other peers!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI will foster a welcoming, inclusive learning environment for all my mentees by leading with respect, integrity, and empathy. By establishing clear community norms as an interactive activity with my students, we will together define what those values look like and conduct our sessions with them in mind. This looks like respecting what we each share, being empathetic and open-minded to hear each others’ perspectives, and remembering there’s no such thing as a bad question or idea.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eEven though we haven’t met yet, I want you to know I already deeply love you!! I can’t wait to be a loyal listening ear, idea sounding board, and trusted partner who will help you to cultivate your passions and enrich your learning experience. I’m excited to meet you and start our journey.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eIf you have any questions or concerns, please feel free to reach out. I would LOVE to connect! -  Stay Curious!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eLove,\u003c/p\u003e\u003cp\u003eAva\u003c/p\u003e","teachingVideoPlaybackId":"SEqBUCTR3SEjQ7N8JUBCwGRcCFCpvO1IB9lQCZXoRV8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"International Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"571c8755-b60c-4ed0-9991-32b135b0d091\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7541ad9a-fa87-4a20-b243-74dabf9ceec9/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"5dc0fd56-b432-48df-8758-78819cdab2e9\"}"},{"__ref":"Education:{\"uuid\":\"92a78ee6-e523-40d3-8e0e-00c3b44b73aa\"}"}],"hiredAt":"2023-06-15T02:31:00.884Z","topics":["Writing","Reading","History","Executive Function","Economics","College Essay Writing","Academic Coaching","Women \u0026 Gender Studies","Public Speaking","Law / Government / Policy","Global Health","Literature","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ava-stewart\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2b906f54-ff0c-4da3-a828-cfb950f81630\"}"}}},"_sentryTraceData":"f375eed504ab4af59af3c9ca32a74536-9668518eddee166b-0","_sentryBaggage":"sentry-environment=vercel-product
