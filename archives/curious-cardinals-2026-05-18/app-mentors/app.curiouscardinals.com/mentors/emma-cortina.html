xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c888cd6d-064c-4e01-818e-33d9d0ef5793\"}":{"__typename":"Favorites","uuid":"c888cd6d-064c-4e01-818e-33d9d0ef5793","photoUrl":"https://ucarecdn.com/72d26cab-51cc-4f6b-a2ac-26d6ad69d34c/","title":"Currents","type":"ALBUM"},"Favorites:{\"uuid\":\"d9a423fd-9a7e-4b6d-befc-f1fe68d44071\"}":{"__typename":"Favorites","uuid":"d9a423fd-9a7e-4b6d-befc-f1fe68d44071","photoUrl":"https://ucarecdn.com/37a94986-29aa-42a0-b70b-5b472db2b51d/","title":"The Loco-motion by Kylie Minogue","type":"SONG"},"Favorites:{\"uuid\":\"8856b771-a2a9-4cf5-8a56-20ed027150f6\"}":{"__typename":"Favorites","uuid":"8856b771-a2a9-4cf5-8a56-20ed027150f6","photoUrl":"https://ucarecdn.com/b6e9b210-a12c-4df1-beee-9c71a0e03e9e/","title":"Amsterdam!!","type":"CITY"},"CausesSupported:{\"uuid\":\"08960cb6-931c-4863-aaab-3c1cd47d74de\"}":{"__typename":"CausesSupported","uuid":"08960cb6-931c-4863-aaab-3c1cd47d74de","name":"Mindfulness Fellow","description":"\u003cp\u003eA mindfulness and meditation practice are of utmost importance in today's world\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b63ca5a7-ea6a-4b80-aa89-e41c6fcc6919\"}":{"__typename":"DeepDives","uuid":"b63ca5a7-ea6a-4b80-aa89-e41c6fcc6919","content":"\u003cp\u003eI would tell my middle or high school self to not be so hard on herself. Growing up, I felt that I was under a lot of pressure to succeed, having gone to a large high school full of very accomplished students. Although the environment helped me push myself, at times it was hard to accept failure, and find a point at which it was acceptable to just take a breath. Slow down, be mindful, and enjoy!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0a99705a-1770-4580-aa0a-fc076c8e8219\"}":{"__typename":"DeepDives","uuid":"0a99705a-1770-4580-aa0a-fc076c8e8219","content":"\u003cp\u003eMentorship matters to me because I believe in the power of inspiration---mutual inspiration! Mentors inspire students and unravel curiosities with them....and students inspire mentors as well!! By having a relationship with students who have such deep curiosities and passions, I believe mentors are inspired to continue unraveling their own ever developing passions, or explore a new passion! This symbiotic relationship of mutual inspiration is what makes mentorship so special.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"221ae79a-49c5-4bd8-98e3-234f5333bfb9\"}":{"__typename":"DeepDives","uuid":"221ae79a-49c5-4bd8-98e3-234f5333bfb9","content":"\u003cp\u003eOne day, I'd love to be a professor of studio art \u0026amp; psychology. However, I also hope to have had significant career change throughout my 20's and 30's as I find out what is right for me. I believe all employment experiences have value and as long as I am chasing something I am curious about, I will be happy and excited.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBut it would also be pretty cool to be an actress and an artist. And also a professor. A creative jack of all trades, if you will. :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"f5541815-0407-4f60-8185-fffa70289f32\"}":{"__typename":"DeepDives","uuid":"f5541815-0407-4f60-8185-fffa70289f32","content":"\u003cp\u003eI hope to create something, an organization, company, app, business, something, that helps people and society for the better. I think there is so much value in creating something to help others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also hope to go on a long backpacking trip or road trip to see a lot of national parks. I love seeing the world by car. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}":{"__typename":"School","uuid":"1855d7ef-1e93-4456-9092-47a74b3f8fb1","name":"New Trier Township High School - Winnetka","city":"Winnetka","type":"HIGH","state":"Illinois","country":"United States","zip":"60093"},"Education:{\"uuid\":\"09cc46bc-86c9-4405-b59c-6d0d206297a0\"}":{"__typename":"Education","uuid":"09cc46bc-86c9-4405-b59c-6d0d206297a0","school":{"__ref":"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"274f76b5-d171-4071-af7b-babe99019c94\"}":{"__typename":"School","uuid":"274f76b5-d171-4071-af7b-babe99019c94","name":"Middlebury College","city":"Middlebury","type":"COLLEGE","state":"Vermont","country":"United States","zip":"05753"},"Education:{\"uuid\":\"94b34579-1333-4298-a2d4-455f03816ed1\"}":{"__typename":"Education","uuid":"94b34579-1333-4298-a2d4-455f03816ed1","school":{"__ref":"School:{\"uuid\":\"274f76b5-d171-4071-af7b-babe99019c94\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"English","degree":"Bachelors"},"MentorPublicProfile:{\"uuid\":\"10336cf7-ca7a-482d-b340-f0a668557162\"}":{"__typename":"MentorPublicProfile","uuid":"10336cf7-ca7a-482d-b340-f0a668557162","displayName":"Emma C.","slug":"emma-cortina","biography":"\u003cp\u003eHi! I’m Emma—I grew up in the northern suburbs of Chicago and recently graduated from Middlebury College with a B.A. in Creative Writing. During my first two years at Middlebury, I played on the Women’s Varsity Volleyball team. After stepping away from the court, I got involved in WRMC Middlebury College Radio and joined Middlebury Discount Comedy, a sketch writing and performance group that became a creative home for me. I’ve always loved stories—whether through books, essays, photos, or collages. I believe every piece of art has something to teach us, and I’m drawn to anything hands-on and expressive. Reading, writing, photography, and drawing are my go-to ways of exploring the world and understanding myself. \u003c/p\u003e\u003cblockquote\u003e\u003cbr\u003e\u003cp\u003eMy curiosity has taken me around the world: I studied Art History at Oxford during my sophomore summer and spent a semester abroad in Amsterdam, biking everywhere and soaking up the city’s culture. I hope to teach English abroad in the future and can’t wait for whatever adventure comes next! Right now, I’m  Copywriting for an ad agency called Imre based in NYC, where I get to combine my love of language, creativity, and psychology. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne day, I’d love to be a professor—I’m especially curious about the intersections of art, psychology, and how we tell stories that resonate. I love working with students and helping them tap into their curiosity, voice, and confidence. Whether we’re writing creatively, building a passion project, or finding joy in a new book, I aim to create an open, encouraging space where students feel seen and supported. I can’t wait to meet your child and help them explore whatever sparks their imagination!\u003c/p\u003e\u003c/blockquote\u003e","teachingVideoPlaybackId":"tJcqyeI2e4s1P9k015Sl2JOBUMb02RPUsii0102tvPU02O00s","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGetting into Middlebury as a Student Athlete will always be something I am very proud of. It took serious hard work, sacrifice, and diligence. I was committed to making this dream happen for myself, and I let nothing stand in the way. I trained outside of mandatory hours, spent days putting together highlight videos, and emailing and calling coaches. When I finally achieved this dream, I felt so proud of myself!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI think in life, it is so valuable to work hard, achieve a goal, and watch the achievement reveal itself.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c888cd6d-064c-4e01-818e-33d9d0ef5793\"}"},{"__ref":"Favorites:{\"uuid\":\"d9a423fd-9a7e-4b6d-befc-f1fe68d44071\"}"},{"__ref":"Favorites:{\"uuid\":\"8856b771-a2a9-4cf5-8a56-20ed027150f6\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"08960cb6-931c-4863-aaab-3c1cd47d74de\"}"}],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b63ca5a7-ea6a-4b80-aa89-e41c6fcc6919\"}"},{"__ref":"DeepDives:{\"uuid\":\"0a99705a-1770-4580-aa0a-fc076c8e8219\"}"},{"__ref":"DeepDives:{\"uuid\":\"221ae79a-49c5-4bd8-98e3-234f5333bfb9\"}"},{"__ref":"DeepDives:{\"uuid\":\"f5541815-0407-4f60-8185-fffa70289f32\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4bb500c4-aa62-4825-a90d-456194aa4d48/-/preview/-/format/jpg/","https://ucarecdn.com/ccbc779d-f3e3-4b5e-9000-e165dc0369fc/-/preview/-/format/jpg/","https://ucarecdn.com/4dbe1272-0a89-41d8-84d5-4c35b824e1d5/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"09cc46bc-86c9-4405-b59c-6d0d206297a0\"}"},{"__ref":"Education:{
