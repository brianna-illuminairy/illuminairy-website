xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ea8a4eb5-ffbd-4b23-bdb2-fe82a399395f\"}":{"__typename":"Favorites","uuid":"ea8a4eb5-ffbd-4b23-bdb2-fe82a399395f","photoUrl":"https://ucarecdn.com/3a45ec6a-b62d-4353-994b-c4d4fc1fbfb9/","title":"Bad Bunny ","type":"ARTIST"},"Favorites:{\"uuid\":\"9cb53af7-5fc2-4466-b090-1d67df54542e\"}":{"__typename":"Favorites","uuid":"9cb53af7-5fc2-4466-b090-1d67df54542e","photoUrl":"https://ucarecdn.com/67056f4f-08b5-4f23-8855-edcb32047441/","title":"Song of Solomon","type":"BOOK"},"Favorites:{\"uuid\":\"65d0da05-edd9-49a9-9258-082fa58e445b\"}":{"__typename":"Favorites","uuid":"65d0da05-edd9-49a9-9258-082fa58e445b","photoUrl":"https://ucarecdn.com/5a7bd8d2-394f-48ab-8a7f-be0d93d26d88/","title":"Medellin, Colombia ","type":"CITY"},"CausesSupported:{\"uuid\":\"83652173-af46-41d5-8b5f-bf6358168a4a\"}":{"__typename":"CausesSupported","uuid":"83652173-af46-41d5-8b5f-bf6358168a4a","name":"Minds Matter","description":"\u003cp\u003eI’m deeply passionate about access to higher education for first-gen students.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/4be295dd-e664-4cb4-b402-48baa2496422/"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"d68283c3-8886-4b32-bf66-2bbc768f8599\"}":{"__typename":"DeepDives","uuid":"d68283c3-8886-4b32-bf66-2bbc768f8599","content":"\u003cp\u003eMy sophomore year of highschool, I traveled to Havana and filmed a documentary on the changing role of the free press in Cuba for a capstone project! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"80b8d252-7e53-4dce-be05-bdb1b1135bbb\"}":{"__typename":"DeepDives","uuid":"80b8d252-7e53-4dce-be05-bdb1b1135bbb","content":"\u003cp\u003eWhen I first got to Harvard, I actually thought I wanted to major in sociology — until I realized that I was more interested in finding the connections between Toni Morrison and Henry Louis Gates than taking statistics! I came to this conclusion by speaking to my first-year advisor about not only the questions that interests me but also \u003cem\u003ehow\u003c/em\u003e I wanted to answer them. Through those conversations, I realized that History and Literature was the discipline most interesting to me! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"a9e4dc2c-ee8e-4eb6-a163-b6da1f2cada2\"}":{"__typename":"DeepDives","uuid":"a9e4dc2c-ee8e-4eb6-a163-b6da1f2cada2","content":"\u003cp\u003eAs a Haitian American, I grew up in a house hold full of laughter and with a mother that always had a metaphor or parable for every situaiton. Now as an educator and mentor, I bring that robust sense of humor and culturally-infused manner didactic to break down complex topics and make lessons engaging! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b7ed8aea-6105-4492-aee0-2c3c6930182a\"}":{"__typename":"DeepDives","uuid":"b7ed8aea-6105-4492-aee0-2c3c6930182a","content":"\u003cp\u003eI attended EXPLO Pre-College Program at Yale University and Model UN camps at Georgetown. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"2c588162-1384-4a14-b97c-8904ebc1f7c4\"}":{"__typename":"School","uuid":"2c588162-1384-4a14-b97c-8904ebc1f7c4","name":"Darlington School","city":"Rome","type":"HIGH","state":"Georgia","country":"United States","zip":"30161"},"Education:{\"uuid\":\"cf032f59-1f4e-4d83-8ec6-7df542dbf5ec\"}":{"__typename":"Education","uuid":"cf032f59-1f4e-4d83-8ec6-7df542dbf5ec","school":{"__ref":"School:{\"uuid\":\"2c588162-1384-4a14-b97c-8904ebc1f7c4\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"79cae907-991c-4b5c-870d-50f006d4feff\"}":{"__typename":"Education","uuid":"79cae907-991c-4b5c-870d-50f006d4feff","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"History and Literature","degree":null},"MentorPublicProfile:{\"uuid\":\"206548f2-819e-43d3-bbe7-fdfd72fa909d\"}":{"__typename":"MentorPublicProfile","uuid":"206548f2-819e-43d3-bbe7-fdfd72fa909d","displayName":"Marissa J.","slug":"marissa-joseph","biography":"\u003cp\u003eHi there! My name is Marissa, and I graduated from Harvard University in 2023 with a B.A. in History and Literature and a focus field in Ethnic Studies. While at Harvard, I also received a Spanish Language Citation!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am a proud Haitian American and Atlanta-native — though I am now living in Chicago, where I am a PhD Student in Black Studies at Northwestern University. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeginning in high school, I developed an interest in storytelling, global issues, and journalism as editor-in-chief of my school newspaper, a passion that has followed me throughout my time at Harvard, Northwestern University, and beyond.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile at Harvard, I served as an Editor for the Harvard Crimson Editorial Board and also conducted independent research through the Mellon Mays Undergraduate Research Fellowship. As a Mellon fellow, I had the opportunity to travel to Santiago de Cuba, Cuba where I waded through the city's archives and gathered oral histories for my senior thesis, which explored the historical ties between Haiti, Cuba, and the D.R. through women's migration and labor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I am continuing my research on the history of race, migration, and national belonging in the Caribbean and the U.S. as a PhD student! My work focuses on telling the stories of Haitian migrants in the U.S. and the Caribbean and uncovering the historical foundations of our modern day immigration system. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love taking dance classes, listening to Bad Bunny, and finding new brunch places around Chicago! I also enjoy connecting with highschool seniors every week as volunterr with  the Minds Matter Mentorship program. As a mentor, I provide 1:1 support for underserved students working on their common app personal statements. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm particularly energized by opportunities to work with politically engaged students who are passionate about social issues facing our world and have a desire to make an impact in their community. I know first-hand that as a teenager, the problems facing our world can sometimes feel overwhelming.  However, I'm a firm believer experience that no matter what resources are at your disposal, there is always a way to make a difference. As a highschool student, I started a mentorship program at my local boys and girls club and recruited volunteers from my high school to teach a curriculum I developed on identity-building and leadership. This program empowered me to shape the lives of the next generation of my community and witness the transformative power of service at the grassroots level. \u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"wyM17JOEohEUmAOYPfN4ifbPgu5DtHupr72ff5FspnA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy senior thesis won Harvard African American Studies Kwame Appaiah Thesis Prize — awarded to the best senior thesis on the African Diaspora!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"ea8a4eb5-ffbd-4b23-bdb2-fe82a399395f\"}"},{"__ref":"Favorites:{\"uuid\":\"9cb53af7-5fc2-4466-b090-1d67df54542e\"}"},{"__ref":"Favorites:{\"uuid\":\"65d0da05-edd9-49a9-9258-082fa58e445b\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"83652173-af46-41d5-8b5f-bf6358168a4a\"}"}],"major":"History and Literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d68283c3-8886-4b32-bf66-2bbc768f8599\"}"},{"__ref":"DeepDives:{\"uuid\":\"80b8d252-7e53-4dce-be05-bdb1b1135bbb\"}"},{"__ref":"DeepDives:{\"uuid\":\"a9e4dc2c-ee8e-4eb6-a163-b6da1f2cada2\"}"},{"__ref":"DeepDives:{\"uuid\":\"b7ed8aea-6105-4492-aee0-2c3c6930182a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6e44fcad-b70a-4d01-ac07-7fab1814bf11/-/preview/-/format/jpg/","https://ucarecdn.com/ff6e8ac6-218b-4c3e-86dc-148f49e6feed/-/preview/-/format/jpg/","https://ucarecdn.com/3de7935f-1e44-46c5-b3a6-5aec1c9b71f7/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"cf032f59-1f4e-4d83-8ec6-7df542dbf5ec\"}"},{"__ref":"Education:{\"uuid\":\"79cae907-991c-4b5c-870d-50f006d4feff\"}"}],"hiredAt":"20
