ly solve problems. In high school, I loved participating in hackathons and STEM summer programs. I also wrote papers on how AI can be used to increase access to healthcare in India and reduce energy inequality in the US for my AP Capstone projects. More recently, I have spent my last two summers interning within the product classification space at Amazon and may go back, but I’m not entirely sure yet. Outside of tech, I love to read, puzzle, go on walks with my friends, and explore New England/NYC.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f8789c48-e832-42d7-add8-603a35bb9588\"}"},{"__ref":"DeepDives:{\"uuid\":\"c5abe845-8b65-4faf-b63c-fe2d8ba55f30\"}"},{"__ref":"DeepDives:{\"uuid\":\"4856c8da-ee66-4c47-a47d-18a2345fe979\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/35bd8e5f-b5d4-4b59-be1c-70add0267e43/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"170f3126-fee3-4fb0-8a88-a88398c99676\"}"},{"__ref":"Education:{\"uuid\":\"25954390-c44f-40bc-ba1d-5fcc5851d37f\"}"}],"hiredAt":"2024-10-31T04:03:26.311Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Coding / Programming","Computer Science","Web Design","Machine Learning / AI"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"lailah-nabegu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"763b9360-b687-41fb-a898-7a9d2c2fe806\"}"}}},"_sentryTraceData":"57d0ea7a634049498d187e44dd59eb3b-93d2447b5dbbd775-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace
