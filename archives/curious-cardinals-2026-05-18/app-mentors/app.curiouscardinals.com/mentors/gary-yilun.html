xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"f05fd8b5-2934-4d3d-a7e5-7f1858d13fd4\"}":{"__typename":"DeepDives","uuid":"f05fd8b5-2934-4d3d-a7e5-7f1858d13fd4","content":"\u003cp\u003eMentorship and teaching is a passion of mine! I have an older brother who is 7 years older than me and he has always been eager to help me, whether it's been elementary school math, or applying to colleges. As I've gotten older, I have that same desire to help others learn because I know the value of having someone truly care for your success, and who will help you do anything to achieve it. Having previous mentorship experience in high school leads me to realize that I really enjoy helping explain things to people and seeing their improvements. As a mentor, I hope to not only help my mentee in improving the areas they struggle in, but also develop their confidence to tackle whatever harder tasks that come their way. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"1758d6ec-6ae9-4cf7-a924-5ef1e426d66e\"}":{"__typename":"DeepDives","uuid":"1758d6ec-6ae9-4cf7-a924-5ef1e426d66e","content":"\u003cp\u003eMy most memorable summer was the one after senior year, where I went on tour with my chorus in Napa Valley and Santa Barbara. We were able to showcase our entire setlist over multiple performances at the Napa Valley Music Festival after rehearsing for weeks on end. However, the most rewarding part of the trip was the second leg, where we went to Santa Barbara to attend a national choral lab with conductors, musicians, and a local youth chorus. As older choristers, we were paired with younger choristers to work with, and it was such a rewarding environment to be in where we were able to spread our love for music and choral singing. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"c82d12f3-ac36-4e16-a33f-da924be49ad8\"}":{"__typename":"School","uuid":"c82d12f3-ac36-4e16-a33f-da924be49ad8","name":"The Bronx High School of Science","city":"The Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10468"},"Education:{\"uuid\":\"908936e8-09b5-4a70-ad4a-01eb0cb0cb81\"}":{"__typename":"Education","uuid":"908936e8-09b5-4a70-ad4a-01eb0cb0cb81","school":{"__ref":"School:{\"uuid\":\"c82d12f3-ac36-4e16-a33f-da924be49ad8\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"5c1da6f4-25ea-460e-b6cf-55e6473548b8\"}":{"__typename":"Education","uuid":"5c1da6f4-25ea-460e-b6cf-55e6473548b8","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Physics and Math","degree":null},"MentorPublicProfile:{\"uuid\":\"a786cc92-0303-4da2-956b-777795a438d3\"}":{"__typename":"MentorPublicProfile","uuid":"a786cc92-0303-4da2-956b-777795a438d3","displayName":"Gary X.","slug":"gary-yilun","biography":"\u003cp\u003eGary is currently a sophomore at Columbia University studying physics and math. He has loved science and math from a young age, and has always been motivated by curiosity and a desire to research the unknown. His previous research experience includes working with a professor in Columbia's astrophysics department, where he spent time using python to write algorithms that analyzed large amounts of stellar data. He successfully produced results that showed correlations between several stellar variables and a star’s age. He is constantly searching for new topics in physics to learn about, whether it is scanning his textbook, watching youtube videos, or talking to his professors about their research. He currently has plans to work in an applied physics lab at Columbia over the summer where he will conduct experiments in solid state physics and analyze the quantum properties of different materials. \u003cbr\u003e\u003cbr\u003eGary also has a love for music and the arts. Having grown up in New York City, he frequented the numerous museums, concerts, and shows across the city. Most recently, he spent the past summer abroad in Paris, where he studied art and music humanities. He found it extremely rewarding to be immersed in the concerts and museums Paris had to offer, all while learning about the same musicians and artists present at the venues he had attended back in New York. While Gary enjoys seeing art performed and displayed firsthand, he also values being an active contributor to it. He has numerous years of experience playing piano, and sang in a children’s chorus for 10 years, where he performed all across the country, and won multiple international choral competitions. At Columbia, he currently sings in an all-low voice a cappella group, where he is the group's current music director. He takes passion in his singing and uses what he has learned in his past choral and piano experience to also help arrange songs for the groups performance repertoire. \u003cbr\u003e\u003cbr\u003e Gary also enjoys staying active and playing sports, frequently going on hikes with his family, playing basketball with his friends, and cycling. Over quarantine, Gary picked up competitive road cycling, and participated in numerous races with a junior development team. He competed in many local races in New York City as well as larger races in the northeast. His proudest achievement as a racer was getting a top 10 finish at the Killington Stage Race in Vermont. At Columbia, he is currently the president of the club cycling team, where he helps plan the team schedule, manage the club’s budget, and design the kit.\u003c/p\u003e","teachingVideoPlaybackId":"qcHwQYS3QiSD5sy4Lp5Wvp24JkwK019dJ9H02YgcVJgXU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Physics and Math","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f05fd8b5-2934-4d3d-a7e5-7f1858d13fd4\"}"},{"__ref":"DeepDives:{\"uuid\":\"1758d6ec-6ae9-4cf7-a924-5ef1e426d66e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/adbc120c-5b4d-4b8c-8fbe-59fa6911df21/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"908936e8-09b5-4a70-ad4a-01eb0cb0cb81\"}"},{"__ref":"Education:{\"uuid\":\"5c1da6f4-25ea-460e-b6cf-55e6473548b8\"}"}],"hiredAt":"2024-01-17T14:40:41.453Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","Writing","Mandarin Chinese","College Essay Writing","Academic Coaching","Reading","Music","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gary-yilun\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a786cc92-0303-4da2-956b-777795a438d3\"}"}}},"_sentryTraceData":"edd58152e6224b3e84d5597e1a655216-a1db1571eef257bc-0","_sentryBaggage":"sentry-environment=vercel-production,sentr
