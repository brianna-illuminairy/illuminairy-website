xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"97e85c35-d7e8-4444-8535-dde96f479f0f\"}":{"__typename":"Favorites","uuid":"97e85c35-d7e8-4444-8535-dde96f479f0f","photoUrl":"https://ucarecdn.com/abf48273-72b8-4b9b-9652-21a62fe9ef15/","title":"No Guest List","type":"SONG"},"Favorites:{\"uuid\":\"4a8248d3-8b7e-4f79-add9-f79d8935b8ee\"}":{"__typename":"Favorites","uuid":"4a8248d3-8b7e-4f79-add9-f79d8935b8ee","photoUrl":"https://ucarecdn.com/abf48273-72b8-4b9b-9652-21a62fe9ef15/","title":"Min Woo Lee","type":"ATHLETE"},"Favorites:{\"uuid\":\"9fdb6265-06cf-4782-9169-4b4c6d0f7799\"}":{"__typename":"Favorites","uuid":"9fdb6265-06cf-4782-9169-4b4c6d0f7799","photoUrl":"https://ucarecdn.com/abf48273-72b8-4b9b-9652-21a62fe9ef15/","title":"Los Angeles","type":"CITY"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d30b602f-1426-46a2-9f81-496427f7d886\"}":{"__typename":"DeepDives","uuid":"d30b602f-1426-46a2-9f81-496427f7d886","content":"\u003cp\u003eI chose Economics because I wanted to learn more about the financial and money markets. I believe that understanding the different drivers in the economy can help me with my experiences in investment banking as well as my future endeavors as an entrepreneur. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f544312f-61f9-4a28-9908-21227d77fd13\"}":{"__typename":"DeepDives","uuid":"f544312f-61f9-4a28-9908-21227d77fd13","content":"\u003cp\u003eMy advice that I would give to myself is to continue to try new projects and activities. In high school and even in college now, it is really common for students to be very confused about what they want their future endeavors to be, and will stunt them from taking the first steps. You must fail multiple times before finding the one success you are looking for. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"0f409d89-ba20-4059-a1aa-e893c7da16cd\"}":{"__typename":"DeepDives","uuid":"0f409d89-ba20-4059-a1aa-e893c7da16cd","content":"\u003cp\u003eA passion project that I have created in the past and am continuing to grow is my company, MB Swim Academy. I was a 9-year competitive swimmer and 4-year high school varsity swimmer. After my competitive career ended, I wanted to continue to be involved with the sport. I saw teaching beginners as an opportunity to not only positively make an impact on my local community but also continue to be involved with my passions. Due to my experience growing this company, I have learned more about managing people, starting a business, maintaining client relationships, and maximizing sales. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"e301b6d4-abfd-4b43-a074-3fbeebce8e66\"}":{"__typename":"DeepDives","uuid":"e301b6d4-abfd-4b43-a074-3fbeebce8e66","content":"\u003cp\u003eI've been teaching and mentoring ever since high school. I started a swim academy where we have taught over 600 students and also have been tutoring privately for 5 years in math/chemistry. I was also an instructional and investment banking mentor in college. I love mentorship because I enjoy being able to help others and continue to be involved with my passions. Seeing my mentorship positively affect people, whether that's through improving test scores, the number of internship recruitment offers, or water safety, brings me joy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"eee85709-a6fb-4ad3-bb89-ed7039032e58\"}":{"__typename":"School","uuid":"eee85709-a6fb-4ad3-bb89-ed7039032e58","name":"Mira Costa High School","city":"Manhattan Beach","type":"HIGH","state":"California","country":"United States","zip":"90266"},"Education:{\"uuid\":\"6cd410ba-e243-41fa-8dcd-b215e1c5f081\"}":{"__typename":"Education","uuid":"6cd410ba-e243-41fa-8dcd-b215e1c5f081","school":{"__ref":"School:{\"uuid\":\"eee85709-a6fb-4ad3-bb89-ed7039032e58\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"b30fef2f-fca4-4e91-afa1-8d2a9e949d47\"}":{"__typename":"Education","uuid":"b30fef2f-fca4-4e91-afa1-8d2a9e949d47","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"8aede12f-acf6-4821-a7e0-cfde97907e42\"}":{"__typename":"MentorPublicProfile","uuid":"8aede12f-acf6-4821-a7e0-cfde97907e42","displayName":"Jonathan R.","slug":"jonathan-ro","biography":"\u003cp\u003eMy name is Jonathan Ro and I am currently a junior at the University of Southern California studying Economics and Business Finance. I grew up in Manhattan Beach California where founded my own company, MB Swim Academy. MB Swim services clients in the South Bay where we teach beginner level swimmers. I also recruited for investment banking where I will be at Macquarie Capital in their consumer, gaming, and leisure group. Throughout my several investment banking experiences, I have learned more about modeling, financial markets, accounting, technicals, networking, and general recruiting techniques. I was an investment banking mentor where I prepared students for the investment banking recruitment cycle. I also have been a private tutor for 5 years teaching math and chemistry subjects to high school students. Outside of work and school, I love to play golf, spearfish, play poker, and go to the gym.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"97e85c35-d7e8-4444-8535-dde96f479f0f\"}"},{"__ref":"Favorites:{\"uuid\":\"4a8248d3-8b7e-4f79-add9-f79d8935b8ee\"}"},{"__ref":"Favorites:{\"uuid\":\"9fdb6265-06cf-4782-9169-4b4c6d0f7799\"}"}],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d30b602f-1426-46a2-9f81-496427f7d886\"}"},{"__ref":"DeepDives:{\"uuid\":\"f544312f-61f9-4a28-9908-21227d77fd13\"}"},{"__ref":"DeepDives:{\"uuid\":\"0f409d89-ba20-4059-a1aa-e893c7da16cd\"}"},{"__ref":"DeepDives:{\"uuid\":\"e301b6d4-abfd-4b43-a074-3fbeebce8e66\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ee51f359-913c-4029-b239-078d70284525/-/preview/-/format/jpg/","https://ucarecdn.com/c80533d6-4088-4cbd-bb27-d65bcee174a4/-/preview/-/format/jpg/","https://ucarecdn.com/7f6244ce-542b-45e7-9232-fa50ffa0b675/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MAL
