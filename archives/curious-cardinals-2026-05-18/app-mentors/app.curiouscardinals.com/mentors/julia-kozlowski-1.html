xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1091247a-9879-4f63-a8c9-1e70ac767eba\"}":{"__typename":"Favorites","uuid":"1091247a-9879-4f63-a8c9-1e70ac767eba","photoUrl":"https://ucarecdn.com/81de7100-72dc-4d70-91ac-a67a4cbd0040/","title":"Dance! Here's me in high school rehearsing my variation for YAGP.","type":"SPORT"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"28fc4cc3-8233-4d10-b545-0c2896922ba9\"}":{"__typename":"DeepDives","uuid":"28fc4cc3-8233-4d10-b545-0c2896922ba9","content":"\u003cp\u003eIn high school, I spent my summers dancing. I did several summer intensives, including five weeks with Boston Ballet in Boston and four weeks with Alonzo King LINES in San Francisco. I also trained at programs in New York City and attended YAGP finals in Tampa. Outside of that, I was training every day at my home studio in Chicago, Extensions Dance Company. Dance was a huge time commitment for me, but it shaped me into the creative, consistent, and disciplined person I am today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"fdc74756-ec4a-4791-946c-457ef39f3ae6\"}":{"__typename":"DeepDives","uuid":"fdc74756-ec4a-4791-946c-457ef39f3ae6","content":"\u003cp\u003eMentorship matters to me because I’ve seen firsthand how much it can shape a student’s confidence, especially through working with my younger sister. During COVID, I watched her and a lot of students her age miss key foundational concepts that most 3rd and 4th graders learn due to virtual learning, which made school feel more frustrating and discouraging than it should have been when she went back in person. I’ve been tutoring her throughout middle school, and I saw how those gaps made her feel behind, even when she was fully capable. Working with her made me realize how easily students can disengage when they feel lost early on, and how important it is to rebuild both understanding and momentum. That’s how I approach mentorship: focusing on clarity, patience, and making sure students feel supported and engaged as they regain their footing and start to trust their own thinking again.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"76545436-8a84-4fee-afe1-4c4843f795b4\"}":{"__typename":"DeepDives","uuid":"76545436-8a84-4fee-afe1-4c4843f795b4","content":"\u003cp\u003eGrowing up as a dancer, my love for the arts runs deep. I spent summers performing with nonprofits like Dance in the Parks, and weekends\u0026nbsp;watching world renowned companies like the American Ballet Theater, Hubbard Street, and Alvin Ailey. While dance has always been a huge part of my life, as I grew older I became increasingly aware of how the financial burden created a barrier for a lot of families. To address this, I partnered with the Leveled Stage, a small organization that collaborates with dance studios across the Chicagoland area to collect and distribute dance wear to underprivileged dancers. As the spokesperson and leader of its downtown Chicago outreach, I launched an annual gently used dancewear drive at my studio, managing collection, distribution, and communications. Over the course of my time there, we donated over 100 pounds of dance wear, directly supporting young dancers and helping to bridge that socioeconomic gap. I truly believe passion should never be limited by access. Since graduating, I’ve passed this initiative on to younger dancers I mentor, who continue to grow and expand the project.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f846e3e7-7f34-424e-a474-ec3ace3742a4\"}":{"__typename":"DeepDives","uuid":"f846e3e7-7f34-424e-a474-ec3ace3742a4","content":"\u003cp\u003eI've been trying to get back into reading! I was a huge reader growing up and it's something I've always loved. I'm currently reading \u003cem\u003eGood Omens\u003c/em\u003e by Neil Gaiman and Terry Pratchett and \u003cem\u003eThe Stranger\u003c/em\u003e by Albert Camus. I'm also working on my Russian—my goal is to finish working through \u003cem\u003eThe Master and Margarita\u003c/em\u003e (one of my favorite books) in its original Russian by the end of the year. Additionally, I love listening to music and going to concerts; my favorites are Drake, SZA, and Travis Scott.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"98101a6d-a774-4260-b003-2abf362ad23e\"}":{"__typename":"School","uuid":"98101a6d-a774-4260-b003-2abf362ad23e","name":"Walter Payton College Preparatory High School","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60610"},"Education:{\"uuid\":\"1b434910-383e-4356-ac8c-6919fb35be4a\"}":{"__typename":"Education","uuid":"1b434910-383e-4356-ac8c-6919fb35be4a","school":{"__ref":"School:{\"uuid\":\"98101a6d-a774-4260-b003-2abf362ad23e\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"6dad2d11-1a41-4395-9bd7-05c7b6875709\"}":{"__typename":"Education","uuid":"6dad2d11-1a41-4395-9bd7-05c7b6875709","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics and Information Science","degree":null},"MentorPublicProfile:{\"uuid\":\"cc5cb62a-582a-4634-b20a-1496684fff0f\"}":{"__typename":"MentorPublicProfile","uuid":"cc5cb62a-582a-4634-b20a-1496684fff0f","displayName":"Julia K.","slug":"julia-kozlowski-1","biography":"\u003cp\u003eHi! I’m Julia, an undergraduate at Cornell University double majoring in Economics and Information Science, with a minor in Entrepreneurship. I’m passionate about helping students build confidence in what they’re learning and turn their ideas into something real — whether that’s mastering a subject, developing a research project, or exploring a business idea.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’m deeply interested in understanding how ideas grow into impactful ventures, especially in the early stages of a company’s development. Through my coursework and professional experiences, I’ve built a strong foundation in analytical thinking while also exploring the creative and human side of problem solving.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I have:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWorked with a venture-backed healthcare technology startup, supporting brand strategy and growth initiatives using Excel and market research\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eInterned with a boutique venture capital firm, evaluating early-stage startups across AI, climate tech, and legal tech, completing diligence research (particularly focusing on competitive landscape), and analyzing factors like product-market fit and scalability\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAccepted a Summer 2026 internship with Kirkland \u0026amp; Ellis on the IT Business Operations team in Chicago\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThese experiences have strengthened my ability to think critically about how ideas succeed — something I love bringing into my work with students.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eWhat I specialize in\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI’m especially well suited to support students in:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eEconomics (macro \u0026amp; micro, any application)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMath (algebra, calculus)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTechnology, society, \u0026amp; AI\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eResearch \u0026amp; writing\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also love helping students:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDevelop passion projects (business ideas, research papers, creative builds, nonprofits)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStrengthen academic foundations (including problem solving, study habits, and executive functioning)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExplore entrepreneurship \u0026amp; real-world thinking (what makes ideas succeed, how to think about markets, growth, and impact)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuild confidence in subjects they may have previously found challenging\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e\u003cstrong\u003eMy approach to mentorship\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eI believe the most meaningful learning happens when students feel ownership over their work.\u003c/p\u003e\u003cp\u003eI focus on:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBuilding deep understanding, not just memorization\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEncouraging independent thinking and intellectual curiosity\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating an environment where students feel challenged, supported, and engaged\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eA typical session might include:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking down complex concepts into clear, manageable steps\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConnecting academic material to real world applications\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBrainstorming and structuring project ideas\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a plan so students feel confident moving forward\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003ch2\u003e\u003cstrong\u003eOutside of academics\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eOn campus, I’m a member of the Cornell University Dance Team, where I also serve as Apparel Chair. Dance has been a major part of my life for years, having grown up doing ballet and competitive dance, and has shaped my appreciation for discipline, teamwork, and creative expression. In high school, I was president of Amnesty International, president and co-founder of Payton Advocates for Change, secretary for Gender Equity for Teens, a tutor for National Honor Society, and an AP Scholar.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003ch2\u003e\u003cstrong\u003eFinal note\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eUltimately, I aim to create a learning environment that is both intellectually rigorous and highly engaging — one where students feel confident exploring ambitious ideas and turning them into something tangible.\u003c/p\u003e\u003cp\u003eI’m so excited to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"pcvyfDhRI7xlkolqCVuaB7xVVzJLsOM28GH8v1lk00Uk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1091247a-9879-4f63-a8c9-1e70ac767eba\"}"}],"causesSupported":[],"major":"Economics and Information Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"28fc4cc3-8233-4d10-b545-0c2896922ba9\"}"},{"__ref":"DeepDives:{\"uuid\":\"fdc74756-ec4a-4791-946c-457ef39f3ae6\"}"},{"__ref":"DeepDives:{\"uuid\":\"76545436-8a84-4fee-afe1-4c4843f795b4\"}"},{"__ref":"DeepDives:{\"uuid\":\"f846e3e7-7f34-424e-a474-ec3ace3742a4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/55a70ca1-48a3-4f60-83e3-6c0fcafda711/-/preview/-/format/jpg/","https://ucarecdn.com/7257a0d8-fed8-4947-b850-7e396387c24a/-/preview/-/format/jpg/","https://ucarecdn.com/b85fbdc5-8983-4203-bdec-ea4e3b56621d/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1b434910-383e-4356-ac8c-6919fb35be4a\"}"},{"__ref":"Education:{\"uuid\":\"6dad2d11-1a41-4395-9bd7-05c7b6875709\"}"}],"hiredAt":"2026-04-06T22:58:41.486Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Writing","Academic Coaching","Executive Function","College Essay Writing","Economics","Computer Science","Reading","K-6 Storybook","Business / Entrepreneurship","Finance / Investing","Machine Learning / AI","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"julia-kozlowski-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"cc5cb62a-582a-4634-b20a-1496684fff0f\"}"}}},"_sentryTraceData":"c7c8d3c586f94a8db79dcd27d43320ff-99cfed0ff3c16b85-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c7c8d3c586f94a8db79dcd27d43320ff,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"julia-kozlowski-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
