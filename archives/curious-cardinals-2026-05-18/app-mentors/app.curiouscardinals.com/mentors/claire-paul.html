xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"c2ad84d5-c885-40db-a18a-394eb0d07e05\"}":{"__typename":"Education","uuid":"c2ad84d5-c885-40db-a18a-394eb0d07e05","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"097f526c-839f-4b80-a90e-86feb6441440\"}":{"__typename":"Education","uuid":"097f526c-839f-4b80-a90e-86feb6441440","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Human Biology","degree":null},"Testimonial:baccdc5a-5928-46c6-8d5a-753df181605b":{"__typename":"Testimonial","id":"baccdc5a-5928-46c6-8d5a-753df181605b","text":"What an incredible experience this has been for Brooke!  Claire has supported Brooke's vision from the beginning and helped Brooke expand her goals around \n building out an educational nutrition platform. Claire has helped build confidence and competence and helped Brooke envision the possibilities of what may come next .  Grateful for this mentorship!","date":"2025-05-30 18:55:33.408+00","rating":5,"endorser":{"__typename":"Endorser","name":"Kasi D Beaney","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"152f79b7-06f7-4632-a370-b62abed7de99\"}":{"__typename":"MentorPublicProfile","uuid":"152f79b7-06f7-4632-a370-b62abed7de99","displayName":"Claire P.","slug":"claire-paul","biography":"\u003cp\u003eHi! I’m Claire, and I’m a Freshman at Stanford University studying Human Biology with a focus on Brain and Behavior and Human Performance. I’m passionate about understanding our biological mechanisms, and further applying those skills for social good. Outside of the classroom, I’m a member of Stanford Marketing Group, write for Lifestyle Medicine, and am working in the Nutrition Studies Research Group this summer! I’m particularly fascinated by the idea of nutritional psychiatry and its impact on mental health, driven by my own personal experiences.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI’ve always been interested in biology more broadly, yet it took me until college to really narrow in on this passion to the connection between food and mental health. In high school, I gained insights into the overlap between dietary needs and the connection between mind and body through my job at Sunlife Organics, a health food cafe. We hear the phrase, “You are what you eat,” and so I was compelled to further investigate that in my winter quarter research paper about current nutritional science research methods.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m also very passionate about mental health, especially for high-achieving high school students. I actually took the first semester of my Junior year off of high school to focus on my mental health and understand the root causes. While this experience was incredibly isolating at the time, I’ve found that the more I open up about my mental health, the more I’m unknowingly helping those around me. After my semester off, I returned to school in January, possessing a newfound self-awareness and individual cognitive understanding, empowered by, rather than fearful of, whatever was going on in my amygdala. Curiosity arose from my own challenges, causing me to think about the impact I can have on others who may also be silently struggling. I spent my summer designing HWell, an app for my school community that provides students with ample resources that would have helped me during a similar time.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor pure enjoyment, I love to run (I did the LA marathon last year), hike, and spend time with friends and family! I’m looking forward to working with your child, whether it be helping them find their passions, understand a mental health challenge, or just being a figure they can relate to!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Biology","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/941fb628-b6af-4332-8fcf-a1d37065300d/-/preview/-/format/jpg/","https://ucarecdn.com/97de7f78-5666-4d14-b2d5-fc5595f46ca3/-/preview/-/format/jpg/","https://ucarecdn.com/5798aedd-beb8-434d-b141-7aaafc34cfe8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"c2ad84d5-c885-40db-a18a-394eb0d07e05\"}"},{"__ref":"Education:{\"uuid\":\"097f526c-839f-4b80-a90e-86feb6441440\"}"}],"hiredAt":"2024-05-07T00:08:49.809Z","topics":["Pre-Algebra","K-5 Grade Math","Algebra I","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Biology","Executive Function","Medicine / Health","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:baccdc5a-5928-46c6-8d5a-753df181605b"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"claire-paul\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"152f79b7-06f7-4632-a370-b62abed7de99\"}"}}},"_sentryTraceData":"237c4565761f452d920740b12ac86ac8-bfbab18e16be8
