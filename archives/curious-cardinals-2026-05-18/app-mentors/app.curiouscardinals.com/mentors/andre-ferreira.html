xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c5be08d2-87a2-419b-91bb-31d788fb45a9\"}":{"__typename":"Favorites","uuid":"c5be08d2-87a2-419b-91bb-31d788fb45a9","photoUrl":"https://ucarecdn.com/7cf4217f-7ae2-4bee-88a4-0c0934a72eb1/","title":"Benfica","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"2659c704-ee11-41c3-a173-1463426d1681\"}":{"__typename":"Favorites","uuid":"2659c704-ee11-41c3-a173-1463426d1681","photoUrl":"https://ucarecdn.com/7f792789-b8fe-4ed8-b22f-a2beefbd1f6d/","title":"Simone Biles","type":"ATHLETE"},"Favorites:{\"uuid\":\"4a7b7b26-dea0-46b4-bf75-51deaa1cfd34\"}":{"__typename":"Favorites","uuid":"4a7b7b26-dea0-46b4-bf75-51deaa1cfd34","photoUrl":"https://ucarecdn.com/caa20a5f-7897-42c8-b225-544289ccad5a/","title":"Lisbon, Portugal","type":"CITY"},"CausesSupported:{\"uuid\":\"5e04d58e-83c3-473b-b676-a41a45ea6d41\"}":{"__typename":"CausesSupported","uuid":"5e04d58e-83c3-473b-b676-a41a45ea6d41","name":"UNITAR","description":"\u003cp\u003eI work with dedication and passion, loving UNITAR's mission to empower change. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/f9742d77-c72a-40f9-b8de-bffefac41224/"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9bfb2236-c01e-483b-89bf-bb02fd32e204\"}":{"__typename":"DeepDives","uuid":"9bfb2236-c01e-483b-89bf-bb02fd32e204","content":"\u003cp\u003eIn my free time, I really enjoy writing, which has become not only a creative outlet but also a way to explore and make sense of the world around me. Over the years, I've had the privilege of collaborating with professors on academic projects that have been published, which has deepened my appreciation for scholarly work. However, one of my proudest achievements is self-publishing my fiction novel, a project I spent three years working on. I’m currently writing my second novel, and the process continues to be both creatively fulfilling and introspective. Writing allows me to challenge myself, convey emotions, and explore complex themes, while also offering an opportunity for personal growth and reflection. It’s a powerful tool for expression, and I recognize its importance in helping me understand different perspectives, grapple with big ideas, and connect with others on a deeper level.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"3ec4209f-ca2f-42af-bbe8-f387db56d94c\"}":{"__typename":"DeepDives","uuid":"3ec4209f-ca2f-42af-bbe8-f387db56d94c","content":"\u003cp\u003eMy greatest source of motivation comes from my immigrant parents, who sacrificed everything to give me the opportunities they never had. Their journey, filled with hardship and resilience, constantly reminds me of the power of perseverance and the importance of creating a better future. Their sacrifices fuel my drive to not only succeed but to ensure that my work makes a tangible, pragmatic impact in uplifting communities—especially those that face systemic barriers. I am deeply committed to using my education and experiences to advocate for meaningful change that empowers others, just as my parents empowered me to chase after my dreams and make them a reality. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"b189a0d1-ea5b-4090-8984-ee6974abd49e\"}":{"__typename":"DeepDives","uuid":"b189a0d1-ea5b-4090-8984-ee6974abd49e","content":"\u003cp\u003eMentorship matters to me because, coming from a low-income, first-generation background, mentors have been essential in helping me chase my dreams and seize opportunities I never thought possible, like attending Harvard University. Without their guidance, encouragement, and support, I honestly don’t know if I could have succeeded. This is why I’m so passionate about serving as a mentor myself. I want to be the resource and support system for others, especially those who may not have access to the same opportunities, and help them reach their full potential. Mentorship has shaped my journey, and I want to pass that forward to ensure others have the tools and confidence to be their best selves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"336fff88-f610-4191-a7bc-82748fef3516\"}":{"__typename":"DeepDives","uuid":"336fff88-f610-4191-a7bc-82748fef3516","content":"\u003cp\u003eMy dream job is to become the High Commissioner for Refugees at the UNHCR. In this role, I would advocate for displaced populations, working to transform global responses to migration crises. My goal would be to create sustainable solutions that not only address immediate needs but also promote long-term empowerment and integration for refugees, while rallying the international community to take bold, compassionate action.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"b19d6cbf-9d13-4bb6-bbb8-79d35479376c\"}":{"__typename":"Education","uuid":"b19d6cbf-9d13-4bb6-bbb8-79d35479376c","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Government","degree":null},"School:{\"uuid\":\"7a97d38e-d592-46c1-96d0-8eedb64677fc\"}":{"__typename":"School","uuid":"7a97d38e-d592-46c1-96d0-8eedb64677fc","name":"Science Park High School","city":"Newark","type":"HIGH","state":"New Jersey","country":"United States of America","zip":"07107"},"Education:{\"uuid\":\"40112635-464e-4191-b84e-a6b482fc13f0\"}":{"__typename":"Education","uuid":"40112635-464e-4191-b84e-a6b482fc13f0","school":{"__ref":"School:{\"uuid\":\"7a97d38e-d592-46c1-96d0-8eedb64677fc\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"a28de904-058b-4531-b3e0-c46cfe6c19ac\"}":{"__typename":"MentorPublicProfile","uuid":"a28de904-058b-4531-b3e0-c46cfe6c19ac","displayName":"Andre F.","slug":"andre-ferreira","biography":"\u003cp\u003eMy name is Andre Ferreira, and I grew up in a warm and vibrant immigrant community in Newark, New Jersey, where I witnessed firsthand the power of education to transform lives. As the son of hardworking parents who believed deeply in the value of learning, I saw how education can open doors, build confidence, and create opportunities that extend far beyond the classroom. These early experiences shaped my lifelong commitment to helping students thrive, particularly those who face systemic barriers that too often stand in the way of their potential.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI graduated from Harvard University in 2023 with a degree in Government, a secondary concentration in History, and a citation in American Sign Language. During my time at Harvard, I became deeply passionate about mentorship and teaching, devoting much of my time to working with students. For four years, I served as a mentor through the Harvard Ed Portal, where I supported learners from elementary school through high school in both one-on-one sessions and classroom settings. I also worked as a course assistant for Harvard professors, further developing my teaching skills and learning how to guide students with patience, clarity, and encouragement.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcross more than six years of mentoring, I have worked with students of many learning styles and backgrounds, including students with neurodivergence, and I understand how important it is to tailor instruction to each child’s unique needs. This experience taught me the value of meeting students exactly where they are, building on their strengths, and helping them grow at their own pace. I strive to create a supportive, confidence-building environment where students feel comfortable asking questions, making mistakes, and discovering the joy of learning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFamilies often want to know not only about academic qualifications, but also about who will be working with their children and the values that person brings to the table. I approach every student with respect, empathy, and a genuine belief in their ability to succeed. My role is not only to help students master material, but also to help them see themselves as capable, resilient learners.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduating from Harvard, I pursued my Master’s degree in International Politics at KU Leuven in Belgium, where I gained a global perspective on the political and social issues shaping our world. I currently work as a Program Assistant with UNITAR’s Global SDG Leadership Development Center, supporting leadership development initiatives connected to the United Nations Sustainable Development Goals. I have attended conferences internationally focused on environmental sustainability, refugee rights, and global equity, experiences that have strengthened my ability to connect education with real-world impact.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was honored to win a UN SDG competition for a proposal addressing food insecurity in the Global South using AI and sustainable technology. I am also the Co-Director of Forced to Flee, a global nonprofit advocating for immigrant and refugee rights, and I volunteer with Human Rights First and other local organizations. These experiences reflect my deep commitment to service, justice, and empowering communities through knowledge.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and advocacy, I am a student-athlete on my school’s soccer team, which has taught me discipline, teamwork, and perseverance. I also self-published a novel, \u003cem\u003eA Story Untold\u003c/em\u003e, inspired by Greek mythology, one of my lifelong passions, which reflects my love of storytelling and creativity.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am currently pursuing my JD at UCLA School of Law on a full merit scholarship, with the goal of becoming a public interest attorney advocating for vulnerable communities. No matter how far my academic and professional journey takes me, I always return to the belief that education has the power to change lives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am excited to bring this belief, along with my experience, global perspective, and enthusiasm, to Curious Cardinals. Families can expect me to be a mentor who is patient, encouraging, and deeply invested in their child’s growth. I meet students where they are, adapt to their learning styles, and focus on building both strong academic foundations and lasting confidence. I look forward to supporting the next generation of students and helping them see all that they are capable of achieving.\u003c/p\u003e","teachingVideoPlaybackId":"fll02i00oNc017kPc4WZ01BjoRmBPnnFkIdI2QZGC4RuaYY","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I’m most proud of is being able to pursue my undergraduate, master’s, and law school education at some of the top universities in the world without placing a financial burden on my parents. Through scholarships, fellowships, and diligent planning, I’ve been able to fully support my education, which has allowed me to focus on my academic and professional goals without the stress of financial constraints.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis achievement not only reflects the sacrifices my immigrant parents made for me, but also underscores my commitment to making the most of the opportunities I’ve been given. It speaks to my dedication, perseverance, and ability to navigate challenges—qualities I bring into my teaching and mentorship. Families can feel confident knowing that I understand the value of education on a personal level and the doors it can open, and that I will bring the same determination and encouragement to supporting their children’s growth.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c5be08d2-87a2-419b-91bb-31d788fb45a9\"}"},{"__ref":"Favorites:{\"uuid\":\"2659c704-ee11-41c3-a173-1463426d1681\"}"},{"__ref":"Favorites:{\"uuid\":\"4a7b7b26-dea0-46b4-bf75-51deaa1cfd34\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5e04d58e-83c3-473b-b676-a41a45ea6d41\"}"}],"major":"Government","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9bfb2236-c01e-483b-89bf-bb02fd32e204\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ec4209f-ca2f-42af-bbe8-f387db56d94c\"}"},{"__ref":"DeepDives:{\"uuid\":\"b189a0d1-ea5b-4090-8984-ee6974abd49e\"}"},{"__ref":"DeepDives:{\"uuid\":\"336fff88-f610-4191-a7bc-82748fef3516\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a36251f6-872c-42ae-bf65-4ae8cd6cd09e/-/preview/-/format/jpg/","https://ucarecdn.com/d1f824e9-ada2-43b7-b1ce-efc103a90d3f/-/preview/-/format/jpg/","https://ucarecdn.com/83acba36-e84e-4768-aa9c-0b4bb7b2453b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b19d6cbf-9d13-4bb6-bbb8-79d35479376c\"}"},{"__ref":"Education:{\"uuid\":\"40112635-464e-4191-b84e-a6b482fc13f0\"}"}],"hiredAt":"2024-12-24T06:10:39.046Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","6-8 Grade Science","Writing","American Sign Language","History","Reading","College Essay Writing","Academic Coaching","Executive Function","K-6 Storybook","Creative Writing","Sports Journalism","History Project","Video / Photography","Law / Government / Policy","Sustainability","Journalism","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"andre-ferreira\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"a28de904-058b-4531-b3e0-c46cfe6c19ac\"}"}}},"_sentryTraceData":"d8625ff032dd40238a5fd9f9fc6b8471-b0efc2cf8bb18152-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=d8625ff032dd40238a5fd9f9fc6b8471,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"andre-ferreira"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLa
