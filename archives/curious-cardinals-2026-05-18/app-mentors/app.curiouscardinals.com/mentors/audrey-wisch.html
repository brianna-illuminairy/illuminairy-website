9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}":{"__typename":"Question","uuid":"9e75791c-bdc2-4a2f-990e-a4924ca117ac","question":"What’s something you’ve taught a student at CC that you’re proud of/want to teach more students?"},"DeepDives:{\"uuid\":\"86632efa-98e5-408a-83d9-c13cc2155c7c\"}":{"__typename":"DeepDives","uuid":"86632efa-98e5-408a-83d9-c13cc2155c7c","content":null,"videoPlaybackId":"1xboRcZBuqG2LMMH02wmjMl75g1dpEHMnYd02uBvgsI34","question":{"__ref":"Question:{\"uuid\":\"9e75791c-bdc2-4a2f-990e-a4924ca117ac\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"48ee0585-80c8-47e6-a5e5-09422ebfd954\"}":{"__typename":"DeepDives","uuid":"48ee0585-80c8-47e6-a5e5-09422ebfd954","content":"\u003cp\u003e\u003cstrong\u003eI love to run! \u003c/strong\u003eRunning is my favorite way to explore new places, clear my mind, and challenge myself physically.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI \u003cstrong\u003elove walking and hiking \u003c/strong\u003etoo! I often walk to the office. My favorite part of being in the Bay Area is the amazing access to exquisite nature!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI am a \u003cstrong\u003efrequent podcast listener\u003c/strong\u003e - Pivot (love Prof G and Kara Swisher) and How I Built This are two of my current favorites and I listen to NYT Daily, NPR Daily and or WSJ Daily daily! In high school I loved NPR’s More Perfect!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI am \u003cstrong\u003ean avid reader.\u003c/strong\u003e I set a New Years’ Resolution to read at least 1 book per month and am averaging 2 books per month. I love reading fiction!\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI \u003cstrong\u003elove my friends.\u003c/strong\u003e I am super social and have friends from all walks of life and all ages.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI consider myself to be a \u003cstrong\u003efoodie\u003c/strong\u003e and love eating at yummy restaurants. I also enjoy cooking - ask me about my signature salad.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI am an \u003cstrong\u003eappreciator of all things art and culture.\u003c/strong\u003e When I have time, I love to go to museums or galleries.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI \u003cstrong\u003elove mentoring!\u003c/strong\u003e I still mentor one of my first students weekly and always hope to carve out time to remain an active CC mentor.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eI love learning \u003c/strong\u003ein all shapes and forms - podcasts, reading, as a founder. I also love learning from mentors and value seeking out extraordinary mentors in my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}":{"__typename":"School","uuid":"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6","name":"Riverdale Country School","city":"Bronx","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"b2732480-fb29-4ee4-bf46-888b706d925d\"}":{"__typename":"Education","uuid":"b2732480-fb29-4ee4-bf46-888b706d925d","school":{"__ref":"School:{\"uuid\":\"b2964780-5eb0-4a9e-a7dd-77d0d517c5b6\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"8b7b4031-3299-49ed-966a-b74da4942387\"}":{"__typename":"Education","uuid":"8b7b4031-3299-49ed-966a-b74da4942387","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"TBD","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"f3a98875-6389-4c8f-aa7d-2ea46cfb5828\"}":{"__typename":"MentorPublicProfile","uuid":"f3a98875-6389-4c8f-aa7d-2ea46cfb5828","displayName":"Audrey W.","slug":"audrey-wisch","biography":"\u003cp\u003eAudrey paused her studies at Stanford University after founding Curious Cardinals, chasing her dreams to not only help K-12 students unlock their greatest potential, but also to provide college students with meaningful work. After teaching her first workshop on mass incarceration to high school students at the start of the pandemic, Audrey mobilized her most ambitious peers at Stanford and beyond to share topics they were passionate about to K-12 students. Since then, Audrey has spoken on \u003cu\u003eCNN\u003c/u\u003e and in \u003cu\u003eForbes\u003c/u\u003e to share her vision to create a community of lifelong learners and doers. Curious Cardinals has now raised $6.8 million in seed funding led by Anthos Capital and Audacious Ventures. She was recognized in the 2022 \u003cu\u003eForbes 30 Under 30 Education and Youngest category\u003c/u\u003e.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAt Stanford, Audrey was a history major whose research on the history of sexual assault was published in the Stanford Historical Journal. Audrey’s passion for history is best summarized in Marcus Garvey’s famous quote: “a people without their history is like a tree without roots.” Passionate about immigration and criminal justice reform as well as gender equity, Audrey previously aspired to be the next RBG! Now Audrey takes that passion to Curious Cardinals - with aspirations to change the future of K-12 education to a model that champions individuality and instills confidence and inspiration in students from all backgrounds.\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhen Audrey is not working or speaking to members of the Curious
