xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"2d102ad6-be49-483e-a2dc-1e821b6d812f\"}":{"__typename":"DeepDives","uuid":"2d102ad6-be49-483e-a2dc-1e821b6d812f","content":"\u003cp\u003eIn my spare time, I love running! Making the time to go on runs amidst my busy schedule offers a chance for me to escape the hustle and bustle of everyday life, clear my head, connect with nature, and explore unfamiliar surroundings. Currently, I am excitedly preparing for the Boston half marathon alongside three of my roommates!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"015e22e2-3000-4253-a09b-24ad9725eec9\"}":{"__typename":"DeepDives","uuid":"015e22e2-3000-4253-a09b-24ad9725eec9","content":"\u003cp\u003eI chose to major in Applied Mathematics because it combines my passion for problem-solving with my love for practical applications. Mathematics has always fascinated me, and I find joy in unraveling complex puzzles and finding elegant solutions. However, I didn't want my studies to be confined to abstract theories and concepts. Applied Mathematics offered the perfect balance by allowing me to apply mathematical principles to real-world problems, from analyzing data sets to modeling complex systems.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3876aafe-c691-4ddf-a594-ba9b55712614\"}":{"__typename":"DeepDives","uuid":"3876aafe-c691-4ddf-a594-ba9b55712614","content":"\u003cp\u003eIf I could give advice to my middle or high school self, it would be to embrace the mindset of pushing myself and understanding that making mistakes is an essential part of learning and growth. I would encourage myself to be ambitious and not confine myself to one area of interest but instead explore new topics and passions. It's easy to stick to what feels comfortable, but true growth happens when we step outside of our comfort zones.By pushing boundaries and exploring diverse areas, I would tell my younger self to embrace the excitement of discovery and to never stop seeking knowledge and personal growth.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"59ad6c3b-25c7-45fb-96d3-c9a6669901f9\"}":{"__typename":"DeepDives","uuid":"59ad6c3b-25c7-45fb-96d3-c9a6669901f9","content":"\u003cp\u003eMy greatest role model and mentor is undoubtedly my older brother. Throughout my life, he has been a constant source of inspiration and guidance. His unwavering support and ability to believe in my abilities even when I doubted myself has given me the confidence to discover my own passions without the fear of failure. Seeing how he has navigated challenges and pursued his own dreams with determination has shaped my perspective on success and resilience. I could not be more grateful for my brother's invaluable mentorship, and it continues to inspire me to do the same and make a positive difference in the lives of others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}":{"__typename":"School","uuid":"2ff73c87-6442-482c-8d92-863dfb263ea0","name":"The Dalton School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"d36d3a59-296e-46e8-8e30-a7c98b778c46\"}":{"__typename":"Education","uuid":"d36d3a59-296e-46e8-8e30-a7c98b778c46","school":{"__ref":"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"f47b8662-d5f0-46a4-a3bb-0808e6f9e01e\"}":{"__typename":"Education","uuid":"f47b8662-d5f0-46a4-a3bb-0808e6f9e01e","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Applied Mathematics and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"8f19f22f-0a2e-4bdb-b3e9-d0ab4c3f829e\"}":{"__typename":"MentorPublicProfile","uuid":"8f19f22f-0a2e-4bdb-b3e9-d0ab4c3f829e","displayName":"Natalie M.","slug":"natalie-martin","biography":"\u003cp\u003eNatalie is currently a sophomore at Harvard College pursuing a major in applied mathematics and economics. She is involved in several student organizations on campus such as Harvard Undergraduate Women in Business and the business staff of the Hasty Pudding Theatricals, the oldest theater company in the country!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNatalie has always loved collaborating with others, starting on her tutoring journey five years ago during her time in high school. Over the years, she has remained dedicated to tutoring, extending her services by working closely with Children’s Aid, a nonprofit organization based in New York City dedicated to helping adolescents and families of high need reach their potential. Witnessing the hurdles faced by underserved communities in obtaining quality education firsthand, Natalie recognized the exclusion of many talented and motivated students due to limited resources. This experience taught Natalie the transformative power of education and fueled her passion for driving change. Natalie looks forward to connecting with ambitious and driven students via the Curious Cardinals platform, aiming to create an engaging and exciting learning experience for them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlongside her tutoring endeavors, Natalie has actively pursued her career aspirations within the finance industry. She gained valuable experience as an Investment Analyst through an internship at a venture capital firm situated in New York City.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her free time, Natalie loves to explore new neighborhoods, go on runs, read, do the daily New York Times crossword puzzle, and spend time with friends and family :)\u003c/p\u003e","teachingVideoPlaybackId":"nB7gv5z8ZSo6HykLA01VirdZwHG800xTKhbsqxuuAm838","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Applied Mathematics and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2d102ad6-be49-483e-a2dc-1e821b6d812f\"}"},{"__ref":"DeepDives:{\"uuid\":\"015e22e2-3000-4253-a09b-24ad9725eec9\"}"},{"__ref":"DeepDives:{\"uuid\":\"3876aafe-c691-4ddf-a594-ba9b55712614\"}"},{"__ref":"DeepDives:{\"uuid\":\"59ad6c3b-25c7-45fb-96d3-c9a6669901f9\"}"}],"active":true,"profilePhotos":["https://uc
