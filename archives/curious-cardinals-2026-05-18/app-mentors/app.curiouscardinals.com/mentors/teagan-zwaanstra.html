xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"CausesSupported:{\"uuid\":\"8dfdb697-eff0-4fe1-ab5b-359639c79b1d\"}":{"__typename":"CausesSupported","uuid":"8dfdb697-eff0-4fe1-ab5b-359639c79b1d","name":"Run Your City (RYC) Palo Alto","description":"\u003cp\u003eThis fall I helped start a RYC chapter in Palo Alto, hosting free practices!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/5884567c-96d4-4b40-aa91-a01a5f7bd9cd/"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"7ddf9777-4a7e-4f3c-a9bb-9fdbabdfa97f\"}":{"__typename":"DeepDives","uuid":"7ddf9777-4a7e-4f3c-a9bb-9fdbabdfa97f","content":"\u003cp\u003eBack in high school, when I wasn’t training on the track, I spent my summers working as a nanny. For three consecutive years, I had the pleasure of caring for children of various ages, which taught me invaluable skills in patience, adaptability, and the importance of celebrating small wins. It was a rewarding experience that gave me a deeper appreciation for nurturing and guiding others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of nannying, you could often find me exploring the Colorado mountains with friends. Whether it was hiking, camping, or just soaking in the breathtaking scenery, I’ve always had a love for the outdoors. Growing up surrounded by nature instilled in me a deep appreciation for our amazing planet and the importance of spending time in the great outdoors.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"674b2826-c25c-4cc8-86ee-00dba31a81b2\"}":{"__typename":"DeepDives","uuid":"674b2826-c25c-4cc8-86ee-00dba31a81b2","content":"\u003cp\u003eI chose to major in Mechanical Engineering because of its vast range of applications that go far beyond traditional engineering. The field has given me a strong foundation in critical thinking and problem-solving, skills that are essential in nearly every aspect of life. One of the most fulfilling parts of this journey has been the chance to create something from the ground up—building with my own two hands and watching a project come to life. There’s nothing quite like the satisfaction of seeing your hard work, calculations, and designs turn into a tangible result.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAdditionally, this major has introduced me to some of the most talented and inspiring people I’ve ever met. Collaborating with them has pushed me to grow, both academically and personally. I love the process of learning through trial and error, and seeing firsthand how theory translates into real-world applications has been an incredibly rewarding experience.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"33a66d4c-a65f-4140-86ec-d4ee035c746f\"}":{"__typename":"DeepDives","uuid":"33a66d4c-a65f-4140-86ec-d4ee035c746f","content":"\u003cp\u003eMy dream job is to become a footwear designer for Nike, focusing specifically on creating track spikes. As a track and field athlete, I’ve developed a deep appreciation for the role that footwear plays in performance. I know firsthand how the right design can enhance speed, comfort, and confidence on the track. Combining my background in mechanical engineering with my passion for sports, I aspire to create innovative designs that help athletes push their limits.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWorking with Nike, especially after my experience interning under the Jordan Brand, would be a dream come true. It’s a company that blends cutting-edge technology with a deep understanding of the athlete’s needs. I’m excited by the opportunity to contribute to the development of products that can make a real difference for competitors at all levels.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"ec5bfbff-c1e2-4e66-b2d1-0bc79433bdf9\"}":{"__typename":"DeepDives","uuid":"ec5bfbff-c1e2-4e66-b2d1-0bc79433bdf9","content":"\u003cp\u003eOut of all the things I could be doing, I chose mentorship because I love sharing my knowledge and helping others reach their potential. My experiences as a nanny, a team captain, and a student have shown me how rewarding it is to support and guide others, whether it's on the track, in the classroom, or in everyday life. Mentorship allows me to combine my passion for problem-solving and my love for connecting with people.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve had incredible mentors who made a huge impact on my academic and athletic journey, and I want to pay it forward. Mechanical engineering and data science can be challenging, but I believe that learning is a collaborative process, and I’m excited to help others navigate through the difficulties and celebrate the wins. There’s nothing more satisfying than seeing someone gain confidence in their abilities and watching their hard work turn into success.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"65cfb289-2b13-47cd-bc72-556f6bab22a7\"}":{"__typename":"School","uuid":"65cfb289-2b13-47cd-bc72-556f6bab22a7","name":"Thunder Ridge High School","city":"Highlands Ranch","type":"HIGH","state":"Colorado","country":"United States","zip":"80129"},"Education:{\"uuid\":\"1035e3d5-9b39-4527-af3a-ff486a55e040\"}":{"__typename":"Education","uuid":"1035e3d5-9b39-4527-af3a-ff486a55e040","school":{"__ref":"School:{\"uuid\":\"65cfb289-2b13-47cd-bc72-556f6bab22a7\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"33cdaca0-09d2-4a2d-9564-c343116201dc\"}":{"__typename":"Education","uuid":"33cdaca0-09d2-4a2d-9564-c343116201dc","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"4aeabfa4-5b09-4862-abd9-6c6eaf4631d6\"}":{"__typename":"MentorPublicProfile","uuid":"4aeabfa4-5b09-4862-abd9-6c6eaf4631d6","displayName":"Teagan Z.","slug":"teagan-zwaanstra","biography":"\u003cp\u003eHello everyone! My name is Teagan Zwaanstra, and I’m currently a senior at Stanford University, studying Mechanical Engineering and Data Science. I’m also a proud captain of the varsity track and field team, where I specialize in the long jump and short sprints. Growing up in the beautiful state of Colorado, I developed a passion for the outdoors—whether it’s hiking, trail running, or simply enjoying nature.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis past summer, I had the incredible opportunity to work with Nike Inc. under the Jordan Brand in New York City, diving into consumer insights and strategic projects. It was a fantastic chance to merge my technical skills with the fast-paced world of sports marketing, while also getting a taste of life in the big city.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWith a strong foundation in engineering principles and a deep interest in data analytics, I’m excited to share my knowledge and help tackle an array of subjects. Looking forward to working together and making learning a fun, engaging experience!\u003c/p\u003e","teachingVideoPlaybackId":"tWgrvcNcbqA00US9spbokOwAdM2NjGJo5S01UCjixz402w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8dfdb697-eff0-4fe1-ab5b-359639c79b1d\"}"}],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7ddf9777-4a7e-4f3c-a9bb-9fdbabdfa97f\"}"},{"__ref":"DeepDives:{\"uuid\":\"674b2826-c25c-4cc8-86ee-00dba31a81b2\"}"},{"__ref":"DeepDives:{\"uuid\":\"33a66d4c-a65f-4140-86ec-d4ee035c746f\"}"},{"__ref":"DeepDives:{\"uuid\":\"ec5bfbff-c1e2-4e66-b2d1-0bc79433bdf9\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c29efac7-5701-46fb-8490-032603062d91/-/preview/-/format/jpg/","https://ucarecdn.com/17bcc65c-633a-4ee0-bb02-90294c0cb2a5/-/preview/-/format/jpg/","https://ucarecdn.com/a6734885-cf17-4d23-ae45-1a8d15b738a3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"1035e3d5-9b39-4527-af3a-ff486a55e040\"}"},{"__ref":"Education:{\"uuid\":\"33cdaca0-09d2-4a2d-9564-c343116201dc\"}"}],"hiredAt":"2024-11-12T20:12:24.057Z","topics":["Physics","Algebra I","Algebra II","Statistics","Coding / Programming","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"teagan-zwaanstra\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"
