xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c510cc9c-f74e-4d4c-babb-2cbaf45434e8\"}":{"__typename":"Favorites","uuid":"c510cc9c-f74e-4d4c-babb-2cbaf45434e8","photoUrl":"https://ucarecdn.com/1b1f5d67-3e25-447d-8ce8-b22304a86cc9/","title":"Being Mortal by Atul Gawande ","type":"BOOK"},"Favorites:{\"uuid\":\"71088920-2748-4a15-926b-d6ff3e2602c0\"}":{"__typename":"Favorites","uuid":"71088920-2748-4a15-926b-d6ff3e2602c0","photoUrl":"https://ucarecdn.com/85100563-2690-4db3-8455-373b25d61c04/","title":"Paramore! ","type":"ARTIST"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"404b3ea1-eb3d-45fe-bad1-d751c8353758\"}":{"__typename":"DeepDives","uuid":"404b3ea1-eb3d-45fe-bad1-d751c8353758","content":"\u003cp\u003eMy dream is to become a physician who bridges clinical care, health policy, and education — someone who not only treats patients but also helps shape more equitable healthcare systems. I’m passionate about making healthcare accessible, teaching across all ages and backgrounds, and using research, technology, and storytelling to drive change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf I'm really shooting for the stars though... I'd love to be an astronaut-physician! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"d09ef4bd-5fcf-4b9f-8880-e6d4defb0909\"}":{"__typename":"DeepDives","uuid":"d09ef4bd-5fcf-4b9f-8880-e6d4defb0909","content":"\u003cp\u003eI’m a huge music nerd! I play bass guitar and classical piano, and I love finding ways to combine art and science. I believe creativity makes learning more powerful (and way more fun).\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"308d055d-0141-420f-b0eb-9e4bd699aacf\"}":{"__typename":"School","uuid":"308d055d-0141-420f-b0eb-9e4bd699aacf","name":"Carnegie Vanguard High School","city":"Houston","type":"HIGH","state":"TX","country":"USA","zip":"77019"},"Education:{\"uuid\":\"ae665d89-ecf7-4781-8b90-2d616706e63f\"}":{"__typename":"Education","uuid":"ae665d89-ecf7-4781-8b90-2d616706e63f","school":{"__ref":"School:{\"uuid\":\"308d055d-0141-420f-b0eb-9e4bd699aacf\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bc77f602-b393-4fa6-9e11-df16e522c65d\"}":{"__typename":"School","uuid":"bc77f602-b393-4fa6-9e11-df16e522c65d","name":"The University of Texas at Austin","city":"Austin","type":"COLLEGE","state":"Texas","country":"United States","zip":"78712"},"Education:{\"uuid\":\"b5e2e36d-0afd-491d-8f71-671522d1e291\"}":{"__typename":"Education","uuid":"b5e2e36d-0afd-491d-8f71-671522d1e291","school":{"__ref":"School:{\"uuid\":\"bc77f602-b393-4fa6-9e11-df16e522c65d\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Public Health ","degree":null},"MentorPublicProfile:{\"uuid\":\"5f7cc735-b1dd-4166-a5f0-f6b87f2323ca\"}":{"__typename":"MentorPublicProfile","uuid":"5f7cc735-b1dd-4166-a5f0-f6b87f2323ca","displayName":"Miriam Y.","slug":"miriam-yampuler","biography":"\u003cp\u003eIf you ever find yourself deep in a conversation with me, there’s a good chance we’ll end up talking about healthcare, music theory, how to memorize an absurd number of amino acid structures, or anything related to science!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Miriam! I'm a public health advocate and STEM nerd with a passion for helping people learn \u003cem\u003ein a way that actually sticks.\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am a \u003cstrong\u003eFulbright Fellow\u003c/strong\u003e to Spain as an English Teaching Assistant. I graduated from the \u003cstrong\u003eUniversity of Texas at Austin with Honors\u003c/strong\u003e, a B.S. in Public Health, a Business minor, and the designation of \u003cstrong\u003eDistinguished Graduate \u003c/strong\u003ein both Research and Service. (See more here: https://cns.utexas.edu/news/accolades/meet-three-exceptional-seniors-among-our-2025-graduates-distinction)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my time there (and a semester at \u003cstrong\u003eCornell University\u003c/strong\u003e), I followed my curiosity wherever it led — from synthetic biology research to analyzing how cities like Austin and New York tackle healthcare access for low-income adults. This is in addition to the \u003cem\u003enonprofit I founded in high school,\u003c/em\u003e which helped land me acceptances to top colleges and finalist placements in enough prestigious scholarships \u003cstrong\u003eCoca-Cola Finalist and Elks MVP\u003c/strong\u003e to grant me a full-ride through school.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I’m a translator. I break down complex material, connect it to real life, and teach it with empathy, structure, and a little humor. Whether your child is tackling chemistry pathways, writing their first research paper, or preparing for college or med school, I’ll tailor each session to their needs and learning style. And if they want to talk healthcare policy or throw some Taylor Swift into their flashcards cards? I’m on board.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI believe in learning as a lifelong, joyful process. Outside of academics, I play bass guitar and classical piano, speak four languages to varying degrees, and never say no to a dance class or late-night policy debate.\u003cem\u003e I encourage students to pursue their academic goals without losing the fun\u003c/em\u003e — because well-rounded people make the best learners.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy proudest moments haven’t just come from awards — they’ve come from the classroom and the clinic. I’ve taught public health to high school students at \u003cstrong\u003eHarvard and Yale summer programs\u003c/strong\u003e, led health equity workshops, and worked with patients ranging from toddlers to 102-year-olds as a vision therapist free clinic volunteer, and a geriatric healthcare technician. Whether I’m working with aspiring doctors, first-gen students, or kids learning to read again after brain injury, \u003cem\u003eI aim to meet each student exactly where they are.\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you’re looking for a mentor who can connect with your child across disciplines, learning styles, and walks of life,\u003cstrong\u003e I’d be honored to be in their corner.\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlaybackId":"lCUwc23xCjyOvwGAG4hdvWv4k5354ONshls00b5HKj9k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c510cc9c-f74e-4d4c-babb-2cbaf45434e8\"}"},{"__ref":"Favorites:{\"uuid\":\"71088920-2748-4a15-926b-d6ff3e2602c0\"}"}],"causesSupported":[],"major":"Public Health ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"404b3ea1-eb3d-45fe-bad1-d751c8353758\"}"},{"__ref":"DeepDives:{\"uuid\":\"d09ef4bd-5fcf-4b9f-8880-e6d4defb0909\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/aae589bb-dc12-422e-92ca-47e2a7e0dcef/-/preview/-/format/jpg/","https://ucarecdn.com/fd52bc3e-7197-4330-9d32-1c203ad027e5/-/preview/-/format/jpg/","https://ucarecdn.com/d603ed16-f131-48c3-af77-9a56a316b7aa/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"ae665d89-ecf7-4781-8b90-2d616706e63f\"}"},{"__ref":"Education:{\"uuid\":\"b5e2e36d-0afd-491d-8f71-671522d1e291\"}"}],"hiredAt":"2025-07-17T18:15:30.421Z","topics":["Pre-Algebra","Algebra I","K-5 Grade Math","Algebra II","Statistics","6-8 Grade Science","Chemistry","Biology","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","Economics","K-6 Storybook","Creative Writing","Music","Medicine / Health","STEM Project","Law / Government / Policy","Sustainability"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"miriam-yampuler\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5f7cc735-b1dd-4166-a5f0-f6b87f2323ca\"}"}}},"_sentryTraceData":"151d0e9b6eca404087a34c4aa382fcab-9430c534b58506c0-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=151d0e9b6eca404087a34c4aa382fcab,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"miriam-yampuler"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.go
