xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2b3f5743-25e2-4c55-a669-2cd89d6e10e9\"}":{"__typename":"DeepDives","uuid":"2b3f5743-25e2-4c55-a669-2cd89d6e10e9","content":"\u003cp\u003eBeing raised in a trilingual household, I've maintained a deep connection to languages from an early age. My mother conversed with my sister and me in Spanish, while my father communicated with us in Farsi, thereby exposing me to diverse cultures. Curiously, I was not able to study Spanish in high school; however, I made the deliberate choice to immerse myself in the study of French instead. Right from the outset, I found myself captivated not only by the language itself but also by the allure of its culture. Fortunately, I had the privilege of spending several summers in France, an experience that ignited a passion within me. It was then that I knew I had to dedicate myself to pursuing French as my chosen major.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"aa74ffa0-f8be-4bf2-b833-573df71eaa48\"}":{"__typename":"DeepDives","uuid":"aa74ffa0-f8be-4bf2-b833-573df71eaa48","content":"\u003cp\u003eI would advise my younger self to embrace a more relaxed approach and prioritize activities that genuinely bring happiness. Life's brevity reminds us not to squander our time on pursuits driven by obligation rather than passion. The years beyond middle and high school hold so many opportunities, making it unwise to subject oneself to undue stress. This period offers a valuable chance to explore one's interests, discover personal joys, and recognize the path to follow in college. Every day should be savored, cherishing moments with family and friends, relishing the familiarity of one's hometown, and treasuring the wisdom given by beloved teachers.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4b070e9a-ccb0-430c-add0-0624602c4f00\"}":{"__typename":"DeepDives","uuid":"4b070e9a-ccb0-430c-add0-0624602c4f00","content":"\u003cp\u003eMentorship serves as a valuable resource in navigating the often challenging journey of self-discovery and professional development. It provides individuals with essential guidance to uncover their true passions and identify their career aspirations. Personally, mentorship represents an indispensable instrument that has played a pivotal role in fostering my own personal growth and enabling my achievements. Indeed, I owe much of my current success to the guidance and support of my mentors throughout my life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b4241895-2848-46e1-aa57-d92ccc1b65d1\"}":{"__typename":"DeepDives","uuid":"b4241895-2848-46e1-aa57-d92ccc1b65d1","content":"\u003cp\u003eI have a love for cinema and television, finding immense joy in immersing myself in a diverse array of films, particularly during those cozy, rainy days. Additionally, I gain great satisfaction from embarking on hiking adventures and exploring new trails. While my home state of Florida may not offer as many hiking opportunities, I seize every chance to indulge in this outdoor pursuit whenever it presents itself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"6e08c71e-6a4b-488b-9a0b-007302fffcde\"}":{"__typename":"School","uuid":"6e08c71e-6a4b-488b-9a0b-007302fffcde","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14853"},"Education:{\"uuid\":\"2b3b511a-7de8-4d48-bc5a-1751626bd192\"}":{"__typename":"Education","uuid":"2b3b511a-7de8-4d48-bc5a-1751626bd192","school":{"__ref":"School:{\"uuid\":\"6e08c71e-6a4b-488b-9a0b-007302fffcde\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"French","degree":"BA"},"School:{\"uuid\":\"a37f34ca-7e2f-4641-9e1c-53a539098708\"}":{"__typename":"School","uuid":"a37f34ca-7e2f-4641-9e1c-53a539098708","name":"Oxbridge Academy","city":"West Palm Beach","type":"HIGH","state":"Florida","country":"United States","zip":"33409"},"Education:{\"uuid\":\"551fd49f-84b6-4e78-86f0-b5acaa738cbc\"}":{"__typename":"Education","uuid":"551fd49f-84b6-4e78-86f0-b5acaa738cbc","school":{"__ref":"School:{\"uuid\":\"a37f34ca-7e2f-4641-9e1c-53a539098708\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"d113f495-8989-4ff9-b0c0-813498de8e04\"}":{"__typename":"MentorPublicProfile","uuid":"d113f495-8989-4ff9-b0c0-813498de8e04","displayName":"Nadia S.","slug":"nadia-sadati","biography":"\u003cp\u003eHello! My name is Nadia, and I am a Hispanic student at Cornell University pursuing a Bachelor’s degree in French and minoring in business.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eMy abiding passion lies in the realm of travel, where I channel my love for languages to explore and understand the world. Having grown up in a multilingual household, I was fortunate to be exposed to a multitude of languages from a very young age. During my high school summers, I had the privilege of further nurturing this passion by undertaking academic pursuits abroad at esteemed institutions like La Sorbonne and studying in vibrant cities such as Madrid, Nice, and Paris. Additionally, I dedicated my time to voluntary work at La Caridad Center, utilizing my linguistic skills to offer assistance to those in need.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eMy commitment to community engagement remains unwavering during my time at Cornell, where I actively participate in various structured organizations. These include the English Language Support Office, Big Red Ambassadors, Arts \u0026amp; Sciences Ambassadors, and the Cornell Latinx Association of Prelaws. In these roles, I've had the privilege of mentoring students and peers of varying ages, providing guidance in both their academic and social endeavors.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eCurrently, my academic interests span an array of legal fields, encompassing international law, entertainment law, corporate law, and immigration law. However, my passions extend beyond the confines of academia. I hold a profound fascination for fashion, film, and languages. As a person of Panamanian and Iranian descent, I possess fluency in both Spanish and French, with ongoing efforts to master Persian and Mandarin. In the present semester, I engaging as a junior associate with Global Prairie, a purpose-driven marketing firm, where I am gaining valuable insights into the global marketing landscape while contributing to the execution of client projects.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eIn my leisure time, I derive enjoyment from activities such as playing volleyball, embarking on hikes, and savoring a variety of international cuisines. I take great pride in my strong work ethic, which drives my determination to achieve both my short-term and long-term goals. As a hyphenated American, I am deeply committed to assisting the next generation in the pursuit of their own aspirations as well.\u003c/p\u003e","teachingVideoPlaybackId":"p4VzXrMemSckSwYwhB01k02I01dyWulD01QQDxq9lP59KpE","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"French","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2b3f5743-25e2-4c55-a669-2cd89d6e10e9\"}"},{"__ref":"DeepDives:{\"uuid\":\"aa74ffa0-f8be-4bf2-b833-573df71eaa48\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b070e9a-ccb0-430c-add0-0624602c4f00\"}"},{"__ref":"DeepDives:{\"uuid\":\"b4241895-2848-46e1-aa57-d92ccc1b65d1\"}"}],"active":true,"profilePhotos":["https://api.dicebear.com/7.x/initials/svg?seed=NS"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2b3b511a-7de8-4d48-bc5a-1751626bd192\"}"},{"__ref":"Education:{\"uuid\":\"551fd49f-84b6-4e78-86f0-b5acaa738cbc\"}"}],"hiredAt":"2023-09-16T12:55:09.144Z","topics":["French","Spanish","Mandarin Chinese","Business / Entrepreneurship"],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/","https://ucarecdn.com/b138f07b-fab1-4770-9787-1ce1f9caadcc/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nadia-sadati\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d113f495-8989-4ff9-b0c0-813498de8e04\"}"}}},"_sentryTraceData":"ad4b2d8ab51a4ad49793f4c46c71e191-bf4c418227ee715d-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ad4b2d8ab51a4ad49793f4c46c71e191,sentry-sample_rate=0.2,sentr
