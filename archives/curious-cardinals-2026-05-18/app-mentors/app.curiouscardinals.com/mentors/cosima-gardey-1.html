3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Comparative Literature","degree":null},"MentorPublicProfile:{\"uuid\":\"4349ab37-dd7c-4343-9e56-eb90e1e5ccff\"}":{"__typename":"MentorPublicProfile","uuid":"4349ab37-dd7c-4343-9e56-eb90e1e5ccff","displayName":"Cosima G.","slug":"cosima-gardey-1","biography":"\u003cp\u003eHello! My name is Cosima and I just graduated from Brown University with a B.A. in Comparative Literature in English and German. I am passionate about writing, reading (preferably with a cup of tea), art history, languages, and the theatre.\u003cbr\u003e\u003cbr\u003eOriginally from West London, I first fell in love with literature and theatre while at St Paul’s Girls’ School reading lots of Shakespeare's work. While at St Paul’s, I starred in many plays, ran the junior school drama club, and received a scholarship for overall dramatic achievements. My interest in theatre  continued at Brown as an actor, playwright, director and producer passionate about collaborating with others. I served on the board of “Something on the Green”, a student-run organisation devoted to giving opportunities to people who are new to theatre. I also worked for SAPE (Brown’s Sexual Assault Peer Education program), where I facilitated workshops for sports teams to learn about creating a community of consent. As an educator, this was an invaluable experience in learning how to foster a safe and discursive environment even when dealing with sensitive topics.\u003cbr\u003e\u003cbr\u003eIn my down time, I love to listen to the likes of Kate Bush, PJ Harvey, Big Thief, and watch 90s movies and TV, like \u003cem\u003eThelma \u0026amp; Louise, Romeo + Juliet\u003c/em\u003e, \u003cem\u003eTwin Peaks\u003c/em\u003e. Creative conversation with my friends is most important to me- my favourite activity is to listen to a song one of my best friends has written, or visit them in their painting studio and see what masterpiece they’re cooking up.\u0026nbsp;\u003cbr\u003e\u003cbr\u003eThe past two Summers, I worked as a development intern for Film production companies reading scripts and writing reviews of them. I also worked at an independent theatre in New York City called ClubbedThumb for a couple months, and took an acting course at RADA in London. In the future, I hope to write and produce theatre / film that has the power to move people to affect change in the world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a94ae8ff-3c17-4464-bcd5-bc05c4cd9069\"}"},{"__ref":"Favorites:{\"uuid\":\"90b273ab-3a4a-4fc2-b89b-bac91489c68d\"}"},{"__ref":"Favorites:{\"uuid\":\"0e33654f-56d1-44b3-8884-d369d8b6e0c9\"}"}],"causesSupported":[],"major":"Comparative Literature","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/bd001941-6030-4b20-94fd-86e9edb90c72/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3dea1cf5-a933-4286-8bb4-71199e9edecb\"}"},{"__ref":"Education:{\"uuid\":\"db585bde-2211-4129-b022-bcc576bf75cb\"}"}],"hiredAt":"2023-09-12T15:30:49.829Z","topics":["Reading","Literature","History Project","Film / Theater","Women \u0026 Gender Studies","Public Speaking","German","Writing","Creative Writing"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"cosima-gardey-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4349ab37-dd7c-4343-9e56-eb90e1e5ccff\"}"}}},"_sentryTraceData":"921ec584b08043608278bd78de9e8b43-98ea7b2dcd2c5aab-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc5
