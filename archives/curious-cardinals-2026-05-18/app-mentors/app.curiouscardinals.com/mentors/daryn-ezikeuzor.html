0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"4b2e7b99-1d7e-4beb-84e0-0e7f31cc8a10\"}":{"__typename":"MentorPublicProfile","uuid":"4b2e7b99-1d7e-4beb-84e0-0e7f31cc8a10","displayName":"Daryn E.","slug":"daryn-ezikeuzor","biography":"\u003cp\u003eHi! My name is Daryn Ezikeuzor, and I am a senior at Harvard University majoring in Chemistry and Global Health. As a first-generation Nigerian student, I am passionate about making education accessible and inspiring students to reach their full potential. My academic journey has been fueled by a love for science, healthcare, and equity-driven research. I aspire to become a neonatologist and develop global initiatives that expand neonatal care to underserved communities worldwide.\u003c/p\u003e\u003cp\u003eAcademically, I bring a wealth of experience in advanced STEM coursework, having taken graduate-level Chemistry courses at Harvard that challenge me to think critically and push boundaries. I am also deeply involved in clinical research, studying developmental outcomes in premature infants as part of a neonatology project at NYU Grossman School of Medicine. This combination of hands-on research and rigorous academics equips me with a strong foundation to support students pursuing STEM and pre-med pathways.\u003c/p\u003e\u003cp\u003eBeyond academics, I am a mentor and leader. I have tutored students in ACT/SAT prep and advanced subjects like organic chemistry and calculus for over six years. Additionally, I’ve led community initiatives like “Dinner with Doctors,” connecting students with medical professionals, and developed craft-based projects to support hospital patients through the Harvard Fiber Arts Club. As the outgoing Vice President of the Harvard Black Pre-Medical Society, I’ve worked to create spaces that empower underrepresented students in medicine.\u003c/p\u003e\u003cp\u003eMy teaching philosophy centers on meeting students where they are. I believe every student has a unique learning style, and my goal is to make challenging concepts approachable, engaging, and fun. Whether it's diving into the periodic table, writing essays, or exploring your passions, I’m here to help you succeed.\u003c/p\u003e\u003cp\u003eOutside of academics, I love crocheting, reading, and sharing my journey through social media. I’ve even created TikTok content about life at Harvard, which resonated with thousands of students. This creative side helps me connect with students on a personal level, showing them that learning can be both dynamic and rewarding.\u003c/p\u003e\u003cp\u003eIf you’re looking for a tutor who is committed to your success and excited to help you achieve your goals, I’d be honored to be part of your journey. Let’s learn and grow together!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I’m most proud of is founding the \u003cem\u003eDinner with Doctors\u003c/em\u003e initiative in the Boston area. As a pre-med student and mentor, I wanted to bridge the gap between students aspiring to enter the medical field and the professionals who have already navigated that path. The program brought students and doctors together in an informal setting to discuss careers, share experiences, and build connections that might otherwise feel out of reach.\u003c/p\u003e\u003cp\u003eSeeing students light up with inspiration during those dinners, asking insightful questions, and gaining confidence in their future potential was incredibly rewarding. It reminded me of how impactful mentorship can be in shaping someone’s journey. Though it wasn’t an award-winning project, it was meaningful to me because it created a ripple effect—helping others feel seen, supported, and encouraged to pursue their dreams.\u003c/p\u003e\u003cp\u003eFor me, \u003cem\u003eDinner with Doctors\u003c/em\u003e embodies the power
