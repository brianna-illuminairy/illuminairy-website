xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"938ac9b6-9e62-4a5b-9512-5c91bfa41125\"}":{"__typename":"Favorites","uuid":"938ac9b6-9e62-4a5b-9512-5c91bfa41125","photoUrl":"https://ucarecdn.com/05583080-05dc-4d17-9e2d-387b1d08914c/","title":"San Francisco","type":"CITY"},"Favorites:{\"uuid\":\"828244bf-cf80-4185-aac3-d08aca4cb197\"}":{"__typename":"Favorites","uuid":"828244bf-cf80-4185-aac3-d08aca4cb197","photoUrl":"https://ucarecdn.com/d69063aa-8f60-4711-ae52-996319c6f974/","title":"Tennis","type":"SPORT"},"Favorites:{\"uuid\":\"f4fe35c0-01a1-4f8f-aa59-90742d41a4d3\"}":{"__typename":"Favorites","uuid":"f4fe35c0-01a1-4f8f-aa59-90742d41a4d3","photoUrl":"https://ucarecdn.com/d69063aa-8f60-4711-ae52-996319c6f974/","title":"Tennis","type":"SPORT"},"Favorites:{\"uuid\":\"4490ae0b-19d3-4978-b615-7ad7a06c8ce5\"}":{"__typename":"Favorites","uuid":"4490ae0b-19d3-4978-b615-7ad7a06c8ce5","photoUrl":"https://ucarecdn.com/c1fd41fd-d099-4469-94f5-3a9f231cf985/","title":"Harry Potter","type":"BOOK"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"38a380fa-4099-4b80-83fc-c3ba27def4de\"}":{"__typename":"DeepDives","uuid":"38a380fa-4099-4b80-83fc-c3ba27def4de","content":"\u003cp\u003eI love to unwind by running, playing tennis, swimming, and spending time outdoors with friends. I also enjoy reading, playing guitar, baking something sweet to share, and doing arts and crafts. Finding that balance between meaningful work and simple joys keeps me grounded and recharged!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"0fdd6acd-a57f-4a00-893d-efbff8a65265\"}":{"__typename":"DeepDives","uuid":"0fdd6acd-a57f-4a00-893d-efbff8a65265","content":"\u003cp\u003eOut of all the things I could be doing, mentorship feels the most meaningful because I genuinely love working with young people—they bring me so much joy and hope for the future. I’ve been lucky to have had amazing mentors throughout my life, people who believed in me, opened doors, and guided me through uncertainty. Their support shaped who I am, and I carry those lessons with me every day. Mentorship is a way for me to pay that forward—to help someone reach their goals, find opportunities, and feel seen and supported, just like I was.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4e74f55b-9b51-411f-9c44-3c75174b0cc8\"}":{"__typename":"DeepDives","uuid":"4e74f55b-9b51-411f-9c44-3c75174b0cc8","content":"\u003cp\u003eI’d love to publish a book. Writing has always been my favorite way to express myself—I started journaling consistently when I was seven and never really stopped. I’ve always loved reading books that capture the human experience and make me feel more connected to others and the world around me. I hope to write something that offers that same sense of comfort, reflection, or inspiration—whether it’s a memoir, essay collection, or even a children’s book.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"39b14845-fd87-4084-9edc-e3093f4b7f84\"}":{"__typename":"DeepDives","uuid":"39b14845-fd87-4084-9edc-e3093f4b7f84","content":"\u003cp\u003eDon’t worry so much about the future—things will fall into place. Trust that your hard work, intentional decision-making, and desire to do good in the world will carry you forward, even if the path doesn’t always feel clear. Try not to fixate on the outcomes or what’s “next” all the time. Enjoy the process, and allow yourself space to explore, grow, and just be present. Also, focus on quality over quantity—in friendships, in commitments, in the way you spend your time. Invest your energy in the things that are truly meaningful to you and that fulfill you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"e21515f0-1028-4e44-a588-657ed4d65188\"}":{"__typename":"School","uuid":"e21515f0-1028-4e44-a588-657ed4d65188","name":"Lafayette High School","city":"Lafayette","type":"HIGH","state":"Louisiana","country":"United States","zip":"70506"},"Education:{\"uuid\":\"6656d81b-65ef-4fb1-817a-306decd539c5\"}":{"__typename":"Education","uuid":"6656d81b-65ef-4fb1-817a-306decd539c5","school":{"__ref":"School:{\"uuid\":\"e21515f0-1028-4e44-a588-657ed4d65188\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bf37bcb7-7730-47fe-86b8-7d1d02409d31\"}":{"__typename":"School","uuid":"bf37bcb7-7730-47fe-86b8-7d1d02409d31","name":"Louisiana State University","city":"Baton Rouge","type":"COLLEGE","state":"Louisiana","country":"United States","zip":"70802"},"Education:{\"uuid\":\"86aee497-69da-4b4b-b7c2-2ca2003509ba\"}":{"__typename":"Education","uuid":"86aee497-69da-4b4b-b7c2-2ca2003509ba","school":{"__ref":"School:{\"uuid\":\"bf37bcb7-7730-47fe-86b8-7d1d02409d31\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"c11001f8-4320-40d9-9b48-f9ee695f467b\"}":{"__typename":"MentorPublicProfile","uuid":"c11001f8-4320-40d9-9b48-f9ee695f467b","displayName":"Sanaa A.","slug":"sanaa-alam","biography":"\u003cp\u003eHi! I’m Sanaa Alam, and I’m passionate about helping students become confident, curious learners who think deeply about the world and their place in it. I'm originally from Lafayette, LA. I recently completed my Master’s in Epidemiology and Clinical Research at Stanford University as a Knight-Hennessy Scholar. Before that, I earned my Bachelor of Science in Biological Sciences with minors in Political Science and Spanish from Louisiana State University in 2022.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy academic journey bridges the sciences and the humanities. I spent several years conducting cellular biology research, and later shifted to public health research focused on environmental justice—specifically the effects of industrial air pollution on disadvantaged communities in Louisiana. Along the way, I grew committed to education. I’ve taught and mentored students in a range of settings, and I care about creating inclusive and energizing spaces for learning.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, I started a literacy program at an under-resourced elementary school and volunteered as a reading buddy for three years. I also taught English at a nonprofit in Pakistan, where my family is from, and saw how access to education can change a young person’s future. While working as an English Teaching Assistant on a Fulbright in Spain for a year, I taught pre-K through third graders and led English conversation classes for middle schoolers, many of whom came from low-income, immigrant families. These experiences have solidified my belief that education is one of the most powerful tools for empowerment.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn grad school, I found joy in passion projects outside the classroom. I created a podcast with friends in my international scholarship program on identity and advocacy, hosted Deep Dive fire-side chats where scholars got to tell their stories, and organized cultural gatherings around my own traditions, like Ramadan and Eid. These experiences reminded me that learning and leadership can take many forms—and that community truly matters just as much as academics.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m now applying to law school to pursue my interests at the intersection of public health, human rights, and social justice. I’m deeply passionate about supporting immigrants and refugees, addressing environmental injustice, and helping to build more equitable and humane systems within this country.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI bring a multidisciplinary background in the life sciences, public health, education, and advocacy. I love supporting students with academic goals—like biology, languages, and writing—and bigger questions: What drives you? What problems do you want to solve? How can your learning reflect your values?\u003c/p\u003e\u003cp\u003e\u003cbr\u003eWhether you’re seeking academic support or broader mentorship, I would be honored to be part of your journey—and to cheer you on every step of the way!\u003c/p\u003e","teachingVideoPlaybackId":"sJkkT02ZsX2vKPFWIsFTlBbMLwA2zZJyvnQuV8KlBH7I","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I’m especially proud of is being selected as a Knight-Hennessy Scholar at Stanford University. As the daughter of Pakistani immigrants from Louisiana, the opportunity meant a lot to me both personally and professionally. Through the program, I completed graduate research focused on environmental justice and cancer disparities in Louisiana’s “Cancer Alley,” while also growing as a leader and community builder. More than any award itself, I’m proud of how the experience helped me gain confidence in my voice, connect with people from very different backgrounds, and pursue a path centered on public service and advocacy.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"938ac9b6-9e62-4a5b-9512-5c91bfa41125\"}"},{"__ref":"Favorites:{\"uuid\":\"828244bf-cf80-4185-aac3-d08aca4cb197\"}"},{"__ref":"Favorites:{\"uuid\":\"f4fe35c0-01a1-4f8f-aa59-90742d41a4d3\"}"},{"__ref":"Favorites:{\"uuid\":\"4490ae0b-19d3-4978-b615-7ad7a06c8ce5\"}"}],"causesSupported":[],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"38a380fa-4099-4b80-83fc-c3ba27def4de\"}"},{"__ref":"DeepDives:{\"uuid\":\"0fdd6acd-a57f-4a00-893d-efbff8a65265\"}"},{"__ref":"DeepDives:{\"uuid\":\"4e74f55b-9b51-411f-9c44-3c75174b0cc8\"}"},{"__ref":"DeepDives:{\"uuid\":\"39b14845-fd87-4084-9edc-e3093f4b7f84\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a840e7c6-dc1f-4948-96e1-1305a0e58a2b/-/preview/-/format/jpg/","https://ucarecdn.com/9d151e9e-6827-4602-9c5a-89ab28c2d0c5/-/preview/-/format/jpg/","https://ucarecdn.com/2cd6960a-5b92-40c7-8c93-8a9d9fe6a879/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6656d81b-65ef-4fb1-817a-306decd539c5\"}"},{"__ref":"Education:{\"uuid\":\"86aee497-69da-4b4b-b7c2-2ca2003509ba\"}"}],"hiredAt":"2025-07-17T18:38:29.572Z","topics":["K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","College Essay Writing","Executive Function","Reading","Creative Writing","History Project","K-6 Storybook","Video / Photography","Visual Arts / Graphic Design","Medicine / Health","STEM Project","Web Design","Debate","Journalism","Law / Government / Policy","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sanaa-alam\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c11001f8-4320-40d9-9b48-f9ee695f467b\"}"}}},"_sentryTraceData":"62049dddf8f44d2da0609e48f9455f77-961b35dbd854cbf7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=62049dddf8f44d2da0609e48f9455f77,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sanaa-alam"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
