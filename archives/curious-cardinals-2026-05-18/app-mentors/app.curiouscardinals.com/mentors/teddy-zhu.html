xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"063673ea-41f3-475b-b5c3-6044ba1cfeff\"}":{"__typename":"Favorites","uuid":"063673ea-41f3-475b-b5c3-6044ba1cfeff","photoUrl":"https://ucarecdn.com/ef27bce3-1ba9-4e9c-8e0b-68c0bdda2786/","title":"Denver Nuggets","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"a50830ac-ab83-4a55-b79f-e412943714b2\"}":{"__typename":"Favorites","uuid":"a50830ac-ab83-4a55-b79f-e412943714b2","photoUrl":"https://ucarecdn.com/05b3f3ac-037d-4264-a030-cc123393c8c1/","title":"Zombie-The Cranberries","type":"SONG"},"Favorites:{\"uuid\":\"d1e97aeb-b765-45ba-8e44-a2e8c740368d\"}":{"__typename":"Favorites","uuid":"d1e97aeb-b765-45ba-8e44-a2e8c740368d","photoUrl":"https://ucarecdn.com/f7be8a22-bbdf-4b83-a391-01e7f97c6b4e/","title":"Paris","type":"CITY"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"f0a359b4-9a2a-4135-b0eb-e223181650c6\"}":{"__typename":"DeepDives","uuid":"f0a359b4-9a2a-4135-b0eb-e223181650c6","content":"\u003cp\u003eFreshman Summer: I did 2 online summer programs, one called Design the Future, where I worked on creating apps to help those with disabilities. The other was Veritas AI, where I learned all about AI and machine learning.\u003c/p\u003e\u003cp\u003eSophomore Summer: I worked at Crumbl Cookies for the entire summer.\u003c/p\u003e\u003cp\u003eJunior Summer: I participated in YYGS, a 2 week summer program at Yale on the Literature, Philosophy, and Culture academic track. I also was a remote intern at a local university, Colorado State University, focusing on AI machine learning and remote sensing.\u003c/p\u003e\u003cp\u003eSenior Summer: I went on a 2 month long trip to China, visiting family and touring all around different cities like Beijing Nanjing, Shanghai. I worked at Jersey Mikes for the rest of the summer. I also spent a lot of time with friends before we all left for college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"790cc4ff-89b4-43ed-af78-b4594c9be92b\"}":{"__typename":"DeepDives","uuid":"790cc4ff-89b4-43ed-af78-b4594c9be92b","content":"\u003cp\u003eMy greatest role model is Cristiano Ronaldo who, in my opinion, is the world's greatest soccer player ever. His mentality and work ethic were second to none and was incredibly inspiring for me. He helped me realize how much willpower and self belief play a role in one's success. Having confidence is such an important tool in any aspect of life and will make you much happier in life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"322b5588-735f-4c45-8b55-28c9641b4d45\"}":{"__typename":"DeepDives","uuid":"322b5588-735f-4c45-8b55-28c9641b4d45","content":"\u003cp\u003eI love to play soccer, spend time with friends, listen to music + sing along, explore nature on hikes or walks, and unfortunately of course rotting on my phone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"978a29dc-0b1e-463f-90e0-c3f479f7c3c0\"}":{"__typename":"DeepDives","uuid":"978a29dc-0b1e-463f-90e0-c3f479f7c3c0","content":"\u003cp\u003eI'd love to be a content creator/internet personality. What I like most about this \"job\" is that the success entirely depends on who I am and what I do. Everything is in my control and I'm the sole decider of what happens. I really like having that individuality and also getting to introduce myself to everyone in the world. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"245beacc-ee3a-493d-b877-1d01e540d195\"}":{"__typename":"School","uuid":"245beacc-ee3a-493d-b877-1d01e540d195","name":"Cherry Creek High School","city":"Greenwood Village","type":"HIGH","state":"Colorado","country":"United States","zip":"80111"},"Education:{\"uuid\":\"8526c1db-3d55-4628-8a70-90a2c221ef3a\"}":{"__typename":"Education","uuid":"8526c1db-3d55-4628-8a70-90a2c221ef3a","school":{"__ref":"School:{\"uuid\":\"245beacc-ee3a-493d-b877-1d01e540d195\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"b345cdfa-8a59-42fb-a99d-c6e565c114ee\"}":{"__typename":"Education","uuid":"b345cdfa-8a59-42fb-a99d-c6e565c114ee","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Finance","degree":null},"MentorPublicProfile:{\"uuid\":\"997eb7f5-ae06-474d-b68b-fd610a7197b1\"}":{"__typename":"MentorPublicProfile","uuid":"997eb7f5-ae06-474d-b68b-fd610a7197b1","displayName":"Teddy Z.","slug":"teddy-zhu","biography":"\u003cp\u003eHi! I’m Teddy, a college freshman in Philadelphia, and I’m excited to support students as they build confidence and real skills—not just finish homework.\u003c/p\u003e\u003cp\u003eAcademically, I’ve always been drawn to problem-solving and big-picture thinking: I love when a challenging concept finally “clicks,” and I especially enjoy helping other people get to that moment too. In high school, I took a lot of advanced coursework and rarely studied alone. I would always study with my friends as I believe differing perspectives can really help someone learn better and know themselves better. Now in college, I’m exploring interests that combine analytical thinking with real-world impact.\u003c/p\u003e\u003cp\u003eOutside the classroom, I’ve taken on leadership roles that shaped the way I teach. I’ve led tutoring and mentoring initiatives, and I’ve worked closely with students and peers in settings where encouragement, clarity, and patience really matter. I’ve also been involved in service and inclusion-focused organizations, including Special Olympics, where I learned how important it is to meet people where they are and make them feel genuinely supported.\u003c/p\u003e\u003cp\u003eMy tutoring style is structured, calm, and goal-oriented. I like to start by figuring out how a student thinks—what’s confusing, what’s already strong, and what patterns are showing up in their mistakes. From there, I like to offer different ways of thinking and going about problems to diversify how a student can learn. I’m a big believer that confidence comes from small wins, so I try to make sessions feel manageable and motivating. We’ll focus on understanding the “why,” building a repeatable method that works for you, and practicing in a way that prepares students for tests.\u003c/p\u003e\u003cp\u003eStudents often tell me that I make hard topics feel less overwhelming and more approachable. I try to keep sessions interactive and student-driven: I’ll ask questions, guide your reasoning, and help you create a process you can use even when I’m not there. I’m also happy to help with organization and study habits, because academic success is just as much about consistency and strategy as it is about intelligence. My goal is for every student I work with to leave sessions feeling clearer, more confident, and proud of their progress.\u003c/p\u003e","teachingVideoPlaybackId":"LB6tJ01dsO3cWgFc027sRVlP6wC6ia02W6KRFmG21oAn4k","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI was named as a 2025 U.S. Presidential Scholar!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"063673ea-41f3-475b-b5c3-6044ba1cfeff\"}"},{"__ref":"Favorites:{\"uuid\":\"a50830ac-ab83-4a55-b79f-e412943714b2\"}"},{"__ref":"Favorites:{\"uuid\":\"d1e97aeb-b765-45ba-8e44-a2e8c740368d\"}"}],"causesSupported":[],"major":"Finance","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f0a359b4-9a2a-4135-b0eb-e223181650c6\"}"},{"__ref":"DeepDives:{\"uuid\":\"790cc4ff-89b4-43ed-af78-b4594c9be92b\"}"},{"__ref":"DeepDives:{\"uuid\":\"322b5588-735f-4c45-8b55-28c9641b4d45\"}"},{"__ref":"DeepDives:{\"uuid\":\"978a29dc-0b1e-463f-90e0-c3f479f7c3c0\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a7a28811-016f-4e96-8c45-61dca1a1e4a2/-/preview/-/format/jpg/","https://ucarecdn.com/e7fde7e5-ee3c-4901-b61e-58761651c46c/-/preview/-/format/jpg/","https://ucarecdn.com/116e9627-3d10-4e5a-97ca-1278248a3bf1/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"8526c1db-3d55-4628-8a70-90a2c221ef3a\"}"},{"__ref":"Education:{\"uuid\":\"b345cdfa-8a59-42fb-a99d-c6e565c114ee\"}"}],"hiredAt":"2026-01-13T03:56:11.875Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Geometry","Statistics","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","Mandarin Chinese","Academic Coaching","College Essay Writing","Executive Function","Eco
