xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1d769d72-bbab-4737-8390-b874603567c3\"}":{"__typename":"Favorites","uuid":"1d769d72-bbab-4737-8390-b874603567c3","photoUrl":"https://ucarecdn.com/7d7d7720-e857-4231-91f7-59178785fcbd/","title":"Tom Daley","type":"ATHLETE"},"Favorites:{\"uuid\":\"ff4082eb-82fd-44b0-82a9-7edfa4906dfe\"}":{"__typename":"Favorites","uuid":"ff4082eb-82fd-44b0-82a9-7edfa4906dfe","photoUrl":"https://ucarecdn.com/2828fb73-ce84-4854-802f-77b774b2fa83/","title":"Berlin","type":"CITY"},"Favorites:{\"uuid\":\"49538dd5-1a96-468d-b705-e8adae480793\"}":{"__typename":"Favorites","uuid":"49538dd5-1a96-468d-b705-e8adae480793","photoUrl":"https://ucarecdn.com/63126588-00c8-438d-afe5-9cb6a4af9018/","title":"East of Eden by John Steinbeck","type":"BOOK"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9f8979bf-3d27-44d7-8c33-7fc7b6f39574\"}":{"__typename":"DeepDives","uuid":"9f8979bf-3d27-44d7-8c33-7fc7b6f39574","content":"\u003cp\u003eGrowing up surrounded by nature inspired a innate desire to learn as much as I could about the world around me. This fascination with the natural world led me to all branches of art and science. From creating suminagashi prints to collecting tardigrades in my backyard, I couldn't seem to satiate my desire to learn. I was initially interested microbiology; however, after reading a Brief History of Time by Stephen Hawking I became hooked on physics. It was, however, my 11th grade calculus teacher who cemented both my love of math as well as my choice to pursue physics as major. Looking forward I'm so excited to see where the major will take me and all of the people and ideas I'll get to encounter along the way! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"56f042a8-e089-414f-a28e-6041d0f08e3f\"}":{"__typename":"DeepDives","uuid":"56f042a8-e089-414f-a28e-6041d0f08e3f","content":"\u003cp\u003eMy grandparents first moved to California in the early 70’s. Upon arriving in the golden state, they decided to build their own house–foundation, framing, electricity…everything. What inspired me most about this project was how my grandparents were able to learn everything along the way. Don’t know how to insulate a wall or install plumbing? Learn it!\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt feels right that I, following in their footsteps, build my own house one day, reveling in the joy of learning and working with my hands to create something beautiful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f025171a-d6ce-4cad-a932-40a5b467e398\"}":{"__typename":"DeepDives","uuid":"f025171a-d6ce-4cad-a932-40a5b467e398","content":"\u003cp\u003eIn high school, it was easy to feel directionless. My many passions and interests often seemed scattered, unfinished, and disconnected. In moments like these, what I needed most was someone in my corner–not to tell me what to do, but to believe in me and help me see what was already within me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo me, mentorship is less so a form of guidance but rather a form of cultivation. A mentor is not someone who dictates where to go or what to become, but someone who supports and nourishes the mentee as they are in the moment. Mentorship matters because it helps one realize their potential to become curious, confident, and self-accepting humans. Ultimately, mentorship is not a means to an end, but a means to a beginning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"16f143b1-49fb-428e-9e87-6512ee088efb\"}":{"__typename":"DeepDives","uuid":"16f143b1-49fb-428e-9e87-6512ee088efb","content":"\u003cp\u003eI am currently learning web design and have taken on a project to create a study management website that uses past user data to optimize learning and study habits. This project was inspired by my frustration with existing study apps, which often feel static and inflexible. I wanted, therefore, to design a platform that isn’t one-size-fits-all, but instead adapts to each user–essentially allowing the app to be shaped around the individual and, in a sense, created by them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"66bd4742-3100-4a73-a2f4-5818c3149378\"}":{"__typename":"School","uuid":"66bd4742-3100-4a73-a2f4-5818c3149378","name":"North Monterey County High School","city":"Castroville","type":"HIGH","state":"California","country":"United States","zip":"95012"},"Education:{\"uuid\":\"684f99b6-edef-41bd-9a2a-887f3b311d08\"}":{"__typename":"Education","uuid":"684f99b6-edef-41bd-9a2a-887f3b311d08","school":{"__ref":"School:{\"uuid\":\"66bd4742-3100-4a73-a2f4-5818c3149378\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"28e5dc83-2423-4d05-b645-50689e59a0ec\"}":{"__typename":"Education","uuid":"28e5dc83-2423-4d05-b645-50689e59a0ec","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"24abc3a4-bcb4-4067-b253-9afcbf30de79\"}":{"__typename":"MentorPublicProfile","uuid":"24abc3a4-bcb4-4067-b253-9afcbf30de79","displayName":"Kane T.","slug":"kane-trundle","biography":"\u003cp\u003eGreetings!\u003c/p\u003e\u003cp\u003eMy name is Kane Trundle, and I am a sophomore at Yale University studying physics with a possible minor in computer science and or data science.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHailing from the rolling and vibrant hills of the Salinas Valley, I grew up with a deep connection to the natural world, finding joy in all kinds of outdoor activities, as well as indulging my not-so-secret obsession with John Steinbeck :). Most importantly, my experiences in nature–whether hiking in the Gabilan Mountains or exploring tide pools along the Monterey Bay–instilled in me a profound appreciation for discovery, science, conservation, and creativity.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I pursued these passions through a range of endeavors: conducting and publishing astrogeological research with an MIT researcher, painting award-winning works exhibited in the Carmel Art Association, and writing science fiction novels and short stories, to name just a few.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I entered university, I worried I might have to set aside some of my interests in order to succeed. Instead, I realized that my “polymathness” was a tool I could embrace to excel in all subjects and extracurriculars. While I ended up majoring in physics to satisfy my love of math, problem solving, and science, I’ve also continued nurturing my other passions: my creative side through the Cortex Collective, an experimental science and art magazine where I serve as lead fiction editor; my engineering interests through the Yale Undergraduate Aerospace Association, where I design and test aerospace circuitry; and my commitment to conservation through research at the Yale Energy Sciences Institute, where I work on improving cutting-edge solar technology to advance clean energy solutions.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEven when I’m not in the library, classroom, lab, or café, I try to fill my time with creativity and connection. I can often be found knitting or crocheting or tinkering with web design. I can also be found reading cool new science fiction or articles (I have lots of recommendations!), and writing some myself. I also love spending time with friends, whether it’s through a quick catch-up over coffee or late-night walks around campus.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe most important lesson I’ve learned so far is that passion is the most valuable thing that a person can cultivate. From it springs strength, motivation, connection, success and, most importantly, joy.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI hope to bring such revelations to whomever I match with, and I look forward to what we can create and learn together.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTL;DR: \u003cem\u003e“Nothing great in the world was accomplished without passion.”\u003c/em\u003e — Georg Hegel\u003c/p\u003e","teachingVideoPlaybackId":"4JmsIi02iBfF801006IsOjYcwrzHp4xTkg642mWTg00iIHI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1d769d72-bbab-4737-8390-b874603567c3\"}"},{"__ref":"Favorites:{\"uuid\":\"ff4082eb-82fd-44b0-82a9-7edfa4906dfe\"}"},{"__ref":"Favorites:{\"uuid\":\"49538dd5-1a96-468d-b705-e8adae480793\"}"}],"causesSupported":[],"major":"Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9f8979bf-3d27-44d7-8c33-7fc7b6f39574\"}"},{"__ref":"DeepDives:{\"uuid\":\"56f042a8-e089-414f-a28e-6041d0f08e3f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f025171a-d6ce-4cad-a932-40a5b467e398\"}"},{"__ref":"DeepDives:{\"uuid\":\"16f143b1-49fb-428e-9e87-6512ee088efb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/01d46111-8cd4-44f7-a2c1-ac4a8e8dd3a1/-/preview/-/format/jpg/","https://ucarecdn.com/95808076-829c-478d-b850-db162fb36daf/-/preview/-/format/jpg/","https://ucarecdn.com/c36e3c7e-ed50-44c4-bd2f-69b1be545a21/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"684f99b6-edef-41bd-9a2a-887f3b311d08\"}"},{"__ref":"Education:{\"uuid\":\"28e5dc83-2423-4d05-b645-50689e59a0ec\"}"}],"hiredAt":"2025-09-13T02:38:32.852Z","topics":["Algebra I","Algebra II","Calculus","Precalculus / Trigonometry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","History","Creative Writing","Coding / Programming","STEM Project","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kane-trundle\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"24abc3a4-bcb4-4067-b253-9afcbf30de79\"}"}}},"_sentryTraceData":"0293c895ba204d02a11ee6b51b46439c-a4a3b57acdf6ccb5-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=0293c895ba204d02a11ee6b51b4643
