xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"431c0bc0-29d1-460a-a587-e4bf689b7d7d\"}":{"__typename":"DeepDives","uuid":"431c0bc0-29d1-460a-a587-e4bf689b7d7d","content":"\u003cp\u003eDon't procrastinate - always be on top of your work!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1e13daac-e9e1-4b83-8ac3-87f1ea1507d3\"}":{"__typename":"DeepDives","uuid":"1e13daac-e9e1-4b83-8ac3-87f1ea1507d3","content":"\u003cp\u003eEverything is constantly changing when it comes to school, work and our career journeys, and guidance is so vital to really navigating this confusing landscape. I want to be a mentor whose able to inspire students to pursue their passions and grow successfully!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"69d9087d-60ec-4465-b096-b98ce3ffb270\"}":{"__typename":"DeepDives","uuid":"69d9087d-60ec-4465-b096-b98ce3ffb270","content":"\u003cp\u003eI want to restructure our healthcare industry! There's so many flaws with the way healthcare works, especially for those unable to afford the super expensive bills that come with the tiniest of things, and I want to change the base of our nation's healthcare system and build a framework that pushes for accessibility for all.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"e80ecf69-c1f8-4f3d-bd69-9de768b2d68d\"}":{"__typename":"DeepDives","uuid":"e80ecf69-c1f8-4f3d-bd69-9de768b2d68d","content":"\u003cp\u003eI spent my summers all over the place! From going on vacation with family to conducting cancer research at Johns Hopkins, or working on building my own non-profit organization to being an operations intern at a pharmaceutical startup, I made sure my experiences during high school were varied but useful in truly understanding the passions I wanted to pursue!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"03c80328-723c-41fb-aff2-c2e46dbf2b96\"}":{"__typename":"School","uuid":"03c80328-723c-41fb-aff2-c2e46dbf2b96","name":"Independence High School","city":"Frisco","type":"HIGH","state":"Texas","country":"United States","zip":"75035"},"Education:{\"uuid\":\"f19f206b-f32f-4ac3-bff3-56483450e47b\"}":{"__typename":"Education","uuid":"f19f206b-f32f-4ac3-bff3-56483450e47b","school":{"__ref":"School:{\"uuid\":\"03c80328-723c-41fb-aff2-c2e46dbf2b96\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bc77f602-b393-4fa6-9e11-df16e522c65d\"}":{"__typename":"School","uuid":"bc77f602-b393-4fa6-9e11-df16e522c65d","name":"The University of Texas at Austin","city":"Austin","type":"COLLEGE","state":"Texas","country":"United States","zip":"78712"},"Education:{\"uuid\":\"c81abc4b-7a38-4d3c-a8c4-0eafc37b126f\"}":{"__typename":"Education","uuid":"c81abc4b-7a38-4d3c-a8c4-0eafc37b126f","school":{"__ref":"School:{\"uuid\":\"bc77f602-b393-4fa6-9e11-df16e522c65d\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biology \u0026 Plan II Honors","degree":null},"MentorPublicProfile:{\"uuid\":\"46456e89-678a-4aa5-af38-f1cc3c364fe8\"}":{"__typename":"MentorPublicProfile","uuid":"46456e89-678a-4aa5-af38-f1cc3c364fe8","displayName":"Aryan K.","slug":"aryan-k","biography":"\u003cp\u003eHi! I'm Aryan, a sophomore at the University of Texas at Austin majoring in Biology \u0026amp; The Plan II Honors Program, minoring in Business, and I'm passionate about the life sciences and the healthcare industry, and how we can make healthcare more affordable and accessible for all!\u003cbr\u003e\u003cbr\u003eI'm currently pursuing the pre-med track, but am also super interested in the business aspect of healthcare, and am looking into roles in business development and management consulting as well. Outside of school, I spend a lot of time reading, hiking, and trying to cook new foods.\u003cbr\u003e\u003cbr\u003eI'm involved in a ton of unique and super cool extracurriculars. I've done policy work for the Harvard STRIPED Initiative since high school, where we fight to prevent eating disorders amongst youth, a topic I'm really passionate about. I also am a member of the Global Shapers community under the World Economic Forum, where I've been building projects in Austin such as Social Entrepreneurship Workshops and Fundraising Campaigns to eliminate medical debt, to really make an impact in our community!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"O3tT422ZWuGyBftqGzFVgX00evlPjelTzXhJcsgpi9Ss","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biology \u0026 Plan II Honors","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"431c0bc0-29d1-
