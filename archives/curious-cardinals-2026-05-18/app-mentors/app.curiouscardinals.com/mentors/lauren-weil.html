xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"56024a8d-52d3-434e-8a39-a8b1d62720b5\"}":{"__typename":"Favorites","uuid":"56024a8d-52d3-434e-8a39-a8b1d62720b5","photoUrl":"https://ucarecdn.com/1c8575e1-316a-43c6-a1ba-8a30c6c4b53f/","title":"Imaginal Disk","type":"ALBUM"},"Favorites:{\"uuid\":\"fd34e101-0201-4b8d-babc-4c342ec7d07a\"}":{"__typename":"Favorites","uuid":"fd34e101-0201-4b8d-babc-4c342ec7d07a","photoUrl":"https://ucarecdn.com/0e0e0ab7-6ae5-4555-88d8-218c266ec8ae/","title":"The Seven Husbands of Evelyn Hugo","type":"BOOK"},"Favorites:{\"uuid\":\"55322aa4-c8fa-4749-b2d0-e2d4d798ba9f\"}":{"__typename":"Favorites","uuid":"55322aa4-c8fa-4749-b2d0-e2d4d798ba9f","photoUrl":"https://ucarecdn.com/eb7afbd3-8928-40ae-b5b0-68a01a772f6f/","title":"Catan","type":"GAME"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"c09fea7d-8d77-48b7-85de-3f982bbdbaf1\"}":{"__typename":"DeepDives","uuid":"c09fea7d-8d77-48b7-85de-3f982bbdbaf1","content":"\u003cp\u003eMy greatest source of motivation is my family. A large reason as to why I want to pursue a career in medicine is to eventually be able to provide for my parents and my family the same way that they have provided for and supported me. Family is super important to me, and knowing that they're in my corner motivates me to perform my best throughout my education and life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5c02ac24-5353-433b-984d-dc2c46085e50\"}":{"__typename":"DeepDives","uuid":"5c02ac24-5353-433b-984d-dc2c46085e50","content":"\u003cp\u003eI would tell myself to appreciate what I have. Throughout life, it's really easy to focus on what you want to achieve and what you need to do to get there, but I think it's most important to live in the moment and enjoy how far you've come. So my advice to myself would be not to take everything so seriously and to enjoy each day at home with my family and friends.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a6deab3c-370d-4cca-a3d1-f1c0869b92bc\"}":{"__typename":"DeepDives","uuid":"a6deab3c-370d-4cca-a3d1-f1c0869b92bc","content":"\u003cp\u003eI chose my major because I believe that a degree in chemical engineering can lead me to any path that I desire. Currently, my plan is to eventually go into medical school, but I know with chemical engineering I could do biotechnology, law, pharmaceuticals, business, etc. It's such a broad major that sets anyone up well for success in any field!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"0b4706cb-3dec-45a1-95f3-e6209c95e48e\"}":{"__typename":"DeepDives","uuid":"0b4706cb-3dec-45a1-95f3-e6209c95e48e","content":"\u003cp\u003eSomething about myself that isn't obvious right away is that I'm very good at Chinese Poker and cards in general! Although this is more of a silly fact about myself, cards are a huge part of my life, and I believe they teach a lot of really important life lessons. I'm always happy to play a good card game and love how it connects people of all ages and backgrounds!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"a7a938e2-09db-444b-a374-899ad2312526\"}":{"__typename":"School","uuid":"a7a938e2-09db-444b-a374-899ad2312526","name":"Revere High School","city":"Richfield","type":"HIGH","state":"Ohio","country":"United States","zip":"44286"},"Education:{\"uuid\":\"e8ab7999-beff-4571-8e70-16557568c7f7\"}":{"__typename":"Education","uuid":"e8ab7999-beff-4571-8e70-16557568c7f7","school":{"__ref":"School:{\"uuid\":\"a7a938e2-09db-444b-a374-899ad2312526\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"3a722e3d-d250-4749-b476-6927e0834f81\"}":{"__typename":"Education","uuid":"3a722e3d-d250-4749-b476-6927e0834f81","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Chemical Engineering and Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"d2e6184b-2812-400d-9fe1-0d409eb08b23\"}":{"__typename":"MentorPublicProfile","uuid":"d2e6184b-2812-400d-9fe1-0d409eb08b23","displayName":"Lauren W.","slug":"lauren-weil","biography":"\u003cp\u003eHi! My name is Lauren, and I'm an undergraduate student at Northwestern University studying chemical engineering and biology on the pre-medical track! I'm also studying global health and enjoy taking classes in art history. I'm hoping to pursue medicine one day and am particularly interested in the fields of radiology or oncology! I'm originally from Richfield, Ohio, which is a suburb of Akron and Cleveland, but am currently living in Evanston, IL. I'll be in Evanston over the summer and am looking forward to going into Chicago more often!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my academics, I'm involved in a contemporary dance group and a tap dance group, and I'm very passionate about the performing arts. In high school, I was involved in choir and my theatre program, and I got the privilege to choreograph my high school's musical my senior year. I enjoy all things singing and dancing, and I love going to see musicals with my family whenever I'm home.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Northwestern, I'm also a counselor for Camp Kesem, and I'm a member on the executive board for my sorority. Camp Kesem is an organization that supports children whose parents have been affected by cancer, and camp is one of my favorite opportunities that Northwestern has introduced me to.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond school and my extracurricular activities, I enjoy living a balanced life, which to me includes fun workouts, good food, and engaging shows. My friends introduced me to Core Power, and I’ve been hooked ever since, but I also enjoy hot yoga and going for walks! I love to try new recipes, go out to eat, and cook with friends all while enjoying shows like \u003cem\u003eWhite Lotus\u003c/em\u003e or \u003cem\u003eFriends\u003c/em\u003e. I love trying new things and traveling, so I’m happy to take any and all recommendations you may have!\u003c/p\u003e","teachingVideoPlaybackId":"MqLOEBB3ndNJ8aFw3lllx2Yp2HmLGtkaiqGdvWxhEIk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"56024a8d-52d3-434e-8a39-a8b1d62720b5\"}"},{"__ref":"Favorites:{\"uuid\":\"fd34e101-0201-4b8d-babc-4c342ec7d07a\"}"},{"__re
