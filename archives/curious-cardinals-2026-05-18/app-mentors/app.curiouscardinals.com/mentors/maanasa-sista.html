xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ff1948d6-5bdd-4610-a43d-1c69159bab04\"}":{"__typename":"DeepDives","uuid":"ff1948d6-5bdd-4610-a43d-1c69159bab04","content":"\u003cp\u003eMentorship matters to me because it played a crucial role in how I have come to where I am today. Growing up as a first generation American, I often had to navigate through school and the college process on my own, which was challenging and overwhelming. If it weren’t for my mentors guiding me and showing me the countless opportunities available to pursue my passions, I wouldn’t have had any clue how to shape my own path to where I am now. Their support not only provided me with the knowledge I needed but also the confidence to take risks, explore new possibilities, and believe in myself. Mentorship is more than just academic or career guidance, it’s about having someone who believes in you, helps you navigate challenges, and encourages you to dream bigger.\u003c/p\u003e\u003cp\u003eNow, I want to be that mentor for others. I know firsthand how overwhelming it can feel to figure things out alone, and I want to help others access the same kind of support and encouragement that made such a difference in my life! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"4eb2f12e-db13-43f0-b1d5-9a34176c87a6\"}":{"__typename":"DeepDives","uuid":"4eb2f12e-db13-43f0-b1d5-9a34176c87a6","content":"\u003cp\u003eI chose my major because, even before college, I had a deep passion for biology and the human body. At the same time, I was always a hands-on learner who loved art, design, and building things. Biomedical engineering allowed me to merge these interests by viewing the human body as a complex machine and applying engineering principles to create innovative medical solutions. Through this field, I have had the opportunity to develop devices that address illnesses affecting millions worldwide, combining academia with creativity to make a meaningful impact to people's lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3be4b30f-27f2-41dd-bdd1-ec6e50ce24c8\"}":{"__typename":"DeepDives","uuid":"3be4b30f-27f2-41dd-bdd1-ec6e50ce24c8","content":"\u003cp\u003eIf I could go back and give my high school self one piece of advice, it would be that the path to success is never a straight line and that’s okay. It’s natural to explore different interests, even ones you never imagined pursuing. Growth comes from embracing the unexpected, allowing yourself to stray from the plan, and discovering passions you might not have considered before. Keep an open mind, take every opportunity that comes your way, and trust that each experience, even the unplanned ones, will shape you into the person you’re meant to become.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"f2bbb1f3-8f04-4fec-bcd2-f573c8a7e8f5\"}":{"__typename":"DeepDives","uuid":"f2bbb1f3-8f04-4fec-bcd2-f573c8a7e8f5","content":"\u003cp\u003eGrowing up in a multicultural household, I was exposed to a variety of learning styles, techniques, and customs. At first, navigating these differences was challenging, as I had to constantly adapt between different ways of thinking and learning. However, this experience ultimately became one of my greatest strengths. It taught me how to approach concepts from multiple perspectives and tailor explanations to suit different learning styles. Being cognizant of this, I strive to adapt and connect with students from diverse backgrounds, breaking down complex ideas in a way that resonates with them personally. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"9ecae2fc-0c94-4b7a-8bca-7966d0467c61\"}":{"__typename":"School","uuid":"9ecae2fc-0c94-4b7a-8bca-7966d0467c61","name":"River Hill High School","city":"Columbia","type":"HIGH","state":"Maryland","country":"United States","zip":"21029"},"Education:{\"uuid\":\"e6d3a21f-9235-4abe-9557-ac0606b9d233\"}":{"__typename":"Education","uuid":"e6d3a21f-9235-4abe-9557-ac0606b9d233","school":{"__ref":"School:{\"uuid\":\"9ecae2fc-0c94-4b7a-8bca-7966d0467c61\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"abe4d776-35ac-4030-956e-cb0ef68c416d\"}":{"__typename":"School","uuid":"abe4d776-35ac-4030-956e-cb0ef68c416d","name":"Case Western Reserve University","city":"Cleveland","type":"COLLEGE","state":"Ohio","country":"United States","zip":"44106"},"Education:{\"uuid\":\"f219058b-97c9-4822-ba11-f8b60d1fc6b0\"}":{"__typename":"Education","uuid":"f219058b-97c9-4822-ba11-f8b60d1fc6b0","school":{"__ref":"School:{\"uuid\":\"abe4d776-35ac-4030-956e-cb0ef68c416d\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"b9620e07-b453-4c95-bfbd-e5ca690cb52f\"}":{"__typename":"MentorPublicProfile","uuid":"b9620e07-b453-4c95-bfbd-e5ca690cb52f","displayName":"Maanasa S.","slug":"maanasa-sista","biography":"\u003cp\u003eMy name is Maanasa and I am currently in my gap year working in Washington DC as a medical assistant before applying to medical school! I just recently graduated from Case Western Reserve University this past May with a degree in biomedical engineering, down the materials track!\u003c/p\u003e\u003cp\u003eOutside of working I like to go hiking, rock climbing, playing pickleball, exploring DC and honestly anything to stay active. In college I was involved in a competitive Bollywood fusion dance team and would travel around the country to different competitions. I have always had a passion for the arts and thrive in a team environments. Aside from dance, I worked as a volunteer EMT for our campus Emergency medical services for 3 years to help give back to the local community. \u003c/p\u003e\u003cp\u003eI am passionate about teaching because growing up I have always had amazing mentors both academically and in my personal life. Without them I would not have had the confidence or developed the skill set to achieve my goals and pursue my dreams to becoming a doctor! My journey to where I am was definetly not a straight path and there were times where I didn’t think I could do it but without my mentors I wouldn’t be where I am now and because of that I would love to continue their legacy in helping you out in making your dreams come true! \u003c/p\u003e","teachingVideoPlaybackId":"QR7xRP4dijZBfCDCAbAudsvDQZ2UWKUqqyD1zyxLx4w","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ff1948d6-5bdd-4610-a43d-1c69159bab04\"}"},{"__ref":"Deep
