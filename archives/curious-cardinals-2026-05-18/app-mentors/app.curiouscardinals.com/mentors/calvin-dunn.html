xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9b8c513e-2975-4295-a17f-b0e14f12e9cd\"}":{"__typename":"Favorites","uuid":"9b8c513e-2975-4295-a17f-b0e14f12e9cd","photoUrl":"https://ucarecdn.com/14e5b5f1-9e2f-4ee2-af39-4d3f29c13032/","title":"Tom Brady ","type":"ATHLETE"},"Favorites:{\"uuid\":\"0caa7a7c-a025-4514-9ffe-b805895c3271\"}":{"__typename":"Favorites","uuid":"0caa7a7c-a025-4514-9ffe-b805895c3271","photoUrl":"https://ucarecdn.com/173fbebe-d32b-4ba9-931e-e431373e5424/","title":"Sergeant Pepper's Lonely Hearts Club Band","type":"ALBUM"},"Favorites:{\"uuid\":\"fe3ba340-fd3a-403d-b735-169bac6eec5c\"}":{"__typename":"Favorites","uuid":"fe3ba340-fd3a-403d-b735-169bac6eec5c","photoUrl":"https://ucarecdn.com/ee971b29-8b41-44f7-8389-7b757394da66/","title":"Warhammer 40,000","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2f0ef244-07b7-4dd1-bff8-5ef78a844d21\"}":{"__typename":"DeepDives","uuid":"2f0ef244-07b7-4dd1-bff8-5ef78a844d21","content":"\u003cp\u003eI'd probably say don't be afraid to try things you aren't sure about.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI use to struggle greatly with Mathematics to the point of hatred but, I took it upon myself in my later years to strive to be better. Now I'm getting ready to graduate with a degree in Mathematics/Computer Science and I couldn't have imagined in my wildest dreams I would have gotten this far in Math.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eI wish I had gotten into it sooner and not been so afraid to attempt something that although gave me so much frustration, also turned out to be extremely rewarding.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"58f539c1-1653-472c-8ac1-78701d0021ea\"}":{"__typename":"DeepDives","uuid":"58f539c1-1653-472c-8ac1-78701d0021ea","content":"\u003cp\u003eI have many role models but I would definitely say my Dad, Abraham Lincoln, and Woody Hayes.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eMy Dad because he always has pushed me to go above and beyond what I'm capable of. He has also instilled in me a lot of self confidence when I present myself in not only academics but in my adult life. \u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eAbraham Lincoln because its important to be calm and considerate of others regardless of where they come from. It's also important to present yourself as a figure who can be relied on when people need it most. I'd also say strive.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eWoody Hayes was a former Coach of the Ohio State Buckeyes. He was brash and extremely dedicated to not only his craft but his students. He regularly insured that students that played for him finished their degree so they would have a secure life after football.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"af416c49-eee6-4862-8312-a89e0c71ee94\"}":{"__typename":"DeepDives","uuid":"af416c49-eee6-4862-8312-a89e0c71ee94","content":"\u003cp\u003eNothing in this world gets my blood boiling more than when people say you can't do something. Doubt is the ultimate harbinger of a students success and I can speak of that first hand.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eIt's not about whether or not someone can do something. Rather its about if the teacher/mentor has the time and dedication to give to the student to ensure that they succeed and what they are learning is worthwhile.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eThat is in a large part why I push myself especially in Mathematics. The public education system in the United States more often then not puts students into positions where they leave the public school system with a distaste or hatred for Mathematics. Often times its not the students fault that they couldn't understand or handle the material and thus were shunned by their teachers. Rather the money and resources dedicated to helping them succeed were not present or not available so the students were left to sink or swim. This kind of mentality is what kills interest in Math for a lot of students and that is deplorable since Math is such an intricately beautiful thing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"4614fc0e-62d7-42cd-b45d-212b10124200\"}":{"__typename":"DeepDives","uuid":"4614fc0e-62d7-42cd-b45d-212b10124200","content":"\u003cp\u003eI love to read, write, do math problems, paint Warhammer figures, hike, watch sports and sports analytics.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"44c6339f-2781-46f6-b8be-e52ccc8f7f65\"}":{"__typename":"School","uuid":"44c6339f-2781-46f6-b8be-e52ccc8f7f65","name":"Lake Washington High School","city":"Kirkland","type":"HIGH","state":"Washington","country":"United States","zip":"98033"},"Education:{\"uuid\":\"450cc970-95ca-48c2-a829-f016ec9089eb\"}":{"__typename":"Education","uuid":"450cc970-95ca-48c2-a829-f016ec9089eb","school":{"__ref":"School:{\"uuid\":\"44c6339f-2781-46f6-b8be-e52ccc8f7f65\"}"},"startYear":"2012","endYear":"2015","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c400c57b-fff5-4f0c-b065-e45e40ddcb3a\"}":{"__typename":"School","uuid":"c400c57b-fff5-4f0c-b065-e45e40ddcb3a","name":"Western Washington University","city":"Bellingham","type":"COLLEGE","state":"Washington","country":"United States","zip":"98225"},"Education:{\"uuid\":\"b31c409b-581e-4343-839c-c2a776149963\"}":{"__typename":"Education","uuid":"b31c409b-581e-4343-839c-c2a776149963","school":{"__ref":"School:{\"uuid\":\"c400c57b-fff5-4f0c-b065-e45e40ddcb3a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science","degree":"Bachelor's Of Science"},"MentorPublicProfile:{\"uuid\":\"f12cac71-4164-4d59-93f5-f3f8375ce18a\"}":{"__typename":"MentorPublicProfile","uuid":"f12cac71-4164-4d59-93f5-f3f8375ce18a","displayName":"Calvin D.","slug":"calvin-dunn","biography":"Calvin is pursuing a degree in Mathematics/Computer Science at Western Washington University. He is the Vice President of the ACM club at Western and working on a side project with a Professor in the Computer Science Department along with his studies.\n\nHe is a very caring mentor and wants to make sure that any concept no matter how challenging it may be that all students can have fun learning while mastering it. He is patient, creative, funny, and encouraging.","teachingVideoPlaybackId":"TCRsTg9H2Er5R01WrhZ1m9A4YMwKXMvUoI32UA00QE2ho","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9b8c513e-2975-4295-a17f-b0e14f12e9cd\"}"},{"__ref":"Favorites:{\"uuid\":\"0caa7a7c-a025-4514-9ffe-b805895c3271\"}"},{"__ref":"Favorites:{\
