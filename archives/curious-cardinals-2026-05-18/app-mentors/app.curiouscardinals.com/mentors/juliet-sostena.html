xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"445d9f0f-7d96-4192-af5d-0c3469be2a28\"}":{"__typename":"DeepDives","uuid":"445d9f0f-7d96-4192-af5d-0c3469be2a28","content":"\u003cp\u003eWhen I came to Stanford, I thought I was going to major in Biology. It was the field I had the most experience in, especially through my research in neurodegenerative diseases, so it seemed like a natural fit. However, once I got to Stanford, I was inspired by seeing so many people building things. Whether they were Mechanical Engineering or CS majors, everyone seemed to be taking their ideas and turning them into reality. That creative and hands-on process seemed both fulfilling and exciting, and I started to wonder how I could combine my love for biology with the opportunity to build and create.\u003c/p\u003e\u003cp\u003eThat’s when I discovered Bioengineering. I hadn’t heard about this major before college, but as I learned more, I realized it was the perfect fit. It provides a strong foundation in science through chemistry and biology courses, while also incorporating engineering through physics and math. By the time you reach your junior and senior years, you get to combine all these skills to develop innovative therapeutics, design medical devices, and make an impact at the intersection of design, engineering, healthcare, and medicine.\u003c/p\u003e\u003cp\u003eIt’s been an incredibly interesting and rewarding journey for me, and I’d love to chat if you have any questions about this major or anything else!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"2945d033-64e1-4abe-b018-aa2ed96078ab\"}":{"__typename":"DeepDives","uuid":"2945d033-64e1-4abe-b018-aa2ed96078ab","content":"\u003cp\u003eMy dream job isn’t tied to a specific title—it’s about working at the intersection of science and business in a role where I can bridge the gap between innovative ideas and real-world impact. This could take many forms, such as being a project manager at a biotech company, a healthcare consultant, or even founding a startup in the bioengineering space.\u003c/p\u003e\u003cp\u003eI’m passionate about science and love diving into the technical details of biology, engineering, and cutting-edge research. However, I also recognize the importance of communicating that science effectively and turning it into products that can thrive in the real world. I want to be the person who takes groundbreaking scientific ideas—whether they’re new devices or therapeutics—and ensures they aren’t lost in technical jargon or complexity.\u003c/p\u003e\u003cp\u003eMy goal is to help translate innovative science into tangible solutions that make a real difference in people’s lives, staying true to their initial purpose and potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"41ed0908-b5da-4614-8466-0110365f5eab\"}":{"__typename":"DeepDives","uuid":"41ed0908-b5da-4614-8466-0110365f5eab","content":"\u003cp\u003eI spent my high school summers in a way that might seem a little unconventional for someone very academic. While many of my peers were diving into passion projects, internships, or exploring new fields, I spent my first two summers fully immersed in ballet. Ballet has been a huge part of my life since I was six or seven, and early in high school, I attended summer intensives where I danced up to eight hours a day, honing my technique and fully dedicating myself to the art form.\u003c/p\u003e\u003cp\u003eBy junior year, my passion for science began to grow, and I applied to the Stanford Institute for Medical Research (SIMR). I was accepted and spent an incredible summer conducting neuroscience research at a Stanford lab. This experience not only solidified my interest in research but also taught me the importance of professional communication, responsibility, and collaboration. I had an amazing mentorship experience with a research assistant, which left a lasting impression on me and further fueled my excitement for pursuing science in college.\u003c/p\u003e\u003cp\u003eDuring my senior summer, I decided to take a different approach, spending time with friends after graduation and even taking a trip with my high school classmates. It was a chance to create meaningful memories and reflect on the end of an important chapter in my life.\u003c/p\u003e\u003cp\u003eLooking back, I believe there’s immense value in balancing academic pursuits with personal passions and life experiences. While academic summers have their benefits, pursuing unconventional interests like ballet or taking time for personal growth can also demonstrate dedication, adaptability, and a well-rounded perspective. These experiences have helped shape who I am today, both personally and professionally.\u003c/p\u003e\u003cp\u003e4o\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b15f873c-2a23-4f15-9a00-3c8a2645d045\"}":{"__typename":"DeepDives","uuid":"b15f873c-2a23-4f15-9a00-3c8a2645d045","content":"\u003cp\u003eIn high school, I often struggled to find a field of study that completely resonated with me. I loved art and ballet, which had developed my artistic side throughout my life, but when it came to classes, I often gravitated toward the science lab. I was fascinated by medicine and occasionally imagined becoming a doctor, but when I thought about my impact on healthcare, I dreamed of developing cutting-edge medical devices. I also had a deep passion for the ocean and marine sciences, but I couldn’t quite see how they could fit into my day-to-day activities.\u003c/p\u003e\u003cp\u003eIn college, I realized that the most exciting opportunities often lie at the intersections of fields. If you dig deep enough and stay committed to your passions, there’s always a way to explore without sacrificing any of your interests. Through studying neuroaesthetics—the intersection of art and neuroscience—I’ve had the incredible opportunity to combine my love for the brain with my experiences in the arts. By working on a wearable device startup for Tourette's syndrome, I’ve been able to engage with healthcare while expanding my engineering skills.\u003c/p\u003e\u003cp\u003eThese intersections have become the most rewarding places for me to grow and learn, and I wish I could tell my high school self to stay true to my passions and find ways to make them work, rather than feeling the need to sacrifice any of them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2822ff7c-8097-4087-8436-99dc9c155aad\"}":{"__typename":"School","uuid":"2822ff7c-8097-4087-8436-99dc9c155aad","name":"The Nueva School | San Mateo","city":"San Mateo","type":"HIGH","state":"California","country":"United States","zip":"94403"},"Education:{\"uuid\":\"8fa3b58c-6777-4c91-8050-7c037ee6670e\"}":{"__typename":"Education","uuid":"8fa3b58c-6777-4c91-8050-7c037ee6670e","school":{"__ref":"School:{\"uuid\":\"2822ff7c-8097-4087-8436-99dc9c155aad\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"dcd7d2b0-fbfe-45ed-8158-88a9f8a4b994\"}":{"__typename":"Education","uuid":"dcd7d2b0-fbfe-45ed-8158-88a9f8a4b994","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Bioengineering ","degree":null},"MentorPublicProfile:{\"uuid\":\"4efa1aaf-0def-4f27-97ee-8b91a0054ca0\"}":{"__typename":"MentorPublicProfile","uuid":"4efa1aaf-0def-4f27-97ee-8b91a0054ca0","displayName":"Juliet S.","slug":"juliet-sostena","biography":"\u003cp\u003eHi! My name is Juliet, and I’m a Bioengineering major at Stanford passionate about biotech, innovation, marine biology, and healthcare. You can usually find me in the lab conducting neuroscience research, in the ballet studio rehearsing for the next Cardinal Ballet Company performance, or grabbing a coffee and catching up with friends around campus.\u003c/p\u003e\u003cp\u003eI have experience consulting for and building startups, and I’d love to chat about your newest ideas! Over the years, I’ve spent summers and school years immersed in both wet-lab and computational research, and I enjoy helping students find research opportunities or create personal projects aligned with their goals and passions.\u003c/p\u003e\u003cp\u003eCurrently, in addition to my Bioengineering work, I work at a biotech hedge fund, consult for an early-stage ed-tech company, conduct research at Stanford, and, my favorite, mentor students. On campus, I’m actively involved with Stanford Women in Business (SWIB) and Alpha Phi, and I’m always excited to share my experiences with others.\u003c/p\u003e\u003cp\u003eIn my free time, I love hiking, traveling, painting, and, of course, dancing ballet! I’m passionate about exploring the intersections of fields and believe in a multidisciplinary approach to academics. For example, I’ve worked on a personal psychology project exploring neuroaesthetics, the intersection of neuroscience and art, and I’m currently conducting computational research on squid color-changing mechanisms, which blends my love for the ocean with my interest in computation.\u003c/p\u003e\u003cp\u003eI always enjoy helping students design and pursue projects or research that truly reflect their interests. \u003c/p\u003e","teachingVideoPlaybackId":"G2r02f4JLkgnBTyhTo1lJAW1AKRJlt02JdLycCwYKlaVk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Bioengineering ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"445d9f0f-7d96-4192-af5d-0c3469be2a28\"}"},{"__ref":"DeepDives:{\"uuid\":\"2945d033-64e1-4abe-b018-aa2ed96078ab\"}"},{"__ref":"DeepDives:{\"uuid\":\"41ed0908-b5da-4614-8466-0110365f5eab\"}"},{"__ref":"DeepDives:{\"uuid\":\"b15f873c-2a23-4f15-9a00-3c8a2645d045\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6c502f28-c9ba-4e7f-976f-bb0922036386/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"8fa3b58c-6777-4c91-8050-7c037ee6670e\"}"},{"__ref":"Education:{\"uuid\":\"dcd7d2b0-fbfe-45ed-8158-88a9f8a4b994\"}"}],"hiredAt":"2024-12-11T08:04:51.299Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Statistics","Biology","Chemistry","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Business / Entrepreneurship","Medicine / Health","Robotics / Electroni
