xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b504b7d7-92e5-4928-863d-06f5220be7ad\"}":{"__typename":"Favorites","uuid":"b504b7d7-92e5-4928-863d-06f5220be7ad","photoUrl":"https://ucarecdn.com/3f03137a-0427-4b3f-9bd1-4393cd2e00af/","title":"Water polo","type":"SPORT"},"Favorites:{\"uuid\":\"bca356f4-f62b-4fc1-b0bb-0a46682434eb\"}":{"__typename":"Favorites","uuid":"bca356f4-f62b-4fc1-b0bb-0a46682434eb","photoUrl":"https://ucarecdn.com/3f03137a-0427-4b3f-9bd1-4393cd2e00af/","title":"Bananagrams!","type":"GAME"},"Favorites:{\"uuid\":\"2661ec61-7552-466f-95a2-0a09bec9d1b7\"}":{"__typename":"Favorites","uuid":"2661ec61-7552-466f-95a2-0a09bec9d1b7","photoUrl":"https://ucarecdn.com/3f03137a-0427-4b3f-9bd1-4393cd2e00af/","title":"Miami, FL (my hometown!)","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2b22e02e-0594-444a-b46f-32ae1bea764d\"}":{"__typename":"DeepDives","uuid":"2b22e02e-0594-444a-b46f-32ae1bea764d","content":"\u003cp\u003eMentoring and the chance to connect with kids is a really special opportunity for me.  When I was younger, not a lot of my friends loved math in the way that I did, and I remember being so in awe of my math teacher and how much she cared about and seemed to truly love math. She mentored me and showed me that I could pursue whatever I wanted, no matter who I was or what was going on around me. I have been very lucky to have many special teachers throughout my life whom I will never forget for the impact they have had on me, and I want to spread that to other kids. I know I'm not a teacher, and I won't see my mentees as often, but I want to share my excitement for the subjects I am passionate about, because excitement is contagious. And it is so much easier to learn when you're excited.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"06e3b945-de08-4137-8cc2-96a575f82525\"}":{"__typename":"DeepDives","uuid":"06e3b945-de08-4137-8cc2-96a575f82525","content":"\u003cp\u003eOver the Spring and Summer of 2020, when a lot of things were shut down for the pandemic, one of my friends and I took the opportunity to be creative and try something new. We were inspired by an article online and decided to build a treehouse - despite having zero experience. We did some research, drew up the plans, and filled her mom's car with lumber from Home Depot. Over the next month or so, we spent anywhere from 2 to 8 hours a day ten feet off the ground, drilling, measuring, painting, you name it. Finally, when we completed it, we had a 100 square foot treehouse painted rainbow. It was silly and a little bit stupid, but it was one of the most creative and fun challenges I have ever completed.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}":{"__typename":"School","uuid":"1dc8c564-7629-4af5-851c-69ed64a8870e","name":"Ransom Everglades High School","city":"Miami","type":"HIGH","state":"Florida","country":"United States","zip":"33133"},"Education:{\"uuid\":\"085edaad-dedb-42ee-ad83-12667c4030c6\"}":{"__typename":"Education","uuid":"085edaad-dedb-42ee-ad83-12667c4030c6","school":{"__ref":"School:{\"uuid\":\"1dc8c564-7629-4af5-851c-69ed64a8870e\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"7403b005-9456-4b2c-a981-19304ed1f6de\"}":{"__typename":"Education","uuid":"7403b005-9456-4b2c-a981-19304ed1f6de","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Applied Math - Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"cd6458c2-be90-4cce-8fa1-897cbd2e8166\"}":{"__typename":"MentorPublicProfile","uuid":"cd6458c2-be90-4cce-8fa1-897cbd2e8166","displayName":"Sabrina S.","slug":"sabrina-shipley","biography":"\u003cp\u003eHi everyone! My name is Sabrina. I'm majoring in applied math and computer science at Brown in Providence, RI, which means I love numbers. The college class I have most enjoyed has been multivariable calculus, which I know is a controversial opinion. I think it's so cool to discover the patterns and hidden meanings in data and equations and turn them into something meaningful. My whole life, I have loved math, but I have never really had a clear idea of what I want to do with my life. As of now, I want to do data science or research, but I'm still really open to trying new things and discovering different careers. Aside from academics, I'm on the varsity water polo team, where I've met some of my best friends at Brown. I'm definitely far from being a star, but it's been so rewarding to be on a sports team and have a great built-in community in that way. In my free time, I'm part of a computer science-based service club, where I teach middle schoolers the basics of computer science and programming, along with an entrepreneurship club and the Christian athletes association. I love to explore campus and Providence (when the weather is nice!) and read or write when I have spare time. Especially when I get overwhelmed, I take time to write or be creative; I have always loved poetry and short stories and enjoy giving myself a break to put my thoughts down when I can. In high school, during the pandemic, I kept myself busy with a few passion projects. I built a treehouse (read more about that below!), ran a donation drive for toiletries for a local homeless shelter, and coded a website in Java and HTML where people could search for donations centers for various household items. I will always cherish that time because I got the chance to expand my horizons outside of school and clubs. I really want to help spread the joy that I get out of learning and trying new things. I am so excited to be a mentor and hope to get to meet some really great students!!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b504b7d7-92e5-4928-863d-06f5220be7ad\"}"},{"__ref":"Favorites:{\"uuid\":\"bca356f4-f62b-4fc1-b0bb-0a46682434eb\"}"},{"__ref":"Favorites:{\"uuid\":\"2661ec61-7552-466f-95a2-0a09bec9d1b7\"}"}],"causesSupported":[],"major":"Applied Math - Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2b22e02e-0594-444a-b46f-32ae1bea764d\"}"},{"__ref":"DeepDives:{\"uuid\":\"06e3b945-de08-4137-8cc2-96a575f82525\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b3e22ec9-22c4-40a4-abdf-9494664fe3cb/-/preview/-/format/jpg/","https://ucarecdn.com/35730870-9b3f-457f-9389-107cd84ed58c/-/preview/-/format/jpg/","https://ucarecdn.com/110333eb-90ed-4fb9-9a41-2b94e21c4419/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"085edaad-dedb-42ee-ad83-12667c4030c6\"}"},{"__ref":"Education:{\"uuid\":\"7403b005-9456-4b2c-a981-19304ed1f6de\"}"}],"hiredAt":"2023-09-16T12:33:27.742Z","topics":["Statistics","Precalculus / Trigonometry","Pre-A
