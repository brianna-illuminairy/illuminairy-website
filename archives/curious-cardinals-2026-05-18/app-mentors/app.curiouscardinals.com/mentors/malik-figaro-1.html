f":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"36c6997a-1fb5-40f4-ab48-26d653d95ba5\"}":{"__typename":"DeepDives","uuid":"36c6997a-1fb5-40f4-ab48-26d653d95ba5","content":"\u003cp\u003eHistory is the art of storytelling. Becoming a History major has allowed me to evolve in my writing, make astute observations and analysis, and take advantage of the interdisciplinary nature of the subject at Yale. I carry these skills with me everyday of my life, whether professional or within my own engagements with my community and surrounding world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e2b380d0-cffb-4f09-9a82-818f2fcfa7d4\"}":{"__typename":"DeepDives","uuid":"e2b380d0-cffb-4f09-9a82-818f2fcfa7d4","content":"\u003cp\u003eBecoming a talent agent and helping people achieve their dreams! Or combining my interest in Music/Entertainment and exploring Entertainment Law.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"350edc30-ffdf-4553-9751-b18a84a9139b\"}":{"__typename":"DeepDives","uuid":"350edc30-ffdf-4553-9751-b18a84a9139b","content":"\u003cp\u003eI cold-emailed someone who built her own business after years of doing some really cool jobs in the Entertainment industry. She thankfully responded, asking me to grab coffee in New York, and after our initial conversation, not only did she offer me a job but she also changed my life. I was inspired to stay true to myself and take a leap of faith to pursue this unfamiliar space, and since then I have come so far. I'd hope to do the same thing for all of my mentees-- it is such an incredible feeling to know that someone supports you in every way possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"0e542101-f921-46a5-ad51-cf3e99d18b1f\"}":{"__typename":"School","uuid":"0e542101-f921-46a5-ad51-cf3e99d18b1f","name":"Friends Seminary","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10003"},"Education:{\"uuid\":\"2b5e50db-0f61-4dda-b5aa-ffac37789428\"}":{"__typename":"Education","uuid":"2b5e50db-0f61-4dda-b5aa-ffac37789428","school":{"__ref":"School:{\"uuid\":\"0e542101-f921-46a5-ad51-cf3e99d18b1f\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"108fac00-c08d-4c4f-b6b5-e0248eb7c83a\"}":{"__typename":"Education","uuid":"108fac00-c08d-4c4f-b6b5-e0248eb7c83a","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"History with a specialization in Politics, Law, \u0026 Government","degree":"Bachelors"},"MentorPublicProfile:{\"uuid\":\"8953d67b-f08d-40f2-b4d8-3374afff2b82\"}":{"__typename":"MentorPublicProfile","uuid":"8953d67b-f08d-40f2-b4d8-3374afff2b82","displayName":"Malik F.","slug":"malik-figaro-1","biography":"\u003cp\u003eMalik is a Junior at Yale University studying History with a specializ
