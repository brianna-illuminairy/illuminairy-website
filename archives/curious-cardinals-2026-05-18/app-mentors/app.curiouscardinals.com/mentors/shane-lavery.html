xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"86a9b46d-9f07-4fbe-90a8-1d7be1fa9502\"}":{"__typename":"Favorites","uuid":"86a9b46d-9f07-4fbe-90a8-1d7be1fa9502","photoUrl":"https://ucarecdn.com/d3741b43-d010-456c-90d5-3a7256499bec/","title":"Interstellar","type":"MOVIE"},"CausesSupported:{\"uuid\":\"811b4c88-b479-4504-97dc-4a2086f042a4\"}":{"__typename":"CausesSupported","uuid":"811b4c88-b479-4504-97dc-4a2086f042a4","name":"Children's Miracle Network","description":"\u003cp\u003eI raise money for Rady Children's Hospital through Dance Marathon!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/1ffe152c-8541-4f9f-b463-db08dc42101d/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"886e114b-b037-4498-8eaa-b5c2423b6c6d\"}":{"__typename":"DeepDives","uuid":"886e114b-b037-4498-8eaa-b5c2423b6c6d","content":"\u003cp\u003eGrowing up, even before I knew I was interested in medicine, I told everyone I knew that I wanted to be a marine biologist. While I shifted focus in the realm of biology, I am still incredibly passionate about ecology and medicine. Majoring in biology allowed me to combine both passions and study lots of material that I was interested in. I got to go to the tide pools to study animals for biostatistics one day and then synthesize compounds in my organic chemistry lab the next!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"303a0c2b-db55-450d-88d6-e17283a652d0\"}":{"__typename":"DeepDives","uuid":"303a0c2b-db55-450d-88d6-e17283a652d0","content":"\u003cp\u003eSummers in high school were mostly spent trying to find a way to beat the Sacramento heat while still being outside and having fun. I went hiking, camping, tubing on the American River, swimming in whatever lake, river, or pool I could convince my friends to get into with me. I also worked as a lifeguard from the summer I was old enough to when I left for college, which was really the start of learning about medicine. I had to get CPR, oxygen, and basic first aid certified, and this was when I really started thinking about what I wanted to do long term.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"c44f9d6a-b294-4792-8765-0ed5ff4745e8\"}":{"__typename":"DeepDives","uuid":"c44f9d6a-b294-4792-8765-0ed5ff4745e8","content":"\u003cp\u003eRecently, I had to give a massive presentation in my \"Molecular Basis of Heart Disease\" class, and I did mine on Tetralogy of Fallot, a somewhat rare congenital heart defect that my brother was born with. The presentation consisted of 15 minutes of slides and then 20 minutes of audience questions. I was super nervous because not only did I have to know in depth knowledge about this complex topic, but I had to know the material so well that if someone asked a question that wasn't on my slides, I could answer. I worked on it for a long time and I can now say it was the best presentation I have ever given, and I got an A in the class.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c094e8ec-f1c5-464c-b86a-9f307a58ea57\"}":{"__typename":"DeepDives","uuid":"c094e8ec-f1c5-464c-b86a-9f307a58ea57","content":"\u003cp\u003eI think I would tell myself to try everything I was even slightly interested in. High school (and college) is such a great time to try new things, and if you try something you end up not liking, you don't have to do it forever. You never know unless you try. One of the times this really panned out for me in high school was freshman year when I joined the diving team with no experience on a whim. I met some of my best friends, had experiences I never thought I would have, and even though I didn't continue diving past high school, I am so thankful I tried it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2cc0fe0f-6f5f-4ffc-b2d9-3d0a5c2a85db\"}":{"__typename":"School","uuid":"2cc0fe0f-6f5f-4ffc-b2d9-3d0a5c2a85db","name":"Jesuit High School","city":"Arden-Arcade","type":"HIGH","state":"California","country":"United States","zip":"95608"},"Education:{\"uuid\":\"cc0ae333-a05f-4c50-ac9c-afb4fee6a525\"}":{"__typename":"Education","uuid":"cc0ae333-a05f-4c50-ac9c-afb4fee6a525","school":{"__ref":"School:{\"uuid\":\"2cc0fe0f-6f5f-4ffc-b2d9-3d0a5c2a85db\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"bf559a21-380a-4e5d-a257-8847805b2f5f\"}":{"__typename":"School","uuid":"bf559a21-380a-4e5d-a257-8847805b2f5f","name":"San Diego State University","city":"San Diego","type":"COLLEGE","state":"California","country":"United States","zip":"92182"},"Education:{\"uuid\":\"2cbd432a-a1b5-4060-bf05-6dd237d8fe72\"}":{"__typename":"Education","uuid":"2cbd432a-a1b5-4060-bf05-6dd237d8fe72","school":{"__ref":"School:{\"uuid\":\"bf559a21-380a-4e5d-a257-8847805b2f5f\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"fefed952-90a4-4583-a8cd-11ec16cf9efd\"}":{"__typename":"MentorPublicProfile","uuid":"fefed952-90a4-4583-a8cd-11ec16cf9efd","displayName":"Shane L.","slug":"shane-lavery","biography":"\u003cp\u003eHi! My name is Shane, and I’m a recent graduate of San Diego State University with a degree in General Biology and a minor in Personality and Social Psychology. I’m passionate about the sciences—whether it’s the workings of the human body or the ecosystems that make up our planet. My ultimate goal is to become a pediatrician, and in the meantime, I’m focused on expanding my knowledge, working with students, and making a positive impact through mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout my time at SDSU, I was deeply involved in both academics and student leadership. I served in student government, working to make tutoring services more accessible and improve campus safety. I also sat on the Academic Planning and Policy Committee, where I contributed to shaping the university’s educational direction. Beyond my academic pursuits, I’ve gained hands-on experience in healthcare as a Pathmaker Intern at Palomar Health, assisting patients in various departments, including oncology, outpatient rehabilitation, and healthy developmental services.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eEducation is something I’ve always valued, not just in a classroom setting but through hands-on experiences. As a substitute teacher, I’ve worked with students across different subjects, including biology, chemistry, psychology, and math. I also have  experience mentoring and teaching through my role as a Camp Lead at Mission Bay Aquatic Center, where I delivered lessons on environmental conservation, basic physics principles, and water safety. My approach to mentorship is dynamic and student-centered—I believe learning should be an enjoyable experience.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics and teaching, I love spending time outdoors. Whether it’s hiking, wake surfing, swimming, or camping, I love getting out in nature for a study break or to fins a quiet place to get some work done. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my goal is to inspire curiosity, confidence, and resilience in my students. I want to help them get enjoyment from learning, develop critical thinking skills, and discover things that they might be interested in that will enhance their current studies. If you're looking for a mentor who is both knowledgeable and enthusiastic, I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"OphRtfzpHtu1qol00IIxaw2t9AdHoaDcuCi5TOfbMU9s","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"86a9b46d-9f07-4fbe-90a8-1d7be1fa9502\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"811b4c88-b479-4504-97dc-4a2086f042a4\"}"}],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"886e114b-b037-4498-8eaa-b5c2423b6c6d\"}"},{"__ref":"DeepDives:{\"uuid\":\"303a0c2b-db55-450d-88d6-e17283a652d0\"}"},{"__ref":"DeepDives:{\"uuid\":\"c44f9d6a-b294-4792-8765-0ed5ff4745e8\"}"},{"__ref":"DeepDives:{\"uuid\":\"c094e8ec-f1c5-464c-b86a-9f307a58ea57\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/aa001e98-d1ac-4b5a-b90c-85ec38173382/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cc0ae333-a05f-4c50-ac9c-afb4fee6a525\"}"},{"__ref":"Education:{\"uuid\":\"2cbd432a-a1b5-4060-bf05-6dd237d8fe72\"}"}],"hiredAt":"2025-03-26T14:03:08.185Z","topics":["Algebra I","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Chemistry","Biology","Physics"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query"
