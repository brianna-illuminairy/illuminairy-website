. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"a0c23762-eca0-4452-a274-1afcaf93214a\"}":{"__typename":"DeepDives","uuid":"a0c23762-eca0-4452-a274-1afcaf93214a","content":"\u003cp\u003eMy dream job is to be a Creative Writing professor at an art college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"064dfdd5-318b-461b-a10b-180951d341d4\"}":{"__typename":"DeepDives","uuid":"064dfdd5-318b-461b-a10b-180951d341d4","content":"\u003cp\u003e\u003cstrong\u003eI love movies, museums, reading, and going for walks in Riverside Park.\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}":{"__typename":"School","uuid":"67d96877-4245-4f9b-a557-94f9ecabd290","name":"Barnard College","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"2c5c81de-0e21-4451-b0e4-7e6e3da25f70\"}":{"__typename":"Education","uuid":"2c5c81de-0e21-4451-b0e4-7e6e3da25f70","school":{"__ref":"School:{\"uuid\":\"67d96877-4245-4f9b-a557-94f9ecabd290\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2026","major":"English \u0026 Creative Writing","degree":null},"School:{\"uuid\":\"023b8c9d-d8ed-479c-a769-81f9dc51f8e9\"}":{"__typename":"School","uuid":"023b8c9d-d8ed-479c-a769-81f9dc51f8e9","name":"Episcopal High School","city":"Alexandria","type":"HIGH","state":"Virginia","country":"United States","zip":"22302"},"Education:{\"uuid\":\"d31faed1-c6bc-4669-8b31-44fa80031ee8\"}":{"__typename":"Education","uuid":"d31faed1-c6bc-4669-8b31-44fa80031ee8","school":{"__ref":"School:{\"uuid\":\"023b8c9d-d8ed-479c-a769-81f9dc51f8e9\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"2179a437-ddd9-498b-9ae3-6d9af59b7758\"}":{"__typename":"MentorPublicProfile","uuid":"2179a437-ddd9-498b-9ae3-6d9af59b7758","displayName":"Annabelle B.","slug":"annabelle-baird","biography":"\u003cp\u003eWriting has been the most important part of my life since I knew what words were. My parents had to tell me to put down my book at the dinner table.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am passionate about mentorship because of my experience working with Writopia Labs from ages 8 through 14. Writopia is a nonprofit organization of published authors that runs workshops for kids and teens across the United States. From a young age, my teachers at Writopia taught me that my work was valued and important, no matter my age. They instilled in me the importance of mutual respect, and that the teacher-student dynamic is not one of authority and subservience, but a critical and equal relationship that can last for years.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy unwavering belief in mutual respect led me to a compliment I still value and strive to achieve. When working in Episcopal’s Writing Center, our faculty advisor told me that a younger student had come to her and expressed gratitude that I encouraged him to keep writing, despite the fact that he had a lack of confidence in his work. I continued working with the student for two years and found that his writing significantly improved throughout our time together.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAfter my sophomore year at Pratt Institute where I took coursework towards a BFA in Writing, I transferred to Barnard. I have since studied under Pulitzer Prize winner Jhumpa Lahiri and one of my personal favorite authors, Elif Batuman. At Pratt, I worked for the Writing Center, following my passion for teaching that I developed in high school as Head of our Writing Center. Through my work as a tutor, I gained expertise in grammar, analytical essays, close reading, structure, all things creative writing, and more.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am a lover of physical media; physical books, magazines, and journals are key in creating community within the literary culture. In high school, I was the Editor-in-Chief of our literary publication, \u003cem\u003eThe Daemon. \u003c/em\u003eAt Pratt, I was a contributor to our magazine, \u003cem\u003eUbiquitous\u003c/em\u003e and still write for the newspaper, \u003cem\u003eThe Prattler.\u003c/em\u003e\u0026nbsp;In addition, physical daily journaling is the most important part of my writing process. Putting pen to paper helps me achieve a hand-to-mind connection that allows creativity to flow.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I attend readings in New York City, such as those from authors at Center for Fiction and McNally Jackson, as well as local venues where unpublished authors have the opportunity to share their work and cultivate community. I participated in my own curated reading at Brooklyn's Dear Friend Books in 2024.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my own writing, I have won Scholastic Gold Medals for my work in Poetry, and completed a Senior Thesis for my May 2026 graduation. I will attend Columbia University's MFA in Fiction Writing program beginning September 2026.\u003c/p\u003e","teachingVideoPlaybackId":"01jkfvverg02ZhxUNzUaoFlTbb23ecXx5W1tRIs1UfNNI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b308615f-1cc9-4206-8573-a3c0ea0c990e\"}"},{"__ref":"Favorites:{\"uuid\":\"cf5a586e-169a-4b47-9a44-085bba1be90f\"}"},{"__ref":"Favorites:{\"uuid\":\"6c0bf1b7-6309-4b35-a9e4-62df97cba69e\"}"}],"causesSupported":[],"major":"English \u0026 Creative Writing","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b898489c-65f7-4607-a7c2-c294c41b1584\"}"},{"__ref":"DeepDives:{\"uuid\":\"78653553-b5fa-4960-9b97-ee4f4f0c3f80\"}"},{"__ref":"DeepDives:{\"uuid\":\"a0c23762-eca0-4452-a274-1afcaf93214a\"}"},{"__ref":"DeepDives:{\"uuid\":\"064dfdd5-318b-461b-a10b-180951d341d4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3d0cb4b0-ec21-4872-bf94-5dccf45f4b2c/-/preview/-/format/jpg/","https://ucarecdn.com/22d177af-db5f-4829-8f20-e88ea4948a17/-/preview/-/format/jpg/","https://ucarecdn.com/e43d339a-3f5d-4c5d-92e5-456e3e8819b8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2c5c81de-0e21-4451-b0e4-7e6e3da25f70\"}"},{"__ref":"Education:{\"uuid\":\"d31faed1-c6bc-4669-8b31-44fa80031ee8\"}"}],"hiredAt":"2025-07-16T22:58:29.115Z","topics":[],"communityBadges":["https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"annabelle-baird\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2179a437-ddd9-498b-9ae3-6d9af59b7758\"}"}}},"_sentryTraceData":"3376663ea61c4e998362c5ddb0ccf319-bf1f39b69eeea021-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=3376663ea61c4e998362c5ddb0ccf319,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query
