xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"95529586-2b75-494a-9505-587ab6e47819\"}":{"__typename":"DeepDives","uuid":"95529586-2b75-494a-9505-587ab6e47819","content":"\u003cp\u003eThe mentorship I received from my teachers, coaches, and counselors in high school was the reason I am successful now. If it were not for them, I would not have the top grades, stellar essays, and a Yale diploma. Mentorship builds others and benefits society.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"bb077006-72f2-446e-b73d-a9e60cfdd29a\"}":{"__typename":"DeepDives","uuid":"bb077006-72f2-446e-b73d-a9e60cfdd29a","content":"\u003cp\u003eAct in either on Broadway or in a major film.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"ed3997a3-b53e-4bde-b305-2655eefdfc46\"}":{"__typename":"DeepDives","uuid":"ed3997a3-b53e-4bde-b305-2655eefdfc46","content":"\u003cp\u003eI loved how history was taught at Yale. It was not simply remembering facts like in high school. The professors really made you think about how history was constructed and how evidence can be interpreted, which taught you how to think critically and argue logically.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"7d45c443-2901-4a75-a3ed-a2f7d45a26d7\"}":{"__typename":"DeepDives","uuid":"7d45c443-2901-4a75-a3ed-a2f7d45a26d7","content":"\u003cp\u003eIn high school, I was upbeat, energetic, and loved challenging myself academically. I played football and lacrosse and spent a lot of time working out. On the weekends, I would volunteer at my church with fundraising events and other opportunities. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"ef361a54-68f5-448e-9320-2d4ed6657457\"}":{"__typename":"School","uuid":"ef361a54-68f5-448e-9320-2d4ed6657457","name":"Watertown High School","city":"Watertown","type":"HIGH","state":"New York","country":"United States","zip":"13601"},"Education:{\"uuid\":\"43bffcc9-8f48-42df-8dcb-3608ea378607\"}":{"__typename":"Education","uuid":"43bffcc9-8f48-42df-8dcb-3608ea378607","school":{"__ref":"School:{\"uuid\":\"ef361a54-68f5-448e-9320-2d4ed6657457\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"05b62615-6b31-4004-88f8-1f99b42fdf94\"}":{"__typename":"Education","uuid":"05b62615-6b31-4004-88f8-1f99b42fdf94","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"0a884f22-f96a-4b08-9089-1fbee0718810\"}":{"__typename":"MentorPublicProfile","uuid":"0a884f22-f96a-4b08-9089-1fbee0718810","displayName":"Ken H.","slug":"ken-huynh","biography":"\u003cp\u003e\u003cstrong\u003eKen, the short version.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eHi! I am Ken. I was born in Vietnam and grew up in a small town in Upstate New York. I am a recent graduate of Yale University with a degree in History. I also spent much of time acting. I am passionate about helping students find their voice through written projects, research papers, and theatrical performances.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAbout me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn high school, I tutored algebra and chemistry, but what I loved most was literature and writing. It challenged me in ways that helped me become a better writer and thinker. When I applied to college, I struggled to tell my story in an interesting way. I had to teach myself writing and style all over again. My English teacher was right when she said that writing would take me wherever I wanted to go. It took me to Yale!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAt Yale I focused on:\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eActing: \u003c/strong\u003eI began acting at Yale and fell in love with it. I took a bunch of classes, acted in some short films, was a background in a Hulu original, and then became a lead in play.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWriting: \u003c/strong\u003eAs a history major, I love not only random facts about the world but also learning how to argue and win (who doesn't?). I loved writing creatively as well, spending my time in the realm of creative nonfiction and playwriting.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOther Interests:\u003c/strong\u003e I also explored interests in sustainable consulting, worked as a historical environmental researcher, and was heavily involved in the Catholic community.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI guide K-12 students through:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eCollege Essay Guidance\u003c/strong\u003e (picking a topic, style and rhetorical devices development, draft an essay, editing, final submission).\u003c/p\u003e\u003cp\u003e\u003cstrong\u003ePassion Projects \u003c/strong\u003e(starting a club, writing and publishing history research papers, publishing a book, writing creative essays)\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eActing \u003c/strong\u003e(putting on a performance, writing a play/script, developing a character, acting tips)\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAcademic Guidance\u003c/strong\u003e (papers for any class of any length, any writing assignment)\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy I am qualified\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI have been teaching and tutoring for as long as I can remember. In middle school I helped my friends with math homework. In high school, I tutored chemistry and algebra. I worked as substitute teacher, teaching students of all ages in all subjects. At Yale, I was a tutor in Vietnamese language. I am also a College Essay Instructor for Journey Learning Studios. My past tutees have gotten Questbridge scholarships and acceptances to top universities.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA typical session with me might look like:\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming creative project ideas and turning them into an actionable goal.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a clear, week-by-week roadmap so you feel confident at every stage.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eProviding hands-on guidance with application materials, including essays, portfolios, instructional guidance, technique development, guided editing.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down complex concepts into simple, visual, step-by-step explanations.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eOutside of History\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI love cooking (and eating), lifting weights, reading, making online content, writing plays, and acting in anything that I can find.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you are excited to learn, try ambitious projects, improve your communication, and have fun, I'd love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"efzw42fPzcq9h3tZcYuoKl00c1SOB1K2qgArlBP2yH01c","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"95529586-2b75-494a-9505-587ab6e47819\"}"},{"__ref":"DeepDives:{\"uuid\":\"bb077006-72f2-446e-b73d-a9e60cfdd29a\"}"},{"__ref":"DeepDives:{\"uuid\":\"ed3997a3-b53e-4bde-b305-2655eefdfc46\"}"},{"__ref":"DeepDives:{\"uuid\":\"7d45c443-2901-4a75-a3ed-a2f7d45a26d7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c0a446a4-a0a5-487c-88e1-2ce39953129c/-/preview/-/format/jpg/","https://ucarecdn.com/37551e29-f215-40a1-802c-c806f014bece/-/preview/-/format/jpg/","https://ucarecdn.com/37145100-8523-4727-8e0f-ed2c955a185e/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"43bffcc9-8f48-42df-8d
