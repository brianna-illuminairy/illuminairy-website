xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"2c12eeaa-e06e-4941-9755-68ecdda01f16\"}":{"__typename":"DeepDives","uuid":"2c12eeaa-e06e-4941-9755-68ecdda01f16","content":"\u003cp\u003eBuild, build, build. I knew when I was a kid that I might be interested in engineering but the moment I laid my hands on my first computer I was hooked. If you get your hands a little dirty, dive into a problem without the answers, you will learn more about a subject, and yourself. Engineers are not always makers, but knowing that you love to build is the surest method of confirming your interest early. Far more important, you develop mechanical intuition. The ability to understand the interaction of forces within machines is much harder to teach in a classroom than a woodshop. The best teacher is experience, and it is one of the most fundamental skills to being a good designer and builder.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"f414e684-d890-4557-8f9c-15cdcfd5a480\"}":{"__typename":"DeepDives","uuid":"f414e684-d890-4557-8f9c-15cdcfd5a480","content":"\u003cp\u003eDespite all my passion for engineering, I am undoubtedly a history nerd. If you let me talk I will fill hours with descriptions of impactful leaders and their accomplishments (and almost always flaws). Outside of my building, I am constantly absorbed in a book on history, philosophy, or economics, and would love nothing more than to chat about it. So if you have a history question or want to know a fun fact, ask away!\u003cbr\u003e\u003cbr\u003ep.s. Today's is that carrots don't actually make your eyes better, the Brits made that up to cover that they had invented Radar during WW2 and explain why their pilots could fight at night (otherwise impossible).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"13829731-8084-4dae-be56-8a35b22f3ad3\"}":{"__typename":"School","uuid":"13829731-8084-4dae-be56-8a35b22f3ad3","name":"Lick Wilmerding High School","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94112"},"Education:{\"uuid\":\"4ff8e502-8e37-4c6a-ace2-3590b10fae9e\"}":{"__typename":"Education","uuid":"4ff8e502-8e37-4c6a-ace2-3590b10fae9e","school":{"__ref":"School:{\"uuid\":\"13829731-8084-4dae-be56-8a35b22f3ad3\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"cd598797-3823-4f6e-92c0-233331cf2ea8\"}":{"__typename":"Education","uuid":"cd598797-3823-4f6e-92c0-233331cf2ea8","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"508ce29f-f202-4339-84e5-8b5fb6a43b5d\"}":{"__typename":"MentorPublicProfile","uuid":"508ce29f-f202-4339-84e5-8b5fb6a43b5d","displayName":"James M.","slug":"jamie-carroll","biography":"\u003cp\u003eHi there, my name is Jamie! I am a second year mechanical engineering student at Stanford and am so excited to help you jump into making. Like most mechanical engineers (and those interested in becoming one) I love to build. It doesn't particularly matter the project as long as I have a wrench in one hand and a sheet full of plans in the other. I've worked on everything from planes to guitars and if it moves, I've probably thought of seven different ways to build it. My goal as a mentor is to provide the tools and guidance so that you can fully access the joy of making that has accompanied me in each and every project. It doesn't matter what you want to build or design, working together well devise a plan, build models and diagrams, run the proper analysis, prototype, and undoubtedly create something amazing!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"2c12eeaa-e06e-4941-9755-68ecdda01f16\"}"},{"__ref":"DeepDives:{\"uuid\":\"f414e684-d890-4557-8f9c-15cdcfd5a480\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/db5a0014-3076-4363-802f-c989c7afe93d/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4ff8e502-8e37-4c6a-ace2-3590b10fae9e\"}"},{"__ref":"Education:{\"uuid\":\"cd598797-3823-4f6e-92c0-233331cf2ea8\"}"}],"hiredAt":"2024-11-21T08:13:13.447Z","topics":["Algebra I","Algebra II","Physics","History","Academic Coaching","Executive Function","History Project","Robotics / Electronics / CAD","Debate","Public Speaking"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jamie-carroll\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"508ce29f-f202-433
