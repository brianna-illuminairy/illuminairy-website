xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ec356c31-554a-47b2-b5d4-5267075a6f4a\"}":{"__typename":"DeepDives","uuid":"ec356c31-554a-47b2-b5d4-5267075a6f4a","content":"\u003cp\u003eIn my spare time, I like to hang out with my friends, stay active (through squash, lacrosse, and going to workout classes), reading, and watching TV. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"68ba9b11-92b0-47e5-8f74-8e1ef6cd2005\"}":{"__typename":"DeepDives","uuid":"68ba9b11-92b0-47e5-8f74-8e1ef6cd2005","content":"\u003cp\u003eMentorship is important to me because I have had great mentors through my mom, my teachers, and older friends, who have greatly shaped the person I am today. There are many things in life that can feel overwhelming and daunting, and it is always helpful to have people with more experience giving you advice and leading the way for you. I hope to help others figure out what they are passionate about and guide them in their interests, while also learning about myself through the process. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"93556a6c-0d35-4a7d-b15a-523b7cad85b9\"}":{"__typename":"DeepDives","uuid":"93556a6c-0d35-4a7d-b15a-523b7cad85b9","content":"\u003cp\u003eI would tell myself to not worry about what other people think about you, listen to what you are genuinely interested in. I would also tell myself to not be afraid to try new things and put myself out there. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"0b819588-b1ad-4ef6-a6d3-cd0e7e1a4293\"}":{"__typename":"DeepDives","uuid":"0b819588-b1ad-4ef6-a6d3-cd0e7e1a4293","content":"\u003cp\u003eMy greatest motivation is that we all only get one shot at life. I am an intrinsically motivated person because I want to learn, feel, and see all that life has to offer. I also understand that everyone is trying to figure things out and that people naturally make mistakes along the way. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"06d398e8-5a2b-437d-9ac6-994779a5da3f\"}":{"__typename":"School","uuid":"06d398e8-5a2b-437d-9ac6-994779a5da3f","name":"The Spence School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"a7aaf425-9aaf-4931-b4c3-2a8c979bee02\"}":{"__typename":"Education","uuid":"a7aaf425-9aaf-4931-b4c3-2a8c979bee02","school":{"__ref":"School:{\"uuid\":\"06d398e8-5a2b-437d-9ac6-994779a5da3f\"}"},"startYear":"2011","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"4deba2f9-d77e-433b-911d-c4dd10b2e0f9\"}":{"__typename":"Education","uuid":"4deba2f9-d77e-433b-911d-c4dd10b2e0f9","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"aaa3239c-ba47-41ff-92bf-dddb1de7eab8\"}":{"__typename":"MentorPublicProfile","uuid":"aaa3239c-ba47-41ff-92bf-dddb1de7eab8","displayName":"Annesley A.","slug":"annesley-elizabeth","biography":"\u003cp\u003eHi! My name is Annesley Apple and I am from New York City. I am currently studying at Stanford University and attended the Spence School K-12. In high school, I played competitive individual squash and captained Spence's varsity squash team. I led the team to three NY State championships, and was awarded All-American two years in a row. In addition to squash, I was a member of Spence's selective environmental program, where I learned about the environment from multiple perspectives. The program culminated in a thesis project on reducing e-waste around NYC. As a former violin player, I also started the Concerts in Motion club at Spence. The club's mission was to organize classical ensembles to play at retirement homes. At Stanford, I plan on majoring in Economics in minoring in Data Science. I am also involved in Stanford Club Squash, Stanford Club Lacrosse, and Stanford Women in Finance. In my free time, I enjoy hanging out with friends, skiing, and reading. As a mentor, I want to help younger students discover their passions and encourage them to take actionable steps to make a difference. I have previously tutored middle-school aged kids with their summer homework and I hope to continue making kids engaged and excited about school and their hobbies. \u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVid
