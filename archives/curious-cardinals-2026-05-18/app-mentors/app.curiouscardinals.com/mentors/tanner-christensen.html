xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7d3eb89e-bd44-4e18-a5ac-2a057e3d4df1\"}":{"__typename":"Favorites","uuid":"7d3eb89e-bd44-4e18-a5ac-2a057e3d4df1","photoUrl":"https://ucarecdn.com/91098ce0-ba4d-46ba-9419-f67e6d51ac9d/","title":"SIS (Soft is Strong) by Katseye","type":"ALBUM"},"Favorites:{\"uuid\":\"4c857e58-d648-4380-b8e5-b3c7c643b3fe\"}":{"__typename":"Favorites","uuid":"4c857e58-d648-4380-b8e5-b3c7c643b3fe","photoUrl":"https://ucarecdn.com/2c76acbe-c0b0-42e0-ac30-05f11aa394a0/","title":"Wingspan","type":"GAME"},"Favorites:{\"uuid\":\"12b2052b-5c26-4094-ac40-d04445775523\"}":{"__typename":"Favorites","uuid":"12b2052b-5c26-4094-ac40-d04445775523","photoUrl":"https://ucarecdn.com/9f5ccc59-6cbd-497c-a333-50fcb761ccc8/","title":"New York City","type":"CITY"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"b5f0fd1e-9dae-4aad-9ca1-17369e2c6082\"}":{"__typename":"DeepDives","uuid":"b5f0fd1e-9dae-4aad-9ca1-17369e2c6082","content":"\u003cp\u003eIn my spare time, I love to practice calligraphy, junk journal, and dance! I also love rewatching sitcoms -- my favorite is Modern Family. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"246eb62f-9124-4630-a1f3-1d8e4bdb0c4c\"}":{"__typename":"DeepDives","uuid":"246eb62f-9124-4630-a1f3-1d8e4bdb0c4c","content":"\u003cp\u003eI would advise myself to pursue the things that I am genuinely passionate about, rather than things that might \"look good\" to a college. I think I would have been a lot happier and potentially, more successful!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"f4f244c5-489a-4c41-b896-5300ed2710b8\"}":{"__typename":"DeepDives","uuid":"f4f244c5-489a-4c41-b896-5300ed2710b8","content":"\u003cp\u003eSocial justice issues and injustice generally motivate me to want to contribute something meaningful to the world. Seeing imperfections with the world ignites me to want to change it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"1d21b758-3c89-4f1e-9d0a-8c53e3e1c923\"}":{"__typename":"DeepDives","uuid":"1d21b758-3c89-4f1e-9d0a-8c53e3e1c923","content":"\u003cp\u003eI want to help other students excel in their academics, and I love reflecting on my experiences with others. I am hopeful that a mentorship relationship with a student is mutually beneficial!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"d444f298-8f99-4bb7-b1db-00b866b4c9b5\"}":{"__typename":"School","uuid":"d444f298-8f99-4bb7-b1db-00b866b4c9b5","name":"Providence Hall High School","city":"Herriman","type":"HIGH","state":"Utah","country":"United States","zip":"84065"},"Education:{\"uuid\":\"799afd20-51af-45a0-8414-e775f5fba20f\"}":{"__typename":"Education","uuid":"799afd20-51af-45a0-8414-e775f5fba20f","school":{"__ref":"School:{\"uuid\":\"d444f298-8f99-4bb7-b1db-00b866b4c9b5\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"49e5d200-1e58-4445-bab0-191c2d121e58\"}":{"__typename":"Education","uuid":"49e5d200-1e58-4445-bab0-191c2d121e58","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Psychology (BA), Communications (MA)","degree":null},"MentorPublicProfile:{\"uuid\":\"bb2d4a9e-7499-46b3-af67-b5ed72e4cbd5\"}":{"__typename":"MentorPublicProfile","uuid":"bb2d4a9e-7499-46b3-af67-b5ed72e4cbd5","displayName":"Tanner C.","slug":"tanner-christensen","biography":"\u003cp\u003eTanner Christensen is a recent graduate of Stanford University where he earned the prestigious J.E. Wallace Sterling Award, recognizing him as one of the top 25 graduates in the School of Humanities and Sciences. This exceptional achievement is a testament to his dedication and academic excellence throughout his time at Stanford, where he earned a master's degree in Communications (Media Studies) and a bachelor's degree in Psychology, with a minor in Human Rights. His commitment to scholarship was further recognized by his induction into Phi Beta Kappa as a junior, a distinction awarded to only 2% of students. He culminated his academic journey with a thought-provoking master's thesis exploring the impact of smartphone use on modern society and a compelling human rights capstone project that delved into the complexities of navigating identity through the expressive power of dance.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, Tanner is pursuing his John Gardner Fellowship at the Ford Foundation under the mentorship of President Darren Walker. This prestigious fellowship allows him to further his passion for public service and social justice, working alongside influential leaders in the field.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTanner's commitment to public service is deeply rooted. Throughout his time at Stanford, he actively sought opportunities to make a difference. He served on the Haas Center for Public Service as a lead peer advisor, guiding fellow students in finding meaningful public service opportunities and fostering a culture of engagement within the university community. His passion for empowering others to contribute to the greater good extends beyond Stanford. Tanner interned at the Utah Society for Environmental Education, Root \u0026amp; Rebound (a non-profit dedicated to empowering people impacted by the criminal justice system), the New York City Commission on Human Rights, and Asibey Consulting, gaining valuable experience in diverse sectors. As a volunteer with Matriculate, he has dedicated himself to helping students from under-resourced communities gain access to higher education, contributing to the success of students who have gone on to attend top universities, including Yale, Brown, and the University of Chicago.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond his academic and service commitments, Tanner is a multifaceted individual with a wide range of interests. He actively participated in research projects, served as a program ambassador for Stanford in New York, and embraced his passion for dance and cheerleading. Tanner continues to be a strong advocate for public service and finds joy in connecting people with opportunities to contribute to positive social change. He believes that everyone has the potential to make a difference and strives to create pathways for individuals to find their own unique ways to give back.\u003c/p\u003e","teaching
