xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"9e0b4f0b-1acc-4889-80ec-ab605689cae2\"}":{"__typename":"DeepDives","uuid":"9e0b4f0b-1acc-4889-80ec-ab605689cae2","content":"\u003cp\u003eIn my spare time, I love to oil paint, watch films, and stay informed by reading the news and keeping up with current technology trends. I also enjoy taking walks outside to clear my mind and spending time planning for the future.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"b5af9603-ba10-470e-8fc0-8f60276c639d\"}":{"__typename":"DeepDives","uuid":"b5af9603-ba10-470e-8fc0-8f60276c639d","content":"\u003cp\u003eDuring high school, I spent my summers in China, training at a ballet intensive, or working on my magazine, Junk Dump Magazine.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"89e47179-ce24-43c1-9545-ce5587c811e3\"}":{"__typename":"DeepDives","uuid":"89e47179-ce24-43c1-9545-ce5587c811e3","content":"\u003cp\u003eI would tell my middle and high school self to spend this time being as creative and curious as possible—experiment with new ideas, try different passions, and don’t be afraid to fail. This is the time to explore before responsibilities start piling up, so take advantage of it. And most importantly, trust that everything always works out the way it’s meant to.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ab33c5bc-157f-4a59-967b-b9f2b6cedd1f\"}":{"__typename":"DeepDives","uuid":"ab33c5bc-157f-4a59-967b-b9f2b6cedd1f","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is expanding access to quality education for those who otherwise wouldn’t have the opportunity. Education is a powerful tool for empowerment, yet so many people are denied it due to systemic barriers. My work with Curious Cardinals has been the perfect starting point, allowing me to mentor and support students in their learning journeys. In the future, I hope to build on this by creating sustainable, scalable initiatives that make education more accessible and equitable worldwide.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"76e0521a-8bca-4137-a61d-9191afb7cef0\"}":{"__typename":"School","uuid":"76e0521a-8bca-4137-a61d-9191afb7cef0","name":"Ward Melville High School","city":"Setauket","type":"HIGH","state":"NY","country":"United States","zip":"11733"},"Education:{\"uuid\":\"616ea2ce-c5a9-4021-b276-0e7b0aa5dfd4\"}":{"__typename":"Education","uuid":"616ea2ce-c5a9-4021-b276-0e7b0aa5dfd4","school":{"__ref":"School:{\"uuid\":\"76e0521a-8bca-4137-a61d-9191afb7cef0\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"70294a89-e599-4b8b-8914-a7c14a393763\"}":{"__typename":"Education","uuid":"70294a89-e599-4b8b-8914-a7c14a393763","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Communication","degree":null},"MentorPublicProfile:{\"uuid\":\"ab002533-5947-417a-9322-e3b46869cf1d\"}":{"__typename":"MentorPublicProfile","uuid":"ab002533-5947-417a-9322-e3b46869cf1d","displayName":"Mia S.","slug":"mia-schoolman","biography":"\u003cp\u003eI’m Mia Schoolman, a Communication major with minors in Design and Consumer Psychology. I study the dynamic intersection of politics, technology, and history, examining how media shapes behavior and influences societal trends.\u003c/p\u003e\u003cp\u003ePassionate about creativity and community, I founded Junk Dump Magazine, a 501(c)(3) nonprofit arts organization, in high school and continue to lead it, championing emerging artists and fostering creative expression. My dedication to education is equally strong—I've been tutoring students since high school, deepening my appreciation for the transformative power of learning.\u003c/p\u003e\u003cp\u003eProfessionally, I’ve gained hands-on experience in media and consumer behavior through my internship at Paramount and will soon begin as an Associate at Goldman Sachs. My academic and professional journey reflects a commitment to innovation, strategic thinking, and creating meaningful impact.\u003c/p\u003e","teachingVideoPlaybackId":"mv28FlAaJKG8V00UEXgMHTwt300GHtekM18Gxu02mQLOvo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I'm most proud of is founding \u003cem\u003eJunk Dump
