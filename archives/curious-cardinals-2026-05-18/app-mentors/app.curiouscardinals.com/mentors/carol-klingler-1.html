xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"e54e56f3-8997-41a3-bf2d-ebcd0445c95d\"}":{"__typename":"DeepDives","uuid":"e54e56f3-8997-41a3-bf2d-ebcd0445c95d","content":"\u003cp\u003ef I could give advice to my middle or high school self, I would emphasize the importance of starting to explore my passions early on. Discovering what truly interests and excites me would help guide my choices and motivate me throughout my educational journey.\u003c/p\u003e\u003cp\u003eI would also advise myself not to sell myself short and to be confident in my abilities. It's easy to doubt oneself, but believing in my potential and pushing through challenges would be crucial for personal growth and success.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6811e62e-4eca-4c32-abfb-06bbd2d0900f\"}":{"__typename":"DeepDives","uuid":"6811e62e-4eca-4c32-abfb-06bbd2d0900f","content":"\u003cp\u003eIn high school, I took my first physics class and discovered that even the most complicated motions, actions, and mechanisms could be explained by just a few governing equations. This realization was one of the most exciting moments in my educational journey and helped me understand the power of math in solving real-world problems. It inspired me to become an engineer so I could apply math and learn about existing solutions to create new ones for the next generation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f83d4f4c-c999-4778-843a-0c640e57bc2c\"}":{"__typename":"DeepDives","uuid":"f83d4f4c-c999-4778-843a-0c640e57bc2c","content":"\u003cp\u003eMy dream job is to work full-time designing hypersonic planes. I've always been fascinated by airflight and find fluid behavior, especially at high speeds, incredibly intriguing. Society would be much more efficient if long-distance travel could be expedited, and I believe that designing safe hypersonic vehicles will be a significant but exciting engineering challenge.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"2ba5c88c-042c-4c9f-99cc-ec23818916ee\"}":{"__typename":"DeepDives","uuid":"2ba5c88c-042c-4c9f-99cc-ec23818916ee","content":"\u003cp\u003eMentorship matters to me because I am passionate about spreading knowledge from my own experiences, both failures and successes. I believe that by sharing what I've learned, I can help others navigate their paths more effectively and avoid some of the pitfalls I encountered. Additionally, having encouragement and guidance from someone who has gone through similar experiences is invaluable. It provides not only practical advice but also the emotional support needed to persevere through challenges. Knowing that someone else has faced and overcome the same obstacles can be incredibly motivating and reassuring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}":{"__typename":"School","uuid":"1855d7ef-1e93-4456-9092-47a74b3f8fb1","name":"New Trier Township High School - Winnetka","city":"Winnetka","type":"HIGH","state":"Illinois","country":"United States","zip":"60093"},"Education:{\"uuid\":\"6567ba0c-0603-4cdf-937b-d050934fc59e\"}":{"__typename":"Education","uuid":"6567ba0c-0603-4cdf-937b-d050934fc59e","school":{"__ref":"School:{\"uuid\":\"1855d7ef-1e93-4456-9092-47a74b3f8fb1\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"65a093a3-8a29-422b-9cbb-de53355fab03\"}":{"__typename":"Education","uuid":"65a093a3-8a29-422b-9cbb-de53355fab03","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"60e77258-60ef-4330-aac7-d6dd585a5a9e\"}":{"__typename":"MentorPublicProfile","uuid":"60e77258-60ef-4330-aac7-d6dd585a5a9e","displayName":"Carol K.","slug":"carol-klingler-1","biography":"\u003cp\u003eHi! My name is Carol Klingler, and I am thrilled to be part of this vibrant community. With a passion for engineering and love of learning, I am dedicated to pushing the boundaries of what's possible academically and professionally. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I am pursuing combined bachelors an masters degrees in mechanical engineering at Northwestern. At school, I am involved in the Formula SAE team, where we engineer a race car from scratch. Designing a race car is challenging - but always exhilarating - and the hands-on work with an incredible group has gifted me some of my most exciting and cherished memories in engineering! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt school I've also applied my engineering knowledge to research labs, from creating a treadmill for fruit-flies for a Neurobiology lab to assisting in AI development with assisting in the invention of 'memristors' in a material science lab (similar to a resistor, except it has a 'memory'). These experiences allow me to explore new ideas and contribute to breakthroughs in STEM, and it's been an exciting and transformative application of my studies!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, my professional journey has been equally dynamic. From working at cutting-edge silicon battery start-ups to an exciting internship at Tesla, I've had the privilege of being at the forefront of technological advancements. My career highlight so far has been my time at NASA. Over the past year, I have been interning Ames Research Center, and at Johnson Space Center in Houston, where my days are filled with awe-inspiring tasks, from assisting in build-up of rocket engines for space flight to designing parts for next-generation moon rovers. Every day at NASA brings new challenges and thrilling opportunities to shape the future of space exploration. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThese diverse experiences have not only honed my engineering skills, but instilled a deep sense of purpose and excitement for STEM and learning. I am passionate about sharing my knowledge and experiences, the good and the bad, and inspiring others to pursue their own dreams. Moving to new cities and meeting new people has taught me the importance of resilience, and the values of building meaningful connections. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am excited to bring my expertise, enthusiasm, and dedication to Curious Cardinals. And I'd love to help you reach your own goals. Together, we can explore new frontiers, innovate and make a lasting impact in the world! \u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"Tf4Eg99HGiwqfMsOv8gfhlc02vdMPHFqWT214EKeS2Wg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"e54e56f3-8997-41a3-bf2d-ebcd0445c95d\"}"},{"__ref":"DeepDives:{\"uuid\":\"6811e62e-4eca-4c32-abfb-06bbd2d0900f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f83d4f4c-c999-4778-843a-0c640e57bc2c\"}"},{"__ref":"DeepDives:{\"uuid\":\"2ba5c88c-042c-4c9f-99cc-ec23818916ee\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ae5dc09c-56f3-439f-ae65-80d5e79d14b5/-/preview/-/format/jpg/","https://ucarecdn.com/b78f7ad8-cf12-4545-856d-5d3c06d94b80/-/preview/-/format/jpg/","https://ucarecdn.com/02ee0d89-fd05-4f65-9390-6213e390c67b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6567ba0c-0603-4cdf-937b-d050934fc59e\"}"},{"__ref":"Education:{\"uuid\":\"65a093a3-8a29-422b-9cbb-de53355fab03\"}"}],"hiredAt":"2024-06-24T23:52:21.234Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Physics","K-6 Storybook","Aviation / Aerospace","STEM Project","Robotics / Electronics / CAD"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"carol-klingler-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"60e77258-60ef-4330-aac7-d6dd585a5a9e\"}"}}},"_sentryTraceData":"9d7134080cca4e26b54affad55d4ab8e-81374621bbfa3555-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=9d7134080cca4e26b54affad55d4ab8e,sentry-sample_
