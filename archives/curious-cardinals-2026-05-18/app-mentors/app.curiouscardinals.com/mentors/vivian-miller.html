xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3333badf-6abc-4f6c-913b-8114416a0f30\"}":{"__typename":"Favorites","uuid":"3333badf-6abc-4f6c-913b-8114416a0f30","photoUrl":"https://ucarecdn.com/2af41a75-da7a-497b-b1e8-fcec3d427293/","title":"Roger Federer","type":"ATHLETE"},"Favorites:{\"uuid\":\"fa32ad50-6cd4-4597-9e2b-7492a6f556ec\"}":{"__typename":"Favorites","uuid":"fa32ad50-6cd4-4597-9e2b-7492a6f556ec","photoUrl":"https://ucarecdn.com/ab84fe09-a357-4aec-ac39-b0a982fc1ebb/","title":"Barcelona","type":"CITY"},"Favorites:{\"uuid\":\"e320a6ad-dccf-4d2c-8ed8-7c3ea927bb08\"}":{"__typename":"Favorites","uuid":"e320a6ad-dccf-4d2c-8ed8-7c3ea927bb08","photoUrl":"https://ucarecdn.com/fae46455-95b7-443b-a82b-ecbfb0ceb3a5/","title":"KATSEYE","type":"ARTIST"},"CausesSupported:{\"uuid\":\"8cc2d31e-0bcd-4c25-a58f-0c1bcc86e4de\"}":{"__typename":"CausesSupported","uuid":"8cc2d31e-0bcd-4c25-a58f-0c1bcc86e4de","name":"Educational Equality","description":"\u003cp\u003eBreakthrough Collaborative - former teaching fellow\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"23e86450-7866-40f6-9a38-6bc3183f2593\"}":{"__typename":"DeepDives","uuid":"23e86450-7866-40f6-9a38-6bc3183f2593","content":"\u003cp\u003eI believe that mentorship and helping students younger than me is my main purpose in life. Throughout all of my education, I’ve realized that the most meaningful learning experiences come from people who see your potential before you do. Mentors have shaped my confidence, curiosity, and resilience by offering guidance at moments when I needed it most. I see mentorship as both a way to give back and a way to keep growing myself—it’s a reciprocal relationship that reminds me learning never ends.\u003c/p\u003e\u003cp\u003eAs a mentor, I want to be the person who helps students feel seen and capable, especially in subjects like math that can often feel intimidating. My goal is to make learning personal and joyful, showing students that success isn’t about innate talent but persistence, creativity, and the right support. Every student deserves someone who believes in them, asks thoughtful questions, and celebrates small victories. Mentorship matters to me because it builds the kind of trust and community that transforms education from something we do alone into something we share—and that, to me, is what learning is really about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"af6bf0c8-abc7-4e76-b222-c41faaef604e\"}":{"__typename":"DeepDives","uuid":"af6bf0c8-abc7-4e76-b222-c41faaef604e","content":"\u003cp\u003eThe one thing I hope to accomplish in my lifetime is to change as many people’s lives for the better as possible. I want to leave a lasting impact on others by helping them see their own potential and believe in what they’re capable of achieving. Whether through teaching, mentoring, or simply being a supportive presence, I want my life’s work to center on helping others grow. I’ve been lucky to have mentors who saw something in me before I saw it in myself, and that experience has shaped how I define success—not by personal achievements alone, but by the ripple effect of encouraging others. If I can inspire even a few people to find confidence in their abilities, pursue their passions, and feel proud of who they are, I’ll consider that a life well lived.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"556c0658-2cae-43db-b9b7-bba54ef0aa1d\"}":{"__typename":"School","uuid":"556c0658-2cae-43db-b9b7-bba54ef0aa1d","name":"Ashley Hall","city":"Charleston","type":"HIGH","state":"South Carolina","country":"United States","zip":"29403"},"Education:{\"uuid\":\"d200d999-5fa7-4a08-b827-27467b5a60f3\"}":{"__typename":"Education","uuid":"d200d999-5fa7-4a08-b827-27467b5a60f3","school":{"__ref":"School:{\"uuid\":\"556c0658-2cae-43db-b9b7-bba54ef0aa1d\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"aab6d88c-ec7e-407f-a767-6844daecdada\"}":{"__typename":"Education","uuid":"aab6d88c-ec7e-407f-a767-6844daecdada","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2026","major":"Applied Math and Education Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"117ff9a2-4389-4e63-9a9a-95af0dd5cd3d\"}":{"__typename":"MentorPublicProfile","uuid":"117ff9a2-4389-4e63-9a9a-95af0dd5cd3d","displayName":"Vivian M.","slug":"vivian-miller","biography":"\u003cp\u003eHi! I’m Vivian, a senior at Brown University, double concentrating in Applied Mathematics and Education Studies. I love exploring how people learn and finding creative ways to make math exciting, accessible, and deeply connected to the real world. I’ve also taken classes in more than 15 different departments at Brown because I am always curious to learn about interesting things from interesting people.\u003cbr\u003e---\u003c/p\u003e\u003cp\u003eI’ve had the privilege of mentoring students through Breakthrough Collaborative, a non-profit summer program that helps middle and high school students from underserved communities build confidence and get ahead in school. At Brown, I’ve also tutored a range of math courses, from introductory algebra to applied topics in probability and optimization. My experiences across classrooms and mentorship programs have taught me that learning thrives in environments of collaboration, joy and a little bit of silliness.\u003cbr\u003e---\u003c/p\u003e\u003cp\u003eWhen I was growing up, I only started excelling at math because my 8th grade teach had high expectations of me. He brought tons of joy to the classroom while also pushing me to believe in myself! I truly believe that everyone is a “math person” and some people just haven’t found the way they learn math best yet! My approach to teaching is rooted in my senior thesis research on teacher–student relationships in STEM, where I study how strong relationships help students feel seen, capable, and motivated to learn. I prioritize connection in every session because once we build that foundation, anything becomes possible! I also love using \u003cstrong\u003er\u003c/strong\u003eeal-world examples and phenomena — from sports statistics to architecture to baking ratios — to show how math appears everywhere.\u003cbr\u003e---\u003c/p\u003e\u003cp\u003eA typical session with me is interactive, collaborative, and energizing. We might:\u003cbr\u003e\u003c/p\u003e\u003cp\u003e✅ Break down tricky concepts step-by-step until they “click”\u003c/p\u003e\u003cp\u003e✅ Build small real-world projects to apply math concepts creatively\u003c/p\u003e\u003cp\u003e✅ Reflect on problem-solving strategies to strengthen confidence\u003c/p\u003e\u003cp\u003e✅ Work on broader academic skills like time management and self-advocacy\u003cbr\u003e----\u003c/p\u003e\u003cp\u003eI want every student to leave our sessions feeling supported, capable, and a little more confident in their ability to tackle challenges.\u003cbr\u003e---\u003c/p\u003e\u003cp\u003eOutside the classroom, some of my greatest joys include:\u003c/p\u003e\u003cp\u003e🏆 Winning dozens of national tennis trophies as a top junior player\u003c/p\u003e\u003cp\u003e🎨 Painting murals in Barcelona, my favorite city in the world\u003c/p\u003e\u003cp\u003e🍪 Baking cookies and brownies on a whim\u003c/p\u003e\u003cp\u003e🎲 Playing Catan with friends every week\u003c/p\u003e\u003cp\u003e🎶 Learning new dances and making playlists with my roommates\u003c/p\u003e\u003cp\u003e---\u003c/p\u003e\u003cp\u003eI love solving problems and working on teams, so after I graduate from Brown, I plan on moving to Boston to work in education strategy consulting at a top firm.\u003cbr\u003e---\u003cbr\u003eIf you want to walk away from each session feeling energized, connected, and inspired — I’d love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"izOKqrZNIfrdtvV00m1RtTZ3yR2rzXSpk00WHFN4i3cXw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3333badf-6abc-4f6c-913b-8114416a0f30\"}"},{"__ref":"Favorites:{\"uuid\":\"fa32ad50-6cd4-4597-9e2b-7492a6f556ec\"}"},{"__ref":"Favorites:{\"uuid\":\"e320a6ad-dccf-4d2c-8ed8-7c3ea927bb08\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"8cc2d31e-0bcd-4c25-a58f-0c1bcc86e4de\"}"}],"major":"Applied Math and Education Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"23e86450-7866-40f6-9a38-6bc3183f2593\"}"},{"__ref":"DeepDives:{\"uuid\":\"af6bf0c8-abc7-4e76-b222-c41faaef604e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3c06d8b7-fd14-454b-b3e9-0c9f9f994b10/-/preview/-/format/jpg/","https://ucarecdn.com/23007880-7027-401d-aed2-486a3c85a8da/-/preview/-/format/jpg/","https://ucarecdn.com/b75f0a3a-3127-41d4-829f-bdf9785fbf2e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d200d999-5fa7-4a08-b827-27467b5a60f3
