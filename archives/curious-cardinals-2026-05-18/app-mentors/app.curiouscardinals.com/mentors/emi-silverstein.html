xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b95a0f0a-17ae-4e3d-899b-acc47e351177\"}":{"__typename":"Favorites","uuid":"b95a0f0a-17ae-4e3d-899b-acc47e351177","photoUrl":"https://ucarecdn.com/6192729b-4b87-4d7d-b52c-7589aa853d20/","title":"Taylor Swift","type":"ARTIST"},"Favorites:{\"uuid\":\"8b9eee4b-01b0-43a1-b879-39d8d56f12a2\"}":{"__typename":"Favorites","uuid":"8b9eee4b-01b0-43a1-b879-39d8d56f12a2","photoUrl":"https://ucarecdn.com/6192729b-4b87-4d7d-b52c-7589aa853d20/","title":"New York!","type":"CITY"},"Favorites:{\"uuid\":\"21d7aea5-0c45-4bcd-a8fa-9e7c5f0f8185\"}":{"__typename":"Favorites","uuid":"21d7aea5-0c45-4bcd-a8fa-9e7c5f0f8185","photoUrl":"https://ucarecdn.com/6192729b-4b87-4d7d-b52c-7589aa853d20/","title":"Football","type":"SPORT"},"CausesSupported:{\"uuid\":\"2802f937-723f-4c74-b823-a97b744493a0\"}":{"__typename":"CausesSupported","uuid":"2802f937-723f-4c74-b823-a97b744493a0","name":"The Michael J Fox Foundation for Parkinson's Research","description":"\u003cp\u003emember of Team Fox Young Professionals and am running the NYC Marathon for them!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/7dd10b7a-0de3-4add-8c0e-01727e73d57d/"},"CausesSupported:{\"uuid\":\"2bf1bb8c-2174-4c4e-81d4-3b3c04f7c26a\"}":{"__typename":"CausesSupported","uuid":"2bf1bb8c-2174-4c4e-81d4-3b3c04f7c26a","name":"God's Love We Deliver","description":"\u003cp\u003ePacking meals for NYC's homebound ill and elderly\u003c/p\u003e","photoUrl":"https://ucarecdn.com/d87b54d4-ed31-4218-a935-455366f26674/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"2b6fd7f5-d13d-4988-b11d-b65e6d7c6c18\"}":{"__typename":"DeepDives","uuid":"2b6fd7f5-d13d-4988-b11d-b65e6d7c6c18","content":"\u003cp\u003eAs an ice cream connoisseur, I recently got into testing my own recipes! Best flavor to date has to be sour cherry and granola. One of my favorite parts of the process is working with local vendors at the farmers market, securing fresh produce to incorporate into my recipes. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"52fdb740-0338-42f4-a04d-49ae742290c5\"}":{"__typename":"DeepDives","uuid":"52fdb740-0338-42f4-a04d-49ae742290c5","content":"\u003cp\u003eI spent many of my summers in High School interning for the Michael J Fox Foundation for Parkinson's Research. This experience was foundational to my non-profit involvement and understanding today. Following my father's diagnosis, I educated myself and my peers. Through this group, I rallied youth across both public and private schools throughout New York City.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"76dd79a4-9d89-418f-877a-6533f7d2a7e7\"}":{"__typename":"DeepDives","uuid":"76dd79a4-9d89-418f-877a-6533f7d2a7e7","content":"\u003cp\u003eWhile studying for the SAT, my dad always told me \"Study Like a Champion Today\" mimicking that of famed Notre Dame Football Coach, Lou Holtz. I made my version of this sign and posted it on the back of my childhood room door, reminding me of the importance of studying to the best of my ability, each and every day. Today, I apply this in other areas of my life, swapping out the verbiage to match the goal I am trying to meet on any given day. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"432e2cc8-f46c-48f1-afbf-9e44d88c7ce6\"}":{"__typename":"DeepDives","uuid":"432e2cc8-f46c-48f1-afbf-9e44d88c7ce6","content":"\u003cp\u003eGrowing up as the oldest sibling, leading by example is one of the greatest responsibilities I face. My youngest sibling is 7 years my junior so spending time with her always feels like mentoring to me. Additionally, I have had mentors in the past, namely tutors and professors, who were gamechangers for me in unlocking  potential. Those relationships changed my outlook on my work life and shaped me into the person that I am today. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122\"}":{"__typename":"School","uuid":"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122","name":"Spence School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"fd99b9f4-a1c3-4c67-a17b-6d47ba67cd18\"}":{"__typename":"Education","uuid":"fd99b9f4-a1c3-4c67-a17b-6d47ba67cd18","school":{"__ref":"School:{\"uuid\":\"aebca2f8-2ed6-4dcc-bbdc-e9ff63766122\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"
