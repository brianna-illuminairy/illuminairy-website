xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4bab4a45-0d70-404e-8de7-8e978caebace\"}":{"__typename":"Favorites","uuid":"4bab4a45-0d70-404e-8de7-8e978caebace","photoUrl":"https://ucarecdn.com/30e341de-3d16-4d78-a021-f9baa62aba30/","title":"Zach Bryan","type":"ARTIST"},"Favorites:{\"uuid\":\"46bfad64-4c2d-4d40-87f8-510f584c7081\"}":{"__typename":"Favorites","uuid":"46bfad64-4c2d-4d40-87f8-510f584c7081","photoUrl":"https://ucarecdn.com/357e036e-9e3d-4927-995d-425ce3c09912/","title":"Way of Kings by Brandon Sanderson","type":"BOOK"},"Favorites:{\"uuid\":\"a821a20e-6545-44bc-b05b-77eed735aa12\"}":{"__typename":"Favorites","uuid":"a821a20e-6545-44bc-b05b-77eed735aa12","photoUrl":"https://ucarecdn.com/437ef62a-95db-4d1f-a488-087751294137/","title":"George Clooney","type":"ACTOR"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5d21128a-b061-4b6b-81d8-4e33ffb370fa\"}":{"__typename":"DeepDives","uuid":"5d21128a-b061-4b6b-81d8-4e33ffb370fa","content":"\u003cp\u003eLooking back, I think the best advice for my younger self would be: \"Seize the moment.\" Life, and various opportunities, move past us extremely quickly, and I think it's incredibly important to recognize when the right opportunities are in front of you. Whether it's starting a new project, getting advise from a respected adult, or trying something different entirely, these fleeting opportunities can shape the direction of your career and life. The right action at the right moment can pay off a thousand fold. Sometimes, it is easy to get lost planning, worrying, and obsessing about the future, but decisive action -- stepping outside your comfort zone and embracing the present -- is what makes all the difference.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"7dc4ca58-32a4-47ff-b997-24633d89f75f\"}":{"__typename":"DeepDives","uuid":"7dc4ca58-32a4-47ff-b997-24633d89f75f","content":"\u003cp\u003eI want to make a difference. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis might sound naive or overtly optimistic, especially in today's political environment. However, I have dedicated my academic and professional career toward studying economics, politics, and public policy out of a desire to enact positive change in this country. I want to better the lives of Americans, while protecting and supporting the essential institutions of the country. The U.S. government has the potential to be an immense force of both good and harm on the American public --- I hope to make a difference, no matter how small, in fighting for freedom, equality, and opportunity. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe in the possibility of greatness within every human, and I will do everything in my power to give everyone the opportunity to thrive. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"a1e9e7ef-56b2-4a2b-bffc-4a380f5d1553\"}":{"__typename":"DeepDives","uuid":"a1e9e7ef-56b2-4a2b-bffc-4a380f5d1553","content":"\u003cp\u003eIn high school and middle school, I was quite the jack-of-all-trades, constantly juggling different interests, responsibilities, and environments. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFrom AP Calculus BC to AP European History to AP Physics C, I had a broad and diverse education that helped prepare me well for college. But my adaptability went beyond the classroom. I was just as comfortable and excelled outside of my academics -- running Cross Country and Track, participating in clubs and extracurriculars, and going to Friday Night Football Games -- as I did in the classroom. All of these experiences taught me important lessons: managing competing demands, thriving in different settings, both academic and social, and code-switching between different groups of people. I could be fun, serious, relaxed, or commanding depending on the circumstance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"910a37bd-b17c-4a89-8d74-10737676853a\"}":{"__typename":"DeepDives","uuid":"910a37bd-b17c-4a89-8d74-10737676853a","content":"\u003cp\u003eComing from a large public high school, I didn’t have much opportunity for one-on-one mentorship or personalized guidance. It was hard to form deep connections with mentors who could provide the tailored advice I needed, instead I had to figure everything -- from classes to college applications -- out on my own.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs an economics major, I can see the inefficiency and the missed opportunities that the lack of a proper mentor caused me in high school. With my academic and professional experiences, I feel a strong sense of responsibility to step in and help others now. If I can offer the kind of mentorship and guidance that I did not have in school, I will help others avoid certain struggles and empower them to reach their full potential. I believe that I can help make a difference, and I am eager to help. \u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"b4519943-7747-4939-b581-33c208b7493e\"}":{"__typename":"School","uuid":"b4519943-7747-4939-b581-33c208b7493e","name":"Marquette High School","city":"Chesterfield","type":"HIGH","state":"Missouri","country":"United States","zip":"63017"},"Education:{\"uuid\":\"cb8b8c5a-9a29-44e5-afbf-6c3590b04187\"}":{"__typename":"Education","uuid":"cb8b8c5a-9a29-44e5-afbf-6c3590b04187","school":{"__ref":"School:{\"uuid\":\"b4519943-7747-4939-b581-33c208b7493e\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"e0ad209d-169e-4f9b-aa98-239ed1872668\"}":{"__typename":"Education","uuid":"e0ad209d-169e-4f9b-aa98-239ed1872668","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Economics, Political Science","degree":null},"Testimonial:f8e5d089-32aa-4c7e-9629-739b274ca6ed":{"__typename":"Testimonial","id":"f8e5d089-32aa-4c7e-9629-739b274ca6ed","text":"Bryson is a great tutor for my son. He is professional, knowledgeable, considerate,  and he goes the extra mile. He is a great role model and I hope my son can continue to work with him.  Thank you Bryson!","date":"2025-06-02 19:20:38.991+00","rating":5,"endorser":{"__typename":"Endorser","name":"Caroline ","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"843168ed-a1b1-46fa-8c3b-e76d01e6dba6\"}":{"__typename":"MentorPublicProfile","uuid":"843168ed-a1b1-46fa-8c3b-e76d01e6dba6","displayName":"Bryson C.","slug":"bryson-chang","biography":"\u003cp\u003eHello! My name is Bryson Chang, and I am a junior at Columbia University in the City of New York. I am a double major in Economics and Political Science with a focus on pre-law studies. I'm extremely excited for the opportunity to work with Curious Cardinals and to begin\u0026nbsp;serving as an academic tutor and mentor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in the suburbs of St. Louis, Missouri, where I attended Marquette High School. I was the President of the Mock Trial team, Vice President of Marquette's Future Business Leaders of America, and I was the Captain of the Cross Country team, while taking 14 AP classes and receiving\u0026nbsp;a 1600 on my SAT. I completely understand what it is like to have a busy schedule. I left high school deeply interested in both economics and politics, hoping to spend a career in public service and government work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Columbia University, I've continued my education in math, economics, politics, and history. While I've specifically studied economic theory, electoral politics, and international relations, I have received a broad liberal arts education: I am knowledgeable\u0026nbsp;in everything from ancient Roman philosophy to calculus-based statistics. Additionally, throughout my\u0026nbsp;time in college, I have had various professional\u0026nbsp;internships at congressional, legal, and political offices, and I was elected the President of Columbia's largest student student political organization. As an Executive and\u0026nbsp;Stakeholder Engagement Intern at the Democratic Congressional Campaign Committee, I even\u0026nbsp;wrote memos and talking points for House Minority Leader Hakeem Jeffries! I have strong writing, reading, and analytical skills, and I excel at organizational leadership.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I really enjoy spending time outdoors (when I get the chance to escape from NYC) and I love to travel across the country with my friends. I go to the gym, read a lot of\u0026nbsp;fantasy books, and listen to a lot of music. I have experience tutoring from high school and, each summer, I mentor high school students at Missouri Boys State about civics and government. From my experience, I've learned that it is incredibly important to link academics with the professional world, showing and teaching the real-world significance of classroom subjects.\u0026nbsp;I am incredibly passionate about teaching others and inspiring interest in academic subjects!\u003c/p\u003e","teachingVideoPlaybackId":"Nh6JqwgfrmKk39chNteumemET65LKB8vJm011wNZfAWs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"4bab4a45-0d70-404e-8de7-8e978caebace\"}"},{"__ref":"Favorites:{\"uuid\":\"46bfad64-4c2d-4d40-87f8-510f584c7081\"}"},{"__ref":"Favorites:{\"uuid\":\"a821a20e-6545-44bc-b05b-77eed735aa12\"}"}],"causesSupported":[],"major":"Economics, Political Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5d21128a-b061-4b6b-81d8-4e33ffb370fa\"}"},{"__ref":"DeepDives:{\"uuid\":\"7dc4ca58-32a4-47ff-b997-24633d89f75f\"}"},{"__ref":"DeepDives:{\"uuid\":\"a1e9e7ef-56b2-4a2b-bffc-4a380f5d1553\"}"},{"__ref":"DeepDives:{\"uuid\":\"910a37bd-b17c-4a89-8d74-10737676853a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0feff6c0-5a32-4d74-a683-ab758780c30c/-/preview/-/format/jpg/","https://ucarecdn.com/48a30ead-6e7d-46d9-82d8-d7d454428440/-/preview/-/format/jpg/","https://ucarecdn.com/7858961c-0f50-42b4-b2a9-99cb4711f693/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"cb8b8c5a-9a29-44e5-afbf-6c3590b04187\"}"},{"__ref":"Education:{\"uuid\":\"e0ad209d-169e-4f9b-aa98-239ed1872668\"}"}],"hiredAt":"2025-01-25T01:18:04.328Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Physics","Writing","College Essay Writing","Academic Coaching","Executive Function","Reading","History","Economics","History Project","Law / Government / Policy","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[{"__ref":"Testimonial:f8e5d089-32aa-4c7e-9629-739b274ca6ed"}]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"bryson-chang\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"843168ed-a1b1-46fa-8c3b-e76d01e6dba6\"}"}}},"_sentryTraceData":"b21ed65415f84f438e9a6578ea1f5014-ab0efb2b910db648-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b21ed65415f84f438e9a6578ea1f5014,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"bryson-chang"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
