xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f87ef461-3ca7-4286-8ec8-224708cebf57\"}":{"__typename":"Favorites","uuid":"f87ef461-3ca7-4286-8ec8-224708cebf57","photoUrl":"https://ucarecdn.com/86f90bcc-aed5-4272-8771-531fcd9479b7/","title":"Jannik Sinner","type":"ATHLETE"},"Favorites:{\"uuid\":\"2d0d9875-69ee-4738-b4b6-3c3037ffe460\"}":{"__typename":"Favorites","uuid":"2d0d9875-69ee-4738-b4b6-3c3037ffe460","photoUrl":"https://ucarecdn.com/488a39ef-7a7d-42a4-8a92-ba5721dee4e5/","title":"Life of Pi","type":"BOOK"},"Favorites:{\"uuid\":\"fd3c8480-e92b-4a60-ae8c-cc484e86a5b4\"}":{"__typename":"Favorites","uuid":"fd3c8480-e92b-4a60-ae8c-cc484e86a5b4","photoUrl":"https://ucarecdn.com/b017010d-ceb7-4616-88b7-9a2e0b941a29/","title":"Basketball","type":"SPORT"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"19b074d7-f514-44ae-931e-4af99b0cb15f\"}":{"__typename":"DeepDives","uuid":"19b074d7-f514-44ae-931e-4af99b0cb15f","content":"\u003cp\u003eI chose Biomedical Engineering because I want to become a surgeon who not only practices medicine but also understands and contributes to the technologies used in surgery. BME allows me to connect engineering principles with human health and innovation in medical treatment. On a deeper level, BME has allowed me to bridge my interest in medicine with my desire to be innovative. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f8ea0632-a62b-452d-945c-029bdea78a2f\"}":{"__typename":"DeepDives","uuid":"f8ea0632-a62b-452d-945c-029bdea78a2f","content":"\u003cp\u003eMentorship matters to me because the future of any society depends on how well knowledge and experience are passed down to the next generation. Progress in fields like medicine and technology happens when people share what they have learned and help others build on it. I believe mentorship is one of the most powerful ways to support that process. Throughout my own education, I’ve benefited from teachers, coaches, and even student mentors who encouraged my curiosity and helped me see challenges as opportunities to grow. Because of that, I see mentorship as a way to give back by helping younger students build confidence and develop a love for learning. Ultimately, mentorship is about harboring an environment where students feel comfortable asking questions and discovering their potential.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"97ed0b42-e486-4204-ba1c-30a004b51a92\"}":{"__typename":"DeepDives","uuid":"97ed0b42-e486-4204-ba1c-30a004b51a92","content":"\u003cp\u003eIf I were to go back and talk to my high school self, I would tell him not to focus on just the result in school. While grades and achievements matter in a sense, I'd urge myself to explore and learn more. Always challenge yourself, whether it's a hard class you've been scared of or a sport you've never tried. Always being curious goes further than always being certain. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"56a52fb6-d0d4-4aee-8836-d6a2dc2a7bae\"}":{"__typename":"School","uuid":"56a52fb6-d0d4-4aee-8836-d6a2dc2a7bae","name":"Woodward Academy","city":"College Park","type":"HIGH","state":"Georgia","country":"United States","zip":"30337"},"Education:{\"uuid\":\"f6099e0e-96c6-4730-9f63-5d105e5a0806\"}":{"__typename":"Education","uuid":"f6099e0e-96c6-4730-9f63-5d105e5a0806","school":{"__ref":"School:{\"uuid\":\"56a52fb6-d0d4-4aee-8836-d6a2dc2a7bae\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"3c4dfb5e-bdc0-407e-af56-a545b646c73f\"}":{"__typename":"Education","uuid":"3c4dfb5e-bdc0-407e-af56-a545b646c73f","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"5a34e088-292d-421f-b8a9-0ede056a7bf8\"}":{"__typename":"MentorPublicProfile","uuid":"5a34e088-292d-421f-b8a9-0ede056a7bf8","displayName":"Akash G.","slug":"akash-gupta","biography":"\u003cp\u003eMy name is Akash Gupta, and I’m currently a junior at Columbia University studying Biomedical Engineering on the pre-medical track (Class of 2027). I’m passionate about science, problem-solving, and helping students build confidence in subjects that can sometimes feel challenging. My long-term goal is to become a physician, and my experiences in both engineering and mentorship have helped shape how I approach learning and teaching.\u003c/p\u003e\u003cp\u003eI chose to study Biomedical Engineering because it sits at the intersection of medicine, technology, and innovation. Studying Biomedical Engineering has taught me that the field is not simply about applying medical devices to the body, but about viewing the body itself as a complex system and analyzing each function to better understand how it works. As someone who hopes to become a doctor one day, I enjoy not only learning about science but also helping others discover how exciting and impactful these subjects can be.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, my coursework in engineering, biology, chemistry, and physics has strengthened my analytical thinking and problem-solving skills. But more importantly, it has reinforced something I strongly believe: curiosity goes much further than simply trying to be perfect. When students feel comfortable asking questions and exploring ideas, they tend to learn faster and enjoy the process much more. Outside of academics, I’m a big sports fan and love staying active. I enjoy both playing tennis and basketball, but I also love watching almost anything. Being active has been a big part of my life for as long as I can remember. Being a tennis player has taught me how to balance individual responsibility with teamwork. On one hand, singles requires a lot of discipline and accountability. On the other, doubles requires communication and trust with someone else.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve also spent time mentoring and teaching younger students in a variety of settings, from academic tutoring to coaching and teaching skills like swimming. These experiences have helped me learn how to communicate complex ideas in a way that is approachable and encouraging for students of different ages. Ultimately, I aim to create a supportive and encouraging learning environment where students feel comfortable making mistakes and especially asking questions. Every student learns differently, and I enjoy working with families to help students find the approach that works best for them.\u003c/p\u003e","teachingVideoPlaybackId":"eD7BbZESKAO21ayyDYKkyfla5y3npq1aHUaAxQdqHXU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"f87ef461-3ca7-4286-8ec8-224708cebf57\"}"},{"__ref":"Favorites:{\"uuid\":\"2d0d9875-69ee-4738-b4b6-3c3037ffe460\"}"},{"__ref":"Favorites:{\"uuid\":\"fd3c8480-e92b-4a60-ae8c-cc484e86a5b4\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"19b074d7-f514-44ae-931e-4af99b0cb15f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f8ea0632-a62b-452d-945c-029bdea78a2f\"}"},{"__ref":"DeepDives:{\"uuid\":\"97ed0b42-e486-4204-ba1c-30a004b51a92\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/240a0fd1-248d-4d35-86a5-06f071a3e055/-/preview/-/format/jpg/","https://ucarecdn.com/7a063909-79fc-4843-abd6-77f1b62f3048/-/preview/-/format/jpg/","https://ucarecdn.com/b09b7bc5-d0d3-4ce6-a004-43c907ac3cda/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f6099e0e-96c6-4730-9f63-5d105e5a0806\"}"},{"__ref":"Education:{\"uuid\":\"3c4dfb5e-bdc0-407e-af56-a545b646c73f\"}"}],"hiredAt":"2026-03-04T22:42:31.602Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","K-5 Grade Math","6-8 Grade Science","Chemistry","Biology"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"akash-gupta\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"5a34e088-292d-421f-b8a9-0ede056a7bf8\"}"}}},"_sentryTraceData":"0aea2f7abd8c4eb1a997592d3b0e8ddf-9b97cb01c76f8ab7-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=0aea2f7abd8c4eb1a997592d3b0e8ddf,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"akash-gupta"},"buildId":"ZAcrs
