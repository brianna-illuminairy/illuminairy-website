xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0400f9b3-6b3d-40e3-9b4e-e90be0e67d4a\"}":{"__typename":"Favorites","uuid":"0400f9b3-6b3d-40e3-9b4e-e90be0e67d4a","photoUrl":"https://ucarecdn.com/3ea53f1f-22c5-4632-aea3-8f85dd9370be/","title":"Good Will Hunting","type":"MOVIE"},"Favorites:{\"uuid\":\"28de1a90-6243-47eb-af4e-6ffb38dac6c3\"}":{"__typename":"Favorites","uuid":"28de1a90-6243-47eb-af4e-6ffb38dac6c3","photoUrl":"https://ucarecdn.com/adb7385d-b616-4d9d-925a-a514a11230a4/","title":"New England Patriots","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"47976174-be34-48b7-a446-d7f8250780a1\"}":{"__typename":"Favorites","uuid":"47976174-be34-48b7-a446-d7f8250780a1","photoUrl":"https://ucarecdn.com/2bda686b-3b2b-4ad7-9a1c-1cc90c22f87a/","title":"Catan","type":"GAME"},"CausesSupported:{\"uuid\":\"c73250ff-5cf3-4308-8dc8-295e1a581eda\"}":{"__typename":"CausesSupported","uuid":"c73250ff-5cf3-4308-8dc8-295e1a581eda","name":"Special Olympics","description":"\u003cp\u003eI am lucky enough to be an Executive for Special Olympics at UCLA!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/03183f43-eda2-48a5-bab6-742c7e1ea618/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"62c8b98a-9412-424a-9234-11ecd07364ac\"}":{"__typename":"DeepDives","uuid":"62c8b98a-9412-424a-9234-11ecd07364ac","content":"\u003cp\u003eHave gratitude for what you have, invest in meaningful relationships, and don't be afraid to try new things while you're still young!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"e44ee1e6-77d4-452a-aa7f-f9f8349fdd9f\"}":{"__typename":"DeepDives","uuid":"e44ee1e6-77d4-452a-aa7f-f9f8349fdd9f","content":"\u003cp\u003eI grew up with 5 older siblings, all of whom I consider impactful mentors. Being the youngest, I know how valuable it is to look up to someone you can see yourself in, and who you can learn from to get to where you want to go. I was very fortunate to be born with siblings to look up to, and I hope that I can be a role model to others to benefit them in a similar way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f5579fbd-cb76-4695-96b1-20844c52dae1\"}":{"__typename":"DeepDives","uuid":"f5579fbd-cb76-4695-96b1-20844c52dae1","content":"\u003cp\u003eIn Fall of 2023, I created a predictive modeling project to recommend 4th down play calling decisions in the NFL. I used my knowledge of football and my skills in statistics, machine learning, and data visualization to create an article investigating 4th down play calling, evaluating past decisions, and predicting when teams should go for it based on my model.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"32047087-75fb-488d-bd2d-05aed851fd7c\"}":{"__typename":"DeepDives","uuid":"32047087-75fb-488d-bd2d-05aed851fd7c","content":"\u003cp\u003eI hope to write a book at one point in my life. I love reading biographies, and it would be super cool to craft a narrative around my lived experiences in my own book.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"8a598a98-f8af-48c9-82fd-8c32fc707fe9\"}":{"__typename":"School","uuid":"8a598a98-f8af-48c9-82fd-8c32fc707fe9","name":"Wellesley High School","city":"Wellesley","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02481"},"Education:{\"uuid\":\"a4e75fdd-9719-4e2d-a7fd-472510630b39\"}":{"__typename":"Education","uuid":"a4e75fdd-9719-4e2d-a7fd-472510630b39","school":{"__ref":"School:{\"uuid\":\"8a598a98-f8af-48c9-82fd-8c32fc707fe9\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"59fce794-4b3c-4cf8-aae9-baa495b105f8\"}":{"__typename":"Education","uuid":"59fce794-4b3c-4cf8-aae9-baa495b105f8","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Statistics and Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"3ea69493-7046-44e3-9640-f8a5f4e94338\"}":{"__typename":"MentorPublicProfile","uuid":"3ea69493-7046-44e3-9640-f8a5f4e94338","displayName":"Thomas S.","slug":"thomas-seifert","biography":"\u003cp\u003eTom is a rising Junior at UCLA studying Statistics and Data Science. Growing up just outside of Boston in Wellesley, MA, as the youngest of 6 siblings, he spent most of his time playing competitive sports, including Football, Basketball, and Baseball, for his high school. He developed a passion for math in the classroom and became interested in learning how to use numbers to solve real-world problems, bringing him to pursue a degree in Statistics.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eCombined with his passion for playing and watching sports, his interest in statistics has brought him to get involved in the world of sports analytics. As a member of Bruin Sports Analytics, he serves as a team lead for the UCLA Football consulting team. He thoroughly enjoys creating personal projects on various sports data topics, and hopes to help others harness their passion for sports and numbers just as he has. Additional areas of experience include general data science, consulting, non-profit organization, business analytics, and software engineering.\u003cbr\u003e\u003cbr\u003eHe is one of the executives for Special Olympics at UCLA, a cause with which he has found an incredible passion and community. The relationships he has cultivated through this cause, along with the opportunity to help positively impact the intellectually disabled community it has afforded him, bring him great joy and purpose. It is a goal of his to help others experience things that have brought him valuable lessons and opportunities in his life, and Special Olympics allows him to do so through fostering inclusion in the world of sports. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn his free time, he enjoys making art (especially scratchboard), reading biographies, playing board games and video games with friends, and playing basketball. He loves being outside and discovering new places in LA, especially beaches and hiking paths. He spends many weekends in the Summer on the beach in Cape Cod, where he can be found walking on the beach looking for sea glass and spending time with his family. \u003c/p\u003e","teachingVideoPlaybackId":"J39vP4mZuzYCDgmfgS1rmkReOZB400hIcuYGQmqE2PrA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am proud of planning and running the first annual Bruin Inclusion Walk, a walk-a-thon fundraising event that garnered $8,000 in donations in just 2 weeks of fundraising. I led the organization of the event, planning the activities, securing raffle prizes and other donations form outside vendors, staffing club members on event duties, and conducting outreach for the event. Over 100 members of the LA community came to participate, including many Special Olympics athletes. It was incredibly rewarding to see our hard work pay off not only through the money we raised, but also through the joy I got to see on the faces of the Special Olympics athletes and others at the event.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0400f9b3-6b3d-40e3-9b4e-e90be0e67d4a\"}"},{"__ref":"Favorites:{\"uuid\":\"28de1a90-6243-47eb-af4e-6ffb38dac6c3\"}"},{"__ref":"Favorites:{\"uuid\":\"47976174-be34-48b7-a446-d7f8250780a1\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"c73250ff-5cf3-4308-8dc8-295e1a581eda\"}"}],"major":"Statistics and Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"62c8b98a-9412-424a-9234-11ecd07364ac\"}"},{"__ref":"DeepDives:{\"uuid\":\"e44ee1e6-77d4-452a-aa7f-f9f8349fdd9f\"}"},{"__ref":"DeepDives:{\"uuid\":\"f5579fbd-cb76-4695-96b1-20844c52dae1\"}"},{"__ref":"DeepDives:{\"uuid\":\"32047087-75fb-488d-bd2d-05aed851fd7c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/54872602-90c5-482c-b394-bf68661cc66c/-/preview/-/format/jpg/","https://ucarecdn.com/c9fc305a-b2aa-4638-94b8-ef81051055f9/-/preview/-/format/jpg/","https://ucarecdn.com/1250013a-b0d7-43e4-abf6-aca8b07fb49d/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a4e75fdd-9719-4e2d-a7fd-472510630b39\"}"},{"__ref":"Education:{\"uuid\":\"59fce794-4b3c-4cf8-aae9-baa495b105f8\"}"}],"hiredAt":"2024-07-04T04:40:31.339Z","topics":["Algebra II","Geometry","Precalculus / Trigonometry","Calculus"
