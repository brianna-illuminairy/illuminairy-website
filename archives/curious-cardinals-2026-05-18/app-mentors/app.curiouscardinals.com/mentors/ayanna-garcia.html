xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"5bc902b6-8c79-48d1-9da3-4b1c36efc5c0\"}":{"__typename":"DeepDives","uuid":"5bc902b6-8c79-48d1-9da3-4b1c36efc5c0","content":"\u003cp\u003eAs a middle school and high school student, I kept a very full plate. I was involved in many of the opportunities my school offered. In high school, I took 11 AP courses, served as president of both the California Scholarship Federation and the National Honor Society, and earned medals in several Science Olympiad events. I also participated in a variety of volunteer activities, and I was the drum major for my high school’s marching band. I loved staying busy and challenging myself in different areas.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"754f4d20-a2d7-43f5-8abb-2cf2e712c7d2\"}":{"__typename":"DeepDives","uuid":"754f4d20-a2d7-43f5-8abb-2cf2e712c7d2","content":"\u003cp\u003eOne thing I am extremely proud of is adopting two local highways through Caltrans before I moved away for college. I organized monthly highway cleanups and named the adopted areas in memory of my two dogs who passed away, Casper and Charla. It meant a lot to me to keep my community clean while honoring them in a meaningful way.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"87e11f74-3f51-4b9a-aaab-191b803d1b79\"}":{"__typename":"DeepDives","uuid":"87e11f74-3f51-4b9a-aaab-191b803d1b79","content":"\u003cp\u003eSomething I think a lot of students struggle with is dealing with rejection or setbacks. I wish I had told my younger self that rejection is not the end of the world; it is simply redirection. I truly believe that failure is never permanent. It is a stepping stone in a much longer journey, and what matters most is picking yourself up and continuing forward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"36832f53-41b3-4401-b548-4810a281b645\"}":{"__typename":"DeepDives","uuid":"36832f53-41b3-4401-b548-4810a281b645","content":"\u003cp\u003eMy greatest role model and mentor is my older sister Alexa. She is two years older than I am and has always been someone I look up to. She has encouraged me to believe in myself, pushed me to reach my full potential in school and in my personal life, and supported me through every challenge. I truly would not be where I am today without her.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"5e5d08ed-aae1-4a18-8057-e6a821cdd482\"}":{"__typename":"School","uuid":"5e5d08ed-aae1-4a18-8057-e6a821cdd482","name":"San Dimas High School","city":"San Dimas","type":"HIGH","state":"California","country":"United States","zip":"91773"},"Education:{\"uuid\":\"0cf5b54f-cb75-4e3a-88f5-27aeaaf6d799\"}":{"__typename":"Education","uuid":"0cf5b54f-cb75-4e3a-88f5-27aeaaf6d799","school":{"__ref":"School:{\"uuid\":\"5e5d08ed-aae1-4a18-8057-e6a821cdd482\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"d3c0c2b6-568d-41c6-a046-12f2b9431cce\"}":{"__typename":"Education","uuid":"d3c0c2b6-568d-41c6-a046-12f2b9431cce","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Integrative Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"0ccc09b6-6bf9-4dbc-aab2-481e674bdce5\"}":{"__typename":"MentorPublicProfile","uuid":"0ccc09b6-6bf9-4dbc-aab2-481e674bdce5","displayName":"Ayanna  G.","slug":"ayanna-garcia","biography":"\u003cp\u003eHello! My name is Ayanna, and I’m a sophomore at UC Berkeley majoring in Integrative Biology with a human health emphasis on the pre-dental track!\u0026nbsp; I’m\u0026nbsp; from Southern California, and now I’m studying in the Bay Area, where I divide my time between academics, mentorship, creative projects, and community service.\u003c/p\u003e\u003cp\u003eMuch of my mentoring experience comes from my work with the Hispanic Scholarship Fund’s Youth Leadership Institute, a national program that selects students from all 50 states and U.S. territories. As a mentor, I support a small group of high school juniors through both virtual college-readiness sessions and an intensive week-long in-person program on a college campus. During this time, I help students understand majors, develop strong personal statements, explore college life, and build the skills they need to navigate the admissions process with confidence.\u003c/p\u003e\u003cp\u003eThroughout the year, I continue working closely with my mentees by reading essays, providing detailed feedback, helping them navigate admissions portals, and guiding their academic planning. This experience has shown me how powerful clear explanations, steady encouragement, and personalized support can be during a major academic transition.\u003c/p\u003e\u003cp\u003eBefore Berkeley, I spent my middle and high school years deeply involved in Science Olympiad and earned multiple medals across different STEM events. Now, I enjoy helping the next generation of students, both middle and high school, prepare for their own competitions. Breaking down event descriptions, troubleshooting builds, and helping students develop confidence-building study strategies has become a meaningful part of my work with the Science Olympiad programs at my former middle school and high school. It feels especially rewarding to give back to the schools and community that helped shape my own academic journey.\u003c/p\u003e\u003cp\u003eAs a pre-dental student, I am also involved in America’s Toothfairy at Berkeley, where we create and lead oral-health Teach-In events at elementary schools and assisted-living facilities. Through these programs, along with my experience working as a dental assistant and shadowing dentists during academic breaks, I have learned how to communicate scientific concepts clearly and make learning approachable for students of all ages.\u003c/p\u003e\u003cp\u003eOutside of academics, music is a large part of my life. I have been playing various instruments as far as I can remember and currently play tenor saxophone in the Cal Marching Band. I also enjoy any\u0026nbsp; hands-on creative projects like sewing, I even sew some of my own clothes!\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs a mentor, I am supportive, reliable, and committed to helping students explore their interests, build meaningful projects, and reach their goals. I look forward to supporting future students as they discover what inspires them and take their next steps with confidence!\u003c/p\u003e","teachingVideoPlaybackId":"AtAXUfKkY00NmwdvY3GmWfTKAEXxBXRmgZAV6oOwivrY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Integrative Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5bc902b6-8c79-48d1-9da3-4b1c36efc5c0\"}"},{"__ref":"DeepDives:{\"uuid\":\"754f4d20-a2d7-43f5-8abb-2cf2e712c7d2\"}"},{"__ref":"DeepDives:{\"uuid\":\"87e11f74-3f51-4b9a-aaab-191b803d1b79\"}"},{"__ref":"DeepDives:{\"uuid\":\"36832f53-41b3-4401-b548-4810a281b645\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a6339c08-2808-4756-8914-ad887c4676fd/-/preview/-/format/jpg/","https://ucarecdn.com/d30c0aef-83ef-41f4-9bfa-a36673bff571/-/preview/-/format/jpg/","https://ucarecdn.com/30351dc7-634f-4118-82b2-beb91f5ad484/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0cf5b54f-cb75-4e3a-88f5-27aeaaf6d799\"}"},{"__ref":"Education:{\"uuid\":\"d3c0c2b6-568d-41c6-a046-12f2b9431cce\"}"}],"hiredAt":"2025-11-23T22:03:08.676Z","topics":["Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","Statistics","6-8 Grade Science","Biology","Chemistry","Academic Coaching","College Essay Writing","Executive Function","Music","Medicine / Health","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"ayanna-garcia\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0ccc09b6-6bf9-4dbc-aab2-481e674bdce5\"}"}}},"_sentryTraceData":"053b8be30eb24a26b84144d0ff3b6065-a4a8c84a5ba65236-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=053b8be30eb2
