xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c2636719-8ada-415a-b1e2-5b1a463e33d6\"}":{"__typename":"Favorites","uuid":"c2636719-8ada-415a-b1e2-5b1a463e33d6","photoUrl":"https://ucarecdn.com/4673e47d-ce40-4c7f-b58c-f080d6979d47/","title":"Alexa Demie","type":"ACTOR"},"Favorites:{\"uuid\":\"721045d7-ad19-4adb-a724-2b3942638af0\"}":{"__typename":"Favorites","uuid":"721045d7-ad19-4adb-a724-2b3942638af0","photoUrl":"https://ucarecdn.com/4673e47d-ce40-4c7f-b58c-f080d6979d47/","title":"Femme (2023)","type":"MOVIE"},"Favorites:{\"uuid\":\"177fb585-26db-4e1c-a248-73ee21a07053\"}":{"__typename":"Favorites","uuid":"177fb585-26db-4e1c-a248-73ee21a07053","photoUrl":"https://ucarecdn.com/4673e47d-ce40-4c7f-b58c-f080d6979d47/","title":"Rennaisance - Beyonce","type":"ALBUM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"95fd26d5-3339-4551-810c-21ebc72ed3fb\"}":{"__typename":"DeepDives","uuid":"95fd26d5-3339-4551-810c-21ebc72ed3fb","content":"\u003cp\u003eI understand that the current situation might be overwhelming, and it's common to feel confused by everything happening around you. There will be times when you don't quite achieve the goals you've set for yourself. Despite these challenges, it's crucial to remember the importance of your happiness. Embrace and celebrate every success you have, no matter how small it may seem. At the same time, try not to let your failures weigh you down too much. It's all part of the learning and growing process. Remember, every experience, good or bad, is a stepping stone towards your future. Keep in mind that everything will eventually fall into place. So, stay positive, keep pushing forward, and believe that things will work out for the best in the end.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"a314e1dd-dad8-4673-b3d1-7dcd6390129a\"}":{"__typename":"Education","uuid":"a314e1dd-dad8-4673-b3d1-7dcd6390129a","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Mathematical and Computational Science","degree":"Bachelors of Science "},"School:{\"uuid\":\"bfb6a57f-e51f-469b-941a-419dda495833\"}":{"__typename":"School","uuid":"bfb6a57f-e51f-469b-941a-419dda495833","name":"St. Stanislaus College","city":"Georgetown","type":"HIGH","state":"Demerara-Mahaica","country":"Guyana","zip":"000000"},"Education:{\"uuid\":\"b2e32c5e-29c3-4ec3-ab6a-0bec6dc80a4c\"}":{"__typename":"Education","uuid":"b2e32c5e-29c3-4ec3-ab6a-0bec6dc80a4c","school":{"__ref":"School:{\"uuid\":\"bfb6a57f-e51f-469b-941a-419dda495833\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"1f39bb25-1807-4220-9dfa-ae1381e31ef2\"}":{"__typename":"MentorPublicProfile","uuid":"1f39bb25-1807-4220-9dfa-ae1381e31ef2","displayName":"Sherlock L.","slug":"sherlock-langevine","biography":"\u003cp\u003eHi! My name is \u003cstrong\u003eSherlock\u003c/strong\u003e and I'm a Junior at Stanford University, majoring in \u003cstrong\u003eMathematical and Computational Science\u003c/strong\u003e, with a minor in \u003cstrong\u003eFeminist, Gender, and Sexuality Studies\u003c/strong\u003e. I really love these two areas of study because I get to explore the intersection of computational math and \u003cstrong\u003ehuman rights\u003c/strong\u003e. Leveraging this unique academic interest has landed me amongst the 2023 \u003cstrong\u003eYale Law School Launchpad Scholar\u003c/strong\u003e and the \u003cstrong\u003eStanford Constitutional Law Center Undergraduate Fellows\u003c/strong\u003e. \u003cbr\u003e\u003cbr\u003e\u003cstrong\u003eI aspire to attend Law School \u003c/strong\u003ewhen I'm finished with my undergraduate degree, after which I hope to become a Human Rights Attorney. I was born in Antigua \u0026amp; Barbuda and given my \u003cstrong\u003eCaribbean background\u003c/strong\u003e I want to serve as a judge amongst the judges in the Caribbean Court of Justice, leading the charge in \u003cstrong\u003ereforming the outdated colonial-era\u003c/strong\u003e \u003cstrong\u003elegislations\u003c/strong\u003e that still plagues most Caribbean nations. My long-term goals are to usher in a new era of justice and equality, aligning the legal framework of Caribbean nations with contemporary human rights standards.\u003cbr\u003e\u003cbr\u003eOutside of all of that pre-law work, \u003cstrong\u003eI love watching a good movie\u003c/strong\u003e. If I had my own way, I would've spend my last summer catching up on the marvel films and Netflix series I missed throughout the school year. But instead, I had the amazing opportunity to do \u003cstrong\u003emarine biology research\u003c/strong\u003e with a non-profit group in the Caribbean. I helped to \u003cstrong\u003edevelop an algorithm\u003c/strong\u003e that does a comparative analysis of coral photomosaics using cool \u003cstrong\u003ecomputer-vision tech\u003c/strong\u003e. So I spent a lot of days either in the beach-front lab doing meetings or in my room coding and writing documentations for my code.\u003cbr\u003e\u003cbr\u003eFun-fact, I've been an\u003cstrong\u003e international student\u003c/strong\u003e since the 3rd grade and have travelled to 10 different countries in my life. You can \u003cstrong\u003eask me anything\u003c/strong\u003e from where's my favourite Bistro in Barbados to my thoughts on the goth aesthetic of Germany's night life. Please feel free to \u003cstrong\u003echat with me about anything\u003c/strong\u003e. I love talking about anything and everything so it's no surprise that my favourite quote is one from Basketball player Shubazz Muhammed, when he said:\u003cbr\u003e\u003cbr\u003e\u003cstrong\u003e\u003cem\u003e\"Closed mouths don't get fed, and I'm gonna eat every time I get on the court.\"\u003c/em\u003e\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlaybackId":"7yy02Sb9pGnn00W2hoaBiPhbiFhNUycircrVfGBQABOGQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI recently was selected as a Yale Law School Launchpad Scholar and I'm extremely excited to be able to apply to Law with the incredible support from the team at the Yale Law School. I'm extremely proud because there was a \u0026lt;5% acceptance rate and I believe that it's an early indication that getting into law school is indeed within reach even as a seemingly average STEM major.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c2636719-8ada-415a-b1e2-5b1a463e33d6\"}"},{"__ref":"Favorites:{\"uuid\":\"721045d7-ad19-4adb-a724-2b3942638af0\"}"},{"__ref":"Favorites:{\"uuid\":\"177fb585-26db-4e1c-a248-73ee21a07053\"}"}],"causesSupported":[],"major":"Mathematical and Computational Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"95fd26d5-3339-4551-810c-21ebc72ed3fb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/087a1643-444e-4b1d-a962-471635c7598e/-/preview/-/format/jpg/","https://ucarecdn.com/72909ab9-b89d-4a71-bd8b-206b10deb63e/-/preview/-/format/jpg/","https://ucarecdn.com/a41a8100-29d2-4f12-a722-4adcea272727/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a314e1dd-dad8-4673-b3d1-7dcd6390129a\"}"},{"__ref":"Education:{\"uu
