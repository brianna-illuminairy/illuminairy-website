js" defer=""></script><script src="../_next/static/chunks/37a763b4-c9374818b3069427.js" defer=""></script><script src="../_next/static/chunks/7714-6d52a2553c8a5eed.js" defer=""></script><script src="../_next/static/chunks/3201-378bf126fe171981.js" defer=""></script><script src="../_next/static/chunks/7035-e98def35d43d2917.js" defer=""></script><script src="../_next/static/chunks/857-9fc7730f1deaab0e.js" defer=""></script><script src="../_next/static/chunks/2812-370ded79da1397af.js" defer=""></script><script src="../_next/static/chunks/6286-f428173603f98a04.js" defer=""></script><script src="../_next/static/chunks/5675-2bf9162bca91fd5c.js" defer=""></script><script src="../_next/static/chunks/4243-774be750685d5693.js" defer=""></script><script src="../_next/static/chunks/8642-ce90555021d0848b.js" defer=""></script><script src="../_next/static/chunks/5295-7db305c26288d42d.js" defer=""></script><script src="../_next/static/chunks/7197-c3b7608a62aa25a3.js" defer=""></script><script src="../_next/static/chunks/1095-980da7b1cf5dadac.js" defer=""></script><script src="../_next/static/chunks/2825-a51bc2c91373efc0.js" defer=""></script><script src="../_next/static/chunks/7601-ec25c09efb471b9d.js" defer=""></script><script src="../_next/static/chunks/4171-1ffcebd256c44857.js" defer=""></script><script src="../_next/static/chunks/1363-e8ed5b32b55f0f97.js" defer=""></script><script src="../_next/static/chunks/4845-c132d18b64012391.js" defer=""></script><script src="../_next/static/chunks/2294-21839965fb19ff3d.js" defer=""></script><script src="../_next/static/chunks/8874-70911ab30cc2c205.js" defer=""></script><script src="../_next/static/chunks/2808-81f18af0d2b8da9e.js" defer=""></script><script src="../_next/static/chunks/6536-9015b99d7a17c17c.js" defer=""></script><script src="../_next/static/chunks/9145-c8076535f85f2cd6.js" defer=""></script><script src="../_next/static/chunks/pages/mentors/[slug]-114a74e778bf2bc0.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"054ae7ec-c1d4-40ee-a11a-2ce584c540cd\"}":{"__typename":"Favorites","uuid":"054ae7ec-c1d4-40ee-a11a-2ce584c540cd","photoUrl":"https://ucarecdn.com/249601c7-0b8d-4190-874a-220b932dd0a3/","title":"Green Bay Packers","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"e036fe51-9ed8-4758-b26f-580d10d197d1\"}":{"__typename":"Favorites","uuid":"e036fe51-9ed8-4758-b26f-580d10d197d1","photoUrl":"https://ucarecdn.com/5b5b9c16-26bc-4f61-843b-f971e5808b94/","title":"Charlotte, NC","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6f34979d-8991-405e-99a8-d5e41175ee6d\"}":{"__typename":"DeepDives","uuid":"6f34979d-8991-405e-99a8-d5e41175ee6d","content":"\u003cp\u003eMentorship matters to me because a great project often starts as a vague interest. A student might know they like biology, climate, medicine, technology, business, writing, or design, but not know how to turn that interest into something real. I think mentorship is valuable because it helps students move from “I’m interested in this” to “I built something, researched something, presented something, or created something I’m proud of.”\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe best mentors I have had helped me ask better questions, find direction, and build confidence when I was still figuring things out. That is the kind of mentor I try to be. I want students to feel comfortable exploring ambitious ideas, even if they do not know exactly where to start.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor passion projects, I believe the process matters as much as the final product. Students learn how to research, organize their thoughts, test ideas, communicate clearly, and keep going when a project becomes challenging. Those skills are useful far beyond one project. My goal is to help students build something meaningful while also becoming more independent, curious, and confident thinkers.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"3b93deba-ccce-4b8a-868f-8df8c03d93df\"}":{"__typename":"DeepDives","uuid":"3b93deba-ccce-4b8a-868f-8df8c03d93df","content":"\u003cp\u003eOne passion project I'm working on is SplicR, a platform designed to make CRISPR screen analysis more accessible and reliable for researchers. CRISPR screens help scientists understand which genes matter in disease, drug response, or cell survival, but the data can be difficult to process and interpret. A major problem is that researchers can spend months on an experiment only to later discover that technical issues affected their results.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSplicR is built around a simple idea: researchers should be able to upload raw sequencing files and receive clear quality control, analysis, visualizations, and reports. The project combines biology, data science, software, research, and communication, which are all areas I enjoy.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I value most about this project is that it started with a real problem. That is something I try to help students understand when building their own passion projects. A strong project does not have to be huge or overly complicated. It should begin with a question, problem, or curiosity that genuinely matters to the student. From there, we can shape it into something concrete, such as a research paper, website, data analysis, prototype, article series, presentation, nonprofit initiative, or independent investigation.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9c6103b7-ed1c-41cf-bbd1-91942b0d09c3\"}":{"__typename":"DeepDives","uuid":"9c6103b7-ed1c-41cf-bbd1-91942b0d09c3","content":"\u003cp\u003eI would tell my middle or high school self to start creating earlier. When you are younger, it is easy to think you need permission, a perfect plan, or advanced knowledge before starting something meaningful. In reality, some of the best projects begin with simple questions: Why does this problem exist? How could this be improved? What do I want to understand better? Who could benefit from this idea?\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI would also tell myself not to worry so much about whether an idea sounds impressive at first. A project becomes impressive when you put real thought, effort, and care into it. The first version might be messy, but that is normal. You learn by refining your question, finding better sources, building prototypes, asking for feedback, and improving over time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMost importantly, I would tell myself to follow genuine curiosity. Students often feel pressure to do activities just because they sound good for college. I think the strongest projects come from real interest. When a student actually cares about the topic, their work becomes more creative, personal, and meaningful.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"4ba03f4f-31b8-419a-81f6-e554a107a793\"}":{"__typename":"DeepDives","uuid":"4ba03f4f-31b8-419a-81f6-e554a107a793","content":"\u003cp\u003eI choose mentorship because I enjoy helping students turn ideas into something real. A lot of students have interests that could become amazing projects, but they do not always know how to take the first step. They may have too many ideas, an idea that feels too broad, or a goal that feels intimidating. I like helping students bring structure to that process.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy own interests span biology, engineering, agriculture, climate, technology, entrepreneurship, and public service, so I know what it feels like to have many different directions you could go in. Mentorship lets me help students connect their interests, narrow their focus, and build something they are proud to share.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI especially enjoy passion project mentorship because it is not just about getting the right answer. It is about helping a student develop their own voice, judgment, and confidence. By the end of a project, I want students to feel like they did not just complete an assignment. I want them to feel like they created something that reflects who they are, what they care about, and how they think.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"12357c73-fe08-4459-9c56-33bf3f3ccff8\"}":{"__typename":"School","uuid":"12357c73-fe08-4459-9c56-33bf3f3ccff8","name":"North Carolina School of Science and Mathematics - Durham","city":"Durham","type":"HIGH","state":"North Carolina","country":"United States","zip":"27705"},"Education:{\"uuid\":\"b777764c-66e9-4c1f-90bd-e39e17ded25d\"}":{"__typename":"Education","uuid":"b777764c-66e9-4c1f-90bd-e39e17ded25d","school":{"__ref":"School:{\"uuid\":\"12357c73-fe08-4459-9c56-33bf3f3ccff8\"}"},"startYear":"2023","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"dd6e32cc-efc8-46d8-9b79-c2bda958d10f\"}":{"__typename":"Education","uuid":"dd6e32cc-efc8-46d8-9b79-c2bda958d10f","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Biological Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"71871afe-d99a-4e34-9aa9-f7eef4826ac2\"}":{"__typename":"MentorPublicProfile","uuid":"71871afe-d99a-4e34-9aa9-f7eef4826ac2","displayName":"Pranav M.","slug":"pranav-mettu-1","biography":"\u003cp\u003eHi! I’m Pranav, a Biological Engineering student at Cornell University. I’m interested in the intersection of biology, engineering, agriculture, climate, and technology, especially in how science can be used to solve real-world problems. My academic path has taken me through biology, chemistry, physics, calculus, engineering, lab research, and data analysis, so I understand how challenging STEM classes can be when concepts move quickly. I also know how rewarding they become once the ideas start to connect.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA lot of my work is driven by curiosity and service. Before Cornell, I served as North Carolina 4-H State Vice President, where I helped plan statewide youth leadership programs, organized workshops, and worked with students on public speaking, food insecurity, and community engagement. I've also conducted and presented international research through the World Food Prize Foundation, where I was researching a new strain of hybrid rice. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThose experiences have taught me how much good mentorship matters. A strong mentor does more than explain an answer; they help a student build confidence, ask better questions, and see themselves as capable of doing hard things.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Cornell, I’ve continued exploring biology, engineering, and sustainability through coursework, lab work, and independent projects. Right now, I'm developing software for CRISPR analysis automation, leveraging Python libraries and screening tools. I’m especially excited by projects that combine scientific thinking with practical impact, whether that means analyzing data, designing experiments, or thinking about how new technologies can improve agriculture and human health.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, my goal is to make developing projects and learning feel less intimidating and more approachable. I'm excited to support students in STEM subjects, research thinking, writing, leadership, college preparation, and project development. I’m extremely patient, adaptable, and very comfortable meeting students where they are, whether they need help catching up, want to go deeper, or are trying to turn an interest into a meaningful project.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I enjoy working on entrepreneurial ideas, reading about emerging technologies, hiking, and finding ways to connect science with public service. I hope students who work with me leave feeling more confident, more curious, and more prepared to take ownership of their learning.\u003c/p\u003e","teachingVideoPlaybackId":"wzj00Wue9a1Y2Ug02IoIrq100XUlqFlltt3pYkeOdLb2200","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne achievement I'm really proud of is the work I did through North Carolina 4-H, especially helping grow participation, community involvement, and agricultural awareness across the state.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs North Carolina 4-H State Vice President, I had the opportunity to work with students, county programs, adult leaders, extension staff, and community partners. A major goal for me was helping more students see 4-H as a place where they could belong, lead, and explore interests that mattered to them. For some students, that meant agriculture and livestock. For others, it meant public speaking, STEM, food systems, community service, environmental issues, or leadership. I wanted students to understand that 4-H was not just one type of activity. It was a platform for turning curiosity into action. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eA lot of the work involved being a self-starter. I learned how to reach out to the right people, build relationships, ask thoughtful questions, and follow through. Whether I was helping organize youth programs, encouraging more involvement from local communities, or speaking about agriculture and food systems, I realized that good leadership is often about doing the behind-the-scenes work that makes opportunities possible for others.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am especially proud of helping expand agricultural awareness. Agriculture affects everyone, but many students do not always see how connected it is to science, technology, health, business, climate, and everyday life. Through 4-H, I worked to make those connections clearer and more exciting. I wanted students to see agriculture not as something distant or old-fashioned, but as a field full of innovation, real-world problems, and opportunities for impact.\u003c/p\u003e\u003cp\u003eThat experience shaped the way I mentor today. It taught me that students often have much more potential than they realize, but they need someone to help them find direction, connect with resources, and believe their ideas are worth pursuing. I am proud of the hard work I put into growing 4-H because it was not just about numbers or titles. It was about helping more young people become confident leaders, community members, and problem-solvers.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"054ae7ec-c1d4-40ee-a11a-2ce584c540cd\"}"},{"__ref":"Favorites:{\"uuid\":\"e036fe51-9ed8-4758-b26f-580d10d197d1\"}"}],"causesSupported":[],"major":"Biological Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6f34979d-8991-405e-99a8-d5e41175ee6d\"}"},{"__ref":"DeepDives:{\"uuid\":\"3b93deba-ccce-4b8a-868f-8df8c03d93df\"}"},{"__ref":"DeepDives:{\"uuid\":\"9c6103b7-ed1c-41cf-bbd1-91942b0d09c3\"}"},{"__ref":"DeepDives:{\"uuid\":\"4ba03f4f-31b8-419a-81f6-e554a107a793\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/9144ebb6-ec7f-4504-98ca-1b571a33ad1b/-/preview/-/format/jpg/","https://ucarecdn.com/734776c8-dbd6-4952-afdf-f7b6e49f177a/-/preview/-/format/jpg/","https://ucarecdn.com/a4689cb6-0e03-495b-aa6c-28b4614a037c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b777764c-66e9-4c1f-90bd-e39e17ded25d\"}"},{"__ref":"Education:{\"uuid\":\"dd6e32cc-efc8-46d8-9b79-c2bda958d10f\"}"}],"hiredAt":"2026-05-11T03:48:11.491Z","topics":[],"communityBadges":["https://ucarecdn.com/f2327c8d-7e73-4188-aa70-5707b3724973/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"pranav-mettu-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"71871afe-d99a-4e34-9aa9-f7eef4826ac2\"}"}}},"_sentryTraceData":"7efc33d96d2e4549964777def340b5ae-bd4af36aaf6ea084-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=7efc33d96d2e4549964777def340b5ae,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"pranav-mettu-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFa
