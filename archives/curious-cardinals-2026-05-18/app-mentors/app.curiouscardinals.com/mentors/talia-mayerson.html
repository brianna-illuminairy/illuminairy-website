xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"25beff52-f770-47f5-8216-a82d6ea4722e\"}":{"__typename":"Favorites","uuid":"25beff52-f770-47f5-8216-a82d6ea4722e","photoUrl":"https://ucarecdn.com/d917298c-3bfa-4774-abe6-f332154963d9/","title":"Amsterdam","type":"CITY"},"Favorites:{\"uuid\":\"a354fa55-980f-4d24-aa45-b879da866fe4\"}":{"__typename":"Favorites","uuid":"a354fa55-980f-4d24-aa45-b879da866fe4","photoUrl":"https://ucarecdn.com/ab2df0cd-ef6b-4a64-841f-ae61f14f6ef2/","title":"Titanic Rising","type":"ALBUM"},"Favorites:{\"uuid\":\"3d8e3e53-6630-4dae-95ec-2fbcf1e55e17\"}":{"__typename":"Favorites","uuid":"3d8e3e53-6630-4dae-95ec-2fbcf1e55e17","photoUrl":"https://ucarecdn.com/a81da7d0-36c8-4b54-8ae2-e18e29f9c50f/","title":"Christina Quarles","type":"ARTIST"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"fbcf608c-30c4-4c46-92dc-60931e0d40e4\"}":{"__typename":"DeepDives","uuid":"fbcf608c-30c4-4c46-92dc-60931e0d40e4","content":"\u003cp\u003eRecently, I’ve been really enjoying learning  fun facts about human pre-history. I realized there are a few well-researched YouTube channels that teach about ancestors to the Homo Sapien (us!), and I’ve been going through videos — one species at a time — to learn about our history in an engaging way. Like, did you know that we have an ancestor that used to live only on one island and stood  less than 4ft tall? Look up \u003cem\u003ehomo floresiensis\u003c/em\u003e!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c1148212-7775-4e68-a24a-82bc2ba89490\"}":{"__typename":"DeepDives","uuid":"c1148212-7775-4e68-a24a-82bc2ba89490","content":"\u003cp\u003eIt took me a little while to choose my major because I was torn between English Literature, Cognitive Science, Neuroscience, and Psychology. These were all disciplines that I enjoyed engaging with a lot, but I realized that the one thing uniting them was my interest in thinking about how/why people behaved in the way they do. I chose to major in Psychology and minor in Creative Writing because studying these topics preserved my core interest, while offering opportunity to explore and be creative. At the same time, I realized I could still take classes in Cognitive Science and Philosophy (a new interest!), and do research in Neuroscience, so I was able to continue exploring different interests and narrow down what path I wanted to take post-grad.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"e80ae92f-9ac2-4832-8fe9-cb57be5ce4a3\"}":{"__typename":"DeepDives","uuid":"e80ae92f-9ac2-4832-8fe9-cb57be5ce4a3","content":"\u003cp\u003eI’m especially proud of publishing my Master’s dissertation in a peer-reviewed journal. Because pre-doctoral research is not always considered rigorous enough for publication, I’m proud that I was able to design a novel study that met the journal’s standards. Publishing scientific work is particularly meaningful to me because it reflects sustained effort over a long period of time, so seeing the final product felt like a true culmination! If you're interested, feel free to check out the publically available article here: https://acamh.onlinelibrary.wiley.com/doi/10.1002/jcv2.70041. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"217e87e7-82af-4eaa-a5a0-eaa05b733938\"}":{"__typename":"DeepDives","uuid":"217e87e7-82af-4eaa-a5a0-eaa05b733938","content":"\u003cp\u003eI think I would tell myself that 99.9% of the things I was worrying about never came to fruition. Especially at the end of high school, I was very anxious about the college process and the uncertainty ahead of me. Since then, I've really tried to embrace feelings of uncertainty about the future because -- as I found out -- ambiguity and uncertainty never go away! In retrospect, instead of worrying, I could have spent more of my time hanging out with friends, family, or reading a good book. But, hey, I learned a lot about myself by going through that experience of anxiety, so no regrets!!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"881d433c-05ce-48a2-8a9c-c6d6636125ca\"}":{"__typename":"School","uuid":"881d433c-05ce-48a2-8a9c-c6d6636125ca","name":"Vassar College","city":"Poughkeepsie","type":"HIGH","state":"New York","country":"United States","zip":"12603"},"Education:{\"uuid\":\"100bbd1e-0ee6-481b-9f21-181a6f875f40\"}":{"__typename":"Education","uuid":"100bbd1e-0ee6-481b-9f21-181a6f875f40","school":{"__ref":"School:{\"uuid\":\"881d433c-05ce-48a2-8a9c-c6d6636125ca\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518\"}":{"__typename":"School","uuid":"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518","name":"University of Oxford","city":"Oxford","type":"COLLEGE","state":"England","country":"United Kingdom","zip":"OX1 2JD"},"Education:{\"uuid\":\"d19bdaac-e81b-473d-95e1-a478ce25b68b\"}":{"__typename":"Education","uuid":"d19bdaac-e81b-473d-95e1-a478ce25b68b","school":{"__ref":"School:{\"uuid\":\"3f9eb9cc-d2c8-41a9-bf7c-87c640a90518\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2023","major":"Master of Science in Psychological Research","degree":null},"MentorPublicProfile:{\"uuid\":\"0ebda327-3338-451d-9c94-d3bed2331ff3\"}":{"__typename":"MentorPublicProfile","uuid":"0ebda327-3338-451d-9c94-d3bed2331ff3","displayName":"Talia M.","slug":"talia-mayerson","biography":"\u003cp\u003eI’m a doctoral student in clinical psychology, studying the psychological processes that shape mental health across different conditions in young people. My research focuses on experiences like shame and emotion regulation and the way in which they influence overlapping mental health conditions like OCD, anxiety, and depression in teenagers. Before beginning my doctorate, I completed a Master’s in Psychological Research at the University of Oxford and worked in clinical neuroscience research at Yale School of Medicine, studying addiction and brain functioning in marginalized communities. Throughout my experience in academia, I’ve been fortunate enough to be able to translate my work into several peer-reviewed publications and present my research at conferences.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAlongside my research, mentorship has been an important aspect of my academic journey, and my experiences as a student have proven just as meaningful as my experiences as a mentor. I’ve been fortunate to have mentors who have shaped how I approach my work, and helped me build confidence in pursuing my goal to become a clinical psychologist (even when I doubted myself along the way!). This is a big part of why I chose (and choose) to mentor peers and students throughout college and post-grad. For example, during college, I served as a senior editor for an undergraduate neuroscience journal, where I mentored student writers through the full editorial process and helped them translate complex research into clear, accessible writing. More recently, at Oxford, I led a seminar for high schoolers on psychological research methods as a course in the Annual Oxford Neuroscience Program. And, last year while applying to doctoral programs, I decided to take on a new type of teaching role for me: vocal director for a local musical theater production. This most recent opportunity for mentorship was both really fun, and a great reminder that sometimes being a mentor can be as much about \u003cem\u003elearning\u003c/em\u003e as it is about teaching!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNo matter what area I am mentoring in, my goal is to focus on helping students clarify their thinking, structure their ideas, and approach challenging work with confidence. \u003cstrong\u003eI work with students on writing, reading, and science-based projects, including STEM and mental health-related topics. I also work with students specifically on executive functioning (EF) skills, including organization, planning, time management, and breaking down larger tasks into concrete, manageable steps. \u003c/strong\u003eLearning about how to support EF is a key part of my training as a doctoral student in youth clinical psychology, and I am always on the lookout for new and evidence-based learning tools to improve EF in neurodiverse young people. I've also found that building and maintaining these skills can really make a meaningful difference in how I approach my own work and responsibilities day-to-day, especially when I am feeling stuck or overwhelmed.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not mentoring students or completing academic/clinical coursework for my doctorate, I’ve been really enjoying exploring New York City since moving to Manhattan to start grad school. Recently, I’ve been challenging myself by choosing a destination in the city and trying to find my way there without maps. I also enjoy playing piano to unwind, and love to listen to podcasts about new topics in social psychology, neuroscience, or mental health. I find that building in unstructured time (with and \u003cem\u003ewithout\u003c/em\u003e tech) in my schedule to think and explore is essential to maintain a healthy mind. This is something I encourage with my students as well; balancing TikTok time with a walk in the sun can really do wonders!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eIf you’re looking for a doctoral-level mentor to patiently support you/your child through academic work related to writing, reading, or STEM research — or to focus specifically on executive functioning skills like organization, planning, and time management — I help students to stay on track, manage complex assignments, and develop the tools to independently create strong work they genuinely care about!\u003c/strong\u003e\u003c/p\u003e","teachingVideoPlaybackId":"FzNWWnbl011SN4gBJn00UsnIYYdVmiUykSyrazdyR5cY8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"25beff52-f770-47f5-8216-a82d6ea4722e\"}"},{"__ref":"Favorites:{\"uuid\":\"a354fa55-980f-4d24-aa45-b879da866fe4\"}"},{"__ref":"Favorites:{\"uuid\":\"3d8e3e53-6630-4dae-95ec-2fbcf1e55e17\"}"}],"causesSupported":[],"major":"Master of Science in Psychological Research","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"fbcf608c-30c4-4c46-92dc-60931e0d40e4\"}"},{"__ref":"DeepDives:{\"uuid\":\"c1148212-7775-4e68-a24a-82bc2ba89490\"}"},{"__ref":"DeepDives:{\"uuid\":\"e80ae92f-9ac2-4832-8fe9-cb57be5ce4a3\"}"},{"__ref":"DeepDives:{\"uuid\":\"217e87e7-82af-4eaa-a5a0-eaa05b733938\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/05e96905-d1a6-4356-babe-c42bdae048c1/-/preview/-/format/jpg/","https://ucarecdn.com/9938be55-6494-4c35-b030-476d448dd6ca/-/preview/-/format/jpg/","https://ucarecdn.com/6d3b5dc3-df6e-4da9-ac78-36afaf726dd4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"100bbd1e-0ee6-481b-9f21-181a6f875f40\"}"},{"__ref":"Education:{\"uuid\":\"d19bdaac-e81b-473d-95e1-a478ce25b68b\"}"}],"hiredAt":"2026-03-29T18:11:07.940Z","topics":["6-8 Grade Science","Writing","Academic Coaching","Executive Function","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"talia-mayerson\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"0ebda327-3338-451d-9c94-d3bed2331ff3\"}"}}},"_sentryTraceData":"2280960a589b40d0a06661b07ba9c830-ba432f1252da0bd6-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2280960a589b40d0a06661b07ba9c830,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"talia-mayerson"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:
