xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cca5e765-ad5a-48bc-af63-361460a6cd67\"}":{"__typename":"Favorites","uuid":"cca5e765-ad5a-48bc-af63-361460a6cd67","photoUrl":"https://ucarecdn.com/a0f6de46-3b58-4714-a521-3e8913fccebd/","title":"A Court of Mist and Fury - Sarah J. Maas","type":"BOOK"},"Favorites:{\"uuid\":\"94cd2302-749c-48f4-99f5-fe0a59364f25\"}":{"__typename":"Favorites","uuid":"94cd2302-749c-48f4-99f5-fe0a59364f25","photoUrl":"https://ucarecdn.com/590a3859-429e-4cb8-86d6-4167e341f4df/","title":"Boston, MA","type":"CITY"},"Favorites:{\"uuid\":\"5619fa9d-a7fd-4eb3-be8d-e15f998411c1\"}":{"__typename":"Favorites","uuid":"5619fa9d-a7fd-4eb3-be8d-e15f998411c1","photoUrl":"https://ucarecdn.com/9c92f541-9a0a-404b-95ac-15f4b8cf1af2/","title":"Reflections - The Neighbourhood","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"5b1c0913-7735-4682-9fc4-d7915da60f27\"}":{"__typename":"DeepDives","uuid":"5b1c0913-7735-4682-9fc4-d7915da60f27","content":"\u003cp\u003eBe yourself and trust your own path. In middle and high school, it’s easy to fall into the trap of following what everyone else is doing, whether it’s choosing classes, joining activities, or even shaping your goals based on friends. But the most important lesson I’ve learned is that you don’t have to be a follower. Do what excites you, make decisions that align with your passions, and pursue the opportunities that feel right for your growth. If someone tells you “no,” and you’re truly passionate about something, don’t give up! Instead, look for creative ways to make it happen.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6779b5b2-7c22-4978-81e3-7c71d2622797\"}":{"__typename":"DeepDives","uuid":"6779b5b2-7c22-4978-81e3-7c71d2622797","content":"\u003cp\u003eI chose biomedical engineering because it combines the two subjects I’ve always loved most: math and science. What excites me about the field is how diverse it is, bringing together physics, biology, computer science, and problem-solving into one major. Of course, there are parts that challenge me (like electrical circuits or coding), but there are also parts I excel at, like biology, chemistry, design, applying engineering to real-world problems. That balance of strengths and challenges keeps me engaged and growing. Most importantly, biomedical engineering allows me to use my creativity and problem-solving skills to make an impact in medicine. Whether it’s developing new tools, improving treatments, or simply finding innovative ways to help people, I love that this major connects engineering directly to improving lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"f09e24e3-8e51-41fb-b69b-a774f29c3015\"}":{"__typename":"DeepDives","uuid":"f09e24e3-8e51-41fb-b69b-a774f29c3015","content":"\u003cp\u003eIn middle school, I was extremely shy and often struggled with social anxiety. I rarely spoke up in class and mostly kept to myself, focusing on my studies. By high school, though, I really came out of my shell. I became more confident socially, built genuine friendships, and even grew into a leader in the classroom. I loved staying busy, whether it was through sports, extracurriculars, or spending time with friends—and I learned how to balance a full life outside of school while still excelling academically. Looking back, I’d describe myself as a well-rounded student who valued both learning and community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"13d2bb48-f2a5-4300-ab2f-ab95c79afe8c\"}":{"__typename":"DeepDives","uuid":"13d2bb48-f2a5-4300-ab2f-ab95c79afe8c","content":"\u003cp\u003eI love keeping busy, and I tend to go through “phases” where I pick up a new hobby each month. Some have been short-lived—like crocheting, yoga, or spikeball—but others stuck. For example, last month I got really into pickleball and played almost every day! The hobbies I’ve kept up with consistently are running, cooking (I’m a pescatarian and salmon is my specialty), and reading. I especially love romantic-fantasy novels and have read most of the popular ones. I also highly value social time with friends and family. Maintaining these relationships is something that is very important to me. And when I want to relax, you’ll usually find me watching Netflix shows like The Summer I Turned Pretty or The Vampire Diaries.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e170c485-9f5f-40f2-91b0-4324a5fe60e1\"}":{"__typename":"School","uuid":"e170c485-9f5f-40f2-91b0-4324a5fe60e1","name":"Hull High School","city":"Hull","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02045"},"Education:{\"uuid\":\"220b7f45-996e-422d-b885-ad3970b45f25\"}":{"__typename":"Education","uuid":"220b7f45-996e-422d-b885-ad3970b45f25","school":{"__ref":"School:{\"uuid\":\"e170c485-9f5f-40f2-91b0-4324a5fe60e1\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"e48ebb91-6e34-4d93-afcc-344cd714b617\"}":{"__typename":"Education","uuid":"e48ebb91-6e34-4d93-afcc-344cd714b617","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"4ccb85db-e50c-42e2-8d40-f170f1b79927\"}":{"__typename":"MentorPublicProfile","uuid":"4ccb85db-e50c-42e2-8d40-f170f1b79927","displayName":"Alexis H.","slug":"alexis-her","biography":"\u003cp\u003eHello! My name is Alexis, and I’m a senior at Brown University studying Biomedical Engineering on the pre-med track. I’m thrilled to join Curious Cardinals as a mentor and look forward to connecting with students in ways that are both inspiring and meaningful. As a biomedical engineer, I’ve gained a wide range of academic and problem-solving skills through rigorous, hands-on courses. My studies have allowed me to combine my love for biology, the human body, and medicine with engineering approaches to innovation. I’m especially passionate about immunology and research, whether it’s designing new therapeutics, developing vaccines, or studying how drugs interact with the immune system. For me, medicine is about both discovery and connection: helping patients directly as a doctor or making an impact in the lab by creating solutions that improve health and quality of life. Outside the classroom, I’m deeply involved in my community and extracurriculars. I volunteer at the Rhode Island Refugee Dream Center, where I teach English and technology skills to refugees, helping them navigate new opportunities. I also work with the Mount Hope High School Environmental Club, mentoring students as they design solutions to address flooding and climate change in their community. These experiences have been incredibly rewarding, giving me the chance to empower others and support young people as they pursue big, impactful goals. At Brown, I’m also part of Doctors and Engineers Without Borders, a student-led initiative supporting rural hospitals in Cambodia by fundraising for and delivering essential medical supplies, from neonatal blankets to treatments for premature infants. As a Cambodian-American, this project has been especially meaningful, allowing me to give back to a community that resonates with my cultural roots. Professionally, I work in a wet lab where I design novel peptide therapeutics to treat RSV (respiratory syncytial virus). This work has taught me the importance of persistence, curiosity, and collaboration in scientific discovery, as well as how research connects to real-world medical needs. Above all, I consider myself a people person, who thrives on conversation, collaboration, and building genuine connections. I love helping others reach their potential, whether that’s guiding students through tough academic concepts, offering mentorship about college and career paths, or just being a supportive listener and friend. I’m excited to bring my passion for science, medicine, and mentorship to Curious Cardinals. Together, I hope we can not only deepen your understanding of academic subjects, like biology and chemistry, but also discover how to apply those ideas to the real world in ways that make a difference.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"HcoRRAr701mgHeRJBCst100HqzOCnN8xOt7LaR0200H9txU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"cca5e765-ad5a-48bc-af63-361460a6cd67\"}"},{"__ref":"Favorites:{\"uuid\":\"94cd2302-749c-48f4-99f5-fe0a59364f25\"}"},{"__ref":"Favorites:{\"uuid\":\"5619fa9d-a7fd-4eb3-be8d-e15f998411c1\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5b1c0913-7735-4682-9fc4-d7915da60f27\"}"},{"__ref":"DeepDives:{\"uuid\":\"6779b5b2-7c22-4978-81e3-7c71d2622797\"}"},{"__ref":"DeepDives:{\"uuid\":\"f09e24e3-8e51-41fb-b69b-a774f29c3015\"}"},{"__ref":"DeepDives:{\"uuid\":\"13d2bb48-f2a5-4300-ab2f-ab95c79afe8c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/264e9915-8726-4df7-9447-2bb45ed61f97/-/preview/-/format/jpg/","https://ucarecdn.com/2881b308-95f4-4ff7-af54-d30c89ae6f59/-/preview/-/format/jpg/","https://ucarecdn.com/87657358-b9be-42a1-8749-05c5374bbbc1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"220b7f45-996e-422d-b885-ad3970b45f25\"}"},{"__ref":"Education:{\"uuid\":\"e48ebb91-6e34-4d93-afcc-344cd714b617\"}"}],"hiredAt":"2025-09-08T18:31:19.974Z","topics":["Pre-Algebra","Algebra I","Algebra II","Geometry","Calculus","Biology","Chemistry","6-8 Grade Science","Executive Function","Academic Coaching"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alexis-her\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"4ccb85db-e50c-42e2-8d40-f170f1b79927\"}"}}},"_sentryTraceData":"4c96dea59e894d59ae674d7bde662f8e-89d35ee9f91087ee-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4c96dea59e894d59ae674d7bde662f8e,sentry-sample_rate=0.2,sentry-transaction=%2Fm
