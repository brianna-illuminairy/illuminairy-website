xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7e0cd425-144f-42a6-8e8c-6a62b2d6acee\"}":{"__typename":"Favorites","uuid":"7e0cd425-144f-42a6-8e8c-6a62b2d6acee","photoUrl":"https://ucarecdn.com/de86b174-48bb-4f51-b80d-c465388fddc1/","title":"Jean Giraud (Moebius)","type":"ARTIST"},"Favorites:{\"uuid\":\"86191081-b753-4104-b9bd-efcd575917e8\"}":{"__typename":"Favorites","uuid":"86191081-b753-4104-b9bd-efcd575917e8","photoUrl":"https://ucarecdn.com/de86b174-48bb-4f51-b80d-c465388fddc1/","title":"The Legend of Zelda: Breath of the Wild","type":"GAME"},"Favorites:{\"uuid\":\"099927d7-fb85-4b9c-94a5-78d7ddcee0f5\"}":{"__typename":"Favorites","uuid":"099927d7-fb85-4b9c-94a5-78d7ddcee0f5","photoUrl":"https://ucarecdn.com/de86b174-48bb-4f51-b80d-c465388fddc1/","title":"Basketball","type":"SPORT"},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"5354955c-68ea-4e54-bbaa-b595ebec7b20\"}":{"__typename":"DeepDives","uuid":"5354955c-68ea-4e54-bbaa-b595ebec7b20","content":"\u003cp\u003eMy biggest lifelong dream has always been to create my own graphic novel. I spent most of my childhood filling out notebook after notebook, creating entire worlds of different characters and fantastical landscapes. I love how storytelling and visual expression come  together in a graphic novel. It elevates the experience of narration! \u003c/p\u003e\u003cp\u003eSome of my biggest inspirations include the Jean Giraud, Tillie Walden, and Daisuke Igarashi.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"be22a2e5-9ff0-4041-bd9d-9c6eb5e9b21d\"}":{"__typename":"DeepDives","uuid":"be22a2e5-9ff0-4041-bd9d-9c6eb5e9b21d","content":"\u003cp\u003eI will preface this by saying that the main reason I picked Electrical Engineering (EE) was that it just \u003cem\u003efelt\u003c/em\u003e right. When I was exploring different areas, I realized that I could make compelling arguments for any major (societal impact, job opportunities, salary etc), so in the end it came down to which one I would be happiest doing for the next 4+ years. That being said, here is my mini spiel about why EE is so cool, so I don't just leave you with \"it just felt right\":\u003c/p\u003e\u003cp\u003e\u003cbr\u003eEE is really behind all the technology we use today. It helps me understand and appreciate the world in such a different light. For instance, EE is not only what powers your computer (ever wondered how all this stuff is displayed on your screen?), it also explains how data can be thrown across the entire planet using satellites and the internet; EE explains how we can take photos of nebulas and galaxies million of light years away; it lets us have giant MRI machines that help doctors diagnose medical conditions. Electricity is everywhere (in light, even!), and so, EE is everywhere -- that to me is just so exciting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"66e203d3-e98a-4039-93e6-9f4f5ea121d9\"}":{"__typename":"School","uuid":"66e203d3-e98a-4039-93e6-9f4f5ea121d9","name":"SJI International School","city":"Singapore","type":"HIGH","state":"Singapore","country":"Singapore","zip":"298191"},"Education:{\"uuid\":\"169bf7e6-265c-4976-9473-6a1702bfe5a1\"}":{"__typename":"Education","uuid":"169bf7e6-265c-4976-9473-6a1702bfe5a1","school":{"__ref":"School:{\"uuid\":\"66e203d3-e98a-4039-93e6-9f4f5ea121d9\"}"},"startYear":"2017","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"77e380a7-0544-4d72-b053-2be31ce21e95\"}":{"__typename":"Education","uuid":"77e380a7-0544-4d72-b053-2be31ce21e95","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Electrical Engineering \u0026 Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"632144c3-0d97-4310-a49b-fec5a53f6b19\"}":{"__typename":"MentorPublicProfile","uuid":"632144c3-0d97-4310-a49b-fec5a53f6b19","displayName":"Sage W.","slug":"sage-wu","biography":"\u003cp\u003e\"The most powerful thing you can give someone is self belief\"\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi! My name is Sage, and I'm a student at Stanford University studying Electrical Engineering and Computer Science (EECS).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I like to focus on on approaches over outcomes. My goal is to give students the confidence that they can tackle any challenge, no matter its shape or form. Most students come in not knowing what exactly they want to do (which is perfectly okay!), and even in college, statistics show that around 80% of students end up changing their major at least once. At this stage, I believe that the important thing is to hone students' skillsets in terms of approaching new challenges (organizing time, setting manageable goals, communicating with different types of people etc), so that in the future, they can be confident in anything they try.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePersonally, I had no idea what I wanted to do in high school, so I ended up developing a broad set of experiences: from academic research (in genetics, bioengineering, and economic policy), to creating international non-profit-orgs (in finance, english literature, and sustainability), to starting an arts business, to drawing my own mini comic series, to representing Singapore in basketball. All these pursuits, despite their disparate natures, shared the fact that they taught me how to start and build up projects from scratch. It is this skillset I want to pass down to my students the most, and you can rest assured that I will be able to support them in any new project they think up (and we're going to have SO MUCH FUN in the process!).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs an EECS student, my speciality is in engineering, especially hardware and software interfaces. I love making wiring up Raspberry Pi's and Arduinos, then coding things up to make them work.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of the classroom, I'm a Satellites Co-Lead at the Stanford Student Space Initiative, which is also the university's largest project-based club. I lead a team of over 50 students to engineer a real satellite -- we're launching it into space this October! Last Fall, I also interned at SpaceX, where I worked on designing electronics for their satellites. On top of that, I'm also a researcher at Stanford's Space Rendezvous Lab, where I write satellite Guidance, Navigation, and Control (GNC) algorithms for NASA's Starling mission.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my free time, I love playing video games (Nintendo, FPS – anything that involves pixels moving), drawing comics, running, and reading manga/webtoons. My lifelong dream has always been to make my own graphic novel. I always have a sketchbook on hand to add to the worlds I'm creating!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSo excited to meet you and for us to start this journey together!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7e0cd425-144f-42a6-8e8c-6a62b2d6acee\"}"},{"__ref":"Favorites:{\"uuid\":\"86191081-b753-4104-b9bd-efcd575917e8\"}"},{"__ref":"Favorites:{\"uuid\":\"099927d7-fb85-4b9c-94a5-78d7ddcee0f5\"}"}],"causesSupported":[],"major":"Electrical Engineering \u0026 Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5354955c-68ea-4e54-bbaa-b595ebec7b20\"}"},{"__ref":"DeepDives:{\"uuid\":\"be22a2e5-9ff0-4041-bd9d-9c6eb5e9b21d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b112574d-eb0b-44ce-982b-e5911dcf98ea/-/preview/-/format/jpg/","https://ucarecdn.com/f64b1059-db37-4253-a944-54c49ded526c/-/preview/-/format/jpg/","https://ucarecdn.com/198da7fc-d66f-46bb-94ff-0de096f08f0b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"169bf7e6-265c-4976-9473-6a1702bfe5a1\"}"},{"__ref":"Education:{\"uuid\":\"77e380a7-0544-4d72-b053-2be31ce21e95\"}"}],"hiredAt":"2024-04-04T23:18:17.700Z","topics":["K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Business / Entrepreneurship","Finance / Investing","Coding / Programming","Robotics / Electronics / CAD","STEM Project","Aviation / Aerospace","Web Design","Machine Learning / AI","Sustainability"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sage-wu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"632144c3-0d97-4310-a49b-fec5a53f6b19\"}"}}},"_sentryTraceData":"67a4f0a2087747f4bf1c894a7d5ed6d4-bb5b30c5ba5cef3f-0","_sentryBaggage":"sentry-environment=vercel-production,sentr
