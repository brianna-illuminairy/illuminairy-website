xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"3cd14681-b15a-46fb-8b4b-5c76bcb4b36f\"}":{"__typename":"Favorites","uuid":"3cd14681-b15a-46fb-8b4b-5c76bcb4b36f","photoUrl":"https://ucarecdn.com/70e3ad1b-d9d4-4469-a2c3-ffcafd4f38a7/","title":"Lindsay Vonn","type":"ATHLETE"},"Favorites:{\"uuid\":\"c754f28c-fc04-4bd2-914e-1076255bb7b9\"}":{"__typename":"Favorites","uuid":"c754f28c-fc04-4bd2-914e-1076255bb7b9","photoUrl":"https://ucarecdn.com/9ee837e6-dcce-44ea-8f53-01e51d26868d/","title":"The Three-Body Problem","type":"BOOK"},"Favorites:{\"uuid\":\"5f512577-d8f3-41fc-b8b2-998006ce2791\"}":{"__typename":"Favorites","uuid":"5f512577-d8f3-41fc-b8b2-998006ce2791","photoUrl":"https://ucarecdn.com/4f448e2c-9844-4fba-848f-d8cfc626c8e0/","title":"Reputation","type":"ALBUM"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"0433a888-83b0-42bd-ac4e-8b6b7a9a4f22\"}":{"__typename":"DeepDives","uuid":"0433a888-83b0-42bd-ac4e-8b6b7a9a4f22","content":"\u003cp\u003eAs a female both studying and working in STEM and in business, I am especially passionate about empowering young women to excel in areas of academics and work that have been historically underrepresented by women. I deeply understand the nuances and bias that sometimes exist in these fields, and strive to empower mentees to both love and excel in STEM by leveraging my own experiences and excitement. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"0ef94d67-9325-415f-9940-27c16f4d1102\"}":{"__typename":"DeepDives","uuid":"0ef94d67-9325-415f-9940-27c16f4d1102","content":"\u003cp\u003eAs a prolific reader, I hope to write a novel in my lifetime! In addition to my MBA studies, I plan to enroll in a Fiction Writing class in NYC this Fall to reinvigorate and inspire my love of creative writing and take the first steps of turning this dream into a reality. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"a725762f-e5b6-422e-92ee-7e8e1fcc24b4\"}":{"__typename":"DeepDives","uuid":"a725762f-e5b6-422e-92ee-7e8e1fcc24b4","content":"\u003cp\u003eWhile I have always been an athlete and continue to play sports recreationally in NYC, I also performed in musicals during middle school and continue to love musical theater, showtunes, and Broadway productions. I can often be heard singing the soundtrack of Les Misérables in the shower!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"068c8162-3fd2-43ed-9226-7280576062df\"}":{"__typename":"DeepDives","uuid":"068c8162-3fd2-43ed-9226-7280576062df","content":"\u003cp\u003eAs a high school student who went to a very competitive high school, I was extremely stressed about performing well academically and getting into a good college. I think, as many high schoolers often do, I often forgot about how much I \u003cem\u003eloved \u003c/em\u003eschool and learning in lieu of what grade I got or how padded my resume was. I would tell myself to focus a bit more on the subjects and topics that inspired me and to stay curious about them - the sole pursuit of an \"A\" sometimes distracts from being present as a learner. It is such a blessing to be a full-time student and have the space to discover yourself academically and personally; enjoy it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}":{"__typename":"School","uuid":"70146acc-a4ce-459e-8969-b791ab43dfb2","name":"Menlo School","city":"Atherton","type":"HIGH","state":"California","country":"United States","zip":"94027"},"Education:{\"uuid\":\"3ade69b2-2cab-4e59-ba53-031256777ed1\"}":{"__typename":"Education","uuid":"3ade69b2-2cab-4e59-ba53-031256777ed1","school":{"__ref":"School:{\"uuid\":\"70146acc-a4ce-459e-8969-b791ab43dfb2\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"de035d92-860d-4980-8ff8-c3cc2fbaca19\"}":{"__typename":"Education","uuid":"de035d92-860d-4980-8ff8-c3cc2fbaca19","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Biological Sciences, Humanities","degree":null},"MentorPublicProfile:{\"uuid\":\"b4f33d96-2091-48dc-924c-850237e0430c\"}":{"__typename":"MentorPublicProfile","uuid":"b4f33d96-2091-48dc-924c-850237e0430c","displayName":"Ashley  P.","slug":"ashley-pimlott","biography":"\u003cp\u003eHi, my name is Ashley! I grew up in the Bay Area, California, where my experiences both academically and growing up surrounded by nature inspired a deep love for science, the outdoors, and the arts. I graduated from Northwestern University in 2020 with a Bachelor of Arts in Biological Sciences - concentrating in Cell Biology and Physiology - as well as in Humanities, with a focus on Science in Human Culture. My academic journey included a wide range of interdisciplinary coursework spanning Organic Chemistry, Calculus, Advanced Cell Biology, Environmental Literature, and History of American Technology, among other subject areas. I appreciated how these diverse courses gave me a broader understanding of how science operates not only in the lab, but also within societal, historical, and ethical contexts.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my time at Northwestern, I actively engaged in research as an undergraduate research assistant in a biochemistry lab focused on the spatial organization of DNA in the cell nucleus. There, I was honored to receive a competitive undergraduate research grant that supported my work and deepened my interest in the life sciences. Outside of academics, I enjoyed exploring my creative side - I wrote and performed satirical comedy on campus, which became one of my favorite non-academic outlets. I was also active in sports, playing intramural soccer and lacrosse, which allowed me to continue my lifelong passions for these activities and stay grounded while taking on a challenging course load.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduation, I worked for a ski season at Deer Valley Resort in Park City, Utah, before then spending four years working in management consulting at Oliver Wyman within the Healthcare and Life Sciences practice. This experience allowed me to apply my analytical and scientific background to real-world business challenges across a wide range of healthcare organizations. I’m now continuing my academic and professional journey by pursuing my MBA at Columbia University in New York City. Through my studies, I’ve gained graduate-level knowledge in Economics, Statistics, and Finance, further rounding out my interdisciplinary expertise. Post-MBA, I plan to return to consulting at Oliver Wyman before moving into the digital health start-up space and hopefully one day founding my own company at the forefront of technological health innovation. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love staying active and creative - I enjoy skiing (both downhill and backcountry), scuba diving, traveling, running, playing team sports, and reading fiction and science fantasy. Recently, I’ve become involved in New York’s vibrant creative arts scene and have even produced an independent short film.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about education and mentorship, with previous experience tutoring middle and high school students in math, science, and college application writing. As someone who struggled with ADHD as a teenager, I understand the challenges of a learning disability and how to help students improve their executive functioning and task management. I truly enjoy helping students find joy in learning and discover what excites them. I believe in cultivating curiosity and building confidence across academic subjects at every level, from elementary to college.\u003c/p\u003e","teachingVideoPlaybackId":"7531bHBSwEHHWHom4ZMXAYM6jlI5tj00zM4ptVmVOO01Q","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"3cd14681-b15a-46fb-8b4b-5c76bcb4b36f\"}"},{"__ref":"Favorites:{\"uuid\":\"c754f28c-fc04-4bd2-914e-1076255bb7b9\"}"},{"__ref":"Favorites:{\"uuid\":\"5f512577-d8f3-41fc-b8b2-998006ce2791\"}"}],"causesSupported":[],"major":"Biological Sciences, Humanities","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"0433a888-83b0-42bd-ac4e-8b6b7a9a4f22\"}"},{"__ref":"DeepDives:{\"uuid\":\"0ef94d67-9325-415f-9940-27c16
