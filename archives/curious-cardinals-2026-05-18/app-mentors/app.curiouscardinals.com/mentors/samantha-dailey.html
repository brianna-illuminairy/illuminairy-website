xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7f64d4fc-3894-480d-b82e-aba481672841\"}":{"__typename":"Favorites","uuid":"7f64d4fc-3894-480d-b82e-aba481672841","photoUrl":"https://ucarecdn.com/a559b9ba-0d5f-40f4-9a8c-5b2a47bb1478/","title":"Intersetllar","type":"MOVIE"},"Favorites:{\"uuid\":\"2e7f4799-8a0f-4ec9-be15-7a1eb34a05e3\"}":{"__typename":"Favorites","uuid":"2e7f4799-8a0f-4ec9-be15-7a1eb34a05e3","photoUrl":"https://ucarecdn.com/6b9d36cb-43d8-4f94-9526-404323734e4f/","title":"London","type":"CITY"},"Favorites:{\"uuid\":\"1f5b44be-cf05-4852-bd1d-60034a11148f\"}":{"__typename":"Favorites","uuid":"1f5b44be-cf05-4852-bd1d-60034a11148f","photoUrl":"https://ucarecdn.com/cf5001e1-116e-4b09-abf1-13cab2e6a35e/","title":"Volleyball","type":"SPORT"},"CausesSupported:{\"uuid\":\"046c7042-8f2b-4b4b-b310-0b586a9b776a\"}":{"__typename":"CausesSupported","uuid":"046c7042-8f2b-4b4b-b310-0b586a9b776a","name":"Amazon Aid","description":"\u003cp\u003eI work on the Communication team to help spread the word about deforestation.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/a3ae5cdd-f3ab-43ce-b139-426a9c954906/"},"CausesSupported:{\"uuid\":\"c1d57b34-917b-482e-ba16-78f67263f9c6\"}":{"__typename":"CausesSupported","uuid":"c1d57b34-917b-482e-ba16-78f67263f9c6","name":"The Asher House","description":"\u003cp\u003eA dog sanctuary for rescues? What more could you ask for.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/2f77f108-9e62-4313-88e9-057186f6ed67/"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"7f4e7179-8b14-4f25-b620-13ff7edf987d\"}":{"__typename":"DeepDives","uuid":"7f4e7179-8b14-4f25-b620-13ff7edf987d","content":"\u003cp\u003eI have always had an overwhelming fascination with space. In fact, for my 16th birthday, instead of begging my parents for a car like other teenagers, I asked for a telescope. 8 years later, the passion remains, and I decided to take this interest into my own hands. While I have never taken a single physics class, I have been teaching myself the basics of physics and astrophysics using everything from textbooks at the library to documentaries about quantum physics. There is something quite fun about learning for the sake of learning instead of a grade.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5d7ddfa1-10e5-46c4-b0ed-9cd3380bec8e\"}":{"__typename":"DeepDives","uuid":"5d7ddfa1-10e5-46c4-b0ed-9cd3380bec8e","content":"\u003cp\u003eI played varsity volleyball all four years in high school, and in the summer I helped my head coach lead a camp for elementary and middle school students to learn volleyball. I loved working with kids and seeing them develop more and more interest in the sport. I also worked at the summer camps at the SPCA, where I guided kids how to train dogs and taught them all about pets. And of course, growing up so close to Lake Tahoe, I spent every spare minute I could there floating in the water. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"3bef1320-fd2e-4ec8-adc8-cf32258a5a4d\"}":{"__typename":"DeepDives","uuid":"3bef1320-fd2e-4ec8-adc8-cf32258a5a4d","content":"\u003cp\u003eGrowing up, I wanted to be an Elementary School Teacher. And while that's shifted a little bit, I still love teaching. I know I would've wanted a mentor while I was in school to bounce ideas off of and ask questions, and I love that I can be that support system for someone else. There's something so exciting to me about getting someone to develop a love of learning, or finally get through a topic they've been struggling with, and I feel lucky to have the opportunity to be a part of that journey.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"29625023-fe0c-4316-a33d-7a666a6aa558\"}":{"__typename":"DeepDives","uuid":"29625023-fe0c-4316-a33d-7a666a6aa558","content":"\u003cp\u003eI really believe that mindset is everything. At the end of high school, I put a quote on my wall that says \"Be happy, and a reason will come along.\" I strongly wish I figured that out earlier. I think if you approach a difficult situation believing you can do it, and that the challenge will be rewarding, it will completely affect your outcome. Additionally, if you try to seek out the positives, you'll find more (and vice versa). This really applies to everyone, whether it helps a traditionally strong student find new interests and reach their potential, or gives a struggling student the encouragement and mindset shift they need to persevere.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"e0657a89-6f31-49a8-ad5d-2bfbc7b6d6e6\"}":{"__typename":"School","uuid":"e0657a89-6f31-49a8-ad5d-2bfbc7b6d6e6","name":"Monte Vista High School","city":"Danville","type":"HIGH","state":"California","country":"United States","zip":"94526"},"Education:{\"uuid\":\"88005aa0-602a-4d73-ace3-a7488e7d209a\"}":{"__typename":"Education","uuid":"88005aa0-602a-4d73-ace3-a7488e7d209a","school":{"__ref":"School:{\"uuid\":\"e0657a89-6f31-49a8-ad5d-2bfbc7b6d6e6\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"809a5b54-ff00-4b0d-b3cd-8e36d30ded0c\"}":{"__typename":"School","uuid":"809a5b54-ff00-4b0d-b3cd-8e36d30ded0c","name":"University of California, Santa Barbara","city":"Santa Barbara","type":"COLLEGE","state":"California","country":"United States","zip":"93106"},"Education:{\"uuid\":\"6a45f333-ed2c-4a1e-84be-74348fdee1b6\"}":{"__typename":"Education","uuid":"6a45f333-ed2c-4a1e-84be-74348fdee1b6","school":{"__ref":"School:{\"uuid\":\"809a5b54-ff00-4b0d-b3cd-8e36d30ded0c\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Environmental Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"7e1032a5-5142-4321-ab46-ce807bbfd1f9\"}":{"__typename":"MentorPublicProfile","uuid":"7e1032a5-5142-4321-ab46-ce807bbfd1f9","displayName":"Samantha D.","slug":"samantha-dailey","biography":"\u003cp\u003eBorn and raised in the Bay Area, I loved everything to do with learning and being outside. I filled my schedule in high school with every thing I could make time for: AP classes, varsity volleyball, choir, and clubs. When I went to college, I slowed down to focus on finding what I loved. What I found was that it wasn’t just one thing, but that was the biggest blessing of all.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI decided to go to UC Santa Barbara for their exceptional Environmental Studies program, and I got to study what I loved next to the ocean (and honestly, who wouldn’t want to do that?). During my time at school, I not only took classes around ecology, environmental chemistry, and conservation, but I explored by artistic passions. I spent almost my entire time as a student working as the Head Marketing and Design Intern for UCSB Atheltics. Growing up in a huge sports household, I loved getting involved with the athletes and creating posters to advertise games around campus. It was especially fun sitting court-side and filming the basketball players celebrate every shot.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBut, perhaps my favorite college experience was my Graphic Design Internship at NBCUniversal. Splitting my time between working on the lot in Universal Studios, and still being a student in Santa Barbara, I was able to enjoy my last year of school and work on some of my favorite shows. I was lucky enough to go to sets for shoots like \u003cem\u003eThe Voice\u003c/em\u003e, pitch ideas to Simon Cowell for\u003cem\u003e America’s Got Talent\u003c/em\u003e, and work on the entire 50th season of \u003cem\u003eSNL\u003c/em\u003e. I learned so much about design and the Entertainment Industry, and I will never forget it—especially the daily golf-cart rides behind the Studio Tour Tram. \u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAfter graduating in June of 2025, I am now working as a branding consultant for Amazon Aid, a nonprofit dedicated to reducing deforestation in the Amazon rainforest, and as part of the marketing team at Once Upon a Farm, a healthy and sustainable children’s food brand. I plan to travel as much as I can postgrad, hopefully back to London where I studied abroad, until I go back to school for my Masters and PhD in Environmental Science or Astrobiology. My background spans many different areas, but I truly love learning from every facet. Whether it’s art or design, communication and marketing, or life science, I will happily talk about them all day. My goal is to make people care more about the natural world, and whether that empathy comes from traditional research or a well-crafted story, I consider that a win.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love to play volleyball, as I have my whole life, find new hikes, cook, read, or learn new instruments (right now, the plan is saxophone, specifically so I can indulge my love of jazz). I also enjoy spending time with friends, watching \u003cem\u003eSurvivor,\u003c/em\u003e and asking to pet every dog I see. I believe learning should be exciting, and while there will always be struggles and “a-ha” moments, I would love to share that excitement with your students every step of the way.\u003c/p\u003e","teachingVideoPlaybackId":"HY5S8aeIMRBQjhntkg74QyKBeln5eQ01Dhoww2ahz5Uk","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhile I was working as a Design Intern at NBCUniversal, my job was to help make tv show posters for all their main shows. I was surrounded by industry experts, and was focused on learning more than having my artwork \"win\" or be picked. But, my art ended up being picked for the SNL50 Christmas Special. Not only was it one of my favorite shows, but I was so excited to go tell my friends and family to go look at it on tv. I'll never forget my mom yelling down from upstairs \"Sam, it's there! I see it!\" and then calling all our extended family members. I know it takes hard work to get there, but it truly felt like such a dream come true and I will always be grateful.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"7f64d4fc-3894-480d-b82e-aba481672841\"}"},{"__ref":"Favorites:{\"uuid\":\"2e7f4799-8a0f-4ec9-be15-7a1eb34a05e3\"}"},{"__ref":"Favorites:{\"uuid\":\"1f5b44be-cf05-4852-bd1d-60034a11148f\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"046c7042-8f2b-4b4b-b310-0b586a9b776a\"}"},{"__ref":"CausesSupported:{\"uuid\":\"c1d57b34-917b-482e-ba16-78f67263f9c6\"}"}],"major":"Environmental Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7
