xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7d0dda97-eb6e-42ce-af49-68c578e253c7\"}":{"__typename":"Favorites","uuid":"7d0dda97-eb6e-42ce-af49-68c578e253c7","photoUrl":"https://ucarecdn.com/55652c18-a8be-4091-a0d1-ba9be0fd2d7a/","title":"Bryan Adams","type":"ARTIST"},"Favorites:{\"uuid\":\"fb34818c-eb56-4a65-8238-7abc1792fe37\"}":{"__typename":"Favorites","uuid":"fb34818c-eb56-4a65-8238-7abc1792fe37","photoUrl":"https://ucarecdn.com/ff4c0f38-d386-448b-bf36-add5b776fb9f/","title":"New York City","type":"CITY"},"Favorites:{\"uuid\":\"eafc93cc-c29e-4415-8ff3-b9f785f7aedc\"}":{"__typename":"Favorites","uuid":"eafc93cc-c29e-4415-8ff3-b9f785f7aedc","photoUrl":"https://ucarecdn.com/fb799bac-15b4-4da8-b969-f73db938530b/","title":"Hotel California - Eagles","type":"SONG"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9479eccf-92c3-4ecc-b5f6-17b0932d043c\"}":{"__typename":"DeepDives","uuid":"9479eccf-92c3-4ecc-b5f6-17b0932d043c","content":"\u003cp\u003eStart building thigns before you think you're ready. I spent way too much time thinking I needed to learn everything first before I could actually make something cool. The truth is, you learn way more by trying to build your own version of Jarvis and failing a thousand thimes than you do by just reading about AI and robotics. Also, being curious about multiple things isn't a distraction.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d0c52c29-9cf7-4ff2-a18f-460680bd2bcd\"}":{"__typename":"DeepDives","uuid":"d0c52c29-9cf7-4ff2-a18f-460680bd2bcd","content":"\u003cp\u003eBecause someone believed in my curiosity when I was younger, and that changed everything. I want to be that person for someone else - the one who says \"that's a great question, let's figure it out\" instead of \"you'll learn that later.\" Helping students discover what excites them and giving them the confidence to chase it is honestly one of the most rewarding things I can do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"f12f0ac9-3560-44b8-97a7-4cfcb09000e2\"}":{"__typename":"DeepDives","uuid":"f12f0ac9-3560-44b8-97a7-4cfcb09000e2","content":"\u003cp\u003eI want to create something that actually moves humanity foward - whether that's a breakthrough in fusion energy, a theory that changes how we understand nature, or an invention that solves a real problem. It doesn't have to be flashy or win awrds. It just needs to leave the world a little better than I found it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"f46caa6b-75d5-4e07-bb7e-ec2af8b9ee05\"}":{"__typename":"DeepDives","uuid":"f46caa6b-75d5-4e07-bb7e-ec2af8b9ee05","content":"\u003cp\u003eApplied Physics and Robotics let me do both things I love: understand how the universe works at a fundamental level and actually build cool stuff. I didn't want to choose between theory and making things real. Plus, watching Iron Man as a kid definitely played a role: I wanted to be the person who could both explain the physics and engineer the solution.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"a2838d41-150a-4cc4-819b-8a5338e4c211\"}":{"__typename":"School","uuid":"a2838d41-150a-4cc4-819b-8a5338e4c211","name":"Jamaica Gateway to the Sciences","city":"Jamaica","type":"HIGH","state":"New York","country":"United States","zip":"11432"},"Education:{\"uuid\":\"e2577eeb-9127-42af-ac55-8cea912f3e5c\"}":{"__typename":"Education","uuid":"e2577eeb-9127-42af-ac55-8cea912f3e5c","school":{"__ref":"School:{\"uuid\":\"a2838d41-150a-4cc4-819b-8a5338e4c211\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"8b623212-ac04-4933-a43c-bb09d7c09419\"}":{"__typename":"Education","uuid":"8b623212-ac04-4933-a43c-bb09d7c09419","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2027","major":"Applied Physics","degree":null},"MentorPublicProfile:{\"uuid\":\"51568072-3d25-4503-8cda-e70743a87ed9\"}":{"__typename":"MentorPublicProfile","uuid":"51568072-3d25-4503-8cda-e70743a87ed9","displayName":"Swan Yi H.","slug":"swan-yi","biography":"\u003cp\u003eHi! I'm a junior at Columbia University ♔ studying Applied Physics and Robotics. Ever since watching Iron Man as a kid, I've been driven by curiosity about how everythiing works. I'm passionate about understanding the universe at a fundamental level while building things that make a real impact. I'm here to help students explore their own curiosity and discover what excites them most.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I Study\u003c/strong\u003e:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eApplied Physics and Robotics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eFocus areas: plasma physics, computational simulations, AI, and robotics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eResearch at Columbia Plasma Fusion Research Center analyzing plasma behaviors and particle interactions for fusion energy applications\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhat I'm Working On\u003c/strong\u003e:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBuilding my own version of Jarvis as a personal project, combining AI, robotics, and everything I'm learning\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eRunning computational simulations to understand plasma-particle interactions for clean fusion energy\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExploring side-questions at the intersection of physics and biology: how do physical principles shape the way organisms behave and move?\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAchievements \u0026amp; Experience\u003c/strong\u003e:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eOutstanding Research Award in Physics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePresented astronomy research at national conferences including TASC7 TESS in Hawaii and New York\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExperinece in theoretical and computational physics research\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eBeyond Physics\u003c/strong\u003e:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePassionate musician: play piano and guitar\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePerfect pitch, which connects my love of music theory with wave mechanics and physics\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBelieve that curiosity across multiple fields makes you better at each one\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy Mentor With Me\u003c/strong\u003e:\u003c/p\u003e\u003cp\u003eAs your mentor, I want to help you explore whatever sparks your curiosity. Physics, robotics, coding, music, or something completely different. Maybe you want to build a project, dive deep into understanding how something works, or just explore ideas that don't fit neatly into school subjects. I'm here to help you ask better questions and discover what excites you. Because here's what I've learned: the universe doesn't give up its secrets to people who just memorize formulas or follow instructions perfectly. It reveals itself to those who stay curious, who ask \"why\" when everyone else accepts \"that's just how it is,\" and who have the courage to build things that don't exist yet. Every major discovery in history started with someone being curious about something everyone else overlooked. Your questions matter. The things that fascinate you right now could lead somewhere incredible. Let's explore them together and see where your curiosity takes you.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eStay Curious!\u003c/p\u003e","teachingVideoPlaybackId":"A8ImzJmyIZmNuvho5CYIyQF600ZM02HV8B71XLY7dI1T8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7d0dda97-eb6e-42ce-af49-68c578e253c7\"}"},{"__ref":"Favorites:{\"uuid\":\"fb34818c-eb56-4a65-8238-7abc1792fe37\"}"},{"__ref":"Favorites:{\"uuid\":\"eafc93cc-c29e-4415-8ff3-b9f785f7aedc\"}"}],"causesSupported":[],"major":"Applied Physics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9479eccf-92c3-4ecc-b5f6-17b0932d043c\"}"},{"__ref":"DeepDives:{\"uuid\":\"d0c52c29-9cf7-4ff2-a18f-460680bd2bcd\"}"},{"__ref":"DeepDives:{\"uuid\":\"f12f0ac9-3560-44b8-97a7-4cfcb09000e2\"}"},{"__ref":"DeepDives:{\"uuid\":\"f46caa6b-75d5-4e07-bb7e-ec2af8b9ee05\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/de483b74-7cd1-45ae-a06e-9fee32f6bcf1/-/preview/-/format/jpg/","https://ucarecdn.com/2e5c3067-6380-4bba-9d8f-12d6707494f9/-/preview/-/format/jpg/","https://ucarecdn.com/a8a5a537-5e25-4a21-89a9-61cdb44d34c7/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e2577eeb-9127-42af-ac55-8cea912f3e5c\"}"},{"__ref":"Education:{\"uuid\":\"8b623212-ac04-4933-a43c-bb09d7c09419\"}"}],"hiredAt":"2026-02-11T18:56:58.848Z","topics":["Calculus","Physics","Academic Coaching","Computer Science","Music","Coding / Programming","STEM Project","Machine Learning / AI"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"swan-yi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"51568072-3d25-4503-8cda-e70743a87ed9\"}"}}},"_sentryTraceData":"1bc127df87104ac7974d25a5ce24b1b9-b8b935a30047c52f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=1bc127df87104ac7974d25a5ce24b1b9,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"swan-yi"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerously
