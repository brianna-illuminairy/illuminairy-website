xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4aaabb5f-7f3b-4a34-bb86-4e7cc7275dcc\"}":{"__typename":"Favorites","uuid":"4aaabb5f-7f3b-4a34-bb86-4e7cc7275dcc","photoUrl":"https://ucarecdn.com/ff2378de-b390-478d-94df-9294c4aa6921/","title":"COIN","type":"ARTIST"},"Favorites:{\"uuid\":\"d4d98881-c773-4f5e-95c2-0d125a8e8d13\"}":{"__typename":"Favorites","uuid":"d4d98881-c773-4f5e-95c2-0d125a8e8d13","photoUrl":"https://ucarecdn.com/f9a5e3d9-1b46-41be-a5c1-103421b15999/","title":"Baby Driver","type":"MOVIE"},"Favorites:{\"uuid\":\"7af01d94-af1c-4e5f-b455-4616a8de9b5b\"}":{"__typename":"Favorites","uuid":"7af01d94-af1c-4e5f-b455-4616a8de9b5b","photoUrl":"https://ucarecdn.com/7029c2b9-6401-4093-a69e-38c45ef21789/","title":"Valorant","type":"GAME"},"CausesSupported:{\"uuid\":\"448d8bf1-fcd1-4b13-8b17-4c454c304bcb\"}":{"__typename":"CausesSupported","uuid":"448d8bf1-fcd1-4b13-8b17-4c454c304bcb","name":"Pulmonary Fibrosis Foundation","description":"\u003cp\u003eMy grandma received a life-saving lung transplant following her diagnosis.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/b93b0b3a-3300-44d7-9429-382b59be2f22/"},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"6e32d86f-c470-4959-9520-01c0f48030ca\"}":{"__typename":"DeepDives","uuid":"6e32d86f-c470-4959-9520-01c0f48030ca","content":"\u003cp\u003eWhen people first meet me, they can immediately tell that I am a very goofy and nerdy person. I love Star Wars, board games, and brewing my own kombucha. What most people don't know is that I was a competitive Latin Ballroom dancer for seven years! Having fallen into it by complete chance, I stuck with dance all throughout high school and I continue to dance casually in college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"bee92e1e-61a9-4207-b236-bd51205826f8\"}":{"__typename":"DeepDives","uuid":"bee92e1e-61a9-4207-b236-bd51205826f8","content":"\u003cp\u003eMy Lolo has sacrificed a lot for my family. The impacts he’s made have grown over time and brought me the many opportunities I have today.\u0026nbsp;He grew up poor in a rural part of the Philippines and was able to go to college studying Mechanical Engineering. After a while, he made the decision to move to the United States, leaving my Lola with the rest of my family in the Philippines for years before they were allowed into the country. When they arrived they lived with friends. Eventually, they were able to move into a house of their own in Cypress, near where I live today.\u0026nbsp;My Lolo’s sacrifices instilled the great value of education into not only my family members, but me as well. His hard work allowed my aunts and uncles to pursue college educations in engineering, health, business, and regulatory affairs. All of his grandchildren have graduated or are currently attending college. His example has taught me to put the most effort into anything I do and to find opportunity in any challenge.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"3a73218e-0c72-4a8f-a97b-a03fa15193a8\"}":{"__typename":"DeepDives","uuid":"3a73218e-0c72-4a8f-a97b-a03fa15193a8","content":"\u003cp\u003eIn my spare time I enjoy working on personal passion projects. Starting in high school with my own kombucha culture, I've since taken on many projects revolving around STEM topics. I'm currently teaching myself Arduino and circuitry to build automated environment controls in isolated systems for vertical farming projects. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"72e48951-9024-4761-87d6-15e301b65d44\"}":{"__typename":"DeepDives","uuid":"72e48951-9024-4761-87d6-15e301b65d44","content":"\u003cp\u003eMy dream job is working as a Product Manager at a tech company. While I've had a great deal of technical engineering experience, I'm particularly drawn to PM because it's a more cross-functional role that sits at the intersection of engineering, business, and design. As someone who is very extroverted and thrives in fast-paced environments, I'd love to enter the tech space.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"a898bb92-2553-487b-bac2-5bbf69f4debc\"}":{"__typename":"School","uuid":"a898bb92-2553-487b-bac2-5bbf69f4debc","name":"Orange County School of the Arts","city":"Santa Ana","type":"HIGH","state":"California","country":"United States","zip":"92701"},"Education:{\"uuid\":\"ed2e7798-98b5-4173-9151-35b75c6904c2\"}":{"__typename":"Education","uuid":"ed2e7798-98b5-4173-9151-35b75c6904c2","school":{"__ref":"School:{\"uuid\":\"a898bb92-2553-487b-bac2-5bbf69f4debc\"}"},"startYear":"2016","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}":{"__typename":"School","uuid":"dff4a26a-20c2-4281-9c2a-b500907e0661","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94704"},"Education:{\"uuid\":\"a52c75aa-abc5-4fc9-aebf-5214a2db2f59\"}":{"__typename":"Education","uuid":"a52c75aa-abc5-4fc9-aebf-5214a2db2f59","school":{"__ref":"School:{\"uuid\":\"dff4a26a-20c2-4281-9c2a-b500907e0661\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"3f686b50-f734-4ffe-87a8-6f09108bc5c2\"}":{"__typename":"MentorPublicProfile","uuid":"3f686b50-f734-4ffe-87a8-6f09108bc5c2","displayName":"Jeffrey T.","slug":"jeffrey-tadeo","biography":"\u003cp\u003eHi! My name is Jeffrey Tadeo, and I’m a current junior at UC Berkeley. I come from an extensive arts background in high school, encompassing musical theater, visual arts, acting, dance, production and design, creative writing, and film. I am now studying Chemical Engineering with a minor in Data Science. I've always been an analytical thinker and chose to pursue engineering because of my love for robotics growing up.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhile I adore STEM, I’m also deeply passionate about business-related fields, spending time on my own learning and reading about business. On campus, I am a project lead in every academic organization I am part of, including Valley Consulting Group (tech strategy consulting), Vertical Farming at Berkeley (hydroponics and vertical farming), and Cal ChemE Car (chemical battery cell design).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy playing board games and pickleball with friends, dancing salsa, going indoor rock climbing, and blasting Midwest emo, indie pop, and jazz music while I study. I love learning about niche topics and expanding my knowledge in many directions, and I'm eager to help students discover their own unique passions!\u003c/p\u003e","teachingVideoPlaybackId":"n6V5b02sYiUfBp3FdzCVkjeXtdKcOMKwTG6nEXd7GeBM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement is building my own hydroponic vertical farm. In 2023 I taught myself CAD to design a small-scale Nutrient Film Technique (NFT) hydroponic farm for personal use. Over the course of five months I designed  multiple prototypes and compiled a list of parts and materials to fit my needs and stay within a budget of $150. I then spent one month building a physical working model of my virtual 3D prototype, complete with a pump system and LED grow lights. I was able to start growing produce in my own apartment at Berkeley!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"4aaabb5f-7f3b-4a34-bb86-4e7cc7275dcc\"}"},{"__ref":"Favorites:{\"uuid\":\"d4d98881-c773-4f5e-95c2-0d125a8e8d13\"}"},{"__ref":"Favorites:{\"uuid\":\"7af01d94-af1c-4e5f-b455-4616a8de9b5b\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"448d8bf1-fcd1-4b13-8b17-4c454c304bcb\"}"}],"major":"Chemical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6e32d86f-c470-4959-9520-01c0f48030ca\"}"},{"__ref":"DeepDives:{\"uuid\":\"bee92e1e-61a9-4207-b236-bd51205826f8\"}"},{"__ref":"DeepDives:{\"uuid\":\"3a73218e-0c72-4a8f-a97b-a03fa15193a8\"}"},{"__ref":"DeepDives:{\"uuid\":\"72e48951-9024-4761-87d6-15e301b65d44\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d5474f97-e92a-46df-810f-4187ff5ef2da/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"ed2e7798-98b5-4173-9151-35b75c6904c2\"}"},{"__ref":"Education:{\"uuid\":\"a52c75aa-abc5-4fc9-aebf-5214a2db2f59\"}"}],"hiredAt":"2024-12-30T20:17:22.858Z","topics":["Video / Photography","Film / Theater","Creative Writing","Business / Entrepreneurship","Coding / Programming","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.c
