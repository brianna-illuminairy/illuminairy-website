xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9f10ab54-14c1-4353-9383-00329f46780e\"}":{"__typename":"Favorites","uuid":"9f10ab54-14c1-4353-9383-00329f46780e","photoUrl":"https://ucarecdn.com/4365d937-cd6d-4160-a7e9-a331e6f26175/","title":"Reggie Bush","type":"ATHLETE"},"Favorites:{\"uuid\":\"445560e5-7358-4d1b-a673-9288d67dd7d3\"}":{"__typename":"Favorites","uuid":"445560e5-7358-4d1b-a673-9288d67dd7d3","photoUrl":"https://ucarecdn.com/4365d937-cd6d-4160-a7e9-a331e6f26175/","title":"Brave New World by Aldous Huxley","type":"BOOK"},"Favorites:{\"uuid\":\"b266567f-e399-4bc4-a970-11a5638d40e9\"}":{"__typename":"Favorites","uuid":"b266567f-e399-4bc4-a970-11a5638d40e9","photoUrl":"https://ucarecdn.com/4365d937-cd6d-4160-a7e9-a331e6f26175/","title":"Jim Carrey","type":"ACTOR"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"1d4ae29c-7f41-4dfa-a7b0-9e639b5da96f\"}":{"__typename":"DeepDives","uuid":"1d4ae29c-7f41-4dfa-a7b0-9e639b5da96f","content":"\u003cp\u003eIt takes a team to solve most of the big and important problems that we face today. I am passionate about mentorship because I want to do my part in cultivating the problem-solvers of tomorrow!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"6a648702-3a2b-40b6-8088-5bb047c0acfe\"}":{"__typename":"DeepDives","uuid":"6a648702-3a2b-40b6-8088-5bb047c0acfe","content":"\u003cp\u003eMy dream job is to become an astronaut. Not only am I curious about outer space, I think being an astronaut would be a great way to utilize my love for science and exploration.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"0b82a83d-d5f7-4451-9bfd-89103defcc78\"}":{"__typename":"DeepDives","uuid":"0b82a83d-d5f7-4451-9bfd-89103defcc78","content":"\u003cp\u003eA couple of years ago, I started building a modular synthesizer, which is a powerful instrument for making electronic music. I downloaded a bunch of circuit schematics, bought all of the components, and started soldering away. The build process truly tested my patience, and I had to overcome many setbacks. After about a month of work, I was able to get my first sound out of the system!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9909a70b-8622-4e1d-b5fa-3591b866a15e\"}":{"__typename":"DeepDives","uuid":"9909a70b-8622-4e1d-b5fa-3591b866a15e","content":"\u003cp\u003eAsk your teachers questions! Don't wait until college to ask your professors questions about ideas, careers, and philosophies. If you don't ask questions early and often, you'll miss out on countless amounts of wisdom that your middle school and high school teachers could provided.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"eb9eb9a6-5fe0-49f3-8373-53ad7dd9ddf5\"}":{"__typename":"Education","uuid":"eb9eb9a6-5fe0-49f3-8373-53ad7dd9ddf5","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Computer Engineering","degree":null},"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}":{"__typename":"School","uuid":"34bcb05a-352d-4ff5-bbe7-2a0a732f0749","name":"Harvard-Westlake Upper School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"91604"},"Education:{\"uuid\":\"3ae114de-24cd-4074-9e2b-ba58af1304d7\"}":{"__typename":"Education","uuid":"3ae114de-24cd-4074-9e2b-ba58af1304d7","school":{"__ref":"School:{\"uuid\":\"34bcb05a-352d-4ff5-bbe7-2a0a732f0749\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"06537f03-b5f5-4623-8033-cb95ebd8d854\"}":{"__typename":"MentorPublicProfile","uuid":"06537f03-b5f5-4623-8033-cb95ebd8d854","displayName":"Sultan D.","slug":"sultan-daniels","biography":"\u003cp\u003eHi, my name is Sultan Daniels and I am currently pursuing a PhD in Electrical Engineering at the University of California, Berkeley. Growing up in Los Angeles, California, throughout high school, when I wasn't doing homework or at sports practices, you couldn't separate me from my music production software. I studied how synthesizers generated sounds and how different effects processed them. Once my senior year physics teacher gave the class a demo on how electricity and magnetism is used to make a loudspeaker, I decided that I wanted to become an engineer.\u003cbr\u003e\u003cbr\u003eOnce I got to college and started taking courses on all types of electrical circuits and computer systems, I was constantly blown away by the ingenious technologies that allow for people to communicate and express themselves. One technology after the other, I started to notice that there was a common piece of machinery behind them all... mathematics! \u003cbr\u003e\u003cbr\u003eI now conduct research at UC Berkeley where I use mathematics to analyze intelligent systems, hoping to progress our understanding of their capabilities and limitations. Constantly approaching problems that no one has ever solved before, I'm no stranger to difficult concepts! When teaching, I will try to strip away the complexities of a concept down to its essence, because often that's where I've found its beauty.\u003cbr\u003e\u003cbr\u003eThroughout my development, my mentors have introduced me to the joys of discovery. The feeling of solving a difficult problem is like no other. I chose to become a Curious Cardinals mentor because I want to pass this excitement along to my mentees.\u003cbr\u003e\u003cbr\u003eWhen I'm not staring at equations or python code, I'm either training calisthenics, mountain biking, watching the NFL, or producing electronic music. Occasionally, I play basketball with classmates and without fail I am brutally reminded of my rusty jump shot.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9f10ab54-14c1-4353-9383-00329f46780e\"}"},{"__ref":"Favorites:{\"uuid\":\"445560e5-7358-4d1b-a673-9288d67dd7d3\"}"},{"__ref":"Favorites:{\"uuid\":\"b266567f-e399-4bc4-a970-11a5638d40e9\"}"}],"causesSupported":[],"major":"Computer Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1d4ae29c-7f41-4dfa-a7b0-9e639b5da96f\"}"},{"__ref":"DeepDives:{\"uuid\":\"6a648702-3a2b-40b6-8088-5bb047c0acfe\"}"},{"__ref":"DeepDives:{\"uuid\":\"0b82a83d-d5f7-4451-9bfd-89103defcc78\"}"},{"__ref":"DeepDives:{\"uuid\":\"9909a70b-8622-4e1d-b5f
