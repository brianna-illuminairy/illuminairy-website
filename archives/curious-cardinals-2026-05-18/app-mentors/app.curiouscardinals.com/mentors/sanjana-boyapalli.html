xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"7c34a59c-97a7-4b77-b469-22c7c3b97f32\"}":{"__typename":"DeepDives","uuid":"7c34a59c-97a7-4b77-b469-22c7c3b97f32","content":"\u003cp\u003eMy mentors are the reason I've accomplished so many of my goals, and this is my way of paying it forward. Success is meaningless if you can't share what you've learned with others. My mentors helped me realize my leadership potential, and I want to do the same for you. In medicine/healthcare, mentorship is so integral to empowering the next generation of providers, innovators, and changemakers, and that's what I'm here to help you become.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"ad0a5122-8cdc-4fad-867f-621aa728ecd9\"}":{"__typename":"DeepDives","uuid":"ad0a5122-8cdc-4fad-867f-621aa728ecd9","content":"\u003cp\u003eI'm currently implementing culinary medicine workshops for middle school students and elderly people with diabetes and dementia! My team and I are using virtual cooking classes as a way to teach people about nutrition and healthy living.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5ba0dd64-cf64-4e6c-94c4-ccec48c36335\"}":{"__typename":"DeepDives","uuid":"5ba0dd64-cf64-4e6c-94c4-ccec48c36335","content":"\u003cp\u003eI did clinical research on sleep apnea, went on a Habitat for Humanity trip, helped my friends film a modern adaptation of Shakespeare's \u003cem\u003eTwelfth Night\u003c/em\u003e, worked as a counselor at a visual arts camp, hung out at the Jersey Shore, and watched a ton of Spanish TV to give myself pseudo-immersion (it worked!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"00e202de-1a1e-47f5-aab3-f8e90f0bd82a\"}":{"__typename":"DeepDives","uuid":"00e202de-1a1e-47f5-aab3-f8e90f0bd82a","content":"\u003cp\u003eGoing into college, one of my goals was to not just meet my pre-med requirements, but truly expand my worldview. I loved science, but I also loved the humanities, political science, and anthropology. Public Health gave me the chance to understand health from a systems-level, and the Medical Humanities gave me a creative outlet and deeper cultural understanding. Overall, these majors made me a well-rounded medical student and healthcare team member.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"d993d7a0-6526-4de3-892a-c04a6201ea2f\"}":{"__typename":"School","uuid":"d993d7a0-6526-4de3-892a-c04a6201ea2f","name":"Kent Place School","city":"Summit","type":"HIGH","state":"New Jersey","country":"United States","zip":"07902"},"Education:{\"uuid\":\"80a7d38e-50fa-4984-a885-825369bffdaf\"}":{"__typename":"Education","uuid":"80a7d38e-50fa-4984-a885-825369bffdaf","school":{"__ref":"School:{\"uuid\":\"d993d7a0-6526-4de3-892a-c04a6201ea2f\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e3a7e210-8e3e-498f-af74-57a9976df470\"}":{"__typename":"School","uuid":"e3a7e210-8e3e-498f-af74-57a9976df470","name":"Johns Hopkins University","city":"Baltimore","type":"COLLEGE","state":"Maryland","country":"United States","zip":"21218"},"Education:{\"uuid\":\"a38a68bb-989c-4e29-9a94-1b16bee7efa3\"}":{"__typename":"Education","uuid":"a38a68bb-989c-4e29-9a94-1b16bee7efa3","school":{"__ref":"School:{\"uuid\":\"e3a7e210-8e3e-498f-af74-57a9976df470\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2022","major":"Public Health \u0026 Medical Humanities","degree":null},"MentorPublicProfile:{\"uuid\":\"79e9c074-577c-453b-9e1f-09aa141e8562\"}":{"__typename":"MentorPublicProfile","uuid":"79e9c074-577c-453b-9e1f-09aa141e8562","displayName":"Sanjana B.","slug":"sanjana-boyapalli","biography":"\u003cp\u003e\u003cstrong\u003eHi! I’m Sanjana\u003c/strong\u003e, a \u003cstrong\u003emedical student\u003c/strong\u003e at the Albert Einstein College of Medicine in New York City (yes, the one that's tuition-free). I graduated \u003cstrong\u003ePhi Beta Kappa\u003c/strong\u003e (top 10% of my class) from \u003cstrong\u003eJohns Hopkins University\u003c/strong\u003e with bachelor's degrees in \u003cstrong\u003ePublic Health and the Medical Humanities\u003c/strong\u003e (along with a concentration in Spanish). I’m passionate about helping students explore interests in medicine and health, expand their leadership potential, and turn their interests into meaningful activities and leadership experiences they love.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eA bit about me\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cblockquote\u003e\u003cp\u003eIn high school, I was a shy student who wanted to make a lasting impact on those around me, but didn’t know how. I liked my STEM classes just as much as the humanities, and for a long time, I wasn’t sure where I fit or whether medicine was right for me. I changed my mind more than once, pursued ideas that didn’t always work out, and learned through trial and error. Over time, I found ways to meaningfully combine my interests in unexpected and rewarding ways:\u003c/p\u003e\u003c/blockquote\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eConducted\u003c/strong\u003e \u003cstrong\u003eseveral community-engaged research projects\u003c/strong\u003e that have been presented at conferences and even supported state-level legislation\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDesigned afterschool nutrition programs\u003c/strong\u003e for elementary school students living in food deserts\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eCoordinated cultural, wellness, and preventative health programming\u003c/strong\u003e for students and community members (including self-defense workshops, a culture festival attended by 500+ people, and a surf therapy event!)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eReceived an award from the American College of Lifestyle Medicine\u003c/strong\u003e for the innovative events my school's interest group has hosted under my tenure as President\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cem\u003eFun fact: I also helped set up medical camps in remote parts of the Himalayas (the second pic on my profile is from one of our clinic days)!\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eHow I can help you\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI specialize in supporting students with:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eDeveloping\u003c/strong\u003e \u003cstrong\u003eleadership and service projects\u003c/strong\u003e (clubs, initiatives, volunteering) that are meaningful to them\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFinding\u003c/strong\u003e \u003cstrong\u003ementors, programs, internships, and opportunities\u003c/strong\u003e in health, STEM, and intersectional fields\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuilding confidence in communication fundamentals\u003c/strong\u003e (writing, public speaking, presentations, and researching topics to simplify them for others)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLaying the groundwork for \u003cstrong\u003ecollege readiness\u003c/strong\u003e through thoughtful activity planning and storytelling (application coaching, interview prep, and college essay writing)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether you have a clear idea you’re excited about or you feel unsure, overwhelmed, or torn between multiple interests, I've been there and am here to help you figure it out! Curiosity and openness are more than enough to start.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eWhy I’m qualified to help\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’ve been mentoring students for years, starting as President of my high school National Science Honor Society and as a summer camp counselor at Girls’ Leadership Institute. Since then, I’ve supported students across many settings, from working as a peer mentor and TA at Johns Hopkins to helping numerous students navigate college and medical school applications. My mentees have excelled in their courses, taken on leadership roles, and founded initiatives that excite them. Students and parents can feel confident that I bring extensive experience in coaching students, helping to identify and actualize their passions into tangible outcomes.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might include:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eIdentifying what your motivators and passions are\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating an action plan for a specific, impactful project that combines your interests\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing how to present your project effectively and with confidence\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTranslating your ideas and accomplishments into a narrative that resonates with admissions committees\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eOutside of medicine\u003c/u\u003e\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love to \u003cstrong\u003ebake\u003c/strong\u003e (I once baked 150 cookies during finals week for all my friends. Questionable time management, but totally worth it in the end. Life’s all about balance and making people feel loved), \u003cstrong\u003erun\u003c/strong\u003e (I’m currently training for the NYC marathon!), \u003cstrong\u003etry new restaurants\u003c/strong\u003e (I am a Beli fiend, and I love exploring new cuisines—Georgian has been my recent favorite), and \u003cstrong\u003epainting or crafting\u003c/strong\u003e with friends. I also recently started \u003cstrong\u003egolfing\u003c/strong\u003e and somehow ended up as Vice President of my med school’s Golf Club (proof that a little confidence and enthusiasm go a long way).\u003c/p\u003e","teachingVideoPlaybackId":"00b8wgSHW6iX7G02302F00D6Fk00bYJQMqHnYt5JyoS01a3U00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Public Health \u0026 Medical Humanities","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7c34a59c-97a7-4b77-b469-22c7c3b97f32\"}"},{"__ref":"DeepDives:{\"uuid\":\"ad0a5122-8cdc-4fad-867f-621aa728ecd9\"}"},{"__ref":"DeepDives:{\"uuid\":\"5ba0dd64-cf64-4e6c-94c4-ccec48c36335\"}"},{"__ref":"DeepDives:{\"uuid\":\"00e202de-1a1e-47f5-aab3-f8e90f0bd82a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6fe3d53b-4c16-49a9-9ae4-913d81523ff7/-/preview/-/format/jpg/","https://ucarecdn.com/7b2b6bbc-d71b-4ae7-9587-53a45d8b0605/-/preview/-/format/jpg/","https://ucarecdn.com/c0125c5c-a1eb-49a9-88b2-f449a04d963b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"80a7d38e-50fa-4984-a885-825369bffdaf\"}"},{"__ref":"Education:{\"uuid\":\"a38a68bb-989c-4e29-9a94-1b16bee7efa3\"}"}],"hiredAt":"2025-12-17T22:31:06.078Z","topics":["Writing","Spanish","Academic Coaching","College Essay Writing","Executive Function","Medicine / Health"],"communityBadges":["https://ucarecdn.com/4d492211-7b83-4aa5-a016-8991edde1bb6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sanjana-boyapalli\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"79e9c074-577c-453b-9e1f-09aa141e8562\"}"}}},"_sentryTraceData":"c3ad25aeb3a24760b1e053bceb0d974a-970f12736bda72d1-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c3ad25aeb3a24760b1e053bceb0d974a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"sanjana-boyapalli"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoa
