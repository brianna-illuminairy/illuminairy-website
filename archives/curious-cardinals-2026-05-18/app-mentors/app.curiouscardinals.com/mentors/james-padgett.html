xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d639c6b1-f7b0-4225-bc06-649f494f9c02\"}":{"__typename":"Favorites","uuid":"d639c6b1-f7b0-4225-bc06-649f494f9c02","photoUrl":"https://ucarecdn.com/59bd762f-a4f9-4366-a33f-7d64a60a0f9d/","title":"The Management of Savagery","type":"BOOK"},"Favorites:{\"uuid\":\"0708e16f-b9fa-48e3-888e-0f510cc6a7d8\"}":{"__typename":"Favorites","uuid":"0708e16f-b9fa-48e3-888e-0f510cc6a7d8","photoUrl":"https://ucarecdn.com/678ea56b-7110-4f4b-a174-7c882a40e5a1/","title":"Fiorentina","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"1f9525a0-8441-452c-8446-d93535adf1b7\"}":{"__typename":"Favorites","uuid":"1f9525a0-8441-452c-8446-d93535adf1b7","photoUrl":"https://ucarecdn.com/967e44a5-ca8f-49b7-84cf-7f2cec9f5655/","title":"Soccer","type":"SPORT"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"48fc2905-501d-4b3c-ad81-4ce2c37d5a6f\"}":{"__typename":"DeepDives","uuid":"48fc2905-501d-4b3c-ad81-4ce2c37d5a6f","content":"\u003cp\u003eOut of all the things I could be doing, I chose mentorship because I know how much of a difference it would have made for me earlier on. Back in middle school, I was curious and motivated, but I often felt like I had to figure things out on my own. Whether it was diving into STEM projects or exploring my other interests, I didn’t always have someone to guide me. Having an older student to show me how different subjects fit together, to answer the questions I didn’t know how to ask yet, or to encourage me when things were difficult would have been transformative.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, I see mentorship as a way to be that person for someone else. My goal is to help students feel that their curiosity matters and that the challenges they are facing now are the first steps toward something bigger. For me, mentorship is about creating the kind of support system I wish I had at that age, someone who can connect with you, believe in you, and remind you that what excites you is worth pursuing.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"4612e6b0-3873-4380-aa7a-020bd5ff2c01\"}":{"__typename":"DeepDives","uuid":"4612e6b0-3873-4380-aa7a-020bd5ff2c01","content":"\u003cp\u003eIn high school, I spent many of my summers at music camps where I played violin in both orchestras and chamber groups. Music has always been a big part of my life, and these camps gave me the chance to perform with other dedicated musicians and spend time developing as a player.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also attended STEM camps, where I worked on things like designing and programming robots in team-based projects. Those summers let me dive deeper into STEM outside the classroom and experiment with hands-on problem solving.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe summer before my senior year, I attended the Summer Science Program, where I conducted astrophysics research with students from across the country. It was an exciting opportunity to take on a real scientific project and work closely with peers who shared my interest in the sciences.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"4b8877d5-68b6-4bc3-bd8d-3958faf42aa3\"}":{"__typename":"DeepDives","uuid":"4b8877d5-68b6-4bc3-bd8d-3958faf42aa3","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is building a personal library of thousands of books that I have read and loan out to others. Reading has always been important to me, and I want to create a collection that reflects a wide range of ideas, stories, and perspectives. I imagine it as a place where friends, family, and anyone curious can come to borrow a book and discover something new.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI hope that over time the library will grow into a record of what I have explored and shared. For me, it would be meaningful to know that the books I collected and cared for helped spark curiosity and made knowledge feel more accessible to others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"c1025644-f856-4dec-945f-6e8ec60db4c1\"}":{"__typename":"DeepDives","uuid":"c1025644-f856-4dec-945f-6e8ec60db4c1","content":"\u003cp\u003eSomething I am incredibly proud of is the impact I had on the senior citizen community in my hometown through a tech support program I ran at the local senior center. I noticed that many older adults struggled with using phones, computers, and other devices, which often made it harder for them to stay connected with family or manage daily tasks. I started volunteering at the center to help them with whatever technology challenges they brought in.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt first, it was simple things like setting up email or showing someone how to use video calls. Over time, it grew into something larger. I worked with dozens of seniors who began to feel more comfortable with technology and more confident in using it on their own. Some started connecting with relatives they had not spoken to in years, while others learned to manage online banking or explore hobbies that mattered to them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat made me proud was not just fixing a device but helping someone feel less isolated and more independent. The program showed me how even small acts of teaching can make a lasting difference in someone’s life. It was one of the first times I saw how sharing knowledge could directly improve a community, and it continues to shape how I think about education and mentorship today.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"255b6b53-f5ef-43fe-94b8-d2f4a2595a7d\"}":{"__typename":"School","uuid":"255b6b53-f5ef-43fe-94b8-d2f4a2595a7d","name":"Kearney High School","city":"Kearney","type":"HIGH","state":"Nebraska","country":"United States","zip":"68845"},"Education:{\"uuid\":\"10db7ffe-b841-4fe0-8c3a-b6b7e781ecc9\"}":{"__typename":"Education","uuid":"10db7ffe-b841-4fe0-8c3a-b6b7e781ecc9","school":{"__ref":"School:{\"uuid\":\"255b6b53-f5ef-43fe-94b8-d2f4a2595a7d\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"935a0440-ade4-4e13-95dd-a76187394b35\"}":{"__typename":"Education","uuid":"935a0440-ade4-4e13-95dd-a76187394b35","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"8aab4a76-814f-4c8c-93cd-b97247f34e2c\"}":{"__typename":"MentorPublicProfile","uuid":"8aab4a76-814f-4c8c-93cd-b97247f34e2c","displayName":"James P.","slug":"james-padgett","biography":"\u003cp\u003eMy name is James, and I am currently a second-year at Yale studying Electrical Engineering. My academic path is rooted in a fascination with how things work at both the smallest and largest scales: from the circuits inside a computer to the systems that keep our world connected. But even beyond my engineering studies, I’ve always believed that education should nurture curiosity in many directions. That’s why, alongside my major, I spend a lot of time exploring geography, politics, and history as personal passions. I love learning how the physical layout of the world has shaped human civilizations, how cultures interact across borders, and how history helps us understand the present. These hobbies remind me that education is not just about one field of study, but about weaving together knowledge in ways that create meaning.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I balanced rigorous STEM courses with a wide range of extracurricular interests. I was deeply involved in building projects, competitions, and clubs that pushed me to think critically and solve problems creatively. At the same time, I enjoyed diving into topics in the humanities, which gave me a broader perspective on the questions I was asking in science and math. That balance between technical problem-solving and seeing the bigger picture is something I try to carry with me into everything I do today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor me, education is not about memorizing formulas or dates; it’s about cultivating the ability to ask better questions and to see connections across seemingly different areas. I think the best learning happens when students feel both challenged and supported, when they can pursue what excites them while also gaining the confidence to stretch into new territory. That’s exactly why I’m so excited to be part of Curious Cardinals.\u003c/p\u003e\u003cp\u003eAs a mentor, I want to help students not only understand their schoolwork but also discover the joy of learning beyond the classroom. Whether that means breaking down a difficult concept in math, exploring how geography shapes current events, or simply encouraging curiosity in a new subject, my goal is to make learning feel alive. I believe that every student has unique interests waiting to be developed, and I hope to be the kind of mentor who helps them connect those interests to bigger goals and possibilities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want students and their families to see me as someone who brings both academic rigor and genuine curiosity to the table. My own journey has taught me that education should open doors to new ideas, to self-discovery, and to the wider world. Through Curious Cardinals, I look forward to opening some of those doors for the students I work with!\u003c/p\u003e","teachingVideoPlaybackId":"5kYsdK8k922d7bQBi3JPsj135bMxGCDRFt1zxayWJmw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"d639c6b1-f7b0-4225-bc06-649f494f9c02\"}"},{"__ref":"Favorites:{\"uuid\":\"0708e16f-b9fa-48e3-888e-0f510cc6a7d8\"}"},{"__ref":"Favorites:{\"uuid\":\"1f9525a0-8441-452c-8446-d93535adf1b7\"}"}],"causesSupported":[],"major":"Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"48fc2905-501d-4b3c-ad81-4ce2c37d5a6f\"}"},{"__ref":"DeepDives:{\"uuid\":\"4612e6b0-3873-4380-aa7a-020bd5ff2c01\"}"},{"__ref":"DeepDives:{\"uuid\":\"4b8877d5-68b6-4bc3-bd8d-3958faf42aa3\"}"},{"__ref":"DeepDives:{\"uuid\":\"c1025644-f856-4dec-945f-6e8ec60db4c1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/20b5640a-de57-416d-bd74-44a9e69bb3e0/-/preview/-/format/jpg/","https://ucarecdn.com/0d379040-ec45-448a-8a40-a6fcaa2c6f7c/-/preview/-/format/jpg/","https://ucarecdn.
