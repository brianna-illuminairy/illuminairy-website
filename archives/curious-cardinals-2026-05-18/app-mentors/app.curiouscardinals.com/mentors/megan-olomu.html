xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"99261519-1156-4d5f-a0a2-18b2d56aa5fb\"}":{"__typename":"DeepDives","uuid":"99261519-1156-4d5f-a0a2-18b2d56aa5fb","content":"\u003cp\u003eI love to sing, play piano, and listen to podcasts. Some of my favorite podcasts to listen to are \"Stuff You Should Know\" or HBO's Succession Podcast. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"6bf7ccdb-0980-4f84-8f3b-3fe516149ec7\"}":{"__typename":"DeepDives","uuid":"6bf7ccdb-0980-4f84-8f3b-3fe516149ec7","content":"\u003cp\u003eMy favorite class I taught was \u003cstrong\u003e\"Legal Eagles: Introduction to Law\"\u003c/strong\u003e. We talked about the basics of criminal and civil law, famous Supreme Court cases, and invited prominent law professors to come speak to our class!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"e9da07c3-02a1-420b-8749-b4b85ff98843\"}":{"__typename":"DeepDives","uuid":"e9da07c3-02a1-420b-8749-b4b85ff98843","content":"\u003cp\u003eI chose Public Policy because it is a perfect blend between economics and political science. The major has provided me with a great balance between quantitative skills (statistics, data science, economics, etc.) and qualitative skills (reading, policy memo writing, etc.) \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"5a00d77f-a331-4fb6-9e9a-25a340058085\"}":{"__typename":"DeepDives","uuid":"5a00d77f-a331-4fb6-9e9a-25a340058085","content":"\u003cp\u003eAttorney in a civil litigation firm!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"d04c5ed6-855e-4ed3-9772-b70069cb971c\"}":{"__typename":"Education","uuid":"d04c5ed6-855e-4ed3-9772-b70069cb971c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Public Policy","degree":null},"School:{\"uuid\":\"18307014-d6e8-43f7-a50f-3636c16c2f38\"}":{"__typename":"School","uuid":"18307014-d6e8-43f7-a50f-3636c16c2f38","name":"Greenhill School","city":"Dallas ","type":"HIGH","state":"Texas","country":"USA","zip":"75001"},"Education:{\"uuid\":\"b7746b15-3465-42e2-87cb-91997f6d710f\"}":{"__typename":"Education","uuid":"b7746b15-3465-42e2-87cb-91997f6d710f","school":{"__ref":"School:{\"uuid\":\"18307014-d6e8-43f7-a50f-3636c16c2f38\"}"},"startYear":"2008","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"85b060b6-1611-4353-9b6b-a24c492e5f63\"}":{"__typename":"MentorPublicProfile","uuid":"85b060b6-1611-4353-9b6b-a24c492e5f63","displayName":"Megan O.","slug":"megan-olomu","biography":"\u003cp\u003eMegan is currently pursuing a major in Public Policy with a minor in Economics at Stanford University. A native Texan, Megan graduated from Greenhill School with a GPA in the top 6% of her class while also being an active member of her community. She served as president of the Student Council and Political Action Club, was a devoted member of her high school’s choir, and a three-sport varsity athlete. She accumulated several honors throughout her high school career such as Athlete of the Year, the Dartmouth Book Award, and induction into the Cum Laude Society. In recognition of all these accomplishments, she was the recipient of the Bernard L. Fulton Award, the highest honor given to a graduating senior at her high school. \u003cbr\u003e\u003cbr\u003e\u003cbr\u003eAt Stanford, Megan is a member of the Track and Field team Co-President of the Stanford Student Athlete Advisory Committee, and a Stanford Law School Undergraduate Fellow. She has previously interned for a Texas State Senate campaign, the 101st Civil District Court in Dallas County, a Criminal Defense Firm, and the Office of Economic Analytics at the Federal Communications Commission. She has also worked as Research Assistant for Professor Mark Duggan, the director of the Stanford Institute for Economic Policy Research, looking at the economic implications of privatizing the hospital sector. She has a deep passion for law, economics, and healthcare, and can’t wait to further explore the intersection of these fields.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Public Policy","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"99261519-1156-4d5f-a0a2-18b2d56aa5fb\"}"},{"__ref":"DeepDives:{\"uuid\":\"
