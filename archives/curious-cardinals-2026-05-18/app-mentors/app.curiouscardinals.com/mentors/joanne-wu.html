xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a1167bdb-c6f7-462c-8ef0-603bedea2fcc\"}":{"__typename":"Favorites","uuid":"a1167bdb-c6f7-462c-8ef0-603bedea2fcc","photoUrl":"https://ucarecdn.com/93f7d644-c0fc-4fc1-b817-141cb8134e22/","title":"Princess Mononoke","type":"MOVIE"},"Favorites:{\"uuid\":\"2968e155-075c-4a99-8204-94ad93a78791\"}":{"__typename":"Favorites","uuid":"2968e155-075c-4a99-8204-94ad93a78791","photoUrl":"https://ucarecdn.com/7e2d8a6d-3344-4a7b-989b-8d58cf62f23e/","title":"Heartbreaker, Justin Bieber","type":"SONG"},"Favorites:{\"uuid\":\"6d48e713-9cae-454b-a8e8-477ef5235e29\"}":{"__typename":"Favorites","uuid":"6d48e713-9cae-454b-a8e8-477ef5235e29","photoUrl":"https://ucarecdn.com/6b367777-a2c4-4bb7-9f9e-787fb634f9af/","title":"Chase Atlantic","type":"ARTIST"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"8fb68596-0827-4983-9ac2-b32753d2a07e\"}":{"__typename":"DeepDives","uuid":"8fb68596-0827-4983-9ac2-b32753d2a07e","content":"\u003cp\u003eI would tell my high school self to have more faith in myself! Things may seem hard and my hard labor may seem to not yield any fruit, but as long as you put in the work and try, it will always come back to you in the end. Rejection means redirection, and its never the end of the world if you fail!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"c1dbda5b-e3ea-4985-8987-058b9cbcc8ca\"}":{"__typename":"DeepDives","uuid":"c1dbda5b-e3ea-4985-8987-058b9cbcc8ca","content":"\u003cp\u003eI’m extremely proud of the way I’ve grown into a more positive and grounded person. I used to constantly chase the next big thing, thinking that happiness was always just around the corner. But over time, I’ve learned to slow down, appreciate the present, and find joy in the little things — whether it’s a sunny walk to class, a good laugh with a friend, or a quiet moment to myself. Choosing to live in the moment has changed my outlook on life, and I’m really proud of the peace and perspective that’s brought me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ab2ed31f-4f14-45be-abc0-c812820f702d\"}":{"__typename":"DeepDives","uuid":"ab2ed31f-4f14-45be-abc0-c812820f702d","content":"\u003cp\u003eI think one of the greatest resources for learning are your peers. Time and time again, I have found them to be the most honest and relatable teachers I know! They understand how to break down content in a way that's easy for their classmates to understand, and I ultimately seek to pass this forward, serving as a mentor to break down hard to understand topic for my students. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"47ef6dd6-9c57-40ee-a4c8-7ae045e7a23b\"}":{"__typename":"DeepDives","uuid":"47ef6dd6-9c57-40ee-a4c8-7ae045e7a23b","content":"\u003cp\u003eI love to do my nails. Currently, I am obsessed with chrome powders, cat-eye gel polishes, and nail art stickers! There's something so therapeutic about putting on a T.V. show and working on your nails for a few hours.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"39bb954b-f0a7-4fe3-a1ea-3cbde98cfbda\"}":{"__typename":"School","uuid":"39bb954b-f0a7-4fe3-a1ea-3cbde98cfbda","name":"Piedmont Hills High School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95132"},"Education:{\"uuid\":\"4ae47ca3-54a8-42c2-b2ac-c6662b2963f7\"}":{"__typename":"Education","uuid":"4ae47ca3-54a8-42c2-b2ac-c6662b2963f7","school":{"__ref":"School:{\"uuid\":\"39bb954b-f0a7-4fe3-a1ea-3cbde98cfbda\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"c75a9b60-3c3e-425f-b0c9-126ed09576d0\"}":{"__typename":"Education","uuid":"c75a9b60-3c3e-425f-b0c9-126ed09576d0","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"ca02513c-e5d3-42bd-b6e9-ea0a32a293fc\"}":{"__typename":"MentorPublicProfile","uuid":"ca02513c-e5d3-42bd-b6e9-ea0a32a293fc","displayName":"Joanne W.","slug":"joanne-wu","biography":"\u003cp\u003eHi! My name is Joanne and I'm a biology major studying at Brown University in hopes of becoming a dentist one day. I found my passion for the biological sciences in freshman year of college, with a focus on cellular and molecular biology. In my sophomore year, I discovered my love for teaching when I worked as a teaching assistant for a biology course at my university. I have been an assistant for two semesters, and found that teaching/building relationships with students is incredibly fulfilling. STEM material can be \u003cem\u003etough\u003c/em\u003e, so I really enjoy breaking subjects down with students and working through them together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you ran into me at school, you'd probably find me studying at a library: but aside from my academic experiences, I am involved with extracurricular activities that align with my interests! I am a secretary for my school's predental club and often volunteer at dental events. Some of these events include teaching little kids all about oral health, providing free services to underrepresented communities, or helping out at dental fairs. I am also a volunteer tutor at my school's volunteer/service center, where I tutor the SAT for high school students, helping them to better understand concepts for their exam day.\u003c/p\u003e\u003cp\u003e\u003cbr\u003eIn addition to my academic and extracurricular commitments, I also have a deep passion for supporting underserved communities. This past summer, I spent time volunteering at a local homeless shelter, where I helped organize donations and distribute resources to individuals and families in need. This experience not only opened my eyes to the challenges many people face, but also strengthened my desire to use my education and future career to give back. I continue to volunteer at this center over the summer, hoping to connect to more unhoused folk that need our help. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome of my hobbies include art, manicures/nail art, cooking/baking, shopping, and gaming. I love to create and have been doing art for most of my life (16 years!). I mostly do digital and traditional art, and I have won around 15 awards in art competitions, with the biggest one being first place in a state-wide competition. My creativity also bleeds into my gaming; I am currently building a fantasy world in Minecraft, complete with a guild hall, bakery, flower shop, and more.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat aside, I’m super excited to work with you, whether we’re reviewing cell signaling or just trying to survive midterm season, let’s make it a little more fun (and a lot less stressful) together!\u003c/p\u003e","teachingVideoPlaybackId":"R49yk701e2r800wcudu01pdia7goDsAORqEESU1VpQ021dU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"a1167bdb-c6f7-462c-8ef0-603bedea2fcc\"}"},{"__ref":"Favorites:{\"uuid\":\"2968e155-075c-4a99-8204-94ad93a78791\"}"},{"__ref":"Favorites:{\"uuid\":\"6d48e713-9cae-454b-a8e8-477ef5235e29\"}"}],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8fb68596-0827-4983-9ac2-b32753d2a07e\"}"},{"__ref":"DeepDives:{\"uuid\":\"c1dbda5b-e3ea-4985-8987-058b9cbcc8ca\"}"},{"__ref":"DeepDives:{\"uuid\":\"ab2ed31f-4f14-45be-abc0-c812820f702d\"}"},{"__ref":"DeepDives:{\"uuid\":\"47ef6dd6-9c57-40ee-a4c8-7ae045e7a23b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d4ab73fc-8ddb-400a-a4d2-c242f11ac3ff/-/preview/-/format/jpg/","https://ucarecdn.com/8da3239f-86c3-4b6b-9dfc-cb615d104e51/-/preview/-/format/jpg/","https://ucarecdn.com/69515164-b5bd-4490-896e-3e784a6122ec/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4ae47ca3-54a8-42c2-b2ac-c6662b2963f7\"}"},{"__ref":"Education:{\"uuid\":\"c75a9b60-3c3e-425f-b0c9-126ed09576d0\"}"}],"hiredAt":"2025-04-18T21:22:30.029Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","6-8 Grade Science","Chemistry","Biology","Academic Coaching","Executive Function","Visual Arts / Graphic Design","STEM Project"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/"],"res
