xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"469fe761-0736-497b-a0dc-f953bf3e4d23\"}":{"__typename":"DeepDives","uuid":"469fe761-0736-497b-a0dc-f953bf3e4d23","content":"\u003cp\u003eI started at USC as just a business major because I believe it was something that would open a lot of doors down the road, but ended up adding Cognitive Science(which has nothing to do with business). Cognitive Science is a mix of Neuroscience, Philosophy, Psychology with options to take classes in coding, linguistics, and lots of other cool subjects that I felt could be really interesting and round out my holistic education. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4a98689d-7fff-4906-ba30-dfcb54cb32a0\"}":{"__typename":"DeepDives","uuid":"4a98689d-7fff-4906-ba30-dfcb54cb32a0","content":"\u003cp\u003eMy dream job is to eventual help start an NFL expansion team in London. As American Football becomes more and more international with games in Germany, the UK, Brazil and flag football in the 2028 Olympics, I think the next frontier is getting an actual team across the pond. Being a part of that hypothetical team and leaving a lasting legacy and creating something that has never been done would be a dream come true. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"2b71b7b9-fbc6-42b9-90e3-71981e9390d6\"}":{"__typename":"DeepDives","uuid":"2b71b7b9-fbc6-42b9-90e3-71981e9390d6","content":"\u003cp\u003eI love to get lost. I recently studied abroad and had the opportunity to learn about and enjoy so many new places. I always try my best to make an adventure out of everything and add life to my days. Exploring nature, cultural hubs, local restaurants and events are all such incredible ways to grow as a person and learn about the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9d248c3f-ed00-45a5-8a13-bdda661b9d2d\"}":{"__typename":"DeepDives","uuid":"9d248c3f-ed00-45a5-8a13-bdda661b9d2d","content":"\u003cp\u003eThrough circumstances in my personal life as well as my natural disposition, I've always been extremely independent. I've navigated the college application process, starting my professional career, and everything in between without guidance. It was very difficult on me and times and I always wished I had someone to help me with advice and support who had gone down the route I wanted to put myself on and now I want to be that person for others. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"2888a21f-ba9c-4618-894f-a0da8291ed8a\"}":{"__typename":"School","uuid":"2888a21f-ba9c-4618-894f-a0da8291ed8a","name":"Newport Harbor High School","city":"Newport Beach","type":"HIGH","state":"California","country":"United States","zip":"92663"},"Education:{\"uuid\":\"0ec5cfa4-b8b2-4c8b-b601-02d4967ed4fe\"}":{"__typename":"Education","uuid":"0ec5cfa4-b8b2-4c8b-b601-02d4967ed4fe","school":{"__ref":"School:{\"uuid\":\"2888a21f-ba9c-4618-894f-a0da8291ed8a\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"7ebb254e-95d4-47ee-9e58-7d69d5260cbf\"}":{"__typename":"Education","uuid":"7ebb254e-95d4-47ee-9e58-7d69d5260cbf","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Business Administration + Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"ea62ed40-dcd2-4e02-a140-d36f9e493c3c\"}":{"__typename":"MentorPublicProfile","uuid":"ea62ed40-dcd2-4e02-a140-d36f9e493c3c","displayName":"Joseph V.","slug":"joseph-vargasbrownlee","biography":"\u003cp\u003eJoey is a rising senior at the University of Southern California, double majoring in Business Administration and Cognitive Science with a minor in Sports Media Industries. He is from Newport Beach, California, but spent 5 years growing up in Costa Rica along with stints Netherlands, New York City, Nevada, and Florida. Throughout his upbringing and different adventures, Joey recognized the power sports has to bring communities together: across languages, cultures, and time zones. It doesn't matter if it is playing, watching, or following - athletics is a superpower for connecting with the people around you.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThat is why his goal is to eventually work in the business side of Professional Sports and help to run the teams that bring the world together. He just finished a summer internship with the Miami Dolphins front office in their finance department. Throughout college, he also worked in Game Day Operations with the LA Rams, Recruiting for USC Football, and participated in the inaugural Rose Bowl Mentor program. Outside of sports business, Joey held 2 “Big 4” internships in finance with Deloitte as well as working with Colliers in commercial real estate.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eJoey has always been extremely passionate about making the most of the opportunities presented to him in school. Tracing back to high school, Joey was the president of 2 clubs, DECA and FCA and the varsity tennis captain. Into college, Joey was the president of the Latino Business Student’s Association, is currently the VP of the Sports Business Association and helps run a sports media non profit organization, Exposition.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eJoey’s goal for mentees is to help to utilize his unique work, extracurricular, and academic backgrounds to prepare kids for success in business, sports business, and flourish in new environments. Breaking into any industry, but especially sports, can be extremely difficult without proper “networking” or “connections” and after doing so independently, Joey wishes to be the bridge for ambitious students.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Business Administration + Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"469fe761-0736-497b-a0dc-f953bf3e4d23\"}"},{"__ref":"DeepDives:{\"uuid\":\"4a98689d-7fff-4906-ba30-dfcb54cb32a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"2b71b7b9-fbc6-42b9-90e3-71981e9390d6\"}"},{"__ref":"DeepDives:{\"uuid\":\"9d248c3f-ed00-45a5-8a13-bdda661b9d2d\"}"}],"active":true,"profilePhotos"
