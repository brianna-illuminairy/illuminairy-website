xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ee7a6c4c-51f7-45d3-acfd-0b735b40f1aa\"}":{"__typename":"DeepDives","uuid":"ee7a6c4c-51f7-45d3-acfd-0b735b40f1aa","content":"\u003cp\u003eTake full advantage of every opportunity and resource available to you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"20b1031e-adb7-4218-bc7a-852139551158\"}":{"__typename":"DeepDives","uuid":"20b1031e-adb7-4218-bc7a-852139551158","content":"\u003cp\u003eSocial psychology researcher and/or professor!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"4cf28104-2916-45c1-83a7-7d08053728fe\"}":{"__typename":"DeepDives","uuid":"4cf28104-2916-45c1-83a7-7d08053728fe","content":"\u003cp\u003eMy younger brothers, I want to be the best possible role model to them!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"ed32b80c-edf6-4090-82a3-a5b2b192e559\"}":{"__typename":"DeepDives","uuid":"ed32b80c-edf6-4090-82a3-a5b2b192e559","content":"\u003cp\u003eI was very involved in school extracurriculars including student counsel, a competitive math team, cheerleading, and a government work-study internship program.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"School:{\"uuid\":\"19d98427-1fe4-4b9a-b86c-efd869840f37\"}":{"__typename":"School","uuid":"19d98427-1fe4-4b9a-b86c-efd869840f37","name":"Chesapeake Science Point Charter Middle/High School","city":"Hanover","type":"HIGH","state":"Maryland","country":"United States","zip":"21076"},"Education:{\"uuid\":\"3717341b-963d-47eb-b6a8-742419ca62ea\"}":{"__typename":"Education","uuid":"3717341b-963d-47eb-b6a8-742419ca62ea","school":{"__ref":"School:{\"uuid\":\"19d98427-1fe4-4b9a-b86c-efd869840f37\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"38afa5d2-cf8e-40a7-ba50-bbefc96755da\"}":{"__typename":"Education","uuid":"38afa5d2-cf8e-40a7-ba50-bbefc96755da","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"464c68ae-ef3a-4d55-83cd-bd09f8c78d1c\"}":{"__typename":"MentorPublicProfile","uuid":"464c68ae-ef3a-4d55-83cd-bd09f8c78d1c","displayName":"Maya N.","slug":"maya-nicole","biography":"\u003cp\u003eHi guys! I'm Maya, a junior at Columbia University double majoring in Psychology and African-American studies, with plans to pursue a PhD in social psychology.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eA Little Bit About Me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI'm from Severn, Maryland, and enjoy traveling to learn about different cultures and try new foods. Outside of school, I provide college counseling to high school students, work as a teaching assistant for grad-level psychology courses at Columbia, and volunteer as a research assistant at the Columbia University Perinatal Pathways Lab to research maternal mental health. As a first-generation college student, I'm especially passionate about educational accessibility and love sharing my knowledge and resources with others.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eWhy Curious Cardinals\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’ve previously worked as an academic and executive functioning tutor, a babysitter for toddlers and school-aged children, a summer camp counselor, and a peer advisor for the Columbia Psychology Department. I love working with students of all ages and learning from them! I’m currently working on my psychology senior thesis, which is on the role of positive mentorship as a protective factor for mental health, which aligns perfectly with the work that I hope to do with Curious Cardinals! I'm excited to connect with students to identify projects of interest and help you to work towards your goals!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I Can Help You\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI'm most excited about guiding students with:\u0026nbsp;\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCollege Readiness: Working on college applications, personal statements, building college lists, etc.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eResearch: Navigating the research process, background research, interpreting data, presenting findings, etc.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExecutive Functioning: Time management, planning \u0026amp; scheduling, task management, etc.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSubject Tutoring: Psychology, world history, algebra, AP Calculus AB, etc.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eProfessional Development: Public speaking, networking, resume writing, interview prep, etc.\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eA Typical Session\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might look like:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming and identifying your interests and connecting them to concrete, actionable goals\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMapping out a schedule with specific project milestones to work towards\u0026nbsp;\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eResearching opportunities for you share/present your work\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing presentation skills \u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eSome Fun Facts\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI love exploring New York City and going to different museums, cafes, restaurants, and shows! In my free time, you can find me watching Korean dramas, reading a new book, or walking around the city with friends. I’m so excited to get started with new students!\u003c/p\u003e","teachingVideoPlaybackId":"FJVD4DM8cgX4wDmB9iIhT79wB01lhHgALMXVeJEfuYDA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ee7a6c4c-51f7-45d3-acfd-0b735b40f1aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"20b1031e-adb7-4218-bc7a-852139551158\"}"},{"__ref":"DeepDives:{\"uuid\":\"4cf28104-2916-45c1-83a7-7d08053728fe\"}"},{"__ref
