xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f63e0a9f-1c72-4c5d-b677-f16c7544da79\"}":{"__typename":"Favorites","uuid":"f63e0a9f-1c72-4c5d-b677-f16c7544da79","photoUrl":"https://ucarecdn.com/d2392cf3-6c8f-46c0-ba33-d7bb95eb6796/","title":"Stigma - Taehyung","type":"SONG"},"Favorites:{\"uuid\":\"e4de5516-f621-4d0e-adaf-a1672399eb46\"}":{"__typename":"Favorites","uuid":"e4de5516-f621-4d0e-adaf-a1672399eb46","photoUrl":"https://ucarecdn.com/eb6d8d61-8606-4aee-bdc3-9a676cda023a/","title":"Ho Chi Minh City, Vietnam","type":"CITY"},"Favorites:{\"uuid\":\"db61aac4-9391-414a-bccf-a6b65dad9398\"}":{"__typename":"Favorites","uuid":"db61aac4-9391-414a-bccf-a6b65dad9398","photoUrl":"https://ucarecdn.com/5922cf70-da68-40cb-b3df-ee12b8a3dbb4/","title":"Teamfight Tactics","type":"GAME"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"41a0d5c8-1ee2-4d97-811f-3a744385b2c1\"}":{"__typename":"DeepDives","uuid":"41a0d5c8-1ee2-4d97-811f-3a744385b2c1","content":"\u003cp\u003eMy “north star” is helping people. I aspire to design digital products that create thoughtful, intuitive experiences and reduce cognitive load by making complex things feel simple and accessible. Long term, I hope to grow into a role where I can serve as both a design mentor and a digital experience consultant, sharing what I’ve learned and supporting others who are navigating the same path I once was.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"d8d6558a-1c4a-4fdb-bbe5-c5564c22b258\"}":{"__typename":"DeepDives","uuid":"d8d6558a-1c4a-4fdb-bbe5-c5564c22b258","content":"\u003cp\u003eIn high school, I didn’t yet know what I wanted to pursue, so I explored broadly. I got involved in everything from hospital volunteer work and Science Olympiad to the yearbook committee, community service, and the Asian American Club. Those experiences helped me learn what energized me and taught me the value of curiosity and trying things before committing to a path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"37eace07-16b7-4cd4-a01c-4a25c76c188e\"}":{"__typename":"DeepDives","uuid":"37eace07-16b7-4cd4-a01c-4a25c76c188e","content":"\u003cp\u003eI’d tell my younger self to keep building and trying new things, even when the path feels unclear. Growth comes from exploration, and every attempt teaches you something, even the ones that don’t work out.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"51d9691f-2fb6-4a7c-abe6-3995ae01d9ee\"}":{"__typename":"DeepDives","uuid":"51d9691f-2fb6-4a7c-abe6-3995ae01d9ee","content":"\u003cp\u003eMentorship matters to me because, as a first-generation student, I often felt unsure of what steps to take, from college applications to financial aid applications to planning for my future. I know firsthand how overwhelming it can be to navigate these systems without guidance, and I want to be that source of clarity and support for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"4d3b5d92-0aab-434a-a298-c9bd54e4184c\"}":{"__typename":"School","uuid":"4d3b5d92-0aab-434a-a298-c9bd54e4184c","name":"Central High School","city":"Philadelphia","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19141"},"Education:{\"uuid\":\"8210fc3a-645f-4a96-b5dc-5f77fac3b15e\"}":{"__typename":"Education","uuid":"8210fc3a-645f-4a96-b5dc-5f77fac3b15e","school":{"__ref":"School:{\"uuid\":\"4d3b5d92-0aab-434a-a298-c9bd54e4184c\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"8aaaf0b6-192a-4864-a503-a4970c8de140\"}":{"__typename":"Education","uuid":"8aaaf0b6-192a-4864-a503-a4970c8de140","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Psychology, Design","degree":null},"MentorPublicProfile:{\"uuid\":\"a153e34d-8f60-402e-a204-15476ebaa9a0\"}":{"__typename":"MentorPublicProfile","uuid":"a153e34d-8f60-402e-a204-15476ebaa9a0","displayName":"Jessica M.","slug":"jessica-mach","biography":"\u003cp\u003e\u003cstrong\u003eAbout Me 👋\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eHi! I’m Jessica, a first generation student who is in her 3rd year at the University of Pennsylvania double majoring in Psychology and Design. I’m passionate about helping students explore passion projects or are curious about design.\u0026nbsp;I’m deeply interested in how people think, learn, and grow, especially in a world increasingly shaped by technology. Currently, I am…\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eFacilitating learning and discussions for API high school students (supporting students as they explore critical thinking, and academic growth in a supportive environment) 🌱\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a design portfolio focused on technology and product experiences (with an emphasis on UX, human-centered design, and thoughtful problem-solving) 💻\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eDoing a fellowship where I developed a startup idea (exploring how technology can better support users’ needs, well-being, and everyday decision-making)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConsulting within Penn’s Product Space club (collaborating on research, strategy, and design recommendations for early-stage product ideas that turns big, ambiguous problems into clear, manageable steps)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eConducting research and coursework on AI, technology, and well-being (examining how digital tools shape attention, motivation, and human experience) 🔬\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e🔍 My main interest is in exploring the intersection of psychology, design, and technology through projects that translate complex ideas into clear, user-centered solutions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003cstrong\u003eAcademic Interests\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI’m fascinated by the intersection of:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ehuman behavior\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ecreativity\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eproblem-solving\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e❓ My coursework and projects explore questions like:\u003c/p\u003e\u003cp\u003e\u003cem\u003eHow do people make decisions?\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eWhat helps students stay motivated?\u003c/em\u003e\u003c/p\u003e\u003cp\u003e\u003cem\u003eHow can experiences be designed to support well-being, not overwhelm?\u003c/em\u003e\u003c/p\u003e\u003cp\u003e🎨 These interests have led me toward UX research and design, but also toward mentoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat I Work On Outside the Classroom \u003c/strong\u003e🤝\u003c/p\u003e\u003cp\u003e✍️ I enjoy journaling, asking thoughtful questions, and problem-solving, all of which help me reflect and think intentionally.\u003c/p\u003e\u003cp\u003e⛸️ Outside of academics, my hobbies include ice-skating, junk journaling, and café-hopping, which give me space to recharge creatively and stay curious.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I Can Help \u003c/strong\u003e💡\u003c/p\u003e\u003cp\u003eI believe growth happens when students have space to think out loud, experiment, and learn without fear of being “wrong.” I help 9-12 students through…\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCollege-readiness projects 🎓\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eSupporting students in building research experiences, competitions, portfolios, and presentations that align with their genuine interests\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePassion projects ✍️\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eHelping students turn ideas into meaningful projects, such as launching a club or initiative, designing a creative or UX-focused project, or exploring how technology and creativity intersect.\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eResearch mentorship 🔬\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eGuiding students through the research process, from developing a question and designing a study to analyzing insights and confidently presenting their work.\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePortfolio building 🎨\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eAssisting students in curating thoughtful portfolios, including design work, written reflections, research summaries, or creative projects, for applications or future opportunities.\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eDesign tools \u0026amp; fundamentals 💻\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eIntroducing or strengthening skills in tools like Figma and foundational design principles such as hierarchy, accessibility, and usability.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eTogether, we reflect on progress, celebrate wins (big and small), and work through challenges with curiosity instead of judgment. My goal is not only to help students reach their goals, but to help them better understand themselves along the way. 🌟\u003c/p\u003e","teachingVideoPlaybackId":"G02nDx2cE2N013hDoMh02qwNRyKNzkzu00Q00QozDhvcPtpE","teachingVideoDescription":null,"greatestAchievement":"\u003cblockquote\u003e\u003cp\u003eI’m proud of committing to growth even when things felt uncertain. Instead of waiting until I had everything figured out, I tried new roles, projects, and organizations and learned from each experience. That willingness to explore helped me discover my interests and build confidence, and it showed my parents that hard work and curiosity can create opportunity, even without a clear starting blueprint.\u003c/p\u003e\u003c/blockquote\u003e\u003ch3\u003e\u003c/h3\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f63e0a9f-1c72-4c5d-b677-f16c7544da79\"}"},{"__ref":"Favorites:{\"uuid\":\"e4de5516-f621-4d0e-adaf-a1672399eb46\"}"},{"__ref":"Favorites:{\"uuid\":\"db61aac4-9391
