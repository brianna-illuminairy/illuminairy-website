\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"10c904ba-261f-4278-b575-a25a542f7ec7\"}":{"__typename":"DeepDives","uuid":"10c904ba-261f-4278-b575-a25a542f7ec7","content":"\u003cp\u003eWisdom is not just in books, it is alive inside of us. Mentorship, to me, fulfills our collective responsibility to give it new life in one another. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"02f2b649-6265-4148-a996-ab97d94eca4a\"}":{"__typename":"DeepDives","uuid":"02f2b649-6265-4148-a996-ab97d94eca4a","content":"\u003cp\u003eI want to own a film studio!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"c34d1fab-2a5b-4308-8fab-511b5043b7fe\"}":{"__typename":"DeepDives","uuid":"c34d1fab-2a5b-4308-8fab-511b5043b7fe","content":"\u003cp\u003eI believe that the beauty of literature can change how we live for the better, so long as it is informed by the healthy historical knowledge which always informs our best fantasies. This is especially true for African-Americans, who have both found and fought for great freedom through the written and spoken word. I plan to help further this tradition. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"56a52fb6-d0d4-4aee-8836-d6a2dc2a7bae\"}":{"__typename":"School","uuid":"56a52fb6-d0d4-4aee-8836-d6a2dc2a7bae","name":"Woodward Academy","city":"College Park","type":"HIGH","state":"Georgia","country":"United States","zip":"30337"},"Education:{\"uuid\":\"0909d910-afc1-46e6-9fda-052aea6efec7\"}":{"__typename":"Education","uuid":"0909d910-afc1-46e6-9fda-052aea6efec7","school":{"__ref":"School:{\"uuid\":\"56a52fb6-d0d4-4aee-8836-d6a2dc2a7bae\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"08b0cc83-0ae9-4291-8e6f-9a222000ee6e\"}":{"__typename":"Education","uuid":"08b0cc83-0ae9-4291-8e6f-9a222000ee6e","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"History \u0026 Literature","degree":null},"MentorPublicProfile:{\"uuid\":\"c36a69e8-4109-4054-a8aa-7d5c2f992cc2\"}":{"__typename":"MentorPublicProfile","uuid":"c36a69e8-4109-4054-a8aa-7d5c2f992cc2","displayName":"Malachi R.","slug":"malachi-robinson","biography":"\u003cp\u003eMalachi is a recent graduate of Harvard College where he studied History \u0026amp; Literature and African American studies plus a bit of Egyptian Hieroglyphics. He is currently in his first semester of graduate school at Emory University's Candler School of Theology. Outside of class, he has written journalism, film and music reviews, and creative pieces for The Harvard Crimson and The Harvard Ichthus. He also founded Indigo Magazine, Harvard’s only major Black publication. He recently completed a comedy writing internship and writes and performs stand-up comedy in his free time. A recruit to Harvard’s Policy Debate team, Malachi was a nationally ranked and 2x Georgia State Championship winning Policy Debater at Woodward Academy and has previously worked as an intern for Senator Raphael Warnock and Senator (then congressional candidate) Jon Ossoff. The son of two preachers, Malachi spends at least as much time thinking about Christian theology and ethics as he does thinking about food, literature, music, comedy, and film.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMalachi would love to mentor students in creative writing, debate and public speaking, government and politics, religion, Greco-Roman or Egyptian mythology and culture, biology or the earth sciences, and American and African-American history and culture more broadly. He's also open to mentor students in the sciences more broadly, as he was a Science Olympiad kid in high school, and to help out younger students struggling with math, since he's interested in making it more accessible for untraditional audiences. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eProject ideas he'd be excited to pursue with a mentee include anything from creating an original stand-up comedy set or magazine issue to writing a research report on geology or the mathematics of hip-hop. \u003c/p\u003e","teachingVideoPlaybackId":"xCd2TGNHfZ3fI3SB1b022q3XVduof01QIo6FEMV7A2AKE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eAfter winning the highest graduation honor at my high school, I delivered a commencement address which the school has continued to show students and use in the classroom several years after. It is still available on YouTube if you'd like to watch it. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"85a97bcf-4116-4871-a780-63965d53cba0\"}"},{"__ref":"Favorites:{\"uuid\":\"c36e6bb5-56ad-4604-8898-f611140c0a0b\"}"},{"__ref":"Favorites:{\"uuid\":\"a37a6722-32a5-4431-b9a5-378e11603ec3\"}"}],"causesSupported":[{"__ref":"CausesSupported:
