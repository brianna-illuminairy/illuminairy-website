xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"dab51484-cd14-4000-b149-0bd9b2d590f9\"}":{"__typename":"DeepDives","uuid":"dab51484-cd14-4000-b149-0bd9b2d590f9","content":"\u003cp\u003eTeaching! I love learning. And I love sharing what I've learned with others. More specifically, I see myself becoming a high school math teacher after my time in college. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eTeachers can make or break the academic trajectory of a student in any given moment. And math is a difficult subject for many. I would love to be the reason that a student pursues math, challenges themself to get an A in a difficult math course, or quite simply realizes that math maybe doesn't suck so bad after all. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eOr maybe I'll open a restaurant, create my own gameshow, or travel the world and get famous from vlogging on YouTube. Just kidding... or maybe not, my biggest advice to any young person is to never limit yourself, always be open minded to new possibilities! But for the time being, my answer is teaching.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ca23bf9a-2ddf-45dc-a795-30bdaf3fb8b3\"}":{"__typename":"DeepDives","uuid":"ca23bf9a-2ddf-45dc-a795-30bdaf3fb8b3","content":null,"videoPlaybackId":"01RVDfQQqg1dGm7Ny01hJxCIblBqNx3lwxwbhUHKAQfP4","question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"b8fd333e-7bb1-4c33-b788-15b1f0dce979\"}":{"__typename":"DeepDives","uuid":"b8fd333e-7bb1-4c33-b788-15b1f0dce979","content":null,"videoPlaybackId":"IplbEDI7VJk7UG5uE4slbDoy9acbJVy8n12UNHwvujU","question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"1b0a6b79-d4a8-42c7-a3f8-f441eb8c3e82\"}":{"__typename":"DeepDives","uuid":"1b0a6b79-d4a8-42c7-a3f8-f441eb8c3e82","content":null,"videoPlaybackId":"21oUj294LpLMDthE7MAQTmrGYMaTFuMmFncEPadsQpM","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a\"}":{"__typename":"School","uuid":"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a","name":"Cambridge Rindge \u0026 Latin School","city":"Cambridge","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"c444f152-4cb9-4b81-88a3-cbb32478b139\"}":{"__typename":"Education","uuid":"c444f152-4cb9-4b81-88a3-cbb32478b139","school":{"__ref":"School:{\"uuid\":\"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}":{"__typename":"School","uuid":"0505e371-93af-4291-ab60-2728b5ad4443","name":"Northeastern University","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02115"},"Education:{\"uuid\":\"7183e50a-aee8-48ac-a572-08582c90059e\"}":{"__typename":"Education","uuid":"7183e50a-aee8-48ac-a572-08582c90059e","school":{"__ref":"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mathematics and Psychology","degree":null},"MentorPublicProfile:{\"uuid\":\"368c709e-c2c7-4f90-aa3d-b1dbe88712ae\"}":{"__typename":"MentorPublicProfile","uuid":"368c709e-c2c7-4f90-aa3d-b1dbe88712ae","displayName":"Gavi E.","slug":"elijandro-escamillasalomon","biography":"\u003cp\u003eHi! My name is Gavi and I’m a second year student at Northeastern University in Boston. I’ve lived my whole life right next door in Cambridge, MA, which you may have heard of since some pretty famous universities such as Harvard and MIT are there. Growing up, I went to a bilingual K-8 school where I mastered both written and spoken Spanish, and then attended high school at Cambridge Rindge \u0026amp; Latin, located right outside of Harvard Square. My roots are that I am both Chicano and Jewish, and I’ve been raised by two moms. A fun fact is that I have a twin sister, so if you have a twin then I can definitely relate!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have many interests so, at Northeastern, I’m pursuing a combined major in both Math and Psychology, as well as a minor in Entrepreneurship. That may sound like a lot, so I usually just say I’m a math major when anyone asks. As much as I love math and the satisfaction that comes with solving a tough problem, I couldn’t limit myself to studying just one thing, and psychology has helped me better understand how people think, socialize, and learn, among many other things. Lastly, I am an entrepreneur myself, having run my own sneaker reselling business since my freshman year of high school, so studying entrepreneurship was naturally something I couldn’t resist. My sneaker business has opened up some incredible opportunities for me, such as having the chance to interact with NBA players as my customers and having my own booth at large scale sneaker conventions. So with that being said, if running your own businesses is something that interests you, I’d love to share my insight and experience.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn addition to Curious Cardinals, I’ve held several mentoring positions including teaching 8th grade summer math classes, coaching basketball with 5th-8th grade students, volunteering as a mentor in a community center in my city, and working as a one-to-one aide at a local summer camp. Each of these experiences has been really transformative and increased my motivation to continue mentoring and, in the long run, I want to become the ultimate mentor - a teacher. That’s one of the reasons why I joined Curious Cardinals, to help me improve and polish my teaching skills, but more importantly I am incredibly excited to forge one-on-one mentoring relationships that will hopefully leave an impact that lasts a lifetime, both for the mentee and also for me.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of work and school, I love sports, travelling the world, and collecting sneakers and clothing. My favorite sport is basketball and I like to play at least a few times a week. Being from the Boston area, I have the luxury of being a Celtics fan and honestly, I could talk about basketball for days on end. I’m also a big soccer fan, and I support Barcelona with my favorite player being Gavi, of course. A few more fun facts are that my favorite movies are He Got Game, Good Will Hunting, and anything MCU, my favorite color is purple, and my favorite food is any variation of chicken and rice.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m a big believer that, in mentor-mentee relationships, the mentee can very much teach the mentor as much as they are being taught, so I can’t wait to see what I will learn with and from my Curious Cardinals mentees.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"jqo8uy9C01YoUtC102Zcc5xAcYrljiEasSKWTS01PrASv00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mathematics and Psychology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dab51484-cd14-4000-b149-0bd9b2d590f9\"}"},{"__ref":"DeepDives:{\"uuid\":\"ca23bf9a-2ddf-45dc-a795-30bdaf3fb8b3\"}"},{"__ref":"DeepDives:{\"uuid\":\"b8fd333e-7bb1-4c33-b788-15b1f0dce979\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b0a6b79-d4a8-42c7-a3f8-f441eb8c3e82\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b9242b4b-3327-4558-a060-02c309a8e54f/-/preview/-/format/jpg/","https://ucarecdn.com/7091a3ef-365c-4ee8-8dc9-525e661adb4d/-/preview/-/format/jpg/","https://ucarecdn.com/8cdd8739-acb9-42f1-a944-705bd62bfd01/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c444f152-4cb9-4b81-88a3-cbb32478b139\"}"},{"__ref":"Education:{\"uuid\":\"7183e50a-aee8-48ac-a572-08582c90059e\"}"}],"hiredAt":"2025-01-04T22:26:22.244Z","topics":["K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Calculus","Statistics","Algebra I","Algebra II"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elijandro-escamillasalomon\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"368c709e-c2c7-4f90-aa3d-b1dbe88712ae\"}"}}},"_sentryTraceData":"25a78cdbe42e4ee99a15d039389d9697-bee3deae9c09bb0e-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=25a78cdbe42e4ee99a15d039389d9697,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"elijandro-escamillasalomon"},"bui
