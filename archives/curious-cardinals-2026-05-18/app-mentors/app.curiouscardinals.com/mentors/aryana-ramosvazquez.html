xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c1718570-4aa9-4231-afb8-c425e23e92f7\"}":{"__typename":"Favorites","uuid":"c1718570-4aa9-4231-afb8-c425e23e92f7","photoUrl":"https://ucarecdn.com/ce9272a9-5384-4f55-a226-1d838c6eac14/","title":"The Fifth Element","type":"MOVIE"},"Favorites:{\"uuid\":\"a1c5d012-3092-499c-a5d0-b5fe0e967e4f\"}":{"__typename":"Favorites","uuid":"a1c5d012-3092-499c-a5d0-b5fe0e967e4f","photoUrl":"https://ucarecdn.com/3c0e733b-bf87-463d-9b88-630c1a212c18/","title":"BAILE INoLVIDABLE by Bad Bunny","type":"SONG"},"Favorites:{\"uuid\":\"9cbe5a0c-8e3e-472f-afe2-8b5b962fb663\"}":{"__typename":"Favorites","uuid":"9cbe5a0c-8e3e-472f-afe2-8b5b962fb663","photoUrl":"https://ucarecdn.com/47bdc8b0-5b2f-4a3d-bb90-7ec931c121ad/","title":"Adam Driver","type":"ACTOR"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"7a4a9cf6-ad70-44ce-9e3c-9fa7bea3de57\"}":{"__typename":"DeepDives","uuid":"7a4a9cf6-ad70-44ce-9e3c-9fa7bea3de57","content":"\u003cp\u003eI enjoy writing creatively (long-form fiction, sometimes poetry), crafting (jewelry, crochet, and embroidery), and watching movies with friends! I also enjoy brewing and mixing teas and going on solo-walks around town! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"af4a16d3-8164-4515-9e1b-226c8d450377\"}":{"__typename":"DeepDives","uuid":"af4a16d3-8164-4515-9e1b-226c8d450377","content":"\u003cp\u003eDuring my first term of undergrad, I last-minute dropped a seminar and signed up for “The Human Brain,” an introductory neuroscience course that broadly surveys functional neuroanatomy and related clinical studies and technologies. There, I learned about optogenetics, a method of precisely manipulating the behavior of populations of neurons in model organisms. I did some research on my own and read about neuromodulation, which falls under the umbrella of BCI, which excited me deeply. I realized rather shortly that I wanted to potentially pursue a career in this field, and so, I was deciding between majoring in Neuroscience, Biomedical Engineering, or potentially pursuing a Special Divisional major (build-your-own curriculum) in Biomedical Engineering and Electrical Engineering. After discussions with the Directors of Undergraduate Studies for those majors, I decided to major in Biomedical Engineering because of its built-in interdisciplinary curriculum, which I thought would prepare me very well in understanding many of the subdisciplines of BCI literature!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"132455a9-6946-4332-9243-2030c14313f2\"}":{"__typename":"DeepDives","uuid":"132455a9-6946-4332-9243-2030c14313f2","content":"\u003cp\u003eIn high school, I created a youth-led, international, online literary magazine called Coexist. My goal was to center social issues such as national conflicts, mental health, diversity \u0026amp; inclusion in creative writing. I developed it mostly thanks to, and in collaboration with, a friend of mine that I made through creating Coexist. We ended up having staff writers from many countries around the world, hosted a writing competition with solid turnout, and created two full-length literary magazine issues. The process of creating Coexist taught me so much about website design, social media marketing, organization and team leading, layout design, and magazine editing. It is currently on an indefinite haitus, but it holds a very special place in my heart, and I am grateful for my time developing Coexist with the many other people who made it possible! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"d7479771-fe89-410a-8679-cb5fcb745cc4\"}":{"__typename":"DeepDives","uuid":"d7479771-fe89-410a-8679-cb5fcb745cc4","content":"\u003cp\u003eI love mentoring students because I owe so much of my success to the older students and professors who not only provided practical advice in my endeavors, but also believed in me and encouraged me. \u003c/p\u003e\u003cbr\u003e\u003cp\u003ePursuing new activities and projects is a hard endeavor! I want to be that support for students who are figuring out their passions and paving a path towards their futures. I want to be in their corner and help guide them through their journey because I owe so much to the people in my life who did that for me! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}":{"__typename":"School","uuid":"62e59c56-ee46-4213-b082-758af3ff99db","name":"Phillips Exeter Academy","city":"Exeter","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03833"},"Education:{\"uuid\":\"821bf0d1-b04b-4fec-8e4b-c6265b82619b\"}":{"__typename":"Education","uuid":"821bf0d1-b04b-4fec-8e4b-c6265b82619b","school":{"__ref":"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"4d710ba6-e9f2-45e2-bab7-6813eb8531c1\"}":{"__typename":"Education","uuid":"4d710ba6-e9f2-45e2-bab7-6813eb8531c1","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"37632e16-6de3-44ed-82a7-0f055336c46a\"}":{"__typename":"MentorPublicProfile","uuid":"37632e16-6de3-44ed-82a7-0f055336c46a","displayName":"Aryana R.","slug":"aryana-ramosvazquez","biography":"\u003cp\u003eHello! My name is Aryana Ramos-Vazquez, and I am currently a senior (’26) at Yale University, majoring in Biomedical Engineering with a concentration in biomedical images and signals. My passion is in brain-computer interfacing (BCI), and I hope to develop assistive technology in the future using neuroelectronics! While that sounds very technical, a fun fact about me is that I didn’t even know I wanted to pursue engineering until I was already at college! I applied to Yale as an Ethnicity, Race, and Migration major, hoping to pursue immigration law. I had a fantastic and eye-opening experience interning at the House of Representatives my senior year of high school, graciously sponsored by Phillips Exeter Academy’s DC program, which made me realize my heart was not in politics. I took a few exploratory courses my first year in my undergrad and found my way to the expansive and budding field of BCI.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of biomedical engineering, I am a passionate creative writer (I have participated in NaNoWriMo for many, many years) and hobbyist crafter! I have previously developed, managed, and edited a literary magazine in high school, but now I simply have a few creative projects I work on at a time. Beyond creating, I sing with the Yale Glee Club (one of my favorite groups and experiences during my time at Yale), and I am a Co-Chair of Despierta Boricua, Yale’s Puerto Rican student organization. I also serve as a Science, Technology, and Research Scholars (STARS) Mentor for incoming first years to help their transition to STEM at Yale. Additionally, I currently conduct research at the Asynchronous VLSI and Architecture Lab (Electrical Engineering) at Yale, helping develop a novel BCI chip! To prepare myself for conducting BCI research, I’ve had to take a fair amount of classes outside of my major, as well as self-learning, so I am also excited to share some of the lessons I’ve learned!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAll that is to say, I have many different passions and a solid foundation in the creative and literary arts and social justice work, as well as data analysis and the biomedical sciences! Having multiple interests does not take away from the depth at which you can engage with them, and I hope to infuse that lesson into my conversations with prospective students! I am incredibly excited to mentor students and help them engage with their interests and passions!\u003c/p\u003e","teachingVideoPlaybackId":"AYIIR4Vggm01J02ZC41YaOiP1pz4bb81xwHH4LGsTWCaM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c1718570-4aa9-4231-afb8-c425e23e92f7\"}"},{"__ref":"Favorites:{\"uuid\":\"a1c5d012-3092-499c-a5d0-b5fe0e967e4f\"}"},{"__ref":"Favorites:{\"uuid\":\"9cbe5a0c-8e3e-472f-afe2-8b5b962fb663\"}"}],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7a4a9cf6-ad70-44ce-
