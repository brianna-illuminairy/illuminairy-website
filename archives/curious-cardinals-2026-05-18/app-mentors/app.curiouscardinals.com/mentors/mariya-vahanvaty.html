xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"9ceee4ee-264c-4238-83d4-929a82e5e25c\"}":{"__typename":"DeepDives","uuid":"9ceee4ee-264c-4238-83d4-929a82e5e25c","content":"\u003cp\u003eStay true to what genuinely interests you, even if it feels different from what others are doing—those passions will shape who you are and where you’re meant to go. Trust yourself and lean in to what excites you!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"fac9eeb8-797d-4ad0-ba24-dd1db8ee0339\"}":{"__typename":"DeepDives","uuid":"fac9eeb8-797d-4ad0-ba24-dd1db8ee0339","content":"\u003cp\u003eDuring high school, I ensured my summers balanced academics and personal growth—often attending university programs on topics I was passionate about for a few weeks, and working as a camp counselor for a more social/active experience. These experiences enriched my summers in unique ways and provided me with some of my fondest memories.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b1322d90-484e-4bbd-9572-3c55757949f1\"}":{"__typename":"DeepDives","uuid":"b1322d90-484e-4bbd-9572-3c55757949f1","content":"\u003cp\u003eMy dream job is one that allows me to do something new every single day while making a meaningful impact. Whether as a teacher, social worker, I dream of a role that lets me interact with different people every day and address the systemic  problems in my community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1e40cf09-d5ad-44b4-b202-f7406393d8c6\"}":{"__typename":"DeepDives","uuid":"1e40cf09-d5ad-44b4-b202-f7406393d8c6","content":"\u003cp\u003eMy greatest motivation comes from the belief that small actions can lead to big changes—whether doing something nice for a friend or committing myself to my work, I hope that can cause a ripple effect for positive change.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"7a5d6dc5-919b-401b-af40-c953c4ab1eca\"}":{"__typename":"School","uuid":"7a5d6dc5-919b-401b-af40-c953c4ab1eca","name":"American Community School of Abu Dhabi","city":"Abu Dhabi","type":"HIGH","state":"Abu Dhabi","country":"United Arab Emirates","zip":"00000"},"Education:{\"uuid\":\"64a2aa76-640b-4b8a-8283-6b08ffa32e2d\"}":{"__typename":"Education","uuid":"64a2aa76-640b-4b8a-8283-6b08ffa32e2d","school":{"__ref":"School:{\"uuid\":\"7a5d6dc5-919b-401b-af40-c953c4ab1eca\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"35bff6ca-6f4c-4b60-83be-ad3c94af8022\"}":{"__typename":"Education","uuid":"35bff6ca-6f4c-4b60-83be-ad3c94af8022","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Sociology/Education","degree":null},"MentorPublicProfile:{\"uuid\":\"714791e4-e237-4250-805c-6bd751a4eb14\"}":{"__typename":"MentorPublicProfile","uuid":"714791e4-e237-4250-805c-6bd751a4eb14","displayName":"Mariya V.","slug":"mariya-vahanvaty","biography":"\u003cp\u003eHi, I’m Mariya! I’m a senior at Dartmouth College, who someday dreams of working in education policy or social work.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy academic and extracurricular focus has always been on working with and empowering young people, and I’m studying Sociology and Education to deepen that impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy passion for sociology began in high school when I produced a documentary exploring the cultural experiences of immigrants in the U.S. When I got to Dartmouth, I was thrilled to find sociology as a major that encompassed my interests, especially in issues of income and educational inequality in the U.S.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring my summers I have worked as a camp counselor, developed curricula, and taught middle school writing and art courses, fundamentally hoping to address the underlying achievement gaps in public schools across the US. I am passionate about using the power of speech and writing to advocate for others and make your voice heard.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am also pursuing a minor in Spanish, which has enabled me to travel all over the world and even spend a term studying abroad in Spain. Engaging with diverse cultures has been integral to my education and understanding of the world around me, especially after spending my high school years in the United Arab Emirates, where I learned the value of learning in diverse cultural contexts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not in the classroom you will probably find me on stage! I am the president of my social justice based a cappella group and have been in dozens of theater productions throughout life. Whether up on stage or in the audience, I love to participate in performance in any form, and I’m enthusiastic to learn about new mediums of art.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOtherwise, you will probably find me outdoors. I love to take advantage of the natural world around me and will often be found hiking up a mountain, swimming in a river, biking, camping, skiing, or anything else that takes me outside.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSharing my experiences and helping your student explore their own passions and goals would be an incredible privilege!\u003c/p\u003e","teachingVideoPlaybackId":"pwOHR9xLcBnvnS1ok7FQMYEsCOqmS01gcINA02JgtjnUg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Sociology/Education","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9ceee4ee-264c-4238-83d4-929a82e5e25c\"}"},{"__ref":"DeepDives:{\"uuid\":\"fac9eeb8-797d-4ad0-ba24-dd1db8ee0339\"}"},{"__ref":"DeepDives:{\"uuid\":\"b1322d90-484e-4bbd-9572-3c55757949f1\"}"},{"__ref":"DeepDives:{\"uuid\":\"1e40cf09-d5ad-44b4-b202-f7406393d8c6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/52259619-9f13-4977-8747-2982f24845fd/-/preview/-/format/jpg/","https://ucarecdn.com/c517a301-07c9-4050-b035-cc9a9a0bcaad/-/preview/-/format/jpg/","https://ucarecdn.com/323188e6-8e46-44a5-8f04-ddf8348a0026/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"64a2aa76-640b-4b8a-8283-6b08ffa32e2d\"}"},{
