xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"a579122e-216f-4b16-97e1-e15fca3a049e\"}":{"__typename":"DeepDives","uuid":"a579122e-216f-4b16-97e1-e15fca3a049e","content":"\u003cp\u003eTime goes fast so enjoy it while you are in the moment. Explore and try new things. Learn something new everyday. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"28b4c6eb-ad30-4ea8-a9c0-2c2bc2d5724e\"}":{"__typename":"DeepDives","uuid":"28b4c6eb-ad30-4ea8-a9c0-2c2bc2d5724e","content":"\u003cp\u003eOrthopedic Surgeon\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"b84e8976-53ce-4fae-851c-2791fe727db7\"}":{"__typename":"DeepDives","uuid":"b84e8976-53ce-4fae-851c-2791fe727db7","content":"\u003cp\u003eMy family and friends! I couldn't do life without them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"23223e84-06e5-46a5-aba7-27eb180b1ccb\"}":{"__typename":"DeepDives","uuid":"23223e84-06e5-46a5-aba7-27eb180b1ccb","content":"\u003cp\u003eI spent most of my summers training for soccer. I loved staying active and outside during the summer and the comradery of the team. During the summer after my junior year, I performed antibiotic research with the mentorship of a high school professor. I presented my results at a symposium during my senior year and submitted my data to the Tiny Earth database at the University of Wisconsin. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"e554ed0b-1440-4650-8b1c-ba14fe9a5768\"}":{"__typename":"School","uuid":"e554ed0b-1440-4650-8b1c-ba14fe9a5768","name":"The Summit Country Day School","city":"Cincinnati","type":"HIGH","state":"Ohio","country":"United States","zip":"45208"},"Education:{\"uuid\":\"37743735-b63a-4831-a92d-3cae8df2182f\"}":{"__typename":"Education","uuid":"37743735-b63a-4831-a92d-3cae8df2182f","school":{"__ref":"School:{\"uuid\":\"e554ed0b-1440-4650-8b1c-ba14fe9a5768\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"c406c52a-27ed-4afa-aadd-3f7c73e16f43\"}":{"__typename":"Education","uuid":"c406c52a-27ed-4afa-aadd-3f7c73e16f43","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biological Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"1cb36073-276c-4d63-8a86-3b637ac3500a\"}":{"__typename":"MentorPublicProfile","uuid":"1cb36073-276c-4d63-8a86-3b637ac3500a","displayName":"Sam P.","slug":"sam-perez-1","biography":"\u003cp\u003eHi! My name is Sam, and I am currently a first-year medical student at the Northwestern University Feinberg School of Medicine. I graduated from Northwestern University in December 2024 with a major in Biological Sciences and a minor in Psychology. My curiosity about how the human body works and how science can be used to restore health has been the driving force behind my academic and professional journey. I am especially passionate about orthopedics and the biological basis of cancer, two fields that combine my love for problem-solving with my desire to help people regain function and quality of life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy interest in medicine is built on both academic study and hands-on experience. For two summers, I conducted research at the University of Cincinnati College of Medicine, studying the role of metabolism in pancreatic cancer development. This work deepened my understanding of how cancer develops at the molecular level and inspired me to write an article exploring the possible benefits of minimally invasive pancreas surgery. I also gained clinical experience working as a physical therapy aide, where I observed the rehabilitation process firsthand and learned the value of patient-centered care.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my time at Northwestern, I pursued opportunities to serve and lead. I volunteered in the emergency department at a local hospital, where I supported patients and families during moments of uncertainty. As Vice President of Finance for Phi Delta Epsilon Medical Fraternity, I helped manage budgets and organize events for members pursuing careers in healthcare. I also worked as a peer tutor for general and organic chemistry, guiding fellow students through challenging coursework and helping them build confidence in their problem-solving skills.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics and professional work, I have a lifelong love for sports and teamwork. I enjoy playing golf and soccer, and I’m an enthusiastic supporter of the Cincinnati Bengals, Tottenham Hotspur FC, and McLaren F1 Team. Whether on the field or in the classroom, I value dedication, preparation, and collaboration; all skills I bring to my role as a mentor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a tutor, my goal is to help students not only excel in their academics but also develop a genuine passion for learning. I believe that understanding the “why” behind concepts makes all the difference, and I strive to create an encouraging, engaging environment where students can ask questions, explore ideas, and discover their own academic strengths. I am committed to supporting each student’s growth and helping them achieve their fullest potential.\u003c/p\u003e","teachingVideoPlaybackId":"01n1L1WzpGMBq2GBeVLhX8R4pE5Lk8lVPDHwElmkzmKE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eStarting medical school!\u003c/p\u003e","favorites":[],"causesSupported":[],"major":"Biological Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"a579122e-216f-4b16-97e1-e15fca3a049e\"}"},{"__ref":"DeepDives:{\"uuid\":\"28b4c6eb-ad30-4ea8-a9c0-2c2bc2d5724e\"}"},{"__ref":"DeepDives:{\"uuid\":\"b84e8976-53ce-4fae-851c-2791fe727db7\"}"},{"__ref":"DeepDives:{\"uuid\":\"23223e84-06e5-46a5-aba7-27eb180b1ccb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4ded8055-1f91-4da0-bd52-5bd5988caacf/-/preview/-/format/jpg/","https://ucarecdn.com/c9b2a12f-630a-4911-8e6d-540015f8ca73/-/preview/-/format/jpg/","https://ucarecdn.com/16544f9d-31b3-4519-8a20-88aa5c389a19/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"37743735-b63a-4831-a92d-3cae8df2182f\"}"},{"__ref":"Education:{\"uuid\":\"c406c52a-27ed-4afa-aadd-3f7c73e16f43\"}"}],"hiredAt":"2024-03-19T22:09:00.251Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra
