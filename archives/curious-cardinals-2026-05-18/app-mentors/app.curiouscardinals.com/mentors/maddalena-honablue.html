xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"14aae0a3-186b-4afc-a1e3-3b9248f8193e\"}":{"__typename":"Favorites","uuid":"14aae0a3-186b-4afc-a1e3-3b9248f8193e","photoUrl":"https://ucarecdn.com/430036d0-2151-4456-b8cf-966bcf4a1570/","title":"Recursion by Blake Crouch","type":"BOOK"},"Favorites:{\"uuid\":\"84b37a50-7472-4552-a846-afc616142f32\"}":{"__typename":"Favorites","uuid":"84b37a50-7472-4552-a846-afc616142f32","photoUrl":"https://ucarecdn.com/b5046ce9-ac6b-4029-a5d8-410739599af1/","title":"In Rainbows","type":"ALBUM"},"Favorites:{\"uuid\":\"bcf220ce-cc80-4e03-b521-aaaaae6b3966\"}":{"__typename":"Favorites","uuid":"bcf220ce-cc80-4e03-b521-aaaaae6b3966","photoUrl":"https://ucarecdn.com/f88c4595-620b-4df4-962f-beb3df463391/","title":"Swimming","type":"SPORT"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"3a88fdcb-958c-4372-a4df-a104e4a7f30e\"}":{"__typename":"DeepDives","uuid":"3a88fdcb-958c-4372-a4df-a104e4a7f30e","content":"\u003cp\u003eI have always loved being in nature in any capacity. It has always been a refuge where I find solace and comfort.\u0026nbsp; My journey towards environmental studies began during my junior year of high school when I took my first environmental science class. It was there that I was challenged to confront the immense gravity of global warming for the first time. This class ignited my passion for conservation and sustainable alternatives. It led me to enroll in an environmental studies course in the Fall semester of my first year at Brown University. In this class, I learned about the history of “the theory of wilderness”—the idea of undisturbed or self-regulated land. I discovered that minority communities often find this concept of wilderness inaccessible and difficult to relate to, as they frequently lack the time and access required to visit wilderness areas.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThis disparity resonated deeply with me, as it brought to light the intersection of my lifelong love for wilderness and awareness of biases against it. The primary environmental goals for my community at boarding school were conservation of resources and sustainable energy, discussions where the concept of wilderness played a central role in environmental preservation. Conversely, in my community back home in Jackson Heights, New York, substandard housing and public health took precedence in environmental justice concerns.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy upbringing in these two distinct environments underscored the stark disparities in environmental justice priorities. I chose environmental studies as my major not only because of my belief in the urgency of addressing global warming and my passion for preserving the environment, but also because of my personal encounters with environmental justice disparities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"33f2497b-d1c4-4f7e-b1c8-cb5c7711755a\"}":{"__typename":"DeepDives","uuid":"33f2497b-d1c4-4f7e-b1c8-cb5c7711755a","content":null,"videoPlaybackId":"4ePmjfM9yzRxvtC4QZj1STrxJpmfc3001rB004vmQywFU","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c94329e0-2b21-49a9-8f77-5a1599730a6c\"}":{"__typename":"DeepDives","uuid":"c94329e0-2b21-49a9-8f77-5a1599730a6c","content":null,"videoPlaybackId":"mtXVmOxB9k4dRUevr02C93GV8IuqfvPnDsepmnu202o9M","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"358a5a43-08e4-432d-a29f-7a77d7a569d8\"}":{"__typename":"School","uuid":"358a5a43-08e4-432d-a29f-7a77d7a569d8","name":"Deerfield Academy","city":"Deerfield","type":"HIGH","state":"Massachusetts","country":"United States","zip":"01342"},"Education:{\"uuid\":\"b63ba796-293a-4900-b14c-bb3dc989a1c9\"}":{"__typename":"Education","uuid":"b63ba796-293a-4900-b14c-bb3dc989a1c9","school":{"__ref":"School:{\"uuid\":\"358a5a43-08e4-432d-a29f-7a77d7a569d8\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"48b395a2-1002-4390-ac31-094d3e4809d9\"}":{"__typename":"Education","uuid":"48b395a2-1002-4390-ac31-094d3e4809d9","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Environmental Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"785f484b-ec13-4cbb-b944-2c0af8802725\"}":{"__typename":"MentorPublicProfile","uuid":"785f484b-ec13-4cbb-b944-2c0af8802725","displayName":"Maddalena H.","slug":"maddalena-honablue","biography":"\u003cp\u003eHi! My name is Maddalena, and I’m a third-year student at Brown University. I was raised in Jackson Heights, New York – the most diverse neighborhood in the world! Growing up in such a vibrant and multicultural environment has shaped me into an avid foodie, a lover of different cultures, and a passionate traveler. I’ve had the opportunity to travel to London this past summer through Brown's summer literature course, during which I studied at Regent's University. I learned about the city's history and culture through lectures, tours, and literary works by Virginia Woolf, Charles Dickens, and Sam Selvon. Most recently, I studied abroad in Granada, Spain for 5 months, completing a Spanish language immersion course and living with a host family. I am always looking for ways to expand my perspective of the world and find inspiration by learning from others' lived experiences.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m deeply passionate about music, having sung both as a soloist and in music groups since I was 7 years old. This love for music has shaped much of who I am, and it continues to inspire me in everything I do. I am continuing my love of music at Brown, working as a researcher for the Black Music Nomad podcast. I manage the website, social media, and communications for the podcast.\u0026nbsp;I am also heavily involved in a cappella at Brown and have just become the new president of The Brown Jabberwocks!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of music, I study Environmental Studies at Brown, with a focus on sustainable urban planning, creative writing, and literature. In my coursework, I have researched how cities are designed to serve their communities, written and workshopped original memoir and nonfiction, and explored how stories — from ancient epics to contemporary novels — help us make sense of the world. I have also worked as a teaching assistant, supporting a large undergraduate course and providing feedback on student writing.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether I am helping a student find their voice in an essay, work through a tricky concept, or simply build confidence in a subject they find challenging, I bring genuine curiosity, patience, and care to every session. Mentorship is a role that has always come naturally to me. In high school, I volunteered with the Big Brothers Big Sisters program, mentoring an 8-year-old girl for two years. I also served as a live-in proctor for 18 10th-grade girls, helping them navigate both academic and social challenges. In Granada, Spain, I volunteered weekly with Casa Kuna, a nonprofit organization dedicated to supporting immigrant families in vulnerable situations, for their after-school student program. These experiences have taught me the importance of guidance, support, and connection, and I’m excited to take on a mentorship role again with Curious Cardinals.\u003cbr\u003eI hope to share my passions for the environment, urban planning, music, reading, and creative writing with students. I am looking forward to gaining new interests and inspiration from the future students I guide!\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"Wmq3QEXbj5e1NDKmH00T98800VcfvXWIpqrWQZkwQJzKs","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"14aae0a3-186b-4afc-a1e3-3b9248f8193e\"}"},{"__ref":"Favorites:{\"uuid\":\"84b37a50-7472-4552-a846-afc616142f32\"}"},{"__ref":"Favorites:{\"uuid\":\"bcf220ce-cc80-4e03-b521-aaaaae6b3966\"}"}],"causesSupported":[],"major":"Environmental Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3a88fdcb-958c-4372-a4df-a104e4a7f30e\"}"},{"__ref":"DeepDives:{\"uuid\":\"33f2497b-d1c4-4f7e-b1c8-cb5c7711755a\"}"},{"__ref":"DeepDives:{\"uuid\":\"c94329e0-2b21-49a9-8f77-5a1599730a6c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d2a148d4-ad0b-4816-b7c2-26d1ac58cad9/-/preview/-/format/jpg/","https://ucarecdn.com/ee3e2484-bf1f-483f-953c-801a3de856e5/-/preview/-/format/jpg/","https://ucarecdn.com/e2c1b551-bab6-4d75-ae69-95db281c9929/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b63ba796-293a-4900-b14c-bb3dc989a1c9\"}"},{"__ref":"Education:{\"uuid\":\"48b395a2-1002-4390-ac31-094d3e4809d9\"}"}],"hiredAt":"2024-07-18T01:11:09.461Z","topics":["Writing","Spanish","College Essay Writing","Executive Function","History","Reading","Creative Writing","Film / Theater","History Project","K-6 Storybook","Music","Video / Photography","STEM Project","Web Design","Law / Government / Policy","Sustainability"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"maddalena-honablue\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"785f484b-ec13-4cbb-b944-2c0af8802725\"}"}}},"_sentryTraceData":"b8816369dd744617b87f7ac9d7d647bc-b9b312ed8c79c14e-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=b8816369dd744617b87f7ac9d7d647bc,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"maddalena-honablue"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:
