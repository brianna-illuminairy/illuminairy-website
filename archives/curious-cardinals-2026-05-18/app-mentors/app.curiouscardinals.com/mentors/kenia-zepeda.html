rganization, Phoenix Scholars Program. She also holds leadership positions in her school’s pre-medical and female, Latinx clubs. Over the summers, Kenia has worked with UC San Francisco and Los Angeles in medical education programs and research. \n\nIn high school, Kenia enjoyed participating in various extracurricular activities on top of several AP and community college classes. Kenia engaged in sports year-round such as soccer, cross-country, and track and field, for which she won many regional awards. She also attended a running camp for two years. She loved volunteering at her local hospital and various school events during all four years of high school. She held leadership positions in her school’s science club, AVID, and the National Honor Society. Kenia also had two jobs; one as an associate at In-N-Out Burger and the other as her high school’s receptionist. When she wasn’t in running camp, she spent her summers learning about health-related topics and careers at Johns Hopkins University and the University of Arizona. \n\nHaving had many great teachers and mentors, Kenia is very eager to work with all students and inspire passion and curiosity in everyone. \n","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Human Biology","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/fa65dd3e-6862-4f2a-bbc6-939b33980eff/-/crop/714x715/0,44/-/preview/-/format/jpg/"],"pronouns":null,"gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b9a20c42-dd96-49f7-8eb4-be0aed359341\"}"}],"hiredAt":"2023-04-03T20:29:22.528Z","topics":["Cooking","World Cultures","Women \u0026 Gender Studies","Race \u0026 Ethnicity","Law / Government / Policy","Global Health","Public Speaking","Medicine / Health","Statistics","Precalculus / Trigonometry","Pre-Algebra","K-5 Grade Math","Geometry","Calculus","Algebra II","Algebra I","Physics","6-8 Grade Science","Chemistry","Biology","Reading
