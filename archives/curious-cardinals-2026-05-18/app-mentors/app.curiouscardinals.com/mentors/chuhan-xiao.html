xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"e46a7907-0aba-4fd0-875f-e65f748aecb0\"}":{"__typename":"Favorites","uuid":"e46a7907-0aba-4fd0-875f-e65f748aecb0","photoUrl":"https://ucarecdn.com/bb488f44-19c3-4bb9-a09f-d71079d0a85c/","title":"Cillian Murphy ","type":"ACTOR"},"Favorites:{\"uuid\":\"404d5a29-81fe-4706-9dd0-6307889e6794\"}":{"__typename":"Favorites","uuid":"404d5a29-81fe-4706-9dd0-6307889e6794","photoUrl":"https://ucarecdn.com/10d9729c-fc56-4397-a116-18481ec3c5d0/","title":"Asap Rocky","type":"ARTIST"},"Favorites:{\"uuid\":\"f95fff9f-3d79-427e-a992-76ac6f5d0451\"}":{"__typename":"Favorites","uuid":"f95fff9f-3d79-427e-a992-76ac6f5d0451","photoUrl":"https://ucarecdn.com/4ad54aa8-0063-49fd-912f-21258cb3e212/","title":"Puss in boots 2: The last wish ","type":"MOVIE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"919f6a96-0375-482d-9f09-5679ececad9d\"}":{"__typename":"DeepDives","uuid":"919f6a96-0375-482d-9f09-5679ececad9d","content":"\u003cp\u003eDo what works for you and dream big. You define what work-life balance looks like, not the rest of the world. Some days, it may be 80-20 instead of 50-50; other days, you may not work at all—and that's okay.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6fd791fe-e720-4a67-9f82-301510ccb182\"}":{"__typename":"DeepDives","uuid":"6fd791fe-e720-4a67-9f82-301510ccb182","content":"\u003cp\u003eI believe that iron sharpens iron, and that the people close to me have a strong influence on who I become. Having a like-minded individual join me on my journey and being able to positively impact them in return means the world to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"d4cbceb6-9c71-4bbd-be7a-5fbab91e8c35\"}":{"__typename":"DeepDives","uuid":"d4cbceb6-9c71-4bbd-be7a-5fbab91e8c35","content":"\u003cp\u003eI actually lived in China for eleven years before moving to the U.S. Even though I visit every year and still am fluent in Mandarin, I've adapted so well that I sometimes forget I've spent the majority of my life in my motherland. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"50a0082e-b239-4b2c-92e8-dd778466b0df\"}":{"__typename":"DeepDives","uuid":"50a0082e-b239-4b2c-92e8-dd778466b0df","content":"\u003cp\u003eMy greatest mentor is my former private college counselor Kate Stone. She's provided me with valuable insights on business as well as many impactful life advice.  I don't think I would be the person I am today without her guidance. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"bd82ae8e-4c65-48e5-936a-925785a9fba1\"}":{"__typename":"School","uuid":"bd82ae8e-4c65-48e5-936a-925785a9fba1","name":"Sonoma Academy","city":"Santa Rosa","type":"HIGH","state":"California","country":"United States","zip":"95404"},"Education:{\"uuid\":\"a9a626d4-6ab2-4772-bbdd-b2e6d020e643\"}":{"__typename":"Education","uuid":"a9a626d4-6ab2-4772-bbdd-b2e6d020e643","school":{"__ref":"School:{\"uuid\":\"bd82ae8e-4c65-48e5-936a-925785a9fba1\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b8d7ac6b-1315-4810-aad9-7d5923c30a74\"}":{"__typename":"School","uuid":"b8d7ac6b-1315-4810-aad9-7d5923c30a74","name":"University of California San Diego","city":"La Jolla","type":"COLLEGE","state":"California","country":"United States","zip":"92093"},"Education:{\"uuid\":\"d4127d0a-6e53-49ba-b77c-a71e462762a5\"}":{"__typename":"Education","uuid":"d4127d0a-6e53-49ba-b77c-a71e462762a5","school":{"__ref":"School:{\"uuid\":\"b8d7ac6b-1315-4810-aad9-7d5923c30a74\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2026","major":"Business Economics ","degree":null},"MentorPublicProfile:{\"uuid\":\"7ad14531-1171-4871-b741-e752a6dc43f4\"}":{"__typename":"MentorPublicProfile","uuid":"7ad14531-1171-4871-b741-e752a6dc43f4","displayName":"Henry X.","slug":"chuhan-xiao","biography":"\u003cp\u003eHello, my name is Henry. I am a second-year Business Economics student at UC San Diego. I plan to pursue a career in sales and, eventually, entrepreneurship. I’m using my business classes to build interpersonal skills like negotiation and leadership, while my economics classes focus on data analysis to prepare me for future investments. Although I could graduate this year, I plan to stay a quarter or two longer to minor in real estate development or finance. My goal in business and life centers on the principle of mutual benefit, or “win-win” in simple terms. I’m committed to deals that benefit both myself and the customer, with this belief forming the backbone of my approach to sales. I emphasize communication and collaboration as they often help me reach better outcomes for everyone involved.\u003c/p\u003e\u003cp\u003eMy biggest dream is to become the best version of myself, which would allow me to contribute as much as I can to the world. I truly believe that to whom much is given, much is expected. So, I spend most of my time outside of school learning new skills or gaining knowledge to improve myself—almost like leveling up in video games. When I do take breaks, I enjoy playing chess, listening to music, and going to the gym. My most unique experience has been selling medical devices to doctors in Mexico using broken Spanish for my startup. I’ve learned that in business, conditions are often less than ideal, and problems are plenty. But it’s up to me to approach everything with a sincere attitude and a problem-solving mindset.\u003c/p\u003e\u003cp\u003eMy teaching style is interactive; I make sure to engage my mentees during our sessions. I use examples and interesting practice problems to ensure that our studies are not only efficient but enjoyable. I believe everyone has their own learning style, and I do my best to tailor to the specific needs of each mentee.\u003c/p\u003e","teachingVideoPlaybackId":"EFl01JCbmnuSOBgx2feZhkpOfOHyqYsmYStLG2R01wvC8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"e46a7907-0aba-4fd0-875f-e65f748aecb0\"}"},{"__ref":"Favorites:{\"uuid\":\"404d5a29-81fe-4706-9dd0-6307889e6794\"}"},{"__ref":"Favorites:{\"uuid\":\"f95fff9f-3d79-427e-a992-76ac6f5d0451\"}"}],"causesSupported":[],"major":"Business Economics ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"919f6a96-0375-482d-9f09-5679ececad9d\"}"},{"__ref":"DeepDives:{\"uuid\":\"6fd791fe-e720-4a67-9f82-301510ccb182\"}"},{"__ref":"DeepDives:{\"uuid\":\"d4cbceb6-9c71-4bbd-be7a-5fbab91e8c35\"}"},{"__ref":"DeepDives:{\"uuid\":\"50a0082e-b239-4b2c-92e8-dd778466b0df\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2b60d34b-7050-448c-88bc-8fa289470f52/-/preview/-/format/jpg/","https:/
