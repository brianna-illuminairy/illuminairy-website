xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"5135051b-13f4-4635-a812-d3baf1d0f680\"}":{"__typename":"Favorites","uuid":"5135051b-13f4-4635-a812-d3baf1d0f680","photoUrl":"https://ucarecdn.com/5dcce6f1-976b-4c6f-a50d-87607f66388f/","title":"WALL-E","type":"MOVIE"},"Favorites:{\"uuid\":\"8b91cb4b-2a16-4216-adfa-c2d979431eae\"}":{"__typename":"Favorites","uuid":"8b91cb4b-2a16-4216-adfa-c2d979431eae","photoUrl":"https://ucarecdn.com/9cd0d0c6-223c-42bb-bad2-983b4e3ed4e6/","title":"Rachmaninoff","type":"ARTIST"},"Favorites:{\"uuid\":\"5a6230cc-8d71-4387-bec5-f5d191ba2a73\"}":{"__typename":"Favorites","uuid":"5a6230cc-8d71-4387-bec5-f5d191ba2a73","photoUrl":"https://ucarecdn.com/2796a5bd-ee3d-458a-bd5f-2e3109bd992b/","title":"The Last Lecture","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"45105158-9e04-4b9a-8b78-6b5a933a6219\"}":{"__typename":"DeepDives","uuid":"45105158-9e04-4b9a-8b78-6b5a933a6219","content":"\u003cp\u003eI've been very fortunate to have had some incredible teachers who helped me grow into the person I am today. My piano teacher taught me for 13 years and encouraged me to audition to become a volunteer pianist at the Charlotte Douglas International Airport, which became the most transformative experience of my life. My pre-calculus and calculus teacher taught me what it means to truly understand a topic, how to develop my critical thinking and problem-solving skills, and allowed me to TA his class, giving me my first formal teaching experience. Knowing how crucial these teachers were to my development, I want to give back and provide mentorship to others so they can grow into the best version of themselves.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"3483c425-c99f-4f92-90d5-3a2c383ee398\"}":{"__typename":"DeepDives","uuid":"3483c425-c99f-4f92-90d5-3a2c383ee398","content":"\u003cp\u003eI went to piano and math/research summer programs! Before my junior year, I attended Interlochen and Boston University Tanglewood Institute for their piano summer intensives, as well as NCSSM Summer Ventures at East Carolina University for Discrete Mathematics. Since I had such amazing experiences meeting like-minded peers with shared drive and interests, I decided to spend the next summer away as well! I attended Berklee College of Music's Keyboard Workshop and North Carolina Governor's School for Mathematics, where I researched mathematical models for drug levels in the bloodstream over time, played lots and lots of spikeball with my peers (I was crowned the spikeball champion), and had a blast performing Hey Jude by The Beatles and Bohemian Rhapsody by Queen with my friends at the open mic nights!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ce71628b-a539-470c-a91d-6286b443ec21\"}":{"__typename":"DeepDives","uuid":"ce71628b-a539-470c-a91d-6286b443ec21","content":"\u003cp\u003eI love playing the piano and can easily spend 2-3 hours practicing Rachmaninoff's Third Piano Concerto, Poulenc's Concerto for Two Pianos, movie themes (like Interstellar, The Greatest Showman, and Star Wars), pop/rock songs (Don't Stop Me Now by Queen, Ordinary by Alex Warren, and Good Days by SZA), anime music (Unravel by Animenz, Attack on Titan, Demon Slayer), and even Rush E! Aside from piano, I absolutely love playing volleyball, spikeball, and ping-pong with my friends, weightlifting, and listening to classical music.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"22f1917f-2b92-4411-bb70-b84bdaac18fc\"}":{"__typename":"DeepDives","uuid":"22f1917f-2b92-4411-bb70-b84bdaac18fc","content":"\u003cp\u003eSimilar to many others, I chose chemical engineering because I loved AP chemistry, physics, and calculus in high school, and wanted to combine these subjects to solve problems! While chemical engineering is not what I initially expected, it aligns well with my interests!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"d68c3c29-a299-4615-ae37-f0445753f750\"}":{"__typename":"School","uuid":"d68c3c29-a299-4615-ae37-f0445753f750","name":"Community School of Davidson - Elementary, Middle, and High School","city":"Davidson","type":"HIGH","state":"North Carolina","country":"United States","zip":"28036"},"Education:{\"uuid\":\"96d5650d-ef7c-46d8-9ecc-eda3c07a2d90\"}":{"__typename":"Education","uuid":"96d5650d-ef7c-46d8-9ecc-eda3c07a2d90","school":{"__ref":"School:{\"uuid\":\"d68c3c29-a299-4615-ae37-f0445753f750\"}"},"startYear":"2011","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"07ae8c5a-a3d6-473e-806b-93e47d9f406e\"}":{"__typename":"Education","uuid":"07ae8c5a-a3d6-473e-806b-93e47d9f406e","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Chemical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"3005af19-91f4-43b7-bf40-c9669c66f284\"}":{"__typename":"MentorPublicProfile","uuid":"3005af19-91f4-43b7-bf40-c9669c66f284","displayName":"Evan B.","slug":"evan-brezicki","biography":"\u003cp\u003eHi! My name is Evan Brezicki, and I'm a sophomore Chemical Engineer at Cornell University. I love learning and sharing my passion for learning with others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI've loved math and science ever since I was little. I put myself on the advanced math and science track, attended two prestigious summer math and research programs, and enjoyed TAing for AP calculus and helping my peers learn AP chemistry and physics. Additionally, I spent my weekends performing piano at the Charlotte Douglas International Airport, recording videos for my YouTube channel, and composing original music for a musical I wrote with my friend.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHow this translated to college\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eI am the Pressure Subteam and Safety Team Lead on Cornell ChemE Car where we build a shoe-boxed size car powered on chemical reactions. We recently placed 3rd in the 2025 AIChE international competition!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI was a TA for physics mechanics and heat where I discovered how students learn, gain understanding, and sort information.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI am a piano teacher in the Cornell Piano Society where I teach four students weekly hour-long lessons and help them improve their technique, musicianship, and ability to sight-read and read sheet music.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI am involved in chamber music where I've performed pieces for two pianos with my friend the last few semesters. I'm looking forward to performing with a cellist this semester!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI'm auditioning to become a chimesmaster with hopes to arrange and compose lots of music for the chimes for future students to play!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePreparing for college\u003c/strong\u003e (essays, extracurriculars, how to stand out)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003ePassion projects\u003c/strong\u003e (starting a business, research in STEM, composing music)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eBuilding a social media following\u003c/strong\u003e (how I blew up and what I wish I knew)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eHow to best learn\u003c/strong\u003e (metacognition, forced recall, intuition building)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eSTEM subject guidance \u003c/strong\u003e(math, physics, chemistry, etc.)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhat does a session with me look like?\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBrainstorming project ideas to transform your passion into meaningful, real-world impacts\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding a weekly roadmap to keep you feeling confident in your progress\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelping you overcome any challenges you encounter while giving you the tools to independently solve future difficulties\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down complex concepts into graspable ideas to help you build strong intuition\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eMotivating you to become the best version of yourself!\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eIf you're excited to explore a passion, build a project, and prepare for the future, I'd love to work with you!\u003c/p\u003e","teachingVideoPlaybackId":"5W9U8Gfd6M8KRh01VhD5100EG00I3VWWHIK7JDwkYuUfkY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"5135051b-13f4-4635-a812-d3baf1d0f680\"}"},{"__ref":"Favorites:{\"uuid\":\"8b91cb4b-2a16-4216-adfa-c2d979431eae\"}"},{"__ref":"Favorites:{\"uuid\":\"5a6230cc-8d71-4387-bec5-f5d191ba2a73\"}"}],"causesSupported":[],"major":"Chemical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"45105158-9e04-4b9a-8b78-6b5a933a6219\"}"},{"__ref":"DeepDives:{\"uuid\":\"3483c425-c99f-4f92-90d5-3a2c383ee398\"}"},{"__ref":"DeepDives:{\"uuid\":\"ce71628b-a539-470c-a91d-6286b443ec21\"}"},{"__ref":"DeepDives:{\"uuid\":\"22f1917f-2b92-4411-bb70-b84bdaac18fc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2e1bcc79-b8a7-4e04-8e50-f6b90ae9efa1/-/preview/-/format/jpg/","https://ucarecdn.com/9e22fa7c-39e5-4fba-b3f7-530055833ed2/-/preview/-/format/jpg/","https://ucarecdn.com/b7e69c11-6028-45c2-8373-b7ec510ad0ff/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"96d5650d-ef7c-46d8-9ecc-eda3c07a2d90\"}"},{"__ref":"Education:{\"uuid\":\"07ae8c5a-a3d6-473e-806b-93e47d9f406e\"}"}],"hiredAt":"2026-02-11T19:21:09.164Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Precalculus / Trigonometry",
