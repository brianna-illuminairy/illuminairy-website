98-ac36-4c7c-b44b-ef11a498ed4c\"}":{"__typename":"Education","uuid":"7f134598-ac36-4c7c-b44b-ef11a498ed4c","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English","degree":null},"MentorPublicProfile:{\"uuid\":\"59ab37c1-dc44-43d3-97a8-217ce20d1f68\"}":{"__typename":"MentorPublicProfile","uuid":"59ab37c1-dc44-43d3-97a8-217ce20d1f68","displayName":"Rainier H.","slug":"rainier-harris","biography":"\u003cp\u003eRainier is a senior studying English at Columbia University. A Queens, New York native, he is a journalist and most recently worked at Bloomberg News. He reported on the space industry 🚀🌕! Rainier has written for national and local papers including \u003cem\u003eThe New York Times. \u003c/em\u003eHe has also interned at \u003cem\u003eThe Ringer\u003c/em\u003e, a sports and entertainment site owned by Spotify. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBesides tutoring in academic subjects, Rainier can help mentees with passion projects. He started freelance writing in high school. He wrote fiction and reported for his local newspaper, \u003cem\u003eThe Queens Daily Eagle\u003c/em\u003e. For his hometown paper, he wrote an article debunking false claims an agency made about a flood. New York City Council cited his work in an accountability hearing. He's wanted to do journalism ever since.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt WNYC, NPR's New York radio station, he made a 7 minute feature broadcasted on \u003cem\u003eMorning Edition\u003c/em\u003e. There, he learned how to write \"for the ear\" instead of for the page. He also worked as an apprentice on President Obama's podcast \u003cem\u003eRenegades\u003c/em\u003e: \u003cem\u003eBorn in the USA. \u003c/em\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of journalism, Rainier is a musician. He has played the alto saxophone since he was 9 years old. He played in Jazz at Lincoln Center programs in middle school and high school. He enjoys listening to classical, jazz, and rap music. He loves going to museums and his favorite one is the Louvre in Paris. He went on his first plane less than two years ago but he loves traveling. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eRainier is an avid reader and his favorite author is Ernest Hemingway. He also enjoys reading Ta Nehisi-Coates, James Baldwin, and Toni Morrison. He likes to play tennis, run, and walk in the park. He has also started drawing comics and painting landscapes recently. His favorite cartoon character is Snoopy and his favorite movie is \u003cem\u003eThe Lion King\u003c/em\u003e. \u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"msz9xwyWvkFbke2p01OK1NYohsy3JDF102EAcds87RJ6I","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"9c675019-9bc2-400e-a16a-ae4493f6df80\"}"},{"__ref":"Favorites:{\"uuid\":\"77a7ee6d-1796-43ad-a291-a3e597a69d99\"}"},{"__ref":"Favorites:{\"uuid\":\"f33c8d93-d067-4e11-9346-c2e8b9ee5e09\"}"}],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7103dbc6-3ce1-49bc-bcc3-22a9c62e3576\"}"},{"__ref":"DeepDives:{\"uuid\":\"89449654-0826-4587-816d-b35c291c73d8\"}"},{"__ref":"DeepDives:{\"uuid\":\"7a0803ce-e3c7-4903-8bb8-ecd29d2c6722\"}"},{"__ref":"DeepDives:{\"uuid\":\"ae7749b7-809d-4726-852c-5f8f1fe1d93a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/384452c6-0b5f-4a62-8f93-1a4b1b48c93f/-/preview/-/format/jpg/","https://ucarecdn.com/130c6f17-6648-4cb2-a3c2-9f7b5d983f02/-/preview/-/format/jpg/","https://ucarecdn.com/419a2734-3a05-48bf-b5cc-21fe63f4bf92/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b3989b50-565a-4131-8191-74ac343a5b5f\"}"},{"__ref":"Education:{\"uuid\":\"7f134598-ac36-4c7c-b44b-ef11a498ed4c\"}"}],"hiredAt":"2024-10-09T12:19:14.653Z","topics":["Business / Entrepreneurship","Negotiation","History","Video / Photography","Fil
