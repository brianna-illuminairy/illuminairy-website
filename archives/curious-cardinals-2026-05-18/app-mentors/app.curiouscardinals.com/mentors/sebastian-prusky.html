xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7c7030c2-c0fe-43c7-86d9-47de902db9ae\"}":{"__typename":"Favorites","uuid":"7c7030c2-c0fe-43c7-86d9-47de902db9ae","photoUrl":"https://ucarecdn.com/1b294f53-ab92-448c-8b1e-cd5e6d097649/","title":"Rodeo","type":"ALBUM"},"Favorites:{\"uuid\":\"f059fb85-3f36-4ee7-92cf-8a36ccfad160\"}":{"__typename":"Favorites","uuid":"f059fb85-3f36-4ee7-92cf-8a36ccfad160","photoUrl":"https://ucarecdn.com/c8a57702-7af2-4a53-85c0-bcde3dc96f86/","title":"Miami","type":"CITY"},"Favorites:{\"uuid\":\"f2957cca-29c7-45db-9165-bccbf514ade3\"}":{"__typename":"Favorites","uuid":"f2957cca-29c7-45db-9165-bccbf514ade3","photoUrl":"https://ucarecdn.com/5f804f6e-dd34-4f06-acb8-b5fe16be3701/","title":"Se7en","type":"MOVIE"},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"be9106fa-4f39-448f-b8a2-a5f5fe2a5cde\"}":{"__typename":"DeepDives","uuid":"be9106fa-4f39-448f-b8a2-a5f5fe2a5cde","content":"\u003cp\u003eI admire my dad so much because of the risks he takes for himself and his future, and by extension, for his family. Him and my mom took the risk of moving to the US, far from their families, and he continued to take risks by starting his own marketing agency soon after moving here. I see the amount of expertise in his industry and entrepreneurship skills he's built up over the years, and I want to one day learn similar skills of risk-taking and leadership.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"7820d2e4-e4e2-4e54-bc9e-4e555ff93eb3\"}":{"__typename":"DeepDives","uuid":"7820d2e4-e4e2-4e54-bc9e-4e555ff93eb3","content":"\u003cp\u003eWhen I look back on my younger self, I instantly notice so much growth, even just thinking about a few years ago. I've realized that I'm always learning and growing, even if it doesn't feel like it at one given moment. I think if I was my younger self again and I could hear advice from my older self or even just see how I was doing, it'd teach me a lot and make me more satisfied with myself. Hopefully as a mentor I can have a similar effect on someone else and help them learn about themselves through the perspective of someone a little older than them that's recently gone through similar things.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"12921b44-ef7e-451c-a197-0c83dbc36ed6\"}":{"__typename":"DeepDives","uuid":"12921b44-ef7e-451c-a197-0c83dbc36ed6","content":"\u003cp\u003eThe most vivid dream I've ever had was one where the whole world was one big island and it was being flooded by a giant tsunami. I had to jump out of a window and dive off the edge of the island to escape, where I swam until I found a group of survivors living on the coast in a safe area and I lived out the rest of my life peacefully with them.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"eb15944e-35a7-46b7-9239-e79250a69826\"}":{"__typename":"DeepDives","uuid":"eb15944e-35a7-46b7-9239-e79250a69826","content":"\u003cp\u003eI'd tell myself to have confidence in the decisions I took and not overthink the \"what ifs\" of if I had chosen another option, even if I will never know for sure what would've been better.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"ab85a757-97de-4765-9a4d-67cf241ac892\"}":{"__typename":"School","uuid":"ab85a757-97de-4765-9a4d-67cf241ac892","name":"Gulliver Prep | Upper School Campus","city":"Pinecrest","type":"HIGH","state":"Florida","country":"United States","zip":"33156"},"Education:{\"uuid\":\"6ed42ace-2550-4c2d-85f2-120eb9ccbd48\"}":{"__typename":"Education","uuid":"6ed42ace-2550-4c2d-85f2-120eb9ccbd48","school":{"__ref":"School:{\"uuid\":\"ab85a757-97de-4765-9a4d-67cf241ac892\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"93d8ff78-c3c9-40c1-b473-9a89ec0ae9c2\"}":{"__typename":"Education","uuid":"93d8ff78-c3c9-40c1-b473-9a89ec0ae9c2","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Industrial Engineering \u0026 MMSS","degree":null},"Testimonial:bfe3755b-5d46-49a0-a1dd-2479312c763c":{"__typename":"Testimonial","id":"bfe3755b-5d46-49a0-a1dd-2479312c763c","text":"Sebastian is an absolute rockstar! He transformed Algebra from a daunting subject to a fascinating challenge for my son. His infectious enthusiasm and unwavering dedication motivated my son to reach new heights. We're forever grateful for his exceptional teaching skills and commitment to his students' success!","date":"2025-06-06 19:40:51.412+00","rating":5,"endorser":{"__typename":"Endorser","name":"Alexandra Wilson","tagline":"","avatar":null}},"Testimonial:513fd4c7-6fff-4939-a5f8-132e0c368b5f":{"__typename":"Testimonial","id":"513fd4c7-6fff-4939-a5f8-132e0c368b5f","text":"My son has really benefitted from his algebra sessions with Sebastian. I highly recommend him and appreciate how Curious Cardinals matched my son so well with his mentor.","date":"2025-05-27 21:42:32.141+00","rating":5,"endorser":{"__typename":"Endorser","name":"Alexandra Wilson","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"c08d57bc-667b-47f7-b760-22e4fc5b3316\"}":{"__typename":"MentorPublicProfile","uuid":"c08d57bc-667b-47f7-b760-22e4fc5b3316","displayName":"Sebastian P.","slug":"sebastian-prusky","biography":"\u003cp\u003eHi, I'm Sebastian. I'm a sophomore at Northwestern from Miami, studying Industrial Engineering with a minor in Computer Science. Since I was young, I've always had an interest in math, science, and anything related to numbers.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt the start of high school, I got really into biology. I joined the biomed program at my school and took more science classes in chemistry and physics to explore similar subjects. As the years went on, I realized that I liked the analytical part of these classes, but wasn't super into the pure science part. I shifted my focus to engineering, initially considering civil engineering, before eventually deciding to major in Industrial Engineering. Beyond academics, I spent a lot of time in high school running on the cross country and track teams and painting for my art classes.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eNow in college and going into my second year, I’m especially interested in how Industrial Engineering connects to tech and design, and I hope to use this foundation to eventually work at a startup or create my own business in tech, AI, or product design, giving me the chance to be in a fast-paced environment where everyone is passionate and focused on building something new.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLooking to expand my studies and challenge myself in new ways, I also joined the Mathematical Methods in the Social Sciences (MMSS) program. Through this program, I've been exposed to the real-world applications of math and statistics to fields like economics, business, and political science. Being part of this program has already opened new doors for me and sparked interests in areas I never thought I’d study just a few years ago.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhile my academic interests tend towards math, engineering, and econ, I also love having a creative outlet and exploring art, fashion, and music. In my senior year of HS I started a streetwear clothing brand with my friend and learned a ton about graphic design, marketing, and branding. We navigated the challenges of creating a business from nothing and spreading the word about our product, motivated by our interest in fashion and the culture that surrounds it. At Northwestern, I'm also a member of Mayfest Productions, a student group that organizes Dillo Day, the largest student-run music festival in the country. Beyond that, I love painting and drawing in my free time, especially with oil paints and colored pencils.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I'm not in class, I love watching thriller movies, going to the gym, exploring Chicago, or spending time at the beach with friends.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a mentor, I aim to help guide younger students to develop and achieve their goals in whatever area that may be. I hope to share the lessons I've learned in the past years with my mentees and help them through some of the same challenges and decisions that I've been through.\u003c/p\u003e","teachingVideoPlaybackId":"emKKhI00HuqNcn1Eq5qhzux00Bl8AcGYXHP1dqMTWtOLI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eDisplaying the paintings I made throughout high school at my senior year art show.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"7c7030c2-c0fe-43c7-86d9-47de902db9ae\"}"},{"__ref":"Favorites:{\"uuid\":\"f059fb85-3f36-4ee7-92cf-8a36ccfad160\"}"},{"__ref":"Favorites:{\"uuid\":\"f2957cca-29c7-45db-9165-bccbf514ade3\"}"}],"causesSupported":[],"major":"Industrial Engineering \u0026 MMSS","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"be9106fa-4f39-448f-b8a2-a5f5fe2a5cde\"}"},{"__ref":"DeepDives:{\"uuid\":\"7820d2e4-e4e2-4e54-bc9e-4e555ff93eb3\"}"},{"__ref":"DeepDives:{\"uuid\":\"12921b44-ef7e-451c-a197-0c83dbc36ed6\"}"},{"__ref":"DeepDives:{\"uuid\":\"eb15944e-35a7-46b7-9239-e79250a69826\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b9a5d5f0-321c-4494-931e-8960722a96d0/-/preview/-/format/jpg/","https://ucarecdn.com/bb170730-fbc3-476a-8b6c-73a2c1bff046/-/preview/-/format/jpg/","https://ucarecdn.com/4762ea10-f424-4616-a61e-39baefd2acea/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"6ed42ace-2550-4c2d-85f2-120eb9ccbd48\"}"},{"__ref":"Education:{\"uuid\":\"93d8ff78-c3c9-40c1-b473-9a89ec0ae9c2\"}"}],"hiredAt":"2024-11-07T09:56:49.948Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Physics","Writing","College Essay Writing","Economics"],"communityBadges":["https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[{"__ref":"Testimonial:bfe3755b-5d46-49a0-a1dd-2479312c763c"},{"__ref":"Testimonial:513fd4c7-6fff-4939-a5f8-132e0c368b5f
