xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"1931a365-d708-4093-b341-e98a2b7bc04b\"}":{"__typename":"Favorites","uuid":"1931a365-d708-4093-b341-e98a2b7bc04b","photoUrl":"https://ucarecdn.com/2d823356-d918-4e66-84d4-8b838e525ef7/","title":"Boston Red Sox","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"8224e250-fc5b-4b09-89ca-2b802f7eb414\"}":{"__typename":"Favorites","uuid":"8224e250-fc5b-4b09-89ca-2b802f7eb414","photoUrl":"https://ucarecdn.com/e96565cd-f1fc-408f-90f0-a2a6dd487519/","title":"Alysa Liu","type":"ATHLETE"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"c1bcf80a-e1f9-442a-b554-6effc80d9fd9\"}":{"__typename":"DeepDives","uuid":"c1bcf80a-e1f9-442a-b554-6effc80d9fd9","content":"\u003cp\u003eMy greatest source of motivation in nearly all areas of my life is the desire for a better world. I'm getting my Doctorate of Physical Therapy so that I can directly improve the lives of people in my community. In my program, I am the Social Justice Liaison, helping to produce a new generation of tolerant and welcoming health professionals. I strive to stand up for those who can't do it for themselves and always consider how what I say will impact those around me, both short- and long-term. This core motivation has informed my academics, spending habits, priorities, the language that I use, and the way I choose to interact with people, all for the better. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"792ac259-e93f-4aea-be1f-ed11305f31cb\"}":{"__typename":"DeepDives","uuid":"792ac259-e93f-4aea-be1f-ed11305f31cb","content":"\u003cp\u003eI chose to study Behavioral Neuroscience with minors in Exercise Science and Philosophy because I believe that a well-rounded education is necessary for future healthcare providers. I always knew that I wanted to work in healthcare because I enjoy helping people and making them feel seen.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"fb5bdde5-1353-4c82-be45-302a459ef307\"}":{"__typename":"DeepDives","uuid":"fb5bdde5-1353-4c82-be45-302a459ef307","content":"\u003cp\u003eMy high school summers were filled with family beach vacations, trips to the dude ranch, volunteering, medical interest camps, backpacking, concerts, and college tours. I look back on all these memories and feel grateful to have had diverse experiences to help mold the person I've become.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"1b3e12c5-6225-4a39-8522-8fd1d4e4c658\"}":{"__typename":"DeepDives","uuid":"1b3e12c5-6225-4a39-8522-8fd1d4e4c658","content":"\u003cp\u003eI have always loved learning (about everything) and have had more questions than there are answers to. I assumed that everyone else in my graduate program would also be driven to learn. Instead, I realized that a love for learning is a gift, developed from an early age, that not everyone has. I am mentoring to be able to provide the space for younger students to feel safe being curious and asking questions, sparking not only a productive series of mentoring sessions, but a lifelong love of learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"a4127478-b536-4a5a-8f9c-476355f5096c\"}":{"__typename":"School","uuid":"a4127478-b536-4a5a-8f9c-476355f5096c","name":"Mayfield Senior School","city":"Pasadena","type":"HIGH","state":"California","country":"United States","zip":"91105"},"Education:{\"uuid\":\"3356607e-03bb-4078-8337-3314bbbd44e4\"}":{"__typename":"Education","uuid":"3356607e-03bb-4078-8337-3314bbbd44e4","school":{"__ref":"School:{\"uuid\":\"a4127478-b536-4a5a-8f9c-476355f5096c\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}":{"__typename":"School","uuid":"0505e371-93af-4291-ab60-2728b5ad4443","name":"Northeastern University","city":"Boston","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02115"},"Education:{\"uuid\":\"2cded70e-7b45-47b1-ad0f-01bba726545d\"}":{"__typename":"Education","uuid":"2cded70e-7b45-47b1-ad0f-01bba726545d","school":{"__ref":"School:{\"uuid\":\"0505e371-93af-4291-ab60-2728b5ad4443\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"Behavioral Neuroscience","degree":null},"MentorPublicProfile:{\"uuid\":\"2040c3ef-1021-44f1-bcd4-9dfc58253025\"}":{"__typename":"MentorPublicProfile","uuid":"2040c3ef-1021-44f1-bcd4-9dfc58253025","displayName":"Mars M.","slug":"margaret-moffat","biography":"\u003cp\u003eThanks for visiting my profile, I’m Mars (they/she)!\u003c/p\u003e\u003cp\u003eI’m a first-year Doctor of Physical Therapy student at Columbia University. Last spring, I graduated magna cum laude from Northeastern University, studying behavioral neuroscience, exercise physiology, and philosophy. Through undergrad, I balanced challenging academics with clinical work, leadership roles, and everyday responsibilities. Those experiences have taught me to stay adaptable, grounded, and engaged, which are lessons I bring to mentoring and to the communities I’m part of.\u003c/p\u003e\u003cp\u003eWhile at Northeastern, I had the opportunity to explore my interests through coursework and experiential learning, a driving reason for why I chose the school. I earned a spot in Nu Rho Psi, the National Neuroscience Honors Society, but I also chose to take courses where I could debate with peers over current events, learn about the ancient philosophers who shaped the field, measure a subject’s VO2 max, and many more fascinating dives into the subjects I studied. My experiential learning came from TAing, club leadership, and most importantly through the co-op program. Applying and interviewing for competitive jobs as a sophomore in college was a huge step into the adult world and fantastic graduate school preparation. I ended up doing two six-month co-ops at PT clinics in Boston, then continued my work at the second clinic for two years before I moved to New York. In my final year, I had the opportunity to develop a capstone project. I wanted to combine my love for physical therapy with neuroscience, so I gathered a collection of studies that support the use of mirror therapy to strengthen motor pathways in stroke survivors and wrote a proposal to further uncover the neural connections that contribute to the mirror neuron system. These learning experiences not only shaped my career path, but also my connections in Boston, fascination with other people’s perspectives, and gratitude for my station in life and healthy body.\u003c/p\u003e\u003cp\u003eOutside of academics, I love rock climbing, live music, food, and travel. Rock climbing, in particular, has shaped how I approach challenges, especially mentoring. Each climb is different: routes can be elusive, requiring patience and creativity, and sometimes progress comes from small, careful maneuvers, rather than drastic leaps. Climbing encourages experimenting with different strategies, adjusting when something isn’t working, celebrating “small” wins, and maintaining a drive to keep moving upward. More importantly, the best climbs are often the ones achieved with collaboration, mutual support, and lessons learned along the way.\u003c/p\u003e\u003cp\u003eI am excited to bring the mindset I have while climbing to mentoring. I enjoy working with middle school, high school, and college students, especially those exploring STEM or healthcare paths, managing busy schedules, or pursuing passion projects. I’ve found a lot of meaning as a peer mentor and tutor, helping classmates break down complex material, build confidence, and tackle challenges collaboratively. I aim to create sessions that encourage curiosity, reflection, and creative problem-solving. The goal is to curate spaces where students feel empowered and excited to take ownership of their learning.\u003c/p\u003e\u003cp\u003eMy approach to mentoring draws on a diverse composition of experience and perspective. I’ve supported patients in multiple physical therapy clinics, learning to engage with all types of learning styles and adapt plans in real time. Studying philosophy has helped me think critically, connecting ideas across disciplines. Leadership roles, such as serving as President of Northeastern Out in STEM and the Columbia DPT Social Justice Liaison, have taught me how to build community and guide others toward their goals by creating inclusive, equitable spaces where students of all backgrounds can thrive.\u003c/p\u003e\u003cp\u003eEvery student’s journey is different, but I love helping them find strategies that work, celebrate progress along the way, and keep climbing toward their goals, one step, one hold, one success at a time.\u003c/p\u003e","teachingVideoPlaybackId":"2HNSAxA0002zkl4xpBFYy102Ipyt1hpWJZrbGcticqmE4A","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"1931a365-d708-4093-b341-e98a2b7bc04b\"}"},{"__ref":"Favorites:{\"uuid\":\"8224e250-fc5b-4b09-89ca-2b802f7eb414\"}"}],"causesSupported":[],"major":"Behavioral Neuroscience","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c1bcf80a-e1f9-442a-b554-6effc80d9fd9\"}"},{"__ref":"DeepDives:{\"uuid\":\"792ac259-e93f-4aea-be1f-ed11305f31cb\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb5bdde5-1353-4c82-be45-302a459ef307\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b3e12c5-6225-4a39-8522-8fd1d4e4c658\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/af4ef271-a7a1-430f-b67e-d7c58f2a3a89/-/preview/-/format/jpg/","https://ucarecdn.com/8eebeff4-ebd7-4b0e-bd86-ca3cfcd34825/-/preview/-/format/jpg/","https://ucarecdn.com/52bebb6a-b82b-4a46-b526-eaaecbdbf2b5/-/preview/-/format/jpg/"],"pronouns":"THEY_THEM","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"3356607e-03bb-4078-8337-3314bbbd44e4\"}"},{"__ref":"Education:{\"uuid\":\"2cded70e-7b45-47b1-ad0f-01bba726545d\"}"}],"hiredAt":"2026-02-01T08:35:26.097Z","topics":["Algebra I","Algebra II","Geometry","K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","Chemistry","Writing","Academic Coaching","College Essay Writing","Executive Function","Creative Writing","K-6 Storybook","Music","Video / Photography","Medicine / Health","STEM Project","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/5f05f9da-e93d-4baf-b118-2d7ae2f629ad/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"margaret-moffat\"}})":{"__ref":"MentorPublicPro
