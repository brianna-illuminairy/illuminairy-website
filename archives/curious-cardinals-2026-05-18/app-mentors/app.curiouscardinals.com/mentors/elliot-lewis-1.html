xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"cb055dfa-0f9f-4822-ae9c-5a687c2516d1\"}":{"__typename":"DeepDives","uuid":"cb055dfa-0f9f-4822-ae9c-5a687c2516d1","content":"\u003cp\u003eI am aiming to work in the climate sector, deploying capital to underfunded climate solutions. I also hope to work as a playwright and essayist, and I am interested in avenues for those two lines of work to intersect.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"fb426887-523e-4541-877f-d3699d8f68c9\"}":{"__typename":"DeepDives","uuid":"fb426887-523e-4541-877f-d3699d8f68c9","content":"\u003cp\u003eI was very focused and driven, but I also prioritized clubs and opportunities that made me genuinely excited. Like many Ivy League students, I had my fair share of leadership roles and accolades through organizations like the Math Team and Quiz Bowl Team, but I also made time for creative endeavors by starting music groups and writing my school musical.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"7d4de3e9-0068-4ba8-8e4d-799063a3ecd8\"}":{"__typename":"DeepDives","uuid":"7d4de3e9-0068-4ba8-8e4d-799063a3ecd8","content":"\u003cp\u003eMy greatest motivation comes from helping others discover what excites them most. I love seeing students light up when they find a subject or idea they truly care about. Guiding others toward their passions — and helping them build the confidence to pursue them — is the most rewarding part of what I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"d48acff5-5b87-4957-8e0f-8108afb4da9b\"}":{"__typename":"DeepDives","uuid":"d48acff5-5b87-4957-8e0f-8108afb4da9b","content":"\u003cp\u003eI enjoy writing, music, rock climbing, and running. I am also a lifelong learner, and I spend much of my spare time reading textbooks for courses I never got to take in college.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"2d81ce32-34b8-4ad3-bbc6-467f9e5d88ac\"}":{"__typename":"Education","uuid":"2d81ce32-34b8-4ad3-bbc6-467f9e5d88ac","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"English","degree":null},"School:{\"uuid\":\"1ab65370-5ce6-429b-9789-b25aa3bded10\"}":{"__typename":"School","uuid":"1ab65370-5ce6-429b-9789-b25aa3bded10","name":"Highland Park High School","city":"Highland Park","type":"HIGH","state":"Illinois","country":"United States","zip":"60035"},"Education:{\"uuid\":\"e227758a-bc65-4898-bed3-619875ea2ed9\"}":{"__typename":"Education","uuid":"e227758a-bc65-4898-bed3-619875ea2ed9","school":{"__ref":"School:{\"uuid\":\"1ab65370-5ce6-429b-9789-b25aa3bded10\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"9d019ab7-b752-46fc-a5e9-0b119cf2e043\"}":{"__typename":"MentorPublicProfile","uuid":"9d019ab7-b752-46fc-a5e9-0b119cf2e043","displayName":"Elliot L.","slug":"elliot-lewis-1","biography":"\u003cp\u003eI graduated from Yale University in 2023 with a B.A. in English and Advanced Coursework in Applied Mathematics. This unique academic combination reflects my wide-ranging intellectual interests, from literary analysis to multivariable calculus, and from playwriting to physics. While at Yale, I served as Editor-in-Chief of \u003cem\u003eThe Yale Herald\u003c/em\u003e, Vice President of MathCounts Outreach, and Business Manager and Bass Section Leader for an undergraduate a cappella group.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI graduated cum laude, with distinction in the English major, and I was honored as a finalist for the Rhodes Scholarship and as a recipient of a Fulbright Scholarship. I have also received multiple honors and awards for my writing and academic work, in particular honoring my accomplishments in playwriting, journalism, and literary analysis.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I work in venture capital, and I also conduct consulting work in the climate finance sector. Prior to my current professional chapter, I worked as a journalist, including as an intern for NBC News.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThroughout college and beyond, I have worked with students from middle school through high school in subjects including mathematics (up to multivariable calculus), English reading and writing, physics, SAT/ACT prep, and college admissions essays.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat unites all of these experiences is a passion for clear communication, critical thinking, and helping others reach their potential. Whether solving a tricky calculus problem or crafting a compelling college essay, my goal is to meet students where they are — and to help them build skills and confidence that will serve them long after any single test or assignment.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"cb055dfa-0f9f-4822-ae9c-5a687c2516d1\"}"},{"__ref":"DeepDives:{\"uuid\":\"fb426887-523e-4541-877f-d3699d8f68c9\"}"},{"__ref":"DeepDives:{\"uuid\":\"7d4de3e9-0068-4ba8-8e4d-799063a3ecd8\"}"},{"__ref":"DeepDives:{\"uuid\":\"d48acff5-5b87-4957-8e0f-8108afb4da9b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/bc45561d-daf3-4529-828f-12264a579288/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"2d81ce32-34b8-4ad3-bbc6-467f9e5d88ac\"}"},{"__ref":"Education:{\"uuid\":\"e227758a-bc65-4898-bed3-619875ea2ed9\"}"}],"hiredAt":"2025-04-16T03:38:34.232Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Physics","Writing","Spanish","College Essay Writing","Reading","History","Film / Theater","Creative Writing","Journalism"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"elliot-lewis-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9d019ab7-b752-46fc-a5e9-0b119cf2e043\"}"}}},"_sentryTraceData":"c9db91d4097a4113bcd7cd3f0b9b6c23-b8a5b08a336ebbaa-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=c9db91d4097a4113bcd7cd3f
