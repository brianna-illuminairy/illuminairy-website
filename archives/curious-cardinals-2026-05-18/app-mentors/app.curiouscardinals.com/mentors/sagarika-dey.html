xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"cd3961e5-ecf7-4d43-bc51-5a162b1c32ed\"}":{"__typename":"Favorites","uuid":"cd3961e5-ecf7-4d43-bc51-5a162b1c32ed","photoUrl":"https://ucarecdn.com/f5ec70d5-2f3f-41e0-829c-21ef9e2e7e81/","title":"New York City","type":"CITY"},"CausesSupported:{\"uuid\":\"a2259022-088b-4856-aa5f-607b9142572d\"}":{"__typename":"CausesSupported","uuid":"a2259022-088b-4856-aa5f-607b9142572d","name":"Make A Difference","description":"\u003cbr\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"44fa4f84-e492-4ab7-a13b-25029307156f\"}":{"__typename":"CausesSupported","uuid":"44fa4f84-e492-4ab7-a13b-25029307156f","name":"Child Rights and You","description":"","photoUrl":""},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"4cfab201-a6e7-4908-a370-f3b8761fc1bf\"}":{"__typename":"DeepDives","uuid":"4cfab201-a6e7-4908-a370-f3b8761fc1bf","content":"\u003cp\u003eIn high school, my summers were a mix of balance and intention.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI traveled a lot with my family, which gave me exposure to different places, cultures, and perspectives. Those trips were important to me. They were a reset, a way to step out of routine and experience something new. I also spent a lot of quality time with my friends, which made those summers genuinely fun and memorable.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the same time, I was intentional about growth. I used part of my summers to study for competitive exams and get ahead academically. I would revise concepts, strengthen weaker subjects, and prepare in a way that made the school year less overwhelming. That habit of using free time strategically stayed with me long after high school.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also made space for simple joys. I spent time swimming, cooking, watching movies, and just enjoying being young. It wasn’t all pressure and productivity. It was a mix of discipline and enjoyment.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLooking back, my summers reflect how I still live my life today. I work hard, I plan ahead, but I also value experiences, relationships, and balance.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"b6dcbd89-a3fe-4bf8-8087-b4627850b2a9\"}":{"__typename":"School","uuid":"b6dcbd89-a3fe-4bf8-8087-b4627850b2a9","name":"Christ University","city":"Bengaluru","type":"HIGH","state":"Karnataka","country":"India","zip":"560029"},"Education:{\"uuid\":\"e1cff0c6-ca72-4d16-8ed9-a76aba43e5f4\"}":{"__typename":"Education","uuid":"e1cff0c6-ca72-4d16-8ed9-a76aba43e5f4","school":{"__ref":"School:{\"uuid\":\"b6dcbd89-a3fe-4bf8-8087-b4627850b2a9\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"b0cbed79-16df-4857-a772-afe6965cb6a4\"}":{"__typename":"Education","uuid":"b0cbed79-16df-4857-a772-afe6965cb6a4","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2025","major":"Business Analytics","degree":null},"MentorPublicProfile:{\"uuid\":\"ff72ec4d-581e-4451-bc14-c9093f7b5529\"}":{"__typename":"MentorPublicProfile","uuid":"ff72ec4d-581e-4451-bc14-c9093f7b5529","displayName":"Sagarika D.","slug":"sagarika-dey","biography":"\u003cp\u003eHey! I’m Sagarika, and I just completed my Master’s in Business Analytics at Columbia University. I’ve worked in consulting at Deloitte, supported early-stage startups, and led operations for one of Columbia’s oldest graduate organizations as VP of Operations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the core, I’m someone who loves turning big, messy goals into clear, step-by-step action plans.\u003c/p\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eWhat I Specialize In -\u003c/strong\u003e\u003c/h2\u003e\u003cbr\u003e\u003cp\u003eI mentor students who want structure, clarity, and direction.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003ePassion Projects \u0026amp; Academic Mentorship\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eResearch projects, data-driven studies, and structured essays\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLaunching initiatives, clubs, or social impact organizations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding standout college profiles through depth, not noise\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCreating 6–12 month roadmaps using SMART goals\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eExecutive Functioning \u0026amp; Study Skills\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eTime management systems that actually stick\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBreaking down overwhelming assignments\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAccountability and follow-through\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding focus and reducing procrastination\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003ePathfinding \u0026amp; College Strategy\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eIdentifying strengths and interests\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eExploring majors and career paths realistically\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCold outreach, networking, and interview prep\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eCrafting authentic, compelling applications\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI primarily work with middle and high school students, especially those who:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eFeel capable but disorganized\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWant to “do something impressive” but don’t know where to start\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHave a project idea and need help executing it\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNeed both empathy and accountability\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI also relate deeply to students who’ve struggled academically. I’ve rebuilt my own systems from scratch, so I understand how to move from frustration to confidence.\u003c/p\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eWhy I’m Qualified to Mentor -\u003c/strong\u003e\u003c/h2\u003e\u003cbr\u003e\u003cp\u003eI’ve been on both sides: the student figuring it out and the leader guiding others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I’ve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWorked in high-performance environments where managing multiple deadlines is non-negotiable\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilt dashboards and strategy plans from complex datasets\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLed cross-functional teams and large-scale initiatives\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNavigated competitive graduate admissions not long ago\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eAcademically and personally, I’ve:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eSought career counseling and mentorship early\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eVolunteered with NGOs\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBalanced academics with creative outlets like dance\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHelped friends and peers get into their dream colleges\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI don’t just give advice. I build systems with students so they can operate independently long after we’re done working together.\u003c/p\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eA Few Fun Facts -\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eOutside of work, I’m usually at the gym, planning my next trip, trying a new restaurant, or experimenting in the kitchen. I love traveling and exploring different cuisines, and I’m always the person ordering something new on the menu “just to try it.” I also enjoy cooking and baking when I need a creative reset. I danced for years growing up and still believe creative outlets are essential for high performers.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m very into fashion and personal style. I think how you present yourself says a lot about how you feel, and I love helping students think about confidence both internally and externally.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eYou’ll probably also find me at the gym, reorganizing my Notion workspace for fun, or having long conversations about ambition, career paths, and how to design a life intentionally instead of drifting into one.\u003c/p\u003e\u003cp\u003e                                                                           --\u0026amp;--\u003c/p\u003e\u003cbr\u003e\u003cp\u003eStudents often describe me as structured but approachable. Parents appreciate that I’m organized and strategic. I’d say I’m analytical, honest, and genuinely invested in helping students grow in a way that compounds over time.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re looking for someone who can help turn uncertainty into a plan and a plan into results, I’d love to work together.\u003c/p\u003e","teachingVideoPlaybackId":"GSbhAvqH701kvObSyhbubAtcZDOGd4fjeFA41BkLo4dA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eGetting into Columbia University was one of my greatest achievements. It made my parents really proud. It really mirrored the ling way I have come, from not knowing what I wanted to study to getting an acceptance in an Ivy League school. Personally, I am really proud that I was the VP of Operations in one of the oldest clubs of Columbia Engineering!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"cd3961e5-ecf7-4d43-bc51-5a162b1c32ed\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"a2259022-088b-4856-aa5f-607b9142572d\"}"},{"__ref":"CausesSupported:{\"uuid\":\"44fa4f84-e492-4ab7-a13b-25029307156f\"}"}],"major":"Business Analytics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"4cfab201-a6e7-4908-a370-f3b8761fc1bf\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/db8fd150-4645-4901-8e40-9de12362c668/-/preview/-/format/jpg/","https://ucarecdn.com/b335f7ce-9804-47b0-aaaf-ff8f7dd07fdb/-/preview/-/format/jpg/","https://ucarecdn.com/8a62d10f-b47f-47c4-98b0-cefc8f1aa2ec/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"e1cff0c6-ca72-4d16-8ed9-a76aba43e5f4\"}"},{"__ref":"Education:{\"uuid\":\"b0cbed79-16df-4857-a772-afe6965cb6a4\"}"}],"hiredAt":"2026-02-11T19:16:22.240Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","Computer Science","Creative Writing","K-6 Storybook","Business / En
