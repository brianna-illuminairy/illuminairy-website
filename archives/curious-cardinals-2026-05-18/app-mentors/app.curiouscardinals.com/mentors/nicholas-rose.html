xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"91993ed9-4d9e-45b9-91c9-9716fb52d00c\"}":{"__typename":"Favorites","uuid":"91993ed9-4d9e-45b9-91c9-9716fb52d00c","photoUrl":"https://ucarecdn.com/46db6f72-d996-4b57-9e77-e6ea86c79a74/","title":"Green Bay Packers!","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"90870738-78a1-4604-942f-ef9fcf1829b3\"}":{"__typename":"Favorites","uuid":"90870738-78a1-4604-942f-ef9fcf1829b3","photoUrl":"https://ucarecdn.com/541af81e-4a3e-4243-9d44-511829220d9b/","title":"surfing","type":"SPORT"},"Favorites:{\"uuid\":\"41be989c-7f98-434f-ba1b-713fd7015794\"}":{"__typename":"Favorites","uuid":"41be989c-7f98-434f-ba1b-713fd7015794","photoUrl":"https://ucarecdn.com/fbf223cc-a0e9-42e7-800e-6a3fb7a582b0/","title":"Avengers: Endgame","type":"MOVIE"},"CausesSupported:{\"uuid\":\"a6a60564-faa9-4f0c-b72d-a9b95870255f\"}":{"__typename":"CausesSupported","uuid":"a6a60564-faa9-4f0c-b72d-a9b95870255f","name":"Susan G. Komen","description":"\u003cp\u003eMy mom is a survivor, and I help her put on a yearly dodgeball fundraiser!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/c8538a72-1cfc-4ac0-ac9d-ff33f4afb9d8/"},"CausesSupported:{\"uuid\":\"5d4b3847-323f-41e1-b312-df67a51585db\"}":{"__typename":"CausesSupported","uuid":"5d4b3847-323f-41e1-b312-df67a51585db","name":"Special Olympics","description":"\u003cp\u003eI help volunteer at weekly sports events held at my school.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/d760c6bf-88ac-4284-9b14-2067225b3167/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"ae4ae4b7-93fd-4afd-89ae-646ecc8e533c\"}":{"__typename":"DeepDives","uuid":"ae4ae4b7-93fd-4afd-89ae-646ecc8e533c","content":"\u003cp\u003eIf I could tell my high school self anything, it would be to try all the different classes I can! Ever since 7th grade, I had decided that I wanted to build rockets. I took every possible physics class I could in high school: astronomy, robotics, quantum mechanics, and electronics, but I never really have biology and chemistry a chance. After burying my head into engineering in high school, I planned on doing the same in college. However, on a whim I decided to take a biology class freshman year. I absolutely loved it, and now have added on premed to my engineering degree, with plans on going to medical school after college to study orthopedics! While I'm glad that I eventually found my path, I wish I hadn't put my head down all of high school into a single subject and given biology a chance earlier. So I would say: try classes and clubs that you might not think you have much of an interest in. Worst-case you don't like it, but you might find an unexpected passion!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"9fda4cc2-b9c8-4cb5-bdea-c4c7962cb65b\"}":{"__typename":"DeepDives","uuid":"9fda4cc2-b9c8-4cb5-bdea-c4c7962cb65b","content":"\u003cp\u003eMy greatest role model has to be my grandfather. He worked for the Air Force building fighter jets, and when I was young, he would tell me the craziest stories of the planes he built and tested. He was always the smartest person I knew growing up, and each time I saw him he would bring me books to read about math, science, or really anything. \u003c/p\u003e\u003cp\u003eIn middle school, as I started to build model rockets on my own, he took an interest as well. We would drive around rural Virginia, knocking on the doors of farmers to ask if we could launch in their unused fields. We then moved on to bigger projects, such as a 10-foot climbing wall in my garage during the pandemic quarantine. I learned so much of what I know about building and thinking like an engineer from him, but also using my skills for good. My grandfather is by far the kindest person that I know, and has devoted so much of his life to support those less fortunate, through an incredibly wide range of charities and organizations. I can only hope to leave a mark on the world like he did!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"8181fcd9-8be5-4959-82ef-c7098f042d3c\"}":{"__typename":"DeepDives","uuid":"8181fcd9-8be5-4959-82ef-c7098f042d3c","content":"\u003cp\u003eI absolutely love the outdoors! When I'm not in school or working on the Northwestern rocketry and formula one teams, you will almost certainly find me on a rock wall, amongst the waves, or carving down a ski run. I've got all of the seasons covered! There's just something extraordinarily peaceful to me about spending time in nature--it lets me settle my mind for a while and makes a great reason to travel. Some of my favorite spots are surfing in the Outer Banks, NC; rock climbing in Fontainebleau, France; and skiing at Solitude Mountain, Utah!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"42f89f08-c72e-44f9-b951-1fa97a16b069\"}":{"__typename":"DeepDives","uuid":"42f89f08-c72e-44f9-b951-1fa97a16b069","content":"\u003cp\u003eThroughout my life, I've found that while I have passions of my own, like engineering, biology, rock climbing, and surfing, I connect with them so much more when I spark their interest in others. I love being able to inspire that \"oh!\" moment when someone finally understands how to figure out a problem they have been struggling with, and realizes that maybe they aren't struggling so much after all. And even better, sometimes they start to develop a passion of their own. Watching others develop the same enthusiasm that I have for a variety of subjects and activities is the most rewarding feeling I've experienced, and I think it's why I've gravitated towards mentorship-related jobs since high school: rock-climbing instruction, surf lessons, and academic tutoring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}":{"__typename":"School","uuid":"62e59c56-ee46-4213-b082-758af3ff99db","name":"Phillips Exeter Academy","city":"Exeter","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03833"},"Education:{\"uuid\":\"f5f19088-2233-4410-92ec-50cfbaa7c0e9\"}":{"__typename":"Education","uuid":"f5f19088-2233-4410-92ec-50cfbaa7c0e9","school":{"__ref":"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}"},"startYear":"2020","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"fd5baa6c-5bab-4c1b-ad61-8ae1945fbf33\"}":{"__typename":"Education","uuid":"fd5baa6c-5bab-4c1b-ad61-8ae1945fbf33","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering/Premed","degree":null},"MentorPublicProfile:{\"uuid\":\"b1641af9-e1d0-4024-b1da-5f5e5cc8898b\"}":{"__typename":"MentorPublicProfile","uuid":"b1641af9-e1d0-4024-b1da-5f5e5cc8898b","displayName":"Nicholas R.","slug":"nicholas-rose","biography":"\u003cp\u003eHi! I'm Nick, and I'm currently a rising junior studying mechanical engineering and pre-medicine at Northwestern University. I'm originally from Norfolk, VA, but moved up to New England for high school, and I now live in Boston. I absolutely love to learn and to teach, so much of my life has been related to finding opportunities for both within a variety of STEM fields.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt my high school, Phillips Exeter Academy, I chased down every engineering-related class I could find: astronomy, electronics, woodworking, robotics, modern physics, and quantum mechanics. I also became heavily involved in many different science clubs, and served as a president of the Exeter Science Olympiad Team and Off-Planet Society. I also developed a large passion for writing and journalism, serving as an editor on the opinions section while submitting creative writing pieces for school magazines.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn college, I began as a mechanical engineering major with an emphasis in aerospace and elective concentration in journalism. I’ve also been heavily involved for the past two years in a couple of our engineering clubs: designing and fabricating an onboard video system for the Northwestern Rocketry Team and shaping a carbon-fiber driver’s seat for the Northwestern Formula Racing Team. But as I dove deeper into mechanical systems and their applications to the human body, I realized I didn’t want to just design solutions—I wanted to help implement them in the OR. Therefore, in sophomore year I decided to tack-on premedical studies on top of my engineering major, with hopes of now attending medical school after college to study and practice orthopedics.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics and extracurriculars, I initially played soccer, swam, and rowed in high school, but soon my love for nature won out, and I transitioned solely to rock climbing, surfing, and skiing. My main project in high school was fundraising for and eventually organizing a climbing wall in our athletic building so that boarding students would be able to climb regularly. While they aren’t the most accessible in the Midwest, I still can follow my passions at Northwestern! I surf the Great Lakes more than 60 days a year, ski race for Northwestern, and have put a large amount of my effort towards developing a collegiate climbing team on campus that has grown to more than 300 climbers!\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMentorship has always been one of my largest passions, and I’ve dedicated a great deal of time towards teaching others in areas of my strength throughout both high school and college. At Exeter, I was the head tutor of our math and science peer tutoring program, so I organized a weekly schedule of our 100+ tutors and helped other students in a variety of classes five hours a week. I also participated in our tutoring student service organization, working with local elementary school students over zoom weekly. Over the past few summers, I’ve also worked as a rock climbing instructor, teaching bouldering technique and belaying, as well as a surfing instructor during the summers. I love tutoring students at any age from K-12, and while STEM subjects would be my area of strength, I still possess a large passion for writing and journalism!\u003c/p\u003e","teachingVideoPlaybackId":"77FilPr0100E93a9TVuGBoNo02biuXUPfIDC2oKLB011yDA","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI wouldn't say that I mention it much, but I would say that my greatest achievement would be an award I received at the graduation of my high school: Phillips Exeter Academy. Each year, the senior class votes for a member that best exemplifies the \"Exeter spirit.\" To be honest, I think it's pretty tricky to define what exactly the Exeter spirit means in this context--there are so many values that made my school special. But personally, I can say with confidence that I spent as much effort as I could getting to know as many classmates as possible during my four years, and lifting up those around me whenever I could. The reception of this award made me proud because I realized that many of these little acts don't necessarily go unrecognized.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"91993ed9-4d9e-45b9-91c9-9716fb52d00c\"}"},{"__ref":"Favorites:{\"uuid\":\"90870738-78a1-4604-942f-ef9fcf1829b3\"}"},{"__ref":"Favorites:{\"uuid\":\"41be989c-7f98-434f-ba1b-713fd7015794\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"a6a60564-faa9-4f0c-b72d-a9b95870255f\"}"},{"__ref":"CausesSupported:{\"uuid\":\"5d4b3847-323f-41e1-b312-df67a51585db\"}"}],"major":"Mechanical Engineering/Premed","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ae4ae4b7-93fd-4afd-89ae-646ecc8e533c\"}"},{"__ref":"DeepDives:{\"uuid\":\"9fda4cc2-b9c8-4cb5-bdea-c4c7962cb65b\"}"},{"__ref":"DeepDives:{\"uuid\":\"8181fcd9-8be5-4959-82ef-c7098f042d3c\"}"},{"__ref":"DeepDives:{\"uuid\":\"42f89f08-c72e-44f9-b951-1fa97a16b069\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/46a1d206-2f2e-482b-b694-2ff4ee4a9b46/-/preview/-/format/jpg/","https://ucarecdn.com/fb0fda50-7aea-42c3-9c22-a597a5ee6348/-/preview/-/format/jpg/","https://ucarecdn.com/36afcec5-9fe1-40f4-9abd-8aff3c0eb979/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f5f19088-2233-4410-92ec-50cfbaa7c0e9\"}"},{"__ref":"Education:{\"uuid\":\"fd5baa6c-5bab-4c1b-ad61-8ae1945fbf33\"}"}],"hiredAt":"2025-08-13T21:11:33.561Z","topics":["Calculus","Precalculus / Trigonometry","Geometry","Algebra II","Algebra I","Pre-Algebra","K-5 Grade Math","Statistics","Physics","Biology","Chemistry","6-8 Grade Science","Writing","Computer Science","Academic Coaching","Executive Function","Reading","History","College Essay Writing"],"communityBadges":["https://ucarecdn.com/7603176c-18e9-427e-b2ca-dcc9bf349c9b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"nicholas-rose\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"b1641af9-e1d0-4024-b1da-5f5e5cc8898b\"}"}}},"_sentryTraceData":"fc71543f64854c3b86fc0127898fd5c6-ac781b6ffeb7cd6d-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=fc71543f64854c3b86fc0127898fd5c6,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"nicholas-rose"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
