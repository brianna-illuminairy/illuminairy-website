xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9a521faf-1759-4ace-b8a0-89c2c576c3be\"}":{"__typename":"Favorites","uuid":"9a521faf-1759-4ace-b8a0-89c2c576c3be","photoUrl":"https://ucarecdn.com/0cc05c4a-7f4d-40ba-a844-4144ab44c09a/","title":"Phillies","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"5f4ab48a-0d74-48b8-9ac8-dc86e0f58d2d\"}":{"__typename":"Favorites","uuid":"5f4ab48a-0d74-48b8-9ac8-dc86e0f58d2d","photoUrl":"https://ucarecdn.com/012ee232-1d81-4420-92b3-a552a5f84bbf/","title":"Catan","type":"GAME"},"Favorites:{\"uuid\":\"cdff43cb-a947-4e53-890b-67d9717f4161\"}":{"__typename":"Favorites","uuid":"cdff43cb-a947-4e53-890b-67d9717f4161","photoUrl":"https://ucarecdn.com/6c88d71d-210b-4be6-a2c7-5ab7b864270e/","title":"Squash","type":"SPORT"},"CausesSupported:{\"uuid\":\"eff3b8cb-55cc-4f24-9c01-f6b2c3b76404\"}":{"__typename":"CausesSupported","uuid":"eff3b8cb-55cc-4f24-9c01-f6b2c3b76404","name":"SquashHaven","description":"\u003cul\u003e\u003cli\u003e\u003cp\u003eTaught squash and tutored local middle school students\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","photoUrl":"https://ucarecdn.com/decd3253-59c0-4861-859a-f9358c2c7424/"},"CausesSupported:{\"uuid\":\"5e21c6e9-c131-4be2-8631-c5ad2aace399\"}":{"__typename":"CausesSupported","uuid":"5e21c6e9-c131-4be2-8631-c5ad2aace399","name":"VITA/TCE","description":"\u003cul\u003e\u003cli\u003e\u003cp\u003eAided low-income Philadelphians to complete their tax returns for free\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","photoUrl":"https://ucarecdn.com/f8921e5d-372a-4a3b-8446-01f5d123715d/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"6e32efe9-2ebc-428d-bdde-78aa85be7a16\"}":{"__typename":"DeepDives","uuid":"6e32efe9-2ebc-428d-bdde-78aa85be7a16","content":"\u003cp\u003eI chose to be an Applied Mathematics major because it allowed me to take a complete range of classes that interested me. I started college thinking I would major in just Mathematics, which quickly became Math and Philosophy, which in turn shifted to Math and Computer Science or Math and Economics. Before I knew it, I had dipped my toe in a lot of places, and the Applied Mathematics major let me continue pursuing various areas of interest at once. To some extent, your undergraduate major is not that important at a liberal arts school, so it is best to take classes that keep you engaged and excited to come to lecture each day!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"ef9246d4-1c1e-455c-98d5-63a967c177e2\"}":{"__typename":"DeepDives","uuid":"ef9246d4-1c1e-455c-98d5-63a967c177e2","content":"\u003cp\u003eMy dream job is to be a general manager of a sports franchise. I think that this is a perfect combination of working with people, digging into numbers and analysis, and doing something that brings joy to those around me. The path to get there is a little unclear as of now, but a more realistic dream is to coach and teach after semi-retiring.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"357d9789-ff1b-4b03-b1c5-6a9e258b249a\"}":{"__typename":"DeepDives","uuid":"357d9789-ff1b-4b03-b1c5-6a9e258b249a","content":"\u003cp\u003eI am most motivated by being around people that are passionate about what they do. For the last few years, the biggest source of motivation has been my teammates, as we strive to reach our goal of winning a national championship. In general, seeing people accomplish their goals through hard work helps me to achieve my own aspirations.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"50d4cac8-2b39-4cab-9de1-7e55b32f2212\"}":{"__typename":"DeepDives","uuid":"50d4cac8-2b39-4cab-9de1-7e55b32f2212","content":"\u003cp\u003eI would love to keep this section candid to give you a better understanding of what I really do in my free time! School and squash take up a lot of time during the academic year, and internships in the summer definitely limit spare time, so I spend most of my time away from commitments decompressing on the couch, catching up on my favorite sports teams (too much time mindlessly watching ESPN) and playing board games (almost always Catan) with my teammates. I also love having enough flexibility to set aside a chunk of the day for a good book or for teaching myself a new song on the guitar.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"d77b5088-91b2-4f4a-97be-1883d766ade3\"}":{"__typename":"Education","uuid":"d77b5088-91b2-4f4a-97be-1883d766ade3","school":{"__ref":"School:{\"uui
