xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b3de3b3b-51ec-4057-9cae-d80b4e3c7a3f\"}":{"__typename":"DeepDives","uuid":"b3de3b3b-51ec-4057-9cae-d80b4e3c7a3f","content":"\u003cp\u003eI would tell my high school self to be unafraid to ask questions. Although I felt like I was pretty inquisitive in high school regarding academic topics, I could have sought more advice on social and emotional experiences I endured. However, if your with people you can trust and have relationships with them, being a bit vulnerable to get help is important. I was always told by my teachers that \"there's no such thing as a stupid question,\" and that applies to any kind of genuine concern one has.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"14055a83-bf87-45bc-a1c4-1e0a06fc587e\"}":{"__typename":"DeepDives","uuid":"14055a83-bf87-45bc-a1c4-1e0a06fc587e","content":"\u003cp\u003eMentorship matters to me because it perpetuates a transfer of helpful advice and that anyone can benefit from. As a mentor, I'm given the opportunity to pass on things I've learned from a variety of trusted adults I've known in my life. Furthermore, mentorship opens doors that people didn't know existed. If I can be a guide or aide in someone's journey toward discovering their identity and goals, I feel that I'm fulfilling a purpose in this world greater than myself. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"fd5c97c3-a3ee-4776-9e9d-de0b6f4b6dff\"}":{"__typename":"DeepDives","uuid":"fd5c97c3-a3ee-4776-9e9d-de0b6f4b6dff","content":"\u003cp\u003eMy dream job is to be an attorney. Law has been a field that I've always had mild interest in, but in recent years I've only grown more engaged in the rules and institutions that structure our society. In addition to learning about the structure of our legal system, I've also come to understand it's flaws and how indigent people are, by nature of the system, given the short end of the stick. Since I feel obligated to pursue justice and create a more equitable society, being a lawyer is the job which I think I'd be able to have the greatest impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"2eeb5316-d80c-42cd-a1e5-8be64d02fd0c\"}":{"__typename":"DeepDives","uuid":"2eeb5316-d80c-42cd-a1e5-8be64d02fd0c","content":"\u003cp\u003eI spent my summers in high school as a summer camp counselor for elementary school students. My time as a counselor was a blast, and having the opportunity to interact with kids on a daily basis was one of the highlights of my life. Kids are remarkably impressionable, and early in the process I came to recognize the responsibility I had to being a good role model for the kids I worked with. Having said that, I learned just as much from the kids as they learned from me. Their thoughts, feelings, and beliefs challenged beliefs I had and forced me to consider different perspectives about music, popular culture, and even school.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"c48a54a2-baee-410f-b31c-eec24e40c460\"}":{"__typename":"School","uuid":"c48a54a2-baee-410f-b31c-eec24e40c460","name":"High School of American Studies at Lehman College","city":"New York","type":"HIGH","state":"NY","country":"United States","zip":"10468"},"Education:{\"uuid\":\"736f7432-f81d-422a-9710-7054427781c9\"}":{"__typename":"Education","uuid":"736f7432-f81d-422a-9710-7054427781c9","school":{"__ref":"School:{\"uuid\":\"c48a54a2-baee-410f-b31c-eec24e40c460\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"c8fdca81-83ac-4066-aac9-44267b981b8b\"}":{"__typename":"Education","uuid":"c8fdca81-83ac-4066-aac9-44267b981b8b","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Industrial and Labor Relations","degree":null},"MentorPublicProfile:{\"uuid\":\"768a2646-2f47-4aee-b59c-548beb105972\"}":{"__typename":"MentorPublicProfile","uuid":"768a2646-2f47-4aee-b59c-548beb105972","displayName":"Michael D.","slug":"michael-dogu","biography":"\u003cp\u003eHi! I’m Michael, a freshman at Cornell University majoring in Industrial and Labor Relations, and I help middle and high school students build the skills and confidence to improve their reading, writing, and public speaking.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePresented at the New York City Department of Education’s annual civics fair\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eLed my school’s outdoor track team\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTutored rising freshmen as part of the Discovery program during the summer of my sophomore year\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWas a member of my district’s superintendent’s student advisory council\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eAt Cornell University, I am a member of the school’s official mock trial team, which competes nationally at a variety of tournaments during the fall and spring.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI specialize in providing guidance in various kinds of writing, including argumentative, expository, narrative, and descriptive writing This includes a wide array of applications relevant to students and young people looking to make a change in their community. Whether that's writing a research paper on the effects of nicotine on long-term health outcomes or creating a public service accouncement about cleaning up after your dog, I can offer specific feedback and advice on how to more effectively convey ideas.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cbr\u003eI'm also of the believe that having a strong foundation in reading enables one to become a better writer. Thus, when going through the writing process, I offer examples from real authors and analyze an author’s structure, tone, and style. My mentorship in writing extends to any genre or subject, from academic journals and newspaper articles to persuasive essays and editorials.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also can help students study for their AP English Language and AP English Literature classes. I combine understanding with application. We'll learn about literary devices, argumentation, and synthesis to reach a high level of comprehension. In terms of application, I'll utilize a variety of studying strategies, including annotating texts, doing multiple choice practice exams, and taking timed essays. \u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eFor students looking for help in their AP US History and AP World History exams, I combine my extensive historical knowledge with my reading and writing applications. I'll go over time periods and important trends students talk about in class, and reinforce that knowledge through doing practice questions related to those time periods from prior AP exams. Similarly to the AP Lit and AP Lang review sessions, we'll go through multiple choice questions together and consistently practice writing skills through sample short-answer questions, long-essay questions, and document-based questions.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eWhile I work best with students who want to strengthen their foundation in reading and writing, I also extend into certain STEM topics, including:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eAlgebra mastery (linear equations, inequalities, systems of equations)\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003ePre-calculus concepts for students ready to get ahead\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eIn addition to providing help with specific topics, I also focus on broader skills like test-taking strategies, especially for students who are unsure how to study and stay organized for exams.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow I Can Help You\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eBased on my experiences with middle and high school students, I’ve found that the most effective learning happens when students are given a finished writing piece or math problem and are encouraged to identify things that jump out to them.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might include:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eA brief check-in to clarify the student’s assignment, goals, and any feedback they’ve received from their teacher or mentor.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eNext, we work actively on the writing. This might include outlining an essay, developing stronger topic sentences, revising paragraphs for clarity and evidence, or practicing specific skills like introductions, transitions, or analysis.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eThroughout the session, we focus on clear thinking, strong structure, and effective use of evidence, while also addressing grammar and style as they naturally arise.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eWe end by reviewing what we accomplished, identifying next steps, and—when helpful—setting a short plan for revision or future assignments.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eBeyond the Books\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academics and work, sports play a big role in how I spend my time. I’m also invested in exploring the world, so traveling and trying new foods are two of my favorite things to do. I’ve always believed that when it comes to exploration, food is an essential component of incorporating new experiences.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you want to feel more confident about your writing (and even certain math skills) while you navigate the eventful period that is your high school years, I’d love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"IQdtji2ILncEP1YyAbrOpa55gl5zwx8ZMDU9Ox00OffY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Industrial and Labor Relations","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b3de3b3b-51ec-4057-9cae-d80b4e3c7a3f\"}"},{"__ref":"DeepDives:{\"uuid\":\"14055a83-bf87-45bc-a1c4-1e0a06fc587e\"}"},{"__ref":"DeepDives:{\"uuid\":\"fd5c97c3-a3ee-4776-9e9d-de0b6f4b6dff\"}"},{"__ref":"DeepDives:{\"uuid\":\"2eeb5316-d80c-42cd-a1e5-8be64d02fd0c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/beae70be-4198-4dc9-90ed-fd47799d3568/-/preview/-/format/jpg/","https://ucarecdn.com/f5a9b4eb-e4f3-4276-a73a-8fa845e654bc/-/preview/-/format/jpg/","https://ucarecdn.com/41e7fcbf-929e-4ec0-b272-1e8b4b0c2d08/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"736f7432-f81d-422a-9710-7054427781c9\"}"},{"__ref":"Education:{\"uuid\":\"c8fdca81-83ac-4066-aac9-44267b981b8b\"}"}],"hiredAt":"2026-01-10T04:01:05.948Z","topics":["Algebra I","Algebra II","6-8 Grade Science","Writing","History","Reading","Economics","Creative Writing","Sports Journalism","History Project","Law / Government / Policy","Debate","Public Speaking"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"michael-dogu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"768a2646-2f47-4aee-b59c-548beb105972\"}"}}},"_sentryTraceData":"202b9a9836ae41faaa5264e5cb0637a5-b80e9f1893d28760-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=202b9a9836ae41faaa5264e5cb0637a5,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,s
