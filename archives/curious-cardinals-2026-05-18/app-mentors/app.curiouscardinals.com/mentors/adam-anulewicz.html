xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"44fb3ff3-61ee-4909-9589-8bdbca88e202\"}":{"__typename":"Favorites","uuid":"44fb3ff3-61ee-4909-9589-8bdbca88e202","photoUrl":"https://ucarecdn.com/a2c94630-420a-4896-82f8-64d86902420d/","title":"Drew Brees","type":"ATHLETE"},"Favorites:{\"uuid\":\"f51c2bea-9496-41b0-9626-a4bc9bd71c28\"}":{"__typename":"Favorites","uuid":"f51c2bea-9496-41b0-9626-a4bc9bd71c28","photoUrl":"https://ucarecdn.com/518c01f1-8bdb-4079-8f4e-34206635f245/","title":"Un Verano Sin Ti","type":"ALBUM"},"Favorites:{\"uuid\":\"c0dd498d-203f-4159-b344-68be2070c79f\"}":{"__typename":"Favorites","uuid":"c0dd498d-203f-4159-b344-68be2070c79f","photoUrl":"https://ucarecdn.com/da832061-6f96-4394-8204-eaa6d5fc1284/","title":"American Football","type":"SPORT"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c0ebb558-6582-41f0-8b7b-9192c3dbe487\"}":{"__typename":"DeepDives","uuid":"c0ebb558-6582-41f0-8b7b-9192c3dbe487","content":"\u003cp\u003eI grew up in a large family with a lot of younger cousins, and since I was one of the oldest I was often the first person they came to for help or advice. Being able to help them learn and grow as a result of my help is one of the most rewarding things I have experienced, so now I hope to help you all as much as I can during my time as a mentor!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d4e18630-8a9b-4117-8891-63d15b9d4fc3\"}":{"__typename":"DeepDives","uuid":"d4e18630-8a9b-4117-8891-63d15b9d4fc3","content":"\u003cp\u003eBuild good habits early, especially in regards to time management. When I got to college, the freedom that came with building my own schedule also meant that I had to be a lot more deliberate in how I blocked out my time for work and school. It took me a semester or two to really find a rhythm that worked well for me in regards of balancing school work and my personal life, but it makes a world of difference and I recommend building those good habits as soon as possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"e41e8ec3-c36d-4895-8c60-18f41a0e7f23\"}":{"__typename":"DeepDives","uuid":"e41e8ec3-c36d-4895-8c60-18f41a0e7f23","content":"\u003cp\u003eMy dream job would probably be to work as a design team lead for an eVTOL manufacturer or with a firm working towards forwarding the concept of urban air mobility. I want to help create a more sustainable world in regards to aviation, and believe that both of those fields are a fascinating and great place to do it!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"a6771f27-1e91-41bd-a33e-b0944e78e086\"}":{"__typename":"DeepDives","uuid":"a6771f27-1e91-41bd-a33e-b0944e78e086","content":"\u003cp\u003eOne thing that I hope to accomplish in my lifetime is to visit all 7 continents. I have been able to make it to 5 so far, but hitting all 7 (including Antarctica) is a major dream of mine. I love traveling the world and experiencing new cultures, and believe it is the best way to learn more about the world we live in and discover all of the amazing things it has to offer!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"6f599da0-ab60-46f9-a701-877924083ac6\"}":{"__typename":"School","uuid":"6f599da0-ab60-46f9-a701-877924083ac6","name":"Campbell High School","city":"Smyrna","type":"HIGH","state":"Georgia","country":"United States","zip":"30080"},"Education:{\"uuid\":\"00c07f7f-1617-45ba-a5bb-ca20fe580d55\"}":{"__typename":"Education","uuid":"00c07f7f-1617-45ba-a5bb-ca20fe580d55","school":{"__ref":"School:{\"uuid\":\"6f599da0-ab60-46f9-a701-877924083ac6\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}":{"__typename":"School","uuid":"b41dba99-571d-49c6-9a58-d51575202d39","name":"Georgia Institute of Technology","city":"Atlanta","type":"COLLEGE","state":"Georgia","country":"United States","zip":"30332"},"Education:{\"uuid\":\"f317625b-08d4-45fb-b6de-99f006548399\"}":{"__typename":"Education","uuid":"f317625b-08d4-45fb-b6de-99f006548399","school":{"__ref":"School:{\"uuid\":\"b41dba99-571d-49c6-9a58-d51575202d39\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Aerospace Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"2468b2dd-1b70-4a5b-9789-c5a925a8b79b\"}":{"__typename":"MentorPublicProfile","uuid":"2468b2dd-1b70-4a5b-9789-c5a925a8b79b","displayName":"Adam A.","slug":"adam-anulewicz","biography":"\u003cp\u003eHi everyone—great to meet you all! My name is Adam Anulewicz, and I’m an Aerospace Engineering student at the Georgia Institute of Technology, where I’m also pursuing a minor in Spanish. I’m especially interested in the future of electric and vertical lift aircraft, and I’m passionate about the role emerging propulsion technologies will play in shaping the next generation of aviation. Because of this, I spend a lot of my time flying drones, working with electronic propulsion systems, and learning more about both electric and combustion-based engines. I love discussing aviation—from technical design challenges to industry trends—so feel free to reach out or spark a conversation anytime.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of engineering, travel is a huge part of my life. I’ve been fortunate enough to visit 20 countries so far, including Japan, Morocco, Argentina, and the Czech Republic, and I hope to continue exploring as much of the world as possible. What I enjoy most about traveling is immersing myself in new cultures—especially through food, language, and meaningful conversations with people from different backgrounds. Studying Spanish has only deepened my appreciation for cultural exchange and global connection.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, you’ll usually find me outside and staying active. I love spending time with my three dogs, being in nature, and exercising—particularly weightlifting and pickleball. I’m also a big sports fan and enjoy watching games whenever I can, especially football and soccer. Music is another major interest of mine; I listen to a wide range of genres, but my favorites include country, reggaeton, and trap, with artists like Zach Bryan, Quevedo, and Bad Bunny always in rotation. I’m also a huge movie fan and love watching films with family and friends—my current favorites include \u003cem\u003eThe Shawshank Redemption\u003c/em\u003e, \u003cem\u003eStar Wars\u003c/em\u003e, and \u003cem\u003eMemento\u003c/em\u003e, and I’m always open to new recommendations.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis summer, I’ll be working as an Engineering Intern at Bell Textron in Fort Worth, where I’m excited to build on my experience in CAD, propulsion, and engine development while gaining hands-on exposure to the aerospace industry.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m really looking forward to meeting everyone, learning from your experiences, and growing both personally and professionally—can’t wait to connect! \u003c/p\u003e","teachingVideoPlaybackId":"V4pUzKVwCSgs5QKXDa202OlRMqDZLrzGYPbwjIkDuFJQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI was very proud when I was able to achieve my Eagle Scout award during my senior year of high school! Seeing my years of hard work culminate in a successfully completed project that both reflected my drive to improve and made the world a better place for the people who experienced it was one of the most fulfilling things I have ever done.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"44fb3ff3-61ee-4909-9589-8bdbca88e202\"}"},{"__ref":"Favorites:{\"uuid\":\"f51c2bea-9496-41b0-9626-a4bc9bd71c28\"}"},{"__ref":"Favorites:{\"uuid\":\"c0dd498d-203f-4159-b344-68be2070c79f\"}"}],"causesSupported":[],"major":"Aerospace Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c0ebb558-6582-41f0-8b7b-9192c3dbe487\"}"},{"__ref":"DeepDives:{\"uuid\":\"d4e18630-8a9b-4117-8891-63d15b9d4fc3\"}"},{"__ref":"DeepDives:{\"uuid\":\"e41e8ec3-c36d-4895-8c60-18f41a0e7f23\"}"},{"__ref":"DeepDives:{\"uuid\":\"a6771f27-1e91-41bd-a33e-b0944e78e086\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/0101de37-5fc7-4df9-9dae-aa9451eaaa20/-/preview/-/format/jpg/","https://ucarecdn.com/5461f276-b041-430c-987a-15d624f6da41/-/preview/-/format/jpg/","https://ucarecdn.com/262cfd0a-973f-452d-8b98-f4c1904139bf/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"00c07f7f-1617-45ba-a5bb-ca20fe580d55\"}"},{"__ref":"Education:{\"uuid\":\"f317625b-08d4-45fb-b6de-99f006548399\"}"}],"hiredAt":"2025-05-13T06:46:32.254Z","topics":["K-5 Grade
