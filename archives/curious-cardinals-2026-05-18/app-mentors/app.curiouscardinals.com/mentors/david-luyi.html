xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"c4087c5d-bcae-4985-9d55-eecc54127a5b\"}":{"__typename":"DeepDives","uuid":"c4087c5d-bcae-4985-9d55-eecc54127a5b","content":"\u003cp\u003eBe curious, be passionate, and be bold. I know things can be stressful and confusing, but with a little irrational optimism and hard work, things will always work out.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"72063e15-8581-4748-906a-098d7b559692\"}":{"__typename":"DeepDives","uuid":"72063e15-8581-4748-906a-098d7b559692","content":"\u003cp\u003eI want to complete an Ironman!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"bdf9bb3a-d436-4256-9eb5-51d640710d06\"}":{"__typename":"DeepDives","uuid":"bdf9bb3a-d436-4256-9eb5-51d640710d06","content":"\u003cp\u003eI love learning and building, and seeing that spark in the eyes of my students is one of the best feelings in the world!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"4ad84c73-deb2-4902-9196-aa17740735e4\"}":{"__typename":"DeepDives","uuid":"4ad84c73-deb2-4902-9196-aa17740735e4","content":"\u003cp\u003eI'd love to found and build my own business that will (hopefully) help save the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"68bda807-0846-4ea7-a844-b9b3d1670c0c\"}":{"__typename":"School","uuid":"68bda807-0846-4ea7-a844-b9b3d1670c0c","name":"Episcopal Academy","city":"Newtown Square","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19073"},"Education:{\"uuid\":\"d9a406b4-a13b-4da6-9b91-7df550b92b27\"}":{"__typename":"Education","uuid":"d9a406b4-a13b-4da6-9b91-7df550b92b27","school":{"__ref":"School:{\"uuid\":\"68bda807-0846-4ea7-a844-b9b3d1670c0c\"}"},"startYear":"2022","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"731d40ce-d6eb-4b34-bf48-8c0cd6c22e5c\"}":{"__typename":"Education","uuid":"731d40ce-d6eb-4b34-bf48-8c0cd6c22e5c","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Mathematics","degree":null},"MentorPublicProfile:{\"uuid\":\"7ed83c94-4356-4ce9-a118-1fea306f6400\"}":{"__typename":"MentorPublicProfile","uuid":"7ed83c94-4356-4ce9-a118-1fea306f6400","displayName":"David D.","slug":"david-luyi","biography":"\u003cp\u003eHey there! I'm David, a mathematics student at Stanford University, and I'm passionate about one thing above all else: learning. Whether I'm diving into a new research project, picking up my guitar, or figuring out the mechanics behind a basketball shot, I'm driven by curiosity and the thrill of understanding how things work. But what really fulfills me is sharing that excitement with others, which is exactly why I'm here as a mentor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy academic journey has taken me from publishing machine learning research in the National High School Journal of Science to presenting my novel, wave-powered desalination design at university conferences as the only high schooler in attendance. I've been recognized as a Regeneron STS Top 300 Scholar (the oldest and most prestigious research competition for high schoolers); I've founded clubs and founded startups; I've built passion project after passion project. But here's what I've learned: the path to these achievements isn't always straightforward, and you don't have to figure it out alone.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI remember feeling overwhelmed by the research process in high school. I wondered how to even approach professors, navigate the steep learning curve, or balance ambitious projects with everything else on my plate. I got lucky with an incredible mentor at the University of Michigan who gave me a chance, and I had a math teacher, Dr. Goebeler, who taught me for three years and completely shaped how I think. He didn't just teach formulas; he challenged us to think beyond the material, to ask \"why\" and \"what if.\" That's the approach I bring to mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe in letting students take the lead. My role isn't to hand you answers, it's to provide guidance, ask the right questions, and help you develop the skills to solve problems on your own. Whether you're working on research projects, tackling challenging coursework, navigating college applications, or trying to get ahead in school, I'm here to help you build confidence and capability. I've worked across mathematics, computer science, machine learning, data science, and engineering, so I can support you in a wide range of academic subjects and projects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond academics, I'm someone who loves building things, whether that's coding a new web app, training for a lift at the gym, reading about ideas that might help save the world, or working on whatever creative project catches my attention in the moment. I play basketball, tennis, and guitar, and I genuinely believe that the same curiosity and problem-solving skills that make you good at math or science can make you better at anything.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I want most for my students isn't just to help them complete a project or ace an exam. I want you to walk away with a genuine love for learning, pride in what you've accomplished, and skills that will serve you for life. I want you to experience those \"aha\" moments that make all the hard work worthwhile. If you're looking for someone who will challenge you, support you, and celebrate your growth every step of the way, I'd love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"rB4iUQh02g9O8Fp9ysc5iJ02ls6g3Uh3Tg100vn3SAItmU","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Mathematics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c4087c5d-bcae-4985-9d55-eecc54127a5b\"}"},{"__ref":"DeepDives:{\"uuid\":\"72063e15-8581-4748-906a-098d7b559692\"}"},{"__ref":"DeepDives:{\"uuid\":\"bdf9bb3a-d436-4256-9eb5-51d640710d06\"}"},{"__ref":"DeepDives:{\"uuid\":\"4ad84c73-deb2-4902-9196-aa17740735e4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/02d51229-0152-469d-9a19-70085b28cc8c/-/preview/-/format/jpg/","https://ucarecdn.com/e1db7b41-2aa5-449a-8364-dfb0eea27e4e/-/preview/-/format/jpg/","https://ucarecdn.com/34f21e8f-e313-45e8-8cac-c6a13f61ddc8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d9a406b4-a13b-4da6-9b91-7df550b92b27\"}"},{"__ref":"Education:{\"uuid\":\"731d40ce-d6eb-4b34-bf48-8c0cd6c22e5c\"}"}],"hiredAt":"2026-01-31T15:46:36.215Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Computer Science","Coding / Programming","Sports Analytics","Machine Learning / AI","STEM Project"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"david-luyi\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"7ed83c94-4356-4ce9-a118-1fea306f6400\"}"}}},"_sentryTraceData":"55811f639ef0456c98828b850711a17e-b8e1d9c4706c4918-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=55811f639ef0456c98828b850711a17e,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"david-luyi"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript>
