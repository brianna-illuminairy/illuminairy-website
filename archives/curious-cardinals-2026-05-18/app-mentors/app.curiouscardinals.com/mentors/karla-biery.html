xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9497ab21-8920-403e-8276-7949b1a3c424\"}":{"__typename":"Favorites","uuid":"9497ab21-8920-403e-8276-7949b1a3c424","photoUrl":"https://ucarecdn.com/ccfcf23c-dab2-4363-b318-aee5150e14a9/","title":" Vespertine","type":"ALBUM"},"Favorites:{\"uuid\":\"a2895cc8-3591-4057-a525-bfe3db941dbd\"}":{"__typename":"Favorites","uuid":"a2895cc8-3591-4057-a525-bfe3db941dbd","photoUrl":"https://ucarecdn.com/d27caf96-5001-463a-bf6c-47d5ec863e0f/","title":"El Anatsui","type":"ARTIST"},"Favorites:{\"uuid\":\"bd8bc1cf-0afc-4c37-990c-a547abe4f5a4\"}":{"__typename":"Favorites","uuid":"bd8bc1cf-0afc-4c37-990c-a547abe4f5a4","photoUrl":"https://ucarecdn.com/68bef7aa-17a2-48d0-b42f-c475dc78e8db/","title":"The Hidden Life of Trees","type":"BOOK"},"CausesSupported:{\"uuid\":\"c40e31ec-d07b-4958-b0e8-e081de6c2483\"}":{"__typename":"CausesSupported","uuid":"c40e31ec-d07b-4958-b0e8-e081de6c2483","name":"Hot Meals","description":"\u003cp\u003eThis Chicago-based soup kitchen has been run by my Mother for my whole life!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/ad82761b-b7f6-4052-a99c-e695b329bd8d/"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"3c02e3f2-6c21-4392-8acb-138df8ea2b9b\"}":{"__typename":"DeepDives","uuid":"3c02e3f2-6c21-4392-8acb-138df8ea2b9b","content":"\u003cp\u003eIf I could go back in time (hi Karla!) and give myself a piece of advice, it would be to take a big breath, close your eyes, and try to meditate for five minutes. As a teenager, the prospect of who I would become was extremely daunting. I was often worried about the future and not focused on the present. Meditation has been a very helpful way for me to stay grounded in my body and calm down my mind, even in the most stressful moments.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"86de8e5e-000d-430e-a835-fd651deb739d\"}":{"__typename":"DeepDives","uuid":"86de8e5e-000d-430e-a835-fd651deb739d","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to open an arts center for youth. Art has made me who I am today, and without access to arts education, I wouldn’t be where I am. I believe all people can benefit from art, and I am committed to making art accessible to as many people as possible, especially young people. The art center would offer free and low cost art classes to students under the age of 20, as well as an art residency program for working artists to have studio space and teach classes. I also imagine running a gardening program for the students to learn about where our food comes from and to feel connected to the earth. The kitchen will be big, and there will be lots of comfortable chairs and sofas. I can see it now!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"4763ca97-ef09-49e5-8c27-a2c5d6f4ad40\"}":{"__typename":"DeepDives","uuid":"4763ca97-ef09-49e5-8c27-a2c5d6f4ad40","content":"\u003cp\u003eMy greatest mentor is my Grandfather, who I call Papa. He was also an artist and always believed in and nurtured my creative visions, even from a very young age. It was his idea to enroll me in art classes, even when I didn’t feel confident in my skills. As I got older, he helped me edit essays and my college applications, as well as my application for the Fulbright Scholarship! He modeled for me what it is to be a real artist and made my present reality possible. Although he passed away last year, he is very much still alive in my heart. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"95eb4b4f-93ac-487f-b88a-f2a1b5e8b77c\"}":{"__typename":"DeepDives","uuid":"95eb4b4f-93ac-487f-b88a-f2a1b5e8b77c","content":"\u003cp\u003eI am extremely proud of landing an internship in the studio of the artist Ernesto Neto, one of the world’s most famous contemporary artists, and I’m not exaggerating! While completing my senior thesis project, I was researching artists that use crochet and fiber arts to represent connection, and discovered the work of Ernesto Neto. I had already seen one of his pieces in the Museum of Contemporary Art in Chicago (my hometown), but didn’t know his name. Once I began to research his work, I realized that he was doing exactly what I wanted to do, and made it my goal to work for him. I worked for an entire summer to contact him, calling and emailing galleries all around the world, until I finally heard back from a gallery in New York which put me in touch with his studio. I had an interview, sent my portfolio and resume, and was accepted to be an intern as part of my Fulbright Scholarship. Working for Neto has been the most rewarding and beautiful experiences of my life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"a6f39ed7-34d7-4556-9907-ea1ad07dc30e\"}":{"__typename":"School","uuid":"a6f39ed7-34d7-4556-9907-ea1ad07dc30e","name":"Jones College Prep","city":"Chicago","type":"HIGH","state":"Illinois","country":"Estados Unidos","zip":"60605"},"Education:{\"uuid\":\"87461d80-ac59-4032-a900-2cfcf292ccd8\"}":{"__typename":"Education","uuid":"87461d80-ac59-4032-a900-2cfcf292ccd8","school":{"__ref":"School:{\"uuid\":\"a6f39ed7-34d7-4556-9907-ea1ad07dc30e\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"baed9eb4-d6cb-4b59-accb-4d028b5ff2e5\"}":{"__typename":"School","uuid":"baed9eb4-d6cb-4b59-accb-4d028b5ff2e5","name":"Mount Holyoke College","city":"South Hadley","type":"COLLEGE","state":"Massachusetts","country":"Estados Unidos","zip":"01075"},"Education:{\"uuid\":\"2a6b7c74-7914-4a68-a665-9eaf89258856\"}":{"__typename":"Education","uuid":"2a6b7c74-7914-4a68-a665-9eaf89258856","school":{"__ref":"School:{\"uuid\":\"baed9eb4-d6cb-4b59-accb-4d028b5ff2e5\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Critical Social Thought","degree":null},"MentorPublicProfile:{\"uuid\":\"6c4d1306-7933-41fe-84ce-7b58e548d9ad\"}":{"__typename":"MentorPublicProfile","uuid":"6c4d1306-7933-41fe-84ce-7b58e548d9ad","displayName":"Karla B.","slug":"karla-biery","biography":"\u003cp\u003eMy name is Karla Biery, and I’m looking forward to being your mentor! I graduated from Mount Holyoke College in 2023 with a major in Critical Social Thought and a minor in Spanish. This year (February, 2025), I moved to Brazil as a Fulbright Scholar to study public art and work in the studio of the artist Ernesto Neto. After living here for a few months, I decided to make Brazil my home, and now work in the studio of the artist Maria Nepomuceno as well as an art resident in a studio here in Rio de Janeiro. And yes, I do speak Portuguese (tudo bem?)\u003c/p\u003e\u003cp\u003eI believe that art has the unique ability to positively impact all people, and I am committed to sharing the power of art with as many people as possible. In 2023, I completed a nine month long collaborative art project to culminate my self-directed major to combat loneliness on my college campus. My community was suffering greatly from social divisions due to the pandemic, so I orchestrated a project that would give students a sense of belonging through artistic collaboration. The artwork consists of various crochet and knit pieces made by 75 different artists on campus, serving as a metaphor for the beauty of diversity and the many ways we can be together in community. The piece, titled Devotion, now lives in the maker space on Mount Holyoke’s campus.\u003c/p\u003e\u003cp\u003eAnother important project that I helped organize was a week-long arts summer camp in Loiza, Puerto Rico. At the time (August, 2023), I was working with a New York based arts organization that offers free art and music classes to low income students across New York. One of the founders of the organization has Puerto Rican heritage and always wanted to host a summer camp in his mother’s hometown, so I applied for and was awarded the Middlebury Projects for Peace grant to help make this project happen! We spent a week making art and music with more than 30 students which ended in a huge celebration.\u003c/p\u003e\u003cp\u003eIn my free time (outside of art making :), I like to dance, surf, spend time with friends, and bake! My most recent baking escapade was a four layer sponge cake soaked with homemade blackberry compote and decorated with a whipped cream frosting, it was delicious.\u0026nbsp;\u003c/p\u003e\u003cp\u003eMaking dreams come true is my passion, and I would be honored to help you turn your visions into reality.\u0026nbsp;\u003c/p\u003e","teachingVideoPlaybackId":"rP8vwHYF3HdUSBfxPcGLC6KZRHq02vig5Cjyd01H02OYuU","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement is organizing and completing my senior thesis project, an artwork titled Devotion. I already mentioned this project in my bio, but I just wanted to add that this artwork changed the course of my life! I created so many friendships and other inspiring relationships through the creation of this work, and it propelled me to apply for a Fulbright scholarship!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"9497ab21-8920-403e-8276-7949b1a3c424\"}"},{"__ref":"Favorites:{\"uuid\":\"a2895cc8-3591-4057-a525-bfe3db941dbd\"}"},{"__ref":"Favorites:{\"uuid\":\"bd8bc1cf-0afc-4c37-990c-a547abe4f5a4\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"c40e31ec-d07b-4958-b0e8-e081de6c2483\"}"}],"major":"Critical Social Thought","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3c02e3f2-6c21-4392-8acb-138df8ea2b9b\"}"},{"__ref":"DeepDives:{\"uuid\":\"86de8e5e-000d-430e-a835-fd651deb739d\"}"},{"__ref":"DeepDives:{\"uuid\":\"4763ca97-ef09-49e5-8c27-a2c5d6f4ad40\"}"},{"__ref":"DeepDives:{\"uuid\":\"95eb4b4f-93ac-487f-b88a-f2a1b5e8b77c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d9aff800-4570-4bd8-9504-faf5930a53dd/-/preview/-/format/jpg/","https://ucarecdn.com/890d4bed-ce29-4318-a7fb-a79bc23e1ab3/-/preview/-/format/jpg/","https://ucarecdn.com/ea5650ca-d4a6-4711-b3da-ea08315568b1/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"87461d80-ac59-4032-a900-2cfcf292ccd8\"}"},{"__ref":"Education:{\"uuid\":\"2a6b7c74-7914-4a68-a665-9eaf89258856\"}"}],"hiredAt":"2025-11-06T16:01:59.472Z","topics":["K-5 Grade Math","6-8 Grade Science","Writing","Spanish","Academic Coaching","College Essay Writing","Creative Writing","Fashion / Cosmetics","Film / Theater","History Project","K-6 Storybook","Video / Photography","Visual Arts / Graphic Design","Journalism","Public Speaking"],"communityBadges":["https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":
