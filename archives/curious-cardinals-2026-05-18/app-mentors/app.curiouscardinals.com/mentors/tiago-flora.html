sources and improve the curriculum of one of his university’s core courses, developing materials on statistics, algorithms, and decision theory.\n\nA strong believer in the importance of data literacy, Tiago loves diving into data visualization and exploratory analysis. He has worked on projects on transportation policy in San Francisco, on emerging-market opportunities for venture capital in South Korea, and on curriculum marketing in India. If you enter a casual conversation with him, prepare to leave with some podcast recommendations. And if he is your teacher or tutor, get ready to revisit gaps in knowledge and answer lots, and many lots, of questions.","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":null,"deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/97783b77-920d-43d7-abd2-d3341f9c8227/-/crop/603x603/42,192/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"db318e79-84f3-46b9-98ad-578f3c21d7ea\"}"}],"hiredAt":"2021-11-02T16:31:05.000Z","topics":["Game Design","Physics","Coding / Programming","STEM Project","History Project","Law / Government / Policy","Economics","Machine Learning / AI","History"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tiago-flora\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d49fff3b-5fc5-40bf-9f23-7ac9a032b2f6\"}"}}},"_sentryTraceData":"397019d399014c39918fd856cd65d516-9cde06551a320e23-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=397019d399014c39918fd856cd65d516,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug
