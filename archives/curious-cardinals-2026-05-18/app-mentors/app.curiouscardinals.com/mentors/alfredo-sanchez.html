xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"61b84013-4d18-4124-90bb-50a9479b1fb9\"}":{"__typename":"Favorites","uuid":"61b84013-4d18-4124-90bb-50a9479b1fb9","photoUrl":"https://ucarecdn.com/6d405504-8ffe-4ab8-91d4-87510dcf9c64/","title":"Kobe Bryant","type":"ATHLETE"},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"9894cd14-a428-4c73-b8e8-b239b1412f7e\"}":{"__typename":"DeepDives","uuid":"9894cd14-a428-4c73-b8e8-b239b1412f7e","content":"\u003cp\u003eSomething I am extremely proud of is my experience as a Fulbright Scholar in Taiwan. I taught English at two rural, indigenous elementary schools in Taitung, the most remote part of the island. Going in, I knew it would be a challenge—not just teaching in a new environment, but also building trust and connecting across language and cultural barriers.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eWhat makes me proud is not just that I taught English, but that I created genuine relationships with my students, colleagues, and community. I built lesson plans that incorporated their indigenous traditions, played soccer and guitar with them after class, and saw students who were initially shy begin to grow in confidence and curiosity. For me, success wasn’t about perfect grammar; it was about helping kids believe in themselves and recognize the value of their voices.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eThat year also taught me a lot about adaptability and humility. I was living in a new culture, learning Mandarin, and balancing my own growth with the responsibility of representing the U.S. abroad. It pushed me outside my comfort zone in ways that no classroom or office ever could, and it left me with a much deeper appreciation for teaching, mentorship, and cultural exchange.\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eI’m proud of this experience because it combined service, growth, and impact. It showed me that when I commit myself fully, I can make a difference—not just in energy markets or research, but in people’s lives.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"ceb31882-7ab1-43f3-8160-75d19792d90c\"}":{"__typename":"School","uuid":"ceb31882-7ab1-43f3-8160-75d19792d90c","name":"Sagemont Preparatory School (Upper Campus)","city":"Weston","type":"HIGH","state":"Florida","country":"United States","zip":"33327"},"Education:{\"uuid\":\"5bae3334-8bf0-46e9-afb8-216a46b7c020\"}":{"__typename":"Education","uuid":"5bae3334-8bf0-46e9-afb8-216a46b7c020","school":{"__ref":"School:{\"uuid\":\"ceb31882-7ab1-43f3-8160-75d19792d90c\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"bc2168d8-b531-442f-86a5-96567c0dc589\"}":{"__typename":"Education","uuid":"bc2168d8-b531-442f-86a5-96567c0dc589","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"26f1ac82-7f30-4ef7-96e5-fbd00ac85714\"}":{"__typename":"MentorPublicProfile","uuid":"26f1ac82-7f30-4ef7-96e5-fbd00ac85714","displayName":"Alfredo S.","slug":"alfredo-sanchez","biography":"\u003cp\u003eHi, I’m Alfredo!\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m a proud first-generation Venezuelan American, born and raised in South Florida, with roots that have always connected me deeply to culture, resilience, and the importance of opportunity. I studied Mechanical Engineering and Energy \u0026amp; Environment at Duke University, where I discovered my passion for tackling some of the world’s most pressing challenges—how we power our societies, transition away from fossil fuels, and build sustainable systems for the future. Today, I work as an Energy Transition Analyst in Austin, TX, where I focus on understanding and forecasting how technologies like battery storage and renewables will reshape electricity markets. It’s a role that combines technical rigor with big-picture thinking, and I’m grateful every day to be in a field where curiosity and impact go hand in hand.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve been fortunate to live, study, and work on four continents, and each experience has left a lasting mark on who I am. In 2024–25, I served as a Fulbright Scholar in Taiwan, teaching English at two elementary schools in rural, indigenous Taitung—the most remote and, in my opinion, the most fascinating region of the island. Beyond language lessons, I focused on building cultural bridges, mentoring young students, and learning just as much from them as they did from me. My time there reinforced my love for languages and global perspectives; in addition to English, I speak Spanish fluently and can get by in Mandarin Chinese, which I continue to study.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love to learn. Whether it’s energy technologies, geopolitics, history, or new ways of thinking about the environment, I’m always seeking to connect dots between disciplines. I believe deeply in the power of knowledge-sharing, which is why tutoring, mentoring, and teaching have been some of the most meaningful parts of my journey so far. Helping young people not only grow academically but also gain confidence and direction is something I find incredibly rewarding, and I hope to carry that passion for teaching and mentorship throughout my career.\u003c/p\u003e\u003cp\u003eOutside of academics and career, I try to live fully and intentionally. I play guitar—both acoustic and electric—and love sports like soccer, basketball, and beach volleyball. Cooking and lifting are passions of mine, and I place a lot of importance on wellness, mental health, and meditation as tools for balance.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the end of the day, I hope to be a mentor who not only teaches but also inspires—someone who shares experiences honestly, encourages curiosity, and helps others chart their own paths with confidence and purpose.\u003c/p\u003e","teachingVideoPlaybackId":"g21sn802BlEAvCzVKAfpwwiFLq02O92DWMQMUHIVequmc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"61b84013-4d18-4124-90bb-50a9479b1fb9\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9894cd14-a428-4c73-b8e8-b239b1412f7e\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/be8be610-4706-44aa-89a9-9b2fe87b8809/-/preview/-/format/jpg/","https://ucarecdn.com/d5c5cdb4-3d6d-48e4-b95d-f59998b4473b/-/preview/-/format/jpg/","https://ucarecdn.com/389a1746-9146-4803-8015-31481caddad3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"5bae3334-8bf0-46e9-afb8-216a46b7c020\"}"},{"__ref":"Education:{\"uuid\":\"bc2168d8-b531-442f-86a5-96567c0dc589\"}"}],"hiredAt":"2025-09-11T16:17:32.186Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Physics","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Sports Journalism","History Project","Video / Photography","Business /
