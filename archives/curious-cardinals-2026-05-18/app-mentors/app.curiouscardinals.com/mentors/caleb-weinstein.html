xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b15b1023-2179-4c5c-9855-ab802edf8929\"}":{"__typename":"DeepDives","uuid":"b15b1023-2179-4c5c-9855-ab802edf8929","content":"\u003cp\u003eChief Economist at the International Monetary Fund\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"9027e051-5e91-4191-b248-316506d7633c\"}":{"__typename":"DeepDives","uuid":"9027e051-5e91-4191-b248-316506d7633c","content":"\u003cp\u003eI chose Economics because it studies how people make decisions and how we can cooperate to drive society forward and make everyone better off.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"6e598e32-1beb-41b7-842a-f9c18b0c6cd5\"}":{"__typename":"DeepDives","uuid":"6e598e32-1beb-41b7-842a-f9c18b0c6cd5","content":"\u003cp\u003eMy grandfather. He taught me to be curious about other people and to appreciate that everyone has their own experiences and stories to share. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"e034dd20-7923-408c-a98b-1aa1780486c8\"}":{"__typename":"DeepDives","uuid":"e034dd20-7923-408c-a98b-1aa1780486c8","content":"\u003cp\u003eI was always looking for someone to debate especially about politics, current affairs, and philosophy. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"071bbfd1-dba1-4398-be60-1e4e5d694a6e\"}":{"__typename":"School","uuid":"071bbfd1-dba1-4398-be60-1e4e5d694a6e","name":"Hampton School","city":"Hampton","type":"HIGH","state":"England","country":"United Kingdom","zip":"TW12 3HD"},"Education:{\"uuid\":\"b82956a4-b00a-44a1-b8e0-6d72caf3b811\"}":{"__typename":"Education","uuid":"b82956a4-b00a-44a1-b8e0-6d72caf3b811","school":{"__ref":"School:{\"uuid\":\"071bbfd1-dba1-4398-be60-1e4e5d694a6e\"}"},"startYear":"2019","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"b112aaaa-ec54-4b48-b426-5f79acf21ea7\"}":{"__typename":"Education","uuid":"b112aaaa-ec54-4b48-b426-5f79acf21ea7","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"7d89f6b2-a4b3-40c7-ac62-484a47406f63\"}":{"__typename":"MentorPublicProfile","uuid":"7d89f6b2-a4b3-40c7-ac62-484a47406f63","displayName":"Caleb W.","slug":"caleb-weinstein","biography":"\u003cp\u003eI’m an Economics student at Duke University who enjoys helping students make sense of challenging material. My focus is on giving students the tools they need to solve complex problems in unfamiliar situations—by reasoning from first principles and building on what is already intuitive to them.\u003c/p\u003e\u003cp\u003eI’m a Teaching Assistant for Economics 101 and 201 at Duke, where I regularly work with students learning challenging concepts for the first time. This has given me lots of experience breaking ideas down step by step, spotting where students tend to get stuck, and tailoring my explanations to different learning styles. I put a strong emphasis on building confidence, because once students feel comfortable asking questions, everything starts to click more easily.\u003c/p\u003e\u003cp\u003eAlongside teaching, I do research on how federal funding affects schools in high-poverty areas in North Carolina. In this work, I code automations to streamline data collection and use statistical software to establish causal relationships. This has strengthened my ability to think clearly with data and explain complex ideas in a simple, intuitive way, which I bring directly into my tutoring sessions.\u003c/p\u003e\u003cp\u003eMy interest in economics began in high school, where I completed three independent research projects on behavioral economics, competition, and microfinancing. These projects shaped the way I approach learning and teaching—students should always be asking themselves \u003cem\u003ewhy\u003c/em\u003e they are learning something. Wherever possible, I use a problem-based approach to tutoring that focuses on real-world applications, helping concepts feel relevant and memorable.\u003c/p\u003e\u003cp\u003eI also have a strong background in applied mathematics and regularly use algebra and calculus in my own studies, so I’m happy to support students across a wide range of subjects, particularly at the middle and high school level.\u003c/p\u003e\u003cp\u003eI’ve studied at the University of Cambridge through a summer programme and will be studying at Sciences Po Paris this fall. I was also a volunteer math tutor in high school, which gave me meaningful experience working with students in different settings and across different subjects. Across these experiences, I’ve learned how to adapt to each student’s pace, keep lessons engaging, and work comfortably with students from different backgrounds.\u003c/p\u003e\u003cp\u003eAs a tutor, I aim to be encouraging, organised, and easy to talk to. I’m also happy to support students who want to pursue a research interest, helping them bring a project to life from early ideas through analysis and presentation. Outside of academics, I enjoy going to basketball games, playing tennis, reading French literature, and listening to podcasts.\u003c/p\u003e","teachingVideoPlaybackId":"CVMBQEVDwb02dE4YzeTK1Hf9U2rpHlAg9ZaOS00WwLNhw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b15b1023-2179-4c5c-9855-ab802edf8929\"}"},{"__ref":"DeepDives:{\"uuid\":\"9027e051-5e91-4191-b248-316506d7633c\"}"},{"__ref":"DeepDives:{\"uuid\":\"6e598e32-1beb-41b7-842a-f9c18b0c6cd5\"}"},{"__ref":"DeepDives:{\"uuid\":\"e034dd20-7923-408c-a98b-1aa1780486c8\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/08864fec-f1e3-420d-8989-d24db57908fd/-/preview/-/format/jpg/","https://ucarecdn.com/20ad09ee-4aa0-47a7-9555-4a35b293d472/-/preview/-/format/jpg/","https://ucarecdn.com/eea889af-5c13-4e95-8198-f70d7579937c/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"b82956a4-b00a-44a1-b8e0-6d72caf3b811\"}"},{"__ref":"Education:{\"uuid\":\"b112aaaa-ec54-4b48-b426-5f79acf21ea7\"}"}],"hiredAt":"2026-01-14T23:08:19.199Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Chemistry","Physics","French","Spanish","Economics","Academic Coaching","History Project","Finance / Investing",
