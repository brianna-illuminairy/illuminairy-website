ename":"Education","uuid":"8d1b59d1-9933-4fe6-8152-8d33005d69c5","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Radio/Television/Film \u0026 Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"9af91fff-4253-4fc9-bd48-38080284ed24\"}":{"__typename":"MentorPublicProfile","uuid":"9af91fff-4253-4fc9-bd48-38080284ed24","displayName":"Diego G.","slug":"diego-goldfrank","biography":"\u003cp\u003eHi! My name is Diego, I'm a Data Science and Radio/Television/Film student at Northwestern University. I'm originally from New Jersey, and have roots in  Venezuela and other more exotic places, like California.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have always loved math, so being a Data Science student was almost a no brainer, combining math, statistics, and coding with making pretty graphs. I wasn't always good at math however, and spent a lot of time practicing and having to teach myself concepts, but with enough effort, I was able to get a perfect score on the AP Calculus BC exam my junior year of high school. I then began tutoring younger students in math, and recently have been a teaching assistant in an introductory statistics class, and I realized that I love helping students understand math, because I know how to explain things that I also originally had trouble with.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of my nerdy math interests, I spent high school running a meme account related to my high school. It was originally just a hobby, but after using my platform to keep the community together during COVID with a \"quarantine olympics\", I realized that there was more to do within entertainment. I picked up the film major at Northwestern after realizing that most other students had little experience going in, and wanted to pursue my other passions.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy creative side has shined here, as well as my more analytical side, and I found a nice intersection in the production side of things. As well as acting, I have used my organizational and leadership skills to AD a sitcom pilot that shot over three weekends!\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAside from that, I love exercising and sports like basketball and soccer, watching television from \u003cem\u003eSuccession\u003c/em\u003e to \u003cem\u003eOne Piece, \u003c/em\u003eand cooking!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI interned at The Late Show with Stephen Colbert in Summer '24. I don't know if I count this as my greatest achievement, but it was the best experience of my life so far, and something I'm proud to have been a part of\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c29f39f8-1db0-47f7-ad5e-cb8415227021\"}"}],"causesSupported":[],"major":"Radio/Television/Film \u0026 Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"dbb46a15-5a29-49ec-8499-a7b44ac35a45\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c73f19fc-8f03-4ff7-a877-9f6c79e903da/-/preview/-/format/jpg/","https://ucarecdn.com/bbbbe003-9816-4f6c-9d7e-36320ae35954/-/preview/-/format/jpg/","https://ucarecdn.com/77a61e71-5582-4502-9756-da7d975db57b/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e8a9bbdc-6bf0-46a0-a732-e8f29917c4c6\"}"},{"__ref":"Education:{\"uuid\":\"8d1b59d1-9933-4fe6-8152-8d33005d69c5\"}"}],"hiredAt":"2024-03-19T08:16:05.903Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Calculus","Writing","Spanish","College Essay Writing"],"communityBadges":["https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/1d5b7e03-e4d9-4751-811f-f186232e2c5d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"diego-goldfran
