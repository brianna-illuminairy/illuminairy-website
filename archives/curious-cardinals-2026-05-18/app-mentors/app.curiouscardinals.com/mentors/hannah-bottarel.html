xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"64b40966-e156-4f89-96ec-ae37b655f3bf\"}":{"__typename":"Favorites","uuid":"64b40966-e156-4f89-96ec-ae37b655f3bf","photoUrl":"https://ucarecdn.com/7193fcd3-e56b-439d-9c6f-c5b0da8ce60f/","title":"My Brilliant Friend by Elena Ferrante","type":"BOOK"},"Favorites:{\"uuid\":\"a88c256a-aee3-44cc-b345-4c4b3f39c80c\"}":{"__typename":"Favorites","uuid":"a88c256a-aee3-44cc-b345-4c4b3f39c80c","photoUrl":"https://ucarecdn.com/ee94c67a-9cb4-4e60-a0af-f9f16e5aad80/","title":"NUEVAYoL by Bad Bunny","type":"SONG"},"Favorites:{\"uuid\":\"1d63bce4-b6e2-4288-a49d-4c657979cb5a\"}":{"__typename":"Favorites","uuid":"1d63bce4-b6e2-4288-a49d-4c657979cb5a","photoUrl":"https://ucarecdn.com/db86f9b0-554a-4f32-9137-0988d2ac41f2/","title":"Marianela Nuñez","type":"ATHLETE"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d755d470-a02b-41fe-a0c2-e8ce9ee74fa6\"}":{"__typename":"DeepDives","uuid":"d755d470-a02b-41fe-a0c2-e8ce9ee74fa6","content":"\u003cp\u003eStop wasting so much energy worrying about how you're perceived. Most people are too busy thinking about themselves to scrutinize you the way you fear they are. Instead, pour that energy into the things that bring you joy and fulfillment—for me that was dancing/teaching ballet, leading ESL classes to new refugees to my community, and rewatching Gilmore Girls at least 7 times. Middle and high school can be brutal, but they’re also a unique time in your life where you have the opportunity to explore without all the pressure of having it “figured out.” Be passionate and kind to yourself. You don’t need to fit in—you just need to find what fits you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"52c64f4b-dd09-4a3c-a911-09501a5f09f9\"}":{"__typename":"DeepDives","uuid":"52c64f4b-dd09-4a3c-a911-09501a5f09f9","content":"\u003cp\u003eComing from a rural high school in Missouri where only 30% of students attend a 4-year college upon graduation, born into a family whose combined income is less than the ticket cost of a year of Harvard’s tuition, I would have never dreamed that I’d end up at Harvard. Incredible teachers and mentors encouraged me and allowed me to see myself as someone capable of making tangible change in my community and our world. Given this immense privilege, I hope to instill the same love of learning, self-confidence, and motivation to serve as a catalyst for change that my teachers did in me for students through Curious Cardinals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e I’ve been passionate about sharing knowledge for as long as I can remember, starting my first teaching gig at 8-years-old when I began teaching ballet lessons to children in my community who couldn’t afford traditional ballet training. Since then, I’ve taught everything from elementary school English in the Canary Islands to ESL classes to refugees relocating to rural Missouri to memory workshops with elderly women through the Red Cross.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship matters because it changes trajectories. I know that firsthand—and I’m committed to doing for others what my mentors did for me: making the impossible feel possible.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"27812bc9-245f-4861-832e-92cfeab2e1b6\"}":{"__typename":"DeepDives","uuid":"27812bc9-245f-4861-832e-92cfeab2e1b6","content":"\u003cp\u003eImmigration/Human Rights Lawyer—and then eventually a clinical professor helping train the next generation of immigration/human rights attorneys!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"d79c8c44-261d-4e2f-9c88-7063b35bb52a\"}":{"__typename":"School","uuid":"d79c8c44-261d-4e2f-9c88-7063b35bb52a","name":"Ozark High School","city":"Ozark","type":"HIGH","state":"Missouri","country":"United States","zip":"65721"},"Education:{\"uuid\":\"80edc80f-61bb-4dd5-95c2-80ece31f5276\"}":{"__typename":"Education","uuid":"80edc80f-61bb-4dd5-95c2-80ece31f5276","school":{"__ref":"School:{\"uuid\":\"d79c8c44-261d-4e2f-9c88-7063b35bb52a\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}":{"__typename":"School","uuid":"a1719aa1-7f00-494c-8b4a-862769839a03","name":"Harvard College","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"51970f05-71e9-4914-a68c-1ea904584ffa\"}":{"__typename":"Education","uuid":"51970f05-71e9-4914-a68c-1ea904584ffa","school":{"__ref":"School:{\"uuid\":\"a1719aa1-7f00-494c-8b4a-862769839a03\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Social Studies (Anthropology, History, and Philosophy)","degree":null},"MentorPublicProfile:{\"uuid\":\"742caed2-ae55-40de-a522-3757702f5100\"}":{"__typename":"MentorPublicProfile","uuid":"742caed2-ae55-40de-a522-3757702f5100","displayName":"Hannah B.","slug":"hannah-bottarel","biography":"\u003cp\u003eHi there! My name is Hannah, and I’m passionate about making big ideas feel personal, empowering students to tell their stories, and helping young people connect the dots between what they care about and how they want to impact the world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI recently graduated from Harvard, where I studied Social Studies (a blend of Anthropology, History, and Philosophy) with a focus on migration, human rights, and the Americas. My academic journey has always been deeply interdisciplinary: I wrote a senior thesis on gender-based violence and immigration law, combining legal theory, archival research, philosophy, and ethnographic fieldwork at the U.S.–Mexico border.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCurrently, I’m a Fulbright Scholar living in the Canary Islands, where I teach English to primary school students and work with the Red Cross to support newly arrived migrant families. Next fall, I’ll be attending Stanford Law School, where I plan to continue my work in immigration advocacy. This work is deeply personal to me—growing up in rural Missouri near a Tyson chicken processing plant, I saw firsthand how undocumented workers were exploited. My ultimate goal is to represent people like those in my own community as an immigration and human rights lawyer.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside the classroom, I served as Chair of the JFK Jr. Forum at Harvard’s Institute of Politics, taught first-grade reading through Teach For America’s Ignite Fellowship, danced with the Harvard Ballet Company, and gave campus tours with the Crimson Key Society. I also juggled a handful of part-time jobs—teaching fellowships in engineering and economics, babysitting, and working as a legal intern at an immigrant rights nonprofit.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBut enough about me—I'm mentoring with Curious Cardinals because I believe few things are more fulfilling than helping students find their voice and recognize that their curiosity and creativity \u003cem\u003ematter\u003c/em\u003e. Whether I’m teaching ESL to a class of six-year-olds or helping a high schooler piece together their Common App essay, my goal is always the same: to meet students where they are and build confidence through connection, storytelling, and critical thinking.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve taught everything from ballet to bilingual basics, philosophy to phonemic awareness, and I’ve mentored students on everything from starting a nonprofit building prosthetics for artists to acing the ACT. I especially love working with students who are dreamers, deep thinkers, reluctant writers, or just unsure where to begin. My pedagogical style is rooted in empathy, intellectual honesty, and joy.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love to hike, read, and paint watercolor postcards of the places I travel. I also write letters to my future self every New Year’s Eve—a tradition that’s been spookily accurate.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIf you're looking for a mentor who’s equal parts Socratic and silly, who can turn jelly beans into a philosophy lesson or help you build a passion project from scratch, I’d love to work together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eLet’s build something meaningful!\u003c/p\u003e","teachingVideoPlaybackId":"M00dCJFsepS00mOjgiGCpQWvCo702bxnJgtbk6XsMcOY00s","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"64b40966-e156-4f89-96ec-ae37b655f3bf\"}"},{"__ref":"Favorites:{\"uuid\":\"a88c256a-aee3-44cc-b345-4c4b3f39c80c\"}"},{"__ref":"Favorites:{\"uuid\":\"1d63bce4-b6e2-4288-a49d-4c657979cb5a\"}"}],"causesSupported":[],"major":"Social Studies (Anthropology, History, and Philosophy)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d755d470-a02b-41fe-a0c2-e8ce9ee74fa6\"}"},{"__ref":"DeepDives:{\"uuid\":\"52c64f4b-dd09-4a3c-a911-09501a5f09f9\"}"},{"__ref":"DeepDives:{\"uuid\":\"27812bc9-245f-4861-832e-92cfeab2e1b6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a3e381a4-9308-430b-b2a1-d23bd82ee5bb/-/preview/-/format/jpg/","https://ucarecdn.com/22d35024-a991-4a5f-8195-96690c47d9ce/-/preview/-/format/jpg/","https://ucarecdn.com/69c6b936-33e5-4fc2-a837-844bbca62f49/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"80edc80f-61bb-4dd5-95c2-80ece31f5276\"}"},{"__ref":"Education:{\"uuid\":\"51970f05-71e9-4914-a68c-1ea904584ffa\"}"}],"hiredAt":"2025-06-26T17:50:08.343Z","topics":["K-5 Grade Math","Algebra I","Pre-Algebra","6-8 Grade Science","Writing","Spanish","Reading","History","College Essay Writing","Executive Function","Academic Coaching","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","Film / Theater","History Project","Video / Photography","Music","Business / Entrepreneurship","Medicine / Health","Law / Government / Policy","Public Speaking","Sustainability","Journalism","Debate"],"communityBadges":["https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"hannah-bottarel\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"742caed2-ae55-40de-a522-3757702f5100\"}"}}},"_sentryTraceData":"8c599dcfdaa84762886db04cae6cb85a-bfb814ef67b0f84a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=8c599dcfdaa84762886db04cae6cb85a,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"hannah-bottarel"
