xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"7b9fac22-571c-4a01-8fb3-5b8f920a6b1b\"}":{"__typename":"DeepDives","uuid":"7b9fac22-571c-4a01-8fb3-5b8f920a6b1b","content":"\u003cp\u003eIn high school, I partnered with an educational equity-driven nonprofit - United to Learn - to address teacher shortages in under-resourced Dallas elementary schools post-COVID. I interviewed educators, identified that substitutes lacked structured lesson plans, and helped build a bilingual (English/Spanish) video-lesson hub that aligned with district standards. The resource was temporarily implemented across 12 schools, giving subs a ready-made toolkit and keeping students on track. It was a crash course in user-centered design, rapid prototyping, and the real-world impact of thoughtful software.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"05c8184d-452e-4acc-a8e3-6fcebb28818b\"}":{"__typename":"DeepDives","uuid":"05c8184d-452e-4acc-a8e3-6fcebb28818b","content":"\u003cp\u003eI used to toggle between loving the elegance of algorithms and obsessing over why some ideas go viral while others fizzle. Networked \u0026amp; Social Systems Engineering felt like permission to chase both questions at once. It lets me explore how code, incentives, and human behavior braid together - whether that’s a recommendation engine on TikTok or a grassroots fundraising campaign. I chose the major because I don’t just want to build software that works. I want to understand the ripple effects it sends through real communities and design those ripples to do good.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c32858fb-bdde-4274-92c5-c8a13a9fa873\"}":{"__typename":"DeepDives","uuid":"c32858fb-bdde-4274-92c5-c8a13a9fa873","content":"\u003cp\u003eMy dream job is to be the founder of an open-source ed-tech company that makes creative computing as accessible as watching a YouTube tutorial. I picture leading a passionate team that blends teaching, product design, and community building to give every kid - whether they’re in rural Texas, Lagos, or downtown Philly - a place to code projects, get mentorship, and collaborate across borders. Whatever my specific role ends up being, I want it to be geared towards a commitment to closing opportunity gaps through joyful, hands-on learning.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"4fd819f4-55d8-4c65-bea4-f0bc72347c3a\"}":{"__typename":"DeepDives","uuid":"4fd819f4-55d8-4c65-bea4-f0bc72347c3a","content":"\u003cp\u003eMentorship turns knowledge into opportunity. I am a proud Nigerian-American student in engineering spaces where few people look like me. Mentors who shared their time and trust helped me translate raw curiosity into concrete skills and confidence. I mentor because I want to replicate that catalytic effect for others - especially students who might otherwise conclude that coding or engineering “isn’t for people like me.” Watching a learner move from tentative questions to independent problem -solving is the most rewarding feedback loop I know.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"536bf7c9-5943-4878-9a47-642b2889f15c\"}":{"__typename":"School","uuid":"536bf7c9-5943-4878-9a47-642b2889f15c","name":"Ursuline Academy of Dallas","city":"Dallas","type":"HIGH","state":"Texas","country":"United States","zip":"75229"},"Education:{\"uuid\":\"b366d32e-38e0-40a5-9a7e-e70eec748498\"}":{"__typename":"Education","uuid":"b366d32e-38e0-40a5-9a7e-e70eec748498","school":{"__ref":"School:{\"uuid\":\"536bf7c9-5943-4878-9a47-642b2889f15c\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"acd05e1b-d053-4927-b6c2-e84b3cf0a449\"}":{"__typename":"Education","uuid":"acd05e1b-d053-4927-b6c2-e84b3cf0a449","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Networked \u0026 Social Systems Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"9c4cba65-ac99-4ed8-b749-0588906ccfdc\"}":{"__typename":"MentorPublicProfile","uuid":"9c4cba65-ac99-4ed8-b749-0588906ccfdc","displayName":"Demi F.","slug":"demi-fashemo","biography":"\u003cp\u003eHi! My name is Demi Fashemo and I am a Networked \u0026amp; Social Systems Engineering major at the University of Pennsylvania with minors in Engineering Entrepreneurship and Mathematics. My academic world blends computer science, economics, and network theory, but the common thread is people: I’m fascinated by how thoughtful design can make technology welcoming, intuitive, and equitable.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat human focus first drew me to teaching. During two years as an instructor at Code Ninjas, I guided students ages 5–14 through Python, Java, and even a few C++ adventures. Explaining loops to a first-grader one day and recursion to a middle-schooler the next taught me how to translate abstract concepts into concrete “aha” moments and to celebrate small wins that snowball into confidence. Outside the coding dojo, I partnered with the nonprofit United to Learn to build a bilingual video-lesson hub for Dallas elementary schools facing post-pandemic teacher shortages. Seeing substitute teachers rely on resources I helped create affirmed that accessible learning tools can change daily classroom realities.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Penn, I served on the Underrepresented Students Advisory Board in Engineering - turning student feedback into action plans for a more inclusive community. This role sharpened my ability to listen first, tailor guidance to diverse needs, and frame technical challenges in a broader social context - skills I bring directly to mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn sessions with me, you won’t just follow an aimless tutorial. You’ll explore new ideas through the lenses of topics you actually care about. Maybe that means turning a favorite game into code, visualizing climate data for a science fair, or drafting a business model around an app idea. We’ll break the goal into clear milestones, pair practical techniques with creative exploration, and reflect on how your work connects to real-world problems. My job is to provide the scaffolding - problem-solving strategies, tips, and a safe space to ask “why?” - until you’re ready to climb on your own.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI believe curiosity expands in community, and I’m excited to build that community with students who are eager to learn, iterate, and share their creations with the world.\u003c/p\u003e","teachingVideoPlaybackId":"6VBd1JPcwI700hUGX1bPt02hi6xKVqGdHiGR02c018uqfiA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Networked \u0026 Social Systems Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"7b9fac22-571c-4a01-8fb3-5b8f920a6b1b\"}"},{"__ref":"DeepDives:{\"uuid\":\"05c8184d-452e-4acc-a8e3-6fcebb28818b\"}"},{"__ref":"DeepDives:{\"uuid\":\"c32858fb-bdde-4274-92c5-c8a13a9fa873\"}"},{"__ref":"DeepDives:{\"uuid\":\"4fd819f4-55d8-4c65-bea4-f0bc72347c3a\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/2a64279e-1622-41a6-96fa-b2060dca6f92/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b366d32e-38e0-40a5-9a7e-e70eec748498\"}"},{"__ref":"Education:{\"uuid\":\"acd05e1b-d053-4927-b6c2-e84b3cf0a449\"}"}],"hiredAt":"2025-04-21T04:11:54.464Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","6-8 Grade Science","Writing","Academic Coaching","Executive Function","Computer Science","College Essay Writing","Reading","Economics"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/0cb8f4ef-d00c-4de9-9bdf-ce3f91e26095/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"demi-fashemo\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"9c4cba65-ac99-4ed8-b749-0588906ccfdc\"}"}}},"_sentryTraceData":"31ecb4bb8b0644a68fddb155d3bc2575-911bd2e53d12817f-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=31ecb4bb8b0644a68fddb155
