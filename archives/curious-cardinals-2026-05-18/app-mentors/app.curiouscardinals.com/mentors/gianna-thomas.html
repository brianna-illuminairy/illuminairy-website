xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"33d4c6f2-6ad6-4f24-ab5b-75ca7efce653\"}":{"__typename":"DeepDives","uuid":"33d4c6f2-6ad6-4f24-ab5b-75ca7efce653","content":"\u003cp\u003eI’d tell myself that not knowing the rules doesn’t mean you don’t belong. Ask the “obvious” questions sooner, seek out people who are doing what you want to do, and don’t wait to feel ready before taking opportunities. Confidence comes from doing, not from having everything figured out in advance, you truly learn so much more going into things ready to learn and explore! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"004d5b58-8448-4a7e-af1d-6f013514a8be\"}":{"__typename":"DeepDives","uuid":"004d5b58-8448-4a7e-af1d-6f013514a8be","content":"\u003cp\u003eMentorship has been a cornerstone of my academic and professional career; it matters to me because it turns uncertainty into momentum. Having someone explain the hidden curriculum; how to ask for help, how to advocate for yourself, recover from setbacks, and understanding your potential, can completely change a student’s trajectory. I’ve seen firsthand how the right mentor can make intimidating spaces feel navigable, and I care deeply about being that person for others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"87c1d7c8-0d82-4218-925b-ace740732616\"}":{"__typename":"DeepDives","uuid":"87c1d7c8-0d82-4218-925b-ace740732616","content":"\u003cp\u003eI hope to help build systems in healthcare, education, and research that are both rigorous and humane. I want my work to reduce barriers for people who are often excluded, and to leave behind institutions, programs, or tools that continue creating access and opportunity long after I’m gone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f3423f16-fa24-44a0-98d0-b5f241a2ab2c\"}":{"__typename":"DeepDives","uuid":"f3423f16-fa24-44a0-98d0-b5f241a2ab2c","content":"\u003cp\u003eMy dream job sits at the intersection of innovation and care as a physician-scientist working alongside biotech and health-tech startups to translate research into real-world impact. I’m drawn to environments where clinical insight, data, and entrepreneurship come together to build scalable solutions. Whether that’s new therapeutics, smarter care delivery models, or technology that makes healthcare more equitable. I want to help bridge the gap between the lab,  clinic, and the startup ecosystem where bold ideas actually become better care for patients.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"619ad01c-182c-43fc-9e3a-378e1d26bdcb\"}":{"__typename":"School","uuid":"619ad01c-182c-43fc-9e3a-378e1d26bdcb","name":"Middletown High School","city":"Middletown","type":"HIGH","state":"Connecticut","country":"United States","zip":"06457"},"Education:{\"uuid\":\"7b8cb6c4-c725-4a2e-bff6-1ae833b63b16\"}":{"__typename":"Education","uuid":"7b8cb6c4-c725-4a2e-bff6-1ae833b63b16","school":{"__ref":"School:{\"uuid\":\"619ad01c-182c-43fc-9e3a-378e1d26bdcb\"}"},"startYear":"2023","endYear":"2027","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"308c4757-3fcf-48d4-8d9c-aa190866814b\"}":{"__typename":"Education","uuid":"308c4757-3fcf-48d4-8d9c-aa190866814b","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027 (expected)","major":"Molecular, Cellular, and Developmental Biology (Combined BS/MS)","degree":null},"MentorPublicProfile:{\"uuid\":\"59b5d9a6-4b8f-4727-84dc-1b3ee7f14fbd\"}":{"__typename":"MentorPublicProfile","uuid":"59b5d9a6-4b8f-4727-84dc-1b3ee7f14fbd","displayName":"Gianna T.","slug":"gianna-thomas","biography":"\u003cp\u003eHi Everyone! I’m a Yalie pursuing a BS/MS in Molecular, Cellular, and Developmental Biology (MCDB).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am driven by an interest in how science, policy, and systems can be designed to improve real lives. Academically, I spend much of my time working at the intersection of biomedical research, public health, and computational biology across multiple institutions such as the American Red Cross and New York Department of Health. Outside of the classroom and lab, my time is centered on mentorship, leadership, and advocacy. I serve as President of the Yale Healthcare Consulting Collective, leading teams of students on healthcare projects for nonprofits, hospitals, and public agencies in my university’s largest consulting group and enjoy turning complex ideas into tools that work for educational research in my startup! As a Disability Peer Mentor and FGLI Thrive Mentor, I work closely with students navigating Yale for the first time, helping demystify the “hidden curriculum” and build confidence in spaces that can feel intimidating or opaque.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA project especially close to my heart is Nutmeg Health Futures, a nonprofit I founded to support first-generation students in Connecticut interested in healthcare and the sciences. What began as a small group of local tutors in my hometown has grown into a national nonprofit providing mentorship, tutoring, health literacy workshops, and college preparation resources to students across the country. Building Nutmeg Health Futures taught me how to listen to community needs, scale responsibly, and lead with empathy, lessons that continue to shape how I approach mentorship and leadership today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat I bring as a mentor is both perspective and care. As a first-generation student and recipient of national scholarships such as Coca-Cola Scholars, the Gates Scholarship, and GE Reagan Scholars, I’ve navigated rigorous academics alongside leadership, research, and service while learning how to thrive in high pressure environments. Those experiences have given me a deep understanding of the uncertainty students and families often feel when entering spaces like Yale for the first time. I’m committed to being honest, supportive, and proactive by meeting students where they are, helping them see what’s possible, and giving them the tools to succeed with clarity and confidence.\u003c/p\u003e","teachingVideoPlaybackId":"D7KexopsR66ep0129wZ1iVusmvqd24XW3qI9029jqCyWA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Molecular, Cellular, and Developmental Biology (Combined BS/MS)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"33d4c6f2-6ad6-4f24-ab5b-75ca7efce653\"}"},{"__ref":"DeepDives:{\"uuid\":\"004d5b58-8448-4a7e-af1d-6f013514a8be\"}"},{"__ref":"DeepDives:{\"uuid\":\"87c1d7c8-0d82-4218-925b-ace740732616\"}"},{"__ref":"DeepDives:{\"uuid\":\"f3423f16-fa24-44a0-98d0-b5f241a2ab2c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/59784ba7-e545-495f-80a9-b26dc0f5a0e2/-/preview/-/format/jpg/","https://ucarecdn.com/c5833243-7748-4c99-b023-b904cf1f11a2/-/preview/-/format/jpg/","https://ucarecdn.com/3088585e-95bc-4630-b5d3-81842e46df45/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"7b8cb6c4-c725-4a2e-bff6-1ae833b63b16\"}"},{"__ref":"Education:{\"uuid\":\"308c4757-3fcf-48d4-8d9c-aa190866814b\"}"}],"hiredAt":"2026-01-21T16:07:15.361Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","American Sign Language","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","Computer Science","K-6 Storybook","Creative Writing","History Project","Medicine / Health","STEM Project","Aviation / Aerospace","Public Speaking","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gianna-thomas\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"59b5d9a6-4b8f-4727-84dc-1b3ee7f14fbd\"}"}}},"_sentryTraceData":"06f5f19561f84fb8a7c99d1f15c09139-bb32d5f0a0ca2a71-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=06f5f19561f84fb8a7c99d1f15c09139,sentry-sample_rate=0.2,s
