xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"ede5546c-8c72-43ec-8a98-0438d146e369\"}":{"__typename":"Favorites","uuid":"ede5546c-8c72-43ec-8a98-0438d146e369","photoUrl":"https://ucarecdn.com/0d478738-3fac-4ec2-a769-bf47d5c5b334/","title":"Eliud Kipchoge ","type":"ATHLETE"},"Favorites:{\"uuid\":\"3f0e40d2-345a-4fea-afc1-cf63b6ec014b\"}":{"__typename":"Favorites","uuid":"3f0e40d2-345a-4fea-afc1-cf63b6ec014b","photoUrl":"https://ucarecdn.com/c7653b23-6273-4d36-a648-6df0e543ff9d/","title":"Percy Jackson","type":"BOOK"},"Favorites:{\"uuid\":\"8ff8b6f7-ecc6-41b4-8c17-2ffe00f81b3e\"}":{"__typename":"Favorites","uuid":"8ff8b6f7-ecc6-41b4-8c17-2ffe00f81b3e","photoUrl":"https://ucarecdn.com/86462dcd-1896-4460-bd09-12f50cd3a5ea/","title":"Chris Pratt","type":"ACTOR"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"b93b660a-a477-4fb3-ba41-9f712c805b5e\"}":{"__typename":"DeepDives","uuid":"b93b660a-a477-4fb3-ba41-9f712c805b5e","content":"\u003cp\u003eMy dream job is to be like Mark Rober. I aspire to obtain such strong technical experience that I can create any project, while inspiring young minds that they can do the same. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"34227b32-7199-4071-b1f5-8f6a9cecba45\"}":{"__typename":"DeepDives","uuid":"34227b32-7199-4071-b1f5-8f6a9cecba45","content":null,"videoPlaybackId":"800lAwIubHdvfVJXCWaGlJMnxltHyQeb53vdB022LNweg","question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"687ce956-983a-402c-b4cb-c37d7a1f4103\"}":{"__typename":"DeepDives","uuid":"687ce956-983a-402c-b4cb-c37d7a1f4103","content":null,"videoPlaybackId":"5AqX7jOpWjOF00IEKzTR02iNWOKDrA02xF6bw01Usw8cx00A","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"d98486b2-a746-45b1-92af-78a2121d5e5f\"}":{"__typename":"DeepDives","uuid":"d98486b2-a746-45b1-92af-78a2121d5e5f","content":"\u003cp\u003eAs a high school student, I would say I was very intentional and planned about everything I did. If I joined a club/organization, I would be very intentional about what skills I wanted to learn, my personal timeline for growth and learning, and the type of people I wanted to interact with. Similarly for projects, I oftentimes worked \"backwards\" from my goal, and that benefitted me a lot. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"School:{\"uuid\":\"bb90dde2-f44b-4997-83cf-bfa11d252f3c\"}":{"__typename":"School","uuid":"bb90dde2-f44b-4997-83cf-bfa11d252f3c","name":"Northville High School","city":"Northville","type":"HIGH","state":"Michigan","country":"United States","zip":"48168"},"Education:{\"uuid\":\"1bc4bb7c-7ac5-402e-89f6-01b9ef68f1fb\"}":{"__typename":"Education","uuid":"1bc4bb7c-7ac5-402e-89f6-01b9ef68f1fb","school":{"__ref":"School:{\"uuid\":\"bb90dde2-f44b-4997-83cf-bfa11d252f3c\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"2934de94-3024-4027-80a3-2cbb9fd00ee0\"}":{"__typename":"Education","uuid":"2934de94-3024-4027-80a3-2cbb9fd00ee0","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"0152ba8c-61d0-4fb3-8a07-0be9994cf1b0\"}":{"__typename":"MentorPublicProfile","uuid":"0152ba8c-61d0-4fb3-8a07-0be9994cf1b0","displayName":"Ritvik E.","slug":"ritvik-ellendula","biography":"\u003cp\u003eHi! I’m Ritvik Ellendula (pronounced like “Ritz” crackers and “Vik”-tory but throw away the Z and add an H! ), and I’m currently a freshman at the University of Pennsylvania studying Electrical Engineering, with potential minors in Engineering Entrepreneurship, Data Science, and Math.\u003c/p\u003e\u003cp\u003eIn high school, I gained a lot of pivotal experiences to give me “credibility”. I served as President of Connect Me Tutoring, the largest student-run tutoring nonprofit in the United States, where I led large-scale tutoring initiatives and worked closely with students across a wide range of subjects. I’ve also conducted AI-related research in collaboration with professors affiliated with Harvard and MIT, with opportunities to present my work at conferences and in publications. Alongside this, I was selected for Michigan’s premier student leadership organization, where I helped lead statewide initiatives focused on leadership development and advocacy, and I’ve competed in Model United Nations and DECA, earning top national/international awards in public speaking and problem-solving.\u003c/p\u003e\u003cp\u003eWhile those experiences have been incredibly meaningful, what matters most to me is how they’ve shaped the way I work with students.\u003c/p\u003e\u003cp\u003eThrough leading a tutoring organization, I learned that the best mentorship isn’t just about knowing the material; rather, it’s about knowing how to cater teaching towards a student’s unique situation, interests, and preferences. For instance, if I have a student who really loves Pokemon, we would explain problems using that context to make content more interesting. My main priority in tutoring and mentorship is always to ensure that the student remains passionate about what they’re doing because passion paves the way for them to achieve strong tangible impact in whatever they decide to pursue. Further, I strongly believe that proper communication and open communication is essential in any mentee-mentor relationship: communication where the mentee does not feel judged or worried to ask questions or explore their interests more.\u0026nbsp;\u003c/p\u003e\u003cp\u003eOutside of academics, I love building projects that turn ideas into something tangible, and I would love to help your child do the exact same. Whether it’s creating machine learning medical devices or a hardware-based CAD-designed lightsaber, I love creating, and I would love to inspire your child’s spark for invention and innovation. I also competed in NASA’s Student Launch Initiative, where my team designed and built a fully functional rocket and payload system, along with extensive technical documentation, so if your child dreams of working at NASA, I might be able to provide some valuable insight!\u003c/p\u003e\u003cp\u003eIn my mentorship, I focus on a student-based approach, where we pursue your student’s interests to the nth degree, and together we create something they could only have dreamed of. Whether it’s their own personal lightsaber, or building an app for classifying different foods, I would love assisting with “builds”. Or alternatively, if they want to start a nonprofit, I would love providing my insight into how successful organizations run well and what they do to succeed.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBriefly, I feel comfortable guiding students in their projects ranging from business \u0026amp; nonprofit creation, science and pre-med/BSMD applications, and especially engineers working on passion projects and building their skills within hardware and deep learning. My end goal is to ensure that your student enjoys their learning experience, while being equipped with unparalleled confidence to tackle any problem that they might encounter, turning their dreams into reality.\u003c/p\u003e","teachingVideoPlaybackId":"6NqdaWmmTGhv68eZ72PIL1KIQSkWSjbxabqC2BVH02lY","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"ede5546c-8c72-43ec-8a98-0438d146e369\"}"},{"__ref":"Favorites:{\"uuid\":\"3f0e40d2-345a-4fea-afc1-cf63b6ec014b\"}"},{"__ref":"Favorites:{\"uuid\":\"8ff8b6f7-ecc6-41b4-8c17-2ffe00f81b3e\"}"}],"causesSupported":[],"major":"Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b93b660a-a477-4fb3-ba41-9f712c805b5e\"}"},{"__ref":"DeepDives:{\"uuid\":\"34227b32-7199-4071-b1f5-8f6a9cecba45\"}"},{"__ref":"DeepDives:{\"uuid\":\"687ce956-983a-402c-b4cb-c37d7a1f4103\"}"},{"__ref":"DeepDives:{\"uuid\":\"d98486b2-a746-45b1-92af-78a2121d5e5f\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/09d3bdb5-ad89-44d3-be1d-636124f7bebf/-/preview/-/format/jpg/","https://ucarecdn.com/bdbc93a4-cde0-4f33-b919-fb41fff98ea0/-/preview/-/format/jpg/","https://ucarecdn.com/02302c16-015c-4301-a990-999eacd524f0/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"1bc4bb7c-7ac5-402e-89f6-01b9ef68f1fb\"}"},{"__ref":"Education:{\"uuid\":\"2934de94-3024-4027-80a3-2cbb9fd00ee0\"}"}],"hiredAt":"2026-03-17T15:28:09.316Z","topics":["Creative Writin
