xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"573cc7d5-fa55-4b58-aabf-5a382419cdab\"}":{"__typename":"Favorites","uuid":"573cc7d5-fa55-4b58-aabf-5a382419cdab","photoUrl":"https://ucarecdn.com/1771f5fa-2ad4-46b5-9e3f-829b9f419364/","title":"John Mayer","type":"ARTIST"},"Favorites:{\"uuid\":\"f01026a9-11bf-48c0-b40b-d84897c14dfc\"}":{"__typename":"Favorites","uuid":"f01026a9-11bf-48c0-b40b-d84897c14dfc","photoUrl":"https://ucarecdn.com/924fc25f-6df6-4e1f-a99a-6d133a0584c1/","title":"Naomi Osaka","type":"ATHLETE"},"Favorites:{\"uuid\":\"d444643d-1734-48a8-88f0-d63a3d8e6b94\"}":{"__typename":"Favorites","uuid":"d444643d-1734-48a8-88f0-d63a3d8e6b94","photoUrl":"https://ucarecdn.com/b570f18f-3381-4646-a2ab-b2d2559f0896/","title":"salt - dorianne laux","type":"BOOK"},"CausesSupported:{\"uuid\":\"bfa681a5-e33d-4c4c-83a6-6fed151145ef\"}":{"__typename":"CausesSupported","uuid":"bfa681a5-e33d-4c4c-83a6-6fed151145ef","name":"Wellbody Alliance","description":"\u003cp\u003eI have raised money for this group since I was in middle school. Women's health!\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"8445f83e-3048-41a4-8b34-e4187075c1fc\"}":{"__typename":"DeepDives","uuid":"8445f83e-3048-41a4-8b34-e4187075c1fc","content":"\u003cp\u003eSigning to a record label after starting out as a completely self-taught musician still feels surreal. I taught myself how to write, produce, and shape a full album from scratch—late nights, messy demos, YouTube tutorials, and all. Covid hobby turned dream job \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"bbf34289-6550-477a-9c7e-1501a3116c6b\"}":{"__typename":"DeepDives","uuid":"bbf34289-6550-477a-9c7e-1501a3116c6b","content":"\u003cp\u003eMentorship matters to me because I know what it feels like to move through elite spaces without seeing yourself reflected back. As a Black and queer student in rigorous prep schools and later at Yale, I often found myself searching for teachers, coaches, or artists who looked like me—who could show me, simply by existing, that I belonged there too. Representation is not about optics; it is about possibility. It quietly answers the question, “Is there room for me here?”\u003c/p\u003e\u003cp\u003eNow, whether I’m teaching tennis, mentoring in music, or working with students academically, I’m deeply aware that my presence carries meaning. For the students who share my identity, I hope I model confidence and expansiveness. For those who don’t, I hope I expand their understanding of leadership, excellence, and creativity.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"95d1fb93-e620-4650-8b0d-01f50d0bb46a\"}":{"__typename":"DeepDives","uuid":"95d1fb93-e620-4650-8b0d-01f50d0bb46a","content":"\u003cp\u003eGo on tour in West Africa \u0026lt;3\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"b6d3fb3f-4c42-4888-91cd-a421377a9d8c\"}":{"__typename":"DeepDives","uuid":"b6d3fb3f-4c42-4888-91cd-a421377a9d8c","content":"\u003cp\u003eMy greatest role model is my older brother. He has lived with chronic illness for much of his life, and watching him navigate the world with humor, intellect, and grace has fundamentally shaped who I am. He has faced limitations that would make many people retreat, yet he continues to approach life with curiosity and gratitude. Through hospital rooms, setbacks, and uncertainty, he has somehow remained the most expansive thinker I know.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eHe taught me that resilience is not loud—it is steady.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"62d32046-56e4-4140-af7e-7d27a2016095\"}":{"__typename":"School","uuid":"62d32046-56e4-4140-af7e-7d27a2016095","name":"The Lawrenceville School","city":"Lawrence Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08648"},"Education:{\"uuid\":\"caa0d76f-359d-4a8b-a0a2-e2bb800081b5\"}":{"__typename":"Education","uuid":"caa0d76f-359d-4a8b-a0a2-e2bb800081b5","school":{"__ref":"School:{\"uuid\":\"62d32046-56e4-4140-af7e-7d27a2016095\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"dd511785-ccbe-4e56-ab69-fc68a59109b9\"}":{"__typename":"Education","uuid":"dd511785-ccbe-4e56-ab69-fc68a59109b9","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Latin American Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"5e784fa3-ab3b-474a-b007-4cace0bce597\"}":{"__typename":"MentorPublicProfile","uuid":"5e784fa3-ab3b-474a-b007-4cace0bce597","displayName":"Khat M.","slug":"khat-miatta","biography":"\u003cp\u003eHello! My name is Khat, and I am a 2024 graduate of Yale University, where I earned honors in History. My academic work focused on Latin American politics and literature, with a particular specialization in Brazil. I am fluent in English, Spanish, and Portuguese, and I have studied abroad in both Brazil and Spain, deepening my linguistic fluency and cultural literacy. Raised by a father who is a linguist, I grew up between Central and West Africa—being Sierra Leonean myself—where I was exposed to multiple languages and quasi extinct scripts from an early age. That upbringing shaped my love of language, precision, and cross-cultural scholarship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt Yale, I worked as a recording studio aide, teaching fellow students how to operate professional studio equipment and navigate Digital Audio Workstations such as Pro Tools and Logic Pro X. Alongside my academic coursework, I was a member of the Whiffenpoofs, the world’s oldest collegiate a cappella group, where I refined my musicianship, leadership, and collaborative discipline. I am currently a signed recording artist with over \u003cstrong\u003e400,000 listeners\u003c/strong\u003e across platforms and record under the San Francisco–based label Bright Antenna. I signed my first deal while working as a product manager at another record label, gaining valuable insight into both the creative and business sides of the music industry.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis past year, I toured nationally with folk artists including \u003cem\u003eMon Rovîa, Oliver Hazard, \u003c/em\u003eand\u003cem\u003e Michigande\u003c/em\u003er, and I will be performing at the Bottleneck Festival in Napa Valley alongside artists such as \u003cem\u003eChaka Khan, Lorde, \u003c/em\u003eand the \u003cem\u003eBackstreet Boys.\u003c/em\u003e My work as a musician is grounded not only in performance but in rigorous study, careful listening, and disciplined practice.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition to music and academics, I grew up playing competitive tennis, served as captain of Yale Club Tennis, and played first singles for all four years. I have taught tennis since age seventeen under the mentorship of the Princeton men’s tennis coach, developing patience and clarity as an instructor.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am deeply committed to mentorship. Whether in the studio, on the court, or in the classroom, I prioritize intellectual curiosity, thoughtful communication, and confidence-building. I would be honored to support students in achieving both academic excellence and creative growth.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBeyond all of this, I LOVE tandem bike riding, hiking, and meeting new people. After work you can find me reading in the park, at open mic nights (music and comedy), cooking with friends, or studying for my pilots license (I am 1/6 of the way done with my requirements!). I would love to be a mentor to you \u0026lt;3\u003c/p\u003e","teachingVideoPlaybackId":"dPgkacqD02mFkrIgcKezv02vq9zRXW16fHWWZ6CBgI202I","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003esigning a record deal with \"bright antenna records\" right out of college (1 year ago)\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"573cc7d5-fa55-4b58-aabf-5a382419cdab\"}"},{"__ref":"Favorites:{\"uuid\":\"f01026a9-11bf-48c0-b40b-d84897c14dfc\"}"},{"__ref":"Favorites:{\"uuid\":\"d444643d-1734-48a8-88f0-d63a3d8e6b94\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"bfa681a5-e33d-4c4c-83a6-6fed151145ef\"}"}],"major":"Latin American Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8445f83e-3048-41a4-8b34-e4187075c1fc\"}"},{"__ref":"DeepDives:{\"uu
