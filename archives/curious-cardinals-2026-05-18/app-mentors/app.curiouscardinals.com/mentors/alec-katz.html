xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"74576a79-050b-4943-b18c-4d3fe9aae8e1\"}":{"__typename":"Favorites","uuid":"74576a79-050b-4943-b18c-4d3fe9aae8e1","photoUrl":"https://ucarecdn.com/c311fe82-70cc-4253-8c9c-6c40115b9509/","title":"Banker to the Poor","type":"BOOK"},"Favorites:{\"uuid\":\"1c4c38ed-1d54-4e8c-b514-b9f9f6087560\"}":{"__typename":"Favorites","uuid":"1c4c38ed-1d54-4e8c-b514-b9f9f6087560","photoUrl":"https://ucarecdn.com/0fcfb5e8-8ab7-40a8-8058-5feb6563dec5/","title":"Punta Del Este, Uruguay","type":"CITY"},"Favorites:{\"uuid\":\"72b39ba2-d28c-44c4-b57c-03960dbaca1f\"}":{"__typename":"Favorites","uuid":"72b39ba2-d28c-44c4-b57c-03960dbaca1f","photoUrl":"https://ucarecdn.com/aeb9ee48-507c-48a9-8a45-25d5cb40b63a/","title":"Liverpool","type":"SPORTS_TEAM"},"CausesSupported:{\"uuid\":\"5f4ae0fd-f8e7-4f18-87bb-b2c4d2f2f610\"}":{"__typename":"CausesSupported","uuid":"5f4ae0fd-f8e7-4f18-87bb-b2c4d2f2f610","name":"Soles4Good","description":"\u003cp\u003ehttps://www.soles4good.org/\u003c/p\u003e","photoUrl":"https://ucarecdn.com/2c229636-7449-45cb-b8cb-e615bb8c783b/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ecedc630-a6d7-4ca3-ae2c-d6488da10918\"}":{"__typename":"DeepDives","uuid":"ecedc630-a6d7-4ca3-ae2c-d6488da10918","content":"\u003cp\u003eOn Saturdays, sometimes as early as 4:30 am, I might impulsively jump out of bed and start dancing a jig. This is not some bizarre Uruguayan ritual or a Jewish tradition. It’s because Liverpool sometimes has early games, and I cannot hold back my emotions when they score a GOALL!!!! Watching (and playing) soccer is my favorite way to unleash my competitive spirit and have fun.\u003c/p\u003e\u003cp\u003eWhen I am not reading or watching soccer, you can find me renting a Cessna 172 out of Palo Alto airport (come for a ride!!) or watching videos about the newest urban air mobility technologies. I also love going on long hikes and walks (huge audible fan). If you ever want to join me on my post work runs, I am always looking for companions!!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"10d7ceac-b027-40f3-9087-d10b04d2539d\"}":{"__typename":"DeepDives","uuid":"10d7ceac-b027-40f3-9087-d10b04d2539d","content":"\u003cp\u003eMy passion for transforming education and overcoming seemingly insurmountable challenges drives me to work hard in pursuit of our mission. But my team's support, expertise and feedback are essential to our success - and my own growth.\u003c/p\u003e\u003cp\u003eI am super intense and give my everything to work. I am laser focused. My strong work ethic and passion comes from my mom. She moved to the US form Uruguay to attend university at Caltech and study electrical engineering. She taught me that if you put your mind to something and work hard, you are capable of anything.\u003c/p\u003e\u003cp\u003eI am obsessed with continuous growth and lifelong learning. I enjoy learning new tools/technologies, reading about the market, and speaking to customers more than anything. I value feedback and l enjoy collaboration. Nothing feels better than a high five in the office after solving a complex problem or celebrating a small win.\u003c/p\u003e\u003cp\u003eI was an aerospace engineer once. I apply my problem-solving engineering mentality to the problems we face in the business. I love finding scrappy ways to empower our business to run more efficiently, effectively, and smoothly.\u003c/p\u003e\u003cp\u003eI care deeply about our mission and am a believer in Simon Sinek’s framework of company building: 1) advance a just cause, 2) prioritize people, 3) generate revenue to support the first two - in that order. I believe that K12 education is the greatest opportunity to solve societies greatest problems and I am committed to pouring my heart into enacting change in the space. It has become my life’s mission to embed mentorship in the social infrastructure of the world, using technology to foster meaningful relationships and human connections that transform how students learn. I recognize that my execution isn’t perfect but my desire is boundless. I am putting my heart and soul into being the best possible colleague, collaborator, and leader.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f91a7e6a-bd51-4c27-9c42-0f07ca255411\"}":{"__typename":"DeepDives","uuid":"f91a7e6a-bd51-4c27-9c42-0f07ca255411","content":"\u003cp\u003eAll students have interests, whether it’s sports or video games. Validate their interests and feed their curiosity. Interested in video games? Design and code a game. Interested in sports? Learn sports analytics. By giving students agency over what they learn, they shift from being passive learners to active thinkers, engagers, creators, and agents of the change they want to see in the world.\u003c/p\u003e\u003cp\u003eAt the beginning of the pandemic, I began working with a very disengaged 6th grader on math. He was really struggling to see the meaning of the math he was learning at school, and his mom was desperate to find something that would get him off of Tik Tok. After our second lesson, the student told his mom that he wanted to be a rocket-scientist. Bang! That was the hook. All of the math problems I created from then on were around physics and space. “Richie, if you want to be a rocket-scientist, you need to learn the basics first.” Richie went on to build a drone, learn computer science, and take an astrophysics guided exploration with various mentors. By feeding his passions, we were able to change Richie’s trajectory.\u003c/p\u003e\u003cp\u003eAlso, surround your teenager with impressive people that they look up to. No matter how impressive or successful you are as a parent, your kids will always see you as, well, their parent. That is why it is important to have a diverse set of interesting and successful friends. I learned so much as a kid in intellectual dinner discussions when my parents invited friends over for dinner. Stuart, a parent in the bay area, used to host Stanford students for Shabbat dinner every month, exposing his kids to college students who his kids admired and thought were not just smart, but also cool!\u003c/p\u003e\u003cp\u003eGive your student agency over whom they learn from. At school, kids are never able to choose their teacher. That doesn’t make sense because the relationship you foster with your teacher is everything. When I was younger, if I didn’t like my teacher, the class they taught would become my least favorite subject. Empower your student to learn from mentors they see themselves in and admire.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"f6322ea8-caf5-43c5-9d44-dd9305f32c97\"}":{"__typename":"Education","uuid":"f6322ea8-caf5-43c5-9d44-dd9305f32c97","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Aeronautical Engineering","degree":null},"School:{\"uuid\":\"893789ea-dc16-4eff-bd86-613d0f4c9d9f\"}":{"__typename":"School","uuid":"893789ea-dc16-4eff-bd86-613d0f4c9d9f","name":"Harvard-Westlake","city":"Los Angeles","type":"HIGH","state":"CA","country":"United States","zip":"90049"},"Education:{\"uuid\":\"59417ae1-e336-4acd-8f71-1385e13f18e0\"}":{"__typename":"Education","uuid":"59417ae1-e336-4acd-8f71-1385e13f18e0","school":{"__ref":"School:{\"uuid\":\"893789ea-dc16-4eff-bd86-613d0f4c9d9f\"}"},"startYear":"2013","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"32ba90ba-6f31-4ca3-a64a-40c4da88b54f\"}":{"__typename":"MentorPublicProfile","uuid":"32ba90ba-6f31-4ca3-a64a-40c4da88b54f","displayName":"Alec K.","slug":"alec-katz","biography":"\u003cp\u003eI am taking time off from Stanford to pursue Curious Cardinals, chasing my dreams to not only help middle and high school students discover and pursue their passions, but also to provide college students with a platform to provide mentorship. After teaching my first workshop on the future of aviation to high school students at the start of the pandemic, I mobilized my most ambitious peers at Stanford and beyond to share topics they were passionate about to K-12 students. Since then, Curious Cardinals has featured on CNN and in Forbes highlighting our vision to create a community of lifelong learners and doers. After a year of bootstrapping the business to $600k+ of annual revenues, Curious Cardinals has now raised $6.8 million in seed funding and employs a team of 12, including experience designers, software engineers, marketers, and educators. I was recognized in the 2022 Forbes 30 Under 30 Education and Youngest category. Prior to starting Curious Cardinals, I was pursuing a major in Aerospace Engineering with a minor in Computer Science at Stanford University. In 2019, I graduated with a GPA in the top 1% at Harvard Westlake while juggling various extracurricular activities ranging from aviation to soccer. In my junior year of high school, I won an $8,000 grant to start Soles4Good, a social microenterprise that sources and provides shoes to Senegal’s street youth. I also received my pilot license in high school and served as captain of the Harvard-Westlake school varsity soccer team. At Stanford, I won awards from Nasa for a satellite I designed and worked for Stanford’s GPS Lab and Lockheed Martin as one of the only undergraduate researchers. When I am not working or speaking to Curious Cardinals students, mentors, or parents, I love watching soccer (Liverpool), running while listening to podcasts, reading, or spending time with friends!\u003c/p\u003e","teachingVideoPlaybackId":"hS02w4I6c4VxXHYHUWq8tBIr8H5yKOkYfrWTfzzrOqRo","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI won an $8,000 grant to start Soles4Good.org in high school, where I collected thousands of donated shoes from schools and companies, shipped them to Senegal, and sold them to local youth for them to start shoe kiosks. I negotiated import tariff rates, collaborated with the U.S. Chamber of Commerce, and met with Senegalese government officials to obtain business permits. In our pilot year, I contracted my first employee to manage warehousing and distribution, trained two marginalized youth to become Soles4Good’s first entrepreneurs. Now, there are 20+ high schoolers working on Soles4Good, which has expanded into other countries! While it may sound impressive that I started a non-profit in Africa in high school, what was most rewarding to me was making a difference in the lives of marginalized youth. I feel so lucky that at Curious Cardinals I can continue to facilitate positive change in people’s lives in a different but similar manner.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"74576a79-050b-4943-b18c-4d3fe9aae8e1\"}"},{"__ref":"Favorites:{\"uuid\":\"1c4c38ed-1d54-4e8c-b514-b9f9f6087560\"}"},{"__ref":"Favorites:{\"uuid\":\"72b39ba2-d28c-44c4-b57c-03960dbaca1f\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"5f4ae0fd-f8e7-4f18-87bb-b2c4d2f2f610\"}"}],"major":"Aeronautical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ecedc630-a6d7-4ca3-ae2c-d6488da10918\"}"},{"__ref":"DeepDives:{\"uuid\":\"10d7ceac-b027-40f3-9087-d10b04d2539d\"}"},{"__ref":"DeepDives:{\"uuid\":\"f91a7e6a-bd51-4c27-9c42-0f07ca255411\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f1cd853e-8bf0-4488-85fe-213a64de1962/-/preview/-/format/jpg/","https://ucarecdn.com/11ea779e-b1c7-4fef-ac76-e14c2295ceff/-/preview/-/format/jpg/","https://ucarecdn.com/b1e12d29-6629-4da2-8089-006b86242651/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f6322ea8-caf5-43c5-9d44-dd9305f32c97\"}"},{"__ref":"Education:{\"uuid\":\"59417ae1-e336-4acd-8f71-1385e13f18e0\"}"}],"hiredAt":"2021-07-27T19:20:53.000Z","topics":["Business / Entrepreneurship","Aviation / Aerospace"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"alec-katz\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"32ba90ba-6f31-4ca3-a64a-40c4da88b54f\"}"}}},"_sentryTraceData":"4157841539514256a838a2e38fa41f47-8e6bc0a74a81ea8a-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4157841539514256a838a2e38fa41f47,sentry-sample
