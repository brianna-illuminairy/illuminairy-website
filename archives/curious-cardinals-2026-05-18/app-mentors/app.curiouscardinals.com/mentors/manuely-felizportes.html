xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"17f8ac53-a634-425c-ab76-be497db4f75d\"}":{"__typename":"Favorites","uuid":"17f8ac53-a634-425c-ab76-be497db4f75d","photoUrl":"https://ucarecdn.com/9372ef9b-625e-4fe5-b3a3-eb6058d7fbff/","title":"Interstellar","type":"MOVIE"},"Favorites:{\"uuid\":\"ca99ac7f-e259-4395-a987-f062ad27162d\"}":{"__typename":"Favorites","uuid":"ca99ac7f-e259-4395-a987-f062ad27162d","photoUrl":"https://ucarecdn.com/a18c694d-9c6f-4a1d-8fe9-2757542e60a0/","title":"Ballet","type":"SPORT"},"Favorites:{\"uuid\":\"4d864291-4357-4701-9fa2-67ba0b5954ad\"}":{"__typename":"Favorites","uuid":"4d864291-4357-4701-9fa2-67ba0b5954ad","photoUrl":"https://ucarecdn.com/a96bf986-0e52-4e16-a95a-e80fb1a1a052/","title":"Ithaca :)","type":"CITY"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"12df9ffd-1707-4f85-aeee-eb9f8a1cb766\"}":{"__typename":"DeepDives","uuid":"12df9ffd-1707-4f85-aeee-eb9f8a1cb766","content":"\u003cp\u003eI love watching movie analysis youtube videos or Markiplier. I love the outdoors and I feel like studying in the sun or just laying in the grass can really impact your day to day life. I believe in safe-spaces in the physical sense, for example I love curling up in my bed with my weighted blankets, fairy lights in the background and a good physical book. I also bake in my spare time and I love connecting with someone in a deeper level and getting to know them more!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"903f30c3-ad0d-46d3-86df-b69c9c7839be\"}":{"__typename":"DeepDives","uuid":"903f30c3-ad0d-46d3-86df-b69c9c7839be","content":"\u003cp\u003eI love physics! I love how the world works and how differently you view the world once you understand physics(not to mention how cool you feel solving a complex problem).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"706c0fdd-d752-4472-8f80-468bb1045b48\"}":{"__typename":"DeepDives","uuid":"706c0fdd-d752-4472-8f80-468bb1045b48","content":"\u003cp\u003eDo what interests you! High school and middle school is the place where you can really get to know what you like and don't like. I joined the clubs I found interest in and that's how I found out I liked robotics! :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"c7b5cd35-c9c6-43b9-81f8-1d8d12592e19\"}":{"__typename":"DeepDives","uuid":"c7b5cd35-c9c6-43b9-81f8-1d8d12592e19","content":"\u003cp\u003eI am puertorican, so my first language is Spanish. So learning another subject in a different language makes me slow to understand. This is why whenever I teach I emphasize the importance of truly understanding the sentence, not just the numbers. So if you ever need me to explain something slower, in a different style or anything I will. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"11a898f0-2a4e-4ef8-aa7d-2f38e0a86dab\"}":{"__typename":"School","uuid":"11a898f0-2a4e-4ef8-aa7d-2f38e0a86dab","name":"CIMATEC","city":"Caguas","type":"HIGH","state":"Caguas","country":"Puerto Rico","zip":"00725"},"Education:{\"uuid\":\"01ff5bc5-c240-4b2d-82ac-6a7d3b6ec10c\"}":{"__typename":"Education","uuid":"01ff5bc5-c240-4b2d-82ac-6a7d3b6ec10c","school":{"__ref":"School:{\"uuid\":\"11a898f0-2a4e-4ef8-aa7d-2f38e0a86dab\"}"},"startYear":"2017","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"ff60766c-9c90-49af-bce6-3868ca9fc4ef\"}":{"__typename":"Education","uuid":"ff60766c-9c90-49af-bce6-3868ca9fc4ef","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"53848f18-d983-4ee3-a05d-bbd19f71f15f\"}":{"__typename":"MentorPublicProfile","uuid":"53848f18-d983-4ee3-a05d-bbd19f71f15f","displayName":"Manuely F.","slug":"manuely-felizportes","biography":"\u003cp\u003eHi there! I’m a Cornell engineer studying Mechanical Engineering, with plans to master in robotics. I’m a passionate STEM educator who believes learning should be as exciting as your favorite movie and just as unforgettable. In my sessions, you won’t just be memorizing formulas or solving problems. You’ll be learning about yourself, how your brain works, how you approach challenges, and how to grow into a confident, curious thinker. Every lesson is tailored to your unique learning style, and I love keeping things interactive, creative, and real-world inspired.\u003c/p\u003e\u003cp\u003eI grew up in Puerto Rico, so Spanish is my first language. That experience shaped the way I think, learn, and teach. I know how meaningful it is to have someone who believes in your potential, especially when learning in a second language. That’s why I create a safe, welcoming space where you can truly thrive.\u003c/p\u003e\u003cp\u003eIn high school, I did VEX Robotics and competed all the way to the World Championship. I also participated in competitive individualized theater and won awards most of the years I competed. Through a program called Hello Girl, I mentored young girls from elementary school and taught them how to code. That’s when I realized I love helping people not only understand STEM, but truly believe they can tackle the hardest subjects.\u003c/p\u003e\u003cp\u003eIf you’re ever unsure, I’ll walk through the basics with you, no matter how simple, and make sure you’re confident moving forward. I’m most excited to teach physics, geometry, and algebra, because as an engineer, I use them every day and see them everywhere.\u003c/p\u003e\u003cp\u003eOutside of academics, I love hiking, movies (La La Land and Interstellar), and themed study sessions. Diary of a Wimpy Kid is my comfort read, and Wall-E made me fall in love with robotics.\u003c/p\u003e\u003cp\u003eMost of all, I care about you.\u003c/p\u003e","teachingVideoPlaybackId":"Mag00p2wGx8XuCwY9XX4AFgTzo4Ye2si5o1uvpfLcj8k","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"17f8ac53-a634-425c-ab76-be497db4f75d\"}"},{"__ref":"Favorites:{\"uuid\":\"ca99ac7f-e259-4395-a987-f062ad27162d\"}"},{"__ref":"Favorites:{\"uuid\":\"4d864291-4357-4701-9fa2-67ba0b5954ad\"}"}],"causesSupported":[],"major":"Mechanical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"12df9ffd-1707-4f85-aeee-eb9f8a1cb766\"}"},{"__ref":"DeepDives:{\"uuid\":\"903f30c3-ad0d-46d3-86df-b69c9c7839be\"}"},{"__ref":"DeepDives
