xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"250a24fe-c5cc-41b5-b196-284c6986a25a\"}":{"__typename":"DeepDives","uuid":"250a24fe-c5cc-41b5-b196-284c6986a25a","content":"\u003cp\u003eIn my spare time, I love to run, especially with other people! I ran cross country and track in high school, but found a new love for running during college. I have loved exploring run clubs in different areas and getting to meet so many amazing and inspiring individuals. I ran my first half marathon last December and am looking forward to my next race :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"f9f9bc2c-7f18-494b-87cc-959c2e64fd10\"}":{"__typename":"DeepDives","uuid":"f9f9bc2c-7f18-494b-87cc-959c2e64fd10","content":"\u003cp\u003eI would have to say that my most significant accomplishment has been getting to where I am today. More specifically, receiving a full tuition academic scholarship to USC.When people find this fact out about me, they always ask me what I did to receive it or why I have it. I humbly answer that I don’t really know why they chose me, and that I’ve just never questioned it. But in reality, looking back on my high school years, I think I know why my application may have stood out. In high school, I was always on the go. I was involved in cross country and track, on the board of human relations for my student government, the secretary on the junior board of a program called Young Hearts for Life, served as an executive member of the Diversity Leadership Council at my school while also being an active participant in retreats and service trips. I remember in my interview for the USC scholarship, Paul, the dean of Viterbi admissions, asked me how I managed all of my extra curricular activities with my heavy course load in school. I vividly remember the feeling I got when he asked me that question, how I had never really thought about this but just always loved being busy and loved dedicating myself to different things. With that being said, I realized that I did always put school first. When it came down to it, I was never going to turn in an assignment late or miss an important deadline because of one of my other commitments. When I look back on high school and what it has taught me, the lessons I learned in class aren’t what have really continued to impact me into college. Although, I am forever grateful for taking AP Physics and getting out of taking Physics here at USC. What I took away from high school, just like what I think USC saw in me, is the importance of really getting involved. When I do something, I like to really dedicate myself to it and make a meaningful contribution and impact. In college, I have tried to embrace this same mentality and have recognized similar “business”, similar involvement, and similar dedication to school in addition to these things.\u0026nbsp;\u003c/p\u003e\u003cp\u003eI am currently a sophomore studying Industrial and Systems engineering with a minor in Business Finance at the University of Southern California. Outside of class, I am involved in IISE or the Institute of Industrial and Systems Engineers and SWE or Society of Women Engineers. I have been an active member of these organizations over the past year and a half but am currently working on gaining leadership positions in one or both of these clubs. Something that takes a big portion of my time is the Viterbi Impact Program, in which essentially I and another Viterbi student travel to an underprivileged elementary school in the LA area once a week and facilitate a STEM lesson. I have served as a volunteer for this program the past 3 semesters and am becoming an instructor this semester. In addition to that, I keep myself occupied with my campus job out of the Admission center building where I direct people around campus and ensure efficient setup of rooms for various events and club meetings. And this semester, I am starting a new position as an Ambassador for an uprising platform called EpicHire which can be simply described as a new and improved LinkedIn.\u0026nbsp;\u003c/p\u003e\u003cp\u003eAs I reflect on my journey, I realize that my most significant accomplishment has been the journey itself. The steps I took during high school, which led to receiving my scholarship, have paved the way for where I am today. Moving forward, I hope to continue to always dedicate myself in these ways, with a relentless commitment to making a positive impact.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"2f28ecb9-7c19-48c7-a042-e76441ddb188\"}":{"__typename":"DeepDives","uuid":"2f28ecb9-7c19-48c7-a042-e76441ddb188","content":"\u003cp\u003e“Look how cute that baby is!” “Did you see that family?” “That little kid is adorable!” These are all common phrases you hear coming out of my mouth. I am definitely a person who loves babies and little kids. Children are always drawn to me. Within minutes of an encounter, they are holding my hand or wiggling into my lap. Both as an older cousin and a nanny to an amazing family, I am a leader. My two twin cousins are now nine, or as they would say, nine and a half, making me 11 years older than them. Ever since they were old enough to speak, they were saying my name. I have always been one of their favorite people and role models. I could do anything and they would copy it. Just the other day I was talking to Tessa, and not even understanding what college is, she had overheard that I was going to college. All she knows is college is the place where people go and she doesn’t get to see them as often. Tessa told me that she doesn’t want me to go to college because then she will only get to see me for “like two days out of a whole year” and this really made me realize the positive impact I have on her. Outside of my family, I have spent my summers nannying for another family. The children range from a nine year old boy consumed by Pokémon cards, to a six year old girl obsessed with glitz and glam, to four year old girl twins just learning what they like. With the mother working as a night nurse and the dad working from home, my help is always needed. My leadership shined in something as simple as taking the kids to the park in order to allow the mom to take a nap after a long work shift. This leadership I possess will work in a similar way as I pursue mentorship, continuing to leave a lasting impact on people.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"67fdee4c-184e-401f-8503-e64b99fae9d1\"}":{"__typename":"DeepDives","uuid":"67fdee4c-184e-401f-8503-e64b99fae9d1","content":"\u003cp\u003eI chose Industrial and Systems Engineering (ISE) as my major. ISE allows me to apply my analytical skills and problem-solving abilities to a variety of challenges. In ISE, you can work with a multitude of diverse clients and industries which is a big interest of mine. I also really like the collaborative and team focused aspect of ISE. In so many of my classes thus far, we have had big group projects that facilitate everyone’s skills and knowledge coming together. This is truly amazing and allows us to get so much more accomplished than one person would on their own.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"d8ab4ee3-a28c-4fc6-910f-3d4e04f10a60\"}":{"__typename":"School","uuid":"d8ab4ee3-a28c-4fc6-910f-3d4e04f10a60","name":"Benet Academy High School","city":"Lisle","type":"HIGH","state":"Illinois","country":"United States","zip":"60532"},"Education:{\"uuid\":\"efa843a6-17b5-4b0c-af8f-243c104a1f78\"}":{"__typename":"Education","uuid":"efa843a6-17b5-4b0c-af8f-243c104a1f78","school":{"__ref":"School:{\"uuid\":\"d8ab4ee3-a28c-4fc6-910f-3d4e04f10a60\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"75212ed5-ef60-4e9e-9e78-b806064a9070\"}":{"__typename":"Education","uuid":"75212ed5-ef60-4e9e-9e78-b806064a9070","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Industrial and Systems Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"a37ff27b-56e7-495d-9c2d-85a70e9d6482\"}":{"__typename":"MentorPublicProfile","uuid":"a37ff27b-56e7-495d-9c2d-85a70e9d6482","displayName":"Holly A.","slug":"holly-anderson-1","biography":"\u003cp\u003eMy name is Holly Anderson and I am currently a junior studying Industrial and Systems engineering with a minor in Business Finance at the University of Southern California. Outside of class, I am the Director of Consulting for IISE or the Institute of Industrial and Systems Engineers and a national member of SWE or Society of Women Engineers. Something that takes a big portion of my time is the Viterbi Impact Program, in which essentially I and another Viterbi student travel to an underprivileged elementary school in the LA area once a week and facilitate a STEM lesson. I have served as a volunteer for this program the past 3 semesters and then transitioned to being an instructor last semester. In addition to that, I keep myself occupied with my campus job out of the Admission center building where I direct people around campus and ensure efficient setup of rooms for various events and club meetings. And last semester, I started and am continuing a new position as an Ambassador for an uprising platform called EpicHire which can be simply described as a new and improved LinkedIn. Besides all of that, I am super passionate about mentorship!\u003c/p\u003e","teachingVideoPlaybackId":"MteoGSzTGcyV7v00RsblCvsEWkgk6dYQB02W017EdbSq64","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Industrial and Systems Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"250a24fe-c5cc-41b5-b196-284c6986a25a\"}"},{"__ref":"DeepDives:{\"uuid\":\"f9f9bc2c-7f18-494b-87cc-959c2e64fd10\"}"},{"__ref":"DeepDives:{\"uuid\":\"2f28ecb9-7c19-48c7-a042-e76441ddb188\"}"},{"__ref":"DeepDives:{\"uuid\":\"67fdee4c-184e-401f-8503-e64b99fae9d1\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/fc5e150c-8bb7-483b-8be2-73cfcd4aca7e/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"efa843a6-17b5-4b0c-af8f-243c104a1f78\"}"},{"__ref":"Education:{\"uuid\":\"75212ed5-ef60-4e9e-9e78-b806064a9070\"}"}],"hiredAt":"2024-09-10T09:46:02.660Z","
