uid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"27097b6a-1dbd-46c3-99dd-c64a8cad1883\"}":{"__typename":"MentorPublicProfile","uuid":"27097b6a-1dbd-46c3-99dd-c64a8cad1883","displayName":"Nirmayi K.","slug":"nirmayi-kelkar","biography":"\u003cp\u003eI'm Nirmayi Kelkar, currently pursuing a master's in computer science at Columbia University. I've worked as a research assistant and adjunct professor at Barnard College. I was responsible for developing a new course and teaching computer science fundamentals to high school and middle school students so that they could get admissions into Ivy League colleges.\u003c/p\u003e\u003cp\u003eAs part of my research role at Barnard College, I am using AI to detect cancer. I find this project very meaningful, as this positively impacts millions of lives.\u003c/p\u003e\u003cp\u003eI won 2 technology hackathons organized by Microsoft. I was a leader in both of these hackathons. I got the opportunity to mentor my team members, especially when there were roadblocks, and we dealt with problems we faced head-on. This was an immersive experience where I learnt the importance of mentoring, leadership and team-work. \u003c/p\u003e\u003cp\u003e\u003cbr\u003eI've taught elementary school students at a nonprofit organization in Talsari, Gujarat, fundamentals in mathematics. The joy on the faces of students when they learn a new concept for the first time brings me a lot of happiness.\u003c/p\u003e\u003cp\u003eI have also had professional experience in the industry, where I worked at the Bank of New York and Siemens. I learned the importance of professional communication and corporate culture. Bringing that experience while teaching students at Curious Cardinals is something that I look forward to doing immensely. Moreover, I feel that having a personal bond with a student is very important in the long term. This helps nurture the relationship between student and mentor. I strive to design computer science learning programs, aiming to make computing more approachable for younger learners and underrepresented communities. As part of my extracurricular activities, I love vlogging; I've been creating video diaries since I was 10 years old! I love playing badminton and having sleepovers with my friends. I also love debating and taking part in quiz competitions. \u003c/p\u003e\u003cp\u003eI've been added to the Dean's list for a perfect 4/4 GPA here at Columbia. I will guide you on how to improve academically. I will help you think outside the box and be very creative with concepts. Looking forward to exciting experiences with my students at Curious Cardinals.\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"v84QgJBJXMdQvNtoCbfEmwej00BqJ1lQywY008A7nd02TM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI've won 2 Microsoft Hackathons. The first one was to detect credit card fraud, the second one was to approve a loan.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"e760fc01-6551-440c-98fa-99fc29f07c8a\"}"},{"__ref":"Favorites:{\"uuid\":\"74384db3-c22d-4c3b-9a9e-3fd3a8840c31\"}"},{"__ref":"Favorites:{\"uuid\":\"ef0149f0-5ad1-46ac-a1cc-37d4a5450b6d\"}"}],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"b767b2b5-6b42-48c2-829e-a780ca8b322b\"}"},{"__ref":"DeepDives:{\"uuid\":\"75fdc4fd-00d4-4e5e-86fe-126b28448f22\"}"},{"__ref":"DeepDives:{\"uuid\":\"355de115-e3fa-4868-afb0-ae38f3374060\"}"},{"__ref":"DeepDives:{\"uuid\":\"3eea9b6f-e23a-4e11-931f-ff6427ef5f41\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4309271d-b866-4361-9e68-65e3dbb5740f/-/preview/-/format/jpg/","https://ucarecdn.com/4c1583f2-14bb-409f-8477-1946ca9839c6/-/preview/-/format/jpg/","https://ucarecdn.com/b40fa36a-bf1a-487c-9b35-e79cc46e9934/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__
