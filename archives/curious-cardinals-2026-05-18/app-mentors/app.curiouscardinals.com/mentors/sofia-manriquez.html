xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f6a9644e-57a0-429d-8f47-ec80805ee84d\"}":{"__typename":"Favorites","uuid":"f6a9644e-57a0-429d-8f47-ec80805ee84d","photoUrl":"https://ucarecdn.com/59a779df-ddf6-4a3b-a443-dfab27e86046/","title":"Julia Roberts","type":"ACTOR"},"Favorites:{\"uuid\":\"5495e5e0-9b7e-4b6c-b3b4-2d01d29f241f\"}":{"__typename":"Favorites","uuid":"5495e5e0-9b7e-4b6c-b3b4-2d01d29f241f","photoUrl":"https://ucarecdn.com/5ca46b33-ec33-4cb4-a59a-04004a7358c7/","title":"ABBA Gold","type":"ALBUM"},"Favorites:{\"uuid\":\"551950b2-cdbb-4dbf-b399-eb8587ecf122\"}":{"__typename":"Favorites","uuid":"551950b2-cdbb-4dbf-b399-eb8587ecf122","photoUrl":"https://ucarecdn.com/96d02bb6-ee59-4a48-a2a0-3c880fc0fc00/","title":"West Side Story ","type":"PLAY"},"CausesSupported:{\"uuid\":\"012654b8-9b90-4a29-beb0-2a045fdd6391\"}":{"__typename":"CausesSupported","uuid":"012654b8-9b90-4a29-beb0-2a045fdd6391","name":"The Diaper Bank ","description":"\u003cp\u003eI've volunteered my time and contributed to fundraisers for the CT diaper bank! \u003c/p\u003e","photoUrl":"https://ucarecdn.com/6d8265a4-fc85-42a6-aa56-d1dcf8902a36/"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"9ca4d312-d937-4a2b-bcd2-1749d01391c6\"}":{"__typename":"DeepDives","uuid":"9ca4d312-d937-4a2b-bcd2-1749d01391c6","content":"\u003cp\u003eFundamentally, I learn the best from others. Whether it's my parents, older sister, teachers, or friends, I am forever grateful for all of the mentorship I've received. When I was in elementary school, my dad homeschooled me for a few years and instilled in me the confidence and support to try new things, fostering a curious drive in me. My mother has always inspired my STEM academic interests, as a woman who studied engineering in college and supported me when I co-founded my high school's first girls in STEM club. As a sophomore at Yale, I joined the Yale Undergraduate Consulting Group (YUCG), during which I was first exposed to a career in consulting. The upperclassmen in YUCG were pivotal in showing me the ropes and allowing me to excel on real client projects. Due to this mentorship, I was able to apply and receive an internship offer at a consulting firm (Deloitte), where I will be working full time upon graduation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have had multiple opportunities for mentorship, from advising high school students on college applications to helping younger students navigate the rigorous workload at Yale and pursue their interests. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMentorship means learning from and with your community. Embracing new knowledge and skills with curiosity, patience, and gratitude. I acknowledge mentorship has been critical to where I am now and I am eager for any chance to pay this gift forward!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a4ce4802-8a3d-4ab7-97b1-0c05ab429ff1\"}":{"__typename":"DeepDives","uuid":"a4ce4802-8a3d-4ab7-97b1-0c05ab429ff1","content":"\u003cp\u003eEver since I learned about climate change and the effects of anthropogenic activity on the planet in middle school, I was a passionate environmentalist. Growing up in the outdoors (especially at the beach), I developed a deep appreciation for nature and all of the vital ecosystem services we rely on. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI chose to study Environmental Studies through a Bachelor of Science because I sought a scientific understanding for modern environmental challenges. My certificates in Energy and Global Health studies provided deeper focuses in the clean energy transition and how public health was affected by climate. Within my major, my concentration is Human Health and the Environment, this intersection between public health and the climate emergency has been a critical interest of mine from a policy and social justice perspective. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy major has opened doors for me in a variety of environmental fields, from Environmental Health and Safety (EHS) to corporate sustainability. In the future, I will likely apply to law school, to apply my foundational scientific knowledge to policy strategies that can improve ours and the planet's long term sustainability and well being. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"d38278ea-8fd6-4ba3-9824-3cc7a1d9819f\"}":{"__typename":"DeepDives","uuid":"d38278ea-8fd6-4ba3-9824-3cc7a1d9819f","content":"\u003cp\u003eIn high school I really enjoyed trying new things and diversifying my skill set based on the variety of challenges I faced. After retiring from ballet (after eleven years) freshman year of high school, I joined three school sports in which I had 0 experience: cross country, water polo, and track. I wasn't particularly gifted at each of these sports, but I loved being able to relieve stress with my friends while being active.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring my sophomore year of high school I co-founded my school's first Girls in STEM club with my best friends. This was mostly inspired by the want to have a community for girls to support each other in our STEM classes and have fun with experiments and learn from guest speakers. It was an opportunity to be an entrepreneur and make a positive impact alongside my closest friends. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eLifeguarding at my local beach was a big part of my high school personality. Although it was a demanding and at times stressful job, I loved serving my community at the beach and the adrenaline of going on rescues. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn high school, I was the friend you could go to whenever you wanted to try something new or tell a random story to. I was always ready to go on an adventure or hear all about somebody's weekend! While I always tried my best, I cared much more about the experience rather than the medal or the prize. For me, the journey has always been more important than the destination! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"8956a970-36b0-406a-94a5-7d7a1b3b13c4\"}":{"__typename":"DeepDives","uuid":"8956a970-36b0-406a-94a5-7d7a1b3b13c4","content":"\u003cp\u003eMy parents immigrated from Mexico and Colombia to pursue an excellent education and build a better life for themselves (and future family). They share a passionate work ethic and a love for learning. My parents always instilled in me the importance of pursuing your passions while helping others, and focusing more on doing the right thing rather than aiming for a prize or recognition. They taught me that all good things take time and consistent hard work, to have patience and determination when facing challenges. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis has impacted my teaching style by allowing me to focus on the skill set of a lesson rather than the answer. Sure, you might arrive at an argument or an answer to a math problem but can you explain and defend how you got there? If an academic subject or problem has a student of mine frustrated or stuck, I am eager to help them brainstorm creative solutions and not give up. At the end of the day, learning should be fun and exciting, challenges are a part of this and embracing them will make you a better student! Always, my goal is to help my student find the method of learning that works best for them and inspires them to continue! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"9fd34299-f610-4124-825e-0c27fa9f9823\"}":{"__typename":"School","uuid":"9fd34299-f610-4124-825e-0c27fa9f9823","name":"Otay Ranch High School","city":"Chula Vista","type":"HIGH","state":"California","country":"United States","zip":"91913"},"Education:{\"uuid\":\"4e5f2785-b2af-4d07-906b-0078500fad0e\"}":{"__typename":"Education","uuid":"4e5f2785-b2af-4d07-906b-0078500fad0e","school":{"__ref":"School:{\"uuid\":\"9fd34299-f610-4124-825e-0c27fa9f9823\"}"},"startYear":"2018","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"02fd4aae-4125-475e-9927-4f1ffed26f08\"}":{"__typename":"Education","uuid":"02fd4aae-4125-475e-9927-4f1ffed26f08","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Environmental Studies (B.S.) Certificates in Energy and Global Health Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"96b0eb03-83e9-45cb-8e1e-cf43a7d74d9d\"}":{"__typename":"MentorPublicProfile","uuid":"96b0eb03-83e9-45cb-8e1e-cf43a7d74d9d","displayName":"Sofia M.","slug":"sofia-manriquez","biography":"\u003cp\u003eI was born and raised in southern San Diego, California. I'm majoring in Environmental Studies (B.S), with a concentration in Human Health and and the Environment as well as certificates in Energy and Global Health Studies. My passion for the environment grew from growing up loving the outdoors (especially the beach!) A fun fact about me is that I was homeschooled for a few years in elementary school, which allowed me a hands-on and immersive learning experience that I still immensely value! After graduating, I am super excited to move to New York City to pursue sustainability consulting.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eBefore college, I was lucky to take part in the Hispanic Scholarship Foundation's Youth Leadership Institute. There, I received critical guidance on applying to college and how to be an entrepreneurial leader. These lessons not only gave me the confidence to apply to competitive schools but have also empowered me to navigate difficult workloads and pursue my creative goals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I have found the deep meaning in my friendships from my on-campus job, playing on the club water polo team, working with the Yale Undergraduate Consulting Group, and establishing Yale's first women-run social group.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy studies have revolved around all things environment, with a focus on the clean energy transition and human health. My senior thesis explores a chemical analysis of water and air pollution in San Diego's most southern beaches. As a career, I hope to drive the sustainability imperative forward in both public and private sectors, in order to increase accessibility and scale of effective climate solutions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFrom being homeschooled in elementary school, to managing high school through a pandemic and adapting to a rigorous college workload, I have embraced help from anywhere I could get it. From personal experience, I enjoy learning with and from others. Therefore, I am super excited to become a mentor!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eExtra fun hobbies to connect on: I danced ballet for eleven years! I ran track and cross country in water polo as well as played water polo. At home, I love to cook with my friends and family. Whenever the weather is nice I love to go outside--whether it's the beach, a hike, or just walking the dog! \u003c/p\u003e","teachingVideoPlaybackId":"l3oB3wfxvMBmSst7KmYUCe6gHTvK3a3y7PfF5anwueg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eAfter a year of running cross country and track, swimming on the water polo and swim team, I tried out to be a California State Beach Lifeguard in early March of my sophomore year of high school. After passing the swim test and interviews I qualified for State Beach Lifeguard Academy in Huntington Beach, Los Angeles. After 8 consecutive extremely physically and mentally demanding days, I graduated academy and earned my \"reds.\" \u003c/p\u003e\u003cbr\u003e\u003cp\u003eServing my San Diego community for four summers as a lifeguard at Silver Strand State Beach taught me invaluable lessons about approaching problems proactively, being a reliable team player, and performing under pressure. I grew to stand up for myself and trust my gut while navigating busy beaches during a global pandemic. Working as a California State Beach Lifeguard has undeniably shaped me to who I am today and has been a great honor!  \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f6a9644e-57a0-429d-8f47-ec80805ee84d\"}"},{"__ref":"Favorites:{\"uuid\":\"5495e5e0-9b7e-4b6c-b3b4-2d01d29f241f\"}"},{"__ref":"Favorites:{\"uuid\":\"551950b2-cdbb-4dbf-b399-eb8587ecf122\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"012654b8-9b90-4a29-beb0-2a045fdd6391\"}"}],"major":"Environmental Studies (B.S.) Certificates in Energy and Global Health Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"9ca4d312-d937-4a2b-bcd2-1749d01391c6\"}"},{"__ref":"DeepDives:{\"uuid\":\"a4ce4802-8a3d-4ab7-97b1-0c05ab429ff1\"}"},{"__ref":"DeepDives:{\"uuid\":\"d38278ea-8fd6-4ba3-9824-3cc7a1d9819f\"}"},{"__ref":"DeepDives:{\"uuid\":\"8956a970-36b0-406a-94a5-7d7a1b3b13c4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/075fa3fe-550f-4791-9632-19cf2527c609/-/preview/-/format/jpg/","https://ucarecdn.com/e9f1b6d9-ece1-46e5-b65c-a5526a863bfa/-/preview/-/format/jpg/","https://ucarecdn.com/a094e494-20b1-40f4-a8fb-641b4dcb50ec/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"4e5f2785-b2af-4d07-906b-0078500fad0e\"}"},{"__ref":"Education:{\"uuid\":\"02fd4aae-4125-475e-9927-4f1ffed26f08\"}"}],"hiredAt":"2025-01-27T18:57:59.511Z","topics":["K-6 Storybook","Creative Writing","Fashion / Cosmetics","History Project","Medicine / Health","STEM Project","Law / Government / Policy","Sustainability","Debate","Public Speaking","Journalism"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sofia-manriquez\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"96b0eb03-83e9-45cb-8e1e-cf43a7d74d9d\"}"}}},"_sentryTraceData":"070261eddeac442eafdf2fe79ac52755-bdb180285e039fe9-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=070261eddeac442eafdf2fe79ac52755,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slu
