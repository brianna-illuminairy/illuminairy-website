xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"d75771d2-09ce-4843-a00b-20ee70a550c8\"}":{"__typename":"DeepDives","uuid":"d75771d2-09ce-4843-a00b-20ee70a550c8","content":"\u003cp\u003eI was the worst dancer in our class, and knew it. So when my teacher announced that I’d been chosen as this year’s choreographer, it shocked everyone—especially me.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDuring Christmas break, I was consumed by this endeavor. I compensated by focusing on my strengths: storytelling, diligently studying as many dances as I could, and pursuing a creative vision that greatly exceeded my own dancing skills. During meals, I’d scribble stick-figure-formations on margins in my book. In car rides, I listened to Billie Eilish’s discography, jotting down lyrics and timestamps. I dreamed of mashing together several songs to create an emotional journey that could drive the dance. However, this was beyond my iPhone-GarageBand-level abilities. But after dozens of Facetime calls with a friend passionate about music-production, we were soon exporting a piece featuring twelve songs. In a hotel bathroom, with towels under the door so as to not wake my sister, my laptop became a mirror as I choreographed till 3AM.\u0026nbsp;\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the New Year, I found myself now the teacher of our class. Staring at seventeen older, more experienced dancers, I felt intimidated–despite my hard work, I’d still been turning on the wrong foot for three years. That's when collaboration became something beautiful: my classmates and teacher not only brought the ideas from my imagination to life, but their creativity elevated them to levels I could never have achieved alone. Their patience, trust, and support transformed me from an inexperienced sophomore to a creator of something special.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI used to see art-making as an individual pursuit. If you were talented enough, you could achieve anything alone. I now understand that major creative projects—or really, any successful project—aren’t one-person endeavors. The best outcomes have always come from team efforts, where everyone’s unique skills combine to push the boundaries of what’s possible.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"85a240f8-054d-48c2-ad73-2797e4640fc4\"}":{"__typename":"DeepDives","uuid":"85a240f8-054d-48c2-ad73-2797e4640fc4","content":"\u003cp\u003eMy High School's Director Of Student Life, Mr. Winston, and I have been in constant dialogue since sixth grade when he came to my school as a French teacher. While I did learn to accurately conjugate the French passe compose, I gleaned more about world issues from our class conversations than any other class I’d experienced, and since then have admired his eagerness to talk about large issues with small people. While Mr. Winston’s role could be restricted to just planning school events and assemblies, he has made himself more than available to every student on campus and done his absolute best to let them know they had a supporter in him. His door stays open, and his office has held hours of conversation with students on their personal lives, and our school's culture and how to make progress on complicated issues. He has been my partner in crime, running to the Art Studio with me the Friday morning after Uvalde, Texas's school shooting, to create an impromptu card-making station in the student center. When we questioned why our school's assemblies weren't being engaged with in the way anyone wished, we sat and reflected on the larger picture together, thoughtfully viewing how societal pressures and the way content is presented affect these matters. And, like all of our conversations, no matter how \"unsolvable\" the issue seemed, we ended with a first step of action. Mr. Winston's consistent desire to support students is inspiring to me. The somewhat cheesy quotation he writes on a piece of paper and tapes across his shirt each Friday, ignoring any eye-roll or snicker in the hopes it will resonate with just one student, confirms for me why he is deserving of the \"Jared Winston For United States President\" poster I made for him in sixth grade that sits atop his desk.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"6e62adb2-5fb1-4370-84b1-31a0c8cd02ef\"}":{"__typename":"School","uuid":"6e62adb2-5fb1-4370-84b1-31a0c8cd02ef","name":"Poly Prep Country Day School Middle/Upper Schools Dyker Heights Campus","city":"Brooklyn","type":"HIGH","state":"New York","country":"United States","zip":"11228"},"Education:{\"uuid\":\"28c39dc4-83df-446c-ae58-e3899bb70ea2\"}":{"__typename":"Education","uuid":"28c39dc4-83df-446c-ae58-e3899bb70ea2","school":{"__ref":"School:{\"uuid\":\"6e62adb2-5fb1-4370-84b1-31a0c8cd02ef\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"b0909f88-db3d-4d5e-9309-0e8ff37deff9\"}":{"__typename":"Education","uuid":"b0909f88-db3d-4d5e-9309-0e8ff37deff9","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"English \u0026 Theater ","degree":null},"MentorPublicProfile:{\"uuid\":\"2d3733a9-1a69-43ae-8416-0d2248ac98e6\"}":{"__typename":"MentorPublicProfile","uuid":"2d3733a9-1a69-43ae-8416-0d2248ac98e6","displayName":"Sadie S.","slug":"sadie-schoenberger","biography":"\u003cp\u003eColorful candies flew from my hands and collided with our actors. While assistant-directing the musical \u003cem\u003eSpelling Bee\u003c/em\u003e, my teacher and I struggled to engage the fifteen non-speaking ensemble members, who were understandably losing focus during long rehearsals. Although her instruction to reward those staying in character was amusing (and briefly effective), I knew I could do more—and our candy supply was running dangerously low. After rehearsal, I went home and wrote backstories for each actor, imagining their relationships, private desires, and the circumstances that brought them to the Bee. On opening night, watching their transformation reaffirmed something I’ve carried with me ever since: people do their best work when they feel understood.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m a filmmaker, writer, and performer who cares deeply about storytelling as both a creative craft and a tool for connection, representation, and change. The central theme amongst any story I work on is how can that piece of art help people feel seen—especially when the experiences they’re living are difficult, messy, or overlooked?\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically and creatively, I spend most of my time immersed in film, screenwriting, and performance. I’m currently a first-year student at Yale University, where I continue to develop my work across writing, comedy, and live performance, including as a member of Fifth Humor, Yale’s oldest sketch comedy group. Before Yale, I attended Poly Prep Country Day School, where I was deeply involved in the arts—serving as Assistant Director for multiple upper-school musicals, Artistic Director and Producer of student choreography showcases, and Editor-in-Chief of the school newspaper. These leadership roles taught me how to manage creative teams, mentor peers, and balance artistic vision with real-world constraints like deadlines, budgets, and collaboration.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eProfessionally, I’ve written and directed several films that have screened and received recognition at national programs and competitions. My experimental short \u003cem\u003eStream of Consciousness\u003c/em\u003e won YoungArts 2025, and at Rhode Island Film Festival and All American High School Film Festival. I’ve also written a feature screenplay \u003cem\u003eLocust Street\u003c/em\u003e which has placed in multiple international festivals. I’ve also trained in acting for film, worked in post-production at an independent creative studio, and participated in selective film intensives such as Prodigy Camp and the National High School Film Institute at Northwestern.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, I’m someone who leads with warmth, openness, and genuine care. I know firsthand how intimidating it can be to worry about “getting it right,” especially in creative spaces where vulnerability is unavoidable, and I work hard to make sure students don’t feel alone in that process. I’m patient, encouraging, and deeply invested in the people I work with—I love listening to students talk through their ideas, asking questions that help them see their work more clearly, and celebrating progress at every stage. I believe creativity thrives when people feel supported, understood, and comfortable taking risks. My goal is for students to feel challenged but also cared for, and to leave our work together feeling more confident in themselves and their creative voice.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"bEI01bye34vKzVoX5ywodaq3mVAI0273ptZBpWtisF7Rc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English \u0026 Theater ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d75771d2-09ce-4843-a00b-20ee70a550c8\"}"},{"__ref":"DeepDives:{\"uuid\":\"85a240f8-054d-48c2-ad73-2797e4640fc4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/40151008-7f1b-49b7-897e-0c49867db6a0/-/preview/-/format/jpg/","https://ucarecdn.com/df98cee2-e9bb-4aaa-8abb-41233d025d49/-/preview/-/format/jpg/","https://ucarecdn.com/30438e06-a88c-4c3b-b77d-51c25da1f153/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"28c39dc4-83df-446c-ae58-e3899bb70ea2\"}"},{"__ref":"Education:{\"uuid\":\"b0909f88-db3d-4d5e-9309-0e8ff37deff9\"}"}],"hiredAt":"2025-12-28T18:48:58.613Z","topics":["K-6 Storybook","Creative Writing","Film / Theater","Video / Photography","History Project","Music","Journalism"],"communityBadges":["https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"sadie-schoenberger\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"2d3733a9-1a69-43ae-8416-0d2248ac98e6\"}"}}},"_sentryTraceData":"fd71132bf0c54be3881aa6a303c8f2c0-b5996cb58570cb15-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=fd71132bf0c54be3881aa6a303c8f2c0,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"
