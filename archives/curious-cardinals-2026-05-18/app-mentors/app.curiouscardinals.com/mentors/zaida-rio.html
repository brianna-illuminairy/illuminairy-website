c0fd790c7d\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"1b42fc66-c0e9-40fd-8112-95d0751f78c7\"}":{"__typename":"Education","uuid":"1b42fc66-c0e9-40fd-8112-95d0751f78c7","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Environmental Studies","degree":null},"MentorPublicProfile:{\"uuid\":\"e4d65383-734e-4d80-afdf-94b775f33b90\"}":{"__typename":"MentorPublicProfile","uuid":"e4d65383-734e-4d80-afdf-94b775f33b90","displayName":"Zaida R.","slug":"zaida-rio","biography":"\u003cp\u003eIntroducing Zaida: a singer-songwriter, environmental studies major, and all-around creative originally from White Plains, New York. She grew up in the public school system there (K–12!), where she discovered early on that she’s happiest when she’s making something—whether it’s a song, a story, or a space for voices that need to be heard.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow at Yale University, she’s majoring in Environmental Studies with a certificate in Climate Science and Solutions, while also living out her dream as a performing artist. Music has always been her way of making sense of the world, and she’s found ways to blend that with her love for climate justice—writing songs that reflect on our changing planet and the emotions that come with it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eZaida’s a signed artist with Yale’s student record label, 17o1 Records, where she’s learned the ins and outs of artist branding and music marketing. She’s performed at legendary venues like Toad’s Place (yes, the same one where Bob Dylan and Cardi B once stood!), created music videos, and even served as a brand ambassador for Brandy Melville and the Yale Schwarzman Center. She was honored to receive the Selden Memorial Award for achievement in music at Yale, and credits much of that to the creative freedom and support she found there.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut before Yale, high school was its own whirlwind of creativity and advocacy. Zaida co-founded \u003cem\u003eKeepers of the Dream\u003c/em\u003e, a county-wide social justice group focused on amplifying POC voices, served as president of the Mariachi Club and Songwriters’ Club, and mentored others in music. She was twice crowned New York State Champion for Poetry Out Loud, won “Best Playwright,” and helped push forward bills supporting women’s rights through the Mayor’s Youth Council. She even taught her health teacher’s son classical guitar!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of class and the recording studio, Zaida is a member of Yale’s hip-hop dance group, Rhythmic Blue, has toured with the a cappella group Shades of Yale, and has also performed in several campus musicals. In her free time, you’ll find her choreographing dance pieces with her friends, journaling lyrics on her notes app, curating tragic Spotify playlists, or deep in a conversation about Jeff Buckley (her favorite artist of all time).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a mentor, her mission is to help students tap into their authentic voice—whether it’s for a college essay, a new song, or their next creative project. She wants her mentees to leave their time together feeling more confident, not just in their ideas, but in \u003cem\u003ewho they are\u003c/em\u003e and what they bring to the table, and how to share it with the world. Teaching and mentoring has been some of the most fulfilling parts of her journey so far—whether it’s helping someone write their first song or giving feedback on a personal statement, she loves witnessing that spark of discovery.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAbove all, Zaida believes in the power of storytelling—through music, writing, and meaningful conversations—and she can’t wait to share that power with you.\u003c/p\u003e","teachingVideoPlaybackId":"z65URdyVssHMtcbG9pPgWTPzj88hWo96kXCNXxV8pN00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eSomething that I take great pride in is having been able to win the Poetry Out Loud New York State Championship two years in a row. As a singersongwriter and actor, storytelling through poetry throughout highschool truly propelled me into my music career. I had the most amazing time taking on new characters, learning their stories, and adding my own to each poem that I recited for the competition. I firmly believe that this experience galvanized me into writing more poetry through songwriting today.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"dda85139-a05f-4078-9c4b-4b0df881ee1f\"}"},{"__ref":"Favorites:{\"uuid\":\"a0bb2db0-ec6f-484c-b330-ca022bf69b1d\"}"},{"__ref":"Favorites:{\"uuid\":\"3690f314-6969-4c8f-927a-7fcfa4ff85a0\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"01877aa2-d724-485c-9758-cdaac205a0c6\"}"},{"__ref":"CausesSupported:{\"uuid\":\"c3e84e77-40d0-4a6c-bdfa-5acb6a4e1c35\"}"}],"major":"Environmental Studies","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d0392ead-e1a5-4c41-b655-0f68bbc197e9\"}"},{"__ref":"DeepDives:{\"uuid\":\"f474eb09-0de2-4948-a0be-40c44b162fae\"}"},{"__ref":"DeepDives:{\"uuid\":\"13b4c0a4-33d5-403a-b8ce-2d62ba5293f0\"}"},{"__ref":"DeepDives:{\"uuid\":\"3fad715c-3d6b-4bcd-a96f-550e5388ac7b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/4016a127-4f66-4ad8-8db2-5c040b3536c8/-/preview/-/format/jpg/","https://ucarecdn.com/7f516d93-0776-4475-ad8f-345f7ae2268e/-/preview/-/format/jpg/","https://ucarecdn.com/9fda0fe4-0b88-49c7-81fd-12b286a69d66/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"27eeb88e-e4ac-48b5-a84e-4f5c4
