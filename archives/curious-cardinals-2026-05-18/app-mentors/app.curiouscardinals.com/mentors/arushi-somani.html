xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bb21c2ef-35c9-46d3-8bc6-aa3057b1086d\"}":{"__typename":"Favorites","uuid":"bb21c2ef-35c9-46d3-8bc6-aa3057b1086d","photoUrl":"https://ucarecdn.com/de73f167-a06c-4b35-a4df-ed44ef401d52/","title":"American Teen","type":"ALBUM"},"Favorites:{\"uuid\":\"b59e4d0a-6c1f-4ddc-8936-5cc5c2889833\"}":{"__typename":"Favorites","uuid":"b59e4d0a-6c1f-4ddc-8936-5cc5c2889833","photoUrl":"https://ucarecdn.com/c9271b33-5f41-4440-b942-e22d3f6da572/","title":"Laguna Beach","type":"CITY"},"Favorites:{\"uuid\":\"ba83a1ef-5a8c-4ab2-871a-b6b5f06a8b97\"}":{"__typename":"Favorites","uuid":"ba83a1ef-5a8c-4ab2-871a-b6b5f06a8b97","photoUrl":"https://ucarecdn.com/5f78adad-a73c-440e-92a3-ff30bf37e180/","title":"Percy Jackson Series","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"6ef6e36f-864e-416d-a566-921eb262ea07\"}":{"__typename":"DeepDives","uuid":"6ef6e36f-864e-416d-a566-921eb262ea07","content":"\u003cp\u003eAs I navigated what I wanted to pursue in my academic and professional career, the one thing I've always relied on is the mentorship of peers and friends who were older and experienced. I believe one of the most valuable experiences in life is using your own mistakes and the lessons you have learned to help guide future generations. I am passionate about helping each child unveil a world that they truly care about. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"c3657475-d774-414b-bad5-715a04323e01\"}":{"__typename":"DeepDives","uuid":"c3657475-d774-414b-bad5-715a04323e01","content":"\u003cp\u003eOne of my personal passion projects, that I am incredibly proud of, is the creation of a community garden on my high school's campus coupled with an environmental education curriculum. As I learned more about environmental science and realized that I am passionate about advocating for sustainability, I worked with my town's mayor and school board to create a community garden on my own campus. This served as an environment to teach students sustainable habits like composting, agriculture, and irrigation. I also created a curriculum on living sustainably that I presented at various K-12 schools.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"57363a1e-b53d-41cb-9e09-1bad2c6e4ac3\"}":{"__typename":"DeepDives","uuid":"57363a1e-b53d-41cb-9e09-1bad2c6e4ac3","content":"\u003cp\u003eThis year, I was invited to be a keynote speaker at the Simi Valley Youth Summit. The theme was \"Voices of Tomorrow,\" and I gave a presentation about how to find your passion, grow it into something used for change, and how to excel as a leader throughout the process. My presentation encompassed everything that matters to me in mentoring other young students. I know the pressure many students face and that finding your passion is not an easy path. My presentation gave a real approach into the process because I have walked those same steps before.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"f726de75-7ec7-418d-b1e4-da9367bdcabb\"}":{"__typename":"DeepDives","uuid":"f726de75-7ec7-418d-b1e4-da9367bdcabb","content":"\u003cp\u003eMy dream job is to be an ophthalmologist, and specifically a glaucoma specialist. Four years ago, my dad was declared legally blind which is what sparked my interest in ophthalmology. This past summer, I worked as an ophthalmic medical assistant and scribe which truly helped me realize that I want to pursue ophthalmology as a career. Not only do I love working with patients in an ophthalmic setting, but I genuinely believe that I can understand how to care for them better through my experiences caring for my father. The doctor I scribed for often told me about her forty medical missions around the world and taught me about giving back through medical volunteering. The way she spoke about being able to save eyes and instill hope in the most rural areas inspired me to give back, starting with my local community. Through my work experience and volunteer work as a board member of Foundation Fighting Blindness, the most important thing I have learned is that prevention is better than cure.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"School:{\"uuid\":\"774a1bff-cb99-4452-9f88-3bd488126cd8\"}":{"__typename":"School","uuid":"774a1bff-cb99-4452-9f88-3bd488126cd8","name":"Valencia High School","city":"Placentia","type":"HIGH","state":"California","country":"United States","zip":"92870"},"Education:{\"uuid\":\"87be83a4-b435-459e-85b7-09227e0263bf\"}":{"__typename":"Education","uuid":"87be83a4-b435-459e-85b7-09227e0263bf","school":{"__ref":"School:{\"uuid\":\"774a1bff-cb99-4452-9f88-3bd488126cd8\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}":{"__typename":"School","uuid":"b9decdeb-8d9d-40ef-b672-99ba82fce3af","name":"University of California, Los Angeles","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90095"},"Education:{\"uuid\":\"130a1b65-e715-4c19-8897-2ccfeeae7428\"}":{"__typename":"Education","uuid":"130a1b65-e715-4c19-8897-2ccfeeae7428","school":{"__ref":"School:{\"uuid\":\"b9decdeb-8d9d-40ef-b672-99ba82fce3af\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biology","degree":null},"MentorPublicProfile:{\"uuid\":\"228b2e97-c9e6-4606-b086-0a3abd1ce1a7\"}":{"__typename":"MentorPublicProfile","uuid":"228b2e97-c9e6-4606-b086-0a3abd1ce1a7","displayName":"Arushi S.","slug":"arushi-somani","biography":"\u003cp\u003eMy name is Arushi Somani and I am a third-year Biology student at UCLA, pursuing the pre-med track. My career aspiration is to becoming an ophthalmologist and specialize in glaucoma. I am passionate about medicine and pursuing this career due to my father's blindness. I volunteer with UCLA Jules Stein Eye Institute to conduct pre-school vision screenings and serve underprivileged communities in LA with the Mobile Eye Clinic. Striving to cultivate a community for the visually impaired, I am a a board for Foundation Fighting Blindness L.A. Chapter. I enjoy research and think it is critical for advancement. In my current lab, I am a student researcher for stem cell regeneration of corneal cells. Due to another passion for environmentalism, I have contributed to research to wildfire recovery planning, single-use plastic bans, and composting in schools.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I am the captain of my college's fusion Bollywood dance team. I have also competed in pageants for the past 7 years in the Miss America and Miss Volunteer America Programs. Through pageants I have grown my volunteerism and my two platforms called \"Environmental Education: Growing Our Minds\" and \"Foresight: Fighting Blindness.\" Some pivotal experiences in my life include volunteering as a Crisis Text Counselor for the suicide text line and working as an ophthalmic technician and scribe. Slowly I learned how to prioritize my well being, and once I figured it out I wanted to ensure that no one else fought their battle alone which is why I began volunteering as a crisis counselor. It allows me to be a pair of ears for someone to share their struggles and know that they aren't facing their problems alone in the world. Working in healthcare has taught me so much about the change I want to create, especially in caring for the geriatric population. I have learned about the qualities I want to adapt to become a physician that is truly able to listen to the needs of my patients\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003eWhen building my own passion project for environmental education, I created a community garden for my high school campus by working with my mayor, school district, and the local university. In addition to the garden, I visited local K-12 schools and gave presentations on composting and sustainable practices. As I build my initiative, people began reaching out to me with incredible opportunities. I am honored to have been a keynote student speaker and leader for local climate protection protest and a guest on the Green Teens podcast. I am excited to use my experience in building my brand, my network, and ultimately my passion to help guide students in doing the same.\u003c/p\u003e","teachingVideoPlaybackId":"inWrb8qQ0024sOXoXZX96JBH895hN1pANche01HidX3Ow","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"bb21c2ef-35c9-46d3-8bc6-aa3057b1086d\"}"},{"__ref":"Favorites:{\"uuid\":\"b59e4d0a-6c1f-4ddc-8936-5cc5c2889833\"}"},{"__ref":"Favorites:{\"uuid\":\"ba83a1ef-5a8c-4ab2-871a-b6b5f06a8b97\"}"}],"causesSupported":[],"major":"Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"6ef6e36f-864e-416d-a566-921eb262ea07\"}"},{"__ref":"DeepDives:{\"uuid\":\"c3657475-d774-414b-bad5-715a04323e01\"}"},{"__ref":"DeepDives:{\"uuid\":\"57363a1e-b53d-41cb-9e09-1bad2c6e4ac3\"}"},{"__ref":"DeepDives:{\"uuid\":\"f726de75-7ec7-418d-b1e4-da9367bdcabb\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/009913af-e363-456c-9a83-8cc8bf539a82/-/preview/-/format/jpg/","https://ucarecdn.com/fc663dcf-0189-443a-a909-a25aa9bc9e7e/-/preview/-/format/jpg/","https://ucarecdn.com/e0b57074-dc2c-42cb-a72b-c7987bdd7c70/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"87be83a4-b435-459e-85b7-09227e0263bf\"}"},{"__ref":"Education:{\"uuid\":\"130a1b65-e715-4c19-8897-2ccfeeae7428\"}"}],"hiredAt":"2025-11-18T16:28:06.782Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Precalculus / Trigonometry","Calculus","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Creative Writing","Visual Arts / Graphic Design","Video / Photography","Medicine / Health","STEM Project","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/956e1849-9703-4b1f-8bd9-bd4ecf72cf55/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"arushi-somani\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"228b2e97-c9e6-4606-b086-0a3abd1ce1a7\"}"}}},"_sentryTraceData":"07005c2bd02e427bb69a38697334acf6-abd30acd5cf15baa-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=07005c2bd02e427bb69a38697334acf6,sentry-sample_rate=0.2,sentry-transaction=%2Fme
