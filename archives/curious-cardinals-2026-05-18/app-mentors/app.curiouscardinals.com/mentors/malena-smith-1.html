xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"fcc33941-f6d0-4dbc-abb3-583a09a2671f\"}":{"__typename":"Favorites","uuid":"fcc33941-f6d0-4dbc-abb3-583a09a2671f","photoUrl":"https://ucarecdn.com/c02539f1-e575-45cf-a482-e0cb01c1fcdf/","title":"Tennis","type":"SPORT"},"Favorites:{\"uuid\":\"bff2f5ae-6436-4953-b56a-347f2dafaa11\"}":{"__typename":"Favorites","uuid":"bff2f5ae-6436-4953-b56a-347f2dafaa11","photoUrl":"https://ucarecdn.com/b726f42e-de43-471c-8562-316bd549cbec/","title":"Caitlin Clark","type":"ATHLETE"},"Favorites:{\"uuid\":\"82ae629a-529f-4a07-bdb8-215978f3ef75\"}":{"__typename":"Favorites","uuid":"82ae629a-529f-4a07-bdb8-215978f3ef75","photoUrl":"https://ucarecdn.com/065ad84d-27e0-400f-ad1c-ff65ffa770ba/","title":"Catan","type":"GAME"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"46ce6b69-b922-4bc3-8e96-10368cd7aa55\"}":{"__typename":"DeepDives","uuid":"46ce6b69-b922-4bc3-8e96-10368cd7aa55","content":"\u003cp\u003eIf I could advise my middle or high school self, I would tell myself to be less shy and more confident in sharing my ideas. Back then, I often held back because I worried about what others might think. What I have learned since is that speaking up and putting yourself out there opens the door to new opportunities, friendships, and experiences.\u003c/p\u003e\u003cp\u003eCollege and business school really encouraged me to grow in this area because I had to network and present daily. At first, it felt intimidating, but over time, I realized that confidence comes from practice and from trusting your own perspective. I would remind my younger self that my voice matters, and that being brave enough to use it not only helps me grow but can also inspire and encourage others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d0165b2d-e99c-431a-b9dc-743ee8aaaca8\"}":{"__typename":"DeepDives","uuid":"d0165b2d-e99c-431a-b9dc-743ee8aaaca8","content":"\u003cp\u003eMentorship matters to me because having someone who truly takes the time to know you and believe in you can change the course of your life. The best mentors are honest, supportive, and never judgmental - they create a safe space where you feel comfortable being yourself and encouraged to grow. I’ve seen how a mentor can open doors you didn’t even know existed, offer perspective during tough moments, and remind you of your potential when you might be doubting yourself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThat kind of encouragement doesn’t just help in the moment - it stays with you and shapes the way you move forward. Mentorship is about more than advice; it’s about having someone in your corner who pushes you to dream bigger and gives you the confidence to take that next step. That’s why mentorship matters so deeply to me, and why I believe it can truly transform someone’s path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"3d7b0149-2391-4113-815f-bca9f0027151\"}":{"__typename":"DeepDives","uuid":"3d7b0149-2391-4113-815f-bca9f0027151","content":"\u003cp\u003eMy greatest source of motivation comes from my curiosity and desire to make a difference. Whenever I see a challenge or a problem, I naturally start thinking of solutions and ways to improve things. I am always looking for opportunities to learn, grow, and do better - not just for myself, but for the people and communities around me. That drive to create positive change and keep improving is what inspires me every day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"9dab1554-41f8-4f03-bd73-c345793a5834\"}":{"__typename":"DeepDives","uuid":"9dab1554-41f8-4f03-bd73-c345793a5834","content":"\u003cp\u003eA passion project I’m currently working on is launching my own business. During my Master of Science in Social Entrepreneurship at USC Marshall School of Business, I worked on many hands-on projects that showed me how to take ideas from concept to real-world impact. Now, I’m excited to use that experience to mentor others. I’m excited to guide my mentees, share practical strategies, and help them turn their ideas into action. It’s incredibly rewarding to support students as they grow and see their own ideas come to life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"444ead8e-a318-4803-854a-d24b9a2e9f7b\"}":{"__typename":"School","uuid":"444ead8e-a318-4803-854a-d24b9a2e9f7b","name":"Maranatha High School","city":"Pasadena","type":"HIGH","state":"California","country":"United States","zip":"91105"},"Education:{\"uuid\":\"b0940f0f-fb70-4656-8451-448cc89d570f\"}":{"__typename":"Education","uuid":"b0940f0f-fb70-4656-8451-448cc89d570f","school":{"__ref":"School:{\"uuid\":\"444ead8e-a318-4803-854a-d24b9a2e9f7b\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}":{"__typename":"School","uuid":"e2fdfbbb-5b63-420d-a652-b271dfc11a8b","name":"University of Southern California","city":"Los Angeles","type":"COLLEGE","state":"California","country":"United States","zip":"90007"},"Education:{\"uuid\":\"c33f20f2-072e-4222-a4cc-9716153c38e5\"}":{"__typename":"Education","uuid":"c33f20f2-072e-4222-a4cc-9716153c38e5","school":{"__ref":"School:{\"uuid\":\"e2fdfbbb-5b63-420d-a652-b271dfc11a8b\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2025","major":"B.A Political science and M.S Entrepreneurship","degree":null},"MentorPublicProfile:{\"uuid\":\"bf9273f8-bda2-4548-84a3-8ea1bcb61708\"}":{"__typename":"MentorPublicProfile","uuid":"bf9273f8-bda2-4548-84a3-8ea1bcb61708","displayName":"Malena S.","slug":"malena-smith-1","biography":"\u003cp\u003eI care about using creativity and entrepreneurship to solve problems and build opportunities for others. As a student entrepreneur, I am in the process of launching my own business and exploring how leadership and innovation can create meaningful impact. For me, starting a business is not just about building something new. It is about combining strategy, creativity, and community to bring ideas to life.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I have developed a strong foundation in political science, business, and law. I have taken coursework such as Accounting Concepts and Financial Reporting, Marketing Management, Critical Issues in Law and Public Policy, Environmental Law, Politics of Resources and Development, Concepts in American Law, Social Entrepreneurship: Design, Develop, and Deliver, and Political Parties, Campaigns, and Elections. These classes have helped me understand how financial systems, legal frameworks, and civic leadership shape the world, while also teaching me how to design solutions that balance business sustainability with social good.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond the classroom, I have gained hands-on experience through nonprofit and community work. One of the most impactful projects I worked on was leading digital fundraising and social media strategy for a nonprofit that provides mobile laundry services to unhoused individuals in Los Angeles. By designing campaigns and growing the organization’s digital presence, I helped raise thousands of dollars and connected with supporters who care deeply about dignity and service. This experience, along with others in legal and communications roles, showed me how powerful storytelling and strategy can be in creating real-world change.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside academics and service, I bring a strong set of skills that support my entrepreneurial goals. I am biliterate in English and Spanish, which helps me connect across cultures and build inclusive spaces. I have technical strengths in Adobe Creative Suite, Microsoft Office, website design and development, and digital communications, while also excelling in writing, problem-solving, fundraising, and effective communication. I also hold an MBA Quantitative Skills certification, which adds an analytical edge to my creative work.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school and work, I am passionate about sports and the outdoors. I have played tennis for years and am a dedicated tennis fan who follows major tournaments closely. I am also a loyal Dodgers fan and love cheering on USC football. Staying active is important to me, and I enjoy swimming, hiking, and camping as ways to recharge and stay grounded.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the heart of everything I do is a desire to learn, grow, and create impact, whether in business, community work, or through personal passions. My goal is to continue building on my entrepreneurial journey while also living a balanced and adventurous life filled with creativity, leadership, and connection.\u003c/p\u003e","teachingVideoPlaybackId":"75xSnb9gpa00J5xWBAmMtMaM02017ngk01M5n6WucZoWMeo","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"fcc33941-f6d0-4dbc-abb3-583a09a2671f\"}"},{"__ref":"Favorites:{\"uuid\":\"bff2f5ae-6436-4953-b56a-347f2dafaa11\"}"},{"__ref":"Favorites:{\"uuid\":\"82ae629a-529f-4a07-bdb8-215978f3ef75\"}"}],"causesSupported":[],"major":"B.A Political science and M.S Entrepreneurship","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"46ce6b69-b922-4bc3-8e96-10368cd7aa55\"}"},{"__ref":"DeepDives:{\"uuid\":\"d0165b2d-e99c-431a-b9dc-743ee8aaaca8\"}"},{"__ref":"DeepDives:{\"uuid\":\"3d7b0149-2391-4113-815f-bca9f0027151\"}"},{"__ref":"DeepDives:{\"uuid\":\"9dab1554-41f8-4f03-bd73-c345793a5834\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/ea848761-a6ab-48d3-a450-ed803764770e/-/preview/-/format/jpg/","https://ucarecdn.com/8dc67948-eb7e-401b-9ee1-374bca39d4ae/-/preview/-/format/jpg/","https://ucarecdn.com/2a65e257-1ce3-4c81-9e26-d94e680b344b/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":null,"education":[{"__ref":"Education:{\"uuid\":\"b0940f0f-fb70-4656-8451-448cc89d570f\"}"},{"__ref":"Education:{\"uuid\":\"c33f20f2-072e-4222-a4cc-9716153c38e5\"}"}],"hiredAt":"2025-09-16T00:18:27.758Z","topics":["K-5 Grade Math","Pre-Algebra","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","College Essay Writing","Reading","History","Executive Function","Creative Writing","History Project","K-6 Storybook","Business / Entrepreneurship","Web Design","Journalism","Sustainability","Law / Government / Policy"],"communityBadges":["https://ucarecdn.com/1a1a5e78-c227-456b-b3c4-b48a2f04178a/","https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/6fbd7257-e9de-4421-8a0b-bde4a854891b/","https://ucarecdn.com/7f8f1ed3-79b5-41c5-b8fd-a444de85708b/","https://ucarecdn.com/b98f175c-f982-4497-bb8d-4a9c11113cd8/"],"re
