xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7be05e4a-92ca-4431-9db3-fd806a063413\"}":{"__typename":"Favorites","uuid":"7be05e4a-92ca-4431-9db3-fd806a063413","photoUrl":"https://ucarecdn.com/f7d3844e-9944-4d71-afe7-2212b54e3897/","title":"Lady Gaga","type":"ARTIST"},"Favorites:{\"uuid\":\"c85855df-da47-4e6f-9735-5ca5909f212d\"}":{"__typename":"Favorites","uuid":"c85855df-da47-4e6f-9735-5ca5909f212d","photoUrl":"https://ucarecdn.com/b13ea0e5-1e23-425e-8e17-63df50fe8897/","title":"Their Eyes Were Watching God by Zora Neale Hurston","type":"BOOK"},"Favorites:{\"uuid\":\"27c0c77a-e4bc-4c80-8cc4-3cf9c3550803\"}":{"__typename":"Favorites","uuid":"27c0c77a-e4bc-4c80-8cc4-3cf9c3550803","photoUrl":"https://ucarecdn.com/04fec40e-4250-49b8-a58a-2e3128726c20/","title":"Ferris Bueller's Day Off","type":"MOVIE"},"CausesSupported:{\"uuid\":\"ae8ad125-aa51-4c8b-a757-91d56ef91444\"}":{"__typename":"CausesSupported","uuid":"ae8ad125-aa51-4c8b-a757-91d56ef91444","name":"Roots of Health","description":"\u003cp\u003eI organized a benefit for them with a panel of reproductive health experts.\u003c/p\u003e","photoUrl":"https://ucarecdn.com/f04153c4-7bb9-44f9-8689-046b7dfbdac4/"},"CausesSupported:{\"uuid\":\"7f4a1483-3960-4d1b-ab4d-aac41ec2d462\"}":{"__typename":"CausesSupported","uuid":"7f4a1483-3960-4d1b-ab4d-aac41ec2d462","name":"TADA! Youth Theater","description":"\u003cp\u003eTADA! provides free performance training and opportunities for kids in New York \u003c/p\u003e","photoUrl":"https://ucarecdn.com/eb9ff6d3-bbe3-4402-a018-3abfa6a67dcd/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"104245df-8b1c-4e4c-9b0f-8e817d4fbcc9\"}":{"__typename":"DeepDives","uuid":"104245df-8b1c-4e4c-9b0f-8e817d4fbcc9","content":"\u003cp\u003eI was a History of Science, Medicine, and Public Health major at Yale--and proud of it! As a not-so-STEMMY pre-med student, this major allowed me to merge my interest in medicine with my love of history and the humanities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"0fa2f4cb-da4d-411d-90f1-584ca2a709dc\"}":{"__typename":"DeepDives","uuid":"0fa2f4cb-da4d-411d-90f1-584ca2a709dc","content":"\u003cp\u003eI grew up interfaith, celebrating both  Jewish and Christian holidays. Transparently, while I am not actively practicing in either faith, religion was used in my family as a medium for spirited discussion and inquiry and an opportunity for us to engage academically and culturally with our heritage. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis translates directly to my teaching style. As a mentor, I want to act as a discussion partner as well as a teacher.  I am also a firm believer that there are very few things in life that are black and white. I always encourage questions, whether they're clarifying or challenging.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"9f435289-3dab-46c8-8417-d809375e50d6\"}":{"__typename":"DeepDives","uuid":"9f435289-3dab-46c8-8417-d809375e50d6","content":"\u003cp\u003eI was a very busy high school student (one could argue, too busy!) I sang in an a capella group, performed in plays and musicals, was on my school's Model UN team, volunteered at hospitals and started my own medicine/health club. Trying to juggle all of this with an active social life (and a 45 minute commute to and from school) was no easy feat. While I definitely wish I had taken more time to relax, I learned a lot about time management and organization that I still carry with me to this day.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"04bf8865-6e81-40de-9624-654a8cd03913\"}":{"__typename":"DeepDives","uuid":"04bf8865-6e81-40de-9624-654a8cd03913","content":"\u003cp\u003eIn my sophomore year of college, I was diagnosed with chronic migraine. At the time, I was having migraines nearly every single day, some of which lasted for weeks or even months. Managing my diagnosis and finding treatments that worked for me was a long process and is still something that I struggle with. Ultimately, I learned the importance of being kind to myself and knowing my limitations. There is nothing wrong with taking time to rest and recover!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}":{"__typename":"School","uuid":"2ff73c87-6442-482c-8d92-863dfb263ea0","name":"The Dalton School","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"d979535e-8916-4e87-af12-1aac2b416697\"}":{"__typename":"Education","uuid":"d979535e-8916-4e87-af12-1aac2b416697","school":{"__ref":"School:{\"uuid\":\"2ff73c87-6442-482c-8d92-863dfb263ea0\"}"},"startYear":"2006","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"9ae427bb-15f3-4686-b7e5-8d2dcc01a39c\"}":{"__typename":"Education","uuid":"9ae427bb-15f3-4686-b7e5-8d2dcc01a39c","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"History of Science, Medicine and Public Health","degree":null},"MentorPublicProfile:{\"uuid\":\"f5749f30-a0d3-43a2-a04a-cdb932882f83\"}":{"__typename":"MentorPublicProfile","uuid":"f5749f30-a0d3-43a2-a04a-cdb932882f83","displayName":"Samantha P.","slug":"samantha-pohly","biography":"\u003cp\u003eHi there!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Samantha (but most people call me Sammi), and I graduated from Yale University in May 2024! I earned a B.A. in The History of Science, Medicine, and Public Health (HSHM) and graduated with distinction in my major. I'm a born-and-raised New Yorker and, prior to Yale, I attended The Dalton School from Kindergarten to 12th grade. In both high school and college, I was lucky enough to pursue my two disparate passions: \u003cstrong\u003emedicine and the performing arts.\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Yale, I was a \u003cstrong\u003epre-medical student\u003c/strong\u003e. Over the pandemic, I took a gap year where I interned on the portfolio and business development team at Biohaven Pharmaceuticals, earned my certification as an EMT, and spearheaded my own volunteer project where I arranged meal deliveries and donations for internal medicine residents staffing the COVID-19 care units at three separate New York City hospitals. Throughout my time at Yale, I also taught sex education to New Haven public school students, studied traditional Vietnamese medicine in Ho Chi Minh City, and researched at an Obstetrics and Gynecology laboratory at Yale Medical School. My HSHM thesis was titled \"An Interstitial Ideology: Chinese Medicine and Its Place in the Shifting Medical Landscape of Early Modern Europe.\"\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI have also always had a passion for the \u003cstrong\u003eperforming arts\u003c/strong\u003e! In fact, I am currently pursuing a career in acting. A trained dancer, singer, and actress, I've performed in innumerable theatrical productions, ranging from Shakespeare to Musical Theater. I have performed at Carnegie Hall, choreographed full length dance pieces as part of Dalton's rigorous DTW choreographer program, and arranged music for my high school and college a capella groups. Additionally, I recently made both my professional acting and off-Broadway debut! More information on my acting and performance credits can be found on my website: www.samanthapohly.com\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn my free time, I love to travel, read, try new foods and log them on Beli, and spend time with my friends. I recently devoured the Throne of Glass series by Sarah J. Maas, and my love for NYT word games knows no bounds. After holding out for perhaps too long, I've recently gotten into podcasts--my favorite podcast is The Rest Is History!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether you're a dead-set STEM kid, a true thespian, or a combination of the two like me, I cannot wait to connect with my mentees!\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eDuring the COVID-19 pandemic, I organized a meal donation and delivery service for doctors working in the critical-care units of three different New York area hospitals: Bellevue, NYU Tisch, and Manhattan VA Medical Center. I personally managed the donations, placed all food orders, and coordinated the meal deliveries to over one hundred critical-care residents every night for multiple months. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"7be05e4a-92ca-4431-9db3-fd806a063413\"}"},{"__ref":"Favorites:{\"uuid\":\"c85855df-da47-4e6f-9735-5ca5909f212d\"}"},{"__ref":"Favorites:{\"uuid\":\"27c0c77a-e4bc-4c80-8cc4-3cf9c3550803\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"ae8ad125-aa51-4c8b-a757-91d56ef91444\"}"},{"__ref":"CausesSupported:{\"uuid\":\"7f4a1483-3960-4d1b-ab4d-aac41ec2d462\"}"}],"major":"History of Science, Medicine and Public Health","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"104245df-8b1c-4e4c-9b0f-8e817d4fbcc9\"}"},{"__ref":"DeepDives:{\"uuid\":\"0fa2f4cb-da4d-411d-90f1-584ca2a709dc\"}"},{"__ref":"DeepDives:{\"uuid\":\"9f435289-3dab-46c8-8417-d809375e50d6\"}"},{"__ref":"DeepDives:{\"uuid\":\"04bf8865-6e81-40de-9624-654a8cd03913\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8fbd20df-3a2d-448a-be2b-3b29727a0d60/-/preview/-/format/jpg/","https://ucarecdn.com/2caa76f9-5179-4e67-9e65-2f908b0130ad/-/preview/-/format/jpg/","https://ucarecdn.com/b045175a-7750-47c0-b18f-edd5635dcad3/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"d979535e-8916-4e87-af12-1aac2b416697\"}"},{"__ref":"Education:{\"uuid\":\"9ae427bb-15f3-4686-b7e5-8d2dcc01a39c\"}"}],"hiredAt":"2025-02-19T19:50:09.380Z","topics":["6-8 Grade Science","Chemistry","Biology","Writing","Academic Coaching","Reading","History","College Essay Writing","Executive Function","Film / Theater","History Project","K-6 Storybook","Creative Writing","Medicine / Health","STEM Project","Public Speaking"],"communityBadges":["https://ucarecdn.com/677dffbb-2115-4ac2-b7bc-f0a07d1169c6/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"samantha-pohly\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f5749f30-a0d3-43a2-a04a-cdb932882f83\"}"}}},"_sentryTraceData":"79deca38b12a4e5eb549816caeb8a6c0-b74bf5c34a994b90-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=79deca38b12a4e5eb549816caeb8a6c0,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"samantha-pohly"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
