xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c45e0281-dfdb-40f9-bb63-e787e8c83a10\"}":{"__typename":"Favorites","uuid":"c45e0281-dfdb-40f9-bb63-e787e8c83a10","photoUrl":"https://ucarecdn.com/cbdd0eb2-1a29-4fae-b29a-a30a1fcab15f/","title":"200 FOR LUNCH By Gunna","type":"SONG"},"Favorites:{\"uuid\":\"74b41ac9-4a7a-496a-918e-7b56becd7abb\"}":{"__typename":"Favorites","uuid":"74b41ac9-4a7a-496a-918e-7b56becd7abb","photoUrl":"https://ucarecdn.com/bf550edf-8da0-4ce7-a007-f98a25408fc1/","title":"Addis Ababa","type":"CITY"},"Favorites:{\"uuid\":\"97663013-ccf7-4c70-a04e-0c83c9f83896\"}":{"__typename":"Favorites","uuid":"97663013-ccf7-4c70-a04e-0c83c9f83896","photoUrl":"https://ucarecdn.com/6d223f38-86c9-4879-b30f-ab4d268c2990/","title":"Cooper Flag","type":"ATHLETE"},"CausesSupported:{\"uuid\":\"4c89e143-56ce-4e96-bfff-3d28b9133e7c\"}":{"__typename":"CausesSupported","uuid":"4c89e143-56ce-4e96-bfff-3d28b9133e7c","name":"Mekedonia Charity Homes for the Elderly and Mentally Disabled","description":"\u003cp\u003eAssisted residents with daily care, observed medical consultations, managed meal\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"8879c997-8126-42a7-a8c6-b9c64b46a96c\"}":{"__typename":"DeepDives","uuid":"8879c997-8126-42a7-a8c6-b9c64b46a96c","content":"\u003cp\u003eI care about mentorship because I know what it feels like to have big goals but not always know how to navigate the path to reach them. There are so many unwritten rules around academics, leadership, and college applications that people are just expected to know. The moments that made the biggest difference for me were when someone took the time to break things down clearly and make the process feel manageable. And I want to do that for other students.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"91be945f-836b-436c-a690-4113e0654f20\"}":{"__typename":"DeepDives","uuid":"91be945f-836b-436c-a690-4113e0654f20","content":"\u003cp\u003eOne thing I hope to accomplish is traveling the world. I want to experience different cultures, try new things, and step outside of what I’m used to. I think it helps you grow, and it’s also just exciting to experience something completely new.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"22ea3959-7581-42fa-a35d-338364e789c5\"}":{"__typename":"DeepDives","uuid":"22ea3959-7581-42fa-a35d-338364e789c5","content":"\u003cp\u003eI’m on the pre law track, so technically I could have chosen a lot of different majors. What drew me to Public Policy and International Comparative Studies was the implementation side of things. I did not just want to study ideas in theory. I wanted to understand how decisions are actually carried out and how they affect real communities.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1e7d0c6f-49f8-43b9-bb9b-aa35a7c8facd\"}":{"__typename":"DeepDives","uuid":"1e7d0c6f-49f8-43b9-bb9b-aa35a7c8facd","content":"\u003cp\u003eMy greatest source of motivation is my parents. They sacrificed a lot to give me opportunities they did not always have. Watching their work ethic and commitment has shaped how I approach my own goals.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"a577eec3-e39c-4780-a8b6-8420da354a16\"}":{"__typename":"School","uuid":"a577eec3-e39c-4780-a8b6-8420da354a16","name":"Archbishop Curley High School","city":"Baltimore","type":"HIGH","state":"Maryland","country":"United States","zip":"21213"},"Education:{\"uuid\":\"d91f9b88-0c55-4e2c-83d8-ad27abd36e9d\"}":{"__typename":"Education","uuid":"d91f9b88-0c55-4e2c-83d8-ad27abd36e9d","school":{"__ref":"School:{\"uuid\":\"a577eec3-e39c-4780-a8b6-8420da354a16\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"b9c36b9a-2bb8-4d85-b3d9-e9e115179407\"}":{"__typename":"Education","uuid":"b9c36b9a-2bb8-4d85-b3d9-e9e115179407","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Public Policy ","degree":null},"MentorPublicProfile:{\"uuid\":\"84284639-ed98-43e8-b522-40ff695573e3\"}":{"__typename":"MentorPublicProfile","uuid":"84284639-ed98-43e8-b522-40ff695573e3","displayName":"Michael H.","slug":"michael-hailu","biography":"\u003cp\u003eHi! I’m Michael, a student at Duke University studying Public Policy and International Comparative Studies (Concentration: Africa). I’m deeply interested in how law, governance, and global systems shape opportunity — especially for immigrant and historically marginalized communities. I’m passionate about helping students turn their curiosity into meaningful, real-world projects that reflect who they are and what they care about.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eA bit about me\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eGrowing up as a first-generation American in an Ethiopian family shaped how I think about education, voice, and access to opportunity. In high school, I cared deeply about leadership and social impact, but I didn’t always know how to translate that into tangible work. In college, I’ve learned how to transform interests into action by:\u003c/p\u003e\u003cp\u003e• Conducting research on youth civic engagement and student voting behavior\u003cbr\u003e• Leading student initiatives and working directly with university administration to facilitate structured conversations between students and decision-makers\u003cbr\u003e• Interning in legal and policy spaces to better understand how institutions impact communities\u003cbr\u003e• Building projects that connect academic ideas to real-world advocacy\u003c/p\u003e\u003cp\u003eI love helping students see that their interests — whether in global affairs, business, or public service — can become structured and impactful projects.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eHow I can help you\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI specialize in guiding middle and high school students through:\u003c/p\u003e\u003cp\u003e• Passion projects (starting an initiative, research project, club at school, podcast, or advocacy campaign)\u003cbr\u003e• College application strategy (building a cohesive narrative and strong extracurricular profile)\u003cbr\u003e• Leadership development (finding your voice and learning how to engage institutions confidently)\u003cbr\u003e• Research mentorship (developing questions, organizing ideas, and presenting findings clearly)\u003cbr\u003e• Writing support (analytical essays, persuasive writing, and personal statements)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want students to feel capable, not intimidated. I can help you:\u003c/p\u003e\u003cp\u003e• Strengthen your college applications so they tell a clear story\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eWhy I’m qualified to help\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAt Duke, I’ve worked on research teams, collaborated with professors, and helped organize conversations between students and administrators around policy and representation. My coursework across public policy, global studies, and philosophy has trained me to think critically, write clearly, and approach complex problems from multiple angles, skills I pass directly on to my students.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eOutside of academics\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eI enjoy watching TV shows, running, playing soccer, and hanging out with friends.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re ready to explore your interests seriously and build something meaningful, I’d love to work with you.\u003c/p\u003e","teachingVideoPlaybackId":"AVI5h6mOObESM4V3rJNbFzjzVGAxWkCSYaaLEZ3WW4A","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne thing I am really proud of is receiving the 2023 SEED Scholarship from the Society of Ethiopians Established in the Diaspora. I was recognized for academic excellence, community service, advocacy for marginalized youth, and serving as a role model within both the Ethiopian diaspora and the broader American community.\u003c/p\u003e\u003cp\u003eWhat meant the most to me was what it represented. It felt like my Ethiopian community trusting me to carry our values forward. It strengthened my commitment to lead with integrity and continue serving the community that helped shape me.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"c45e0281-dfdb-40f9-bb63-e787e8c83a10\"}"},{"__ref":"Favorites:{\"uuid\":\"74b41ac9-4a7a-496a-918e-7b56becd7abb\"}"},{"__ref":"Favorites:{\"uuid\":\"97663013-ccf7-4c70-a04e-0c83c9f83896\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"4c89e143-56ce-4e96-bfff-3d28b9133e7c\"}"}],"major":"Public Policy ","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8879c997-8126-42a7-a8c6-b9c64b46a96c\"}"},{"__ref":"DeepDives:{\"uuid\":\"91be945f-836b-436c-a690-4113e0654f20\"}"},{"__ref":"DeepDives:{\"uuid\":\"22ea3959-7581-42fa-a35d-338364e789c5\"}"},{"__ref":"DeepDives:{\"uuid\":\"1e7d0c6f-49f8-43b9-bb9b-aa35a7c8facd\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/60c1d81f-74ed-4061-ba5e-39bf011b0941/-/preview/-/format/jpg/","https://ucarecdn.com/0ef0beea-4420-48c9-8b0c-29977366db4a/-/preview/-/format/jpg/","https://ucarecdn.com/8acd9085-dd68-400a-b2f2-cbe4eaaeb458/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d91f9b88-0c55-4e2c-83d8-ad27abd36e9d\"}"},{"__ref":"Education:{\"uuid\":\"b9c36b9a-2bb8-4d85-b3d9-e9e115179407\"}"}],"hiredAt":"2026-02-20T18:58:17.636Z","topics":["K-6 Storybook","Creative Writing","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/"],"restrictedProfileVisibility":true,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"michael-hailu\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"84284639-ed98-43e8-b522-40ff695573e3\"}"}}},"_sentryTraceData":"ab64cee930cc4eafa8ed41a5ac5a29a2-9e34c493c5bad09d-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=ab64cee930cc4eafa8ed41a5ac5a29a2,sentry-sample_rate=0.2,sentry-transaction=
