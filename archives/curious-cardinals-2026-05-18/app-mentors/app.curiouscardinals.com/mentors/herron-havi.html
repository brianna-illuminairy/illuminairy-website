xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"0465d008-4f88-4f43-b14b-0a36fb2b5bbf\"}":{"__typename":"Favorites","uuid":"0465d008-4f88-4f43-b14b-0a36fb2b5bbf","photoUrl":"https://ucarecdn.com/9fca6616-62be-49c9-b741-dffb2092e089/","title":"Charlotte Cardin","type":"ARTIST"},"Favorites:{\"uuid\":\"bfe2006b-330c-4f34-b87b-92a323800bf1\"}":{"__typename":"Favorites","uuid":"bfe2006b-330c-4f34-b87b-92a323800bf1","photoUrl":"https://ucarecdn.com/f1412547-0a2c-482a-8c6d-6aef3ba5f1ec/","title":"Hanoi, Vietnam","type":"CITY"},"Favorites:{\"uuid\":\"d9a372cb-3218-48c2-a862-6ff2faf77a18\"}":{"__typename":"Favorites","uuid":"d9a372cb-3218-48c2-a862-6ff2faf77a18","photoUrl":"https://ucarecdn.com/c75a8931-56b3-4a64-8fac-ef7f136c3f20/","title":"The Count of Monte Cristo by Alexandre Dumas and Auguste Maquet","type":"BOOK"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"c77222c2-9fa2-429d-87e0-20be2e241660\"}":{"__typename":"DeepDives","uuid":"c77222c2-9fa2-429d-87e0-20be2e241660","content":"\u003cp\u003eI believe in the power of lifting others as we rise. As I grow more as an engineer and researcher, I make it my mission to give back the support and mentorship I have been so blessed to receive from my mentors, professors, peers, and the incredible people I have met along the way. It gives me purpose as an engineer and mentor as I support younger students. :) \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b3ebc8ab-e636-4df3-a7ca-360b75488247\"}":{"__typename":"DeepDives","uuid":"b3ebc8ab-e636-4df3-a7ca-360b75488247","content":"\u003cp\u003eIt was truly love at first sight for me. I walked into a graduate class at Stanford when I was a freshman where we were encouraged to talk about cars and engineering a few years ago. Leaving the first class, I couldn't wait to study more about how mechanical things move (cars/robots) and declared Mechanical Engineering soon later. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"c324e7f3-f82e-42a7-9b3c-5c85a7c1554c\"}":{"__typename":"DeepDives","uuid":"c324e7f3-f82e-42a7-9b3c-5c85a7c1554c","content":"\u003cp\u003eI hope my success creates more opportunities for other women to walk the paths they dream with less friction from societal pressure. (And, another dream of mine is to try as many bakeries in the whole world as possible!)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"2e2c67f9-7673-4685-89fe-16a7fddcc514\"}":{"__typename":"School","uuid":"2e2c67f9-7673-4685-89fe-16a7fddcc514","name":"Ha Tinh High School for the Gifted","city":"Ha Tinh","type":"HIGH","state":"Ha Tinh","country":"Vietnam","zip":"48000"},"Education:{\"uuid\":\"3cb078f8-7d73-49a2-a5f4-d7f7e5af57ad\"}":{"__typename":"Education","uuid":"3cb078f8-7d73-49a2-a5f4-d7f7e5af57ad","school":{"__ref":"School:{\"uuid\":\"2e2c67f9-7673-4685-89fe-16a7fddcc514\"}"},"startYear":"2019","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"7369b532-4a43-4715-a2ce-5a75b44c4fb0\"}":{"__typename":"Education","uuid":"7369b532-4a43-4715-a2ce-5a75b44c4fb0","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Mechanical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"28f3c594-bf9b-49b6-9b73-584b0b344df4\"}":{"__typename":"MentorPublicProfile","uuid":"28f3c594-bf9b-49b6-9b73-584b0b344df4","displayName":"Herron Ha-Vi N.","slug":"herron-havi","biography":"\u003cp\u003eHerron is a Mechanical Engineering student at Stanford University, where she researches robotics and builds systems that help robots think and move as they make smart decisions. Her work focuses on robotics systems and motorsports autonomy. Behind the credentials, she is someone who genuinely loves working with young people, and who takes that responsibility seriously.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe remembers exactly what it felt like to be a student encountering robotics for the first time: deeply exciting and confusing, but still a little intimidating. That experience inspires the way she mentors. Herron meets students where they are, celebrates every small win, empathizes with the struggle, and makes sure she and her students are always on the same page. She notices when a student is struggling and finds a new way to explain something until it finally becomes second nature. To her, the best sessions are not the ones where everything goes smoothly, but where a student hits a wall but still pushes through it and walks away knowing they can do it again. This comes from her experience working in all projects at Stanford where struggle and uncertainty are part of the process that leads to successful result. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eHerron brings the same rigor she applies in her Stanford research lab to every session but with patience, warmth, encouragement that high-school students need to truly thrive. She helps students build confidence, problem-solving skills, mindset for failure, and a belief in their own potential that will carry them far beyond any robotics classroom, even the ones she and her students are in. Her goal is to inspire students to believe in themselves and trust their autonomy to figure problems out with her help along the way.\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of her studies and research, Herron trains for her private pilot license, explores French literature, enjoys swing dance, and hunts down new bakeries with friends and family. \u003cbr\u003e\u003cbr\u003eHerron believes in lifting others as we rise. She takes great joy and interest in mentoring students, especially young girls in STEM field who are looking for inspiration and advice for college. She is honored to be part of the Curious Cardinals community, and committed to making it an experience your family is glad you chose.\u003c/p\u003e","teachingVideoPlaybackId":"OG8dkpfhxldsJIku00NjwK1xPHlTAvAwE5XSD3lHaoI8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eAcademically, it is my Silver Honor in the International Astronomy and Astrophysics Competition and my engineering research internship in Paris. \u003cbr\u003e\u003c/p\u003e\u003cp\u003eSocially, I am proud of how far I have grown as an engineer, and how the \"doubt\" in my head is less loud - I hope to inpsire younger students to embrace their confidence the same way.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"0465d008-4f88-4f43-b14b-0a36fb2b5bbf\"}"},{"__ref":"Favorites:{\"uuid\":\"bfe2006b-330c-4f34-b87b-92a323800bf1\"}"},{"__ref":"Favorites:{\"uuid\":\"d9a372cb-3218-48c2-a862-6ff2faf77a18\"}"}],"causesSupported":[],"major":"Mechani
