xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"87676c70-ea62-4f5d-9d51-9dc6e679d06b\"}":{"__typename":"Favorites","uuid":"87676c70-ea62-4f5d-9d51-9dc6e679d06b","photoUrl":"https://ucarecdn.com/37f35c1d-0ce3-4022-a81e-7dc895503f15/","title":"blonde","type":"ALBUM"},"Favorites:{\"uuid\":\"964208f4-4e05-4280-994e-0fccc5139e4f\"}":{"__typename":"Favorites","uuid":"964208f4-4e05-4280-994e-0fccc5139e4f","photoUrl":"https://ucarecdn.com/ea0a7709-4634-4e6c-8499-a398bd9cfe1a/","title":"Dijon","type":"ARTIST"},"Favorites:{\"uuid\":\"3189d35b-5fdf-4133-8d70-ccd19557eb22\"}":{"__typename":"Favorites","uuid":"3189d35b-5fdf-4133-8d70-ccd19557eb22","photoUrl":"https://ucarecdn.com/39e205ff-1f85-4d9f-b634-e77f4894dbab/","title":"honda feat. pa salieu by FKA twigs","type":"SONG"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"1fb275c9-0e43-4842-93cd-7544f469eb7d\"}":{"__typename":"DeepDives","uuid":"1fb275c9-0e43-4842-93cd-7544f469eb7d","content":"\u003cp\u003eMy current passion project is the perfect combination of art, fashion, and thrifting for me, and that is sewing! Since the beginning of this year, I have felt inspired to upcycle, alter, and design my own clothing. This came partially from my experience shopping, which often leads to me being unable to find clothes that fit me perfectly, but I was also inspired by the interests I had and never tried in my childhood. Sewing, or getting a sewing machine, can be a big investment, so I waited for months while I gathered inspiration to see if this was something I wanted to seriously pursue. After a whole six months, my mom so graciously gifted me my first ever sewing machine for my 22nd birthday! This has become my new summer hobby (when I have the time), and I am hoping I can continue this long after summer ends. To get started, I’ve been walking to my neighborhood thrift store to find cheap linens to create clothes from. I’ve collected some amazing sheets and curtains that will be very exciting projects for me to work on. Though, my first projects have actually been small alterations on clothing I already own. My goal by the end of the summer is to have an arsenal of sewing techniques that I feel solid enough on to not need the constant practice and memory-refresh when the busy school year comes back around. That way, I can continue to pursue projects on the occasion that I have free time without needing to worry about re-teaching myself. But I also know that sewing is a long, forever learning process, which is still just as fun! I’m super excited to be creative in a way that I never thought I would be capable of!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"71389a53-afe6-4503-906c-488452bd64eb\"}":{"__typename":"Education","uuid":"71389a53-afe6-4503-906c-488452bd64eb","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2024","major":"Sociology","degree":"Bachelor of Arts (A.B.)"},"School:{\"uuid\":\"1cd315d1-f95c-4095-a482-f2cba4bf0720\"}":{"__typename":"School","uuid":"1cd315d1-f95c-4095-a482-f2cba4bf0720","name":"Marshall Senior High School","city":"Marshall","type":"HIGH","state":"Minnesota","country":"United States","zip":"56258"},"Education:{\"uuid\":\"328f7997-572c-42de-9f8e-19de14923abe\"}":{"__typename":"Education","uuid":"328f7997-572c-42de-9f8e-19de14923abe","school":{"__ref":"School:{\"uuid\":\"1cd315d1-f95c-4095-a482-f2cba4bf0720\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"f6f37178-9279-4fe2-af67-c9dc2f5e94c0\"}":{"__typename":"MentorPublicProfile","uuid":"f6f37178-9279-4fe2-af67-c9dc2f5e94c0","displayName":"Devine B.","slug":"devine-bauman","biography":"\u003cp\u003eHi there, I’m Devine (like divine)! I’m originally from rural Minnesota but now attend Harvard University, where I am pursuing a degree in Sociology and a citation in French. In 2019, I graduated in the top 2% of my class at Marshall Senior High School, where I was dance team captain, drum major of the marching band, and a saxophone player. I loved all types of classes, especially chemistry and math, and I spent my time outside of school learning about human behavior. This led me to begin college studying pre-medical neuroscience, but a revitalized passion for society, human interactions, and medical injustices drove me to switch into Sociology at the beginning of my junior year. Right now, I am doing policy research at the New York Health Foundation in NYC and beginning my senior thesis! My Sociology works to dismantle fatphobia, with a particular focus on body image in plus-sized, non-white, young women and femmes, who are often kept out of the very limited research on fatphobia. My previous childhood passions also sparked my renewed interest in the arts and other creative activities. At Harvard, I am a co-Blues Department Head of WHRB, the campus radio station. I am also an editor of two magazines: Liminal Space Magazine, a literary arts publication, and FIG, the campus fashion magazine. I enjoy writing, editing, leading editorials, and working on the graphic design side of publications. In my free time, I am currently enjoying learning how to sew, thrifting, reading, and listening to my favorite podcasts.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"87676c70-ea62-4f5d-9d51-9dc6e679d06b\"}"},{"__ref":"Favorites:{\"uuid\":\"964208f4-4e05-4280-994e-0fccc5139e4f\"}"},{"__ref":"Favorites:{\"uuid\":\"3189d35b-5fdf-4133-8d70-ccd19557eb22\"}"}],"causesSupported":[],"major":"Sociology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"1fb275c9-0e43-4842-93cd-7544f469eb7d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3a9e86bb-aa78-46f8-9bbb-30b3646dd642/-/preview/-/format/jpg/"],"pronouns":"OTHER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"71389a53-afe6-4503-906c-488452bd64eb\"}"},{"__ref":"Education:{\"uuid\":\"328f7997-572c-42de-9f8e-19de14923abe\"}"}],"hiredAt":"2022-11-02T14:44:43.000Z","topics":["Writing","Algebra II","Precalculus / Trigonometry","Race \u0026 Ethnicity","Medicine / Health","Biology","Chemistry","Global Health","Geometry","STEM Project","Public Speaking","Visual Arts / Graphic Design"],"communityBadges":["https://ucarecdn.com/e4473574-f286-4e3f-85de-221775f4b513/","https://ucarecdn.com/cdffbc54-36e3-403b-8e3a-c334541e4ee2/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/","https://ucarecdn.com/d75fd6e6-8236-40e1-be45-6f572d92c49c/","https://ucarecdn.com/c21c2327-6a41-44b9-b6bd-5209ec2c85e7/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"devine-bauman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"f6f37178-9279-4fe2-af67-c9dc2f5e94c0\"}"}}},"_sentryTraceData":"59e82a9a82e64e3298e77c8ec5bb83c9-9254fc01ee10bd6b-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentr
