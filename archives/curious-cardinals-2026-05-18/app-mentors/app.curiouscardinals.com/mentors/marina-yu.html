xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"15188fe7-7ceb-4020-8f5d-09625cf147ee\"}":{"__typename":"DeepDives","uuid":"15188fe7-7ceb-4020-8f5d-09625cf147ee","content":"\u003cp\u003eIn my spare time, I love being outdoors, whether it’s hiking with my dog or exploring nature. It’s a great way to unwind and recharge while staying active. There's something refreshing about connecting with the natural world and discovering new trails.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"d3640196-7204-4c8d-afb7-b64300f9ba52\"}":{"__typename":"DeepDives","uuid":"d3640196-7204-4c8d-afb7-b64300f9ba52","content":"\u003cp\u003eMentorship matters to me because it’s been pivotal in my own growth. Having someone believe in me, offer guidance, and push me to see beyond my limits has shaped who I am. I love the idea of giving that back—helping others grow and succeed the way I’ve been supported.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5e366f03-1c67-475b-bc77-a8bdd3f1ebb3\"}":{"__typename":"DeepDives","uuid":"5e366f03-1c67-475b-bc77-a8bdd3f1ebb3","content":"\u003cp\u003eI chose to major in Economics and Philosophy because I’m fascinated by the interplay between human behavior and decision-making. Economics provides a framework for understanding how resources are allocated and how markets function, while Philosophy challenges me to think critically about ethics, values, and the human experience. Together, they offer a holistic view of complex issues, helping me explore not just how things work, but why they matter. This combination allows me to approach problems from multiple angles, enriching my understanding of the world and my role in it.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"47104599-1f9c-47a0-aa07-ecc108c5ea44\"}":{"__typename":"DeepDives","uuid":"47104599-1f9c-47a0-aa07-ecc108c5ea44","content":"\u003cp\u003eDuring high school summers, I worked part-time as a barista at a boba store, which taught me valuable skills in customer service and teamwork. I also loved exploring the outdoors and visiting national parks with my family, which helped me appreciate nature more deeply. Additionally, I participated in a music summer program, volunteered in my community, and did some math programs to sharpen my skills. It was a fulfilling mix of work, play, and personal growth!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"abd57c02-bbeb-427f-b642-0488f9094f71\"}":{"__typename":"School","uuid":"abd57c02-bbeb-427f-b642-0488f9094f71","name":"Lynbrook High School","city":"San Jose","type":"HIGH","state":"California","country":"United States","zip":"95129"},"Education:{\"uuid\":\"339d65a7-a32a-4015-b5a8-908be62ebfc7\"}":{"__typename":"Education","uuid":"339d65a7-a32a-4015-b5a8-908be62ebfc7","school":{"__ref":"School:{\"uuid\":\"abd57c02-bbeb-427f-b642-0488f9094f71\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"e9f32ce5-256a-4838-bf12-554b831b48e9\"}":{"__typename":"Education","uuid":"e9f32ce5-256a-4838-bf12-554b831b48e9","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Philosophy and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"90f6d806-5f93-4e57-ab76-056f76e5da72\"}":{"__typename":"MentorPublicProfile","uuid":"90f6d806-5f93-4e57-ab76-056f76e5da72","displayName":"Marina Y.","slug":"marina-yu","biography":"\u003cp\u003eHi! I’m Marina, and I’m passionate about helping students unlock their potential, find their passions, and build confidence in their abilities. I’ve been tutoring physics, math, and French since high school, where I discovered my love for teaching and guiding others. Over the years, I’ve developed a student-centered approach, focusing on breaking down complex concepts into manageable steps and helping students cultivate a growth mindset.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn addition, I’ve spent the past three years assisting high school students with their college application process, from brainstorming essays to providing detailed feedback and editing. I love helping students reflect on their unique experiences, discover their voice, and craft personal statements that truly represent who they are. I believe that with the right support and encouragement, every student can find their path and achieve their goals.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also deeply passionate about creating an inclusive, supportive environment for my mentees. Through my work as a camp counselor for Stanford’s Camp Kaleidoscope, I’ve learned how important it is for students to feel seen, heard, and understood. My experience working with diverse groups of young people has strengthened my ability to adapt my teaching style to meet the needs of each individual.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love spending time outdoors, playing with my dog, and learning from people around me. I’m excited to share my journey, mentor students, and help them gain confidence in their own abilities. Whether it’s tackling a school project, navigating personal challenges, or developing a passion, I’m here to support your child in every step of their growth.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Philosophy and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"15188fe7-7ceb-4020-8f5d-09625cf147ee\"}"},{"__ref":"DeepDives:{\"uuid\":\"d3640196-7204-4c8d-afb7-b64300f9ba52\"}"},{"__ref":"DeepDives:{\"uuid\":\"5e366f03-1c67-475b-bc77-a8bdd3f1ebb3\"}"},{"__ref":"DeepDives:{\"uuid\":\"47104599-1f9c-47a0-aa07-ecc108c5ea44\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/cae6d2be-cc2e-440d-ba99-8f085f0a2eba/-/preview/-/format/jpg/","https://ucarecdn.com/38e869e1-a8d3-4ee4-a63a-286afcc82fc6/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"339d65a7-a32a-4015-b5a8-908be62ebfc7\"}"},{"__ref":"Education:{\"uuid\":\"e9f32ce5-256a-4838-bf12-554b831b48e9\"}"}],"hiredAt":"2024-09-09T19:36:46.809Z","topics":["Music","Literature","Algebra I","Algebra II","Calculus","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Geometry","Physics","Writing","College Essay Writing","Business / Entreprene
