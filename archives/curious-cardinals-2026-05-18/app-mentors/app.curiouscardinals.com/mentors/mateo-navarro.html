xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"df7f0911-165c-4379-a06b-69133e04f23e\"}":{"__typename":"DeepDives","uuid":"df7f0911-165c-4379-a06b-69133e04f23e","content":"\u003cp\u003eMy dad has always been my greatest role model. He comes from a modest background as a paper boy in an agricultural town in California, and lives his life with honesty, and integrity, and kindness. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"5783048b-ad7a-4dea-9297-591a8c7039fc\"}":{"__typename":"DeepDives","uuid":"5783048b-ad7a-4dea-9297-591a8c7039fc","content":"\u003cp\u003eI chose my major because I wanted to spend time working in health policy in Congress when I got out of college. Now, I want to go to law school for public interest law, specifically in immigration and health! We'll see where I go from there.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"342773c1-97fb-4cfc-8524-71eda175bf20\"}":{"__typename":"DeepDives","uuid":"342773c1-97fb-4cfc-8524-71eda175bf20","content":"\u003cp\u003eMy dream job is working as an apricot farmer somewhere in the Central Coast of California. I would love some seabreeze on my back while spending my time out in nature, particularly with a couple of horses pestering me. Realistically, I'd love to be a public interest lawyer, helping win cases for everyday people in need.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}":{"__typename":"Question","uuid":"4d4f8d00-f784-4352-b1d7-69b09f7c73ee","question":"Tell us about a silly dream you once had…"},"DeepDives:{\"uuid\":\"f1d54f27-8ef4-4fd6-9b00-4c74ce38ff0d\"}":{"__typename":"DeepDives","uuid":"f1d54f27-8ef4-4fd6-9b00-4c74ce38ff0d","content":"\u003cp\u003eI've had a reoccuring dream over the past ten years of going to a circus with my two friends who are twins. I look down for a second, and I reappear in the middle of the circus act, attempting to tame a lion. I don't know what the dream represents, but my twin friends might be a bad omen.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"School:{\"uuid\":\"fb227357-04bb-4e70-b52a-7a2cd07050de\"}":{"__typename":"School","uuid":"fb227357-04bb-4e70-b52a-7a2cd07050de","name":"Ventura High School","city":"Ventura","type":"HIGH","state":"California","country":"United States","zip":"93001"},"Education:{\"uuid\":\"4e18ff88-d7d3-4f17-a7f4-06134275376e\"}":{"__typename":"Education","uuid":"4e18ff88-d7d3-4f17-a7f4-06134275376e","school":{"__ref":"School:{\"uuid\":\"fb227357-04bb-4e70-b52a-7a2cd07050de\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"f3977345-f68e-4221-895f-e15b8e7750f1\"}":{"__typename":"Education","uuid":"f3977345-f68e-4221-895f-e15b8e7750f1","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Public Health/International Affairs","degree":null},"MentorPublicProfile:{\"uuid\":\"93d21e54-51c4-4f1c-b7a2-06bd22683690\"}":{"__typename":"MentorPublicProfile","uuid":"93d21e54-51c4-4f1c-b7a2-06bd22683690","displayName":"Mateo N.","slug":"mateo-navarro","biography":"\u003cp\u003eHello! My name is Mateo Navarro, and I am a junior at Brown University. I study Public Health and International and Public Affairs, and my academic background is extensive, and somewhat wild. Entering Brown University through our undergraduate medical matriculation program, I spent my first two years studying neuroscience, biology, chemistry and other STEM-related courses. After integrating political science and public policy courses into my sophomore year, I realized my true dream of opening a public interest law firm, and helping advocate for sound U.S. policy in Congress. Transitioning from medicine into pre-law, and also engaging in extracurriculars such as the Brown Political Review, Brown PLME Senate, and housing advocacy, my knowledge in fields both academic and professional is extensive. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eBefore Brown, I grew up in Ventura, California, where I spent most afternoons laying down on the sand or surfing at our local surf break. Most of my time at school revolved around student government work and volunteering. In my junior year, I spearheaded a year-long project to create a 40ft by 100ft mural of Chicano rights activist, Dolores Huerta, on the side of our school's massive gym facility. During the rest of my time at school, I was either busy studying for an exam or could be seen dancing as the school mascot- a cougar -for a sporting event. I'm serious. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eCurrently, I work for the U.S. Senate underneath Senator Adam Schiff. I got here after desiring to feel as if my efforts were truly making a change in our country. Born into a Mexican household from my father's side, I am currently working on my Spanish, and use the personal experience of low-income and racial disparities in Southern California to fuel my advocacy and pre-legal pathway every day. I hope to spend two years after my undergraduate years in Mexico, working for the U.S. Committee on Refugees and Immigrants, as well as 6 months doing humanitarian work in South America.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I love to surf, backpack for days on end in the High Sierras, do film photography, rock climb, and run. Ask me anything about the Game of Thrones series, I have the answer! \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI look forward to meeting you, and cultivating a project that you can be proud of through our time together. Let's get started!\u003c/p\u003e","teachingVideoPlaybackId":"F9AhMHM2oC3u9HHdl2ZGyP025odqiH00O9EJOzGb5lQMA","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Public Health/International Affairs","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"df7f0911-165c-4379-a06b-69133e04f23e\"}"},{"__ref":"DeepDives:{\"uuid\":\"5783048b-ad7a-4dea-9297-591a8c7039fc\"}"},{"__ref":"DeepDives:{\"uuid\":\"342773c1-97fb-4cfc-8524-71eda175bf20\"}"},{"__ref":"DeepDives:{\"uuid\":\"f1d54f27-8ef4-4fd6-9b00-4c74ce38ff0d\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/00a3dca7-5e14-4bdf-9892-fa4f32bb304d/-/preview/-/format/jpg/","https://ucarecdn.com/a2c5ef1d-7f76-49bd-b0cf-0bcd02db443f/-/preview/-/format/jpg/","https://ucarecdn.com/22e1eb84-b47d-40eb-a67d-5fdc976c6dca/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4e18ff88-d7d3-4f17-a7f4-06134275376e\"}"},{"__ref":"Education:{\"uuid\":\"f3977345-f68e-4221-895f-e15b8e7750f1\"}"}],"hiredAt":"2026-02-12T02:43:46.597Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","6-8 Grade Science","Chemistry","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","History Project","Medicine / Health","STEM Project","Law / Government / Policy","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/f77b6ceb-6fd8-4b29-89e4-89a1e90cc51c/","https://ucarecdn.com/6fbd7257-e9de-4421-8a0b-bde4a854891b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"mateo-navarro\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"93d21e54-51c4-4f1c-b7a2-06bd22683690\"}"}}},"_sentryTraceData":"875e567d5bc74ec08013f83049bec39f-84bb5126e8d85fba-1","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=875e567d5bc74ec08013f83049bec39f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=true"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"mateo-navarro"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="d
