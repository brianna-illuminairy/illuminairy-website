xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ce87e127-5cff-4e9d-8cd3-7b6d6d62544c\"}":{"__typename":"DeepDives","uuid":"ce87e127-5cff-4e9d-8cd3-7b6d6d62544c","content":"\u003cp\u003eMentorship matters to me because, as a kid, I had a lot of big dreams (and big expectations!) and no idea how to get there. My purpose is to help you get to where you're going without all the road bumps I hit on my way here.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"01b1f8fb-6dd0-4d53-b9e4-3ea9457c3ade\"}":{"__typename":"DeepDives","uuid":"01b1f8fb-6dd0-4d53-b9e4-3ea9457c3ade","content":"\u003cp\u003eI once built a video game featuring all my friends for a school project. Granted, it was completely and totally overkill - I recruited people to do our sound track, I did all the character art, wrote manuals and documentation, animated the entire game, and demo'd it to a mentor who was expecting a lot less. When I find things that I care about or that interest me, especially if I can involve people I care about, working on them is so fun it doesn't feel like work.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"213e4d34-3d33-4e17-a9e6-9caf20b4a253\"}":{"__typename":"DeepDives","uuid":"213e4d34-3d33-4e17-a9e6-9caf20b4a253","content":"\u003cp\u003eI would tell my high school self to spend more time with his friends. Investing in and building relationships with people you care about is a very, very underrated skill.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"ecd76969-724c-457b-82aa-028231720cfc\"}":{"__typename":"DeepDives","uuid":"ecd76969-724c-457b-82aa-028231720cfc","content":"\u003cp\u003eIn my spare time, I play for Brown University's Quidditch team. Yes, Quidditch. From Harry Potter. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"4627bbce-029c-47bc-88f3-706270169734\"}":{"__typename":"School","uuid":"4627bbce-029c-47bc-88f3-706270169734","name":"James W Robinson, Jr. Secondary School","city":"Fairfax","type":"HIGH","state":"Virginia","country":"United States","zip":"22032"},"Education:{\"uuid\":\"e225285a-051c-4525-a841-acc38ee2126e\"}":{"__typename":"Education","uuid":"e225285a-051c-4525-a841-acc38ee2126e","school":{"__ref":"School:{\"uuid\":\"4627bbce-029c-47bc-88f3-706270169734\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"6ade10a5-5326-4a02-b41b-50dd860384db\"}":{"__typename":"Education","uuid":"6ade10a5-5326-4a02-b41b-50dd860384db","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science and Behavioral Decision Sciences","degree":null},"MentorPublicProfile:{\"uuid\":\"c1581433-74cf-4970-a76b-33d585e13b12\"}":{"__typename":"MentorPublicProfile","uuid":"c1581433-74cf-4970-a76b-33d585e13b12","displayName":"Karsten A.","slug":"karsten-assoua-1","biography":"\u003cp\u003eHi! I'm Karsten, I'm a junior at Brown University and my life's work has been teaching and mentoring students. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have studied the \"how\" of learning and growth for ~8 years. \u003c/p\u003e\u003cp\u003eThe way I approach it, everyone has their own special abilities, passions, and strengths. By uncovering and nurturing them, I believe everyone become all they can be and thus get anywhere they want to go.\u003c/p\u003e\u003cp\u003eBut it's not easy to do it alone. Which is why I'm here! I can't wait to learn with you and build something that you're proud of. We'll look and find your North Star, and I'll do my best to light the way there.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically I live at the intersection of computer science, business, psychology, philosophy, and sociology. \u003c/p\u003e\u003cp\u003eI enjoy logic, mathematics, and theoretical computer science, but a lot of my work extends towards the cutting edge of artificial intelligence, marketing and product design, and user research. \u003c/p\u003e\u003cbr\u003e\u003cp\u003ePsychology and sociology are also deep interests of mine, and I am currently the technical lead at Brown University's Mind and Morality Lab. In the Mind and Morality Lab I study how kids learn and grow and develop their moral ideas about the world. Not only has my research has given me a deep grasp of psychology and moral philosophy, but because I primarily employ technology in my work, I've also come to be quite experienced in artificial intelligence and software engineering. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love people and I love building things to make their lives easier. In the same vein I enjoy building and playing games and puzzles. I have designed and developed more games than I can count over my lifetime, all over diverse platforms and media. As such I also have a pretty wide breadth of technical expertise - whether it's building Python, Java, C#, or designing with HTML/CSS and Javascript. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eFor hobbies, I'm an artist at heart so I love painting, reading, writing, singing, musicals, playing piano - you name it - in my downtime. I have received assorted state awards for my art and graphic design. \u003cbr\u003e\u003cbr\u003eI also enjoy playing and watching basketball, running and lifting weights.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI come from a family where my parents have seven degrees between them, so I naturally fell into higher education. Only when I arrived in that world of higher education did I realize that education not something you acquire, but something you cultivate. That's why I love being a student mentor so much; I get to witness and nurture that in others.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs I said before, I can't wait to learn and grow with you. See you soon!\u003c/p\u003e","teachingVideoPlaybackId":"uCATa676BySkHvFbDDH00U4ITT3MXAalvBvwKTBcg00X00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science and Behavioral Decision Sciences","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"ce87e127-5cff-4e9d-8cd3-7b6d6d62544c\"}"},{"__ref":"DeepDives:{\"uuid\":\"01b1f8fb-6dd0-4d53-b9e4-3ea9457c3ade\"}"},{"__ref":"DeepDives:{\"uuid\":\"213e4d34-3d33-4e17-a9e6-9caf20b4a253\"}"},{"__ref":"DeepDives:{\"uuid\":\"ecd76969-724c-457b-82aa-028231720cfc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5ba11bcb-0c5c-42c7-aa4b-4a244f7e934d/-/preview/-/format/jpg/","https://ucarecdn.com/038f883d-ce31-4dea-a778-c6ff66d280a2/-/preview/-/format/jpg/","https://ucarecdn.com/b8bc0bcf-8627-4233-a08a-75fcacf6b924/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"e225285a-051c-4525-a841-acc38ee2126e\"}"},{"__ref":"Education:{\"uuid\":\"6ade10a5-5326-4a02-b41b-50dd860384db\"}"}],"hiredAt":"2026-01-16T15:31:17.821Z","topics":["College Essay Writing","Computer Science","Visual Arts / Graphic Design","Business / Entrepreneurship","Coding / Programming","Game Design","Machine Learning / AI","STEM Project","Web Design"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"karsten-assoua-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"c1581433-74cf-4970-a76b-33d585e13b12\"}"}}},"_sentryTraceData":"2c886ed136f74f8592c9d339a67b0aff-be58c33c70ab67c3-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=2c886ed136f74f8592c9d339a67b0aff,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"karsten-assoua-1"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dat
