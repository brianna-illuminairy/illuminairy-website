xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"d079abe1-93dc-4893-a58b-ee00fa3b4b0e\"}":{"__typename":"Favorites","uuid":"d079abe1-93dc-4893-a58b-ee00fa3b4b0e","photoUrl":"https://ucarecdn.com/0c6e6f80-1194-4ba4-9070-0612797537aa/","title":"Jimmy Butler","type":"ATHLETE"},"Favorites:{\"uuid\":\"62372dd5-9ef6-40a9-80f2-332b295c2565\"}":{"__typename":"Favorites","uuid":"62372dd5-9ef6-40a9-80f2-332b295c2565","photoUrl":"https://ucarecdn.com/c35c0400-19de-4a74-ab43-1479d83d4c26/","title":"Baltimore Ravens","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"0af15754-a15e-4cca-a01c-d9e7a34a73e5\"}":{"__typename":"Favorites","uuid":"0af15754-a15e-4cca-a01c-d9e7a34a73e5","photoUrl":"https://ucarecdn.com/b787dfe3-4bdc-4cf5-9281-53b65577278f/","title":"Fortnite","type":"GAME"},"CausesSupported:{\"uuid\":\"b7fae6b8-ab51-409a-8cd7-984620ef416d\"}":{"__typename":"CausesSupported","uuid":"b7fae6b8-ab51-409a-8cd7-984620ef416d","name":"Horizon Day Camp","description":"\u003cp\u003eI work as a counselor at Horizon Day camp, a summer camp for kids with cancer. \u003c/p\u003e","photoUrl":"https://ucarecdn.com/9c5f6a0e-337d-4e5c-8c39-c1396e984ae1/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c12cf53c-3a49-4f10-93f8-0664f32ff08d\"}":{"__typename":"DeepDives","uuid":"c12cf53c-3a49-4f10-93f8-0664f32ff08d","content":"\u003cp\u003eMy dream job is a trauma surgeon. Trauma surgeons meet people on the worst day of their life, after suffering a terrible accident or a regrettable mistake. These people need hope, need confidence, and need to feel seen. As a trauma surgeon, I hope to be that person for them. I hope to help heal them, fix their injuries, and send them walking out of my hospital as good as new, allowing them to put that terrible day in their past and look towards their future. I think the ability to heal is a magical thing and a privilege to hold. The more I learn about medicine, the more I learn to love it, and I aspire to one day impart that love onto others.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"1b24a1ed-0382-4955-8dd9-5d87f89cc1ef\"}":{"__typename":"DeepDives","uuid":"1b24a1ed-0382-4955-8dd9-5d87f89cc1ef","content":"\u003cp\u003eMy greatest source of motivation comes from within. Since a very young age, I’ve felt an innate desire to succeed, thrive, and use my gifts to help others. I’ve always been competitive, and I never allow myself to fall behind, because I know it would be a shame to allow the opportunities I’ve been given go to waste. My desire to help others pushes me to study harder and commit fully to my future in medicine, because I feel that I owe it to the world to make a difference and do my part to make it a safer, healthier, and better place.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"cdeb2929-c3ae-4f2f-8fca-474869a0fc46\"}":{"__typename":"DeepDives","uuid":"cdeb2929-c3ae-4f2f-8fca-474869a0fc46","content":"\u003cp\u003eI’ve had the immense privilege of having some incredible mentors in my life thus far, and they have inspired me to continue that chain of good. I know firsthand the invaluable effect that a strong, compassionate mentor can have, helping to nurture a child not only in their mind but also in their character. I have my mentors to thank for my morals, my knowledge, and my success. I hope to impart the same onto my mentees, lending a helping hand, guiding them through life’s challenges, and nurturing their curiosity and budding personality.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"33f4d9cc-529a-40c2-9ae1-95c9662a5c59\"}":{"__typename":"DeepDives","uuid":"33f4d9cc-529a-40c2-9ae1-95c9662a5c59","content":"\u003cp\u003eI’ve always loved sports. In high school, I played soccer, basketball, lacrosse, and I ran track and field. Since coming to college, I’ve picked up the sport of rugby, where I’ve found lifelong friendships and unmatched brotherhood. Apart from athletics, I love playing video games and reading. My favorite games are Fallout 4, Fortnite, and Elden Ring, and my favorite books are the Red Rising series. I love fictional escapes to let my mind wander in a fantasy world. Finally, I spend the rest of my time volunteering, either as an EMT, as a member of the Red Cross, helping out at local hospitals, or as a camp counselor. All these things help me to stay de-stressed and enjoy life’s little pleasures.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"492edc9f-26e2-4722-806e-d96b523b3369\"}":{"__typename":"School","uuid":"492edc9f-26e2-4722-806e-d96b523b3369","name":"Gilman School","city":"Baltimore","type":"HIGH","state":"Maryland","country":"United States","zip":"21210"},"Education:{\"uuid\":\"89054c90-ccfb-49ca-b853-414f8c88945b\"}":{"__typename":"Education","uuid":"89054c90-ccfb-49ca-b853-414f8c88945b","school":{"__ref":"School:{\"uuid\":\"492edc9f-26e2-4722-806e-d96b523b3369\"}"},"startYear":"2010","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"295ec5e4-cb38-4de3-8f77-ae31fd9fed02\"}":{"__typename":"Education","uuid":"295ec5e4-cb38-4de3-8f77-ae31fd9fed02","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Molecular, Cellular, and Developmental Biology","degree":null},"Testimonial:d3ffc32b-c11f-40d3-aee9-f1b5c88c0c37":{"__typename":"Testimonial","id":"d3ffc32b-c11f-40d3-aee9-f1b5c88c0c37","text":"Declan is an impressive young man who has demonstrated organization, patience and professionalism beyond his years while working with our son on his research. I’m not quite sure Declan understands the difference he has made in our son’s life, but he and everyone should know he has helped change Brandon for life! Setting him on the right path towards research that has real life implications in an attempt to make this world a better place! Declan is an amazing mentor and I only see good things happening for him in his own professional life!","date":"2025-08-24 12:53:08.845+00","rating":5,"endorser":{"__typename":"Endorser","name":"Jennifer Delos Santos","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"8f478cbd-71f0-4cbf-80f3-2da33c34c6f5\"}":{"__typename":"MentorPublicProfile","uuid":"8f478cbd-71f0-4cbf-80f3-2da33c34c6f5","displayName":"Declan R.","slug":"declan-ratchford","biography":"\u003cp\u003eHi! I’m Declan, a first-year undergraduate at Yale University. I’m pursuing a Bachelor’s Degree in Molecular, Cellular, and Developmental Biology along with a Certificate in Advanced Spanish Language. I’m especially fascinated by biology and chemistry, but I also love studying math, Spanish, and just learning in general!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m from Baltimore, MD, and outside of school I have a passion for medicine, sports, and cooking. In my free time I play for Yale’s Club Rugby team, and I love cooking and baking with my family. I work as a camp counselor at a nearby summer camp for children with cancer, teaching them sports and helping to brighten their lives. I’m also a volunteer EMT at my local fire station and an active member of the American Red Cross, and I’m always looking for more volunteer work to give back and make a difference in my community.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI hope to become a trauma surgeon when I’m older, so I can help others in a time of need. I’m planning to work in a xenotransplantation lab this upcoming summer (studying how to transplant life-saving pig organs into humans?!), deepen my knowledge as an EMT with Yale’s student-run ambulance service, and continue to foster my love of medicine as I binge every new medical TV show as soon as it drops (“The Pitt” most recently).\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI hope to bring energy, enthusiasm, and a passion for learning to my sessions, because I believe that being committed and interested in the subject matter is critical to any type of learning. Through personal experience and foundational research, I’ll come prepared with knowledge and an open mind. I strive to hear your voice and incorporate it into our lessons, so that this partnership is a team effort rather than a one-way street. See you soon!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"4onu9TZxMhQDyKAHwsQjdDN92X01NCCHM9fuQLxz302SM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI am super proud of my acceptance to Yale University. It felt like a culmination of all the work and effort I had put in over the years, and it felt incredible to open that acceptance video. I'm also proud of this because I know it will afford me a platform to use for the rest of my life to make positive change in the world and help those around me. \u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"d079abe1-93dc-4893-a58b-ee00fa3b4b0e\"}"},{"__ref":"Favorites:{\"uuid\":\"62372dd5-9ef6-40a9-80f2-332b295c2565\"}"},{"__ref":"Favorites:{\"uuid\":\"0af15754-a15e-4cca-a01c-d9e7a34a73e5\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b7fae6b8-ab51-409a-8cd7-984620ef416d\"}"}],"major":"Molecular, Cellular, and Developmental Biology","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c12cf53c-3a49-4f10-93f8-0664f32ff08d\"}"},{"__ref":"DeepDives:{\"uuid\":\"1b24a1ed-0382-4955-8dd9-5d87f89cc1ef\"}"},{"__ref":"DeepDives:{\"uuid\":\"cdeb2929-c3ae-4f2f-8fca-474869a0fc46\"}"},{"__ref":"DeepDives:{\"uuid\":\"33f4d9cc-529a-40c2-9ae1-95c9662a5c59\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f461e807-1217-42d8-9437-530176f65121/-/preview/-/format/jpg/","https://ucarecdn.com/1c755176-e2de-4274-b215-4f2c3b3300df/-/preview/-/format/jpg/","https://ucarecdn.com/536f7763-3b60-410a-ab27-620407034751/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"89054c90-ccfb-49ca-b853-414f8c88945b\"}"},{"__ref":"Education:{\"uuid\":\"295ec5e4-cb38-4de3-8f77-ae31fd9fed02\"}"}],"hiredAt":"2025-04-21T12:02:24.671Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Calculus","Precalculus / Trigonometry","Geometry","Statistics","Biology","Chemistry","6-8 Grade Science","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","Medicine / Health","STEM Project"],"communityBadges":["https://ucarecdn.co
