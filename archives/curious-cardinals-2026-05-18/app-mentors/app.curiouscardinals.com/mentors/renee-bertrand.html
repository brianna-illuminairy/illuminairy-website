rship matter to you?"},"DeepDives:{\"uuid\":\"a9442c8b-2fd6-46fd-bf52-752addcde66f\"}":{"__typename":"DeepDives","uuid":"a9442c8b-2fd6-46fd-bf52-752addcde66f","content":null,"videoPlaybackId":"LAayTiwI02Au53wlaUPfd00f02AbKW02Rb00MwEp71XnkybA","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"76c5b3dd-9c82-454d-956d-86bd3a6467ae\"}":{"__typename":"DeepDives","uuid":"76c5b3dd-9c82-454d-956d-86bd3a6467ae","content":null,"videoPlaybackId":"SUfnGbNWyXkQBinE00WLAwjyv01kgcpMQrCcyR02QevKSc","question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"04c435c4-2c1e-4948-af92-6889e80f6c19\"}":{"__typename":"DeepDives","uuid":"04c435c4-2c1e-4948-af92-6889e80f6c19","content":null,"videoPlaybackId":"H02n5bt8ykT11Xo8K6oxuRu02IT4TmPzSZpKjdSmNtaco","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}":{"__typename":"School","uuid":"62e59c56-ee46-4213-b082-758af3ff99db","name":"Phillips Exeter Academy","city":"Exeter","type":"HIGH","state":"New Hampshire","country":"United States","zip":"03833"},"Education:{\"uuid\":\"acb3e131-e430-4dce-8c19-ee3af12991fa\"}":{"__typename":"Education","uuid":"acb3e131-e430-4dce-8c19-ee3af12991fa","school":{"__ref":"School:{\"uuid\":\"62e59c56-ee46-4213-b082-758af3ff99db\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"dc7c6135-dfb3-4e3b-ad7f-23e9797a5e3e\"}":{"__typename":"Education","uuid":"dc7c6135-dfb3-4e3b-ad7f-23e9797a5e3e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"International Relations and Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"26bbb668-a09c-4132-a317-285b101bd7a9\"}":{"__typename":"MentorPublicProfile","uuid":"26bbb668-a09c-4132-a317-285b101bd7a9","displayName":"Renee Marie B.","slug":"renee-bertrand","biography":"\u003cp\u003eHi! I’m Renee Bertrand, a Caribbean-American rising junior at Stanford University majoring in International Relations and Economics and minoring in Earth Systems Sustainability. I am an award-winning and published researcher and writer, and am so excited to be a mentor with Curious Cardinals!\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI love to write, both creatively and academically, and am passionate about sharing my love of writing with others. In addition to being a Curious Cardinals mentor, I am a writing tutor at Stanford’s Hume Center for Writing and Speaking where I tutor undergraduates in academic, research, and application writing. I have thorough experience writing research papers. I currently conduct a literature review for an investment research center at Stanford. Last summer I received Stanford research funding to write a 50-page white paper on the lack of financing for climate disasters in the Caribbean region. I love finding niche topics that aren’t being reported on. For example, I recently wrote a piece about the lack of recognition of the origins of surfing in coastal West Africa and its ramifications for Black representation in predominantly White sports.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have a wealth of experience in designing and executing community service projects. In high school, I led two children’s focused community service groups. The first offered free soccer lessons to kids, and the second paired local children with high school mentors based on background, identity, and interests. To run these groups, I researched, contacted, and developed programming with local community-based organizations. I would be excited to mentor a student in developing a project that partners with a local or national organization. I deeply understand the steps to get a community service project off the ground and am happy to help a student navigate that process.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also passionate about world history, international relations, and development economics. The year before starting Stanford, I won a fully-funded travel and research fellowship. I self-designed a gap year researching the impact of globalization and colonization on Indigenous societies. I traveled to West Africa and Polynesia for six months to study non-Western development economics, Indigenous Politics, and pre-contact Native land systems with Indigenous professors.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAs a Curious Cardinals mentor, I hope to supply students with the tools and knowledge to confidently and effectively achieve their goals. I believe every session should be student-centered, with the mentor offering support, guidance, and direction. I promise to enter every engagement with kindness, warmth, and openness. I am excited to learn alongside your child and vehemently believe in young people’s power as thinkers and doers.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my spare time, I love to surf, hike, and volunteer at our local organic farm. I am also a proud member and financial officer of Stanford’s Women’s Rugby Team. Go Card!\u003c/p\u003e","teachingVideoPlaybackId":"LqPJt39dOOKJjRjZ2xfH63DmyPKTaCA5nTQ8I8W8yXc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI won the Scholastic Art and Writing Awards National Silver Medal and Scholarship for my senior-year collection of creative nonfiction and poetry. Two of my pieces were published in Scholastic's\u003cem\u003e Best Teen Writing 2021.\u003c/em\u003e\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"49d0c638-e785-4c90-8cbb-7ca82754be37\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"c11d0a77-a044-4f3f-8867-5069560a8197\"}"},{"__ref":"CausesSupported:{\"uuid\":\"f0c97815-f793-4571-bb6f-7a202c3feb4f\"}"}],"major":"International Relations and Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c1e2f294-5c66-4ee8-a589-961069833583\"}"},{"__ref":"DeepDives:{\"uuid\":\"a9442c8b-2fd6-46fd-bf52-752addcde66f\"}"},{"__ref":"DeepDives:{\"uuid\":\"76c5b3dd-9c82-454d-956d-86bd3a6467ae\"}"},{"__ref":"DeepDives:{\"uuid\":\"04c435c4-2c1e-4948-af92-6889e80f6c19\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/c9b81523-a2bd-4dc3-8ad0-44d77baed39e/-/preview/-/format/jpg/","https://ucarecdn.com/a675db01-e36b-4ec7-ad9f-63fbdd8a8a39/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"acb3e131-e430-4dce-8c19-ee3af12991fa\"}"},{"__ref":"Education:{\"uuid\":\"dc7c6135-dfb3-4e3b-ad7f-23e9797a5e3e\"}"}],"hiredAt":"2024-08-06T00:29:00.482Z","topics":["Finance / Investing","History Project","Writing","College Essay Writing","Economics","6-8 Grade Science","French","Creative Writing","World Cultures","Sustainability","Race \u0026 Ethnicity","History","STEM Project"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"renee-bertrand\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"26bbb668-a09c-4132-a317-285b101bd7a9\
