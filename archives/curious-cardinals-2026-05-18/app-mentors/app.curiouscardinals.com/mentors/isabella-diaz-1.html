xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"30202e7f-3b0c-4caf-9278-e43f92f4c09d\"}":{"__typename":"Favorites","uuid":"30202e7f-3b0c-4caf-9278-e43f92f4c09d","photoUrl":"https://ucarecdn.com/3819e281-647d-4c8d-af79-3e5375c94f76/","title":"Barcelona","type":"CITY"},"Favorites:{\"uuid\":\"fb570a99-b943-4a90-921a-03bd95a76c97\"}":{"__typename":"Favorites","uuid":"fb570a99-b943-4a90-921a-03bd95a76c97","photoUrl":"https://ucarecdn.com/d8f8111b-92ee-40c6-bd9f-d69e49b2e95e/","title":"Golf","type":"SPORT"},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"de184d89-4489-4edf-9021-5450cdb8571a\"}":{"__typename":"DeepDives","uuid":"de184d89-4489-4edf-9021-5450cdb8571a","content":"\u003cp\u003eMy mom!! My mom has been a single parent my entire life and has worked incredibly hard to give me the opportunities I have today. She’s dedicated, loving, fierce, determined, and so inspiring. She’s always encouraged me to follow my passions, and her support for my love of learning means the world to me. Making her proud drives me to accomplish so much– and she’s especially proud that I’m a mentor now!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"942d38c0-00ff-419b-b311-fbdea0172001\"}":{"__typename":"DeepDives","uuid":"942d38c0-00ff-419b-b311-fbdea0172001","content":"\u003cp\u003eI climbed Machu Picchu and it changed my life. I was so nervous for the trip and it was the first time I had planned a trip like this. I went with just one of my friends and I realized just how much I am capable of. The trip taught me that I am stronger, more independent, and more resilient than I thought. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"92a8b80b-4ea1-4d7d-9d63-91bbd618c4e7\"}":{"__typename":"DeepDives","uuid":"92a8b80b-4ea1-4d7d-9d63-91bbd618c4e7","content":"\u003cp\u003eI am obsessed with understanding why people do what they do. How siblings in the same home can grow up to be completely different. Why some people make choices i'd never make, and why others are baffled by choices of my own. I think it's so cool! That's why I chose Human Development and now I love the study even more when you think about it in the context of crime and the law. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"de4b4e62-ed0c-47cf-bbab-9fa121e5d146\"}":{"__typename":"DeepDives","uuid":"de4b4e62-ed0c-47cf-bbab-9fa121e5d146","content":"\u003cp\u003eNo one cares about you that much. It my sound intense, but as I get older, I see just how little others are thinking about you. In school I was always so caught up in what people thought about me, what they were thinking when I made a mistake, what they were saying about me, etc. In reality, everyone has the same fears. We all tend to be more focused on ourselves than others. That has been the most freeing advice I have ever received. Life is meant to be lived with enthusiastically and authentically; never let the \u003cem\u003epotential\u003c/em\u003e thoughts of others get in the way of that!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"d993d7a0-6526-4de3-892a-c04a6201ea2f\"}":{"__typename":"School","uuid":"d993d7a0-6526-4de3-892a-c04a6201ea2f","name":"Kent Place School","city":"Summit","type":"HIGH","state":"New Jersey","country":"United States","zip":"07902"},"Education:{\"uuid\":\"a14f1bba-ac66-42e4-9dc1-7bd772e8da8e\"}":{"__typename":"Education","uuid":"a14f1bba-ac66-42e4-9dc1-7bd772e8da8e","school":{"__ref":"School:{\"uuid\":\"d993d7a0-6526-4de3-892a-c04a6201ea2f\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"366c6a33-9afb-437f-aa9d-30d5719c8f44\"}":{"__typename":"Education","uuid":"366c6a33-9afb-437f-aa9d-30d5719c8f44","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2024","major":"Human Development","degree":null},"MentorPublicProfile:{\"uuid\":\"c963367c-fdb0-4c56-b357-bc8693719f67\"}":{"__typename":"MentorPublicProfile","uuid":"c963367c-fdb0-4c56-b357-bc8693719f67","displayName":"Isabella D.","slug":"isabella-diaz-1","biography":"\u003cp\u003eHi! My name is Isabella, and I am a recent honors graduate of Cornell University. At Cornell, I majored in Human Development with two minors in Inequality Studies and Law \u0026amp; Society. I have been in the workforce for about a year working as a paralegal in the in-house council space and I will be attending law school this August. \u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I first started college, I wasn’t sure which career path to follow. I just knew I wanted to help people. That desire has been a constant throughout my life, and through my studies and experiences at Cornell, I’ve discovered that pursuing law is one way for me to do that. Curious Cardinals is another.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOver my schooling years, I’ve had a broad array of interests and experiences. In high school, I identified as a mathematician and a scientist. In college, I developed a deep passion for understanding human behavior. By the end of my undergraduate studies, I fell in love with the law. Some of my favorite experiences include conducting research on eyewitness susceptibility in children, volunteering at a preschool to support young learners, and helping individuals convicted of crimes clear their records.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen it comes to tutoring, my approach is rooted in understanding the unique needs and interests of each student. I believe the best mentorship starts with getting to know my mentees as people before so I can help them most effectively in their work. As someone whose interests wander, I aim to make every session interactive, engaging, and tailored to the student. I understand how different subjects can peak our interests at any given moment, so I am happy to go with the flow and let the student explore their ideas as they desire.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, I love to travel! To me, traveling is the best way to learn about your world, the people you share it with, and who you are in it. My favorite trips have been climbing Machu Picchu in Peru, eating pasta in Rome, watching football games in Iceland, and of course, listening to spanish music in Puerto Rico (as a Puerto Rican I am biased). My next trip will be exploring the jungles of Costa Rica in June!\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether we’re tackling tricky concepts or exploring what excites you most, I’m here to make learning an enjoyable and meaningful experience. I can’t wait to meet you and help you achieve your goals!!\u003c/p\u003e","teachingVideoPlaybackId":"CbXUSwLnIDhg02XzQzYoIsA302Hx1O21A2QIlOOJO82XM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"30202e7f-3b0c-4caf-9278-e43f92f4c09d\"}"},{"__ref":"Favorites:{\"uuid\":\"fb570a99-b943-4a90-921a-03bd95a76c97\"}"}],"causesSupported":[],"major":"Human Development","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"de184d89-4489-4edf-9021-5450cdb8571a\"}"},{"__ref":"DeepDives:{\"uuid\":\"942d38c0-00ff-419b-b311-fbdea0172001\"}"},{"__ref":"DeepDives:{\"uuid\":\"92a8b80b-4ea1-4d7d-9d63-91bbd618c4e7\"}"},{"__ref":"DeepDives:{\"uuid\":\"de4b4e62-ed0c-47cf-bbab-9fa121e5d146\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b4e200b1-184c-4ded-b425-70d1d7e03392/-/preview/-/format/jpg/","https://ucarecdn.com/e0f51940-725d-49a0-a64c-4343530eb3fb/-/preview/-/format/jpg/","https://ucarecdn.com/50b00a4a-9b3e-4e73-ad23-d58dd580ed6f/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"a14f1bba-ac66-42e4-9dc1-7bd772e8da8e\"}"},{"__ref":"Education:{\"uuid\":\"366c6a33-9afb-437f-aa9d-30d5719c8f44\"}"}],"hiredAt":"2025-01-25T01:18:04.515Z","topics":["Music","Film / Theater","Literature","Cooking","Women \u0026 Gender Studies","Law / Government / Policy","Race \u0026 Ethnicity","Public Speaking","K-5 Grade Math","Pre-Algebra","Writing","Spanish","Creative Writing","Algebra I","Algebra II","6-8 Grade Science"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"isabella-diaz-1\"}})":{"__ref":"MentorPubl
