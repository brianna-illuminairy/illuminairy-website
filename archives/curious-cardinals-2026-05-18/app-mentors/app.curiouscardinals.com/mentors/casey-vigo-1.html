xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"55df2439-32cb-4ea2-a654-681256b6c12e\"}":{"__typename":"Favorites","uuid":"55df2439-32cb-4ea2-a654-681256b6c12e","photoUrl":"https://ucarecdn.com/a24056b3-5bb5-4c9e-ad97-bea3cd5a2485/","title":"Michigan Football","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"fd87482b-496d-43ec-9943-21df95386824\"}":{"__typename":"Favorites","uuid":"fd87482b-496d-43ec-9943-21df95386824","photoUrl":"https://ucarecdn.com/312f6af4-3700-4041-b8b2-58e50e41a194/","title":"Madrid, Spain","type":"CITY"},"Favorites:{\"uuid\":\"438311ed-71a7-4356-ac50-63585c71b611\"}":{"__typename":"Favorites","uuid":"438311ed-71a7-4356-ac50-63585c71b611","photoUrl":"https://ucarecdn.com/221dac75-af47-4827-aa26-d8931fb36a2c/","title":"Alex Morgan","type":"ATHLETE"},"CausesSupported:{\"uuid\":\"0fe5a6f6-89c1-44ed-b004-70ad630a3db0\"}":{"__typename":"CausesSupported","uuid":"0fe5a6f6-89c1-44ed-b004-70ad630a3db0","name":"ChadTough Defeat DIPG Foundation","description":"\u003cp\u003eHonor my cousin Chad by volunteering with ChadTough events and fundraisers\u003c/p\u003e","photoUrl":"https://ucarecdn.com/d595aa9d-22da-4d6f-9952-8164005935d2/"},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"5707f0cc-b38d-4548-a89e-4482c96b4068\"}":{"__typename":"DeepDives","uuid":"5707f0cc-b38d-4548-a89e-4482c96b4068","content":"\u003cp\u003eIn my spare time, I love staying active and connected. I play club soccer at the University of Michigan, volunteer in my community, and make time to work out, which helps me stay focused and energized. I also enjoy traveling, reading, and spending quality time with friends and family — whether that’s exploring new places, relaxing with a good book, or just catching up with the people I care about most. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"c36c6d5c-508b-42b2-b9f4-130e5734f0a0\"}":{"__typename":"DeepDives","uuid":"c36c6d5c-508b-42b2-b9f4-130e5734f0a0","content":"\u003cp\u003eDuring my summers in high school, I spent a lot of time up north in Michigan at the lakes, playing soccer, working, and spending time with friends. I also traveled to Florida with my family and made memories with the people closest to me.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"dee206a2-33cc-4d21-8307-c51a15d5a826\"}":{"__typename":"DeepDives","uuid":"dee206a2-33cc-4d21-8307-c51a15d5a826","content":"\u003cp\u003eMy greatest role model and mentor is my mom. She has always led by example — showing me the importance of hard work, kindness, and staying grounded. Watching how she balances responsibility, care for others, and perseverance has shaped how I approach school, work, and mentoring, and she continues to inspire me to be the best version of myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"40f3199b-c51e-4949-9788-1ae8bf104993\"}":{"__typename":"DeepDives","uuid":"40f3199b-c51e-4949-9788-1ae8bf104993","content":"\u003cp\u003eOut of everything I could be doing, I choose mentorship because I genuinely believe in the impact one supportive person can have on someone’s confidence and growth. I know how overwhelming school and personal goals can feel without guidance, and I want to be the person who helps make those challenges feel manageable and encouraging. Mentorship allows me to combine my passion for communication and learning with my desire to support others — helping students feel heard, capable, and proud of what they’re working toward.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"School:{\"uuid\":\"9d5c7df7-ea40-459f-97f2-409cb13272dc\"}":{"__typename":"School","uuid":"9d5c7df7-ea40-459f-97f2-409cb13272dc","name":"Skyline High School","city":"Ann Arbor","type":"HIGH","state":"Michigan","country":"United States","zip":"48103"},"Education:{\"uuid\":\"9bab56ee-738d-49e0-b2aa-68c88431830a\"}":{"__typename":"Education","uuid":"9bab56ee-738d-49e0-b2aa-68c88431830a","school":{"__ref":"School:{\"uuid\":\"9d5c7df7-ea40-459f-97f2-409cb13272dc\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}":{"__typename":"School","uuid":"9a91466f-187b-4e9b-8a98-c02cef7bf621","name":"University of Michigan","city":"Ann Arbor","type":"COLLEGE","state":"Michigan","country":"United States","zip":"48109"},"Education:{\"uuid\":\"92fa0e70-769d-4fc7-9119-9a8b270f7496\"}":{"__typename":"Education","uuid":"92fa0e70-769d-4fc7-9119-9a8b270f7496","school":{"__ref":"School:{\"uuid\":\"9a91466f-187b-4e9b-8a98-c02cef7bf621\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Communication and Media | Minor in Real Estate","degree":null},"MentorPublicProfile:{\"uuid\":\"54f2f92e-c679-4278-b57e-d8bb6312c19c\"}":{"__typename":"MentorPublicProfile","uuid":"54f2f92e-c679-4278-b57e-d8bb6312c19c","displayName":"Casey V.","slug":"casey-vigo-1","biography":"\u003cp\u003eHi! I’m Casey Vigo, a Communications and Media student at the University of Michigan with a passion for creative communication, mentorship, and helping young people find confidence in their ideas and voices.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat drives me is making learning approachable, empowering, and meaningful. I know that students thrive when they feel supported, understood, and genuinely excited about what they’re working on. Whether a student is tackling an academic challenge, building a passion project, or gaining confidence, I meet them where they are and help them grow step by step.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAcademically, I focus on communication, media, and storytelling — exploring how ideas are shared through writing, visuals, branding, and digital platforms. I’m especially interested in marketing, media analysis, and creative strategy, and I enjoy helping students think critically while expressing themselves creatively. I’m also minoring in Real Estate.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside the classroom, I work in marketing and leasing, applying communication skills in real-world professional settings. Studying abroad has further expanded my perspective on culture, media, and communication, experiences I draw on to help students think globally and creatively.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of the most meaningful parts of my background is my work with ByKids4Kids, a student-led nonprofit focused on peer mentorship and youth empowerment. Through this, I’ve guided younger students in building confidence, developing skills, and feeling supported in both academic and personal growth. These experiences shaped my patient and encouraging mentorship style.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also play club soccer at the University of Michigan, where I serve as treasurer. Being part of the team has strengthened my collaboration, leadership, and time-management skills, and I bring that same dedication and teamwork mindset to tutoring.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn sessions, students can expect a calm, positive, and structured environment. I break down big tasks into manageable steps, explain concepts clearly, and encourage questions and creativity. I view mistakes as part of learning and aim to make students feel comfortable trying, learning, and improving.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of tutoring, I enjoy traveling, interior design, fitness, and exploring new creative outlets. I genuinely enjoy connecting with people and strive to be both a reliable mentor parents trust and a relatable tutor students enjoy working with.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m excited to support students as they build skills, confidence, and projects they’re proud of — and I’d love to be part of their learning journey.\u003c/p\u003e","teachingVideoPlaybackId":"bcUbD2vLGavehTo6lejsC2ZOwlattXw5u00shN85Pxyc","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the things I’m most proud of is giving a TEDx Youth talk in high school about a nonprofit I helped found and run called ByKids4Kids. We are a community-based organization focused on helping make the world around us a better, happier place, and I spoke about the projects we led and the impact we made on our local community. Sharing our mission on that stage and seeing the audience respond to our work was incredibly rewarding—it showed me that even as a young person, I could inspire change and bring people together for a positive cause.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"55df2439-32cb-4ea2-a654-681256b6c12e\"}"},{"__ref":"Favorites:{\"uuid\":\"fd87482b-496d-43ec-9943-21df95386824\"}"},{"__ref":"Favorites:{\"uuid\":\"438311ed-71a7-4356-ac50-63585c71b611\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"0fe5a6f6-89c1-44ed-b004-70ad630a3db0\"}"}],"major":"Communication and Media | Minor in Real Estate","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5707f0cc-b38d-4548-a89e-4482c96b4068\"}"},{"__ref":"DeepDives:{\"uuid\":\"c36c6d5c-508b-42b2-b9f4-130e5734f0a0\"}"},{"__ref":"DeepDives:{\"uuid\":\"dee206a2-33cc-4d21-8307-c51a15d5a826\"}"},{"__ref":"DeepDives:{\"uuid\":\"40f3199b-c51e-4949-9788-1ae8bf104993\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b5c3ce2a-6fd9-447f-a46a-7476966719f0/-/preview/-/format/jpg/","https://ucarecdn.com/ff9f2f13-2ddb-4c41-ba94-f2d21be7abd1/-/preview/-/format/jpg/","https://ucarecdn.com/70e4c0fd-ca1e-4153-904d-0f45ba7e79c6/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"9bab56ee-738d-49e0-b2aa-68c88431830a\"}"},{"__ref":"Education:{\"uuid\":\"92fa0e70-769d-4fc7-9119-9a8b270f7496\"}"}],"hiredAt":"2026-02-18T18:33:22.601Z","topics":["Writing","College Essay Writing","Reading","History","Creative Writing","Fashion / Cosmetics","Visual Arts / Graphic Design","History Project","Business / Entrepreneurship","Public Speaking","Journalism"],"communityBadges":["https://ucarecdn.com/bc931f8b-f00f-4064-8767-bece7541c20e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"casey-vigo-1\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"54f2f92e-c679-4278-b57e-d8bb6312c19c\"}"}}},"_sentryTraceData":"f34f339602ec4d51aea09202ad17ad3f-90a8a642f769ebf8-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=f34f339602ec4d51aea09202ad17ad3f,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug
