xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"4eee75db-be8f-4aee-bc0b-61cfb737c5b0\"}":{"__typename":"Favorites","uuid":"4eee75db-be8f-4aee-bc0b-61cfb737c5b0","photoUrl":"https://ucarecdn.com/8a6622b1-cf0c-45f8-aa72-ac67525760fb/","title":"Washington DC","type":"CITY"},"Favorites:{\"uuid\":\"d46b9287-71ed-41ee-940b-fb8db004826e\"}":{"__typename":"Favorites","uuid":"d46b9287-71ed-41ee-940b-fb8db004826e","photoUrl":"https://ucarecdn.com/eec922c9-ae96-4ce5-ad3d-6ce63d6b74c3/","title":"The Sound of Music","type":"PLAY"},"Favorites:{\"uuid\":\"b5300ed8-4e7a-4186-89ad-16fffb165307\"}":{"__typename":"Favorites","uuid":"b5300ed8-4e7a-4186-89ad-16fffb165307","photoUrl":"https://ucarecdn.com/1e197bfc-9e7f-4279-b710-4e246e7907be/","title":"Hadji Murat by Leo Tolstoy","type":"BOOK"},"CausesSupported:{\"uuid\":\"b2ef910a-c960-4199-a3f6-7df526fa9c69\"}":{"__typename":"CausesSupported","uuid":"b2ef910a-c960-4199-a3f6-7df526fa9c69","name":"Dialekt Tutoring","description":"\u003cp\u003eTutoring immigrants for their GED/citizenship exams. \u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"40342e2b-9015-4af9-b074-1ef69c39af22\"}":{"__typename":"DeepDives","uuid":"40342e2b-9015-4af9-b074-1ef69c39af22","content":"\u003cp\u003eMy grandmother. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was raised by a feisty, blonde-haired woman with skin the texture of wrinkled leather and a Southern drawl thick with sweetness. My Grams adopted me when I was 4 years old and took care of me until I went off to college at 18. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eGrams was a pastor in the United Methodist Church for 20 years, working well into her 70s in order to provide for me. Despite being Buddhist, I grew up attending Church every Sunday to listen to her sermons. Listening to her preach, but more importantly through how she lived her life everyday, my Grams taught me the importance of faith (no matter what name you call your God), family, and hard work. Her compassion and drive inspire me everyday. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"School:{\"uuid\":\"3e1f8be0-cd5d-4cff-8200-86bd84143e0a\"}":{"__typename":"School","uuid":"3e1f8be0-cd5d-4cff-8200-86bd84143e0a","name":"West Springfield High School","city":"West Springfield","type":"HIGH","state":"Virginia","country":"United States","zip":"22152"},"Education:{\"uuid\":\"2194c45d-4eb8-4d6a-a492-267b7303b73f\"}":{"__typename":"Education","uuid":"2194c45d-4eb8-4d6a-a492-267b7303b73f","school":{"__ref":"School:{\"uuid\":\"3e1f8be0-cd5d-4cff-8200-86bd84143e0a\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"48716b0e-7976-407b-916a-cebd7ccfae1e\"}":{"__typename":"Education","uuid":"48716b0e-7976-407b-916a-cebd7ccfae1e","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"International Relations \u0026 Communications","degree":null},"MentorPublicProfile:{\"uuid\":\"ccc7b4da-d21c-4e8a-8486-10c303fae18a\"}":{"__typename":"MentorPublicProfile","uuid":"ccc7b4da-d21c-4e8a-8486-10c303fae18a","displayName":"Tenzin W.","slug":"tenzin-sangmo","biography":"\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHi y'all!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy name is Tenzin, and I'm an undergraduate at Stanford double majoring in International Relations and Communications. I'm also pursuing a minor in Spanish and an Honors Certificate in Democracy, Development, and Rule of Law.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI was born in a refugee settlement in northern India called Dharamsala but spent most of my childhood growing up in the American South (Alabama, Virginia, then Washington DC). Throughout high school, I worked multiple jobs and pursued several passion projects, including serving as a sound engineer for a punk-rock record label that produced for the Foo Fighters, raising over $10,000 for women's shelters in Washington DC, and funding my solo travels through 18 countries—all on a waitressing salary!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI am also a proud polyglot. I speak three languages fluently (English, Spanish, and Tibetan), have elementary proficiency in Hindi and am currently studying Arabic. Cross cultural communication is a passion of mine, especially as I work toward my goal of becoming a lawyer specializing in international human rights law.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAs a tutor, I love helping students build confidence in their abilities and develop learning strategies that work for them! Although I specialize in the humanities—covering subjects like history, language arts, and economics—I also love learning about and teaching topics such as statistics, environmental science, and sound engineering. My interests are interdisciplinary but all rooted in a commitment to curiosity, critical thinking, and effective communication.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"cDF4otOx2bXe2UC00yJXEiD00wKZf6TVicb1fw01iMVHgw","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eWhen I was 16, I founded a high school club called Spartans Against Human Trafficking. In addition to launching educational campaigns on sex trafficking in the local community, I raised over $10,000 in essential supplies for a women's shelter in Northern Virginia. Seeing the tangible impact of our efforts—providing resources to women in need and raising awareness about an urgent issue—made me incredibly proud. It showed me the power of grassroots activism and reinforced my commitment to advocacy and social change.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"4eee75db-be8f-4aee-bc0b-61cfb737c5b0\"}"},{"__ref":"Favorites:{\"uuid\":\"d46b9287-71ed-41ee-940b-fb8db004826e\"}"},{"__ref":"Favorites:{\"uuid\":\"b5300ed8-4e7a-4186-89ad-16fffb165307\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"b2ef910a-c960-4199-a3f6-7df526fa9c69\"}"}],"major":"International Relations \u0026 Communications","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"40342e2b-9015-4af9-b074-1ef69c39af22\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/86d6511c-cdf7-4ca9-90bc-ad25a5bb93cb/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"2194c45d-4eb8-4d6a-a492-267b7303b73f\"}"},{"__ref":"Education:{\"uuid\":\"48716b0e-7976-407b-916a-cebd7ccfae1e\"}"}],"hiredAt":"2025-02-18T09:51:04.623Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Geometry","Statistics","6-8 Grade Science","Biology","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics"],"communityBadges":["https://ucarecdn.com/eb999e1d-fde6-49b8-98df-2249628f80b1/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"tenzin-sangmo\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ccc7b4da-d21c-4e8a-8486-10c303fae18a\"}"}}},"_sentryTraceData":"daa2abb17574408b96440a30d4513a7d-9e4
