xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"41f62322-7cfd-4740-9510-fa7e6fe55039\"}":{"__typename":"DeepDives","uuid":"41f62322-7cfd-4740-9510-fa7e6fe55039","content":"\u003cp\u003eWhat drives me academically is the pursuit of knowledge, the desire to dig deep and truly become an expert when I find a subject that interests me. This has translated into a passion for exploration outside of a school setting as I believe learning needs to come in many forms. Ultimately, I am motivated by my voracious appetite for learning, whether it’s Issac Asimov, Mayan History, or immersing myself in a new culture, I am always looking to expand my horizons.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}":{"__typename":"Question","uuid":"305694fb-6a34-4ad8-ad68-295a9892574e","question":"What were you like as a high school student?"},"DeepDives:{\"uuid\":\"990f5047-8dc5-4198-8ea7-85a980b6460e\"}":{"__typename":"DeepDives","uuid":"990f5047-8dc5-4198-8ea7-85a980b6460e","content":"\u003cp\u003eAs an early high school student,. I went to a different high school than my friends in my home town.This decision stemmed from my interest in exploring different learning styles and alternative teaching methods. Located on the northernmost point of the Jersey Shore, MAST taught a STEM-based curriculum and offered many lab centric classes including its own research vessel which was used to explore the marine life that is indigenous to our area. When my classes went virtual due to COVID-19 I found my real passion for learning. The style of school projects changed, as students were limited to materials in their home. allowing room for me to explore in my own direction. I discovered how much I enjoyed learning, especially when I got to choose the topic. This quickly shifted into an ability to shape nearly any project into a subject I am passionate about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"305694fb-6a34-4ad8-ad68-295a9892574e\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"55fcbde8-ab2c-4aa8-9fcc-3b059c1057b7\"}":{"__typename":"DeepDives","uuid":"55fcbde8-ab2c-4aa8-9fcc-3b059c1057b7","content":"\u003cp\u003eGrowing up, I attended a summer camp with a focus on wilderness trips in Maine for 7 years(Kieve). Each year, we were sent out on a camping trip, spending more time in the woods as we aged. After my freshman year of high school I returned for my final year, backpacking the Appalachian trail for 22 days with eight of my close friends, led by two college aged kids. Four years later, after my first year of college, I returned to Kieve as a counselor, leading groups of 12 and 15 year old kids on those same trips. For the following three summers leading up to college, I stayed back in my hometown and worked the dock at a local seafood restaurant, tying up boats that needed fuel, bait, and food. I learned an important skill at this job as I needed to learn to communicate with people much older than myself. During my third year at the job, I became a manager and was put in charge of all of the books and scheduling shifts for the dock. Spending the summers on the water with the sun, salty air and constant talk of surfing and fishing spots was a dream job for a teenager.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"bfa0f365-2712-422e-b874-1930c39706f4\"}":{"__typename":"DeepDives","uuid":"bfa0f365-2712-422e-b874-1930c39706f4","content":"\u003cp\u003eIn my lifetime, I want to be known as someone who made a lasting impact in my profession, in my community and as a mentor. My morals and the direction with which I live my life have been shaped by the events I have experienced and the people that made up those events. Through hard work, a positive attitude and a willingness to expand horizons, I hope to one day be an inspiration to others and make an impact on their lives, which is why I have chosen the path of biomedical engineering. Inherently, this is a profession that will directly lead to an improvement in the quality of life of many as technologies rapidly advance. One professional goal is to develop a technology or a product that can have a lasting impact on someone’s quality of life.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"5c3a72a8-3b55-4793-a8a6-c040702cc41a\"}":{"__typename":"School","uuid":"5c3a72a8-3b55-4793-a8a6-c040702cc41a","name":"Marine Academy of Science and Technology","city":"Highlands","type":"HIGH","state":"New Jersey","country":"United States","zip":"07732"},"Education:{\"uuid\":\"dbc61e51-392a-4794-98fd-90f7159e8445\"}":{"__typename":"Education","uuid":"dbc61e51-392a-4794-98fd-90f7159e8445","school":{"__ref":"School:{\"uuid\":\"5c3a72a8-3b55-4793-a8a6-c040702cc41a\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}":{"__typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"0dd6a2f8-a1cd-4502-bfcd-921f5e16d479\"}":{"__typename":"Education","uuid":"0dd6a2f8-a1cd-4502-bfcd-921f5e16d479","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"d9c05470-4125-461d-91c8-2a4eb9dd03b7\"}":{"__typename":"MentorPublicProfile","uuid":"d9c05470-4125-461d-91c8-2a4eb9dd03b7","displayName":"Myles A.","slug":"myles-anderson","biography":"\u003cp\u003eMy name is Myles Anderson, I am a junior at Washington University in St. Louis, pursuing a Bachelor's degree in Biomedical Engineering (BME) with minors in Nanoscale Science and Engineering and Anthropology. In the future, I hope to pursue further research on the application of nano materials in BME. I have a strong background in mathematics, stemming from my high school, which was a small military academy that specialized in technology and the marine sciences(MAST). My knowledge spreads across all of the STEM fields, and I feel confident in my ability to teach any of the associated subject areas. This past semester, I studied in Madrid, Spain, immersing myself in the culture and exploring the beautiful country. This experience allowed me to meet people from backgrounds very different from my own. This was valuable in many ways, as a vast network of friends can serve as a powerful tool. Back at my university, I have worked in a similar manner. I am a member of the BME society, classics club, played for many intramural teams, and am in a fraternity. In my down time, you can almost always find me outside. I go on frequent hikes and bike rides, but also gained a lot of my wilderness experience through long camping trips growing up. In fact, this past summer I camped for over a month, leading two trips into the backcountry of Maine. My home is in Rumson, NJ, where I live just a walk away from the beach. There I surf, fish, and go kiteboarding! When I’m looking for some downtime, I like to relax by playing the guitar or solving logic puzzles.\u003c/p\u003e","teachingVideoPlaybackId":"P00Yl9ICv6daVNKdXAZepImifw00c01YdvcypRsS2QzhfI","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"41f62322-7cfd-4740-9510-fa7e6fe55039\"}"},{"__ref":"DeepDives:{\"uuid\":\"990f5047-8dc5-4198-8ea7-85a980b6460e\"}"},{"__ref":"DeepDives:{\"uuid\":\"55fcbde8-ab2c-4aa8-9fcc-3b059c1057b7\"}"},{"__ref":"DeepDives:{\"uuid\":\"bfa0f365-2712-422e-b874-1930c39706f4\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/e33ed035-b520-4ff5-929f-0da9f0a25e4f/-/preview/-/format/jpg/","https://ucarecdn.com/cfe06f40-bf96-402b-bcb3-f7db26681821/-/preview/-/format/jpg/","https://ucarecdn.com/fd2a40c7-09b1-4513-9229-ac0f3bcdb3cc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"dbc61e51-392a-4794-98fd-90f7159e8445\"}"},{"__ref":"Education:{\"uuid\":\"0dd6a2f8-a1cd-4502-bfcd-921f5e16d479\"}"}],"hiredAt":"2024-05-27T08:29:41.700Z","topics":["Coding / Programming","Aviation / Aerospace","Robotics / Electronics / CAD","Product Design","Medicine / Health","K-5 Grade Math","Pre-Algebra","Geometry","Precalculus / Trigonometry","Statistics","Calculus","Chemistry","Biology","6-8 Grade Science","Physics","Algebra II","Algebra I","STEM Project"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"myles-anderson\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d9c05470-4125-461d-91c8-2a4eb9dd03b7\"}"}}},"_sentryTraceData":"4e8
