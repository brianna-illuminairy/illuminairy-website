xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f77c037b-ffef-4719-bef0-2554d57c5c11\"}":{"__typename":"DeepDives","uuid":"f77c037b-ffef-4719-bef0-2554d57c5c11","content":"\u003cp\u003eI would tell my middle or high school self to explore my passions and find innovative ways to communicate, develop, and explore those passions! As a Curious Cardinals mentor, I seek to do just that. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"9fe36390-ecf2-4193-b72f-dc707dc14323\"}":{"__typename":"School","uuid":"9fe36390-ecf2-4193-b72f-dc707dc14323","name":"Winston Churchill High School","city":"Potomac","type":"HIGH","state":"Maryland","country":"United States","zip":"20854"},"Education:{\"uuid\":\"db0a27d2-42bc-4bdb-9759-5698e0d8ffd2\"}":{"__typename":"Education","uuid":"db0a27d2-42bc-4bdb-9759-5698e0d8ffd2","school":{"__ref":"School:{\"uuid\":\"9fe36390-ecf2-4193-b72f-dc707dc14323\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"b942fed6-9ba0-4889-aa13-4ad32240e230\"}":{"__typename":"Education","uuid":"b942fed6-9ba0-4889-aa13-4ad32240e230","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2026","major":"Politics","degree":null},"MentorPublicProfile:{\"uuid\":\"c8d95ce7-6974-47dc-9afb-93c6a8de2720\"}":{"__typename":"MentorPublicProfile","uuid":"c8d95ce7-6974-47dc-9afb-93c6a8de2720","displayName":"Jonathan S.","slug":"jonathan-silverman","biography":"\u003cp\u003eHi, my name is Jonathan Silverman, and I’m a graduating senior at Princeton University from Potomac, Maryland in the DC Area. However, I am moving to San Francisco this summer!\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am majoring in Politics with a concentration in American legal policy. I wrote my senior thesis, titled “‘The Totality of Circumstances’: The Rise and Fall of Section 2 of the Voting Rights Act,\" on election law jurisprudence. My 105-page thesis explores the trajectory of voting rights in America from the Civil Rights Movement to the present and what the future holds for the fundamental right of participating in our democracy.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am passionate about political participation and engagement, particularly among the youth. Last summer, I worked for both the Los Angeles local government and CAUSE (Center for Asian Americans United for Self-Empowerment), a civic engagement and advocacy nonprofit organization. In the past, I have worked in the U.S. Senate, on political campaigns, and at a political consulting \u0026amp; marketing agency. I served as the Deputy Communications Director for the College Democrats of New Jersey. In addition, at Princeton, I worked as a research assistant for a PhD candidate in the Politics Department. I am a firm believer in promoting awareness of democratic values in the next generation.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI am also passionate about promoting cultural competency and solidarity. As the son of a US foreign service officer, I was born in Turkey and lived in Sweden and Israel growing up. This exposure to various international cultures instilled in me the importance of understanding and respecting others. At Princeton, I am a student leader at the Center for Jewish Life, the Vice President of the Pride Alliance, and a member of both the Asian American Student Association and Korean Students at Princeton.\u0026nbsp;\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also have extensive experience in tutoring and mentoring students, particularly in public speaking, SAT/ACT prep, and Model UN. I am excited to work with you on whatever initiative you are pursuing, whether it be preparing for an AP exam, writing a research essay, or a pure passion project!\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn my free time, I enjoy boxing, skiing/snowboarding, trivia, and making playlists. Can’t wait to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"GG023UkCJ87enVczq7gSq1Jp02ByNPHrRErywQgtDKPqM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Politics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f77c037b-ffef-4719-bef0-2554d57c5c11\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/49622f82-96b8-4fde-bb83-25512ecb7a5c/-/preview/-/format/jpg/","https://ucarecdn.com/d51e7eb7-ec97-4fa8-b9b2-71a2fe8779f7/-/preview/-/format/jpg/","https://ucarecdn.com/34b9a75c-54a3-4fc4-be39-5bbb74349394/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"NON_BINARY","education":[{"__ref":"Education:{\"uuid\":\"db0a27d2-42bc-4bdb-9759-5698e0d8ffd2\"}"},{"__ref":"Education:{\"uuid\":\"b942fed6-9ba0-4889-aa13-4ad32240e230\"}"}],"hiredAt":"2026-05-05T20:10:33.611Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Writing","Spanish","Academic Coaching","Executive Function","College Essay Writing","Reading","History","Economics","K-6 Storybook","Creative Writing","Fashion / Cosmetics","Music","Film / Theater","History Project","Visual Arts / Graphic Design","Law / G
