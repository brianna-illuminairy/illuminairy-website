xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"c205874e-1df2-426c-8834-d3770362684f\"}":{"__typename":"Favorites","uuid":"c205874e-1df2-426c-8834-d3770362684f","photoUrl":"https://ucarecdn.com/121ae17e-80a4-44be-a97f-eb8eb55a66c2/","title":"Madrid","type":"CITY"},"Favorites:{\"uuid\":\"aa8dfeab-0669-438d-a85b-9f382d9cf003\"}":{"__typename":"Favorites","uuid":"aa8dfeab-0669-438d-a85b-9f382d9cf003","photoUrl":"https://ucarecdn.com/121ae17e-80a4-44be-a97f-eb8eb55a66c2/","title":"Adam Sandler","type":"ACTOR"},"Favorites:{\"uuid\":\"d9633119-469c-436b-8eaa-af025d54928f\"}":{"__typename":"Favorites","uuid":"d9633119-469c-436b-8eaa-af025d54928f","photoUrl":"https://ucarecdn.com/121ae17e-80a4-44be-a97f-eb8eb55a66c2/","title":"Seahawks","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f6e350fc-d50e-43b9-b623-765a779bea1b\"}":{"__typename":"DeepDives","uuid":"f6e350fc-d50e-43b9-b623-765a779bea1b","content":"\u003cp\u003eMiddle school, high school, and college fly by in the blink of an eye. I would tell my younger self that life goes by quickly and the people in my life are always worth making time for, no matter how busy I am. There will always be homework and other tasks, but life experiences sometimes pass by. I would tell myself to make sure I never miss out on these. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"50a4e513-4271-4a7c-bb18-86714d5d297b\"}":{"__typename":"DeepDives","uuid":"50a4e513-4271-4a7c-bb18-86714d5d297b","content":"\u003cp\u003eI spent my summers refereeing youth soccer and umpiring Little League baseball. I love sports, and I couldn't think of a better way to spend my summers than sweating through my gear and getting yelled at by parents for calling their 8-year-old out. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"f6848352-8566-4f18-99d1-ad79cff2571f\"}":{"__typename":"DeepDives","uuid":"f6848352-8566-4f18-99d1-ad79cff2571f","content":"\u003cp\u003eI would not be anywhere near where I am today without the help of multiple mentors throughout my life. If I can make even a tiny difference and guide one person the same way I was guided, that would make me feel so happy. My mentors are some of the most important people in my life, and I want to have similar effects on people from the other side of the table now. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e7c234b0-0056-43ac-b63e-40e137053aef\"}":{"__typename":"DeepDives","uuid":"e7c234b0-0056-43ac-b63e-40e137053aef","content":"\u003cp\u003eI love spending time outdoors, being with my family and friends, learning to cook, and watching movies. I'm also a sports fanatic - you will find me on the couch for 11 hours every Sunday from September until January watching football and fútbol.  \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"68d43403-9287-4ff1-a022-8547b1169593\"}":{"__typename":"School","uuid":"68d43403-9287-4ff1-a022-8547b1169593","name":"Lakeside School","city":"Seattle","type":"HIGH","state":"Washington","country":"Estados Unidos","zip":"98125"},"Education:{\"uuid\":\"8cc43a40-00ec-4133-a00b-ba05634068cd\"}":{"__typename":"Education","uuid":"8cc43a40-00ec-4133-a00b-ba05634068cd","school":{"__ref":"School:{\"uuid\":\"68d43403-9287-4ff1-a022-8547b1169593\"}"},"startYear":"2017","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"db803424-3408-4234-b159-ff407dbaea8d\"}":{"__typename":"Education","uuid":"db803424-3408-4234-b159-ff407dbaea8d","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Computer Science \u0026 Journalism","degree":null},"MentorPublicProfile:{\"uuid\":\"0896decc-6a5a-4a1a-876e-f318da859a11\"}":{"__typename":"MentorPublicProfile","uuid":"0896decc-6a5a-4a1a-876e-f318da859a11","displayName":"Michael C.","slug":"michael-crystal","biography":"\u003cp\u003eHello everyone!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI'm Michael Crystal, a junior at Northwestern University, double majoring in Computer Science and Journalism. While my majors may seem like polar opposites, I consider this diversity to be my greatest strength — I often say I like to \"tickle both sides of my brain\". I'm passionate about delving into STEM-heavy topics and indulging in pure writing for journalism and other purposes. Yet, I find my true forte lies in integrating these two disciplines. I firmly believe that whether you specialize in STEM or humanities, there are invaluable skills from the other discipline that can enhance your proficiency.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI've actively pursued ventures on both fronts. My articles have been published by various on-campus publications, including a weekly tech newsletter, the Northwestern Business Review, and the Northwestern Undergraduate Law Journal. I've conducted interviews with CEOs, state Supreme Court Justices, and world-renowned doctors. During an internship, I authored multiple press releases, highlighting significant software announcements from my company, some of which I contributed to building. I am eager to guide my mentees in understanding journalism, from the mechanics of writing to effective interview techniques and all aspects related to the field.\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn the realm of Computer Science, I've undertaken numerous personal projects leveraging AI/ML and smart searching to assist journalists in their work. Last summer, I built software at AtScale, a tech startup, and this upcoming summer, I'll be a software engineer at Pinterest. I'm excited to share insights on the fundamentals of computer science, navigating the path to becoming a software engineer, strategies, and tips for technical interviews, or anything else related to the field.\u003cbr\u003e\u003cbr\u003eAs a mentor, I not only want my mentees to become experts in whatever they come to me for but also to become well-rounded students and people. If you have any questions, please feel free to reach out. I cannot wait to begin working with you! \u003c/p\u003e","teachingVideoPlaybackId":"xxqlNRsbE1PGBgwWEoFoX029ec2yuPaNZ5uDoZdL01neg","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"c205874e-1df2-426c-8834-d3770362684f\"}"},{"__ref":"Favorites:{\"uuid\":\"aa8dfeab-0669-438
