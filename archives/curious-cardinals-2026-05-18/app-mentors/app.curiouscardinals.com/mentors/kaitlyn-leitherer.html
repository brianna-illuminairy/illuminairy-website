xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"73a2759c-2d03-4d94-8d52-bb28bdbc1e3b\"}":{"__typename":"Favorites","uuid":"73a2759c-2d03-4d94-8d52-bb28bdbc1e3b","photoUrl":"https://ucarecdn.com/17765dda-2543-44a4-9132-fb55babe1f9b/","title":"San Francisco","type":"CITY"},"Favorites:{\"uuid\":\"6832a040-28d3-490c-aedd-882f8c532bea\"}":{"__typename":"Favorites","uuid":"6832a040-28d3-490c-aedd-882f8c532bea","photoUrl":"https://ucarecdn.com/5dc79235-7ca5-4cc0-ab02-be3a5d2842fe/","title":"The Godfather","type":"MOVIE"},"Favorites:{\"uuid\":\"199fb7f2-a572-4a95-b746-59a801015984\"}":{"__typename":"Favorites","uuid":"199fb7f2-a572-4a95-b746-59a801015984","photoUrl":"https://ucarecdn.com/cbc9c3d9-a727-45c8-8b56-34774b25a78a/","title":"The Sims 4","type":"GAME"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"3b370e7e-3fd9-4892-a17e-4902274c7106\"}":{"__typename":"DeepDives","uuid":"3b370e7e-3fd9-4892-a17e-4902274c7106","content":"\u003cp\u003e\u003cstrong\u003eAfter 9th grade, \u003c/strong\u003eI started a casual instagram clothing/jewelry business where I’d go thrifting and resell cool clothes. I don’t remember turning much of a profit, besides having a good time going to the thrift stores with my childhood best friend.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eAfter 10th grade, \u003c/strong\u003ecovid had hit so I started camping with my mom for the first time and volunteering at an urban farm. My school offered online courses so I took AP US history for six weeks. I also took a Coursera course on classical music history. I studied for the SAT a little bit towards August.\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003eAfter 11th grade, \u003c/strong\u003eI continued my environmental science kit project, and I began researching the start of my harp passion project. I also studied for the SAT a bit more since I wasn’t happy with my score.\u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"62b0d3cc-9a22-42d6-8125-06c63e42af61\"}":{"__typename":"DeepDives","uuid":"62b0d3cc-9a22-42d6-8125-06c63e42af61","content":"\u003cp\u003eI’m an extraverted introvert, so that means I spend a LOT of time with my friends, laughing and telling stories til my heads hurts, then remember I’m an introvert, and go to hibernate with a book. If I’m REALLY hibernating, then I’ll play the Sims 4 (probably for 8 hours straight).\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBesides that, I’m learning how to produce music with my best friend, and I love going to concerts and dancing with my friends. My favorite artists are Fred again, Tame Impala, Lil Yachty, the 1975, and Fleetwood Mac.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA perfect lazy day for me would mean strolling through a city with my best friend, stopping at thrift stores, record shops, then spending the afternoon at an art museum. In the evening, going to the beach for sunset and then heading to a concert.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"06717cdd-0a93-4be0-be02-4418df127523\"}":{"__typename":"DeepDives","uuid":"06717cdd-0a93-4be0-be02-4418df127523","content":null,"videoPlaybackId":"CnCi3mt1zp01pPPSGnprof1yGtEGeJQZkmsDHxax9XlA","question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"71d4cfc6-925a-4ac5-a948-21a50e874b2b\"}":{"__typename":"DeepDives","uuid":"71d4cfc6-925a-4ac5-a948-21a50e874b2b","content":null,"videoPlaybackId":"ajv2lWQtqQUERkl00PugMll00vUZ02ze4Pfwt01UAOT00PS00","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"ec9f0ba5-477b-4a3d-90dc-34f76b959631\"}":{"__typename":"School","uuid":"ec9f0ba5-477b-4a3d-90dc-34f76b959631","name":"The Bryn Mawr School","city":"Baltimore","type":"HIGH","state":"Maryland","country":"United States","zip":"21210"},"Education:{\"uuid\":\"0b7c7acb-9961-42b5-af72-14ee633b3674\"}":{"__typename":"Education","uuid":"0b7c7acb-9961-42b5-af72-14ee633b3674","school":{"__ref":"School:{\"uuid\":\"ec9f0ba5-477b-4a3d-90dc-34f76b959631\"}"},"startYear":"2014","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"73c27e82-9106-429b-b840-e00096617bbb\"}":{"__typename":"Education","uuid":"73c27e82-9106-429b-b840-e00096617bbb","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Electrical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"13cf8c83-5318-4dc4-ae6e-752d8dd917bd\"}":{"__typename":"MentorPublicProfile","uuid":"13cf8c83-5318-4dc4-ae6e-752d8dd917bd","displayName":"Kaitlyn L.","slug":"kaitlyn-leitherer","biography":"\u003cp\u003eKaitlyn is a junior at Stanford majoring in electrical engineering with a minor in music. Kaitlyn’s interests are wide-ranging and unique to her, and she wants to help your student \u003cstrong\u003ecurate passions authentic to them\u003c/strong\u003e. She’s pursued passion projects throughout the years that have deepened her understanding of the subjects she loves, while also equipping her with tools and experiences she’ll use for the rest of her life. Before Stanford, she attended the Bryn Mawr School, an all-girls K-12 school nicknamed Baltimore’s “Pressure Cooker.” So, she’s very familiar with \u003cstrong\u003ebalancing a demanding school schedule and extracurriculars\u003c/strong\u003e, and she is more than prepared to ensure your student thrives. Her passions and her expertise within them can be found below:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e🔌 \u003cstrong\u003e\u003cu\u003eElectrical Engineering\u003c/u\u003e\u003c/strong\u003e\u0026nbsp;🔌\u003c/p\u003e\u003cp\u003eKaitlyn has taken 10+ courses in computer science, electrical engineering (circuits 1+2, signals), physics, and math. Her coding languages include \u003cstrong\u003eJavaScript, Python, C++, and C\u003c/strong\u003e. Her engineering projects include an AC-DC converter, a class-D audio amplifier, a printed circuit board for a satellite that's going to space, and more. Watch the video below \"Why did you choose your major\" to learn more about these projects. Outside of class, she \u003cstrong\u003eco-leads Stanford Space Initiative's Satellite avionics team\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eShe is also a student researcher in a \u003cstrong\u003enano-fabrication\u003c/strong\u003e lab where she conducts experiments to advance Moore’s law in an era of AI when more compute power is needed than ever. Her favorite part is getting into uniform--a custom bunny suit--before entering the particle-free lab environment.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e🎶 \u003cstrong\u003e\u003cu\u003eMusic (and a bit of engineering)\u003c/u\u003e\u003c/strong\u003e\u0026nbsp;🎶\u003c/p\u003e\u003cp\u003eKaitlyn is a classically trained harpist, having started at the age of four at the Peabody pre-conservatory. She has won several high-level competitions as well as performed at national conferences with her ensemble.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn her junior year, she was curious about how the history of the harp and her family’s heritage intertwined, so she set out on a mission to \u003cstrong\u003econstruct her own harp\u003c/strong\u003e. She hoped that \u003cstrong\u003ethe physics behind the building process\u003c/strong\u003e would help provide an answer to her questions of emotions, culture, and conventions. She reached out to academics and musicians, and in the end, presented her findings, as well as the harp, to her Upper School, winning best senior speech. To learn more about how she did it, watch the video entitled \"What is a passion project you’re working on or have created in the past?\".\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSince then, she’s made another harp for her dorm, and when she isn’t performing for others, she shares her love for music by teaching her friends on the lap harp she constructed herself. Kaitlyn believes a student should form a connection to engineering that’s unique to them because that’s where its lifelong value will lie.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e📣 \u003cstrong\u003e\u003cu\u003eEnvironmental Advocacy\u003c/u\u003e\u003c/strong\u003e\u0026nbsp;📣\u003c/p\u003e\u003cp\u003eKaitlyn has extensive experience in environmental advocacy, encompassing both legislative efforts and technical expertise. She pinpointed a specific environmental issue in her community and \u003cstrong\u003ecoded satellite imagery mappings\u003c/strong\u003e to visualize the invisible phenomenon. To raise awareness, she designed environmental science kits around this issue, which \u003cstrong\u003eshe pitched to and won funding\u003c/strong\u003e from her local chapter of a national environmental organization. She was invited to join \u003cstrong\u003ethe chapter’s executive team, becoming their youngest member\u003c/strong\u003e. Partnering with Baltimore’s Department of Recreation, she distributed the kits to under-resourced rec centers and gathered a large team of high school students to design more science kits. To help push legislative reform, she \u003cstrong\u003ewrote a letter to her congressman, \u003c/strong\u003ewhich the Baltimore Sun published: https://sarbanes.house.gov/media-center/in-the-news/kudos-rescuing-chesapeake-bay-program\u003c/p\u003e","teachingVideoPlaybackId":"m02Tyd7701Srp4URd41tONwp9duLfcoFXXoNy00KUtnIIg","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOn my first day of freshman year, I was so nervous to go to my first lecture -- 100+ people in one classroom was something I was not used to. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI walked into the big auditorium hall, past the rows of seats that were already populated by new students, and I looked between the front section and the back section of the lecture hall. Though there were no assigned seats, I knew from high school that where you sat on the first day became your \u003cem\u003ede facto \u003c/em\u003eassigned seat. I took a breath and walked up, taking a front row seat next to the professor's lectern. It became the seat I sat in every lecture afterwards, where I could clearly see the board and most conveniently ask the professor a question after class. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eNow, I sit front row in all of my classes, and I'm glad I took the opportunity to get myself comfortable there!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"73a2759c-2d03-4d94-8d52-bb28bdbc1e3b\"}"},{"__ref":"Favorites:{\"uuid\":\"6832a040-28d3-490c-aedd-882f8c532bea\"}"},{"__ref":"Favorites:{\"uuid\":\"199fb7f2-a572-4a95-b746-59a801015984\"}"}],"causesSupported":[],"major":"Electrical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3b370e7e-3fd9-4892-a17e-4902274c7106\"}"},{"__ref":"DeepDives:{\"uuid\":\"62b0d3cc-9a22-42d6-8125-06c63e42af61\"}"},{"__ref":"DeepDives:{\"uuid\":\"06717cdd-0a93-4be0-be02-4418df127523\"}"},{"__ref":"DeepDives:{\"uuid\":\"71d4cfc6-925a-4ac5-a948-21a50e874b2b\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/7e6c6906-1141-4dd5-a825-b8bd5275fc5f/-/preview/-/format/jpg/","https://ucarecdn.com/a253289b-ba0d-4e9e-83a8-80727334295f/-/preview/-/format/jpg/","https://ucarecdn.com/a947126d-7a35-45b7-bfec-f01c3d5ce5b8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"0b7c7acb-9961-42b5-af72-14ee633b3674\"}"},{"__ref":"Education:{\"uuid\":\"73c27e82-9106-429b-b840-e00096617bbb\"}"}],"hiredAt":"2024-06-24T17:01:22.728Z","topics":["STEM Project","Web Design","Coding / Programming","Aviation / Aerospace","Negotiation","Business / Entrepreneurship","Algebra I","Algebra II","Calculus","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Sustainability"],"communityBadges":["https://ucarecdn.com/52a75f9a-40fa-413e-b2c3-632881448bfa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":false,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"kaitlyn-leitherer\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"13cf8c83-5318-4dc4-ae6e-752d8dd917bd\"}"}}},"_sentryTraceData":"d8fd1c1f19c1412eac4e8986ccb73463-a8c86fa156657930-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128
