8\"}":{"__typename":"DeepDives","uuid":"3f3bdb52-8c86-40dd-a0bf-8573b68ef588","content":"\u003cp\u003e\u003cstrong\u003eI want to qualify for the Ironman triathlon World Championship in Kailua-Kona, Hawaii one day!\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}":{"__typename":"Question","uuid":"8d654265-623e-4120-8c85-dde03d82cbce","question":"What’s something about yourself that isn’t obvious right away?"},"DeepDives:{\"uuid\":\"9098cd04-3f61-4bc9-b502-0a06d49c8e88\"}":{"__typename":"DeepDives","uuid":"9098cd04-3f61-4bc9-b502-0a06d49c8e88","content":"\u003cp\u003e\u003cstrong\u003eI love music, writing songs, and tinkering around with DAWs to make beats.\u003c/strong\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"8d654265-623e-4120-8c85-dde03d82cbce\"}"}},"School:{\"uuid\":\"cf0708f6-9084-445b-87d0-66d432317a6c\"}":{"__typename":"School","uuid":"cf0708f6-9084-445b-87d0-66d432317a6c","name":"Thomas Jefferson High School for Science and Technology","city":"Alexandria","type":"HIGH","state":"Virginia","country":"United States","zip":"22312"},"Education:{\"uuid\":\"f0e27eda-6557-42ed-a15a-b4c14126663d\"}":{"__typename":"Education","uuid":"f0e27eda-6557-42ed-a15a-b4c14126663d","school":{"__ref":"School:{\"uuid\":\"cf0708f6-9084-445b-87d0-66d432317a6c\"}"},"startYear":"2013","endYear":"2017","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"21621a7d-d38c-4066-834e-0ca9d0dfa1b2\"}":{"__typename":"Education","uuid":"21621a7d-d38c-4066-834e-0ca9d0dfa1b2","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2017","endYear":null,"expectedGradYear":"2022","major":"Cognitive Science","degree":null},"MentorPublicProfile:{\"uuid\":\"7fc5c37d-d179-46e2-af69-3c704581d66d\"}":{"__typename":"MentorPublicProfile","uuid":"7fc5c37d-d179-46e2-af69-3c704581d66d","displayName":"Eric L.","slug":"eric-liu","biography":"\u003cp\u003eEric graduated from Yale College in 2022 with a degree in Cognitive Science and will start his PhD at the MIT Institute for Data, Systems, and Society in Fall 2023.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eHe is passionate about using computation to understand and solve messy and complex problems in the real world, and more specifically how human social behaviors can inform public health outcomes. His passion for science started by studying very different communities—of bacteria in the human gut. For two summers in high school, he worked as a research assistant at the George Mason University Microbiome Analysis Center, hunched over the lab bench with pipette in hand, attempting to map out the complex interactions of gut microorganisms collected from patients battling liver disease. Using what he learned, he later conducted a personal project to understand how cancer in the gastrointestinal tract can change the communities of bacteria in the gut. In college, he embarked on a new journey to understand how humans—and not only bacteria—behave in groups, and how this behavior might influence public health interventions. He helped launch the fourth wave of data collection for a population of over 30,000 people across 176 villages in rural Copán, Honduras, aiming to study the effects of network-based targeting strategies in improving maternal and neonatal health in developing settings. In the future, he hopes to engineer safer and more effective systems in the realms of social networks, applied artificial intelligence, and health.\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003eOutside of his studies, Eric enjoys developing video games from scratch, writing songs, and biking with his friends. Eric is so excited to work with his mentees as a new member of the Curious Cardinals community!\u003c/p\u003e","teachingVideoPlaybackId":"vE2di00X7sClufiiEBhG7j3e5yiz7l1x4aopbjbVkdxM","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"792324cc-e0db-4a4b-b3dd-aaec75e06e5a\"}"},{"__ref":"Favorites:{\"uuid\":\"c6dee74a-be5f-43e8-bae0-76df3dc72141\"}"},{"__ref":"Favorites:{\"uuid\":\"52a6c74d-9192-492c-8064-293a294830ee\"}"}],"causesSupported":[],"major":"Cognitive Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c21695a1-442a-47d7-b6e2-7545b2b98576\"}"},{"__ref":"DeepDives:{\"uuid\":\"3f3bdb52-8c86-40dd-a0bf-8573b68ef588\"}"},{"__ref":"DeepDives:{\"uuid\":\"9098cd04-3f61-4bc9-b502-0a06d49c8e88\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/a0e3b518-bb63-4851-8a8e-eca881d4e96e/-/preview/-/format/jpg/","https://ucarecdn.com/04f38b8c-4fb0-4164-a08b-f55ec6454995/-/preview/-/format/jpg/","https://ucarecdn.com/1f289ac1-6851-4251-ac1d-56603ead401a/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"f0e27eda-6557-42ed-a15a-b4c14126663d\"}"},{"__ref":"Education:{\"uuid\":\"21621a7d-d38c-4066-834e-0ca9d0dfa1b2\"}"}],"hiredAt":"2023-06-28T01:08:21.930Z","topics":["6-8 Grade Science","Writing","Computer Science","Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","Statistics","Machine Learning / AI","Coding / Programming","Academic Coaching","Executive Function"],"communityBadges":["https://ucarecdn.com/7888bd4b-612e-4eb6-94e7-3442bd9a4a01/","https://ucarecdn.com/e71ba415-a7b2-4b58-a699-2bf2774e1b7b/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"e
