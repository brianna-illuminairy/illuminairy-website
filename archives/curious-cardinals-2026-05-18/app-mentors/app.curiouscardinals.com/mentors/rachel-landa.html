xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"bce23add-53e6-4bba-8ba0-2377691dd37a\"}":{"__typename":"Favorites","uuid":"bce23add-53e6-4bba-8ba0-2377691dd37a","photoUrl":"https://ucarecdn.com/9ef7de26-44b4-4d0f-b79d-ea0be7584eef/","title":"Grent Perez","type":"ARTIST"},"Favorites:{\"uuid\":\"91bd026e-83ed-404c-9fc2-d121a075d98c\"}":{"__typename":"Favorites","uuid":"91bd026e-83ed-404c-9fc2-d121a075d98c","photoUrl":"https://ucarecdn.com/55a8ec09-cd66-4ee8-aafa-5b8235d241fa/","title":"Soccer","type":"SPORT"},"Favorites:{\"uuid\":\"53a452ce-5ac8-4bcd-8e53-03e3302fbc30\"}":{"__typename":"Favorites","uuid":"53a452ce-5ac8-4bcd-8e53-03e3302fbc30","photoUrl":"https://ucarecdn.com/b9c39057-6325-44f7-af78-59fb099bab71/","title":"Everything I Know About Love","type":"ALBUM"},"CausesSupported:{\"uuid\":\"c87e0bf7-7c64-49af-ba79-94ce9029099f\"}":{"__typename":"CausesSupported","uuid":"c87e0bf7-7c64-49af-ba79-94ce9029099f","name":"HEART (Health Education and Awareness Raising Together)","description":"\u003cp\u003eI'm a teacher, I teach middle schoolers and various health topics!\u003c/p\u003e","photoUrl":"https://ucarecdn.com/04e7ac6a-acc3-4095-aad9-dff57ef115a7/"},"CausesSupported:{\"uuid\":\"21458cbc-9d74-4bed-a4e1-de2e421c69ef\"}":{"__typename":"CausesSupported","uuid":"21458cbc-9d74-4bed-a4e1-de2e421c69ef","name":"CCRA (Cornell Computer Reuse Association)","description":"\u003cp\u003eI help collect and refurbish computers that are donated to various organizations\u003c/p\u003e","photoUrl":"https://ucarecdn.com/853c81cc-fcde-40d9-91d9-f66f6b6a8d2f/"},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"8afa6d21-438d-43fe-9a5d-5dbde64eb344\"}":{"__typename":"DeepDives","uuid":"8afa6d21-438d-43fe-9a5d-5dbde64eb344","content":"\u003cp\u003eI chose biomedical engineering because I’ve always loved creating things, whether it was building, tinkering, or designing, but I also knew I wanted my work to have a real-world, human impact. I actually started out in mechanical engineering because I was drawn to the hands-on nature of it and the challenge of solving complex problems. But as I progressed, I realized that while I enjoyed the technical side, I was craving more connection to biology, medicine, and the opportunity to directly improve lives.\u003c/p\u003e\u003cp\u003eThat’s when I decided to shift into biomedical engineering. It felt like the perfect intersection of everything I care about: designing and building, understanding how the human body works, and using that knowledge to develop meaningful solutions. I love that BME allows me to work on problems that are both technically interesting and personally fulfilling, whether it’s designing medical devices, understanding biomechanics, or improving healthcare systems. It’s incredibly rewarding to know that the skills I’m building can be used to make a difference in people’s lives, and I can still do what I love.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"482e16a1-bbc6-408e-b50d-766b65151876\"}":{"__typename":"DeepDives","uuid":"482e16a1-bbc6-408e-b50d-766b65151876","content":"\u003cp\u003eOut of everything I could be doing, I choose mentorship because it’s one of the most meaningful ways I can give back. I’ve had people in my life who took the time to explain tough concepts, encourage my ideas, and remind me I was capable, and that support made all the difference. Now, I want to be that person for someone else.\u003c/p\u003e\u003cp\u003eEngineering can feel overwhelming at first, and I love helping others see that it’s not only doable, but it can be exciting, creative, and deeply rewarding. Whether I’m explaining a technical idea or brainstorming a project, I aim to spark curiosity and help students build confidence in their abilities.\u003c/p\u003e\u003cp\u003eMentorship isn’t just about teaching facts; it’s about connection, encouragement, and helping others see what they’re capable of. Watching someone light up when they finally understand something or finish a project they’re proud of, that’s what makes it all worth it. At the end of the day, I mentor because I believe in the power of sharing knowledge and lifting others up. Helping someone realize their potential, and maybe even fall in love with engineering, is the best use of my time I can imagine.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8fae5ecf-9992-4e1b-9c9b-117c86ab6bcd\"}":{"__typename":"DeepDives","uuid":"8fae5ecf-9992-4e1b-9c9b-117c86ab6bcd","content":null,"videoPlaybackId":"NW00KGOCGv7q3ACwQOTj1iBzs5gRxgPoxbdi6fQ4DSMA","question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"c43274a6-5e1c-41c6-950e-c20cb16f153c\"}":{"__typename":"DeepDives","uuid":"c43274a6-5e1c-41c6-950e-c20cb16f153c","content":null,"videoPlaybackId":"37R6r00IgdbO6y7bArvOwCBwKzJYPaVXxzhzcGs3oINQ","question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"cb24eec8-1cca-4773-835b-68a7f6c8adc2\"}":{"__typename":"School","uuid":"cb24eec8-1cca-4773-835b-68a7f6c8adc2","name":"Oceanside High School","city":"Oceanside","type":"HIGH","state":"New York","country":"United States","zip":"11572"},"Education:{\"uuid\":\"b23118fa-68ed-4602-b840-00cace7e614b\"}":{"__typename":"Education","uuid":"b23118fa-68ed-4602-b840-00cace7e614b","school":{"__ref":"School:{\"uuid\":\"cb24eec8-1cca-4773-835b-68a7f6c8adc2\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"892fade2-de20-453b-a7d5-dd168c7b35b9\"}":{"__typename":"Education","uuid":"892fade2-de20-453b-a7d5-dd168c7b35b9","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Biomedical Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"2e8c8be5-cc6f-4c4c-a3a6-4b2bb17ec0cf\"}":{"__typename":"MentorPublicProfile","uuid":"2e8c8be5-cc6f-4c4c-a3a6-4b2bb17ec0cf","displayName":"Rachel L.","slug":"rachel-landa","biography":"\u003cp\u003eHi! I’m Rachel, a Biomedical Engineer at Cornell University who loves tinkering, designing, and prototyping. Biomedical Engineers combine engineering and medicine to develop health solutions, make medical devices, or perform cutting-edge research. I’m pursuing a minor in Electrical and Computer Engineering and love robotics, so I want to work with robots in medicine, for example, surgical robots or robotic medical devices.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt school, I spend much of my time in the Butcher Laboratory, developing an aortic valve bioreactor for 3D-printed heart valves. I create CAD models for parts I dream up and solder electrical circuits together for data collection. I am also part of the Cornell Baja SAE project team, where we create an off-roading car every year, completely custom-made, to compete in the SAE international competitions. I also love engaging in personal projects in my free time, like making a mechanical arm for electronic devices or a robotic hand.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnd, when I’m not hard at work, I’m usually at Ultimate Frisbee! I’m a member of the Cornell Wild Roses Ultimate team and will be attending the 2025 D-1 Collegiate Championships this year! I’m passionate about all activities I participate in academically or not, and love trying new things to push myself out of my comfort zone. I love teaching others about engineering, and I am so deeply passionate about developing curiosity and creativity. Watching your ideas come to life is so satisfying, and getting to share them with others makes it that much more meaningful.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"nU7T00PAYNKIguqBW8nYPFnl3XbcEBmEr7VaKHFkJOzM","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eMy greatest achievement? Scoring the winning touchdown in a sport I’d never played, didn’t understand, and joined because my friends thought it would be fun.\u003c/p\u003e\u003cp\u003eIt was an all-girls flag football tournament. “We just need bodies!” they said. So I showed up in running shoes and zero expectations. First half: I clapped, stayed on the side, and asked, “Wait, do we \u003cem\u003ewant\u003c/em\u003e the flag pulled?”\u003c/p\u003e\u003cp\u003eFinal game. Tie score. Last play. Everyone’s exhausted. Someone shouts, “You—just run straight!” I nod.\u003c/p\u003e\u003cp\u003eI take off. Somehow, I catch the ball like a loaf of bread flying through a kitchen and just \u003cem\u003erun.\u003c/em\u003e In my head, every defender just looked like a spider. So I ran faster.\u003c/p\u003e\u003cp\u003eCrowd screaming. Me? Scared of spiders. I dive into the end zone like a low-budget Nike ad.\u003c/p\u003e\u003cp\u003eTouchdown. Game over. Chaos... \u003c/p\u003e\u003cp\u003eI retired immediately, undefeated of course.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"bce23add-53e6-4bba-8ba0-2377691dd37a\"}"},{"__ref":"Favorites:{\"uuid\":\"91bd026e-83ed-404c-9fc2-d121a075d98c\"}"},{"__ref":"Favorites:{\"uuid\":\"53a452ce-5ac8-4bcd-8e53-03e3302fbc30\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"c87e0bf7-7c64-49af-ba79-94ce9029099f\"}"},{"__ref":"CausesSupported:{\"uuid\":\"21458cbc-9d74-4bed-a4e1-de2e421c69ef\"}"}],"major":"Biomedical Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"8afa6d21-438d-43fe-9a5d-5dbde64eb344\"}"},{"__ref":"DeepDives:{\"uuid\":\"482e16a1-bbc6-408e-b50d-766b65151876\"}"},{"__ref":"DeepDives:{\"uuid\":\"8fae5ecf-9992-4e1b-9c9b-117c86ab6bcd\"}"},{"__ref":"DeepDives:{\"uuid\":\"c43274a6-5e1c-41c6-950e-c20cb16f153c\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d33ff9c1-1911-4d65-88bb-9214aa7f42b8/-/preview/-/format/jpg/","https://ucarecdn.com/80377568-6e01-4809-abec-bff4e094ba84/-/preview/-/format/jpg/","https://ucarecdn.com/e74bb46f-6619-4deb-840c-285789c0b520/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"b23118fa-68ed-4602-b840-00cace7e614b\"}"},{"__ref":"Education:{\"uuid\":\"892fade2-de20-453b-a7d5-dd168c7b35b9\"}"}],"hiredAt":"2025-05-10T14:37:40.062Z","topics":["Calculus","Algebra II","Geometry","Algebra I","Pre-Algebra","Physics","Biology","Chemistry","6-8 Grade Science","Executive Function","Academic Coaching","Computer Science","Music","Medicine / Health","Robotics / Electro
