pename":"DeepDives","uuid":"01603e47-b9bb-466f-957c-02ea89a2ad3d","content":"\u003cp\u003eMy dreams are wild rides, just a warning. This one's from last week:\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI was leading man on a sequel movie shooting in Europe. They purposefully wanted to get a bunch of friends on the movie (it was very low budget) so my friend Jack was in it. We were in beautiful parts of Italy and Germany. At some point on day one I spotted 5 rainbows in the sky at once, a manifestation of how awesome things were, but... then they turned out to be some kind of actual projection. They  turned off immediately. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThey were fake :( \u0026nbsp;\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"4d4f8d00-f784-4352-b1d7-69b09f7c73ee\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"8c9e7e99-b64f-41f6-b4c9-c3f93d802dbc\"}":{"__typename":"DeepDives","uuid":"8c9e7e99-b64f-41f6-b4c9-c3f93d802dbc","content":"\u003cp\u003eRight now, I'm working on a short film passion project that takes place in New York in January 1981, and it follows the life of a $100 bill. It is a commentary on our interconnectedness as strangers, as well as asking the question: what is the real purpose of money? Is it how we spend it that defines us? Or how we make it?\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThe process of writing the script, to casting, to production design, to editing has been extremely fulfilling and exciting. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b9aedee9-8f4e-4354-84eb-21f7f0b83fee\"}":{"__typename":"DeepDives","uuid":"b9aedee9-8f4e-4354-84eb-21f7f0b83fee","content":null,"videoPlaybackId":"dkQY016XSeJsvyW9D6E300YB92uDj5PL5b2MwjXgApXag","question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"834708cb-59b4-4684-90c9-fa03ed796588\"}":{"__typename":"DeepDives","uuid":"834708cb-59b4-4684-90c9-fa03ed796588","content":null,"videoPlaybackId":"RBNWwgIdPT8nP02Xo302ABrqb1mVXnJG02W1svVyygYhvY","question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"6a374d33-e99a-4d71-8ad3-0d4e02b7cc0d\"}":{"__typename":"School","uuid":"6a374d33-e99a-4d71-8ad3-0d4e02b7cc0d","name":"Jean \u0026 Jerry Friedman Shalhevet High School","city":"Los Angeles","type":"HIGH","state":"California","country":"United States","zip":"90036"},"Education:{\"uuid\":\"44128887-bf14-46d1-a6d2-7eb23ab64f7d\"}":{"__typename":"Education","uuid":"44128887-bf14-46d1-a6d2-7eb23ab64f7d","school":{"__ref":"School:{\"uuid\":\"6a374d33-e99a-4d71-8ad3-0d4e02b7cc0d\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"327c1449-48fa-461c-8678-39001969ebb2\"}":{"__typename":"Education","uuid":"327c1449-48fa-461c-8678-39001969ebb2","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2019","endYear":null,"expectedGradYear":"2023","major":"Economics","degree":null},"Testimonial:7efbd522-8146-46fe-ae9c-8672e3f354ac":{"__typename":"Testimonial","id":"7efbd522-8146-46fe-ae9c-8672e3f354ac","text":"David has been an absolutely amazing mentor for Namah!  Their mentor sessions have been a combination of a 1-1 screenwriting class, a brainstorming session for ideas, and a chance to learn and be mentored by someone with real film industry experience. David takes the time to thoroughly prepare and engage at each session and Namah is the beneficiary of his deep knowledge and enthusiasm. Namah is excited to continue to learn with David as he refines his writing skills. We are so grateful to Curious Cardinals for matching Namah to David.","date":"2025-06-02 22:48:25.275+00","rating":5,"endorser":{"__typename":"Endorser","name":"Tami Horton","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"a008d3d2-192a-4994-980d-d074827ddd56\"}":{"__typename":"MentorPublicProfile","uuid":"a008d3d2-192a-4994-980d-d074827ddd56","displayName":"David M.","slug":"david-mazouz","biography":"\u003cp\u003eHi! My name is David Mazouz, and I'm a Jewish graduate from Stanford University (2023) where I studied Economics and Psychology.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy passion is filmmaking, acting more specifically,  which I have been doing professionally since I was 8. You might have seen my work in The Office, Family Guy, Gotham, or a variety of other movies. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI'm currently working on passion projects including short films, TV shows, a reality show, and commercials which I am involved in producing, writing, and directing. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, I am in love with the art of storytelling. It is so fundamental to our nature as humans - and so necessary. Discovering new perspectives to share as well as new ways to share them is endlessly exciting to me, and the collaborative aspect to filmmaking, even more so. I want to dive in to how best to incorporate \u003cem\u003eyour \u003c/em\u003efeelings, \u003cem\u003eyour\u003c/em\u003e, opinions, and \u003cem\u003eyour \u003c/em\u003eexperiences to your performing arts. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eThis work has technique and craft, but ultimately, it is play. So it should be fun!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSome more about me: Besides movies, I love to read (currently halfway into Anna Karrenina), I LOVE maps (ask me about it!), I love dogs, and all kinds of music. My pet peeve is when only one of my hands is wet, and I'm not the biggest fan of bugs. I can't wait to get to know you!\u003c/p\u003e\u003cbr\u003e\u003cbr\u003e","teachingVideoPlaybackId":"zEL00VMPkQpwyhVLfmhnn2X1I7bfqsLjLuMUQOQ8oLtE","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI was in a TV show where I played Bruce Wayne/Batman on FOX for 5 years! It was a true honor to be trusted with such a beloved legacy.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a50f40e6-cb6c-40a5-a95c-e36ece40a153\"}"},{"__ref":"Favorites:{\"uuid\":\"d542ad00-d5ad-41e9-8657-8a4f6b5434f6\"}"},{"__ref":"Favorites:{\"uuid\":\"6bd7a136-8261-4ae5-b498-dd683bb53edb\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"7cd5e7cc-651f-483f-a9a3-d6e79060beaa\"}"},{"__ref":"CausesSupported:{\"uuid\":\"be0da216-70a7-4201-9862-3274ea12edb1\"}"}],"major":"Economics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"01603e47-b9bb-466f-957c-02ea89a2ad3d\"}"},{"__ref":"DeepDives:{\"uuid\":\"8c9e7e99-b64f-41f6-b4c9-c3f93d802dbc\"}"},{"__ref":"DeepDives:{\"uuid\":\"b9aedee9-8f4e-4354-84eb-21f7f0b83fee\"}"},{"__ref":"DeepDives:{\"uuid\":\"834708cb-59b4-4684-90c9-fa03ed796588\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/6d4aba62-366d-41c7-af9d-265950726c90/-/preview/-/format/jpg/","https://ucarecdn.com/32c3ec94-f8f3-4c40-8ffb-81bf1233a629/-/preview/-/format/jpg/","https://ucarecdn.com/c6c6bf3a-d6d3-4214-bac7-ea51292cd6d8/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"441
