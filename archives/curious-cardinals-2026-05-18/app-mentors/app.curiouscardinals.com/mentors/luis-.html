xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"546d62a8-2c76-41f4-9c27-99ee9a52aa54\"}":{"__typename":"Favorites","uuid":"546d62a8-2c76-41f4-9c27-99ee9a52aa54","photoUrl":"https://ucarecdn.com/6defcbf3-06ad-43c2-a9ee-366f854ba574/","title":"DeBÍ TiRAR MáS FOToS - Bad Bunny","type":"ALBUM"},"Favorites:{\"uuid\":\"b3db8dac-d853-4c31-b031-ae659a59d526\"}":{"__typename":"Favorites","uuid":"b3db8dac-d853-4c31-b031-ae659a59d526","photoUrl":"https://ucarecdn.com/6463e8f2-a0cb-41c0-a77c-48430c15612f/","title":"Soccer","type":"SPORT"},"Favorites:{\"uuid\":\"6230c8e4-8a9a-43f8-bec6-8ab6835d9037\"}":{"__typename":"Favorites","uuid":"6230c8e4-8a9a-43f8-bec6-8ab6835d9037","photoUrl":"https://ucarecdn.com/9850e228-43ae-416c-b649-7ba89aa18b75/","title":"New York City","type":"CITY"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ce11fa73-e966-4809-b2f3-ad0e6e29371d\"}":{"__typename":"DeepDives","uuid":"ce11fa73-e966-4809-b2f3-ad0e6e29371d","content":"\u003cp\u003eMentorship matters to me because I know what it feels like to be lost, unmotivated, or simply unsure of yourself.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve been really fortunate in my life. I had parents who, even without speaking English fluently, taught me discipline and resilience. I had teachers who pushed me when I doubted myself. I had mentors who showed me that feeling lost doesn’t mean you’re failing — it just means you’re growing. Over time, I learned something powerful: success isn’t about always accomplishing, it’s about building skills, habits, and perspective that can carry you through the days when you don’t want to wake up for school or do that project that's due tomorrow.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThere were definitely moments when I felt overwhelmed. Balancing academics, leadership roles, family responsibilities, and the pressure of being a first-generation student was not an easy feat. But I learned how to manage my time, how to break big goals into small steps, and how to keep moving forward even when I didn’t feel confident. Those skills changed everything for me.\u003c/p\u003e\u003cp\u003eMentorship matters to me because not everyone gets those tools early on, it took me years to just grasp them. And sometimes all it takes is one person saying, “You’re not behind. You just need a strategy,” or “You’re more capable than you think.”\u003c/p\u003e\u003cp\u003eI don’t see mentorship as just helping someone get better grades. I see it as helping someone build the mindset and discipline that lasts long after the test is over. If I can give even one student the clarity and confidence that others gave me, that’s worth it to me.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSo I got you, no matter where you are. I can't judge you over a Zoom call, but I can try my best to be your helping friend. Promise.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"e2260ef0-fad7-4dd7-87c1-8d9c71397e1c\"}":{"__typename":"DeepDives","uuid":"e2260ef0-fad7-4dd7-87c1-8d9c71397e1c","content":"\u003cp\u003eI’m the son of Salvadorian parents who immigrated to the U.S. without speaking a lick of English, and growing up, I was often the bridge between them and the country we now lived in. Translating documents, explaining school systems, and navigating spaces my parents hadn’t experienced themselves quickly became my job and while it was a little burdensome, it taught me two things early on: how to explain complex ideas clearly, and how to be patient with people who feel lost, even though it isn't their fault that they feel that way.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen you’re helping someone understand something in a second language — or in a system that feels unfamiliar — you learn quickly that clarity matters more than sounding impressive. I try not to overcomplicate things, instead, I break them down, check for understanding, and adapt to how someone learns best (Like explaining to my dad how my coding projects work using familiar Construction terminology and examples).\u003c/p\u003e\u003cp\u003eBeing a first-generation student also means I understand what it feels like to walk into rooms where you’re not sure if you belong. That experience makes me especially attentive to confidence (mainly lack thereof). If a student is quiet, hesitant, or doubting themselves, I can notice. And I don’t interpret that as lack of ability, trust me I've been there. I see it as something we can work through together.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy identity also instilled in me a deep respect for discipline and responsibility. I grew up balancing academics with family obligations, church involvement, and leadership roles. That balance influences how I mentor — I emphasize structure, time management, and resilience, but I also lead with empathy.\u003c/p\u003e\u003cp\u003eAt the end of the day, my background taught me that education is a privilege and a pathway. I don’t take it lightly, and I don’t let my students take their potential lightly either. But don't worry, I won't make it too hard :)\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"abe0e2b8-2865-402b-bab1-c51be5394dba\"}":{"__typename":"DeepDives","uuid":"abe0e2b8-2865-402b-bab1-c51be5394dba","content":"\u003cp\u003eI love this question because it gives me a chance to share who I am outside of academics. I take school and mentoring seriously, but I also really believe in having balance and enjoying life. I'm not a complete nerd!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of my biggest hobbies is gaming. After I finish my work, or when I need a short mental break, I like playing anything from action, racing, competitive, sports, and story-based games. It’s a fun way to relax, stay connected with my friends back home, and recharge.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m also a big music fan. I listen to music while studying, working out, or even doing chores-basically anytime I can. I love discovering new artists and making playlists, so I’m always happy to share recommendations!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eSoccer has been a big part of my life too. I’ve played since I can remember and still try to play whenever I can. It’s a little harder to find space in NYC, but I love the sport and the teamwork and discipline that come with it.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI also enjoy exploring the city and trying new things. Sometimes that means checking out a pop-up event a friend told me about or taking a spontaneous ferry ride to see the Statue of Liberty after finding affordable tickets. I like making the most of where I live and saying yes to new experiences. (Pssst, that means I have lots of fun stories to tell, so ask me anything!)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOverall, I believe in working hard, staying curious, and enjoying the journey. I always encourage people to work hard and then enjoy their free time doing something fun, even if it isn't something \"productive.\" You earned it. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m always happy to connect with students about their interests, whether that’s academics, hobbies, or just figuring out life in general! Ask me anything.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"c235884d-59a1-4894-84ee-4ba81bc7d8c8\"}":{"__typename":"School","uuid":"c235884d-59a1-4894-84ee-4ba81bc7d8c8","name":"Patchogue-Medford High School","city":"Medford","type":"HIGH","state":"New York","country":"United States","zip":"11763"},"Education:{\"uuid\":\"3b33c0c2-a80c-4eda-a1a8-1261dfc5731a\"}":{"__typename":"Education","uuid":"3b33c0c2-a80c-4eda-a1a8-1261dfc5731a","school":{"__ref":"School:{\"uuid\":\"c235884d-59a1-4894-84ee-4ba81bc7d8c8\"}"},"startYear":"2021","endYear":"2025","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"2f4aab3a-0cd1-4233-a577-512251314c9a\"}":{"__typename":"Education","uuid":"2f4aab3a-0cd1-4233-a577-512251314c9a","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2025","endYear":null,"expectedGradYear":"2029","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"9b6eb7fd-4c95-48ac-91b4-6ec0f01a7bb2\"}":{"__typename":"MentorPublicProfile","uuid":"9b6eb7fd-4c95-48ac-91b4-6ec0f01a7bb2","displayName":"Luis H.","slug":"luis-","biography":"\u003cp\u003eHey, I’m Luis! A Columbia University student, lifelong tech enthusiast, and someone who genuinely believes that every student is capable of more than they think.\u003c/p\u003e\u003cp\u003eIf you’re a parent reading this: I take mentorship seriously.\u003cbr\u003eIf you’re a student reading this: I pinky promise I’m not boring lol.\u003c/p\u003e\u003cbr\u003e\u003ch2\u003e🎓 Academic Background \u0026amp; Achievements\u003c/h2\u003e\u003cp\u003eI am currently a student at \u003cstrong\u003eColumbia University\u003c/strong\u003e, where I continue to pursue my passion for computer science and problem-solving.\u003c/p\u003e\u003cp\u003eSome highlights of my academic journey:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e🥇 \u003cstrong\u003e1st Place – NY Statewide Science Fair\u003c/strong\u003e for developing a \u003cstrong\u003ePython-based facial recognition application\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e🏅 \u003cstrong\u003eNational award recipient in Model United Nations debate\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e📊 Conducted formal \u003cstrong\u003eresearch on Artificial Intelligence and its impact on education at Brookhaven National Laboratory\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e📚 Graduated Top 7 in my class (670 kids) with a strong academic record\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e🧠 Held multiple \u003cstrong\u003eleadership roles in academic and service organizations\u003c/strong\u003e\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eBut beyond awards, what defines me is my determination. I’ve always tried to push myself to go further than what seems possible. \u003c/p\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003e\u003cu\u003eWhat I Specialize In:\u003c/u\u003e\u003c/strong\u003e\u003c/h2\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eComputer Science \u0026amp; STEM Mentorship\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePython programming (beginner → intermediate)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding real-world projects from ideas\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAI \u0026amp; machine learning fundamentals (conceptual level)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eAcademic Coaching \u0026amp; Study Skills\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eMath (middle school → early college)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStructured problem-solving\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTime management systems\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding academic confidence\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePreparing for competitive environments\u003c/p\u003e\u003cbr\u003e\u003cp\u003e\u003cstrong\u003ePassion Project Mentorship\u003c/strong\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI specialize in helping students \u003cstrong\u003edesign, build, and execute meaningful projects\u003c/strong\u003e — whether that’s:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eA coding app\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eA research paper\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eA STEM competition entry\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eOr a long-term independent project of any field they love. (Let me help them find their spark!)\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eAs someone who has successfully turned ideas into award-winning outcomes, I can guide students step-by-step through ideation, execution, iteration, and presentation without making it my project instead of theirs.\u003c/p\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eWhy I’m Qualified to Mentor:\u003c/strong\u003e\u003c/h2\u003e\u003cp\u003eBeing good at something doesn’t automatically mean you can teach it well — and I get that. I've also been that student that has had no motivation to study or work before. I know how it can feel to be \u003cstrong\u003e\u003cem\u003ecompletely unmotivated or lost,\u003c/em\u003e\u003c/strong\u003e and I've gotten out of those trenches before, allowing me to help others who may be going through it right now.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve also spent years tutoring and mentoring students from different backgrounds, including first-generation and ESL learners. I’ve supported classmates through difficult coursework, helped students regain confidence after struggling, and worked in leadership positions where people relied on me for structure and clarity. As an older brother and someone who grew up helping my own family navigate academics in a new environment, I’ve also developed patience, empathy, and adaptability.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eA session with me can typically look like:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eBreaking concepts into clear, manageable steps\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePracticing actively (not just passive listening)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBuilding problem-solving frameworks\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eSetting clear goals and tracking improvement\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eEnding with confidence — not confusion\u003c/p\u003e\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eI try to balance high expectations with real support. I challenge students, but never leave them feeling lost (I stole this learning approach from my Hispanic dad).\u003c/p\u003e\u003cbr\u003e\u003ch2\u003e\u003cstrong\u003eBeyond Academics: \u003c/strong\u003e\u003cem\u003eI'm not a total nerd tho!\u003c/em\u003e\u003c/h2\u003e\u003cp\u003eOutside of the classroom I love to play video games, listen to tons of music (definitely ask me for recommendations), and play sports with my cousins. Here are some highlights:\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFavorite games:\u003c/strong\u003e Fortnite, Call of Duty, Battlefield, any racing game, FIFA/EA Sports FC, Mario games, Minecraft, Roblox, basically anything tbh!\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003e\u003cstrong\u003eFavorite music:\u003c/strong\u003e All sorts of Latin music (As a Salvadoran I'm biased), R\u0026amp;B, Rap, House, EDM, and some Pop\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eBesides my fluency in Spanish, I’ve \u003cstrong\u003estudied French\u003c/strong\u003e for years and am semi-proficient.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI love \u003cstrong\u003esoccer/football \u003c/strong\u003eand have played it since I was 5 years old.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI'm a huge \u003cstrong\u003efoodie \u003c/strong\u003eand am always looking for new yummy treats to try\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eI love building \u003cstrong\u003eLegos\u003c/strong\u003e, \u003cstrong\u003etravelling \u003c/strong\u003ewhenever I have the chance, and helping people with whatever I can (doesn't have to be academic).\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cbr\u003e\u003cp\u003eIf you’re a parent: your child’s growth — academically and personally — will be my priority, while also making sure they don't hate our sessions.\u003c/p\u003e\u003cp\u003eI believe mentorship isn’t just about grades, it’s about helping your children build the confidence, discipline, and skillset to succeed long after our sessions end.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd hey, if you're the student in this scenario, I promise I won't be a boring teacher. I know my bios and videos are a little corny (they made me tailor them to parents 😭🙏) but trust me, once we get to know each other it'll be much more chill.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf that sounds like what you’re looking for, I’d love to work with you! God bless y'all :)\u003c/p\u003e","teachingVideoPlaybackId":"UpHyxNDbca15ryAdSwVnpGQDdQsjJGeGEODNj54MYSY","teachingVideoDescription":null,"gr
