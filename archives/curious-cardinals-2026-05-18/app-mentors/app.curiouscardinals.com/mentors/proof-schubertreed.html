xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"3cf9e694-edf6-48f7-801e-bd5a86d58f06\"}":{"__typename":"DeepDives","uuid":"3cf9e694-edf6-48f7-801e-bd5a86d58f06","content":"\u003cp\u003eTo me, learning isn't just about expanding your knowledge or honing new skills. It's personal. Whether it be close-reading 19th century literature or making movies, I've always felt that my strongest academic work has happened when I bring myself to the table —\u0026nbsp;why else are we learning at all? And it's impossible to bring yourself to your work if you don't have someone rooting for you and celebrating who you are. I believe the power of mentorship is not only to provide structure and support in one-on-one projects; it is to celebrate the individual student and make them feel that what they bring to the table matters —\u0026nbsp;because it does!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"26fe27a5-b002-44e5-bd37-6e8be441d4cd\"}":{"__typename":"Education","uuid":"26fe27a5-b002-44e5-bd37-6e8be441d4cd","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"English \u0026 Film","degree":"Bachelors"},"School:{\"uuid\":\"9a8872d0-f677-4d78-9184-b671bc342fd9\"}":{"__typename":"School","uuid":"9a8872d0-f677-4d78-9184-b671bc342fd9","name":"Hunter College Campus Schools","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10128"},"Education:{\"uuid\":\"5edd99c6-898a-419f-973f-420865101c3f\"}":{"__typename":"Education","uuid":"5edd99c6-898a-419f-973f-420865101c3f","school":{"__ref":"School:{\"uuid\":\"9a8872d0-f677-4d78-9184-b671bc342fd9\"}"},"startYear":"2015","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"MentorPublicProfile:{\"uuid\":\"ffacceb9-1995-47fb-a2a1-b05fac4b4b3c\"}":{"__typename":"MentorPublicProfile","uuid":"ffacceb9-1995-47fb-a2a1-b05fac4b4b3c","displayName":"Proof S.","slug":"proof-schubertreed","biography":"Proof is a sophomore at Harvard concentrating in English with a joint in Art, Film, and Visual Studies on the Film and Video Production track. In and outside of class, Proof is passionate about writing and making movies. She serves on the executive board and the Features board of the Harvard Advocate, the oldest continuously published college lit mag in the country. Proof also serves on the board of the Crimson Key Society, Harvard’s premier social service organization, co-organizing over 100 volunteers for Harvard’s freshman orientation.\n\nProof has always been passionate about working with younger people. In high school, she tutored peers in writing and math and taught piano to younger students from her neighborhood in Brooklyn, New York. She spent summers volunteering with New York’s largest women’s and children’s shelter, and tutoring underserved students in New York’s public school system.\n\nProof plans to pursue a career in filmmaking/writing, and she loves doing creative work in her free time. At the Advocate, she produces a live-recorded living room concert series which she founded as a first-year—the first of its kind. She has interned with film production companies, acted in student films and productions, and she is a published writer in The Crimson, The Independent, and New York Magazine. In her free time, Proof loves to play piano, take photos, talk about movies and plays, play tennis, and cook with friends!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"English \u0026 Film","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"3cf9e694-edf6-48f7-801e-bd5a86d58f06\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/8016dc69-1596-416d-bc2e-b82a37b9a9d0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"26fe27a5-b002-44e5-bd37-6e8be441d4cd\"}"},{"__ref":"Education:{\"uuid\":\"5edd99c6-898a-419f-973f-420865101c3f\"}"}],"hiredAt":"2023-05-03T16:14:51.953Z","topics":["Video / Photography","Literature","Film / Theater","Creative Writing","Reading","Writing"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"proof-schubertreed\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"ffacceb9-1995-47fb-a2a1-b05fac4b4b3c\"}"}}},"_sentryTraceData":"45cc8d532c88445390b9c7944d48b725-a0c28757e1c3b774-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=45cc8d532c88445390b9c7944d48b725,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"proof-schubertreed"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d
