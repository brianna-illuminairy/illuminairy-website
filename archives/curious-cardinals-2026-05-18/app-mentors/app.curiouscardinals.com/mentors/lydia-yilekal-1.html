xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"07b5c748-62f9-40d7-8fbb-59ecd5d01af2\"}":{"__typename":"DeepDives","uuid":"07b5c748-62f9-40d7-8fbb-59ecd5d01af2","content":"\u003cp\u003eI know that ambition is an integral component to success, but ambition without guidance is not optimal. To me, having a solid support network is the key to propelling yourself in professional, academic, and personal aspects of your life. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"34ca6ddb-d3d0-42cf-912a-241422628a04\"}":{"__typename":"DeepDives","uuid":"34ca6ddb-d3d0-42cf-912a-241422628a04","content":"\u003cp\u003eIn 2020, I started a business with my friend called Posse Empowerment: https://www.posseempowerment.com/\u003c/p\u003e\u003cbr\u003e\u003cp\u003eFeel free to check it out above! Essentially, we catered our services towards the engagement, empowerment, and education of young women and women of color in the fields of STEAM. We curated our own curriculums within STEAM, and added a hands on twist, something that's lacking in STEAM education. We had an organized structure of Curriculum Development, Program Coordinators, Project Managers, Big Buddies, and Little Buddies. We were sponsored by Jacobs Engineering, Micron Technologies, and Amazon. This was one of my biggest accomplishments thus far, and I'd love to talk more about it, as well as potentially guide you in a STEM, business-oriented passion project.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"4cba963b-7506-455c-8d86-7229fde97c32\"}":{"__typename":"School","uuid":"4cba963b-7506-455c-8d86-7229fde97c32","name":"Osbourn Park High School","city":"Manassas","type":"HIGH","state":"Virginia","country":"United States","zip":"20111"},"Education:{\"uuid\":\"6afb358e-5eed-4cfc-aff8-124bbdb68ef7\"}":{"__typename":"Education","uuid":"6afb358e-5eed-4cfc-aff8-124bbdb68ef7","school":{"__ref":"School:{\"uuid\":\"4cba963b-7506-455c-8d86-7229fde97c32\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"24108f2e-2561-478e-ae1d-45c734a5ce48\"}":{"__typename":"Education","uuid":"24108f2e-2561-478e-ae1d-45c734a5ce48","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Materials Science \u0026 Engineering","degree":null},"MentorPublicProfile:{\"uuid\":\"7871aa57-2769-45bc-ac95-7b2d9863f761\"}":{"__typename":"MentorPublicProfile","uuid":"7871aa57-2769-45bc-ac95-7b2d9863f761","displayName":"Lydia Y.","slug":"lydia-yilekal-1","biography":"\u003cp\u003eHi! My name is Lydia, and I am currently a junior in Cornell's Engineering School. I major in Materials Science and Engineering and minor in the Dyson's Business minor for Engineers. In the future, I plan on going into anything energy, product development, and sustainability-related. However, I love the versatility of materials, and see myself open to a plethora of areas (textiles, cars, construction, etc). To supplement my engineering background, I also aim to work towards my MBA and have long term involvements with Global Supply Chain Management/Materials Science. Throughout high school, I worked as a Kumon teaching assistant, helping K-12 students in mathematics and English. In college, I tutored students in various STEM subjects as well as English grammar. I have 3 years of tutoring/mentoring experience under my belt and I am sure I will provide the best assistance to you! In my free time, I love to cook and learn new recipes. I am a big family person, so I try to relish time with my family as often as possible. At Cornell, I am involved with the Ethiopian-Eritrean Student Association and perform Ethiopian cultural dance. I love youth, so on the weekends, I mentor an Ethiopian adoptee in the Ithaca area. I read with her, teach her about Ethiopian culture, and serve as a big sister to her. I am an active member of the National Society of Black Engineers, and do my best to serve as a valuable school member. In addition, I am a Ryan Scholar at Cornell, so I have to uphold academic responsibilities to ensure I am representing my role well. That's a little bit about me, and I am so excited to meet you!\u003c/p\u003e","teachingVideoPlaybackId":"AUbColS8CisSl7LuqcN3tVdAvm5601YlnU3WAg3w2L1o","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Materials Science \u0026 Engineering","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"07b5c748-62f9-40d7-8fbb-59ecd5d01af2\"}"},{"__ref":"DeepDives:{\"uuid\":\"34ca6ddb-d3d0-42cf-912a-241422628a04\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/450c8a4e-4538-4862-8bcc-e24f84a145e0/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"6afb358e-5eed-4cfc-aff8-124bbdb68ef7\"}"},{"__ref":"Education:{\"uuid\":\"24108f2e-2561-478e-ae1d-45c734a5ce48
