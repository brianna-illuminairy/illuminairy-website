xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"9f3216a7-3c0a-4d8d-a46d-98b7e97bdf7a\"}":{"__typename":"Favorites","uuid":"9f3216a7-3c0a-4d8d-a46d-98b7e97bdf7a","photoUrl":"https://ucarecdn.com/d7aa991d-b9f7-4e5a-ac93-b1c08d4005a8/","title":"2001: A Space Odyssey","type":"MOVIE"},"Favorites:{\"uuid\":\"661b68ce-fc2d-4d41-8e27-df03f9179d66\"}":{"__typename":"Favorites","uuid":"661b68ce-fc2d-4d41-8e27-df03f9179d66","photoUrl":"https://ucarecdn.com/0aeccb6f-24f8-4f6c-805d-ddfb0ab1ffc3/","title":"1AM FREESTYLE","type":"SONG"},"Favorites:{\"uuid\":\"1998df56-ae6d-4f91-949f-2e786d31d22b\"}":{"__typename":"Favorites","uuid":"1998df56-ae6d-4f91-949f-2e786d31d22b","photoUrl":"https://ucarecdn.com/8134ef1a-4ba8-46a6-9268-d4c32866f90d/","title":"Exhalation, by Ted Chiang","type":"BOOK"},"CausesSupported:{\"uuid\":\"ea29e112-4157-479b-b888-7d54876c391e\"}":{"__typename":"CausesSupported","uuid":"ea29e112-4157-479b-b888-7d54876c391e","name":"SF-Marin Food Bank","description":"","photoUrl":"https://ucarecdn.com/f889d0a3-c890-4bca-86a4-1b2107db49a9/"},"CausesSupported:{\"uuid\":\"d8dc6ceb-083d-4dd1-9720-4361cd25db6b\"}":{"__typename":"CausesSupported","uuid":"d8dc6ceb-083d-4dd1-9720-4361cd25db6b","name":"Gold House","description":"","photoUrl":"https://ucarecdn.com/d4735500-4df3-472f-b8ca-f8f5b06809ba/"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"086452fb-dcdd-4b78-9c3c-bfef714b9bc9\"}":{"__typename":"DeepDives","uuid":"086452fb-dcdd-4b78-9c3c-bfef714b9bc9","content":"\u003cp\u003eI'm living it! \u003cbr\u003e\u003cbr\u003eMore specifically, I'm in love with what I'm doing right now, and regardless of 'fancy' titles and pedigrees, I want to make sure I continue to be levered in high impact, high visibility, and purposeful work. \u003cbr\u003e\u003cbr\u003eI'm currently the Chief of Staff @Forage, an early stage, venture-backed startup that's on a mission to modernize the social safety net. We do so by building payments infrastructure that enables SNAP (formerly known as food stamps) recipients to use their benefits \u003cem\u003eonline\u003c/em\u003e with their retailer or platform of choice. It's like Stripe or PayPal, but for complex, highly regulated government benefits!\u003cbr\u003e\u003cbr\u003eTo make a long story short, a 'dream job' is any job that lets me shape a mission + vision that deeply resonates with me, and in a position of leadership where I can partner with others on solving challenging problems as a team. It is an extraordinary privilege to be a part of the Forage team, and to also be part of the mentor network of another mission-driven organization: Curious Cardinals!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}":{"__typename":"Question","uuid":"2895fb2e-c1c1-497b-835a-39af697ad165","question":"What were you like as a middle school student / a high school student?"},"DeepDives:{\"uuid\":\"ad886073-03a9-4d22-8a4b-cb0ecf2249f5\"}":{"__typename":"DeepDives","uuid":"ad886073-03a9-4d22-8a4b-cb0ecf2249f5","content":"\u003cp\u003eAwful. Absolutely awful.\u003cbr\u003e\u003cbr\u003eMy parents can share war stories with you, I'm certain. \u003cbr\u003e\u003cbr\u003eAs a quick snap-shot: I flunked out of middle school, got suspended (twice) in high school, and probably spent more time playing video games (and watching people play video games) than actually studying or doing homework.\u003cbr\u003e\u003cbr\u003eThese experiences seriously compelled me to reflect on who I am, what I wanted to be, and how I could get there. People are always surprised when they get to know me, but I wouldn't be who I am without having struggled, and having learned from my mistakes.\u003cbr\u003e\u003cbr\u003eMore importantly, I want you to know that YOU can be successful, no matter what other people say or think. Nothing is set in stone, but it does take a village to move a mountain. Mentors and coaches can bring the best in us, and if things seem hopeless; there are \u003cem\u003ealways\u003c/em\u003e others that will give you a hand. Myself included.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"2895fb2e-c1c1-497b-835a-39af697ad165\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"ce078d06-172e-4aa8-897f-73cace7b1739\"}":{"__typename":"DeepDives","uuid":"ce078d06-172e-4aa8-897f-73cace7b1739","content":"\u003cp\u003eI wouldn't be where I am today without my mentors.\u003cbr\u003e\u003cbr\u003eI grew up in a cramped 1BR apartment, and was among the first in my family to receive a college education. When I entered college, I had \u003cem\u003eno\u003c/em\u003e idea what to expect, and how to make the most of an exciting, but terrifyingly alien, world.\u003cbr\u003e\u003cbr\u003eI wish I had found mentors at a younger age, and I wish I had known that the path to success isn't as 'linear' or straightforward as most expect. My mentors taught me that it's okay to not always have the right answers, that it's okay to not know what direction is right or wrong. My mentors brought the best out of me, and taught me to appreciate my strengths, recognize my weaknesses, and tactically work together to bring the best in me personally, academically, and professionally.\u003cbr\u003e\u003cbr\u003eI wouldn't be where I am if others didn't take a chance on me. And it's a personal conviction of mine to pay it forward, and champion the next generation of students and leaders.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"482a5ab2-4296-4416-b3a8-6724b82dcfcc\"}":{"__typename":"DeepDives","uuid":"482a5ab2-4296-4416-b3a8-6724b82dcfcc","content":"\u003cp\u003eAsian Americans are stereotyped to be quiet, studious, and hard-working. Growing up, I was anything \u003cem\u003ebut\u003c/em\u003e.\u003cbr\u003e\u003cbr\u003eI was terrible at math (until I realized that thinking so was enabling a self-fulfilling prophecy, and I began excelling at it in college). My attention span barely edged that of a goldfish (until I learned to love the process of learning itself, and stop stressing over temporary markers like grades and finals).\u003cbr\u003e\u003cbr\u003eTo make a long story short: I know what it's like to be boxed in. What it feels like to be trapped in a body and mindset that isn't truly your own, to not be allowed to be your own person.\u003cbr\u003e\u003cbr\u003eI strive to be as empathetic and supportive as possible, recognizing that there is extraordinary potential in each and all of us. To unlock it requires actively listening to your wants + needs, identifying your strengths + weaknesses, and establishing psychological trust. I want you to know that when we work together, I unconditionally have your back, and it's a partnership for life.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"School:{\"uuid\":\"bda13760-2722-4ea8-95b9-d38398836cf6\"}":{"__typename":"School","uuid":"bda13760-2722-4ea8-95b9-d38398836cf6","name":"Miramonte High School","city":"Orinda","type":"HIGH","state":"California","country":"United States","zip":"94563"},"Education:{\"uuid\":\"308cb951-dfbc-4afd-9f2f-cb76caa369f4\"}":{"__typename":"Education","uuid":"308cb951-dfbc-4afd-9f2f-cb76caa369f4","school":{"__ref":"School:{\"uuid\":\"bda13760-2722-4ea8-95b9-d38398836cf6\"}"},"startYear":"2012","endYear":"2016","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"14557a82-6686-4ac8-9c6c-e954c6d343f9\"}":{"__typename":"Education","uuid":"14557a82-6686-4ac8-9c6c-e954c6d343f9","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2016","endYear":null,"expectedGradYear":"2020","major":"Business Administration","degree":null},"MentorPublicProfile:{\"uuid\":\"ab9ee3a8-1214-4ef1-b90c-b142a695d62d\"}":{"__typename":"MentorPublicProfile","uuid":"ab9ee3a8-1214-4ef1-b90c-b142a695d62d","displayName":"Bryan W.","slug":"bryan-wang","biography":"\u003cp\u003eHello! I'm Bryan, a Cal grad with a B.S. in Business Administration and minors in Public Policy and Computer Science. I got kicked out of elementary school, was suspended (twice) in high school ... and ultimately got on my feet  because because my mentors took a chance on me, and helped me unleash my true potential.\u003cbr\u003e\u003cbr\u003eI'm currently the Chief of Staff @Forage, a startup on a mission to modernize the social safety net. Think Stripe or PayPal, but for complex, highly regulated government benefits! We help merchants accept payment methods like SNAP (formerly known as food stamps) and EBT Cash (also known as welfare checks), so families in need can shop with their merchant of choice.\u003cbr\u003e\u003cbr\u003eI was previously a Product Manager @Google, where I helped launch Google Wallet and scaled our consumer app from 0 -\u0026gt; 100 million users in 6 months. Before Google and throughout college, I worked part-time at Taco Bell, interned at an investment bank, sold a startup to Facebook (now Meta), and got a C in Finance (go figure). In high school, my sole pride and joy was competitive Speech \u0026amp; Debate (2nd place NX CA State Championship, Stanford Invitational Champion in NX and IX, etc.), and in middle school I learned that Play-Doh is, in fact, not edible. Time flies!\u003cbr\u003e\u003cbr\u003eSpeaking of time, in my free time I enjoy reading, lifting, backpacking, and exploring new foodie spots in the Bay Area and beyond. I'm a fintech and futurist geek, and enjoy hosting and attending dinners throughout the Bay with founders, operators, investors, and creatives. I also \u003cem\u003eprobably\u003c/em\u003e most definitely spend too much time on the internet.\u003cbr\u003e\u003cbr\u003eI wouldn't be where I am today without my mentors, and I'm here to support you on your journey of a lifetime. Let's chat!\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI recently joined the 1K Club (combined bench, deadlift, and squat \u0026gt; 1,000 pounds), and am hitting 275 lb. bench, 405 lb. deadlift, and 365 lb. squat. \u003cbr\u003e\u003cbr\u003eLifting has been incredible not only for my physical health, but also for my mental and emotional health as well. It has challenged me to surpass my limits, and push my comfort zone. I've applied this fresh confidence in my everyday work and life, and find myself more excited to meet new people, learn new things, and tackle new challenges. And contrary to what you may expect, my joints and lower back have literally never felt better (except after a PR day, when the adrenaline wears out and I hobble around for the next 24 hours or so).\u003cbr\u003e\u003cbr\u003eIt's crazy how 'lifting' got me to rethink myself and what I was capable of, and I absolutely encourage everybody to get into fitness! It most certainly doesn't have to involve throwing around weights like a Neanderthal; running, yoga, team sports, pretty much anything can help you strengthen your body and sharpen your mind!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"9f3216a7-3c0a-4d8d-a46d-98b7e97bdf7a\"}"},{"__ref":"Favorites:{\"uuid\":\"661b68ce-fc2d-4d41-8e27-df03f9179d66\"}"},{"__ref":"Favorites:{\"uuid\":\"1998df56-ae6d-4f91-949f-2e786d31d22b\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"ea29e112-4157-479b-b888-7d54876c391e\"}"},{"__ref":"CausesSupported:{\"uuid\":\"d8dc6ceb-083d-4dd1-9720-4361cd25db6b\"}"}],"major":"Business Administration","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"086452fb-dcdd-4b78-9c3c-bfef714b9bc9\"}"},{"__ref":"DeepDives:{\"uuid\":\"ad886073-03a9-4d22-8a4b-cb0ecf2249f5\"}"},{"__ref":"DeepDives:{\"uuid\":\"ce078d06-172e-4aa8-897f-73cace7b1739\"}"},{"__ref":"DeepDives:{\"uuid\":\"482a5ab2-4296-4416-b3a8-6724b82dcfcc\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5f5cf6c1-c42e-4973-8c2a-f709793f727e/-/preview/-/format/jpg/","https://ucarecdn.com/aca23820-4453-4082-9511-8d712a4811e0/-/preview/-/format/jpg/","https://ucarecdn.com/cdb6aebc-3efd-4ef1-958b-0e3585963978/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"308cb951-dfbc-4afd-9f2f-cb76caa369f4\"}"},{"__ref":"Education:{\"uuid\":\"14557a82-6686-4ac8-9c6c-e954c6d343f9\"}"}],"hiredAt":"2023-10-12T09:01:05.555Z","topics":["Writing","Academic Coaching","Executive Function","College Essay Writing","Economics"],"communityBadges":["https://ucarecdn.com/3b3dc2a7-8666-4e9f-b213-f0c2b48a7c41/","https://ucarecdn.com/c278d819-50e0-435a-a1b0-1b3a8793462f/","https://ucarecdn.com/5099ab5c-f86d-469a-9fa2-facbfd6b6107/","https://ucarecdn.com/9a4c114f-3114-4d6c-908a-b4d35953934d/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typena
