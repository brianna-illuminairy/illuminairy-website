xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"7e0371ea-0189-42cb-b506-92892bf0e6b9\"}":{"__typename":"Favorites","uuid":"7e0371ea-0189-42cb-b506-92892bf0e6b9","photoUrl":"https://ucarecdn.com/db75d608-bb12-4afe-a8c4-96c45f11417e/","title":"The Strokes","type":"ARTIST"},"Favorites:{\"uuid\":\"2a4b9f77-8202-4d83-8421-6bcb5743c514\"}":{"__typename":"Favorites","uuid":"2a4b9f77-8202-4d83-8421-6bcb5743c514","photoUrl":"https://ucarecdn.com/51010b2c-96a5-4647-9583-236c6a36ad74/","title":"Noah Lyles","type":"ATHLETE"},"Favorites:{\"uuid\":\"7a7aeedc-2bdf-4e6a-b093-e11cc6725748\"}":{"__typename":"Favorites","uuid":"7a7aeedc-2bdf-4e6a-b093-e11cc6725748","photoUrl":"https://ucarecdn.com/3dafb420-2934-4623-8e59-c8d8763bfd6d/","title":"The Count of Monte Cristo","type":"BOOK"},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"baf88dc5-7185-48fc-8f81-23842ef8bbf9\"}":{"__typename":"DeepDives","uuid":"baf88dc5-7185-48fc-8f81-23842ef8bbf9","content":"\u003cp\u003eMentorship is incredibly important to me as growing up with no strong mentor role in my life when it comes to academics, I struggled in school until I found this mentor. In the form of a student a couple years older than me in high school who continued to stay in touch with me after they graduated, this certain person helped me navigate my sophomore and junior years in terms of finding my own academic voice and passions. Not having this role in my life for the longest time but then finally having someone who I could turn to and talk to for any subject whether strictly academic or just adjacent like college applications really made me passionate about allowing others to feel the same. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"ebf156a3-cfc5-4306-aee0-13412b1df3a6\"}":{"__typename":"DeepDives","uuid":"ebf156a3-cfc5-4306-aee0-13412b1df3a6","content":"\u003cp\u003eI love nature and all things natural so I spent hours and hours each day during the summer outside. Even when I was working I would find ways to take outside serving shifts! I love swimming in rivers, going for hikes, having picnics with friends, going tubing in the river, and just sunbathing with a good book!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"bf9fa500-097f-4c8a-983c-ff536dd0acb3\"}":{"__typename":"DeepDives","uuid":"bf9fa500-097f-4c8a-983c-ff536dd0acb3","content":"\u003cp\u003eMe and one other friend worked to form the fastest growing club at Duke University within just a couple days! We spent hours and hours making posters, an Instagram, and setting up a GroupMe all for this spontaneous club centered around having Nerf gun fights and then eating charcuterie! It was initially just a fun little side project for us both, but within 48 hours we already had over 150 people interested in our club making it one of the top clubs number wise at Duke! I love passion projects and think whether they're serious or something as silly as a Nerf plus charcuterie club I'm all for them!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"School:{\"uuid\":\"f65e9c5c-bb34-450d-b8be-8d0b0b7f9448\"}":{"__typename":"School","uuid":"f65e9c5c-bb34-450d-b8be-8d0b0b7f9448","name":"Arlington Memorial High School","city":"Arlington","type":"HIGH","state":"Vermont","country":"United States","zip":"05250"},"Education:{\"uuid\":\"21aecd68-17c0-4000-93a6-d5cda88ba34b\"}":{"__typename":"Education","uuid":"21aecd68-17c0-4000-93a6-d5cda88ba34b","school":{"__ref":"School:{\"uuid\":\"f65e9c5c-bb34-450d-b8be-8d0b0b7f9448\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"380f2492-b388-4cfd-a838-76e840d08f54\"}":{"__typename":"Education","uuid":"380f2492-b388-4cfd-a838-76e840d08f54","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Environmental Chemistry","degree":null},"MentorPublicProfile:{\"uuid\":\"85618182-e094-4563-ade6-49614f2d257a\"}":{"__typename":"MentorPublicProfile","uuid":"85618182-e094-4563-ade6-49614f2d257a","displayName":"Owen E.","slug":"owen-emmons","biography":"\u003cp\u003eHi there! I’m a freshman at a Duke university in North Carolina, pursuing a degree in Chemistry with a focus on sustainable energy solutions. Growing up in a small town surrounded by nature, I have always had a deep connection to the outdoors and a commitment to environmental preservation. This passion is now a key driver in my academic pursuits where I hope to gain the skill set to develop efficient and cleaner energy methods that could help protect the ecosystems I love and grew up with. Through this passion I was a key component in starting many of our clubs in my high school and found myself leading a groundbreaking Environmental club in which we raised multiple thousands of dollars for climate research in Vermont and worked closely with representatives. The initiatives and programs begun by my club have spread across schools all across Vermont and have helped start important conversations in classrooms about understanding our impact on the climate across our whole lives. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy upbringing in a small rural town (technically a village!) with only 15 students in my graduating class has taught me resilience and independence. I very quickly learned to take charge of my own learning, navigating SAT prep up to a 1580 and college applications entirely on my own, so I know firsthand what it’s like to be a student getting ready for college without outside help. By getting myself through my own struggles in high school I have found a drive to help others gain the self confidence to work for themselves and be self sufficient. Today, this self-motivation shows in my dedication to my studies and my leadership in various clubs on campus, this is the same sense of leadership that I am to share with others. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhen I’m not working on my chemistry projects, you can find me running trails, skiing through whatever snow I can find in North Carolina, or baking for and with my friends; all hobbies that keep me grounded amidst my academic commitments. My involvement in outdoor, baking, and running clubs reflect my appreciation for both community and personal growth. I’m excited to bridge my love for nature with my passion for science, hoping my work in sustainable energy will make a meaningful impact on the environment and inspire others to cherish and protect the world around them. This is the same passion I hope to inspire in all of my mentees!\u003c/p\u003e","teachingVideoPlaybackId":"3gxsJQhEIKy93X4HurPVAtKreariTn7wFs00YSbUutII","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"7e0371ea-0189-42cb-b506-92892bf0e6b9\"}"},{"__ref":"Favorites:{\"uuid\":\"2a4b9f77-8202-4d83-8421-6bcb5743c514\"}"},{"__ref":"Favorites:{\"uuid\":\"7a7aeedc-2bdf-4e6a-b093-e11cc6725748\"}"}],"causesSupported":[],"major":"Environmental Chemistry","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"baf88dc5-7185-48fc-8f81-23842ef8bbf9\"}"},{"__ref":"DeepDives:{\"uuid\":\"ebf156a3-cfc5-4306-aee0-13412b1df3a6\"}"},{"__ref":"DeepDives:{\"uuid\":\"bf9fa500-097f-4c8a-983c-ff536dd0acb3\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/980bbbb1-ecaa-454f-8baf-0606b808da77/-/preview/-/format/jpg/","https://ucarecdn.com/7e5a4462-b3aa-4505-a151-820b17192049/-/preview/-/format/jpg/","https://ucarecdn.com/248bba96-56e1-478a-8e19-38144c260353/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"21aecd68-17c0-4000-93a6-d5cda88ba34b\"}"},{"__ref":"Education:{\"uuid\":\"380f2492-b388-4cfd-a838-76e840d08f54\"}"}],"hiredAt":"2024-11-12T19:30:28.709Z","topics":["Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","Pre-Algebra","K-5 Grade Math","6-8 Grade Science","Chemistry","Physics","Writing","College Essay Writing","Reading","Academic Coaching","History Project","Video / Photography","Creative Writing","Business / Entrepreneurship","Medicine / Health","STEM Project","Game Design","Sustainability","Public Speaking"],"communityBadges":["https://ucarecdn.com/c942d968-716c-4352-9dd1-9c8441a54458/","https://ucarecdn.com/d671de38-8c18-4328-90d8-41f2ed49131c/","https://ucarecdn.com/adbffd69-3d64-47a0-87a0-f390edfdd2fa/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"owen-emmons\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"85618182-e094-4563-ade6-49614f2d257a\"}"}}},"_sentryTraceData":"1b1c50b41
