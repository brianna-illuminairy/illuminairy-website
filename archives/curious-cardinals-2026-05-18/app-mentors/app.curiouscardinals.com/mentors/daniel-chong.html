xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"457f1f16-ff7b-48a7-8dff-a69f6fdfc91c\"}":{"__typename":"School","uuid":"457f1f16-ff7b-48a7-8dff-a69f6fdfc91c","name":"Oakton High School","city":"Vienna","type":"HIGH","state":"Virginia","country":"United States","zip":"22181"},"Education:{\"uuid\":\"a08b5fd8-b1ba-4e2f-a0fe-6779e4f3c43c\"}":{"__typename":"Education","uuid":"a08b5fd8-b1ba-4e2f-a0fe-6779e4f3c43c","school":{"__ref":"School:{\"uuid\":\"457f1f16-ff7b-48a7-8dff-a69f6fdfc91c\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}":{"__typename":"School","uuid":"ec153d4b-e611-485f-aa31-74bdabfdf5c3","name":"Princeton University","city":"Princeton","type":"COLLEGE","state":"New Jersey","country":"United States","zip":"08544"},"Education:{\"uuid\":\"87771420-f731-48a0-b0f3-154247aab3bc\"}":{"__typename":"Education","uuid":"87771420-f731-48a0-b0f3-154247aab3bc","school":{"__ref":"School:{\"uuid\":\"ec153d4b-e611-485f-aa31-74bdabfdf5c3\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Public and International Affairs (Public Policy)","degree":null},"MentorPublicProfile:{\"uuid\":\"d7b6df03-66e7-4cae-877a-b8ab3fe87974\"}":{"__typename":"MentorPublicProfile","uuid":"d7b6df03-66e7-4cae-877a-b8ab3fe87974","displayName":"Daniel C.","slug":"daniel-chong","biography":"\u003cp\u003eHi everyone! My name is Daniel and I am a junior at Princeton University studying Public \u0026amp; International Affairs and minoring in East Asian Studies. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m from the Washington DC area, but I’ve lived in different places around the world like South Korea, the American Midwest, and Germany. Having these experiences exposed me to all kinds of different cultures and people which led me to form an interest in policy and international relations. In high school, I was also part of a business club called DECA, where I was a two-time Virginia state finalist and nationals competitor. Combining my background in business and policy, I want to explore the intersection of the public and private sector to make impact through policy as well as the topics of political economy and economic development. I am passionate about the world of business, economics, and policy and can share insights from my own path and offer further paths to explore.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, I am also part of Princeton’s Army Reserves Officers’ Training Corps (ROTC) program. This comes from my commitment to public service to make a valuable impact on the communities that I’m a part of. I can offer my honest insights and guidance in going through the path to service academies or ROTC in college, for those who are interested. Besides ROTC, I am also a course assistant for Princeton’s Korean Department, where I tutor students 1v1 to fill their gaps in learning with individualized instruction plans.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of school, I have interned at a large consumer technology company in a business role where I focused on product marketing, market research, and project management. I’ve successfully recruited for business role internships at two Fortune Global 500 companies and can offer keen insights on the recruiting process for business and management consulting. I have also interned for the Kim Dae Jung Presidential Library \u0026amp; Museum in Seoul, South Korea, which is the first and only presidential library in Asia. There, I was involved in research, translating between English and Korean sources, and building upon the library’s online archives.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOther than my career and academic interests, I am also passionate about sports and fitness. Growing up I played six different sports and eventually settled on soccer, playing for a highly competitive travel soccer club as well as for my high school varsity team. Sports are an incredibly important part of my life, as a player and fan. Besides sports, I also love to cook, trying out new recipes I find on social media or my favorite dishes from childhood. Recently, I’ve also been spending time reading and writing opinion pieces on politics, business, and anything else that comes to mind.\u003c/p\u003e","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Public and International Affairs (Public Policy)","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/a112bcc2-0a98-46a5-a8d4-9e1b1cc23af1/-/preview/-/format/jpg/","https://ucarecdn.com/6c63d074-844e-4f27-8c8d-20304f9a6a96/-/preview/-/format/jpg/","https://ucarecdn.com/2ec1239a-10b4-4bb3-acd7-f8b1d1838d37/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"a08b5fd8-b1ba-4e2f-a0fe-6779e4f3c43c\"}"},{"__ref":"Education:{\"uuid\":\"87771420-f731-48a0-b0f3-154247aab3bc\"}"}],"hiredAt":"2025-07-02T17:00:37.707Z","topics":["Algebra I","Algebra II","Calculus","Geometry","K-5 Grade Math","Pre-Algebra","Precalculus / Trigonometry","6-8 Grade Science","Writing","Academic Coaching","College Essay Writing","Economics","Executive Function","History","Reading","Creative Writing","History Project","K-6 Storybook","Sports Journalism","Business / Entrepreneurship","Finance / Investing","Journalism","Law / Government / Policy"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"daniel-chong\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"d7b6df03-66e7-4cae-877a-b8ab3fe87974\"}"}}},"_sentryTraceData":"4d975134b2
