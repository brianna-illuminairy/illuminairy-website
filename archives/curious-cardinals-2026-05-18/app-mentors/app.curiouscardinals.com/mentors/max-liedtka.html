xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"086d864a-9bc4-46d0-80bd-9c2cd1bbb890\"}":{"__typename":"Favorites","uuid":"086d864a-9bc4-46d0-80bd-9c2cd1bbb890","photoUrl":"https://ucarecdn.com/6d47c754-618c-4994-beb9-d91203046e8c/","title":"Blonde by Frank Ocean","type":"ALBUM"},"Favorites:{\"uuid\":\"72e6d506-86a8-456e-95c2-b02336b42c21\"}":{"__typename":"Favorites","uuid":"72e6d506-86a8-456e-95c2-b02336b42c21","photoUrl":"https://ucarecdn.com/49a4fcc7-2130-4140-900b-e03a86581f9a/","title":"M.C. Escher","type":"ARTIST"},"Favorites:{\"uuid\":\"5c6f9b9c-a7ab-4f94-8651-8f06978ef0ed\"}":{"__typename":"Favorites","uuid":"5c6f9b9c-a7ab-4f94-8651-8f06978ef0ed","photoUrl":"https://ucarecdn.com/ff7011f8-48d4-4e63-aa87-be39ebac6449/","title":"Pittsburgh Steelers","type":"SPORTS_TEAM"},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"5b0841dd-786f-48d7-943a-4f47989117ec\"}":{"__typename":"DeepDives","uuid":"5b0841dd-786f-48d7-943a-4f47989117ec","content":"\u003cp\u003eI held a terrifying array of summer jobs throughout my time in high school. I worked at a cashier at a Big Lots store, a lifeguard at a local pool, a server at a restaurant on a golf course, and as a height checker for roller coasters at Hershey Park, an amusement park near me. My time bouncing around nearly every job a high schooler could hold exposed me to a wild spread of both customers and co-workers.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"d1a47b72-858f-48d9-a88d-b0d73e309401\"}":{"__typename":"DeepDives","uuid":"d1a47b72-858f-48d9-a88d-b0d73e309401","content":"\u003cp\u003eFind peace. I've enjoyed my first year at college as much as I have because I'm managing to prioritize my own enjoyment of life moreso than ever. I'm recognizing now that sometimes it is more productive of me to go cook, hike, or kayak than it is to study for another hour, because one of those activities might put me in a peaceful, productive mindset better than stressing ever could.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"be233136-fc5b-4cee-ac1c-7105ac986b85\"}":{"__typename":"DeepDives","uuid":"be233136-fc5b-4cee-ac1c-7105ac986b85","content":"\u003cp\u003eI am from a small town in rural central Pennsylvania, so my immediate approach to tackling a problem begins with doing so with as few resources as possible. Given the small size of my high school, I had access to relatively few course and extracurricular offerings compared to those I've experiences from my peers at college, so I've spent my life stretching myself in unorthodox ways. I've learned to think very creatively and push myself by thinking outsides the box, which has become even more effective now that I am in an environment that is more resourced. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"40a898d5-d6bf-4037-8357-facdb42198b6\"}":{"__typename":"DeepDives","uuid":"40a898d5-d6bf-4037-8357-facdb42198b6","content":"\u003cp\u003eI am so disappointed that I never found anything like Curious Cardinals when I was in middle/high school. Between college applications/admissions, subject fields not available to me, and general functioning tips, I would have loved the opportunity to learn from someone live instead of just reading very processed online materials. I know that students coming to CC for guidance are similar to how I was in my past, eager to learn and grow, so I am thrilled that I can be here to encourage that academic journey in ways that I was unable to experience myself.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"4484ee50-55cb-44d3-88b5-48789953ad3d\"}":{"__typename":"School","uuid":"4484ee50-55cb-44d3-88b5-48789953ad3d","name":"Annville-Cleona Middle/High School","city":"Annville","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"17003"},"Education:{\"uuid\":\"c44bef5f-0ab0-4da2-aaae-a147c9ae73fb\"}":{"__typename":"Education","uuid":"c44bef5f-0ab0-4da2-aaae-a147c9ae73fb","school":{"__ref":"School:{\"uuid\":\"4484ee50-55cb-44d3-88b5-48789953ad3d\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}":{"__typename":"School","uuid":"fe4958a8-2abb-4b57-881a-8e7718b20a1e","name":"Dartmouth College","city":"Hanover","type":"COLLEGE","state":"New Hampshire","country":"United States","zip":"03755"},"Education:{\"uuid\":\"d48cf588-e993-48a6-8431-31f401af0f96\"}":{"__typename":"Education","uuid":"d48cf588-e993-48a6-8431-31f401af0f96","school":{"__ref":"School:{\"uuid\":\"fe4958a8-2abb-4b57-881a-8e7718b20a1e\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Linguistics","degree":null},"MentorPublicProfile:{\"uuid\":\"4aa8e56f-ea7b-4984-90d7-328e98c29cb3\"}":{"__typename":"MentorPublicProfile","uuid":"4aa8e56f-ea7b-4984-90d7-328e98c29cb3","displayName":"Max L.","slug":"max-liedtka","biography":"\u003cp\u003eHi! I'm Max, I'm a freshman at Dartmouth College, originally from Central Pennsylvania - around 20 minutes from Hershey. At Dartmouth, I study Government and Linguistics, as well as participating in Wind Ensemble where I play the tuba, Model UN, Club Frisbee, our rural students organization (DOORS), and I tutor in the Latin department. Outside my academics and extracurriculars, I love to spend time outdoors, whether it be through distance running around campus, or enjoying the hiking, biking, and river that New Hampshire's Upper Valley has to offer. I watch a lot of sports (Go Steelers and Knicks), movies (Love Tarantino) and listen to music (Big Pink Floyd guy here.)\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn terms of mentoring, I'm very excited for the challenge of opening myself up to a broader academic scope. I'm interested in taking on the personal academic challenge of diving deeper on behalf of another into many of my newer academic passions, as well as walking back my time spent on other disciplines from my high school years. My time at Dartmouth thus far has transformed my approach to learning and academia in ways I never would have thought possible, which has included introducing me to Curious Cardinals, where I hop to grow even more with your help.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAll in all, thrilled to have the opportunity to tutor for Curious Cardinals, in the past year I have gained such a deeper appreciation and understanding for my academic and extracurricular passions, which I am so excited to channel into teaching. The chance to partner with a mentee a guide them through some of the most curious and academically exciting years of their lives with the hand of someone having recently gone through them would mold me in ways I can only imagine now, and prepare both of us a bit better for whatever will come to pass down the road.\u003c/p\u003e","teachingVideoPlaybackId":"8Ar3zZTtNnVV02rd02nJDKuY72OYh01ZFyyVxhP27ZL9IQ","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eA few weeks ago I did a 10-mile run. I only began running seriously in college, so this was a huge milestone for me. Not too much to say about this one, just something I'm pretty proud of.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"086d864a-9bc4-46d0-80bd-9c2cd1bbb890\"}"},{"__ref":"Favorites:{\"uuid\":\"72e6d506-86a8-456e-95c2-b02336b42c21\"}"},{"__ref":"Favorites:{\"uuid\":\"5c6f9b9c-a7ab-4f94-8651-8f06978ef0ed\"}"}],"causesSupported":[],"major":"Linguistics","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5b0841dd-786f-48d7-943a-4f47989117ec\"}"},{"__ref":"DeepDives:{\"uuid\":\"d1a47b72-858f-48d9-a88d-b0d73e309401\"}"},{"__ref":"DeepDives:{\"uuid\":\"be233136-fc5b-4cee-ac1c-7105ac986b85\"}"},{"__ref":"DeepDives:{\"uuid\":\"40a898d5-d6bf-4037-8357-facdb42198b6\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/dac1b90d-3dad-4fcb-be3f-05475af734d2/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"c44bef5f-0ab0-4da2-aaae-a147c9ae73fb\"}"},{"__ref":"Education:{\"uuid\":\"d48cf588-e993-48a6-8431-31f401af0f96\"}"}],"hiredAt":"2025-04-22T10:24:24.933Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Statistics","6-8 Grade Science","Chemistry","Biology","Physics","Writing","Spanish","Latin","College Essay Writing","Reading","History","Academic Coaching","Music","Film / Theater","Law / Government / Policy","Public Speaking"],"communityBadges":["https://ucarecdn.com/ceacbeeb-af28-4003-96cf-d977276b04ef/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\
