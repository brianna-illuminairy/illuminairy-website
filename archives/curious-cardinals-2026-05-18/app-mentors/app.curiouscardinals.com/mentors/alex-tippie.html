xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f2c4345e-f3ff-4a53-9b0e-ea4fd16050e7\"}":{"__typename":"Favorites","uuid":"f2c4345e-f3ff-4a53-9b0e-ea4fd16050e7","photoUrl":"https://ucarecdn.com/e2d8f87b-d3aa-4bdd-8691-4399b058ba73/","title":"Eragon - Christopher Paolini","type":"BOOK"},"Favorites:{\"uuid\":\"9d0b5729-410e-4de1-a1c3-8bcb85ec6d86\"}":{"__typename":"Favorites","uuid":"9d0b5729-410e-4de1-a1c3-8bcb85ec6d86","photoUrl":"https://ucarecdn.com/6a4cd1a9-5211-463a-bc38-342ec9033613/","title":"演.说.家 - Yitai Wang","type":"ALBUM"},"Favorites:{\"uuid\":\"fca897de-3fc6-45e6-a8b2-bada2d2da240\"}":{"__typename":"Favorites","uuid":"fca897de-3fc6-45e6-a8b2-bada2d2da240","photoUrl":"https://ucarecdn.com/8aeb9f3c-95f8-45af-986b-2f1446ec7ce1/","title":"Ark: Survival Evolved","type":"GAME"},"CausesSupported:{\"uuid\":\"9739ce8f-5de7-412c-8ee0-e3ef63683add\"}":{"__typename":"CausesSupported","uuid":"9739ce8f-5de7-412c-8ee0-e3ef63683add","name":"Field (Eugene) Elementary School","description":"\u003cbr\u003e\u003cp\u003eVolunteered at a language immersion school for young SPED and underprivileged\u003c/p\u003e\u003cbr\u003e","photoUrl":"https://ucarecdn.com/8e31af71-c277-44de-ad58-fdee7b9aa7ec/"},"CausesSupported:{\"uuid\":\"b1743ca7-a856-4a55-840c-edc15051c97e\"}":{"__typename":"CausesSupported","uuid":"b1743ca7-a856-4a55-840c-edc15051c97e","name":"Union Station Homelessness Services","description":"\u003cp\u003eFor many years cooked meals for hundreds of homeless every other Saturday\u003c/p\u003e","photoUrl":"https://ucarecdn.com/c1ceb99e-caed-454c-ac43-ba2ae972dd6d/"},"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}":{"__typename":"Question","uuid":"3098beb9-186d-4ab5-b84b-cc772562369d","question":"How does your heritage or identity impact your teaching style?"},"DeepDives:{\"uuid\":\"8a55d586-a216-4f7c-b688-5b8d38c3d8b0\"}":{"__typename":"DeepDives","uuid":"8a55d586-a216-4f7c-b688-5b8d38c3d8b0","content":"\u003cp\u003eI am by heritage Hungarian/Russian, but grew up in Los Angeles in a predominantly Chinese neighborhood. Despite keeping true to our European customs in the household, for most of my childhood I was thrown into environments with very little resemblance to my own heritage. I've always felt that not having one specific culture that I could say took the lead in my development made me become so much more aware of the world around me and opened my view toward new ideas and viewpoints. \u003cstrong\u003eLong story short,\u003c/strong\u003e I enjoy delving into diverse cultures and using my gained knowledge of how it can affect people intellectually and socially to better my interactions with my peers and mentees!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"3098beb9-186d-4ab5-b84b-cc772562369d\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"996d9e00-e794-4236-9449-ef3dbf64cd1d\"}":{"__typename":"DeepDives","uuid":"996d9e00-e794-4236-9449-ef3dbf64cd1d","content":"\u003cp\u003eMy greatest role model is actually not one person but many. My friends are my greatest role models and source of motivation. I've observed that the age-old saying \"you are who you surround yourself with\" really rings true in all aspects of life. I am very proud of my friends and what they stand for as people. I feel that they are all good people who work hard to achieve their goals. They all have similar levels if not more passion than I have for their interests. Whenever I feel down or don't know if I'm following the correct path, I take a look to my left and right and see those who are marching forward with me. This has never failed to motivate me to keep putting in effort and moving forward!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d1f0ed63-fcda-4902-83d9-a6ad4edb12ec\"}":{"__typename":"DeepDives","uuid":"d1f0ed63-fcda-4902-83d9-a6ad4edb12ec","content":"\u003cp\u003eMy parents were very involved in my extracurriculars and signed me up for academic and sports camps left and right. It wasn't until I had reached independence in college that I realized how grateful I was for what they did. The countless summer programs I was \"forced\" to do  gave me so many opportunities in the future that I would have never gotten had I not put in that effort. I attended coding courses; tennis, fencing, and swimming camps; college preparatory camps and tutoring lessons; and many many random things my parents found online that had some sort of special sale on them (they made sure to let me know how much we saved at every opportunity possible).\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"ff2b60c7-af68-4f20-8d7f-9f7e975ee830\"}":{"__typename":"DeepDives","uuid":"ff2b60c7-af68-4f20-8d7f-9f7e975ee830","content":"\u003cp\u003eI know this is a huge goal and I also am aware of the chances of it coming to fruition, but I wish to see the rise of a new civilization. I wish to see our species spread out to another planet and begin the next stages in the process of evolution. Some might think that setting a goal like this will inevitably lead to disappointment, but I don't think of it that way. I instead believe that if I shoot for the moon, I'll land among the stars. By pursuing this goal, I'll get so much more done than if I accept a lower bar. I am willing to discuss my plan of action with anyone who's interested! It's more detailed than you might think.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"School:{\"uuid\":\"eefc612e-791c-4e36-be20-f18f8ce3ee28\"}":{"__typename":"School","uuid":"eefc612e-791c-4e36-be20-f18f8ce3ee28","name":"La Salle College Preparatory High School","city":"Pasadena","type":"HIGH","state":"California","country":"United States","zip":"91107"},"Education:{\"uuid\":\"ca5130fe-ee7a-47fe-a72d-57208c175dda\"}":{"__typename":"Education","uuid":"ca5130fe-ee7a-47fe-a72d-57208c175dda","school":{"__ref":"School:{\"uuid\":\"eefc612e-791c-4e36-be20-f18f8ce3ee28\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"b8d7ac6b-1315-4810-aad9-7d5923c30a74\"}":{"__typename":"School","uuid":"b8d7ac6b-1315-4810-aad9-7d5923c30a74","name":"University of California San Diego","city":"La Jolla","type":"COLLEGE","state":"California","country":"United States","zip":"92093"},"Education:{\"uuid\":\"74e2a739-f0d7-4d97-8d40-ecf4da919605\"}":{"__typename":"Education","uuid":"74e2a739-f0d7-4d97-8d40-ecf4da919605","school":{"__ref":"School:{\"uuid\":\"b8d7ac6b-1315-4810-aad9-7d5923c30a74\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Business Economics","degree":null},"MentorPublicProfile:{\"uuid\":\"bad93d54-e6ff-42b2-867f-2fade3a9b395\"}":{"__typename":"MentorPublicProfile","uuid":"bad93d54-e6ff-42b2-867f-2fade3a9b395","displayName":"Alex T.","slug":"alex-tippie","biography":"\u003cp\u003eHi! My name is Alex. I recently graduated from the University of California, San Diego after pursuing a B.S. in Business Economics. Don't let this fool you though! My studies are far from over. On a daily basis, I tend to spend at least 1-2 hours (but often significantly more) learning about all that interests me about this world. This includes trying to solve complicated mathematical phenomena, studying the formation and workings of our universe, the construction and function of each part of a computer, and many more including my latest endeavor in the field of geology. I am always looking for ways to further my own skills, but as any academic will agree, one of the greatest joys is being able to share your knowledge with others, hence why you are reading my profile today.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI have been tutoring from a young age, and have continued to do so throughout all my schooling. In high school, I co-founded multiple clubs, including the honors societies for math, finance, robotics, and even a club for competitive gameplay of the Chinese 圍棋 (weiqi) which is known to be the oldest board game still played today. During this time, I also acted as both the varsity captain of my school’s tennis team and one of West Coast Fencing’s Junior Olympic competitors for sabre fencing. On top of both academic and physical activities, I also worked at various prestigious companies like Riot Games, and Sulmeyer Kupetz Law Firm in order to gain experience in fields that I felt I was lacking in.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAfter graduating high school with the highest distinctions, I continued my drive into college. At UCSD, I decided to invest in a skill I had been interested in honing for a very long time— rocketry. I began building small-scale solid fuel rockets in my backyard during breaks and eventually got accepted into working at UCSD’s very own Rocket Propulsion Laboratory. Here I worked on a large-scale solid fuel rocket by the name of Hermes as well as managing both the business and outreach team. During my few years at RPL, I raised tens of thousands in sponsorships and spearheaded a new endeavor to reach out to other nearby rocketry laboratories as well as manufacturing companies in order to create mutually beneficial partnerships.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eNowadays, I try my best to put all the experience I’ve gained throughout my childhood to work as I move on to even larger areas of study. I am currently learning my 5th language, doing deep research into special relativity, and also working part-time in Unreal Engine developing for a popular game by the name of Fortnite.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIf you’re going to take anything out of this bio, I hope it is that all good things can be achieved through dedication and hard work— two things that can be nurtured with the right process. I hope to be able to help others develop the same passion for their interests as I’ve gained over the years!\u003c/p\u003e\u003cbr\u003e\u003cp\u003eP.S. I have 4 adorable German Shepherds, I have writing credits in a few popular rock songs, my favorite cheese is Emmental, and I own every LEGO Botanical set currently on the market\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"RrYFSgTjTPkqW1VxUsjH00vxF89QOk76W1kuY4TbOAm00","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eI was the only non-STEM major out of the hundreds in my rocket laboratory (I would know since I was in charge of conducting all demographic data analysis!). I performed well enough to be one of the two invited to a nationwide conference to discuss high-power rocketry safety. It just goes to show that credentials aren't everything; passion and hard work will always be the most important factor!\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f2c4345e-f3ff-4a53-9b0e-ea4fd16050e7\"}"},{"__ref":"Favorites:{\"uuid\":\"9d0b5729-410e-4de1-a1c3-8bcb85ec6d86\"}"},{"__ref":"Favorites:{\"uuid\":\"fca897de-3fc6-45e6-a8b2-bada2d2da240\"}"}],"causesSuppo
