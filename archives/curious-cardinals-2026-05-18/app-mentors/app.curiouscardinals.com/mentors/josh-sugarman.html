xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"8462bd92-01b0-497e-8ac1-d4c105bfc7e2\"}":{"__typename":"Favorites","uuid":"8462bd92-01b0-497e-8ac1-d4c105bfc7e2","photoUrl":"https://ucarecdn.com/c3caa16a-388c-4bc0-a489-7f51ac81fd6a/","title":"The Catcher in the Rye","type":"BOOK"},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"60c542f1-cd9b-462c-8384-c719201b603a\"}":{"__typename":"DeepDives","uuid":"60c542f1-cd9b-462c-8384-c719201b603a","content":"\u003cp\u003eI've seen first-hand the impact of mentorship, whether academic, professional, or personal. Having someone in your corner who has been in your shoes is invaluable, and I would not have been able to achieve my goals without those people in my life. I hope to be a mentor, confidante, friend, and source of help however I can. That's what drew me to Curious Cardinals.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"e252b4b2-2e95-4a32-8ede-fae09e46943d\"}":{"__typename":"DeepDives","uuid":"e252b4b2-2e95-4a32-8ede-fae09e46943d","content":"\u003cp\u003eIn addition to sports (both watching and playing), and spending time outdoors, I love movies. My personal favorite is Good Will Hunting.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eMy roommates and I have also been working on our culinary skills over the past two years. We're big fans of chicken, steak, salmon, broccoli, brussels sprouts, potatoes, and pasta!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"c19c2e69-87ee-4b65-9931-2fd722b53c25\"}":{"__typename":"School","uuid":"c19c2e69-87ee-4b65-9931-2fd722b53c25","name":"Ethical Culture Fieldston School - Bronx","city":"New York","type":"HIGH","state":"New York","country":"United States","zip":"10471"},"Education:{\"uuid\":\"1ac830b5-9e31-47ae-ad2f-a3caf3ccb500\"}":{"__typename":"Education","uuid":"1ac830b5-9e31-47ae-ad2f-a3caf3ccb500","school":{"__ref":"School:{\"uuid\":\"c19c2e69-87ee-4b65-9931-2fd722b53c25\"}"},"startYear":"2007","endYear":"2021","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}":{"__typename":"School","uuid":"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a","name":"Northwestern University","city":"Evanston","type":"COLLEGE","state":"Illinois","country":"United States","zip":"60208"},"Education:{\"uuid\":\"1b77d84b-4624-4ebc-aa99-2181654324ec\"}":{"__typename":"Education","uuid":"1b77d84b-4624-4ebc-aa99-2181654324ec","school":{"__ref":"School:{\"uuid\":\"e1174287-d8a1-4e5e-a93c-ea9ea81fcb6a\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Economics \u0026 Philosophy","degree":null},"Testimonial:8e08ec98-5514-4570-83c0-c1866010b2bf":{"__typename":"Testimonial","id":"8e08ec98-5514-4570-83c0-c1866010b2bf","text":"We loved working with Josh Sugarman! He inspired my son to learn about markets and how to think about investment parameters around companies. He tapped into my son's curiosity about brands he knows and loves.  Thank you!","date":"2025-06-06 19:35:21.395+00","rating":5,"endorser":{"__typename":"Endorser","name":"Alexandra Wilson","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"fe24524f-6308-4e47-b3b2-822dafbb675c\"}":{"__typename":"MentorPublicProfile","uuid":"fe24524f-6308-4e47-
