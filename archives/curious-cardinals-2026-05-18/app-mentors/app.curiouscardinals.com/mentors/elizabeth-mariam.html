xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"b05c4c15-4b13-4512-8725-d3e798d73089\"}":{"__typename":"Favorites","uuid":"b05c4c15-4b13-4512-8725-d3e798d73089","photoUrl":"https://ucarecdn.com/4d2190c5-fb52-4568-bd68-c2a02e2b70fc/","title":"Ratatouille","type":"MOVIE"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"706e590d-a4a7-4ff3-8607-bdeaea11a18b\"}":{"__typename":"DeepDives","uuid":"706e590d-a4a7-4ff3-8607-bdeaea11a18b","content":"\u003cp\u003eIn high school, I started an initiative where I taught Python bootcamps to middle schoolers in underserved communities to help them feel confident entering high school computer science (CS) courses. My motivation came from wanting to make CS accessible and welcoming to every student by creating the supportive space I once needed. Through hands-on activities, students built simple applications and discovered that coding can be both approachable and creative. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eTo expand the project, I built a website featuring interviews with engineering professionals and educational resources, and I partnered with teachers to deliver interactive CS lessons on career paths and opportunities. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eEven teaching one class meant reaching 35 students who left excited about what CS could offer. For me, impact isn’t about scale, it’s about giving students the confidence, resources, and encouragement to keep moving forward in CS!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}":{"__typename":"Question","uuid":"47f33e03-be45-4dc6-bc40-b8b46a04d58a","question":"Out of all the things you could be doing, why mentorship?"},"DeepDives:{\"uuid\":\"62e9bd7b-0663-4c98-a1d2-59e2604c1bd9\"}":{"__typename":"DeepDives","uuid":"62e9bd7b-0663-4c98-a1d2-59e2604c1bd9","content":"\u003cp\u003eI choose mentorship because having someone guide and support you early on can make all the difference. During K–8, high school, and college prep, it’s easy to feel lost or overwhelmed without a clear support system.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI want to be the mentor and friend I wish I had - someone who offers encouragement and honest guidance! Mentorship gives me the chance to help students feel seen, supported, and confident in their own path.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"47f33e03-be45-4dc6-bc40-b8b46a04d58a\"}"}},"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}":{"__typename":"Question","uuid":"56c39f18-e8bc-4b51-98ba-161bbf3f4c22","question":"Who is your greatest role model/mentor?"},"DeepDives:{\"uuid\":\"91efa2b9-bf3d-4da0-ad13-77eb12dc9f3b\"}":{"__typename":"DeepDives","uuid":"91efa2b9-bf3d-4da0-ad13-77eb12dc9f3b","content":"\u003cp\u003eMy greatest role model and mentor is my grandmother. Growing up, she taught me the value of perseverance, generosity, and using knowledge to help others, shaped by the challenges she faced as a young widow. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eDespite cultural and generational differences, her resilience and work ethic deeply influenced my values and the way I approach challenges, especially as a young woman in STEM. She always emphasized that success isn’t just personal achievement, but uplifting others along the way which is a lesson that has guided my commitment to creating meaningful impact in my community.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"56c39f18-e8bc-4b51-98ba-161bbf3f4c22\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"f4cc5600-d5fd-4b67-bf26-4bac6d0d1c84\"}":{"__typename":"DeepDives","uuid":"f4cc5600-d5fd-4b67-bf26-4bac6d0d1c84","content":"\u003cp\u003eIn my spare time, I compete in collegiate dance team that I’ve been involved in throughout all four years of college. I’ve had the opportunity to compete across the country, which has been both creatively fulfilling and challenging. Dance is an important outlet for me as it builds discipline and allows me to stay connected to my culture while pushing myself outside of academics.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"2ae7329e-7672-4715-b244-0bad24174a07\"}":{"__typename":"School","uuid":"2ae7329e-7672-4715-b244-0bad24174a07","name":"Mountain House High School","city":"Mountain House","type":"HIGH","state":"California","country":"United States","zip":"95391"},"Education:{\"uuid\":\"55c35285-13fb-4571-a951-2d4a6266c14d\"}":{"__typename":"Education","uuid":"55c35285-13fb-4571-a951-2d4a6266c14d","school":{"__ref":"School:{\"uuid\":\"2ae7329e-7672-4715-b244-0bad24174a07\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}":{"__typename":"School","uuid":"c2dd4a9b-bd37-4bf2-aa02-7aa387751857","name":"University of California, Berkeley","city":"Berkeley","type":"COLLEGE","state":"California","country":"United States","zip":"94720"},"Education:{\"uuid\":\"63645704-52f9-4743-92ef-f713caa6e0f4\"}":{"__typename":"Education","uuid":"63645704-52f9-4743-92ef-f713caa6e0f4","school":{"__ref":"School:{\"uuid\":\"c2dd4a9b-bd37-4bf2-aa02-7aa387751857\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Computer Science, Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"e1f82d76-c979-4f75-92e8-1d4372fd8766\"}":{"__typename":"MentorPublicProfile","uuid":"e1f82d76-c979-4f75-92e8-1d4372fd8766","displayName":"Elizabeth V.","slug":"elizabeth-mariam","biography":"\u003cp\u003eHi nice to meet you, I'm Elizabeth!\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve been curious about how things work for as long as I can remember. My interest in computer science started at a young age when I taught myself how to build simple websites to share my baking recipes. What began as a creative outlet quickly turned into a deeper fascination with technology and how it can be used to explore, explain, and share ideas with others.\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve always been drawn to STEM more broadly as well. Starting in sixth grade, I participated in Science Olympiad, which sparked my love for problem-solving and collaborative learning. As I gained experience, I began tutoring other students in Science Olympiad topics, discovering how much I enjoyed teaching and helping others build confidence in technical subjects. In high school, I continued pursuing computer science through coursework and became involved in teaching, including helping run Python bootcamps for students. I also worked as a tutor at Kumon, provided private tutoring, and volunteered at low-income schools, supporting students across a wide range of academic backgrounds.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eThroughout these experiences, I’ve had the opportunity to teach students across all age groups, from K–5 to middle school and high school. While I enjoy working with students of all ages, I especially love working with younger students and helping them build strong foundations and confidence early on.\u003cbr\u003e\u003c/p\u003e\u003cbr\u003e\u003cp\u003eIn college, I’ve continued this commitment to mentorship and education. I joined my university’s data science club, where I help teach data science concepts to high school students, making complex ideas more accessible and engaging. Academically, I study computer science and data science, and I’m especially interested in how data and technology can be used to create real-world impact.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eProfessionally, I’ve had the opportunity to intern in software engineering roles at Microsoft and SpaceX, where I worked on large-scale systems and gained hands-on experience building reliable, impactful technology. These experiences reinforced my belief that technical skills are most powerful when paired with strong mentorship, collaboration, and support.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve always been involved in tutoring and teaching in some form, and that’s why I’m especially excited about a mentorship role with Curious Cardinals. I care deeply about helping students develop not only academic skills, but also confidence in themselves and belief in their potential. I’m motivated by the chance to work closely with students, support them through challenges, and help them build skills that will last far beyond the classroom.\u003c/p\u003e","teachingVideoPlaybackId":"P4n95NHA02Ln14EOfEdUpn9J3mTXnfRqPhhY6bx01H01og","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"b05c4c15-4b13-4512-8725-d3e798d73089\"}"}],"causesSupported":[],"major":"Computer Science, Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"706e590d-a4a7-4ff3-8607-bdeaea11a18b\"}"},{"__ref":"DeepDives:{\"uuid\":\"62e9bd7b-0663-4c98-a1d2-59e2604c1bd9\"}"},{"__ref":"DeepDives:{\"uuid\":\"91efa2b9-bf3d-4da0-ad13-77eb12dc9f3b\"}"},{"__ref":"DeepDives:{\"uuid\":\"f4cc5600-d5fd-4b67-bf26-4bac6d0d1c84\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5de44d52-de61-4c62-99a
