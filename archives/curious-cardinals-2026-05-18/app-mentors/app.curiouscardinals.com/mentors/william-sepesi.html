_typename":"School","uuid":"6f002e48-29ba-4354-a4fa-6eac3e07f1ef","name":"Washington University in St. Louis","city":"St. Louis","type":"COLLEGE","state":"Missouri","country":"United States","zip":"63130"},"Education:{\"uuid\":\"791f4c38-3192-46cf-89dd-e7b8e729660a\"}":{"__typename":"Education","uuid":"791f4c38-3192-46cf-89dd-e7b8e729660a","school":{"__ref":"School:{\"uuid\":\"6f002e48-29ba-4354-a4fa-6eac3e07f1ef\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Computer Science, Math","degree":null},"MentorPublicProfile:{\"uuid\":\"851fd687-97de-434b-ba50-f19e1a3ec448\"}":{"__typename":"MentorPublicProfile","uuid":"851fd687-97de-434b-ba50-f19e1a3ec448","displayName":"William S.","slug":"william-sepesi","biography":"\u003cp\u003eHello hello – my name is William Sepesi and I’m an AI/ML researcher and engineer. I’ve just graduated from Washington University this spring with a double major in computer science and pure math, focusing on learning the theory and practice of machine learning and deep learning. I started my work in the field during my senior year of high school, completing a self-guided research project for which I was named an International Science and Engineering Fair (ISEF) finalist, and haven’t looked back since. At a very high level, my research agenda focuses on creating highly capable AI and understanding its behavior – I’m excited by AI as a venue to understand human decision making, strategy under uncertainty, and applying these skills to real world problems. My work has brought me to internships at Microsoft, Square, and a handful of startups during my time in college.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m passionate about teaching – I credit much of my success over the years to opportunities afforded to me to learn from incredible mentors, to be inspired by their work, and to encouragement to explore my interests. Now on the other side of things, I enjoy sharing what I can with the next generation of students, especially as the field of AI rapidly accelerates. During my time at college, I was a Head Teaching Assistant for three years between our courses on machine learning, data science, and deep learning, holding office hours, reworking curriculum, and lecturing.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003eI have a strong focus on pedagogy. We’ll be a good fit if your child enjoys the rigor of math, likes to challenge themself, or is inspired by using technology to understand or change the world. AI is a hard field – and I want to help the inspired student navigate these challenges: Exploring their curiosity but also pushing themselves to dive into complicated problems and develop their mathematical maturity, critical thinking, and software engineering skills.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOutside of academic work, I’m a musician (clarinet \u0026amp; jazz keys primarily, I've spent time in citywide youth orchestras and All-State ensembles), and biker. I also enjoy contemporary art, spending time in nature, and reading. I’m fluent in French, and spent a lovely semester abroad in Paris.\u003c/p\u003e","teachingVideoPlaybackId":"nA02gsTFosrowGfkVpWB77GXT3yclLc7rlwHyyNYI5B8","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"fd8f7691-d008-493d-b2b3-c5ec32f72bc3\"}"},{"__ref":"Favorites:{\"uuid\":\"00d2e908-ba6b-414f-b9d7-ec347af792fa\"}"},{"__ref":"Favorites:{\"uuid\":\"05da9f3f-c52a-47a2-a925-4581945bf863\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"d23a0711-2adc-428a-a7d1-5436cdb3b10f\"}"}],"major":"Computer Science, Math","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c43a1b01-7fb1-4b57-842d-68fe92066b4b\"}"},{"__ref":"DeepDives:{\"uuid\":\"6c6fa1a1-1d61-40b8-9391-d9f3d85b03c4\"}"},{"__ref":"DeepDives:{\"uuid\":\"985cba9a-4110-4691-9cb7-3dc1e7343879\"}"},{"__ref":"DeepDives:{\"uuid\":\"0db8aa0a-4123-440f-a14f-1bc9f6cfb2ef\"}"}],"
