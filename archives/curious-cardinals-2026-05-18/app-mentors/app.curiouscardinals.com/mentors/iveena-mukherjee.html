xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"a30fed8f-8d5e-4467-96c1-f5ca759df0dd\"}":{"__typename":"Favorites","uuid":"a30fed8f-8d5e-4467-96c1-f5ca759df0dd","photoUrl":"https://ucarecdn.com/367087bb-7fe7-4654-9d9c-68c8251716b4/","title":"Vampire Weekend","type":"ARTIST"},"CausesSupported:{\"uuid\":\"9578086d-db07-4db3-b83f-6d21aa919570\"}":{"__typename":"CausesSupported","uuid":"9578086d-db07-4db3-b83f-6d21aa919570","name":"Sustainability","description":"\u003cp\u003eWhat I stand for is what I stand on!\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"507f468e-740c-463a-912d-d0debbc9912b\"}":{"__typename":"DeepDives","uuid":"507f468e-740c-463a-912d-d0debbc9912b","content":"\u003cp\u003ePursue what you're passionate about, and that everything happens for a reason!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"d2ff92da-a5b9-486c-837d-e73e46f758cb\"}":{"__typename":"DeepDives","uuid":"d2ff92da-a5b9-486c-837d-e73e46f758cb","content":"\u003cp\u003eI really enjoyed doing molecular dynamics research and volunteering at a local nature camp!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"39ea94a9-01dc-43f7-9779-00ed80dbe3a6\"}":{"__typename":"DeepDives","uuid":"39ea94a9-01dc-43f7-9779-00ed80dbe3a6","content":"\u003cp\u003eBioengineering, Finance and AI are all technical spheres, but touch so many aspects of our lives today. I love being able to study subjects that are so impactful. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"cc621cb5-b971-41f3-a4e2-5baebd64c121\"}":{"__typename":"DeepDives","uuid":"cc621cb5-b971-41f3-a4e2-5baebd64c121","content":"\u003cp\u003eI love to spend time outdoors, with friends and family. You can often find me running, going on hikes, and just looking up at the stars. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"School:{\"uuid\":\"0b3b50d6-0a10-4abf-9a64-6eea26cf596e\"}":{"__typename":"School","uuid":"0b3b50d6-0a10-4abf-9a64-6eea26cf596e","name":"Charter School of Wilmington","city":"Wilmington","type":"HIGH","state":"Delaware","country":"United States","zip":"19807"},"Education:{\"uuid\":\"8afaeb04-c2a3-4b00-bf6d-e5ecf84d42dc\"}":{"__typename":"Education","uuid":"8afaeb04-c2a3-4b00-bf6d-e5ecf84d42dc","school":{"__ref":"School:{\"uuid\":\"0b3b50d6-0a10-4abf-9a64-6eea26cf596e\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}":{"__typename":"School","uuid":"54eb7ba4-8135-4432-9c0a-7fbfd2dce147","name":"University of Pennsylvania","city":"Philadelphia","type":"COLLEGE","state":"Pennsylvania","country":"United States","zip":"19104"},"Education:{\"uuid\":\"50fc2536-1295-4e6e-9bb3-6b9f26c092a5\"}":{"__typename":"Education","uuid":"50fc2536-1295-4e6e-9bb3-6b9f26c092a5","school":{"__ref":"School:{\"uuid\":\"54eb7ba4-8135-4432-9c0a-7fbfd2dce147\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"Bioengineering \u0026 Finance/AI (M\u0026T)","degree":null},"MentorPublicProfile:{\"uuid\":\"7d46f811-91ee-42a9-8aa9-c9dd2ca923a7\"}":{"__typename":"MentorPublicProfile","uuid":"7d46f811-91ee-42a9-8aa9-c9dd2ca923a7","displayName":"Iveena M.","slug":"iveena-mukherjee","biography":"\u003cp\u003eIveena Mukherjee is a student in the dual-degree Jerome Fisher Program in Management \u0026amp; Technology at the University of Pennsylvania, where she studies Finance and AI for Business at the Wharton School alongside Bioengineering at Penn Engineering. Much of her work has centered around environmental advocacy, scientific research, public speaking, and youth leadership--experiences that continue to shape the way she approaches business, healthcare, and technology today.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eGrowing up in Delaware, Iveena became deeply interested in sustainability and environmental science at an early age. In high school, she conducted research at the University of Delaware Center for Composite Materials, where she worked on computational materials science and molecular dynamics modeling. Her research eventually led to a first-author publication in a peer-reviewed scientific journal, recognition from NASA, and first place at the University of Delaware Undergraduate Summer Symposium. She was also selected as one of only five students nationwide to represent Team USA at the Joint Science Education Project in Greenland, a collaborative Arctic research program involving the Greenlandic government, Dartmouth, and the National Science Foundation.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAlongside research, Iveena spent much of high school involved in environmental leadership and public advocacy. She served on Jane Goodall's Roots \u0026amp; Shoots National Youth Council, representing a global network of over 150,000 young people. Through this role, she reviewed grant proposals for youth-led community initiatives across the United States, helped allocate funding to environmental projects, and hosted an environmental podcast with listeners across six continents. Her environmental work earned her distinctions including Delaware’s Young Environmentalist of the Year and an honorable mention for the EPA President’s Environmental Youth Award, one of the agency’s highest recognitions for youth environmental leadership.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eCommunication and debate also became a major part of Iveena’s identity. She competed nationally in Extemporaneous Speech, ultimately ranking in the Top 20 nationwide, and was heavily involved in debate and policy competitions. She presented at the United Nations General Assembly, the World Bank Youth Summit, and the United States International Trade Commission on topics spanning sustainability, trade, and public policy. She also served as Director of Live Events for the International Blue Ocean Pitch Competition, where she helped develop entrepreneurship curriculum materials for thousands of student participants around the world.\u003c/p\u003e","teachingVideoPlaybackId":"01012PjBQx8BoDrOWdUyPaxr5aGDTytH6bAjFVmR6oajs","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003ePresenting my biomaterials research at the United Nations General Assembly Science Summit\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"a30fed8f-8d5e-4467-96c1-f5ca759df0dd\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"9578086d-db07-4db3-b83f-6d21aa919570\"}"}],"major":"Bioengineering \u0026 Finance/AI (M\u0026T)","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"507f468e-740c-463a-912d-d0debbc9912b\"}"},{"__ref":"DeepDives:{\"uuid\":\"d2ff92da
