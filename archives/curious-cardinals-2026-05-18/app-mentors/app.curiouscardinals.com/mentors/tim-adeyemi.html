xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"850210db-ac8b-49bd-b96c-8514fecdf71a\"}":{"__typename":"DeepDives","uuid":"850210db-ac8b-49bd-b96c-8514fecdf71a","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to make a meaningful impact in the field of technology, particularly through the development and application of AI. I aspire to create innovative solutions that address real-world problems and improve lives on a large scale. Beyond my professional goals, I also hope to inspire and mentor the next generation of technologists, fostering a diverse and inclusive community that drives positive change.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"d544c7bd-2f5c-4824-a5d4-c2964476db14\"}":{"__typename":"DeepDives","uuid":"d544c7bd-2f5c-4824-a5d4-c2964476db14","content":"\u003cp\u003eI chose computer science as my major because of my deep passion for technology and its transformative potential. From a young age, I was fascinated by how technology works and how it can be harnessed to solve complex problems and create new opportunities. Studying computer science allows me to delve into the intricacies of software development and artificial intelligence, fields that are at the forefront of technological advancement. This major aligns with my interests and goals, providing me with the tools and knowledge to contribute meaningfully to the tech industry.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"0aafc5b4-dc5a-47f3-8b21-2005ca24362a\"}":{"__typename":"DeepDives","uuid":"0aafc5b4-dc5a-47f3-8b21-2005ca24362a","content":"\u003cp\u003eMentorship matters to me because it provides invaluable guidance and support that can significantly impact personal and professional growth. Having benefited from mentorship myself, I understand the profound difference it can make in navigating challenges, setting goals, and achieving success. Mentors offer wisdom, encouragement, and a different perspective, helping to illuminate paths and opportunities that might not be immediately obvious. By participating in mentorship, I aim to give back and support others in their journeys, just as I have been supported.\u003c/p\u003e\u003cbr\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"b27150e8-84d6-480a-b85b-87e7ca0462a7\"}":{"__typename":"DeepDives","uuid":"b27150e8-84d6-480a-b85b-87e7ca0462a7","content":"\u003cp\u003eTo my middle or high school self, I would say: Embrace your passions and don’t be afraid to take risks. Pursue what genuinely interests you, whether it’s a subject, activity, or hobby, and let that drive you. Understand that failure is a part of growth, not a reason to give up. Stay curious and open to learning from every experience, and build a strong support network of mentors, friends, and family who can guide and encourage you.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"56576523-2424-47cb-9dfd-e7f651758c5d\"}":{"__typename":"School","uuid":"56576523-2424-47cb-9dfd-e7f651758c5d","name":"Morton Ranch High School","city":"Katy","type":"HIGH","state":"Texas","country":"United States","zip":"77449"},"Education:{\"uuid\":\"e9949a50-a4b9-4df8-9e67-3fc3f10dc9ba\"}":{"__typename":"Education","uuid":"e9949a50-a4b9-4df8-9e67-3fc3f10dc9ba","school":{"__ref":"School:{\"uuid\":\"56576523-2424-47cb-9dfd-e7f651758c5d\"}"},"startYear":"2019","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}":{"__typename":"School","uuid":"be1cf0ee-3230-4767-bc39-ad7509bbf4b4","name":"Cornell University","city":"Ithaca","type":"COLLEGE","state":"New York","country":"United States","zip":"14850"},"Education:{\"uuid\":\"93ef8815-a86d-4be7-b6d2-4546bff36679\"}":{"__typename":"Education","uuid":"93ef8815-a86d-4be7-b6d2-4546bff36679","school":{"__ref":"School:{\"uuid\":\"be1cf0ee-3230-4767-bc39-ad7509bbf4b4\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2027","major":"Computer Science","degree":null},"MentorPublicProfile:{\"uuid\":\"472ede3e-c227-4f24-a15d-72c15cfb1353\"}":{"__typename":"MentorPublicProfile","uuid":"472ede3e-c227-4f24-a15d-72c15cfb1353","displayName":"Tim A.","slug":"tim-adeyemi","biography":"\u003cp\u003eTim is a student at Cornell University, studying computer science in the College of Engineering. He is passionate about software development and exploring innovative uses of AI in today’s technology landscape. Born and raised in Lagos, Nigeria, Tim's interest in technology was ignited by watching \u003cem\u003eLab Rats\u003c/em\u003e. After moving to the United States at age 10, Tim has strived daily to seize every opportunity that comes his way. From playing varsity basketball to engineering on his high school robotics team, Tim aims to be a well-rounded individual without limits.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOn campus, Tim runs a haircutting business, where he interacts with people from diverse backgrounds and continues to refine his communication skills. He also serves as the corporate chair for the Underrepresented Minorities in Computing at Cornell.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOne of Tim’s notable achievements last year was being named Freshman of the Year in the College of Engineering, which recognizes his accomplishments and contributions during his first year.\u003c/p\u003e\u003cp\u003eThis summer, Tim had the honor of interning at Microsoft, where he honed his skills in both software engineering and product management. He also participated in the Citadel Externship, gaining insights into asset management, market making, and software development.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eOutside of academics, Tim loves sports and going to the gym. Engaging in these activities helps him maintain a well-rounded college life and balance his academic and personal interests. He is also a Christian, a brother, and a friend who is enthusiastic about being a supportive friend and a great mentor.\u003c/p\u003e","teachingVideoPlaybackId":"QaZDJcE9bvw8k5L56F8wtctiOWb5qKdXOXjULwWI7Ko","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Computer Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"850210db-ac8b-49bd-b96c-8514fecdf71a\"}"},{"__ref":"DeepDives:{\"uuid\":\"d544c7bd-2f5c-4824-a5d4-c2964476db14\"}"},{"__ref":"DeepDives:{\"uuid\":\"0aafc5b4-dc5a-47f3-8b21-2005ca24362a\"}"},{"__ref":"DeepDives:{\"uuid\":\"b27150e8-84d6-480a-b85b-87e7ca0462a7\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b5f038a0-0bb4-48bd-9488-67f964070783/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","educa
