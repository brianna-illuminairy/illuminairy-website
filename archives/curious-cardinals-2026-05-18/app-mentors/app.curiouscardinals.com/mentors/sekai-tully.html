xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"81c741d3-8b5e-4d0d-96cb-6deb5c829992\"}":{"__typename":"Favorites","uuid":"81c741d3-8b5e-4d0d-96cb-6deb5c829992","photoUrl":"https://ucarecdn.com/41974b76-bc47-481b-8de3-c8d99ff416f0/","title":"The Riddle-Master of Hed","type":"BOOK"},"Favorites:{\"uuid\":\"e6581877-fd45-4a82-87fb-e81294b8fd74\"}":{"__typename":"Favorites","uuid":"e6581877-fd45-4a82-87fb-e81294b8fd74","photoUrl":"https://ucarecdn.com/41974b76-bc47-481b-8de3-c8d99ff416f0/","title":"Paris","type":"CITY"},"Favorites:{\"uuid\":\"9fda3b5f-9075-4ef8-9c9d-b0a7301b59a9\"}":{"__typename":"Favorites","uuid":"9fda3b5f-9075-4ef8-9c9d-b0a7301b59a9","photoUrl":"https://ucarecdn.com/41974b76-bc47-481b-8de3-c8d99ff416f0/","title":"Set","type":"GAME"},"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"9db93d84-be01-44fc-9213-67ea9bf69e88\"}":{"__typename":"DeepDives","uuid":"9db93d84-be01-44fc-9213-67ea9bf69e88","content":"\u003cp\u003eMy dream job would be to be the in-house counsel for a Football club. I have a passion for Law (and am specifically interested in contract law) and aspire to be on the business side of Football. I think the dream aspect of this job is that I would get to live and travel in Europe and get free tickets to matches.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"b1627393-2157-46ac-8a57-9a933e4b1c9d\"}":{"__typename":"DeepDives","uuid":"b1627393-2157-46ac-8a57-9a933e4b1c9d","content":"\u003cp\u003eI would say that I stumbled on to my major. I explored many fields of study during my first year of college including economics, history, and international and public affairs. In the end, many of my close friends decided to study Applied Math, CS, or some combination of the two. I chose to follow them my sophomore year and haven't looked back since. It's great to be able to work with the people you enjoy and it definitely makes every project and problem set that much more interesting.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"168a0028-e252-41c4-88f2-cdcb8f29b774\"}":{"__typename":"DeepDives","uuid":"168a0028-e252-41c4-88f2-cdcb8f29b774","content":"\u003cp\u003eI hope to run a marathon in my lifetime. It seems like one of the most mentally and physically challenging things that a person can do, which makes it fun and exciting. I love pushing my limits, so I am sure once I complete a Marathon, my goal will shift to an Ultra-Marathon, an Iron Man, or something equally ridiculous.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"29756f62-a579-4357-ac75-5910241b7348\"}":{"__typename":"DeepDives","uuid":"29756f62-a579-4357-ac75-5910241b7348","content":"\u003cp\u003eI have been the beneficiary of kind and encouraging mentors in my life. While I wasn't always grateful to them, It's undeniable that they have each left a unique impact on my life and have contributed to shaping the person I am today. I believe that mentorship is the best vessel for self-discovery. As a mentor, my job is to guide my mentees and help them accomplish their goals and pursue their dreams. Life is a journey and we all have the prerogative to choose our adventures. Tell me what you want your adventure to be, and I'll join you on it. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"School:{\"uuid\":\"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a\"}":{"__typename":"School","uuid":"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a","name":"Cambridge Rindge \u0026 Latin School","city":"Cambridge","type":"HIGH","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"b995ad3e-82b5-4f49-a9c4-0e153e2ea777\"}":{"__typename":"Education","uuid":"b995ad3e-82b5-4f49-a9c4-0e153e2ea777","school":{"__ref":"School:{\"uuid\":\"9b0c766b-27b2-4f40-8ff8-dd2b80e4256a\"}"},"startYear":"2016","endYear":"2020","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}":{"__typename":"School","uuid":"3c75a4e1-8947-4566-9f60-88b317e82ed4","name":"Brown University","city":"Providence","type":"COLLEGE","state":"Rhode Island","country":"United States","zip":"02912"},"Education:{\"uuid\":\"74ad47aa-9bb7-4a9b-a8bc-533efd80b84e\"}":{"__typename":"Education","uuid":"74ad47aa-9bb7-4a9b-a8bc-533efd80b84e","school":{"__ref":"School:{\"uuid\":\"3c75a4e1-8947-4566-9f60-88b317e82ed4\"}"},"startYear":"2021","endYear":null,"expectedGradYear":"2025","major":"Applied Math - Computer Science","degree":null},"Testimonial:0deacda6-a0e7-4062-bd1a-65caa94737dc":{"__typename":"Testimonial","id":"0deacda6-a0e7-4062-bd1a-65caa94737dc","text":"Sekai has been an amazing mentor for my son and am grateful for his thoughtful insights into Sterling's needs and how best to support him. Sekai is a dedicated, natural educator, and quickly developed rapport and trust with Sterling. Sekai has been an essential life line for Sterling as he is navigating his academic future.","date":"2025-05-22 13:28:25.013+00","rating":5,"endorser":{"__typename":"Endorser","name":"Nina Buxenbaum","tagline":"","avatar":null}},"MentorPublicProfile:{\"uuid\":\"107faca4-cfe7-48e0-8766-30e179555fe2\"}":{"__typename":"MentorPublicProfile","uuid":"107faca4-cfe7-48e0-8766-30e179555fe2","displayName":"Sekai T.","slug":"sekai-tully","biography":"\u003cp\u003eHi! My name is Sekai and I am a  Junior at Brown University studying Applied Math and Computer Science. I call New York City home but, I've spent a third of my life living outside of the States in Europe and East Africa.\u003cbr\u003e\u003cbr\u003eMy time at Brown is primarily spent working on problem sets with a group of friends or in CS office hours the night before a big project is due. I have been known to take humanities classes at times and love to talk history (especially the 20th century) and international politics.  \u003cbr\u003e\u003cbr\u003eWhen I am not doing school work, you'll likely find me running, people-watching, listening to albums cover to cover, or back in NYC playing soccer with my childhood friends at Riverside Park.\u003cbr\u003e\u003cbr\u003eBesides that, some of my other hobbies include hiking (I completed an eight-day hike in the Alps in 2017 and am going back for more next summer), sharpening my math skills by playing poker, reading science fiction and critical theory, and hanging out with my cat Mako.\u003cbr\u003e\u003cbr\u003eI look forward to getting to know you!\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e","teachingVideoPlaybackId":"Fi9T02LUtt2tZr49zj8WLwZitH9I6BaYsGWMc2aS3bZk","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"81c741d3-8b5e-4d0d-96cb-6deb5c829992\"}"},{"__ref":"Favorites:{\"uuid\":\"e6581877-fd45-4a82-87fb-e81294b8fd74\"}"},{"__ref":"F
