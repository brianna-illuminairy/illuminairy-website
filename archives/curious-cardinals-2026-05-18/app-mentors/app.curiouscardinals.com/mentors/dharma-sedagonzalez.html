thout whom I would not have acquired the skills, inspiration, and confidence to pursue my dreams. Mentorship is how we support one another to make an impact on the world. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"a340458a-1f1b-4100-9691-2f4a792ff8aa\"}":{"__typename":"DeepDives","uuid":"a340458a-1f1b-4100-9691-2f4a792ff8aa","content":"\u003cp\u003eAt Harvard, I chose a joint concentration that offered me the freedom and flexibility to take courses in various fields. Hist \u0026amp; Lit, Harvard's oldest concentration, and Romance Languages \u0026amp; Literatures are two departments where I felt the most inspired in my coursework and found a real community. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"52856feb-2d80-4f8a-a0f9-fea3baa7e2aa\"}":{"__typename":"DeepDives","uuid":"52856feb-2d80-4f8a-a0f9-fea3baa7e2aa","content":"\u003cp\u003eMoving to a new country to pursue a masters degree! \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"School:{\"uuid\":\"98101a6d-a774-4260-b003-2abf362ad23e\"}":{"__typename":"School","uuid":"98101a6d-a774-4260-b003-2abf362ad23e","name":"Walter Payton College Preparatory High School","city":"Chicago","type":"HIGH","state":"Illinois","country":"United States","zip":"60610"},"Education:{\"uuid\":\"413e99d1-7d1b-456e-8a34-cafaaad039b5\"}":{"__typename":"Education","uuid":"413e99d1-7d1b-456e-8a34-cafaaad039b5","school":{"__ref":"School:{\"uuid\":\"98101a6d-a774-4260-b003-2abf362ad23e\"}"},"startYear":"2014","endYear":"2018","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}":{"__typename":"School","uuid":"621a1192-1f44-4c0d-8a39-c5e582406403","name":"Harvard University","city":"Cambridge","type":"COLLEGE","state":"Massachusetts","country":"United States","zip":"02138"},"Education:{\"uuid\":\"7d3f0040-47ab-4d55-a7ec-51b436001c68\"}":{"__typename":"Education","uuid":"7d3f0040-47ab-4d55-a7ec-51b436001c68","school":{"__ref":"School:{\"uuid\":\"621a1192-1f44-4c0d-8a39-c5e582406403\"}"},"startYear":"2018","endYear":null,"expectedGradYear":"2023","major":"Romance Langues and Literatures \u0026 History and Literature","degree":null},"MentorPublicProfile:{\"uuid\":\"28accf7c-8570-4a16-bb2e-2022c508053e\"}":{"__typename":"MentorPublicProfile","uuid":"28accf7c-8570-4a16-bb2e-2022c508053e","displayName":"Dharma S.","slug":"dharma-sedagonzalez","biography":"\u003cp\u003eHi, I'm Dharma! I'm a Harvard alum who currently lives in Paris, where I completed a Fulbright fellowship in literary studies following graduation. My current research examines the relationship between counterculture, incarceration, dictatorship, and exile in the global 60s. In particular, I'm fascinated by Spanish authors who fled Francoism to publish in France. But I'd say I'm equally obsessed with going to the movies, cooking dinner for my friends, participating in writing workshops, and spending as much time as possible outdoors. Languages, traveling, and immersing myself in new experiences have always been a central part of my life. \u003c/p\u003e\u003cbr\u003e\u003cp\u003eI grew up in a bilingual (Spanish/English) household in Chicago and attended a dual-language elementary school, located right next to Wrigley Field (Go Cubs!). In high school, I was the youngest member of a committee that sought to address issues of equity in Chicago Public Schools, following a slew of school closures in 2013 that disproportionally affected marginalized communities. In college, my passion for addressing issues of social justice developed further, and I was an active member of a variety of organizations that sought to address carceral justice. For two years, I co-taught writing classes in Boston correctional facilities, helping hundreds of students hone the craft of storytelling. My core belief is that words and language hold the power to impart real, social change.  \u003c/p\u003e","teachingVideoPlaybackId":"Jp02vpW0201DVkQfH15EfQ398r2KKYYXtic01aD00NFnsYP00","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"188b3f84-f71f-4ecd-9ddc-612a5ac1cf79\"}"},{"__ref":"Favorites:{\"uuid\":\"c68d1947-4fb4-4ac0-b9b0-5fe43af51dc7\"}"},{"__ref":"Favorites:{\"uuid\":\"f159bd9d-d23a-4708-a146-9bf4eea08f51\"}"}],"causesSupported":[],"major":"Romance Langues and Literatures \u0026 History and Literature","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"d459dc6f-79d8-4472-9ed1-399379eb6edf\"}"},{"__ref":"DeepDives:{\"uuid\":\"8e567dbe-8a0b-432b-b13d-c979b8f1bc4b\"}"},{"__ref":"DeepDives:{\"uuid\":\"a340458a-1f1b-4100-9691-2f4a792ff8aa\"}"},{"__ref":"DeepDives:{\"uuid\":\"52856feb-2d80-4f8a-a0f9-fea3baa7e2aa\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/5ae49e20-8598-475b-a83d-df0f1dbca32e/-/preview/-/format/jpg/","https://ucarecdn.com/63d5ebb7-537d-4742-84f7-ff8720c3a1ca/-/preview/-/format/jpg/","https://ucarecdn.com/8fc46c3b-1d70-42e2-a5e8-1cd008dc0bc4/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"413e99d1-7d1b-456e-8a34-cafaaad039b5\"}"},{"__ref":"Education:{\"uuid\":\"7d3f0040-47ab-4d55-a7ec-51b436001c68\"}"}],"hiredAt":"2024-09-26T13:05:31.731Z","topics":["French","Spanish","Writing","Academic Coaching","Executive Function","College Essay Writing","History","Reading","Women \u0026 Gender Studies","Sustaina
