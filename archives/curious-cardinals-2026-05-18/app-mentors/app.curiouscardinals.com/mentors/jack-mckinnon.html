xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"530942b1-bf63-4abb-9be7-461bff202998\"}":{"__typename":"Education","uuid":"530942b1-bf63-4abb-9be7-461bff202998","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":null,"endYear":null,"expectedGradYear":"2023","major":"Philosophy","degree":"Bachelors "},"MentorPublicProfile:{\"uuid\":\"fefb585c-0a99-4fc3-b32f-e65402e0d033\"}":{"__typename":"MentorPublicProfile","uuid":"fefb585c-0a99-4fc3-b32f-e65402e0d033","displayName":"Jack M.","slug":"jack-mckinnon","biography":"Jack grew up in the suburbs of Southern California where he attended public school from K-12. Growing up, he was a busy child actor who enjoyed golf and Avatar the Last Airbender in his downtime. In highschool, he served as Speech and Debate Captain, carrying his team and his school to first place. In addition to debate and leading the school's first philosophy club, he served as president of the National Honors Society in which he spearheaded the renovation of the school's Vietnam memorial and served on the school's advisory board.\n\nOriginally set on being an astrophysicist, he suddenly fell in love with philosophy and the classics during his junior year of high school after a conversation with his physics substitute! This was the beginning of a genuine love for classical education and the liberal arts which has only contuned to grow in Jack's projects. As he entered university, Jack took up an internship at Rose Debate Institute teaching public speaking and varieties of debate formats to K-12 schools around the country remotely and in the Bay Area in-person. That initial awe and wonder he treasured from philosophy and theology, he now extends to his students as they cultivate universal knowledge. In turn, his students inculcated in him a love for educating and for young minds. Jack further used his classical studies and experience in rhetoric to help develop the liberal arts curriculum for his church's private school LibertyEd. \n\nNow, Jack is pursuing a double major in Philosophy and Classics at Stanford University. As a current senior, he is the president of his university’s Veritas chapter in which he brings famous academics from across the world for faculty-student forums. He is actively involved in his Christian fellowship and a parliamentary debate society on campus. \n\nIn addition to extracurriculars, Jack enjoys playing golf on the club team when he is not reviewing Latin or reading theology. Not to be left out is his hobby for 1940s men's wear. If he's not wearing a three-piece tweed suit, you might mistake him for an Obi-wan Kenobi (his favorite Jedi)!","teachingVideoPlaybackId":null,"teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Philosophy","deepDives":[],"active":true,"profilePhotos":["https://ucarecdn.com/4f029523-5177-42fd-85e9-24261e823a68/-/crop/456x456/82,0/-/preview/-/format/jpg/"],"pronouns":null,"gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"530942b1-bf63-4abb-9be7-461bff202998\"}"}],"hiredAt":"2022-10-18T22:24:21.000Z","topics":["Literature","Writing","History Project","Philosophy","Latin","History"],"communityBadges":[],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"jack-mckinnon\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"fefb585c-0a99-4fc3-b32f-e65402e0d033\"}"}}},"_sentr
