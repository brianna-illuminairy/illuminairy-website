xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}":{"__typename":"Question","uuid":"70585130-aac8-4090-a3b0-63a561772f1d","question":"What is your dream job?"},"DeepDives:{\"uuid\":\"c9ed57d4-c2b1-41ad-981c-d5e0ec7df2f7\"}":{"__typename":"DeepDives","uuid":"c9ed57d4-c2b1-41ad-981c-d5e0ec7df2f7","content":"\u003cp\u003eMy dream job is to write \u0026amp; act in a show or movie that blends drama with deep philosophical underpinnings, like the triumph and tragedy of literature and poetry in Dead Poet's Society or the Machiavellian instincts in Peaky Blinders. I really want to blend performance with philosophy.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"70585130-aac8-4090-a3b0-63a561772f1d\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"98a82f83-9baa-4faa-97ce-bee649bec1cb\"}":{"__typename":"DeepDives","uuid":"98a82f83-9baa-4faa-97ce-bee649bec1cb","content":"\u003cp\u003eDo what you love. It's cliche, but nothing is more important. If you do what you love and work hard enough at it, success will eventually come. Every moment is valuable--Don't waste your free time on an extracurricular or anything else that doesn't truly spark something in you. Find what you can lose track of time doing, what you enter the flow state doing, and do that. Do, do, do. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"39e91a5d-bb86-440c-92c9-c587327e0c29\"}":{"__typename":"DeepDives","uuid":"39e91a5d-bb86-440c-92c9-c587327e0c29","content":"\u003cp\u003eMentorship can make or break an activity. My brother has been a mentor to me all my life, in debate, in school, and socially. To me, a mentor should be like a brother: Someone you trust, knows your style well, and is excited FOR you. That's what I plan to be. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"23e9efc6-d3d0-4fa4-a5ce-8ef1ad2c0c88\"}":{"__typename":"DeepDives","uuid":"23e9efc6-d3d0-4fa4-a5ce-8ef1ad2c0c88","content":"\u003cp\u003eWithin History, I study the evolution of ideas, social movements, and political theories. I love this pursuit because it teaches me about human nature. What works. What fails. I want to know how to act justly if I one day lead a community, and there's nothing I find more compelling than studying the human condition, whether that be triumphant or tragic. I'm overwhelmed by the beauty and complexity of the stories of the past.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"School:{\"uuid\":\"1a2fe0a5-2fc1-48e9-95ce-2680bdd8386b\"}":{"__typename":"School","uuid":"1a2fe0a5-2fc1-48e9-95ce-2680bdd8386b","name":"Myers Park High School","city":"Charlotte","type":"HIGH","state":"North Carolina","country":"United States","zip":"28209"},"Education:{\"uuid\":\"d24a8be9-1aef-4041-b531-e0ee9a43d1ef\"}":{"__typename":"Education","uuid":"d24a8be9-1aef-4041-b531-e0ee9a43d1ef","school":{"__ref":"School:{\"uuid\":\"1a2fe0a5-2fc1-48e9-95ce-2680bdd8386b\"}"},"startYear":"2020","endYear":"2024","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}":{"__typename":"School","uuid":"e537660d-3a33-45e4-b94a-0cbceed91930","name":"Yale University","city":"New Haven","type":"COLLEGE","state":"Connecticut","country":"United States","zip":"06520"},"Education:{\"uuid\":\"f28bb98b-ad7e-4949-ad09-60f93644db4e\"}":{"__typename":"Education","uuid":"f28bb98b-ad7e-4949-ad09-60f93644db4e","school":{"__ref":"School:{\"uuid\":\"e537660d-3a33-45e4-b94a-0cbceed91930\"}"},"startYear":"2024","endYear":null,"expectedGradYear":"2028","major":"History","degree":null},"MentorPublicProfile:{\"uuid\":\"005c595a-ed69-4063-bf48-2a9fb5c1f5ef\"}":{"__typename":"MentorPublicProfile","uuid":"005c595a-ed69-4063-bf48-2a9fb5c1f5ef","displayName":"Gil A.","slug":"gil-altman","biography":"\u003cp\u003eHello! My name's Gil, and I'm from Charlotte, North Carolina. I'm currently studying at Yale, and my primary interests are philosophy, history, and political theory. I'm a part of the Yale Political Union, where I love engaging in debates and staying up until the early hours of the morning with my party every Thursday night to grapple with everything from Kantian metaphysics to tear-jerking poetry. I've also been involved in theater on campus, and I recently co-edited a magazine on philosophy, poetry, and politics. I love words, narratives, and ideas, which is why I am so engrossed in the humanities. In high school, I spent all of my extracurricular energy on competitive debate, where I got to practice and hone the powers of rhetoric and ideas. With Curious Cardinals, my goal is to help students bolster their writing, whether for college essays, school assignments, debate cases, or passion projects. I'm also excited to help students with public speaking and performing, I find that debate and politics intersect with theater and performance more than most people might suspect. I'm very qualified: I was accepted early to Yale and other top colleges, and was the State Champion of North Carolina debate. But, more important than anything I've said above, I am a very excited person. I'd like to think of myself as gregarious and passionate, and I plan to bring that to every meeting!\u003c/p\u003e","teachingVideoPlaybackId":"4hpZ3Qdw32xeJIjb02N18pwE2KbIHxhD01F9sccqw00qR8","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eAs I'm sure you can tell from my profile, I love debate. But not just because it's fun, because it creates real goodness in the world. It sharpens the mind and bolsters passion for solving global issues, while simultaneously training public speaking and self-advocacy. My proudest moment comes from debate, but not winning a competition--during a high school summer program, I met a friend from Iraq who I would stay up late with every night exchanging stories. Together, we decided that we wanted to bring a debate program to Baghdad (the first of its kind), because the importance of advocacy and critical thinking extends to every student in the world. \u003c/p\u003e","favorites":[],"causesSupported":[],"major":"History","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"c9ed57d4-c2b1-41ad-981c-d5e0ec7df2f7\"}"},{"__ref":"DeepDives:{\"uuid\":\"98a82f83-9baa-4faa-97ce-bee649bec1cb\"}"},{"__ref":"DeepDives:{\"uuid\":\"39e91a5d-bb86-440c-92c9-c587327e0c29\"}"},{"__ref":"DeepDives:{\"uuid\":\"23e9efc6-d3d0-4fa4-a5ce-8ef1ad2c0c88\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/b244ad1f-6abe-4250-9f36-69440276a0c3/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"d24a8be9-1aef-4041-b531-e0ee9a43d1ef\"}"},{"__ref":"Education:{\"uuid\":\"f28bb98b-ad7e-4949-ad09-60f93644db4e\"}"}],"hiredAt":"2025-04-09T19:08:40.384Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","6-8 Grade Science","Physics","Writing","Academic Coaching","Executive Function","College Essay Writing","Reading","History","K-6 Storybook","Creative Writing","History Project","Film / Theater","STEM Project","Law / Government / Policy","Journalism","Debate","Public Speaking","Sustainability"],"communityBadges":["https://ucarecdn.com/c285fbf9-8602-47f9-903e-cfa8ea2c777e/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"gil-altman\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"005c595a-ed69-4063-bf48-2a9fb5c1f5ef\"}"}}},"_sentryTraceData":"4320b4542e3c494bb1ad10d21b3eed43-a390efc9c3df662f-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=4320b4542e3c494bb1ad10d21b3eed43,sentry-sample_rate=0.2,sentry-transaction=%2Fmentors%2F%5Bslug%5D,sentry-sampled=false"},"__N_SSP":true},"page":"/mentors/[slug]","query":{"slug":"gil-altman"},"buildId":"ZAcrs1hPe6xcPEuk-Y5L_","isFallback":false,"gssp":true,"scriptLoader":[{"id":"marketing-google-tag-manager","strategy":"afterInteractive","dangerouslySetInnerHTML":{"__html":"\n          (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'\u0026l='+l:'';j.async=true;j.src=\n'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-5792Z7P');\n          "}}]}</script><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5792Z7P" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript></body></html>
