xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"40cd4703-0658-4650-bea0-3a902485b32b\"}":{"__typename":"Favorites","uuid":"40cd4703-0658-4650-bea0-3a902485b32b","photoUrl":"https://ucarecdn.com/695fce5a-6b97-430c-830b-fc922a6550dc/","title":"Christopher Lee","type":"ACTOR"},"Favorites:{\"uuid\":\"68c9d06a-3113-4d6b-b860-970fc8b2e2d9\"}":{"__typename":"Favorites","uuid":"68c9d06a-3113-4d6b-b860-970fc8b2e2d9","photoUrl":"https://ucarecdn.com/c0a5b186-aca5-4fbb-b4b6-1035428a6b17/","title":"Edinburgh","type":"CITY"},"Favorites:{\"uuid\":\"b98e6428-0ac0-45d5-93c6-e41c745a56f8\"}":{"__typename":"Favorites","uuid":"b98e6428-0ac0-45d5-93c6-e41c745a56f8","photoUrl":"https://ucarecdn.com/e902d15d-a24e-4dab-961f-8cc0c90892d7/","title":"The Master and Margarita","type":"BOOK"},"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}":{"__typename":"Question","uuid":"09c88a99-d864-46ef-813b-ce5e96c22bc6","question":"What is a passion project you’re working on or have created in the past?"},"DeepDives:{\"uuid\":\"f68064ff-65a5-43c9-86d2-2705cf3862ab\"}":{"__typename":"DeepDives","uuid":"f68064ff-65a5-43c9-86d2-2705cf3862ab","content":"\u003cp\u003eDuring my time at college studying languages, I began to realize the importance of cultural intelligence alongside traditional and emotional intelligence. For young people, developing the ability to navigate diverse perspectives is no longer just an advantage — it is a necessity. By fostering empathy and dismantling stereotypes, cultural exchange programs equip the next generation to collaborate across borders. This goes beyond simple awareness; it’s about active adaptation and respect. To address this issue, I founded One Scotland, a non-profit developing mutual understanding through cultural exchange. Within a year of founding it with a group of 4 college friends, we had a team of over 100, engaging with thousands of students across Scotland.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"09c88a99-d864-46ef-813b-ce5e96c22bc6\"}"}},"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}":{"__typename":"Question","uuid":"65e19cc4-dae4-4fd0-8168-e8772e0abe4a","question":"Why did you choose your major?"},"DeepDives:{\"uuid\":\"2bf8ba51-931f-4ab6-b2f5-c341e76faaf1\"}":{"__typename":"DeepDives","uuid":"2bf8ba51-931f-4ab6-b2f5-c341e76faaf1","content":"\u003cp\u003eI've been fascinated by China for almost as long as I can remember. The culture, the history, the writing - it's complex and, at first, seems totally alien compared with the West. My goal was to understand China but to do that required knowledge of the language. As a history geek, I also love understanding how civilizations connect with each other. Russia isn't only China largest neighbor, it's a country that has shaped world history and ideology, producing some of the greatest works of writing. This is what initially led me to pursue a degree in Chinese and Russian at the University of Edinburgh.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"65e19cc4-dae4-4fd0-8168-e8772e0abe4a\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"b34050fd-c928-40e9-8284-ef0f0c2da6c1\"}":{"__typename":"DeepDives","uuid":"b34050fd-c928-40e9-8284-ef0f0c2da6c1","content":"\u003cp\u003ePolitics matters. It is the mechanism by which we negotiate our shared reality. It dictates the quality of our education, the accessibility of healthcare, and the protection of our fundamental rights. When we engage, we help shape the laws and values that define our society’s future and collective well-being. One day, I would like to hold elected office.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"f7d3e90e-14d7-48a5-982b-ac364efa99de\"}":{"__typename":"DeepDives","uuid":"f7d3e90e-14d7-48a5-982b-ac364efa99de","content":"\u003cp\u003eDon't be afraid to dream big and stand apart from the crowd. Conformity is the safe and easy choice at school; doing anything that makes you seem 'different' can be an isolating experience. However, in the end, only those who think differently and aren't afraid to stand by their ambitions will change the world.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"33916082-101a-4b5e-8ae6-a24cad8dc7ec\"}":{"__typename":"School","uuid":"33916082-101a-4b5e-8ae6-a24cad8dc7ec","name":"University of Edinburgh","city":"Edinburgh","type":"HIGH","state":"Scotland","country":"United Kingdom","zip":"EH8 9YL"},"Education:{\"uuid\":\"4b841047-f6a4-4a73-b824-4b10f337bac9\"}":{"__typename":"Education","uuid":"4b841047-f6a4-4a73-b824-4b10f337bac9","school":{"__ref":"School:{\"uuid\":\"33916082-101a-4b5e-8ae6-a24cad8dc7ec\"}"},"startYear":"2018","endYear":"2023","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"768526e6-00be-4bee-beff-afd735311f3f\"}":{"__typename":"School","uuid":"768526e6-00be-4bee-beff-afd735311f3f","name":"Tsinghua University - Schwarzman Scholars","city":"Beijing","type":"COLLEGE","state":"Beijing","country":"China","zip":"100190"},"Education:{\"uuid\":\"a043d8f4-f5ea-4669-9c44-9a99bb0f0f52\"}":{"__typename":"Education","uuid":"a043d8f4-f5ea-4669-9c44-9a99bb0f0f52","school":{"__ref":"School:{\"uuid\":\"768526e6-00be-4bee-beff-afd735311f3f\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2024","major":"Schwarzman Scholars","degree":null},"MentorPublicProfile:{\"uuid\":\"da720a93-83ef-4a8d-984f-76385befa4d5\"}":{"__typename":"MentorPublicProfile","uuid":"da720a93-83ef-4a8d-984f-76385befa4d5","displayName":"Maximillian B.","slug":"maximillian-browning","biography":"\u003cp\u003eHi! I'm Max, a recent graduate Schwarzman Scholar, and I'm looking forward to becoming your mentor. As a mentor, I love helping young leaders realize their potential, turning ambition into reality. My hope is that I can help you avoid some of the mistakes I made, support you in discovering what motivates and fulfils you, and be a sounding board for your most ambitious goals. Together, we will navigate your passion project – be it founding an organization, building a digital product, or conducting groundbreaking research. I’m here to help you bridge the gap between \"what if\" and \"what’s next.\"\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eMy academic background\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eWellington College, United Kingdom - A Levels\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eThe University of Edinburgh, United Kingdom - Double First Class Honors in Chinese \u0026amp; Russian\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eThe University of Edinburgh, United Kingdom - Masters in East Asian Relations\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eTsinghua University - Schwarzman Scholars, China - Masters in Global Affairs\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cstrong\u003eWhy I'm qualified to help\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eAt college, I was fortunate to have mentors help me realize my own passion projects. I founded a non-profit organization and grew it to over 100 team members in 4 cities, learning along the way how to sell a vision and build processes. I have worked with politicians and diplomats to create working groups in parliament; have gained an understanding of good governance by serving on boards; and mentored young leaders for over 5 years. I specialize in identifying young people's strengths and help them hone the skills they need to achieve their goals.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA typical session with me might involve:\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eStrategic Roadmapping: Breaking down your \"big picture\" vision into actionable weekly sprints, ensuring you have a clear path from your initial idea to a scalable reality.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eNarrative Building: Refining how you communicate your project to the world, so that others are as invested in your vision as you are.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eHigh-Level Problem Solving: Acting as a confidential sounding board for the roadblocks you hit, using my experience to help you navigate complex stakeholders and professional environments.\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eStrength Alignment: Identifying the specific skills you need to sharpen — be it public speaking, technical writing, or project management — and finding real-world ways to practice them within your project.\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn 2023, I won the Schwarzman Scholarship, one of the most competitive and prestigious post-graduate academic scholarships in the world. If you're looking to work on your resume and prepare for scholarship or job applications, I'm here to help.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eHow can I help\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"list-disc list-inside\"\u003e\u003cli\u003e\u003cp\u003eCollege-readiness projects (research experiences, portfolios, resumes)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePassion projects (starting a club or non-profit; designing a digital product; campaigns)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003eResearch mentorship (learning about the research process, designing and running projects, presenting your findings with confidence)\u003c/p\u003e\u003c/li\u003e\u003cli\u003e\u003cp\u003ePublic speaking\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/li\u003e\u003c/ul\u003e","teachingVideoPlaybackId":"fnmgp7lXHCV6WsZCAf64dy7Mlp02bbM4Bn00Bx8jXE02Cc","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[{"__ref":"Favorites:{\"uuid\":\"40cd4703-0658-4650-bea0-3a902485b32b\"}"},{"__ref":"Favorites:{\"uuid\":\"68c9d06a-3113-4d6b-b860-970fc8b2e2d9\"}"},{"__ref":"Favorites:{\"uuid\":\"b98e6428-0ac0-45d5-93c6-e41c745a56f8\"}"}],"causesSupported":[],"major":"Schwarzman Scholars","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"f68064ff-65a5-43c9-86d2-2705cf3862ab\"}"},{"__ref":"DeepDives:{\"uuid\":\"2bf8ba51-931f-4ab6-b2f5-c341e76faaf1\"}"},{"__ref":"DeepDives:{\"uuid\":\"b34050fd-c928-40e9-8284-ef0f0c2da6c1\"}"},{"__ref":"DeepDives:{\"uuid\":\"f7d3e90e-14d7-48a5-982b-ac364efa99de\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/f36c54b4-16ec-418a-b1c1-b9fb2919fad1/-/preview/-/format/jpg/","https://ucarecdn.com/c7974af3-0639-4344-9edf-0c1917818e14/-/preview/-/format/jpg/","https://ucarecdn.com/1801b8be-073c-4e9e-90a2-bc5f87746bcc/-/preview/-/format/jpg/"],"pronouns":"HE_HIM","gender":"MALE","education":[{"__ref":"Education:{\"uuid\":\"4b841047-f6a4-4a73-b824-4b10f337bac9\"}"},{"__ref":"Education:{\"uuid\":\"a043d8f4-f5ea-4669-9c44-9a99bb0f0f52\"}"}],"hiredAt":"2026-01-21T16:04:22.149Z","topics":["Writing","French","Mandarin Chinese","German","Executive Function","College Essay Writing","Reading","History","Academi
