xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"52cc5ac9-6ae8-43ea-9fb6-a9a26c819173\"}":{"__typename":"DeepDives","uuid":"52cc5ac9-6ae8-43ea-9fb6-a9a26c819173","content":"\u003cp\u003eFirst, make sure to take a deep breath. Everything will work out. Secondly, make sure you set a variety of goals, to give yourself something tangible to work towards. Whether it is running in a 5k before graduation, being accepted to a certain university or learning a new song on the guitar, these goals will help you keep yourself accountable and set action plans in order to work towards their achievement. \u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"School:{\"uuid\":\"46500400-7719-4f26-bea2-9e0c9c085f75\"}":{"__typename":"School","uuid":"46500400-7719-4f26-bea2-9e0c9c085f75","name":"Cherry Hill West High School","city":"Cherry Hill Township","type":"HIGH","state":"New Jersey","country":"United States","zip":"08002"},"Education:{\"uuid\":\"effb9765-95ab-430d-b1d5-3a0257adc809\"}":{"__typename":"Education","uuid":"effb9765-95ab-430d-b1d5-3a0257adc809","school":{"__ref":"School:{\"uuid\":\"46500400-7719-4f26-bea2-9e0c9c085f75\"}"},"startYear":"2018","endYear":"2022","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}":{"__typename":"School","uuid":"734c941e-3779-40ef-bba8-8a785177d30f","name":"Columbia University","city":"New York","type":"COLLEGE","state":"New York","country":"United States","zip":"10027"},"Education:{\"uuid\":\"81c81d69-cbee-42bf-b821-a7d7050c4acc\"}":{"__typename":"Education","uuid":"81c81d69-cbee-42bf-b821-a7d7050c4acc","school":{"__ref":"School:{\"uuid\":\"734c941e-3779-40ef-bba8-8a785177d30f\"}"},"startYear":"2022","endYear":null,"expectedGradYear":"2026","major":"Political Science \u0026 Human Rights","degree":null},"MentorPublicProfile:{\"uuid\":\"36282c5e-1c53-4d93-af2d-4146c402ffd1\"}":{"__typename":"MentorPublicProfile","uuid":"36282c5e-1c53-4d93-af2d-4146c402ffd1","displayName":"Aziza B.","slug":"aziza-ben","biography":"\u003cp\u003eI am a graduating dual-degree student at Columbia University and Sciences Po, where I majored in Human Rights and Political Science with a concentration in international relations. My academic and professional experiences have been guided by a deep commitment to social justice, intellectual curiosity, and a belief in the transformative power of education. Through studying across multiple countries and working in diverse professional settings, I have developed not only a broad global perspective, but also the research, writing, and analytical skills that I hope to help others cultivate in their own academic journeys.\u003c/p\u003e\u003cp\u003eOver the course of my studies, I have worked with immigrant communities in Philadelphia, advocated for refugees at the French-Italian border, supported sustainable development initiatives in Tunisia, and conducted field research in Jordan on digital preservation and traditional art as a Babel Research Fellow. These experiences allowed me to connect classroom learning with real-world practice while strengthening my ability to communicate complex ideas clearly—whether through policy writing, research memoranda, advocacy materials, or long-form academic work. I have become a particularly strong writer through my training in the social sciences, where close reading, persuasive argumentation, interdisciplinary thinking, and rigorous research have been central to my education. Those skills have shaped how I approach both scholarship and mentorship: with curiosity, structure, and a collaborative spirit.\u003c/p\u003e\u003cp\u003eAt Columbia, I have continued to build on these strengths through research roles in business and human rights, international development coursework, and leadership positions focused on foreign policy research and public service. I will be attending law school this fall, where I hope to continue developing the advocacy, writing, and analytical skills that have defined my academic path.\u003c/p\u003e\u003cp\u003eOutside of academics, I love traveling, reading historical fiction, baking macarons, and mountain biking—interests that remind me of the importance of creativity, balance, and pursuing passions beyond the classroom. I look forward to sharing my experiences with students and helping them strengthen their academic confidence, refine their writing, and pursue projects that excite and inspire them. I am especially passionate about helping students identify their strengths, translate ideas into meaningful work, and pursue ambitious goals with confidence. Excited to meet you!\u003c/p\u003e\u003cbr\u003e","teachingVideoPlaybackId":"ax1r2o02ljjztc4ieK5spB01wZgfUj7SPs02MeY005OkHqw","teachingVideoDescription":null,"greatestAchievement":null,"favorites":[],"causesSupported":[],"major":"Political Science \u0026 Human Rights","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"52cc5ac9-6ae8-43ea-9fb6-a9a26c819173\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/d4700af7-9d75-40e8-bf0c-47b3cec37e57/-/preview/-/format/jpg/","https://ucarecdn.com/cd06e567-d358-49a4-8f4a-1cf297582e79/-/preview/-/format/jpg/","https://ucarecdn.com/be367ec3-3b1a-4665-9f87-39ae08fcfb14/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"effb9765-95ab-430d-b1d5-3a0257adc809\"}"},{"__ref":"Education:{\"uuid\":\"81c81d69-cbee-42bf-b821-a7d7050c4acc\"}"}],"hiredAt":"2026-04-22T21:36:10.370Z","
