xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"dc31f2d5-2b62-46ca-b753-b9d3f241b6f8\"}":{"__typename":"Favorites","uuid":"dc31f2d5-2b62-46ca-b753-b9d3f241b6f8","photoUrl":"https://ucarecdn.com/16b0645c-3f16-4855-86e7-66017f4aa531/","title":"Mamma Mia!","type":"MOVIE"},"Favorites:{\"uuid\":\"7d8fb5cc-e925-4a83-baf8-08cedf84ce44\"}":{"__typename":"Favorites","uuid":"7d8fb5cc-e925-4a83-baf8-08cedf84ce44","photoUrl":"https://ucarecdn.com/cd770918-737a-410b-adcc-a07ae256f1b3/","title":"Tennis","type":"SPORT"},"CausesSupported:{\"uuid\":\"5bdb9a1f-9d63-4ef2-9622-24ef6ae41e09\"}":{"__typename":"CausesSupported","uuid":"5bdb9a1f-9d63-4ef2-9622-24ef6ae41e09","name":"Seeds of Peace","description":"\u003cp\u003eSeeds brings together Israelis, Palestinians, and Americans for peacebuilding.\u003c/p\u003e","photoUrl":""},"CausesSupported:{\"uuid\":\"fd492819-55c9-4a3b-b0d3-589ef5b3de4c\"}":{"__typename":"CausesSupported","uuid":"fd492819-55c9-4a3b-b0d3-589ef5b3de4c","name":"LifeMoves","description":"\u003cp\u003eI worked as a tutor and counselor for kids experiencing homelessness\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}":{"__typename":"Question","uuid":"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f","question":"What do you like to do in your spare time?"},"DeepDives:{\"uuid\":\"707e39ad-8dbb-478a-a62e-7be0f2b48eb0\"}":{"__typename":"DeepDives","uuid":"707e39ad-8dbb-478a-a62e-7be0f2b48eb0","content":"\u003cp\u003eI LOVE anything that involves some fresh air and a little adrenaline. My favorites are skiing and white water rafting but I've been recently trying to learn how to surf.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9a95bdf5-fab9-4a45-9e85-0c9036f5f96f\"}"}},"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}":{"__typename":"Question","uuid":"b6676224-31b5-479b-905c-fdc6b644c3e6","question":"What is something you are extremely proud of?"},"DeepDives:{\"uuid\":\"6b835a27-abd4-4ae6-8ead-9a43fb41b1d5\"}":{"__typename":"DeepDives","uuid":"6b835a27-abd4-4ae6-8ead-9a43fb41b1d5","content":"\u003cp\u003eI'm so proud of my dance team, the Stanford Bhangra team. Most members (including me) started off with no dance experience at all but over the course of 4 years and hundreds of hours together in the dance studio they became not only my best friends but one of the top collegiate teams in the country!\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"b6676224-31b5-479b-905c-fdc6b644c3e6\"}"}},"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}":{"__typename":"Question","uuid":"f5fd9fba-5814-491b-ab25-77e40cfc15de","question":"How did you spend your summers in high school?"},"DeepDives:{\"uuid\":\"747590e0-12f5-40f0-8d70-69d2c6c1e0e5\"}":{"__typename":"DeepDives","uuid":"747590e0-12f5-40f0-8d70-69d2c6c1e0e5","content":"\u003cp\u003eSummers were my favorite time to make new friends from across the world and pursue my love of languages!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe summer after my freshman year, I got a scholarship from the State Department (NSLI-Y) that sponsored me to spend the summer in Jordan, living with a host family and taking intensive Arabic classes.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy time in the Middle East sparked my curiosity and the next summer I participated in Seeds of Peace, a summer camp that brings together Israelis, Palestinians, Egyptians, Jordanians and Americans to live together, play sports together, develop enduring friendships and also have two hours of daily dialogue about the Arab-Israeli conflict.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe summer after my junior year I participated in the Telluride Association Summer Program (TASP) and made incredible friendships while diving deep into Proust, Woolf, Paradise Lost and more and living in a self-governed house.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"f5fd9fba-5814-491b-ab25-77e40cfc15de\"}"}},"School:{\"uuid\":\"45dab8e2-7adb-453b-bf30-046e232b37dd\"}":{"__typename":"School","uuid":"45dab8e2-7adb-453b-bf30-046e232b37dd","name":"Urban School of San Francisco","city":"San Francisco","type":"HIGH","state":"California","country":"United States","zip":"94117"},"Education:{\"uuid\":\"669abc0f-9614-47b4-91d7-8ba9cf69b563\"}":{"__typename":"Education","uuid":"669abc0f-9614-47b4-91d7-8ba9cf69b563","school":{"__ref":"School:{\"uuid\":\"45dab8e2-7adb-453b-bf30-046e232b37dd\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}":{"__typename":"School","uuid":"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73","name":"Stanford University","city":"Stanford","type":"COLLEGE","state":"California","country":"United States","zip":"94305"},"Education:{\"uuid\":\"d32f9797-3006-4728-9c30-761071bd8a89\"}":{"__typename":"Education","uuid":"d32f9797-3006-4728-9c30-761071bd8a89","school":{"__ref":"School:{\"uuid\":\"2cd6fe96-2a08-4e99-8505-7ce8e10a8b73\"}"},"startYear":"2020","endYear":null,"expectedGradYear":"2024","major":"Political Science, Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"d1f9a0c4-104c-472b-bd82-938e05eea290\"}":{"__typename":"MentorPublicProfile","uuid":"d1f9a0c4-104c-472b-bd82-938e05eea290","displayName":"Sophia V.","slug":"sophia-vahanvaty","biography":"\u003cp\u003eHi! I’m Sophia, a journalist and recent Stanford grad, and I can’t wait to help your child grow and succeed! I’ve always been passionate about storytelling, and my most recent role as a health reporter at Bloomberg News let me dive into that love. My dream is to become a foreign correspondent, reporting from the Middle East or Latin America.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’ve worked with students of all ages, and love helping my mentees learn and explore new topics. I spent a summer in Ecuador leading high school students from the U.S. and Ecuador on amazing 3-week programs with Amigos de las Americas, where we tackled big issues like food security and indigenous rights in the Andes. I also ran the Photojournalism program at Camp Alleghany for Girls in West Virginia, where creativity and storytelling took center stage.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAt Stanford, I studied Political Science and Data Science, focusing on international security and digging into the power of numbers to understand the world better. I love helping students who are curious about politics, foreign affairs, or journalism break down complex topics using data and make sense of computer science and analysis—subjects that don’t have to be intimidating!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen I’m not diving into research or mentoring, you’ll find me dancing! I co-captained Stanford’s Bhangra (Punjabi dance) team and was proud to lead us to a third-place finish at a national competition. I’m also a huge fan of language learning, and I’ve been lucky enough to immerse myself in Arabic and Spanish while studying and working in places like Jordan, Uruguay, the UAE, and Ecuador.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI also love skiing, playing spikeball, building up my very beginner surfing skills, cooking Mexican food, and eating so much frozen yogurt!!\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI’m so excited to bring all of these experiences together and work with your child to help them reach their full potential!\u003c/p\u003e","teachingVideoPlaybackId":"5Vt4UcdwCLNUuOfR7LrWXTdb2Haw026ddOxV7uYY9pV8","teachingVi
