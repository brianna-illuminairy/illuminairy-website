xcPEuk-Y5L_/_buildManifest.js" defer=""></script><script src="../_next/static/ZAcrs1hPe6xcPEuk-Y5L_/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"__APOLLO_STATE__":{"Favorites:{\"uuid\":\"f9e97be3-31f8-4474-aec5-d1c7f2077335\"}":{"__typename":"Favorites","uuid":"f9e97be3-31f8-4474-aec5-d1c7f2077335","photoUrl":"https://ucarecdn.com/afb7d197-f9a2-4a97-802a-b7d40729c4ff/","title":"Eagles!","type":"SPORTS_TEAM"},"Favorites:{\"uuid\":\"db8b508d-fa9b-4ed1-87f9-37c974487a4b\"}":{"__typename":"Favorites","uuid":"db8b508d-fa9b-4ed1-87f9-37c974487a4b","photoUrl":"https://ucarecdn.com/3e86befb-1a21-4517-8bc4-feb0c8caf2e3/","title":"Interstellar","type":"MOVIE"},"Favorites:{\"uuid\":\"b2e6051e-52fe-4987-bae1-0ff3f80c1f98\"}":{"__typename":"Favorites","uuid":"b2e6051e-52fe-4987-bae1-0ff3f80c1f98","photoUrl":"https://ucarecdn.com/efbd5a51-925b-4e4a-992b-628bf60565e7/","title":"Percy Jackson and The Lightning Thief","type":"BOOK"},"CausesSupported:{\"uuid\":\"9af6b030-4bc9-43e1-bfea-b2664637f986\"}":{"__typename":"CausesSupported","uuid":"9af6b030-4bc9-43e1-bfea-b2664637f986","name":"Girl Up Club","description":"\u003cp\u003eI help empower girls to lead, advocate, and create global change together!\u003c/p\u003e","photoUrl":""},"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}":{"__typename":"Question","uuid":"9d1749df-49d5-4aad-99b8-0d8dac1c39f9","question":"Why does mentorship matter to you?"},"DeepDives:{\"uuid\":\"5ee54eec-7902-4215-85fa-4a5ec3830918\"}":{"__typename":"DeepDives","uuid":"5ee54eec-7902-4215-85fa-4a5ec3830918","content":"\u003cp\u003eMentorship matters to me because it’s one of the most powerful tools for growth—both academically and personally. I’ve been fortunate to have incredible mentors throughout my life who not only helped me succeed in school or career decisions, but also made me feel heard, challenged, and supported. Their belief in me during moments of doubt, and their willingness to guide me through complex decisions, fundamentally shaped the way I see myself and my potential. It’s something I now try to give back through every mentoring opportunity I take on.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eDuring high school, I founded a tutoring organization because I wanted younger students to experience that same feeling of support and confidence. Later, as a teaching assistant in both undergrad and grad school, I realized that mentorship is about so much more than explaining concepts—it’s about helping someone see possibilities they hadn’t considered and building the confidence to chase them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhat makes mentorship so special to me is the human connection. It’s not a transaction—it’s a relationship that’s rooted in trust, encouragement, and growth. It’s about helping students feel like they’re not alone when things get hard, and also being there to celebrate their wins. As someone who’s always juggled academics, leadership roles, and creative projects, I know how overwhelming school and life can feel. I want to be the kind of mentor who helps students break things down, think clearly, and move forward with confidence.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’m especially drawn to mentorship because I love helping students discover what they’re passionate about—even if they don’t know yet. Some of the most meaningful mentoring moments I’ve had weren’t about solving a problem on paper, but about asking the right question that sparked a student’s interest or gave them clarity. That moment when someone says, “Wait… I think I actually love this,” is what keeps me coming back to mentorship.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eUltimately, mentorship is about building someone up—not just academically, but as a thinker, a leader, and a person. It’s about creating space for someone to grow into their full potential, and that’s something I’ll always be passionate about.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9d1749df-49d5-4aad-99b8-0d8dac1c39f9\"}"}},"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}":{"__typename":"Question","uuid":"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4","question":"What advice would you give your middle or high school self?"},"DeepDives:{\"uuid\":\"658ef8b9-02cf-414b-88b1-e55219573c0a\"}":{"__typename":"DeepDives","uuid":"658ef8b9-02cf-414b-88b1-e55219573c0a","content":"\u003cp\u003eIf I could give my middle or high school self advice, it would be this: you don’t need to have everything figured out to take the first step. I remember thinking that unless I knew exactly what I wanted to do with my life, I couldn’t commit to anything. I was always trying to plan the perfect path—what classes to take, what clubs to join, what my “thing” would be. But looking back, the most meaningful opportunities didn’t come from having a perfectly mapped-out plan. They came from being curious, trying something that scared me a little, and trusting that even if I didn’t have the end goal in sight, I was still learning something valuable. I’d tell myself to stop waiting for the moment when everything feels certain—it rarely does—and instead start exploring things that spark even a little bit of excitement.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’d also tell my younger self that you don’t have to do it all alone. I used to sometimes think that asking for help meant I wasn’t doing enough or wasn’t smart enough to figure it out on my own. But the truth is, some of the biggest breakthroughs I’ve had—personally, academically, and professionally—came from conversations with people who saw things from a different angle or who reminded me that it was okay to be stuck. I’ve learned that there’s a huge difference between independence and isolation. Asking questions, reaching out, and even admitting when you’re overwhelmed aren’t signs of weakness—they’re signs of growth. I’d remind my younger self that some of the most successful people are the ones who surround themselves with good people and lean into that support.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAnd above all, I’d tell myself to trust the process. The person you’ll become is not someone you can fully imagine right now, and that’s okay. There’s so much pressure in school to have it all figured out by a certain age—but life doesn’t work like that. Passions evolve, goals shift, and the experiences that shape you often happen in unexpected ways. You’re allowed to explore, to change directions, to grow out of one version of yourself and into another. Every decision you make, even the small ones, teaches you something. So be kind to yourself. Stay open, stay curious, and know that you’re on the right track—even when it doesn’t feel like it yet.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"1a5d57e8-584e-41c5-a3a0-f21d1bebe9b4\"}"}},"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}":{"__typename":"Question","uuid":"9900d580-4635-440e-b125-8ac6e01dd6b6","question":"What is one thing you hope to accomplish in your lifetime?"},"DeepDives:{\"uuid\":\"3ffee06e-2172-46ce-b83c-54f061af877d\"}":{"__typename":"DeepDives","uuid":"3ffee06e-2172-46ce-b83c-54f061af877d","content":"\u003cp\u003eOne thing I hope to accomplish in my lifetime is to make healthcare more accessible, compassionate, and proactive for the people who need it most. I want to use my skills in biomedical engineering and data science not just to invent new technologies, but to create real solutions that change lives—especially for communities who are often left behind by the healthcare system. Whether it's designing a device that makes early diagnosis easier or building tools that help patients feel more in control of their health, I want my work to empower people, not overwhelm them.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBeyond any single invention or project, my broader goal is to help people feel seen and supported in moments that are often filled with fear or uncertainty. I’ve seen firsthand how overwhelming health challenges can be—how confusing devices or data can feel, and how much it matters when someone creates something that actually makes life a little easier. I want to contribute to a future where healthcare feels less clinical and more human, where technology doesn’t replace connection but enhances it, and where people don’t have to fight so hard just to be heard, helped, or healed.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eWhether I do that through launching my own healthtech startup, contributing to global initiatives, or mentoring the next generation of problem solvers, my ultimate hope is to look back and know that my work made a meaningful difference in people’s lives—not just in theory, but in practice. I want to leave behind a legacy of solutions that weren’t just clever, but kind—solutions that made someone feel safer, stronger, or simply less alone.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9900d580-4635-440e-b125-8ac6e01dd6b6\"}"}},"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}":{"__typename":"Question","uuid":"9181ca1f-407a-4684-a269-4fec1b17f398","question":"What’s your greatest source of motivation?"},"DeepDives:{\"uuid\":\"ef809024-b8e1-487d-bb2e-52b0bb723d58\"}":{"__typename":"DeepDives","uuid":"ef809024-b8e1-487d-bb2e-52b0bb723d58","content":"\u003cp\u003eMy greatest source of motivation is the idea that something I create, contribute to, or support could genuinely make someone’s life easier, healthier, or more hopeful. That thought is what keeps me moving, especially when I’m deep in a technical challenge or navigating something uncertain. Whether I’m writing code for a health algorithm, prototyping a new device, or mentoring a student through a difficult decision, I always try to picture the person on the other side—the patient who might benefit, the student who’s learning, the clinician who’s looking for a better tool. That human connection fuels everything I do.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eI’ve always been drawn to the idea that technology, when used thoughtfully, can become a tool for empathy. That’s why I focus so much of my work in healthcare and data science—fields that have the power to directly impact quality of life. Knowing that the time I spend developing a model or solving a problem could lead to an earlier diagnosis, a more accessible device, or a moment of clarity for someone struggling with their health is what pushes me to keep going, even when things get tough.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eBut beyond the work itself, I’m deeply motivated by the people around me—mentors who’ve guided me, peers who’ve challenged me, and students I’ve had the chance to teach. Seeing their passion, resilience, and drive constantly inspires me to stay committed to my own path and to keep showing up for others. Every time I help someone grasp a new concept, unlock a new idea, or feel confident about their future, it reminds me why I care so much about mentorship and education, too.\u003c/p\u003e\u003cbr\u003e\u003cp\u003eAt the end of the day, my motivation doesn’t come from accolades or milestones—it comes from purpose. I want to build things that matter. I want to be part of solutions that improve lives, not just impress on paper. And I want to make people feel seen, heard, and supported—whether that’s through a device I helped develop or a conversation I had that made someone feel less alone. That’s what drives me, and it’s what I hope will continue to guide me throughout everything I do.\u003c/p\u003e","videoPlaybackId":null,"question":{"__ref":"Question:{\"uuid\":\"9181ca1f-407a-4684-a269-4fec1b17f398\"}"}},"School:{\"uuid\":\"adbf2357-0987-4eff-9cb1-f31d808fc948\"}":{"__typename":"School","uuid":"adbf2357-0987-4eff-9cb1-f31d808fc948","name":"North Penn High School","city":"Lansdale","type":"HIGH","state":"Pennsylvania","country":"United States","zip":"19446"},"Education:{\"uuid\":\"07cacddd-9fab-494b-96d2-95d849002452\"}":{"__typename":"Education","uuid":"07cacddd-9fab-494b-96d2-95d849002452","school":{"__ref":"School:{\"uuid\":\"adbf2357-0987-4eff-9cb1-f31d808fc948\"}"},"startYear":"2015","endYear":"2019","expectedGradYear":null,"major":null,"degree":null},"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}":{"__typename":"School","uuid":"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9","name":"Duke University","city":"Durham","type":"COLLEGE","state":"North Carolina","country":"United States","zip":"27708"},"Education:{\"uuid\":\"9c7d48d8-df61-4e7f-aed5-6f8f9234e14e\"}":{"__typename":"Education","uuid":"9c7d48d8-df61-4e7f-aed5-6f8f9234e14e","school":{"__ref":"School:{\"uuid\":\"3e51ec9a-644a-4bc1-b083-c6bdd74de3b9\"}"},"startYear":"2023","endYear":null,"expectedGradYear":"2024","major":"Master's in Biomedical Engineering with a focus on Data Science","degree":null},"MentorPublicProfile:{\"uuid\":\"18eeeb66-81c1-432f-bc66-60b80c17bc2b\"}":{"__typename":"MentorPublicProfile","uuid":"18eeeb66-81c1-432f-bc66-60b80c17bc2b","displayName":"Pushti D.","slug":"pushti-desai","biography":"\u003cp\u003eHi I'm Pushti! I am a recent graduate from Duke University and I would love to be a mentor for you! From a young age, I’ve been fascinated by the intersection of people, technology, and purpose. That curiosity has guided me through my academic journey in biomedical engineering and data science, so I’m very passionate about using that knowledge to mentor the next generation of innovators.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eI earned my undergraduate degree in Biomedical Engineering from Georgia Tech, where I focused on medical device design, coding, and problem-solving in real-world healthcare settings. After that, I graduated from my master’s in Biomedical Data Science at Duke University, where I’ve continued to bridge engineering with patient-centered impact—whether that’s through machine learning models to predict disease progression or prototypes that simplify diagnostics.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMy experiences aren’t limited to the classroom. I’ve interned at leading medtech companies like Medtronic, Abbott, and smaller start-ups where I’ve developed software, built early-stage devices, and contributed to real clinical research. But one of my proudest achievements is inventing a diagnostic tool called the \u003cem\u003eTonsiliscope\u003c/em\u003e, which I prototyped, iterated, and even patented—an experience that taught me the power of identifying a need and building something tangible to meet it. I am now a Scientist II at Boston Scientific, working on a variety of innovative data science and machine learning applications in Diagnostic Cardiac Rhythm Management space with two patents already approved.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIn high school, I was named a National Merit Scholar and was actively involved in a wide range of clubs—from STEM to leadership to volunteering. I know firsthand how overwhelming it can feel to balance academics, extracurriculars, and future planning. That’s why, as a mentor, I care deeply about helping students find balance and confidence while still pursuing what excites them. I love working with students who have big ideas but don’t know where to start—or those who feel stuck and just need someone to ask the right questions.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOne of my favorite parts of high school was founding and leading North Penn Mavens, a peer tutoring organization where I helped students—especially in math and science—develop both confidence and curiosity. Since then, I’ve had the chance to teach and mentor learners of all ages, from elementary schoolers to master’s-level classmates. No matter the age or subject, I always aim to create an environment that’s supportive, personalized, and fun.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhether it’s brainstorming a passion project, building a weekly study plan, diving into a variety of different school subjects, or preparing for college applications, I bring not just academic experience, but genuine empathy for what students are going through. Most of all, I believe students are capable of incredible things when they feel supported—and I’m here to help make that happen.\u003c/p\u003e","teachingVideoPlaybackId":"W00Uli02peJPMQ02lXPkIiFj1JPMEdMFnECNs9CD5vbesI","teachingVideoDescription":null,"greatestAchievement":"\u003cp\u003eOne of the accomplishments I’m most proud of is the work I did during my internship at Boston Scientific, where I developed a novel calibration-agnostic posture detection algorithm and machine learning models to predict heart failure. These weren’t just exciting technical challenges—they were problems the team had been trying to solve for years. Through extensive research, testing, and iteration, I was able to contribute solutions that ultimately led to two patent submissions, both of which were approved. Being an intern and still given the opportunity to lead efforts on such high-impact innovations was incredibly rewarding. It showed me how curiosity, persistence, and a fresh perspective can unlock progress even in areas where others have hit roadblocks. Knowing that my work might one day help patients manage their health more effectively is what motivates me to keep pushing the boundaries of what’s possible in biomedical engineering.\u003c/p\u003e","favorites":[{"__ref":"Favorites:{\"uuid\":\"f9e97be3-31f8-4474-aec5-d1c7f2077335\"}"},{"__ref":"Favorites:{\"uuid\":\"db8b508d-fa9b-4ed1-87f9-37c974487a4b\"}"},{"__ref":"Favorites:{\"uuid\":\"b2e6051e-52fe-4987-bae1-0ff3f80c1f98\"}"}],"causesSupported":[{"__ref":"CausesSupported:{\"uuid\":\"9af6b030-4bc9-43e1-bfea-b2664637f986\"}"}],"major":"Master's in Biomedical Engineering with a focus on Data Science","deepDives":[{"__ref":"DeepDives:{\"uuid\":\"5ee54eec-7902-4215-85fa-4a5ec3830918\"}"},{"__ref":"DeepDives:{\"uuid\":\"658ef8b9-02cf-414b-88b1-e55219573c0a\"}"},{"__ref":"DeepDives:{\"uuid\":\"3ffee06e-2172-46ce-b83c-54f061af877d\"}"},{"__ref":"DeepDives:{\"uuid\":\"ef809024-b8e1-487d-bb2e-52b0bb723d58\"}"}],"active":true,"profilePhotos":["https://ucarecdn.com/3246c664-e071-4694-abf6-9a78f00198d0/-/preview/-/format/jpg/","https://ucarecdn.com/28c53c51-623c-4b93-994c-b5b72247e60f/-/preview/-/format/jpg/","https://ucarecdn.com/145d5768-32f9-411d-99ed-71d1bda3b2d8/-/preview/-/format/jpg/"],"pronouns":"SHE_HER","gender":"FEMALE","education":[{"__ref":"Education:{\"uuid\":\"07cacddd-9fab-494b-96d2-95d849002452\"}"},{"__ref":"Education:{\"uuid\":\"9c7d48d8-df61-4e7f-aed5-6f8f9234e14e\"}"}],"hiredAt":"2025-04-09T18:29:09.751Z","topics":["K-5 Grade Math","Pre-Algebra","Algebra I","Algebra II","Geometry","Precalculus / Trigonometry","Calculus","Statistics","6-8 Grade Science","Biology","Chemistry","Writing","French","Computer Science","Academic Coaching","College Essay Writing","Reading","History","Music","K-6 Storybook","Creative Writing","Business / Entrepreneurship","Coding / Programming","Medicine / Health","Robotics / Electronics / CAD","STEM Project","Machine Learning / AI"],"communityBadges":["https://ucarecdn.com/d93338eb-daf0-436f-802c-0da8b104fe99/","https://ucarecdn.com/113d5871-8410-43cf-8c06-3005496319c6/"],"restrictedProfileVisibility":false,"displayCampaignVisibility":true,"testimonials":[]},"ROOT_QUERY":{"__typename":"Query","mentorPublicProfile({\"input\":{\"slug\":\"pushti-desai\"}})":{"__ref":"MentorPublicProfile:{\"uuid\":\"18eeeb66-81c1-432f-bc66-60b80c17bc2b\"}"}}},"_sentryTraceData":"23a4ed3bb75f4f40a5d664133a836ecf-ae50e36ff963fefe-0","_sentryBaggage":"sentry-environment=vercel-production,sentry-release=5972bb65cb9ae6dacdcc78fb7500dc5ea0ea128e,sentry-public_key=12dc4008513746d38b77e7529cdc588c,sentry-trace_id=23a4ed3bb75f4f40a5d664133a83
